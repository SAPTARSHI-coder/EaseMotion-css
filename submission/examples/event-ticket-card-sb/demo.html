<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Ticket Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="page">
        <section class="ticket-card" aria-label="Event ticket">

            <div class="ticket-main">
                <div class="ticket-header">
                    <span class="event-type">LIVE EVENT</span>
                    <span class="ticket-status">CONFIRMED</span>
                </div>

                <div class="event-content">
                    <p class="event-label">TECH CONFERENCE 2026</p>
                    <h1>Future of Artificial Intelligence</h1>
                    <p class="event-description">
                        Explore emerging AI technologies, practical applications,
                        and the future of intelligent systems.
                    </p>
                </div>

                <div class="event-details">
                    <div class="detail">
                        <span class="detail-icon">◷</span>
                        <div>
                            <span class="detail-label">DATE</span>
                            <strong>24 OCT 2026</strong>
                        </div>
                    </div>

                    <div class="detail">
                        <span class="detail-icon">⌚</span>
                        <div>
                            <span class="detail-label">TIME</span>
                            <strong>10:00 AM</strong>
                        </div>
                    </div>

                    <div class="detail">
                        <span class="detail-icon">⌖</span>
                        <div>
                            <span class="detail-label">VENUE</span>
                            <strong>Hyderabad Convention Hall</strong>
                        </div>
                    </div>
                </div>
            </div>

            <div class="ticket-divider">
                <span class="cutout cutout-top"></span>
                <span class="cutout cutout-bottom"></span>
            </div>

            <aside class="ticket-side">
                <div class="ticket-side-content">
                    <span class="qr-label">ADMIT ONE</span>

                    <div class="qr-code" aria-label="Decorative QR code">
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>

                    <p class="ticket-number">#AI26-0428</p>
                </div>
            </aside>

        </section>
    </main>

</body>
</html>
