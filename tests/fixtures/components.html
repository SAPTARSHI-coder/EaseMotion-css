<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EaseMotion Components for Visual Testing</title>
  <link rel="stylesheet" href="../../easemotion.css">
  <style>
    body {
      padding: 2rem;
      background-color: var(--ease-color-bg, #f8fafc);
      font-family: var(--ease-font-sans, sans-serif);
    }
    .test-section {
      margin-bottom: 2rem;
      padding: 1rem;
      border: 1px dashed #cbd5e1;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <div class="test-section" id="buttons">
    <h2>Buttons</h2>
    <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
      <button class="ease-btn">Default Button</button>
      <button class="ease-btn ease-btn-primary">Primary Button</button>
      <button class="ease-btn ease-btn-secondary">Secondary Button</button>
      <button class="ease-btn ease-btn-danger">Danger Button</button>
      <button class="ease-btn ease-btn-outline">Outline Button</button>
      <button class="ease-btn ease-btn-ghost">Ghost Button</button>
    </div>
  </div>

  <div class="test-section" id="cards">
    <h2>Cards</h2>
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1rem;">
      <div class="ease-card">
        <h3 class="ease-card-title">Default Card</h3>
        <p class="ease-card-subtitle">Basic card layout</p>
        <div class="ease-card-body">This is the body of the card.</div>
      </div>
      
      <div class="ease-card ease-card-hover">
        <h3 class="ease-card-title">Hover Card</h3>
        <p class="ease-card-subtitle">Lifts on hover</p>
        <div class="ease-card-body">Hover over this card to see the animation.</div>
      </div>
      
      <div class="ease-card ease-card-glass">
        <h3 class="ease-card-title">Glass Card</h3>
        <p class="ease-card-subtitle">Glassmorphism</p>
        <div class="ease-card-body">Transparent blurred background.</div>
      </div>
    </div>
  </div>

  <div class="test-section" id="badges">
    <h2>Badges</h2>
    <div style="display: flex; gap: 1rem;">
      <span class="ease-badge">Default</span>
      <span class="ease-badge ease-badge-primary">Primary</span>
      <span class="ease-badge ease-badge-success">Success</span>
      <span class="ease-badge ease-badge-warning">Warning</span>
      <span class="ease-badge ease-badge-danger">Danger</span>
    </div>
  </div>

</body>
</html>
