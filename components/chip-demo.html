<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'unsafe-inline' 'unsafe-eval'; style-src 'self' https://cdn.jsdelivr.net https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:;">
  <title>ease-chip-group Demo — EaseMotion CSS</title>
  <link rel="stylesheet" href="chip.css">

  <style>
    .demo-description {
      color: #bdbdbd;
      max-width: 600px;
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }

    .selection-status {
      margin-top: 1.5rem;
      color: #ffffff;
      font-size: 1rem;
    }

    .ease-chip-group {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .ease-chip:focus-visible {
      outline: 2px solid #ffffff;
      outline-offset: 3px;
    }
  </style>
</head>

<body style="padding: 2rem; background: #0f0f0f; font-family: sans-serif;">

  <main>
    <h1 style="color: white; margin-bottom: 0.75rem;">
      ease-chip-group Demo
    </h1>

    <p class="demo-description">
      Select one or more chips to explore the interactive chip group.
      The demo also includes a checked chip and a disabled chip state.
    </p>

    <div class="ease-chip-group" aria-label="Technology categories">

      <input type="checkbox" id="chip1">
      <label class="ease-chip" for="chip1">Design</label>

      <input type="checkbox" id="chip2">
      <label class="ease-chip" for="chip2">Development</label>

      <input type="checkbox" id="chip3" checked>
      <label class="ease-chip" for="chip3">CSS</label>

      <input type="checkbox" id="chip4">
      <label class="ease-chip" for="chip4">Animation</label>

      <input type="checkbox" id="chip5" disabled>
      <label class="ease-chip" for="chip5">Disabled</label>

    </div>

    <p class="selection-status" id="selectionStatus" aria-live="polite">
      Selected: CSS
    </p>
  </main>

  <script>
    const chips = document.querySelectorAll(
      '.ease-chip-group input[type="checkbox"]'
    );

    const status = document.getElementById('selectionStatus');

    function updateSelection() {
      const selected = Array.from(chips)
        .filter(chip => chip.checked)
        .map(chip => document.querySelector(`label[for="${chip.id}"]`).textContent);

      status.textContent = selected.length
        ? `Selected: ${selected.join(', ')}`
        : 'Selected: None';
    }

    chips.forEach(chip => {
      chip.addEventListener('change', updateSelection);
    });

    updateSelection();
  </script>

</body>
</html>
