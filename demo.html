<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scroll Animation FPS Benchmark Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero">
    <h1>Scroll Animation Performance Benchmark</h1>
    <p>Scroll down to test Headless Chrome Puppeteer FPS frame capture.</p>
  </header>

  <main class="content-container">
    <section class="grid">
      <!-- Generates 30 animated cards to simulate UI complexity -->
      <script>
        for (let i = 1; i <= 30; i++) {
          document.write(`
            <article class="card">
              <div class="card-badge">Card #${i}</div>
              <h2>Interactive Scroll Section</h2>
              <p>Testing frame rates, rendering performance, and animation layout paint recalculations during scroll.</p>
            </article>
          `);
        }
      </script>
    </section>
  </main>

  <script>
    // Scroll-triggered class toggle for animation testing
    const cards = document.querySelectorAll('.card');
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
        }
      });
    }, { threshold: 0.2 });

    cards.forEach(card => observer.observe(card));
  </script>
</body>
</html>
