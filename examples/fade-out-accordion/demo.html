<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fade-Out Accordion Demo</title>

  <link rel="stylesheet" href="./style.css" />
</head>

<body>

<div class="em-fade-accordion">

  <h1>Dashboard Analytics Accordion</h1>

  <details class="em-fade-item">
    <summary class="em-fade-summary">
      Revenue Overview
    </summary>

    <div class="em-fade-content">
      <div>
        <p>
          Monthly revenue increased by <strong>18%</strong> compared to the previous month.
        </p>
      </div>
    </div>
  </details>

  <details class="em-fade-item">
    <summary class="em-fade-summary">
      Active Users
    </summary>

    <div class="em-fade-content">
      <div>
        <p>
          More than <strong>24,000</strong> users interacted with the dashboard today.
        </p>
      </div>
    </div>
  </details>

  <details class="em-fade-item">
    <summary class="em-fade-summary">
      Conversion Rate
    </summary>

    <div class="em-fade-content">
      <div>
        <p>
          Overall conversion improved to <strong>5.8%</strong> after the latest campaign.
        </p>
      </div>
    </div>
  </details>

</div>

</body>
</html>
