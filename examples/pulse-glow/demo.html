<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ease-pulse-glow Demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #0a0a0a;
      min-height: 100vh;
      display: flex;
      flex-wrap: wrap;
      gap: 2rem;
      padding: 2rem;
      justify-content: center;
      align-items: center;
    }
    .element {
      width: 100px;
      height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1a1a1a;
      border-radius: 50%;
      color: white;
    }
    .notification {
      width: 20px;
      height: 20px;
      background: #ff0000;
      border-radius: 50%;
    }
  </style>
</head>
<body>
  <div class="ease-pulse-glow element">Basic</div>
  <div class="ease-pulse-glow-primary element">Primary</div>
  <div class="ease-pulse-glow-success element">Success</div>
  <div class="ease-pulse-glow-warning element">Warning</div>
  <div class="ease-pulse-glow-danger element">Danger</div>
  <div class="ease-pulse-glow-danger notification"></div>
</body>
</html>
