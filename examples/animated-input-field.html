<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><title>Animated Input Field</title>
<style>
body{font-family:system-ui,sans-serif;padding:2rem}
.em-input{width:100%;max-width:360px;padding:.75rem 1rem;border:1px solid #ccc;border-radius:8px;transition:box-shadow .25s,border-color .25s}
.em-input:focus{outline:none;border-color:#6366f1;box-shadow:0 0 0 4px rgba(99,102,241,.2)}
.em-alert{padding:.9rem 1rem;border-radius:8px;background:#eff6ff;border-left:4px solid #3b82f6;animation:slide .35s ease}
@keyframes slide{from{transform:translateY(-8px);opacity:0}to{transform:none;opacity:1}}
.em-range{width:100%;max-width:360px;accent-color:#6366f1}
.em-crumbs a{color:#4f46e5;text-decoration:none}.em-crumbs span{opacity:.55;margin:0 .35rem}
</style></head><body>
<h1>Animated Input Field</h1>
<input class='em-input' placeholder='you@example.com'/>



</body></html>
