<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ease-gradient-border Demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #1a1a2e;
      min-height: 100vh;
      display: flex;
      flex-wrap: wrap;
      gap: 2rem;
      padding: 2rem;
      justify-content: center;
      align-items: center;
    }
    .card {
      width: 200px;
      height: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #16213e;
      color: white;
      font-size: 1.2rem;
    }
  </style>
</head>
<body>
  <div class="ease-gradient-border card">Basic</div>
  <div class="ease-gradient-border-slow card">Slow</div>
  <div class="ease-gradient-border-fast card">Fast</div>
  <div class="ease-gradient-border-rainbow card">Rainbow</div>
</body>
</html>
