<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ease SCSS CRT Monitor</title>
    <link rel="stylesheet" href="../../../easemotion.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="demo-container">
        
        <header class="header">
            <h1>Retro CRT Monitor</h1>
            <p>100% SCSS Generated. Zero JS. Hardware Accelerated.</p>
        </header>

        <!-- 
          We apply our CRT mixin to this container!
          It will instantly wrap all child content in a curved, 
          scanline-heavy, RGB-split retro monitor!
        -->
        <div class="crt-screen">
            
            <div class="crt-content">
                <h2 class="sys-title">OS.INIT(v1.0.4)</h2>
                
                <div class="terminal-body">
                    <p>> BOOTING CORE SYSTEMS...</p>
                    <p>> MEMORY CHECK: 640K OK</p>
                    <p>> LOADING DRIVERS... [DONE]</p>
                    <p>> MOUNTING VIRTUAL DOM... [SUCCESS]</p>
                    <p class="blinking-cursor">> _</p>
                </div>
                
                <button class="sys-button">OVERRIDE</button>
            </div>
            
        </div>
        
    </main>

</body>
</html>
