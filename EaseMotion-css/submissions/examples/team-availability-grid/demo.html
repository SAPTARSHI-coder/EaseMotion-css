<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Team Availability Grid</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

<main class="container">

  <h1>Team Availability Grid</h1>
  <p class="subtitle">
    Weekly availability heatmap of team members
  </p>

  <section 
    class="availability-grid"
    aria-label="Team availability schedule">

    <div class="header">Member</div>
    <div class="header">Mon</div>
    <div class="header">Tue</div>
    <div class="header">Wed</div>
    <div class="header">Thu</div>
    <div class="header">Fri</div>

    <div class="member">Avinash</div>
    <div class="cell high" tabindex="0">8h</div>
    <div class="cell medium" tabindex="0">5h</div>
    <div class="cell low" tabindex="0">2h</div>
    <div class="cell high" tabindex="0">8h</div>
    <div class="cell medium" tabindex="0">4h</div>


    <div class="member">Rahul</div>
    <div class="cell medium" tabindex="0">5h</div>
    <div class="cell high" tabindex="0">8h</div>
    <div class="cell medium" tabindex="0">4h</div>
    <div class="cell low" tabindex="0">2h</div>
    <div class="cell high" tabindex="0">8h</div>


    <div class="member">Priya</div>
    <div class="cell low" tabindex="0">2h</div>
    <div class="cell medium" tabindex="0">4h</div>
    <div class="cell high" tabindex="0">8h</div>
    <div class="cell medium" tabindex="0">5h</div>
    <div class="cell low" tabindex="0">3h</div>

  </section>

</main>

</body>
</html>
