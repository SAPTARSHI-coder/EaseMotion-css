<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Story Rings &mdash; EaseMotion CSS Demo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="page-head">
    <p class="kicker">EaseMotion CSS &middot; Social &amp; Chat</p>
    <h1>Story Rings</h1>
    <p class="sub">Friends with story highlights, wrapped in gently rotating gradient rings.</p>
  </header>
  <main class="stage">
    <div>
      <div class="sr-ring"><div class="sr-avatar">JD</div></div>
      <p class="sr-name">Jordan</p>
    </div>
    <div>
      <div class="sr-ring"><div class="sr-avatar">ML</div></div>
      <p class="sr-name">Maya</p>
    </div>
    <div>
      <div class="sr-ring seen"><div class="sr-avatar">PK</div></div>
      <p class="sr-name">Priya</p>
    </div>
  </main>
  <p class="stage-caption">Seen stories show a grey ring; unwatched ones keep spinning.</p>
  <footer class="page-foot">
    <span>Pure CSS &middot; zero dependencies</span>
    <span>Conic gradient spin</span>
  </footer>
</body>
</html>
