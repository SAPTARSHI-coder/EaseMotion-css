<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hover Icon Swap</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <h1>Hover Icon Swap</h1>

    <div class="icon-swap-row">
      <button class="swap-btn" aria-label="Play video">
        <span class="icon icon-a">▶️</span>
        <span class="icon icon-b">⏸️</span>
      </button>

      <button class="swap-btn" aria-label="Add to favorites">
        <span class="icon icon-a">🤍</span>
        <span class="icon icon-b">❤️</span>
      </button>

      <button class="swap-btn" aria-label="Copy link">
        <span class="icon icon-a">🔗</span>
        <span class="icon icon-b">✅</span>
      </button>
    </div>
  </main>
</body>
</html>
