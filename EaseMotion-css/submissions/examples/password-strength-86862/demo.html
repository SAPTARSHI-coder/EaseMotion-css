<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Strength Meter #86862 Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="showcase-wrapper">
    <form class="auth-card" id="authForm" onsubmit="event.preventDefault();">
      <div class="auth-header">
        <span class="auth-title">Create Password</span>
        <span class="auth-badge">4-Stage</span>
      </div>

      <div class="password-field-group">
        <input 
          type="password" 
          id="pwdInput" 
          class="password-input" 
          placeholder="Enter a secure password" 
          autocomplete="new-password"
          required
        >
        <button type="button" class="toggle-visibility-btn" id="toggleVisibility" aria-label="Toggle password visibility">👁</button>
      </div>

      <div class="meter-wrapper" id="meterContainer">
        <div class="meter-header">
          <span>Security Score</span>
          <span class="meter-status" id="meterStatus">Empty</span>
        </div>
        <div class="meter-bars">
          <div class="meter-bar"></div>
          <div class="meter-bar"></div>
          <div class="meter-bar"></div>
          <div class="meter-bar"></div>
        </div>
      </div>

      <div class="criteria-list">
        <div class="criteria-item" id="critLength"><span></span> At least 8 characters</div>
        <div class="criteria-item" id="critNumber"><span></span> Includes numbers</div>
        <div class="criteria-item" id="critSpecial"><span></span> Special symbols (!@#$%)</div>
      </div>

      <button type="submit" class="btn-submit">Confirm Password</button>
    </form>
  </div>

  <script>
    const pwdInput = document.getElementById('pwdInput');
    const meterContainer = document.getElementById('meterContainer');
    const meterStatus = document.getElementById('meterStatus');
    const toggleBtn = document.getElementById('toggleVisibility');

    const critLength = document.getElementById('critLength');
    const critNumber = document.getElementById('critNumber');
    const critSpecial = document.getElementById('critSpecial');

    const statusLabels = ["Empty", "Weak", "Fair", "Good", "Strong"];
    const statusColors = ["#94a3b8", "#ef4444", "#f59e0b", "#3b82f6", "#10b981"];

    function evaluateStrength(val) {
      if (!val) return 0;
      let score = 0;
      if (val.length >= 8) score++;
      if (/[A-Z]/.test(val) && /[a-z]/.test(val)) score++;
      if (/[0-9]/.test(val)) score++;
      if (/[^A-Za-z0-9]/.test(val)) score++;
      return Math.min(score, 4);
    }

    pwdInput.addEventListener('input', (e) => {
      const val = e.target.value;
      const score = evaluateStrength(val);

      meterContainer.className = 'meter-wrapper strength-' + score;
      meterStatus.textContent = statusLabels[score];
      meterStatus.style.color = statusColors[score];

      critLength.classList.toggle('valid', val.length >= 8);
      critNumber.classList.toggle('valid', /[0-9]/.test(val));
      critSpecial.classList.toggle('valid', /[^A-Za-z0-9]/.test(val));
    });

    toggleBtn.addEventListener('click', () => {
      const isPassword = pwdInput.getAttribute('type') === 'password';
      pwdInput.setAttribute('type', isPassword ? 'text' : 'password');
      toggleBtn.textContent = isPassword ? '🙈' : '👁';
    });
  </script>
</body>
</html>
