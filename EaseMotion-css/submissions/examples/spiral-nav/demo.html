<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EaseMotion CSS - Spiral Navigation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>🌀 Spiral Navigation</h1>

    <div class="controls">
        <button id="toggleBtn">Expand / Collapse</button>

        <label>
            Spiral Tightness
            <input type="range" id="spacing" min="18" max="50" value="28">
        </label>

        <label>
            Rotation Speed
            <input type="range" id="speed" min="1" max="10" value="4">
        </label>
    </div>

    <div class="spiral-wrapper">
        <div id="spiral" class="spiral">

            <div class="item active">🏠<span>Home</span></div>
            <div class="item">🔍<span>Explore</span></div>
            <div class="item">🖼️<span>Gallery</span></div>
            <div class="item">🎵<span>Music</span></div>
            <div class="item">🎬<span>Videos</span></div>
            <div class="item">👤<span>Profile</span></div>
            <div class="item">⚙️<span>Settings</span></div>
            <div class="item">💬<span>Messages</span></div>
            <div class="item">⭐<span>Favorites</span></div>
            <div class="item">📁<span>Files</span></div>
            <div class="item">📰<span>News</span></div>
            <div class="item">🛒<span>Store</span></div>
            <div class="item">❤️<span>Likes</span></div>
            <div class="item">📸<span>Photos</span></div>
            <div class="item">🎮<span>Games</span></div>
            <div class="item">📅<span>Calendar</span></div>
            <div class="item">📍<span>Location</span></div>
            <div class="item">☁️<span>Cloud</span></div>
            <div class="item">🔔<span>Notifications</span></div>
            <div class="item">❓<span>Help</span></div>

        </div>
    </div>

    <div class="info">
        <p><strong>Keyboard Shortcuts</strong></p>
        <ul>
            <li><b>Space</b> → Expand / Collapse</li>
            <li><b>R</b> → Toggle Auto Rotation</li>
            <li><b>1–9</b> → Select Item</li>
        </ul>
    </div>

</div>

<script src="script.js"></script>

</body>
</html>
