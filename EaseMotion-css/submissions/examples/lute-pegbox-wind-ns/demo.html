<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lute Pegbox Wind — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Lute Pegbox Wind demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Lute Pegbox Wind</h1>
      <p class="lede">Lute peg winding a course up to pitch</p>
    </header>

    <section class="ease-lute-pegbox-wind" data-demo="lute-pegbox-wind" aria-live="polite">
      <div class="ease-lute-pegbox-wind__housing">
        <div class="ease-lute-pegbox-wind__bezel">
          <div class="ease-lute-pegbox-wind__face">
            <div class="ease-lute-pegbox-wind__readout">
              <span class="ease-lute-pegbox-wind__label">Lute Pegbox Wind</span>
              <span class="ease-lute-pegbox-wind__value">LIVE</span>
            </div>
            <div class="ease-lute-pegbox-wind__motion" aria-hidden="true">
              <span class="ease-lute-pegbox-wind__a"></span>
              <span class="ease-lute-pegbox-wind__b"></span>
              <span class="ease-lute-pegbox-wind__c"></span>
              <span class="ease-lute-pegbox-wind__d"></span>
            </div>
            <div class="ease-lute-pegbox-wind__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-lute-pegbox-wind__controls">
          <button type="button" class="ease-lute-pegbox-wind__btn primary">Wind</button>
          <button type="button" class="ease-lute-pegbox-wind__btn">Slip</button>
          <label class="ease-lute-pegbox-wind__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-lute-pegbox-wind__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
