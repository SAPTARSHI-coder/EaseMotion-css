<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Skeleton Data Table Loading Shimmer · EaseMotion</title>
  <meta name="description" content="A pure CSS data table skeleton component with animated background shimmer waves." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Demo Content -->
  <main class="demo-page">
    <div class="demo-header">
      <h1 class="demo-title">Data Loading</h1>
      <p class="demo-subtitle">Pure CSS skeleton placeholder for data tables, utilizing smooth background-position wave shimmers.</p>
    </div>

    <!-- =========================================================
         SKELETON DATA TABLE
    ========================================================== -->
    <div class="table-container" aria-busy="true" aria-label="Loading data table">
      <table class="skeleton-table">
        
        <!-- Table Header (Static Placeholders) -->
        <thead>
          <tr>
            <th class="cell-checkbox"><div class="sk-box"></div></th>
            <th class="cell-user"><div class="sk-text sk-text--sm w-20"></div></th>
            <th class="cell-role"><div class="sk-text sk-text--sm w-40"></div></th>
            <th class="cell-status"><div class="sk-text sk-text--sm w-30"></div></th>
            <th class="cell-actions"><div class="sk-text sk-text--sm w-20"></div></th>
          </tr>
        </thead>

        <!-- Table Body (Animated Rows) -->
        <tbody>
          <!-- Row 1 -->
          <tr>
            <td class="cell-checkbox"><div class="sk-box"></div></td>
            <td class="cell-user">
              <div class="user-block">
                <div class="sk-avatar"></div>
                <div class="user-text">
                  <div class="sk-text w-60"></div>
                  <div class="sk-text sk-text--sm w-40"></div>
                </div>
              </div>
            </td>
            <td class="cell-role"><div class="sk-text w-50"></div></td>
            <td class="cell-status"><div class="sk-pill"></div></td>
            <td class="cell-actions"><div class="sk-box sk-box--round"></div></td>
          </tr>
          
          <!-- Row 2 -->
          <tr>
            <td class="cell-checkbox"><div class="sk-box"></div></td>
            <td class="cell-user">
              <div class="user-block">
                <div class="sk-avatar"></div>
                <div class="user-text">
                  <div class="sk-text w-50"></div>
                  <div class="sk-text sk-text--sm w-70"></div>
                </div>
              </div>
            </td>
            <td class="cell-role"><div class="sk-text w-60"></div></td>
            <td class="cell-status"><div class="sk-pill"></div></td>
            <td class="cell-actions"><div class="sk-box sk-box--round"></div></td>
          </tr>
          
          <!-- Row 3 -->
          <tr>
            <td class="cell-checkbox"><div class="sk-box"></div></td>
            <td class="cell-user">
              <div class="user-block">
                <div class="sk-avatar"></div>
                <div class="user-text">
                  <div class="sk-text w-70"></div>
                  <div class="sk-text sk-text--sm w-50"></div>
                </div>
              </div>
            </td>
            <td class="cell-role"><div class="sk-text w-40"></div></td>
            <td class="cell-status"><div class="sk-pill"></div></td>
            <td class="cell-actions"><div class="sk-box sk-box--round"></div></td>
          </tr>
          
          <!-- Row 4 -->
          <tr>
            <td class="cell-checkbox"><div class="sk-box"></div></td>
            <td class="cell-user">
              <div class="user-block">
                <div class="sk-avatar"></div>
                <div class="user-text">
                  <div class="sk-text w-40"></div>
                  <div class="sk-text sk-text--sm w-60"></div>
                </div>
              </div>
            </td>
            <td class="cell-role"><div class="sk-text w-70"></div></td>
            <td class="cell-status"><div class="sk-pill"></div></td>
            <td class="cell-actions"><div class="sk-box sk-box--round"></div></td>
          </tr>
          
          <!-- Row 5 -->
          <tr>
            <td class="cell-checkbox"><div class="sk-box"></div></td>
            <td class="cell-user">
              <div class="user-block">
                <div class="sk-avatar"></div>
                <div class="user-text">
                  <div class="sk-text w-50"></div>
                  <div class="sk-text sk-text--sm w-40"></div>
                </div>
              </div>
            </td>
            <td class="cell-role"><div class="sk-text w-50"></div></td>
            <td class="cell-status"><div class="sk-pill"></div></td>
            <td class="cell-actions"><div class="sk-box sk-box--round"></div></td>
          </tr>

        </tbody>

        <!-- Table Footer Pagination Placeholder -->
        <tfoot>
          <tr>
            <td colspan="5">
              <div class="pagination-block">
                <div class="sk-text sk-text--sm w-20"></div>
                <div class="pagination-controls">
                  <div class="sk-box"></div>
                  <div class="sk-box"></div>
                  <div class="sk-box"></div>
                </div>
              </div>
            </td>
          </tr>
        </tfoot>
      </table>
    </div>

  </main>
</body>
</html>
