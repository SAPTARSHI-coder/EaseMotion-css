<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Float-Drift Popover</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<section class="hero">

    <h1>Gaming Hub Popover</h1>

    <p>
        Hover or focus the player card to reveal a floating popover with a gentle drifting animation.
    </p>

    <div class="popover-wrapper">

        <button class="trigger">
            🎮 Player Overview
        </button>

        <div class="popover">

            <div class="avatar">
                🚀
            </div>

            <h2>Galaxy Ranger</h2>

            <p>
                Level 84 • Champion League<br>
                Guild: Cosmic Strike<br>
                Daily Win Bonus Ready
            </p>

            <a href="#" class="action-btn">
                View Profile
            </a>

        </div>

    </div>

</section>

</body>
</html>
