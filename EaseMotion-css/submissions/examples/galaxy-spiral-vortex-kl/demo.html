<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galaxy Spiral Vortex - EaseMotion CSS</title>
    <!-- Include EaseMotion Core Stylesheet -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #06030f; color: #ffffff;">

    <div class="ease-card ease-card-glass galaxy-container">
        <div class="galaxy-header">
            <h2>Galaxy Spiral</h2>
            <span class="ease-badge ease-badge-primary">Rotating</span>
        </div>
        
        <div class="galaxy-screen ease-center">
            <div class="galaxy-arm arm-1"></div>
            <div class="galaxy-arm arm-2"></div>
            <div class="galaxy-core ease-center"></div>
        </div>

        <div class="galaxy-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Mass: 10^11 M☉</span>
            <button class="ease-btn ease-btn-primary ease-btn-sm ease-hover-grow">Accelerate</button>
        </div>
    </div>

</body>
</html>
