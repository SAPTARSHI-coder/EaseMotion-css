<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Slot Machine &mdash; EaseMotion CSS Demo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="page-head">
    <p class="kicker">EaseMotion CSS &middot; Games &amp; Play</p>
    <h1>Slot Machine</h1>
    <p class="sub">Pull the lever &mdash; the reels tumble into a glowing payline.</p>
  </header>
  <main class="stage">
    <div class="sm-machine">
      <div class="sm-reels">
        <div class="sm-reel"><i>&#127791;</i></div>
        <div class="sm-reel win"><i>&#127791;</i></div>
        <div class="sm-reel"><i>&#127791;</i></div>
        <span class="sm-payline"></span>
      </div>
      <div class="sm-lever"></div>
    </div>
  </main>
  <p class="stage-caption">Hover the machine to spin the symbols into the golden row.</p>
  <footer class="page-foot">
    <span>Pure CSS &middot; zero dependencies</span>
    <span>Tumbling reels</span>
  </footer>
</body>
</html>
