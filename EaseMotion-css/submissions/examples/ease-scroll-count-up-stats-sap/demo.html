<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ease-scroll-count-up-stats-sap demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #f4f4f5; }
    .spacer { height: 80vh; display: flex; align-items: center; justify-content: center; color: #94a3b8; }
    .page { display: flex; justify-content: center; padding-bottom: 200px; }
  </style>
</head>
<body>
  <div class="spacer">Scroll down</div>
  <div class="page">
    <div class="count-stats-sap" id="stats">
      <div class="stat-box"><div class="stat-num" data-target="850">0</div><div class="stat-caption">Projects</div></div>
      <div class="stat-box"><div class="stat-num" data-target="12000">0</div><div class="stat-caption">Users</div></div>
      <div class="stat-box"><div class="stat-num" data-target="98">0</div><div class="stat-caption">Satisfaction %</div></div>
    </div>
  </div>
  <script>
    let animated = false;
    function animateNum(el) {
      const target = +el.dataset.target;
      const start = performance.now();
      function tick(now) {
        const p = Math.min((now - start) / 1200, 1);
        el.textContent = Math.floor((1 - Math.pow(1 - p, 3)) * target);
        if (p < 1) requestAnimationFrame(tick); else el.textContent = target;
      }
      requestAnimationFrame(tick);
    }
    const obs = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        if (e.isIntersecting && !animated) {
          animated = true;
          document.querySelectorAll('.stat-num').forEach(animateNum);
        }
      });
    }, { threshold: 0.5 });
    obs.observe(document.getElementById('stats'));
  </script>
</body>
</html>
