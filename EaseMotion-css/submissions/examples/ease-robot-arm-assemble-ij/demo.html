<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Robot Arm Assemble Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="workshop" aria-label="robot arm assembly">
    <div class="arm" id="arm" aria-hidden="true">
      <span class="arm-base"></span>
      <span class="arm-shoulder"></span>
      <span class="arm-upper"></span>
      <span class="arm-elbow"></span>
      <span class="arm-fore"></span>
      <span class="arm-gripper"></span>
      <span class="part" id="part"></span>
    </div>
    <div class="part-tray" aria-hidden="true"></div>
    <div class="target" aria-hidden="true"></div>
    <button class="assemble-btn" id="assembleBtn" type="button">Assemble</button>
    <p class="caption">The arm pivots, grips the part, and places it on target.</p>
  </main>
  <script>
    const arm = document.getElementById("arm");
    const btn = document.getElementById("assembleBtn");
    function assemble() {
      arm.classList.remove("working");
      void arm.offsetWidth;
      arm.classList.add("working");
    }
    btn.addEventListener("click", assemble);
  </script>
</body>
</html>
