<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ease Toolbar Button</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="toolbar">

    <button class="toolbar-button active">
        <span class="icon">✎</span>
        <span>Edit</span>
    </button>

    <button class="toolbar-button">
        <span class="icon">◉</span>
        <span>Preview</span>
    </button>

    <button class="toolbar-button">
        <span class="icon">⚙</span>
        <span>Settings</span>
    </button>

</div>

</body>
</html>
