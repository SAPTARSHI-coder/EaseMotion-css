<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Pulsating Wave CSS dashboard widget built with pure HTML and Vanilla CSS."
  >
  <title>Pulsating Wave Dashboard Widget</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">
    <section class="dashboard" aria-labelledby="dashboard-title">

      <header class="dashboard-header">
        <div>
          <p class="eyebrow">LIVE MONITOR</p>
          <h1 id="dashboard-title">Pulse Analytics</h1>
        </div>

        <div class="live-status" aria-label="Live monitoring active">
          <span class="live-dot" aria-hidden="true"></span>
          LIVE
        </div>
      </header>

      <section class="pulse-card">
        <div class="pulse-content">
          <span class="section-label">CURRENT ACTIVITY</span>
          <strong>78%</strong>
          <p>System activity is within the optimal range.</p>
        </div>

        <div class="pulse-visual" aria-hidden="true">
          <span class="pulse-ring ring-one"></span>
          <span class="pulse-ring ring-two"></span>
          <span class="pulse-ring ring-three"></span>
          <span class="pulse-core"></span>
        </div>
      </section>

      <section class="wave-card" aria-labelledby="wave-title">
        <div class="card-heading">
          <div>
            <span class="section-label">REAL-TIME SIGNAL</span>
            <h2 id="wave-title">Activity Wave</h2>
          </div>

          <span class="wave-value">+18.4%</span>
        </div>

        <div class="wave-visual" aria-label="Animated activity wave">
          <div class="wave-line wave-line-one"></div>
          <div class="wave-line wave-line-two"></div>
          <div class="wave-line wave-line-three"></div>

          <div class="wave-points">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>
      </section>

      <section class="metrics" aria-label="System metrics">

        <article class="metric-card">
          <div class="metric-icon">CPU</div>
          <span>Processing</span>
          <strong>64%</strong>
          <div class="progress">
            <span style="--progress: 64%"></span>
          </div>
        </article>

        <article class="metric-card">
          <div class="metric-icon">NET</div>
          <span>Network</span>
          <strong>86%</strong>
          <div class="progress">
            <span style="--progress: 86%"></span>
          </div>
        </article>

        <article class="metric-card">
          <div class="metric-icon">MEM</div>
          <span>Memory</span>
          <strong>51%</strong>
          <div class="progress">
            <span style="--progress: 51%"></span>
          </div>
        </article>

      </section>

      <button class="action-button" type="button">
        <span class="action-icon" aria-hidden="true">↗</span>
        View Detailed Analytics
      </button>

    </section>
  </main>

</body>
</html>
