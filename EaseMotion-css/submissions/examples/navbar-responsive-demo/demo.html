<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EaseMotion — Navbar Demo</title>
  <link rel="stylesheet" href="../../core/variables.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-brand">EaseMotion</div>
    <button class="nav-toggle" onclick="document.querySelector('.nav-links').classList.toggle('open')" aria-label="Toggle menu">
      <span></span><span></span><span></span>
    </button>
    <div class="nav-links">
      <a href="#" class="nav-link active">Home</a>
      <a href="#" class="nav-link">Features</a>
      <a href="#" class="nav-link">Docs</a>
      <a href="#" class="nav-link">Blog</a>
      <button class="nav-cta">Get Started</button>
    </div>
  </nav>

  <div class="hero">
    <h1 class="ease-fade-in">Responsive Navbar</h1>
    <p class="ease-slide-up">Resize the browser to see the mobile hamburger menu.</p>
  </div>
</body>
</html>
