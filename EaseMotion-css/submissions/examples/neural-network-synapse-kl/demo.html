<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neural Network Synapse - EaseMotion CSS</title>
    <!-- Include EaseMotion Core Stylesheet -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #022c22; color: #ffffff;">

    <div class="ease-card ease-card-glass neural-container">
        <div class="neural-header">
            <h2>Neural Synapse</h2>
            <span class="ease-badge ease-badge-success">Active</span>
        </div>
        
        <div class="neural-screen ease-center">
            <div class="neural-pathway p-top"></div>
            <div class="neural-pathway p-bottom"></div>
            <div class="neural-node node-1"></div>
            <div class="neural-node node-2"></div>
            <div class="neural-core ease-center"></div>
        </div>

        <div class="neural-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Firing Rate: 120Hz</span>
            <button class="ease-btn ease-btn-primary ease-btn-sm ease-hover-grow">Stimulate</button>
        </div>
    </div>

</body>
</html>
