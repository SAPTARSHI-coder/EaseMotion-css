<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Responsive morphing progress bar with glassmorphism styling">
  <title>Morphing Progress Bar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">
    <section class="progress-card" aria-label="Project progress">
      <div class="header">
        <div>
          <p class="eyebrow">PROJECT STATUS</p>
          <h1>Morphing Progress</h1>
        </div>

        <span class="percentage">75%</span>
      </div>

      <div class="progress-track" role="progressbar"
           aria-valuenow="75"
           aria-valuemin="0"
           aria-valuemax="100"
           aria-label="Project completion">
        <div class="progress-fill">
          <span class="progress-glow"></span>
        </div>
      </div>

      <div class="progress-info">
        <span>In Progress</span>
        <span>75 / 100</span>
      </div>
    </section>
  </main>

</body>
</html>
