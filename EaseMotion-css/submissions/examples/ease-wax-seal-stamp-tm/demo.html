<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ease-wax-seal — Stamp Demo</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { min-height: 100vh; background: #f5f0e8; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2.5rem; font-family: Georgia, serif; color: #3a2a1a; padding: 2rem; }
    h1 { font-size: 1.4rem; font-weight: 400; letter-spacing: 0.1em; text-transform: uppercase; }
    .demo-row { display: flex; gap: 2.5rem; flex-wrap: wrap; justify-content: center; align-items: center; }
    .demo-card { display: flex; flex-direction: column; align-items: center; gap: 0.75rem; }
    .demo-card span { font-size: 0.8rem; color: #7a6a5a; font-family: system-ui, sans-serif; }
    .wax-seal { width: var(--wax-size); height: var(--wax-size); border-radius: 50%; background: radial-gradient(ellipse at 35% 35%, color-mix(in srgb, var(--wax-color) 80%, white 20%), var(--wax-color) 60%, color-mix(in srgb, var(--wax-color) 80%, black 20%)); display: flex; align-items: center; justify-content: center; font-family: Georgia, serif; font-size: calc(var(--wax-size) * 0.3); color: color-mix(in srgb, var(--wax-color) 20%, white 80%); text-shadow: 0 1px 2px rgba(0,0,0,0.4); box-shadow: 0 2px 8px rgba(0,0,0,0.3), inset 0 -2px 6px rgba(0,0,0,0.2), inset 0 2px 4px rgba(255,255,255,0.1); border: 2px solid color-mix(in srgb, var(--wax-color) 70%, black 30%); animation: wax-drop var(--wax-drop-duration) var(--wax-ease) both; }
    .wax-seal-stamp { animation: wax-stamp-imprint var(--wax-stamp-duration) var(--wax-ease) both; animation-delay: 0.2s; }
    .wax-seal-melt { animation: wax-drop var(--wax-drop-duration) var(--wax-ease) both, wax-edge-wobble 3s ease-in-out infinite 0.6s; }
    .wax-glow { animation: wax-drop var(--wax-drop-duration) var(--wax-ease) both, wax-glow-pulse 2s ease-in-out infinite 0.6s; }
    .wax-seal-gold { --wax-color: #c9a84c; }
    .wax-seal-burgundy { --wax-color: #722f37; }
    .wax-seal-navy { --wax-color: #1a3a5c; }
    .wax-ripple { width: var(--wax-size); height: var(--wax-size); border-radius: 50%; border: 2px solid var(--wax-color); position: absolute; animation: wax-ripple-out var(--wax-ripple-duration) ease-out infinite; }
    .wax-ripple-wrap { position: relative; }
    .wax-ripple-wrap .wax-ripple:nth-child(2) { animation-delay: 0.5s; }
    .wax-ripple-wrap .wax-ripple:nth-child(3) { animation-delay: 1s; }
  </style>
</head>
<body>
  <h1>ease-wax-seal</h1>
  <div class="demo-row">
    <div class="demo-card">
      <div class="wax-ripple-wrap" style="--wax-size: 80px;">
        <div class="wax-seal" style="animation-delay: 0s;">W</div>
        <div class="wax-ripple" style="--wax-color: #c9a84c;"></div>
        <div class="wax-ripple" style="--wax-color: #c9a84c;"></div>
      </div>
      <span>Drop + Ripple</span>
    </div>
    <div class="demo-card">
      <div class="wax-seal wax-seal-gold wax-glow" style="--wax-color: #c9a84c;">S</div>
      <span>Gold Glow</span>
    </div>
    <div class="demo-card">
      <div class="wax-seal wax-seal-burgundy wax-seal-melt" style="--wax-color: #722f37;">A</div>
      <span>Melt Wobble</span>
    </div>
    <div class="demo-card">
      <div class="wax-seal wax-seal-stamp wax-seal-navy" style="--wax-color: #1a3a5c;">M</div>
      <span>Stamp Imprint</span>
    </div>
  </div>
</body>
</html>
