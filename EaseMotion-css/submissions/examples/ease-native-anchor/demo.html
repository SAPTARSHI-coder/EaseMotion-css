<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ease Native Anchor Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div style="position: fixed; top: 1rem; left: 1rem; color: #94a3b8;">Scroll down to test collision (flip-block)</div>

  <div class="ease-scroll-area">
    <button class="ease-anchor-btn" popovertarget="ease-tooltip">Click for Anchored Tooltip</button>
    <div id="ease-tooltip" class="ease-tooltip" popover>I am tethered natively via CSS Anchor Positioning. If you scroll me near the bottom of the viewport, I will flip to the top!</div>
  </div>
</body>
</html>
