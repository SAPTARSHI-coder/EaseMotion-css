<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warp Bubble Alcubierre Drive - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #020617; color: #ffffff;">

    <div class="ease-card ease-card-glass warp-container">
        <div class="warp-header">
            <h2>Warp Bubble</h2>
            <span class="ease-badge ease-badge-info">Warp 9.2</span>
        </div>
        
        <div class="warp-screen ease-center">
            <div class="spacetime-distortion distortion-1"></div>
            <div class="spacetime-distortion distortion-2"></div>
            <div class="exotic-matter-ring"></div>
            <div class="subspace-core ease-center"></div>
        </div>

        <div class="warp-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Velocity: 4.8 c</span>
            <button class="ease-btn ease-btn-primary ease-btn-sm ease-hover-grow">Engage Warp</button>
        </div>
    </div>

</body>
</html>
