<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ease-toast-slide — Toast Notification Component</title>
  <link rel="stylesheet" href="style.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f0f1a;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
      gap: 20px;
    }
    h1 {
      font-size: 28px;
      font-weight: 700;
      background: linear-gradient(135deg, #667eea, #764ba2);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      max-width: 600px;
    }
    .btn {
      padding: 10px 20px;
      border: 1px solid #4a4a6a;
      border-radius: 8px;
      background: #1a1a2e;
      color: #e0e0e0;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn:hover {
      background: #2a2a4e;
      border-color: #667eea;
    }
    .btn--success { background: #0d3320; border-color: #2ecc71; }
    .btn--success:hover { background: #1a4430; }
    .btn--error { background: #2d0d0d; border-color: #e74c3c; }
    .btn--error:hover { background: #3d1515; }
    .btn--info { background: #0d1f33; border-color: #3498db; }
    .btn--info:hover { background: #152a40; }
    .btn--warning { background: #2d2800; border-color: #f39c12; }
    .btn--warning:hover { background: #3d3800; }
    .section-label {
      font-size: 12px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 4px;
    }
    .section-title {
      font-size: 16px;
      font-weight: 600;
      color: #aaa;
      margin-bottom: 16px;
    }
    .demo-group {
      background: #16162a;
      border: 1px solid #2a2a4a;
      border-radius: 12px;
      padding: 24px;
      width: 100%;
      max-width: 640px;
    }
    .variant-label {
      font-size: 11px;
      color: #667eea;
      background: rgba(102, 126, 234, 0.1);
      border: 1px solid rgba(102, 126, 234, 0.3);
      border-radius: 4px;
      padding: 2px 8px;
      margin-left: 8px;
      vertical-align: middle;
    }
  </style>
</head>
<body>

  <h1>Toast Slide Notifications</h1>

  <!-- Default Size Variants -->
  <div class="demo-group">
    <div class="section-title">Default Toast Variants <span class="variant-label">bottom-right</span></div>
    <div class="controls">
      <button class="btn btn--success" onclick="showToast('File saved successfully!', 'success')">Success</button>
      <button class="btn btn--error" onclick="showToast('Failed to connect to server.', 'error')">Error</button>
      <button class="btn btn--info" onclick="showToast('New version available.', 'info')">Info</button>
      <button class="btn btn--warning" onclick="showToast('Your session expires soon.', 'warning')">Warning</button>
    </div>
  </div>

  <!-- Small Size -->
  <div class="demo-group">
    <div class="section-title">Small Size <span class="variant-label">compact</span></div>
    <div class="controls">
      <button class="btn btn--success" onclick="showToast('Done!', 'success', 'sm')">Small Success</button>
      <button class="btn btn--info" onclick="showToast('OK', 'info', 'sm')">Small Info</button>
    </div>
  </div>

  <!-- Large Size -->
  <div class="demo-group">
    <div class="section-title">Large Size <span class="variant-label">detailed</span></div>
    <div class="controls">
      <button class="btn btn--success" onclick="showToast('Your profile has been updated and all changes have been saved to your account.', 'success', 'lg')">Large Success</button>
      <button class="btn btn--error" onclick="showToast('An unexpected error occurred while processing your request. Please try again.', 'error', 'lg')">Large Error</button>
    </div>
  </div>

  <!-- Top Right Position -->
  <div class="demo-group">
    <div class="section-title">Top Right Position</div>
    <div class="controls">
      <button class="btn" onclick="showToast('Pull request merged!', 'success', '', 'top-right')">Top Right</button>
    </div>
  </div>

  <!-- Top Left Position -->
  <div class="demo-group">
    <div class="section-title">Top Left Position</div>
    <div class="controls">
      <button class="btn" onclick="showToast('New notification received.', 'info', '', 'top-left')">Top Left</button>
    </div>
  </div>

  <!-- Auto-Dismiss Progress -->
  <div class="demo-group">
    <div class="section-title">Auto-Dismiss with Progress Bar <span class="variant-label">5s</span></div>
    <div class="controls">
      <button class="btn" onclick="showToast('Changes auto-saved.', 'success', '', '', true)">Auto-dismiss</button>
    </div>
  </div>

  <!-- Stacking Demo -->
  <div class="demo-group">
    <div class="section-title">Stacking (up to 3 visible)</div>
    <div class="controls">
      <button class="btn btn--success" onclick="showToast('First toast', 'success')">Toast 1</button>
      <button class="btn btn--info" onclick="showToast('Second toast', 'info')">Toast 2</button>
      <button class="btn btn--warning" onclick="showToast('Third toast', 'warning')">Toast 3</button>
      <button class="btn btn--error" onclick="showToast('Fourth (hidden)', 'error')">Toast 4+</button>
    </div>
  </div>

  <script>
    function showToast(message, variant = 'info', size = '', position = '', showProgress = false) {
      const container = document.querySelector('.toast-container') || createContainer(position);
      if (position) {
        const newContainer = createContainer(position);
        document.body.appendChild(newContainer);
      }

      const toast = document.createElement('div');
      toast.className = `toast toast--${variant}${size ? ' toast--' + size : ''}`;

      toast.innerHTML = `
        <div class="toast-icon"></div>
        <div class="toast-message">${message}</div>
        <button class="toast-dismiss" onclick="dismissToast(this.closest('.toast'))">&#215;</button>
        ${showProgress ? '<div class="toast-progress"></div>' : ''}
      `;

      const targetContainer = position ? document.querySelector(`.toast-container--${position}`) : document.querySelector('.toast-container-main');
      if (!targetContainer) {
        const c = createContainer(position || '');
        document.body.appendChild(c);
      }
      (position ? document.querySelector(`.toast-container--${position}`) : document.querySelector('.toast-container-main') || createContainer('')).appendChild(toast);

      setTimeout(() => dismissToast(toast), 5000);
    }

    function createContainer(position) {
      const c = document.createElement('div');
      c.className = `toast-container toast-container${position ? '--' + position : '-main'}`;
      document.body.appendChild(c);
      return c;
    }

    function dismissToast(toast) {
      if (!toast || toast.classList.contains('toast--exiting')) return;
      toast.classList.add('toast--exiting');
      toast.addEventListener('animationend', () => toast.remove());
    }

    // Create main container
    document.addEventListener('DOMContentLoaded', () => {
      createContainer('');
    });
  </script>
</body>
</html>
