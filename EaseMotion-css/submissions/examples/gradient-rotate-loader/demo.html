<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gradient Rotate Loader</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="demo-shell">
      <section class="demo-card" aria-labelledby="grl-title">
        <p class="eyebrow">Loader</p>
        <h1 id="grl-title">Gradient rotate</h1>
        <p class="demo-copy">
          A soft conic gradient spins beneath a round mask, producing a smooth
          color sweep.
        </p>
        <div class="gradient-rotate-loader" role="status" aria-label="Loading">
          <span class="gradient-rotate-loader__label">Loading</span>
        </div>
      </section>
    </main>
  </body>
</html>
