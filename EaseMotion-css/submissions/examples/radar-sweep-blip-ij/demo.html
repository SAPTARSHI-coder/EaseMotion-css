<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-radar-sweep-blip demo</title>
</head>
<body>
<div class="rd-app">
  <span class="rd-title">RADAR</span>
  <div class="rd-screen">
    <span class="rd-ring rd-ring-1"></span>
    <span class="rd-ring rd-ring-2"></span>
    <span class="rd-ring rd-ring-3"></span>
    <span class="rd-cross rd-cross-x"></span>
    <span class="rd-cross rd-cross-y"></span>
    <span class="rd-sweep"></span>
    <span class="rd-blip rd-blip-1"></span>
    <span class="rd-blip rd-blip-2"></span>
    <span class="rd-blip rd-blip-3"></span>
  </div>
  <div class="rd-readout"><span class="rd-range">12 NM</span></div>
</div>
</body>
</html>
