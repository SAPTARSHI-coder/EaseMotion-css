<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Signal Loom</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <main class="page">

    <section class="signal-card">

      <header class="signal-header">
        <div>
          <span class="eyebrow">SYSTEM TOPOLOGY</span>
          <h1>Signal Loom</h1>
          <p>
            Interactive visualization of connected system signals.
          </p>
        </div>

        <div class="system-status">
          <span class="status-dot"></span>
          <span>Network Stable</span>
        </div>
      </header>

      <div class="loom">

        <div class="grid"></div>

        <!-- Connection Layer -->
        <svg
          class="connections"
          viewBox="0 0 1000 600"
          preserveAspectRatio="none"
          aria-hidden="true"
        >
          <defs>

            <linearGradient
              id="connectionGradient"
              x1="0%"
              y1="0%"
              x2="100%"
              y2="0%"
            >
              <stop offset="0%" />
              <stop offset="50%" />
              <stop offset="100%" />
            </linearGradient>

            <filter id="glow">
              <feGaussianBlur
                stdDeviation="3"
                result="blur"
              />

              <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
              </feMerge>
            </filter>

          </defs>

          <line
            class="connection"
            data-from="core"
            data-to="vision"
            x1="500"
            y1="300"
            x2="220"
            y2="150"
          />

          <line
            class="connection"
            data-from="core"
            data-to="memory"
            x1="500"
            y1="300"
            x2="780"
            y2="150"
          />

          <line
            class="connection"
            data-from="core"
            data-to="engine"
            x1="500"
            y1="300"
            x2="220"
            y2="450"
          />

          <line
            class="connection"
            data-from="core"
            data-to="gateway"
            x1="500"
            y1="300"
            x2="780"
            y2="450"
          />

          <line
            class="connection"
            data-from="vision"
            data-to="memory"
            x1="220"
            y1="150"
            x2="780"
            y2="150"
          />

          <line
            class="connection"
            data-from="engine"
            data-to="gateway"
            x1="220"
            y1="450"
            x2="780"
            y2="450"
          />

          <line
            class="connection"
            data-from="vision"
            data-to="engine"
            x1="220"
            y1="150"
            x2="220"
            y2="450"
          />

          <line
            class="connection"
            data-from="memory"
            data-to="gateway"
            x1="780"
            y1="150"
            x2="780"
            y2="450"
          />

        </svg>

        <!-- Core -->
        <button
          class="node node-core"
          data-node="core"
          aria-label="Core node"
        >
          <span class="node-ring"></span>

          <span class="node-icon">✦</span>

          <span class="node-info">
            <strong>Core</strong>
            <small>Coordinator</small>
          </span>

          <span class="pulse"></span>
        </button>

        <!-- Vision -->
        <button
          class="node node-vision"
          data-node="vision"
          aria-label="Vision node"
        >
          <span class="node-icon">◈</span>

          <span class="node-info">
            <strong>Vision</strong>
            <small>Processing</small>
          </span>

          <span class="pulse"></span>
        </button>

        <!-- Memory -->
        <button
          class="node node-memory"
          data-node="memory"
          aria-label="Memory node"
        >
          <span class="node-icon">⬡</span>

          <span class="node-info">
            <strong>Memory</strong>
            <small>Online</small>
          </span>

          <span class="pulse"></span>
        </button>

        <!-- Engine -->
        <button
          class="node node-engine"
          data-node="engine"
          aria-label="Engine node"
        >
          <span class="node-icon">△</span>

          <span class="node-info">
            <strong>Engine</strong>
            <small>Processing</small>
          </span>

          <span class="pulse"></span>
        </button>

        <!-- Gateway -->
        <button
          class="node node-gateway"
          data-node="gateway"
          aria-label="Gateway node"
        >
          <span class="node-icon">⌁</span>

          <span class="node-info">
            <strong>Gateway</strong>
            <small>Warning</small>
          </span>

          <span class="pulse"></span>
        </button>

        <!-- Floating metadata -->
        <div class="metric metric-top">
          <span>THROUGHPUT</span>
          <strong>94.8%</strong>
        </div>

        <div class="metric metric-bottom">
          <span>ACTIVE LINKS</span>
          <strong>08</strong>
        </div>

        <!-- Detail Panel -->
        <aside class="detail-panel" aria-live="polite">

          <div class="detail-header">
            <span class="detail-label">SIGNAL NODE</span>
            <button
              class="close-detail"
              aria-label="Close details"
            >
              ×
            </button>
          </div>

          <div class="detail-content">
            <span class="detail-symbol">✦</span>

            <div>
              <h2>Core</h2>
              <p>Coordinator</p>
            </div>
          </div>

          <div class="detail-stats">
            <div>
              <span>STATUS</span>
              <strong>ONLINE</strong>
            </div>

            <div>
              <span>LOAD</span>
              <strong>68%</strong>
            </div>

            <div>
              <span>LATENCY</span>
              <strong>18ms</strong>
            </div>
          </div>

        </aside>

      </div>

      <footer class="signal-footer">

        <div class="legend">

          <span>
            <i class="legend-dot online"></i>
            Online
          </span>

          <span>
            <i class="legend-dot processing"></i>
            Processing
          </span>

          <span>
            <i class="legend-dot warning"></i>
            Warning
          </span>

        </div>

        <span class="footer-hint">
          Hover a node to trace its signal
        </span>

      </footer>

    </section>

  </main>


  <script>

    const nodes = document.querySelectorAll(".node");
    const connections = document.querySelectorAll(".connection");
    const detailPanel = document.querySelector(".detail-panel");
    const closeButton = document.querySelector(".close-detail");

    const nodeData = {

      core: {
        name: "Core",
        role: "Coordinator",
        symbol: "✦",
        status: "ONLINE",
        load: "68%",
        latency: "18ms"
      },

      vision: {
        name: "Vision",
        role: "Processing",
        symbol: "◈",
        status: "PROCESSING",
        load: "81%",
        latency: "32ms"
      },

      memory: {
        name: "Memory",
        role: "Storage",
        symbol: "⬡",
        status: "ONLINE",
        load: "46%",
        latency: "11ms"
      },

      engine: {
        name: "Engine",
        role: "Processing",
        symbol: "△",
        status: "PROCESSING",
        load: "73%",
        latency: "27ms"
      },

      gateway: {
        name: "Gateway",
        role: "External Interface",
        symbol: "⌁",
        status: "WARNING",
        load: "91%",
        latency: "74ms"
      }

    };


    function clearConnections() {

      connections.forEach(connection => {
        connection.classList.remove("active");
        connection.classList.remove("muted");
      });

    }


    function highlightNode(nodeId) {

      clearConnections();

      nodes.forEach(node => {

        if (node.dataset.node !== nodeId) {
          node.classList.add("dimmed");
        }

      });


      connections.forEach(connection => {

        const from = connection.dataset.from;
        const to = connection.dataset.to;

        if (from === nodeId || to === nodeId) {

          connection.classList.add("active");

        } else {

          connection.classList.add("muted");

        }

      });

    }


    function resetNetwork() {

      nodes.forEach(node => {
        node.classList.remove("dimmed");
      });

      clearConnections();

    }


    function openDetails(nodeId) {

      const data = nodeData[nodeId];

      detailPanel.querySelector(".detail-symbol").textContent =
        data.symbol;

      detailPanel.querySelector("h2").textContent =
        data.name;

      detailPanel.querySelector(".detail-content p").textContent =
        data.role;

      const stats =
        detailPanel.querySelectorAll(".detail-stats strong");

      stats[0].textContent = data.status;
      stats[1].textContent = data.load;
      stats[2].textContent = data.latency;

      detailPanel.classList.add("visible");

    }


    nodes.forEach(node => {

      node.addEventListener("mouseenter", () => {

        highlightNode(node.dataset.node);

      });


      node.addEventListener("mouseleave", () => {

        resetNetwork();

      });


      node.addEventListener("click", () => {

        openDetails(node.dataset.node);

      });

    });


    closeButton.addEventListener("click", () => {

      detailPanel.classList.remove("visible");

    });


  </script>

</body>
</html>
