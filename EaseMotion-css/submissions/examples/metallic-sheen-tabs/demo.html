<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metallic Sheen Tabs</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>Metallic Sheen Tabs</h1>

    <div class="tabs">
        <input type="radio" name="tab" id="tab1" checked>
        <label for="tab1">Overview</label>

        <input type="radio" name="tab" id="tab2">
        <label for="tab2">Analytics</label>

        <input type="radio" name="tab" id="tab3">
        <label for="tab3">Settings</label>

        <input type="radio" name="tab" id="tab4">
        <label for="tab4">Profile</label>
    </div>

    <div class="content">
        <div class="panel panel1">
            <h2>Overview</h2>
            <p>Premium metallic segmented tabs built with pure HTML and CSS.</p>
        </div>

        <div class="panel panel2">
            <h2>Analytics</h2>
            <p>Smooth transitions and GPU-accelerated animations.</p>
        </div>

        <div class="panel panel3">
            <h2>Settings</h2>
            <p>Dark mode compatible with elegant chrome-inspired styling.</p>
        </div>

        <div class="panel panel4">
            <h2>Profile</h2>
            <p>Accessible radio-based tabs requiring no JavaScript.</p>
        </div>
    </div>
</div>

</body>
</html>
