<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Slide Animation Reduced-Motion Audit</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="demo">
      <h1>Slide Animation Reduced-Motion Audit</h1>
      <button type="button" id="btn">Toggle panel</button>
      <div id="panel">Slide panel content</div>
    </main>
    <script type="module">
      import { SlideAudit } from './script.js';
      const a = new SlideAudit(document.getElementById('panel'));
      document.getElementById('btn').addEventListener('click', () => a.toggle());
      window.__slideAudit = a;
    </script>
  </body>
</html>
