<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retro 8-Bit Arcade Pixel Loader | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
  <main class="arcade-container">
    <header class="arcade-header">
      <div class="coin-blink">INSERT COIN [CREDIT 99]</div>
      <h1 class="arcade-title">STAGE LOADING</h1>
    </header>

    <section class="loader-stage">
      <div class="pixel-arcade-card">
        <!-- Pixel Sprite Animation -->
        <div class="pixel-sprite-wrapper">
          <div class="pixel-pacman"></div>
          <div class="pixel-ghost"></div>
        </div>

        <!-- Segmented 8-Bit Progress Bar -->
        <div class="pixel-progress-outer">
          <div class="pixel-progress-fill"></div>
        </div>

        <div class="pixel-status">
          <span class="loading-text">LOADING STAGE 1-1...</span>
          <span class="percent-counter">88%</span>
        </div>
      </div>
    </section>

    <footer class="arcade-footer">
      <p>© 1984 EASEMOTION ARCADE CORP // PURE CSS RETRO UI</p>
    </footer>
  </main>
</body>
</html>
