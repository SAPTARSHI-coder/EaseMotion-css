<head>

  <title>Infinite Marquee Banner Carousel - EaseMotion CSS</title>

<body>

        <div class="marquee-item">⚡ WebGL</div>
        <div class="marquee-item">🎨 Tailwind</div>
        <div class="marquee-item">💎 EaseMotion</div>
        <div class="marquee-item">🔥 Firebase</div>
        <div class="marquee-item">🌐 GraphQL</div>
        
        <!-- Duplicated track items for smooth seamless looping -->
        <div class="marquee-item">🚀 Next.js</div>
        <div class="marquee-item">⚡ WebGL</div>
        <div class="marquee-item">🎨 Tailwind</div>
        <div class="marquee-item">💎 EaseMotion</div>
        <div class="marquee-item">🔥 Firebase</div>
        <div class="marquee-item">🌐 GraphQL</div>
      </div>
    </div>
  </div>
</body>
</html>
