<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prism Lens</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="prism-page">

  <section class="prism-panel">

    <div class="copy">
      <span class="eyebrow">OPTICAL INTERACTION</span>
      <h1>Prism Lens</h1>
      <p>
        Move across the surface and explore the glass.
      </p>

      <button id="pulseButton">Trigger Pulse</button>
    </div>

    <div class="lens-stage" id="stage">

      <div class="color-field">
        <span></span>
        <span></span>
        <span></span>
      </div>

      <div class="lens" id="lens">

        <div class="lens-glass"></div>

        <div class="lens-refraction refraction-one"></div>
        <div class="lens-refraction refraction-two"></div>
        <div class="lens-refraction refraction-three"></div>

        <div class="lens-highlight"></div>
        <div class="lens-edge"></div>

        <div class="lens-center"></div>

      </div>

    </div>

  </section>

  <p class="instructions">
    Move your pointer · Click for optical pulse · Space also triggers pulse
  </p>

</main>

<script>
  const stage = document.getElementById("stage");
  const lens = document.getElementById("lens");
  const pulseButton = document.getElementById("pulseButton");

  let targetX = 0;
  let targetY = 0;
  let currentX = 0;
  let currentY = 0;

  let pointerX = 0;
  let pointerY = 0;

  function updateTarget(event) {
    const rect = stage.getBoundingClientRect();

    targetX = event.clientX - rect.left;
    targetY = event.clientY - rect.top;

    pointerX = event.clientX;
    pointerY = event.clientY;
  }

  stage.addEventListener("pointermove", updateTarget);

  function animate() {
    currentX += (targetX - currentX) * 0.12;
    currentY += (targetY - currentY) * 0.12;

    const dx = targetX - currentX;
    const dy = targetY - currentY;

    const rotate = Math.max(
      -12,
      Math.min(12, dx * 0.04)
    );

    lens.style.transform =
      `translate3d(${currentX}px, ${currentY}px, 0)
       translate(-50%, -50%)
       rotate(${rotate}deg)`;

    lens.style.setProperty(
      "--shine-x",
      `${50 + dx * 0.5}%`
    );

    lens.style.setProperty(
      "--shine-y",
      `${50 + dy * 0.5}%`
    );

    requestAnimationFrame(animate);
  }

  function pulse() {
    lens.classList.remove("is-pulsing");

    void lens.offsetWidth;

    lens.classList.add("is-pulsing");
  }

  stage.addEventListener("pointerdown", pulse);
  pulseButton.addEventListener("click", pulse);

  document.addEventListener("keydown", event => {
    if (event.code === "Space") {
      event.preventDefault();
      pulse();
    }
  });

  targetX = stage.clientWidth / 2;
  targetY = stage.clientHeight / 2;

  animate();
</script>

</body>
</html>
