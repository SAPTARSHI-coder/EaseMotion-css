<!-- EaseMotion component: subway-train-map -->
<!DOCTYPE html>
<html lang="en" data-train="subway">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, maximum-scale=1.0, initial-scale=1.0">
<title>Ease Subway Train Map</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="transit-map">
  <header class="map-head">
    <span class="map-title">METRO LINES</span>
    <span class="map-note">LIVE</span>
  </header>
  <div class="map-canvas">
    <span class="route r-red"></span>
    <span class="route r-blue"></span>
    <span class="route r-green"></span>
    <i class="station st-1"></i>
    <i class="station st-2"></i>
    <i class="station st-3"></i>
    <i class="station st-4"></i>
    <i class="station st-5"></i>
    <i class="station st-6"></i>
    <div class="train-marker">
      <i class="train-cab"></i>
    </div>
  </div>
  <footer class="map-foot">
    <span class="next-stop">NEXT: CENTRAL STN</span>
  </footer>
</main>
</body>
</html>
