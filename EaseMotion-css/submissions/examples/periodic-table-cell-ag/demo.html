<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Periodic Table Cell — EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="demo-container">
    <header class="demo-header">
      <h1>Periodic Table Cell</h1>
      <p>Pure CSS interactive periodic table element cell with responsive atomic data layout</p>
    </header>

    <section class="cells-grid" aria-label="Periodic Table Element Examples">

      <article class="periodic-cell transition-metal" tabindex="0" aria-label="Gold, Element 79, Atomic Mass 196.97 u, Transition Metal">
        <div class="cell-header">
          <span class="cell-number">79</span>
          <span class="cell-category">Transition Metal</span>
        </div>
        <div class="cell-body">
          <span class="cell-symbol">Au</span>
          <span class="cell-name">Gold</span>
        </div>
        <div class="cell-footer">
          <span class="cell-mass">196.97</span>
          <span class="cell-config">[Xe] 4f¹⁴ 5d¹⁰ 6s¹</span>
        </div>
      </article>

      <article class="periodic-cell reactive-nonmetal" tabindex="0" aria-label="Carbon, Element 6, Atomic Mass 12.011 u, Reactive Nonmetal">
        <div class="cell-header">
          <span class="cell-number">6</span>
          <span class="cell-category">Nonmetal</span>
        </div>
        <div class="cell-body">
          <span class="cell-symbol">C</span>
          <span class="cell-name">Carbon</span>
        </div>
        <div class="cell-footer">
          <span class="cell-mass">12.011</span>
          <span class="cell-config">[He] 2s² 2p²</span>
        </div>
      </article>

      <article class="periodic-cell noble-gas" tabindex="0" aria-label="Helium, Element 2, Atomic Mass 4.0026 u, Noble Gas">
        <div class="cell-header">
          <span class="cell-number">2</span>
          <span class="cell-category">Noble Gas</span>
        </div>
        <div class="cell-body">
          <span class="cell-symbol">He</span>
          <span class="cell-name">Helium</span>
        </div>
        <div class="cell-footer">
          <span class="cell-mass">4.0026</span>
          <span class="cell-config">1s²</span>
        </div>
      </article>

      <article class="periodic-cell alkali-metal" tabindex="0" aria-label="Lithium, Element 3, Atomic Mass 6.94 u, Alkali Metal">
        <div class="cell-header">
          <span class="cell-number">3</span>
          <span class="cell-category">Alkali Metal</span>
        </div>
        <div class="cell-body">
          <span class="cell-symbol">Li</span>
          <span class="cell-name">Lithium</span>
        </div>
        <div class="cell-footer">
          <span class="cell-mass">6.94</span>
          <span class="cell-config">[He] 2s¹</span>
        </div>
      </article>

    </section>
  </main>

</body>
</html>
