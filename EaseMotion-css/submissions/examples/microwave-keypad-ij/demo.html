<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-microwave-keypad</title>
</head>
<body>
<main class="mkp-oven">
  <header class="mkp-top">
    <h1 class="mkp-model">WaveMaster</h1>
    <span class="mkp-door">Door closed</span>
  </header>
  <section class="mkp-screen" aria-label="microwave display">
    <strong class="mkp-time">01:30</strong>
    <span class="mkp-watts">1000W</span>
  </section>
  <section class="mkp-keys" aria-label="number keypad">
    <span class="mkp-key">1</span>
    <span class="mkp-key">2</span>
    <span class="mkp-key">3</span>
    <span class="mkp-key">4</span>
    <span class="mkp-key">5</span>
    <span class="mkp-key">6</span>
    <span class="mkp-key">7</span>
    <span class="mkp-key">8</span>
    <span class="mkp-key">9</span>
  </section>
  <footer class="mkp-foot">
    <span class="mkp-start">Start</span>
    <span class="mkp-stop">Stop</span>
  </footer>
</main>
</body>
</html>
