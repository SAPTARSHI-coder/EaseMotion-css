<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kinetoscope Reel Advance — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Kinetoscope Reel Advance demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Kinetoscope Reel Advance</h1>
      <p class="lede">Kinetoscope reel advancing frame-by-frame</p>
    </header>

    <section class="ease-kinetoscope-reel-advance" data-demo="kinetoscope-reel-advance" aria-live="polite">
      <div class="ease-kinetoscope-reel-advance__housing">
        <div class="ease-kinetoscope-reel-advance__bezel">
          <div class="ease-kinetoscope-reel-advance__face">
            <div class="ease-kinetoscope-reel-advance__readout">
              <span class="ease-kinetoscope-reel-advance__label">Kinetoscope Reel Advance</span>
              <span class="ease-kinetoscope-reel-advance__value">LIVE</span>
            </div>
            <div class="ease-kinetoscope-reel-advance__motion" aria-hidden="true">
              <span class="ease-kinetoscope-reel-advance__a"></span>
              <span class="ease-kinetoscope-reel-advance__b"></span>
              <span class="ease-kinetoscope-reel-advance__c"></span>
              <span class="ease-kinetoscope-reel-advance__d"></span>
            </div>
            <div class="ease-kinetoscope-reel-advance__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-kinetoscope-reel-advance__controls">
          <button type="button" class="ease-kinetoscope-reel-advance__btn primary">Engage</button>
          <button type="button" class="ease-kinetoscope-reel-advance__btn">Reset</button>
          <label class="ease-kinetoscope-reel-advance__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-kinetoscope-reel-advance__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
