<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Variational Quantum Eigensolver VQE - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css"></head><body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030712; color: #ffffff;">

    <div class="ease-card ease-card-glass vqe-container">
        <div class="vqe-header">
            <h2>VQE Optimization</h2>
            <span class="ease-badge ease-badge-success">Optimizing</span>
        </div>
        
        <div class="vqe-screen ease-center">
            <div class="vqe-flux flux-vqe-a"></div>
            <div class="vqe-flux flux-vqe-b"></div>
            <div class="vqe-boundary-ring"></div>
            <div class="vqe-core ease-center"></div>
        </div>

        <div class="vqe-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Ansatz Parameter Tuning &amp; Ground State</span>
            <button class="ease-btn ease-btn-success ease-btn-sm ease-hover-grow">Run VQE Loop</button>
        </div>
    </div></body></html>
