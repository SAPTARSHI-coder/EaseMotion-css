<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Morphing Shape Floating Badge</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="background"></div>

<section class="container">

<div class="badge-card">

<span class="badge-shape"></span>

<div class="badge-content">

<span class="label">
High-Contrast Accessibility Edition
</span>

<h1>
Morphing Floating
<span>Gradient Badge</span>
</h1>

<p>
A floating badge component featuring smooth morphing shapes,
animated gradients, accessible high-contrast colors, and
responsive interactions.
</p>

<div class="stats">

<div class="stat">
<h2>99%</h2>
<span>Accessibility</span>
</div>

<div class="stat">
<h2>120+</h2>
<span>Templates</span>
</div>

<div class="stat">
<h2>24/7</h2>
<span>Support</span>
</div>

</div>

<div class="actions">

<button class="primary-btn">
Explore
</button>

<button class="secondary-btn">
Learn More
</button>

</div>

</div>

</div>

</section>

<script src="script.js"></script>

</body>
</html>
