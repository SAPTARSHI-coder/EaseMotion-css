<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-vending-machine-dispense demo</title>
</head>
<body>
<div class="vm-app">
  <div class="vm-machine">
    <div class="vm-head">
      <div class="vm-name">SNACKS</div>
      <div class="vm-slot"></div>
    </div>
    <div class="vm-window">
      <div class="vm-shelf vm-shelf-1">
        <span class="vm-can vm-can-1"></span>
        <span class="vm-can vm-can-2"></span>
      </div>
      <div class="vm-shelf vm-shelf-2">
        <span class="vm-can vm-can-3"></span>
        <span class="vm-can vm-can-4"></span>
      </div>
    </div>
    <div class="vm-panel">
      <button class="vm-btn vm-btn-1">A1</button>
      <button class="vm-btn vm-btn-2">A2</button>
      <button class="vm-btn vm-btn-3">B1</button>
    </div>
    <div class="vm-chute">
      <span class="vm-drop"></span>
    </div>
    <div class="vm-leg vm-leg-1"></div>
    <div class="vm-leg vm-leg-2"></div>
  </div>
</div>
</body>
</html>
