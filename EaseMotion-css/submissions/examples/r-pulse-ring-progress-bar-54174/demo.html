<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Pulse-Ring Progress Bar</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<section class="dashboard">

    <div class="card">

        <h1>Performance Dashboard</h1>
        <p>Team completion status</p>

        <div class="progress-item">

            <div class="progress-info">
                <span>Frontend</span>
                <span>94%</span>
            </div>

            <div class="progress-bar">
                <div class="progress-fill frontend">
                    <span class="pulse-ring"></span>
                </div>
            </div>

        </div>

        <div class="progress-item">

            <div class="progress-info">
                <span>Backend</span>
                <span>78%</span>
            </div>

            <div class="progress-bar">
                <div class="progress-fill backend">
                    <span class="pulse-ring"></span>
                </div>
            </div>

        </div>

        <div class="progress-item">

            <div class="progress-info">
                <span>Testing</span>
                <span>63%</span>
            </div>

            <div class="progress-bar">
                <div class="progress-fill testing">
                    <span class="pulse-ring"></span>
                </div>
            </div>

        </div>

        <div class="progress-item">

            <div class="progress-info">
                <span>Deployment</span>
                <span>48%</span>
            </div>

            <div class="progress-bar">
                <div class="progress-fill deploy">
                    <span class="pulse-ring"></span>
                </div>
            </div>

        </div>

    </div>

</section>

</body>
</html>
