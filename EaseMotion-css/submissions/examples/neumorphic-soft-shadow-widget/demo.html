<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Neumorphic Soft Shadow dashboard widget built with pure HTML and Vanilla CSS."
  >
  <title>Neumorphic Soft Shadow Widget</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">
    <section class="dashboard" aria-labelledby="dashboard-title">

      <header class="dashboard-header">
        <div>
          <p class="eyebrow">DAILY OVERVIEW</p>
          <h1 id="dashboard-title">System Monitor</h1>
        </div>

        <div class="status" aria-label="System status: operational">
          <span class="status-dot" aria-hidden="true"></span>
          Operational
        </div>
      </header>

      <div class="hero-card">
        <div class="hero-icon" aria-hidden="true">
          <span></span>
        </div>

        <div class="hero-info">
          <span class="label">SYSTEM HEALTH</span>
          <strong>92%</strong>
          <p>Everything is running smoothly</p>
        </div>

        <div class="health-ring" aria-hidden="true">
          <span>92</span>
        </div>
      </div>

      <div class="stats-grid">

        <article class="stat-card">
          <div class="stat-icon cpu" aria-hidden="true">CPU</div>
          <span class="stat-label">CPU Usage</span>
          <strong>38%</strong>
          <div class="meter">
            <span style="--progress: 38%"></span>
          </div>
        </article>

        <article class="stat-card">
          <div class="stat-icon memory" aria-hidden="true">RAM</div>
          <span class="stat-label">Memory</span>
          <strong>64%</strong>
          <div class="meter">
            <span style="--progress: 64%"></span>
          </div>
        </article>

        <article class="stat-card">
          <div class="stat-icon storage" aria-hidden="true">SSD</div>
          <span class="stat-label">Storage</span>
          <strong>47%</strong>
          <div class="meter">
            <span style="--progress: 47%"></span>
          </div>
        </article>

        <article class="stat-card">
          <div class="stat-icon network" aria-hidden="true">NET</div>
          <span class="stat-label">Network</span>
          <strong>81%</strong>
          <div class="meter">
            <span style="--progress: 81%"></span>
          </div>
        </article>

      </div>

      <div class="activity-card">
        <div class="section-heading">
          <div>
            <span class="label">ACTIVITY</span>
            <h2>Performance</h2>
          </div>

          <span class="period">24H</span>
        </div>

        <div class="chart" aria-label="Performance activity chart">
          <span style="--height: 38%"></span>
          <span style="--height: 55%"></span>
          <span style="--height: 47%"></span>
          <span style="--height: 68%"></span>
          <span style="--height: 61%"></span>
          <span style="--height: 78%"></span>
          <span style="--height: 72%"></span>
          <span style="--height: 91%"></span>
          <span style="--height: 82%"></span>
          <span style="--height: 88%"></span>
          <span style="--height: 74%"></span>
          <span style="--height: 94%"></span>
        </div>
      </div>

      <button class="refresh-button" type="button">
        <span class="refresh-icon" aria-hidden="true">↻</span>
        Refresh Dashboard
      </button>

    </section>
  </main>

</body>
</html>
