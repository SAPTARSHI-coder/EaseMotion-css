<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Glassmorphism Glow Card</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="ease-showcase-container">
        <div class="glass-card">
            <div class="glow-orb"></div>
            <div class="glass-content">
                <div class="card-icon">✨</div>
                <h3 class="card-title">Premium Glow</h3>
                <p class="card-description">Experience a beautiful pure CSS glassmorphism card featuring a dynamic glowing orb that reacts smoothly to your interactions.</p>
                <button class="card-btn">Explore Now</button>
            </div>
        </div>
    </div>
</body>
</html>
