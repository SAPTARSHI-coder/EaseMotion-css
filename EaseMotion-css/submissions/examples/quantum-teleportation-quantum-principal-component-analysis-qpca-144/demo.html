<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Principal Component Analysis QPCA - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css"></head><body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030712; color: #ffffff;">

    <div class="ease-card ease-card-glass qpca-container">
        <div class="qpca-header">
            <h2>Quantum PCA (QPCA)</h2>
            <span class="ease-badge ease-badge-success">Quantum Machine Learning</span>
        </div>
        
        <div class="qpca-screen ease-center">
            <div class="qpca-flux flux-qpca-a"></div>
            <div class="qpca-flux flux-qpca-b"></div>
            <div class="qpca-boundary-ring"></div>
            <div class="qpca-core ease-center"></div>
        </div>

        <div class="qpca-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Density Matrix Estimation &amp; Eigenvalues</span>
            <button class="ease-btn ease-btn-success ease-btn-sm ease-hover-grow">Run QPCA Projection</button>
        </div>
    </div></body></html>
