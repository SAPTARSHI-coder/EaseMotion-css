<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Interactive neumorphic heatmap grid with tooltip hover states">
  <title>Neumorphic Interactive Heatmap</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="page">
    <section class="heatmap-card">

      <div class="header">
        <div>
          <p class="eyebrow">ACTIVITY ANALYTICS</p>
          <h1>Interactive Heatmap</h1>
          <p class="subtitle">
            Hover over a cell to explore activity levels.
          </p>
        </div>

        <div class="status">
          <span></span>
          Live Data
        </div>
      </div>

      <div class="heatmap-wrapper">
        <div class="days">
          <span>Mon</span>
          <span>Tue</span>
          <span>Wed</span>
          <span>Thu</span>
          <span>Fri</span>
          <span>Sat</span>
          <span>Sun</span>
        </div>

        <div class="heatmap" id="heatmap"></div>
      </div>

      <div class="legend">
        <span>Less</span>
        <i class="level level-0"></i>
        <i class="level level-1"></i>
        <i class="level level-2"></i>
        <i class="level level-3"></i>
        <i class="level level-4"></i>
        <span>More</span>
      </div>

      <div class="summary">
        <div>
          <strong id="total">0</strong>
          <span>Total Activity</span>
        </div>

        <div>
          <strong id="peak">0</strong>
          <span>Peak Activity</span>
        </div>

        <div>
          <strong>28</strong>
          <span>Active Days</span>
        </div>
      </div>

    </section>
  </main>

  <script>
    const heatmap = document.getElementById("heatmap");
    const totalElement = document.getElementById("total");
    const peakElement = document.getElementById("peak");

    const values = [
      12, 35, 67, 21, 88, 45, 72,
      24, 51, 93, 38, 76, 18, 64,
      82, 29, 55, 97, 43, 69, 31,
      15, 74, 48, 90, 36, 61, 84,
      42, 23, 71, 95, 54, 37, 80,
      19, 63, 46, 87, 28, 73, 58,
      34, 91, 52, 66, 27, 79, 41,
      57, 32, 86, 49, 68, 22, 94
    ];

    const days = [
      "Monday",
      "Tuesday",
      "Wednesday",
      "Thursday",
      "Friday",
      "Saturday",
      "Sunday"
    ];

    function getLevel(value) {
      if (value < 20) return 0;
      if (value < 40) return 1;
      if (value < 60) return 2;
      if (value < 80) return 3;
      return 4;
    }

    values.forEach((value, index) => {
      const cell = document.createElement("button");

      cell.className = `cell level-${getLevel(value)}`;
      cell.setAttribute("aria-label", `${days[index % 7]}: ${value} activities`);

      const tooltip = document.createElement("span");
      tooltip.className = "tooltip";
      tooltip.textContent = `${value} activities`;

      cell.appendChild(tooltip);
      heatmap.appendChild(cell);
    });

    const total = values.reduce((sum, value) => sum + value, 0);
    const peak = Math.max(...values);

    totalElement.textContent = total;
    peakElement.textContent = peak;
  </script>

</body>
</html>
