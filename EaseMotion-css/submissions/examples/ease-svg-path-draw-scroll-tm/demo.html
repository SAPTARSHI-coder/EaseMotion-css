<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SVG Path Draw | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="spd-root">
    <svg class="spd-svg" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path class="spd-path"
        d="M20,100 C40,40 80,40 100,100 C120,160 160,160 180,100"
        stroke="#6366f1" stroke-width="4" stroke-linecap="round"/>
      <path class="spd-path-accent"
        d="M40,100 L80,60 L120,140 L160,100"
        stroke="#ec4899" stroke-width="3"
        stroke-linecap="round" stroke-linejoin="round"/>
      <circle class="spd-circle" cx="100" cy="100" r="30"
        stroke="#06b6d4" stroke-width="3"/>
    </svg>
    <p class="spd-sub">SVG stroke-dashoffset animation for path drawing effect</p>
  </div>
</body>
</html>
