<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Shimmering metallic foil text effect using CSS masking and animated gradients."
  >

  <title>Metallic Foil Text Effect</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="page">

    <section class="hero" aria-labelledby="title">

      <span class="eyebrow">
        CSS MASKING • GRADIENT ANIMATION
      </span>

      <h1 id="title" class="foil-text">
        SHIMMER
      </h1>

      <p class="subtitle">
        A vibrant metallic foil text effect powered entirely by CSS.
      </p>

      <div class="controls">

        <button
          type="button"
          class="control-button"
          id="replayButton"
        >
          Replay Shimmer
        </button>

        <button
          type="button"
          class="control-button secondary"
          id="pauseButton"
          aria-pressed="false"
        >
          Pause
        </button>

      </div>

      <p class="hint">
        Hover over the text for an additional metallic glow.
      </p>

    </section>

  </main>

  <script>
    const foilText = document.querySelector(".foil-text");
    const replayButton = document.getElementById("replayButton");
    const pauseButton = document.getElementById("pauseButton");

    replayButton.addEventListener("click", () => {
      foilText.classList.remove("replay");

      void foilText.offsetWidth;

      foilText.classList.add("replay");
    });

    pauseButton.addEventListener("click", () => {
      const isPaused = foilText.classList.toggle("paused");

      pauseButton.textContent = isPaused
        ? "Resume"
        : "Pause";

      pauseButton.setAttribute(
        "aria-pressed",
        String(isPaused)
      );
    });
  </script>

</body>
</html>
