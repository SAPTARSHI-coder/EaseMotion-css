<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fade Toast Example</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="demo-container-ag">
    <button onclick="showToast()" class="trigger-btn-ag">Show Toast</button>
  </div>

  <div id="toast-container-ag" class="toast-container-ag" aria-live="polite" aria-atomic="true"></div>

  <script>
    let toastTimeout;
    function showToast() {
      clearTimeout(toastTimeout);
      const container = document.getElementById('toast-container-ag');
      container.innerHTML = '';

      const toast = document.createElement('div');
      toast.className = 'fade-toast-ag';
      toast.setAttribute('role', 'status');
      toast.innerHTML = `
        <span class="toast-icon-ag">ℹ️</span>
        <span class="toast-text-ag">Your settings have been saved.</span>
      `;
      container.appendChild(toast);

      toastTimeout = setTimeout(() => {
        toast.classList.add('is-hiding-ag');
        setTimeout(() => container.innerHTML = '', 400); // Wait for fade out
      }, 3000);
    }
  </script>
</body>
</html>
