<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-thermostat-control</title>
</head>
<body>
<main class="thc-card">
  <header class="thc-head">
    <h1 class="thc-title">HomeTherm</h1>
    <span class="thc-sched">Schedule 1</span>
  </header>
  <section class="thc-face" aria-label="thermostat face">
    <span class="thc-dial">
      <span class="thc-notch"></span>
      <span class="thc-center">
        <strong class="thc-target">72°F</strong>
        <span class="thc-room">inside 74°F</span>
      </span>
    </span>
    <span class="thc-flame"></span>
    <span class="thc-flake"></span>
  </section>
  <section class="thc-keys" aria-label="mode keys">
    <span class="thc-key thc-key-heat">Heat</span>
    <span class="thc-key">Cool</span>
    <span class="thc-key">Fan</span>
    <span class="thc-key">Auto</span>
  </section>
  <section class="thc-read" aria-label="system readout">
    <span class="thc-state">Heating</span>
    <span class="thc-hum">42% RH</span>
  </section>
  <footer class="thc-foot">
    <span class="thc-hold">Hold 2h</span>
    <span class="thc-eco">Eco</span>
  </footer>
</main>
</body>
</html>
