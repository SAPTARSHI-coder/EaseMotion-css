<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Growing Vine – Vine Grows and Wraps Around Element</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <h1>🌿 Growing Vine</h1>
    <p class="subtitle">Vine grows and wraps around the element</p>

    <div class="vine-container">
      <div class="vine-stage" id="vineStage">
        <canvas id="canvas"></canvas>
        
        <!-- Center element -->
        <div class="center-element" id="centerElement">
          <div class="element-content">
            <span class="element-icon">🌿</span>
            <span class="element-label">Vine</span>
          </div>
        </div>

        <!-- Info overlay -->
        <div class="info-overlay">
          <span class="vine-status" id="vineStatus">🌱 Growing</span>
          <span class="vine-length" id="vineLength">✦ 0 nodes</span>
        </div>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <button class="ctrl-btn grow" id="growBtn">🌱 Grow</button>
      <button class="ctrl-btn clear" id="clearBtn">🗑️ Clear</button>
      <button class="ctrl-btn toggle" id="toggleBtn">⏸ Pause</button>
      <button class="ctrl-btn reset" id="resetBtn">↺ Reset</button>
    </div>

    <!-- Sliders -->
    <div class="slider-container">
      <span class="slider-label">Growth Speed</span>
      <input type="range" id="speedSlider" min="1" max="10" value="5" />
      <span class="slider-value" id="speedValue">5×</span>
    </div>

    <div class="slider-container">
      <span class="slider-label">Vine Length</span>
      <input type="range" id="lengthSlider" min="10" max="60" value="30" />
      <span class="slider-value" id="lengthValue">30</span>
    </div>

    <div class="slider-container">
      <span class="slider-label">Wrap Tightness</span>
      <input type="range" id="wrapSlider" min="0" max="100" value="50" />
      <span class="slider-value" id="wrapValue">50%</span>
    </div>

    <div class="slider-container">
      <span class="slider-label">Leaf Density</span>
      <input type="range" id="leafSlider" min="0" max="100" value="60" />
      <span class="slider-value" id="leafValue">60%</span>
    </div>

    <!-- Status -->
    <div class="status" id="status">🌱 Vine growing and wrapping around the element</div>

    <!-- Keyboard shortcuts -->
    <div class="shortcuts">
      <kbd>G</kbd> Grow · <kbd>C</kbd> Clear · <kbd>Space</kbd> Pause · <kbd>R</kbd> Reset
    </div>
  </div>

  <script>
    (function() {
      "use strict";

      // DOM elements
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      const vineStatus = document.getElementById('vineStatus');
      const vineLength = document.getElementById('vineLength');
      const growBtn = document.getElementById('growBtn');
      const clearBtn = document.getElementById('clearBtn');
      const toggleBtn = document.getElementById('toggleBtn');
      const resetBtn = document.getElementById('resetBtn');
      const status = document.getElementById('status');
      const speedSlider = document.getElementById('speedSlider');
      const speedValue = document.getElementById('speedValue');
      const lengthSlider = document.getElementById('lengthSlider');
      const lengthValue = document.getElementById('lengthValue');
      const wrapSlider = document.getElementById('wrapSlider');
      const wrapValue = document.getElementById('wrapValue');
      const leafSlider = document.getElementById('leafSlider');
      const leafValue = document.getElementById('leafValue');

      // State
      let vineNodes = [];
      let leaves = [];
      let isPaused = false;
      let animationId = null;
      let time = 0;
      let growthProgress = 0;
      let isGrowing = true;

      // ----- Canvas setup -----
      function setupCanvas() {
        const rect = canvas.parentElement.getBoundingClientRect();
        const size = Math.min(rect.width - 40, 600);
        canvas.width = size;
        canvas.height = size;
        canvas.style.width = size + 'px';
        canvas.style.height = size + 'px';
      }

      // ----- Vine node class -----
      class VineNode {
        constructor(x, y, angle, parent = null) {
          this.x = x;
          this.y = y;
          this.angle = angle;
          this.parent = parent;
          this.children = [];
          this.length = 0;
          this.growth = 0;
          this.alive = true;
          this.leafCount = 0;
          this.leafPositions = [];
        }

        update(speedMult) {
          if (!this.alive) return;
          this.growth += 0.02 * speedMult;
          if (this.growth >= 1) {
            this.growth = 1;
            this.alive = false;
            // Spawn children
            const numChildren = 1 + Math.floor(Math.random() * 2);
            for (let i = 0; i < numChildren; i++) {
              const childAngle = this.angle + (Math.random() - 0.5) * 1.2;
              const childLength = 15 + Math.random() * 25;
              const child = new VineNode(
                this.x + Math.cos(childAngle) * childLength,
                this.y + Math.sin(childAngle) * childLength,
                childAngle,
                this
              );
              child.length = childLength;
              this.children.push(child);
            }
          }
        }

        draw(ctx, progress) {
          if (this.growth === 0) return;
          
          const drawProgress = this.growth;
          const alpha = 0.5 + 0.5 * drawProgress;
          
          // Draw stem
          if (this.parent) {
            const x1 = this.parent.x;
            const y1 = this.parent.y;
            const x2 = this.x;
            const y2 = this.y;
            
            // Glow
            const glowGrad = ctx.createRadialGradient(
              (x1 + x2) / 2, (y1 + y2) / 2, 0,
              (x1 + x2) / 2, (y1 + y2) / 2, 8
            );
            glowGrad.addColorStop(0, `rgba(50, 200, 100, ${alpha * 0.05})`);
            glowGrad.addColorStop(1, `rgba(50, 200, 100, 0)`);
            ctx.fillStyle = glowGrad;
            ctx.beginPath();
            ctx.arc((x1 + x2) / 2, (y1 + y2) / 2, 8, 0, Math.PI * 2);
            ctx.fill();
            
            // Stem line
            const width = 2 + 3 * drawProgress;
            ctx.shadowColor = `rgba(50, 200, 100, ${alpha * 0.1})`;
            ctx.shadowBlur = 5;
            ctx.strokeStyle = `rgba(34, 139, 34, ${alpha * 0.9})`;
            ctx.lineWidth = width;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.stroke();
            ctx.shadowBlur = 0;
          }

          // Draw leaves
          this.leafPositions.forEach((leaf, index) => {
            const leafProgress = Math.min(1, (drawProgress - 0.3) * 2);
            if (leafProgress > 0) {
              const leafAlpha = alpha * leafProgress * 0.8;
              const size = 4 + 6 * leafProgress;
              const angle = leaf.angle + Math.sin(time + index) * 0.2;
              
              // Leaf glow
              const leafGlow = ctx.createRadialGradient(
                leaf.x, leaf.y, 0,
                leaf.x, leaf.y, size * 2
              );
              leafGlow.addColorStop(0, `rgba(50, 200, 100, ${leafAlpha * 0.1})`);
              leafGlow.addColorStop(1, `rgba(50, 200, 100, 0)`);
              ctx.fillStyle = leafGlow;
              ctx.beginPath();
              ctx.arc(leaf.x, leaf.y, size * 2, 0, Math.PI * 2);
              ctx.fill();
              
              // Leaf body
              ctx.save();
              ctx.translate(leaf.x, leaf.y);
              ctx.rotate(angle);
              ctx.scale(1 + 0.2 * Math.sin(time + index * 0.5), 1);
              
              ctx.shadowColor = `rgba(50, 200, 100, ${leafAlpha * 0.1})`;
              ctx.shadowBlur = 8;
              const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, size);
              grad.addColorStop(0, `rgba(60, 220, 120, ${leafAlpha * 0.9})`);
              grad.addColorStop(0.5, `rgba(40, 180, 80, ${leafAlpha * 0.8})`);
              grad.addColorStop(1, `rgba(20, 120, 50, ${leafAlpha * 0.6})`);
              ctx.fillStyle = grad;
              
              ctx.beginPath();
              ctx.moveTo(0, -size * 0.8);
              ctx.quadraticCurveTo(size * 0.7, -size * 0.3, size * 0.4, size * 0.2);
              ctx.quadraticCurveTo(0, size * 0.6, -size * 0.4, size * 0.2);
              ctx.quadraticCurveTo(-size * 0.7, -size * 0.3, 0, -size * 0.8);
              ctx.closePath();
              ctx.fill();
              
              // Leaf vein
              ctx.shadowBlur = 0;
              ctx.strokeStyle = `rgba(20, 80, 40, ${leafAlpha * 0.3})`;
              ctx.lineWidth = 0.5;
              ctx.beginPath();
              ctx.moveTo(0, -size * 0.6);
              ctx.lineTo(0, size * 0.4);
              ctx.stroke();
              
              ctx.restore();
            }
          });
        }

        addLeaf(x, y, angle) {
          this.leafPositions.push({ x, y, angle });
        }
      }

      // ----- Generate vine -----
      function generateVine() {
        const w = canvas.width;
        const h = canvas.height;
        const cx = w / 2;
        const cy = h / 2;
        const wrap = parseInt(wrapSlider.value) / 100;
        const leafDensity = parseInt(leafSlider.value) / 100;
        const maxLength = parseInt(lengthSlider.value);

        vineNodes = [];
        leaves = [];

        // Start from outside and grow toward center
        const startAngle = Math.random() * Math.PI * 2;
        const startRadius = Math.min(w, h) * 0.4;
        const startX = cx + Math.cos(startAngle) * startRadius;
        const startY = cy + Math.sin(startAngle) * startRadius;

        const root = new VineNode(startX, startY, startAngle + Math.PI, null);
        root.length = 20 + Math.random() * 20;
        vineNodes.push(root);

        // Generate vine path
        let currentNode = root;
        let currentX = startX;
        let currentY = startY;
        let currentAngle = startAngle + Math.PI;
        let totalLength = 0;

        for (let i = 0; i < maxLength; i++) {
          // Wrap around center
          const dx = cx - currentX;
          const dy = cy - currentY;
          const dist = Math.sqrt(dx * dx + dy * dy);
          const targetAngle = Math.atan2(dy, dx);
          
          // Blend between current angle and target angle with wrap factor
          const angleDiff = targetAngle - currentAngle;
          const wrappedDiff = Math.atan2(Math.sin(angleDiff), Math.cos(angleDiff));
          currentAngle += wrappedDiff * (0.1 + 0.4 * wrap);
          
          // Add some randomness
          currentAngle += (Math.random() - 0.5) * 0.3 * (1 - wrap * 0.5);
          
          const stepLength = 12 + Math.random() * 8;
          const newX = currentX + Math.cos(currentAngle) * stepLength;
          const newY = currentY + Math.sin(currentAngle) * stepLength;
          
          // Check if reached center
          const newDist = Math.sqrt((cx - newX) ** 2 + (cy - newY) ** 2);
          if (newDist < 30) break;
          
          const node = new VineNode(newX, newY, currentAngle, currentNode);
          node.length = stepLength;
          currentNode.children.push(node);
          currentNode = node;
          currentX = newX;
          currentY = newY;
          
          // Add leaves
          if (Math.random() < leafDensity * 0.5) {
            const leafAngle = currentAngle + (Math.random() - 0.5) * 1.5;
            const leafX = currentX + Math.cos(leafAngle) * 8;
            const leafY = currentY + Math.sin(leafAngle) * 8;
            node.addLeaf(leafX, leafY, leafAngle);
          }
          
          totalLength++;
        }

        vineLength.textContent = `✦ ${totalLength} nodes`;
      }

      // ----- Update vine -----
      function updateVine() {
        const speedMult = parseInt(speedSlider.value) / 5;
        
        if (!isPaused && isGrowing) {
          vineNodes.forEach(node => node.update(speedMult));
          
          // Check if all nodes are fully grown
          const allGrown = vineNodes.every(node => node.growth >= 1);
          if (allGrown && vineNodes.length > 0) {
            isGrowing = false;
            vineStatus.textContent = '🌿 Grown';
            status.textContent = '🌿 Vine fully grown!';
          }
        }
      }

      // ----- Draw -----
      function draw() {
        const w = canvas.width;
        const h = canvas.height;
        const cx = w / 2;
        const cy = h / 2;

        // Clear
        ctx.clearRect(0, 0, w, h);

        // Background
        const bgGradient = ctx.createRadialGradient(cx, cy, 0, cx, cy, w * 0.8);
        bgGradient.addColorStop(0, '#0a0a1a');
        bgGradient.addColorStop(0.5, '#060612');
        bgGradient.addColorStop(1, '#020208');
        ctx.fillStyle = bgGradient;
        ctx.fillRect(0, 0, w, h);

        // Draw vine
        const allNodes = [];
        function collectNodes(node) {
          allNodes.push(node);
          node.children.forEach(collectNodes);
        }
        vineNodes.forEach(collectNodes);
        
        // Sort by depth for proper layering
        allNodes.sort((a, b) => a.growth - b.growth);
        allNodes.forEach(node => node.draw(ctx, time));

        // Update status
        if (!isPaused && isGrowing) {
          vineStatus.textContent = '🌱 Growing';
          status.textContent = '🌱 Vine growing and wrapping around the element';
        } else if (isPaused) {
          vineStatus.textContent = '⏸ Paused';
          status.textContent = '⏸ Paused';
        } else if (!isGrowing && vineNodes.length > 0) {
          vineStatus.textContent = '🌿 Grown';
        }
      }

      // ----- Animation loop -----
      function animate() {
        time += 0.016;
        updateVine();
        draw();
        animationId = requestAnimationFrame(animate);
      }

      // ----- Start animation -----
      function startAnimation() {
        if (animationId) {
          cancelAnimationFrame(animationId);
        }
        animate();
      }

      // ----- Grow -----
      function grow() {
        isGrowing = true;
        vineStatus.textContent = '🌱 Growing';
        status.textContent = '🌱 Vine growing...';
        // Reset growth on nodes
        vineNodes.forEach(node => {
          node.growth = 0;
          node.alive = true;
        });
      }

      // ----- Clear -----
      function clearVine() {
        vineNodes = [];
        isGrowing = false;
        vineLength.textContent = '✦ 0 nodes';
        vineStatus.textContent = '🌿 Empty';
        status.textContent = '🗑️ Cleared';
        setTimeout(() => {
          status.textContent = '🌱 Click Grow to start a new vine';
        }, 1000);
      }

      // ----- Toggle pause -----
      function togglePause() {
        isPaused = !isPaused;
        toggleBtn.textContent = isPaused ? '▶ Play' : '⏸ Pause';
        status.textContent = isPaused ? '⏸ Paused' : '▶ Resumed';
        vineStatus.textContent = isPaused ? '⏸ Paused' : '🌱 Growing';
      }

      // ----- Reset -----
      function resetVine() {
        isPaused = false;
        isGrowing = true;
        toggleBtn.textContent = '⏸ Pause';
        speedSlider.value = 5;
        speedValue.textContent = '5×';
        lengthSlider.value = 30;
        lengthValue.textContent = '30';
        wrapSlider.value = 50;
        wrapValue.textContent = '50%';
        leafSlider.value = 60;
        leafValue.textContent = '60%';
        generateVine();
        status.textContent = '↺ Reset';
        vineStatus.textContent = '🌱 Growing';
        setTimeout(() => {
          status.textContent = '🌱 Vine growing and wrapping around the element';
        }, 500);
      }

      // ----- Event Listeners -----
      growBtn.addEventListener('click', () => {
        generateVine();
        grow();
      });

      clearBtn.addEventListener('click', clearVine);
      toggleBtn.addEventListener('click', togglePause);
      resetBtn.addEventListener('click', resetVine);

      speedSlider.addEventListener('input', (e) => {
        speedValue.textContent = e.target.value + '×';
      });

      lengthSlider.addEventListener('input', (e) => {
        lengthValue.textContent = e.target.value;
        generateVine();
        grow();
      });

      wrapSlider.addEventListener('input', (e) => {
        wrapValue.textContent = e.target.value + '%';
        generateVine();
        grow();
      });

      leafSlider.addEventListener('input', (e) => {
        leafValue.textContent = e.target.value + '%';
        generateVine();
        grow();
      });

      // Keyboard shortcuts
      document.addEventListener('keydown', (e) => {
        if (e.key === 'g' || e.key === 'G') {
          e.preventDefault();
          generateVine();
          grow();
        }
        if (e.key === 'c' || e.key === 'C') {
          e.preventDefault();
          clearVine();
        }
        if (e.key === ' ' || e.key === 'Space') {
          e.preventDefault();
          togglePause();
        }
        if (e.key === 'r' || e.key === 'R') {
          e.preventDefault();
          resetVine();
        }
      });

      // ----- Resize handler -----
      let resizeTimeout;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(() => {
          setupCanvas();
          generateVine();
        }, 200);
      });

      // ----- Init -----
      function init() {
        setupCanvas();
        generateVine();
        startAnimation();
        status.textContent = '🌱 Vine growing and wrapping around the element!';
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }

    })();
  </script>
</body>
</html>
