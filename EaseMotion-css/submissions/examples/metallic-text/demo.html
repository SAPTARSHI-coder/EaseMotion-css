<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Metallic Reflection Text Effect</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      margin: 0;
      padding: 2rem;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      /* A dark background makes the metallic shine really pop */
      background-color: #1a1a1a;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    
    .demo-container {
      text-align: center;
    }

    /* Apply the effect to a large heading */
    h1.ease-text-shine {
      font-size: 5rem;
      margin: 0;
    }
    
    /* Can also be applied to smaller badges or premium tier text */
    .premium-badge {
      display: inline-block;
      margin-top: 2rem;
      padding: 0.5rem 2rem;
      border: 2px solid #555;
      border-radius: 50px;
      font-size: 1.5rem;
    }
  </style>
</head>
<body>

  <div class="demo-container">
    
    <!-- Large Hero Text -->
    <h1 class="ease-text-shine">Premium Tier</h1>
    
    <!-- Smaller Badge Element -->
    <div class="premium-badge ease-text-shine">
      PRO MEMBER
    </div>
    
  </div>

</body>
</html>
