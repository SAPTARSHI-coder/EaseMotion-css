<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Micro Ripple Input &mdash; EaseMotion CSS Demo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="page-head">
    <p class="kicker">EaseMotion CSS &middot; Micro-interactions</p>
    <h1>Micro Ripple Input</h1>
    <p class="sub">Click inside &mdash; the field responds with ripples.</p>
  </header>
  <main class="stage">
    <div class="mr-wrap">
      <input class="mr-input" placeholder="Type something&hellip;" />
      <span class="mr-ripple"></span>
    </div>
  </main>
  <p class="stage-caption">Focus the field to send ripples across it.</p>
  <footer class="page-foot">
    <span>Pure CSS &middot; zero dependencies</span>
    <span>Focus ripple</span>
  </footer>
</body>
</html>
