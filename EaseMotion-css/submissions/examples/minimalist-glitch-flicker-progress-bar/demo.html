<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Glitch Flicker Progress Bar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="container">

    <h1 class="title">
        Glitch Flicker Progress Bar
    </h1>

    <p class="subtitle">
        Pure HTML & CSS • Minimalist Tech Layout
    </p>

    <section class="progress-card">

        <div class="progress-header">
            <span>System Upload</span>
            <span>72%</span>
        </div>

        <div
            class="progress-track"
            role="progressbar"
            aria-label="System Upload Progress"
            aria-valuenow="72"
            aria-valuemin="0"
            aria-valuemax="100">

            <div class="progress-fill">

                <span class="glitch-layer"></span>

            </div>

        </div>

        <div class="status">

            <span class="status-dot"></span>

            <span>Synchronizing secure data...</span>

        </div>

    </section>

</main>

</body>
</html>
