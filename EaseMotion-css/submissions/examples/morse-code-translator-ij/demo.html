<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-morse-code-translator</title>
</head>
<body>
<main class="mct-card">
  <header class="mct-head">
    <h1 class="mct-title">Morse Key</h1>
    <span class="mct-mode">SOS</span>
  </header>
  <section class="mct-wire" aria-label="morse output">
    <span class="mct-dot"></span>
    <span class="mct-dash"></span>
    <span class="mct-gap"></span>
    <span class="mct-dot"></span>
    <span class="mct-dot"></span>
    <span class="mct-dash"></span>
  </section>
  <section class="mct-lampbox">
    <span class="mct-lamp"></span>
    <span class="mct-label">TX</span>
  </section>
  <section class="mct-word">
    <span class="mct-input">SOS</span>
    <strong class="mct-code">... --- ...</strong>
  </section>
  <footer class="mct-foot">
    <span class="mct-wpm">14 WPM</span>
    <span class="mct-freq">600 Hz</span>
  </footer>
</main>
</body>
</html>
