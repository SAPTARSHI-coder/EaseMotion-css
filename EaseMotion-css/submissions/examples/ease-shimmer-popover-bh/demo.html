<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ease-shimmer-popover-bh</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #0f172a; min-height: 100vh; padding: 2rem; color: #f1f5f9; }
    .container { max-width: 1200px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 2rem; padding: 2rem; background: rgba(30, 41, 59, 0.8); border-radius: 1rem; }
    header h1 { font-size: 2rem; font-weight: 700; background: linear-gradient(135deg, #fcd34d, #f59e0b); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    header p { color: #94a3b8; margin-top: 0.5rem; }
    .demo-section { background: rgba(30, 41, 59, 0.8); border: 1px solid rgba(148, 163, 184, 0.1); border-radius: 1rem; padding: 2rem; margin-bottom: 2rem; }
    .demo-section h2 { font-size: 1.25rem; margin-bottom: 1rem; color: #e2e8f0; }
    .demo-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1.5rem; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>ease-shimmer-popover-bh</h1>
      <p>CSS Shimmer-Sweep Popover for Fintech Dashboards</p>
    </header>
    
    <section class="demo-section">
      <h2>Shimmer-Sweep Popover Examples</h2>
      <div class="demo-grid">
        <div class="ease-popover ease-popover-shimmer ease-popover-fintech" style="position:relative;">
          <div class="ease-popover-title">✨ Premium</div>
          <div class="ease-popover-text">Unlock premium features</div>
        </div>
        
        <div class="ease-popover ease-popover-shimmer">
          <div class="ease-popover-title">🎁 Reward</div>
          <div class="ease-popover-text">Claim your reward</div>
        </div>
        
        <div class="ease-popover ease-popover-shimmer ease-popover-fintech" style="position:relative;">
          <div class="ease-popover-title">🔥 Hot Deal</div>
          <div class="ease-popover-text">Limited time offer</div>
        </div>
      </div>
    </section>
  </div>
</body>
</html>
