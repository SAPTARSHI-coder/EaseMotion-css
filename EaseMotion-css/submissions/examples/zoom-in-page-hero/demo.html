<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Zoom-In Page Hero - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Hero Section -->
  <section class="hero-container" aria-label="Hero Spotlight">
    <!-- Animated Zoom Background Container -->
    <div class="hero-bg" aria-hidden="true"></div>
    <div class="hero-overlay" aria-hidden="true"></div>

    <!-- Foreground Content -->
    <div class="hero-content">
      <span class="hero-badge">EaseMotion CSS</span>
      <h1 class="hero-title">Experience Dynamic Motion</h1>
      <p class="hero-description">
        A seamless hero section with a smooth CSS zoom-in background effect. Built with pure CSS, full accessibility, and zero JavaScript dependencies.
      </p>
      <div class="hero-actions">
        <a href="#explore" class="hero-btn primary-btn">Explore Features</a>
        <a href="#docs" class="hero-btn secondary-btn">Documentation</a>
      </div>
    </div>
  </section>

</body>
</html>
