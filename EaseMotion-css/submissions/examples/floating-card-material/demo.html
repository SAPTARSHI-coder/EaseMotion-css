<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Material Floating Card</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="demo">
    <h1>Floating Material Card</h1>
    <p class="subtitle">A responsive Material Design inspired card.</p>

    <article class="floating-card">
      <div class="card-icon" aria-hidden="true">✦</div>

      <div class="card-content">
        <span class="card-label">MATERIAL UI</span>

        <h2>Floating Card</h2>

        <p>
          A clean and responsive card with elevation, smooth hover motion,
          and Material Design inspired styling.
        </p>

        <a href="#" class="card-action">Explore</a>
      </div>
    </article>
  </main>

</body>
</html>
