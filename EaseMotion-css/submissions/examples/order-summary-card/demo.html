<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Order Summary Card &mdash; EaseMotion CSS Demo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="page-head">
    <p class="kicker">EaseMotion CSS &middot; E-commerce</p>
    <h1>Order Summary Card</h1>
    <p class="sub">Review your basket and hit confirm when you are ready.</p>
  </header>
  <main class="stage">
    <div class="os2-card">
      <h3>Your order</h3>
      <div class="os2-item">
        <span class="os2-thumb os2-t1">&#127871;</span>
        <span class="os2-name">Aurora Sneaker</span>
        <span class="os2-qty">x1</span>
        <span class="os2-price">$79</span>
      </div>
      <div class="os2-item">
        <span class="os2-thumb os2-t2">&#127820;</span>
        <span class="os2-name">Bounty Pack</span>
        <span class="os2-qty">x2</span>
        <span class="os2-price">$14</span>
      </div>
      <div class="os2-totals">
        <div class="os2-row"><span>Subtotal</span><span>$93</span></div>
        <div class="os2-row"><span>Shipping</span><span>Free</span></div>
        <div class="os2-row total"><span>Total</span><span>$93</span></div>
      </div>
      <button class="os2-confirm">Confirm Order</button>
    </div>
  </main>
  <p class="stage-caption">Hover the confirm button to see it charge ahead.</p>
  <footer class="page-foot">
    <span>Pure CSS &middot; zero dependencies</span>
    <span>Checkout layout</span>
  </footer>
</body>
</html>
