<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-solar-tracker-panel</title>
</head>
<body>
<main class="stp-card">
  <header class="stp-head">
    <h1 class="stp-title">Tracker</h1>
    <span class="stp-zone">Roof B</span>
  </header>
  <section class="stp-stage" aria-label="tracking field">
    <span class="stp-sun"></span>
    <span class="stp-arm"></span>
    <span class="stp-panel"></span>
    <span class="stp-base"></span>
  </section>
  <section class="stp-data">
    <span class="stp-label">Angle</span>
    <strong class="stp-angle">42deg</strong>
    <span class="stp-effic">91%</span>
  </section>
  <footer class="stp-foot">
    <span class="stp-pos">East</span>
    <span class="stp-watt">214 W</span>
  </footer>
</main>
</body>
</html>
