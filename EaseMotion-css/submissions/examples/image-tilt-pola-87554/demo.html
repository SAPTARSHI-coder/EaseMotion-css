<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Tilt Pola #87554 Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="gallery-container">
    <figure class="pola-card" tabindex="0">
      <div class="pola-img-wrapper">
        <img 
          src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=600&q=80" 
          alt="Alpine Lake View" 
          class="pola-img"
        >
      </div>
      <figcaption class="pola-caption">
        Alpine Lake Serenity
        <span class="pola-date">Autumn '25</span>
      </figcaption>
    </figure>

    <figure class="pola-card" tabindex="0">
      <div class="pola-img-wrapper">
        <img 
          src="https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=600&q=80" 
          alt="Starry Night Peaks" 
          class="pola-img"
        >
      </div>
      <figcaption class="pola-caption">
        Midnight Peaks
        <span class="pola-date">Winter '25</span>
      </figcaption>
    </figure>

    <figure class="pola-card" tabindex="0">
      <div class="pola-img-wrapper">
        <img 
          src="https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?auto=format&fit=crop&w=600&q=80" 
          alt="Misty Morning Woods" 
          class="pola-img"
        >
      </div>
      <figcaption class="pola-caption">
        Misty Morning
        <span class="pola-date">Spring '26</span>
      </figcaption>
    </figure>
  </div>

</body>
</html>
