<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-kite-fly-tether demo</title>
</head>
<body>
<div class="kt-app">
  <div class="kt-head">
    <span class="kt-name">CLIFF FIELD</span>
    <span class="kt-badge">BREEZE</span>
  </div>
  <div class="kt-stage">
    <div class="kt-kite">
      <span class="kt-spar kt-spar-a"></span>
      <span class="kt-spar kt-spar-b"></span>
      <span class="kt-sail"></span>
      <span class="kt-bow"></span>
    </div>
    <div class="kt-tail">
      <span class="kt-bowtie"></span>
      <span class="kt-bowtie"></span>
      <span class="kt-bowtie"></span>
    </div>
    <span class="kt-line"></span>
    <div class="kt-reel">
      <span class="kt-spool"></span>
      <span class="kt-brace"></span>
      <span class="kt-crank"></span>
    </div>
    <span class="kt-tag">LINE 150 FT</span>
  </div>
</div>
</body>
</html>
