<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="CSS animated countdown burst from three to launch"
  >
  <title>CSS Countdown Burst</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section class="countdown-card" aria-labelledby="title">
      <p class="eyebrow">EaseMotion CSS</p>

      <h1 id="title">Launch Countdown</h1>

      <p class="description">
        A CSS-only countdown sequence with a burst effect at launch.
      </p>

      <div class="countdown" aria-label="Three second countdown">
        <div class="countdown-number number-three" aria-hidden="true">
          <span>3</span>
        </div>

        <div class="countdown-number number-two" aria-hidden="true">
          <span>2</span>
        </div>

        <div class="countdown-number number-one" aria-hidden="true">
          <span>1</span>
        </div>

        <div class="launch" aria-label="Launch">
          <span class="burst burst-one"></span>
          <span class="burst burst-two"></span>
          <span class="burst burst-three"></span>
          <span class="burst burst-four"></span>
          <span class="burst burst-five"></span>
          <span class="burst burst-six"></span>
          <strong>GO!</strong>
        </div>
      </div>

      <div class="status">
        <span class="status-dot" aria-hidden="true"></span>
        <span>Ready for launch</span>
      </div>
    </section>
  </main>
</body>
</html>
