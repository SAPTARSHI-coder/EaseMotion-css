<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.75">
<title>Petrol Station Pump</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="fuel-station">
  <header class="fuel-head">
    <h1 class="fuel-brand">TANK STOP</h1>
    <p class="fuel-octane">OCTANE 95</p>
  </header>
  <section class="fuel-scene" aria-label="Petrol pump and car">
    <div class="fuel-pump">
      <span class="pump-display"><span class="pump-read">12.40</span></span>
      <span class="pump-body"></span>
      <span class="pump-base"></span>
      <span class="pump-label">UNLEADED</span>
      <div class="pump-hose">
        <span class="hose-coil coil-1"></span>
        <span class="hose-coil coil-2"></span>
        <span class="pump-nozzle"></span>
      </div>
    </div>
    <div class="customer-car">
      <span class="car-roof"></span>
      <span class="car-body"></span>
      <span class="car-window cw-a"></span>
      <span class="car-window cw-b"></span>
      <span class="car-wheel wheel-1"></span>
      <span class="car-wheel wheel-2"></span>
    </div>
    <div class="station-tank"></div>
  </section>
  <footer class="fuel-foot">
    <span class="fuel-litre">L 1.52</span>
    <span class="fuel-paid">PAID</span>
  </footer>
</main>
</body>
</html>
