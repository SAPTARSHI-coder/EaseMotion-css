<!-- EaseMotion component: pendulum-clock -->
<!DOCTYPE html>
<html lang="en" data-clock="pend">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Ease Pendulum Clock</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="pendulum-clock">
  <header class="clock-crown">
    <span class="crown-finial"></span>
  </header>
  <div class="clock-body">
    <div class="clock-face">
      <span class="face-num f12">12</span>
      <span class="face-num f3">3</span>
      <span class="face-num f6">6</span>
      <span class="face-num f9">9</span>
      <i class="hand hour-hand"></i>
      <i class="hand minute-hand"></i>
      <i class="hand second-hand"></i>
      <span class="face-pin"></span>
    </div>
    <div class="pendulum">
      <span class="pend-rod"></span>
      <span class="pend-bob"></span>
    </div>
    <div class="weight weight-l"></div>
    <div class="weight weight-r"></div>
  </div>
  <footer class="clock-base">
    <span class="base-note">GRANDFATHER</span>
  </footer>
</main>
</body>
</html>
