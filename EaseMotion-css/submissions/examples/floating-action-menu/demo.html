<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floating Action Menu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="page">
        <h1>Floating Action Menu</h1>
        <p>Click the + button to reveal the actions.</p>
    </main>

    <div class="fab-menu">
        <input type="checkbox" id="fab-toggle" class="fab-toggle">

        <div class="actions">
            <a href="#" class="action action-one" aria-label="Home">
                H
            </a>

            <a href="#" class="action action-two" aria-label="Search">
                S
            </a>

            <a href="#" class="action action-three" aria-label="Profile">
                P
            </a>

            <a href="#" class="action action-four" aria-label="Settings">
                ⚙
            </a>
        </div>

        <label for="fab-toggle" class="fab-button" aria-label="Toggle floating action menu">
            <span></span>
            <span></span>
        </label>
    </div>

</body>
</html>
