<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shimmer Sweep Card Grid - EaseMotion CSS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="showcase-container">
        <header class="showcase-header">
            <h1>Shimmer Sweep Card Grid</h1>
            <p>A pure CSS modern e-commerce checkout layout with a sleek shimmer loading animation.</p>
        </header>

        <section class="card-grid">
            <!-- Card 1 -->
            <article class="shimmer-card">
                <div class="shimmer-img"></div>
                <div class="shimmer-content">
                    <div class="shimmer-title"></div>
                    <div class="shimmer-line"></div>
                    <div class="shimmer-line short"></div>
                    <div class="shimmer-action"></div>
                </div>
            </article>

            <!-- Card 2 -->
            <article class="shimmer-card">
                <div class="shimmer-img"></div>
                <div class="shimmer-content">
                    <div class="shimmer-title"></div>
                    <div class="shimmer-line"></div>
                    <div class="shimmer-line short"></div>
                    <div class="shimmer-action"></div>
                </div>
            </article>

            <!-- Card 3 -->
            <article class="shimmer-card">
                <div class="shimmer-img"></div>
                <div class="shimmer-content">
                    <div class="shimmer-title"></div>
                    <div class="shimmer-line"></div>
                    <div class="shimmer-line short"></div>
                    <div class="shimmer-action"></div>
                </div>
            </article>
        </section>
    </main>
</body>
</html>
