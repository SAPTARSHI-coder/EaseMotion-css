<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Friction Clutch Engage — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Friction Clutch Engage demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Friction Clutch Engage</h1>
      <p class="lede">Automotive clutch plates engaging with pressure</p>
    </header>

    <section class="ease-friction-clutch-engage" data-demo="friction-clutch-engage" aria-live="polite">
      <div class="ease-friction-clutch-engage__housing">
        <div class="ease-friction-clutch-engage__bezel">
          <div class="ease-friction-clutch-engage__face">
            <div class="ease-friction-clutch-engage__readout">
              <span class="ease-friction-clutch-engage__label">Friction Clutch Engage</span>
              <span class="ease-friction-clutch-engage__value">LIVE</span>
            </div>
            <div class="ease-friction-clutch-engage__motion" aria-hidden="true">
              <span class="ease-friction-clutch-engage__a"></span>
              <span class="ease-friction-clutch-engage__b"></span>
              <span class="ease-friction-clutch-engage__c"></span>
              <span class="ease-friction-clutch-engage__d"></span>
            </div>
            <div class="ease-friction-clutch-engage__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-friction-clutch-engage__controls">
          <button type="button" class="ease-friction-clutch-engage__btn primary">Engage</button>
          <button type="button" class="ease-friction-clutch-engage__btn">Reset</button>
          <label class="ease-friction-clutch-engage__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-friction-clutch-engage__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
