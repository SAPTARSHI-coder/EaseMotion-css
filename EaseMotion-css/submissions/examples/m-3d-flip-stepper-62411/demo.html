<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D-Flip Stepper</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<section class="hero">

<div class="content">

<span class="badge">EaseMotion CSS</span>

<h1>3D-Flip Stepper</h1>

<p>
A modern product catalog stepper featuring elegant 3D flip animations,
responsive layouts, premium styling, and lightweight HTML/CSS interactions.
</p>

</div>

<div class="stepper">

<div class="step active">
<div class="circle">1</div>
<h3>Browse</h3>
<p>Select products</p>
</div>

<div class="line"></div>

<div class="step active">
<div class="circle">2</div>
<h3>Compare</h3>
<p>Review features</p>
</div>

<div class="line"></div>

<div class="step">
<div class="circle">3</div>
<h3>Review</h3>
<p>Confirm details</p>
</div>

<div class="line"></div>

<div class="step">
<div class="circle">4</div>
<h3>Checkout</h3>
<p>Complete purchase</p>
</div>

</div>

</section>

</body>
</html>
