<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Stepper Checkout Wizard with Fluid Ribbon Indicator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../easemotion.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>Fluid Stepper Checkout Wizard</h1>
      <p>Sliding active step background indicator with spring easing.</p>
    </header>

    <main class="wizard-card">
      <div class="stepper-nav">
        <div class="stepper-ribbon" id="ribbon"></div>
        <button class="step-btn active" onclick="setStep(0)">1. Cart</button>
        <button class="step-btn" onclick="setStep(1)">2. Shipping</button>
        <button class="step-btn" onclick="setStep(2)">3. Payment</button>
      </div>
    </main>
  </div>

  <script>
    function setStep(index) {
      const btns = document.querySelectorAll('.step-btn');
      const ribbon = document.getElementById('ribbon');
      btns.forEach((btn, i) => btn.classList.toggle('active', i === index));
      ribbon.style.transform = `translateX(${index * 100}%)`;
    }
  </script>
</body>
</html>
