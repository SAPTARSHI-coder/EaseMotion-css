<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Error Correction Surface Code - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css"></head><body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030712; color: #ffffff;">

    <div class="ease-card ease-card-glass qec-container">
        <div class="qec-header">
            <h2>Surface Code QEC</h2>
            <span class="ease-badge ease-badge-primary">Stabilizing</span>
        </div>
        
        <div class="qec-screen ease-center">
            <div class="qec-flux flux-qec-a"></div>
            <div class="qec-flux flux-qec-b"></div>
            <div class="qec-boundary-ring"></div>
            <div class="qec-core ease-center"></div>
        </div>

        <div class="qec-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Syndrome Measurements &amp; Lattice Surgery</span>
            <button class="ease-btn ease-btn-primary ease-btn-sm ease-hover-grow">Run Surface Code</button>
        </div>
    </div></body></html>
