<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.6">
<title>Ship Wheel Helm</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="ship-helm">
  <header class="helm-head">
    <h1 class="helm-name">SS ADVENTURE</h1>
    <p class="helm-course">COURSE 045°</p>
  </header>
  <section class="helm-deck" aria-label="Ship wheel and compass">
    <div class="helm-wheel">
      <span class="spoke spoke-a"></span>
      <span class="spoke spoke-b"></span>
      <span class="spoke spoke-c"></span>
      <span class="spoke spoke-d"></span>
      <span class="spoke spoke-e"></span>
      <span class="spoke spoke-f"></span>
      <span class="wheel-hub"></span>
    </div>
    <div class="compass">
      <div class="compass-ring">N</div>
      <span class="compass-needle"></span>
    </div>
  </section>
  <footer class="helm-foot">
    <span class="helm-rudder">RUDDER MIDSHIP</span>
    <span class="helm-speed">SPD 12 KN</span>
  </footer>
</main>
</body>
</html>
