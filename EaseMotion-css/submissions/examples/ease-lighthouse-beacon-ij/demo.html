<!-- EaseMotion component: lighthouse-beacon -->
<!DOCTYPE html>
<html lang="en" data-light="beacon">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
<title>Ease Lighthouse Beacon</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="lighthouse-scene">
  <div class="sea-strip">
    <span class="sea-wave wave-a"></span>
    <span class="sea-wave wave-b"></span>
  </div>
  <div class="rock-base"></div>
  <div class="lighthouse">
    <div class="tower-stripe st-top"></div>
    <div class="tower-stripe st-mid"></div>
    <div class="tower-stripe st-low"></div>
    <div class="lantern-room">
      <span class="lamp-glow"></span>
      <span class="beam-ray"></span>
    </div>
    <div class="lantern-cap"></div>
  </div>
</main>
</body>
</html>
