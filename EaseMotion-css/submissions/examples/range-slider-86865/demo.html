<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Range Slider #86865 Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="showcase-wrapper">
    <div class="slider-card">
      <div class="card-header">
        <span class="card-title">Bandwidth Limit</span>
        <span class="card-badge">Custom Range</span>
      </div>

      <div class="slider-wrapper">
        <div class="slider-tooltip" id="sliderTooltip">65%</div>
        <input 
          type="range" 
          id="rangeInput" 
          class="custom-range" 
          min="0" 
          max="100" 
          value="65"
        >
        <div class="slider-scale">
          <span>0 Mbps</span>
          <span>50 Mbps</span>
          <span>100 Mbps</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    const slider = document.getElementById('rangeInput');
    const tooltip = document.getElementById('sliderTooltip');

    function updateSlider() {
      const min = Number(slider.min) || 0;
      const max = Number(slider.max) || 100;
      const val = Number(slider.value);
      const percentage = ((val - min) / (max - min)) * 100;

      slider.style.setProperty('--slider-fill', `${percentage}%`);
      tooltip.style.left = `${percentage}%`;
      tooltip.textContent = `${val}%`;
    }

    slider.addEventListener('input', updateSlider);
    updateSlider();
  </script>
</body>
</html>
