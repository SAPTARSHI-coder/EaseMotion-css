<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Animated Toggle Switch - EaseMotion CSS</title>

  <link rel="stylesheet" href="style.css" />

  <!-- Optional: main EaseMotion CSS -->
  <link rel="stylesheet" href="../../easemotion.css" />
</head>
<body>
  <main class="demo-container">
    <h1>Animated Toggle Switch</h1>
    <p class="subtitle">Pure CSS toggle with smooth thumb animation</p>

    <!-- Default toggle -->
    <label class="ease-toggle-ts">
      <input
        type="checkbox"
        class="ease-toggle-input-ts"
        checked
      />
      <span class="ease-toggle-track-ts" aria-hidden="true">
        <span class="ease-toggle-thumb-ts"></span>
      </span>
      <span class="ease-toggle-text-ts">Notifications</span>
    </label>

    <!-- Custom color toggle -->
    <label
      class="ease-toggle-ts"
      style="--toggle-on-ts: #4ade80;"
    >
      <input
        type="checkbox"
        class="ease-toggle-input-ts"
      />
      <span class="ease-toggle-track-ts" aria-hidden="true">
        <span class="ease-toggle-thumb-ts"></span>
      </span>
      <span class="ease-toggle-text-ts">Dark Mode</span>
    </label>

    <!-- Pink toggle -->
    <label
      class="ease-toggle-ts"
      style="--toggle-on-ts: #ff4ecd;"
    >
      <input
        type="checkbox"
        class="ease-toggle-input-ts"
        checked
      />
      <span class="ease-toggle-track-ts" aria-hidden="true">
        <span class="ease-toggle-thumb-ts"></span>
      </span>
      <span class="ease-toggle-text-ts">Auto Save</span>
    </label>

    <!-- Disabled toggle -->
    <label class="ease-toggle-ts ease-toggle-disabled-ts">
      <input
        type="checkbox"
        class="ease-toggle-input-ts"
        disabled
      />
      <span class="ease-toggle-track-ts" aria-hidden="true">
        <span class="ease-toggle-thumb-ts"></span>
      </span>
      <span class="ease-toggle-text-ts">Disabled Option</span>
    </label>

    <p class="hint">
      No JavaScript needed. Works with keyboard focus too.
    </p>
  </main>
</body>
</html>
