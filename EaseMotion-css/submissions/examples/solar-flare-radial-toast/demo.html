<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
        name="description"
        content="Pure CSS Solar Flare Radial toast notification component"
    >
    <title>Solar Flare Radial Toast</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="demo">
        <section class="demo-card" aria-labelledby="demo-title">
            <span class="eyebrow">EaseMotion CSS</span>

            <h1 id="demo-title">Solar Flare Radial Toast</h1>

            <p class="description">
                A glowing CSS-only toast notification inspired by the
                expanding energy of a solar flare.
            </p>

            <label class="toast-toggle">
                <input type="checkbox" id="toast-control">
                <span class="toggle-button">
                    Toggle Notification
                </span>
            </label>
        </section>
    </main>

    <aside
        class="solar-toast"
        role="status"
        aria-live="polite"
        aria-label="Notification"
    >
        <div class="toast-flare" aria-hidden="true"></div>

        <div class="toast-icon" aria-hidden="true">
            ✦
        </div>

        <div class="toast-content">
            <strong>Solar flare detected</strong>
            <p>
                Your interface is glowing with fresh energy.
            </p>
        </div>

        <label class="toast-close" for="toast-control">
            <span class="sr-only">Dismiss notification</span>
            ×
        </label>
    </aside>

</body>
</html>
