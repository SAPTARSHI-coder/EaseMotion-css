<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Glassmorphism card showcase for EaseMotion CSS issue #78670." />
    <title>Glassmorphism Card</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="page">
      <article class="card" aria-labelledby="title">
        <div class="card-glow" aria-hidden="true"></div>

        <header class="card-header">
          <p class="eyebrow">EaseMotion CSS · Issue #78670</p>
          <span class="status" aria-label="Component status">Ready</span>
        </header>

        <div class="card-content">
          <h1 id="title">Glassmorphism Card</h1>
          <p class="description">
            A translucent content surface combining backdrop blur, soft borders,
            layered lighting, and responsive spacing for modern interfaces.
          </p>

          <ul class="details" aria-label="Component features">
            <li>Backdrop blur</li>
            <li>Responsive</li>
            <li>Keyboard friendly</li>
          </ul>
        </div>

        <footer class="card-footer">
          <span class="meta">CSS-only showcase</span>
          <a class="card-link" href="#explore">Explore component <span aria-hidden="true">→</span></a>
        </footer>
      </article>
    </main>
  </body>
</html>
