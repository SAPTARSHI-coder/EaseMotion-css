<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EaseMotion — File Tree</title>
  <link rel="stylesheet" href="../../core/variables.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="demo-container">
    <h1>File Tree</h1>
    <p>Collapsible directory tree navigator.</p>

    <div class="tree-card">
      <ul class="tree">
        <li>
          <span class="tree-toggle" onclick="toggle(this)">📂 src</span>
          <ul class="tree-children">
            <li>
              <span class="tree-toggle" onclick="toggle(this)">📂 components</span>
              <ul class="tree-children">
                <li><span class="tree-file">📄 Button.tsx</span></li>
                <li><span class="tree-file">📄 Modal.tsx</span></li>
                <li><span class="tree-file">📄 Input.tsx</span></li>
              </ul>
            </li>
            <li>
              <span class="tree-toggle" onclick="toggle(this)">📂 utils</span>
              <ul class="tree-children">
                <li><span class="tree-file">📄 helpers.ts</span></li>
                <li><span class="tree-file">📄 api.ts</span></li>
              </ul>
            </li>
            <li><span class="tree-file">📄 index.ts</span></li>
          </ul>
        </li>
        <li><span class="tree-file">📄 package.json</span></li>
        <li><span class="tree-file">📄 README.md</span></li>
      </ul>
    </div>
  </div>
  <script>
    function toggle(el) {
      const children = el.parentElement.querySelector('.tree-children');
      if (children) {
        const isHidden = children.style.display === 'none';
        children.style.display = isHidden ? '' : 'none';
        el.textContent = isHidden ? el.textContent.replace('📁', '📂') : el.textContent.replace('📂', '📁');
      }
    }
  </script>
</body>
</html>
