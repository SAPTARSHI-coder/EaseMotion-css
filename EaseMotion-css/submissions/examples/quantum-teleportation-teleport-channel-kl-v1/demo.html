<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Teleport Channel - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030712; color: #ffffff;">

    <div class="ease-card ease-card-glass channel-container">
        <div class="channel-header">
            <h2>Teleport Channel</h2>
            <span class="ease-badge ease-badge-success">Transmitting</span>
        </div>
        
        <div class="channel-screen ease-center">
            <div class="quantum-stream stream-1"></div>
            <div class="quantum-stream stream-2"></div>
            <div class="entanglement-ring"></div>
            <div class="teleport-core ease-center"></div>
        </div>

        <div class="channel-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Fidelity: 99.999%</span>
            <button class="ease-btn ease-btn-primary ease-btn-sm ease-hover-grow">Initialize Link</button>
        </div>
    </div>

</body>
</html>
