<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Liquid Light – Fluid Light Moves Like Liquid Mercury</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <h1>💧 Liquid Light</h1>
    <p class="subtitle">Fluid light moves like liquid mercury</p>

    <div class="liquid-container">
      <div class="liquid-stage" id="liquidStage">
        <canvas id="canvas"></canvas>
        
        <!-- Info overlay -->
        <div class="info-overlay">
          <span class="liquid-status" id="liquidStatus">💧 Flowing</span>
          <span class="particle-count" id="particleCount">✦ 0 particles</span>
        </div>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <button class="ctrl-btn play" id="playBtn">▶ Play</button>
      <button class="ctrl-btn pause" id="pauseBtn">⏸ Pause</button>
      <button class="ctrl-btn toggle" id="toggleBtn">🔄 Toggle</button>
      <button class="ctrl-btn reset" id="resetBtn">↺ Reset</button>
    </div>

    <!-- Sliders -->
    <div class="slider-container">
      <span class="slider-label">Flow Speed</span>
      <input type="range" id="speedSlider" min="1" max="10" value="5" />
      <span class="slider-value" id="speedValue">5×</span>
    </div>

    <div class="slider-container">
      <span class="slider-label">Particle Count</span>
      <input type="range" id="countSlider" min="50" max="400" value="150" step="10" />
      <span class="slider-value" id="countValue">150</span>
    </div>

    <div class="slider-container">
      <span class="slider-label">Viscosity</span>
      <input type="range" id="viscositySlider" min="0" max="100" value="50" />
      <span class="slider-value" id="viscosityValue">50%</span>
    </div>

    <div class="slider-container">
      <span class="slider-label">Brightness</span>
      <input type="range" id="brightnessSlider" min="0" max="100" value="60" />
      <span class="slider-value" id="brightnessValue">60%</span>
    </div>

    <!-- Status -->
    <div class="status" id="status">💧 Liquid light flowing like mercury</div>

    <!-- Keyboard shortcuts -->
    <div class="shortcuts">
      <kbd>Space</kbd> Toggle · <kbd>P</kbd> Play/Pause · <kbd>R</kbd> Reset
    </div>
  </div>

  <script>
    (function() {
      "use strict";

      // DOM elements
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      const liquidStatus = document.getElementById('liquidStatus');
      const particleCount = document.getElementById('particleCount');
      const playBtn = document.getElementById('playBtn');
      const pauseBtn = document.getElementById('pauseBtn');
      const toggleBtn = document.getElementById('toggleBtn');
      const resetBtn = document.getElementById('resetBtn');
      const status = document.getElementById('status');
      const speedSlider = document.getElementById('speedSlider');
      const speedValue = document.getElementById('speedValue');
      const countSlider = document.getElementById('countSlider');
      const countValue = document.getElementById('countValue');
      const viscositySlider = document.getElementById('viscositySlider');
      const viscosityValue = document.getElementById('viscosityValue');
      const brightnessSlider = document.getElementById('brightnessSlider');
      const brightnessValue = document.getElementById('brightnessValue');

      // State
      let particles = [];
      let isPlaying = true;
      let animationId = null;
      let time = 0;
      let mouseX = -1000;
      let mouseY = -1000;
      let isMouseOnCanvas = false;

      // ----- Canvas setup -----
      function setupCanvas() {
        const rect = canvas.parentElement.getBoundingClientRect();
        const size = Math.min(rect.width - 40, 600);
        canvas.width = size;
        canvas.height = size;
        canvas.style.width = size + 'px';
        canvas.style.height = size + 'px';
      }

      // ----- Particle class -----
      class Particle {
        constructor() {
          const w = canvas.width;
          const h = canvas.height;
          const padding = 20;
          this.x = padding + Math.random() * (w - padding * 2);
          this.y = padding + Math.random() * (h - padding * 2);
          this.vx = (Math.random() - 0.5) * 0.5;
          this.vy = (Math.random() - 0.5) * 0.5;
          this.size = 1 + Math.random() * 3;
          this.hue = 180 + Math.random() * 60; // 180-240 (cyan to blue)
          this.saturation = 60 + Math.random() * 40;
          this.lightness = 40 + Math.random() * 40;
          this.opacity = 0.3 + Math.random() * 0.7;
          this.phase = Math.random() * Math.PI * 2;
          this.trail = [];
          this.trailLength = 8 + Math.floor(Math.random() * 12);
          this.friction = 0.96 + Math.random() * 0.03;
          this.mass = 0.5 + Math.random() * 0.5;
        }

        update(viscosity, speedMult) {
          // Apply viscosity (damping)
          const visc = 1 - viscosity * 0.02;
          this.vx *= this.friction * visc;
          this.vy *= this.friction * visc;

          // Add slight random movement
          this.vx += (Math.random() - 0.5) * 0.02 * speedMult;
          this.vy += (Math.random() - 0.5) * 0.02 * speedMult;

          // Mouse interaction - attract/repel
          if (isMouseOnCanvas) {
            const dx = this.x - mouseX;
            const dy = this.y - mouseY;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < 200) {
              const force = (200 - dist) / 200 * 0.02 * speedMult;
              const angle = Math.atan2(dy, dx);
              this.vx += Math.cos(angle) * force * this.mass;
              this.vy += Math.sin(angle) * force * this.mass;
            }
          }

          // Limit speed
          const maxSpeed = 2 * speedMult;
          const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
          if (speed > maxSpeed) {
            this.vx = (this.vx / speed) * maxSpeed;
            this.vy = (this.vy / speed) * maxSpeed;
          }

          this.x += this.vx * speedMult;
          this.y += this.vy * speedMult;

          // Boundary with soft bounce
          const padding = 10;
          if (this.x < padding) { this.x = padding; this.vx = Math.abs(this.vx) * 0.8; }
          if (this.x > canvas.width - padding) { this.x = canvas.width - padding; this.vx = -Math.abs(this.vx) * 0.8; }
          if (this.y < padding) { this.y = padding; this.vy = Math.abs(this.vy) * 0.8; }
          if (this.y > canvas.height - padding) { this.y = canvas.height - padding; this.vy = -Math.abs(this.vy) * 0.8; }

          // Update trail
          this.trail.push({ x: this.x, y: this.y });
          if (this.trail.length > this.trailLength) {
            this.trail.shift();
          }

          // Pulse brightness
          this.pulse = 0.7 + 0.3 * Math.sin(time * 0.02 + this.phase);
        }

        draw(ctx, brightness) {
          // Draw trail
          if (this.trail.length > 1) {
            for (let i = 0; i < this.trail.length - 1; i++) {
              const t = i / this.trail.length;
              const alpha = this.opacity * t * 0.3 * brightness;
              const trailSize = this.size * t * 0.4;
              const hue = this.hue + t * 20;
              ctx.fillStyle = `hsla(${hue}, ${this.saturation}%, ${this.lightness + t * 20}%, ${alpha})`;
              ctx.beginPath();
              ctx.arc(this.trail[i].x, this.trail[i].y, trailSize, 0, Math.PI * 2);
              ctx.fill();
            }
          }

          // Glow
          const glowSize = this.size * 6 * brightness;
          const gradient = ctx.createRadialGradient(
            this.x, this.y, 0,
            this.x, this.y, glowSize
          );
          const alpha = this.opacity * 0.15 * brightness;
          gradient.addColorStop(0, `hsla(${this.hue + 20}, 100%, 80%, ${alpha * this.pulse})`);
          gradient.addColorStop(0.5, `hsla(${this.hue}, 100%, 60%, ${alpha * 0.5})`);
          gradient.addColorStop(1, `hsla(${this.hue}, 100%, 40%, 0)`);
          ctx.fillStyle = gradient;
          ctx.beginPath();
          ctx.arc(this.x, this.y, glowSize, 0, Math.PI * 2);
          ctx.fill();

          // Core
          const coreSize = this.size * 0.6 * brightness * (0.5 + 0.5 * this.pulse);
          const coreGradient = ctx.createRadialGradient(
            this.x - coreSize * 0.2, this.y - coreSize * 0.2, 0,
            this.x, this.y, coreSize
          );
          const coreAlpha = this.opacity * 0.8 * brightness;
          coreGradient.addColorStop(0, `hsla(${this.hue + 30}, 100%, 95%, ${coreAlpha * this.pulse})`);
          coreGradient.addColorStop(0.5, `hsla(${this.hue + 10}, 90%, 80%, ${coreAlpha * 0.6})`);
          coreGradient.addColorStop(1, `hsla(${this.hue}, 80%, 60%, ${coreAlpha * 0.2})`);
          ctx.fillStyle = coreGradient;
          ctx.beginPath();
          ctx.arc(this.x, this.y, coreSize, 0, Math.PI * 2);
          ctx.fill();

          // Sparkle
          if (this.pulse > 0.8) {
            ctx.fillStyle = `rgba(255, 255, 255, ${(this.pulse - 0.8) * 5 * 0.3 * brightness})`;
            ctx.beginPath();
            ctx.arc(this.x - coreSize * 0.2, this.y - coreSize * 0.3, coreSize * 0.15, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      }

      // ----- Generate particles -----
      function generateParticles(count) {
        particles = [];
        for (let i = 0; i < count; i++) {
          particles.push(new Particle());
        }
        particleCount.textContent = `✦ ${particles.length} particles`;
        countValue.textContent = particles.length;
      }

      // ----- Draw background -----
      function drawBackground() {
        const w = canvas.width;
        const h = canvas.height;
        const cx = w / 2;
        const cy = h / 2;

        // Deep dark background
        const bgGradient = ctx.createRadialGradient(cx, cy, 0, cx, cy, w * 0.8);
        bgGradient.addColorStop(0, '#0a0a1a');
        bgGradient.addColorStop(0.5, '#060612');
        bgGradient.addColorStop(1, '#020208');
        ctx.fillStyle = bgGradient;
        ctx.fillRect(0, 0, w, h);
      }

      // ----- Draw -----
      function draw() {
        const w = canvas.width;
        const h = canvas.height;
        const brightness = parseInt(brightnessSlider.value) / 100;

        drawBackground();

        // Sort particles by size for depth
        const sortedParticles = [...particles].sort((a, b) => a.size - b.size);
        sortedParticles.forEach(p => p.draw(ctx, brightness));

        // Update status
        if (isPlaying) {
          liquidStatus.textContent = '💧 Flowing';
          status.textContent = '💧 Liquid light flowing like mercury';
        } else {
          liquidStatus.textContent = '⏸ Paused';
          status.textContent = '⏸ Paused';
        }
      }

      // ----- Animation loop -----
      function animate() {
        time += 0.016;

        if (isPlaying) {
          const speedMult = parseInt(speedSlider.value) / 5;
          const viscosity = parseInt(viscositySlider.value) / 100;
          
          particles.forEach(p => p.update(viscosity, speedMult));
        }

        draw();
        animationId = requestAnimationFrame(animate);
      }

      // ----- Start animation -----
      function startAnimation() {
        if (animationId) {
          cancelAnimationFrame(animationId);
        }
        animate();
      }

      // ----- Toggle play -----
      function togglePlay() {
        isPlaying = !isPlaying;
        playBtn.textContent = isPlaying ? '▶ Play' : '⏸ Paused';
        liquidStatus.textContent = isPlaying ? '💧 Flowing' : '⏸ Paused';
        status.textContent = isPlaying ? '💧 Liquid light flowing like mercury' : '⏸ Paused';
      }

      // ----- Play -----
      function play() {
        isPlaying = true;
        playBtn.textContent = '▶ Play';
        liquidStatus.textContent = '💧 Flowing';
        status.textContent = '💧 Liquid light flowing like mercury';
      }

      // ----- Pause -----
      function pause() {
        isPlaying = false;
        playBtn.textContent = '⏸ Paused';
        liquidStatus.textContent = '⏸ Paused';
        status.textContent = '⏸ Paused';
      }

      // ----- Reset -----
      function resetLiquid() {
        time = 0;
        isPlaying = true;
        playBtn.textContent = '▶ Play';
        liquidStatus.textContent = '💧 Flowing';
        status.textContent = '↺ Reset';
        const count = parseInt(countSlider.value);
        generateParticles(count);
        // Reset sliders
        speedSlider.value = 5;
        speedValue.textContent = '5×';
        viscositySlider.value = 50;
        viscosityValue.textContent = '50%';
        brightnessSlider.value = 60;
        brightnessValue.textContent = '60%';
        setTimeout(() => {
          status.textContent = '💧 Liquid light flowing like mercury';
        }, 500);
      }

      // ----- Event Listeners -----
      // Mouse tracking
      canvas.addEventListener('mousemove', (e) => {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        mouseX = (e.clientX - rect.left) * scaleX;
        mouseY = (e.clientY - rect.top) * scaleY;
        isMouseOnCanvas = true;
      });

      canvas.addEventListener('mouseenter', () => {
        isMouseOnCanvas = true;
      });

      canvas.addEventListener('mouseleave', () => {
        isMouseOnCanvas = false;
        mouseX = -1000;
        mouseY = -1000;
      });

      // Touch support
      canvas.addEventListener('touchmove', (e) => {
        e.preventDefault();
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        const touch = e.touches[0];
        mouseX = (touch.clientX - rect.left) * scaleX;
        mouseY = (touch.clientY - rect.top) * scaleY;
        isMouseOnCanvas = true;
      });

      canvas.addEventListener('touchstart', (e) => {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        const touch = e.touches[0];
        mouseX = (touch.clientX - rect.left) * scaleX;
        mouseY = (touch.clientY - rect.top) * scaleY;
        isMouseOnCanvas = true;
      });

      canvas.addEventListener('touchend', () => {
        isMouseOnCanvas = false;
        mouseX = -1000;
        mouseY = -1000;
      });

      // Buttons
      playBtn.addEventListener('click', play);
      pauseBtn.addEventListener('click', pause);
      toggleBtn.addEventListener('click', togglePlay);
      resetBtn.addEventListener('click', resetLiquid);

      // Sliders
      speedSlider.addEventListener('input', (e) => {
        speedValue.textContent = e.target.value + '×';
      });

      countSlider.addEventListener('input', (e) => {
        const val = parseInt(e.target.value);
        countValue.textContent = val;
        generateParticles(val);
        status.textContent = `✦ Particle count: ${val}`;
      });

      viscositySlider.addEventListener('input', (e) => {
        viscosityValue.textContent = e.target.value + '%';
      });

      brightnessSlider.addEventListener('input', (e) => {
        brightnessValue.textContent = e.target.value + '%';
      });

      // Keyboard shortcuts
      document.addEventListener('keydown', (e) => {
        if (e.key === ' ' || e.key === 'Space') {
          e.preventDefault();
          togglePlay();
        }
        if (e.key === 'p' || e.key === 'P') {
          e.preventDefault();
          isPlaying ? pause() : play();
        }
        if (e.key === 'r' || e.key === 'R') {
          e.preventDefault();
          resetLiquid();
        }
      });

      // ----- Resize handler -----
      let resizeTimeout;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(() => {
          setupCanvas();
          const count = parseInt(countSlider.value);
          generateParticles(count);
        }, 200);
      });

      // ----- Init -----
      function init() {
        setupCanvas();
        const count = parseInt(countSlider.value);
        generateParticles(count);
        startAnimation();
        status.textContent = '💧 Liquid light flowing like mercury — move your mouse to interact!';
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }

    })();
  </script>
</body>
</html>
