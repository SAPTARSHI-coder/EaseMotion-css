<!-- submissions/examples/glassmorphism-neumorphism-toggle/demo.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glassmorphism Neumorphism Toggle | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="demo-container">
    
    <!-- Glassmorphism/Neumorphism Toggle -->
    <div class="ease-gn-wrapper">
      <input type="checkbox" id="glass-neu-toggle" class="ease-gn-checkbox">
      <label for="glass-neu-toggle" class="ease-gn-label" tabindex="0" role="switch" aria-checked="false" aria-label="Toggle setting">
        <span class="ease-gn-knob"></span>
      </label>
    </div>

    <p class="demo-hint">Click or press Space on the track to toggle the glass slider.</p>

  </main>

  <!-- Script to strictly handle ARIA state for screen readers without breaking the CSS-only logic -->
  <script>
    const toggleLabel = document.querySelector('.ease-gn-label');
    const checkbox = document.getElementById('glass-neu-toggle');
    
    checkbox.addEventListener('change', (e) => {
      toggleLabel.setAttribute('aria-checked', e.target.checked);
    });

    toggleLabel.addEventListener('keydown', (e) => {
      if (e.key === ' ' || e.key === 'Enter') {
        e.preventDefault();
        checkbox.checked = !checkbox.checked;
        toggleLabel.setAttribute('aria-checked', checkbox.checked);
      }
    });
  </script>

</body>
</html>
