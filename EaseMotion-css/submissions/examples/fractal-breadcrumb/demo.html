<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Fractal Breadcrumb</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <main class="page">

    <section class="demo-card">

      <div class="eyebrow">
        NAVIGATION SYSTEM
      </div>

      <h1>Fractal Breadcrumb</h1>

      <p class="description">
        A branching breadcrumb trail that visualizes
        your position inside a nested navigation structure.
      </p>

      <nav
        class="fractal-breadcrumb"
        aria-label="Breadcrumb"
      >

        <a href="#" class="crumb">
          <span class="node"></span>
          <span class="label">Home</span>
        </a>

        <span class="branch"></span>

        <a href="#" class="crumb">
          <span class="node"></span>
          <span class="label">Products</span>
        </a>

        <span class="branch"></span>

        <a href="#" class="crumb">
          <span class="node"></span>
          <span class="label">Electronics</span>
        </a>

        <span class="branch"></span>

        <a href="#" class="crumb">
          <span class="node"></span>
          <span class="label">Audio</span>
        </a>

        <span class="branch"></span>

        <a
          href="#"
          class="crumb current"
          aria-current="page"
        >
          <span class="node"></span>
          <span class="label">Headphones</span>
        </a>

      </nav>

      <div class="path-info">

        <span class="path-dot"></span>

        <span>
          Current location:
          <strong>Headphones</strong>
        </span>

      </div>

    </section>

  </main>

</body>
</html>
