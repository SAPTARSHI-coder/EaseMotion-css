<!-- EaseMotion component: typewriter-terminal -->
<!DOCTYPE html>
<html lang="en" data-term="type">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Ease Typewriter Terminal</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="type-terminal">
  <header class="term-bar">
    <span class="term-dot dot-red"></span>
    <span class="term-dot dot-yellow"></span>
    <span class="term-dot dot-green"></span>
    <span class="term-name">bash &mdash; dev</span>
  </header>
  <div class="term-screen">
    <p class="term-line"><span class="prompt-symbol">$</span> <span class="typed-text">git status</span></p>
    <p class="term-line line-output">On branch main</p>
    <p class="term-line line-result">working tree clean</p>
    <p class="term-line"><span class="prompt-symbol">$</span> <span class="typed-text">npm run build</span></p>
    <p class="term-line line-output">compiling modules...</p>
    <p class="term-line line-result">build complete in 1.2s</p>
    <p class="term-line"><span class="prompt-symbol">$</span> <span class="cursor-block"></span></p>
  </div>
</main>
</body>
</html>
