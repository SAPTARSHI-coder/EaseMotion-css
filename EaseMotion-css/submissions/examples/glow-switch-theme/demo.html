<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Glow Switch Theme &mdash; EaseMotion CSS Demo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="page-head">
    <p class="kicker">EaseMotion CSS &middot; Theme &amp; FX</p>
    <h1>Glow Switch Theme</h1>
    <p class="sub">Flip from sun to moon and the whole switch lights up.</p>
  </header>
  <main class="stage">
    <div class="gt-switch">
      <span class="gt-knob"><span class="gt-sun">&#9728;&#65039;</span><span class="gt-moon">&#127769;&#65039;</span></span>
    </div>
  </main>
  <p class="stage-caption">Hover the toggle to send the knob across with a glow.</p>
  <footer class="page-foot">
    <span>Pure CSS &middot; zero dependencies</span>
    <span>Glowing toggle</span>
  </footer>
</body>
</html>
