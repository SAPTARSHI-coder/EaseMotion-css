<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loft Dry Hang — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Loft Dry Hang demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Loft Dry Hang</h1>
      <p class="lede">Loft drying hanging spurs of paper</p>
    </header>

    <section class="ease-loft-dry-hang" data-demo="loft-dry-hang" aria-live="polite">
      <div class="ease-loft-dry-hang__housing">
        <div class="ease-loft-dry-hang__bezel">
          <div class="ease-loft-dry-hang__face">
            <div class="ease-loft-dry-hang__readout">
              <span class="ease-loft-dry-hang__label">Loft Dry Hang</span>
              <span class="ease-loft-dry-hang__value">LIVE</span>
            </div>
            <div class="ease-loft-dry-hang__motion" aria-hidden="true">
              <span class="ease-loft-dry-hang__a"></span>
              <span class="ease-loft-dry-hang__b"></span>
              <span class="ease-loft-dry-hang__c"></span>
              <span class="ease-loft-dry-hang__d"></span>
            </div>
            <div class="ease-loft-dry-hang__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-loft-dry-hang__controls">
          <button type="button" class="ease-loft-dry-hang__btn primary">Hang</button>
          <button type="button" class="ease-loft-dry-hang__btn">Take</button>
          <label class="ease-loft-dry-hang__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-loft-dry-hang__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
