<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neural Synaptic Resonance Matrix - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #020c08; color: #ffffff;">

    <div class="ease-card ease-card-glass neural-container">
        <div class="neural-header">
            <h2>Neural Synapse</h2>
            <span class="ease-badge ease-badge-success">Resonant</span>
        </div>
        
        <div class="neural-screen ease-center">
            <div class="synaptic-wave wave-1"></div>
            <div class="synaptic-wave wave-2"></div>
            <div class="resonance-ring"></div>
            <div class="neural-nucleus ease-center"></div>
        </div>

        <div class="neural-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Synch: 99.4%</span>
            <button class="ease-btn ease-btn-primary ease-btn-sm ease-hover-grow">Trigger Spike</button>
        </div>
    </div>

</body>
</html>
