<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tilt Card — EaseMotion CSS</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="tiltcard-page-tm" data-palette="cool">
  <h1 class="tiltcard-h-tm">Tilt Card</h1>
  <p class="tiltcard-lede-tm">A self-contained demo with three variants of the effect.</p>
  <section class="tiltcard-row-tm">
    <article class="tiltcard-1-wrap-tm">
      <div class="tiltcard-1-tm"></div>
      <span class="tiltcard-lbl-tm">Example One</span>
    </article>
    <article class="tiltcard-2-wrap-tm">
      <div class="tiltcard-2-tm"></div>
      <span class="tiltcard-lbl-tm">Example Two</span>
    </article>
    <article class="tiltcard-3-wrap-tm">
      <div class="tiltcard-3-tm"></div>
      <span class="tiltcard-lbl-tm">Example Three</span>
    </article>
  </section>
</main>
</body>
</html>
