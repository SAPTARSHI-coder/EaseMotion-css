<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memory Foam</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="foam-page">
  <section class="foam-card">

    <header>
      <span>LIQUID MEMORY</span>
      <h1>Memory Foam</h1>
      <p>Touch the surface and leave a temporary memory.</p>
    </header>

    <canvas id="foamCanvas"></canvas>

    <footer>
      <div>
        <span>Active memories</span>
        <strong id="bubbleCount">0</strong>
      </div>

      <button id="bubbleBtn">Create Bubble</button>
      <button id="resetBtn">Clear</button>
    </footer>

  </section>
</main>

<script>
const canvas = document.getElementById("foamCanvas");
const ctx = canvas.getContext("2d");

const count = document.getElementById("bubbleCount");

let bubbles = [];
let time = 0;

function resize() {
  canvas.width = canvas.clientWidth * devicePixelRatio;
  canvas.height = canvas.clientHeight * devicePixelRatio;

  ctx.setTransform(
    devicePixelRatio,
    0,
    0,
    devicePixelRatio,
    0,
    0
  );
}

window.addEventListener("resize", resize);
resize();

function createBubble(x, y) {
  bubbles.push({
    x,
    y,
    radius: 2,
    targetRadius: 12 + Math.random() * 20,
    age: 0,
    life: 1,
    speed: .2 + Math.random() * .5,
    wobble: Math.random() * Math.PI * 2
  });

  count.textContent = bubbles.length;
}

function draw() {
  time += .01;

  const w = canvas.clientWidth;
  const h = canvas.clientHeight;

  ctx.clearRect(0, 0, w, h);

  const bg = ctx.createLinearGradient(0, 0, 0, h);
  bg.addColorStop(0, "#071b2b");
  bg.addColorStop(1, "#082d3c");

  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, w, h);

  bubbles.forEach(b => {
    b.age += .016;
    b.y -= b.speed;
    b.radius += (b.targetRadius - b.radius) * .04;

    const wobble =
      Math.sin(time * 2 + b.wobble) * 4;

    b.life -= .0018;

    b.renderX = b.x + wobble;
    b.renderY = b.y;
  });

  for (let i = 0; i < bubbles.length; i++) {
    for (let j = i + 1; j < bubbles.length; j++) {
      const a = bubbles[i];
      const b = bubbles[j];

      const dx = a.renderX - b.renderX;
      const dy = a.renderY - b.renderY;
      const distance = Math.sqrt(dx * dx + dy * dy);

      if (distance < 130) {
        ctx.globalAlpha =
          (1 - distance / 130) *
          Math.min(a.life, b.life) *
          .35;

        ctx.beginPath();
        ctx.moveTo(a.renderX, a.renderY);
        ctx.lineTo(b.renderX, b.renderY);

        ctx.strokeStyle = "#7eeaff";
        ctx.lineWidth = 1;
        ctx.stroke();
      }
    }
  }

  ctx.globalAlpha = 1;

  bubbles.forEach(b => {
    const gradient = ctx.createRadialGradient(
      b.renderX - b.radius * .3,
      b.renderY - b.radius * .3,
      1,
      b.renderX,
      b.renderY,
      b.radius
    );

    gradient.addColorStop(0, "rgba(255,255,255,.7)");
    gradient.addColorStop(.25, "rgba(130,235,255,.3)");
    gradient.addColorStop(1, "rgba(30,180,220,.02)");

    ctx.fillStyle = gradient;
    ctx.strokeStyle = "rgba(150,240,255,.55)";
    ctx.shadowBlur = 20;
    ctx.shadowColor = "#43dfff";

    ctx.beginPath();
    ctx.arc(
      b.renderX,
      b.renderY,
      b.radius,
      0,
      Math.PI * 2
    );

    ctx.fill();
    ctx.stroke();
    ctx.shadowBlur = 0;
  });

  bubbles = bubbles.filter(
    b => b.life > 0 && b.y > -80
  );

  count.textContent = bubbles.length;

  requestAnimationFrame(draw);
}

canvas.addEventListener("pointerdown", e => {
  const rect = canvas.getBoundingClientRect();

  createBubble(
    e.clientX - rect.left,
    e.clientY - rect.top
  );
});

document.getElementById("bubbleBtn").addEventListener(
  "click",
  () => {
    createBubble(
      canvas.clientWidth / 2,
      canvas.clientHeight * .75
    );
  }
);

document.getElementById("resetBtn").addEventListener(
  "click",
  () => {
    bubbles = [];
  }
);

document.addEventListener("keydown", e => {
  if (e.code === "Space") {
    e.preventDefault();

    createBubble(
      canvas.clientWidth / 2,
      canvas.clientHeight * .75
    );
  }

  if (e.key.toLowerCase() === "r") {
    bubbles = [];
  }
});

draw();
</script>

</body>
</html>
