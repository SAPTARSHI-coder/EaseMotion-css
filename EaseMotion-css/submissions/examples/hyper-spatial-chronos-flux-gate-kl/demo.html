<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hyper-Spatial Chronos Flux Gate - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #020509; color: #ffffff;">

    <div class="ease-card ease-card-glass flux-container">
        <div class="flux-header">
            <h2>Chronos Flux Gate</h2>
            <span class="ease-badge ease-badge-info">Temporal Leak</span>
        </div>
        
        <div class="flux-screen ease-center">
            <div class="temporal-ring ring-1"></div>
            <div class="temporal-ring ring-2"></div>
            <div class="flux-particle p-1"></div>
            <div class="flux-particle p-2"></div>
            <div class="flux-singularity ease-center"></div>
        </div>

        <div class="flux-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Dilution Factor: 0.88</span>
            <button class="ease-btn ease-btn-primary ease-btn-sm ease-hover-grow">Realign</button>
        </div>
    </div>

</body>
</html>
