<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar System Orbit - EaseMotion CSS</title>
    <!-- Include EaseMotion Core Stylesheet -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #05050f; color: #ffffff;">

    <div class="ease-card ease-card-glass solar-container">
        <div class="solar-header">
            <h2>Solar System</h2>
            <span class="ease-badge ease-badge-primary">Orbiting</span>
        </div>
        
        <div class="solar-screen ease-center">
            <div class="solar-orbit orbit-1">
                <div class="planet planet-1"></div>
            </div>
            <div class="solar-orbit orbit-2">
                <div class="planet planet-2"></div>
            </div>
            <div class="solar-sun ease-center"></div>
        </div>

        <div class="solar-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Speed: 1.0x</span>
            <button class="ease-btn ease-btn-primary ease-btn-sm ease-hover-grow">Accelerate</button>
        </div>
    </div>

</body>
</html>
