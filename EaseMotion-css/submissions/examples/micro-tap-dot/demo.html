<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Micro Tap Dot &mdash; EaseMotion CSS Demo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="page-head">
    <p class="kicker">EaseMotion CSS &middot; Micro-interactions</p>
    <h1>Micro Tap Dot</h1>
    <p class="sub">Press the target and leave a little green fingerprint.</p>
  </header>
  <main class="stage">
    <div class="mt-target">
      TAP
      <span class="mt-dot"></span>
    </div>
  </main>
  <p class="stage-caption">Click and hold to print the dot.</p>
  <footer class="page-foot">
    <span>Pure CSS &middot; zero dependencies</span>
    <span>Press print</span>
  </footer>
</body>
</html>
