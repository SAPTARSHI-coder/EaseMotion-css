<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fault Tolerance Verifiers QFTV - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css"></head><body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030712; color: #ffffff;">

    <div class="ease-card ease-card-glass qftv-container">
        <div class="qftv-header">
            <h2>Fault Tolerance Verifier</h2>
            <span class="ease-badge ease-badge-primary">Fault-Tolerant Quantum</span>
        </div>
        
        <div class="qftv-screen ease-center">
            <div class="qftv-flux flux-qftv-a"></div>
            <div class="qftv-flux flux-qftv-b"></div>
            <div class="qftv-boundary-ring"></div>
            <div class="qftv-core ease-center"></div>
        </div>

        <div class="qftv-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Error Propagation Bounds &amp; Transversal Circuit Auditing</span>
            <button class="ease-btn ease-btn-primary ease-btn-sm ease-hover-grow">Run Fault Tolerance Verifier</button>
        </div>
    </div></body></html>
