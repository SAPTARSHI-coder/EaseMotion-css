<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Solar Nav · Planetary Orbit Navigation</title>

    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <div class="card">
        <h2>🌞 Solar Nav</h2>
        <p class="sub">items orbit like a solar system</p>

        <!-- === SOLAR NAV === -->
        <div class="solar-container" id="solarContainer">
            <div class="solar-system">
                <!-- Sun (center) -->
                <button class="sun" id="sunBtn" aria-label="Toggle solar nav">
                    <i class="fas fa-sun"></i>
                </button>

                <!-- Planet orbits -->
                <div class="orbit orbit-1">
                    <div class="planet planet-1" data-tooltip="Home">
                        <a href="#" class="planet-link">
                            <i class="fas fa-home"></i>
                            <span class="planet-label">Home</span>
                        </a>
                    </div>
                </div>

                <div class="orbit orbit-2">
                    <div class="planet planet-2" data-tooltip="Explore">
                        <a href="#" class="planet-link">
                            <i class="fas fa-compass"></i>
                            <span class="planet-label">Explore</span>
                        </a>
                    </div>
                </div>

                <div class="orbit orbit-3">
                    <div class="planet planet-3" data-tooltip="Gallery">
                        <a href="#" class="planet-link">
                            <i class="fas fa-images"></i>
                            <span class="planet-label">Gallery</span>
                        </a>
                    </div>
                </div>

                <div class="orbit orbit-4">
                    <div class="planet planet-4" data-tooltip="Blog">
                        <a href="#" class="planet-link">
                            <i class="fas fa-blog"></i>
                            <span class="planet-label">Blog</span>
                        </a>
                    </div>
                </div>

                <div class="orbit orbit-5">
                    <div class="planet planet-5" data-tooltip="Contact">
                        <a href="#" class="planet-link">
                            <i class="fas fa-envelope"></i>
                            <span class="planet-label">Contact</span>
                        </a>
                    </div>
                </div>

                <div class="orbit orbit-6">
                    <div class="planet planet-6" data-tooltip="Profile">
                        <a href="#" class="planet-link">
                            <i class="fas fa-user"></i>
                            <span class="planet-label">Profile</span>
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <p style="margin-top: 2rem; font-size: 0.85rem; color: #64748b;">
            Hover · watch planets orbit around the sun
        </p>
    </div>

    <!-- Embedded JavaScript -->
    <script>
        (function() {
            'use strict';

            const container = document.getElementById('solarContainer');
            const sunBtn = document.getElementById('sunBtn');
            const orbits = document.querySelectorAll('.orbit');
            const planetLinks = document.querySelectorAll('.planet-link');
            let isActive = false;

            // --- Toggle solar system ---
            function toggleSolar() {
                isActive = !isActive;
                container.classList.toggle('is-active', isActive);
                sunBtn.classList.toggle('is-active', isActive);

                const icon = sunBtn.querySelector('i');
                if (isActive) {
                    icon.className = 'fas fa-times';
                } else {
                    icon.className = 'fas fa-sun';
                }

                console.log(`🌞 Solar nav ${isActive ? 'activated' : 'deactivated'}`);
            }

            // --- Activate solar system ---
            function activateSolar() {
                if (isActive) return;
                toggleSolar();
            }

            // --- Deactivate solar system ---
            function deactivateSolar() {
                if (!isActive) return;
                toggleSolar();
            }

            // --- Event Listeners ---

            // Sun button
            sunBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                toggleSolar();
                this.classList.add('click-pulse');
                setTimeout(() => {
                    this.classList.remove('click-pulse');
                }, 300);
            });

            // Planet clicks
            planetLinks.forEach(link => {
                link.addEventListener('click', function(e) {
                    e.preventDefault();
                    const parent = this.closest('.planet');
                    const label = this.querySelector('.planet-label')?.textContent || 'Planet';
                    console.log(`🌞 Selected: ${label}`);
                    parent.classList.add('clicked');
                    setTimeout(() => {
                        parent.classList.remove('clicked');
                    }, 300);
                    setTimeout(() => {
                        deactivateSolar();
                    }, 400);
                });

                // Keyboard accessibility
                link.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        this.click();
                    }
                    if (e.key === 'Escape') {
                        deactivateSolar();
                    }
                });
            });

            // Click outside to close
            document.addEventListener('click', function(e) {
                if (!container.contains(e.target)) {
                    deactivateSolar();
                }
            });

            // Keyboard accessibility
            sunBtn.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    toggleSolar();
                }
            });

            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && isActive) {
                    deactivateSolar();
                    sunBtn.focus();
                }
            });

            // Auto-activate on load for demo
            setTimeout(() => {
                activateSolar();
                setTimeout(() => {
                    deactivateSolar();
                }, 4000);
            }, 500);

            console.log('🌞 Solar nav initialized!');

        })();
    </script>

</body>
</html>
