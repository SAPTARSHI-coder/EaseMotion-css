<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CSS Ice Freeze Button</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="ice-container" role="status" aria-label="Ice freeze button animation">

<h1>ICE FREEZE</h1>

<button class="ice-button">
    <span class="crystal crystal-one"></span>
    <span class="crystal crystal-two"></span>
    <span class="crystal crystal-three"></span>
    <span class="crystal crystal-four"></span>

    <span class="button-text">
        FREEZE
    </span>
</button>


<p>Hover to activate ice crystals</p>

</div>


</body>

</html>
