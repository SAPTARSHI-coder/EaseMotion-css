<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-radio-tuner-frequency demo</title>
</head>
<body>
<div class="rtf-radio">
  <div class="rtf-screen">
    <b class="rtf-freq">98.7</b>
    <span class="rtf-band">FM</span>
  </div>
  <div class="rtf-scale">
    <span class="rtf-mark">88</span>
    <span class="rtf-mark">94</span>
    <span class="rtf-mark">100</span>
    <span class="rtf-mark">106</span>
    <span class="rtf-needle"></span>
  </div>
  <div class="rtf-dial"><span class="rtf-knob"></span></div>
  <div class="rtf-presets">
    <button class="rtf-preset">1</button>
    <button class="rtf-preset">2</button>
    <button class="rtf-preset">3</button>
  </div>
</div>
</body>
</html>
