<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Ripple-Wave Modal - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="em-modal-page">
        <div class="em-trigger-wrapper">
            <a href="#open-modal" class="em-trigger-btn">Launch Ripple Modal</a>
        </div>

        <div id="open-modal" class="em-modal-overlay">
            <div class="em-modal-container">
                <div class="em-ripple-wave-bg"></div>
                <div class="em-modal-header">
                    <span class="em-modal-badge">MINIMALIST TECH</span>
                    <a href="#" class="em-modal-close" aria-label="Close Modal">&times;</a>
                </div>
                <div class="em-modal-body">
                    <h2 class="em-modal-title">Ripple-Wave Modal</h2>
                    <p class="em-modal-desc">This component uses pure CSS target selectors and keyframe waves to deliver a performant modal experience without external JavaScript dependencies.</p>
                </div>
                <div class="em-modal-footer">
                    <a href="#" class="em-modal-action">Acknowledge</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
