<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Floating Ghost Empty State</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="workspace">
      <header class="workspace__header">
        <div>
          <p class="eyebrow">Project library</p>
          <h1>Your drafts</h1>
        </div>
        <span class="count">0 items</span>
      </header>

      <section class="empty-state">
        <div class="illustration" aria-hidden="true">
          <span class="spark spark--one">+</span>
          <span class="spark spark--two">&#183;</span>
          <div class="ghost">
            <span class="eye eye--left"></span>
            <span class="eye eye--right"></span>
            <span class="mouth"></span>
          </div>
          <div class="shadow"></div>
        </div>
        <p class="kicker">Nothing here yet</p>
        <h2>Give your next idea a home</h2>
        <p class="message">
          Start a fresh draft and keep every experiment close at hand.
        </p>
        <a class="action" href="#new-draft"
          ><span aria-hidden="true">+</span> Create draft</a
        >
      </section>
    </main>
  </body>
</html>
