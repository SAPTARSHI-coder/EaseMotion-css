<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dynamic Accordion Table</title>

<link rel="stylesheet" href="style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

</head>

<body>

<div class="table-card">

<h2>Project Dashboard</h2>

<table>

<thead>

<tr>

<th>Project</th>

<th>Status</th>

<th>Owner</th>

<th></th>

</tr>

</thead>

<tbody>

<tr class="summary">

<td>EaseMotion CSS</td>

<td><span class="badge">Active</span></td>

<td>Alex</td>

<td>+</td>

</tr>

<tr class="details">

<td colspan="4">

Modern CSS animation library with accessibility-first UI components.

</td>

</tr>

<tr class="summary">

<td>Nova UI</td>

<td><span class="badge">Testing</span></td>

<td>Sophia</td>

<td>+</td>

</tr>

<tr class="details">

<td colspan="4">

High-contrast dashboard components with responsive layouts.

</td>

</tr>

</tbody>

</table>

</div>

</body>

</html>
