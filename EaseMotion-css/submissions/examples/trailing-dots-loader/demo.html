<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="CSS-only trailing dots loader moving in a circular path."
  >

  <title>Trailing Dots Loader</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="demo-page">

    <section
      class="loader-card"
      aria-label="Loading content"
      aria-live="polite"
    >
      <div
        class="trailing-loader"
        role="status"
        aria-label="Loading"
      >
        <span class="loader-dot dot-1"></span>
        <span class="loader-dot dot-2"></span>
        <span class="loader-dot dot-3"></span>
        <span class="loader-dot dot-4"></span>
        <span class="loader-dot dot-5"></span>
        <span class="loader-dot dot-6"></span>
        <span class="loader-core"></span>
      </div>

      <p class="loader-text">Loading...</p>
    </section>

  </main>
</body>
</html>
