<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entanglement Swapping Repeater - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css"></head><body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030712; color: #ffffff;">

    <div class="ease-card ease-card-glass rep-container">
        <div class="rep-header">
            <h2>Entanglement Repeater</h2>
            <span class="ease-badge ease-badge-secondary">Swapping</span>
        </div>
        
        <div class="rep-screen ease-center">
            <div class="rep-flux flux-rep-a"></div>
            <div class="rep-flux flux-rep-b"></div>
            <div class="rep-boundary-ring"></div>
            <div class="rep-core ease-center"></div>
        </div>

        <div class="rep-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Bell State Measurements &amp; Long-Distance Links</span>
            <button class="ease-btn ease-btn-secondary ease-btn-sm ease-hover-grow">Run Swapping Repeater</button>
        </div>
    </div></body></html>
