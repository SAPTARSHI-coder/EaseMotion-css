<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ease Responsive Dark Mode Card — Demo</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f1f5f9;
      padding: 40px;
      box-sizing: border-box;
    }
  </style>
</head>
<body>

 <div class="ease-dark-card">
  <input type="checkbox" id="cardThemeToggle" class="toggle-input" />

  <div class="theme-toggle-row">
    <label for="cardThemeToggle" class="toggle-switch" aria-label="Toggle dark mode"></label>
  </div>

  <div class="card-body">
    <div class="card-image">🌗</div>
    <h3 class="card-title">Adaptive Card</h3>
    <p class="card-desc">
      A fully responsive card component with a built-in dark mode toggle —
      the entire palette smoothly transitions between light and dark themes.
    </p>
    <a href="#" class="card-cta">Learn More</a>
  </div>
</div>

</body>
</html>
