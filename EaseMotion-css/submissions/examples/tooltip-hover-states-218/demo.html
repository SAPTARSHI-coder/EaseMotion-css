<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Interactive cyberpunk heatmap grid with tooltip hover states"
  >

  <title>Cyberpunk Interactive Heatmap</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="page">

    <section class="heatmap-card">

      <header class="header">
        <div>
          <span class="eyebrow">EASEMOTION / ANALYTICS</span>
          <h1>Activity Heatmap</h1>
          <p>
            Hover over a cell to inspect activity levels.
          </p>
        </div>

        <div class="status">
          <span class="status-dot"></span>
          LIVE
        </div>
      </header>

      <div class="heatmap-wrapper">

        <div class="day-labels" aria-hidden="true">
          <span>MON</span>
          <span>TUE</span>
          <span>WED</span>
          <span>THU</span>
          <span>FRI</span>
          <span>SAT</span>
          <span>SUN</span>
        </div>

        <div
          class="heatmap"
          id="heatmap"
          aria-label="Weekly activity heatmap"
        ></div>

      </div>

      <footer class="legend">
        <span>LOW</span>

        <div class="legend-scale">
          <span class="level level-0"></span>
          <span class="level level-1"></span>
          <span class="level level-2"></span>
          <span class="level level-3"></span>
          <span class="level level-4"></span>
        </div>

        <span>HIGH</span>
      </footer>

    </section>

  </main>

  <script>
    const heatmap = document.getElementById("heatmap");

    const levels = [
      1, 3, 2, 0, 4, 2, 1,
      2, 4, 3, 1, 0, 3, 4,
      0, 2, 4, 3, 2, 1, 3,
      4, 1, 2, 0, 3, 4, 2,
      2, 3, 1, 4, 2, 0, 3,
      3, 4, 2, 1, 3, 2, 4,
      1, 2, 3, 4, 0, 2, 3,
      4, 3, 2, 1, 4, 3, 2
    ];

    const days = [
      "Monday",
      "Tuesday",
      "Wednesday",
      "Thursday",
      "Friday",
      "Saturday",
      "Sunday"
    ];

    const cellsPerDay = 8;

    levels.forEach((level, index) => {
      const cell = document.createElement("button");

      const dayIndex = index % cellsPerDay;
      const week = Math.floor(index / cellsPerDay);

      const activity = level * 25 + 10;

      cell.className = `cell level-${level}`;

      cell.setAttribute(
        "aria-label",
        `${days[dayIndex]}, week ${week + 1}: ${activity}% activity`
      );

      cell.dataset.tooltip =
        `${days[dayIndex]} · Week ${week + 1} · ${activity}% activity`;

      cell.addEventListener("click", () => {
        cell.classList.remove("pulse");

        requestAnimationFrame(() => {
          cell.classList.add("pulse");
        });
      });

      heatmap.appendChild(cell);
    });
  </script>

</body>
</html>
