<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NISQ Era Quantum Computing - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css"></head><body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030712; color: #ffffff;">

    <div class="ease-card ease-card-glass nisq-container">
        <div class="nisq-header">
            <h2>NISQ Era Computing</h2>
            <span class="ease-badge ease-badge-warning">Noisy Intermediate-Scale QC</span>
        </div>
        
        <div class="nisq-screen ease-center">
            <div class="nisq-flux flux-nisq-a"></div>
            <div class="nisq-flux flux-nisq-b"></div>
            <div class="nisq-boundary-ring"></div>
            <div class="nisq-core ease-center"></div>
        </div>

        <div class="nisq-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">VQE Optimization &amp; Decoherence Mitigation</span>
            <button class="ease-btn ease-btn-warning ease-btn-sm ease-hover-grow">Run NISQ Circuit</button>
        </div>
    </div></body></html>
