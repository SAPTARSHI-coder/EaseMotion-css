<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Neon Hero Section</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="hero">

        <div class="hero-glow glow-one"></div>
        <div class="hero-glow glow-two"></div>

        <div class="hero-content">

            <span class="hero-badge">NEXT GENERATION</span>

            <h1>
                Build Something
                <span>Extraordinary</span>
            </h1>

            <p>
                Create modern digital experiences with powerful,
                responsive and futuristic designs.
            </p>

            <div class="hero-actions">
                <a href="#" class="btn btn-primary">Get Started</a>
                <a href="#" class="btn btn-secondary">Explore More</a>
            </div>

        </div>

        <div class="hero-card">
            <div class="card-dot"></div>

            <div class="card-line"></div>
            <div class="card-line short"></div>

            <div class="card-stats">
                <div>
                    <strong>98%</strong>
                    <span>Performance</span>
                </div>

                <div>
                    <strong>24/7</strong>
                    <span>Availability</span>
                </div>
            </div>
        </div>

    </main>

</body>
</html>
