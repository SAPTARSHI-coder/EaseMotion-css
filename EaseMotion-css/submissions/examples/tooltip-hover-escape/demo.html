<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tooltip Hover Delay & Escape Key Dismiss Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Screen Reader Live Region for Dynamic Announcements -->
  <div 
    id="a11y-announcer" 
    class="sr-only" 
    role="status" 
    aria-live="polite" 
    aria-atomic="true"
  ></div>

  <main id="main-content" tabindex="-1">
    <h1>Accessible Tooltip Component</h1>
    <p>
      Hover or focus the button below. Demonstrates an <strong>intent-delay timer</strong> on hover, 
      a hoverable tooltip body (WCAG 1.4.13), and immediate dismissal when pressing <kbd>Escape</kbd> 
      without dropping keyboard focus.
    </p>

    <!-- ACCESSIBLE TOOLTIP STRUCTURE -->
    <div class="tooltip-wrapper" id="tooltip-container">
      <button 
        type="button" 
        id="tooltip-btn" 
        class="tooltip-trigger" 
        aria-describedby="tooltip-content"
      >
        <span>Export Financial Report</span>
      </button>

      <!-- Tooltip Bubble (role="tooltip") -->
      <div 
        id="tooltip-content" 
        class="tooltip-bubble" 
        role="tooltip"
        aria-hidden="true"
      >
        Generates CSV & PDF summaries for Q3 audit
      </div>
    </div>
  </main>

  <script>
    // Inline Accessible Tooltip Controller
    document.addEventListener('DOMContentLoaded', () => {
      const container = document.getElementById('tooltip-container');
      const trigger = document.getElementById('tooltip-btn');
      const bubble = document.getElementById('tooltip-content');
      const announcer = document.getElementById('a11y-announcer');

      if (!trigger || !bubble || !container) return;

      let showTimeout = null;
      let hideTimeout = null;
      const HOVER_DELAY_MS = 250;
      const INTENT_CLEAR_MS = 150;

      function showTooltip(isKeyboard = false) {
        clearTimeout(hideTimeout);
        bubble.classList.add('is-visible');
        bubble.setAttribute('aria-hidden', 'false');

        if (isKeyboard && announcer) {
          announcer.textContent = '';
          setTimeout(() => {
            announcer.textContent = 'Tooltip: ' + bubble.textContent.trim();
          }, 50);
        }
      }

      function hideTooltip() {
        clearTimeout(showTimeout);
        bubble.classList.remove('is-visible');
        bubble.setAttribute('aria-hidden', 'true');
      }

      // Pointer / Hover Management (WCAG 1.4.13: Hoverable & Persistent)
      container.addEventListener('mouseenter', () => {
        clearTimeout(hideTimeout);
        showTimeout = setTimeout(() => {
          showTooltip(false);
        }, HOVER_DELAY_MS);
      });

      container.addEventListener('mouseleave', () => {
        clearTimeout(showTimeout);
        hideTimeout = setTimeout(() => {
          hideTooltip();
        }, INTENT_CLEAR_MS);
      });

      // Keyboard Focus Management
      trigger.addEventListener('focus', () => {
        showTooltip(true);
      });

      trigger.addEventListener('blur', () => {
        hideTooltip();
      });

      // Keyboard Dismissal (Escape Key - WCAG 1.4.13: Dismissible)
      window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && bubble.classList.contains('is-visible')) {
          e.preventDefault();
          hideTooltip();
          if (announcer) {
            announcer.textContent = 'Tooltip dismissed.';
          }
        }
      });
    });
  </script>
</body>
</html>
