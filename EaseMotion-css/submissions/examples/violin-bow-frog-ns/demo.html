<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Violin Bow Frog — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Violin Bow Frog demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Violin Bow Frog</h1>
      <p class="lede">Violin bow frog drawing hair across the string</p>
    </header>

    <section class="ease-violin-bow-frog" data-demo="violin-bow-frog" aria-live="polite">
      <div class="ease-violin-bow-frog__housing">
        <div class="ease-violin-bow-frog__bezel">
          <div class="ease-violin-bow-frog__face">
            <div class="ease-violin-bow-frog__readout">
              <span class="ease-violin-bow-frog__label">Violin Bow Frog</span>
              <span class="ease-violin-bow-frog__value">LIVE</span>
            </div>
            <div class="ease-violin-bow-frog__motion" aria-hidden="true">
              <span class="ease-violin-bow-frog__a"></span>
              <span class="ease-violin-bow-frog__b"></span>
              <span class="ease-violin-bow-frog__c"></span>
              <span class="ease-violin-bow-frog__d"></span>
            </div>
            <div class="ease-violin-bow-frog__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-violin-bow-frog__controls">
          <button type="button" class="ease-violin-bow-frog__btn primary">Draw</button>
          <button type="button" class="ease-violin-bow-frog__btn">Lift</button>
          <label class="ease-violin-bow-frog__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-violin-bow-frog__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
