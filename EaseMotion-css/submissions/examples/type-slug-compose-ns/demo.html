<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Type Slug Compose — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Type Slug Compose demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Type Slug Compose</h1>
      <p class="lede">Type slug composing then justifying a line</p>
    </header>

    <section class="ease-type-slug-compose" data-demo="type-slug-compose" aria-live="polite">
      <div class="ease-type-slug-compose__housing">
        <div class="ease-type-slug-compose__bezel">
          <div class="ease-type-slug-compose__face">
            <div class="ease-type-slug-compose__readout">
              <span class="ease-type-slug-compose__label">Type Slug Compose</span>
              <span class="ease-type-slug-compose__value">LIVE</span>
            </div>
            <div class="ease-type-slug-compose__motion" aria-hidden="true">
              <span class="ease-type-slug-compose__a"></span>
              <span class="ease-type-slug-compose__b"></span>
              <span class="ease-type-slug-compose__c"></span>
              <span class="ease-type-slug-compose__d"></span>
            </div>
            <div class="ease-type-slug-compose__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-type-slug-compose__controls">
          <button type="button" class="ease-type-slug-compose__btn primary">Engage</button>
          <button type="button" class="ease-type-slug-compose__btn">Reset</button>
          <label class="ease-type-slug-compose__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-type-slug-compose__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
