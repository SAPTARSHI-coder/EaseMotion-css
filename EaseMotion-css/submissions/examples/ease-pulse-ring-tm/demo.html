<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Pulse Ring Animation Utility</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section class="pulse-section">

    <div class="pulse-showcase">
      <div class="pulse-ring cyan md">
        <div class="pulse-dot"></div>
      </div>
      <span class="pulse-label">Cyan (default)</span>
    </div>

    <div class="pulse-showcase">
      <div class="pulse-ring blue md">
        <div class="pulse-dot"></div>
      </div>
      <span class="pulse-label">Blue</span>
    </div>

    <div class="pulse-showcase">
      <div class="pulse-ring purple md">
        <div class="pulse-dot"></div>
      </div>
      <span class="pulse-label">Purple</span>
    </div>

    <div class="pulse-showcase">
      <div class="pulse-ring green md">
        <div class="pulse-dot"></div>
      </div>
      <span class="pulse-label">Green</span>
    </div>

    <div class="pulse-showcase">
      <div class="pulse-ring red md">
        <div class="pulse-dot"></div>
      </div>
      <span class="pulse-label">Red</span>
    </div>

    <div class="pulse-showcase">
      <div class="pulse-ring cyan solid md">
        <div class="pulse-dot"></div>
      </div>
      <span class="pulse-label">Solid pulse</span>
    </div>

    <div class="pulse-showcase">
      <div class="pulse-ring cyan fast md">
        <div class="pulse-dot"></div>
      </div>
      <span class="pulse-label">Fast (1.2s)</span>
    </div>

    <div class="pulse-showcase">
      <div class="pulse-ring cyan lg">
        <div class="pulse-dot"></div>
      </div>
      <span class="pulse-label">Large</span>
    </div>

    <div class="pulse-showcase">
      <div class="pulse-badge cyan">
        <svg class="pulse-badge-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 01-3.46 0"/>
        </svg>
        <span class="pulse-badge-count">3</span>
      </div>
      <span class="pulse-label">Notification badge</span>
    </div>

  </section>
</body>
</html>
