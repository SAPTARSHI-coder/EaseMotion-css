<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Walschaerts Valve Gear — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Walschaerts Valve Gear demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Walschaerts Valve Gear</h1>
      <p class="lede">Walschaerts valve gear lifting the radius rod</p>
    </header>

    <section class="ease-walschaerts-valve-gear" data-demo="walschaerts-valve-gear" aria-live="polite">
      <div class="ease-walschaerts-valve-gear__housing">
        <div class="ease-walschaerts-valve-gear__bezel">
          <div class="ease-walschaerts-valve-gear__face">
            <div class="ease-walschaerts-valve-gear__readout">
              <span class="ease-walschaerts-valve-gear__label">Walschaerts Valve Gear</span>
              <span class="ease-walschaerts-valve-gear__value">LIVE</span>
            </div>
            <div class="ease-walschaerts-valve-gear__motion" aria-hidden="true">
              <span class="ease-walschaerts-valve-gear__a"></span>
              <span class="ease-walschaerts-valve-gear__b"></span>
              <span class="ease-walschaerts-valve-gear__c"></span>
              <span class="ease-walschaerts-valve-gear__d"></span>
            </div>
            <div class="ease-walschaerts-valve-gear__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-walschaerts-valve-gear__controls">
          <button type="button" class="ease-walschaerts-valve-gear__btn primary">Notch</button>
          <button type="button" class="ease-walschaerts-valve-gear__btn">Mid</button>
          <label class="ease-walschaerts-valve-gear__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-walschaerts-valve-gear__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
