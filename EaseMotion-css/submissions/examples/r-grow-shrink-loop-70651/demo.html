<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Pure CSS grow and shrink loop animation">
  <title>CSS Grow Shrink Loop</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section class="demo" aria-labelledby="demo-title">
      <div class="glow glow-one" aria-hidden="true"></div>
      <div class="glow glow-two" aria-hidden="true"></div>

      <div class="content">
        <span class="eyebrow">CSS Animation</span>

        <h1 id="demo-title">Grow &amp; Shrink Loop</h1>

        <p class="description">
          A smooth breathing-style animation created entirely with CSS.
        </p>

        <div
          class="pulse-orb"
          role="img"
          aria-label="Animated glowing orb that continuously grows and shrinks"
        >
          <span class="orb-core"></span>
          <span class="orb-ring ring-one"></span>
          <span class="orb-ring ring-two"></span>
        </div>

        <p class="status">
          <span class="status-dot" aria-hidden="true"></span>
          Continuous CSS animation
        </p>
      </div>
    </section>
  </main>
</body>
</html>
