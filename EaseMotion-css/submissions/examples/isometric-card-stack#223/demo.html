<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Isometric Card Stack | EaseMotion CSS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="iso-scene">
        <div class="card-stack">
            <!-- Card 1 (Bottom) -->
            <div class="iso-card card-1">
                <div class="card-face">
                    <div class="card-icon">🎨</div>
                    <h3>Design</h3>
                    <p>Creative UI/UX Solutions</p>
                </div>
            </div>

            <!-- Card 2 -->
            <div class="iso-card card-2">
                <div class="card-face">
                    <div class="card-icon">⚡</div>
                    <h3>Develop</h3>
                    <p>Fast & Scalable Code</p>
                </div>
            </div>

            <!-- Card 3 -->
            <div class="iso-card card-3">
                <div class="card-face">
                    <div class="card-icon">🚀</div>
                    <h3>Deploy</h3>
                    <p>Ship to Production</p>
                </div>
            </div>

            <!-- Card 4 (Top) -->
            <div class="iso-card card-4">
                <div class="card-face">
                    <div class="card-icon">📊</div>
                    <h3>Analyze</h3>
                    <p>Data-Driven Insights</p>
                </div>
            </div>

            <!-- Card 5 (Topmost) -->
            <div class="iso-card card-5">
                <div class="card-face">
                    <div class="card-icon">🔄</div>
                    <h3>Iterate</h3>
                    <p>Continuous Improvement</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
