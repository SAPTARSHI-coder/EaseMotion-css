<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flip Turn Page Book</title>
  <link rel="stylesheet" href="./style.css">
  <style>
    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background-color: #e2e8f0;
      font-family: system-ui, -apple-system, sans-serif;
    }
    
    .demo-book {
      /* Applying perspective to the parent creates the 3D space for the page flip */
      perspective: 1200px;
      position: relative;
      width: 300px;
      height: 400px;
      display: flex;
    }

    /* The static right side of the book */
    .book-back {
      position: absolute;
      right: 0;
      width: 50%;
      height: 100%;
      background: #ffffff;
      border-radius: 0 8px 8px 0;
      box-shadow: 10px 10px 20px rgba(0,0,0,0.1);
      display: flex;
      justify-content: center;
      align-items: center;
      color: #cbd5e1;
      font-size: 2rem;
      border-left: 2px solid #e2e8f0;
    }

    /* The turning page */
    .demo-page {
      position: absolute;
      right: 0;
      width: 50%;
      height: 100%;
      background: #f8fafc;
      border-radius: 0 8px 8px 0;
      box-shadow: 5px 5px 15px rgba(0,0,0,0.1);
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      color: #334155;
      /* Ensure transform origin is on the left edge (spine) */
      transform-origin: left center;
    }
  </style>
</head>
<body>

  <div class="demo-book">
    <div class="book-back">2</div>
    <!-- Using the utility class -->
    <div class="demo-page ease-anim-flip-turn-page-book">
      Page 1
    </div>
  </div>

  <script>
    // Click to replay animation
    document.querySelector('.demo-page').addEventListener('click', function() {
      this.classList.remove('ease-anim-flip-turn-page-book');
      void this.offsetWidth; // trigger reflow
      this.classList.add('ease-anim-flip-turn-page-book');
    });
  </script>
</body>
</html>
