<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Machine Learning QNN - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css"></head><body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030712; color: #ffffff;">

    <div class="ease-card ease-card-glass qnn-container">
        <div class="qnn-header">
            <h2>Quantum Neural Networks</h2>
            <span class="ease-badge ease-badge-secondary">Quantum Machine Learning</span>
        </div>
        
        <div class="qnn-screen ease-center">
            <div class="qnn-flux flux-qnn-a"></div>
            <div class="qnn-flux flux-qnn-b"></div>
            <div class="qnn-boundary-ring"></div>
            <div class="qnn-core ease-center"></div>
        </div>

        <div class="qnn-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Parameterized Circuits &amp; Gradient Descent</span>
            <button class="ease-btn ease-btn-secondary ease-btn-sm ease-hover-grow">Run QNN Training</button>
        </div>
    </div></body></html>
