<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Morph-Glow Progress Bar | EaseMotion CSS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<section class="em-progress-section">

    <div class="heading">
        <h1>Morph-Glow Progress Bars</h1>
        <p>Elegant animated progress indicators for modern SaaS dashboards.</p>
    </div>

    <div class="progress-grid">

        <div class="progress-card">
            <div class="progress-info">
                <span>Customer Growth</span>
                <span>92%</span>
            </div>

            <div class="em-progress morph-blue">
                <div class="fill" style="--value:92%;"></div>
            </div>
        </div>

        <div class="progress-card">
            <div class="progress-info">
                <span>Cloud Storage</span>
                <span>78%</span>
            </div>

            <div class="em-progress morph-cyan">
                <div class="fill" style="--value:78%;"></div>
            </div>
        </div>

        <div class="progress-card">
            <div class="progress-info">
                <span>API Usage</span>
                <span>64%</span>
            </div>

            <div class="em-progress morph-purple">
                <div class="fill" style="--value:64%;"></div>
            </div>
        </div>

        <div class="progress-card">
            <div class="progress-info">
                <span>Team Productivity</span>
                <span>86%</span>
            </div>

            <div class="em-progress morph-pink">
                <div class="fill" style="--value:86%;"></div>
            </div>
        </div>

    </div>

</section>

</body>
</html>
