<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EaseMotion — Progress Tracker</title>
  <link rel="stylesheet" href="../../core/variables.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="demo-container">
    <h1>Progress Tracker</h1>
    <p>Multi-step progress indicator for onboarding flows.</p>

    <div class="tracker-card">
      <div class="steps">
        <div class="step completed">
          <div class="step-circle">✓</div>
          <span class="step-label">Account</span>
        </div>
        <div class="step-connector completed"></div>
        <div class="step active">
          <div class="step-circle">2</div>
          <span class="step-label">Profile</span>
        </div>
        <div class="step-connector"></div>
        <div class="step">
          <div class="step-circle">3</div>
          <span class="step-label">Verify</span>
        </div>
        <div class="step-connector"></div>
        <div class="step">
          <div class="step-circle">4</div>
          <span class="step-label">Done</span>
        </div>
      </div>
      <div class="step-content" id="stepContent">
        <h3>Complete Your Profile</h3>
        <p>Add your name and avatar to personalize your account.</p>
        <div class="step-actions">
          <button class="btn-secondary" onclick="prevStep()">Back</button>
          <button class="btn-primary" onclick="nextStep()">Continue</button>
        </div>
      </div>
    </div>
  </div>
  <script>
    let current = 2;
    function nextStep() { if (current < 4) { current++; updateSteps(); } }
    function prevStep() { if (current > 1) { current--; updateSteps(); } }
    function updateSteps() {
      document.querySelectorAll('.step').forEach((s, i) => {
        s.classList.remove('completed', 'active');
        if (i + 1 < current) s.classList.add('completed');
        else if (i + 1 === current) s.classList.add('active');
      });
      document.querySelectorAll('.step-connector').forEach((c, i) => {
        c.classList.toggle('completed', i + 1 < current);
      });
      const titles = ['', 'Create Account', 'Complete Profile', 'Verify Email', 'All Done!'];
      document.getElementById('stepContent').querySelector('h3').textContent = titles[current];
    }
  </script>
</body>
</html>
