<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Rotate-Fade Toast - Minimalist Tech</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="layout-container">
        
        <header class="section-header">
            <h1 class="title">Background Tasks</h1>
            <p class="subtitle">A minimalist tech toast component featuring a spatial 3D hinge entrance animation.</p>
        </header>

        <div class="dashboard-area">
            
            <div class="card">
                
                <!-- 
                   Pure CSS State Management for Toast Demo
                   We use a checkbox to toggle the state to replay the entrance animation.
                -->
                <div class="controls">
                    <input type="checkbox" id="replay-toggle" class="replay-input" checked>
                    <label for="replay-toggle" class="btn-replay">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"></polyline><polyline points="23 20 23 14 17 14"></polyline><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"></path></svg>
                        Trigger Toasts
                    </label>
                    
                    <div class="toast-container rotate-fade-group">
                        
                        <!-- Toast 1: Task Complete -->
                        <div class="toast toast-success delay-1">
                            <div class="toast-icon-wrapper">
                                <svg class="toast-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
                            </div>
                            <div class="toast-content">
                                <span class="toast-title">Index Rebuild Complete</span>
                                <span class="toast-desc">Elasticsearch indices were successfully rebuilt across 3 clusters.</span>
                            </div>
                            <button class="toast-close" aria-label="Close notification">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                            </button>
                        </div>
                        
                        <!-- Toast 2: System Update -->
                        <div class="toast toast-primary delay-2">
                            <div class="toast-icon-wrapper">
                                <svg class="toast-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                            </div>
                            <div class="toast-content">
                                <span class="toast-title">Firmware Update Available</span>
                                <span class="toast-desc">Version v1.2.4 is ready to be installed. This requires a restart.</span>
                            </div>
                            <div class="toast-actions">
                                <button class="action-btn">Install Now</button>
                            </div>
                        </div>

                    </div>
                </div>
                
            </div>
            
        </div>
    </div>

</body>
</html>
