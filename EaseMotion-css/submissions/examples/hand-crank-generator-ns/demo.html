<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hand Crank Generator — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Hand Crank Generator demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Hand Crank Generator</h1>
      <p class="lede">Hand-crank dynamo lighting a bulb with RPM</p>
    </header>

    <section class="ease-hand-crank-generator" data-demo="hand-crank-generator" aria-live="polite">
      <div class="ease-hand-crank-generator__housing">
        <div class="ease-hand-crank-generator__bezel">
          <div class="ease-hand-crank-generator__face">
            <div class="ease-hand-crank-generator__readout">
              <span class="ease-hand-crank-generator__label">Hand Crank Generator</span>
              <span class="ease-hand-crank-generator__value">LIVE</span>
            </div>
            <div class="ease-hand-crank-generator__motion" aria-hidden="true">
              <span class="ease-hand-crank-generator__a"></span>
              <span class="ease-hand-crank-generator__b"></span>
              <span class="ease-hand-crank-generator__c"></span>
              <span class="ease-hand-crank-generator__d"></span>
            </div>
            <div class="ease-hand-crank-generator__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-hand-crank-generator__controls">
          <button type="button" class="ease-hand-crank-generator__btn primary">Engage</button>
          <button type="button" class="ease-hand-crank-generator__btn">Reset</button>
          <label class="ease-hand-crank-generator__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-hand-crank-generator__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
