<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Interactive, dependency-free Success Toast component with spring bounce check animation."
    />
    <title>Success Toast Demo - EaseMotion CSS</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="demo-container">
      <header>
        <h1 class="demo-title">Success Toast</h1>
        <p class="demo-description">
          An interactive, accessible confirmation toast with a spring-bounce
          check icon animation.
        </p>
      </header>

      <section class="demo-controls" aria-label="Toast Controls">
        <button type="button" class="btn btn-primary" id="btn-show">
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
            <polyline points="22 4 12 14.01 9 11.01"></polyline>
          </svg>
          Trigger Success Toast
        </button>

        <button type="button" class="btn btn-secondary" id="btn-replay">
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <polyline points="23 4 23 10 17 10"></polyline>
            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
          </svg>
          Replay Animation
        </button>

        <button type="button" class="btn btn-secondary" id="btn-dismiss">
          Dismiss
        </button>
      </section>
    </main>

    <!-- Viewport Toast Container -->
    <div class="toast-viewport" id="toast-viewport">
      <aside
        class="success-toast"
        id="success-toast"
        role="status"
        aria-live="polite"
        aria-atomic="true"
      >
        <div class="toast-icon-wrapper" aria-hidden="true">
          <svg class="toast-icon" viewBox="0 0 24 24">
            <path d="M20 6L9 17l-5-5"></path>
          </svg>
        </div>

        <div class="toast-content">
          <h2 class="toast-title" id="toast-title">
            Changes Saved Successfully
          </h2>
          <p class="toast-message" id="toast-message">
            Your profile updates have been safely stored in the cloud.
          </p>
        </div>

        <button
          type="button"
          class="toast-close-btn"
          id="toast-close-btn"
          aria-label="Close notification"
        >
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>

        <div class="toast-progress" aria-hidden="true"></div>
      </aside>
    </div>

    <script>
      (function () {
        const toast = document.getElementById("success-toast");
        const btnShow = document.getElementById("btn-show");
        const btnReplay = document.getElementById("btn-replay");
        const btnDismiss = document.getElementById("btn-dismiss");
        const btnClose = document.getElementById("toast-close-btn");

        let timerId = null;
        const DURATION = 4000;

        function showToast() {
          hideToast();
          // Force DOM reflow to restart CSS animations cleanly
          void toast.offsetWidth;
          toast.classList.add("is-visible");

          clearTimeout(timerId);
          timerId = setTimeout(function () {
            hideToast();
          }, DURATION);
        }

        function hideToast() {
          clearTimeout(timerId);
          toast.classList.remove("is-visible");
        }

        btnShow.addEventListener("click", showToast);
        btnReplay.addEventListener("click", showToast);
        btnDismiss.addEventListener("click", hideToast);
        btnClose.addEventListener("click", hideToast);

        // Dismiss toast on Escape key when focused inside toast
        toast.addEventListener("keydown", function (e) {
          if (e.key === "Escape") {
            hideToast();
            btnShow.focus();
          }
        });
      })();
    </script>
  </body>
</html>
