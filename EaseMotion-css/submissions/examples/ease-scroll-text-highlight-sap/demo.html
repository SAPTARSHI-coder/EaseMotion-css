<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ease-scroll-text-highlight-sap demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #f4f4f5; }
    .spacer { height: 70vh; display: flex; align-items: center; justify-content: center; color: #94a3b8; }
    .page { display: flex; justify-content: center; padding-bottom: 300px; }
  </style>
</head>
<body>
  <div class="spacer">Scroll down</div>
  <div class="page">
    <p class="text-highlight-sap" id="text">
      <span class="hl-word">Design</span> <span class="hl-word">is</span> <span class="hl-word">not</span>
      <span class="hl-word">just</span> <span class="hl-word">what</span> <span class="hl-word">it</span>
      <span class="hl-word">looks</span> <span class="hl-word">like,</span>
      <span class="hl-word">it's</span> <span class="hl-word">how</span> <span class="hl-word">it</span>
      <span class="hl-word">works.</span>
    </p>
  </div>
  <script>
    const words = [...document.querySelectorAll('.hl-word')];
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          const idx = words.indexOf(entry.target);
          entry.target.style.transitionDelay = `${idx * 0.08}s`;
          entry.target.classList.add('highlighted');
        }
      });
    }, { threshold: 0.9 });
    words.forEach(w => observer.observe(w));
  </script>
</body>
</html>
