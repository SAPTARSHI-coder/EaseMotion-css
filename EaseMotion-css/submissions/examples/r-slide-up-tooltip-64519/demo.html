<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CSS Slide-Up Tooltip">
  <title>Slide-Up Tooltip</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section class="showcase">
      <p class="eyebrow">EASEMOTION CSS</p>
      <h1>Slide-Up Tooltip</h1>
      <p class="intro">
        A lightweight tooltip that smoothly rises into view on hover and
        keyboard focus.
      </p>

      <div class="tooltip-demo">
        <button class="tooltip-trigger" type="button" aria-describedby="tooltip">
          Explore
          <span class="tooltip" id="tooltip" role="tooltip">
            Smooth CSS interaction
          </span>
        </button>
      </div>
    </section>
  </main>
</body>
</html>
