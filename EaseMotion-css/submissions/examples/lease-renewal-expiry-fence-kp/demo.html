<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Lease Renewal Expiry Fence</title><link rel="stylesheet" href="style.css" /></head>
<body>
  <main class="lease-shell" aria-labelledby="lease-title">
    <section class="lease-board">
      <p class="eyebrow">Coordinator safety</p><h1 id="lease-title">Lease Renewal Expiry Fence</h1>
      <p class="summary">Renewal pulses extend the active lease while the expiry fence blocks stale holders from coordinating work.</p>
      <div class="lease-stage" role="img" aria-label="Animated lease renewal expiry fence visualization">
        <div class="holder active"><strong>active</strong><span></span><span></span><span></span></div>
        <div class="timeline"><i></i><i></i><i></i><b></b></div>
        <div class="fence"><em></em><em></em><em></em><small>fence</small></div>
        <div class="holder stale"><strong>stale</strong><span></span><span></span><span></span></div>
      </div>
      <div class="readouts"><span>ttl 24s</span><span>renewed</span><span>stale blocked</span></div>
    </section>
  </main>
</body>
</html>
