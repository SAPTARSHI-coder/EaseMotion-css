<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vacuum Button – Pulls Particles Toward It</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <h1>🌀 Vacuum Button</h1>
    <p class="subtitle">Pulls particles toward it with suction effect</p>

    <div class="vacuum-container">
      <canvas id="canvas"></canvas>
      
      <!-- Overlay info -->
      <div class="info-overlay">
        <span class="vacuum-status" id="vacuumStatus">🌀 Idle</span>
        <span class="particle-count" id="particleCount">✦ 0 particles</span>
      </div>

      <!-- Vacuum Button -->
      <button class="vacuum-btn" id="vacuumBtn">
        <span class="btn-icon">🌀</span>
        <span class="btn-label">Vacuum</span>
        <span class="btn-sub">Click to suck particles</span>
      </button>
    </div>

    <!-- Controls -->
    <div class="controls">
      <button class="ctrl-btn suck" id="suckBtn">💨 Suck</button>
      <button class="ctrl-btn blow" id="blowBtn">💨 Blow</button>
      <button class="ctrl-btn toggle" id="toggleBtn">🔄 Toggle</button>
      <button class="ctrl-btn reset" id="resetBtn">↺ Reset</button>
    </div>

    <!-- Sliders -->
    <div class="slider-container">
      <span class="slider-label">Particles</span>
      <input type="range" id="countSlider" min="10" max="80" value="30" step="5" />
      <span class="slider-value" id="countValue">30</span>
    </div>

    <div class="slider-container">
      <span class="slider-label">Suction Power</span>
      <input type="range" id="powerSlider" min="1" max="10" value="5" />
      <span class="slider-value" id="powerValue">5×</span>
    </div>

    <div class="slider-container">
      <span class="slider-label">Range</span>
      <input type="range" id="rangeSlider" min="20" max="100" value="60" />
      <span class="slider-value" id="rangeValue">60%</span>
    </div>

    <div class="slider-container">
      <span class="slider-label">Speed</span>
      <input type="range" id="speedSlider" min="1" max="10" value="5" />
      <span class="slider-value" id="speedValue">5×</span>
    </div>

    <!-- Status -->
    <div class="status" id="status">🌀 Vacuum ready — click the button to suck particles!</div>

    <!-- Keyboard shortcuts -->
    <div class="shortcuts">
      <kbd>Click</kbd> Suck · <kbd>S</kbd> Suck · <kbd>B</kbd> Blow · <kbd>T</kbd> Toggle · <kbd>R</kbd> Reset
    </div>
  </div>

  <script>
    (function() {
      "use strict";

      // DOM elements
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      const vacuumStatus = document.getElementById('vacuumStatus');
      const particleCount = document.getElementById('particleCount');
      const vacuumBtn = document.getElementById('vacuumBtn');
      const suckBtn = document.getElementById('suckBtn');
      const blowBtn = document.getElementById('blowBtn');
      const toggleBtn = document.getElementById('toggleBtn');
      const resetBtn = document.getElementById('resetBtn');
      const status = document.getElementById('status');
      const countSlider = document.getElementById('countSlider');
      const countValue = document.getElementById('countValue');
      const powerSlider = document.getElementById('powerSlider');
      const powerValue = document.getElementById('powerValue');
      const rangeSlider = document.getElementById('rangeSlider');
      const rangeValue = document.getElementById('rangeValue');
      const speedSlider = document.getElementById('speedSlider');
      const speedValue = document.getElementById('speedValue');

      // State
      let particles = [];
      let isActive = false;
      let mode = 'idle'; // 'idle', 'suck', 'blow'
      let animationId = null;
      let time = 0;

      // Constants
      const PARTICLE_COLORS = [
        '#ff6b6b', '#ff4757', '#ff6348', '#ff9f43', '#feca57',
        '#ffd93d', '#ff6b81', '#e056a0', '#a29bfe', '#6c5ce7',
        '#00cec9', '#00b894', '#55efc4', '#81ecec', '#74b9ff',
        '#0984e3', '#fd79a8', '#e17055', '#fdcb6e', '#d63031'
      ];

      // ----- Canvas setup -----
      function setupCanvas() {
        const rect = canvas.parentElement.getBoundingClientRect();
        const size = Math.min(rect.width - 40, 600);
        canvas.width = size;
        canvas.height = size;
        canvas.style.width = size + 'px';
        canvas.style.height = size + 'px';
      }

      // ----- Particle class -----
      class Particle {
        constructor(x, y) {
          const w = canvas.width;
          const h = canvas.height;
          const padding = 30;
          
          this.x = x || padding + Math.random() * (w - padding * 2);
          this.y = y || padding + Math.random() * (h - padding * 2);
          this.size = 3 + Math.random() * 6;
          this.speed = 0.5 + Math.random() * 1.5;
          this.angle = Math.random() * Math.PI * 2;
          this.color = PARTICLE_COLORS[Math.floor(Math.random() * PARTICLE_COLORS.length)];
          this.opacity = 0.6 + Math.random() * 0.4;
          this.trail = [];
          this.trailLength = 3 + Math.floor(Math.random() * 5);
          this.vx = (Math.random() - 0.5) * 0.5;
          this.vy = (Math.random() - 0.5) * 0.5;
          this.mass = 0.5 + Math.random() * 0.5;
          this.isSucked = false;
          this.suckProgress = 0;
        }

        update(cx, cy, mode, power, range, speedMult) {
          const dx = this.x - cx;
          const dy = this.y - cy;
          const dist = Math.sqrt(dx * dx + dy * dy);
          const rangePx = canvas.width * (range / 100) * 0.7;

          this.trail.push({ x: this.x, y: this.y });
          if (this.trail.length > this.trailLength) {
            this.trail.shift();
          }

          if (mode === 'suck' && dist < rangePx) {
            // Suck particles toward center
            const force = (1 - dist / rangePx) * power * 0.08;
            const angle = Math.atan2(dy, dx);
            this.vx += Math.cos(angle) * force * this.mass;
            this.vy += Math.sin(angle) * force * this.mass;
            this.suckProgress = Math.min(1, this.suckProgress + 0.02);
            
            if (dist < 20) {
              this.isSucked = true;
              this.opacity *= 0.98;
            }
          } else if (mode === 'blow' && dist < rangePx) {
            // Blow particles away from center
            const force = (1 - dist / rangePx) * power * 0.06;
            const angle = Math.atan2(dy, dx);
            this.vx -= Math.cos(angle) * force * this.mass;
            this.vy -= Math.sin(angle) * force * this.mass;
            this.suckProgress = Math.max(0, this.suckProgress - 0.02);
          } else {
            // Wander
            this.vx += (Math.random() - 0.5) * 0.05;
            this.vy += (Math.random() - 0.5) * 0.05;
            this.suckProgress *= 0.99;
          }

          // Apply damping
          this.vx *= 0.98;
          this.vy *= 0.98;

          // Clamp speed
          const maxSpeed = 3 * speedMult;
          const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
          if (speed > maxSpeed) {
            this.vx = (this.vx / speed) * maxSpeed;
            this.vy = (this.vy / speed) * maxSpeed;
          }

          this.x += this.vx * speedMult;
          this.y += this.vy * speedMult;

          // Keep within bounds with soft bounce
          const padding = 10;
          if (this.x < padding) { this.x = padding; this.vx = Math.abs(this.vx) * 0.5; }
          if (this.x > canvas.width - padding) { this.x = canvas.width - padding; this.vx = -Math.abs(this.vx) * 0.5; }
          if (this.y < padding) { this.y = padding; this.vy = Math.abs(this.vy) * 0.5; }
          if (this.y > canvas.height - padding) { this.y = canvas.height - padding; this.vy = -Math.abs(this.vy) * 0.5; }
        }

        draw(ctx) {
          // Draw trail
          if (this.trail.length > 1) {
            for (let i = 0; i < this.trail.length - 1; i++) {
              const t = i / this.trail.length;
              const alpha = this.opacity * t * 0.3;
              const size = this.size * t * 0.3;
              ctx.fillStyle = this.color + Math.round(alpha * 255).toString(16).padStart(2, '0');
              ctx.beginPath();
              ctx.arc(this.trail[i].x, this.trail[i].y, size, 0, Math.PI * 2);
              ctx.fill();
            }
          }

          // Glow
          const glowSize = this.size * 4 * (1 + this.suckProgress * 0.5);
          const gradient = ctx.createRadialGradient(
            this.x, this.y, 0,
            this.x, this.y, glowSize
          );
          const alpha = this.opacity * (0.2 + 0.3 * this.suckProgress);
          gradient.addColorStop(0, this.color + Math.round(alpha * 255).toString(16).padStart(2, '0'));
          gradient.addColorStop(1, this.color + '00');
          ctx.fillStyle = gradient;
          ctx.beginPath();
          ctx.arc(this.x, this.y, glowSize, 0, Math.PI * 2);
          ctx.fill();

          // Core
          const coreSize = this.size * (0.6 + 0.4 * (1 - this.suckProgress * 0.3));
          ctx.shadowColor = this.color + '44';
          ctx.shadowBlur = 10;
          ctx.fillStyle = this.color;
          ctx.globalAlpha = this.opacity * (0.7 + 0.3 * (1 - this.suckProgress * 0.5));
          ctx.beginPath();
          ctx.arc(this.x, this.y, coreSize, 0, Math.PI * 2);
          ctx.fill();
          ctx.globalAlpha = 1;
          ctx.shadowBlur = 0;

          // Highlight
          if (this.suckProgress < 0.8) {
            ctx.fillStyle = 'rgba(255, 255, 255, ' + (0.2 * this.opacity) + ')';
            ctx.beginPath();
            ctx.arc(this.x - coreSize * 0.2, this.y - coreSize * 0.3, coreSize * 0.3, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      }

      // ----- Generate particles -----
      function generateParticles(count) {
        const w = canvas.width;
        const h = canvas.height;
        const cx = w / 2;
        const cy = h / 2;
        const radius = Math.min(w, h) * 0.35;

        particles = [];
        for (let i = 0; i < count; i++) {
          const angle = Math.random() * Math.PI * 2;
          const r = radius * (0.3 + Math.random() * 0.7);
          const x = cx + Math.cos(angle) * r;
          const y = cy + Math.sin(angle) * r;
          particles.push(new Particle(x, y));
        }
        updateUI();
      }

      // ----- Update UI -----
      function updateUI() {
        particleCount.textContent = `✦ ${particles.length} particles`;
        countValue.textContent = particles.length || countSlider.value;
      }

      // ----- Set mode -----
      function setMode(newMode) {
        mode = newMode;
        isActive = newMode !== 'idle';
        
        const statusText = {
          'idle': '🌀 Idle',
          'suck': '💨 Sucking',
          'blow': '💨 Blowing'
        };
        vacuumStatus.textContent = statusText[newMode] || '🌀 Idle';
        
        if (newMode === 'suck') {
          status.textContent = '💨 Vacuum sucking particles!';
          vacuumBtn.classList.add('active');
        } else if (newMode === 'blow') {
          status.textContent = '💨 Vacuum blowing particles!';
          vacuumBtn.classList.add('active');
        } else {
          status.textContent = '🌀 Vacuum idle';
          vacuumBtn.classList.remove('active');
        }
      }

      // ----- Suck -----
      function suck() {
        if (mode === 'suck') {
          setMode('idle');
        } else {
          setMode('suck');
        }
      }

      // ----- Blow -----
      function blow() {
        if (mode === 'blow') {
          setMode('idle');
        } else {
          setMode('blow');
        }
      }

      // ----- Toggle -----
      function toggleMode() {
        if (mode === 'idle') {
          setMode('suck');
        } else if (mode === 'suck') {
          setMode('blow');
        } else {
          setMode('idle');
        }
      }

      // ----- Reset -----
      function resetVacuum() {
        setMode('idle');
        const count = parseInt(countSlider.value);
        generateParticles(count);
        status.textContent = '↺ Vacuum reset';
      }

      // ----- Draw -----
      function draw() {
        const w = canvas.width;
        const h = canvas.height;
        const cx = w / 2;
        const cy = h / 2;

        // Clear
        ctx.clearRect(0, 0, w, h);

        // Background
        const bgGradient = ctx.createRadialGradient(cx, cy, 0, cx, cy, w * 0.8);
        bgGradient.addColorStop(0, '#0a0a1a');
        bgGradient.addColorStop(0.5, '#060612');
        bgGradient.addColorStop(1, '#020208');
        ctx.fillStyle = bgGradient;
        ctx.fillRect(0, 0, w, h);

        // Draw suction/blow range indicator
        if (mode !== 'idle') {
          const range = parseInt(rangeSlider.value) / 100 * w * 0.35;
          const alpha = mode === 'suck' ? 0.05 : 0.05;
          const gradient = ctx.createRadialGradient(cx, cy, 0, cx, cy, range);
          if (mode === 'suck') {
            gradient.addColorStop(0, `rgba(100, 200, 255, ${alpha})`);
            gradient.addColorStop(1, 'rgba(100, 200, 255, 0)');
          } else {
            gradient.addColorStop(0, `rgba(255, 200, 100, ${alpha})`);
            gradient.addColorStop(1, 'rgba(255, 200, 100, 0)');
          }
          ctx.fillStyle = gradient;
          ctx.beginPath();
          ctx.arc(cx, cy, range, 0, Math.PI * 2);
          ctx.fill();

          // Ring
          ctx.strokeStyle = mode === 'suck' ? 
            `rgba(100, 200, 255, ${0.1 + 0.05 * Math.sin(time * 2)})` :
            `rgba(255, 200, 100, ${0.1 + 0.05 * Math.sin(time * 2)})`;
          ctx.lineWidth = 1;
          ctx.setLineDash([5, 5]);
          ctx.lineDashOffset = -time * 20;
          ctx.beginPath();
          ctx.arc(cx, cy, range, 0, Math.PI * 2);
          ctx.stroke();
          ctx.setLineDash([]);
        }

        // Update particles
        const power = parseInt(powerSlider.value) / 5;
        const rangeVal = parseInt(rangeSlider.value);
        const speedMult = parseInt(speedSlider.value) / 5;

        particles.forEach(p => {
          p.update(cx, cy, mode, power, rangeVal, speedMult);
        });

        // Remove sucked particles (optional - keep them for visual)
        // particles = particles.filter(p => !p.isSucked || p.opacity > 0.01);

        // Draw particles
        particles.forEach(p => p.draw(ctx));

        // Center vacuum effect
        const centerGlow = ctx.createRadialGradient(cx, cy, 0, cx, cy, 30);
        const glowColor = mode === 'suck' ? '100, 200, 255' : 
                         mode === 'blow' ? '255, 200, 100' : 
                         '200, 200, 255';
        centerGlow.addColorStop(0, `rgba(${glowColor}, ${mode !== 'idle' ? 0.3 : 0.1})`);
        centerGlow.addColorStop(0.5, `rgba(${glowColor}, ${mode !== 'idle' ? 0.1 : 0.05})`);
        centerGlow.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = centerGlow;
        ctx.beginPath();
        ctx.arc(cx, cy, 30, 0, Math.PI * 2);
        ctx.fill();

        // Center circle
        ctx.fillStyle = mode === 'suck' ? 'rgba(100, 200, 255, 0.3)' :
                        mode === 'blow' ? 'rgba(255, 200, 100, 0.3)' :
                        'rgba(255, 255, 255, 0.1)';
        ctx.shadowColor = mode === 'suck' ? 'rgba(100, 200, 255, 0.2)' :
                          mode === 'blow' ? 'rgba(255, 200, 100, 0.2)' :
                          'rgba(255, 255, 255, 0.05)';
        ctx.shadowBlur = 20;
        ctx.beginPath();
        ctx.arc(cx, cy, 8, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
      }

      // ----- Animation loop -----
      function animate() {
        time += 0.016;
        draw();
        animationId = requestAnimationFrame(animate);
      }

      // ----- Start animation -----
      function startAnimation() {
        if (animationId) {
          cancelAnimationFrame(animationId);
        }
        animate();
      }

      // ----- Event Listeners -----
      vacuumBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        suck();
      });

      suckBtn.addEventListener('click', suck);
      blowBtn.addEventListener('click', blow);
      toggleBtn.addEventListener('click', toggleMode);
      resetBtn.addEventListener('click', resetVacuum);

      countSlider.addEventListener('input', (e) => {
        const val = parseInt(e.target.value);
        countValue.textContent = val;
        generateParticles(val);
        status.textContent = `✦ Particle count: ${val}`;
      });

      powerSlider.addEventListener('input', (e) => {
        powerValue.textContent = e.target.value + '×';
      });

      rangeSlider.addEventListener('input', (e) => {
        rangeValue.textContent = e.target.value + '%';
      });

      speedSlider.addEventListener('input', (e) => {
        speedValue.textContent = e.target.value + '×';
      });

      // Keyboard shortcuts
      document.addEventListener('keydown', (e) => {
        if (e.key === 's' || e.key === 'S') {
          e.preventDefault();
          suck();
        }
        if (e.key === 'b' || e.key === 'B') {
          e.preventDefault();
          blow();
        }
        if (e.key === 't' || e.key === 'T') {
          e.preventDefault();
          toggleMode();
        }
        if (e.key === 'r' || e.key === 'R') {
          e.preventDefault();
          resetVacuum();
        }
        if (e.key === ' ' || e.key === 'Space') {
          e.preventDefault();
          toggleMode();
        }
      });

      // Click on canvas to toggle
      canvas.addEventListener('click', (e) => {
        if (e.target.closest('.vacuum-btn')) return;
        toggleMode();
      });

      // ----- Resize handler -----
      let resizeTimeout;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(() => {
          setupCanvas();
          const count = parseInt(countSlider.value);
          generateParticles(count);
        }, 200);
      });

      // ----- Init -----
      function init() {
        setupCanvas();
        const count = parseInt(countSlider.value);
        generateParticles(count);
        startAnimation();
        status.textContent = '🌀 Vacuum ready — click the button or press Space to suck!';
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }

    })();
  </script>
</body>
</html>
