<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pure CSS Skeleton Loader - EaseMotion</title>
    <!-- Include EaseMotion CSS -->
    <link rel="stylesheet" href="../../../easemotion.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard-layout">
        <header class="dashboard-header">
            <h1 class="ease-text-2xl">Dashboard</h1>
            <p class="ease-text-neutral-500">Fetching latest data...</p>
        </header>

        <main class="grid-container">
            <!-- Skeleton Card 1 -->
            <article class="card">
                <div class="skeleton-header">
                    <div class="em-skeleton skeleton-avatar"></div>
                    <div class="skeleton-title-group">
                        <div class="em-skeleton skeleton-title"></div>
                        <div class="em-skeleton skeleton-subtitle"></div>
                    </div>
                </div>
                <div class="skeleton-body">
                    <div class="em-skeleton skeleton-line"></div>
                    <div class="em-skeleton skeleton-line w-80"></div>
                    <div class="em-skeleton skeleton-line w-60"></div>
                </div>
            </article>

            <!-- Skeleton Card 2 -->
            <article class="card">
                <div class="skeleton-header">
                    <div class="em-skeleton skeleton-avatar"></div>
                    <div class="skeleton-title-group">
                        <div class="em-skeleton skeleton-title"></div>
                        <div class="em-skeleton skeleton-subtitle"></div>
                    </div>
                </div>
                <div class="skeleton-body">
                    <div class="em-skeleton skeleton-block"></div>
                </div>
            </article>

            <!-- Skeleton Card 3 -->
            <article class="card">
                <div class="skeleton-header">
                    <div class="em-skeleton skeleton-avatar"></div>
                    <div class="skeleton-title-group">
                        <div class="em-skeleton skeleton-title"></div>
                        <div class="em-skeleton skeleton-subtitle"></div>
                    </div>
                </div>
                <div class="skeleton-body">
                    <div class="em-skeleton skeleton-line"></div>
                    <div class="em-skeleton skeleton-line w-80"></div>
                    <div class="em-skeleton skeleton-line w-40"></div>
                </div>
            </article>
        </main>
    </div>
</body>
</html>
