<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stat Roll Number #87561 Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="showcase-wrapper">
    <div class="ticker-card">
      <div class="ticker-header">
        <span class="ticker-title">Total Active Nodes</span>
        <span class="ticker-badge">Live Ticker</span>
      </div>

      <div class="ticker-display">
        <span class="ticker-prefix">#</span>

        <div class="ticker-column">
          <div class="ticker-ribbon" id="d1" style="--digit-val: 0; --delay: 0.05s;">
            <div class="ticker-digit">0</div><div class="ticker-digit">1</div><div class="ticker-digit">2</div><div class="ticker-digit">3</div><div class="ticker-digit">4</div><div class="ticker-digit">5</div><div class="ticker-digit">6</div><div class="ticker-digit">7</div><div class="ticker-digit">8</div><div class="ticker-digit">9</div>
          </div>
        </div>

        <div class="ticker-column">
          <div class="ticker-ribbon" id="d2" style="--digit-val: 0; --delay: 0.15s;">
            <div class="ticker-digit">0</div><div class="ticker-digit">1</div><div class="ticker-digit">2</div><div class="ticker-digit">3</div><div class="ticker-digit">4</div><div class="ticker-digit">5</div><div class="ticker-digit">6</div><div class="ticker-digit">7</div><div class="ticker-digit">8</div><div class="ticker-digit">9</div>
          </div>
        </div>

        <div class="ticker-column">
          <div class="ticker-ribbon" id="d3" style="--digit-val: 0; --delay: 0.25s;">
            <div class="ticker-digit">0</div><div class="ticker-digit">1</div><div class="ticker-digit">2</div><div class="ticker-digit">3</div><div class="ticker-digit">4</div><div class="ticker-digit">5</div><div class="ticker-digit">6</div><div class="ticker-digit">7</div><div class="ticker-digit">8</div><div class="ticker-digit">9</div>
          </div>
        </div>

        <div class="ticker-column">
          <div class="ticker-ribbon" id="d4" style="--digit-val: 0; --delay: 0.35s;">
            <div class="ticker-digit">0</div><div class="ticker-digit">1</div><div class="ticker-digit">2</div><div class="ticker-digit">3</div><div class="ticker-digit">4</div><div class="ticker-digit">5</div><div class="ticker-digit">6</div><div class="ticker-digit">7</div><div class="ticker-digit">8</div><div class="ticker-digit">9</div>
          </div>
        </div>

        <span class="ticker-suffix">k</span>
      </div>

      <div class="controls-bar">
        <span class="ticker-info">Mechanical reel rolling physics</span>
        <button class="btn-roll" id="rollBtn">Randomize Number</button>
      </div>
    </div>
  </div>

  <script>
    const ribbons = [
      document.getElementById('d1'),
      document.getElementById('d2'),
      document.getElementById('d3'),
      document.getElementById('d4')
    ];
    const rollBtn = document.getElementById('rollBtn');

    function setRollValue(targetNumber) {
      const numStr = String(targetNumber).padStart(4, '0');
      numStr.split('').forEach((char, idx) => {
        if (ribbons[idx]) {
          ribbons[idx].style.setProperty('--digit-val', char);
        }
      });
    }

    rollBtn.addEventListener('click', () => {
      const randomVal = Math.floor(1000 + Math.random() * 9000);
      setRollValue(randomVal);
    });

    setTimeout(() => {
      setRollValue(5842);
    }, 200);
  </script>
</body>
</html>
