<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-submarine-sonar-screen</title>
</head>
<body>
<main class="sss-screen">
  <header class="sss-top">
    <h1 class="sss-name">Sonar</h1>
    <span class="sss-scan">Scan active</span>
  </header>
  <section class="sss-disc" aria-label="sonar display">
    <span class="sss-sweep"></span>
    <span class="sss-ring sss-ring-1"></span>
    <span class="sss-ring sss-ring-2"></span>
    <span class="sss-ring sss-ring-3"></span>
    <span class="sss-blip sss-blip-1"></span>
    <span class="sss-blip sss-blip-2"></span>
    <span class="sss-blip sss-blip-3"></span>
  </section>
  <footer class="sss-foot">
    <span class="sss-depth">Depth 82 m</span>
    <span class="sss-head">Heading 214</span>
  </footer>
</main>
</body>
</html>
