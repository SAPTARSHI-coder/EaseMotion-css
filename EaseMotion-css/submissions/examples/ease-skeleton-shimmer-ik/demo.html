<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EaseMotion CSS — Skeleton Loader & Shimmer Showcase</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="skel-demo-wrapper">
    <header class="skel-header">
      <span class="badge">UI Component Showcase</span>
      <h1>Skeleton Loader Shimmer Sweep</h1>
      <p>Animated content placeholder skeletons featuring continuous linear-gradient shimmer sweeps and reduced-motion compliance.</p>
    </header>

    <main class="skel-grid">
      <!-- Skeleton Card 1 -->
      <article class="skel-card">
        <div class="skel-media ease-skeleton-shimmer"></div>
        <div class="skel-body">
          <div class="skel-header-group">
            <div class="skel-avatar ease-skeleton-shimmer"></div>
            <div class="skel-meta">
              <div class="skel-line skel-title ease-skeleton-shimmer"></div>
              <div class="skel-line skel-subtitle ease-skeleton-shimmer"></div>
            </div>
          </div>
          <div class="skel-line skel-text ease-skeleton-shimmer"></div>
          <div class="skel-line skel-text skel-short ease-skeleton-shimmer"></div>
        </div>
      </article>

      <!-- Skeleton Card 2 -->
      <article class="skel-card">
        <div class="skel-media ease-skeleton-shimmer"></div>
        <div class="skel-body">
          <div class="skel-header-group">
            <div class="skel-avatar ease-skeleton-shimmer"></div>
            <div class="skel-meta">
              <div class="skel-line skel-title ease-skeleton-shimmer"></div>
              <div class="skel-line skel-subtitle ease-skeleton-shimmer"></div>
            </div>
          </div>
          <div class="skel-line skel-text ease-skeleton-shimmer"></div>
          <div class="skel-line skel-text skel-short ease-skeleton-shimmer"></div>
        </div>
      </article>
    </main>

    <footer class="skel-footer">
      <p>EaseMotion CSS Component &bull; Submitted by @Ishita-Katiyar-06</p>
    </footer>
  </div>
</body>
</html>
