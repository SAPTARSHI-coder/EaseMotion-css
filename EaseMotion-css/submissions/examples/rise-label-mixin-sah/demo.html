<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rise Label Mixin - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="form-box">
    <h1>Rise Label Mixin (<code>#54694</code>)</h1>
    <p class="desc">Input labels glide smoothly up to the border top-edge with elegant font scaling upon input focus or text entry.</p>
    
    <form class="demo-stack" onsubmit="return false;">
      <div class="ease-field-rise">
        <input type="text" id="repo" class="input-ctrl" placeholder=" " />
        <label for="repo" class="label-ctrl">Target Repository Path</label>
      </div>
      
      <div class="ease-field-rise">
        <input type="text" id="branch" class="input-ctrl" placeholder=" " value="feat-54694-rise-label" />
        <label for="branch" class="label-ctrl">Active Git Branch</label>
      </div>
      
      <button class="submit-action">Verify Label Elevation →</button>
    </form>
  </div>
</body>
</html>
