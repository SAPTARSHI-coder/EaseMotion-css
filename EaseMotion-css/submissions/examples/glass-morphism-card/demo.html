<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Glassmorphism Card</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="demo-stage">
      <section class="glass-card" aria-labelledby="gc-title">
        <span class="glass-card__avatar" aria-hidden="true">A</span>
        <h1 id="gc-title">Aria Solstice</h1>
        <p class="glass-card__role">Principal Designer</p>
        <p class="glass-card__bio">
          Crafting calm interfaces that feel like glass &mdash; light, layered,
          and quietly luminous.
        </p>
        <div class="glass-card__stats">
          <div class="glass-card__stat">
            <span class="glass-card__stat-num">128</span>
            <span class="glass-card__stat-label">Projects</span>
          </div>
          <div class="glass-card__stat">
            <span class="glass-card__stat-num">42k</span>
            <span class="glass-card__stat-label">Followers</span>
          </div>
        </div>
        <button type="button" class="glass-card__cta">Follow</button>
      </section>
    </main>
  </body>
</html>
