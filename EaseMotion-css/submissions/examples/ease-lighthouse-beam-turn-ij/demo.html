<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.8">
<title>Lighthouse Beam Turn</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="lighthouse">
  <header class="light-head">
    <h1 class="light-name">CAPE HOPE</h1>
    <p class="light-fog">FOG HORN</p>
  </header>
  <section class="light-scene" aria-label="Lighthouse by the sea">
    <div class="sea-swell"></div>
    <div class="light-tower">
      <span class="tower-base"></span>
      <span class="tower-band band-a"></span>
      <span class="tower-band band-b"></span>
      <span class="tower-band band-c"></span>
      <div class="lantern">
        <span class="lantern-pane"></span>
        <span class="lantern-dome"></span>
        <span class="beam-glow"></span>
      </div>
    </div>
    <div class="fog-ring"></div>
  </section>
  <footer class="light-foot">
    <span class="light-range">RANGE 18</span>
    <span class="light-flash">FLASH 4s</span>
  </footer>
</main>
</body>
</html>
