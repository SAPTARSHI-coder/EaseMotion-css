<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-fuel-consumption-meter</title>
</head>
<body>
<main class="fcm-card">
  <header class="fcm-head">
    <h1 class="fcm-title">Fuel Econ</h1>
    <span class="fcm-trip">Trip 42.1 km</span>
  </header>
  <section class="fcm-bar" aria-label="consumption bar">
    <span class="fcm-fill"></span>
    <span class="fcm-mark fcm-mark-1"></span>
    <span class="fcm-mark fcm-mark-2"></span>
    <span class="fcm-mark fcm-mark-3"></span>
  </section>
  <section class="fcm-read">
    <strong class="fcm-mpg">7.4</strong>
    <span class="fcm-unit">L / 100km</span>
  </section>
  <section class="fcm-ticks">
    <span class="fcm-tick fcm-tick-a"></span>
    <span class="fcm-tick fcm-tick-b"></span>
    <span class="fcm-tick fcm-tick-c"></span>
    <span class="fcm-tick fcm-tick-d"></span>
  </section>
  <footer class="fcm-foot">
    <span class="fcm-tank">Tank 62 L</span>
    <span class="fcm-eco">Eco</span>
  </footer>
</main>
</body>
</html>
