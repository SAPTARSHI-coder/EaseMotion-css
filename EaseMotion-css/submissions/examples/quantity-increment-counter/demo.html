<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quantity increment counter — EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <header class="page-head">
      <h1>Quantity increment counter</h1>
      <p>A plus/minus quantity spinner whose digit text slides up and out on each increment.</p>
    </header>
    <section class="demo">
      <div class="quantityincrementcounter"><button data-d="-1">−</button><span class="quantityincrementcounter-val">1</span><button data-d="1">+</button></div>
    </section>
    <footer class="page-foot">
      <small>Submission folder: <code>submissions/examples/quantity-increment-counter/</code></small>
    </footer>
  </main>
</body>
</html>
