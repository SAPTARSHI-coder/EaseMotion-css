<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interrupted Loader Animation Demo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<header>
  <h1>Interrupted Loader Animation Demo</h1>
  <p>Pure HTML & CSS visualization of common interrupted loader states.</p>
</header>

<main class="grid">

  <section class="card">
    <h2>Running</h2>
    <div class="loader running"></div>
    <span class="status running-text">Running</span>
  </section>

  <section class="card">
    <h2>Interrupted</h2>
    <div class="loader paused"></div>
    <span class="status stopped-text">Stopped Midway</span>
  </section>

  <section class="card">
    <h2>Restarted</h2>
    <div class="loader restarted"></div>
    <span class="status restart-text">Restarted</span>
  </section>

  <section class="card">
    <h2>Cancelled</h2>
    <div class="loader cancelled"></div>
    <span class="status cancel-text">Cancelled</span>
  </section>

  <section class="card">
    <h2>Rapid Start / Stop</h2>
    <div class="rapid-group">
      <div class="mini run"></div>
      <div class="mini pause"></div>
      <div class="mini run"></div>
      <div class="mini pause"></div>
    </div>
    <span class="status">Rapid Interaction</span>
  </section>

  <section class="card">
    <h2>Multiple Variations</h2>

    <div class="variation spin"></div>
    <div class="variation pulse"></div>
    <div class="variation ring"></div>

    <span class="status">Stable States</span>
  </section>

</main>

<footer>
  Pure HTML & CSS • No JavaScript
</footer>

</body>
</html>
