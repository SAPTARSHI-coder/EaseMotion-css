<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quantum Particle Matrix Loader Showcase | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
  <main class="container">
    <header class="header">
      <h1 class="title">QUANTUM MATRIX LOADER</h1>
      <p class="subtitle">Multi-ring gyroscopic orbital loader with energy pulse particle core</p>
    </header>

    <div class="loader-showcase">
      <div class="quantum-loader" aria-label="Loading quantum calculations..." role="status">
        <div class="ring ring-outer"></div>
        <div class="ring ring-middle"></div>
        <div class="ring ring-inner"></div>
        <div class="particle-core"></div>
      </div>

      <div class="loader-status">
        <span class="status-text">CALCULATING QUANTUM STATES...</span>
        <span class="status-percent">87%</span>
      </div>
    </div>
  </main>
</body>
</html>
