<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Frozen Sticky Table Column</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      margin: 0; min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 1rem; padding: 24px;
      background: linear-gradient(160deg, #f8fafc, #eef2ff 55%, #f8fafc);
      color: #111827; font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      
    }
    h1 { margin: 0; font-size: 1.25rem; text-align: center; }
    .note { margin: 0; max-width: 420px; text-align: center; color: #4b5563; font-size: 0.92rem; line-height: 1.45; }
  </style>
</head>
<body>
  <h1>Frozen Sticky Table Column</h1>
  
  <div class="table-scroll" id="tableScroll"><table><thead><tr><th class="sticky-col">Name</th><th>Role</th><th>Team</th><th>Location</th><th>Status</th></tr></thead>
<tbody><tr><td class="sticky-col">Ada</td><td>Engineer</td><td>Platform</td><td>Remote</td><td>Active</td></tr>
<tr><td class="sticky-col">Lin</td><td>Designer</td><td>Motion</td><td>Berlin</td><td>Active</td></tr></tbody></table></div>
  <script>
var el=document.getElementById('tableScroll');el.addEventListener('scroll',function(){el.classList.toggle('is-scrolled',el.scrollLeft>0)});
</script>
</body>
</html>
