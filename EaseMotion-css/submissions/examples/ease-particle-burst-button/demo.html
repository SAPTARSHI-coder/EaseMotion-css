<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ease Particle Burst Button</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="ease-particle-body">
  <button class="ease-particle-btn" id="burstBtn">
    <span>Click For Sparkles ✨</span>
  </button>

  <script>
    const btn = document.getElementById('burstBtn');
    btn.addEventListener('click', (e) => {
      const rect = btn.getBoundingClientRect();
      for (let i = 0; i < 16; i++) {
        const particle = document.createElement('div');
        particle.className = 'ease-sparkle';
        document.body.appendChild(particle);

        const x = e.clientX;
        const y = e.clientY;
        particle.style.left = `${x}px`;
        particle.style.top = `${y}px`;

        const angle = (i / 16) * 360;
        const dist = 60 + Math.random() * 40;
        const tx = Math.cos(angle * Math.PI / 180) * dist;
        const ty = Math.sin(angle * Math.PI / 180) * dist;

        particle.style.setProperty('--tx', `${tx}px`);
        particle.style.setProperty('--ty', `${ty}px`);

        setTimeout(() => particle.remove(), 700);
      }
    });
  </script>
</body>
</html>
