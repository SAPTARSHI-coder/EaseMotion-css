<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zoom-In Progress Bar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="progress-card">

    <h1>Accessibility Progress</h1>
    <p class="subtitle">
        Responsive progress bars with smooth zoom-in animations.
    </p>

    <div class="progress-item">
        <div class="progress-label">
            <span>HTML</span>
            <span>90%</span>
        </div>

        <div class="progress-track">
            <div class="progress-fill html"></div>
        </div>
    </div>

    <div class="progress-item">
        <div class="progress-label">
            <span>CSS</span>
            <span>80%</span>
        </div>

        <div class="progress-track">
            <div class="progress-fill css"></div>
        </div>
    </div>

    <div class="progress-item">
        <div class="progress-label">
            <span>Accessibility</span>
            <span>70%</span>
        </div>

        <div class="progress-track">
            <div class="progress-fill accessibility"></div>
        </div>
    </div>

    <div class="progress-item">
        <div class="progress-label">
            <span>Performance</span>
            <span>95%</span>
        </div>

        <div class="progress-track">
            <div class="progress-fill performance"></div>
        </div>
    </div>

</div>

</body>
</html>
