<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retro Nixie Tube Clock Showcase | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Monoton&family=VT323&display=swap" rel="stylesheet">
</head>
<body>
  <main class="container">
    <header class="header">
      <h1 class="title">NIXIE TUBE CLOCK</h1>
      <p class="subtitle">Retro neon cathode filament digital clock with glowing glass tube enclosures</p>
    </header>

    <div class="clock-display" aria-label="Nixie Tube Digital Clock" role="img">
      <div class="nixie-tube">
        <span class="digit">1</span>
        <span class="grid-overlay"></span>
      </div>
      <div class="nixie-tube">
        <span class="digit">0</span>
        <span class="grid-overlay"></span>
      </div>

      <div class="colon">:</div>

      <div class="nixie-tube">
        <span class="digit">4</span>
        <span class="grid-overlay"></span>
      </div>
      <div class="nixie-tube">
        <span class="digit">2</span>
        <span class="grid-overlay"></span>
      </div>

      <div class="colon">:</div>

      <div class="nixie-tube">
        <span class="digit">5</span>
        <span class="grid-overlay"></span>
      </div>
      <div class="nixie-tube">
        <span class="digit">9</span>
        <span class="grid-overlay"></span>
      </div>
    </div>
  </main>
</body>
</html>
