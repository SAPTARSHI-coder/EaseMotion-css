<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fault Tolerant Quantum Teleportation Gate Teleportation Units QGTU - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css"></head><body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030712; color: #ffffff;">

    <div class="ease-card ease-card-glass qgtu-container">
        <div class="qgtu-header">
            <h2>Gate Teleportation Unit</h2>
            <span class="ease-badge ease-badge-warning">Fault-Tolerant Quantum</span>
        </div>
        
        <div class="qgtu-screen ease-center">
            <div class="qgtu-flux flux-qgtu-a"></div>
            <div class="qgtu-flux flux-qgtu-b"></div>
            <div class="qgtu-boundary-ring"></div>
            <div class="qgtu-core ease-center"></div>
        </div>

        <div class="qgtu-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Non-Clifford Operations &amp; Magic State Injection</span>
            <button class="ease-btn ease-btn-warning ease-btn-sm ease-hover-grow">Run Gate Teleportation</button>
        </div>
    </div></body></html>
