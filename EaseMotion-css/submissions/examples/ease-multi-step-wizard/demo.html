<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ease Multi-Step Wizard Form — EaseMotion CSS</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../easemotion.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="ease-wizard-body">
  <div class="ease-wizard-container">
    <!-- Progress Indicator Header -->
    <header class="ease-wizard-header">
      <div class="ease-wizard-progress-bar">
        <div class="ease-wizard-progress-fill" id="progressFill"></div>
      </div>
      <div class="ease-wizard-steps-indicator">
        <div class="ease-step-pill active" data-step="1">
          <span class="step-num">1</span>
          <span class="step-label">Account</span>
        </div>
        <div class="ease-step-pill" data-step="2">
          <span class="step-num">2</span>
          <span class="step-label">Profile</span>
        </div>
        <div class="ease-step-pill" data-step="3">
          <span class="step-num">3</span>
          <span class="step-label">Confirm</span>
        </div>
      </div>
    </header>

    <!-- Multi-Step Form Panels -->
    <form class="ease-wizard-form" id="wizardForm" onsubmit="return false;">
      <!-- Step 1: Account -->
      <div class="ease-wizard-panel active" data-panel="1">
        <h2>Account Setup</h2>
        <p>Enter your primary account credentials</p>
        <div class="ease-input-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="name@domain.com" required />
        </div>
        <div class="ease-input-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="••••••••" required />
        </div>
      </div>

      <!-- Step 2: Profile -->
      <div class="ease-wizard-panel" data-panel="2">
        <h2>Profile Details</h2>
        <p>Tell us a little bit about yourself</p>
        <div class="ease-input-group">
          <label for="fullname">Full Name</label>
          <input type="text" id="fullname" placeholder="Alex Morgan" />
        </div>
        <div class="ease-input-group">
          <label for="role">Primary Role</label>
          <select id="role">
            <option value="developer">Developer</option>
            <option value="designer">Designer</option>
            <option value="creator">Creator</option>
          </select>
        </div>
      </div>

      <!-- Step 3: Confirm -->
      <div class="ease-wizard-panel" data-panel="3">
        <h2>Ready to Launch! 🚀</h2>
        <p>Review your information and complete setup</p>
        <div class="ease-summary-card">
          <div class="summary-item"><span>Status:</span> <strong>Verified</strong></div>
          <div class="summary-item"><span>Plan:</span> <strong>Developer Pro</strong></div>
        </div>
      </div>

      <!-- Wizard Navigation Controls -->
      <footer class="ease-wizard-footer">
        <button type="button" class="ease-btn-secondary" id="prevBtn" disabled>Back</button>
        <button type="button" class="ease-btn-primary" id="nextBtn">Continue →</button>
      </footer>
    </form>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      let currentStep = 1;
      const totalSteps = 3;

      const panels = document.querySelectorAll('.ease-wizard-panel');
      const stepPills = document.querySelectorAll('.ease-step-pill');
      const progressFill = document.getElementById('progressFill');
      const prevBtn = document.getElementById('prevBtn');
      const nextBtn = document.getElementById('nextBtn');
      const wizardForm = document.getElementById('wizardForm');

      function updateWizard(direction) {
        // Update Progress Bar
        const progress = ((currentStep - 1) / (totalSteps - 1)) * 100;
        progressFill.style.width = `${progress}%`;

        // Update Steps Indicator
        stepPills.forEach(pill => {
          const step = parseInt(pill.getAttribute('data-step'));
          pill.classList.toggle('active', step <= currentStep);
        });

        // Panel Slide Animations
        panels.forEach(panel => {
          const panelStep = parseInt(panel.getAttribute('data-panel'));
          panel.classList.remove('active', 'slide-left', 'slide-right');

          if (panelStep === currentStep) {
            panel.classList.add('active');
            panel.classList.add(direction === 'next' ? 'slide-left' : 'slide-right');
          }
        });

        // Update Buttons
        prevBtn.disabled = currentStep === 1;
        nextBtn.textContent = currentStep === totalSteps ? 'Complete Setup ✓' : 'Continue →';
      }

      nextBtn.addEventListener('click', () => {
        if (currentStep < totalSteps) {
          currentStep++;
          updateWizard('next');
        } else {
          alert('Wizard Completed Successfully!');
        }
      });

      prevBtn.addEventListener('click', () => {
        if (currentStep > 1) {
          currentStep--;
          updateWizard('prev');
        }
      });

      updateWizard('next');
    });
  </script>
</body>
</html>
