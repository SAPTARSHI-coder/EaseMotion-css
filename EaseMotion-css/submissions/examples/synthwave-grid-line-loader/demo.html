<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Pure CSS Synthwave Grid Line Loader">
  <title>Synthwave Grid Line Loader</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="demo">
    <section
      class="loader-container"
      aria-label="Loading content"
      role="status"
      aria-live="polite"
    >
      <div class="synthwave-loader" aria-hidden="true">
        <span class="grid-line line-1"></span>
        <span class="grid-line line-2"></span>
        <span class="grid-line line-3"></span>
        <span class="grid-line line-4"></span>
        <span class="grid-line line-5"></span>
        <span class="grid-line line-6"></span>

        <span class="horizon"></span>
        <span class="sun"></span>
      </div>

      <p class="loader-text">Loading...</p>
    </section>
  </main>
</body>
</html>
