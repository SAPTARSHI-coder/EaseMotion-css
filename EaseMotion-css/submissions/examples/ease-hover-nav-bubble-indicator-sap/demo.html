<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ease-hover-nav-bubble-indicator-sap demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { height: 100vh; margin: 0; display: flex; align-items: center; justify-content: center; background: #f4f4f5; }
  </style>
</head>
<body>
  <nav class="bubble-nav-sap" id="nav">
    <div class="bubble-indicator" id="indicator"></div>
    <a href="#" class="bubble-link">Home</a>
    <a href="#" class="bubble-link">Docs</a>
    <a href="#" class="bubble-link">Pricing</a>
    <a href="#" class="bubble-link">Blog</a>
  </nav>
  <script>
    const nav = document.getElementById('nav');
    const indicator = document.getElementById('indicator');
    const links = [...nav.querySelectorAll('.bubble-link')];

    function moveTo(el) {
      indicator.style.width = el.offsetWidth + 'px';
      indicator.style.transform = `translateX(${el.offsetLeft - 4}px)`;
    }

    links.forEach(link => link.addEventListener('mouseenter', () => moveTo(link)));
    nav.addEventListener('mouseleave', () => moveTo(links[0]));
    moveTo(links[0]);
  </script>
</body>
</html>
