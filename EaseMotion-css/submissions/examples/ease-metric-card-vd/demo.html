<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ease Metric Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="metric-grid">

    <article class="metric-card">
        <div class="metric-top">
            <span class="metric-label">Total Revenue</span>
            <span class="trend positive">↑ 12.5%</span>
        </div>

        <strong class="metric-value">$24,680</strong>

        <span class="metric-description">Compared with last month</span>
    </article>

    <article class="metric-card">
        <div class="metric-top">
            <span class="metric-label">Active Users</span>
            <span class="trend positive">↑ 8.2%</span>
        </div>

        <strong class="metric-value">12,450</strong>

        <span class="metric-description">Compared with last week</span>
    </article>

    <article class="metric-card">
        <div class="metric-top">
            <span class="metric-label">Error Rate</span>
            <span class="trend negative">↓ 3.4%</span>
        </div>

        <strong class="metric-value">1.8%</strong>

        <span class="metric-description">Compared with last month</span>
    </article>

</div>

</body>
</html>
