<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-pagination-chevron demo</title>
</head>
<body>
<div class="pcv-card">
  <span class="pcv-title">BROWSER</span>
  <div class="pcv-bar">
    <span class="pcv-btn pcv-prev"></span>
    <span class="pcv-num">1</span>
    <span class="pcv-num pcv-active">2</span>
    <span class="pcv-num">3</span>
    <span class="pcv-gap">...</span>
    <span class="pcv-num">12</span>
    <span class="pcv-btn pcv-next"></span>
  </div>
  <span class="pcv-caption">PAGE 2 OF 12</span>
</div>
</body>
</html>
