<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Token Machine Issue — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Token Machine Issue demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Token Machine Issue</h1>
      <p class="lede">Single-line token machine issuing the staff</p>
    </header>

    <section class="ease-token-machine-issue" data-demo="token-machine-issue" aria-live="polite">
      <div class="ease-token-machine-issue__housing">
        <div class="ease-token-machine-issue__bezel">
          <div class="ease-token-machine-issue__face">
            <div class="ease-token-machine-issue__readout">
              <span class="ease-token-machine-issue__label">Token Machine Issue</span>
              <span class="ease-token-machine-issue__value">LIVE</span>
            </div>
            <div class="ease-token-machine-issue__motion" aria-hidden="true">
              <span class="ease-token-machine-issue__a"></span>
              <span class="ease-token-machine-issue__b"></span>
              <span class="ease-token-machine-issue__c"></span>
              <span class="ease-token-machine-issue__d"></span>
            </div>
            <div class="ease-token-machine-issue__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-token-machine-issue__controls">
          <button type="button" class="ease-token-machine-issue__btn primary">Issue</button>
          <button type="button" class="ease-token-machine-issue__btn">Lock</button>
          <label class="ease-token-machine-issue__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-token-machine-issue__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
