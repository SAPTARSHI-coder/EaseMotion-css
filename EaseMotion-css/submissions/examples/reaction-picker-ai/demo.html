<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Post Reaction Picker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="post">
            <p>This is a sample post. Hover over the like button to see the reactions!</p>
            <div class="reaction-wrapper">
                <button class="like-button" aria-label="Like Post">
                    👍 Like
                </button>
                <div class="reaction-picker" role="toolbar" aria-label="Reaction picker">
                    <button class="reaction-btn" aria-label="Like">👍</button>
                    <button class="reaction-btn" aria-label="Love">❤️</button>
                    <button class="reaction-btn" aria-label="Haha">😆</button>
                    <button class="reaction-btn" aria-label="Wow">😮</button>
                    <button class="reaction-btn" aria-label="Sad">😢</button>
                    <button class="reaction-btn" aria-label="Angry">😡</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
