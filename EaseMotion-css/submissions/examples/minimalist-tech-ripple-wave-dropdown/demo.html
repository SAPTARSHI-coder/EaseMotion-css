<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Ripple-Wave Dropdown - Minimalist Tech</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="layout-container">
        
        <header class="section-header">
            <h1 class="title">User Settings Menu</h1>
            <p class="subtitle">A minimalist tech dropdown featuring a fluid ripple-wave entrance and staggered list items.</p>
        </header>

        <div class="dashboard-area">
            
            <div class="card">
                
                <!-- 
                   Pure CSS State Management for Dropdown 
                   We use a checkbox to toggle the state of the dropdown menu.
                -->
                <div class="dropdown-wrapper">
                    <input type="checkbox" id="dropdown-toggle" class="dropdown-input">
                    
                    <label for="dropdown-toggle" class="btn btn-trigger">
                        <!-- User Avatar Stand-in -->
                        <div class="avatar">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                <circle cx="12" cy="7" r="4"></circle>
                            </svg>
                        </div>
                        <span>admin@domain.com</span>
                        <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="6 9 12 15 18 9"></polyline>
                        </svg>
                    </label>

                    <!-- The Dropdown Menu -->
                    <div class="dropdown-menu ripple-wave">
                        <!-- The decorative circular ripple element that expands to form the background -->
                        <div class="ripple-background"></div>
                        
                        <div class="menu-content">
                            
                            <a href="#" class="menu-item list-delay-1">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                                <span>My Profile</span>
                            </a>
                            
                            <a href="#" class="menu-item list-delay-2">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
                                <span>Security Settings</span>
                            </a>
                            
                            <a href="#" class="menu-item list-delay-3">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"></path></svg>
                                <span>Billing & Usage</span>
                            </a>

                            <div class="menu-divider list-delay-4"></div>

                            <a href="#" class="menu-item color-red list-delay-4">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                                <span>Sign Out</span>
                            </a>

                        </div>
                    </div> <!-- End Dropdown Menu -->
                </div> <!-- End Dropdown Wrapper -->
                
            </div>
            
        </div>
    </div>

</body>
</html>
