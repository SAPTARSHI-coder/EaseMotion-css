<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fortune Wheel Spin &mdash; EaseMotion CSS Demo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="fws-wrap">
  <div class="fws-wheel">
    <div class="fws-wedge" style="--i:0">1</div>
    <div class="fws-wedge" style="--i:1">2</div>
    <div class="fws-wedge" style="--i:2">3</div>
    <div class="fws-wedge" style="--i:3">4</div>
    <div class="fws-wedge" style="--i:4">5</div>
    <div class="fws-wedge" style="--i:5">6</div>
  </div>
  <div class="fws-pointer"></div>
</div>
</body>
</html>
