<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orbital Command Center</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="orbital-app" data-scene="nebula">

    <section class="orbital-display" id="orbitalDisplay">

      <div class="stars" id="stars"></div>

      <div class="scene-glow"></div>

      <div class="orbit orbit-one"></div>
      <div class="orbit orbit-two"></div>
      <div class="orbit orbit-three"></div>

      <div class="planet" id="planet">
        <div class="planet-core"></div>
        <div class="planet-glow"></div>
      </div>

      <div class="satellite satellite-1" data-satellite="1">
        <span></span>
      </div>

      <div class="satellite satellite-2" data-satellite="2">
        <span></span>
      </div>

      <div class="satellite satellite-3" data-satellite="3">
        <span></span>
      </div>

      <div class="satellite satellite-4" data-satellite="4">
        <span></span>
      </div>

      <div class="satellite satellite-5" data-satellite="5">
        <span></span>
      </div>

      <div class="satellite satellite-6" data-satellite="6">
        <span></span>
      </div>

      <div class="energy-pulse" id="energyPulse"></div>

      <div class="orbital-info">
        <span class="info-label">ORBITAL COMMAND</span>
        <span class="info-status" id="status">SYSTEM ONLINE</span>
      </div>

      <div class="satellite-counter">
        ACTIVE SATELLITES
        <strong id="satelliteCount">6</strong>
      </div>

    </section>

    <section class="controls">

      <div class="control-group">
        <label for="speed">
          Orbital Speed
          <span id="speedValue">50%</span>
        </label>

        <input
          id="speed"
          class="speed-slider"
          type="range"
          min="0"
          max="100"
          value="50"
        >
      </div>

      <div class="control-group">
        <span class="control-title">Scene</span>

        <div class="scene-buttons">
          <button class="scene-btn active" data-scene="nebula">
            ✦
            <small>Nebula</small>
          </button>

          <button class="scene-btn" data-scene="deep">
            ◉
            <small>Deep</small>
          </button>

          <button class="scene-btn" data-scene="solar">
            ☀
            <small>Solar</small>
          </button>
        </div>
      </div>

      <div class="action-row">
        <button class="action-btn" id="pulseBtn">
          ⚡ Energy Pulse
        </button>

        <button class="action-btn" id="pauseBtn">
          ❚❚ Pause
        </button>
      </div>

    </section>

    <p class="keyboard-hint">
      Space · Pulse &nbsp; | &nbsp; 1 2 3 · Scenes &nbsp; | &nbsp; P · Pause
    </p>

  </main>

  <script>
    const app = document.querySelector(".orbital-app");
    const satellites = document.querySelectorAll(".satellite");
    const speedSlider = document.getElementById("speed");
    const speedValue = document.getElementById("speedValue");
    const satelliteCount = document.getElementById("satelliteCount");
    const status = document.getElementById("status");
    const pulse = document.getElementById("energyPulse");
    const pauseBtn = document.getElementById("pauseBtn");
    const pulseBtn = document.getElementById("pulseBtn");

    let paused = false;
    let activeSatellites = 6;

    const stars = document.getElementById("stars");

    for (let i = 0; i < 24; i++) {
      const star = document.createElement("i");

      star.style.setProperty("--x", `${Math.random() * 100}%`);
      star.style.setProperty("--y", `${Math.random() * 100}%`);
      star.style.setProperty("--delay", `${Math.random() * 3}s`);
      star.style.setProperty("--size", `${1 + Math.random() * 2}px`);

      stars.appendChild(star);
    }

    function updateSpeed() {
      const value = Number(speedSlider.value);

      speedValue.textContent = `${value}%`;

      const duration = 28 - (value * 0.25);

      document.documentElement.style.setProperty(
        "--orbit-duration",
        `${duration}s`
      );
    }

    function updateCounter() {
      satelliteCount.textContent = activeSatellites;
    }

    function activateSatellite(satellite) {
      satellite.classList.toggle("inactive");

      activeSatellites = document.querySelectorAll(
        ".satellite:not(.inactive)"
      ).length;

      updateCounter();

      status.textContent =
        satellite.classList.contains("inactive")
          ? "SATELLITE OFFLINE"
          : "SATELLITE ONLINE";
    }

    function triggerPulse() {
      pulse.classList.remove("pulse-active");

      void pulse.offsetWidth;

      pulse.classList.add("pulse-active");

      status.textContent = "ENERGY PULSE ACTIVE";

      setTimeout(() => {
        status.textContent = "SYSTEM ONLINE";
      }, 900);
    }

    function setScene(scene) {
      app.dataset.scene = scene;

      document.querySelectorAll(".scene-btn").forEach(button => {
        button.classList.toggle(
          "active",
          button.dataset.scene === scene
        );
      });

      status.textContent =
        `${scene.toUpperCase()} SCENE ACTIVE`;
    }

    function togglePause() {
      paused = !paused;

      app.classList.toggle("paused", paused);

      pauseBtn.textContent = paused
        ? "▶ Resume"
        : "❚❚ Pause";

      status.textContent = paused
        ? "SYSTEM PAUSED"
        : "SYSTEM ONLINE";
    }

    speedSlider.addEventListener("input", updateSpeed);

    satellites.forEach(satellite => {
      satellite.addEventListener("click", () => {
        activateSatellite(satellite);
      });
    });

    document.querySelectorAll(".scene-btn").forEach(button => {
      button.addEventListener("click", () => {
        setScene(button.dataset.scene);
      });
    });

    pulseBtn.addEventListener("click", triggerPulse);
    pauseBtn.addEventListener("click", togglePause);

    document.addEventListener("keydown", event => {
      if (event.code === "Space") {
        event.preventDefault();
        triggerPulse();
      }

      if (event.key === "p" || event.key === "P") {
        togglePause();
      }

      if (event.key === "1") setScene("nebula");
      if (event.key === "2") setScene("deep");
      if (event.key === "3") setScene("solar");
    });

    updateSpeed();
    updateCounter();
  </script>
</body>
</html>
