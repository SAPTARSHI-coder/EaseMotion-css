<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teleportation Protocol Analyzers QTPA - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css"></head><body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030712; color: #ffffff;">

    <div class="ease-card ease-card-glass qtpa-container">
        <div class="qtpa-header">
            <h2>Teleportation Protocol Analyzer</h2>
            <span class="ease-badge ease-badge-warning">Fault-Tolerant Quantum</span>
        </div>
        
        <div class="qtpa-screen ease-center">
            <div class="qtpa-flux flux-qtpa-a"></div>
            <div class="qtpa-flux flux-qtpa-b"></div>
            <div class="qtpa-boundary-ring"></div>
            <div class="qtpa-core ease-center"></div>
        </div>

        <div class="qtpa-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Protocol Conformance &amp; Handshake Verification</span>
            <button class="ease-btn ease-btn-warning ease-btn-sm ease-hover-grow">Run Protocol Analyzer</button>
        </div>
    </div></body></html>
