<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-weather-barometer-dial</title>
</head>
<body>
<main class="wbd-card">
  <header class="wbd-head">
    <h1 class="wbd-title">Barometer</h1>
    <span class="wbd-live">LIVE</span>
  </header>
  <section class="wbd-dial" aria-label="pressure dial">
    <span class="wbd-mark wbd-m-28">28</span>
    <span class="wbd-mark wbd-m-29">29</span>
    <span class="wbd-mark wbd-m-30">30</span>
    <span class="wbd-mark wbd-m-31">31</span>
    <div class="wbd-hub"></div>
    <div class="wbd-needle"></div>
  </section>
  <div class="wbd-readout">
    <span class="wbd-value">1013</span>
    <span class="wbd-unit">hPa</span>
  </div>
  <p class="wbd-status">Steady</p>
  <footer class="wbd-foot">
    <span class="wbd-trend wbd-trend-down">Falling</span>
    <span class="wbd-hint">Rain in 6 hours</span>
  </footer>
</main>
</body>
</html>
