<!-- EaseMotion component: vending-machine-interface -->
<!DOCTYPE html>
<html lang="en" data-machine="snacks">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3">
<title>Ease Vending Machine Interface</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="vendo-shell">
  <header class="vendo-head">
    <span class="led ready-led"></span>
    <span class="vendo-brand">SNACKMATIC</span>
  </header>
  <div class="vendo-main">
    <div id="shelfGrid" class="shelf-grid">
      <div class="product" data-code="1"><span class="prod-name">Chips</span><span class="prod-slot">01</span></div>
      <div class="product" data-code="2"><span class="prod-name">Bar</span><span class="prod-slot">02</span></div>
      <div class="product" data-code="3"><span class="prod-name">Nuts</span><span class="prod-slot">03</span></div>
      <div class="product" data-code="4"><span class="prod-name">Cookies</span><span class="prod-slot">04</span></div>
      <div class="product" data-code="5"><span class="prod-name">Gum</span><span class="prod-slot">05</span></div>
      <div class="product" data-code="6"><span class="prod-name">Pretzel</span><span class="prod-slot">06</span></div>
    </div>
    <div class="control-panel">
      <div class="keypad">
        <button class="key" type="button" data-key="1">1</button>
        <button class="key" type="button" data-key="2">2</button>
        <button class="key" type="button" data-key="3">3</button>
        <button class="key" type="button" data-key="4">4</button>
        <button class="key" type="button" data-key="5">5</button>
        <button class="key" type="button" data-key="6">6</button>
      </div>
      <div class="coin-slot">
        <span class="slot-gap"></span>
        <span class="coin-guide">insert coins</span>
      </div>
    </div>
  </div>
  <footer class="vendo-msg">
    <span id="vendoLine" class="msg-line">PLEASE SELECT ITEM</span>
  </footer>
</div>
<script>
const grid=document.getElementById('shelfGrid');
const line=document.getElementById('vendoLine');
document.querySelectorAll('.key').forEach(k=>{
  k.addEventListener('click',()=>{
    k.classList.remove('press');
    void k.offsetWidth;
    k.classList.add('press');
    const target=grid.querySelector('[data-code="'+k.dataset.key+'"]');
    if(target){
      grid.querySelectorAll('.dropping').forEach(d=>d.classList.remove('dropping'));
      target.classList.add('dropping');
      line.textContent='VENDED '+k.dataset.key;
    }else{
      line.textContent='NOT AVAILABLE';
    }
  });
});
</script>
</body>
</html>
