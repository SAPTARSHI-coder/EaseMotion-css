<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elastic Rubber-Band Floating Action Menu | EaseMotion CSS Showcase</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <main class="fab-wrapper">
    <header class="header">
      <span class="badge">GSSoC 2026 Innovation</span>
      <h1 class="title">Elastic Rubber-Band Action Menu</h1>
      <p class="subtitle">Floating Action Button (FAB) speed dial with elastic rubber-band spring expansion physics, staggered radial item reveals, and backdrop glass blur.</p>
    </header>

    <div class="demo-card">
      <div class="fab-container">
        <input type="checkbox" id="fab-toggle" class="fab-checkbox">
        <label for="fab-toggle" class="fab-button" aria-label="Toggle Quick Actions">
          <svg class="icon icon-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </label>

        <div class="fab-menu">
          <button class="menu-item item-1" aria-label="Share Content">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="18" cy="5" r="3"></circle>
              <circle cx="6" cy="12" r="3"></circle>
              <circle cx="18" cy="19" r="3"></circle>
              <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
              <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
            </svg>
            <span class="item-tooltip">Share</span>
          </button>

          <button class="menu-item item-2" aria-label="Edit Document">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
              <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
            </svg>
            <span class="item-tooltip">Edit</span>
          </button>

          <button class="menu-item item-3" aria-label="Cloud Sync">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"></path>
            </svg>
            <span class="item-tooltip">Sync</span>
          </button>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
