<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Micro Menu Hamburger &mdash; EaseMotion CSS Demo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="page-head">
    <p class="kicker">EaseMotion CSS &middot; Micro-interactions</p>
    <h1>Micro Menu Hamburger</h1>
    <p class="sub">Three lines that fold into an X the moment you reach for them.</p>

  <main class="stage">
    <div class="mmh-btn">
      <span class="mmh-line"></span>
      <span class="mmh-line"></span>
      <span class="mmh-line"></span>
    </div>
  </main>
  <p class="stage-caption">Hover the button to morph the lines.</p>
  <footer class="page-foot">
    <span>Pure CSS &middot; zero dependencies</span>
    <span>Morphing lines</span>
  </footer>
