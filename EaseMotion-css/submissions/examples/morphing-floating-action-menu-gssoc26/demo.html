<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Morphing Floating Action Menu - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="fab-container">
    <div class="fab-menu">
      <div class="fab-action action-1" data-label="New Message">💬</div>
      <div class="fab-action action-2" data-label="Upload File">📁</div>
      <div class="fab-action action-3" data-label="Share Link">🔗</div>
      
      <button class="main-fab" aria-label="Toggle Speed Dial Menu">
        <span class="fab-icon">+</span>
      </button>
    </div>
  </div>
</body>
</html>
