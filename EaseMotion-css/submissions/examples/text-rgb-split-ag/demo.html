<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Text RGB Split Component</title>
  <link rel="stylesheet" href="./style.css">
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background-color: #0d0d0d;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      color: #fff;
    }
    
    .demo-container {
      text-align: center;
    }
    
    .instruction {
      margin-top: 2rem;
      font-size: 0.9rem;
      color: #888;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div class="demo-container">
    <h1 class="text-rgb-split" data-text="HOVER ME">
      HOVER ME
    </h1>
    <p class="instruction">Hover over the text to see the RGB split effect</p>
  </div>
</body>
</html>
