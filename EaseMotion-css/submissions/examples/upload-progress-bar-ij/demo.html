<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-upload-progress-bar demo</title>
</head>
<body>
<div class="upb-panel">
  <div class="upb-file">
    <b class="upb-name">project-bundle.zip</b>
    <span class="upb-size">842 MB</span>
  </div>
  <div class="upb-track"><em class="upb-fill"></em></div>
  <div class="upb-meta">
    <span class="upb-pct">64%</span>
    <span class="upb-speed">12.4 MB/s</span>
  </div>
  <div class="upb-actions">
    <button class="upb-pause">PAUSE</button>
    <button class="upb-cancel">CANCEL</button>
  </div>
</div>
</body>
</html>
