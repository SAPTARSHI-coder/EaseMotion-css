<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ease Interactive Image Comparison Slider</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="ease-compare-body">
  <div class="ease-compare-container" id="compareContainer">
    <div class="ease-compare-img img-before"><span>BEFORE</span></div>
    <div class="ease-compare-img img-after" id="afterImg"><span>AFTER</span></div>
    <div class="ease-compare-handle" id="handle">↔</div>
  </div>

  <script>
    const container = document.getElementById('compareContainer');
    const afterImg = document.getElementById('afterImg');
    const handle = document.getElementById('handle');
    let isDragging = false;

    container.addEventListener('mousedown', () => isDragging = true);
    window.addEventListener('mouseup', () => isDragging = false);

    container.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      const rect = container.getBoundingClientRect();
      let x = e.clientX - rect.left;
      x = Math.max(0, Math.min(x, rect.width));
      const percent = (x / rect.width) * 100;
      afterImg.style.clipPath = `polygon(0 0, ${percent}% 0, ${percent}% 100%, 0 100%)`;
      handle.style.left = `${percent}%`;
    });
  </script>
</body>
</html>
