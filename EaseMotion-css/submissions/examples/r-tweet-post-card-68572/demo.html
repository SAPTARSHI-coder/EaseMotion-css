<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Responsive CSS tweet post card.">
  <title>CSS Tweet Post Card</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <article class="post" aria-labelledby="post-author">

    <header class="post-header">
      <div class="avatar" aria-hidden="true">RC</div>

      <div>
        <h1 id="post-author">Riya Chauhan</h1>
        <span>@riyachauhan · 2h</span>
      </div>

      <button type="button" aria-label="More post options">•••</button>
    </header>

    <p class="post-text">
      Building delightful interfaces is about the little details.
      Motion should guide users, not distract them.
    </p>

    <footer class="actions">
      <button type="button" aria-label="Reply">♡ <span>12</span></button>
      <button type="button" aria-label="Repost">↻ <span>24</span></button>
      <button type="button" aria-label="Like">♥ <span>86</span></button>
      <button type="button" aria-label="Share">↗</button>
    </footer>

  </article>

</body>
</html>
