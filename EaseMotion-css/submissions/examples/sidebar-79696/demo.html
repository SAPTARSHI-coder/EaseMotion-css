<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Glowing Dark Sidebar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="layout">
    <aside>
      <p class="eyebrow">EaseMotion · #79696</p>
      <h1>Console</h1>
      <nav aria-label="Workspace navigation">
        <a class="active" href="#home">Home</a>
        <a href="#logs">Logs</a>
        <a href="#alerts">Alerts</a>
        <a href="#settings">Settings</a>
      </nav>
    </aside>
    <section id="home">
      <h2>Dark workspace</h2>
      <p>A focused sidebar using restrained glow accents and high-contrast navigation.</p>
      <div class="panel"><strong>System online</strong><span>Last check: 2 minutes ago</span></div>
      <div class="panel" id="logs"><strong>Recent activity</strong><span>12 events processed successfully.</span></div>
    </section>
  </main>
</body>
</html>
