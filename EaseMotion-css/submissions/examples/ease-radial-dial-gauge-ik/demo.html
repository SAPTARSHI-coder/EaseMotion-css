<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EaseMotion CSS — Radial Speedometer Gauge Showcase</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="dg-demo-wrapper">
    <header class="dg-header">
      <span class="badge">UI Component Showcase</span>
      <h1>Radial Speedometer Dial Gauge</h1>
      <p>Performance dial gauge component featuring spring needle rotation transitions, SVG meter arc zones, and score badges.</p>
    </header>

    <main class="dg-card">
      <div class="ease-dial-gauge">
        <svg class="gauge-svg" viewBox="0 0 200 120">
          <!-- Background Track Arc -->
          <path class="gauge-track" d="M 20 100 A 80 80 0 0 1 180 100" />
          <!-- Active Color Arc -->
          <path class="gauge-fill" d="M 20 100 A 80 80 0 0 1 180 100" />
        </svg>

        <!-- Animated Dial Needle -->
        <div class="gauge-needle-wrapper needle-high">
          <div class="gauge-needle"></div>
          <div class="needle-cap"></div>
        </div>

        <div class="gauge-score">
          <span class="score-num">98</span>
          <span class="score-label">Performance Score</span>
        </div>
      </div>
    </main>

    <footer class="dg-footer">
      <p>EaseMotion CSS Component &bull; Submitted by @Ishita-Katiyar-06</p>
    </footer>
  </div>
</body>
</html>
