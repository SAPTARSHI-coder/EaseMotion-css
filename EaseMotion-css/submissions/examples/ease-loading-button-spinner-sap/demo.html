<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ease-loading-button-spinner-sap Demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="demo-wrap">
    <button class="btn-spinner-sap">
      <span class="btn-spinner-sap__spinner"></span>
      <span class="btn-spinner-sap__label">Submit</span>
    </button>
  </div>

  <script>
    const btn = document.querySelector('.btn-spinner-sap');
    btn.addEventListener('click', () => {
      if (btn.classList.contains('is-loading')) return;
      btn.classList.add('is-loading');
      btn.disabled = true;
      setTimeout(() => {
        btn.classList.remove('is-loading');
        btn.disabled = false;
      }, 2200);
    });
  </script>
</body>
</html>
