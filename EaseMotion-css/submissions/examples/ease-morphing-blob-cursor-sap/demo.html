<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ease-morphing-blob-cursor-sap demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { height: 100vh; margin: 0; display: flex; align-items: center; justify-content: center; background: #f4f4f5; }
  </style>
</head>
<body>
  <div class="blob-cursor-sap" id="area">
    <div class="blob-content" id="hoverText">Move your cursor here</div>
    <div class="blob-follower" id="follower"></div>
  </div>
  <script>
    const area = document.getElementById('area');
    const follower = document.getElementById('follower');
    const text = document.getElementById('hoverText');

    area.addEventListener('mousemove', (e) => {
      const rect = area.getBoundingClientRect();
      follower.style.transform = `translate(${e.clientX - rect.left}px, ${e.clientY - rect.top}px) translate(-50%, -50%)`;
    });

    text.addEventListener('mouseenter', () => follower.classList.add('hover-target'));
    text.addEventListener('mouseleave', () => follower.classList.remove('hover-target'));
  </script>
</body>
</html>
