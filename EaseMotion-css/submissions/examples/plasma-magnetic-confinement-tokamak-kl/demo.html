<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plasma Magnetic Confinement Tokamak - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #05020a; color: #ffffff;">

    <div class="ease-card ease-card-glass tokamak-container">
        <div class="tokamak-header">
            <h2>Plasma Tokamak</h2>
            <span class="ease-badge ease-badge-danger">Superheated</span>
        </div>
        
        <div class="tokamak-screen ease-center">
            <div class="magnetic-coil coil-1"></div>
            <div class="magnetic-coil coil-2"></div>
            <div class="confinement-torus-ring"></div>
            <div class="plasma-core ease-center"></div>
        </div>

        <div class="tokamak-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Temp: 150M°C</span>
            <button class="ease-btn ease-btn-primary ease-btn-sm ease-hover-grow">Inject Flux</button>
        </div>
    </div>

</body>
</html>
