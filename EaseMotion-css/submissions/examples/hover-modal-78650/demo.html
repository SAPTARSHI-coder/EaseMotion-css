<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Hover modal showcase for EaseMotion CSS issue #78650."
    />
    <title>Hover Modal | EaseMotion CSS</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="page">
      <section class="showcase" aria-labelledby="page-title">
        <p class="eyebrow">EaseMotion CSS · Issue #78650</p>

        <h1 id="page-title">Project preview</h1>

        <p class="intro">
          A dark preview panel that reveals through a CSS-enhanced hover and
          keyboard-focus interaction.
        </p>

        <div class="preview-stage">
          <button
            class="trigger"
            type="button"
            aria-describedby="preview-description"
          >
            Hover for preview
          </button>

          <section
            class="modal"
            id="preview"
            aria-labelledby="preview-title"
            aria-describedby="preview-description"
          >
            <span class="modal-label">Preview</span>
            <h2 id="preview-title">Orbit workspace</h2>
            <p id="preview-description">
              A contextual panel for showing a short project summary before the
              user opens the full details.
            </p>

            <div class="actions">
              <a href="#details">View details</a>
              <button type="button">Close</button>
            </div>
          </section>
        </div>
      </section>
    </main>
  </body>
</html>
