<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Velvet Smooth Transition CSS Tooltip"
  >
  <title>Velvet Smooth Transition Tooltip</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <header class="hero">
      <p class="eyebrow">EaseMotion CSS</p>
      <h1>Velvet Smooth Transition Tooltip</h1>
      <p>
        A soft, elegant tooltip component built entirely with HTML and
        Vanilla CSS.
      </p>
    </header>

    <section class="tooltip-grid" aria-label="Tooltip examples">
      <div class="tooltip-wrapper">
        <button
          class="tooltip-trigger"
          type="button"
          aria-describedby="tooltip-top"
        >
          Hover Me
          <span
            class="tooltip tooltip-top"
            id="tooltip-top"
            role="tooltip"
          >
            Smooth velvet transition
          </span>
        </button>
      </div>

      <div class="tooltip-wrapper">
        <button
          class="tooltip-trigger"
          type="button"
          aria-describedby="tooltip-bottom"
        >
          Bottom
          <span
            class="tooltip tooltip-bottom"
            id="tooltip-bottom"
            role="tooltip"
          >
            Soft and responsive
          </span>
        </button>
      </div>

      <div class="tooltip-wrapper">
        <button
          class="tooltip-trigger"
          type="button"
          aria-describedby="tooltip-left"
        >
          Left
          <span
            class="tooltip tooltip-left"
            id="tooltip-left"
            role="tooltip"
          >
            Pure CSS interaction
          </span>
        </button>
      </div>

      <div class="tooltip-wrapper">
        <button
          class="tooltip-trigger"
          type="button"
          aria-describedby="tooltip-right"
        >
          Right
          <span
            class="tooltip tooltip-right"
            id="tooltip-right"
            role="tooltip"
          >
            Hardware accelerated
          </span>
        </button>
      </div>
    </section>

    <section class="info-card">
      <h2>Accessible by default</h2>
      <p>
        Focus the buttons with the keyboard to preview the same smooth
        transition without using a mouse.
      </p>
    </section>
  </main>
</body>
</html>
