<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaming Hub - Fade-In Carousel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <header class="hero">

        <h1>Gaming Hub</h1>

        <p>
            Explore featured games, tournaments, and exclusive rewards
            with a smooth fade-in carousel built using pure HTML and CSS.
        </p>

    </header>

    <section class="carousel">

        <div class="slide slide1">
            <div class="content">
                <h2>Battle Arena</h2>
                <p>Fight against elite players worldwide.</p>
                <button>Play Now</button>
            </div>
        </div>

        <div class="slide slide2">
            <div class="content">
                <h2>Weekly Tournament</h2>
                <p>Compete for legendary rewards.</p>
                <button>Join Event</button>
            </div>
        </div>

        <div class="slide slide3">
            <div class="content">
                <h2>Premium Rewards</h2>
                <p>Unlock skins, coins and exclusive items.</p>
                <button>Claim Rewards</button>
            </div>
        </div>

    </section>

</div>

</body>
</html>
