<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Snowman</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="scene" aria-label="CSS snowman illustration">
    <div class="snowman" role="img" aria-label="A cheerful snowman wearing a hat and scarf">
      <div class="hat">
        <div class="hat-top"></div>
        <div class="hat-brim"></div>
      </div>

      <div class="head">
        <span class="eye eye-left"></span>
        <span class="eye eye-right"></span>

        <span class="nose"></span>

        <div class="smile" aria-hidden="true">
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>

      <div class="scarf">
        <div class="scarf-wrap"></div>
        <div class="scarf-tail"></div>
      </div>

      <div class="body">
        <span class="button button-one"></span>
        <span class="button button-two"></span>
        <span class="button button-three"></span>
      </div>

      <div class="arm arm-left"></div>
      <div class="arm arm-right"></div>
    </div>

    <div class="ground"></div>
  </main>
</body>
</html>
