<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Live Captions — Demo</title>
<link rel="stylesheet" href="../../../easemotion.css" />
<link rel="stylesheet" href="style.css" />
</head>
<body style="font-family: Inter, system-ui, sans-serif; max-width: 680px; margin: 40px auto; padding: 0 16px;">

<h1>Live Captions Overlay</h1>
<p>
  A reusable pattern for showing a text caption over a video/canvas surface while
  audio is generated or played back, with an opt-in toggle and a short history log.
</p>

<div class="lc-controls">
  <label>
    <input type="checkbox" id="lc-toggle" checked />
    Show captions
  </label>
</div>

<div class="lc-stage" id="lc-stage">
  <div class="lc-caption-bar" id="lc-caption-bar"></div>
</div>

<div style="margin-bottom: 12px;">
  <input type="text" id="lc-input" placeholder="Type something and press Speak..." style="width: 70%; padding: 8px;" />
  <button id="lc-speak-btn" class="ease-btn ease-btn-primary" style="padding: 8px 16px;">Speak</button>
</div>

<h3>Caption history</h3>
<div class="lc-history" id="lc-history"></div>

<script>
(function () {
  const toggle = document.getElementById('lc-toggle');
  const bar = document.getElementById('lc-caption-bar');
  const input = document.getElementById('lc-input');
  const speakBtn = document.getElementById('lc-speak-btn');
  const history = document.getElementById('lc-history');

  const MAX_HISTORY = 10;
  let entries = [];
  let hideTimer = null;

  function showCaption(text) {
    if (!toggle.checked) return;
    bar.textContent = text;
    bar.classList.add('lc-visible');
  }

  function hideCaptionAfterDelay(ms) {
    clearTimeout(hideTimer);
    hideTimer = setTimeout(() => {
      bar.classList.remove('lc-visible');
    }, ms);
  }

  function addToHistory(text) {
    const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    entries.unshift({ time, text });
    entries = entries.slice(0, MAX_HISTORY);
    renderHistory();
  }

  function renderHistory() {
    history.innerHTML = entries
      .map(e => `<div class="lc-history-item"><span class="lc-history-time">${e.time}</span><span>${e.text}</span></div>`)
      .join('');
  }

  function simulateSpeak(text) {
    if (!text.trim()) return;

    showCaption(text);
    addToHistory(text);

    const fakeGenerationMs = 400;
    const fakePlaybackMs = 1800;

    setTimeout(() => {
      hideCaptionAfterDelay(fakePlaybackMs + 1000);
    }, fakeGenerationMs);
  }

  speakBtn.addEventListener('click', () => {
    simulateSpeak(input.value);
    input.value = '';
  });

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') speakBtn.click();
  });

  toggle.addEventListener('change', () => {
    if (!toggle.checked) bar.classList.remove('lc-visible');
  });
})();
</script>

</body>
</html>
