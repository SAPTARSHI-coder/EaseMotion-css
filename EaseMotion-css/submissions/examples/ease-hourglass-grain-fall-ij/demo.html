<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hourglass Grain Fall Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="timer">
    <div class="hourglass" id="hourglass" aria-hidden="true">
      <div class="top-sand"></div>
      <div class="stream"></div>
      <div class="bottom-sand"></div>
    </div>
    <p class="hint">Sand pours through the neck of an hourglass and piles below.</p>
  </main>
</body>
</html>
