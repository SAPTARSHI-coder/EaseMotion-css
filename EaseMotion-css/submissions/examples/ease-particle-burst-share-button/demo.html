<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ease Particle Burst Share Button</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="share-menu">

    <button
        class="share-toggle"
        aria-label="Toggle Share Menu">

        +
    </button>

    <div class="share-items">

        <button class="share-btn facebook" aria-label="Share on Facebook">
            📘
        </button>

        <button class="share-btn twitter" aria-label="Share on Twitter">
            🐦
        </button>

        <button class="share-btn linkedin" aria-label="Share on LinkedIn">
            💼
        </button>

        <button
            class="share-btn copy"
            id="copyBtn"
            aria-label="Copy Link">

            🔗
        </button>

    </div>

</div>

<div id="toast" class="toast">
    Link copied!
</div>

<script>

const menu = document.querySelector(".share-menu");
const toggle = document.querySelector(".share-toggle");

toggle.addEventListener("click",()=>{

    menu.classList.toggle("active");

});

const copyBtn=document.getElementById("copyBtn");
const toast=document.getElementById("toast");

copyBtn.addEventListener("click",async()=>{

    try{

        await navigator.clipboard.writeText(window.location.href);

        toast.classList.add("show");

        setTimeout(()=>{

            toast.classList.remove("show");

        },1800);

    }catch(e){

        alert("Clipboard not available");

    }

});

</script>

</body>
</html>
