<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dropzone progress ring — EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <header class="page-head">
      <h1>Dropzone progress ring</h1>
      <p>A drag-and-drop target whose border changes on drag-over and reveals a circular progress ring while uploading.</p>
    </header>
    <section class="demo">
      <div class="filedropzoneprogressv2"><div class="filedropzoneprogressv2-icon">↑</div><div class="filedropzoneprogressv2-text">Drop file to upload</div><div class="filedropzoneprogressv2-ring" style="--p: 0"></div></div>
    </section>
    <footer class="page-foot">
      <small>Submission folder: <code>submissions/examples/file-dropzone-progress-v2/</code></small>
    </footer>
  </main>
</body>
</html>
