<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pattern Lock Dot Grid</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      padding: 24px;
      background: linear-gradient(160deg, #f8fafc, #eef2ff 55%, #f8fafc);
      color: #111827;
      font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      
    }
    h1 { margin: 0; font-size: 1.25rem; text-align: center; }
    .note { margin: 0; max-width: 420px; text-align: center; color: #4b5563; font-size: 0.92rem; line-height: 1.45; }
  </style>
</head>
<body>
  <h1>Pattern Lock Dot Grid</h1>
  
  <div class="pattern-lock" id="lock" role="group" aria-label="Pattern lock demo"></div>
<p class="note">Click dots to draw a pattern. 4+ dots = success.</p>
  <script>

var lock=document.getElementById('lock');
for(var i=0;i<9;i++){var b=document.createElement('button');b.type='button';b.className='dot';b.setAttribute('aria-label','Dot '+(i+1));lock.appendChild(b);}
var selected=[];
lock.addEventListener('click',function(e){var t=e.target;if(!t.classList.contains('dot'))return;if(t.classList.contains('is-active'))return;t.classList.add('is-active');selected.push(t);lock.classList.remove('is-error','is-success');if(selected.length>=4){lock.classList.add('is-success');}else if(selected.length===3){/* keep going */}});
lock.addEventListener('dblclick',function(){selected.forEach(function(d){d.classList.remove('is-active')});selected=[];lock.classList.remove('is-success','is-error');});

</script>
</body>
</html>
