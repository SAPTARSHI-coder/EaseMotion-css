<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-roulette-wheel-spin</title>
</head>
<body>
<main class="rws-card">
  <header class="rws-head">
    <h1 class="rws-title">Roulette</h1>
    <span class="rws-dealer">Dealer Ready</span>
  </header>
  <section class="rws-wheel" aria-label="roulette wheel">
    <span class="rws-pocket rws-p-1">1</span>
    <span class="rws-pocket rws-p-2">2</span>
    <span class="rws-pocket rws-p-3">3</span>
    <span class="rws-pocket rws-p-4">4</span>
    <span class="rws-pocket rws-p-5">5</span>
    <span class="rws-pocket rws-p-6">6</span>
    <span class="rws-pocket rws-p-7">7</span>
    <span class="rws-pocket rws-p-8">8</span>
    <span class="rws-hub">EASE</span>
    <span class="rws-ball"></span>
  </section>
  <div class="rws-result">
    <span class="rws-result-label">Last</span>
    <strong class="rws-result-num">7</strong>
    <span class="rws-result-color">red</span>
  </div>
  <footer class="rws-foot">
    <span class="rws-bet">Bet on red</span>
    <span class="rws-spin">SPIN</span>
  </footer>
</main>
</body>
</html>
