<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temporal Chroniton Flux Matrix - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #05050f; color: #ffffff;">

    <div class="ease-card ease-card-glass temporal-container">
        <div class="temporal-header">
            <h2>Chroniton Flux</h2>
            <span class="ease-badge ease-badge-warning">Phase Shift</span>
        </div>
        
        <div class="temporal-screen ease-center">
            <div class="flux-ring ring-1"></div>
            <div class="flux-ring ring-2"></div>
            <div class="temporal-distortion-field"></div>
            <div class="chroniton-core ease-center"></div>
        </div>

        <div class="temporal-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Variance: 0.04s</span>
            <button class="ease-btn ease-btn-primary ease-btn-sm ease-hover-grow">Sync Timeline</button>
        </div>
    </div>

</body>
</html>
