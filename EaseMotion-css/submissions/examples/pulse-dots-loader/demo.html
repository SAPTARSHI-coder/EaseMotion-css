<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pulse Dots Loader &mdash; EaseMotion CSS Demo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="page-head">
    <p class="kicker">EaseMotion CSS &middot; Loader</p>
    <h1>Pulse Dots Loader</h1>
    <p class="sub">A friendly three-dot loading state that pulses from faint to full in a staggered rhythm.</p>
  </header>
  <main class="stage">
    <div class="pd-loader" aria-label="Loading">
      <span></span>
      <span></span>
      <span></span>
    </div>
  </main>
  <p class="stage-caption">Tip: tune the rhythm with <code>--pd-size</code>, <code>--pd-gap</code> and <code>--pd-dot</code>.</p>
  <footer class="page-foot">
    <span>Pure CSS &middot; zero dependencies</span>
    <span>Open style.css to customize</span>
  </footer>
</body>
</html>
