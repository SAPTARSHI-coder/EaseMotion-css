<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EaseMotion CSS - Tooltip Slide Demo</title>
  <!-- Link to the main EaseMotion CSS (adjust path if needed) -->
  <link rel="stylesheet" href="../../easemotion.min.css" />
  <link rel="stylesheet" href="style.css" />
  <style>
    /* Fallback basic styles if easemotion.min.css is not loaded locally */
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      gap: 2.5rem;
    }
    .demo-btn {
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      font-weight: 600;
      color: #ffffff;
      background-color: #3b82f6;
      border: none;
      border-radius: 0.5rem;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }
    .demo-btn:hover { background-color: #2563eb; }
    .demo-btn.secondary { background-color: #64748b; }
    .demo-btn.secondary:hover { background-color: #475569; }
  </style>
</head>
<body>

  <h1 style="color: #0f172a; margin-bottom: 0.5rem;">Tooltip Slide Animation</h1>
  <p style="color: #64748b; margin-top: 0; margin-bottom: 2rem;">Hover or Tab to see the smooth slide & fade effect.</p>

  <!-- Top Tooltip Example -->
  <div class="tooltip-wrapper">
    <button class="demo-btn" aria-describedby="tooltip-1">
      Hover or Focus Me (Top)
    </button>
    <div id="tooltip-1" class="ease-tooltip-slide" role="tooltip">
      This is a smooth sliding tooltip!
    </div>
  </div>

  <!-- Bottom Tooltip Example -->
  <div class="tooltip-wrapper">
    <button class="demo-btn secondary" aria-describedby="tooltip-2">
      Hover or Focus Me (Bottom)
    </button>
    <div id="tooltip-2" class="ease-tooltip-slide ease-tooltip-bottom" role="tooltip">
      Appears at the bottom with a smooth slide.
    </div>
  </div>

</body>
</html>
