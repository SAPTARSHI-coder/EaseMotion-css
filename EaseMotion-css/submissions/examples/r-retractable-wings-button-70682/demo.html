<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <meta
    name="description"
    content="CSS retractable wings button with decorative wings that extend on hover and focus."
  >
  <title>CSS Retractable Wings Button</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="demo">
    <section class="demo-card" aria-labelledby="title">
      <span class="eyebrow">EASEMOTION CSS</span>

      <h1 id="title">Retractable Wings Button</h1>

      <p class="description">
        Hover or focus the button to extend its decorative wings.
        The interaction is created entirely with CSS.
      </p>

      <div class="button-stage">
        <button class="wing-button" type="button">
          <span class="wing wing-left" aria-hidden="true">
            <span class="wing-tip"></span>
          </span>

          <span class="button-content">
            <span class="button-icon" aria-hidden="true">✦</span>
            <span>Explore</span>
          </span>

          <span class="wing wing-right" aria-hidden="true">
            <span class="wing-tip"></span>
          </span>
        </button>
      </div>

      <p class="hint">
        Hover or use <kbd>Tab</kbd> to focus the button.
      </p>
    </section>
  </main>

</body>
</html>
