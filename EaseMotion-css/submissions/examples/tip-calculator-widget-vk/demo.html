<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Tip Calculator Widget</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="demo">
        <section class="tip-calculator" aria-labelledby="calculator-title">

            <div class="calculator-header">
                <span class="calculator-icon" aria-hidden="true">%</span>

                <div>
                    <h1 id="calculator-title">Tip Calculator</h1>
                    <p>Choose a tip percentage</p>
                </div>
            </div>

            <div class="input-group">
                <label for="bill-amount">Bill Amount</label>

                <div class="amount-input">
                    <span aria-hidden="true">$</span>

                    <input
                        id="bill-amount"
                        type="number"
                        value="100"
                        min="0"
                        step="0.01"
                        inputmode="decimal"
                        aria-label="Bill amount"
                    >
                </div>
            </div>

            <fieldset class="tip-options">
                <legend>Tip Percentage</legend>

                <input
                    type="radio"
                    id="tip-10"
                    name="tip"
                    checked
                >
                <label for="tip-10">10%</label>

                <input
                    type="radio"
                    id="tip-15"
                    name="tip"
                >
                <label for="tip-15">15%</label>

                <input
                    type="radio"
                    id="tip-20"
                    name="tip"
                >
                <label for="tip-20">20%</label>

                <input
                    type="radio"
                    id="tip-25"
                    name="tip"
                >
                <label for="tip-25">25%</label>
            </fieldset>

            <div class="calculation" aria-live="polite">

                <div class="result-row">
                    <span>Tip</span>
                    <strong class="tip-value">$10.00</strong>
                </div>

                <div class="result-row total-row">
                    <span>Total</span>
                    <strong class="total-value">$110.00</strong>
                </div>

            </div>

            <p class="css-note">
                CSS-only demonstration
            </p>

        </section>
    </main>

</body>
</html>
