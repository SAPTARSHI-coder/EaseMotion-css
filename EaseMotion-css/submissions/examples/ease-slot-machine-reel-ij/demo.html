<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-slot-machine-reel demo</title>
</head>
<body>
<div class="sm-app">
  <div class="sm-head">
    <span class="sm-name">LUCKY 7</span>
    <span class="sm-badge">JACKPOT</span>
  </div>
  <div class="sm-cabinet">
    <div class="sm-screen">
      <div class="sm-reel sm-reel-1">
        <span class="sm-tape">
          <span class="sm-symbol sm-s1">CH</span>
          <span class="sm-symbol sm-s2">BAR</span>
          <span class="sm-symbol sm-s3">7</span>
          <span class="sm-symbol sm-s1">CH</span>
          <span class="sm-symbol sm-s2">BAR</span>
          <span class="sm-symbol sm-s3">7</span>
        </span>
      </div>
      <div class="sm-reel sm-reel-2">
        <span class="sm-tape">
          <span class="sm-symbol sm-s1">CH</span>
          <span class="sm-symbol sm-s2">BAR</span>
          <span class="sm-symbol sm-s3">7</span>
          <span class="sm-symbol sm-s1">CH</span>
          <span class="sm-symbol sm-s2">BAR</span>
          <span class="sm-symbol sm-s3">7</span>
        </span>
      </div>
      <div class="sm-reel sm-reel-3">
        <span class="sm-tape">
          <span class="sm-symbol sm-s1">CH</span>
          <span class="sm-symbol sm-s2">BAR</span>
          <span class="sm-symbol sm-s3">7</span>
          <span class="sm-symbol sm-s1">CH</span>
          <span class="sm-symbol sm-s2">BAR</span>
          <span class="sm-symbol sm-s3">7</span>
        </span>
      </div>
      <span class="sm-payline"></span>
    </div>
    <div class="sm-console">
      <button class="sm-lever" type="button"><span class="sm-lever-grip"></span></button>
      <div class="sm-buttons">
        <button class="sm-coin" type="button">COIN</button>
        <button class="sm-spin" type="button">SPIN</button>
      </div>
    </div>
  </div>
  <div class="sm-foot">BET 25 CENT</div>
</div>
</body>
</html>
