<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>CSS Pulsing Live Badge</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="demo">
        <section class="demo-card" aria-labelledby="demo-title">

            <p class="eyebrow">EaseMotion CSS</p>

            <h1 id="demo-title">Pulsing Live Badge</h1>

            <p class="description">
                A lightweight CSS-only LIVE badge with a continuously
                pulsing status indicator.
            </p>

            <div class="badge-stage">
                <div
                    class="live-badge"
                    role="status"
                    aria-label="Live"
                >
                    <span class="live-dot" aria-hidden="true"></span>
                    <span class="live-text">LIVE</span>
                </div>
            </div>

            <p class="status">
                Pure CSS · No JavaScript
            </p>

        </section>
    </main>
</body>
</html>
