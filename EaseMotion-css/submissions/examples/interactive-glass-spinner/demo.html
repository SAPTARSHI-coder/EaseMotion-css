<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Interactive glassmorphism loading spinner">
  <title>Interactive Glass Spinner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">
    <section class="glass-card" aria-label="Loading indicator">

      <div class="spinner-wrapper">
        <div class="spinner" aria-hidden="true">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>

      <h1>Loading</h1>
      <p>Please wait while we prepare everything for you.</p>

      <div class="loading-bar" aria-hidden="true">
        <span></span>
      </div>

      <button class="action-btn" type="button">
        Processing...
      </button>

    </section>
  </main>

</body>
</html>
