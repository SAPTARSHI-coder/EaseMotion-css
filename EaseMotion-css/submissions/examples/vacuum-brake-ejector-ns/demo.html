<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vacuum Brake Ejector — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Vacuum Brake Ejector demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Vacuum Brake Ejector</h1>
      <p class="lede">Vacuum brake ejector pulling the train pipe down</p>
    </header>

    <section class="ease-vacuum-brake-ejector" data-demo="vacuum-brake-ejector" aria-live="polite">
      <div class="ease-vacuum-brake-ejector__housing">
        <div class="ease-vacuum-brake-ejector__bezel">
          <div class="ease-vacuum-brake-ejector__face">
            <div class="ease-vacuum-brake-ejector__readout">
              <span class="ease-vacuum-brake-ejector__label">Vacuum Brake Ejector</span>
              <span class="ease-vacuum-brake-ejector__value">LIVE</span>
            </div>
            <div class="ease-vacuum-brake-ejector__motion" aria-hidden="true">
              <span class="ease-vacuum-brake-ejector__a"></span>
              <span class="ease-vacuum-brake-ejector__b"></span>
              <span class="ease-vacuum-brake-ejector__c"></span>
              <span class="ease-vacuum-brake-ejector__d"></span>
            </div>
            <div class="ease-vacuum-brake-ejector__meters">
              <i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-vacuum-brake-ejector__controls">
          <button type="button" class="ease-vacuum-brake-ejector__btn primary">Eject</button>
          <button type="button" class="ease-vacuum-brake-ejector__btn">Lap</button>
          <label class="ease-vacuum-brake-ejector__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-vacuum-brake-ejector__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
