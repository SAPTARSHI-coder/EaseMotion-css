<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Animated scroll shake hint component"
  >
  <title>Scroll Shake Hint</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main>
    <section class="hero">
      <h1>Scroll Down</h1>
      <p>Discover more content below</p>

      <a
        class="scroll-hint"
        href="#content"
        aria-label="Scroll to content"
      >
        <span class="chevron"></span>
      </a>
    </section>

    <section class="content" id="content">
      <h2>More Content</h2>
      <p>
        The animated chevron provides a subtle visual hint
        encouraging visitors to continue scrolling.
      </p>
    </section>
  </main>
</body>
</html>
