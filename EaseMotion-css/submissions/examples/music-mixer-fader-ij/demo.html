<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-music-mixer-fader demo</title>
</head>
<body>
<div class="mx-app">
  <span class="mx-title">MIX DESK</span>
  <div class="mx-channels">
    <div class="mx-ch mx-ch-1">
      <span class="mx-label">DRM</span>
      <span class="mx-meter"><span class="mx-level mx-level-1"></span></span>
      <span class="mx-track"><span class="mx-fader"></span></span>
    </div>
    <div class="mx-ch mx-ch-2">
      <span class="mx-label">BAS</span>
      <span class="mx-meter"><span class="mx-level mx-level-2"></span></span>
      <span class="mx-track"><span class="mx-fader"></span></span>
    </div>
    <div class="mx-ch mx-ch-3">
      <span class="mx-label">KEY</span>
      <span class="mx-meter"><span class="mx-level mx-level-3"></span></span>
      <span class="mx-track"><span class="mx-fader"></span></span>
    </div>
  </div>
  <div class="mx-master">
    <span class="mx-mk"></span>
  </div>
  <span class="mx-levels">-12 dB</span>
</div>
</body>
</html>
