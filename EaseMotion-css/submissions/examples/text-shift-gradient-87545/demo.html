<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Text Shift Gradient</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="panel" aria-labelledby="title">
      <section class="copy">
        <p class="label">EaseMotion text component</p>
        <h1 id="title">Text Shift Gradient</h1>
        <p>
          Animated gradient text that shifts hue and position continuously, with
          a stronger sweep on hover or keyboard focus.
        </p>
      </section>

      <section class="samples" aria-label="Gradient text examples">
        <button class="gradient-word ocean">Prism</button>
        <button class="gradient-word ember">Nova</button>
        <button class="gradient-word mint">Pulse</button>
      </section>
    </main>
  </body>
</html>
