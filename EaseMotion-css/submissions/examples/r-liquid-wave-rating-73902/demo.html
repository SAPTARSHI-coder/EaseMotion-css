<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Accessible CSS liquid wave fill rating component"
  >
  <title>Liquid Wave Rating</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">
    <section class="rating-card" aria-labelledby="rating-title">
      <span class="eyebrow">Rating &amp; Feedback</span>

      <h1 id="rating-title">Liquid Wave Rating</h1>

      <p class="intro">
        Rate your experience with our smooth liquid wave fill effect.
      </p>

      <div class="rating-wrapper">
        <div
          class="rating"
          role="radiogroup"
          aria-label="Rate your experience from one to five stars"
        >
          <input
            type="radio"
            id="rating-5"
            name="rating"
            value="5"
          >
          <label for="rating-5" aria-label="5 stars">
            <span class="star">★</span>
          </label>

          <input
            type="radio"
            id="rating-4"
            name="rating"
            value="4"
          >
          <label for="rating-4" aria-label="4 stars">
            <span class="star">★</span>
          </label>

          <input
            type="radio"
            id="rating-3"
            name="rating"
            value="3"
          >
          <label for="rating-3" aria-label="3 stars">
            <span class="star">★</span>
          </label>

          <input
            type="radio"
            id="rating-2"
            name="rating"
            value="2"
          >
          <label for="rating-2" aria-label="2 stars">
            <span class="star">★</span>
          </label>

          <input
            type="radio"
            id="rating-1"
            name="rating"
            value="1"
          >
          <label for="rating-1" aria-label="1 star">
            <span class="star">★</span>
          </label>
        </div>
      </div>

      <p class="hint">
        Select a rating
      </p>

      <div class="rating-info" aria-live="polite">
        <span class="rating-number">5.0</span>
        <span class="rating-text">Excellent experience</span>
      </div>
    </section>
  </main>

</body>
</html>
