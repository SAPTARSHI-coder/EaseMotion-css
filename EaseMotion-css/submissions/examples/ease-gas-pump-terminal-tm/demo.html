<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gas Pump Terminal | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="gpstage">
    <div class="gpunit">
      <div class="gpscreen">
        <div class="gprow"><span class="gprow-label">GALLONS</span><span>8.245</span></div>
        <div class="gprow"><span class="gprow-label">PRICE/G</span><span>$3.89</span></div>
        <p class="gpprice">$32.07</p>
        <p class="gpprice-label">TOTAL</p>
      </div>
      <div class="gpgrades">
        <div class="gpgrade"><div class="gpgrade-name">Regular</div><div class="gpgrade-octane">87</div></div>
        <div class="gpgrade active"><div class="gpgrade-name">Mid</div><div class="gpgrade-octane">89</div></div>
        <div class="gpgrade"><div class="gpgrade-name">Premium</div><div class="gpgrade-octane">93</div></div>
      </div>
      <div class="gpnozzle"></div>
    </div>
  </div>
</body>
</html>
