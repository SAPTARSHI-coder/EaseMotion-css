<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Fourier Transform QFT - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css"></head><body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030712; color: #ffffff;">

    <div class="ease-card ease-card-glass qft-container">
        <div class="qft-header">
            <h2>Quantum Fourier Transform</h2>
            <span class="ease-badge ease-badge-secondary">Transforming</span>
        </div>
        
        <div class="qft-screen ease-center">
            <div class="qft-flux flux-qft-a"></div>
            <div class="qft-flux flux-qft-b"></div>
            <div class="qft-boundary-ring"></div>
            <div class="qft-core ease-center"></div>
        </div>

        <div class="qft-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">|x&rang; &rarr; 1/&radic;N &sum; e^{2&pi;ixy/N}|y&rang;</span>
            <button class="ease-btn ease-btn-secondary ease-btn-sm ease-hover-grow">Execute QFT</button>
        </div>
    </div></body></html>
