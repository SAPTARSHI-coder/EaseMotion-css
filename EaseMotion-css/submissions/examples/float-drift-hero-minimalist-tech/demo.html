<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CSS Float-Drift Hero Section with minimalist tech styling. Pure CSS hero with floating drift animation, clean typography, and light theme.">
  <title>Float-Drift Hero Section – Minimalist Tech Layouts</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="fdh-hero">
    <div class="fdh-hero__content">
      <span class="fdh-hero__pill">Minimalist Tech</span>
      <h1 class="fdh-hero__heading">Build faster.<br>Ship cleaner.</h1>
      <p class="fdh-hero__body">A lightweight toolkit for developers who care about speed, simplicity, and shipping code that actually works.</p>
      <div class="fdh-hero__actions">
        <a href="#" class="fdh-hero__btn fdh-hero__btn--solid">Get Started</a>
        <a href="#" class="fdh-hero__btn fdh-hero__btn--outline">View Docs</a>
      </div>
    </div>

    <div class="fdh-hero__visual">
      <div class="fdh-hero__shape fdh-hero__shape--1"></div>
      <div class="fdh-hero__shape fdh-hero__shape--2"></div>
      <div class="fdh-hero__shape fdh-hero__shape--3"></div>
    </div>

    <div class="fdh-hero__bg" aria-hidden="true">
      <div class="fdh-hero__orb fdh-hero__orb--a"></div>
      <div class="fdh-hero__orb fdh-hero__orb--b"></div>
    </div>
  </header>

</body>
</html>
