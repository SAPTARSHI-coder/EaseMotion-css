<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Two-Phase Commit Quorum</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="motion-shell two_phase_commit_quorum_drp" aria-labelledby="motion-title">
    <section class="motion-panel">
      <p class="eyebrow">distributed commit</p>
      <h1 id="motion-title">Two-Phase Commit Quorum</h1>
      <p class="summary">A coordinator broadcasts prepare messages, gathers participant votes, and reveals the final commit decision through pure CSS motion.</p>
      <div class="stage" role="img" aria-label="Animated Two-Phase Commit Quorum visualization">
        <div class="orbit orbit-one"></div>
        <div class="orbit orbit-two"></div>
        <article class="node node-a"><strong>A</strong><span>prepare sent</span></article>
        <article class="node node-b"><strong>B</strong><span>quorum reached</span></article>
        <article class="node node-c"><strong>C</strong><span>commit broadcast</span></article>
        <div class="beam beam-ab"><i></i></div>
        <div class="beam beam-bc"><i></i></div>
        <div class="beam beam-ca"><i></i></div>
        <div class="decision">commit broadcast</div>
      </div>
      <div class="status-grid" aria-label="Two-Phase Commit Quorum status">
        <span>prepare sent</span>
        <span>quorum reached</span>
        <span>commit broadcast</span>
      </div>
    </section>
  </main>
</body>
</html>
