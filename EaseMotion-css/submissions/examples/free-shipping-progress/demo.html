<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Free Shipping Progress &mdash; EaseMotion CSS Demo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="page-head">
    <p class="kicker">EaseMotion CSS &middot; E-commerce</p>
    <h1>Free Shipping Progress</h1>
    <p class="sub">Nudge shoppers to the threshold with a bar that almost begs to be filled.</p>
  </header>
  <main class="stage">
    <div class="fs-card">
      <p class="fs-msg">Add <b>$18</b> more for free shipping!</p>
      <div class="fs-track">
        <div class="fs-fill">
          <span class="fs-truck">&#128666;</span>
        </div>
      </div>
      <div class="fs-labels">
        <span>$0</span>
        <span>$50 &middot; Free shipping</span>
      </div>
    </div>
  </main>
  <p class="stage-caption">The truck rides along as the fill grows into place.</p>
  <footer class="page-foot">
    <span>Pure CSS &middot; zero dependencies</span>
    <span>Threshold meter</span>
  </footer>
</body>
</html>
