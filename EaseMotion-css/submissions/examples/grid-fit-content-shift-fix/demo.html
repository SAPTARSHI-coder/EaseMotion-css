<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EaseMotion CSS Sandbox — Grid Fit-Content Shift Fix</title>
  
  <!-- Relative path loading your sandbox style context cleanly -->
  <link rel="stylesheet" href="./style.css">
  
  <style>
    body {
      background-color: #0b1121;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 1.5rem;
    }
  </style>
</head>
<body>

  <header style="margin-bottom: 2rem; text-align: center; max-width: 480px;">
    <h1 style="color: white; margin: 0; font-size: 1.5rem; font-weight: 700;">Grid Fit-Content Shift Canvas</h1>
    <p style="color: #64748b; margin: 4px 0 0 0; font-size: 0.875rem; line-height: 1.5;">Click "Simulate Live Text Update". Replacing <code>fit-content()</code> with <code>minmax(max-content, 200px)</code> and <code>contain: inline-size</code> stops column track jitter with 0 layout reflows.</p>
  </header>

  <!-- Sandbox Active Stage Envelope -->
  <div class="alm-sandbox-stage">
    
    <!-- PERFORMANCE STABILIZED DASHBOARD GRID -->
    <div class="alm-dashboard-grid">
      
      <!-- COLUMN 1: CONTAINED DYNAMIC TEXT -->
      <div>
        <span class="alm-card-tag">[Column_1_Target]</span>
        <h4 id="dynamicTextLabel" class="alm-grid-cell-text">
          Status: Active Node Alpha
        </h4>
      </div>

      <!-- COLUMN 2: FLEXIBLE 1FR METRIC CELL -->
      <div class="alm-grid-flexible-cell">
        <span style="font-size: 0.7rem; color: #94a3b8;">[Column_2_Flexible_1fr]</span>
        <span class="alm-metric-value">99.4%</span>
      </div>

    </div>

    <button id="updateBtn" class="alm-update-btn">
      Simulate Live Text Update
    </button>

  </div>

  <script>
    // Lightweight local helper to toggle live text strings and test layout track stability
    const updateBtn = document.getElementById('updateBtn');
    const dynamicLabel = document.getElementById('dynamicTextLabel');

    const sampleStrings = [
      "Status: Active Node Alpha",
      "Status: Processing Batch #849",
      "Status: Syncing Stream Matrix",
      "Status: Operational"
    ];
    let currentIndex = 0;

    updateBtn.addEventListener('click', () => {
      currentIndex = (currentIndex + 1) % sampleStrings.length;
      dynamicLabel.textContent = sampleStrings[currentIndex];
    });
  </script>

</body>
</html>
