<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Glassmorphism - All 30 Components</title>
    <!-- We assume the core library is available for demo, but we focus on our utility -->
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            /* Vibrant background to showcase glass effect */
            background: linear-gradient(45deg, #4158D0 0%, #C850C0 46%, #FFCC70 100%);
            background-size: cover;
            background-attachment: fixed;
            font-family: system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            margin: 0;
            padding: 3rem;
            display: flex;
            flex-direction: column;
            gap: 2rem;
            color: #fff;
        }
        h1 {
            text-align: center;
            margin-bottom: 2rem;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }
        .component-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }
        .demo-box {
            padding: 1.5rem;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            min-height: 120px;
            font-weight: 500;
        }
        .ease-btn {
            cursor: pointer;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Global Glassmorphism (#60276)</h1>
    <div class="component-grid">
        <div class="ease-card demo-box">
            <h3>Card Component</h3>
            <p>Glassmorphic layered feel</p>
        </div>
        <button class="ease-btn demo-box">
            Button Component
        </button>
        <div class="ease-badge demo-box">
            Badge Component
        </div>
        <div class="ease-alert demo-box">
            Alert Component
        </div>
        <div class="ease-popover demo-box">
            Popover Component
        </div>
        <div class="ease-dialog demo-box">
            Dialog Component
        </div>
    </div>
</body>
</html>
