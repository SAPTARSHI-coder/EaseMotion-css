<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Image Tilt Pola &mdash; EaseMotion CSS Demo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="itp-row">
  <figure class="itp-pola" style="--i:0">
    <div class="itp-photo" style="--c:#6fb7ff"></div>
    <figcaption>Beach</figcaption>
  </figure>
  <figure class="itp-pola" style="--i:1">
    <div class="itp-photo" style="--c:#ffd37a"></div>
    <figcaption>City</figcaption>
  </figure>
  <figure class="itp-pola" style="--i:2">
    <div class="itp-photo" style="--c:#7bffb0"></div>
    <figcaption>Forest</figcaption>
  </figure>
</div>
</body>
</html>
