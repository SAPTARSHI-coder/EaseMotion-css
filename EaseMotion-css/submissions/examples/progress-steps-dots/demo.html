<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Progress Steps Dots &mdash; EaseMotion CSS Demo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="page-head">
    <p class="kicker">EaseMotion CSS &middot; Productivity</p>
    <h1>Progress Steps Dots</h1>
    <p class="sub">Four steps, one line of light that keeps growing.</p>
  </header>
  <main class="stage">
    <div class="pd-wrap">
      <div class="pd-track">
        <div class="pd-dot active">1</div>
        <div class="pd-dot">2</div>
        <div class="pd-dot">3</div>
        <div class="pd-dot">4</div>
      </div>
      <div style="display:flex;justify-content:space-between;margin-top:14px">
        <span class="pd-label">Account</span>
        <span class="pd-label">Details</span>
        <span class="pd-label">Payment</span>
        <span class="pd-label">Done</span>
      </div>
    </div>
  </main>
  <p class="stage-caption">Dots pop as the green line travels across.</p>
  <footer class="page-foot">
    <span>Pure CSS &middot; zero dependencies</span>
    <span>Stepping dots</span>
  </footer>
</body>
</html>
