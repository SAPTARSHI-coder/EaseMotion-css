<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trebuchet Counterweight — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Trebuchet Counterweight demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Trebuchet Counterweight</h1>
      <p class="lede">Trebuchet counterweight swinging to launch the arm</p>
    </header>

    <section class="ease-trebuchet-counterweight" data-demo="trebuchet-counterweight" aria-live="polite">
      <div class="ease-trebuchet-counterweight__housing">
        <div class="ease-trebuchet-counterweight__bezel">
          <div class="ease-trebuchet-counterweight__face">
            <div class="ease-trebuchet-counterweight__readout">
              <span class="ease-trebuchet-counterweight__label">Trebuchet Counterweight</span>
              <span class="ease-trebuchet-counterweight__value">LIVE</span>
            </div>
            <div class="ease-trebuchet-counterweight__motion" aria-hidden="true">
              <span class="ease-trebuchet-counterweight__a"></span>
              <span class="ease-trebuchet-counterweight__b"></span>
              <span class="ease-trebuchet-counterweight__c"></span>
              <span class="ease-trebuchet-counterweight__d"></span>
            </div>
            <div class="ease-trebuchet-counterweight__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-trebuchet-counterweight__controls">
          <button type="button" class="ease-trebuchet-counterweight__btn primary">Engage</button>
          <button type="button" class="ease-trebuchet-counterweight__btn">Reset</button>
          <label class="ease-trebuchet-counterweight__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-trebuchet-counterweight__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
