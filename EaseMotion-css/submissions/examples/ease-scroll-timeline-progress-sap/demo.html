<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scroll Timeline Progress</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <h1>Scroll Timeline Progress</h1>

    <ol class="timeline" id="timeline">
      <li class="tl-item">
        <span class="tl-dot"></span>
        <div class="tl-content"><h2>Order placed</h2><p>Jan 4</p></div>
      </li>
      <li class="tl-item">
        <span class="tl-dot"></span>
        <div class="tl-content"><h2>Processing</h2><p>Jan 5</p></div>
      </li>
      <li class="tl-item">
        <span class="tl-dot"></span>
        <div class="tl-content"><h2>Shipped</h2><p>Jan 6</p></div>
      </li>
      <li class="tl-item">
        <span class="tl-dot"></span>
        <div class="tl-content"><h2>Delivered</h2><p>Jan 8</p></div>
      </li>
      <span class="tl-line"></span>
      <span class="tl-line-fill" id="tlFill"></span>
    </ol>
  </main>

  <script>
    const timeline = document.getElementById('timeline');
    const fill = document.getElementById('tlFill');

    function updateFill() {
      const rect = timeline.getBoundingClientRect();
      const total = rect.height;
      const visible = Math.min(Math.max(window.innerHeight * 0.65 - rect.top, 0), total);
      const pct = total > 0 ? (visible / total) * 100 : 0;
      fill.style.height = pct + '%';
    }

    document.addEventListener('scroll', updateFill, { passive: true });
    window.addEventListener('resize', updateFill);
    updateFill();
  </script>
</body>
</html>
