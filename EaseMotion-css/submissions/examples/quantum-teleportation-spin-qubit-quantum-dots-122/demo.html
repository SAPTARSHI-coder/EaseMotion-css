<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spin Qubit Quantum Dots - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css"></head><body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030712; color: #ffffff;">

    <div class="ease-card ease-card-glass sqd-container">
        <div class="sqd-header">
            <h2>Spin Qubit Quantum Dots</h2>
            <span class="ease-badge ease-badge-success">Semiconductor QC</span>
        </div>
        
        <div class="sqd-screen ease-center">
            <div class="sqd-flux flux-sqd-a"></div>
            <div class="sqd-flux flux-sqd-b"></div>
            <div class="sqd-boundary-ring"></div>
            <div class="sqd-core ease-center"></div>
        </div>

        <div class="sqd-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">GaAs/Si Heterostructures &amp; Exchange Gates</span>
            <button class="ease-btn ease-btn-success ease-btn-sm ease-hover-grow">Run Spin Dot Gate</button>
        </div>
    </div></body></html>
