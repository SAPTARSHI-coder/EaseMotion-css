<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glassmorphic Liquid Fill Button</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<section class="hero">

<div class="glass-card">

<span class="badge">
Glassmorphic Style
</span>

<h1>
Liquid Fill Water Button
</h1>

<p>
A premium glassmorphism button featuring smooth liquid fill animation,
overflow wave effects and elegant frosted glass styling built entirely
with HTML and CSS.
</p>

<button class="liquid-btn">

<span class="btn-text">
Explore Now
</span>

<div class="liquid">

<span class="wave wave1"></span>

<span class="wave wave2"></span>

<span class="wave wave3"></span>

</div>

</button>

<div class="features">

<div class="feature">
Glass Effect
</div>

<div class="feature">
Liquid Waves
</div>

<div class="feature">
CSS Only
</div>

</div>

</div>

</section>

</body>
</html>
