<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stacked Avatars Animation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="container">
    <h1>Stacked Avatars</h1>
    <p class="subtitle">Hover over the stack to expand overlapping user avatars.</p>

    <!-- Avatar Stack Container -->
    <div class="avatar-stack">
      <div class="avatar" style="--i: 0;">
        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=150&q=80" alt="User 1">
      </div>
      <div class="avatar" style="--i: 1;">
        <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=150&q=80" alt="User 2">
      </div>
      <div class="avatar" style="--i: 2;">
        <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=150&q=80" alt="User 3">
      </div>
      <div class="avatar" style="--i: 3;">
        <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=150&q=80" alt="User 4">
      </div>
      <div class="avatar avatar-more" style="--i: 4;">
        <span>+12</span>
      </div>
    </div>
  </main>

</body>
</html>
