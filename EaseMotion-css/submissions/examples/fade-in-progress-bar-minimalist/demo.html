<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fade-In Progress Bar - Minimalist Tech</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="demo-container">
        <div class="tech-card">
            <h2 class="tech-card-title">System Status</h2>
            <div class="tech-metrics">
                <span class="tech-metric-label">Memory Usage</span>
                <span class="tech-metric-value">78%</span>
            </div>
            <div class="progress-track">
                <div class="progress-fill ease-fade-in-progress"></div>
            </div>
        </div>
    </div>
</body>
</html>
