<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
        name="description"
        content="Interactive vibrant gradient heatmap grid with tooltip hover states."
    >
    <title>Vibrant Gradient Heatmap</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="page">
        <section class="heatmap-card" aria-labelledby="heatmap-title">

            <header class="heatmap-header">
                <div>
                    <p class="eyebrow">ACTIVITY MATRIX</p>
                    <h1 id="heatmap-title">Interactive Heatmap</h1>
                    <p class="subtitle">
                        Explore activity levels by hovering over each cell.
                    </p>
                </div>

                <div class="status">
                    <span class="status-dot"></span>
                    Live Data
                </div>
            </header>

            <div class="heatmap-wrapper">
                <div class="day-labels" aria-hidden="true">
                    <span>Mon</span>
                    <span>Tue</span>
                    <span>Wed</span>
                    <span>Thu</span>
                    <span>Fri</span>
                    <span>Sat</span>
                    <span>Sun</span>
                </div>

                <div
                    class="heatmap"
                    role="grid"
                    aria-label="Weekly activity heatmap"
                    id="heatmap"
                ></div>
            </div>

            <footer class="heatmap-footer">
                <span>Less</span>

                <div class="legend" aria-hidden="true">
                    <i class="level-0"></i>
                    <i class="level-1"></i>
                    <i class="level-2"></i>
                    <i class="level-3"></i>
                    <i class="level-4"></i>
                </div>

                <span>More</span>
            </footer>

        </section>
    </main>

    <script>
        const heatmap = document.getElementById("heatmap");

        const activity = [
            1, 3, 2, 4, 1, 0, 3,
            2, 4, 4, 1, 3, 2, 4,
            0, 2, 3, 4, 4, 1, 2,
            3, 1, 4, 2, 3, 4, 1,
            4, 3, 2, 4, 1, 3, 4,
            2, 1, 3, 0, 4, 2, 3,
            1, 4, 2, 3, 4, 1, 2,
            3, 2, 4, 1, 3, 4, 2
        ];

        const months = [
            "January", "February", "March", "April",
            "May", "June", "July", "August",
            "September", "October", "November", "December"
        ];

        activity.forEach((level, index) => {
            const cell = document.createElement("button");

            const day = (index % 7) + 1;
            const month = months[index % months.length];

            cell.className = `cell level-${level}`;
            cell.type = "button";
            cell.setAttribute("role", "gridcell");

            const value = level * 12 + 5;

            cell.setAttribute(
                "aria-label",
                `${value} activities on day ${day}`
            );

            cell.dataset.tooltip =
                `${month} • Day ${day} • ${value} activities`;

            cell.addEventListener("mouseenter", showTooltip);
            cell.addEventListener("mouseleave", hideTooltip);
            cell.addEventListener("focus", showTooltip);
            cell.addEventListener("blur", hideTooltip);

            heatmap.appendChild(cell);
        });

        const tooltip = document.createElement("div");
        tooltip.className = "tooltip";
        tooltip.setAttribute("role", "tooltip");
        document.body.appendChild(tooltip);

        function showTooltip(event) {
            const cell = event.currentTarget;

            tooltip.textContent = cell.dataset.tooltip;
            tooltip.classList.add("visible");

            const rect = cell.getBoundingClientRect();

            tooltip.style.left =
                `${rect.left + rect.width / 2}px`;

            tooltip.style.top =
                `${rect.top - 12}px`;
        }

        function hideTooltip() {
            tooltip.classList.remove("visible");
        }
    </script>
</body>
</html>
