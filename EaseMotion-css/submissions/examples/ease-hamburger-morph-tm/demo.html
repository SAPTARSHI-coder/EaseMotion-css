<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ease-hamburger-morph Demo</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body { display: flex; flex-direction: column; align-items: center; gap: 32px; padding: 60px 20px; background: #0f172a; }
    h1 { font-size: 1.4rem; color: #f8fafc; }
    .row { display: flex; gap: 24px; flex-wrap: wrap; justify-content: center; align-items: center; }
    .demo-section { display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .demo-label { font-size: 0.8rem; color: rgba(248,250,252,0.45); }
  </style>
</head>
<body>
  <h1>ease-hamburger-morph Component</h1>

  <div class="demo-section">
    <span class="demo-label">Default hamburger morph</span>
    <button class="hamburger" id="ham1" onclick="this.classList.toggle('active')" aria-label="Toggle menu">
      <span class="hamburger-bar"></span>
      <span class="hamburger-bar"></span>
      <span class="hamburger-bar"></span>
    </button>
  </div>

  <div class="demo-section">
    <span class="demo-label">Arrow morph variant</span>
    <button class="hamburger arrow" onclick="this.classList.toggle('active')" aria-label="Toggle menu">
      <span class="hamburger-bar"></span>
      <span class="hamburger-bar"></span>
      <span class="hamburger-bar"></span>
    </button>
  </div>

  <div class="demo-section">
    <span class="demo-label">Minus morph variant</span>
    <button class="hamburger minus" onclick="this.classList.toggle('active')" aria-label="Toggle menu">
      <span class="hamburger-bar"></span>
      <span class="hamburger-bar"></span>
      <span class="hamburger-bar"></span>
    </button>
  </div>

  <div class="demo-section">
    <span class="demo-label">Collapse variant</span>
    <button class="hamburger collapse" onclick="this.classList.toggle('active')" aria-label="Toggle menu">
      <span class="hamburger-bar"></span>
      <span class="hamburger-bar"></span>
      <span class="hamburger-bar"></span>
    </button>
  </div>

  <div class="demo-section">
    <span class="demo-label">Size variants</span>
    <div class="row">
      <button class="hamburger size-sm" onclick="this.classList.toggle('active')"><span class="hamburger-bar"></span><span class="hamburger-bar"></span><span class="hamburger-bar"></span></button>
      <button class="hamburger size-md" onclick="this.classList.toggle('active')"><span class="hamburger-bar"></span><span class="hamburger-bar"></span><span class="hamburger-bar"></span></button>
      <button class="hamburger size-lg" onclick="this.classList.toggle('active')"><span class="hamburger-bar"></span><span class="hamburger-bar"></span><span class="hamburger-bar"></span></button>
      <button class="hamburger size-xl" onclick="this.classList.toggle('active')"><span class="hamburger-bar"></span><span class="hamburger-bar"></span><span class="hamburger-bar"></span></button>
    </div>
  </div>

  <div class="demo-section">
    <span class="demo-label">Color variants</span>
    <div class="row">
      <button class="hamburger color-primary" onclick="this.classList.toggle('active')"><span class="hamburger-bar"></span><span class="hamburger-bar"></span><span class="hamburger-bar"></span></button>
      <button class="hamburger color-success" onclick="this.classList.toggle('active')"><span class="hamburger-bar"></span><span class="hamburger-bar"></span><span class="hamburger-bar"></span></button>
      <button class="hamburger color-danger" onclick="this.classList.toggle('active')"><span class="hamburger-bar"></span><span class="hamburger-bar"></span><span class="hamburger-bar"></span></button>
    </div>
  </div>

  <div class="demo-section">
    <span class="demo-label">With pill background</span>
    <button class="hamburger pill" onclick="this.classList.toggle('active')"><span class="hamburger-bar"></span><span class="hamburger-bar"></span><span class="hamburger-bar"></span></button>
  </div>

  <div class="component-label">ease-hamburger-morph | Issue #64943</div>
</body>
</html>
