<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="A dependency-free 72 percent circular progress ring gauge."
  >

  <title>Progress Ring Gauge</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="demo">
    <section class="gauge-card" aria-labelledby="title">
      <div class="gauge-copy">
        <p class="eyebrow">PROGRESS / GAUGE</p>

        <h1 id="title">Progress Ring</h1>

        <p class="description">
          A circular gauge that fills to 72% with a rounded cap and a centered label.
        </p>
      </div>

      <div
        class="ring"
        role="progressbar"
        aria-label="Progress"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="72"
      >
        <svg
          class="ring__svg"
          viewBox="0 0 200 200"
          aria-hidden="true"
        >
          <circle
            class="ring__track"
            cx="100"
            cy="100"
            r="78"
          />

          <circle
            class="ring__progress"
            cx="100"
            cy="100"
            r="78"
          />
        </svg>

        <div class="ring__center">
          <strong>72</strong>
          <span>%</span>
          <small>COMPLETE</small>
        </div>
      </div>

      <footer class="gauge-footer">
        <span>72% PROGRESS</span>
        <span>PURE HTML + CSS</span>
      </footer>
    </section>
  </main>
</body>
</html>
