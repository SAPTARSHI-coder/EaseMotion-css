<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prism Ripple</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="page">

    <section class="intro">
      <span class="eyebrow">INTERACTIVE SURFACE</span>
      <h1>Prism Ripple</h1>
      <p>
        Move across the surface and create refractive ripples.
        Click anywhere to create a stronger light pulse.
      </p>
    </section>

    <section
      class="prism-ripple"
      id="prismRipple"
      aria-label="Interactive prism ripple surface"
    >

      <div class="prism-background"></div>

      <div class="prism-glow" id="prismGlow"></div>

      <div class="prism-noise"></div>

      <div class="prism-content">
        <span class="prism-icon">✦</span>
        <span class="prism-label">PRISM SURFACE</span>

        <h2>Move the light</h2>

        <p id="status">
          Waiting for interaction
        </p>

        <div class="counter">
          <span>RIPPLES</span>
          <strong id="rippleCount">0</strong>
        </div>
      </div>

      <div
        class="pointer-marker"
        id="pointerMarker"
        aria-hidden="true"
      ></div>

    </section>

    <div class="controls">

      <button
        class="control-btn primary"
        id="rippleBtn"
        type="button"
      >
        ✦ Create Ripple
      </button>

      <button
        class="control-btn"
        id="resetBtn"
        type="button"
      >
        ↻ Reset
      </button>

    </div>

    <p class="hint">
      Move · Click · Touch · Space · R
    </p>

  </main>

  <script>
    const surface = document.getElementById("prismRipple");
    const glow = document.getElementById("prismGlow");
    const marker = document.getElementById("pointerMarker");

    const counter = document.getElementById("rippleCount");
    const status = document.getElementById("status");

    const rippleButton = document.getElementById("rippleBtn");
    const resetButton = document.getElementById("resetBtn");

    let rippleCount = 0;
    let activeRipples = 0;

    const MAX_RIPPLES = 12;

    function updatePointer(x, y) {
      const rect = surface.getBoundingClientRect();

      const px = x - rect.left;
      const py = y - rect.top;

      surface.style.setProperty("--pointer-x", `${px}px`);
      surface.style.setProperty("--pointer-y", `${py}px`);

      glow.style.left = `${px}px`;
      glow.style.top = `${py}px`;

      marker.style.left = `${px}px`;
      marker.style.top = `${py}px`;
    }

    function createRipple(x, y) {
      if (activeRipples >= MAX_RIPPLES) {
        status.textContent = "Ripple field is full";
        return;
      }

      const rect = surface.getBoundingClientRect();

      const px = x - rect.left;
      const py = y - rect.top;

      const ripple = document.createElement("span");

      ripple.className = "ripple";

      ripple.style.left = `${px}px`;
      ripple.style.top = `${py}px`;

      const hue = Math.floor(Math.random() * 360);

      ripple.style.setProperty("--ripple-hue", hue);

      surface.appendChild(ripple);

      activeRipples++;

      rippleCount++;
      counter.textContent = rippleCount;

      status.textContent = "Refractive ripple created";

      ripple.addEventListener("animationend", () => {
        ripple.remove();
        activeRipples--;

        if (activeRipples === 0) {
          status.textContent = "Surface stabilized";
        }
      });
    }

    surface.addEventListener("pointermove", (event) => {
      updatePointer(event.clientX, event.clientY);

      status.textContent = "Tracking light";
    });

    surface.addEventListener("pointerenter", (event) => {
      surface.classList.add("active");

      updatePointer(event.clientX, event.clientY);

      status.textContent = "Light detected";
    });

    surface.addEventListener("pointerleave", () => {
      surface.classList.remove("active");

      status.textContent = "Waiting for interaction";
    });

    surface.addEventListener("pointerdown", (event) => {
      updatePointer(event.clientX, event.clientY);

      createRipple(event.clientX, event.clientY);
    });

    rippleButton.addEventListener("click", () => {
      const rect = surface.getBoundingClientRect();

      const x = rect.left + rect.width / 2;
      const y = rect.top + rect.height / 2;

      createRipple(x, y);
    });

    resetButton.addEventListener("click", () => {
      surface.querySelectorAll(".ripple").forEach((ripple) => {
        ripple.remove();
      });

      rippleCount = 0;
      activeRipples = 0;

      counter.textContent = "0";
      status.textContent = "Surface reset";
    });

    document.addEventListener("keydown", (event) => {
      if (event.code === "Space") {
        event.preventDefault();

        rippleButton.click();
      }

      if (event.key.toLowerCase() === "r") {
        resetButton.click();
      }
    });
  </script>

</body>
</html>
