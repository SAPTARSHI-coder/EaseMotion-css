<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Micro Badge Pop &mdash; EaseMotion CSS Demo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="page-head">
    <p class="kicker">EaseMotion CSS &middot; Micro-interactions</p>
    <h1>Micro Badge Pop</h1>
    <p class="sub">Three new notifications &mdash; the badge announces each one.</p>
  </header>
  <main class="stage">
    <div class="mbb-bell">
      &#128276;
      <span class="mbb-badge">3</span>
    </div>
  </main>
  <p class="stage-caption">The bell rings and the badge pops on a loop.</p>
  <footer class="page-foot">
    <span>Pure CSS &middot; zero dependencies</span>
    <span>Popping badge</span>
  </footer>
</body>
</html>
