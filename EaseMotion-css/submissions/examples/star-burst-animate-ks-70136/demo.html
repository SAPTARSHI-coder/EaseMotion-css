<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Star Burst Animate</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <section class="showcase">
      <header>
        <h1>CSS Star Burst Animate</h1>
        <p>A pure HTML & CSS animation showing a star that bursts and expands with radiating rays when activated.</p>
      </header>
      
      <div class="demo-container">
        <!-- Accessibility-friendly visually hidden checkbox pattern -->
        <input type="checkbox" id="star-toggle" class="star-toggle sr-only">
        
        <label for="star-toggle" class="star-control">
          <span class="control-text">Activate Star Burst</span>
        </label>
        
        <div class="star-demo" aria-hidden="true">
          <div class="star-burst-wrapper">
            <div class="rays">
              <div class="ray-container r-0"><div class="ray ray-odd"></div></div>
              <div class="ray-container r-45"><div class="ray ray-even"></div></div>
              <div class="ray-container r-90"><div class="ray ray-odd"></div></div>
              <div class="ray-container r-135"><div class="ray ray-even"></div></div>
              <div class="ray-container r-180"><div class="ray ray-odd"></div></div>
              <div class="ray-container r-225"><div class="ray ray-even"></div></div>
              <div class="ray-container r-270"><div class="ray ray-odd"></div></div>
              <div class="ray-container r-315"><div class="ray ray-even"></div></div>
            </div>
            <div class="star"></div>
          </div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
