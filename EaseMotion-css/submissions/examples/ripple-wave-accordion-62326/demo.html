<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ripple-Wave Accordion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="accordion-container">
        <h2>Product Catalog</h2>
        
        <div class="accordion-item">
            <input type="checkbox" id="item1" class="accordion-toggle">
            <label for="item1" class="accordion-header">
                Electronics
                <span class="ripple"></span>
                <svg class="icon" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg>
            </label>
            <div class="accordion-content">
                <ul>
                    <li>Smartphones</li>
                    <li>Laptops</li>
                    <li>Headphones</li>
                </ul>
            </div>
        </div>

        <div class="accordion-item">
            <input type="checkbox" id="item2" class="accordion-toggle">
            <label for="item2" class="accordion-header">
                Apparel
                <span class="ripple"></span>
                <svg class="icon" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg>
            </label>
            <div class="accordion-content">
                <ul>
                    <li>Men's Clothing</li>
                    <li>Women's Clothing</li>
                    <li>Accessories</li>
                </ul>
            </div>
        </div>

        <div class="accordion-item">
            <input type="checkbox" id="item3" class="accordion-toggle">
            <label for="item3" class="accordion-header">
                Home & Garden
                <span class="ripple"></span>
                <svg class="icon" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg>
            </label>
            <div class="accordion-content">
                <ul>
                    <li>Furniture</li>
                    <li>Decor</li>
                    <li>Gardening Tools</li>
                </ul>
            </div>
        </div>
    </div>
</body>
</html>
