<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Neon-Trace Button</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="demo">
    <section class="hero">
      <p class="eyebrow">EaseMotion CSS</p>
      <h1>Neon-Trace Button</h1>
      <p class="intro">
        A glowing button with a continuously tracing neon border,
        created entirely with HTML and CSS.
      </p>

      <div class="button-group">
        <a href="#" class="neon-button">
          <span class="neon-button__trace"></span>
          <span class="neon-button__content">
            Explore Motion
            <span aria-hidden="true">→</span>
          </span>
        </a>

        <button class="neon-button neon-button--pink" type="button">
          <span class="neon-button__trace"></span>
          <span class="neon-button__content">
            Get Started
            <span aria-hidden="true">✦</span>
          </span>
        </button>

        <button class="neon-button neon-button--cyan" type="button">
          <span class="neon-button__trace"></span>
          <span class="neon-button__content">
            Learn More
            <span aria-hidden="true">↗</span>
          </span>
        </button>
      </div>
    </section>
  </main>

</body>
</html>
