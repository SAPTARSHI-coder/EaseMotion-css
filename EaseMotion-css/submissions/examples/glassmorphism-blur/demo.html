<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Glassmorphism Blur CSS component">
  <title>Glassmorphism Blur</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="demo">

    <section class="glass-card" aria-labelledby="glass-title">

      <div class="glass-orb glass-orb-one" aria-hidden="true"></div>
      <div class="glass-orb glass-orb-two" aria-hidden="true"></div>

      <div class="glass-content">

        <span class="glass-badge">
          GLASS EFFECT
        </span>

        <h1 id="glass-title">
          Glassmorphism Blur
        </h1>

        <p>
          A smooth translucent interface combining backdrop blur,
          soft gradients, subtle borders, and elegant transitions.
        </p>

        <div class="glass-info">

          <div class="info-item">
            <span class="info-icon" aria-hidden="true">◈</span>
            <div>
              <strong>Blur</strong>
              <small>20px backdrop</small>
            </div>
          </div>

          <div class="info-item">
            <span class="info-icon" aria-hidden="true">✦</span>
            <div>
              <strong>Pure CSS</strong>
              <small>No JavaScript</small>
            </div>
          </div>

        </div>

        <button class="glass-button" type="button">
          Explore Effect
          <span aria-hidden="true">→</span>
        </button>

      </div>

      <div class="glass-shine" aria-hidden="true"></div>

    </section>

  </main>

</body>
</html>
