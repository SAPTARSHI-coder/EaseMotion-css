<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Range Slider | EaseMotion CSS</title><link rel="stylesheet" href="style.css"></head>
<body><div class="rsu-root">
<div class="rsu-card">
<h2 class="rsu-title">Settings</h2>
<div class="rsu-field"><div class="rsu-label"><span class="rsu-name">Volume</span><span class="rsu-val" id="v1">50</span></div><input type="range" class="rsu-input" id="r1" min="0" max="100" value="50" oninput="document.getElementById('v1').textContent=this.value"></div>
<div class="rsu-field"><div class="rsu-label"><span class="rsu-name">Brightness</span><span class="rsu-val" id="v2">75</span></div><input type="range" class="rsu-input" id="r2" min="0" max="100" value="75" oninput="document.getElementById('v2').textContent=this.value"></div>
<div class="rsu-field"><div class="rsu-label"><span class="rsu-name">Contrast</span><span class="rsu-val" id="v3">60</span></div><input type="range" class="rsu-input" id="r3" min="0" max="100" value="60" oninput="document.getElementById('v3').textContent=this.value"></div>
</div>
<p class="rsu-sub">Pure CSS styled range slider with custom thumb and hover effects</p>
</div></body></html>
