<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CSS Local Time Widget">
  <title>CSS Local Time Widget</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">
    <section class="time-card" aria-labelledby="time-title">
      <div class="glow"></div>

      <div class="top-row">
        <span class="status">
          <span class="status-dot" aria-hidden="true"></span>
          Local Time
        </span>

        <span class="timezone">IST · UTC+5:30</span>
      </div>

      <div class="location">
        <span class="location-icon" aria-hidden="true">⌖</span>
        <div>
          <p class="city">New Delhi</p>
          <p class="country">India</p>
        </div>
      </div>

      <div class="clock" id="time-title" aria-label="Current local time">
        <span>10</span>
        <span class="colon">:</span>
        <span>42</span>
        <span class="period">AM</span>
      </div>

      <div class="date-row">
        <span>Monday, August 10</span>
        <span class="divider" aria-hidden="true"></span>
        <span>2026</span>
      </div>

      <div class="day-progress" aria-label="Day progress">
        <div class="progress-labels">
          <span>00:00</span>
          <span>24:00</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill"></div>
        </div>
      </div>
    </section>
  </main>

</body>
</html>
