<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Arcade Pixel Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card-container">
        <div class="retro-pixel-card ease-retro-card-ag">
            <div class="card-header">
                <h2>PLAYER 1</h2>
                <span class="score">9999</span>
            </div>
            <div class="card-image-container">
                <div class="pixel-avatar"></div>
            </div>
            <div class="card-body">
                <h3>LEVEL UP!</h3>
                <p>Insert coin to continue and unlock new achievements in the cyber realm.</p>
            </div>
            <div class="card-footer">
                <button class="pixel-btn">START</button>
            </div>
        </div>
    </div>
</body>
</html>
