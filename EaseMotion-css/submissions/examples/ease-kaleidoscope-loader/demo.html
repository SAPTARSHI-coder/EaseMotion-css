<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kaleidoscope Loader · Symmetrical Patterns</title>

    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <div class="card">
        <h2>🌀 Kaleidoscope Loader</h2>
        <p class="sub">symmetrical patterns rotate</p>

        <!-- === KALEIDOSCOPE LOADER === -->
        <div class="kaleidoscope-container" id="kaleidoscopeContainer">
            <div class="kaleidoscope-loader">
                <!-- Center -->
                <div class="kaleido-center"></div>

                <!-- 12 segments -->
                <div class="segment seg-1"></div>
                <div class="segment seg-2"></div>
                <div class="segment seg-3"></div>
                <div class="segment seg-4"></div>
                <div class="segment seg-5"></div>
                <div class="segment seg-6"></div>
                <div class="segment seg-7"></div>
                <div class="segment seg-8"></div>
                <div class="segment seg-9"></div>
                <div class="segment seg-10"></div>
                <div class="segment seg-11"></div>
                <div class="segment seg-12"></div>

                <!-- Ornamental dots -->
                <div class="kaleido-dot d1"></div>
                <div class="kaleido-dot d2"></div>
                <div class="kaleido-dot d3"></div>
                <div class="kaleido-dot d4"></div>
                <div class="kaleido-dot d5"></div>
                <div class="kaleido-dot d6"></div>
                <div class="kaleido-dot d7"></div>
                <div class="kaleido-dot d8"></div>
                <div class="kaleido-dot d9"></div>
                <div class="kaleido-dot d10"></div>
                <div class="kaleido-dot d11"></div>
                <div class="kaleido-dot d12"></div>

                <!-- Glow -->
                <div class="kaleido-glow"></div>
            </div>
        </div>

        <p style="margin-top: 2rem; font-size: 0.85rem; color: #64748b;">
            Rotating kaleidoscope · psychedelic loading animation
        </p>
    </div>

    <!-- Embedded JavaScript -->
    <script>
        (function() {
            'use strict';

            const container = document.getElementById('kaleidoscopeContainer');

            // Click to restart animation
            container.addEventListener('click', function() {
                const loader = this.querySelector('.kaleidoscope-loader');
                const segments = this.querySelectorAll('.segment');
                const dots = this.querySelectorAll('.kaleido-dot');
                const center = this.querySelector('.kaleido-center');
                const glow = this.querySelector('.kaleido-glow');

                loader.style.animation = 'none';
                void loader.offsetWidth;
                loader.style.animation = '';

                segments.forEach(seg => {
                    seg.style.animation = 'none';
                    void seg.offsetWidth;
                    seg.style.animation = '';
                });

                dots.forEach(dot => {
                    dot.style.animation = 'none';
                    void dot.offsetWidth;
                    dot.style.animation = '';
                });

                center.style.animation = 'none';
                void center.offsetWidth;
                center.style.animation = '';

                glow.style.animation = 'none';
                void glow.offsetWidth;
                glow.style.animation = '';

                this.classList.add('click-pulse');
                setTimeout(() => {
                    this.classList.remove('click-pulse');
                }, 300);

                console.log('🌀 Kaleidoscope restarted!');
            });

            // Keyboard accessibility
            container.setAttribute('tabindex', '0');
            container.setAttribute('role', 'button');
            container.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    this.click();
                }
            });

            console.log('🌀 Kaleidoscope loader initialized!');

        })();
    </script>

</body>
</html>
