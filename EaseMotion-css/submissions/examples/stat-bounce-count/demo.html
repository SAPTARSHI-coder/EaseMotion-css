<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stat Bounce Count #87567 Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-header">
        <span class="stat-title">Active Deployments</span>
        <span class="badge-tag">+24.8%</span>
      </div>
      <div class="stat-number-wrapper">
        <span id="counterDeployments">0</span>
      </div>
      <div class="stat-footer">Live microservice instances</div>
    </div>

    <div class="stat-card">
      <div class="stat-header">
        <span class="stat-title">Monthly Revenue</span>
        <span class="badge-tag">ARR Goal</span>
      </div>
      <div class="stat-number-wrapper">
        <span class="stat-prefix">$</span>
        <span id="counterRevenue">0</span>
        <span class="stat-suffix">k</span>
      </div>
      <div class="stat-footer">Recurring subscription value</div>
    </div>

    <div class="stat-card">
      <div class="stat-header">
        <span class="stat-title">Total Operations</span>
        <span class="badge-tag">99.99%</span>
      </div>
      <div class="stat-number-wrapper">
        <span id="counterOps">0</span>
        <span class="stat-suffix">+</span>
      </div>
      <div class="stat-footer">Global edge queries served</div>
    </div>
  </div>

  <div class="action-bar">
    <button class="btn-trigger" id="replayBtn">Animate Counters</button>
  </div>

  <script>
    function renderAndAnimate(element, targetValue, duration = 1500) {
      let startTime = null;
      let lastRendered = "";

      function updateCounter(currentTime) {
        if (!startTime) startTime = currentTime;
        const progress = Math.min((currentTime - startTime) / duration, 1);
        const currentVal = Math.floor(progress * targetValue);
        const currentStr = currentVal.toLocaleString();

        if (currentStr !== lastRendered) {
          element.innerHTML = "";
          currentStr.split("").forEach((char) => {
            const span = document.createElement("span");
            span.classList.add("digit-box");
            span.textContent = char;
            if (char >= "0" && char <= "9") {
              span.classList.add("bounce");
            }
            element.appendChild(span);
          });
          lastRendered = currentStr;
        }

        if (progress < 1) {
          requestAnimationFrame(updateCounter);
        }
      }

      requestAnimationFrame(updateCounter);
    }

    function runCounters() {
      renderAndAnimate(document.getElementById("counterDeployments"), 8420, 1600);
      renderAndAnimate(document.getElementById("counterRevenue"), 348, 1400);
      renderAndAnimate(document.getElementById("counterOps"), 19250, 1800);
    }

    document.getElementById("replayBtn").addEventListener("click", runCounters);
    window.addEventListener("DOMContentLoaded", runCounters);
  </script>
</body>
</html>
