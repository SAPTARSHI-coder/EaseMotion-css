<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ease Perspective Parallax Depth Hero</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="parallax-hero-body">
  <div class="parallax-stage" id="stage">
    <div class="layer layer-bg" data-depth="0.1">BACKGROUND LAYER</div>
    <div class="layer layer-mid" data-depth="0.3">MIDGROUND DEPTH</div>
    <div class="layer layer-fore" data-depth="0.6">FOREGROUND TITLE</div>
  </div>

  <script>
    const stage = document.getElementById('stage');
    const layers = document.querySelectorAll('.layer');

    stage.addEventListener('mousemove', (e) => {
      const x = (e.clientX - window.innerWidth / 2);
      const y = (e.clientY - window.innerHeight / 2);
      layers.forEach(layer => {
        const depth = parseFloat(layer.getAttribute('data-depth'));
        layer.style.transform = `translate3d(${x * depth}px, ${y * depth}px, 0)`;
      });
    });
  </script>
</body>
</html>
