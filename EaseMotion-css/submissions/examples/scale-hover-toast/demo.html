<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
        name="description"
        content="CSS Scale-Hover Toast for fintech dashboard layouts"
    >
    <title>Scale-Hover Toast</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="demo-page">
        <section class="toast-demo" aria-label="Scale hover toast example">

            <div class="toast" role="status">
                <div class="toast-icon" aria-hidden="true">✓</div>

                <div class="toast-content">
                    <span class="toast-label">Transaction Complete</span>
                    <strong>$2,450.00</strong>
                    <p>Your payment was processed successfully.</p>
                </div>

                <button class="toast-close" type="button" aria-label="Close notification">
                    ×
                </button>
            </div>

            <p class="hint">
                Hover over the notification to see the scale animation.
            </p>

        </section>
    </main>

</body>
</html>
