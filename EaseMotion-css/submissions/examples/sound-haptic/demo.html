<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EaseMotion Sound & Haptic Demo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>EaseMotion Sound & Haptic Hook Demo</h1>
  <button id="clickBtn">Click Sound</button>
  <button id="popBtn">Pop Sound</button>
  <button id="vibrateBtn">Vibrate (200ms)</button>

  <script src="sound.js"></script>
  <script>
    document.getElementById('clickBtn').addEventListener('click', () => {
      window.EaseMotionSound.click();
    });
    document.getElementById('popBtn').addEventListener('click', () => {
      window.EaseMotionSound.pop();
    });
    document.getElementById('vibrateBtn').addEventListener('click', () => {
      window.EaseMotionSound.haptic(200);
    });
  </script>
</body>
</html>
