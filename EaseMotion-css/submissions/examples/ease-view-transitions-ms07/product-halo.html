<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Halo Smartwatch — EaseMotion CSS View Transitions</title>
<link rel="stylesheet" href="style.css">
<style>
  @view-transition {
    navigation: auto;
  }
</style>
</head>
<body>

  <main class="em-product-page">

    <a href="demo.html" class="em-back-link">&larr; Back to all products</a>

    <article class="em-product-detail">
      <img
        class="em-product-hero"
        style="view-transition-name: em-vt-halo;"
        src="https://images.unsplash.com/photo-1546435770-a3e426bf472b?w=1200&auto=format&fit=crop&q=80"
        alt="Halo smartwatch with woven band">

      <div class="em-product-info">
        <p class="em-product-eyebrow">Wearable Tech</p>
        <h1 class="em-product-name">Halo Smartwatch</h1>
        <p class="em-product-detail-price">$249</p>
        <p class="em-product-desc">
          A lightweight smartwatch with continuous heart-rate tracking,
          always-on display, and a breathable woven band. Five-day battery
          life means you charge it on your schedule, not its.
        </p>
        <button type="button" class="em-btn em-btn-primary">Add to cart</button>
      </div>
    </article>

  </main>

</body>
</html>
