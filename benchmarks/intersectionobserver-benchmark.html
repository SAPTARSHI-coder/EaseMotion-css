<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>IntersectionObserver Benchmark</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
}

.box{
height:120px;
margin:25px;
background:#4f46e5;
opacity:0;
transform:translateY(50px);
transition:.5s;
}

.box.show{
opacity:1;
transform:none;
}
</style>

</head>

<body>

<script>

for(let i=0;i<300;i++){
    const div=document.createElement("div");
    div.className="box";
    document.body.appendChild(div);
}

const observer=new IntersectionObserver(entries=>{
    entries.forEach(entry=>{
        if(entry.isIntersecting){
            entry.target.classList.add("show");
        }
    });
});

document.querySelectorAll(".box").forEach(el=>observer.observe(el));

</script>

<script src="intersectionobserver-benchmark.js"></script>

</body>
</html>
