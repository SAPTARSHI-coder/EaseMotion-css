<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animated Pricing Card - EaseMotion CSS</title>
  
  <!-- EaseMotion CSS CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
  
  <!-- Google Fonts (Inter) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Local Component Styles -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="ease-center">

  <!-- Main Card with hover lift and fade-in entrance -->
  <div class="pricing-card ease-fade-in ease-delay-100 ease-hover-lift">
    
    <!-- Popular Badge with bounce animation -->
    <div class="pricing-card__badge ease-bounce ease-delay-300">
      Most Popular
    </div>

    <!-- Header -->
    <div class="pricing-card__header ease-slide-up ease-delay-200">
      <h3 class="pricing-card__title">Pro Plan</h3>
      <p class="pricing-card__subtitle">For growing teams and startups</p>
    </div>

    <!-- Price -->
    <div class="pricing-card__price ease-slide-up ease-delay-300">
      <span class="pricing-card__currency">$</span>
      <span class="pricing-card__amount">29</span>
      <span class="pricing-card__period">/month</span>
    </div>

    <!-- Features List (Staggered) -->
    <ul class="pricing-card__features">
      <li class="pricing-card__feature ease-slide-up ease-delay-400">
        <svg class="check-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"></polyline></svg>
        <span>Unlimited Projects</span>
      </li>
      <li class="pricing-card__feature ease-slide-up ease-delay-500">
        <svg class="check-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"></polyline></svg>
        <span>Advanced Analytics</span>
      </li>
      <li class="pricing-card__feature ease-slide-up ease-delay-600">
        <svg class="check-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"></polyline></svg>
        <span>24/7 Priority Support</span>
      </li>
      <li class="pricing-card__feature ease-slide-up ease-delay-700">
        <svg class="check-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"></polyline></svg>
        <span>Custom Domain Integration</span>
      </li>
    </ul>

    <!-- CTA Button -->
    <div class="pricing-card__footer ease-slide-up ease-delay-800">
      <button class="pricing-card__btn ease-hover-grow">Get Started Now</button>
      <p class="pricing-card__guarantee">14-day free trial · No credit card required</p>
    </div>

  </div>

</body>
</html>
