<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive Calendar Widget - EaseMotion CSS</title>
  
  <!-- EaseMotion CSS CDN -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css"
  />
  
  <!-- Custom Styles for this example -->
  <link rel="stylesheet" href="style.css" />
</head>
<body class="ease-min-h-screen ease-bg-gradient-to-br ease-from-slate-900 ease-via-purple-950 ease-to-slate-900 ease-flex ease-items-center ease-justify-center ease-p-8 ease-font-sans">
  
  <main class="ease-w-full ease-max-w-6xl ease-fade-in">
    <div class="ease-text-center ease-mb-8">
      <h1 class="ease-text-4xl ease-font-bold ease-text-white ease-mb-2">Interactive Calendar</h1>
      <p class="ease-text-slate-400">Click on dates to view events</p>
    </div>

    <!-- Calendar Widget -->
    <div class="calendar-widget">
      
      <!-- Calendar Header -->
      <div class="calendar-header">
        <div class="calendar-header__left">
          <h2 class="calendar-header__month" id="currentMonth">July 2026</h2>
          <button class="calendar-header__today-btn" id="todayBtn">Today</button>
        </div>
        <div class="calendar-header__right">
          <button class="calendar-nav-btn" id="prevMonth" aria-label="Previous month">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
          </button>
          <button class="calendar-nav-btn" id="nextMonth" aria-label="Next month">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
          </button>
          <div class="calendar-view-toggle">
            <button class="view-btn view-btn--active" data-view="month">Month</button>
            <button class="view-btn" data-view="week">Week</button>
          </div>
        </div>
      </div>

      <!-- Calendar Body -->
      <div class="calendar-body">
        
        <!-- Weekday Headers -->
        <div class="calendar-weekdays">
          <div class="weekday">Sun</div>
          <div class="weekday">Mon</div>
          <div class="weekday">Tue</div>
          <div class="weekday">Wed</div>
          <div class="weekday">Thu</div>
          <div class="weekday">Fri</div>
          <div class="weekday">Sat</div>
        </div>

        <!-- Calendar Grid -->
        <div class="calendar-grid" id="calendarGrid">
          <!-- Days will be generated by JavaScript -->
        </div>

      </div>

      <!-- Event Details Panel -->
      <div class="event-panel" id="eventPanel">
        <div class="event-panel__header">
          <div class="event-panel__date">
            <span class="event-panel__day" id="selectedDay">25</span>
            <div class="event-panel__date-info">
              <span class="event-panel__weekday" id="selectedWeekday">Saturday</span>
              <span class="event-panel__full-date" id="selectedFullDate">July 25, 2026</span>
            </div>
          </div>
          <button class="event-panel__add-btn" id="addEventBtn" aria-label="Add event">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
          </button>
        </div>
        
        <div class="event-panel__body" id="eventList">
          <!-- Events will be populated here -->
        </div>

        <div class="event-panel__footer">
          <button class="event-panel__view-all" id="viewAllBtn">View All Events</button>
        </div>
      </div>

    </div>

    <!-- Mini Calendar (Sidebar) -->
    <div class="mini-calendar-widget ease-fade-in ease-delay-200">
      <h3 class="mini-calendar__title">Upcoming Events</h3>
      <div class="mini-calendar__list" id="upcomingEvents">
        <!-- Upcoming events will be listed here -->
      </div>
    </div>

  </main>

  <!-- Add Event Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <div class="modal__header">
        <h3 class="modal__title">Add New Event</h3>
        <button class="modal__close" id="modalClose" aria-label="Close modal">×</button>
      </div>
      <div class="modal__body">
        <div class="form-group">
          <label class="form-label">Event Title</label>
          <input type="text" class="form-input" id="eventTitle" placeholder="Enter event title" />
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Start Time</label>
            <input type="time" class="form-input" id="eventStartTime" value="09:00" />
          </div>
          <div class="form-group">
            <label class="form-label">End Time</label>
            <input type="time" class="form-input" id="eventEndTime" value="10:00" />
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Category</label>
          <div class="category-selector">
            <button class="category-btn category-btn--meeting" data-category="meeting">Meeting</button>
            <button class="category-btn category-btn--personal" data-category="personal">Personal</button>
            <button class="category-btn category-btn--work" data-category="work">Work</button>
            <button class="category-btn category-btn--important" data-category="important">Important</button>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Description</label>
          <textarea class="form-textarea" id="eventDescription" placeholder="Add description (optional)"></textarea>
        </div>
      </div>
      <div class="modal__footer">
        <button class="modal-btn modal-btn--secondary" id="cancelBtn">Cancel</button>
        <button class="modal-btn modal-btn--primary" id="saveEventBtn">Save Event</button>
      </div>
    </div>
  </div>

  <script>
    // Interactive Calendar Widget
    class CalendarWidget {
      constructor() {
        this.currentDate = new Date(2026, 6, 25); // July 25, 2026
        this.selectedDate = new Date(2026, 6, 25);
        this.currentView = 'month';
        
        this.events = {
          '2026-07-25': [
            { title: 'Team Standup', time: '09:00 - 09:30', category: 'meeting' },
            { title: 'Project Review', time: '14:00 - 15:30', category: 'work' }
          ],
          '2026-07-26': [
            { title: 'Client Call', time: '11:00 - 12:00', category: 'meeting' }
          ],
          '2026-07-28': [
            { title: 'Birthday Party', time: '18:00 - 22:00', category: 'personal' }
          ],
          '2026-07-30': [
            { title: 'Product Launch', time: '10:00 - 12:00', category: 'important' },
            { title: 'Team Lunch', time: '13:00 - 14:00', category: 'personal' }
          ],
          '2026-08-02': [
            { title: 'Sprint Planning', time: '10:00 - 11:30', category: 'work' }
          ],
          '2026-08-05': [
            { title: 'Dentist Appointment', time: '15:00 - 16:00', category: 'personal' }
          ]
        };
        
        this.selectedCategory = 'meeting';
        
        this.init();
      }
      
      init() {
        this.renderCalendar();
        this.attachEventListeners();
        this.updateEventPanel();
        this.updateUpcomingEvents();
      }
      
      renderCalendar() {
        const grid = document.getElementById('calendarGrid');
        grid.innerHTML = '';
        
        const year = this.currentDate.getFullYear();
        const month = this.currentDate.getMonth();
        
        // Update header
        const monthNames = ['January', 'February', 'March', 'April', 'May', 'June',
                           'July', 'August', 'September', 'October', 'November', 'December'];
        document.getElementById('currentMonth').textContent = `${monthNames[month]} ${year}`;
        
        // Get first day of month and number of days
        const firstDay = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const daysInPrevMonth = new Date(year, month, 0).getDate();
        
        // Previous month's days
        for (let i = firstDay - 1; i >= 0; i--) {
          const day = daysInPrevMonth - i;
          const dayEl = this.createDayElement(day, 'prev-month', new Date(year, month - 1, day));
          grid.appendChild(dayEl);
        }
        
        // Current month's days
        const today = new Date(2026, 6, 25); // Simulated today
        for (let day = 1; day <= daysInMonth; day++) {
          const date = new Date(year, month, day);
          const isToday = date.toDateString() === today.toDateString();
          const isSelected = date.toDateString() === this.selectedDate.toDateString();
          const dayEl = this.createDayElement(day, 'current-month', date, isToday, isSelected);
          grid.appendChild(dayEl);
        }
        
        // Next month's days
        const totalCells = grid.children.length;
        const remainingCells = 42 - totalCells; // 6 rows × 7 days
        for (let day = 1; day <= remainingCells; day++) {
          const dayEl = this.createDayElement(day, 'next-month', new Date(year, month + 1, day));
          grid.appendChild(dayEl);
        }
      }
      
      createDayElement(day, type, date, isToday = false, isSelected = false) {
        const dayEl = document.createElement('div');
        dayEl.className = `calendar-day calendar-day--${type}`;
        
        if (isToday) dayEl.classList.add('calendar-day--today');
        if (isSelected) dayEl.classList.add('calendar-day--selected');
        if (date.getDay() === 0 || date.getDay() === 6) {
          dayEl.classList.add('calendar-day--weekend');
        }
        
        const dateStr = this.formatDate(date);
        const hasEvents = this.events[dateStr] && this.events[dateStr].length > 0;
        
        dayEl.innerHTML = `
          <span class="calendar-day__number">${day}</span>
          ${hasEvents ? `<div class="calendar-day__events">
            ${this.events[dateStr].slice(0, 3).map(event => 
              `<div class="calendar-day__event-dot calendar-day__event-dot--${event.category}"></div>`
            ).join('')}
          </div>` : ''}
        `;
        
        dayEl.addEventListener('click', () => this.selectDate(date));
        
        return dayEl;
      }
      
      selectDate(date) {
        this.selectedDate = date;
        this.renderCalendar();
        this.updateEventPanel();
      }
      
      updateEventPanel() {
        const dateStr = this.formatDate(this.selectedDate);
        const events = this.events[dateStr] || [];
        
        // Update header
        const dayNames = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
        const monthNames = ['January', 'February', 'March', 'April', 'May', 'June',
                           'July', 'August', 'September', 'October', 'November', 'December'];
        
        document.getElementById('selectedDay').textContent = this.selectedDate.getDate();
        document.getElementById('selectedWeekday').textContent = dayNames[this.selectedDate.getDay()];
        document.getElementById('selectedFullDate').textContent = 
          `${monthNames[this.selectedDate.getMonth()]} ${this.selectedDate.getDate()}, ${this.selectedDate.getFullYear()}`;
        
        // Update event list
        const eventList = document.getElementById('eventList');
        
        if (events.length === 0) {
          eventList.innerHTML = `
            <div class="event-panel__empty">
              <div class="event-panel__empty-icon">📅</div>
              <p class="event-panel__empty-text">No events scheduled</p>
              <p class="event-panel__empty-hint">Click + to add an event</p>
            </div>
          `;
        } else {
          eventList.innerHTML = events.map(event => `
            <div class="event-item event-item--${event.category}">
              <div class="event-item__time">${event.time}</div>
              <div class="event-item__content">
                <h4 class="event-item__title">${event.title}</h4>
                <span class="event-item__category">${event.category}</span>
              </div>
            </div>
          `).join('');
        }
      }
      
      updateUpcomingEvents() {
        const upcoming = [];
        const today = new Date(2026, 6, 25);
        
        // Get events for next 7 days
        for (let i = 0; i < 7; i++) {
          const date = new Date(today);
          date.setDate(today.getDate() + i);
          const dateStr = this.formatDate(date);
          
          if (this.events[dateStr]) {
            this.events[dateStr].forEach(event => {
              upcoming.push({
                ...event,
                date: date,
                dateStr: dateStr
              });
            });
          }
        }
        
        const upcomingList = document.getElementById('upcomingEvents');
        upcomingList.innerHTML = upcoming.slice(0, 5).map(event => {
          const dayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
          const monthNames = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun',
                             'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
          
          return `
            <div class="upcoming-event upcoming-event--${event.category}">
              <div class="upcoming-event__date">
                <span class="upcoming-event__day">${event.date.getDate()}</span>
                <span class="upcoming-event__month">${monthNames[event.date.getMonth()]}</span>
              </div>
              <div class="upcoming-event__content">
                <h4 class="upcoming-event__title">${event.title}</h4>
                <p class="upcoming-event__time">
                  ${dayNames[event.date.getDay()]} • ${event.time}
                </p>
              </div>
            </div>
          `;
        }).join('');
      }
      
      formatDate(date) {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, '0');
        const day = String(date.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
      }
      
      changeMonth(direction) {
        this.currentDate.setMonth(this.currentDate.getMonth() + direction);
        this.renderCalendar();
      }
      
      goToToday() {
        this.currentDate = new Date(2026, 6, 25);
        this.selectedDate = new Date(2026, 6, 25);
        this.renderCalendar();
        this.updateEventPanel();
      }
      
      attachEventListeners() {
        document.getElementById('prevMonth').addEventListener('click', () => this.changeMonth(-1));
        document.getElementById('nextMonth').addEventListener('click', () => this.changeMonth(1));
        document.getElementById('todayBtn').addEventListener('click', () => this.goToToday());
        
        // View toggle
        document.querySelectorAll('.view-btn').forEach(btn => {
          btn.addEventListener('click', (e) => {
            document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('view-btn--active'));
            e.target.classList.add('view-btn--active');
            this.currentView = e.target.dataset.view;
          });
        });
        
        // Category selector
        document.querySelectorAll('.category-btn').forEach(btn => {
          btn.addEventListener('click', (e) => {
            document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('category-btn--selected'));
            e.target.classList.add('category-btn--selected');
            this.selectedCategory = e.target.dataset.category;
          });
        });
        
        // Modal
        document.getElementById('addEventBtn').addEventListener('click', () => this.openModal());
        document.getElementById('modalClose').addEventListener('click', () => this.closeModal());
        document.getElementById('cancelBtn').addEventListener('click', () => this.closeModal());
        document.getElementById('saveEventBtn').addEventListener('click', () => this.saveEvent());
        
        document.getElementById('modalOverlay').addEventListener('click', (e) => {
          if (e.target.id === 'modalOverlay') this.closeModal();
        });
      }
      
      openModal() {
        document.getElementById('modalOverlay').classList.add('modal-overlay--visible');
      }
      
      closeModal() {
        document.getElementById('modalOverlay').classList.remove('modal-overlay--visible');
        document.getElementById('eventTitle').value = '';
        document.getElementById('eventDescription').value = '';
      }
      
      saveEvent() {
        const title = document.getElementById('eventTitle').value.trim();
        if (!title) {
          alert('Please enter an event title');
          return;
        }
        
        const startTime = document.getElementById('eventStartTime').value;
        const endTime = document.getElementById('eventEndTime').value;
        const dateStr = this.formatDate(this.selectedDate);
        
        const newEvent = {
          title: title,
          time: `${startTime} - ${endTime}`,
          category: this.selectedCategory
        };
        
        if (!this.events[dateStr]) {
          this.events[dateStr] = [];
        }
        this.events[dateStr].push(newEvent);
        
        this.closeModal();
        this.renderCalendar();
        this.updateEventPanel();
        this.updateUpcomingEvents();
      }
    }
    
    // Initialize calendar
    const calendar = new CalendarWidget();
  </script>
</body>
</html>
