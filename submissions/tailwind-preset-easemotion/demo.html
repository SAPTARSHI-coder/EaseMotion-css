<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EaseMotion Tailwind Demo</title>
  <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col items-center justify-center p-8">
  <header class="text-center mb-12">
    <h1 class="text-4xl font-extrabold text-indigo-400 mb-2">EaseMotion Preset Demo</h1>
  </header>
  <main class="w-full max-w-sm mx-auto">
    <div class="bg-gray-800 p-6 rounded-xl text-center shadow-lg border border-gray-700">
      <h3 class="text-xl font-bold mb-4">Bounce Utility</h3>
      <div class="w-16 h-16 bg-indigo-500 rounded-full mx-auto mb-6 animate-bounce"></div>
      <code class="bg-black px-2 py-1 rounded text-sm text-pink-400">animate-em-bounce</code>
    </div>
  </main>
</body>
</html>
