<!DOCTYPE html>
<html lang="en" data-theme="dark">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Navbar-theme</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
        <link rel="stylesheet" href="style.css">
        
    </head>
    <body>
        <nav id="nav-theme">
            <div class="logo mode ">EaseMotion</div>
            <div class="options">
                
                <ul>
                    <li><a href="#" class="mode">Buttons</a></li>
                    <li><a href="#" class="mode">Cards</a></li>
                    <li><a href="#" class="mode">Animations</a></li>
                    <li><a href="#" class="mode">Layout</a></li>
                    <li><a href="#" class="mode">Docs</a></li>
                </ul>
                <button id="theme-btn">
                    light mode
                </button>
                    
            </div>
        </nav>
        <script>
          const themeBtn = document.getElementById('theme-btn');
const rootHtml = document.documentElement;
let mode = "dark";

themeBtn.addEventListener('click', () => {
    // 1. Read current active attribute state
    const currentTheme = rootHtml.getAttribute('data-theme');
    
    // 2. Determine opposing state swap
    const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
    
    // 3. Mutate root selector state
    rootHtml.setAttribute('data-theme', newTheme);
    
    // 4. Update button text content dynamically
    themeBtn.textContent = newTheme === 'dark' ? 'light mode' : 'dark mode';

    if(mode=="dark"){
        mode="light";
       document.getElementById("nav-theme").style.backgroundColor = "#ffffff";
        document.getElementById("nav-theme").style.color = "black";
        let modeBtn = document.querySelectorAll(".mode");
        modeBtn.forEach(ele => {
            ele.style.color = "black";
        });

    }
    else{
        mode="dark";
         document.getElementById("nav-theme").style.backgroundColor = "rgb(14, 14, 54)";
        //  document.getElementById("nav-theme").style.color = "white";
        let modeBtn = document.querySelectorAll(".mode");
        modeBtn.forEach(ele => {
            ele.style.color = "white";
        });

    }
});
        </script>
    </body>
</html>
