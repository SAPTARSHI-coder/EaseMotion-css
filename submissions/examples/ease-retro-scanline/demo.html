<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Scanline · CRT Effect</title>
    <meta name="description" content="Interactive CRT scanline effect with mouse interaction. Vintage retro display with moving scanlines and glow effects.">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="crt-wrapper">
            <div class="crt-screen" id="crtScreen">
                <div class="crt-content">
                    <h1>RETRO</h1>
                    <h2>SCANLINE</h2>
                    <p>move your mouse → interact</p>
                    <div class="crt-grid"></div>
                </div>
                <!-- Scanline overlays -->
                <div class="scanlines"></div>
                <div class="scanline-beam" id="scanlineBeam"></div>
                <div class="crt-vignette"></div>
                <div class="crt-glare"></div>
            </div>
        </div>
        <div class="info">
            <span>📺 CRT SCANLINES</span>
            <small>hover / move → interact</small>
        </div>
        <div class="hint">
            <span>click to toggle scanline speed</span>
        </div>
    </div>
    <script>
        (function() {
            const crtScreen = document.getElementById('crtScreen');
            const scanlineBeam = document.getElementById('scanlineBeam');
            let isFast = false;
            let mouseX = 50;
            let mouseY = 50;

            // ---- Mouse tracking for interactive beam ----
            function handleMouseMove(e) {
                const rect = crtScreen.getBoundingClientRect();
                const x = ((e.clientX - rect.left) / rect.width) * 100;
                const y = ((e.clientY - rect.top) / rect.height) * 100;
                mouseX = Math.min(100, Math.max(0, x));
                mouseY = Math.min(100, Math.max(0, y));
                
                // Update beam position
                scanlineBeam.style.left = mouseX + '%';
                scanlineBeam.style.top = mouseY + '%';
                
                // Update glare reflection
                const glare = document.querySelector('.crt-glare');
                glare.style.background = `radial-gradient(circle at ${mouseX}% ${mouseY}%, rgba(255,255,255,0.08) 0%, transparent 60%)`;
            }

            function handleTouchMove(e) {
                e.preventDefault();
                const touch = e.touches[0];
                const rect = crtScreen.getBoundingClientRect();
                const x = ((touch.clientX - rect.left) / rect.width) * 100;
                const y = ((touch.clientY - rect.top) / rect.height) * 100;
                mouseX = Math.min(100, Math.max(0, x));
                mouseY = Math.min(100, Math.max(0, y));
                
                scanlineBeam.style.left = mouseX + '%';
                scanlineBeam.style.top = mouseY + '%';
                
                const glare = document.querySelector('.crt-glare');
                glare.style.background = `radial-gradient(circle at ${mouseX}% ${mouseY}%, rgba(255,255,255,0.08) 0%, transparent 60%)`;
            }

            // ---- Click to toggle speed ----
            function handleClick() {
                isFast = !isFast;
                const scanlines = document.querySelector('.scanlines');
                if (isFast) {
                    scanlines.style.animationDuration = '0.05s';
                    scanlineBeam.style.animationDuration = '0.3s';
                } else {
                    scanlines.style.animationDuration = '0.1s';
                    scanlineBeam.style.animationDuration = '0.8s';
                }
            }

            // ---- Initial setup ----
            scanlineBeam.style.left = '50%';
            scanlineBeam.style.top = '50%';

            // ---- Event listeners ----
            crtScreen.addEventListener('mousemove', handleMouseMove);
            crtScreen.addEventListener('touchmove', handleTouchMove, { passive: false });
            crtScreen.addEventListener('click', handleClick);

            // ---- Random flicker effect ----
            function addFlicker() {
                const vignette = document.querySelector('.crt-vignette');
                if (Math.random() < 0.02) {
                    vignette.style.opacity = '0.1';
                    setTimeout(() => {
                        vignette.style.opacity = '1';
                    }, 50);
                }
            }
            setInterval(addFlicker, 500);

            console.log('📺 CRT Scanline Effect · move mouse to interact · click to toggle speed');
        })();
    </script>
</body>
</html>
