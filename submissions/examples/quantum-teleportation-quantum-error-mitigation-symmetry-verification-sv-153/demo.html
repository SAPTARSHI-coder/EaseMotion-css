<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Symmetry Verification SV - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css"></head><body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030712; color: #ffffff;">

    <div class="ease-card ease-card-glass sv-container">
        <div class="sv-header">
            <h2>Symmetry Verification</h2>
            <span class="ease-badge ease-badge-success">Quantum Error Mitigation</span>
        </div>
        
        <div class="sv-screen ease-center">
            <div class="sv-flux flux-sv-a"></div>
            <div class="sv-flux flux-sv-b"></div>
            <div class="sv-boundary-ring"></div>
            <div class="sv-core ease-center"></div>
        </div>

        <div class="sv-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Invariance Checks &amp; Subspace Filtering</span>
            <button class="ease-btn ease-btn-success ease-btn-sm ease-hover-grow">Run Symmetry Check</button>
        </div>
    </div></body></html>
