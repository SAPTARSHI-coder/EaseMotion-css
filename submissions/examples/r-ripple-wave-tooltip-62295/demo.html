<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CSS Ripple-Wave Tooltip for Product Catalog Layouts">
  <title>Ripple-Wave Product Tooltip</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="catalog">
    <article class="product-card">
      <div class="product-image">
        <span class="product-badge">NEW</span>

        <button
          class="tooltip-trigger"
          type="button"
          aria-describedby="product-tooltip"
          aria-label="Show product information"
        >
          i
          <span class="ripple ripple-one"></span>
          <span class="ripple ripple-two"></span>
        </button>

        <div class="product-symbol" aria-hidden="true">✦</div>

        <div class="tooltip" id="product-tooltip" role="tooltip">
          <strong>Premium Collection</strong>
          <span>Crafted with lightweight materials.</span>
        </div>
      </div>

      <div class="product-content">
        <p class="category">PRODUCT CATALOG</p>
        <h1>Modern Ceramic Set</h1>
        <p class="description">
          A clean product card with a CSS-only ripple-wave information tooltip.
        </p>

        <div class="product-footer">
          <strong>$48</strong>
          <button class="view-button" type="button">View Product</button>
        </div>
      </div>
    </article>
  </main>
</body>
</html>
