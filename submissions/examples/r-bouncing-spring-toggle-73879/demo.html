<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Pure CSS bouncing spring toggle component"
  >
  <title>Bouncing Spring Toggle</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">
    <section class="toggle-card" aria-labelledby="title">
      <span class="badge">CSS Toggle</span>

      <h1 id="title">Bouncing Spring</h1>

      <p class="description">
        A playful toggle with a smooth spring-like bouncing transition.
      </p>

      <div class="toggle-demo">
        <input
          class="toggle-input"
          type="checkbox"
          id="spring-toggle"
        >

        <label class="toggle" for="spring-toggle">
          <span class="toggle-track">
            <span class="toggle-thumb"></span>
          </span>
          <span class="toggle-label">Enable notifications</span>
        </label>
      </div>

      <p class="hint">
        Click or use the keyboard to toggle
      </p>
    </section>
  </main>

</body>
</html>
