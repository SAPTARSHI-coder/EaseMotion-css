<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Testimonial Rotator - EaseMotion Submission</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="stage">
    <h1 class="page-title">Loved by teams</h1>

    <div class="rotator" id="rotator">
      <figure class="quote active" data-quote="1">
        <blockquote>
          "EaseMotion replaced four separate animation libraries. Our load time dropped by half and the polish went up."
        </blockquote>
        <figcaption>
          <span class="avatar" style="--a:#6366f1;">AM</span>
          <div class="who">
            <strong>Alia Mehra</strong>
            <span>Frontend Lead, Skylight</span>
          </div>
        </figcaption>
      </figure>

      <figure class="quote" data-quote="2">
        <blockquote>
          "The spring presets are the first motion toolkit our designers actually wanted to touch. Ship mode all day."
        </blockquote>
        <figcaption>
          <span class="avatar" style="--a:#ec4899;">RK</span>
          <div class="who">
            <strong>Rohan Khanna</strong>
            <span>Product Designer, Blaze</span>
          </div>
        </figcaption>
      </figure>

      <figure class="quote" data-quote="3">
        <blockquote>
          "Zero dependencies, tree-shaken to 1 kB. It just works in our build with no fighting."
        </blockquote>
        <figcaption>
          <span class="avatar" style="--a:#22c55e;">TN</span>
          <div class="who">
            <strong>Tara Nair</strong>
            <span>Staff Engineer, Nimbus</span>
          </div>
        </figcaption>
      </figure>
    </div>

    <div class="dots" id="dots" role="tablist" aria-label="Testimonials">
      <button class="dot active" data-q="1" aria-label="Testimonial 1"></button>
      <button class="dot" data-q="2" aria-label="Testimonial 2"></button>
      <button class="dot" data-q="3" aria-label="Testimonial 3"></button>
    </div>
  </main>

  <script>
    const quotes = document.querySelectorAll('.quote');
    const dots = document.querySelectorAll('.dot');
    let index = 0;

    function show(i) {
      quotes[index].classList.remove('active');
      dots[index].classList.remove('active');
      index = (i + quotes.length) % quotes.length;
      quotes[index].classList.add('active');
      dots[index].classList.add('active');
    }

    dots.forEach(dot => {
      dot.addEventListener('click', () => show(Number(dot.dataset.q) - 1));
    });

    setInterval(() => show(index + 1), 4000);
  </script>
</body>
</html>
