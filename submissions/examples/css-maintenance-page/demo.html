<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Maintenance Page - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="em-maint-page">
        <div class="em-card" role="region" aria-label="Maintenance Page Showcase">
            <span class="em-card-badge">COMING SOON</span>
            <h1 class="em-card-title">Under Maintenance</h1>
            <p class="em-card-desc">Our platform is currently undergoing scheduled upgrades. We will be back online shortly with exciting new features.</p>
            
            <!-- Pure CSS Countdown Timer Grid -->
            <div class="em-countdown-grid" role="timer" aria-label="Countdown Timer: 12 days, 08 hours, 45 minutes, 30 seconds">
                <div class="em-time-box" tabindex="0">
                    <span class="em-time-num">12</span>
                    <span class="em-time-label">Days</span>
                </div>
                <div class="em-time-box" tabindex="0">
                    <span class="em-time-num">08</span>
                    <span class="em-time-label">Hours</span>
                </div>
                <div class="em-time-box" tabindex="0">
                    <span class="em-time-num">45</span>
                    <span class="em-time-label">Minutes</span>
                </div>
                <div class="em-time-box" tabindex="0">
                    <span class="em-time-num">30</span>
                    <span class="em-time-label">Seconds</span>
                </div>
            </div>

            <a href="#" class="em-card-btn" role="button">Notify Me</a>
        </div>
    </div>
</body>
</html>
