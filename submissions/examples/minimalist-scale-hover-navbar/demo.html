<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Scale-Hover Navbar - Minimalist Tech</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <nav class="scale-navbar">
        <div class="nav-brand">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 22l10-10L12 2z"></path></svg>
            <span>Vertex</span>
        </div>
        
        <!-- Mobile Menu Toggle (Checkbox Hack) -->
        <input type="checkbox" id="mobile-menu-toggle" class="mobile-toggle">
        <label for="mobile-menu-toggle" class="mobile-menu-btn">
            <span></span>
            <span></span>
            <span></span>
        </label>
        
        <ul class="nav-links">
            <li class="nav-item">
                <a href="#" class="nav-link">Overview</a>
                <div class="scale-indicator"></div>
            </li>
            <li class="nav-item">
                <a href="#" class="nav-link active">Features</a>
                <div class="scale-indicator"></div>
            </li>
            <li class="nav-item">
                <a href="#" class="nav-link">Integrations</a>
                <div class="scale-indicator"></div>
            </li>
            <li class="nav-item">
                <a href="#" class="nav-link">Enterprise</a>
                <div class="scale-indicator"></div>
            </li>
        </ul>
        
        <div class="nav-actions">
            <a href="#" class="btn btn-outline">Log In</a>
            <a href="#" class="btn btn-primary">Start Free Trial</a>
        </div>
    </nav>
    
    <!-- Decorative background -->
    <div class="page-content">
        <h1>Welcome to Vertex</h1>
        <p>Hover over the navigation links to see the scale indicator effect. The background utilizes a subtle structural pattern.</p>
    </div>

</body>
</html>
