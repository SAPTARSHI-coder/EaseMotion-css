<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Price Tag Sticker &mdash; EaseMotion CSS Demo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="page-head">
    <p class="kicker">EaseMotion CSS &middot; E-commerce</p>
    <h1>Price Tag Sticker</h1>
    <p class="sub">A handmade price tag that sways gently, string and all.</p>
  </header>
  <main class="stage">
    <div class="pt-tag">
      <div class="pt-string"></div>
      <div class="pt-card">
        <p class="pt-label">SPECIAL PRICE</p>
        <p class="pt-price">$19.99</p>
        <p class="pt-note">While stocks last</p>
        <span class="pt-ribbon">HOT</span>
      </div>
    </div>
  </main>
  <p class="stage-caption">The whole tag rocks back and forth on its string.</p>
  <footer class="page-foot">
    <span>Pure CSS &middot; zero dependencies</span>
    <span>Sway animation</span>
  </footer>
</body>
</html>
