<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Retro Grid Floor - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="ease-retro-wrapper" role="img" aria-label="80s Retro Synthwave Grid Background">
    <div class="ease-retro-sun" aria-hidden="true"></div>
    <div class="ease-retro-grid" aria-hidden="true"></div>
    <div class="ease-scanlines" aria-hidden="true"></div>
  </div>
  <p style="position: absolute; bottom: 1rem; color: #64748b; font-family: system-ui; font-size: 0.875rem; text-align: center;">Infinite 3D motion rendered natively via CSS <code>perspective</code>, <code>rotateX</code>, and animated background positions.<br>Zero WebGL. Zero JS.</p>
</body>
</html>
