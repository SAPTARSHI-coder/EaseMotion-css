<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EaseMotion - Trig Orbit Loader Demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0b0f19;
      color: #e2e8f0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      padding: 2rem;
    }

    .demo-header {
      text-align: center;
    }

    .demo-header h1 {
      font-size: 2rem;
      font-weight: 700;
      background: linear-gradient(135deg, #00ffcc 0%, #0099ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
    }

    .demo-header p {
      color: #94a3b8;
      font-size: 1rem;
    }

    .demo-card {
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 3rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(10px);
    }
  </style>
</head>
<body>

  <div class="demo-header">
    <h1>ease-trig-orbit Loader</h1>
    <p>Pure CSS Orbital Loader utilizing modern trigonometric sin() &amp; cos() functions</p>
  </div>

  <div class="demo-card">
    <div class="ease-trig-orbit">
      <div class="ease-trig-dot" style="--offset: 0deg;"></div>
      <div class="ease-trig-dot" style="--offset: 90deg;"></div>
      <div class="ease-trig-dot" style="--offset: 180deg;"></div>
      <div class="ease-trig-dot" style="--offset: 270deg;"></div>
    </div>
  </div>

</body>
</html>
