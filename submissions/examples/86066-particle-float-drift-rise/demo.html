<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Particle Float Drift Rise</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="demo">
    <section class="hero">
      <h1>Particle Float Drift Rise</h1>

      <p>
        A smooth particle animation that gently drifts horizontally
        while continuously rising and fading.
      </p>

      <div class="particle-field" aria-label="Particle animation demo">
        <span class="particle particle-1 ease-anim-particle-float-drift-rise"></span>
        <span class="particle particle-2 ease-anim-particle-float-drift-rise"></span>
        <span class="particle particle-3 ease-anim-particle-float-drift-rise"></span>
        <span class="particle particle-4 ease-anim-particle-float-drift-rise"></span>
        <span class="particle particle-5 ease-anim-particle-float-drift-rise"></span>
        <span class="particle particle-6 ease-anim-particle-float-drift-rise"></span>
        <span class="particle particle-7 ease-anim-particle-float-drift-rise"></span>
        <span class="particle particle-8 ease-anim-particle-float-drift-rise"></span>
      </div>
    </section>
  </main>
</body>
</html>
