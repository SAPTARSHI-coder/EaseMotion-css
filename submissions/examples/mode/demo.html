<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dark Mode Dual Range Slider Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body style="background-color: #11111b; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0;">

  <div class="range-slider range-slider--dark" role="group" aria-labelledby="slider-label">
    <span id="slider-label" class="range-slider__label">Filter Price Range ($)</span>
    
    <div class="range-slider__track-container">
      <div class="range-slider__track"></div>
      <div id="slider-range" class="range-slider__range" style="left: 20%; right: 30%;"></div>
      
      <input 
        type="range" 
        id="min-input"
        class="range-slider__input range-slider__input--min" 
        min="0" 
        max="100" 
        value="20" 
        step="1"
        aria-label="Minimum Price"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="20"
      />
      
      <input 
        type="range" 
        id="max-input"
        class="range-slider__input range-slider__input--max" 
        min="0" 
        max="100" 
        value="70" 
        step="1"
        aria-label="Maximum Price"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="70"
      />
    </div>

    <div class="range-slider__values" aria-live="polite">
      <span id="min-val">$20</span>
      <span id="max-val">$70</span>
    </div>
  </div>

  <script>
    const minInput = document.getElementById('min-input');
    const maxInput = document.getElementById('max-input');
    const minValDisplay = document.getElementById('min-val');
    const maxValDisplay = document.getElementById('max-val');
    const sliderRange = document.getElementById('slider-range');

    function updateSlider() {
      let minVal = parseInt(minInput.value);
      let maxVal = parseInt(maxInput.value);

      if (minVal > maxVal - 5) {
        if (event.target === minInput) {
          minInput.value = maxVal - 5;
          minVal = maxVal - 5;
        } else {
          maxInput.value = minVal + 5;
          maxVal = minVal + 5;
        }
      }

      minInput.setAttribute('aria-valuenow', minVal);
      maxInput.setAttribute('aria-valuenow', maxVal);

      minValDisplay.textContent = `$${minVal}`;
      maxValDisplay.textContent = `$${maxVal}`;

      const percentMin = (minVal / minInput.max) * 100;
      const percentMax = 100 - (maxVal / maxInput.max) * 100;

      sliderRange.style.left = `${percentMin}%`;
      sliderRange.style.right = `${percentMax}%`;
    }

    minInput.addEventListener('input', updateSlider);
    maxInput.addEventListener('input', updateSlider);
  </script>
</body>
</html>
