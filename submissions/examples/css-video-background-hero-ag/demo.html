<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Video Background Hero - EaseMotion CSS</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="video-hero-ag">
      <video
        class="video-hero-bg-ag"
        autoplay
        loop
        muted
        playsinline
        aria-hidden="true"
        tabindex="-1"
        poster="https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=1920&q=80"
      >
        <source
          src="https://assets.mixkit.co/videos/preview/mixkit-abstract-fast-moving-lines-41565-large.mp4"
          type="video/mp4"
        />
      </video>

      <div class="video-hero-overlay-ag" aria-hidden="true"></div>

      <div class="video-hero-content-ag">
        <span class="video-hero-label-ag">EaseMotion CSS</span>
        <h1 class="video-hero-title-ag">CSS Video Background Hero</h1>
        <p class="video-hero-description-ag">
          A full-screen video background with dark gradient overlay, responsive
          content alignment, and pure CSS entrance animations.
        </p>
        <a href="#demo" class="video-hero-cta-ag">Get Started</a>
      </div>
    </header>
  </body>
</html>
