<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glassmorphism Neumorphism Hybrid Slider - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="ease-slider-wrapper">
    <div class="ease-slider-header">
      <span>Intensity</span>
      <span style="color: #38bdf8;">GPU Accelerated</span>
    </div>
    <input type="range" min="0" max="100" value="50" class="ease-range" aria-label="Intensity Slider">
  </div>
  <p style="position: absolute; bottom: 2rem; color: #64748b; font-size: 0.875rem; text-transform: uppercase; letter-spacing: 1px;">Drag thumb to engage glassmorphic scale</p>
</body>
</html>
