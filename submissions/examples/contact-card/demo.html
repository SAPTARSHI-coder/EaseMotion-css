<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Responsive CSS contact card with avatar and social links"
  >
  <title>CSS Contact Card</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="demo">
    <h1>CSS Contact Card</h1>
    <p>A responsive business contact card built with HTML and CSS.</p>

    <article class="contact-card">
      <div class="avatar" aria-hidden="true">
        SM
      </div>

      <div class="contact-info">
        <h2>Srujana Manda</h2>
        <p class="role">Frontend Developer</p>
        <p class="description">
          Building responsive and accessible web experiences with modern
          frontend technologies.
        </p>

        <div class="social-links" aria-label="Social links">
          <a
            href="#"
            class="social-link"
            aria-label="LinkedIn profile"
          >
            LinkedIn
          </a>

          <a
            href="#"
            class="social-link"
            aria-label="GitHub profile"
          >
            GitHub
          </a>

          <a
            href="#"
            class="social-link"
            aria-label="Email contact"
          >
            Email
          </a>
        </div>
      </div>
    </article>
  </main>

</body>
</html>
