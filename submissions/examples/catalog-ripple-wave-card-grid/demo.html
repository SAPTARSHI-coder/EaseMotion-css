<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Ripple-Wave Card Grid - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="em-catalog-layout">
        <header class="em-catalog-header">
            <span class="em-catalog-badge">CATALOG MODULES</span>
            <h1 class="em-catalog-title">Ripple-Wave Card Grid</h1>
            <p class="em-catalog-subtitle">Showcasing sequential ripple-wave load animations for modern product catalogs.</p>
        </header>

        <div class="em-card-grid">
            <div class="em-product-card em-ripple-item" tabindex="0">
                <div class="em-card-image-wrapper">
                    <div class="em-product-image-placeholder">
                        <span class="em-placeholder-text">NODE // 01</span>
                    </div>
                </div>
                <div class="em-card-content">
                    <span class="em-product-category">HARDWARE</span>
                    <h3 class="em-product-title">Quantum Controller X1</h3>
                    <div class="em-product-footer">
                        <span class="em-product-price">$299.00</span>
                        <a href="#" class="em-product-btn">Details</a>
                    </div>
                </div>
            </div>

            <div class="em-product-card em-ripple-item" tabindex="0">
                <div class="em-card-image-wrapper">
                    <div class="em-product-image-placeholder">
                        <span class="em-placeholder-text">NODE // 02</span>
                    </div>
                </div>
                <div class="em-card-content">
                    <span class="em-product-category">SENSORS</span>
                    <h3 class="em-product-title">Neural Transceiver V2</h3>
                    <div class="em-product-footer">
                        <span class="em-product-price">$449.00</span>
                        <a href="#" class="em-product-btn">Details</a>
                    </div>
                </div>
            </div>

            <div class="em-product-card em-ripple-item" tabindex="0">
                <div class="em-card-image-wrapper">
                    <div class="em-product-image-placeholder">
                        <span class="em-placeholder-text">NODE // 03</span>
                    </div>
                </div>
                <div class="em-card-content">
                    <span class="em-product-category">MODULES</span>
                    <h3 class="em-product-title">Cybernetic Relay Z9</h3>
                    <div class="em-product-footer">
                        <span class="em-product-price">$189.00</span>
                        <a href="#" class="em-product-btn">Details</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
