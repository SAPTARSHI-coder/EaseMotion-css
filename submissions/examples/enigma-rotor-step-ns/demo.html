<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enigma Rotor Step — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Enigma Rotor Step demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Enigma Rotor Step</h1>
      <p class="lede">Enigma rotor stepping at the notch</p>
    </header>

    <section class="ease-enigma-rotor-step" data-demo="enigma-rotor-step" aria-live="polite">
      <div class="ease-enigma-rotor-step__housing">
        <div class="ease-enigma-rotor-step__bezel">
          <div class="ease-enigma-rotor-step__face">
            <div class="ease-enigma-rotor-step__readout">
              <span class="ease-enigma-rotor-step__label">Enigma Rotor Step</span>
              <span class="ease-enigma-rotor-step__value">LIVE</span>
            </div>
            <div class="ease-enigma-rotor-step__motion" aria-hidden="true">
              <span class="ease-enigma-rotor-step__a"></span>
              <span class="ease-enigma-rotor-step__b"></span>
              <span class="ease-enigma-rotor-step__c"></span>
              <span class="ease-enigma-rotor-step__d"></span>
            </div>
            <div class="ease-enigma-rotor-step__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-enigma-rotor-step__controls">
          <button type="button" class="ease-enigma-rotor-step__btn primary">Step</button>
          <button type="button" class="ease-enigma-rotor-step__btn">Hold</button>
          <label class="ease-enigma-rotor-step__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-enigma-rotor-step__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
