<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ease-spotlight-search-sap demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f4f4f5;
      font-family: system-ui, sans-serif;
    }
    .open-btn {
      padding: 12px 22px;
      border-radius: 10px;
      border: 1px solid #e2e8f0;
      background: #fff;
      cursor: pointer;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <button class="open-btn" id="openBtn">Press Ctrl+K or click to search</button>

  <div class="spotlight-sap" id="spotlight">
    <div class="spotlight-box">
      <input type="text" id="spotlightInput" placeholder="Search commands, files, actions...">
      <div class="spotlight-results" id="results"></div>
    </div>
  </div>

  <script>
    const items = ['Open Settings', 'New Document', 'Search Files', 'Toggle Dark Mode', 'View Profile', 'Sign Out'];
    const overlay = document.getElementById('spotlight');
    const input = document.getElementById('spotlightInput');
    const resultsBox = document.getElementById('results');
    const openBtn = document.getElementById('openBtn');

    function renderResults(query) {
      const filtered = items.filter(i => i.toLowerCase().includes(query.toLowerCase()));
      resultsBox.innerHTML = filtered.map(i => `<div class="result-item">${i}</div>`).join('');
    }

    function openSpotlight() {
      overlay.classList.add('open');
      input.value = '';
      renderResults('');
      setTimeout(() => input.focus(), 50);
    }

    function closeSpotlight() {
      overlay.classList.remove('open');
    }

    openBtn.addEventListener('click', openSpotlight);

    document.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
        e.preventDefault();
        openSpotlight();
      }
      if (e.key === 'Escape') closeSpotlight();
    });

    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) closeSpotlight();
    });

    input.addEventListener('input', () => renderResults(input.value));
  </script>

</body>
</html>
