<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gradient Border Card</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="demo-shell">
      <section class="gradient-border-card" aria-labelledby="gbc-title">
        <div class="gradient-border-card__inner">
          <p class="gradient-border-card__eyebrow">Featured</p>
          <h1 id="gbc-title">Gradient border card</h1>
          <p class="gradient-border-card__copy">
            A card with a flowing conic-gradient border that rotates
            continuously around it.
          </p>
          <button type="button" class="gradient-border-card__btn">Learn more</button>
        </div>
      </section>
    </main>
  </body>
</html>
