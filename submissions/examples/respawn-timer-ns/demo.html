<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Respawn Timer | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="respawn-demo-container">
    
    <!-- Respawn Timer Component -->
    <article class="ease-respawn-card" aria-label="Player Respawn Status">
      
      <header class="ease-respawn-header">
        <h2>Eliminated</h2>
        <p>Respawning back into action shortly...</p>
      </header>

      <!-- Circular SVG Progress Timer -->
      <div class="ease-timer-ring-container" role="timer" aria-live="polite" aria-label="Respawn countdown: 10 seconds remaining">
        <svg class="ease-timer-svg" viewBox="0 0 160 160">
          <circle class="ease-timer-track" cx="80" cy="80" r="70"></circle>
          <circle class="ease-timer-progress" cx="80" cy="80" r="70"></circle>
        </svg>

        <div class="ease-timer-content" aria-hidden="true">
          <span class="ease-timer-number"><!-- Uses pseudo-element countdown --></span>
          <span class="ease-timer-label">Secs</span>
        </div>
      </div>

    </article>

  </main>

</body>
</html>
