<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-hourglass-sand-fall demo</title>
</head>
<body>
<div class="hg-app">
  <div class="hg-frame">
    <div class="hg-bulb hg-bulb-top">
      <span class="hg-grain hg-grain-1"></span>
      <span class="hg-grain hg-grain-2"></span>
      <span class="hg-grain hg-grain-3"></span>
      <span class="hg-sand hg-sand-top"></span>
    </div>
    <div class="hg-neck">
      <span class="hg-stream"></span>
    </div>
    <div class="hg-bulb hg-bulb-bottom">
      <span class="hg-sand hg-sand-bottom"></span>
    </div>
  </div>
  <div class="hg-post hg-post-left"></div>
  <div class="hg-post hg-post-right"></div>
  <div class="hg-stand"></div>
  <div class="hg-stamp">TIME</div>
</div>
</body>
</html>
