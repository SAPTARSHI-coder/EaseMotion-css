<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 3D-Flip Hero Section - Minimalist Tech</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="layout-container">
        
        <!-- Controls to re-trigger animation for demo purposes -->
        <div class="controls-wrapper">
            <input type="checkbox" id="trigger-anim" class="trigger-checkbox" checked>
            <label for="trigger-anim" class="btn-trigger">Reload Hero Section</label>
        </div>

        <!-- The Hero Section -->
        <section class="hero-section">
            
            <div class="hero-content">
                <div class="badge flip-3d delay-1">SOC2 Certified</div>
                
                <h1 class="hero-title flip-3d delay-2">
                    Secure Your API with <span class="highlight">Zero Trust</span>
                </h1>
                
                <p class="hero-subtitle flip-3d delay-3">
                    Enforce strict cryptographic identity verification on every request. Our edge network stops malicious actors before they reach your servers.
                </p>
                
                <div class="hero-actions flip-3d delay-4">
                    <button class="btn btn-primary">Get API Key</button>
                    <button class="btn btn-secondary">View Architecture</button>
                </div>
            </div>

            <!-- Abstract minimal tech visual representation -->
            <div class="hero-visual flip-3d delay-5">
                <div class="security-shield">
                    <!-- Rotating 3D Rings -->
                    <div class="ring ring-outer"></div>
                    <div class="ring ring-inner"></div>
                    <!-- Center Lock Icon -->
                    <div class="lock-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                    </div>
                </div>
            </div>

        </section>

    </div>

</body>
</html>
