<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ease-animated-stack-avatar demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f4f4f5;
    }
  </style>
</head>
<body>

  <div class="avatar-stack">
    <div class="avatar" style="z-index:5;">AK</div>
    <div class="avatar" style="z-index:4;">JM</div>
    <div class="avatar" style="z-index:3;">RS</div>
    <div class="avatar" style="z-index:2;">TL</div>
    <div class="avatar more" style="z-index:1;">+6</div>
  </div>

</body>
</html>
