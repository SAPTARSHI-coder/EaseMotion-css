<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animated bar chart pillar — EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <header class="page-head">
      <h1>Animated bar chart pillar</h1>
      <p>A bar chart whose columns grow from 0 to their target height on first paint with a soft ease.</p>
    </header>
    <section class="demo">
      <div class="animatedbarchartpillar"><div class="animatedbarchartpillar-bar" style="--h: 60%"><span>Jan</span></div><div class="animatedbarchartpillar-bar" style="--h: 80%"><span>Feb</span></div><div class="animatedbarchartpillar-bar" style="--h: 45%"><span>Mar</span></div><div class="animatedbarchartpillar-bar" style="--h: 90%"><span>Apr</span></div></div>
    </section>
    <footer class="page-foot">
      <small>Submission folder: <code>submissions/examples/animated-bar-chart-pillar/</code></small>
    </footer>
  </main>
</body>
</html>
