<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Conversation Form - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="em-chat-page">
        <div class="em-card" role="region" aria-label="Conversation Form Showcase" tabindex="0">
            <span class="em-card-badge">INTERACTIVE UI</span>
            <h1 class="em-card-title">Conversation Form</h1>
            <p class="em-card-desc">An interactive chat-style conversational form driven entirely by CSS states and transitions without JavaScript.</p>
            
            <!-- Conversation Form Wrapper -->
            <div class="em-chat-container" role="form" aria-label="Step-by-step chat form">
                <div class="em-chat-bubble em-bot-msg">
                    <p>Hello! What is your name?</p>
                </div>
                
                <div class="em-chat-bubble em-user-msg">
                    <div class="em-simulated-input">
                        <span>John Stewartsson</span>
                        <div class="em-input-status"></div>
                    </div>
                </div>

                <div class="em-chat-bubble em-bot-msg em-msg-delay">
                    <p>Great! How can we help you today?</p>
                </div>
            </div>

            <a href="#" class="em-card-btn" role="button">Restart Conversation</a>
        </div>
    </div>
</body>
</html>
