<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skew-Active Tabs Checkout</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="checkout-container">
        <h1 class="checkout-title">Secure Checkout</h1>
        
        <div class="checkout-tabs" role="tablist">
            <button class="tab completed" role="tab" aria-selected="false">
                <span class="tab-content">
                    <span class="tab-icon">✓</span>
                    <span class="tab-text">Cart</span>
                </span>
            </button>
            <button class="tab completed" role="tab" aria-selected="false">
                <span class="tab-content">
                    <span class="tab-icon">✓</span>
                    <span class="tab-text">Details</span>
                </span>
            </button>
            <button class="tab active" role="tab" aria-selected="true">
                <span class="tab-content">
                    <span class="tab-icon">3</span>
                    <span class="tab-text">Payment</span>
                </span>
            </button>
            <button class="tab" role="tab" aria-selected="false" disabled>
                <span class="tab-content">
                    <span class="tab-icon">4</span>
                    <span class="tab-text">Review</span>
                </span>
            </button>
        </div>

        <div class="checkout-content">
            <div class="mock-form">
                <div class="form-group">
                    <div class="mock-input"></div>
                </div>
                <div class="form-group">
                    <div class="mock-input short"></div>
                    <div class="mock-input short"></div>
                </div>
                <button class="mock-btn">Continue to Review</button>
            </div>
        </div>
    </div>
</body>
</html>
