<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Animated responsive spinner with dark mode styling"
  >
  <title>Animated Dark Mode Spinner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="demo-shell">
    <section class="spinner-card" aria-label="Loading indicator">
      <div class="spinner-wrap">
        <div class="spinner" role="status" aria-label="Loading"></div>

        <div class="spinner-core">
          <span></span>
        </div>
      </div>

      <div class="loading-copy">
        <span class="eyebrow">SYSTEM STATUS</span>
        <h1>Loading<span class="dots">...</span></h1>
        <p>Please wait while your experience is being prepared.</p>
      </div>

      <div class="progress">
        <span class="progress-bar"></span>
      </div>
    </section>
  </main>
</body>
</html>
