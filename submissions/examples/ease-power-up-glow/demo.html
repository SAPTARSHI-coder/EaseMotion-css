<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Power-up Glow · Pulsing Glow Effect</title>
    <meta name="description" content="Interactive power-up glow effect with pulsing animations, color cycling, and magnetic attraction like a video game power-up.">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1 class="title">⚡ POWER-UP</h1>
        <div class="powerup-grid">
            <div class="powerup-item" data-color="red">
                <div class="powerup-core">
                    <span class="powerup-icon">❤️</span>
                </div>
                <div class="powerup-glow"></div>
                <div class="powerup-ring"></div>
                <div class="powerup-pulse"></div>
                <span class="powerup-label">HEALTH</span>
            </div>

            <div class="powerup-item" data-color="blue">
                <div class="powerup-core">
                    <span class="powerup-icon">💧</span>
                </div>
                <div class="powerup-glow"></div>
                <div class="powerup-ring"></div>
                <div class="powerup-pulse"></div>
                <span class="powerup-label">MANA</span>
            </div>

            <div class="powerup-item" data-color="green">
                <div class="powerup-core">
                    <span class="powerup-icon">🌿</span>
                </div>
                <div class="powerup-glow"></div>
                <div class="powerup-ring"></div>
                <div class="powerup-pulse"></div>
                <span class="powerup-label">NATURE</span>
            </div>

            <div class="powerup-item" data-color="gold">
                <div class="powerup-core">
                    <span class="powerup-icon">⭐</span>
                </div>
                <div class="powerup-glow"></div>
                <div class="powerup-ring"></div>
                <div class="powerup-pulse"></div>
                <span class="powerup-label">STAR</span>
            </div>

            <div class="powerup-item" data-color="purple">
                <div class="powerup-core">
                    <span class="powerup-icon">🔮</span>
                </div>
                <div class="powerup-glow"></div>
                <div class="powerup-ring"></div>
                <div class="powerup-pulse"></div>
                <span class="powerup-label">MYSTIC</span>
            </div>

            <div class="powerup-item" data-color="cyan">
                <div class="powerup-core">
                    <span class="powerup-icon">⚡</span>
                </div>
                <div class="powerup-glow"></div>
                <div class="powerup-ring"></div>
                <div class="powerup-pulse"></div>
                <span class="powerup-label">SPEED</span>
            </div>
        </div>
        <div class="info">
            <span>⚡ POWER-UP GLOW</span>
            <small>hover → collect effect</small>
        </div>
        <div class="hint">
            <span>pulsing glow · magnetic attraction · color cycling</span>
        </div>
    </div>
    <script>
        (function() {
            const items = document.querySelectorAll('.powerup-item');
            
            // ---- Track mouse position for magnetic effect ----
            let mouseX = 0, mouseY = 0;
            
            document.addEventListener('mousemove', function(e) {
                mouseX = e.clientX;
                mouseY = e.clientY;
                
                // Update magnetic attraction for each powerup
                items.forEach(item => {
                    const rect = item.getBoundingClientRect();
                    const centerX = rect.left + rect.width / 2;
                    const centerY = rect.top + rect.height / 2;
                    
                    const dx = mouseX - centerX;
                    const dy = mouseY - centerY;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    
                    // Magnetic attraction when mouse is close
                    const maxDist = 200;
                    if (dist < maxDist && !item.classList.contains('collected')) {
                        const strength = 1 - (dist / maxDist);
                        const moveX = dx * strength * 0.08;
                        const moveY = dy * strength * 0.08;
                        
                        // Apply subtle magnetic pull
                        item.style.transform = `translate(${moveX}px, ${moveY}px) scale(${1 + strength * 0.05})`;
                        item.style.transition = 'transform 0.1s ease-out';
                        
                        // Increase glow intensity
                        const glow = item.querySelector('.powerup-glow');
                        const pulse = item.querySelector('.powerup-pulse');
                        glow.style.opacity = 0.6 + strength * 0.4;
                        pulse.style.animationDuration = `${0.5 - strength * 0.3}s`;
                    } else {
                        item.style.transform = '';
                        const glow = item.querySelector('.powerup-glow');
                        const pulse = item.querySelector('.powerup-pulse');
                        glow.style.opacity = '';
                        pulse.style.animationDuration = '';
                    }
                });
            });

            // ---- Click to collect ----
            items.forEach(item => {
                item.addEventListener('click', function(e) {
                    if (this.classList.contains('collected')) return;
                    
                    // Add collected state
                    this.classList.add('collected');
                    
                    // Create burst particles
                    createBurst(e.clientX || window.innerWidth / 2, e.clientY || window.innerHeight / 2, this.dataset.color);
                    
                    // Play power-up sound
                    playPowerUpSound();
                    
                    // Reset after animation
                    setTimeout(() => {
                        this.classList.remove('collected');
                    }, 2000);
                });
            });

            // ---- Create Burst Particles ----
            function createBurst(x, y, color) {
                const colors = {
                    red: '#ff2d55',
                    blue: '#00d4ff',
                    green: '#39ff14',
                    gold: '#ffd700',
                    purple: '#b026ff',
                    cyan: '#00ffcc'
                };
                
                const mainColor = colors[color] || '#ffd700';
                const particleCount = 20;
                
                for (let i = 0; i < particleCount; i++) {
                    const particle = document.createElement('div');
                    const angle = (Math.PI * 2 * i) / particleCount + Math.random() * 0.3;
                    const distance = 60 + Math.random() * 80;
                    const size = 4 + Math.random() * 8;
                    
                    const dx = Math.cos(angle) * distance;
                    const dy = Math.sin(angle) * distance;
                    
                    particle.style.cssText = `
                        position: fixed;
                        width: ${size}px;
                        height: ${size}px;
                        background: ${mainColor};
                        border-radius: 50%;
                        pointer-events: none;
                        z-index: 9999;
                        left: ${x}px;
                        top: ${y}px;
                        box-shadow: 0 0 20px ${mainColor}, 0 0 40px ${mainColor};
                        transition: all 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94);
                        opacity: 1;
                    `;
                    
                    document.body.appendChild(particle);
                    
                    // Trigger animation
                    requestAnimationFrame(() => {
                        particle.style.transform = `translate(${dx}px, ${dy}px) scale(0)`;
                        particle.style.opacity = '0';
                    });
                    
                    // Remove after animation
                    setTimeout(() => {
                        if (particle.parentNode) particle.remove();
                    }, 900);
                }
                
                // Create ring burst
                for (let i = 0; i < 8; i++) {
                    const ring = document.createElement('div');
                    const angle = (Math.PI * 2 * i) / 8;
                    const distance = 40 + Math.random() * 30;
                    
                    ring.style.cssText = `
                        position: fixed;
                        width: 20px;
                        height: 20px;
                        border: 2px solid ${mainColor};
                        border-radius: 50%;
                        pointer-events: none;
                        z-index: 9998;
                        left: ${x - 10}px;
                        top: ${y - 10}px;
                        box-shadow: 0 0 30px ${mainColor}, inset 0 0 30px ${mainColor};
                        transition: all 0.6s ease-out;
                        opacity: 0.8;
                        transform: scale(0);
                    `;
                    
                    document.body.appendChild(ring);
                    
                    requestAnimationFrame(() => {
                        ring.style.transform = `translate(${Math.cos(angle) * distance}px, ${Math.sin(angle) * distance}px) scale(1.5)`;
                        ring.style.opacity = '0';
                    });
                    
                    setTimeout(() => {
                        if (ring.parentNode) ring.remove();
                    }, 700);
                }
            }

            // ---- Power-up Sound Effect ----
            function playPowerUpSound() {
                try {
                    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    const now = audioCtx.currentTime;
                    
                    // Ascending tones for power-up feel
                    const frequencies = [523, 659, 784, 1047]; // C5, E5, G5, C6
                    
                    frequencies.forEach((freq, index) => {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(freq, now + index * 0.08);
                        gain.gain.setValueAtTime(0.2, now + index * 0.08);
                        gain.gain.exponentialRampToValueAtTime(0.01, now + index * 0.08 + 0.15);
                        osc.connect(gain);
                        gain.connect(audioCtx.destination);
                        osc.start(now + index * 0.08);
                        osc.stop(now + index * 0.08 + 0.15);
                    });
                    
                    // Add a shimmer effect
                    const shimmer = audioCtx.createOscillator();
                    const shimmerGain = audioCtx.createGain();
                    shimmer.type = 'sine';
                    shimmer.frequency.setValueAtTime(1568, now);
                    shimmerGain.gain.setValueAtTime(0.05, now);
                    shimmerGain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                    shimmer.connect(shimmerGain);
                    shimmerGain.connect(audioCtx.destination);
                    shimmer.start(now);
                    shimmer.stop(now + 0.3);
                    
                } catch (e) {
                    console.log('Audio not available');
                }
            }

            // ---- Add random floating animation variation ----
            items.forEach((item, index) => {
                const delay = index * 0.2;
                const duration = 2 + Math.random() * 1;
                item.style.animationDelay = `${delay}s`;
                item.style.animationDuration = `${duration}s`;
            });

            console.log('⚡ Power-up Glow · hover for magnetic effect · click to collect');
        })();
    </script>
</body>
</html>
