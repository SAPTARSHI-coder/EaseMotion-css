<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fire Loader · Flickering Flames</title>

    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <div class="card">
        <h2>🔥 Fire Loader</h2>
        <p class="sub">flames flicker and dance</p>

        <!-- === FIRE LOADER === -->
        <div class="fire-container" id="fireContainer">
            <div class="fire-loader">
                <!-- Flame layers -->
                <div class="flame flame-1"></div>
                <div class="flame flame-2"></div>
                <div class="flame flame-3"></div>
                <div class="flame flame-4"></div>
                <div class="flame flame-5"></div>

                <!-- Ember particles -->
                <div class="ember e1"></div>
                <div class="ember e2"></div>
                <div class="ember e3"></div>
                <div class="ember e4"></div>
                <div class="ember e5"></div>
                <div class="ember e6"></div>
                <div class="ember e7"></div>
                <div class="ember e8"></div>

                <!-- Glow -->
                <div class="fire-glow"></div>
            </div>
        </div>

        <p style="margin-top: 2rem; font-size: 0.85rem; color: #64748b;">
            Flickering flames · fiery loading animation
        </p>
    </div>

    <!-- Embedded JavaScript -->
    <script>
        (function() {
            'use strict';

            const container = document.getElementById('fireContainer');

            // Click to restart animation
            container.addEventListener('click', function() {
                const flames = this.querySelectorAll('.flame');
                const embers = this.querySelectorAll('.ember');
                const glow = this.querySelector('.fire-glow');

                flames.forEach(flame => {
                    flame.style.animation = 'none';
                    void flame.offsetWidth;
                    flame.style.animation = '';
                });

                embers.forEach(ember => {
                    ember.style.animation = 'none';
                    void ember.offsetWidth;
                    ember.style.animation = '';
                });

                glow.style.animation = 'none';
                void glow.offsetWidth;
                glow.style.animation = '';

                this.classList.add('click-pulse');
                setTimeout(() => {
                    this.classList.remove('click-pulse');
                }, 300);

                console.log('🔥 Fire loader restarted!');
            });

            // Keyboard accessibility
            container.setAttribute('tabindex', '0');
            container.setAttribute('role', 'button');
            container.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    this.click();
                }
            });

            console.log('🔥 Fire loader initialized!');

        })();
    </script>

</body>
</html>
