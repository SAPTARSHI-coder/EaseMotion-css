<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brutalism Cookie Consent Banner</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="page">
    <h1>Brutalism UI Demo</h1>
    <p>
      This page demonstrates a responsive cookie consent banner designed with a
      bold brutalist aesthetic using pure HTML and CSS.
    </p>
  </main>

  <section class="cookie-banner">
    <div class="cookie-content">
      <h2>🍪 Cookies Required</h2>
      <p>
        We use cookies to improve your browsing experience, personalize content,
        and analyze website traffic.
      </p>
    </div>

    <div class="cookie-actions">
      <button class="btn decline">Decline</button>
      <button class="btn accept">Accept All</button>
    </div>
  </section>

</body>
</html>
