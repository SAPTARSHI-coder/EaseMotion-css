<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Metallic Sheen Widget Variation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <h1>Dashboard Metrics</h1>
      <p class="subtitle">Hover or focus to reveal metallic surface</p>
    </header>

    <main class="dashboard-grid">
      <!-- Widget 1: System Status -->
      <a href="#" class="metallic-widget" aria-labelledby="widget1-title">
        <article>
          <header class="widget-header">
            <h2 id="widget1-title" class="widget-title">System Reliability</h2>
            <div class="status-indicator online" aria-label="Status: Online"></div>
          </header>
          
          <div class="widget-body">
            <div class="primary-metric">99.98<span class="metric-unit">%</span></div>
            <div class="secondary-metric">
              <span class="trend-icon positive" aria-hidden="true">↑</span>
              <span class="trend-value">+0.02%</span>
              <span class="trend-label">vs last month</span>
            </div>
          </div>
          
          <footer class="widget-footer">
            <p>All core services operational</p>
          </footer>
        </article>
      </a>

      <!-- Widget 2: Data Throughput -->
      <a href="#" class="metallic-widget" aria-labelledby="widget2-title">
        <article>
          <header class="widget-header">
            <h2 id="widget2-title" class="widget-title">Data Throughput</h2>
            <div class="status-indicator processing" aria-label="Status: Processing"></div>
          </header>
          
          <div class="widget-body">
            <div class="primary-metric">142<span class="metric-unit">TB/s</span></div>
            <div class="secondary-metric">
              <span class="trend-icon positive" aria-hidden="true">↑</span>
              <span class="trend-value">+12.4%</span>
              <span class="trend-label">vs yesterday</span>
            </div>
          </div>
          
          <footer class="widget-footer">
            <p>Peak load expected in 2 hours</p>
          </footer>
        </article>
      </a>
    </main>
  </div>
</body>
</html>
