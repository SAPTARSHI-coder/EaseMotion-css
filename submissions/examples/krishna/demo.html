<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EaseMotion - Flip Turn Page Book Demo</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0d1117;
      color: #c9d1d9;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }

    .demo-container {
      perspective: 1200px;
      width: 320px;
    }

    .controls {
      margin-bottom: 24px;
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    button {
      background-color: #238636;
      color: #ffffff;
      border: 1px solid rgba(240, 246, 252, 0.1);
      padding: 10px 18px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: #2ea043;
    }

    .book-page {
      background: linear-gradient(135deg, #161b22 0%, #21262d 100%);
      border: 1px solid #30363d;
      border-left: 4px solid #58a6ff;
      border-radius: 4px 12px 12px 4px;
      padding: 24px;
      box-shadow: 0 20px 30px rgba(0, 0, 0, 0.4);
    }

    .page-header {
      font-size: 1.25rem;
      font-weight: 700;
      color: #58a6ff;
      margin-bottom: 8px;
    }

    .page-content {
      font-size: 0.95rem;
      line-height: 1.6;
      color: #8b949e;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>

  <div class="demo-container">
    <div class="controls">
      <button id="turnPageBtn">Turn Page</button>
    </div>

    <div id="pageCard" class="book-page hidden">
      <div class="page-header">Chapter 01</div>
      <div class="page-content">
        Hardware-accelerated 3D transforms mimic physical book pages turning along the spine axis.
      </div>
    </div>
  </div>

  <script>
    const btn = document.getElementById('turnPageBtn');
    const page = document.getElementById('pageCard');

    btn.addEventListener('click', () => {
      page.classList.remove('hidden', 'ease-anim-flip-turn-page-book');
      // Force DOM reflow to restart animation sequence
      void page.offsetWidth;
      page.classList.add('ease-anim-flip-turn-page-book');
    });
  </script>
</body>
</html>
