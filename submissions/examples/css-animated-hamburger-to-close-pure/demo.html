<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Animated Hamburger to Close</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="layout-container">
        
        <header class="section-header">
            <h1 class="title">Hamburger to Close Animation</h1>
            <p class="subtitle">A pure CSS interactive menu icon utilizing a hidden checkbox state to drive smooth transform animations between a hamburger and an 'X'.</p>
        </header>

        <div class="demo-area">
            
            <div class="nav-mockup">
                
                <div class="logo">Brand</div>
                
                <!-- 
                  [TECHNIQUE] The Checkbox Hack for Menu State
                  The input holds the open/closed state.
                  The label acts as the clickable trigger area.
                  The spans inside the label are the animated physical lines.
                -->
                
                <div class="menu-toggle-wrapper">
                    
                    <input type="checkbox" id="menu-toggle" class="menu-checkbox sr-only" aria-hidden="true">
                    
                    <label for="menu-toggle" class="menu-btn" aria-label="Toggle Navigation Menu" role="button" tabindex="0">
                        <span class="line line-top"></span>
                        <span class="line line-middle"></span>
                        <span class="line line-bottom"></span>
                    </label>
                    
                </div>
                
            </div>
            
            <p class="instruction-text">Click the icon above to see the transformation.</p>
            
        </div>
        
    </div>

</body>
</html>
