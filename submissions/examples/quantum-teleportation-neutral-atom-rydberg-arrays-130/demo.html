<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neutral Atom Rydberg Arrays - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css"></head><body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030712; color: #ffffff;">

    <div class="ease-card ease-card-glass rydberg-container">
        <div class="rydberg-header">
            <h2>Neutral Atom Rydberg Arrays</h2>
            <span class="ease-badge ease-badge-warning">Rydberg Blockade QC</span>
        </div>
        
        <div class="rydberg-screen ease-center">
            <div class="rydberg-flux flux-rydberg-a"></div>
            <div class="rydberg-flux flux-rydberg-b"></div>
            <div class="rydberg-boundary-ring"></div>
            <div class="rydberg-core ease-center"></div>
        </div>

        <div class="rydberg-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Rubidium-87 &amp; Optical Tweezers Entanglement</span>
            <button class="ease-btn ease-btn-warning ease-btn-sm ease-hover-grow">Run Rydberg Gate</button>
        </div>
    </div></body></html>
