<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Micro-interactions: Gradient Shimmer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header class="header">
            <h1 class="shimmer-text">Gradient Shimmer</h1>
            <p>Pure CSS hardware-accelerated micro-interactions.</p>
        </header>

        <main class="grid">
            
            <!-- Shimmering Button -->
            <section class="card">
                <h2>Shimmer Button</h2>
                <p>Hover to activate the gradient sweep.</p>
                <div class="component-demo">
                    <button class="btn btn-shimmer">
                        <span>Initiate Sequence</span>
                    </button>
                </div>
            </section>

            <!-- Skeleton Loader -->
            <section class="card">
                <h2>Skeleton Loader</h2>
                <p>Infinite automated shimmer for loading states.</p>
                <div class="component-demo">
                    <div class="skeleton-card">
                        <div class="skeleton-avatar shimmer-bg"></div>
                        <div class="skeleton-content">
                            <div class="skeleton-line title shimmer-bg"></div>
                            <div class="skeleton-line shimmer-bg"></div>
                            <div class="skeleton-line short shimmer-bg"></div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Shimmer Border Card -->
            <section class="card">
                <h2>Shimmer Border</h2>
                <p>A glowing, moving gradient border.</p>
                <div class="component-demo">
                    <div class="shimmer-border-card">
                        <div class="card-inner">
                            <h3>Premium Tier</h3>
                            <p>Unlock all exclusive features.</p>
                        </div>
                    </div>
                </div>
            </section>
            
        </main>
    </div>

</body>
</html>
