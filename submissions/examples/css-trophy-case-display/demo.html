<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Trophy Case Display | EaseMotion CSS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="trophy-case" tabindex="0" aria-label="Trophy Case Display">
    <h1 class="trophy-title">Achievement Showcase</h1>
    <p class="trophy-subtitle">Recognizing milestones and top-tier contributions.</p>
    
    <div class="trophy-grid">
        <div class="trophy-card gold" tabindex="0" aria-label="Gold Trophy: Grand Champion">
            <div class="trophy-icon" aria-hidden="true">🏆</div>
            <h2 class="trophy-name">Grand Champion</h2>
            <p class="trophy-category">First Place</p>
        </div>
        
        <div class="trophy-card silver" tabindex="0" aria-label="Silver Trophy: Elite Finalist">
            <div class="trophy-icon" aria-hidden="true">🥈</div>
            <h2 class="trophy-name">Elite Finalist</h2>
            <p class="trophy-category">Second Place</p>
        </div>
        
        <div class="trophy-card bronze" tabindex="0" aria-label="Bronze Trophy: Vanguard Award">
            <div class="trophy-icon" aria-hidden="true">🥉</div>
            <h2 class="trophy-name">Vanguard Award</h2>
            <p class="trophy-category">Third Place</p>
        </div>
    </div>
</main>

</body>
</html>
