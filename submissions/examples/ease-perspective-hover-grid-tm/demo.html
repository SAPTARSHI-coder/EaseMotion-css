<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Perspective Hover Grid | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="phg-root">
    <h2 class="phg-title">Project Cards</h2>
    <div class="phg-stage">
      <div class="phg-card">
        <span class="phg-icon">&#128187;</span>
        <h3 class="phg-name">Dashboard</h3>
        <p class="phg-desc">Analytics and monitoring dashboard for your application.</p>
      </div>
      <div class="phg-card">
        <span class="phg-icon">&#128269;</span>
        <h3 class="phg-name">Search</h3>
        <p class="phg-desc">Fast full-text search across all your data sources.</p>
      </div>
      <div class="phg-card">
        <span class="phg-icon">&#9889;</span>
        <h3 class="phg-name">Automation</h3>
        <p class="phg-desc">Workflow automation with custom triggers and actions.</p>
      </div>
    </div>
    <p class="phg-sub">Hover over cards to see the 3D perspective tilt effect</p>
  </div>
</body>
</html>
