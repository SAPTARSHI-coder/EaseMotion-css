<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Pure CSS Ribbon Banner Design"
    >

    <title>CSS Ribbon Banner</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="demo">

        <section class="banner-card" aria-labelledby="banner-title">

            <div class="ribbon ribbon-left" aria-hidden="true">
                <span>LIMITED</span>
            </div>

            <div class="banner-content">

                <span class="eyebrow">EaseMotion CSS</span>

                <h1 id="banner-title">
                    Pure CSS Ribbon Banner
                </h1>

                <p>
                    A polished ribbon banner created entirely with
                    HTML and CSS.
                </p>

                <a href="#explore" class="banner-action">
                    Explore Design
                </a>

            </div>

            <div class="ribbon ribbon-right" aria-hidden="true">
                <span>FEATURED</span>
            </div>

        </section>

    </main>

</body>
</html>
