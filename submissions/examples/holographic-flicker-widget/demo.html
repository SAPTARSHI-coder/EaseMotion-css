<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Holographic Flicker dashboard widget built with pure HTML and CSS."
  >
  <title>Holographic Flicker Widget</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">
    <section class="widget" aria-labelledby="widget-title">

      <div class="widget-glow" aria-hidden="true"></div>

      <header class="widget-header">
        <div>
          <p class="eyebrow">SYSTEM MONITOR</p>
          <h1 id="widget-title">Holographic Core</h1>
        </div>

        <div class="status" aria-label="System status: online">
          <span class="status-dot" aria-hidden="true"></span>
          ONLINE
        </div>
      </header>

      <div class="core-display" aria-hidden="true">
        <div class="scan-line"></div>

        <div class="holo-ring ring-one"></div>
        <div class="holo-ring ring-two"></div>
        <div class="holo-ring ring-three"></div>

        <div class="core">
          <span class="core-inner"></span>
          <span class="core-highlight"></span>
        </div>

        <div class="core-label">84%</div>
      </div>

      <div class="metric-section">
        <div>
          <span class="metric-label">System Efficiency</span>
          <strong class="metric-value">84<span>%</span></strong>
        </div>

        <span class="metric-change">+12.4%</span>
      </div>

      <div class="progress" aria-label="System efficiency 84 percent">
        <span class="progress-value"></span>
      </div>

      <div class="stats">
        <article class="stat">
          <span class="stat-icon" aria-hidden="true">◈</span>
          <div>
            <span>Signal</span>
            <strong>98.7%</strong>
          </div>
        </article>

        <article class="stat">
          <span class="stat-icon" aria-hidden="true">◇</span>
          <div>
            <span>Latency</span>
            <strong>18ms</strong>
          </div>
        </article>

        <article class="stat">
          <span class="stat-icon" aria-hidden="true">○</span>
          <div>
            <span>Stability</span>
            <strong>99.2%</strong>
          </div>
        </article>
      </div>

      <button class="action" type="button">
        <span>View System Data</span>
        <span aria-hidden="true">↗</span>
      </button>

    </section>
  </main>

</body>
</html>
