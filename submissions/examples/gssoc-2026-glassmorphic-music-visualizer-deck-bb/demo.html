<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glassmorphic Music Visualizer Deck | EaseMotion CSS Showcase</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <main class="player-wrapper">
    <header class="player-header">
      <span class="pill-tag">GSSoC 2026 Innovation</span>
      <h1 class="main-title">Glassmorphic Audio Visualizer Deck</h1>
      <p class="subtitle">Pure CSS animated spectrum frequency visualizer with spinning vinyl disc, glassmorphic frosted overlay, and dynamic glowing equalizer bars.</p>
    </header>

    <div class="deck-card">
      <div class="vinyl-container">
        <div class="vinyl-disc spinning">
          <div class="vinyl-grooves"></div>
          <div class="vinyl-label">
            <div class="label-center"></div>
          </div>
        </div>
      </div>

      <div class="player-info">
        <span class="track-genre">SYNTHWAVE / AMBIENT</span>
        <h2 class="track-name">Cybernetic Horizons</h2>
        <p class="artist-name">Starlight Echoes</p>
      </div>

      <!-- Real-time Equalizer Bar Visualizer -->
      <div class="visualizer-bars">
        <span class="bar bar-1"></span>
        <span class="bar bar-2"></span>
        <span class="bar bar-3"></span>
        <span class="bar bar-4"></span>
        <span class="bar bar-5"></span>
        <span class="bar bar-6"></span>
        <span class="bar bar-7"></span>
        <span class="bar bar-8"></span>
        <span class="bar bar-9"></span>
        <span class="bar bar-10"></span>
      </div>

      <div class="progress-container">
        <div class="progress-bar">
          <div class="progress-fill"></div>
        </div>
        <div class="time-stamps">
          <span>02:14</span>
          <span>04:30</span>
        </div>
      </div>

      <div class="controls">
        <button class="btn btn-secondary" aria-label="Previous Track">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>
        <button class="btn btn-primary" aria-label="Play Pause">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </button>
        <button class="btn btn-secondary" aria-label="Next Track">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>
      </div>
    </div>
  </main>
</body>
</html>
