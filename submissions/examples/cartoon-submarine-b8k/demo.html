<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="./style.css">
<title>Cartoon Submarine Demo</title>
</head>
<body>
<main class="sub-container" role="main" aria-label="Animated Cartoon Submarine Illustration">
  <div class="sub-card">
    <div class="sub-ocean-stage">
      <div class="sub-bubble sub-bubble-1"></div>
      <div class="sub-bubble sub-bubble-2"></div>
      <div class="sub-bubble sub-bubble-3"></div>
      <div class="sub-submarine-wrapper">
        <div class="sub-periscope"></div>
        <div class="sub-tower"></div>
        <div class="sub-body">
          <div class="sub-porthole sub-porthole-left"></div>
          <div class="sub-porthole sub-porthole-right"></div>
          <div class="sub-propeller"></div>
        </div>
      </div>
      <div class="sub-seaweed sub-seaweed-1"></div>
      <div class="sub-seaweed sub-seaweed-2"></div>
    </div>
    <h1 class="sub-title">Yellow Submarine</h1>
    <p class="sub-description">A playful pure CSS cartoon submarine featuring gentle ocean buoyancy motion, spinning propeller, and rising water bubbles.</p>
  </div>
</main>
</body>
</html>
