<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Scale-Hover Toast</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="container">

    <h1>Scale-Hover Toast</h1>

    <p class="subtitle">
        Modern toast notifications built entirely with HTML and CSS.
    </p>

    <!-- Success Toast -->

    <div
        class="toast success"
        role="status"
        aria-live="polite">

        <div class="toast-icon">
            ✓
        </div>

        <div class="toast-content">

            <h2>Success</h2>

            <p>
                Your changes have been saved successfully.
            </p>

        </div>

    </div>

    <!-- Warning Toast -->

    <div
        class="toast warning"
        role="status"
        aria-live="polite">

        <div class="toast-icon">
            !
        </div>

        <div class="toast-content">

            <h2>Warning</h2>

            <p>
                Your session will expire in 5 minutes.
            </p>

        </div>

    </div>

    <!-- Info Toast -->

    <div
        class="toast info"
        role="status"
        aria-live="polite">

        <div class="toast-icon">
            ℹ
        </div>

        <div class="toast-content">

            <h2>Information</h2>

            <p>
                A new software update is available.
            </p>

        </div>

    </div>

</main>

</body>
</html>
