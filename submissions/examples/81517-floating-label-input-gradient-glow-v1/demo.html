<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Responsive floating label input with gradient glow styling built with pure CSS."
  >

  <title>Gradient Glow Floating Label Input</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="page">
    <section class="input-card" aria-labelledby="page-title">

      <div class="intro">
        <span class="eyebrow">EaseMotion CSS</span>

        <h1 id="page-title">
          Gradient Glow Input
        </h1>

        <p>
          A responsive floating-label field with an animated
          gradient glow, built without JavaScript.
        </p>
      </div>

      <form class="glow-form">

        <div class="glow-field">
          <input
            class="glow-input"
            type="text"
            id="full-name"
            name="full-name"
            placeholder=" "
            autocomplete="name"
            required
          >

          <label class="glow-label" for="full-name">
            Full name
          </label>

          <span class="glow-border" aria-hidden="true"></span>
        </div>

        <div class="glow-field">
          <input
            class="glow-input"
            type="email"
            id="email"
            name="email"
            placeholder=" "
            autocomplete="email"
            required
          >

          <label class="glow-label" for="email">
            Email address
          </label>

          <span class="glow-border" aria-hidden="true"></span>
        </div>

        <div class="glow-field">
          <input
            class="glow-input"
            type="text"
            id="role"
            name="role"
            placeholder=" "
            autocomplete="organization-title"
          >

          <label class="glow-label" for="role">
            Your role
          </label>

          <span class="glow-border" aria-hidden="true"></span>
        </div>

        <div class="glow-field glow-field--message">
          <textarea
            class="glow-input"
            id="message"
            name="message"
            placeholder=" "
            rows="4"
          ></textarea>

          <label class="glow-label" for="message">
            Message
          </label>

          <span class="glow-border" aria-hidden="true"></span>
        </div>

        <button class="glow-button" type="submit">
          <span>Send message</span>
          <span aria-hidden="true">↗</span>
        </button>

      </form>

      <p class="helper">
        Pure CSS · Responsive · Accessible · No dependencies
      </p>

    </section>
  </main>
</body>
</html>
