<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Sci-Fi HUD: 3D Perspective Tilt</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <div class="hud-perspective-wrapper">
    <!-- Anchor tag to ensure keyboard focusability and interaction -->
    <a href="#" class="hud-tilt-panel" aria-label="System Diagnostics">
      
      <!-- The glass background plate pushed backwards -->
      <div class="hud-plate" aria-hidden="true"></div>

      <!-- Targeting corners pulled forward -->
      <div class="hud-corner corner-tl" aria-hidden="true"></div>
      <div class="hud-corner corner-tr" aria-hidden="true"></div>
      <div class="hud-corner corner-bl" aria-hidden="true"></div>
      <div class="hud-corner corner-br" aria-hidden="true"></div>

      <!-- The main content pulled furthest forward -->
      <div class="hud-content">
        <h2 class="hud-title">Diagnostics</h2>
        
        <div class="hud-data">
          <div class="data-group">
            <div class="data-value">A4</div>
            <div class="data-label">SECTOR</div>
          </div>
          <div class="data-group">
            <div class="data-value" aria-live="polite">99%</div>
            <div class="data-label">INTEGRITY</div>
          </div>
        </div>
      </div>

    </a>
  </div>

</body>
</html>
