<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Flip Horizontal Flip</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">
    <h1>3D Flip Horizontal Flip</h1>
    <p>Hover the card to trigger the animation.</p>

    <div class="flip-container">
      <div class="flip-card ease-anim-3d-flip-horizontal-flip">

        <div class="flip-front">
          <span>FRONT</span>
          <strong>3D Flip</strong>
        </div>

        <div class="flip-back">
          <span>BACK</span>
          <strong>Horizontal Flip</strong>
        </div>

      </div>
    </div>
  </main>

</body>
</html>
