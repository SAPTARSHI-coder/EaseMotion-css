<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elevator Governor Trip — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Elevator Governor Trip demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Elevator Governor Trip</h1>
      <p class="lede">Elevator overspeed governor spinning then tripping</p>
    </header>

    <section class="ease-elevator-governor-trip" data-demo="elevator-governor-trip" aria-live="polite">
      <div class="ease-elevator-governor-trip__housing">
        <div class="ease-elevator-governor-trip__bezel">
          <div class="ease-elevator-governor-trip__face">
            <div class="ease-elevator-governor-trip__readout">
              <span class="ease-elevator-governor-trip__label">Elevator Governor Trip</span>
              <span class="ease-elevator-governor-trip__value">LIVE</span>
            </div>
            <div class="ease-elevator-governor-trip__motion" aria-hidden="true">
              <span class="ease-elevator-governor-trip__a"></span>
              <span class="ease-elevator-governor-trip__b"></span>
              <span class="ease-elevator-governor-trip__c"></span>
              <span class="ease-elevator-governor-trip__d"></span>
            </div>
            <div class="ease-elevator-governor-trip__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-elevator-governor-trip__controls">
          <button type="button" class="ease-elevator-governor-trip__btn primary">Engage</button>
          <button type="button" class="ease-elevator-governor-trip__btn">Reset</button>
          <label class="ease-elevator-governor-trip__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-elevator-governor-trip__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
