<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EaseMotion CSS — Article Text Skeleton Loader Showcase</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="skel-demo-wrapper">
    <header class="skel-header">
      <span class="badge">UI Component Showcase</span>
      <h1>Article Text Skeleton Loader</h1>
      <p>Multi-line article text skeleton loading placeholders featuring linear gradient shimmer sweeps and responsive line widths.</p>
    </header>

    <main class="skel-card">
      <div class="article-skeleton">
        <div class="skel-line skel-heading ease-skeleton-pulse"></div>
        <div class="skel-line skel-subheading ease-skeleton-pulse"></div>

        <div class="skel-paragraph">
          <div class="skel-line ease-skeleton-pulse"></div>
          <div class="skel-line ease-skeleton-pulse"></div>
          <div class="skel-line ease-skeleton-pulse"></div>
          <div class="skel-line skel-short ease-skeleton-pulse"></div>
        </div>

        <div class="skel-paragraph">
          <div class="skel-line ease-skeleton-pulse"></div>
          <div class="skel-line ease-skeleton-pulse"></div>
          <div class="skel-line skel-medium ease-skeleton-pulse"></div>
        </div>
      </div>
    </main>

    <footer class="skel-footer">
      <p>EaseMotion CSS Component &bull; Submitted by @Ishita-Katiyar-06</p>
    </footer>
  </div>
</body>
</html>
