<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retro Floating Modal</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="page">
    <div class="retro-card">
      <span class="badge">RETRO UI</span>

      <h1>Floating Modal</h1>

      <p>
        A responsive retro-style floating modal built using only HTML and CSS.
      </p>

      <a href="#retro-modal" class="open-button">OPEN MODAL</a>
    </div>
  </main>

  <div id="retro-modal" class="modal">
    <div class="modal-content">

      <a href="#" class="close-button" aria-label="Close modal">
        &times;
      </a>

      <span class="modal-label">SYSTEM MESSAGE</span>

      <h2>Welcome!</h2>

      <p>
        This is a floating modal with a retro-inspired design,
        bold borders, shadows and responsive layout.
      </p>

      <a href="#" class="modal-button">GOT IT</a>

    </div>
  </div>

</body>
</html>
