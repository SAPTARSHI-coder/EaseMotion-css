<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Loader: Aurora Glow</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="layout-container">
        
        <header class="section-header">
            <h1 class="title">Pure CSS Loader: Aurora Glow</h1>
            <p class="subtitle">A smooth, hardware-accelerated loader featuring a mesmerizing aurora borealis styling using heavily blurred, spinning conic gradients and CSS masks.</p>
        </header>

        <div class="demo-area">
            
            <div class="loader-container" aria-label="Loading content, aurora glow animation playing">
                
                <!-- 
                  [TECHNIQUE] Aurora Glow Loader
                  The loader consists of overlapping blurred spinning rings.
                  We use CSS mask-image to create the hollow center, and conic-gradients
                  for the multi-colored light effect.
                -->
                <div class="aurora-loader" aria-hidden="true">
                    <!-- The outer, slower, larger glow -->
                    <div class="aurora-ring outer-ring"></div>
                    <!-- The inner, faster, tighter glow -->
                    <div class="aurora-ring inner-ring"></div>
                    <!-- A dark center cover to emphasize the hollow ring effect -->
                    <div class="aurora-center"></div>
                </div>
                
                <div class="loading-text">Loading...</div>
                
            </div>
            
        </div>
        
    </div>

</body>
</html>
