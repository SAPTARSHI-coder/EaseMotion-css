<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Victorian Pattern · Ornate Victorian Design Emerges</title>
    <meta name="description" content="Intricate Victorian pattern emerging with ornate flourishes, filigree details, and symmetrical elegance.">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1 class="title">🏛️ VICTORIAN PATTERN</h1>
        
        <div class="canvas-wrapper">
            <canvas id="victorianCanvas" width="600" height="500"></canvas>
            <div class="glow-overlay"></div>
        </div>

        <div class="controls">
            <div class="button-group">
                <button class="reveal-btn" id="revealBtn">✨ REVEAL</button>
                <button class="reset-btn" id="resetBtn">⟳ RESET</button>
                <button class="toggle-btn" id="toggleBtn">⏸️ PAUSE</button>
            </div>
            <div class="speed-control">
                <label>Speed</label>
                <input type="range" id="speedSlider" min="1" max="10" value="5">
                <span id="speedLabel">5</span>
                <label>Detail</label>
                <input type="range" id="detailSlider" min="1" max="10" value="5">
                <span id="detailLabel">5</span>
            </div>
        </div>

        <div class="info">
            <span>🏛️ VICTORIAN PATTERN</span>
            <small>ornate · filigree · symmetry</small>
        </div>
        <div class="hint">
            <span>✨ click to reveal the intricate Victorian design</span>
        </div>
    </div>

    <script>
        (function() {
            const canvas = document.getElementById('victorianCanvas');
            const ctx = canvas.getContext('2d');
            const W = 600, H = 500;
            
            const revealBtn = document.getElementById('revealBtn');
            const resetBtn = document.getElementById('resetBtn');
            const toggleBtn = document.getElementById('toggleBtn');
            const speedSlider = document.getElementById('speedSlider');
            const speedLabel = document.getElementById('speedLabel');
            const detailSlider = document.getElementById('detailSlider');
            const detailLabel = document.getElementById('detailLabel');

            let isAnimating = true;
            let speed = 5;
            let detail = 5;
            let time = 0;
            let revealProgress = 0;
            let isRevealing = false;
            let isRevealed = false;

            // ---- Victorian Pattern Elements ----
            const elements = [];

            // Generate pattern elements
            function generatePattern() {
                elements.length = 0;
                const cx = W / 2;
                const cy = H / 2;
                
                // Center medallion
                elements.push({ type: 'circle', x: cx, y: cy, r: 40, color: '#8b1a1a', layer: 0 });
                elements.push({ type: 'circle', x: cx, y: cy, r: 30, color: '#d4a853', layer: 1 });
                elements.push({ type: 'circle', x: cx, y: cy, r: 20, color: '#2d5a27', layer: 2 });
                elements.push({ type: 'circle', x: cx, y: cy, r: 10, color: '#d4a853', layer: 3 });
                
                // Radial flourishes
                for (let i = 0; i < 8; i++) {
                    const angle = (i / 8) * Math.PI * 2;
                    const dist = 60;
                    const x = cx + Math.cos(angle) * dist;
                    const y = cy + Math.sin(angle) * dist;
                    elements.push({ type: 'flourish', x: x, y: y, angle: angle, size: 20, color: '#d4a853', layer: 1 });
                }
                
                // Outer ring with ornaments
                for (let i = 0; i < 12; i++) {
                    const angle = (i / 12) * Math.PI * 2;
                    const dist = 100;
                    const x = cx + Math.cos(angle) * dist;
                    const y = cy + Math.sin(angle) * dist;
                    elements.push({ type: 'ornament', x: x, y: y, angle: angle, size: 15, color: '#8b1a1a', layer: 2 });
                }
                
                // Corner flourishes (4 corners)
                const corners = [
                    { x: 60, y: 60, angle: 0 },
                    { x: W - 60, y: 60, angle: Math.PI / 2 },
                    { x: W - 60, y: H - 60, angle: Math.PI },
                    { x: 60, y: H - 60, angle: 3 * Math.PI / 2 }
                ];
                for (let c of corners) {
                    elements.push({ type: 'corner', x: c.x, y: c.y, angle: c.angle, size: 40, color: '#2d5a27', layer: 1 });
                }
                
                // Decorative arcs
                for (let i = 0; i < 6; i++) {
                    const angle = (i / 6) * Math.PI * 2;
                    const dist = 140;
                    const x = cx + Math.cos(angle) * dist;
                    const y = cy + Math.sin(angle) * dist;
                    elements.push({ type: 'arc', x: x, y: y, angle: angle, size: 25, color: '#d4a853', layer: 3 });
                }
                
                // Small dots along outer edge
                for (let i = 0; i < 24; i++) {
                    const angle = (i / 24) * Math.PI * 2;
                    const dist = 170;
                    const x = cx + Math.cos(angle) * dist;
                    const y = cy + Math.sin(angle) * dist;
                    elements.push({ type: 'dot', x: x, y: y, size: 4, color: '#8b1a1a', layer: 4 });
                }
                
                // Inner decorative rings
                for (let ring = 0; ring < 3; ring++) {
                    const radius = 50 + ring * 20;
                    for (let i = 0; i < 16; i++) {
                        const angle = (i / 16) * Math.PI * 2 + ring * 0.2;
                        const x = cx + Math.cos(angle) * radius;
                        const y = cy + Math.sin(angle) * radius;
                        elements.push({ type: 'dot', x: x, y: y, size: 2 + ring, color: '#d4a853', layer: 2 + ring });
                    }
                }
                
                // Sort by layer
                elements.sort((a, b) => a.layer - b.layer);
            }

            // ---- Draw Element ----
            function drawElement(ctx, el, progress) {
                const p = Math.min(1, progress * 1.5);
                const alpha = Math.min(1, p * 1.2);
                const scale = 0.2 + p * 0.8;
                
                ctx.save();
                ctx.globalAlpha = alpha;
                
                switch(el.type) {
                    case 'circle':
                        ctx.shadowColor = el.color;
                        ctx.shadowBlur = 10 * p;
                        ctx.fillStyle = el.color;
                        ctx.beginPath();
                        ctx.arc(el.x, el.y, el.r * scale, 0, Math.PI * 2);
                        ctx.fill();
                        break;
                        
                    case 'flourish':
                        ctx.translate(el.x, el.y);
                        ctx.rotate(el.angle);
                        ctx.scale(scale, scale);
                        ctx.strokeStyle = el.color;
                        ctx.lineWidth = 2;
                        ctx.shadowColor = el.color;
                        ctx.shadowBlur = 5 * p;
                        // Spiral flourish
                        ctx.beginPath();
                        for (let i = 0; i < 20; i++) {
                            const t = i / 20;
                            const r = t * 15;
                            const a = t * Math.PI * 4;
                            const px = Math.cos(a) * r;
                            const py = Math.sin(a) * r;
                            if (i === 0) ctx.moveTo(px, py);
                            else ctx.lineTo(px, py);
                        }
                        ctx.stroke();
                        break;
                        
                    case 'ornament':
                        ctx.translate(el.x, el.y);
                        ctx.rotate(el.angle);
                        ctx.scale(scale, scale);
                        ctx.fillStyle = el.color;
                        ctx.shadowColor = el.color;
                        ctx.shadowBlur = 5 * p;
                        // Teardrop ornament
                        ctx.beginPath();
                        ctx.moveTo(0, -10);
                        ctx.quadraticCurveTo(10, -5, 8, 5);
                        ctx.quadraticCurveTo(0, 12, -8, 5);
                        ctx.quadraticCurveTo(-10, -5, 0, -10);
                        ctx.fill();
                        break;
                        
                    case 'corner':
                        ctx.translate(el.x, el.y);
                        ctx.rotate(el.angle);
                        ctx.scale(scale, scale);
                        ctx.strokeStyle = el.color;
                        ctx.lineWidth = 2;
                        ctx.shadowColor = el.color;
                        ctx.shadowBlur = 5 * p;
                        // Corner flourish
                        ctx.beginPath();
                        ctx.moveTo(0, 0);
                        ctx.quadraticCurveTo(15, -10, 30, -5);
                        ctx.quadraticCurveTo(35, -15, 40, 0);
                        ctx.stroke();
                        ctx.beginPath();
                        ctx.moveTo(0, 0);
                        ctx.quadraticCurveTo(-10, 15, -5, 30);
                        ctx.quadraticCurveTo(-15, 35, 0, 40);
                        ctx.stroke();
                        break;
                        
                    case 'arc':
                        ctx.translate(el.x, el.y);
                        ctx.rotate(el.angle);
                        ctx.scale(scale, scale);
                        ctx.strokeStyle = el.color;
                        ctx.lineWidth = 1.5;
                        ctx.shadowColor = el.color;
                        ctx.shadowBlur = 5 * p;
                        ctx.beginPath();
                        ctx.arc(0, 0, el.size, -0.8, 0.8);
                        ctx.stroke();
                        ctx.beginPath();
                        ctx.arc(0, 0, el.size * 0.7, -0.6, 0.6);
                        ctx.stroke();
                        break;
                        
                    case 'dot':
                        ctx.shadowColor = el.color;
                        ctx.shadowBlur = 8 * p;
                        ctx.fillStyle = el.color;
                        ctx.beginPath();
                        ctx.arc(el.x, el.y, el.size * (0.3 + p * 0.7), 0, Math.PI * 2);
                        ctx.fill();
                        break;
                }
                
                ctx.restore();
            }

            // ---- Reveal ----
            function revealPattern() {
                if (isRevealing) return;
                isRevealing = true;
                isRevealed = false;
                revealProgress = 0;
                generatePattern();
            }

            // ---- Reset ----
            function resetPattern() {
                isRevealing = false;
                isRevealed = false;
                revealProgress = 0;
                generatePattern();
                render();
            }

            // ---- Render ----
            function render() {
                // Background
                const bgGrad = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, W);
                bgGrad.addColorStop(0, '#1a0a0a');
                bgGrad.addColorStop(0.3, '#0d0a0a');
                bgGrad.addColorStop(0.6, '#0a0808');
                bgGrad.addColorStop(0.8, '#080606');
                bgGrad.addColorStop(1, '#040202');
                ctx.fillStyle = bgGrad;
                ctx.fillRect(0, 0, W, H);
                
                // Draw all elements with progress
                const progress = Math.min(1, revealProgress);
                for (let el of elements) {
                    drawElement(ctx, el, progress);
                }
                
                // Status info
                ctx.save();
                ctx.fillStyle = 'rgba(200, 180, 160, 0.2)';
                ctx.font = '13px monospace';
                ctx.textAlign = 'right';
                ctx.textBaseline = 'bottom';
                ctx.fillText(`Elements: ${elements.length}`, W - 20, H - 10);
                
                ctx.textAlign = 'left';
                const status = isRevealed ? '✨ REVEALED' : 
                              isRevealing ? '🔄 REVEALING...' : 
                              '🏛️ READY';
                ctx.fillText(status, 20, H - 10);
                ctx.restore();
            }

            // ---- Animation Loop ----
            function animate() {
                if (!isAnimating) {
                    requestAnimationFrame(animate);
                    return;
                }
                
                time += 0.01;
                
                if (isRevealing && revealProgress < 1) {
                    revealProgress += 0.003 * (speed / 5);
                    if (revealProgress > 1) {
                        revealProgress = 1;
                        isRevealing = false;
                        isRevealed = true;
                    }
                }
                
                render();
                
                requestAnimationFrame(animate);
            }

            // ---- Toggle Animation ----
            function toggleAnimation() {
                isAnimating = !isAnimating;
                toggleBtn.textContent = isAnimating ? '⏸️ PAUSE' : '▶️ PLAY';
            }

            // ---- Update Labels ----
            speedSlider.addEventListener('input', function() {
                speedLabel.textContent = this.value;
            });
            detailSlider.addEventListener('input', function() {
                detail = parseInt(this.value);
                detailLabel.textContent = detail;
                generatePattern();
                render();
            });

            // ---- Event Listeners ----
            revealBtn.addEventListener('click', revealPattern);
            resetBtn.addEventListener('click', resetPattern);
            toggleBtn.addEventListener('click', toggleAnimation);

            // ---- Keyboard Shortcuts ----
            document.addEventListener('keydown', function(e) {
                if (e.key === ' ' || e.key === 'Space') {
                    e.preventDefault();
                    if (!isRevealing && !isRevealed) {
                        revealPattern();
                    }
                }
                if (e.key === 'r' || e.key === 'R') {
                    resetPattern();
                }
                if (e.key === 'p' || e.key === 'P') {
                    toggleAnimation();
                }
            });

            // ---- Initialize ----
            generatePattern();
            render();
            animate();

            console.log('🏛️ Victorian Pattern · Click Reveal to see the ornate design emerge!');
        })();
    </script>
</body>
</html>
