<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hermetic Seal Clamp</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <main class="demo">
    <h1>Hermetic Seal Clamp</h1>
    <p>Vacuum flange sealing control interface</p>

    <section class="ease-hermetic-seal-clamp">

      <div class="control-panel">
        <span>LAB SEAL SYSTEM</span>
        <small>VACUUM MODE: ACTIVE</small>
      </div>

      <div class="clamp-housing">

        <div class="flange">
          <div class="seal-ring"></div>
        </div>

        <div class="clamp-arm left"></div>
        <div class="clamp-arm right"></div>

        <div class="pressure-light"></div>

      </div>

      <div class="status">
        <span>PRESSURE</span>
        <strong>99.8%</strong>
      </div>

    </section>

  </main>

</body>
</html>
