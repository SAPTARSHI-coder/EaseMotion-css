<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Drawer Gradient Glow</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <input type="checkbox" id="gg-drawer-toggle" class="gg-toggle">
    <div class="gg-layout">
        <label for="gg-drawer-toggle" class="gg-btn">Open Drawer</label>
        <p>Main content area.</p>
    </div>
    
    <div class="gg-drawer">
        <div class="gg-glow-border"></div>
        <div class="gg-content">
            <label for="gg-drawer-toggle" class="gg-close">×</label>
            <h2>Menu</h2>
            <a href="#">Dashboard</a>
            <a href="#">Settings</a>
            <a href="#">Profile</a>
        </div>
    </div>
    <label for="gg-drawer-toggle" class="gg-overlay"></label>
</body>
</html>
