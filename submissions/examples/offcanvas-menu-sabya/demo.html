<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Offcanvas Menu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 1. The Hidden Checkbox (Controls the state) -->
    <input type="checkbox" id="menu-toggle" class="offcanvas-checkbox">

    <!-- 2. The Button to Open Menu (Linked to checkbox) -->
    <label for="menu-toggle" class="offcanvas-btn">Open Menu</label>

    <!-- 3. The Dark Overlay (Clicking this will close the menu) -->
    <label for="menu-toggle" class="offcanvas-overlay"></label>

    <!-- 4. The Actual Sidebar Menu -->
    <aside class="offcanvas-menu">
        <h2>My Sidebar</h2>
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Services</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </aside>

    <main class="content">
        <h1>Welcome to EaseMotion</h1>
        <p>This is a pure CSS offcanvas menu demonstration using the checkbox hack.</p>
    </main>

</body>
</html>
