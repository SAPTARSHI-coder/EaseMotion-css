<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notification Badge Component - Feedback Category (#86844)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="ease-badge-stage" aria-labelledby="stage-title">
    <div>
      <h1 id="stage-title" class="ease-badge-title">Notification Center</h1>
      <p class="ease-badge-desc">A bell icon with a bouncing badge counter that pings on arrival.</p>
    </div>

    <!-- Notification Badge Component -->
    <div class="ease-notification-wrapper" id="notification-bell" role="button" aria-label="3 Unread Notifications" tabindex="0">
      <span class="ease-bell-icon" aria-hidden="true">🔔</span>
      <span class="ease-badge" id="badge-count">3</span>
    </div>

    <button type="button" class="ease-btn-ping" id="ping-btn">Simulate New Alert</button>
  </main>

  <script>
    const bell = document.getElementById('notification-bell');
    const badge = document.getElementById('badge-count');
    const pingBtn = document.getElementById('ping-btn');
    let count = 3;

    pingBtn.addEventListener('click', () => {
      count += 1;
      badge.textContent = count;
      bell.classList.add('is-pinging');
      void bell.offsetWidth; // Trigger DOM reflow
      setTimeout(() => bell.classList.remove('is-pinging'), 600);
    });
  </script>
</body>
</html>
