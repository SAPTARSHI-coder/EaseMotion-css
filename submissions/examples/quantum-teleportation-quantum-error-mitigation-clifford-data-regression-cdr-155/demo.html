<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clifford Data Regression CDR - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css"></head><body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030712; color: #ffffff;">

    <div class="ease-card ease-card-glass cdr-container">
        <div class="cdr-header">
            <h2>Clifford Data Regression</h2>
            <span class="ease-badge ease-badge-primary">Quantum Error Mitigation</span>
        </div>
        
        <div class="cdr-screen ease-center">
            <div class="cdr-flux flux-cdr-a"></div>
            <div class="cdr-flux flux-cdr-b"></div>
            <div class="cdr-boundary-ring"></div>
            <div class="cdr-core ease-center"></div>
        </div>

        <div class="cdr-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Classical Shadow Regression &amp; Training</span>
            <button class="ease-btn ease-btn-primary ease-btn-sm ease-hover-grow">Run CDR Mitigation</button>
        </div>
    </div></body></html>
