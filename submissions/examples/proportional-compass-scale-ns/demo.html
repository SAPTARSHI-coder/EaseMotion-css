<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proportional Compass Scale — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Proportional Compass Scale demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Proportional Compass Scale</h1>
      <p class="lede">Proportional compass scaling a drawing</p>
    </header>

    <section class="ease-proportional-compass-scale" data-demo="proportional-compass-scale" aria-live="polite">
      <div class="ease-proportional-compass-scale__housing">
        <div class="ease-proportional-compass-scale__bezel">
          <div class="ease-proportional-compass-scale__face">
            <div class="ease-proportional-compass-scale__readout">
              <span class="ease-proportional-compass-scale__label">Proportional Compass Scale</span>
              <span class="ease-proportional-compass-scale__value">LIVE</span>
            </div>
            <div class="ease-proportional-compass-scale__motion" aria-hidden="true">
              <span class="ease-proportional-compass-scale__a"></span>
              <span class="ease-proportional-compass-scale__b"></span>
              <span class="ease-proportional-compass-scale__c"></span>
              <span class="ease-proportional-compass-scale__d"></span>
            </div>
            <div class="ease-proportional-compass-scale__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-proportional-compass-scale__controls">
          <button type="button" class="ease-proportional-compass-scale__btn primary">Engage</button>
          <button type="button" class="ease-proportional-compass-scale__btn">Reset</button>
          <label class="ease-proportional-compass-scale__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-proportional-compass-scale__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
