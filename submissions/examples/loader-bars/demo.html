<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loader Bars</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="demo-shell">
      <section class="demo-card" aria-labelledby="lb-title">
        <p class="eyebrow">Animation</p>
        <h1 id="lb-title">Loader bars</h1>
        <p class="demo-copy">
          An equalizer-style bars loader with staggered bounce heights.
        </p>
        <div class="loader-bars" role="status" aria-live="polite" aria-label="Loading">
          <span class="loader-bars__bar"></span>
          <span class="loader-bars__bar"></span>
          <span class="loader-bars__bar"></span>
          <span class="loader-bars__bar"></span>
          <span class="loader-bars__bar"></span>
        </div>
        <p class="loader-bars__caption">Loading your workspace&hellip;</p>
      </section>
    </main>
  </body>
</html>
