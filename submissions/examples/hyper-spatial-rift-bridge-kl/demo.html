<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hyper-Spatial Rift Bridge - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #050205; color: #ffffff;">

    <div class="ease-card ease-card-glass rift-container">
        <div class="rift-header">
            <h2>Spatial Rift Bridge</h2>
            <span class="ease-badge ease-badge-danger">Unstable</span>
        </div>
        
        <div class="rift-screen ease-center">
            <div class="distortion-field f-1"></div>
            <div class="distortion-field f-2"></div>
            <div class="rift-vortex vortex-1"></div>
            <div class="rift-vortex vortex-2"></div>
            <div class="rift-core ease-center"></div>
        </div>

        <div class="rift-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Manifold Stability: 14.2%</span>
            <button class="ease-btn ease-btn-primary ease-btn-sm ease-hover-grow">Stabilize</button>
        </div>
    </div>

</body>
</html>
