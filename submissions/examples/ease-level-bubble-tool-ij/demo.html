<!-- EaseMotion component: level-bubble-tool -->
<!DOCTYPE html>
<html lang="en" data-bubble="level">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
<title>Ease Level Bubble Tool</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="spirit-level">
  <header class="lv-head">
    <span class="lv-name">SPIRIT LEVEL</span>
    <span class="lv-reading">LEVEL</span>
  </header>
  <div class="lv-beam">
    <span class="lv-end end-left"></span>
    <span class="lv-vial">
      <span class="vial-fluid"></span>
      <span class="vial-bubble"></span>
    </span>
    <span class="lv-end end-right"></span>
  </div>
  <div class="lv-marks">
    <span class="lv-mark"></span>
    <span class="lv-mark"></span>
    <span class="lv-mark"></span>
    <span class="lv-mark"></span>
    <span class="lv-mark"></span>
  </div>
  <footer class="lv-foot">
    <span class="lv-angle">0.0&deg;</span>
    <span class="lv-status">&#10003; PERFECT</span>
  </footer>
</main>
</body>
</html>
