<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Animated Quilt Background | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <article class="demo-card">
      <header class="card-header">
        <h1 class="card-title">Patchwork Quilt</h1>
        <p class="card-subtitle">Smoothly shifting color gradient mesh background</p>
      </header>

      <!-- Accessible Quilt Background Container -->
      <div 
        class="quilt-container" 
        role="region" 
        aria-label="Animated patchwork quilt background pattern"
      >
        <div class="quilt-grid" aria-hidden="true">
          <div class="patch patch-1"></div>
          <div class="patch patch-2"></div>
          <div class="patch patch-3"></div>
          <div class="patch patch-4"></div>
          <div class="patch patch-5"></div>
          <div class="patch patch-6"></div>
          <div class="patch patch-7"></div>
          <div class="patch patch-8"></div>
          <div class="patch patch-9"></div>
          <div class="patch patch-10"></div>
          <div class="patch patch-11"></div>
          <div class="patch patch-12"></div>
        </div>
        <div class="quilt-overlay" aria-hidden="true"></div>
      </div>

      <footer class="card-footer">
        <span class="badge">12-Patch Grid</span>
        <span>Pure CSS Shader Pattern</span>
      </footer>
    </article>
  </main>
</body>
</html>
