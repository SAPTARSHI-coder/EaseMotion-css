<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Bento Grid Metrics Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bento-container">
    <div class="bento-card col-span-2">
      <div class="bento-tag">REVENUE OVERVIEW</div>
      <h2>$128,450.00</h2>
      <p class="positive">+24.8% from last month</p>
      <div class="sparkline-bar">
        <div class="spark-item" style="height: 40%;"></div>
        <div class="spark-item" style="height: 65%;"></div>
        <div class="spark-item" style="height: 50%;"></div>
        <div class="spark-item" style="height: 85%;"></div>
        <div class="spark-item" style="height: 100%;"></div>
      </div>
    </div>

    <div class="bento-card">
      <div class="bento-tag">ACTIVE USERS</div>
      <h2>42,810</h2>
      <p class="neutral">Real-time telemetry</p>
    </div>

    <div class="bento-card">
      <div class="bento-tag">CONVERSION RATE</div>
      <h2>4.82%</h2>
      <p class="positive">+1.2% optimal</p>
    </div>

    <div class="bento-card col-span-2">
      <div class="bento-tag">SYSTEM INFRASTRUCTURE</div>
      <h2>Global CDN Edge Nodes</h2>
      <div class="node-status-grid">
        <span class="node active">US-EAST</span>
        <span class="node active">EU-CENTRAL</span>
        <span class="node active">AP-SOUTH</span>
        <span class="node warning">SA-EAST</span>
      </div>
    </div>
  </div>
</body>
</html>
