<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dynamic Dark Mode Modal</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<a href="#modal" class="open-btn">Open Modal</a>

<div id="modal" class="overlay">
    <div class="modal">
        <a href="#" class="close">&times;</a>

        <div class="icon">🌙</div>

        <h2>Dark Mode Enabled</h2>

        <p>
            Experience a modern, distraction-free interface with a sleek
            dark-themed modal built entirely using HTML and CSS.
        </p>

        <div class="actions">
            <a href="#" class="btn primary">Continue</a>
            <a href="#" class="btn secondary">Cancel</a>
        </div>
    </div>
</div>

</body>
</html>
