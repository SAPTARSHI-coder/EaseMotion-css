<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="CSS animated placeholder input component"
  >
  <title>CSS Animated Placeholder</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section class="demo-card" aria-labelledby="demo-title">
      <div class="eyebrow">EaseMotion CSS</div>

      <h1 id="demo-title">Animated Placeholder</h1>

      <p class="description">
        A smooth CSS-only placeholder that slides upward and shrinks
        when the field receives focus or contains text.
      </p>

      <form class="form" action="#" method="get">
        <div class="field">
          <input
            id="full-name"
            name="full-name"
            type="text"
            placeholder=" "
            autocomplete="name"
            aria-describedby="name-help"
          >
          <label for="full-name">Full name</label>
        </div>

        <p id="name-help" class="helper">
          Enter your first and last name.
        </p>

        <div class="field">
          <input
            id="email"
            name="email"
            type="email"
            placeholder=" "
            autocomplete="email"
            aria-describedby="email-help"
          >
          <label for="email">Email address</label>
        </div>

        <p id="email-help" class="helper">
          We will use this address for account updates.
        </p>

        <button type="submit">Continue</button>
      </form>

      <p class="note">
        <span aria-hidden="true">✦</span>
        Pure CSS · Responsive · Keyboard friendly
      </p>
    </section>
  </main>
</body>
</html>
