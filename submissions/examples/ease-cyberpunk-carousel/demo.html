<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Cyberpunk Carousel - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="ease-cyber-wrapper">
    <!-- State Controllers -->
    <input type="radio" name="cyber-slider" id="cy-1" class="ease-cyber-inputs" checked>
    <input type="radio" name="cyber-slider" id="cy-2" class="ease-cyber-inputs">
    <input type="radio" name="cyber-slider" id="cy-3" class="ease-cyber-inputs">
    
    <!-- Sliding Viewport -->
    <div class="ease-carousel-viewport">
      <div class="ease-carousel-track">
        <div class="ease-slide">
          <h2>Uplink Ready</h2>
          <p>Hardware-accelerated sliding mechanics executed purely through CSS.</p>
        </div>
        <div class="ease-slide">
          <h2>Zero JS Bloat</h2>
          <p>Bypassing bloated external swiper libraries for raw DOM performance.</p>
        </div>
        <div class="ease-slide">
          <h2>Neon Brutalism</h2>
          <p>Calculated clip-paths generating physical cutouts without raster images.</p>
        </div>
      </div>
    </div>
    
    <!-- Navigation -->
    <div class="ease-cyber-nav">
      <label for="cy-1" class="ease-nav-btn">01</label>
      <label for="cy-2" class="ease-nav-btn">02</label>
      <label for="cy-3" class="ease-nav-btn">03</label>
    </div>
  </div>
  <p style="position: absolute; bottom: 2rem; color: #f0f; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 2px;">Establishing Secure Connection...</p>
</body>
</html>
