<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Sci-Fi HUD: Cyberpunk Neon</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="hud-container">
        
        <!-- Background grid overlay -->
        <div class="cyber-grid"></div>

        <!-- 
          [TECHNIQUE] The Cyberpunk UI
          Features aggressive clip-paths for angled corners, intense neon box-shadows, 
          and CSS animation-driven glitches.
        -->
        <div class="hud-layout">
            
            <!-- Top Header Status Bar -->
            <header class="hud-header">
                <div class="header-edge left-edge"></div>
                <div class="header-center">
                    <h1 class="sys-title glitch" data-text="SYSTEM ONLINE">SYSTEM ONLINE</h1>
                    <div class="sys-status">SECURE CONNECTION ESTABLISHED</div>
                </div>
                <div class="header-edge right-edge"></div>
            </header>

            <div class="hud-main">
                
                <!-- Left Panel: Stats & Data -->
                <aside class="hud-panel panel-left">
                    <div class="panel-header">
                        <span class="panel-id">SEC-01</span>
                        <span class="panel-label">BIOMETRICS</span>
                    </div>
                    
                    <div class="data-block">
                        <div class="data-label">HEART RATE</div>
                        <div class="data-value text-cyan">102 BPM</div>
                        <!-- CSS Data Chart -->
                        <div class="cyber-chart">
                            <div class="bar bar-1"></div>
                            <div class="bar bar-2"></div>
                            <div class="bar bar-3"></div>
                            <div class="bar bar-4"></div>
                            <div class="bar bar-5"></div>
                            <div class="bar bar-6"></div>
                            <div class="bar bar-7"></div>
                            <div class="bar bar-8"></div>
                        </div>
                    </div>
                    
                    <div class="data-block mt-auto">
                        <div class="data-label">NEURAL SYNC</div>
                        <div class="data-value text-magenta">98.4%</div>
                        <div class="progress-track">
                            <div class="progress-fill sync-progress"></div>
                        </div>
                    </div>
                </aside>

                <!-- Center Panel: Targeting & Radar -->
                <main class="hud-center">
                    <!-- Targeting Reticle -->
                    <div class="reticle">
                        <div class="reticle-corner top-left"></div>
                        <div class="reticle-corner top-right"></div>
                        <div class="reticle-corner bottom-left"></div>
                        <div class="reticle-corner bottom-right"></div>
                        
                        <!-- Radar Scanner -->
                        <div class="radar-container">
                            <div class="radar-grid"></div>
                            <!-- Rotating sweep -->
                            <div class="radar-sweep"></div>
                            <!-- Ping dots -->
                            <div class="radar-ping ping-1"></div>
                            <div class="radar-ping ping-2"></div>
                        </div>
                    </div>
                    
                    <!-- Decorative warning banner -->
                    <div class="warning-banner">
                        <span class="warning-text">WARNING: UNAUTHORIZED ACCESS DETECTED</span>
                    </div>
                </main>

                <!-- Right Panel: Diagnostics -->
                <aside class="hud-panel panel-right">
                    <div class="panel-header">
                        <span class="panel-label">SYSTEM DIAGNOSTICS</span>
                        <span class="panel-id">OP-09</span>
                    </div>
                    
                    <div class="diag-list">
                        <div class="diag-item">
                            <span class="diag-label">FIREWALL</span>
                            <span class="diag-status text-cyan">ACTIVE</span>
                        </div>
                        <div class="diag-item">
                            <span class="diag-label">PROXY CHAIN</span>
                            <span class="diag-status text-cyan">ROUTING</span>
                        </div>
                        <div class="diag-item glitch-item">
                            <span class="diag-label">MAINFRAME</span>
                            <span class="diag-status text-magenta">BREACHED</span>
                        </div>
                    </div>
                    
                    <!-- Glitch Button -->
                    <button class="cyber-btn mt-auto">
                        <span class="btn-text">INITIATE LOCKDOWN</span>
                        <span class="btn-glitch"></span>
                    </button>
                </aside>
                
            </div>
            
        </div>
        
    </div>

</body>
</html>
