<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leader Election Term Fence</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="election-shell" aria-labelledby="election-title">
    <section class="election-board">
      <p class="eyebrow">Consensus control</p>
      <h1 id="election-title">Leader Election Term Fence</h1>
      <p class="summary">Vote pulses converge on a new leader while the term fence blocks stale coordinators from writing.</p>
      <div class="cluster-stage" role="img" aria-label="Animated leader election and term fence visualization">
        <div class="node candidate">candidate</div><div class="node voter a">vote</div><div class="node voter b">vote</div><div class="node voter c">vote</div><div class="node stale">stale</div>
        <div class="term-fence"><span></span><span></span><span></span></div>
        <div class="leader-core"><i></i><i></i><strong>leader</strong></div>
      </div>
      <div class="metrics"><span>term 42</span><span>quorum 4/5</span><span>fence active</span></div>
    </section>
  </main>
</body>
</html>
