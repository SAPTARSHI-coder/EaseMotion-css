<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EaseMotion CSS — Segmented Control Switcher Showcase</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="sc-demo-wrapper">
    <header class="sc-header">
      <span class="badge">UI Component Showcase</span>
      <h1>Segmented Control Switcher</h1>
      <p>Pure CSS segmented control switcher featuring smooth background glider sliding transitions and radio input accessibility.</p>
    </header>

    <main class="sc-card">
      <div class="ease-segmented-control">
        <input type="radio" id="seg-1" name="view-option" checked>
        <label for="seg-1">Day</label>

        <input type="radio" id="seg-2" name="view-option">
        <label for="seg-2">Week</label>

        <input type="radio" id="seg-3" name="view-option">
        <label for="seg-3">Month</label>

        <input type="radio" id="seg-4" name="view-option">
        <label for="seg-4">Year</label>

        <div class="seg-glider"></div>
      </div>
    </main>

    <footer class="sc-footer">
      <p>EaseMotion CSS Component &bull; Submitted by @Ishita-Katiyar-06</p>
    </footer>
  </div>
</body>
</html>
