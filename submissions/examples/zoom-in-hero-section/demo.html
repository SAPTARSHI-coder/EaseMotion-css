<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Zoom-In Hero Section for product catalog layouts">
    <title>Zoom-In Hero Section</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main>
        <section class="hero">

            <div class="zoom-circle zoom-circle-one"></div>
            <div class="zoom-circle zoom-circle-two"></div>

            <div class="hero-content">

                <p class="eyebrow">EASEMOTION CSS</p>

                <h1>
                    Explore What's
                    <span>Next</span>
                </h1>

                <p class="hero-description">
                    Discover a modern collection of products designed
                    to bring style, functionality and performance
                    into your everyday experience.
                </p>

                <div class="hero-actions">
                    <a href="#" class="hero-button primary-button">
                        Explore Products
                    </a>

                    <a href="#" class="hero-button secondary-button">
                        View Collection
                    </a>
                </div>

            </div>

            <div class="product-card product-card-one">
                <span class="product-number">01</span>
                <strong>New Arrivals</strong>
                <small>Explore now</small>
            </div>

            <div class="product-card product-card-two">
                <span class="product-number">02</span>
                <strong>Best Sellers</strong>
                <small>Shop favorites</small>
            </div>

        </section>
    </main>

</body>
</html>
