<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CSS-only liquid pour loading animation">
  <title>Liquid Pour Loader</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="demo">
    <section
      class="loader-card"
      role="status"
      aria-live="polite"
      aria-label="Loading"
    >
      <h1>Liquid Pour Loader</h1>

      <div class="loader" aria-hidden="true">
        <div class="pour-stream"></div>

        <div class="container">
          <div class="liquid"></div>
        </div>
      </div>

      <p>Loading...</p>
    </section>
  </main>
</body>
</html>
