<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Responsive CSS-only conic gradient chart using EaseMotion CSS."
  >
  <title>CSS Conic Gradient Chart | EaseMotion CSS</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="chart-demo">
    <section class="chart-card" aria-labelledby="chart-title">

      <div class="chart-header">
        <p class="eyebrow">EaseMotion CSS</p>
        <h1 id="chart-title">CSS Conic Gradient Chart</h1>
        <p class="description">
          A responsive pie chart created entirely with CSS
          <code>conic-gradient()</code>.
        </p>
      </div>

      <div class="chart-layout">

        <!-- CSS-only chart -->
        <div
          class="pie-chart"
          role="img"
          aria-label="Sales distribution: Product A 40 percent, Product B 30 percent, Product C 20 percent, Product D 10 percent."
        >
          <div class="pie-chart__center">
            <strong>Sales</strong>
            <span>100%</span>
          </div>
        </div>

        <!-- Accessible chart data -->
        <div class="chart-data">
          <h2>Distribution</h2>

          <ul class="chart-legend">
            <li>
              <span class="legend-dot legend-a" aria-hidden="true"></span>
              <span>Product A</span>
              <strong>40%</strong>
            </li>

            <li>
              <span class="legend-dot legend-b" aria-hidden="true"></span>
              <span>Product B</span>
              <strong>30%</strong>
            </li>

            <li>
              <span class="legend-dot legend-c" aria-hidden="true"></span>
              <span>Product C</span>
              <strong>20%</strong>
            </li>

            <li>
              <span class="legend-dot legend-d" aria-hidden="true"></span>
              <span>Product D</span>
              <strong>10%</strong>
            </li>
          </ul>
        </div>

      </div>

      <p class="chart-note">
        Built with pure CSS — no JavaScript required.
      </p>

    </section>
  </main>
</body>
</html>
