<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amethyst Glow · purple crystals glow from within</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <div class="amethyst-container">
      <div class="amethyst-display" id="amethystDisplay">
        <!-- Canvas for amethyst glow -->
        <canvas id="amethystCanvas"></canvas>
        
        <!-- Amethyst Info -->
        <div class="amethyst-info">
          <span class="info-label">💜 Glow</span>
          <span class="info-value" id="glowLevel">0%</span>
        </div>

        <!-- Amethyst Controls -->
        <div class="amethyst-controls">
          <div class="control-group">
            <label class="control-label">💜 Intensity</label>
            <input type="range" class="control-slider" id="intensitySlider" min="0" max="100" value="50">
            <span class="control-value" id="intensityValue">50%</span>
          </div>
          <div class="control-group">
            <label class="control-label">✨ Sparkle</label>
            <input type="range" class="control-slider" id="sparkleSlider" min="0" max="100" value="50">
            <span class="control-value" id="sparkleValue">50%</span>
          </div>
        </div>

        <!-- Amethyst Text -->
        <div class="amethyst-text">
          <span class="text-label">💜 Amethyst</span>
          <span class="text-message" id="amethystMessage">Purple crystals glowing from within</span>
        </div>
      </div>
      
      <div class="amethyst-status">
        <span id="amethystStatus">💜 Amethyst crystals glow with inner light</span>
      </div>
    </div>

    <div class="controls">
      <button class="btn btn-reset" id="resetBtn">⟳ Reset</button>
    </div>
    <div class="footer-note">
      <span>💜 amethyst glow · crystal formation · sparkle effects</span>
    </div>
  </div>

  <script>
    (function() {
      "use strict";

      // DOM refs
      const canvas = document.getElementById('amethystCanvas');
      const ctx = canvas.getContext('2d');
      const display = document.getElementById('amethystDisplay');
      const glowLevel = document.getElementById('glowLevel');
      const amethystStatus = document.getElementById('amethystStatus');
      const amethystMessage = document.getElementById('amethystMessage');
      const resetBtn = document.getElementById('resetBtn');
      const intensitySlider = document.getElementById('intensitySlider');
      const intensityValue = document.getElementById('intensityValue');
      const sparkleSlider = document.getElementById('sparkleSlider');
      const sparkleValue = document.getElementById('sparkleValue');

      // State
      let crystals = [];
      let glowParticles = [];
      let sparkles = [];
      let animationId = null;
      let time = 0;

      // Crystal class
      class Crystal {
        constructor(x, y, size, angle) {
          this.x = x || Math.random() * canvas.width;
          this.y = y || Math.random() * canvas.height;
          this.size = size || 8 + Math.random() * 25;
          this.angle = angle || Math.random() * Math.PI * 2;
          this.rotationSpeed = (Math.random() - 0.5) * 0.005;
          this.facets = 4 + Math.floor(Math.random() * 4);
          this.phase = Math.random() * Math.PI * 2;
          this.pulseSpeed = 0.01 + Math.random() * 0.02;
          this.baseGlow = 0.3 + Math.random() * 0.4;
          this.shimmer = 0.5 + Math.random() * 0.5;
          this.color = this.randomPurple();
          this.light = this.lightenColor(this.color, 40);
          this.dark = this.darkenColor(this.color, 30);
          this.glowParticles = [];
          
          // Generate glow particles around crystal
          const numGlow = 3 + Math.floor(Math.random() * 5);
          for (let i = 0; i < numGlow; i++) {
            const angle = Math.random() * Math.PI * 2;
            const dist = this.size * (0.3 + Math.random() * 0.5);
            this.glowParticles.push({
              x: Math.cos(angle) * dist,
              y: Math.sin(angle) * dist,
              size: 1 + Math.random() * 2,
              phase: Math.random() * Math.PI * 2,
              speed: 0.01 + Math.random() * 0.02
            });
          }
        }

        randomPurple() {
          const purples = ['#a78bfa', '#8b5cf6', '#7c3aed', '#6d28d9', '#5b21b6', '#4c1d95'];
          return purples[Math.floor(Math.random() * purples.length)];
        }

        lightenColor(color, percent) {
          const num = parseInt(color.replace('#', ''), 16);
          const amt = Math.round(2.55 * percent);
          const R = Math.min(255, (num >> 16) + amt);
          const G = Math.min(255, ((num >> 8) & 0x00FF) + amt);
          const B = Math.min(255, (num & 0x0000FF) + amt);
          return `rgb(${R},${G},${B})`;
        }

        darkenColor(color, percent) {
          const num = parseInt(color.replace('#', ''), 16);
          const amt = Math.round(2.55 * percent);
          const R = Math.max(0, (num >> 16) - amt);
          const G = Math.max(0, ((num >> 8) & 0x00FF) - amt);
          const B = Math.max(0, (num & 0x0000FF) - amt);
          return `rgb(${R},${G},${B})`;
        }

        update(intensity, time) {
          this.angle += this.rotationSpeed;
          this.phase += this.pulseSpeed;
          this.shimmer = 0.5 + Math.sin(this.phase * 2) * 0.3 + 0.2;
          
          // Update glow particles
          this.glowParticles.forEach(p => {
            p.phase += p.speed;
          });
        }

        draw(ctx, intensity, sparkle) {
          const intensityFactor = intensity / 100;
          const sparkleFactor = sparkle / 100;
          const glow = this.baseGlow * (0.3 + intensityFactor * 0.7);
          const shimmer = this.shimmer * (0.5 + intensityFactor * 0.5);
          
          ctx.save();
          ctx.translate(this.x, this.y);
          ctx.rotate(this.angle);
          
          // Outer glow
          const glowSize = this.size * (1.5 + intensityFactor * 1.5);
          const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, glowSize);
          grad.addColorStop(0, this.color + '88');
          grad.addColorStop(0.3, this.color + '44');
          grad.addColorStop(0.6, this.color + '22');
          grad.addColorStop(1, 'rgba(0,0,0,0)');
          ctx.fillStyle = grad;
          ctx.shadowColor = this.color;
          ctx.shadowBlur = 30 * (0.3 + intensityFactor * 0.7);
          ctx.globalAlpha = glow * 0.8;
          ctx.beginPath();
          ctx.arc(0, 0, glowSize, 0, Math.PI * 2);
          ctx.fill();
          
          // Crystal body
          ctx.shadowBlur = 20 * (0.3 + intensityFactor * 0.7);
          const grad2 = ctx.createRadialGradient(
            -this.size * 0.2, -this.size * 0.2, 0,
            0, 0, this.size
          );
          grad2.addColorStop(0, this.light);
          grad2.addColorStop(0.4, this.color);
          grad2.addColorStop(0.8, this.dark);
          grad2.addColorStop(1, this.dark + '88');
          ctx.fillStyle = grad2;
          ctx.globalAlpha = 0.7 + intensityFactor * 0.3;
          
          // Faceted crystal shape
          const points = this.facets * 2;
          ctx.beginPath();
          for (let i = 0; i < points; i++) {
            const angle = (i / points) * Math.PI * 2;
            const radius = i % 2 === 0 ? this.size : this.size * (0.4 + shimmer * 0.2);
            const px = Math.cos(angle) * radius;
            const py = Math.sin(angle) * radius;
            if (i === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
          }
          ctx.closePath();
          ctx.fill();
          
          // Facet lines
          ctx.shadowBlur = 0;
          ctx.globalAlpha = 0.1 * intensityFactor;
          ctx.strokeStyle = this.light;
          ctx.lineWidth = 0.5;
          for (let i = 0; i < this.facets; i++) {
            const angle = (i / this.facets) * Math.PI * 2;
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(Math.cos(angle) * this.size, Math.sin(angle) * this.size);
            ctx.stroke();
          }
          
          // Inner glow particles
          ctx.shadowBlur = 10;
          this.glowParticles.forEach(p => {
            const alpha = (0.3 + Math.sin(p.phase) * 0.2 + 0.2) * intensityFactor * 0.5;
            ctx.globalAlpha = alpha;
            ctx.fillStyle = this.light;
            ctx.shadowColor = this.color;
            ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size * (0.5 + intensityFactor * 0.5), 0, Math.PI * 2);
            ctx.fill();
          });
          
          // Sparkle
          if (sparkleFactor > 0.1 && Math.random() < sparkleFactor * 0.1) {
            const sparkleSize = this.size * (0.1 + Math.random() * 0.2) * sparkleFactor;
            ctx.shadowBlur = 20;
            ctx.fillStyle = '#ffffff';
            ctx.globalAlpha = 0.3 + Math.random() * 0.3;
            ctx.beginPath();
            // Star sparkle
            for (let i = 0; i < 4; i++) {
              const angle = (i / 4) * Math.PI * 2 + Math.PI / 4;
              const px = Math.cos(angle) * sparkleSize;
              const py = Math.sin(angle) * sparkleSize;
              if (i === 0) ctx.moveTo(px, py);
              else ctx.lineTo(px, py);
            }
            ctx.closePath();
            ctx.fill();
          }
          
          ctx.restore();
        }
      }

      // Sparkle particle class
      class SparkleParticle {
        constructor(x, y) {
          this.x = x || Math.random() * canvas.width;
          this.y = y || Math.random() * canvas.height;
          this.size = 1 + Math.random() * 3;
          this.life = 0.5 + Math.random() * 0.5;
          this.maxLife = this.life;
          this.speed = 0.3 + Math.random() * 0.7;
          this.angle = Math.random() * Math.PI * 2;
          this.phase = Math.random() * Math.PI * 2;
          this.color = ['#a78bfa', '#8b5cf6', '#c4b5fd', '#ddd6fe', '#fbbf24'][Math.floor(Math.random() * 5)];
        }

        update() {
          this.phase += 0.02;
          this.x += Math.cos(this.angle) * this.speed * 0.2;
          this.y += Math.sin(this.angle) * this.speed * 0.2;
          this.life -= 0.005;
          return this.life > 0;
        }

        draw(ctx) {
          const alpha = (this.life / this.maxLife) * 0.6;
          const size = this.size * (0.5 + (this.life / this.maxLife) * 0.5);
          
          ctx.save();
          ctx.globalAlpha = alpha;
          ctx.fillStyle = this.color;
          ctx.shadowColor = this.color;
          ctx.shadowBlur = 10;
          
          // Star shape
          ctx.beginPath();
          for (let i = 0; i < 4; i++) {
            const angle = (i / 4) * Math.PI * 2 + Math.PI / 4 + this.phase;
            const radius = i % 2 === 0 ? size : size * 0.5;
            const px = Math.cos(angle) * radius;
            const py = Math.sin(angle) * radius;
            if (i === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
          }
          ctx.closePath();
          ctx.fill();
          ctx.restore();
        }
      }

      // Generate crystals
      function generateCrystals() {
        const w = canvas.width;
        const h = canvas.height;
        const count = 6 + Math.floor(Math.random() * 6);
        crystals = [];
        
        for (let i = 0; i < count; i++) {
          const x = w * (0.1 + Math.random() * 0.8);
          const y = h * (0.1 + Math.random() * 0.8);
          const size = 15 + Math.random() * 30;
          const angle = Math.random() * Math.PI * 2;
          const crystal = new Crystal(x, y, size, angle);
          crystal.pulseSpeed = 0.005 + Math.random() * 0.015;
          crystals.push(crystal);
        }
      }

      // Draw background
      function drawBackground() {
        const w = canvas.width;
        const h = canvas.height;
        
        // Dark gradient with purple tint
        const grad = ctx.createRadialGradient(w/2, h/2, 0, w/2, h/2, w * 0.7);
        grad.addColorStop(0, 'rgba(20, 10, 30, 0.3)');
        grad.addColorStop(0.3, 'rgba(15, 8, 25, 0.4)');
        grad.addColorStop(0.7, 'rgba(10, 5, 20, 0.5)');
        grad.addColorStop(1, 'rgba(5, 2, 10, 0.6)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, w, h);
        
        // Ambient purple glow
        const grad2 = ctx.createRadialGradient(w/2, h/2, 0, w/2, h/2, w * 0.4);
        grad2.addColorStop(0, 'rgba(139, 92, 246, 0.03)');
        grad2.addColorStop(0.5, 'rgba(139, 92, 246, 0.02)');
        grad2.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = grad2;
        ctx.beginPath();
        ctx.arc(w/2, h/2, w * 0.4, 0, Math.PI * 2);
        ctx.fill();
      }

      // Resize canvas
      function resizeCanvas() {
        const rect = display.getBoundingClientRect();
        canvas.width = rect.width;
        canvas.height = rect.height;
        canvas.style.width = rect.width + 'px';
        canvas.style.height = rect.height + 'px';
        generateCrystals();
      }

      // Animation loop
      function animate() {
        const intensity = parseInt(intensitySlider.value);
        const sparkle = parseInt(sparkleSlider.value);
        time += 0.02;
        
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawBackground();
        
        // Update and draw crystals
        crystals.forEach(crystal => {
          crystal.update(intensity, time);
          crystal.draw(ctx, intensity, sparkle);
        });
        
        // Generate ambient sparkles
        if (sparkle > 20 && Math.random() < sparkle / 100 * 0.3) {
          const x = Math.random() * canvas.width;
          const y = Math.random() * canvas.height;
          sparkles.push(new SparkleParticle(x, y));
        }
        
        // Update and draw sparkles
        sparkles = sparkles.filter(s => {
          const alive = s.update();
          if (alive) s.draw(ctx);
          return alive;
        });
        
        // Update glow level
        const percent = Math.round(intensity * (0.5 + sparkle / 100 * 0.5));
        glowLevel.textContent = percent + '%';
        glowLevel.style.color = percent > 50 ? '#a78bfa' : '#94a3b8';
        
        // Update status
        if (intensity > 70) {
          amethystStatus.textContent = '💜 Amethyst glowing brilliantly! ✨';
          amethystStatus.style.color = '#a78bfa';
        } else if (intensity > 30) {
          amethystStatus.textContent = '💜 Crystals pulsing with inner light';
          amethystStatus.style.color = '#818cf8';
        } else {
          amethystStatus.textContent = '💜 Amethyst crystals glow with inner light';
          amethystStatus.style.color = '#94a3b8';
        }
        
        // Update message based on sparkle
        if (sparkle > 70) {
          amethystMessage.textContent = '✨ Crystals sparkling brilliantly!';
          amethystMessage.style.color = '#fbbf24';
        } else if (sparkle > 30) {
          amethystMessage.textContent = '💜 Purple crystals glowing from within';
          amethystMessage.style.color = '#a78bfa';
        } else {
          amethystMessage.textContent = 'Purple crystals glowing from within';
          amethystMessage.style.color = '#94a3b8';
        }
        
        animationId = requestAnimationFrame(animate);
      }

      // Reset
      function resetAmethyst() {
        intensitySlider.value = 50;
        intensityValue.textContent = '50%';
        sparkleSlider.value = 50;
        sparkleValue.textContent = '50%';
        sparkles = [];
        generateCrystals();
        amethystStatus.textContent = '🔄 Reset complete';
        amethystStatus.style.color = '#94a3b8';
        amethystMessage.textContent = 'Purple crystals glowing from within';
        amethystMessage.style.color = '#94a3b8';
        setTimeout(() => {
          amethystStatus.textContent = '💜 Amethyst crystals glow with inner light';
          amethystStatus.style.color = '#94a3b8';
        }, 1000);
      }

      // Event listeners
      intensitySlider.addEventListener('input', function() {
        intensityValue.textContent = this.value + '%';
      });

      sparkleSlider.addEventListener('input', function() {
        sparkleValue.textContent = this.value + '%';
      });

      if (resetBtn) {
        resetBtn.addEventListener('click', function(e) {
          e.preventDefault();
          resetAmethyst();
        });
      }

      // Keyboard shortcuts
      document.addEventListener('keydown', function(e) {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

        const key = e.key;
        if (key === 'r' || key === 'R') {
          e.preventDefault();
          resetAmethyst();
        }
      });

      // Resize
      window.addEventListener('resize', resizeCanvas);

      // Initialize
      resizeCanvas();
      animate();
      
      console.log('💜 Amethyst Glow ready · shortcuts: [R] Reset');
    })();
  </script>
</body>
</html>
