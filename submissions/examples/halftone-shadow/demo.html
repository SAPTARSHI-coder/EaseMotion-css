<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retro Comic-Style Halftone Shadow</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      margin: 0;
      padding: 2rem;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: #fce38a; /* Comic yellow background */
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: #333;
    }
    
    .demo-container {
      display: flex;
      gap: 4rem;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 2rem;
    }

    .comic-card {
      background-color: white;
      border: 3px solid black;
      padding: 2rem;
      border-radius: 8px;
      width: 250px;
      font-weight: bold;
      font-size: 1.2rem;
      text-align: center;
      transition: transform 0.3s ease;
    }
    
    .comic-card:hover {
      transform: translate(-5px, -5px);
    }

    .comic-btn {
      background-color: #ff7675;
      color: white;
      border: 3px solid black;
      padding: 1rem 2rem;
      font-size: 1.2rem;
      font-weight: 900;
      text-transform: uppercase;
      cursor: pointer;
      border-radius: 4px;
      transition: transform 0.3s ease;
    }
    
    .comic-btn:hover {
      transform: translate(-5px, -5px);
    }
    
    h2 {
      margin: 0;
      font-weight: 900;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-size: 2.5rem;
      text-shadow: 2px 2px 0px white;
    }
    
    p {
      text-align: center;
      margin-bottom: 2rem;
      font-size: 1.2rem;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h2>Neo-Brutalism</h2>
  <p>Hover over the elements to see the halftone shadow effect in action!</p>

  <div class="demo-container">
    
    <!-- Halftone Shadow Card -->
    <div class="ease-halftone-shadow comic-card">
      <div style="font-size: 3rem; margin-bottom: 1rem;">💥</div>
      Halftone Shadow Card
    </div>
    
    <!-- Halftone Shadow Button -->
    <button class="ease-halftone-shadow comic-btn">
      Pow! Click Me
    </button>
    
  </div>

</body>
</html>
