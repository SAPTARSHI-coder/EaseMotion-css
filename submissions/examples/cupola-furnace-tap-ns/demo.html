<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cupola Furnace Tap — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Cupola Furnace Tap demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Cupola Furnace Tap</h1>
      <p class="lede">Foundry cupola tapped with molten iron pour</p>
    </header>

    <section class="ease-cupola-furnace-tap" data-demo="cupola-furnace-tap" aria-live="polite">
      <div class="ease-cupola-furnace-tap__housing">
        <div class="ease-cupola-furnace-tap__bezel">
          <div class="ease-cupola-furnace-tap__face">
            <div class="ease-cupola-furnace-tap__readout">
              <span class="ease-cupola-furnace-tap__label">Cupola Furnace Tap</span>
              <span class="ease-cupola-furnace-tap__value">LIVE</span>
            </div>
            <div class="ease-cupola-furnace-tap__motion" aria-hidden="true">
              <span class="ease-cupola-furnace-tap__a"></span>
              <span class="ease-cupola-furnace-tap__b"></span>
              <span class="ease-cupola-furnace-tap__c"></span>
              <span class="ease-cupola-furnace-tap__d"></span>
            </div>
            <div class="ease-cupola-furnace-tap__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-cupola-furnace-tap__controls">
          <button type="button" class="ease-cupola-furnace-tap__btn primary">Engage</button>
          <button type="button" class="ease-cupola-furnace-tap__btn">Reset</button>
          <label class="ease-cupola-furnace-tap__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-cupola-furnace-tap__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
