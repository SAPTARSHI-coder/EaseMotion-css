<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zoom-In Progress Bar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>Portfolio Skills</h1>

    <div class="progress-item">
        <span>HTML</span>
        <div class="progress">
            <div class="progress-fill html"></div>
        </div>
    </div>

    <div class="progress-item">
        <span>CSS</span>
        <div class="progress">
            <div class="progress-fill css"></div>
        </div>
    </div>

    <div class="progress-item">
        <span>JavaScript</span>
        <div class="progress">
            <div class="progress-fill js"></div>
        </div>
    </div>
</div>

</body>
</html>
