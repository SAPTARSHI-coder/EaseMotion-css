<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Floating slider with dark mode styling."
  >

  <title>Floating Slider — Dark Mode</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="page">

    <section class="demo">

      <span class="eyebrow">EASEMOTION CSS</span>

      <h1>Floating Slider</h1>

      <p class="intro">
        A compact dark-mode slider with floating depth,
        polished range feedback, and responsive styling.
      </p>

      <div class="slider-card">

        <div class="slider-card__header">

          <div>
            <span class="slider-card__eyebrow">
              DISPLAY SETTINGS
            </span>

            <h2>Brightness</h2>
          </div>

          <output
            id="brightness-value"
            class="slider-value"
            for="brightness"
          >
            72%
          </output>

        </div>

        <div class="slider-wrap">

          <div class="slider-track">

            <div class="slider-progress"></div>

          </div>

          <input
            id="brightness"
            class="slider"
            type="range"
            min="0"
            max="100"
            value="72"
            aria-label="Brightness"
          >

        </div>

        <div class="slider-scale" aria-hidden="true">
          <span>0</span>
          <span>25</span>
          <span>50</span>
          <span>75</span>
          <span>100</span>
        </div>

        <div class="slider-card__footer">

          <span class="slider-status">
            ● SYSTEM READY
          </span>

          <span class="slider-hint">
            Drag to adjust
          </span>

        </div>

      </div>

      <p class="demo__note">
        The component uses native range controls and CSS-only
        visual styling.
      </p>

    </section>

  </main>

  <script>
    const slider = document.getElementById("brightness");
    const value = document.getElementById("brightness-value");
    const progress = document.querySelector(".slider-progress");

    function updateSlider() {
      const percent = slider.value;
      value.textContent = `${percent}%`;
      progress.style.width = `${percent}%`;
    }

    slider.addEventListener("input", updateSlider);

    updateSlider();
  </script>

</body>
</html>
