<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CSS Assignment Deadline Card">
  <title>CSS Assignment Deadline</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">
    <section class="deadline-card" aria-labelledby="deadline-title">

      <div class="card-top">
        <span class="badge">Assignment</span>
        <span class="status">Due Soon</span>
      </div>

      <div class="icon-box" aria-hidden="true">
        <span>✓</span>
      </div>

      <h1 id="deadline-title">Web Development Project</h1>

      <p class="description">
        Complete and submit your responsive portfolio project before
        the upcoming deadline.
      </p>

      <div class="deadline-info">
        <div>
          <span class="label">Due Date</span>
          <strong>August 14, 2026</strong>
        </div>

        <div>
          <span class="label">Time Remaining</span>
          <strong>4 Days</strong>
        </div>
      </div>

      <div class="urgency" aria-label="Deadline urgency: 75 percent">
        <div class="urgency-header">
          <span>Deadline urgency</span>
          <strong>75%</strong>
        </div>

        <div class="progress">
          <div class="progress-fill"></div>
        </div>
      </div>

      <div class="card-footer">
        <span>Submit before</span>
        <strong>11:59 PM</strong>
      </div>

    </section>
  </main>

</body>
</html>
