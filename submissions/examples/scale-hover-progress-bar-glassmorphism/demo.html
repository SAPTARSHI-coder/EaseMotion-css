<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scale Hover Progress Bar</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="wrapper">

    <section class="glass">

        <h1>Scale Hover Progress Bar</h1>
        <p class="description">
            Modern glassmorphism progress bars with pure CSS animations.
        </p>


        <div class="progress-container">


            <div class="card">
                <div class="title">
                    <span>HTML</span>
                    <span>95%</span>
                </div>

                <div class="track">
                    <div class="fill html"></div>
                </div>
            </div>



            <div class="card">
                <div class="title">
                    <span>CSS</span>
                    <span>90%</span>
                </div>

                <div class="track">
                    <div class="fill css"></div>
                </div>
            </div>



            <div class="card">
                <div class="title">
                    <span>JavaScript</span>
                    <span>85%</span>
                </div>

                <div class="track">
                    <div class="fill javascript"></div>
                </div>
            </div>



            <div class="card">
                <div class="title">
                    <span>React</span>
                    <span>80%</span>
                </div>

                <div class="track">
                    <div class="fill react"></div>
                </div>
            </div>


        </div>

    </section>

</div>


</body>
</html>
