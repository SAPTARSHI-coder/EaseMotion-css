<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Scale Hover Progress Bar | Glassmorphism</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <section class="glass-card">

            <h1>Scale Hover Progress Bar</h1>
            <p class="subtitle">
                Pure CSS animated progress bars with glassmorphism effects.
            </p>


            <div class="progress-grid">


                <div class="progress-card">

                    <div class="header">
                        <span>HTML</span>
                        <span>95%</span>
                    </div>

                    <div class="progress">
                        <span class="bar html"></span>
                    </div>

                </div>



                <div class="progress-card">

                    <div class="header">
                        <span>CSS</span>
                        <span>90%</span>
                    </div>

                    <div class="progress">
                        <span class="bar css"></span>
                    </div>

                </div>



                <div class="progress-card">

                    <div class="header">
                        <span>JavaScript</span>
                        <span>85%</span>
                    </div>

                    <div class="progress">
                        <span class="bar js"></span>
                    </div>

                </div>



                <div class="progress-card">

                    <div class="header">
                        <span>React</span>
                        <span>80%</span>
                    </div>

                    <div class="progress">
                        <span class="bar react"></span>
                    </div>

                </div>


            </div>


        </section>

    </main>


</body>
</html>
