<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floating Dark Mode Card</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="container">
        
        <!-- Floating Dark Mode Card -->
        <article class="floating-card">
            
            <div class="card-glow"></div>
            
            <div class="card-content">
                <div class="card-header">
                    <div class="icon-box">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                    </div>
                    <span class="badge">Pro Layer</span>
                </div>
                
                <h3 class="card-title">Advanced Analytics</h3>
                <p class="card-desc">Deep dive into your performance metrics with real-time data visualization and floating dark mode aesthetics.</p>
                
                <div class="card-footer">
                    <div class="stats">
                        <div class="stat">
                            <span class="stat-val">+24%</span>
                            <span class="stat-label">Growth</span>
                        </div>
                        <div class="stat">
                            <span class="stat-val">12.5k</span>
                            <span class="stat-label">Active</span>
                        </div>
                    </div>
                    <a href="#" class="action-btn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                    </a>
                </div>
            </div>
            
        </article>

    </div>

</body>
</html>
