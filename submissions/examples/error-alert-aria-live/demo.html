<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Error Alert ARIA Live Compliance Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main>
    <h1>Form Submission Test</h1>
    
    <!-- Pre-rendered Live Region Container (Required for reliable Screen Reader Speech Interrupts) -->
    <div 
      id="error-alert-container" 
      aria-live="assertive" 
      aria-atomic="true"
      aria-relevant="additions text"
    ></div>

    <form id="sample-form" novalidate>
      <div class="form-group">
        <label for="username">Username (Required)</label>
        <input 
          type="text" 
          id="username" 
          name="username" 
          aria-required="true"
          autocomplete="off"
        >
      </div>

      <button type="submit" class="btn-primary">Submit Form</button>
    </form>
  </main>

  <script src="alert-controller.js"></script>
</body>
</html>
