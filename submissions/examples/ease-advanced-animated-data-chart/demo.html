<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Animated SVG data chart with path drawing and interactive tooltips">
  <title>Animated SVG Data Chart</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="chart-page">
    <section class="chart-card" aria-labelledby="chart-title">

      <header class="chart-header">
        <div>
          <p class="eyebrow">ANALYTICS</p>
          <h1 id="chart-title">Performance Overview</h1>
          <p class="subtitle">Monthly activity and growth</p>
        </div>

        <div class="chart-value">
          <strong>84.6%</strong>
          <span>+12.8%</span>
        </div>
      </header>

      <div class="chart-wrapper">
        <svg
          class="data-chart"
          viewBox="0 0 900 430"
          role="img"
          aria-labelledby="chart-title chart-description"
        >
          <desc id="chart-description">
            Animated line chart displaying monthly performance data.
          </desc>

          <!-- Grid -->
          <g class="grid-lines" aria-hidden="true">
            <line x1="70" y1="50" x2="850" y2="50"></line>
            <line x1="70" y1="125" x2="850" y2="125"></line>
            <line x1="70" y1="200" x2="850" y2="200"></line>
            <line x1="70" y1="275" x2="850" y2="275"></line>
            <line x1="70" y1="350" x2="850" y2="350"></line>
          </g>

          <!-- Y axis -->
          <g class="axis-labels" aria-hidden="true">
            <text x="25" y="55">100</text>
            <text x="32" y="130">75</text>
            <text x="32" y="205">50</text>
            <text x="32" y="280">25</text>
            <text x="40" y="355">0</text>
          </g>

          <!-- Area under chart -->
          <path
            class="chart-area"
            d="M70 300
               L180 260
               L290 285
               L400 190
               L510 215
               L620 120
               L730 155
               L850 75
               L850 350
               L70 350 Z">
          </path>

          <!-- Animated chart line -->
          <path
            class="chart-line"
            pathLength="1"
            d="M70 300
               L180 260
               L290 285
               L400 190
               L510 215
               L620 120
               L730 155
               L850 75">
          </path>

          <!-- Data points -->
          <g class="data-points">

            <g class="data-point">
              <circle cx="70" cy="300" r="7"></circle>
              <g class="tooltip">
                <rect x="42" y="245" width="58" height="32" rx="8"></rect>
                <text x="71" y="266">42%</text>
              </g>
            </g>

            <g class="data-point">
              <circle cx="180" cy="260" r="7"></circle>
              <g class="tooltip">
                <rect x="151" y="205" width="58" height="32" rx="8"></rect>
                <text x="180" y="226">55%</text>
              </g>
            </g>

            <g class="data-point">
              <circle cx="290" cy="285" r="7"></circle>
              <g class="tooltip">
                <rect x="261" y="230" width="58" height="32" rx="8"></rect>
                <text x="290" y="251">47%</text>
              </g>
            </g>

            <g class="data-point">
              <circle cx="400" cy="190" r="7"></circle>
              <g class="tooltip">
                <rect x="371" y="135" width="58" height="32" rx="8"></rect>
                <text x="400" y="156">70%</text>
              </g>
            </g>

            <g class="data-point">
              <circle cx="510" cy="215" r="7"></circle>
              <g class="tooltip">
                <rect x="481" y="160" width="58" height="32" rx="8"></rect>
                <text x="510" y="181">63%</text>
              </g>
            </g>

            <g class="data-point">
              <circle cx="620" cy="120" r="7"></circle>
              <g class="tooltip">
                <rect x="591" y="65" width="58" height="32" rx="8"></rect>
                <text x="620" y="86">82%</text>
              </g>
            </g>

            <g class="data-point">
              <circle cx="730" cy="155" r="7"></circle>
              <g class="tooltip">
                <rect x="701" y="100" width="58" height="32" rx="8"></rect>
                <text x="730" y="121">74%</text>
              </g>
            </g>

            <g class="data-point">
              <circle cx="850" cy="75" r="7"></circle>
              <g class="tooltip">
                <rect x="821" y="20" width="58" height="32" rx="8"></rect>
                <text x="850" y="41">95%</text>
              </g>
            </g>

          </g>

          <!-- X axis -->
          <g class="month-labels" aria-hidden="true">
            <text x="70" y="390">Jan</text>
            <text x="180" y="390">Feb</text>
            <text x="290" y="390">Mar</text>
            <text x="400" y="390">Apr</text>
            <text x="510" y="390">May</text>
            <text x="620" y="390">Jun</text>
            <text x="730" y="390">Jul</text>
            <text x="850" y="390">Aug</text>
          </g>
        </svg>
      </div>

      <footer class="chart-footer">
        <span class="legend-dot"></span>
        <span>Performance</span>
        <span class="hint">Hover over points for details</span>
      </footer>

    </section>
  </main>

</body>
</html>
