<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <meta
        name="description"
        content="Accessible CSS-only emoji status picker with custom status text."
    >

    <title>CSS Emoji Status Picker</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="page">

        <section class="status-card" aria-labelledby="status-title">

            <header class="status-header">
                <div class="profile">
                    <div class="avatar" aria-hidden="true">S</div>

                    <div>
                        <p class="eyebrow">YOUR STATUS</p>
                        <h1 id="status-title">Set your status</h1>
                    </div>
                </div>

                <span class="online-indicator">
                    <span aria-hidden="true"></span>
                    Active
                </span>
            </header>

            <div class="divider"></div>

            <form class="status-form">

                <fieldset class="status-picker">

                    <legend>
                        Choose an emoji
                        <span class="sr-only">
                            Use Tab to move between options and Space to select.
                        </span>
                    </legend>

                    <div class="emoji-grid">

                        <input
                            class="status-radio"
                            type="radio"
                            name="status"
                            id="status-available"
                            checked
                        >
                        <label
                            class="emoji-option"
                            for="status-available"
                            title="Available"
                        >
                            <span class="emoji" aria-hidden="true">🟢</span>
                            <span class="emoji-label">Available</span>
                        </label>

                        <input
                            class="status-radio"
                            type="radio"
                            name="status"
                            id="status-focus"
                        >
                        <label
                            class="emoji-option"
                            for="status-focus"
                            title="Focusing"
                        >
                            <span class="emoji" aria-hidden="true">🎯</span>
                            <span class="emoji-label">Focusing</span>
                        </label>

                        <input
                            class="status-radio"
                            type="radio"
                            name="status"
                            id="status-busy"
                        >
                        <label
                            class="emoji-option"
                            for="status-busy"
                            title="Busy"
                        >
                            <span class="emoji" aria-hidden="true">🔴</span>
                            <span class="emoji-label">Busy</span>
                        </label>

                        <input
                            class="status-radio"
                            type="radio"
                            name="status"
                            id="status-meeting"
                        >
                        <label
                            class="emoji-option"
                            for="status-meeting"
                            title="In a meeting"
                        >
                            <span class="emoji" aria-hidden="true">📅</span>
                            <span class="emoji-label">Meeting</span>
                        </label>

                        <input
                            class="status-radio"
                            type="radio"
                            name="status"
                            id="status-study"
                        >
                        <label
                            class="emoji-option"
                            for="status-study"
                            title="Studying"
                        >
                            <span class="emoji" aria-hidden="true">📚</span>
                            <span class="emoji-label">Studying</span>
                        </label>

                        <input
                            class="status-radio"
                            type="radio"
                            name="status"
                            id="status-away"
                        >
                        <label
                            class="emoji-option"
                            for="status-away"
                            title="Away"
                        >
                            <span class="emoji" aria-hidden="true">🌙</span>
                            <span class="emoji-label">Away</span>
                        </label>

                        <input
                            class="status-radio"
                            type="radio"
                            name="status"
                            id="status-travel"
                        >
                        <label
                            class="emoji-option"
                            for="status-travel"
                            title="Traveling"
                        >
                            <span class="emoji" aria-hidden="true">✈️</span>
                            <span class="emoji-label">Travel</span>
                        </label>

                        <input
                            class="status-radio"
                            type="radio"
                            name="status"
                            id="status-celebrate"
                        >
                        <label
                            class="emoji-option"
                            for="status-celebrate"
                            title="Celebrating"
                        >
                            <span class="emoji" aria-hidden="true">🎉</span>
                            <span class="emoji-label">Celebrate</span>
                        </label>

                    </div>

                </fieldset>

                <div class="custom-status">

                    <label for="custom-message">
                        Custom status
                    </label>

                    <div class="input-wrapper">

                        <span class="input-icon" aria-hidden="true">
                            ✨
                        </span>

                        <input
                            type="text"
                            id="custom-message"
                            name="custom-message"
                            maxlength="60"
                            placeholder="What are you up to?"
                            autocomplete="off"
                        >

                        <span class="character-count" aria-hidden="true">
                            60
                        </span>

                    </div>

                    <p class="helper-text">
                        Add a short message to let others know what you're doing.
                    </p>

                </div>

                <div class="status-preview" aria-live="polite">

                    <div class="preview-icon" aria-hidden="true">
                        🟢
                    </div>

                    <div class="preview-content">
                        <span>Current status</span>
                        <strong>Available</strong>
                    </div>

                    <span class="preview-arrow" aria-hidden="true">
                        →
                    </span>

                </div>

                <div class="actions">

                    <button
                        type="reset"
                        class="button button-secondary"
                    >
                        Cancel
                    </button>

                    <button
                        type="submit"
                        class="button button-primary"
                    >
                        Save status
                    </button>

                </div>

            </form>

            <footer class="status-footer">
                <span aria-hidden="true">⌨</span>
                Keyboard accessible
                <span class="footer-dot">•</span>
                CSS only
            </footer>

        </section>

    </main>

</body>
</html>
