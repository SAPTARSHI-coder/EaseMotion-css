<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Story Progress Segment Bar</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      padding: 24px;
      background: linear-gradient(160deg, #f8fafc, #eef2ff 55%, #f8fafc);
      color: #111827;
      font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      
    }
    h1 { margin: 0; font-size: 1.25rem; text-align: center; }
    .note { margin: 0; max-width: 420px; text-align: center; color: #4b5563; font-size: 0.92rem; line-height: 1.45; }
  </style>
</head>
<body>
  <h1>Story Progress Segment Bar</h1>
  
  <div class="stories" role="group" aria-label="Story demo">
  <div class="stories__progress" aria-hidden="true"><span class="seg is-done"></span><span class="seg is-active"></span><span class="seg"></span></div>
  <p class="note" style="color:#e5e7eb">Hover pauses the active segment.</p>
</div>
  
</body>
</html>
