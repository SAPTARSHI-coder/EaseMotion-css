<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <meta
    name="description"
    content="Responsive 3D breadcrumb with gradient styling"
  >
  <title>3D Gradient Breadcrumb</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="page">
    <section class="showcase" aria-labelledby="breadcrumb-title">

      <span class="eyebrow">EASEMOTION CSS</span>

      <h1 id="breadcrumb-title">
        3D Gradient Breadcrumb
      </h1>

      <p class="intro">
        A responsive breadcrumb component with layered depth,
        gradient surfaces, and smooth interactive states.
      </p>

      <nav
        class="breadcrumb"
        aria-label="Breadcrumb"
      >
        <ol>
          <li>
            <a href="#">Home</a>
          </li>

          <li class="separator" aria-hidden="true">
            /
          </li>

          <li>
            <a href="#">Components</a>
          </li>

          <li class="separator" aria-hidden="true">
            /
          </li>

          <li>
            <a href="#">Navigation</a>
          </li>

          <li class="separator" aria-hidden="true">
            /
          </li>

          <li
            class="current"
            aria-current="page"
          >
            Breadcrumb
          </li>
        </ol>
      </nav>

      <div class="breadcrumb-preview">
        <span>Current path:</span>
        <strong>Home → Components → Navigation → Breadcrumb</strong>
      </div>

    </section>
  </main>
</body>
</html>
