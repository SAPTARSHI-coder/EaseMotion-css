<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D-Flip Stepper for Gaming Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="stepper-container">
        <div class="stepper">
            <div class="step active">
                <div class="step-card">
                    <div class="step-face step-front">
                        <span class="step-number">01</span>
                        <h2 class="step-title">Loadout</h2>
                    </div>
                    <div class="step-face step-back">
                        <p class="step-desc">Select your gear</p>
                    </div>
                </div>
            </div>
            
            <div class="step">
                <div class="step-card">
                    <div class="step-face step-front">
                        <span class="step-number">02</span>
                        <h2 class="step-title">Matchmaking</h2>
                    </div>
                    <div class="step-face step-back">
                        <p class="step-desc">Find a server</p>
                    </div>
                </div>
            </div>

            <div class="step">
                <div class="step-card">
                    <div class="step-face step-front">
                        <span class="step-number">03</span>
                        <h2 class="step-title">Deployment</h2>
                    </div>
                    <div class="step-face step-back">
                        <p class="step-desc">Enter the arena</p>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
