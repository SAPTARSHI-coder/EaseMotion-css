<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dark Mode Toggle | EaseMotion CSS</title><link rel="stylesheet" href="style.css"></head>
<body><div class="dmt-root">
<div class="dmt-card">
<h2 class="dmt-title">Appearance</h2>
<div class="dmt-row"><div><p class="dmt-label">Dark Mode</p><p class="dmt-desc">Toggle dark appearance</p></div><button class="dmt-btn on" id="dmt1" type="button" onclick="this.classList.toggle('on')"></button></div>
<div class="dmt-row"><div><p class="dmt-label">High Contrast</p><p class="dmt-desc">Increase visual contrast</p></div><button class="dmt-btn" id="dmt2" type="button" onclick="this.classList.toggle('on')"></button></div>
<div class="dmt-row"><div><p class="dmt-label">Reduce Motion</p><p class="dmt-desc">Minimize animations</p></div><button class="dmt-btn" id="dmt3" type="button" onclick="this.classList.toggle('on')"></button></div>
</div>
<p class="dmt-sub">Pure CSS toggle buttons with spring animation</p>
</div></body></html>
