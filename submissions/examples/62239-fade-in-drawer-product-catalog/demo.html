<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EaseMotion CSS | Fade-In Drawer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="page-title">
  <h1>CSS Fade-In Drawer</h1>
  <p>Product Catalog Layout Demo</p>
</div>

<div class="product-grid">

  <div class="product-card">
    <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=600" alt="">
    <h3>Running Shoes</h3>
    <p>$129</p>

    <div class="drawer">
      <h4>Premium Sports Shoes</h4>
      <p>Lightweight mesh with responsive cushioning.</p>

      <div class="buttons">
        <button>Add to Cart</button>
        <button class="secondary">Wishlist</button>
      </div>
    </div>
  </div>

  <div class="product-card">
    <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=600" alt="">
    <h3>Smart Watch</h3>
    <p>$249</p>

    <div class="drawer">
      <h4>Series X Watch</h4>
      <p>AMOLED Display • GPS • Health Tracking</p>

      <div class="buttons">
        <button>Add to Cart</button>
        <button class="secondary">Wishlist</button>
      </div>
    </div>
  </div>

  <div class="product-card">
    <img src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=600" alt="">
    <h3>Smartphone</h3>
    <p>$799</p>

    <div class="drawer">
      <h4>Ultra Phone</h4>
      <p>120Hz OLED • Triple Camera • 5G</p>

      <div class="buttons">
        <button>Add to Cart</button>
        <button class="secondary">Wishlist</button>
      </div>
    </div>
  </div>

</div>

</body>
</html>
