<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Pure CSS animated cloud upload component."
  >
  <title>CSS Animated Cloud Upload</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="upload-page">
    <section class="upload-demo" aria-labelledby="upload-title">
      <span class="eyebrow">EaseMotion CSS</span>

      <h1 id="upload-title">Cloud Upload</h1>

      <p class="intro">
        A lightweight cloud upload animation built entirely with HTML and CSS.
      </p>

      <div class="upload-card">
        <div class="cloud" aria-hidden="true">
          <span class="cloud-shape"></span>

          <span class="upload-arrow">
            <span class="arrow-head"></span>
            <span class="arrow-line"></span>
          </span>
        </div>

        <h2>Uploading your file</h2>

        <p class="upload-status">
          Preparing your upload...
        </p>

        <div
          class="progress"
          role="progressbar"
          aria-label="Upload progress"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="75"
        >
          <span class="progress-bar"></span>
        </div>

        <span class="progress-label">75%</span>
      </div>
    </section>
  </main>
</body>
</html>
