<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Input Prefix Suffix | EaseMotion CSS</title><link rel="stylesheet" href="style.css"></head>
<body><div class="ip-root">
<div class="ip-field">
<span class="ip-prefix">$</span>
<input type="number" class="ip-input" placeholder="0.00" style="border-radius:0">
<span class="ip-suffix">USD</span>
</div>
<div class="ip-field">
<span class="ip-prefix">http://</span>
<input type="url" class="ip-input" placeholder="example.com" style="border-radius:0">
<span class="ip-suffix">/</span>
</div>
<div class="ip-pre-wrap">
<span class="ip-pre-icon">&#128269;</span>
<input type="search" class="ip-pre" placeholder="Search...">
</div>
<p class="ip-note">Prefix and suffix inputs using flexbox layout. No JS required.</p>
</div></body></html>
