<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Flip to Dark Card | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="flip-demo-container">
    
    <!-- 3D Flip Card Component (Interactive via Hover & Focus) -->
    <button class="ease-flip-card" aria-label="Interactive card: hover or focus to flip to dark mode view">
      
      <!-- Front Face (Light Version) -->
      <div class="ease-card-face ease-card-front" aria-hidden="false">
        <div class="ease-card-header">
          <h2 class="ease-card-title">Standard View</h2>
          <span class="ease-card-tag">Light Mode</span>
        </div>
        <div class="ease-card-body">
          <p class="ease-card-desc">This card features a clean, high-contrast light mode design suitable for daylight environments and daytime layouts.</p>
        </div>
        <div class="ease-card-footer">
          <span>Hover or focus to flip</span>
          <span class="ease-flip-icon" aria-hidden="true">&rarr;</span>
        </div>
      </div>

      <!-- Back Face (Dark Version) -->
      <div class="ease-card-face ease-card-back" aria-hidden="true">
        <div class="ease-card-header">
          <h2 class="ease-card-title">Midnight View</h2>
          <span class="ease-card-tag">Dark Mode</span>
        </div>
        <div class="ease-card-body">
          <p class="ease-card-desc">Flipped over smoothly using 3D perspective transforms to reveal the immersive dark mode variant.</p>
        </div>
        <div class="ease-card-footer">
          <span>Pure CSS 3D Rotation</span>
          <span class="ease-flip-icon" aria-hidden="true">&#10022;</span>
        </div>
      </div>

    </button>

  </main>

</body>
</html>
