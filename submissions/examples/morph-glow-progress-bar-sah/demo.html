<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Morph-Glow Accessible Progress Bar - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="stage">
    <header class="head">
      <h1>Morph-Glow Progress Bar (<code>#54445</code>)</h1>
      <p>An accessible ARIA progress timeline surrounded by an organic shifting multi-color neon ambient morph glow.</p>
    </header>
    
    <div class="ease-progress-morph-glow">
      <div class="ambient-glow"></div>
      
      <div class="card-inner">
        <div class="head-row">
          <strong>⚡ WebGPU Compute Shaders</strong>
          <span class="pct-pill">85% RENDERING</span>
        </div>

        <div class="meter-track" role="progressbar" aria-valuenow="85" aria-valuemin="0" aria-valuemax="100" aria-label="Shader Compilation">
          <div class="meter-fill" style="width: 85%;">
            <div class="morph-pulse"></div>
          </div>
        </div>

        <p class="desc-txt">Declarative animation worklets compiling across simulated GPU threads with zero Javascript calculation latency.</p>

        <div class="btn-controls">
          <button class="ctrl" onclick="adjustMorph(40)">40% Load</button>
          <button class="ctrl" onclick="adjustMorph(85)">85% Load</button>
          <button class="ctrl prime" onclick="adjustMorph(100)">100% Active ✦</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    function adjustMorph(val) {
      document.querySelector('.meter-fill').style.width = val + '%';
      document.querySelector('.meter-track').setAttribute('aria-valuenow', val);
      document.querySelector('.pct-pill').textContent = val + '% ' + (val === 100 ? 'READY' : 'RENDERING');
    }
  </script>
</body>
</html>
