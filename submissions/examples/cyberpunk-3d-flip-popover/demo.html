<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 3D-Flip Popover - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="cp-wrapper">
        <div class="cp-popover-sys">
            <input type="checkbox" id="cp-popover-toggle" class="cp-hidden-toggle">
            
            <label for="cp-popover-toggle" class="cp-btn" tabindex="0">
                DECRYPT_NODE
            </label>

            <div class="cp-3d-perspective">
                <div class="cp-popover-panel">
                    <div class="cp-panel-header">
                        <span class="cp-status-dot"></span>
                        <span class="cp-header-text">UPLINK ESTABLISHED</span>
                    </div>
                    
                    <div class="cp-panel-body">
                        <p class="cp-text-glitch" data-text="CLASSIFIED INTEL">CLASSIFIED INTEL</p>
                        <p class="cp-text-muted">Node access granted. Encrypted packets are being routed through proxy servers. Maintain connection.</p>
                        
                        <div class="cp-metrics">
                            <div class="cp-metric">
                                <span>LATENCY</span>
                                <span>12ms</span>
                            </div>
                            <div class="cp-metric">
                                <span>PACKET_LOSS</span>
                                <span>0.0%</span>
                            </div>
                            <div class="cp-metric">
                                <span>PROXY</span>
                                <span>SECURE</span>
                            </div>
                        </div>
                    </div>
                    
                    <div class="cp-panel-footer">
                        <div class="cp-progress-bar">
                            <div class="cp-progress-fill"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
