<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EaseMotion - Animated Gradient Border Button (Demo)</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div style="font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; padding: 2rem; display: grid; gap: 1rem; justify-items: start;">
      <h1 style="margin: 0; font-size: 1.6rem;">Animated Gradient Border Button</h1>
      <p style="margin: 0; opacity: 0.8; max-width: 720px;">
        Pure HTML + CSS animated gradient border button. Hover to see premium fill + glow.
        Use keyboard <strong>Tab</strong> to verify <code>:focus-visible</code>.
      </p>

      <div style="display: flex; flex-wrap: wrap; gap: 0.75rem; padding-top: 0.5rem;">
        <button class="ease-gradient-border-button-harshitha" type="button"><span>Hover me</span></button>
        <button
          class="ease-gradient-border-button-harshitha"
          type="button"
          style="--ease-gb-speed: 1.9s; --ease-gb-bg: #0a152a; --ease-gb-bg-hover: #0d1f3f;"
        ><span>Faster</span></button>

        <button class="ease-gradient-border-button-harshitha theme-sunset" type="button"><span>Sunset theme</span></button>
        <button class="ease-gradient-border-button-harshitha theme-ice" type="button" style="--ease-gb-glow: 0.75;"><span>Ice theme</span></button>

        <button class="ease-gradient-border-button-harshitha" type="button" style="--ease-gb-border-width: 3px; --ease-gb-radius: 18px;"><span>3px border</span></button>
        <button class="ease-gradient-border-button-harshitha" type="button" style="--ease-gb-border-width: 4px; --ease-gb-glow: 0.35;"><span>4px border</span></button>
      </div>

      <style>
        /* Demo-only theme helpers for the demo.html */
        .theme-sunset {
          --ease-gb-color1: #f97316;
          --ease-gb-color2: #ec4899;
          --ease-gb-color3: #8b5cf6;
          --ease-gb-color4: #22c55e;
        }

        .theme-ice {
          --ease-gb-color1: #22d3ee;
          --ease-gb-color2: #3b82f6;
          --ease-gb-color3: #34d399;
          --ease-gb-color4: #a78bfa;
        }
      </style>
    </div>
  </body>
</html>
