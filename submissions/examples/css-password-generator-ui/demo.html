<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Password Generator UI — Showcase</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="ease-container">
    <p class="ease-eyebrow">Security Suite</p>
    <h1 class="ease-heading">Password Generator</h1>
    <p class="ease-subtitle">Pure CSS password generator UI with dynamic strength meter and interactive controls.</p>

    <div class="ease-card">
      <!-- Generated Output Row -->
      <div class="ease-output-wrapper">
        <input 
          type="text" 
          class="ease-password-display" 
          value="k9#xP$8mL2!vQ" 
          readonly 
          aria-label="Generated password"
        />
        <button type="button" class="ease-copy-btn" aria-label="Copy password to clipboard">
          <span class="ease-copy-icon">📋</span>
          <span class="ease-copy-tooltip">Copied!</span>
        </button>
      </div>

      <!-- Strength Meter -->
      <div class="ease-strength-container" aria-label="Password strength indicator">
        <div class="ease-strength-header">
          <span class="ease-strength-label">Strength</span>
          <span class="ease-strength-status">STRONG</span>
        </div>
        <div class="ease-strength-meter">
          <div class="ease-meter-bar active"></div>
          <div class="ease-meter-bar active"></div>
          <div class="ease-meter-bar active"></div>
          <div class="ease-meter-bar"></div>
        </div>
      </div>

      <!-- Settings Controls -->
      <form class="ease-generator-form" onsubmit="return false;">
        <!-- Length Slider -->
        <div class="ease-control-group">
          <div class="ease-control-header">
            <label for="ease-length-slider" class="ease-control-label">Character Length</label>
            <span class="ease-length-value">12</span>
          </div>
          <input 
            type="range" 
            id="ease-length-slider" 
            class="ease-range-input" 
            min="6" 
            max="32" 
            value="12"
          />
        </div>

        <!-- Options Checkboxes -->
        <fieldset class="ease-options-fieldset">
          <legend class="ease-sr-only">Password Character Options</legend>
          
          <label class="ease-checkbox-label">
            <input type="checkbox" class="ease-checkbox-input" checked />
            <span class="ease-custom-checkbox"></span>
            <span class="ease-checkbox-text">Include Uppercase Letters</span>
          </label>

          <label class="ease-checkbox-label">
            <input type="checkbox" class="ease-checkbox-input" checked />
            <span class="ease-custom-checkbox"></span>
            <span class="ease-checkbox-text">Include Lowercase Letters</span>
          </label>

          <label class="ease-checkbox-label">
            <input type="checkbox" class="ease-checkbox-input" checked />
            <span class="ease-custom-checkbox"></span>
            <span class="ease-checkbox-text">Include Numbers</span>
          </label>

          <label class="ease-checkbox-label">
            <input type="checkbox" class="ease-checkbox-input" checked />
            <span class="ease-custom-checkbox"></span>
            <span class="ease-checkbox-text">Include Symbols</span>
          </label>
        </fieldset>

        <!-- Generate Action Button -->
        <button type="submit" class="ease-generate-btn">
          <span>Generate Password</span>
          <span class="ease-btn-arrow">➔</span>
        </button>
      </form>
    </div>
  </main>
</body>
</html>
