<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Topological Quantum Anyons - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css"></head><body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030712; color: #ffffff;">

    <div class="ease-card ease-card-glass tq-container">
        <div class="tq-header">
            <h2>Topological Anyons</h2>
            <span class="ease-badge ease-badge-primary">Braiding</span>
        </div>
        
        <div class="tq-screen ease-center">
            <div class="tq-flux flux-tq-a"></div>
            <div class="tq-flux flux-tq-b"></div>
            <div class="tq-boundary-ring"></div>
            <div class="tq-core ease-center"></div>
        </div>

        <div class="tq-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Non-Abelian Braiding &amp; Majorana Modes</span>
            <button class="ease-btn ease-btn-primary ease-btn-sm ease-hover-grow">Run Anyon Braiding</button>
        </div>
    </div></body></html>
