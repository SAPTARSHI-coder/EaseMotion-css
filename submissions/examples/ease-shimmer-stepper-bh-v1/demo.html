<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ease-shimmer-stepper-bh - CSS Shimmer-Sweep Stepper</title>
  <link rel="stylesheet" href="style.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: system-ui, -apple-system, sans-serif; 
      background: #0f172a; 
      color: #f1f5f9; 
      padding: 2rem; 
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    h1 { 
      color: #06b6d4; 
      margin-bottom: 0.5rem;
      font-size: 1.75rem;
      text-align: center;
    }
    p { 
      color: #94a3b8; 
      margin-bottom: 3rem; 
      text-align: center;
    }
    .stepper-wrapper {
      position: relative;
      padding-bottom: 2rem;
    }
    .demo-controls {
      margin-top: 2rem;
      display: flex;
      gap: 1rem;
    }
    .demo-btn {
      padding: 0.75rem 1.5rem;
      background: linear-gradient(135deg, #06b6d4, #22d3ee);
      border: none;
      border-radius: 0.5rem;
      color: #0f172a;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .demo-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(6, 182, 212, 0.4);
    }
  </style>
</head>
<body>
  <h1>ease-shimmer-stepper-bh</h1>
  <p>Shimmer-Sweep Stepper - Watch the shimmer effect!</p>
  
  <div class="stepper-wrapper">
    <div class="ease-shimmer-stepper">
      <div class="ease-shimmer-connector">
        <div class="ease-shimmer-connector-fill" id="connectorFill"></div>
      </div>
      
      <div class="ease-shimmer-step active" data-step="1">
        <span class="ease-shimmer-label">Start</span>
      </div>
      
      <div class="ease-shimmer-step" data-step="2">
        <span class="ease-shimmer-label">Play</span>
      </div>
      
      <div class="ease-shimmer-step" data-step="3">
        <span class="ease-shimmer-label">Win</span>
      </div>
      
      <div class="ease-shimmer-step" data-step="4">
        <span class="ease-shimmer-label">Reward</span>
      </div>
    </div>
  </div>
  
  <div class="demo-controls">
    <button class="demo-btn" onclick="prevStep()">← Back</button>
    <button class="demo-btn" onclick="nextStep()">Next →</button>
  </div>
  
  <script>
    let currentStep = 1;
    const totalSteps = 4;
    
    function updateStepper() {
      const steps = document.querySelectorAll('.ease-shimmer-step');
      steps.forEach((step, index) => {
        step.classList.remove('active', 'completed');
        if (index + 1 < currentStep) {
          step.classList.add('completed');
        } else if (index + 1 === currentStep) {
          step.classList.add('active');
        }
      });
      
      const progress = ((currentStep - 1) / (totalSteps - 1)) * 100;
      document.getElementById('connectorFill').style.width = progress + '%';
    }
    
    function nextStep() {
      if (currentStep < totalSteps) {
        currentStep++;
        updateStepper();
      }
    }
    
    function prevStep() {
      if (currentStep > 1) {
        currentStep--;
        updateStepper();
      }
    }
  </script>
</body>
</html>
