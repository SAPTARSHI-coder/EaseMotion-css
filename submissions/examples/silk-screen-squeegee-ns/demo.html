<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Silk Screen Squeegee — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Silk Screen Squeegee demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Silk Screen Squeegee</h1>
      <p class="lede">Silk screen squeegee pushing ink through mesh</p>
    </header>

    <section class="ease-silk-screen-squeegee" data-demo="silk-screen-squeegee" aria-live="polite">
      <div class="ease-silk-screen-squeegee__housing">
        <div class="ease-silk-screen-squeegee__bezel">
          <div class="ease-silk-screen-squeegee__face">
            <div class="ease-silk-screen-squeegee__readout">
              <span class="ease-silk-screen-squeegee__label">Silk Screen Squeegee</span>
              <span class="ease-silk-screen-squeegee__value">LIVE</span>
            </div>
            <div class="ease-silk-screen-squeegee__motion" aria-hidden="true">
              <span class="ease-silk-screen-squeegee__a"></span>
              <span class="ease-silk-screen-squeegee__b"></span>
              <span class="ease-silk-screen-squeegee__c"></span>
              <span class="ease-silk-screen-squeegee__d"></span>
            </div>
            <div class="ease-silk-screen-squeegee__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-silk-screen-squeegee__controls">
          <button type="button" class="ease-silk-screen-squeegee__btn primary">Engage</button>
          <button type="button" class="ease-silk-screen-squeegee__btn">Reset</button>
          <label class="ease-silk-screen-squeegee__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-silk-screen-squeegee__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
