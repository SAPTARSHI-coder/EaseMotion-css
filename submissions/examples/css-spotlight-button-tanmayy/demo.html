<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Spotlight Button - EaseMotion CSS</title>
  <!-- Import EaseMotion CSS -->
  <link rel="stylesheet" href="../../../easemotion.css">
  <!-- Component Specific Styles -->
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body class="minimalist-bg">

  <div class="demo-container">
    
    <div class="header-section">
      <h1 class="ease-text-3xl">Spotlight Button</h1>
      <p class="ease-color-muted">A dynamic glow effect that follows your cursor across the button surface. Achieved entirely in pure CSS without a single line of JavaScript tracking the mouse coordinates.</p>
    </div>

    <!-- The Demo Showcase -->
    <div class="spotlight-card ease-glass-card">
      
      <!-- The Spotlight Button Wrapper -->
      <div class="spotlight-wrapper">
        
        <!-- The Invisible 5x5 Tracking Grid -->
        <!-- Row 1 -->
        <div class="track tr-1 tc-1"></div>
        <div class="track tr-1 tc-2"></div>
        <div class="track tr-1 tc-3"></div>
        <div class="track tr-1 tc-4"></div>
        <div class="track tr-1 tc-5"></div>
        <!-- Row 2 -->
        <div class="track tr-2 tc-1"></div>
        <div class="track tr-2 tc-2"></div>
        <div class="track tr-2 tc-3"></div>
        <div class="track tr-2 tc-4"></div>
        <div class="track tr-2 tc-5"></div>
        <!-- Row 3 -->
        <div class="track tr-3 tc-1"></div>
        <div class="track tr-3 tc-2"></div>
        <div class="track tr-3 tc-3"></div>
        <div class="track tr-3 tc-4"></div>
        <div class="track tr-3 tc-5"></div>
        <!-- Row 4 -->
        <div class="track tr-4 tc-1"></div>
        <div class="track tr-4 tc-2"></div>
        <div class="track tr-4 tc-3"></div>
        <div class="track tr-4 tc-4"></div>
        <div class="track tr-4 tc-5"></div>
        <!-- Row 5 -->
        <div class="track tr-5 tc-1"></div>
        <div class="track tr-5 tc-2"></div>
        <div class="track tr-5 tc-3"></div>
        <div class="track tr-5 tc-4"></div>
        <div class="track tr-5 tc-5"></div>
        
        <!-- The Actual Button -->
        <button class="spotlight-btn">
          <span class="btn-text">Hover to Reveal</span>
          <svg class="btn-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>

      </div>
      
    </div>

  </div>

</body>
</html>
