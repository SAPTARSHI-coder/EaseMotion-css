<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Origami Fold Card - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="em-origami-page">
        <div class="em-card" role="region" aria-label="Origami Fold Card Showcase" tabindex="0">
            <span class="em-card-badge">3D TRANSFORM EFFECTS</span>
            <h1 class="em-card-title">Origami Fold Card</h1>
            <p class="em-card-desc">An immersive card component that smoothly unfolds from a folded 3D origami state on hover using pure CSS transforms.</p>
            
            <!-- Origami Fold Viewport Container -->
            <div class="em-origami-container" aria-label="Interactive origami unfolding card">
                <div class="em-origami-flap em-flap-top">
                    <div class="em-flap-content">
                        <h2>Origami Unfold</h2>
                        <p>Pure CSS 3D perspective folding animation.</p>
                    </div>
                </div>
            </div>

            <a href="#" class="em-card-btn" role="button">View Source</a>
        </div>
    </div>
</body>
</html>
