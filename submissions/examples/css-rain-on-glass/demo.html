<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="CSS-only animated rain droplets running down a glass pane"
  >

  <title>CSS Rain on Glass</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="page">

    <header class="intro">
      <p class="eyebrow">EaseMotion CSS</p>

      <h1>Rain on Glass</h1>

      <p>
        A pure CSS glass pane with animated rain droplets
        sliding down the surface.
      </p>
    </header>

    <section
      class="rain-section"
      aria-labelledby="rain-title"
    >

      <h2 id="rain-title" class="sr-only">
        Animated rain on glass background
      </h2>

      <div
        class="glass"
        tabindex="0"
        role="img"
        aria-label="Animated rain droplets running down a glass window"
      >

        <div class="background" aria-hidden="true">
          <div class="moon"></div>
          <div class="building building-one"></div>
          <div class="building building-two"></div>
          <div class="building building-three"></div>
        </div>

        <div class="reflection reflection-one" aria-hidden="true"></div>
        <div class="reflection reflection-two" aria-hidden="true"></div>

        <div class="droplets" aria-hidden="true">

          <span class="drop drop-1"></span>
          <span class="drop drop-2"></span>
          <span class="drop drop-3"></span>
          <span class="drop drop-4"></span>
          <span class="drop drop-5"></span>
          <span class="drop drop-6"></span>
          <span class="drop drop-7"></span>
          <span class="drop drop-8"></span>
          <span class="drop drop-9"></span>
          <span class="drop drop-10"></span>
          <span class="drop drop-11"></span>
          <span class="drop drop-12"></span>

        </div>

        <div class="large-drop large-drop-one" aria-hidden="true">
          <span></span>
        </div>

        <div class="large-drop large-drop-two" aria-hidden="true">
          <span></span>
        </div>

        <div class="large-drop large-drop-three" aria-hidden="true">
          <span></span>
        </div>

        <div class="glass-shine" aria-hidden="true"></div>

      </div>

      <p class="hint">
        Hover or focus the glass to pause the rain.
      </p>

    </section>

  </main>

</body>
</html>
