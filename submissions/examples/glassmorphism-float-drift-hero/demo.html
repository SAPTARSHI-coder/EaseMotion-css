<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Float-Drift Hero - Glassmorphism UI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <!-- Background Decorators for Glassmorphism effect -->
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>
    <div class="bg-orb orb-3"></div>

    <div class="layout-container">
        
        <!-- Header / Nav -->
        <header class="top-nav">
            <div class="logo">FloatUI</div>
            <div class="nav-links">
                <a href="#">Features</a>
                <a href="#">Showcase</a>
                <a href="#">Community</a>
            </div>
            <button class="btn btn-outline">Join Waitlist</button>
        </header>

        <!-- The Hero Section -->
        <section class="hero-section">
            
            <div class="hero-content">
                <div class="badge-glass">Design that breathes</div>
                <h1 class="hero-title">Weightless <br>Interfaces.</h1>
                <p class="hero-subtitle">Create interfaces that feel alive. Combining frosted glass with gentle, continuous CSS motion to build environments your users will love to explore.</p>
                <div class="hero-actions">
                    <button class="btn btn-primary">Start Designing</button>
                    <button class="btn btn-glass">Explore Gallery</button>
                </div>
            </div>

            <!-- The Float-Drift Visual Area -->
            <div class="hero-visual">
                
                <!-- Floating Glass Card 1 (Main Mockup) -->
                <div class="glass-card float-element main-card">
                    <div class="mockup-header">
                        <div class="dots"><span></span><span></span><span></span></div>
                    </div>
                    <div class="mockup-body">
                        <div class="flex-row">
                            <div class="glass-element circle avatar"></div>
                            <div class="text-lines">
                                <div class="glass-element h-4 w-3/4 mb-2"></div>
                                <div class="glass-element h-3 w-1/2"></div>
                            </div>
                        </div>
                        <div class="glass-element h-24 w-full mt-6 rounded-lg graph-mockup">
                            <svg viewBox="0 0 100 40" preserveAspectRatio="none">
                                <path d="M0,40 L0,20 Q25,5 50,25 T100,10 L100,40 Z" fill="rgba(255,255,255,0.1)"></path>
                                <path d="M0,20 Q25,5 50,25 T100,10" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="2"></path>
                            </svg>
                        </div>
                    </div>
                </div>

                <!-- Floating Glass Card 2 (Small Widget Left) -->
                <div class="glass-card float-element widget-1">
                    <div class="flex-col align-center p-4">
                        <div class="glass-element circle w-12 h-12 mb-3 flex-center">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#e2e8f0" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>
                        </div>
                        <div class="glass-element h-3 w-16"></div>
                    </div>
                </div>
                
                <!-- Floating Glass Card 3 (Small Widget Right) -->
                <div class="glass-card float-element widget-2">
                    <div class="flex-row align-center p-4 gap-3">
                        <div class="glass-element circle w-8 h-8"></div>
                        <div class="flex-col gap-2">
                            <div class="glass-element h-2 w-12"></div>
                            <div class="glass-element h-2 w-8"></div>
                        </div>
                    </div>
                </div>

            </div>
            
        </section>
        
    </div>

</body>
</html>
