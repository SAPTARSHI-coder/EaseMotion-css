<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pulse Notification Dot</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <h1>Pulse Notification Dot</h1>

    <div class="icon-row">
      <button class="icon-btn" aria-label="Notifications, 3 unread">
        🔔
        <span class="pulse-dot" aria-hidden="true"></span>
      </button>

      <button class="icon-btn" aria-label="Messages, 1 unread">
        💬
        <span class="pulse-dot pulse-dot-blue" aria-hidden="true"></span>
      </button>

      <button class="icon-btn" aria-label="No new alerts">
        🚨
      </button>
    </div>
  </main>
</body>
</html>
