<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Diamond Progress — Showcase</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="ease-container">
    <p class="ease-eyebrow">Level Progress</p>
    <h1 class="ease-heading">Diamond Progress Indicator</h1>
    <p class="ease-subtitle">A pure CSS rhombus progress loader filling up on load.</p>

    <div class="ease-progress-card">
      <div 
        class="ease-diamond-wrapper" 
        role="progressbar" 
        aria-valuenow="75" 
        aria-valuemin="0" 
        aria-valuemax="100" 
        aria-label="Level completion progress"
      >
        <div class="ease-diamond-track">
          <div class="ease-diamond-fill"></div>
        </div>
        <span class="ease-diamond-label">75%</span>
      </div>

      <div class="ease-progress-info">
        <p class="ease-info-title">Stage 3: Mastery</p>
        <p class="ease-info-sub">750 / 1000 XP Collected</p>
      </div>
    </div>
  </main>
</body>
</html>
