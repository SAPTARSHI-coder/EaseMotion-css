<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Zoom-In Progress Bar Fintech Dashboard</title>

<link rel="stylesheet" href="style.css">

</head>


<body>

<main class="container">

<section class="progress-section">

<span class="badge">
FINTECH DASHBOARD
</span>


<h1>
Financial Performance Tracker
</h1>


<p>
A zoom-in progress bar component built with pure CSS animations.
</p>



<div class="progress-card">


<div class="progress-item">

<div class="header">

<span>
Revenue Growth
</span>

<strong>
85%
</strong>

</div>


<div class="bar">

<div class="fill one"></div>

</div>

</div>



<div class="progress-item">

<div class="header">

<span>
Customer Retention
</span>

<strong>
72%
</strong>

</div>


<div class="bar">

<div class="fill two"></div>

</div>

</div>



<div class="progress-item">

<div class="header">

<span>
Investment Success
</span>

<strong>
92%
</strong>

</div>


<div class="bar">

<div class="fill three"></div>

</div>

</div>



</div>


</section>


</main>


</body>

</html>
