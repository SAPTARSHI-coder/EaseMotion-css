<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Typeracer | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="typeracer-container">
    <header class="typeracer-header">
      <h1>CSS Typeracer Progress Bar</h1>
      <p>Gamified typing race progress visualization powered purely by CSS keyframes.</p>
    </header>

    <div class="typing-box" aria-label="Typing test quote preview">
      <span class="text-completed">The quick brown fox jumps over the </span>
      <span class="text-current">lazy</span>
      <span class="text-remaining"> dog and finishes the race track seamlessly.</span>
    </div>

    <div class="race-track-wrapper">
      <div 
        class="race-track" 
        role="progressbar" 
        aria-valuenow="68" 
        aria-valuemin="0" 
        aria-valuemax="100" 
        aria-label="Typeracer competition progress">
        
        <div class="finish-line" title="Finish Line"></div>
        <div class="race-car" aria-hidden="true">🏎️</div>
      </div>

      <div class="speed-stats">
        <span>Speed: <strong>84 WPM</strong></span>
        <span>Progress: <strong>68%</strong></span>
      </div>
    </div>
  </main>
</body>
</html>
