<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Responsive dynamic glassmorphism progress bar built with HTML and CSS"
  >
  <title>Dynamic Glassmorphism Progress Bar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="demo-page">
    <section class="progress-card" aria-labelledby="progress-title">
      <div class="card-glow" aria-hidden="true"></div>

      <div class="card-header">
        <div>
          <span class="eyebrow">Project Status</span>
          <h1 id="progress-title">Development Progress</h1>
        </div>

        <div class="percentage" aria-label="Progress 78 percent">
          78%
        </div>
      </div>

      <div
        class="progress-track"
        role="progressbar"
        aria-valuenow="78"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-label="Development progress"
      >
        <div class="progress-fill" style="--progress: 78%;">
          <span class="progress-shimmer" aria-hidden="true"></span>
        </div>
      </div>

      <div class="progress-info">
        <span>Tasks completed</span>
        <strong>39 / 50</strong>
      </div>

      <div class="milestones">
        <div class="milestone completed">
          <span class="milestone-dot" aria-hidden="true"></span>
          <span>Planning</span>
        </div>

        <div class="milestone completed">
          <span class="milestone-dot" aria-hidden="true"></span>
          <span>Design</span>
        </div>

        <div class="milestone active">
          <span class="milestone-dot" aria-hidden="true"></span>
          <span>Development</span>
        </div>

        <div class="milestone">
          <span class="milestone-dot" aria-hidden="true"></span>
          <span>Launch</span>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
