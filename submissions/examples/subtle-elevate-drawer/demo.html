<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CSS Subtle Elevate Drawer component">
  <title>Subtle Elevate Drawer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="demo">
    <section class="drawer-demo" aria-labelledby="drawer-title">
      <div class="drawer-panel">
        <div class="drawer-header">
          <div>
            <span class="drawer-label">Navigation</span>
            <h1 id="drawer-title">Subtle Elevate</h1>
          </div>

          <button class="drawer-close" type="button" aria-label="Close drawer">
            &times;
          </button>
        </div>

        <nav class="drawer-nav" aria-label="Main navigation">
          <a href="#" class="drawer-link active">
            <span>⌂</span>
            <span>Dashboard</span>
          </a>

          <a href="#" class="drawer-link">
            <span>◈</span>
            <span>Projects</span>
          </a>

          <a href="#" class="drawer-link">
            <span>○</span>
            <span>Messages</span>
          </a>

          <a href="#" class="drawer-link">
            <span>⚙</span>
            <span>Settings</span>
          </a>
        </nav>

        <div class="drawer-footer">
          <div class="profile">
            <span class="avatar" aria-hidden="true">SN</span>
            <div>
              <strong>Subtle UI</strong>
              <small>Design system</small>
            </div>
          </div>
        </div>
      </div>

      <div class="drawer-content" aria-hidden="true">
        <span>CONTENT AREA</span>
      </div>
    </section>
  </main>

</body>
</html>
