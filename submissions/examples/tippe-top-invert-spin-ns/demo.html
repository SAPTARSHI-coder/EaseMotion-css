<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tippe Top Invert Spin | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="tippe-demo-container">
    <header class="tippe-demo-header">
      <h1>Tippe Top Invert Spin</h1>
      <p>Tippe-top toy that spins, tips, and inverts onto its stem in CSS 3D space.</p>
    </header>

    <section class="ease-tippe-top-invert-spin">
      <div class="ease-tippe-top-invert-spin__housing">
        <div class="ease-tippe-top-invert-spin__bezel">
          <div class="ease-tippe-top-invert-spin__face">
            <div class="ease-tippe-top-invert-spin__motion" aria-hidden="true">
              <span class="ease-tippe-top-invert-spin__a"></span>
              <span class="ease-tippe-top-invert-spin__b"></span>
              <span class="ease-tippe-top-invert-spin__c"></span>
              <span class="ease-tippe-top-invert-spin__d"></span>
            </div>
          </div>
        </div>
      </div>
    </section>

    <p class="tippe-demo-hint">💡 Demonstrates friction-driven 3D rotational precession and vertical inversion.</p>
  </main>
</body>
</html>
