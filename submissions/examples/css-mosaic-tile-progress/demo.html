<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Mosaic Tile Progress | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <article class="demo-card">
      <header class="card-header">
        <div>
          <h1 class="card-title">Upload Progress</h1>
          <p class="card-subtitle">Syncing asset bundles to server</p>
        </div>
        <span class="progress-percentage">70%</span>
      </header>

      <!-- Accessible Progress Grid Bar -->
      <div 
        class="mosaic-grid" 
        data-progress="70" 
        role="progressbar" 
        aria-valuenow="70" 
        aria-valuemin="0" 
        aria-valuemax="100" 
        aria-label="Upload progress grid (70% completed)"
      >
        <div class="tile"></div>
        <div class="tile"></div>
        <div class="tile"></div>
        <div class="tile"></div>
        <div class="tile"></div>
        <div class="tile"></div>
        <div class="tile"></div>
        <div class="tile"></div>
        <div class="tile"></div>
        <div class="tile"></div>
        <div class="tile"></div>
        <div class="tile"></div>
        <div class="tile"></div>
        <div class="tile"></div>
        <div class="tile"></div>
        <div class="tile"></div>
        <div class="tile"></div>
        <div class="tile"></div>
        <div class="tile"></div>
        <div class="tile"></div>
      </div>

      <footer class="card-footer">
        <span class="status-badge">
          <span class="status-dot" aria-hidden="true"></span>
          Processing
        </span>
        <span>14 / 20 Blocks Loaded</span>
      </footer>
    </article>
  </main>
</body>
</html>
