<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cryptograph Disc Align — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Cryptograph Disc Align demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Cryptograph Disc Align</h1>
      <p class="lede">Cryptograph discs lining up a substitution</p>
    </header>

    <section class="ease-cryptograph-disc-align" data-demo="cryptograph-disc-align" aria-live="polite">
      <div class="ease-cryptograph-disc-align__housing">
        <div class="ease-cryptograph-disc-align__bezel">
          <div class="ease-cryptograph-disc-align__face">
            <div class="ease-cryptograph-disc-align__readout">
              <span class="ease-cryptograph-disc-align__label">Cryptograph Disc Align</span>
              <span class="ease-cryptograph-disc-align__value">LIVE</span>
            </div>
            <div class="ease-cryptograph-disc-align__motion" aria-hidden="true">
              <span class="ease-cryptograph-disc-align__a"></span>
              <span class="ease-cryptograph-disc-align__b"></span>
              <span class="ease-cryptograph-disc-align__c"></span>
              <span class="ease-cryptograph-disc-align__d"></span>
            </div>
            <div class="ease-cryptograph-disc-align__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-cryptograph-disc-align__controls">
          <button type="button" class="ease-cryptograph-disc-align__btn primary">Set</button>
          <button type="button" class="ease-cryptograph-disc-align__btn">Spin</button>
          <label class="ease-cryptograph-disc-align__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-cryptograph-disc-align__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
