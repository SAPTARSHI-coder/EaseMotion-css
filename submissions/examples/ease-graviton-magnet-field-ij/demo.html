<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Graviton Magnet Field Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="lab" aria-label="magnet field">
    <div class="magnet m-left" aria-hidden="true">
      <span class="pole"></span>
      <span class="pole"></span>
    </div>
    <div class="magnet m-right" aria-hidden="true">
      <span class="pole"></span>
      <span class="pole"></span>
    </div>
    <span class="field-line f1" aria-hidden="true"></span>
    <span class="field-line f2" aria-hidden="true"></span>
    <span class="field-line f3" aria-hidden="true"></span>
    <div class="metal-ball" id="ball" aria-hidden="true"></div>
    <button class="toggle-btn" id="toggleBtn" type="button">Reverse Polarity</button>
    <p class="caption">The ball is pulled between two opposing magnets.</p>
  </main>
  <script>
    const ball = document.getElementById("ball");
    const lab = document.querySelector(".lab");
    const btn = document.getElementById("toggleBtn");
    btn.addEventListener("click", () => {
      lab.classList.toggle("reverse");
      btn.textContent = lab.classList.contains("reverse") ? "Restore Polarity" : "Reverse Polarity";
    });
  </script>
</body>
</html>
