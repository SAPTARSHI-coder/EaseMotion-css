<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Printer Layer Build — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Printer Layer Build demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Printer Layer Build</h1>
      <p class="lede">3D printer nozzle laying successive filament layers</p>
    </header>

    <section class="ease-printer-layer-build" data-demo="printer-layer-build" aria-live="polite">
      <div class="ease-printer-layer-build__housing">
        <div class="ease-printer-layer-build__bezel">
          <div class="ease-printer-layer-build__face">
            <div class="ease-printer-layer-build__readout">
              <span class="ease-printer-layer-build__label">Printer Layer Build</span>
              <span class="ease-printer-layer-build__value" id="val-printer-layer-build">READY</span>
            </div>
            <div class="ease-printer-layer-build__motion" aria-hidden="true">
              <span class="ease-printer-layer-build__arm"></span>
              <span class="ease-printer-layer-build__core"></span>
              <span class="ease-printer-layer-build__trail"></span>
              <span class="ease-printer-layer-build__mark m1"></span>
              <span class="ease-printer-layer-build__mark m2"></span>
              <span class="ease-printer-layer-build__mark m3"></span>
            </div>
            <div class="ease-printer-layer-build__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-printer-layer-build__controls">
          <button type="button" class="ease-printer-layer-build__btn primary">Engage</button>
          <button type="button" class="ease-printer-layer-build__btn">Reset</button>
          <label class="ease-printer-layer-build__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-printer-layer-build__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
