<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pulse Garden</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="garden-app">

  <header>
    <span>🌱 PULSE GARDEN</span>
    <h1>A garden with a heartbeat.</h1>
    <p>Plant flowers and watch the garden breathe.</p>
  </header>

  <main id="garden">

    <div class="heart">
      <div class="heart-core">♥</div>
    </div>

    <div id="flowers"></div>

    <div class="ground"></div>

    <div class="hint" id="hint">
      Click anywhere to plant a flower
    </div>

  </main>

  <section class="controls">

    <label>
      Pulse
      <span id="pulseValue">60%</span>
    </label>

    <input
      id="pulse"
      type="range"
      min="20"
      max="100"
      value="60"
    >

    <button id="plant">🌱 Plant Flower</button>
    <button id="reset">↻ Reset</button>

    <strong>
      Flowers: <span id="count">0</span>
    </strong>

  </section>

</div>

<script>
const garden = document.getElementById("garden");
const flowers = document.getElementById("flowers");
const pulse = document.getElementById("pulse");
const pulseValue = document.getElementById("pulseValue");
const count = document.getElementById("count");

let flowerCount = 0;

const colors = [
  "rose",
  "violet",
  "gold",
  "cyan"
];

function plantFlower(x, y) {

  const flower = document.createElement("div");
  flower.className = "flower";

  const type = colors[
    Math.floor(Math.random() * colors.length)
  ];

  flower.classList.add(type);

  flower.innerHTML = `
    <div class="petals">
      <i></i><i></i><i></i><i></i>
      <i></i><i></i><i></i><i></i>
    </div>
    <div class="stem"></div>
  `;

  flower.style.left = `${x}px`;
  flower.style.top = `${y}px`;
  flower.style.setProperty(
    "--delay",
    `${Math.random() * 1.5}s`
  );

  flowers.appendChild(flower);

  flowerCount++;
  count.textContent = flowerCount;
}

garden.addEventListener("click", e => {

  if (
    e.target.closest(".heart") ||
    e.target.closest(".hint")
  ) return;

  const rect = garden.getBoundingClientRect();

  plantFlower(
    e.clientX - rect.left,
    e.clientY - rect.top
  );
});

pulse.addEventListener("input", () => {

  pulseValue.textContent =
    `${pulse.value}%`;

  document.documentElement.style.setProperty(
    "--pulse-speed",
    `${1.8 - pulse.value / 100}s`
  );
});

document.getElementById("plant").onclick = () => {

  plantFlower(
    Math.random() * garden.clientWidth,
    garden.clientHeight * .65
  );
};

document.getElementById("reset").onclick = () => {

  flowers.innerHTML = "";
  flowerCount = 0;
  count.textContent = "0";
};

document.addEventListener("keydown", e => {

  if (e.code === "Space") {
    e.preventDefault();
    document.getElementById("plant").click();
  }

  if (e.key.toLowerCase() === "r") {
    document.getElementById("reset").click();
  }

});

setInterval(() => {

  document.querySelectorAll(".flower")
    .forEach(flower => {

      const pollen = document.createElement("span");
      pollen.className = "pollen";

      pollen.style.left =
        `${Math.random() * 30 - 15}px`;

      pollen.style.top =
        `${Math.random() * -10}px`;

      flower.appendChild(pollen);

      setTimeout(() => pollen.remove(), 1200);
    });

}, 1800);
</script>

</body>
</html>
