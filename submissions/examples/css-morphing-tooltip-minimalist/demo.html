<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Morphing Tooltip | Minimalist Styling</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="tooltip-card" aria-label="Morphing Tooltip Showcase">
    <h1 class="card-title">Morphing Tooltip</h1>
    <p class="card-desc">Hover or focus over the trigger element below to trigger the spring morphing tooltip expansion.</p>

    <div class="tooltip-wrapper">
        <button class="tooltip-trigger" aria-describedby="tooltip-content">
            <svg class="trigger-icon" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="16" x2="12" y2="12"></line>
                <line x1="12" y1="8" x2="12.01" y2="8"></line>
            </svg>
            <span>Hover For Info</span>
        </button>

        <div id="tooltip-content" class="morphing-tooltip" role="tooltip">
            <div class="tooltip-header">System Insight</div>
            <p class="tooltip-body">This tooltip utilizes smooth CSS cubic-bezier spring scaling and opacity transitions without relying on JavaScript.</p>
        </div>
    </div>
</main>

</body>
</html>
