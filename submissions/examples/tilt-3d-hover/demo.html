<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tilt 3D Hover Demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #1a1a1a;
      font-family: sans-serif;
      margin: 0;
    }
    .card {
      width: 250px;
      height: 350px;
      background: linear-gradient(135deg, #6e8efb, #a777e3);
      border-radius: 16px;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.5rem;
      font-weight: bold;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      /* Custom timing for demo */
      --ease-duration: 0.5s;
      --ease-timing: ease-out;
    }
  </style>
</head>
<body>

  <div class="card ease-anim-tilt-3d-hover">
    Hover Me
  </div>

</body>
</html>
