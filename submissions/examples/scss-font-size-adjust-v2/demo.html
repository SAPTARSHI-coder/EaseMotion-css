<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EaseMotion - Font Size Adjust v2 Demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      font-family: system-ui, sans-serif;
      padding: 2rem;
      background-color: #f8f9fa;
      color: #212529;
    }
    .demo-container {
      max-width: 800px;
      margin: 0 auto;
      background: #ffffff;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }
    .demo-card {
      margin-bottom: 2rem;
      padding: 1rem;
      border-left: 4px solid #4a90e2;
      background: #f1f5f9;
    }
  </style>
</head>
<body>

  <div class="demo-container">
    <h1>EaseMotion: CSS Font Size Adjust v2</h1>
    <p>This demo tests x-height visual consistency across web-safe fallbacks.</p>

    <div class="demo-card">
      <h2 class="demo-card__title">Adjusted Title Font (Aspect Ratio: 0.52)</h2>
      <p class="demo-card__body">
        This body text applies `font-size-adjust: 0.48` to preserve legibility when switching between primary and secondary fallback serif fonts.
      </p>
    </div>
  </div>

</body>
</html>
