<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SaaS Header Accessibility</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="saas-header">
  <a href="#" class="brand">CloudFlow</a>

  <button
    class="menu-toggle"
    type="button"
    aria-label="Open navigation menu"
    aria-expanded="false"
    aria-controls="main-navigation">
    ☰
  </button>

  <nav id="main-navigation" class="navbar" aria-label="Main navigation">
    <a href="#features">Features</a>
    <a href="#pricing">Pricing</a>
    <a href="#solutions">Solutions</a>
    <a href="#resources">Resources</a>
    <a href="#contact">Contact</a>
  </nav>

  <a href="#signup" class="cta">Get Started</a>
</header>

<main>
  <section class="hero">
    <h1>Accessible SaaS Navigation</h1>
    <p>
      A responsive header with keyboard-friendly navigation.
    </p>
  </section>
</main>

<script>
  const toggle = document.querySelector(".menu-toggle");
  const navigation = document.querySelector("#main-navigation");

  toggle.addEventListener("click", () => {
    const expanded = toggle.getAttribute("aria-expanded") === "true";

    toggle.setAttribute("aria-expanded", String(!expanded));
    toggle.setAttribute(
      "aria-label",
      expanded ? "Open navigation menu" : "Close navigation menu"
    );

    navigation.classList.toggle("is-open");
  });
</script>

</body>
</html>
