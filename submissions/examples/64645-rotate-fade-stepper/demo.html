<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rotate Fade Stepper</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<section class="stepper-section">

  <h1>Project Workflow</h1>
  <p class="subtitle">Simple steps for modern development</p>

  <div class="stepper">

    <div class="step">
      <div class="circle">01</div>
      <div class="content">
        <h2>Planning</h2>
        <p>Define ideas and project requirements.</p>
      </div>
    </div>

    <div class="step">
      <div class="circle">02</div>
      <div class="content">
        <h2>Design</h2>
        <p>Create clean and minimal interfaces.</p>
      </div>
    </div>

    <div class="step">
      <div class="circle">03</div>
      <div class="content">
        <h2>Development</h2>
        <p>Build scalable and optimized solutions.</p>
      </div>
    </div>

    <div class="step">
      <div class="circle">04</div>
      <div class="content">
        <h2>Launch</h2>
        <p>Deploy the final product successfully.</p>
      </div>
    </div>

  </div>

</section>

</body>
</html>
