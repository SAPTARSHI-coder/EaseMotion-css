
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Minimalist floating notification toast with auto-dismiss timer">
  <title>Floating Notification Toast</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="demo">
    <section class="intro">
      <span class="eyebrow">UI COMPONENT</span>
      <h1>Floating Notification Toast</h1>
      <p>Minimalist clean notification with an auto-dismiss timer.</p>

      <button class="show-btn" id="showToast">
        Show Notification
      </button>
    </section>
  </main>

  <div class="toast-container" id="toastContainer" aria-live="polite">
    <article class="toast" id="toast" role="status" aria-label="Notification">
      <div class="toast-icon" aria-hidden="true">✓</div>

      <div class="toast-content">
        <strong>Changes saved</strong>
        <p>Your preferences have been updated successfully.</p>
      </div>

      <button
        class="close-btn"
        id="closeToast"
        aria-label="Close notification"
      >
        &times;
      </button>

      <div class="timer-bar" aria-hidden="true">
        <span></span>
      </div>
    </article>
  </div>

  <script>
    const showButton = document.getElementById("showToast");
    const closeButton = document.getElementById("closeToast");
    const toast = document.getElementById("toast");

    let dismissTimer;

    function showToast() {
      clearTimeout(dismissTimer);

      toast.classList.remove("hide");
      toast.classList.add("show");

      dismissTimer = setTimeout(() => {
        hideToast();
      }, 5000);
    }

    function hideToast() {
      clearTimeout(dismissTimer);
      toast.classList.remove("show");
      toast.classList.add("hide");
    }

    showButton.addEventListener("click", showToast);
    closeButton.addEventListener("click", hideToast);

    showToast();
  </script>

</body>
</html>
