<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Responsive neumorphic toggle with dark mode styling">
  <title>Neumorphic Dark Mode Toggle</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="page">
    <section class="toggle-card" aria-labelledby="toggle-title">

      <div class="content">
        <span class="eyebrow">APPEARANCE</span>
        <h1 id="toggle-title">Dark Mode</h1>
        <p id="mode-description">Switch between light and dark appearance.</p>
      </div>

      <label class="theme-toggle">
        <input
          type="checkbox"
          id="themeToggle"
          aria-label="Toggle dark mode"
          aria-describedby="mode-description"
        >
        <span class="slider" aria-hidden="true">
          <span class="knob"></span>
        </span>
      </label>

    </section>
  </main>

  <script>
    const toggle = document.getElementById("themeToggle");
    const body = document.body;

    toggle.addEventListener("change", () => {
      body.classList.toggle("dark", toggle.checked);
    });
  </script>

</body>
</html>
