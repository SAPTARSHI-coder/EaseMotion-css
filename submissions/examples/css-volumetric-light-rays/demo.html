<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Volumetric Light Rays</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="scene">
        <!-- The background text/logo that emits light -->
        <div class="light-source">RADIANCE</div>
        
        <!-- The container for the volumetric rays -->
        <div class="rays-container">
            <div class="ray ray-1"></div>
            <div class="ray ray-2"></div>
        </div>
        
        <!-- The foreground text to block the light and create the "god rays" effect -->
        <div class="foreground">RADIANCE</div>
    </div>
</body>
</html>
