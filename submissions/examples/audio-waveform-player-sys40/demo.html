<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Audio Waveform Player with Real-time Frequency Spectrum</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../easemotion.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>Audio Waveform Player</h1>
      <p>Animated SVG waveform bars with playback scrub controls.</p>
    </header>

    <main class="player-card">
      <div class="waveform-bars">
        <div class="wave-bar h-1"></div>
        <div class="wave-bar h-3"></div>
        <div class="wave-bar h-2"></div>
        <div class="wave-bar h-4"></div>
        <div class="wave-bar h-2"></div>
        <div class="wave-bar h-3"></div>
      </div>
      <button class="play-btn" onclick="togglePlay(this)">▶ Play</button>
    </main>
  </div>

  <script>
    function togglePlay(btn) {
      const bars = document.querySelectorAll('.wave-bar');
      const isPlaying = btn.textContent.includes('Pause');
      btn.textContent = isPlaying ? '▶ Play' : '⏸ Pause';
      bars.forEach(b => b.style.animationPlayState = isPlaying ? 'paused' : 'running');
    }
  </script>
</body>
</html>
