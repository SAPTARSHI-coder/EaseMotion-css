<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ease-confetti-bh</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #0f172a; min-height: 100vh; padding: 2rem; color: #f1f5f9; }
    .container { max-width: 900px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 3rem; padding: 2rem; background: rgba(30, 41, 59, 0.8); border-radius: 1rem; }
    header h1 { font-size: 2rem; font-weight: 700; background: linear-gradient(135deg, #f472b6, #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 0.5rem; }
    header p { color: #94a3b8; }
    .demo-section { background: rgba(30, 41, 59, 0.8); border: 1px solid rgba(148, 163, 184, 0.1); border-radius: 1rem; padding: 2rem; margin-bottom: 2rem; }
    .demo-section h2 { font-size: 1.25rem; margin-bottom: 1.5rem; color: #e2e8f0; }
    .demo-item { margin-bottom: 2rem; padding: 2rem; background: rgba(15, 23, 42, 0.5); border-radius: 0.75rem; text-align: center; }
    .demo-item h3 { font-size: 1rem; color: #94a3b8; margin-bottom: 1rem; }
    .code-block { background: #1e293b; padding: 1rem; border-radius: 0.5rem; font-family: 'Courier New', monospace; font-size: 0.875rem; margin-top: 1rem; overflow-x: auto; text-align: left; }
    .demo-buttons { display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>ease-confetti-bh</h1>
      <p>Pure CSS Confetti Burst Animation</p>
    </header>
    
    <section class="demo-section">
      <h2>Confetti Burst Examples</h2>
      
      <div class="demo-item">
        <h3>Click the Button to See Confetti!</h3>
        <div class="demo-buttons">
          <button class="ease-confetti-trigger-bh">
            <span class="ease-confetti-bh"></span>
            <span class="ease-confetti-bh"></span>
            <span class="ease-confetti-bh"></span>
            <span class="ease-confetti-bh"></span>
            <span class="ease-confetti-bh"></span>
            <span class="ease-confetti-bh"></span>
            <span class="ease-confetti-bh"></span>
            <span class="ease-confetti-bh"></span>
            🎉 Celebrate!
          </button>
        </div>
        <div class="code-block">&lt;button class="ease-confetti-trigger-bh"&gt;<br>&nbsp;&nbsp;&lt;span class="ease-confetti-bh"&gt;&lt;/span&gt;<br>&nbsp;&nbsp;... (8 confetti elements)<br>&nbsp;&nbsp;Click Me<br>&lt;/button&gt;</div>
      </div>
      
      <div class="demo-item">
        <h3>Success Button</h3>
        <div class="demo-buttons">
          <button class="ease-confetti-trigger-bh" style="background: linear-gradient(135deg, #10b981, #059669);">
            <span class="ease-confetti-bh"></span>
            <span class="ease-confetti-bh"></span>
            <span class="ease-confetti-bh"></span>
            <span class="ease-confetti-bh"></span>
            <span class="ease-confetti-bh"></span>
            <span class="ease-confetti-bh"></span>
            <span class="ease-confetti-bh"></span>
            <span class="ease-confetti-bh"></span>
            ✅ Success!
          </button>
        </div>
      </div>
      
      <div class="demo-item">
        <h3>Primary Button</h3>
        <div class="demo-buttons">
          <button class="ease-confetti-trigger-bh" style="background: linear-gradient(135deg, #3b82f6, #2563eb);">
            <span class="ease-confetti-bh"></span>
            <span class="ease-confetti-bh"></span>
            <span class="ease-confetti-bh"></span>
            <span class="ease-confetti-bh"></span>
            <span class="ease-confetti-bh"></span>
            <span class="ease-confetti-bh"></span>
            <span class="ease-confetti-bh"></span>
            <span class="ease-confetti-bh"></span>
            Submit Form
          </button>
        </div>
      </div>
    </section>
  </div>
</body>
</html>
