<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CSS Gradient Picker demonstration">
  <title>CSS Gradient Picker</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="gradient-picker">
    <h1>CSS Gradient Picker</h1>
    <p>Choose colors and preview a CSS gradient.</p>

    <section class="controls" aria-label="Gradient controls">
      <label>
        Color 1
        <input type="color" value="#6a11cb" aria-label="Choose first gradient color">
      </label>

      <label>
        Color 2
        <input type="color" value="#2575fc" aria-label="Choose second gradient color">
      </label>

      <label>
        Direction
        <select aria-label="Choose gradient direction">
          <option>to right</option>
          <option>to left</option>
          <option>to bottom</option>
          <option>to top</option>
        </select>
      </label>
    </section>

    <div class="preview" role="img" aria-label="Gradient preview"></div>

    <pre class="code-output"><code>background: linear-gradient(to right, #6a11cb, #2575fc);</code></pre>
  </main>
</body>
</html>
