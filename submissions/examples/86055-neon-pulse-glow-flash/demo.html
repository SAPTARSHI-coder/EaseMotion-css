<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <title>Neon Pulse Glow Flash</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="demo">
    <header class="demo-header">
      <p class="eyebrow">EaseMotion Core Animation</p>

      <h1>Neon Pulse Glow Flash</h1>

      <p class="description">
        A reusable neon pulse animation that creates a smooth glowing
        flash effect using CSS keyframes.
      </p>
    </header>

    <section class="demo-stage">
      <div class="neon-card ease-anim-neon-pulse-glow-flash">
        <div class="neon-card__content">
          <span class="neon-card__icon" aria-hidden="true">✦</span>

          <h2>NEON</h2>

          <p>Pulse Glow</p>
        </div>
      </div>
    </section>

    <p class="demo-hint">
      CSS-only animation · Hardware-friendly transforms and opacity
    </p>
  </main>
</body>
</html>
