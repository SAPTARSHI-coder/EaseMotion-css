<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Ease — Fluid Accordion (demo)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Simple demo by Geethika — tested on Chrome & Firefox -->
  <main class="demo">
    <h1>Ease — Fluid Accordion (simple demo)</h1>

    <section class="ease-accordion" aria-label="Example accordion">
      <div class="accordion__item" data-expanded="false">
        <button class="accordion__header" type="button">Section A</button>
        <div class="accordion__panel" aria-hidden="true">
          <div class="accordion__inner">
            <p>Simple content for Section A. Smooth height transition + fade.</p>
          </div>
        </div>
      </div>

      <div class="accordion__item" data-expanded="false">
        <button class="accordion__header" type="button">Section B (nested)</button>
        <div class="accordion__panel" aria-hidden="true">
          <div class="accordion__inner">
            <p>Section B contains a small nested accordion below.</p>

            <div class="ease-accordion nested-accordion" aria-label="Nested">
              <div class="accordion__item" data-expanded="false">
                <button class="accordion__header" type="button">Nested 1</button>
                <div class="accordion__panel" aria-hidden="true">
                  <div class="accordion__inner">
                    <p>Nested content 1</p>
                  </div>
                </div>
              </div>

              <div class="accordion__item" data-expanded="false">
                <button class="accordion__header" type="button">Nested 2</button>
                <div class="accordion__panel" aria-hidden="true">
                  <div class="accordion__inner">
                    <p>Nested content 2</p>
                  </div>
                </div>
              </div>
            </div>
            <!-- end nested -->
          </div>
        </div>
      </div>

      <div class="accordion__item" data-expanded="false">
        <button class="accordion__header" type="button">Section C</button>
        <div class="accordion__panel" aria-hidden="true">
          <div class="accordion__inner">
            <p>Keyboard friendly: Arrow Up/Down, Home/End, Space/Enter.</p>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script>
  (function () {
    // minimal accessible accordion initializer
    function initAccordion(root) {
      const items = Array.from(root.querySelectorAll(':scope > .accordion__item'));
      items.forEach((item, i) => {
        const btn = item.querySelector('.accordion__header');
        const panel = item.querySelector('.accordion__panel');
        if (!btn.id) btn.id = `gf-${i}-h`;
        if (!panel.id) panel.id = `gf-${i}-p`;
        btn.setAttribute('aria-controls', panel.id);
        btn.setAttribute('aria-expanded', item.dataset.expanded === 'true' ? 'true' : 'false');
        panel.setAttribute('aria-labelledby', btn.id);
        panel.setAttribute('aria-hidden', item.dataset.expanded === 'true' ? 'false' : 'true');

        const closeItem = () => {
          btn.setAttribute('aria-expanded', 'false');
          panel.setAttribute('aria-hidden', 'true');
          item.dataset.expanded = 'false';
        };
        const openItem = () => {
          btn.setAttribute('aria-expanded', 'true');
          panel.setAttribute('aria-hidden', 'false');
          item.dataset.expanded = 'true';
        };

        btn.addEventListener('click', () => {
          const expanded = btn.getAttribute('aria-expanded') === 'true';
          if (!expanded) {
            items.forEach(it => {
              if (it !== item) {
                it.querySelector('.accordion__header').setAttribute('aria-expanded','false');
                it.querySelector('.accordion__panel').setAttribute('aria-hidden','true');
                it.dataset.expanded = 'false';
              }
            });
            openItem();
          } else {
            closeItem();
          }
        });

        btn.addEventListener('keydown', (ev) => {
          const key = ev.key;
          const idx = items.indexOf(item);
          if (key === 'ArrowDown') {
            ev.preventDefault();
            items[(idx + 1) % items.length].querySelector('.accordion__header').focus();
          } else if (key === 'ArrowUp') {
            ev.preventDefault();
            items[(idx - 1 + items.length) % items.length].querySelector('.accordion__header').focus();
          } else if (key === 'Home') {
            ev.preventDefault();
            items[0].querySelector('.accordion__header').focus();
          } else if (key === 'End') {
            ev.preventDefault();
            items[items.length - 1].querySelector('.accordion__header').focus();
          } else if (key === ' ' || key === 'Enter') {
            ev.preventDefault();
            btn.click();
          }
        });
      });
    }

    document.addEventListener('DOMContentLoaded', function () {
      document.querySelectorAll('.ease-accordion').forEach(root => initAccordion(root));
    });
  })();
  </script>
</body>
</html>
