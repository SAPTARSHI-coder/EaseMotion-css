<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Compare Table Test Submission</title>
  <link rel="stylesheet" href="../../../easemotion.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="ease-compare-table-container">
    <table class="ease-compare-table">
      <thead>
        <tr>
          <th>Features</th>
          <th>Basic</th>
          <th class="is-featured">
            <span class="is-featured-label">Pro</span>
            <br>Advanced
          </th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td class="ease-compare-row-header">Feature A</td>
          <td><span class="ease-icon-check"></span></td>
          <td class="is-featured"><span class="ease-icon-check"></span></td>
        </tr>
        <tr>
          <td class="ease-compare-row-header">Feature B</td>
          <td><span class="ease-icon-cross"></span></td>
          <td class="is-featured"><span class="ease-icon-check"></span></td>
        </tr>
      </tbody>
    </table>
  </div>
</body>
</html>
