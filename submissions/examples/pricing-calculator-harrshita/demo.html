<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pricing Calculator | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="demo-header">
    <h1>Pricing Calculator Widget</h1>
    <p>Interactive tier price calculator with custom range input sliders.</p>
  </header>

  <main class="demo-main">
    <section class="demo-section">
      <div class="ease-calc-card">
        <h3>Select User Capacity</h3>
        <input type="range" min="10" max="500" value="50" class="ease-calc-range" id="rangeInput" />
        <div class="ease-calc-result">$<span id="priceVal">49</span>/month</div>
      </div>
    </section>
  </main>
  <footer class="demo-footer"><p>EaseMotion CSS Project</p></footer>

  <script>
    const range = document.getElementById('rangeInput');
    const val = document.getElementById('priceVal');
    range.addEventListener('input', (e) => val.textContent = e.target.value * 0.98);
  </script>
</body>
</html>
