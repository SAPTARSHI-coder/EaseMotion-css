<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Sword Slash Button</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="demo">
    <h1>CSS Sword Slash Button</h1>

    <p class="description">
      A diagonal sword slash sweeps across the button when activated.
    </p>

    <button class="sword-button" type="button" aria-label="Activate sword slash">
      <span class="button-text">SLASH</span>
      <span class="slash" aria-hidden="true"></span>
    </button>

    <p class="hint">
      Hover or focus the button to trigger the slash animation.
    </p>
  </main>

</body>
</html>
