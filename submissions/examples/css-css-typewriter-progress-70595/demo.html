<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Typewriter Progress - EaseMotion</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="tw" aria-label="Typewriter progress">
      <p class="tw-text" aria-hidden="false">Loading...</p>
      <div class="tw-bar" aria-hidden="true"><span class="tw-fill"></span></div>
      <p class="tw-status">Initializing scene analyzer</p>
    </div>
  </body>
</html>
