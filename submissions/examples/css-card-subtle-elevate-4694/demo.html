<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subtle Elevate Card Demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f0f2f5;
      font-family: system-ui, -apple-system, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      body {
        background-color: #121212;
      }
    }
    .card-title {
      margin-top: 0;
      margin-bottom: 12px;
      font-size: 1.25rem;
    }
    .card-content {
      margin: 0;
      font-size: 1rem;
      line-height: 1.5;
      color: inherit;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div class="subtle-elevate-card-4694">
    <h2 class="card-title">Subtle Elevate Card</h2>
    <p class="card-content">This card uses smooth CSS transitions to gently lift off the page when hovered, providing a premium and tactile feel.</p>
  </div>
</body>
</html>
