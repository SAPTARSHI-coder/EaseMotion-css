<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Morph-Glow Carousel - EaseMotion CSS</title>
  <!-- Import EaseMotion CSS -->
  <link rel="stylesheet" href="../../../easemotion.css">
  <!-- Component Specific Styles -->
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body class="fintech-bg">

  <div class="demo-container">
    
    <div class="dashboard-panel ease-glass-card">
      <div class="dashboard-header">
        <h2 class="ease-text-xl">Your Wallets</h2>
        <button class="add-btn ease-squish-button">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        </button>
      </div>

      <!-- Morph-Glow Carousel (Pure CSS Radio Logic) -->
      <div class="carousel-container">
        
        <!-- State Controllers -->
        <input type="radio" name="wallet_carousel" id="wallet-1" class="carousel-radio" checked>
        <input type="radio" name="wallet_carousel" id="wallet-2" class="carousel-radio">
        <input type="radio" name="wallet_carousel" id="wallet-3" class="carousel-radio">

        <!-- Carousel Track -->
        <div class="carousel-track">
          
          <!-- Slide 1 -->
          <div class="carousel-slide">
            <!-- The glowing background that morphs -->
            <div class="morph-glow glow-primary"></div>
            <!-- The actual card -->
            <div class="wallet-card card-primary">
              <div class="card-top">
                <span class="card-type">Checking</span>
                <svg width="32" height="20" viewBox="0 0 32 20" fill="none"><circle cx="10" cy="10" r="10" fill="#eb001b" fill-opacity="0.8"></circle><circle cx="22" cy="10" r="10" fill="#f79e1b" fill-opacity="0.8"></circle></svg>
              </div>
              <div class="card-chip">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="4" y="4" width="16" height="16" rx="2" ry="2"></rect><rect x="9" y="9" width="6" height="6"></rect><line x1="9" y1="1" x2="9" y2="4"></line><line x1="15" y1="1" x2="15" y2="4"></line><line x1="9" y1="20" x2="9" y2="23"></line><line x1="15" y1="20" x2="15" y2="23"></line><line x1="20" y1="9" x2="23" y2="9"></line><line x1="20" y1="14" x2="23" y2="14"></line><line x1="1" y1="9" x2="4" y2="9"></line><line x1="1" y1="14" x2="4" y2="14"></line></svg>
              </div>
              <div class="card-balance">
                <span class="currency">$</span>12,450.00
              </div>
              <div class="card-bottom">
                <span class="card-number">**** **** **** 4281</span>
              </div>
            </div>
          </div>

          <!-- Slide 2 -->
          <div class="carousel-slide">
            <div class="morph-glow glow-secondary"></div>
            <div class="wallet-card card-secondary">
              <div class="card-top">
                <span class="card-type">Savings</span>
                <svg width="32" height="20" viewBox="0 0 32 20" fill="none"><circle cx="10" cy="10" r="10" fill="#fff" fill-opacity="0.6"></circle><circle cx="22" cy="10" r="10" fill="#fff" fill-opacity="0.6"></circle></svg>
              </div>
              <div class="card-chip">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="4" y="4" width="16" height="16" rx="2" ry="2"></rect><rect x="9" y="9" width="6" height="6"></rect></svg>
              </div>
              <div class="card-balance">
                <span class="currency">$</span>45,200.50
              </div>
              <div class="card-bottom">
                <span class="card-number">**** **** **** 9012</span>
              </div>
            </div>
          </div>

          <!-- Slide 3 -->
          <div class="carousel-slide">
            <div class="morph-glow glow-tertiary"></div>
            <div class="wallet-card card-tertiary">
              <div class="card-top">
                <span class="card-type">Crypto</span>
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20"></path><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
              </div>
              <div class="card-chip">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="4" y="4" width="16" height="16" rx="2" ry="2"></rect><rect x="9" y="9" width="6" height="6"></rect></svg>
              </div>
              <div class="card-balance">
                <span class="currency">₿</span>1.2045
              </div>
              <div class="card-bottom">
                <span class="card-number">bc1q...x2a9</span>
              </div>
            </div>
          </div>

        </div>

        <!-- Carousel Navigation Dots -->
        <div class="carousel-nav">
          <label for="wallet-1" class="nav-dot" tabindex="0" aria-label="View Checking Wallet"></label>
          <label for="wallet-2" class="nav-dot" tabindex="0" aria-label="View Savings Wallet"></label>
          <label for="wallet-3" class="nav-dot" tabindex="0" aria-label="View Crypto Wallet"></label>
        </div>

      </div>

      <!-- Decorative metrics below carousel -->
      <div class="metrics-grid">
        <div class="metric-box">
          <span class="metric-label">Income</span>
          <span class="metric-val positive">+$4,200</span>
        </div>
        <div class="metric-box">
          <span class="metric-label">Expenses</span>
          <span class="metric-val negative">-$1,150</span>
        </div>
      </div>
      
    </div>

  </div>

</body>
</html>
