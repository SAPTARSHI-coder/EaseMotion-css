<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pulsing Notification Badge - EaseMotion CSS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="demo-wrapper">
        <h1>Live Notification Badge</h1>
        <p>A subtle, animation-first indicator for active states.</p>

        <div class="demo-grid">
            <!-- Example 1: Button Notification -->
            <button class="notification-btn">
                <span>Messages</span>
                <span class="pulse-badge">
                    <span class="pulse-ring"></span>
                    <span class="pulse-dot"></span>
                </span>
            </button>

            <!-- Example 2: Profile Status -->
            <div class="profile-card">
                <div class="avatar-wrapper">
                    <img src="https://ui-avatars.com/api/?name=User&background=334155&color=fff" alt="User">
                    <span class="pulse-badge status-absolute">
                        <span class="pulse-ring"></span>
                        <span class="pulse-dot"></span>
                    </span>
                </div>
                <span>Online Now</span>
            </div>
        </div>
    </main>
</body>
</html>
