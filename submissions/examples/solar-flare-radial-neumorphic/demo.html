<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>Solar Flare Radial Neumorphic</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">
    <section class="solar-card" aria-labelledby="solar-title">

      <div class="flare" aria-hidden="true"></div>

      <div class="orbit orbit-one" aria-hidden="true"></div>
      <div class="orbit orbit-two" aria-hidden="true"></div>

      <div class="content">
        <span class="eyebrow">NEUMORPHIC EFFECT</span>

        <h1 id="solar-title">Solar Flare</h1>

        <p>
          A warm radial interface inspired by the energy and glow of
          a solar flare, built entirely with HTML and CSS.
        </p>

        <div class="actions">
          <button class="primary-button" type="button">
            Explore
          </button>

          <button class="secondary-button" type="button">
            Details
          </button>
        </div>
      </div>

      <div class="energy-meter" aria-label="Solar energy status">
        <span class="meter-label">SOLAR ENERGY</span>
        <div class="meter">
          <span></span>
        </div>
        <strong>87%</strong>
      </div>

    </section>
  </main>

</body>
</html>
