<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ease-svg-icon-morph-menu-sap demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f4f4f5;
    }
  </style>
</head>
<body>

  <button class="morph-menu-btn-sap" id="menuBtn" aria-label="Toggle menu" aria-expanded="false">
    <svg viewBox="0 0 24 24">
      <line class="bar bar-top" x1="3" y1="6" x2="21" y2="6"/>
      <line class="bar bar-mid" x1="3" y1="12" x2="21" y2="12"/>
      <line class="bar bar-bottom" x1="3" y1="18" x2="21" y2="18"/>
    </svg>
  </button>

  <script>
    const btn = document.getElementById('menuBtn');
    btn.addEventListener('click', () => {
      const open = btn.classList.toggle('open');
      btn.setAttribute('aria-expanded', open);
    });
  </script>

</body>
</html>
