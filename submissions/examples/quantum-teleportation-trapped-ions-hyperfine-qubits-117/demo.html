<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trapped Ions Hyperfine Qubits - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css"></head><body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030712; color: #ffffff;">

    <div class="ease-card ease-card-glass trap-container">
        <div class="trap-header">
            <h2>Trapped Ions Hyperfine Qubits</h2>
            <span class="ease-badge ease-badge-primary">Ion Trap QC</span>
        </div>
        
        <div class="trap-screen ease-center">
            <div class="trap-flux flux-trap-a"></div>
            <div class="trap-flux flux-trap-b"></div>
            <div class="trap-boundary-ring"></div>
            <div class="trap-core ease-center"></div>
        </div>

        <div class="trap-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Paul Trap, Raman Beams &amp; Motional Modes</span>
            <button class="ease-btn ease-btn-primary ease-btn-sm ease-hover-grow">Run Ion Trap Gate</button>
        </div>
    </div></body></html>
