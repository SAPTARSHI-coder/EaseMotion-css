<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Morphing Progress Bar: Dark Mode</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header class="header">
            <h1 class="title">System Update</h1>
            <p>A pure CSS button that morphs into a progress bar upon interaction.</p>
        </header>

        <main class="content-area">
            
            <div class="morph-container">
                
                <!-- The Checkbox Hack -->
                <input type="checkbox" id="morph-trigger" class="morph-input">
                
                <!-- The Morphing Element -->
                <label for="morph-trigger" class="morph-btn" aria-label="Start Update">
                    
                    <!-- State 1: Initial Text -->
                    <span class="btn-text">Install Update</span>
                    
                    <!-- State 2: Progress Track & Fill -->
                    <span class="progress-track">
                        <span class="progress-fill"></span>
                    </span>
                    
                    <!-- State 3: Success Checkmark -->
                    <span class="success-icon">
                        <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                    </span>
                    
                </label>
                
            </div>
            
        </main>
    </div>

</body>
</html>
