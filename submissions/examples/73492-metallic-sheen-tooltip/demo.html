<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Metallic Sheen CSS Tooltip">
  <title>Metallic Sheen Tooltip</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="page">
    <section class="hero">
      <p class="eyebrow">CSS Tooltip Variation #244</p>
      <h1>Metallic Sheen Tooltip</h1>
      <p class="subtitle">
        A polished tooltip effect built with pure HTML and Vanilla CSS.
      </p>

      <div class="tooltip-demo">
        <button
          class="tooltip-trigger"
          type="button"
          aria-describedby="metallic-tooltip"
        >
          Hover or Focus Me

          <span
            class="tooltip"
            id="metallic-tooltip"
            role="tooltip"
          >
            Metallic Sheen
          </span>
        </button>
      </div>
    </section>

    <section class="examples" aria-label="Tooltip examples">
      <article class="example-card">
        <span class="status-dot"></span>
        <h2>Premium Finish</h2>

        <button
          class="mini-trigger"
          type="button"
          aria-describedby="finish-tooltip"
        >
          View Details
          <span class="tooltip tooltip-left" id="finish-tooltip" role="tooltip">
            Smooth metallic highlight
          </span>
        </button>
      </article>

      <article class="example-card">
        <span class="status-dot"></span>
        <h2>Pure CSS</h2>

        <button
          class="mini-trigger"
          type="button"
          aria-describedby="css-tooltip"
        >
          Learn More
          <span class="tooltip tooltip-right" id="css-tooltip" role="tooltip">
            No JavaScript required
          </span>
        </button>
      </article>

      <article class="example-card">
        <span class="status-dot"></span>
        <h2>Accessible</h2>

        <button
          class="mini-trigger"
          type="button"
          aria-describedby="accessibility-tooltip"
        >
          Check Accessibility
          <span
            class="tooltip tooltip-bottom"
            id="accessibility-tooltip"
            role="tooltip"
          >
            Works with keyboard focus
          </span>
        </button>
      </article>
    </section>
  </main>
</body>
</html>
