<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CSS Glitch-Flicker Toast for Gaming Hub layouts">
  <title>Glitch-Flicker Toast</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="demo">
    <section class="toast-demo" aria-label="Glitch-Flicker Toast demonstration">
      <div class="toast" role="status">
        <span class="toast__icon" aria-hidden="true">!</span>

        <div class="toast__content">
          <span class="toast__label">SYSTEM ALERT</span>
          <h1 class="toast__title">MISSION UPDATED</h1>
          <p class="toast__message">
            Your new gaming objective is ready.
          </p>
        </div>

        <button class="toast__close" type="button" aria-label="Close notification">
          ×
        </button>
      </div>
    </section>
  </main>

</body>
</html>
