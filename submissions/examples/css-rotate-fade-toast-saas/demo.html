<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Rotate-Fade Toast — SaaS Showcase</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="ease-container">
    <p class="ease-eyebrow">System Status</p>
    <h1 class="ease-heading">Backup Notification</h1>
    <p class="ease-subtitle">Toggle or hover the notification to trigger the 3D rotate-fade entrance effect.</p>

    <div class="ease-toast-wrapper">
      <input type="checkbox" id="ease-saas-rotate-toggle" class="ease-toast-input" checked />

      <label for="ease-saas-rotate-toggle" class="ease-trigger-btn">
        Toggle Status Toast
      </label>

      <div class="ease-toast">
        <div class="ease-toast-icon">✓</div>

        <div class="ease-toast-content">
          <p class="ease-toast-title">Automated Backup Complete</p>
          <p class="ease-toast-message">Database snapshot saved to AWS us-east-1 S3 bucket.</p>
        </div>

        <label for="ease-saas-rotate-toggle" class="ease-toast-close" title="Dismiss Notification">✕</label>
      </div>
    </div>
  </main>
</body>
</html>
