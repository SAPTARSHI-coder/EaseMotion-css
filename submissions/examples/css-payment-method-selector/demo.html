```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Accessible CSS payment method selector with animated selection states."
  >
  <title>CSS Payment Method Selector</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="page">
    <section class="payment-card" aria-labelledby="payment-title">
      <div class="payment-header">
        <div>
          <p class="eyebrow">Secure Checkout</p>
          <h1 id="payment-title">Choose payment method</h1>
          <p class="subtitle">
            Select your preferred way to complete the payment.
          </p>
        </div>

        <div class="secure-badge" aria-label="Secure payment">
          <svg
            viewBox="0 0 24 24"
            aria-hidden="true"
            focusable="false"
          >
            <path
              d="M12 3 5 6v5c0 4.6 2.9 8.7 7 10
              4.1-1.3 7-5.4 7-10V6l-7-3Z"
            />
            <path d="m9 12 2 2 4-4" />
          </svg>
          <span>Secure</span>
        </div>
      </div>

      <form class="payment-form">
        <fieldset>
          <legend class="sr-only">Payment methods</legend>

          <div class="payment-options">

            <!-- Card -->
            <label class="payment-option">
              <input
                type="radio"
                name="payment-method"
                value="card"
                checked
              >

              <span class="option-content">
                <span class="option-icon card-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24">
                    <rect x="3" y="5" width="18" height="14" rx="2" />
                    <path d="M3 10h18" />
                    <path d="M7 15h4" />
                  </svg>
                </span>

                <span class="option-text">
                  <strong>Credit / Debit Card</strong>
                  <small>Visa, Mastercard, RuPay and more</small>
                </span>

                <span class="option-check" aria-hidden="true">
                  <span></span>
                </span>
              </span>
            </label>

            <!-- UPI -->
            <label class="payment-option">
              <input
                type="radio"
                name="payment-method"
                value="upi"
              >

              <span class="option-content">
                <span class="option-icon upi-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24">
                    <path d="M13 2 5 13h6l-1 9 8-12h-6l1-8Z" />
                  </svg>
                </span>

                <span class="option-text">
                  <strong>UPI</strong>
                  <small>Google Pay, PhonePe, Paytm and more</small>
                </span>

                <span class="option-check" aria-hidden="true">
                  <span></span>
                </span>
              </span>
            </label>

            <!-- PayPal -->
            <label class="payment-option">
              <input
                type="radio"
                name="payment-method"
                value="paypal"
              >

              <span class="option-content">
                <span class="option-icon wallet-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24">
                    <path d="M4 7h15a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h12" />
                    <path d="M16 13h5" />
                    <circle cx="16" cy="13" r="1" />
                  </svg>
                </span>

                <span class="option-text">
                  <strong>Digital Wallet</strong>
                  <small>PayPal and supported wallets</small>
                </span>

                <span class="option-check" aria-hidden="true">
                  <span></span>
                </span>
              </span>
            </label>

            <!-- Net Banking -->
            <label class="payment-option">
              <input
                type="radio"
                name="payment-method"
                value="net-banking"
              >

              <span class="option-content">
                <span class="option-icon bank-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24">
                    <path d="m3 9 9-5 9 5" />
                    <path d="M5 10v8M9 10v8M15 10v8M19 10v8" />
                    <path d="M3 20h18" />
                  </svg>
                </span>

                <span class="option-text">
                  <strong>Net Banking</strong>
                  <small>Pay directly from your bank account</small>
                </span>

                <span class="option-check" aria-hidden="true">
                  <span></span>
                </span>
              </span>
            </label>

          </div>
        </fieldset>

        <div class="payment-footer">
          <div class="amount">
            <span>Total amount</span>
            <strong>₹2,499</strong>
          </div>

          <button type="button" class="continue-button">
            Continue
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 12h13" />
              <path d="m13 6 6 6-6 6" />
            </svg>
          </button>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
```
