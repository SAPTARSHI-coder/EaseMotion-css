<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-fortune-wheel-tick demo</title>
</head>
<body>
<div class="fwt-app">
  <span class="fwt-title">FORTUNE WHEEL</span>
  <div class="fwt-stage">
    <span class="fwt-pointer"></span>
    <div class="fwt-wheel">
      <span class="fwt-seg fwt-s1"></span>
      <span class="fwt-seg fwt-s2"></span>
      <span class="fwt-seg fwt-s3"></span>
      <span class="fwt-seg fwt-s4"></span>
      <span class="fwt-seg fwt-s5"></span>
      <span class="fwt-seg fwt-s6"></span>
      <span class="fwt-hub"></span>
    </div>
    <span class="fwt-dial">SPIN</span>
  </div>
  <span class="fwt-prize">GOLD</span>
</div>
</body>
</html>
