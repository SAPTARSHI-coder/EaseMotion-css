<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Pure CSS 3D Perspective Tilt animation."
  >
  <title>3D Perspective Tilt</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="scene">
    <div class="ambient ambient-one" aria-hidden="true"></div>
    <div class="ambient ambient-two" aria-hidden="true"></div>

    <section class="tilt-stage">
      <article class="tilt-card">
        <div class="card-glow" aria-hidden="true"></div>

        <div class="card-content">
          <span class="badge">PURE CSS · 3D</span>

          <div class="icon" aria-hidden="true">
            <span></span>
          </div>

          <h1>Perspective<br><strong>Tilt</strong></h1>

          <p>
            A smooth three-dimensional card effect using CSS perspective,
            layered transforms, and hardware-friendly animations.
          </p>

          <div class="card-meta">
            <span>NO JAVASCRIPT</span>

            <button type="button">
              Explore
              <span aria-hidden="true">↗</span>
            </button>
          </div>
        </div>

        <div class="depth-layer layer-one" aria-hidden="true"></div>
        <div class="depth-layer layer-two" aria-hidden="true"></div>
      </article>
    </section>
  </main>
</body>
</html>
