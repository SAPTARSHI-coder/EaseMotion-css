<!doctype html>
<html lang="en">
<head>

<link rel="stylesheet" href="style.css">
<title>ease-neon-sign-flicker demo</title>
</head>
<body>
<div class="ns-app">
  <span class="ns-title">NEON ALLEY</span>
  <div class="ns-wall">

      <span class="ns-tube ns-tube-2"></span>
      <span class="ns-tube ns-tube-3"></span>
      <span class="ns-tube ns-tube-4"></span>

      <span class="ns-clip ns-clip-2"></span>
      <span class="ns-clip ns-clip-3"></span>
      <span class="ns-clip ns-clip-4"></span>
      <span class="ns-glow"></span>
      <span class="ns-box"></span>
    </div>
  </div>
</div>

</html>
