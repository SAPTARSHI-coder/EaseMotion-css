<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creative Portfolio - Slide-Up Progress Bar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <header class="hero">

        <h1>Creative Portfolio</h1>

        <p>
            Showcase your professional skills using elegant CSS Slide-Up
            Progress Bars with smooth animations and a modern portfolio
            interface built entirely using HTML and CSS.
        </p>

    </header>

    <section class="skills-card">

        <h2>Professional Skills</h2>

        <div class="skill">

            <div class="skill-info">
                <span>UI / UX Design</span>
                <span>95%</span>
            </div>

            <div class="progress">
                <div class="fill ui"></div>
            </div>

        </div>

        <div class="skill">

            <div class="skill-info">
                <span>Frontend Development</span>
                <span>90%</span>
            </div>

            <div class="progress">
                <div class="fill frontend"></div>
            </div>

        </div>

        <div class="skill">

            <div class="skill-info">
                <span>React.js</span>
                <span>88%</span>
            </div>

            <div class="progress">
                <div class="fill react"></div>
            </div>

        </div>

        <div class="skill">

            <div class="skill-info">
                <span>Motion Design</span>
                <span>82%</span>
            </div>

            <div class="progress">
                <div class="fill motion"></div>
            </div>

        </div>

    </section>

</div>

</body>
</html>
