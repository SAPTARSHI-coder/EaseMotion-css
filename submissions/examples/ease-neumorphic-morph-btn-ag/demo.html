<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Neumorphic Morph Button</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="ease-showcase-container">
        <div class="component-wrapper">
            <h2 class="title">Neumorphic Morphing Action</h2>
            <p class="subtitle">Hover and click to see the pure CSS morphing effect.</p>
            
            <label class="morph-container">
                <input type="checkbox" class="morph-input">
                <div class="morph-btn">
                    <span class="morph-icon morph-icon-play">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                    </span>
                    <span class="morph-icon morph-icon-pause">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
                    </span>
                </div>
            </label>
            
        </div>
    </div>
</body>
</html>
