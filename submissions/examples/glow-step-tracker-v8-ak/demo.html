<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Step Progress Tracker — EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <p class="label">Pure CSS Wizard Step Progress Tracker</p>

  <div class="ease-step-progress-v8">
    <div class="ease-step-progress-bar-v8"></div>

    <div class="ease-step-item-v8 ease-step-item-v8--completed">
      <div class="ease-step-circle-v8">✓</div>
      <span class="ease-step-label-v8">Account</span>
    </div>

    <div class="ease-step-item-v8 ease-step-item-v8--active">
      <div class="ease-step-circle-v8">2</div>
      <span class="ease-step-label-v8">Billing</span>
    </div>

    <div class="ease-step-item-v8">
      <div class="ease-step-circle-v8">3</div>
      <span class="ease-step-label-v8">Confirm</span>
    </div>
  </div>

</body>
</html>
