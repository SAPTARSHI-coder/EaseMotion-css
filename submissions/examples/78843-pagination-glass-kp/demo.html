<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS-only Pagination Glassmorphism</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="glass-demo" aria-labelledby="pagination-title">
    <section class="glass-panel">
      <p class="eyebrow">Glassmorphism component</p>
      <h1 id="pagination-title">CSS-only Pagination</h1>
      <p class="summary">Navigate frosted page controls with animated depth, shimmer, and accessible focus states.</p>
      <nav class="pagination" aria-label="Search results pages">
        <a class="page muted" href="#" aria-label="Previous page">Prev</a>
        <a class="page" href="#" aria-label="Page 1">1</a>
        <a class="page active" href="#" aria-current="page">2</a>
        <a class="page" href="#" aria-label="Page 3">3</a>
        <span class="page gap" aria-hidden="true">...</span>
        <a class="page" href="#" aria-label="Page 12">12</a>
        <a class="page next" href="#" aria-label="Next page">Next</a>
      </nav>
    </section>
  </main>
</body>
</html>
