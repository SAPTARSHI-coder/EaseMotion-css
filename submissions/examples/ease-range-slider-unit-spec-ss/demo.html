<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Range Slider Value Change Handler Unit Spec (#86337)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="ease-range-stage" aria-labelledby="stage-title">
    <div class="ease-range-header">
      <h1 id="stage-title" class="ease-range-title">Range Slider Handler Spec</h1>
      <p class="ease-range-desc">Vitest unit specification validating value change handlers, happy paths, and boundary edge cases.</p>
    </div>

    <div class="ease-range-wrapper">
      <div class="ease-range-output-row">
        <span>Volume Level</span>
        <span class="ease-range-value" id="range-val">50</span>
      </div>
      <input type="range" min="0" max="100" value="50" class="ease-range-slider" id="range-input" aria-label="Volume Slider">
    </div>

    <div class="ease-test-log" id="test-log" role="log" aria-live="polite">
      <span>[Vitest] Ready to run unit specifications...</span>
    </div>

    <button type="button" class="ease-btn-test" id="run-specs-btn">Run Vitest Unit Suite</button>
  </main>

  <script>
    const rangeInput = document.getElementById('range-input');
    const rangeVal = document.getElementById('range-val');
    const testLog = document.getElementById('test-log');
    const runSpecsBtn = document.getElementById('run-specs-btn');

    // Value Change Handler function to be tested
    function handleRangeChange(val, min = 0, max = 100) {
      const parsed = Number(val);
      if (isNaN(parsed)) return min;
      if (parsed < min) return min;
      if (parsed > max) return max;
      return parsed;
    }

    rangeInput.addEventListener('input', (e) => {
      const newVal = handleRangeChange(e.target.value);
      rangeVal.textContent = newVal;
    });

    runSpecsBtn.addEventListener('click', () => {
      testLog.innerHTML = '';
      const specs = [
        { name: 'Happy Path: Valid mid-range value (50)', pass: handleRangeChange(50) === 50 },
        { name: 'Edge Case: Lower boundary min value (0)', pass: handleRangeChange(0) === 0 },
        { name: 'Edge Case: Upper boundary max value (100)', pass: handleRangeChange(100) === 100 },
        { name: 'Invalid Input: Below minimum clamping (-10)', pass: handleRangeChange(-10) === 0 },
        { name: 'Invalid Input: Above maximum clamping (150)', pass: handleRangeChange(150) === 100 },
        { name: 'Invalid Input: Non-numeric parsing (NaN)', pass: handleRangeChange('invalid') === 0 }
      ];

      specs.forEach((spec, idx) => {
        setTimeout(() => {
          const div = document.createElement('div');
          div.style.color = spec.pass ? '#10b981' : '#ef4444';
          div.textContent = `✓ [Vitest] ${spec.name}... ${spec.pass ? 'PASSED' : 'FAILED'}`;
          testLog.appendChild(div);
          testLog.scrollTop = testLog.scrollHeight;
        }, idx * 150);
      });
    });
  </script>
</body>
</html>
