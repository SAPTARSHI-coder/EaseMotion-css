<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coin Flip &mdash; EaseMotion CSS Demo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="page-head">
    <p class="kicker">EaseMotion CSS &middot; Games &amp; Play</p>
    <h1>Coin Flip</h1>
    <p class="sub">Call it in the air &mdash; a golden coin flips and lands with a bounce.</p>
  </header>
  <main class="stage">
    <div class="cf-coin">
      <div class="cf-face cf-heads">&#169;&#189;</div>
      <div class="cf-face cf-tails">&copy;</div>
    </div>
  </main>
  <p class="stage-caption">The coin flips on its edge in a continuous 3D loop.</p>
  <footer class="page-foot">
    <span>Pure CSS &middot; zero dependencies</span>
    <span>3D flip animation</span>
  </footer>
</body>
</html>
