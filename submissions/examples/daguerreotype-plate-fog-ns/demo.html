<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daguerreotype Plate Fog — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Daguerreotype Plate Fog demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Daguerreotype Plate Fog</h1>
      <p class="lede">Daguerreotype plate fog clearing to image</p>
    </header>

    <section class="ease-daguerreotype-plate-fog" data-demo="daguerreotype-plate-fog" aria-live="polite">
      <div class="ease-daguerreotype-plate-fog__housing">
        <div class="ease-daguerreotype-plate-fog__bezel">
          <div class="ease-daguerreotype-plate-fog__face">
            <div class="ease-daguerreotype-plate-fog__readout">
              <span class="ease-daguerreotype-plate-fog__label">Daguerreotype Plate Fog</span>
              <span class="ease-daguerreotype-plate-fog__value">LIVE</span>
            </div>
            <div class="ease-daguerreotype-plate-fog__motion" aria-hidden="true">
              <span class="ease-daguerreotype-plate-fog__a"></span>
              <span class="ease-daguerreotype-plate-fog__b"></span>
              <span class="ease-daguerreotype-plate-fog__c"></span>
              <span class="ease-daguerreotype-plate-fog__d"></span>
            </div>
            <div class="ease-daguerreotype-plate-fog__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-daguerreotype-plate-fog__controls">
          <button type="button" class="ease-daguerreotype-plate-fog__btn primary">Engage</button>
          <button type="button" class="ease-daguerreotype-plate-fog__btn">Reset</button>
          <label class="ease-daguerreotype-plate-fog__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-daguerreotype-plate-fog__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
