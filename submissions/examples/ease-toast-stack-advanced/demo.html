<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ease Floating Notification Toast Stack</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="ease-toast-body">
  <button id="addToastBtn" class="ease-add-btn">Trigger Toast Alert</button>
  <div class="ease-toast-container" id="toastContainer"></div>

  <script>
    const btn = document.getElementById('addToastBtn');
    const container = document.getElementById('toastContainer');
    let count = 0;

    btn.addEventListener('click', () => {
      count++;
      const toast = document.createElement('div');
      toast.className = 'ease-toast-item';
      toast.innerHTML = `
        <div><strong>Notification #${count}</strong><br/>Action completed successfully.</div>
        <div class="toast-progress"></div>
      `;
      container.prepend(toast);

      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(-20px)';
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    });
  </script>
</body>
</html>
