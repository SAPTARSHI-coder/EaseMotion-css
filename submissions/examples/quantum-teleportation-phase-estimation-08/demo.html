<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Phase Estimation - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css"></head><body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030712; color: #ffffff;">

    <div class="ease-card ease-card-glass phase-container">
        <div class="phase-header">
            <h2>Phase Estimation</h2>
            <span class="ease-badge ease-badge-info">Estimating</span>
        </div>
        
        <div class="phase-screen ease-center">
            <div class="phase-flux flux-phase-a"></div>
            <div class="phase-flux flux-phase-b"></div>
            <div class="phase-boundary-ring"></div>
            <div class="phase-core ease-center"></div>
        </div>

        <div class="phase-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">U|&psi;&rang; = e^{2&pi;i&theta;}|&psi;&rang;</span>
            <button class="ease-btn ease-btn-info ease-btn-sm ease-hover-grow">Run QPE</button>
        </div>
    </div></body></html>
