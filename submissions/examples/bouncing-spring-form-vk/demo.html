<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="A smooth bouncing spring form created with pure HTML and CSS."
  >

  <title>Bouncing Spring Form</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="page">
    <section class="form-card" aria-labelledby="form-title">

      <header class="form-header">
        <span class="form-badge">BOUNCING SPRING</span>

        <h1 id="form-title">Let's connect.</h1>

        <p>
          A playful form interaction powered entirely by HTML and CSS.
        </p>
      </header>

      <form class="spring-form" action="#" method="post">

        <div class="field-group">
          <label for="name">Name</label>

          <input
            id="name"
            name="name"
            type="text"
            autocomplete="name"
            placeholder="Your name"
            required
          >
        </div>

        <div class="field-group">
          <label for="email">Email</label>

          <input
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            placeholder="you@example.com"
            required
          >
        </div>

        <div class="field-group">
          <label for="subject">Subject</label>

          <input
            id="subject"
            name="subject"
            type="text"
            placeholder="What is this about?"
            required
          >
        </div>

        <div class="field-group">
          <label for="message">Message</label>

          <textarea
            id="message"
            name="message"
            rows="5"
            placeholder="Write your message..."
            required
          ></textarea>
        </div>

        <button class="submit-button" type="submit">
          <span>Send message</span>
          <span class="button-arrow" aria-hidden="true">→</span>
        </button>

      </form>
    </section>
  </main>
</body>
</html>
