<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cherry Blossom · petals float gracefully down</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <div class="sakura-container">
      <div class="sakura-display" id="sakuraDisplay">
        <!-- Canvas for cherry blossoms -->
        <canvas id="sakuraCanvas"></canvas>
        
        <!-- Sakura Info -->
        <div class="sakura-info">
          <span class="info-label">🌸 Petals</span>
          <span class="info-value" id="petalCount">0</span>
        </div>

        <!-- Sakura Controls -->
        <div class="sakura-controls">
          <div class="control-group">
            <label class="control-label">🌬️ Wind</label>
            <input type="range" class="control-slider" id="windSlider" min="0" max="10" value="5">
            <span class="control-value" id="windValue">5</span>
          </div>
          <div class="control-group">
            <label class="control-label">🌸 Density</label>
            <input type="range" class="control-slider" id="densitySlider" min="1" max="10" value="5">
            <span class="control-value" id="densityValue">5</span>
          </div>
        </div>

        <!-- Sakura Text -->
        <div class="sakura-text">
          <span class="text-label">🌸 Cherry Blossoms</span>
          <span class="text-message" id="sakuraMessage">Petals float gracefully in the breeze</span>
        </div>
      </div>
      
      <div class="sakura-status">
        <span id="sakuraStatus">🌸 Cherry blossom petals float gracefully down</span>
      </div>
    </div>

    <div class="controls">
      <button class="btn btn-reset" id="resetBtn">⟳ Reset</button>
    </div>
    <div class="footer-note">
      <span>🌸 petals float · wind control · 4 petal colors</span>
    </div>
  </div>

  <script>
    (function() {
      "use strict";

      // DOM refs
      const canvas = document.getElementById('sakuraCanvas');
      const ctx = canvas.getContext('2d');
      const display = document.getElementById('sakuraDisplay');
      const petalCount = document.getElementById('petalCount');
      const sakuraStatus = document.getElementById('sakuraStatus');
      const sakuraMessage = document.getElementById('sakuraMessage');
      const resetBtn = document.getElementById('resetBtn');
      const windSlider = document.getElementById('windSlider');
      const windValue = document.getElementById('windValue');
      const densitySlider = document.getElementById('densitySlider');
      const densityValue = document.getElementById('densityValue');

      // State
      let petals = [];
      let animationId = null;

      // Petal colors
      const petalColors = [
        { main: '#ffb7c5', light: '#ffd1dc', dark: '#f8a0b0' },
        { main: '#ff8fa3', light: '#ffb3c1', dark: '#f08090' },
        { main: '#ffc0cb', light: '#ffdce5', dark: '#f0b0ba' },
        { main: '#ffb3c6', light: '#ffccd9', dark: '#f0a0b0' }
      ];

      // Petal class
      class Petal {
        constructor(x, y) {
          this.x = x || Math.random() * canvas.width;
          this.y = y || Math.random() * canvas.height;
          this.size = 5 + Math.random() * 8;
          this.speed = 0.3 + Math.random() * 0.5;
          this.wobble = 0.5 + Math.random() * 1;
          this.phase = Math.random() * Math.PI * 2;
          this.rotation = Math.random() * Math.PI * 2;
          this.rotationSpeed = (Math.random() - 0.5) * 0.02;
          this.color = petalColors[Math.floor(Math.random() * petalColors.length)];
          this.opacity = 0.6 + Math.random() * 0.4;
          this.windOffset = Math.random() * 100;
          this.drift = 0.2 + Math.random() * 0.4;
          this.swing = 0.5 + Math.random() * 0.5;
          this.life = 0.5 + Math.random() * 0.5;
          this.maxLife = this.life;
        }

        update(wind) {
          // Wind effect
          const windForce = (wind / 10) * 0.8;
          this.x += Math.sin(this.phase) * this.wobble * 0.15 + windForce * 0.5;
          this.y += this.speed * 0.3 + windForce * 0.1;
          this.phase += 0.02 + windForce * 0.01;
          this.rotation += this.rotationSpeed;
          this.life -= 0.001 * (1 + windForce * 0.5);
          
          // Keep within bounds - wrap around
          if (this.x > canvas.width + 50) this.x = -50;
          if (this.x < -50) this.x = canvas.width + 50;
          if (this.y > canvas.height + 50) {
            this.y = -50;
            this.x = Math.random() * canvas.width;
            this.life = this.maxLife;
          }
          
          return this.life > 0;
        }

        draw(ctx) {
          const alpha = this.opacity * Math.min(1, this.life / this.maxLife * 2);
          const size = this.size * (0.7 + Math.sin(this.phase * 2) * 0.15);
          
          ctx.save();
          ctx.translate(this.x, this.y);
          ctx.rotate(this.rotation);
          ctx.globalAlpha = alpha;
          
          // Shadow
          ctx.shadowColor = 'rgba(200, 150, 150, 0.1)';
          ctx.shadowBlur = 8;
          ctx.shadowOffsetY = 2;
          
          // Draw petal shape
          const gradient = ctx.createRadialGradient(
            -size * 0.2, -size * 0.2, 0,
            0, 0, size
          );
          gradient.addColorStop(0, this.color.light);
          gradient.addColorStop(0.3, this.color.main);
          gradient.addColorStop(1, this.color.dark);
          
          ctx.fillStyle = gradient;
          
          // Petal shape - organic flower petal
          ctx.beginPath();
          ctx.moveTo(0, -size);
          ctx.quadraticCurveTo(size * 0.7, -size * 0.5, size * 0.5, size * 0.1);
          ctx.quadraticCurveTo(size * 0.3, size * 0.6, 0, size * 0.4);
          ctx.quadraticCurveTo(-size * 0.3, size * 0.6, -size * 0.5, size * 0.1);
          ctx.quadraticCurveTo(-size * 0.7, -size * 0.5, 0, -size);
          ctx.closePath();
          ctx.fill();
          
          // Petal vein
          ctx.shadowBlur = 0;
          ctx.globalAlpha = alpha * 0.2;
          ctx.strokeStyle = this.color.dark;
          ctx.lineWidth = 0.5;
          ctx.beginPath();
          ctx.moveTo(0, -size * 0.8);
          ctx.quadraticCurveTo(0, 0, 0, size * 0.3);
          ctx.stroke();
          
          // Subtle highlight
          ctx.globalAlpha = alpha * 0.15;
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(-size * 0.15, -size * 0.3, size * 0.2, 0, Math.PI * 2);
          ctx.fill();
          
          ctx.restore();
        }
      }

      // Resize canvas
      function resizeCanvas() {
        const rect = display.getBoundingClientRect();
        canvas.width = rect.width;
        canvas.height = rect.height;
        canvas.style.width = rect.width + 'px';
        canvas.style.height = rect.height + 'px';
        drawBackground();
      }

      // Draw background
      function drawBackground() {
        const w = canvas.width;
        const h = canvas.height;
        
        // Sky gradient
        const grad = ctx.createLinearGradient(0, 0, 0, h);
        grad.addColorStop(0, 'rgba(200, 210, 230, 0.15)');
        grad.addColorStop(0.3, 'rgba(180, 200, 220, 0.2)');
        grad.addColorStop(0.6, 'rgba(160, 190, 210, 0.2)');
        grad.addColorStop(1, 'rgba(140, 180, 200, 0.25)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, w, h);
        
        // Subtle clouds
        for (let i = 0; i < 4; i++) {
          const x = (i * w * 0.25 + Math.sin(i * 2) * 30) % w;
          const y = 20 + i * 30 + Math.sin(i * 1.5) * 15;
          const radius = 60 + i * 20;
          const grad2 = ctx.createRadialGradient(x, y, 0, x, y, radius);
          grad2.addColorStop(0, `rgba(220, 230, 240, ${0.03 + i * 0.005})`);
          grad2.addColorStop(1, 'rgba(220, 230, 240, 0)');
          ctx.fillStyle = grad2;
          ctx.beginPath();
          ctx.arc(x, y, radius, 0, Math.PI * 2);
          ctx.fill();
        }
        
        // Cherry blossom tree silhouette
        ctx.fillStyle = 'rgba(60, 40, 30, 0.08)';
        ctx.beginPath();
        ctx.moveTo(w * 0.1, h);
        ctx.quadraticCurveTo(w * 0.2, h * 0.7, w * 0.15, h * 0.5);
        ctx.quadraticCurveTo(w * 0.25, h * 0.3, w * 0.35, h * 0.2);
        ctx.quadraticCurveTo(w * 0.4, h * 0.15, w * 0.5, h * 0.1);
        ctx.quadraticCurveTo(w * 0.6, h * 0.15, w * 0.65, h * 0.2);
        ctx.quadraticCurveTo(w * 0.75, h * 0.3, w * 0.85, h * 0.5);
        ctx.quadraticCurveTo(w * 0.8, h * 0.7, w * 0.9, h);
        ctx.closePath();
        ctx.fill();
        
        // Tree branches
        ctx.strokeStyle = 'rgba(60, 40, 30, 0.06)';
        ctx.lineWidth = 2;
        for (let i = 0; i < 8; i++) {
          const x = w * (0.15 + i * 0.08);
          const y = h * (0.2 + i * 0.08);
          ctx.beginPath();
          ctx.moveTo(x, y);
          ctx.quadraticCurveTo(x + 20, y - 30, x + 50, y - 10);
          ctx.stroke();
        }
      }

      // Generate petals
      function generatePetals(count) {
        petals = [];
        for (let i = 0; i < count; i++) {
          const x = Math.random() * canvas.width;
          const y = Math.random() * canvas.height;
          const petal = new Petal(x, y);
          petal.life = 0.5 + Math.random() * 0.5;
          petal.maxLife = petal.life;
          petals.push(petal);
        }
        petalCount.textContent = petals.length;
      }

      // Animation loop
      function animate() {
        const wind = windSlider.value / 10;
        
        // Clear and draw background
        drawBackground();
        
        // Update and draw petals
        petals = petals.filter(p => p.update(wind));
        petals.forEach(p => p.draw(ctx));
        
        // Add new petals to maintain count
        const targetCount = 10 + densitySlider.value * 8;
        while (petals.length < targetCount) {
          const x = Math.random() * canvas.width;
          const y = -20 - Math.random() * 50;
          const petal = new Petal(x, y);
          petals.push(petal);
        }
        
        // Update status based on wind
        if (wind > 0.7) {
          sakuraStatus.textContent = '🌬️ Petals dance in the strong breeze!';
          sakuraStatus.style.color = '#fbbf24';
        } else if (wind > 0.4) {
          sakuraStatus.textContent = '🌸 Petals sway gently in the breeze';
          sakuraStatus.style.color = '#f472b6';
        } else {
          sakuraStatus.textContent = '🌸 Cherry blossom petals float gracefully down';
          sakuraStatus.style.color = '#94a3b8';
        }
        
        // Update petal count
        petalCount.textContent = petals.length;
        
        animationId = requestAnimationFrame(animate);
      }

      // Reset
      function resetSakura() {
        const count = 10 + densitySlider.value * 8;
        generatePetals(count);
        sakuraStatus.textContent = '🔄 Reset complete';
        sakuraStatus.style.color = '#94a3b8';
        setTimeout(() => {
          sakuraStatus.textContent = '🌸 Cherry blossom petals float gracefully down';
          sakuraStatus.style.color = '#94a3b8';
        }, 1000);
      }

      // Event listeners
      windSlider.addEventListener('input', function() {
        windValue.textContent = this.value;
      });

      densitySlider.addEventListener('input', function() {
        densityValue.textContent = this.value;
        const count = 10 + parseInt(this.value) * 8;
        generatePetals(count);
        sakuraMessage.textContent = `${count} petals floating in the breeze`;
        setTimeout(() => {
          sakuraMessage.textContent = 'Petals float gracefully in the breeze';
        }, 1500);
      });

      if (resetBtn) {
        resetBtn.addEventListener('click', function(e) {
          e.preventDefault();
          resetSakura();
        });
      }

      // Keyboard shortcuts
      document.addEventListener('keydown', function(e) {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

        const key = e.key;
        if (key === 'r' || key === 'R') {
          e.preventDefault();
          resetSakura();
        }
      });

      // Resize
      window.addEventListener('resize', () => {
        resizeCanvas();
      });

      // Initialize
      resizeCanvas();
      const initialCount = 10 + densitySlider.value * 8;
      generatePetals(initialCount);
      animate();
      
      console.log('🌸 Cherry Blossom ready · shortcuts: [R] Reset');
    })();
  </script>
</body>
</html>
