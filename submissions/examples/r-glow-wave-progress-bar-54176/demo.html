<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Glow-Wave Progress Bar</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<section class="dashboard">

    <div class="card">

        <h1>Project Dashboard</h1>
        <p>Live team progress overview</p>

        <div class="progress-item">
            <div class="progress-info">
                <span>Frontend</span>
                <span>92%</span>
            </div>

            <div class="progress-bar">
                <div class="progress-fill frontend"></div>
            </div>
        </div>

        <div class="progress-item">
            <div class="progress-info">
                <span>Backend</span>
                <span>76%</span>
            </div>

            <div class="progress-bar">
                <div class="progress-fill backend"></div>
            </div>
        </div>

        <div class="progress-item">
            <div class="progress-info">
                <span>Testing</span>
                <span>58%</span>
            </div>

            <div class="progress-bar">
                <div class="progress-fill testing"></div>
            </div>
        </div>

        <div class="progress-item">
            <div class="progress-info">
                <span>Deployment</span>
                <span>41%</span>
            </div>

            <div class="progress-bar">
                <div class="progress-fill deploy"></div>
            </div>
        </div>

    </div>

</section>

</body>
</html>
