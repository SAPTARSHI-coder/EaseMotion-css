<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cookie Consent Banner — EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <p class="label">Pure CSS Animated Floating Cookie Consent Banner</p>

  <div class="ease-cookie-banner">
    <div class="ease-cookie-header">
      <span>🍪</span> We value your privacy
    </div>
    <p class="ease-cookie-desc">
      We use cookies to enhance your experience and analyze our traffic. By clicking "Accept", you consent to our use of cookies.
    </p>
    <div class="ease-cookie-actions">
      <button class="ease-cookie-btn ease-cookie-btn--decline">Decline</button>
      <button class="ease-cookie-btn ease-cookie-btn--accept">Accept All</button>
    </div>
  </div>

</body>
</html>
