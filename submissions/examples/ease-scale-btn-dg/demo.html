<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elastic Scale Button Demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="demo-header">
    <h1>Elastic Scale Button</h1>
    <p>Hover, tap, or tab to the buttons below to see the elastic bounce effect.</p>
    <button type="button" id="theme-toggle" class="theme-toggle" aria-pressed="false">
      Toggle dark mode
    </button>
  </header>

  <main class="demo-main">

    <section class="demo-section">
      <h2>Primary</h2>
      <button type="button" class="elastic-scale-btn elastic-scale-btn--primary">
        Get Started
      </button>
    </section>

    <section class="demo-section">
      <h2>Secondary (outline)</h2>
      <button type="button" class="elastic-scale-btn elastic-scale-btn--secondary">
        Learn More
      </button>
    </section>

    <section class="demo-section">
      <h2>Icon button</h2>
      <!-- aria-label required since the visible content is an icon only -->
      <button type="button" class="elastic-scale-btn elastic-scale-btn--icon" aria-label="Add to favorites">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
          <path fill="currentColor" d="M12 21s-6.7-4.3-9.3-8.1C.6 9.8 1.4 6.2 4.4 4.7c2.3-1.2 4.9-.5 6.6 1.4 1.7-1.9 4.3-2.6 6.6-1.4 3 1.5 3.8 5.1 1.7 8.2C18.7 16.7 12 21 12 21z"/>
        </svg>
      </button>
    </section>

    <section class="demo-section">
      <h2>Disabled state</h2>
      <button type="button" class="elastic-scale-btn elastic-scale-btn--primary" disabled>
        Unavailable
      </button>
    </section>

  </main>

  <footer class="demo-footer">
    <p>Pure CSS animation &middot; no JavaScript required for the effect itself.</p>
  </footer>

  <script>
    // Optional: only powers the light/dark demo toggle above.
    // The button animation itself is 100% CSS and needs no JS.
    const toggle = document.getElementById('theme-toggle');
    toggle.addEventListener('click', () => {
      const isDark = document.body.classList.toggle('dark');
      toggle.setAttribute('aria-pressed', String(isDark));
      toggle.textContent = isDark ? 'Toggle light mode' : 'Toggle dark mode';
    });
  </script>
</body>
</html>
