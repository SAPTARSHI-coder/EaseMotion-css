<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Loader: Metallic Sheen</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="layout-container">
        
        <header class="section-header">
            <h1 class="title">Pure CSS Loader: Metallic Sheen</h1>
            <p class="subtitle">A premium, physical-feeling spinner utilizing complex conic gradients and multiple inset box shadows to simulate light sweeping across brushed metal.</p>
        </header>

        <div class="demo-area">
            
            <div class="loader-container" aria-label="Loading content, metallic sheen animation playing">
                
                <!-- 
                  [TECHNIQUE] Metallic Sheen
                  A complex conic gradient spins rapidly to simulate light 
                  glancing off a circular, polished metallic ring.
                -->
                <div class="metallic-ring" aria-hidden="true">
                    
                    <!-- The inner dark core provides physical depth -->
                    <div class="metallic-core"></div>
                    
                </div>
                
                <div class="loading-text">Polishing...</div>
                
            </div>
            
        </div>
        
    </div>

</body>
</html>
