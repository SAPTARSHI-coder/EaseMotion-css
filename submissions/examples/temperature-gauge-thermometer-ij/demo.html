<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-temperature-gauge-thermometer demo</title>
</head>
<body>
<div class="tgt-thermo">
  <div class="tgt-tube"><span class="tgt-mercury"></span></div>
  <div class="tgt-bulb"></div>
  <div class="tgt-scale">
    <b class="tgt-mark">20</b>
    <b class="tgt-mark">40</b>
    <b class="tgt-mark">60</b>
  </div>
  <b class="tgt-read">38.2°C</b>
</div>
</body>
</html>
