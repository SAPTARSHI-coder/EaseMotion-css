<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-pop-up-toaster demo</title>
</head>
<body>
<div class="ts-app">
  <div class="ts-head">
    <span class="ts-name">BROWN-STAR</span>
    <span class="ts-badge">READY</span>
  </div>
  <div class="ts-stage">
    <div class="ts-toast ts-toast-a"><span class="ts-crust"></span></div>
    <div class="ts-toast ts-toast-b"><span class="ts-crust"></span></div>
    <div class="ts-slot"></div>
    <div class="ts-body">
      <span class="ts-vent ts-vent-1"></span>
      <span class="ts-vent ts-vent-2"></span>
      <span class="ts-vent ts-vent-3"></span>
      <div class="ts-dial"></div>
      <div class="ts-crumb"></div>
    </div>
    <button class="ts-lever" type="button" aria-label="Toast lever"><span class="ts-grip"></span></button>
  </div>
  <div class="ts-foot">SLOT 2 TOAST</div>
</div>
</body>
</html>
