<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EaseMotion — Toast Notifications</title>
  <link rel="stylesheet" href="../../core/variables.css">
  <link rel="stylesheet" href="../../components/toast.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="demo-container">
    <h1>Toast Notifications</h1>
    <p>Click buttons to trigger different toast types.</p>
    <div class="btn-row">
      <button class="demo-btn success" onclick="showToast('success')">Success</button>
      <button class="demo-btn error" onclick="showToast('error')">Error</button>
      <button class="demo-btn warning" onclick="showToast('warning')">Warning</button>
      <button class="demo-btn info" onclick="showToast('info')">Info</button>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <script>
    const messages = {
      success: 'Changes saved successfully!',
      error: 'Failed to save changes.',
      warning: 'Your session is about to expire.',
      info: 'New update available.'
    };
    function showToast(type) {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = 'toast toast-' + type;
      toast.innerHTML = '<span>' + messages[type] + '</span><button onclick="this.parentElement.remove()">&times;</button>';
      container.appendChild(toast);
      setTimeout(() => toast.classList.add('show'), 10);
      setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 300); }, 4000);
    }
  </script>
</body>
</html>
