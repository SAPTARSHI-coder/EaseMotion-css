<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rotate-Fade Tooltip Demo — EaseMotion CSS</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <!-- Main Showcase Container -->
  <div class="demo-page" id="app-root">

    <div class="demo-card">
      <h1 class="demo-title">Rotate-Fade Tooltip</h1>
      <p class="demo-desc">
        Hover or focus on the info badge icon below. The tooltip panel reveals with a 3D Rotate-Fade transition.
      </p>

      <div style="display:flex;gap:12px;justify-content:center;align-items:center;margin-bottom:24px;">
        
        <!-- Tooltip Trigger Wrapper -->
        <div class="ease-tooltip-wrapper" tabindex="0" role="button" aria-haspopup="true">
          <span class="info-badge">i</span>
          
          <!-- Tooltip Panel -->
          <div class="ease-tooltip" role="tooltip">
            <h4 class="tooltip-title">Audio DSP Spec</h4>
            <p class="tooltip-desc">Spatial wave propagation configuration modeling physical barriers and sound reflection echoes.</p>
          </div>
        </div>

      </div>

      <button class="demo-btn" id="themeBtn" style="background:rgba(255,255,255,0.06);color:inherit;border:1px solid var(--ease-tooltip-border);">
        Toggle Theme
      </button>
    </div>

  </div>

  <script>
    // Theme toggle helper
    const themeBtn = document.getElementById('themeBtn');
    const appRoot = document.getElementById('app-root');
    themeBtn.addEventListener('click', () => {
      appRoot.classList.toggle('light-theme');
      document.querySelector('.ease-tooltip-wrapper').classList.toggle('light-theme');
    });
  </script>

</body>
</html>
