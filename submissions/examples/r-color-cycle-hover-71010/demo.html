<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="CSS color cycle on hover animation demo"
  >
  <title>CSS Color Cycle on Hover</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">
    <section class="demo" aria-labelledby="title">

      <p class="eyebrow">EaseMotion CSS</p>

      <h1 id="title">Color Cycle on Hover</h1>

      <p class="intro">
        Hover or focus the interactive cards to see their colors
        smoothly cycle through a vibrant palette.
      </p>

      <div class="palette" aria-label="Color cycle examples">

        <a
          class="color-card"
          href="#red-cycle"
          aria-label="Explore coral color cycle"
        >
          <span class="orb" aria-hidden="true"></span>
          <span class="card-content">
            <span class="card-label">Palette 01</span>
            <strong>Coral Cycle</strong>
            <span>Hover to animate</span>
          </span>
          <span class="arrow" aria-hidden="true">→</span>
        </a>

        <a
          class="color-card"
          href="#blue-cycle"
          aria-label="Explore ocean color cycle"
        >
          <span class="orb" aria-hidden="true"></span>
          <span class="card-content">
            <span class="card-label">Palette 02</span>
            <strong>Ocean Cycle</strong>
            <span>Focus to animate</span>
          </span>
          <span class="arrow" aria-hidden="true">→</span>
        </a>

        <a
          class="color-card"
          href="#violet-cycle"
          aria-label="Explore violet color cycle"
        >
          <span class="orb" aria-hidden="true"></span>
          <span class="card-content">
            <span class="card-label">Palette 03</span>
            <strong>Violet Cycle</strong>
            <span>CSS only</span>
          </span>
          <span class="arrow" aria-hidden="true">→</span>
        </a>

      </div>

      <p class="hint">
        <span aria-hidden="true">✦</span>
        Move your pointer over a card
      </p>

    </section>
  </main>

</body>
</html>
