<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CSS Scale-Hover Hero Section">
  <title>Scale-Hover Hero Section</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="hero">
    <div class="glow glow-one"></div>
    <div class="glow glow-two"></div>

    <section class="hero-card" aria-labelledby="hero-title">
      <span class="eyebrow">EASEMOTION CSS</span>

      <h1 id="hero-title">
        Design with
        <span>motion.</span>
      </h1>

      <p>
        A minimalist glassmorphism hero section with a responsive
        CSS scale-hover interaction.
      </p>

      <div class="actions">
        <a href="#explore" class="button primary">Explore</a>
        <a href="#learn" class="button secondary">Learn More</a>
      </div>
    </section>
  </main>

  <section class="content" id="explore">
    <h2>Pure CSS Interaction</h2>
    <p>Elegant hover motion without JavaScript.</p>
  </section>

  <section class="content" id="learn">
    <h2>Responsive Experience</h2>
    <p>Designed for desktop, tablet, and mobile layouts.</p>
  </section>
</body>
</html>
