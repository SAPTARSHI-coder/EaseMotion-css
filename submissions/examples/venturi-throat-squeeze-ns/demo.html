<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Venturi Throat Squeeze — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Venturi Throat Squeeze demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Venturi Throat Squeeze</h1>
      <p class="lede">Venturi throat accelerating flow then recovering pressure</p>
    </header>

    <section class="ease-venturi-throat-squeeze" data-demo="venturi-throat-squeeze" aria-live="polite">
      <div class="ease-venturi-throat-squeeze__housing">
        <div class="ease-venturi-throat-squeeze__bezel">
          <div class="ease-venturi-throat-squeeze__face">
            <div class="ease-venturi-throat-squeeze__readout">
              <span class="ease-venturi-throat-squeeze__label">Venturi Throat Squeeze</span>
              <span class="ease-venturi-throat-squeeze__value">LIVE</span>
            </div>
            <div class="ease-venturi-throat-squeeze__motion" aria-hidden="true">
              <span class="ease-venturi-throat-squeeze__a"></span>
              <span class="ease-venturi-throat-squeeze__b"></span>
              <span class="ease-venturi-throat-squeeze__c"></span>
              <span class="ease-venturi-throat-squeeze__d"></span>
            </div>
            <div class="ease-venturi-throat-squeeze__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-venturi-throat-squeeze__controls">
          <button type="button" class="ease-venturi-throat-squeeze__btn primary">Engage</button>
          <button type="button" class="ease-venturi-throat-squeeze__btn">Reset</button>
          <label class="ease-venturi-throat-squeeze__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-venturi-throat-squeeze__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
