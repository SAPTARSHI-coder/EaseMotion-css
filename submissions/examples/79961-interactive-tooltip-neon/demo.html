<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />
  <meta
    name="description"
    content="Interactive responsive neon tooltip component built with HTML and CSS."
  />
  <title>Interactive Neon Tooltip</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main class="page">
    <section class="demo-card">
      <header class="hero">
        <span class="eyebrow">EASEMOTION CSS</span>

        <h1>Interactive Neon Tooltips</h1>

        <p>
          Hover or focus the elements below to reveal contextual
          information with a glowing neon effect.
        </p>
      </header>

      <div class="tooltip-grid">
        <div class="tooltip-demo">
          <span class="demo-label">Hover</span>

          <button
            class="tooltip-trigger tooltip-trigger--cyan"
            type="button"
            aria-describedby="tooltip-cyan"
          >
            <span class="trigger-icon" aria-hidden="true">✦</span>
            Explore
            <span
              class="tooltip"
              id="tooltip-cyan"
              role="tooltip"
            >
              Discover new features
            </span>
          </button>
        </div>

        <div class="tooltip-demo">
          <span class="demo-label">Focus</span>

          <button
            class="tooltip-trigger tooltip-trigger--pink"
            type="button"
            aria-describedby="tooltip-pink"
          >
            <span class="trigger-icon" aria-hidden="true">⌁</span>
            Connect
            <span
              class="tooltip"
              id="tooltip-pink"
              role="tooltip"
            >
              Connect with your workspace
            </span>
          </button>
        </div>

        <div class="tooltip-demo">
          <span class="demo-label">Information</span>

          <button
            class="tooltip-trigger tooltip-trigger--purple"
            type="button"
            aria-describedby="tooltip-purple"
          >
            <span class="trigger-icon" aria-hidden="true">?</span>
            Details
            <span
              class="tooltip"
              id="tooltip-purple"
              role="tooltip"
            >
              View additional information
            </span>
          </button>
        </div>

        <div class="tooltip-demo">
          <span class="demo-label">Action</span>

          <button
            class="tooltip-trigger tooltip-trigger--green"
            type="button"
            aria-describedby="tooltip-green"
          >
            <span class="trigger-icon" aria-hidden="true">↗</span>
            Launch
            <span
              class="tooltip"
              id="tooltip-green"
              role="tooltip"
            >
              Start the selected action
            </span>
          </button>
        </div>
      </div>

      <div class="instruction">
        <span class="instruction-dot" aria-hidden="true"></span>

        <p>
          Use <kbd>Tab</kbd> to navigate between interactive elements.
        </p>
      </div>
    </section>
  </main>
</body>
</html>
