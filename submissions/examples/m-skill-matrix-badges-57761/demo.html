<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skill Badge Matrix</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<section class="skills-section">

    <h1>Developer Skill Matrix</h1>
    <p>Interactive Skill Badges with CSS Progress Rings</p>

    <div class="filters">
        <span class="filter active">All</span>
        <span class="filter">Frontend</span>
        <span class="filter">Backend</span>
        <span class="filter">Tools</span>
    </div>

    <div class="skills-grid">

        <article class="skill-card" style="--percentage:90;">
            <div class="ring">
                <span>90%</span>
            </div>
            <h2>HTML5</h2>
            <p>Frontend</p>
        </article>

        <article class="skill-card" style="--percentage:88;">
            <div class="ring">
                <span>88%</span>
            </div>
            <h2>CSS3</h2>
            <p>Frontend</p>
        </article>

        <article class="skill-card" style="--percentage:80;">
            <div class="ring">
                <span>80%</span>
            </div>
            <h2>JavaScript</h2>
            <p>Frontend</p>
        </article>

        <article class="skill-card" style="--percentage:78;">
            <div class="ring">
                <span>78%</span>
            </div>
            <h2>React</h2>
            <p>Frontend</p>
        </article>

        <article class="skill-card" style="--percentage:85;">
            <div class="ring">
                <span>85%</span>
            </div>
            <h2>Git</h2>
            <p>Tools</p>
        </article>

        <article class="skill-card" style="--percentage:82;">
            <div class="ring">
                <span>82%</span>
            </div>
            <h2>Python</h2>
            <p>Backend</p>
        </article>

    </div>

</section>

</body>
</html>
