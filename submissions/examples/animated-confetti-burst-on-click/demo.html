### demo.html
```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Confetti Burst on Click — Demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="demo-wrap">
    <h1>Confetti Burst on Click</h1>
    <p class="sub">Click the button to trigger the burst.</p>

    <div class="card">
      <button class="btn confetti-burst" id="confettiBtn">
        🎉 Claim Reward
        <span class="confetti-piece" style="--i:0;"></span>
        <span class="confetti-piece" style="--i:1;"></span>
        <span class="confetti-piece" style="--i:2;"></span>
        <span class="confetti-piece" style="--i:3;"></span>
        <span class="confetti-piece" style="--i:4;"></span>
        <span class="confetti-piece" style="--i:5;"></span>
        <span class="confetti-piece" style="--i:6;"></span>
        <span class="confetti-piece" style="--i:7;"></span>
      </button>
    </div>
  </main>

  <script>
    const btn = document.getElementById('confettiBtn');
    btn.addEventListener('click', () => {
      btn.classList.remove('is-active');
      void btn.offsetWidth;
      btn.classList.add('is-active');
    });
  </script>
</body>
</html>
