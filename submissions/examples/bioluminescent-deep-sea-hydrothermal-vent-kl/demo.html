<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bioluminescent Deep-Sea Hydrothermal Vent - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #01050a; color: #ffffff;">

    <div class="ease-card ease-card-glass abyss-container">
        <div class="abyss-header">
            <h2>Abyssal Vent</h2>
            <span class="ease-badge ease-badge-info">Thermal Plume</span>
        </div>
        
        <div class="abyss-screen ease-center">
            <div class="plume-current current-1"></div>
            <div class="plume-current current-2"></div>
            <div class="mineral-chimney-ring"></div>
            <div class="hydrothermal-core ease-center"></div>
        </div>

        <div class="abyss-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Depth: 4,000m</span>
            <button class="ease-btn ease-btn-primary ease-btn-sm ease-hover-grow">Boost Vent</button>
        </div>
    </div>

</body>
</html>
