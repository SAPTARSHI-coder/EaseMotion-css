<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flip-Card Testimonial — Demo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <p class="demo-title">Hover the card to flip (pure CSS)</p>

  <div class="flip-scene">
    <div class="flip-card">
      <div class="flip-face flip-face--front">
        <div class="flip-avatar">👩‍💻</div>
        <p class="flip-name">Maria Chen</p>
        <p class="flip-role">Frontend Developer</p>
        <p class="flip-hint">Hover to read review</p>
      </div>

      <div class="flip-face flip-face--back">
        <p class="flip-quote">"This library saved me hours of animation work. Clean, readable, and just works."</p>
        <p class="flip-stars">★★★★★</p>
      </div>
    </div>
  </div>

</body>
</html>
