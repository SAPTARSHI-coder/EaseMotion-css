<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ink Wash · ink spreads and blends</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <div class="ink-container">
      <div class="ink-display" id="inkDisplay">
        <!-- Canvas for ink wash -->
        <canvas id="inkCanvas"></canvas>
        
        <!-- Ink Info -->
        <div class="ink-info">
          <span class="info-label">🖋️ Strokes</span>
          <span class="info-value" id="strokeCount">0</span>
        </div>

        <!-- Ink Controls -->
        <div class="ink-controls">
          <div class="control-group">
            <label class="control-label">💧 Wetness</label>
            <input type="range" class="control-slider" id="wetnessSlider" min="1" max="10" value="5">
            <span class="control-value" id="wetnessValue">5</span>
          </div>
          <div class="control-group">
            <label class="control-label">🎨 Ink</label>
            <div class="color-options">
              <button class="color-btn active" data-color="#1a1a2e" style="background:#1a1a2e;"></button>
              <button class="color-btn" data-color="#2d3748" style="background:#2d3748;"></button>
              <button class="color-btn" data-color="#4a5568" style="background:#4a5568;"></button>
              <button class="color-btn" data-color="#6b7280" style="background:#6b7280;"></button>
              <button class="color-btn" data-color="#3b82f6" style="background:#3b82f6;"></button>
              <button class="color-btn" data-color="#8b5cf6" style="background:#8b5cf6;"></button>
              <button class="color-btn" data-color="#ec4899" style="background:#ec4899;"></button>
              <button class="color-btn" data-color="#22c55e" style="background:#22c55e;"></button>
            </div>
          </div>
        </div>

        <!-- Ink Text -->
        <div class="ink-text">
          <span class="text-label">🖋️ Ink Wash</span>
          <span class="text-message" id="inkMessage">Click and drag to spread ink</span>
        </div>
      </div>
      
      <div class="ink-status">
        <span id="inkStatus">🖋️ Click and drag to create ink wash</span>
      </div>
    </div>

    <div class="controls">
      <button class="btn btn-reset" id="resetBtn">⟳ Clear</button>
    </div>
    <div class="footer-note">
      <span>🖋️ ink spreads · blends · washes like watercolor</span>
    </div>
  </div>

  <script>
    (function() {
      "use strict";

      // DOM refs
      const canvas = document.getElementById('inkCanvas');
      const ctx = canvas.getContext('2d');
      const display = document.getElementById('inkDisplay');
      const strokeCount = document.getElementById('strokeCount');
      const inkStatus = document.getElementById('inkStatus');
      const inkMessage = document.getElementById('inkMessage');
      const resetBtn = document.getElementById('resetBtn');
      const wetnessSlider = document.getElementById('wetnessSlider');
      const wetnessValue = document.getElementById('wetnessValue');
      const colorBtns = document.querySelectorAll('.color-btn');

      // State
      let isDrawing = false;
      let strokeCountNum = 0;
      let currentColor = '#1a1a2e';
      let currentWetness = 5;
      let lastX = 0;
      let lastY = 0;
      let points = [];
      let isAnimating = false;
      let animationId = null;
      let inkParticles = [];

      // Ink particle class
      class InkParticle {
        constructor(x, y, color, wetness) {
          this.x = x;
          this.y = y;
          this.color = color;
          this.wetness = wetness;
          this.size = 2 + wetness * 2 + Math.random() * 6;
          this.spread = 0;
          this.maxSpread = 0.3 + wetness * 0.1 + Math.random() * 0.2;
          this.speed = 0.01 + Math.random() * 0.02;
          this.opacity = 0.3 + wetness * 0.05 + Math.random() * 0.2;
          this.phase = Math.random() * Math.PI * 2;
          this.variation = 0.5 + Math.random() * 0.5;
          this.life = 1;
          this.decay = 0.002 + Math.random() * 0.003;
        }

        update() {
          this.spread += this.speed;
          if (this.spread > this.maxSpread) this.spread = this.maxSpread;
          this.phase += 0.02;
          this.life -= this.decay;
          return this.life > 0;
        }

        draw(ctx) {
          const alpha = this.opacity * this.life * (0.6 + Math.sin(this.phase) * 0.2);
          const size = this.size * (1 + this.spread * 2) * (0.8 + Math.sin(this.phase * 0.7) * 0.1);
          
          // Main ink wash
          const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, size);
          grad.addColorStop(0, this.color);
          grad.addColorStop(0.3, this.color);
          grad.addColorStop(0.7, this.color);
          grad.addColorStop(1, 'transparent');
          
          ctx.save();
          ctx.globalAlpha = alpha * 0.7;
          ctx.fillStyle = grad;
          ctx.beginPath();
          
          // Irregular shape for ink wash
          const points = 8 + Math.floor(Math.random() * 4);
          for (let i = 0; i < points; i++) {
            const angle = (i / points) * Math.PI * 2 + this.phase * 0.2;
            const r = size * (0.6 + Math.sin(this.phase + i) * 0.15 + 0.2);
            const px = this.x + Math.cos(angle) * r;
            const py = this.y + Math.sin(angle) * r;
            if (i === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
          }
          ctx.closePath();
          ctx.fill();
          
          // Secondary wash for blending
          ctx.globalAlpha = alpha * 0.3;
          const grad2 = ctx.createRadialGradient(
            this.x + (Math.random() - 0.5) * size * 0.5,
            this.y + (Math.random() - 0.5) * size * 0.5,
            0,
            this.x,
            this.y,
            size * 1.2
          );
          grad2.addColorStop(0, this.color);
          grad2.addColorStop(1, 'transparent');
          ctx.fillStyle = grad2;
          ctx.beginPath();
          ctx.arc(this.x, this.y, size * 1.2, 0, Math.PI * 2);
          ctx.fill();
          
          ctx.restore();
        }
      }

      // Resize canvas
      function resizeCanvas() {
        const rect = display.getBoundingClientRect();
        canvas.width = rect.width;
        canvas.height = rect.height;
        canvas.style.width = rect.width + 'px';
        canvas.style.height = rect.height + 'px';
        drawBackground();
        // Redraw existing particles
        if (inkParticles.length > 0) {
          redrawAll();
        }
      }

      // Draw background
      function drawBackground() {
        const grad = ctx.createRadialGradient(
          canvas.width/2, canvas.height/2, 0,
          canvas.width/2, canvas.height/2, canvas.width * 0.7
        );
        grad.addColorStop(0, 'rgba(30, 30, 45, 0.2)');
        grad.addColorStop(0.5, 'rgba(20, 20, 35, 0.3)');
        grad.addColorStop(1, 'rgba(10, 10, 20, 0.6)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        // Add subtle paper texture
        for (let i = 0; i < 800; i++) {
          const x = Math.random() * canvas.width;
          const y = Math.random() * canvas.height;
          const size = Math.random() * 1.5 + 0.5;
          const alpha = Math.random() * 0.025;
          ctx.fillStyle = `rgba(255,255,255,${alpha})`;
          ctx.fillRect(x, y, size, size);
        }
      }

      // Get canvas coordinates
      function getCoords(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return {
          x: (clientX - rect.left) * (canvas.width / rect.width),
          y: (clientY - rect.top) * (canvas.height / rect.height)
        };
      }

      // Create ink spread
      function createInkSpread(x, y, color, wetness, count = 20) {
        for (let i = 0; i < count; i++) {
          const particle = new InkParticle(
            x + (Math.random() - 0.5) * 10,
            y + (Math.random() - 0.5) * 10,
            color,
            wetness / 10
          );
          particle.size = 2 + wetness * 1.5 + Math.random() * 8;
          particle.maxSpread = 0.3 + (wetness / 10) * 0.6 + Math.random() * 0.2;
          particle.speed = 0.01 + Math.random() * 0.03;
          inkParticles.push(particle);
        }
      }

      // Draw stroke
      function drawStroke(x1, y1, x2, y2, color, wetness) {
        const dist = Math.sqrt(Math.pow(x2 - x1, 2) + Math.pow(y2 - y1, 2));
        if (dist < 2) return;

        const steps = Math.max(Math.floor(dist / 3), 5);
        const count = Math.floor(wetness / 2) + 3;

        for (let i = 0; i < steps; i++) {
          const t = i / steps;
          const x = x1 + (x2 - x1) * t;
          const y = y1 + (y2 - y1) * t;
          
          // Create ink spread at each point
          const spreadCount = count + Math.floor(Math.random() * 3);
          createInkSpread(x, y, color, wetness, spreadCount);
          
          // Extra spread for wetness
          if (wetness > 6 && Math.random() > 0.5) {
            const extraX = x + (Math.random() - 0.5) * 15;
            const extraY = y + (Math.random() - 0.5) * 15;
            createInkSpread(extraX, extraY, color, wetness * 0.7, Math.floor(spreadCount * 0.5));
          }
        }
      }

      // Redraw all particles
      function redrawAll() {
        drawBackground();
        inkParticles.forEach(p => p.draw(ctx));
      }

      // Animate particles
      function animateParticles() {
        let alive = false;
        
        inkParticles.forEach(p => {
          if (p.update()) alive = true;
        });
        
        // Remove dead particles
        inkParticles = inkParticles.filter(p => p.life > 0);
        
        // Redraw
        drawBackground();
        inkParticles.forEach(p => p.draw(ctx));
        
        if (alive || inkParticles.length > 0) {
          animationId = requestAnimationFrame(animateParticles);
        } else {
          animationId = null;
          isAnimating = false;
        }
      }

      // Start drawing
      function startDrawing(e) {
        e.preventDefault();
        isDrawing = true;
        const coords = getCoords(e);
        lastX = coords.x;
        lastY = coords.y;
        
        // Initial ink spread
        createInkSpread(lastX, lastY, currentColor, currentWetness, 10);
        
        strokeCountNum++;
        strokeCount.textContent = strokeCountNum;
        
        inkStatus.textContent = '🖋️ Ink spreading...';
        inkStatus.style.color = '#94a3b8';
        inkMessage.textContent = '🖋️ Ink spreading...';
        inkMessage.style.color = '#94a3b8';
        
        if (!animationId) {
          isAnimating = true;
          animateParticles();
        }
      }

      // Draw
      function draw(e) {
        e.preventDefault();
        if (!isDrawing) return;
        
        const coords = getCoords(e);
        const x = coords.x;
        const y = coords.y;
        
        drawStroke(lastX, lastY, x, y, currentColor, currentWetness);
        
        lastX = x;
        lastY = y;
        strokeCountNum++;
        strokeCount.textContent = strokeCountNum;
        
        if (!animationId && !isAnimating) {
          isAnimating = true;
          animateParticles();
        }
      }

      // Stop drawing
      function stopDrawing(e) {
        if (isDrawing) {
          isDrawing = false;
          inkStatus.textContent = '🖋️ Ink wash complete!';
          inkStatus.style.color = '#4ade80';
          inkMessage.textContent = 'Click and drag to spread ink';
          inkMessage.style.color = '#94a3b8';
          setTimeout(() => {
            inkStatus.textContent = '🖋️ Click and drag to create ink wash';
            inkStatus.style.color = '#94a3b8';
          }, 1500);
        }
      }

      // Set color
      function setColor(color) {
        currentColor = color;
        colorBtns.forEach(btn => {
          btn.classList.toggle('active', btn.dataset.color === color);
        });
        inkStatus.textContent = `🎨 Color selected`;
        inkStatus.style.color = color;
        setTimeout(() => {
          inkStatus.textContent = '🖋️ Click and drag to create ink wash';
          inkStatus.style.color = '#94a3b8';
        }, 1000);
      }

      // Set wetness
      function setWetness(value) {
        currentWetness = parseInt(value);
        wetnessValue.textContent = currentWetness;
        inkStatus.textContent = `💧 Wetness: ${currentWetness}/10`;
        inkStatus.style.color = '#a78bfa';
        setTimeout(() => {
          inkStatus.textContent = '🖋️ Click and drag to create ink wash';
          inkStatus.style.color = '#94a3b8';
        }, 1500);
      }

      // Clear canvas
      function clearCanvas() {
        inkParticles = [];
        strokeCountNum = 0;
        strokeCount.textContent = '0';
        if (animationId) {
          cancelAnimationFrame(animationId);
          animationId = null;
          isAnimating = false;
        }
        drawBackground();
        inkStatus.textContent = '🧹 Canvas cleared';
        inkStatus.style.color = '#94a3b8';
        inkMessage.textContent = 'Click and drag to spread ink';
        inkMessage.style.color = '#94a3b8';
        setTimeout(() => {
          inkStatus.textContent = '🖋️ Click and drag to create ink wash';
          inkStatus.style.color = '#94a3b8';
        }, 1000);
      }

      // Event listeners
      canvas.addEventListener('mousedown', startDrawing);
      canvas.addEventListener('mousemove', draw);
      canvas.addEventListener('mouseup', stopDrawing);
      canvas.addEventListener('mouseleave', stopDrawing);

      // Touch events
      canvas.addEventListener('touchstart', startDrawing, { passive: false });
      canvas.addEventListener('touchmove', draw, { passive: false });
      canvas.addEventListener('touchend', stopDrawing, { passive: false });

      // Color buttons
      colorBtns.forEach(btn => {
        btn.addEventListener('click', function() {
          setColor(this.dataset.color);
        });
      });

      // Wetness slider
      wetnessSlider.addEventListener('input', function() {
        setWetness(this.value);
      });

      if (resetBtn) {
        resetBtn.addEventListener('click', function(e) {
          e.preventDefault();
          clearCanvas();
        });
      }

      // Keyboard shortcuts
      document.addEventListener('keydown', function(e) {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

        const key = e.key;
        if (key === 'c' || key === 'C') {
          e.preventDefault();
          clearCanvas();
        }
      });

      // Resize
      window.addEventListener('resize', resizeCanvas);

      // Initialize
      resizeCanvas();
      
      console.log('🖋️ Ink Wash ready · shortcuts: [C] Clear');
    })();
  </script>
</body>
</html>
