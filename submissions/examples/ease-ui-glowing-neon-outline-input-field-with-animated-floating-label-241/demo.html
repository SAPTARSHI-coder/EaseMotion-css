<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
Glowing Neon Floating Label Input
</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<main class="container">


<section class="card">


<div class="heading">

<h1>
Neon Input Field
</h1>

<p>
Dark Mode Floating Label UI
</p>

</div>



<form>


<div class="input-group">

<input 
type="text"
id="username"
required
autocomplete="off"
/>

<label for="username">
Username
</label>

</div>



<div class="input-group">

<input 
type="email"
id="email"
required
autocomplete="off"
/>

<label for="email">
Email Address
</label>

</div>



<div class="input-group">

<input 
type="password"
id="password"
required
/>

<label for="password">
Password
</label>

</div>



<button type="submit">
Continue
</button>


</form>


</section>


</main>



<script src="script.js"></script>


</body>

</html>
