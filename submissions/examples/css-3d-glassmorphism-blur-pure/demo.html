<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 3D Effect: Glassmorphism</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="layout-container">
        
        <header class="section-header">
            <h1 class="title">Pure CSS 3D: Glassmorphism Blur</h1>
            <p class="subtitle">A hardware-accelerated, JavaScript-free 3D animation utilizing `transform-style: preserve-3d` and stacked `backdrop-filter: blur()` layers.</p>
        </header>

        <div class="demo-area">
            
            <!-- 
              [TECHNIQUE] The 3D Scene
              The wrapper establishes the perspective, allowing child elements
              to be transformed in 3D space.
            -->
            <div class="scene-3d">
                
                <!-- 
                  The primary rotating object. 
                  It uses preserve-3d to ensure its children maintain their 3D positions relative to it.
                -->
                <div class="object-3d">
                    
                    <!-- 
                      Layer 1 (Back): Solid colored geometric shape.
                      This is the object being obscured by the glass layers.
                    -->
                    <div class="base-geometry">
                        <div class="geo-sphere"></div>
                        <div class="geo-cube"></div>
                    </div>
                    
                    <!-- 
                      Layer 2 (Middle): First Glass Pane.
                      Pushed forward on the Z-axis. Uses backdrop-filter to blur the geometry behind it.
                    -->
                    <div class="glass-pane pane-1">
                        <div class="pane-content">
                            <h3>Optical Depth</h3>
                            <p>Layer 1: Z=40px</p>
                        </div>
                    </div>
                    
                    <!-- 
                      Layer 3 (Front): Second Glass Pane.
                      Pushed even further forward. The blur compounds with the pane behind it.
                    -->
                    <div class="glass-pane pane-2">
                        <div class="pane-content">
                            <h3>Refractive Index</h3>
                            <p>Layer 2: Z=80px</p>
                        </div>
                    </div>
                    
                </div>
                
            </div>
            
        </div>
        
    </div>

</body>
</html>
