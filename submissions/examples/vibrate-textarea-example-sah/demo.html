<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vibrate Textarea Feedback - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="form-container">
    <h1>Vibrate Textarea Example (<code>#54715</code>)</h1>
    <p class="subtitle">Focus or trigger invalid validation states to experience haptic-style CSS vibration feedback.</p>
    
    <form class="demo-form" onsubmit="return false;">
      <div class="field-wrap">
        <label for="feedback">Project Feedback (Min 20 characters)</label>
        <textarea id="feedback" class="ease-textarea-vibrate" rows="5" placeholder="Type your contribution review here..." required minlength="20"></textarea>
        <span class="hint">⚡ Auto-vibrates on focus and invalid submission attempts!</span>
      </div>
      <button class="submit-btn" onclick="document.getElementById('feedback').classList.toggle('vibrate-trigger')">Manual Vibrate Trigger</button>
    </form>
  </div>
</body>
</html>
