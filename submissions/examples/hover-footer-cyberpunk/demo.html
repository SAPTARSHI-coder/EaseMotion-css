<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyberpunk Hover Footer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="content">
    <h1>CYBERPUNK</h1>
    <p>Hover over the footer links to activate the neon effect.</p>
  </main>

  <footer class="cyber-footer">
    <div class="footer-content">
      <div class="brand">
        <span class="glitch">NEXUS</span>
        <p>Future starts here.</p>
      </div>

      <nav class="footer-links" aria-label="Footer navigation">
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Projects</a>
        <a href="#">Contact</a>
      </nav>

      <div class="status">
        <span class="status-dot"></span>
        SYSTEM ONLINE
      </div>
    </div>

    <div class="footer-bottom">
      <span>© 2026 NEXUS</span>
      <span>SECURE // CONNECTED</span>
    </div>
  </footer>

</body>
</html>
