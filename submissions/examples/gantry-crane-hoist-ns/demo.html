<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gantry Crane Hoist — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Gantry Crane Hoist demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Gantry Crane Hoist</h1>
      <p class="lede">Shipyard gantry crane hoist lowering a container</p>
    </header>

    <section class="ease-gantry-crane-hoist" data-demo="gantry-crane-hoist" aria-live="polite">
      <div class="ease-gantry-crane-hoist__housing">
        <div class="ease-gantry-crane-hoist__bezel">
          <div class="ease-gantry-crane-hoist__face">
            <div class="ease-gantry-crane-hoist__readout">
              <span class="ease-gantry-crane-hoist__label">Gantry Crane Hoist</span>
              <span class="ease-gantry-crane-hoist__value">LIVE</span>
            </div>
            <div class="ease-gantry-crane-hoist__motion" aria-hidden="true">
              <span class="ease-gantry-crane-hoist__a"></span>
              <span class="ease-gantry-crane-hoist__b"></span>
              <span class="ease-gantry-crane-hoist__c"></span>
              <span class="ease-gantry-crane-hoist__d"></span>
            </div>
            <div class="ease-gantry-crane-hoist__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-gantry-crane-hoist__controls">
          <button type="button" class="ease-gantry-crane-hoist__btn primary">Engage</button>
          <button type="button" class="ease-gantry-crane-hoist__btn">Reset</button>
          <label class="ease-gantry-crane-hoist__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-gantry-crane-hoist__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
