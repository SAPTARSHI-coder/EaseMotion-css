<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Glowing Accordion — EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <p class="label">Pure CSS Animated Glowing Accordion</p>

  <div class="ease-accordion-v3">
    <input type="checkbox" id="gacc1-v3" class="ease-accordion-checkbox-v3" checked />
    <div class="ease-accordion-item-v3">
      <label for="gacc1-v3" class="ease-accordion-header-v3">
        <span>Neon Accordion Item</span>
        <span class="ease-accordion-icon-v3">▼</span>
      </label>
      <div class="ease-accordion-drawer-v3">
        <div class="ease-accordion-body-v3">
          Smooth CSS Grid height drawer opening with ambient active border neon glow box-shadow.
        </div>
      </div>
    </div>
  </div>

</body>
</html>
