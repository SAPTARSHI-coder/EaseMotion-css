<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Pure CSS Velvet Smooth Transition particle effect"
  >

  <title>CSS Velvet Smooth Transition</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="velvet-scene">

    <div class="particle particle-one" aria-hidden="true"></div>
    <div class="particle particle-two" aria-hidden="true"></div>
    <div class="particle particle-three" aria-hidden="true"></div>
    <div class="particle particle-four" aria-hidden="true"></div>
    <div class="particle particle-five" aria-hidden="true"></div>
    <div class="particle particle-six" aria-hidden="true"></div>
    <div class="particle particle-seven" aria-hidden="true"></div>
    <div class="particle particle-eight" aria-hidden="true"></div>
    <div class="particle particle-nine" aria-hidden="true"></div>
    <div class="particle particle-ten" aria-hidden="true"></div>

    <div class="velvet-orb orb-one" aria-hidden="true"></div>
    <div class="velvet-orb orb-two" aria-hidden="true"></div>
    <div class="velvet-orb orb-three" aria-hidden="true"></div>

    <section class="velvet-content">
      <span class="eyebrow">CSS Particle Effect</span>

      <h1>Velvet Smooth</h1>

      <p>
        A soft particle animation inspired by the flowing texture
        and gentle movement of velvet fabric.
      </p>

      <div class="status">
        <span class="status-dot"></span>
        Pure CSS · Smooth Motion
      </div>
    </section>

  </main>
</body>
</html>
