<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ease-moon-phase — Indicator Demo</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { min-height: 100vh; background: radial-gradient(ellipse at center,#1a1a3e,#0a0a1a); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2.5rem; font-family: system-ui, sans-serif; color: #c8c8e8; padding: 2rem; }
    h1 { font-size: 1.3rem; font-weight: 400; letter-spacing: 0.08em; }
    .phase-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1.5rem; }
    .phase-card { display: flex; flex-direction: column; align-items: center; gap: 0.5rem; }
    .phase-label { font-size: 0.75rem; color: #8888bb; }
    .moon-body { width: var(--moon-size); height: var(--moon-size); border-radius: 50%; background: var(--moon-color); position: relative; overflow: hidden; box-shadow: 0 0 20px var(--moon-glow); }
    .moon-body::after { content: ''; position: absolute; inset: 0; border-radius: 50%; background: var(--moon-shadow); animation: moon-waxing-crescent var(--moon-duration) ease-in-out infinite; }
    .moon-full { background: var(--moon-color); box-shadow: 0 0 30px var(--moon-glow); }
    .moon-ring { width: calc(var(--moon-size) + 16px); height: calc(var(--moon-size) + 16px); border-radius: 50%; border: 2px solid var(--moon-ring-color); animation: moon-ring-pulse 4s ease-in-out infinite; }
    .phase-waxing .moon-body::after { animation-name: moon-waxing-crescent; }
    .phase-first .moon-body::after { animation-name: moon-first-quarter; }
    .phase-gibbous .moon-body::after { animation-name: moon-waxing-gibbous; }
    .phase-full .moon-body { animation: moon-full var(--moon-duration) ease-in-out infinite; }
    .phase-waning .moon-body::after { animation-name: moon-waning-crescent; animation-direction: reverse; }
  </style>
</head>
<body>
  <h1>ease-moon-phase Indicator</h1>
  <div class="phase-grid">
    <div class="phase-card phase-waxing"><div class="moon-ring"><div class="moon-body"></div></div><span class="phase-label">Waxing Crescent</span></div>
    <div class="phase-card phase-first"><div class="moon-ring"><div class="moon-body"></div></div><span class="phase-label">First Quarter</span></div>
    <div class="phase-card phase-gibbous"><div class="moon-ring"><div class="moon-body"></div></div><span class="phase-label">Waxing Gibbous</span></div>
    <div class="phase-card phase-full"><div class="moon-ring"><div class="moon-body moon-full"></div></div><span class="phase-label">Full Moon</span></div>
  </div>
</body>
</html>
