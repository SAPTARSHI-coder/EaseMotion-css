<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ease Sand Dunes - Parallax Animation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="ease-dune-wrapper" role="img" aria-label="Animated parallax sand dunes in a desert landscape">
    <div class="ease-sun" aria-hidden="true"></div>
    <div class="ease-dune-layer ease-dune-back" aria-hidden="true"></div>
    <div class="ease-dune-layer ease-dune-mid" aria-hidden="true"></div>
    <div class="ease-dune-layer ease-dune-front" aria-hidden="true"></div>
  </div>
  <p style="position: absolute; bottom: 2rem; color: #475569; font-family: system-ui; font-size: 0.875rem;">Pure CSS Parallax. Zero SVG tags in HTML. Zero JavaScript.</p>
</body>
</html>
