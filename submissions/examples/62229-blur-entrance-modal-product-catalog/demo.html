<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blur-Entrance Modal</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<input type="checkbox" id="modal-toggle" hidden>

<section class="hero">

<h1>Product Catalog</h1>

<p>
Pure HTML & CSS Blur-Entrance Modal for Product Catalog Layouts.
</p>

<label for="modal-toggle" class="open-btn">
Quick View Product
</label>

</section>

<div class="overlay">

<div class="modal">

<label for="modal-toggle" class="close-btn">
✕
</label>

<div class="product-image">
💻
</div>

<h2>Gaming Laptop Pro</h2>

<p class="price">
₹1,09,999
</p>

<p class="description">
Powered by the latest processor, RTX graphics, ultra-fast SSD storage,
and a 165Hz display for immersive gaming and productivity.
</p>

<div class="specs">

<span>RTX GPU</span>

<span>165Hz</span>

<span>32GB RAM</span>

<span>1TB SSD</span>

</div>

<div class="actions">

<button class="secondary-btn">
Wishlist
</button>

<button class="primary-btn">
Buy Now
</button>

</div>

</div>

<label for="modal-toggle" class="backdrop"></label>

</div>

</body>

</html>
