<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blur Entrance Modal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<input type="checkbox" id="modal-toggle" hidden>

<label for="modal-toggle" class="open-btn">
    Open Modal
</label>

<div class="overlay">
    <div class="modal">
        <label for="modal-toggle" class="close-btn">&times;</label>

        <h2>Blur Entrance Modal</h2>

        <p>
            A lightweight modal built using only HTML and CSS with a smooth
            blur entrance animation.
        </p>

        <button class="action-btn">Get Started</button>
    </div>
</div>

</body>
</html>
