<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tornado Funnel Swirl Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="plain">
    <div class="tornado" id="tornado" aria-hidden="true">
      <div class="funnel"></div>
      <div class="debris debris-1"></div>
      <div class="debris debris-2"></div>
      <div class="debris debris-3"></div>
      <div class="debris debris-4"></div>
    </div>
    <p class="hint">A funnel swirls down from the cloud deck, whipping debris around it.</p>
  </main>
</body>
</html>
