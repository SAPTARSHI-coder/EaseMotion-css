<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orbital Radar Sonar Scanner HUD - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="radar-wrapper">
    <header class="radar-header">
      <div class="status-badge">
        <span class="pulse-dot"></span>
        DEFENSE GRID ONLINE
      </div>
      <h1 class="title">ORBITAL RADAR SONAR</h1>
      <p class="subtitle">GSSoC 2026 Futuristic Motion Component</p>
    </header>

    <div class="radar-card">
      <!-- Radar Screen -->
      <div class="radar-screen">
        <div class="radar-ring ring-1"></div>
        <div class="radar-ring ring-2"></div>
        <div class="radar-ring ring-3"></div>
        
        <!-- Axis Crosshairs -->
        <div class="crosshair axis-x"></div>
        <div class="crosshair axis-y"></div>

        <!-- 360 Sweep Beam -->
        <div class="sweep-beam"></div>

        <!-- Target Blips with Expanding Sonar Ping Rings -->
        <div class="target-blip blip-1">
          <span class="ping-ring"></span>
          <span class="blip-label">ALPHA-01</span>
        </div>

        <div class="target-blip blip-2">
          <span class="ping-ring"></span>
          <span class="blip-label">BETA-09</span>
        </div>

        <div class="target-blip blip-3">
          <span class="ping-ring"></span>
          <span class="blip-label">GAMMA-04</span>
        </div>
      </div>

      <!-- Telemetry Status Bar -->
      <div class="radar-telemetry">
        <div class="tele-item">
          <span class="tele-label">SCAN RANGE</span>
          <span class="tele-val text-green">5,000 KM</span>
        </div>
        <div class="tele-item">
          <span class="tele-label">TARGETS DETECTED</span>
          <span class="tele-val text-yellow">03 ACTIVE</span>
        </div>
        <div class="tele-item">
          <span class="tele-label">GRID STATUS</span>
          <span class="tele-val text-green">OPTIMAL</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
