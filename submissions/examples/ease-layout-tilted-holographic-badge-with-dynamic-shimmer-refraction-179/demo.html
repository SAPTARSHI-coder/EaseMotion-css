<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tilted Holographic Badge</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="background-blur blur1"></div>
<div class="background-blur blur2"></div>

<section class="container">

    <div class="badge-card">

        <div class="shine"></div>

        <div class="badge">

            <span class="status">PREMIUM</span>

            <h2>Holographic Badge</h2>

            <p>
                Interactive Glassmorphic badge featuring
                dynamic shimmer refraction,
                smooth gradients and animated reflections.
            </p>

            <div class="chips">

                <span>Glass</span>
                <span>Gradient</span>
                <span>Animation</span>

            </div>

        </div>

    </div>

</section>

</body>
</html>
