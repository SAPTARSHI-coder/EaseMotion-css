<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive Radial Metric Gauge Indicator · EaseMotion</title>
  <meta name="description" content="A semi-circular CSS conic-gradient gauge card with animated fills, threshold color states, and numeric readouts for dashboard metrics." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="demo-page">
    <div class="demo-header">
      <h1 class="demo-title">Performance Dashboard</h1>
      <p class="demo-subtitle">Click a metric card to animate the gauge to a new value.</p>
    </div>

    <!-- =========================================================
         GAUGE CARDS GRID
    ========================================================== -->
    <div class="gauge-grid">

      <!-- Card 1: CPU Usage -->
      <article class="gauge-card" data-value="72" data-label="CPU Usage" data-unit="%" aria-label="CPU Usage gauge at 72 percent">
        <div class="gauge-wrapper">
          <svg class="gauge-svg" viewBox="0 0 200 120" aria-hidden="true">
            <!-- Track (background arc) -->
            <path class="gauge-track" d="M 20 110 A 80 80 0 0 1 180 110" />
            <!-- Fill arc (colored, animated) -->
            <path class="gauge-fill" d="M 20 110 A 80 80 0 0 1 180 110" />
            <!-- Needle -->
            <g class="gauge-needle" transform="translate(100, 110)">
              <line x1="0" y1="0" x2="0" y2="-68" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" />
              <circle cx="0" cy="0" r="5" fill="currentColor" />
            </g>
          </svg>
          <!-- Text in center -->
          <div class="gauge-readout">
            <span class="gauge-value">0</span><span class="gauge-unit">%</span>
            <span class="gauge-status-text">—</span>
          </div>
        </div>
        <footer class="gauge-card__footer">
          <p class="gauge-label">CPU Usage</p>
          <div class="gauge-spark">
            <div class="sk-bar" style="height: 14px;"></div>
            <div class="sk-bar" style="height: 20px;"></div>
            <div class="sk-bar" style="height: 10px;"></div>
            <div class="sk-bar" style="height: 28px;"></div>
            <div class="sk-bar" style="height: 18px;"></div>
            <div class="sk-bar" style="height: 22px;"></div>
          </div>
        </footer>
      </article>

      <!-- Card 2: Memory -->
      <article class="gauge-card" data-value="45" data-label="Memory" data-unit="%" aria-label="Memory gauge at 45 percent">
        <div class="gauge-wrapper">
          <svg class="gauge-svg" viewBox="0 0 200 120" aria-hidden="true">
            <path class="gauge-track" d="M 20 110 A 80 80 0 0 1 180 110" />
            <path class="gauge-fill" d="M 20 110 A 80 80 0 0 1 180 110" />
            <g class="gauge-needle" transform="translate(100, 110)">
              <line x1="0" y1="0" x2="0" y2="-68" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" />
              <circle cx="0" cy="0" r="5" fill="currentColor" />
            </g>
          </svg>
          <div class="gauge-readout">
            <span class="gauge-value">0</span><span class="gauge-unit">%</span>
            <span class="gauge-status-text">—</span>
          </div>
        </div>
        <footer class="gauge-card__footer">
          <p class="gauge-label">Memory</p>
          <div class="gauge-spark">
            <div class="sk-bar" style="height: 18px;"></div>
            <div class="sk-bar" style="height: 12px;"></div>
            <div class="sk-bar" style="height: 24px;"></div>
            <div class="sk-bar" style="height: 16px;"></div>
            <div class="sk-bar" style="height: 20px;"></div>
            <div class="sk-bar" style="height: 10px;"></div>
          </div>
        </footer>
      </article>

      <!-- Card 3: Disk I/O -->
      <article class="gauge-card" data-value="91" data-label="Disk I/O" data-unit="%" aria-label="Disk IO gauge at 91 percent">
        <div class="gauge-wrapper">
          <svg class="gauge-svg" viewBox="0 0 200 120" aria-hidden="true">
            <path class="gauge-track" d="M 20 110 A 80 80 0 0 1 180 110" />
            <path class="gauge-fill" d="M 20 110 A 80 80 0 0 1 180 110" />
            <g class="gauge-needle" transform="translate(100, 110)">
              <line x1="0" y1="0" x2="0" y2="-68" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" />
              <circle cx="0" cy="0" r="5" fill="currentColor" />
            </g>
          </svg>
          <div class="gauge-readout">
            <span class="gauge-value">0</span><span class="gauge-unit">%</span>
            <span class="gauge-status-text">—</span>
          </div>
        </div>
        <footer class="gauge-card__footer">
          <p class="gauge-label">Disk I/O</p>
          <div class="gauge-spark">
            <div class="sk-bar" style="height: 22px;"></div>
            <div class="sk-bar" style="height: 28px;"></div>
            <div class="sk-bar" style="height: 18px;"></div>
            <div class="sk-bar" style="height: 30px;"></div>
            <div class="sk-bar" style="height: 24px;"></div>
            <div class="sk-bar" style="height: 28px;"></div>
          </div>
        </footer>
      </article>

    </div>

    <!-- Demo Controls -->
    <div class="demo-controls">
      <p class="demo-controls__label">Randomise All Gauges</p>
      <button type="button" class="btn-randomise" id="btn-randomise">↻ Randomise</button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
