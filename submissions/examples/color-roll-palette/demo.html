<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Color Roll Palette &mdash; EaseMotion CSS Demo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="page-head">
    <p class="kicker">EaseMotion CSS &middot; Theme &amp; FX</p>
    <h1>Color Roll Palette</h1>
    <p class="sub">A rainbow of chips taking turns in the spotlight.</p>
  </header>
  <main class="stage">
    <div class="cr-palette">
      <div class="cr-chip cr-c1"></div>
      <div class="cr-chip cr-c2"></div>
      <div class="cr-chip cr-c3"></div>
      <div class="cr-chip cr-c4"></div>
      <div class="cr-chip cr-c5"></div>
      <div class="cr-chip cr-c6"></div>
    </div>
  </main>
  <p class="stage-caption">Each chip swells and drops its check in turn.</p>
  <footer class="page-foot">
    <span>Pure CSS &middot; zero dependencies</span>
    <span>Rolling swatches</span>
  </footer>
</body>
</html>
