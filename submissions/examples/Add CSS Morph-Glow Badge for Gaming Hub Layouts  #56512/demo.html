<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Morph-Glow Badge - Gaming Hub Showcase</title>
  <link rel="stylesheet" href="../../../easemotion.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="gaming-layout" role="main">
    <article class="gaming-card" tabindex="0" aria-labelledby="server-name">
      
      <header class="card-header">
        <h1 id="server-name" class="server-title">CYBER // GENESIS</h1>
        <!-- Primary Morph-Glow Badge -->
        <span class="ease-badge-morph-glow badge-plasma" role="status" tabindex="0" aria-label="Status: Overdrive Core Active">
          <span class="badge-dot" aria-hidden="true"></span>
          OVERDRIVE CORE
        </span>
      </header>

      <div class="card-body">
        <div class="status-row">
          <span class="status-label">Server Cluster</span>
          <span class="ease-badge-morph-glow badge-cyan delay-1" tabindex="0">
            US-WEST-01
          </span>
        </div>

        <div class="status-row">
          <span class="status-label">Security Protocol</span>
          <span class="ease-badge-morph-glow badge-emerald delay-2" tabindex="0">
            BIO-SHIELD ACTIVE
          </span>
        </div>

        <div class="status-row">
          <span class="status-label">Rank Requirement</span>
          <span class="ease-badge-morph-glow badge-purple" tabindex="0">
            <span class="badge-dot" aria-hidden="true"></span>
            VOID TIER
          </span>
        </div>
      </div>

      <footer class="card-footer">
        <button class="btn-cyber">Initialize Link ➔</button>
      </footer>

    </article>
  </main>
</body>
</html>
