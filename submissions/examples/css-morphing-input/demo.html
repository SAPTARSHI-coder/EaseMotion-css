<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Morphing Input</title>

    <link rel="stylesheet" href="style.css">
</head>


<body>


<section class="container">

    <h1>CSS Morphing Input</h1>


    <div class="input-wrapper">

        <input 
            type="text"
            id="morph-input"
            placeholder="Enter your data..."
            aria-label="Morphing input field"
        >

    </div>


    <p>
        Input changes shape on focus
    </p>


</section>


</body>

</html>
