<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather Card - EaseMotion Submission</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="stage">
    <div class="weather-card" id="weatherCard">
      <div class="sky" aria-hidden="true">
        <div class="sun">
          <span class="sun-core"></span>
        </div>
        <div class="cloud c1"></div>
        <div class="cloud c2"></div>
        <div class="rain" id="rainLayer">
          <span class="drop d1"></span>
          <span class="drop d2"></span>
          <span class="drop d3"></span>
          <span class="drop d4"></span>
          <span class="drop d5"></span>
          <span class="drop d6"></span>
        </div>
      </div>
      <div class="weather-body">
        <div class="loc-row">
          <span class="loc">Bengaluru</span>
          <span class="temp" id="temp">31°</span>
        </div>
        <div class="cond-row">
          <span class="cond" id="cond">Sunny</span>
          <span class="range">H 34° · L 22°</span>
        </div>
        <div class="hourly" id="hourly">
          <span class="slot">09:00</span>
          <span class="slot">12:00</span>
          <span class="slot">15:00</span>
          <span class="slot">18:00</span>
          <span class="slot">21:00</span>
        </div>
      </div>
    </div>
    <div class="controls">
      <button class="mode-btn" id="sunBtn">Sunny</button>
      <button class="mode-btn" id="rainBtn">Rain</button>
    </div>
    <p class="hint">Toggle the scene — sun rays spin, clouds drift and raindrops fall.</p>
  </main>

  <script>
    const card = document.getElementById('weatherCard');
    const temp = document.getElementById('temp');
    const cond = document.getElementById('cond');

    document.getElementById('sunBtn').addEventListener('click', () => {
      card.classList.remove('is-raining');
      temp.textContent = '31°';
      cond.textContent = 'Sunny';
    });

    document.getElementById('rainBtn').addEventListener('click', () => {
      card.classList.add('is-raining');
      temp.textContent = '24°';
      cond.textContent = 'Showers';
    });
  </script>
</body>
</html>
