<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Semaphore Blade Drop — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Semaphore Blade Drop demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Semaphore Blade Drop</h1>
      <p class="lede">Semaphore blade dropping to caution</p>
    </header>

    <section class="ease-semaphore-blade-drop" data-demo="semaphore-blade-drop" aria-live="polite">
      <div class="ease-semaphore-blade-drop__housing">
        <div class="ease-semaphore-blade-drop__bezel">
          <div class="ease-semaphore-blade-drop__face">
            <div class="ease-semaphore-blade-drop__readout">
              <span class="ease-semaphore-blade-drop__label">Semaphore Blade Drop</span>
              <span class="ease-semaphore-blade-drop__value">LIVE</span>
            </div>
            <div class="ease-semaphore-blade-drop__motion" aria-hidden="true">
              <span class="ease-semaphore-blade-drop__a"></span>
              <span class="ease-semaphore-blade-drop__b"></span>
              <span class="ease-semaphore-blade-drop__c"></span>
              <span class="ease-semaphore-blade-drop__d"></span>
            </div>
            <div class="ease-semaphore-blade-drop__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-semaphore-blade-drop__controls">
          <button type="button" class="ease-semaphore-blade-drop__btn primary">Drop</button>
          <button type="button" class="ease-semaphore-blade-drop__btn">On</button>
          <label class="ease-semaphore-blade-drop__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-semaphore-blade-drop__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
