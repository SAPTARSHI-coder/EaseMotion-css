<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CSS water intake tracker with animated glass fill.">
  <title>CSS Water Intake Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="tracker" aria-labelledby="tracker-title">

    <header class="tracker-header">
      <div>
        <span class="eyebrow">Daily hydration</span>
        <h1 id="tracker-title">Water Intake</h1>
      </div>

      <span class="goal">6 / 8 glasses</span>
    </header>

    <div
      class="glasses"
      role="group"
      aria-label="Six of eight glasses completed"
    >
      <div class="glass filled" aria-label="Glass 1 completed">
        <span>1</span>
      </div>

      <div class="glass filled" aria-label="Glass 2 completed">
        <span>2</span>
      </div>

      <div class="glass filled" aria-label="Glass 3 completed">
        <span>3</span>
      </div>

      <div class="glass filled" aria-label="Glass 4 completed">
        <span>4</span>
      </div>

      <div class="glass filled" aria-label="Glass 5 completed">
        <span>5</span>
      </div>

      <div class="glass filled" aria-label="Glass 6 completed">
        <span>6</span>
      </div>

      <div class="glass" aria-label="Glass 7 remaining">
        <span>7</span>
      </div>

      <div class="glass" aria-label="Glass 8 remaining">
        <span>8</span>
      </div>
    </div>

    <p class="message">
      Great progress! <strong>2 more glasses</strong> to reach your daily goal.
    </p>

  </main>

</body>
</html>
