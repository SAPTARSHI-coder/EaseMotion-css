<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Particle Constellation - Neumorphic</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="scene">
    <canvas id="canvas"></canvas>

    <section class="card">
      <div class="icon">✦</div>
      <span class="label">EASEMOTION</span>

      <h1>Particle<br><span>Constellation</span></h1>

      <p>
        A smooth interactive particle network powered by
        HTML Canvas and lightweight JavaScript.
      </p>

      <button id="toggleBtn">
        <span>✦</span> Explore Network
      </button>
    </section>
  </main>

  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const button = document.getElementById("toggleBtn");

    let particles = [];
    let animation = true;

    const mouse = {
      x: null,
      y: null,
      radius: 140
    };

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      createParticles();
    }

    class Particle {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 2 + 1;

        this.vx = (Math.random() - 0.5) * 0.5;
        this.vy = (Math.random() - 0.5) * 0.5;
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;

        if (this.x <= 0 || this.x >= canvas.width) {
          this.vx *= -1;
        }

        if (this.y <= 0 || this.y >= canvas.height) {
          this.vy *= -1;
        }

        if (mouse.x !== null) {
          const dx = this.x - mouse.x;
          const dy = this.y - mouse.y;
          const distance = Math.sqrt(dx * dx + dy * dy);

          if (distance < mouse.radius) {
            const angle = Math.atan2(dy, dx);
            const force = (mouse.radius - distance) / mouse.radius;

            this.x += Math.cos(angle) * force * 1.5;
            this.y += Math.sin(angle) * force * 1.5;
          }
        }
      }

      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = "#8b5cf6";
        ctx.fill();
      }
    }

    function createParticles() {
      particles = [];

      const count = window.innerWidth < 600 ? 45 : 90;

      for (let i = 0; i < count; i++) {
        particles.push(new Particle());
      }
    }

    function connect() {
      for (let i = 0; i < particles.length; i++) {
        for (let j = i + 1; j < particles.length; j++) {

          const dx = particles[i].x - particles[j].x;
          const dy = particles[i].y - particles[j].y;
          const distance = Math.sqrt(dx * dx + dy * dy);

          if (distance < 115) {
            const opacity = 1 - distance / 115;

            ctx.beginPath();
            ctx.moveTo(particles[i].x, particles[i].y);
            ctx.lineTo(particles[j].x, particles[j].y);

            ctx.strokeStyle =
              `rgba(139, 92, 246, ${opacity * 0.35})`;

            ctx.lineWidth = 1;
            ctx.stroke();
          }
        }
      }
    }

    function animate() {
      if (!animation) {
        requestAnimationFrame(animate);
        return;
      }

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      particles.forEach(particle => {
        particle.update();
        particle.draw();
      });

      connect();

      requestAnimationFrame(animate);
    }

    canvas.addEventListener("mousemove", event => {
      mouse.x = event.clientX;
      mouse.y = event.clientY;
    });

    canvas.addEventListener("mouseleave", () => {
      mouse.x = null;
      mouse.y = null;
    });

    button.addEventListener("click", () => {
      mouse.radius = mouse.radius === 140 ? 250 : 140;
      button.classList.toggle("active");
    });

    window.addEventListener("resize", resize);

    resize();
    animate();
  </script>
</body>
</html>
