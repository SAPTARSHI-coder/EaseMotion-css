<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Retro Arcade Pixel Bento Card built with pure HTML and CSS"
  >
  <title>Retro Arcade Pixel Bento</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="page">
    <section class="arcade-bento" aria-label="Retro Arcade Pixel Bento">

      <article class="pixel-card hero-card">
        <div class="scanlines" aria-hidden="true"></div>
        <div class="pixel-grid" aria-hidden="true"></div>

        <div class="card-content">
          <span class="pixel-label">PLAYER 01</span>

          <h1>
            RETRO
            <span>ARCADE</span>
          </h1>

          <p>
            INSERT COIN TO ENTER THE PIXEL ZONE
          </p>

          <button type="button" class="arcade-button">
            START GAME
          </button>
        </div>

        <div class="pixel-orb" aria-hidden="true"></div>
      </article>

      <article class="pixel-card score-card">
        <div class="card-content">
          <span class="pixel-label">HIGH SCORE</span>

          <div class="score">
            98250
          </div>

          <div class="score-bar" aria-hidden="true">
            <span></span>
          </div>

          <p>NEW RECORD</p>
        </div>
      </article>

      <article class="pixel-card status-card">
        <div class="card-content">
          <span class="pixel-label">SYSTEM</span>

          <h2>ONLINE</h2>

          <div class="status">
            <span></span>
            ARCADE READY
          </div>
        </div>
      </article>

      <article class="pixel-card wide-card">
        <div class="pixel-character" aria-hidden="true">
          <span></span>
          <span></span>
          <span></span>
        </div>

        <div class="card-content">
          <span class="pixel-label">LEVEL 08</span>

          <h2>PIXEL POWER</h2>

          <p>
            A playful retro-inspired bento interface using
            pixel grids, arcade colors and classic game HUD effects.
          </p>
        </div>
      </article>

      <article class="pixel-card coin-card">
        <div class="card-content">
          <span class="pixel-label">COINS</span>

          <div class="coins" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
          </div>

          <p>03 CREDITS</p>
        </div>
      </article>

    </section>
  </main>
</body>
</html>
