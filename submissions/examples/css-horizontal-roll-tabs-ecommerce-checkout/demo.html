<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Horizontal Roll Tabs - E-Commerce Checkout Layouts</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<main class="checkout-interface">


<header class="hero">

    <h1>
        CSS Horizontal Roll Tabs
    </h1>

    <p>
        A pure CSS animated tab component with smooth
        horizontal roll transitions for e-commerce checkout layouts.
    </p>

</header>





<nav class="tabs" aria-label="Checkout Navigation">


<a href="#" class="tab active">

    <span class="icon">
        🛒
    </span>

    Cart

</a>



<a href="#" class="tab">

    <span class="icon">
        📦
    </span>

    Shipping

</a>



<a href="#" class="tab">

    <span class="icon">
        💳
    </span>

    Payment

</a>



<a href="#" class="tab">

    <span class="icon">
        ✅
    </span>

    Confirmation

</a>



</nav>





<section class="checkout-card">


<h2>
    Secure Checkout Experience
</h2>


<p>
    Smooth horizontal roll interactions designed
    for modern shopping checkout workflows.
</p>


</section>



</main>


</body>

</html>
