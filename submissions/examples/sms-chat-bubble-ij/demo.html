<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-sms-chat-bubble</title>
</head>
<body>
<main class="scb-phone">
  <header class="scb-head">
    <h1 class="scb-contact">Maya</h1>
    <span class="scb-status">online</span>
  </header>
  <section class="scb-thread" aria-label="message thread">
    <p class="scb-in">Hey, are we still on for lunch?</p>
    <p class="scb-in">I found a spot near the park.</p>
    <p class="scb-out">Sounds good, see you at noon.</p>
    <p class="scb-in">Perfect, I will grab us a table.</p>
    <p class="scb-out">On my way now.</p>
    <div class="scb-typing" aria-label="typing indicator">
      <span class="scb-typing-dot"></span>
      <span class="scb-typing-dot"></span>
      <span class="scb-typing-dot"></span>
    </div>
  </section>
  <section class="scb-compose" aria-label="message composer">
    <input class="scb-input" value="Type a message" aria-label="message input">
    <button class="scb-send">Send</button>
  </section>
  <footer class="scb-foot">
    <span class="scb-delivered">Delivered 12:04</span>
    <span class="scb-ticks">vv</span>
  </footer>
</main>
</body>
</html>
