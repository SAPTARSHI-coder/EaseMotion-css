<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ice Cream Soft Serve — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Ice Cream Soft Serve demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Ice Cream Soft Serve</h1>
      <p class="lede">Soft-serve swirl rising from a cone with soft morphing peaks</p>
    </header>

    <section class="ease-ice-cream-soft-serve" data-demo="ice-cream-soft-serve" aria-live="polite">
      <div class="ease-ice-cream-soft-serve__housing">
        <div class="ease-ice-cream-soft-serve__bezel">
          <div class="ease-ice-cream-soft-serve__face">
            <div class="ease-ice-cream-soft-serve__readout">
              <span class="ease-ice-cream-soft-serve__label">Ice Cream Soft Serve</span>
              <span class="ease-ice-cream-soft-serve__value" id="val-ice-cream-soft-serve">READY</span>
            </div>
            <div class="ease-ice-cream-soft-serve__motion" aria-hidden="true">
              <span class="ease-ice-cream-soft-serve__arm"></span>
              <span class="ease-ice-cream-soft-serve__core"></span>
              <span class="ease-ice-cream-soft-serve__trail"></span>
              <span class="ease-ice-cream-soft-serve__mark m1"></span>
              <span class="ease-ice-cream-soft-serve__mark m2"></span>
              <span class="ease-ice-cream-soft-serve__mark m3"></span>
            </div>
            <div class="ease-ice-cream-soft-serve__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-ice-cream-soft-serve__controls">
          <button type="button" class="ease-ice-cream-soft-serve__btn primary">Engage</button>
          <button type="button" class="ease-ice-cream-soft-serve__btn">Reset</button>
          <label class="ease-ice-cream-soft-serve__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-ice-cream-soft-serve__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
