<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teleportation Fidelity Monitors QTFM - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css"></head><body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030712; color: #ffffff;">

    <div class="ease-card ease-card-glass qtfm-container">
        <div class="qtfm-header">
            <h2>Teleportation Fidelity Monitor</h2>
            <span class="ease-badge ease-badge-success">Fault-Tolerant Quantum</span>
        </div>
        
        <div class="qtfm-screen ease-center">
            <div class="qtfm-flux flux-qtfm-a"></div>
            <div class="qtfm-flux flux-qtfm-b"></div>
            <div class="qtfm-boundary-ring"></div>
            <div class="qtfm-core ease-center"></div>
        </div>

        <div class="qtfm-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Real-Time State Fidelity &amp; Drift Tracking</span>
            <button class="ease-btn ease-btn-success ease-btn-sm ease-hover-grow">Run Fidelity Monitor</button>
        </div>
    </div></body></html>
