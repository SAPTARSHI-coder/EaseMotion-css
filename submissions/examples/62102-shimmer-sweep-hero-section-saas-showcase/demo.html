<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EaseMotion CSS | Shimmer-Sweep Hero Section</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>

<section class="hero">

    <div class="hero-bg"></div>
    <div class="grid-overlay"></div>

    <header class="navbar">
        <h2 class="logo">
            EaseMotion
        </h2>

        <nav>
            <a href="#">Home</a>
            <a href="#">Solutions</a>
            <a href="#">Pricing</a>
            <a href="#">Contact</a>
        </nav>

        <button class="nav-btn">
            Get Started
        </button>
    </header>

    <div class="hero-content">

        <div class="hero-left">

            <span class="badge">
                ✨ New AI Release
            </span>

            <h1>
                Build Modern SaaS
                Experiences Faster
            </h1>

            <p>
                Launch scalable applications with powerful UI components,
                animated layouts, and lightning-fast workflows designed for
                modern startups.
            </p>

            <div class="hero-buttons">

                <button class="primary-btn">
                    Start Free
                </button>

                <button class="secondary-btn">
                    Live Demo
                </button>

            </div>

            <div class="stats">

                <div class="stat-card">
                    <h3>120K+</h3>
                    <span>Users</span>
                </div>

                <div class="stat-card">
                    <h3>99.9%</h3>
                    <span>Uptime</span>
                </div>

                <div class="stat-card">
                    <h3>4.9★</h3>
                    <span>Rating</span>
                </div>

            </div>

        </div>

        <div class="hero-right">

            <div class="dashboard-card">

                <div class="window-bar">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>

                <div class="dashboard-content">

                    <div class="chart-box"></div>

                    <div class="progress-list">

                        <div class="progress-item">
                            <label>Growth</label>
                            <div class="progress">
                                <span style="width:92%;"></span>
                            </div>
                        </div>

                        <div class="progress-item">
                            <label>Traffic</label>
                            <div class="progress">
                                <span style="width:78%;"></span>
                            </div>
                        </div>

                        <div class="progress-item">
                            <label>Revenue</label>
                            <div class="progress">
                                <span style="width:86%;"></span>
                            </div>
                        </div>

                    </div>

                </div>

            </div>

            <div class="floating-card card-one">
                +42% Growth
            </div>

            <div class="floating-card card-two">
                AI Powered
            </div>

        </div>

    </div>

</section>

</body>
</html>
