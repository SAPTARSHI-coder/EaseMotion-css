<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Pure CSS music note burst animation"
  >
  <title>CSS Music Note Burst</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="demo">
    <h1>Music Note Burst</h1>
    <p class="description">
      Musical notes burst and float upward from the source.
    </p>

    <section
      class="music-burst"
      aria-label="Animated music note burst"
    >
      <span class="note note-1" aria-hidden="true">♪</span>
      <span class="note note-2" aria-hidden="true">♫</span>
      <span class="note note-3" aria-hidden="true">♬</span>
      <span class="note note-4" aria-hidden="true">♪</span>
      <span class="note note-5" aria-hidden="true">♫</span>
      <span class="note note-6" aria-hidden="true">♪</span>

      <div class="source" aria-hidden="true">
        <span class="source-icon">♫</span>
      </div>
    </section>

    <p class="hint">Pure CSS animation · No JavaScript</p>
  </main>
</body>
</html>
