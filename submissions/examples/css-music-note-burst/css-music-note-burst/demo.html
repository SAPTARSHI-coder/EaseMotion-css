<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Music Note Burst</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="page">
    <section class="music-demo" aria-labelledby="music-title">
      <p class="eyebrow">CSS Animation</p>

      <h1 id="music-title">Music Note Burst</h1>

      <p class="description">
        Musical notes burst upward from a source using only CSS.
      </p>

      <div class="burst" role="img" aria-label="Animated musical notes floating upward">
        <span class="note note-one" aria-hidden="true">♪</span>
        <span class="note note-two" aria-hidden="true">♫</span>
        <span class="note note-three" aria-hidden="true">♪</span>
        <span class="note note-four" aria-hidden="true">♬</span>
        <span class="note note-five" aria-hidden="true">♪</span>
        <span class="note note-six" aria-hidden="true">♫</span>

        <span class="source" aria-hidden="true">♫</span>
      </div>
    </section>
  </main>
</body>
</html>
