<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Pure CSS glassmorphism blur particle effect"
  >
  <title>Glassmorphism Particle Effect</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="particle-scene" aria-label="Glassmorphism particle animation">
    <div class="particle particle-1" aria-hidden="true"></div>
    <div class="particle particle-2" aria-hidden="true"></div>
    <div class="particle particle-3" aria-hidden="true"></div>
    <div class="particle particle-4" aria-hidden="true"></div>
    <div class="particle particle-5" aria-hidden="true"></div>
    <div class="particle particle-6" aria-hidden="true"></div>
    <div class="particle particle-7" aria-hidden="true"></div>
    <div class="particle particle-8" aria-hidden="true"></div>

    <section class="content">
      <span class="label">CSS Particle Effect</span>
      <h1>Glassmorphism Blur</h1>
      <p>
        Floating particles with a soft glassmorphism blur effect,
        created using HTML and CSS only.
      </p>
    </section>
  </main>
</body>
</html>
