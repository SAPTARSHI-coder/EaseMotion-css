<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <meta
    name="description"
    content="CSS animated pinwheel spin animation"
  >
  <title>CSS Pinwheel Spin Animation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">
    <section class="pinwheel-demo" aria-labelledby="title">

      <p class="eyebrow">EaseMotion CSS</p>

      <h1 id="title">Pinwheel Spin</h1>

      <p class="intro">
        A colorful CSS-only pinwheel continuously spinning
        like a toy catching the wind.
      </p>

      <div class="scene">

        <div
          class="pinwheel"
          role="img"
          aria-label="Animated colorful spinning pinwheel"
        >
          <div class="blade blade-one"></div>
          <div class="blade blade-two"></div>
          <div class="blade blade-three"></div>
          <div class="blade blade-four"></div>
          <div class="hub"></div>
        </div>

        <div class="stick" aria-hidden="true"></div>
        <div class="ground" aria-hidden="true"></div>

      </div>

      <p class="status">
        <span aria-hidden="true"></span>
        Spinning in the wind
      </p>

    </section>
  </main>

</body>
</html>
