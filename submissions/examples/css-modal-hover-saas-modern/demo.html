<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hover Modal SaaS Modern</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="hover-modal-wrapper">
        <button class="trigger-btn">Hover for Details</button>
        <div class="saas-modal">
            <div class="modal-header">
                <h3>Workspace Settings</h3>
            </div>
            <div class="modal-body">
                <p>Manage your team's access controls and billing information. Changes will take effect immediately across all active sessions.</p>
                <div class="action-row">
                    <button class="btn btn-secondary">Cancel</button>
                    <button class="btn btn-primary">Save Changes</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
