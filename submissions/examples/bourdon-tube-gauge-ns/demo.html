<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bourdon Tube Gauge — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Bourdon Tube Gauge demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Bourdon Tube Gauge</h1>
      <p class="lede">Bourdon-tube pressure gauge needle sweeping the dial</p>
    </header>

    <section class="ease-bourdon-tube-gauge" data-demo="bourdon-tube-gauge" aria-live="polite">
      <div class="ease-bourdon-tube-gauge__housing">
        <div class="ease-bourdon-tube-gauge__bezel">
          <div class="ease-bourdon-tube-gauge__face">
            <div class="ease-bourdon-tube-gauge__readout">
              <span class="ease-bourdon-tube-gauge__label">Bourdon Tube Gauge</span>
              <span class="ease-bourdon-tube-gauge__value">LIVE</span>
            </div>
            <div class="ease-bourdon-tube-gauge__motion" aria-hidden="true">
              <span class="ease-bourdon-tube-gauge__a"></span>
              <span class="ease-bourdon-tube-gauge__b"></span>
              <span class="ease-bourdon-tube-gauge__c"></span>
              <span class="ease-bourdon-tube-gauge__d"></span>
            </div>
            <div class="ease-bourdon-tube-gauge__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-bourdon-tube-gauge__controls">
          <button type="button" class="ease-bourdon-tube-gauge__btn primary">Engage</button>
          <button type="button" class="ease-bourdon-tube-gauge__btn">Reset</button>
          <label class="ease-bourdon-tube-gauge__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-bourdon-tube-gauge__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
