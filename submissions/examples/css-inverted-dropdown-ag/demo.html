<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Inverted Dropdown</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="demo-wrapper">
      <header class="demo-header">
        <h1>CSS Inverted Dropdown</h1>
        <p>
          Pure CSS upward-opening dropdown menu designed for bottom viewport
          positioning.
        </p>
      </header>

      <main class="demo-card">
        <h2>Inverted Dropdown Menu</h2>
        <p class="demo-card-sub">Opens upward from trigger button.</p>

        <div class="demo-stage">
          <details class="dropdown" data-position="top">
            <summary class="dropdown-trigger" aria-haspopup="menu">
              <span>Actions Menu</span>
              <svg
                class="dropdown-icon"
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <polyline points="18 15 12 9 6 15"></polyline>
              </svg>
            </summary>
            <ul class="dropdown-menu" role="menu">
              <li role="none">
                <a href="#" role="menuitem" class="dropdown-item"
                  >Documentation</a
                >
              </li>
              <li role="none">
                <a href="#" role="menuitem" class="dropdown-item"
                  >Keyboard Shortcuts</a
                >
              </li>
              <li role="none">
                <a href="#" role="menuitem" class="dropdown-item">Settings</a>
              </li>
              <li role="separator" class="dropdown-divider"></li>
              <li role="none">
                <a
                  href="#"
                  role="menuitem"
                  class="dropdown-item dropdown-item--danger"
                  >Sign Out</a
                >
              </li>
            </ul>
          </details>
        </div>
      </main>
    </div>
  </body>
</html>
