<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scale Hover Progress Bar</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<section class="container">

    <div class="glass-card">

        <h1>Scale Hover Progress Bar</h1>
        <p>
            Modern glassmorphism progress indicators with smooth CSS scaling effects.
        </p>

        <div class="progress-box">
            <div class="progress-title">
                <span>HTML & CSS</span>
                <span>90%</span>
            </div>

            <div class="progress">
                <div class="progress-fill html"></div>
            </div>
        </div>


        <div class="progress-box">
            <div class="progress-title">
                <span>JavaScript</span>
                <span>75%</span>
            </div>

            <div class="progress">
                <div class="progress-fill js"></div>
            </div>
        </div>


        <div class="progress-box">
            <div class="progress-title">
                <span>React</span>
                <span>85%</span>
            </div>

            <div class="progress">
                <div class="progress-fill react"></div>
            </div>
        </div>


    </div>

</section>

</body>
</html>
