<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    name="description"
    content="Metallic Sheen glassmorphism UI created with pure HTML and CSS."
  />
  <title>Metallic Sheen Glass Effect</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <section class="glass-card" aria-labelledby="card-title">
      <div class="shine" aria-hidden="true"></div>

      <div class="card-content">
        <span class="badge">METALLIC SERIES</span>

        <h1 id="card-title">Metallic Sheen</h1>

        <p>
          A polished glassmorphism interface with a smooth metallic reflection,
          subtle depth, and responsive CSS-only motion.
        </p>

        <div class="card-meta">
          <span>Pure CSS</span>
          <span>Glass UI</span>
          <span>60 FPS</span>
        </div>

        <a class="cta" href="#demo">
          Explore Effect
          <span aria-hidden="true">→</span>
        </a>
      </div>
    </section>

    <p class="hint" id="demo">
      Hover over the card to reveal the metallic sheen.
    </p>
  </main>
</body>
</html>
