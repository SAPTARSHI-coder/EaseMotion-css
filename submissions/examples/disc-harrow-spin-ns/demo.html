<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ease Disc Harrow Spin</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

<main class="showcase">

  <section class="ease-disc-harrow-spin">

    <header class="machine-header">
      <span class="status"></span>
      <h1>Disc Harrow System</h1>
    </header>


    <div class="harrow-machine">

      <div class="control-panel">
        <div class="dial">
          <span>RPM</span>
        </div>

        <div class="indicator">
          ACTIVE
        </div>
      </div>


      <div class="disc-frame">

        <div class="disc disc-one">
          <span></span>
        </div>

        <div class="disc disc-two">
          <span></span>
        </div>

        <div class="disc disc-three">
          <span></span>
        </div>

      </div>


      <div class="soil"></div>

    </div>


    <p class="label">
      Agricultural blade rotation simulation
    </p>

  </section>

</main>

</body>
</html>
