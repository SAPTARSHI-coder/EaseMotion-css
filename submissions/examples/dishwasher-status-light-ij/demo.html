<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-dishwasher-status-light</title>
</head>
<body>
<main class="dsl-panel">
  <header class="dsl-top">
    <h1 class="dsl-model">AquaClean</h1>
    <span class="dsl-sound">Quiet</span>
  </header>
  <section class="dsl-cycles" aria-label="wash cycles">
    <button class="dsl-cycle">Normal</button>
    <button class="dsl-cycle">Heavy</button>
    <button class="dsl-cycle">Glass</button>
  </section>
  <section class="dsl-track" aria-label="cycle progress">
    <span class="dsl-bar"></span>
  </section>
  <footer class="dsl-foot">
    <span class="dsl-light">Wash</span>
    <span class="dsl-light">Rinse</span>
    <span class="dsl-light">Dry</span>
    <span class="dsl-clean">Clean</span>
  </footer>
</main>
</body>
</html>
