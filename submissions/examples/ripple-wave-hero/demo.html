<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A pure CSS ripple-wave hero section for glassmorphism interfaces.">
  <title>Ripple-Wave Hero</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="hero-shell">
    <section class="hero" aria-labelledby="hero-title">
      <div class="hero__waves" aria-hidden="true">
        <span></span><span></span><span></span><span></span>
      </div>
      <div class="hero__content">
        <p class="hero__eyebrow">EaseMotion CSS · Motion Showcase</p>
        <h1 id="hero-title">Build boldly.<br><span>Move naturally.</span></h1>
        <p class="hero__copy">A glassmorphism hero with a calm ripple field that gives technology products a living, responsive first impression.</p>
        <div class="hero__actions">
          <a class="hero__button hero__button--primary" href="#explore">Explore the motion</a>
          <a class="hero__button hero__button--ghost" href="#details">View details</a>
        </div>
      </div>
      <div class="hero__meta" id="details">
        <span>Pure CSS</span><span>Responsive</span><span>Reduced motion ready</span>
      </div>
    </section>
  </main>
</body>
</html>
