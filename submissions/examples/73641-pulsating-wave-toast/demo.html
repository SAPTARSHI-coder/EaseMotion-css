<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Pulsating Wave CSS Toast Notification"
  >
  <title>Pulsating Wave Toast</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">
    <section class="demo-card">
      <span class="eyebrow">CSS TOAST</span>

      <h1>Pulsating Wave</h1>

      <p class="description">
        A smooth CSS-only toast notification enhanced with continuously
        expanding wave rings and subtle depth.
      </p>

      <div class="toast-stage">

        <div
          class="toast"
          role="status"
          aria-live="polite"
        >
          <div class="wave-icon" aria-hidden="true">
            <span class="wave-ring wave-ring--one"></span>
            <span class="wave-ring wave-ring--two"></span>
            <span class="wave-ring wave-ring--three"></span>

            <span class="icon-core">✓</span>
          </div>

          <div class="toast-content">
            <strong>Changes saved</strong>
            <p>Your updates have been saved successfully.</p>
          </div>

          <button
            class="toast-close"
            type="button"
            aria-label="Dismiss notification"
          >
            ×
          </button>
        </div>

      </div>

      <p class="hint">
        Pure HTML &amp; CSS · No JavaScript required
      </p>
    </section>
  </main>

</body>
</html>
