<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Biometric Scanner HUD Authorization Card | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
</head>
<body>
  <div class="bio-wrapper">
    <div class="bio-card">
      <div class="card-edge top-l"></div>
      <div class="card-edge bottom-r"></div>

      <header class="bio-header">
        <span class="security-level">LEVEL 5 CLEARANCE</span>
        <h1 class="bio-title">BIOMETRIC AUTH</h1>
      </header>

      <!-- Fingerprint Scanner Area -->
      <div class="scanner-container">
        <div class="fingerprint-icon">
          <svg viewBox="0 0 100 100" class="fp-svg">
            <path d="M50 15 A35 35 0 0 1 85 50" class="fp-ring r1"/>
            <path d="M50 25 A25 25 0 0 1 75 50" class="fp-ring r2"/>
            <path d="M50 35 A15 15 0 0 1 65 50" class="fp-ring r3"/>
            <path d="M50 45 A5 5 0 0 1 55 50" class="fp-ring r4"/>
            <path d="M15 50 A35 35 0 0 1 50 15" class="fp-ring r1"/>
            <path d="M25 50 A25 25 0 0 1 50 25" class="fp-ring r2"/>
            <circle cx="50" cy="50" r="4" class="fp-core"/>
          </svg>
        </div>
        <div class="scan-laser"></div>
        <div class="radar-sweep"></div>
      </div>

      <!-- Identity Metrics -->
      <div class="bio-status-box">
        <div class="status-indicator"></div>
        <span class="status-label">SCANNING BIOMETRIC DATA...</span>
      </div>

      <div class="bio-details">
        <div class="detail-row">
          <span>USER ID:</span>
          <strong>AGENT_9942</strong>
        </div>
        <div class="detail-row">
          <span>DNA MATCH:</span>
          <strong class="match-highlight">99.98% VERIFIED</strong>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
