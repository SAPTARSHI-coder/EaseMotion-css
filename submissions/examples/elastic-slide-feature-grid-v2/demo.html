<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elastic Slide Feature Grid</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<section class="feature-section">

    <h1>Creative Portfolio Features</h1>

    <div class="feature-grid">

        <article class="feature-card">
            <div class="icon">🎨</div>
            <h3>Creative Design</h3>
            <p>Beautiful and modern interface designs.</p>
        </article>

        <article class="feature-card">
            <div class="icon">⚡</div>
            <h3>Performance</h3>
            <p>Optimized for fast loading and smooth UX.</p>
        </article>

        <article class="feature-card">
            <div class="icon">📱</div>
            <h3>Responsive</h3>
            <p>Looks great on desktop, tablet and mobile.</p>
        </article>

        <article class="feature-card">
            <div class="icon">🚀</div>
            <h3>Deployment</h3>
            <p>Production-ready and easy to integrate.</p>
        </article>

    </div>

</section>

</body>
</html>
