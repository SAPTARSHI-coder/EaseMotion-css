<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Navbar: Dark Mode</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- The Navbar -->
    <nav class="dark-navbar">
        <div class="nav-container">
            
            <!-- Branding -->
            <a href="#" class="nav-brand">
                <span class="brand-icon">
                    <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                </span>
                <span class="brand-text">Nexus</span>
            </a>
            
            <!-- Mobile Toggle Hack -->
            <input type="checkbox" id="nav-toggle" class="nav-toggle-input">
            
            <!-- Hamburger Icon -->
            <label for="nav-toggle" class="nav-toggle-label" aria-label="Toggle Navigation">
                <span class="hamburger"></span>
            </label>
            
            <!-- Navigation Links -->
            <ul class="nav-menu">
                <li><a href="#" class="nav-link active">Home</a></li>
                <li><a href="#" class="nav-link">Products</a></li>
                <li><a href="#" class="nav-link">Solutions</a></li>
                <li><a href="#" class="nav-link">Pricing</a></li>
                <li><a href="#" class="nav-cta">Get Started</a></li>
            </ul>
            
        </div>
    </nav>

    <!-- Dummy page content -->
    <div class="page-content">
        <h1 class="page-title">Welcome to Nexus</h1>
        <p>This page demonstrates a sleek, responsive dark mode navigation bar built entirely with CSS.</p>
        <p>Resize the window to see the mobile menu in action.</p>
    </div>

</body>
</html>
