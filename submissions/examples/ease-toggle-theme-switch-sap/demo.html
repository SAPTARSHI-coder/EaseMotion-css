<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Toggle Theme Switch</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <button
      class="theme-toggle"
      id="themeToggle"
      role="switch"
      aria-checked="false"
      aria-label="Toggle dark mode"
    >
      <span class="toggle-track">
        <span class="toggle-icon icon-sun">☀️</span>
        <span class="toggle-icon icon-moon">🌙</span>
        <span class="toggle-thumb"></span>
      </span>
    </button>

    <h1>Toggle Theme Switch</h1>
    <p>This demo page switches between light and dark mode.</p>
  </main>

  <script>
    const toggle = document.getElementById('themeToggle');
    toggle.addEventListener('click', () => {
      const isDark = toggle.getAttribute('aria-checked') === 'true';
      const nowDark = !isDark;
      toggle.setAttribute('aria-checked', String(nowDark));
      document.body.classList.toggle('dark', nowDark);
    });
  </script>
</body>
</html>
