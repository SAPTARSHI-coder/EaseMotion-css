<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Ripple-Wave Toast — SaaS Showcase</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="ease-container">
    <p class="ease-eyebrow">Cloud Workspace</p>
    <h1 class="ease-heading">Data Synchronization</h1>
    <p class="ease-subtitle">Trigger or hover the toast to activate the subtle SaaS-themed ripple pulse.</p>

    <div class="ease-toast-wrapper">
      <input type="checkbox" id="ease-saas-toast-toggle" class="ease-toast-input" checked />
      
      <label for="ease-saas-toast-toggle" class="ease-trigger-btn">
        Toggle Notification
      </label>

      <div class="ease-toast">
        <div class="ease-ripple-container">
          <span class="ease-ripple-wave"></span>
          <span class="ease-ripple-wave"></span>
          <div class="ease-toast-icon">⚡</div>
        </div>
        <div class="ease-toast-content">
          <p class="ease-toast-title">API Key Generated</p>
          <p class="ease-toast-message">Production environment ready for deployment</p>
        </div>
        <label for="ease-saas-toast-toggle" class="ease-toast-close" title="Close">✕</label>
      </div>
    </div>
  </main>
</body>
</html>
