<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Segmented Control | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="seg-root">
    <div>
      <h3 style="color:#94a3b8; text-align:center; margin:0 0 1rem; font-weight:500;">Views</h3>
      <div class="seg-group" role="group" aria-label="View options">
        <button class="seg-btn active" type="button">Day</button>
        <button class="seg-btn" type="button">Week</button>
        <button class="seg-btn" type="button">Month</button>
      </div>
    </div>
    <div>
      <h3 style="color:#94a3b8; text-align:center; margin:0 0 1rem; font-weight:500;">Status</h3>
      <div class="seg-group" role="group" aria-label="Status filter">
        <button class="seg-btn active" type="button">All</button>
        <button class="seg-btn" type="button">Active</button>
        <button class="seg-btn" type="button">Done</button>
      </div>
    </div>
    <p style="color:#64748b; text-align:center; max-width:400px; line-height:1.6;">
      Pure CSS segmented control with active state styling. Wire up via JS class toggling.
    </p>
  </div>
  <script>
    document.querySelectorAll('.seg-group').forEach(g => {
      g.querySelectorAll('.seg-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          g.querySelectorAll('.seg-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
        });
      });
    });
  </script>
</body>
</html>
