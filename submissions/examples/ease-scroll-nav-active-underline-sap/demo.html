<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ease-scroll-nav-active-underline-sap demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #f4f4f5; }
    section { height: 60vh; padding: 20px; box-sizing: border-box; }
    h2 { color: #111; }
  </style>
</head>
<body>
  <nav class="active-underline-nav-sap" id="nav">
    <a href="#p1" data-target="p1" class="active">Product</a>
    <a href="#p2" data-target="p2">Features</a>
    <a href="#p3" data-target="p3">FAQ</a>
  </nav>
  <section id="p1"><h2>Product</h2></section>
  <section id="p2"><h2>Features</h2></section>
  <section id="p3"><h2>FAQ</h2></section>
  <script>
    const links = [...document.querySelectorAll('.active-underline-nav-sap a')];
    const sections = [...document.querySelectorAll('section')];
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          links.forEach(l => l.classList.toggle('active', l.dataset.target === entry.target.id));
        }
      });
    }, { threshold: 0.5 });
    sections.forEach(s => observer.observe(s));
  </script>
</body>
</html>
