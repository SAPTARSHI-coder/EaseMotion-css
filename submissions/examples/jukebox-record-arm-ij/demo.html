<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-jukebox-record-arm demo</title>
</head>
<body>
<div class="jk-app">
  <span class="jk-title">JUKEBOX</span>
  <div class="jk-cabinet">
    <span class="jk-window"></span>
    <div class="jk-record">
      <span class="jk-groove jk-groove-1"></span>
      <span class="jk-groove jk-groove-2"></span>
      <span class="jk-groove jk-groove-3"></span>
      <span class="jk-center"></span>
    </div>
    <span class="jk-arm"></span>
    <div class="jk-rack">
      <span class="jk-disc jk-disc-1"></span>
      <span class="jk-disc jk-disc-2"></span>
      <span class="jk-disc jk-disc-3"></span>
    </div>
  </div>
</div>
</body>
</html>
