<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Blur-Entrance Carousel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="checkout-layout">
        <h2 class="section-title">Select Gift Wrap</h2>
        
        <div class="carousel-container">
            <input type="radio" name="gift" id="wrap1" class="carousel-input" checked>
            <input type="radio" name="gift" id="wrap2" class="carousel-input">
            <input type="radio" name="gift" id="wrap3" class="carousel-input">
            
            <div class="carousel-cards">
                <label for="wrap1" class="carousel-card card-item-1">
                    <div class="card-image bg-blue"></div>
                    <div class="card-info">
                        <div class="card-title">Classic Blue</div>
                        <div class="card-price">+$2.00</div>
                    </div>
                </label>
                
                <label for="wrap2" class="carousel-card card-item-2">
                    <div class="card-image bg-gold"></div>
                    <div class="card-info">
                        <div class="card-title">Premium Gold</div>
                        <div class="card-price">+$5.00</div>
                    </div>
                </label>
                
                <label for="wrap3" class="carousel-card card-item-3">
                    <div class="card-image bg-eco"></div>
                    <div class="card-info">
                        <div class="card-title">Eco-Friendly</div>
                        <div class="card-price">Free</div>
                    </div>
                </label>
            </div>
            
            <div class="carousel-indicators">
                <label for="wrap1" class="indicator"></label>
                <label for="wrap2" class="indicator"></label>
                <label for="wrap3" class="indicator"></label>
            </div>
        </div>
        
        <button class="checkout-btn">Save Options</button>
    </div>
</body>
</html>
