<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zero Noise Extrapolation ZNE - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css"></head><body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030712; color: #ffffff;">

    <div class="ease-card ease-card-glass zne-container">
        <div class="zne-header">
            <h2>Zero Noise Extrapolation</h2>
            <span class="ease-badge ease-badge-primary">Quantum Error Mitigation</span>
        </div>
        
        <div class="zne-screen ease-center">
            <div class="zne-flux flux-zne-a"></div>
            <div class="zne-flux flux-zne-b"></div>
            <div class="zne-boundary-ring"></div>
            <div class="zne-core ease-center"></div>
        </div>

        <div class="zne-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Noise Scaling &amp; Richardson Extrapolation</span>
            <button class="ease-btn ease-btn-primary ease-btn-sm ease-hover-grow">Run ZNE Mitigation</button>
        </div>
    </div></body></html>
