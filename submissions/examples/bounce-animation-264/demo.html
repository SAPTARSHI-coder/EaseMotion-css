<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Rating Star System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="rating-card">

    <div class="icon">★</div>

    <h1>Rate Your Experience</h1>
    <p class="subtitle">How would you rate your experience with us?</p>

    <div class="stars" role="radiogroup" aria-label="Rating">
      <button class="star" data-rating="1" aria-label="1 star">★</button>
      <button class="star" data-rating="2" aria-label="2 stars">★</button>
      <button class="star" data-rating="3" aria-label="3 stars">★</button>
      <button class="star" data-rating="4" aria-label="4 stars">★</button>
      <button class="star" data-rating="5" aria-label="5 stars">★</button>
    </div>

    <p class="rating-text">Select a rating</p>

    <button class="submit-btn">Submit Rating</button>

  </main>

  <script>
    const stars = document.querySelectorAll(".star");
    const ratingText = document.querySelector(".rating-text");
    const submitButton = document.querySelector(".submit-btn");

    let selectedRating = 0;

    const messages = {
      1: "Very Poor",
      2: "Poor",
      3: "Average",
      4: "Good",
      5: "Excellent"
    };

    function updateStars(rating) {
      stars.forEach(star => {
        const value = Number(star.dataset.rating);
        star.classList.toggle("active", value <= rating);
      });
    }

    stars.forEach(star => {

      star.addEventListener("mouseenter", () => {
        const rating = Number(star.dataset.rating);
        updateStars(rating);
        ratingText.textContent = messages[rating];
      });

      star.addEventListener("click", () => {
        selectedRating = Number(star.dataset.rating);
        updateStars(selectedRating);
        ratingText.textContent = messages[selectedRating];

        star.classList.remove("bounce");
        void star.offsetWidth;
        star.classList.add("bounce");
      });

    });

    document.querySelector(".stars").addEventListener("mouseleave", () => {
      updateStars(selectedRating);

      ratingText.textContent =
        selectedRating ? messages[selectedRating] : "Select a rating";
    });

    submitButton.addEventListener("click", () => {
      if (!selectedRating) {
        ratingText.textContent = "Please select a rating first.";
        return;
      }

      ratingText.textContent =
        `Thanks! You rated us ${selectedRating}/5.`;
    });
  </script>

</body>
</html>
