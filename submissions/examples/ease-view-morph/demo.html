<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ease View Morph Demo</title>
  <link rel="stylesheet" href="style.css">
  <script>
    function toggleMorph(el) {
      if (!document.startViewTransition) {
        el.classList.toggle('is-expanded');
        return;
      }
      document.startViewTransition(() => el.classList.toggle('is-expanded'));
    }
  </script>
</head>
<body>
  <div class="ease-morph-card" onclick="toggleMorph(this)">
    <h3>Click to Morph</h3>
    <p>Watch the browser interpolate the bounding boxes natively.</p>
  </div>
  <div style="width: 300px; height: 200px; background: #1e293b; border-radius: 12px; opacity: 0.5;"></div>
  <div style="width: 300px; height: 200px; background: #1e293b; border-radius: 12px; opacity: 0.5;"></div>
  <div style="width: 300px; height: 200px; background: #1e293b; border-radius: 12px; opacity: 0.5;"></div>
</body>
</html>
