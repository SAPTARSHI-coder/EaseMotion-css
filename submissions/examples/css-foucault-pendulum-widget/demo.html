<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Foucault Pendulum Widget</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <h1>Observatory Dashboard</h1>
      <p class="subtitle">Foucault Pendulum Swing Variation</p>
    </header>

    <main class="dashboard-grid">
      <!-- Widget 1: Foucault Precession -->
      <a href="#" class="pendulum-widget" aria-labelledby="widget1-title">
        <!-- Visual Layer (Decorative) -->
        <div class="pendulum-visual" aria-hidden="true">
          <!-- Floor reference to visualize precession -->
          <div class="reference-plane">
            <div class="compass-ring"></div>
            <div class="compass-ring inner"></div>
          </div>
          
          <!-- Suspension Anchor -->
          <div class="suspension-frame"></div>
          
          <!-- The Precession Rotator -->
          <div class="pendulum-assembly">
            <!-- The Swing Arm -->
            <div class="pendulum-arm">
              <div class="pendulum-cable"></div>
              <div class="pendulum-bob">
                <div class="bob-highlight"></div>
              </div>
            </div>
          </div>
        </div>

        <!-- Semantic Content Layer -->
        <article class="widget-content">
          <header class="widget-header">
            <h2 id="widget1-title" class="widget-title">Foucault Pendulum</h2>
            <div class="status-indicator active" aria-label="Status: Tracking"></div>
          </header>
          
          <div class="widget-body">
            <div class="primary-metric">11.3<span class="metric-unit">°</span></div>
            <div class="secondary-metric">
              <span class="trend-icon">↻</span>
              <span class="trend-value">Precession Drift</span>
            </div>
          </div>
          
          <footer class="widget-footer">
            <p>Rotation aligned to 48° 52′ N</p>
          </footer>
        </article>
      </a>

      <!-- Widget 2: Harmonic Oscillator -->
      <a href="#" class="pendulum-widget" aria-labelledby="widget2-title">
        <!-- Visual Layer (Decorative) -->
        <div class="pendulum-visual" aria-hidden="true">
          <!-- Floor reference to visualize precession -->
          <div class="reference-plane">
            <div class="compass-ring"></div>
            <div class="compass-ring inner"></div>
          </div>
          
          <!-- Suspension Anchor -->
          <div class="suspension-frame"></div>
          
          <!-- The Precession Rotator (Secondary Variation - faster swing, no precession) -->
          <div class="pendulum-assembly static-precession">
            <!-- The Swing Arm -->
            <div class="pendulum-arm harmonic-swing">
              <div class="pendulum-cable"></div>
              <div class="pendulum-bob">
                <div class="bob-highlight"></div>
              </div>
            </div>
          </div>
        </div>

        <!-- Semantic Content Layer -->
        <article class="widget-content">
          <header class="widget-header">
            <h2 id="widget2-title" class="widget-title">Harmonic Oscillator</h2>
            <div class="status-indicator stable" aria-label="Status: Stable"></div>
          </header>
          
          <div class="widget-body">
            <div class="primary-metric">4.2<span class="metric-unit">Hz</span></div>
            <div class="secondary-metric">
              <span class="trend-icon">↔</span>
              <span class="trend-value">Steady state</span>
            </div>
          </div>
          
          <footer class="widget-footer">
            <p>Amplitude locked at nominal</p>
          </footer>
        </article>
      </a>
    </main>
  </div>
</body>
</html>
