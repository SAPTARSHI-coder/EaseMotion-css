<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deadlock Wait-For Graph</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="deadlock-shell" aria-labelledby="deadlock-title">
    <section class="deadlock-card">
      <p class="eyebrow">Serializable lock monitor</p>
      <h1 id="deadlock-title">Deadlock Wait-For Graph</h1>
      <p class="summary">
        Watch transactions request row locks, form a circular wait, and trigger a detector sweep that breaks the cycle.
      </p>

      <div class="graph-stage" role="img" aria-label="Animated database deadlock wait-for graph">
        <div class="detector-ring"></div>

        <article class="txn txn-a">
          <span>T1</span>
          <small>holds A</small>
        </article>

        <article class="txn txn-b">
          <span>T2</span>
          <small>holds B</small>
        </article>

        <article class="txn txn-c">
          <span>T3</span>
          <small>holds C</small>
        </article>

        <div class="edge edge-ab"><i></i><b></b></div>
        <div class="edge edge-bc"><i></i><b></b></div>
        <div class="edge edge-ca"><i></i><b></b></div>

        <div class="victim-badge">rollback T3</div>
      </div>

      <div class="status-grid" aria-label="Deadlock detector status">
        <span>locks tracked</span>
        <span>cycle detected</span>
        <span>victim selected</span>
      </div>
    </section>
  </main>
</body>
</html>
