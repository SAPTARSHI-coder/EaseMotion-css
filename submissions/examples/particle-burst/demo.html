<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <meta
    name="description"
    content="EaseMotion CSS Particle Burst sci-fi HUD demonstration."
  >
  <title>Particle Burst — EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="hud-page">
    <section class="hud-panel" aria-labelledby="hud-title">
      <div class="hud-corner hud-corner--top-left" aria-hidden="true"></div>
      <div class="hud-corner hud-corner--top-right" aria-hidden="true"></div>
      <div class="hud-corner hud-corner--bottom-left" aria-hidden="true"></div>
      <div class="hud-corner hud-corner--bottom-right" aria-hidden="true"></div>

      <div class="hud-status">
        <span class="status-dot" aria-hidden="true"></span>
        SYSTEM ONLINE
      </div>

      <div class="hud-content">
        <p class="hud-kicker">SCI-FI HUD / 713</p>

        <h1 id="hud-title">Particle Burst</h1>

        <p class="hud-description">
          A lightweight CSS-only interaction with a radial particle burst
          and futuristic HUD feedback.
        </p>

        <button class="particle-trigger" type="button">
          <span class="particle-field" aria-hidden="true">
            <span class="particle particle--1"></span>
            <span class="particle particle--2"></span>
            <span class="particle particle--3"></span>
            <span class="particle particle--4"></span>
            <span class="particle particle--5"></span>
            <span class="particle particle--6"></span>
            <span class="particle particle--7"></span>
            <span class="particle particle--8"></span>
          </span>

          <span class="trigger-ring" aria-hidden="true"></span>
          <span class="trigger-label">ACTIVATE</span>
        </button>

        <div class="hud-readout" aria-label="System status">
          <span>CORE</span>
          <strong>READY</strong>
          <span>BURST</span>
          <strong>CSS</strong>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
