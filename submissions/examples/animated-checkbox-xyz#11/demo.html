<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animated Checkbox - EaseMotion CSS Submission</title>
  
  <!-- EaseMotion CSS (Official CDN) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css">
  
  <!-- Local Checkbox Component Styles -->
  <link rel="stylesheet" href="style.css">
  
  <style>
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: var(--ease-color-bg, #f8fafc);
      color: var(--ease-color-text, #0f172a);
      margin: 0;
      padding: 2rem;
      gap: 3rem;
    }
    .demo-container {
      width: 100%;
      max-width: 700px;
    }
    .demo-section {
      margin-bottom: 3rem;
    }
    .demo-title {
      font-size: 1.125rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
      color: var(--ease-color-text, #0f172a);
    }
    .demo-card {
      background-color: var(--ease-color-surface, #ffffff);
      border-radius: var(--ease-radius-lg, 12px);
      padding: 2rem;
      box-shadow: var(--ease-shadow-md, 0 4px 6px -1px rgba(0, 0, 0, 0.1));
      border: 1px solid var(--ease-color-border, #e2e8f0);
    }
    .checkbox-group {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .checkbox-row {
      display: flex;
      flex-wrap: wrap;
      gap: 1.5rem;
    }
  </style>
</head>
<body>

  <div class="ease-center ease-fade-in" style="text-align: center;">
    <h1 class="ease-slide-up">Animated Checkbox Component</h1>
    <p class="ease-slide-up ease-delay-100" style="color: var(--ease-color-text-muted, #64748b); max-width: 500px;">
      Zero JavaScript. Pure CSS checkboxes with smooth state transitions and custom animations.
    </p>
  </div>

  <!-- Default Checkboxes -->
  <div class="demo-container demo-section ease-fade-in ease-delay-200">
    <h2 class="demo-title">Default Checkboxes</h2>
    <div class="demo-card">
      <div class="checkbox-group">
        <label class="ease-checkbox-xyz">
          <input type="checkbox">
          <span class="ease-checkbox-xyz-custom"></span>
          <span class="ease-checkbox-xyz-label">Accept terms and conditions</span>
        </label>

        <label class="ease-checkbox-xyz">
          <input type="checkbox" checked>
          <span class="ease-checkbox-xyz-custom"></span>
          <span class="ease-checkbox-xyz-label">Subscribe to newsletter</span>
        </label>

        <label class="ease-checkbox-xyz">
          <input type="checkbox">
          <span class="ease-checkbox-xyz-custom"></span>
          <span class="ease-checkbox-xyz-label">Remember me on this device</span>
        </label>

        <label class="ease-checkbox-xyz">
          <input type="checkbox" disabled>
          <span class="ease-checkbox-xyz-custom"></span>
          <span class="ease-checkbox-xyz-label">Disabled option</span>
        </label>
      </div>
    </div>
  </div>

  <!-- Color Variants -->
  <div class="demo-container demo-section ease-fade-in ease-delay-300">
    <h2 class="demo-title">Color Variants</h2>
    <div class="demo-card">
      <div class="checkbox-row">
        <label class="ease-checkbox-xyz ease-checkbox-xyz-primary">
          <input type="checkbox" checked>
          <span class="ease-checkbox-xyz-custom"></span>
          <span class="ease-checkbox-xyz-label">Primary</span>
        </label>

        <label class="ease-checkbox-xyz ease-checkbox-xyz-success">
          <input type="checkbox" checked>
          <span class="ease-checkbox-xyz-custom"></span>
          <span class="ease-checkbox-xyz-label">Success</span>
        </label>

        <label class="ease-checkbox-xyz ease-checkbox-xyz-error">
          <input type="checkbox" checked>
          <span class="ease-checkbox-xyz-custom"></span>
          <span class="ease-checkbox-xyz-label">Error</span>
        </label>

        <label class="ease-checkbox-xyz ease-checkbox-xyz-warning">
          <input type="checkbox" checked>
          <span class="ease-checkbox-xyz-custom"></span>
          <span class="ease-checkbox-xyz-label">Warning</span>
        </label>
      </div>
    </div>
  </div>

  <!-- Size Variants -->
  <div class="demo-container demo-section ease-fade-in ease-delay-400">
    <h2 class="demo-title">Size Variants</h2>
    <div class="demo-card">
      <div class="checkbox-group">
        <label class="ease-checkbox-xyz ease-checkbox-xyz-sm">
          <input type="checkbox" checked>
          <span class="ease-checkbox-xyz-custom"></span>
          <span class="ease-checkbox-xyz-label">Small checkbox</span>
        </label>

        <label class="ease-checkbox-xyz">
          <input type="checkbox" checked>
          <span class="ease-checkbox-xyz-custom"></span>
          <span class="ease-checkbox-xyz-label">Default checkbox</span>
        </label>

        <label class="ease-checkbox-xyz ease-checkbox-xyz-lg">
          <input type="checkbox" checked>
          <span class="ease-checkbox-xyz-custom"></span>
          <span class="ease-checkbox-xyz-label">Large checkbox</span>
        </label>
      </div>
    </div>
  </div>

  <!-- Rounded Variant -->
  <div class="demo-container demo-section ease-fade-in ease-delay-500">
    <h2 class="demo-title">Rounded Variant</h2>
    <div class="demo-card">
      <div class="checkbox-group">
        <label class="ease-checkbox-xyz ease-checkbox-xyz-rounded">
          <input type="checkbox">
          <span class="ease-checkbox-xyz-custom"></span>
          <span class="ease-checkbox-xyz-label">Rounded checkbox</span>
        </label>

        <label class="ease-checkbox-xyz ease-checkbox-xyz-rounded">
          <input type="checkbox" checked>
          <span class="ease-checkbox-xyz-custom"></span>
          <span class="ease-checkbox-xyz-label">Checked rounded</span>
        </label>
      </div>
    </div>
  </div>

  <!-- Card Style -->
  <div class="demo-container demo-section ease-fade-in ease-delay-600">
    <h2 class="demo-title">Card Style (Selectable Cards)</h2>
    <div class="demo-card">
      <div class="checkbox-row">
        <label class="ease-checkbox-xyz ease-checkbox-xyz-card">
          <input type="checkbox">
          <div class="ease-checkbox-xyz-card-content">
            <span class="ease-checkbox-xyz-custom"></span>
            <div>
              <div class="ease-checkbox-xyz-card-title">Basic Plan</div>
              <div class="ease-checkbox-xyz-card-desc">$9/month</div>
            </div>
          </div>
        </label>

        <label class="ease-checkbox-xyz ease-checkbox-xyz-card">
          <input type="checkbox" checked>
          <div class="ease-checkbox-xyz-card-content">
            <span class="ease-checkbox-xyz-custom"></span>
            <div>
              <div class="ease-checkbox-xyz-card-title">Pro Plan</div>
              <div class="ease-checkbox-xyz-card-desc">$29/month</div>
            </div>
          </div>
        </label>

        <label class="ease-checkbox-xyz ease-checkbox-xyz-card">
          <input type="checkbox">
          <div class="ease-checkbox-xyz-card-content">
            <span class="ease-checkbox-xyz-custom"></span>
            <div>
              <div class="ease-checkbox-xyz-card-title">Enterprise</div>
              <div class="ease-checkbox-xyz-card-desc">$99/month</div>
            </div>
          </div>
        </label>
      </div>
    </div>
  </div>

</body>
</html>
