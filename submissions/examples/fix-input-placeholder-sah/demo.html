<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Input Placeholder Overflow Fix - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="form-container">
    <div class="form-header">
      <h1>Input Placeholder Fix (<code>#56082</code>)</h1>
      <p>Ellipsis clipping and responsive max-widths prevent mobile input layout bursting.</p>
    </div>
    <form class="demo-form" onsubmit="return false;">
      <div class="field-group">
        <label for="url">Project Portfolio Repository URL</label>
        <input type="text" id="url" class="ease-input-responsive" placeholder="https://github.com/SAPTARSHI-coder/EaseMotion-css-long-repository-path-example" />
      </div>
      <div class="field-group">
        <label for="token">Personal Authentication Token</label>
        <input type="password" id="token" class="ease-input-responsive" placeholder="enter_your_secret_alphanumeric_gssoc_authentication_token_here_with_no_spaces" />
      </div>
      <button class="submit-btn">Verify Input Alignment</button>
    </form>
  </main>
</body>
</html>
