<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Circuit Teleportation Node - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css"></head><body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030712; color: #ffffff;">

    <div class="ease-card ease-card-glass circuit-container">
        <div class="circuit-header">
            <h2>Circuit Teleportation Node</h2>
            <span class="ease-badge ease-badge-success">Operational</span>
        </div>
        
        <div class="circuit-screen ease-center">
            <div class="circuit-flux flux-one"></div>
            <div class="circuit-flux flux-two"></div>
            <div class="circuit-boundary-ring"></div>
            <div class="circuit-core ease-center"></div>
        </div>

        <div class="circuit-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Gate: CNOT &bull; H &bull; M</span>
            <button class="ease-btn ease-btn-success ease-btn-sm ease-hover-grow">Execute Circuit</button>
        </div>
    </div></body></html>
