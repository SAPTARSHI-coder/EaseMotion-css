<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Modal Component</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Demo Trigger CSS Checkbox (Zero JS) -->
    <input type="checkbox" id="modal-toggle" class="ease-modal-toggle">
    <label for="modal-toggle" class="demo-btn">Open Modal</label>

    <!-- Modal Backdrop Overlay -->
    <div class="ease-modal-overlay">
        <div class="ease-modal-content">
            <div class="ease-modal-header">
                <h3>Modal Title</h3>
                <label for="modal-toggle" class="ease-modal-close">&times;</label>
            </div>
            <div class="ease-modal-body">
                <p>This is a pure CSS modal dialog with a frosted glass backdrop blur and smooth scale entrance keyframes.</p>
            </div>
            <div class="ease-modal-footer">
                <label for="modal-toggle" class="demo-btn secondary">Close</label>
                <label for="modal-toggle" class="demo-btn">Confirm</label>
            </div>
        </div>
    </div>

</body>
</html>
