<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claymorphic Profile Card Canvas #87640 Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <canvas id="bgCanvas"></canvas>

  <div class="card-container">
    <div class="clay-card">
      <div class="avatar-wrapper">
        <img 
          src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=300&q=80" 
          alt="Profile Avatar" 
          class="avatar-img"
        >
        <span class="status-indicator"></span>
      </div>

      <h2 class="profile-name">Sophia Sterling</h2>
      <p class="profile-role">Design Technologist</p>
      <p class="profile-bio">Exploring claymorphic UI spatial physics, tactile systems, and creative algorithms.</p>

      <div class="stats-grid">
        <div class="stat-box">
          <span class="stat-value">148</span>
          <span class="stat-label">Projects</span>
        </div>
        <div class="stat-box">
          <span class="stat-value">32.4k</span>
          <span class="stat-label">Followers</span>
        </div>
        <div class="stat-box">
          <span class="stat-value">8.9k</span>
          <span class="stat-label">Appreciations</span>
        </div>
      </div>

      <div class="action-row">
        <button class="clay-btn primary" id="followBtn">Follow</button>
        <button class="clay-btn" id="messageBtn">Message</button>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('bgCanvas');
    const ctx = canvas.getContext('2d');

    let width, height;
    let particles = [];

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }

    class Particle {
      constructor() {
        this.x = Math.random() * width;
        this.y = Math.random() * height;
        this.vx = (Math.random() - 0.5) * 0.8;
        this.vy = (Math.random() - 0.5) * 0.8;
        this.radius = Math.random() * 3 + 2;
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;

        if (this.x < 0 || this.x > width) this.vx *= -1;
        if (this.y < 0 || this.y > height) this.vy *= -1;
      }

      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(165, 180, 252, 0.45)';
        ctx.fill();
      }
    }

    function init() {
      resize();
      particles = [];
      const count = Math.floor((width * height) / 18000);
      for (let i = 0; i < count; i++) {
        particles.push(new Particle());
      }
    }

    function animate() {
      ctx.clearRect(0, 0, width, height);

      for (let i = 0; i < particles.length; i++) {
        particles[i].update();
        particles[i].draw();

        for (let j = i + 1; j < particles.length; j++) {
          const dx = particles[i].x - particles[j].x;
          const dy = particles[i].y - particles[j].y;
          const dist = Math.hypot(dx, dy);

          if (dist < 120) {
            ctx.beginPath();
            ctx.strokeStyle = `rgba(165, 180, 252, ${0.35 * (1 - dist / 120)})`;
            ctx.lineWidth = 1;
            ctx.moveTo(particles[i].x, particles[i].y);
            ctx.lineTo(particles[j].x, particles[j].y);
            ctx.stroke();
          }
        }
      }

      requestAnimationFrame(animate);
    }

    window.addEventListener('resize', resize);
    window.addEventListener('DOMContentLoaded', () => {
      init();
      animate();
    });

    const followBtn = document.getElementById('followBtn');
    followBtn.addEventListener('click', () => {
      followBtn.textContent = followBtn.textContent === 'Follow' ? 'Following' : 'Follow';
    });
  </script>
</body>
</html>
