<!DOCTYPE html>
<html lang="en">
<head>

  <title>[FEATURE] CSS Wave SVG Divider</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<main>
  <div class="section-a"><h2>Top Section</h2><p>CSS Wave SVG Divider separates two sections with an animated wave.</p></div>
  <svg class="em-css-wave-svg-divider" viewBox="0 0 1440 60" preserveAspectRatio="none" aria-hidden="true">
    <path class="em-css-wave-svg-divider-top" d="M0,30 C240,60 480,0 720,30 C960,60 1200,0 1440,30 L1440,60 L0,60 Z"><animate attributeName="d" dur="6s" repeatCount="indefinite" values="M0,30 C240,60 480,0 720,30 C960,60 1200,0 1440,30 L1440,60 L0,60 Z;M0,30 C240,0 480,60 720,30 C960,0 1200,60 1440,30 L1440,60 L0,60 Z;M0,30 C240,60 480,0 720,30 C960,60 1200,0 1440,30 L1440,60 L0,60 Z"/></path>
  </svg>
  <div class="section-b"><h2>Bottom Section</h2></div>
</main>
</body>
</html>
