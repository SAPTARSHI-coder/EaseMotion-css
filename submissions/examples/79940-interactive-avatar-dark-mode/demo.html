<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Interactive avatar component with dark mode styling."
  >

  <title>Interactive Avatar - Dark Mode</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="page">
    <section class="avatar-section">
      <span class="eyebrow">UI COMPONENT / 79940</span>

      <h1>
        Interactive
        <span>Avatar</span>
      </h1>

      <p class="intro">
        A responsive profile avatar with dark mode styling,
        interactive states, status indicators and profile details.
      </p>

      <div class="avatar-card">
        <div class="avatar-wrapper">
          <div class="avatar">
            <span class="avatar-letter">A</span>
          </div>

          <span class="status-dot" aria-label="Online"></span>
        </div>

        <div class="profile-info">
          <h2>Alex Morgan</h2>
          <p>@alexmorgan</p>
          <span class="status-text">Online now</span>
        </div>

        <button
          class="profile-action"
          type="button"
          aria-label="Open Alex Morgan profile"
        >
          →
        </button>
      </div>

      <div class="avatar-options">
        <button class="mini-avatar active" type="button">
          <span>A</span>
        </button>

        <button class="mini-avatar" type="button">
          <span>J</span>
        </button>

        <button class="mini-avatar" type="button">
          <span>M</span>
        </button>

        <button class="mini-avatar" type="button">
          <span>S</span>
        </button>
      </div>

      <p class="hint">
        Hover over the avatar or profile card to explore the interaction.
      </p>
    </section>
  </main>
</body>
</html>
