<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-microwave-oven-panel</title>
</head>
<body>
<main class="mop-card">
  <header class="mop-head">
    <h1 class="mop-title">Microwave</h1>
    <span class="mop-model">MW-900</span>
  </header>
  <section class="mop-screen" aria-label="timer display">
    <span class="mop-time">1:45</span>
    <span class="mop-power">Hi</span>
  </section>
  <section class="mop-keys">
    <button class="mop-key mop-key-num">1</button>
    <button class="mop-key mop-key-num">2</button>
    <button class="mop-key mop-key-num">3</button>
    <button class="mop-key mop-key-num">4</button>
    <button class="mop-key mop-key-num">5</button>
    <button class="mop-key mop-key-num">6</button>
    <button class="mop-key mop-key-num">7</button>
    <button class="mop-key mop-key-num">8</button>
    <button class="mop-key mop-key-num">9</button>
    <button class="mop-key mop-key-defrost">DEF</button>
    <button class="mop-key mop-key-num">0</button>
    <button class="mop-key mop-key-cook">COOK</button>
  </section>
  <section class="mop-inner" aria-label="oven cavity">
    <span class="mop-light"></span>
    <span class="mop-plate"></span>
  </section>
  <footer class="mop-foot">
    <span class="mop-start">START</span>
    <span class="mop-cancel">CANCEL</span>
  </footer>
</main>
</body>
</html>
