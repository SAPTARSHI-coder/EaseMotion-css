<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ease-project-card-hover</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">
    <h1>project card hover</h1>
    <p class="sub">Press to activate</p>
    <div class="stage">
      <div class="elem" id="e"></div>
    </div>
    <button class="btn" id="b">Toggle</button>
    <p class="status" id="s">Idle</p>
  </div>
  <script>
    var e=document.getElementById('e');var b=document.getElementById('b');var s=document.getElementById('s');var a=false;
    b.addEventListener('click',function(){a=!a;e.classList.toggle('on',a);e.style.setProperty('--s',a?'1':'0');s.textContent=a?'Active':'Idle';});
  </script>
</body>
</html>
