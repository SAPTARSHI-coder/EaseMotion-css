<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Morphing Tooltip with SaaS Modern Styling | EaseMotion CSS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="tooltip-card">
        <div class="tooltip-container">
            <button class="tooltip-trigger" aria-describedby="tooltipId">Hover Workspace</button>
            <div id="tooltipId" role="tooltip" class="morphing-tooltip">Active sync enabled with cloud cluster</div>
        </div>
    </div>
</body>
</html>
