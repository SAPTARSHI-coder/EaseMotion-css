<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smoke Trail Cursor · Wispy Smoke</title>

    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <!-- === SMOKE TRAIL CURSOR === -->
    <div class="smoke-container" id="smokeContainer"></div>

    <!-- === CONTENT === -->
    <div class="card">
        <h2>💨 Smoke Trail Cursor</h2>
        <p class="sub">leaves a wispy smoke trail</p>

        <div class="cursor-demo-area">
            <p>Move your mouse around</p>
            <div class="interactive-hint">
                <i class="fas fa-mouse-pointer"></i>
                <span>Watch the smoke swirl</span>
            </div>
            <div class="demo-buttons">
                <button class="demo-btn">Hover me</button>
                <button class="demo-btn">Click me</button>
                <button class="demo-btn">Smoke!</button>
            </div>
        </div>

        <p style="margin-top: 1.5rem; font-size: 0.85rem; color: #64748b;">
            Move your mouse · watch the wispy smoke trail
        </p>
    </div>

    <!-- Embedded JavaScript -->
    <script>
        (function() {
            'use strict';

            const container = document.getElementById('smokeContainer');
            let mouseX = 0;
            let mouseY = 0;
            let isVisible = false;

            // --- Create smoke particle ---
            function createSmokeParticle(x, y) {
                const particle = document.createElement('div');
                particle.className = 'smoke-particle';

                // Random size
                const size = 10 + Math.random() * 30;
                particle.style.width = size + 'px';
                particle.style.height = size + 'px';

                // Random opacity
                const opacity = 0.1 + Math.random() * 0.2;
                particle.style.opacity = opacity;

                // Random position offset
                const offsetX = (Math.random() - 0.5) * 15;
                const offsetY = (Math.random() - 0.5) * 15;
                particle.style.left = (x + offsetX) + 'px';
                particle.style.top = (y + offsetY) + 'px';

                // Random trajectory (upward drift)
                const tx = (Math.random() - 0.5) * 60;
                const ty = -40 - Math.random() * 60;
                particle.style.setProperty('--tx', tx + 'px');
                particle.style.setProperty('--ty', ty + 'px');

                // Random rotation
                const rotation = (Math.random() - 0.5) * 360;
                particle.style.setProperty('--rotation', rotation + 'deg');

                // Random animation duration
                const duration = 1.5 + Math.random() * 2;
                particle.style.setProperty('--duration', duration + 's');

                // Random blur
                const blur = 2 + Math.random() * 6;
                particle.style.setProperty('--blur', blur + 'px');

                // Random delay for varied timing
                const delay = Math.random() * 0.3;
                particle.style.animationDelay = delay + 's';

                container.appendChild(particle);

                // Remove particle after animation
                setTimeout(() => {
                    if (particle.parentNode) {
                        particle.remove();
                    }
                }, (duration + delay + 0.5) * 1000);
            }

            // --- Create smoke burst ---
            function createSmokeBurst(x, y, count = 30) {
                for (let i = 0; i < count; i++) {
                    setTimeout(() => {
                        const particle = document.createElement('div');
                        particle.className = 'smoke-particle';

                        const size = 15 + Math.random() * 40;
                        particle.style.width = size + 'px';
                        particle.style.height = size + 'px';

                        const opacity = 0.1 + Math.random() * 0.25;
                        particle.style.opacity = opacity;

                        const angle = Math.random() * 2 * Math.PI;
                        const dist = 30 + Math.random() * 80;
                        const tx = Math.cos(angle) * dist;
                        const ty = Math.sin(angle) * dist - 30;
                        particle.style.setProperty('--tx', tx + 'px');
                        particle.style.setProperty('--ty', ty + 'px');

                        const rotation = (Math.random() - 0.5) * 360;
                        particle.style.setProperty('--rotation', rotation + 'deg');

                        const duration = 1.5 + Math.random() * 2.5;
                        particle.style.setProperty('--duration', duration + 's');

                        const blur = 2 + Math.random() * 8;
                        particle.style.setProperty('--blur', blur + 'px');

                        const offsetX = (Math.random() - 0.5) * 20;
                        const offsetY = (Math.random() - 0.5) * 20;
                        particle.style.left = (x + offsetX) + 'px';
                        particle.style.top = (y + offsetY) + 'px';

                        const delay = Math.random() * 0.2;
                        particle.style.animationDelay = delay + 's';

                        container.appendChild(particle);

                        setTimeout(() => {
                            if (particle.parentNode) {
                                particle.remove();
                            }
                        }, (duration + delay + 0.5) * 1000);
                    }, i * 25);
                }
            }

            // --- Smoke trail loop ---
            let smokeInterval = null;

            function startSmoke() {
                if (smokeInterval) return;
                smokeInterval = setInterval(() => {
                    if (isVisible) {
                        for (let i = 0; i < 2; i++) {
                            const offsetX = (Math.random() - 0.5) * 10;
                            const offsetY = (Math.random() - 0.5) * 10;
                            createSmokeParticle(mouseX + offsetX, mouseY + offsetY);
                        }
                    }
                }, 50);
            }

            function stopSmoke() {
                if (smokeInterval) {
                    clearInterval(smokeInterval);
                    smokeInterval = null;
                }
            }

            // --- Mouse move ---
            document.addEventListener('mousemove', function(e) {
                mouseX = e.clientX;
                mouseY = e.clientY;
                isVisible = true;
                container.style.display = 'block';
            });

            // --- Touch support ---
            document.addEventListener('touchmove', function(e) {
                e.preventDefault();
                const touch = e.touches[0];
                mouseX = touch.clientX;
                mouseY = touch.clientY;
                isVisible = true;
                container.style.display = 'block';
            }, { passive: false });

            document.addEventListener('touchstart', function(e) {
                const touch = e.touches[0];
                mouseX = touch.clientX;
                mouseY = touch.clientY;
                isVisible = true;
                container.style.display = 'block';
            });

            // --- Mouse leave ---
            document.addEventListener('mouseleave', function() {
                isVisible = false;
                container.style.display = 'none';
            });

            // --- Mouse enter ---
            document.addEventListener('mouseenter', function() {
                isVisible = true;
                container.style.display = 'block';
            });

            // --- Click burst ---
            document.addEventListener('click', function(e) {
                createSmokeBurst(e.clientX, e.clientY, 35);
                console.log('💨 Smoke burst!');
            });

            // --- Hover effects ---
            const interactiveElements = document.querySelectorAll('a, button, .demo-btn, .interactive-hint');
            interactiveElements.forEach(el => {
                el.addEventListener('mouseenter', function() {
                    const rect = this.getBoundingClientRect();
                    const cx = rect.left + rect.width / 2;
                    const cy = rect.top + rect.height / 2;
                    createSmokeBurst(cx, cy, 20);
                });
            });

            // --- Start smoke ---
            startSmoke();

            console.log('💨 Smoke trail cursor initialized!');

        })();
    </script>

</body>
</html>
