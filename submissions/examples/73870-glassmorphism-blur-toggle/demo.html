<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glassmorphism Blur Toggle #73870 Demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #0f172a, #1e1b4b, #311042);
      margin: 0;
    }
  </style>
</head>
<body>

  <label class="glass-toggle-wrapper">
    <input type="checkbox" class="glass-toggle-input">
    <span class="glass-toggle-track">
      <span class="glass-toggle-thumb"></span>
    </span>
    <span class="glass-toggle-label">Glassmorphism</span>
  </label>

</body>
</html>
