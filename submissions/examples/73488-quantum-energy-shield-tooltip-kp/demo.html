<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quantum Energy Shield Tooltip</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="shield-demo" aria-labelledby="shield-title">
    <section class="shield-card">
      <p class="eyebrow">CSS Tooltip Variation #240</p>
      <h1 id="shield-title">Quantum Energy Shield</h1>
      <p class="summary">Focus the control to project a layered shield tooltip with orbiting energy particles.</p>
      <button class="shield-trigger" aria-describedby="shield-tip">
        <span class="shield-icon"><i></i><i></i><i></i></span>
        Stabilize core
      </button>
      <div class="quantum-tooltip" id="shield-tip" role="tooltip">
        <span class="orbit"><b></b><b></b><b></b></span>
        <strong>Shield active</strong>
        <small>Quantum field absorbing 96% edge turbulence</small>
      </div>
    </section>
  </main>
</body>
</html>
