<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vortex Loader – Particles Spiral into Vortex</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <h1>🌀 Vortex Loader</h1>
    <p class="subtitle">Particles spiral into a vortex</p>

    <div class="loader-container">
      <canvas id="canvas"></canvas>
      
      <!-- Info overlay -->
      <div class="info-overlay">
        <span class="vortex-status" id="vortexStatus">🌀 Spiraling</span>
        <span class="particle-count" id="particleCount">✦ 0 particles</span>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <button class="ctrl-btn play" id="playBtn">▶ Play</button>
      <button class="ctrl-btn pause" id="pauseBtn">⏸ Pause</button>
      <button class="ctrl-btn toggle" id="toggleBtn">🔄 Toggle</button>
      <button class="ctrl-btn reset" id="resetBtn">↺ Reset</button>
    </div>

    <!-- Sliders -->
    <div class="slider-container">
      <span class="slider-label">Speed</span>
      <input type="range" id="speedSlider" min="1" max="10" value="5" />
      <span class="slider-value" id="speedValue">5×</span>
    </div>

    <div class="slider-container">
      <span class="slider-label">Particles</span>
      <input type="range" id="countSlider" min="50" max="300" value="150" step="10" />
      <span class="slider-value" id="countValue">150</span>
    </div>

    <div class="slider-container">
      <span class="slider-label">Vortex Strength</span>
      <input type="range" id="strengthSlider" min="0" max="100" value="50" />
      <span class="slider-value" id="strengthValue">50%</span>
    </div>

    <div class="slider-container">
      <span class="slider-label">Particle Size</span>
      <input type="range" id="sizeSlider" min="1" max="8" value="4" step="0.5" />
      <span class="slider-value" id="sizeValue">4px</span>
    </div>

    <!-- Status -->
    <div class="status" id="status">🌀 Particles spiraling into the vortex</div>

    <!-- Keyboard shortcuts -->
    <div class="shortcuts">
      <kbd>Space</kbd> Toggle · <kbd>P</kbd> Play/Pause · <kbd>R</kbd> Reset
    </div>
  </div>

  <script>
    (function() {
      "use strict";

      // DOM elements
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      const vortexStatus = document.getElementById('vortexStatus');
      const particleCount = document.getElementById('particleCount');
      const playBtn = document.getElementById('playBtn');
      const pauseBtn = document.getElementById('pauseBtn');
      const toggleBtn = document.getElementById('toggleBtn');
      const resetBtn = document.getElementById('resetBtn');
      const status = document.getElementById('status');
      const speedSlider = document.getElementById('speedSlider');
      const speedValue = document.getElementById('speedValue');
      const countSlider = document.getElementById('countSlider');
      const countValue = document.getElementById('countValue');
      const strengthSlider = document.getElementById('strengthSlider');
      const strengthValue = document.getElementById('strengthValue');
      const sizeSlider = document.getElementById('sizeSlider');
      const sizeValue = document.getElementById('sizeValue');

      // State
      let particles = [];
      let isPlaying = true;
      let animationId = null;
      let time = 0;
      let particleCountTotal = 0;

      // Colors
      const COLORS = [
        '#ff6b6b', '#ff4757', '#ff6348', '#ff9f43', '#feca57',
        '#ffd93d', '#ff6b81', '#e056a0', '#a29bfe', '#6c5ce7',
        '#00cec9', '#00b894', '#55efc4', '#81ecec', '#74b9ff',
        '#0984e3', '#fd79a8', '#e17055', '#fdcb6e', '#d63031'
      ];

      // ----- Canvas setup -----
      function setupCanvas() {
        const rect = canvas.parentElement.getBoundingClientRect();
        const size = Math.min(rect.width - 40, 600);
        canvas.width = size;
        canvas.height = size;
        canvas.style.width = size + 'px';
        canvas.style.height = size + 'px';
      }

      // ----- Particle class -----
      class Particle {
        constructor() {
          const w = canvas.width;
          const h = canvas.height;
          const cx = w / 2;
          const cy = h / 2;
          const maxRadius = Math.min(w, h) * 0.45;
          
          this.angle = Math.random() * Math.PI * 2;
          this.radius = maxRadius * (0.1 + Math.random() * 0.9);
          this.startRadius = this.radius;
          this.speed = 0.3 + Math.random() * 0.7;
          this.size = 2 + Math.random() * 4;
          this.color = COLORS[Math.floor(Math.random() * COLORS.length)];
          this.opacity = 0.3 + Math.random() * 0.7;
          this.phase = Math.random() * Math.PI * 2;
          this.trail = [];
          this.trailLength = 10 + Math.floor(Math.random() * 20);
          this.pulseSpeed = 0.02 + Math.random() * 0.03;
          this.pulseOffset = Math.random() * Math.PI * 2;
          this.isAlive = true;
        }

        update(cx, cy, speed, strength, vortexStrength) {
          // Vortex pull
          const pullStrength = vortexStrength * 0.02;
          const targetRadius = this.startRadius * (1 - pullStrength);
          this.radius += (targetRadius - this.radius) * 0.01 * speed;
          
          // Spiral angle
          this.angle += (0.02 + (1 - this.radius / this.startRadius) * 0.03) * speed;
          
          // Vertical oscillation
          const wobble = Math.sin(this.phase + time * 0.5) * 10 * (1 - this.radius / this.startRadius);
          
          // Calculate position
          const r = this.radius * (0.3 + 0.7 * (1 - pullStrength));
          this.x = cx + Math.cos(this.angle) * r;
          this.y = cy + Math.sin(this.angle) * r * 0.6 + wobble;
          
          // Add some noise
          this.x += Math.sin(time * 0.5 + this.phase) * 0.5;
          this.y += Math.cos(time * 0.7 + this.phase) * 0.5;

          // Update trail
          this.trail.push({ x: this.x, y: this.y });
          if (this.trail.length > this.trailLength) {
            this.trail.shift();
          }

          // Pulse
          this.pulse = 0.5 + 0.5 * Math.sin(time * this.pulseSpeed + this.pulseOffset);
          this.size = (2 + Math.random() * 4) * (0.5 + 0.5 * this.pulse);

          // Check if particle has reached the center
          const distToCenter = Math.sqrt(
            Math.pow(this.x - cx, 2) + 
            Math.pow(this.y - cy, 2)
          );
          if (distToCenter < 5 && this.radius < 10) {
            this.isAlive = false;
          }
        }

        draw(ctx, sizeMult = 1) {
          // Draw trail
          if (this.trail.length > 1) {
            for (let i = 0; i < this.trail.length - 1; i++) {
              const t = i / this.trail.length;
              const alpha = this.opacity * t * 0.3;
              const trailSize = this.size * t * 0.3 * sizeMult;
              ctx.fillStyle = this.color + Math.round(alpha * 255).toString(16).padStart(2, '0');
              ctx.beginPath();
              ctx.arc(this.trail[i].x, this.trail[i].y, trailSize, 0, Math.PI * 2);
              ctx.fill();
            }
          }

          // Glow
          const glowSize = this.size * 4 * sizeMult;
          const gradient = ctx.createRadialGradient(
            this.x, this.y, 0,
            this.x, this.y, glowSize
          );
          const alpha = this.opacity * (0.2 + 0.3 * this.pulse);
          gradient.addColorStop(0, this.color + Math.round(alpha * 255).toString(16).padStart(2, '0'));
          gradient.addColorStop(1, this.color + '00');
          ctx.fillStyle = gradient;
          ctx.beginPath();
          ctx.arc(this.x, this.y, glowSize, 0, Math.PI * 2);
          ctx.fill();

          // Core
          const coreSize = this.size * 0.6 * sizeMult;
          ctx.shadowColor = this.color + '44';
          ctx.shadowBlur = 10;
          ctx.fillStyle = this.color;
          ctx.globalAlpha = this.opacity * (0.6 + 0.4 * this.pulse);
          ctx.beginPath();
          ctx.arc(this.x, this.y, coreSize, 0, Math.PI * 2);
          ctx.fill();
          ctx.globalAlpha = 1;
          ctx.shadowBlur = 0;

          // Highlight
          if (this.pulse > 0.6) {
            ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity * 0.1})`;
            ctx.beginPath();
            ctx.arc(this.x - coreSize * 0.2, this.y - coreSize * 0.3, coreSize * 0.2, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      }

      // ----- Generate particles -----
      function generateParticles(count) {
        particles = [];
        for (let i = 0; i < count; i++) {
          particles.push(new Particle());
        }
        particleCountTotal = particles.length;
        particleCount.textContent = `✦ ${particles.length} particles`;
        countValue.textContent = particles.length;
      }

      // ----- Draw vortex center -----
      function drawVortexCenter(cx, cy) {
        // Center glow
        const glowGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, 30);
        glowGrad.addColorStop(0, 'rgba(200, 200, 255, 0.15)');
        glowGrad.addColorStop(0.5, 'rgba(150, 150, 255, 0.05)');
        glowGrad.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = glowGrad;
        ctx.beginPath();
        ctx.arc(cx, cy, 30, 0, Math.PI * 2);
        ctx.fill();

        // Spiral ring
        const rings = 3;
        for (let i = 0; i < rings; i++) {
          const r = 10 + i * 12 + Math.sin(time * 0.5 + i) * 3;
          const alpha = 0.05 + i * 0.03;
          ctx.strokeStyle = `rgba(200, 200, 255, ${alpha})`;
          ctx.lineWidth = 1;
          ctx.setLineDash([3, 5 + i * 2]);
          ctx.lineDashOffset = -time * (20 + i * 10);
          ctx.beginPath();
          ctx.arc(cx, cy, r, 0, Math.PI * 2);
          ctx.stroke();
          ctx.setLineDash([]);
        }
      }

      // ----- Draw -----
      function draw() {
        const w = canvas.width;
        const h = canvas.height;
        const cx = w / 2;
        const cy = h / 2;
        const speed = parseInt(speedSlider.value) / 5;
        const vortexStrength = parseInt(strengthSlider.value) / 100;
        const sizeMult = parseInt(sizeSlider.value) / 4;

        // Clear
        ctx.clearRect(0, 0, w, h);

        // Background
        const bgGradient = ctx.createRadialGradient(cx, cy, 0, cx, cy, w * 0.8);
        bgGradient.addColorStop(0, '#0a0a1a');
        bgGradient.addColorStop(0.5, '#060612');
        bgGradient.addColorStop(1, '#020208');
        ctx.fillStyle = bgGradient;
        ctx.fillRect(0, 0, w, h);

        // Update particles
        if (isPlaying) {
          particles.forEach(p => {
            p.update(cx, cy, speed, vortexStrength, vortexStrength);
          });
          
          // Remove dead particles and respawn
          const deadParticles = particles.filter(p => !p.isAlive);
          if (deadParticles.length > 0) {
            particles = particles.filter(p => p.isAlive);
            // Respawn new particles to maintain count
            for (let i = 0; i < deadParticles.length; i++) {
              const p = new Particle();
              p.radius = Math.min(w, h) * 0.4 + Math.random() * 20;
              p.startRadius = p.radius;
              particles.push(p);
            }
            particleCountTotal = particles.length;
            particleCount.textContent = `✦ ${particles.length} particles`;
          }
        }

        // Draw vortex center
        drawVortexCenter(cx, cy);

        // Draw particles (sorted by radius for depth)
        const sortedParticles = [...particles].sort((a, b) => a.radius - b.radius);
        sortedParticles.forEach(p => p.draw(ctx, sizeMult));

        // Status
        if (isPlaying) {
          vortexStatus.textContent = '🌀 Spiraling';
          status.textContent = '🌀 Particles spiraling into the vortex';
        } else {
          vortexStatus.textContent = '⏸ Paused';
          status.textContent = '⏸ Paused';
        }
      }

      // ----- Animation loop -----
      function animate() {
        time += 0.016;
        draw();
        animationId = requestAnimationFrame(animate);
      }

      // ----- Start animation -----
      function startAnimation() {
        if (animationId) {
          cancelAnimationFrame(animationId);
        }
        animate();
      }

      // ----- Toggle play -----
      function togglePlay() {
        isPlaying = !isPlaying;
        playBtn.textContent = isPlaying ? '▶ Play' : '⏸ Paused';
        vortexStatus.textContent = isPlaying ? '🌀 Spiraling' : '⏸ Paused';
        status.textContent = isPlaying ? '🌀 Particles spiraling into the vortex' : '⏸ Paused';
      }

      // ----- Play -----
      function play() {
        isPlaying = true;
        playBtn.textContent = '▶ Play';
        vortexStatus.textContent = '🌀 Spiraling';
        status.textContent = '🌀 Particles spiraling into the vortex';
      }

      // ----- Pause -----
      function pause() {
        isPlaying = false;
        playBtn.textContent = '⏸ Paused';
        vortexStatus.textContent = '⏸ Paused';
        status.textContent = '⏸ Paused';
      }

      // ----- Reset -----
      function resetVortex() {
        time = 0;
        isPlaying = true;
        playBtn.textContent = '▶ Play';
        vortexStatus.textContent = '🌀 Spiraling';
        status.textContent = '↺ Reset';
        const count = parseInt(countSlider.value);
        generateParticles(count);
        // Reset sliders
        speedSlider.value = 5;
        speedValue.textContent = '5×';
        strengthSlider.value = 50;
        strengthValue.textContent = '50%';
        sizeSlider.value = 4;
        sizeValue.textContent = '4px';
        setTimeout(() => {
          status.textContent = '🌀 Particles spiraling into the vortex';
        }, 500);
      }

      // ----- Event Listeners -----
      playBtn.addEventListener('click', play);
      pauseBtn.addEventListener('click', pause);
      toggleBtn.addEventListener('click', togglePlay);
      resetBtn.addEventListener('click', resetVortex);

      speedSlider.addEventListener('input', (e) => {
        speedValue.textContent = e.target.value + '×';
      });

      countSlider.addEventListener('input', (e) => {
        const val = parseInt(e.target.value);
        countValue.textContent = val;
        generateParticles(val);
        status.textContent = `✦ Particle count: ${val}`;
      });

      strengthSlider.addEventListener('input', (e) => {
        strengthValue.textContent = e.target.value + '%';
      });

      sizeSlider.addEventListener('input', (e) => {
        sizeValue.textContent = e.target.value + 'px';
      });

      // Keyboard shortcuts
      document.addEventListener('keydown', (e) => {
        if (e.key === ' ' || e.key === 'Space') {
          e.preventDefault();
          togglePlay();
        }
        if (e.key === 'p' || e.key === 'P') {
          e.preventDefault();
          isPlaying ? pause() : play();
        }
        if (e.key === 'r' || e.key === 'R') {
          e.preventDefault();
          resetVortex();
        }
      });

      // ----- Resize handler -----
      let resizeTimeout;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(() => {
          setupCanvas();
          const count = parseInt(countSlider.value);
          generateParticles(count);
        }, 200);
      });

      // ----- Init -----
      function init() {
        setupCanvas();
        const count = parseInt(countSlider.value);
        generateParticles(count);
        startAnimation();
        status.textContent = '🌀 Particles spiraling into the vortex';
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }

    })();
  </script>
</body>
</html>
