<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-stock-chart-line demo</title>
</head>
<body>
<div class="sc-app">
  <span class="sc-title">MARKET</span>
  <div class="sc-chart">
    <span class="sc-grid sc-grid-1"></span>
    <span class="sc-grid sc-grid-2"></span>
    <span class="sc-grid sc-grid-3"></span>
    <span class="sc-line"></span>
    <span class="sc-dot"></span>
  </div>
  <div class="sc-quote">
    <span class="sc-ticker">AAPL</span>
    <span class="sc-price">$212.48</span>
    <span class="sc-change">+1.86%</span>
  </div>
</div>
</body>
</html>
