<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surface Code SC - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css"></head><body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030712; color: #ffffff;">

    <div class="ease-card ease-card-glass surf-container">
        <div class="surf-header">
            <h2>Surface Code</h2>
            <span class="ease-badge ease-badge-primary">Quantum Error Correction</span>
        </div>
        
        <div class="surf-screen ease-center">
            <div class="surf-flux flux-surf-a"></div>
            <div class="surf-flux flux-surf-b"></div>
            <div class="surf-boundary-ring"></div>
            <div class="surf-core ease-center"></div>
        </div>

        <div class="surf-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">2D Planar Lattice &amp; High Fault-Tolerant Threshold</span>
            <button class="ease-btn ease-btn-primary ease-btn-sm ease-hover-grow">Run Surface Code</button>
        </div>
    </div></body></html>
