<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dome Observatory Slit — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Dome Observatory Slit demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Dome Observatory Slit</h1>
      <p class="lede">Observatory dome slit rotating to track the sky</p>
    </header>

    <section class="ease-dome-observatory-slit" data-demo="dome-observatory-slit" aria-live="polite">
      <div class="ease-dome-observatory-slit__housing">
        <div class="ease-dome-observatory-slit__bezel">
          <div class="ease-dome-observatory-slit__face">
            <div class="ease-dome-observatory-slit__readout">
              <span class="ease-dome-observatory-slit__label">Dome Observatory Slit</span>
              <span class="ease-dome-observatory-slit__value">LIVE</span>
            </div>
            <div class="ease-dome-observatory-slit__motion" aria-hidden="true">
              <span class="ease-dome-observatory-slit__a"></span>
              <span class="ease-dome-observatory-slit__b"></span>
              <span class="ease-dome-observatory-slit__c"></span>
              <span class="ease-dome-observatory-slit__d"></span>
            </div>
            <div class="ease-dome-observatory-slit__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-dome-observatory-slit__controls">
          <button type="button" class="ease-dome-observatory-slit__btn primary">Engage</button>
          <button type="button" class="ease-dome-observatory-slit__btn">Reset</button>
          <label class="ease-dome-observatory-slit__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-dome-observatory-slit__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
