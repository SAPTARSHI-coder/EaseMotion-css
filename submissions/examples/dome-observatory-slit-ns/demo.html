<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ease Dome Observatory Slit</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="ease-dome-observatory-slit">

  <div class="observatory-panel">

    <h2>OBSERVATORY CONTROL</h2>
    <p>SKY TRACKING DOME</p>

    <div class="dome">

      <div class="sky"></div>

      <div class="dome-shell">
        <div class="slit"></div>
      </div>

      <div class="telescope"></div>

    </div>

    <div class="indicator">
      <span></span>
      TRACKING ACTIVE
    </div>

  </div>

</div>

</body>
</html>
