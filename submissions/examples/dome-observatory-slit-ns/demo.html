<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Observatory Dome Slit - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="ease-dome-observatory-slit">
        <div class="em-dome-housing">
            <div class="em-dome-roof">
                <div class="em-dome-slit-track">
                    <div class="em-dome-slit"></div>
                </div>
                <div class="em-dome-shutter"></div>
            </div>
            <div class="em-control-panel">
                <div class="em-status-indicator">
                    <span class="em-indicator-dot"></span>
                    <span class="em-indicator-text">TRACKING SKY // ACTIVE</span>
                </div>
                <div class="em-dial-cluster">
                    <div class="em-dial">
                        <div class="em-dial-needle"></div>
                    </div>
                    <div class="em-metrics">
                        <span class="em-label">AZIMUTH</span>
                        <span class="em-value">142.8° E</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
