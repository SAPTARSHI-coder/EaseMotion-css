<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Circular Progress Ring | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="cpr-container">
    <div class="cpr-ring">
      <div class="cpr-track"></div>
      <div class="cpr-fill"></div>
      <div class="cpr-label">
        <span class="cpr-value">90%</span>
        <span class="cpr-text">Complete</span>
      </div>
    </div>
    <div class="cpr-ring cpr-variant-green">
      <div class="cpr-track"></div>
      <div class="cpr-fill"></div>
      <div class="cpr-label">
        <span class="cpr-value">75%</span>
        <span class="cpr-text">Growth</span>
      </div>
    </div>
    <div class="cpr-ring cpr-variant-orange">
      <div class="cpr-track"></div>
      <div class="cpr-fill"></div>
      <div class="cpr-label">
        <span class="cpr-value">60%</span>
        <span class="cpr-text">Progress</span>
      </div>
    </div>
  </div>
</body>
</html>
