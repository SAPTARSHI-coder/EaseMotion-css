<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Morphing Tooltip | SaaS Modern Styling</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="saas-card" aria-label="SaaS Feature Showcase">
    <span class="card-badge">✨ Feature Preview</span>
    <h1 class="card-title">Morphing SaaS Tooltip</h1>
    <p class="card-desc">Hover or focus over the action button below to watch the tooltip morph fluidly from a compact pill into a sleek dark-mode popover.</p>

    <div class="tooltip-container">
        <button type="button" class="saas-btn" aria-describedby="saas-tooltip">
            Inspect Metric Details
        </button>
        <div id="saas-tooltip" class="morph-tooltip" role="tooltip">
            Real-time analytics engine processing 10k events/sec with 99.99% uptime.
        </div>
    </div>
</main>

</body>
</html>
