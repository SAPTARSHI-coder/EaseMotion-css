<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ashpan Hopper Dump — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Ashpan Hopper Dump demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Ashpan Hopper Dump</h1>
      <p class="lede">Ashpan hopper dumping firebed ash</p>
    </header>

    <section class="ease-ashpan-hopper-dump" data-demo="ashpan-hopper-dump" aria-live="polite">
      <div class="ease-ashpan-hopper-dump__housing">
        <div class="ease-ashpan-hopper-dump__bezel">
          <div class="ease-ashpan-hopper-dump__face">
            <div class="ease-ashpan-hopper-dump__readout">
              <span class="ease-ashpan-hopper-dump__label">Ashpan Hopper Dump</span>
              <span class="ease-ashpan-hopper-dump__value">LIVE</span>
            </div>
            <div class="ease-ashpan-hopper-dump__motion" aria-hidden="true">
              <span class="ease-ashpan-hopper-dump__a"></span>
              <span class="ease-ashpan-hopper-dump__b"></span>
              <span class="ease-ashpan-hopper-dump__c"></span>
              <span class="ease-ashpan-hopper-dump__d"></span>
            </div>
            <div class="ease-ashpan-hopper-dump__meters">
              <i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-ashpan-hopper-dump__controls">
          <button type="button" class="ease-ashpan-hopper-dump__btn primary">Dump</button>
          <button type="button" class="ease-ashpan-hopper-dump__btn">Shut</button>
          <label class="ease-ashpan-hopper-dump__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-ashpan-hopper-dump__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
