<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Superconducting Transmon Qubits - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css"></head><body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030712; color: #ffffff;">

    <div class="ease-card ease-card-glass transmon-container">
        <div class="transmon-header">
            <h2>Transmon Qubits</h2>
            <span class="ease-badge ease-badge-warning">Resonating</span>
        </div>
        
        <div class="transmon-screen ease-center">
            <div class="transmon-flux flux-transmon-a"></div>
            <div class="transmon-flux flux-transmon-b"></div>
            <div class="transmon-boundary-ring"></div>
            <div class="transmon-core ease-center"></div>
        </div>

        <div class="transmon-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Josephson Junctions &amp; Microwave Drives</span>
            <button class="ease-btn ease-btn-warning ease-btn-sm ease-hover-grow">Run Transmon Circuit</button>
        </div>
    </div></body></html>
