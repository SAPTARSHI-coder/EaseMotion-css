<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyberpunk Holographic Matrix HUD | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
</head>
<body>
  <div class="hud-wrapper">
    <div class="cyber-container">
      <div class="scanlines"></div>
      
      <header class="hud-header">
        <div class="status-ring"></div>
        <h1 class="hud-title" data-text="CYBER_SYSTEMS_v4.2">CYBER_SYSTEMS_v4.2</h1>
        <div class="hud-status">ONLINE // SECURE</div>
      </header>

      <div class="hud-grid">
        <!-- Module 1 -->
        <div class="hud-card">
          <div class="card-corner top-left"></div>
          <div class="card-corner bottom-right"></div>
          <div class="hud-header-sm">CORE PROCESSOR</div>
          <div class="gauge-container">
            <div class="gauge-ring"></div>
            <div class="gauge-value">98.4%</div>
          </div>
          <div class="hud-metrics">
            <span>FREQ: 5.4 GHZ</span>
            <span>TEMP: 42°C</span>
          </div>
        </div>

        <!-- Module 2 -->
        <div class="hud-card active-node">
          <div class="card-corner top-left"></div>
          <div class="card-corner bottom-right"></div>
          <div class="hud-header-sm">QUANTUM LINK</div>
          <div class="matrix-stream">
            <div class="stream-line">01001001 01001110 01001001</div>
            <div class="stream-line">01010100 01001001 01000001</div>
            <div class="stream-line">01001100 01001001 01011010</div>
          </div>
          <div class="hud-metrics">
            <span>LATENCY: 0.2ms</span>
            <span>BANDWIDTH: 100Tbps</span>
          </div>
        </div>

        <!-- Module 3 -->
        <div class="hud-card">
          <div class="card-corner top-left"></div>
          <div class="card-corner bottom-right"></div>
          <div class="hud-header-sm">NEURAL FIREWALL</div>
          <div class="firewall-bar-wrapper">
            <div class="firewall-bar"></div>
          </div>
          <div class="hud-metrics">
            <span>THREATS: 0</span>
            <span>SHIELD: ACTIVE</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
