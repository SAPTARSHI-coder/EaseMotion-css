<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Responsive parallax neumorphism progress bar built with HTML and CSS."
  >

  <title>Parallax Neumorphism Progress Bar</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="demo-page">

    <section class="progress-card" aria-labelledby="progress-title">

      <div class="card-header">
        <div>
          <p class="eyebrow">PROJECT STATUS</p>
          <h1 id="progress-title">Development Progress</h1>
        </div>

        <span class="progress-badge">ACTIVE</span>
      </div>

      <div class="progress-wrapper">

        <div class="progress-info">
          <span>Overall completion</span>
          <strong>76%</strong>
        </div>

        <div
          class="progress-track"
          role="progressbar"
          aria-label="Project completion"
          aria-valuenow="76"
          aria-valuemin="0"
          aria-valuemax="100"
        >
          <div class="progress-fill">
            <span class="progress-glow"></span>
            <span class="progress-shine"></span>
            <span class="progress-knob"></span>
          </div>
        </div>

        <div class="progress-scale" aria-hidden="true">
          <span>0%</span>
          <span>25%</span>
          <span>50%</span>
          <span>75%</span>
          <span>100%</span>
        </div>

      </div>

      <div class="stats">

        <div class="stat">
          <span class="stat-label">COMPLETED</span>
          <strong>38</strong>
          <small>tasks</small>
        </div>

        <div class="stat">
          <span class="stat-label">IN PROGRESS</span>
          <strong>9</strong>
          <small>tasks</small>
        </div>

        <div class="stat">
          <span class="stat-label">REMAINING</span>
          <strong>12</strong>
          <small>tasks</small>
        </div>

      </div>

    </section>

  </main>

</body>
</html>
