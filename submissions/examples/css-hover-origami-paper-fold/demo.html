<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Hover: Origami Paper Fold Variation - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="em-demo-container">
        <!-- Pure CSS Origami Paper Fold Hover Component Showcase -->
        <header class="em-hover-card" role="region" aria-label="Origami Paper Fold Hover Showcase" tabindex="0">
            <div class="em-hover-header-bar">
                <span class="em-card-badge">HOVER EFFECTS</span>
                <span class="em-brand-logo">OrigamiMotion</span>
            </div>
            <h1 class="em-card-title">Origami Fold Hover</h1>
            <p class="em-card-desc">A smooth, accessible, and performant pure CSS hover effect featuring 3D perspective paper folding folds, realistic shading highlights, and frosted glassmorphism.</p>
            <div class="em-hover-wrapper">
                <button class="em-origami-btn" aria-label="Origami Fold Button">
                    <span class="em-btn-face em-face-front">PAPER FOLD</span>
                    <span class="em-btn-face em-face-back">UNFOLDED</span>
                </button>
            </div>
        </header>
    </div>
</body>
</html>
