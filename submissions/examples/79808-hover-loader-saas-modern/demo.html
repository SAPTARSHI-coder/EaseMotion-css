<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hover Loader - SaaS Modern</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">
    <section class="loader-card">
      <span class="eyebrow">SAAS COMPONENT</span>

      <h1>Hover Loader</h1>

      <p class="description">
        A clean SaaS-style loader that activates when the card is hovered
        or focused.
      </p>

      <button class="loader-trigger" type="button">
        <span class="trigger-content">
          <span class="loader">
            <span></span>
            <span></span>
            <span></span>
          </span>
          <span>Hover to load</span>
        </span>

        <span class="arrow" aria-hidden="true">→</span>
      </button>
    </section>
  </main>

</body>
</html>
