<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Progress Ring — EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <p class="label">Animated Progress Rings (Pure CSS)</p>
  <div class="demo-row">
    <!-- 75% Progress -->
    <div class="ease-progress-ring" style="--target-offset: 70;">
      <svg viewBox="0 0 100 100">
        <circle class="ease-progress-ring__bg" cx="50" cy="50" r="45" />
        <circle class="ease-progress-ring__meter" cx="50" cy="50" r="45" />
      </svg>
      <span class="ease-progress-ring__value">75%</span>
    </div>

    <!-- 90% Success Progress -->
    <div class="ease-progress-ring ease-progress-ring--success" style="--target-offset: 28;">
      <svg viewBox="0 0 100 100">
        <circle class="ease-progress-ring__bg" cx="50" cy="50" r="45" />
        <circle class="ease-progress-ring__meter" cx="50" cy="50" r="45" />
      </svg>
      <span class="ease-progress-ring__value">90%</span>
    </div>

    <!-- 40% Danger Progress -->
    <div class="ease-progress-ring ease-progress-ring--danger" style="--target-offset: 170;">
      <svg viewBox="0 0 100 100">
        <circle class="ease-progress-ring__bg" cx="50" cy="50" r="45" />
        <circle class="ease-progress-ring__meter" cx="50" cy="50" r="45" />
      </svg>
      <span class="ease-progress-ring__value">40%</span>
    </div>
  </div>

  <p class="label">Infinite Loading Spinner</p>
  <div class="demo-row">
    <div class="ease-progress-ring ease-progress-ring--spinner">
      <svg viewBox="0 0 100 100">
        <circle class="ease-progress-ring__bg" cx="50" cy="50" r="45" />
        <circle class="ease-progress-ring__meter" cx="50" cy="50" r="45" />
      </svg>
    </div>
  </div>

</body>
</html>
