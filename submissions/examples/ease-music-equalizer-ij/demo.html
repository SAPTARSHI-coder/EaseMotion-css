<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music Equalizer - EaseMotion Submission</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="stage">
    <div class="player" id="player">
      <div class="cover-area">
        <div class="vinyl" aria-hidden="true">
          <span class="vinyl-groove"></span>
          <span class="vinyl-label"></span>
        </div>
        <div class="art" aria-hidden="true">♪</div>
      </div>
      <div class="track-info">
        <h1 class="track">Midnight Drive</h1>
        <p class="artist">The EaseMotion Band</p>
      </div>
      <div class="eq" aria-hidden="true">
        <span class="bar b1"></span>
        <span class="bar b2"></span>
        <span class="bar b3"></span>
        <span class="bar b4"></span>
        <span class="bar b5"></span>
      </div>
      <div class="seek">
        <div class="seek-track"><span class="seek-fill" id="seekFill"></span></div>
        <div class="seek-times">
          <span>1:24</span>
          <span>3:47</span>
        </div>
      </div>
      <div class="player-controls">
        <button class="p-btn" aria-label="Previous">⏮</button>
        <button class="p-btn play" id="playBtn" aria-label="Play or pause">▶</button>
        <button class="p-btn" aria-label="Next">⏭</button>
      </div>
    </div>
    <p class="hint">Press play — the vinyl spins and the equalizer dances.</p>
  </main>

  <script>
    const player = document.getElementById('player');
    const playBtn = document.getElementById('playBtn');
    const seekFill = document.getElementById('seekFill');
    let progress = 0.36;
    let playing = false;
    let raf = null;

    function step() {
      if (!playing) return;
      progress += 0.0004;
      if (progress > 1) progress = 0;
      seekFill.style.width = (progress * 100) + '%';
      raf = requestAnimationFrame(step);
    }

    playBtn.addEventListener('click', () => {
      playing = !playing;
      player.classList.toggle('playing', playing);
      playBtn.textContent = playing ? '⏸' : '▶';
      if (playing) {
        raf = requestAnimationFrame(step);
      } else {
        cancelAnimationFrame(raf);
      }
    });
  </script>
</body>
</html>
