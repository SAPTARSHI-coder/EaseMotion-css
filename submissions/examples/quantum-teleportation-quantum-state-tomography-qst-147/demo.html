<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum State Tomography QST - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css"></head><body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030712; color: #ffffff;">

    <div class="ease-card ease-card-glass qst-container">
        <div class="qst-header">
            <h2>Quantum State Tomography</h2>
            <span class="ease-badge ease-badge-success">Quantum Information</span>
        </div>
        
        <div class="qst-screen ease-center">
            <div class="qst-flux flux-qst-a"></div>
            <div class="qst-flux flux-qst-b"></div>
            <div class="qst-boundary-ring"></div>
            <div class="qst-core ease-center"></div>
        </div>

        <div class="qst-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Pauli Basis Measurements &amp; Density Matrix</span>
            <button class="ease-btn ease-btn-success ease-btn-sm ease-hover-grow">Run Tomography</button>
        </div>
    </div></body></html>
