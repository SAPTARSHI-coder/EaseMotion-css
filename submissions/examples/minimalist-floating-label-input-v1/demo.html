<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Minimalist Floating Label Input</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="demo">
    <section class="minimal-card">

      <h1>Minimalist Input</h1>

      <p class="description">
        A clean and responsive floating label input built with pure CSS.
      </p>

      <form class="minimal-form">

        <div class="minimal-field">
          <input
            class="minimal-input"
            type="text"
            id="name"
            name="name"
            placeholder=" "
            autocomplete="name"
            required
          >

          <label class="minimal-label" for="name">
            Full Name
          </label>
        </div>

        <div class="minimal-field">
          <input
            class="minimal-input"
            type="email"
            id="email"
            name="email"
            placeholder=" "
            autocomplete="email"
            required
          >

          <label class="minimal-label" for="email">
            Email Address
          </label>
        </div>

        <div class="minimal-field">
          <input
            class="minimal-input"
            type="tel"
            id="phone"
            name="phone"
            placeholder=" "
            autocomplete="tel"
          >

          <label class="minimal-label" for="phone">
            Phone Number
          </label>
        </div>

        <div class="minimal-field">
          <textarea
            class="minimal-input minimal-textarea"
            id="message"
            name="message"
            placeholder=" "
            rows="4"
          ></textarea>

          <label class="minimal-label" for="message">
            Message
          </label>
        </div>

        <button class="minimal-button" type="submit">
          Continue
        </button>

      </form>

    </section>
  </main>

</body>
</html>
