<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Origami Paper Fold Card</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="origami-wrapper">
    <div class="origami-card">
      <div class="fold fold-top">
        <div class="content">
          <h3>Origami Card</h3>
          <span class="badge">New</span>
        </div>
        <div class="fold fold-middle">
          <div class="content">
            <p>A pure CSS card featuring smooth 3D origami paper fold effects. Hover to unfold the details below!</p>
          </div>
          <div class="fold fold-bottom">
            <div class="content">
              <a href="#" class="action-btn">Explore Now</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
