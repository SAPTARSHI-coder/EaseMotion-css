<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />
  <meta
    name="description"
    content="Responsive cyberpunk hover pagination component built with HTML and CSS."
  />
  <title>Cyberpunk Hover Pagination</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main class="page">
    <section class="showcase" aria-labelledby="title">
      <span class="eyebrow">EASEMOTION CSS</span>

      <h1 id="title">Hover Pagination</h1>

      <p class="intro">
        A futuristic pagination component with glowing hover states,
        angular details, and responsive layouts.
      </p>

      <div class="pagination-stage">
        <nav class="pagination" aria-label="Pagination">
          <a class="pagination__control" href="#previous" aria-label="Previous page">
            <span aria-hidden="true">‹</span>
            <span class="control-label">Prev</span>
          </a>

          <ol class="pagination__list">
            <li>
              <a class="pagination__item" href="#page-1">01</a>
            </li>
            <li>
              <a class="pagination__item is-active" href="#page-2" aria-current="page">
                02
              </a>
            </li>
            <li>
              <a class="pagination__item" href="#page-3">03</a>
            </li>
            <li>
              <a class="pagination__item" href="#page-4">04</a>
            </li>
            <li>
              <a class="pagination__item" href="#page-5">05</a>
            </li>
          </ol>

          <a class="pagination__control" href="#next" aria-label="Next page">
            <span class="control-label">Next</span>
            <span aria-hidden="true">›</span>
          </a>
        </nav>

        <span class="pagination__status">
          SYSTEM // 02 OF 05
        </span>
      </div>
    </section>
  </main>
</body>
</html>
