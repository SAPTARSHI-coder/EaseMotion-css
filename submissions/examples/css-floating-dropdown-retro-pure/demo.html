<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Floating Dropdown</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="dropdown-wrapper">
        <button class="retro-btn" aria-haspopup="true" aria-expanded="false">
            MENU <span class="arrow">▼</span>
        </button>
        
        <ul class="retro-dropdown" role="menu">
            <li role="none"><a href="#" role="menuitem">Start Game</a></li>
            <li role="none"><a href="#" role="menuitem">High Scores</a></li>
            <li role="none"><a href="#" role="menuitem">Settings</a></li>
            <li role="none" class="divider"></li>
            <li role="none"><a href="#" role="menuitem" class="danger">Quit</a></li>
        </ul>
    </div>

</body>
</html>
