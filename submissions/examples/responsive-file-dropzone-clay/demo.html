<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Responsive File Dropzone with Claymorphism styling"
  >

  <title>Claymorphism File Dropzone</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="page">
    <section class="demo-wrapper" aria-labelledby="dropzone-title">

      <div class="intro">
        <span class="eyebrow">EASEMOTION CSS</span>

        <h1 id="dropzone-title">
          Upload your files
        </h1>

        <p>
          A responsive claymorphism file dropzone built entirely
          with HTML and CSS.
        </p>
      </div>

      <div class="dropzone-container">
        <label
          class="dropzone"
          for="file-upload"
        >
          <input
            id="file-upload"
            class="dropzone-input"
            type="file"
            aria-describedby="upload-description"
          >

          <span class="dropzone-icon" aria-hidden="true">
            <svg
              viewBox="0 0 64 64"
              role="presentation"
              focusable="false"
            >
              <path
                d="M32 42V12"
              />

              <path
                d="M20 24L32 12L44 24"
              />

              <path
                d="M16 38V48C16 50.2 17.8 52 20 52H44C46.2 52 48 50.2 48 48V38"
              />
            </svg>
          </span>

          <span class="dropzone-title">
            Drop your files here
          </span>

          <span class="dropzone-subtitle">
            or click to browse from your device
          </span>

          <span
            id="upload-description"
            class="dropzone-info"
          >
            PNG, JPG, PDF or ZIP • Maximum 10 MB
          </span>

          <span class="dropzone-button">
            Choose File
          </span>
        </label>
      </div>

      <p class="helper-text">
        Your files stay on your device in this CSS-only demo.
      </p>

    </section>
  </main>
</body>
</html>
