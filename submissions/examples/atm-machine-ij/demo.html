<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-atm-machine</title>
</head>
<body>
<main class="atm-card">
  <header class="atm-head">
    <h1 class="atm-bank">CityBank ATM</h1>
    <span class="atm-zone">Lobby 04</span>
  </header>
  <section class="atm-screen" aria-label="ATM display">
    <p class="atm-prompt">Enter PIN</p>
    <strong class="atm-amount">$480.00</strong>
    <span class="atm-balance">Bal $1,240.50</span>
  </section>
  <section class="atm-slot" aria-label="card slot">
    <span class="atm-card-in"></span>
  </section>
  <section class="atm-tray" aria-label="cash tray">
    <span class="atm-cash"></span>
  </section>
  <section class="atm-keypad" aria-label="keypad">
    <span class="atm-key">1</span>
    <span class="atm-key">2</span>
    <span class="atm-key">3</span>
    <span class="atm-key">4</span>
    <span class="atm-key">5</span>
    <span class="atm-key">6</span>
    <span class="atm-key">7</span>
    <span class="atm-key">8</span>
    <span class="atm-key">9</span>
    <span class="atm-key atm-key-clear">C</span>
    <span class="atm-key">0</span>
    <span class="atm-key atm-key-enter">OK</span>
  </section>
  <footer class="atm-foot">
    <span class="atm-led">Ready</span>
    <span class="atm-tip">Insert card</span>
  </footer>
</main>
</body>
</html>
