<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Skew-Active Badge Demo</title>
<link rel="stylesheet" href="style.css">
<style>
  body {
    font-family: sans-serif;
    max-width: 600px;
    margin: 3rem auto;
    background: #0f172a;
    color: #fff;
    padding: 1rem;
  }
  .demo-row {
    display: flex;
    gap: 1rem;
    flex-wrap: wrap;
    margin-bottom: 2rem;
  }
</style>
</head>
<body>
  <h2>CSS Skew-Active Badge — SaaS Showcase</h2>

  <p>Default & color variants</p>
  <div class="demo-row">
    <div class="ease-skew-badge"><span>New</span></div>
    <div class="ease-skew-badge ease-skew-badge-success"><span>Active</span></div>
    <div class="ease-skew-badge ease-skew-badge-danger"><span>Critical</span></div>
    <div class="ease-skew-badge ease-skew-badge-warning"><span>Beta</span></div>
    <div class="ease-skew-badge ease-skew-badge-info"><span>Info</span></div>
  </div>

  <p>Pulse animation variant</p>
  <div class="demo-row">
    <div class="ease-skew-badge ease-skew-badge-pulse"><span>Live</span></div>
  </div>

  <p>Active state (click/tap to test)</p>
  <div class="demo-row">
    <div class="ease-skew-badge is-active"><span>Selected</span></div>
  </div>

</body>
</html>
