<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Floating Multi-Select Dropdown</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="page">
    <section class="demo-shell" aria-labelledby="demo-title">

      <div class="intro">
        <span class="eyebrow">EaseMotion Component</span>

        <h1 id="demo-title">
          Floating Multi-Select
        </h1>

        <p>
          A Material Design inspired multi-select dropdown built with
          semantic HTML and pure CSS.
        </p>
      </div>

      <div class="component-demo">

        <div class="field-group">

          <details class="multi-select">

            <summary class="select-trigger">
              <span class="select-value">
                Select technologies
              </span>

              <span class="select-icon" aria-hidden="true">
               ⌄
              </span>
            </summary>

            <div class="dropdown-menu">

              <label class="option">
                <input
                  type="checkbox"
                  name="technology"
                  value="html"
                >
                <span class="checkbox" aria-hidden="true"></span>
                <span class="option-label">HTML</span>
              </label>

              <label class="option">
                <input
                  type="checkbox"
                  name="technology"
                  value="css"
                >
                <span class="checkbox" aria-hidden="true"></span>
                <span class="option-label">CSS</span>
              </label>

              <label class="option">
                <input
                  type="checkbox"
                  name="technology"
                  value="javascript"
                >
                <span class="checkbox" aria-hidden="true"></span>
                <span class="option-label">JavaScript</span>
              </label>

              <label class="option">
                <input
                  type="checkbox"
                  name="technology"
                  value="scss"
                >
                <span class="checkbox" aria-hidden="true"></span>
                <span class="option-label">SCSS</span>
              </label>

              <label class="option">
                <input
                  type="checkbox"
                  name="technology"
                  value="react"
                >
                <span class="checkbox" aria-hidden="true"></span>
                <span class="option-label">React</span>
              </label>

              <label class="option">
                <input
                  type="checkbox"
                  name="technology"
                  value="vue"
                >
                <span class="checkbox" aria-hidden="true"></span>
                <span class="option-label">Vue</span>
              </label>

            </div>

          </details>

          <span class="floating-label">
            Technologies
          </span>

          <p class="helper-text">
            Choose one or more technologies.
          </p>

        </div>

      </div>

    </section>
  </main>

</body>
</html>
