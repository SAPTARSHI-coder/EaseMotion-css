<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS LED Dot Matrix Text</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="layout-container">
        
        <header class="section-header">
            <h1 class="title">LED Dot Matrix Text</h1>
            <p class="subtitle">A pure CSS implementation of a digital LED dot matrix display. Achieved using standard fonts masked with a repeating radial gradient.</p>
        </header>

        <div class="demo-area">
            
            <!-- 
              [TECHNIQUE] CSS Mask Image
              The text itself is standard solid text. We use the `-webkit-mask-image` 
              property with a repeating radial gradient to punch holes in the text,
              making it look like it's composed of individual LED dots.
            -->
            <div class="led-board">
                
                <h2 class="led-text" data-text="SYSTEM ACTIVE">
                    SYSTEM ACTIVE
                </h2>
                
                <h2 class="led-text led-text-secondary" data-text="LOADING...">
                    LOADING...
                </h2>
                
            </div>
            
        </div>
        
    </div>

</body>
</html>
