<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-weather-station-anemometer demo</title>
</head>
<body>
<div class="wsa-pole">
  <div class="wsa-head">
    <i class="wsa-arm wsa-arm-a"><span class="wsa-cup"></span></i>
    <i class="wsa-arm wsa-arm-b"><span class="wsa-cup"></span></i>
    <i class="wsa-arm wsa-arm-c"><span class="wsa-cup"></span></i>
  </div>
  <div class="wsa-vane"><i class="wsa-tail"></i><b class="wsa-nose"></b></div>
  <div class="wsa-box"><b class="wsa-wind">14 KM/H</b><span class="wsa-dir">NW</span></div>
</div>
</body>
</html>
