<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EaseMotion — Compare Table</title>
  <link rel="stylesheet" href="../../core/variables.css">
  <link rel="stylesheet" href="../../components/compare-table.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="demo-container">
    <h1>Compare Table</h1>
    <p>Side-by-side feature comparison.</p>

    <div class="compare-wrapper">
      <table class="ease-compare-table">
        <thead>
          <tr>
            <th>Feature</th>
            <th class="highlight">Free</th>
            <th>Pro</th>
            <th>Enterprise</th>
          </tr>
        </thead>
        <tbody>
          <tr><td>Projects</td><td class="highlight">5</td><td>50</td><td>Unlimited</td></tr>
          <tr><td>Storage</td><td class="highlight">1 GB</td><td>50 GB</td><td>500 GB</td></tr>
          <tr><td>API Access</td><td class="highlight">—</td><td>✓</td><td>✓</td></tr>
          <tr><td>Support</td><td class="highlight">Community</td><td>Email</td><td>24/7 Phone</td></tr>
          <tr><td>SSO</td><td class="highlight">—</td><td>—</td><td>✓</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</body>
</html>
