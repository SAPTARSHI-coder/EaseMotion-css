<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EaseMotion CSS — Dropdown Menu Select Showcase</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="dd-demo-wrapper">
    <header class="dd-header">
      <span class="badge">UI Component Showcase</span>
      <h1>Dropdown Menu Select</h1>
      <p>Custom select dropdown component featuring spring scale expansion transitions, chevron rotation, and keyboard focus accessibility.</p>
    </header>

    <main class="dd-card">
      <details class="ease-dropdown-select">
        <summary class="dd-summary">
          <span class="dd-selected-label">Select Easing Curve...</span>
          <span class="dd-chevron">&rsaquo;</span>
        </summary>
        <div class="dd-menu-wrapper">
          <div class="dd-menu">
            <label class="dd-option">
              <input type="radio" name="easing-curve" value="ease-in-out">
              <span class="option-icon">⚡</span>
              <span class="option-text">Cubic Bezier Ease-In-Out</span>
            </label>

            <label class="dd-option">
              <input type="radio" name="easing-curve" value="spring-bounce" checked>
              <span class="option-icon">🎯</span>
              <span class="option-text">Spring Overshoot Bounce</span>
            </label>

            <label class="dd-option">
              <input type="radio" name="easing-curve" value="linear-smooth">
              <span class="option-icon">🔄</span>
              <span class="option-text">Linear Continuous Loop</span>
            </label>
          </div>
        </div>
      </details>
    </main>

    <footer class="dd-footer">
      <p>EaseMotion CSS Component &bull; Submitted by @Ishita-Katiyar-06</p>
    </footer>
  </div>
</body>
</html>
