<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ease Airport Schedule Monitor #74831 Demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #020617;
      margin: 0;
      padding: 16px;
    }
  </style>
</head>
<body>

  <div class="flight-board-container">
    <div class="flight-board-header">
      <h2>DEPARTURES</h2>
      <div class="live-indicator">
        <span class="live-dot"></span> LIVE
      </div>
    </div>
    <table class="flight-table">
      <thead>
        <tr>
          <th>FLIGHT</th>
          <th>DESTINATION</th>
          <th>TIME</th>
          <th>STATUS</th>
        </tr>
      </thead>
      <tbody>
        <tr class="flip-effect">
          <td>AI-402</td>
          <td>NEW YORK</td>
          <td>18:45</td>
          <td class="status-on-time">ON TIME</td>
        </tr>
        <tr class="flip-effect">
          <td>BA-117</td>
          <td>LONDON</td>
          <td>19:10</td>
          <td class="status-delayed">DELAYED</td>
        </tr>
        <tr class="flip-effect">
          <td>EK-508</td>
          <td>DUBAI</td>
          <td>19:30</td>
          <td class="status-on-time">BOARDING</td>
        </tr>
      </tbody>
    </table>
  </div>

</body>
</html>
