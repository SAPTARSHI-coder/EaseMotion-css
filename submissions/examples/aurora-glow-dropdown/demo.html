<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Pure CSS Aurora Glow dropdown menu"
  >
  <title>Aurora Glow Dropdown</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="page">
    <section class="demo" aria-labelledby="title">
      <span class="eyebrow">EASEMOTION CSS</span>

      <h1 id="title">Aurora Glow Dropdown</h1>

      <p class="description">
        A smooth CSS-only dropdown inspired by the soft,
        flowing glow of an aurora.
      </p>

      <div class="dropdown">
        <button
          class="dropdown-trigger"
          type="button"
          aria-haspopup="true"
        >
          <span>Explore Menu</span>
          <span class="arrow" aria-hidden="true">⌄</span>
        </button>

        <div class="dropdown-menu">
          <a href="#overview">
            <span class="icon">✦</span>
            <span>
              <strong>Overview</strong>
              <small>Discover the experience</small>
            </span>
          </a>

          <a href="#components">
            <span class="icon">◈</span>
            <span>
              <strong>Components</strong>
              <small>Explore UI components</small>
            </span>
          </a>

          <a href="#animations">
            <span class="icon">✧</span>
            <span>
              <strong>Animations</strong>
              <small>View motion effects</small>
            </span>
          </a>

          <a href="#documentation">
            <span class="icon">⌘</span>
            <span>
              <strong>Documentation</strong>
              <small>Read the guidelines</small>
            </span>
          </a>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
