<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ripple-Wave Toast - Minimalist Tech Layouts</title>
    <!-- Use standard EaseMotion CSS -->
    <link rel="stylesheet" href="../../../easemotion.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="ease-flex ease-justify-center ease-items-center" style="min-height: 100vh; background-color: #0f172a; margin: 0; font-family: system-ui, -apple-system, sans-serif;">
    <div class="minimalist-ripple-toast">
        <div class="toast-indicator">
            <svg class="toast-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
        </div>
        <div class="toast-body">
            <h4 class="toast-heading">System Update</h4>
            <p class="toast-text">All minimalist tech dependencies have been updated to the latest versions successfully.</p>
        </div>
        <button class="toast-dismiss" aria-label="Close notification">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
        </button>
    </div>
</body>
</html>
