<!-- EaseMotion component: jet-engine-dashboard -->
<!DOCTYPE html>
<html lang="en" data-jet="dash">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Ease Jet Engine Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="jet-dashboard">
  <header class="jet-head">
    <span class="jet-title">ENGINE 1</span>
    <span class="jet-alert">WARN</span>
  </header>
  <div class="jet-core">
    <span class="jet-fan"></span>
    <span class="jet-hub"></span>
  </div>
  <div class="jet-gauges">
    <div class="gauge"><span class="gauge-label">N1</span><span class="gauge-value">92%</span><span class="gauge-needle needle-n1"></span></div>
    <div class="gauge"><span class="gauge-label">N2</span><span class="gauge-value">78%</span><span class="gauge-needle needle-n2"></span></div>
    <div class="gauge"><span class="gauge-label">EGT</span><span class="gauge-value">640C</span><span class="gauge-needle needle-egt"></span></div>
  </div>
  <div class="jet-throttle">
    <span class="throttle-label">THROTTLE</span>
    <span class="throttle-track"><span class="throttle-lever"></span></span>
  </div>
  <footer class="jet-foot">
    <span class="jet-rpm">RPM 12,400</span>
    <span class="jet-oil">OIL OK</span>
  </footer>
</main>
</body>
</html>
