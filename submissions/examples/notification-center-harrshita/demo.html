<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notification Center | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="demo-header">
    <h1>Notification Center Drawer</h1>
    <p>Side sliding panel with tabbed notification items and unread count badges.</p>
  </header>

  <main class="demo-main">
    <section class="demo-section">
      <button class="ease-notif-trigger" id="openDrawer">
        Open Notifications <span class="ease-notif-count">3</span>
      </button>

      <div class="ease-notif-drawer" id="notifDrawer">
        <div class="ease-notif-header">
          <h3>Notification Center</h3>
          <button class="ease-notif-close" id="closeDrawer">&times;</button>
        </div>
        <div class="ease-notif-list">
          <div class="ease-notif-item ease-notif-unread">
            <span class="ease-notif-icon">&#9881;</span>
            <div>
              <h4>System Update Available</h4>
              <p>EaseMotion CSS v1.2 is ready to install.</p>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>
  <footer class="demo-footer"><p>EaseMotion CSS Project</p></footer>

  <script>
    const drawer = document.getElementById('notifDrawer');
    document.getElementById('openDrawer').addEventListener('click', () => drawer.classList.add('ease-drawer-open'));
    document.getElementById('closeDrawer').addEventListener('click', () => drawer.classList.remove('ease-drawer-open'));
  </script>
</body>
</html>
