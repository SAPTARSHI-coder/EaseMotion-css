<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Interactive Material Design treeview built with pure HTML and CSS."
  >

  <title>Interactive Treeview — Material Design</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="page">

    <section
      class="tree-card"
      aria-labelledby="tree-title"
    >

      <header class="tree-card__header">
        <div>
          <span class="tree-card__eyebrow">
            PROJECT EXPLORER
          </span>

          <h1 id="tree-title">
            File Structure
          </h1>
        </div>

        <span class="tree-card__badge">
          12 items
        </span>
      </header>

      <div class="tree" aria-label="Project file tree">

        <details class="tree-node" open>
          <summary class="tree-node__summary">
            <span class="tree-node__chevron" aria-hidden="true">
              ›
            </span>

            <span
              class="tree-node__icon tree-node__icon--folder"
              aria-hidden="true"
            >
              ●
            </span>

            <span class="tree-node__name">
              project
            </span>
          </summary>

          <div class="tree-node__children">

            <details class="tree-node" open>
              <summary class="tree-node__summary">
                <span
                  class="tree-node__chevron"
                  aria-hidden="true"
                >
                  ›
                </span>

                <span
                  class="tree-node__icon tree-node__icon--folder"
                  aria-hidden="true"
                >
                  ●
                </span>

                <span class="tree-node__name">
                  src
                </span>
              </summary>

              <div class="tree-node__children">

                <div class="tree-leaf">
                  <span
                    class="tree-leaf__icon tree-leaf__icon--blue"
                    aria-hidden="true"
                  >
                    ◼
                  </span>

                  <span>App.jsx</span>
                </div>

                <div class="tree-leaf">
                  <span
                    class="tree-leaf__icon tree-leaf__icon--yellow"
                    aria-hidden="true"
                  >
                    ◼
                  </span>

                  <span>index.js</span>
                </div>

                <details class="tree-node">
                  <summary class="tree-node__summary">
                    <span
                      class="tree-node__chevron"
                      aria-hidden="true"
                    >
                      ›
                    </span>

                    <span
                      class="tree-node__icon tree-node__icon--folder"
                      aria-hidden="true"
                    >
                      ●
                    </span>

                    <span class="tree-node__name">
                      components
                    </span>
                  </summary>

                  <div class="tree-node__children">

                    <div class="tree-leaf">
                      <span
                        class="tree-leaf__icon tree-leaf__icon--purple"
                        aria-hidden="true"
                      >
                        ◼
                      </span>

                      <span>Navbar.jsx</span>
                    </div>

                    <div class="tree-leaf">
                      <span
                        class="tree-leaf__icon tree-leaf__icon--purple"
                        aria-hidden="true"
                      >
                        ◼
                      </span>

                      <span>Sidebar.jsx</span>
                    </div>

                    <div class="tree-leaf">
                      <span
                        class="tree-leaf__icon tree-leaf__icon--purple"
                        aria-hidden="true"
                      >
                        ◼
                      </span>

                      <span>Card.jsx</span>
                    </div>

                  </div>
                </details>

              </div>
            </details>

            <details class="tree-node">
              <summary class="tree-node__summary">
                <span
                  class="tree-node__chevron"
                  aria-hidden="true"
                >
                  ›
                </span>

                <span
                  class="tree-node__icon tree-node__icon--folder"
                  aria-hidden="true"
                >
                  ●
                </span>

                <span class="tree-node__name">
                  public
                </span>
              </summary>

              <div class="tree-node__children">

                <div class="tree-leaf">
                  <span
                    class="tree-leaf__icon tree-leaf__icon--green"
                    aria-hidden="true"
                  >
                    ◼
                  </span>

                  <span>favicon.svg</span>
                </div>

                <div class="tree-leaf">
                  <span
                    class="tree-leaf__icon tree-leaf__icon--orange"
                    aria-hidden="true"
                  >
                    ◼
                  </span>

                  <span>logo.png</span>
                </div>

              </div>
            </details>

            <div class="tree-leaf">
              <span
                class="tree-leaf__icon tree-leaf__icon--blue"
                aria-hidden="true"
              >
                ◼
              </span>

              <span>package.json</span>
            </div>

            <div class="tree-leaf">
              <span
                class="tree-leaf__icon tree-leaf__icon--green"
                aria-hidden="true"
              >
                ◼
              </span>

              <span>README.md</span>
            </div>

          </div>
        </details>

      </div>

      <footer class="tree-card__footer">
        <span>
          Click folders to expand or collapse
        </span>

        <span class="tree-card__status">
          ● CSS ONLY
        </span>
      </footer>

    </section>

  </main>
</body>
</html>
