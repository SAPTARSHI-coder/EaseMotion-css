<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Scale-Hover Modal - Minimalist Tech</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="layout-container">
        
        <header class="section-header">
            <h1 class="title">System Configuration</h1>
            <p class="subtitle">A minimalist tech modal featuring a dynamic scale-in animation and hover-reactive depth scaling.</p>
        </header>

        <!-- The Modal Trigger (Checkbox Hack) -->
        <input type="checkbox" id="modal-trigger" class="modal-input">
        
        <div class="dashboard-area">
            <div class="card">
                <div class="controls">
                    <p class="instruction-text">Review your database configuration settings before deploying to production.</p>
                    
                    <!-- Label acts as the trigger button -->
                    <label for="modal-trigger" class="btn-trigger">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
                        Edit Configuration
                    </label>
                </div>
            </div>
        </div>

        <!-- 
           The Modal Overlay and Container
           Controlled entirely by the #modal-trigger checkbox state.
        -->
        <div class="modal-overlay">
            
            <!-- Clicking the background overlay closes the modal -->
            <label for="modal-trigger" class="modal-backdrop" aria-label="Close modal"></label>
            
            <div class="modal-container scale-hover-group">
                
                <div class="modal-header">
                    <div class="header-title">
                        <div class="icon-wrapper">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="5" rx="9" ry="3"></ellipse><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path></svg>
                        </div>
                        <h2>Database Cluster Settings</h2>
                    </div>
                    <!-- Close button in top right -->
                    <label for="modal-trigger" class="btn-close" aria-label="Close modal">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                    </label>
                </div>
                
                <div class="modal-body">
                    <div class="form-group">
                        <label class="form-label">Cluster Name</label>
                        <input type="text" class="form-input" value="prod-db-cluster-01" readonly>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Instance Type</label>
                        <select class="form-select">
                            <option>db.r6g.large (Memory Optimized)</option>
                            <option selected>db.r6g.xlarge (Memory Optimized)</option>
                            <option>db.r6g.2xlarge (Memory Optimized)</option>
                        </select>
                    </div>
                    
                    <div class="form-group config-toggle">
                        <label class="toggle-label">
                            <span class="toggle-title">Multi-AZ Deployment</span>
                            <span class="toggle-desc">Create a standby replica in a different Availability Zone for high availability.</span>
                        </label>
                        <!-- Nested purely decorative checkbox for visual toggle -->
                        <div class="switch-container">
                            <input type="checkbox" id="az-toggle" checked>
                            <label for="az-toggle" class="switch-slider"></label>
                        </div>
                    </div>
                </div>
                
                <div class="modal-footer">
                    <label for="modal-trigger" class="btn btn-secondary">Cancel</label>
                    <label for="modal-trigger" class="btn btn-primary">Save Changes</label>
                </div>
                
            </div>
        </div>
        
    </div>

</body>
</html>
