<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Animated dark mode badge built with HTML and CSS"
  >
  <title>Animated Dark Mode Badge V2</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="demo">
    <section class="showcase" aria-labelledby="title">
      <span class="eyebrow">EASEMOTION CSS</span>

      <h1 id="title">Animated Dark Mode Badge</h1>

      <p class="intro">
        A polished status badge with a subtle dark-mode glow,
        animated indicator, and responsive presentation.
      </p>

      <div class="badge-grid">
        <div class="badge-card">
          <span class="badge-label">STATUS</span>

          <div
            class="dark-badge"
            role="status"
            aria-label="Dark mode active"
          >
            <span class="badge-icon" aria-hidden="true">
              <span class="moon"></span>
            </span>

            <span class="badge-content">
              <strong>Dark Mode</strong>
              <span>Active</span>
            </span>

            <span class="status-dot" aria-hidden="true"></span>
          </div>
        </div>

        <div class="badge-card compact">
          <span class="badge-label">COMPACT</span>

          <div
            class="dark-badge compact-badge"
            role="status"
            aria-label="Night mode enabled"
          >
            <span class="badge-icon" aria-hidden="true">
              <span class="moon"></span>
            </span>

            <span class="badge-content">
              <strong>Night Mode</strong>
              <span>Enabled</span>
            </span>

            <span class="status-dot" aria-hidden="true"></span>
          </div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
