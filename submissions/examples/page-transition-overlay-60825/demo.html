<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Full-Page Transition Overlay Masks Example - EaseMotion-css</title>
  <meta name="description" content="A demonstration of a premium, pure CSS full-page transition overlay mask with a dramatic reveal animation.">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Full-Page Transition Overlay (Automatically slides up on load) -->
  <div class="ease-page-wipe" id="pageWipeOverlay" aria-hidden="true">
    <div class="wipe-loader">
      <div class="wipe-logo-icon"></div>
      <span class="wipe-logo-text">EaseMotion</span>
    </div>
  </div>

  <!-- Main Application Container -->
  <main class="app-container" id="mainContent">
    <!-- Hero Section / Glassmorphic Card -->
    <article class="hero-card">
      <div class="hero-content">
        <span class="badge">CSS Motion Library</span>
        <h1 class="hero-title">Experience Seamless Page Transitions</h1>
        <p class="hero-description">
          Add dramatic, premium full-page reveals using pure HTML and CSS. Zero JavaScript, lightweight, responsive, and designed with accessibility first.
        </p>
        <button class="cta-button" onclick="location.reload()" aria-label="Replay page reveal animation">
          <span class="cta-button-text">Replay Transition</span>
        </button>
      </div>
    </article>
  </main>

</body>
</html>
