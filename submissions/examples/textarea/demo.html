<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Expanding Textarea</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Expanding Textarea Demo</h1>
    <p>Type into the box below — it will expand as you add more lines.</p>
    <textarea id="expandingTextarea" placeholder="Start typing..."></textarea>
  </div>

  <script>
    const textarea = document.getElementById('expandingTextarea');

    function autoResize() {
      this.style.height = 'auto'; // reset height
      this.style.height = this.scrollHeight + 'px'; // set to scroll height
    }

    textarea.addEventListener('input', autoResize);
  </script>
</body>
</html>
