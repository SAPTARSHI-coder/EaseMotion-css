<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Pure CSS Glassmorphism Blur Card"
  >

  <title>Glassmorphism Blur Card</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="page">

    <section
      class="card-showcase"
      aria-label="Glassmorphism blur card demonstration"
    >

      <article class="glass-card">

        <div class="glass-orb glass-orb-one" aria-hidden="true"></div>
        <div class="glass-orb glass-orb-two" aria-hidden="true"></div>

        <div class="glass-content">

          <div class="glass-icon" aria-hidden="true">
            ◈
          </div>

          <p class="glass-label">
            EASEMOTION CSS
          </p>

          <h1>
            Glassmorphism
            <span>Blur Card</span>
          </h1>

          <p class="glass-description">
            A translucent CSS card with backdrop blur, subtle borders,
            soft lighting, and smooth interactive motion.
          </p>

          <div class="glass-footer">

            <span class="glass-badge">
              Pure CSS
            </span>

            <button
              class="glass-button"
              type="button"
              aria-label="Explore component"
            >
              →
            </button>

          </div>

        </div>

      </article>

    </section>

  </main>

</body>
</html>
