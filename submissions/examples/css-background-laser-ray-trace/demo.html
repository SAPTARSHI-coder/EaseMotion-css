<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Background: Laser Ray Trace - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="em-laser-page">
        <!-- Background Laser Ray Trace Animation Layer -->
        <div class="em-laser-bg" aria-hidden="true">
            <span class="em-laser-ray" style="--d:0s; --r:45deg;"></span>
            <span class="em-laser-ray" style="--d:0.8s; --r:135deg;"></span>
            <span class="em-laser-ray" style="--d:1.6s; --r:225deg;"></span>
            <span class="em-laser-ray" style="--d:2.4s; --r:315deg;"></span>
        </div>

        <div class="em-card" role="region" aria-label="Laser Ray Trace Background Showcase" tabindex="0">
            <span class="em-card-badge">BACKGROUND ANIMATIONS</span>
            <h1 class="em-card-title">Laser Ray Trace</h1>
            <p class="em-card-desc">A smooth, hardware-accelerated pure CSS background animation featuring dynamic laser ray trace styling and dark mode compatibility.</p>
            <a href="#" class="em-card-btn" role="button">Explore Effects</a>
        </div>
    </div>
</body>
</html>
