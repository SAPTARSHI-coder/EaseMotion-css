<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ripple Nav · Water Drop Ripples</title>

    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <div class="card">
        <h2>💧 Ripple Nav</h2>
        <p class="sub">items emit ripples like water drops</p>

        <!-- === RIPPLE NAV === -->
        <nav class="ripple-nav" id="rippleNav">
            <ul class="ripple-items">
                <li class="ripple-item">
                    <a href="#" class="ripple-link" data-tooltip="Home">
                        <i class="fas fa-home"></i>
                        <span>Home</span>
                    </a>
                    <span class="ripple-ring r1"></span>
                    <span class="ripple-ring r2"></span>
                    <span class="ripple-ring r3"></span>
                </li>
                <li class="ripple-item">
                    <a href="#" class="ripple-link" data-tooltip="Explore">
                        <i class="fas fa-compass"></i>
                        <span>Explore</span>
                    </a>
                    <span class="ripple-ring r1"></span>
                    <span class="ripple-ring r2"></span>
                    <span class="ripple-ring r3"></span>
                </li>
                <li class="ripple-item">
                    <a href="#" class="ripple-link" data-tooltip="Gallery">
                        <i class="fas fa-images"></i>
                        <span>Gallery</span>
                    </a>
                    <span class="ripple-ring r1"></span>
                    <span class="ripple-ring r2"></span>
                    <span class="ripple-ring r3"></span>
                </li>
                <li class="ripple-item">
                    <a href="#" class="ripple-link" data-tooltip="Blog">
                        <i class="fas fa-blog"></i>
                        <span>Blog</span>
                    </a>
                    <span class="ripple-ring r1"></span>
                    <span class="ripple-ring r2"></span>
                    <span class="ripple-ring r3"></span>
                </li>
                <li class="ripple-item">
                    <a href="#" class="ripple-link" data-tooltip="Contact">
                        <i class="fas fa-envelope"></i>
                        <span>Contact</span>
                    </a>
                    <span class="ripple-ring r1"></span>
                    <span class="ripple-ring r2"></span>
                    <span class="ripple-ring r3"></span>
                </li>
            </ul>
        </nav>

        <p style="margin-top: 2rem; font-size: 0.85rem; color: #64748b;">
            Hover · watch the ripples spread like water
        </p>
    </div>

    <!-- Embedded JavaScript -->
    <script>
        (function() {
            'use strict';

            const nav = document.getElementById('rippleNav');
            const items = document.querySelectorAll('.ripple-item');

            // Click feedback
            items.forEach(item => {
                const link = item.querySelector('.ripple-link');
                link.addEventListener('click', function(e) {
                    e.preventDefault();
                    item.classList.add('clicked');
                    setTimeout(() => {
                        item.classList.remove('clicked');
                    }, 300);
                    const label = this.querySelector('span')?.textContent || 'Item';
                    console.log(`💧 Ripple: ${label}`);
                });

                // Keyboard accessibility
                link.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        this.click();
                    }
                });
            });

            // Reset animation on hover
            nav.addEventListener('mouseenter', function() {
                const rings = this.querySelectorAll('.ripple-ring');
                rings.forEach(ring => {
                    ring.style.animation = 'none';
                    void ring.offsetWidth;
                    ring.style.animation = '';
                });
            });

            console.log('💧 Ripple nav initialized!');

        })();
    </script>

</body>
</html>
