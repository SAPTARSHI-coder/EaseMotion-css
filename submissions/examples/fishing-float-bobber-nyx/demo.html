<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fishing Float Bobber — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Fishing Float Bobber demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Fishing Float Bobber</h1>
      <p class="lede">Fishing bobber dipping then springing on a bite</p>
    </header>

    <section class="ease-fishing-float-bobber" data-demo="fishing-float-bobber" aria-live="polite">
      <div class="ease-fishing-float-bobber__housing">
        <div class="ease-fishing-float-bobber__bezel">
          <div class="ease-fishing-float-bobber__face">
            <div class="ease-fishing-float-bobber__readout">
              <span class="ease-fishing-float-bobber__label">Fishing Float Bobber</span>
              <span class="ease-fishing-float-bobber__value">LIVE</span>
            </div>
            <div class="ease-fishing-float-bobber__motion" aria-hidden="true">
              <span class="ease-fishing-float-bobber__a"></span>
              <span class="ease-fishing-float-bobber__b"></span>
              <span class="ease-fishing-float-bobber__c"></span>
              <span class="ease-fishing-float-bobber__d"></span>
            </div>
            <div class="ease-fishing-float-bobber__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-fishing-float-bobber__controls">
          <button type="button" class="ease-fishing-float-bobber__btn primary">Engage</button>
          <button type="button" class="ease-fishing-float-bobber__btn">Reset</button>
          <label class="ease-fishing-float-bobber__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-fishing-float-bobber__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
