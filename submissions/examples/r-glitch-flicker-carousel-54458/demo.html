<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Glitch-Flicker Carousel</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<section class="carousel">

    <h1>Creative Portfolio Carousel</h1>

    <div class="carousel-track">

        <article class="card">
            <img src="https://picsum.photos/400/280?21" alt="Brand Identity">
            <div class="card-content">
                <h2>Brand Identity</h2>
                <p>Create bold visual identities with modern branding systems.</p>
            </div>
        </article>

        <article class="card active">
            <img src="https://picsum.photos/400/280?22" alt="Creative UI">
            <div class="card-content">
                <h2>UI / UX Design</h2>
                <p>Craft responsive and engaging user experiences for every device.</p>
            </div>
        </article>

        <article class="card">
            <img src="https://picsum.photos/400/280?23" alt="Development">
            <div class="card-content">
                <h2>Web Development</h2>
                <p>Build lightweight portfolio websites using modern CSS techniques.</p>
            </div>
        </article>

    </div>

</section>

</body>
</html>
