<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Custom Animated Checkboxes and Radio Buttons</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>Custom Animated Form Controls</h1>
      <p>Accessible, CSS-only checkboxes and radio buttons with smooth animations.</p>
    </header>

    <div class="grid">
      <!-- Checkboxes -->
      <div class="card">
        <h2>Checkboxes</h2>
        
        <div class="control-group">
          <div class="control">
            <input type="checkbox" id="check-primary" class="custom-checkbox checkbox-primary" checked>
            <label for="check-primary">Primary Action</label>
          </div>
          
          <div class="control">
            <input type="checkbox" id="check-success" class="custom-checkbox checkbox-success">
            <label for="check-success">Success State</label>
          </div>
          
          <div class="control">
            <input type="checkbox" id="check-error" class="custom-checkbox checkbox-error">
            <label for="check-error">Error State</label>
          </div>
          
          <div class="control">
            <input type="checkbox" id="check-disabled" class="custom-checkbox checkbox-primary" disabled>
            <label for="check-disabled">Disabled Option</label>
          </div>
        </div>
      </div>

      <!-- Radio Buttons -->
      <div class="card">
        <h2>Radio Buttons</h2>
        
        <div class="control-group">
          <div class="control">
            <input type="radio" name="radio-group" id="radio-primary" class="custom-radio radio-primary" checked>
            <label for="radio-primary">Primary Option</label>
          </div>
          
          <div class="control">
            <input type="radio" name="radio-group" id="radio-success" class="custom-radio radio-success">
            <label for="radio-success">Success Option</label>
          </div>
          
          <div class="control">
            <input type="radio" name="radio-group" id="radio-error" class="custom-radio radio-error">
            <label for="radio-error">Error Option</label>
          </div>
          
          <div class="control">
            <input type="radio" name="radio-disabled" id="radio-disabled" class="custom-radio radio-primary" disabled>
            <label for="radio-disabled">Disabled Selection</label>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
