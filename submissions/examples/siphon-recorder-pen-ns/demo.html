<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Siphon Recorder Pen — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Siphon Recorder Pen demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Siphon Recorder Pen</h1>
      <p class="lede">Siphon recorder pen tracing the cable signal</p>
    </header>

    <section class="ease-siphon-recorder-pen" data-demo="siphon-recorder-pen" aria-live="polite">
      <div class="ease-siphon-recorder-pen__housing">
        <div class="ease-siphon-recorder-pen__bezel">
          <div class="ease-siphon-recorder-pen__face">
            <div class="ease-siphon-recorder-pen__readout">
              <span class="ease-siphon-recorder-pen__label">Siphon Recorder Pen</span>
              <span class="ease-siphon-recorder-pen__value">LIVE</span>
            </div>
            <div class="ease-siphon-recorder-pen__motion" aria-hidden="true">
              <span class="ease-siphon-recorder-pen__a"></span>
              <span class="ease-siphon-recorder-pen__b"></span>
              <span class="ease-siphon-recorder-pen__c"></span>
              <span class="ease-siphon-recorder-pen__d"></span>
            </div>
            <div class="ease-siphon-recorder-pen__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-siphon-recorder-pen__controls">
          <button type="button" class="ease-siphon-recorder-pen__btn primary">Trace</button>
          <button type="button" class="ease-siphon-recorder-pen__btn">Lift</button>
          <label class="ease-siphon-recorder-pen__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-siphon-recorder-pen__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
