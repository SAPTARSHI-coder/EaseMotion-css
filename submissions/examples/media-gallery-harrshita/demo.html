<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Media Gallery | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="demo-header">
    <h1>Expandable Media Gallery</h1>
    <p>Responsive media grid with hover scale animations and overlay captions.</p>
  </header>

  <main class="demo-main">
    <section class="demo-section">
      <div class="ease-gallery-grid">
        <div class="ease-gallery-item">
          <div class="ease-gallery-thumb">&#127756;</div>
          <div class="ease-gallery-caption">Galaxy Nebula</div>
        </div>
        <div class="ease-gallery-item">
          <div class="ease-gallery-thumb">&#127749;</div>
          <div class="ease-gallery-caption">Ocean Sunset</div>
        </div>
      </div>
    </section>
  </main>
  <footer class="demo-footer"><p>EaseMotion CSS Project</p></footer>
</body>
</html>
