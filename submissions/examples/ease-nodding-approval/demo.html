<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nodding Approval – Nods When Interacted With</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <h1>👍 Nodding Approval</h1>
    <p class="subtitle">Nods when you interact with it</p>

    <div class="nod-container">
      <div class="nod-stage" id="nodStage">
        <canvas id="canvas"></canvas>
        
        <!-- Nodding character -->
        <div class="nod-character" id="nodCharacter">
          <div class="character-body" id="characterBody">
            <div class="character-face">
              <div class="character-eyes" id="characterEyes">😊</div>
              <div class="character-mouth" id="characterMouth">👍</div>
            </div>
            <div class="character-hair" id="characterHair">💇</div>
          </div>
          <div class="character-shadow" id="characterShadow"></div>
          <div class="approval-sparkles" id="approvalSparkles"></div>
          <div class="character-label">👆 Click me!</div>
        </div>

        <!-- Info overlay -->
        <div class="info-overlay">
          <span class="nod-status" id="nodStatus">👍 Ready</span>
          <span class="nod-count" id="nodCount">✦ 0 nods</span>
        </div>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <button class="ctrl-btn toggle" id="toggleBtn">⏸ Pause</button>
      <button class="ctrl-btn reset" id="resetBtn">↺ Reset</button>
      <button class="ctrl-btn nod" id="nodBtn">👍 Nod</button>
    </div>

    <!-- Sliders -->
    <div class="slider-container">
      <span class="slider-label">Enthusiasm</span>
      <input type="range" id="intensitySlider" min="0" max="100" value="70" />
      <span class="slider-value" id="intensityValue">70%</span>
    </div>

    <div class="slider-container">
      <span class="slider-label">Nod Speed</span>
      <input type="range" id="speedSlider" min="1" max="10" value="5" />
      <span class="slider-value" id="speedValue">5×</span>
    </div>

    <div class="slider-container">
      <span class="slider-label">Color</span>
      <input type="range" id="colorSlider" min="0" max="360" value="220" />
      <span class="slider-value" id="colorValue">220°</span>
    </div>

    <!-- Status -->
    <div class="status" id="status">👍 Click the character to see it nod in approval!</div>

    <!-- Keyboard shortcuts -->
    <div class="shortcuts">
      <kbd>Click</kbd> Nod · <kbd>Space</kbd> Pause · <kbd>R</kbd> Reset · <kbd>N</kbd> Nod
    </div>
  </div>

  <script>
    (function() {
      "use strict";

      // DOM elements
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      const nodCharacter = document.getElementById('nodCharacter');
      const characterBody = document.getElementById('characterBody');
      const characterEyes = document.getElementById('characterEyes');
      const characterMouth = document.getElementById('characterMouth');
      const characterHair = document.getElementById('characterHair');
      const characterShadow = document.getElementById('characterShadow');
      const approvalSparkles = document.getElementById('approvalSparkles');
      const nodStatus = document.getElementById('nodStatus');
      const nodCount = document.getElementById('nodCount');
      const toggleBtn = document.getElementById('toggleBtn');
      const resetBtn = document.getElementById('resetBtn');
      const nodBtn = document.getElementById('nodBtn');
      const status = document.getElementById('status');
      const intensitySlider = document.getElementById('intensitySlider');
      const intensityValue = document.getElementById('intensityValue');
      const speedSlider = document.getElementById('speedSlider');
      const speedValue = document.getElementById('speedValue');
      const colorSlider = document.getElementById('colorSlider');
      const colorValue = document.getElementById('colorValue');

      // State
      let nodAngle = 0; // Current nod angle
      let targetAngle = 0;
      let nodVelocity = 0;
      let isNodding = false;
      let isPaused = false;
      let animationId = null;
      let time = 0;
      let nodCountVal = 0;
      let particles = [];
      let isHovering = false;

      // ----- Canvas setup -----
      function setupCanvas() {
        const rect = canvas.parentElement.getBoundingClientRect();
        const size = Math.min(rect.width - 40, 600);
        canvas.width = size;
        canvas.height = size;
        canvas.style.width = size + 'px';
        canvas.style.height = size + 'px';
      }

      // ----- Particle class -----
      class Particle {
        constructor(x, y, hue) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 0.3 + Math.random() * 1.2;
          this.x = x;
          this.y = y;
          this.vx = Math.cos(angle) * speed;
          this.vy = Math.sin(angle) * speed - 0.3;
          this.size = 1 + Math.random() * 3;
          this.life = 1;
          this.decay = 0.005 + Math.random() * 0.015;
          this.hue = hue + (Math.random() - 0.5) * 20;
          this.saturation = 80 + Math.random() * 20;
          this.lightness = 60 + Math.random() * 30;
          this.opacity = 0.3 + Math.random() * 0.5;
          this.gravity = 0.01;
          this.friction = 0.99;
          this.shape = Math.random() > 0.5 ? 'star' : 'circle';
        }

        update() {
          this.vx *= this.friction;
          this.vy *= this.friction;
          this.vy += this.gravity;
          this.x += this.vx;
          this.y += this.vy;
          this.life -= this.decay;
          this.size *= 0.999;
          return this.life > 0 && this.size > 0.1;
        }

        draw(ctx) {
          const alpha = this.life * this.opacity;
          const size = this.size * this.life;

          // Glow
          const gradient = ctx.createRadialGradient(
            this.x, this.y, 0,
            this.x, this.y, size * 3
          );
          gradient.addColorStop(0, `hsla(${this.hue + 20}, 100%, 90%, ${alpha * 0.2})`);
          gradient.addColorStop(1, `hsla(${this.hue}, 100%, 60%, 0)`);
          ctx.fillStyle = gradient;
          ctx.beginPath();
          ctx.arc(this.x, this.y, size * 3, 0, Math.PI * 2);
          ctx.fill();

          // Core
          ctx.fillStyle = `hsla(${this.hue + 30}, 100%, 95%, ${alpha * 0.9})`;
          
          if (this.shape === 'star') {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.scale(size / 5, size / 5);
            ctx.beginPath();
            for (let i = 0; i < 5; i++) {
              const angle = (i / 5) * Math.PI * 2 - Math.PI / 2;
              const r = i % 2 === 0 ? 5 : 2.5;
              const x = Math.cos(angle) * r;
              const y = Math.sin(angle) * r;
              if (i === 0) ctx.moveTo(x, y);
              else ctx.lineTo(x, y);
            }
            ctx.closePath();
            ctx.fill();
            ctx.restore();
          } else {
            ctx.beginPath();
            ctx.arc(this.x, this.y, size, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      }

      // ----- Create nod particles -----
      function createNodParticles(x, y, count = 15) {
        const hue = parseInt(colorSlider.value);
        for (let i = 0; i < count; i++) {
          particles.push(new Particle(x, y, hue));
        }
      }

      // ----- Update nod -----
      function updateNod() {
        const intensity = parseInt(intensitySlider.value) / 100;
        const speed = parseInt(speedSlider.value) / 5;
        const hue = parseInt(colorSlider.value);

        // Spring physics for nod
        const stiffness = 0.15 * speed;
        const damping = 0.85;

        // Target angle based on nod state
        const targetAngleRad = isNodding ? -0.3 * intensity : 0;

        // Spring force
        const force = (targetAngleRad - nodAngle) * stiffness;
        nodVelocity += force;
        nodVelocity *= damping;
        nodAngle += nodVelocity;

        // Clamp angle
        nodAngle = Math.max(-0.4, Math.min(0.1, nodAngle));

        // Apply rotation to character body
        characterBody.style.transform = `rotate(${nodAngle * 57.3}deg)`;
        characterBody.style.transition = 'transform 0.05s ease';

        // Shadow follows head movement
        characterShadow.style.transform = `translateX(-50%) scale(${0.8 + Math.abs(nodAngle) * 0.3})`;
        characterShadow.style.opacity = 0.1 + Math.abs(nodAngle) * 0.3;

        // Update face expression
        if (Math.abs(nodAngle) > 0.15) {
          characterEyes.textContent = '😊';
          characterMouth.textContent = '👍';
          nodStatus.textContent = '👍 Approving!';
        } else if (Math.abs(nodAngle) > 0.05) {
          characterEyes.textContent = '🙂';
          characterMouth.textContent = '👌';
          nodStatus.textContent = '👍 Nodding...';
        } else {
          characterEyes.textContent = '😊';
          characterMouth.textContent = '👍';
          nodStatus.textContent = '👍 Ready';
        }

        // Update sparkles
        approvalSparkles.style.opacity = Math.abs(nodAngle) * 3;

        // Update status
        if (Math.abs(nodAngle) > 0.1) {
          status.textContent = '👍 Nodding in approval!';
        } else {
          status.textContent = '👍 Click the character to see it nod in approval!';
        }

        // Create particles when nodding
        if (Math.abs(nodAngle) > 0.15 && Math.random() < 0.03) {
          const cx = canvas.width / 2;
          const cy = canvas.height / 2 - 10;
          createNodParticles(cx, cy, 2);
        }
      }

      // ----- Trigger nod -----
      function triggerNod() {
        if (isPaused) return;
        
        isNodding = true;
        nodCountVal++;
        nodCount.textContent = `✦ ${nodCountVal} nods`;
        
        // Create particles
        const cx = canvas.width / 2;
        const cy = canvas.height / 2 - 10;
        const count = 10 + Math.floor(parseInt(intensitySlider.value) / 100 * 15);
        createNodParticles(cx, cy, count);
        
        status.textContent = '👍 Nod!';
        
        // Auto-reset nod after a moment
        clearTimeout(window.nodTimer);
        window.nodTimer = setTimeout(() => {
          isNodding = false;
          if (!isPaused) {
            status.textContent = '👍 Click the character to see it nod in approval!';
          }
        }, 800);
      }

      // ----- Reset -----
      function resetNod() {
        isNodding = false;
        nodAngle = 0;
        nodVelocity = 0;
        particles = [];
        nodCountVal = 0;
        nodCount.textContent = '✦ 0 nods';
        nodStatus.textContent = '👍 Ready';
        status.textContent = '↺ Reset';
        characterBody.style.transform = 'rotate(0deg)';
        characterShadow.style.transform = 'translateX(-50%) scale(0.8)';
        characterShadow.style.opacity = '0.1';
        characterEyes.textContent = '😊';
        characterMouth.textContent = '👍';
        approvalSparkles.style.opacity = '0';
        intensitySlider.value = 70;
        intensityValue.textContent = '70%';
        speedSlider.value = 5;
        speedValue.textContent = '5×';
        colorSlider.value = 220;
        colorValue.textContent = '220°';
        setTimeout(() => {
          status.textContent = '👍 Click the character to see it nod in approval!';
        }, 500);
      }

      // ----- Toggle pause -----
      function togglePause() {
        isPaused = !isPaused;
        toggleBtn.textContent = isPaused ? '▶ Play' : '⏸ Pause';
        status.textContent = isPaused ? '⏸ Paused' : '▶ Resumed';
        nodStatus.textContent = isPaused ? '⏸ Paused' : '👍 Ready';
      }

      // ----- Draw background -----
      function drawBackground() {
        const w = canvas.width;
        const h = canvas.height;
        const cx = w / 2;
        const cy = h / 2;
        const hue = parseInt(colorSlider.value);

        // Background
        const bgGradient = ctx.createRadialGradient(cx, cy, 0, cx, cy, w * 0.7);
        bgGradient.addColorStop(0, '#0a0a1a');
        bgGradient.addColorStop(0.5, '#060612');
        bgGradient.addColorStop(1, '#020208');
        ctx.fillStyle = bgGradient;
        ctx.fillRect(0, 0, w, h);

        // Ambient glow
        const glowAlpha = 0.02 + Math.abs(nodAngle) * 0.05;
        const glowGrad = ctx.createRadialGradient(cx, cy + 10, 0, cx, cy + 10, w * 0.3);
        glowGrad.addColorStop(0, `hsla(${hue + 20}, 100%, 80%, ${glowAlpha})`);
        glowGrad.addColorStop(1, `hsla(${hue + 20}, 100%, 60%, 0)`);
        ctx.fillStyle = glowGrad;
        ctx.beginPath();
        ctx.arc(cx, cy + 10, w * 0.3, 0, Math.PI * 2);
        ctx.fill();

        // Draw particles
        if (!isPaused) {
          particles = particles.filter(p => p.update());
        }
        particles.forEach(p => p.draw(ctx));

        // Draw approval thumbs up around character
        if (Math.abs(nodAngle) > 0.1) {
          const count = Math.floor(2 + Math.abs(nodAngle) * 8);
          for (let i = 0; i < count; i++) {
            const angle = (i / count) * Math.PI * 2 + time * 0.02 * (i % 2 === 0 ? 1 : -1);
            const radius = 50 + Math.abs(nodAngle) * 60 + Math.sin(time * 0.3 + i) * 10;
            const x = cx + Math.cos(angle) * radius;
            const y = cy + Math.sin(angle) * radius - 5;
            const size = 14 + Math.abs(nodAngle) * 12;
            const alpha = 0.1 + Math.abs(nodAngle) * 0.3 * (0.5 + 0.5 * Math.sin(time * 0.2 + i * 0.5));

            ctx.fillStyle = `hsla(${hue + 20}, 100%, 80%, ${alpha})`;
            ctx.font = `${size}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('👍', x, y);
          }
        }

        // Update nod
        if (!isPaused) {
          updateNod();
        }

        // Update count
        nodCount.textContent = `✦ ${nodCountVal} nods`;
      }

      // ----- Animation loop -----
      function animate() {
        time += 0.016;
        drawBackground();
        animationId = requestAnimationFrame(animate);
      }

      // ----- Start animation -----
      function startAnimation() {
        if (animationId) {
          cancelAnimationFrame(animationId);
        }
        animate();
      }

      // ----- Event Listeners -----
      // Click to nod
      nodCharacter.addEventListener('click', (e) => {
        e.stopPropagation();
        triggerNod();
      });

      // Hover effects
      nodCharacter.addEventListener('mouseenter', () => {
        isHovering = true;
        nodCharacter.style.transform = 'scale(1.02)';
      });

      nodCharacter.addEventListener('mouseleave', () => {
        isHovering = false;
        nodCharacter.style.transform = 'scale(1)';
      });

      // Touch support
      nodCharacter.addEventListener('touchstart', (e) => {
        e.preventDefault();
        triggerNod();
        nodCharacter.style.transform = 'scale(0.95)';
        setTimeout(() => {
          nodCharacter.style.transform = 'scale(1)';
        }, 200);
      });

      // Buttons
      toggleBtn.addEventListener('click', togglePause);
      resetBtn.addEventListener('click', resetNod);
      nodBtn.addEventListener('click', triggerNod);

      // Sliders
      intensitySlider.addEventListener('input', (e) => {
        intensityValue.textContent = e.target.value + '%';
      });

      speedSlider.addEventListener('input', (e) => {
        speedValue.textContent = e.target.value + '×';
      });

      colorSlider.addEventListener('input', (e) => {
        colorValue.textContent = e.target.value + '°';
        particles.forEach(p => {
          p.hue = parseInt(e.target.value) + (Math.random() - 0.5) * 20;
        });
      });

      // Keyboard shortcuts
      document.addEventListener('keydown', (e) => {
        if (e.key === ' ' || e.key === 'Space') {
          e.preventDefault();
          togglePause();
        }
        if (e.key === 'r' || e.key === 'R') {
          e.preventDefault();
          resetNod();
        }
        if (e.key === 'n' || e.key === 'N') {
          e.preventDefault();
          triggerNod();
        }
      });

      // Click canvas to nod
      canvas.addEventListener('click', triggerNod);

      // ----- Resize handler -----
      let resizeTimeout;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(() => {
          setupCanvas();
        }, 200);
      });

      // ----- Init -----
      function init() {
        setupCanvas();
        startAnimation();
        status.textContent = '👍 Click the character to see it nod in approval!';
        // Start with a slight nod to show off
        setTimeout(() => {
          triggerNod();
        }, 500);
        // Center character
        const rect = canvas.getBoundingClientRect();
        const cx = canvas.width / 2;
        const cy = canvas.height / 2;
        nodCharacter.style.left = (cx - 50) + 'px';
        nodCharacter.style.top = (cy - 45) + 'px';
        // Initial shadow
        characterShadow.style.transform = 'translateX(-50%) scale(0.8)';
        characterShadow.style.opacity = '0.1';
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }

    })();
  </script>
</body>
</html>
