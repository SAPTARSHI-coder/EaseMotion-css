<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wave Tank Ripple — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Wave Tank Ripple demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Wave Tank Ripple</h1>
      <p class="lede">Wave tank generating expanding water ripples</p>
    </header>

    <section class="ease-wave-tank-ripple" data-demo="wave-tank-ripple" aria-live="polite">
      <div class="ease-wave-tank-ripple__housing">
        <div class="ease-wave-tank-ripple__bezel">
          <div class="ease-wave-tank-ripple__face">
            <div class="ease-wave-tank-ripple__readout">
              <span class="ease-wave-tank-ripple__label">Wave Tank Ripple</span>
              <span class="ease-wave-tank-ripple__value" id="val-wave-tank-ripple">READY</span>
            </div>
            <div class="ease-wave-tank-ripple__motion" aria-hidden="true">
              <span class="ease-wave-tank-ripple__arm"></span>
              <span class="ease-wave-tank-ripple__core"></span>
              <span class="ease-wave-tank-ripple__trail"></span>
              <span class="ease-wave-tank-ripple__mark m1"></span>
              <span class="ease-wave-tank-ripple__mark m2"></span>
              <span class="ease-wave-tank-ripple__mark m3"></span>
            </div>
            <div class="ease-wave-tank-ripple__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-wave-tank-ripple__controls">
          <button type="button" class="ease-wave-tank-ripple__btn primary">Engage</button>
          <button type="button" class="ease-wave-tank-ripple__btn">Reset</button>
          <label class="ease-wave-tank-ripple__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-wave-tank-ripple__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
