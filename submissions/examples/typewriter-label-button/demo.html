<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="CSS-only typewriter label buttons with hover and focus animations."
  >

  <title>Typewriter Label Button</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="demo">
    <section
      class="demo-card"
      aria-labelledby="demo-title"
    >
      <p class="eyebrow">EaseMotion CSS</p>

      <h1 id="demo-title">Typewriter Label Button</h1>

      <p class="description">
        A CSS-only button whose label reveals itself with a smooth
        typewriter animation on hover or keyboard focus.
      </p>

      <div class="button-group">

        <button class="typewriter-btn" type="button">
          <span
            class="typewriter-label"
            aria-hidden="true"
          >
            Explore
          </span>

          <span class="sr-only">
            Explore
          </span>
        </button>

        <button class="typewriter-btn typewriter-btn--accent" type="button">
          <span
            class="typewriter-label"
            aria-hidden="true"
          >
            Get Started
          </span>

          <span class="sr-only">
            Get Started
          </span>
        </button>

        <button class="typewriter-btn typewriter-btn--dark" type="button">
          <span
            class="typewriter-label"
            aria-hidden="true"
          >
            Learn More
          </span>

          <span class="sr-only">
            Learn More
          </span>
        </button>

      </div>
    </section>
  </main>

</body>
</html>
