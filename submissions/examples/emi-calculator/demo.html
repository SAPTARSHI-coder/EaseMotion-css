<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS EMI Calculator</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

<main class="container">

  <section class="emi-card" aria-label="EMI Calculator">

    <h1>EMI Calculator</h1>
    <p class="subtitle">
      Estimate your monthly loan payment
    </p>

    <div class="input-group">
      <label for="loan">Loan Amount</label>
      <input 
        id="loan"
        type="range"
        min="10000"
        max="1000000"
        value="500000"
      />
      <span>₹5,00,000</span>
    </div>


    <div class="input-group">
      <label for="rate">Interest Rate</label>
      <input 
        id="rate"
        type="range"
        min="1"
        max="20"
        value="8"
      />
      <span>8%</span>
    </div>


    <div class="input-group">
      <label for="time">Loan Duration</label>
      <input 
        id="time"
        type="range"
        min="1"
        max="30"
        value="5"
      />
      <span>5 Years</span>
    </div>


    <div class="result">
      <h2>Monthly EMI</h2>
      <p>₹10,138</p>
    </div>


    <div class="details">
      <div>
        <span>Total Interest</span>
        <strong>₹1,08,280</strong>
      </div>

      <div>
        <span>Total Payment</span>
        <strong>₹6,08,280</strong>
      </div>
    </div>

  </section>

</main>

</body>
</html>
