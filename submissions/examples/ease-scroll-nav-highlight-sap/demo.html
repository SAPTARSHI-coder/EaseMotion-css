<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scroll Nav Highlight</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="topnav" aria-label="Section navigation">
    <div class="nav-inner">
      <a href="#one" class="nav-link is-active" data-target="one">One</a>
      <a href="#two" class="nav-link" data-target="two">Two</a>
      <a href="#three" class="nav-link" data-target="three">Three</a>
      <span class="nav-pill" id="navPill"></span>
    </div>
  </nav>

  <main class="content">
    <section id="one" class="block"><h2>Section One</h2><p>Scroll down — the top nav pill glides to the active link.</p></section>
    <section id="two" class="block"><h2>Section Two</h2><p>Filler content.</p></section>
    <section id="three" class="block"><h2>Section Three</h2><p>Filler content.</p></section>
  </main>

  <script>
    const links = Array.from(document.querySelectorAll('.nav-link'));
    const pill = document.getElementById('navPill');
    const sections = document.querySelectorAll('.content section');

    function movePill(link) {
      pill.style.width = link.offsetWidth + 'px';
      pill.style.transform = `translateX(${link.offsetLeft}px)`;
    }

    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          const link = document.querySelector(`.nav-link[data-target="${entry.target.id}"]`);
          links.forEach(l => l.classList.remove('is-active'));
          link.classList.add('is-active');
          movePill(link);
        }
      });
    }, { rootMargin: '-45% 0px -45% 0px' });

    sections.forEach(s => observer.observe(s));
    window.addEventListener('load', () => movePill(document.querySelector('.nav-link.is-active')));
  </script>
</body>
</html>
