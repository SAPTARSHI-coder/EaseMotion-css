<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Void Dial</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="page">

    <header class="intro">

      <span class="eyebrow">
        SPATIAL INSTRUMENT // 09
      </span>

      <h1>
        Void <span>Dial</span>
      </h1>

      <p>
        A radial instrument that responds to your position in space.
      </p>

    </header>


    <section
      class="dial-stage"
      id="dialStage"
      aria-label="Interactive Void Dial"
    >

      <div class="ambient-light"></div>


      <div class="dial">

        <!-- Outer ring -->
        <div
          class="ring ring-outer"
          data-speed="0.25"
        >

          <div class="outer-ticks"></div>

          <span class="label label-n">N</span>
          <span class="label label-e">E</span>
          <span class="label label-s">S</span>
          <span class="label label-w">W</span>

        </div>


        <!-- Second ring -->
        <div
          class="ring ring-second"
          data-speed="-0.45"
        >

          <div class="arc arc-a"></div>
          <div class="arc arc-b"></div>
          <div class="arc arc-c"></div>

        </div>


        <!-- Third ring -->
        <div
          class="ring ring-third"
          data-speed="0.75"
        >

          <div class="inner-ticks"></div>

        </div>


        <!-- Orbit markers -->
        <div
          class="markers"
          data-speed="-1"
        >

          <span class="marker marker-1"></span>
          <span class="marker marker-2"></span>
          <span class="marker marker-3"></span>
          <span class="marker marker-4"></span>
          <span class="marker marker-5"></span>
          <span class="marker marker-6"></span>

        </div>


        <!-- Central aperture -->
        <div
          class="aperture"
          id="aperture"
        >

          <div class="aperture-inner"></div>

          <div class="aperture-core"></div>

        </div>


        <!-- Pointer ray -->
        <div
          class="pointer-ray"
          id="pointerRay"
        ></div>


        <!-- Coordinates -->
        <div class="coordinates">

          <span>
            X
            <strong id="coordX">00.0</strong>
          </span>

          <span>
            Y
            <strong id="coordY">00.0</strong>
          </span>

          <span>
            θ
            <strong id="angle">000°</strong>
          </span>

        </div>

      </div>


      <div class="dial-status">

        <span class="status-dot"></span>

        <span>VECTOR LOCK</span>

      </div>


      <div class="instruction">

        <span></span>

        Navigate the void

      </div>

    </section>

  </main>


  <script>

    const stage =
      document.getElementById("dialStage");

    const rings =
      document.querySelectorAll(".ring");

    const markers =
      document.querySelector(".markers");

    const aperture =
      document.getElementById("aperture");

    const pointerRay =
      document.getElementById("pointerRay");

    const coordX =
      document.getElementById("coordX");

    const coordY =
      document.getElementById("coordY");

    const angleOutput =
      document.getElementById("angle");


    let targetX = 0;
    let targetY = 0;

    let currentX = 0;
    let currentY = 0;

    let rotation = 0;

    let active = false;


    function updatePointer(event) {

      const rect =
        stage.getBoundingClientRect();

      const x =
        (event.clientX - rect.left) /
        rect.width;

      const y =
        (event.clientY - rect.top) /
        rect.height;

      targetX =
        (x - 0.5) * 2;

      targetY =
        (y - 0.5) * 2;

      targetX =
        Math.max(
          -1,
          Math.min(1, targetX)
        );

      targetY =
        Math.max(
          -1,
          Math.min(1, targetY)
        );

      active = true;

    }


    stage.addEventListener(
      "pointermove",
      updatePointer
    );


    stage.addEventListener(
      "pointerenter",
      () => {
        active = true;
      }
    );


    stage.addEventListener(
      "pointerleave",
      () => {
        active = false;
      }
    );


    function animate() {

      if (!active) {

        targetX *= 0.96;
        targetY *= 0.96;

      }


      currentX +=
        (targetX - currentX) * 0.075;

      currentY +=
        (targetY - currentY) * 0.075;


      rotation += 0.12;


      rings.forEach(ring => {

        const speed =
          parseFloat(
            ring.dataset.speed
          );

        const pointerInfluence =
          currentX * 9;

        const ringRotation =
          rotation * speed +
          pointerInfluence;

        ring.style.transform =
          `translate(-50%, -50%)
           rotate(${ringRotation}deg)`;

      });


      markers.style.transform =
        `translate(-50%, -50%)
         rotate(${
           rotation * -0.7 +
           currentY * 12
         }deg)`;


      const apertureX =
        currentX * 24;

      const apertureY =
        currentY * 24;


      aperture.style.transform =
        `translate(
          calc(-50% + ${apertureX}px),
          calc(-50% + ${apertureY}px)
        )`;


      const angle =
        Math.atan2(
          currentY,
          currentX
        ) *
        (180 / Math.PI);


      const normalizedAngle =
        (angle + 360) % 360;


      pointerRay.style.transform =
        `rotate(${normalizedAngle}deg)`;


      coordX.textContent =
        (currentX * 100)
          .toFixed(1)
          .padStart(4, "0");

      coordY.textContent =
        (currentY * 100)
          .toFixed(1)
          .padStart(4, "0");

      angleOutput.textContent =
        `${Math.round(normalizedAngle)
          .toString()
          .padStart(3, "0")}°`;


      stage.style.setProperty(
        "--light-x",
        `${50 + currentX * 35}%`
      );

      stage.style.setProperty(
        "--light-y",
        `${50 + currentY * 35}%`
      );


      stage.style.setProperty(
        "--focus-strength",
        `${Math.abs(currentX) +
          Math.abs(currentY)}`
      );


      requestAnimationFrame(
        animate
      );

    }


    animate();

  </script>

</body>

</html>
