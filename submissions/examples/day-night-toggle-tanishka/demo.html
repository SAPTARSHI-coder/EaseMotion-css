<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="A pure CSS day and night scene toggle."
  >

  <title>Day / Night Toggle</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="demo">
    <section class="scene-card" aria-labelledby="title">
      <div class="scene" id="scene">
        <div class="stars" aria-hidden="true"></div>
        <div class="cloud cloud-one" aria-hidden="true"></div>
        <div class="cloud cloud-two" aria-hidden="true"></div>

        <div class="sun" aria-hidden="true"></div>
        <div class="moon" aria-hidden="true"></div>

        <div class="hill hill-back" aria-hidden="true"></div>
        <div class="hill hill-front" aria-hidden="true"></div>

        <div class="ground" aria-hidden="true"></div>

        <div class="scene-content">
          <p class="eyebrow">TOGGLE / SCENE</p>
          <h1 id="title">Day / Night</h1>
          <p class="description">
            Switch the entire atmosphere between a bright sunlit day
            and a quiet starry night.
          </p>
        </div>

        <button
          class="theme-toggle"
          id="themeToggle"
          type="button"
          aria-label="Switch to night mode"
          aria-pressed="false"
        >
          <span class="toggle-track">
            <span class="toggle-thumb">
              <span class="thumb-sun" aria-hidden="true"></span>
              <span class="thumb-moon" aria-hidden="true"></span>
            </span>
          </span>

          <span class="toggle-label" id="toggleLabel">DAY</span>
        </button>
      </div>
    </section>
  </main>

  <script>
    const scene = document.querySelector('#scene');
    const toggle = document.querySelector('#themeToggle');
    const label = document.querySelector('#toggleLabel');

    toggle.addEventListener('click', () => {
      const isNight = scene.classList.toggle('is-night');

      toggle.setAttribute('aria-pressed', String(isNight));
      toggle.setAttribute(
        'aria-label',
        isNight ? 'Switch to day mode' : 'Switch to night mode'
      );

      label.textContent = isNight ? 'NIGHT' : 'DAY';
    });
  </script>
</body>
</html>
