<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ease-card-accordion-image-sap demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { height: 100vh; margin: 0; display: flex; align-items: center; justify-content: center; background: #f4f4f5; }
  </style>
</head>
<body>
  <div class="img-accordion-sap" id="accordion">
    <div class="acc-panel expanded">
      <img src="https://images.unsplash.com/photo-1519681393784-d120267933ba?w=500" alt="Mountains">
      <span class="acc-label">Mountains</span>
    </div>
    <div class="acc-panel">
      <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=500" alt="Beach">
      <span class="acc-label">Beach</span>
    </div>
    <div class="acc-panel">
      <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=500" alt="Forest">
      <span class="acc-label">Forest</span>
    </div>
    <div class="acc-panel">
      <img src="https://images.unsplash.com/photo-1449824913935-59a10b8d2000?w=500" alt="Desert">
      <span class="acc-label">Desert</span>
    </div>
  </div>
  <script>
    const panels = document.querySelectorAll('.acc-panel');
    panels.forEach(panel => {
      panel.addEventListener('mouseenter', () => {
        panels.forEach(p => p.classList.remove('expanded'));
        panel.classList.add('expanded');
      });
    });
  </script>
</body>
</html>
