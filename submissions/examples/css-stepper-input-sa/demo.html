<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>[FEATURE] CSS Stepper Input</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<main class="em-css-stepper-input-wrap">
  <label style="font-family:system-ui;display:block;margin-bottom:.5rem">Quantity</label>
  <div class="em-css-stepper-input">
    <button type="button" aria-label="decrease">−</button>
    <input type="text" value="1" readonly />
    <button type="button" aria-label="increase">+</button>
  </div>
</main>
</body>
</html>
