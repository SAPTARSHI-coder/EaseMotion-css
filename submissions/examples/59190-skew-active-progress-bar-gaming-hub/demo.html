<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skew Active Progress Bar</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<section class="progress-section">

<h1>Gaming Mission Progress</h1>
<p>Complete challenges to unlock exclusive rewards.</p>

<div class="progress-card">

<div class="progress-info">
<span>Battle Pass</span>
<span>72%</span>
</div>

<div class="progress-bar">
<div class="progress-fill"></div>
</div>

</div>

<div class="progress-card">

<div class="progress-info">
<span>Season Rank</span>
<span>90%</span>
</div>

<div class="progress-bar">
<div class="progress-fill second"></div>
</div>

</div>

<div class="progress-card">

<div class="progress-info">
<span>Weapon Mastery</span>
<span>58%</span>
</div>

<div class="progress-bar">
<div class="progress-fill third"></div>
</div>

</div>

</section>

</body>
</html>
