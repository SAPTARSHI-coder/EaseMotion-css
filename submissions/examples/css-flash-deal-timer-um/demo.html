<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Flash Deal Timer - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Product Card Component -->
  <article class="product-card" role="region" aria-label="Flash Deal Product Card">
    
    <!-- Image -->
    <div class="product-img" aria-hidden="true">
      <span class="deal-tag">Flash Deal</span>
    </div>

    <!-- Product Details -->
    <div class="product-info">
      <h1 class="product-title">Vector Core Engine</h1>
      <div class="product-price">$149.00 <span>$299.00</span></div>
    </div>

    <!-- Countdown Timer (alert status for screen-reader) -->
    <div class="timer-box" role="status" aria-live="polite" aria-label="Flash deal ends in 2 hours, 14 minutes">
      <span class="timer-label">Ends In</span>
      
      <div class="countdown-digits">
        
        <!-- Hours -->
        <div class="digit-container">
          <div class="digit-item">0</div>
        </div>
        <div class="digit-container">
          <div class="digit-item">2</div>
        </div>

        <span>:</span>

        <!-- Minutes Tens -->
        <div class="digit-container">
          <div class="digit-strip anim-min-tens">
            <div class="digit-item">5</div>
            <div class="digit-item">4</div>
            <div class="digit-item">3</div>
            <div class="digit-item">2</div>
            <div class="digit-item">1</div>
            <div class="digit-item">0</div>
          </div>
        </div>
        <!-- Minutes Unit -->
        <div class="digit-container">
          <div class="digit-strip anim-min-unit">
            <div class="digit-item">9</div>
            <div class="digit-item">8</div>
            <div class="digit-item">7</div>
            <div class="digit-item">6</div>
            <div class="digit-item">5</div>
            <div class="digit-item">4</div>
            <div class="digit-item">3</div>
            <div class="digit-item">2</div>
            <div class="digit-item">1</div>
            <div class="digit-item">0</div>
          </div>
        </div>

        <span>:</span>

        <!-- Seconds Tens -->
        <div class="digit-container">
          <div class="digit-strip anim-sec-tens">
            <div class="digit-item">5</div>
            <div class="digit-item">4</div>
            <div class="digit-item">3</div>
            <div class="digit-item">2</div>
            <div class="digit-item">1</div>
            <div class="digit-item">0</div>
          </div>
        </div>
        <!-- Seconds Unit -->
        <div class="digit-container">
          <div class="digit-strip anim-sec-unit">
            <div class="digit-item">9</div>
            <div class="digit-item">8</div>
            <div class="digit-item">7</div>
            <div class="digit-item">6</div>
            <div class="digit-item">5</div>
            <div class="digit-item">4</div>
            <div class="digit-item">3</div>
            <div class="digit-item">2</div>
            <div class="digit-item">1</div>
            <div class="digit-item">0</div>
          </div>
        </div>

      </div>

    </div>

    <a href="#" class="btn-buy" aria-label="Claim deal and buy Vector Core Engine">Claim Deal</a>

  </article>

</body>
</html>
