<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Read Repair Anti Entropy</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="repair-shell" aria-labelledby="repair-title">
    <section class="repair-board">
      <p class="eyebrow">Replica convergence</p>
      <h1 id="repair-title">Read Repair Anti Entropy</h1>
      <p class="summary">Digest mismatches pulse across replicas until read repair streams reconcile stale rows and restore convergence.</p>
      <div class="repair-stage" role="img" aria-label="Animated read repair anti entropy visualization">
        <div class="replica stale"><strong>R1</strong><span></span><span></span><span></span></div>
        <div class="digest-ring"><i></i><i></i><b>digest</b></div>
        <div class="replica fresh"><strong>R2</strong><span></span><span></span><span></span></div>
        <div class="repair-stream"><em></em><em></em><em></em><small>repair</small></div>
        <div class="replica healed"><strong>R3</strong><span></span><span></span><span></span></div>
      </div>
      <div class="readouts"><span>quorum 2/3</span><span>mismatch found</span><span>repair sent</span></div>
    </section>
  </main>
</body>
</html>
