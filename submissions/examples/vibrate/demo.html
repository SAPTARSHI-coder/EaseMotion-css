<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vibrate Micro-Interaction Demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background-color: #fafaf9;
      gap: 3rem;
    }
    .demo-container {
      display: flex;
      gap: 3rem;
    }
    .input-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }
    input {
      padding: 0.75rem 1rem;
      font-size: 1rem;
      border: 2px solid #ef4444;
      border-radius: 6px;
      outline: none;
      width: 200px;
      background: #fef2f2;
      color: #7f1d1d;
    }
    .btn {
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      background: #3b82f6;
      color: white;
      cursor: pointer;
    }
    .error-text {
      color: #ef4444;
      font-size: 0.875rem;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="demo-container">
    <div class="input-group">
      <input type="text" id="demo-input" class="vibrate-1-ag" value="Invalid Username" readonly>
      <span class="error-text">Vibrate 1 (Light)</span>
    </div>

    <div class="input-group">
      <button id="demo-btn" class="btn vibrate-2-ag">EMERGENCY STOP</button>
      <span class="error-text">Vibrate 2 (Intense)</span>
    </div>
  </div>

  <button class="btn" style="background: #475569;" onclick="replay()">Trigger Validation</button>

  <script>
    function replay() {
      const input = document.getElementById('demo-input');
      const btn = document.getElementById('demo-btn');
      
      input.classList.remove('vibrate-1-ag');
      btn.classList.remove('vibrate-2-ag');
      
      void input.offsetWidth; // trigger reflow
      void btn.offsetWidth;
      
      input.classList.add('vibrate-1-ag');
      btn.classList.add('vibrate-2-ag');
      
      // Stop the animation after 0.9s (3 iterations) to simulate a real validation error flash
      setTimeout(() => {
        input.classList.remove('vibrate-1-ag');
        btn.classList.remove('vibrate-2-ag');
      }, 900);
    }
    
    // Stop initial animation after 0.9s
    setTimeout(() => {
      document.getElementById('demo-input').classList.remove('vibrate-1-ag');
      document.getElementById('demo-btn').classList.remove('vibrate-2-ag');
    }, 900);
  </script>
</body>
</html>
