<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <meta
    name="description"
    content="CSS scale up on hover interactive demo"
  >
  <title>CSS Scale Up on Hover</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">
    <section class="hero" aria-labelledby="title">

      <p class="eyebrow">EaseMotion CSS</p>

      <h1 id="title">Scale Up on Hover</h1>

      <p class="intro">
        A smooth CSS-only interaction that scales cards on hover
        and keyboard focus while adding a soft shadow.
      </p>

      <div class="cards">

        <a
          class="scale-card"
          href="#scale-demo"
          aria-label="Explore the scale up card"
        >
          <span class="icon" aria-hidden="true">✦</span>

          <span class="content">
            <span class="card-title">Scale Up</span>
            <span class="card-text">
              Hover or focus this card
            </span>
          </span>

          <span class="arrow" aria-hidden="true">→</span>
        </a>

        <a
          class="scale-card cyan"
          href="#scale-demo"
          aria-label="Explore smooth motion"
        >
          <span class="icon" aria-hidden="true">◆</span>

          <span class="content">
            <span class="card-title">Smooth Motion</span>
            <span class="card-text">
              Built entirely with CSS
            </span>
          </span>

          <span class="arrow" aria-hidden="true">→</span>
        </a>

        <a
          class="scale-card pink"
          href="#scale-demo"
          aria-label="Explore responsive interaction"
        >
          <span class="icon" aria-hidden="true">●</span>

          <span class="content">
            <span class="card-title">Responsive</span>
            <span class="card-text">
              Designed for every screen
            </span>
          </span>

          <span class="arrow" aria-hidden="true">→</span>
        </a>

      </div>

    </section>
  </main>

</body>
</html>
