<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Data Stream - EaseMotion CSS</title>
    <!-- Include EaseMotion Core Stylesheet -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030712; color: #ffffff;">

    <div class="ease-card ease-card-glass stream-container">
        <div class="stream-header">
            <h2>Data Stream</h2>
            <span class="ease-badge ease-badge-success">Live</span>
        </div>
        
        <div class="stream-screen ease-center">
            <div class="data-packet p-1">01101001</div>
            <div class="data-packet p-2">11010010</div>
            <div class="data-packet p-3">10101101</div>
            <div class="stream-core ease-center"></div>
        </div>

        <div class="stream-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Throughput: 4.2 GB/s</span>
            <button class="ease-btn ease-btn-primary ease-btn-sm ease-hover-grow">Flush</button>
        </div>
    </div>

</body>
</html>
