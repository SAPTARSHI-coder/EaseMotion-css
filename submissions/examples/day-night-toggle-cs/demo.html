<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Day Night Toggle — EaseMotion CSS</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="page">
        <section class="scene" aria-labelledby="scene-title">
            <input class="theme-toggle" type="checkbox" id="day-night" aria-label="Toggle between day and night">

            <div class="sky">
                <div class="stars" aria-hidden="true">
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                </div>

                <div class="sun" aria-hidden="true"></div>
                <div class="moon" aria-hidden="true"></div>

                <div class="cloud cloud-one" aria-hidden="true">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>

                <div class="cloud cloud-two" aria-hidden="true">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>

                <div class="hills" aria-hidden="true">
                    <div class="hill hill-back"></div>
                    <div class="hill hill-front"></div>
                </div>

                <div class="ground" aria-hidden="true"></div>
            </div>

            <div class="content">
                <p class="eyebrow">EaseMotion CSS · Toggle</p>

                <h1 id="scene-title">Daylight</h1>

                <p class="description">
                    Switch between a warm sunlit morning and a calm starry night.
                </p>

                <label class="switch" for="day-night">
                    <span class="switch-track">
                        <span class="switch-thumb" aria-hidden="true">
                            <span class="thumb-sun"></span>
                            <span class="thumb-moon"></span>
                        </span>
                    </span>

                    <span class="switch-label">
                        <span class="day-label">Day</span>
                        <span class="night-label">Night</span>
                    </span>
                </label>
            </div>
        </section>
    </main>
</body>

</html>
