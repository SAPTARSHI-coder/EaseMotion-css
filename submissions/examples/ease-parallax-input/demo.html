<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parallax Input Field - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="ease-parallax-wrapper">
    <div class="ease-input-group">
      <input type="text" id="parallax-email" class="ease-input" placeholder="Email Address" autocomplete="off">
      <label for="parallax-email" class="ease-label">Email Address</label>
      <div class="ease-underline"></div>
    </div>
  </div>
  <p style="position: absolute; bottom: 2rem; color: #64748b; font-size: 0.875rem; text-transform: uppercase; letter-spacing: 1px;">Focus the input to trigger 3D parallax</p>
</body>
</html>
