<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glass Pricing Cards - EaseMotion CSS</title>
    <!-- EaseMotion CSS CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="ease-center pricing-bg">
    
    <!-- Using EaseMotion Grid Utilities -->
    <div class="ease-grid ease-grid-cols-3 ease-gap-6 pricing-grid">
        
        <!-- Basic Card -->
        <div class="ease-card glass-card ease-slide-up ease-delay-100 ease-hover-lift">
            <h3 class="ease-fade-in">Basic</h3>
            <div class="price">$9<span>/mo</span></div>
            <ul class="features ease-fade-in ease-delay-200">
                <li>✔ 5 Projects</li>
                <li>✔ 10GB Storage</li>
                <li>✔ Basic Support</li>
            </ul>
            <button class="ease-btn glass-btn ease-hover-grow">Choose Plan</button>
        </div>

        <!-- Pro Card (Featured) -->
        <div class="ease-card glass-card pro-card ease-slide-up ease-delay-200 ease-hover-lift ease-hover-glow">
            <span class="badge ease-fade-in">Popular</span>
            <h3 class="ease-fade-in">Pro</h3>
            <div class="price">$29<span>/mo</span></div>
            <ul class="features ease-fade-in ease-delay-300">
                <li>✔ Unlimited Projects</li>
                <li>✔ 100GB Storage</li>
                <li>✔ Priority Support</li>
                <li>✔ API Access</li>
            </ul>
            <button class="ease-btn ease-btn-primary glass-btn-pro ease-hover-grow">Choose Plan</button>
        </div>

        <!-- Enterprise Card -->
        <div class="ease-card glass-card ease-slide-up ease-delay-300 ease-hover-lift">
            <h3 class="ease-fade-in">Enterprise</h3>
            <div class="price">$99<span>/mo</span></div>
            <ul class="features ease-fade-in ease-delay-400">
                <li>✔ Custom Solutions</li>
                <li>✔ 1TB Storage</li>
                <li>✔ 24/7 Dedicated Support</li>
            </ul>
            <button class="ease-btn glass-btn ease-hover-grow">Contact Sales</button>
        </div>

    </div>

</body>
</html>
