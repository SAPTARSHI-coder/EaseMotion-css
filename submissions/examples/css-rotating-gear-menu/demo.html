<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Rotating Gear Menu | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <article class="demo-card">
      <header class="card-header">
        <h1 class="card-title">Preferences</h1>
        
        <!-- Pure CSS Checkbox Toggle Controller -->
        <input type="checkbox" id="gear-toggle" class="menu-toggle-input" aria-expanded="false" aria-controls="gear-settings-menu">
        <label for="gear-toggle" class="gear-trigger" title="Toggle Settings Menu" aria-label="Toggle Settings Menu">
          <svg class="gear-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
          </svg>
        </label>

        <!-- Expandable Settings Menu -->
        <div id="gear-settings-menu" class="settings-menu" role="region" aria-label="Quick Settings">
          <div class="menu-inner">
            <a href="#account" class="menu-item">
              <span class="item-left">
                <svg class="item-icon" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                <span>Account Profile</span>
              </span>
              <span class="item-badge">Edit</span>
            </a>

            <a href="#security" class="menu-item">
              <span class="item-left">
                <svg class="item-icon" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                <span>Security & Privacy</span>
              </span>
              <span class="item-badge">2FA On</span>
            </a>

            <a href="#notifications" class="menu-item">
              <span class="item-left">
                <svg class="item-icon" viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
                <span>Notifications</span>
              </span>
              <span class="item-badge">Active</span>
            </a>
          </div>
        </div>
      </header>

      <p style="color: var(--text-sub); font-size: 0.9rem; line-height: 1.5; margin: 0;">
        Click or focus the gear icon above to observe the pure CSS rotation and smooth menu expansion without JavaScript.
      </p>
    </article>
  </main>
</body>
</html>
