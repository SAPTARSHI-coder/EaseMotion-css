<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimalist Avatar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="avatar-group">
        <div class="avatar" data-initials="JD"></div>
        <div class="avatar" data-initials="AS" style="--bg: #e2e8f0; --color: #475569;"></div>
        <div class="avatar avatar-img" style="background-image: url('https://picsum.photos/100')"></div>
    </div>
</body>
</html>
