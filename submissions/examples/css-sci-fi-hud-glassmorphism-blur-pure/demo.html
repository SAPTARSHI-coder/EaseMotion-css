<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Sci-Fi HUD: Glassmorphism Blur</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 
      [TECHNIQUE] The Ambient Background
      Floating colored orbs that move around behind the UI.
      This is required to make the glassmorphism blur effect visible and impressive.
    -->
    <div class="ambient-bg">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <div class="hud-container">
        
        <!-- 
          [TECHNIQUE] The Glass HUD
          Uses backdrop-filter: blur() and semi-transparent backgrounds
          to refract the light from the orbs behind it.
        -->
        <div class="hud-layout">
            
            <header class="hud-header glass-panel">
                <div class="sys-title">TERRA-PRIME <span>ORBITAL STATION</span></div>
                <div class="sys-status pulse">ENVIRONMENTAL SYSTEMS NOMINAL</div>
            </header>

            <div class="hud-main">
                
                <!-- Left Panel -->
                <aside class="hud-panel glass-panel panel-left">
                    <h2 class="panel-title">ATMOSPHERIC MIX</h2>
                    
                    <div class="data-group">
                        <div class="data-label">OXYGEN</div>
                        <div class="data-value">21.0%</div>
                        <div class="glass-progress"><div class="glass-fill fill-cyan" style="width: 21%;"></div></div>
                    </div>
                    
                    <div class="data-group">
                        <div class="data-label">NITROGEN</div>
                        <div class="data-value">78.0%</div>
                        <div class="glass-progress"><div class="glass-fill fill-blue" style="width: 78%;"></div></div>
                    </div>
                    
                    <div class="data-group">
                        <div class="data-label">ARGON / CO2</div>
                        <div class="data-value">1.0%</div>
                        <div class="glass-progress"><div class="glass-fill fill-magenta" style="width: 1%;"></div></div>
                    </div>

                    <!-- Decorative elements -->
                    <div class="glass-divider mt-auto"></div>
                    <div class="hex-grid">
                        <div class="hex hex-active"></div>
                        <div class="hex"></div>
                        <div class="hex hex-active"></div>
                        <div class="hex"></div>
                    </div>
                </aside>

                <!-- Center Panel: The Core visualizer -->
                <main class="hud-center">
                    <div class="core-container">
                        <!-- Glass rings -->
                        <div class="glass-ring ring-outer"></div>
                        <div class="glass-ring ring-inner"></div>
                        <!-- Core data readout -->
                        <div class="core-readout glass-panel">
                            <span class="core-label">GRAVITY</span>
                            <span class="core-value">0.98<small>G</small></span>
                        </div>
                    </div>
                </main>

                <!-- Right Panel -->
                <aside class="hud-panel glass-panel panel-right">
                    <h2 class="panel-title">HABITAT SECTORS</h2>
                    
                    <div class="sector-list">
                        <div class="sector-item status-ok">
                            <span class="sector-name">SECTOR Alpha</span>
                            <span class="sector-status">OPTIMAL</span>
                        </div>
                        <div class="sector-item status-ok">
                            <span class="sector-name">SECTOR Beta</span>
                            <span class="sector-status">OPTIMAL</span>
                        </div>
                        <div class="sector-item status-warn">
                            <span class="sector-name">SECTOR Gamma</span>
                            <span class="sector-status">MAINTENANCE</span>
                        </div>
                        <div class="sector-item status-alert">
                            <span class="sector-name">SECTOR Delta</span>
                            <span class="sector-status">LOCKED</span>
                        </div>
                    </div>

                    <div class="glass-divider mt-auto"></div>
                    
                    <!-- Glass Button -->
                    <button class="glass-btn">
                        <span>INITIATE OVERRIDE</span>
                    </button>
                </aside>
                
            </div>
            
        </div>
        
    </div>

</body>
</html>
