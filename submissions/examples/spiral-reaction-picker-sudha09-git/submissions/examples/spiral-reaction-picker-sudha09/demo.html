<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spiral Reaction Picker -- EaseMotion CSS</title>
  <link rel="stylesheet" href="../../../easemotion.css" />
  <link rel="stylesheet" href="style.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4rem;
      padding: 4rem 1.5rem;
    }

    h1 {
      font-size: 1rem;
      color: rgba(255,255,255,0.3);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-align: center;
    }

    /* Fake post cards */
    .post-card {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(16px);
      border-radius: 16px;
      padding: 1.5rem;
      width: 100%;
      max-width: 420px;
    }

    .post-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1rem;
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #4f46e5, #ec4899);
      flex-shrink: 0;
    }

    .post-meta { display: flex; flex-direction: column; gap: 0.1rem; }
    .post-name { font-size: 0.875rem; font-weight: 700; color: #e2e8f0; }
    .post-time { font-size: 0.72rem; color: #64748b; }

    .post-body {
      font-size: 0.9rem;
      color: #cbd5e1;
      line-height: 1.6;
      margin-bottom: 1.25rem;
    }

    .post-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      border-top: 1px solid rgba(255,255,255,0.06);
      padding-top: 1rem;
    }

    .action-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.4rem 0.9rem;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.05);
      color: #94a3b8;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .action-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #e2e8f0;
    }

    .section-label {
      font-size: 0.68rem;
      color: rgba(255,255,255,0.25);
      text-align: center;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .demo-row {
      display: flex;
      gap: 2rem;
      align-items: flex-end;
      flex-wrap: wrap;
      justify-content: center;
    }

    .demo-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
    }
  </style>
</head>
<body>

  <h1>Spiral Reaction Picker</h1>

  <!-- Post card demo -->
  <div class="post-card">
    <div class="post-header">
      <div class="avatar"></div>
      <div class="post-meta">
        <span class="post-name">sudha09-git</span>
        <span class="post-time">2 minutes ago</span>
      </div>
    </div>
    <p class="post-body">
      Just shipped the spiral reaction picker for EaseMotion CSS — pure CSS, zero JavaScript, glassmorphism design. ✨
    </p>
    <div class="post-actions">

      <!-- Spiral Reaction Picker -->
      <div class="spiral-picker">
        <input class="spiral-picker__toggle" type="checkbox" id="picker1" />
        <label class="spiral-picker__trigger" for="picker1">
          😊 React
        </label>

        <!-- Backdrop to close on outside click -->
        <label class="spiral-picker__backdrop" for="picker1"></label>

        <!-- Panel -->
        <div class="spiral-picker__panel" role="group" aria-label="Reaction picker">

          <div class="spiral-picker__item" data-label="Love">
            <input type="radio" name="reaction1" value="love" aria-label="Love" />
            ❤️
          </div>

          <div class="spiral-picker__item" data-label="Haha">
            <input type="radio" name="reaction1" value="haha" aria-label="Haha" />
            😂
          </div>

          <div class="spiral-picker__item" data-label="Wow">
            <input type="radio" name="reaction1" value="wow" aria-label="Wow" />
            😮
          </div>

          <div class="spiral-picker__item" data-label="Sad">
            <input type="radio" name="reaction1" value="sad" aria-label="Sad" />
            😢
          </div>

          <div class="spiral-picker__item" data-label="Angry">
            <input type="radio" name="reaction1" value="angry" aria-label="Angry" />
            😡
          </div>

          <div class="spiral-picker__item" data-label="Fire">
            <input type="radio" name="reaction1" value="fire" aria-label="Fire" />
            🔥
          </div>

        </div>
      </div>

      <button class="action-btn">💬 Reply</button>
      <button class="action-btn">↗ Share</button>

    </div>
  </div>

  <!-- Standalone variants -->
  <div class="demo-row">

    <div class="demo-col">
      <div class="section-label">Dark (default)</div>
      <div class="spiral-picker">
        <input class="spiral-picker__toggle" type="checkbox" id="picker2" />
        <label class="spiral-picker__trigger" for="picker2">👍 Like</label>
        <label class="spiral-picker__backdrop" for="picker2"></label>
        <div class="spiral-picker__panel">
          <div class="spiral-picker__item" data-label="Like"><input type="radio" name="r2" />👍</div>
          <div class="spiral-picker__item" data-label="Love"><input type="radio" name="r2" />❤️</div>
          <div class="spiral-picker__item" data-label="Clap"><input type="radio" name="r2" />👏</div>
          <div class="spiral-picker__item" data-label="Star"><input type="radio" name="r2" />⭐</div>
          <div class="spiral-picker__item" data-label="Rocket"><input type="radio" name="r2" />🚀</div>
        </div>
      </div>
    </div>

    <div class="demo-col">
      <div class="section-label">Light variant</div>
      <div class="spiral-picker spiral-picker--light">
        <input class="spiral-picker__toggle" type="checkbox" id="picker3" />
        <label class="spiral-picker__trigger" for="picker3">😊 React</label>
        <label class="spiral-picker__backdrop" for="picker3"></label>
        <div class="spiral-picker__panel">
          <div class="spiral-picker__item" data-label="Love"><input type="radio" name="r3" />❤️</div>
          <div class="spiral-picker__item" data-label="Haha"><input type="radio" name="r3" />😂</div>
          <div class="spiral-picker__item" data-label="Wow"><input type="radio" name="r3" />😮</div>
          <div class="spiral-picker__item" data-label="Great"><input type="radio" name="r3" />🎉</div>
          <div class="spiral-picker__item" data-label="Fire"><input type="radio" name="r3" />🔥</div>
        </div>
      </div>
    </div>

  </div>

</body>
</html>
