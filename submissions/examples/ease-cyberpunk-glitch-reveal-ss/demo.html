<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyberpunk Glitch Text Reveal - Play Category</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="ease-glitch-stage" aria-labelledby="stage-title">
    <p class="ease-cyber-subtitle" id="stage-title">System Protocol v4.0.2</p>

    <!-- Glitch Component -->
    <h1 class="ease-glitch-reveal" id="glitch-target" data-text="Welcome to the Future">
      Welcome to the Future
    </h1>

    <button type="button" class="ease-btn-cyber" id="replay-btn">Replay Glitch</button>
  </main>

  <script>
    const glitchTarget = document.getElementById('glitch-target');
    const replayBtn = document.getElementById('replay-btn');

    replayBtn.addEventListener('click', () => {
      glitchTarget.classList.remove('is-animating');
      void glitchTarget.offsetWidth; // Trigger DOM reflow
      glitchTarget.classList.add('is-animating');
    });
  </script>
</body>
</html>
