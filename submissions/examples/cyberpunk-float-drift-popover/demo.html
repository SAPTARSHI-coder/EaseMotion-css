<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Float-Drift Popover - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="cp-layout">
        <main class="cp-main">
            <h1 class="cp-title">TARGET_LOCKED</h1>
            <p class="cp-desc">Hover or interact with the data node to reveal classified telemetry.</p>
            
            <div class="cp-popover-container">
                <input type="checkbox" id="cp-popover-toggle" class="cp-hidden-toggle">
                
                <label for="cp-popover-toggle" class="cp-trigger" tabindex="0">
                    <span class="cp-trigger-text">INSPECT NODE</span>
                    <div class="cp-trigger-glitch"></div>
                </label>

                <div class="cp-popover-wrapper">
                    <div class="cp-popover-floater">
                        <div class="cp-popover-content">
                            <div class="cp-popover-header">
                                <span class="cp-badge">LVL 4</span>
                                <h3>ENTITY_DATA</h3>
                            </div>
                            <div class="cp-popover-body">
                                <div class="cp-data-row">
                                    <span class="cp-label">ID:</span>
                                    <span class="cp-value">NX-774.92</span>
                                </div>
                                <div class="cp-data-row">
                                    <span class="cp-label">STATUS:</span>
                                    <span class="cp-value cp-alert">UNSTABLE</span>
                                </div>
                                <div class="cp-data-row">
                                    <span class="cp-label">THREAT:</span>
                                    <div class="cp-threat-bar">
                                        <div class="cp-threat-level"></div>
                                    </div>
                                </div>
                            </div>
                            <div class="cp-popover-footer">
                                <div class="cp-barcode"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
