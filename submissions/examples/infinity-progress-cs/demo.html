<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Infinity Progress — EaseMotion CSS</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="page">
        <section class="demo" aria-labelledby="demo-title">
            <div class="intro">
                <p class="eyebrow">EaseMotion CSS · Progress</p>
                <h1 id="demo-title">Infinity Progress</h1>
                <p>An endless loading bar that sweeps across an indeterminate track while continuously shrinking and expanding.</p>
            </div>

            <div class="showcase">
                <div class="loader" role="progressbar" aria-label="Loading" aria-valuetext="Loading">
                    <div class="track">
                        <div class="progress"></div>
                    </div>
                </div>

                <div class="loader-meta">
                    <span class="loader-dot" aria-hidden="true"></span>
                    <span>Loading continuously</span>
                </div>
            </div>
        </section>
    </main>
</body>

</html>
