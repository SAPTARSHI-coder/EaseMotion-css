<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glassmorphic Weather Forecast Widget - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="weather-widget">
    <div class="weather-header">
      <div class="location-badge">TOKYO // JAPAN</div>
      <div class="weather-date">THU, 08 AUG</div>
    </div>
    
    <div class="weather-main">
      <div class="sun-orb-container">
        <div class="sun-orb"></div>
        <div class="cloud-layer cloud-1"></div>
        <div class="cloud-layer cloud-2"></div>
      </div>
      <div class="temp-readout">
        <span class="temp-value">28</span>
        <span class="temp-unit">°C</span>
      </div>
    </div>
    
    <div class="weather-desc">SCATTERED CLOUDS & SUNSHINE</div>
    
    <div class="forecast-pills">
      <div class="forecast-item">
        <span class="day">FRI</span>
        <span class="icon">☀️</span>
        <span class="temp">30°</span>
      </div>
      <div class="forecast-item active">
        <span class="day">SAT</span>
        <span class="icon">⛅</span>
        <span class="temp">27°</span>
      </div>
      <div class="forecast-item">
        <span class="day">SUN</span>
        <span class="icon">🌧️</span>
        <span class="temp">22°</span>
      </div>
    </div>
  </div>
</body>
</html>
