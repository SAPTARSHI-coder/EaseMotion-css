<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agenda Time Budget KP</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="demo-shell">
      <section class="agenda-card" aria-labelledby="agenda-title">
        <header class="agenda-card__header">
          <div>
            <span class="agenda-card__eyebrow">Meeting plan</span>
            <h1 id="agenda-title">Product kickoff agenda</h1>
            <p>Keep every topic focused within a 45-minute session.</p>
          </div>

          <div
            class="budget-ring"
            role="img"
            aria-label="45 of 45 meeting minutes allocated"
          >
            <span>45</span>
            <small>minutes</small>
          </div>
        </header>

        <div class="budget-scale" aria-hidden="true">
          <span>0</span>
          <span>15 min</span>
          <span>30 min</span>
          <span>45 min</span>
        </div>

        <fieldset class="agenda-list">
          <legend>Agenda topics</legend>

          <label class="agenda-item agenda-item--pulse">
            <input type="checkbox" />
            <span class="agenda-item__check" aria-hidden="true"></span>
            <span class="agenda-item__content">
              <span class="agenda-item__title">
                <strong>Project pulse</strong>
                <small>8 min</small>
              </span>
              <span class="agenda-item__description">
                Current status and success signals
              </span>
              <span class="agenda-item__track" aria-hidden="true">
                <span></span>
              </span>
            </span>
          </label>

          <label class="agenda-item agenda-item--design">
            <input type="checkbox" />
            <span class="agenda-item__check" aria-hidden="true"></span>
            <span class="agenda-item__content">
              <span class="agenda-item__title">
                <strong>Design decisions</strong>
                <small>12 min</small>
              </span>
              <span class="agenda-item__description">
                Resolve open product experience choices
              </span>
              <span class="agenda-item__track" aria-hidden="true">
                <span></span>
              </span>
            </span>
          </label>

          <label class="agenda-item agenda-item--risk">
            <input type="checkbox" />
            <span class="agenda-item__check" aria-hidden="true"></span>
            <span class="agenda-item__content">
              <span class="agenda-item__title">
                <strong>Risk review</strong>
                <small>15 min</small>
              </span>
              <span class="agenda-item__description">
                Surface blockers, owners, and mitigations
              </span>
              <span class="agenda-item__track" aria-hidden="true">
                <span></span>
              </span>
            </span>
          </label>

          <label class="agenda-item agenda-item--actions">
            <input type="checkbox" />
            <span class="agenda-item__check" aria-hidden="true"></span>
            <span class="agenda-item__content">
              <span class="agenda-item__title">
                <strong>Next actions</strong>
                <small>10 min</small>
              </span>
              <span class="agenda-item__description">
                Confirm owners and immediate follow-ups
              </span>
              <span class="agenda-item__track" aria-hidden="true">
                <span></span>
              </span>
            </span>
          </label>
        </fieldset>

        <footer class="agenda-summary">
          <span class="agenda-summary__signal" aria-hidden="true"></span>
          <span>
            <strong>Balanced agenda</strong>
            <small>All 45 minutes are intentionally allocated</small>
          </span>
          <button type="button">Start meeting</button>
        </footer>
      </section>
    </main>
  </body>
</html>
