<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Radio Station Tuner - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="em-tuner-page" role="region" aria-label="Retro Radio Frequency Tuner Dial">
        <div class="em-tuner-card" tabindex="0">
            <header class="em-tuner-header">
                <span class="em-tuner-badge">RETRO ANALOGUE</span>
                <h1 class="em-tuner-title">Radio Station Tuner</h1>
                <p class="em-tuner-subtitle">Frequency modulation scale powered entirely by pure CSS animations.</p>
            </header>

            <div class="em-tuner-display">
                <div class="em-frequency-scale" aria-hidden="true">
                    <span class="em-freq-mark">88</span>
                    <span class="em-freq-mark">92</span>
                    <span class="em-freq-mark">96</span>
                    <span class="em-freq-mark">100</span>
                    <span class="em-freq-mark">104</span>
                    <span class="em-freq-mark">108</span>
                </div>
                <div class="em-tuner-track">
                    <div class="em-tuner-needle">
                        <div class="em-needle-tip"></div>
                    </div>
                </div>
            </div>

            <div class="em-tuner-footer">
                <span class="em-status-label">FM STEREO // TUNED</span>
                <span class="em-frequency-readout">102.5 MHz</span>
            </div>
        </div>
    </div>
</body>
</html>
