<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Letter Reveal - EaseMotion Submission</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="stage">
    <h1 class="headline" id="headline">
      <span class="word"><span class="ch">A</span><span class="ch">n</span><span class="ch">i</span><span class="ch">m</span><span class="ch">a</span><span class="ch">t</span><span class="ch">e</span></span>
      <span class="word"><span class="ch">e</span><span class="ch">v</span><span class="ch">e</span><span class="ch">r</span><span class="ch">y</span></span>
      <span class="word"><span class="ch">l</span><span class="ch">e</span><span class="ch">t</span><span class="ch">t</span><span class="ch">e</span><span class="ch">r</span></span>
    </h1>

    <p class="sub">Each character springs in with a stagger, rebuilt for the EaseMotion examples library.</p>

    <div class="controls">
      <button class="reveal-btn" id="revealBtn">Replay</button>
    </div>
  </main>

  <script>
    const headline = document.getElementById('headline');
    const revealBtn = document.getElementById('revealBtn');

    function replay() {
      headline.classList.remove('run');
      void headline.offsetWidth;
      headline.classList.add('run');
    }

    revealBtn.addEventListener('click', replay);
    replay();
  </script>
</body>
</html>
