<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Button Loading State Showcase | EaseMotion CSS</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="ease-center ease-fade-in" style="min-height: 100vh; background: #090d16; font-family: 'Inter', sans-serif; padding: 2rem;">

  <div class="loading-container">
    <header class="loading-header ease-slide-up">
      <h1 class="ease-fade-in">Button Loading States</h1>
      <p class="ease-slide-up ease-delay-100">Pure CSS button loading state animations with zero JavaScript overhead.</p>
    </header>

    <!-- Buttons Showcase Wrapper -->
    <div class="loading-grid ease-slide-up ease-delay-200">
      
      <!-- Standard Loading State -->
      <div class="loading-card">
        <h3>Primary Spinner</h3>
        <button class="ease-btn-loading-ak is-loading">
          <span class="btn-text">Submit Request</span>
          <span class="btn-spinner"></span>
        </button>
      </div>

      <!-- Pulse Loading State -->
      <div class="loading-card">
        <h3>Pulse State</h3>
        <button class="ease-btn-loading-ak is-pulse">
          <span class="btn-text">Syncing Data...</span>
        </button>
      </div>

    </div>
  </div>

</body>
</html>
