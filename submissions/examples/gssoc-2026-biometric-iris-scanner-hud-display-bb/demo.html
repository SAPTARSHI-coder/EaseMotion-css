<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Biometric Iris Scanner HUD Display - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="hud-container">
    <header class="hud-header">
      <span class="badge">GSSoC 2026 Showcase</span>
      <h1>Biometric Iris Scanner HUD Display</h1>
      <p>Futuristic sci-fi authentication HUD card with rotating reticle rings, laser targeting beam, and biometric verification state.</p>
    </header>

    <div class="hud-card" tabindex="0">
      <div class="hud-grid-overlay"></div>
      
      <div class="scanner-core">
        <div class="ring outer-ring"></div>
        <div class="ring mid-ring"></div>
        <div class="ring inner-ring"></div>
        <div class="scan-beam"></div>
        <div class="iris-center">
          <div class="pupil"></div>
        </div>
      </div>

      <div class="hud-info">
        <div class="status-line">
          <span class="status-indicator"></span>
          <span class="status-text">SCANNING RETINAL PATTERN</span>
        </div>
        <div class="metrics-row">
          <div class="metric-box">
            <span class="m-label">MATCH RATIO</span>
            <span class="m-val">99.84%</span>
          </div>
          <div class="metric-box">
            <span class="m-label">ENCRYPTION</span>
            <span class="m-val">AES-512</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
