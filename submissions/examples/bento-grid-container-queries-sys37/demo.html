<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Container Queries Kinetic Bento Grid Layout</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../easemotion.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>Container Queries Bento Grid</h1>
      <p>Cards rearrange dynamically based on parent container width.</p>
    </header>

    <main class="bento-container">
      <div class="bento-card col-span-2"><h2>Feature 1</h2><p>Large Bento Hero Card</p></div>
      <div class="bento-card"><h2>Feature 2</h2><p>Compact Widget</p></div>
      <div class="bento-card"><h2>Feature 3</h2><p>Stat Badge</p></div>
      <div class="bento-card col-span-2"><h2>Feature 4</h2><p>Wide Analytics Panel</p></div>
    </main>
  </div>
</body>
</html>
