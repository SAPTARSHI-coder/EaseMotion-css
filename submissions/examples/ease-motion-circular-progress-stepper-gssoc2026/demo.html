<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Circular Progress Stepper - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="stepper-wrapper">
    <header class="stepper-header">
      <h1>Checkout Progress</h1>
      <p>Multi-step wizard status tracking with animated connecting track lines.</p>
    </header>

    <div class="stepper-container" role="progressbar" aria-valuenow="2" aria-valuemin="1" aria-valuemax="4">
      <div class="stepper-item completed">
        <div class="step-circle">✓</div>
        <span class="step-label">Account</span>
      </div>

      <div class="stepper-line completed"></div>

      <div class="stepper-item active">
        <div class="step-circle">2</div>
        <span class="step-label">Shipping</span>
      </div>

      <div class="stepper-line"></div>

      <div class="stepper-item">
        <div class="step-circle">3</div>
        <span class="step-label">Payment</span>
      </div>

      <div class="stepper-line"></div>

      <div class="stepper-item">
        <div class="step-circle">4</div>
        <span class="step-label">Review</span>
      </div>
    </div>
  </div>
</body>
</html>
