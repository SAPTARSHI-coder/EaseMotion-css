<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dark Mode Dual Range Slider Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Dark Mode Dual Range Slider</h1>
    <p>Use keyboard arrow keys, Home, or End to adjust values.</p>

    <section class="slider-wrapper">
      <label id="slider-label" class="slider-title">Price Range ($)</label>
      
      <div class="dual-range-slider" id="dual-slider">
        <div class="slider-track-bg"></div>
        <div class="slider-track-highlight" id="slider-track"></div>

        <input 
          type="range" 
          id="slider-min" 
          class="slider-thumb slider-thumb--min" 
          min="0" 
          max="1000" 
          value="200" 
          step="10"
          aria-labelledby="slider-label"
          aria-label="Minimum Price"
          aria-valuemin="0"
          aria-valuemax="1000"
          aria-valuenow="200"
        />

        <input 
          type="range" 
          id="slider-max" 
          class="slider-thumb slider-thumb--max" 
          min="0" 
          max="1000" 
          value="800" 
          step="10"
          aria-labelledby="slider-label"
          aria-label="Maximum Price"
          aria-valuemin="0"
          aria-valuemax="1000"
          aria-valuenow="800"
        />
      </div>

      <div class="slider-readout">
        <span id="readout-min">$200</span>
        <span>-</span>
        <span id="readout-max">$800</span>
      </div>
    </section>
  </main>

  <script>
    const minInput = document.getElementById('slider-min');
    const maxInput = document.getElementById('slider-max');
    const track = document.getElementById('slider-track');
    const readoutMin = document.getElementById('readout-min');
    const readoutMax = document.getElementById('readout-max');

    const minGap = 20;
    const maxVal = parseInt(minInput.max);

    function updateSlider(e) {
      let min = parseInt(minInput.value);
      let max = parseInt(maxInput.value);

      if (max - min < minGap) {
        if (e && e.target === minInput) {
          minInput.value = max - minGap;
          min = max - minGap;
        } else {
          maxInput.value = min + minGap;
          max = min + minGap;
        }
      }

      minInput.setAttribute('aria-valuenow', min);
      maxInput.setAttribute('aria-valuenow', max);
      readoutMin.textContent = `$${min}`;
      readoutMax.textContent = `$${max}`;

      const leftPercent = (min / maxVal) * 100;
      const rightPercent = 100 - ((max / maxVal) * 100);

      track.style.left = `${leftPercent}%`;
      track.style.right = `${rightPercent}%`;
    }

    minInput.addEventListener('input', updateSlider);
    maxInput.addEventListener('input', updateSlider);
    updateSlider();
  </script>
</body>
</html>
