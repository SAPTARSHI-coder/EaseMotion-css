<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-coffee-grinder-burr-spin demo</title>
</head>
<body>
<div class="cg-app">
  <span class="cg-title">COFFEE</span>
  <div class="cg-hopper">
    <span class="cg-bean cg-bean-1"></span>
    <span class="cg-bean cg-bean-2"></span>
    <span class="cg-bean cg-bean-3"></span>
  </div>
  <div class="cg-body">
    <div class="cg-burr">
      <span class="cg-tooth cg-tooth-1"></span>
      <span class="cg-tooth cg-tooth-2"></span>
      <span class="cg-tooth cg-tooth-3"></span>
    </div>
    <span class="cg-grounds"></span>
  </div>
  <div class="cg-cup"><span class="cg-fill"></span></div>
  <span class="cg-knob"></span>
</div>
</body>
</html>
