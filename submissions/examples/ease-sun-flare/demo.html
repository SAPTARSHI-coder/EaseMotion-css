<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sun Flare – Lens Flare Effect Follows Cursor</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <h1>☀️ Sun Flare</h1>
    <p class="subtitle">Lens flare effect follows your cursor</p>

    <div class="flare-container">
      <div class="flare-stage" id="flareStage">
        <canvas id="canvas"></canvas>
        
        <!-- Info overlay -->
        <div class="info-overlay">
          <span class="flare-status" id="flareStatus">☀️ Active</span>
          <span class="flare-intensity" id="flareIntensity">Intensity: 80%</span>
        </div>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <button class="ctrl-btn toggle" id="toggleBtn">💡 Toggle</button>
      <button class="ctrl-btn reset" id="resetBtn">↺ Reset</button>
      <button class="ctrl-btn burst" id="burstBtn">💥 Burst</button>
    </div>

    <!-- Sliders -->
    <div class="slider-container">
      <span class="slider-label">Intensity</span>
      <input type="range" id="intensitySlider" min="0" max="100" value="80" />
      <span class="slider-value" id="intensityValue">80%</span>
    </div>

    <div class="slider-container">
      <span class="slider-label">Flare Size</span>
      <input type="range" id="sizeSlider" min="50" max="200" value="100" />
      <span class="slider-value" id="sizeValue">100%</span>
    </div>

    <div class="slider-container">
      <span class="slider-label">Rotation Speed</span>
      <input type="range" id="speedSlider" min="0" max="100" value="30" />
      <span class="slider-value" id="speedValue">30%</span>
    </div>

    <!-- Status -->
    <div class="status" id="status">☀️ Move your cursor to see the lens flare effect</div>

    <!-- Keyboard shortcuts -->
    <div class="shortcuts">
      <kbd>Mouse</kbd> Move flare · <kbd>T</kbd> Toggle · <kbd>R</kbd> Reset · <kbd>B</kbd> Burst
    </div>
  </div>

  <script>
    (function() {
      "use strict";

      // DOM elements
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      const flareStatus = document.getElementById('flareStatus');
      const flareIntensity = document.getElementById('flareIntensity');
      const toggleBtn = document.getElementById('toggleBtn');
      const resetBtn = document.getElementById('resetBtn');
      const burstBtn = document.getElementById('burstBtn');
      const status = document.getElementById('status');
      const intensitySlider = document.getElementById('intensitySlider');
      const intensityValue = document.getElementById('intensityValue');
      const sizeSlider = document.getElementById('sizeSlider');
      const sizeValue = document.getElementById('sizeValue');
      const speedSlider = document.getElementById('speedSlider');
      const speedValue = document.getElementById('speedValue');

      // State
      let isActive = true;
      let mouseX = 0;
      let mouseY = 0;
      let isMouseOnCanvas = false;
      let animationId = null;
      let time = 0;
      let flareRotation = 0;
      let burstParticles = [];
      let isBursting = false;
      let burstTimer = null;

      // ----- Canvas setup -----
      function setupCanvas() {
        const rect = canvas.parentElement.getBoundingClientRect();
        const size = Math.min(rect.width - 40, 600);
        canvas.width = size;
        canvas.height = size;
        canvas.style.width = size + 'px';
        canvas.style.height = size + 'px';
      }

      // ----- Burst particle class -----
      class BurstParticle {
        constructor(x, y) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 1 + Math.random() * 4;
          this.x = x;
          this.y = y;
          this.vx = Math.cos(angle) * speed;
          this.vy = Math.sin(angle) * speed;
          this.size = 1 + Math.random() * 4;
          this.life = 1;
          this.decay = 0.01 + Math.random() * 0.02;
          this.hue = 30 + Math.random() * 30;
          this.saturation = 80 + Math.random() * 20;
          this.lightness = 60 + Math.random() * 30;
        }

        update() {
          this.x += this.vx;
          this.y += this.vy;
          this.vx *= 0.99;
          this.vy *= 0.99;
          this.life -= this.decay;
          this.size *= 0.995;
          return this.life > 0;
        }

        draw(ctx) {
          const alpha = this.life;
          const size = this.size * this.life;
          
          // Glow
          const gradient = ctx.createRadialGradient(
            this.x, this.y, 0,
            this.x, this.y, size * 4
          );
          gradient.addColorStop(0, `hsla(${this.hue}, 100%, 90%, ${alpha * 0.5})`);
          gradient.addColorStop(1, `hsla(${this.hue}, 100%, 60%, 0)`);
          ctx.fillStyle = gradient;
          ctx.beginPath();
          ctx.arc(this.x, this.y, size * 4, 0, Math.PI * 2);
          ctx.fill();

          // Core
          ctx.fillStyle = `hsla(${this.hue + 20}, 100%, 95%, ${alpha * 0.8})`;
          ctx.beginPath();
          ctx.arc(this.x, this.y, size, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // ----- Draw lens flare -----
      function drawFlare() {
        const w = canvas.width;
        const h = canvas.height;
        const cx = w / 2;
        const cy = h / 2;
        const intensity = parseInt(intensitySlider.value) / 100;
        const sizeMult = parseInt(sizeSlider.value) / 100;
        const speed = parseInt(speedSlider.value) / 100;
        const flareX = isMouseOnCanvas ? mouseX : cx;
        const flareY = isMouseOnCanvas ? mouseY : cy;

        // Clear
        ctx.clearRect(0, 0, w, h);

        // Background - dark gradient
        const bgGradient = ctx.createRadialGradient(cx, cy, 0, cx, cy, w * 0.8);
        bgGradient.addColorStop(0, '#0a0a1a');
        bgGradient.addColorStop(0.5, '#060612');
        bgGradient.addColorStop(1, '#020208');
        ctx.fillStyle = bgGradient;
        ctx.fillRect(0, 0, w, h);

        if (!isActive) {
          flareStatus.textContent = '🌑 Inactive';
          flareIntensity.textContent = 'Intensity: 0%';
          return;
        }

        // Update rotation
        if (isActive) {
          flareRotation += 0.005 * speed * 10;
        }

        // Calculate distance from center for flare intensity
        const dx = flareX - cx;
        const dy = flareY - cy;
        const dist = Math.sqrt(dx * dx + dy * dy);
        const maxDist = Math.min(w, h) * 0.7;
        const distFactor = Math.min(1, dist / maxDist);
        const flareIntensityVal = intensity * (0.3 + 0.7 * (1 - distFactor));

        // --- Draw sun flare elements ---

        // 1. Main glow
        const glowSize = Math.min(w, h) * 0.35 * sizeMult * (0.5 + 0.5 * (1 - distFactor));
        const mainGlow = ctx.createRadialGradient(
          flareX, flareY, 0,
          flareX, flareY, glowSize
        );
        const glowAlpha = 0.1 + flareIntensityVal * 0.4;
        mainGlow.addColorStop(0, `rgba(255, 240, 200, ${glowAlpha * 0.8})`);
        mainGlow.addColorStop(0.3, `rgba(255, 220, 150, ${glowAlpha * 0.5})`);
        mainGlow.addColorStop(0.6, `rgba(255, 200, 100, ${glowAlpha * 0.3})`);
        mainGlow.addColorStop(1, `rgba(255, 180, 50, 0)`);
        ctx.fillStyle = mainGlow;
        ctx.beginPath();
        ctx.arc(flareX, flareY, glowSize, 0, Math.PI * 2);
        ctx.fill();

        // 2. Bright center
        const centerSize = 10 * sizeMult * (0.5 + 0.5 * (1 - distFactor));
        const centerGradient = ctx.createRadialGradient(
          flareX - centerSize * 0.2, flareY - centerSize * 0.2, 0,
          flareX, flareY, centerSize
        );
        const centerAlpha = 0.3 + flareIntensityVal * 0.6;
        centerGradient.addColorStop(0, `rgba(255, 255, 255, ${centerAlpha * 0.9})`);
        centerGradient.addColorStop(0.5, `rgba(255, 240, 200, ${centerAlpha * 0.6})`);
        centerGradient.addColorStop(1, `rgba(255, 220, 150, ${centerAlpha * 0.2})`);
        ctx.fillStyle = centerGradient;
        ctx.beginPath();
        ctx.arc(flareX, flareY, centerSize, 0, Math.PI * 2);
        ctx.fill();

        // 3. Light rays
        const numRays = 12;
        const rayLength = glowSize * 1.2 * (0.5 + 0.5 * (1 - distFactor));
        ctx.save();
        ctx.translate(flareX, flareY);
        ctx.rotate(flareRotation);

        for (let i = 0; i < numRays; i++) {
          const angle = (i / numRays) * Math.PI * 2;
          const rayWidth = 1 + (i % 3) * 2;
          const rayAlpha = 0.05 + flareIntensityVal * 0.15 * (0.5 + 0.5 * Math.sin(angle * 2 + time));
          
          ctx.save();
          ctx.rotate(angle);
          
          const grad = ctx.createLinearGradient(0, 0, rayLength, 0);
          grad.addColorStop(0, `rgba(255, 255, 255, ${rayAlpha * 0.5})`);
          grad.addColorStop(0.5, `rgba(255, 240, 200, ${rayAlpha})`);
          grad.addColorStop(1, `rgba(255, 220, 150, 0)`);
          
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.moveTo(0, -rayWidth);
          ctx.lineTo(rayLength, -rayWidth * 0.3);
          ctx.lineTo(rayLength, rayWidth * 0.3);
          ctx.lineTo(0, rayWidth);
          ctx.closePath();
          ctx.fill();
          
          ctx.restore();
        }
        ctx.restore();

        // 4. Secondary flares (ghost images)
        const numGhosts = 4;
        for (let i = 0; i < numGhosts; i++) {
          const angle = (i / numGhosts) * Math.PI * 2 + flareRotation * 0.5;
          const ghostDist = glowSize * (0.8 + i * 0.15) * (0.5 + 0.5 * (1 - distFactor));
          const ghostX = flareX + Math.cos(angle) * ghostDist;
          const ghostY = flareY + Math.sin(angle) * ghostDist;
          const ghostSize = glowSize * (0.15 + i * 0.05) * (0.5 + 0.5 * (1 - distFactor));
          
          if (ghostSize > 2) {
            const ghostGrad = ctx.createRadialGradient(
              ghostX, ghostY, 0,
              ghostX, ghostY, ghostSize
            );
            const ghostAlpha = 0.02 + flareIntensityVal * 0.08 * (1 - i * 0.15);
            ghostGrad.addColorStop(0, `rgba(255, 255, 200, ${ghostAlpha})`);
            ghostGrad.addColorStop(1, `rgba(255, 200, 100, 0)`);
            ctx.fillStyle = ghostGrad;
            ctx.beginPath();
            ctx.arc(ghostX, ghostY, ghostSize, 0, Math.PI * 2);
            ctx.fill();
          }
        }

        // 5. Horizontal flare streak
        const streakLength = glowSize * 2.5 * (0.3 + 0.7 * (1 - distFactor));
        const streakGrad = ctx.createLinearGradient(
          flareX - streakLength, flareY,
          flareX + streakLength, flareY
        );
        const streakAlpha = 0.02 + flareIntensityVal * 0.06;
        streakGrad.addColorStop(0, `rgba(255, 200, 100, 0)`);
        streakGrad.addColorStop(0.2, `rgba(255, 220, 150, ${streakAlpha * 0.5})`);
        streakGrad.addColorStop(0.5, `rgba(255, 255, 200, ${streakAlpha})`);
        streakGrad.addColorStop(0.8, `rgba(255, 220, 150, ${streakAlpha * 0.5})`);
        streakGrad.addColorStop(1, `rgba(255, 200, 100, 0)`);
        ctx.fillStyle = streakGrad;
        ctx.fillRect(flareX - streakLength, flareY - 2, streakLength * 2, 4);

        // 6. Draw burst particles
        if (isBursting) {
          burstParticles = burstParticles.filter(p => p.update());
          burstParticles.forEach(p => p.draw(ctx));
          if (burstParticles.length === 0) {
            isBursting = false;
          }
        }

        // Update status
        flareStatus.textContent = isActive ? '☀️ Active' : '🌑 Inactive';
        flareIntensity.textContent = `Intensity: ${Math.round(flareIntensityVal * 100)}%`;
        status.textContent = isActive ? '☀️ Lens flare following cursor' : '🌑 Flare disabled';
      }

      // ----- Animation loop -----
      function animate() {
        time += 0.016;
        drawFlare();
        animationId = requestAnimationFrame(animate);
      }

      // ----- Start animation -----
      function startAnimation() {
        if (animationId) {
          cancelAnimationFrame(animationId);
        }
        animate();
      }

      // ----- Toggle flare -----
      function toggleFlare() {
        isActive = !isActive;
        toggleBtn.textContent = isActive ? '💡 Toggle' : '💡 Off';
        status.textContent = isActive ? '☀️ Flare activated' : '🌑 Flare deactivated';
      }

      // ----- Reset -----
      function resetFlare() {
        isActive = true;
        toggleBtn.textContent = '💡 Toggle';
        intensitySlider.value = 80;
        intensityValue.textContent = '80%';
        sizeSlider.value = 100;
        sizeValue.textContent = '100%';
        speedSlider.value = 30;
        speedValue.textContent = '30%';
        burstParticles = [];
        isBursting = false;
        status.textContent = '↺ Reset';
        setTimeout(() => {
          status.textContent = '☀️ Move your cursor to see the lens flare effect';
        }, 500);
      }

      // ----- Burst effect -----
      function burstFlare() {
        if (!isActive) return;
        
        const w = canvas.width;
        const h = canvas.height;
        const cx = w / 2;
        const cy = h / 2;
        const flareX = isMouseOnCanvas ? mouseX : cx;
        const flareY = isMouseOnCanvas ? mouseY : cy;
        
        isBursting = true;
        for (let i = 0; i < 50; i++) {
          burstParticles.push(new BurstParticle(flareX, flareY));
        }
        status.textContent = '💥 Flare burst!';
        setTimeout(() => {
          status.textContent = '☀️ Move your cursor to see the lens flare effect';
        }, 1000);
      }

      // ----- Event Listeners -----
      // Mouse tracking
      canvas.addEventListener('mousemove', (e) => {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        mouseX = (e.clientX - rect.left) * scaleX;
        mouseY = (e.clientY - rect.top) * scaleY;
        isMouseOnCanvas = true;
      });

      canvas.addEventListener('mouseenter', () => {
        isMouseOnCanvas = true;
        status.textContent = '☀️ Flare tracking cursor';
      });

      canvas.addEventListener('mouseleave', () => {
        isMouseOnCanvas = false;
        status.textContent = '☀️ Move cursor back to control flare';
      });

      // Touch support
      canvas.addEventListener('touchmove', (e) => {
        e.preventDefault();
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        const touch = e.touches[0];
        mouseX = (touch.clientX - rect.left) * scaleX;
        mouseY = (touch.clientY - rect.top) * scaleY;
        isMouseOnCanvas = true;
      });

      canvas.addEventListener('touchstart', (e) => {
        const touch = e.touches[0];
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        mouseX = (touch.clientX - rect.left) * scaleX;
        mouseY = (touch.clientY - rect.top) * scaleY;
        isMouseOnCanvas = true;
      });

      canvas.addEventListener('touchend', () => {
        isMouseOnCanvas = false;
      });

      // Buttons
      toggleBtn.addEventListener('click', toggleFlare);
      resetBtn.addEventListener('click', resetFlare);
      burstBtn.addEventListener('click', burstFlare);

      // Sliders
      intensitySlider.addEventListener('input', (e) => {
        intensityValue.textContent = e.target.value + '%';
      });

      sizeSlider.addEventListener('input', (e) => {
        sizeValue.textContent = e.target.value + '%';
      });

      speedSlider.addEventListener('input', (e) => {
        speedValue.textContent = e.target.value + '%';
      });

      // Keyboard shortcuts
      document.addEventListener('keydown', (e) => {
        if (e.key === 't' || e.key === 'T') {
          e.preventDefault();
          toggleFlare();
        }
        if (e.key === 'r' || e.key === 'R') {
          e.preventDefault();
          resetFlare();
        }
        if (e.key === 'b' || e.key === 'B') {
          e.preventDefault();
          burstFlare();
        }
      });

      // Click on canvas to burst
      canvas.addEventListener('click', burstFlare);

      // ----- Resize handler -----
      let resizeTimeout;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(() => {
          setupCanvas();
        }, 200);
      });

      // ----- Init -----
      function init() {
        setupCanvas();
        startAnimation();
        status.textContent = '☀️ Move your cursor to see the lens flare effect!';
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }

    })();
  </script>
</body>
</html>
