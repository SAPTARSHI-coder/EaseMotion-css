<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Clapping Animation | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="clap-demo-container">
    <header class="clap-demo-header">
      <h1>CSS Clapping Animation</h1>
      <p>Pure CSS animated hands clapping sequence with impact dynamic particle FX.</p>
    </header>

    <article class="ease-clapping-card" role="region" aria-label="Clapping Hands Animation Display">
      <div class="ease-clapping-stage" aria-hidden="true">
        <span class="ease-hand ease-hand--left">👏</span>
        <span class="ease-hand ease-hand--right">👏</span>
        <div class="ease-clap-sparks"></div>
      </div>

      <h2 class="ease-clapping-title">Applaud Feature</h2>
      <p class="ease-clapping-description">
        Demonstrating responsive, GPU-accelerated continuous clapping motion using keyframe rotations and translations.
      </p>
    </article>
  </main>
</body>
</html>
