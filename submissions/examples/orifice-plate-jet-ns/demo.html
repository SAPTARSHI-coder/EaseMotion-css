<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orifice Plate Jet — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Orifice Plate Jet demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Orifice Plate Jet</h1>
      <p class="lede">Orifice plate jet pulsing through a metering restriction</p>
    </header>

    <section class="ease-orifice-plate-jet" data-demo="orifice-plate-jet" aria-live="polite">
      <div class="ease-orifice-plate-jet__housing">
        <div class="ease-orifice-plate-jet__bezel">
          <div class="ease-orifice-plate-jet__face">
            <div class="ease-orifice-plate-jet__readout">
              <span class="ease-orifice-plate-jet__label">Orifice Plate Jet</span>
              <span class="ease-orifice-plate-jet__value">LIVE</span>
            </div>
            <div class="ease-orifice-plate-jet__motion" aria-hidden="true">
              <span class="ease-orifice-plate-jet__a"></span>
              <span class="ease-orifice-plate-jet__b"></span>
              <span class="ease-orifice-plate-jet__c"></span>
              <span class="ease-orifice-plate-jet__d"></span>
            </div>
            <div class="ease-orifice-plate-jet__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-orifice-plate-jet__controls">
          <button type="button" class="ease-orifice-plate-jet__btn primary">Engage</button>
          <button type="button" class="ease-orifice-plate-jet__btn">Reset</button>
          <label class="ease-orifice-plate-jet__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-orifice-plate-jet__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
