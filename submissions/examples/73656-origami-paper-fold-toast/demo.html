<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Origami Paper Fold CSS Toast"
  >

  <title>Origami Paper Fold Toast</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="page">

    <section class="demo-card">

      <span class="eyebrow">CSS TOAST</span>

      <h1>Origami Paper Fold</h1>

      <p class="description">
        A folded-paper inspired notification component built entirely
        with semantic HTML and vanilla CSS.
      </p>

      <div class="toast-stage">

        <article class="origami-toast" role="status">

          <div class="fold fold-top" aria-hidden="true"></div>
          <div class="fold fold-bottom" aria-hidden="true"></div>

          <div class="toast-content">

            <div class="toast-icon" aria-hidden="true">
              ✓
            </div>

            <div class="toast-copy">
              <strong>Changes saved</strong>

              <p>
                Your preferences have been updated successfully.
              </p>
            </div>

            <button
              class="toast-close"
              type="button"
              aria-label="Dismiss notification"
            >
              ×
            </button>

          </div>

          <div class="paper-edge" aria-hidden="true"></div>

        </article>

      </div>

      <p class="hint">
        Pure HTML &amp; CSS · No JavaScript required
      </p>

    </section>

  </main>

</body>
</html>
