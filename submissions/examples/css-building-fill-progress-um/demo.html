<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Building Fill Progress - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Hidden Radio Triggers (Placed before targets for CSS sibling mapping) -->
  <input type="radio" name="progress" id="p-0" class="progress-trigger" checked>
  <input type="radio" name="progress" id="p-1" class="progress-trigger">
  <input type="radio" name="progress" id="p-2" class="progress-trigger">
  <input type="radio" name="progress" id="p-3" class="progress-trigger">
  <input type="radio" name="progress" id="p-4" class="progress-trigger">
  <input type="radio" name="progress" id="p-5" class="progress-trigger">

  <!-- Main Panel -->
  <div class="dashboard-panel" role="region" aria-label="Skyscraper construction progress monitor">
    
    <header class="header-box">
      <h1 class="title">TOWER METRIC</h1>
      <p class="subtitle">Select a progress tier to watch the skyscraper fill floor by floor.</p>
    </header>

    <!-- The Skyscraper Silhouette -->
    <div class="building-area">
      <div class="skyscraper" aria-label="Skyscraper display silhouette">
        
        <!-- Floor 1 (Bottom) -->
        <div class="floor f-1" aria-label="Floor 1">
          <div class="window-row">
            <div class="window"></div>
            <div class="window"></div>
            <div class="window"></div>
          </div>
        </div>

        <!-- Floor 2 -->
        <div class="floor f-2" aria-label="Floor 2">
          <div class="window-row">
            <div class="window"></div>
            <div class="window"></div>
            <div class="window"></div>
          </div>
        </div>

        <!-- Floor 3 -->
        <div class="floor f-3" aria-label="Floor 3">
          <div class="window-row">
            <div class="window"></div>
            <div class="window"></div>
            <div class="window"></div>
          </div>
        </div>

        <!-- Floor 4 -->
        <div class="floor f-4" aria-label="Floor 4">
          <div class="window-row">
            <div class="window"></div>
            <div class="window"></div>
            <div class="window"></div>
          </div>
        </div>

        <!-- Floor 5 (Top) -->
        <div class="floor f-5" aria-label="Floor 5">
          <div class="window-row">
            <div class="window"></div>
            <div class="window"></div>
            <div class="window"></div>
          </div>
        </div>

      </div>
    </div>

    <!-- Stepped Controls Grid -->
    <div class="control-grid" role="radiogroup" aria-label="Select tower fill percentage">
      <label for="p-0" class="control-label l-0" role="radio" aria-checked="false" tabindex="0"
             onkeydown="if(event.key === ' ' || event.key === 'Enter') document.getElementById('p-0').click()">0%</label>
      <label for="p-1" class="control-label l-1" role="radio" aria-checked="false" tabindex="0"
             onkeydown="if(event.key === ' ' || event.key === 'Enter') document.getElementById('p-1').click()">20%</label>
      <label for="p-2" class="control-label l-2" role="radio" aria-checked="false" tabindex="0"
             onkeydown="if(event.key === ' ' || event.key === 'Enter') document.getElementById('p-2').click()">40%</label>
      <label for="p-3" class="control-label l-3" role="radio" aria-checked="false" tabindex="0"
             onkeydown="if(event.key === ' ' || event.key === 'Enter') document.getElementById('p-3').click()">60%</label>
      <label for="p-4" class="control-label l-4" role="radio" aria-checked="false" tabindex="0"
             onkeydown="if(event.key === ' ' || event.key === 'Enter') document.getElementById('p-4').click()">80%</label>
      <label for="p-5" class="control-label l-5" role="radio" aria-checked="false" tabindex="0"
             onkeydown="if(event.key === ' ' || event.key === 'Enter') document.getElementById('p-5').click()">100%</label>
    </div>

  </div>

</body>
</html>
