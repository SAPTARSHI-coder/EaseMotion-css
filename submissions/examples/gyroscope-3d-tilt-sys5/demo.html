<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gyroscope 3D Parallax Tilt Engine for Mobile Devices</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../easemotion.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>Gyroscope 3D Tilt Card</h1>
      <p>Move mouse or tilt mobile device to experience 3D parallax.</p>
    </header>

    <main class="stage">
      <div class="tilt-card" id="tiltCard">
        <div class="card-content">
          <h2>Gyroscope 3D</h2>
          <p>Orientation Reactive</p>
        </div>
      </div>
    </main>
  </div>

  <script>
    const card = document.getElementById('tiltCard');
    
    // Mouse fallback
    document.addEventListener('mousemove', (e) => {
      const { innerWidth, innerHeight } = window;
      const rotateX = ((e.clientY / innerHeight) - 0.5) * -30;
      const rotateY = ((e.clientX / innerWidth) - 0.5) * 30;
      card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
    });

    // Device orientation for mobile
    if (window.DeviceOrientationEvent) {
      window.addEventListener('deviceorientation', (e) => {
        const rotateX = e.beta ? e.beta * 0.3 : 0;
        const rotateY = e.gamma ? e.gamma * 0.3 : 0;
        card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
      });
    }
  </script>
</body>
</html>
