<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Blur-Entrance Progress Bar</title>

<link rel="stylesheet" href="style.css">

</head>

<body>


<section class="progress-section">


<div class="container">


<span class="tag">
SAAS ANALYTICS PLATFORM
</span>


<h1>
Project Performance Overview
</h1>


<p class="subtitle">
A pure CSS Blur-Entrance Progress Bar for modern SaaS showcase layouts.
</p>



<div class="progress-card">



<div class="progress-item">

<div class="header">

<h2>
Cloud Infrastructure
</h2>

<span>
88%
</span>

</div>


<div class="track">

<div class="fill first">

<div class="percentage">
88%
</div>

</div>

</div>


</div>




<div class="progress-item">

<div class="header">

<h2>
AI Model Training
</h2>

<span>
76%
</span>

</div>


<div class="track">

<div class="fill second">

<div class="percentage">
76%
</div>

</div>

</div>


</div>




<div class="progress-item">

<div class="header">

<h2>
User Growth
</h2>

<span>
95%
</span>

</div>


<div class="track">

<div class="fill third">

<div class="percentage">
95%
</div>

</div>

</div>


</div>



<div class="status">

<div class="pulse"></div>

<div>

<h3>
System Optimized
</h3>

<p>
All SaaS metrics are performing efficiently.
</p>

</div>

</div>



</div>


</div>


</section>


</body>

</html>
