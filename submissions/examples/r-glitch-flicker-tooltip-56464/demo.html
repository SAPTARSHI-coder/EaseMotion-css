<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Glitch-Flicker Tooltip</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<section class="tooltip-section">

<h1>Gaming Hub Tooltips</h1>

<div class="tooltip-grid">

<div class="tooltip-item">
<button class="tooltip-btn">🎮 Battle Pass</button>
<span class="tooltip">Unlock premium missions and exclusive seasonal rewards.</span>
</div>

<div class="tooltip-item">
<button class="tooltip-btn">⚔️ Weapon</button>
<span class="tooltip">Legendary weapon with increased attack speed and damage.</span>
</div>

<div class="tooltip-item">
<button class="tooltip-btn">🛡️ Shield</button>
<span class="tooltip">Blocks powerful attacks while restoring defense.</span>
</div>

<div class="tooltip-item">
<button class="tooltip-btn">💎 Treasure</button>
<span class="tooltip">Collect rare crystals to unlock exclusive cosmetics.</span>
</div>

</div>

</section>

</body>
</html>
