<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pantograph Contact Rise — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Pantograph Contact Rise demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Pantograph Contact Rise</h1>
      <p class="lede">Pantograph rising to the contact wire</p>
    </header>

    <section class="ease-pantograph-contact-rise" data-demo="pantograph-contact-rise" aria-live="polite">
      <div class="ease-pantograph-contact-rise__housing">
        <div class="ease-pantograph-contact-rise__bezel">
          <div class="ease-pantograph-contact-rise__face">
            <div class="ease-pantograph-contact-rise__readout">
              <span class="ease-pantograph-contact-rise__label">Pantograph Contact Rise</span>
              <span class="ease-pantograph-contact-rise__value">LIVE</span>
            </div>
            <div class="ease-pantograph-contact-rise__motion" aria-hidden="true">
              <span class="ease-pantograph-contact-rise__a"></span>
              <span class="ease-pantograph-contact-rise__b"></span>
              <span class="ease-pantograph-contact-rise__c"></span>
              <span class="ease-pantograph-contact-rise__d"></span>
            </div>
            <div class="ease-pantograph-contact-rise__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-pantograph-contact-rise__controls">
          <button type="button" class="ease-pantograph-contact-rise__btn primary">Raise</button>
          <button type="button" class="ease-pantograph-contact-rise__btn">Drop</button>
          <label class="ease-pantograph-contact-rise__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-pantograph-contact-rise__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
