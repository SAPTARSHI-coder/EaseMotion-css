<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Email Subscription Card - EaseMotion CSS</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Glowing gradient backdrop wrapper -->
  <main class="page">

    <!-- Premium glassmorphism subscription card -->
    <section class="subscribe-card" aria-labelledby="subscribe-heading">

      <span class="subscribe-icon" aria-hidden="true">&#9993;</span>

      <h1 id="subscribe-heading">Stay in the loop</h1>
      <p class="subscribe-copy">
        Get product updates, new animation releases, and behind-the-scenes notes
        from EaseMotion CSS — straight to your inbox.
      </p>

      <form class="subscribe-form" action="#" method="post">
        <label for="subscribeEmail" class="visually-hidden">Email address</label>
        <input
          type="email"
          id="subscribeEmail"
          name="email"
          class="subscribe-input"
          placeholder="you@example.com"
          autocomplete="email"
          required
        >
        <button type="submit" class="subscribe-btn">Subscribe</button>
      </form>

      <p class="privacy-note">&#128274; No spam. Unsubscribe anytime.</p>

    </section>

  </main>

</body>
</html>
