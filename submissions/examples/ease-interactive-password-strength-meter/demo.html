<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ease Password Strength Liquid Gauge</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="pass-body">
  <div class="pass-card">
    <input type="password" id="passInput" placeholder="Enter password..." />
    <div class="pass-meter"><div class="pass-fill" id="passFill"></div></div>
  </div>

  <script>
    const input = document.getElementById('passInput');
    const fill = document.getElementById('passFill');

    input.addEventListener('input', (e) => {
      const len = e.target.value.length;
      const pct = Math.min(100, len * 10);
      fill.style.width = `${pct}%`;
      fill.style.background = pct < 40 ? '#ef4444' : pct < 80 ? '#eab308' : '#22c55e';
    });
  </script>
</body>
</html>
