<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Accessible CSS hotel star rating component"
  >
  <title>CSS Hotel Star Rating</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section class="hotel-card" aria-labelledby="hotel-name">
      <div class="hotel-image" aria-hidden="true">
        <div class="building">
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>

      <div class="hotel-content">
        <div class="hotel-category">Luxury Hotel</div>

        <h1 id="hotel-name">The Grand Aurora</h1>

        <p class="location">New Delhi · India</p>

        <div class="rating-row">
          <div
            class="stars"
            role="img"
            aria-label="4.8 out of 5 stars"
          >
            <span aria-hidden="true">★</span>
            <span aria-hidden="true">★</span>
            <span aria-hidden="true">★</span>
            <span aria-hidden="true">★</span>
            <span class="partial-star" aria-hidden="true">★</span>
          </div>

          <strong class="rating-number">4.8</strong>
          <span class="review-count">326 reviews</span>
        </div>

        <div class="rating-breakdown" aria-label="Rating breakdown">
          <div class="rating-line">
            <span>5</span>
            <span class="mini-star" aria-hidden="true">★</span>
            <div class="bar">
              <span style="width: 86%"></span>
            </div>
            <span>86%</span>
          </div>

          <div class="rating-line">
            <span>4</span>
            <span class="mini-star" aria-hidden="true">★</span>
            <div class="bar">
              <span style="width: 10%"></span>
            </div>
            <span>10%</span>
          </div>

          <div class="rating-line">
            <span>3</span>
            <span class="mini-star" aria-hidden="true">★</span>
            <div class="bar">
              <span style="width: 3%"></span>
            </div>
            <span>3%</span>
          </div>

          <div class="rating-line">
            <span>2</span>
            <span class="mini-star" aria-hidden="true">★</span>
            <div class="bar">
              <span style="width: 1%"></span>
            </div>
            <span>1%</span>
          </div>
        </div>

        <button type="button" class="review-button">
          Read guest reviews
        </button>
      </div>
    </section>
  </main>
</body>
</html>
