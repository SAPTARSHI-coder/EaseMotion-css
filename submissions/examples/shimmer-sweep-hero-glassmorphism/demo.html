<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CSS shimmer-sweep hero section for glassmorphism UI layouts">
  <title>Shimmer-Sweep Hero — Glassmorphism</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="ssh-nav">
    <span class="ssh-nav__brand">Prism</span>
    <span class="ssh-nav__gap"></span>
    <span class="ssh-nav__item">Product</span>
    <span class="ssh-nav__item">Pricing</span>
    <span class="ssh-nav__item ssh-nav__item--cta">Sign Up</span>
  </nav>

  <section class="ssh-hero">
    <div class="ssh-hero__glow"></div>
    <div class="ssh-hero__inner">
      <p class="ssh-hero__badge">New in v2.0</p>
      <h1 class="ssh-hero__title">Ship faster with zero friction</h1>
      <p class="ssh-hero__sub">A lightweight platform for building, deploying, and scaling modern apps without the overhead.</p>
      <div class="ssh-hero__actions">
        <button class="ssh-hero__btn ssh-hero__btn--primary">Get Started</button>
        <button class="ssh-hero__btn ssh-hero__btn--ghost">View Docs</button>
      </div>
    </div>
  </section>

</body>
</html>
