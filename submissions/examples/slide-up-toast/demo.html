<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="CSS Slide-Up Toast for fintech dashboard layouts">
    <title>Slide-Up Toast</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="demo">
        <section class="dashboard">
            <span class="label">FINTECH DASHBOARD</span>
            <h1>Transaction Center</h1>
            <p class="subtitle">
                Monitor your latest account activity.
            </p>

            <div class="stats">
                <div class="stat">
                    <span>Available Balance</span>
                    <strong>$24,850</strong>
                </div>

                <div class="stat">
                    <span>Monthly Spending</span>
                    <strong>$3,240</strong>
                </div>
            </div>

            <div class="toast" role="status">
                <div class="toast-icon">✓</div>

                <div class="toast-content">
                    <strong>Payment Successful</strong>
                    <p>Your payment of $250.00 was processed successfully.</p>
                </div>

                <button class="toast-close" type="button" aria-label="Close notification">
                    ×
                </button>
            </div>
        </section>
    </main>

</body>
</html>
