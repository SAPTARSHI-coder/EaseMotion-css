<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hover Tab Bar | Pastel Styling</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="tab-card" tabindex="0" aria-label="Pastel Hover Tab Bar Showcase">
    <h1 class="tab-title">Pastel Hover Tab Bar</h1>
    <p class="tab-subtitle">Fluid tab navigation with soft pastel hover fills and smooth transforms</p>

    <nav aria-label="Tab navigation">
        <div class="tab-bar" role="tablist">
            <div class="tab-item" role="presentation">
                <a href="#overview" class="tab-link active" role="tab" aria-selected="true">Overview</a>
            </div>
            <div class="tab-item" role="presentation">
                <a href="#analytics" class="tab-link" role="tab" aria-selected="false">Analytics</a>
            </div>
            <div class="tab-item" role="presentation">
                <a href="#reports" class="tab-link" role="tab" aria-selected="false">Reports</a>
            </div>
            <div class="tab-item" role="presentation">
                <a href="#settings" class="tab-link" role="tab" aria-selected="false">Settings</a>
            </div>
        </div>
    </nav>
</main>

</body>
</html>
