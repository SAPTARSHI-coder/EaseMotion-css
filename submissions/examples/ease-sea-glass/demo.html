<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sea Glass · Frosted Glass with Ocean Colors</title>
    <meta name="description" content="Frosted sea glass pieces with ocean colors, translucent layers, and gentle floating animation.">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1 class="title">🫧 SEA GLASS</h1>
        
        <div class="canvas-wrapper">
            <canvas id="glassCanvas" width="600" height="500"></canvas>
            <div class="glow-overlay"></div>
        </div>

        <div class="controls">
            <button class="toggle-btn" id="toggleBtn">⏸️ PAUSE</button>
            <button class="reset-btn" id="resetBtn">⟳ RESET</button>
            <div class="speed-control">
                <label>Speed</label>
                <input type="range" id="speedSlider" min="1" max="10" value="5">
                <span id="speedLabel">5</span>
            </div>
        </div>

        <div class="info">
            <span>🫧 SEA GLASS</span>
            <small>frosted · ocean colors · translucent</small>
        </div>
        <div class="hint">
            <span>🌊 frosted glass pieces with ocean colors and gentle glow</span>
        </div>
    </div>

    <script>
        (function() {
            const canvas = document.getElementById('glassCanvas');
            const ctx = canvas.getContext('2d');
            const W = 600, H = 500;
            
            const toggleBtn = document.getElementById('toggleBtn');
            const resetBtn = document.getElementById('resetBtn');
            const speedSlider = document.getElementById('speedSlider');
            const speedLabel = document.getElementById('speedLabel');

            let isAnimating = true;
            let speed = 5;
            let time = 0;

            // ---- Sea Glass Piece Class ----
            class SeaGlass {
                constructor(x, y) {
                    this.x = x || Math.random() * W;
                    this.y = y || Math.random() * H;
                    this.size = 20 + Math.random() * 30;
                    this.rotation = Math.random() * Math.PI * 2;
                    this.rotationSpeed = (Math.random() - 0.5) * 0.01;
                    
                    // Ocean colors - frosted glass palette
                    this.colors = this.randomGlassColors();
                    
                    // Float animation
                    this.floatPhase = Math.random() * Math.PI * 2;
                    this.floatSpeed = 0.005 + Math.random() * 0.01;
                    this.floatAmplitude = 10 + Math.random() * 20;
                    
                    // Shape - irregular organic shape
                    this.shapePoints = [];
                    const numPoints = 8 + Math.floor(Math.random() * 6);
                    for (let i = 0; i < numPoints; i++) {
                        const angle = (i / numPoints) * Math.PI * 2;
                        const radius = 0.6 + Math.random() * 0.4;
                        this.shapePoints.push({ angle, radius });
                    }
                    
                    // Frosted texture (faux)
                    this.frostSeed = Math.random() * 1000;
                    this.opacity = 0.3 + Math.random() * 0.4;
                }

                randomGlassColors() {
                    const palettes = [
                        // Ocean blues
                        ['#4a90d9', '#6bb5e8', '#2d6ba8', '#8ec9e8'],
                        // Seafoam greens
                        ['#5cb8a0', '#7ad0b8', '#3d9a82', '#9adcc8'],
                        // Aqua
                        ['#4db8c8', '#70d0d8', '#2a8a9a', '#8ad0d8'],
                        // Teal
                        ['#3a8a8a', '#5aaaaa', '#2a6a6a', '#7ababa'],
                        // Deep ocean
                        ['#2a5a7a', '#4a7a9a', '#1a4a6a', '#6a9aba'],
                        // Sea green
                        ['#4a9a7a', '#6aba9a', '#2a7a5a', '#8adaba'],
                        // Misty blue
                        ['#6a8aaa', '#8aaaCa', '#4a6a8a', '#aacada'],
                        // Coral tinged
                        ['#8a7a7a', '#aa9a9a', '#6a5a5a', '#caaaaa']
                    ];
                    return palettes[Math.floor(Math.random() * palettes.length)];
                }

                update() {
                    const dt = speed / 5;
                    this.floatPhase += this.floatSpeed * dt;
                    this.rotation += this.rotationSpeed * dt;
                    
                    // Float motion
                    this.x += Math.sin(this.floatPhase * 0.7 + 1) * 0.1 * dt;
                    this.y += Math.sin(this.floatPhase) * this.floatAmplitude * 0.01 * dt;
                    
                    // Keep in bounds
                    const margin = this.size;
                    if (this.x < margin) this.x = margin;
                    if (this.x > W - margin) this.x = W - margin;
                    if (this.y < margin) this.y = margin;
                    if (this.y > H - margin) this.y = H - margin;
                }

                draw(ctx) {
                    ctx.save();
                    ctx.translate(this.x, this.y);
                    ctx.rotate(this.rotation);
                    
                    const size = this.size;
                    const opacity = this.opacity;
                    
                    // ---- Glow ----
                    const glowGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, size * 1.5);
                    const mainColor = this.colors[0];
                    glowGrad.addColorStop(0, mainColor + '20');
                    glowGrad.addColorStop(0.5, mainColor + '10');
                    glowGrad.addColorStop(1, 'rgba(0,0,0,0)');
                    ctx.fillStyle = glowGrad;
                    ctx.beginPath();
                    ctx.arc(0, 0, size * 1.5, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // ---- Frosted glass body ----
                    ctx.shadowColor = mainColor + '30';
                    ctx.shadowBlur = 20;
                    
                    // Build shape path
                    ctx.beginPath();
                    for (let i = 0; i < this.shapePoints.length; i++) {
                        const p = this.shapePoints[i];
                        const angle = p.angle + Math.sin(this.floatPhase * 0.5 + i) * 0.1;
                        const r = size * p.radius * (0.9 + Math.sin(this.floatPhase * 0.3 + i * 2) * 0.1);
                        const x = Math.cos(angle) * r;
                        const y = Math.sin(angle) * r;
                        if (i === 0) ctx.moveTo(x, y);
                        else ctx.lineTo(x, y);
                    }
                    ctx.closePath();
                    
                    // Fill with frosted glass gradient
                    const grad = ctx.createRadialGradient(
                        -size * 0.3, -size * 0.3, 0,
                        0, 0, size
                    );
                    grad.addColorStop(0, this.colors[1] + '80');
                    grad.addColorStop(0.3, this.colors[0] + '60');
                    grad.addColorStop(0.6, this.colors[2] + '50');
                    grad.addColorStop(0.85, this.colors[3] + '40');
                    grad.addColorStop(1, this.colors[2] + '30');
                    ctx.fillStyle = grad;
                    ctx.fill();
                    
                    // ---- Frosted texture (micro dots) ----
                    ctx.shadowBlur = 0;
                    for (let i = 0; i < 30; i++) {
                        const angle = (i * 37 + this.frostSeed) % 360;
                        const dist = (i * 13 + this.frostSeed * 0.5) % 100 / 100;
                        const r = size * dist * 0.8;
                        const x = Math.cos(angle * Math.PI / 180) * r;
                        const y = Math.sin(angle * Math.PI / 180) * r * 0.7;
                        const dotSize = 1 + (i % 3) * 0.5;
                        const alpha = 0.05 + (i % 5) * 0.02;
                        ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                        ctx.beginPath();
                        ctx.arc(x, y, dotSize, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    
                    // ---- Frosted surface highlights ----
                    ctx.shadowBlur = 0;
                    
                    // Main highlight (frosted reflection)
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
                    ctx.beginPath();
                    ctx.ellipse(
                        -size * 0.2,
                        -size * 0.25,
                        size * 0.35,
                        size * 0.15,
                        -0.5,
                        0,
                        Math.PI * 2
                    );
                    ctx.fill();
                    
                    // Secondary highlight
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';
                    ctx.beginPath();
                    ctx.ellipse(
                        size * 0.15,
                        -size * 0.1,
                        size * 0.2,
                        size * 0.1,
                        0.3,
                        0,
                        Math.PI * 2
                    );
                    ctx.fill();
                    
                    // ---- Edge glow (translucent edge) ----
                    ctx.shadowColor = this.colors[0] + '20';
                    ctx.shadowBlur = 15;
                    ctx.strokeStyle = this.colors[1] + '30';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    for (let i = 0; i < this.shapePoints.length; i++) {
                        const p = this.shapePoints[i];
                        const angle = p.angle + Math.sin(this.floatPhase * 0.5 + i) * 0.1;
                        const r = size * p.radius * (0.9 + Math.sin(this.floatPhase * 0.3 + i * 2) * 0.1);
                        const x = Math.cos(angle) * r;
                        const y = Math.sin(angle) * r;
                        if (i === 0) ctx.moveTo(x, y);
                        else ctx.lineTo(x, y);
                    }
                    ctx.closePath();
                    ctx.stroke();
                    
                    ctx.restore();
                }
            }

            // ---- Create Sea Glass Pieces ----
            let glassPieces = [];
            const numPieces = 12;

            function createGlassPieces() {
                glassPieces = [];
                for (let i = 0; i < numPieces; i++) {
                    const x = 30 + Math.random() * (W - 60);
                    const y = 30 + Math.random() * (H - 60);
                    const piece = new SeaGlass(x, y);
                    piece.size = 15 + Math.random() * 35;
                    piece.floatAmplitude = 10 + Math.random() * 25;
                    piece.floatSpeed = 0.005 + Math.random() * 0.015;
                    glassPieces.push(piece);
                }
            }

            // ---- Draw Background ----
            function drawBackground() {
                // Sandy ocean floor gradient
                const gradient = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, W);
                gradient.addColorStop(0, '#1a3a5a');
                gradient.addColorStop(0.3, '#0d2a4a');
                gradient.addColorStop(0.6, '#0a1a2a');
                gradient.addColorStop(0.8, '#0d1a25');
                gradient.addColorStop(1, '#050a12');
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, W, H);
                
                // Sandy bottom
                const sandGrad = ctx.createLinearGradient(0, H - 40, 0, H);
                sandGrad.addColorStop(0, 'rgba(139, 119, 90, 0)');
                sandGrad.addColorStop(0.5, 'rgba(139, 119, 90, 0.15)');
                sandGrad.addColorStop(1, 'rgba(139, 119, 90, 0.25)');
                ctx.fillStyle = sandGrad;
                ctx.fillRect(0, H - 40, W, 40);
                
                // Light rays through water
                for (let i = 0; i < 5; i++) {
                    const x = 50 + i * 125 + Math.sin(time * 0.005 + i * 1.5) * 30;
                    const gradient2 = ctx.createLinearGradient(x, 0, x + 15, H);
                    gradient2.addColorStop(0, `rgba(100, 200, 255, ${0.015 + Math.sin(time * 0.01 + i) * 0.01})`);
                    gradient2.addColorStop(0.5, `rgba(100, 200, 255, ${0.008})`);
                    gradient2.addColorStop(1, 'rgba(100, 200, 255, 0)');
                    ctx.fillStyle = gradient2;
                    ctx.fillRect(x, 0, 15, H);
                }
                
                // Bubbles
                for (let i = 0; i < 20; i++) {
                    const x = (i * 173 + 30) % W;
                    const y = (i * 97 + time * (0.1 + i * 0.005) * 5) % H;
                    const size = 1 + (i % 4) * 0.5;
                    const alpha = 0.015 + Math.sin(time * 0.01 + i * 2) * 0.01;
                    ctx.fillStyle = `rgba(200, 230, 255, ${alpha})`;
                    ctx.beginPath();
                    ctx.arc(x, y, size, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // ---- Animation Loop ----
            function animate() {
                if (!isAnimating) {
                    requestAnimationFrame(animate);
                    return;
                }
                
                drawBackground();
                
                for (let piece of glassPieces) {
                    piece.update();
                    piece.draw(ctx);
                }
                
                // Ambient sparkles
                for (let i = 0; i < 15; i++) {
                    const x = (i * 197 + 40) % W;
                    const y = (i * 131 + time * (0.02 + i * 0.005) * 4) % H;
                    const size = 0.5 + Math.sin(time * 0.02 + i * 3) * 0.5 + 0.5;
                    const hue = (i * 40 + 200 + time * 5) % 360;
                    ctx.fillStyle = `hsla(${hue}, 60%, 80%, ${0.01 + Math.sin(time * 0.015 + i) * 0.008})`;
                    ctx.beginPath();
                    ctx.arc(x, y, size, 0, Math.PI * 2);
                    ctx.fill();
                }
                
                requestAnimationFrame(animate);
            }

            // ---- Toggle Animation ----
            function toggleAnimation() {
                isAnimating = !isAnimating;
                toggleBtn.textContent = isAnimating ? '⏸️ PAUSE' : '▶️ PLAY';
            }

            // ---- Reset ----
            function resetGlass() {
                createGlassPieces();
                time = 0;
            }

            // ---- Speed Control ----
            speedSlider.addEventListener('input', function() {
                speed = parseInt(this.value);
                speedLabel.textContent = speed;
            });

            // ---- Event Listeners ----
            toggleBtn.addEventListener('click', toggleAnimation);
            resetBtn.addEventListener('click', resetGlass);

            // ---- Keyboard Shortcuts ----
            document.addEventListener('keydown', function(e) {
                if (e.key === ' ' || e.key === 'Space') {
                    e.preventDefault();
                    toggleAnimation();
                }
                if (e.key === 'r' || e.key === 'R') {
                    resetGlass();
                }
            });

            // ---- Initialize ----
            createGlassPieces();
            animate();

            console.log('🫧 Sea Glass · Press Space to pause · R to reset');
        })();
    </script>
</body>
</html>
