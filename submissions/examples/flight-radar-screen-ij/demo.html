<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-flight-radar-screen</title>
</head>
<body>
<main class="frs-card">
  <header class="frs-head">
    <h1 class="frs-title">Flight Radar</h1>
    <span class="frs-range">40 NM</span>
  </header>
  <section class="frs-screen" aria-label="radar screen">
    <span class="frs-ring frs-ring-1"></span>
    <span class="frs-ring frs-ring-2"></span>
    <span class="frs-ring frs-ring-3"></span>
    <span class="frs-sweep"></span>
    <span class="frs-blip frs-blip-1"></span>
    <span class="frs-blip frs-blip-2"></span>
    <span class="frs-blip frs-blip-3"></span>
    <span class="frs-airport">EASE</span>
    <span class="frs-coord">34.05N 118.24W</span>
  </section>
  <footer class="frs-foot">
    <span class="frs-count">12 flights</span>
    <span class="frs-refresh">Live</span>
  </footer>
</main>
</body>
</html>
