<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Rotate-Fade Hero Section for product catalog layouts">
    <title>Rotate-Fade Hero Section</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main>
        <section class="hero">

            <div class="hero-orbit hero-orbit-one"></div>
            <div class="hero-orbit hero-orbit-two"></div>

            <div class="hero-content">

                <p class="eyebrow">EASEMOTION CSS</p>

                <h1>
                    Products That
                    <span>Move With You</span>
                </h1>

                <p class="hero-description">
                    Discover a carefully selected collection of products
                    combining modern design, practical features and
                    everyday performance.
                </p>

                <div class="hero-actions">
                    <a href="#" class="hero-button primary-button">
                        Explore Products
                    </a>

                    <a href="#" class="hero-button secondary-button">
                        View Collection
                    </a>
                </div>

            </div>

            <div class="floating-card card-one">
                <span class="card-label">NEW</span>
                <strong>Modern Design</strong>
            </div>

            <div class="floating-card card-two">
                <span class="card-label">FEATURED</span>
                <strong>Premium Quality</strong>
            </div>

        </section>
    </main>

</body>
</html>
