cat > submissions/examples/ease-magnetic-hover/demo.html <<'EOF'
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ease Magnetic Hover</title>
  <link rel="stylesheet" href="./style.css" />
</head>

<body>
  <main class="demo">
    <p class="eyebrow">EaseMotion CSS</p>
    <h1>Magnetic Hover</h1>
    <p class="description">
      Move your cursor around the button and watch it gently follow.
    </p>

    <div class="magnetic-area">
      <button class="ease-magnetic-hover">
        Hover me
      </button>
    </div>
  </main>

  <script>
    const buttons = document.querySelectorAll(".ease-magnetic-hover");

    buttons.forEach((button) => {
      button.addEventListener("mousemove", (event) => {
        if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
          return;
        }

        const rect = button.getBoundingClientRect();

        const x = event.clientX - (rect.left + rect.width / 2);
        const y = event.clientY - (rect.top + rect.height / 2);

        const strength = 0.25;

        button.style.setProperty("--magnetic-x", `${x * strength}px`);
        button.style.setProperty("--magnetic-y", `${y * strength}px`);
      });

      button.addEventListener("mouseleave", () => {
        button.style.setProperty("--magnetic-x", "0px");
        button.style.setProperty("--magnetic-y", "0px");
      });
    });
  </script>
</body>
</html>
EOF
