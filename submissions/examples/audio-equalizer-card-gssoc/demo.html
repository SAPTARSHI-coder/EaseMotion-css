<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audio Equalizer Card Demo</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="demo-wrapper">
    <div class="audio-card">
      <div class="audio-card-header">
        <span class="now-playing-tag">NOW PLAYING</span>
        <span class="live-indicator">LIVE</span>
      </div>

      <div class="equalizer-visualizer">
        <div class="equalizer-bar bar-1"></div>
        <div class="equalizer-bar bar-2"></div>
        <div class="equalizer-bar bar-3"></div>
        <div class="equalizer-bar bar-4"></div>
        <div class="equalizer-bar bar-5"></div>
        <div class="equalizer-bar bar-6"></div>
        <div class="equalizer-bar bar-7"></div>
        <div class="equalizer-bar bar-8"></div>
        <div class="equalizer-bar bar-9"></div>
        <div class="equalizer-bar bar-10"></div>
      </div>

      <div class="audio-details">
        <h3 class="track-title">Synthwave Resonance</h3>
        <p class="track-artist">Neon Horizon • 128 BPM</p>
      </div>

      <div class="audio-controls">
        <button type="button" class="control-btn prev-btn" aria-label="Previous Track">⏮</button>
        <button type="button" class="control-btn play-btn" aria-label="Play or Pause">⏸</button>
        <button type="button" class="control-btn next-btn" aria-label="Next Track">⏭</button>
      </div>
    </div>
  </main>
</body>
</html>
