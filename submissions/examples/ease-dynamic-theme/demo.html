<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ease Dynamic Theme Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="ease-picker-wrapper">
    <label for="theme-color">Choose Base Color:</label>
    <input type="color" id="theme-color" value="#3b82f6" oninput="document.documentElement.style.setProperty('--ease-primary', this.value)">
  </div>

  <div class="ease-theme-card">
    <div class="ease-theme-badge">Dynamic UI</div>
    <h2 style="margin: 0; font-size: 1.5rem;">Color-Mix Engine</h2>
    <p class="ease-theme-text">Notice how the badge background, the border, this text, and the button hover state all adapt automatically when you change the base color.</p>
    <button class="ease-theme-button">Submit</button>
  </div>
</body>
</html>
