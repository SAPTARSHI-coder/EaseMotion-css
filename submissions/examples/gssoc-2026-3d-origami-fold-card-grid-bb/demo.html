<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Origami Fold Card Grid | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="grid-container">
    <div class="origami-card">
      <div class="fold fold-top">
        <div class="card-icon">⚡</div>
        <h3>Ultra Speed</h3>
      </div>
      <div class="fold fold-bottom">
        <p>Engineered for lightning-fast 3D transform acceleration with minimal reflow penalty.</p>
        <button class="action-btn">Discover More</button>
      </div>
    </div>

    <div class="origami-card">
      <div class="fold fold-top">
        <div class="card-icon">🛡️</div>
        <h3>Zero Defect</h3>
      </div>
      <div class="fold fold-bottom">
        <p>Strict responsive CSS layout grid supporting fluid dynamic viewports seamlessly.</p>
        <button class="action-btn">Inspect Specs</button>
      </div>
    </div>

    <div class="origami-card">
      <div class="fold fold-top">
        <div class="card-icon">💎</div>
        <h3>Pure Elegance</h3>
      </div>
      <div class="fold fold-bottom">
        <p>Tactile paper unfold interaction utilizing hardware-accelerated CSS perspective.</p>
        <button class="action-btn">View Gallery</button>
      </div>
    </div>
  </div>
</body>
</html>
