<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Interactive SaaS modern cookie banner built with pure HTML and CSS"
    >

    <title>Interactive SaaS Cookie Banner</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="saas-page">

        <section
            class="cookie-banner"
            aria-labelledby="cookie-title"
        >

            <div class="cookie-banner__accent"></div>

            <div class="cookie-banner__main">

                <div
                    class="cookie-banner__icon"
                    aria-hidden="true"
                >
                    <svg
                        viewBox="0 0 48 48"
                        fill="none"
                        xmlns="http://www.w3.org/2000/svg"
                    >
                        <path
                            d="M38.5 25.5C37.1 27.1 34.9 28 32.5 28C28.1 28 24.5 24.4 24.5 20C24.5 17.6 25.4 15.4 27 14"
                            stroke="currentColor"
                            stroke-width="2.6"
                            stroke-linecap="round"
                        />

                        <path
                            d="M38.2 24.3C39.3 23.1 40 21.5 40 19.7C40 15.4 36.6 12 32.3 12C31.5 12 30.7 12.1 30 12.3C28.2 7.3 23.4 4 17.8 4C10.7 4 5 9.7 5 16.8C5 17.7 5.1 18.6 5.3 19.5C3.8 21.5 3 24 3 26.7C3 33.9 8.8 39.7 16 39.7H30.8C36.5 39.7 41 35.1 41 29.5C41 27.6 40.5 25.8 39.6 24.3"
                            stroke="currentColor"
                            stroke-width="2.6"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        />

                        <circle
                            cx="14"
                            cy="22"
                            r="2"
                            fill="currentColor"
                        />

                        <circle
                            cx="20"
                            cy="31"
                            r="2"
                            fill="currentColor"
                        />

                        <circle
                            cx="12"
                            cy="30"
                            r="1.5"
                            fill="currentColor"
                        />
                    </svg>
                </div>


                <div class="cookie-banner__content">

                    <div class="cookie-banner__label">
                        PRIVACY
                    </div>

                    <h1 id="cookie-title">
                        We value your privacy
                    </h1>

                    <p>
                        We use cookies to personalize content,
                        analyze traffic, and improve your experience.
                        Choose how you'd like us to use them.
                    </p>

                    <div class="cookie-banner__meta">

                        <span class="cookie-meta">
                            <span
                                class="cookie-meta__dot"
                                aria-hidden="true"
                            ></span>

                            Privacy-first
                        </span>

                        <span class="cookie-meta">
                            Secure preferences
                        </span>

                    </div>

                </div>

            </div>


            <div class="cookie-banner__actions">

                <a
                    href="#cookie-preferences"
                    class="cookie-link"
                >
                    Manage cookies
                </a>

                <button
                    type="button"
                    class="saas-button saas-button--secondary"
                >
                    Decline
                </button>

                <button
                    type="button"
                    class="saas-button saas-button--primary"
                >
                    Accept all
                </button>

            </div>

        </section>


        <section
            id="cookie-preferences"
            class="cookie-preferences"
            aria-labelledby="preferences-title"
        >

            <div class="preferences-header">

                <div>
                    <span class="preferences-header__label">
                        PREFERENCES
                    </span>

                    <h2 id="preferences-title">
                        Cookie settings
                    </h2>
                </div>

                <span class="preferences-header__badge">
                    3 categories
                </span>

            </div>


            <div class="preference-list">

                <label class="preference-item">

                    <span class="preference-item__copy">

                        <strong>
                            Essential
                        </strong>

                        <small>
                            Required for core website functionality.
                        </small>

                    </span>

                    <span class="preference-switch">

                        <input
                            type="checkbox"
                            checked
                            disabled
                        >

                        <span class="preference-switch__track">
                            <span class="preference-switch__thumb"></span>
                        </span>

                    </span>

                </label>


                <label class="preference-item">

                    <span class="preference-item__copy">

                        <strong>
                            Analytics
                        </strong>

                        <small>
                            Helps us understand product usage.
                        </small>

                    </span>

                    <span class="preference-switch">

                        <input type="checkbox">

                        <span class="preference-switch__track">
                            <span class="preference-switch__thumb"></span>
                        </span>

                    </span>

                </label>


                <label class="preference-item">

                    <span class="preference-item__copy">

                        <strong>
                            Personalization
                        </strong>

                        <small>
                            Remembers settings and preferences.
                        </small>

                    </span>

                    <span class="preference-switch">

                        <input type="checkbox">

                        <span class="preference-switch__track">
                            <span class="preference-switch__thumb"></span>
                        </span>

                    </span>

                </label>

            </div>


            <button
                type="button"
                class="saas-button saas-button--save"
            >
                Save preferences
            </button>

        </section>

    </main>

</body>
</html>
