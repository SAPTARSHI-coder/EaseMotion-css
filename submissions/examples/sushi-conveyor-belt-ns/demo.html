<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sushi Conveyor Belt — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Sushi Conveyor Belt demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Sushi Conveyor Belt</h1>
      <p class="lede">Sushi plates gliding along a continuous conveyor belt loop</p>
    </header>

    <section class="ease-sushi-conveyor-belt" data-demo="sushi-conveyor-belt" aria-live="polite">
      <div class="ease-sushi-conveyor-belt__housing">
        <div class="ease-sushi-conveyor-belt__bezel">
          <div class="ease-sushi-conveyor-belt__face">
            <div class="ease-sushi-conveyor-belt__readout">
              <span class="ease-sushi-conveyor-belt__label">Sushi Conveyor Belt</span>
              <span class="ease-sushi-conveyor-belt__value" id="val-sushi-conveyor-belt">READY</span>
            </div>
            <div class="ease-sushi-conveyor-belt__motion" aria-hidden="true">
              <span class="ease-sushi-conveyor-belt__arm"></span>
              <span class="ease-sushi-conveyor-belt__core"></span>
              <span class="ease-sushi-conveyor-belt__trail"></span>
              <span class="ease-sushi-conveyor-belt__mark m1"></span>
              <span class="ease-sushi-conveyor-belt__mark m2"></span>
              <span class="ease-sushi-conveyor-belt__mark m3"></span>
            </div>
            <div class="ease-sushi-conveyor-belt__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-sushi-conveyor-belt__controls">
          <button type="button" class="ease-sushi-conveyor-belt__btn primary">Engage</button>
          <button type="button" class="ease-sushi-conveyor-belt__btn">Reset</button>
          <label class="ease-sushi-conveyor-belt__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-sushi-conveyor-belt__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
