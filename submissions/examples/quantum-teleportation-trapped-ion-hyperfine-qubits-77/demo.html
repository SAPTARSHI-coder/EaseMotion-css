<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trapped Ion Hyperfine Qubits - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css"></head><body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030712; color: #ffffff;">

    <div class="ease-card ease-card-glass ion-container">
        <div class="ion-header">
            <h2>Trapped Ion Qubits</h2>
            <span class="ease-badge ease-badge-success">Confining</span>
        </div>
        
        <div class="ion-screen ease-center">
            <div class="ion-flux flux-ion-a"></div>
            <div class="ion-flux flux-ion-b"></div>
            <div class="ion-boundary-ring"></div>
            <div class="ion-core ease-center"></div>
        </div>

        <div class="ion-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Paul Trap RF Fields &amp; Raman Beams</span>
            <button class="ease-btn ease-btn-success ease-btn-sm ease-hover-grow">Run Ion Trap</button>
        </div>
    </div></body></html>
