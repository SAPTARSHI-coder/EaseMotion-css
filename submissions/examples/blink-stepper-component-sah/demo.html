<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blink Stepper Component - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="stepper-card">
    <h1>Blink Stepper Component (<code>#54690</code>)</h1>
    <p class="desc">Active workflow milestone nodes pulse indefinitely with clean orbital ring glow animation.</p>
    
    <div class="ease-stepper-blink">
      <div class="step-item done">
        <div class="step-icon">✓</div>
        <span class="step-label">Claim Issues</span>
      </div>
      <div class="step-line done"></div>
      
      <div class="step-item done">
        <div class="step-icon">✓</div>
        <span class="step-label">Implement UI</span>
      </div>
      <div class="step-line active"></div>
      
      <div class="step-item active">
        <div class="step-icon blink-node">3</div>
        <span class="step-label active">CI Automated PRs</span>
      </div>
      <div class="step-line"></div>
      
      <div class="step-item pending">
        <div class="step-icon">4</div>
        <span class="step-label">Merged to Main</span>
      </div>
    </div>
  </div>
</body>
</html>
