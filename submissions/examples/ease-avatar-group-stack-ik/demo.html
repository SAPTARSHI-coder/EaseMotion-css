<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EaseMotion CSS — Avatar Group Stack Showcase</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="av-demo-wrapper">
    <header class="av-header">
      <span class="badge">UI Component Showcase</span>
      <h1>Overlapping Avatar Group Stack</h1>
      <p>Overlapping user avatar stack featuring hover spread micro-animations, active ring highlights, and tooltip reveals.</p>
    </header>

    <main class="av-card">
      <div class="ease-avatar-stack">
        <div class="avatar-item" data-tooltip="Ishita Katiyar (Lead)">
          <span class="avatar-img av-cyan">IK</span>
        </div>
        <div class="avatar-item" data-tooltip="Saptarshi Sadhu (Core)">
          <span class="avatar-img av-purple">SS</span>
        </div>
        <div class="avatar-item" data-tooltip="Alex Rivera (Design)">
          <span class="avatar-img av-pink">AR</span>
        </div>
        <div class="avatar-item" data-tooltip="Jordan Lee (QA)">
          <span class="avatar-img av-green">JL</span>
        </div>
        <div class="avatar-item avatar-more" data-tooltip="+12 Contributors">
          <span class="avatar-img av-more">+12</span>
        </div>
      </div>
    </main>

    <footer class="av-footer">
      <p>EaseMotion CSS Component &bull; Submitted by @Ishita-Katiyar-06</p>
    </footer>
  </div>
</body>
</html>
