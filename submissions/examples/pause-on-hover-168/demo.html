<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Infinite seamless logo carousel with pause on hover">
    <title>Infinite Logo Carousel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="page">
    <section class="carousel-section" aria-labelledby="carousel-title">

        <p class="eyebrow">EaseMotion • Advanced Component</p>

        <h1 id="carousel-title">Trusted by modern teams</h1>

        <p class="description">
            An infinite seamless logo carousel that pauses when you hover.
        </p>

        <div class="carousel" aria-label="Partner logos">
            <div class="carousel-track">

                <div class="logo-card">
                    <span class="logo-mark">N</span>
                    <span>Nova</span>
                </div>

                <div class="logo-card">
                    <span class="logo-mark">A</span>
                    <span>Atlas</span>
                </div>

                <div class="logo-card">
                    <span class="logo-mark">V</span>
                    <span>Vertex</span>
                </div>

                <div class="logo-card">
                    <span class="logo-mark">L</span>
                    <span>Lumina</span>
                </div>

                <div class="logo-card">
                    <span class="logo-mark">O</span>
                    <span>Orbit</span>
                </div>

                <div class="logo-card">
                    <span class="logo-mark">P</span>
                    <span>Pulse</span>
                </div>

                <!-- Duplicate set for seamless looping -->

                <div class="logo-card" aria-hidden="true">
                    <span class="logo-mark">N</span>
                    <span>Nova</span>
                </div>

                <div class="logo-card" aria-hidden="true">
                    <span class="logo-mark">A</span>
                    <span>Atlas</span>
                </div>

                <div class="logo-card" aria-hidden="true">
                    <span class="logo-mark">V</span>
                    <span>Vertex</span>
                </div>

                <div class="logo-card" aria-hidden="true">
                    <span class="logo-mark">L</span>
                    <span>Lumina</span>
                </div>

                <div class="logo-card" aria-hidden="true">
                    <span class="logo-mark">O</span>
                    <span>Orbit</span>
                </div>

                <div class="logo-card" aria-hidden="true">
                    <span class="logo-mark">P</span>
                    <span>Pulse</span>
                </div>

            </div>
        </div>

        <p class="hint">Hover over the carousel to pause</p>

    </section>
</main>

</body>
</html>
