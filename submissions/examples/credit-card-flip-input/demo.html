<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Credit card flip input — EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <header class="page-head">
      <h1>Credit card flip input</h1>
      <p>A payment card widget that flips 180 degrees when the CVV field receives focus.</p>
    </header>
    <section class="demo">
      <div class="creditcardflipinput"><div class="creditcardflipinput-inner"><div class="creditcardflipinput-face creditcardflipinput-front"><span>•••• •••• •••• 4242</span><small>12/29</small></div><div class="creditcardflipinput-face creditcardflipinput-back"><label>CVV <input maxlength="3"></label></div></div></div>
    </section>
    <footer class="page-foot">
      <small>Submission folder: <code>submissions/examples/credit-card-flip-input/</code></small>
    </footer>
  </main>
</body>
</html>
