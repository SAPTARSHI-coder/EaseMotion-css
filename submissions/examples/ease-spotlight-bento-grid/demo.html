<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ease Bento Grid with Cursor Spotlight</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bento-body">
  <div class="bento-grid" id="grid">
    <div class="bento-cell cell-1">Analytics</div>
    <div class="bento-cell cell-2">Security</div>
    <div class="bento-cell cell-3">Performance</div>
  </div>

  <script>
    const grid = document.getElementById('grid');
    grid.addEventListener('mousemove', (e) => {
      const rect = grid.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      grid.style.setProperty('--x', `${x}px`);
      grid.style.setProperty('--y', `${y}px`);
    });
  </script>
</body>
</html>
