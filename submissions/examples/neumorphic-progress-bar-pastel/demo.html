<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neumorphic Pastel Progress Bar — EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="demo-wrapper">
    <header class="demo-header">
      <span class="badge">Neumorphic UI</span>
      <h1>Pastel Neumorphic Progress Bar</h1>
      <p>Soft tactile depth, pastel color palettes, and pure CSS animations for modern web interfaces.</p>
    </header>

    <div class="card-container">
      
      <!-- Linear Progress Bar 1: Lavender & Rose (75%) -->
      <section class="progress-card">
        <div class="progress-header">
          <span class="progress-title">System Update</span>
          <span class="progress-percentage">75%</span>
        </div>
        <div class="neumorph-track" role="progressbar" aria-valuenow="75" aria-valuemin="0" aria-valuemax="100" aria-label="System Update Progress">
          <div class="neumorph-fill fill-75 pastel-rose">
            <span class="glow-knob"></span>
          </div>
        </div>
      </section>

      <!-- Linear Progress Bar 2: Mint & Sky (45%) -->
      <section class="progress-card">
        <div class="progress-header">
          <span class="progress-title">File Upload</span>
          <span class="progress-percentage">45%</span>
        </div>
        <div class="neumorph-track" role="progressbar" aria-valuenow="45" aria-valuemin="0" aria-valuemax="100" aria-label="File Upload Progress">
          <div class="neumorph-fill fill-45 pastel-mint">
            <span class="glow-knob"></span>
          </div>
        </div>
      </section>

      <!-- Step Progress Bar: Pastel Multi-Step Indicator -->
      <section class="progress-card">
        <div class="progress-header">
          <span class="progress-title">Checkout Steps</span>
          <span class="progress-percentage">Step 3 of 4</span>
        </div>
        
        <div class="step-progress-container">
          <div class="step-track" role="progressbar" aria-valuenow="66" aria-valuemin="0" aria-valuemax="100" aria-label="Checkout Step Progress">
            <div class="step-fill fill-step-3"></div>
          </div>
          
          <ol class="step-list">
            <li class="step-node completed">
              <span class="step-icon">✓</span>
              <span class="step-label">Cart</span>
            </li>
            <li class="step-node completed">
              <span class="step-icon">✓</span>
              <span class="step-label">Shipping</span>
            </li>
            <li class="step-node active">
              <span class="step-number">3</span>
              <span class="step-label">Payment</span>
            </li>
            <li class="step-node">
              <span class="step-number">4</span>
              <span class="step-label">Confirm</span>
            </li>
          </ol>
        </div>
      </section>

    </div>
  </main>

</body>
</html>
