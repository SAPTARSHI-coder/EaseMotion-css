<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Skew-Active Dropdown - Minimalist Tech</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="layout-container">
        
        <header class="section-header">
            <h1 class="title">Filter Traffic</h1>
            <p class="subtitle">A minimalist tech dropdown component featuring a sharp, diagonal skew-active entrance animation.</p>
        </header>

        <div class="dashboard-area">
            
            <div class="card">
                
                <!-- 
                   Pure CSS State Management for Dropdown
                   Using a hidden checkbox to toggle the dropdown state without JS.
                -->
                <div class="dropdown-wrapper">
                    <input type="checkbox" id="dropdown-toggle" class="dropdown-input">
                    
                    <label for="dropdown-toggle" class="dropdown-trigger">
                        <span class="trigger-text">
                            <svg class="trigger-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon></svg>
                            Select Protocol
                        </span>
                        <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
                    </label>
                    
                    <!-- The Dropdown Menu -->
                    <div class="dropdown-menu skew-active-menu">
                        <div class="menu-group">
                            <span class="group-label">Application Layer</span>
                            
                            <label class="menu-item" for="dropdown-toggle">
                                <div class="item-content">
                                    <span class="item-title">HTTPS (443)</span>
                                    <span class="item-desc">Secure web traffic</span>
                                </div>
                                <span class="badge blue">Active</span>
                            </label>
                            
                            <label class="menu-item" for="dropdown-toggle">
                                <div class="item-content">
                                    <span class="item-title">HTTP (80)</span>
                                    <span class="item-desc">Unencrypted web traffic</span>
                                </div>
                            </label>
                            
                            <label class="menu-item" for="dropdown-toggle">
                                <div class="item-content">
                                    <span class="item-title">SSH (22)</span>
                                    <span class="item-desc">Secure shell access</span>
                                </div>
                                <span class="badge emerald">Monitored</span>
                            </label>
                        </div>
                        
                        <div class="menu-divider"></div>
                        
                        <div class="menu-group">
                            <span class="group-label">Transport Layer</span>
                            
                            <label class="menu-item" for="dropdown-toggle">
                                <div class="item-content">
                                    <span class="item-title">TCP Streams</span>
                                    <span class="item-desc">Connection-oriented tracking</span>
                                </div>
                            </label>
                            
                            <label class="menu-item" for="dropdown-toggle">
                                <div class="item-content">
                                    <span class="item-title">UDP Datagrams</span>
                                    <span class="item-desc">Connectionless tracking</span>
                                </div>
                            </label>
                        </div>
                        
                        <div class="menu-divider"></div>
                        
                        <a href="#" class="menu-action">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="16"></line><line x1="8" y1="12" x2="16" y2="12"></line></svg>
                            Define Custom Rule
                        </a>
                    </div>
                </div>
                
            </div>
            
        </div>
    </div>

</body>
</html>
