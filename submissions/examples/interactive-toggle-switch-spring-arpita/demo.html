<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive Toggle Switch Demo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="demo-wrapper">
    <header class="demo-header">
      <h1>Interactive Toggle Switch</h1>
      <p>A clean, accessible toggle switch with smooth spring physics motion.</p>
    </header>

    <section class="demo-card">
      <h2>Interactive Examples</h2>
      
      <div class="toggle-group">
        <label class="toggle-container" for="toggle-sound">
          <input type="checkbox" id="toggle-sound" class="toggle-input" checked />
          <span class="toggle-track">
            <span class="toggle-thumb"></span>
          </span>
          <span class="toggle-label">Notification Sound</span>
        </label>

        <label class="toggle-container" for="toggle-dark">
          <input type="checkbox" id="toggle-dark" class="toggle-input" />
          <span class="toggle-track">
            <span class="toggle-thumb"></span>
          </span>
          <span class="toggle-label">Dark Mode Theme</span>
        </label>

        <label class="toggle-container" for="toggle-disabled">
          <input type="checkbox" id="toggle-disabled" class="toggle-input" disabled />
          <span class="toggle-track">
            <span class="toggle-thumb"></span>
          </span>
          <span class="toggle-label">Disabled Option</span>
        </label>
      </div>
    </section>
  </main>
</body>
</html>
