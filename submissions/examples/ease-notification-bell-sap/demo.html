<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ease-notification-bell-sap demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 20px;
      align-items: center;
      justify-content: center;
      background: #f4f4f5;
      font-family: system-ui, sans-serif;
    }
    button.trigger {
      padding: 10px 18px;
      border-radius: 8px;
      border: none;
      background: #111;
      color: #fff;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <button class="notif-bell-sap" id="bell" aria-label="Notifications">
    <svg viewBox="0 0 24 24">
      <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/>
      <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
    </svg>
    <span class="notif-dot"></span>
  </button>

  <button class="trigger" id="simulateBtn">Simulate New Notification</button>

  <script>
    const bell = document.getElementById('bell');
    const simulateBtn = document.getElementById('simulateBtn');

    simulateBtn.addEventListener('click', () => {
      bell.classList.add('has-notif', 'ring');
      setTimeout(() => bell.classList.remove('ring'), 600);
    });

    bell.addEventListener('click', () => {
      bell.classList.remove('has-notif');
    });
  </script>

</body>
</html>
