<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ease CSS Floating Dock</title>
    <link rel="stylesheet" href="../../../easemotion.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="demo-container">
        
        <header class="header">
            <h1>CSS Floating Dock</h1>
            <p>Hover the icons below. 100% CSS `:has()` pseudo-class math. Zero JS.</p>
        </header>

        <!-- 
          The Dock Container 
          We use a standard flexbox layout to hold the icons.
        -->
        <nav class="ease-dock">
            
            <button class="dock-item" aria-label="Home">
                <span class="dock-icon">🏠</span>
                <span class="dock-tooltip">Home</span>
            </button>
            
            <button class="dock-item" aria-label="Messages">
                <span class="dock-icon">💬</span>
                <span class="dock-tooltip">Messages</span>
            </button>
            
            <button class="dock-item" aria-label="Analytics">
                <span class="dock-icon">📊</span>
                <span class="dock-tooltip">Analytics</span>
            </button>
            
            <button class="dock-item" aria-label="Settings">
                <span class="dock-icon">⚙️</span>
                <span class="dock-tooltip">Settings</span>
            </button>
            
            <button class="dock-item" aria-label="Profile">
                <span class="dock-icon">👤</span>
                <span class="dock-tooltip">Profile</span>
            </button>
            
        </nav>

    </main>

</body>
</html>
