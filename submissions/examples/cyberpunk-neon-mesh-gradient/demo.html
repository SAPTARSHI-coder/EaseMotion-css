<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark light">
  <title>Cyberpunk Neon Mesh Gradient</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">
    <section class="cyber-card" aria-labelledby="cyber-title">

      <div class="mesh" aria-hidden="true">
        <span class="mesh-blob blob-pink"></span>
        <span class="mesh-blob blob-cyan"></span>
        <span class="mesh-blob blob-purple"></span>
        <span class="mesh-blob blob-blue"></span>
      </div>

      <div class="scanlines" aria-hidden="true"></div>
      <div class="grid" aria-hidden="true"></div>

      <div class="content">
        <span class="badge">CYBERPUNK // NEON</span>

        <h1 id="cyber-title">Neon Mesh</h1>

        <p>
          A futuristic CSS-only mesh gradient inspired by cyberpunk
          interfaces, neon lights, and digital cityscapes.
        </p>

        <div class="status">
          <span class="status-dot"></span>
          <span>SYSTEM ONLINE</span>
        </div>

        <div class="actions">
          <button class="primary-btn" type="button">
            Enter Grid
          </button>

          <button class="secondary-btn" type="button">
            View System
          </button>
        </div>
      </div>

      <div class="corner corner-top-left" aria-hidden="true"></div>
      <div class="corner corner-top-right" aria-hidden="true"></div>
      <div class="corner corner-bottom-left" aria-hidden="true"></div>
      <div class="corner corner-bottom-right" aria-hidden="true"></div>

    </section>
  </main>

</body>
</html>
