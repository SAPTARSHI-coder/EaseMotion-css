<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="CSS-only minimal glassmorphism badges"
  >

  <title>Glassmorphism Badge - EaseMotion CSS</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="page">
    <section class="showcase" aria-labelledby="badge-title">
      <div class="intro">
        <span class="eyebrow">EASEMOTION CSS</span>

        <h1 id="badge-title">
          Glassmorphism Badge
        </h1>

        <p>
          Minimal translucent badges with soft blur,
          subtle borders, and lightweight hover interactions.
        </p>
      </div>

      <div class="badge-grid" aria-label="Glassmorphism badge examples">
        <span class="glass-badge badge-blue">
          <span class="status-dot" aria-hidden="true"></span>
          Available
        </span>

        <span class="glass-badge badge-purple">
          <span class="badge-icon" aria-hidden="true">✦</span>
          Featured
        </span>

        <span class="glass-badge badge-green">
          <span class="status-dot" aria-hidden="true"></span>
          Verified
        </span>

        <span class="glass-badge badge-pink">
          <span class="badge-icon" aria-hidden="true">◆</span>
          Premium
        </span>

        <span class="glass-badge badge-orange">
          <span class="status-dot" aria-hidden="true"></span>
          Trending
        </span>

        <span class="glass-badge badge-white">
          New
        </span>
      </div>

      <div class="demo-card">
        <div class="demo-card-content">
          <span class="mini-label">LIVE COMPONENT</span>
          <h2>Minimal glass UI</h2>
          <p>
            Built entirely with HTML and CSS for easy reuse
            in modern interfaces.
          </p>
        </div>

        <span class="glass-badge badge-blue">
          <span class="status-dot" aria-hidden="true"></span>
          Active
        </span>
      </div>
    </section>
  </main>
</body>
</html>
