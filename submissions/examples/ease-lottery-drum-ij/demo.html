<!-- EaseMotion component: lottery-drum -->
<!DOCTYPE html>
<html lang="en" data-lotto="drum">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, maximum-scale=1.0, initial-scale=1.0">
<title>Ease Lottery Drum</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="lottery-drum">
  <div class="drum-wheel">
    <span class="drum-window"></span>
    <span class="drum-spoke sp-1"></span>
    <span class="drum-spoke sp-2"></span>
    <span class="drum-axle"></span>
    <i class="drum-ball b-1">7</i>
    <i class="drum-ball b-2">24</i>
    <i class="drum-ball b-3">13</i>
    <i class="drum-ball b-4">41</i>
  </div>
  <div class="drum-chute">
    <span class="chute-open"></span>
  </div>
  <div class="drawn-tray">
    <span class="tray-label">DRAWN BALLS</span>
    <span class="drawn-ball d-1">19</span>
    <span class="drawn-ball d-2">33</span>
  </div>
  <div class="drum-stand">
    <span class="stand-tag">LOTTO</span>
  </div>
</main>
</body>
</html>
