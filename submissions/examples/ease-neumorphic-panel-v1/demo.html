<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ease Neumorphic Soft UI Control Panel</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="ease-neu-body">
  <div class="ease-neu-card">
    <h2>Control Panel</h2>
    <div class="ease-neu-group">
      <button class="ease-neu-btn">Press Button</button>
      <div class="ease-neu-toggle" id="toggle">
        <div class="ease-neu-thumb"></div>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('toggle').addEventListener('click', function() {
      this.classList.toggle('active');
    });
  </script>
</body>
</html>
