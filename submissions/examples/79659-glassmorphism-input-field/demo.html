<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Glassmorphism input field with floating labels."
  >

  <title>Glassmorphism Input Field</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="page">

    <section class="demo">

      <span class="eyebrow">EASEMOTION CSS</span>

      <h1>Glassmorphism Input</h1>

      <p class="intro">
        A translucent input field with soft blur, floating labels,
        subtle glow, and responsive glass styling.
      </p>

      <div class="glass-panel">

        <div class="glass-panel__header">
          <span>ACCOUNT DETAILS</span>
          <span class="glass-panel__indicator"></span>
        </div>

        <form class="form">

          <div class="field">
            <input
              id="name"
              name="name"
              type="text"
              placeholder=" "
              autocomplete="name"
              required
            >

            <label for="name">
              Full name
            </label>

            <span class="field__line"></span>
          </div>

          <div class="field">
            <input
              id="email"
              name="email"
              type="email"
              placeholder=" "
              autocomplete="email"
              required
            >

            <label for="email">
              Email address
            </label>

            <span class="field__line"></span>
          </div>

          <div class="field">
            <input
              id="company"
              name="company"
              type="text"
              placeholder=" "
              autocomplete="organization"
            >

            <label for="company">
              Company
            </label>

            <span class="field__line"></span>
          </div>

          <button type="submit" class="form__button">
            Continue
            <span aria-hidden="true">→</span>
          </button>

        </form>

        <p class="glass-panel__footer">
          Your information is securely stored.
        </p>

      </div>

      <p class="demo__note">
        Focus an input to activate the glass highlight and floating label.
      </p>

    </section>

  </main>

</body>
</html>
