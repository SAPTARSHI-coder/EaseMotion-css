<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimalist Search Bar</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="demo">
    <form class="search-bar" role="search">
      <label class="search-label" for="search-input">
        Search
      </label>

      <div class="search-wrapper">
        <svg
          class="search-icon"
          viewBox="0 0 24 24"
          width="22"
          height="22"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <circle cx="11" cy="11" r="7"></circle>
          <path d="m20 20-4-4"></path>
        </svg>

        <input
          id="search-input"
          class="search-input"
          type="search"
          placeholder="Search anything..."
          autocomplete="off"
        >

        <button
          class="search-button"
          type="submit"
          aria-label="Submit search"
        >
          <svg
            viewBox="0 0 24 24"
            width="20"
            height="20"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M5 12h14"></path>
            <path d="m13 6 6 6-6 6"></path>
          </svg>
        </button>
      </div>
    </form>
  </main>

</body>
</html>
