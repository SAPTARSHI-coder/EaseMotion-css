<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ease 3D Cube Carousel</title>
    <link rel="stylesheet" href="../../../easemotion.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="ease-carousel-wrapper">
        
        <!-- The classic hidden radio button hack for CSS state management -->
        <input type="radio" name="cube-gallery" id="face-1" checked>
        <input type="radio" name="cube-gallery" id="face-2">
        <input type="radio" name="cube-gallery" id="face-3">
        <input type="radio" name="cube-gallery" id="face-4">

        <div class="ease-cube-scene">
            <div class="ease-cube">
                <!-- The 4 faces of the cube -->
                <div class="cube-face cube-front">
                    <img src="https://images.unsplash.com/photo-1498050108023-c5249f4df085?auto=format&fit=crop&w=600&q=80" alt="Slide 1">
                </div>
                <div class="cube-face cube-right">
                    <img src="https://images.unsplash.com/photo-1555066931-4365d14bab8c?auto=format&fit=crop&w=600&q=80" alt="Slide 2">
                </div>
                <div class="cube-face cube-back">
                    <img src="https://images.unsplash.com/photo-1517694712202-14dd9538aa97?auto=format&fit=crop&w=600&q=80" alt="Slide 3">
                </div>
                <div class="cube-face cube-left">
                    <img src="https://images.unsplash.com/photo-1522199755839-a2bacb67c546?auto=format&fit=crop&w=600&q=80" alt="Slide 4">
                </div>
            </div>
        </div>

        <!-- Navigation Controls tied to the radio buttons -->
        <div class="ease-carousel-controls">
            <label for="face-1" class="nav-dot"></label>
            <label for="face-2" class="nav-dot"></label>
            <label for="face-3" class="nav-dot"></label>
            <label for="face-4" class="nav-dot"></label>
        </div>

    </div>

</body>
</html>
