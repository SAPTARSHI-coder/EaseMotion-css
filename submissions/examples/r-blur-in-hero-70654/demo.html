<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="CSS blur-in hero animation demonstration"
  >
  <title>CSS Blur In Hero</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="hero">
    <div class="hero-glow hero-glow-one" aria-hidden="true"></div>
    <div class="hero-glow hero-glow-two" aria-hidden="true"></div>

    <div class="hero-content">
      <p class="hero-label">Pure CSS Animation</p>

      <h1>Bring Your Ideas Into Focus</h1>

      <p class="hero-text">
        A smooth hero entrance that starts completely blurred and
        gradually becomes sharp, clear, and visible.
      </p>

      <div class="hero-actions">
        <a class="hero-button primary" href="#explore">
          Explore
        </a>

        <a class="hero-button secondary" href="#learn">
          Learn More
        </a>
      </div>
    </div>

    <div
      class="hero-orb"
      aria-hidden="true"
    ></div>
  </main>
</body>
</html>
