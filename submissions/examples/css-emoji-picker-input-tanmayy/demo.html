<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Emoji Picker Input - EaseMotion CSS</title>
  <!-- Import EaseMotion CSS -->
  <link rel="stylesheet" href="../../../easemotion.css">
  <!-- Component Specific Styles -->
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body class="minimalist-bg">

  <div class="demo-container">
    
    <div class="header-section">
      <h1 class="ease-text-3xl">Emoji Picker Input</h1>
      <p class="ease-color-muted">A pure CSS, JavaScript-free emoji picker popup. The state is managed entirely via hidden checkboxes and sibling selectors.</p>
    </div>

    <!-- The Chat Input Area -->
    <div class="chat-interface ease-glass-card">
      
      <div class="chat-messages">
        <div class="message message-received">Hey! Are you coming to the party tonight? 🎉</div>
        <div class="message message-sent">Yeah! I'll be there around 8.</div>
      </div>

      <!-- Emoji Input Component -->
      <div class="emoji-input-wrapper">
        
        <input type="text" class="message-input" placeholder="Type a message..." aria-label="Message Input">
        
        <!-- Hidden Checkbox for State Management -->
        <input type="checkbox" id="emoji-picker-toggle" class="emoji-checkbox" aria-hidden="true">
        
        <!-- Trigger Button -->
        <label for="emoji-picker-toggle" class="emoji-trigger" aria-label="Toggle Emoji Picker" role="button" tabindex="0">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <path d="M8 14s1.5 2 4 2 4-2 4-2"></path>
            <line x1="9" y1="9" x2="9.01" y2="9"></line>
            <line x1="15" y1="9" x2="15.01" y2="9"></line>
          </svg>
        </label>
        
        <button class="send-btn" aria-label="Send Message">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>

        <!-- The Picker Popup -->
        <div class="emoji-picker-popup">
          <div class="picker-header">
            <span class="picker-title">Smileys & Emotion</span>
          </div>
          
          <div class="emoji-grid">
            <button class="emoji-btn">😀</button>
            <button class="emoji-btn">😂</button>
            <button class="emoji-btn">🥰</button>
            <button class="emoji-btn">😎</button>
            <button class="emoji-btn">🤔</button>
            <button class="emoji-btn">😅</button>
            <button class="emoji-btn">🤩</button>
            <button class="emoji-btn">😴</button>
            <button class="emoji-btn">🤯</button>
            <button class="emoji-btn">🥳</button>
            <button class="emoji-btn">🥺</button>
            <button class="emoji-btn">🤬</button>
            <button class="emoji-btn">🤡</button>
            <button class="emoji-btn">👻</button>
            <button class="emoji-btn">👽</button>
            <button class="emoji-btn">🤖</button>
            <button class="emoji-btn">🎃</button>
            <button class="emoji-btn">😈</button>
            <button class="emoji-btn">💀</button>
            <button class="emoji-btn">💩</button>
          </div>
          
          <div class="picker-footer">
            <div class="category-icon active">😀</div>
            <div class="category-icon">🐻</div>
            <div class="category-icon">🍔</div>
            <div class="category-icon">⚽️</div>
            <div class="category-icon">🚗</div>
          </div>
        </div>
        
      </div>

    </div>

  </div>

</body>
</html>
