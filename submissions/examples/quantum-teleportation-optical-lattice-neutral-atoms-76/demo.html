<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Optical Lattice Neutral Atoms - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css"></head><body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030712; color: #ffffff;">

    <div class="ease-card ease-card-glass lattice-container">
        <div class="lattice-header">
            <h2>Neutral Atom Lattice</h2>
            <span class="ease-badge ease-badge-warning">Trapping</span>
        </div>
        
        <div class="lattice-screen ease-center">
            <div class="lattice-flux flux-lattice-a"></div>
            <div class="lattice-flux flux-lattice-b"></div>
            <div class="lattice-boundary-ring"></div>
            <div class="lattice-core ease-center"></div>
        </div>

        <div class="lattice-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Rydberg Tweezers &amp; Atom Arrays</span>
            <button class="ease-btn ease-btn-warning ease-btn-sm ease-hover-grow">Run Lattice Trap</button>
        </div>
    </div></body></html>
