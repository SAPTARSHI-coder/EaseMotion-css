<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accessible Star Rating Demo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <main class="demo-container">
        <h1>Product Feedback</h1>
        <p>This demo illustrates an accessible Star Rating component built on top of native HTML radio buttons, ensuring full compatibility with screen readers and keyboard navigation.</p>
        
        <form action="#" method="POST" class="rating-form">
            <!-- 
                CRITICAL ACCESSIBILITY: Fieldset & Legend
                A group of radio buttons MUST be wrapped in a fieldset with a legend.
                The screen reader will announce "Rate your experience, 3 stars, radio button, 3 of 5".
            -->
            <fieldset class="rating-group">
                <legend class="rating-legend">Rate your experience</legend>
                
                <div class="stars-container">
                    <!-- Star 1 -->
                    <div class="star-wrapper">
                        <input type="radio" id="star1" name="rating" value="1" class="sr-only rating-input">
                        <!-- 
                            CRITICAL ACCESSIBILITY: Label association
                            The label acts as the visual hit area, but is strictly tied to the hidden input.
                        -->
                        <label for="star1" class="star-label" aria-label="1 star">
                            <svg class="star-icon" viewBox="0 0 24 24" width="32" height="32" fill="currentColor">
                                <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
                            </svg>
                        </label>
                    </div>

                    <!-- Star 2 -->
                    <div class="star-wrapper">
                        <input type="radio" id="star2" name="rating" value="2" class="sr-only rating-input">
                        <label for="star2" class="star-label" aria-label="2 stars">
                            <svg class="star-icon" viewBox="0 0 24 24" width="32" height="32" fill="currentColor">
                                <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
                            </svg>
                        </label>
                    </div>

                    <!-- Star 3 -->
                    <div class="star-wrapper">
                        <input type="radio" id="star3" name="rating" value="3" class="sr-only rating-input">
                        <label for="star3" class="star-label" aria-label="3 stars">
                            <svg class="star-icon" viewBox="0 0 24 24" width="32" height="32" fill="currentColor">
                                <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
                            </svg>
                        </label>
                    </div>

                    <!-- Star 4 -->
                    <div class="star-wrapper">
                        <input type="radio" id="star4" name="rating" value="4" class="sr-only rating-input">
                        <label for="star4" class="star-label" aria-label="4 stars">
                            <svg class="star-icon" viewBox="0 0 24 24" width="32" height="32" fill="currentColor">
                                <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
                            </svg>
                        </label>
                    </div>

                    <!-- Star 5 -->
                    <div class="star-wrapper">
                        <input type="radio" id="star5" name="rating" value="5" class="sr-only rating-input">
                        <label for="star5" class="star-label" aria-label="5 stars">
                            <svg class="star-icon" viewBox="0 0 24 24" width="32" height="32" fill="currentColor">
                                <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
                            </svg>
                        </label>
                    </div>
                </div>
            </fieldset>

            <button type="submit" class="submit-btn">Submit Feedback</button>
        </form>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const inputs = document.querySelectorAll('.rating-input');
            const wrappers = document.querySelectorAll('.star-wrapper');

            // Handle hover and keyboard states visually
            // Because native radios handle the actual checked state perfectly,
            // JavaScript is only used here for the "fill all stars to the left" visual effect.
            
            inputs.forEach((input, index) => {
                
                // When an input changes (via click or keyboard arrows), update visuals
                input.addEventListener('change', () => {
                    updateVisuals(index);
                });

                // Hover effects (fill up to the hovered star)
                input.nextElementSibling.addEventListener('mouseenter', () => {
                    updateHoverVisuals(index);
                });

                // Remove hover effects when leaving
                input.nextElementSibling.addEventListener('mouseleave', () => {
                    // Restore to the checked state
                    const checkedInput = document.querySelector('.rating-input:checked');
                    if (checkedInput) {
                        const checkedIndex = Array.from(inputs).indexOf(checkedInput);
                        updateVisuals(checkedIndex);
                    } else {
                        clearVisuals();
                    }
                });
            });

            function updateVisuals(selectedIndex) {
                wrappers.forEach((wrapper, i) => {
                    if (i <= selectedIndex) {
                        wrapper.classList.add('is-active');
                    } else {
                        wrapper.classList.remove('is-active');
                    }
                });
            }

            function updateHoverVisuals(hoveredIndex) {
                wrappers.forEach((wrapper, i) => {
                    if (i <= hoveredIndex) {
                        wrapper.classList.add('is-hovered');
                    } else {
                        wrapper.classList.remove('is-hovered');
                    }
                });
            }

            function clearVisuals() {
                wrappers.forEach(wrapper => {
                    wrapper.classList.remove('is-active', 'is-hovered');
                });
            }
        });
    </script>
</body>
</html>
