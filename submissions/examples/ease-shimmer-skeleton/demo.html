<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ease Shimmer Skeleton Loader</title>
    <link rel="stylesheet" href="../../../easemotion.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="skeleton-container">
        <!-- Profile Card Skeleton Layout -->
        <div class="ease-skeleton-card">
            <div class="ease-skeleton-header">
                <div class="ease-skeleton-avatar ease-shimmer"></div>
                <div class="ease-skeleton-text-group">
                    <div class="ease-skeleton-text ease-skeleton-title ease-shimmer"></div>
                    <div class="ease-skeleton-text ease-skeleton-subtitle ease-shimmer"></div>
                </div>
            </div>
            <div class="ease-skeleton-body">
                <div class="ease-skeleton-text ease-shimmer"></div>
                <div class="ease-skeleton-text ease-shimmer" style="width: 80%"></div>
                <div class="ease-skeleton-text ease-shimmer" style="width: 60%"></div>
            </div>
            <div class="ease-skeleton-footer">
                <div class="ease-skeleton-button ease-shimmer"></div>
            </div>
        </div>
    </div>
</body>
</html>
