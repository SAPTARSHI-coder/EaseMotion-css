<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Slide-Up Stepper - EaseMotion CSS</title>
  <!-- Import EaseMotion CSS -->
  <link rel="stylesheet" href="../../../easemotion.css">
  <!-- Component Specific Styles -->
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body class="minimalist-bg">

  <div class="demo-container">
    
    <div class="stepper-header">
      <h1 class="ease-text-2xl">Create Project</h1>
      <p class="ease-color-muted">Setup your new application repository.</p>
    </div>

    <!-- Slide-Up Stepper Component -->
    <div class="stepper-container ease-glass-card">
      
      <!-- Hidden Radio Inputs for State -->
      <input type="radio" name="stepper_control" id="step-1" class="stepper-radio" checked>
      <input type="radio" name="stepper_control" id="step-2" class="stepper-radio">
      <input type="radio" name="stepper_control" id="step-3" class="stepper-radio">

      <!-- Stepper Navigation (Progress indicators) -->
      <div class="stepper-nav">
        <div class="nav-step step-1-indicator">
          <div class="step-circle">1</div>
          <span class="step-label">Details</span>
        </div>
        <div class="step-connector"></div>
        <div class="nav-step step-2-indicator">
          <div class="step-circle">2</div>
          <span class="step-label">Database</span>
        </div>
        <div class="step-connector"></div>
        <div class="nav-step step-3-indicator">
          <div class="step-circle">3</div>
          <span class="step-label">Deploy</span>
        </div>
      </div>

      <!-- Stepper Content Panels -->
      <div class="stepper-panels">
        
        <!-- Step 1: Details -->
        <div class="stepper-panel panel-1">
          <div class="panel-inner">
            <h2 class="panel-title">Project Details</h2>
            <p class="panel-desc">Define the basic information for your application.</p>
            
            <div class="form-group">
              <label>Project Name</label>
              <input type="text" class="minimal-input" placeholder="e.g. Acme API">
            </div>
            
            <div class="form-group">
              <label>Framework</label>
              <select class="minimal-input">
                <option>Next.js</option>
                <option>Express (Node.js)</option>
                <option>Django (Python)</option>
              </select>
            </div>
            
            <div class="panel-footer">
              <div></div> <!-- Spacer -->
              <label for="step-2" class="btn btn-primary ease-squish-button">Next Step</label>
            </div>
          </div>
        </div>
        
        <!-- Step 2: Database -->
        <div class="stepper-panel panel-2">
          <div class="panel-inner">
            <h2 class="panel-title">Database Configuration</h2>
            <p class="panel-desc">Select the primary datastore for your application.</p>
            
            <div class="radio-grid">
              <label class="grid-radio">
                <input type="radio" name="db_type" checked>
                <div class="grid-content">
                  <strong>PostgreSQL</strong>
                  <span>Relational</span>
                </div>
              </label>
              <label class="grid-radio">
                <input type="radio" name="db_type">
                <div class="grid-content">
                  <strong>MongoDB</strong>
                  <span>NoSQL</span>
                </div>
              </label>
            </div>
            
            <div class="panel-footer">
              <label for="step-1" class="btn btn-secondary ease-squish-button">Back</label>
              <label for="step-3" class="btn btn-primary ease-squish-button">Next Step</label>
            </div>
          </div>
        </div>
        
        <!-- Step 3: Deploy -->
        <div class="stepper-panel panel-3">
          <div class="panel-inner">
            <h2 class="panel-title">Deployment Target</h2>
            <p class="panel-desc">Choose where this application will be hosted.</p>
            
            <div class="form-group">
              <label>Environment</label>
              <select class="minimal-input">
                <option>Production</option>
                <option>Staging</option>
                <option>Development</option>
              </select>
            </div>
            
            <div class="panel-footer">
              <label for="step-2" class="btn btn-secondary ease-squish-button">Back</label>
              <button class="btn btn-primary ease-squish-button">Initialize Project</button>
            </div>
          </div>
        </div>
        
      </div>
    </div>

  </div>

</body>
</html>
