<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Windlass Drum Haul — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Windlass Drum Haul demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Windlass Drum Haul</h1>
      <p class="lede">Anchor windlass drum hauling chain</p>
    </header>

    <section class="ease-windlass-drum-haul" data-demo="windlass-drum-haul" aria-live="polite">
      <div class="ease-windlass-drum-haul__housing">
        <div class="ease-windlass-drum-haul__bezel">
          <div class="ease-windlass-drum-haul__face">
            <div class="ease-windlass-drum-haul__readout">
              <span class="ease-windlass-drum-haul__label">Windlass Drum Haul</span>
              <span class="ease-windlass-drum-haul__value">LIVE</span>
            </div>
            <div class="ease-windlass-drum-haul__motion" aria-hidden="true">
              <span class="ease-windlass-drum-haul__a"></span>
              <span class="ease-windlass-drum-haul__b"></span>
              <span class="ease-windlass-drum-haul__c"></span>
              <span class="ease-windlass-drum-haul__d"></span>
            </div>
            <div class="ease-windlass-drum-haul__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-windlass-drum-haul__controls">
          <button type="button" class="ease-windlass-drum-haul__btn primary">Engage</button>
          <button type="button" class="ease-windlass-drum-haul__btn">Reset</button>
          <label class="ease-windlass-drum-haul__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-windlass-drum-haul__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
