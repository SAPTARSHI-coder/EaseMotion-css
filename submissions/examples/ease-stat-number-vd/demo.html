<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ease Stat Number</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="stat-demo">

    <div class="stat-number">
        <span class="stat-label">Total Projects</span>
        <strong class="stat-value">248</strong>
        <span class="stat-description">Projects completed this year</span>
    </div>

    <div class="stat-number">
        <span class="stat-label">Active Users</span>
        <strong class="stat-value">12.8K</strong>
        <span class="stat-description">Users active this month</span>
    </div>

    <div class="stat-number">
        <span class="stat-label">Completion Rate</span>
        <strong class="stat-value">94%</strong>
        <span class="stat-description">Overall completion rate</span>
    </div>

</div>

</body>
</html>
