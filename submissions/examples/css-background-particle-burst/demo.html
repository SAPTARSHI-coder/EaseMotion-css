<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Background: Particle Burst - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="em-particle-page">
        <!-- Background Particle Burst Animation Layer -->
        <div class="em-particle-burst-bg" aria-hidden="true">
            <span class="em-particle" style="--x:-120px; --y:-80px; --d:0s;"></span>
            <span class="em-particle" style="--x:140px; --y:-100px; --d:0.4s;"></span>
            <span class="em-particle" style="--x:-90px; --y:130px; --d:0.8s;"></span>
            <span class="em-particle" style="--x:110px; --y:90px; --d:1.2s;"></span>
            <span class="em-particle" style="--x:-160px; --y:20px; --d:1.6s;"></span>
            <span class="em-particle" style="--x:170px; --y:-30px; --d:2.0s;"></span>
            <span class="em-particle" style="--x:0px; --y:-150px; --d:2.4s;"></span>
            <span class="em-particle" style="--x:0px; --y:160px; --d:2.8s;"></span>
        </div>

        <div class="em-card" role="region" aria-label="Particle Burst Background Showcase" tabindex="0">
            <span class="em-card-badge">BACKGROUND ANIMATIONS</span>
            <h1 class="em-card-title">Particle Burst</h1>
            <p class="em-card-desc">A smooth, hardware-accelerated pure CSS background animation featuring dynamic particle burst styling and dark mode compatibility.</p>
            <a href="#" class="em-card-btn" role="button">Explore Effects</a>
        </div>
    </div>
</body>
</html>
