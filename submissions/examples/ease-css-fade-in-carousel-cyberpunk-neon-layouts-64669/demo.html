<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Fade-In Carousel - Cyberpunk Neon Layouts</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="ease-carousel-container">
        <!-- Radio buttons for pure CSS state management -->
        <input type="radio" name="cyber-carousel" id="slide1" checked>
        <input type="radio" name="cyber-carousel" id="slide2">
        <input type="radio" name="cyber-carousel" id="slide3">

        <div class="ease-carousel">
            <div class="ease-slide ease-slide-1">
                <div class="ease-slide-content">
                    <h2>NEON_NIGHTS.exe</h2>
                    <p>Experience the glowing underbelly of the cyber city.</p>
                </div>
            </div>
            <div class="ease-slide ease-slide-2">
                <div class="ease-slide-content">
                    <h2>DATA_STREAM.sys</h2>
                    <p>Hack the mainframe and secure your digital assets.</p>
                </div>
            </div>
            <div class="ease-slide ease-slide-3">
                <div class="ease-slide-content">
                    <h2>SYNTH_WAVE.log</h2>
                    <p>Ride the digital waves into the future.</p>
                </div>
            </div>
        </div>

        <div class="ease-carousel-controls">
            <label for="slide1" class="ease-control-btn" aria-label="Slide 1"></label>
            <label for="slide2" class="ease-control-btn" aria-label="Slide 2"></label>
            <label for="slide3" class="ease-control-btn" aria-label="Slide 3"></label>
        </div>
    </div>
</body>
</html>
