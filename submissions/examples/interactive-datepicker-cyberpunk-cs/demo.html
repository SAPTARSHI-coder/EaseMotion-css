<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Interactive cyberpunk styled datepicker calendar built with pure CSS.">
    <title>Cyberpunk Datepicker Calendar</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="datepicker-page">
        <section class="datepicker" aria-labelledby="datepicker-title">
            <div class="datepicker__header">
                <div>
                    <p class="datepicker__eyebrow">SYSTEM // DATE SELECT</p>
                    <h1 id="datepicker-title">CYBER CALENDAR</h1>
                </div>

                <span class="datepicker__status" aria-label="Calendar online">
                    ONLINE
                </span>
            </div>

            <div class="datepicker__controls">
                <button class="datepicker__nav" type="button" aria-label="Previous month">
                    &lt;
                </button>

                <h2 class="datepicker__month">AUGUST 2026</h2>

                <button class="datepicker__nav" type="button" aria-label="Next month">
                    &gt;
                </button>
            </div>

            <div class="datepicker__weekdays" aria-hidden="true">
                <span>SUN</span>
                <span>MON</span>
                <span>TUE</span>
                <span>WED</span>
                <span>THU</span>
                <span>FRI</span>
                <span>SAT</span>
            </div>

            <div class="datepicker__grid" role="grid" aria-label="August 2026">
                <button class="datepicker__day datepicker__day--muted" type="button">
                    26
                </button>
                <button class="datepicker__day datepicker__day--muted" type="button">
                    27
                </button>
                <button class="datepicker__day datepicker__day--muted" type="button">
                    28
                </button>
                <button class="datepicker__day datepicker__day--muted" type="button">
                    29
                </button>
                <button class="datepicker__day datepicker__day--muted" type="button">
                    30
                </button>
                <button class="datepicker__day datepicker__day--muted" type="button">
                    31
                </button>

                <button class="datepicker__day" type="button">1</button>
                <button class="datepicker__day" type="button">2</button>
                <button class="datepicker__day" type="button">3</button>
                <button class="datepicker__day" type="button">4</button>
                <button class="datepicker__day" type="button">5</button>
                <button class="datepicker__day" type="button">6</button>
                <button class="datepicker__day" type="button">7</button>

                <button class="datepicker__day" type="button">8</button>
                <button class="datepicker__day" type="button">9</button>
                <button class="datepicker__day" type="button">10</button>
                <button class="datepicker__day" type="button">11</button>
                <button class="datepicker__day" type="button">12</button>
                <button class="datepicker__day" type="button">13</button>
                <button class="datepicker__day" type="button">14</button>

                <button class="datepicker__day" type="button">15</button>
                <button class="datepicker__day" type="button">16</button>
                <button class="datepicker__day" type="button">17</button>
                <button class="datepicker__day" type="button">18</button>
                <button class="datepicker__day" type="button">19</button>
                <button class="datepicker__day" type="button">20</button>
                <button class="datepicker__day" type="button">21</button>

                <button class="datepicker__day" type="button">22</button>
                <button class="datepicker__day" type="button">23</button>
                <button class="datepicker__day" type="button">24</button>
                <button class="datepicker__day" type="button">25</button>
                <button class="datepicker__day" type="button">26</button>
                <button class="datepicker__day" type="button">27</button>
                <button class="datepicker__day" type="button">28</button>

                <button class="datepicker__day" type="button">29</button>
                <button class="datepicker__day" type="button">30</button>
                <button class="datepicker__day" type="button">31</button>

                <button class="datepicker__day datepicker__day--muted" type="button">
                    1
                </button>
                <button class="datepicker__day datepicker__day--muted" type="button">
                    2
                </button>
                <button class="datepicker__day datepicker__day--muted" type="button">
                    3
                </button>
                <button class="datepicker__day datepicker__day--muted" type="button">
                    4
                </button>
            </div>

            <div class="datepicker__footer">
                <span>SELECTED</span>
                <strong>-- / -- / ----</strong>
            </div>
        </section>
    </main>
</body>

</html>
