<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      name="description"
      content="Responsive retro parallax button built with HTML and CSS."
    />

    <title>Retro Parallax Button | EaseMotion CSS</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="page">
      <div class="grid-overlay"></div>

      <section class="demo-card">
        <span class="eyebrow">EaseMotion CSS</span>

        <h1>Retro Parallax Button</h1>

        <p class="description">
          A layered CSS-only button with a nostalgic arcade-inspired
          appearance and responsive parallax depth.
        </p>

        <div class="button-stage">
          <a
            class="retro-button"
            href="#demo"
            aria-label="Explore the retro parallax effect"
          >
            <span class="retro-button__shadow"></span>

            <span class="retro-button__border"></span>

            <span class="retro-button__face">
              <span class="retro-button__text">
                ENTER NOW
              </span>

              <span class="retro-button__arrow" aria-hidden="true">
                →
              </span>
            </span>
          </a>
        </div>

        <div class="button-info">
          <span>HOVER TO EXPLORE</span>
          <span>CSS ONLY</span>
          <span>RESPONSIVE</span>
        </div>
      </section>
    </main>
  </body>
</html>
