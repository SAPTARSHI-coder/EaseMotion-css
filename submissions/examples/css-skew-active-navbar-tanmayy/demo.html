<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Skew-Active Navbar - EaseMotion CSS</title>
  <!-- Import EaseMotion CSS -->
  <link rel="stylesheet" href="../../../easemotion.css">
  <!-- Component Specific Styles -->
  <link rel="stylesheet" href="style.css">
  <!-- Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="ecommerce-checkout-bg">
  
  <div class="demo-container">
    
    <header class="checkout-header">
      <h1 class="logo">Shop<span class="ease-color-primary">Ease</span></h1>
      
      <!-- Skew-Active Navbar Component -->
      <nav class="skew-active-navbar" aria-label="Checkout Progress">
        <div class="nav-container">
          
          <!-- Step 1 -->
          <label class="nav-step">
            <input type="radio" name="checkout_step" value="cart" class="nav-radio" checked>
            <span class="step-content">
              <span class="step-number">1</span>
              <span class="step-label">Cart</span>
            </span>
            <div class="skew-bg"></div>
          </label>
          
          <div class="nav-divider"></div>

          <!-- Step 2 -->
          <label class="nav-step">
            <input type="radio" name="checkout_step" value="shipping" class="nav-radio">
            <span class="step-content">
              <span class="step-number">2</span>
              <span class="step-label">Shipping</span>
            </span>
            <div class="skew-bg"></div>
          </label>

          <div class="nav-divider"></div>

          <!-- Step 3 -->
          <label class="nav-step">
            <input type="radio" name="checkout_step" value="payment" class="nav-radio">
            <span class="step-content">
              <span class="step-number">3</span>
              <span class="step-label">Payment</span>
            </span>
            <div class="skew-bg"></div>
          </label>

          <div class="nav-divider"></div>

          <!-- Step 4 -->
          <label class="nav-step">
            <input type="radio" name="checkout_step" value="review" class="nav-radio">
            <span class="step-content">
              <span class="step-number">4</span>
              <span class="step-label">Review</span>
            </span>
            <div class="skew-bg"></div>
          </label>

        </div>
      </nav>
      
      <div class="secure-badge">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
        Secure
      </div>
    </header>

    <main class="checkout-content">
      <div class="placeholder-card ease-glass-card">
        <h2>Checkout Step Content</h2>
        <p class="ease-color-muted">Interact with the navbar above to see the pure CSS skew-active transitions.</p>
      </div>
    </main>

  </div>

</body>
</html>
