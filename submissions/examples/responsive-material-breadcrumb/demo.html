<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Material Responsive Breadcrumb</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="page">
        <section class="breadcrumb-card">

            <span class="label">Navigation</span>

            <h1>Responsive Breadcrumb</h1>

            <nav class="breadcrumb" aria-label="Breadcrumb">
                <a href="#" class="breadcrumb-item">
                    Home
                </a>

                <span class="separator">›</span>

                <a href="#" class="breadcrumb-item">
                    Products
                </a>

                <span class="separator">›</span>

                <a href="#" class="breadcrumb-item">
                    Electronics
                </a>

                <span class="separator">›</span>

                <span class="breadcrumb-current">
                    Smartphones
                </span>
            </nav>

            <div class="content">
                <h2>Smartphones</h2>
                <p>
                    Explore the latest smartphones and discover
                    devices designed for modern digital experiences.
                </p>
            </div>

        </section>
    </main>

</body>
</html>
