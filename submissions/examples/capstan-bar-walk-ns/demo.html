<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Capstan Bar Walk — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Capstan Bar Walk demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Capstan Bar Walk</h1>
      <p class="lede">Ship capstan bars walking sailors around</p>
    </header>

    <section class="ease-capstan-bar-walk" data-demo="capstan-bar-walk" aria-live="polite">
      <div class="ease-capstan-bar-walk__housing">
        <div class="ease-capstan-bar-walk__bezel">
          <div class="ease-capstan-bar-walk__face">
            <div class="ease-capstan-bar-walk__readout">
              <span class="ease-capstan-bar-walk__label">Capstan Bar Walk</span>
              <span class="ease-capstan-bar-walk__value">LIVE</span>
            </div>
            <div class="ease-capstan-bar-walk__motion" aria-hidden="true">
              <span class="ease-capstan-bar-walk__a"></span>
              <span class="ease-capstan-bar-walk__b"></span>
              <span class="ease-capstan-bar-walk__c"></span>
              <span class="ease-capstan-bar-walk__d"></span>
            </div>
            <div class="ease-capstan-bar-walk__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-capstan-bar-walk__controls">
          <button type="button" class="ease-capstan-bar-walk__btn primary">Engage</button>
          <button type="button" class="ease-capstan-bar-walk__btn">Reset</button>
          <label class="ease-capstan-bar-walk__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-capstan-bar-walk__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
