<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Pure CSS Foucault Pendulum Swing Loader"
  >

  <title>Foucault Pendulum Swing Loader</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="demo">
    <section
      class="loader-wrapper"
      role="status"
      aria-live="polite"
      aria-label="Loading content"
    >
      <div class="pendulum-loader" aria-hidden="true">
        <div class="pendulum-frame">
          <span class="support support-left"></span>
          <span class="support support-right"></span>
          <span class="crossbar"></span>

          <div class="pendulum-system">
            <span class="string"></span>

            <span class="pendulum-bob">
              <span class="bob-highlight"></span>
            </span>
          </div>

          <span class="swing-shadow"></span>
        </div>
      </div>

      <p class="loader-label">Loading</p>
    </section>
  </main>
</body>
</html>
