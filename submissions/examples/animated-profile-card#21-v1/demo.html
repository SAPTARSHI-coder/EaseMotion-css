<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Animated Profile Card - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Pure CSS follow toggle -->
  <input
    type="checkbox"
    id="follow-toggle"
    class="follow-toggle"
    aria-label="Toggle follow state"
  />

  <main class="profile-page">

    <section class="profile-card">

      <div class="profile-banner"></div>

      <div class="profile-avatar">
        <span>A</span>
        <span class="status-dot"></span>
      </div>

      <div class="profile-content">
        <h1>Aarav Sharma</h1>
        <p class="profile-role">Frontend Developer</p>

        <p class="profile-bio">
          Building smooth, modern, and animation-first user interfaces
          with clean HTML and CSS.
        </p>

        <div class="profile-stats">
          <div class="stat">
            <strong>128</strong>
            <span>Projects</span>
          </div>

          <div class="stat">
            <strong>12.4k</strong>
            <span>Followers</span>
          </div>

          <div class="stat">
            <strong>342</strong>
            <span>Following</span>
          </div>
        </div>

        <div class="profile-actions">
          <label for="follow-toggle" class="profile-btn follow">
            <span class="follow-label">Follow</span>
            <span class="following-label">Following</span>
          </label>

          <a href="#" class="profile-btn message">
            Message
          </a>
        </div>
      </div>

    </section>

  </main>

</body>
</html>
