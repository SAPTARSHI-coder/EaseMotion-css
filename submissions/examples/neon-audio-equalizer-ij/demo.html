<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Audio Equalizer - EaseMotion CSS</title>
    <!-- Include EaseMotion Core Stylesheet -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #0f0715; color: #ffffff;">

    <div class="ease-card ease-card-glass equalizer-container">
        <div class="equalizer-header">
            <h2>Audio Equalizer</h2>
            <span class="ease-badge ease-badge-success">Playing</span>
        </div>
        
        <div class="equalizer-screen ease-center">
            <div class="eq-bars ease-flex ease-items-end ease-gap-2">
                <div class="eq-bar bar-1"></div>
                <div class="eq-bar bar-2"></div>
                <div class="eq-bar bar-3"></div>
                <div class="eq-bar bar-4"></div>
                <div class="eq-bar bar-5"></div>
                <div class="eq-bar bar-6"></div>
            </div>
        </div>

        <div class="equalizer-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Track: Synthwave_01</span>
            <button class="ease-btn ease-btn-primary ease-btn-sm ease-hover-grow">Mute</button>
        </div>
    </div>

</body>
</html>
