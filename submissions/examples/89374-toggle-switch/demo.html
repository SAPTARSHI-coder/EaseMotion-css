<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toggle Switch Component</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="toggle-container">
        <label class="ease-toggle-switch">
            <input type="checkbox" class="ease-toggle-input">
            <span class="ease-toggle-slider">
                <span class="ease-toggle-thumb"></span>
            </span>
            <span class="ease-toggle-label">Enable Notifications</span>
        </label>

        <label class="ease-toggle-switch">
            <input type="checkbox" class="ease-toggle-input" checked>
            <span class="ease-toggle-slider">
                <span class="ease-toggle-thumb"></span>
            </span>
            <span class="ease-toggle-label">Dark Mode</span>
        </label>
    </div>

</body>
</html>
