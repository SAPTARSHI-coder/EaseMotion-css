<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glitch-Flicker Modal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<section class="hero">

    <h1>CSS Glitch-Flicker Modal</h1>

    <p>
        A lightweight modal built using only HTML and CSS with a subtle
        glitch-flicker entrance animation.
    </p>

    <a href="#modal" class="open-btn">Open Modal</a>

</section>

<div id="modal" class="modal-overlay">

    <div class="modal">

        <h2>Confirm Action</h2>

        <p>
            This modal demonstrates a subtle glitch-flicker animation using
            pure CSS. No JavaScript is required.
        </p>

        <div class="modal-actions">

            <a href="#" class="btn secondary">Cancel</a>

            <a href="#" class="btn primary">Continue</a>

        </div>

    </div>

</div>

</body>
</html>
