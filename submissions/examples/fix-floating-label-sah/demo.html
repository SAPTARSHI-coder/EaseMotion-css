<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Floating Label Autofill Fix - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="form-wrapper">
    <h1>Floating Label Autofill Fix (<code>#56072</code>)</h1>
    <p class="subtitle">Using <code>:placeholder-shown</code> and <code>:-webkit-autofill</code> selectors ensures floating labels elevate cleanly during browser password autofill.</p>
    
    <form class="card-form" onsubmit="return false;">
      <div class="ease-floating-field">
        <input type="text" id="username" class="field-input" placeholder=" " value="sahare77 (Autofilled Mock)" />
        <label for="username" class="field-label">GitHub Username / Email</label>
      </div>
      
      <div class="ease-floating-field">
        <input type="password" id="password" class="field-input" placeholder=" " />
        <label for="password" class="field-label">Password</label>
      </div>
      
      <button class="submit-btn">Continue to Dashboard →</button>
    </form>
  </div>
</body>
</html>
