<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Rating Star System - Cyberpunk Theme</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Animated Background -->

    <div class="gradient-bg"></div>

    <div class="grid-overlay"></div>

    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>
    <div class="glow glow-3"></div>

    <!-- Rating Card -->

    <main class="rating-wrapper">

        <section class="rating-card">

            <span class="tag">
                Cyberpunk Theme
            </span>

            <h1>
                Rate Your Experience
            </h1>

            <p class="subtitle">
                Select a rating below and enjoy smooth cyberpunk-inspired
                animations with glowing interactive stars.
            </p>

            <!-- Stars -->

            <div class="stars" id="stars">

                <span class="star" data-value="1">★</span>

                <span class="star" data-value="2">★</span>

                <span class="star" data-value="3">★</span>

                <span class="star" data-value="4">★</span>

                <span class="star" data-value="5">★</span>

            </div>

            <!-- Rating Text -->

            <div class="rating-info">

                <h2 id="ratingValue">
                    0 / 5
                </h2>

                <p id="ratingMessage">
                    Hover over the stars to preview your rating.
                </p>

            </div>

            <!-- Progress -->

            <div class="progress">

                <div class="progress-fill" id="progressFill"></div>

            </div>

            <!-- Button -->

            <button id="submitBtn">
                Submit Rating
            </button>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
