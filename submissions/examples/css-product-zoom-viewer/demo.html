<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Product Zoom Viewer - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="em-zoom-page">
        <div class="em-zoom-card" role="region" aria-label="Product Zoom Viewer Showcase">
            <!-- Product Zoom Viewport Container -->
            <div class="em-zoom-container" tabindex="0" aria-label="Product image container with hover zoom">
                <div class="em-zoom-image"></div>
                <span class="em-zoom-badge">HOVER TO ZOOM</span>
            </div>

            <div class="em-zoom-content">
                <h1 class="em-card-title">Product Zoom Viewer</h1>
                <p class="em-card-desc">Immersive product image zoom detail view crafted entirely using pure CSS scale transforms and overflow clipping.</p>
                <a href="#" class="em-card-btn" role="button">Add to Cart</a>
            </div>
        </div>
    </div>
</body>
</html>
