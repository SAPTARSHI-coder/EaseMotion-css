<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Drag Handle List</title>
<link rel="stylesheet" href="style.css" />
<script>
  function dhInit(list) {
    var dragging = null;

    list.addEventListener('dragstart', function (e) {
      var item = e.target.closest('.dh-item');
      if (!item || !e.target.classList.contains('dh-grip')) { e.preventDefault(); return; }
      dragging = item;
      item.classList.add('dh-dragging');
    });

    list.addEventListener('dragend', function () {
      if (dragging) dragging.classList.remove('dh-dragging');
      dragging = null;
    });

    list.addEventListener('dragover', function (e) {
      e.preventDefault();
      var after = [...list.querySelectorAll('.dh-item:not(.dh-dragging)')].find(function (el) {
        var box = el.getBoundingClientRect();
        return e.clientY < box.top + box.height / 2;
      });
      if (!dragging) return;
      if (after) list.insertBefore(dragging, after);
      else list.appendChild(dragging);
    });
  }
</script>
</head>
<body>
<main class="dh-wrap">
  <h1 class="dh-h1">Reorderable List</h1>
  <p class="dh-lede">Only the grip icon is draggable=true; the row content stays selectable text, so dragging never accidentally starts from a mid-click on the label.</p>

  <ul class="dh-list" id="dh-list" onload="dhInit(this)">
    <li class="dh-item" draggable="false">
      <span class="dh-grip" draggable="true" aria-hidden="true">⠿</span>
      <span>Write the outline</span>
    </li>
    <li class="dh-item" draggable="false">
      <span class="dh-grip" draggable="true" aria-hidden="true">⠿</span>
      <span>Draft section one</span>
    </li>
    <li class="dh-item" draggable="false">
      <span class="dh-grip" draggable="true" aria-hidden="true">⠿</span>
      <span>Review with editor</span>
    </li>
  </ul>
  <script>dhInit(document.getElementById('dh-list'));</script>
</main>
</body>
</html>
