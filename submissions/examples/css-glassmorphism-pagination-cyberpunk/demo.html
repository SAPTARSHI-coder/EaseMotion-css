<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glassmorphism Pagination | Cyberpunk Styling</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="pagination-card" aria-label="Glassmorphism Cyberpunk Pagination Showcase">
    <!-- Telemetry Header Banner -->
    <div class="telemetry-status">
        <span>SHOWING <strong class="status-badge">11 - 20</strong> OF 120 RECORDS</span>
        <span>SECTOR: <strong class="status-badge">02 // DATA-CORE</strong></span>
    </div>

    <!-- Cyberpunk Pagination Bar -->
    <nav class="cyber-pagination" aria-label="Page navigation">
        <ul class="pagination-list">
            <!-- Prev Button -->
            <li class="page-item">
                <a href="#" class="page-link" aria-label="Previous Page">
                    <svg class="page-icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="15 18 9 12 15 6"></polyline>
                    </svg>
                </a>
            </li>

            <!-- Page 1 -->
            <li class="page-item">
                <a href="#" class="page-link">01</a>
            </li>

            <!-- Page 2 (Active) -->
            <li class="page-item active">
                <a href="#" class="page-link" aria-current="page">02</a>
            </li>

            <!-- Page 3 -->
            <li class="page-item">
                <a href="#" class="page-link">03</a>
            </li>

            <!-- Ellipsis Spacer -->
            <li class="page-item ellipsis" aria-hidden="true">
                <span class="page-link">...</span>
            </li>

            <!-- Page 12 -->
            <li class="page-item">
                <a href="#" class="page-link">12</a>
            </li>

            <!-- Next Button -->
            <li class="page-item">
                <a href="#" class="page-link" aria-label="Next Page">
                    <svg class="page-icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </a>
            </li>
        </ul>
    </nav>
</main>

</body>
</html>
