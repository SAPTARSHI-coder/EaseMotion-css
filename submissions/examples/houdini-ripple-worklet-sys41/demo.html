<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Paint API Houdini Custom Ripple Worklet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../easemotion.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>Houdini Paint Worklet Ripple</h1>
      <p>GPU-accelerated liquid ripple rendering via CSS Paint API.</p>
    </header>

    <main class="stage">
      <button class="houdini-btn" id="houdiniBtn">
        Click For Paint Ripple
      </button>
    </main>
  </div>

  <script>
    if ('paintWorklet' in CSS) {
      CSS.paintWorklet.addModule('paint-worklet.js');
    }
    const btn = document.getElementById('houdiniBtn');
    btn.addEventListener('click', (e) => {
      const rect = btn.getBoundingClientRect();
      btn.style.setProperty('--ripple-x', (e.clientX - rect.left) + 'px');
      btn.style.setProperty('--ripple-y', (e.clientY - rect.top) + 'px');
      btn.classList.add('animating');
      setTimeout(() => btn.classList.remove('animating'), 600);
    });
  </script>
</body>
</html>
