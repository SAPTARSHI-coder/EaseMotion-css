<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        Blur Entrance Progress Bar - Gaming Hub
    </title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<section class="progress-section">


    <header class="hero">

        <span class="badge">
            GAMING HUB
        </span>

        <h1>
            Player Progress Dashboard
        </h1>

        <p>
            Track your gaming journey with animated progress indicators.
        </p>

    </header>



    <div class="progress-container">


        <div class="progress-card">

            <h2>
                Level Progress
            </h2>

            <div class="bar">

                <span class="fill first"></span>

            </div>

            <p>
                Level 75 / 100
            </p>

        </div>




        <div class="progress-card">

            <h2>
                Battle Pass
            </h2>

            <div class="bar">

                <span class="fill second"></span>

            </div>

            <p>
                60% Completed
            </p>

        </div>




        <div class="progress-card">

            <h2>
                Achievement XP
            </h2>

            <div class="bar">

                <span class="fill third"></span>

            </div>

            <p>
                90% Unlocked
            </p>

        </div>



    </div>


</section>


</body>

</html>
