<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ECG Heartbeat Monitor Line</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      margin: 0; min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 1rem; padding: 24px;
      background: linear-gradient(160deg, #f8fafc, #eef2ff 55%, #f8fafc);
      color: #111827; font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      
    }
    h1 { margin: 0; font-size: 1.25rem; text-align: center; }
    .note { margin: 0; max-width: 420px; text-align: center; color: #4b5563; font-size: 0.92rem; line-height: 1.45; }
  </style>
</head>
<body>
  <h1>ECG Heartbeat Monitor Line</h1>
  <p class="note">Decorative UI motion — not a medical device.</p>
  <svg class="ecg" viewBox="0 0 400 80" aria-label="Heartbeat monitor">
  <path class="ecg__line" d="M0 40 H40 L55 40 L70 10 L85 70 L100 40 H160 L175 40 L190 18 L205 62 L220 40 H400" pathLength="1"/>
</svg>
  
</body>
</html>
