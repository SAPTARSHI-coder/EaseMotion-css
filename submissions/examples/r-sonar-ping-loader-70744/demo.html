<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Pure CSS sonar ping loader animation">
  <title>CSS Sonar Ping Loader</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">
    <section class="loader-card" aria-label="Loading content">
      <div class="sonar" role="status" aria-live="polite">
        <span class="ping ping-one"></span>
        <span class="ping ping-two"></span>
        <span class="ping ping-three"></span>
        <span class="core" aria-hidden="true"></span>
      </div>

      <div class="content">
        <span class="eyebrow">EaseMotion CSS</span>
        <h1>Scanning...</h1>
        <p>Searching for available results.</p>
      </div>
    </section>
  </main>

</body>
</html>
