<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EaseMotion — Notification Bell</title>
  <link rel="stylesheet" href="../../core/variables.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="demo-container">
    <h1>Notification Bell</h1>
    <p>Animated bell icon with unread count badge.</p>

    <div class="bell-card">
      <div class="bell-wrapper" id="bellWrapper" onclick="togglePanel()">
        <span class="bell-icon">🔔</span>
        <span class="badge" id="badge">3</span>
      </div>
      <div class="notification-panel" id="panel">
        <div class="panel-header">
          <span>Notifications</span>
          <button class="mark-read" onclick="markAllRead()">Mark all read</button>
        </div>
        <ul class="notification-list">
          <li class="unread"><strong>New comment</strong> on your post<br><small>2 min ago</small></li>
          <li class="unread"><strong>Follow request</strong> from @alice<br><small>15 min ago</small></li>
          <li class="unread"><strong>System update</strong> completed<br><small>1 hour ago</small></li>
        </ul>
      </div>
    </div>
  </div>
  <script>
    function togglePanel() {
      document.getElementById('panel').classList.toggle('show');
    }
    function markAllRead() {
      document.querySelectorAll('.unread').forEach(el => el.classList.remove('unread'));
      const badge = document.getElementById('badge');
      badge.textContent = '0';
      badge.style.display = 'none';
    }
  </script>
</body>
</html>
