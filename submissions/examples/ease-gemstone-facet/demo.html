<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemstone Facet · facets reflect light like diamond</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <div class="gemstone-container">
      <div class="gemstone-display" id="gemstoneDisplay">
        <!-- Canvas for gemstone -->
        <canvas id="gemstoneCanvas"></canvas>
        
        <!-- Gemstone Info -->
        <div class="gemstone-info">
          <span class="info-label">💎 Brilliance</span>
          <span class="info-value" id="brillianceLevel">0%</span>
        </div>

        <!-- Gemstone Controls -->
        <div class="gemstone-controls">
          <div class="control-group">
            <label class="control-label">💎 Light</label>
            <input type="range" class="control-slider" id="lightSlider" min="0" max="100" value="50">
            <span class="control-value" id="lightValue">50%</span>
          </div>
          <div class="control-group">
            <label class="control-label">🌈 Color</label>
            <div class="color-options">
              <button class="color-btn active" data-color="diamond" title="Diamond">💎</button>
              <button class="color-btn" data-color="ruby" title="Ruby">❤️</button>
              <button class="color-btn" data-color="emerald" title="Emerald">💚</button>
              <button class="color-btn" data-color="sapphire" title="Sapphire">💙</button>
              <button class="color-btn" data-color="amethyst" title="Amethyst">💜</button>
            </div>
          </div>
        </div>

        <!-- Gemstone Text -->
        <div class="gemstone-text">
          <span class="text-label">💎 Gemstone</span>
          <span class="text-message" id="gemstoneMessage">Facets reflecting light like a diamond</span>
        </div>
      </div>
      
      <div class="gemstone-status">
        <span id="gemstoneStatus">💎 Gemstone facets sparkling with light</span>
      </div>
    </div>

    <div class="controls">
      <button class="btn btn-reset" id="resetBtn">⟳ Reset</button>
    </div>
    <div class="footer-note">
      <span>💎 gemstone facets · 5 colors · light reflection</span>
    </div>
  </div>

  <script>
    (function() {
      "use strict";

      // DOM refs
      const canvas = document.getElementById('gemstoneCanvas');
      const ctx = canvas.getContext('2d');
      const display = document.getElementById('gemstoneDisplay');
      const brillianceLevel = document.getElementById('brillianceLevel');
      const gemstoneStatus = document.getElementById('gemstoneStatus');
      const gemstoneMessage = document.getElementById('gemstoneMessage');
      const resetBtn = document.getElementById('resetBtn');
      const lightSlider = document.getElementById('lightSlider');
      const lightValue = document.getElementById('lightValue');
      const colorBtns = document.querySelectorAll('.color-btn');

      // State
      let time = 0;
      let animationId = null;
      let currentColor = 'diamond';
      let lightIntensity = 50;
      let reflections = [];

      // Color configurations
      const colorConfigs = {
        diamond: { name: 'Diamond', main: '#e2e8f0', light: '#ffffff', dark: '#94a3b8', glow: 'rgba(226,232,240,0.2)', sparkle: '#ffffff' },
        ruby: { name: 'Ruby', main: '#ef4444', light: '#fca5a5', dark: '#b91c1c', glow: 'rgba(239,68,68,0.2)', sparkle: '#fca5a5' },
        emerald: { name: 'Emerald', main: '#22c55e', light: '#86efac', dark: '#15803d', glow: 'rgba(34,197,94,0.2)', sparkle: '#86efac' },
        sapphire: { name: 'Sapphire', main: '#3b82f6', light: '#93c5fd', dark: '#1d4ed8', glow: 'rgba(59,130,246,0.2)', sparkle: '#93c5fd' },
        amethyst: { name: 'Amethyst', main: '#8b5cf6', light: '#c4b5fd', dark: '#6d28d9', glow: 'rgba(139,92,246,0.2)', sparkle: '#c4b5fd' }
      };

      // Reflection class
      class Reflection {
        constructor(x, y, angle, color) {
          this.x = x || Math.random() * canvas.width;
          this.y = y || Math.random() * canvas.height;
          this.angle = angle || Math.random() * Math.PI * 2;
          this.color = color || currentColor;
          this.size = 2 + Math.random() * 5;
          this.speed = 0.02 + Math.random() * 0.03;
          this.life = 0.5 + Math.random() * 0.5;
          this.maxLife = this.life;
          this.phase = Math.random() * Math.PI * 2;
          this.opacity = 0.3 + Math.random() * 0.4;
          this.type = Math.random() > 0.5 ? 'sparkle' : 'beam';
        }

        update(light) {
          const intensity = light / 100;
          this.phase += this.speed * (0.5 + intensity * 0.5);
          this.life -= 0.003 * (0.5 + intensity * 0.5);
          this.opacity = (this.life / this.maxLife) * (0.3 + intensity * 0.5);
          return this.life > 0;
        }

        draw(ctx, colorData) {
          const alpha = this.opacity * 0.6;
          const size = this.size * (0.5 + (this.life / this.maxLife) * 0.5);
          
          ctx.save();
          ctx.globalAlpha = alpha;
          ctx.translate(this.x, this.y);
          ctx.rotate(this.angle + this.phase);
          
          if (this.type === 'sparkle') {
            // Star sparkle
            ctx.shadowColor = colorData.main;
            ctx.shadowBlur = 10;
            ctx.fillStyle = colorData.sparkle;
            
            const points = 4;
            ctx.beginPath();
            for (let i = 0; i < points * 2; i++) {
              const radius = i % 2 === 0 ? size : size * 0.3;
              const angle = (i / (points * 2)) * Math.PI * 2;
              const px = Math.cos(angle) * radius;
              const py = Math.sin(angle) * radius;
              if (i === 0) ctx.moveTo(px, py);
              else ctx.lineTo(px, py);
            }
            ctx.closePath();
            ctx.fill();
            
            // Glow
            ctx.shadowBlur = 20;
            ctx.globalAlpha = alpha * 0.2;
            ctx.beginPath();
            ctx.arc(0, 0, size * 2, 0, Math.PI * 2);
            ctx.fill();
          } else {
            // Light beam
            ctx.shadowColor = colorData.main;
            ctx.shadowBlur = 5;
            ctx.fillStyle = colorData.main;
            ctx.globalAlpha = alpha * 0.3;
            ctx.beginPath();
            ctx.moveTo(-size * 2, 0);
            ctx.lineTo(0, -size * 0.3);
            ctx.lineTo(0, size * 0.3);
            ctx.closePath();
            ctx.fill();
            
            ctx.shadowBlur = 0;
            ctx.globalAlpha = alpha * 0.15;
            ctx.fillStyle = colorData.light;
            ctx.beginPath();
            ctx.moveTo(-size * 1.5, 0);
            ctx.lineTo(0, -size * 0.15);
            ctx.lineTo(0, size * 0.15);
            ctx.closePath();
            ctx.fill();
          }
          
          ctx.restore();
        }
      }

      // Generate gemstone facets
      function drawGemstone(light, color) {
        const w = canvas.width;
        const h = canvas.height;
        const cx = w / 2;
        const cy = h / 2;
        const maxSize = Math.min(w, h) * 0.35;
        const size = maxSize * (0.5 + (light / 100) * 0.5);
        const colorData = colorConfigs[color];
        const intensity = light / 100;
        const time2 = time;

        // Background
        drawBackground();

        // Gemstone glow
        const glowGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, size * 1.5);
        glowGrad.addColorStop(0, colorData.glow);
        glowGrad.addColorStop(0.5, colorData.glow);
        glowGrad.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = glowGrad;
        ctx.globalAlpha = intensity * 0.5;
        ctx.beginPath();
        ctx.arc(cx, cy, size * 1.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;

        // Main gemstone shape (diamond cut)
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(time2 * 0.02);

        // Facets
        const facetCount = 8;
        const facetAngles = [];
        for (let i = 0; i < facetCount; i++) {
          facetAngles.push((i / facetCount) * Math.PI * 2);
        }

        // Draw facets
        for (let i = 0; i < facetCount; i++) {
          const angle1 = facetAngles[i];
          const angle2 = facetAngles[(i + 1) % facetCount];
          const midAngle = (angle1 + angle2) / 2;
          
          const outerR = size * (0.8 + Math.sin(time2 * 0.3 + i) * 0.05);
          const innerR = size * 0.3;
          
          // Facet shape
          ctx.beginPath();
          ctx.moveTo(Math.cos(angle1) * outerR, Math.sin(angle1) * outerR);
          ctx.lineTo(Math.cos(midAngle) * innerR, Math.sin(midAngle) * innerR);
          ctx.lineTo(Math.cos(angle2) * outerR, Math.sin(angle2) * outerR);
          ctx.closePath();
          
          // Facet color with lighting
          const lightAngle = Math.cos(time2 * 0.02 + i * 0.8) * 0.5 + 0.5;
          const facetColor = i % 2 === 0 ? colorData.light : colorData.main;
          const brightness = 0.5 + lightAngle * 0.5 * intensity;
          
          ctx.fillStyle = facetColor;
          ctx.globalAlpha = 0.3 + brightness * 0.5;
          ctx.shadowColor = colorData.main;
          ctx.shadowBlur = 5;
          ctx.fill();
          
          // Facet stroke
          ctx.shadowBlur = 0;
          ctx.strokeStyle = colorData.dark;
          ctx.lineWidth = 0.5;
          ctx.globalAlpha = 0.1 + intensity * 0.2;
          ctx.stroke();
        }

        // Center star
        ctx.shadowColor = colorData.main;
        ctx.shadowBlur = 20 * intensity;
        ctx.fillStyle = colorData.light;
        ctx.globalAlpha = 0.2 + intensity * 0.3;
        const starSize = size * 0.15;
        ctx.beginPath();
        for (let i = 0; i < 10; i++) {
          const angle = (i / 10) * Math.PI * 2 + time2 * 0.01;
          const radius = i % 2 === 0 ? starSize : starSize * 0.4;
          const px = Math.cos(angle) * radius;
          const py = Math.sin(angle) * radius;
          if (i === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.fill();

        // Light reflections
        if (intensity > 0.1 && Math.random() < intensity * 0.1) {
          const angle = Math.random() * Math.PI * 2;
          const dist = size * (0.2 + Math.random() * 0.5);
          const x = Math.cos(angle) * dist;
          const y = Math.sin(angle) * dist;
          const reflection = new Reflection(
            cx + x,
            cy + y,
            angle,
            color
          );
          reflections.push(reflection);
        }

        ctx.restore();

        // Update and draw reflections
        reflections = reflections.filter(r => {
          const alive = r.update(light);
          if (alive) r.draw(ctx, colorData);
          return alive;
        });

        // Update brilliance level
        const percent = Math.round(light * (0.5 + (light / 100) * 0.5));
        brillianceLevel.textContent = percent + '%';
        brillianceLevel.style.color = percent > 50 ? colorData.main : '#94a3b8';

        // Update status
        if (light > 70) {
          gemstoneStatus.textContent = '💎 Gemstone blazing with brilliance! ✨';
          gemstoneStatus.style.color = '#fbbf24';
        } else if (light > 30) {
          gemstoneStatus.textContent = '💎 Facets reflecting light beautifully';
          gemstoneStatus.style.color = colorData.main;
        } else {
          gemstoneStatus.textContent = '💎 Gemstone facets sparkling with light';
          gemstoneStatus.style.color = '#94a3b8';
        }

        // Update message
        gemstoneMessage.textContent = `${colorData.name} facets reflecting light`;
        gemstoneMessage.style.color = colorData.main;
      }

      // Draw background
      function drawBackground() {
        const w = canvas.width;
        const h = canvas.height;
        
        const grad = ctx.createRadialGradient(w/2, h/2, 0, w/2, h/2, w * 0.7);
        grad.addColorStop(0, 'rgba(10, 15, 25, 0.3)');
        grad.addColorStop(0.5, 'rgba(15, 20, 30, 0.4)');
        grad.addColorStop(1, 'rgba(5, 10, 20, 0.6)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, w, h);
      }

      // Resize canvas
      function resizeCanvas() {
        const rect = display.getBoundingClientRect();
        canvas.width = rect.width;
        canvas.height = rect.height;
        canvas.style.width = rect.width + 'px';
        canvas.style.height = rect.height + 'px';
      }

      // Animation loop
      function animate() {
        time += 0.02;
        const light = parseInt(lightSlider.value);
        const color = currentColor;
        
        drawGemstone(light, color);
        
        animationId = requestAnimationFrame(animate);
      }

      // Set color
      function setColor(color) {
        currentColor = color;
        colorBtns.forEach(btn => {
          btn.classList.toggle('active', btn.dataset.color === color);
        });
        const colorData = colorConfigs[color];
        gemstoneStatus.textContent = `💎 Color: ${colorData.name}`;
        gemstoneStatus.style.color = colorData.main;
        setTimeout(() => {
          gemstoneStatus.textContent = '💎 Gemstone facets sparkling with light';
          gemstoneStatus.style.color = '#94a3b8';
        }, 1500);
      }

      // Reset
      function resetGemstone() {
        lightSlider.value = 50;
        lightValue.textContent = '50%';
        reflections = [];
        gemstoneStatus.textContent = '🔄 Reset complete';
        gemstoneStatus.style.color = '#94a3b8';
        gemstoneMessage.textContent = 'Facets reflecting light like a diamond';
        gemstoneMessage.style.color = '#94a3b8';
        setTimeout(() => {
          gemstoneStatus.textContent = '💎 Gemstone facets sparkling with light';
          gemstoneStatus.style.color = '#94a3b8';
        }, 1000);
      }

      // Event listeners
      lightSlider.addEventListener('input', function() {
        lightValue.textContent = this.value + '%';
      });

      colorBtns.forEach(btn => {
        btn.addEventListener('click', function() {
          setColor(this.dataset.color);
        });
      });

      if (resetBtn) {
        resetBtn.addEventListener('click', function(e) {
          e.preventDefault();
          resetGemstone();
        });
      }

      // Keyboard shortcuts
      document.addEventListener('keydown', function(e) {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

        const key = e.key;
        if (key === 'r' || key === 'R') {
          e.preventDefault();
          resetGemstone();
        }
      });

      // Resize
      window.addEventListener('resize', resizeCanvas);

      // Initialize
      resizeCanvas();
      animate();
      
      console.log('💎 Gemstone Facet ready · shortcuts: [R] Reset');
    })();
  </script>
</body>
</html>
