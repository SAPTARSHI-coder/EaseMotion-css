<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark light">
  <title>Subtle Elevate Toast</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">
    <section class="demo-area" aria-label="Subtle elevate toast demo">

      <article class="toast" role="status">
        <div class="toast-icon" aria-hidden="true">
          ✓
        </div>

        <div class="toast-content">
          <span class="toast-label">SUCCESS</span>
          <h1>Changes Saved</h1>
          <p>Your preferences have been updated successfully.</p>
        </div>

        <button
          class="toast-close"
          type="button"
          aria-label="Close notification"
        >
          ×
        </button>
      </article>

    </section>
  </main>

</body>
</html>
