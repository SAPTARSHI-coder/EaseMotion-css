<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <meta
    name="description"
    content="Accessible CSS-only sleep tracker arc showing deep, light and awake sleep segments."
  >
  <title>Sleep Tracker Arc</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="sleep-page">

    <section
      class="sleep-card"
      aria-labelledby="sleep-title"
    >

      <header class="sleep-header">
        <div>
          <p class="eyebrow">Sleep Summary</p>
          <h1 id="sleep-title">Sleep Tracker</h1>
        </div>

        <span class="status-badge">
          Good Night
        </span>
      </header>

      <div
        class="sleep-visual"
        role="img"
        aria-label="Sleep duration of 8 hours 24 minutes. Deep sleep 2 hours 18 minutes, light sleep 5 hours 32 minutes, awake 34 minutes."
      >

        <div class="arc arc-base"></div>

        <div class="arc arc-light"></div>

        <div class="arc arc-deep"></div>

        <div class="arc arc-awake"></div>

        <div class="arc-glow"></div>

        <div class="sleep-center">
          <span class="moon" aria-hidden="true">☾</span>

          <strong>8h 24m</strong>

          <span>Total Sleep</span>
        </div>

      </div>

      <div class="sleep-period">
        <span>11:08 PM</span>

        <div class="period-line">
          <span></span>
        </div>

        <span>7:32 AM</span>
      </div>

      <div class="sleep-stats">

        <article class="stat-card deep">
          <span class="stat-icon" aria-hidden="true">●</span>

          <div>
            <span class="stat-label">Deep Sleep</span>
            <strong>2h 18m</strong>
          </div>

          <span class="stat-percent">27%</span>
        </article>

        <article class="stat-card light">
          <span class="stat-icon" aria-hidden="true">●</span>

          <div>
            <span class="stat-label">Light Sleep</span>
            <strong>5h 32m</strong>
          </div>

          <span class="stat-percent">66%</span>
        </article>

        <article class="stat-card awake">
          <span class="stat-icon" aria-hidden="true">●</span>

          <div>
            <span class="stat-label">Awake</span>
            <strong>34m</strong>
          </div>

          <span class="stat-percent">7%</span>
        </article>

      </div>

      <footer class="sleep-footer">

        <div>
          <span class="footer-label">Sleep Quality</span>

          <strong>Excellent</strong>
        </div>

        <div
          class="quality-bar"
          role="progressbar"
          aria-label="Sleep quality"
          aria-valuenow="92"
          aria-valuemin="0"
          aria-valuemax="100"
        >
          <span></span>
        </div>

        <span class="quality-score">92%</span>

      </footer>

    </section>

  </main>

</body>
</html>
