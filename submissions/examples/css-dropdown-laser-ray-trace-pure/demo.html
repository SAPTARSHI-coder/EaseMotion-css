<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Dropdown: Laser Ray Trace</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="layout-container">
        
        <header class="section-header">
            <h1 class="title">Pure CSS Dropdown: Laser Trace</h1>
            <p class="subtitle">A hardware-accelerated, JavaScript-free dropdown menu. Features a highly performant `conic-gradient` masking technique to simulate a continuous laser beam tracing the menu's border.</p>
        </header>

        <div class="demo-area">
            
            <!-- 
              [TECHNIQUE] The Pure CSS Checkbox Hack 
              We use a hidden checkbox to manage the open/closed state of the dropdown 
              without any JavaScript.
            -->
            <div class="dropdown-container">
                <input type="checkbox" id="dropdown-toggle" class="dropdown-checkbox" aria-hidden="true">
                
                <label for="dropdown-toggle" class="dropdown-trigger">
                    <span>Select Protocol</span>
                    <svg class="chevron" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="6 9 12 15 18 9"></polyline>
                    </svg>
                </label>
                
                <!-- 
                  [TECHNIQUE] The Laser Trace Menu
                  The outer container spins the gradient, the inner container masks it.
                -->
                <div class="dropdown-menu-wrapper">
                    <div class="laser-border-engine"></div>
                    
                    <ul class="dropdown-menu-inner" role="menu">
                        <li role="menuitem">
                            <a href="#" class="menu-item">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                                Initialize Uplink
                            </a>
                        </li>
                        <li role="menuitem">
                            <a href="#" class="menu-item">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
                                Access Mainframe
                            </a>
                        </li>
                        <li role="menuitem">
                            <a href="#" class="menu-item">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                                System Config
                            </a>
                        </li>
                        <li class="menu-divider"></li>
                        <li role="menuitem">
                            <a href="#" class="menu-item danger">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><line x1="12" y1="2" x2="12" y2="12"/></svg>
                                Disconnect
                            </a>
                        </li>
                    </ul>
                </div>
                
            </div>
            
        </div>
        
    </div>

</body>
</html>
