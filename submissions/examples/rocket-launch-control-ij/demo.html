<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-rocket-launch-control demo</title>
</head>
<body>
<div class="rlc-console">
  <div class="rlc-title">LAUNCH CONTROL</div>
  <div class="rlc-tanks">
    <div class="rlc-tank"><span>FUEL</span><i class="rlc-bar rlc-fuel"></i></div>
    <div class="rlc-tank"><span>OX</span><i class="rlc-bar rlc-ox"></i></div>
  </div>
  <div class="rlc-tele">
    <span>ALT 4.2KM</span>
    <span>SPD 120</span>
    <span>THR 86%</span>
  </div>
  <div class="rlc-button">IGNITE</div>
</div>
</body>
</html>
