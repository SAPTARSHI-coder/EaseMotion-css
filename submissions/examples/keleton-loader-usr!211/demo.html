<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skeleton Loader - EaseMotion Submission</title>
  
  <!-- EaseMotion CSS Official CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="ease-center">

  <div class="container ease-fade-in">
    <h2 class="ease-slide-up">Loading Content...</h2>
    
    <!-- Skeleton Card -->
    <div class="skeleton-card ease-scale-in ease-delay-200">
      <div class="skeleton-header">
        <div class="skeleton-avatar"></div>
        <div class="skeleton-lines">
          <div class="skeleton-line full"></div>
          <div class="skeleton-line half"></div>
        </div>
      </div>
      <div class="skeleton-body">
        <div class="skeleton-block large"></div>
        <div class="skeleton-block medium"></div>
        <div class="skeleton-block small"></div>
      </div>
      <div class="skeleton-footer">
        <div class="skeleton-button"></div>
      </div>
    </div>

  </div>

</body>
</html>
