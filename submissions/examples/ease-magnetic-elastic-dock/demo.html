<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ease Magnetic Elastic Dock with Velocity Spring Physics</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="dock-body">
  <div class="dock-container" id="dock">
    <div class="dock-icon">🏠</div>
    <div class="dock-icon">🎨</div>
    <div class="dock-icon">🚀</div>
    <div class="dock-icon">⚡</div>
    <div class="dock-icon">⚙️</div>
  </div>

  <script>
    const dock = document.getElementById('dock');
    const icons = dock.querySelectorAll('.dock-icon');
    dock.addEventListener('mousemove', (e) => {
      const mouseX = e.clientX;
      icons.forEach(icon => {
        const rect = icon.getBoundingClientRect();
        const iconCenter = rect.left + rect.width / 2;
        const dist = Math.abs(mouseX - iconCenter);
        const scale = 1 + Math.max(0, (1 - dist / 120)) * 0.6;
        icon.style.transform = `scale(${scale}) translateY(-${(scale - 1) * 20}px)`;
      });
    });
    dock.addEventListener('mouseleave', () => {
      icons.forEach(icon => { icon.style.transform = 'scale(1) translateY(0px)'; });
    });
  </script>
</body>
</html>
