<!-- EaseMotion component: stock-ticker-tape -->
<!DOCTYPE html>
<html lang="en" data-ticker="tape">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.3">
<title>Ease Stock Ticker Tape</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="ticker-wall">
  <header class="ticker-head">
    <span class="ticker-index">NASDAQ</span>
    <span class="ticker-change">+120.45</span>
  </header>
  <div class="ticker-tape">
    <span class="quote"><b>AAPL</b> 232.10 <em class="up">+1.2%</em></span>
    <span class="quote"><b>TSLA</b> 318.45 <em class="down">-0.8%</em></span>
    <span class="quote"><b>GOOG</b> 175.90 <em class="up">+0.5%</em></span>
    <span class="quote"><b>MSFT</b> 428.20 <em class="up">+0.9%</em></span>
    <span class="quote"><b>NVDA</b> 131.75 <em class="down">-1.1%</em></span>
    <span class="quote"><b>AMZN</b> 186.30 <em class="up">+0.7%</em></span>
    <span class="quote"><b>META</b> 512.60 <em class="up">+1.4%</em></span>
    <span class="quote"><b>NFLX</b> 689.05 <em class="down">-0.3%</em></span>
  </div>
  <footer class="ticker-foot">
    <span class="ticker-vol">VOL 4.2B</span>
    <span class="ticker-live">LIVE</span>
  </footer>
</main>
</body>
</html>
