<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro 3D Hero Component</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <section class="ease-retro-hero">
            <div class="ease-retro-hero-content">
                <span class="ease-retro-eyebrow">THE FUTURE LOOKS RETRO</span>
                <h1 class="ease-retro-heading">Build Beyond the Ordinary</h1>
                <p class="ease-retro-description">
                    A bold 3D hero experience inspired by classic retro-futuristic interfaces and modern CSS.
                </p>
                <div class="ease-retro-actions">
                    <a href="#" class="ease-retro-btn ease-retro-btn-primary">Explore Now</a>
                    <a href="#" class="ease-retro-btn ease-retro-btn-secondary">View Showcase</a>
                </div>
            </div>
            
            <div class="ease-retro-visual" aria-hidden="true">
                <div class="ease-retro-3d-scene">
                    <div class="ease-retro-3d-object">
                        <div class="ease-retro-face ease-retro-face-front">CSS</div>
                        <div class="ease-retro-face ease-retro-face-back"></div>
                        <div class="ease-retro-face ease-retro-face-left">RETRO</div>
                        <div class="ease-retro-face ease-retro-face-right">3D</div>
                        <div class="ease-retro-face ease-retro-face-top"></div>
                        <div class="ease-retro-face ease-retro-face-bottom"></div>
                    </div>
                </div>
                <div class="ease-retro-grid-floor"></div>
            </div>
        </section>
    </main>
</body>
</html>
