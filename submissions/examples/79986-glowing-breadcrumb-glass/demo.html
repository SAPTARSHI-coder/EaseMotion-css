<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Responsive glowing breadcrumb with glassmorphism styling"
  >
  <title>Glowing Glassmorphism Breadcrumb</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="page">
    <section class="showcase">
      <div class="glow glow-one" aria-hidden="true"></div>
      <div class="glow glow-two" aria-hidden="true"></div>

      <div class="content">
        <span class="eyebrow">EASEMOTION CSS</span>

        <h1>Glowing Breadcrumb</h1>

        <p>
          A responsive breadcrumb component combining frosted glass,
          subtle neon glow, and smooth hover interactions.
        </p>

        <nav class="breadcrumb" aria-label="Breadcrumb">
          <a href="#" class="breadcrumb-item">
            <span class="icon" aria-hidden="true">⌂</span>
            <span>Home</span>
          </a>

          <span class="separator" aria-hidden="true">/</span>

          <a href="#" class="breadcrumb-item">
            <span class="icon" aria-hidden="true">◈</span>
            <span>Components</span>
          </a>

          <span class="separator" aria-hidden="true">/</span>

          <a href="#" class="breadcrumb-item">
            <span class="icon" aria-hidden="true">✦</span>
            <span>Navigation</span>
          </a>

          <span class="separator" aria-hidden="true">/</span>

          <span class="breadcrumb-item current" aria-current="page">
            Breadcrumb
          </span>
        </nav>

        <div class="status-card">
          <span class="status-dot" aria-hidden="true"></span>
          <span>Glassmorphism interface active</span>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
