<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Pure CSS Polaroid hover pop animation."
  >
  <title>CSS Polaroid Hover Pop</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section class="demo" aria-labelledby="title">
      <span class="eyebrow">EaseMotion CSS</span>

      <h1 id="title">Polaroid Hover Pop</h1>

      <p class="intro">
        Hover or focus the photo to lift, rotate and enlarge the Polaroid.
      </p>

      <div class="gallery">
        <a
          class="polaroid polaroid-one"
          href="#photo-one"
          aria-label="View Mountain Escape photo"
        >
          <div class="photo photo-one"></div>
          <span class="caption">Mountain Escape</span>
        </a>

        <a
          class="polaroid polaroid-two"
          href="#photo-two"
          aria-label="View Ocean Breeze photo"
        >
          <div class="photo photo-two"></div>
          <span class="caption">Ocean Breeze</span>
        </a>

        <a
          class="polaroid polaroid-three"
          href="#photo-three"
          aria-label="View Golden Hour photo"
        >
          <div class="photo photo-three"></div>
          <span class="caption">Golden Hour</span>
        </a>
      </div>
    </section>
  </main>
</body>
</html>
