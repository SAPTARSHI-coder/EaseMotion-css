<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cybernetic Matrix Rain</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="matrix-container">
        <canvas id="matrixCanvas"></canvas>

        <section class="content">
            <div class="panel">
                <span class="badge">CYBER SYSTEM</span>
                <h1>Digital Rain</h1>
                <p>
                    A futuristic cybernetic matrix background with
                    smooth animated digital rain and a neumorphic interface.
                </p>
                <button id="toggleRain">Pause Rain</button>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
