<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Bulk Quantity Selector</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="selector-container">

  <div class="quantity-card">
    <h2>Bulk Order Selector</h2>

    <div class="quantity-display">
      <button aria-label="Decrease quantity">−</button>
      <span>50 Units</span>
      <button aria-label="Increase quantity">+</button>
    </div>

    <div class="tier-grid">

      <div class="tier active">
        <h3>Starter</h3>
        <p>10+ Units</p>
        <span>5% OFF</span>
      </div>

      <div class="tier">
        <h3>Business</h3>
        <p>50+ Units</p>
        <span>10% OFF</span>
      </div>

      <div class="tier">
        <h3>Enterprise</h3>
        <p>100+ Units</p>
        <span>15% OFF</span>
      </div>

      <div class="tier">
        <h3>Wholesale</h3>
        <p>500+ Units</p>
        <span>25% OFF</span>
      </div>

    </div>

    <div class="pricing">
      <div>
        <strong>Unit Price</strong>
        <p>$20.00</p>
      </div>

      <div>
        <strong>Discount</strong>
        <p>10%</p>
      </div>

      <div>
        <strong>Total</strong>
        <p>$900.00</p>
      </div>
    </div>

  </div>

</div>

</body>
</html>
