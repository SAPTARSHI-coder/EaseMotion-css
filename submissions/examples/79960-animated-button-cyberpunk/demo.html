<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />
  <meta
    name="description"
    content="Animated Cyberpunk Button built with pure HTML and CSS."
  />
  <title>Cyberpunk Animated Button</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main class="page">
    <section class="demo-card">
      <div class="grid-overlay" aria-hidden="true"></div>

      <div class="ambient ambient-cyan" aria-hidden="true"></div>
      <div class="ambient ambient-pink" aria-hidden="true"></div>

      <div class="content">
        <p class="eyebrow">CYBER INTERFACE</p>

        <h1>Animated Button</h1>

        <p class="description">
          A neon cyberpunk button built entirely with HTML and CSS.
        </p>

        <div class="button-area">
          <a class="cyber-button" href="#" aria-label="Initialize system">
            <span class="button-glitch"></span>
            <span class="button-text">INITIALIZE</span>
            <span class="button-arrow" aria-hidden="true">→</span>
          </a>
        </div>

        <div class="status" aria-hidden="true">
          <span class="status-dot"></span>
          SYSTEM READY
        </div>
      </div>
    </section>
  </main>
</body>
</html>
