<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Notification Center — EaseMotion-css</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <p class="demo-heading">CSS Notification Center</p>

  <div class="notif-center">
    <input
      type="checkbox"
      id="notif-toggle"
      class="notif-toggle-input"
      aria-label="Toggle notification center, 5 unread"
    />

    <label for="notif-toggle" class="notif-bell" aria-hidden="true">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9" />
        <path d="M13.73 21a2 2 0 0 1-3.46 0" />
      </svg>
      <span class="notif-badge" aria-hidden="true">5</span>
    </label>

    <section class="notif-panel" aria-label="Notifications">
      <div class="notif-panel-header">
        <h2>Notifications</h2>
        <span class="notif-panel-count">5 new</span>
      </div>

      <div class="notif-group">
        <p class="notif-group-label">Today</p>
        <ul class="notif-list" role="list">
          <li class="notif-row success" tabindex="0">
            <span class="notif-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5" /></svg>
            </span>
            <div class="notif-body">
              <p class="notif-title">PR #70081 merged</p>
              <p class="notif-meta">2 minutes ago</p>
            </div>
          </li>
          <li class="notif-row info" tabindex="0">
            <span class="notif-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" /><path d="M12 16v-4m0-4h.01" /></svg>
            </span>
            <div class="notif-body">
              <p class="notif-title">New comment on your PR</p>
              <p class="notif-meta">40 minutes ago</p>
            </div>
          </li>
          <li class="notif-row warning" tabindex="0">
            <span class="notif-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M12 9v4m0 4h.01M4.5 20h15a1 1 0 0 0 .87-1.5l-7.5-13a1 1 0 0 0-1.74 0l-7.5 13A1 1 0 0 0 4.5 20z" /></svg>
            </span>
            <div class="notif-body">
              <p class="notif-title">CI check pending review</p>
              <p class="notif-meta">1 hour ago</p>
            </div>
          </li>
        </ul>
      </div>

      <div class="notif-group">
        <p class="notif-group-label">Earlier</p>
        <ul class="notif-list" role="list">
          <li class="notif-row error" tabindex="0">
            <span class="notif-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" /><path d="M15 9l-6 6M9 9l6 6" /></svg>
            </span>
            <div class="notif-body">
              <p class="notif-title">Build failed on main</p>
              <p class="notif-meta">Yesterday</p>
            </div>
          </li>
          <li class="notif-row info" tabindex="0">
            <span class="notif-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" /><path d="M12 16v-4m0-4h.01" /></svg>
            </span>
            <div class="notif-body">
              <p class="notif-title">Weekly contributor digest is ready</p>
              <p class="notif-meta">2 days ago</p>
            </div>
          </li>
        </ul>
      </div>

      <label for="notif-toggle" class="notif-panel-footer">Close</label>
    </section>

    <label for="notif-toggle" class="notif-overlay" aria-hidden="true"></label>
  </div>

</body>
</html>
