<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimalist Animated Carousel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="ma-carousel">
        <input type="radio" name="ma-slide" id="ma1" checked>
        <input type="radio" name="ma-slide" id="ma2">
        <input type="radio" name="ma-slide" id="ma3">
        
        <div class="ma-viewport">
            <div class="ma-track">
                <div class="ma-slide">
                    <span class="ma-num">01</span>
                    <h2>Design</h2>
                </div>
                <div class="ma-slide">
                    <span class="ma-num">02</span>
                    <h2>Build</h2>
                </div>
                <div class="ma-slide">
                    <span class="ma-num">03</span>
                    <h2>Launch</h2>
                </div>
            </div>
        </div>
        
        <div class="ma-nav">
            <label for="ma1">Design</label>
            <label for="ma2">Build</label>
            <label for="ma3">Launch</label>
            <div class="ma-indicator"></div>
        </div>
    </div>
</body>
</html>
