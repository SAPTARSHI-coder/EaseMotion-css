<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gravity Garden</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="garden-app">

  <header>
    <div class="logo">🌌</div>
    <div>
      <h1>Gravity Garden</h1>
      <p>Grow flowers around a living star</p>
    </div>
  </header>

  <main class="garden" id="garden">
    <canvas id="canvas"></canvas>

    <div class="hud">
      <span>🌸 Flowers</span>
      <strong id="count">0</strong>
    </div>

    <div class="hint" id="hint">
      Click anywhere to plant
    </div>
  </main>

  <section class="controls">

    <div class="group">
      <label>Garden Mode</label>

      <div class="modes">
        <button class="mode active" data-mode="spring">🌱 Spring</button>
        <button class="mode" data-mode="summer">☀️ Summer</button>
        <button class="mode" data-mode="autumn">🍂 Autumn</button>
        <button class="mode" data-mode="moon">🌙 Moon</button>
      </div>
    </div>

    <div class="group">
      <label>
        Gravity
        <span id="gravityValue">50%</span>
      </label>

      <input
        id="gravity"
        type="range"
        min="10"
        max="100"
        value="50"
      >
    </div>

    <div class="buttons">
      <button id="plant">🌸 Plant Flower</button>
      <button id="reset">↻ Reset</button>
    </div>

  </section>
</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const garden = document.getElementById("garden");

const count = document.getElementById("count");
const hint = document.getElementById("hint");
const gravity = document.getElementById("gravity");
const gravityValue = document.getElementById("gravityValue");

let flowers = [];
let pollen = [];
let mode = "spring";
let gravityStrength = 0.5;
let time = 0;

const modes = {
  spring: {
    speed: 0.006,
    growth: 0.012
  },
  summer: {
    speed: 0.009,
    growth: 0.016
  },
  autumn: {
    speed: 0.004,
    growth: 0.008
  },
  moon: {
    speed: 0.007,
    growth: 0.011
  }
};

function resize() {
  canvas.width = garden.clientWidth;
  canvas.height = garden.clientHeight;
}

function center() {
  return {
    x: canvas.width / 2,
    y: canvas.height / 2
  };
}

function createPollen() {
  pollen = [];

  for (let i = 0; i < 45; i++) {
    pollen.push({
      angle: Math.random() * Math.PI * 2,
      radius: 30 + Math.random() * 220,
      speed: 0.001 + Math.random() * 0.003,
      size: 1 + Math.random() * 2,
      phase: Math.random() * Math.PI * 2
    });
  }
}

function plantFlower(x, y) {
  if (flowers.length >= 35) return;

  const c = center();

  const dx = x - c.x;
  const dy = y - c.y;

  flowers.push({
    angle: Math.atan2(dy, dx),
    radius: Math.max(70, Math.sqrt(dx * dx + dy * dy)),
    growth: 0,
    size: 5 + Math.random() * 5,
    phase: Math.random() * Math.PI * 2,
    rotation: Math.random() * Math.PI
  });

  count.textContent = flowers.length;
  hint.textContent = "A new flower is growing...";
}

function drawStar() {
  const c = center();

  const pulse =
    20 +
    Math.sin(time * 0.04) * 4;

  ctx.shadowBlur = 35;
  ctx.shadowColor = "#ffe88a";

  const gradient = ctx.createRadialGradient(
    c.x,
    c.y,
    2,
    c.x,
    c.y,
    pulse
  );

  gradient.addColorStop(0, "#ffffff");
  gradient.addColorStop(0.35, "#ffe98a");
  gradient.addColorStop(1, "rgba(255,220,80,0)");

  ctx.fillStyle = gradient;

  ctx.beginPath();
  ctx.arc(c.x, c.y, pulse, 0, Math.PI * 2);
  ctx.fill();

  ctx.shadowBlur = 0;
}

function drawOrbits() {
  const c = center();

  ctx.strokeStyle = "rgba(255,255,255,0.08)";
  ctx.lineWidth = 1;

  [90, 150, 210].forEach(radius => {
    ctx.beginPath();
    ctx.arc(c.x, c.y, radius, 0, Math.PI * 2);
    ctx.stroke();
  });
}

function drawPollen() {
  const c = center();

  pollen.forEach(p => {
    p.angle += p.speed;

    const x =
      c.x +
      Math.cos(p.angle) * p.radius;

    const y =
      c.y +
      Math.sin(p.angle) * p.radius;

    const alpha =
      0.2 +
      Math.sin(time * 0.03 + p.phase) * 0.15;

    ctx.globalAlpha = alpha;
    ctx.fillStyle = "#fff4b0";

    ctx.beginPath();
    ctx.arc(x, y, p.size, 0, Math.PI * 2);
    ctx.fill();
  });

  ctx.globalAlpha = 1;
}

function drawFlower(flower) {
  const c = center();
  const settings = modes[mode];

  flower.growth = Math.min(
    1,
    flower.growth + settings.growth
  );

  flower.angle +=
    settings.speed * gravityStrength;

  const x =
    c.x +
    Math.cos(flower.angle) * flower.radius;

  const y =
    c.y +
    Math.sin(flower.angle) * flower.radius;

  const stemLength =
    20 + flower.growth * 20;

  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(flower.rotation);

  ctx.strokeStyle = "#77b875";
  ctx.lineWidth = 2;

  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(0, stemLength * flower.growth);
  ctx.stroke();

  if (flower.growth > 0.35) {
    const petals = 6;
    const petalSize =
      flower.size * flower.growth;

    ctx.fillStyle =
      mode === "autumn"
        ? "#e89b61"
        : mode === "moon"
        ? "#c5c9ff"
        : "#ff9fca";

    for (let i = 0; i < petals; i++) {
      const angle =
        (Math.PI * 2 / petals) * i;

      const px =
        Math.cos(angle) * petalSize;

      const py =
        Math.sin(angle) * petalSize;

      ctx.beginPath();
      ctx.arc(
        px,
        py,
        petalSize * 0.7,
        0,
        Math.PI * 2
      );
      ctx.fill();
    }

    ctx.fillStyle = "#ffd86b";

    ctx.beginPath();
    ctx.arc(
      0,
      0,
      petalSize * 0.4,
      0,
      Math.PI * 2
    );
    ctx.fill();
  }

  ctx.restore();
}

function animate() {
  time++;

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  drawOrbits();
  drawPollen();
  drawStar();

  flowers.forEach(drawFlower);

  requestAnimationFrame(animate);
}

garden.addEventListener("click", e => {
  const rect = garden.getBoundingClientRect();

  plantFlower(
    e.clientX - rect.left,
    e.clientY - rect.top
  );
});

document.getElementById("plant")
  .addEventListener("click", () => {
    plantFlower(
      canvas.width * 0.25 +
      Math.random() * canvas.width * 0.5,

      canvas.height * 0.25 +
      Math.random() * canvas.height * 0.5
    );
  });

document.getElementById("reset")
  .addEventListener("click", () => {
    flowers = [];
    count.textContent = "0";
    hint.textContent = "Click anywhere to plant";
  });

document.querySelectorAll(".mode")
  .forEach(button => {
    button.addEventListener("click", () => {

      document.querySelectorAll(".mode")
        .forEach(b => b.classList.remove("active"));

      button.classList.add("active");

      mode = button.dataset.mode;

      hint.textContent =
        `${button.textContent} garden is growing...`;
    });
  });

gravity.addEventListener("input", () => {
  gravityStrength =
    gravity.value / 100;

  gravityValue.textContent =
    `${gravity.value}%`;
});

document.addEventListener("keydown", e => {
  if (e.code === "Space") {
    e.preventDefault();
    document.getElementById("plant").click();
  }

  if (e.key.toLowerCase() === "r") {
    document.getElementById("reset").click();
  }
});

window.addEventListener("resize", resize);

resize();
createPollen();
animate();
</script>

</body>
</html>
