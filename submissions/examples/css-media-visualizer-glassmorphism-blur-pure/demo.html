<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Media Visualizer: Glassmorphism Blur</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 
      [TECHNIQUE] The Ambient Album Art Background
      Glassmorphism needs colors to blur. We simulate a vibrant album cover in the background.
    -->
    <div class="ambient-art-bg"></div>

    <div class="layout-container">
        
        <header class="section-header">
            <h1 class="title">Pure CSS Media Visualizer</h1>
            <p class="subtitle">A hardware-accelerated, JavaScript-free glassmorphism UI element. Features a simulated audio visualizer using delayed CSS `@keyframes` over a heavily frosted ambient background.</p>
        </header>

        <div class="demo-area">
            
            <!-- 
              [TECHNIQUE] The Glassmorphism Media Card
              Handles the `backdrop-filter` to beautifully blur the album art behind it.
            -->
            <div class="glass-media-card">
                
                <div class="card-header">
                    <div class="track-info">
                        <h3 class="track-title">Midnight City</h3>
                        <p class="track-artist">M83 • Hurry Up, We're Dreaming</p>
                    </div>
                </div>
                
                <!-- 
                  [TECHNIQUE] The Pure CSS Audio Visualizer
                  A flex container of bars. Each bar shares the same `@keyframes` 
                  animation but has a unique `animation-delay` to create the 
                  chaotic "dancing" effect of a frequency analyzer.
                -->
                <div class="visualizer-container">
                    <div class="bar bar-1"></div>
                    <div class="bar bar-2"></div>
                    <div class="bar bar-3"></div>
                    <div class="bar bar-4"></div>
                    <div class="bar bar-5"></div>
                    <div class="bar bar-6"></div>
                    <div class="bar bar-7"></div>
                    <div class="bar bar-8"></div>
                    <div class="bar bar-9"></div>
                    <div class="bar bar-10"></div>
                    <div class="bar bar-11"></div>
                    <div class="bar bar-12"></div>
                    <div class="bar bar-13"></div>
                    <div class="bar bar-14"></div>
                    <div class="bar bar-15"></div>
                    <div class="bar bar-16"></div>
                </div>
                
                <div class="media-controls">
                    <button class="control-btn" aria-label="Previous">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="19 20 9 12 19 4 19 20"></polygon><line x1="5" y1="19" x2="5" y2="5"></line></svg>
                    </button>
                    <!-- Checkbox hack for play/pause toggle -->
                    <input type="checkbox" id="play-pause" class="play-toggle" checked aria-label="Play/Pause">
                    <label for="play-pause" class="control-btn play-btn">
                        <svg class="icon-play" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                        <svg class="icon-pause" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
                    </label>
                    <button class="control-btn" aria-label="Next">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 4 15 12 5 20 5 4"></polygon><line x1="19" y1="5" x2="19" y2="19"></line></svg>
                    </button>
                </div>
                
            </div>
            
        </div>
        
    </div>

</body>
</html>
