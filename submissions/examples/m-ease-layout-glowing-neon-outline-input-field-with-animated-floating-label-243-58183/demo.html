<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glassmorphic Neon Input</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<section class="hero">

<div class="glass-card">

<span class="badge">
Glassmorphic Style
</span>

<h1>Welcome Back</h1>

<p>
Elegant glassmorphism input fields with glowing neon borders and smooth animated floating labels.
</p>

<form class="form">

<div class="input-group">

<input
type="text"
id="fullname"
placeholder=" "
required
>

<label for="fullname">
Full Name
</label>

<span class="focus-line"></span>

</div>

<div class="input-group">

<input
type="email"
id="email"
placeholder=" "
required
>

<label for="email">
Email Address
</label>

<span class="focus-line"></span>

</div>

<div class="input-group">

<input
type="password"
id="password"
placeholder=" "
required
>

<label for="password">
Password
</label>

<span class="focus-line"></span>

</div>

<button type="submit" class="submit-btn">
Sign In
</button>

</form>

<div class="links">

<a href="#">Forgot Password?</a>

<a href="#">Create Account</a>

</div>

</div>

</section>

</body>
</html>
