<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-doorbell-camera-feed demo</title>
</head>
<body>
<div class="df-app">
  <span class="df-brand">FRONT DOOR</span>
  <div class="df-feed">
    <span class="df-scan"></span>
    <span class="df-doorway"></span>
    <span class="df-mat"></span>
    <span class="df-rec">REC</span>
    <span class="df-time">14:32:08</span>
    <span class="df-alert">MOTION DETECTED</span>
  </div>
  <div class="df-bell">
    <span class="df-bell-dot"></span>
    <span class="df-bell-ring"></span>
    <span class="df-bell-label">DOORBELL</span>
  </div>
</div>
</body>
</html>
