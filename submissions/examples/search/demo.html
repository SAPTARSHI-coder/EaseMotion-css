<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glowing Search Bar Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="container">
    <h1>Glowing Search Bar Component</h1>

    <!-- Default Search Bar -->
    <section class="demo-section">
      <h2>Default Layout</h2>
      <div class="search-container">
        <label for="search-default" class="sr-only">Search documentation</label>
        <input 
          type="search" 
          id="search-default" 
          class="glowing-search-input" 
          placeholder="Search documentation..."
          aria-label="Search documentation"
          autocomplete="off"
        >
        <button type="submit" class="search-btn" aria-label="Submit Search">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </button>
      </div>
    </section>

    <!-- Modifier Variant: Compact -->
    <section class="demo-section">
      <h2>Compact Variant</h2>
      <div class="search-container">
        <label for="search-compact" class="sr-only">Quick search</label>
        <input 
          type="search" 
          id="search-compact" 
          class="glowing-search-input glowing-search-input--compact" 
          placeholder="Quick search..."
          aria-label="Quick search"
        >
      </div>
    </section>

    <!-- Modifier Variant: Custom Color Override -->
    <section class="demo-section">
      <h2>Custom Cyan Glow Variant</h2>
      <div class="search-container">
        <label for="search-cyan" class="sr-only">Search topics</label>
        <input 
          type="search" 
          id="search-cyan" 
          class="glowing-search-input glowing-search-input--cyan" 
          placeholder="Search topics..."
          aria-label="Search topics"
        >
      </div>
    </section>
  </main>

</body>
</html>
