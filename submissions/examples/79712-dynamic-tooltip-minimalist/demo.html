<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Dynamic tooltip with minimalist styling."
  >

  <title>Dynamic Tooltip — Minimalist</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="page">

    <section class="demo">

      <span class="eyebrow">EASEMOTION CSS</span>

      <h1>Dynamic Tooltip</h1>

      <p class="intro">
        A compact minimalist tooltip system with smooth
        hover, focus, and responsive interactions.
      </p>

      <div class="tooltip-showcase">

        <div class="showcase__header">
          <span class="showcase__label">
            INTERACTIVE ELEMENTS
          </span>

          <span class="showcase__hint">
            Hover or focus
          </span>
        </div>

        <div class="tooltip-grid">

          <div class="tooltip-demo">
            <button
              class="tooltip-trigger"
              type="button"
              aria-describedby="tooltip-info"
            >
              <span class="trigger__icon">i</span>
              Information

              <span
                class="tooltip tooltip--top"
                role="tooltip"
                id="tooltip-info"
              >
                More information
              </span>
            </button>
          </div>

          <div class="tooltip-demo">
            <button
              class="tooltip-trigger"
              type="button"
              aria-describedby="tooltip-help"
            >
              <span class="trigger__icon">?</span>
              Help Center

              <span
                class="tooltip tooltip--bottom"
                role="tooltip"
                id="tooltip-help"
              >
                Open the help center
              </span>
            </button>
          </div>

          <div class="tooltip-demo">
            <button
              class="tooltip-trigger tooltip-trigger--accent"
              type="button"
              aria-describedby="tooltip-save"
            >
              <span class="trigger__icon">✓</span>
              Save Changes

              <span
                class="tooltip tooltip--right"
                role="tooltip"
                id="tooltip-save"
              >
                Save your current changes
              </span>
            </button>
          </div>

          <div class="tooltip-demo">
            <button
              class="tooltip-trigger"
              type="button"
              aria-describedby="tooltip-settings"
            >
              <span class="trigger__icon">⚙</span>
              Settings

              <span
                class="tooltip tooltip--left"
                role="tooltip"
                id="tooltip-settings"
              >
                Manage preferences
              </span>
            </button>
          </div>

        </div>

      </div>

      <p class="demo__note">
        Tooltips appear on both mouse hover and keyboard focus.
      </p>

    </section>

  </main>

</body>
</html>
