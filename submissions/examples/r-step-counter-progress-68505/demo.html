<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Step Counter Progress</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="step-card" aria-label="Daily step counter progress">
    <div class="shoe" aria-hidden="true">
      👟
    </div>

    <div class="step-content">
      <div class="step-header">
        <div>
          <p class="eyebrow">Daily Activity</p>
          <h1>Step Progress</h1>
        </div>

        <div class="step-count">
          <strong>7,500</strong>
          <span>/ 10,000</span>
        </div>
      </div>

      <div
        class="progress"
        role="progressbar"
        aria-label="Daily steps"
        aria-valuemin="0"
        aria-valuemax="10000"
        aria-valuenow="7500"
      >
        <span class="progress-fill"></span>
      </div>

      <div class="progress-info">
        <span>75% complete</span>
        <span>2,500 steps left</span>
      </div>

      <div class="milestones" aria-hidden="true">
        <span class="milestone active"></span>
        <span class="milestone active"></span>
        <span class="milestone active"></span>
        <span class="milestone"></span>
        <span class="milestone"></span>
      </div>

      <p class="goal-message">
        Keep moving — you're on track to reach your goal!
      </p>
    </div>
  </main>
</body>
</html>
