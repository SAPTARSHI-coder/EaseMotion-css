<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimalist Tech Jello-Hover Tabs | EaseMotion CSS</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="ease-center ease-fade-in" style="min-height: 100vh; background: #090d16; font-family: 'Inter', sans-serif; padding: 2rem;">

  <div class="tabs-container">
    <header class="tabs-header ease-slide-up">
      <h1 class="ease-fade-in">Minimalist Tech Tabs</h1>
      <p class="ease-slide-up ease-delay-100">Pure CSS interactive tabs featuring a smooth jello-hover transition with clean tech styling.</p>
    </header>

    <!-- Tabs Wrapper -->
    <div class="ease-tabs-minimalist-ak ease-slide-up ease-delay-200">
      <div class="tabs-list" role="tablist">
        <button role="tab" aria-selected="true" class="tab-btn active">Overview</button>
        <button role="tab" aria-selected="false" class="tab-btn">Performance</button>
        <button role="tab" aria-selected="false" class="tab-btn">Security</button>
      </div>
      <div class="tabs-panels">
        <div role="tabpanel" class="tab-panel active">
          <h3>Clean Tech Architecture</h3>
          <p>Streamlined interface components engineered with zero JS overhead and smooth spring micro-interactions.</p>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
