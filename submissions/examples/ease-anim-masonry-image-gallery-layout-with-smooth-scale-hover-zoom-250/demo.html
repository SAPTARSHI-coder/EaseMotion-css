<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cyberpunk Masonry Image Gallery</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

</head>

<body>

<section class="hero">

<div class="gallery-container">

<span class="badge">
Cyberpunk Theme
</span>

<h1>
Masonry Image
<span>Gallery</span>
</h1>

<p class="subtitle">
A responsive cyberpunk-inspired masonry gallery featuring
smooth hover zoom, neon borders and glowing overlay effects.
</p>

<div class="gallery">

<div class="card tall">
<img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=700&q=80" alt="Gallery Image">
<div class="overlay">
<h3>Neon City</h3>
</div>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1493246507139-91e8fad9978e?auto=format&fit=crop&w=700&q=80" alt="Gallery Image">
<div class="overlay">
<h3>Cyber Forest</h3>
</div>
</div>

<div class="card wide">
<img src="https://images.unsplash.com/photo-1519608487953-e999c86e7455?auto=format&fit=crop&w=900&q=80" alt="Gallery Image">
<div class="overlay">
<h3>Digital Skyline</h3>
</div>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1511300636408-a63a89df3482?auto=format&fit=crop&w=700&q=80" alt="Gallery Image">
<div class="overlay">
<h3>Night Lights</h3>
</div>
</div>

<div class="card tall">
<img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=700&q=80" alt="Gallery Image">
<div class="overlay">
<h3>Future Nature</h3>
</div>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1514565131-fce0801e5785?auto=format&fit=crop&w=700&q=80" alt="Gallery Image">
<div class="overlay">
<h3>Neon Horizon</h3>
</div>
</div>

</div>

</div>

</section>

<script src="script.js"></script>

</body>
</html>
