<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Superdense Coding Protocol - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css"></head><body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030712; color: #ffffff;">

    <div class="ease-card ease-card-glass sdc-container">
        <div class="sdc-header">
            <h2>Superdense Coding</h2>
            <span class="ease-badge ease-badge-success">Transmitting</span>
        </div>
        
        <div class="sdc-screen ease-center">
            <div class="sdc-flux flux-sdc-a"></div>
            <div class="sdc-flux flux-sdc-b"></div>
            <div class="sdc-boundary-ring"></div>
            <div class="sdc-core ease-center"></div>
        </div>

        <div class="sdc-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">2 Classical Bits &rarr; 1 Entangled Qubit</span>
            <button class="ease-btn ease-btn-success ease-btn-sm ease-hover-grow">Run Superdense Coding</button>
        </div>
    </div></body></html>
