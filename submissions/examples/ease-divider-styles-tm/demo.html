<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Divider Styles | EaseMotion CSS</title><link rel="stylesheet" href="style.css"></head>
<body><div class="div-root">
<h2 class="div-title">Solid</h2><hr class="div-line">
<h2 class="div-title">Gradient</h2><hr class="div-line gradient">
<h2 class="div-title">Dotted</h2><hr class="div-line dotted">
<h2 class="div-title">Dashed</h2><hr class="div-line dashed">
<h2 class="div-title">Thick Accent</h2><hr class="div-line thick">
<h2 class="div-title">Double</h2><hr class="div-line double">
<h2 class="div-title">Glow</h2><hr class="div-line glow">
<h2 class="div-title">Text Centered</h2><hr class="div-line-text"><span>or</span><hr class="div-line-text">
</div></body></html>
