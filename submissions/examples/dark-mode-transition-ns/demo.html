<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Dark Mode Transition | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Pure CSS Checkbox Hack for State Toggle -->
  <input type="checkbox" id="theme-toggle" class="ease-dark-mode__toggle" aria-label="Toggle dark mode">

  <main class="ease-dark-mode-wrapper">
    <section class="ease-dark-mode__card">
      <header class="ease-dark-mode__header">
        <h1>Dark Mode Transition</h1>
        <p>A pure CSS responsive theme toggle with smooth background and color transitions.</p>
      </header>

      <label for="theme-toggle" class="ease-dark-mode__label" tabindex="0" role="button" aria-pressed="false" aria-label="Switch Theme">
        <span class="ease-dark-mode__handle">
          <!-- Sun Icon -->
          <svg class="ease-dark-mode__icon ease-dark-mode__icon--sun" viewBox="0 0 24 24">
            <path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0 1 .45 1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96c.39-.39.39-1.03 0-1.41s-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36c.39-.39.39-1.03 0-1.41s-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/>
          </svg>
          <!-- Moon Icon -->
          <svg class="ease-dark-mode__icon ease-dark-mode__icon--moon" viewBox="0 0 24 24">
            <path d="M12.3 2c.4 0 .7.3.7.7 0 6.6 5.4 12 12 12 .4 0 .7.3.7.7 0 5.5-4.5 10-10 10S2 20.5 2 15 6.8 5 12.3 2z"/>
          </svg>
        </span>
      </label>
    </section>
  </main>

</body>
</html>
