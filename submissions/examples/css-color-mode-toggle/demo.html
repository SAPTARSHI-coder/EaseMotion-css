<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
        name="description"
        content="Pure CSS color mode toggle button demonstration"
    >
    <title>CSS Color Mode Toggle</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="demo-container">
        <section class="demo-card">
            <p class="eyebrow">EaseMotion CSS</p>

            <h1>Color Mode Toggle</h1>

            <p class="description">
                A smooth light and dark mode toggle built entirely with CSS.
                No JavaScript is required.
            </p>

            <div class="toggle-wrapper">
                <span class="mode-label">Theme</span>

                <input
                    type="checkbox"
                    id="theme-toggle"
                    class="theme-checkbox"
                    aria-label="Toggle between light and dark mode"
                >

                <label
                    for="theme-toggle"
                    class="theme-toggle"
                    aria-hidden="true"
                >
                    <span class="toggle-icon sun">☀</span>
                    <span class="toggle-icon moon">☾</span>
                    <span class="toggle-knob"></span>
                </label>
            </div>

            <div class="info-box">
                <h2>Pure CSS</h2>
                <p>
                    Toggle the switch to experience a smooth color transition
                    between light and dark themes.
                </p>
            </div>
        </section>
    </main>

</body>
</html>
