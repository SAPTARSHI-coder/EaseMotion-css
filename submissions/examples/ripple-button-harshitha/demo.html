<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ripple Button (Pure CSS)</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="ease-ripple-page">
      <header class="ease-ripple-header">
        <h1 class="ease-ripple-title">Ripple Button Effect</h1>
        <p class="ease-ripple-subtitle">
          Pure HTML + CSS ripple animation on hover.
        </p>
      </header>

      <section class="ease-ripple-stage" aria-label="Ripple button examples">
        <div class="ease-ripple-demo-card">
          <p class="ease-ripple-label">Default</p>
          <button class="ease-ripple-btn" type="button">Click Me</button>
        </div>

        <div class="ease-ripple-demo-card">
          <p class="ease-ripple-label">Blue</p>
          <button
            class="ease-ripple-btn ease-ripple-btn--blue"
            type="button"
          >
            Get Started
          </button>
        </div>

        <div class="ease-ripple-demo-card">
          <p class="ease-ripple-label">Green</p>
          <button
            class="ease-ripple-btn ease-ripple-btn--green"
            type="button"
          >
            Confirm
          </button>
        </div>

        <div class="ease-ripple-demo-card">
          <p class="ease-ripple-label">Purple</p>
          <button
            class="ease-ripple-btn ease-ripple-btn--purple"
            type="button"
          >
            Continue
          </button>
        </div>
      </section>

      <p class="ease-ripple-footnote">
        Tip: also try keyboard focus (Tab) — the ripple triggers on focus-visible.
      </p>
    </main>
  </body>
</html>
