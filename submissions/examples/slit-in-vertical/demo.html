<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slit In Vertical Demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f3f4f6;
      /* Add perspective to the container to ensure 3D transforms render correctly */
      perspective: 1000px;
    }
    .box {
      width: 250px;
      height: 250px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 700;
      font-size: 1.5rem;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
    }
    .replay-btn {
      margin-top: 3rem;
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
      background: #1f2937;
      color: white;
      cursor: pointer;
      transition: background 0.3s ease;
    }
    .replay-btn:hover {
      background: #111827;
    }
  </style>
</head>
<body>

  <div id="demo-box" class="box slit-in-vertical-ag">Slit In<br>Vertical</div>

  <button class="replay-btn" onclick="replay()">Replay Animation</button>

  <script>
    function replay() {
      const el = document.getElementById('demo-box');
      el.classList.remove('slit-in-vertical-ag');
      void el.offsetWidth; // trigger reflow
      el.classList.add('slit-in-vertical-ag');
    }
  </script>
</body>
</html>
