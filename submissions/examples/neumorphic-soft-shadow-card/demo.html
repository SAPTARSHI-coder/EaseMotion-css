<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Pure CSS Neumorphic Soft Shadow Card"
  >

  <title>Neumorphic Soft Shadow Card</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="page">

    <section
      class="card-showcase"
      aria-label="Neumorphic soft shadow card demonstration"
    >

      <article class="neo-card">

        <div class="neo-icon" aria-hidden="true">
          ✦
        </div>

        <p class="neo-label">
          EASEMOTION CSS
        </p>

        <h1>
          Soft Shadow
          <span>Neumorphism</span>
        </h1>

        <p class="neo-description">
          A clean CSS-only card using soft shadows, subtle elevation,
          and smooth interaction without JavaScript.
        </p>

        <div class="neo-footer">

          <span class="neo-badge">
            Pure CSS
          </span>

          <button
            class="neo-button"
            type="button"
            aria-label="Explore component"
          >
            →
          </button>

        </div>

      </article>

    </section>

  </main>

</body>
</html>
