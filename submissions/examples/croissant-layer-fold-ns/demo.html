<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Croissant Layer Fold — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Croissant Layer Fold demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Croissant Layer Fold</h1>
      <p class="lede">Croissant dough layers folding with buttery sheen</p>
    </header>

    <section class="ease-croissant-layer-fold" data-demo="croissant-layer-fold" aria-live="polite">
      <div class="ease-croissant-layer-fold__housing">
        <div class="ease-croissant-layer-fold__bezel">
          <div class="ease-croissant-layer-fold__face">
            <div class="ease-croissant-layer-fold__readout">
              <span class="ease-croissant-layer-fold__label">Croissant Layer Fold</span>
              <span class="ease-croissant-layer-fold__value" id="val-croissant-layer-fold">READY</span>
            </div>
            <div class="ease-croissant-layer-fold__motion" aria-hidden="true">
              <span class="ease-croissant-layer-fold__arm"></span>
              <span class="ease-croissant-layer-fold__core"></span>
              <span class="ease-croissant-layer-fold__trail"></span>
              <span class="ease-croissant-layer-fold__mark m1"></span>
              <span class="ease-croissant-layer-fold__mark m2"></span>
              <span class="ease-croissant-layer-fold__mark m3"></span>
            </div>
            <div class="ease-croissant-layer-fold__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-croissant-layer-fold__controls">
          <button type="button" class="ease-croissant-layer-fold__btn primary">Engage</button>
          <button type="button" class="ease-croissant-layer-fold__btn">Reset</button>
          <label class="ease-croissant-layer-fold__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-croissant-layer-fold__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
