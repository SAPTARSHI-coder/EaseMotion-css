<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-charging-station</title>
</head>
<body>
<main class="cst-card">
  <header class="cst-head">
    <h1 class="cst-title">VoltHub DC</h1>
    <span class="cst-slot">Port 2</span>
  </header>
  <section class="cst-stage" aria-label="electric vehicle">
    <span class="cst-car">
      <span class="cst-wheel cst-wheel-l"></span>
      <span class="cst-wheel cst-wheel-r"></span>
    </span>
    <span class="cst-cable"></span>
    <span class="cst-plug">
      <span class="cst-bolt"></span>
    </span>
    <span class="cst-port"></span>
    <span class="cst-ring"></span>
  </section>
  <section class="cst-cell-row" aria-label="battery cells">
    <span class="cst-cell cst-cell-1"></span>
    <span class="cst-cell cst-cell-2"></span>
    <span class="cst-cell cst-cell-3"></span>
    <span class="cst-cell cst-cell-4"></span>
    <span class="cst-cell cst-cell-5"></span>
    <span class="cst-cell cst-cell-6"></span>
  </section>
  <section class="cst-read" aria-label="charge readout">
    <span class="cst-pct">82%</span>
    <span class="cst-rate">240 kW</span>
  </section>
  <footer class="cst-foot">
    <span class="cst-led">Charging</span>
    <span class="cst-est">12 min left</span>
  </footer>
</main>
</body>
</html>
