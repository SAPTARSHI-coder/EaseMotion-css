<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flip 3D Button</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="demo-shell">
      <section class="demo-card" aria-labelledby="f3b-title">
        <p class="eyebrow">Button feedback</p>
        <h1 id="f3b-title">Flip 3D button</h1>
        <p class="demo-copy">
          A button that rotates 180 degrees in 3D to reveal a second face on
          hover.
        </p>
        <div class="flip-3d-button">
          <button type="button" class="flip-3d-button__face flip-3d-button__face--front">Hover me</button>
          <button type="button" class="flip-3d-button__face flip-3d-button__face--back">Let&rsquo;s go</button>
        </div>
      </section>
    </main>
  </body>
</html>
