<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fullscreen Toggle Edge Case</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="wrapper">
    <section class="video-player" id="player">
      <div class="video-content">
        <div class="play-circle" aria-hidden="true">▶</div>
        <h1>Video Player</h1>
        <p>Fullscreen toggle edge-case demo</p>
      </div>

      <div class="controls">
        <button
          id="fullscreenToggle"
          type="button"
          aria-pressed="false"
        >
          ⛶ Enter Fullscreen
        </button>
      </div>
    </section>

    <div class="state-panel">
      <span>Fullscreen state</span>
      <strong id="stateValue">OFF</strong>
    </div>
  </main>

  <script>
    const player = document.querySelector("#player");
    const button = document.querySelector("#fullscreenToggle");
    const stateValue = document.querySelector("#stateValue");

    let fullscreen = false;

    function toggleFullscreenState(state) {
      return !state;
    }

    function render() {
      player.classList.toggle("is-fullscreen", fullscreen);

      button.setAttribute(
        "aria-pressed",
        String(fullscreen)
      );

      button.textContent = fullscreen
        ? "⛶ Exit Fullscreen"
        : "⛶ Enter Fullscreen";

      stateValue.textContent = fullscreen ? "ON" : "OFF";
    }

    button.addEventListener("click", () => {
      fullscreen = toggleFullscreenState(fullscreen);
      render();
    });

    render();
  </script>
</body>
</html>
