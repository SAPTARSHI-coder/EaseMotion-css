<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Overlay with Progress</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="page">
    <h1>CSS Overlay with Progress</h1>
    <p class="intro">
      A CSS-only loading overlay with an animated radial progress indicator.
    </p>

    <section
      class="demo-card"
      aria-label="Loading content demonstration"
      aria-busy="true"
    >
      <div class="content">
        <h2>Content Area</h2>
        <p>
          This content is temporarily covered while the loading process is
          in progress.
        </p>
      </div>

      <div class="loading-overlay" role="status" aria-live="polite">
        <div
          class="progress"
          role="progressbar"
          aria-label="Loading progress"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="65"
          tabindex="0"
        >
          <span>65%</span>
        </div>

        <p>Loading...</p>
      </div>
    </section>
  </main>
</body>
</html>
