<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimalist Infinite Carousel Quickstart</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<main>
  <h1>Minimalist Infinite Carousel</h1>

  <section
    class="infinite-carousel"
    aria-label="Featured items"
  >
    <div class="carousel-track">
      <article class="carousel-item">
        <h2>Item One</h2>
        <p>Minimal carousel content.</p>
      </article>

      <article class="carousel-item">
        <h2>Item Two</h2>
        <p>Clean and responsive presentation.</p>
      </article>

      <article class="carousel-item">
        <h2>Item Three</h2>
        <p>Designed for continuous navigation.</p>
      </article>
    </div>
  </section>
</main>

</body>
</html>
