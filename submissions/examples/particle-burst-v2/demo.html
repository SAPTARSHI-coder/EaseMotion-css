<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Particle Burst CSS slider built with pure HTML and Vanilla CSS."
  >
  <title>Particle Burst Slider</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="slider-wrapper">
    <section class="particle-slider" aria-label="Particle Burst Slider">

      <div class="slider-track">

        <article class="slide slide-one" id="slide-one">
          <div class="particles" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
          </div>

          <span class="slide-number">01</span>
          <h1>Particle Burst</h1>
          <p>EXPLORE THE ENERGY</p>
        </article>

        <article class="slide slide-two" id="slide-two">
          <div class="particles" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
          </div>

          <span class="slide-number">02</span>
          <h1>Cosmic Flow</h1>
          <p>MOVE THROUGH SPACE</p>
        </article>

        <article class="slide slide-three" id="slide-three">
          <div class="particles" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
          </div>

          <span class="slide-number">03</span>
          <h1>Final Burst</h1>
          <p>RELEASE THE ENERGY</p>
        </article>

      </div>

      <nav class="slider-controls" aria-label="Slider navigation">
        <a href="#slide-one" aria-label="Go to slide 1">01</a>
        <a href="#slide-two" aria-label="Go to slide 2">02</a>
        <a href="#slide-three" aria-label="Go to slide 3">03</a>
      </nav>

    </section>
  </main>
</body>
</html>
