<!-- EaseMotion component: piano-keys-player -->
<!DOCTYPE html>
<html lang="en" data-piano="keys">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
<title>Ease Piano Keys Player</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="piano-set">
  <span class="note-badge">C MAJOR</span>
  <div class="keys-row">
    <i class="wkey w-c"></i>
    <i class="bkey b-cs"></i>
    <i class="wkey w-d"></i>
    <i class="bkey b-ds"></i>
    <i class="wkey w-e"></i>
    <i class="wkey w-f"></i>
    <i class="bkey b-fs"></i>
    <i class="wkey w-g"></i>
    <i class="bkey b-gs"></i>
    <i class="wkey w-a"></i>
    <i class="bkey b-as"></i>
    <i class="wkey w-b"></i>
    <i class="wkey w-c2"></i>
  </div>
  <div class="piano-rail">
    <span class="rail-brand">GRAND</span>
  </div>
</main>
</body>
</html>
