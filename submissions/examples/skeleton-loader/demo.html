<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skeleton Loader</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="demo-shell">
      <section class="skeleton-loader" aria-label="Loading content" role="status" aria-live="polite">
        <div class="skeleton-loader__media" aria-hidden="true"></div>
        <div class="skeleton-loader__body">
          <div class="skeleton-loader__line skeleton-loader__line--title"></div>
          <div class="skeleton-loader__line skeleton-loader__line--text"></div>
          <div class="skeleton-loader__line skeleton-loader__line--text"></div>
          <div class="skeleton-loader__line skeleton-loader__line--short"></div>
        </div>
      </section>
    </main>
  </body>
</html>
