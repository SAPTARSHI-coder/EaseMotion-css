<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS-only Slot Machine</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="layout-container">
        
        <header class="section-header">
            <h1 class="title">Pure CSS Slot Machine</h1>
            <p class="subtitle">A fully functional one-armed bandit using CSS `@keyframes`, the checkbox hack, and sibling combinators. Zero JavaScript required.</p>
        </header>

        <div class="demo-area">
            
            <!-- 
              [TECHNIQUE] The Checkbox Hack
              The hidden checkbox controls the state of the machine.
              When checked, the reels spin. When unchecked, they reset.
            -->
            <input type="checkbox" id="lever-pull" class="machine-toggle" aria-hidden="true">
            
            <div class="slot-machine">
                
                <!-- The Reels Window -->
                <div class="reels-window">
                    
                    <!-- Reel 1 -->
                    <div class="reel reel-1">
                        <div class="reel-strip">
                            <!-- We duplicate the symbols to create a seamless scrolling loop -->
                            <div class="symbol">🍒</div>
                            <div class="symbol">🍋</div>
                            <div class="symbol">🍉</div>
                            <div class="symbol">⭐</div>
                            <div class="symbol">🔔</div>
                            <div class="symbol">💎</div>
                            <!-- Duplicates for the loop -->
                            <div class="symbol">🍒</div>
                            <div class="symbol">🍋</div>
                            <div class="symbol">🍉</div>
                            <div class="symbol">⭐</div>
                            <div class="symbol">🔔</div>
                            <div class="symbol">💎</div>
                        </div>
                    </div>
                    
                    <!-- Reel 2 -->
                    <div class="reel reel-2">
                        <div class="reel-strip">
                            <div class="symbol">🔔</div>
                            <div class="symbol">💎</div>
                            <div class="symbol">🍒</div>
                            <div class="symbol">🍋</div>
                            <div class="symbol">🍉</div>
                            <div class="symbol">⭐</div>
                            <!-- Duplicates -->
                            <div class="symbol">🔔</div>
                            <div class="symbol">💎</div>
                            <div class="symbol">🍒</div>
                            <div class="symbol">🍋</div>
                            <div class="symbol">🍉</div>
                            <div class="symbol">⭐</div>
                        </div>
                    </div>
                    
                    <!-- Reel 3 -->
                    <div class="reel reel-3">
                        <div class="reel-strip">
                            <div class="symbol">⭐</div>
                            <div class="symbol">🔔</div>
                            <div class="symbol">💎</div>
                            <div class="symbol">🍒</div>
                            <div class="symbol">🍋</div>
                            <div class="symbol">🍉</div>
                            <!-- Duplicates -->
                            <div class="symbol">⭐</div>
                            <div class="symbol">🔔</div>
                            <div class="symbol">💎</div>
                            <div class="symbol">🍒</div>
                            <div class="symbol">🍋</div>
                            <div class="symbol">🍉</div>
                        </div>
                    </div>
                    
                    <!-- Glossy overlay to simulate the curved glass of the machine -->
                    <div class="glass-overlay"></div>
                    
                </div>
                
                <!-- Machine Controls -->
                <div class="machine-controls">
                    <!-- The label is styled as the slot machine button/lever -->
                    <label for="lever-pull" class="btn-spin" role="button" tabindex="0">
                        <span class="btn-text btn-text-pull">PULL LEVER</span>
                        <span class="btn-text btn-text-reset">RESET</span>
                    </label>
                </div>
                
            </div>
            
        </div>
        
    </div>

</body>
</html>
