<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leaf Fall Twirl Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="autumn">
    <div class="trees" aria-hidden="true"></div>
    <div class="air" id="air" aria-hidden="true"></div>
    <p class="hint">Leaves spiral down from the canopy on a gentle breeze.</p>
  </main>
  <script>
    const air = document.getElementById("air");
    for (let i = 0; i < 10; i++) {
      const leaf = document.createElement("span");
      leaf.className = "leaf";
      leaf.style.setProperty("--left", Math.floor(Math.random() * 90 + 5) + "%");
      leaf.style.setProperty("--size", (10 + Math.random() * 10).toFixed(1) + "px");
      leaf.style.setProperty("--dur", (5 + Math.random() * 5).toFixed(1) + "s");
      leaf.style.setProperty("--hue", (18 + Math.random() * 28).toFixed(0));
      air.appendChild(leaf);
    }
  </script>
</body>
</html>
