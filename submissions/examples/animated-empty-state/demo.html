<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />
  <title>Animated Empty State</title>
  <link rel="stylesheet" href="./style.css" />
</head>

<body>

  <main class="page">

    <section
      class="empty-state"
      aria-labelledby="empty-state-title"
    >

      <div
        class="empty-illustration"
        aria-hidden="true"
      >
        <div class="illustration-orbit orbit-one"></div>
        <div class="illustration-orbit orbit-two"></div>

        <div class="illustration-icon">
          <svg
            width="44"
            height="44"
            viewBox="0 0 24 24"
            fill="none"
            aria-hidden="true"
          >
            <path
              d="M4 7.5L12 3L20 7.5V16.5L12 21L4 16.5V7.5Z"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linejoin="round"
            />

            <path
              d="M4.5 7.75L12 12L19.5 7.75"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />

            <path
              d="M12 12V20.5"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
            />
          </svg>
        </div>
      </div>

      <div class="empty-content">

        <span class="empty-label">
          Nothing to display
        </span>

        <h1 id="empty-state-title">
          Your workspace is empty
        </h1>

        <p>
          Projects, files, and activity will appear here
          once you add your first item.
        </p>

        <div class="empty-actions">

          <button
            class="primary-action"
            type="button"
          >
            <span aria-hidden="true">+</span>
            Create project
          </button>

          <button
            class="secondary-action"
            type="button"
          >
            Explore examples
          </button>

        </div>

      </div>

    </section>

  </main>

</body>
</html>
