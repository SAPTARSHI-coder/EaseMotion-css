<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animated Loading Text</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <h1>Animated Loading Text</h1>

    <p class="loading-text" role="status" aria-live="polite">
      <span class="loading-letters" aria-hidden="true">
        <span style="--i:0">L</span><span style="--i:1">o</span><span style="--i:2">a</span><span style="--i:3">d</span><span style="--i:4">i</span><span style="--i:5">n</span><span style="--i:6">g</span>
      </span>
      <span class="sr-only">Loading, please wait</span>
    </p>
  </main>
</body>
</html>
