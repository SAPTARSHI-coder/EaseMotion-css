<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scroll Blur Header</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header" id="siteHeader">
    <span class="logo">Brand</span>
    <nav class="header-nav">
      <a href="#">Home</a>
      <a href="#">About</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <main class="content">
    <section class="block"><h2>Scroll down</h2><p>The header blurs and gains a shadow once you scroll past the top.</p></section>
    <section class="block"><h2>Section</h2><p>Filler content to enable scrolling.</p></section>
    <section class="block"><h2>Section</h2><p>Filler content to enable scrolling.</p></section>
    <section class="block"><h2>Section</h2><p>Filler content to enable scrolling.</p></section>
  </main>

  <script>
    const header = document.getElementById('siteHeader');
    function onScroll() {
      header.classList.toggle('is-scrolled', window.scrollY > 20);
    }
    document.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
  </script>
</body>
</html>
