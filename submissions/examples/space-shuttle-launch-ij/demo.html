<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-space-shuttle-launch demo</title>
</head>
<body>
<div class="ssl-pad">
  <span class="ssl-title">PAD 39A</span>
  <div class="ssl-gantry">
    <span class="ssl-beam"></span>
    <span class="ssl-lamp"></span>
  </div>
  <div class="ssl-shuttle">
    <span class="ssl-nose"></span>
    <span class="ssl-body"></span>
    <span class="ssl-boot"></span>
    <span class="ssl-booster"></span>
    <span class="ssl-booster ssl-b2"></span>
  </div>
  <div class="ssl-flame"></div>
  <div class="ssl-tele">
    <span class="ssl-count">3</span>
    <span class="ssl-read">ALT 0</span>
    <span class="ssl-read">VEL 0</span>
  </div>
</div>
</body>
</html>
