<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Countdown Timer | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="ct-wrapper">
    <div class="ct-display" aria-label="Countdown: 02 hours 34 minutes 56 seconds">
      <div class="ct-unit">
        <span class="ct-digit">02</span>
        <span class="ct-label">Hours</span>
      </div>
      <span class="ct-divider">:</span>
      <div class="ct-unit">
        <span class="ct-digit">34</span>
        <span class="ct-label">Min</span>
      </div>
      <span class="ct-divider">:</span>
      <div class="ct-unit">
        <span class="ct-digit">56</span>
        <span class="ct-label">Sec</span>
      </div>
    </div>
    <p style="color:var(--tm-ct-text-muted); margin:0; font-family:var(--tm-ct-font);">
      Update digit values via JavaScript for a live countdown.
    </p>
  </div>
</body>
</html>
