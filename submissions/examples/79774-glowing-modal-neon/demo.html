<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glowing Modal - Neon</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="page">
    <section class="preview">
        <span class="eyebrow">EaseMotion CSS</span>
        <h1>Glowing Modal</h1>
        <p>Neon-styled modal component with responsive layout and smooth interactions.</p>

        <button class="open-btn" id="openModal">
            Open Modal
        </button>
    </section>
</main>

<div class="modal" id="modal" aria-hidden="true">
    <div class="modal-backdrop" id="modalBackdrop"></div>

    <section
        class="modal-card"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modalTitle"
    >
        <button class="close-btn" id="closeModal" aria-label="Close modal">
            &times;
        </button>

        <div class="icon">
            ✦
        </div>

        <span class="modal-label">NEON SYSTEM</span>

        <h2 id="modalTitle">Welcome to the Neon Zone</h2>

        <p>
            This glowing modal combines vivid neon accents, soft shadows,
            glass-like surfaces, and responsive spacing in pure CSS.
        </p>

        <div class="actions">
            <button class="secondary-btn" id="cancelModal">
                Cancel
            </button>

            <button class="primary-btn" id="confirmModal">
                Continue
            </button>
        </div>
    </section>
</div>

<script>
    const modal = document.getElementById("modal");
    const openModal = document.getElementById("openModal");
    const closeModal = document.getElementById("closeModal");
    const cancelModal = document.getElementById("cancelModal");
    const confirmModal = document.getElementById("confirmModal");
    const backdrop = document.getElementById("modalBackdrop");

    function showModal() {
        modal.classList.add("active");
        modal.setAttribute("aria-hidden", "false");
        document.body.classList.add("modal-open");

        setTimeout(() => closeModal.focus(), 50);
    }

    function hideModal() {
        modal.classList.remove("active");
        modal.setAttribute("aria-hidden", "true");
        document.body.classList.remove("modal-open");

        openModal.focus();
    }

    openModal.addEventListener("click", showModal);
    closeModal.addEventListener("click", hideModal);
    cancelModal.addEventListener("click", hideModal);
    confirmModal.addEventListener("click", hideModal);
    backdrop.addEventListener("click", hideModal);

    document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && modal.classList.contains("active")) {
            hideModal();
        }
    });
</script>

</body>
</html>
