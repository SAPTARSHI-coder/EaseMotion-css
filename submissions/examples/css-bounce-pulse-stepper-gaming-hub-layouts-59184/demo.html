<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Bounce-Pulse Stepper for Gaming Hub Layouts</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="showcase">
        <div class="ease-stepper-container">
            <ul class="ease-stepper">
                <li class="ease-step completed">
                    <div class="ease-step-indicator">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
                    </div>
                    <div class="ease-step-label">Select Character</div>
                </li>
                <li class="ease-step active">
                    <div class="ease-step-indicator">2</div>
                    <div class="ease-step-label">Choose Loadout</div>
                </li>
                <li class="ease-step">
                    <div class="ease-step-indicator">3</div>
                    <div class="ease-step-label">Matchmaking</div>
                </li>
                <li class="ease-step">
                    <div class="ease-step-indicator">4</div>
                    <div class="ease-step-label">Deploy</div>
                </li>
            </ul>
        </div>
    </main>
</body>
</html>
