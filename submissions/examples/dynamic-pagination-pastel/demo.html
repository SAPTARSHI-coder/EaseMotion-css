<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pastel Pagination</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">
    <section class="demo-card">
      <span class="label">PASTEL UI</span>
      <h1>Dynamic Pagination</h1>
      <p>Navigate through the pages using the controls below.</p>

      <div class="pagination" aria-label="Pagination">
        <a href="#" class="page-btn arrow" aria-label="Previous page">‹</a>
        <a href="#" class="page-btn active">1</a>
        <a href="#" class="page-btn">2</a>
        <a href="#" class="page-btn">3</a>
        <span class="dots">...</span>
        <a href="#" class="page-btn">8</a>
        <a href="#" class="page-btn arrow" aria-label="Next page">›</a>
      </div>
    </section>
  </main>

</body>
</html>
