<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Hero Section with Minimalist Styling | EaseMotion CSS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="hero-wrapper">
        <div class="hero-content">
            <span class="hero-badge">v2.0 Release</span>
            <h1 class="hero-title">Minimalist 3D Hero Architecture</h1>

            <div class="hero-cta-group">
                <a href="#" class="btn-primary">Get Started</a>
            </div>
        </div>
        <div class="hero-visual">
            <div class="hero-3d-card">
                <div class="card-mockup-line accent"></div>
                <div class="card-mockup-line"></div>
                <div class="card-mockup-line short"></div>
            </div>
        </div>
    </main>
