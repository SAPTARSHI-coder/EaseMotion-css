<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ease-drag-slider-3d-sap demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { height: 100vh; margin: 0; display: flex; align-items: center; justify-content: center; background: #f4f4f5; }
  </style>
</head>
<body>
  <div class="drag-3d-sap">
    <div class="drag-3d-track" id="track">
      <div class="drag-3d-slide">Panel 1</div>
      <div class="drag-3d-slide">Panel 2</div>
      <div class="drag-3d-slide">Panel 3</div>
    </div>
  </div>
  <script>
    const track = document.getElementById('track');
    let dragging = false;
    let startX = 0;
    let currentRotation = 0;
    let lastRotation = 0;

    function onDown(clientX) {
      dragging = true;
      startX = clientX;
      track.classList.add('dragging');
      track.style.transition = 'none';
    }

    function onMove(clientX) {
      if (!dragging) return;
      const delta = (clientX - startX) * 0.5;
      currentRotation = lastRotation + delta;
      track.style.transform = `rotateY(${currentRotation}deg)`;
    }

    function onUp() {
      if (!dragging) return;
      dragging = false;
      track.classList.remove('dragging');
      track.style.transition = 'transform 0.4s ease';
      const snapped = Math.round(currentRotation / 120) * 120;
      track.style.transform = `rotateY(${snapped}deg)`;
      lastRotation = snapped;
      currentRotation = snapped;
    }

    track.addEventListener('mousedown', (e) => onDown(e.clientX));
    window.addEventListener('mousemove', (e) => onMove(e.clientX));
    window.addEventListener('mouseup', onUp);
    track.addEventListener('touchstart', (e) => onDown(e.touches[0].clientX), { passive: true });
    track.addEventListener('touchmove', (e) => onMove(e.touches[0].clientX), { passive: true });
    track.addEventListener('touchend', onUp);
  </script>
</body>
</html>
