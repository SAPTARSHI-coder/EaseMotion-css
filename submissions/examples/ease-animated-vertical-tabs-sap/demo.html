<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animated Vertical Tabs</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <h1>Animated Vertical Tabs</h1>

    <div class="tabs" role="tablist" aria-orientation="vertical">
      <div class="tab-list">
        <button class="tab is-active" role="tab" aria-selected="true" id="tab-1" aria-controls="panel-1">Overview</button>
        <button class="tab" role="tab" aria-selected="false" id="tab-2" aria-controls="panel-2">Features</button>
        <button class="tab" role="tab" aria-selected="false" id="tab-3" aria-controls="panel-3">Pricing</button>
        <span class="tab-indicator"></span>
      </div>

      <div class="tab-panels">
        <div class="tab-panel is-active" role="tabpanel" id="panel-1" aria-labelledby="tab-1">Overview content goes here.</div>
        <div class="tab-panel" role="tabpanel" id="panel-2" aria-labelledby="tab-2" hidden>Features content goes here.</div>
        <div class="tab-panel" role="tabpanel" id="panel-3" aria-labelledby="tab-3" hidden>Pricing content goes here.</div>
      </div>
    </div>
  </main>

  <script>
    const tabs = Array.from(document.querySelectorAll('.tab'));
    const panels = Array.from(document.querySelectorAll('.tab-panel'));
    const indicator = document.querySelector('.tab-indicator');

    function moveIndicator(tab) {
      indicator.style.transform = `translateY(${tab.offsetTop}px)`;
      indicator.style.height = tab.offsetHeight + 'px';
    }

    function activate(tab) {
      tabs.forEach(t => { t.classList.remove('is-active'); t.setAttribute('aria-selected', 'false'); });
      panels.forEach(p => { p.classList.remove('is-active'); p.hidden = true; });
      tab.classList.add('is-active');
      tab.setAttribute('aria-selected', 'true');
      const panel = document.getElementById(tab.getAttribute('aria-controls'));
      panel.hidden = false;
      panel.classList.add('is-active');
      moveIndicator(tab);
    }

    tabs.forEach((tab, i) => {
      tab.addEventListener('click', () => activate(tab));
      tab.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowDown') { e.preventDefault(); tabs[(i + 1) % tabs.length].focus(); }
        if (e.key === 'ArrowUp') { e.preventDefault(); tabs[(i - 1 + tabs.length) % tabs.length].focus(); }
      });
    });

    window.addEventListener('load', () => moveIndicator(document.querySelector('.tab.is-active')));
  </script>
</body>
</html>
