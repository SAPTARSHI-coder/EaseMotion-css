<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elastic Slide Popover</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>Elastic Slide Popover</h1>

    <p class="subtitle">
        Hover over the button to reveal an elastic sliding popover.
    </p>

    <div class="popover">

        <button class="trigger">
            Launch Popover
        </button>

        <div class="popover-content">

            <h2>Project Insights</h2>

            <p>
                Build modern SaaS interfaces using lightweight CSS animations,
                responsive layouts, and accessible components.
            </p>

            <a href="#">Learn More</a>

        </div>

    </div>

</div>

</body>
</html>
