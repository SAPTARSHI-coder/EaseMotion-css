<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    name="description"
    content="Minimalist Outline glassmorphism UI built with pure HTML and CSS."
  />
  <title>Minimalist Outline Glass Effect</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <section class="glass-card" aria-labelledby="title">
      <div class="outline" aria-hidden="true"></div>

      <div class="content">
        <span class="eyebrow">MINIMAL / GLASS</span>

        <h1 id="title">Minimalist Outline</h1>

        <p>
          A clean glassmorphism component focused on subtle borders,
          transparency, depth, and smooth CSS-only interactions.
        </p>

        <div class="features" aria-label="Features">
          <span>Pure CSS</span>
          <span>Responsive</span>
          <span>Accessible</span>
        </div>

        <a class="button" href="#preview">
          View Component
          <span aria-hidden="true">→</span>
        </a>
      </div>
    </section>

    <p class="hint" id="preview">
      Hover or focus the component to reveal the animated outline.
    </p>
  </main>
</body>
</html>
