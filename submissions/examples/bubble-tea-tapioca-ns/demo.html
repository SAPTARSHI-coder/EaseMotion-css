<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bubble Tea Tapioca — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Bubble Tea Tapioca demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Bubble Tea Tapioca</h1>
      <p class="lede">Bubble tea cup with tapioca pearls bobbing and rising</p>
    </header>

    <section class="ease-bubble-tea-tapioca" data-demo="bubble-tea-tapioca" aria-live="polite">
      <div class="ease-bubble-tea-tapioca__housing">
        <div class="ease-bubble-tea-tapioca__bezel">
          <div class="ease-bubble-tea-tapioca__face">
            <div class="ease-bubble-tea-tapioca__readout">
              <span class="ease-bubble-tea-tapioca__label">Bubble Tea Tapioca</span>
              <span class="ease-bubble-tea-tapioca__value" id="val-bubble-tea-tapioca">READY</span>
            </div>
            <div class="ease-bubble-tea-tapioca__motion" aria-hidden="true">
              <span class="ease-bubble-tea-tapioca__arm"></span>
              <span class="ease-bubble-tea-tapioca__core"></span>
              <span class="ease-bubble-tea-tapioca__trail"></span>
              <span class="ease-bubble-tea-tapioca__mark m1"></span>
              <span class="ease-bubble-tea-tapioca__mark m2"></span>
              <span class="ease-bubble-tea-tapioca__mark m3"></span>
            </div>
            <div class="ease-bubble-tea-tapioca__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-bubble-tea-tapioca__controls">
          <button type="button" class="ease-bubble-tea-tapioca__btn primary">Engage</button>
          <button type="button" class="ease-bubble-tea-tapioca__btn">Reset</button>
          <label class="ease-bubble-tea-tapioca__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-bubble-tea-tapioca__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
