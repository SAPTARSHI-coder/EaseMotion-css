<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EaseMotion — Glitch-Flicker Modal</title>

<!-- EaseMotion CDN -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/easemotion-css@latest/dist/easemotion.min.css" />

<!-- Component styles -->
<link rel="stylesheet" href="style.css" />
</head>
<body>

<main class="ease-gf-page">
  <header class="ease-gf-header">
    <h1>New Feature Alert</h1>
    <p>Open the modal to see it flicker and glitch into view.</p>
  </header>

  <!-- Hidden checkbox drives the open/close state, zero JS -->
  <input type="checkbox" id="ease-gf-modal-toggle" class="ease-gf-toggle" />

  <label for="ease-gf-modal-toggle" class="ease-gf-open-btn">
    Launch beta preview
  </label>

  <div class="ease-gf-overlay">
    <div class="ease-gf-modal" role="dialog" aria-modal="true" aria-labelledby="ease-gf-modal-title">

      <label for="ease-gf-modal-toggle" class="ease-gf-modal__close" aria-label="Close dialog">×</label>

      <p class="ease-gf-modal__eyebrow">Beta access</p>
      <h2 class="ease-gf-modal__title" id="ease-gf-modal-title" data-text="SYSTEM ONLINE">SYSTEM ONLINE</h2>
      <p class="ease-gf-modal__body">
        You now have early access to the new workspace editor. Expect a few rough edges
        while we finish rolling it out to everyone.
      </p>

      <div class="ease-gf-modal__actions">
        <label for="ease-gf-modal-toggle" class="ease-gf-modal__btn ease-gf-modal__btn--ghost">Maybe later</label>
        <a href="#" class="ease-gf-modal__btn ease-gf-modal__btn--primary">Enable beta</a>
      </div>
    </div>
  </div>
</main>

</body>
</html>
