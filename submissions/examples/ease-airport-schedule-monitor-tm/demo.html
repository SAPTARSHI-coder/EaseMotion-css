<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Airport Schedule Monitor | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="apstage">
    <div class="apboard">
      <div class="apheader">
        <span>Flight</span>
        <span>To</span>
        <span>Time</span>
        <span>Status</span>
        <span>Gate</span>
      </div>
      <div class="aprow">
        <span class="apflight">AI 101</span>
        <span class="apcity">London</span>
        <span class="aptime">14:30</span>
        <span class="apstatus"><span class="apdot apdot-on"></span>On Time</span>
        <span class="apgate">B12</span>
      </div>
      <div class="aprow">
        <span class="apflight">BA 256</span>
        <span class="apcity">Dubai</span>
        <span class="aptime">15:45</span>
        <span class="apstatus"><span class="apdot apdot-delay"></span>Delayed</span>
        <span class="apgate">A07</span>
      </div>
      <div class="aprow">
        <span class="apflight">EK 502</span>
        <span class="apcity">Paris</span>
        <span class="aptime">16:00</span>
        <span class="apstatus"><span class="apdot apdot-board"></span>Boarding</span>
        <span class="apgate">C03</span>
      </div>
      <div class="aprow">
        <span class="apflight">UA 818</span>
        <span class="apcity">Tokyo</span>
        <span class="aptime">17:15</span>
        <span class="apstatus"><span class="apdot apdot-on"></span>On Time</span>
        <span class="apgate">D22</span>
      </div>
    </div>
  </div>
</body>
</html>
