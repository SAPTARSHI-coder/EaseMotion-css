<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Particle Fireflies | EaseMotion CSS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="firefly-scene">
        <!-- Moon -->
        <div class="moon">
            <div class="moon-glow"></div>
            <div class="moon-crater c1"></div>
            <div class="moon-crater c2"></div>
            <div class="moon-crater c3"></div>
        </div>

        <!-- Tree Silhouettes -->
        <div class="trees">
            <div class="tree tree-1"></div>
            <div class="tree tree-2"></div>
            <div class="tree tree-3"></div>
            <div class="tree tree-4"></div>
            <div class="tree tree-5"></div>
        </div>

        <!-- Ground -->
        <div class="ground"></div>

        <!-- Fireflies (20 particles) -->
        <div class="fireflies">
            <span class="firefly f1"></span>
            <span class="firefly f2"></span>
            <span class="firefly f3"></span>
            <span class="firefly f4"></span>
            <span class="firefly f5"></span>
            <span class="firefly f6"></span>
            <span class="firefly f7"></span>
            <span class="firefly f8"></span>
            <span class="firefly f9"></span>
            <span class="firefly f10"></span>
            <span class="firefly f11"></span>
            <span class="firefly f12"></span>
            <span class="firefly f13"></span>
            <span class="firefly f14"></span>
            <span class="firefly f15"></span>
            <span class="firefly f16"></span>
            <span class="firefly f17"></span>
            <span class="firefly f18"></span>
            <span class="firefly f19"></span>
            <span class="firefly f20"></span>
        </div>

        <!-- Grass Blades -->
        <div class="grass">
            <span class="blade b1"></span>
            <span class="blade b2"></span>
            <span class="blade b3"></span>
            <span class="blade b4"></span>
            <span class="blade b5"></span>
            <span class="blade b6"></span>
            <span class="blade b7"></span>
            <span class="blade b8"></span>
        </div>

        <!-- Title -->
        <div class="scene-title">
            <span>FIREFLY</span>
            <span>MEADOW</span>
        </div>
    </div>
</body>
</html>
