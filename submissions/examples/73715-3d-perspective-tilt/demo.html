<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Pure CSS glassmorphism card with a 3D perspective tilt effect."
  >
  <title>3D Perspective Tilt Glass</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="tilt-scene">
    <div class="ambient ambient-one" aria-hidden="true"></div>
    <div class="ambient ambient-two" aria-hidden="true"></div>

    <section class="tilt-wrapper">
      <article class="glass-card" aria-labelledby="tilt-title">
        <div class="glass-shine" aria-hidden="true"></div>

        <div class="card-top">
          <span class="card-badge">GLASS EFFECT</span>

          <span class="card-status">
            <span class="status-dot"></span>
            LIVE
          </span>
        </div>

        <div class="card-icon" aria-hidden="true">
          <span></span>
        </div>

        <h1 id="tilt-title">Perspective</h1>

        <p>
          A pure CSS glassmorphism component with a subtle
          three-dimensional tilt and depth effect.
        </p>

        <div class="card-footer">
          <span>CSS ONLY</span>

          <button class="action-button" type="button">
            Explore
            <span aria-hidden="true">→</span>
          </button>
        </div>
      </article>
    </section>
  </main>
</body>
</html>
