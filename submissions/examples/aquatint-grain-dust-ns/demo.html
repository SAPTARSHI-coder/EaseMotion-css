<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aquatint Grain Dust — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Aquatint Grain Dust demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Aquatint Grain Dust</h1>
      <p class="lede">Aquatint resin grain dust settling</p>
    </header>

    <section class="ease-aquatint-grain-dust" data-demo="aquatint-grain-dust" aria-live="polite">
      <div class="ease-aquatint-grain-dust__housing">
        <div class="ease-aquatint-grain-dust__bezel">
          <div class="ease-aquatint-grain-dust__face">
            <div class="ease-aquatint-grain-dust__readout">
              <span class="ease-aquatint-grain-dust__label">Aquatint Grain Dust</span>
              <span class="ease-aquatint-grain-dust__value">LIVE</span>
            </div>
            <div class="ease-aquatint-grain-dust__motion" aria-hidden="true">
              <span class="ease-aquatint-grain-dust__a"></span>
              <span class="ease-aquatint-grain-dust__b"></span>
              <span class="ease-aquatint-grain-dust__c"></span>
              <span class="ease-aquatint-grain-dust__d"></span>
            </div>
            <div class="ease-aquatint-grain-dust__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-aquatint-grain-dust__controls">
          <button type="button" class="ease-aquatint-grain-dust__btn primary">Engage</button>
          <button type="button" class="ease-aquatint-grain-dust__btn">Reset</button>
          <label class="ease-aquatint-grain-dust__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-aquatint-grain-dust__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
