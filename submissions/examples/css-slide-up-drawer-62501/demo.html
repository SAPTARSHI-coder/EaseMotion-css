<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Slide-Up Drawer for E-Commerce Checkout</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="ease-showcase">
    <header class="ease-header">
      <h1>E-Commerce Checkout</h1>
      <p>Click the button below to open the slide-up drawer for checkout details.</p>
    </header>

    <main class="ease-main">
      <button class="ease-btn" id="openDrawer" aria-haspopup="dialog" aria-controls="checkoutDrawer" aria-expanded="false" onclick="document.getElementById('checkoutDrawer').classList.add('is-open'); this.setAttribute('aria-expanded', 'true');">
        Open Checkout
      </button>

      <!-- The Drawer -->
      <div id="checkoutDrawer" class="ease-drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle">
        <div class="ease-drawer-overlay" onclick="document.getElementById('checkoutDrawer').classList.remove('is-open'); document.getElementById('openDrawer').setAttribute('aria-expanded', 'false');"></div>
        <div class="ease-drawer-content">
          <div class="ease-drawer-header">
            <h2 id="drawerTitle">Order Summary</h2>
            <button class="ease-close-btn" aria-label="Close drawer" onclick="document.getElementById('checkoutDrawer').classList.remove('is-open'); document.getElementById('openDrawer').setAttribute('aria-expanded', 'false');">
              &times;
            </button>
          </div>
          <div class="ease-drawer-body">
            <div class="ease-cart-item">
              <div class="item-details">
                <h3>Premium Sneakers</h3>
                <p>Size: 42 | Color: Black</p>
              </div>
              <div class="item-price">$129.99</div>
            </div>
            <div class="ease-cart-item">
              <div class="item-details">
                <h3>Classic T-Shirt</h3>
                <p>Size: L | Color: White</p>
              </div>
              <div class="item-price">$29.99</div>
            </div>
            <div class="ease-summary-row">
              <span>Subtotal</span>
              <span>$159.98</span>
            </div>
            <div class="ease-summary-row">
              <span>Shipping</span>
              <span>$5.00</span>
            </div>
            <div class="ease-summary-row ease-total">
              <span>Total</span>
              <span>$164.98</span>
            </div>
          </div>
          <div class="ease-drawer-footer">
            <button class="ease-btn ease-btn-primary">Place Order</button>
          </div>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
