<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animated Lock Unlock Icon</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <h1>Animated Lock Unlock Icon</h1>

    <button
      class="lock-toggle"
      id="lockToggle"
      role="switch"
      aria-checked="true"
      aria-label="Locked. Activate to unlock."
    >
      <svg viewBox="0 0 24 24" class="lock-svg">
        <rect x="5" y="11" width="14" height="10" rx="2" class="lock-body"></rect>
        <path d="M8 11V7a4 4 0 0 1 8 0v4" class="lock-shackle"></path>
      </svg>
    </button>
  </main>
</body>
</html>
