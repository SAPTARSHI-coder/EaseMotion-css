<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="CSS loading overlay with animated radial progress indicator"
  >
  <title>CSS Overlay with Progress</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="page">

    <section class="demo-card">
      <div class="content">
        <span class="badge">EaseMotion CSS</span>

        <h1>CSS Overlay Progress</h1>

        <p>
          A lightweight loading overlay with an animated radial
          progress indicator created using CSS.
        </p>

        <button class="demo-button" type="button">
          Start Process
        </button>
      </div>

      <!-- Loading Overlay -->
      <div
        class="loading-overlay"
        role="status"
        aria-label="Loading"
      >
        <div class="progress-container">

          <div class="progress-ring">
            <div class="progress-value">
              75%
            </div>
          </div>

          <h2>Processing...</h2>

          <p>Please wait while the operation completes.</p>
        </div>
      </div>

    </section>

  </main>

</body>
</html>
