<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Blur-Entrance Progress Bar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<section class="portfolio">

    <header class="hero">

        <span class="badge">Creative Portfolio</span>

        <h1>Blur-Entrance Progress Bars</h1>

        <p>
            Showcase your professional skills using elegant
            blur-entrance animations and smooth CSS progress bars
            built entirely with HTML5 and CSS3.
        </p>

    </header>

    <div class="skills">

        <article class="skill-card">

            <div class="skill-info">
                <span>UI Design</span>
                <span>94%</span>
            </div>

            <div class="progress">
                <div class="fill ui"></div>
            </div>

        </article>

        <article class="skill-card">

            <div class="skill-info">
                <span>Frontend Development</span>
                <span>90%</span>
            </div>

            <div class="progress">
                <div class="fill frontend"></div>
            </div>

        </article>

        <article class="skill-card">

            <div class="skill-info">
                <span>Brand Strategy</span>
                <span>82%</span>
            </div>

            <div class="progress">
                <div class="fill branding"></div>
            </div>

        </article>

        <article class="skill-card">

            <div class="skill-info">
                <span>Motion Graphics</span>
                <span>78%</span>
            </div>

            <div class="progress">
                <div class="fill motion"></div>
            </div>

        </article>

    </div>

</section>

</body>
</html>
