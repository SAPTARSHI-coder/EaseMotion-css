<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      Custom Audio Player Widget with Gradient Glow Styling
      (ease-audio-player-glow)
    </title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="demo-container">
      <header class="demo-header">
        <div class="header-badge">GRADIENT GLOW MEDIA WIDGET</div>
        <h1 class="demo-title">AUDIO PLAYER GRADIENT GLOW</h1>
        <p class="demo-subtitle">
          Pure HTML + Vanilla CSS Audio Player Component with Ambient Glow Aura
        </p>
      </header>

      <!-- Main Gradient Glow Audio Player Widget -->
      <section class="player-showcase-card">
        <div class="ease-audio-player-glow">
          <!-- Ambient Blur Halo Backdrop -->
          <div class="audio-glow-halo" aria-hidden="true"></div>

          <!-- Inner Card Surface -->
          <div class="audio-card-surface">
            <!-- Top Track Metadata Header -->
            <div class="audio-track-header">
              <!-- Album Cover Thumbnail -->
              <div class="album-thumb">
                <svg
                  class="album-icon"
                  viewBox="0 0 24 24"
                  width="32"
                  height="32"
                  aria-hidden="true"
                  fill="currentColor"
                >
                  <path
                    d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 14.5c-2.49 0-4.5-2.01-4.5-4.5S9.51 7.5 12 7.5s4.5 2.01 4.5 4.5-2.01 4.5-4.5 4.5zm0-5.5c-.55 0-1 .45-1 1s.45 1 1 1 1-.45 1-1-.45-1-1-1z"
                  />
                </svg>
              </div>

              <!-- Track Info Details -->
              <div class="track-info">
                <h2 class="track-title">Midnight Synthwave</h2>
                <p class="track-artist">Neon Echoes &bull; Cyber Dreams EP</p>
              </div>

              <!-- Animated CSS Equalizer Waveform -->
              <div class="audio-equalizer" aria-hidden="true">
                <span class="eq-bar bar-1"></span>
                <span class="eq-bar bar-2"></span>
                <span class="eq-bar bar-3"></span>
                <span class="eq-bar bar-4"></span>
              </div>
            </div>

            <!-- Timeline Progress Slider -->
            <div class="ease-audio-timeline-container">
              <label for="audio-seek-range" class="sr-only"
                >Seek audio timeline</label
              >
              <input
                type="range"
                id="audio-seek-range"
                class="ease-audio-seek-slider"
                min="0"
                max="100"
                value="38"
                aria-valuemin="0"
                aria-valuemax="100"
                aria-valuenow="38"
                aria-valuetext="01:24 of 03:45"
              />
            </div>

            <!-- Bottom Control Bar Row -->
            <div class="audio-controls-row">
              <!-- Monospace Time Display -->
              <div class="time-readout" aria-label="Track Time Elapsed">
                <span class="time-current">01:24</span>
                <span class="time-divider">/</span>
                <span class="time-duration">03:45</span>
              </div>

              <!-- Main Playback Control Cluster -->
              <div
                class="playback-btn-group"
                role="toolbar"
                aria-label="Audio Playback Controls"
              >
                <!-- Shuffle Button -->
                <button
                  type="button"
                  class="audio-btn ctrl-sub-btn"
                  aria-label="Toggle Shuffle"
                >
                  <svg
                    class="ctrl-icon"
                    viewBox="0 0 24 24"
                    width="18"
                    height="18"
                    aria-hidden="true"
                    fill="currentColor"
                  >
                    <path
                      d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.45 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"
                    />
                  </svg>
                </button>

                <!-- Previous Track Button -->
                <button
                  type="button"
                  class="audio-btn ctrl-prev-btn"
                  aria-label="Previous Track"
                >
                  <svg
                    class="ctrl-icon"
                    viewBox="0 0 24 24"
                    width="20"
                    height="20"
                    aria-hidden="true"
                    fill="currentColor"
                  >
                    <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z" />
                  </svg>
                </button>

                <!-- Primary Play / Pause Button -->
                <button
                  type="button"
                  class="audio-btn ctrl-play-btn"
                  aria-label="Play / Pause Track"
                >
                  <svg
                    class="play-icon"
                    viewBox="0 0 24 24"
                    width="24"
                    height="24"
                    aria-hidden="true"
                    fill="currentColor"
                  >
                    <path d="M8 5v14l11-7z" />
                  </svg>
                </button>

                <!-- Next Track Button -->
                <button
                  type="button"
                  class="audio-btn ctrl-next-btn"
                  aria-label="Next Track"
                >
                  <svg
                    class="ctrl-icon"
                    viewBox="0 0 24 24"
                    width="20"
                    height="20"
                    aria-hidden="true"
                    fill="currentColor"
                  >
                    <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z" />
                  </svg>
                </button>

                <!-- Repeat Button -->
                <button
                  type="button"
                  class="audio-btn ctrl-sub-btn"
                  aria-label="Toggle Repeat"
                >
                  <svg
                    class="ctrl-icon"
                    viewBox="0 0 24 24"
                    width="18"
                    height="18"
                    aria-hidden="true"
                    fill="currentColor"
                  >
                    <path
                      d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"
                    />
                  </svg>
                </button>
              </div>

              <!-- Volume Control Group -->
              <div class="volume-control-wrapper">
                <button
                  type="button"
                  class="audio-btn volume-btn"
                  aria-label="Adjust Volume"
                >
                  <svg
                    class="ctrl-icon"
                    viewBox="0 0 24 24"
                    width="20"
                    height="20"
                    aria-hidden="true"
                    fill="currentColor"
                  >
                    <path
                      d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"
                    />
                  </svg>
                </button>

                <div class="volume-slider-popup">
                  <label for="audio-volume-range" class="sr-only"
                    >Adjust Audio Volume</label
                  >
                  <input
                    type="range"
                    id="audio-volume-range"
                    class="ease-audio-volume-slider"
                    min="0"
                    max="100"
                    value="80"
                    aria-label="Adjust Volume"
                  />
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- Demo Keyboard Instructions Footer -->
      <footer class="demo-footer">
        <div class="keyboard-instruction">
          <span class="type-key">TAB</span> Focus audio controls &bull;
          <span class="type-key">GRADIENT GLOW</span> Multi-color ambient aura
          &bull; <span class="type-key">REDUCED MOTION</span> Static equalizer
          bars
        </div>
      </footer>
    </main>
  </body>
</html>
