<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Pure CSS 3D perspective tilt glassmorphism effect"
  >
  <title>3D Perspective Tilt Glass Effect</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="page">
    <section class="hero" aria-labelledby="hero-title">
      <p class="eyebrow">EASEMOTION CSS</p>

      <h1 id="hero-title">3D Perspective Glass</h1>

      <p class="intro">
        A pure CSS glassmorphism card with a subtle three-dimensional
        perspective tilt interaction.
      </p>

      <div class="scene">
        <article class="glass-card">
          <div class="card-glow"></div>

          <div class="card-content">
            <span class="card-label">PERSPECTIVE</span>

            <h2>Depth in Motion</h2>

            <p>
              Hover over the card to reveal a smooth 3D glass surface
              with layered depth and responsive lighting.
            </p>

            <div class="card-footer">
              <span>Pure CSS</span>
              <span>3D Transform</span>
            </div>
          </div>
        </article>
      </div>
    </section>
  </main>
</body>
</html>
