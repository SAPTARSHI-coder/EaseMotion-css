<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Keyboard Hotkeys Panel | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="khstage">
    <div class="khcard">
      <div class="khhead">
        <h2 class="khtitle">Keyboard Shortcuts</h2>
        <span class="khbadge">v2.4</span>
      </div>
      <div class="khgroup">
        <div class="khgroup-label">File</div>
        <div class="khrow">
          <span class="khaction">New</span>
          <div class="khkeys">
            <span class="khkey">Ctrl</span>
            <span class="khsep">+</span>
            <span class="khkey">N</span>
          </div>
        </div>
        <div class="khrow">
          <span class="khaction">Open</span>
          <div class="khkeys">
            <span class="khkey">Ctrl</span>
            <span class="khsep">+</span>
            <span class="khkey">O</span>
          </div>
        </div>
        <div class="khrow">
          <span class="khaction">Save</span>
          <div class="khkeys">
            <span class="khkey">Ctrl</span>
            <span class="khsep">+</span>
            <span class="khkey">S</span>
          </div>
        </div>
      </div>
      <div class="khgroup">
        <div class="khgroup-label">Edit</div>
        <div class="khrow">
          <span class="khaction">Undo</span>
          <div class="khkeys">
            <span class="khkey">Ctrl</span>
            <span class="khsep">+</span>
            <span class="khkey">Z</span>
          </div>
        </div>
        <div class="khrow">
          <span class="khaction">Redo</span>
          <div class="khkeys">
            <span class="khkey">Ctrl</span>
            <span class="khsep">+</span>
            <span class="khkey">Y</span>
          </div>
        </div>
      </div>
      <div class="khgroup">
        <div class="khgroup-label">View</div>
        <div class="khrow">
          <span class="khaction">Toggle Theme</span>
          <div class="khkeys">
            <span class="khkey">Ctrl</span>
            <span class="khsep">+</span>
            <span class="khkey">Shift</span>
            <span class="khsep">+</span>
            <span class="khkey">L</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
