<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ease Theme Aware Button Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="ease-theme-section dark-section">
    <h2>Dark Context</h2>
    <!-- Notice how there are no variant classes on this button -->
    <button class="ease-smart-btn">Context Aware Button</button>
  </div>
  <div class="ease-theme-section light-section">
    <h2>Light Context</h2>
    <!-- It is the EXACT same HTML -->
    <button class="ease-smart-btn">Context Aware Button</button>
  </div>
</body>
</html>
