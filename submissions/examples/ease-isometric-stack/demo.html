<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EaseMotion CSS 3D Isometric Card Stack</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="ease-iso-wrapper" tabindex="0" role="button" aria-label="Expand 3D layer stack">
    <div class="ease-iso-card ease-card-1" aria-hidden="true"></div>
    <div class="ease-iso-card ease-card-2" aria-hidden="true"></div>
    <div class="ease-iso-card ease-card-3" aria-hidden="true"></div>
    <div class="ease-iso-card ease-card-4">
      <div class="ease-card-logo">UI</div>
    </div>
  </div>
  <p style="position: absolute; bottom: 2rem; color: #64748b; font-family: system-ui; font-size: 0.875rem; text-align: center;">Geometry powered by <code>rotateX(60deg) rotateZ(-45deg)</code>.<br>Hover layers expand via <code>translateZ</code> and scaled box-shadows.</p>
</body>
</html>
