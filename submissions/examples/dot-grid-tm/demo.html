<!DOCTYPE html>

<title>Dot Grid — EaseMotion CSS</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>

  <section class="dotgrid-row-tm">

      <div class="dotgrid-1-tm"></div>

    <article class="dotgrid-2-wrap-tm">
      <div class="dotgrid-2-tm"></div>

    <article class="dotgrid-3-wrap-tm">
      <div class="dotgrid-3-tm"></div>
