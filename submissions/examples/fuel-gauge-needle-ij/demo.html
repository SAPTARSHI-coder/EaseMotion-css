<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-fuel-gauge-needle demo</title>
</head>
<body>
<div class="fgn-panel">
  <span class="fgn-title">DASHBOARD</span>
  <div class="fgn-gauge">
    <div class="fgn-dial"></div>
    <span class="fgn-needle"></span>
    <span class="fgn-pin"></span>
    <span class="fgn-mark fgn-e">E</span>
    <span class="fgn-mark fgn-q1">1/4</span>
    <span class="fgn-mark fgn-h">1/2</span>
    <span class="fgn-mark fgn-q3">3/4</span>
    <span class="fgn-mark fgn-f">F</span>
  </div>
  <span class="fgn-caption">TANK LEVEL</span>
</div>
</body>
</html>
