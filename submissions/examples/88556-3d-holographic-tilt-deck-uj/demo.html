<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Holographic Tilt Deck - EaseMotion CSS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="deck-header">
    <h1>3D Holographic Deck</h1>
    <p>Hardware-accelerated dynamic tilt and mouse-tracking glare refractions.</p>
  </header>

  <main class="deck-grid" id="deck-container">
    <article class="holo-card" tabindex="0" role="region" aria-label="Web3 Spatial Motion Card">
      <div class="holo-glare"></div>
      <div class="card-body">
        <span class="tag">WEB3 / AI</span>
        <h3>Spatial Motion</h3>
        <p>Dynamic perspective transforms driven by CSS custom properties and spatial depth.</p>
        <button type="button" class="card-btn">Explore Deck</button>
      </div>
    </article>
  </main>

  <script>
    const card = document.querySelector('.holo-card');

    card.addEventListener('mousemove', (e) => {
      const rect = card.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      
      const centerX = rect.width / 2;
      const centerY = rect.height / 2;
      
      const rotX = ((y - centerY) / centerY) * -12;
      const rotY = ((x - centerX) / centerX) * 12;

      card.style.setProperty('--rot-x', `${rotX}deg`);
      card.style.setProperty('--rot-y', `${rotY}deg`);
      card.style.setProperty('--mouse-x', `${(x / rect.width) * 100}%`);
      card.style.setProperty('--mouse-y', `${(y / rect.height) * 100}%`);
    });

    card.addEventListener('mouseleave', () => {
      card.style.setProperty('--rot-x', '0deg');
      card.style.setProperty('--rot-y', '0deg');
      card.style.setProperty('--mouse-x', '50%');
      card.style.setProperty('--mouse-y', '50%');
    });
  </script>
</body>
</html>
