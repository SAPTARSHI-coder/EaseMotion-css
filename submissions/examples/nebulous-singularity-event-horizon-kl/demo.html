<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nebulous Singularity Event Horizon - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #020205; color: #ffffff;">

    <div class="ease-card ease-card-glass nebula-container">
        <div class="nebula-header">
            <h2>Nebula Horizon</h2>
            <span class="ease-badge ease-badge-danger">Collapsing</span>
        </div>
        
        <div class="nebula-screen ease-center">
            <div class="accretion-cloud cloud-1"></div>
            <div class="accretion-cloud cloud-2"></div>
            <div class="event-horizon-ring"></div>
            <div class="singularity-core ease-center"></div>
        </div>

        <div class="nebula-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Radiance: 98%</span>
            <button class="ease-btn ease-btn-primary ease-btn-sm ease-hover-grow">Stabilize</button>
        </div>
    </div>

</body>
</html>
