<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    name="description"
    content="Solar Flare Radial glassmorphism UI created with pure HTML and CSS."
  />
  <title>Solar Flare Radial Glass</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="solar-scene">
    <div class="flare flare-one" aria-hidden="true"></div>
    <div class="flare flare-two" aria-hidden="true"></div>
    <div class="flare flare-three" aria-hidden="true"></div>

    <section class="glass-card" aria-labelledby="title">
      <div class="card-glow" aria-hidden="true"></div>

      <div class="card-content">
        <span class="badge">SOLAR FLARE</span>

        <h1 id="title">Radial Glass</h1>

        <p>
          A soft glassmorphism interface inspired by the radiant energy
          and warm glow of a solar flare.
        </p>

        <div class="card-actions">
          <button type="button">Explore</button>
          <button type="button" class="secondary">Learn More</button>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
