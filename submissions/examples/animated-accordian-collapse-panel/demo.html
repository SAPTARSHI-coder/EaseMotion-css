
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ease-accordion Demo</title>
<link rel="stylesheet" href="style.css">
<style>
  body { font-family: system-ui, sans-serif; background: #0f172a; color: #f1f5f9; padding: 60px; }
  .accordion-list { max-width: 480px; margin: 0 auto; }
  .accordion { background: #1e293b; border-radius: 8px; margin-bottom: 8px; overflow: hidden; }
</style>
</head>
<body>
  <div class="accordion-list">
    <details class="accordion" open>
      <summary class="accordion-trigger">What is EaseMotion CSS? <span class="accordion-icon">⌄</span></summary>
      <div class="accordion-content"><p>A lightweight, animation-first CSS component library, free of JS dependencies wherever possible.</p></div>
    </details>
    <details class="accordion">
      <summary class="accordion-trigger">Does it require JavaScript? <span class="accordion-icon">⌄</span></summary>
      <div class="accordion-content"><p>Most components are pure CSS; a few interactive ones need one line of JS for state toggling only.</p></div>
    </details>
  </div>
</body>
</html>
