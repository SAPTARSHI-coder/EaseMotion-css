<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radial Command Menu with Magnetic Physics</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-container">
    <div class="instructions">
      <h1>Radial Command Menu</h1>
      <p>Click the center button or press <kbd>Space</kbd> / <kbd>⌘K</kbd> to toggle the menu. Hover over items to trigger magnetic physics attraction.</p>
    </div>

    <!-- Radial Menu Component -->
    <div class="radial-menu-wrapper" id="radialMenu">
      <button class="trigger-btn" id="menuTrigger" aria-label="Toggle Menu">
        <span class="trigger-icon">+</span>
      </button>

      <nav class="radial-items">
        <button class="radial-item" style="--item-angle: 0deg;" data-label="Home">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
        </button>
        <button class="radial-item" style="--item-angle: 60deg;" data-label="Search">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        </button>
        <button class="radial-item" style="--item-angle: 120deg;" data-label="Settings">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        </button>
        <button class="radial-item" style="--item-angle: 180deg;" data-label="Profile">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        </button>
        <button class="radial-item" style="--item-angle: 240deg;" data-label="Notifications">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
        </button>
        <button class="radial-item" style="--item-angle: 300deg;" data-label="Analytics">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
        </button>
      </nav>

      <div class="active-label" id="activeLabel">Command</div>
    </div>
  </div>

  <script>
    const wrapper = id => document.getElementById(id);
    const radialMenu = wrapper('radialMenu');
    const menuTrigger = wrapper('menuTrigger');
    const activeLabel = wrapper('activeLabel');
    const items = document.querySelectorAll('.radial-item');

    // Toggle Menu Open / Close
    menuTrigger.addEventListener('click', () => {
      radialMenu.classList.toggle('open');
      activeLabel.textContent = radialMenu.classList.contains('open') ? 'Select' : 'Command';
    });

    // Magnetic Selection Physics Effect
    items.forEach(item => {
      item.addEventListener('mousemove', (e) => {
        const rect = item.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;
        
        // Calculate offset from cursor to item center
        const deltaX = (e.clientX - centerX) * 0.35;
        const deltaY = (e.clientY - centerY) * 0.35;

        item.style.setProperty('--mag-x', `${deltaX}px`);
        item.style.setProperty('--mag-y', `${deltaY}px`);
        activeLabel.textContent = item.getAttribute('data-label');
      });

      item.addEventListener('mouseleave', () => {
        item.style.setProperty('--mag-x', '0px');
        item.style.setProperty('--mag-y', '0px');
        activeLabel.textContent = 'Select';
      });
    });

    // Keyboard shortcut (⌘K or Space)
    window.addEventListener('keydown', (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
        e.preventDefault();
        menuTrigger.click();
      }
    });
  </script>
</body>
</html>
