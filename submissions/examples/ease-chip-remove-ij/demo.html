<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Add Tag/Chip with Remove Button for Web Layouts" />
  <title>Add Tag/Chip with Remove Button for Web Layouts | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="page-header">
    <h1>Add Tag/Chip with Remove Button for Web Layouts</h1>
    <p>A pure CSS component for the EaseMotion library.</p>
  </header>

  <main>

    <div class="chip-list" role="list" aria-label="Selected tags">
      <div class="chip" role="listitem">
        <span>Animation</span>
        <button type="button" class="chip__remove" aria-label="Remove Animation tag"></button>
      </div>
      <div class="chip" role="listitem">
        <span>CSS</span>
        <button type="button" class="chip__remove" aria-label="Remove CSS tag"></button>
      </div>
      <div class="chip" role="listitem">
        <span>EaseMotion</span>
        <button type="button" class="chip__remove" aria-label="Remove EaseMotion tag"></button>
      </div>
      <div class="chip" role="listitem">
        <span>Web</span>
        <button type="button" class="chip__remove" aria-label="Remove Web tag"></button>
      </div>
      <div class="chip" role="listitem">
        <span>UI</span>
        <button type="button" class="chip__remove" aria-label="Remove UI tag"></button>
      </div>
    </div>

  </main>
</body>
</html>
