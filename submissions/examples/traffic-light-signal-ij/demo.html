<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-traffic-light-signal demo</title>
</head>
<body>
<div class="tl-app">
  <span class="tl-title">INTERSECTION</span>
  <div class="tl-pole">
    <div class="tl-lights">
      <span class="tl-bulb tl-red"></span>
      <span class="tl-bulb tl-amber"></span>
      <span class="tl-bulb tl-green"></span>
    </div>
    <span class="tl-arm"></span>
  </div>
  <div class="tl-cross">
    <span class="tl-hand">&#10006;</span>
    <span class="tl-walk">WALK</span>
  </div>
  <span class="tl-timer">12</span>
</div>
</body>
</html>
