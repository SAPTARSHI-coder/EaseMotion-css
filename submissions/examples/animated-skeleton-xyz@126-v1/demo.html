<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animated Skeleton Loader - EaseMotion CSS Submission</title>
  
  <!-- EaseMotion CSS (Official CDN) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css">
  
  <!-- Local Skeleton Component Styles -->
  <link rel="stylesheet" href="style.css">
  
  <style>
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: var(--ease-color-bg, #f8fafc);
      color: var(--ease-color-text, #0f172a);
      margin: 0;
      padding: 2rem;
      gap: 3rem;
    }
    .demo-container {
      width: 100%;
      max-width: 900px;
    }
    .demo-section {
      margin-bottom: 4rem;
    }
    .demo-title {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
      color: var(--ease-color-text, #0f172a);
      text-align: center;
    }
    .demo-card {
      background-color: var(--ease-color-surface, #ffffff);
      border-radius: var(--ease-radius-lg, 12px);
      padding: 2rem;
      box-shadow: var(--ease-shadow-md, 0 4px 6px -1px rgba(0, 0, 0, 0.1));
      border: 1px solid var(--ease-color-border, #e2e8f0);
    }
  </style>
</head>
<body>

  <div class="ease-center ease-fade-in" style="text-align: center;">
    <h1 class="ease-slide-up">Animated Skeleton Loader</h1>
    <p class="ease-slide-up ease-delay-100" style="color: var(--ease-color-text-muted, #64748b); max-width: 500px;">
      Zero JavaScript. Pure CSS skeleton loaders with smooth shimmer animations and wave effects.
    </p>
  </div>

  <!-- Text Skeleton -->
  <div class="demo-container demo-section ease-fade-in ease-delay-200">
    <h2 class="demo-title">Text Skeleton</h2>
    <div class="demo-card">
      <div class="ease-skeleton-xyz">
        <div class="ease-skeleton-xyz-line ease-skeleton-xyz-w-75"></div>
        <div class="ease-skeleton-xyz-line ease-skeleton-xyz-w-100"></div>
        <div class="ease-skeleton-xyz-line ease-skeleton-xyz-w-90"></div>
        <div class="ease-skeleton-xyz-line ease-skeleton-xyz-w-60"></div>
      </div>
    </div>
  </div>

  <!-- Card Skeleton -->
  <div class="demo-container demo-section ease-fade-in ease-delay-300">
    <h2 class="demo-title">Card Skeleton</h2>
    <div class="demo-card">
      <div class="ease-skeleton-xyz-card">
        <div class="ease-skeleton-xyz-image"></div>
        <div class="ease-skeleton-xyz-content">
          <div class="ease-skeleton-xyz-line ease-skeleton-xyz-w-60"></div>
          <div class="ease-skeleton-xyz-line ease-skeleton-xyz-w-100"></div>
          <div class="ease-skeleton-xyz-line ease-skeleton-xyz-w-80"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Profile Skeleton -->
  <div class="demo-container demo-section ease-fade-in ease-delay-400">
    <h2 class="demo-title">Profile Skeleton</h2>
    <div class="demo-card">
      <div class="ease-skeleton-xyz-profile">
        <div class="ease-skeleton-xyz-avatar"></div>
        <div class="ease-skeleton-xyz-profile-info">
          <div class="ease-skeleton-xyz-line ease-skeleton-xyz-w-40"></div>
          <div class="ease-skeleton-xyz-line ease-skeleton-xyz-w-60"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- List Skeleton -->
  <div class="demo-container demo-section ease-fade-in ease-delay-500">
    <h2 class="demo-title">List Skeleton</h2>
    <div class="demo-card">
      <div class="ease-skeleton-xyz-list">
        <div class="ease-skeleton-xyz-list-item">
          <div class="ease-skeleton-xyz-avatar-sm"></div>
          <div class="ease-skeleton-xyz-list-content">
            <div class="ease-skeleton-xyz-line ease-skeleton-xyz-w-50"></div>
            <div class="ease-skeleton-xyz-line ease-skeleton-xyz-w-70"></div>
          </div>
        </div>
        <div class="ease-skeleton-xyz-list-item">
          <div class="ease-skeleton-xyz-avatar-sm"></div>
          <div class="ease-skeleton-xyz-list-content">
            <div class="ease-skeleton-xyz-line ease-skeleton-xyz-w-60"></div>
            <div class="ease-skeleton-xyz-line ease-skeleton-xyz-w-80"></div>
          </div>
        </div>
        <div class="ease-skeleton-xyz-list-item">
          <div class="ease-skeleton-xyz-avatar-sm"></div>
          <div class="ease-skeleton-xyz-list-content">
            <div class="ease-skeleton-xyz-line ease-skeleton-xyz-w-45"></div>
            <div class="ease-skeleton-xyz-line ease-skeleton-xyz-w-65"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Grid Skeleton -->
  <div class="demo-container demo-section ease-fade-in ease-delay-600">
    <h2 class="demo-title">Grid Skeleton</h2>
    <div class="demo-card">
      <div class="ease-skeleton-xyz-grid">
        <div class="ease-skeleton-xyz-grid-item">
          <div class="ease-skeleton-xyz-image-sm"></div>
          <div class="ease-skeleton-xyz-line ease-skeleton-xyz-w-80"></div>
        </div>
        <div class="ease-skeleton-xyz-grid-item">
          <div class="ease-skeleton-xyz-image-sm"></div>
          <div class="ease-skeleton-xyz-line ease-skeleton-xyz-w-70"></div>
        </div>
        <div class="ease-skeleton-xyz-grid-item">
          <div class="ease-skeleton-xyz-image-sm"></div>
          <div class="ease-skeleton-xyz-line ease-skeleton-xyz-w-90"></div>
        </div>
        <div class="ease-skeleton-xyz-grid-item">
          <div class="ease-skeleton-xyz-image-sm"></div>
          <div class="ease-skeleton-xyz-line ease-skeleton-xyz-w-60"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Animation Variants -->
  <div class="demo-container demo-section ease-fade-in ease-delay-700">
    <h2 class="demo-title">Animation Variants</h2>
    <div class="demo-card">
      <div style="display: flex; flex-direction: column; gap: 2rem;">
        <div>
          <p style="font-size: 0.875rem; font-weight: 600; margin-bottom: 0.75rem;">Shimmer (Default)</p>
          <div class="ease-skeleton-xyz">
            <div class="ease-skeleton-xyz-line ease-skeleton-xyz-w-100"></div>
            <div class="ease-skeleton-xyz-line ease-skeleton-xyz-w-80"></div>
          </div>
        </div>
        
        <div>
          <p style="font-size: 0.875rem; font-weight: 600; margin-bottom: 0.75rem;">Pulse</p>
          <div class="ease-skeleton-xyz ease-skeleton-xyz-pulse">
            <div class="ease-skeleton-xyz-line ease-skeleton-xyz-w-100"></div>
            <div class="ease-skeleton-xyz-line ease-skeleton-xyz-w-80"></div>
          </div>
        </div>
        
        <div>
          <p style="font-size: 0.875rem; font-weight: 600; margin-bottom: 0.75rem;">Wave</p>
          <div class="ease-skeleton-xyz ease-skeleton-xyz-wave">
            <div class="ease-skeleton-xyz-line ease-skeleton-xyz-w-100"></div>
            <div class="ease-skeleton-xyz-line ease-skeleton-xyz-w-80"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
