<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="CSS-only orbit satellite loading spinner"
  >
  <title>CSS Orbit Satellite Loader</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="page">
    <h1>CSS Orbit Satellite Loader</h1>

    <p class="description">
      A pure CSS loading spinner featuring a satellite orbiting a planet.
    </p>

    <div
      class="loader"
      role="status"
      aria-label="Loading"
      tabindex="0"
    >
      <span class="planet" aria-hidden="true"></span>

      <span class="orbit" aria-hidden="true">
        <span class="satellite"></span>
      </span>

      <span class="sr-only">Loading...</span>
    </div>
  </main>
</body>
</html>
