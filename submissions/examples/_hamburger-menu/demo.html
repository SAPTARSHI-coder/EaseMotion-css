<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pure CSS Hamburger Menu Animation</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="mobile-frame">
    <!-- Top Navigation Bar -->
    <header class="app-header">
      <div class="brand-logo">EaseMotion</div>

      <!-- Pure CSS Checkbox Toggle -->
      <input 
        type="checkbox" 
        id="menu-toggle" 
        class="menu-checkbox" 
        aria-label="Toggle navigation menu" 
      />

      <!-- Animated Hamburger Button (Top Right) -->
      <label for="menu-toggle" class="hamburger-btn" aria-hidden="true">
        <span class="bar top-bar"></span>
        <span class="bar mid-bar"></span>
        <span class="bar bot-bar"></span>
      </label>

      <!-- Dropdown Navigation Drawer -->
      <nav class="nav-drawer" aria-label="Main Navigation">
        <ul class="nav-list">
          <li><a href="#home" class="nav-link">Home</a></li>
          <li><a href="#features" class="nav-link">Features</a></li>
          <li><a href="#animations" class="nav-link">Animations</a></li>
          <li><a href="#docs" class="nav-link">Documentation</a></li>
          <li><a href="#contact" class="nav-link">Contact</a></li>
        </ul>
      </nav>
    </header>

    <!-- Card Body Content -->
    <main class="app-content">
      <span class="badge">Pure CSS</span>
      <h2>Smooth Navigation</h2>
      <p>Click the hamburger icon in the top right corner to preview the morphing animation and navigation drawer.</p>
    </main>
  </div>
</body>
</html>
