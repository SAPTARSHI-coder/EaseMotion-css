<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pure CSS Parallax Scrolling</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="parallax-wrapper">
        
        <header class="parallax-group group-1">
            <div class="parallax-layer layer-back">
                <!-- Background image/color for the back layer -->
            </div>
            <div class="parallax-layer layer-base">
                <h1>Pure CSS Parallax</h1>
                <p>Scroll down to see the effect</p>
            </div>
        </header>

        <section class="parallax-group group-2">
            <div class="parallax-layer layer-base">
                <div class="content-box">
                    <h2>No JavaScript Needed</h2>
                    <p>This effect relies entirely on CSS 3D transforms (`perspective` and `translateZ`) to create depth and different scrolling speeds for different layers.</p>
                </div>
            </div>
        </section>

        <footer class="parallax-group group-3">
            <div class="parallax-layer layer-back">
                <!-- Another background for the back layer -->
            </div>
            <div class="parallax-layer layer-base">
                <h2>The End</h2>
            </div>
        </footer>

    </div>
</body>
</html>
