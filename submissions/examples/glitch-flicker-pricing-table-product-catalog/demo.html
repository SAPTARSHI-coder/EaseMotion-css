<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Glitch-Flicker Pricing Table</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<section class="pricing-section">

    <div class="header">
        <h1 data-text="Glitch Pricing">Glitch Pricing</h1>
        <p>Futuristic CSS powered pricing cards</p>
    </div>


    <div class="pricing-container">

        <div class="card">
            <span class="glitch"></span>

            <h2>Starter</h2>
            <div class="price">$19</div>

            <ul>
                <li>5 Projects</li>
                <li>Basic Support</li>
                <li>10GB Storage</li>
            </ul>

            <button>Choose Plan</button>
        </div>


        <div class="card featured">

            <span class="glitch"></span>

            <h2>Pro</h2>

            <div class="price">$49</div>

            <ul>
                <li>Unlimited Projects</li>
                <li>Priority Support</li>
                <li>100GB Storage</li>
            </ul>

            <button>Choose Plan</button>

        </div>


        <div class="card">

            <span class="glitch"></span>

            <h2>Enterprise</h2>

            <div class="price">$99</div>

            <ul>
                <li>Team Access</li>
                <li>Advanced Security</li>
                <li>Unlimited Storage</li>
            </ul>

            <button>Choose Plan</button>

        </div>

    </div>

</section>


</body>
</html>
