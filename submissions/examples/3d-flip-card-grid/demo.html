<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Flip Card Grid</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="grid">

    <div class="flip-card">
        <div class="flip-inner">
            <div class="front">
                <h2>HTML</h2>
            </div>
            <div class="back">
                <p>Semantic & Accessible Markup</p>
            </div>
        </div>
    </div>

    <div class="flip-card">
        <div class="flip-inner">
            <div class="front">
                <h2>CSS</h2>
            </div>
            <div class="back">
                <p>Responsive 3D Flip Animation</p>
            </div>
        </div>
    </div>

    <div class="flip-card">
        <div class="flip-inner">
            <div class="front">
                <h2>EaseMotion</h2>
            </div>
            <div class="back">
                <p>Pure CSS Component Example</p>
            </div>
        </div>
    </div>

    <div class="flip-card">
        <div class="flip-inner">
            <div class="front">
                <h2>Portfolio</h2>
            </div>
            <div class="back">
                <p>Modern Interactive Card Grid</p>
            </div>
        </div>
    </div>

</div>

</body>
</html>
