<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Crypto Coin Card | EaseMotion CSS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<article class="crypto-card" tabindex="0" aria-label="Cryptocurrency Asset Card: Ethereum">
    <div class="crypto-header">
        <div class="crypto-info">
            <div class="crypto-icon" aria-hidden="true">Ξ</div>
            <div class="crypto-name-wrap">
                <h2>Ethereum</h2>
                <span class="crypto-symbol">ETH</span>
            </div>
        </div>
        <span class="crypto-badge">+5.42%</span>
    </div>

    <div class="crypto-price-row">
        <p class="crypto-price">$3,485.20</p>
    </div>

    <div class="crypto-chart" aria-hidden="true">
        <svg viewBox="0 0 100 30" preserveAspectRatio="none">
            <path d="M0 25 Q 25 10, 50 18 T 100 5" fill="none" stroke="#10b981" stroke-width="2.5" />
        </svg>
    </div>

    <div class="crypto-footer">
        <span>Market Cap: <strong>$418.2B</strong></span>
        <span>24h Vol: <strong>$14.5B</strong></span>
    </div>
</article>

</body>
</html>
