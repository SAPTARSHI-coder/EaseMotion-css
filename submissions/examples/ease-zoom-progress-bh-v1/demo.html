<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ease-zoom-progress-bh</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #0f172a; min-height: 100vh; padding: 2rem; color: #f1f5f9; }
    .container { max-width: 800px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 3rem; padding: 2rem; background: rgba(30, 41, 59, 0.8); border-radius: 1rem; }
    header h1 { font-size: 2rem; font-weight: 700; background: linear-gradient(135deg, #34d399, #10b981); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 0.5rem; }
    header p { color: #94a3b8; }
    .demo-section { background: rgba(30, 41, 59, 0.8); border: 1px solid rgba(148, 163, 184, 0.1); border-radius: 1rem; padding: 2rem; margin-bottom: 2rem; }
    .demo-section h2 { font-size: 1.25rem; margin-bottom: 1.5rem; color: #e2e8f0; }
    .demo-item { margin-bottom: 1.5rem; }
    .demo-item h3 { font-size: 0.875rem; color: #94a3b8; margin-bottom: 0.75rem; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>ease-zoom-progress-bh</h1>
      <p>Pure CSS Zoom-In Progress Bar Component</p>
    </header>
    
    <section class="demo-section">
      <h2>Zoom-In Progress Bars</h2>
      
      <div class="demo-item">
        <div class="ease-zoom-progress-bh ease-zoom-progress-bh-zoom animate">
          <div class="ease-zoom-progress-fill-bh" style="--progress: 75%"></div>
        </div>
      </div>
      
      <div class="demo-item">
        <h3>With Glow</h3>
        <div class="ease-zoom-progress-bh ease-zoom-progress-bh-zoom ease-zoom-progress-bh-glow animate">
          <div class="ease-zoom-progress-fill-bh" style="--progress: 60%"></div>
        </div>
      </div>
      
      <div class="demo-item">
        <h3>With Bounce</h3>
        <div class="ease-zoom-progress-bh ease-zoom-progress-bh-zoom ease-zoom-progress-bh-bounce animate">
          <div class="ease-zoom-progress-fill-bh" style="--progress: 85%"></div>
        </div>
      </div>
    </section>
    
    <section class="demo-section">
      <h2>Color Variants</h2>
      
      <div class="demo-item">
        <div class="ease-zoom-progress-bh ease-zoom-progress-bh-zoom ease-zoom-progress-bh-success animate">
          <div class="ease-zoom-progress-fill-bh" style="--progress: 90%"></div>
        </div>
      </div>
      
      <div class="demo-item">
        <div class="ease-zoom-progress-bh ease-zoom-progress-bh-zoom ease-zoom-progress-bh-warning animate">
          <div class="ease-zoom-progress-fill-bh" style="--progress: 45%"></div>
        </div>
      </div>
      
      <div class="demo-item">
        <div class="ease-zoom-progress-bh ease-zoom-progress-bh-zoom ease-zoom-progress-bh-danger animate">
          <div class="ease-zoom-progress-fill-bh" style="--progress: 25%"></div>
        </div>
      </div>
    </section>
    
    <section class="demo-section">
      <h2>Size Variants</h2>
      
      <div class="demo-item">
        <h3>Small</h3>
        <div class="ease-zoom-progress-bh ease-zoom-progress-bh-zoom ease-zoom-progress-bh-sm animate">
          <div class="ease-zoom-progress-fill-bh" style="--progress: 50%"></div>
        </div>
      </div>
      
      <div class="demo-item">
        <h3>Large</h3>
        <div class="ease-zoom-progress-bh ease-zoom-progress-bh-zoom ease-zoom-progress-bh-lg animate">
          <div class="ease-zoom-progress-fill-bh" style="--progress: 70%"></div>
        </div>
      </div>
    </section>
  </div>
</body>
</html>
