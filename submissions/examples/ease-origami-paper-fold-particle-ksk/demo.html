<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Origami Paper Fold Particles — EaseMotion CSS</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <!-- Main Showcase Container -->
  <div class="demo-page" id="app-root">

    <h1 class="demo-title">Origami Particle Effect</h1>
    <p class="demo-desc">Pure CSS paper-folded particles drifting and rotating inside a 3D perspective field.</p>

    <!-- Particles Viewport -->
    <div class="origami-viewport">
      
      <!-- Particle elements -->
      <div class="origami-particle shape-crane p1"></div>
      <div class="origami-particle shape-boat p2"></div>
      <div class="origami-particle shape-swan p3"></div>
      <div class="origami-particle shape-flower p4"></div>

    </div>

    <button class="demo-btn" id="themeBtn" style="background:rgba(255,255,255,0.06);color:inherit;border:1px solid var(--ease-origami-border);">
      Toggle Theme
    </button>

  </div>

  <script>
    // Theme toggle helper
    const themeBtn = document.getElementById('themeBtn');
    const appRoot = document.getElementById('app-root');
    themeBtn.addEventListener('click', () => {
      appRoot.classList.toggle('light-theme');
      document.querySelector('.origami-viewport').classList.toggle('light-theme');
    });
  </script>

</body>
</html>
