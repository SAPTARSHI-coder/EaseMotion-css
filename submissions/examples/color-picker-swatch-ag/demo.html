<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Color Picker Swatch</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="swatch-container">
      <div class="swatch-card">
        <div class="swatch-header">
          <h1 class="swatch-title">Accent Color</h1>
          <p class="swatch-subtitle">Select a color for your active theme</p>
        </div>

        <fieldset class="swatch-grid">
          <legend class="sr-only">Choose a color accent</legend>

          <div class="swatch-item">
            <input
              type="radio"
              id="color-indigo"
              name="color-swatch"
              value="indigo"
              class="swatch-input"
              checked
            />
            <label
              for="color-indigo"
              class="swatch-label"
              style="
                --swatch-bg: #6366f1;
                --swatch-glow: rgba(99, 102, 241, 0.45);
              "
              aria-label="Indigo color"
            >
              <svg
                class="swatch-check"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="3"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <polyline points="20 6 9 17 4 12"></polyline>
              </svg>
            </label>
          </div>

          <div class="swatch-item">
            <input
              type="radio"
              id="color-violet"
              name="color-swatch"
              value="violet"
              class="swatch-input"
            />
            <label
              for="color-violet"
              class="swatch-label"
              style="
                --swatch-bg: #8b5cf6;
                --swatch-glow: rgba(139, 92, 246, 0.45);
              "
              aria-label="Violet color"
            >
              <svg
                class="swatch-check"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="3"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <polyline points="20 6 9 17 4 12"></polyline>
              </svg>
            </label>
          </div>

          <div class="swatch-item">
            <input
              type="radio"
              id="color-rose"
              name="color-swatch"
              value="rose"
              class="swatch-input"
            />
            <label
              for="color-rose"
              class="swatch-label"
              style="
                --swatch-bg: #f43f5e;
                --swatch-glow: rgba(244, 63, 94, 0.45);
              "
              aria-label="Rose color"
            >
              <svg
                class="swatch-check"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="3"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <polyline points="20 6 9 17 4 12"></polyline>
              </svg>
            </label>
          </div>

          <div class="swatch-item">
            <input
              type="radio"
              id="color-amber"
              name="color-swatch"
              value="amber"
              class="swatch-input"
            />
            <label
              for="color-amber"
              class="swatch-label"
              style="
                --swatch-bg: #f59e0b;
                --swatch-glow: rgba(245, 158, 11, 0.45);
              "
              aria-label="Amber color"
            >
              <svg
                class="swatch-check"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="3"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <polyline points="20 6 9 17 4 12"></polyline>
              </svg>
            </label>
          </div>

          <div class="swatch-item">
            <input
              type="radio"
              id="color-emerald"
              name="color-swatch"
              value="emerald"
              class="swatch-input"
            />
            <label
              for="color-emerald"
              class="swatch-label"
              style="
                --swatch-bg: #10b981;
                --swatch-glow: rgba(16, 185, 129, 0.45);
              "
              aria-label="Emerald color"
            >
              <svg
                class="swatch-check"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="3"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <polyline points="20 6 9 17 4 12"></polyline>
              </svg>
            </label>
          </div>

          <div class="swatch-item">
            <input
              type="radio"
              id="color-cyan"
              name="color-swatch"
              value="cyan"
              class="swatch-input"
            />
            <label
              for="color-cyan"
              class="swatch-label"
              style="
                --swatch-bg: #06b6d4;
                --swatch-glow: rgba(6, 182, 212, 0.45);
              "
              aria-label="Cyan color"
            >
              <svg
                class="swatch-check"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="3"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <polyline points="20 6 9 17 4 12"></polyline>
              </svg>
            </label>
          </div>

          <div class="swatch-item">
            <input
              type="radio"
              id="color-sky"
              name="color-swatch"
              value="sky"
              class="swatch-input"
            />
            <label
              for="color-sky"
              class="swatch-label"
              style="
                --swatch-bg: #0ea5e9;
                --swatch-glow: rgba(14, 165, 233, 0.45);
              "
              aria-label="Sky Blue color"
            >
              <svg
                class="swatch-check"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="3"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <polyline points="20 6 9 17 4 12"></polyline>
              </svg>
            </label>
          </div>

          <div class="swatch-item">
            <input
              type="radio"
              id="color-slate"
              name="color-swatch"
              value="slate"
              class="swatch-input"
            />
            <label
              for="color-slate"
              class="swatch-label"
              style="
                --swatch-bg: #64748b;
                --swatch-glow: rgba(100, 116, 139, 0.45);
              "
              aria-label="Slate color"
            >
              <svg
                class="swatch-check"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="3"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <polyline points="20 6 9 17 4 12"></polyline>
              </svg>
            </label>
          </div>
        </fieldset>
      </div>
    </main>
  </body>
</html>
