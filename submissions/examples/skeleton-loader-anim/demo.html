<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skeleton Loader Demo - EaseMotion CSS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="demo-wrapper">
        <section class="demo-content">
            <h1>Skeleton Loader Demo</h1>
            <p>CSS-only animated shimmer placeholder representing asynchronous loading states.</p>
        </section>

        <!-- Skeleton Loader Component Card -->
        <div class="skeleton-card">
            <div class="skeleton-avatar skeleton-shimmer"></div>
            <div class="skeleton-info">
                <div class="skeleton-line skeleton-shimmer title-line"></div>
                <div class="skeleton-line skeleton-shimmer"></div>
                <div class="skeleton-line skeleton-shimmer short-line"></div>
            </div>
        </div>
    </main>
</body>
</html>
