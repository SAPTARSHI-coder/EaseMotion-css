<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Accessible CSS footnote tooltip.">
  <title>CSS Footnote Tooltip</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="article">
    <span class="eyebrow">Research note</span>

    <h1>CSS Footnote Tooltip</h1>

    <p>
      Modern interfaces can provide contextual information without
      interrupting the reading flow
      <span class="footnote">
        <button
          class="footnote-trigger"
          type="button"
          aria-describedby="note-1"
        >
          1
        <span id="note-1" class="tooltip" role="tooltip">
          Contextual information appears here without JavaScript.
        </span>
      </button>
    </p>
  </main>

</body>
</html>
