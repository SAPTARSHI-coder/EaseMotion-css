<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <meta
    name="description"
    content="CSS animated wavy image border demonstration"
  >
  <title>CSS Wavy Image Border</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">
    <section class="showcase" aria-labelledby="title">

      <header class="heading">
        <p class="eyebrow">EaseMotion CSS</p>

        <h1 id="title">Wavy Image Border</h1>

        <p class="intro">
          A decorative animated border that creates a smooth,
          wavy frame around an image using CSS only.
        </p>
      </header>

      <figure class="image-card">
        <div class="wave-frame">
          <div class="image-wrap">
            <img
              src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=1000&q=85"
              alt="Mountain landscape beneath a colorful evening sky"
            >
          </div>
        </div>

        <figcaption>
          <strong>Wavy Motion</strong>
          <span>
            Animated border built with CSS gradients and transforms.
          </span>
        </figcaption>
      </figure>

    </section>
  </main>

</body>
</html>
