<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Holographic Glass Credit Card Component - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="card-scene">
    <header class="scene-header">
      <span class="badge">GSSoC 2026 Showcase</span>
      <h1>Holographic Glass Credit Card</h1>
      <p>Interactive 3D glassmorphic credit card with rainbow dynamic sheen, contactless payment icon, and metallic chip finish.</p>
    </header>

    <div class="card-wrapper">
      <div class="holo-glass-card" tabindex="0">
        <div class="glass-reflection"></div>
        <div class="holographic-sheen"></div>
        
        <div class="card-top">
          <div class="chip-container">
            <div class="metallic-chip">
              <span class="chip-line"></span>
              <span class="chip-line"></span>
            </div>
            <svg class="contactless-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8.5 14.5A5 5 0 0 0 8.5 9.5"></path><path d="M12 17a8 8 0 0 0 0-10"></path><path d="M15.5 19.5a11 11 0 0 0 0-15"></path></svg>
          </div>
          <span class="card-brand">NEO-VAULT</span>
        </div>

        <div class="card-mid">
          <div class="card-number-display">4920 &bull;&bull;&bull;&bull; &bull;&bull;&bull;&bull; 8819</div>
        </div>

        <div class="card-bottom">
          <div class="info-block">
            <span class="info-label">CARD HOLDER</span>
            <span class="info-val">ELENA ROSTOVA</span>
          </div>
          <div class="info-block">
            <span class="info-label">EXPIRES</span>
            <span class="info-val">09/29</span>
          </div>
          <div class="mastercard-circles">
            <span class="circle circle-left"></span>
            <span class="circle circle-right"></span>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
