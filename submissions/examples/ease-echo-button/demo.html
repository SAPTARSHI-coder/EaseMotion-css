<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Echo Button · Sonar Concentric Rings</title>

    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <div class="card">
        <h2>📡 Echo Button</h2>
        <p class="sub">sends out concentric rings like sonar</p>

        <!-- === ECHO BUTTON === -->
        <button class="echo-btn" id="echoBtn">
            <span class="echo-content">
                <i class="fas fa-rss"></i>
                <span>Echo</span>
            </span>
            <span class="echo-ring ring-1"></span>
            <span class="echo-ring ring-2"></span>
            <span class="echo-ring ring-3"></span>
            <span class="echo-ring ring-4"></span>
            <span class="echo-ring ring-5"></span>
            <span class="echo-ring ring-6"></span>
            <span class="echo-ring ring-7"></span>
            <span class="echo-ring ring-8"></span>
            <span class="echo-dot"></span>
        </button>

        <p style="margin-top: 2rem; font-size: 0.85rem; color: #64748b;">
            Hover · watch the sonar rings pulse outward
        </p>
    </div>

    <!-- Embedded JavaScript -->
    <script>
        (function() {
            'use strict';

            const btn = document.getElementById('echoBtn');

            // Click feedback
            btn.addEventListener('click', function(e) {
                this.classList.add('click-pulse');
                setTimeout(() => {
                    this.classList.remove('click-pulse');
                }, 300);
                console.log('📡 Echo pulse sent!');
            });

            // Keyboard accessibility
            btn.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    this.click();
                }
            });

            // Reset animation on hover
            btn.addEventListener('mouseenter', function() {
                const rings = this.querySelectorAll('.echo-ring');
                rings.forEach(ring => {
                    ring.style.animation = 'none';
                    void ring.offsetWidth;
                    ring.style.animation = '';
                });
                const dot = this.querySelector('.echo-dot');
                dot.style.animation = 'none';
                void dot.offsetWidth;
                dot.style.animation = '';
            });

            console.log('📡 Echo button initialized!');

        })();
    </script>

</body>
</html>
