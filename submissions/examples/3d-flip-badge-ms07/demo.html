<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EaseMotion — 3D-Flip Badge</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/easemotion-css@latest/dist/easemotion.min.css" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<main class="ease-fb-page">
  <header class="ease-fb-header">
    <h1>Achievement Badges</h1>
    <p>Hover or focus a badge to flip it and see the stats.</p>
  </header>

  <section class="ease-fb-grid" aria-label="Achievement badges">

    <div class="ease-fb-badge" tabindex="0">
      <div class="ease-fb-badge__inner">
        <div class="ease-fb-badge__face ease-fb-badge__face--front ease-fb-badge__face--gold">
          <span class="ease-fb-badge__icon" aria-hidden="true">🏆</span>
          <span class="ease-fb-badge__name">Champion</span>
        </div>
        <div class="ease-fb-badge__face ease-fb-badge__face--back">
          <span class="ease-fb-badge__stat-label">Wins</span>
          <span class="ease-fb-badge__stat-value">128</span>
          <span class="ease-fb-badge__rank">Rank S</span>
        </div>
      </div>
    </div>

    <div class="ease-fb-badge" tabindex="0">
      <div class="ease-fb-badge__inner">
        <div class="ease-fb-badge__face ease-fb-badge__face--front ease-fb-badge__face--silver">
          <span class="ease-fb-badge__icon" aria-hidden="true">🎯</span>
          <span class="ease-fb-badge__name">Sharpshooter</span>
        </div>
        <div class="ease-fb-badge__face ease-fb-badge__face--back">
          <span class="ease-fb-badge__stat-label">Accuracy</span>
          <span class="ease-fb-badge__stat-value">94%</span>
          <span class="ease-fb-badge__rank">Rank A</span>
        </div>
      </div>
    </div>

    <div class="ease-fb-badge" tabindex="0">
      <div class="ease-fb-badge__inner">
        <div class="ease-fb-badge__face ease-fb-badge__face--front ease-fb-badge__face--bronze">
          <span class="ease-fb-badge__icon" aria-hidden="true">⚔️</span>
          <span class="ease-fb-badge__name">Duelist</span>
        </div>
        <div class="ease-fb-badge__face ease-fb-badge__face--back">
          <span class="ease-fb-badge__stat-label">Streak</span>
          <span class="ease-fb-badge__stat-value">17</span>
          <span class="ease-fb-badge__rank">Rank B</span>
        </div>
      </div>
    </div>

    <div class="ease-fb-badge" tabindex="0">
      <div class="ease-fb-badge__inner">
        <div class="ease-fb-badge__face ease-fb-badge__face--front ease-fb-badge__face--platinum">
          <span class="ease-fb-badge__icon" aria-hidden="true">👑</span>
          <span class="ease-fb-badge__name">Legend</span>
        </div>
        <div class="ease-fb-badge__face ease-fb-badge__face--back">
          <span class="ease-fb-badge__stat-label">Playtime</span>
          <span class="ease-fb-badge__stat-value">312h</span>
          <span class="ease-fb-badge__rank">Rank S+</span>
        </div>
      </div>
    </div>

  </section>
</main>

</body>
</html>
