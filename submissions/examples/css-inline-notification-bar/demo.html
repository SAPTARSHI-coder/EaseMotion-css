<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Inline Notification Bar</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<h1>CSS Inline Notification Bar</h1>

<div class="notification info" role="alert">
<span class="icon">ℹ️</span>
<div class="content">
<h3>Information</h3>
<p>Your profile has been updated successfully.</p>
</div>
<button class="close" aria-label="Close notification">&times;</button>
</div>

<div class="notification success" role="alert">
<span class="icon">✅</span>
<div class="content">
<h3>Success</h3>
<p>Your changes have been saved.</p>
</div>
<button class="close" aria-label="Close notification">&times;</button>
</div>

<div class="notification warning" role="alert">
<span class="icon">⚠️</span>
<div class="content">
<h3>Warning</h3>
<p>Please verify your email address.</p>
</div>
<button class="close" aria-label="Close notification">&times;</button>
</div>

</div>

</body>
</html>
