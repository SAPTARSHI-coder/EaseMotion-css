<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Pure CSS bouncing ball physics animation using keyframes, transforms and CSS custom properties."
  >
  <title>CSS Bouncing Ball Physics</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="demo">
    <section
      class="physics-card"
      aria-labelledby="physics-title"
    >
      <header class="demo-header">
        <span class="eyebrow">CSS MOTION LAB</span>

        <h1 id="physics-title">
          Bouncing Ball Physics
        </h1>

        <p>
          A lightweight physics-inspired animation created entirely
          with HTML and modern CSS.
        </p>
      </header>

      <div
        class="scene"
        role="img"
        aria-label="Animated ball repeatedly bouncing on a platform"
      >
        <div class="atmosphere" aria-hidden="true"></div>

        <div class="ball-shadow" aria-hidden="true"></div>

        <div class="ball" aria-hidden="true">
          <span class="ball-highlight"></span>
        </div>

        <div class="platform" aria-hidden="true">
          <span class="platform-glow"></span>
        </div>
      </div>

      <div class="physics-info" aria-label="Animation features">
        <span>Gravity</span>
        <span>Elasticity</span>
        <span>Momentum</span>
        <span>CSS Only</span>
      </div>

      <p class="reduced-motion-note">
        The animation respects the user's reduced-motion preference.
      </p>
    </section>
  </main>
</body>
</html>
