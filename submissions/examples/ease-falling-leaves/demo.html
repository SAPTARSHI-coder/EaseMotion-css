<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Falling Leaves – Leaves Fall and Swirl in Wind</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <h1>🍂 Falling Leaves</h1>
    <p class="subtitle">Leaves fall and swirl in the wind</p>

    <div class="leaves-container">
      <div class="leaves-stage" id="leavesStage">
        <canvas id="canvas"></canvas>
        
        <!-- Info overlay -->
        <div class="info-overlay">
          <span class="leaves-status" id="leavesStatus">🍃 Falling</span>
          <span class="leaf-count" id="leafCount">✦ 0 leaves</span>
        </div>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <button class="ctrl-btn add" id="addBtn">🍃 Add</button>
      <button class="ctrl-btn clear" id="clearBtn">🗑️ Clear</button>
      <button class="ctrl-btn toggle" id="toggleBtn">⏸ Pause</button>
      <button class="ctrl-btn reset" id="resetBtn">↺ Reset</button>
    </div>

    <!-- Sliders -->
    <div class="slider-container">
      <span class="slider-label">Wind Speed</span>
      <input type="range" id="windSlider" min="0" max="10" value="5" />
      <span class="slider-value" id="windValue">5×</span>
    </div>

    <div class="slider-container">
      <span class="slider-label">Leaf Count</span>
      <input type="range" id="countSlider" min="10" max="80" value="30" step="5" />
      <span class="slider-value" id="countValue">30</span>
    </div>

    <div class="slider-container">
      <span class="slider-label">Fall Speed</span>
      <input type="range" id="speedSlider" min="1" max="10" value="5" />
      <span class="slider-value" id="speedValue">5×</span>
    </div>

    <div class="slider-container">
      <span class="slider-label">Swirl Amount</span>
      <input type="range" id="swirlSlider" min="0" max="100" value="50" />
      <span class="slider-value" id="swirlValue">50%</span>
    </div>

    <!-- Status -->
    <div class="status" id="status">🍂 Leaves falling and swirling in the wind</div>

    <!-- Keyboard shortcuts -->
    <div class="shortcuts">
      <kbd>A</kbd> Add · <kbd>C</kbd> Clear · <kbd>Space</kbd> Pause · <kbd>R</kbd> Reset
    </div>
  </div>

  <script>
    (function() {
      "use strict";

      // DOM elements
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      const leavesStatus = document.getElementById('leavesStatus');
      const leafCount = document.getElementById('leafCount');
      const addBtn = document.getElementById('addBtn');
      const clearBtn = document.getElementById('clearBtn');
      const toggleBtn = document.getElementById('toggleBtn');
      const resetBtn = document.getElementById('resetBtn');
      const status = document.getElementById('status');
      const windSlider = document.getElementById('windSlider');
      const windValue = document.getElementById('windValue');
      const countSlider = document.getElementById('countSlider');
      const countValue = document.getElementById('countValue');
      const speedSlider = document.getElementById('speedSlider');
      const speedValue = document.getElementById('speedValue');
      const swirlSlider = document.getElementById('swirlSlider');
      const swirlValue = document.getElementById('swirlValue');

      // State
      let leaves = [];
      let isPaused = false;
      let animationId = null;
      let time = 0;
      let windPhase = 0;

      // Leaf colors (autumn palette)
      const LEAF_COLORS = [
        '#ff6b35', '#ff8c42', '#ffa94d', '#ffd93d', '#fecb6e',
        '#e17055', '#d63031', '#e84342', '#fdcb6e', '#f39c12',
        '#e67e22', '#d35400', '#c0392b', '#e74c3c', '#ff7675'
      ];

      // ----- Canvas setup -----
      function setupCanvas() {
        const rect = canvas.parentElement.getBoundingClientRect();
        const size = Math.min(rect.width - 40, 600);
        canvas.width = size;
        canvas.height = size;
        canvas.style.width = size + 'px';
        canvas.style.height = size + 'px';
      }

      // ----- Leaf class -----
      class Leaf {
        constructor() {
          const w = canvas.width;
          const h = canvas.height;
          const padding = 30;
          
          this.x = padding + Math.random() * (w - padding * 2);
          this.y = -20 - Math.random() * 100;
          this.size = 8 + Math.random() * 16;
          this.rotation = Math.random() * Math.PI * 2;
          this.rotationSpeed = (Math.random() - 0.5) * 0.04;
          this.fallSpeed = 0.3 + Math.random() * 0.7;
          this.windSpeed = 0.5 + Math.random() * 1.5;
          this.swirlAmount = 0.5 + Math.random() * 1.5;
          this.phase = Math.random() * Math.PI * 2;
          this.color = LEAF_COLORS[Math.floor(Math.random() * LEAF_COLORS.length)];
          this.opacity = 0.7 + Math.random() * 0.3;
          this.type = Math.floor(Math.random() * 3); // 0: oval, 1: maple, 2: oak
          this.wobble = 0;
          this.wobbleSpeed = 0.02 + Math.random() * 0.03;
          this.trail = [];
          this.trailLength = 5 + Math.floor(Math.random() * 8);
          this.alive = true;
          this.driftX = 0;
          this.driftY = 0;
        }

        update(windSpeed, fallSpeedMult, swirlAmount) {
          const w = canvas.width;
          const h = canvas.height;
          const wind = windSpeed * 0.05;
          const fallMult = fallSpeedMult / 5;
          const swirl = swirlAmount / 100;

          // Wind effect with gusts
          windPhase += 0.01;
          const gust = Math.sin(windPhase + this.phase) * 0.5 + 0.5;
          const windForce = wind * (0.5 + gust * 0.5);

          // Swirl effect
          this.wobble += this.wobbleSpeed;
          const wobbleOffset = Math.sin(this.wobble + this.phase) * this.swirlAmount * swirl * 1.5;

          // Update position
          this.x += windForce * this.windSpeed + wobbleOffset * 0.1;
          this.y += this.fallSpeed * fallMult * (0.5 + 0.5 * gust);

          // Add some drift
          this.driftX += (Math.random() - 0.5) * 0.05;
          this.driftY += (Math.random() - 0.5) * 0.02;
          this.x += this.driftX;
          this.y += this.driftY;

          // Rotation
          this.rotation += this.rotationSpeed * fallMult * (0.5 + gust * 0.5);
          this.rotation += windForce * 0.02;

          // Update trail
          this.trail.push({ x: this.x, y: this.y });
          if (this.trail.length > this.trailLength) {
            this.trail.shift();
          }

          // Check if leaf is off screen
          if (this.y > h + 30) {
            this.alive = false;
          }
          if (this.x < -50 || this.x > w + 50) {
            this.alive = false;
          }
        }

        draw(ctx) {
          const size = this.size;
          const alpha = this.opacity;

          // Draw trail
          if (this.trail.length > 1) {
            for (let i = 0; i < this.trail.length - 1; i++) {
              const t = i / this.trail.length;
              const trailAlpha = alpha * t * 0.15;
              const trailSize = size * t * 0.2;
              ctx.fillStyle = this.color + Math.round(trailAlpha * 255).toString(16).padStart(2, '0');
              ctx.beginPath();
              ctx.arc(this.trail[i].x, this.trail[i].y, trailSize, 0, Math.PI * 2);
              ctx.fill();
            }
          }

          ctx.save();
          ctx.translate(this.x, this.y);
          ctx.rotate(this.rotation);
          ctx.globalAlpha = alpha;

          // Glow
          const glowSize = size * 2.5;
          const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, glowSize);
          gradient.addColorStop(0, this.color + '33');
          gradient.addColorStop(1, this.color + '00');
          ctx.fillStyle = gradient;
          ctx.beginPath();
          ctx.arc(0, 0, glowSize, 0, Math.PI * 2);
          ctx.fill();

          // Draw leaf shape
          ctx.shadowColor = 'rgba(0,0,0,0.1)';
          ctx.shadowBlur = 5;

          switch(this.type) {
            case 0: // Oval leaf
              this.drawOvalLeaf(ctx, size);
              break;
            case 1: // Maple leaf
              this.drawMapleLeaf(ctx, size);
              break;
            case 2: // Oak leaf
              this.drawOakLeaf(ctx, size);
              break;
          }

          ctx.shadowBlur = 0;
          ctx.restore();
        }

        drawOvalLeaf(ctx, size) {
          const grad = ctx.createLinearGradient(-size * 0.5, 0, size * 0.5, 0);
          const color = this.color;
          grad.addColorStop(0, color);
          grad.addColorStop(0.5, this.lightenColor(color, 30));
          grad.addColorStop(1, color);
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.ellipse(0, 0, size * 0.5, size * 0.35, 0, 0, Math.PI * 2);
          ctx.fill();
          
          // Vein
          ctx.strokeStyle = this.lightenColor(color, 50) + '66';
          ctx.lineWidth = 0.5;
          ctx.beginPath();
          ctx.moveTo(-size * 0.3, 0);
          ctx.lineTo(size * 0.3, 0);
          ctx.stroke();
        }

        drawMapleLeaf(ctx, size) {
          const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, size * 0.5);
          const color = this.color;
          grad.addColorStop(0, this.lightenColor(color, 30));
          grad.addColorStop(1, color);
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.moveTo(0, -size * 0.5);
          ctx.lineTo(size * 0.2, -size * 0.2);
          ctx.lineTo(size * 0.5, -size * 0.1);
          ctx.lineTo(size * 0.25, size * 0.1);
          ctx.lineTo(size * 0.3, size * 0.4);
          ctx.lineTo(0, size * 0.2);
          ctx.lineTo(-size * 0.3, size * 0.4);
          ctx.lineTo(-size * 0.25, size * 0.1);
          ctx.lineTo(-size * 0.5, -size * 0.1);
          ctx.lineTo(-size * 0.2, -size * 0.2);
          ctx.closePath();
          ctx.fill();
          
          // Veins
          ctx.strokeStyle = this.lightenColor(color, 50) + '44';
          ctx.lineWidth = 0.5;
          for (let i = -2; i <= 2; i++) {
            const angle = i * 0.4;
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(Math.sin(angle) * size * 0.4, Math.cos(angle) * size * 0.3 - size * 0.1);
            ctx.stroke();
          }
        }

        drawOakLeaf(ctx, size) {
          const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, size * 0.5);
          const color = this.color;
          grad.addColorStop(0, this.lightenColor(color, 30));
          grad.addColorStop(1, color);
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.moveTo(0, -size * 0.45);
          ctx.quadraticCurveTo(size * 0.25, -size * 0.35, size * 0.35, -size * 0.15);
          ctx.quadraticCurveTo(size * 0.45, -size * 0.05, size * 0.35, size * 0.1);
          ctx.quadraticCurveTo(size * 0.4, size * 0.25, size * 0.25, size * 0.35);
          ctx.quadraticCurveTo(size * 0.1, size * 0.45, 0, size * 0.4);
          ctx.quadraticCurveTo(-size * 0.1, size * 0.45, -size * 0.25, size * 0.35);
          ctx.quadraticCurveTo(-size * 0.4, size * 0.25, -size * 0.35, size * 0.1);
          ctx.quadraticCurveTo(-size * 0.45, -size * 0.05, -size * 0.35, -size * 0.15);
          ctx.quadraticCurveTo(-size * 0.25, -size * 0.35, 0, -size * 0.45);
          ctx.closePath();
          ctx.fill();
          
          // Vein
          ctx.strokeStyle = this.lightenColor(color, 50) + '44';
          ctx.lineWidth = 0.5;
          ctx.beginPath();
          ctx.moveTo(0, -size * 0.35);
          ctx.lineTo(0, size * 0.35);
          ctx.stroke();
        }

        lightenColor(color, percent) {
          const num = parseInt(color.replace('#', ''), 16);
          const amt = Math.round(2.55 * percent);
          const R = Math.min(255, (num >> 16) + amt);
          const G = Math.min(255, ((num >> 8) & 0x00FF) + amt);
          const B = Math.min(255, (num & 0x0000FF) + amt);
          return '#' + (0x1000000 + R * 0x10000 + G * 0x100 + B).toString(16).slice(1);
        }
      }

      // ----- Generate leaves -----
      function generateLeaves(count) {
        const w = canvas.width;
        const h = canvas.height;
        for (let i = 0; i < count; i++) {
          const leaf = new Leaf();
          // Distribute across the top
          leaf.x = Math.random() * w;
          leaf.y = -20 - Math.random() * 200;
          leaves.push(leaf);
        }
        leafCount.textContent = `✦ ${leaves.length} leaves`;
        countValue.textContent = leaves.length;
      }

      // ----- Add leaves -----
      function addLeaves(count = 5) {
        const w = canvas.width;
        const h = canvas.height;
        for (let i = 0; i < count; i++) {
          const leaf = new Leaf();
          leaf.x = Math.random() * w;
          leaf.y = -20 - Math.random() * 100;
          leaves.push(leaf);
        }
        leafCount.textContent = `✦ ${leaves.length} leaves`;
        status.textContent = `🍃 Added ${count} leaves (${leaves.length} total)`;
        setTimeout(() => {
          status.textContent = '🍂 Leaves falling and swirling in the wind';
        }, 1500);
      }

      // ----- Clear leaves -----
      function clearLeaves() {
        leaves = [];
        leafCount.textContent = '✦ 0 leaves';
        leavesStatus.textContent = '🍃 Empty';
        status.textContent = '🗑️ Leaves cleared';
        setTimeout(() => {
          status.textContent = '🍂 Click Add to start the fall';
        }, 1000);
      }

      // ----- Toggle pause -----
      function togglePause() {
        isPaused = !isPaused;
        toggleBtn.textContent = isPaused ? '▶ Play' : '⏸ Pause';
        status.textContent = isPaused ? '⏸ Paused' : '▶ Resumed';
        leavesStatus.textContent = isPaused ? '⏸ Paused' : '🍃 Falling';
      }

      // ----- Reset -----
      function resetLeaves() {
        leaves = [];
        isPaused = false;
        toggleBtn.textContent = '⏸ Pause';
        leavesStatus.textContent = '🍃 Falling';
        windSlider.value = 5;
        windValue.textContent = '5×';
        countSlider.value = 30;
        countValue.textContent = '30';
        speedSlider.value = 5;
        speedValue.textContent = '5×';
        swirlSlider.value = 50;
        swirlValue.textContent = '50%';
        generateLeaves(30);
        status.textContent = '↺ Reset';
        setTimeout(() => {
          status.textContent = '🍂 Leaves falling and swirling in the wind';
        }, 500);
      }

      // ----- Draw background -----
      function drawBackground() {
        const w = canvas.width;
        const h = canvas.height;
        const cx = w / 2;
        const cy = h / 2;

        // Sky gradient
        const bgGradient = ctx.createRadialGradient(cx, cy * 0.5, 0, cx, cy * 0.5, w * 0.7);
        bgGradient.addColorStop(0, '#1a1a3a');
        bgGradient.addColorStop(0.3, '#14142a');
        bgGradient.addColorStop(0.7, '#0d0d1a');
        bgGradient.addColorStop(1, '#06060a');
        ctx.fillStyle = bgGradient;
        ctx.fillRect(0, 0, w, h);

        // Ground
        const groundGrad = ctx.createLinearGradient(0, h * 0.9, 0, h);
        groundGrad.addColorStop(0, 'rgba(20, 30, 20, 0)');
        groundGrad.addColorStop(0.3, 'rgba(20, 30, 20, 0.3)');
        groundGrad.addColorStop(1, 'rgba(10, 20, 10, 0.6)');
        ctx.fillStyle = groundGrad;
        ctx.fillRect(0, h * 0.9, w, h * 0.1);

        // Distant trees silhouette
        ctx.fillStyle = 'rgba(10, 15, 10, 0.1)';
        for (let i = 0; i < 5; i++) {
          const x = (i / 5) * w + Math.sin(i * 1.5) * 30;
          const height = 30 + Math.sin(i * 2) * 20;
          ctx.beginPath();
          ctx.moveTo(x, h * 0.9);
          ctx.lineTo(x - 20, h * 0.9 - height);
          ctx.lineTo(x + 20, h * 0.9 - height);
          ctx.closePath();
          ctx.fill();
        }
      }

      // ----- Draw -----
      function draw() {
        const w = canvas.width;
        const h = canvas.height;

        drawBackground();

        // Update leaves
        if (!isPaused) {
          const windSpeed = parseInt(windSlider.value);
          const fallSpeed = parseInt(speedSlider.value);
          const swirlAmount = parseInt(swirlSlider.value);
          
          leaves = leaves.filter(l => l.alive);
          leaves.forEach(l => l.update(windSpeed, fallSpeed, swirlAmount));
          
          // Respawn leaves that fall off screen
          const deadCount = leaves.filter(l => !l.alive).length;
          if (deadCount > 0) {
            leaves = leaves.filter(l => l.alive);
            // Add new leaves at top
            const count = Math.min(deadCount, 10);
            for (let i = 0; i < count; i++) {
              const leaf = new Leaf();
              leaf.x = Math.random() * w;
              leaf.y = -20 - Math.random() * 100;
              leaves.push(leaf);
            }
          }
        }

        // Draw leaves (sorted by size for depth)
        const sortedLeaves = [...leaves].sort((a, b) => a.size - b.size);
        sortedLeaves.forEach(l => l.draw(ctx));

        // Update count
        leafCount.textContent = `✦ ${leaves.length} leaves`;
        if (leaves.length > 0) {
          leavesStatus.textContent = '🍃 Falling';
        }
      }

      // ----- Animation loop -----
      function animate() {
        time += 0.016;
        draw();
        animationId = requestAnimationFrame(animate);
      }

      // ----- Start animation -----
      function startAnimation() {
        if (animationId) {
          cancelAnimationFrame(animationId);
        }
        animate();
      }

      // ----- Event Listeners -----
      addBtn.addEventListener('click', () => addLeaves(5));
      clearBtn.addEventListener('click', clearLeaves);
      toggleBtn.addEventListener('click', togglePause);
      resetBtn.addEventListener('click', resetLeaves);

      windSlider.addEventListener('input', (e) => {
        windValue.textContent = e.target.value + '×';
      });

      countSlider.addEventListener('input', (e) => {
        const val = parseInt(e.target.value);
        countValue.textContent = val;
        // Adjust leaf count
        const currentCount = leaves.length;
        if (val > currentCount) {
          addLeaves(val - currentCount);
        } else if (val < currentCount) {
          leaves = leaves.slice(0, val);
          leafCount.textContent = `✦ ${leaves.length} leaves`;
        }
      });

      speedSlider.addEventListener('input', (e) => {
        speedValue.textContent = e.target.value + '×';
      });

      swirlSlider.addEventListener('input', (e) => {
        swirlValue.textContent = e.target.value + '%';
      });

      // Keyboard shortcuts
      document.addEventListener('keydown', (e) => {
        if (e.key === 'a' || e.key === 'A') {
          e.preventDefault();
          addLeaves(5);
        }
        if (e.key === 'c' || e.key === 'C') {
          e.preventDefault();
          clearLeaves();
        }
        if (e.key === ' ' || e.key === 'Space') {
          e.preventDefault();
          togglePause();
        }
        if (e.key === 'r' || e.key === 'R') {
          e.preventDefault();
          resetLeaves();
        }
      });

      // Click canvas to add leaves
      canvas.addEventListener('click', () => addLeaves(3));

      // ----- Resize handler -----
      let resizeTimeout;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(() => {
          setupCanvas();
        }, 200);
      });

      // ----- Init -----
      function init() {
        setupCanvas();
        generateLeaves(30);
        startAnimation();
        status.textContent = '🍂 Leaves falling and swirling in the wind!';
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }

    })();
  </script>
</body>
</html>
