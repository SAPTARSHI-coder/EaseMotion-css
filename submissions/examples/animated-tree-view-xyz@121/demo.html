<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animated Tree View - EaseMotion CSS Submission</title>
  
  <!-- EaseMotion CSS (Official CDN) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css">
  
  <!-- Local Tree View Component Styles -->
  <link rel="stylesheet" href="style.css">
  
  <style>
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: var(--ease-color-bg, #f8fafc);
      color: var(--ease-color-text, #0f172a);
      margin: 0;
      padding: 2rem;
      gap: 3rem;
    }
    .demo-container {
      width: 100%;
      max-width: 600px;
    }
    .demo-section {
      margin-bottom: 3rem;
    }
    .demo-title {
      font-size: 1.125rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
      color: var(--ease-color-text, #0f172a);
    }
    .demo-card {
      background-color: var(--ease-color-surface, #ffffff);
      border-radius: var(--ease-radius-lg, 12px);
      padding: 2rem;
      box-shadow: var(--ease-shadow-md, 0 4px 6px -1px rgba(0, 0, 0, 0.1));
      border: 1px solid var(--ease-color-border, #e2e8f0);
    }
  </style>
</head>
<body>

  <div class="ease-center ease-fade-in" style="text-align: center;">
    <h1 class="ease-slide-up">Animated Tree View Component</h1>
    <p class="ease-slide-up ease-delay-100" style="color: var(--ease-color-text-muted, #64748b); max-width: 500px;">
      Zero JavaScript. Pure CSS tree view with smooth expand/collapse animations and connecting lines.
    </p>
  </div>

  <!-- File Explorer Tree -->
  <div class="demo-container demo-section ease-fade-in ease-delay-200">
    <h2 class="demo-title">File Explorer Tree</h2>
    <div class="demo-card">
      <div class="ease-tree-xyz">
        <ul class="ease-tree-xyz-list">
          <li class="ease-tree-xyz-item">
            <input type="checkbox" id="node-1" class="ease-tree-xyz-toggle" checked>
            <label for="node-1" class="ease-tree-xyz-node">
              <span class="ease-tree-xyz-icon">📁</span>
              <span class="ease-tree-xyz-text">src</span>
              <span class="ease-tree-xyz-arrow">▼</span>
            </label>
            <ul class="ease-tree-xyz-children">
              <li class="ease-tree-xyz-item">
                <input type="checkbox" id="node-1-1" class="ease-tree-xyz-toggle" checked>
                <label for="node-1-1" class="ease-tree-xyz-node">
                  <span class="ease-tree-xyz-icon">📁</span>
                  <span class="ease-tree-xyz-text">components</span>
                  <span class="ease-tree-xyz-arrow">▼</span>
                </label>
                <ul class="ease-tree-xyz-children">
                  <li class="ease-tree-xyz-item">
                    <label class="ease-tree-xyz-node ease-tree-xyz-selected">
                      <span class="ease-tree-xyz-icon">📄</span>
                      <span class="ease-tree-xyz-text">Button.tsx</span>
                    </label>
                  </li>
                  <li class="ease-tree-xyz-item">
                    <label class="ease-tree-xyz-node">
                      <span class="ease-tree-xyz-icon">📄</span>
                      <span class="ease-tree-xyz-text">Modal.tsx</span>
                    </label>
                  </li>
                </ul>
              </li>
              <li class="ease-tree-xyz-item">
                <label class="ease-tree-xyz-node">
                  <span class="ease-tree-xyz-icon">📄</span>
                  <span class="ease-tree-xyz-text">index.ts</span>
                </label>
              </li>
            </ul>
          </li>
          <li class="ease-tree-xyz-item">
            <input type="checkbox" id="node-2" class="ease-tree-xyz-toggle">
            <label for="node-2" class="ease-tree-xyz-node">
              <span class="ease-tree-xyz-icon">📁</span>
              <span class="ease-tree-xyz-text">public</span>
              <span class="ease-tree-xyz-arrow">▼</span>
            </label>
            <ul class="ease-tree-xyz-children">
              <li class="ease-tree-xyz-item">
                <label class="ease-tree-xyz-node">
                  <span class="ease-tree-xyz-icon">🖼️</span>
                  <span class="ease-tree-xyz-text">logo.png</span>
                </label>
              </li>
            </ul>
          </li>
          <li class="ease-tree-xyz-item">
            <label class="ease-tree-xyz-node">
              <span class="ease-tree-xyz-icon">📄</span>
              <span class="ease-tree-xyz-text">package.json</span>
            </label>
          </li>
        </ul>
      </div>
    </div>
  </div>

  <!-- Organizational Chart Tree -->
  <div class="demo-container demo-section ease-fade-in ease-delay-300">
    <h2 class="demo-title">Organizational Chart</h2>
    <div class="demo-card">
      <div class="ease-tree-xyz ease-tree-xyz-org">
        <ul class="ease-tree-xyz-list">
          <li class="ease-tree-xyz-item">
            <input type="checkbox" id="org-1" class="ease-tree-xyz-toggle" checked>
            <label for="org-1" class="ease-tree-xyz-node">
              <div class="ease-tree-xyz-avatar" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">CEO</div>
              <div class="ease-tree-xyz-info">
                <div class="ease-tree-xyz-name">Sarah Johnson</div>
                <div class="ease-tree-xyz-role">Chief Executive Officer</div>
              </div>
              <span class="ease-tree-xyz-arrow">▼</span>
            </label>
            <ul class="ease-tree-xyz-children">
              <li class="ease-tree-xyz-item">
                <input type="checkbox" id="org-1-1" class="ease-tree-xyz-toggle" checked>
                <label for="org-1-1" class="ease-tree-xyz-node">
                  <div class="ease-tree-xyz-avatar" style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);">CTO</div>
                  <div class="ease-tree-xyz-info">
                    <div class="ease-tree-xyz-name">Mike Chen</div>
                    <div class="ease-tree-xyz-role">Chief Technology Officer</div>
                  </div>
                  <span class="ease-tree-xyz-arrow">▼</span>
                </label>
                <ul class="ease-tree-xyz-children">
                  <li class="ease-tree-xyz-item">
                    <label class="ease-tree-xyz-node">
                      <div class="ease-tree-xyz-avatar" style="background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);">DEV</div>
                      <div class="ease-tree-xyz-info">
                        <div class="ease-tree-xyz-name">Team Alpha</div>
                        <div class="ease-tree-xyz-role">5 developers</div>
                      </div>
                    </label>
                  </li>
                </ul>
              </li>
            </ul>
          </li>
        </ul>
      </div>
    </div>
  </div>

  <!-- Checklist Tree -->
  <div class="demo-container demo-section ease-fade-in ease-delay-400">
    <h2 class="demo-title">Task Checklist Tree</h2>
    <div class="demo-card">
      <div class="ease-tree-xyz ease-tree-xyz-checklist">
        <ul class="ease-tree-xyz-list">
          <li class="ease-tree-xyz-item">
            <input type="checkbox" id="task-1" class="ease-tree-xyz-toggle" checked>
            <label for="task-1" class="ease-tree-xyz-node">
              <span class="ease-tree-xyz-checkbox"></span>
              <span class="ease-tree-xyz-text">Project Setup</span>
              <span class="ease-tree-xyz-arrow">▼</span>
            </label>
            <ul class="ease-tree-xyz-children">
              <li class="ease-tree-xyz-item">
                <label class="ease-tree-xyz-node ease-tree-xyz-completed">
                  <span class="ease-tree-xyz-checkbox"></span>
                  <span class="ease-tree-xyz-text">Initialize repository</span>
                </label>
              </li>
              <li class="ease-tree-xyz-item">
                <label class="ease-tree-xyz-node ease-tree-xyz-completed">
                  <span class="ease-tree-xyz-checkbox"></span>
                  <span class="ease-tree-xyz-text">Setup CI/CD pipeline</span>
                </label>
              </li>
            </ul>
          </li>
          <li class="ease-tree-xyz-item">
            <input type="checkbox" id="task-2" class="ease-tree-xyz-toggle">
            <label for="task-2" class="ease-tree-xyz-node">
              <span class="ease-tree-xyz-checkbox"></span>
              <span class="ease-tree-xyz-text">Development</span>
              <span class="ease-tree-xyz-arrow">▼</span>
            </label>
            <ul class="ease-tree-xyz-children">
              <li class="ease-tree-xyz-item">
                <label class="ease-tree-xyz-node">
                  <span class="ease-tree-xyz-checkbox"></span>
                  <span class="ease-tree-xyz-text">Build components</span>
                </label>
              </li>
            </ul>
          </li>
        </ul>
      </div>
    </div>
  </div>

</body>
</html>
