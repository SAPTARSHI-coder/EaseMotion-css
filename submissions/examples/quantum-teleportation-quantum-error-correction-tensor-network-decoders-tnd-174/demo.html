<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tensor Network Decoders TND - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css"></head><body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030712; color: #ffffff;">

    <div class="ease-card ease-card-glass tnd-container">
        <div class="tnd-header">
            <h2>Tensor-Network Decoders</h2>
            <span class="ease-badge ease-badge-primary">Quantum Error Correction</span>
        </div>
        
        <div class="tnd-screen ease-center">
            <div class="tnd-flux flux-tnd-a"></div>
            <div class="tnd-flux flux-tnd-b"></div>
            <div class="tnd-boundary-ring"></div>
            <div class="tnd-core ease-center"></div>
        </div>

        <div class="tnd-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Contraction Decoders &amp; Optimal Error Thresholds</span>
            <button class="ease-btn ease-btn-primary ease-btn-sm ease-hover-grow">Run Tensor Decoder</button>
        </div>
    </div></body></html>
