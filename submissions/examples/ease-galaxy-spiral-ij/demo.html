<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galaxy Spiral Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="cosmos">
    <div class="galaxy" id="galaxy" aria-hidden="true">
      <div class="arm arm-a"></div>
      <div class="arm arm-b"></div>
      <div class="core"></div>
      <div class="dust dust-1"></div>
      <div class="dust dust-2"></div>
    </div>
    <p class="hint">A spiral galaxy with two arms slowly revolves around a bright core.</p>
  </main>
</body>
</html>
