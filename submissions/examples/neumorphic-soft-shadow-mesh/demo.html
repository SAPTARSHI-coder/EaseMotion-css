<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>Neumorphic Soft Shadow Mesh</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">
    <section class="mesh-card" aria-labelledby="title">

      <div class="mesh-orb orb-one"></div>
      <div class="mesh-orb orb-two"></div>
      <div class="mesh-orb orb-three"></div>

      <div class="content">
        <span class="badge">CSS MESH</span>

        <h1 id="title">Neumorphic Soft Shadow</h1>

        <p>
          A soft mesh-gradient surface with layered neumorphic shadows,
          smooth transitions, and a CSS-only interaction.
        </p>

        <div class="actions">
          <button type="button" class="soft-button">
            Explore
          </button>

          <button type="button" class="soft-button secondary">
            Learn More
          </button>
        </div>
      </div>

    </section>
  </main>

</body>
</html>
