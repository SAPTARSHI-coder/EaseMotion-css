<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Scroll Table</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="demo">
    <h1>Responsive Scroll Table</h1>
    <p>Scroll horizontally on smaller screens to view all columns.</p>

    <div class="table-wrapper" role="region" aria-label="Student performance table" tabindex="0">
      <table>
        <caption>Student Performance</caption>
        <thead>
          <tr>
            <th scope="col" class="sticky-column">Student</th>
            <th scope="col">Mathematics</th>
            <th scope="col">Physics</th>
            <th scope="col">Chemistry</th>
            <th scope="col">Computer Science</th>
            <th scope="col">English</th>
          </tr>
        </thead>

        <tbody>
          <tr>
            <th scope="row" class="sticky-column">Aarav</th>
            <td>92</td>
            <td>88</td>
            <td>90</td>
            <td>95</td>
            <td>86</td>
          </tr>

          <tr>
            <th scope="row" class="sticky-column">Priya</th>
            <td>89</td>
            <td>94</td>
            <td>87</td>
            <td>92</td>
            <td>90</td>
          </tr>

          <tr>
            <th scope="row" class="sticky-column">Rahul</th>
            <td>85</td>
            <td>91</td>
            <td>93</td>
            <td>88</td>
            <td>84</td>
          </tr>

          <tr>
            <th scope="row" class="sticky-column">Ananya</th>
            <td>96</td>
            <td>90</td>
            <td>94</td>
            <td>97</td>
            <td>91</td>
          </tr>

          <tr>
            <th scope="row" class="sticky-column">Vikram</th>
            <td>82</td>
            <td>86</td>
            <td>89</td>
            <td>91</td>
            <td>88</td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>
</body>
</html>
