<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stacked Card Flare</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="shell" aria-labelledby="title">
    <section class="card">
      <p class="eyebrow">cards</p>
      <h1 id="title">Stacked Card Flare</h1>
      <p class="summary">A CSS-only stacked card composition with a flaring highlight and layered depth.</p>
      <div class="stage" role="img" aria-label="Animated Stacked Card Flare">
        <div class="stack">
          <article class="panel back"></article>
          <article class="panel mid"></article>
          <article class="panel front">
            <span class="flare"></span>
            <span class="chip">Active</span>
          </article>
        </div>
        <article class="tile"><strong>01</strong><span>Layered card depth</span></article>
        <article class="tile"><strong>02</strong><span>Soft flare accent</span></article>
        <article class="tile"><strong>03</strong><span>Floating stack motion</span></article>
        <article class="tile"><strong>04</strong><span>Reduced-motion friendly</span></article>
      </div>
      <div class="tags" aria-label="Stacked Card Flare features">
        <span>Layered card depth</span>
        <span>Soft flare accent</span>
        <span>Floating stack motion</span>
        <span>Reduced-motion friendly</span>
      </div>
    </section>
  </main>
</body>
</html>
