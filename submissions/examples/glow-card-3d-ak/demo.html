<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Glass Glow Card — EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <p class="label">Pure CSS Glassmorphism Aura Glow Cards</p>
  <div class="demo-row">
    <!-- Purple Aura -->
    <div class="ease-3d-glow-card">
      <h3 class="ease-3d-glow-card__title">Violet Aura</h3>
      <p class="ease-3d-glow-card__desc">Hover over this glass container to unveil the expanding radial backlight aura.</p>
    </div>

    <!-- Emerald Aura -->
    <div class="ease-3d-glow-card ease-3d-glow-card--emerald">
      <h3 class="ease-3d-glow-card__title">Emerald Aura</h3>
      <p class="ease-3d-glow-card__desc">Vibrant spring radial emerald ambient backlight glow effect.</p>
    </div>

    <!-- Rose Aura -->
    <div class="ease-3d-glow-card ease-3d-glow-card--rose">
      <h3 class="ease-3d-glow-card__title">Rose Aura</h3>
      <p class="ease-3d-glow-card__desc">Warm rose pink glass backlight aura expansion.</p>
    </div>
  </div>

</body>
</html>
