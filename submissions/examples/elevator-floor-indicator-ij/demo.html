<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-elevator-floor-indicator demo</title>
</head>
<body>
<div class="el-app">
  <span class="el-title">ELEVATOR</span>
  <div class="el-shaft">
    <div class="el-cab">
      <span class="el-door el-door-1"></span>
      <span class="el-door el-door-2"></span>
    </div>
  </div>
  <div class="el-indicator">
    <span class="el-up"></span>
    <span class="el-down"></span>
    <span class="el-digits">3</span>
  </div>
  <div class="el-buttons">
    <span class="el-btn el-btn-1"></span>
    <span class="el-btn el-btn-2"></span>
    <span class="el-btn el-btn-3"></span>
    <span class="el-btn el-btn-4"></span>
    <span class="el-btn el-btn-5"></span>
  </div>
</div>
</body>
</html>
