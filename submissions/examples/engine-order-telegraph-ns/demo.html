<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Engine Order Telegraph — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Engine Order Telegraph demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Engine Order Telegraph</h1>
      <p class="lede">Ship engine-order telegraph handle swinging to FULL</p>
    </header>

    <section class="ease-engine-order-telegraph" data-demo="engine-order-telegraph" aria-live="polite">
      <div class="ease-engine-order-telegraph__housing">
        <div class="ease-engine-order-telegraph__bezel">
          <div class="ease-engine-order-telegraph__face">
            <div class="ease-engine-order-telegraph__readout">
              <span class="ease-engine-order-telegraph__label">Engine Order Telegraph</span>
              <span class="ease-engine-order-telegraph__value">LIVE</span>
            </div>
            <div class="ease-engine-order-telegraph__motion" aria-hidden="true">
              <span class="ease-engine-order-telegraph__a"></span>
              <span class="ease-engine-order-telegraph__b"></span>
              <span class="ease-engine-order-telegraph__c"></span>
              <span class="ease-engine-order-telegraph__d"></span>
            </div>
            <div class="ease-engine-order-telegraph__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-engine-order-telegraph__controls">
          <button type="button" class="ease-engine-order-telegraph__btn primary">Engage</button>
          <button type="button" class="ease-engine-order-telegraph__btn">Reset</button>
          <label class="ease-engine-order-telegraph__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-engine-order-telegraph__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
