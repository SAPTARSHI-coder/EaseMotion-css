<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Morphing Modal</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="page">

    <div class="intro">
      <span class="eyebrow">EASEMOTION</span>

      <h1>Shared Element<br>Modal</h1>

      <p>
        Click the card to experience a smooth shared-element
        morphing transition.
      </p>
    </div>

    <button
      class="feature-card"
      id="openModal"
      type="button"
      aria-label="Open project details"
    >
      <div class="card-glow"></div>

      <div class="card-icon">
        ✦
      </div>

      <div class="card-content">
        <span>FEATURED</span>
        <h2>Creative Motion</h2>
        <p>Explore the interaction</p>
      </div>

      <div class="card-arrow">
        ↗
      </div>
    </button>

  </main>


  <div
    class="modal-overlay"
    id="modalOverlay"
    aria-hidden="true"
  >

    <section
      class="modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modalTitle"
    >

      <div class="modal-hero">

        <div class="modal-icon">
          ✦
        </div>

        <button
          class="close-button"
          id="closeModal"
          type="button"
          aria-label="Close modal"
        >
          ×
        </button>

      </div>

      <div class="modal-body">

        <span class="modal-label">
          FEATURED PROJECT
        </span>

        <h2 id="modalTitle">
          Creative Motion
        </h2>

        <p>
          A fluid modal interaction built around a shared-element
          inspired transition. The opening card visually transforms
          into the expanded dialog.
        </p>

        <div class="modal-actions">
          <button class="primary-button" type="button">
            Explore
          </button>

          <button
            class="secondary-button"
            id="modalCancel"
            type="button"
          >
            Cancel
          </button>
        </div>

      </div>

    </section>

  </div>

  <script src="script.js"></script>

</body>
</html>
