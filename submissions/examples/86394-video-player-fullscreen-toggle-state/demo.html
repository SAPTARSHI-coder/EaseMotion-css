<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Video Player Fullscreen Toggle</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="player-wrapper">
    <section class="video-player" id="videoPlayer">
      <div class="video-content">
        <span class="play-icon" aria-hidden="true">▶</span>
        <h1>Demo Video</h1>
        <p>Fullscreen toggle state demonstration</p>
      </div>

      <div class="controls">
        <button
          id="fullscreenButton"
          type="button"
          aria-pressed="false"
          aria-label="Enter fullscreen"
        >
          ⛶ Fullscreen
        </button>
      </div>
    </section>

    <p id="status" class="status" aria-live="polite">
      Fullscreen: Off
    </p>
  </main>

  <script>
    const player = document.querySelector("#videoPlayer");
    const button = document.querySelector("#fullscreenButton");
    const status = document.querySelector("#status");

    let isFullscreen = false;

    function toggleFullscreenState(currentState) {
      return !currentState;
    }

    function render() {
      player.classList.toggle("fullscreen", isFullscreen);

      button.setAttribute(
        "aria-pressed",
        String(isFullscreen)
      );

      button.setAttribute(
        "aria-label",
        isFullscreen
          ? "Exit fullscreen"
          : "Enter fullscreen"
      );

      button.textContent = isFullscreen
        ? "⛶ Exit Fullscreen"
        : "⛶ Fullscreen";

      status.textContent = `Fullscreen: ${
        isFullscreen ? "On" : "Off"
      }`;
    }

    button.addEventListener("click", () => {
      isFullscreen = toggleFullscreenState(isFullscreen);
      render();
    });

    render();
  </script>
</body>
</html>
