<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sticker Corner Peel Reveal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="wrapper">

    <h1>Sticker Corner Peel</h1>

    <p class="subtitle">
        Hover or focus the sticker to reveal the hidden coupon.
    </p>

    <label class="sticker">

        <input
            type="checkbox"
            class="sticker-toggle"
        >

        <div class="sticker-face">

            <h2>🎁 Limited Offer</h2>

            <p>
                Peel the corner to reveal today's exclusive discount.
            </p>

        </div>

        <div
            class="sticker-peel"
            aria-hidden="true">
        </div>

        <div class="hidden-content">

            <h3>Coupon</h3>

            <strong>EASE40</strong>

            <span>40% OFF</span>

        </div>

    </label>

</div>

</body>
</html>
