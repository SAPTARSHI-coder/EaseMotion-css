<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sticker Corner Peel Reveal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>Sticker Corner Peel Reveal</h1>

    <p class="subtitle">
        Hover over the card or use the checkbox to keep the corner peeled.
    </p>

    <label class="sticker">

        <input type="checkbox" class="sticker-toggle">

        <div class="sticker-content">
            <h2>🎉 Special Offer</h2>
            <p>
                Get <strong>30% OFF</strong> on your next purchase.
            </p>
        </div>

        <div class="sticker-hidden">
            <h3>Coupon Code</h3>
            <span>EASE30</span>
        </div>

        <div class="sticker-peel" aria-hidden="true"></div>

    </label>

</div>

</body>
</html>
