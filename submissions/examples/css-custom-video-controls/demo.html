<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Custom Video Controls</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="layout-container">
        
        <header class="section-header">
            <h1 class="title">CSS Video Player UI</h1>
            <p class="subtitle">A custom video controls overlay that elegantly reveals on hover, styled entirely with CSS.</p>
        </header>

        <div class="demo-area">
            
            <!-- 
               [TECHNIQUE 1] Video Container Overlay:
               The container wraps both the video and the custom controls. 
               We use CSS `:hover` on this container to slide the controls into view.
            -->
            <div class="video-container">
                <!-- A placeholder video (muted/looping for demo purposes) -->
                <video class="video-element" poster="https://picsum.photos/id/237/800/450" muted loop>
                    <!-- Fallback source -->
                    <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
                </video>

                <!-- 
                   The Custom CSS Controls Overlay
                   NOTE: While the UI and hover states are pure CSS, linking these 
                   custom buttons to the actual HTML5 Video API requires JavaScript.
                -->
                <div class="video-controls">
                    
                    <!-- Progress Bar (Custom styled input range) -->
                    <div class="progress-container">
                        <input type="range" class="progress-bar" min="0" max="100" value="35" aria-label="Seek Video">
                        <div class="progress-filled" style="width: 35%;"></div>
                    </div>
                    
                    <div class="controls-bottom">
                        <!-- Play/Pause Checkbox Hack for UI state -->
                        <div class="play-btn-wrapper">
                            <input type="checkbox" id="play-pause" class="play-toggle">
                            <label for="play-pause" class="control-btn play-label" aria-label="Play or Pause">
                                <!-- Play Icon -->
                                <svg class="icon-play" viewBox="0 0 24 24" width="24" height="24">
                                    <path fill="currentColor" d="M8 5v14l11-7z"/>
                                </svg>
                                <!-- Pause Icon -->
                                <svg class="icon-pause" viewBox="0 0 24 24" width="24" height="24">
                                    <path fill="currentColor" d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
                                </svg>
                            </label>
                        </div>
                        
                        <div class="time-display">
                            <span>01:23</span> / <span>03:45</span>
                        </div>
                        
                        <div class="spacer"></div>
                        
                        <!-- Volume Control -->
                        <div class="volume-container">
                            <button class="control-btn" aria-label="Mute">
                                <svg viewBox="0 0 24 24" width="24" height="24">
                                    <path fill="currentColor" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
                                </svg>
                            </button>
                            <input type="range" class="volume-slider" min="0" max="100" value="80" aria-label="Volume">
                        </div>
                        
                        <!-- Fullscreen -->
                        <button class="control-btn" aria-label="Fullscreen">
                            <svg viewBox="0 0 24 24" width="24" height="24">
                                <path fill="currentColor" d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
                            </svg>
                        </button>
                    </div>
                </div>
            </div>
            
            <p class="instruction-text">Hover over the video player to reveal the custom CSS controls.</p>
            
        </div>
    </div>

</body>
</html>
