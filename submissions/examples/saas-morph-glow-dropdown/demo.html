<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Morph-Glow Dropdown</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="saas-header">
        <div class="logo">SaaS<span>Flow</span></div>
        
        <nav class="main-nav">
            <a href="#" class="nav-link">Home</a>
            
            <!-- Morph-Glow Dropdown Container -->
            <div class="dropdown-container">
                <button class="nav-link dropdown-trigger">
                    Products
                    <span class="chevron">▼</span>
                </button>
                
                <!-- The Dropdown -->
                <div class="morph-dropdown">
                    <div class="dropdown-glow-bg"></div>
                    <div class="dropdown-content">
                        
                        <a href="#" class="dropdown-item">
                            <div class="item-icon data-icon"></div>
                            <div class="item-text">
                                <h4>Data Analytics</h4>
                                <p>Real-time insights and custom dashboards.</p>
                            </div>
                        </a>
                        
                        <a href="#" class="dropdown-item">
                            <div class="item-icon cloud-icon"></div>
                            <div class="item-text">
                                <h4>Cloud Storage</h4>
                                <p>Secure, distributed infrastructure.</p>
                            </div>
                        </a>
                        
                        <a href="#" class="dropdown-item">
                            <div class="item-icon secure-icon"></div>
                            <div class="item-text">
                                <h4>Security Suite</h4>
                                <p>Advanced threat protection and monitoring.</p>
                            </div>
                        </a>
                        
                        <div class="dropdown-footer">
                            <a href="#">View All Products →</a>
                        </div>
                    </div>
                </div>
            </div>
            
            <a href="#" class="nav-link">Pricing</a>
            <a href="#" class="nav-link">Docs</a>
        </nav>
        
        <div class="auth-buttons">
            <button class="login-btn">Log In</button>
            <button class="signup-btn">Get Started</button>
        </div>
    </header>
    
    <main class="hero-section">
        <h1>Build Faster, Scale Better.</h1>
        <p>The ultimate toolkit for modern software teams.</p>
    </main>
</body>
</html>
