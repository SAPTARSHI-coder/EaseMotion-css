<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Random Number Generator - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css"></head><body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030712; color: #ffffff;">

    <div class="ease-card ease-card-glass qrng-container">
        <div class="qrng-header">
            <h2>Quantum RNG</h2>
            <span class="ease-badge ease-badge-success">Generating</span>
        </div>
        
        <div class="qrng-screen ease-center">
            <div class="qrng-flux flux-qrng-a"></div>
            <div class="qrng-flux flux-qrng-b"></div>
            <div class="qrng-boundary-ring"></div>
            <div class="qrng-core ease-center"></div>
        </div>

        <div class="qrng-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Superposition Measurement &amp; Entropy</span>
            <button class="ease-btn ease-btn-success ease-btn-sm ease-hover-grow">Generate QRNG Bits</button>
        </div>
    </div></body></html>
