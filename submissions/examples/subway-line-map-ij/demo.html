<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-subway-line-map</title>
</head>
<body>
<main class="slm-card">
  <header class="slm-head">
    <h1 class="slm-title">Subway Map</h1>
    <span class="slm-line">Red Line</span>
  </header>
  <section class="slm-map" aria-label="subway line">
    <span class="slm-route"></span>
    <span class="slm-station slm-st-1">A</span>
    <span class="slm-station slm-st-2">B</span>
    <span class="slm-station slm-st-3">C</span>
    <span class="slm-station slm-st-4">D</span>
    <span class="slm-station slm-st-5">E</span>
    <span class="slm-station slm-st-6">F</span>
    <span class="slm-station slm-st-7">G</span>
    <span class="slm-station slm-st-8">H</span>
    <span class="slm-transfer slm-tr-1"></span>
    <span class="slm-transfer slm-tr-2"></span>
    <span class="slm-train"></span>
  </section>
  <section class="slm-next">
    <span class="slm-next-label">Next train</span>
    <strong class="slm-next-time">2 min</strong>
  </section>
  <footer class="slm-foot">
    <span class="slm-end">Union</span>
    <span class="slm-end">Airport</span>
  </footer>
</main>
</body>
</html>
