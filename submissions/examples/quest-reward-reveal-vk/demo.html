<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="CSS Quest Reward Reveal">
    <title>CSS Quest Reward Reveal</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="quest-demo">

        <section class="quest-content" aria-labelledby="quest-title">
            <p class="quest-eyebrow">Quest Complete</p>

            <h1 id="quest-title">Reward Unlocked</h1>

            <p class="quest-description">
                Hover or focus the chest to reveal your quest reward.
            </p>

            <div class="reward-scene">

                <button
                    class="reward-chest"
                    type="button"
                    aria-label="Open quest reward chest"
                >
                    <span class="reward-glow" aria-hidden="true"></span>

                    <span class="chest-lid" aria-hidden="true"></span>

                    <span class="chest-body" aria-hidden="true">
                        <span class="chest-lock"></span>
                    </span>

                    <span class="reward-badge" aria-hidden="true">
                        <span class="reward-star">★</span>
                        <span class="reward-text">REWARD</span>
                    </span>
                </button>

            </div>

            <p class="quest-hint">
                Hover or press Tab to open
            </p>

        </section>

    </main>

</body>
</html>
