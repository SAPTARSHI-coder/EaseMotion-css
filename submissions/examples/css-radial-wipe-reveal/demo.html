<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Radial Wipe Reveal | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <article class="demo-card">
      <header class="card-header">
        <h1 class="card-title">Dynamic Reveal</h1>
        <p class="card-subtitle">Pure CSS radial clip-path animation</p>
      </header>

      <!-- Accessible Radial Wipe Container -->
      <div 
        class="radial-wipe-container" 
        role="region" 
        aria-label="Radial wipe reveal container showcasing hidden content"
      >
        <div class="wipe-content-layer">
          <h2>Hello, World!</h2>
          <p>Revealed seamlessly with pure CSS motion.</p>
        </div>
        <div class="wipe-mask-layer" aria-hidden="true"></div>
      </div>

      <footer class="card-footer">
        <span class="badge">Clip-Path Wipe</span>
        <span>Infinite Loop Mode</span>
      </footer>
    </article>
  </main>
</body>
</html>
