<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Perspective Card — EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <p class="label">Pure CSS 3D Perspective Parallax Tilt Cards</p>
  <div class="demo-row">
    <!-- Left Tilt -->
    <div class="ease-perspective-card">
      <div class="ease-perspective-card__icon">🚀</div>
      <h3 class="ease-perspective-card__title">Parallax Left</h3>
      <p class="ease-perspective-card__desc">Hover over this card to view layered 3D depth and parallax translation.</p>
    </div>

    <!-- Right Tilt -->
    <div class="ease-perspective-card ease-perspective-card--right">
      <div class="ease-perspective-card__icon">🔮</div>
      <h3 class="ease-perspective-card__title">Parallax Right</h3>
      <p class="ease-perspective-card__desc">Rotates on the Y axis with elevated foreground items.</p>
    </div>

    <!-- Up Tilt -->
    <div class="ease-perspective-card ease-perspective-card--up">
      <div class="ease-perspective-card__icon">⚡</div>
      <h3 class="ease-perspective-card__title">Parallax Up</h3>
      <p class="ease-perspective-card__desc">Tilt upward rotation with distinct depth z-translation.</p>
    </div>
  </div>

</body>
</html>
