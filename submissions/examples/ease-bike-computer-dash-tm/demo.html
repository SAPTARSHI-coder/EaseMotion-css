<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bike Computer Dashboard | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bcwrap">
    <div class="bcunit">
      <div class="bcstatus">
        <span>RIDE 04</span>
        <span>14:32</span>
        <span>GPS OK</span>
      </div>
      <div class="bcspeed">
        <span class="bcspeed-num">28</span>
        <span class="bcspeed-unit">km/h</span>
      </div>
      <div class="bcgrid">
        <div class="bcmetric">
          <div class="bcmetric-label">Cadence</div>
          <span class="bcmetric-val">82</span>
          <span class="bcmetric-unit">rpm</span>
        </div>
        <div class="bcmetric">
          <div class="bcmetric-label">Heart</div>
          <span class="bcmetric-val">142</span>
          <span class="bcmetric-unit">bpm</span>
        </div>
        <div class="bcmetric">
          <div class="bcmetric-label">Power</div>
          <span class="bcmetric-val">210</span>
          <span class="bcmetric-unit">w</span>
        </div>
      </div>
      <div class="bcbar">
        <div class="bcbar-fill"></div>
      </div>
      <div class="bcbar-label">
        <span>12.4 / 19.2 km</span>
        <span>64%</span>
      </div>
    </div>
  </div>
</body>
</html>
