<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EaseMotion CSS — File Upload Dropzone Showcase</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="dz-demo-wrapper">
    <header class="dz-header">
      <span class="badge">UI Component Showcase</span>
      <h1>File Upload Drag &amp; Drop Zone</h1>
      <p>Interactive file upload dropzone featuring pulsing dashed border animations, upload icon lift transitions, and accessible file input binding.</p>
    </header>

    <main class="dz-card">
      <label class="ease-dropzone">
        <input type="file" class="dz-input" multiple>
        <div class="dz-content">
          <div class="dz-icon">☁️</div>
          <h3>Drag and drop files here</h3>
          <p>Support for PNG, JPG, SVG or PDF files up to 25MB</p>
          <span class="dz-btn">Browse Local Files</span>
        </div>
      </label>
    </main>

    <footer class="dz-footer">
      <p>EaseMotion CSS Component &bull; Submitted by @Ishita-Katiyar-06</p>
    </footer>
  </div>
</body>
</html>
