<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ease-icon-button — Demo</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { min-height: 100vh; background: #0f0f23; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2rem; font-family: system-ui, sans-serif; padding: 2rem; }
    h1 { color: #e0e0ff; font-size: 1.3rem; font-weight: 400; }
    .demo-row { display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; justify-content: center; }
    .demo-group { display: flex; flex-direction: column; align-items: center; gap: 0.5rem; }
    .demo-group span { font-size: 0.75rem; color: #8888cc; }
    .icon-btn { background: rgba(99,102,241,0.08); border-color: rgba(99,102,241,0.3); }
    .icon-btn-primary { --icon-btn-color: #6366f1; --icon-btn-bg-hover: rgba(99,102,241,0.15); }
    .icon-btn-danger { --icon-btn-color: #ef4444; --icon-btn-bg-hover: rgba(239,68,68,0.1); --icon-btn-bg-active: rgba(239,68,68,0.2); }
    .icon-btn-success { --icon-btn-color: #22c55e; --icon-btn-bg-hover: rgba(34,197,94,0.1); --icon-btn-bg-active: rgba(34,197,94,0.2); }
    .icon-btn-warning { --icon-btn-color: #f59e0b; --icon-btn-bg-hover: rgba(245,158,11,0.1); --icon-btn-bg-active: rgba(245,158,11,0.2); }
  </style>
</head>
<body>
  <h1>ease-icon-button</h1>
  <div class="demo-group">
    <div class="demo-row">
      <button class="icon-btn icon-btn-primary icon-btn-sm" title="Small">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12l5 5L20 7"/></svg>
      </button>
      <button class="icon-btn icon-btn-primary" title="Default">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12l5 5L20 7"/></svg>
      </button>
      <button class="icon-btn icon-btn-primary icon-btn-lg" title="Large">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12l5 5L20 7"/></svg>
      </button>
      <button class="icon-btn icon-btn-primary icon-btn-xl" title="Extra Large">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12l5 5L20 7"/></svg>
      </button>
    </div>
    <span>Sizes</span>
  </div>
  <div class="demo-group">
    <div class="demo-row">
      <button class="icon-btn icon-btn-danger" title="Delete">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>
      </button>
      <button class="icon-btn icon-btn-success" title="Add">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button class="icon-btn icon-btn-warning" title="Alert">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 9v4M12 17h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/></svg>
      </button>
      <button class="icon-btn icon-btn-primary icon-btn-spin" title="Refresh">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
      </button>
    </div>
    <span>Variants</span>
  </div>
  <div class="demo-group">
    <div class="demo-row">
      <button class="icon-btn icon-btn-primary icon-btn-pulse" title="Pulse">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>
      </button>
      <button class="icon-btn icon-btn-primary" title="With Badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 01-3.46 0"/></svg>
        <span class="icon-btn-badge">3</span>
      </button>
      <button class="icon-btn icon-btn-primary icon-btn-bounce" title="Bounce">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg>
      </button>
    </div>
    <span>States</span>
  </div>
</body>
</html>
