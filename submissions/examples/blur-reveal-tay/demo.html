<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Blur-to-Clear Reveal — EaseMotion CSS</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="demo-wrap">
    <header class="demo-header">
      <h1 class="blur-reveal-tay" style="--ease-delay: 0s;">Welcome to EaseMotion</h1>
      <p class="blur-reveal-tay" style="--ease-delay: 0.15s;">Smooth animations made simple.</p>
    </header>

    <section class="demo-grid">
      <div class="demo-card blur-reveal-tay" style="--ease-delay: 0.3s;">
        <h2>Card One</h2>
        <p>Blurs in from a soft, unfocused start into a crisp finish.</p>
      </div>
      <div class="demo-card blur-reveal-tay" style="--ease-delay: 0.45s;">
        <h2>Card Two</h2>
        <p>No JavaScript required — pure CSS keyframes.</p>
      </div>
      <div class="demo-card blur-reveal-tay" style="--ease-delay: 0.6s;">
        <h2>Card Three</h2>
        <p>Composable with any element: text, cards, or images.</p>
      </div>
    </section>

    <section class="demo-image-wrap">
      <img
        class="blur-reveal-tay"
        style="--ease-delay: 0.75s;"
        src="https://picsum.photos/600/300"
        alt="Randomly generated demo image revealing with a blur-to-clear transition"
      />
    </section>

    <button class="replay-btn" onclick="replayAnimation()">Replay Animation</button>
  </main>

  <script>
    function replayAnimation() {
      document.querySelectorAll('.blur-reveal-tay').forEach((el) => {
        el.classList.remove('blur-reveal-tay');
        void el.offsetWidth; // force reflow so the animation restarts
        el.classList.add('blur-reveal-tay');
      });
    }
  </script>

</body>
</html>
