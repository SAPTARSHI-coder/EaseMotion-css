<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro CRT Terminal | EaseMotion CSS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="crt-container">
        <!-- Monitor Frame -->
        <div class="monitor-bezel">
            <div class="monitor-brand">EASEMOTION-OS v9.0</div>
            
            <!-- Screen Area -->
            <div class="crt-screen">
                <!-- Hardware Overlays -->
                <div class="scanlines"></div>
                <div class="vignette"></div>
                <div class="flicker"></div>
                
                <!-- Terminal Content -->
                <div class="terminal-text">
                    <p class="line line-1">> BOOTING KERNEL...</p>
                    <p class="line line-2">> LOADING ANIMATION MODULES... [OK]</p>
                    <p class="line line-3">> MOUNTING 3D TRANSFORMS... [OK]</p>
                    <p class="line line-4">> BYPASSING JAVASCRIPT... [OK]</p>
                    <p class="line line-5">> SYSTEM READY<span class="cursor">_</span></p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
