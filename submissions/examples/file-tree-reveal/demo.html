<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>File Tree Reveal &mdash; EaseMotion CSS Demo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="page-head">
    <p class="kicker">EaseMotion CSS &middot; Dev Tools</p>
    <h1>File Tree Reveal</h1>
    <p class="sub">Your project structure, introduced node by node.</p>
  </header>
  <main class="stage">
    <div class="ft-tree">
      <div class="ft-node"><span class="ft-branch">&#9500;&#9472;</span> <span class="ft-folder">&#128193; src</span></div>
      <div class="ft-node"><span class="ft-branch">&#9500;&#9472;</span> <span class="ft-file">&#128196; main.js</span></div>
      <div class="ft-node"><span class="ft-branch">&#9492;&#9472;</span> <span class="ft-file ft-hot">&#128196; motion.css</span></div>
      <div class="ft-node"><span class="ft-branch">&#9500;&#9472;</span> <span class="ft-folder">&#128193; components</span></div>
      <div class="ft-node"><span class="ft-branch">&#9492;&#9472;</span> <span class="ft-file">&#128196; button.css</span></div>
      <div class="ft-node"><span class="ft-branch">&#9500;&#9472;</span> <span class="ft-folder">&#128193; assets</span></div>
      <div class="ft-node"><span class="ft-branch">&#9492;&#9472;</span> <span class="ft-file">&#128196; logo.svg</span></div>
      <div class="ft-node"><span class="ft-file">&#128196; index.html</span></div>
    </div>
  </main>
  <p class="stage-caption">Each row drops into its indentation slot.</p>
  <footer class="page-foot">
    <span>Pure CSS &middot; zero dependencies</span>
    <span>Tree cascade</span>
  </footer>
</body>
</html>
