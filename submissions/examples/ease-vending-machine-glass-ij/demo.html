<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.7">
<title>Vending Machine Glass</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="vend-kiosk">
  <header class="vend-head">
    <h1 class="vend-brand">SNACK DROP</h1>
    <p class="vend-price">$1.25</p>
  </header>
  <section class="vend-front" aria-label="Vending machine">
    <div class="vend-window">
      <div class="vend-shelf shelf-1">
        <span class="coil coil-a"></span>
        <span class="coil coil-b"></span>
        <span class="snack snack-a"></span>
        <span class="snack snack-b"></span>
        <span class="snack snack-c"></span>
      </div>
      <div class="vend-shelf shelf-2">
        <span class="coil coil-c"></span>
        <span class="coil coil-d"></span>
        <span class="snack snack-d"></span>
        <span class="snack snack-e"></span>
      </div>
    </div>
    <div class="vend-console">
      <button class="pad pad-1" type="button">B2</button>
      <button class="pad pad-2" type="button">D4</button>
      <span class="coin-slot"></span>
      <span class="vend-light"></span>
    </div>
  </section>
  <div class="vend-tray"></div>
  <footer class="vend-foot">
    <span class="vend-sold">SOLD OUT</span>
    <span class="vend-select">SELECT</span>
  </footer>
</main>
</body>
</html>
