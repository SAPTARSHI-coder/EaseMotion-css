<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subtle Elevate Widget</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <h1>Key Metrics</h1>
      <p class="subtitle">Subtle Elevate Variation</p>
    </header>

    <main class="dashboard-grid">
      <!-- Widget 1: Weekly Performance -->
      <a href="#" class="elevate-widget" aria-labelledby="widget1-title">
        <article class="widget-content">
          <header class="widget-header">
            <h2 id="widget1-title" class="widget-title">Weekly Performance</h2>
            <div class="status-badge" aria-label="Status: Updated Today">Updated today</div>
          </header>
          
          <div class="widget-body">
            <div class="primary-metric">84.6<span class="metric-unit">%</span></div>
            <div class="secondary-metric">
              <span class="trend-icon positive" aria-hidden="true">↑</span>
              <span class="trend-value">12.4%</span>
            </div>
          </div>
          
          <footer class="widget-footer">
            <p>Compared with last week</p>
          </footer>
        </article>
      </a>

      <!-- Widget 2: Server Workload -->
      <a href="#" class="elevate-widget" aria-labelledby="widget2-title">
        <article class="widget-content">
          <header class="widget-header">
            <h2 id="widget2-title" class="widget-title">Server Workload</h2>
            <div class="status-badge error" aria-label="Status: High Load">High Load</div>
          </header>
          
          <div class="widget-body">
            <div class="primary-metric">91.2<span class="metric-unit">%</span></div>
            <div class="secondary-metric">
              <span class="trend-icon warning" aria-hidden="true">↑</span>
              <span class="trend-value">4.1%</span>
            </div>
          </div>
          
          <footer class="widget-footer">
            <p>Capacity limits approaching</p>
          </footer>
        </article>
      </a>

      <!-- Widget 3: Active Connections -->
      <a href="#" class="elevate-widget" aria-labelledby="widget3-title">
        <article class="widget-content">
          <header class="widget-header">
            <h2 id="widget3-title" class="widget-title">Active Connections</h2>
            <div class="status-badge success" aria-label="Status: Stable">Stable</div>
          </header>
          
          <div class="widget-body">
            <div class="primary-metric">1,204</div>
            <div class="secondary-metric">
              <span class="trend-icon neutral" aria-hidden="true">−</span>
              <span class="trend-value">0.2%</span>
            </div>
          </div>
          
          <footer class="widget-footer">
            <p>Traffic normalized over 24h</p>
          </footer>
        </article>
      </a>
    </main>
  </div>
</body>
</html>
