<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slide-Up Stepper</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<section class="stepper-container">

    <h1>Project Roadmap</h1>

    <div class="stepper">

        <div class="step active">
            <div class="circle">1</div>
            <h3>Research</h3>
            <p>Requirement gathering and planning.</p>
        </div>

        <div class="step">
            <div class="circle">2</div>
            <h3>Design</h3>
            <p>Create wireframes and UI concepts.</p>
        </div>

        <div class="step">
            <div class="circle">3</div>
            <h3>Development</h3>
            <p>Implement responsive layouts.</p>
        </div>

        <div class="step">
            <div class="circle">4</div>
            <h3>Deployment</h3>
            <p>Launch and monitor performance.</p>
        </div>

    </div>

</section>

</body>
</html>
