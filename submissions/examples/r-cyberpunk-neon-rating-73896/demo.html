<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
        name="description"
        content="Cyberpunk neon CSS rating component"
    >
    <title>Cyberpunk Neon Rating</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="page">
        <div class="grid" aria-hidden="true"></div>
        <div class="glow glow-one" aria-hidden="true"></div>
        <div class="glow glow-two" aria-hidden="true"></div>

        <section
            class="rating-card"
            aria-labelledby="rating-title"
        >
            <div class="badge" aria-hidden="true">
                <span>RX</span>
            </div>

            <p class="eyebrow">Rating // Feedback</p>

            <h1 id="rating-title">
                Rate the <span>experience</span>
            </h1>

            <p class="description">
                Select your signal strength and transmit your feedback.
            </p>

            <fieldset class="rating">
                <legend class="sr-only">
                    Select a rating from one to five stars
                </legend>

                <input
                    type="radio"
                    id="star-5"
                    name="rating"
                    value="5"
                >
                <label for="star-5" title="5 out of 5 stars">
                    <span aria-hidden="true">★</span>
                    <span class="sr-only">5 stars</span>
                </label>

                <input
                    type="radio"
                    id="star-4"
                    name="rating"
                    value="4"
                >
                <label for="star-4" title="4 out of 5 stars">
                    <span aria-hidden="true">★</span>
                    <span class="sr-only">4 stars</span>
                </label>

                <input
                    type="radio"
                    id="star-3"
                    name="rating"
                    value="3"
                >
                <label for="star-3" title="3 out of 5 stars">
                    <span aria-hidden="true">★</span>
                    <span class="sr-only">3 stars</span>
                </label>

                <input
                    type="radio"
                    id="star-2"
                    name="rating"
                    value="2"
                >
                <label for="star-2" title="2 out of 5 stars">
                    <span aria-hidden="true">★</span>
                    <span class="sr-only">2 stars</span>
                </label>

                <input
                    type="radio"
                    id="star-1"
                    name="rating"
                    value="1"
                >
                <label for="star-1" title="1 out of 5 stars">
                    <span aria-hidden="true">★</span>
                    <span class="sr-only">1 star</span>
                </label>
            </fieldset>

            <div class="status" aria-hidden="true">
                <span class="status-dot"></span>
                <span>NEURAL LINK READY</span>
            </div>

            <p class="hint">
                Choose a star rating to transmit your feedback.
            </p>
        </section>
    </main>
</body>
</html>
