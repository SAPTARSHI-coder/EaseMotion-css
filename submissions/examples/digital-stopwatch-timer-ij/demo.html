<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-digital-stopwatch-timer demo</title>
</head>
<body>
<div class="dst-stopwatch">
  <div class="dst-face">
    <b class="dst-display">00:31.24</b>
    <div class="dst-modes">
      <span class="dst-mode">LAP</span>
      <span class="dst-mode">TIMER</span>
      <span class="dst-mode">ALARM</span>
    </div>
  </div>
  <div class="dst-crown"><span class="dst-notch"></span></div>
  <div class="dst-buttons">
    <button class="dst-start">START</button>
    <button class="dst-reset">RESET</button>
    <button class="dst-lap">LAP</button>
  </div>
</div>
</body>
</html>
