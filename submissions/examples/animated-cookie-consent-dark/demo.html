<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Animated Cookie Consent Banner (Dark Mode)</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="demo-wrapper">
    <h1>Page Content</h1>
    <p>Toggle the cookie consent banner using pure CSS via the target trigger below.</p>
    <a href="#cookie-banner" class="demo-trigger">Show Cookie Banner</a>
  </div>

  <aside class="cookie-banner" id="cookie-banner" role="dialog" aria-live="polite" aria-label="Cookie Consent Notice">
    <div class="cookie-content">
      <div class="cookie-text">
        <h2 class="cookie-title">We value your privacy</h2>
        <p class="cookie-description">
          We use cookies to enhance your browsing experience, serve personalized content, and analyze traffic.
        </p>
      </div>
      <div class="cookie-actions">
        <a href="#" class="cookie-btn cookie-btn-secondary" role="button">Reject All</a>
        <a href="#" class="cookie-btn cookie-btn-primary" role="button">Accept All</a>
      </div>
    </div>
  </aside>
</body>
</html>
