<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floating Modal | SaaS Modern</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <main class="modal-card" tabindex="0">
        <div class="modal-header">
            <div>
                <h1 id="modalTitle" class="modal-title">Upgrade Workspace</h1>
                <p class="modal-subtitle">Enter team details to unlock developer features.</p>
            </div>
            <button class="modal-close" aria-label="Close modal">&times;</button>
        </div>

        <div class="modal-body">
            <div class="modal-input-group">
                <label class="modal-label" for="workspaceName">Workspace Name</label>
                <input id="workspaceName" class="modal-input" type="text" value="Acme Corp Engineering" />
            </div>
            <div class="modal-input-group">
                <label class="modal-label" for="adminEmail">Billing Email</label>
                <input id="adminEmail" class="modal-input" type="email" value="admin@acme.dev" />
            </div>
        </div>

        <footer class="modal-footer">
            <button class="modal-btn secondary" type="button">Cancel</button>
            <button class="modal-btn primary" type="button">Confirm Upgrade</button>
        </footer>
    </main>
</div>

</body>
</html>
