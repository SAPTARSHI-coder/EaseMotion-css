<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ping Effect · radar pulse</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <div class="ping-container">
      <div class="ping-area" id="pingArea">
        <!-- Ping Rings -->
        <div class="ping-ring" id="pingRing1"></div>
        <div class="ping-ring" id="pingRing2"></div>
        <div class="ping-ring" id="pingRing3"></div>
        
        <!-- Ping Center -->
        <div class="ping-center" id="pingCenter">
          <div class="ping-dot"></div>
          <div class="ping-icon">📡</div>
        </div>
        
        <!-- Ping Label -->
        <div class="ping-label" id="pingLabel">Click to ping</div>
      </div>
      
      <div class="ping-status">
        <span id="pingStatus">🟢 Ready</span>
        <span id="pingCounter">Pings: 0</span>
      </div>
    </div>

    <div class="controls">
      <button class="btn btn-ping" id="pingBtn">📡 Ping!</button>
      <button class="btn btn-mode" id="modeBtn">🔄 Toggle Mode</button>
      <button class="btn btn-reset" id="resetBtn">⟳ Reset</button>
    </div>
    <div class="footer-note">
      <span>📡 click to ping · radar expands outward · 3 modes available</span>
    </div>
  </div>

  <script>
    (function() {
      "use strict";

      // DOM refs
      const pingArea = document.getElementById('pingArea');
      const pingCenter = document.getElementById('pingCenter');
      const pingLabel = document.getElementById('pingLabel');
      const pingStatus = document.getElementById('pingStatus');
      const pingCounter = document.getElementById('pingCounter');
      const pingBtn = document.getElementById('pingBtn');
      const modeBtn = document.getElementById('modeBtn');
      const resetBtn = document.getElementById('resetBtn');
      
      const ring1 = document.getElementById('pingRing1');
      const ring2 = document.getElementById('pingRing2');
      const ring3 = document.getElementById('pingRing3');

      // State
      let pingCount = 0;
      let mode = 'standard'; // standard, double, triple
      let isPinging = false;

      // Mode configurations
      const modes = {
        standard: {
          label: 'Standard',
          icon: '📡',
          rings: 1,
          color: '#6366f1',
          description: 'Single pulse'
        },
        double: {
          label: 'Double',
          icon: '📡📡',
          rings: 2,
          color: '#8b5cf6',
          description: 'Double pulse'
        },
        triple: {
          label: 'Triple',
          icon: '📡📡📡',
          rings: 3,
          color: '#ec4899',
          description: 'Triple pulse'
        }
      };

      // Create ping effect
      function createPing(x, y) {
        if (isPinging) return;
        isPinging = true;

        // Get the mode configuration
        const modeConfig = modes[mode];
        const ringCount = modeConfig.rings;

        // Increment ping counter
        pingCount++;
        pingCounter.textContent = `Pings: ${pingCount}`;

        // Update status
        pingStatus.textContent = `📡 Pinging... (${modeConfig.label})`;
        pingStatus.style.color = modeConfig.color;

        // Animate center
        pingCenter.classList.add('ping-active');
        setTimeout(() => {
          pingCenter.classList.remove('ping-active');
        }, 300);

        // Create rings with delay
        const rings = [];
        for (let i = 0; i < ringCount; i++) {
          setTimeout(() => {
            const ring = document.createElement('div');
            ring.className = 'ping-ring-effect';
            ring.style.left = '50%';
            ring.style.top = '50%';
            ring.style.borderColor = modeConfig.color;
            ring.style.boxShadow = `0 0 30px ${modeConfig.color}44, inset 0 0 30px ${modeConfig.color}22`;
            
            // Random size variation for natural feel
            const sizeVariation = 1 + (Math.random() - 0.5) * 0.2;
            const baseSize = 200;
            const size = baseSize * sizeVariation;
            ring.style.width = size + 'px';
            ring.style.height = size + 'px';
            ring.style.marginLeft = -(size/2) + 'px';
            ring.style.marginTop = -(size/2) + 'px';
            
            // Random animation duration
            const duration = 1.2 + Math.random() * 0.4;
            ring.style.animationDuration = duration + 's';
            
            // Random opacity
            ring.style.opacity = 0.6 + Math.random() * 0.4;
            
            pingArea.appendChild(ring);
            
            // Remove ring after animation
            setTimeout(() => {
              ring.remove();
            }, duration * 1000 + 100);
          }, i * 300);
        }

        // Update label
        pingLabel.textContent = `📍 Ping! (${modeConfig.label})`;
        pingLabel.style.color = modeConfig.color;

        // Reset ping state after animation
        setTimeout(() => {
          isPinging = false;
          pingStatus.textContent = '🟢 Ready';
          pingStatus.style.color = '#94a3b8';
          pingLabel.textContent = 'Click to ping';
          pingLabel.style.color = '#94a3b8';
        }, 2500);
      }

      // Handle ping at specific position
      function handlePing(e) {
        if (isPinging) return;
        
        // Get click position relative to ping area
        const rect = pingArea.getBoundingClientRect();
        const x = ((e.clientX - rect.left) / rect.width) * 100;
        const y = ((e.clientY - rect.top) / rect.height) * 100;
        
        // Position the ping center at click point
        pingCenter.style.left = x + '%';
        pingCenter.style.top = y + '%';
        pingCenter.style.transform = 'translate(-50%, -50%)';
        
        // Trigger ping
        createPing(x, y);
      }

      // Toggle mode
      function toggleMode() {
        const modeKeys = ['standard', 'double', 'triple'];
        const currentIndex = modeKeys.indexOf(mode);
        const nextIndex = (currentIndex + 1) % modeKeys.length;
        mode = modeKeys[nextIndex];
        
        const modeConfig = modes[mode];
        modeBtn.innerHTML = `🔄 ${modeConfig.icon} ${modeConfig.label}`;
        pingLabel.textContent = `Mode: ${modeConfig.label} (${modeConfig.description})`;
        pingLabel.style.color = modeConfig.color;
        
        // Update ring colors
        ring1.style.borderColor = modeConfig.color;
        ring1.style.boxShadow = `0 0 30px ${modeConfig.color}44, inset 0 0 30px ${modeConfig.color}22`;
        
        if (ring2) {
          ring2.style.borderColor = modeConfig.color;
          ring2.style.boxShadow = `0 0 25px ${modeConfig.color}44, inset 0 0 25px ${modeConfig.color}22`;
        }
        
        if (ring3) {
          ring3.style.borderColor = modeConfig.color;
          ring3.style.boxShadow = `0 0 20px ${modeConfig.color}44, inset 0 0 20px ${modeConfig.color}22`;
        }
        
        // Update status
        pingStatus.textContent = `🔄 Mode: ${modeConfig.label}`;
        pingStatus.style.color = modeConfig.color;
        
        setTimeout(() => {
          pingStatus.textContent = '🟢 Ready';
          pingStatus.style.color = '#94a3b8';
          pingLabel.textContent = 'Click to ping';
          pingLabel.style.color = '#94a3b8';
        }, 1500);
      }

      // Reset everything
      function resetPing() {
        // Remove all effect rings
        document.querySelectorAll('.ping-ring-effect').forEach(el => el.remove());
        
        // Reset ping count
        pingCount = 0;
        pingCounter.textContent = 'Pings: 0';
        
        // Reset position
        pingCenter.style.left = '50%';
        pingCenter.style.top = '50%';
        pingCenter.style.transform = 'translate(-50%, -50%)';
        
        // Reset status
        pingStatus.textContent = '🟢 Reset';
        pingStatus.style.color = '#94a3b8';
        pingLabel.textContent = 'Click to ping';
        pingLabel.style.color = '#94a3b8';
        
        isPinging = false;
        
        setTimeout(() => {
          pingStatus.textContent = '🟢 Ready';
        }, 1000);
      }

      // Event listeners
      pingArea.addEventListener('click', handlePing);

      if (pingBtn) {
        pingBtn.addEventListener('click', function(e) {
          e.preventDefault();
          // Ping from center
          pingCenter.style.left = '50%';
          pingCenter.style.top = '50%';
          pingCenter.style.transform = 'translate(-50%, -50%)';
          createPing(50, 50);
        });
      }

      if (modeBtn) {
        modeBtn.addEventListener('click', function(e) {
          e.preventDefault();
          toggleMode();
        });
      }

      if (resetBtn) {
        resetBtn.addEventListener('click', function(e) {
          e.preventDefault();
          resetPing();
        });
      }

      // Keyboard shortcuts
      document.addEventListener('keydown', function(e) {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

        const key = e.key;
        if (key === ' ' || key === 'Space') {
          e.preventDefault();
          pingBtn.click();
        } else if (key === 'm' || key === 'M') {
          e.preventDefault();
          toggleMode();
        } else if (key === 'r' || key === 'R') {
          e.preventDefault();
          resetPing();
        }
      });

      // Initialize
      const initialMode = modes.standard;
      ring1.style.borderColor = initialMode.color;
      ring1.style.boxShadow = `0 0 30px ${initialMode.color}44, inset 0 0 30px ${initialMode.color}22`;
      
      console.log('📡 Ping Effect ready · shortcuts: [Space] Ping, [M] Mode, [R] Reset');
    })();
  </script>
</body>
</html>
