<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Widget: Gradient Shimmer - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="em-widget-page">
        <!-- Pure CSS Dashboard Widget Component -->
        <div class="em-card" role="region" aria-label="Gradient Shimmer Dashboard Widget Showcase" tabindex="0">
            <span class="em-card-badge">DASHBOARD WIDGETS</span>
            <h1 class="em-card-title">Gradient Shimmer</h1>
            <p class="em-card-desc">A smooth, hardware-accelerated pure CSS dashboard widget featuring dynamic gradient shimmer loading and dark mode compatibility.</p>
            
            <!-- Shimmer Loading Bars Mockup -->
            <div class="em-shimmer-container" aria-hidden="true">
                <div class="em-shimmer-line em-line-lg"></div>
                <div class="em-shimmer-line em-line-md"></div>
                <div class="em-shimmer-line em-line-sm"></div>
            </div>

            <a href="#" class="em-card-btn" role="button">Refresh Widget</a>
        </div>
    </div>
</body>
</html>
