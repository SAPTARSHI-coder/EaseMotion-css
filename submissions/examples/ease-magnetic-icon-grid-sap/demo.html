<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Magnetic Icon Grid</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <h1>Magnetic Icon Grid</h1>

    <div class="magnetic-grid">
      <button class="magnetic-item">✨</button>
      <button class="magnetic-item">🚀</button>
      <button class="magnetic-item">🎨</button>
      <button class="magnetic-item">🔧</button>
      <button class="magnetic-item">📦</button>
      <button class="magnetic-item">💡</button>
    </div>

    <p class="hint">Move your mouse near an icon — it pulls toward the cursor.</p>
  </main>

  <script>
    const items = document.querySelectorAll('.magnetic-item');
    const RADIUS = 60;
    const STRENGTH = 0.35;

    items.forEach(item => {
      item.addEventListener('mousemove', (e) => {
        const rect = item.getBoundingClientRect();
        const x = e.clientX - rect.left - rect.width / 2;
        const y = e.clientY - rect.top - rect.height / 2;
        item.style.transform = `translate(${x * STRENGTH}px, ${y * STRENGTH}px)`;
      });

      item.addEventListener('mouseleave', () => {
        item.style.transform = 'translate(0, 0)';
      });
    });
  </script>
</body>
</html>
