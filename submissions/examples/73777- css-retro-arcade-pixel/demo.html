<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Retro Arcade Pixel Background</title>

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="arcade-background">
    <div class="pixel-grid" aria-hidden="true"></div>

    <div class="arcade-content">
      <p class="eyebrow">EASEMOTION CSS</p>

      <h1>RETRO ARCADE</h1>

      <p class="description">
        A pure CSS pixel-inspired animated background.
      </p>

      <button class="arcade-button" type="button">
        START GAME
      </button>
    </div>

    <div class="pixel-stars" aria-hidden="true">
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
    </div>
  </main>
</body>
</html>
