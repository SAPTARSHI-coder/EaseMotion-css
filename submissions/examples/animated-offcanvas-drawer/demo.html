<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Offcanvas Drawer (Dark Mode) - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="em-app-container">
        <!-- Zero-JS Checkbox Hack for Offcanvas Drawer Toggle -->
        <input type="checkbox" id="em-drawer-toggle" class="em-drawer-checkbox" aria-hidden="true">
        
        <!-- Top Navigation Bar -->
        <header class="em-top-nav">
            <div class="em-nav-left">
                <label for="em-drawer-toggle" class="em-drawer-btn" role="button" aria-label="Toggle navigation menu" tabindex="0">
                    <span class="em-hamburger-line"></span>
                    <span class="em-hamburger-line"></span>
                    <span class="em-hamburger-line"></span>
                </label>
                <span class="em-brand-title">EaseMotion UI</span>
            </div>
            <span class="em-badge">DARK MODE</span>
        </header>

        <!-- Backdrop Overlay -->
        <label for="em-drawer-toggle" class="em-backdrop" aria-hidden="true"></label>

        <!-- Offcanvas Drawer Panel -->
        <aside class="em-offcanvas-drawer" role="navigation" aria-label="Main Navigation Drawer">
            <div class="em-drawer-header">
                <h2 class="em-drawer-title">Navigation Menu</h2>
                <label for="em-drawer-toggle" class="em-close-btn" role="button" aria-label="Close menu" tabindex="0">&times;</label>
            </div>
            <ul class="em-drawer-links" role="menubar">
                <li role="none"><a href="#home" role="menuitem" tabindex="0">Dashboard Overview</a></li>
                <li role="none"><a href="#components" role="menuitem" tabindex="0">UI Components</a></li>
                <li role="none"><a href="#animations" role="menuitem" tabindex="0">Motion Library</a></li>
                <li role="none"><a href="#settings" role="menuitem" tabindex="0">System Settings</a></li>
            </ul>
        </aside>

        <!-- Main Content Showcase -->
        <main class="em-main-content">
            <div class="em-hero-card" role="region" aria-label="Offcanvas Drawer Showcase" tabindex="0">
                <span class="em-demo-tag">COMPONENT // OFFCANVAS DRAWER</span>
                <h1 class="em-hero-title">Animated Offcanvas Drawer</h1>
                <p class="em-hero-desc">Zero-JS, fully accessible offcanvas drawer featuring smooth hardware-accelerated transitions and dark mode styling.</p>
                <label for="em-drawer-toggle" class="em-action-btn" autofocus>OPEN DRAWER MENU</label>
            </div>
        </main>
    </div>
</body>
</html>
