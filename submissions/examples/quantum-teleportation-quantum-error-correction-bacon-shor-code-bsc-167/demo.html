<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bacon Shor Code BSC - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css"></head><body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030712; color: #ffffff;">

    <div class="ease-card ease-card-glass bsc-container">
        <div class="bsc-header">
            <h2>Bacon-Shor Code</h2>
            <span class="ease-badge ease-badge-primary">Quantum Error Correction</span>
        </div>
        
        <div class="bsc-screen ease-center">
            <div class="bsc-flux flux-bsc-a"></div>
            <div class="bsc-flux flux-bsc-b"></div>
            <div class="bsc-boundary-ring"></div>
            <div class="bsc-core ease-center"></div>
        </div>

        <div class="bsc-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Subsystem Codes &amp; Two-Body Measurements</span>
            <button class="ease-btn ease-btn-primary ease-btn-sm ease-hover-grow">Run Bacon-Shor Code</button>
        </div>
    </div></body></html>
