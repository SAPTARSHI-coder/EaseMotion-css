<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ease-animated-battery-indicator-sap demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { height: 100vh; margin: 0; display: flex; flex-direction: column; gap: 16px; align-items: center; justify-content: center; background: #f4f4f5; }
    button { padding: 8px 16px; border-radius: 8px; border: none; background: #111; color: #fff; cursor: pointer; }
  </style>
</head>
<body>
  <div class="battery-sap">
    <div class="battery-body"><div class="battery-fill" id="fill"></div></div>
    <span class="battery-label" id="label">0%</span>
  </div>
  <button id="chargeBtn">Simulate Charging</button>
  <script>
    const fill = document.getElementById('fill');
    const label = document.getElementById('label');

    function setLevel(pct) {
      fill.style.width = pct + '%';
      fill.classList.toggle('low', pct <= 20);
      label.textContent = pct + '%';
    }

    document.getElementById('chargeBtn').addEventListener('click', () => {
      setLevel(Math.floor(Math.random() * 100));
    });

    setLevel(15);
  </script>
</body>
</html>
