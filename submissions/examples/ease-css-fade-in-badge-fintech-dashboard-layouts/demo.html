<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
Fade-In Badge - Fintech Dashboard Layout
</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<main class="dashboard">


<section class="hero">


<div class="badge">
    VERIFIED FINTECH
</div>


<h1>
    Fade-In
    <span>Dashboard Badge</span>
</h1>


<p>
    Modern animated status badges
    for financial dashboard interfaces.
</p>


</section>



<section class="stats">


<article class="card">


<div class="icon">
💰
</div>


<h2>
Revenue
</h2>


<p>
Monthly earnings overview.
</p>


<span class="status">

Active

</span>


</article>




<article class="card">


<div class="icon">
📈
</div>


<h2>
Growth
</h2>


<p>
Track investment performance.
</p>


<span class="status">

+24.5%

</span>


</article>




<article class="card">


<div class="icon">
🔒
</div>


<h2>
Security
</h2>


<p>
Protected transactions.
</p>


<span class="status">

Secure

</span>


</article>


</section>



</main>


</body>

</html>
