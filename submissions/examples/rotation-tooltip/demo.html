<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rotation Tooltip Demo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #fdfdfd;">

    <div style="text-align: center;">
        <h2 style="color: #222; margin-bottom: 50px;">Rotation Tooltip Animation Snippet</h2>
        
        <!-- Interactive Tooltip Container -->
        <div class="tooltip-container" style="position: relative; display: inline-block; cursor: pointer; padding: 12px 24px; background: #007bff; color: white; border-radius: 6px; font-weight: bold;">
            Hover Over Me
            <!-- Hidden Tooltip Element -->
            <span class="tooltip-box" style="position: absolute; bottom: 125%; left: 50%; transform: translateX(-50%) scale(0.8) rotate(-5deg); opacity: 0; background: #222; color: #fff; padding: 8px 14px; border-radius: 6px; font-size: 14px; white-space: nowrap; transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275); pointer-events: none; box-shadow: 0 4px 10px rgba(0,0,0,0.15);">
                ✨ Dynamic Micro-Interaction!
            </span>
        </div>
    </div>

</body>
</html>
