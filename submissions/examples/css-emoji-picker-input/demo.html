<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CSS Emoji Picker Input</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<main class="container">

<h1>Emoji Picker Input</h1>

<div class="emoji-box">

<input 
type="text"
placeholder="Type your message..."
aria-label="Message input"
>

<div class="picker">

<button 
class="emoji-btn"
aria-label="Open emoji picker">
😊
</button>

<div class="emoji-panel">

<span>😀</span>
<span>😍</span>
<span>🔥</span>
<span>🚀</span>
<span>🎉</span>
<span>❤️</span>
<span>👍</span>
<span>😎</span>

</div>

</div>

</div>

</main>

</body>
</html>
