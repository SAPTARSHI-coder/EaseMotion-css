<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blacksmith Quench Steam — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Blacksmith Quench Steam demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Blacksmith Quench Steam</h1>
      <p class="lede">Hot blade quenched in water with rising steam plume</p>
    </header>

    <section class="ease-blacksmith-quench-steam" data-demo="blacksmith-quench-steam" aria-live="polite">
      <div class="ease-blacksmith-quench-steam__housing">
        <div class="ease-blacksmith-quench-steam__bezel">
          <div class="ease-blacksmith-quench-steam__face">
            <div class="ease-blacksmith-quench-steam__readout">
              <span class="ease-blacksmith-quench-steam__label">Blacksmith Quench Steam</span>
              <span class="ease-blacksmith-quench-steam__value">LIVE</span>
            </div>
            <div class="ease-blacksmith-quench-steam__motion" aria-hidden="true">
              <span class="ease-blacksmith-quench-steam__a"></span>
              <span class="ease-blacksmith-quench-steam__b"></span>
              <span class="ease-blacksmith-quench-steam__c"></span>
              <span class="ease-blacksmith-quench-steam__d"></span>
            </div>
            <div class="ease-blacksmith-quench-steam__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-blacksmith-quench-steam__controls">
          <button type="button" class="ease-blacksmith-quench-steam__btn primary">Engage</button>
          <button type="button" class="ease-blacksmith-quench-steam__btn">Reset</button>
          <label class="ease-blacksmith-quench-steam__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-blacksmith-quench-steam__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
