<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EaseMotion Toast Notification Demo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <h1>EaseMotion Toast System</h1>
        <p>Click the buttons below to trigger notifications.</p>
        
        <div class="button-group">
            <button id="btn-success" class="btn btn-success">Success Toast</button>
            <button id="btn-error" class="btn btn-error">Error Toast</button>
            <button id="btn-warning" class="btn btn-warning">Warning Toast</button>
            <button id="btn-info" class="btn btn-info">Info Toast</button>
        </div>
    </main>

    <!-- The container where toasts will be injected -->
    <div id="toast-container" class="toast-container" aria-live="polite"></div>

    <script src="script.js"></script>
</body>
</html>
