<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ease-count-up-bh</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #0f172a; min-height: 100vh; padding: 2rem; color: #f1f5f9; }
    .container { max-width: 1000px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 3rem; padding: 2rem; background: rgba(30, 41, 59, 0.8); border-radius: 1rem; }
    header h1 { font-size: 2rem; font-weight: 700; background: linear-gradient(135deg, #fbbf24, #f59e0b); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 0.5rem; }
    header p { color: #94a3b8; }
    .demo-section { background: rgba(30, 41, 59, 0.8); border: 1px solid rgba(148, 163, 184, 0.1); border-radius: 1rem; padding: 2rem; margin-bottom: 2rem; }
    .demo-section h2 { font-size: 1.25rem; margin-bottom: 1.5rem; color: #e2e8f0; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>ease-count-up-bh</h1>
      <p>CSS-based Animated Number Count-Up Effect</p>
    </header>
    
    <section class="demo-section">
      <h2>Count-Up Examples</h2>
      <div class="ease-stats-grid-bh">
        <div class="ease-count-card-bh">
          <span class="ease-count-up-bh ease-count-up-bh-primary" data-target="100" data-suffix="%">0</span>
          <div class="ease-count-label-bh">Customer Satisfaction</div>
        </div>
        
        <div class="ease-count-card-bh">
          <span class="ease-count-up-bh ease-count-up-bh-success" data-target="500" data-suffix="+">0</span>
          <div class="ease-count-label-bh">Projects Completed</div>
        </div>
        
        <div class="ease-count-card-bh">
          <span class="ease-count-up-bh ease-count-up-bh-cyan" data-target="99" data-suffix="">0</span>
          <div class="ease-count-label-bh">Uptime Percentage</div>
        </div>
        
        <div class="ease-count-card-bh">
          <span class="ease-count-up-bh ease-count-up-bh-warning" data-target="2500" data-suffix="+">0</span>
          <div class="ease-count-label-bh">Happy Clients</div>
        </div>
      </div>
    </section>
    
    <section class="demo-section">
      <h2>Size Variants</h2>
      <div class="ease-stats-grid-bh">
        <div>
          <span class="ease-count-up-bh ease-count-up-bh-sm ease-count-up-bh-primary" data-target="100" data-suffix="%">0</span>
          <p style="color: #94a3b8; font-size: 0.875rem;">Small</p>
        </div>
        <div>
          <span class="ease-count-up-bh ease-count-up-bh-lg ease-count-up-bh-primary" data-target="500" data-suffix="+">0</span>
          <p style="color: #94a3b8; font-size: 0.875rem;">Large</p>
        </div>
        <div>
          <span class="ease-count-up-bh ease-count-up-bh-xl ease-count-up-bh-primary" data-target="10000" data-suffix="">0</span>
          <p style="color: #94a3b8; font-size: 0.875rem;">Extra Large</p>
        </div>
      </div>
    </section>
    
    <section class="demo-section">
      <h2>With Gradient</h2>
      <div class="ease-count-up-bh ease-count-up-bh-gradient ease-count-up-bh-xl" style="display: block; text-align: center;" data-target="365" data-suffix=" days">0</div>
    </section>
  </div>
  
  <script>
    // Simple count-up animation
    function animateCount(el) {
      const target = parseInt(el.dataset.target);
      const duration = 2000;
      const start = performance.now();
      
      function update(currentTime) {
        const elapsed = currentTime - start;
        const progress = Math.min(elapsed / duration, 1);
        const easeOut = 1 - Math.pow(1 - progress, 3);
        const current = Math.floor(easeOut * target);
        el.textContent = current.toLocaleString();
        
        if (progress < 1) {
          requestAnimationFrame(update);
        } else {
          el.textContent = target.toLocaleString();
        }
      }
      
      requestAnimationFrame(update);
    }
    
    // Intersection Observer to trigger animation
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          animateCount(entry.target);
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.5 });
    
    document.querySelectorAll('.ease-count-up-bh').forEach(el => {
      observer.observe(el);
    });
  </script>
</body>
</html>
