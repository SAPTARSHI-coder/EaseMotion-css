<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Skew Active Tooltip</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <button class="tooltip-btn">
        Hover Me
        <span class="tooltip">Creative Portfolio</span>
    </button>

    <button class="tooltip-btn success">
        HTML
        <span class="tooltip">Pure HTML & CSS</span>
    </button>

    <button class="tooltip-btn warning">
        Accessibility
        <span class="tooltip">Reduced Motion Supported</span>
    </button>

</div>

</body>
</html>
