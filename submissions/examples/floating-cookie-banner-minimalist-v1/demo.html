<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Floating Cookie Banner with Minimalist styling"
  >

  <title>Floating Cookie Banner</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="page">
    <section class="demo-content" aria-labelledby="demo-title">
      <span class="eyebrow">EASEMOTION CSS</span>

      <h1 id="demo-title">
        Minimalist Cookie Banner
      </h1>

      <p>
        A responsive floating cookie consent component built entirely
        with HTML and CSS.
      </p>
    </section>
  </main>

  <aside
    class="cookie-banner"
    aria-label="Cookie consent"
  >
    <div class="cookie-content">
      <div class="cookie-icon" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
      </div>

      <div class="cookie-copy">
        <h2>We value your privacy</h2>

        <p>
          We use cookies to improve your experience, analyze traffic,
          and personalize content. You can choose which cookies
          you allow.
        </p>

        <a href="#" class="cookie-link">
          Privacy Policy
        </a>
      </div>
    </div>

    <div class="cookie-actions">
      <button
        type="button"
        class="cookie-button cookie-button-secondary"
      >
        Manage
      </button>

      <button
        type="button"
        class="cookie-button cookie-button-primary"
      >
        Accept
      </button>
    </div>
  </aside>
</body>
</html>
