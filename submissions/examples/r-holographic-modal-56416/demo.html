<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Holographic Modal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<input type="checkbox" id="modal-toggle" hidden>

<section class="hero">

    <h1>Gaming Hub</h1>

    <p>
        Discover a futuristic Holographic Modal built entirely with HTML and CSS.
    </p>

    <label for="modal-toggle" class="open-btn">
        Activate Portal
    </label>

</section>

<div class="overlay">

    <div class="modal">

        <label for="modal-toggle" class="close-btn">&times;</label>

        <div class="icon">🛸</div>

        <h2>Portal Activated</h2>

        <p>
            A holographic gateway has opened. Your next legendary adventure awaits.
        </p>

        <label for="modal-toggle" class="action-btn">
            Enter Portal
        </label>

    </div>

</div>

</body>
</html>
