<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fade-In Modal</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        margin: 0;
        background: #0f172a;
        font-family: system-ui, sans-serif;
        gap: 1rem;
      }
      body::before {
        content: "Click the button to open the modal";
        color: #64748b;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <input type="checkbox" id="mdl" class="fade-in-modal__toggle" />
    <label for="mdl" class="fade-in-modal__trigger">Launch</label>
    <div class="fade-in-modal" role="dialog" aria-modal="true">
      <div class="fade-in-modal__content">
        <label for="mdl" class="fade-in-modal__close">&times;</label>
        <h2>New High Score</h2>
        <p>You scored 9,999 points!</p>
      </div>
    </div>
  </body>
</html>
