<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ease Skew Progress Bar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="ease-skew-container">
    <div style="color: #94a3b8; font-size: 0.875rem; margin-bottom: 0.5rem; font-weight: 600; text-transform: uppercase; transform: skewX(-15deg); margin-left: 10px;">System Load <span style="color: #3b82f6;">75%</span></div>
    <div class="ease-progress-track">
      <div class="ease-progress-fill"></div>
    </div>
  </div>
</body>
</html>
