<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Scramble Text Effect</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="layout-container">
        
        <header class="section-header">
            <h1 class="title">Pure CSS Scramble Text</h1>
            <p class="subtitle">A cyberpunk-style text decoding effect built entirely without JavaScript.</p>
        </header>

        <div class="demo-area">
            
            <div class="scramble-card">
                <h2>Access Terminal</h2>
                
                <div class="data-row">
                    <span class="label">Status:</span>
                    <!-- The scramble text element -->
                    <span class="scramble-text" data-final="ENCRYPTED">ENCRYPTED</span>
                </div>
                
                <div class="data-row">
                    <span class="label">Clearance:</span>
                    <span class="scramble-text" data-final="LEVEL 5">LEVEL 5</span>
                </div>

                <div class="data-row">
                    <span class="label">Target:</span>
                    <span class="scramble-text" data-final="MAINFRAME">MAINFRAME</span>
                </div>
                
                <button class="decode-btn">Hover to Decode</button>
            </div>
            
        </div>
    </div>

</body>
</html>
