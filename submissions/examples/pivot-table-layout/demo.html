<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CSS Pivot Table Layout</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="wrapper">

<h1>Sales Pivot Table</h1>

<div class="table-container">

<table aria-label="Sales pivot table">

<thead>

<tr>
<th>Region</th>
<th>Q1</th>
<th>Q2</th>
<th>Q3</th>
<th>Q4</th>
<th>Total</th>
</tr>

</thead>


<tbody>

<tr>
<td>North</td>
<td>$1200</td>
<td>$1800</td>
<td>$1500</td>
<td>$2100</td>
<td class="total">$6600</td>
</tr>


<tr>
<td>South</td>
<td>$900</td>
<td>$1300</td>
<td>$1700</td>
<td>$2000</td>
<td class="total">$5900</td>
</tr>


<tr>
<td>East</td>
<td>$1500</td>
<td>$1900</td>
<td>$2200</td>
<td>$2400</td>
<td class="total">$8000</td>
</tr>


<tr>
<td>West</td>
<td>$1100</td>
<td>$1600</td>
<td>$1800</td>
<td>$2300</td>
<td class="total">$6800</td>
</tr>


</tbody>


<tfoot>

<tr>
<th>Total</th>
<th>$4700</th>
<th>$6600</th>
<th>$7200</th>
<th>$8800</th>
<th>$27300</th>
</tr>

</tfoot>


</table>

</div>

</div>

</body>
</html>
