<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EaseMotion CSS - Heart Rate Monitor Display</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="ease-ekg-monitor" role="img" aria-label="Animated EKG Heart Rate Monitor">
    <svg class="ease-ekg-line" viewBox="0 0 1000 250" preserveAspectRatio="none">
      <!-- Custom Heartbeat Path mapping a flatline, P wave, QRS complex, T wave, flatline repeated -->
      <path class="ease-ekg-path" d="M 0 125 L 150 125 L 165 110 L 180 125 L 200 125 L 210 160 L 230 40 L 250 140 L 260 125 L 300 125 L 320 105 L 340 125 L 450 125 L 465 110 L 480 125 L 500 125 L 510 160 L 530 40 L 550 140 L 560 125 L 600 125 L 620 105 L 640 125 L 750 125 L 765 110 L 780 125 L 800 125 L 810 160 L 830 40 L 850 140 L 860 125 L 900 125 L 920 105 L 940 125 L 1000 125"></path>
    </svg>
    <div class="ease-ekg-sweeper"></div>
  </div>
  <p style="position: absolute; bottom: 2rem; color: #64748b; font-family: system-ui; font-size: 0.875rem;">Powered by SVG stroke-dasharray animations on the CSS compositor.</p>
</body>
</html>
