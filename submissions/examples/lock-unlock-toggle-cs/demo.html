<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lock Unlock Toggle — EaseMotion CSS</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="page">
        <section class="demo" aria-labelledby="demo-title">
            <div class="intro">
                <p class="eyebrow">EaseMotion CSS · Toggle</p>

                <h1 id="demo-title">Security Toggle</h1>

                <p>
                    Snap between a protected locked state and an open unlocked state.
                </p>
            </div>

            <input class="lock-toggle" type="checkbox" id="lock-state" aria-label="Toggle lock state">

            <label class="lock-control" for="lock-state">
                <span class="lock-icon" aria-hidden="true">
                    <span class="shackle"></span>
                    <span class="lock-body">
                        <span class="keyhole"></span>
                    </span>
                </span>

                <span class="control-copy">
                    <strong class="locked-label">Locked</strong>
                    <strong class="unlocked-label">Unlocked</strong>
                    <small class="status-label">
                        <span class="secure-status">Your content is protected</span>
                        <span class="open-status">Your content is accessible</span>
                    </small>
                </span>

                <span class="switch" aria-hidden="true">
                    <span class="switch-thumb"></span>
                </span>
            </label>

            <p class="hint">
                Click or focus the control and press Enter or Space.
            </p>
        </section>
    </main>
</body>

</html>
