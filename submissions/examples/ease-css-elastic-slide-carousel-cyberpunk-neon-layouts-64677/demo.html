<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyberpunk Neon Elastic-Slide Carousel</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="carousel-container">
    <input type="radio" name="slider" id="slide1" checked>
    <input type="radio" name="slider" id="slide2">
    <input type="radio" name="slider" id="slide3">

    <div class="carousel">
      <div class="slide slide-1">
        <h2>Cyber City</h2>
        <p>Explore the neon lit streets.</p>
      </div>
      <div class="slide slide-2">
        <h2>Neon Nights</h2>
        <p>Vibrant energy in the dark.</p>
      </div>
      <div class="slide slide-3">
        <h2>Retro Future</h2>
        <p>Synthwave aesthetics forever.</p>
      </div>
    </div>

    <div class="navigation">
      <label for="slide1" aria-label="Slide 1"></label>
      <label for="slide2" aria-label="Slide 2"></label>
      <label for="slide3" aria-label="Slide 3"></label>
    </div>
  </div>
</body>
</html>
