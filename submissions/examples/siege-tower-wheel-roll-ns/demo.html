<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Siege Tower Wheel Roll — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Siege Tower Wheel Roll demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Siege Tower Wheel Roll</h1>
      <p class="lede">Siege tower wheels rolling forward</p>
    </header>

    <section class="ease-siege-tower-wheel-roll" data-demo="siege-tower-wheel-roll" aria-live="polite">
      <div class="ease-siege-tower-wheel-roll__housing">
        <div class="ease-siege-tower-wheel-roll__bezel">
          <div class="ease-siege-tower-wheel-roll__face">
            <div class="ease-siege-tower-wheel-roll__readout">
              <span class="ease-siege-tower-wheel-roll__label">Siege Tower Wheel Roll</span>
              <span class="ease-siege-tower-wheel-roll__value">LIVE</span>
            </div>
            <div class="ease-siege-tower-wheel-roll__motion" aria-hidden="true">
              <span class="ease-siege-tower-wheel-roll__a"></span>
              <span class="ease-siege-tower-wheel-roll__b"></span>
              <span class="ease-siege-tower-wheel-roll__c"></span>
              <span class="ease-siege-tower-wheel-roll__d"></span>
            </div>
            <div class="ease-siege-tower-wheel-roll__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-siege-tower-wheel-roll__controls">
          <button type="button" class="ease-siege-tower-wheel-roll__btn primary">Engage</button>
          <button type="button" class="ease-siege-tower-wheel-roll__btn">Reset</button>
          <label class="ease-siege-tower-wheel-roll__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-siege-tower-wheel-roll__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
