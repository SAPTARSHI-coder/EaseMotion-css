<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="./style.css">
<title>CSS Breadcrumb Trail Demo</title>
</head>
<body>
<nav class="btp-nav" aria-label="Breadcrumb Navigation">
  <ol class="btp-list">
    <li class="btp-item">
      <a href="#home" class="btp-link">
        <span class="btp-icon" aria-hidden="true">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        </span>
        <span class="btp-label">Home</span>
      </a>
      <span class="btp-separator" aria-hidden="true">/</span>
    </li>
    <li class="btp-item">
      <a href="#products" class="btp-link">
        <span class="btp-label">Products</span>
      </a>
      <span class="btp-separator" aria-hidden="true">/</span>
    </li>
    <li class="btp-item">
      <a href="#components" class="btp-link">
        <span class="btp-label">Components</span>
      </a>
      <span class="btp-separator" aria-hidden="true">/</span>
    </li>
    <li class="btp-item">
      <a href="#breadcrumbs" class="btp-link btp-active" aria-current="page">
        <span class="btp-label">Breadcrumbs</span>
        <span class="btp-pulse-indicator" aria-hidden="true"></span>
      </a>
    </li>
  </ol>
</nav>
</body>
</html>
