<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="CSS-only time zone clock showing multiple world cities"
  >
  <title>CSS Time Zone Clock</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="page">
    <header class="page-header">
      <h1>World Time Zones</h1>
      <p>CSS-only animated clocks for different cities.</p>
    </header>

    <section class="clock-grid" aria-label="World time zone clocks">

      <!-- New York -->
      <article class="clock-card">
        <div class="clock clock-new-york" aria-hidden="true">
          <span class="number n12">12</span>
          <span class="number n3">3</span>
          <span class="number n6">6</span>
          <span class="number n9">9</span>

          <span class="hand hour"></span>
          <span class="hand minute"></span>
          <span class="hand second"></span>
          <span class="center"></span>
        </div>

        <h2>New York</h2>
        <p>UTC − 5</p>
      </article>

      <!-- London -->
      <article class="clock-card">
        <div class="clock clock-london" aria-hidden="true">
          <span class="number n12">12</span>
          <span class="number n3">3</span>
          <span class="number n6">6</span>
          <span class="number n9">9</span>

          <span class="hand hour"></span>
          <span class="hand minute"></span>
          <span class="hand second"></span>
          <span class="center"></span>
        </div>

        <h2>London</h2>
        <p>UTC + 0</p>
      </article>

      <!-- Dubai -->
      <article class="clock-card">
        <div class="clock clock-dubai" aria-hidden="true">
          <span class="number n12">12</span>
          <span class="number n3">3</span>
          <span class="number n6">6</span>
          <span class="number n9">9</span>

          <span class="hand hour"></span>
          <span class="hand minute"></span>
          <span class="hand second"></span>
          <span class="center"></span>
        </div>

        <h2>Dubai</h2>
        <p>UTC + 4</p>
      </article>

      <!-- India -->
      <article class="clock-card">
        <div class="clock clock-india" aria-hidden="true">
          <span class="number n12">12</span>
          <span class="number n3">3</span>
          <span class="number n6">6</span>
          <span class="number n9">9</span>

          <span class="hand hour"></span>
          <span class="hand minute"></span>
          <span class="hand second"></span>
          <span class="center"></span>
        </div>

        <h2>India</h2>
        <p>UTC + 5:30</p>
      </article>

      <!-- Tokyo -->
      <article class="clock-card">
        <div class="clock clock-tokyo" aria-hidden="true">
          <span class="number n12">12</span>
          <span class="number n3">3</span>
          <span class="number n6">6</span>
          <span class="number n9">9</span>

          <span class="hand hour"></span>
          <span class="hand minute"></span>
          <span class="hand second"></span>
          <span class="center"></span>
        </div>

        <h2>Tokyo</h2>
        <p>UTC + 9</p>
      </article>

      <!-- Sydney -->
      <article class="clock-card">
        <div class="clock clock-sydney" aria-hidden="true">
          <span class="number n12">12</span>
          <span class="number n3">3</span>
          <span class="number n6">6</span>
          <span class="number n9">9</span>

          <span class="hand hour"></span>
          <span class="hand minute"></span>
          <span class="hand second"></span>
          <span class="center"></span>
        </div>

        <h2>Sydney</h2>
        <p>UTC + 10</p>
      </article>

    </section>
  </main>
</body>
</html>
