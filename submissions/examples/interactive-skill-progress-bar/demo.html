<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Skill Progress Bar Demo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="demo-wrapper">
        <h2>Interactive Skill Progress Bar</h2>
        <p class="demo-subtitle">A smooth, animated progress bar featuring a continuous shimmer effect.</p>
        
        <div class="skill-container">
            <div class="skill-info">
                <span class="skill-name">Frontend Engineering</span>
                <span class="skill-percentage">90%</span>
            </div>
            <div class="skill-bar-track">
                <div class="skill-bar-fill shimmer-effect" style="width: 90%;"></div>
            </div>
        </div>

        <div class="skill-container" style="margin-top: 1.5rem;">
            <div class="skill-info">
                <span class="skill-name">UI/UX Animation Design</span>
                <span class="skill-percentage">85%</span>
            </div>
            <div class="skill-bar-track">
                <div class="skill-bar-fill shimmer-effect" style="width: 85%; background: linear-gradient(90deg, #ec4899 0%, #8b5cf6 100%);"></div>
            </div>
        </div>
    </div>
</body>
</html>
