<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Magnetic Cursor Pull Button with Elastic Boundary Deformation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../easemotion.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>Magnetic Cursor Pull Button</h1>
      <p>Move your mouse near the button to experience magnetic pull physics.</p>
    </header>

    <main class="stage">
      <button class="magnetic-btn" id="magneticBtn">
        <span class="btn-text">Hover Near Me</span>
      </button>
    </main>
  </div>

  <script>
    const btn = document.getElementById('magneticBtn');
    
    document.addEventListener('mousemove', (e) => {
      const rect = btn.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;
      
      const deltaX = e.clientX - centerX;
      const deltaY = e.clientY - centerY;
      const distance = Math.hypot(deltaX, deltaY);
      
      if (distance < 120) {
        btn.style.transform = `translate(${deltaX * 0.35}px, ${deltaY * 0.35}px)`;
      } else {
        btn.style.transform = `translate(0px, 0px)`;
      }
    });
  </script>
</body>
</html>
