<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.3">
<title>Ferris Wheel Cabins</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="ferris-wheel">
  <header class="ferris-head">
    <h1 class="ferris-name">SKY RIDE</h1>
    <p class="ferris-laps">4 LAPS</p>
  </header>
  <section class="ferris-frame" aria-label="Ferris wheel with cabins">
    <div class="wheel-ring">
      <span class="hub"></span>
      <div class="cabin cabin-a"></div>
      <div class="cabin cabin-b"></div>
      <div class="cabin cabin-c"></div>
      <div class="cabin cabin-d"></div>
      <div class="cabin cabin-e"></div>
      <div class="cabin cabin-f"></div>
    </div>
  </section>
  <section class="ferris-support" aria-label="Wheel support legs">
    <span class="leg leg-a"></span>
    <span class="leg leg-b"></span>
  </section>
  <footer class="ferris-foot">
    <span class="ferris-gond">GONDOLA 6</span>
    <span class="ferris-open">OPEN NOW</span>
  </footer>
</main>
</body>
</html>
