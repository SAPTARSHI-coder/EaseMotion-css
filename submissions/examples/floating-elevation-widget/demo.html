<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Floating Elevation CSS dashboard widget built with pure HTML and Vanilla CSS."
  >
  <title>Floating Elevation Dashboard Widget</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">
    <section class="dashboard" aria-labelledby="dashboard-title">

      <header class="dashboard-header">
        <div>
          <p class="eyebrow">ELEVATION SYSTEM</p>
          <h1 id="dashboard-title">Performance Hub</h1>
        </div>

        <div class="status" aria-label="System status: stable">
          <span class="status-dot" aria-hidden="true"></span>
          STABLE
        </div>
      </header>

      <section class="hero-card">
        <div class="hero-content">
          <span class="section-label">OVERALL PERFORMANCE</span>

          <div class="score-row">
            <strong>94</strong>
            <span>/100</span>
          </div>

          <p>
            Your system is performing above the recommended
            operational threshold.
          </p>

          <div class="trend">
            <span class="trend-icon" aria-hidden="true">↗</span>
            <span>12.8% from last period</span>
          </div>
        </div>

        <div class="elevation-orb" aria-hidden="true">
          <div class="orb-shadow"></div>
          <div class="orb">
            <span class="orb-highlight"></span>
          </div>
        </div>
      </section>

      <section class="metrics" aria-label="Performance metrics">

        <article class="metric-card">
          <div class="metric-top">
            <span class="metric-icon" aria-hidden="true">CPU</span>
            <span class="metric-change">+8%</span>
          </div>

          <span class="metric-label">Processing</span>
          <strong>86%</strong>

          <div class="metric-bar">
            <span style="--value: 86%"></span>
          </div>
        </article>

        <article class="metric-card">
          <div class="metric-top">
            <span class="metric-icon" aria-hidden="true">NET</span>
            <span class="metric-change">+14%</span>
          </div>

          <span class="metric-label">Network</span>
          <strong>92%</strong>

          <div class="metric-bar">
            <span style="--value: 92%"></span>
          </div>
        </article>

        <article class="metric-card">
          <div class="metric-top">
            <span class="metric-icon" aria-hidden="true">MEM</span>
            <span class="metric-change">+5%</span>
          </div>

          <span class="metric-label">Memory</span>
          <strong>73%</strong>

          <div class="metric-bar">
            <span style="--value: 73%"></span>
          </div>
        </article>

      </section>

      <section class="activity-card" aria-labelledby="activity-title">

        <div class="activity-heading">
          <div>
            <span class="section-label">LIVE ACTIVITY</span>
            <h2 id="activity-title">System Elevation</h2>
          </div>

          <span class="activity-time">LAST 24H</span>
        </div>

        <div class="elevation-chart" aria-label="System activity chart">
          <div class="chart-grid"></div>

          <div class="chart-area"></div>
          <div class="chart-line"></div>

          <div class="chart-points" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>

        <div class="chart-labels" aria-hidden="true">
          <span>00</span>
          <span>04</span>
          <span>08</span>
          <span>12</span>
          <span>16</span>
          <span>20</span>
          <span>24</span>
        </div>

      </section>

      <button class="action-button" type="button">
        <span aria-hidden="true">↗</span>
        Explore Performance
      </button>

    </section>
  </main>

</body>
</html>
