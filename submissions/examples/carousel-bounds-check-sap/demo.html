<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EaseMotion CSS - Carousel Slide Index Bounds Check Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="bounds-demo-card em-fade-in">
    <div class="card-header">
      <span class="badge">Engine Spec #59099</span>
      <h2>Carousel Bounds Inspector</h2>
      <p>Interactive verification tool testing index calculation boundaries.</p>
    </div>

    <!-- Interactive Bounds Testing Control Panel -->
    <div class="control-grid">
      <div class="input-group">
        <label for="input-target">Requested Index</label>
        <input type="number" id="input-target" value="-1" step="1">
      </div>
      <div class="input-group">
        <label for="input-total">Total Slides</label>
        <input type="number" id="input-total" value="4" min="1" step="1">
      </div>
      <div class="input-group">
        <label for="input-mode">Boundary Mode</label>
        <select id="input-mode">
          <option value="clamp">Clamp (0 ... N-1)</option>
          <option value="loop">Loop (Wrap Around)</option>
        </select>
      </div>
    </div>

    <!-- Live Calculation Output Monitor -->
    <div class="output-panel">
      <div class="result-label">Computed Safe Index:</div>
      <div class="result-value" id="output-result">0</div>
      <div class="result-status" id="output-status">Index clamped to minimum bound (0)</div>
    </div>
  </div>

  <script type="module">
    import { checkSlideIndex, ClampMode } from '../../easemotion/helpers/carousel-bounds.js';

    const targetInput = document.getElementById('input-target');
    const totalInput = document.getElementById('input-total');
    const modeSelect = document.getElementById('input-mode');
    const resultOutput = document.getElementById('output-result');
    const statusOutput = document.getElementById('output-status');

    function updateBoundsCheck() {
      const rawTarget = targetInput.value;
      const rawTotal = totalInput.value;
      const mode = modeSelect.value;

      const safeIndex = checkSlideIndex(rawTarget, rawTotal, { mode });
      resultOutput.textContent = safeIndex;

      const targetNum = parseInt(rawTarget, 10);
      const totalNum = parseInt(rawTotal, 10);

      if (isNaN(targetNum)) {
        statusOutput.textContent = 'Invalid index input: fallback to index 0';
      } else if (mode === 'clamp' && targetNum < 0) {
        statusOutput.textContent = `Underflow: Clamped ${targetNum} -> 0`;
      } else if (mode === 'clamp' && targetNum >= totalNum) {
        statusOutput.textContent = `Overflow: Clamped ${targetNum} -> ${totalNum - 1}`;
      } else if (mode === 'loop' && (targetNum < 0 || targetNum >= totalNum)) {
        statusOutput.textContent = `Wrapped out-of-bounds index ${targetNum} -> ${safeIndex}`;
      } else {
        statusOutput.textContent = `Valid requested index (${safeIndex}) within range [0, ${totalNum - 1}]`;
      }
    }

    [targetInput, totalInput, modeSelect].forEach(el => el.addEventListener('input', updateBoundsCheck));
    updateBoundsCheck();
  </script>
</body>
</html>
