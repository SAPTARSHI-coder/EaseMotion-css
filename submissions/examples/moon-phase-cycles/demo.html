<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moon Phase Cycle Indicator</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>Moon Phase Cycle Indicator</h1>

    <div class="moon" style="--phase:35%;">
        <div class="moon__sphere"></div>
    </div>

    <input
        type="range"
        min="0"
        max="100"
        value="35"
        aria-label="Moon Phase"
        id="slider">

    <p id="value">Phase : 35%</p>

</div>

<script>

const slider=document.getElementById("slider");
const moon=document.querySelector(".moon");
const value=document.getElementById("value");

slider.addEventListener("input",()=>{

moon.style.setProperty("--phase",slider.value+"%");
value.textContent="Phase : "+slider.value+"%";

});

</script>

</body>
</html>
