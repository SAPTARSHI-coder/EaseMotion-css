<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SVG Stroke Draw | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="ssd-root">
    <svg class="ssd-svg" viewBox="0 0 200 200">
      <path class="ssd-text ssd-text-accent"
        d="M20,50 C30,30 50,30 60,50 C70,70 90,70 100,50 C110,30 130,30 140,50 C150,70 170,70 180,50"/>
      <text class="ssd-text ssd-text-green" x="20" y="100">EASE MOTION</text>
      <text class="ssd-text ssd-text-accent" x="20" y="125">CSS ANIMATION</text>
      <path class="ssd-shape"
        d="M20,140 L60,160 L100,140 L140,160 L180,140"
        stroke="#ec4899"/>
      <path class="ssd-shape"
        d="M20,155 C60,175 100,135 140,175 C160,190 180,170 180,170"
        stroke="#06b6d4"
        style="animation-delay: 1.2s"/>
    </svg>
    <p class="ssd-sub">SVG stroke animation drawing text and shapes</p>
  </div>
</body>
</html>
