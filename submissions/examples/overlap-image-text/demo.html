<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="A pure CSS creative image and overlapping text composition."
  >
  <title>CSS Overlap Image Text</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="demo">
    <header class="demo-header">
      <p class="eyebrow">EaseMotion CSS</p>
      <h1>Overlap Image Text</h1>
      <p>
        Creative typography layered over an image using CSS clip-path.
      </p>
    </header>

    <section class="composition" aria-labelledby="composition-title">
      <div class="image-panel" role="img" aria-label="Abstract mountain landscape">
        <div class="sun" aria-hidden="true"></div>

        <div class="mountain mountain-back" aria-hidden="true"></div>
        <div class="mountain mountain-front" aria-hidden="true"></div>

        <div class="reflection" aria-hidden="true"></div>
      </div>

      <div class="text-layer">
        <p class="text-kicker">Explore</p>

        <h2 id="composition-title">
          <span>BEYOND</span>
          <span>THE</span>
          <span>ORDINARY</span>
        </h2>

        <p class="text-description">
          Discover a visual composition where typography crosses the boundary
          between foreground and image.
        </p>
      </div>

      <div class="accent-shape" aria-hidden="true"></div>
    </section>

    <p class="hint">
      Pure CSS · clip-path · Responsive
    </p>
  </main>
</body>
</html>
