<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deckle Frame Shake — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Deckle Frame Shake demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Deckle Frame Shake</h1>
      <p class="lede">Deckle frame shake evening the slurry on the mould</p>
    </header>

    <section class="ease-deckle-frame-shake" data-demo="deckle-frame-shake" aria-live="polite">
      <div class="ease-deckle-frame-shake__housing">
        <div class="ease-deckle-frame-shake__bezel">
          <div class="ease-deckle-frame-shake__face">
            <div class="ease-deckle-frame-shake__readout">
              <span class="ease-deckle-frame-shake__label">Deckle Frame Shake</span>
              <span class="ease-deckle-frame-shake__value">LIVE</span>
            </div>
            <div class="ease-deckle-frame-shake__motion" aria-hidden="true">
              <span class="ease-deckle-frame-shake__a"></span>
              <span class="ease-deckle-frame-shake__b"></span>
              <span class="ease-deckle-frame-shake__c"></span>
              <span class="ease-deckle-frame-shake__d"></span>
            </div>
            <div class="ease-deckle-frame-shake__meters">
              <i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-deckle-frame-shake__controls">
          <button type="button" class="ease-deckle-frame-shake__btn primary">Shake</button>
          <button type="button" class="ease-deckle-frame-shake__btn">Drain</button>
          <label class="ease-deckle-frame-shake__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-deckle-frame-shake__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
