<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Spotlight Lens Cursor Reveal Grid Card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../easemotion.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>Spotlight Reveal Grid Card</h1>
      <p>Move your cursor over the card grid to reveal spotlight lens lighting.</p>
    </header>

    <main class="grid-stage" id="gridStage">
      <div class="spotlight-card"><h3>Spotlight 1</h3><p>Hover lens tracking</p></div>
      <div class="spotlight-card"><h3>Spotlight 2</h3><p>Hover lens tracking</p></div>
      <div class="spotlight-card"><h3>Spotlight 3</h3><p>Hover lens tracking</p></div>
    </main>
  </div>

  <script>
    const stage = document.getElementById('gridStage');
    const cards = document.querySelectorAll('.spotlight-card');

    stage.addEventListener('mousemove', (e) => {
      cards.forEach(card => {
        const rect = card.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        card.style.setProperty('--mouse-x', `${x}px`);
        card.style.setProperty('--mouse-y', `${y}px`);
      });
    });
  </script>
</body>
</html>
