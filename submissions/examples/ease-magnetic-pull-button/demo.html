<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ease Magnetic Pull Button</title>
    <link rel="stylesheet" href="../../../easemotion.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="ease-magnetic-container">
        <!-- The pure CSS magnetic pull trick uses hover zones -->
        <div class="ease-magnetic-zone top-left"></div>
        <div class="ease-magnetic-zone top-center"></div>
        <div class="ease-magnetic-zone top-right"></div>
        
        <div class="ease-magnetic-zone middle-left"></div>
        <div class="ease-magnetic-zone middle-center"></div>
        <div class="ease-magnetic-zone middle-right"></div>
        
        <div class="ease-magnetic-zone bottom-left"></div>
        <div class="ease-magnetic-zone bottom-center"></div>
        <div class="ease-magnetic-zone bottom-right"></div>
        
        <button class="ease-magnetic-btn">Hover Me</button>
    </div>
</body>
</html>
