<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parallax Loader with Dark Mode Styling | EaseMotion CSS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="parallax-container" role="status" aria-label="Loading data">
        <div class="loader-orbit">
            <div class="ring ring-outer"></div>
            <div class="ring ring-inner"></div>
            <div class="core-dot"></div>
        </div>
        <span class="loader-status">Processing...</span>
    </div>
</body>
</html>
