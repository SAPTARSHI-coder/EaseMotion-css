<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Rotate-Fade Hero Section - Minimalist Tech</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 
       A checkbox hack to toggle the rotate-fade animation for the demo.
       In a real application, this could run infinitely or be triggered on load.
    -->
    <input type="checkbox" id="animation-toggle" class="animation-input" checked>
    
    <div class="layout-container">
        
        <!-- Controls outside the hero for easy access in demo -->
        <div class="demo-controls">
            <label for="animation-toggle" class="btn-toggle">
                <svg class="icon-play" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                <svg class="icon-pause" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
                <span>Toggle Ambient Rotation</span>
            </label>
        </div>

        <section class="hero-section">
            
            <!-- The Rotate-Fade Background System -->
            <div class="rotate-fade-bg">
                <!-- We use multiple overlapping gradients to create a complex ambient glow -->
                <div class="glow glow-primary"></div>
                <div class="glow glow-secondary"></div>
            </div>
            
            <!-- Grid overlay for tech aesthetic -->
            <div class="grid-overlay"></div>
            
            <!-- Hero Content -->
            <div class="hero-content">
                <div class="badge">
                    New Release
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                </div>
                
                <h1 class="hero-title">
                    Building the future of<br/>
                    <span class="highlight">ambient computing.</span>
                </h1>
                
                <p class="hero-subtitle">
                    Our platform seamlessly integrates into your environment, providing intelligent automation without the interface friction.
                </p>
                
                <div class="hero-actions">
                    <a href="#" class="btn btn-primary">Get API Access</a>
                    <a href="#" class="btn btn-secondary">View Case Studies</a>
                </div>
            </div>
            
        </section>

    </div>

</body>
</html>
