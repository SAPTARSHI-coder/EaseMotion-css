<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyberpunk Dynamic Modal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="wrapper">

  <label for="modal-toggle" class="open-btn">
    Launch Modal
  </label>

  <input type="checkbox" id="modal-toggle">

  <div class="modal-overlay">

    <div class="modal">

      <label for="modal-toggle" class="close-btn">
        ✕
      </label>

      <h2>CYBERPUNK ACCESS</h2>

      <p>
        Neural interface connected successfully.
        Welcome to the future of interactive UI.
      </p>

      <div class="actions">
        <button class="primary">CONNECT</button>
        <button class="secondary">CANCEL</button>
      </div>

    </div>

  </div>

</div>

</body>
</html>
