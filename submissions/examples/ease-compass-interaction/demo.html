<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Compass Interaction · Needle Points to Cursor</title>

    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <div class="card">
        <h2>🧭 Compass Interaction</h2>
        <p class="sub">needle points toward cursor</p>

        <!-- === COMPASS === -->
        <div class="compass-container" id="compassContainer">
            <div class="compass">
                <!-- Compass face -->
                <div class="compass-face">
                    <!-- Cardinal directions -->
                    <span class="direction n">N</span>
                    <span class="direction s">S</span>
                    <span class="direction e">E</span>
                    <span class="direction w">W</span>
                    <span class="direction ne">NE</span>
                    <span class="direction nw">NW</span>
                    <span class="direction se">SE</span>
                    <span class="direction sw">SW</span>

                    <!-- Tick marks -->
                    <div class="tick tick-1"></div>
                    <div class="tick tick-2"></div>
                    <div class="tick tick-3"></div>
                    <div class="tick tick-4"></div>
                    <div class="tick tick-5"></div>
                    <div class="tick tick-6"></div>
                    <div class="tick tick-7"></div>
                    <div class="tick tick-8"></div>
                    <div class="tick tick-9"></div>
                    <div class="tick tick-10"></div>
                    <div class="tick tick-11"></div>
                    <div class="tick tick-12"></div>

                    <!-- Compass needle -->
                    <div class="needle" id="needle">
                        <div class="needle-north"></div>
                        <div class="needle-south"></div>
                        <div class="needle-center"></div>
                    </div>

                    <!-- Direction label -->
                    <div class="direction-label" id="directionLabel">N</div>
                </div>

                <!-- Degree display -->
                <div class="degree-display">
                    <span class="degree-value" id="degreeValue">0°</span>
                    <span class="degree-label">degrees</span>
                </div>
            </div>
        </div>

        <p style="margin-top: 2rem; font-size: 0.85rem; color: #64748b;">
            Move your mouse · needle points toward cursor
        </p>
    </div>

    <!-- Embedded JavaScript -->
    <script>
        (function() {
            'use strict';

            const compass = document.getElementById('compassContainer');
            const needle = document.getElementById('needle');
            const directionLabel = document.getElementById('directionLabel');
            const degreeValue = document.getElementById('degreeValue');

            let targetAngle = 0;
            let currentAngle = 0;

            // --- Cardinal directions mapping ---
            const directions = [
                { name: 'N', angle: 0 },
                { name: 'NE', angle: 45 },
                { name: 'E', angle: 90 },
                { name: 'SE', angle: 135 },
                { name: 'S', angle: 180 },
                { name: 'SW', angle: 225 },
                { name: 'W', angle: 270 },
                { name: 'NW', angle: 315 }
            ];

            function getDirectionName(angle) {
                // Normalize angle to 0-360
                let normalized = ((angle % 360) + 360) % 360;
                let closest = directions[0];
                let minDiff = 360;

                for (const dir of directions) {
                    let diff = Math.abs(normalized - dir.angle);
                    if (diff > 180) diff = 360 - diff;
                    if (diff < minDiff) {
                        minDiff = diff;
                        closest = dir;
                    }
                }
                return closest.name;
            }

            // --- Update compass ---
            function updateCompass() {
                const rect = compass.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;

                // Get mouse position (from last known position)
                // We'll use the last mouse position stored globally
            }

            // --- Mouse move ---
            document.addEventListener('mousemove', function(e) {
                const rect = compass.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;

                const dx = e.clientX - centerX;
                const dy = e.clientY - centerY;

                // Calculate angle in degrees
                let angle = Math.atan2(dy, dx) * (180 / Math.PI);
                // Compass convention: 0 = North (up), positive = clockwise
                angle = 90 - angle;
                if (angle < 0) angle += 360;

                targetAngle = angle;

                // Smoothly interpolate current angle toward target
                let diff = targetAngle - currentAngle;
                // Handle wrap-around
                if (diff > 180) diff -= 360;
                if (diff < -180) diff += 360;

                currentAngle += diff * 0.12;

                // Apply rotation
                needle.style.transform = `translate(-50%, -50%) rotate(${currentAngle}deg)`;

                // Update direction label
                const dirName = getDirectionName(currentAngle);
                directionLabel.textContent = dirName;

                // Update degree display
                const displayAngle = Math.round(((currentAngle % 360) + 360) % 360);
                degreeValue.textContent = displayAngle + '°';
            });

            // --- Touch support ---
            document.addEventListener('touchmove', function(e) {
                e.preventDefault();
                const touch = e.touches[0];
                const rect = compass.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;

                const dx = touch.clientX - centerX;
                const dy = touch.clientY - centerY;

                let angle = Math.atan2(dy, dx) * (180 / Math.PI);
                angle = 90 - angle;
                if (angle < 0) angle += 360;

                targetAngle = angle;

                let diff = targetAngle - currentAngle;
                if (diff > 180) diff -= 360;
                if (diff < -180) diff += 360;

                currentAngle += diff * 0.12;

                needle.style.transform = `translate(-50%, -50%) rotate(${currentAngle}deg)`;

                const dirName = getDirectionName(currentAngle);
                directionLabel.textContent = dirName;

                const displayAngle = Math.round(((currentAngle % 360) + 360) % 360);
                degreeValue.textContent = displayAngle + '°';
            }, { passive: false });

            document.addEventListener('touchstart', function(e) {
                const touch = e.touches[0];
                const rect = compass.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;

                const dx = touch.clientX - centerX;
                const dy = touch.clientY - centerY;

                let angle = Math.atan2(dy, dx) * (180 / Math.PI);
                angle = 90 - angle;
                if (angle < 0) angle += 360;

                targetAngle = angle;
                currentAngle = angle;
                needle.style.transform = `translate(-50%, -50%) rotate(${currentAngle}deg)`;

                const dirName = getDirectionName(currentAngle);
                directionLabel.textContent = dirName;

                const displayAngle = Math.round(((currentAngle % 360) + 360) % 360);
                degreeValue.textContent = displayAngle + '°';
            });

            // --- Click feedback ---
            compass.addEventListener('click', function() {
                this.classList.add('click-pulse');
                setTimeout(() => {
                    this.classList.remove('click-pulse');
                }, 300);
                console.log('🧭 Compass clicked!');
            });

            // --- Keyboard accessibility ---
            compass.setAttribute('tabindex', '0');
            compass.setAttribute('role', 'button');
            compass.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    this.click();
                }
            });

            console.log('🧭 Compass interaction initialized!');

        })();
    </script>

</body>
</html>
