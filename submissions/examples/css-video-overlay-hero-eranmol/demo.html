<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Video Overlay Hero</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <section class="hero" role="banner" aria-label="Hero section with video background">

    <video class="hero-video" autoplay muted loop playsinline aria-hidden="true">
      <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
    </video>

    <div class="hero-overlay"></div>

    <div class="hero-content">
      <span class="hero-tag">New Release</span>
      <h1 class="hero-title">Build Faster with EaseMotion</h1>
      <p class="hero-sub">Production-ready CSS animations and UI patterns for modern web apps.</p>
      <div class="hero-actions">
        <a href="#" class="btn btn-primary">Get Started</a>
        <a href="#" class="btn btn-ghost">View Docs</a>
      </div>
    </div>

  </section>

</body>
</html>
