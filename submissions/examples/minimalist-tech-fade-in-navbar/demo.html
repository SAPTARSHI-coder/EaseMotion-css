<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Fade-In Navbar - Minimalist Tech</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 
       A checkbox hack to toggle the entrance animation for the demo.
       In a real application, the animation would trigger naturally on page load.
    -->
    <input type="checkbox" id="navbar-toggle" class="demo-trigger" checked>
    
    <!-- The Fade-In Navbar -->
    <nav class="tech-navbar fade-in-group">
        <div class="nav-container">
            
            <a href="#" class="nav-logo delay-1">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
                <span>SYS_ARCH</span>
            </a>
            
            <div class="nav-links">
                <a href="#" class="nav-item delay-2">Documentation</a>
                <a href="#" class="nav-item delay-3">API Reference</a>
                <a href="#" class="nav-item delay-4">Status</a>
                <a href="#" class="nav-item delay-5">Support</a>
            </div>
            
            <div class="nav-actions delay-6">
                <a href="#" class="btn btn-login">Login</a>
                <a href="#" class="btn btn-signup">Get Started</a>
            </div>
            
            <!-- Mobile Menu Toggle (Decorative for this demo) -->
            <button class="mobile-toggle delay-6" aria-label="Toggle menu">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
            </button>
            
        </div>
    </nav>

    <!-- Page Content Area -->
    <div class="page-content">
        <header class="hero-section">
            <h1 class="hero-title">Minimalist Tech Navigation</h1>
            <p class="hero-subtitle">A clean, highly responsive top navigation bar featuring a purely CSS staggered fade-in entrance animation.</p>
            
            <!-- Demo Controls -->
            <div class="demo-controls">
                <label for="navbar-toggle" class="btn-replay">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"></polyline><polyline points="23 20 23 14 17 14"></polyline><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"></path></svg>
                    Replay Animation
                </label>
            </div>
        </header>
    </div>

</body>
</html>
