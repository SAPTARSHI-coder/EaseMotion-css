<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spiral Stair Newel Turn — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Spiral Stair Newel Turn demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Spiral Stair Newel Turn</h1>
      <p class="lede">Spiral staircase newel post turn climb</p>
    </header>

    <section class="ease-spiral-stair-newel-turn" data-demo="spiral-stair-newel-turn" aria-live="polite">
      <div class="ease-spiral-stair-newel-turn__housing">
        <div class="ease-spiral-stair-newel-turn__bezel">
          <div class="ease-spiral-stair-newel-turn__face">
            <div class="ease-spiral-stair-newel-turn__readout">
              <span class="ease-spiral-stair-newel-turn__label">Spiral Stair Newel Turn</span>
              <span class="ease-spiral-stair-newel-turn__value">LIVE</span>
            </div>
            <div class="ease-spiral-stair-newel-turn__motion" aria-hidden="true">
              <span class="ease-spiral-stair-newel-turn__a"></span>
              <span class="ease-spiral-stair-newel-turn__b"></span>
              <span class="ease-spiral-stair-newel-turn__c"></span>
              <span class="ease-spiral-stair-newel-turn__d"></span>
            </div>
            <div class="ease-spiral-stair-newel-turn__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-spiral-stair-newel-turn__controls">
          <button type="button" class="ease-spiral-stair-newel-turn__btn primary">Engage</button>
          <button type="button" class="ease-spiral-stair-newel-turn__btn">Reset</button>
          <label class="ease-spiral-stair-newel-turn__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-spiral-stair-newel-turn__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
