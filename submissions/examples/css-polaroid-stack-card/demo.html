<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="CSS Polaroid Stack Card with a smooth card-spreading hover interaction."
    >

    <title>CSS Polaroid Stack Card | EaseMotion CSS</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="page">

        <section
            class="showcase"
            aria-labelledby="title"
        >

            <div class="intro">
                <p class="eyebrow">EaseMotion CSS</p>

                <h1 id="title">Polaroid Stack</h1>

                <p class="description">
                    A pure CSS stack of polaroid cards that spreads into
                    a hand-of-cards layout when hovered or focused.
                </p>
            </div>

            <div
                class="polaroid-stack"
                role="group"
                aria-label="Polaroid photo collection"
            >

                <article
                    class="polaroid polaroid-one"
                    tabindex="0"
                    aria-label="Polaroid photo one"
                >
                    <div class="photo photo-one">
                        <span aria-hidden="true">01</span>
                    </div>

                    <div class="caption">
                        <strong>Golden Hour</strong>
                        <span>Captured moments</span>
                    </div>
                </article>

                <article
                    class="polaroid polaroid-two"
                    tabindex="0"
                    aria-label="Polaroid photo two"
                >
                    <div class="photo photo-two">
                        <span aria-hidden="true">02</span>
                    </div>

                    <div class="caption">
                        <strong>Mountain Air</strong>
                        <span>Weekend escape</span>
                    </div>
                </article>

                <article
                    class="polaroid polaroid-three"
                    tabindex="0"
                    aria-label="Polaroid photo three"
                >
                    <div class="photo photo-three">
                        <span aria-hidden="true">03</span>
                    </div>

                    <div class="caption">
                        <strong>Ocean Blue</strong>
                        <span>Summer memories</span>
                    </div>
                </article>

                <article
                    class="polaroid polaroid-four"
                    tabindex="0"
                    aria-label="Polaroid photo four"
                >
                    <div class="photo photo-four">
                        <span aria-hidden="true">04</span>
                    </div>

                    <div class="caption">
                        <strong>City Lights</strong>
                        <span>After dark</span>
                    </div>
                </article>

            </div>

            <p class="interaction-hint">
                Hover or focus the cards to spread the stack.
            </p>

        </section>

    </main>

</body>
</html>
