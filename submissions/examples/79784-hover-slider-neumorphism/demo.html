<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <meta
    name="description"
    content="Responsive hover slider with neumorphism styling."
  />

  <title>Hover Slider — Neumorphism</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main class="page">

    <section class="demo">

      <span class="eyebrow">EASEMOTION CSS</span>

      <h1>Hover Slider</h1>

      <p class="intro">
        A soft neumorphic slider with smooth hover interactions,
        tactile controls, and responsive styling.
      </p>

      <div class="slider-card">

        <div class="slider-card__header">
          <div>
            <span class="slider-card__eyebrow">
              AUDIO CONTROL
            </span>

            <h2>Volume</h2>
          </div>

          <output
            class="slider-value"
            id="volume-value"
          >
            72%
          </output>
        </div>

        <div class="slider">

          <span class="slider__icon" aria-hidden="true">
            −
          </span>

          <div class="slider__track">

            <span class="slider__fill"></span>

            <span
              class="slider__thumb"
              aria-hidden="true"
            ></span>

          </div>

          <span class="slider__icon" aria-hidden="true">
            +
          </span>

        </div>

        <div class="slider__scale">
          <span>0</span>
          <span>25</span>
          <span>50</span>
          <span>75</span>
          <span>100</span>
        </div>

        <div class="slider-card__footer">
          <span>Hover the slider to increase emphasis</span>
          <span class="status">
            ACTIVE
          </span>
        </div>

      </div>

      <div class="demo__hint">
        Move your pointer over the track or thumb.
      </div>

    </section>

  </main>
</body>
</html>
