<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sci-Fi HUD: Retro Arcade Pixel Variation</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
    <div class="hud-container-retro">
        <div class="hud-header">
            <h1 class="hud-title-retro">SYS.MAINFRAME</h1>
            <div class="hud-status blink">STATUS: ONLINE</div>
        </div>
        
        <div class="hud-main-retro">
            <div class="hud-panel-left panel-retro">
                <div class="panel-title">SYSTEM_LOG</div>
                <ul class="log-list">
                    <li>> INITIALIZING... [OK]</li>
                    <li>> LOADING MODULES... [OK]</li>
                    <li>> SCANNING SECTOR 7G... [FAIL]</li>
                    <li>> RETRYING... <span class="blink">_</span></li>
                </ul>
            </div>
            
            <div class="hud-panel-center panel-retro">
                <div class="target-box-retro">
                    <div class="corner top-left"></div>
                    <div class="corner top-right"></div>
                    <div class="corner bottom-left"></div>
                    <div class="corner bottom-right"></div>
                    <div class="radar-scan"></div>
                    <div class="target-crosshair"></div>
                </div>
            </div>
            
            <div class="hud-panel-right panel-retro">
                <div class="panel-title">STATS</div>
                <div class="stat-bar">
                    <span class="stat-label">HP</span>
                    <div class="bar-bg"><div class="bar-fill hp-fill"></div></div>
                </div>
                <div class="stat-bar">
                    <span class="stat-label">MP</span>
                    <div class="bar-bg"><div class="bar-fill mp-fill"></div></div>
                </div>
                <div class="stat-bar">
                    <span class="stat-label">AP</span>
                    <div class="bar-bg"><div class="bar-fill ap-fill"></div></div>
                </div>
            </div>
        </div>
        
        <div class="hud-footer">
            <div class="loading-bar-retro">
                <div class="loading-progress"></div>
            </div>
        </div>
        <div class="scanline"></div>
    </div>
</body>
</html>
