<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Responsive morphing CSS spinner with a dark mode aesthetic."
  >

  <title>Morphing Spinner - Dark Mode</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="spinner-page">

    <section
      class="spinner-card"
      aria-labelledby="spinner-title"
    >

      <div class="intro">

        <span class="eyebrow">
          CSS COMPONENT / 01
        </span>

        <h1 id="spinner-title">
          Morphing Spinner
        </h1>

        <p>
          A fluid loading indicator that continuously changes
          its shape using pure CSS animation.
        </p>

      </div>

      <div
        class="spinner-stage"
        role="status"
        aria-label="Loading"
      >

        <div class="morphing-spinner">

          <span class="spinner-core"></span>

          <span class="spinner-ring ring-one"></span>
          <span class="spinner-ring ring-two"></span>
          <span class="spinner-ring ring-three"></span>

        </div>

        <div class="loading-label">
          <span>Loading</span>

          <span
            class="loading-dots"
            aria-hidden="true"
          >
            <i></i>
            <i></i>
            <i></i>
          </span>
        </div>

      </div>

      <div class="component-info">

        <div class="info-item">
          <strong>CSS</strong>
          <span>Only</span>
        </div>

        <div class="info-item">
          <strong>0</strong>
          <span>Dependencies</span>
        </div>

        <div class="info-item">
          <strong>∞</strong>
          <span>Scalable</span>
        </div>

      </div>

    </section>

  </main>

</body>
</html>
