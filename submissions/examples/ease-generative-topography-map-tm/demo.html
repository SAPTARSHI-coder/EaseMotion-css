<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Generative Topography Map | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="topowrap">
    <div class="topomap">
      <div class="toporing" data-label="200m"></div>
      <div class="toporing" data-label="400m"></div>
      <div class="toporing" data-label="600m"></div>
      <div class="toporing" data-label="800m"></div>
      <div class="toporing" data-label="1000m"></div>
      <div class="toporing" data-label="PEAK"></div>
    </div>
    <div class="topoinfo">
      <div class="topocell">
        <div class="topocell-label">Elevation</div>
        <span class="topocell-val">1,024 m</span>
      </div>
      <div class="topocell">
        <div class="topocell-label">Region</div>
        <span class="topocell-val">Alpine</span>
      </div>
      <div class="topocell">
        <div class="topocell-label">Area</div>
        <span class="topocell-val">42 km&sup2;</span>
      </div>
      <div class="topocell">
        <div class="topocell-label">Slope</div>
        <span class="topocell-val">32&deg;</span>
      </div>
    </div>
  </div>
</body>
</html>
