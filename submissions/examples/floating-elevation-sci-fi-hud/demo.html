<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CSS Sci-Fi HUD Floating Elevation effect">
  <title>Floating Elevation Sci-Fi HUD</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="hud-stage">
    <section class="hud-card" aria-label="Sci-Fi HUD interface">

      <div class="hud-grid"></div>

      <div class="hud-orbit hud-orbit-one"></div>
      <div class="hud-orbit hud-orbit-two"></div>

      <div class="hud-scanner"></div>

      <div class="hud-content">
        <span class="hud-label">SYSTEM 07</span>

        <div class="hud-icon" aria-hidden="true">
          <span></span>
        </div>

        <h1>FLOATING</h1>
        <h2>ELEVATION</h2>

        <p>
          CYBERPUNK HUD INTERFACE
        </p>

        <div class="hud-status">
          <span class="status-dot"></span>
          SYSTEM ONLINE
        </div>
      </div>

      <div class="hud-corner corner-top-left"></div>
      <div class="hud-corner corner-top-right"></div>
      <div class="hud-corner corner-bottom-left"></div>
      <div class="hud-corner corner-bottom-right"></div>

      <div class="hud-data data-left">
        <span>ALT</span>
        <strong>084.7</strong>
      </div>

      <div class="hud-data data-right">
        <span>SYNC</span>
        <strong>99.8%</strong>
      </div>

    </section>
  </main>
</body>
</html>
