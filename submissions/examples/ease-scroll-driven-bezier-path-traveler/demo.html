<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ease Scroll-Synced SVG Bezier Path Traveler & Roadmap</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bezier-body">
  <div class="roadmap-stage">
    <svg class="b-path-svg" viewBox="0 0 400 600">
      <path id="bezierCurve" d="M 50 50 Q 350 200 50 350 T 350 550" fill="none" stroke="#334155" stroke-width="6" />
    </svg>
    <div class="traveler-icon" id="traveler">🚀</div>
  </div>

  <script>
    const traveler = document.getElementById('traveler');
    window.addEventListener('scroll', () => {
      const scrollPct = Math.min(1, Math.max(0, window.scrollY / (document.body.scrollHeight - window.innerHeight)));
      traveler.style.offsetDistance = `${scrollPct * 100}%`;
    });
  </script>
</body>
</html>
