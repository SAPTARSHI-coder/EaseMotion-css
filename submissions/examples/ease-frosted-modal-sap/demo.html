<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ease-frosted-modal-sap demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #667eea, #764ba2);
      font-family: system-ui, sans-serif;
    }
    .open-btn {
      padding: 12px 22px;
      border-radius: 10px;
      border: none;
      background: #fff;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <button class="open-btn" id="openBtn">Open Modal</button>

  <div class="frosted-modal-sap" id="modal">
    <div class="modal-box">
      <h3>Confirm Action</h3>
      <p>This will permanently delete the selected item. This action cannot be undone.</p>
      <div class="modal-actions">
        <button class="btn-secondary" id="cancelBtn">Cancel</button>
        <button class="btn-primary" id="confirmBtn">Delete</button>
      </div>
    </div>
  </div>

  <script>
    const modal = document.getElementById('modal');
    document.getElementById('openBtn').addEventListener('click', () => modal.classList.add('open'));
    document.getElementById('cancelBtn').addEventListener('click', () => modal.classList.remove('open'));
    document.getElementById('confirmBtn').addEventListener('click', () => modal.classList.remove('open'));
    modal.addEventListener('click', (e) => {
      if (e.target === modal) modal.classList.remove('open');
    });
  </script>

</body>
</html>
