<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Responsive CSS exam result card with score, grade, percentage and pass status."
  >
  <title>CSS Exam Result Card</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">
    <section class="result-card" aria-labelledby="result-title">

      <div class="card-header">
        <div class="result-icon" aria-hidden="true">✓</div>

        <div>
          <span class="eyebrow">Examination Result</span>
          <h1 id="result-title">Final Assessment</h1>
        </div>
      </div>

      <div class="score-area">
        <div class="score-ring" aria-label="Score: 86 percent">
          <div class="score-inner">
            <strong>86%</strong>
            <span>Score</span>
          </div>
        </div>

        <div class="status">
          <span class="status-dot" aria-hidden="true"></span>
          <span>Passed</span>
        </div>
      </div>

      <div class="details" aria-label="Exam result details">

        <div class="detail-item">
          <span class="label">Student</span>
          <strong>Alex Morgan</strong>
        </div>

        <div class="detail-item">
          <span class="label">Subject</span>
          <strong>Computer Science</strong>
        </div>

        <div class="detail-item">
          <span class="label">Marks</span>
          <strong>86 / 100</strong>
        </div>

        <div class="detail-item">
          <span class="label">Grade</span>
          <strong>A</strong>
        </div>

      </div>

      <div class="progress-section">
        <div class="progress-label">
          <span>Overall Performance</span>
          <strong>86%</strong>
        </div>

        <div
          class="progress-track"
          role="progressbar"
          aria-label="Overall exam performance"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="86"
        >
          <span class="progress-fill"></span>
        </div>
      </div>

      <div class="card-footer">
        <span>Result declared successfully</span>
        <span class="badge">Grade A</span>
      </div>

    </section>
  </main>

</body>
</html>
