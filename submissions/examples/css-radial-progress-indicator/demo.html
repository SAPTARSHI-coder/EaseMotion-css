<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Radial Progress Indicator - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="em-radial-page">
        <div class="em-radial-card" role="region" aria-label="Concentric Radial Progress Indicator">
            <header class="em-radial-header">
                <span class="em-radial-badge">SYSTEM METRICS</span>
                <h1 class="em-radial-title">Radial Progress Indicator</h1>
                <p class="em-radial-subtitle">Concentric progress rings driven by pure CSS properties.</p>
            </header>

            <div class="em-concentric-container" tabindex="0" aria-label="Progress rings: Ring 1 at 85 percent, Ring 2 at 65 percent, Ring 3 at 45 percent">
                <div class="em-ring em-ring-outer" style="--progress: 85deg;">
                    <div class="em-ring-middle" style="--progress: 65deg;">
                        <div class="em-ring-inner" style="--progress: 45deg;">
                            <div class="em-radial-core">
                                <span class="em-core-value">85%</span>
                                <span class="em-core-label">LOAD</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="em-metric-legend">
                <div class="em-legend-item">
                    <span class="em-legend-dot em-dot-outer"></span>
                    <span>CPU Usage (85%)</span>
                </div>
                <div class="em-legend-item">
                    <span class="em-legend-dot em-dot-middle"></span>
                    <span>Memory (65%)</span>
                </div>
                <div class="em-legend-item">
                    <span class="em-legend-dot em-dot-inner"></span>
                    <span>Storage (45%)</span>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
