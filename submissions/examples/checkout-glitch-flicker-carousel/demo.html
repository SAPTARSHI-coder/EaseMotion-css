<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Glitch-Flicker Carousel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="checkout-layout">
        <h2 class="section-title">Select Edition</h2>
        
        <div class="carousel-container">
            <input type="radio" name="edition" id="ed1" class="carousel-input" checked>
            <input type="radio" name="edition" id="ed2" class="carousel-input">
            <input type="radio" name="edition" id="ed3" class="carousel-input">
            
            <div class="carousel-cards">
                <label for="ed1" class="carousel-card card-item-1">
                    <div class="card-icon glitch-text" data-text="CYBER">CYBER</div>
                    <div class="card-info">
                        <div class="card-title">Standard Edition</div>
                        <div class="card-price">$49.99</div>
                    </div>
                </label>
                
                <label for="ed2" class="carousel-card card-item-2">
                    <div class="card-icon glitch-text" data-text="NEON">NEON</div>
                    <div class="card-info">
                        <div class="card-title">Deluxe Edition</div>
                        <div class="card-price">$69.99</div>
                    </div>
                </label>
                
                <label for="ed3" class="carousel-card card-item-3">
                    <div class="card-icon glitch-text" data-text="VOID">VOID</div>
                    <div class="card-info">
                        <div class="card-title">Collector's Edition</div>
                        <div class="card-price">$129.99</div>
                    </div>
                </label>
            </div>
            
            <div class="carousel-indicators">
                <label for="ed1" class="indicator"></label>
                <label for="ed2" class="indicator"></label>
                <label for="ed3" class="indicator"></label>
            </div>
        </div>
        
        <button class="checkout-btn">Initialize Checkout</button>
    </div>
</body>
</html>
