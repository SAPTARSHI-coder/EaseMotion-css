<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Morphing Shape Progress</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="wrapper">

    <div class="progress-card">

        <h1>Morphing Shape Progress</h1>

        <div class="progress-details">
            <span>Loading Assets</span>
            <span>78%</span>
        </div>

        <div
            class="progress-bar"
            role="progressbar"
            aria-label="Loading Assets"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="78">

            <div class="progress-fill"></div>

        </div>

    </div>

</div>

</body>
</html>
