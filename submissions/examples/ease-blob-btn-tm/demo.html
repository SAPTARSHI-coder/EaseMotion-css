<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ease-blob-btn Demo</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
      padding: 60px 20px;
      background: var(--blob-bg);
    }
    h1 { font-size: 1.5rem; color: var(--blob-text); text-align: center; }
    .demo-row { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
    .demo-section { display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .demo-label { font-size: 0.8rem; color: rgba(248,250,252,0.5); }
    .row { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
  </style>
</head>
<body>
  <h1>ease-blob-btn Component</h1>

  <div class="demo-section">
    <span class="demo-label">Default blob button</span>
    <button class="blob-btn">Get Started</button>
  </div>

  <div class="demo-section">
    <span class="demo-label">Color variants</span>
    <div class="demo-row">
      <button class="blob-btn blob-secondary">Secondary</button>
      <button class="blob-btn blob-accent">Accent</button>
    </div>
  </div>

  <div class="demo-section">
    <span class="demo-label">Size variants</span>
    <div class="demo-row">
      <button class="blob-btn blob-sm blob-accent">Small</button>
      <button class="blob-btn blob-accent">Medium</button>
      <button class="blob-btn blob-lg blob-accent">Large</button>
      <button class="blob-btn blob-xl blob-secondary">X-Large</button>
    </div>
  </div>

  <div class="demo-section">
    <span class="demo-label">Outlined variant</span>
    <div class="demo-row">
      <button class="blob-btn blob-outline">Outlined</button>
      <button class="blob-btn blob-outline blob-secondary">Outlined Secondary</button>
      <button class="blob-btn blob-outline blob-accent">Outlined Accent</button>
    </div>
  </div>

  <div class="demo-section">
    <span class="demo-label">Icon button (circular)</span>
    <div class="demo-row">
      <button class="blob-btn blob-icon blob-secondary">+</button>
      <button class="blob-btn blob-icon blob-accent">x</button>
      <button class="blob-btn blob-icon">*</button>
    </div>
  </div>

  <div class="demo-section">
    <span class="demo-label">Disabled and loading states</span>
    <div class="demo-row">
      <button class="blob-btn" disabled>Disabled</button>
      <button class="blob-btn blob-loading blob-secondary">Loading</button>
    </div>
  </div>

</body>
</html>
