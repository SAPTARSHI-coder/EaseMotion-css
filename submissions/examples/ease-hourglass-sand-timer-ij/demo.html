<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=2.0">
<title>Hourglass Sand Timer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="sandglass">
  <header class="glass-head">
    <h1 class="glass-name">QUARTER HOUR</h1>
    <p class="glass-turn">TURN 2</p>
  </header>
  <section class="glass-frame" aria-label="Hourglass with sand">
    <div class="glass-upper">
      <span class="sand-top"></span>
      <span class="glass-neck"></span>
    </div>
    <div class="glass-lower">
      <span class="sand-pile"></span>
      <span class="sand-grains"></span>
    </div>
    <span class="glass-post post-left"></span>
    <span class="glass-post post-right"></span>
    <span class="glass-beam beam-top"></span>
    <span class="glass-beam beam-bottom"></span>
  </section>
  <footer class="glass-foot">
    <span class="glass-minutes">7:30</span>
    <span class="glass-flip">FLIP</span>
  </footer>
</main>
</body>
</html>
