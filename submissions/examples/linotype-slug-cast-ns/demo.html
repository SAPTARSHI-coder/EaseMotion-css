<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Linotype Slug Cast — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Linotype Slug Cast demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Linotype Slug Cast</h1>
      <p class="lede">Linotype hot-metal slug casting drop</p>
    </header>

    <section class="ease-linotype-slug-cast" data-demo="linotype-slug-cast" aria-live="polite">
      <div class="ease-linotype-slug-cast__housing">
        <div class="ease-linotype-slug-cast__bezel">
          <div class="ease-linotype-slug-cast__face">
            <div class="ease-linotype-slug-cast__readout">
              <span class="ease-linotype-slug-cast__label">Linotype Slug Cast</span>
              <span class="ease-linotype-slug-cast__value">LIVE</span>
            </div>
            <div class="ease-linotype-slug-cast__motion" aria-hidden="true">
              <span class="ease-linotype-slug-cast__a"></span>
              <span class="ease-linotype-slug-cast__b"></span>
              <span class="ease-linotype-slug-cast__c"></span>
              <span class="ease-linotype-slug-cast__d"></span>
            </div>
            <div class="ease-linotype-slug-cast__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-linotype-slug-cast__controls">
          <button type="button" class="ease-linotype-slug-cast__btn primary">Engage</button>
          <button type="button" class="ease-linotype-slug-cast__btn">Reset</button>
          <label class="ease-linotype-slug-cast__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-linotype-slug-cast__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
