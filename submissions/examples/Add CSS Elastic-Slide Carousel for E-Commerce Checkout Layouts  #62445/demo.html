<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Elastic-Slide Carousel - EaseMotion</title>
  <link rel="stylesheet" href="style.css">
  <!-- Modern clean typography -->
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Mock E-Commerce Page -->
  <main class="checkout-layout">
    
    <div class="checkout-panel">
      
      <header class="panel-header">
        <h1>Shipping Method</h1>
        <p>Choose your preferred delivery speed for this order.</p>
      </header>

      <div class="carousel-container">
        
        <!-- Hidden State: Pure CSS Radio Trick -->
        <input type="radio" name="delivery" id="delivery-1" class="carousel-radio" checked aria-hidden="true">
        <input type="radio" name="delivery" id="delivery-2" class="carousel-radio" aria-hidden="true">
        <input type="radio" name="delivery" id="delivery-3" class="carousel-radio" aria-hidden="true">

        <!-- The Sliding Viewport -->
        <div class="carousel-viewport">
            
          <!-- Slide 1: Standard -->
          <div class="carousel-slide slide-1">
            <label class="slide-content" for="delivery-1" aria-label="Select Standard Delivery">
              <div class="slide-icon truck">
                <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="1" y="3" width="15" height="13"></rect>
                  <polygon points="16 8 20 8 23 11 23 16 16 16 16 8"></polygon>
                  <circle cx="5.5" cy="18.5" r="2.5"></circle>
                  <circle cx="18.5" cy="18.5" r="2.5"></circle>
                </svg>
              </div>
              <div class="slide-details">
                <h3>Standard Delivery</h3>
                <p>3-5 Business Days</p>
              </div>
              <div class="slide-price">Free</div>
              <div class="active-ring"></div>
            </label>
          </div>
          
          <!-- Slide 2: Express -->
          <div class="carousel-slide slide-2">
            <label class="slide-content" for="delivery-2" aria-label="Select Express Delivery">
              <div class="slide-icon plane">
                <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.2-1.1.6L3 8l5 5-3.5 3.5L2 16l2 2 2 2 1.5-2.5L11 14l5 5c.4-.2.7-.6.6-1.1L14.8 13z"></path>
                </svg>
              </div>
              <div class="slide-details">
                <h3>Express Delivery</h3>
                <p>1-2 Business Days</p>
              </div>
              <div class="slide-price">$15.00</div>
              <div class="active-ring"></div>
            </label>
          </div>
          
          <!-- Slide 3: Next Day -->
          <div class="carousel-slide slide-3">
            <label class="slide-content" for="delivery-3" aria-label="Select Next Day Air Delivery">
              <div class="slide-icon rocket">
                <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"></path>
                  <path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"></path>
                  <path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"></path>
                  <path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"></path>
                </svg>
              </div>
              <div class="slide-details">
                <h3>Next Day Air</h3>
                <p>Arrives Tomorrow Morning</p>
              </div>
              <div class="slide-price">$30.00</div>
              <div class="active-ring"></div>
            </label>
          </div>

        </div>

        <!-- Carousel Pagination Dots -->
        <div class="carousel-pagination">
          <label for="delivery-1" aria-label="Go to Standard Delivery"></label>
          <label for="delivery-2" aria-label="Go to Express Delivery"></label>
          <label for="delivery-3" aria-label="Go to Next Day Air"></label>
        </div>

      </div>
      
      <!-- Footer Action -->
      <div class="panel-footer">
        <button class="continue-btn" onclick="alert('Shipping selected!')">Continue to Payment</button>
      </div>

    </div>
  </main>

</body>
</html>
