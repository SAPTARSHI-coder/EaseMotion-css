<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ease Responsive Masonry Grid with FLIP Animations</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="ease-flip-body">
  <div class="ease-flip-wrapper">
    <div class="ease-filter-tabs">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="design">Design</button>
      <button class="filter-btn" data-filter="dev">Dev</button>
    </div>

    <div class="ease-masonry-grid" id="grid">
      <div class="ease-grid-item design">Design 1</div>
      <div class="ease-grid-item dev">Dev 1</div>
      <div class="ease-grid-item design">Design 2</div>
      <div class="ease-grid-item dev">Dev 2</div>
    </div>
  </div>

  <script>
    const btns = document.querySelectorAll('.filter-btn');
    const items = document.querySelectorAll('.ease-grid-item');

    btns.forEach(btn => {
      btn.addEventListener('click', () => {
        btns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const filter = btn.getAttribute('data-filter');

        items.forEach(item => {
          if (filter === 'all' || item.classList.contains(filter)) {
            item.style.display = 'flex';
          } else {
            item.style.display = 'none';
          }
        });
      });
    });
  </script>
</body>
</html>
