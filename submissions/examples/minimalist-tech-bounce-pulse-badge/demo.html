<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Bounce-Pulse Badge - Minimalist Tech</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="layout-container">
        
        <header class="section-header">
            <h1 class="title">Notification Badges</h1>
            <p class="subtitle">A minimalist tech badge component featuring a physical bounce entrance and an ambient pulsing ring.</p>
        </header>

        <div class="dashboard-area">
            
            <div class="card">
                
                <!-- 
                   Pure CSS State Management for Badge Container 
                   We use a checkbox to toggle the state to replay the entrance animation.
                -->
                <div class="controls">
                    <input type="checkbox" id="replay-toggle" class="replay-input" checked>
                    <label for="replay-toggle" class="btn-replay">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"></polyline><polyline points="23 20 23 14 17 14"></polyline><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"></path></svg>
                        Replay Entrance
                    </label>
                    
                    <div class="badge-container bounce-pulse-group">
                        
                        <!-- Badge 1: New Updates -->
                        <div class="badge color-blue delay-1">
                            <span class="pulse-ring"></span>
                            <span class="badge-text">New Updates</span>
                            <span class="badge-count">3</span>
                        </div>
                        
                        <!-- Badge 2: Live/Active -->
                        <div class="badge color-emerald delay-2">
                            <span class="pulse-ring"></span>
                            <span class="badge-text">Live Broadcast</span>
                        </div>
                        
                        <!-- Badge 3: Alert/Error -->
                        <div class="badge color-red delay-3">
                            <span class="pulse-ring"></span>
                            <span class="badge-text">Critical Alert</span>
                            <svg class="badge-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                        </div>
                        
                    </div>
                </div>
                
            </div>
            
        </div>
    </div>

</body>
</html>
