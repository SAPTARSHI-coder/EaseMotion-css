<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App Download Footer - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- App Download Footer -->
  <footer class="app-footer" role="contentinfo" aria-label="App Download Section">
    <div class="app-footer-container">
      
      <div class="app-footer-content">
        <h2 class="app-footer-title">Get the EaseMotion App</h2>
        <p class="app-footer-text">
          Manage your animations on the go. Download for iOS and Android today.
        </p>
      </div>

      <div class="app-footer-badges">
        <!-- App Store Badge -->
        <a href="#" class="badge-btn app-store" aria-label="Download on the App Store">
          <svg class="badge-icon" viewBox="0 0 384 512" aria-hidden="true" focusable="false">
            <path fill="currentColor" d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-92.1zM250.9 91.2c21.8-26.3 35.8-62.8 30.7-91.2-24.8 1-54.7 16.5-72.3 36.7-16 18.5-29.6 48.3-25.2 76.2 27.5 2.1 55-15.4 66.8-21.7z"/>
          </svg>
          <div class="badge-text">
            <span class="badge-subtitle">Download on the</span>
            <span class="badge-title">App Store</span>
          </div>
        </a>

        <!-- Google Play Badge -->
        <a href="#" class="badge-btn google-play" aria-label="Get it on Google Play">
          <svg class="badge-icon" viewBox="0 0 512 512" aria-hidden="true" focusable="false">
            <path fill="currentColor" d="M325.3 234.3L104.6 13l280.8 161.2-60.1 60.1zM47 0C34 6.8 25.3 19.2 25.3 35.3v441.3c0 16.1 8.7 28.5 21.7 35.3l256.6-256L47 0zm425.2 225.6l-58.9-34.1-65.7 64.5 65.7 64.5 60.1-34.1c18-14.3 18-46.5-1.2-60.8zM104.6 499l220.7-221.3 60.1 60.1L104.6 499z"/>
          </svg>
          <div class="badge-text">
            <span class="badge-subtitle">GET IT ON</span>
            <span class="badge-title">Google Play</span>
          </div>
        </a>
      </div>

    </div>
  </footer>

</body>
</html>
