<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peacock Display · Feathers Fan Out Beautifully</title>
    <meta name="description" content="Interactive peacock with beautifully fanning feathers, iridescent colors, and graceful display animation.">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1 class="title">🦚 PEACOCK DISPLAY</h1>
        
        <div class="canvas-wrapper">
            <canvas id="peacockCanvas" width="600" height="500"></canvas>
            <div class="glow-overlay"></div>
        </div>

        <div class="controls">
            <button class="toggle-btn" id="toggleBtn">⏸️ PAUSE</button>
            <button class="reset-btn" id="resetBtn">⟳ RESET</button>
            <div class="speed-control">
                <label>Speed</label>
                <input type="range" id="speedSlider" min="1" max="10" value="5">
                <span id="speedLabel">5</span>
            </div>
        </div>

        <div class="info">
            <span>🦚 PEACOCK DISPLAY</span>
            <small>click → fan feathers · iridescent shimmer</small>
        </div>
        <div class="hint">
            <span>🪶 click to make the peacock fan its beautiful feathers</span>
        </div>
    </div>

    <script>
        (function() {
            const canvas = document.getElementById('peacockCanvas');
            const ctx = canvas.getContext('2d');
            const W = 600, H = 500;
            
            const toggleBtn = document.getElementById('toggleBtn');
            const resetBtn = document.getElementById('resetBtn');
            const speedSlider = document.getElementById('speedSlider');
            const speedLabel = document.getElementById('speedLabel');

            let isAnimating = true;
            let speed = 5;
            let time = 0;

            // ---- Peacock Class ----
            class Peacock {
                constructor() {
                    this.x = W / 2;
                    this.y = H * 0.55;
                    
                    // Fan state
                    this.fanAmount = 0;
                    this.fanTarget = 0;
                    this.fanSpeed = 0.04;
                    
                    // Feathers
                    this.featherCount = 24;
                    this.feathers = [];
                    for (let i = 0; i < this.featherCount; i++) {
                        const angle = (i / this.featherCount) * Math.PI * 2 - Math.PI / 2;
                        this.feathers.push({
                            angle: angle,
                            baseAngle: angle,
                            length: 80 + Math.random() * 40,
                            colorOffset: Math.random() * 0.5,
                            eyeSize: 8 + Math.random() * 6,
                            phase: Math.random() * Math.PI * 2
                        });
                    }
                    
                    // Body sway
                    this.swayPhase = 0;
                    this.swaySpeed = 0.015;
                }

                update() {
                    const dt = speed / 5;
                    time += 0.01 * dt;
                    
                    // Smooth fan interpolation
                    this.fanAmount += (this.fanTarget - this.fanAmount) * this.fanSpeed * dt;
                    
                    // Sway
                    this.swayPhase += this.swaySpeed * dt;
                    const sway = Math.sin(this.swayPhase) * 2;
                    this.x = W/2 + sway;
                }

                draw(ctx) {
                    const x = this.x;
                    const y = this.y;
                    const fan = this.fanAmount;
                    
                    ctx.save();
                    ctx.translate(x, y);
                    
                    // ---- Glow ----
                    const glowGrad = ctx.createRadialGradient(0, -30, 0, 0, -30, 250 * fan + 50);
                    glowGrad.addColorStop(0, 'rgba(100, 200, 255, 0.05)');
                    glowGrad.addColorStop(0.5, 'rgba(100, 200, 255, 0.02)');
                    glowGrad.addColorStop(1, 'rgba(0,0,0,0)');
                    ctx.fillStyle = glowGrad;
                    ctx.beginPath();
                    ctx.arc(0, -30, 250 * fan + 50, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // ---- Draw feathers (back to front) ----
                    const sortedFeathers = [...this.feathers].sort((a, b) => {
                        const aAngle = a.angle + (a.baseAngle - a.angle) * (1 - fan);
                        const bAngle = b.angle + (b.baseAngle - b.angle) * (1 - fan);
                        return Math.sin(aAngle) - Math.sin(bAngle);
                    });
                    
                    for (let f of sortedFeathers) {
                        this.drawFeather(ctx, f, fan);
                    }
                    
                    // ---- Body ----
                    ctx.save();
                    ctx.shadowColor = 'rgba(50, 100, 150, 0.2)';
                    ctx.shadowBlur = 30;
                    
                    // Main body (teardrop shape)
                    const bodyGrad = ctx.createRadialGradient(
                        -10, -20, 0,
                        0, 0, 40
                    );
                    bodyGrad.addColorStop(0, '#4a7a9a');
                    bodyGrad.addColorStop(0.5, '#2a5a7a');
                    bodyGrad.addColorStop(0.8, '#1a3a5a');
                    bodyGrad.addColorStop(1, '#0a2a3a');
                    ctx.fillStyle = bodyGrad;
                    ctx.beginPath();
                    ctx.moveTo(0, -50);
                    ctx.quadraticCurveTo(-35, -20, -30, 20);
                    ctx.quadraticCurveTo(-20, 40, 0, 45);
                    ctx.quadraticCurveTo(20, 40, 30, 20);
                    ctx.quadraticCurveTo(35, -20, 0, -50);
                    ctx.fill();
                    
                    // Neck
                    ctx.fillStyle = '#2a5a7a';
                    ctx.beginPath();
                    ctx.moveTo(-10, -50);
                    ctx.quadraticCurveTo(-15, -80, 0, -95);
                    ctx.quadraticCurveTo(15, -80, 10, -50);
                    ctx.fill();
                    
                    // Head
                    ctx.fillStyle = '#3a6a8a';
                    ctx.beginPath();
                    ctx.arc(0, -100, 18, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // Crown feathers (crest)
                    ctx.shadowBlur = 5;
                    for (let i = -3; i <= 3; i++) {
                        const angle = i * 0.15;
                        const len = 15 + Math.abs(i) * 3;
                        ctx.strokeStyle = `hsl(${200 + i * 10}, 60%, ${50 + Math.abs(i) * 5}%)`;
                        ctx.lineWidth = 1.5;
                        ctx.beginPath();
                        ctx.moveTo(i * 4, -105);
                        ctx.quadraticCurveTo(
                            i * 8,
                            -105 - len * 0.6,
                            i * 12,
                            -105 - len
                        );
                        ctx.stroke();
                        // Tip
                        ctx.fillStyle = `hsl(${200 + i * 10 + 20}, 70%, 60%)`;
                        ctx.beginPath();
                        ctx.arc(i * 12, -105 - len, 2, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    
                    // Eye
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.arc(6, -103, 6, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#1a1a2e';
                    ctx.beginPath();
                    ctx.arc(8, -102, 3.5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.arc(9, -103, 1.5, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // Beak
                    ctx.fillStyle = '#d4a050';
                    ctx.beginPath();
                    ctx.moveTo(10, -98);
                    ctx.lineTo(20, -96);
                    ctx.lineTo(10, -94);
                    ctx.closePath();
                    ctx.fill();
                    
                    ctx.restore();
                    
                    ctx.restore();
                }

                drawFeather(ctx, feather, fan) {
                    const angle = feather.angle + (feather.baseAngle - feather.angle) * (1 - fan);
                    const length = feather.length * (0.5 + fan * 0.5);
                    const spread = 0.3 + fan * 0.7;
                    const width = 6 + fan * 8;
                    
                    ctx.save();
                    ctx.rotate(angle * spread);
                    
                    // Feather shaft
                    ctx.shadowColor = 'rgba(100, 200, 255, 0.05)';
                    ctx.shadowBlur = 10;
                    
                    // Feather body (gradient)
                    const grad = ctx.createLinearGradient(0, 0, 0, -length);
                    const hue = 180 + feather.colorOffset * 60 + Math.sin(time * 0.02 + feather.phase) * 15;
                    const sat = 60 + Math.sin(time * 0.03 + feather.phase * 1.5) * 20;
                    const light = 50 + Math.sin(time * 0.02 + feather.phase * 0.7) * 20;
                    
                    grad.addColorStop(0, `hsl(${hue + 20}, ${sat + 10}%, ${light + 10}%)`);
                    grad.addColorStop(0.3, `hsl(${hue + 10}, ${sat}%, ${light}%)`);
                    grad.addColorStop(0.6, `hsl(${hue - 10}, ${sat - 10}%, ${light - 10}%)`);
                    grad.addColorStop(0.85, `hsl(${hue - 20}, ${sat - 20}%, ${light - 20}%)`);
                    grad.addColorStop(1, `hsl(${hue - 30}, ${sat - 30}%, ${light - 30}%)`);
                    
                    ctx.fillStyle = grad;
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = `hsl(${hue}, 80%, 70%)`;
                    
                    // Feather shape (tapered)
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    const tipWidth = 2;
                    const midWidth = width * 0.7;
                    const baseWidth = width * 0.3;
                    
                    // Left side
                    ctx.quadraticCurveTo(-baseWidth * 0.5, -length * 0.1, -midWidth, -length * 0.3);
                    ctx.quadraticCurveTo(-width * 0.8, -length * 0.5, -width * 0.5, -length * 0.7);
                    ctx.quadraticCurveTo(-width * 0.2, -length * 0.85, -tipWidth, -length);
                    
                    // Right side
                    ctx.quadraticCurveTo(width * 0.2, -length * 0.85, width * 0.5, -length * 0.7);
                    ctx.quadraticCurveTo(width * 0.8, -length * 0.5, midWidth, -length * 0.3);
                    ctx.quadraticCurveTo(baseWidth * 0.5, -length * 0.1, 0, 0);
                    ctx.fill();
                    
                    // ---- Eye pattern (on feather tip) ----
                    if (fan > 0.3) {
                        const eyeScale = Math.min(1, (fan - 0.3) / 0.7);
                        const eyeY = -length * 0.85;
                        const eyeSize = feather.eyeSize * eyeScale * (0.8 + Math.sin(time * 0.02 + feather.phase) * 0.2);
                        
                        // Outer ring
                        ctx.shadowBlur = 20;
                        ctx.shadowColor = `hsl(${hue + 30}, 100%, 70%)`;
                        ctx.fillStyle = `hsl(${hue + 40}, 80%, ${light + 20}%)`;
                        ctx.beginPath();
                        ctx.arc(0, eyeY, eyeSize * 1.3, 0, Math.PI * 2);
                        ctx.fill();
                        
                        // Middle ring
                        ctx.shadowBlur = 10;
                        ctx.shadowColor = `hsl(${hue + 20}, 100%, 60%)`;
                        ctx.fillStyle = `hsl(${hue + 20}, 70%, ${light + 10}%)`;
                        ctx.beginPath();
                        ctx.arc(0, eyeY, eyeSize * 0.9, 0, Math.PI * 2);
                        ctx.fill();
                        
                        // Inner ring
                        ctx.shadowBlur = 5;
                        ctx.fillStyle = `hsl(${hue}, 60%, ${light}%)`;
                        ctx.beginPath();
                        ctx.arc(0, eyeY, eyeSize * 0.6, 0, Math.PI * 2);
                        ctx.fill();
                        
                        // Center dot
                        ctx.shadowBlur = 0;
                        ctx.fillStyle = `hsl(${hue + 40}, 100%, 90%)`;
                        ctx.beginPath();
                        ctx.arc(0, eyeY, eyeSize * 0.25, 0, Math.PI * 2);
                        ctx.fill();
                        
                        // Highlight
                        ctx.fillStyle = 'rgba(255,255,255,0.3)';
                        ctx.beginPath();
                        ctx.arc(-eyeSize * 0.2, eyeY - eyeSize * 0.2, eyeSize * 0.15, 0, Math.PI * 2);
                        ctx.fill();
                        
                        // Glow ring
                        ctx.shadowBlur = 30;
                        ctx.shadowColor = `hsl(${hue + 40}, 100%, 70%)`;
                        ctx.strokeStyle = `hsl(${hue + 40}, 80%, 80%)`;
                        ctx.lineWidth = 1;
                        ctx.globalAlpha = 0.3 + Math.sin(time * 0.03 + feather.phase) * 0.1;
                        ctx.beginPath();
                        ctx.arc(0, eyeY, eyeSize * 1.6, 0, Math.PI * 2);
                        ctx.stroke();
                        ctx.globalAlpha = 1;
                    }
                    
                    ctx.restore();
                }

                toggleFan() {
                    this.fanTarget = this.fanTarget === 0 ? 1 : 0;
                }

                setFan(state) {
                    this.fanTarget = state ? 1 : 0;
                }
            }

            // ---- Create Peacock ----
            let peacock;

            function createPeacock() {
                peacock = new Peacock();
            }

            // ---- Draw Background ----
            function drawBackground() {
                // Garden gradient
                const gradient = ctx.createRadialGradient(W/2, H * 0.3, 0, W/2, H * 0.5, W);
                gradient.addColorStop(0, '#1a3a2a');
                gradient.addColorStop(0.3, '#0d2a1a');
                gradient.addColorStop(0.6, '#0a1a12');
                gradient.addColorStop(0.8, '#0d1a15');
                gradient.addColorStop(1, '#050a08');
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, W, H);
                
                // Ground
                const groundGrad = ctx.createLinearGradient(0, H * 0.7, 0, H);
                groundGrad.addColorStop(0, 'rgba(20, 50, 30, 0)');
                groundGrad.addColorStop(0.5, 'rgba(20, 50, 30, 0.2)');
                groundGrad.addColorStop(1, 'rgba(20, 50, 30, 0.4)');
                ctx.fillStyle = groundGrad;
                ctx.fillRect(0, H * 0.7, W, H * 0.3);
                
                // Decorative foliage
                for (let i = 0; i < 10; i++) {
                    const x = 30 + i * 60 + Math.sin(i * 1.5) * 15;
                    const y = H * 0.7 + Math.sin(i * 2) * 20;
                    const size = 15 + Math.sin(i * 0.7) * 8;
                    ctx.fillStyle = `hsla(${120 + i * 10}, 40%, ${20 + i * 3}%, 0.15)`;
                    ctx.beginPath();
                    ctx.ellipse(x, y, size, size * 0.5, i * 0.2, 0, Math.PI * 2);
                    ctx.fill();
                }
                
                // Light rays
                for (let i = 0; i < 4; i++) {
                    const x = 50 + i * 160 + Math.sin(time * 0.005 + i) * 20;
                    const grad = ctx.createLinearGradient(x, 0, x + 20, H);
                    grad.addColorStop(0, `rgba(200, 255, 200, ${0.01 + Math.sin(time * 0.01 + i) * 0.008})`);
                    grad.addColorStop(0.5, `rgba(200, 255, 200, ${0.005})`);
                    grad.addColorStop(1, 'rgba(200, 255, 200, 0)');
                    ctx.fillStyle = grad;
                    ctx.fillRect(x, 0, 20, H);
                }
            }

            // ---- Toggle Fan ----
            function toggleFan() {
                if (peacock) {
                    peacock.toggleFan();
                }
            }

            // ---- Animation Loop ----
            function animate() {
                if (!isAnimating) {
                    requestAnimationFrame(animate);
                    return;
                }
                
                drawBackground();
                
                if (peacock) {
                    peacock.update();
                    peacock.draw(ctx);
                }
                
                // Ambient sparkles
                for (let i = 0; i < 15; i++) {
                    const x = (i * 197 + 40) % W;
                    const y = (i * 131 + time * (0.01 + i * 0.005) * 3) % H;
                    const size = 0.5 + Math.sin(time * 0.02 + i * 3) * 0.5 + 0.5;
                    const hue = (i * 30 + time * 10 + 120) % 360;
                    ctx.fillStyle = `hsla(${hue}, 80%, 70%, ${0.01 + Math.sin(time * 0.015 + i) * 0.008})`;
                    ctx.beginPath();
                    ctx.arc(x, y, size, 0, Math.PI * 2);
                    ctx.fill();
                }
                
                requestAnimationFrame(animate);
            }

            // ---- Toggle Animation ----
            function toggleAnimation() {
                isAnimating = !isAnimating;
                toggleBtn.textContent = isAnimating ? '⏸️ PAUSE' : '▶️ PLAY';
            }

            // ---- Reset ----
            function resetPeacock() {
                createPeacock();
                time = 0;
            }

            // ---- Speed Control ----
            speedSlider.addEventListener('input', function() {
                speed = parseInt(this.value);
                speedLabel.textContent = speed;
            });

            // ---- Event Listeners ----
            toggleBtn.addEventListener('click', toggleAnimation);
            resetBtn.addEventListener('click', resetPeacock);
            canvas.addEventListener('click', toggleFan);
            canvas.addEventListener('touchstart', function(e) {
                e.preventDefault();
                toggleFan();
            });

            // ---- Keyboard Shortcuts ----
            document.addEventListener('keydown', function(e) {
                if (e.key === ' ' || e.key === 'Space') {
                    e.preventDefault();
                    toggleFan();
                }
                if (e.key === 'r' || e.key === 'R') {
                    resetPeacock();
                }
            });

            // ---- Initialize ----
            createPeacock();
            animate();

            console.log('🦚 Peacock Display · Click or press Space to fan feathers!');
        })();
    </script>
</body>
</html>
