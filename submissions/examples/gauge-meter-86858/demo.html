<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gauge Meter</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="meter-card">
      <header>
        <div>
          <p class="eyebrow">System health</p>
          <h1>Performance score</h1>
        </div>
        <span class="live"><i aria-hidden="true"></i> Live</span>
      </header>

      <section
        class="gauge"
        role="meter"
        aria-label="Performance score"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="78"
        aria-valuetext="78, optimal"
      >
        <div class="dial">
          <div class="scale" aria-hidden="true"></div>
          <div class="needle" aria-hidden="true"></div>
          <div class="hub" aria-hidden="true"></div>
          <div class="reading">
            <strong>78</strong>
            <span>Optimal</span>
          </div>
          <span class="tick tick--min">0</span>
          <span class="tick tick--mid">50</span>
          <span class="tick tick--max">100</span>
        </div>
      </section>

      <footer>
        <span>Response time</span>
        <strong>184 ms</strong>
        <span class="change">12% faster</span>
      </footer>
    </main>
  </body>
</html>
