<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Balloon Pop &mdash; EaseMotion CSS Demo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="page-head">
    <p class="kicker">EaseMotion CSS &middot; Games &amp; Play</p>
    <h1>Balloon Pop</h1>
    <p class="sub">Tap a balloon to pop it &mdash; they bob and sway while you aim.</p>
  </header>
  <main class="stage">
    <div class="bp-sky">
      <div class="bp-balloon bp-b1">
        <div class="bp-body"></div>
        <div class="bp-knot"></div>
        <div class="bp-string"></div>
      </div>
      <div class="bp-balloon bp-b2">
        <div class="bp-body"></div>
        <div class="bp-knot"></div>
        <div class="bp-string"></div>
      </div>
      <div class="bp-balloon bp-b3">
        <div class="bp-body"></div>
        <div class="bp-knot"></div>
        <div class="bp-string"></div>
      </div>
    </div>
  </main>
  <p class="stage-caption">Hover to inflate, click and hold to pop!</p>
  <footer class="page-foot">
    <span>Pure CSS &middot; zero dependencies</span>
    <span>Bob + pop burst</span>
  </footer>
</body>
</html>
