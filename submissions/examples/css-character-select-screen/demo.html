<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Character Select Screen</title>

    <link rel="stylesheet" href="style.css">
</head>


<body>

<main class="game-screen">

    <h1>SELECT CHARACTER</h1>


    <section class="characters" aria-label="Character selection">


        <article class="character active" tabindex="0">

            <div class="avatar warrior">
                ⚔️
            </div>

            <h2>Warrior</h2>

            <p>Strength: 95</p>

        </article>



        <article class="character" tabindex="0">

            <div class="avatar mage">
                🔮
            </div>

            <h2>Mage</h2>

            <p>Magic: 98</p>

        </article>



        <article class="character" tabindex="0">

            <div class="avatar ninja">
                🥷
            </div>

            <h2>Ninja</h2>

            <p>Speed: 96</p>

        </article>



        <article class="character" tabindex="0">

            <div class="avatar robot">
                🤖
            </div>

            <h2>Robot</h2>

            <p>Armor: 99</p>

        </article>


    </section>


</main>


</body>

</html>
