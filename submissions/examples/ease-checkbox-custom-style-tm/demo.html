<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Custom Checkbox | EaseMotion CSS</title><link rel="stylesheet" href="style.css"></head>
<body><div class="ccb-root">
<div class="ccb-card">
<h2 class="ccb-title">Task List</h2>
<label class="ccb-item">
<input type="checkbox" class="ccb-input">
<span class="ccb-box"></span>
<span class="ccb-label">Review project documentation</span>
</label>
<label class="ccb-item">
<input type="checkbox" class="ccb-input" checked>
<span class="ccb-box"></span>
<span class="ccb-label">Write unit tests</span>
</label>
<label class="ccb-item">
<input type="checkbox" class="ccb-input">
<span class="ccb-box"></span>
<span class="ccb-label">Deploy to staging environment</span>
</label>
<label class="ccb-item">
<input type="checkbox" class="ccb-input" checked>
<span class="ccb-box"></span>
<span class="ccb-label">Update dependencies</span>
</label>
</div>
<p class="ccb-sub">Pure CSS custom checkboxes with checkmark animation</p>
</div></body></html>
