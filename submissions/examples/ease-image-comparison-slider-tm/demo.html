<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Comparison Slider | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="cmp-container">
    <div style="text-align:center; max-width:500px;">
      <h2 style="color:var(--tm-cmp-text); margin:0 0 0.5rem;">Before / After</h2>
      <p style="color:var(--tm-cmp-muted); margin:0;">Drag the slider to compare two images. Pure CSS + minimal JS.</p>
    </div>
    <div class="cmp-slider-wrap" id="cmpSlider" role="img" aria-label="Image comparison slider">
      <img class="cmp-img" src="https://picsum.photos/seed/before42/800/450" alt="Before" draggable="false">
      <div class="cmp-after-wrap" id="cmpAfter">
        <img class="cmp-img" src="https://picsum.photos/seed/after42/800/450" alt="After" draggable="false">
        <span class="cmp-label cmp-label-after">After</span>
      </div>
      <div class="cmp-handle" id="cmpHandle"></div>
      <span class="cmp-label cmp-label-before">Before</span>
    </div>
  </div>
  <script>
    const wrap = document.getElementById('cmpSlider');
    const after = document.getElementById('cmpAfter');
    const handle = document.getElementById('cmpHandle');
    function update(x) {
      const rect = wrap.getBoundingClientRect();
      const pct = Math.max(0, Math.min(100, (x - rect.left) / rect.width * 100));
      after.style.width = pct + '%';
      handle.style.left = pct + '%';
    }
    wrap.addEventListener('mousemove', e => update(e.clientX));
    wrap.addEventListener('touchmove', e => update(e.touches[0].clientX));
    wrap.addEventListener('click', e => update(e.clientX));
  </script>
</body>
</html>
