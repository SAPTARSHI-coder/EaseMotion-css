<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Cyber Monday Banner | EaseMotion CSS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="cyber-banner" tabindex="0" aria-label="Cyber Monday Sale Banner">
    <span class="cyber-tag">Limited Time Offer</span>
    <h1 class="cyber-title">Cyber Monday Sale</h1>
    <p class="cyber-description">Save up to 70% on all annual developer plans and motion library subscriptions. Unlock full access today.</p>

    <div class="countdown-grid" aria-hidden="true">
        <div class="countdown-box">
            <span class="countdown-value">08</span>
            <span class="countdown-label">Hours</span>
        </div>
        <div class="countdown-box">
            <span class="countdown-value">45</span>
            <span class="countdown-label">Minutes</span>
        </div>
        <div class="countdown-box">
            <span class="countdown-value">30</span>
            <span class="countdown-label">Seconds</span>
        </div>
    </div>

    <a href="#claim" class="cyber-btn">Claim Discount</a>
</main>

</body>
</html>
