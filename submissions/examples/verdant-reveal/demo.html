<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Verdant Reveal</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="page">

    <section class="verdant-display" id="verdantDisplay">

      <div class="environment">

        <div class="sun"></div>

        <div class="growth-info">
          <span class="info-label">🌱 Growth</span>
          <span class="info-value" id="growthValue">0%</span>
        </div>

        <div class="stage-info">
          <span class="stage-label">Current Stage</span>
          <span class="stage-value" id="stageValue">Seed</span>
        </div>

        <div class="plant-world" id="plantWorld">

          <div class="background-particle particle-1"></div>
          <div class="background-particle particle-2"></div>
          <div class="background-particle particle-3"></div>
          <div class="background-particle particle-4"></div>

          <div class="plant">

            <div class="seed" id="seed"></div>

            <div class="stem" id="stem">

              <div class="leaf leaf-left leaf-1"></div>
              <div class="leaf leaf-right leaf-2"></div>

              <div class="leaf leaf-left leaf-3"></div>
              <div class="leaf leaf-right leaf-4"></div>

              <div class="leaf leaf-left leaf-5"></div>
              <div class="leaf leaf-right leaf-6"></div>

              <div class="flower" id="flower">

                <div class="flower-center"></div>

                <div class="petal petal-1"></div>
                <div class="petal petal-2"></div>
                <div class="petal petal-3"></div>
                <div class="petal petal-4"></div>
                <div class="petal petal-5"></div>
                <div class="petal petal-6"></div>

              </div>

            </div>

            <div class="pollen-container" id="pollenContainer"></div>

          </div>

          <div class="soil">

            <div class="soil-texture"></div>

          </div>

        </div>

        <div class="status">
          <span class="status-icon">🌿</span>
          <span id="statusMessage">
            A seed waits beneath the soil
          </span>
        </div>

      </div>

      <div class="controls">

        <div class="control-group">

          <div class="control-header">
            <label for="growthSlider">🌱 Plant Growth</label>
            <span id="sliderValue">0%</span>
          </div>

          <input
            type="range"
            id="growthSlider"
            class="growth-slider"
            min="0"
            max="100"
            value="0"
          >

        </div>

        <div class="button-group">

          <button
            class="btn grow-btn"
            id="growBtn"
          >
            🌱 Grow Plant
          </button>

          <button
            class="btn reset-btn"
            id="resetBtn"
          >
            ⟳ Reset
          </button>

        </div>

      </div>

    </section>

  </main>

  <script>

    const slider = document.getElementById("growthSlider");
    const growthValue = document.getElementById("growthValue");
    const sliderValue = document.getElementById("sliderValue");

    const stageValue = document.getElementById("stageValue");
    const statusMessage = document.getElementById("statusMessage");

    const stem = document.getElementById("stem");
    const seed = document.getElementById("seed");
    const flower = document.getElementById("flower");

    const leaves = document.querySelectorAll(".leaf");
    const petals = document.querySelectorAll(".petal");

    const pollenContainer =
      document.getElementById("pollenContainer");

    let targetGrowth = 0;
    let currentGrowth = 0;

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function lerp(start, end, amount) {
      return start + (end - start) * amount;
    }

    function getStage(growth) {

      if (growth < 15) {
        return {
          name: "Seed",
          message: "A seed waits beneath the soil"
        };
      }

      if (growth < 35) {
        return {
          name: "Sprout",
          message: "A tiny sprout reaches for the light"
        };
      }

      if (growth < 65) {
        return {
          name: "Growing",
          message: "The young plant is unfolding"
        };
      }

      if (growth < 85) {
        return {
          name: "Budding",
          message: "A flower bud is preparing to bloom"
        };
      }

      return {
        name: "Bloom",
        message: "The flower has reached full bloom ✨"
      };
    }

    function updatePlant(growth) {

      const normalized = growth / 100;

      growthValue.textContent =
        Math.round(growth) + "%";

      sliderValue.textContent =
        Math.round(growth) + "%";

      slider.value = Math.round(growth);

      const stage = getStage(growth);

      stageValue.textContent = stage.name;
      statusMessage.textContent = stage.message;

      const stemHeight =
        Math.max(0, (normalized - 0.1) / 0.9) * 180;

      stem.style.height = stemHeight + "px";

      const seedProgress =
        clamp((growth - 5) / 25, 0, 1);

      seed.style.transform =
        `translateY(${30 - seedProgress * 30}px)`;

      leaves.forEach((leaf, index) => {

        const threshold =
          25 + index * 7;

        const progress =
          clamp((growth - threshold) / 20, 0, 1);

        leaf.style.opacity = progress;

        const direction =
          index % 2 === 0 ? -1 : 1;

        const rotation =
          direction * (35 - progress * 35);

        leaf.style.transform =
          `rotate(${rotation}deg) scale(${0.4 + progress * 0.6})`;

      });

      const flowerProgress =
        clamp((growth - 65) / 35, 0, 1);

      flower.style.opacity = flowerProgress;

      flower.style.transform =
        `scale(${0.25 + flowerProgress * 0.75})`;

      petals.forEach((petal, index) => {

        const rotation =
          index * 60;

        const scale =
          0.2 + flowerProgress * 0.8;

        petal.style.transform =
          `rotate(${rotation}deg) scale(${scale})`;

      });

      pollenContainer.style.opacity =
        flowerProgress;

    }

    function createPollen() {

      pollenContainer.innerHTML = "";

      for (let i = 0; i < 18; i++) {

        const particle =
          document.createElement("span");

        particle.className = "pollen";

        particle.style.left =
          (20 + Math.random() * 60) + "%";

        particle.style.top =
          (20 + Math.random() * 50) + "%";

        particle.style.animationDelay =
          (Math.random() * 3) + "s";

        pollenContainer.appendChild(particle);
      }
    }

    function animate() {

      currentGrowth =
        lerp(currentGrowth, targetGrowth, 0.05);

      updatePlant(currentGrowth);

      requestAnimationFrame(animate);
    }

    slider.addEventListener("input", () => {

      targetGrowth =
        Number(slider.value);

    });

    document
      .getElementById("growBtn")
      .addEventListener("click", () => {

        targetGrowth =
          Math.min(100, targetGrowth + 10);

      });

    document
      .getElementById("resetBtn")
      .addEventListener("click", () => {

        targetGrowth = 0;

      });

    document
      .getElementById("plantWorld")
      .addEventListener("click", () => {

        targetGrowth =
          Math.min(100, targetGrowth + 5);

      });

    document.addEventListener("keydown", event => {

      if (event.code === "Space") {

        event.preventDefault();

        targetGrowth =
          Math.min(100, targetGrowth + 10);

      }

      if (
        event.key.toLowerCase() === "r"
      ) {

        targetGrowth = 0;

      }

    });

    createPollen();
    animate();

  </script>

</body>
</html>
