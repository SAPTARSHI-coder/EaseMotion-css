<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Pastel Stepper</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="ps-stepper">
        <input type="radio" name="ps-step" id="ps1" checked>
        <input type="radio" name="ps-step" id="ps2">
        <input type="radio" name="ps-step" id="ps3">

        <div class="ps-progress">
            <div class="ps-fill"></div>
        </div>

        <div class="ps-nodes">
            <label for="ps1" class="ps-node pink">
                <div class="ps-bubble">1</div>
                <span>Start</span>
            </label>
            <label for="ps2" class="ps-node purple">
                <div class="ps-bubble">2</div>
                <span>Build</span>
            </label>
            <label for="ps3" class="ps-node green">
                <div class="ps-bubble">3</div>
                <span>Done</span>
            </label>
        </div>
    </div>
</body>
</html>
