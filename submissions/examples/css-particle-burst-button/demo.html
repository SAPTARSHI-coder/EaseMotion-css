<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Particle Burst Button</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="layout-container">
        
        <header class="section-header">
            <h1 class="title">Pure CSS Particle Burst</h1>
            <p class="subtitle">A satisfying click effect utilizing CSS box-shadow manipulation. Supports Light/Dark mode.</p>
        </header>

        <div class="demo-area">
            
            <!-- 
               The Checkbox Hack
               We use a checkbox to detect the "click" event purely in CSS.
            -->
            <div class="button-wrapper">
                <input type="checkbox" id="burst-trigger" class="burst-input">
                
                <label for="burst-trigger" class="burst-button" aria-label="Trigger Particle Burst">
                    Click Me
                </label>
                
                <!-- The Particles Container -->
                <div class="particles"></div>
            </div>
            
            <p class="instruction-text">Click the button to trigger the burst. Click again to reset.</p>
            
        </div>
    </div>

</body>
</html>
