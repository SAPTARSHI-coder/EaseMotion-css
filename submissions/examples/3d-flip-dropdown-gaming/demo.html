<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="3D Flip Dropdown for Gaming Hub layouts">
  <title>3D Flip Gaming Dropdown</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="gaming-hub">
    <section class="showcase" aria-labelledby="page-title">
      <span class="eyebrow">EASEMOTION CSS</span>

      <h1 id="page-title">Gaming Hub</h1>

      <p class="intro">
        Explore game modes with a pure CSS 3D flip dropdown.
      </p>

      <div class="flip-dropdown">
        <button class="dropdown-trigger" type="button">
          <span>Choose Your Game</span>
          <span class="trigger-icon" aria-hidden="true">⌄</span>
        </button>

        <div class="dropdown-panel">
          <div class="panel-inner">

            <a href="#" class="game-option">
              <span class="game-icon">⚔️</span>
              <span class="game-info">
                <strong>Battle Arena</strong>
                <small>Competitive multiplayer</small>
              </span>
              <span class="play">→</span>
            </a>

            <a href="#" class="game-option">
              <span class="game-icon">🚀</span>
              <span class="game-info">
                <strong>Space Rush</strong>
                <small>Fast-paced adventure</small>
              </span>
              <span class="play">→</span>
            </a>

            <a href="#" class="game-option">
              <span class="game-icon">🏆</span>
              <span class="game-info">
                <strong>Tournament</strong>
                <small>Ranked gaming mode</small>
              </span>
              <span class="play">→</span>
            </a>

            <a href="#" class="game-option">
              <span class="game-icon">🎮</span>
              <span class="game-info">
                <strong>Free Play</strong>
                <small>Casual gaming session</small>
              </span>
              <span class="play">→</span>
            </a>

          </div>
        </div>
      </div>
    </section>
  </main>

</body>
</html>
