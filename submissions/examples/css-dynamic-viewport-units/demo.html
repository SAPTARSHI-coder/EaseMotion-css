<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Dynamic Viewport Units | EaseMotion CSS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="viewport-container" tabindex="0" aria-label="Dynamic Viewport Units Demonstration">
    <span class="viewport-badge">Modern CSS Feature</span>
    <h1 class="viewport-title">Dynamic Viewport Layout</h1>
    <p class="viewport-description">This container utilizes modern dynamic viewport height units (<code>dvh</code>) to resize fluidly and accurately when mobile browser address bars expand or collapse.</p>
    
    <div class="viewport-specs">
        <div>
            <span class="spec-label">Height Unit</span>
            <span class="spec-value">100dvh</span>
        </div>
        <div>
            <span class="spec-label">JavaScript</span>
            <span class="spec-value">Not Required</span>
        </div>
    </div>
</main>

</body>
</html>
