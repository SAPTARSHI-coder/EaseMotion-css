<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.7">
<title>Pool Rack Break</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="pool-room">
  <header class="pool-head">
    <h1 class="pool-name">RACK EM</h1>
    <p class="pool-break">BREAK 1</p>
  </header>
  <section class="pool-table" aria-label="Pool table corner with rack">
    <div class="rail rail-top"></div>
    <div class="rail rail-left"></div>
    <div class="table-felt">
      <div class="cue-ball">
        <span class="cue-dot"></span>
      </div>
      <div class="triangle-rack">
        <span class="ball ball-one"></span>
        <span class="ball ball-two"></span>
        <span class="ball ball-three"></span>
        <span class="ball ball-four"></span>
        <span class="ball ball-five"></span>
      </div>
      <div class="cue-stick">
        <span class="cue-tip"></span>
        <span class="cue-taper"></span>
      </div>
      <div class="pocket pocket-a"></div>
      <div class="pocket pocket-b"></div>
    </div>
  </section>
  <footer class="pool-foot">
    <span class="pool-balls">BALLS 8</span>
    <span class="pool-turn">TURN 3</span>
  </footer>
</main>
</body>
</html>
