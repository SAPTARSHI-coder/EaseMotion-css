<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nebula Card · Cosmic Nebula Clouds</title>

    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <div class="card">
        <h2>🌌 Nebula Card</h2>
        <p class="sub">cosmic nebula clouds swirl within</p>

        <!-- === NEBULA CARD === -->
        <div class="nebula-container" id="nebulaContainer">
            <div class="nebula-card">
                <div class="nebula-content">
                    <i class="fas fa-star"></i>
                    <h3>Nebula</h3>
                    <p>Hover to see the cosmos swirl</p>
                    <span class="nebula-location">✦ Deep Space ✦</span>
                </div>
                <div class="nebula-cloud c1"></div>
                <div class="nebula-cloud c2"></div>
                <div class="nebula-cloud c3"></div>
                <div class="nebula-cloud c4"></div>
                <div class="nebula-cloud c5"></div>
                <div class="nebula-cloud c6"></div>
                <div class="nebula-stars"></div>
            </div>
        </div>

        <p style="margin-top: 2rem; font-size: 0.85rem; color: #64748b;">
            Hover · watch the cosmic nebula swirl
        </p>
    </div>

    <!-- Embedded JavaScript -->
    <script>
        (function() {
            'use strict';

            const container = document.getElementById('nebulaContainer');

            // Click feedback
            container.addEventListener('click', function() {
                const card = this.querySelector('.nebula-card');
                card.classList.add('click-pulse');
                setTimeout(() => {
                    card.classList.remove('click-pulse');
                }, 300);
                console.log('🌌 Nebula card clicked!');
            });

            // Keyboard accessibility
            container.setAttribute('tabindex', '0');
            container.setAttribute('role', 'button');
            container.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    this.click();
                }
            });

            // Reset animation on hover
            container.addEventListener('mouseenter', function() {
                const clouds = this.querySelectorAll('.nebula-cloud');
                clouds.forEach(c => {
                    c.style.animation = 'none';
                    void c.offsetWidth;
                    c.style.animation = '';
                });
                const stars = this.querySelector('.nebula-stars');
                stars.style.animation = 'none';
                void stars.offsetWidth;
                stars.style.animation = '';
            });

            console.log('🌌 Nebula card initialized!');

        })();
    </script>

</body>
</html>
