<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interactive Spinner — SaaS Modern</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="stage">
      <span class="stage__eyebrow">Loader</span>
      <h1 class="stage__title">Interactive Spinner</h1>
      <p class="stage__subtitle">
        A SaaS-modern loading ring you can run, pause, and complete — entirely
        with CSS state, no JavaScript.
      </p>

      <!-- Primary interactive spinner -->
      <section
        class="spinner is-running"
        role="status"
        aria-live="polite"
        aria-label="Loading status"
      >
        <div class="spinner__track"></div>
        <div class="spinner__arc"></div>
        <span class="spinner__label">Working…</span>
      </section>

      <!-- Radio-driven controls swap the spinner's state class via :checked.
           Pure CSS pattern; label targets the spinner for keyboard/screen readers. -->
      <div class="controls" role="group" aria-label="Spinner state">
        <input type="radio" name="ss-state" id="ss-run" checked />
        <label class="controls__btn" for="ss-run"><span class="dot"></span>Run</label>

        <input type="radio" name="ss-state" id="ss-pause" />
        <label class="controls__btn" for="ss-pause"><span class="dot"></span>Pause</label>

        <input type="radio" name="ss-state" id="ss-done" />
        <label class="controls__btn" for="ss-done"><span class="dot"></span>Complete</label>
      </div>

      <p class="hint">
        Toggle the controls above. Use <kbd>Tab</kbd> then <kbd>←</kbd>
        <kbd>→</kbd> or <kbd>Space</kbd> to switch states with the keyboard.
      </p>

      <!-- Size & color variants -->
      <div class="variants" aria-label="Spinner variants">
        <div class="variant">
          <section class="spinner spinner--sm is-running" role="status">
            <div class="spinner__track"></div>
            <div class="spinner__arc"></div>
          </section>
          <span class="variant__caption">Small</span>
        </div>

        <div class="variant">
          <section
            class="spinner spinner--lg spinner--secondary is-running"
            role="status"
          >
            <div class="spinner__track"></div>
            <div class="spinner__arc"></div>
            <span class="spinner__label">Sync</span>
          </section>
          <span class="variant__caption">Large / Secondary</span>
        </div>

        <div class="variant">
          <section class="spinner is-complete" role="status">
            <div class="spinner__track"></div>
            <div class="spinner__arc"></div>
            <span class="spinner__label">Done</span>
          </section>
          <span class="variant__caption">Complete</span>
        </div>
      </div>
    </main>
  </body>
</html>
