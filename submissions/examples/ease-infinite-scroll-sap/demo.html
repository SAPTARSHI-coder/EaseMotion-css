<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ease-infinite-scroll-sap demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f4f4f5;
    }
  </style>
</head>
<body>

  <div class="infinite-scroll-sap" id="scrollBox">
    <div id="itemList"></div>
    <div class="loader" id="loader">
      <span></span><span></span><span></span>
    </div>
  </div>

  <script>
    const box = document.getElementById('scrollBox');
    const list = document.getElementById('itemList');
    const loader = document.getElementById('loader');
    let count = 0;
    let loading = false;

    function loadItems(n) {
      loading = true;
      loader.style.display = 'flex';
      setTimeout(() => {
        for (let i = 0; i < n; i++) {
          count++;
          const item = document.createElement('div');
          item.className = 'scroll-item';
          item.textContent = `Item #${count}`;
          list.appendChild(item);
        }
        loading = false;
        if (count >= 60) loader.style.display = 'none';
      }, 500);
    }

    box.addEventListener('scroll', () => {
      if (loading || count >= 60) return;
      if (box.scrollTop + box.clientHeight >= box.scrollHeight - 40) {
        loadItems(10);
      }
    });

    loadItems(10);
  </script>

</body>
</html>
