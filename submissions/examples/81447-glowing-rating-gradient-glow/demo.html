<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Glowing rating component with animated gradient glow styling built with pure CSS."
  >

  <title>Glowing Rating — Gradient Glow</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="page">

    <section
      class="rating-section"
      aria-labelledby="rating-title"
    >

      <header class="rating-heading">
        <span class="rating-heading__eyebrow">
          CUSTOMER EXPERIENCE
        </span>

        <h1 id="rating-title">
          Product rating
        </h1>

        <p>
          A glowing, responsive rating component powered entirely by CSS.
        </p>
      </header>

      <article class="rating-card">

        <div
          class="rating-card__orb rating-card__orb--one"
          aria-hidden="true"
        ></div>

        <div
          class="rating-card__orb rating-card__orb--two"
          aria-hidden="true"
        ></div>

        <div class="rating-card__top">

          <div class="rating-card__icon" aria-hidden="true">
            ★
          </div>

          <span class="rating-card__status">
            Excellent
          </span>

        </div>

        <div class="rating-card__score">

          <strong>4.8</strong>

          <span>/ 5.0</span>

        </div>

        <div
          class="rating-stars"
          role="img"
          aria-label="Rated 4.8 out of 5 stars"
        >
          <span class="rating-star rating-star--active">★</span>
          <span class="rating-star rating-star--active">★</span>
          <span class="rating-star rating-star--active">★</span>
          <span class="rating-star rating-star--active">★</span>
          <span class="rating-star rating-star--partial">★</span>
        </div>

        <p class="rating-card__description">
          Based on 1,284 verified customer reviews.
        </p>

        <div class="rating-card__meter">

          <span class="rating-card__meter-track">
            <span
              class="rating-card__meter-fill"
              style="--rating-progress: 96%;"
            ></span>
          </span>

          <span class="rating-card__meter-label">
            96% satisfaction
          </span>

        </div>

      </article>

    </section>

  </main>

</body>
</html>
