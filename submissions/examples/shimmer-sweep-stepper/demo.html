<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Shimmer-Sweep Stepper for Minimalist Tech Layouts</title>
  <link rel="stylesheet" href="../../../easemotion.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="showcase-container">
    <div class="stepper-card">
      <div class="stepper-header">
        <h2 class="stepper-title">System Initialization</h2>
        <span class="stepper-status">In Progress</span>
      </div>
      
      <ol class="shimmer-stepper">
        <li class="step completed">
          <div class="step-icon">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
          </div>
          <span class="step-text">Configure</span>
        </li>
        <li class="step active">
          <div class="step-icon">2</div>
          <span class="step-text">Authenticate</span>
        </li>
        <li class="step">
          <div class="step-icon">3</div>
          <span class="step-text">Deploy</span>
        </li>
      </ol>
      
      <div class="stepper-content">
        <p class="content-text">Establishing secure connection to minimalist tech infrastructure...</p>
        <div class="action-group">
          <button class="btn btn-secondary">Cancel</button>
          <button class="btn btn-primary">
            Next Step
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-left: 6px;">
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
