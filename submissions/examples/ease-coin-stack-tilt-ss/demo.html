<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coin Stack Tilt Component - Play Category</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="ease-coin-stage" aria-labelledby="stage-title">
    <div style="text-align: center;">
      <h1 id="stage-title" class="ease-coin-title">Bounty Collected!</h1>
      <p class="ease-coin-desc">Gold stack wobbling with a playful toppling tease.</p>
    </div>

    <!-- Coin Stack Component -->
    <div class="ease-coin-stack" id="coin-stack" role="img" aria-label="Stack of Golden Coins Wobbling">
      <div class="ease-coin"></div>
      <div class="ease-coin"></div>
      <div class="ease-coin"></div>
      <div class="ease-coin"></div>
      <div class="ease-coin"></div>
    </div>

    <button type="button" class="ease-btn-wobble" id="replay-btn">Wobble Again</button>
  </main>

  <script>
    const stack = document.getElementById('coin-stack');
    const replayBtn = document.getElementById('replay-btn');

    replayBtn.addEventListener('click', () => {
      stack.classList.remove('is-animating');
      void stack.offsetWidth; // Trigger DOM reflow
      stack.classList.add('is-animating');
    });
  </script>
</body>
</html>
