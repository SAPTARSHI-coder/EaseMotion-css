<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Password Strength Meter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>Password Strength Meter</h1>

    <div class="password-card">
        <label for="password">Password</label>
        <input
            type="password"
            id="password"
            placeholder="Enter your password"
            aria-label="Password Input"
        >

        <div class="strength-meter" aria-label="Password Strength Indicator">
            <span class="segment weak"></span>
            <span class="segment medium"></span>
            <span class="segment strong"></span>
            <span class="segment very-strong"></span>
        </div>

        <p class="strength-text">Strength: Very Strong</p>
    </div>
</div>

</body>
</html>
