<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echo Chamber Component</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="echo-app-container">
        <header class="echo-header">
            <h1>Echo Chamber</h1>
            <p>Click anywhere to create soundless ripples. Press SPACE to trigger a central echo.</p>
            <div class="echo-controls">
                <span class="echo-counter">Echoes: <span id="echo-count">0</span></span>
                <div class="echo-slider-container">
                    <label for="echo-strength">Strength:</label>
                    <input type="range" id="echo-strength" min="1" max="10" value="5">
                </div>
                <button id="clear-btn" class="echo-btn">Clear Chamber</button>
            </div>
        </header>
        
        <main class="echo-chamber" id="chamber">
            <div class="chamber-boundary"></div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
