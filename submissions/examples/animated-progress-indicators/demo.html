<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animated Progress Indicators</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="container">
    <h1>Animated Progress Indicators</h1>
    <p class="subtitle">Pure CSS animated progress bars</p>

    <section class="progress-card">

      <div class="progress-item">
        <div class="progress-header">
          <span>HTML</span>
          <span>90%</span>
        </div>

        <div class="progress">
          <div class="progress-fill html"></div>
        </div>
      </div>

      <div class="progress-item">
        <div class="progress-header">
          <span>CSS</span>
          <span>80%</span>
        </div>

        <div class="progress">
          <div class="progress-fill css"></div>
        </div>
      </div>

      <div class="progress-item">
        <div class="progress-header">
          <span>JavaScript</span>
          <span>70%</span>
        </div>

        <div class="progress">
          <div class="progress-fill javascript"></div>
        </div>
      </div>

      <div class="progress-item">
        <div class="progress-header">
          <span>Accessibility</span>
          <span>60%</span>
        </div>

        <div class="progress">
          <div class="progress-fill accessibility"></div>
        </div>
      </div>

    </section>
  </main>

</body>
</html>
