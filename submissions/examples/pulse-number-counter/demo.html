<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Pulse Number Counter</title>

  <!-- EaseMotion CSS -->
  <link rel="stylesheet" href="../../../easemotion.css" />

  <!-- Component Styles -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<main class="counter-demo">

    <section class="counter-card ease-fade-in">

        <span class="counter-badge">
            Analytics
        </span>

        <h2 class="ease-slide-up">
            Total Revenue
        </h2>

        <div
            class="counter-value ease-pulse"
            aria-label="Total Revenue 128 thousand 450 dollars"
        >
            $128,450
        </div>

        <p class="counter-change">

            <span class="trend-up">
                ▲ +12.8%
            </span>

            compared to last month

        </p>

        <div class="counter-footer">

            <div class="metric">

                <span class="metric-label">
                    Customers
                </span>

                <strong>
                    4,286
                </strong>

            </div>

            <div class="metric">

                <span class="metric-label">
                    Conversion
                </span>

                <strong>
                    8.4%
                </strong>

            </div>

        </div>

    </section>

</main>

</body>
</html>
