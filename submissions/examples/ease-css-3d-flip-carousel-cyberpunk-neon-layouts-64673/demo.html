<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 3D-Flip Carousel - Cyberpunk Neon | EaseMotion CSS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="ease-carousel-wrapper">
        <!-- Hidden Radio Inputs -->
        <input type="radio" name="ease-carousel" id="ease-slide-1" checked>
        <input type="radio" name="ease-carousel" id="ease-slide-2">
        <input type="radio" name="ease-carousel" id="ease-slide-3">

        <!-- 3D Scene -->
        <div class="ease-carousel-scene">
            <article class="ease-carousel-card ease-card--1">
                <h2>Cyberpunk</h2>
                <p>Neon-infused layouts with glowing highlights and dark backdrops.</p>
            </article>
            
            <article class="ease-carousel-card ease-card--2">
                <h2>Performant</h2>
                <p>Pure CSS hardware-accelerated 3D transforms for buttery smooth 60fps animations.</p>
            </article>
            
            <article class="ease-carousel-card ease-card--3">
                <h2>Accessible</h2>
                <p>Built-in reduced motion queries to ensure a comfortable experience for everyone.</p>
            </article>
        </div>

        <!-- Navigation Controls -->
        <nav class="ease-carousel-nav" aria-label="Carousel Navigation">
            <label for="ease-slide-1" class="ease-nav-dot" aria-label="Go to slide 1"></label>
            <label for="ease-slide-2" class="ease-nav-dot" aria-label="Go to slide 2"></label>
            <label for="ease-slide-3" class="ease-nav-dot" aria-label="Go to slide 3"></label>
        </nav>
    </main>
</body>
</html>
