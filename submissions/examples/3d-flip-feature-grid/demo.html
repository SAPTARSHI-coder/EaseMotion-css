<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Flip Feature Grid</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<section class="feature-grid">

    <div class="card">
        <div class="card-inner">
            <div class="front">
                <h2>Portfolio</h2>
            </div>

            <div class="back">
                <h3>Creative Works</h3>
                <p>Responsive portfolio showcase with modern animations.</p>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-inner">
            <div class="front">
                <h2>Design</h2>
            </div>

            <div class="back">
                <h3>UI / UX</h3>
                <p>Clean interfaces with accessibility support.</p>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-inner">
            <div class="front">
                <h2>Development</h2>
            </div>

            <div class="back">
                <h3>Frontend</h3>
                <p>Pure HTML & CSS reusable component.</p>
            </div>
        </div>
    </div>

</section>

</body>
</html>
