<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Float-Drift Tooltip</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<section class="tooltip-section">

<h1>Gaming Hub Tooltips</h1>

<div class="tooltip-grid">

<div class="tooltip-item">
<button class="tooltip-btn">🗡️ Sword</button>
<span class="tooltip">Legendary melee weapon with +120 attack power.</span>
</div>

<div class="tooltip-item">
<button class="tooltip-btn">🛡️ Shield</button>
<span class="tooltip">Provides 85% damage resistance in battle.</span>
</div>

<div class="tooltip-item">
<button class="tooltip-btn">💎 Gem</button>
<span class="tooltip">Rare crystal used to unlock premium upgrades.</span>
</div>

<div class="tooltip-item">
<button class="tooltip-btn">⚡ Skill</button>
<span class="tooltip">Activates an ultimate ability with cooldown reduction.</span>
</div>

</div>

</section>

</body>
</html>
