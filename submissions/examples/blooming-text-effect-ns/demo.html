<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Blooming Text Effect | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="blooming-demo-container">
    
    <!-- Blooming Text Card Wrapper -->
    <article class="ease-blooming-wrapper">
      
      <!-- Accessible Heading with ARIA Label for Screen Readers -->
      <h1 class="ease-blooming-heading" aria-label="FLOURISH">
        <span class="ease-blooming-char" style="--char-index: 0" aria-hidden="true">F</span>
        <span class="ease-blooming-char" style="--char-index: 1" aria-hidden="true">L</span>
        <span class="ease-blooming-char" style="--char-index: 2" aria-hidden="true">O</span>
        <span class="ease-blooming-char" style="--char-index: 3" aria-hidden="true">U</span>
        <span class="ease-blooming-char" style="--char-index: 4" aria-hidden="true">R</span>
        <span class="ease-blooming-char" style="--char-index: 5" aria-hidden="true">I</span>
        <span class="ease-blooming-char" style="--char-index: 6" aria-hidden="true">S</span>
        <span class="ease-blooming-char" style="--char-index: 7" aria-hidden="true">H</span>
      </h1>

      <p class="ease-blooming-subtext">
        Pure CSS bloom typography effect. Characters scale, blossom, and glow outward sequentially on page render.
      </p>

    </article>

  </main>

</body>
</html>
