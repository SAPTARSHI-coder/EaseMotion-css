<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Glowing neumorphic treeview built with pure HTML and CSS."
  >

  <title>Glowing Treeview — Neumorphism</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="page">

    <section
      class="tree-card"
      aria-labelledby="tree-title"
    >

      <header class="tree-card__header">

        <div>
          <span class="tree-card__eyebrow">
            PROJECT NAVIGATOR
          </span>

          <h1 id="tree-title">
            Workspace
          </h1>
        </div>

        <span class="tree-card__status">
          ONLINE
        </span>

      </header>

      <nav
        class="tree"
        aria-label="Project file tree"
      >

        <details class="tree__group" open>

          <summary class="tree__item tree__item--folder">

            <span
              class="tree__chevron"
              aria-hidden="true"
            >›</span>

            <span
              class="tree__icon"
              aria-hidden="true"
            >▣</span>

            <span class="tree__label">
              src
            </span>

            <span class="tree__count">
              8
            </span>

          </summary>

          <div class="tree__children">

            <details class="tree__group" open>

              <summary class="tree__item tree__item--folder">

                <span
                  class="tree__chevron"
                  aria-hidden="true"
                >›</span>

                <span
                  class="tree__icon"
                  aria-hidden="true"
                >▣</span>

                <span class="tree__label">
                  components
                </span>

                <span class="tree__count">
                  4
                </span>

              </summary>

              <div class="tree__children">

                <a
                  class="tree__item tree__item--file"
                  href="#button"
                >
                  <span
                    class="tree__spacer"
                    aria-hidden="true"
                  ></span>

                  <span
                    class="tree__icon"
                    aria-hidden="true"
                  >◇</span>

                  <span class="tree__label">
                    Button.css
                  </span>
                </a>

                <a
                  class="tree__item tree__item--file"
                  href="#card"
                >
                  <span
                    class="tree__spacer"
                    aria-hidden="true"
                  ></span>

                  <span
                    class="tree__icon"
                    aria-hidden="true"
                  >◇</span>

                  <span class="tree__label">
                    Card.css
                  </span>
                </a>

                <a
                  class="tree__item tree__item--file"
                  href="#modal"
                >
                  <span
                    class="tree__spacer"
                    aria-hidden="true"
                  ></span>

                  <span
                    class="tree__icon"
                    aria-hidden="true"
                  >◇</span>

                  <span class="tree__label">
                    Modal.css
                  </span>
                </a>

                <a
                  class="tree__item tree__item--file"
                  href="#sidebar"
                >
                  <span
                    class="tree__spacer"
                    aria-hidden="true"
                  ></span>

                  <span
                    class="tree__icon"
                    aria-hidden="true"
                  >◇</span>

                  <span class="tree__label">
                    Sidebar.css
                  </span>
                </a>

              </div>

            </details>

            <a
              class="tree__item tree__item--file"
              href="#app"
            >
              <span
                class="tree__spacer"
                aria-hidden="true"
              ></span>

              <span
                class="tree__icon"
                aria-hidden="true"
              >◇</span>

              <span class="tree__label">
                App.jsx
              </span>
            </a>

            <a
              class="tree__item tree__item--file"
              href="#index"
            >
              <span
                class="tree__spacer"
                aria-hidden="true"
              ></span>

              <span
                class="tree__icon"
                aria-hidden="true"
              >◇</span>

              <span class="tree__label">
                index.css
              </span>
            </a>

          </div>

        </details>

        <details class="tree__group">

          <summary class="tree__item tree__item--folder">

            <span
              class="tree__chevron"
              aria-hidden="true"
            >›</span>

            <span
              class="tree__icon"
              aria-hidden="true"
            >▣</span>

            <span class="tree__label">
              public
            </span>

            <span class="tree__count">
              2
            </span>

          </summary>

          <div class="tree__children">

            <a
              class="tree__item tree__item--file"
              href="#logo"
            >
              <span
                class="tree__spacer"
                aria-hidden="true"
              ></span>

              <span
                class="tree__icon"
                aria-hidden="true"
              >◇</span>

              <span class="tree__label">
                logo.svg
              </span>
            </a>

            <a
              class="tree__item tree__item--file"
              href="#favicon"
            >
              <span
                class="tree__spacer"
                aria-hidden="true"
              ></span>

              <span
                class="tree__icon"
                aria-hidden="true"
              >◇</span>

              <span class="tree__label">
                favicon.svg
              </span>
            </a>

          </div>

        </details>

        <a
          class="tree__item tree__item--file"
          href="#package"
        >
          <span
            class="tree__spacer"
            aria-hidden="true"
          ></span>

          <span
            class="tree__icon"
            aria-hidden="true"
          >◇</span>

          <span class="tree__label">
            package.json
          </span>
        </a>

        <a
          class="tree__item tree__item--file"
          href="#readme"
        >
          <span
            class="tree__spacer"
            aria-hidden="true"
          ></span>

          <span
            class="tree__icon"
            aria-hidden="true"
          >◇</span>

          <span class="tree__label">
            README.md
          </span>
        </a>

      </nav>

      <footer class="tree-card__footer">

        <span>
          Pure CSS navigation
        </span>

        <span>
          12 items
        </span>

      </footer>

    </section>

  </main>

</body>
</html>
