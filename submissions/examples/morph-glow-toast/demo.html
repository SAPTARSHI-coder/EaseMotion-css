<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CSS Morph-Glow Toast for fintech dashboard layouts">
  <title>Morph-Glow Toast</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="dashboard">

```
<header class="header">
  <div>
    <span class="label">FINTECH DASHBOARD</span>
    <h1>Payment Overview</h1>
  </div>

  <div class="status">
    <span class="status-dot"></span>
    Secure Account
  </div>
</header>

<section class="cards">

  <article class="card">
    <span>Available Balance</span>
    <strong>$48,920.00</strong>
    <small>+8.2% this month</small>
  </article>

  <article class="card">
    <span>Total Revenue</span>
    <strong>$26,480.00</strong>
    <small>+14.5% this month</small>
  </article>

  <article class="card">
    <span>Pending Payments</span>
    <strong>$3,240.00</strong>
    <small>6 transactions pending</small>
  </article>

</section>

<aside class="toast" role="status" aria-live="polite">

  <div class="toast-icon" aria-hidden="true">
    ✓
  </div>

  <div class="toast-content">
    <strong>Payment Received</strong>
    <p>
      Your account received a payment of $2,480.00.
    </p>
  </div>

  <button class="toast-close" type="button" aria-label="Close notification">
    ×
  </button>

</aside>
```

  </main>

</body>
</html>
