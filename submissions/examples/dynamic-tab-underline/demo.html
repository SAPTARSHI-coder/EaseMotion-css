<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dynamic Tab Underline</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="tabs-nav">
    <input type="radio" id="tab1" name="tab-group" checked>
    <label for="tab1" class="tab-item">Home</label>
    <input type="radio" id="tab2" name="tab-group">
    <label for="tab2" class="tab-item">Settings</label>
    <div class="tab-slider"></div>
  </div>
</body>
</html>
