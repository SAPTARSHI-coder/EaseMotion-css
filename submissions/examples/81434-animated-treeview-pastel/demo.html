<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Animated pastel treeview component built with pure HTML and CSS."
  >

  <title>Animated Treeview — Pastel</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="page">

    <section
      class="tree-card"
      aria-labelledby="tree-title"
    >

      <header class="tree-card__header">

        <span class="tree-card__eyebrow">
          PROJECT EXPLORER
        </span>

        <h1 id="tree-title">
          Workspace Files
        </h1>

        <p class="tree-card__description">
          Explore the project structure using the
          interactive treeview.
        </p>

      </header>

      <nav
        class="tree"
        aria-label="Project file tree"
      >

        <details class="tree__branch" open>

          <summary class="tree__item tree__item--folder">
            <span
              class="tree__icon"
              aria-hidden="true"
            >
              ◆
            </span>

            <span class="tree__label">
              project
            </span>

            <span
              class="tree__count"
              aria-hidden="true"
            >
              4
            </span>
          </summary>

          <div class="tree__children">

            <details class="tree__branch" open>

              <summary class="tree__item tree__item--folder">
                <span
                  class="tree__icon"
                  aria-hidden="true"
                >
                  ◆
                </span>

                <span class="tree__label">
                  src
                </span>
              </summary>

              <div class="tree__children">

                <details class="tree__branch">

                  <summary class="tree__item tree__item--folder">
                    <span
                      class="tree__icon"
                      aria-hidden="true"
                    >
                      ◆
                    </span>

                    <span class="tree__label">
                      components
                    </span>
                  </summary>

                  <div class="tree__children">

                    <a
                      class="tree__item tree__item--file"
                      href="#button"
                    >
                      <span
                        class="tree__icon"
                        aria-hidden="true"
                      >
                        ●
                      </span>

                      <span class="tree__label">
                        Button.jsx
                      </span>
                    </a>

                    <a
                      class="tree__item tree__item--file"
                      href="#card"
                    >
                      <span
                        class="tree__icon"
                        aria-hidden="true"
                      >
                        ●
                      </span>

                      <span class="tree__label">
                        Card.jsx
                      </span>
                    </a>

                    <a
                      class="tree__item tree__item--file"
                      href="#modal"
                    >
                      <span
                        class="tree__icon"
                        aria-hidden="true"
                      >
                        ●
                      </span>

                      <span class="tree__label">
                        Modal.jsx
                      </span>
                    </a>

                  </div>

                </details>

                <a
                  class="tree__item tree__item--file"
                  href="#app"
                >
                  <span
                    class="tree__icon"
                    aria-hidden="true"
                  >
                    ●
                  </span>

                  <span class="tree__label">
                    App.jsx
                  </span>
                </a>

                <a
                  class="tree__item tree__item--file"
                  href="#main"
                >
                  <span
                    class="tree__icon"
                    aria-hidden="true"
                  >
                    ●
                  </span>

                  <span class="tree__label">
                    main.jsx
                  </span>
                </a>

              </div>

            </details>

            <details class="tree__branch">

              <summary class="tree__item tree__item--folder">
                <span
                  class="tree__icon"
                  aria-hidden="true"
                >
                  ◆
                </span>

                <span class="tree__label">
                  public
                </span>
              </summary>

              <div class="tree__children">

                <a
                  class="tree__item tree__item--file"
                  href="#logo"
                >
                  <span
                    class="tree__icon"
                    aria-hidden="true"
                  >
                    ●
                  </span>

                  <span class="tree__label">
                    logo.svg
                  </span>
                </a>

                <a
                  class="tree__item tree__item--file"
                  href="#favicon"
                >
                  <span
                    class="tree__icon"
                    aria-hidden="true"
                  >
                    ●
                  </span>

                  <span class="tree__label">
                    favicon.ico
                  </span>
                </a>

              </div>

            </details>

            <a
              class="tree__item tree__item--file"
              href="#package"
            >
              <span
                class="tree__icon"
                aria-hidden="true"
              >
                ●
              </span>

              <span class="tree__label">
                package.json
              </span>
            </a>

            <a
              class="tree__item tree__item--file"
              href="#readme"
            >
              <span
                class="tree__icon"
                aria-hidden="true"
              >
                ●
              </span>

              <span class="tree__label">
                README.md
              </span>
            </a>

          </div>

        </details>

      </nav>

      <footer class="tree-card__footer">

        <span>
          9 items
        </span>

        <span>
          CSS only
        </span>

      </footer>

    </section>

  </main>

</body>
</html>
