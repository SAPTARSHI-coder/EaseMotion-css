<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Shimmer-Sweep Toast</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="container">

    <h1>Shimmer-Sweep Toast</h1>

    <p class="subtitle">
        Elegant toast notifications with a CSS-only shimmer animation.
    </p>

    <!-- Success Toast -->

    <div
        class="toast success"
        role="status"
        aria-live="polite">

        <div class="toast-icon">
            ✓
        </div>

        <div class="toast-content">

            <h2>Success</h2>

            <p>
                Your changes have been saved successfully.
            </p>

        </div>

    </div>

    <!-- Warning Toast -->

    <div
        class="toast warning"
        role="status"
        aria-live="polite">

        <div class="toast-icon">
            !
        </div>

        <div class="toast-content">

            <h2>Warning</h2>

            <p>
                Storage space is running low.
            </p>

        </div>

    </div>

    <!-- Info Toast -->

    <div
        class="toast info"
        role="status"
        aria-live="polite">

        <div class="toast-icon">
            ℹ
        </div>

        <div class="toast-content">

            <h2>Information</h2>

            <p>
                A new version is available for download.
            </p>

        </div>

    </div>

</main>

</body>
</html>
