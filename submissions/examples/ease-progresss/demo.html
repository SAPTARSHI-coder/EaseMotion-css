<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animated Progress Bar Demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      display: flex;
      flex-direction: column;
      gap: 20px;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
    }
  </style>
</head>
<body>

  <h3>Standard Progress Bar</h3>
  <div class="progress">
    <div class="progress-bar" style="--progress: 65%;"></div>
  </div>

  <h3>Animated Striped Progress Bar</h3>
  <div class="progress">
    <div class="progress-bar progress-bar-striped" style="--progress: 85%;"></div>
  </div>

</body>
</html>
