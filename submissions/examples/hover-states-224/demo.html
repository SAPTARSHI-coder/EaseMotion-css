<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Interactive responsive heatmap grid with tooltip states">
    <title>Interactive Heatmap Grid</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="page">
    <section class="heatmap-card">

        <div class="header">
            <div>
                <p class="eyebrow">ACTIVITY INSIGHTS</p>
                <h1>Weekly Heatmap</h1>
                <p class="subtitle">
                    Hover over each cell to explore activity levels.
                </p>
            </div>

            <div class="legend">
                <span>Less</span>
                <i class="level level-1"></i>
                <i class="level level-2"></i>
                <i class="level level-3"></i>
                <i class="level level-4"></i>
                <span>More</span>
            </div>
        </div>

        <div class="heatmap-wrapper">

            <div class="days">
                <span>Mon</span>
                <span>Tue</span>
                <span>Wed</span>
                <span>Thu</span>
                <span>Fri</span>
                <span>Sat</span>
                <span>Sun</span>
            </div>

            <div class="heatmap" id="heatmap" aria-label="Weekly activity heatmap">
            </div>

        </div>

        <div class="footer">
            <span id="activityCount">0 activities</span>
            <span>Hover a cell for details</span>
        </div>

    </section>
</main>

<script src="script.js"></script>
</body>
</html>
