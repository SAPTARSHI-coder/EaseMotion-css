<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CSS Zoom-In Dropdown for Fintech Dashboard Layouts">
  <title>Zoom-In Dropdown | EaseMotion</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="dashboard">
    <section class="dashboard-header">
      <div>
        <p class="eyebrow">FINTECH DASHBOARD</p>
        <h1>Financial Overview</h1>
        <p class="subtitle">Manage your portfolio and account activity.</p>
      </div>

      <div class="dropdown">
        <button
          class="dropdown-trigger"
          type="button"
          aria-label="Open account menu"
        >
          <span class="avatar">SM</span>
          <span class="account-info">
            <strong>Srujana M.</strong>
            <small>Premium Account</small>
          </span>
          <span class="arrow" aria-hidden="true">⌄</span>
        </button>

        <div class="dropdown-menu">
          <a href="#profile">
            <span>👤</span>
            Profile
          </a>

          <a href="#transactions">
            <span>↗</span>
            Transactions
          </a>

          <a href="#settings">
            <span>⚙</span>
            Account Settings
          </a>

          <a href="#support">
            <span>?</span>
            Support
          </a>
        </div>
      </div>
    </section>

    <section class="stats-grid" aria-label="Financial statistics">
      <article class="stat-card">
        <span>Total Balance</span>
        <strong>$48,920.50</strong>
        <small>+8.4% this month</small>
      </article>

      <article class="stat-card">
        <span>Investments</span>
        <strong>$31,450.20</strong>
        <small>+5.7% this month</small>
      </article>

      <article class="stat-card">
        <span>Monthly Income</span>
        <strong>$8,250.00</strong>
        <small>+12.2% this month</small>
      </article>
    </section>
  </main>

</body>
</html>
