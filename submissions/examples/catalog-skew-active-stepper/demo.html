<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Skew-Active Stepper</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="catalog-layout">
        
        <h1 class="catalog-title">Checkout Process</h1>
        
        <!-- The Stepper Component -->
        <div class="stepper-container">
            <!-- Step 1 (Completed) -->
            <div class="step completed">
                <div class="step-indicator">
                    <span class="step-icon">✓</span>
                </div>
                <div class="step-label">Cart</div>
            </div>
            
            <div class="step-connector completed-connector"></div>
            
            <!-- Step 2 (Active) -->
            <div class="step active">
                <div class="step-indicator">
                    <span class="step-number">2</span>
                </div>
                <div class="step-label">Shipping</div>
            </div>
            
            <div class="step-connector"></div>
            
            <!-- Step 3 (Pending) -->
            <div class="step">
                <div class="step-indicator">
                    <span class="step-number">3</span>
                </div>
                <div class="step-label">Payment</div>
            </div>
            
            <div class="step-connector"></div>
            
            <!-- Step 4 (Pending) -->
            <div class="step">
                <div class="step-indicator">
                    <span class="step-number">4</span>
                </div>
                <div class="step-label">Review</div>
            </div>
        </div>
        
        <!-- Dummy Content Area for Context -->
        <div class="content-area">
            <h2>Step 2: Shipping Details</h2>
            <p>Please provide your delivery address for the items.</p>
            
            <div class="form-group">
                <input type="text" class="input-field" placeholder="Full Name" value="John Doe">
            </div>
            <div class="form-group">
                <input type="text" class="input-field" placeholder="Address" value="123 Main St">
            </div>
            
            <div class="actions">
                <button class="btn btn-secondary">Back to Cart</button>
                <button class="btn btn-primary active-skew-btn">Continue to Payment</button>
            </div>
        </div>
        
    </div>
</body>
</html>
