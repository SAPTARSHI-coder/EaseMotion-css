<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 3D Effect: Retro Arcade Pixel - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="em-retro-page">
        <!-- Background 3D Retro Arcade Pixel Animation Layer -->
        <div class="em-retro-bg" aria-hidden="true">
            <span class="em-retro-pixel" style="--x:10vw; --y:15vh; --d:0s;"></span>
            <span class="em-retro-pixel" style="--x:85vw; --y:20vh; --d:0.4s;"></span>
            <span class="em-retro-pixel" style="--x:20vw; --y:80vh; --d:0.8s;"></span>
            <span class="em-retro-pixel" style="--x:80vw; --y:75vh; --d:1.2s;"></span>
            <span class="em-retro-pixel" style="--x:50vw; --y:10vh; --d:1.6s;"></span>
            <span class="em-retro-pixel" style="--x:15vw; --y:50vh; --d:2s;"></span>
            <span class="em-retro-pixel" style="--x:85vw; --y:55vh; --d:2.4s;"></span>
        </div>

        <div class="em-card" role="region" aria-label="Retro Arcade Pixel 3D Showcase" tabindex="0">
            <span class="em-card-badge">3D ANIMATIONS</span>
            <h1 class="em-card-title">Retro Arcade Pixel</h1>
            <p class="em-card-desc">A smooth, hardware-accelerated pure CSS 3D animation featuring retro arcade pixel styling and dark mode compatibility.</p>
            <a href="#" class="em-card-btn" role="button">Explore Effects</a>
        </div>
    </div>
</body>
</html>
