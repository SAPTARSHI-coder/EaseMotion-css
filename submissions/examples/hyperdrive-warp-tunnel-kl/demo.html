<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hyperdrive Warp Tunnel - EaseMotion CSS</title>
    <!-- Include EaseMotion Core Stylesheet -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030712; color: #ffffff;">

    <div class="ease-card ease-card-glass warp-container">
        <div class="warp-header">
            <h2>Hyperdrive</h2>
            <span class="ease-badge ease-badge-primary">Warp 9</span>
        </div>
        
        <div class="warp-screen ease-center">
            <div class="warp-streak s-1"></div>
            <div class="warp-streak s-2"></div>
            <div class="warp-streak s-3"></div>
            <div class="warp-core ease-center"></div>
        </div>

        <div class="warp-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Velocity: 12.4c</span>
            <button class="ease-btn ease-btn-primary ease-btn-sm ease-hover-grow">Engage</button>
        </div>
    </div>

</body>
</html>
