<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Profile Card - EaseMotion CSS</title>
    <!-- EaseMotion CSS CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="ease-center">
    <div class="ease-fade-in ease-delay-100">
        <!-- The main card using ease-card and hover lift effect -->
        <div class="profile-card ease-card ease-hover-lift ease-slide-up ease-delay-200">
            <div class="profile-banner"></div>
            
            <!-- Avatar with hover grow -->
            <img src="https://i.pravatar.cc/150?img=3" alt="Profile" class="profile-img ease-hover-grow">
            
            <!-- Staggered text animations using delays -->
            <h2 class="profile-name ease-slide-up ease-delay-300">Jane Doe</h2>
            <p class="profile-role ease-slide-up ease-delay-400">Frontend Developer</p>
            
            <!-- Stats using ease-flex layout utilities -->
            <div class="profile-stats ease-flex ease-justify-between ease-gap-4 ease-slide-up ease-delay-500">
                <div class="stat">
                    <span class="stat-value">124</span>
                    <span class="stat-label">Posts</span>
                </div>
                <div class="stat">
                    <span class="stat-value">12.5k</span>
                    <span class="stat-label">Followers</span>
                </div>
                <div class="stat">
                    <span class="stat-value">842</span>
                    <span class="stat-label">Following</span>
                </div>
            </div>
            
            <!-- Primary Button -->
            <button class="ease-btn ease-btn-primary ease-hover-grow ease-slide-up ease-delay-600">
                Follow
            </button>
        </div>
    </div>
</body>
</html>
