<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Status Code Badge &mdash; EaseMotion CSS Demo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="page-head">
    <p class="kicker">EaseMotion CSS &middot; Dev Tools</p>
    <h1>Status Code Badge</h1>
    <p class="sub">Every endpoint gets a live, pulsing health dot.</p>
  </header>
  <main class="stage">
    <div class="sc-row">
      <span class="sc-badge sc-ok"><span class="sc-dot"></span>200 OK</span>
      <span class="sc-badge sc-warn"><span class="sc-dot"></span>429 Slow</span>
      <span class="sc-badge sc-err"><span class="sc-dot"></span>503 Down</span>
    </div>
  </main>
  <p class="stage-caption">The ping ring fades out of each dot forever.</p>
  <footer class="page-foot">
    <span>Pure CSS &middot; zero dependencies</span>
    <span>Pulsing status</span>
  </footer>
</body>
</html>
