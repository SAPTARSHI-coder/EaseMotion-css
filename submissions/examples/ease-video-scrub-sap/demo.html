<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ease-video-scrub-sap demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f4f4f5;
    }
  </style>
</head>
<body>

  <div class="video-scrub-sap">
    <video id="vid" src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4" muted></video>
    <div class="scrub-controls">
      <button class="play-btn" id="playBtn" aria-label="Play">
        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <span class="time-label" id="timeLabel">0:00</span>
      <div class="scrub-track" id="scrubTrack">
        <div class="scrub-fill" id="scrubFill"></div>
        <div class="scrub-thumb" id="scrubThumb"></div>
      </div>
    </div>
  </div>

  <script>
    const vid = document.getElementById('vid');
    const playBtn = document.getElementById('playBtn');
    const track = document.getElementById('scrubTrack');
    const fill = document.getElementById('scrubFill');
    const thumb = document.getElementById('scrubThumb');
    const timeLabel = document.getElementById('timeLabel');

    function formatTime(s) {
      const m = Math.floor(s / 60);
      const sec = Math.floor(s % 60).toString().padStart(2, '0');
      return `${m}:${sec}`;
    }

    playBtn.addEventListener('click', () => {
      if (vid.paused) {
        vid.play();
        playBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>';
      } else {
        vid.pause();
        playBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
      }
    });

    vid.addEventListener('timeupdate', () => {
      const pct = (vid.currentTime / vid.duration) * 100 || 0;
      fill.style.width = pct + '%';
      thumb.style.left = pct + '%';
      timeLabel.textContent = formatTime(vid.currentTime);
    });

    track.addEventListener('click', (e) => {
      const rect = track.getBoundingClientRect();
      const pct = (e.clientX - rect.left) / rect.width;
      vid.currentTime = pct * vid.duration;
    });
  </script>

</body>
</html>
