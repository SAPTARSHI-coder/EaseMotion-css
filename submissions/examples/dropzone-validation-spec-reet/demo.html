<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EaseMotion - File Validation Tests</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="test-container">
        <h2>Dropzone Validation Tests</h2>
        <div id="results"></div>
    </div>
    <script>
        const validateDropFile = (file, options = {}) => {
            if (!file) return { valid: false, error: 'No file provided.' };
            const { maxSize = 5 * 1024 * 1024, accept = '*' } = options;
            if (file.size > maxSize) return { valid: false, error: `File exceeds ${(maxSize/1024/1024).toFixed(1)}MB limit.` };
            if (accept !== '*') {
                const acceptedTypes = accept.split(',').map(t => t.trim().toLowerCase());
                const fileType = file.type ? file.type.toLowerCase() : '';
                const fileExt = file.name ? '.' + file.name.split('.').pop().toLowerCase() : '';
                const isAccepted = acceptedTypes.some(type => {
                    if (type.startsWith('.')) return fileExt === type;
                    if (type.endsWith('/*')) return fileType.startsWith(type.split('/')[0] + '/');
                    return fileType === type;
                });
                if (!isAccepted) return { valid: false, error: 'Invalid file type.' };
            }
            return { valid: true, error: null };
        };

        const resultsDiv = document.getElementById('results');
        const runTest = (name, assertion) => {
            const div = document.createElement('div');
            try {
                assertion();
                div.className = 'test-result test-pass';
                div.textContent = '✅ PASS: ' + name;
            } catch (e) {
                div.className = 'test-result test-fail';
                div.textContent = '❌ FAIL: ' + name + ' - ' + e.message;
            }
            resultsDiv.appendChild(div);
        };

        // Mock File
        const createMockFile = (name, size, type) => ({ name, size, type });

        runTest('Valid file under size limit', () => {
            const f = createMockFile('test.png', 2 * 1024 * 1024, 'image/png');
            if(!validateDropFile(f, { maxSize: 5000000 }).valid) throw new Error('Expected true');
        });

        runTest('Rejects file over size limit', () => {
            const f = createMockFile('big.mp4', 10 * 1024 * 1024, 'video/mp4');
            if(validateDropFile(f, { maxSize: 5000000 }).valid) throw new Error('Expected false');
        });
    </script>
</body>
</html>
