<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bouncing Dots Preloader — EaseMotion-css</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <p class="demo-heading">Bouncing Dots Preloader</p>

  <div class="bouncing-dots-loader">
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>

  <div class="bouncing-dots-loader success">
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>

  <div class="bouncing-dots-loader danger">
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>

</body>
</html>
