<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Select Dropdown | EaseMotion CSS</title><link rel="stylesheet" href="style.css"></head>
<body><div class="sds-root">
<div class="sds-card">
<h2 class="sds-title">Registration</h2>
<div class="sds-field"><label class="sds-label">Country</label><div class="sds-wrap"><select class="sds-select"><option>Select country</option><option>United States</option><option>United Kingdom</option><option>Germany</option><option>France</option><option>Japan</option><option>Australia</option></select></div></div>
<div class="sds-field"><label class="sds-label">Role</label><div class="sds-wrap"><select class="sds-select"><option>Select role</option><option>Frontend Developer</option><option>Backend Developer</option><option>Full Stack Developer</option><option>DevOps Engineer</option><option>Designer</option></select></div></div>
</div>
<p class="sds-sub">Pure CSS styled select dropdowns with focus ring and arrow indicator</p>
</div></body></html>
