<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Interactive responsive pagination with dark mode styling">
    <title>Interactive Pagination - Dark Mode</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="page-container">

        <section class="pagination-card">

            <div class="content">
                <span class="badge">CSS COMPONENT</span>
                <h1>Interactive Pagination</h1>
                <p>
                    A responsive pagination component with smooth interactions
                    and a modern dark mode design.
                </p>
            </div>

            <nav class="pagination" aria-label="Pagination">

                <button class="page-btn arrow" aria-label="Previous page">
                    &#10094;
                </button>

                <button class="page-btn active">1</button>
                <button class="page-btn">2</button>
                <button class="page-btn">3</button>
                <button class="page-btn">4</button>
                <button class="page-btn">5</button>

                <span class="dots">...</span>

                <button class="page-btn">10</button>

                <button class="page-btn arrow" aria-label="Next page">
                    &#10095;
                </button>

            </nav>

        </section>

    </main>

</body>
</html>
