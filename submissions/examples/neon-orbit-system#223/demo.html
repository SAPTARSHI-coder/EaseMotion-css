<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Orbit System | EaseMotion CSS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="orbit-scene">
        <!-- Central Core -->
        <div class="core">
            <div class="core-glow"></div>
            <div class="core-inner"></div>
        </div>

        <!-- Orbit Ring 1 -->
        <div class="orbit-ring ring-1">
            <div class="orbiter orbiter-1">
                <div class="orbiter-glow"></div>
            </div>
        </div>

        <!-- Orbit Ring 2 -->
        <div class="orbit-ring ring-2">
            <div class="orbiter orbiter-2">
                <div class="orbiter-glow"></div>
            </div>
            <div class="orbiter orbiter-2b">
                <div class="orbiter-glow"></div>
            </div>
        </div>

        <!-- Orbit Ring 3 -->
        <div class="orbit-ring ring-3">
            <div class="orbiter orbiter-3">
                <div class="orbiter-glow"></div>
            </div>
            <div class="orbiter orbiter-3b">
                <div class="orbiter-glow"></div>
            </div>
            <div class="orbiter orbiter-3c">
                <div class="orbiter-glow"></div>
            </div>
        </div>

        <!-- Orbit Ring 4 (Outer) -->
        <div class="orbit-ring ring-4">
            <div class="orbiter orbiter-4">
                <div class="orbiter-glow"></div>
            </div>
        </div>

        <!-- Pulse Waves -->
        <div class="pulse-wave pw-1"></div>
        <div class="pulse-wave pw-2"></div>
        <div class="pulse-wave pw-3"></div>

        <!-- Background Stars -->
        <div class="stars">
            <span class="star s1"></span>
            <span class="star s2"></span>
            <span class="star s3"></span>
            <span class="star s4"></span>
            <span class="star s5"></span>
            <span class="star s6"></span>
            <span class="star s7"></span>
            <span class="star s8"></span>
        </div>
    </div>
</body>
</html>
