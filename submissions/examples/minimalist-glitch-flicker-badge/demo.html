<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Glitch-Flicker Badge - Minimalist Tech</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="layout-container">
        
        <header class="section-header">
            <h1 class="title">System Services</h1>
            <p class="subtitle">Real-time status of critical infrastructure components.</p>
        </header>

        <div class="services-grid">
            
            <!-- Service 1 (Stable) -->
            <div class="service-card">
                <div class="service-info">
                    <h3 class="service-name">Authentication API</h3>
                    <p class="service-desc">OAuth2 & JWT issuing endpoints</p>
                </div>
                <div class="badge badge-stable">
                    OPERATIONAL
                </div>
            </div>

            <!-- Service 2 (Warning with Glitch) -->
            <div class="service-card">
                <div class="service-info">
                    <h3 class="service-name">Database Cluster</h3>
                    <p class="service-desc">Primary PostgreSQL read replicas</p>
                </div>
                <!-- The Glitch Badge -->
                <div class="badge badge-warning glitch-badge" data-text="DEGRADED">
                    DEGRADED
                </div>
            </div>

            <!-- Service 3 (Critical with Flicker) -->
            <div class="service-card">
                <div class="service-info">
                    <h3 class="service-name">Payment Gateway</h3>
                    <p class="service-desc">Third-party transaction processing</p>
                </div>
                <!-- The Flicker Badge -->
                <div class="badge badge-critical flicker-badge">
                    OFFLINE
                </div>
            </div>

        </div>
        
    </div>
</body>
</html>
