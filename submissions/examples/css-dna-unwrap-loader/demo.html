<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS DNA Unwrap Loader</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>DNA Unwrap Loader</h1>

    <div
      class="dna-loader"
      role="status"
      aria-label="Loading content"
    >
      <span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span>
    </div>

    <p>Simulating DNA strand unwinding and rewinding.</p>
  </div>
</body>
</html>
