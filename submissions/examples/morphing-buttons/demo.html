<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Morphing Buttons</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="container">
    <h1>Morphing Buttons</h1>
    <p class="description">
      CSS-only buttons with smooth shape transformation effects.
    </p>

    <section class="button-group" aria-label="Morphing button examples">

      <button class="morph-btn morph-circle">
        Hover Me
      </button>

      <button class="morph-btn morph-pill">
        Explore
      </button>

      <button class="morph-btn morph-square">
        Get Started
      </button>

    </section>
  </main>

</body>
</html>
