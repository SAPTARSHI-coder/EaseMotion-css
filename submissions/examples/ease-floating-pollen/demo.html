<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Floating Pollen – Pollen Particles Float Gracefully</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <h1>🌼 Floating Pollen</h1>
    <p class="subtitle">Pollen particles float gracefully through the air</p>

    <div class="pollen-container">
      <div class="pollen-stage" id="pollenStage">
        <canvas id="canvas"></canvas>
        
        <!-- Info overlay -->
        <div class="info-overlay">
          <span class="pollen-status" id="pollenStatus">🌼 Floating</span>
          <span class="pollen-count" id="pollenCount">✦ 0 particles</span>
        </div>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <button class="ctrl-btn add" id="addBtn">🌼 Add</button>
      <button class="ctrl-btn clear" id="clearBtn">🗑️ Clear</button>
      <button class="ctrl-btn toggle" id="toggleBtn">⏸ Pause</button>
      <button class="ctrl-btn reset" id="resetBtn">↺ Reset</button>
    </div>

    <!-- Sliders -->
    <div class="slider-container">
      <span class="slider-label">Pollen Count</span>
      <input type="range" id="countSlider" min="10" max="100" value="40" step="5" />
      <span class="slider-value" id="countValue">40</span>
    </div>

    <div class="slider-container">
      <span class="slider-label">Float Speed</span>
      <input type="range" id="speedSlider" min="1" max="10" value="5" />
      <span class="slider-value" id="speedValue">5×</span>
    </div>

    <div class="slider-container">
      <span class="slider-label">Drift Amount</span>
      <input type="range" id="driftSlider" min="0" max="100" value="50" />
      <span class="slider-value" id="driftValue">50%</span>
    </div>

    <div class="slider-container">
      <span class="slider-label">Particle Size</span>
      <input type="range" id="sizeSlider" min="1" max="6" value="3" step="0.5" />
      <span class="slider-value" id="sizeValue">3px</span>
    </div>

    <!-- Status -->
    <div class="status" id="status">🌼 Pollen particles floating gracefully</div>

    <!-- Keyboard shortcuts -->
    <div class="shortcuts">
      <kbd>A</kbd> Add · <kbd>C</kbd> Clear · <kbd>Space</kbd> Pause · <kbd>R</kbd> Reset
    </div>
  </div>

  <script>
    (function() {
      "use strict";

      // DOM elements
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      const pollenStatus = document.getElementById('pollenStatus');
      const pollenCount = document.getElementById('pollenCount');
      const addBtn = document.getElementById('addBtn');
      const clearBtn = document.getElementById('clearBtn');
      const toggleBtn = document.getElementById('toggleBtn');
      const resetBtn = document.getElementById('resetBtn');
      const status = document.getElementById('status');
      const countSlider = document.getElementById('countSlider');
      const countValue = document.getElementById('countValue');
      const speedSlider = document.getElementById('speedSlider');
      const speedValue = document.getElementById('speedValue');
      const driftSlider = document.getElementById('driftSlider');
      const driftValue = document.getElementById('driftValue');
      const sizeSlider = document.getElementById('sizeSlider');
      const sizeValue = document.getElementById('sizeValue');

      // State
      let pollen = [];
      let isPaused = false;
      let animationId = null;
      let time = 0;

      // Pollen colors (warm yellows, golds, soft oranges)
      const POLLEN_COLORS = [
        '#f9d976', '#f5c64a', '#f0b830', '#f5d76e',
        '#f7dc6f', '#f4d03f', '#f1c40f', '#f39c12',
        '#e67e22', '#f5b041', '#fad7a0', '#fdedec'
      ];

      // ----- Canvas setup -----
      function setupCanvas() {
        const rect = canvas.parentElement.getBoundingClientRect();
        const size = Math.min(rect.width - 40, 600);
        canvas.width = size;
        canvas.height = size;
        canvas.style.width = size + 'px';
        canvas.style.height = size + 'px';
      }

      // ----- Pollen class -----
      class Pollen {
        constructor() {
          const w = canvas.width;
          const h = canvas.height;
          const padding = 30;
          
          this.x = padding + Math.random() * (w - padding * 2);
          this.y = padding + Math.random() * (h - padding * 2);
          this.size = 1 + Math.random() * 4;
          this.baseSize = this.size;
          this.speed = 0.2 + Math.random() * 0.5;
          this.driftX = (Math.random() - 0.5) * 0.3;
          this.driftY = (Math.random() - 0.5) * 0.2;
          this.phase = Math.random() * Math.PI * 2;
          this.wobbleSpeed = 0.01 + Math.random() * 0.02;
          this.wobbleAmount = 0.3 + Math.random() * 0.7;
          this.color = POLLEN_COLORS[Math.floor(Math.random() * POLLEN_COLORS.length)];
          this.opacity = 0.3 + Math.random() * 0.5;
          this.glowSize = this.size * 3;
          this.rotation = Math.random() * Math.PI * 2;
          this.rotationSpeed = (Math.random() - 0.5) * 0.02;
          this.trail = [];
          this.trailLength = 3 + Math.floor(Math.random() * 5);
          this.alive = true;
          this.hoverOffset = 0;
        }

        update(speedMult, driftAmount) {
          const w = canvas.width;
          const h = canvas.height;
          const drift = driftAmount / 100;

          // Floating motion with sine waves
          this.hoverOffset += 0.01 * speedMult;
          const floatY = Math.sin(this.hoverOffset * 2 + this.phase) * 0.3;
          const floatX = Math.cos(this.hoverOffset * 1.7 + this.phase * 0.7) * 0.3;

          // Drift
          this.driftX += (Math.random() - 0.5) * 0.01 * drift;
          this.driftY += (Math.random() - 0.5) * 0.01 * drift;
          this.driftX *= 0.995;
          this.driftY *= 0.995;

          // Movement
          this.x += this.driftX * speedMult + floatX * 0.1;
          this.y += this.driftY * speedMult + floatY * 0.1;

          // Gentle wobble
          this.x += Math.sin(time * this.wobbleSpeed + this.phase) * this.wobbleAmount * 0.02;
          this.y += Math.cos(time * this.wobbleSpeed * 0.7 + this.phase) * this.wobbleAmount * 0.02;

          // Rotation
          this.rotation += this.rotationSpeed * speedMult;

          // Pulse size
          this.size = this.baseSize * (0.8 + 0.2 * Math.sin(time * 0.5 + this.phase));

          // Update trail
          this.trail.push({ x: this.x, y: this.y });
          if (this.trail.length > this.trailLength) {
            this.trail.shift();
          }

          // Keep within bounds with soft boundary
          const padding = 10;
          if (this.x < padding) { this.x = padding; this.driftX = Math.abs(this.driftX); }
          if (this.x > w - padding) { this.x = w - padding; this.driftX = -Math.abs(this.driftX); }
          if (this.y < padding) { this.y = padding; this.driftY = Math.abs(this.driftY); }
          if (this.y > h - padding) { this.y = h - padding; this.driftY = -Math.abs(this.driftY); }
        }

        draw(ctx, sizeMult) {
          const size = this.size * sizeMult;
          const alpha = this.opacity * (0.5 + 0.5 * (0.5 + 0.5 * Math.sin(time * 0.3 + this.phase)));

          // Draw trail
          if (this.trail.length > 1) {
            for (let i = 0; i < this.trail.length - 1; i++) {
              const t = i / this.trail.length;
              const trailAlpha = alpha * t * 0.15;
              const trailSize = size * t * 0.3;
              ctx.fillStyle = this.color + Math.round(trailAlpha * 255).toString(16).padStart(2, '0');
              ctx.beginPath();
              ctx.arc(this.trail[i].x, this.trail[i].y, trailSize, 0, Math.PI * 2);
              ctx.fill();
            }
          }

          // Glow
          const glowSize = size * 4;
          const gradient = ctx.createRadialGradient(
            this.x, this.y, 0,
            this.x, this.y, glowSize
          );
          const glowAlpha = alpha * 0.15;
          gradient.addColorStop(0, this.color + Math.round(glowAlpha * 255).toString(16).padStart(2, '0'));
          gradient.addColorStop(1, this.color + '00');
          ctx.fillStyle = gradient;
          ctx.beginPath();
          ctx.arc(this.x, this.y, glowSize, 0, Math.PI * 2);
          ctx.fill();

          // Core particle
          ctx.save();
          ctx.translate(this.x, this.y);
          ctx.rotate(this.rotation);

          // Shadow
          ctx.shadowColor = this.color + '44';
          ctx.shadowBlur = 8;

          // Main body with gradient
          const grad = ctx.createRadialGradient(
            -size * 0.2, -size * 0.2, 0,
            0, 0, size
          );
          grad.addColorStop(0, this.color);
          grad.addColorStop(0.5, this.color);
          grad.addColorStop(1, this.darkenColor(this.color, 30));

          ctx.fillStyle = grad;
          ctx.beginPath();

          // Irregular pollen shape (slightly bumpy circle)
          const segments = 12;
          for (let i = 0; i <= segments; i++) {
            const angle = (i / segments) * Math.PI * 2;
            const bump = 1 + 0.15 * Math.sin(angle * 3 + time * 0.5 + this.phase);
            const r = size * bump;
            const x = Math.cos(angle) * r;
            const y = Math.sin(angle) * r;
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          }
          ctx.closePath();
          ctx.fill();

          ctx.shadowBlur = 0;

          // Highlight
          ctx.fillStyle = `rgba(255, 255, 255, ${alpha * 0.15})`;
          ctx.beginPath();
          ctx.arc(-size * 0.15, -size * 0.2, size * 0.2, 0, Math.PI * 2);
          ctx.fill();

          // Tiny spikes (pollen texture)
          if (size > 1.5) {
            ctx.strokeStyle = `rgba(255, 255, 255, ${alpha * 0.05})`;
            ctx.lineWidth = 0.5;
            for (let i = 0; i < 6; i++) {
              const angle = (i / 6) * Math.PI * 2 + time * 0.1 + this.phase;
              const r = size * (0.9 + 0.1 * Math.sin(time * 0.3 + i));
              const x1 = Math.cos(angle) * r * 0.8;
              const y1 = Math.sin(angle) * r * 0.8;
              const x2 = Math.cos(angle) * r * 1.1;
              const y2 = Math.sin(angle) * r * 1.1;
              ctx.beginPath();
              ctx.moveTo(x1, y1);
              ctx.lineTo(x2, y2);
              ctx.stroke();
            }
          }

          ctx.restore();
        }

        darkenColor(color, percent) {
          const num = parseInt(color.replace('#', ''), 16);
          const amt = Math.round(2.55 * percent);
          const R = Math.max(0, (num >> 16) - amt);
          const G = Math.max(0, ((num >> 8) & 0x00FF) - amt);
          const B = Math.max(0, (num & 0x0000FF) - amt);
          return '#' + (0x1000000 + R * 0x10000 + G * 0x100 + B).toString(16).slice(1);
        }
      }

      // ----- Generate pollen -----
      function generatePollen(count) {
        const w = canvas.width;
        const h = canvas.height;
        const padding = 30;
        
        for (let i = 0; i < count; i++) {
          const p = new Pollen();
          p.x = padding + Math.random() * (w - padding * 2);
          p.y = padding + Math.random() * (h - padding * 2);
          pollen.push(p);
        }
        pollenCount.textContent = `✦ ${pollen.length} particles`;
        countValue.textContent = pollen.length;
      }

      // ----- Add pollen -----
      function addPollen(count = 5) {
        const w = canvas.width;
        const h = canvas.height;
        const padding = 30;
        
        for (let i = 0; i < count; i++) {
          const p = new Pollen();
          p.x = padding + Math.random() * (w - padding * 2);
          p.y = padding + Math.random() * (h - padding * 2);
          pollen.push(p);
        }
        pollenCount.textContent = `✦ ${pollen.length} particles`;
        status.textContent = `🌼 Added ${count} particles (${pollen.length} total)`;
        setTimeout(() => {
          status.textContent = '🌼 Pollen particles floating gracefully';
        }, 1500);
      }

      // ----- Clear pollen -----
      function clearPollen() {
        pollen = [];
        pollenCount.textContent = '✦ 0 particles';
        pollenStatus.textContent = '🌼 Empty';
        status.textContent = '🗑️ Pollen cleared';
        setTimeout(() => {
          status.textContent = '🌼 Click Add to start floating';
        }, 1000);
      }

      // ----- Toggle pause -----
      function togglePause() {
        isPaused = !isPaused;
        toggleBtn.textContent = isPaused ? '▶ Play' : '⏸ Pause';
        status.textContent = isPaused ? '⏸ Paused' : '▶ Resumed';
        pollenStatus.textContent = isPaused ? '⏸ Paused' : '🌼 Floating';
      }

      // ----- Reset -----
      function resetPollen() {
        pollen = [];
        isPaused = false;
        toggleBtn.textContent = '⏸ Pause';
        pollenStatus.textContent = '🌼 Floating';
        countSlider.value = 40;
        countValue.textContent = '40';
        speedSlider.value = 5;
        speedValue.textContent = '5×';
        driftSlider.value = 50;
        driftValue.textContent = '50%';
        sizeSlider.value = 3;
        sizeValue.textContent = '3px';
        generatePollen(40);
        status.textContent = '↺ Reset';
        setTimeout(() => {
          status.textContent = '🌼 Pollen particles floating gracefully';
        }, 500);
      }

      // ----- Draw background -----
      function drawBackground() {
        const w = canvas.width;
        const h = canvas.height;
        const cx = w / 2;
        const cy = h / 2;

        // Warm, soft background
        const bgGradient = ctx.createRadialGradient(cx, cy * 0.6, 0, cx, cy * 0.6, w * 0.7);
        bgGradient.addColorStop(0, '#1a1a2e');
        bgGradient.addColorStop(0.3, '#141428');
        bgGradient.addColorStop(0.7, '#0d0d1a');
        bgGradient.addColorStop(1, '#06060a');
        ctx.fillStyle = bgGradient;
        ctx.fillRect(0, 0, w, h);

        // Subtle light rays
        for (let i = 0; i < 8; i++) {
          const angle = (i / 8) * Math.PI * 2 + time * 0.01;
          const length = w * 0.4;
          const alpha = 0.01 + (i % 3) * 0.005;
          ctx.strokeStyle = `rgba(255, 200, 150, ${alpha})`;
          ctx.lineWidth = 0.5;
          ctx.beginPath();
          ctx.moveTo(cx, cy);
          ctx.lineTo(cx + Math.cos(angle) * length, cy + Math.sin(angle) * length);
          ctx.stroke();
        }

        // Soft glow spots (ambient light)
        for (let i = 0; i < 5; i++) {
          const seed = i * 137.508;
          const x = (seed * 0.618) % w;
          const y = (seed * 0.381) % h;
          const size = 30 + (seed % 60);
          const alpha = 0.01 + (seed % 100) / 100 * 0.02;
          const gradient = ctx.createRadialGradient(x, y, 0, x, y, size);
          gradient.addColorStop(0, `rgba(255, 220, 150, ${alpha})`);
          gradient.addColorStop(1, `rgba(255, 220, 150, 0)`);
          ctx.fillStyle = gradient;
          ctx.beginPath();
          ctx.arc(x, y, size, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // ----- Draw -----
      function draw() {
        const w = canvas.width;
        const h = canvas.height;

        drawBackground();

        // Update pollen
        if (!isPaused) {
          const speedMult = parseInt(speedSlider.value) / 5;
          const driftAmount = parseInt(driftSlider.value);
          pollen.forEach(p => p.update(speedMult, driftAmount));
        }

        // Draw pollen (sort by size for depth)
        const sortedPollen = [...pollen].sort((a, b) => a.size - b.size);
        const sizeMult = parseInt(sizeSlider.value) / 3;
        sortedPollen.forEach(p => p.draw(ctx, sizeMult));

        // Update count
        pollenCount.textContent = `✦ ${pollen.length} particles`;
        if (pollen.length > 0) {
          pollenStatus.textContent = '🌼 Floating';
        }
      }

      // ----- Animation loop -----
      function animate() {
        time += 0.016;
        draw();
        animationId = requestAnimationFrame(animate);
      }

      // ----- Start animation -----
      function startAnimation() {
        if (animationId) {
          cancelAnimationFrame(animationId);
        }
        animate();
      }

      // ----- Event Listeners -----
      addBtn.addEventListener('click', () => addPollen(5));
      clearBtn.addEventListener('click', clearPollen);
      toggleBtn.addEventListener('click', togglePause);
      resetBtn.addEventListener('click', resetPollen);

      countSlider.addEventListener('input', (e) => {
        const val = parseInt(e.target.value);
        countValue.textContent = val;
        const currentCount = pollen.length;
        if (val > currentCount) {
          addPollen(val - currentCount);
        } else if (val < currentCount) {
          pollen = pollen.slice(0, val);
          pollenCount.textContent = `✦ ${pollen.length} particles`;
        }
      });

      speedSlider.addEventListener('input', (e) => {
        speedValue.textContent = e.target.value + '×';
      });

      driftSlider.addEventListener('input', (e) => {
        driftValue.textContent = e.target.value + '%';
      });

      sizeSlider.addEventListener('input', (e) => {
        sizeValue.textContent = e.target.value + 'px';
      });

      // Keyboard shortcuts
      document.addEventListener('keydown', (e) => {
        if (e.key === 'a' || e.key === 'A') {
          e.preventDefault();
          addPollen(5);
        }
        if (e.key === 'c' || e.key === 'C') {
          e.preventDefault();
          clearPollen();
        }
        if (e.key === ' ' || e.key === 'Space') {
          e.preventDefault();
          togglePause();
        }
        if (e.key === 'r' || e.key === 'R') {
          e.preventDefault();
          resetPollen();
        }
      });

      // Click canvas to add pollen
      canvas.addEventListener('click', () => addPollen(3));

      // ----- Resize handler -----
      let resizeTimeout;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(() => {
          setupCanvas();
          // Reposition existing pollen
          const w = canvas.width;
          const h = canvas.height;
          const padding = 30;
          pollen.forEach(p => {
            p.x = Math.min(Math.max(p.x, padding), w - padding);
            p.y = Math.min(Math.max(p.y, padding), h - padding);
          });
        }, 200);
      });

      // ----- Init -----
      function init() {
        setupCanvas();
        generatePollen(40);
        startAnimation();
        status.textContent = '🌼 Pollen particles floating gracefully!';
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }

    })();
  </script>
</body>
</html>
