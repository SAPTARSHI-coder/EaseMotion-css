<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Progress Tracker Line</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="tracker-container">
    <h1>Progress Tracker</h1>

    <div class="progress-tracker" id="progressTracker">
      <div class="progress-line">
        <div class="progress-fill" id="progressFill"></div>
      </div>

      <div class="tracker-steps">
        <button class="step active" data-step="1">1</button>
        <button class="step" data-step="2">2</button>
        <button class="step" data-step="3">3</button>
        <button class="step" data-step="4">4</button>
        <button class="step" data-step="5">5</button>
      </div>
    </div>

    <div class="controls">
      <button id="prevBtn">Previous</button>
      <span id="stepLabel">Step 1 of 5</span>
      <button id="nextBtn">Next</button>
    </div>
  </main>

  <script>
    const steps = document.querySelectorAll(".step");
    const progressFill = document.getElementById("progressFill");
    const stepLabel = document.getElementById("stepLabel");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");

    let currentStep = 1;

    function updateProgress() {
      const progress = ((currentStep - 1) / (steps.length - 1)) * 100;

      progressFill.style.width = `${progress}%`;

      steps.forEach((step, index) => {
        step.classList.toggle("active", index < currentStep);
      });

      stepLabel.textContent = `Step ${currentStep} of ${steps.length}`;

      prevBtn.disabled = currentStep === 1;
      nextBtn.disabled = currentStep === steps.length;
    }

    nextBtn.addEventListener("click", () => {
      if (currentStep < steps.length) {
        currentStep++;
        updateProgress();
      }
    });

    prevBtn.addEventListener("click", () => {
      if (currentStep > 1) {
        currentStep--;
        updateProgress();
      }
    });

    steps.forEach((step) => {
      step.addEventListener("click", () => {
        currentStep = Number(step.dataset.step);
        updateProgress();
      });
    });

    updateProgress();
  </script>
</body>
</html>
