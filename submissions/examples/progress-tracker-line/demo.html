<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Progress Tracker Line &mdash; EaseMotion CSS Demo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="ptl-wrap">
  <div class="ptl-track">
    <div class="ptl-fill"></div>
    <span class="ptl-dot" style="--i:1">1</span>
    <span class="ptl-dot" style="--i:2">2</span>
    <span class="ptl-dot" style="--i:3">3</span>
  </div>
</div>
</body>
</html>
