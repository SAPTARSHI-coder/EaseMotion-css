<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Classroom Seat Grid | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="classroom-card" aria-label="Classroom Seating Grid Interactive Demo">
    <header class="classroom-header">
      <h1>CSS Classroom Seat Grid</h1>
      <p>Interactive seating chart layout with student name labels and selection states.</p>
    </header>

    <div class="front-board" aria-label="Front of Classroom Board">
      Chalkboard / Screen (Front of Class)
    </div>

    <section class="seating-grid" aria-label="Student seating grid">
      <!-- Seat 1 -->
      <label class="seat-item" data-status="occupied">
        <input type="checkbox" name="seat-selection" aria-label="Seat A1: Alex Chen (Occupied)">
        <div class="seat-icon" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        </div>
        <span class="seat-number">A1</span>
        <span class="student-name">Alex Chen</span>
      </label>

      <!-- Seat 2 -->
      <label class="seat-item" data-status="occupied">
        <input type="checkbox" name="seat-selection" aria-label="Seat A2: Sarah Jenkins (Occupied)">
        <div class="seat-icon" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        </div>
        <span class="seat-number">A2</span>
        <span class="student-name">Sarah J.</span>
      </label>

      <!-- Seat 3 -->
      <label class="seat-item" data-status="empty">
        <input type="checkbox" name="seat-selection" aria-label="Seat A3: Empty Desk">
        <div class="seat-icon" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="16"></line>
            <line x1="8" y1="12" x2="16" y2="12"></line>
          </svg>
        </div>
        <span class="seat-number">A3</span>
        <span class="student-name">Available</span>
      </label>

      <!-- Seat 4 -->
      <label class="seat-item" data-status="occupied">
        <input type="checkbox" name="seat-selection" aria-label="Seat A4: Rahul Kumar (Occupied)">
        <div class="seat-icon" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        </div>
        <span class="seat-number">A4</span>
        <span class="student-name">Rahul K.</span>
      </label>

      <!-- Seat 5 -->
      <label class="seat-item" data-status="occupied">
        <input type="checkbox" name="seat-selection" aria-label="Seat B1: Elena Rostova (Occupied)">
        <div class="seat-icon" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        </div>
        <span class="seat-number">B1</span>
        <span class="student-name">Elena R.</span>
      </label>

      <!-- Seat 6 -->
      <label class="seat-item" data-status="empty">
        <input type="checkbox" name="seat-selection" aria-label="Seat B2: Empty Desk">
        <div class="seat-icon" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="16"></line>
            <line x1="8" y1="12" x2="16" y2="12"></line>
          </svg>
        </div>
        <span class="seat-number">B2</span>
        <span class="student-name">Available</span>
      </label>

      <!-- Seat 7 -->
      <label class="seat-item" data-status="occupied">
        <input type="checkbox" name="seat-selection" aria-label="Seat B3: David Miller (Occupied)">
        <div class="seat-icon" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        </div>
        <span class="seat-number">B3</span>
        <span class="student-name">David M.</span>
      </label>

      <!-- Seat 8 -->
      <label class="seat-item" data-status="occupied">
        <input type="checkbox" name="seat-selection" aria-label="Seat B4: Maya Patel (Occupied)">
        <div class="seat-icon" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        </div>
        <span class="seat-number">B4</span>
        <span class="student-name">Maya P.</span>
      </label>
    </section>

    <footer class="legend-container">
      <div class="legend-item"><span class="legend-dot dot-occupied"></span> Occupied</div>
      <div class="legend-item"><span class="legend-dot dot-empty"></span> Available</div>
      <div class="legend-item"><span class="legend-dot dot-selected"></span> Selected</div>
    </footer>
  </main>
</body>
</html>
