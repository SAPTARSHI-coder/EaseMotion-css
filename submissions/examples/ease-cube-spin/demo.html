<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cube Spin · 3D cube pattern</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <div class="cube-container">
      <div class="cube-display" id="cubeDisplay">
        <!-- 3D Cube -->
        <div class="cube-scene">
          <div class="cube" id="cube">
            <!-- Front -->
            <div class="cube-face face-front">
              <span class="face-icon">⭐</span>
              <span class="face-label">Front</span>
            </div>
            <!-- Back -->
            <div class="cube-face face-back">
              <span class="face-icon">🌙</span>
              <span class="face-label">Back</span>
            </div>
            <!-- Right -->
            <div class="cube-face face-right">
              <span class="face-icon">🔥</span>
              <span class="face-label">Right</span>
            </div>
            <!-- Left -->
            <div class="cube-face face-left">
              <span class="face-icon">💧</span>
              <span class="face-label">Left</span>
            </div>
            <!-- Top -->
            <div class="cube-face face-top">
              <span class="face-icon">✨</span>
              <span class="face-label">Top</span>
            </div>
            <!-- Bottom -->
            <div class="cube-face face-bottom">
              <span class="face-icon">🌍</span>
              <span class="face-label">Bottom</span>
            </div>
          </div>
        </div>

        <!-- Cube Controls -->
        <div class="cube-controls">
          <div class="control-group">
            <span class="control-label">Rotation X</span>
            <input type="range" class="control-slider" id="sliderX" min="-180" max="180" value="30">
            <span class="control-value" id="valueX">30°</span>
          </div>
          <div class="control-group">
            <span class="control-label">Rotation Y</span>
            <input type="range" class="control-slider" id="sliderY" min="-180" max="180" value="45">
            <span class="control-value" id="valueY">45°</span>
          </div>
          <div class="control-group">
            <span class="control-label">Rotation Z</span>
            <input type="range" class="control-slider" id="sliderZ" min="-180" max="180" value="0">
            <span class="control-value" id="valueZ">0°</span>
          </div>
        </div>
      </div>
      
      <div class="cube-status">
        <span id="cubeStatus">🔄 Drag sliders or use controls to spin</span>
      </div>
    </div>

    <div class="controls">
      <button class="btn btn-spin" id="spinBtn">🔄 Auto Spin</button>
      <button class="btn btn-reset" id="resetBtn">⟳ Reset</button>
      <button class="btn btn-mode" id="modeBtn">🎨 Toggle Style</button>
    </div>
    <div class="footer-note">
      <span>🎲 3D cube · 6 faces · interactive rotation</span>
    </div>
  </div>

  <script>
    (function() {
      "use strict";

      // DOM refs
      const cube = document.getElementById('cube');
      const sliderX = document.getElementById('sliderX');
      const sliderY = document.getElementById('sliderY');
      const sliderZ = document.getElementById('sliderZ');
      const valueX = document.getElementById('valueX');
      const valueY = document.getElementById('valueY');
      const valueZ = document.getElementById('valueZ');
      const cubeStatus = document.getElementById('cubeStatus');
      const spinBtn = document.getElementById('spinBtn');
      const resetBtn = document.getElementById('resetBtn');
      const modeBtn = document.getElementById('modeBtn');

      // State
      let rotX = 30;
      let rotY = 45;
      let rotZ = 0;
      let isSpinning = false;
      let spinId = null;
      let styleIndex = 0;
      let targetRotX = 30;
      let targetRotY = 45;
      let targetRotZ = 0;

      // Styles
      const styles = [
        {
          name: 'Neon',
          colors: ['#6366f1', '#818cf8', '#a78bfa', '#c4b5fd', '#ddd6fe', '#4f46e5'],
          glow: 'rgba(99, 102, 241, 0.3)',
          borderColor: '#818cf8'
        },
        {
          name: 'Fire',
          colors: ['#ef4444', '#f97316', '#fb923c', '#fca5a5', '#fcd34d', '#dc2626'],
          glow: 'rgba(239, 68, 68, 0.3)',
          borderColor: '#f97316'
        },
        {
          name: 'Ocean',
          colors: ['#0ea5e9', '#38bdf8', '#7dd3fc', '#bae6fd', '#e0f2fe', '#0284c7'],
          glow: 'rgba(14, 165, 233, 0.3)',
          borderColor: '#38bdf8'
        },
        {
          name: 'Forest',
          colors: ['#22c55e', '#4ade80', '#86efac', '#bbf7d0', '#dcfce7', '#16a34a'],
          glow: 'rgba(34, 197, 94, 0.3)',
          borderColor: '#4ade80'
        },
        {
          name: 'Sunset',
          colors: ['#ec4899', '#f472b6', '#f9a8d4', '#fbcfe8', '#fcd34d', '#db2777'],
          glow: 'rgba(236, 72, 153, 0.3)',
          borderColor: '#f472b6'
        }
      ];

      // Update cube rotation
      function updateCube() {
        // Smooth interpolation
        rotX += (targetRotX - rotX) * 0.1;
        rotY += (targetRotY - rotY) * 0.1;
        rotZ += (targetRotZ - rotZ) * 0.1;

        cube.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg) rotateZ(${rotZ}deg)`;

        // Update slider values
        sliderX.value = Math.round(rotX);
        sliderY.value = Math.round(rotY);
        sliderZ.value = Math.round(rotZ);
        valueX.textContent = Math.round(rotX) + '°';
        valueY.textContent = Math.round(rotY) + '°';
        valueZ.textContent = Math.round(rotZ) + '°';
      }

      // Animation loop
      function animate() {
        if (isSpinning) {
          updateCube();
          spinId = requestAnimationFrame(animate);
        }
      }

      // Toggle auto spin
      function toggleSpin() {
        if (isSpinning) {
          // Stop spinning
          if (spinId) {
            cancelAnimationFrame(spinId);
            spinId = null;
          }
          isSpinning = false;
          spinBtn.textContent = '🔄 Auto Spin';
          spinBtn.style.background = 'linear-gradient(135deg, #f59e0b, #d97706)';
          spinBtn.style.borderColor = '#fbbf24';
          cubeStatus.textContent = '⏸️ Spin paused';
          cubeStatus.style.color = '#94a3b8';
          setTimeout(() => {
            cubeStatus.textContent = '🔄 Drag sliders or use controls to spin';
          }, 1500);
        } else {
          // Start spinning
          isSpinning = true;
          spinBtn.textContent = '⏹️ Stop Spin';
          spinBtn.style.background = 'linear-gradient(135deg, #ef4444, #dc2626)';
          spinBtn.style.borderColor = '#f87171';
          cubeStatus.textContent = '🔄 Spinning!';
          cubeStatus.style.color = '#fbbf24';
          
          // Randomize target rotation
          targetRotX += (Math.random() - 0.5) * 360;
          targetRotY += (Math.random() - 0.5) * 360;
          targetRotZ += (Math.random() - 0.5) * 360;
          
          if (!spinId) {
            animate();
          }
        }
      }

      // Reset cube
      function resetCube() {
        if (isSpinning) {
          toggleSpin();
        }
        targetRotX = 30;
        targetRotY = 45;
        targetRotZ = 0;
        rotX = 30;
        rotY = 45;
        rotZ = 0;
        updateCube();
        cubeStatus.textContent = '🔄 Reset complete';
        cubeStatus.style.color = '#94a3b8';
        setTimeout(() => {
          cubeStatus.textContent = '🔄 Drag sliders or use controls to spin';
        }, 1000);
      }

      // Toggle style
      function toggleStyle() {
        styleIndex = (styleIndex + 1) % styles.length;
        const style = styles[styleIndex];
        
        // Update cube face colors
        const faces = document.querySelectorAll('.cube-face');
        faces.forEach((face, index) => {
          face.style.background = `radial-gradient(circle at 30% 30%, ${style.colors[index]}, ${style.colors[(index + 3) % 6]})`;
          face.style.boxShadow = `0 0 30px ${style.glow}, inset 0 0 30px ${style.glow}`;
          face.style.borderColor = style.borderColor;
        });

        // Update mode button
        modeBtn.textContent = `🎨 ${style.name}`;
        
        cubeStatus.textContent = `🎨 Style: ${style.name}`;
        cubeStatus.style.color = style.colors[0];
        setTimeout(() => {
          if (!isSpinning) {
            cubeStatus.textContent = '🔄 Drag sliders or use controls to spin';
            cubeStatus.style.color = '#94a3b8';
          }
        }, 1500);
      }

      // Slider events
      sliderX.addEventListener('input', function() {
        if (isSpinning) {
          toggleSpin();
        }
        targetRotX = parseFloat(this.value);
        valueX.textContent = targetRotX + '°';
      });

      sliderY.addEventListener('input', function() {
        if (isSpinning) {
          toggleSpin();
        }
        targetRotY = parseFloat(this.value);
        valueY.textContent = targetRotY + '°';
      });

      sliderZ.addEventListener('input', function() {
        if (isSpinning) {
          toggleSpin();
        }
        targetRotZ = parseFloat(this.value);
        valueZ.textContent = targetRotZ + '°';
      });

      // Button events
      if (spinBtn) {
        spinBtn.addEventListener('click', function(e) {
          e.preventDefault();
          toggleSpin();
        });
      }

      if (resetBtn) {
        resetBtn.addEventListener('click', function(e) {
          e.preventDefault();
          resetCube();
        });
      }

      if (modeBtn) {
        modeBtn.addEventListener('click', function(e) {
          e.preventDefault();
          toggleStyle();
        });
      }

      // Keyboard shortcuts
      document.addEventListener('keydown', function(e) {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

        const key = e.key;
        if (key === ' ' || key === 'Space') {
          e.preventDefault();
          toggleSpin();
        } else if (key === 'r' || key === 'R') {
          e.preventDefault();
          resetCube();
        } else if (key === 's' || key === 'S') {
          e.preventDefault();
          toggleStyle();
        }
      });

      // Mouse drag on cube
      let isDragging = false;
      let startX = 0;
      let startY = 0;
      let startRotX = 0;
      let startRotY = 0;

      const cubeScene = document.querySelector('.cube-scene');

      cubeScene.addEventListener('mousedown', function(e) {
        if (isSpinning) {
          toggleSpin();
        }
        isDragging = true;
        startX = e.clientX;
        startY = e.clientY;
        startRotX = targetRotX;
        startRotY = targetRotY;
        cubeScene.style.cursor = 'grabbing';
      });

      document.addEventListener('mousemove', function(e) {
        if (!isDragging) return;
        const deltaX = e.clientX - startX;
        const deltaY = e.clientY - startY;
        targetRotX = startRotX + deltaY * 0.5;
        targetRotY = startRotY + deltaX * 0.5;
      });

      document.addEventListener('mouseup', function() {
        if (isDragging) {
          isDragging = false;
          cubeScene.style.cursor = 'grab';
        }
      });

      // Touch support for cube drag
      let touchStartX = 0;
      let touchStartY = 0;
      let touchStartRotX = 0;
      let touchStartRotY = 0;

      cubeScene.addEventListener('touchstart', function(e) {
        if (isSpinning) {
          toggleSpin();
        }
        const touch = e.touches[0];
        touchStartX = touch.clientX;
        touchStartY = touch.clientY;
        touchStartRotX = targetRotX;
        touchStartRotY = targetRotY;
      });

      cubeScene.addEventListener('touchmove', function(e) {
        e.preventDefault();
        const touch = e.touches[0];
        const deltaX = touch.clientX - touchStartX;
        const deltaY = touch.clientY - touchStartY;
        targetRotX = touchStartRotX + deltaY * 0.5;
        targetRotY = touchStartRotY + deltaX * 0.5;
      });

      // Initialize
      updateCube();
      
      // Set initial style
      const initialStyle = styles[0];
      const faces = document.querySelectorAll('.cube-face');
      faces.forEach((face, index) => {
        face.style.background = `radial-gradient(circle at 30% 30%, ${initialStyle.colors[index]}, ${initialStyle.colors[(index + 3) % 6]})`;
        face.style.boxShadow = `0 0 30px ${initialStyle.glow}, inset 0 0 30px ${initialStyle.glow}`;
        face.style.borderColor = initialStyle.borderColor;
      });
      modeBtn.textContent = `🎨 ${initialStyle.name}`;

      console.log('🎲 Cube Spin ready · shortcuts: [Space] Spin, [R] Reset, [S] Style');
    })();
  </script>
</body>
</html>
