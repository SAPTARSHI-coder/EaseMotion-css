<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Toggle Switch | EaseMotion CSS</title><link rel="stylesheet" href="style.css"></head>
<body><div class="cts-root">
<div class="cts-card">
<div class="cts-row">
<div class="cts-info"><p class="cts-name">Email Notifications</p><p class="cts-sub">Receive email alerts for activity</p></div>
<label class="cts-label"><input type="checkbox" class="cts-input" checked><span class="cts-slider"></span></label>
</div>
<div class="cts-row">
<div class="cts-info"><p class="cts-name">Marketing Emails</p><p class="cts-sub">Receive promotional content</p></div>
<label class="cts-label"><input type="checkbox" class="cts-input green"></label>
</div>
<div class="cts-row">
<div class="cts-info"><p class="cts-name">Weekly Digest</p><p class="cts-sub">Get a summary every Monday</p></div>
<label class="cts-label"><input type="checkbox" class="cts-input" checked></label>
</div>
</div>
<p class="cts-sub2">Pure CSS toggle switches with spring animation</p>
</div></body></html>
