<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shear Molten Cut — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Shear Molten Cut demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Shear Molten Cut</h1>
      <p class="lede">Shears cutting a molten gob from the gather</p>
    </header>

    <section class="ease-shear-molten-cut" data-demo="shear-molten-cut" aria-live="polite">
      <div class="ease-shear-molten-cut__housing">
        <div class="ease-shear-molten-cut__bezel">
          <div class="ease-shear-molten-cut__face">
            <div class="ease-shear-molten-cut__readout">
              <span class="ease-shear-molten-cut__label">Shear Molten Cut</span>
              <span class="ease-shear-molten-cut__value">LIVE</span>
            </div>
            <div class="ease-shear-molten-cut__motion" aria-hidden="true">
              <span class="ease-shear-molten-cut__a"></span>
              <span class="ease-shear-molten-cut__b"></span>
              <span class="ease-shear-molten-cut__c"></span>
              <span class="ease-shear-molten-cut__d"></span>
            </div>
            <div class="ease-shear-molten-cut__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-shear-molten-cut__controls">
          <button type="button" class="ease-shear-molten-cut__btn primary">Shear</button>
          <button type="button" class="ease-shear-molten-cut__btn">Reset</button>
          <label class="ease-shear-molten-cut__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-shear-molten-cut__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
