<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Frosted Glass Navbar — EaseMotion CSS</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="demo-canvas">
      <header class="navbar-container">
        <nav class="frosted-navbar" aria-label="Main Navigation">
          <a href="#" class="navbar-brand">
            <svg
              class="brand-logo"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <polygon points="12 2 2 7 12 12 22 7 12 2" />
              <polyline points="2 17 12 22 22 17" />
              <polyline points="2 12 12 17 22 12" />
            </svg>
            <span>EaseMotion</span>
          </a>

          <input
            type="checkbox"
            id="nav-toggle"
            class="nav-toggle"
            aria-label="Toggle navigation menu"
          />
          <label
            for="nav-toggle"
            class="nav-toggle-btn"
            aria-label="Toggle navigation menu"
          >
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <line x1="3" y1="6" x2="21" y2="6" />
              <line x1="3" y1="12" x2="21" y2="12" />
              <line x1="3" y1="18" x2="21" y2="18" />
            </svg>
          </label>

          <div class="nav-content">
            <ul class="nav-links">
              <li>
                <a href="#" class="nav-link is-active" aria-current="page"
                  >Overview</a
                >
              </li>
              <li><a href="#" class="nav-link">Documentation</a></li>
              <li><a href="#" class="nav-link">Components</a></li>
              <li><a href="#" class="nav-link">Releases</a></li>
            </ul>

            <div class="nav-actions">
              <a href="#" class="btn-secondary">Sign In</a>
              <a href="#" class="btn-primary">Get Started</a>
            </div>
          </div>
        </nav>
      </header>

      <main class="demo-body">
        <div class="hero-card">
          <span class="badge">Component Spec</span>
          <h1>CSS Frosted Glass Navbar</h1>
          <p>
            A production-ready, zero-dependency navigation bar featuring
            backdrop blur, subtle specular borders, high contrast typography,
            and pure CSS responsive drawer state.
          </p>
        </div>
      </main>
    </div>
  </body>
</html>
