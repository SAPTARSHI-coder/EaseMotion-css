<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Biometric Iris Scanner HUD | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
</head>
<body>
  <div class="hud-container">
    <div class="scanner-card">
      <div class="scanner-ring outer"></div>
      <div class="scanner-ring middle"></div>
      <div class="scanner-ring inner"></div>
      <div class="laser-beam"></div>
      <div class="crosshair"></div>
      <div class="hud-info">
        <span class="status">SCANNING IRIS</span>
        <span class="id-tag">SUBJECT #8092-A</span>
      </div>
    </div>
  </div>
</body>
</html>
