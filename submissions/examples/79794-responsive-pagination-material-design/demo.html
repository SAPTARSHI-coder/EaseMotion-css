<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Responsive Material Design pagination component"
    >

    <title>Responsive Material Pagination</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="page">
        <section class="pagination-card">

            <div class="header">
                <span class="eyebrow">CSS COMPONENT</span>

                <h1>Material Pagination</h1>

                <p>
                    A clean, responsive pagination component inspired by
                    Material Design principles.
                </p>
            </div>

            <div class="content">

                <div class="results-info">
                    <span>Showing</span>
                    <strong>21–40</strong>
                    <span>of</span>
                    <strong>120</strong>
                    <span>results</span>
                </div>

                <nav
                    class="pagination"
                    aria-label="Pagination Navigation"
                >

                    <button
                        class="page-button navigation"
                        type="button"
                        aria-label="Previous page"
                        id="previous"
                    >
                        <span aria-hidden="true">‹</span>
                    </button>

                    <button
                        class="page-button active"
                        type="button"
                        aria-current="page"
                    >
                        1
                    </button>

                    <button
                        class="page-button"
                        type="button"
                    >
                        2
                    </button>

                    <button
                        class="page-button"
                        type="button"
                    >
                        3
                    </button>

                    <span class="ellipsis" aria-hidden="true">
                        …
                    </span>

                    <button
                        class="page-button"
                        type="button"
                    >
                        6
                    </button>

                    <button
                        class="page-button navigation"
                        type="button"
                        aria-label="Next page"
                        id="next"
                    >
                        <span aria-hidden="true">›</span>
                    </button>

                </nav>

                <div class="page-selector">

                    <label for="page-size">
                        Items per page
                    </label>

                    <select id="page-size">
                        <option value="10">10</option>
                        <option value="20" selected>20</option>
                        <option value="30">30</option>
                        <option value="50">50</option>
                    </select>

                </div>

            </div>

            <div class="mobile-info">
                Page <strong id="mobile-page">1</strong> of 6
            </div>

        </section>
    </main>

    <script>
        const buttons = document.querySelectorAll(
            ".page-button:not(.navigation)"
        );

        const previous = document.getElementById("previous");
        const next = document.getElementById("next");
        const mobilePage = document.getElementById("mobile-page");

        let currentPage = 1;
        const totalPages = 6;

        function updatePage(page) {
            currentPage = Math.max(
                1,
                Math.min(page, totalPages)
            );

            buttons.forEach((button) => {
                const pageNumber = Number(button.textContent.trim());

                button.classList.toggle(
                    "active",
                    pageNumber === currentPage
                );

                if (pageNumber === currentPage) {
                    button.setAttribute(
                        "aria-current",
                        "page"
                    );
                } else {
                    button.removeAttribute("aria-current");
                }
            });

            previous.disabled = currentPage === 1;
            next.disabled = currentPage === totalPages;

            mobilePage.textContent = currentPage;
        }

        buttons.forEach((button) => {
            button.addEventListener("click", () => {
                updatePage(Number(button.textContent.trim()));
            });
        });

        previous.addEventListener("click", () => {
            updatePage(currentPage - 1);
        });

        next.addEventListener("click", () => {
            updatePage(currentPage + 1);
        });

        updatePage(1);
    </script>

</body>
</html>
