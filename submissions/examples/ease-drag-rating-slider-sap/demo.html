<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ease-drag-rating-slider-sap demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { height: 100vh; margin: 0; display: flex; align-items: center; justify-content: center; background: #f4f4f5; }
  </style>
</head>
<body>
  <div class="rating-slider-sap">
    <div class="rating-track" id="track">
      <div class="rating-thumb" id="thumb"></div>
    </div>
    <div class="rating-value" id="value">7 / 10</div>
  </div>
  <script>
    const track = document.getElementById('track');
    const thumb = document.getElementById('thumb');
    const value = document.getElementById('value');
    let dragging = false;

    function update(clientX) {
      const rect = track.getBoundingClientRect();
      let pct = ((clientX - rect.left) / rect.width) * 100;
      pct = Math.max(0, Math.min(100, pct));
      thumb.style.left = pct + '%';
      value.textContent = Math.round(pct / 10) + ' / 10';
    }

    track.addEventListener('mousedown', (e) => { dragging = true; update(e.clientX); });
    window.addEventListener('mousemove', (e) => { if (dragging) update(e.clientX); });
    window.addEventListener('mouseup', () => dragging = false);
  </script>
</body>
</html>
