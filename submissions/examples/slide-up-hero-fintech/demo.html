<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CSS Slide-Up Hero Section for fintech dashboards">
  <title>Slide-Up Fintech Hero</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="hero">
    <section class="hero__content">
      <p class="hero__eyebrow">FINTECH DASHBOARD</p>

      <h1 class="hero__title">
        Take Control of
        <span>Your Finances</span>
      </h1>

      <p class="hero__description">
        Monitor your investments, track spending, and make smarter
        financial decisions with one simple dashboard.
      </p>

      <div class="hero__actions">
        <a href="#" class="hero__button hero__button--primary">
          Get Started
        </a>

        <a href="#" class="hero__button hero__button--secondary">
          Explore Dashboard
        </a>
      </div>
    </section>

    <section class="hero__visual" aria-label="Financial dashboard preview">
      <div class="dashboard-card">
        <div class="dashboard-card__top">
          <span>Total Balance</span>
          <span class="dashboard-card__growth">+18.4%</span>
        </div>

        <strong class="dashboard-card__balance">$128,450.00</strong>

        <div class="dashboard-card__chart" aria-hidden="true">
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
        </div>

        <div class="dashboard-card__footer">
          <span>Monthly growth</span>
          <span>+$12,480</span>
        </div>
      </div>
    </section>
  </main>

</body>
</html>
