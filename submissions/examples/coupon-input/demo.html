<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coupon Input &mdash; EaseMotion CSS Demo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="page-head">
    <p class="kicker">EaseMotion CSS &middot; E-commerce</p>
    <h1>Coupon Input</h1>
    <p class="sub">A playful dashed field for promo codes that lights up when you focus it.</p>
  </header>
  <main class="stage">
    <div class="ci-wrap">
      <span class="ci-prefix">PROMO</span>
      <input class="ci-input" type="text" placeholder="e.g. EASEMOTION20" aria-label="Promo code" />
      <button class="ci-apply">Apply</button>
    </div>
  </main>
  <p class="stage-caption">Focus the field to see the dashed border take center stage.</p>
  <footer class="page-foot">
    <span>Pure CSS &middot; zero dependencies</span>
    <span>Focus-within glow</span>
  </footer>
</body>
</html>
