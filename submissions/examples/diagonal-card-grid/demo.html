<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CSS-only diagonal card grid">
  <title>Diagonal Card Grid</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main>
    <section class="diagonal-grid" aria-label="Featured cards">

      <article class="card">
        <span class="card-number">01</span>
        <h2>Design</h2>
        <p>Create clean and modern interfaces using CSS.</p>
      </article>

      <article class="card">
        <span class="card-number">02</span>
        <h2>Motion</h2>
        <p>Add smooth transitions and engaging animations.</p>
      </article>

      <article class="card">
        <span class="card-number">03</span>
        <h2>Components</h2>
        <p>Build reusable components without JavaScript.</p>
      </article>

      <article class="card">
        <span class="card-number">04</span>
        <h2>Responsive</h2>
        <p>Layouts that adapt beautifully to every screen.</p>
      </article>

    </section>
  </main>
</body>
</html>
