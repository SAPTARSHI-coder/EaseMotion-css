<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css"></head><body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030712; color: #ffffff;">

    <div class="ease-card ease-card-glass qtntv-container">

            <h2>Quantum Network Topology Visualizer</h2>
            <span class="ease-badge ease-badge-secondary">Fault-Tolerant Quantum</span>

        <div class="qtntv-screen ease-center">

            <div class="qtntv-flux flux-qtntv-b"></div>
            <div class="qtntv-boundary-ring"></div>
            <div class="qtntv-core ease-center"></div>
        </div>

        <div class="qtntv-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Multi-Node Interconnection &amp; Mesh Architecture Tracking</span>
            <button class="ease-btn ease-btn-secondary ease-btn-sm ease-hover-grow">Run Topology Visualizer</button>
