<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Star Rating | EaseMotion CSS submission</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      /* Demo page styling only. Not part of the component. */
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        padding: 2rem 1.25rem;
        font-family: system-ui, sans-serif;
        line-height: 1.5;
        background: #f7f8fa;
        color: #1c2028;
      }
      main {
        max-width: 40rem;
        margin: 0 auto;
      }
      section {
        margin-block: 2rem;
      }
      h1 {
        font-size: 1.75rem;
        margin-block-end: 0.25rem;
      }
      h2 {
        font-size: 1.1rem;
        margin-block-end: 0.5rem;
      }
      p {
        max-width: 60ch;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #14171c;
          color: #e8eaee;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Star rating</h1>
      <p>
        A pure CSS rating control built on radio inputs. Click a star, or tab
        in and use the arrow keys.
      </p>

      <section>
        <h2>Default</h2>
        <fieldset class="ease-star-rating-xyz">
          <legend>Rate this product</legend>
          <div class="ease-star-rating-xyz__stars">
            <input type="radio" name="rating-default" id="d1" value="1" />
            <label for="d1" title="1 star"><span aria-hidden="true">&#9733;</span><span class="sr-only-xyz">1 star</span></label>
            <input type="radio" name="rating-default" id="d2" value="2" />
            <label for="d2" title="2 stars"><span aria-hidden="true">&#9733;</span><span class="sr-only-xyz">2 stars</span></label>
            <input type="radio" name="rating-default" id="d3" value="3" checked />
            <label for="d3" title="3 stars"><span aria-hidden="true">&#9733;</span><span class="sr-only-xyz">3 stars</span></label>
            <input type="radio" name="rating-default" id="d4" value="4" />
            <label for="d4" title="4 stars"><span aria-hidden="true">&#9733;</span><span class="sr-only-xyz">4 stars</span></label>
            <input type="radio" name="rating-default" id="d5" value="5" />
            <label for="d5" title="5 stars"><span aria-hidden="true">&#9733;</span><span class="sr-only-xyz">5 stars</span></label>
          </div>
        </fieldset>
      </section>

      <section>
        <h2>Small and large</h2>
        <fieldset class="ease-star-rating-xyz ease-star-rating-xyz--sm">
          <legend>Small</legend>
          <div class="ease-star-rating-xyz__stars">
            <input type="radio" name="rating-sm" id="s1" value="1" />
            <label for="s1" title="1 star"><span aria-hidden="true">&#9733;</span><span class="sr-only-xyz">1 star</span></label>
            <input type="radio" name="rating-sm" id="s2" value="2" />
            <label for="s2" title="2 stars"><span aria-hidden="true">&#9733;</span><span class="sr-only-xyz">2 stars</span></label>
            <input type="radio" name="rating-sm" id="s3" value="3" />
            <label for="s3" title="3 stars"><span aria-hidden="true">&#9733;</span><span class="sr-only-xyz">3 stars</span></label>
            <input type="radio" name="rating-sm" id="s4" value="4" />
            <label for="s4" title="4 stars"><span aria-hidden="true">&#9733;</span><span class="sr-only-xyz">4 stars</span></label>
            <input type="radio" name="rating-sm" id="s5" value="5" />
            <label for="s5" title="5 stars"><span aria-hidden="true">&#9733;</span><span class="sr-only-xyz">5 stars</span></label>
          </div>
        </fieldset>

        <fieldset class="ease-star-rating-xyz ease-star-rating-xyz--lg">
          <legend>Large</legend>
          <div class="ease-star-rating-xyz__stars">
            <input type="radio" name="rating-lg" id="l1" value="1" />
            <label for="l1" title="1 star"><span aria-hidden="true">&#9733;</span><span class="sr-only-xyz">1 star</span></label>
            <input type="radio" name="rating-lg" id="l2" value="2" />
            <label for="l2" title="2 stars"><span aria-hidden="true">&#9733;</span><span class="sr-only-xyz">2 stars</span></label>
            <input type="radio" name="rating-lg" id="l3" value="3" />
            <label for="l3" title="3 stars"><span aria-hidden="true">&#9733;</span><span class="sr-only-xyz">3 stars</span></label>
            <input type="radio" name="rating-lg" id="l4" value="4" />
            <label for="l4" title="4 stars"><span aria-hidden="true">&#9733;</span><span class="sr-only-xyz">4 stars</span></label>
            <input type="radio" name="rating-lg" id="l5" value="5" />
            <label for="l5" title="5 stars"><span aria-hidden="true">&#9733;</span><span class="sr-only-xyz">5 stars</span></label>
          </div>
        </fieldset>
      </section>

      <section>
        <h2>Read-only</h2>
        <fieldset class="ease-star-rating-xyz ease-star-rating-xyz--readonly" disabled>
          <legend>Average rating: 4 out of 5</legend>
          <div class="ease-star-rating-xyz__stars">
            <input type="radio" name="rating-ro" id="r1" value="1" />
            <label for="r1"><span aria-hidden="true">&#9733;</span><span class="sr-only-xyz">1 star</span></label>
            <input type="radio" name="rating-ro" id="r2" value="2" />
            <label for="r2"><span aria-hidden="true">&#9733;</span><span class="sr-only-xyz">2 stars</span></label>
            <input type="radio" name="rating-ro" id="r3" value="3" />
            <label for="r3"><span aria-hidden="true">&#9733;</span><span class="sr-only-xyz">3 stars</span></label>
            <input type="radio" name="rating-ro" id="r4" value="4" checked />
            <label for="r4"><span aria-hidden="true">&#9733;</span><span class="sr-only-xyz">4 stars</span></label>
            <input type="radio" name="rating-ro" id="r5" value="5" />
            <label for="r5"><span aria-hidden="true">&#9733;</span><span class="sr-only-xyz">5 stars</span></label>
          </div>
        </fieldset>
      </section>
    </main>
  </body>
</html>
