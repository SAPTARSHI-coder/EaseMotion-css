<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Morph-Glow Progress Bar | EaseMotion CSS</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="wrapper">

        <section class="hero">
            <h1>Morph-Glow Progress Bar</h1>
            <p>
                A glassmorphism inspired animated progress component built
                with pure HTML and CSS.
            </p>
        </section>


        <section class="progress-card">

            <div class="header">
                <h2>Project Completion</h2>
                <span>78%</span>
            </div>


            <div class="progress-track">
                <div class="progress-fill"></div>
            </div>


            <div class="stats">
                <span>Design</span>
                <span>Development</span>
                <span>Testing</span>
            </div>

        </section>



        <section class="progress-grid">

            <article class="mini-card">
                <h3>Frontend</h3>
                <div class="bar">
                    <span class="bar-fill first"></span>
                </div>
            </article>


            <article class="mini-card">
                <h3>Backend</h3>
                <div class="bar">
                    <span class="bar-fill second"></span>
                </div>
            </article>


            <article class="mini-card">
                <h3>Deployment</h3>
                <div class="bar">
                    <span class="bar-fill third"></span>
                </div>
            </article>

        </section>

    </main>

</body>
</html>
