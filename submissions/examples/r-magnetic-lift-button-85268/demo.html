<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Pure CSS Magnetic Lift Button">
  <title>Magnetic Lift Button</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">
    <section class="demo-card" aria-labelledby="title">
      <p class="eyebrow">EaseMotion CSS</p>

      <h1 id="title">Magnetic Lift</h1>

      <p class="description">
        A lightweight button interaction that smoothly lifts and scales
        on hover and keyboard focus.
      </p>

      <div class="button-group">
        <button class="magnetic-lift" type="button">
          Get Started
        </button>

        <button class="magnetic-lift magnetic-lift--outline" type="button">
          Learn More
        </button>
      </div>
    </section>
  </main>

</body>
</html>
