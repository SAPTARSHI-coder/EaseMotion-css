<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Glowing Border Card — EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <p class="label">Pure CSS Animated Gradient Border Cards</p>
  <div class="demo-row">
    <!-- Default Neon Purple -->
    <div class="ease-glow-card">
      <h3 class="ease-glow-card__title">Neon Pulse</h3>
      <p class="ease-glow-card__desc">Rotating conic gradient border driven by CSS @property angle animation.</p>
    </div>

    <!-- Cyber Cyan -->
    <div class="ease-glow-card ease-glow-card--cyber">
      <h3 class="ease-glow-card__title">Cyber Grid</h3>
      <p class="ease-glow-card__desc">Cyan and emerald border glow rotation effect.</p>
    </div>

    <!-- Fire Ember -->
    <div class="ease-glow-card ease-glow-card--fire">
      <h3 class="ease-glow-card__title">Fire Ember</h3>
      <p class="ease-glow-card__desc">Warm amber and crimson spinning gradient outline.</p>
    </div>
  </div>

</body>
</html>
