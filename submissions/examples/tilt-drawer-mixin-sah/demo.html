<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tilt Drawer Mixin - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <header class="app-head">
      <h1>Tilt Drawer Mixin (<code>#54689</code>)</h1>
      <button class="toggle-drawer" onclick="document.getElementById('drawer').classList.toggle('open')">☰ Open 3D Tilt Drawer</button>
    </header>
    <p class="hint">Click the button above to glide out the side navigation drawer with authentic 3D perspective depth rotation.</p>
    
    <div id="drawer" class="ease-drawer-container">
      <div class="drawer-backdrop" onclick="document.getElementById('drawer').classList.remove('open')"></div>
      <aside class="ease-drawer-tilt">
        <div class="drawer-header">
          <h3>⚡ EaseMotion Menu</h3>
          <button class="close-btn" onclick="document.getElementById('drawer').classList.remove('open')">×</button>
        </div>
        <nav class="drawer-nav">
          <a href="#">🏠 System Dashboard</a>
          <a href="#">🚀 GSSoC Contributions</a>
          <a href="#">🛡️ Automated Test CI</a>
          <a href="#">⚙️ Theme Token Editor</a>
        </nav>
      </aside>
    </div>
  </div>
</body>
</html>
