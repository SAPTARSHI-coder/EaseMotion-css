<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Continuous Floating/Bouncing Animation</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      margin: 0;
      padding: 2rem;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: #2c3e50;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: white;
    }
    
    .demo-container {
      display: flex;
      gap: 4rem;
      margin-top: 2rem;
    }

    .item-box {
      width: 120px;
      height: 120px;
      background: linear-gradient(135deg, #6e8efb, #a777e3);
      border-radius: 20px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.2);
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      font-size: 1.2rem;
    }

    .fast-float {
      --float-duration: 1.5s; /* Overriding the duration */
      background: linear-gradient(135deg, #ff9a9e, #fecfef);
      color: #333;
    }
    
    h2 {
      margin: 0;
      font-weight: 300;
      text-align: center;
    }
    
    p {
      color: #aaa;
      text-align: center;
      margin-bottom: 2rem;
    }
  </style>
</head>
<body>

  <h2>Continuous Floating Animations</h2>
  <p>Standard infinite bounce commonly used for 3D assets or app icons.</p>

  <div class="demo-container">
    
    <!-- Vertical Floating -->
    <div class="ease-float-y item-box">
      Float Y
    </div>
    
    <!-- Horizontal Floating -->
    <div class="ease-float-x item-box">
      Float X
    </div>
    
    <!-- Vertical Floating with custom fast duration -->
    <div class="ease-float-y item-box fast-float">
      Fast Float
    </div>
    
  </div>

</body>
</html>
