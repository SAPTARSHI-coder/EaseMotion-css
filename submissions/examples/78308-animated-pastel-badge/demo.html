<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Responsive animated pastel badge component"
  >
  <title>Animated Pastel Badge</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="page">
    <section class="showcase" aria-labelledby="title">

      <span class="eyebrow">EASEMOTION CSS</span>

      <h1 id="title">Animated Pastel Badge</h1>

      <p class="intro">
        A lightweight badge component with soft pastel colors,
        animated gradients, and smooth interactions.
      </p>

      <div class="badge-showcase">

        <span class="pastel-badge pastel-badge--purple">
          <span class="badge-dot" aria-hidden="true"></span>
          New Feature
        </span>

        <span class="pastel-badge pastel-badge--pink">
          <span class="badge-dot" aria-hidden="true"></span>
          Trending
        </span>

        <span class="pastel-badge pastel-badge--blue">
          <span class="badge-dot" aria-hidden="true"></span>
          Available
        </span>

        <span class="pastel-badge pastel-badge--green">
          <span class="badge-dot" aria-hidden="true"></span>
          Verified
        </span>

      </div>

      <div class="featured-badge">
        <span class="featured-badge__icon" aria-hidden="true">✦</span>

        <div class="featured-badge__content">
          <span class="featured-badge__label">STATUS</span>
          <strong>Design system updated</strong>
        </div>

        <span class="featured-badge__pulse" aria-hidden="true"></span>
      </div>

    </section>
  </main>
</body>
</html>
