<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic SaaS Avatar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="saas-avatar-group">
        <div class="saas-avatar online">
            <img src="https://i.pravatar.cc/150?img=32" alt="User Avatar">
        </div>
        <div class="saas-avatar offline">
            <img src="https://i.pravatar.cc/150?img=12" alt="User Avatar">
        </div>
        <div class="saas-avatar busy">
            <span class="avatar-initials">JD</span>
        </div>
    </div>
</body>
</html>
