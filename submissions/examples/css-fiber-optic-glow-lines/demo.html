<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Fiber Optic Glow Lines - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="em-fiber-page" role="region" aria-label="Fiber Optic Glow Lines Background Animation">
        <div class="em-fiber-container" aria-hidden="true">
            <div class="em-optic-line em-line-one"></div>
            <div class="em-optic-line em-line-two"></div>
            <div class="em-optic-line em-line-three"></div>
            <div class="em-optic-line em-line-four"></div>
        </div>

        <div class="em-fiber-card" tabindex="0">
            <span class="em-fiber-badge">HIGH-SPEED TRANSMISSION</span>
            <h1 class="em-fiber-title">Fiber Optic Glow Lines</h1>
            <p class="em-fiber-subtitle">Animated glowing line trails background powered entirely by pure CSS keyframes.</p>
        </div>
    </div>

</html>
