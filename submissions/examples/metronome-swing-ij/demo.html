<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-metronome-swing demo</title>
</head>
<body>
<div class="mt-app">
  <span class="mt-title">METRONOME</span>
  <div class="mt-body">
    <span class="mt-pivot"></span>
    <span class="mt-arm"><span class="mt-ball"></span></span>
    <div class="mt-scale">
      <span class="mt-mark">SLOW</span>
      <span class="mt-mark">FAST</span>
    </div>
  </div>
  <div class="mt-beats">
    <span class="mt-beat mt-beat-1"></span>
    <span class="mt-beat mt-beat-2"></span>
    <span class="mt-beat mt-beat-3"></span>
  </div>
  <span class="mt-tempo">112 BPM</span>
</div>
</body>
</html>
