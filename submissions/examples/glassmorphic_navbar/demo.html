<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Glassmorphic Sticky Navbar — Demo</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Feature CSS being submitted -->
  <link rel="stylesheet" href="style.css" />

  <style>
    body {
      background-color: #0d0d16;
      color: #e2e8f0;
      font-family: 'Inter', system-ui, sans-serif;
      margin: 0;
    }
    .demo-section {
      max-width: 760px;
      margin: 0 auto;
      padding: 60px 20px;
    }
    .demo-section h2 { margin-top: 0; }
    .spacer { height: 100vh; }
  </style>
</head>
<body>

  <nav class="ease-navbar-glass">
    <div class="ease-navbar-glass-inner">
      <a href="#" class="ease-navbar-glass-logo">EaseMotion</a>
      <ul class="ease-navbar-glass-links">
        <li><a href="#" class="active">Buttons</a></li>
        <li><a href="#">Cards</a></li>
        <li><a href="#">Animations</a></li>
        <li><a href="#">Layout</a></li>
        <li><a href="#">Docs</a></li>
      </ul>
    </div>
  </nav>

  <div class="demo-section">
    <h2>Scroll down ↓</h2>
    <p>Notice the navbar stays fixed to the top, keeps its glass blur, and the links stay centered as a group — regardless of how far you scroll.</p>
  </div>

  <div class="spacer"></div>

  <div class="demo-section">
    <h2>Still here</h2>
    <p>The navbar never left the top of the viewport.</p>
  </div>

  <div class="spacer"></div>

</body>
</html>
