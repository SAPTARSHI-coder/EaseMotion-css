<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rain Drop Cursor · Falling Drops</title>

    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <!-- === RAIN DROP CURSOR === -->
    <div class="rain-container" id="rainContainer"></div>

    <!-- === CONTENT === -->
    <div class="card">
        <h2>🌧️ Rain Drop Cursor</h2>
        <p class="sub">drops fall from cursor position</p>

        <div class="cursor-demo-area">
            <p>Move your mouse around</p>
            <div class="interactive-hint">
                <i class="fas fa-mouse-pointer"></i>
                <span>Watch the rain fall</span>
            </div>
            <div class="demo-buttons">
                <button class="demo-btn">Hover me</button>
                <button class="demo-btn">Click me</button>
                <button class="demo-btn">Rain!</button>
            </div>
        </div>

        <p style="margin-top: 1.5rem; font-size: 0.85rem; color: #64748b;">
            Move your mouse · watch raindrops fall from the cursor
        </p>
    </div>

    <!-- Embedded JavaScript -->
    <script>
        (function() {
            'use strict';

            const container = document.getElementById('rainContainer');
            let mouseX = 0;
            let mouseY = 0;
            let isVisible = false;
            let dropInterval = null;

            // --- Create a raindrop ---
            function createRaindrop(x, y) {
                const drop = document.createElement('div');
                drop.className = 'rain-drop';

                // Random size
                const size = 1.5 + Math.random() * 3;
                const length = 12 + Math.random() * 20;
                drop.style.width = size + 'px';
                drop.style.height = length + 'px';

                // Random speed
                const speed = 0.5 + Math.random() * 0.8;
                drop.style.setProperty('--speed', speed + 's');

                // Random horizontal drift
                const drift = (Math.random() - 0.5) * 20;
                drop.style.setProperty('--drift', drift + 'px');

                // Random opacity
                const opacity = 0.3 + Math.random() * 0.4;
                drop.style.opacity = opacity;

                // Position
                const offsetX = (Math.random() - 0.5) * 10;
                const offsetY = (Math.random() - 0.5) * 10;
                drop.style.left = (x + offsetX) + 'px';
                drop.style.top = (y + offsetY) + 'px';

                // Random animation duration variation
                const duration = 0.6 + Math.random() * 0.6;
                drop.style.setProperty('--duration', duration + 's');

                container.appendChild(drop);

                // Remove drop after animation
                setTimeout(() => {
                    if (drop.parentNode) {
                        drop.remove();
                    }
                }, (duration + 1) * 1000);
            }

            // --- Create rain splash ---
            function createSplash(x, y) {
                for (let i = 0; i < 6; i++) {
                    const particle = document.createElement('div');
                    particle.className = 'rain-splash';

                    const size = 1 + Math.random() * 3;
                    particle.style.width = size + 'px';
                    particle.style.height = size + 'px';

                    const angle = Math.random() * 2 * Math.PI;
                    const dist = 10 + Math.random() * 25;
                    const vx = Math.cos(angle) * dist;
                    const vy = Math.sin(angle) * dist - 5;
                    particle.style.setProperty('--vx', vx + 'px');
                    particle.style.setProperty('--vy', vy + 'px');

                    particle.style.left = x + 'px';
                    particle.style.top = y + 'px';

                    container.appendChild(particle);

                    setTimeout(() => {
                        if (particle.parentNode) {
                            particle.remove();
                        }
                    }, 600);
                }
            }

            // --- Start rain ---
            function startRain() {
                if (dropInterval) return;
                dropInterval = setInterval(() => {
                    if (isVisible) {
                        for (let i = 0; i < 2; i++) {
                            const offsetX = (Math.random() - 0.5) * 15;
                            const offsetY = (Math.random() - 0.5) * 15;
                            createRaindrop(mouseX + offsetX, mouseY + offsetY);
                        }
                    }
                }, 50);
            }

            function stopRain() {
                if (dropInterval) {
                    clearInterval(dropInterval);
                    dropInterval = null;
                }
            }

            // --- Mouse move ---
            document.addEventListener('mousemove', function(e) {
                mouseX = e.clientX;
                mouseY = e.clientY;
                isVisible = true;
                container.style.display = 'block';
            });

            // --- Touch support ---
            document.addEventListener('touchmove', function(e) {
                e.preventDefault();
                const touch = e.touches[0];
                mouseX = touch.clientX;
                mouseY = touch.clientY;
                isVisible = true;
                container.style.display = 'block';
            }, { passive: false });

            document.addEventListener('touchstart', function(e) {
                const touch = e.touches[0];
                mouseX = touch.clientX;
                mouseY = touch.clientY;
                isVisible = true;
                container.style.display = 'block';
            });

            // --- Mouse leave ---
            document.addEventListener('mouseleave', function() {
                isVisible = false;
                container.style.display = 'none';
            });

            // --- Mouse enter ---
            document.addEventListener('mouseenter', function() {
                isVisible = true;
                container.style.display = 'block';
            });

            // --- Click burst ---
            document.addEventListener('click', function(e) {
                const x = e.clientX;
                const y = e.clientY;

                // Create many drops on click
                for (let i = 0; i < 15; i++) {
                    setTimeout(() => {
                        const offsetX = (Math.random() - 0.5) * 40;
                        const offsetY = (Math.random() - 0.5) * 40;
                        createRaindrop(x + offsetX, y + offsetY);
                    }, i * 30);
                }

                // Create splash
                createSplash(x, y);
                console.log('🌧️ Rain burst!');
            });

            // --- Hover effects ---
            const interactiveElements = document.querySelectorAll('a, button, .demo-btn, .interactive-hint');
            interactiveElements.forEach(el => {
                el.addEventListener('mouseenter', function() {
                    const rect = this.getBoundingClientRect();
                    const cx = rect.left + rect.width / 2;
                    const cy = rect.top + rect.height / 2;

                    for (let i = 0; i < 8; i++) {
                        setTimeout(() => {
                            const offsetX = (Math.random() - 0.5) * 30;
                            const offsetY = (Math.random() - 0.5) * 30;
                            createRaindrop(cx + offsetX, cy + offsetY);
                        }, i * 40);
                    }
                    createSplash(cx, cy);
                });
            });

            // --- Start rain ---
            startRain();

            console.log('🌧️ Rain drop cursor initialized!');

        })();
    </script>

</body>
</html>
