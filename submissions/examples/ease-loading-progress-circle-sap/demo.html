<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ease-loading-progress-circle-sap demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { height: 100vh; margin: 0; display: flex; align-items: center; justify-content: center; background: #f4f4f5; }
  </style>
</head>
<body>
  <div class="progress-circle-sap">
    <svg viewBox="0 0 120 120">
      <defs>
        <linearGradient id="pc-gradient-sap" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#2563eb"/>
          <stop offset="100%" stop-color="#7c3aed"/>
        </linearGradient>
      </defs>
      <circle class="pc-bg" cx="60" cy="60" r="52"/>
      <circle class="pc-fill" id="pcFill" cx="60" cy="60" r="52"/>
    </svg>
    <div class="pc-label" id="pcLabel">0%</div>
  </div>
  <script>
    const fill = document.getElementById('pcFill');
    const label = document.getElementById('pcLabel');
    const r = 52;
    const circumference = 2 * Math.PI * r;
    fill.style.strokeDasharray = circumference;
    fill.style.strokeDashoffset = circumference;

    let progress = 0;
    const timer = setInterval(() => {
      progress = Math.min(100, progress + Math.random() * 15);
      fill.style.strokeDashoffset = circumference - (progress / 100) * circumference;
      label.textContent = Math.round(progress) + '%';
      if (progress >= 100) clearInterval(timer);
    }, 400);
  </script>
</body>
</html>
