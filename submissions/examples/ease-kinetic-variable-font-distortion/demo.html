<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ease Dynamic Variable Font Weight & Axis Distortion Hero</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="var-font-body">
  <div class="v-hero-box">
    <h1 class="var-text" id="vText">KINETIC TYPE</h1>
    <p>Move mouse quickly across to distort variable font weight axes in real-time.</p>
  </div>

  <script>
    const vText = document.getElementById('vText');
    let lastX = 0, lastTime = Date.now();
    window.addEventListener('mousemove', (e) => {
      const now = Date.now();
      const dt = now - lastTime || 1;
      const speed = Math.abs(e.clientX - lastX) / dt;
      const wght = Math.min(900, Math.max(100, Math.round(speed * 300 + 200)));
      vText.style.fontWeight = wght;
      lastX = e.clientX; lastTime = now;
    });
  </script>
</body>
</html>
