<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animated Avatar Group - EaseMotion CSS Submission</title>
  
  <!-- EaseMotion CSS (Official CDN) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css">
  
  <!-- Local Avatar Group Component Styles -->
  <link rel="stylesheet" href="style.css">
  
  <style>
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: var(--ease-color-bg, #f8fafc);
      color: var(--ease-color-text, #0f172a);
      margin: 0;
      padding: 2rem;
      gap: 3rem;
    }
    .demo-container {
      width: 100%;
      max-width: 800px;
    }
    .demo-section {
      margin-bottom: 3rem;
    }
    .demo-title {
      font-size: 1.125rem;
      font-weight: 600;
      margin-bottom: 1rem;
      color: var(--ease-color-text, #0f172a);
    }
    .demo-card {
      background-color: var(--ease-color-surface, #ffffff);
      border-radius: var(--ease-radius-lg, 12px);
      padding: 2rem;
      box-shadow: var(--ease-shadow-md, 0 4px 6px -1px rgba(0, 0, 0, 0.1));
      border: 1px solid var(--ease-color-border, #e2e8f0);
    }
  </style>
</head>
<body>

  <div class="ease-center ease-fade-in" style="text-align: center;">
    <h1 class="ease-slide-up">Animated Avatar Group</h1>
    <p class="ease-slide-up ease-delay-100" style="color: var(--ease-color-text-muted, #64748b); max-width: 500px;">
      Zero JavaScript. Pure CSS avatar stacks with smooth hover unstack animations.
    </p>
  </div>

  <!-- Default Avatar Group -->
  <div class="demo-container demo-section ease-fade-in ease-delay-200">
    <h2 class="demo-title">Default Avatar Group (Hover to Unstack)</h2>
    <div class="demo-card">
      <div class="ease-avatar-group-xyz">
        <div class="ease-avatar-xyz" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
          <span>JD</span>
        </div>
        <div class="ease-avatar-xyz" style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);">
          <span>SK</span>
        </div>
        <div class="ease-avatar-xyz" style="background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);">
          <span>MR</span>
        </div>
        <div class="ease-avatar-xyz" style="background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);">
          <span>AL</span>
        </div>
        <div class="ease-avatar-xyz" style="background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);">
          <span>+5</span>
        </div>
      </div>
    </div>
  </div>

  <!-- With Images -->
  <div class="demo-container demo-section ease-fade-in ease-delay-300">
    <h2 class="demo-title">With Image Avatars</h2>
    <div class="demo-card">
      <div class="ease-avatar-group-xyz">
        <div class="ease-avatar-xyz">
          <img src="https://i.pravatar.cc/150?img=1" alt="User 1">
        </div>
        <div class="ease-avatar-xyz">
          <img src="https://i.pravatar.cc/150?img=2" alt="User 2">
        </div>
        <div class="ease-avatar-xyz">
          <img src="https://i.pravatar.cc/150?img=3" alt="User 3">
        </div>
        <div class="ease-avatar-xyz">
          <img src="https://i.pravatar.cc/150?img=4" alt="User 4">
        </div>
        <div class="ease-avatar-xyz ease-avatar-xyz-count">
          <span>+12</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Small Size -->
  <div class="demo-container demo-section ease-fade-in ease-delay-400">
    <h2 class="demo-title">Small Size Variant</h2>
    <div class="demo-card">
      <div class="ease-avatar-group-xyz ease-avatar-group-xyz-sm">
        <div class="ease-avatar-xyz" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
          <span>AB</span>
        </div>
        <div class="ease-avatar-xyz" style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);">
          <span>CD</span>
        </div>
        <div class="ease-avatar-xyz" style="background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);">
          <span>EF</span>
        </div>
        <div class="ease-avatar-xyz" style="background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);">
          <span>+8</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Large Size -->
  <div class="demo-container demo-section ease-fade-in ease-delay-500">
    <h2 class="demo-title">Large Size Variant</h2>
    <div class="demo-card">
      <div class="ease-avatar-group-xyz ease-avatar-group-xyz-lg">
        <div class="ease-avatar-xyz" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
          <span>XY</span>
        </div>
        <div class="ease-avatar-xyz" style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);">
          <span>ZW</span>
        </div>
        <div class="ease-avatar-xyz" style="background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);">
          <span>VU</span>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
