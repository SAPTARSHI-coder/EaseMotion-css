<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Laser Beam Effect - EaseMotion CSS</title>
  <!-- Import EaseMotion CSS -->
  <link rel="stylesheet" href="../../../easemotion.css">
  <!-- Component Specific Styles -->
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@500&display=swap" rel="stylesheet">
</head>
<body class="minimalist-bg">

  <div class="demo-container">
    
    <div class="header-section">
      <h1 class="ease-text-3xl">Animated Laser Beam</h1>
      <p class="ease-color-muted">A pure CSS sci-fi laser scanner effect. Powered entirely by layered box-shadows, linear-gradients, and keyframe translation for maximum GPU performance.</p>
    </div>

    <!-- The Scanner Component -->
    <div class="scanner-card">
      
      <div class="scanner-header">
        <span class="scanner-title">SECURITY SCAN //</span>
        <span class="scanner-status">ANALYZING TARGET...</span>
      </div>
      
      <!-- The Target Area where the laser sweeps -->
      <div class="scanner-viewport" aria-label="Biometric scanning animation in progress" role="img">
        
        <!-- Grid overlay -->
        <div class="grid-overlay"></div>
        
        <!-- Target content -->
        <div class="target-subject">
          <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="fingerprint-icon">
            <path d="M2 12C2 6.48 6.48 2 12 2s10 4.48 10 10"></path>
            <path d="M5 12c0-3.87 3.13-7 7-7s7 3.13 7 7"></path>
            <path d="M8.21 13.89A5 5 0 0 1 12 8c2.76 0 5 2.24 5 5"></path>
            <path d="M11 11a1 1 0 0 1 2 0"></path>
            <path d="M11 14.5a3.5 3.5 0 0 1 7 0"></path>
            <path d="M7 16a9 9 0 0 1-5-4"></path>
            <path d="M17 19.5a5.5 5.5 0 0 1-11 0"></path>
            <path d="M8 21.5a8.5 8.5 0 0 1 8-2"></path>
            <path d="M12 22v-4"></path>
          </svg>
        </div>

        <!-- The Animated Laser Beam -->
        <div class="laser-beam"></div>
        
      </div>
      
    </div>

  </div>

</body>
</html>
