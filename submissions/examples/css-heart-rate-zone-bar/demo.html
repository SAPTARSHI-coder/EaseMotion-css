<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Heart Rate Zone Bar | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="hr-card" aria-label="Heart Rate Zone Tracker">
    <header class="hr-header">
      <div>
        <h1>Cardio Workout</h1>
        <p>Real-time Zone Analysis</p>
      </div>
      <div class="current-bpm" aria-live="polite">
        <div class="bpm-number">158</div>
        <div class="bpm-unit">BPM</div>
      </div>
    </header>

    <div class="zone-bar-container" aria-label="Heart rate zone visual scale">
      <!-- Animated Zone Location Marker -->
      <div class="zone-marker" aria-hidden="true">
        <span class="marker-label">158 BPM</span>
        <span class="marker-pin"></span>
      </div>

      <!-- Segmented Bar -->
      <div class="zone-bar" role="progressbar" aria-valuenow="158" aria-valuemin="100" aria-valuemax="200" aria-valuetext="158 BPM in Zone 4 Hard">
        <div class="zone-segment z-1" title="Zone 1: Very Light (50-60%)"></div>
        <div class="zone-segment z-2" title="Zone 2: Light (60-70%)"></div>
        <div class="zone-segment z-3" title="Zone 3: Moderate (70-80%)"></div>
        <div class="zone-segment z-4" title="Zone 4: Hard (80-90%)"></div>
        <div class="zone-segment z-5" title="Zone 5: Peak (90-100%)"></div>
      </div>
    </div>

    <!-- Zone Breakdown Legend -->
    <section class="zone-legend" aria-label="Heart rate zone legend breakdown">
      <div class="legend-item">
        <span class="legend-badge" style="background-color: var(--zone-1)"></span>
        <span class="legend-name">Z1 Light</span>
        <span class="legend-range">100-120</span>
      </div>
      <div class="legend-item">
        <span class="legend-badge" style="background-color: var(--zone-2)"></span>
        <span class="legend-name">Z2 Endure</span>
        <span class="legend-range">120-140</span>
      </div>
      <div class="legend-item">
        <span class="legend-badge" style="background-color: var(--zone-3)"></span>
        <span class="legend-name">Z3 Aerobic</span>
        <span class="legend-range">140-160</span>
      </div>
      <div class="legend-item active">
        <span class="legend-badge" style="background-color: var(--zone-4)"></span>
        <span class="legend-name">Z4 Hard</span>
        <span class="legend-range">160-180</span>
      </div>
      <div class="legend-item">
        <span class="legend-badge" style="background-color: var(--zone-5)"></span>
        <span class="legend-name">Z5 Peak</span>
        <span class="legend-range">180-200</span>
      </div>
    </section>
  </main>
</body>
</html>
