<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Sci-Fi HUD: Velvet Smooth</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <button class="velvet-hud" aria-label="Engage Warp Drive">
    
    <!-- Decorative Rings -->
    <div class="velvet-ring ring-outer" aria-hidden="true"></div>
    <div class="velvet-ring ring-inner" aria-hidden="true"></div>
    <div class="velvet-ring ring-core" aria-hidden="true"></div>
    
    <!-- Core Data -->
    <div class="hud-content">
      <h2 class="hud-title">Synapse</h2>
      <div class="hud-value">0.99</div>
    </div>

  </button>

</body>
</html>
