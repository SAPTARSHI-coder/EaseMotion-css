<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wavy Text Effect | EaseMotion CSS</title><link rel="stylesheet" href="style.css"></head>
<body><div class="wt-root">
<h1 class="wt-title" aria-label="Pure CSS Wave">
<span class="wt-char" style="animation-delay:0s">P</span><span class="wt-char" style="animation-delay:0.05s">u</span><span class="wt-char" style="animation-delay:0.1s">r</span><span class="wt-char" style="animation-delay:0.15s">e</span><span class="wt-char" style="animation-delay:0.2s"> </span><span class="wt-char" style="animation-delay:0.25s">C</span><span class="wt-char" style="animation-delay:0.3s">S</span><span class="wt-char" style="animation-delay:0.35s">S</span>
</h1>
<p class="wt-sub">Each letter waves independently with staggered animation delays using pure CSS.</p>
</div></body></html>
