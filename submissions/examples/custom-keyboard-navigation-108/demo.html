<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elastic Bounce Dropdown</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="container">
    <div class="card">
      <p class="label">NEUMORPHIC UI</p>
      <h1>Choose a Framework</h1>
      <p class="description">
        Select your preferred technology from the dropdown.
      </p>

      <div class="dropdown">
        <button
          class="dropdown-btn"
          id="dropdownBtn"
          aria-expanded="false"
          aria-haspopup="listbox"
        >
          <span id="selected">Select framework</span>
          <span class="arrow">⌄</span>
        </button>

        <ul class="menu" id="menu" role="listbox">
          <li role="option" tabindex="0">React</li>
          <li role="option" tabindex="0">Vue</li>
          <li role="option" tabindex="0">Angular</li>
          <li role="option" tabindex="0">Svelte</li>
          <li role="option" tabindex="0">Next.js</li>
        </ul>
      </div>

      <p class="hint">
        Use ↑ ↓ keys to navigate • Enter to select • Esc to close
      </p>
    </div>
  </main>

  <script>
    const dropdownBtn = document.getElementById("dropdownBtn");
    const menu = document.getElementById("menu");
    const selected = document.getElementById("selected");
    const options = menu.querySelectorAll("li");

    let currentIndex = -1;

    function openMenu() {
      menu.classList.add("open");
      dropdownBtn.setAttribute("aria-expanded", "true");
    }

    function closeMenu() {
      menu.classList.remove("open");
      dropdownBtn.setAttribute("aria-expanded", "false");
      currentIndex = -1;
    }

    function selectOption(index) {
      selected.textContent = options[index].textContent;
      options.forEach(option => option.classList.remove("active"));
      options[index].classList.add("active");
      closeMenu();
      dropdownBtn.focus();
    }

    dropdownBtn.addEventListener("click", () => {
      if (menu.classList.contains("open")) {
        closeMenu();
      } else {
        openMenu();
      }
    });

    options.forEach((option, index) => {
      option.addEventListener("click", () => {
        selectOption(index);
      });

      option.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          selectOption(index);
        }
      });
    });

    dropdownBtn.addEventListener("keydown", (event) => {
      if (event.key === "ArrowDown") {
        event.preventDefault();
        openMenu();
        currentIndex = 0;
        options[currentIndex].focus();
      }

      if (event.key === "ArrowUp") {
        event.preventDefault();
        openMenu();
        currentIndex = options.length - 1;
        options[currentIndex].focus();
      }

      if (event.key === "Escape") {
        closeMenu();
      }
    });

    menu.addEventListener("keydown", (event) => {
      if (event.key === "ArrowDown") {
        event.preventDefault();

        currentIndex =
          (currentIndex + 1) % options.length;

        options[currentIndex].focus();
      }

      if (event.key === "ArrowUp") {
        event.preventDefault();

        currentIndex =
          (currentIndex - 1 + options.length) % options.length;

        options[currentIndex].focus();
      }

      if (event.key === "Enter") {
        event.preventDefault();

        if (currentIndex >= 0) {
          selectOption(currentIndex);
        }
      }

      if (event.key === "Escape") {
        closeMenu();
        dropdownBtn.focus();
      }
    });

    document.addEventListener("click", (event) => {
      if (!event.target.closest(".dropdown")) {
        closeMenu();
      }
    });
  </script>

</body>
</html>
