<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Shimmer-Sweep Hero Section - Minimalist Tech</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="layout-container">
        
        <!-- Controls to re-trigger animation for demo purposes -->
        <div class="controls-wrapper">
            <input type="checkbox" id="trigger-anim" class="trigger-checkbox" checked>
            <label for="trigger-anim" class="btn-trigger">Reload Hero Section</label>
        </div>

        <!-- The Hero Section -->
        <section class="hero-section shimmer-sweep">
            
            <div class="hero-content">
                <div class="badge">Performance Analytics</div>
                
                <h1 class="hero-title">
                    Real-time Insights.<br>
                    <span class="highlight">Zero Latency.</span>
                </h1>
                
                <p class="hero-subtitle">
                    Ingest millions of events per second with our highly optimized columnar storage engine. Watch your data flow instantly.
                </p>
                
                <div class="hero-actions">
                    <button class="btn btn-primary">Start Analyzing</button>
                    <button class="btn btn-secondary">View Benchmarks</button>
                </div>
            </div>

            <!-- Abstract minimal tech visual representation -->
            <div class="hero-visual">
                <div class="data-grid">
                    <div class="grid-cell fill-1"></div>
                    <div class="grid-cell fill-2"></div>
                    <div class="grid-cell fill-3"></div>
                    <div class="grid-cell fill-4"></div>
                    
                    <div class="grid-cell fill-3"></div>
                    <div class="grid-cell fill-1"></div>
                    <div class="grid-cell fill-4"></div>
                    <div class="grid-cell fill-2"></div>
                    
                    <div class="grid-cell fill-2"></div>
                    <div class="grid-cell fill-4"></div>
                    <div class="grid-cell fill-1"></div>
                    <div class="grid-cell fill-3"></div>
                    
                    <div class="grid-cell fill-4"></div>
                    <div class="grid-cell fill-2"></div>
                    <div class="grid-cell fill-3"></div>
                    <div class="grid-cell fill-1"></div>
                </div>
            </div>

        </section>

    </div>

</body>
</html>
