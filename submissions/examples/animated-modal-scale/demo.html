

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EaseMotion - Scale Modal</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <button
    class="modal-trigger"
    onclick="document.querySelector('.modal').classList.add('is-open')"
  >
    Open Modal
  </button>

  <div class="modal" role="dialog" aria-modal="true">
    <div class="modal-content">
      <button
        class="close"
        onclick="document.querySelector('.modal').classList.remove('is-open')"
      >
        Close
      </button>

      <h2>Scale Modal</h2>
      <p>This dialog scales smoothly into view.</p>
    </div>
  </div>

</body>
</html>
