<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comet Cursor Showcase</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="hero-section">
        <div class="comet-core" id="cometCore"></div>
        <div class="content-box">
            <h1>Celestial Comet Cursor</h1>
            <p>Move your mouse around to leave a glowing, shimmering cosmic tail across the screen.</p>
            <button class="interactive-btn">Hover & Click Me</button>
        </div>
    </div>

    <script>
        const core = document.getElementById('cometCore');
        
        // Mouse tracking for the pulsing core
        document.addEventListener('mousemove', (e) => {
            core.style.left = `${e.clientX}px`;
            core.style.top = `${e.clientY}px`;
            
            // Spawn trailing particles dynamically
            createParticle(e.clientX, e.clientY);
        });

        function createParticle(x, y) {
            const particle = document.createElement('div');
            particle.className = 'comet-particle';
            
            // Random size between 3px and 9px
            const size = Math.random() * 6 + 3;
            particle.style.width = `${size}px`;
            particle.style.height = `${size}px`;
            
            // Random offset for drift
            const offsetX = (Math.random() - 0.5) * 40;
            const offsetY = (Math.random() - 0.5) * 40;
            
            particle.style.left = `${x + offsetX}px`;
            particle.style.top = `${y + offsetY}px`;
            
            document.body.appendChild(particle);
            
            // Remove particle after animation completes
            setTimeout(() => {
                particle.remove();
            }, 800);
        }

        // Click burst effect
        document.addEventListener('click', (e) => {
            for (let i = 0; i < 30; i++) {
                createBurstParticle(e.clientX, e.clientY);
            }
        });

        function createBurstParticle(x, y) {
            const particle = document.createElement('div');
            particle.className = 'burst-particle';
            particle.style.left = `${x}px`;
            particle.style.top = `${y}px`;
            
            const angle = Math.random() * Math.PI * 2;
            const speed = Math.random() * 80 + 20;
            const destX = Math.cos(angle) * speed;
            const destY = Math.sin(angle) * speed;
            
            particle.style.setProperty('--dx', `${destX}px`);
            particle.style.setProperty('--dy', `${destY}px`);
            
            document.body.appendChild(particle);
            setTimeout(() => particle.remove(), 600);
        }
    </script>
</body>
</html>
