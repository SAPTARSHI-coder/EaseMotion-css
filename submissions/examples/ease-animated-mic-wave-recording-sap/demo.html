<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animated Mic Wave Recording</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <h1>Animated Mic Wave Recording</h1>

    <button class="record-btn" id="recordBtn" role="switch" aria-checked="false" aria-label="Start recording">
      🎤
    </button>

    <div class="wave-bars" id="waveBars" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span>
    </div>

    <p class="status-text" id="statusText" role="status" aria-live="polite">Not recording</p>
  </main>

  <script>
    const btn = document.getElementById('recordBtn');
    const bars = document.getElementById('waveBars');
    const status = document.getElementById('statusText');

    btn.addEventListener('click', () => {
      const recording = btn.getAttribute('aria-checked') === 'true';
      btn.setAttribute('aria-checked', String(!recording));
      btn.setAttribute('aria-label', recording ? 'Start recording' : 'Stop recording');
      btn.classList.toggle('is-recording', !recording);
      bars.classList.toggle('is-active', !recording);
      status.textContent = recording ? 'Not recording' : 'Recording…';
    });
  </script>
</body>
</html>
