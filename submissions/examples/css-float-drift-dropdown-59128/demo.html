<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Float-Drift Dropdown - EaseMotion</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="showcase-container">
    <header class="hub-header">
      <div class="logo">GamingHub</div>
      <nav class="nav-menu">
        <ul class="menu-list">
          <li class="menu-item">
            <a href="#" class="menu-link">Esports <span class="arrow">▼</span></a>
            <div class="dropdown float-drift">
              <ul class="dropdown-list">
                <li><a href="#">Tournaments</a></li>
                <li><a href="#">Rankings</a></li>
                <li><a href="#">Live Streams</a></li>
              </ul>
            </div>
          </li>
          <li class="menu-item">
            <a href="#" class="menu-link">Community <span class="arrow">▼</span></a>
            <div class="dropdown float-drift">
              <ul class="dropdown-list">
                <li><a href="#">Forums</a></li>
                <li><a href="#">Discord</a></li>
                <li><a href="#">Guilds</a></li>
              </ul>
            </div>
          </li>
          <li class="menu-item">
            <a href="#" class="menu-link">Store</a>
          </li>
        </ul>
      </nav>
      <div class="user-actions">
        <button class="login-btn">Login</button>
      </div>
    </header>

    <main class="hub-content">
      <h1>Welcome to the Ultimate Gaming Hub</h1>
      <p>Hover over the navigation menu to see the Float-Drift Dropdown in action.</p>
    </main>
  </div>
</body>
</html>
