<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portal Button · Swirling Portal Effect</title>

    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <div class="card">
        <h2>🌌 Portal Button</h2>
        <p class="sub">opens a swirling portal effect around it</p>

        <!-- === PORTAL BUTTON === -->
        <button class="portal-btn" id="portalBtn">
            <span class="portal-content">
                <i class="fas fa-wand-magic-sparkles"></i>
                <span>Portal</span>
            </span>
            <span class="portal-ring ring-1"></span>
            <span class="portal-ring ring-2"></span>
            <span class="portal-ring ring-3"></span>
            <span class="portal-ring ring-4"></span>
            <span class="portal-ring ring-5"></span>
            <span class="portal-ring ring-6"></span>
            <span class="portal-ring ring-7"></span>
            <span class="portal-ring ring-8"></span>
            <span class="portal-particles"></span>
        </button>

        <p style="margin-top: 2rem; font-size: 0.85rem; color: #64748b;">
            Hover · watch the swirling portal open around it
        </p>
    </div>

    <!-- Embedded JavaScript -->
    <script>
        (function() {
            'use strict';

            const btn = document.getElementById('portalBtn');

            // Click feedback
            btn.addEventListener('click', function(e) {
                this.classList.add('click-pulse');
                setTimeout(() => {
                    this.classList.remove('click-pulse');
                }, 300);
                console.log('🌌 Portal opened!');
            });

            // Keyboard accessibility
            btn.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    this.click();
                }
            });

            // Reset animation on hover
            btn.addEventListener('mouseenter', function() {
                const rings = this.querySelectorAll('.portal-ring');
                rings.forEach(ring => {
                    ring.style.animation = 'none';
                    void ring.offsetWidth;
                    ring.style.animation = '';
                });
                const particles = this.querySelector('.portal-particles');
                particles.style.animation = 'none';
                void particles.offsetWidth;
                particles.style.animation = '';
            });

            console.log('🌌 Portal button initialized!');

        })();
    </script>

</body>
</html>
