<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grain Elevator Bucket — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Grain Elevator Bucket demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Grain Elevator Bucket</h1>
      <p class="lede">Grain elevator buckets lifting cereal upward</p>
    </header>

    <section class="ease-grain-elevator-bucket" data-demo="grain-elevator-bucket" aria-live="polite">
      <div class="ease-grain-elevator-bucket__housing">
        <div class="ease-grain-elevator-bucket__bezel">
          <div class="ease-grain-elevator-bucket__face">
            <div class="ease-grain-elevator-bucket__readout">
              <span class="ease-grain-elevator-bucket__label">Grain Elevator Bucket</span>
              <span class="ease-grain-elevator-bucket__value">LIVE</span>
            </div>
            <div class="ease-grain-elevator-bucket__motion" aria-hidden="true">
              <span class="ease-grain-elevator-bucket__a"></span>
              <span class="ease-grain-elevator-bucket__b"></span>
              <span class="ease-grain-elevator-bucket__c"></span>
              <span class="ease-grain-elevator-bucket__d"></span>
            </div>
            <div class="ease-grain-elevator-bucket__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-grain-elevator-bucket__controls">
          <button type="button" class="ease-grain-elevator-bucket__btn primary">Engage</button>
          <button type="button" class="ease-grain-elevator-bucket__btn">Reset</button>
          <label class="ease-grain-elevator-bucket__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-grain-elevator-bucket__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
