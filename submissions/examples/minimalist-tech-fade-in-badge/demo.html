<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Fade-In Badge - Minimalist Tech</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="layout-container">
        
        <header class="section-header">
            <h1 class="title">Filter Tags</h1>
            <p class="subtitle">A minimalist tech badge component featuring a staggered, smooth fade-in entrance animation.</p>
        </header>

        <div class="dashboard-area">
            
            <div class="card">
                
                <!-- 
                   Pure CSS State Management for Badge Container 
                   We use a checkbox to toggle the state to replay the animation.
                -->
                <div class="controls">
                    <input type="checkbox" id="replay-toggle" class="replay-input" checked>
                    <label for="replay-toggle" class="btn-replay">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"></polyline><polyline points="23 20 23 14 17 14"></polyline><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"></path></svg>
                        Replay Entrance
                    </label>
                    
                    <div class="badge-container fade-in-group">
                        
                        <!-- Badge 1: Technology -->
                        <div class="badge color-blue delay-1">
                            <span class="badge-text">React.js</span>
                            <span class="badge-count">24</span>
                        </div>
                        
                        <!-- Badge 2: Technology -->
                        <div class="badge color-blue delay-2">
                            <span class="badge-text">Node.js</span>
                            <span class="badge-count">18</span>
                        </div>
                        
                        <!-- Badge 3: Type -->
                        <div class="badge color-purple delay-3">
                            <span class="badge-text">Frontend</span>
                            <span class="badge-count">42</span>
                        </div>
                        
                        <!-- Badge 4: Status -->
                        <div class="badge color-emerald delay-4">
                            <span class="badge-text">Active</span>
                            <span class="badge-count">15</span>
                        </div>
                        
                        <!-- Badge 5: Clear All (Ghost style) -->
                        <div class="badge ghost delay-5">
                            <svg class="badge-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                            <span class="badge-text">Clear Filters</span>
                        </div>
                        
                    </div>
                </div>
                
            </div>
            
        </div>
    </div>

</body>
</html>
