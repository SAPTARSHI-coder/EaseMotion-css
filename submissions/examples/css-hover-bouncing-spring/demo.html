<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Hover: Bouncing Spring Variation - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="em-demo-container">
        <!-- Pure CSS Bouncing Spring Hover Effect Component Showcase -->
        <header class="em-hover-card" role="region" aria-label="Bouncing Spring Hover Showcase" tabindex="0">
            <div class="em-hover-header-bar">
                <span class="em-card-badge">HOVER EFFECT</span>
                <span class="em-brand-logo">SpringMotion</span>
            </div>
            <h1 class="em-card-title">Bouncing Spring Effect</h1>
            <p class="em-card-desc">A smooth, accessible, and performant pure CSS hover effect featuring bouncing spring physics, dark mode compatibility, and hardware acceleration.</p>
            <div class="em-hover-wrapper">
                <button class="ease-bouncing-spring-btn" aria-label="Interactive Bouncing Spring Button" tabindex="0">
                    <span class="em-btn-label">Hover & Bounce</span>
                </button>
            </div>
        </header>
    </div>
</body>
</html>
