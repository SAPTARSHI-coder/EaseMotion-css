<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Retro Arcade Pixel CSS Toast">
  <title>Retro Arcade Pixel Toast</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section class="toast" role="status" aria-live="polite">
      <div class="toast-icon" aria-hidden="true">!</div>

      <div class="toast-content">
        <span class="toast-label">SYSTEM MESSAGE</span>
        <h1>LEVEL UP!</h1>
        <p>Your arcade session is ready to continue.</p>
      </div>

      <button class="toast-close" type="button" aria-label="Close notification">
        ×
      </button>
    </section>
  </main>
</body>
</html>
