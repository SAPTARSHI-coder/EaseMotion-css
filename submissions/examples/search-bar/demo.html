<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expandable Search Bar Demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body, html {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f8fafc;
      color: #334155;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .demo-container {
      text-align: center;
    }

    h1 {
      margin-bottom: 2rem;
      font-weight: 400;
    }
  </style>
</head>
<body>

  <div class="demo-container">
    <h1>Expandable Search Bar</h1>
    
    <!-- The Search Component -->
    <div class="ease-search-expandable">
      <div class="search-icon">
        <!-- A simple SVG magnifying glass -->
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </div>
      <!-- Use type="text" or type="search" -->
      <input type="search" placeholder="Search EaseMotion...">
    </div>

    <p style="margin-top: 3rem; opacity: 0.6; max-width: 400px; line-height: 1.5;">
      Click or tap the magnifying glass icon (or anywhere inside the pill) to focus the input and reveal the full search bar seamlessly.
    </p>
  </div>

</body>
</html>
