<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Plasma Ball – Plasma Arcs Follow Cursor</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <h1>⚡ Plasma Ball</h1>
    <p class="subtitle">Plasma arcs follow your cursor</p>

    <div class="plasma-container">
      <div class="plasma-stage" id="plasmaStage">
        <canvas id="canvas"></canvas>
        
        <!-- Info overlay -->
        <div class="info-overlay">
          <span class="plasma-status" id="plasmaStatus">⚡ Active</span>
          <span class="arc-count" id="arcCount">✦ 0 arcs</span>
        </div>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <button class="ctrl-btn toggle" id="toggleBtn">💡 Toggle</button>
      <button class="ctrl-btn reset" id="resetBtn">↺ Reset</button>
      <button class="ctrl-btn burst" id="burstBtn">💥 Burst</button>
    </div>

    <!-- Sliders -->
    <div class="slider-container">
      <span class="slider-label">Arc Intensity</span>
      <input type="range" id="intensitySlider" min="0" max="100" value="70" />
      <span class="slider-value" id="intensityValue">70%</span>
    </div>

    <div class="slider-container">
      <span class="slider-label">Arc Speed</span>
      <input type="range" id="speedSlider" min="1" max="10" value="5" />
      <span class="slider-value" id="speedValue">5×</span>
    </div>

    <div class="slider-container">
      <span class="slider-label">Color</span>
      <input type="range" id="colorSlider" min="0" max="360" value="220" />
      <span class="slider-value" id="colorValue">220°</span>
    </div>

    <div class="slider-container">
      <span class="slider-label">Arc Count</span>
      <input type="range" id="countSlider" min="3" max="12" value="6" />
      <span class="slider-value" id="countValue">6</span>
    </div>

    <!-- Status -->
    <div class="status" id="status">⚡ Move your cursor to control the plasma arcs</div>

    <!-- Keyboard shortcuts -->
    <div class="shortcuts">
      <kbd>Mouse</kbd> Control arcs · <kbd>T</kbd> Toggle · <kbd>R</kbd> Reset · <kbd>B</kbd> Burst
    </div>
  </div>

  <script>
    (function() {
      "use strict";

      // DOM elements
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      const plasmaStatus = document.getElementById('plasmaStatus');
      const arcCount = document.getElementById('arcCount');
      const toggleBtn = document.getElementById('toggleBtn');
      const resetBtn = document.getElementById('resetBtn');
      const burstBtn = document.getElementById('burstBtn');
      const status = document.getElementById('status');
      const intensitySlider = document.getElementById('intensitySlider');
      const intensityValue = document.getElementById('intensityValue');
      const speedSlider = document.getElementById('speedSlider');
      const speedValue = document.getElementById('speedValue');
      const colorSlider = document.getElementById('colorSlider');
      const colorValue = document.getElementById('colorValue');
      const countSlider = document.getElementById('countSlider');
      const countValue = document.getElementById('countValue');

      // State
      let isActive = true;
      let mouseX = 0;
      let mouseY = 0;
      let isMouseOnCanvas = false;
      let animationId = null;
      let time = 0;
      let burstParticles = [];
      let isBursting = false;
      let burstTimer = null;

      // ----- Canvas setup -----
      function setupCanvas() {
        const rect = canvas.parentElement.getBoundingClientRect();
        const size = Math.min(rect.width - 40, 600);
        canvas.width = size;
        canvas.height = size;
        canvas.style.width = size + 'px';
        canvas.style.height = size + 'px';
      }

      // ----- Burst particle class -----
      class BurstParticle {
        constructor(x, y) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 2 + Math.random() * 6;
          this.x = x;
          this.y = y;
          this.vx = Math.cos(angle) * speed;
          this.vy = Math.sin(angle) * speed;
          this.size = 1 + Math.random() * 4;
          this.life = 1;
          this.decay = 0.01 + Math.random() * 0.02;
          this.hue = 220 + Math.random() * 40;
          this.saturation = 80 + Math.random() * 20;
          this.lightness = 60 + Math.random() * 30;
          this.glowSize = this.size * 4;
        }

        update() {
          this.x += this.vx;
          this.y += this.vy;
          this.vx *= 0.99;
          this.vy *= 0.99;
          this.life -= this.decay;
          this.size *= 0.998;
          return this.life > 0 && this.size > 0.1;
        }

        draw(ctx) {
          const alpha = this.life * 0.8;
          const size = this.size * this.life;
          
          // Glow
          const gradient = ctx.createRadialGradient(
            this.x, this.y, 0,
            this.x, this.y, size * 5
          );
          gradient.addColorStop(0, `hsla(${this.hue + 20}, 100%, 90%, ${alpha * 0.3})`);
          gradient.addColorStop(1, `hsla(${this.hue}, 100%, 60%, 0)`);
          ctx.fillStyle = gradient;
          ctx.beginPath();
          ctx.arc(this.x, this.y, size * 5, 0, Math.PI * 2);
          ctx.fill();

          // Core
          ctx.fillStyle = `hsla(${this.hue + 30}, 100%, 95%, ${alpha * 0.9})`;
          ctx.beginPath();
          ctx.arc(this.x, this.y, size, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // ----- Draw plasma arcs -----
      function drawPlasma() {
        const w = canvas.width;
        const h = canvas.height;
        const cx = w / 2;
        const cy = h / 2;
        const intensity = parseInt(intensitySlider.value) / 100;
        const speed = parseInt(speedSlider.value) / 5;
        const hue = parseInt(colorSlider.value);
        const arcCountVal = parseInt(countSlider.value);

        // Clear
        ctx.clearRect(0, 0, w, h);

        // Background - dark with subtle glow
        const bgGradient = ctx.createRadialGradient(cx, cy, 0, cx, cy, w * 0.7);
        bgGradient.addColorStop(0, '#0a0a1a');
        bgGradient.addColorStop(0.5, '#060612');
        bgGradient.addColorStop(1, '#020208');
        ctx.fillStyle = bgGradient;
        ctx.fillRect(0, 0, w, h);

        if (!isActive) {
          plasmaStatus.textContent = '🌑 Inactive';
          status.textContent = '🌑 Plasma ball off';
          return;
        }

        // Calculate cursor position relative to center
        const dx = isMouseOnCanvas ? mouseX - cx : 0;
        const dy = isMouseOnCanvas ? mouseY - cy : 0;
        const dist = Math.sqrt(dx * dx + dy * dy);
        const maxDist = Math.min(w, h) * 0.45;
        const normalizedDist = Math.min(1, dist / maxDist);

        // Draw glow ring
        const ringGlow = ctx.createRadialGradient(cx, cy, 0, cx, cy, maxDist);
        ringGlow.addColorStop(0, `hsla(${hue + 20}, 80%, 60%, ${0.02 * intensity})`);
        ringGlow.addColorStop(0.5, `hsla(${hue}, 80%, 40%, ${0.01 * intensity})`);
        ringGlow.addColorStop(1, `hsla(${hue - 20}, 80%, 20%, 0)`);
        ctx.fillStyle = ringGlow;
        ctx.beginPath();
        ctx.arc(cx, cy, maxDist, 0, Math.PI * 2);
        ctx.fill();

        // Draw arcs
        const arcCountTotal = arcCountVal + Math.floor(intensity * 4);
        
        for (let i = 0; i < arcCountTotal; i++) {
          const angleOffset = (i / arcCountTotal) * Math.PI * 2 + time * 0.02 * speed;
          const arcLength = 0.3 + 0.7 * (0.3 + 0.7 * (0.5 + 0.5 * Math.sin(time * 0.1 + i * 0.5)));
          const arcWidth = 1 + intensity * 3;
          
          // Calculate arc path
          const points = [];
          const segments = 20 + Math.floor(intensity * 20);
          
          for (let j = 0; j <= segments; j++) {
            const t = j / segments;
            const angle = angleOffset + t * Math.PI * 1.2 * arcLength;
            const r = maxDist * (0.1 + 0.9 * t * (0.5 + 0.5 * (1 - normalizedDist)));
            
            // Add wobble for organic feel
            const wobble = Math.sin(t * Math.PI * 4 + time * 0.5 * speed + i) * (3 + intensity * 10) * (1 - t * 0.5);
            const wobble2 = Math.cos(t * Math.PI * 3 + time * 0.3 * speed + i * 0.5) * (2 + intensity * 5) * (1 - t * 0.3);
            
            // Attract to cursor
            const attractStrength = normalizedDist * 0.3;
            const targetX = cx + Math.cos(angle) * r + wobble + wobble2;
            const targetY = cy + Math.sin(angle) * r + wobble * 0.5 + wobble2 * 0.3;
            
            // Blend toward cursor if close
            const blendX = isMouseOnCanvas ? mouseX : cx;
            const blendY = isMouseOnCanvas ? mouseY : cy;
            const blendFactor = (1 - t) * normalizedDist * 0.3;
            
            const finalX = targetX + (blendX - targetX) * blendFactor;
            const finalY = targetY + (blendY - targetY) * blendFactor;
            
            points.push({ x: finalX, y: finalY, t: t });
          }
          
          // Draw arc
          if (points.length > 1) {
            // Glow trail
            for (let j = 1; j < points.length; j++) {
              const p = points[j];
              const t = p.t;
              const alpha = intensity * (0.3 + 0.7 * (1 - t)) * (0.5 + 0.5 * Math.sin(time * 0.2 + i + j * 0.1));
              const size = arcWidth * (0.3 + 0.7 * (1 - t));
              
              const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, size * 3);
              const hueShift = (t * 60 + i * 10) % 360;
              grad.addColorStop(0, `hsla(${hue + hueShift + 20}, 100%, 80%, ${alpha * 0.1})`);
              grad.addColorStop(1, `hsla(${hue + hueShift}, 100%, 60%, 0)`);
              ctx.fillStyle = grad;
              ctx.beginPath();
              ctx.arc(p.x, p.y, size * 3, 0, Math.PI * 2);
              ctx.fill();
            }
            
            // Arc line
            ctx.beginPath();
            for (let j = 0; j < points.length; j++) {
              const p = points[j];
              if (j === 0) ctx.moveTo(p.x, p.y);
              else ctx.lineTo(p.x, p.y);
            }
            
            const grad = ctx.createLinearGradient(
              points[0].x, points[0].y,
              points[points.length - 1].x, points[points.length - 1].y
            );
            const hueStart = hue;
            const hueEnd = (hue + 60 + i * 10) % 360;
            grad.addColorStop(0, `hsla(${hueStart}, 100%, 70%, ${0.5 * intensity})`);
            grad.addColorStop(0.5, `hsla(${hue + 30}, 100%, 85%, ${0.7 * intensity})`);
            grad.addColorStop(1, `hsla(${hueEnd}, 100%, 60%, ${0.3 * intensity})`);
            
            ctx.strokeStyle = grad;
            ctx.lineWidth = arcWidth * (0.5 + 0.5 * intensity);
            ctx.shadowColor = `hsla(${hue + 20}, 100%, 60%, ${0.1 * intensity})`;
            ctx.shadowBlur = 20;
            ctx.stroke();
            ctx.shadowBlur = 0;
          }
        }

        // Draw center glow
        const centerGlow = ctx.createRadialGradient(cx, cy, 0, cx, cy, 20);
        const centerAlpha = 0.1 + intensity * 0.2;
        centerGlow.addColorStop(0, `hsla(${hue + 20}, 100%, 90%, ${centerAlpha})`);
        centerGlow.addColorStop(0.5, `hsla(${hue}, 100%, 70%, ${centerAlpha * 0.5})`);
        centerGlow.addColorStop(1, `hsla(${hue - 20}, 100%, 50%, 0)`);
        ctx.fillStyle = centerGlow;
        ctx.beginPath();
        ctx.arc(cx, cy, 20, 0, Math.PI * 2);
        ctx.fill();

        // Center core
        const coreSize = 5 + intensity * 5;
        ctx.fillStyle = `hsla(${hue + 30}, 100%, 95%, ${0.3 + intensity * 0.4})`;
        ctx.shadowColor = `hsla(${hue}, 100%, 70%, ${0.2 * intensity})`;
        ctx.shadowBlur = 30;
        ctx.beginPath();
        ctx.arc(cx, cy, coreSize, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;

        // Draw burst particles
        if (isBursting) {
          burstParticles = burstParticles.filter(p => p.update());
          burstParticles.forEach(p => p.draw(ctx));
          if (burstParticles.length === 0) {
            isBursting = false;
          }
        }

        // Update status
        plasmaStatus.textContent = isActive ? '⚡ Active' : '🌑 Inactive';
        arcCount.textContent = `✦ ${arcCountTotal} arcs`;
        status.textContent = isActive ? '⚡ Move your cursor to control the plasma arcs' : '🌑 Plasma ball off';
      }

      // ----- Animation loop -----
      function animate() {
        time += 0.016;
        drawPlasma();
        animationId = requestAnimationFrame(animate);
      }

      // ----- Start animation -----
      function startAnimation() {
        if (animationId) {
          cancelAnimationFrame(animationId);
        }
        animate();
      }

      // ----- Toggle -----
      function togglePlasma() {
        isActive = !isActive;
        toggleBtn.textContent = isActive ? '💡 Toggle' : '💡 Off';
        status.textContent = isActive ? '⚡ Plasma activated' : '🌑 Plasma deactivated';
        plasmaStatus.textContent = isActive ? '⚡ Active' : '🌑 Inactive';
      }

      // ----- Reset -----
      function resetPlasma() {
        isActive = true;
        toggleBtn.textContent = '💡 Toggle';
        intensitySlider.value = 70;
        intensityValue.textContent = '70%';
        speedSlider.value = 5;
        speedValue.textContent = '5×';
        colorSlider.value = 220;
        colorValue.textContent = '220°';
        countSlider.value = 6;
        countValue.textContent = '6';
        burstParticles = [];
        isBursting = false;
        status.textContent = '↺ Reset';
        setTimeout(() => {
          status.textContent = '⚡ Move your cursor to control the plasma arcs';
        }, 500);
      }

      // ----- Burst effect -----
      function burstPlasma() {
        if (!isActive) return;
        
        const w = canvas.width;
        const h = canvas.height;
        const cx = w / 2;
        const cy = h / 2;
        
        isBursting = true;
        const count = 30 + Math.floor(Math.random() * 40);
        for (let i = 0; i < count; i++) {
          burstParticles.push(new BurstParticle(cx, cy));
        }
        status.textContent = '💥 Plasma burst!';
        setTimeout(() => {
          status.textContent = '⚡ Move your cursor to control the plasma arcs';
        }, 1500);
      }

      // ----- Event Listeners -----
      // Mouse tracking
      canvas.addEventListener('mousemove', (e) => {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        mouseX = (e.clientX - rect.left) * scaleX;
        mouseY = (e.clientY - rect.top) * scaleY;
        isMouseOnCanvas = true;
      });

      canvas.addEventListener('mouseenter', () => {
        isMouseOnCanvas = true;
        status.textContent = '⚡ Plasma arcs tracking cursor';
      });

      canvas.addEventListener('mouseleave', () => {
        isMouseOnCanvas = false;
        status.textContent = '⚡ Move cursor back to control plasma';
      });

      // Touch support
      canvas.addEventListener('touchmove', (e) => {
        e.preventDefault();
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        const touch = e.touches[0];
        mouseX = (touch.clientX - rect.left) * scaleX;
        mouseY = (touch.clientY - rect.top) * scaleY;
        isMouseOnCanvas = true;
      });

      canvas.addEventListener('touchstart', (e) => {
        const touch = e.touches[0];
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        mouseX = (touch.clientX - rect.left) * scaleX;
        mouseY = (touch.clientY - rect.top) * scaleY;
        isMouseOnCanvas = true;
      });

      canvas.addEventListener('touchend', () => {
        isMouseOnCanvas = false;
      });

      // Buttons
      toggleBtn.addEventListener('click', togglePlasma);
      resetBtn.addEventListener('click', resetPlasma);
      burstBtn.addEventListener('click', burstPlasma);

      // Sliders
      intensitySlider.addEventListener('input', (e) => {
        intensityValue.textContent = e.target.value + '%';
      });

      speedSlider.addEventListener('input', (e) => {
        speedValue.textContent = e.target.value + '×';
      });

      colorSlider.addEventListener('input', (e) => {
        colorValue.textContent = e.target.value + '°';
      });

      countSlider.addEventListener('input', (e) => {
        countValue.textContent = e.target.value;
      });

      // Keyboard shortcuts
      document.addEventListener('keydown', (e) => {
        if (e.key === 't' || e.key === 'T') {
          e.preventDefault();
          togglePlasma();
        }
        if (e.key === 'r' || e.key === 'R') {
          e.preventDefault();
          resetPlasma();
        }
        if (e.key === 'b' || e.key === 'B') {
          e.preventDefault();
          burstPlasma();
        }
      });

      // Click canvas to burst
      canvas.addEventListener('click', burstPlasma);

      // ----- Resize handler -----
      let resizeTimeout;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(() => {
          setupCanvas();
        }, 200);
      });

      // ----- Init -----
      function init() {
        setupCanvas();
        startAnimation();
        status.textContent = '⚡ Move your cursor to control the plasma arcs!';
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }

    })();
  </script>
</body>
</html>
