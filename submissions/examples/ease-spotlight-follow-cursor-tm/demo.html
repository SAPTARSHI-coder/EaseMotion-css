<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spotlight Follow Cursor | EaseMotion CSS</title><link rel="stylesheet" href="style.css"></head>
<body><div class="sf-root">
<div class="sf-card">
<div class="sf-glow" id="sf-glow"></div>
<h2 class="sf-title">Spotlight Card</h2>
<p class="sf-body">Move your cursor over this card to see the spotlight follow effect. The glow tracks your mouse position using a tiny JavaScript handler.</p>
</div>
<p class="sf-label">Hover over the card</p>
</div>
<script>
const card=document.querySelector('.sf-card');
const glow=document.getElementById('sf-glow');
card.addEventListener('mousemove',e=>{const r=card.getBoundingClientRect();card.style.setProperty('--mx',e.clientX-r.left+'px');card.style.setProperty('--my',e.clientY-r.top+'px')});
</script>
</body></html>
