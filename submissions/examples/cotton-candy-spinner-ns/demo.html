<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cotton Candy Spinner — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Cotton Candy Spinner demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Cotton Candy Spinner</h1>
      <p class="lede">Spinning cotton-candy drum with sugar-floss strands wrapping around a cone</p>
    </header>

    <section class="ease-cotton-candy-spinner" data-demo="cotton-candy-spinner" aria-live="polite">
      <div class="ease-cotton-candy-spinner__housing">
        <div class="ease-cotton-candy-spinner__bezel">
          <div class="ease-cotton-candy-spinner__face">
            <div class="ease-cotton-candy-spinner__readout">
              <span class="ease-cotton-candy-spinner__label">Cotton Candy Spinner</span>
              <span class="ease-cotton-candy-spinner__value" id="val-cotton-candy-spinner">READY</span>
            </div>
            <div class="ease-cotton-candy-spinner__motion" aria-hidden="true">
              <span class="ease-cotton-candy-spinner__arm"></span>
              <span class="ease-cotton-candy-spinner__core"></span>
              <span class="ease-cotton-candy-spinner__trail"></span>
              <span class="ease-cotton-candy-spinner__mark m1"></span>
              <span class="ease-cotton-candy-spinner__mark m2"></span>
              <span class="ease-cotton-candy-spinner__mark m3"></span>
            </div>
            <div class="ease-cotton-candy-spinner__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-cotton-candy-spinner__controls">
          <button type="button" class="ease-cotton-candy-spinner__btn primary">Engage</button>
          <button type="button" class="ease-cotton-candy-spinner__btn">Reset</button>
          <label class="ease-cotton-candy-spinner__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-cotton-candy-spinner__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
