<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>Synthwave Grid Neumorphic</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">
    <section class="synthwave-card" aria-labelledby="title">

      <div class="grid-floor" aria-hidden="true"></div>

      <div class="card-content">
        <span class="eyebrow">NEUMORPHIC UI</span>

        <h1 id="title">Synthwave Grid</h1>

        <p class="description">
          A retro-futuristic neumorphic surface with glowing perspective
          grid lines and smooth CSS transitions.
        </p>

        <div class="controls">
          <button class="neon-button" type="button">
            Explore
          </button>

          <button class="soft-button" type="button">
            Learn More
          </button>
        </div>
      </div>

      <div class="status-panel">
        <span class="status-dot" aria-hidden="true"></span>
        <span>SYSTEM ONLINE</span>
      </div>

    </section>
  </main>

</body>
</html>
