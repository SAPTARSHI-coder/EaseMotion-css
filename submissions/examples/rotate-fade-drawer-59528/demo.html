<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Rotate-Fade Drawer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="saas-layout">
    <!-- Checkbox Hack -->
    <input type="checkbox" id="drawer-toggle" class="drawer-toggle-input">
    
    <!-- Header / Navbar -->
    <header class="saas-header">
      <div class="logo">SaaSLogo</div>
      <label for="drawer-toggle" class="drawer-toggle-btn" aria-label="Open Menu">
        <span></span>
        <span></span>
        <span></span>
      </label>
    </header>

    <!-- Main Content -->
    <main class="saas-main-content">
      <h1>Welcome to the Platform</h1>
      <p>Click the menu icon to see the rotate-fade drawer animation.</p>
      
      <div class="cards-grid">
        <div class="card">Card 1</div>
        <div class="card">Card 2</div>
        <div class="card">Card 3</div>
      </div>
    </main>

    <!-- Overlay -->
    <label for="drawer-toggle" class="drawer-overlay" aria-label="Close Menu"></label>

    <!-- Drawer -->
    <aside class="saas-drawer">
      <div class="drawer-header">
        <h2>Menu</h2>
        <label for="drawer-toggle" class="drawer-close-btn" aria-label="Close Menu">&times;</label>
      </div>
      <nav class="drawer-nav">
        <a href="#">Dashboard</a>
        <a href="#">Analytics</a>
        <a href="#">Settings</a>
        <a href="#">Help Center</a>
      </nav>
    </aside>
  </div>
</body>
</html>
