<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Pure CSS centered modal layout with blurred background"
  >
  <title>CSS Centered Modal Layout</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="page">
    <section class="page-content" aria-label="Page content">
      <span class="eyebrow">EaseMotion CSS</span>

      <h1>Centered Modal Layout</h1>

      <p>
        A clean modal interface with a blurred and dimmed page background,
        created entirely with CSS.
      </p>

      <a class="demo-button" href="#demo-modal">
        Open Modal
      </a>
    </section>
  </main>

  <div
    class="modal-overlay"
    id="demo-modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="modal-title"
  >
    <div class="modal">
      <a
        class="modal-close"
        href="#"
        aria-label="Close modal"
      >
        &times;
      </a>

      <div class="modal-icon" aria-hidden="true">
        ✓
      </div>

      <h2 id="modal-title">Welcome!</h2>

      <p>
        This centered modal uses CSS-only styling to create a focused
        interface while keeping the page behind it visually blurred.
      </p>

      <div class="modal-actions">
        <a class="modal-button primary" href="#">
          Continue
        </a>

        <a class="modal-button secondary" href="#">
          Cancel
        </a>
      </div>
    </div>
  </div>
</body>
</html>
