<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Trigonometric Functions</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="layout-container">
        
        <header class="section-header">
            <h1 class="title">CSS Trigonometric Motion</h1>
            <p class="subtitle">A demonstration of native CSS <code>sin()</code> and <code>cos()</code> functions used to calculate complex, multi-layered circular and orbital animations entirely without JavaScript.</p>
        </header>

        <div class="demo-area">
            
            <!-- 
              [TECHNIQUE] Orbital System
              We define a central hub and orbiting satellites.
              The positioning of the satellites is calculated using CSS trigonometry
              within style.css, rather than hardcoding coordinates.
            -->
            <div class="solar-system" aria-label="An animation showing nodes orbiting a central hub">
                
                <div class="hub">
                    <span class="hub-core"></span>
                </div>
                
                <!-- 
                  We pass a custom property --index to each satellite.
                  The CSS will use this index in its sin/cos formulas to calculate
                  the exact degree of separation and plot the circular path.
                -->
                <div class="satellite" style="--index: 1;" aria-hidden="true"></div>
                <div class="satellite" style="--index: 2;" aria-hidden="true"></div>
                <div class="satellite" style="--index: 3;" aria-hidden="true"></div>
                <div class="satellite" style="--index: 4;" aria-hidden="true"></div>
                <div class="satellite" style="--index: 5;" aria-hidden="true"></div>
                <div class="satellite" style="--index: 6;" aria-hidden="true"></div>
                
            </div>
            
        </div>
        
    </div>

</body>
</html>
