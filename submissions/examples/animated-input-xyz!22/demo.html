<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animated Floating Label Input - EaseMotion CSS Submission</title>
  
  <!-- EaseMotion CSS (Official CDN) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css">
  
  <!-- Local Input Component Styles -->
  <link rel="stylesheet" href="style.css">
  
  <style>
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: var(--ease-color-bg, #f8fafc);
      color: var(--ease-color-text, #0f172a);
      margin: 0;
      padding: 2rem;
      gap: 3rem;
    }
    .demo-container {
      width: 100%;
      max-width: 600px;
    }
    .demo-section {
      margin-bottom: 3rem;
    }
    .demo-title {
      font-size: 1.125rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
      color: var(--ease-color-text, #0f172a);
    }
    .demo-card {
      background-color: var(--ease-color-surface, #ffffff);
      border-radius: var(--ease-radius-lg, 12px);
      padding: 2rem;
      box-shadow: var(--ease-shadow-md, 0 4px 6px -1px rgba(0, 0, 0, 0.1));
      border: 1px solid var(--ease-color-border, #e2e8f0);
    }
    .input-group {
      margin-bottom: 1.5rem;
    }
    .input-group:last-child {
      margin-bottom: 0;
    }
  </style>
</head>
<body>

  <div class="ease-center ease-fade-in" style="text-align: center;">
    <h1 class="ease-slide-up">Animated Floating Label Input</h1>
    <p class="ease-slide-up ease-delay-100" style="color: var(--ease-color-text-muted, #64748b); max-width: 500px;">
      Zero JavaScript. Pure CSS floating labels with smooth animations and focus effects.
    </p>
  </div>

  <!-- Default Floating Labels -->
  <div class="demo-container demo-section ease-fade-in ease-delay-200">
    <h2 class="demo-title">Default Floating Labels</h2>
    <div class="demo-card">
      <div class="input-group">
        <div class="ease-input-xyz">
          <input type="text" id="name" class="ease-input-xyz-field" required>
          <label for="name" class="ease-input-xyz-label">Full Name</label>
          <div class="ease-input-xyz-underline"></div>
        </div>
      </div>

      <div class="input-group">
        <div class="ease-input-xyz">
          <input type="email" id="email" class="ease-input-xyz-field" required>
          <label for="email" class="ease-input-xyz-label">Email Address</label>
          <div class="ease-input-xyz-underline"></div>
        </div>
      </div>

      <div class="input-group">
        <div class="ease-input-xyz">
          <input type="password" id="password" class="ease-input-xyz-field" required>
          <label for="password" class="ease-input-xyz-label">Password</label>
          <div class="ease-input-xyz-underline"></div>
        </div>
      </div>

      <div class="input-group">
        <div class="ease-input-xyz">
          <textarea id="message" class="ease-input-xyz-field ease-input-xyz-textarea" rows="4" required></textarea>
          <label for="message" class="ease-input-xyz-label">Your Message</label>
          <div class="ease-input-xyz-underline"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- With Icons -->
  <div class="demo-container demo-section ease-fade-in ease-delay-300">
    <h2 class="demo-title">With Icons</h2>
    <div class="demo-card">
      <div class="input-group">
        <div class="ease-input-xyz ease-input-xyz-icon">
          <span class="ease-input-xyz-icon-prefix">👤</span>
          <input type="text" id="username" class="ease-input-xyz-field" required>
          <label for="username" class="ease-input-xyz-label">Username</label>
          <div class="ease-input-xyz-underline"></div>
        </div>
      </div>

      <div class="input-group">
        <div class="ease-input-xyz ease-input-xyz-icon">
          <span class="ease-input-xyz-icon-prefix">🔒</span>
          <input type="password" id="password2" class="ease-input-xyz-field" required>
          <label for="password2" class="ease-input-xyz-label">Password</label>
          <div class="ease-input-xyz-underline"></div>
        </div>
      </div>

      <div class="input-group">
        <div class="ease-input-xyz ease-input-xyz-icon">
          <span class="ease-input-xyz-icon-prefix">📧</span>
          <input type="email" id="email2" class="ease-input-xyz-field" required>
          <label for="email2" class="ease-input-xyz-label">Email</label>
          <div class="ease-input-xyz-underline"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Validation States -->
  <div class="demo-container demo-section ease-fade-in ease-delay-400">
    <h2 class="demo-title">Validation States</h2>
    <div class="demo-card">
      <div class="input-group">
        <div class="ease-input-xyz ease-input-xyz-success">
          <input type="text" id="success" class="ease-input-xyz-field" value="Valid input" required>
          <label for="success" class="ease-input-xyz-label">Success State</label>
          <div class="ease-input-xyz-underline"></div>
          <span class="ease-input-xyz-helper">✓ Looks good!</span>
        </div>
      </div>

      <div class="input-group">
        <div class="ease-input-xyz ease-input-xyz-error">
          <input type="email" id="error" class="ease-input-xyz-field" value="invalid-email" required>
          <label for="error" class="ease-input-xyz-label">Error State</label>
          <div class="ease-input-xyz-underline"></div>
          <span class="ease-input-xyz-helper">✕ Please enter a valid email</span>
        </div>
      </div>

      <div class="input-group">
        <div class="ease-input-xyz ease-input-xyz-warning">
          <input type="text" id="warning" class="ease-input-xyz-field" value="weak" required>
          <label for="warning" class="ease-input-xyz-label">Warning State</label>
          <div class="ease-input-xyz-underline"></div>
          <span class="ease-input-xyz-helper">⚠ Password could be stronger</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Outlined Variant -->
  <div class="demo-container demo-section ease-fade-in ease-delay-500">
    <h2 class="demo-title">Outlined Variant</h2>
    <div class="demo-card">
      <div class="input-group">
        <div class="ease-input-xyz ease-input-xyz-outlined">
          <input type="text" id="outlined1" class="ease-input-xyz-field" required>
          <label for="outlined1" class="ease-input-xyz-label">First Name</label>
        </div>
      </div>

      <div class="input-group">
        <div class="ease-input-xyz ease-input-xyz-outlined">
          <input type="text" id="outlined2" class="ease-input-xyz-field" required>
          <label for="outlined2" class="ease-input-xyz-label">Last Name</label>
        </div>
      </div>

      <div class="input-group">
        <div class="ease-input-xyz ease-input-xyz-outlined ease-input-xyz-icon">
          <span class="ease-input-xyz-icon-prefix">🔍</span>
          <input type="search" id="search" class="ease-input-xyz-field" required>
          <label for="search" class="ease-input-xyz-label">Search</label>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
