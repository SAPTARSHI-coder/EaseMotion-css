<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mana Pool · fill & drain</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <div class="mana-container">
      <div class="mana-label">
        <span>✨ Mana Pool</span>
        <span id="manaDisplay" class="badge">100 / 100</span>
      </div>
      <div class="mana-track">
        <div id="manaFill" class="mana-fill">100%</div>
      </div>
    </div>

    <div class="controls">
      <button class="btn btn-drain" id="drainBtn">💧 Drain 20</button>
      <button class="btn btn-fill" id="fillBtn">⚡ Fill 15</button>
      <button class="btn btn-outline" id="resetBtn">⟳ Reset</button>
    </div>
    <div class="footer-note">
      <span>⬇️ drains · ⬆️ fills (clamped 0–100)</span>
    </div>
  </div>

  <script>
    (function() {
      "use strict";

      // DOM refs
      const manaFill = document.getElementById('manaFill');
      const manaDisplay = document.getElementById('manaDisplay');

      // state
      const MAX_MANA = 100;
      const MIN_MANA = 0;
      let currentMana = 100;

      function clamp(value, min, max) {
        return Math.min(max, Math.max(min, value));
      }

      function renderMana() {
        const percent = Math.round((currentMana / MAX_MANA) * 100);
        const clampedPercent = clamp(percent, 0, 100);

        manaFill.style.width = clampedPercent + '%';
        manaFill.textContent = clampedPercent + '%';
        manaDisplay.textContent = `${Math.round(currentMana)} / ${MAX_MANA}`;

        // Low mana warning (≤ 20%)
        if (currentMana <= 20) {
          manaFill.classList.add('low');
        } else {
          manaFill.classList.remove('low');
        }

        // High mana glow (≥ 80%)
        if (currentMana >= 80) {
          manaFill.classList.add('high');
        } else {
          manaFill.classList.remove('high');
        }
      }

      function drain(amount) {
        if (amount <= 0) return;
        currentMana = clamp(currentMana - amount, MIN_MANA, MAX_MANA);
        renderMana();
      }

      function fill(amount) {
        if (amount <= 0) return;
        currentMana = clamp(currentMana + amount, MIN_MANA, MAX_MANA);
        renderMana();
      }

      function resetMana() {
        currentMana = MAX_MANA;
        renderMana();
      }

      const drainBtn = document.getElementById('drainBtn');
      const fillBtn = document.getElementById('fillBtn');
      const resetBtn = document.getElementById('resetBtn');

      if (drainBtn) {
        drainBtn.addEventListener('click', function(e) {
          e.preventDefault();
          drain(20);
        });
      }

      if (fillBtn) {
        fillBtn.addEventListener('click', function(e) {
          e.preventDefault();
          fill(15);
        });
      }

      if (resetBtn) {
        resetBtn.addEventListener('click', function(e) {
          e.preventDefault();
          resetMana();
        });
      }

      // Keyboard shortcuts
      document.addEventListener('keydown', function(e) {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

        const key = e.key;
        if (key === 'd' || key === 'D') {
          e.preventDefault();
          drain(20);
        } else if (key === 'f' || key === 'F') {
          e.preventDefault();
          fill(15);
        } else if (key === 'r' || key === 'R') {
          e.preventDefault();
          resetMana();
        }
      });

      renderMana();
      console.log('✨ Mana Pool ready · shortcuts: [D]rain 20, [F]ill 15, [R] Reset');
    })();
  </script>
</body>
</html>
