<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flash Bang – Bright Flash Blinds Momentarily</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <h1>💥 Flash Bang</h1>
    <p class="subtitle">Bright flash blinds momentarily</p>

    <div class="flash-container">
      <div class="flash-stage" id="flashStage">
        <canvas id="canvas"></canvas>
        
        <!-- Flash overlay -->
        <div class="flash-overlay" id="flashOverlay"></div>
        
        <!-- Info overlay -->
        <div class="info-overlay">
          <span class="flash-status" id="flashStatus">💥 Ready</span>
          <span class="flash-count" id="flashCount">✦ 0 flashes</span>
        </div>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <button class="ctrl-btn flash" id="flashBtn">💥 Flash</button>
      <button class="ctrl-btn toggle" id="toggleBtn">⏸ Pause</button>
      <button class="ctrl-btn reset" id="resetBtn">↺ Reset</button>
    </div>

    <!-- Sliders -->
    <div class="slider-container">
      <span class="slider-label">Flash Intensity</span>
      <input type="range" id="intensitySlider" min="10" max="100" value="80" />
      <span class="slider-value" id="intensityValue">80%</span>
    </div>

    <div class="slider-container">
      <span class="slider-label">Flash Duration</span>
      <input type="range" id="durationSlider" min="100" max="800" value="300" step="50" />
      <span class="slider-value" id="durationValue">300ms</span>
    </div>

    <div class="slider-container">
      <span class="slider-label">Flash Color</span>
      <input type="range" id="colorSlider" min="0" max="360" value="50" />
      <span class="slider-value" id="colorValue">50°</span>
    </div>

    <!-- Status -->
    <div class="status" id="status">💥 Click Flash to create a bright burst of light</div>

    <!-- Keyboard shortcuts -->
    <div class="shortcuts">
      <kbd>F</kbd> Flash · <kbd>Space</kbd> Pause · <kbd>R</kbd> Reset
    </div>
  </div>

  <script>
    (function() {
      "use strict";

      // DOM elements
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      const flashOverlay = document.getElementById('flashOverlay');
      const flashStatus = document.getElementById('flashStatus');
      const flashCount = document.getElementById('flashCount');
      const flashBtn = document.getElementById('flashBtn');
      const toggleBtn = document.getElementById('toggleBtn');
      const resetBtn = document.getElementById('resetBtn');
      const status = document.getElementById('status');
      const intensitySlider = document.getElementById('intensitySlider');
      const intensityValue = document.getElementById('intensityValue');
      const durationSlider = document.getElementById('durationSlider');
      const durationValue = document.getElementById('durationValue');
      const colorSlider = document.getElementById('colorSlider');
      const colorValue = document.getElementById('colorValue');

      // State
      let isFlashing = false;
      let isPaused = false;
      let animationId = null;
      let time = 0;
      let flashCountVal = 0;
      let flashParticles = [];
      let afterimage = 0;

      // ----- Canvas setup -----
      function setupCanvas() {
        const rect = canvas.parentElement.getBoundingClientRect();
        const size = Math.min(rect.width - 40, 600);
        canvas.width = size;
        canvas.height = size;
        canvas.style.width = size + 'px';
        canvas.style.height = size + 'px';
      }

      // ----- Flash particle class -----
      class FlashParticle {
        constructor(x, y) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 1 + Math.random() * 4;
          this.x = x;
          this.y = y;
          this.vx = Math.cos(angle) * speed;
          this.vy = Math.sin(angle) * speed;
          this.size = 1 + Math.random() * 4;
          this.life = 1;
          this.decay = 0.01 + Math.random() * 0.03;
          this.hue = 50 + (Math.random() - 0.5) * 30;
          this.saturation = 80 + Math.random() * 20;
          this.lightness = 60 + Math.random() * 30;
          this.opacity = 0.5 + Math.random() * 0.5;
          this.glowSize = this.size * 4;
        }

        update() {
          this.x += this.vx;
          this.y += this.vy;
          this.vx *= 0.99;
          this.vy *= 0.99;
          this.life -= this.decay;
          this.size *= 0.998;
          return this.life > 0 && this.size > 0.1;
        }

        draw(ctx) {
          const alpha = this.life * this.opacity * 0.8;
          const size = this.size * this.life;

          // Glow
          const gradient = ctx.createRadialGradient(
            this.x, this.y, 0,
            this.x, this.y, size * 5
          );
          gradient.addColorStop(0, `hsla(${this.hue + 20}, 100%, 90%, ${alpha * 0.3})`);
          gradient.addColorStop(1, `hsla(${this.hue}, 100%, 60%, 0)`);
          ctx.fillStyle = gradient;
          ctx.beginPath();
          ctx.arc(this.x, this.y, size * 5, 0, Math.PI * 2);
          ctx.fill();

          // Core
          ctx.fillStyle = `hsla(${this.hue + 30}, 100%, 95%, ${alpha * 0.9})`;
          ctx.beginPath();
          ctx.arc(this.x, this.y, size, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // ----- Create flash -----
      function createFlash() {
        if (isFlashing) return;
        
        const w = canvas.width;
        const h = canvas.height;
        const cx = w / 2;
        const cy = h / 2;
        const intensity = parseInt(intensitySlider.value) / 100;
        const duration = parseInt(durationSlider.value);
        const hue = parseInt(colorSlider.value);

        // Flash overlay
        flashOverlay.style.opacity = intensity;
        flashOverlay.style.background = `radial-gradient(circle at center, 
          hsla(${hue}, 100%, 95%, ${intensity * 0.9}), 
          hsla(${hue + 20}, 100%, 80%, ${intensity * 0.6}), 
          hsla(${hue + 40}, 100%, 60%, ${intensity * 0.3})
        )`;
        flashOverlay.style.transition = `opacity ${duration * 0.1}ms ease-out`;
        
        isFlashing = true;
        flashCountVal++;
        flashCount.textContent = `✦ ${flashCountVal} flashes`;
        flashStatus.textContent = '💥 Flashing!';
        status.textContent = '💥 Flash!';

        // Create flash particles
        flashParticles = [];
        const particleCount = 30 + Math.floor(intensity * 50);
        for (let i = 0; i < particleCount; i++) {
          const angle = Math.random() * Math.PI * 2;
          const dist = Math.random() * 50;
          const x = cx + Math.cos(angle) * dist;
          const y = cy + Math.sin(angle) * dist;
          flashParticles.push(new FlashParticle(x, y));
        }

        // Afterimage effect
        afterimage = 1;

        // Fade out
        setTimeout(() => {
          flashOverlay.style.opacity = 0;
          flashStatus.textContent = '💥 Done';
          setTimeout(() => {
            isFlashing = false;
            flashStatus.textContent = '💥 Ready';
            if (!isPaused) {
              status.textContent = '💥 Click Flash to create a bright burst of light';
            }
          }, 300);
        }, duration);

        // Vibrate (if supported)
        if (navigator.vibrate) {
          navigator.vibrate(50);
        }
      }

      // ----- Draw background -----
      function drawBackground() {
        const w = canvas.width;
        const h = canvas.height;
        const cx = w / 2;
        const cy = h / 2;

        // Dark background
        const bgGradient = ctx.createRadialGradient(cx, cy, 0, cx, cy, w * 0.7);
        bgGradient.addColorStop(0, '#0a0a1a');
        bgGradient.addColorStop(0.5, '#060612');
        bgGradient.addColorStop(1, '#020208');
        ctx.fillStyle = bgGradient;
        ctx.fillRect(0, 0, w, h);

        // Subtle grid
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.02)';
        ctx.lineWidth = 0.5;
        for (let i = 0; i < w; i += 30) {
          ctx.beginPath();
          ctx.moveTo(i, 0);
          ctx.lineTo(i, h);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(0, i);
          ctx.lineTo(w, i);
          ctx.stroke();
        }
      }

      // ----- Draw -----
      function draw() {
        const w = canvas.width;
        const h = canvas.height;

        drawBackground();

        // Draw flash particles
        if (!isPaused) {
          flashParticles = flashParticles.filter(p => p.update());
        }
        flashParticles.forEach(p => p.draw(ctx));

        // Afterimage effect (subtle glow)
        if (afterimage > 0.01) {
          const hue = parseInt(colorSlider.value);
          const grad = ctx.createRadialGradient(
            w/2, h/2, 0,
            w/2, h/2, w * 0.3 * afterimage
          );
          grad.addColorStop(0, `hsla(${hue}, 100%, 80%, ${afterimage * 0.03})`);
          grad.addColorStop(1, `hsla(${hue}, 100%, 60%, 0)`);
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(w/2, h/2, w * 0.3 * afterimage, 0, Math.PI * 2);
          ctx.fill();
          afterimage *= 0.995;
        }

        // Update status
        if (flashParticles.length === 0 && !isFlashing) {
          flashStatus.textContent = '💥 Ready';
        }
      }

      // ----- Animation loop -----
      function animate() {
        time += 0.016;
        draw();
        animationId = requestAnimationFrame(animate);
      }

      // ----- Start animation -----
      function startAnimation() {
        if (animationId) {
          cancelAnimationFrame(animationId);
        }
        animate();
      }

      // ----- Toggle pause -----
      function togglePause() {
        isPaused = !isPaused;
        toggleBtn.textContent = isPaused ? '▶ Play' : '⏸ Pause';
        status.textContent = isPaused ? '⏸ Paused' : '▶ Resumed';
        flashStatus.textContent = isPaused ? '⏸ Paused' : '💥 Ready';
      }

      // ----- Reset -----
      function resetFlash() {
        isPaused = false;
        isFlashing = false;
        toggleBtn.textContent = '⏸ Pause';
        flashOverlay.style.opacity = 0;
        flashParticles = [];
        afterimage = 0;
        flashCountVal = 0;
        flashCount.textContent = '✦ 0 flashes';
        flashStatus.textContent = '💥 Ready';
        intensitySlider.value = 80;
        intensityValue.textContent = '80%';
        durationSlider.value = 300;
        durationValue.textContent = '300ms';
        colorSlider.value = 50;
        colorValue.textContent = '50°';
        status.textContent = '↺ Reset';
        setTimeout(() => {
          status.textContent = '💥 Click Flash to create a bright burst of light';
        }, 500);
      }

      // ----- Event Listeners -----
      flashBtn.addEventListener('click', createFlash);
      toggleBtn.addEventListener('click', togglePause);
      resetBtn.addEventListener('click', resetFlash);

      intensitySlider.addEventListener('input', (e) => {
        intensityValue.textContent = e.target.value + '%';
      });

      durationSlider.addEventListener('input', (e) => {
        durationValue.textContent = e.target.value + 'ms';
      });

      colorSlider.addEventListener('input', (e) => {
        colorValue.textContent = e.target.value + '°';
      });

      // Click canvas to flash
      canvas.addEventListener('click', createFlash);

      // Keyboard shortcuts
      document.addEventListener('keydown', (e) => {
        if (e.key === 'f' || e.key === 'F') {
          e.preventDefault();
          createFlash();
        }
        if (e.key === ' ' || e.key === 'Space') {
          e.preventDefault();
          togglePause();
        }
        if (e.key === 'r' || e.key === 'R') {
          e.preventDefault();
          resetFlash();
        }
      });

      // ----- Resize handler -----
      let resizeTimeout;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(() => {
          setupCanvas();
        }, 200);
      });

      // ----- Init -----
      function init() {
        setupCanvas();
        startAnimation();
        status.textContent = '💥 Click Flash to create a bright burst of light!';
        // Initial flash after a moment
        setTimeout(() => {
          createFlash();
        }, 500);
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }

    })();
  </script>
</body>
</html>
