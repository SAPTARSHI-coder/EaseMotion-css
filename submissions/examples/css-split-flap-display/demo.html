<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CSS Split Flap Display</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<main class="display-wrapper">

    <h1 class="title">
        DEPARTURE BOARD
    </h1>


    <div class="board" aria-label="Split flap display">

        <div class="flap">
            <span>C</span>
        </div>

        <div class="flap">
            <span>S</span>
        </div>

        <div class="flap">
            <span>S</span>
        </div>


        <div class="flap">
            <span>2</span>
        </div>


        <div class="flap">
            <span>0</span>
        </div>


        <div class="flap">
            <span>2</span>
        </div>


        <div class="flap">
            <span>6</span>
        </div>

    </div>


</main>


</body>

</html>
