<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Glitch-Flicker Navbar - Product Catalog</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 
       A checkbox hack to toggle the intense glitch mode for the demo.
    -->
    <input type="checkbox" id="glitch-toggle" class="glitch-input">

    <nav class="catalog-navbar">
        <div class="nav-container">
            
            <a href="#" class="brand-logo" data-text="NEUROGEAR">
                NEUROGEAR
            </a>

            <div class="nav-links">
                <a href="#" class="nav-link glitch-hover" data-text="Laptops">Laptops</a>
                <a href="#" class="nav-link glitch-hover" data-text="Components">Components</a>
                <a href="#" class="nav-link glitch-hover" data-text="Peripherals">Peripherals</a>
                <a href="#" class="nav-link glitch-hover" data-text="Sale">Sale</a>
            </div>

            <div class="nav-actions">
                <label for="glitch-toggle" class="btn-glitch-toggle" aria-label="Toggle Glitch Mode">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
                </label>
                
                <a href="#" class="cart-btn glitch-hover" data-text="Cart (2)">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
                    Cart (2)
                </a>
            </div>

        </div>
    </nav>

    <div class="layout-container">
        <header class="section-header">
            <h1 class="title glitch-title" data-text="Next-Gen Hardware">Next-Gen Hardware</h1>
            <p class="subtitle">A product catalog layout featuring intense hover and toggleable glitch-flicker animations.</p>
        </header>

        <!-- Mock content to show the navbar sticking/overlaying -->
        <div class="placeholder-grid">
            <div class="placeholder-card"></div>
            <div class="placeholder-card"></div>
            <div class="placeholder-card"></div>
            <div class="placeholder-card"></div>
            <div class="placeholder-card"></div>
            <div class="placeholder-card"></div>
        </div>
    </div>

</body>
</html>
