<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive File Drag Dropzone Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>File Drag &amp; Dropzone</h1>

    <!-- Hidden native file input -->
    <input 
      type="file" 
      id="file-input" 
      class="visually-hidden" 
      multiple 
      accept=".png,.jpg,.jpeg,.pdf" 
      tabindex="-1"
    />

    <!-- Accessible Dropzone Widget -->
    <div 
      id="dropzone" 
      class="dropzone" 
      role="button" 
      tabindex="0" 
      aria-controls="file-input" 
      aria-describedby="dropzone-instructions"
    >
      <div class="dropzone__content">
        <span class="dropzone__icon" aria-hidden="true">📁</span>
        <p id="dropzone-instructions" class="dropzone__text">
          <strong class="dropzone__highlight">Click to upload</strong> or drag and drop files here
        </p>
        <span class="dropzone__hint">PNG, JPG, or PDF (max 10MB)</span>
      </div>
    </div>

    <!-- Live region for screen reader feedback -->
    <div id="status-announcer" class="visually-hidden" aria-live="polite" aria-atomic="true"></div>

    <!-- File Output List -->
    <section class="file-list-section" aria-label="Uploaded files">
      <h2>Selected Files</h2>
      <ul id="file-list" class="file-list">
        <li class="file-list__empty">No files uploaded yet.</li>
      </ul>
    </section>
  </main>

  <script>
    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('file-input');
    const fileList = document.getElementById('file-list');
    const statusAnnouncer = document.getElementById('status-announcer');

    function announce(message) {
      statusAnnouncer.textContent = '';
      setTimeout(() => { statusAnnouncer.textContent = message; }, 50);
    }

    function renderFiles(files) {
      if (!files || files.length === 0) return;
      fileList.innerHTML = '';
      
      Array.from(files).forEach((file, index) => {
        const li = document.createElement('li');
        li.className = 'file-list__item';
        
        const sizeFormatted = (file.size / 1024 / 1024).toFixed(2);
        li.innerHTML = `
          <span class="file-list__name">${file.name} (${sizeFormatted} MB)</span>
          <button type="button" class="file-list__remove" aria-label="Remove ${file.name}" data-index="${index}">✕</button>
        `;
        fileList.appendChild(li);
      });

      announce(`${files.length} file${files.length > 1 ? 's' : ''} selected.`);
    }

    // Drag and Drop Handlers
    ['dragenter', 'dragover'].forEach(eventName => {
      dropzone.addEventListener(eventName, (e) => {
        e.preventDefault();
        e.stopPropagation();
        dropzone.classList.add('dropzone--dragover');
      });
    });

    ['dragleave', 'drop'].forEach(eventName => {
      dropzone.addEventListener(eventName, (e) => {
        e.preventDefault();
        e.stopPropagation();
        dropzone.classList.remove('dropzone--dragover');
      });
    });

    dropzone.addEventListener('drop', (e) => {
      const files = e.dataTransfer.files;
      if (files.length > 0) {
        fileInput.files = files;
        renderFiles(files);
      }
    });

    // Keyboard & Click Activation
    dropzone.addEventListener('click', () => fileInput.click());
    dropzone.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        fileInput.click();
      }
    });

    fileInput.addEventListener('change', () => {
      renderFiles(fileInput.files);
    });

    fileList.addEventListener('click', (e) => {
      if (e.target.classList.contains('file-list__remove')) {
        e.target.closest('li').remove();
        if (fileList.children.length === 0) {
          fileList.innerHTML = '<li class="file-list__empty">No files uploaded yet.</li>';
        }
        announce('File removed.');
      }
    });
  </script>
</body>
</html>
