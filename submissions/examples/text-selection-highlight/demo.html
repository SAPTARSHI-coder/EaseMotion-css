<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Selection Highlight Utility</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>

<h1>Text Selection Highlight Utility</h1>

<p class="selection-primary">
    Select this text to see the blue selection effect.
</p>

<p class="selection-success">
    Select this text to see the green selection effect.
</p>

<p class="selection-danger">
    Select this text to see the red selection effect.
</p>

</body>
