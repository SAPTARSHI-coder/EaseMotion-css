<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-washing-machine-spin demo</title>
</head>
<body>
<div class="ws-app">
  <span class="ws-label">SPIN CYCLE</span>
  <div class="ws-machine">
    <div class="ws-drum">
      <div class="ws-hole ws-hole-1"></div>
      <div class="ws-hole ws-hole-2"></div>
      <div class="ws-hole ws-hole-3"></div>
      <div class="ws-hole ws-hole-4"></div>
      <div class="ws-hole ws-hole-5"></div>
      <div class="ws-hole ws-hole-6"></div>
      <div class="ws-hole ws-hole-7"></div>
      <div class="ws-clothes"></div>
    </div>
    <div class="ws-door"></div>
    <div class="ws-dial"></div>
    <div class="ws-button"></div>
  </div>
  <div class="ws-suds ws-suds-1"></div>
  <div class="ws-suds ws-suds-2"></div>
</div>
</body>
</html>
