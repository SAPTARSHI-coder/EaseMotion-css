<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Bento Dashboard - EaseMotion CSS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="dashboard-wrapper">
        <h1 class="dashboard-title">System Overview <span class="pulse-dot"></span></h1>
        
        <section class="bento-grid">
            <!-- Card 1: Large Profile/Stat Card -->
            <article class="bento-card card-large" tabindex="0">
                <div class="card-glare"></div>
                <div class="orb orb-purple"></div>
                <div class="card-content">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                    <h2>Active Users</h2>
                    <p class="stat-number">12,458</p>
                    <span class="trend up">+14.5% this week</span>
                </div>
            </article>

            <!-- Card 2: Wide Animated Bar Chart -->
            <article class="bento-card card-wide" tabindex="0">
                <div class="card-glare"></div>
                <div class="orb orb-blue"></div>
                <div class="card-content">
                    <h3>Weekly Traffic</h3>
                    <div class="css-bar-chart">
                        <div class="bar" style="--height: 40%; --delay: 0.1s;"></div>
                        <div class="bar" style="--height: 65%; --delay: 0.2s;"></div>
                        <div class="bar" style="--height: 45%; --delay: 0.3s;"></div>
                        <div class="bar" style="--height: 80%; --delay: 0.4s;"></div>
                        <div class="bar" style="--height: 55%; --delay: 0.5s;"></div>
                        <div class="bar" style="--height: 90%; --delay: 0.6s;"></div>
                        <div class="bar" style="--height: 70%; --delay: 0.7s;"></div>
                    </div>
                </div>
            </article>

            <!-- Card 3: Conic Gradient Progress Ring -->
            <article class="bento-card card-small" tabindex="0">
                <div class="card-glare"></div>
                <div class="card-content align-center">
                    <h3>Storage</h3>
                    <div class="progress-ring">
                        <span class="ring-value">75%</span>
                    </div>
                    <p class="subtext">750 GB / 1 TB</p>
                </div>
            </article>

            <!-- Card 4: Server Status with Pulsing Alert -->
            <article class="bento-card card-small" tabindex="0">
                <div class="card-glare"></div>
                <div class="orb orb-green"></div>
                <div class="card-content">
                    <h3>Server Node</h3>
                    <div class="status-badge">
                        <span class="status-dot"></span>
                        <span>Operational</span>
                    </div>
                    <p class="subtext">Ping: 12ms</p>
                </div>
            </article>

            <!-- Card 5: Tall Map/Network Card -->
            <article class="bento-card card-tall" tabindex="0">
                <div class="card-glare"></div>
                <div class="orb orb-pink"></div>
                <div class="card-content">
                    <svg class="icon-large" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"></circle><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
                    <h2>Global Network</h2>
                    <p class="stat-number">99.9%</p>
                    <span class="trend stable">Uptime Guaranteed</span>
                </div>
            </article>

        </section>
    </main>

</body>
</html>
