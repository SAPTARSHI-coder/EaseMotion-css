<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 3D Effect: Minimalist Outline</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="layout-container">
        
        <header class="section-header">
            <h1 class="title">Pure CSS 3D: Minimalist Outline</h1>
            <p class="subtitle">A hardware-accelerated, JavaScript-free 3D animation. Features a spinning isometric cube constructed entirely of crisp, minimalist CSS borders.</p>
        </header>

        <div class="demo-area">
            
            <!-- 
              [TECHNIQUE] The 3D Scene Container
              Provides the perspective and bounding box for the 3D object.
            -->
            <div class="scene">
                
                <!-- 
                  [TECHNIQUE] The 3D Object (The Cube)
                  Must have `transform-style: preserve-3d` so its children exist in 3D space.
                  The rotation animation is applied to this wrapper element.
                -->
                <div class="cube">
                    <!-- The 6 faces of the cube -->
                    <div class="cube-face front"></div>
                    <div class="cube-face back"></div>
                    <div class="cube-face right"></div>
                    <div class="cube-face left"></div>
                    <div class="cube-face top"></div>
                    <div class="cube-face bottom"></div>
                </div>
                
            </div>
            
        </div>
        
    </div>

</body>
</html>
