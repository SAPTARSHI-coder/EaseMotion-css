<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Glitch-Flicker Stepper</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="showcase-container">
        <div class="stepper-wrapper">
            <h2 class="stepper-title" data-text="SELECT LOADOUT">SELECT LOADOUT</h2>
            
            <ol class="glitch-stepper">
                <li class="step completed">
                    <div class="step-icon"><span>01</span></div>
                    <div class="step-content">
                        <span class="step-label">Base</span>
                        <span class="step-desc">System Core</span>
                    </div>
                </li>
                <li class="step active">
                    <div class="step-icon"><span>02</span></div>
                    <div class="step-content">
                        <span class="step-label">Weapons</span>
                        <span class="step-desc">Armory Access</span>
                    </div>
                </li>
                <li class="step">
                    <div class="step-icon"><span>03</span></div>
                    <div class="step-content">
                        <span class="step-label">Armor</span>
                        <span class="step-desc">Shielding</span>
                    </div>
                </li>
                <li class="step">
                    <div class="step-icon"><span>04</span></div>
                    <div class="step-content">
                        <span class="step-label">Mods</span>
                        <span class="step-desc">Augments</span>
                    </div>
                </li>
            </ol>
            
            <div class="controls">
                <button class="btn btn-prev">BACK</button>
                <button class="btn btn-next">PROCEED</button>
            </div>
        </div>
    </main>
</body>
</html>
