<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Code CC - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css"></head><body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030712; color: #ffffff;">

    <div class="ease-card ease-card-glass cc-container">
        <div class="cc-header">
            <h2>Color Code</h2>
            <span class="ease-badge ease-badge-success">Quantum Error Correction</span>
        </div>
        
        <div class="cc-screen ease-center">
            <div class="cc-flux flux-cc-a"></div>
            <div class="cc-flux flux-cc-b"></div>
            <div class="cc-boundary-ring"></div>
            <div class="cc-core ease-center"></div>
        </div>

        <div class="cc-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Triangular Lattices &amp; Transversal Clifford Gates</span>
            <button class="ease-btn ease-btn-success ease-btn-sm ease-hover-grow">Run Color Code</button>
        </div>
    </div></body></html>
