<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quantum Energy Shield Background Demo — EaseMotion CSS</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <!-- Floating Background view canvas -->
  <div class="shield-bg-viewport" id="viewport-root">
    
    <!-- Concentric expanded waves -->
    <div class="shield-wave w1"></div>
    <div class="shield-wave w2"></div>
    <div class="shield-wave w3"></div>

    <!-- rotating HUD telemetry outlines -->
    <div class="shield-hud-track"></div>

  </div>

  <!-- Main demo content overlays -->
  <div class="demo-page">

    <div class="demo-card" id="card-root">
      <h1 class="demo-title">Quantum Shield</h1>
      <p class="demo-desc">
        A premium pure CSS background animation displaying expanding concentric energy waves and dashed circular telemetry HUD rings.
      </p>

      <button class="demo-btn" id="themeBtn" style="background:rgba(255,255,255,0.06);color:inherit;border:1px solid var(--ease-shield-border);">
        Toggle Theme
      </button>
    </div>

  </div>

  <script>
    // Theme toggle helper
    const themeBtn = document.getElementById('themeBtn');
    const viewportRoot = document.getElementById('viewport-root');
    const cardRoot = document.getElementById('card-root');

    themeBtn.addEventListener('click', () => {
      viewportRoot.classList.toggle('light-theme');
      cardRoot.classList.toggle('light-theme');
      document.body.classList.toggle('light-theme');
    });
  </script>

</body>
</html>
