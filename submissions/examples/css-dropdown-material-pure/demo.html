<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS-only Dropdown: Material Design</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>

    <div class="container">
        <header class="header">
            <h1 class="title">Material Dropdown</h1>
            <p>Pure CSS implementation following Material Design principles.</p>
        </header>

        <main class="content-area">
            
            <!-- Material Dropdown Component -->
            <div class="material-dropdown">
                
                <!-- Checkbox hack for state management -->
                <input type="checkbox" id="material-dropdown-toggle" class="dropdown-checkbox" aria-hidden="true">
                
                <!-- The visible trigger (looks like a Material text field / button) -->
                <label for="material-dropdown-toggle" class="dropdown-trigger" role="button" aria-haspopup="listbox" aria-expanded="false">
                    <span class="trigger-label">Choose an option</span>
                    <span class="trigger-value">Settings</span>
                    <span class="material-icons dropdown-icon">arrow_drop_down</span>
                    <!-- The animated bottom border for focus state -->
                    <span class="trigger-indicator"></span>
                </label>
                
                <!-- The Menu Overlay (Material Elevation) -->
                <div class="dropdown-menu-container">
                    <!-- Invisible backdrop to close dropdown when clicking outside -->
                    <label for="material-dropdown-toggle" class="dropdown-backdrop" aria-hidden="true"></label>
                    
                    <div class="dropdown-menu" role="listbox">
                        <div class="dropdown-item" role="option">
                            <span class="material-icons item-icon">person</span>
                            <span class="item-text">Profile</span>
                        </div>
                        <div class="dropdown-item active" role="option">
                            <span class="material-icons item-icon">settings</span>
                            <span class="item-text">Settings</span>
                        </div>
                        <div class="dropdown-item" role="option">
                            <span class="material-icons item-icon">notifications</span>
                            <span class="item-text">Notifications</span>
                        </div>
                        <div class="dropdown-divider"></div>
                        <div class="dropdown-item" role="option">
                            <span class="material-icons item-icon">logout</span>
                            <span class="item-text">Log out</span>
                        </div>
                    </div>
                </div>

            </div>
            
        </main>
    </div>

</body>
</html>
