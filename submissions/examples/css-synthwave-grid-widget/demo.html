<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Synthwave Grid Line Widget</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <h1>Network Telemetry</h1>
      <p class="subtitle">Synthwave Grid Perspective Dashboard</p>
    </header>

    <main class="dashboard-grid">
      <!-- Widget 1: Network Activity -->
      <a href="#" class="synthwave-widget" aria-labelledby="widget1-title">
        <article class="widget-content">
          <!-- The visual background layer handling perspective grid and horizon -->
          <div class="grid-layer" aria-hidden="true">
            <div class="horizon"></div>
            <div class="grid-plane">
              <div class="grid-lines"></div>
            </div>
          </div>
          
          <div class="widget-data">
            <header class="widget-header">
              <h2 id="widget1-title" class="widget-title">Network Activity</h2>
              <div class="status-indicator active" aria-label="Status: Active"></div>
            </header>
            
            <div class="widget-body">
              <div class="primary-metric">87<span class="metric-unit">%</span></div>
              <div class="secondary-metric">
                <span class="trend-icon positive" aria-hidden="true">↑</span>
                <span class="trend-value">Peak: 12.4K</span>
                <span class="trend-label">reqs/sec</span>
              </div>
            </div>
            
            <footer class="widget-footer">
              <p>Routing matrix stable</p>
            </footer>
          </div>
        </article>
      </a>

      <!-- Widget 2: Node Synchronization -->
      <a href="#" class="synthwave-widget" aria-labelledby="widget2-title">
        <article class="widget-content">
          <!-- The visual background layer handling perspective grid and horizon -->
          <div class="grid-layer" aria-hidden="true">
            <div class="horizon"></div>
            <div class="grid-plane">
              <div class="grid-lines"></div>
            </div>
          </div>
          
          <div class="widget-data">
            <header class="widget-header">
              <h2 id="widget2-title" class="widget-title">Node Synchronization</h2>
              <div class="status-indicator syncing" aria-label="Status: Syncing"></div>
            </header>
            
            <div class="widget-body">
              <div class="primary-metric">42<span class="metric-unit">ms</span></div>
              <div class="secondary-metric">
                <span class="trend-icon warning" aria-hidden="true">!</span>
                <span class="trend-value">Latency drift</span>
                <span class="trend-label">detected</span>
              </div>
            </div>
            
            <footer class="widget-footer">
              <p>Recalibrating cluster...</p>
            </footer>
          </div>
        </article>
      </a>
    </main>
  </div>
</body>
</html>
