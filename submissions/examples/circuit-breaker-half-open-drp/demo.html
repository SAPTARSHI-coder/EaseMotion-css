<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Circuit Breaker Half-Open</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="advanced-shell" aria-labelledby="advanced-title">
    <section class="advanced-panel">
      <p class="eyebrow">resilience gate</p>
      <h1 id="advanced-title">Circuit Breaker Half-Open</h1>
      <p class="summary">A CSS-only resilience dashboard showing closed, open, and half-open states while trial requests decide recovery.</p>
      <div class="stage" role="img" aria-label="Animated Circuit Breaker Half-Open visualization">
        <div class="halo halo-one"></div>
        <div class="halo halo-two"></div>
        <article class="tile tile-a"><strong>01</strong><span>closed state</span></article>
        <article class="tile tile-b"><strong>02</strong><span>half-open probe</span></article>
        <article class="tile tile-c"><strong>03</strong><span>traffic restored</span></article>
        <div class="lane lane-ab"><i></i></div>
        <div class="lane lane-bc"><i></i></div>
        <div class="lane lane-ca"><i></i></div>
        <div class="resolution">traffic restored</div>
      </div>
      <div class="status-grid" aria-label="Circuit Breaker Half-Open status">
        <span>closed state</span>
        <span>half-open probe</span>
        <span>traffic restored</span>
      </div>
    </section>
  </main>
</body>
</html>
