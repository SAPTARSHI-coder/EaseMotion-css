<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Sliding Tab Panel</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="tabs">
  <input type="radio" name="tab" id="tab1" checked>
  <input type="radio" name="tab" id="tab2">
  <input type="radio" name="tab" id="tab3">

  <div class="tab-buttons">
    <label for="tab1">Home</label>
    <label for="tab2">Services</label>
    <label for="tab3">Contact</label>
    <span class="slider"></span>
  </div>

  <div class="tab-content">
    <div class="content content1">
      <h2>Home</h2>
      <p>Welcome to the sliding tab panel component.</p>
    </div>

    <div class="content content2">
      <h2>Services</h2>
      <p>Explore our responsive CSS components.</p>
    </div>

    <div class="content content3">
      <h2>Contact</h2>
      <p>Get in touch for more UI inspiration.</p>
    </div>
  </div>
</div>

</body>
</html>
