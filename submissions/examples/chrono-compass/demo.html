<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chrono Compass</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="app">

  <section class="card">

    <header>
      <span>TEMPORAL NAVIGATION</span>
      <h1>Chrono Compass</h1>
      <p>Navigate through a day as if time had a direction.</p>
    </header>

    <div class="compass-wrap">

      <div class="compass" id="compass">

        <div class="ticks">
          <span>00</span>
          <span>06</span>
          <span>12</span>
          <span>18</span>
        </div>

        <div class="dial" id="dial"></div>

        <div class="needle" id="needle">
          <div class="needle-head"></div>
        </div>

        <div class="center"></div>

      </div>

      <div class="time-display">
        <span>SELECTED MOMENT</span>
        <strong id="time">12:00</strong>
        <small id="period">NOON</small>
      </div>

    </div>

    <div class="controls">

      <input
        id="timeSlider"
        type="range"
        min="0"
        max="1440"
        value="720"
      >

      <button id="reset">Reset Time</button>

      <div class="progress">
        <span id="percent">50%</span>
        of the day
      </div>

    </div>

  </section>

</main>

<script>
const slider = document.getElementById("timeSlider");
const needle = document.getElementById("needle");
const dial = document.getElementById("dial");
const timeEl = document.getElementById("time");
const periodEl = document.getElementById("period");
const percentEl = document.getElementById("percent");

let minutes = 720;

function updateTime() {
  minutes = Number(slider.value);

  const hours = Math.floor(minutes / 60);
  const mins = minutes % 60;

  timeEl.textContent =
    `${String(hours).padStart(2, "0")}:${String(mins).padStart(2, "0")}`;

  let period = "NIGHT";

  if (hours >= 6 && hours < 12) {
    period = "MORNING";
  } else if (hours >= 12 && hours < 18) {
    period = "AFTERNOON";
  } else if (hours >= 18 && hours < 22) {
    period = "EVENING";
  }

  periodEl.textContent = period;

  const angle = (minutes / 1440) * 360;

  needle.style.transform =
    `translate(-50%, -50%) rotate(${angle}deg)`;

  dial.style.transform =
    `translate(-50%, -50%) rotate(${-angle}deg)`;

  percentEl.textContent =
    `${Math.round((minutes / 1440) * 100)}%`;
}

slider.addEventListener("input", updateTime);

document.getElementById("reset").addEventListener("click", () => {
  slider.value = 720;
  updateTime();
});

document.addEventListener("keydown", event => {
  if (event.key === "ArrowRight") {
    slider.value = Math.min(1440, Number(slider.value) + 15);
    updateTime();
  }

  if (event.key === "ArrowLeft") {
    slider.value = Math.max(0, Number(slider.value) - 15);
    updateTime();
  }

  if (event.key.toLowerCase() === "r") {
    slider.value = 720;
    updateTime();
  }
});

updateTime();
</script>

</body>
</html>
