<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lehr Anneal Travel — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Lehr Anneal Travel demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Lehr Anneal Travel</h1>
      <p class="lede">Lehr belt carrying glass through the anneal curve</p>
    </header>

    <section class="ease-lehr-anneal-travel" data-demo="lehr-anneal-travel" aria-live="polite">
      <div class="ease-lehr-anneal-travel__housing">
        <div class="ease-lehr-anneal-travel__bezel">
          <div class="ease-lehr-anneal-travel__face">
            <div class="ease-lehr-anneal-travel__readout">
              <span class="ease-lehr-anneal-travel__label">Lehr Anneal Travel</span>
              <span class="ease-lehr-anneal-travel__value">LIVE</span>
            </div>
            <div class="ease-lehr-anneal-travel__motion" aria-hidden="true">
              <span class="ease-lehr-anneal-travel__a"></span>
              <span class="ease-lehr-anneal-travel__b"></span>
              <span class="ease-lehr-anneal-travel__c"></span>
              <span class="ease-lehr-anneal-travel__d"></span>
            </div>
            <div class="ease-lehr-anneal-travel__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-lehr-anneal-travel__controls">
          <button type="button" class="ease-lehr-anneal-travel__btn primary">Feed</button>
          <button type="button" class="ease-lehr-anneal-travel__btn">Stop</button>
          <label class="ease-lehr-anneal-travel__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-lehr-anneal-travel__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
