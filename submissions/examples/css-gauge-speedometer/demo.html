<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="CSS-only animated gauge speedometer component."
  >

  <title>CSS Gauge Speedometer</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="page">
    <section class="speedometer" aria-labelledby="speedometer-title">

      <header class="header">
        <p class="eyebrow">EaseMotion CSS</p>

        <h1 id="speedometer-title">
          CSS Gauge Speedometer
        </h1>

        <p class="description">
          A responsive speedometer-style gauge built entirely
          with HTML and CSS.
        </p>
      </header>

      <div class="gauge-wrapper">

        <!-- Gauge -->
        <div
          class="gauge"
          role="img"
          aria-label="Speedometer showing 72 kilometers per hour"
        >

          <div class="gauge-ring">

            <div class="gauge-scale" aria-hidden="true">
              <span class="tick tick-1"></span>
              <span class="tick tick-2"></span>
              <span class="tick tick-3"></span>
              <span class="tick tick-4"></span>
              <span class="tick tick-5"></span>
              <span class="tick tick-6"></span>
              <span class="tick tick-7"></span>
              <span class="tick tick-8"></span>
              <span class="tick tick-9"></span>
              <span class="tick tick-10"></span>
              <span class="tick tick-11"></span>
            </div>

            <!-- Needle -->
            <div class="needle" aria-hidden="true">
              <span class="needle-tip"></span>
            </div>

            <div class="center-pin" aria-hidden="true"></div>

            <!-- Center value -->
            <div class="speed-value">
              <strong>72</strong>
              <span>km/h</span>
            </div>

          </div>

          <div class="scale-labels" aria-hidden="true">
            <span>0</span>
            <span>50</span>
            <span>100</span>
            <span>150</span>
            <span>200</span>
          </div>

        </div>

        <!-- Status -->
        <div class="status-card">

          <div class="status-indicator">
            <span class="status-dot"></span>
            <span>Current Speed</span>
          </div>

          <div class="status-value">
            72 <small>km/h</small>
          </div>

          <div class="status-bar">
            <span></span>
          </div>

          <p>
            Speed is within the recommended range.
          </p>

        </div>

      </div>

    </section>
  </main>

</body>
</html>
