<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Pure CSS 3D Foucault Pendulum Swing animation"
  >
  <title>Foucault Pendulum Swing</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="pendulum-demo">
    <section class="pendulum-card" aria-label="Foucault pendulum animation">

      <div class="pendulum-header">
        <span class="eyebrow">CSS 3D EFFECT</span>
        <h1>Foucault Pendulum</h1>
        <p>Pure CSS pendulum swing simulation</p>
      </div>

      <div class="pendulum-stage">
        <div class="ceiling">
          <div class="mount"></div>
        </div>

        <div class="pendulum-system">
          <div class="cable"></div>

          <div class="pendulum-bob">
            <span></span>
          </div>
        </div>

        <div class="floor">
          <div class="swing-track"></div>
          <div class="center-point"></div>
        </div>
      </div>

      <div class="pendulum-info">
        <div>
          <strong>3D Motion</strong>
          <span>CSS transforms</span>
        </div>

        <div>
          <strong>Animation</strong>
          <span>Pure CSS</span>
        </div>

        <div>
          <strong>Performance</strong>
          <span>GPU friendly</span>
        </div>
      </div>

    </section>
  </main>
</body>
</html>
