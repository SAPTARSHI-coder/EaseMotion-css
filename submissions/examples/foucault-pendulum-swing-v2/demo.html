<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <meta
    name="description"
    content="Foucault Pendulum Swing CSS Progress Bar"
  >

  <title>Foucault Pendulum Swing Progress</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="demo">

    <section class="progress-card" aria-labelledby="progress-title">

      <header class="progress-header">
        <div>
          <p class="eyebrow">CSS PROGRESS</p>

          <h1 id="progress-title">
            Foucault Pendulum
          </h1>

          <p class="subtitle">
            A pendulum-inspired progress indicator using pure CSS.
          </p>
        </div>

        <span class="percentage" aria-hidden="true">72%</span>
      </header>


      <!-- Accessible progress -->
      <div
        class="foucault-progress"
        style="--progress: 72%;"
      >

        <div class="progress-track">

          <div
            class="progress-fill"
            role="progressbar"
            aria-valuenow="72"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-label="Project completion"
          >
            <div class="pendulum-system">

              <div class="pendulum-line"></div>

              <div class="pendulum-bob">
                <span></span>
              </div>

            </div>
          </div>

        </div>

        <div class="scale" aria-hidden="true">
          <span>0%</span>
          <span>25%</span>
          <span>50%</span>
          <span>75%</span>
          <span>100%</span>
        </div>

      </div>


      <footer class="progress-footer">

        <span>
          <i class="status-dot"></i>
          Progress in motion
        </span>

        <span>
          72 / 100 complete
        </span>

      </footer>

    </section>


    <!-- Additional examples -->

    <section class="examples" aria-label="Progress examples">

      <article class="example">

        <div class="example-heading">
          <span>Research</span>
          <strong>35%</strong>
        </div>

        <div
          class="foucault-progress compact"
          style="--progress: 35%;"
        >
          <div class="progress-track">

            <div
              class="progress-fill"
              role="progressbar"
              aria-valuenow="35"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-label="Research progress"
            >
              <div class="pendulum-system">
                <div class="pendulum-line"></div>
                <div class="pendulum-bob">
                  <span></span>
                </div>
              </div>
            </div>

          </div>
        </div>

      </article>


      <article class="example">

        <div class="example-heading">
          <span>Development</span>
          <strong>64%</strong>
        </div>

        <div
          class="foucault-progress compact"
          style="--progress: 64%;"
        >
          <div class="progress-track">

            <div
              class="progress-fill"
              role="progressbar"
              aria-valuenow="64"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-label="Development progress"
            >
              <div class="pendulum-system">
                <div class="pendulum-line"></div>
                <div class="pendulum-bob">
                  <span></span>
                </div>
              </div>
            </div>

          </div>
        </div>

      </article>


      <article class="example">

        <div class="example-heading">
          <span>Launch</span>
          <strong>88%</strong>
        </div>

        <div
          class="foucault-progress compact"
          style="--progress: 88%;"
        >
          <div class="progress-track">

            <div
              class="progress-fill"
              role="progressbar"
              aria-valuenow="88"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-label="Launch progress"
            >
              <div class="pendulum-system">
                <div class="pendulum-line"></div>
                <div class="pendulum-bob">
                  <span></span>
                </div>
              </div>
            </div>

          </div>
        </div>

      </article>

    </section>

  </main>

</body>
</html>
