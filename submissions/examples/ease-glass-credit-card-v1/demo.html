<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ease 3D Glassmorphic Credit Card Rotator</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="ease-card-body">
  <div class="ease-credit-stage">
    <div class="ease-credit-card" id="creditCard">
      <div class="card-side side-front">
        <div class="chip"></div>
        <div class="number">4532 •••• •••• 8892</div>
        <div class="name">SAPTARSHI SADHU</div>
      </div>
      <div class="card-side side-back">
        <div class="stripe"></div>
        <div class="cvv">CVV: 849</div>
      </div>
    </div>
  </div>
  <button id="flipCardBtn" style="margin-top:30px; padding:10px 20px;">Flip Credit Card</button>

  <script>
    const card = document.getElementById('creditCard');
    document.getElementById('flipCardBtn').addEventListener('click', () => {
      card.classList.toggle('flipped');
    });
  </script>
</body>
</html>
