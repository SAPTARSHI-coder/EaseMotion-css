<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Foam Planck-Scale Fluctuation - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #0d0221; color: #ffffff;">

    <div class="ease-card ease-card-glass foam-container">
        <div class="foam-header">
            <h2>Quantum Foam</h2>
            <span class="ease-badge ease-badge-info">Planck Scale</span>
        </div>
        
        <div class="foam-screen ease-center">
            <div class="spacetime-foam foam-1"></div>
            <div class="spacetime-foam foam-2"></div>
            <div class="planck-boundary-ring"></div>
            <div class="singularity-bubble-core ease-center"></div>
        </div>

        <div class="foam-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Scale: 1.62 × 10⁻³⁵ m</span>
            <button class="ease-btn ease-btn-primary ease-btn-sm ease-hover-grow">Probe Foam</button>
        </div>
    </div>

</body>
</html>
