<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alert Close Button Alignment Fix</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="alert success">
  <span class="alert-text">
    This is a long success alert message that wraps onto multiple lines to
    demonstrate that the close button stays perfectly centered regardless of
    the content height.
  </span>

  <button class="alert-close">&times;</button>
</div>

</body>
</html>
