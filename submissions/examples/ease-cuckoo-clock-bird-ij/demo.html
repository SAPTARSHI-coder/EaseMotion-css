<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=0.9">
<title>Cuckoo Clock Bird</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="cuckoo-clock">
  <header class="cuckoo-head">
    <h1 class="cuckoo-name">BLACK FOREST</h1>
    <p class="cuckoo-time">THREE O'CLOCK</p>
  </header>
  <section class="cuckoo-case" aria-label="Cuckoo clock face">
    <div class="cuckoo-roof"></div>
    <div class="clock-face">
      <div class="clock-hand hour-hand"></div>
      <div class="clock-hand minute-hand"></div>
    </div>
    <div class="bird-door"><span class="bird">CUCKOO</span></div>
    <div class="pend-rod"><span class="pend-disk"></span></div>
    <div class="clock-weights"></div>
  </section>
  <footer class="cuckoo-foot">
    <span class="cuckoo-chime">CHIME AT 3</span>
    <span class="cuckoo-wind">WOUND UP</span>
  </footer>
</main>
</body>
</html>
