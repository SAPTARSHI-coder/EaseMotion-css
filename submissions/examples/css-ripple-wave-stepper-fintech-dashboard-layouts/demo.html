<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ripple-Wave Stepper Fintech Dashboard</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<main class="container">


<section class="dashboard">


<span class="badge">
FINTECH DASHBOARD
</span>


<h1>
Ripple Wave Stepper
</h1>


<p>
Track transaction workflow progress with smooth CSS ripple effects.
</p>



<div class="stepper">


<div class="step active">

<div class="circle">
1
</div>

<h3>
Payment
</h3>

<p>
Payment initiated
</p>

</div>



<div class="step">

<div class="circle">
2
</div>

<h3>
Verification
</h3>

<p>
Checking details
</p>

</div>



<div class="step">

<div class="circle">
3
</div>

<h3>
Approval
</h3>

<p>
Transaction completed
</p>

</div>



<div class="step">

<div class="circle">
4
</div>

<h3>
Settlement
</h3>

<p>
Funds transferred
</p>

</div>


</div>



</section>


</main>


</body>

</html>
