<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Noise Glassmorphism Panel | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="ngp-root">
    <div class="ngp-panel">
      <h2 class="ngp-title">Noise Glass UI</h2>
      <p class="ngp-body">A frosted glass panel with inline SVG noise grain overlay
        for realistic texture and depth. This component uses backdrop-filter blur
        and an SVG feTurbulence filter to create a noise texture effect.</p>
      <div class="ngp-tags">
        <span class="ngp-tag">CSS</span>
        <span class="ngp-tag">Glassmorphism</span>
        <span class="ngp-tag">Noise</span>
        <span class="ngp-tag">Backdrop</span>
      </div>
    </div>
  </div>
</body>
</html>
