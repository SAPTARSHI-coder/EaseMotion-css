<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solar Flare Radial Widget</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <h1>Energy Monitoring</h1>
      <p class="subtitle">Solar Flare Radial Variation</p>
    </header>

    <main class="dashboard-grid">
      <!-- Widget 1: System Activity -->
      <a href="#" class="solar-widget" aria-labelledby="widget1-title">
        <article class="widget-content">
          <!-- The Visual Solar Flare Element -->
          <div class="solar-flare-visual" aria-hidden="true">
            <div class="solar-glow"></div>
            <div class="solar-rays"></div>
            <div class="solar-arcs"></div>
            <div class="solar-core"></div>
          </div>
          
          <div class="widget-data">
            <header class="widget-header">
              <h2 id="widget1-title" class="widget-title">Core Activity</h2>
              <div class="status-indicator active" aria-label="Status: Elevated"></div>
            </header>
            
            <div class="widget-body">
              <div class="primary-metric">82<span class="metric-unit">%</span></div>
              <div class="secondary-metric">
                <span class="trend-icon warning">!</span>
                <span class="trend-value">Elevated</span>
                <span class="trend-label">Flare Index</span>
              </div>
            </div>
            
            <footer class="widget-footer">
              <p>Energy burst detected in sector 7</p>
            </footer>
          </div>
        </article>
      </a>

      <!-- Widget 2: Ambient Output -->
      <a href="#" class="solar-widget" aria-labelledby="widget2-title">
        <article class="widget-content">
          <!-- The Visual Solar Flare Element (Lower Intensity) -->
          <div class="solar-flare-visual intensity-low" aria-hidden="true">
            <div class="solar-glow"></div>
            <div class="solar-rays"></div>
            <div class="solar-arcs"></div>
            <div class="solar-core"></div>
          </div>
          
          <div class="widget-data">
            <header class="widget-header">
              <h2 id="widget2-title" class="widget-title">Ambient Output</h2>
              <div class="status-indicator stable" aria-label="Status: Stable"></div>
            </header>
            
            <div class="widget-body">
              <div class="primary-metric">34<span class="metric-unit">GW</span></div>
              <div class="secondary-metric">
                <span class="trend-icon positive">↓</span>
                <span class="trend-value">-12%</span>
                <span class="trend-label">Cooling</span>
              </div>
            </div>
            
            <footer class="widget-footer">
              <p>Thermals within normal range</p>
            </footer>
          </div>
        </article>
      </a>
    </main>
  </div>
</body>
</html>
