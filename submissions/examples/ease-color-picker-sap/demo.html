<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ease-color-picker-sap demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f4f4f5;
    }
  </style>
</head>
<body>

  <div class="color-picker-sap">
    <div class="swatch-wrap" id="swatchWrap" style="background:#2563eb;">
      <input type="color" id="colorInput" value="#2563eb" aria-label="Pick a color">
    </div>
    <span class="color-value" id="colorValue">#2563EB</span>
  </div>

  <script>
    const input = document.getElementById('colorInput');
    const swatch = document.getElementById('swatchWrap');
    const label = document.getElementById('colorValue');

    input.addEventListener('input', () => {
      swatch.style.background = input.value;
      label.textContent = input.value.toUpperCase();
    });
  </script>

</body>
</html>
