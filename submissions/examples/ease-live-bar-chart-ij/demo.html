<!-- EaseMotion component: live-bar-chart -->
<!DOCTYPE html>
<html lang="en" data-chart="live">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.2">
<title>Ease Live Bar Chart</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="live-chart">
  <header class="chart-head">
    <span class="chart-title">REVENUE</span>
    <span class="chart-period">FY 2026</span>
  </header>
  <div class="chart-grid">
    <div class="chart-axis-y">
      <span class="axis-label">120</span>
      <span class="axis-label">80</span>
      <span class="axis-label">40</span>
      <span class="axis-label">0</span>
    </div>
    <div class="chart-bars">
      <div class="chart-col"><span class="bar-fill bf-q1"></span><span class="bar-label">Q1</span></div>
      <div class="chart-col"><span class="bar-fill bf-q2"></span><span class="bar-label">Q2</span></div>
      <div class="chart-col"><span class="bar-fill bf-q3"></span><span class="bar-label">Q3</span></div>
      <div class="chart-col"><span class="bar-fill bf-q4"></span><span class="bar-label">Q4</span></div>
    </div>
  </div>
  <footer class="chart-legend">
    <span class="legend-dot"></span>
    <span class="legend-text">Quarterly revenue (k$)</span>
  </footer>
</main>
</body>
</html>
