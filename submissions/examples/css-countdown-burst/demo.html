<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Countdown Burst | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="countdown-card" aria-label="Countdown sequence demo">
    <header class="countdown-header">
      <h1>CSS Countdown Burst</h1>
      <p>Pure CSS timed sequence (3-2-1) with launch burst physics.</p>
    </header>

    <div class="countdown-stage" aria-live="polite" aria-atomic="true">
      <div class="countdown-display">
        <span class="digit digit-3" aria-hidden="true">3</span>
        <span class="digit digit-2" aria-hidden="true">2</span>
        <span class="digit digit-1" aria-hidden="true">1</span>
        <span class="launch-text" role="status" aria-label="Sequence complete: GO!">GO!</span>
        <div class="burst-ring" aria-hidden="true"></div>
      </div>
    </div>
  </main>
</body>
</html>
