<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Slider with Material Design Styling - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="em-demo-container">
        <!-- Pure CSS 3D Slider Component Showcase with Material Design Styling -->
        <header class="em-slider-card" role="region" aria-label="3D Slider Showcase" tabindex="0">
            <div class="em-slider-header-bar">
                <span class="em-card-badge">COMPONENT CONTRIBUTION</span>
                <span class="em-brand-logo">MaterialMotion</span>
            </div>
            <h1 class="em-card-title">3D Slider Component</h1>
            <p class="em-card-desc">A fully responsive, pure CSS 3D slider component featuring Material Design elevation shadows, smooth perspective scaling, and frosted glassmorphism.</p>
            <div class="em-slider-wrapper" aria-label="3D Card Carousel">
                <div class="em-slider-container">
                    <div class="em-slider-slide em-slide-1">
                        <span class="em-slide-tag">ELEVATION 01</span>
                        <h3 class="em-slide-title">Surface Depth</h3>
                    </div>
                    <div class="em-slider-slide em-slide-2">
                        <span class="em-slide-tag">ELEVATION 02</span>
                        <h3 class="em-slide-title">Dynamic Motion</h3>
                    </div>
                    <div class="em-slider-slide em-slide-3">
                        <span class="em-slide-tag">ELEVATION 03</span>
                        <h3 class="em-slide-title">Material Ink</h3>
                    </div>
                </div>
            </div>
        </header>
    </div>
</body>
</html>
