<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zoom-In Progress Bar</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>Tech Progress System</h1>

    <div class="progress-box">

        <div class="progress-title">
            Development Progress
            <span>85%</span>
        </div>

        <div class="progress-track">
            <div class="progress-fill"></div>
        </div>

    </div>


    <div class="progress-box">

        <div class="progress-title">
            AI Integration
            <span>70%</span>
        </div>

        <div class="progress-track">
            <div class="progress-fill second"></div>
        </div>

    </div>


    <div class="progress-box">

        <div class="progress-title">
            Deployment
            <span>95%</span>
        </div>

        <div class="progress-track">
            <div class="progress-fill third"></div>
        </div>

    </div>


</div>

</body>
</html>
