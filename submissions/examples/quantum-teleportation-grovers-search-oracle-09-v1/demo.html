<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Grovers Search Oracle - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css"></head><body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030712; color: #ffffff;">

    <div class="ease-card ease-card-glass grover-container">
        <div class="grover-header">
            <h2>Grover's Oracle</h2>
            <span class="ease-badge ease-badge-warning">Amplifying</span>
        </div>
        
        <div class="grover-screen ease-center">
            <div class="grover-flux flux-grover-a"></div>
            <div class="grover-flux flux-grover-b"></div>
            <div class="grover-boundary-ring"></div>
            <div class="grover-core ease-center"></div>
        </div>

        <div class="grover-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Iterations: R &approx; &pi;&radic;N / 4</span>
            <button class="ease-btn ease-btn-warning ease-btn-sm ease-hover-grow">Run Grover Search</button>
        </div>
    </div></body></html>
