<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CNC Mill Path — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="CNC Mill Path demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>CNC Mill Path</h1>
      <p class="lede">CNC mill bit following a toolpath with chip spark accents</p>
    </header>

    <section class="ease-cnc-mill-path" data-demo="cnc-mill-path" aria-live="polite">
      <div class="ease-cnc-mill-path__housing">
        <div class="ease-cnc-mill-path__bezel">
          <div class="ease-cnc-mill-path__face">
            <div class="ease-cnc-mill-path__readout">
              <span class="ease-cnc-mill-path__label">CNC Mill Path</span>
              <span class="ease-cnc-mill-path__value" id="val-cnc-mill-path">READY</span>
            </div>
            <div class="ease-cnc-mill-path__motion" aria-hidden="true">
              <span class="ease-cnc-mill-path__arm"></span>
              <span class="ease-cnc-mill-path__core"></span>
              <span class="ease-cnc-mill-path__trail"></span>
              <span class="ease-cnc-mill-path__mark m1"></span>
              <span class="ease-cnc-mill-path__mark m2"></span>
              <span class="ease-cnc-mill-path__mark m3"></span>
            </div>
            <div class="ease-cnc-mill-path__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-cnc-mill-path__controls">
          <button type="button" class="ease-cnc-mill-path__btn primary">Engage</button>
          <button type="button" class="ease-cnc-mill-path__btn">Reset</button>
          <label class="ease-cnc-mill-path__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-cnc-mill-path__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
