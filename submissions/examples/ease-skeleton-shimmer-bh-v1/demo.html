<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ease-skeleton-shimmer-bh</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #0f172a; min-height: 100vh; padding: 2rem; color: #f1f5f9; }
    .container { max-width: 1200px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 2rem; padding: 2rem; background: rgba(30, 41, 59, 0.8); border-radius: 1rem; }
    header h1 { font-size: 2rem; font-weight: 700; background: linear-gradient(135deg, #94a3b8, #64748b); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    header p { color: #94a3b8; margin-top: 0.5rem; }
    .demo-section { background: rgba(30, 41, 59, 0.8); border: 1px solid rgba(148, 163, 184, 0.1); border-radius: 1rem; padding: 2rem; margin-bottom: 2rem; }
    .demo-section h2 { font-size: 1.25rem; margin-bottom: 1rem; color: #e2e8f0; }
    .demo-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.5rem; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>ease-skeleton-shimmer-bh</h1>
      <p>CSS Skeleton Loading Shimmer Animation</p>
    </header>
    
    <section class="demo-section">
      <h2>Skeleton Shimmer Examples</h2>
      <div class="demo-grid">
        <div class="ease-skeleton ease-skeleton-card">
          <div class="ease-skeleton ease-skeleton-image ease-skeleton-shimmer"></div>
          <div class="ease-skeleton ease-skeleton-title ease-skeleton-shimmer" style="margin-top: 1rem;"></div>
          <div class="ease-skeleton ease-skeleton-text ease-skeleton-shimmer"></div>
          <div class="ease-skeleton ease-skeleton-text ease-skeleton-shimmer" style="width: 80%;"></div>
          <div class="ease-skeleton ease-skeleton-button ease-skeleton-shimmer" style="margin-top: 1rem;"></div>
        </div>
        
        <div class="ease-skeleton ease-skeleton-card" style="display: flex; gap: 1rem; align-items: center;">
          <div class="ease-skeleton ease-skeleton-avatar ease-skeleton-shimmer"></div>
          <div style="flex: 1;">
            <div class="ease-skeleton ease-skeleton-title ease-skeleton-shimmer"></div>
            <div class="ease-skeleton ease-skeleton-text ease-skeleton-shimmer"></div>
          </div>
        </div>
        
        <div class="ease-skeleton ease-skeleton-card">
          <div style="display: flex; flex-direction: column; gap: 0.5rem;">
            <div class="ease-skeleton ease-skeleton-line ease-skeleton-shimmer"></div>
            <div class="ease-skeleton ease-skeleton-line ease-skeleton-shimmer"></div>
            <div class="ease-skeleton ease-skeleton-line ease-skeleton-shimmer" style="width: 70%;"></div>
            <div class="ease-skeleton ease-skeleton-line ease-skeleton-shimmer" style="width: 85%;"></div>
            <div class="ease-skeleton ease-skeleton-line ease-skeleton-shimmer" style="width: 60%;"></div>
          </div>
        </div>
      </div>
    </section>
  </div>
</body>
</html>
