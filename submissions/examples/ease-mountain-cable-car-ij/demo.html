<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.7">
<title>Mountain Cable Car</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="cable-line">
  <header class="cable-top">
    <h1 class="cable-name">ALPINE ROUTE</h1>
    <p class="cable-status">RUNNING</p>
  </header>
  <section class="cable-scene" aria-label="Cable car on a mountain line">
    <div class="tower tower-a"></div>
    <div class="tower tower-b"></div>
    <div class="cable"></div>
    <div class="gondola gondola-a"></div>
    <div class="gondola gondola-b"></div>
  </section>
  <footer class="cable-foot">
    <span class="cable-gond">GONDOLA 2 OF 4</span>
    <span class="cable-elev">ELEV 2,400M</span>
  </footer>
</main>
</body>
</html>
