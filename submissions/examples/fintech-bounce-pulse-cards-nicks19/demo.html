<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bounce-Pulse Card Grid Demo</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            padding-top: 4rem;
        }
        .demo-header {
            text-align: center;
            margin-bottom: 3rem;
            padding: 0 1rem;
        }
        .demo-header h1 {
            font-size: 2.5rem;
            margin: 0 0 0.5rem 0;
        }
        .demo-header p {
            color: #94a3b8;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>
    <div class="demo-header">
        <h1>Fintech Dashboard Overview</h1>
        <p>Hover over the cards to experience the CSS bounce and pulse interactions.</p>
    </div>

    <div class="ease-fintech-grid">
        <!-- Primary Card -->
        <div class="ease-fintech-card primary">
            <div class="ease-fintech-card-header">
                <span>Total Balance</span>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></svg>
            </div>
            <div class="ease-fintech-card-value">$124,592.50</div>
            <div class="ease-fintech-card-trend up">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
                +2.4% from last month
            </div>
        </div>

        <!-- Success Card -->
        <div class="ease-fintech-card success">
            <div class="ease-fintech-card-header">
                <span>Monthly Income</span>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>
            </div>
            <div class="ease-fintech-card-value">$14,230.00</div>
            <div class="ease-fintech-card-trend up">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
                +12.5% vs target
            </div>
        </div>

        <!-- Warning Card -->
        <div class="ease-fintech-card warning">
            <div class="ease-fintech-card-header">
                <span>Total Expenses</span>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M7 15h0M2 9.5h20"/></svg>
            </div>
            <div class="ease-fintech-card-value">$8,405.20</div>
            <div class="ease-fintech-card-trend down">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 18 13.5 8.5 8.5 13.5 1 6"/><polyline points="17 18 23 18 23 12"/></svg>
                -4.2% from last month
            </div>
        </div>
    </div>
</body>
</html>
