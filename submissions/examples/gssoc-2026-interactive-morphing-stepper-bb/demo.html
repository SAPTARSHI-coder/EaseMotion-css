<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Morphing Stepper Process Bar - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="stepper-wrapper">
    <header class="stepper-header">
      <span class="badge">GSSoC 2026 Component</span>
      <h1>Morphing Step Progress Indicator</h1>
      <p>A multi-stage checkout stepper with liquid fill line progress, glowing status nodes, and springy tab transitions.</p>
    </header>

    <div class="stepper-container">
      <div class="stepper-track">
        <div class="stepper-fill" style="width: 66%;"></div>
      </div>

      <div class="stepper-steps">
        <!-- Step 1: Completed -->
        <div class="step completed" tabindex="0">
          <div class="step-node">
            <span class="icon">✓</span>
          </div>
          <div class="step-label">Account Setup</div>
        </div>

        <!-- Step 2: Completed -->
        <div class="step completed" tabindex="0">
          <div class="step-node">
            <span class="icon">✓</span>
          </div>
          <div class="step-label">Billing Details</div>
        </div>

        <!-- Step 3: Active -->
        <div class="step active" tabindex="0">
          <div class="step-node">
            <span class="icon">3</span>
            <div class="node-pulse"></div>
          </div>
          <div class="step-label">Payment Method</div>
        </div>

        <!-- Step 4: Upcoming -->
        <div class="step" tabindex="0">
          <div class="step-node">
            <span class="icon">4</span>
          </div>
          <div class="step-label">Confirmation</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
