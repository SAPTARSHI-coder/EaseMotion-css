<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Morphing Stepper - EaseMotion CSS Showcase</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="stepper-wrapper">
    <header class="stepper-header">
      <h1 class="stepper-title">Multi-Step Interactive Stepper</h1>
      <p class="stepper-subtitle">Morphing step connectors, ripple validation &amp; form panel transitions.</p>
    </header>

    <div class="stepper-card">
      <div class="stepper-bar" role="tablist" aria-label="Registration Progress">
        <div class="step-node active" data-step="1" role="tab">
          <span class="step-num">1</span>
          <span class="step-label">Account</span>
        </div>
        <div class="step-line"><div class="line-progress" id="progressLine"></div></div>
        <div class="step-node" data-step="2" role="tab">
          <span class="step-num">2</span>
          <span class="step-label">Profile</span>
        </div>
        <div class="step-line"></div>
        <div class="step-node" data-step="3" role="tab">
          <span class="step-num">3</span>
          <span class="step-label">Complete</span>
        </div>
      </div>

      <div class="stepper-content">
        <div class="step-panel active" id="panel1">
          <h3>Account Setup</h3>
          <div class="form-group">
            <label>Work Email</label>
            <input type="email" class="step-input" placeholder="alex@developer.io">
          </div>
          <button class="step-btn next-btn" id="nextBtn1">Continue to Profile &rarr;</button>
        </div>

        <div class="step-panel" id="panel2">
          <h3>Profile Details</h3>
          <div class="form-group">
            <label>Full Name</label>
            <input type="text" class="step-input" placeholder="Alex Morgan">
          </div>
          <div class="btn-row">
            <button class="step-btn prev-btn" id="prevBtn2">&larr; Back</button>
            <button class="step-btn next-btn" id="nextBtn2">Finalize Setup &rarr;</button>
          </div>
        </div>

        <div class="step-panel" id="panel3">
          <h3>🎉 Setup Completed!</h3>
          <p>Your workspace environment has been initialized with EaseMotion CSS tokens.</p>
          <button class="step-btn next-btn" onclick="location.reload()">Start Over</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const steps = document.querySelectorAll('.step-node');
    const panels = document.querySelectorAll('.step-panel');
    const progressLine = document.getElementById('progressLine');

    function goToStep(stepNum) {
      steps.forEach((node, idx) => {
        if (idx < stepNum) node.classList.add('completed', 'active');
        else if (idx === stepNum - 1) node.classList.add('active');
        else node.classList.remove('active', 'completed');
      });

      panels.forEach((p, idx) => {
        p.classList.toggle('active', idx === stepNum - 1);
      });

      progressLine.style.width = stepNum === 2 ? '50%' : stepNum === 3 ? '100%' : '0%';
    }

    document.getElementById('nextBtn1').addEventListener('click', () => goToStep(2));
    document.getElementById('nextBtn2').addEventListener('click', () => goToStep(3));
    document.getElementById('prevBtn2').addEventListener('click', () => goToStep(1));
  </script>
</body>
</html>
