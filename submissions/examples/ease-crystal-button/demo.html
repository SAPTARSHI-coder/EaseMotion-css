<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crystal Button · Gemstone Facet Shimmer</title>

    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <div class="card">
        <h2>💎 Crystal Button</h2>
        <p class="sub">facets shimmer like a cut gemstone</p>

        <!-- === CRYSTAL BUTTON === -->
        <button class="crystal-btn" id="crystalBtn">
            <span class="crystal-content">
                <i class="fas fa-gem"></i>
                <span>Crystal</span>
            </span>
            <span class="crystal-shine"></span>
            <span class="crystal-shine shine-2"></span>
            <span class="crystal-shine shine-3"></span>
            <span class="crystal-facet facet-1"></span>
            <span class="crystal-facet facet-2"></span>
            <span class="crystal-facet facet-3"></span>
            <span class="crystal-facet facet-4"></span>
        </button>

        <p style="margin-top: 2rem; font-size: 0.85rem; color: #64748b;">
            Hover · watch the crystal facets shimmer
        </p>
    </div>

    <!-- Embedded JavaScript -->
    <script>
        (function() {
            'use strict';

            const btn = document.getElementById('crystalBtn');

            // Click feedback
            btn.addEventListener('click', function(e) {
                this.classList.add('click-pulse');
                setTimeout(() => {
                    this.classList.remove('click-pulse');
                }, 300);
                console.log('💎 Crystal button clicked!');
            });

            // Keyboard accessibility
            btn.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    this.click();
                }
            });

            // Reset animation on hover
            btn.addEventListener('mouseenter', function() {
                const shines = this.querySelectorAll('.crystal-shine');
                shines.forEach(shine => {
                    shine.style.animation = 'none';
                    void shine.offsetWidth;
                    shine.style.animation = '';
                });
                const facets = this.querySelectorAll('.crystal-facet');
                facets.forEach(facet => {
                    facet.style.animation = 'none';
                    void facet.offsetWidth;
                    facet.style.animation = '';
                });
            });

            console.log('💎 Crystal button initialized!');

        })();
    </script>

</body>
</html>
