<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bouncing Wave Loader — EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <p class="label">Pure CSS Animated Bouncing Wave Loaders</p>
  <div class="demo-row">
    <!-- Purple Neon -->
    <div class="ease-bounce-loader">
      <span class="ease-bounce-dot"></span>
      <span class="ease-bounce-dot"></span>
      <span class="ease-bounce-dot"></span>
      <span class="ease-bounce-dot"></span>
    </div>

    <!-- Cyan Glow -->
    <div class="ease-bounce-loader ease-bounce-loader--cyan">
      <span class="ease-bounce-dot"></span>
      <span class="ease-bounce-dot"></span>
      <span class="ease-bounce-dot"></span>
      <span class="ease-bounce-dot"></span>
    </div>

    <!-- Gold Amber -->
    <div class="ease-bounce-loader ease-bounce-loader--gold">
      <span class="ease-bounce-dot"></span>
      <span class="ease-bounce-dot"></span>
      <span class="ease-bounce-dot"></span>
      <span class="ease-bounce-dot"></span>
    </div>
  </div>

</body>
</html>
