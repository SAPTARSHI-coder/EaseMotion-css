<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quantum Particle Matrix Loader Hub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="ease-quantum-hub">
    <div class="ease-matrix-container">
      <!-- Central Core & Shockwaves -->
      <div class="ease-shockwave"></div>
      <div class="ease-shockwave"></div>
      <div class="ease-energy-core"></div>
      
      <!-- Orbital Rings -->
      <div class="ease-orbital-ring ease-ring-inner">
        <div class="ease-particle-node"></div>
      </div>
      <div class="ease-orbital-ring ease-ring-outer">
        <div class="ease-particle-node"></div>
        <div class="ease-particle-node node-alt"></div>
      </div>
    </div>
    
    <!-- Telemetry Status -->
    <div class="ease-telemetry-wrapper">
      <div class="ease-telemetry-text">COMPUTING HASH_MATRICES...</div>
      <div class="ease-progress-track">
        <div class="ease-progress-bar"></div>
      </div>
    </div>
  </main>
</body>
</html>
