<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orbital Archive</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="app">

  <section class="card">

    <header>
      <span>MEMORY SYSTEM</span>
      <h1>Orbital Archive</h1>
      <p>Every memory has its own orbit.</p>
    </header>

    <div class="space" id="space">

      <div class="core">
        <span>ARCHIVE</span>
      </div>

      <div class="orbit orbit-one"></div>
      <div class="orbit orbit-two"></div>
      <div class="orbit orbit-three"></div>

      <div id="satellites"></div>

    </div>

    <div class="controls">

      <button id="add">＋ Archive Memory</button>
      <button id="reset">Reset</button>

      <label>
        Orbit Speed
        <input
          id="speed"
          type="range"
          min="0.3"
          max="2"
          value="1"
          step="0.1"
        >
        <span id="speedValue">1×</span>
      </label>

      <strong id="count">0 memories</strong>

    </div>

  </section>

</main>

<script>
const satellites = document.getElementById("satellites");
const speed = document.getElementById("speed");
const speedValue = document.getElementById("speedValue");
const countEl = document.getElementById("count");

const memories = [
  "First Idea",
  "Prototype",
  "Discovery",
  "Milestone",
  "Experiment",
  "Launch",
  "Breakthrough",
  "Dream"
];

let count = 0;

function addMemory() {
  if (count >= 8) return;

  const item = document.createElement("div");
  item.className = "satellite";

  const orbit = count % 3;
  const duration = 12 + count * 2;

  item.style.setProperty("--orbit", orbit);
  item.style.setProperty("--duration", `${duration}s`);
  item.style.setProperty(
    "--delay",
    `${-count * 1.5}s`
  );

  item.innerHTML = `
    <span>${memories[count]}</span>
  `;

  satellites.appendChild(item);

  count++;
  countEl.textContent = `${count} memories`;
}

function reset() {
  satellites.innerHTML = "";
  count = 0;
  countEl.textContent = "0 memories";
}

speed.addEventListener("input", () => {
  speedValue.textContent = `${speed.value}×`;

  document.documentElement.style.setProperty(
    "--orbit-speed",
    speed.value
  );
});

document.getElementById("add").addEventListener("click", addMemory);
document.getElementById("reset").addEventListener("click", reset);

for (let i = 0; i < 5; i++) {
  addMemory();
}
</script>

</body>
</html>
