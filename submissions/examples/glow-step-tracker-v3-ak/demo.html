<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Step Progress Tracker — EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <p class="label">Pure CSS Wizard Step Progress Tracker</p>

  <div class="ease-step-progress-v3">
    <div class="ease-step-progress-bar-v3"></div>

    <div class="ease-step-item-v3 ease-step-item-v3--completed">
      <div class="ease-step-circle-v3">✓</div>
      <span class="ease-step-label-v3">Account</span>
    </div>

    <div class="ease-step-item-v3 ease-step-item-v3--active">
      <div class="ease-step-circle-v3">2</div>
      <span class="ease-step-label-v3">Billing</span>
    </div>

    <div class="ease-step-item-v3">
      <div class="ease-step-circle-v3">3</div>
      <span class="ease-step-label-v3">Confirm</span>
    </div>
  </div>

</body>
</html>
