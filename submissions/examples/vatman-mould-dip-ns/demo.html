<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vatman Mould Dip — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Vatman Mould Dip demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Vatman Mould Dip</h1>
      <p class="lede">Vatman dipping the mould into the vat</p>
    </header>

    <section class="ease-vatman-mould-dip" data-demo="vatman-mould-dip" aria-live="polite">
      <div class="ease-vatman-mould-dip__housing">
        <div class="ease-vatman-mould-dip__bezel">
          <div class="ease-vatman-mould-dip__face">
            <div class="ease-vatman-mould-dip__readout">
              <span class="ease-vatman-mould-dip__label">Vatman Mould Dip</span>
              <span class="ease-vatman-mould-dip__value">LIVE</span>
            </div>
            <div class="ease-vatman-mould-dip__motion" aria-hidden="true">
              <span class="ease-vatman-mould-dip__a"></span>
              <span class="ease-vatman-mould-dip__b"></span>
              <span class="ease-vatman-mould-dip__c"></span>
              <span class="ease-vatman-mould-dip__d"></span>
            </div>
            <div class="ease-vatman-mould-dip__meters">
              <i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-vatman-mould-dip__controls">
          <button type="button" class="ease-vatman-mould-dip__btn primary">Dip</button>
          <button type="button" class="ease-vatman-mould-dip__btn">Drain</button>
          <label class="ease-vatman-mould-dip__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-vatman-mould-dip__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
