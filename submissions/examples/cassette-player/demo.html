<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CSS Cassette Player</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="cassette-player" role="status" aria-label="Retro cassette player animation">


<h1>RETRO CASSETTE</h1>


<div class="player-body">


<div class="display">
  NOW PLAYING
</div>


<div class="cassette">

    <div class="reel reel-left">
        <span></span>
    </div>


    <div class="tape-window"></div>


    <div class="reel reel-right">
        <span></span>
    </div>


</div>


<div class="buttons">

<button>◀</button>
<button class="play">▶</button>
<button>■</button>

</div>


</div>


<p>CASSETTE PLAY MODE</p>


</div>


</body>

</html>
