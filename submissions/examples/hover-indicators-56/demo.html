<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Magnetic floating action navigation bar with fluid hover indicators">
  <title>Magnetic Floating Navigation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">
    <section class="hero">
      <span class="eyebrow">EaseMotion UI</span>
      <h1>Magnetic Floating Navigation</h1>
      <p>
        Move your pointer across the navigation items and experience
        a smooth magnetic interaction with a fluid active indicator.
      </p>
    </section>

    <nav class="floating-nav" aria-label="Main navigation">
      <span class="nav-indicator"></span>

      <a href="#home" class="nav-item active" aria-label="Home">
        <span class="icon">⌂</span>
        <span class="label">Home</span>
      </a>

      <a href="#explore" class="nav-item" aria-label="Explore">
        <span class="icon">✦</span>
        <span class="label">Explore</span>
      </a>

      <a href="#projects" class="nav-item" aria-label="Projects">
        <span class="icon">▣</span>
        <span class="label">Projects</span>
      </a>

      <a href="#about" class="nav-item" aria-label="About">
        <span class="icon">●</span>
        <span class="label">About</span>
      </a>
    </nav>
  </main>

  <script>
    const nav = document.querySelector(".floating-nav");
    const items = document.querySelectorAll(".nav-item");
    const indicator = document.querySelector(".nav-indicator");

    function moveIndicator(item) {
      const navRect = nav.getBoundingClientRect();
      const itemRect = item.getBoundingClientRect();

      indicator.style.width = `${itemRect.width}px`;
      indicator.style.height = `${itemRect.height}px`;
      indicator.style.transform =
        `translate(${itemRect.left - navRect.left}px, ${itemRect.top - navRect.top}px)`;
    }

    items.forEach((item) => {
      item.addEventListener("mouseenter", () => {
        moveIndicator(item);

        items.forEach((navItem) => navItem.classList.remove("active"));
        item.classList.add("active");
      });

      item.addEventListener("mousemove", (event) => {
        const rect = item.getBoundingClientRect();

        const x = (event.clientX - rect.left - rect.width / 2) * 0.12;
        const y = (event.clientY - rect.top - rect.height / 2) * 0.12;

        item.style.transform = `translate(${x}px, ${y}px)`;
      });

      item.addEventListener("mouseleave", () => {
        item.style.transform = "";
      });
    });

    window.addEventListener("load", () => {
      moveIndicator(document.querySelector(".nav-item.active"));
    });

    window.addEventListener("resize", () => {
      moveIndicator(document.querySelector(".nav-item.active"));
    });
  </script>

</body>
</html>
