<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Hover: Subtle Elevate Variation - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="em-demo-container">
        <!-- Pure CSS Subtle Elevate Hover Component Showcase -->
        <header class="em-hover-card" role="region" aria-label="Subtle Elevate Hover Showcase" tabindex="0">
            <div class="em-hover-header-bar">
                <span class="em-card-badge">HOVER EFFECTS</span>
                <span class="em-brand-logo">ElevateMotion</span>
            </div>
            <h1 class="em-card-title">Subtle Elevate Hover</h1>
            <p class="em-card-desc">A smooth, accessible, and performant pure CSS hover effect featuring graceful shadow lift elevation, hardware-accelerated transitions, and frosted glassmorphism.</p>
            <div class="em-hover-wrapper">
                <button class="em-elevate-btn" aria-label="Subtle Elevate Button">
                    <span class="em-btn-text">SUBTLE ELEVATE</span>
                </button>
            </div>
        </header>
    </div>
</body>
</html>
