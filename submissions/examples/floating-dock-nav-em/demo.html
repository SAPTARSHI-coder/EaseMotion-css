<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Floating Dock Navigation Bar (macOS Style) · EaseMotion</title>
  <meta name="description" content="A macOS-inspired floating dock navigation component with icon proximity scaling, active application indicator dots, and glassmorphic backdrop." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Demo Page Background / Wallpaper -->
  <main class="demo-page">
    <div class="demo-content">
      <h1 class="demo-title">Floating Dock Navigation</h1>
      <p class="demo-subtitle">Hover over the dock icons below to see the proximity scaling effect. Click an icon to make it active.</p>
    </div>
  </main>

  <!-- =========================================================
       FLOATING DOCK COMPONENT
  ========================================================== -->
  <nav class="dock-container" aria-label="Main Navigation">
    <ul class="dock" id="dock">
      
      <!-- Dock Item: Finder (Active) -->
      <li class="dock__item is-active">
        <button class="dock__btn" aria-label="Finder">
          <span class="dock__tooltip">Finder</span>
          <div class="dock__icon">
            <!-- Simplified Finder-like Icon -->
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="9" y1="3" x2="9" y2="21"></line>
            </svg>
          </div>
          <div class="dock__dot"></div>
        </button>
      </li>

      <!-- Dock Item: Messages -->
      <li class="dock__item">
        <button class="dock__btn" aria-label="Messages">
          <span class="dock__tooltip">Messages</span>
          <div class="dock__icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
            </svg>
          </div>
          <div class="dock__dot"></div>
        </button>
      </li>

      <!-- Dock Item: Mail -->
      <li class="dock__item">
        <button class="dock__btn" aria-label="Mail">
          <span class="dock__tooltip">Mail</span>
          <div class="dock__icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
              <polyline points="22,6 12,13 2,6"></polyline>
            </svg>
          </div>
          <div class="dock__dot"></div>
        </button>
      </li>

      <!-- Dock Item: Safari -->
      <li class="dock__item is-active">
        <button class="dock__btn" aria-label="Browser">
          <span class="dock__tooltip">Browser</span>
          <div class="dock__icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon>
            </svg>
          </div>
          <div class="dock__dot"></div>
        </button>
      </li>

      <!-- Divider -->
      <li class="dock__divider" aria-hidden="true"></li>

      <!-- Dock Item: Settings -->
      <li class="dock__item">
        <button class="dock__btn" aria-label="Settings">
          <span class="dock__tooltip">Settings</span>
          <div class="dock__icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3"></circle>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
          </div>
          <div class="dock__dot"></div>
        </button>
      </li>

    </ul>
  </nav>

  <script src="script.js"></script>
</body>
</html>
