<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Pure CSS 3D morphing shape animation">
  <title>CSS 3D Morphing Shape</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="scene">
    <section class="showcase" aria-labelledby="title">
      <div class="morph-wrap" aria-hidden="true">
        <div class="morph-shape">
          <div class="inner-shape"></div>
        </div>
      </div>

      <div class="content">
        <span class="badge">PURE CSS 3D</span>

        <h1 id="title">Morphing Shape</h1>

        <p>
          A smooth 3D animated shape that continuously changes form
          using CSS transforms, border-radius, perspective and keyframes.
        </p>

        <div class="features">
          <span>3D Depth</span>
          <span>CSS Only</span>
          <span>Smooth Motion</span>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
