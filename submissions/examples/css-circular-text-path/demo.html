<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Circular Text Path</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="wrapper">
  <div class="circle-text" aria-label="Circular rotating text">
    <span style="--i:1">E</span>
    <span style="--i:2">A</span>
    <span style="--i:3">S</span>
    <span style="--i:4">E</span>
    <span style="--i:5">M</span>
    <span style="--i:6">O</span>
    <span style="--i:7">T</span>
    <span style="--i:8">I</span>
    <span style="--i:9">O</span>
    <span style="--i:10">N</span>
    <span style="--i:11">•</span>
    <span style="--i:12">C</span>
    <span style="--i:13">S</span>
    <span style="--i:14">S</span>
    <span style="--i:15">•</span>
    <span style="--i:16">A</span>
    <span style="--i:17">N</span>
    <span style="--i:18">I</span>
    <span style="--i:19">M</span>
    <span style="--i:20">A</span>
    <span style="--i:21">T</span>
    <span style="--i:22">I</span>
    <span style="--i:23">O</span>
    <span style="--i:24">N</span>
  </div>

  <div class="center-dot"></div>
</div>

</body>
</html>
