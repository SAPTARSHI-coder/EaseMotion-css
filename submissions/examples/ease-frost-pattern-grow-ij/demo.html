<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frost Pattern Grow Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="window">
    <div class="frost" id="frost" aria-hidden="true"></div>
    <div class="pane" aria-hidden="true"></div>
    <button class="breathe" id="breathe" type="button">Breathe On Glass</button>
    <p class="hint">Frost crystals slowly grow across a cold window pane.</p>
  </main>
  <script>
    const frost = document.getElementById("frost");
    const breathe = document.getElementById("breathe");
    function fog() {
      frost.classList.remove("grow");
      void frost.offsetWidth;
      frost.classList.add("grow");
    }
    breathe.addEventListener("click", fog);
    fog();
  </script>
</body>
</html>
