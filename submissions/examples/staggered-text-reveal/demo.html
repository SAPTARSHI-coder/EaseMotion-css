<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staggered Text Reveal Demo</title>
    <!-- Assuming core stylesheets if needed, or just standard font setup -->
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f3f4f6;
            color: #111827;
        }

        .demo-container {
            text-align: center;
            max-width: 600px;
            padding: 2rem;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            line-height: 1.2;
        }
    </style>
</head>
<body>

    <div class="demo-container">
        <!-- The container class .ease-text-reveal applied to the parent -->
        <h1 class="ease-text-reveal">
            <span>Premium</span>
            <span>animations</span>
            <span>for</span>
            <span>modern</span>
            <span>landing</span>
            <span>pages.</span>
        </h1>
        <p class="ease-text-reveal" style="font-size: 1.125rem; color: #4b5563;">
            <span>A</span>
            <span>lightweight,</span>
            <span>CSS-only</span>
            <span>alternative</span>
            <span>to</span>
            <span>heavy</span>
            <span>animation</span>
            <span>libraries.</span>
        </p>
    </div>

</body>
</html>
