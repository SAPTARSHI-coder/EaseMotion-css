<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spin Qubits Silicon Quantum Dots - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css"></head><body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030712; color: #ffffff;">

    <div class="ease-card ease-card-glass dot-container">
        <div class="dot-header">
            <h2>Silicon Spin Qubits</h2>
            <span class="ease-badge ease-badge-success">Confinement</span>
        </div>
        
        <div class="dot-screen ease-center">
            <div class="dot-flux flux-dot-a"></div>
            <div class="dot-flux flux-dot-b"></div>
            <div class="dot-boundary-ring"></div>
            <div class="dot-core ease-center"></div>
        </div>

        <div class="dot-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Micromagnets &amp; Exchange Couplings</span>
            <button class="ease-btn ease-btn-success ease-btn-sm ease-hover-grow">Run Silicon Spin Circuit</button>
        </div>
    </div></body></html>
