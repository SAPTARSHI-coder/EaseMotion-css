<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dark Matrix Digital Rain</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="matrix-overlay">
    <span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span>
    <span></span><span></span>
</div>

<section class="hero">

    <div class="panel">

        <span class="badge">
            Dark Mode Variant
        </span>

        <h1>Cybernetic Matrix</h1>

        <p>
            A modern dark-themed cyber interface with animated matrix rain,
            glowing status indicators, and glassmorphism design built using
            pure HTML and CSS.
        </p>

        <div class="status-grid">

            <div class="status-card">
                <h3>System</h3>
                <span class="online">Online</span>
            </div>

            <div class="status-card">
                <h3>Security</h3>
                <span class="online">Protected</span>
            </div>

            <div class="status-card">
                <h3>Network</h3>
                <span class="online">Stable</span>
            </div>

        </div>

        <div class="actions">

            <button class="primary-btn">
                Launch Console
            </button>

            <button class="secondary-btn">
                Documentation
            </button>

        </div>

    </div>

</section>

</body>
</html>
