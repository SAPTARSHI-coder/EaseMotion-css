<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mood Lamp · color changes with interaction intensity</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <div class="mood-container">
      <div class="mood-display" id="moodDisplay">
        <!-- Canvas for mood lamp -->
        <canvas id="moodCanvas"></canvas>
        
        <!-- Mood Lamp -->
        <div class="mood-lamp" id="moodLamp">
          <div class="lamp-base"></div>
          <div class="lamp-bulb">
            <div class="lamp-glow" id="lampGlow"></div>
            <div class="lamp-core" id="lampCore"></div>
          </div>
          <div class="lamp-shade"></div>
        </div>

        <!-- Mood Info -->
        <div class="mood-info">
          <span class="info-label">💡 Intensity</span>
          <span class="info-value" id="intensityLevel">0%</span>
        </div>

        <!-- Mood Controls -->
        <div class="mood-controls">
          <div class="control-group">
            <label class="control-label">🎨 Mood</label>
            <div class="mood-options">
              <button class="mood-btn active" data-mood="calm" title="Calm">😌</button>
              <button class="mood-btn" data-mood="energy" title="Energy">⚡</button>
              <button class="mood-btn" data-mood="warm" title="Warm">🔥</button>
              <button class="mood-btn" data-mood="cool" title="Cool">❄️</button>
              <button class="mood-btn" data-mood="romantic" title="Romantic">💕</button>
            </div>
          </div>
        </div>

        <!-- Mood Text -->
        <div class="mood-text">
          <span class="text-label">💡 Mood Lamp</span>
          <span class="text-message" id="moodMessage">Touch or hover to change the mood</span>
        </div>
      </div>
      
      <div class="mood-status">
        <span id="moodStatus">💡 Interact with the lamp to change its mood</span>
      </div>
    </div>

    <div class="controls">
      <button class="btn btn-reset" id="resetBtn">⟳ Reset</button>
    </div>
    <div class="footer-note">
      <span>💡 mood lamp · 5 moods · intensity-based color</span>
    </div>
  </div>

  <script>
    (function() {
      "use strict";

      // DOM refs
      const canvas = document.getElementById('moodCanvas');
      const ctx = canvas.getContext('2d');
      const display = document.getElementById('moodDisplay');
      const moodLamp = document.getElementById('moodLamp');
      const lampGlow = document.getElementById('lampGlow');
      const lampCore = document.getElementById('lampCore');
      const intensityLevel = document.getElementById('intensityLevel');
      const moodStatus = document.getElementById('moodStatus');
      const moodMessage = document.getElementById('moodMessage');
      const resetBtn = document.getElementById('resetBtn');
      const moodBtns = document.querySelectorAll('.mood-btn');

      // State
      let intensity = 0;
      let targetIntensity = 0;
      let currentMood = 'calm';
      let particles = [];
      let animationId = null;
      let time = 0;
      let isInteracting = false;

      // Mood color configurations
      const moods = {
        calm: {
          name: 'Calm',
          colors: ['#818cf8', '#6366f1', '#a78bfa', '#4f46e5'],
          glow: 'rgba(99, 102, 241, 0.3)',
          description: 'Serene and peaceful'
        },
        energy: {
          name: 'Energy',
          colors: ['#fbbf24', '#f59e0b', '#fcd34d', '#d97706'],
          glow: 'rgba(251, 191, 36, 0.3)',
          description: 'Bright and vibrant'
        },
        warm: {
          name: 'Warm',
          colors: ['#f97316', '#ef4444', '#fb923c', '#dc2626'],
          glow: 'rgba(239, 68, 68, 0.3)',
          description: 'Cozy and comforting'
        },
        cool: {
          name: 'Cool',
          colors: ['#60a5fa', '#3b82f6', '#93c5fd', '#2563eb'],
          glow: 'rgba(59, 130, 246, 0.3)',
          description: 'Fresh and calming'
        },
        romantic: {
          name: 'Romantic',
          colors: ['#f472b6', '#ec4899', '#f9a8d4', '#db2777'],
          glow: 'rgba(236, 72, 153, 0.3)',
          description: 'Soft and dreamy'
        }
      };

      // Particle class for ambient light
      class LightParticle {
        constructor() {
          this.reset();
          this.x = Math.random() * canvas.width;
          this.y = Math.random() * canvas.height;
        }

        reset() {
          const w = canvas.width;
          const h = canvas.height;
          this.x = Math.random() * w;
          this.y = Math.random() * h;
          this.size = 1 + Math.random() * 3;
          this.speed = 0.1 + Math.random() * 0.3;
          this.angle = Math.random() * Math.PI * 2;
          this.phase = Math.random() * Math.PI * 2;
          this.life = 0.3 + Math.random() * 0.7;
          this.maxLife = this.life;
        }

        update(intensity, time) {
          const speed = 0.01 + intensity * 0.02;
          this.angle += speed;
          this.x += Math.cos(this.angle) * 0.2 * (1 + intensity);
          this.y += Math.sin(this.angle) * 0.2 * (1 + intensity);
          this.phase += 0.01;
          this.life -= 0.001;
          
          if (this.life <= 0) {
            this.reset();
            this.life = 0.3 + Math.random() * 0.7;
            this.maxLife = this.life;
          }
          
          // Keep within bounds
          if (this.x < -10) this.x = canvas.width + 10;
          if (this.x > canvas.width + 10) this.x = -10;
          if (this.y < -10) this.y = canvas.height + 10;
          if (this.y > canvas.height + 10) this.y = -10;
        }

        draw(ctx, color) {
          const alpha = (this.life / this.maxLife) * (0.1 + intensity * 0.3);
          const size = this.size * (0.5 + intensity * 0.5);
          
          ctx.save();
          ctx.globalAlpha = alpha;
          ctx.fillStyle = color;
          ctx.shadowColor = color;
          ctx.shadowBlur = 10 * (0.3 + intensity * 0.7);
          ctx.beginPath();
          ctx.arc(this.x, this.y, size, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      }

      // Generate particles
      function generateParticles() {
        particles = [];
        for (let i = 0; i < 50; i++) {
          particles.push(new LightParticle());
        }
      }

      // Draw mood lamp
      function drawLamp(intensity, mood) {
        const moodData = moods[mood];
        const colors = moodData.colors;
        const colorIndex = Math.floor(intensity * (colors.length - 1));
        const nextIndex = Math.min(colorIndex + 1, colors.length - 1);
        const mix = (intensity * (colors.length - 1)) - colorIndex;
        
        // Interpolate colors
        const color1 = colors[colorIndex];
        const color2 = colors[nextIndex];
        const color = lerpColor(color1, color2, mix);
        
        // Update lamp glow
        lampGlow.style.backgroundColor = color;
        lampGlow.style.boxShadow = `0 0 ${40 + intensity * 80}px ${color}66, 0 0 ${80 + intensity * 160}px ${color}33`;
        lampGlow.style.opacity = 0.3 + intensity * 0.7;
        lampGlow.style.transform = `scale(${0.8 + intensity * 0.4})`;
        
        // Update lamp core
        lampCore.style.backgroundColor = color;
        lampCore.style.boxShadow = `0 0 ${20 + intensity * 40}px ${color}88`;
        lampCore.style.transform = `scale(${0.6 + intensity * 0.4})`;
        
        // Update intensity display
        const percent = Math.round(intensity * 100);
        intensityLevel.textContent = percent + '%';
        intensityLevel.style.color = color;
        
        // Update status
        if (intensity > 0.8) {
          moodStatus.textContent = `💡 ${moodData.name} mood at full intensity! ✨`;
          moodStatus.style.color = color;
        } else if (intensity > 0.4) {
          moodStatus.textContent = `💡 ${moodData.name} mood glowing warmly`;
          moodStatus.style.color = color;
        } else if (intensity > 0.05) {
          moodStatus.textContent = `💡 ${moodData.name} mood awakening...`;
          moodStatus.style.color = color;
        } else {
          moodStatus.textContent = `💡 ${moodData.name} mood waiting`;
          moodStatus.style.color = '#94a3b8';
        }
        
        // Update mood message
        if (intensity > 0.1) {
          moodMessage.textContent = `${moodData.name} · ${moodData.description}`;
          moodMessage.style.color = color;
        } else {
          moodMessage.textContent = 'Touch or hover to change the mood';
          moodMessage.style.color = '#94a3b8';
        }
      }

      // Color interpolation helper
      function lerpColor(c1, c2, t) {
        const r1 = parseInt(c1.slice(1,3), 16);
        const g1 = parseInt(c1.slice(3,5), 16);
        const b1 = parseInt(c1.slice(5,7), 16);
        const r2 = parseInt(c2.slice(1,3), 16);
        const g2 = parseInt(c2.slice(3,5), 16);
        const b2 = parseInt(c2.slice(5,7), 16);
        
        const r = Math.round(r1 + (r2 - r1) * t);
        const g = Math.round(g1 + (g2 - g1) * t);
        const b = Math.round(b1 + (b2 - b1) * t);
        
        return `#${r.toString(16).padStart(2, '0')}${g.toString(16).padStart(2, '0')}${b.toString(16).padStart(2, '0')}`;
      }

      // Animation loop
      function animate() {
        time += 0.02;
        const moodData = moods[currentMood];
        const color = moodData.colors[Math.floor(intensity * (moodData.colors.length - 1))] || moodData.colors[0];
        
        // Smooth intensity interpolation
        intensity += (targetIntensity - intensity) * 0.05;
        
        // Draw canvas background
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // Draw ambient glow on canvas
        const grad = ctx.createRadialGradient(
          canvas.width/2, canvas.height/2, 0,
          canvas.width/2, canvas.height/2, canvas.width * 0.6
        );
        const glowColor = moodData.colors[Math.floor(intensity * (moodData.colors.length - 1))] || moodData.colors[0];
        grad.addColorStop(0, glowColor + '22');
        grad.addColorStop(0.5, glowColor + '11');
        grad.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        // Update and draw particles
        particles.forEach(p => {
          p.update(intensity, time);
          p.draw(ctx, color);
        });
        
        // Draw lamp
        drawLamp(intensity, currentMood);
        
        // Update lamp position
        const rect = display.getBoundingClientRect();
        moodLamp.style.left = (rect.width / 2 - 60) + 'px';
        moodLamp.style.top = (rect.height / 2 - 80) + 'px';
        
        animationId = requestAnimationFrame(animate);
      }

      // Set mood
      function setMood(mood) {
        currentMood = mood;
        moodBtns.forEach(btn => {
          btn.classList.toggle('active', btn.dataset.mood === mood);
        });
        const moodData = moods[mood];
        moodStatus.textContent = `🎨 Mood: ${moodData.name}`;
        moodStatus.style.color = moodData.colors[0];
        setTimeout(() => {
          if (intensity < 0.1) {
            moodStatus.textContent = `💡 ${moodData.name} mood waiting`;
            moodStatus.style.color = '#94a3b8';
          }
        }, 1500);
      }

      // Handle interaction
      function handleInteraction(intensityValue) {
        targetIntensity = Math.max(0, Math.min(1, intensityValue));
        isInteracting = true;
      }

      // Reset
      function resetMood() {
        targetIntensity = 0;
        intensity = 0;
        isInteracting = false;
        moodStatus.textContent = '🔄 Reset complete';
        moodStatus.style.color = '#94a3b8';
        moodMessage.textContent = 'Touch or hover to change the mood';
        moodMessage.style.color = '#94a3b8';
        setTimeout(() => {
          const moodData = moods[currentMood];
          moodStatus.textContent = `💡 ${moodData.name} mood waiting`;
          moodStatus.style.color = '#94a3b8';
        }, 1000);
      }

      // Resize canvas
      function resizeCanvas() {
        const rect = display.getBoundingClientRect();
        canvas.width = rect.width;
        canvas.height = rect.height;
        canvas.style.width = rect.width + 'px';
        canvas.style.height = rect.height + 'px';
      }

      // Event listeners
      display.addEventListener('mousemove', function(e) {
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        const cx = rect.width / 2;
        const cy = rect.height / 2;
        
        // Calculate distance from center
        const dist = Math.sqrt(Math.pow(x - cx, 2) + Math.pow(y - cy, 2));
        const maxDist = Math.min(rect.width, rect.height) * 0.5;
        const intensityValue = Math.max(0, 1 - (dist / maxDist));
        handleInteraction(intensityValue);
      });

      display.addEventListener('mouseleave', function() {
        targetIntensity = 0;
        isInteracting = false;
      });

      // Touch support
      display.addEventListener('touchmove', function(e) {
        e.preventDefault();
        const rect = canvas.getBoundingClientRect();
        const touch = e.touches[0];
        const x = touch.clientX - rect.left;
        const y = touch.clientY - rect.top;
        const cx = rect.width / 2;
        const cy = rect.height / 2;
        
        const dist = Math.sqrt(Math.pow(x - cx, 2) + Math.pow(y - cy, 2));
        const maxDist = Math.min(rect.width, rect.height) * 0.5;
        const intensityValue = Math.max(0, 1 - (dist / maxDist));
        handleInteraction(intensityValue);
      }, { passive: false });

      display.addEventListener('touchend', function() {
        targetIntensity = 0;
        isInteracting = false;
      });

      // Mood buttons
      moodBtns.forEach(btn => {
        btn.addEventListener('click', function() {
          setMood(this.dataset.mood);
        });
      });

      if (resetBtn) {
        resetBtn.addEventListener('click', function(e) {
          e.preventDefault();
          resetMood();
        });
      }

      // Keyboard shortcuts
      document.addEventListener('keydown', function(e) {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

        const key = e.key;
        if (key === 'r' || key === 'R') {
          e.preventDefault();
          resetMood();
        }
      });

      // Resize
      window.addEventListener('resize', resizeCanvas);

      // Initialize
      resizeCanvas();
      generateParticles();
      
      // Set initial lamp position
      const rect = display.getBoundingClientRect();
      moodLamp.style.left = (rect.width / 2 - 60) + 'px';
      moodLamp.style.top = (rect.height / 2 - 80) + 'px';
      
      animate();
      
      console.log('💡 Mood Lamp ready · shortcuts: [R] Reset');
    })();
  </script>
</body>
</html>
