<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Obsidian Mirror · smooth black mirror reflects with distortion</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <div class="obsidian-container">
      <div class="obsidian-display" id="obsidianDisplay">
        <!-- Canvas for obsidian mirror -->
        <canvas id="obsidianCanvas"></canvas>
        
        <!-- Obsidian Info -->
        <div class="obsidian-info">
          <span class="info-label">🪞 Reflections</span>
          <span class="info-value" id="reflectionCount">0</span>
        </div>

        <!-- Obsidian Controls -->
        <div class="obsidian-controls">
          <div class="control-group">
            <label class="control-label">🌀 Distortion</label>
            <input type="range" class="control-slider" id="distortionSlider" min="0" max="100" value="50">
            <span class="control-value" id="distortionValue">50%</span>
          </div>
          <div class="control-group">
            <label class="control-label">💫 Shimmer</label>
            <input type="range" class="control-slider" id="shimmerSlider" min="0" max="100" value="50">
            <span class="control-value" id="shimmerValue">50%</span>
          </div>
        </div>

        <!-- Obsidian Text -->
        <div class="obsidian-text">
          <span class="text-label">🪞 Obsidian Mirror</span>
          <span class="text-message" id="obsidianMessage">Smooth black mirror with distorted reflections</span>
        </div>
      </div>
      
      <div class="obsidian-status">
        <span id="obsidianStatus">🪞 Obsidian mirror reflecting with distortion</span>
      </div>
    </div>

    <div class="controls">
      <button class="btn btn-reset" id="resetBtn">⟳ Reset</button>
    </div>
    <div class="footer-note">
      <span>🪞 obsidian mirror · distortion · shimmer effects</span>
    </div>
  </div>

  <script>
    (function() {
      "use strict";

      // DOM refs
      const canvas = document.getElementById('obsidianCanvas');
      const ctx = canvas.getContext('2d');
      const display = document.getElementById('obsidianDisplay');
      const reflectionCount = document.getElementById('reflectionCount');
      const obsidianStatus = document.getElementById('obsidianStatus');
      const obsidianMessage = document.getElementById('obsidianMessage');
      const resetBtn = document.getElementById('resetBtn');
      const distortionSlider = document.getElementById('distortionSlider');
      const distortionValue = document.getElementById('distortionValue');
      const shimmerSlider = document.getElementById('shimmerSlider');
      const shimmerValue = document.getElementById('shimmerValue');

      // State
      let reflections = [];
      let particles = [];
      let animationId = null;
      let time = 0;
      let mouseX = 0;
      let mouseY = 0;
      let totalReflections = 0;

      // Reflection particle class
      class ReflectionParticle {
        constructor(x, y) {
          this.x = x || Math.random() * canvas.width;
          this.y = y || Math.random() * canvas.height;
          this.size = 1 + Math.random() * 4;
          this.speed = 0.1 + Math.random() * 0.3;
          this.angle = Math.random() * Math.PI * 2;
          this.phase = Math.random() * Math.PI * 2;
          this.life = 0.5 + Math.random() * 0.5;
          this.maxLife = this.life;
          this.opacity = 0.1 + Math.random() * 0.3;
          this.type = Math.random() > 0.5 ? 'sparkle' : 'shimmer';
          this.twinkleSpeed = 0.02 + Math.random() * 0.03;
          this.twinklePhase = Math.random() * Math.PI * 2;
        }

        update(distortion, shimmer) {
          const distFactor = distortion / 100;
          const shimmerFactor = shimmer / 100;
          
          this.phase += 0.02 * (0.5 + distFactor * 0.5);
          this.twinklePhase += this.twinkleSpeed * (0.5 + shimmerFactor * 0.5);
          
          const wobble = Math.sin(this.phase) * distFactor * 0.5;
          this.x += Math.cos(this.angle + wobble) * this.speed * 0.1;
          this.y += Math.sin(this.angle + wobble) * this.speed * 0.1;
          
          this.life -= 0.001 * (0.5 + distFactor * 0.5);
          
          if (this.x < -20) this.x = canvas.width + 20;
          if (this.x > canvas.width + 20) this.x = -20;
          if (this.y < -20) this.y = canvas.height + 20;
          if (this.y > canvas.height + 20) this.y = -20;
          
          return this.life > 0;
        }

        draw(ctx) {
          const alpha = (this.life / this.maxLife) * this.opacity * (0.5 + Math.sin(this.twinklePhase) * 0.2 + 0.3);
          const size = this.size * (0.5 + (this.life / this.maxLife) * 0.5);
          
          ctx.save();
          ctx.globalAlpha = alpha;
          
          if (this.type === 'sparkle') {
            // Sparkle
            ctx.fillStyle = 'rgba(200, 210, 230, 0.6)';
            ctx.shadowColor = 'rgba(200, 210, 230, 0.2)';
            ctx.shadowBlur = 10;
            
            const points = 4;
            ctx.beginPath();
            for (let i = 0; i < points * 2; i++) {
              const radius = i % 2 === 0 ? size : size * 0.3;
              const angle = (i / (points * 2)) * Math.PI * 2 + this.twinklePhase;
              const px = Math.cos(angle) * radius;
              const py = Math.sin(angle) * radius;
              if (i === 0) ctx.moveTo(px, py);
              else ctx.lineTo(px, py);
            }
            ctx.closePath();
            ctx.fill();
          } else {
            // Shimmer
            ctx.fillStyle = 'rgba(180, 190, 210, 0.3)';
            ctx.shadowColor = 'rgba(180, 190, 210, 0.1)';
            ctx.shadowBlur = 5;
            
            ctx.beginPath();
            ctx.arc(this.x, this.y, size * (0.5 + Math.sin(this.twinklePhase) * 0.2 + 0.3), 0, Math.PI * 2);
            ctx.fill();
          }
          
          ctx.restore();
        }
      }

      // Draw obsidian mirror
      function drawObsidian(distortion, shimmer) {
        const w = canvas.width;
        const h = canvas.height;
        const cx = w / 2;
        const cy = h / 2;
        const radius = Math.min(w, h) * 0.3;
        const distFactor = distortion / 100;
        const shimmerFactor = shimmer / 100;

        // Background
        drawBackground();

        // Mirror glow
        const glowGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, radius * 1.5);
        glowGrad.addColorStop(0, 'rgba(30, 35, 50, 0.1)');
        glowGrad.addColorStop(0.5, 'rgba(20, 25, 40, 0.05)');
        glowGrad.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = glowGrad;
        ctx.globalAlpha = 0.5 + shimmerFactor * 0.5;
        ctx.beginPath();
        ctx.arc(cx, cy, radius * 1.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;

        // Mirror surface
        ctx.save();
        ctx.shadowColor = 'rgba(0,0,0,0.3)';
        ctx.shadowBlur = 20;
        ctx.shadowOffsetX = 0;
        ctx.shadowOffsetY = 0;

        // Distorted mirror shape
        ctx.beginPath();
        const segments = 60;
        for (let i = 0; i <= segments; i++) {
          const angle = (i / segments) * Math.PI * 2;
          const wobble = Math.sin(angle * 3 + time * 0.2) * distFactor * 3;
          const wobble2 = Math.cos(angle * 2 + time * 0.3) * distFactor * 2;
          const r = radius + wobble + wobble2;
          const x = cx + Math.cos(angle) * r;
          const y = cy + Math.sin(angle) * r;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();

        // Mirror gradient
        const grad = ctx.createRadialGradient(cx - radius * 0.2, cy - radius * 0.2, 0, cx, cy, radius);
        grad.addColorStop(0, '#2a2a3a');
        grad.addColorStop(0.3, '#1a1a2a');
        grad.addColorStop(0.6, '#0a0a1a');
        grad.addColorStop(0.8, '#050510');
        grad.addColorStop(1, '#000000');
        ctx.fillStyle = grad;
        ctx.shadowBlur = 10;
        ctx.fill();

        // Mirror shine/reflection
        ctx.shadowBlur = 0;
        
        // Light reflections on mirror surface
        const reflectionCount2 = 5 + Math.floor(shimmerFactor * 10);
        for (let i = 0; i < reflectionCount2; i++) {
          const angle = (i / reflectionCount2) * Math.PI * 2 + time * 0.01;
          const dist = radius * (0.2 + Math.random() * 0.6);
          const x = cx + Math.cos(angle) * dist;
          const y = cy + Math.sin(angle) * dist;
          const size = 2 + Math.random() * 6 * shimmerFactor;
          
          ctx.save();
          ctx.globalAlpha = 0.05 + Math.random() * 0.05 * shimmerFactor;
          ctx.fillStyle = 'rgba(200, 210, 230, 0.2)';
          ctx.shadowColor = 'rgba(200, 210, 230, 0.05)';
          ctx.shadowBlur = 10;
          ctx.beginPath();
          ctx.arc(x, y, size, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        // Distorted reflection lines
        for (let i = 0; i < 3 + Math.floor(distFactor * 5); i++) {
          const angle = (i / (3 + Math.floor(distFactor * 5))) * Math.PI * 2 + time * 0.02;
          const dist = radius * (0.3 + Math.random() * 0.4);
          const x = cx + Math.cos(angle) * dist;
          const y = cy + Math.sin(angle) * dist;
          const length = 5 + Math.random() * 15 * (0.5 + distFactor * 0.5);
          const rot = angle + Math.sin(time + i) * distFactor;
          
          ctx.save();
          ctx.globalAlpha = 0.05 + distFactor * 0.05;
          ctx.translate(x, y);
          ctx.rotate(rot);
          ctx.strokeStyle = 'rgba(200, 210, 230, 0.1)';
          ctx.lineWidth = 0.5 + distFactor;
          ctx.shadowColor = 'rgba(200, 210, 230, 0.05)';
          ctx.shadowBlur = 5;
          ctx.beginPath();
          ctx.moveTo(-length, 0);
          ctx.lineTo(length, 0);
          ctx.stroke();
          ctx.restore();
        }

        ctx.restore();

        // Mirror edge glow
        ctx.save();
        ctx.shadowColor = 'rgba(150, 160, 200, 0.1)';
        ctx.shadowBlur = 15;
        ctx.strokeStyle = 'rgba(100, 110, 140, 0.1)';
        ctx.lineWidth = 1 + distFactor * 2;
        ctx.beginPath();
        for (let i = 0; i <= segments; i++) {
          const angle = (i / segments) * Math.PI * 2;
          const wobble = Math.sin(angle * 3 + time * 0.2) * distFactor * 3;
          const wobble2 = Math.cos(angle * 2 + time * 0.3) * distFactor * 2;
          const r = radius + wobble + wobble2;
          const x = cx + Math.cos(angle) * r;
          const y = cy + Math.sin(angle) * r;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.stroke();
        ctx.restore();

        // Update reflection count
        totalReflections = reflections.length + particles.length;
        reflectionCount.textContent = totalReflections;

        // Update status
        if (distortion > 70) {
          obsidianStatus.textContent = '🪞 Mirror rippling with distortion! ✨';
          obsidianStatus.style.color = '#fbbf24';
        } else if (distortion > 30) {
          obsidianStatus.textContent = '🪞 Obsidian mirror reflecting with distortion';
          obsidianStatus.style.color = '#818cf8';
        } else {
          obsidianStatus.textContent = '🪞 Smooth obsidian mirror reflecting';
          obsidianStatus.style.color = '#94a3b8';
        }

        // Update message
        if (shimmer > 70) {
          obsidianMessage.textContent = '✨ Mirror shimmering with light!';
          obsidianMessage.style.color = '#fbbf24';
        } else if (shimmer > 30) {
          obsidianMessage.textContent = '🪞 Distorted reflections in obsidian';
          obsidianMessage.style.color = '#818cf8';
        } else {
          obsidianMessage.textContent = 'Smooth black mirror with distorted reflections';
          obsidianMessage.style.color = '#94a3b8';
        }
      }

      // Draw background
      function drawBackground() {
        const w = canvas.width;
        const h = canvas.height;
        
        const grad = ctx.createRadialGradient(w/2, h/2, 0, w/2, h/2, w * 0.7);
        grad.addColorStop(0, 'rgba(10, 15, 25, 0.3)');
        grad.addColorStop(0.5, 'rgba(15, 20, 30, 0.4)');
        grad.addColorStop(1, 'rgba(5, 10, 20, 0.6)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, w, h);
      }

      // Generate particles
      function generateParticles() {
        particles = [];
        for (let i = 0; i < 30; i++) {
          particles.push(new ReflectionParticle());
        }
      }

      // Resize canvas
      function resizeCanvas() {
        const rect = display.getBoundingClientRect();
        canvas.width = rect.width;
        canvas.height = rect.height;
        canvas.style.width = rect.width + 'px';
        canvas.style.height = rect.height + 'px';
        generateParticles();
      }

      // Animation loop
      function animate() {
        const distortion = parseInt(distortionSlider.value);
        const shimmer = parseInt(shimmerSlider.value);
        time += 0.02;

        // Update particles
        particles = particles.filter(p => {
          const alive = p.update(distortion, shimmer);
          if (alive) p.draw(ctx);
          return alive;
        });

        // Maintain particle count
        while (particles.length < 20 + shimmer * 0.2) {
          particles.push(new ReflectionParticle());
        }

        // Draw obsidian mirror
        drawObsidian(distortion, shimmer);

        animationId = requestAnimationFrame(animate);
      }

      // Reset
      function resetObsidian() {
        distortionSlider.value = 50;
        distortionValue.textContent = '50%';
        shimmerSlider.value = 50;
        shimmerValue.textContent = '50%';
        particles = [];
        generateParticles();
        obsidianStatus.textContent = '🔄 Reset complete';
        obsidianStatus.style.color = '#94a3b8';
        obsidianMessage.textContent = 'Smooth black mirror with distorted reflections';
        obsidianMessage.style.color = '#94a3b8';
        setTimeout(() => {
          obsidianStatus.textContent = '🪞 Obsidian mirror reflecting with distortion';
          obsidianStatus.style.color = '#94a3b8';
        }, 1000);
      }

      // Event listeners
      distortionSlider.addEventListener('input', function() {
        distortionValue.textContent = this.value + '%';
      });

      shimmerSlider.addEventListener('input', function() {
        shimmerValue.textContent = this.value + '%';
      });

      if (resetBtn) {
        resetBtn.addEventListener('click', function(e) {
          e.preventDefault();
          resetObsidian();
        });
      }

      // Keyboard shortcuts
      document.addEventListener('keydown', function(e) {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

        const key = e.key;
        if (key === 'r' || key === 'R') {
          e.preventDefault();
          resetObsidian();
        }
      });

      // Resize
      window.addEventListener('resize', resizeCanvas);

      // Initialize
      resizeCanvas();
      animate();
      
      console.log('🪞 Obsidian Mirror ready · shortcuts: [R] Reset');
    })();
  </script>
</body>
</html>
