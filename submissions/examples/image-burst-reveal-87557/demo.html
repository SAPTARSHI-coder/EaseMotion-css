<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Burst Reveal #87557 Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="showcase-wrapper">
    <div class="burst-stage">
      <div class="burst-container scattered" id="burstTarget">
        <div class="burst-tile tile-1"></div>
        <div class="burst-tile tile-2"></div>
        <div class="burst-tile tile-3"></div>
        <div class="burst-tile tile-4"></div>
        <div class="burst-tile tile-5"></div>
        <div class="burst-tile tile-6"></div>
        <div class="burst-tile tile-7"></div>
        <div class="burst-tile tile-8"></div>
        <div class="burst-tile tile-9"></div>
      </div>
    </div>

    <div class="controls-bar">
      <span class="status-label" id="statusLabel">State: Scattered Tiles</span>
      <button class="btn-action" id="assembleBtn">Assemble Image</button>
    </div>
  </div>

  <script>
    const burstTarget = document.getElementById('burstTarget');
    const actionBtn = document.getElementById('assembleBtn');
    const statusLabel = document.getElementById('statusLabel');

    function toggleAssembly() {
      const isScattered = burstTarget.classList.toggle('scattered');
      if (isScattered) {
        actionBtn.textContent = 'Assemble Image';
        statusLabel.textContent = 'State: Scattered Tiles';
      } else {
        actionBtn.textContent = 'Scatter Tiles';
        statusLabel.textContent = 'State: Fully Assembled';
      }
    }

    actionBtn.addEventListener('click', toggleAssembly);
    burstTarget.addEventListener('click', toggleAssembly);
  </script>
</body>
</html>
