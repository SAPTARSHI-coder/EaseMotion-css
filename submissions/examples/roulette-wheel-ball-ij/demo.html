<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-roulette-wheel-ball demo</title>
</head>
<body>
<div class="rw-app">
  <span class="rw-title">ROULETTE</span>
  <div class="rw-wheel">
    <span class="rw-pocket rw-pocket-1"></span>
    <span class="rw-pocket rw-pocket-2"></span>
    <span class="rw-pocket rw-pocket-3"></span>
    <span class="rw-pocket rw-pocket-4"></span>
    <span class="rw-pocket rw-pocket-5"></span>
    <span class="rw-pocket rw-pocket-6"></span>
    <span class="rw-pocket rw-pocket-7"></span>
    <span class="rw-pocket rw-pocket-8"></span>
    <span class="rw-hub"></span>
    <span class="rw-ball"></span>
  </div>
  <div class="rw-grid">
    <span class="rw-cell rw-cell-1">5</span>
    <span class="rw-cell rw-cell-2">24</span>
    <span class="rw-cell rw-cell-3">11</span>
    <span class="rw-cell rw-cell-4">32</span>
    <span class="rw-cell rw-cell-5">0</span>
    <span class="rw-cell rw-cell-6">17</span>
  </div>
</div>
</body>
</html>
