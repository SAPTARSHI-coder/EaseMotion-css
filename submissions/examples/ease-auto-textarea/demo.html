<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ease Auto Textarea Demo - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      min-height: 100vh;
      margin: 0;
      padding: 2rem 1rem;
      box-sizing: border-box;
    }

    .demo-header {
      max-width: 600px;
      margin: 0 auto 1.5rem auto;
      text-align: center;
    }

    .demo-title {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      color: #f8fafc;
    }

    .helper-text {
      color: #94a3b8;
      font-size: 0.95rem;
      line-height: 1.5;
      margin: 0;
    }
  </style>
</head>
<body>

  <div class="demo-header">
    <h1 class="demo-title">Ease Auto Textarea</h1>
    <p class="helper-text">Type a multi-line message to watch the textarea expand without any JavaScript.</p>
  </div>

  <div class="ease-chat-wrapper">
    <textarea class="ease-auto-textarea" placeholder="Message EaseMotion..."></textarea>
    <button class="ease-send-btn" type="button">↑</button>
  </div>

</body>
</html>
