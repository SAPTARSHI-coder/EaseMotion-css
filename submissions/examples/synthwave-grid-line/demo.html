<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>Synthwave Grid Line Modal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="demo">
    <button
      class="modal-trigger"
      type="button"
      onclick="document.getElementById('synthwave-modal').showModal()"
    >
      Open Synthwave Modal
    </button>
  </main>

  <dialog id="synthwave-modal" class="synthwave-modal" aria-labelledby="modal-title">

    <div class="grid-lines" aria-hidden="true"></div>

    <div class="modal-content">
      <button
        class="modal-close"
        type="button"
        aria-label="Close modal"
        onclick="this.closest('dialog').close()"
      >
        ×
      </button>

      <p class="modal-label">SYSTEM MESSAGE</p>

      <h1 id="modal-title">Synthwave Interface</h1>

      <p class="modal-description">
        A futuristic modal inspired by retro synthwave grids,
        neon horizons, and smooth animated transitions.
      </p>

      <div class="modal-actions">
        <button
          class="action-button secondary"
          type="button"
          onclick="this.closest('dialog').close()"
        >
          Cancel
        </button>

        <button
          class="action-button primary"
          type="button"
          onclick="this.closest('dialog').close()"
        >
          Continue
        </button>
      </div>
    </div>

  </dialog>

</body>
</html>
