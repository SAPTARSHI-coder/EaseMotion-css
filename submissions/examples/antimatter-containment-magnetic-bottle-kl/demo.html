<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antimatter Containment Magnetic Bottle - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030712; color: #ffffff;">

    <div class="ease-card ease-card-glass antimatter-container">
        <div class="antimatter-header">
            <h2>Magnetic Bottle</h2>
            <span class="ease-badge ease-badge-danger">Isolated</span>
        </div>
        
        <div class="antimatter-screen ease-center">
            <div class="magnetic-flux flux-1"></div>
            <div class="magnetic-flux flux-2"></div>
            <div class="penning-trap-ring"></div>
            <div class="positron-core ease-center"></div>
        </div>

        <div class="antimatter-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Field: 15.4 Tesla</span>
            <button class="ease-btn ease-btn-primary ease-btn-sm ease-hover-grow">Purge Chamber</button>
        </div>
    </div>

</body>
</html>
