<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Interactive responsive tab bar with dark mode styling"
  >
  <title>Interactive Dark Mode Tab Bar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section class="showcase">
      <div class="ambient ambient-one" aria-hidden="true"></div>
      <div class="ambient ambient-two" aria-hidden="true"></div>

      <div class="content">
        <span class="eyebrow">EASEMOTION CSS</span>

        <h1>Interactive Tab Bar</h1>

        <p class="intro">
          A responsive dark-mode tab interface with smooth hover effects,
          active indicators, and keyboard-friendly focus states.
        </p>

        <div class="tab-shell">
          <div class="tabs" role="tablist" aria-label="Dashboard sections">
            <button
              class="tab active"
              type="button"
              role="tab"
              aria-selected="true"
              tabindex="0"
            >
              <span class="tab-icon" aria-hidden="true">⌂</span>
              <span>Overview</span>
            </button>

            <button
              class="tab"
              type="button"
              role="tab"
              aria-selected="false"
              tabindex="-1"
            >
              <span class="tab-icon" aria-hidden="true">◈</span>
              <span>Analytics</span>
            </button>

            <button
              class="tab"
              type="button"
              role="tab"
              aria-selected="false"
              tabindex="-1"
            >
              <span class="tab-icon" aria-hidden="true">✦</span>
              <span>Projects</span>
            </button>

            <button
              class="tab"
              type="button"
              role="tab"
              aria-selected="false"
              tabindex="-1"
            >
              <span class="tab-icon" aria-hidden="true">⚙</span>
              <span>Settings</span>
            </button>
          </div>
        </div>

        <div class="preview-card">
          <div class="preview-top">
            <div>
              <span class="preview-label">CURRENT SECTION</span>
              <h2>Overview</h2>
            </div>

            <span class="status">
              <span class="status-dot" aria-hidden="true"></span>
              Active
            </span>
          </div>

          <div class="stats">
            <article class="stat">
              <span class="stat-label">Visitors</span>
              <strong>24.8K</strong>
              <small>+12.4%</small>
            </article>

            <article class="stat">
              <span class="stat-label">Engagement</span>
              <strong>78.6%</strong>
              <small>+8.2%</small>
            </article>

            <article class="stat">
              <span class="stat-label">Sessions</span>
              <strong>9.4K</strong>
              <small>+5.7%</small>
            </article>
          </div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
