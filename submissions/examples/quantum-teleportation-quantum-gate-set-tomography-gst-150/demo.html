<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Gate Set Tomography GST - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css"></head><body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030712; color: #ffffff;">

    <div class="ease-card ease-card-glass gst-container">
        <div class="gst-header">
            <h2>Gate Set Tomography (GST)</h2>
            <span class="ease-badge ease-badge-success">Quantum Characterization</span>
        </div>
        
        <div class="gst-screen ease-center">
            <div class="gst-flux flux-gst-a"></div>
            <div class="gst-flux flux-gst-b"></div>
            <div class="gst-boundary-ring"></div>
            <div class="gst-core ease-center"></div>
        </div>

        <div class="gst-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Self-Consistent Error Tracking &amp; Tomography</span>
            <button class="ease-btn ease-btn-success ease-btn-sm ease-hover-grow">Run GST Analysis</button>
        </div>
    </div></body></html>
