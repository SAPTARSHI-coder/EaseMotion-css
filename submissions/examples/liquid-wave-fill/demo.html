<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Liquid Wave Fill Glass Effect</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="demo-container">

    <article class="liquid-card">

      <!-- Animated liquid layers -->
      <div class="liquid-wave liquid-wave-one" aria-hidden="true"></div>
      <div class="liquid-wave liquid-wave-two" aria-hidden="true"></div>
      <div class="liquid-wave liquid-wave-three" aria-hidden="true"></div>

      <!-- Glass highlight -->
      <div class="glass-highlight" aria-hidden="true"></div>

      <!-- Content -->
      <div class="liquid-content">

        <span class="liquid-badge">
          LIQUID UI
        </span>

        <h1>Liquid Wave</h1>

        <p>
          A modern glassmorphism component featuring
          smooth animated liquid waves created entirely
          with HTML and CSS.
        </p>

        <div class="liquid-status">
          <span class="status-dot"></span>
          <span>Fluid animation active</span>
        </div>

        <div class="liquid-progress" aria-label="Liquid progress">
          <span></span>
        </div>

        <button class="liquid-button" type="button">
          Explore
          <span aria-hidden="true">→</span>
        </button>

      </div>

    </article>

  </main>

</body>
</html>
