<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Liquid Wave Fill 3D CSS animation">
  <title>Liquid Wave Fill - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="demo">
    <section class="scene" aria-label="Liquid wave fill 3D animation">
      <div class="cube" aria-hidden="true">
        <div class="face front">
          <div class="wave"></div>
        </div>
        <div class="face back">
          <div class="wave"></div>
        </div>
        <div class="face right">
          <div class="wave"></div>
        </div>
        <div class="face left">
          <div class="wave"></div>
        </div>
        <div class="face top">
          <div class="wave"></div>
        </div>
        <div class="face bottom">
          <div class="wave"></div>
        </div>
      </div>
    </section>

    <h1>Liquid Wave Fill</h1>
    <p>Pure CSS 3D liquid wave animation</p>
  </main>
</body>
</html>
