<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Pure CSS origami fold text animation."
  >
  <title>CSS Origami Fold Text</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section class="origami-demo" aria-labelledby="origami-title">
      <p class="eyebrow">EaseMotion CSS</p>

      <h1 id="origami-title" class="origami-text" aria-label="ORIGAMI">
        <span aria-hidden="true">O</span>
        <span aria-hidden="true">R</span>
        <span aria-hidden="true">I</span>
        <span aria-hidden="true">G</span>
        <span aria-hidden="true">A</span>
        <span aria-hidden="true">M</span>
        <span aria-hidden="true">I</span>
      </h1>

      <p class="description">
        Letters fold flat like paper and unfold into their final form
        using pure CSS 3D transforms.
      </p>

      <p class="hint">Pure CSS • 3D transforms • No JavaScript</p>
    </section>
  </main>
</body>
</html>
