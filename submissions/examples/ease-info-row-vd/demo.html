<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ease Info Row</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="info-list">

    <div class="info-row">
        <div class="info-icon">✓</div>

        <div class="info-content">
            <strong>Secure Authentication</strong>
            <span>Your account is protected with secure login.</span>
        </div>
    </div>

    <div class="info-row">
        <div class="info-icon">⚙</div>

        <div class="info-content">
            <strong>Easy Configuration</strong>
            <span>Customize your settings to match your workflow.</span>
        </div>
    </div>

    <div class="info-row">
        <div class="info-icon">i</div>

        <div class="info-content">
            <strong>Helpful Information</strong>
            <span>Find useful details and guidance whenever needed.</span>
        </div>
    </div>

</div>

</body>
</html>
