<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alchemy Circle · glowing alchemy circle spins</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <div class="alchemy-container">
      <div class="alchemy-display" id="alchemyDisplay">
        <!-- Alchemy Circle SVG -->
        <svg class="alchemy-svg" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
          <!-- Outer Ring -->
          <circle class="ring outer-ring" cx="200" cy="200" r="170" fill="none" stroke="#6366f1" stroke-width="2"/>
          
          <!-- Inner Ring -->
          <circle class="ring inner-ring" cx="200" cy="200" r="130" fill="none" stroke="#818cf8" stroke-width="2"/>
          
          <!-- Center Ring -->
          <circle class="ring center-ring" cx="200" cy="200" r="40" fill="none" stroke="#a78bfa" stroke-width="2"/>
          
          <!-- Runes (Elder Futhark inspired) -->
          <text class="rune r1" x="200" y="45" text-anchor="middle">ᚠ</text>
          <text class="rune r2" x="340" y="100" text-anchor="middle">ᚢ</text>
          <text class="rune r3" x="370" y="220" text-anchor="middle">ᚦ</text>
          <text class="rune r4" x="340" y="340" text-anchor="middle">ᚨ</text>
          <text class="rune r5" x="200" y="375" text-anchor="middle">ᚱ</text>
          <text class="rune r6" x="60" y="340" text-anchor="middle">ᚲ</text>
          <text class="rune r7" x="30" y="220" text-anchor="middle">ᚷ</text>
          <text class="rune r8" x="60" y="100" text-anchor="middle">ᚹ</text>
          
          <!-- Inner Runes -->
          <text class="rune inner-rune i1" x="200" y="80" text-anchor="middle">ᚺ</text>
          <text class="rune inner-rune i2" x="290" y="140" text-anchor="middle">ᚾ</text>
          <text class="rune inner-rune i3" x="290" y="280" text-anchor="middle">ᛁ</text>
          <text class="rune inner-rune i4" x="200" y="340" text-anchor="middle">ᛃ</text>
          <text class="rune inner-rune i5" x="110" y="280" text-anchor="middle">ᛈ</text>
          <text class="rune inner-rune i6" x="110" y="140" text-anchor="middle">ᛇ</text>
          
          <!-- Element Symbols -->
          <text class="element-symbol" x="200" y="155" text-anchor="middle">🜁</text>
          <text class="element-symbol" x="245" y="200" text-anchor="middle">🜂</text>
          <text class="element-symbol" x="200" y="245" text-anchor="middle">🜄</text>
          <text class="element-symbol" x="155" y="200" text-anchor="middle">🜃</text>
          
          <!-- Glow Filter -->
          <filter id="glow">
            <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
            <feMerge>
              <feMergeNode in="coloredBlur"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>
          
          <!-- Glow elements -->
          <circle class="glow-ring" cx="200" cy="200" r="170" fill="none" stroke="#a78bfa" stroke-width="4" opacity="0" filter="url(#glow)"/>
          <circle class="glow-ring" cx="200" cy="200" r="130" fill="none" stroke="#c4b5fd" stroke-width="3" opacity="0" filter="url(#glow)"/>
          <circle class="glow-ring" cx="200" cy="200" r="40" fill="none" stroke="#fbbf24" stroke-width="3" opacity="0" filter="url(#glow)"/>
        </svg>

        <!-- Alchemy Particles -->
        <div class="alchemy-particles" id="alchemyParticles"></div>

        <!-- Center Glow -->
        <div class="center-glow" id="centerGlow"></div>

        <!-- Alchemy Counter -->
        <div class="alchemy-counter">
          <span class="counter-label">⚗️ Circles</span>
          <span class="counter-value" id="alchemyCount">0</span>
        </div>
      </div>
      
      <div class="alchemy-status">
        <span id="alchemyStatus">⚗️ Click to activate the alchemy circle</span>
      </div>
    </div>

    <div class="controls">
      <button class="btn btn-activate" id="activateBtn">⚗️ Activate Circle</button>
      <button class="btn btn-mode" id="modeBtn">🌀 Toggle Speed</button>
      <button class="btn btn-reset" id="resetBtn">⟳ Reset</button>
    </div>
    <div class="footer-note">
      <span>⚗️ alchemy circle · spinning runes · glowing symbols</span>
    </div>
  </div>

  <script>
    (function() {
      "use strict";

      // DOM refs
      const alchemyDisplay = document.getElementById('alchemyDisplay');
      const alchemyParticles = document.getElementById('alchemyParticles');
      const centerGlow = document.getElementById('centerGlow');
      const alchemyCount = document.getElementById('alchemyCount');
      const alchemyStatus = document.getElementById('alchemyStatus');
      const activateBtn = document.getElementById('activateBtn');
      const modeBtn = document.getElementById('modeBtn');
      const resetBtn = document.getElementById('resetBtn');

      // State
      let count = 0;
      let isActive = false;
      let speedIndex = 0;
      let animationId = null;

      // Speed modes
      const speeds = [
        { label: 'Slow', duration: 30 },
        { label: 'Normal', duration: 15 },
        { label: 'Fast', duration: 6 },
        { label: 'Hyper', duration: 2 }
      ];

      // Create alchemy particles
      function createAlchemyParticles(count = 40) {
        const colors = ['#818cf8', '#a78bfa', '#c4b5fd', '#fbbf24', '#f472b6', '#34d399', '#60a5fa'];
        
        for (let i = 0; i < count; i++) {
          setTimeout(() => {
            const particle = document.createElement('div');
            particle.className = 'alchemy-particle';
            
            const size = Math.random() * 6 + 2;
            particle.style.width = size + 'px';
            particle.style.height = size + 'px';
            
            const angle = Math.random() * Math.PI * 2;
            const radius = 100 + Math.random() * 150;
            const x = 200 + Math.cos(angle) * radius;
            const y = 200 + Math.sin(angle) * radius;
            particle.style.left = x + 'px';
            particle.style.top = y + 'px';
            
            const color = colors[Math.floor(Math.random() * colors.length)];
            particle.style.backgroundColor = color;
            particle.style.boxShadow = `0 0 ${size * 2}px ${color}66`;
            
            const rotAngle = Math.random() * Math.PI * 2;
            const distance = 20 + Math.random() * 60;
            particle.style.setProperty('--tx', Math.cos(rotAngle) * distance + 'px');
            particle.style.setProperty('--ty', Math.sin(rotAngle) * distance + 'px');
            
            particle.style.animationDuration = (Math.random() * 1 + 0.8) + 's';
            particle.style.animationDelay = (Math.random() * 0.3) + 's';
            
            alchemyParticles.appendChild(particle);
            
            setTimeout(() => {
              particle.remove();
            }, 2000);
          }, i * 20);
        }
      }

      // Activate circle
      function activateCircle() {
        if (isActive) {
          // If already active, add more particles
          createAlchemyParticles(20);
          return;
        }
        
        isActive = true;
        const duration = speeds[speedIndex].duration;
        
        // Add active class to SVG elements
        document.querySelectorAll('.ring').forEach(el => {
          el.classList.add('active');
        });
        document.querySelectorAll('.rune').forEach(el => {
          el.classList.add('active');
        });
        document.querySelectorAll('.inner-rune').forEach(el => {
          el.classList.add('active');
        });
        document.querySelectorAll('.element-symbol').forEach(el => {
          el.classList.add('active');
        });
        document.querySelectorAll('.glow-ring').forEach(el => {
          el.classList.add('active');
        });
        
        // Update center glow
        centerGlow.classList.add('active');
        
        // Set animation duration
        const svg = document.querySelector('.alchemy-svg');
        const rings = document.querySelectorAll('.ring, .rune, .inner-rune, .element-symbol, .glow-ring');
        rings.forEach(el => {
          el.style.animationDuration = duration + 's';
        });
        
        // Create particles
        createAlchemyParticles(40);
        
        // Update count
        count++;
        alchemyCount.textContent = count;
        
        // Update status
        alchemyStatus.textContent = `⚗️ Alchemy circle activated! ✨ (${count})`;
        alchemyStatus.style.color = '#fbbf24';
        activateBtn.textContent = '⚗️ Add Energy';
        activateBtn.style.background = 'linear-gradient(135deg, #fbbf24, #f59e0b)';
        activateBtn.style.borderColor = '#fcd34d';
        
        setTimeout(() => {
          alchemyStatus.textContent = '⚗️ Circle is spinning! Click for more energy';
          alchemyStatus.style.color = '#94a3b8';
        }, 2000);
      }

      // Deactivate circle
      function deactivateCircle() {
        isActive = false;
        
        document.querySelectorAll('.ring, .rune, .inner-rune, .element-symbol, .glow-ring').forEach(el => {
          el.classList.remove('active');
        });
        centerGlow.classList.remove('active');
        alchemyParticles.innerHTML = '';
        
        alchemyStatus.textContent = '⚗️ Circle deactivated';
        alchemyStatus.style.color = '#94a3b8';
        activateBtn.textContent = '⚗️ Activate Circle';
        activateBtn.style.background = 'linear-gradient(135deg, #6366f1, #4f46e5)';
        activateBtn.style.borderColor = '#818cf8';
        
        setTimeout(() => {
          alchemyStatus.textContent = '⚗️ Click to activate the alchemy circle';
        }, 1500);
      }

      // Toggle speed
      function toggleSpeed() {
        speedIndex = (speedIndex + 1) % speeds.length;
        const speed = speeds[speedIndex];
        modeBtn.textContent = `🌀 ${speed.label}`;
        
        if (isActive) {
          const rings = document.querySelectorAll('.ring, .rune, .inner-rune, .element-symbol, .glow-ring');
          rings.forEach(el => {
            el.style.animationDuration = speed.duration + 's';
          });
        }
        
        alchemyStatus.textContent = `🌀 Speed: ${speed.label}`;
        alchemyStatus.style.color = '#a78bfa';
        setTimeout(() => {
          if (!isActive) {
            alchemyStatus.textContent = '⚗️ Click to activate the alchemy circle';
            alchemyStatus.style.color = '#94a3b8';
          }
        }, 1500);
      }

      // Reset
      function resetAlchemy() {
        deactivateCircle();
        count = 0;
        alchemyCount.textContent = '0';
        alchemyParticles.innerHTML = '';
        
        const defaultSpeed = speeds[0];
        speedIndex = 0;
        modeBtn.textContent = `🌀 ${defaultSpeed.label}`;
        
        alchemyStatus.textContent = '🔄 Reset complete';
        alchemyStatus.style.color = '#94a3b8';
        setTimeout(() => {
          alchemyStatus.textContent = '⚗️ Click to activate the alchemy circle';
        }, 1000);
      }

      // Event listeners
      if (activateBtn) {
        activateBtn.addEventListener('click', function(e) {
          e.preventDefault();
          if (isActive) {
            createAlchemyParticles(20);
            alchemyStatus.textContent = '⚗️ Energy added! ✨';
            alchemyStatus.style.color = '#fbbf24';
            setTimeout(() => {
              alchemyStatus.textContent = '⚗️ Circle is spinning!';
              alchemyStatus.style.color = '#94a3b8';
            }, 1000);
          } else {
            activateCircle();
          }
        });
      }

      if (modeBtn) {
        modeBtn.addEventListener('click', function(e) {
          e.preventDefault();
          toggleSpeed();
        });
      }

      if (resetBtn) {
        resetBtn.addEventListener('click', function(e) {
          e.preventDefault();
          resetAlchemy();
        });
      }

      // Click on display to activate
      alchemyDisplay.addEventListener('click', function(e) {
        if (e.target === this || e.target.closest('.alchemy-svg')) {
          if (isActive) {
            createAlchemyParticles(15);
          } else {
            activateCircle();
          }
        }
      });

      // Keyboard shortcuts
      document.addEventListener('keydown', function(e) {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

        const key = e.key;
        if (key === ' ' || key === 'Space') {
          e.preventDefault();
          if (isActive) {
            createAlchemyParticles(15);
          } else {
            activateCircle();
          }
        } else if (key === 'a' || key === 'A') {
          e.preventDefault();
          activateCircle();
        } else if (key === 's' || key === 'S') {
          e.preventDefault();
          toggleSpeed();
        } else if (key === 'r' || key === 'R') {
          e.preventDefault();
          resetAlchemy();
        }
      });

      // Initialize
      console.log('⚗️ Alchemy Circle ready · shortcuts: [Space/A] Activate, [S] Speed, [R] Reset');
    })();
  </script>
</body>
</html>
