<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Contact Section Demo</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/gh/JAY4IGNITE/EaseMotion-css@main/easemotion.min.css">

<link rel="stylesheet"
href="style.css">

</head>

<body>

<section class="contact">

<h1 class="ease-fade-in">
Contact Us
</h1>

<div class="container">

<div class="info ease-slide-up">

<h2>Get In Touch</h2>

<p>
📍 123 Main Street, New York
</p>

<p>
📞 +1 234 567 890
</p>

<p>
✉ contact@example.com
</p>

<p>
We'd love to hear from you. Send us a message and we'll respond as soon as possible.
</p>

</div>

<div class="form-card ease-slide-up">

<form>

<input
type="text"
placeholder="Full Name"
required>

<input
type="email"
placeholder="Email Address"
required>

<input
type="text"
placeholder="Subject"
required>

<textarea
rows="6"
placeholder="Your Message"
required></textarea>

<button
class="ease-hover-grow"
type="submit">

Send Message

</button>

</form>

</div>

</div>

</section>

</body>
</html>
