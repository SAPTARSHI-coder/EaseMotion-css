<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-compass-needle-turn demo</title>
</head>
<body>
<div class="cp-app">
  <div class="cp-head">
    <span class="cp-name">NAUTICUS</span>
    <span class="cp-badge">MAGNETIC</span>
  </div>
  <div class="cp-stage">
    <div class="cp-face">
      <div class="cp-rim"></div>
      <span class="cp-tick cp-north">N</span>
      <span class="cp-tick cp-east">E</span>
      <span class="cp-tick cp-south">S</span>
      <span class="cp-tick cp-west">W</span>
      <span class="cp-degree cp-d1">045</span>
      <span class="cp-degree cp-d2">135</span>
      <span class="cp-degree cp-d3">225</span>
      <span class="cp-degree cp-d4">315</span>
      <div class="cp-needle">
        <span class="cp-red"></span>
        <span class="cp-white"></span>
      </div>
      <span class="cp-hub"></span>
    </div>
  </div>
  <div class="cp-readout">
    <span class="cp-label">HEADING</span>
    <span class="cp-value">000 DEG</span>
  </div>
</div>
</body>
</html>
