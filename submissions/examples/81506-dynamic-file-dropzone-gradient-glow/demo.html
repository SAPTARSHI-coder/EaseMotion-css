<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Dynamic File Dropzone with Gradient Glow styling"
  >

  <title>Dynamic Gradient Glow File Dropzone</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="page">
    <section
      class="dropzone"
      aria-labelledby="dropzone-title"
    >
      <div class="glow glow-one" aria-hidden="true"></div>
      <div class="glow glow-two" aria-hidden="true"></div>
      <div class="glow glow-three" aria-hidden="true"></div>

      <div class="dropzone-inner">
        <div class="upload-icon" aria-hidden="true">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path d="M12 16V4"></path>
            <path d="M7 9L12 4L17 9"></path>
            <path d="M5 20H19"></path>
          </svg>
        </div>

        <h1 id="dropzone-title">Drop your files here</h1>

        <p class="description">
          Drag and drop your files into this area or select them
          from your device.
        </p>

        <label
          class="browse-button"
          for="file-input"
        >
          Choose files
        </label>

        <input
          id="file-input"
          class="file-input"
          type="file"
          multiple
          aria-describedby="file-help"
        >

        <p id="file-help" class="file-help">
          PNG, JPG, PDF, ZIP · Maximum 10 MB per file
        </p>
      </div>

      <div class="dropzone-footer">
        <span class="status-indicator" aria-hidden="true"></span>
        <span>Secure upload area</span>
      </div>
    </section>
  </main>
</body>
</html>
