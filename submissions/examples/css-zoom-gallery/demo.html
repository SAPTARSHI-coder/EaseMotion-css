<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Responsive CSS-only image gallery with click-to-zoom animation"
  >
  <title>CSS Zoom Gallery</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="gallery-page">
    <header class="gallery-header">
      <h1>CSS Zoom Gallery</h1>
      <p>Click an image to zoom it in place.</p>
    </header>

    <section class="gallery" aria-label="Image gallery">

      <!-- Image 1 -->
      <div class="gallery-item">
        <input
          type="checkbox"
          id="zoom-1"
          class="zoom-toggle"
        >

        <label for="zoom-1" class="image-card">
          <img
            src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=900&q=80"
            alt="Mountain landscape surrounded by trees"
          >
          <span class="zoom-hint">Click to zoom</span>
        </label>
      </div>

      <!-- Image 2 -->
      <div class="gallery-item">
        <input
          type="checkbox"
          id="zoom-2"
          class="zoom-toggle"
        >

        <label for="zoom-2" class="image-card">
          <img
            src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=900&q=80"
            alt="Blue ocean and beach"
          >
          <span class="zoom-hint">Click to zoom</span>
        </label>
      </div>

      <!-- Image 3 -->
      <div class="gallery-item">
        <input
          type="checkbox"
          id="zoom-3"
          class="zoom-toggle"
        >

        <label for="zoom-3" class="image-card">
          <img
            src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=900&q=80"
            alt="Green forest with sunlight"
          >
          <span class="zoom-hint">Click to zoom</span>
        </label>
      </div>

      <!-- Image 4 -->
      <div class="gallery-item">
        <input
          type="checkbox"
          id="zoom-4"
          class="zoom-toggle"
        >

        <label for="zoom-4" class="image-card">
          <img
            src="https://images.unsplash.com/photo-1511497584788-876760111969?auto=format&fit=crop&w=900&q=80"
            alt="Forest trees under natural light"
          >
          <span class="zoom-hint">Click to zoom</span>
        </label>
      </div>

      <!-- Image 5 -->
      <div class="gallery-item">
        <input
          type="checkbox"
          id="zoom-5"
          class="zoom-toggle"
        >

        <label for="zoom-5" class="image-card">
          <img
            src="https://images.unsplash.com/photo-1469474968028-56623f02e42e?auto=format&fit=crop&w=900&q=80"
            alt="Mountain valley landscape"
          >
          <span class="zoom-hint">Click to zoom</span>
        </label>
      </div>

      <!-- Image 6 -->
      <div class="gallery-item">
        <input
          type="checkbox"
          id="zoom-6"
          class="zoom-toggle"
        >

        <label for="zoom-6" class="image-card">
          <img
            src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=900&q=80"
            alt="Mountain lake landscape"
          >
          <span class="zoom-hint">Click to zoom</span>
        </label>
      </div>

    </section>
  </main>
</body>
</html>
