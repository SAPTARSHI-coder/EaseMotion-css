<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ease-scroll-fade-in-list-sap demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #f4f4f5; }
    .spacer { height: 80vh; display: flex; align-items: center; justify-content: center; color: #94a3b8; }
    .page { display: flex; justify-content: center; padding-bottom: 200px; }
  </style>
</head>
<body>
  <div class="spacer">Scroll down</div>
  <div class="page">
    <div class="fade-list-sap" id="list">
      <div class="fade-item">Order confirmed</div>
      <div class="fade-item">Payment processed</div>
      <div class="fade-item">Package shipped</div>
      <div class="fade-item">Out for delivery</div>
      <div class="fade-item">Delivered</div>
    </div>
  </div>
  <script>
    const items = document.querySelectorAll('.fade-item');
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) entry.target.classList.add('in-view');
      });
    }, { threshold: 0.4 });
    items.forEach((item, i) => {
      item.style.transitionDelay = `${i * 0.08}s`;
      observer.observe(item);
    });
  </script>
</body>
</html>
