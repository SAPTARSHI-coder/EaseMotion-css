<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Pulse Animation Reduced-Motion Audit</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="demo">
      <h1>Pulse Animation Reduced-Motion Audit</h1>
      <button type="button" id="btn">Toggle pulse</button>
      <span id="target" style="display:inline-block;padding:0.5rem 1rem;background:#eef2ff;border-radius:0.5rem">Watch me</span>
      <pre id="report"></pre>
    </main>
    <script type="module">
      import { PulseAudit } from './script.js';
      const a = new PulseAudit(document.getElementById('target'));
      const btn = document.getElementById('btn');
      const reportEl = document.getElementById('report');
      const render = () => { reportEl.textContent = JSON.stringify(a.report(), null, 2); };
      btn.addEventListener('click', () => { a.isPulsing() ? a.stop() : a.start(); render(); });
      a.start(); render();
      window.__pulseAudit = a;
    </script>
  </body>
</html>
