<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Slide-Up Stepper | Glassmorphism UI</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <main class="container">

    <section class="glass-card">

      <h1>Development Journey</h1>

      <p class="subtitle">
        CSS Slide-Up Stepper for Glassmorphism UI Layouts
      </p>


      <div class="stepper">


        <div class="step active">
          <div class="number">01</div>

          <div class="content">
            <h3>Research</h3>
            <p>Analyze requirements and plan the workflow.</p>
          </div>
        </div>


        <div class="line"></div>


        <div class="step active">
          <div class="number">02</div>

          <div class="content">
            <h3>Design</h3>
            <p>Create modern glass UI components.</p>
          </div>
        </div>


        <div class="line"></div>


        <div class="step active">
          <div class="number">03</div>

          <div class="content">
            <h3>Development</h3>
            <p>Implement responsive animated layouts.</p>
          </div>
        </div>


        <div class="line"></div>


        <div class="step">
          <div class="number">04</div>

          <div class="content">
            <h3>Deployment</h3>
            <p>Release the final product successfully.</p>
          </div>
        </div>


      </div>

    </section>

  </main>


</body>

</html>
