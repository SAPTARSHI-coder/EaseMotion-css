
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ion Thruster Engine - EaseMotion CSS</title>
    <!-- Include EaseMotion Core Stylesheet -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030712; color: #ffffff;">

    <div class="ease-card ease-card-glass thruster-container">
        <div class="thruster-header">
            <h2>Ion Thruster</h2>
            <span class="ease-badge ease-badge-success">Firing</span>
        </div>
        
        <div class="thruster-screen ease-center">
            <div class="exhaust-plume"></div>
            <div class="thruster-nozzle ease-center"></div>
        </div>

        <div class="thruster-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Impulse: 5000s</span>
            <button class="ease-btn ease-btn-primary ease-btn-sm ease-hover-grow">Boost</button>
        </div>
    </div>

</body>
</html>
