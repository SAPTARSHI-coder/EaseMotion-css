<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carding Drum Wool — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Carding Drum Wool demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Carding Drum Wool</h1>
      <p class="lede">Textile carding drum teasing wool fibers apart</p>
    </header>

    <section class="ease-carding-drum-wool" data-demo="carding-drum-wool" aria-live="polite">
      <div class="ease-carding-drum-wool__housing">
        <div class="ease-carding-drum-wool__bezel">
          <div class="ease-carding-drum-wool__face">
            <div class="ease-carding-drum-wool__readout">
              <span class="ease-carding-drum-wool__label">Carding Drum Wool</span>
              <span class="ease-carding-drum-wool__value">LIVE</span>
            </div>
            <div class="ease-carding-drum-wool__motion" aria-hidden="true">
              <span class="ease-carding-drum-wool__a"></span>
              <span class="ease-carding-drum-wool__b"></span>
              <span class="ease-carding-drum-wool__c"></span>
              <span class="ease-carding-drum-wool__d"></span>
            </div>
            <div class="ease-carding-drum-wool__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-carding-drum-wool__controls">
          <button type="button" class="ease-carding-drum-wool__btn primary">Engage</button>
          <button type="button" class="ease-carding-drum-wool__btn">Reset</button>
          <label class="ease-carding-drum-wool__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-carding-drum-wool__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
