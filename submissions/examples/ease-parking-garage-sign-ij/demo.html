<!-- EaseMotion component: parking-garage-sign -->
<!DOCTYPE html>
<html lang="en" data-garage="sign">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.6">
<title>Ease Parking Garage Sign</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="garage-sign">
  <header class="garage-head">
    <span class="garage-name">PLAZA PARK</span>
    <span class="garage-level">P1</span>
  </header>
  <div class="garage-display">
    <span class="garage-arrow"></span>
    <span class="garage-count">37</span>
    <span class="garage-label">SPACES</span>
  </div>
  <div class="garage-boom">
    <span class="boom-arm"></span>
    <span class="boom-post"></span>
  </div>
  <footer class="garage-foot">
    <span class="garage-toll">$4/HR</span>
    <span class="garage-open">OPEN 24H</span>
  </footer>
</main>
</body>
</html>
