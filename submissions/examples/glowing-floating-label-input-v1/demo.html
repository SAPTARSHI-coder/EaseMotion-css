<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Glowing Floating Label Input</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="demo">
    <section class="demo-card">

      <h1>Glowing Floating Label Input</h1>

      <p class="demo-description">
        SaaS Modern styled floating label inputs using pure CSS.
      </p>

      <form class="floating-form">

        <div class="floating-field">
          <input
            class="floating-input"
            type="text"
            id="name"
            name="name"
            placeholder=" "
            autocomplete="name"
            required
          >

          <label class="floating-label" for="name">
            Full Name
          </label>
        </div>

        <div class="floating-field">
          <input
            class="floating-input"
            type="email"
            id="email"
            name="email"
            placeholder=" "
            autocomplete="email"
            required
          >

          <label class="floating-label" for="email">
            Email Address
          </label>
        </div>

        <div class="floating-field">
          <input
            class="floating-input"
            type="password"
            id="password"
            name="password"
            placeholder=" "
            autocomplete="new-password"
            required
          >

          <label class="floating-label" for="password">
            Password
          </label>
        </div>

        <button class="submit-button" type="submit">
          Create Account
        </button>

      </form>

    </section>
  </main>

</body>
</html>
