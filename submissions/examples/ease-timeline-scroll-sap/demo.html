<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ease-timeline-scroll-sap demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #f4f4f5; }
    .page { display: flex; justify-content: center; padding: 60px 24px 300px; }
  </style>
</head>
<body>

  <div class="page">
    <div class="timeline-scroll-sap" id="timeline">
      <div class="tl-item">
        <div class="tl-date">Jan 2024</div>
        <div class="tl-title">Project Kickoff</div>
        <div class="tl-desc">Initial planning and requirements gathering completed.</div>
      </div>
      <div class="tl-item">
        <div class="tl-date">Mar 2024</div>
        <div class="tl-title">Design Phase</div>
        <div class="tl-desc">UI/UX mockups finalized and approved by stakeholders.</div>
      </div>
      <div class="tl-item">
        <div class="tl-date">Jun 2024</div>
        <div class="tl-title">Development</div>
        <div class="tl-desc">Core features built and integrated across the stack.</div>
      </div>
      <div class="tl-item">
        <div class="tl-date">Sep 2024</div>
        <div class="tl-title">Launch</div>
        <div class="tl-desc">Product released publicly after final QA passes.</div>
      </div>
    </div>
  </div>

  <script>
    const items = document.querySelectorAll('.tl-item');

    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('in-view');
        }
      });
    }, { threshold: 0.3 });

    items.forEach(item => observer.observe(item));
  </script>

</body>
</html>
