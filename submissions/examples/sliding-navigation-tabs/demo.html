<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sliding Navigation Tabs</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="container">
    <h1>Sliding Navigation Tabs</h1>
    <p class="description">
      A CSS-only navigation tab with a smooth sliding indicator.
    </p>

    <nav class="tabs" aria-label="Main navigation">
      <a href="#home" class="tab active">Home</a>
      <a href="#about" class="tab">About</a>
      <a href="#services" class="tab">Services</a>
      <a href="#contact" class="tab">Contact</a>
    </nav>

    <section class="content">
      <article id="home">
        <h2>Home</h2>
        <p>Welcome to the home section.</p>
      </article>

      <article id="about">
        <h2>About</h2>
        <p>Learn more about this section.</p>
      </article>

      <article id="services">
        <h2>Services</h2>
        <p>Explore the available services.</p>
      </article>

      <article id="contact">
        <h2>Contact</h2>
        <p>Get in touch with us.</p>
      </article>
    </section>
  </main>

</body>
</html>
