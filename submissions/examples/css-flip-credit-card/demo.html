<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Flip Credit Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card-container">
        <div class="credit-card">
            <div class="card-front">
                <div class="chip"></div>
                <div class="number">**** **** **** 1234</div>
                <div class="details">
                    <span>JANE DOE</span>
                    <span>12/26</span>
                </div>
            </div>
            <div class="card-back">
                <div class="mag-stripe"></div>
                <div class="cvc-container">
                    <span class="cvc">123</span>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
