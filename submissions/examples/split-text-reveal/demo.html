<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Split Text Reveal — Tay</title>
<link rel="stylesheet" href="style.css">
<style>
  body {
    min-height: 200vh; /* extra height so you can scroll and re-trigger */
    margin: 0;
    padding: 4rem 2rem;
    background: #0f0f14;
    color: #fff;
    font-family: system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    gap: 6rem;
    align-items: flex-start;
  }
  h1 { font-size: 3rem; margin: 0; }
  h2 { font-size: 1.75rem; margin: 0; color: #a5b4fc; }
</style>
</head>
<body>

  <!-- Characters, revealed from below (default) -->
  <h1 class="split-text-tay" data-split="chars" data-direction="up">
    Split Text Reveal
  </h1>

  <!-- Words, revealed from the left -->
  <h2 class="split-text-tay" data-split="words" data-direction="left">
    Elegant staggered motion for headings and hero sections
  </h2>

  <!-- Characters, revealed from the right, faster stagger -->
  <h1 class="split-text-tay" data-split="chars" data-direction="right"
      style="--split-stagger-tay: 0.02s;">
    Composable. Lightweight. Fast.
  </h1>

  <script>
    // Wraps text content into per-character or per-word spans,
    // assigns the --i index used for stagger delay, and preserves
    // the original text for screen readers via aria-label.
    function splitTextTay(el) {
      const mode = el.dataset.split || "chars";
      const original = el.textContent.trim();

      el.setAttribute("aria-label", original);
      el.textContent = "";

      const units = mode === "words"
        ? original.split(/(\s+)/) // keep spaces as their own tokens
        : original.split("");

      units.forEach((unit, i) => {
        const span = document.createElement("span");
        span.className = "split-unit-tay";
        span.style.setProperty("--i", i);
        span.setAttribute("aria-hidden", "true"); // real text is in aria-label above
        span.textContent = unit === " " ? "\u00A0" : unit;
        el.appendChild(span);
      });
    }

    const targets = document.querySelectorAll(".split-text-tay");
    targets.forEach(splitTextTay);

    // Trigger the animation only once each block scrolls into view
    const observer = new IntersectionObserver(
      (entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            entry.target.classList.add("is-visible-tay");
            observer.unobserve(entry.target);
          }
        });
      },
      { threshold: 0.4 }
    );

    targets.forEach((el) => observer.observe(el));
  </script>

</body>
</html>
