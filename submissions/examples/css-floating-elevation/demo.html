<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Pure CSS 3D floating elevation effect">
  <title>CSS 3D Floating Elevation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="scene">
    <article class="floating-card">
      <div class="card-glow" aria-hidden="true"></div>

      <div class="card-content">
        <span class="badge">PURE CSS 3D</span>
        <h1>Floating Elevation</h1>
        <p>
          A smooth 3D card that gently rises and rotates in space
          using only HTML and vanilla CSS.
        </p>

        <div class="stats" aria-label="Animation features">
          <div>
            <strong>3D</strong>
            <span>Depth</span>
          </div>
          <div>
            <strong>CSS</strong>
            <span>Only</span>
          </div>
          <div>
            <strong>60fps</strong>
            <span>Friendly</span>
          </div>
        </div>
      </div>
    </article>
  </main>
</body>
</html>
