<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-metronome-arm-swing demo</title>
</head>
<body>
<div class="mt-app">
  <span class="mt-title">METRONOME</span>
  <div class="mt-body">
    <div class="mt-scale">
      <span class="mt-num mt-num-1">0</span>
      <span class="mt-num mt-num-2">2</span>
      <span class="mt-num mt-num-3">4</span>
      <span class="mt-num mt-num-4">6</span>
    </div>
    <div class="mt-pendulum">
      <span class="mt-arm"></span>
      <span class="mt-weight"></span>
    </div>
  </div>
  <span class="mt-tick"></span>
</div>
</body>
</html>
