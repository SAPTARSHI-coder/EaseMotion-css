<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glitch-Flicker Modal - Fintech Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      min-height: 100vh;
      margin: 0;
      padding: 2rem;
      color: #f1f5f9;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
    }
    .page-header {
      text-align: center;
    }
    .page-header h1 {
      font-size: 1.75rem;
      margin-bottom: 0.5rem;
    }
    .page-header p {
      color: #94a3b8;
    }
    .trigger-btn {
      padding: 1rem 2rem;
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .trigger-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(59, 130, 246, 0.4);
    }
  </style>
</head>
<body>
  <header class="page-header">
    <h1>🔓 Secure Access</h1>
    <p>Glitch-Flicker Modal Component</p>
  </header>

  <button class="trigger-btn" onclick="openModal()">
    Open Secure Modal
  </button>

  <!-- Modal Overlay -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal glitch-modal" id="glitchModal">
      <div class="modal-header">
        <h2 class="modal-title glitch-text" data-text="Security Alert">Security Alert</h2>
        <button class="modal-close" onclick="closeModal()" aria-label="Close">&times;</button>
      </div>
      
      <div class="modal-body">
        <div class="alert-icon">
          <span class="icon-main">⚠️</span>
          <span class="icon-glitch">⚠️</span>
        </div>
        
        <p class="alert-message">
          Unusual transaction activity detected on your account.
        </p>
        
        <div class="transaction-details">
          <div class="detail-row">
            <span class="detail-label">Transaction ID:</span>
            <span class="detail-value glitch-text" data-text="TXN-8947-XK">TXN-8947-XK</span>
          </div>
          <div class="detail-row">
            <span class="detail-label">Amount:</span>
            <span class="detail-value negative">$4,250.00</span>
          </div>
          <div class="detail-row">
            <span class="detail-label">Location:</span>
            <span class="detail-value">Unknown Region</span>
          </div>
          <div class="detail-row">
            <span class="detail-label">Time:</span>
            <span class="detail-value">Just now</span>
          </div>
        </div>
        
        <p class="action-hint">
          Please verify this transaction or report it as fraudulent.
        </p>
      </div>
      
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
        <button class="btn btn-danger">Report Fraud</button>
        <button class="btn btn-primary">Verify</button>
      </div>
    </div>
  </div>

  <script>
    function openModal() {
      document.getElementById('modalOverlay').classList.add('active');
      document.getElementById('glitchModal').classList.add('glitching');
    }
    
    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('active');
      document.getElementById('glitchModal').classList.remove('glitching');
    }
    
    // Close on overlay click
    document.getElementById('modalOverlay').addEventListener('click', function(e) {
      if (e.target === this) closeModal();
    });
    
    // Close on Escape key
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') closeModal();
    });
  </script>
</body>
</html>
