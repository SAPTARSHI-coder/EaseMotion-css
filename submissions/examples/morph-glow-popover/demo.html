<body>

```
<main class="page">

    <h1>Morph-Glow Popover</h1>

    <p>
        A lightweight CSS popover with a smooth morph and glow effect.
    </p>

    <div class="popover-container">

        <button class="trigger">
            Account Overview
        </button>

        <div class="popover">

            <div class="popover-header">

                <div class="avatar">
                    S
                </div>

                <div>
                    <h2>Account Overview</h2>
                    <p>Fintech Dashboard</p>
                </div>

            </div>

            <div class="balance">
                <span>Current Balance</span>
                <strong>₹48,750</strong>
            </div>

            <div class="status">
                <span class="dot"></span>
                Account Active
            </div>

        </div>

    </div>

</main>
```
