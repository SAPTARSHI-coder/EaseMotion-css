<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Marquee — EaseMotion CSS</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="marquee-page-tm" data-palette="teal">
  <h1 class="marquee-h-tm">Marquee</h1>
  <p class="marquee-lede-tm">A self-contained demo with three variants of the effect.</p>
  <section class="marquee-row-tm">
    <article class="marquee-1-wrap-tm">
      <div class="marquee-1-tm"></div>
      <span class="marquee-lbl-tm">Example One</span>
    </article>
    <article class="marquee-2-wrap-tm">
      <div class="marquee-2-tm"></div>
      <span class="marquee-lbl-tm">Example Two</span>
    </article>
    <article class="marquee-3-wrap-tm">
      <div class="marquee-3-tm"></div>
      <span class="marquee-lbl-tm">Example Three</span>
    </article>
  </section>
</main>
</body>
</html>
