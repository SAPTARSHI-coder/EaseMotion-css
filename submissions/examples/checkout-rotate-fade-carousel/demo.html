<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Rotate-Fade Carousel (Checkout)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="checkout-layout">
        <h2 class="section-title">Select Courier</h2>
        
        <div class="carousel-container">
            <input type="radio" name="courier" id="cour1" class="carousel-input" checked>
            <input type="radio" name="courier" id="cour2" class="carousel-input">
            <input type="radio" name="courier" id="cour3" class="carousel-input">
            
            <div class="carousel-cards">
                <label for="cour1" class="carousel-card card-item-1">
                    <div class="card-icon">⚡</div>
                    <div class="card-info">
                        <div class="card-title">Flash Delivery</div>
                        <div class="card-price">$20</div>
                    </div>
                </label>
                
                <label for="cour2" class="carousel-card card-item-2">
                    <div class="card-icon">🛡️</div>
                    <div class="card-info">
                        <div class="card-title">Secure Post</div>
                        <div class="card-price">$12</div>
                    </div>
                </label>
                
                <label for="cour3" class="carousel-card card-item-3">
                    <div class="card-icon">🐢</div>
                    <div class="card-info">
                        <div class="card-title">Budget Ship</div>
                        <div class="card-price">$5</div>
                    </div>
                </label>
            </div>
            
            <div class="carousel-indicators">
                <label for="cour1" class="indicator"></label>
                <label for="cour2" class="indicator"></label>
                <label for="cour3" class="indicator"></label>
            </div>
        </div>
        
        <button class="checkout-btn">Confirm Selection</button>
    </div>
</body>
</html>
