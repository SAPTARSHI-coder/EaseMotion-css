<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drafting Pantograph — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Drafting Pantograph demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Drafting Pantograph</h1>
      <p class="lede">Pantograph arms scaling a drawing in parallel motion</p>
    </header>

    <section class="ease-drafting-pantograph" data-demo="drafting-pantograph" aria-live="polite">
      <div class="ease-drafting-pantograph__housing">
        <div class="ease-drafting-pantograph__bezel">
          <div class="ease-drafting-pantograph__face">
            <div class="ease-drafting-pantograph__readout">
              <span class="ease-drafting-pantograph__label">Drafting Pantograph</span>
              <span class="ease-drafting-pantograph__value">LIVE</span>
            </div>
            <div class="ease-drafting-pantograph__motion" aria-hidden="true">
              <span class="ease-drafting-pantograph__a"></span>
              <span class="ease-drafting-pantograph__b"></span>
              <span class="ease-drafting-pantograph__c"></span>
              <span class="ease-drafting-pantograph__d"></span>
            </div>
            <div class="ease-drafting-pantograph__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-drafting-pantograph__controls">
          <button type="button" class="ease-drafting-pantograph__btn primary">Engage</button>
          <button type="button" class="ease-drafting-pantograph__btn">Reset</button>
          <label class="ease-drafting-pantograph__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-drafting-pantograph__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
