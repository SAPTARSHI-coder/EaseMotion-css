<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-audio-waveform-visualizer demo</title>
</head>
<body>
<div class="aw-app">
  <span class="aw-title">NOW PLAYING</span>
  <div class="aw-screen">
    <span class="aw-bars">
      <span class="aw-bar aw-bar-1"></span>
      <span class="aw-bar aw-bar-2"></span>
      <span class="aw-bar aw-bar-3"></span>
      <span class="aw-bar aw-bar-4"></span>
      <span class="aw-bar aw-bar-5"></span>
      <span class="aw-bar aw-bar-6"></span>
      <span class="aw-bar aw-bar-7"></span>
      <span class="aw-bar aw-bar-8"></span>
    </span>
  </div>
  <span class="aw-track">NEON SKYWAY</span>
  <span class="aw-artist">LUMINA DRIVE</span>
  <div class="aw-controls">
    <span class="aw-btn aw-prev">&#9664;&#9664;</span>
    <span class="aw-btn aw-play">&#9654;</span>
    <span class="aw-btn aw-next">&#9654;&#9654;</span>
  </div>
  <span class="aw-time">1:42</span>
</div>
</body>
</html>
