<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reduced Demo Section Spacing</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="hero">
    <h1>EaseMotion CSS</h1>
    <p>Reduced Demo Section Spacing</p>
</header>

<main class="demo">

    <section class="demo-section">
        <h2>Buttons</h2>

        <div class="example">
            <button class="btn">Primary Button</button>
            <button class="btn secondary">Secondary Button</button>
        </div>
    </section>

    <section class="demo-section">
        <h2>Cards</h2>

        <div class="card">
            <h3>Example Card</h3>
            <p>
                Demonstrates consistent spacing between major sections while
                preserving readability.
            </p>
        </div>
    </section>

    <section class="demo-section">
        <h2>Animations</h2>

        <div class="box"></div>
    </section>

    <section class="demo-section">
        <h2>Flexible Layouts</h2>

        <div class="layout">
            <div class="item">One</div>
            <div class="item">Two</div>
            <div class="item">Three</div>
        </div>
    </section>

</main>

</body>
</html>
