<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Interactive Echo Chamber with soundless visual ripples"
  >

  <title>Echo Chamber</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="page">
    <section class="hero">
      <span class="eyebrow">VISUAL AUDIO EXPERIMENT</span>

      <h1>Echo Chamber</h1>

      <p class="intro">
        Soundless ripples that remember your interaction.
        Click anywhere inside the chamber to create an echo.
      </p>
    </section>

    <section class="panel" aria-label="Echo Chamber">
      <div class="controls">
        <div class="stats">
          <span class="stat-label">ECHOES</span>
          <strong id="echoCount">0</strong>
        </div>

        <label class="strength-control" for="echoStrength">
          <span>Echo Strength</span>

          <input
            id="echoStrength"
            type="range"
            min="0.5"
            max="2"
            value="1"
            step="0.1"
          >

          <output id="strengthValue">1.0×</output>
        </label>

        <button
          id="clearButton"
          class="clear-button"
          type="button"
        >
          Clear
        </button>
      </div>

      <div
        id="chamber"
        class="chamber"
        tabindex="0"
        role="application"
        aria-label="Interactive Echo Chamber. Click or press Space to create a ripple."
      >
        <div class="chamber-grid"></div>

        <svg
          id="echoSvg"
          class="echo-svg"
          viewBox="0 0 800 520"
          preserveAspectRatio="none"
          aria-hidden="true"
        ></svg>

        <div class="chamber-center">
          <span class="center-ring"></span>
          <span class="center-label">CREATE ECHO</span>
          <span class="center-hint">CLICK / SPACE</span>
        </div>

        <div class="boundary-glow"></div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
