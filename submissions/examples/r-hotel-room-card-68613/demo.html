<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Responsive CSS hotel room card with amenities and pricing.">
  <title>CSS Hotel Room Card</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">
    <article class="hotel-card">

      <div class="room-image" role="img" aria-label="Modern luxury hotel room">
        <span class="badge">Guest favorite</span>
      </div>

      <div class="room-content">
        <div class="room-heading">
          <div>
            <span class="eyebrow">Deluxe stay</span>
            <h1>Executive King Room</h1>
          </div>

          <span class="rating" aria-label="Rated 4.9 out of 5">
            ★ 4.9
          </span>
        </div>

        <p class="location">Downtown · City View</p>

        <div class="amenities" aria-label="Room amenities">
          <span>🛏 King bed</span>
          <span>🚿 Private bath</span>
          <span>📶 Wi-Fi</span>
          <span>❄ AC</span>
        </div>

        <div class="room-footer">
          <div class="price">
            <strong>$189</strong>
            <span>/ night</span>
          </div>

          <a class="book-button" href="#book">
            Reserve
            <span aria-hidden="true">→</span>
          </a>
        </div>
      </div>

    </article>
  </main>

</body>
</html>
