<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Matter Halo Gravitational Lens - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030208; color: #ffffff;">

    <div class="ease-card ease-card-glass lens-container">
        <div class="lens-header">
            <h2>Dark Matter Lens</h2>
            <span class="ease-badge ease-badge-info">Lensing Active</span>
        </div>
        
        <div class="lens-screen ease-center">
            <div class="spacetime-warp warp-1"></div>
            <div class="spacetime-warp warp-2"></div>
            <div class="einstein-ring"></div>
            <div class="dark-matter-core ease-center"></div>
        </div>

        <div class="lens-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Mass: 10¹² Solar</span>
            <button class="ease-btn ease-btn-primary ease-btn-sm ease-hover-grow">Map Distortion</button>
        </div>
    </div>

</body>
</html>
