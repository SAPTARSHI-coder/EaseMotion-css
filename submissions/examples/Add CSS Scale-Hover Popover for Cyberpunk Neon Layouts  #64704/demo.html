<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Scale-Hover Popover - Cyberpunk Neon Layouts</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="cyberpunk-container">
    <div class="popover-wrapper">
      <button class="cyber-btn" aria-haspopup="dialog" aria-expanded="false">
        ACCESS DATA
      </button>
      
      <div class="scale-popover" role="dialog" aria-label="Data Information">
        <div class="popover-content">
          <h3 class="neon-title">DATA LINK: SECURE</h3>
          <p class="neon-text">Encrypted payload retrieved successfully. No tracing detected on the subnet.</p>
          <ul class="neon-list">
            <li><strong>Integrity:</strong> 100%</li>
            <li><strong>Source:</strong> Unknown</li>
            <li><strong>Protocol:</strong> Ghost</li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
