<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slide-Up Card Grid | EaseMotion CSS</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="container">

    <h1>Slide-Up Card Grid</h1>

    <section class="card-grid">

        <article class="card">
            <div class="content">
                <span>01</span>
                <h2>Artificial Intelligence</h2>
                <p>
                    Explore intelligent systems
                    and automation solutions.
                </p>
            </div>
        </article>


        <article class="card">
            <div class="content">
                <span>02</span>
                <h2>Cloud Computing</h2>
                <p>
                    Build scalable and reliable
                    cloud platforms.
                </p>
            </div>
        </article>


        <article class="card">
            <div class="content">
                <span>03</span>
                <h2>Cyber Security</h2>
                <p>
                    Protect modern digital
                    environments.
                </p>
            </div>
        </article>


    </section>

</main>

</body>

</html>
