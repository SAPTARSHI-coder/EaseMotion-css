<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-slot-machine-reel demo</title>
</head>
<body>
<div class="smr-app">
  <span class="smr-title">CASINO</span>
  <div class="smr-glass">
    <div class="smr-reel smr-reel-a"><span class="smr-sym">7</span><span class="smr-sym">BAR</span><span class="smr-sym">7</span></div>
    <div class="smr-reel smr-reel-b"><span class="smr-sym">BAR</span><span class="smr-sym">7</span><span class="smr-sym">BAR</span></div>
    <div class="smr-reel smr-reel-c"><span class="smr-sym">7</span><span class="smr-sym">7</span><span class="smr-sym">BAR</span></div>
  </div>
  <div class="smr-lever"></div>
  <span class="smr-bet">BET 5</span>
</div>
</body>
</html>
