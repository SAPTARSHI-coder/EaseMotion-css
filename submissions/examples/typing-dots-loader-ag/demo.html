<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Typing Dots Loader Component</title>
  <link rel="stylesheet" href="./style.css">
  <style>
    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f9fafb;
      font-family: system-ui, -apple-system, sans-serif;
    }
    
    .chat-bubble {
      background: #e5e7eb;
      padding: 16px 20px;
      border-radius: 20px;
      border-bottom-left-radius: 4px;
      color: #374151;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
  </style>
</head>
<body>

  <!-- The Component -->
  <div class="chat-bubble">
    <div class="typing-loader">
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>
  </div>

</body>
</html>
