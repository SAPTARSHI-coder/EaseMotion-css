<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elastic-Slide Progress Bar | EaseMotion CSS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<section class="em-progress-section">
    <div class="em-container">

        <div class="em-heading">
            <h1>Elastic-Slide Progress Bars</h1>
            <p>SaaS Product Analytics Dashboard</p>
        </div>

        <div class="em-progress-card">

            <div class="em-progress-item">
                <div class="em-progress-header">
                    <span>Cloud Storage</span>
                    <span>92%</span>
                </div>

                <div class="em-progress-track">
                    <div class="em-progress-fill em-storage"></div>
                </div>
            </div>

            <div class="em-progress-item">
                <div class="em-progress-header">
                    <span>API Requests</span>
                    <span>75%</span>
                </div>

                <div class="em-progress-track">
                    <div class="em-progress-fill em-api"></div>
                </div>
            </div>

            <div class="em-progress-item">
                <div class="em-progress-header">
                    <span>Database Load</span>
                    <span>60%</span>
                </div>

                <div class="em-progress-track">
                    <div class="em-progress-fill em-db"></div>
                </div>
            </div>

            <div class="em-progress-item">
                <div class="em-progress-header">
                    <span>Deployment</span>
                    <span>100%</span>
                </div>

                <div class="em-progress-track">
                    <div class="em-progress-fill em-deploy"></div>
                </div>
            </div>

        </div>

    </div>
</section>

</body>
</html>
