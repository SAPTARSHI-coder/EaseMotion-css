<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ease-scroll-triggered-counter-sap demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #f4f4f5; }
    .spacer { height: 90vh; display: flex; align-items: center; justify-content: center; color: #94a3b8; }
    .page { display: flex; justify-content: center; padding-bottom: 200px; }
  </style>
</head>
<body>

  <div class="spacer">Scroll down to trigger the counters</div>

  <div class="page">
    <div class="scroll-counter-sap" id="counters">
      <div class="counter-item">
        <div class="counter-value" data-target="2400">0</div>
        <div class="counter-label">Happy Users</div>
      </div>
      <div class="counter-item">
        <div class="counter-value" data-target="99">0</div>
        <div class="counter-label">Uptime %</div>
      </div>
      <div class="counter-item">
        <div class="counter-value" data-target="150">0</div>
        <div class="counter-label">Countries</div>
      </div>
    </div>
  </div>

  <script>
    const counters = document.querySelectorAll('.counter-value');
    let animated = false;

    function animateCount(el) {
      const target = +el.dataset.target;
      const duration = 1400;
      const start = performance.now();

      function tick(now) {
        const progress = Math.min((now - start) / duration, 1);
        const eased = 1 - Math.pow(1 - progress, 3);
        el.textContent = Math.floor(eased * target);
        if (progress < 1) requestAnimationFrame(tick);
        else el.textContent = target;
      }
      requestAnimationFrame(tick);
    }

    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting && !animated) {
          animated = true;
          counters.forEach(animateCount);
        }
      });
    }, { threshold: 0.5 });

    observer.observe(document.getElementById('counters'));
  </script>

</body>
</html>
