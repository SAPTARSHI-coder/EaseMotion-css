<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Animated Button with Retro styling">
    <title>Retro Animated Button</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="page">
        <section class="showcase">
            <span class="badge">EaseMotion CSS</span>

            <h1>Retro Animated Button</h1>

            <p class="subtitle">
                A bold, responsive button with playful retro motion and
                tactile interactions.
            </p>

            <div class="button-stage">
                <button class="retro-button" type="button">
                    <span class="button-text">LET'S GO!</span>
                    <span class="button-arrow" aria-hidden="true">→</span>
                </button>
            </div>
        </section>
    </main>

</body>
</html>
