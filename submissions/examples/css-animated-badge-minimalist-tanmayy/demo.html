<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Minimalist Animated Badges - EaseMotion CSS</title>
  <!-- Import EaseMotion CSS -->
  <link rel="stylesheet" href="../../../easemotion.css">
  <!-- Component Specific Styles -->
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body class="minimalist-bg">

  <div class="demo-container">
    
    <div class="header-section">
      <h1 class="ease-text-3xl">Minimalist Animated Badges</h1>
      <p class="ease-color-muted">A collection of pristine, hardware-accelerated CSS badge animations. Showcasing shimmer effects, conic-gradient border tracing, and native box-shadow pulsing.</p>
    </div>

    <!-- The Component Viewport -->
    <div class="badge-viewport" aria-label="Showcase of animated minimalist badges" role="region">
      
      <!-- Variant 1: Shimmer -->
      <div class="badge-container">
        <span class="badge-label">Variant 1: Shimmer Sweep</span>
        
        <div class="badge badge-shimmer">
          <span class="badge-text">Premium</span>
        </div>
      </div>
      
      <!-- Variant 2: Pulse Ring -->
      <div class="badge-container">
        <span class="badge-label">Variant 2: Status Pulse</span>
        
        <div class="badge badge-pulse">
          <span class="status-dot"></span>
          <span class="badge-text">System Live</span>
        </div>
      </div>
      
      <!-- Variant 3: Conic Trace -->
      <div class="badge-container">
        <span class="badge-label">Variant 3: Conic Border Trace</span>
        
        <div class="badge-trace-wrapper">
          <div class="badge-trace-inner">
            <svg class="badge-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
            <span class="badge-text">v2.0 Beta</span>
          </div>
        </div>
      </div>
      
    </div>

  </div>

</body>
</html>
