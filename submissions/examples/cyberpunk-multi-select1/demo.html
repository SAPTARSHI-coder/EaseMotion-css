<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cyberpunk Multi-Select Dropdown - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="cyber-dropdown-wrapper">
    <input type="checkbox" id="cyber-select-toggle" class="cyber-dropdown-toggle" />
    
    <label for="cyber-select-toggle" class="cyber-dropdown-header">
      <span>SYS_MODULES // SELECT</span>
      <span class="cyber-arrow"></span>
    </label>

    <div class="cyber-dropdown-menu">
      <label class="cyber-option">
        <input type="checkbox" name="modules" value="neural" checked />
        <span class="cyber-checkbox"></span>
        <span class="cyber-option-label">NEURAL_INTERFACE_v2</span>
      </label>

      <label class="cyber-option">
        <input type="checkbox" name="modules" value="optics" />
        <span class="cyber-checkbox"></span>
        <span class="cyber-option-label">OPTIC_HUD_ENHANCER</span>
      </label>

      <label class="cyber-option">
        <input type="checkbox" name="modules" value="firewall" checked />
        <span class="cyber-checkbox"></span>
        <span class="cyber-option-label">ICEBREAKER_FIREWALL</span>
      </label>

      <label class="cyber-option">
        <input type="checkbox" name="modules" value="stealth" />
        <span class="cyber-checkbox"></span>
        <span class="cyber-option-label">OPTICAL_CAMOUFLAGE</span>
      </label>
    </div>
  </div>

</body>
</html>
