<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Scrollable Tab Overflow</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>Scrollable Tab Overflow</h1>

    <nav class="tab-container" aria-label="Scrollable Tabs">
      <button class="tab active">Home</button>
      <button class="tab">Products</button>
      <button class="tab">Services</button>
      <button class="tab">Solutions</button>
      <button class="tab">Resources</button>
      <button class="tab">Documentation</button>
      <button class="tab">Blog</button>
      <button class="tab">Community</button>
      <button class="tab">Support</button>
      <button class="tab">Contact</button>
    </nav>

    <p class="info">
      Resize the browser window to see horizontal scrolling when tabs overflow.
    </p>
  </div>

</body>
</html>
