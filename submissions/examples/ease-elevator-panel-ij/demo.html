<!-- EaseMotion component: elevator-panel -->
<!DOCTYPE html>
<html lang="en" data-elev="panel">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.4">
<title>Ease Elevator Panel</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="elev-panel">
  <header class="elev-head">
    <span class="elev-id">LIFT A</span>
    <span class="elev-dir">UP</span>
  </header>
  <div class="elev-indicator">
    <span class="elev-floor">7</span>
    <span class="elev-arrow"></span>
  </div>
  <div class="elev-buttons">
    <span class="elev-btn btn-1">1</span>
    <span class="elev-btn btn-2">2</span>
    <span class="elev-btn btn-3">3</span>
    <span class="elev-btn btn-4">4</span>
    <span class="elev-btn btn-5">5</span>
    <span class="elev-btn btn-6">6</span>
    <span class="elev-btn btn-7">7</span>
    <span class="elev-btn btn-8">8</span>
    <span class="elev-btn btn-open">&lt;</span>
    <span class="elev-btn btn-close">&gt;</span>
  </div>
  <div class="elev-doors">
    <span class="door door-left"></span>
    <span class="door door-right"></span>
  </div>
  <footer class="elev-foot">
    <span class="elev-load">LOAD 40%</span>
    <span class="elev-service">IN SERVICE</span>
  </footer>
</main>
</body>
</html>
