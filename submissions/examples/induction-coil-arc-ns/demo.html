<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Induction Coil Arc — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Induction Coil Arc demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Induction Coil Arc</h1>
      <p class="lede">Induction coil secondary arc snapping across electrodes</p>
    </header>

    <section class="ease-induction-coil-arc" data-demo="induction-coil-arc" aria-live="polite">
      <div class="ease-induction-coil-arc__housing">
        <div class="ease-induction-coil-arc__bezel">
          <div class="ease-induction-coil-arc__face">
            <div class="ease-induction-coil-arc__readout">
              <span class="ease-induction-coil-arc__label">Induction Coil Arc</span>
              <span class="ease-induction-coil-arc__value">LIVE</span>
            </div>
            <div class="ease-induction-coil-arc__motion" aria-hidden="true">
              <span class="ease-induction-coil-arc__a"></span>
              <span class="ease-induction-coil-arc__b"></span>
              <span class="ease-induction-coil-arc__c"></span>
              <span class="ease-induction-coil-arc__d"></span>
            </div>
            <div class="ease-induction-coil-arc__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-induction-coil-arc__controls">
          <button type="button" class="ease-induction-coil-arc__btn primary">Engage</button>
          <button type="button" class="ease-induction-coil-arc__btn">Reset</button>
          <label class="ease-induction-coil-arc__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-induction-coil-arc__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
