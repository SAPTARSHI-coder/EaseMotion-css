<!DOCTYPE html>
<html lang="en" data-theme="cyberpunk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive Audio Waveform Scrubber · EaseMotion CSS</title>
  <meta name="description" content="A fully interactive audio waveform scrubber with draggable playhead, loop handles, hover timestamp tooltip, theme switching, and playback controls — pure CSS + vanilla JS, zero dependencies." />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="container">

  <!-- Header -->
  <header class="page-header">
    <span class="em-badge">EaseMotion Component</span>
    <h1>Audio Waveform Scrubber</h1>
    <p>Interactive seeking · Loop regions · Hover tooltip · 4 Themes · No dependencies</p>
  </header>

  <!-- ============================================================
       PLAYER CARD
  ============================================================= -->
  <article class="player-card" id="playerCard" aria-label="Audio waveform scrubber">

    <!-- Track Info -->
    <div class="track-header">
      <!-- SVG artwork placeholder — no external images -->
      <div class="track-artwork" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" width="28" height="28">
          <path d="M9 18V5l12-2v13"/>
          <circle cx="6" cy="18" r="3"/>
          <circle cx="18" cy="16" r="3"/>
        </svg>
      </div>
      <div class="track-meta">
        <h2 class="track-title" id="trackTitle">Cyberpunk Synthwave Prelude</h2>
        <p class="track-artist" id="trackArtist">Neon Resonance · Cyberpunk Vol. 1</p>
      </div>
      <div class="time-display" aria-live="polite" aria-atomic="true">
        <span id="currentTime" class="time-current">00:00</span>
        <span class="time-sep" aria-hidden="true">/</span>
        <span id="totalTime" class="time-total">03:45</span>
      </div>
    </div>

    <!-- ============================================================
         WAVEFORM SCRUBBER
    ============================================================= -->
    <div class="waveform-stage"
         id="waveformStage"
         role="slider"
         aria-label="Playback position scrubber"
         aria-valuemin="0"
         aria-valuemax="100"
         aria-valuenow="0"
         aria-valuetext="0:00 of 3:45"
         tabindex="0">

      <!-- Hover tooltip -->
      <div class="waveform-tooltip" id="hoverTooltip" aria-hidden="true">00:00</div>

      <!-- Loop region overlay -->
      <div class="loop-region" id="loopRegion" aria-hidden="true"></div>

      <!-- Loop start handle -->
      <div class="loop-handle loop-handle--start"
           id="loopHandleStart"
           role="slider"
           aria-label="Loop start position"
           aria-valuemin="0"
           aria-valuemax="100"
           aria-valuenow="25"
           tabindex="0"
           style="left: 25%">
        <span class="loop-handle__label">A</span>
      </div>

      <!-- Loop end handle -->
      <div class="loop-handle loop-handle--end"
           id="loopHandleEnd"
           role="slider"
           aria-label="Loop end position"
           aria-valuemin="0"
           aria-valuemax="100"
           aria-valuenow="65"
           tabindex="0"
           style="left: 65%">
        <span class="loop-handle__label">B</span>
      </div>

      <!-- 60 waveform bars — generated by JS -->
      <div class="waveform-bars" id="waveformBars" aria-hidden="true"></div>

      <!-- Draggable playhead -->
      <div class="playhead" id="playhead" aria-hidden="true" style="left: 0%">
        <div class="playhead__knob"></div>
        <div class="playhead__line"></div>
      </div>

    </div><!-- /waveform-stage -->

    <!-- ============================================================
         CONTROLS
    ============================================================= -->
    <div class="player-controls">

      <!-- Main transport -->
      <div class="transport-group" role="group" aria-label="Playback controls">

        <!-- Rewind 5s -->
        <button class="ctrl-btn" id="btnRewind" aria-label="Rewind 5 seconds">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="1 4 1 10 7 10"/>
            <path d="M3.51 15a9 9 0 1 0 .49-3.14"/>
          </svg>
          <span class="ctrl-label" aria-hidden="true">5</span>
        </button>

        <!-- Play / Pause -->
        <button class="ctrl-btn ctrl-btn--primary" id="btnPlay" aria-label="Play" aria-pressed="false">
          <svg class="icon-play" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <polygon points="5 3 19 12 5 21 5 3"/>
          </svg>
          <svg class="icon-pause" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <rect x="6" y="4" width="4" height="16"/>
            <rect x="14" y="4" width="4" height="16"/>
          </svg>
        </button>

        <!-- Forward 5s -->
        <button class="ctrl-btn" id="btnForward" aria-label="Forward 5 seconds">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="23 4 23 10 17 10"/>
            <path d="M20.49 15a9 9 0 1 1-.49-3.14"/>
          </svg>
          <span class="ctrl-label" aria-hidden="true">5</span>
        </button>

      </div>

      <!-- Volume -->
      <div class="volume-group" role="group" aria-label="Volume">
        <button class="ctrl-btn ctrl-btn--sm" id="btnMute" aria-label="Mute" aria-pressed="false">
          <!-- Volume on -->
          <svg class="icon-vol-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
          </svg>
          <!-- Volume off -->
          <svg class="icon-vol-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
            <line x1="23" y1="9" x2="17" y2="15"/>
            <line x1="17" y1="9" x2="23" y2="15"/>
          </svg>
        </button>
        <input type="range" class="volume-slider" id="volumeSlider"
               min="0" max="100" value="80" step="1"
               aria-label="Volume" />
      </div>

    </div><!-- /player-controls -->

    <!-- ============================================================
         SPEED + TRACK + THEME
    ============================================================= -->
    <div class="meta-controls">

      <!-- Speed -->
      <div class="pill-group" role="group" aria-label="Playback speed">
        <span class="pill-group__label">Speed</span>
        <button class="pill-btn" data-speed="0.75" aria-pressed="false">0.75×</button>
        <button class="pill-btn pill-btn--active" data-speed="1" aria-pressed="true">1×</button>
        <button class="pill-btn" data-speed="1.25" aria-pressed="false">1.25×</button>
        <button class="pill-btn" data-speed="1.5" aria-pressed="false">1.5×</button>
      </div>

      <!-- Track -->
      <div class="pill-group" role="group" aria-label="Track presets">
        <span class="pill-group__label">Track</span>
        <button class="pill-btn pill-btn--active" data-track="0" aria-pressed="true">Synthwave</button>
        <button class="pill-btn" data-track="1" aria-pressed="false">Cyber Pulse</button>
        <button class="pill-btn" data-track="2" aria-pressed="false">Acoustic</button>
      </div>

      <!-- Theme -->
      <div class="pill-group" role="group" aria-label="Colour theme">
        <span class="pill-group__label">Theme</span>
        <button class="pill-btn pill-btn--active" data-theme="cyberpunk" aria-pressed="true">Cyberpunk</button>
        <button class="pill-btn" data-theme="amber"     aria-pressed="false">Amber</button>
        <button class="pill-btn" data-theme="midnight"  aria-pressed="false">Midnight</button>
        <button class="pill-btn" data-theme="emerald"   aria-pressed="false">Emerald</button>
      </div>

    </div><!-- /meta-controls -->

  </article>

</div><!-- /container -->

<script>
/* ================================================================
   EASE AUDIO WAVEFORM SCRUBBER
   Self-contained demo. No external libraries or audio files needed.
   Playback is simulated via requestAnimationFrame.
================================================================ */
(function () {
  'use strict';

  /* ---- Track presets ------------------------------------------ */
  const TRACKS = [
    { title: 'Cyberpunk Synthwave Prelude', artist: 'Neon Resonance · Cyberpunk Vol. 1', duration: 225, seed: 1.5 },
    { title: 'Quantum Pulse Matrix',        artist: 'Digital Echo · Future Sound',       duration: 192, seed: 2.8 },
    { title: 'Midnight Acoustic Horizon',   artist: 'Luna Wave · Chillout Session',      duration: 210, seed: 0.9 }
  ];
  const NUM_BARS = 60;
  const SEEK_STEP = 5; // seconds

  /* ---- State --------------------------------------------------- */
  let currentTrackIdx = 0;
  let duration        = TRACKS[0].duration;
  let currentTime     = 0;          // seconds (simulated)
  let isPlaying       = false;
  let playbackSpeed   = 1;
  let isMuted         = false;
  let loopStartFrac   = 0.25;       // 0–1
  let loopEndFrac     = 0.65;       // 0–1

  let isDraggingWaveform   = false;
  let isDraggingLoopStart  = false;
  let isDraggingLoopEnd    = false;

  let lastRafTime     = null;
  let rafId           = null;

  /* ---- DOM refs ------------------------------------------------ */
  const playerCard       = document.getElementById('playerCard');
  const waveformStage    = document.getElementById('waveformStage');
  const waveformBars     = document.getElementById('waveformBars');
  const playheadEl       = document.getElementById('playhead');
  const loopRegionEl     = document.getElementById('loopRegion');
  const loopHandleStart  = document.getElementById('loopHandleStart');
  const loopHandleEnd    = document.getElementById('loopHandleEnd');
  const hoverTooltip     = document.getElementById('hoverTooltip');
  const btnPlay          = document.getElementById('btnPlay');
  const btnRewind        = document.getElementById('btnRewind');
  const btnForward       = document.getElementById('btnForward');
  const btnMute          = document.getElementById('btnMute');
  const volumeSlider     = document.getElementById('volumeSlider');
  const currentTimeEl    = document.getElementById('currentTime');
  const totalTimeEl      = document.getElementById('totalTime');
  const trackTitleEl     = document.getElementById('trackTitle');
  const trackArtistEl    = document.getElementById('trackArtist');

  /* ---- Helpers ------------------------------------------------- */
  function fmt(sec) {
    sec = Math.max(0, Math.floor(sec));
    const m = Math.floor(sec / 60);
    const s = sec % 60;
    return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
  }

  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  /* ---- Build 60 amplitude bars --------------------------------- */
  let barEls = [];

  function buildBars(seed) {
    waveformBars.innerHTML = '';
    barEls = [];
    for (let i = 0; i < NUM_BARS; i++) {
      const norm = i / (NUM_BARS - 1);
      // Deterministic amplitude from seed — no Math.random() so bars
      // re-generate consistently per track preset.
      const amp = clamp(
        Math.sin(norm * Math.PI * seed * 4) * 0.35 +
        Math.cos(norm * Math.PI * seed * 7) * 0.25 +
        Math.sin(norm * Math.PI * seed * 2.3 + 0.8) * 0.15 + 0.55,
        0.18, 1
      );
      const bar = document.createElement('div');
      bar.className = 'wave-bar';
      // CSS custom property drives the bar height via scaleY
      bar.style.setProperty('--bar-amp', amp.toFixed(3));
      waveformBars.appendChild(bar);
      barEls.push(bar);
    }
  }

  /* ---- Render -------------------------------------------------- */
  function renderBars(fraction) {
    const threshold = fraction * (NUM_BARS - 1);
    barEls.forEach((bar, i) => {
      if (i <= threshold) {
        bar.classList.add('played');
      } else {
        bar.classList.remove('played');
      }
    });
  }

  function renderPlayhead(fraction) {
    playheadEl.style.left = (fraction * 100).toFixed(3) + '%';
    waveformStage.setAttribute('aria-valuenow', Math.round(fraction * 100));
    waveformStage.setAttribute('aria-valuetext', fmt(fraction * duration) + ' of ' + fmt(duration));
  }

  function renderLoopRegion() {
    loopRegionEl.style.left  = (loopStartFrac * 100).toFixed(3) + '%';
    loopRegionEl.style.width = ((loopEndFrac - loopStartFrac) * 100).toFixed(3) + '%';
    loopHandleStart.style.left = (loopStartFrac * 100).toFixed(3) + '%';
    loopHandleEnd.style.left   = (loopEndFrac   * 100).toFixed(3) + '%';
    loopHandleStart.setAttribute('aria-valuenow', Math.round(loopStartFrac * 100));
    loopHandleEnd.setAttribute('aria-valuenow',   Math.round(loopEndFrac   * 100));
  }

  function renderTime() {
    currentTimeEl.textContent = fmt(currentTime);
  }

  function renderAll() {
    const frac = duration > 0 ? currentTime / duration : 0;
    renderBars(frac);
    renderPlayhead(frac);
    renderLoopRegion();
    renderTime();
  }

  /* ---- Playback simulation ------------------------------------- */
  function rafLoop(timestamp) {
    if (lastRafTime !== null && isPlaying) {
      const delta = (timestamp - lastRafTime) / 1000;
      currentTime += delta * playbackSpeed;
      if (currentTime >= duration) {
        currentTime = 0;
        setPlaying(false);
      }
      renderAll();
    }
    lastRafTime = timestamp;
    rafId = requestAnimationFrame(rafLoop);
  }

  function setPlaying(playing) {
    isPlaying = playing;
    playerCard.classList.toggle('is-playing', isPlaying);
    btnPlay.setAttribute('aria-pressed', isPlaying ? 'true' : 'false');
    btnPlay.setAttribute('aria-label', isPlaying ? 'Pause' : 'Play');
  }

  /* ---- Fraction from pointer event ----------------------------- */
  function fractionFromPointer(e) {
    const rect = waveformStage.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    return clamp((clientX - rect.left) / rect.width, 0, 1);
  }

  /* ---- Waveform seek / drag ------------------------------------ */
  waveformStage.addEventListener('pointerdown', (e) => {
    const target = e.target;
    if (target.closest('#loopHandleStart')) {
      isDraggingLoopStart = true;
      waveformStage.setPointerCapture(e.pointerId);
      return;
    }
    if (target.closest('#loopHandleEnd')) {
      isDraggingLoopEnd = true;
      waveformStage.setPointerCapture(e.pointerId);
      return;
    }
    isDraggingWaveform = true;
    waveformStage.setPointerCapture(e.pointerId);
    const frac = fractionFromPointer(e);
    currentTime = frac * duration;
    renderAll();
  });

  waveformStage.addEventListener('pointermove', (e) => {
    const frac = fractionFromPointer(e);
    const rect  = waveformStage.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const offsetX = clamp(clientX - rect.left, 0, rect.width);

    // Tooltip always follows cursor
    hoverTooltip.textContent = fmt(frac * duration);
    hoverTooltip.style.left  = offsetX + 'px';
    hoverTooltip.classList.add('is-visible');

    if (isDraggingWaveform) {
      currentTime = frac * duration;
      renderAll();
      return;
    }
    if (isDraggingLoopStart) {
      loopStartFrac = clamp(frac, 0, loopEndFrac - 0.02);
      renderLoopRegion();
      return;
    }
    if (isDraggingLoopEnd) {
      loopEndFrac = clamp(frac, loopStartFrac + 0.02, 1);
      renderLoopRegion();
      return;
    }
  });

  waveformStage.addEventListener('pointerup', () => {
    isDraggingWaveform  = false;
    isDraggingLoopStart = false;
    isDraggingLoopEnd   = false;
  });

  waveformStage.addEventListener('pointerleave', (e) => {
    // Only hide when not capturing (no active drag)
    if (!isDraggingWaveform && !isDraggingLoopStart && !isDraggingLoopEnd) {
      hoverTooltip.classList.remove('is-visible');
    }
  });

  /* ---- Keyboard: waveform region ------------------------------ */
  waveformStage.addEventListener('keydown', (e) => {
    const step = duration / NUM_BARS;
    if (e.key === 'ArrowRight') { currentTime = clamp(currentTime + step, 0, duration); renderAll(); e.preventDefault(); }
    if (e.key === 'ArrowLeft')  { currentTime = clamp(currentTime - step, 0, duration); renderAll(); e.preventDefault(); }
    if (e.key === ' ' || e.key === 'Enter') { setPlaying(!isPlaying); e.preventDefault(); }
  });

  /* ---- Keyboard: loop handles --------------------------------- */
  function handleLoopKey(e, isStart) {
    const step = 0.01;
    if (e.key === 'ArrowRight') {
      if (isStart) loopStartFrac = clamp(loopStartFrac + step, 0, loopEndFrac - 0.02);
      else         loopEndFrac   = clamp(loopEndFrac + step, loopStartFrac + 0.02, 1);
      renderLoopRegion(); e.preventDefault();
    }
    if (e.key === 'ArrowLeft') {
      if (isStart) loopStartFrac = clamp(loopStartFrac - step, 0, loopEndFrac - 0.02);
      else         loopEndFrac   = clamp(loopEndFrac - step, loopStartFrac + 0.02, 1);
      renderLoopRegion(); e.preventDefault();
    }
  }
  loopHandleStart.addEventListener('keydown', e => handleLoopKey(e, true));
  loopHandleEnd.addEventListener('keydown',   e => handleLoopKey(e, false));

  /* ---- Transport buttons --------------------------------------- */
  btnPlay.addEventListener('click', () => setPlaying(!isPlaying));

  btnRewind.addEventListener('click', () => {
    currentTime = clamp(currentTime - SEEK_STEP, 0, duration);
    renderAll();
  });

  btnForward.addEventListener('click', () => {
    currentTime = clamp(currentTime + SEEK_STEP, 0, duration);
    renderAll();
  });

  /* ---- Volume -------------------------------------------------- */
  volumeSlider.addEventListener('input', () => {
    const v = parseInt(volumeSlider.value, 10);
    isMuted = v === 0;
    btnMute.setAttribute('aria-pressed', isMuted ? 'true' : 'false');
    btnMute.setAttribute('aria-label', isMuted ? 'Unmute' : 'Mute');
    btnMute.classList.toggle('is-muted', isMuted);
  });

  btnMute.addEventListener('click', () => {
    isMuted = !isMuted;
    btnMute.setAttribute('aria-pressed', isMuted ? 'true' : 'false');
    btnMute.setAttribute('aria-label', isMuted ? 'Unmute' : 'Mute');
    btnMute.classList.toggle('is-muted', isMuted);
    volumeSlider.value = isMuted ? 0 : 80;
  });

  /* ---- Speed buttons ------------------------------------------ */
  document.querySelectorAll('[data-speed]').forEach(btn => {
    btn.addEventListener('click', () => {
      playbackSpeed = parseFloat(btn.dataset.speed);
      document.querySelectorAll('[data-speed]').forEach(b => {
        b.classList.remove('pill-btn--active');
        b.setAttribute('aria-pressed', 'false');
      });
      btn.classList.add('pill-btn--active');
      btn.setAttribute('aria-pressed', 'true');
    });
  });

  /* ---- Track buttons ------------------------------------------ */
  document.querySelectorAll('[data-track]').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = parseInt(btn.dataset.track, 10);
      const track = TRACKS[idx];
      currentTrackIdx = idx;
      duration        = track.duration;
      currentTime     = 0;
      trackTitleEl.textContent  = track.title;
      trackArtistEl.textContent = track.artist;
      totalTimeEl.textContent   = fmt(duration);
      setPlaying(false);
      buildBars(track.seed);
      renderAll();
      document.querySelectorAll('[data-track]').forEach(b => {
        b.classList.remove('pill-btn--active');
        b.setAttribute('aria-pressed', 'false');
      });
      btn.classList.add('pill-btn--active');
      btn.setAttribute('aria-pressed', 'true');
    });
  });

  /* ---- Theme buttons ------------------------------------------ */
  document.querySelectorAll('[data-theme]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.documentElement.setAttribute('data-theme', btn.dataset.theme);
      document.querySelectorAll('[data-theme]').forEach(b => {
        b.classList.remove('pill-btn--active');
        b.setAttribute('aria-pressed', 'false');
      });
      btn.classList.add('pill-btn--active');
      btn.setAttribute('aria-pressed', 'true');
    });
  });

  /* ---- Init ---------------------------------------------------- */
  buildBars(TRACKS[0].seed);
  totalTimeEl.textContent = fmt(duration);
  renderAll();
  rafId = requestAnimationFrame(rafLoop);

}());
</script>
</body>
</html>
