<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EaseMotion — Code Snippet</title>
  <link rel="stylesheet" href="../../core/variables.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="demo-container">
    <h1>Code Snippet</h1>
    <p>Styled code block with copy button and language tag.</p>

    <div class="snippet-card">
      <div class="snippet-header">
        <span class="lang-tag">JavaScript</span>
        <button class="copy-btn" onclick="copyCode(this)">📋 Copy</button>
      </div>
      <pre class="code-block"><code id="codeBlock"><span class="kw">const</span> <span class="var">greet</span> = (<span class="param">name</span>) => {
  <span class="kw">if</span> (!<span class="param">name</span>) {
    <span class="kw">return</span> <span class="str">"Hello, World!"</span>;
  }
  <span class="kw">return</span> <span class="str">`Hello, </span><span class="var">${name}</span><span class="str">!`</span>;
};

<span class="comment">// Usage</span>
<span class="fn">console</span>.<span class="fn">log</span>(<span class="fn">greet</span>(<span class="str">"Developer"</span>));</code></pre>
    </div>
  </div>
  <script>
    function copyCode(btn) {
      const code = document.getElementById('codeBlock').textContent;
      navigator.clipboard.writeText(code).then(() => {
        btn.textContent = '✅ Copied!';
        setTimeout(() => btn.textContent = '📋 Copy', 2000);
      });
    }
  </script>
</body>
</html>
