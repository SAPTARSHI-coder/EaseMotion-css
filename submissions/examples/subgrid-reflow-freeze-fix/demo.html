<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EaseMotion CSS Sandbox — Subgrid Reflow Freeze Fix</title>
  
  <!-- Relative path loading your sandbox style context cleanly -->
  <link rel="stylesheet" href="./style.css">
  
  <style>
    body {
      background-color: #0b1121;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 1.5rem;
    }

    /* Interactive resizing handle to test subgrid track recalculations on resize */
    .alm-resizable-subgrid-box {
      width: 100%;
      max-width: 440px;
      resize: horizontal;
      overflow: hidden;
      padding-bottom: 12px;
      border-bottom: 2px dashed rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body>

  <header style="margin-bottom: 2.5rem; text-align: center; max-width: 480px;">
    <h1 style="color: white; margin: 0; font-size: 1.5rem; font-weight: 700;">Subgrid Track Reflow Canvas</h1>
    <p style="color: #64748b; margin: 4px 0 0 0; font-size: 0.875rem; line-height: 1.5;">Drag the bottom-right resize marker in Firefox. Applying <code>min-width: 0; min-height: 0;</code> to subgrids and items clears Gecko's track cache with 0 scripts.</p>
  </header>

  <!-- Sandbox Active Controlled Resizing Container Envelope -->
  <div class="alm-resizable-subgrid-box">
    
    <!-- OUTER PARENT GRID -->
    <div class="alm-parent-grid-stage">
      
      <!-- PERFORMANCE STABILIZED SUBGRID CARD CONTAINER -->
      <div class="alm-subgrid-card">
        
        <!-- SUBGRID CELL ITEM 01 -->
        <div class="alm-subgrid-cell">
          <span class="alm-subgrid-meta">Col_1</span>
          <h4 class="alm-subgrid-text" title="sys_subgrid_node_alpha_token">
            sys_subgrid_node_alpha_token
          </h4>
        </div>

        <!-- SUBGRID CELL ITEM 02 -->
        <div class="alm-subgrid-cell">
          <span class="alm-subgrid-meta">Col_2</span>
          <h4 class="alm-subgrid-text" title="sys_subgrid_node_beta_token">
            sys_subgrid_node_beta_token
          </h4>
        </div>

        <!-- SUBGRID CELL ITEM 03 -->
        <div class="alm-subgrid-cell">
          <span class="alm-subgrid-meta">Col_3</span>
          <h4 class="alm-subgrid-text" title="sys_subgrid_node_gamma_token">
            sys_subgrid_node_gamma_token
          </h4>
        </div>

      </div>

    </div>

  </div>

</body>
</html>
