<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Pure CSS 3D Perspective Tilt Toast notification component."
  >

  <title>3D Perspective Tilt Toast</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="page">
    <section class="demo">
      <p class="eyebrow">EaseMotion CSS</p>

      <h1>3D Perspective Tilt Toast</h1>

      <p class="description">
        A polished CSS notification with a subtle 3D perspective tilt,
        depth, and smooth hover interaction.
      </p>

      <div class="toast-stage">
        <div class="toast-perspective">
          <article
            class="tilt-toast"
            role="status"
            aria-live="polite"
          >
            <div class="toast-icon" aria-hidden="true">
              <span>✓</span>
            </div>

            <div class="toast-content">
              <p class="toast-title">Upload complete</p>

              <p class="toast-message">
                Your project files have been uploaded successfully.
              </p>
            </div>

            <button
              class="toast-close"
              type="button"
              aria-label="Close notification"
            >
              <span aria-hidden="true">&times;</span>
            </button>
          </article>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
