<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Float-Drift Progress Bar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="product-card">
        <div class="product-info">
            <h3 class="product-title">Cloud Storage 1TB</h3>
            <p class="product-desc">Your current storage usage</p>
        </div>
        
        <div class="progress-container">
            <div class="progress-bar">
                <div class="progress-fill">
                    <div class="drift-bubble bubble-1"></div>
                    <div class="drift-bubble bubble-2"></div>
                    <div class="drift-bubble bubble-3"></div>
                </div>
            </div>
            <div class="progress-labels">
                <span>0 GB</span>
                <span>650 GB Used</span>
            </div>
        </div>
    </div>
</body>
</html>
