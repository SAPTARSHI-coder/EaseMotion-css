<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Mobile-first Hero - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="em-hero-page">
        <!-- Pure CSS Mobile-First Responsive Hero Section -->
        <section class="em-hero-section" role="region" aria-label="Mobile-first Hero Showcase" tabindex="0">
            <div class="em-hero-content">
                <span class="em-hero-badge">MOBILE-FIRST DESIGN</span>
                <h1 class="em-hero-title">Responsive Hero Section</h1>
                <p class="em-hero-desc">A smooth, accessible, and performant pure CSS mobile-first hero section that transitions seamlessly from a stacked layout on mobile devices to a side-by-side layout on desktop viewports.</p>
                <div class="em-hero-actions">
                    <a href="#" class="em-btn em-btn-primary" role="button">Get Started</a>
                    <a href="#" class="em-btn em-btn-secondary" role="button">View Documentation</a>
                </div>
            </div>
            
            <div class="em-hero-visual" aria-hidden="true">
                <div class="em-visual-card">
                    <div class="em-visual-pulse"></div>
                    <div class="em-visual-line em-line-lg"></div>
                    <div class="em-visual-line em-line-md"></div>
                    <div class="em-visual-line em-line-sm"></div>
                </div>
            </div>
        </section>
    </div>
</body>
</html>
