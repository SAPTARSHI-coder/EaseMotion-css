<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Ripple-wave hero section for fintech dashboards">
  <title>Ripple Wave Fintech Hero</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="hero">
    <div class="hero__ripple hero__ripple--one"></div>
    <div class="hero__ripple hero__ripple--two"></div>
    <div class="hero__ripple hero__ripple--three"></div>

    <div class="hero__content">
      <span class="hero__badge">FINTECH PLATFORM</span>

      <h1>
        Smarter Finance.<br>
        Better Decisions.
      </h1>

      <p>
        Manage your finances, track performance, and discover
        actionable insights from one intelligent dashboard.
      </p>

      <div class="hero__actions">
        <a href="#" class="hero__button hero__button--primary">
          Get Started
        </a>

        <a href="#" class="hero__button hero__button--secondary">
          View Dashboard
        </a>
      </div>
    </div>

    <div class="hero__stats" aria-label="Platform statistics">
      <div class="stat-card">
        <strong>$24.8M</strong>
        <span>Assets Managed</span>
      </div>

      <div class="stat-card">
        <strong>18.6K</strong>
        <span>Active Users</span>
      </div>

      <div class="stat-card">
        <strong>+24.8%</strong>
        <span>Portfolio Growth</span>
      </div>
    </div>
  </main>

</body>
</html>
