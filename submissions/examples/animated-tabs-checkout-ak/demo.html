<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Commerce Checkout Jello-Hover Tabs | EaseMotion CSS</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="ease-center ease-fade-in" style="min-height: 100vh; background: #0f172a; font-family: 'Inter', sans-serif; padding: 2rem;">

  <div class="tabs-container">
    <header class="tabs-header ease-slide-up">
      <h1 class="ease-fade-in">Checkout Steps</h1>
      <p class="ease-slide-up ease-delay-100">Pure CSS interactive tabs featuring a smooth jello-hover transition for secure checkouts.</p>
    </header>

    <!-- Tabs Wrapper -->
    <div class="ease-tabs-checkout-ak ease-slide-up ease-delay-200">
      <div class="tabs-list" role="tablist">
        <button role="tab" aria-selected="true" class="tab-btn active">1. Shipping</button>
        <button role="tab" aria-selected="false" class="tab-btn">2. Payment</button>
        <button role="tab" aria-selected="false" class="tab-btn">3. Review</button>
      </div>
      <div class="tabs-panels">
        <div role="tabpanel" class="tab-panel active">
          <h3>Shipping Information</h3>
          <p>Enter your delivery address to proceed with encrypted zero-JS transaction flows.</p>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
