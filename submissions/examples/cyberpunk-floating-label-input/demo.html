<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Cyberpunk Floating Label Input</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="cyber-demo">

    <section class="cyber-card">

      <div class="cyber-header">
        <span class="cyber-status">SYSTEM ONLINE</span>

        <h1>Cyberpunk Input</h1>

        <p>
          Responsive floating labels with a futuristic interface.
        </p>
      </div>

      <form class="cyber-form">

        <div class="cyber-field">
          <input
            class="cyber-input"
            type="text"
            id="username"
            name="username"
            placeholder=" "
            autocomplete="username"
            required
          >

          <label class="cyber-label" for="username">
            Username
          </label>
        </div>

        <div class="cyber-field">
          <input
            class="cyber-input"
            type="email"
            id="email"
            name="email"
            placeholder=" "
            autocomplete="email"
            required
          >

          <label class="cyber-label" for="email">
            Email Address
          </label>
        </div>

        <div class="cyber-field">
          <input
            class="cyber-input"
            type="password"
            id="password"
            name="password"
            placeholder=" "
            autocomplete="new-password"
            required
          >

          <label class="cyber-label" for="password">
            Access Code
          </label>
        </div>

        <div class="cyber-field">
          <textarea
            class="cyber-input cyber-textarea"
            id="message"
            name="message"
            placeholder=" "
            rows="4"
          ></textarea>

          <label class="cyber-label" for="message">
            Transmission
          </label>
        </div>

        <button class="cyber-button" type="submit">
          INITIALIZE
        </button>

      </form>

    </section>

  </main>

</body>
</html>
