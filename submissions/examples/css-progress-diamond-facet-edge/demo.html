<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Diamond Facet Edge CSS progress bar"
    >

    <title>Diamond Facet Edge Progress</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="page">
        <section class="progress-card" aria-labelledby="progress-title">

            <div class="card-header">
                <div>
                    <p class="eyebrow">CSS PROGRESS</p>
                    <h1 id="progress-title">Diamond Facet Edge</h1>
                </div>

                <span class="percentage">72%</span>
            </div>

            <div
                class="progress"
                role="progressbar"
                aria-label="Project completion"
                aria-valuemin="0"
                aria-valuemax="100"
                aria-valuenow="72"
            >
                <div class="progress-fill">
                    <span class="facet facet-left" aria-hidden="true"></span>
                    <span class="facet facet-right" aria-hidden="true"></span>
                </div>
            </div>

            <div class="progress-info">
                <span>Project completion</span>
                <span>72 / 100</span>
            </div>

        </section>
    </main>

</body>
</html>
