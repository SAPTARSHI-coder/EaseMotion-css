<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Widget: Modern Origami Paper Fold (#75182)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="demo-stage">
    <!-- Ambient Lighting & Origami Wireframe Grid (Decorative) -->
    <div class="demo-bg-glow" aria-hidden="true"></div>
    <div class="demo-bg-pattern" aria-hidden="true"></div>

    <!-- Origami Showcase Viewport -->
    <section class="demo-viewport">
      
      <!-- Origami Dashboard Card -->
      <article class="origami-card" tabindex="0" aria-labelledby="widget-heading">
        
        <!-- 3D Origami Geometry Planes (Decorative Visual Layer - Hidden from Accessibility Tree) -->
        <div class="origami-geometry" aria-hidden="true">
          <!-- Ambient Drop Shadow Layer -->
          <div class="origami-plane origami-plane--shadow"></div>
          
          <!-- Chamfered Base Paper Sheet -->
          <div class="origami-plane origami-plane--base">
            <div class="origami-texture"></div>
          </div>
          
          <!-- Top Folded Header Banner Flap -->
          <div class="origami-plane origami-plane--top-flap">
            <div class="origami-crease origami-crease--top"></div>
          </div>
          
          <!-- Top-Right Geometric Folded Corner Flap -->
          <div class="origami-plane origami-plane--corner">
            <div class="origami-plane--corner-underlayer"></div>
            <div class="origami-plane--corner-fold"></div>
          </div>
          
          <!-- Left Wing Accent Fold -->
          <div class="origami-plane origami-plane--side-wing"></div>

          <!-- Right Wing Accent Fold -->
          <div class="origami-plane origami-plane--right-wing"></div>
          
          <!-- Bottom Origami Tray Fold -->
          <div class="origami-plane origami-plane--bottom-fold">
            <div class="origami-crease origami-crease--bottom"></div>
          </div>
        </div>

        <!-- Accessible Dashboard Content (Elevated in 3D Space) -->
        <div class="origami-card__content">
          
          <!-- Header Section -->
          <header class="widget-header">
            <div class="widget-header__title-group">
              <div class="widget-header__badge">
                <span class="widget-header__badge-spark" aria-hidden="true">✦</span>
                <span class="widget-header__badge-text">Cluster Node 07</span>
              </div>
              <h2 id="widget-heading" class="widget-header__title">System Overview</h2>
            </div>
            
            <div class="widget-header__status widget-header__status--operational" title="System Status: Operational">
              <span class="widget-header__status-dot" aria-hidden="true"></span>
              <span class="widget-header__status-text">Operational</span>
            </div>
          </header>

          <!-- Primary Performance Metric Display -->
          <section class="widget-metric" aria-label="Overall Performance Metric">
            <div class="widget-metric__header">
              <span class="widget-metric__label">Overall Efficiency</span>
              <span class="widget-metric__trend widget-metric__trend--up" aria-label="Increased by 4.2 percent over last hour">
                <span class="widget-metric__trend-arrow" aria-hidden="true">↑</span> +4.2%
              </span>
            </div>
            
            <div class="widget-metric__value-group">
              <span class="widget-metric__value">87<span class="widget-metric__unit">%</span></span>
              <span class="widget-metric__subtext">Target: 95.0%</span>
            </div>
            
            <!-- Accessible Progress Track -->
            <div class="widget-progress" role="progressbar" aria-valuenow="87" aria-valuemin="0" aria-valuemax="100" aria-label="System efficiency level at 87 percent">
              <div class="widget-progress__track">
                <div class="widget-progress__fill" style="--progress: 87%;">
                  <div class="widget-progress__glimmer" aria-hidden="true"></div>
                </div>
              </div>
            </div>
          </section>

          <!-- Grid Breakdown of Secondary Metrics -->
          <section class="widget-details" aria-label="System Metrics Breakdown">
            <dl class="widget-grid">
              <div class="widget-grid__item">
                <dt class="widget-grid__label">
                  <span class="widget-grid__icon" aria-hidden="true">⚡</span>
                  CPU Load
                </dt>
                <dd class="widget-grid__value">34.2%</dd>
              </div>

              <div class="widget-grid__item">
                <dt class="widget-grid__label">
                  <span class="widget-grid__icon" aria-hidden="true">💾</span>
                  Memory
                </dt>
                <dd class="widget-grid__value">6.8 GB</dd>
              </div>

              <div class="widget-grid__item">
                <dt class="widget-grid__label">
                  <span class="widget-grid__icon" aria-hidden="true">⏱</span>
                  Uptime
                </dt>
                <dd class="widget-grid__value">99.98%</dd>
              </div>
            </dl>
          </section>

          <!-- Interactive Footer Section -->
          <footer class="widget-footer">
            <div class="widget-footer__timestamp">
              <span class="widget-footer__sync-icon" aria-hidden="true">◷</span>
              <span>Updated 2 mins ago</span>
            </div>
            
            <a href="#analytics" class="widget-footer__action" aria-label="View system detailed analytics report">
              <span>View Analytics</span>
              <span class="widget-footer__action-arrow" aria-hidden="true">→</span>
            </a>
          </footer>

        </div>
      </article>

    </section>
  </main>

</body>
</html>
