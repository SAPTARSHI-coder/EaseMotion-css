<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Shimmer-Sweep Carousel</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<section class="carousel">

    <h1>Creative Portfolio Carousel</h1>

    <div class="carousel-track">

        <article class="card">
            <img src="https://picsum.photos/400/300?1" alt="Creative Design">
            <div class="card-content">
                <h2>Brand Identity</h2>
                <p>Create memorable visual identities with modern design systems.</p>
            </div>
        </article>

        <article class="card active">
            <img src="https://picsum.photos/400/300?2" alt="Portfolio Project">
            <div class="card-content">
                <h2>UI / UX Design</h2>
                <p>Design intuitive digital experiences using responsive layouts.</p>
            </div>
        </article>

        <article class="card">
            <img src="https://picsum.photos/400/300?3" alt="Creative Layout">
            <div class="card-content">
                <h2>Web Development</h2>
                <p>Build lightweight and interactive portfolio websites.</p>
            </div>
        </article>

    </div>

</section>

</body>
</html>
