<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Engraving Burin Cut — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Engraving Burin Cut demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Engraving Burin Cut</h1>
      <p class="lede">Engraving burin cutting a bright metal furrow</p>
    </header>

    <section class="ease-engraving-burin-cut" data-demo="engraving-burin-cut" aria-live="polite">
      <div class="ease-engraving-burin-cut__housing">
        <div class="ease-engraving-burin-cut__bezel">
          <div class="ease-engraving-burin-cut__face">
            <div class="ease-engraving-burin-cut__readout">
              <span class="ease-engraving-burin-cut__label">Engraving Burin Cut</span>
              <span class="ease-engraving-burin-cut__value">LIVE</span>
            </div>
            <div class="ease-engraving-burin-cut__motion" aria-hidden="true">
              <span class="ease-engraving-burin-cut__a"></span>
              <span class="ease-engraving-burin-cut__b"></span>
              <span class="ease-engraving-burin-cut__c"></span>
              <span class="ease-engraving-burin-cut__d"></span>
            </div>
            <div class="ease-engraving-burin-cut__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-engraving-burin-cut__controls">
          <button type="button" class="ease-engraving-burin-cut__btn primary">Engage</button>
          <button type="button" class="ease-engraving-burin-cut__btn">Reset</button>
          <label class="ease-engraving-burin-cut__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-engraving-burin-cut__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
