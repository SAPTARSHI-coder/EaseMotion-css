<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Ripple Grid Background</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="ripple-page">

    <div class="grid-background" id="gridBackground"></div>

    <div class="background-glow"></div>

    <section class="content">

      <span class="badge">
        EASEMOTION
      </span>

      <h1>
        Ripple Grid
        <span>Background</span>
      </h1>

      <p>
        Move your cursor across the grid to create
        interactive waves that propagate from the
        pointer position.
      </p>

      <div class="interaction-hint">
        <span class="cursor-icon">✦</span>
        Move your cursor to interact
      </div>

    </section>

  </main>


  <script>

    const grid = document.getElementById("gridBackground");

    const CELL_SIZE = 38;

    let columns = 0;
    let rows = 0;

    let cells = [];

    let pointerX = -1000;
    let pointerY = -1000;

    let animationFrame = null;


    function createGrid() {

      grid.innerHTML = "";

      columns = Math.ceil(window.innerWidth / CELL_SIZE);
      rows = Math.ceil(window.innerHeight / CELL_SIZE);

      grid.style.gridTemplateColumns =
        `repeat(${columns}, ${CELL_SIZE}px)`;

      grid.style.gridTemplateRows =
        `repeat(${rows}, ${CELL_SIZE}px)`;

      cells = [];

      for (let row = 0; row < rows; row++) {

        for (let column = 0; column < columns; column++) {

          const cell = document.createElement("span");

          cell.className = "grid-cell";

          cell.dataset.row = row;
          cell.dataset.column = column;

          grid.appendChild(cell);

          cells.push({
            element: cell,
            x: column * CELL_SIZE + CELL_SIZE / 2,
            y: row * CELL_SIZE + CELL_SIZE / 2
          });

        }

      }

    }


    function updateRipple() {

      cells.forEach((cell) => {

        const distance = Math.sqrt(
          Math.pow(cell.x - pointerX, 2) +
          Math.pow(cell.y - pointerY, 2)
        );

        const wave =
          Math.sin(distance * 0.08 - performance.now() * 0.006);

        const influence =
          Math.max(0, 1 - distance / 280);

        const intensity =
          Math.max(0, wave) * influence;

        cell.element.style.setProperty(
          "--intensity",
          intensity.toFixed(3)
        );

        cell.element.style.setProperty(
          "--scale",
          (1 + intensity * 0.8).toFixed(3)
        );

      });

      animationFrame = requestAnimationFrame(updateRipple);

    }


    function updatePointer(clientX, clientY) {

      pointerX = clientX;
      pointerY = clientY;

    }


    window.addEventListener(
      "pointermove",
      (event) => {

        updatePointer(
          event.clientX,
          event.clientY
        );

      }
    );


    window.addEventListener(
      "pointerleave",
      () => {

        pointerX = -1000;
        pointerY = -1000;

      }
    );


    window.addEventListener(
      "resize",
      () => {

        cancelAnimationFrame(animationFrame);

        createGrid();

        updateRipple();

      }
    );


    createGrid();

    updateRipple();

  </script>

</body>
</html>
