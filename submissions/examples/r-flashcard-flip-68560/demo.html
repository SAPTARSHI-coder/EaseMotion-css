<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Pure CSS interactive flashcard flip component."
  >
  <title>CSS Flashcard Flip</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">
    <section class="flashcard-section" aria-labelledby="page-title">
      <span class="eyebrow">Study Component</span>
      <h1 id="page-title">CSS Flashcard Flip</h1>
      <p class="intro">
        Hover or focus the card to reveal the answer.
      </p>

      <div class="card-scene">
        <div
          class="flashcard"
          tabindex="0"
          role="group"
          aria-label="Flashcard: What does CSS stand for?"
        >
          <div class="card-face card-front">
            <span class="card-number">01</span>

            <div class="question-icon" aria-hidden="true">?</div>

            <span class="card-label">Question</span>
            <h2>What does CSS stand for?</h2>

            <span class="flip-hint">
              Hover or focus to reveal
            </span>
          </div>

          <div class="card-face card-back">
            <span class="card-number">01</span>

            <div class="answer-icon" aria-hidden="true">✓</div>

            <span class="card-label">Answer</span>
            <h2>Cascading Style Sheets</h2>

            <p>
              CSS is used to style and visually present HTML
              elements on a web page.
            </p>
          </div>
        </div>
      </div>
    </section>
  </main>

</body>
</html>
