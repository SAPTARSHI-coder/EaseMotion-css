<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-fishing-rod-cast demo</title>
</head>
<body>
<div class="fr-app">
  <div class="fr-sky">
    <div class="fr-sun"></div>
    <span class="fr-cloud fr-cloud-1"></span>
    <span class="fr-cloud fr-cloud-2"></span>
  </div>
  <div class="fr-bank">
    <div class="fr-angler">
      <div class="fr-head"></div>
      <div class="fr-body"></div>
      <div class="fr-hat"></div>
      <div class="fr-arm"></div>
      <div class="fr-rod">
        <div class="fr-reel"></div>
        <div class="fr-tip"></div>
      </div>
    </div>
  </div>
  <div class="fr-water">
    <div class="fr-line"></div>
    <div class="fr-bobber"></div>
    <span class="fr-ripple fr-ripple-1"></span>
    <span class="fr-ripple fr-ripple-2"></span>
  </div>
</div>
</body>
</html>
