<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Heartbeat Progress | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="heartbeat-card" aria-label="Heartbeat progress tracker">
    <header class="heartbeat-header">
      <div>
        <h1>CSS Heartbeat Progress</h1>
        <p>Heart rate pulse accelerates as progress stage increases</p>
      </div>
    </header>

    <!-- Hidden Radio Controls for Stage Management -->
    <input type="radio" name="progress-stage" id="stage-25" checked aria-label="Stage 1: 25 percent progress (Resting BPM)">
    <input type="radio" name="progress-stage" id="stage-50" aria-label="Stage 2: 50 percent progress (Warmup BPM)">
    <input type="radio" name="progress-stage" id="stage-75" aria-label="Stage 3: 75 percent progress (Cardio BPM)">
    <input type="radio" name="progress-stage" id="stage-100" aria-label="Stage 4: 100 percent progress (Peak BPM)">

    <!-- Stage Buttons -->
    <nav class="stage-selector" aria-label="Select progress stage">
      <label for="stage-25" class="stage-btn">25% (60 BPM)</label>
      <label for="stage-50" class="stage-btn">50% (90 BPM)</label>
      <label for="stage-75" class="stage-btn">75% (130 BPM)</label>
      <label for="stage-100" class="stage-btn">100% (175 BPM)</label>
    </nav>

    <!-- ECG Visualizer Viewport -->
    <div class="ecg-container" aria-label="Dynamic heartbeat ECG display container">
      <div class="ecg-grid" aria-hidden="true"></div>
      <svg class="ecg-svg" viewBox="0 0 500 100" preserveAspectRatio="none" role="img" aria-label="Heart rate waveform line">
        <path class="ecg-path" d="M 0 50 L 80 50 L 95 30 L 110 70 L 125 10 L 140 90 L 155 50 L 170 50 L 250 50 L 265 30 L 280 70 L 295 10 L 310 90 L 325 50 L 340 50 L 500 50" />
      </svg>
    </div>

    <!-- Progress Indicator Bar -->
    <div class="progress-bar-wrapper" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="25" aria-label="Overall activity completion progress">
      <div class="progress-fill"></div>
    </div>
  </main>
</body>
</html>
