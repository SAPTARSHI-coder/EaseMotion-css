<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ease Glowing Border Card</title>
    <link rel="stylesheet" href="../../../easemotion.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="ease-glowing-card-wrapper">
        <div class="ease-glowing-card">
            <!-- The pseudo-elements in CSS handle the spinning conic gradient -->
            
            <!-- Inner content layer masking the gradient -->
            <div class="ease-glowing-card-inner">
                <h3 class="ease-glow-title">Pro Tier</h3>
                <p class="ease-glow-desc">
                    Unlock advanced features, priority support, and unlimited projects.
                </p>
                <div class="ease-glow-price">$29<span>/mo</span></div>
                <button class="ease-glow-btn">Get Started</button>
            </div>
        </div>
    </div>
</body>
</html>
