<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Animated Dropdown Menu - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="dropdown-page">

    <header class="dropdown-header">
      <span class="section-pill">UI Component</span>
      <h1>Animated Dropdown Menu</h1>
      <p>
        A modern dropdown menu built with pure HTML and CSS.
        Click the button to open the menu.
      </p>
    </header>

    <section class="dropdown-wrapper">

      <div class="dropdown">

        <input
          type="checkbox"
          id="dropdown-state"
          class="dropdown-state"
          aria-label="Toggle dropdown menu"
        />

        <label for="dropdown-state" class="dropdown-toggle">
          <span>Options</span>
          <span class="dropdown-arrow"></span>
        </label>

        <ul class="dropdown-menu">
          <li>
            <a href="#">Profile</a>
          </li>

          <li>
            <a href="#">Settings</a>
          </li>

          <li>
            <a href="#">Billing</a>
          </li>

          <li>
            <a href="#">Support</a>
          </li>

          <li class="dropdown-divider"></li>

          <li>
            <a href="#" class="danger">Logout</a>
          </li>
        </ul>

      </div>

    </section>

  </main>

</body>
</html>
