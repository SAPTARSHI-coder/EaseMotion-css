<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />
  <meta
    name="description"
    content="Animated retro-style CSS slider."
  />
  <title>Animated Retro Slider</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <section class="slider-demo" aria-labelledby="slider-title">
      <span class="eyebrow">CSS COMPONENT / 78319</span>

      <h1 id="slider-title">Animated Retro Slider</h1>

      <p class="intro">
        A responsive CSS-only slider with arcade-inspired styling
        and animated controls.
      </p>

      <div class="slider-shell">
        <div class="slider-header">
          <span>VOLUME</span>
          <span class="value">80%</span>
        </div>

        <div class="slider-row">
          <span class="slider-mark">0</span>

          <label class="slider-control">
            <input
              type="range"
              min="0"
              max="100"
              value="80"
              aria-label="Volume"
            />
            <span class="slider-track" aria-hidden="true"></span>
            <span class="slider-thumb" aria-hidden="true"></span>
          </label>

          <span class="slider-mark">100</span>
        </div>

        <div class="slider-status">
          <span class="status-dot"></span>
          <span>SIGNAL ACTIVE</span>
        </div>
      </div>

      <div class="feature-row">
        <span>CSS ONLY</span>
        <span>RESPONSIVE</span>
        <span>ANIMATED</span>
      </div>
    </section>
  </main>
</body>
</html>
