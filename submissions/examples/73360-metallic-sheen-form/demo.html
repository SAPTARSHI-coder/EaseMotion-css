<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>Metallic Sheen Form</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">
    <section class="form-card" aria-labelledby="form-title">
      <div class="form-header">
        <span class="eyebrow">METALLIC FORM</span>
        <h1 id="form-title">Contact Us</h1>
        <p>
          A polished form interface with a subtle metallic sheen effect.
        </p>
      </div>

      <form class="metallic-form" action="#" method="post">

        <div class="field">
          <label for="name">Full Name</label>
          <div class="input-wrap">
            <input
              id="name"
              name="name"
              type="text"
              placeholder="Enter your name"
              autocomplete="name"
              required
            >
          </div>
        </div>

        <div class="field">
          <label for="email">Email Address</label>
          <div class="input-wrap">
            <input
              id="email"
              name="email"
              type="email"
              placeholder="you@example.com"
              autocomplete="email"
              required
            >
          </div>
        </div>

        <div class="field">
          <label for="subject">Subject</label>
          <div class="input-wrap">
            <select id="subject" name="subject" required>
              <option value="" selected disabled>Select a subject</option>
              <option value="general">General Inquiry</option>
              <option value="support">Technical Support</option>
              <option value="feedback">Feedback</option>
              <option value="collaboration">Collaboration</option>
            </select>
          </div>
        </div>

        <div class="field">
          <label for="message">Message</label>
          <div class="input-wrap textarea-wrap">
            <textarea
              id="message"
              name="message"
              rows="5"
              placeholder="Write your message..."
              required
            ></textarea>
          </div>
        </div>

        <label class="check-row">
          <input type="checkbox" name="updates">
          <span class="custom-check" aria-hidden="true"></span>
          <span>Send me occasional updates</span>
        </label>

        <button class="submit-btn" type="submit">
          <span>Send Message</span>
          <span class="arrow" aria-hidden="true">→</span>
        </button>

      </form>
    </section>
  </main>

</body>
</html>
