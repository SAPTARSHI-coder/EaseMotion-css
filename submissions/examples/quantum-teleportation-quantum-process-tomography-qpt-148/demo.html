<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Process Tomography QPT - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css"></head><body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030712; color: #ffffff;">

    <div class="ease-card ease-card-glass qpt-container">
        <div class="qpt-header">
            <h2>Quantum Process Tomography</h2>
            <span class="ease-badge ease-badge-secondary">Quantum Information</span>
        </div>
        
        <div class="qpt-screen ease-center">
            <div class="qpt-flux flux-qpt-a"></div>
            <div class="qpt-flux flux-qpt-b"></div>
            <div class="qpt-boundary-ring"></div>
            <div class="qpt-core ease-center"></div>
        </div>

        <div class="qpt-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Choi-Jamiolkowski Isomorphism &amp; Gate Maps</span>
            <button class="ease-btn ease-btn-secondary ease-btn-sm ease-hover-grow">Run Process Tomography</button>
        </div>
    </div></body></html>
