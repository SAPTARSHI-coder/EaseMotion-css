<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notification Alert Tag — EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <p class="label">Pure CSS Animated Pulsing Notification Count Tags</p>

  <div class="demo-row">
    <div class="ease-alert-tag">
      <span>Messages</span>
      <span class="ease-alert-count">3</span>
    </div>

    <div class="ease-alert-tag ease-alert-tag--primary">
      <span>Updates</span>
      <span class="ease-alert-count">12</span>
    </div>
  </div>

</body>
</html>
