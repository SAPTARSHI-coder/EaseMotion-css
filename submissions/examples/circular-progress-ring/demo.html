<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Circular Progress Ring</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="ring-box">
    <svg class="progress-ring" width="120" height="120">
      <circle class="ring-bg" stroke="#1e293b" stroke-width="8" fill="transparent" r="50" cx="60" cy="60" />
      <circle class="ring-fill" stroke="#10b981" stroke-width="8" fill="transparent" r="50" cx="60" cy="60" />
    </svg>
    <div class="ring-label">75%</div>
  </div>
</body>
</html>
