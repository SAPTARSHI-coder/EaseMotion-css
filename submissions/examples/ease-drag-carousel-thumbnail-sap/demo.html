<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ease-drag-carousel-thumbnail-sap demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { height: 100vh; margin: 0; display: flex; align-items: center; justify-content: center; background: #f4f4f5; }
  </style>
</head>
<body>
  <div class="thumb-carousel-sap">
    <div class="main-view"><img id="mainImg" src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=600" alt="Main"></div>
    <div class="thumb-strip" id="strip">
      <div class="thumb active" data-src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=600"><img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=150"></div>
      <div class="thumb" data-src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=600"><img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=150"></div>
      <div class="thumb" data-src="https://images.unsplash.com/photo-1519681393784-d120267933ba?w=600"><img src="https://images.unsplash.com/photo-1519681393784-d120267933ba?w=150"></div>
      <div class="thumb" data-src="https://images.unsplash.com/photo-1449824913935-59a10b8d2000?w=600"><img src="https://images.unsplash.com/photo-1449824913935-59a10b8d2000?w=150"></div>
    </div>
  </div>
  <script>
    const strip = document.getElementById('strip');
    const mainImg = document.getElementById('mainImg');
    const thumbs = [...strip.querySelectorAll('.thumb')];

    thumbs.forEach(t => t.addEventListener('click', () => {
      thumbs.forEach(x => x.classList.remove('active'));
      t.classList.add('active');
      mainImg.src = t.dataset.src;
    }));

    let dragging = false, startX = 0, scrollStart = 0;
    strip.addEventListener('mousedown', (e) => {
      dragging = true;
      strip.classList.add('dragging');
      startX = e.clientX;
      scrollStart = strip.scrollLeft;
    });
    window.addEventListener('mousemove', (e) => {
      if (!dragging) return;
      strip.scrollLeft = scrollStart - (e.clientX - startX);
    });
    window.addEventListener('mouseup', () => { dragging = false; strip.classList.remove('dragging'); });
  </script>
</body>
</html>
