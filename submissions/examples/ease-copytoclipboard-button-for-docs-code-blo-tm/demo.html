<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Copy-to-Clipboard Button</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="ccb-wrapper">

    <h2 style="font-size:1.25rem;margin-bottom:0.5rem;">Code Blocks</h2>
    <p style="color:#64748b;font-size:0.875rem;margin-bottom:1rem;">
      Click the copy button to copy code to clipboard.
    </p>

    <div class="ccb-code-block">
      <button class="ccb-copy-btn" data-code="npm install easemotion" aria-label="Copy code">
        <svg class="ccb-icon-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
        </svg>
        <svg class="ccb-icon-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
        <span class="ccb-tooltip">Copy</span>
      </button>
      <code class="ccb-code">npm install easemotion</code>
    </div>

    <div class="ccb-code-block" style="margin-top:1rem;">
      <button class="ccb-copy-btn" data-code="import { easeFadeIn } from 'easemotion';" aria-label="Copy code">
        <svg class="ccb-icon-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
        </svg>
        <svg class="ccb-icon-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
        <span class="ccb-tooltip">Copy</span>
      </button>
      <code class="ccb-code">import { easeFadeIn } from 'easemotion';</code>
    </div>

    <div class="ccb-code-block" style="margin-top:1rem;">
      <button class="ccb-copy-btn" data-code="div { animation: ease-fade-in 0.5s ease forwards; }" aria-label="Copy code">
        <svg class="ccb-icon-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
        </svg>
        <svg class="ccb-icon-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
        <span class="ccb-tooltip">Copy</span>
      </button>
      <code class="ccb-code">div {
  animation: ease-fade-in 0.5s ease forwards;
}</code>
    </div>

  </div>

  <script>
    document.querySelectorAll('.ccb-copy-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const code = btn.dataset.code;
        navigator.clipboard.writeText(code).then(() => {
          btn.classList.add('copied');
          const tooltip = btn.querySelector('.ccb-tooltip');
          tooltip.textContent = 'Copied!';
          tooltip.classList.add('show');
          setTimeout(() => {
            btn.classList.remove('copied');
            tooltip.textContent = 'Copy';
            tooltip.classList.remove('show');
          }, 2000);
        });
      });
    });
  </script>

</body>
</html>
