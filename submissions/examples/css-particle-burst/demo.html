<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Pure CSS particle burst animation effect"
  >
  <title>CSS Particle Burst</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="burst-scene" aria-label="Particle burst animation">
    <div class="burst" aria-hidden="true">
      <span class="particle particle-1"></span>
      <span class="particle particle-2"></span>
      <span class="particle particle-3"></span>
      <span class="particle particle-4"></span>
      <span class="particle particle-5"></span>
      <span class="particle particle-6"></span>
      <span class="particle particle-7"></span>
      <span class="particle particle-8"></span>
      <span class="particle particle-9"></span>
      <span class="particle particle-10"></span>
      <span class="particle particle-11"></span>
      <span class="particle particle-12"></span>
    </div>

    <section class="content">
      <span class="label">CSS Particle Effect</span>
      <h1>Particle Burst</h1>
      <p>
        A smooth radial burst of particles created entirely with HTML and CSS.
      </p>
    </section>
  </main>
</body>
</html>
