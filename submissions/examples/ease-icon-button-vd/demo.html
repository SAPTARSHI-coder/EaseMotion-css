<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ease Icon Button</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="button-demo">

    <button class="icon-button small" aria-label="Search">
        ⌕
    </button>

    <button class="icon-button" aria-label="Settings">
        ⚙
    </button>

    <button class="icon-button large" aria-label="Add">
        +
    </button>

    <button class="icon-button" aria-label="Delete">
        ×
    </button>

</div>

</body>
</html>
