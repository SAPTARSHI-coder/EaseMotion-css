<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bolt Cutter Jaws — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Bolt Cutter Jaws demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Bolt Cutter Jaws</h1>
      <p class="lede">Heavy bolt-cutter jaws closing through a padlock shackle</p>
    </header>

    <section class="ease-bolt-cutter-jaws" data-demo="bolt-cutter-jaws" aria-live="polite">
      <div class="ease-bolt-cutter-jaws__housing">
        <div class="ease-bolt-cutter-jaws__bezel">
          <div class="ease-bolt-cutter-jaws__face">
            <div class="ease-bolt-cutter-jaws__readout">
              <span class="ease-bolt-cutter-jaws__label">Bolt Cutter Jaws</span>
              <span class="ease-bolt-cutter-jaws__value">LIVE</span>
            </div>
            <div class="ease-bolt-cutter-jaws__motion" aria-hidden="true">
              <span class="ease-bolt-cutter-jaws__a"></span>
              <span class="ease-bolt-cutter-jaws__b"></span>
              <span class="ease-bolt-cutter-jaws__c"></span>
              <span class="ease-bolt-cutter-jaws__d"></span>
            </div>
            <div class="ease-bolt-cutter-jaws__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-bolt-cutter-jaws__controls">
          <button type="button" class="ease-bolt-cutter-jaws__btn primary">Engage</button>
          <button type="button" class="ease-bolt-cutter-jaws__btn">Reset</button>
          <label class="ease-bolt-cutter-jaws__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-bolt-cutter-jaws__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
