<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scale Hover Carousel</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <h1>Fintech Dashboard</h1>
  <p class="subtitle">
    Scale-Hover Carousel for Financial Insights
  </p>

  <div class="carousel">

    <div class="card">
      <div class="icon">📈</div>

      <h2>Portfolio Growth</h2>

      <div class="value">+18.2%</div>

      <p>Monthly Return</p>
    </div>

    <div class="card">
      <div class="icon">💰</div>

      <h2>Revenue</h2>

      <div class="value">$24,800</div>

      <p>This Month</p>
    </div>

    <div class="card">
      <div class="icon">🏦</div>

      <h2>Investments</h2>

      <div class="value">14 Assets</div>

      <p>Currently Active</p>
    </div>

  </div>

</div>

</body>
</html>
