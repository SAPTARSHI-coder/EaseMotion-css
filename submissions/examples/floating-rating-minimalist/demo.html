<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Floating Rating - Minimalist</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main class="demo-page">
    <section class="rating-card" aria-labelledby="rating-title">
      <div class="rating-header">
        <span class="rating-eyebrow">CUSTOMER RATING</span>

        <h1 id="rating-title">How was your experience?</h1>

        <p class="rating-description">
          Share your feedback by selecting a rating below.
        </p>
      </div>

      <div
        class="rating"
        role="radiogroup"
        aria-label="Rate your experience from one to five stars"
      >
        <input
          type="radio"
          id="rating-5"
          name="rating"
          value="5"
        />
        <label for="rating-5" aria-label="5 stars">★</label>

        <input
          type="radio"
          id="rating-4"
          name="rating"
          value="4"
        />
        <label for="rating-4" aria-label="4 stars">★</label>

        <input
          type="radio"
          id="rating-3"
          name="rating"
          value="3"
        />
        <label for="rating-3" aria-label="3 stars">★</label>

        <input
          type="radio"
          id="rating-2"
          name="rating"
          value="2"
        />
        <label for="rating-2" aria-label="2 stars">★</label>

        <input
          type="radio"
          id="rating-1"
          name="rating"
          value="1"
        />
        <label for="rating-1" aria-label="1 star">★</label>
      </div>

      <div class="rating-footer">
        <span class="rating-hint">Tap a star to rate</span>

        <span class="rating-scale" aria-hidden="true">
          1 — 5
        </span>
      </div>
    </section>
  </main>
</body>
</html>
