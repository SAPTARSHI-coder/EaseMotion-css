<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Slide-Right Tabs - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="dashboard-wrapper">
        <header class="dashboard-header">
            <h1>Analytics Overview</h1>
            <p>Real-time metrics and slide-right interactions for data dashboards.</p>
        </header>

        <div class="em-tabs-container">
            <input type="radio" id="em-tab-1" name="em-tabs" class="em-tab-input" checked>
            <input type="radio" id="em-tab-2" name="em-tabs" class="em-tab-input">
            <input type="radio" id="em-tab-3" name="em-tabs" class="em-tab-input">

            <div class="em-tabs-header">
                <label for="em-tab-1" class="em-tab-label" tabindex="0">Traffic</label>
                <label for="em-tab-2" class="em-tab-label" tabindex="0">Acquisition</label>
                <label for="em-tab-3" class="em-tab-label" tabindex="0">Behavior</label>
            </div>

            <div class="em-tabs-content">
                <div class="em-tab-panel" id="em-panel-1">
                    <div class="kpi-grid">
                        <div class="kpi-card">
                            <span class="kpi-title">Total Sessions</span>
                            <span class="kpi-value">124,592</span>
                            <span class="kpi-trend positive">↑ 12.5%</span>
                        </div>
                        <div class="kpi-card">
                            <span class="kpi-title">Bounce Rate</span>
                            <span class="kpi-value">42.3%</span>
                            <span class="kpi-trend negative">↓ 1.2%</span>
                        </div>
                    </div>
                </div>
                
                <div class="em-tab-panel" id="em-panel-2">
                    <div class="kpi-grid">
                        <div class="kpi-card">
                            <span class="kpi-title">Organic Search</span>
                            <span class="kpi-value">68,021</span>
                            <span class="kpi-trend positive">↑ 8.4%</span>
                        </div>
                        <div class="kpi-card">
                            <span class="kpi-title">Direct</span>
                            <span class="kpi-value">34,105</span>
                            <span class="kpi-trend neutral">- 0.0%</span>
                        </div>
                    </div>
                </div>
                
                <div class="em-tab-panel" id="em-panel-3">
                    <div class="kpi-grid">
                        <div class="kpi-card">
                            <span class="kpi-title">Avg. Session Duration</span>
                            <span class="kpi-value">02:45</span>
                            <span class="kpi-trend positive">↑ 15s</span>
                        </div>
                        <div class="kpi-card">
                            <span class="kpi-title">Pages per Session</span>
                            <span class="kpi-value">3.24</span>
                            <span class="kpi-trend positive">↑ 0.12</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
