<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Morph-Glow Tooltip | EaseMotion CSS</title>
    
    <!-- Link to the main EaseMotion library core -->
    <link rel="stylesheet" href="../../../core/tooltip.css">

    <!-- Local feature and demo presentation styles -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="demo-container">
        
        <!-- Tooltip Example -->
        <div class="ease-tooltip" data-tooltip="System resources optimal." data-theme="tech" data-animation="morph-glow" data-position="top" tabindex="0">
            <button class="tech-trigger">Hover Me</button>
        </div>

    </main>

</body>
</html>
