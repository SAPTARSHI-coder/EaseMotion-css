<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta
    name="description"
    content="Responsive 3D neumorphic spinner built with HTML and CSS."
  />

  <title>3D Neumorphic Spinner</title>

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <section class="showcase" aria-label="3D Neumorphic Spinner Demo">
      <p class="eyebrow">EASEMOTION CSS</p>

      <h1>3D Neumorphic Spinner</h1>

      <p class="description">
        A soft 3D loading spinner created using layered shadows,
        gradients and pure CSS animation.
      </p>

      <div class="spinner-stage">
        <div class="spinner" role="status" aria-label="Loading">
          <div class="spinner-ring"></div>

          <div class="spinner-core">
            <span class="core-dot"></span>
          </div>
        </div>
      </div>

      <div class="loader-info">
        <span class="status-indicator"></span>
        <span>Loading experience...</span>
      </div>
    </section>
  </main>
</body>
</html>
