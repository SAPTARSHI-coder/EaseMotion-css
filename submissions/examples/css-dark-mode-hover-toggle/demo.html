<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hover Toggle with Dark Mode Styling | EaseMotion CSS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="toggle-card">
        <label class="toggle-wrapper" for="darkModeToggle">
            <span class="toggle-label">Dark Mode Environment</span>
            <input type="checkbox" id="darkModeToggle" class="toggle-input" checked aria-label="Toggle dark mode environment">
            <div class="toggle-container" aria-hidden="true">
                <div class="toggle-thumb"></div>
            </div>
        </label>
    </div>
</body>
</html>
