<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ease-morph-stepper-bh</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #0f172a; min-height: 100vh; padding: 2rem; color: #f1f5f9; }
    .container { max-width: 800px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 3rem; padding: 2rem; background: rgba(30, 41, 59, 0.8); border-radius: 1rem; }
    header h1 { font-size: 2rem; font-weight: 700; background: linear-gradient(135deg, #c084fc, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 0.5rem; }
    header p { color: #94a3b8; }
    .demo-section { background: rgba(30, 41, 59, 0.8); border: 1px solid rgba(148, 163, 184, 0.1); border-radius: 1rem; padding: 2rem; margin-bottom: 2rem; }
    .demo-section h2 { font-size: 1.25rem; margin-bottom: 1.5rem; color: #e2e8f0; }
    .demo-item { margin-bottom: 2rem; }
    .demo-item h3 { font-size: 0.875rem; color: #94a3b8; margin-bottom: 1rem; text-align: center; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>ease-morph-stepper-bh</h1>
      <p>Pure CSS Morph-Glow Stepper Component</p>
    </header>
    
    <section class="demo-section">
      <h2>Morph-Glow Steppers</h2>
      
      <div class="demo-item">
        <h3>Basic Stepper</h3>
        <div class="ease-stepper-bh ease-morph-stepper-bh">
          <div class="ease-step-bh completed">1</div>
          <div class="ease-stepper-connector-bh filled"></div>
          <div class="ease-step-bh active">2</div>
          <div class="ease-stepper-connector-bh"></div>
          <div class="ease-step-bh">3</div>
          <div class="ease-stepper-connector-bh"></div>
          <div class="ease-step-bh">4</div>
        </div>
      </div>
      
      <div class="demo-item">
        <h3>With Glow Effect</h3>
        <div class="ease-stepper-bh ease-morph-stepper-bh ease-morph-stepper-bh-glow">
          <div class="ease-step-bh completed">1</div>
          <div class="ease-stepper-connector-bh filled"></div>
          <div class="ease-step-bh active">2</div>
          <div class="ease-stepper-connector-bh"></div>
          <div class="ease-step-bh">3</div>
        </div>
      </div>
    </section>
    
    <section class="demo-section">
      <h2>Color Variants</h2>
      
      <div class="demo-item">
        <h3>Success</h3>
        <div class="ease-stepper-bh ease-morph-stepper-bh ease-morph-stepper-bh-glow ease-morph-stepper-bh-success">
          <div class="ease-step-bh completed">1</div>
          <div class="ease-stepper-connector-bh filled"></div>
          <div class="ease-step-bh active">2</div>
          <div class="ease-stepper-connector-bh"></div>
          <div class="ease-step-bh">3</div>
        </div>
      </div>
      
      <div class="demo-item">
        <h3>Warning</h3>
        <div class="ease-stepper-bh ease-morph-stepper-bh ease-morph-stepper-bh-glow ease-morph-stepper-bh-warning">
          <div class="ease-step-bh completed">1</div>
          <div class="ease-stepper-connector-bh filled"></div>
          <div class="ease-step-bh active">2</div>
          <div class="ease-stepper-connector-bh"></div>
          <div class="ease-step-bh">3</div>
        </div>
      </div>
    </section>
    
    <section class="demo-section">
      <h2>Size Variants</h2>
      
      <div class="demo-item">
        <h3>Small</h3>
        <div class="ease-stepper-bh ease-morph-stepper-bh ease-morph-stepper-bh-sm">
          <div class="ease-step-bh active">1</div>
          <div class="ease-stepper-connector-bh"></div>
          <div class="ease-step-bh">2</div>
          <div class="ease-stepper-connector-bh"></div>
          <div class="ease-step-bh">3</div>
        </div>
      </div>
      
      <div class="demo-item">
        <h3>Large</h3>
        <div class="ease-stepper-bh ease-morph-stepper-bh ease-morph-stepper-bh-lg">
          <div class="ease-step-bh active">1</div>
          <div class="ease-stepper-connector-bh"></div>
          <div class="ease-step-bh">2</div>
          <div class="ease-stepper-connector-bh"></div>
          <div class="ease-step-bh">3</div>
        </div>
      </div>
    </section>
  </div>
</body>
</html>
