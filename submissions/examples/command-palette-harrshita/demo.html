<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Command Palette | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="demo-header">
    <h1>Command Palette (CMD+K)</h1>
    <p>Instant search overlay with category grouping and keyboard shortcut badges.</p>
  </header>

  <main class="demo-main">
    <section class="demo-section">
      <button class="ease-cmd-trigger" id="openCmd">
        <span>Search commands...</span>
        <kbd class="ease-cmd-kbd">Ctrl K</kbd>
      </button>

      <div class="ease-cmd-overlay" id="cmdOverlay" role="dialog" aria-modal="true">
        <div class="ease-cmd-modal">
          <div class="ease-cmd-input-wrapper">
            <span class="ease-cmd-search-icon">&#128065;</span>
            <input type="text" class="ease-cmd-input" placeholder="Type a command or search..." autofocus />
            <kbd class="ease-cmd-kbd">ESC</kbd>
          </div>
          <div class="ease-cmd-results">
            <div class="ease-cmd-group">
              <span class="ease-cmd-group-title">Navigation</span>
              <div class="ease-cmd-item ease-cmd-active">
                <span class="ease-cmd-icon">&#127968;</span>
                <span class="ease-cmd-label">Go to Dashboard</span>
                <span class="ease-cmd-badge">Jump</span>
              </div>
              <div class="ease-cmd-item">
                <span class="ease-cmd-icon">&#9881;</span>
                <span class="ease-cmd-label">Project Settings</span>
                <span class="ease-cmd-badge">Settings</span>
              </div>
            </div>
            <div class="ease-cmd-group">
              <span class="ease-cmd-group-title">Actions</span>
              <div class="ease-cmd-item">
                <span class="ease-cmd-icon">&#43;</span>
                <span class="ease-cmd-label">Create New Component</span>
                <span class="ease-cmd-badge">Action</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="demo-footer"><p>EaseMotion CSS Project</p></footer>

  <script>
    const trigger = document.getElementById('openCmd');
    const overlay = document.getElementById('cmdOverlay');
    trigger.addEventListener('click', () => overlay.classList.add('ease-cmd-visible'));
    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) overlay.classList.remove('ease-cmd-visible');
    });
    document.addEventListener('keydown', (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
        e.preventDefault();
        overlay.classList.toggle('ease-cmd-visible');
      }
      if (e.key === 'Escape') overlay.classList.remove('ease-cmd-visible');
    });
  </script>
</body>
</html>
