
<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blind Quantum Computation - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css"></head><body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030712; color: #ffffff;">

    <div class="ease-card ease-card-glass bqc-container">

            <h2>Blind Quantum Computation</h2>
            <span class="ease-badge ease-badge-warning">Delegating</span>
        </div>
        
        <div class="bqc-screen ease-center">
            <div class="bqc-flux flux-bqc-a"></div>
            <div class="bqc-flux flux-bqc-b"></div>
            <div class="bqc-boundary-ring"></div>
            <div class="bqc-core ease-center"></div>
        </div>

        <div class="bqc-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Angle Traps &amp; Client-Server Privacy</span>

        </div>
    </div></body></html>
