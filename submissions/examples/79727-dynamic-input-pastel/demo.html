<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />
  <meta
    name="description"
    content="Responsive dynamic input field with pastel styling built using pure HTML and CSS."
  />

  <title>Dynamic Input Field — Pastel</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main class="page">
    <section class="input-section" aria-labelledby="input-title">

      <div class="input-card">
        <div class="input-card__decor input-card__decor--one"></div>
        <div class="input-card__decor input-card__decor--two"></div>

        <header class="input-header">
          <span class="input-header__eyebrow">PASTEL FORM</span>

          <h1 id="input-title">
            Tell us something
          </h1>

          <p>
            A soft, responsive input field with smooth focus
            and validation-style interactions.
          </p>
        </header>

        <form class="dynamic-form">

          <div class="field">
            <label for="name">
              Your name
            </label>

            <div class="field__control">
              <span class="field__icon" aria-hidden="true">
                ✦
              </span>

              <input
                id="name"
                name="name"
                type="text"
                placeholder="Enter your name"
                autocomplete="name"
              />

              <span
                class="field__indicator"
                aria-hidden="true"
              ></span>
            </div>
          </div>

          <div class="field">
            <label for="email">
              Email address
            </label>

            <div class="field__control">
              <span class="field__icon" aria-hidden="true">
                @
              </span>

              <input
                id="email"
                name="email"
                type="email"
                placeholder="you@example.com"
                autocomplete="email"
              />

              <span
                class="field__indicator"
                aria-hidden="true"
              ></span>
            </div>
          </div>

          <div class="field">
            <label for="message">
              Your message
            </label>

            <div class="field__control field__control--textarea">
              <span class="field__icon field__icon--top" aria-hidden="true">
                ◇
              </span>

              <textarea
                id="message"
                name="message"
                rows="5"
                placeholder="Write your message..."
              ></textarea>

              <span
                class="field__indicator"
                aria-hidden="true"
              ></span>
            </div>
          </div>

          <div class="input-footer">
            <span class="input-footer__hint">
              Smooth CSS-only interaction
            </span>

            <button type="submit">
              Continue
              <span aria-hidden="true">→</span>
            </button>
          </div>

        </form>
      </div>

    </section>
  </main>
</body>
</html>
