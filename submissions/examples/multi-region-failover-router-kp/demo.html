<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Multi Region Failover Router</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="region-shell" aria-labelledby="region-title">
    <section class="region-board">
      <p class="eyebrow">Edge resilience</p>
      <h1 id="region-title">Multi Region Failover Router</h1>
      <p class="summary">Traffic probes detect a failing region, shift weight through a routing switch, and restore balance after recovery.</p>
      <div class="region-stage" role="img" aria-label="Animated multi region failover router visualization">
        <div class="probe-lanes"><span></span><span></span><span></span><span></span></div>
        <div class="router-switch"><i></i><i></i><strong>route</strong></div>
        <div class="region-grid"><b></b><b></b><b></b><em>regions</em></div>
        <div class="recovery-flow"><small>recovered</small><span></span><span></span></div>
      </div>
      <div class="readouts"><span>us-east 20%</span><span>eu-west 55%</span><span>ap-south 25%</span></div>
    </section>
  </main>
</body>
</html>
