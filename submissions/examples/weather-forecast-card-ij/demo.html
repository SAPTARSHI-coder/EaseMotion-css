<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-weather-forecast-card demo</title>
</head>
<body>
<div class="wfc-card">
  <div class="wfc-head">
    <i class="wfc-icon"></i>
    <span>18 CLOUDY</span>
  </div>
  <div class="wfc-temp">21</div>
  <div class="wfc-hours">
    <span class="wfc-hour"><b>13</b><small>19</small></span>
    <span class="wfc-hour"><b>14</b><small>21</small></span>
    <span class="wfc-hour"><b>15</b><small>22</small></span>
    <span class="wfc-hour"><b>16</b><small>20</small></span>
  </div>
</div>
</body>
</html>
