<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EaseMotion CSS — Soundwave Equalizer Indicator Showcase</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="sw-demo-wrapper">
    <header class="sw-header">
      <span class="badge">UI Component Showcase</span>
      <h1>Soundwave Equalizer Indicator</h1>
      <p>Animated soundwave equalizer bar indicator featuring staggered keyframe height scaling, active audio player state, and zero JavaScript.</p>
    </header>

    <main class="sw-card">
      <div class="ease-soundwave-player">
        <div class="player-info">
          <span class="music-icon">🎵</span>
          <div class="track-meta">
            <span class="track-title">EaseMotion Synthwave Track</span>
            <span class="track-artist">Live Playing Audio</span>
          </div>
        </div>

        <div class="ease-soundwave-bar">
          <span class="bar bar-1"></span>
          <span class="bar bar-2"></span>
          <span class="bar bar-3"></span>
          <span class="bar bar-4"></span>
          <span class="bar bar-5"></span>
        </div>
      </div>
    </main>

    <footer class="sw-footer">
      <p>EaseMotion CSS Component &bull; Submitted by @Ishita-Katiyar-06</p>
    </footer>
  </div>
</body>
</html>
