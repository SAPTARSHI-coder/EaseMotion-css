<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D-Flip Accessible Progress Bar - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="stage">
    <header class="head">
      <h1>3D-Flip Progress Bar (<code>#54438</code>)</h1>
      <p>An accessible ARIA tracking timeline where milestone completion achievement markers flip across 180-degree 3D space from pending to verified.</p>
    </header>
    
    <div class="ease-progress-3d-flip">
      <div class="head-info">
        <strong>✦ Autonomous Contributor Pipeline</strong>
        <span class="pct-lbl">80% VERIFIED</span>
      </div>

      <div class="bar-wrap" role="progressbar" aria-valuenow="80" aria-valuemin="0" aria-valuemax="100" aria-label="Pipeline Completion">
        <div class="bar-line" style="width: 80%;"></div>
      </div>

      <div class="flip-badges">
        <div class="flip-node flipped" id="fn-1">
          <div class="side front-side"><span>1</span><label>Claimed</label></div>
          <div class="side back-side"><span>✓</span><label>Claimed</label></div>
        </div>
        <div class="flip-node flipped" id="fn-2">
          <div class="side front-side"><span>2</span><label>Built</label></div>
          <div class="side back-side"><span>✓</span><label>Built</label></div>
        </div>
        <div class="flip-node flipped" id="fn-3">
          <div class="side front-side"><span>3</span><label>Tested</label></div>
          <div class="side back-side"><span>✓</span><label>Tested</label></div>
        </div>
        <div class="flip-node" id="fn-4">
          <div class="side front-side"><span>4</span><label>Merged</label></div>
          <div class="side back-side"><span>✓</span><label>Merged</label></div>
        </div>
      </div>

      <div class="bot-act">
        <button class="f-ctrl" onclick="setFlip(50, 2)">Step 2 (50%)</button>
        <button class="f-ctrl" onclick="setFlip(80, 3)">Step 3 (80%)</button>
        <button class="f-ctrl done-btn" onclick="setFlip(100, 4)">Merge All (100%) ✦</button>
      </div>
    </div>
  </div>

  <script>
    function setFlip(pct, step) {
      document.querySelector('.bar-line').style.width = pct + '%';
      document.querySelector('.bar-wrap').setAttribute('aria-valuenow', pct);
      document.querySelector('.pct-lbl').textContent = pct + '% ' + (pct === 100 ? 'MERGED' : 'VERIFIED');
      for (let i = 1; i <= 4; i++) {
        const node = document.getElementById('fn-' + i);
        if (i <= step) {
          node.classList.add('flipped');
        } else {
          node.classList.remove('flipped');
        }
      }
    }
  </script>
</body>
</html>
