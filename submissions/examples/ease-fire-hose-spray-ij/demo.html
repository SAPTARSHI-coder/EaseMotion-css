<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.95">
<title>Fire Hose Spray</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="fireground">
  <header class="fire-head">
    <h1 class="fire-company">ENGINE 5</h1>
    <p class="fire-clear">CLEAR LINES</p>
  </header>
  <section class="fire-scene" aria-label="Fire hose spraying water">
    <div class="hydrant">
      <span class="hydrant-cap cap-a"></span>
      <span class="hydrant-cap cap-b"></span>
      <span class="hydrant-body"></span>
      <span class="hydrant-base"></span>
    </div>
    <div class="fire-engine">
      <span class="engine-cab"></span>
      <span class="engine-body"></span>
      <span class="engine-light"></span>
      <span class="engine-wheel wheel-a"></span>
      <span class="engine-wheel wheel-b"></span>
    </div>
    <div class="fire-line">
      <span class="line-fold fold-1"></span>
      <span class="line-fold fold-2"></span>
      <span class="fire-nozzle"></span>
    </div>
    <div class="spray-arc">
      <span class="spray-drop drop-a"></span>
      <span class="spray-drop drop-b"></span>
      <span class="spray-drop drop-c"></span>
      <span class="spray-drop drop-d"></span>
    </div>
    <span class="ember ember-1"></span>
    <span class="ember ember-2"></span>
  </section>
  <footer class="fire-foot">
    <span class="fire-psi">120 PSI</span>
    <span class="fire-flow">FLOW</span>
  </footer>
</main>
</body>
</html>
