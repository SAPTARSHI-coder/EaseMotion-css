<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Architect Reveal · blueprint to 3D model</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <div class="architect-container">
      <div class="architect-display" id="architectDisplay">
        <!-- Blueprint Layer -->
        <div class="blueprint-layer" id="blueprintLayer">
          <div class="blueprint-grid"></div>
          <div class="blueprint-content">
            <div class="blueprint-icon">📐</div>
            <div class="blueprint-title">BLUEPRINT</div>
            <div class="blueprint-subtitle">Architectural Design</div>
            <div class="blueprint-lines">
              <div class="blueprint-line"></div>
              <div class="blueprint-line"></div>
              <div class="blueprint-line"></div>
              <div class="blueprint-line"></div>
            </div>
          </div>
        </div>

        <!-- 3D Model Layer -->
        <div class="model-layer" id="modelLayer">
          <div class="model-scene">
            <div class="model" id="model">
              <!-- Building blocks -->
              <div class="model-block block-1"></div>
              <div class="model-block block-2"></div>
              <div class="model-block block-3"></div>
              <div class="model-block block-4"></div>
              <div class="model-block block-5"></div>
              <div class="model-block block-6"></div>
              <div class="model-block block-7"></div>
              <div class="model-block block-8"></div>
              <div class="model-block block-9"></div>
              <!-- Roof -->
              <div class="model-roof"></div>
            </div>
          </div>
        </div>

        <!-- Reveal Indicator -->
        <div class="reveal-indicator">
          <div class="reveal-bar">
            <div class="reveal-fill" id="revealFill"></div>
          </div>
          <span class="reveal-value" id="revealValue">Reveal: 0%</span>
        </div>
      </div>
      
      <div class="architect-status">
        <span id="architectStatus">📐 Click to reveal 3D model</span>
      </div>
    </div>

    <div class="controls">
      <button class="btn btn-reveal" id="revealBtn">📐 Reveal 3D</button>
      <button class="btn btn-blueprint" id="blueprintBtn">📄 Show Blueprint</button>
      <button class="btn btn-reset" id="resetBtn">⟳ Reset</button>
    </div>
    <div class="footer-note">
      <span>📐 blueprint transforms into 3D model · smooth transition</span>
    </div>
  </div>

  <script>
    (function() {
      "use strict";

      // DOM refs
      const blueprintLayer = document.getElementById('blueprintLayer');
      const modelLayer = document.getElementById('modelLayer');
      const model = document.getElementById('model');
      const revealFill = document.getElementById('revealFill');
      const revealValue = document.getElementById('revealValue');
      const architectStatus = document.getElementById('architectStatus');
      const revealBtn = document.getElementById('revealBtn');
      const blueprintBtn = document.getElementById('blueprintBtn');
      const resetBtn = document.getElementById('resetBtn');

      // State
      let reveal = 0; // 0 to 1
      let targetReveal = 0;
      let isAnimating = false;
      let animationId = null;
      let isRevealed = false;

      // Update architect reveal
      function updateReveal() {
        // Smooth interpolation
        reveal += (targetReveal - reveal) * 0.06;
        
        // Clamp
        reveal = Math.max(0, Math.min(1, reveal));
        
        // Blueprint layer - fades out
        blueprintLayer.style.opacity = 1 - reveal;
        blueprintLayer.style.transform = `scale(${1 - reveal * 0.1})`;
        
        // Model layer - fades in and scales up
        modelLayer.style.opacity = reveal;
        modelLayer.style.transform = `scale(${0.5 + reveal * 0.5})`;
        
        // Model rotation
        const rotation = reveal * 360;
        model.style.transform = `rotateX(${rotation * 0.1}deg) rotateY(${rotation}deg) rotateZ(${rotation * 0.05}deg)`;
        
        // Model blocks - staggered reveal
        const blocks = document.querySelectorAll('.model-block');
        blocks.forEach((block, index) => {
          const delay = index * 0.05;
          const blockReveal = Math.max(0, Math.min(1, (reveal - delay) / (1 - delay)));
          block.style.opacity = blockReveal;
          block.style.transform = `translateY(${(1 - blockReveal) * 60}px) scale(${0.5 + blockReveal * 0.5})`;
          block.style.boxShadow = `0 ${blockReveal * 20}px ${blockReveal * 40}px rgba(99, 102, 241, ${blockReveal * 0.3})`;
        });
        
        // Roof reveal
        const roof = document.querySelector('.model-roof');
        const roofReveal = Math.max(0, Math.min(1, (reveal - 0.4) / 0.6));
        roof.style.opacity = roofReveal;
        roof.style.transform = `scale(${0.3 + roofReveal * 0.7}) translateY(${(1 - roofReveal) * 40}px)`;

        // Update indicator
        const percent = Math.round(reveal * 100);
        revealFill.style.width = percent + '%';
        revealValue.textContent = `Reveal: ${percent}%`;

        // Update status
        if (reveal > 0.9) {
          architectStatus.textContent = '🏗️ 3D Model Revealed!';
          architectStatus.style.color = '#fbbf24';
        } else if (reveal > 0.4) {
          architectStatus.textContent = '📐 Transforming to 3D...';
          architectStatus.style.color = '#818cf8';
        } else if (reveal > 0.05) {
          architectStatus.textContent = '📄 Blueprint unfolding...';
          architectStatus.style.color = '#94a3b8';
        } else {
          architectStatus.textContent = '📐 Click to reveal 3D model';
          architectStatus.style.color = '#94a3b8';
        }

        // Update glow
        const glowIntensity = 0.1 + reveal * 0.4;
        document.querySelector('.architect-display').style.boxShadow = 
          `inset 0 0 60px rgba(0,0,0,0.5), 0 0 ${40 + reveal * 60}px rgba(99, 102, 241, ${glowIntensity})`;
      }

      // Animation loop
      function animate() {
        if (isAnimating) {
          updateReveal();
          animationId = requestAnimationFrame(animate);
        }
      }

      // Start animation
      function startAnimation() {
        if (!isAnimating) {
          isAnimating = true;
          animate();
        }
      }

      // Stop animation
      function stopAnimation() {
        if (isAnimating) {
          isAnimating = false;
          if (animationId) {
            cancelAnimationFrame(animationId);
            animationId = null;
          }
          updateReveal();
        }
      }

      // Reveal 3D model
      function revealModel() {
        targetReveal = 1;
        startAnimation();
        isRevealed = true;
        revealBtn.textContent = '🏗️ 3D Revealed';
        revealBtn.style.background = 'linear-gradient(135deg, #fbbf24, #f59e0b)';
        revealBtn.style.borderColor = '#fcd34d';
        blueprintBtn.textContent = '📄 Show Blueprint';
      }

      // Show blueprint
      function showBlueprint() {
        targetReveal = 0;
        startAnimation();
        isRevealed = false;
        revealBtn.textContent = '📐 Reveal 3D';
        revealBtn.style.background = 'linear-gradient(135deg, #6366f1, #4f46e5)';
        revealBtn.style.borderColor = '#818cf8';
        blueprintBtn.textContent = '📄 Showing Blueprint';
        setTimeout(() => {
          blueprintBtn.textContent = '📄 Show Blueprint';
        }, 1000);
      }

      // Reset
      function resetArchitect() {
        targetReveal = 0;
        reveal = 0;
        isRevealed = false;
        stopAnimation();
        updateReveal();
        revealBtn.textContent = '📐 Reveal 3D';
        revealBtn.style.background = 'linear-gradient(135deg, #6366f1, #4f46e5)';
        revealBtn.style.borderColor = '#818cf8';
        blueprintBtn.textContent = '📄 Show Blueprint';
        architectStatus.textContent = '🔄 Reset complete';
        architectStatus.style.color = '#94a3b8';
        setTimeout(() => {
          architectStatus.textContent = '📐 Click to reveal 3D model';
        }, 1000);
      }

      // Toggle reveal
      function toggleReveal() {
        if (isRevealed) {
          showBlueprint();
        } else {
          revealModel();
        }
      }

      // Event listeners
      if (revealBtn) {
        revealBtn.addEventListener('click', function(e) {
          e.preventDefault();
          if (isRevealed) {
            showBlueprint();
          } else {
            revealModel();
          }
        });
      }

      if (blueprintBtn) {
        blueprintBtn.addEventListener('click', function(e) {
          e.preventDefault();
          if (isRevealed) {
            showBlueprint();
          } else {
            // If already showing blueprint, do nothing or reveal
          }
        });
      }

      if (resetBtn) {
        resetBtn.addEventListener('click', function(e) {
          e.preventDefault();
          resetArchitect();
        });
      }

      // Click on display to toggle
      const architectDisplay = document.getElementById('architectDisplay');
      architectDisplay.addEventListener('click', function(e) {
        if (e.target === this || e.target.closest('.blueprint-layer') || e.target.closest('.model-layer')) {
          toggleReveal();
        }
      });

      // Keyboard shortcuts
      document.addEventListener('keydown', function(e) {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

        const key = e.key;
        if (key === ' ' || key === 'Space') {
          e.preventDefault();
          toggleReveal();
        } else if (key === 'r' || key === 'R') {
          e.preventDefault();
          revealModel();
        } else if (key === 'b' || key === 'B') {
          e.preventDefault();
          showBlueprint();
        } else if (key === 'x' || key === 'X') {
          e.preventDefault();
          resetArchitect();
        }
      });

      // Initialize
      updateReveal();
      console.log('📐 Architect Reveal ready · shortcuts: [Space] Toggle, [R] Reveal, [B] Blueprint, [X] Reset');
    })();
  </script>
</body>
</html>
