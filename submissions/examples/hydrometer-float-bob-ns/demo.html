<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hydrometer Float Bob — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Hydrometer Float Bob demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Hydrometer Float Bob</h1>
      <p class="lede">Hydrometer float bobbing to a density equilibrium</p>
    </header>

    <section class="ease-hydrometer-float-bob" data-demo="hydrometer-float-bob" aria-live="polite">
      <div class="ease-hydrometer-float-bob__housing">
        <div class="ease-hydrometer-float-bob__bezel">
          <div class="ease-hydrometer-float-bob__face">
            <div class="ease-hydrometer-float-bob__readout">
              <span class="ease-hydrometer-float-bob__label">Hydrometer Float Bob</span>
              <span class="ease-hydrometer-float-bob__value">LIVE</span>
            </div>
            <div class="ease-hydrometer-float-bob__motion" aria-hidden="true">
              <span class="ease-hydrometer-float-bob__a"></span>
              <span class="ease-hydrometer-float-bob__b"></span>
              <span class="ease-hydrometer-float-bob__c"></span>
              <span class="ease-hydrometer-float-bob__d"></span>
            </div>
            <div class="ease-hydrometer-float-bob__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-hydrometer-float-bob__controls">
          <button type="button" class="ease-hydrometer-float-bob__btn primary">Engage</button>
          <button type="button" class="ease-hydrometer-float-bob__btn">Reset</button>
          <label class="ease-hydrometer-float-bob__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-hydrometer-float-bob__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
