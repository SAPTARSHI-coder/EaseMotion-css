<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 3D-Flip Popover</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="checkout-layout">
        <div class="order-summary">
            <h2 class="section-title">Order Total</h2>
            
            <div class="price-row tooltip-container">
                <span class="hover-trigger">
                    Subtotal 
                    <span class="info-icon">ⓘ</span>
                    
                    <div class="flip-popover-wrapper">
                        <div class="flip-popover">
                            <div class="popover-arrow"></div>
                            <div class="popover-content">
                                Sum of all items in your cart before taxes and shipping are applied.
                            </div>
                        </div>
                    </div>
                </span>
                <span>$149.99</span>
            </div>
            
            <div class="price-row tooltip-container">
                <span class="hover-trigger">
                    Estimated Tax
                    <span class="info-icon">ⓘ</span>
                    
                    <div class="flip-popover-wrapper">
                        <div class="flip-popover">
                            <div class="popover-arrow"></div>
                            <div class="popover-content">
                                Calculated based on your delivery address and local tax rates.
                            </div>
                        </div>
                    </div>
                </span>
                <span>$12.50</span>
            </div>
            
            <div class="price-row">
                <span>Shipping</span>
                <span class="free-text">Free</span>
            </div>
            
            <div class="price-row total-row">
                <span>Total</span>
                <span>$162.49</span>
            </div>
            
        </div>
        
        <button class="checkout-btn">Complete Purchase</button>
    </div>
</body>
</html>
