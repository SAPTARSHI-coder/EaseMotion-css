<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wind Chime · chimes sway and tinkle</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <div class="chime-container">
      <div class="chime-display" id="chimeDisplay">
        <!-- Canvas for wind chime -->
        <canvas id="chimeCanvas"></canvas>
        
        <!-- Chime Info -->
        <div class="chime-info">
          <span class="info-label">🔔 Chimes</span>
          <span class="info-value" id="chimeCount">0</span>
        </div>

        <!-- Chime Controls -->
        <div class="chime-controls">
          <div class="control-group">
            <label class="control-label">🌬️ Wind</label>
            <input type="range" class="control-slider" id="windSlider" min="0" max="10" value="3">
            <span class="control-value" id="windValue">3</span>
          </div>
          <div class="control-group">
            <label class="control-label">🎵 Tone</label>
            <div class="tone-options">
              <button class="tone-btn active" data-tone="gentle" title="Gentle">🌸</button>
              <button class="tone-btn" data-tone="bright" title="Bright">✨</button>
              <button class="tone-btn" data-tone="deep" title="Deep">🌙</button>
              <button class="tone-btn" data-tone="magical" title="Magical">🪄</button>
            </div>
          </div>
        </div>

        <!-- Chime Text -->
        <div class="chime-text">
          <span class="text-label">🔔 Wind Chime</span>
          <span class="text-message" id="chimeMessage">Chimes sway gently in the breeze</span>
        </div>
      </div>
      
      <div class="chime-status">
        <span id="chimeStatus">🔔 Wind chimes sway and tinkle in the breeze</span>
      </div>
    </div>

    <div class="controls">
      <button class="btn btn-reset" id="resetBtn">⟳ Reset</button>
    </div>
    <div class="footer-note">
      <span>🔔 chimes sway · 4 tones · wind control</span>
    </div>
  </div>

  <script>
    (function() {
      "use strict";

      // DOM refs
      const canvas = document.getElementById('chimeCanvas');
      const ctx = canvas.getContext('2d');
      const display = document.getElementById('chimeDisplay');
      const chimeCount = document.getElementById('chimeCount');
      const chimeStatus = document.getElementById('chimeStatus');
      const chimeMessage = document.getElementById('chimeMessage');
      const resetBtn = document.getElementById('resetBtn');
      const windSlider = document.getElementById('windSlider');
      const windValue = document.getElementById('windValue');
      const toneBtns = document.querySelectorAll('.tone-btn');

      // State
      let chimes = [];
      let animationId = null;
      let time = 0;
      let currentTone = 'gentle';
      let noteCount = 0;

      // Tone configurations
      const tones = {
        gentle: {
          name: 'Gentle',
          colors: ['#fbbf24', '#fcd34d', '#fde68a', '#f59e0b', '#fef3c7'],
          sizes: [6, 8, 10, 7, 9],
          swing: 0.3,
          note: '🌸'
        },
        bright: {
          name: 'Bright',
          colors: ['#60a5fa', '#93c5fd', '#bae6fd', '#3b82f6', '#dbeafe'],
          sizes: [5, 7, 9, 8, 6],
          swing: 0.5,
          note: '✨'
        },
        deep: {
          name: 'Deep',
          colors: ['#8b5cf6', '#a78bfa', '#c4b5fd', '#7c3aed', '#ddd6fe'],
          sizes: [8, 10, 12, 9, 11],
          swing: 0.2,
          note: '🌙'
        },
        magical: {
          name: 'Magical',
          colors: ['#ec4899', '#f472b6', '#f9a8d4', '#db2777', '#fbcfe8'],
          sizes: [6, 9, 7, 10, 8],
          swing: 0.6,
          note: '🪄'
        }
      };

      // Chime class
      class Chime {
        constructor(x, y, length, color, size, tone) {
          this.x = x;
          this.y = y;
          this.length = length;
          this.color = color;
          this.size = size;
          this.tone = tone;
          this.angle = 0;
          this.targetAngle = 0;
          this.swingSpeed = 0.02 + Math.random() * 0.02;
          this.phase = Math.random() * Math.PI * 2;
          this.movement = 0;
          this.clinkTimer = 0;
          this.isClinking = false;
        }

        update(wind, time) {
          const toneData = tones[this.tone];
          const windForce = wind / 10;
          
          // Sway based on wind
          this.targetAngle = Math.sin(time * this.swingSpeed * (1 + windForce * 0.5) + this.phase) * 
                            (0.05 + windForce * 0.2) * toneData.swing;
          
          // Smooth movement
          this.angle += (this.targetAngle - this.angle) * 0.05;
          
          // Clink detection - when angle changes rapidly
          const prevMovement = this.movement;
          this.movement = Math.abs(this.angle - this.targetAngle);
          
          if (this.movement > 0.02 && this.movement > prevMovement * 1.5) {
            this.isClinking = true;
            this.clinkTimer = 30;
          }
          
          if (this.clinkTimer > 0) {
            this.clinkTimer--;
            if (this.clinkTimer === 0) {
              this.isClinking = false;
            }
          }
        }

        draw(ctx) {
          ctx.save();
          ctx.translate(this.x, this.y);
          
          // Chime shadow
          ctx.shadowColor = 'rgba(0,0,0,0.1)';
          ctx.shadowBlur = 5;
          ctx.shadowOffsetX = 2;
          ctx.shadowOffsetY = 2;
          
          // Draw chime tube
          const swayX = Math.sin(this.angle) * this.length * 0.3;
          
          // Tube gradient
          const grad = ctx.createLinearGradient(-this.size/2, 0, this.size/2, 0);
          grad.addColorStop(0, this.lightenColor(this.color, 30));
          grad.addColorStop(0.3, this.color);
          grad.addColorStop(0.7, this.color);
          grad.addColorStop(1, this.darkenColor(this.color, 30));
          
          ctx.shadowBlur = 8;
          ctx.fillStyle = grad;
          ctx.shadowColor = 'rgba(0,0,0,0.05)';
          
          // Tube body with sway
          ctx.beginPath();
          ctx.moveTo(-this.size/2, 0);
          ctx.quadraticCurveTo(
            -this.size/2 + swayX * 0.3,
            this.length * 0.3,
            -this.size/3 + swayX * 0.5,
            this.length * 0.7
          );
          ctx.quadraticCurveTo(
            swayX * 0.3,
            this.length * 0.9,
            swayX * 0.5,
            this.length
          );
          ctx.quadraticCurveTo(
            swayX * 0.3 + this.size/4,
            this.length * 0.9,
            this.size/3 + swayX * 0.5,
            this.length * 0.7
          );
          ctx.quadraticCurveTo(
            this.size/2 + swayX * 0.3,
            this.length * 0.3,
            this.size/2,
            0
          );
          ctx.closePath();
          ctx.fill();
          ctx.strokeStyle = this.darkenColor(this.color, 50);
          ctx.lineWidth = 0.5;
          ctx.stroke();
          
          // Tube highlight
          ctx.shadowBlur = 0;
          ctx.globalAlpha = 0.15;
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.ellipse(-this.size/4, this.length * 0.3, this.size/8, this.length * 0.2, 0.1, 0, Math.PI * 2);
          ctx.fill();
          ctx.globalAlpha = 1;
          
          // Clink effect - sparkle
          if (this.isClinking) {
            ctx.shadowBlur = 20;
            ctx.shadowColor = 'rgba(255, 255, 200, 0.3)';
            ctx.fillStyle = 'rgba(255, 255, 200, 0.1)';
            ctx.beginPath();
            ctx.arc(swayX * 0.5, this.length * 0.5, this.size * 2, 0, Math.PI * 2);
            ctx.fill();
            
            // Small sparkles
            for (let i = 0; i < 3; i++) {
              const angle = Math.random() * Math.PI * 2;
              const dist = this.size * (0.5 + Math.random() * 1);
              ctx.shadowBlur = 10;
              ctx.shadowColor = 'rgba(255, 255, 200, 0.2)';
              ctx.fillStyle = 'rgba(255, 255, 200, 0.1)';
              ctx.beginPath();
              ctx.arc(
                swayX * 0.5 + Math.cos(angle) * dist,
                this.length * 0.5 + Math.sin(angle) * dist,
                this.size * 0.2,
                0,
                Math.PI * 2
              );
              ctx.fill();
            }
          }
          
          ctx.restore();
        }

        lightenColor(color, percent) {
          const num = parseInt(color.replace('#', ''), 16);
          const amt = Math.round(2.55 * percent);
          const R = Math.min(255, (num >> 16) + amt);
          const G = Math.min(255, ((num >> 8) & 0x00FF) + amt);
          const B = Math.min(255, (num & 0x0000FF) + amt);
          return `rgb(${R},${G},${B})`;
        }

        darkenColor(color, percent) {
          const num = parseInt(color.replace('#', ''), 16);
          const amt = Math.round(2.55 * percent);
          const R = Math.max(0, (num >> 16) - amt);
          const G = Math.max(0, ((num >> 8) & 0x00FF) - amt);
          const B = Math.max(0, (num & 0x0000FF) - amt);
          return `rgb(${R},${G},${B})`;
        }
      }

      // Generate chimes
      function generateChimes() {
        const w = canvas.width;
        const h = canvas.height;
        const toneData = tones[currentTone];
        const count = 5 + Math.floor(Math.random() * 3);
        const centerX = w / 2;
        const topY = h * 0.15;
        const spread = Math.min(w, h) * 0.25;
        
        chimes = [];
        noteCount = 0;
        
        for (let i = 0; i < count; i++) {
          const angle = (i / count) * Math.PI * 2 - Math.PI / 2;
          const radius = spread * (0.6 + Math.random() * 0.3);
          const x = centerX + Math.cos(angle) * radius;
          const y = topY + Math.sin(angle) * radius * 0.5;
          const length = 60 + Math.random() * 60;
          const size = toneData.sizes[i % toneData.sizes.length];
          const color = toneData.colors[i % toneData.colors.length];
          
          const chime = new Chime(x, y, length, color, size, currentTone);
          chimes.push(chime);
          noteCount++;
        }
        
        chimeCount.textContent = chimes.length;
        chimeMessage.textContent = `${chimes.length} chimes sway in the breeze`;
      }

      // Draw background
      function drawBackground() {
        const w = canvas.width;
        const h = canvas.height;
        
        // Sky gradient
        const grad = ctx.createLinearGradient(0, 0, 0, h);
        grad.addColorStop(0, 'rgba(20, 30, 50, 0.2)');
        grad.addColorStop(0.3, 'rgba(30, 40, 60, 0.25)');
        grad.addColorStop(0.7, 'rgba(40, 50, 70, 0.3)');
        grad.addColorStop(1, 'rgba(20, 30, 40, 0.4)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, w, h);
        
        // Subtle clouds
        for (let i = 0; i < 3; i++) {
          const x = (i * w * 0.3 + Math.sin(i * 2) * 20) % w;
          const y = 10 + i * 20 + Math.sin(i * 1.5) * 10;
          const radius = 40 + i * 15;
          const grad2 = ctx.createRadialGradient(x, y, 0, x, y, radius);
          grad2.addColorStop(0, `rgba(200, 210, 220, ${0.02 + i * 0.01})`);
          grad2.addColorStop(1, 'rgba(200, 210, 220, 0)');
          ctx.fillStyle = grad2;
          ctx.beginPath();
          ctx.arc(x, y, radius, 0, Math.PI * 2);
          ctx.fill();
        }
        
        // Hanging string
        ctx.strokeStyle = 'rgba(200, 200, 200, 0.1)';
        ctx.lineWidth = 1;
        ctx.setLineDash([3, 5]);
        ctx.beginPath();
        ctx.moveTo(w/2, 0);
        ctx.lineTo(w/2, canvas.height * 0.15);
        ctx.stroke();
        ctx.setLineDash([]);
        
        // Top ring
        ctx.fillStyle = 'rgba(200, 200, 200, 0.15)';
        ctx.beginPath();
        ctx.arc(w/2, canvas.height * 0.15, 8, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = 'rgba(200, 200, 200, 0.1)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(w/2, canvas.height * 0.15, 8, 0, Math.PI * 2);
        ctx.stroke();
      }

      // Resize canvas
      function resizeCanvas() {
        const rect = display.getBoundingClientRect();
        canvas.width = rect.width;
        canvas.height = rect.height;
        canvas.style.width = rect.width + 'px';
        canvas.style.height = rect.height + 'px';
        generateChimes();
      }

      // Animation loop
      function animate() {
        time += 0.02;
        const wind = windSlider.value / 10;
        
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawBackground();
        
        // Update and draw chimes
        chimes.forEach(chime => {
          chime.update(wind, time);
          chime.draw(ctx);
        });
        
        // Update status based on wind
        if (wind > 0.7) {
          chimeStatus.textContent = '🌬️ Chimes dance and tinkle in the strong wind!';
          chimeStatus.style.color = '#fbbf24';
        } else if (wind > 0.3) {
          chimeStatus.textContent = '🔔 Chimes sway and tinkle in the breeze';
          chimeStatus.style.color = '#818cf8';
        } else {
          chimeStatus.textContent = '🔔 Wind chimes sway gently in the breeze';
          chimeStatus.style.color = '#94a3b8';
        }
        
        animationId = requestAnimationFrame(animate);
      }

      // Set tone
      function setTone(tone) {
        currentTone = tone;
        toneBtns.forEach(btn => {
          btn.classList.toggle('active', btn.dataset.tone === tone);
        });
        const toneData = tones[tone];
        chimeStatus.textContent = `🎵 Tone: ${toneData.name}`;
        chimeStatus.style.color = '#a78bfa';
        generateChimes();
        setTimeout(() => {
          chimeStatus.textContent = '🔔 Wind chimes sway and tinkle in the breeze';
          chimeStatus.style.color = '#94a3b8';
        }, 1500);
      }

      // Reset
      function resetChimes() {
        generateChimes();
        windSlider.value = 3;
        windValue.textContent = '3';
        chimeStatus.textContent = '🔄 Reset complete';
        chimeStatus.style.color = '#94a3b8';
        setTimeout(() => {
          chimeStatus.textContent = '🔔 Wind chimes sway and tinkle in the breeze';
          chimeStatus.style.color = '#94a3b8';
        }, 1000);
      }

      // Event listeners
      windSlider.addEventListener('input', function() {
        windValue.textContent = this.value;
      });

      toneBtns.forEach(btn => {
        btn.addEventListener('click', function() {
          setTone(this.dataset.tone);
        });
      });

      if (resetBtn) {
        resetBtn.addEventListener('click', function(e) {
          e.preventDefault();
          resetChimes();
        });
      }

      // Keyboard shortcuts
      document.addEventListener('keydown', function(e) {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

        const key = e.key;
        if (key === 'r' || key === 'R') {
          e.preventDefault();
          resetChimes();
        }
      });

      // Resize
      window.addEventListener('resize', resizeCanvas);

      // Initialize
      resizeCanvas();
      animate();
      
      console.log('🔔 Wind Chime ready · shortcuts: [R] Reset');
    })();
  </script>
</body>
</html>
