<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clip Path Shapes | EaseMotion CSS</title><link rel="stylesheet" href="style.css"></head>
<body><div class="cp-root">
<div class="cp-card"><div class="cp-shape cp-circle"></div><p class="cp-label">Circle</p><p class="cp-desc">clip-path: circle(50%)</p></div>
<div class="cp-card"><div class="cp-shape cp-ellipse"></div><p class="cp-label">Ellipse</p><p class="cp-desc">clip-path: ellipse(50% 30%)</p></div>
<div class="cp-card"><div class="cp-shape cp-polygon"></div><p class="cp-label">Triangle</p><p class="cp-desc">clip-path: polygon()</p></div>
<div class="cp-card"><div class="cp-shape cp-diamond"></div><p class="cp-label">Diamond</p><p class="cp-desc">clip-path: polygon()</p></div>
<div class="cp-card"><div class="cp-shape cp-hexagon"></div><p class="cp-label">Hexagon</p><p class="cp-desc">clip-path: polygon()</p></div>
<div class="cp-card"><div class="cp-shape cp-star"></div><p class="cp-label">Star</p><p class="cp-desc">clip-path: polygon()</p></div>
</div></body></html>
