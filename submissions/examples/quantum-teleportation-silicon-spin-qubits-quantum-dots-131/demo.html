<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silicon Spin Qubits Quantum Dots - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css"></head><body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030712; color: #ffffff;">

    <div class="ease-card ease-card-glass silicon-container">
        <div class="silicon-header">
            <h2>Silicon Spin Qubits</h2>
            <span class="ease-badge ease-badge-primary">Semiconductor QC</span>
        </div>
        
        <div class="silicon-screen ease-center">
            <div class="silicon-flux flux-silicon-a"></div>
            <div class="silicon-flux flux-silicon-b"></div>
            <div class="silicon-boundary-ring"></div>
            <div class="silicon-core ease-center"></div>
        </div>

        <div class="silicon-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Enriched Silicon-28 &amp; Exchange Coupling</span>
            <button class="ease-btn ease-btn-primary ease-btn-sm ease-hover-grow">Run Silicon Spin Gate</button>
        </div>
    </div></body></html>
