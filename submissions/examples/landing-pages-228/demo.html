<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
        name="description"
        content="Neumorphic 3D rotating cube navigation menu"
    >
    <title>3D Cube Navigation</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="page">
        <section class="hero">

            <p class="eyebrow">EASEMOTION COMPONENT</p>

            <h1>3D Cube Navigation</h1>

            <p class="description">
                An interactive neumorphic navigation cube with smooth
                3D rotation and responsive controls.
            </p>

            <div class="cube-wrapper">

                <div class="cube" id="cube">

                    <button class="cube-face front" data-rotate="front">
                        <span>Home</span>
                    </button>

                    <button class="cube-face back" data-rotate="back">
                        <span>About</span>
                    </button>

                    <button class="cube-face right" data-rotate="right">
                        <span>Projects</span>
                    </button>

                    <button class="cube-face left" data-rotate="left">
                        <span>Skills</span>
                    </button>

                    <button class="cube-face top" data-rotate="top">
                        <span>Contact</span>
                    </button>

                    <button class="cube-face bottom" data-rotate="bottom">
                        <span>Explore</span>
                    </button>

                </div>

            </div>

            <div class="controls">
                <button class="control-btn" id="prevBtn">
                    ← Previous
                </button>

                <button class="control-btn primary" id="autoBtn">
                    Auto Rotate
                </button>

                <button class="control-btn" id="nextBtn">
                    Next →
                </button>
            </div>

            <p class="hint">
                Click any cube face or use the controls
            </p>

        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
