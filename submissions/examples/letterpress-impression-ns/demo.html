<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Letterpress Impression — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Letterpress Impression demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Letterpress Impression</h1>
      <p class="lede">Letterpress plate descending to stamp ink impression</p>
    </header>

    <section class="ease-letterpress-impression" data-demo="letterpress-impression" aria-live="polite">
      <div class="ease-letterpress-impression__housing">
        <div class="ease-letterpress-impression__bezel">
          <div class="ease-letterpress-impression__face">
            <div class="ease-letterpress-impression__readout">
              <span class="ease-letterpress-impression__label">Letterpress Impression</span>
              <span class="ease-letterpress-impression__value" id="val-letterpress-impression">READY</span>
            </div>
            <div class="ease-letterpress-impression__motion" aria-hidden="true">
              <span class="ease-letterpress-impression__arm"></span>
              <span class="ease-letterpress-impression__core"></span>
              <span class="ease-letterpress-impression__trail"></span>
              <span class="ease-letterpress-impression__mark m1"></span>
              <span class="ease-letterpress-impression__mark m2"></span>
              <span class="ease-letterpress-impression__mark m3"></span>
            </div>
            <div class="ease-letterpress-impression__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-letterpress-impression__controls">
          <button type="button" class="ease-letterpress-impression__btn primary">Engage</button>
          <button type="button" class="ease-letterpress-impression__btn">Reset</button>
          <label class="ease-letterpress-impression__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-letterpress-impression__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
