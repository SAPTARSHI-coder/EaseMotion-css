<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ease Morphing SVG Checkbox List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>My Tasks</h1>

    <div class="progress">
        <div class="progress-fill" id="progressBar"></div>
    </div>

    <p id="progressText">0 of 5 Tasks Completed</p>

    <div class="task-list">

        <label class="task">
            <input type="checkbox">

            <span class="checkbox">
                <svg viewBox="0 0 24 24">
                    <path d="M5 13 L10 18 L19 7"/>
                </svg>
            </span>

            <span class="task-text">Learn HTML</span>
        </label>

        <label class="task">
            <input type="checkbox">

            <span class="checkbox">
                <svg viewBox="0 0 24 24">
                    <path d="M5 13 L10 18 L19 7"/>
                </svg>
            </span>

            <span class="task-text">Practice CSS</span>
        </label>

        <label class="task">
            <input type="checkbox">

            <span class="checkbox">
                <svg viewBox="0 0 24 24">
                    <path d="M5 13 L10 18 L19 7"/>
                </svg>
            </span>

            <span class="task-text">Build JavaScript Project</span>
        </label>

        <label class="task">
            <input type="checkbox">

            <span class="checkbox">
                <svg viewBox="0 0 24 24">
                    <path d="M5 13 L10 18 L19 7"/>
                </svg>
            </span>

            <span class="task-text">Review Pull Request</span>
        </label>

        <label class="task">
            <input type="checkbox">

            <span class="checkbox">
                <svg viewBox="0 0 24 24">
                    <path d="M5 13 L10 18 L19 7"/>
                </svg>
            </span>

            <span class="task-text">Celebrate 🎉</span>
        </label>

    </div>

    <p id="message"></p>

</div>

<script src="script.js"></script>

</body>
</html>
