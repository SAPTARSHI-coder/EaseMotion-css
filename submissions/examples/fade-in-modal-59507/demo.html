<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Fade-In Modal - EaseMotion</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="showcase-container">
    <header class="showcase-header">
      <h1>EaseMotion CSS</h1>
      <p>Fade-In Modal Showcase</p>
    </header>

    <div class="action-area">
      <a href="#demo-modal" class="btn btn-primary" role="button">Open Fade-In Modal</a>
    </div>
  </main>

  <!-- Modal Structure -->
  <div id="demo-modal" class="modal-overlay">
    <div class="modal-container" role="dialog" aria-labelledby="modal-title" aria-modal="true">
      <a href="#" class="modal-close" aria-label="Close modal">&times;</a>
      
      <div class="modal-header">
        <h2 id="modal-title">Upgrade Your Plan</h2>
      </div>
      
      <div class="modal-content">
        <p>Unlock advanced features, priority support, and unlimited projects by upgrading to the Pro plan today.</p>
        <div class="features-list">
          <div class="feature-item">
            <span class="icon">✨</span> Unlimited Projects
          </div>
          <div class="feature-item">
            <span class="icon">🚀</span> Priority 24/7 Support
          </div>
          <div class="feature-item">
            <span class="icon">📊</span> Advanced Analytics
          </div>
        </div>
      </div>
      
      <div class="modal-footer">
        <a href="#" class="btn btn-secondary" role="button">Cancel</a>
        <a href="#" class="btn btn-primary" role="button">Upgrade Now</a>
      </div>
    </div>
  </div>
</body>
</html>
