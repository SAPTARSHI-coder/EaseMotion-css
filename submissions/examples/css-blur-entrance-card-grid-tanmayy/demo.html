<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Blur-Entrance Card Grid - EaseMotion CSS</title>
  <!-- Import EaseMotion CSS -->
  <link rel="stylesheet" href="../../../easemotion.css">
  <!-- Component Specific Styles -->
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="blur-checkout-bg">

  <div class="demo-container">
    
    <div class="checkout-panel ease-glass-card">
      <div class="checkout-header">
        <h2 class="ease-text-2xl">Select Delivery Address</h2>
        <p class="ease-color-muted">Where should we send your order?</p>
      </div>

      <!-- Blur-Entrance Card Grid (Pure CSS Radio Group) -->
      <div class="card-grid blur-entrance-grid">
        
        <!-- Card 1 -->
        <label class="grid-card-label" tabindex="0">
          <input type="radio" name="address_method" class="card-radio" value="home" checked>
          <div class="card-content">
            <div class="card-header">
              <div class="card-icon">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
              </div>
              <span class="badge">Default</span>
            </div>
            <div class="card-text">
              <h3 class="card-title">Home Address</h3>
              <p class="card-desc">1234 EaseMotion Blvd<br>San Francisco, CA 94103</p>
            </div>
            <div class="card-indicator">
              <div class="check-circle"></div>
            </div>
          </div>
        </label>

        <!-- Card 2 -->
        <label class="grid-card-label" tabindex="0">
          <input type="radio" name="address_method" class="card-radio" value="work">
          <div class="card-content">
            <div class="card-header">
              <div class="card-icon">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>
              </div>
            </div>
            <div class="card-text">
              <h3 class="card-title">Work Office</h3>
              <p class="card-desc">987 Tech Park Suite 101<br>San Jose, CA 95134</p>
            </div>
            <div class="card-indicator">
              <div class="check-circle"></div>
            </div>
          </div>
        </label>

        <!-- Card 3 -->
        <label class="grid-card-label" tabindex="0">
          <input type="radio" name="address_method" class="card-radio" value="family">
          <div class="card-content">
            <div class="card-header">
              <div class="card-icon">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
              </div>
            </div>
            <div class="card-text">
              <h3 class="card-title">Family Box</h3>
              <p class="card-desc">PO Box 456<br>Oakland, CA 94612</p>
            </div>
            <div class="card-indicator">
              <div class="check-circle"></div>
            </div>
          </div>
        </label>

        <!-- Add New Card -->
        <label class="grid-card-label add-new" tabindex="0">
          <div class="card-content add-new-content">
            <div class="add-icon">
              <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            </div>
            <h3 class="card-title">Add New Address</h3>
          </div>
        </label>

      </div>

      <div class="checkout-footer">
        <button class="continue-btn ease-squish-button">Continue to Delivery Options</button>
      </div>
    </div>

  </div>

</body>
</html>
