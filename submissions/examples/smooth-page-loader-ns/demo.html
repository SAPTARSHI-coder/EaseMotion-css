<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Smooth Page Loader | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Full Page Sweeping Loader Overlay -->
  <div class="ease-page-loader" role="region" aria-label="Page loading overlay">
    <div class="ease-loader-content">
      <div class="ease-loader-spinner" role="progressbar" aria-label="Loading content"></div>
      <span class="ease-loader-text">Loading Experience...</span>
    </div>
  </div>

  <!-- Underlying Content Demo -->
  <main class="loader-demo-container">
    <article class="ease-content-card">
      <h1>Welcome Aboard!</h1>
      <p>This page loader smoothly sweeps upward using pure CSS keyframes to reveal the underlying view without JavaScript timeouts.</p>
      <button class="ease-replay-btn" onclick="window.location.reload();">Replay Animation</button>
    </article>
  </main>

</body>
</html>
