<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Pure CSS animated hourglass loader with sand particles."
  >
  <title>CSS Hourglass Loader</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="demo">
    <section class="demo-card" aria-labelledby="demo-title">

      <p class="demo-card__eyebrow">EaseMotion CSS</p>

      <h1 id="demo-title">CSS Hourglass Loader</h1>

      <p class="demo-card__description">
        A lightweight loading animation built entirely with HTML and CSS.
      </p>

      <div
        class="hourglass-loader"
        role="status"
        aria-label="Loading content"
      >
        <div class="hourglass" aria-hidden="true">

          <div class="hourglass__frame">

            <div class="hourglass__glass">
              <span class="sand sand--1"></span>
              <span class="sand sand--2"></span>
              <span class="sand sand--3"></span>
              <span class="sand sand--4"></span>
              <span class="sand sand--5"></span>
            </div>

            <div class="hourglass__sand hourglass__sand--top"></div>
            <div class="hourglass__sand hourglass__sand--bottom"></div>

            <span class="hourglass__neck"></span>

          </div>

        </div>

        <span class="hourglass-loader__text">
          Loading...
        </span>
      </div>

      <p class="demo-card__hint">
        The animation automatically loops while content is loading.
      </p>

    </section>
  </main>

</body>
</html>
