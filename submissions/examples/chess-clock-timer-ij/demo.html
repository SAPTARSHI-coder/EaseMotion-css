<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-chess-clock-timer demo</title>
</head>
<body>
<div class="cc-app">
  <span class="cc-title">MATCH CLOCK</span>
  <div class="cc-board">
    <div class="cc-side cc-white">
      <span class="cc-player">WHITE</span>
      <span class="cc-time">12:34</span>
      <span class="cc-moves">MOVES 24</span>
      <span class="cc-flag">&#9812;</span>
    </div>
    <span class="cc-divider"></span>
    <div class="cc-side cc-black">
      <span class="cc-player">BLACK</span>
      <span class="cc-time">10:08</span>
      <span class="cc-moves">MOVES 23</span>
      <span class="cc-flag">&#9818;</span>
    </div>
  </div>
  <div class="cc-buttons">
    <span class="cc-btn cc-btn-1">RESET</span>
    <span class="cc-btn cc-btn-2">PAUSE</span>
  </div>
  <span class="cc-status">WHITE TO MOVE</span>
</div>
</body>
</html>
