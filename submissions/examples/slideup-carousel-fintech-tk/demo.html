<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ease Slide-Up Carousel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<section class="carousel-demo">

    <h1>Fintech Dashboard</h1>
    <p class="subtitle">
        CSS Slide-Up Carousel for financial insights
    </p>

    <!-- Radio Controls -->
    <input type="radio" name="slider" id="slide1" checked>
    <input type="radio" name="slider" id="slide2">
    <input type="radio" name="slider" id="slide3">

    <!-- Slides -->
    <div class="carousel">

        <div class="slides">

            <article class="card">
                <h2>Portfolio Growth</h2>
                <p>+18.2%</p>
                <span>Monthly Return</span>
            </article>

            <article class="card">
                <h2>Revenue</h2>
                <p>$42,500</p>
                <span>This Month</span>
            </article>

            <article class="card">
                <h2>Transactions</h2>
                <p>2,431</p>
                <span>Completed</span>
            </article>

        </div>

    </div>

    <!-- Navigation -->
    <div class="controls">

        <label for="slide1"></label>
        <label for="slide2"></label>
        <label for="slide3"></label>

    </div>

</section>

</body>
</html>
