<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Skew-Active Toast — SaaS Showcase</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="ease-container">
    <p class="ease-eyebrow">API Performance</p>
    <h1 class="ease-heading">Webhook Dispatch</h1>
    <p class="ease-subtitle">Toggle or hover the notification to trigger the dynamic shear skew entrance effect.</p>

    <div class="ease-toast-wrapper">
      <input type="checkbox" id="ease-saas-skew-toggle" class="ease-toast-input" checked />

      <label for="ease-saas-skew-toggle" class="ease-trigger-btn">
        Toggle Webhook Toast
      </label>

      <div class="ease-toast">
        <div class="ease-toast-icon">⚡</div>

        <div class="ease-toast-content">
          <p class="ease-toast-title">Webhook Payload Delivered</p>
          <p class="ease-toast-message">Event `user.signup` processed with HTTP 200 (14ms latency).</p>
        </div>

        <label for="ease-saas-skew-toggle" class="ease-toast-close" title="Dismiss Alert">✕</label>
      </div>
    </div>
  </main>
</body>
</html>
