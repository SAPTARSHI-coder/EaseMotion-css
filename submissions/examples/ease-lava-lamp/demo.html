<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Lava Lamp Background Demo - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="ease-lava-wrapper">
    <!-- Background Lava Layer -->
    <div class="ease-lava-bg" aria-hidden="true">
      <div class="ease-blob ease-blob-1"></div>
      <div class="ease-blob ease-blob-2"></div>
      <div class="ease-blob ease-blob-3"></div>
    </div>
    <!-- Foreground Content -->
    <div class="ease-lava-content">
      <h1>Pure CSS Lava</h1>
      <p>Organic morphing animations with backdrop-filter glassmorphism.</p>
    </div>
    <p style="position: absolute; bottom: 2rem; color: rgba(255,255,255,0.4); font-family: system-ui; font-size: 0.875rem;">Zero JS. Zero SVG. 100% CSS Compositor.</p>
  </div>
</body>
</html>
