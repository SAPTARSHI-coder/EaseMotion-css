<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Zoom-In Navbar - E-Commerce Checkout</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- E-Commerce Checkout Header Example -->
  <header class="ease-checkout-header">
    <div class="ease-container">
      
      <div class="ease-logo zoom-in-element" style="--zoom-delay: 0.1s;">
        <span class="logo-icon">🛒</span>
        <span class="logo-text">EaseShop</span>
      </div>

      <nav class="ease-checkout-nav">
        <ul class="ease-nav-list">
          <li class="ease-nav-item zoom-in-element" style="--zoom-delay: 0.2s;">
            <a href="#" class="ease-nav-link completed">
              <span class="step-num">1</span>
              <span class="step-name">Cart</span>
            </a>
          </li>
          <li class="ease-nav-item zoom-in-element" style="--zoom-delay: 0.3s;">
            <a href="#" class="ease-nav-link active">
              <span class="step-num">2</span>
              <span class="step-name">Shipping</span>
            </a>
          </li>
          <li class="ease-nav-item zoom-in-element" style="--zoom-delay: 0.4s;">
            <a href="#" class="ease-nav-link">
              <span class="step-num">3</span>
              <span class="step-name">Payment</span>
            </a>
          </li>
        </ul>
      </nav>

      <div class="ease-secure-checkout zoom-in-element" style="--zoom-delay: 0.5s;">
        <span class="secure-icon">🔒</span>
        <span class="secure-text">Secure Checkout</span>
      </div>

    </div>
  </header>

  <main class="ease-main-content">
    <div class="placeholder-content zoom-in-element" style="--zoom-delay: 0.6s;">
      <h2>Shipping Details</h2>
      <p>Enter your shipping address to continue.</p>
    </div>
  </main>

</body>
</html>
