<!-- EaseMotion component: bowling-lane-strike -->
<!DOCTYPE html>
<html lang="en" data-bowl="lane">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2">
<title>Ease Bowling Lane Strike</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="bowl-arena">
  <header class="bowl-head">
    <span class="bowl-title">LANE 7</span>
    <span class="bowl-frame">FRAME 4</span>
  </header>
  <div class="bowl-deck">
    <span class="pin pin-a"></span>
    <span class="pin pin-b"></span>
    <span class="pin pin-c"></span>
    <span class="pin pin-d"></span>
    <span class="pin pin-e"></span>
    <span class="pin pin-f"></span>
    <span class="pin pin-g"></span>
    <span class="pin pin-h"></span>
    <span class="pin pin-i"></span>
    <span class="pin pin-j"></span>
  </div>
  <div class="bowl-lane">
    <span class="lane-board board-1"></span>
    <span class="lane-board board-2"></span>
    <span class="lane-board board-3"></span>
    <span class="bowl-ball"></span>
  </div>
  <footer class="bowl-foot">
    <span class="bowl-spare">SPARE 47</span>
    <span class="bowl-strike">STRIKE!</span>
  </footer>
</main>
</body>
</html>
