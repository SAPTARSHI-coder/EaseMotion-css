<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Accessible pure CSS floating elevation toggle"
  >
  <title>Floating Elevation Toggle</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">
    <section class="toggle-card" aria-labelledby="title">
      <span class="badge">CSS Toggle</span>

      <h1 id="title">Floating Elevation</h1>

      <p class="description">
        A smooth toggle with an elevated floating thumb interaction.
      </p>

      <div class="toggle-demo">
        <input
          class="toggle-input"
          type="checkbox"
          id="elevation-toggle"
        >

        <label class="toggle" for="elevation-toggle">
          <span class="toggle-track">
            <span class="toggle-thumb">
              <span class="thumb-icon" aria-hidden="true"></span>
            </span>
          </span>

          <span class="toggle-label">
            Enable floating mode
          </span>
        </label>
      </div>

      <p class="hint">
        Click or use the keyboard to toggle
      </p>
    </section>
  </main>

</body>
</html>
