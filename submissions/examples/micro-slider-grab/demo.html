<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Micro Slider Grab &mdash; EaseMotion CSS Demo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="page-head">
    <p class="kicker">EaseMotion CSS &middot; Micro-interactions</p>
    <h1>Micro Slider Grab</h1>
    <p class="sub">Grab the thumb and it grows to meet your hand.</p>
  </header>
  <main class="stage">
    <div class="msg-wrap">
      <span class="msg-value">60%</span>
      <input class="msg-range" type="range" min="0" max="100" value="60" />
    </div>
  </main>
  <p class="stage-caption">Hover to inflate the grip, drag to set your value.</p>
  <footer class="page-foot">
    <span>Pure CSS &middot; zero dependencies</span>
    <span>Growing thumb</span>
  </footer>
</body>
</html>
