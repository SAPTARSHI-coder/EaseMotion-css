<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EaseMotion CSS | Shimmer-Sweep Modal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<section class="hero">
    <h1>Shimmer-Sweep Product Modal</h1>
    <p>Elegant animated modal with shimmer sweep effect built using pure HTML & CSS.</p>

    <a href="#modal" class="open-btn">View Product</a>
</section>

<div id="modal" class="modal">

    <div class="modal-box">

        <a href="#" class="close-btn">&times;</a>

        <div class="modal-image">
            <img src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=900"
                alt="Product">
        </div>

        <div class="modal-content">

            <span class="badge">NEW</span>

            <h2>Quantum Smart Phone</h2>

            <p>
                Premium flagship smartphone featuring AI camera,
                AMOLED display, ultra-fast charging and premium finish.
            </p>

            <div class="price">
                ₹54,999
            </div>

            <div class="features">

                <span>AI Camera</span>
                <span>256GB</span>
                <span>5G</span>
                <span>120Hz</span>

            </div>

            <div class="buttons">

                <button class="buy">Buy Now</button>
                <button class="cart">Add to Cart</button>

            </div>

        </div>

    </div>

</div>

</body>
</html>
