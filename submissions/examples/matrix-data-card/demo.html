<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Matrix Data Card</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

<main class="container">

  <section class="matrix-card" tabindex="0" aria-label="Matrix Data Card">

    <div class="matrix-rain">
      <span>010101</span>
      <span>101010</span>
      <span>110011</span>
      <span>001101</span>
      <span>111000</span>
      <span>010110</span>
    </div>

    <div class="content">
      <h1>System Data</h1>

      <div class="data-grid">
        <div>
          <h3>CPU</h3>
          <p>78%</p>
        </div>

        <div>
          <h3>Memory</h3>
          <p>64%</p>
        </div>

        <div>
          <h3>Network</h3>
          <p>92%</p>
        </div>

        <div>
          <h3>Status</h3>
          <p>Online</p>
        </div>
      </div>

      <button>
        View Data
      </button>

    </div>

  </section>

</main>

</body>
</html>
