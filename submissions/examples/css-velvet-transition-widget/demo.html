<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Velvet Smooth Transition Widget</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <h1>Premium Analytics</h1>
      <p class="subtitle">Velvet Smooth Transition Variation</p>
    </header>

    <main class="dashboard-grid">
      <!-- Widget 1: Burgundy Velvet -->
      <a href="#" class="velvet-widget burgundy" aria-labelledby="widget1-title">
        <!-- Visual Layer (Decorative Velvet Surface) -->
        <div class="velvet-surface" aria-hidden="true">
          <div class="velvet-texture"></div>
          <div class="velvet-sheen"></div>
        </div>

        <!-- Semantic Content Layer -->
        <article class="widget-content">
          <header class="widget-header">
            <h2 id="widget1-title" class="widget-title">Engagement</h2>
          </header>
          
          <div class="widget-body">
            <div class="primary-metric">94.8<span class="metric-unit">%</span></div>
            <div class="secondary-metric">
              <span class="trend-icon positive">↑</span>
              <span class="trend-value">+6.2%</span>
              <span class="trend-label">this week</span>
            </div>
          </div>
          
          <footer class="widget-footer">
            <p>Excellent Retention</p>
          </footer>
        </article>
      </a>

      <!-- Widget 2: Midnight Velvet -->
      <a href="#" class="velvet-widget midnight" aria-labelledby="widget2-title">
        <!-- Visual Layer (Decorative Velvet Surface) -->
        <div class="velvet-surface" aria-hidden="true">
          <div class="velvet-texture"></div>
          <div class="velvet-sheen"></div>
        </div>

        <!-- Semantic Content Layer -->
        <article class="widget-content">
          <header class="widget-header">
            <h2 id="widget2-title" class="widget-title">Total Revenue</h2>
          </header>
          
          <div class="widget-body">
            <div class="primary-metric"><span class="metric-unit">$</span>14.2k</div>
            <div class="secondary-metric">
              <span class="trend-icon warning">↓</span>
              <span class="trend-value">-1.4%</span>
              <span class="trend-label">this month</span>
            </div>
          </div>
          
          <footer class="widget-footer">
            <p>Premium Tier Subscriptions</p>
          </footer>
        </article>
      </a>
    </main>
  </div>
</body>
</html>
