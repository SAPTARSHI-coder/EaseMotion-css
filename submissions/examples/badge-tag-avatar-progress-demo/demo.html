<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EaseMotion — Badge, Tag, Avatar, Progress Demo</title>
  <link rel="stylesheet" href="../../core/variables.css">
  <link rel="stylesheet" href="../../components/badges.css">
  <link rel="stylesheet" href="../../components/tag.css">
  <link rel="stylesheet" href="../../components/avatar.css">
  <link rel="stylesheet" href="../../components/progress.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="demo-container">
    <h1>Badge, Tag, Avatar & Progress Components</h1>

    <section class="demo-section">
      <h3>Badges</h3>
      <div class="flex-row">
        <span class="ease-badge ease-badge-primary">Primary</span>
        <span class="ease-badge ease-badge-success">Success</span>
        <span class="ease-badge ease-badge-warning">Warning</span>
        <span class="ease-badge ease-badge-danger">Danger</span>
        <span class="ease-badge ease-badge-neutral">Neutral</span>
      </div>
    </section>

    <section class="demo-section">
      <h3>Tags</h3>
      <div class="flex-row">
        <span class="ease-tag">Default</span>
        <span class="ease-tag ease-tag-outlined">Outlined</span>
        <span class="ease-tag ease-tag-removable">Removable ×</span>
      </div>
    </section>

    <section class="demo-section">
      <h3>Avatars</h3>
      <div class="flex-row">
        <div class="ease-avatar ease-avatar-sm">AB</div>
        <div class="ease-avatar">CD</div>
        <div class="ease-avatar ease-avatar-lg">EF</div>
        <div class="ease-avatar ease-avatar-primary">GH</div>
      </div>
    </section>

    <section class="demo-section">
      <h3>Progress Bars</h3>
      <div class="progress-stack">
        <div class="ease-progress"><div class="ease-progress-bar" style="width:25%"></div></div>
        <div class="ease-progress"><div class="ease-progress-bar ease-progress-success" style="width:60%"></div></div>
        <div class="ease-progress"><div class="ease-progress-bar ease-progress-warning" style="width:80%"></div></div>
        <div class="ease-progress"><div class="ease-progress-bar ease-progress-danger" style="width:95%"></div></div>
      </div>
    </section>
  </div>
</body>
</html>
