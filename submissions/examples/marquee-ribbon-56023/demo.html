<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagonal Marquee Ribbon Demo</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            margin: 0;
            height: 100vh;
            background-color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .product-card {
            position: relative; /* Essential for absolute positioning the ribbon */
            width: 320px;
            height: 420px;
            background-color: white;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow: hidden; /* Hide the ribbon edges that stick out */
            display: flex;
            flex-direction: column;
        }
        
        .product-image {
            height: 60%;
            background-color: #e2e8f0;
            background-image: url('https://images.unsplash.com/photo-1505740420928-5e560c06d30e?q=80&w=2670&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
        }
        
        .product-info {
            padding: 24px;
        }
        
        .product-info h3 {
            margin: 0 0 10px 0;
            color: #1e293b;
        }
        
        .product-info p {
            margin: 0;
            color: #64748b;
            font-size: 0.9rem;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="product-card">
        <!-- The Marquee Ribbon Component -->
        <div class="ease-ribbon-wrapper">
            <div class="ease-ribbon">
                <div class="ease-ribbon-content">
                    <!-- Duplicate text to ensure seamless looping -->
                    <span>BLACK FRIDAY SALE </span>
                    <span>BLACK FRIDAY SALE </span>
                    <span>BLACK FRIDAY SALE </span>
                    <span>BLACK FRIDAY SALE </span>
                </div>
            </div>
        </div>
        
        <div class="product-image"></div>
        <div class="product-info">
            <h3>Premium Headphones</h3>
            <p>Experience studio quality sound with active noise cancellation and 40-hour battery life.</p>
        </div>
    </div>
</body>
</html>
