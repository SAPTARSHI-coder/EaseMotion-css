<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <title>Neon Pulse Glow Flash</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="demo">
    <section class="intro">
      <span class="label">EaseMotion Core</span>

      <h1>Neon Pulse Glow Flash</h1>

      <p>
        A lightweight CSS keyframe utility for creating a smooth
        neon glow pulse and flash effect.
      </p>
    </section>

    <section class="demo-stage">
      <div
        class="neon-orb ease-anim-neon-pulse-glow-flash"
        aria-label="Animated neon pulse"
      >
        <div class="neon-orb__content">
          <span class="neon-orb__symbol">✦</span>
          <span class="neon-orb__title">NEON</span>
          <span class="neon-orb__subtitle">PULSE</span>
        </div>
      </div>
    </section>

    <p class="hint">
      CSS-only · Transform + opacity · Reduced-motion aware
    </p>
  </main>
</body>
</html>
