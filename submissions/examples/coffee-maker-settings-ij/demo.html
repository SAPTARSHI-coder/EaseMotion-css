<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-coffee-maker-settings</title>
</head>
<body>
<main class="cms-machine">
  <header class="cms-top">
    <h1 class="cms-model">BrewMate</h1>
    <span class="cms-mode">Medium</span>
  </header>
  <section class="cms-strength" aria-label="strength settings">
    <button class="cms-btn">Mild</button>
    <button class="cms-btn cms-on">Medium</button>
    <button class="cms-btn">Bold</button>
  </section>
  <section class="cms-temp" aria-label="temperature display">
    <span class="cms-tlabel">Temp</span>
    <strong class="cms-tval">92 C</strong>
  </section>
  <section class="cms-cup" aria-label="coffee cup">
    <span class="cms-drip"></span>
    <span class="cms-drip"></span>
    <span class="cms-drip"></span>
    <div class="cms-mug"></div>
  </section>
  <footer class="cms-foot">
    <span class="cms-water">Water 1.2 L</span>
    <button class="cms-brew">Brew</button>
  </footer>
</main>
</body>
</html>
