<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mortise Bolt Throw — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Mortise Bolt Throw demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Mortise Bolt Throw</h1>
      <p class="lede">Mortise bolt throwing into the keep</p>
    </header>

    <section class="ease-mortise-bolt-throw" data-demo="mortise-bolt-throw" aria-live="polite">
      <div class="ease-mortise-bolt-throw__housing">
        <div class="ease-mortise-bolt-throw__bezel">
          <div class="ease-mortise-bolt-throw__face">
            <div class="ease-mortise-bolt-throw__readout">
              <span class="ease-mortise-bolt-throw__label">Mortise Bolt Throw</span>
              <span class="ease-mortise-bolt-throw__value">LIVE</span>
            </div>
            <div class="ease-mortise-bolt-throw__motion" aria-hidden="true">
              <span class="ease-mortise-bolt-throw__a"></span>
              <span class="ease-mortise-bolt-throw__b"></span>
              <span class="ease-mortise-bolt-throw__c"></span>
              <span class="ease-mortise-bolt-throw__d"></span>
            </div>
            <div class="ease-mortise-bolt-throw__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-mortise-bolt-throw__controls">
          <button type="button" class="ease-mortise-bolt-throw__btn primary">Throw</button>
          <button type="button" class="ease-mortise-bolt-throw__btn">Retract</button>
          <label class="ease-mortise-bolt-throw__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-mortise-bolt-throw__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
