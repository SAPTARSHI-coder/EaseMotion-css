<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Pure CSS 3D flipping coin animation."
  >
  <title>CSS Flipping Coin Animation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="coin-page">
    <section class="coin-demo" aria-labelledby="coin-title">
      <span class="eyebrow">EaseMotion CSS</span>

      <h1 id="coin-title">Flipping Coin</h1>

      <p class="intro">
        A responsive 3D coin animation built entirely with HTML and CSS.
        Hover over the coin to flip it.
      </p>

      <div class="coin-scene">
        <div class="coin" tabindex="0" aria-label="Animated flipping coin">
          <div class="coin-face coin-front">
            <span class="coin-symbol">★</span>
            <span class="coin-label">HEADS</span>
          </div>

          <div class="coin-face coin-back">
            <span class="coin-symbol">✦</span>
            <span class="coin-label">TAILS</span>
          </div>
        </div>
      </div>

      <p class="hint">
        Hover or focus the coin
      </p>
    </section>
  </main>
</body>
</html>
