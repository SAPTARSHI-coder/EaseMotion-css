<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather Widget Component - Data Category (#86857)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="ease-wx-stage" aria-labelledby="stage-title">
    <h1 id="stage-title" style="position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0;">Weather Widget Demo</h1>

    <!-- Weather Card Component -->
    <div class="ease-weather-card" id="wx-card">
      <div class="ease-wx-header">
        <div>
          <h2 class="ease-wx-location">San Francisco, CA</h2>
          <p class="ease-wx-condition">Partly Cloudy</p>
        </div>
        <div class="ease-wx-animation-container" aria-hidden="true">
          <div class="ease-wx-sun">☀</div>
          <div class="ease-wx-cloud">☁</div>
        </div>
      </div>

      <div class="ease-wx-temp-row">
        <span class="ease-wx-temp">72°</span>
        <span style="font-size: 1rem; color: var(--wx-muted); font-weight: 600;">H: 78° L: 58°</span>
      </div>

      <div class="ease-wx-details">
        <div class="ease-wx-detail-item">
          <span>Humidity</span>
          <span class="ease-wx-detail-val">48%</span>
        </div>
        <div class="ease-wx-detail-item">
          <span>Wind Speed</span>
          <span class="ease-wx-detail-val">12 mph NW</span>
        </div>
      </div>

      <!-- Forecast Row -->
      <div class="ease-forecast-row" aria-label="3-Day Forecast">
        <div class="ease-forecast-card">
          <span class="ease-forecast-day">Mon</span>
          <span class="ease-forecast-icon" aria-hidden="true">⛅</span>
          <span class="ease-forecast-temp">74° / 60°</span>
        </div>
        <div class="ease-forecast-card">
          <span class="ease-forecast-day">Tue</span>
          <span class="ease-forecast-icon" aria-hidden="true">☀</span>
          <span class="ease-forecast-temp">79° / 62°</span>
        </div>
        <div class="ease-forecast-card">
          <span class="ease-forecast-day">Wed</span>
          <span class="ease-forecast-icon" aria-hidden="true">🌧</span>
          <span class="ease-forecast-temp">65° / 52°</span>
        </div>
      </div>
    </div>

    <button type="button" class="ease-btn-replay" id="refresh-btn">Refresh Weather Data</button>
  </main>

  <script>
    const card = document.getElementById('wx-card');
    const refreshBtn = document.getElementById('refresh-btn');

    refreshBtn.addEventListener('click', () => {
      card.style.transform = 'scale(0.97)';
      setTimeout(() => card.style.transform = 'scale(1)', 150);
    });
  </script>
</body>
</html>
