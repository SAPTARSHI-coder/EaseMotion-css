<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Isometric Hero Section - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Hero Section (Banner Role) -->
  <header class="hero-section" role="banner">
    
    <!-- Left Column Content -->
    <div class="hero-content">
      <span class="hero-tag">Engine version 1.2</span>
      <h1 class="hero-title">Next-Gen Web layouts <span>Optimized</span> in CSS</h1>
      <p class="hero-desc">Enforce modular interface design and fast page render loading speeds by wrapping layouts natively using the CSS @scope rule.</p>
      
      <div class="hero-cta">
        <button type="button" class="cta-btn cta-primary">Get Started</button>
        <button type="button" class="cta-btn cta-secondary">Documentation</button>
      </div>
    </div>

    <!-- Right Column 3D Isometric Visual Illustration -->
    <div class="hero-visual" aria-hidden="true">
      <div class="isometric-stage">
        
        <!-- Base Layer shadow -->
        <div class="iso-base"></div>

        <!-- Card 1: Bottom Analytics Widget -->
        <div class="iso-card c-analytics">
          <div class="card-line card-title-line"></div>
          <div class="card-line" style="width: 80%;"></div>
          <div class="card-line" style="width: 60%; margin-bottom: 0;"></div>
        </div>

        <!-- Card 2: Middle Bar Chart Widget -->
        <div class="iso-card c-chart">
          <div class="card-line" style="width: 40%; background-color: var(--accent-purple);"></div>
          <div class="card-bars">
            <div class="bar bar-1"></div>
            <div class="bar bar-2"></div>
            <div class="bar bar-3"></div>
          </div>
        </div>

        <!-- Card 3: Top Status Widget -->
        <div class="iso-card c-status">
          <div class="card-line" style="width: 70%; background-color: var(--secondary-neon);"></div>
          <div class="status-badge">
            <div class="status-dot"></div>
            <span>LIVE</span>
          </div>
        </div>

      </div>
    </div>

  </header>

</body>
</html>
