<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zero-Point Energy Vacuum Harvester - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030712; color: #ffffff;">

    <div class="ease-card ease-card-glass vacuum-container">
        <div class="vacuum-header">
            <h2>Vacuum Harvester</h2>
            <span class="ease-badge ease-badge-success">Harvesting</span>
        </div>
        
        <div class="vacuum-screen ease-center">
            <div class="casimir-flux flux-1"></div>
            <div class="casimir-flux flux-2"></div>
            <div class="quantum-fluctuation-ring"></div>
            <div class="zero-point-core ease-center"></div>
        </div>

        <div class="vacuum-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Net Yield: 99.8%</span>
            <button class="ease-btn ease-btn-primary ease-btn-sm ease-hover-grow">Boost Extraction</button>
        </div>
    </div>

</body>
</html>
