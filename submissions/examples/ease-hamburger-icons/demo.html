<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ease Hamburger Icons</title>
    <link rel="stylesheet" href="../../../easemotion.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="ease-hamburger-container">
        
        <!-- Hamburger to Cross (X) -->
        <div class="icon-wrapper">
            <h2>Hamburger to Cross</h2>
            <button class="ease-hamburger hamburger-cross" aria-label="Menu" aria-expanded="false">
                <span class="bar bar-top"></span>
                <span class="bar bar-mid"></span>
                <span class="bar bar-bot"></span>
            </button>
        </div>

        <!-- Hamburger to Arrow (Back) -->
        <div class="icon-wrapper">
            <h2>Hamburger to Arrow</h2>
            <button class="ease-hamburger hamburger-arrow" aria-label="Menu" aria-expanded="false">
                <span class="bar bar-top"></span>
                <span class="bar bar-mid"></span>
                <span class="bar bar-bot"></span>
            </button>
        </div>

        <!-- Hamburger to Minus -->
        <div class="icon-wrapper">
            <h2>Hamburger to Minus</h2>
            <button class="ease-hamburger hamburger-minus" aria-label="Menu" aria-expanded="false">
                <span class="bar bar-top"></span>
                <span class="bar bar-mid"></span>
                <span class="bar bar-bot"></span>
            </button>
        </div>

    </div>

    <!-- Minimal JS just to toggle the active class for preview purposes -->
    <script>
        const hamburgers = document.querySelectorAll('.ease-hamburger');
        hamburgers.forEach(btn => {
            btn.addEventListener('click', function() {
                this.classList.toggle('active');
                const isExpanded = this.getAttribute('aria-expanded') === 'true';
                this.setAttribute('aria-expanded', !isExpanded);
            });
        });
    </script>
</body>
</html>
