<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Audio Player Visualizer | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="demo-header">
    <h1>Audio Player Visualizer</h1>
    <p>Music player widget with CSS keyframe equalizer animation.</p>
  </header>

  <main class="demo-main">
    <section class="demo-section">
      <div class="ease-audio-card">
        <div class="ease-audio-cover">&#127911;</div>
        <div class="ease-audio-info">
          <h3 class="ease-audio-title">Midnight Beats</h3>
          <p class="ease-audio-artist">EaseMotion Chillwave</p>
        </div>
        <div class="ease-equalizer">
          <span class="ease-eq-bar"></span>
          <span class="ease-eq-bar"></span>
          <span class="ease-eq-bar"></span>
          <span class="ease-eq-bar"></span>
          <span class="ease-eq-bar"></span>
        </div>
        <button class="ease-audio-btn" aria-label="Play/Pause">&#9654;</button>
      </div>
    </section>
  </main>

  <footer class="demo-footer">
    <p>EaseMotion CSS Project</p>
  </footer>
</body>
</html>
