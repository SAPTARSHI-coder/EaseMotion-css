<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Animation Preset: Blur Prism Fade Light</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <div class="demo-card ease-anim-blur-prism-fade-light">
    <h1 class="demo-text">
      Prism Fade
    </h1>
  </div>

  <!-- Re-trigger animation script just for the demo loop -->
  <script>
    const el = document.querySelector('.demo-card');
    setInterval(() => {
      el.classList.remove('ease-anim-blur-prism-fade-light');
      void el.offsetWidth; // trigger reflow
      el.classList.add('ease-anim-blur-prism-fade-light');
    }, 3000);
  </script>
</body>
</html>
