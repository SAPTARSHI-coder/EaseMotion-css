<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card Footer Overflow Fix</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="card">
  <div class="card-body">
    <h2>Product Card</h2>
    <p>
      This example demonstrates a responsive card footer with multiple action buttons.
    </p>
  </div>

  <div class="card-footer">
    <button>Edit</button>
    <button>Preview</button>
    <button>Download</button>
    <button>Share</button>
  </div>
</div>

</body>
</html>
