<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spectroscope Slit Scan — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Spectroscope Slit Scan demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Spectroscope Slit Scan</h1>
      <p class="lede">Spectral slit scanning across a dispersed rainbow band</p>
    </header>

    <section class="ease-spectroscope-slit-scan" data-demo="spectroscope-slit-scan" aria-live="polite">
      <div class="ease-spectroscope-slit-scan__housing">
        <div class="ease-spectroscope-slit-scan__bezel">
          <div class="ease-spectroscope-slit-scan__face">
            <div class="ease-spectroscope-slit-scan__readout">
              <span class="ease-spectroscope-slit-scan__label">Spectroscope Slit Scan</span>
              <span class="ease-spectroscope-slit-scan__value">LIVE</span>
            </div>
            <div class="ease-spectroscope-slit-scan__motion" aria-hidden="true">
              <span class="ease-spectroscope-slit-scan__a"></span>
              <span class="ease-spectroscope-slit-scan__b"></span>
              <span class="ease-spectroscope-slit-scan__c"></span>
              <span class="ease-spectroscope-slit-scan__d"></span>
            </div>
            <div class="ease-spectroscope-slit-scan__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-spectroscope-slit-scan__controls">
          <button type="button" class="ease-spectroscope-slit-scan__btn primary">Engage</button>
          <button type="button" class="ease-spectroscope-slit-scan__btn">Reset</button>
          <label class="ease-spectroscope-slit-scan__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-spectroscope-slit-scan__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
