<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark light">
  <title>Quantum Energy Shield Button</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="demo-page">
    <section class="demo-card" aria-labelledby="demo-title">
      <p class="eyebrow">QUANTUM // ENERGY SYSTEM</p>

      <h1 id="demo-title">Energy Shield</h1>

      <p class="description">
        A futuristic button interface built entirely with HTML and
        Vanilla CSS.
      </p>

      <div class="button-showcase">

        <button class="quantum-button" type="button">
          <span class="shield" aria-hidden="true">
            <span class="shield-core"></span>
          </span>

          <span class="button-content">
            <span class="button-label">ACTIVATE SHIELD</span>
            <span class="button-subtitle">QUANTUM READY</span>
          </span>

          <span class="button-arrow" aria-hidden="true">→</span>
        </button>

        <button class="quantum-button quantum-button--secondary" type="button">
          <span class="shield" aria-hidden="true">
            <span class="shield-core"></span>
          </span>

          <span class="button-content">
            <span class="button-label">ENERGY ONLINE</span>
            <span class="button-subtitle">98% CAPACITY</span>
          </span>

          <span class="button-arrow" aria-hidden="true">↗</span>
        </button>

      </div>
    </section>
  </main>
</body>
</html>
