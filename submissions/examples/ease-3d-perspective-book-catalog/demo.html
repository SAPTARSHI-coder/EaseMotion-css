<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ease 3D Perspective Book Catalog</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>3D Bookshelf Catalog</h1>

<div class="bookshelf">

    <div class="book" data-title="The Motion Handbook"
         data-description="Learn modern CSS animations and UI motion design.">
        <div class="spine">Motion</div>
    </div>

    <div class="book" data-title="CSS Mastery"
         data-description="Advanced layouts, Grid, Flexbox and responsive techniques.">
        <div class="spine">CSS</div>
    </div>

    <div class="book" data-title="JavaScript Essentials"
         data-description="Build interactive web applications using Vanilla JavaScript.">
        <div class="spine">JS</div>
    </div>

    <div class="book" data-title="Accessibility Guide"
         data-description="Create inclusive and accessible web experiences.">
        <div class="spine">A11Y</div>
    </div>

</div>

<!-- Modal -->

<div class="modal" id="modal">

    <div class="modal-content">

        <button class="close-btn" aria-label="Close">&times;</button>

        <h2 id="bookTitle"></h2>

        <p id="bookDescription"></p>

    </div>

</div>

<script>

const books=document.querySelectorAll(".book");
const modal=document.getElementById("modal");
const title=document.getElementById("bookTitle");
const description=document.getElementById("bookDescription");

books.forEach(book=>{

    book.addEventListener("click",()=>{

        title.textContent=book.dataset.title;
        description.textContent=book.dataset.description;

        modal.classList.add("show");

    });

});

document.querySelector(".close-btn").onclick=()=>{

    modal.classList.remove("show");

};

modal.onclick=e=>{

    if(e.target===modal){

        modal.classList.remove("show");

    }

};

</script>

</body>
</html>
