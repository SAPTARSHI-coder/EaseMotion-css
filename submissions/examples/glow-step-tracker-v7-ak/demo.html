<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Step Progress Tracker — EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <p class="label">Pure CSS Wizard Step Progress Tracker</p>

  <div class="ease-step-progress-v7">
    <div class="ease-step-progress-bar-v7"></div>

    <div class="ease-step-item-v7 ease-step-item-v7--completed">
      <div class="ease-step-circle-v7">✓</div>
      <span class="ease-step-label-v7">Account</span>
    </div>

    <div class="ease-step-item-v7 ease-step-item-v7--active">
      <div class="ease-step-circle-v7">2</div>
      <span class="ease-step-label-v7">Billing</span>
    </div>

    <div class="ease-step-item-v7">
      <div class="ease-step-circle-v7">3</div>
      <span class="ease-step-label-v7">Confirm</span>
    </div>
  </div>

</body>
</html>
