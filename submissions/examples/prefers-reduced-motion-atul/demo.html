<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prefers Reduced Motion Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main>
    <h1>Prefers Reduced Motion</h1>

    <p>
      This demo shows an animated element that automatically
      respects the user's reduced-motion preference.
    </p>

    <div class="motion-box" aria-label="Animated demonstration">
      Motion Demo
    </div>

    <p>
      When <code>prefers-reduced-motion: reduce</code> is enabled,
      the animation is disabled while the content remains visible.
    </p>
  </main>

</body>
</html>
