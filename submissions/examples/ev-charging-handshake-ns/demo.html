<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EV Charging Handshake — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="EV Charging Handshake demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>EV Charging Handshake</h1>
      <p class="lede">EV charge port handshake with connector latch and energy flow</p>
    </header>

    <section class="ease-ev-charging-handshake" data-demo="ev-charging-handshake" aria-live="polite">
      <div class="ease-ev-charging-handshake__housing">
        <div class="ease-ev-charging-handshake__bezel">
          <div class="ease-ev-charging-handshake__face">
            <div class="ease-ev-charging-handshake__readout">
              <span class="ease-ev-charging-handshake__label">EV Charging Handshake</span>
              <span class="ease-ev-charging-handshake__value">CCS</span>
            </div>
            <div class="ease-ev-charging-handshake__motion" aria-hidden="true">
              <span class="ease-ev-charging-handshake__port"></span>
              <span class="ease-ev-charging-handshake__plug"></span>
              <span class="ease-ev-charging-handshake__latch"></span>
              <span class="ease-ev-charging-handshake__flow f1"></span>
              <span class="ease-ev-charging-handshake__flow f2"></span>
              <span class="ease-ev-charging-handshake__flow f3"></span>
            </div>
            <div class="ease-ev-charging-handshake__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-ev-charging-handshake__controls">
          <button type="button" class="ease-ev-charging-handshake__btn primary">Engage</button>
          <button type="button" class="ease-ev-charging-handshake__btn">Reset</button>
          <label class="ease-ev-charging-handshake__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-ev-charging-handshake__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
