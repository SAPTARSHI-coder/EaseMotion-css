<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Hero: Morphing Section Variation - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="em-demo-container">
        <!-- Pure CSS Morphing Hero Section Component Showcase -->
        <header class="em-hero-card" role="region" aria-label="Morphing Hero Section Showcase" tabindex="0">
            <div class="em-hero-header-bar">
                <span class="em-card-badge">HERO SECTIONS</span>
                <span class="em-brand-logo">HeroMotion</span>
            </div>
            <h1 class="em-card-title">Morphing Hero Section</h1>
            <p class="em-card-desc">A smooth, accessible, and performant pure CSS hero component featuring organic shape-morphing backgrounds, fluid typography, and frosted glassmorphism.</p>
            <div class="em-hero-wrapper">
                <div class="em-morphing-badge" aria-label="Interactive status indicator">
                    <span class="em-badge-text">EXPLORE HERO</span>
                </div>
            </div>
        </header>
    </div>
</body>
</html>
