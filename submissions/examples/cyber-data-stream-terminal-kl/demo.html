<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Data Stream Terminal - EaseMotion CSS</title>
    <!-- Include EaseMotion Core Stylesheet -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #021a12; color: #ffffff;">

    <div class="ease-card ease-card-glass terminal-container">
        <div class="terminal-header">
            <h2>Data Stream</h2>
            <span class="ease-badge ease-badge-success">Streaming</span>
        </div>
        
        <div class="terminal-screen ease-center">
            <div class="data-stream stream-1">01101001</div>
            <div class="data-stream stream-2">10110110</div>
            <div class="terminal-core ease-center"></div>
        </div>

        <div class="terminal-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Buffer: 4.2 KB/s</span>
            <button class="ease-btn ease-btn-primary ease-btn-sm ease-hover-grow">Flush</button>
        </div>
    </div>

</body>
</html>
