<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Wave Progress Fill</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="layout-container">
        
        <header class="section-header">
            <h1 class="title">Wave Progress Fill</h1>
            <p class="subtitle">A purely CSS-animated liquid progress container. Simulates water sloshing and filling without SVG paths or JavaScript physics.</p>
        </header>

        <div class="demo-area">
            
            <!-- 
              [TECHNIQUE] The Rotating Squircle 
              The parent container clips everything outside its circle.
              Inside, we have the "water" base which translates upwards to simulate filling.
              Attached to the water are two large pseudo-elements (the waves) with 
              a border-radius of ~40% (a squircle). By rotating these squircles infinitely,
              their top edge wobbles, creating a perfect liquid wave illusion.
            -->
            
            <!-- Circular Progress Indicator -->
            <div class="progress-circle" aria-label="Progress: 75%">
                <div class="water-container">
                    <div class="water-fill"></div>
                </div>
                <!-- Percentage text overlay -->
                <div class="progress-text">75%</div>
            </div>
            
            <!-- Pill-shaped Progress Indicator -->
            <div class="progress-pill" aria-label="Progress: 100%">
                <div class="water-container">
                    <div class="water-fill fill-full"></div>
                </div>
                <div class="progress-text">100%</div>
            </div>
            
        </div>
        
    </div>

    <!-- Replay button for demonstration purposes only -->
    <div class="demo-controls">
        <p>Refresh the page to replay the fill animation.</p>
    </div>

</body>
</html>
