<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fortune Teller · reveals hidden message</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <div class="fortune-container">
      <div class="fortune-display" id="fortuneDisplay">
        <!-- Crystal Ball -->
        <div class="crystal-ball" id="crystalBall">
          <div class="crystal-inner">
            <div class="crystal-glow"></div>
            <div class="crystal-mist"></div>
            <div class="crystal-fortune" id="crystalFortune">🔮</div>
          </div>
        </div>

        <!-- Fortune Reveal -->
        <div class="fortune-reveal" id="fortuneReveal">
          <div class="fortune-card">
            <div class="fortune-icon" id="fortuneIcon">🌟</div>
            <div class="fortune-message" id="fortuneMessage">Your destiny awaits...</div>
            <div class="fortune-subtext" id="fortuneSubtext">Click the crystal ball</div>
          </div>
        </div>

        <!-- Fortune Particles -->
        <div class="fortune-particles" id="fortuneParticles"></div>

        <!-- Fortune Count -->
        <div class="fortune-count">
          <span class="count-label">🔮 Fortunes</span>
          <span class="count-value" id="fortuneCount">0</span>
        </div>
      </div>
      
      <div class="fortune-status">
        <span id="fortuneStatus">🔮 Click the crystal ball for your fortune</span>
      </div>
    </div>

    <div class="controls">
      <button class="btn btn-fortune" id="fortuneBtn">🔮 Tell Fortune</button>
      <button class="btn btn-reveal" id="revealBtn">✨ Reveal All</button>
      <button class="btn btn-reset" id="resetBtn">⟳ Reset</button>
    </div>
    <div class="footer-note">
      <span>🔮 mystical fortunes · crystal ball · hidden messages</span>
    </div>
  </div>

  <script>
    (function() {
      "use strict";

      // DOM refs
      const crystalBall = document.getElementById('crystalBall');
      const crystalFortune = document.getElementById('crystalFortune');
      const fortuneReveal = document.getElementById('fortuneReveal');
      const fortuneIcon = document.getElementById('fortuneIcon');
      const fortuneMessage = document.getElementById('fortuneMessage');
      const fortuneSubtext = document.getElementById('fortuneSubtext');
      const fortuneParticles = document.getElementById('fortuneParticles');
      const fortuneCount = document.getElementById('fortuneCount');
      const fortuneStatus = document.getElementById('fortuneStatus');
      const fortuneBtn = document.getElementById('fortuneBtn');
      const revealBtn = document.getElementById('revealBtn');
      const resetBtn = document.getElementById('resetBtn');

      // State
      let count = 0;
      let isRevealing = false;
      let isFortunesRevealed = false;

      // Fortune messages
      const fortunes = [
        { icon: '🌟', message: 'A great adventure awaits you!', subtext: 'The stars align in your favor' },
        { icon: '🌙', message: 'Trust your intuition tonight.', subtext: 'The moon guides your path' },
        { icon: '🔥', message: 'Your passion will lead to success.', subtext: 'Fire burns within you' },
        { icon: '💫', message: 'A new opportunity is coming your way.', subtext: 'The universe has a plan' },
        { icon: '🌊', message: 'Go with the flow of life.', subtext: 'Like water, you adapt' },
        { icon: '⭐', message: 'You are destined for greatness.', subtext: 'Your star shines bright' },
        { icon: '🌈', message: 'Happiness is just around the corner.', subtext: 'A rainbow awaits you' },
        { icon: '🌺', message: 'Beauty will find you today.', subtext: 'Open your heart to it' },
        { icon: '🍀', message: 'Good luck is on your side.', subtext: 'The four-leaf clover smiles upon you' },
        { icon: '🎭', message: 'Embrace the mystery of life.', subtext: 'Every moment is magical' },
        { icon: '🦋', message: 'A transformation is coming.', subtext: 'Spread your wings and fly' },
        { icon: '🏔️', message: 'A great challenge will make you stronger.', subtext: 'The mountain awaits' },
        { icon: '🌅', message: 'A beautiful beginning is near.', subtext: 'The dawn of a new day' },
        { icon: '🎵', message: 'Follow the rhythm of your soul.', subtext: 'Your song is unique' },
        { icon: '🌿', message: 'Growth is a beautiful process.', subtext: 'Like a seed, you flourish' }
      ];

      // Create fortune particles
      function createFortuneParticles(count = 30) {
        const colors = ['#818cf8', '#a78bfa', '#c4b5fd', '#fbbf24', '#f472b6', '#34d399', '#60a5fa'];
        
        for (let i = 0; i < count; i++) {
          setTimeout(() => {
            const particle = document.createElement('div');
            particle.className = 'fortune-particle';
            
            const size = Math.random() * 8 + 3;
            particle.style.width = size + 'px';
            particle.style.height = size + 'px';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.top = Math.random() * 100 + '%';
            
            const color = colors[Math.floor(Math.random() * colors.length)];
            particle.style.backgroundColor = color;
            particle.style.boxShadow = `0 0 ${size * 2}px ${color}66`;
            
            const angle = Math.random() * Math.PI * 2;
            const distance = 40 + Math.random() * 100;
            particle.style.setProperty('--tx', Math.cos(angle) * distance + 'px');
            particle.style.setProperty('--ty', Math.sin(angle) * distance + 'px');
            
            particle.style.animationDuration = (Math.random() * 0.8 + 0.6) + 's';
            particle.style.animationDelay = (Math.random() * 0.3) + 's';
            
            fortuneParticles.appendChild(particle);
            
            setTimeout(() => {
              particle.remove();
            }, 2000);
          }, i * 20);
        }
      }

      // Get random fortune
      function getFortune() {
        const index = Math.floor(Math.random() * fortunes.length);
        return fortunes[index];
      }

      // Reveal fortune
      function revealFortune() {
        if (isRevealing) return;
        isRevealing = true;

        const fortune = getFortune();
        
        // Update crystal ball
        crystalFortune.textContent = '✨';
        crystalBall.classList.add('glowing');
        
        // Create particles
        createFortuneParticles(25);
        
        // Update status
        fortuneStatus.textContent = '🔮 The crystal ball glows...';
        fortuneStatus.style.color = '#a78bfa';
        
        // Reveal fortune after delay
        setTimeout(() => {
          // Update fortune reveal
          fortuneIcon.textContent = fortune.icon;
          fortuneMessage.textContent = fortune.message;
          fortuneSubtext.textContent = fortune.subtext;
          fortuneReveal.classList.add('revealed');
          
          // Update crystal ball
          crystalFortune.textContent = fortune.icon;
          crystalBall.classList.remove('glowing');
          
          // Update count
          count++;
          fortuneCount.textContent = count;
          
          // Update status
          fortuneStatus.textContent = `🔮 Fortune revealed! ✨ (${count})`;
          fortuneStatus.style.color = '#fbbf24';
          
          // Create celebration particles
          createFortuneParticles(15);
          
          setTimeout(() => {
            fortuneStatus.textContent = '🔮 Click the crystal ball for your fortune';
            fortuneStatus.style.color = '#94a3b8';
            isRevealing = false;
          }, 2000);
        }, 800);
      }

      // Reveal all fortunes (show all possible messages)
      function revealAll() {
        if (isFortunesRevealed) return;
        isFortunesRevealed = true;
        
        // Create a grid of all fortunes
        const grid = document.createElement('div');
        grid.className = 'fortune-grid';
        
        fortunes.forEach((fortune, index) => {
          const item = document.createElement('div');
          item.className = 'fortune-grid-item';
          item.style.animationDelay = (index * 0.05) + 's';
          item.innerHTML = `
            <span class="grid-icon">${fortune.icon}</span>
            <span class="grid-message">${fortune.message}</span>
          `;
          grid.appendChild(item);
        });
        
        // Replace display content
        const display = document.getElementById('fortuneDisplay');
        
        // Clear existing content (keep overlay)
        const overlay = display.querySelector('.fortune-count');
        const status = display.querySelector('.fortune-status');
        
        // Hide crystal ball and reveal
        crystalBall.style.display = 'none';
        fortuneReveal.style.display = 'none';
        
        // Add grid
        display.appendChild(grid);
        
        // Update status
        fortuneStatus.textContent = '✨ All fortunes revealed!';
        fortuneStatus.style.color = '#fbbf24';
        revealBtn.textContent = '✨ All Revealed';
        revealBtn.style.background = 'linear-gradient(135deg, #fbbf24, #f59e0b)';
        revealBtn.style.borderColor = '#fcd34d';
        
        // Create celebration
        createFortuneParticles(50);
      }

      // Reset
      function resetFortune() {
        if (isFortunesRevealed) {
          // Remove grid
          const grid = document.querySelector('.fortune-grid');
          if (grid) grid.remove();
          crystalBall.style.display = '';
          fortuneReveal.style.display = '';
          isFortunesRevealed = false;
          revealBtn.textContent = '✨ Reveal All';
          revealBtn.style.background = 'linear-gradient(135deg, #22c55e, #16a34a)';
          revealBtn.style.borderColor = '#4ade80';
        }
        
        fortuneReveal.classList.remove('revealed');
        fortuneIcon.textContent = '🌟';
        fortuneMessage.textContent = 'Your destiny awaits...';
        fortuneSubtext.textContent = 'Click the crystal ball';
        crystalFortune.textContent = '🔮';
        crystalBall.classList.remove('glowing');
        fortuneParticles.innerHTML = '';
        
        // Reset count
        count = 0;
        fortuneCount.textContent = '0';
        
        fortuneStatus.textContent = '🔄 Reset complete';
        fortuneStatus.style.color = '#94a3b8';
        setTimeout(() => {
          fortuneStatus.textContent = '🔮 Click the crystal ball for your fortune';
        }, 1000);
      }

      // Event listeners
      if (fortuneBtn) {
        fortuneBtn.addEventListener('click', function(e) {
          e.preventDefault();
          if (isFortunesRevealed) {
            resetFortune();
          } else {
            revealFortune();
          }
        });
      }

      if (revealBtn) {
        revealBtn.addEventListener('click', function(e) {
          e.preventDefault();
          revealAll();
        });
      }

      if (resetBtn) {
        resetBtn.addEventListener('click', function(e) {
          e.preventDefault();
          resetFortune();
        });
      }

      // Click on crystal ball to reveal fortune
      crystalBall.addEventListener('click', function(e) {
        e.stopPropagation();
        if (!isFortunesRevealed) {
          revealFortune();
        }
      });

      // Click on display to toggle
      const fortuneDisplay = document.getElementById('fortuneDisplay');
      fortuneDisplay.addEventListener('click', function(e) {
        if (e.target === this) {
          if (!isFortunesRevealed) {
            revealFortune();
          }
        }
      });

      // Keyboard shortcuts
      document.addEventListener('keydown', function(e) {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

        const key = e.key;
        if (key === ' ' || key === 'Space') {
          e.preventDefault();
          if (isFortunesRevealed) {
            resetFortune();
          } else {
            revealFortune();
          }
        } else if (key === 'f' || key === 'F') {
          e.preventDefault();
          revealFortune();
        } else if (key === 'a' || key === 'A') {
          e.preventDefault();
          revealAll();
        } else if (key === 'r' || key === 'R') {
          e.preventDefault();
          resetFortune();
        }
      });

      // Initialize
      console.log('🔮 Fortune Teller ready · shortcuts: [Space/F] Fortune, [A] Reveal All, [R] Reset');
    })();
  </script>
</body>
</html>
