<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EaseSmoothDialog Demo - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrapper">
    <h1 style="margin-bottom: 0.5rem;">EaseSmoothDialog</h1>
    <p style="color: #94a3b8; margin-bottom: 2rem;">Smooth native dialog entry and exit animations using <code>@starting-style</code> and <code>allow-discrete</code>.</p>
    <button class="ease-trigger-btn" onclick="document.getElementById('magic-dialog').showModal()">Open Dialog</button>
  </div>

  <dialog id="magic-dialog" class="ease-smooth-dialog">
    <h2 style="margin-top: 0; font-size: 1.5rem; color: #f8fafc;">Smooth Native Dialog</h2>
    <p style="color: #cbd5e1; line-height: 1.6;">
      This modal animates directly from <code>display: none</code> to top-layer display without JavaScript animation libraries or timing hacks.
    </p>
    <button 
      onclick="this.closest('dialog').close()" 
      style="margin-top: 1.5rem; background: #334155; color: #f8fafc; border: 1px solid #475569; padding: 0.6rem 1.25rem; border-radius: 8px; font-weight: 600; cursor: pointer;">
      Close
    </button>
  </dialog>
</body>
</html>
