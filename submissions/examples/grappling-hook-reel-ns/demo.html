<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ease Grappling Hook Reel</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

<main class="demo">

  <h1>Grappling Hook Reel</h1>
  <p>Industrial cable launcher and recovery system</p>


  <section class="ease-grappling-hook-reel">


    <div class="panel">
      <span>RESCUE REEL SYSTEM</span>
      <small>CABLE STATUS: ACTIVE</small>
    </div>


    <div class="launcher">


      <div class="reel">

        <div class="coil"></div>

      </div>


      <div class="cable"></div>


      <div class="hook">

        <span></span>
        <span></span>

      </div>


    </div>


    <div class="controls">

      <div>
        <label>DISTANCE</label>
        <strong>25M</strong>
      </div>


      <div>
        <label>MODE</label>
        <strong>RETRACT</strong>
      </div>

    </div>


  </section>


</main>

</body>
</html>
