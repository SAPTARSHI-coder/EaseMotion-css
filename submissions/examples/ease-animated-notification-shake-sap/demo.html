<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ease-animated-notification-shake-sap demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { height: 100vh; margin: 0; display: flex; flex-direction: column; gap: 16px; align-items: center; justify-content: center; background: #f4f4f5; font-family: system-ui, sans-serif; }
    button { padding: 8px 16px; border-radius: 8px; border: none; background: #111; color: #fff; cursor: pointer; }
  </style>
</head>
<body>
  <div class="notif-shake-sap" id="notif">⚠️ Connection lost. Retrying...</div>
  <button id="retryBtn">Simulate Retry Failure</button>
  <script>
    const notif = document.getElementById('notif');
    document.getElementById('retryBtn').addEventListener('click', () => {
      notif.classList.remove('shake');
      void notif.offsetWidth;
      notif.classList.add('shake');
    });
  </script>
</body>
</html>
