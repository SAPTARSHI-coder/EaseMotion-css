<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <meta
    name="description"
    content="CSS-only floating dark mode toggle component."
  />

  <title>Floating Dark Mode Toggle</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <main class="page">

    <section class="demo">

      <span class="eyebrow">EASEMOTION CSS</span>

      <h1>Floating Dark Mode Toggle</h1>

      <p class="intro">
        A floating dark mode control with a compact,
        modern interface and smooth CSS interactions.
      </p>

      <div class="preview">

        <div class="preview__content">

          <span class="preview__badge">
            UI COMPONENT
          </span>

          <h2>Comfortable interfaces, day or night.</h2>

          <p>
            Use the floating control to switch between
            light and dark visual modes.
          </p>

        </div>

        <label
          class="theme-toggle"
          aria-label="Toggle dark mode"
        >

          <input
            class="theme-toggle__input"
            type="checkbox"
          />

          <span class="theme-toggle__track">

            <span class="theme-toggle__sun">
              ☀
            </span>

            <span class="theme-toggle__moon">
              ☾
            </span>

            <span class="theme-toggle__thumb"></span>

          </span>

        </label>

      </div>

    </section>

  </main>

</body>
</html>
