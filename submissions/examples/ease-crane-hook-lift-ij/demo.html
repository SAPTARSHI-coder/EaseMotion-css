<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.5">
<title>Crane Hook Lift</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="crane-rig">
  <header class="crane-head">
    <h1 class="crane-name">HOIST 9</h1>
    <p class="crane-load">LOAD 3T</p>
  </header>
  <section class="crane-scene" aria-label="Tower crane over a site">
    <div class="crane-tower">
      <span class="tower-lattice"></span>
    </div>
    <div class="crane-jib">
      <span class="jib-brace"></span>
      <span class="cable-drum"></span>
      <span class="crane-cable"></span>
      <div class="crane-hook">
        <span class="hook-curve"></span>
        <span class="hook-latch"></span>
      </div>
      <div class="cargo-crate"></div>
    </div>
    <div class="site-ground"></div>
  </section>
  <footer class="crane-foot">
    <span class="crane-tag">WARN LOAD</span>
    <span class="crane-height">RAD 42</span>
  </footer>
</main>
</body>
</html>
