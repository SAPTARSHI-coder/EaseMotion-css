<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eggbeater Whisk Spin — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Eggbeater Whisk Spin demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Eggbeater Whisk Spin</h1>
      <p class="lede">Hand eggbeater gears spinning twin whisks</p>
    </header>

    <section class="ease-eggbeater-whisk-spin" data-demo="eggbeater-whisk-spin" aria-live="polite">
      <div class="ease-eggbeater-whisk-spin__housing">
        <div class="ease-eggbeater-whisk-spin__bezel">
          <div class="ease-eggbeater-whisk-spin__face">
            <div class="ease-eggbeater-whisk-spin__readout">
              <span class="ease-eggbeater-whisk-spin__label">Eggbeater Whisk Spin</span>
              <span class="ease-eggbeater-whisk-spin__value">LIVE</span>
            </div>
            <div class="ease-eggbeater-whisk-spin__motion" aria-hidden="true">
              <span class="ease-eggbeater-whisk-spin__a"></span>
              <span class="ease-eggbeater-whisk-spin__b"></span>
              <span class="ease-eggbeater-whisk-spin__c"></span>
              <span class="ease-eggbeater-whisk-spin__d"></span>
            </div>
            <div class="ease-eggbeater-whisk-spin__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-eggbeater-whisk-spin__controls">
          <button type="button" class="ease-eggbeater-whisk-spin__btn primary">Engage</button>
          <button type="button" class="ease-eggbeater-whisk-spin__btn">Reset</button>
          <label class="ease-eggbeater-whisk-spin__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-eggbeater-whisk-spin__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
