<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Note Sticky Rotate &mdash; EaseMotion CSS Demo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="page-head">
    <p class="kicker">EaseMotion CSS &middot; Productivity</p>
    <h1>Note Sticky Rotate</h1>
    <p class="sub">A messy wall of ideas that straightens up when you look at it.</p>
  </header>
  <main class="stage">
    <div class="ns-wall">
      <div class="ns-note ns-y">Ship the demo today</div>
      <div class="ns-note ns-g">Drink more water</div>
      <div class="ns-note ns-p">Learn one new trick</div>
      <div class="ns-note ns-b">Write it down first</div>
    </div>
  </main>
  <p class="stage-caption">Hover any note to flip it straight and lift it.</p>
  <footer class="page-foot">
    <span>Pure CSS &middot; zero dependencies</span>
    <span>Fluttering notes</span>
  </footer>
</body>
</html>
