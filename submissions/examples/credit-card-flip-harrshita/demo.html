<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Credit Card Flip | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="demo-header">
    <h1>Credit Card 3D Flip</h1>
    <p>Interactive 3D card flip animation for checkout experience.</p>
  </header>

  <main class="demo-main">
    <section class="demo-section">
      <div class="ease-card-container">
        <div class="ease-card-inner">
          <div class="ease-card-front">
            <div class="ease-card-chip"></div>
            <div class="ease-card-number">4532 &bull;&bull;&bull;&bull; &bull;&bull;&bull;&bull; 8892</div>
            <div class="ease-card-details">
              <span>HARRSHITA</span>
              <span>12/28</span>
            </div>
          </div>
          <div class="ease-card-back">
            <div class="ease-card-stripe"></div>
            <div class="ease-card-cvv">CVV 882</div>
          </div>
        </div>
      </div>
    </section>
  </main>
  <footer class="demo-footer"><p>EaseMotion CSS Project</p></footer>
</body>
</html>
