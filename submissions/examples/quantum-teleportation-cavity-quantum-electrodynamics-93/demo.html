<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cavity Quantum Electrodynamics - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css"></head><body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030712; color: #ffffff;">

    <div class="ease-card ease-card-glass cavity-container">
        <div class="cavity-header">
            <h2>Cavity QED</h2>
            <span class="ease-badge ease-badge-secondary">Coupling</span>
        </div>
        
        <div class="cavity-screen ease-center">
            <div class="cavity-flux flux-cavity-a"></div>
            <div class="cavity-flux flux-cavity-b"></div>
            <div class="cavity-boundary-ring"></div>
            <div class="cavity-core ease-center"></div>
        </div>

        <div class="cavity-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Jaynes-Cummings &amp; Strong Coupling</span>
            <button class="ease-btn ease-btn-secondary ease-btn-sm ease-hover-grow">Run Cavity QED</button>
        </div>
    </div></body></html>
