<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Responsive Material Design Hover Slider">
    <title>Material Hover Slider</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="page">
        <section class="slider-wrapper" aria-label="Material design hover slider">

            <div class="slider-header">
                <span>Volume</span>
                <span class="value">70%</span>
            </div>

            <div class="slider">
                <div class="slider-progress"></div>
                <div class="slider-thumb"></div>
            </div>

            <p class="hint">Hover over the slider</p>

        </section>
    </main>

</body>
</html>
