<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Floating Action Button — EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <p class="label">Hover over the floating action button at the bottom-right corner</p>

  <!-- FAB Container -->
  <div class="ease-fab-container">
    <button class="ease-fab-trigger" aria-label="Toggle menu">+</button>

    <ul class="ease-fab-menu">
      <li>
        <a href="#" class="ease-fab-action" title="Share">🔗</a>
      </li>
      <li>
        <a href="#" class="ease-fab-action" title="Bookmark">⭐</a>
      </li>
      <li>
        <a href="#" class="ease-fab-action" title="Edit">✏️</a>
      </li>
    </ul>
  </div>

</body>
</html>
