<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ease Anchor Tooltips</title>
    <link rel="stylesheet" href="../../../easemotion.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="ease-tooltip-container">
        
        <h2>Scroll to see Dynamic Anchor Flipping</h2>
        <p>This button uses native CSS Anchor Positioning to tether the tooltip.</p>

        <!-- The Anchor Element -->
        <button class="ease-anchor-btn" id="my-anchor-btn">Hover Me</button>
        
        <!-- The Tooltip Element -->
        <div class="ease-tooltip-popover">
            I flip automatically if I hit the edge!
        </div>

    </div>

    <!-- Extra space to allow scrolling and testing the collision logic -->
    <div style="height: 150vh;"></div>

</body>
</html>
