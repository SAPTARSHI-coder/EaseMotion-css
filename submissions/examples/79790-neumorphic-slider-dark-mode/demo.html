<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
        name="description"
        content="Responsive neumorphic slider with dark mode styling"
    >
    <title>Neumorphic Slider - Dark Mode</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="page">
        <section class="slider-card" aria-labelledby="slider-title">

            <div class="card-header">
                <div>
                    <span class="eyebrow">CSS COMPONENT</span>
                    <h1 id="slider-title">Neumorphic Slider</h1>
                    <p>
                        A responsive range slider with a soft neumorphic
                        interface and dark mode support.
                    </p>
                </div>

                <label class="theme-switch" aria-label="Toggle dark mode">
                    <input type="checkbox" id="themeToggle">
                    <span class="switch-track">
                        <span class="switch-thumb"></span>
                    </span>
                </label>
            </div>

            <div class="slider-section">
                <div class="slider-label">
                    <span>Volume</span>
                    <output id="sliderValue" for="volume">65%</output>
                </div>

                <div class="slider-wrapper">
                    <input
                        type="range"
                        id="volume"
                        class="neumorphic-slider"
                        min="0"
                        max="100"
                        value="65"
                        step="1"
                        aria-label="Volume"
                    >
                </div>

                <div class="range-labels">
                    <span>0</span>
                    <span>25</span>
                    <span>50</span>
                    <span>75</span>
                    <span>100</span>
                </div>
            </div>

            <div class="stats">
                <div class="stat">
                    <span class="stat-label">Current</span>
                    <strong id="currentValue">65%</strong>
                </div>

                <div class="divider"></div>

                <div class="stat">
                    <span class="stat-label">Minimum</span>
                    <strong>0%</strong>
                </div>

                <div class="divider"></div>

                <div class="stat">
                    <span class="stat-label">Maximum</span>
                    <strong>100%</strong>
                </div>
            </div>

            <div class="hint">
                <span class="hint-icon">☼</span>
                <span>Drag the slider to adjust the value</span>
            </div>

        </section>
    </main>

    <script>
        const slider = document.getElementById("volume");
        const sliderValue = document.getElementById("sliderValue");
        const currentValue = document.getElementById("currentValue");
        const themeToggle = document.getElementById("themeToggle");

        function updateSlider() {
            const value = slider.value;

            sliderValue.textContent = `${value}%`;
            currentValue.textContent = `${value}%`;

            slider.style.setProperty(
                "--slider-progress",
                `${value}%`
            );
        }

        slider.addEventListener("input", updateSlider);

        themeToggle.addEventListener("change", () => {
            document.body.classList.toggle(
                "dark-mode",
                themeToggle.checked
            );
        });

        updateSlider();
    </script>
</body>
</html>
