<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Pure CSS animated ripple water effect."
  >
  <title>CSS Ripple Water Effect</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">
    <section class="demo" aria-labelledby="title">
      <span class="eyebrow">Pure CSS Animation</span>

      <h1 id="title">Ripple Water</h1>

      <p class="description">
        A calm water surface created with layered CSS radial gradients.
      </p>

      <div
        class="water"
        role="img"
        aria-label="Animated water surface with expanding ripples"
      >
        <div class="ripple ripple-one"></div>
        <div class="ripple ripple-two"></div>
        <div class="ripple ripple-three"></div>

        <div class="drop" aria-hidden="true"></div>

        <div class="water-highlight" aria-hidden="true"></div>
      </div>

      <p class="hint">Pure CSS · No JavaScript</p>
    </section>
  </main>

</body>
</html>
