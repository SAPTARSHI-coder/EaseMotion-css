<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Sci-Fi HUD: Morphing Shape</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <div class="hud-wrapper" role="region" aria-label="AI Core Monitor">
    
    <!-- Crosshairs -->
    <div class="reticle-crosshair" aria-hidden="true"></div>

    <!-- Orbital Rings -->
    <div class="orbital-ring ring-3" aria-hidden="true"></div>
    <div class="orbital-ring ring-2" aria-hidden="true"></div>
    <div class="orbital-ring ring-1" aria-hidden="true"></div>
    
    <!-- Central Morphing AI Core -->
    <div class="morphing-core"></div>

    <!-- HUD Data Labels -->
    <div class="hud-label label-top">
      Core Temp <span class="label-value">84°C</span>
    </div>
    
    <div class="hud-label label-bottom" aria-live="polite">
      Status <span class="label-value">STABLE</span>
    </div>

  </div>

</body>
</html>
