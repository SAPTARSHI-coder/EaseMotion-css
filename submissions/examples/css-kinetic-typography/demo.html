<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Kinetic Typography - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="em-kinetic-page" role="region" aria-label="Kinetic Typography Animation Showcase">
        <div class="em-kinetic-card" tabindex="0">
            <span class="em-kinetic-badge">DYNAMIC MOTION</span>
            <div class="em-kinetic-container" aria-label="Kinetic text: Motion transforms rhythmically">
                <span class="em-word" style="--delay: 0s;">MOTION</span>
                <span class="em-word" style="--delay: 0.2s;">TRANSFORMS</span>
                <span class="em-word" style="--delay: 0.4s;">RHYTHMICALLY</span>
            </div>
            <p class="em-kinetic-subtitle">Pure CSS kinetic text animation showcasing rhythmic scale and translation.</p>
        </div>
    </div>
</body>
</html>
