<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Accessible FAQ Grid</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<section class="faq-grid">

<div class="faq">
<button class="question">
What is EaseMotion CSS?
<span>+</span>
</button>

<div class="answer">
<p>EaseMotion CSS provides modern reusable UI components with animations.</p>
</div>
</div>

<div class="faq">
<button class="question">
Is it accessible?
<span>+</span>
</button>

<div class="answer">
<p>Yes. High contrast colors and keyboard-friendly controls improve usability.</p>
</div>
</div>

<div class="faq">
<button class="question">
Can I customize components?
<span>+</span>
</button>

<div class="answer">
<p>Every variable including colors, fonts and spacing can be customized.</p>
</div>
</div>

<div class="faq">
<button class="question">
Does it support mobile?
<span>+</span>
</button>

<div class="answer">
<p>The layout automatically adapts for tablets and smartphones.</p>
</div>
</div>

</section>

<script src="script.js"></script>

</body>
</html>
