<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Rich Text Toolbar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="editor-wrapper">
    <section class="editor" aria-label="Rich text editor">

      <div class="toolbar" role="toolbar" aria-label="Formatting options">
        <button type="button" aria-label="Bold" title="Bold">
          <strong>B</strong>
        </button>

        <button type="button" aria-label="Italic" title="Italic">
          <em>I</em>
        </button>

        <button type="button" aria-label="Underline" title="Underline">
          <u>U</u>
        </button>

        <button type="button" aria-label="Insert link" title="Insert link">
          🔗
        </button>
      </div>

      <div
        class="text-area"
        contenteditable="true"
        role="textbox"
        aria-multiline="true"
        aria-label="Write your content here"
      >
        Start writing your content here...
      </div>

    </section>
  </main>

</body>
</html>
