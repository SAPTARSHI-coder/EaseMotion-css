<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day/Night Theme Toggle</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <input type="checkbox" id="theme-toggle" class="theme-checkbox" hidden>
    
    <div class="page-wrapper">
        <div class="content">
            <h1>Theme Toggle</h1>
            <p>Pure CSS Day &amp; Night Switch</p>
            
            <label for="theme-toggle" class="toggle-container" aria-label="Toggle theme">
                <div class="toggle-track">
                    <div class="stars">
                        <div class="star"></div>
                        <div class="star"></div>
                        <div class="star"></div>
                    </div>
                    <div class="clouds">
                        <div class="cloud"></div>
                        <div class="cloud"></div>
                    </div>
                    <div class="sun-moon-thumb">
                        <div class="craters"></div>
                    </div>
                </div>
            </label>
        </div>
    </div>
</body>
</html>
