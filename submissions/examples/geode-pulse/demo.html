<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Geode Pulse</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="page">

    <section class="geode-card">

      <header class="geode-header">
        <div>
          <p class="eyebrow">MINERAL FORMATION</p>
          <h1>Geode Pulse</h1>
          <p class="subtitle">
            Open the stone and reveal the crystal hidden inside.
          </p>
        </div>

        <div class="growth-readout">
          <span>GROWTH</span>
          <strong id="growthValue">0%</strong>
        </div>
      </header>

      <div class="geode-display" id="geodeDisplay">

        <canvas id="geodeCanvas"></canvas>

        <div class="geode-center">
          <div class="core-glow"></div>

          <div class="crystal-cluster" id="crystalCluster">
            <span class="crystal c1"></span>
            <span class="crystal c2"></span>
            <span class="crystal c3"></span>
            <span class="crystal c4"></span>
            <span class="crystal c5"></span>
            <span class="crystal c6"></span>
            <span class="crystal c7"></span>
            <span class="crystal c8"></span>
            <span class="crystal c9"></span>
          </div>
        </div>

        <div class="geode-shell">
          <div class="shell-left"></div>
          <div class="shell-right"></div>
        </div>

        <div class="cracks">
          <span class="crack crack-1"></span>
          <span class="crack crack-2"></span>
          <span class="crack crack-3"></span>
          <span class="crack crack-4"></span>
          <span class="crack crack-5"></span>
          <span class="crack crack-6"></span>
          <span class="crack crack-7"></span>
          <span class="crack crack-8"></span>
          <span class="crack crack-9"></span>
        </div>

        <div class="geode-status">
          <span class="status-dot"></span>
          <span id="statusText">Dormant</span>
        </div>

      </div>

      <div class="geode-info">
        <div>
          <span class="info-label">MINERAL</span>
          <strong id="sceneName">Amethyst</strong>
        </div>

        <div>
          <span class="info-label">ENERGY</span>
          <strong id="energyValue">0%</strong>
        </div>

        <div>
          <span class="info-label">CRYSTALS</span>
          <strong>9</strong>
        </div>
      </div>

      <div class="controls">

        <div class="control-group">

          <div class="control-heading">
            <label for="growthSlider">Crystal Growth</label>
            <span id="sliderValue">0%</span>
          </div>

          <input
            type="range"
            id="growthSlider"
            class="growth-slider"
            min="0"
            max="100"
            value="0"
          >

        </div>

        <div class="control-group">

          <div class="control-heading">
            <span>Mineral Scene</span>
          </div>

          <div class="scene-options">

            <button
              class="scene-btn active"
              data-scene="amethyst"
              title="Amethyst"
            >
              💜
            </button>

            <button
              class="scene-btn"
              data-scene="emerald"
              title="Emerald"
            >
              💚
            </button>

            <button
              class="scene-btn"
              data-scene="sapphire"
              title="Sapphire"
            >
              💙
            </button>

            <button
              class="scene-btn"
              data-scene="citrine"
              title="Citrine"
            >
              💛
            </button>

          </div>

        </div>

      </div>

      <div class="actions">

        <button class="action-btn primary" id="openBtn">
          ✦ Open Geode
        </button>

        <button class="action-btn secondary" id="resetBtn">
          ↻ Reset
        </button>

      </div>

      <footer class="hint">
        Click the geode to increase growth · Space to open · R to reset
      </footer>

    </section>

  </main>

  <script>

    const canvas = document.getElementById("geodeCanvas");
    const ctx = canvas.getContext("2d");

    const display = document.getElementById("geodeDisplay");
    const slider = document.getElementById("growthSlider");

    const growthValue = document.getElementById("growthValue");
    const sliderValue = document.getElementById("sliderValue");
    const energyValue = document.getElementById("energyValue");

    const statusText = document.getElementById("statusText");
    const sceneName = document.getElementById("sceneName");

    const openBtn = document.getElementById("openBtn");
    const resetBtn = document.getElementById("resetBtn");

    const crystalCluster =
      document.getElementById("crystalCluster");

    const shells = document.querySelectorAll(
      ".shell-left, .shell-right"
    );

    const cracks = document.querySelectorAll(".crack");

    const scenes = {

      amethyst: {
        name: "Amethyst",
        primary: "#b48cff",
        secondary: "#6f4fc4",
        glow: "#d8c2ff",
        particle: "#c9aaff"
      },

      emerald: {
        name: "Emerald",
        primary: "#64e6a4",
        secondary: "#258d64",
        glow: "#9affca",
        particle: "#74f0ad"
      },

      sapphire: {
        name: "Sapphire",
        primary: "#6cbcff",
        secondary: "#3267c7",
        glow: "#a9ddff",
        particle: "#7fcaff"
      },

      citrine: {
        name: "Citrine",
        primary: "#ffd66b",
        secondary: "#c78b25",
        glow: "#ffe9a6",
        particle: "#ffd875"
      }

    };

    let currentScene = "amethyst";
    let targetGrowth = 0;
    let currentGrowth = 0;
    let particles = [];
    let time = 0;

    function resizeCanvas() {

      const rect = display.getBoundingClientRect();

      const dpr = Math.min(window.devicePixelRatio || 1, 2);

      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;

      canvas.style.width = rect.width + "px";
      canvas.style.height = rect.height + "px";

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    }

    function createParticles() {

      particles = [];

      for (let i = 0; i < 35; i++) {

        particles.push({
          x: Math.random(),
          y: Math.random(),
          size: 1 + Math.random() * 2,
          speed: 0.0005 + Math.random() * 0.001,
          phase: Math.random() * Math.PI * 2,
          drift: 0.01 + Math.random() * 0.02,
          opacity: 0.2 + Math.random() * 0.6
        });

      }

    }

    function drawParticles() {

      const rect = display.getBoundingClientRect();
      const scene = scenes[currentScene];

      ctx.save();

      particles.forEach((particle) => {

        particle.y -= particle.speed;

        if (particle.y < -0.05) {
          particle.y = 1.05;
        }

        const wobble =
          Math.sin(time * 0.01 + particle.phase) *
          particle.drift;

        const x =
          particle.x * rect.width +
          wobble * rect.width;

        const y =
          particle.y * rect.height;

        const visibility =
          0.15 + currentGrowth / 100 * 0.85;

        ctx.globalAlpha =
          particle.opacity * visibility;

        ctx.fillStyle = scene.particle;

        ctx.beginPath();

        ctx.arc(
          x,
          y,
          particle.size,
          0,
          Math.PI * 2
        );

        ctx.fill();

      });

      ctx.restore();

    }

    function updateStatus() {

      let status = "Dormant";

      if (currentGrowth >= 85) {
        status = "Fully Open";
      } else if (currentGrowth >= 60) {
        status = "Revealing";
      } else if (currentGrowth >= 30) {
        status = "Cracking";
      } else if (currentGrowth > 0) {
        status = "Awakening";
      }

      statusText.textContent = status;

    }

    function updateGrowth() {

      currentGrowth +=
        (targetGrowth - currentGrowth) * 0.05;

      const rounded =
        Math.round(currentGrowth);

      growthValue.textContent =
        `${rounded}%`;

      sliderValue.textContent =
        `${Math.round(targetGrowth)}%`;

      energyValue.textContent =
        `${Math.round(currentGrowth)}%`;

      updateStatus();

      const normalized =
        currentGrowth / 100;

      shells.forEach((shell, index) => {

        const direction =
          index === 0 ? -1 : 1;

        shell.style.transform =
          `translateX(${direction * normalized * 42}px)
           rotate(${direction * normalized * 5}deg)`;

      });

      cracks.forEach((crack, index) => {

        const threshold =
          index / cracks.length * 70;

        const opacity =
          Math.max(
            0,
            Math.min(
              1,
              (currentGrowth - threshold) / 30
            )
          );

        crack.style.opacity = opacity;

      });

      crystalCluster.style.setProperty(
        "--growth",
        normalized
      );

    }

    function setScene(scene) {

      if (!scenes[scene]) {
        return;
      }

      currentScene = scene;

      const config = scenes[scene];

      document.documentElement.style.setProperty(
        "--primary",
        config.primary
      );

      document.documentElement.style.setProperty(
        "--secondary",
        config.secondary
      );

      document.documentElement.style.setProperty(
        "--glow",
        config.glow
      );

      document.documentElement.style.setProperty(
        "--particle",
        config.particle
      );

      sceneName.textContent = config.name;

      document.querySelectorAll(".scene-btn")
        .forEach(button => {

          button.classList.toggle(
            "active",
            button.dataset.scene === scene
          );

        });

    }

    function openGeode() {

      targetGrowth = 100;
      slider.value = 100;

      burstParticles();

    }

    function resetGeode() {

      targetGrowth = 0;
      slider.value = 0;

    }

    function burstParticles() {

      for (let i = 0; i < 12; i++) {

        particles.push({
          x: 0.5 + (Math.random() - 0.5) * 0.25,
          y: 0.5 + (Math.random() - 0.5) * 0.25,
          size: 1 + Math.random() * 2,
          speed: 0.001 + Math.random() * 0.002,
          phase: Math.random() * Math.PI * 2,
          drift: 0.02 + Math.random() * 0.04,
          opacity: 0.7
        });

      }

    }

    slider.addEventListener("input", () => {

      targetGrowth =
        Number(slider.value);

    });

    display.addEventListener("click", (event) => {

      if (
        event.target.closest(".scene-btn") ||
        event.target.closest(".action-btn")
      ) {
        return;
      }

      targetGrowth =
        Math.min(
          100,
          targetGrowth + 10
        );

      slider.value =
        targetGrowth;

    });

    openBtn.addEventListener(
      "click",
      openGeode
    );

    resetBtn.addEventListener(
      "click",
      resetGeode
    );

    document.querySelectorAll(".scene-btn")
      .forEach(button => {

        button.addEventListener("click", () => {

          setScene(
            button.dataset.scene
          );

        });

      });

    document.addEventListener("keydown", event => {

      if (
        event.code === "Space" &&
        event.target.tagName !== "INPUT"
      ) {

        event.preventDefault();

        openGeode();

      }

      if (
        event.key.toLowerCase() === "r" &&
        event.target.tagName !== "INPUT"
      ) {

        resetGeode();

      }

    });

    function animate() {

      time++;

      const rect =
        display.getBoundingClientRect();

      ctx.clearRect(
        0,
        0,
        rect.width,
        rect.height
      );

      drawParticles();

      updateGrowth();

      requestAnimationFrame(
        animate
      );

    }

    window.addEventListener(
      "resize",
      resizeCanvas
    );

    resizeCanvas();
    createParticles();
    setScene("amethyst");
    animate();

  </script>

</body>
</html>
