<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rim Latch Click — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Rim Latch Click demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Rim Latch Click</h1>
      <p class="lede">Rim latch clicking against the strike</p>
    </header>

    <section class="ease-rim-latch-click" data-demo="rim-latch-click" aria-live="polite">
      <div class="ease-rim-latch-click__housing">
        <div class="ease-rim-latch-click__bezel">
          <div class="ease-rim-latch-click__face">
            <div class="ease-rim-latch-click__readout">
              <span class="ease-rim-latch-click__label">Rim Latch Click</span>
              <span class="ease-rim-latch-click__value">LIVE</span>
            </div>
            <div class="ease-rim-latch-click__motion" aria-hidden="true">
              <span class="ease-rim-latch-click__a"></span>
              <span class="ease-rim-latch-click__b"></span>
              <span class="ease-rim-latch-click__c"></span>
              <span class="ease-rim-latch-click__d"></span>
            </div>
            <div class="ease-rim-latch-click__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-rim-latch-click__controls">
          <button type="button" class="ease-rim-latch-click__btn primary">Latch</button>
          <button type="button" class="ease-rim-latch-click__btn">Hold</button>
          <label class="ease-rim-latch-click__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-rim-latch-click__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
