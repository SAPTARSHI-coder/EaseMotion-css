<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Glowing Slider with Neon styling"
    >

    <title>Glowing Slider - Neon</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="page">

        <section class="slider-card">

            <span class="badge">EaseMotion CSS</span>

            <h1>Glowing Slider</h1>

            <p class="subtitle">
                A responsive neon-inspired range slider with a glowing
                interactive track.
            </p>

            <div class="slider-wrapper">

                <div class="slider-header">
                    <span>Brightness</span>
                    <output id="slider-value">72%</output>
                </div>

                <div class="slider-container">

                    <input
                        class="neon-slider"
                        id="neon-slider"
                        type="range"
                        min="0"
                        max="100"
                        value="72"
                        aria-label="Brightness"
                    >

                </div>

                <div class="slider-scale">
                    <span>0</span>
                    <span>25</span>
                    <span>50</span>
                    <span>75</span>
                    <span>100</span>
                </div>

            </div>

            <div class="status">
                <span class="status-dot"></span>
                <span>System active</span>
            </div>

        </section>

    </main>

    <script>
        const slider = document.getElementById("neon-slider");
        const output = document.getElementById("slider-value");

        function updateSlider() {
            const value = slider.value;

            output.textContent = `${value}%`;

            const percentage =
                ((value - slider.min) /
                (slider.max - slider.min)) * 100;

            slider.style.setProperty(
                "--progress",
                `${percentage}%`
            );
        }

        slider.addEventListener("input", updateSlider);

        updateSlider();
    </script>

</body>
</html>
