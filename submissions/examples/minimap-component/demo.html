<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Minimap Component</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <main class="container">

    <h1>Game Minimap</h1>

    <section class="minimap" aria-label="Game minimap">

      <div class="area explored"></div>

      <div class="area hidden"></div>

      <div class="player-dot" aria-label="Player position"></div>

      <div class="marker marker-one"></div>
      <div class="marker marker-two"></div>

    </section>

  </main>

</body>
</html>
