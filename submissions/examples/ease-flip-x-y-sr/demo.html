<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Flip / Perspective Utilities</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="wrap">
    <h1>3D Flip Utilities</h1>
    <p class="lead">Demo for perspective flip effects and hover-only variants.</p>

    <section class="grid">
      <article class="tile flip-x-card" aria-label="Flip X card">
        <h2>flip-x</h2>
        <p>Always animates rotateX from 90° to 0°.</p>
      </article>

      <article class="tile flip-y-card" aria-label="Flip Y card">
        <h2>flip-y</h2>
        <p>Always animates rotateY from 90° to 0°.</p>
      </article>

      <article class="tile flip-trigger" tabindex="0" aria-label="Hover trigger card">
        <h2>hover-flip cards</h2>
        <p>Hover or focus to flip around both axes.</p>
        <span class="hover-flip-x"></span>
        <span class="hover-flip-y"></span>
      </article>
    </section>
  </main>
</body>
</html>
