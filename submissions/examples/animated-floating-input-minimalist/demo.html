<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Floating Input Field - EaseMotion CSS</title>
    <!-- EaseMotion CSS Core Variables & Framework CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@latest/variables.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="demo-container ease-fade-in">
        <div class="demo-card">
            <header class="demo-header">
                <h2>Sign In / Register</h2>
                <p>Minimalist floating input field with smooth transitions powered by EaseMotion tokens.</p>
            </header>

            <form class="demo-form" onsubmit="event.preventDefault();">
                <!-- Floating Input Group 1 -->
                <div class="ease-floating-group">
                    <input type="email" id="email" class="ease-floating-input" placeholder=" " required autocomplete="email">
                    <label for="email" class="ease-floating-label">Email Address</label>
                    <span class="ease-focus-line"></span>
                </div>

                <!-- Floating Input Group 2 -->
                <div class="ease-floating-group">
                    <input type="password" id="password" class="ease-floating-input" placeholder=" " required autocomplete="current-password">
                    <label for="password" class="ease-floating-label">Password</label>
                    <span class="ease-focus-line"></span>
                </div>

                <button type="submit" class="ease-submit-btn">Continue</button>
            </form>
        </div>
    </main>
</body>
</html>
