<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CSS Orbiting Icon Navigation">
  <title>CSS Orbiting Icon Nav</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="demo">
    <header class="demo__header">
      <p class="demo__eyebrow">EaseMotion CSS</p>
      <h1>Orbiting Icon Navigation</h1>
      <p>
        A lightweight navigation menu where action icons orbit around
        a central hub using pure CSS.
      </p>
    </header>

    <nav class="orbit-nav" aria-label="Primary navigation">

      <div class="orbit-nav__ring">

        <a href="#home"
           class="orbit-nav__item orbit-nav__item--1"
           aria-label="Home">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 10.5 12 3l9 7.5"></path>
            <path d="M5 9.5V21h14V9.5"></path>
            <path d="M9 21v-7h6v7"></path>
          </svg>
        </a>

        <a href="#analytics"
           class="orbit-nav__item orbit-nav__item--2"
           aria-label="Analytics">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 19V5"></path>
            <path d="M4 19h16"></path>
            <path d="m7 15 4-4 3 2 5-6"></path>
          </svg>
        </a>

        <a href="#messages"
           class="orbit-nav__item orbit-nav__item--3"
           aria-label="Messages">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 11.5a7.5 7.5 0 0 1-7.5 7.5H7l-4 2v-5.5A7.5 7.5 0 1 1 20 11.5Z"></path>
            <path d="M8 11h.01"></path>
            <path d="M12 11h.01"></path>
            <path d="M16 11h.01"></path>
          </svg>
        </a>

        <a href="#settings"
           class="orbit-nav__item orbit-nav__item--4"
           aria-label="Settings">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-1.4 1.4-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1.03 1.56V20h-2v-.09a1.7 1.7 0 0 0-1.03-1.56 1.7 1.7 0 0 0-1.88.34l-.06.06-1.4-1.4.06-.06A1.7 1.7 0 0 0 9.46 15a1.7 1.7 0 0 0-1.56-1.03H7v-2h.9A1.7 1.7 0 0 0 9.46 11a1.7 1.7 0 0 0-.34-1.88l-.06-.06 1.4-1.4.06.06a1.7 1.7 0 0 0 1.88.34A1.7 1.7 0 0 0 13.43 6.5V6h2v.5a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.88-.34l.06-.06 1.4 1.4-.06.06A1.7 1.7 0 0 0 19.4 11a1.7 1.7 0 0 0 1.56 1.03H21v2h-.04A1.7 1.7 0 0 0 19.4 15Z"></path>
          </svg>
        </a>

        <a href="#profile"
           class="orbit-nav__item orbit-nav__item--5"
           aria-label="Profile">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="8" r="3.5"></circle>
            <path d="M5 21a7 7 0 0 1 14 0"></path>
          </svg>
        </a>

        <div class="orbit-nav__hub" aria-hidden="true">
          <span class="orbit-nav__hub-icon">✦</span>
          <span class="orbit-nav__hub-label">Menu</span>
        </div>

      </div>

    </nav>

    <p class="demo__hint">
      Hover over the navigation or use Tab to explore the actions.
    </p>
  </main>

</body>
</html>
