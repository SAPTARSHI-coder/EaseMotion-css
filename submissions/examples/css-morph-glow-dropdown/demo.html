<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Morph-Glow Dropdown — Gaming Hub</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="ease-container">
    <p class="ease-eyebrow">Loadout Profile</p>
    <h1 class="ease-heading">Weapon Preset</h1>
    <p class="ease-subtitle">Open the menu to morph the container border and trigger an ambient neon glow.</p>

    <div class="ease-dropdown">
      <input type="checkbox" id="ease-morph-dropdown-toggle" class="ease-dropdown-input" />
      <label for="ease-morph-dropdown-toggle" class="ease-dropdown-trigger">
        <span class="ease-dropdown-label">Cyber Assault (Slot 1)</span>
        <span class="ease-dropdown-arrow">▾</span>
      </label>
      <div class="ease-dropdown-menu">
        <button class="ease-dropdown-item">
          <span>Cyber Assault (Slot 1)</span>
          <span class="ease-preset-tag">Primary</span>
        </button>
        <button class="ease-dropdown-item">
          <span>Stealth Operative (Slot 2)</span>
          <span class="ease-preset-tag">Tactical</span>
        </button>
        <button class="ease-dropdown-item">
          <span>Heavy Vanguard (Slot 3)</span>
          <span class="ease-preset-tag">Defense</span>
        </button>
      </div>
    </div>
  </main>
</body>
</html>
