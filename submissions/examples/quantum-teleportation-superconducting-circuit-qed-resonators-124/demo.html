<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Superconducting Circuit QED Resonators - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css"></head><body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030712; color: #ffffff;">

    <div class="ease-card ease-card-glass cqed-container">
        <div class="cqed-header">
            <h2>Circuit QED Resonators</h2>
            <span class="ease-badge ease-badge-primary">Superconducting QED</span>
        </div>
        
        <div class="cqed-screen ease-center">
            <div class="cqed-flux flux-cqed-a"></div>
            <div class="cqed-flux flux-cqed-b"></div>
            <div class="cqed-boundary-ring"></div>
            <div class="cqed-core ease-center"></div>
        </div>

        <div class="cqed-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Coplanar Waveguides &amp; Dispersive Readout</span>
            <button class="ease-btn ease-btn-primary ease-btn-sm ease-hover-grow">Run cQED Resonator</button>
        </div>
    </div></body></html>
