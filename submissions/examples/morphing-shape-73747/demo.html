<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Neumorphic Morphing Shape - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <main class="demo-wrapper">
    <header class="demo-header">
      <span class="demo-badge">Neumorphism Effect</span>
      <h1>Morphing Shape</h1>
      <p>Interactive Neumorphic UI featuring pure CSS fluid border-radius morphing, dynamic haptic shadow adaptation, and shape state triggers.</p>
    </header>

    <section class="neumorphic-card" aria-label="Morphing Shape Showcase">
      <!-- Pure CSS State Radio Controls -->
      <input type="radio" name="shape-mode" id="shape-blob" class="shape-radio" checked>
      <input type="radio" name="shape-mode" id="shape-circle" class="shape-radio">
      <input type="radio" name="shape-mode" id="shape-squircle" class="shape-radio">
      <input type="radio" name="shape-mode" id="shape-pillow" class="shape-radio">

      <!-- Morphing Neumorphic Vessel Stage -->
      <div class="morph-stage">
        <div class="morphing-vessel">
          <div class="vessel-inner">
            <svg class="morph-icon icon-blob" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"/>
            </svg>
            <svg class="morph-icon icon-circle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="9"/>
            </svg>
            <svg class="morph-icon icon-squircle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="18" height="18" rx="7"/>
            </svg>
            <svg class="morph-icon icon-pillow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 3L2 12l10 9 10-9-10-9z"/>
            </svg>
            
            <div class="morph-readout">
              <span class="shape-name name-blob">ORGANIC BLOB</span>
              <span class="shape-name name-circle">PERFECT CIRCLE</span>
              <span class="shape-name name-squircle">SMOOTH SQUIRCLE</span>
              <span class="shape-name name-pillow">PILLOW DIAMOND</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Controls Panel -->
      <div class="controls-panel" aria-label="Select Morph Shape">
        <span class="controls-title">Select Shape State</span>
        <div class="btn-group">
          <label for="shape-blob" class="neumorphic-btn btn-blob" tabindex="0" title="Organic Morphing Blob">Organic</label>
          <label for="shape-circle" class="neumorphic-btn btn-circle" tabindex="0" title="Perfect Circle">Circle</label>
          <label for="shape-squircle" class="neumorphic-btn btn-squircle" tabindex="0" title="Smooth Squircle">Squircle</label>
          <label for="shape-pillow" class="neumorphic-btn btn-pillow" tabindex="0" title="Pillow Diamond">Pillow</label>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
