<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compass Declination — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Compass Declination demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Compass Declination</h1>
      <p class="lede">Magnetic needle settling with a declination offset mark</p>
    </header>

    <section class="ease-compass-declination" data-demo="compass-declination" aria-live="polite">
      <div class="ease-compass-declination__housing">
        <div class="ease-compass-declination__bezel">
          <div class="ease-compass-declination__face">
            <div class="ease-compass-declination__readout">
              <span class="ease-compass-declination__label">Compass Declination</span>
              <span class="ease-compass-declination__value">LIVE</span>
            </div>
            <div class="ease-compass-declination__motion" aria-hidden="true">
              <span class="ease-compass-declination__a"></span>
              <span class="ease-compass-declination__b"></span>
              <span class="ease-compass-declination__c"></span>
              <span class="ease-compass-declination__d"></span>
            </div>
            <div class="ease-compass-declination__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-compass-declination__controls">
          <button type="button" class="ease-compass-declination__btn primary">Engage</button>
          <button type="button" class="ease-compass-declination__btn">Reset</button>
          <label class="ease-compass-declination__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-compass-declination__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
