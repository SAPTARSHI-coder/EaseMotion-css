<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Spotlight Hover Effect</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section class="spotlight-section">

    <div class="spotlight-card">
      <div class="spotlight-card-inner">
        <div class="spotlight-card-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
            <circle cx="12" cy="12" r="5"/>
            <line x1="12" y1="1" x2="12" y2="3"/>
            <line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1" y1="12" x2="3" y2="12"/>
            <line x1="21" y1="12" x2="23" y2="12"/>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
        </div>
        <h3 class="spotlight-card-title">Spotlight Card</h3>
        <p class="spotlight-card-desc">Move your cursor over this card to see the spotlight effect follow your pointer.</p>
      </div>
    </div>

    <div class="spotlight-card glow">
      <div class="spotlight-card-inner">
        <div class="spotlight-card-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
          </svg>
        </div>
        <h3 class="spotlight-card-title">Glow Border</h3>
        <p class="spotlight-card-desc">Spotlight combined with gradient glow border on hover for a premium feel.</p>
      </div>
    </div>

    <div class="spotlight-card scale theme-secondary">
      <div class="spotlight-card-inner">
        <div class="spotlight-card-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
            <line x1="3" y1="9" x2="21" y2="9"/>
            <line x1="9" y1="21" x2="9" y2="9"/>
          </svg>
        </div>
        <h3 class="spotlight-card-title">Scale Variant</h3>
        <p class="spotlight-card-desc">Spotlight effect paired with subtle scale-up on hover for interactive feedback.</p>
      </div>
    </div>

  </section>

  <script>
    // JavaScript to track mouse position for CSS custom properties
    document.querySelectorAll('.spotlight-card').forEach(card => {
      card.addEventListener('mousemove', e => {
        const rect = card.getBoundingClientRect();
        const x = ((e.clientX - rect.left) / rect.width) * 100;
        const y = ((e.clientY - rect.top) / rect.height) * 100;
        card.style.setProperty('--spot-x', x + '%');
        card.style.setProperty('--spot-y', y + '%');
      });
    });
  </script>
</body>
</html>
