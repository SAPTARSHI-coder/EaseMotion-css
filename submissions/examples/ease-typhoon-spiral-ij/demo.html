<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Typhoon Spiral Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="storm" aria-label="typhoon spiral">
    <div class="spiral" id="spiral" aria-hidden="true">
      <span class="arm a1"></span>
      <span class="arm a2"></span>
      <span class="arm a3"></span>
      <span class="arm a4"></span>
      <span class="arm a5"></span>
      <span class="arm a6"></span>
      <span class="eye"></span>
    </div>
    <button class="storm-btn" id="stormBtn" type="button">Spin Up</button>
    <p class="caption">Band clouds wrap around a calm center.</p>
  </main>
  <script>
    const spiral = document.getElementById("spiral");
    const btn = document.getElementById("stormBtn");
    btn.addEventListener("click", () => {
      spiral.classList.toggle("spinning");
      btn.textContent = spiral.classList.contains("spinning") ? "Calm" : "Spin Up";
    });
  </script>
</body>
</html>
