<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Fade-In Hero Section - Minimalist Tech</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="layout-container">
        
        <!-- Controls to re-trigger animation for demo purposes -->
        <div class="controls-wrapper">
            <input type="checkbox" id="trigger-anim" class="trigger-checkbox" checked>
            <label for="trigger-anim" class="btn-trigger">Reload Hero Section</label>
        </div>

        <!-- The Hero Section -->
        <section class="hero-section">
            
            <div class="hero-content">
                <div class="badge fade-in delay-1">API Reference v3</div>
                
                <h1 class="hero-title fade-in delay-2">
                    Connect. <span class="highlight">Automate.</span><br>Scale.
                </h1>
                
                <p class="hero-subtitle fade-in delay-3">
                    A highly available, geographically distributed REST API for modern data synchronization. Built for speed and reliability.
                </p>
                
                <div class="hero-actions fade-in delay-4">
                    <button class="btn btn-primary">Read the Docs</button>
                    <button class="btn btn-secondary">System Status</button>
                </div>
            </div>

            <!-- Abstract minimal tech visual representation -->
            <div class="hero-visual fade-in delay-5">
                <div class="data-flow-diagram">
                    <!-- Top Block -->
                    <div class="data-block top-block">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
                        </svg>
                    </div>
                    
                    <!-- Middle connection -->
                    <div class="data-connection">
                        <div class="pulse-line"></div>
                    </div>
                    
                    <!-- Bottom Blocks -->
                    <div class="bottom-blocks">
                        <div class="data-block sub-block">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="2" y="2" width="20" height="8" rx="2" ry="2"></rect>
                                <rect x="2" y="14" width="20" height="8" rx="2" ry="2"></rect>
                            </svg>
                        </div>
                        <div class="data-block sub-block">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <ellipse cx="12" cy="5" rx="9" ry="3"></ellipse>
                                <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path>
                                <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path>
                            </svg>
                        </div>
                    </div>
                </div>
            </div>

        </section>

    </div>

</body>
</html>
