<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Periscope Prism Relay — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Periscope Prism Relay demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Periscope Prism Relay</h1>
      <p class="lede">Periscope prism relay bouncing a sightline through two elbows</p>
    </header>

    <section class="ease-periscope-prism-relay" data-demo="periscope-prism-relay" aria-live="polite">
      <div class="ease-periscope-prism-relay__housing">
        <div class="ease-periscope-prism-relay__bezel">
          <div class="ease-periscope-prism-relay__face">
            <div class="ease-periscope-prism-relay__readout">
              <span class="ease-periscope-prism-relay__label">Periscope Prism Relay</span>
              <span class="ease-periscope-prism-relay__value">LIVE</span>
            </div>
            <div class="ease-periscope-prism-relay__motion" aria-hidden="true">
              <span class="ease-periscope-prism-relay__a"></span>
              <span class="ease-periscope-prism-relay__b"></span>
              <span class="ease-periscope-prism-relay__c"></span>
              <span class="ease-periscope-prism-relay__d"></span>
            </div>
            <div class="ease-periscope-prism-relay__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-periscope-prism-relay__controls">
          <button type="button" class="ease-periscope-prism-relay__btn primary">Engage</button>
          <button type="button" class="ease-periscope-prism-relay__btn">Reset</button>
          <label class="ease-periscope-prism-relay__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-periscope-prism-relay__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
