<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Arcade Footer</title>
    <link rel="stylesheet" href="style.css">
    <!-- Retro Pixel Font -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Main Content Area to show footer behavior -->
    <main class="content-wrapper">
        <h1 class="hero-title">INSERT COIN</h1>
        <p class="hero-subtitle">Scroll down to reveal the arcade footer...</p>
        <div class="scroll-indicator">
            <span class="arrow">V</span>
        </div>
        
        <div class="spacer"></div>
        <div class="spacer"></div>
    </main>

    <!-- Retro Dynamic Footer -->
    <footer class="retro-footer">
        <!-- Scanlines overlay -->
        <div class="scanlines"></div>
        
        <div class="footer-container">
            <div class="footer-col brand-col">
                <h2 class="arcade-logo">EASE<br>MOTION</h2>
                <p class="pixel-text xs">LEVEL: 99</p>
                <p class="pixel-text xs">SCORE: 999999</p>
            </div>
            
            <div class="footer-col links-col">
                <h3 class="col-title">SYSTEM MENU</h3>
                <ul class="pixel-list">
                    <li><a href="#" class="pixel-link">> START GAME</a></li>
                    <li><a href="#" class="pixel-link">> OPTIONS</a></li>
                    <li><a href="#" class="pixel-link">> HIGH SCORES</a></li>
                    <li><a href="#" class="pixel-link">> CREDITS</a></li>
                </ul>
            </div>
            
            <div class="footer-col social-col">
                <h3 class="col-title">MULTIPLAYER</h3>
                <div class="social-grid">
                    <a href="#" class="social-btn" aria-label="Twitter">TW</a>
                    <a href="#" class="social-btn" aria-label="GitHub">GH</a>
                    <a href="#" class="social-btn" aria-label="Discord">DC</a>
                </div>
            </div>
        </div>
        
        <div class="footer-bottom">
            <p class="pixel-text sm blink">© 2026 EASEMOTION INC. ALL RIGHTS RESERVED.</p>
        </div>
    </footer>

</body>
</html>
