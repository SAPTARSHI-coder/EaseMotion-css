<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Pure Lighthouse</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="lighthouse-demo">

        <section
            class="lighthouse-card"
            aria-labelledby="lighthouse-title"
        >

            <p class="eyebrow">Pure CSS Animation</p>

            <h1 id="lighthouse-title">CSS Lighthouse</h1>

            <p class="description">
                A rotating lighthouse beam created entirely with HTML and CSS.
            </p>

            <div
                class="lighthouse"
                role="img"
                aria-label="Animated lighthouse with a rotating light beam"
            >

                <div class="sky-glow" aria-hidden="true"></div>

                <div class="stars" aria-hidden="true">
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                </div>

                <div class="beam" aria-hidden="true"></div>

                <div class="lighthouse-tower">

                    <div class="light-room">
                        <div class="lamp"></div>
                    </div>

                    <div class="balcony"></div>

                    <div class="tower-body">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>

                    <div class="tower-door"></div>

                </div>

                <div class="ground" aria-hidden="true"></div>

            </div>

            <p class="hint">
                The light beam rotates automatically using CSS.
            </p>

        </section>

    </main>

</body>
</html>
