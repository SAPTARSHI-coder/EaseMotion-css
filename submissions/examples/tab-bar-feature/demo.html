<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Tab Bar - Material Design</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="tab-bar" role="tablist">
    <button class="tab active" role="tab" aria-selected="true">Home</button>
    <button class="tab" role="tab" aria-selected="false">Profile</button>
    <button class="tab" role="tab" aria-selected="false">Settings</button>
    <button class="tab" role="tab" aria-selected="false">About</button>
  </nav>
</body>
</html>
