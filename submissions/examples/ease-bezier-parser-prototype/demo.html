<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EaseMotion Bezier Curve Interpolation Parser Prototype</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="parser-dashboard">
    <h1 class="dashboard-header">EaseMotion Engine Bezier Parser</h1>
    <p class="dashboard-subtitle">Issue #77175 - Standalone Bezier Curve Interpolation Parser &amp; AST Visualizer</p>

    <div class="input-group">
      <input 
        type="text" 
        id="parserInput" 
        value='em="zoom-in cubic-bezier(0.68,-0.55,0.27,1.55)"' 
        placeholder="Enter EaseMotion attribute string..."
      />
      <button id="runBtn">Run Parser</button>
    </div>

    <div id="console" class="output-console">Click "Run Parser" to execute parsing logic...</div>
  </main>

  <script>
    function parseEaseMotionString(inputStr) {
      const bezierRegex = /cubic-bezier\(\s*([+-]?\d*\.?\d+)\s*,\s*([+-]?\d*\.?\d+)\s*,\s*([+-]?\d*\.?\d+)\s*,\s*([+-]?\d*\.?\d+)\s*\)/i;
      const match = inputStr.match(bezierRegex);

      if (!match) {
        throw new Error("Invalid format: No valid cubic-bezier definition found in input string.");
      }

      const x1 = parseFloat(match[1]);
      const y1 = parseFloat(match[2]);
      const x2 = parseFloat(match[3]);
      const y2 = parseFloat(match[4]);

      if (isNaN(x1) || isNaN(y1) || isNaN(x2) || isNaN(y2)) {
        throw new Error("Invalid coordinate values: Bezier control points must be valid numbers.");
      }

      if (x1 < 0 || x1 > 1 || x2 < 0 || x2 > 1) {
        throw new Error(`Coordinate Bounds Error: Time coordinates x1 (${x1}) and x2 (${x2}) must be bounded between 0 and 1.`);
      }

      return {
        type: 'easing-custom',
        bezier: { x1, y1, x2, y2 },
        generatedCSS: `.em-ease-\\[cubic-bezier(${x1},${y1},${x2},${y2})\\] { transition-timing-function: cubic-bezier(${x1}, ${y1}, ${x2}, ${y2}); }`
      };
    }

    document.addEventListener('DOMContentLoaded', () => {
      const inputEl = document.getElementById('parserInput');
      const buttonEl = document.getElementById('runBtn');
      const consoleEl = document.getElementById('console');

      function executeParser() {
        const value = inputEl.value.trim();
        try {
          const ast = parseEaseMotionString(value);
          consoleEl.className = 'output-console status-success';
          consoleEl.textContent = JSON.stringify(ast, null, 2);
        } catch (err) {
          consoleEl.className = 'output-console status-error';
          consoleEl.textContent = `[Error]: ${err.message}`;
        }
      }

      buttonEl.addEventListener('click', executeParser);
      
      // Auto-run once on load for immediate demonstration
      executeParser();
    });
  </script>

</body>
</html>
