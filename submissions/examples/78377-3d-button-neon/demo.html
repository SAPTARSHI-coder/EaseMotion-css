<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />
  <meta
    name="description"
    content="Responsive 3D neon button built with HTML and CSS."
  />
  <title>3D Neon Button</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main class="page">
    <section class="showcase" aria-labelledby="title">
      <span class="eyebrow">EASEMOTION CSS</span>

      <h1 id="title">3D Neon Button</h1>

      <p class="description">
        A responsive button with layered depth, neon glow,
        and tactile CSS interactions.
      </p>

      <div class="button-stage">
        <a class="neon-button" href="#demo">
          <span class="neon-button__glow"></span>
          <span class="neon-button__content">
            <span class="neon-button__dot"></span>
            Launch
            <span class="neon-button__arrow" aria-hidden="true">→</span>
          </span>
        </a>

        <p class="hint">Hover or focus the button</p>
      </div>
    </section>
  </main>
</body>
</html>
