<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ease CSS Kinetic Marquee</title>
    <link rel="stylesheet" href="../../../easemotion.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="demo-container">
        
        <header class="header">
            <h1>Kinetic Marquee</h1>
            <p>100% CSS. Zero JS loopers. Hardware Accelerated.</p>
        </header>

        <!-- 
          The Marquee Container 
          We hide the overflow so the text scrolling off-screen doesn't cause a horizontal scrollbar on the page!
        -->
        <section class="marquee-wrapper">
            
            <!-- The Scrolling Track -->
            <div class="marquee-track">
                
                <!-- 
                  To create an infinite loop, we duplicate the exact same text block twice.
                  As the first block scrolls completely off-screen to the left, 
                  the second block takes its place. We then instantly snap the track 
                  back to 0px, creating a flawless infinite loop!
                -->
                <div class="marquee-content">
                    <span class="solid-text">PREMIUM</span>
                    <span class="outline-text">AESTHETICS</span>
                    <span class="solid-text">FLAWLESS</span>
                    <span class="outline-text">PERFORMANCE</span>
                </div>
                
                <div class="marquee-content" aria-hidden="true">
                    <span class="solid-text">PREMIUM</span>
                    <span class="outline-text">AESTHETICS</span>
                    <span class="solid-text">FLAWLESS</span>
                    <span class="outline-text">PERFORMANCE</span>
                </div>

            </div>
            
        </section>
        
        <!-- A reverse scrolling marquee just for a premium layout feel! -->
        <section class="marquee-wrapper marquee-reverse">
            <div class="marquee-track">
                <div class="marquee-content">
                    <span class="outline-text">ZERO</span>
                    <span class="solid-text">JAVASCRIPT</span>
                    <span class="outline-text">NATIVE</span>
                    <span class="solid-text">HARDWARE</span>
                </div>
                <div class="marquee-content" aria-hidden="true">
                    <span class="outline-text">ZERO</span>
                    <span class="solid-text">JAVASCRIPT</span>
                    <span class="outline-text">NATIVE</span>
                    <span class="solid-text">HARDWARE</span>
                </div>
            </div>
        </section>

    </main>

</body>
</html>
