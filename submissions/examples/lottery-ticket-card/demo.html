<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="A responsive CSS lottery ticket card with a foil texture."
  >
  <title>CSS Lottery Ticket Card</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="demo">
    <header class="demo-header">
      <p class="eyebrow">EaseMotion CSS</p>
      <h1>Lottery Ticket</h1>
      <p>A playful lottery ticket card styled entirely with CSS.</p>
    </header>

    <article class="ticket" tabindex="0" aria-label="Lucky Star lottery ticket">
      <div class="ticket-main">
        <div class="ticket-top">
          <div>
            <p class="ticket-label">LUCKY STAR</p>
            <h2>JACKPOT</h2>
          </div>

          <span class="ticket-badge" aria-hidden="true">★</span>
        </div>

        <div class="foil" aria-label="Scratch area">
          <span class="foil-shine" aria-hidden="true"></span>
          <span class="scratch-text">LUCKY</span>
          <span class="scratch-text">777</span>
          <span class="scratch-text">★</span>
        </div>

        <div class="ticket-footer">
          <span>GOOD LUCK!</span>
          <span aria-hidden="true">✦ ✦ ✦</span>
        </div>
      </div>

      <div class="ticket-stub" aria-label="Ticket information">
        <span class="stub-label">TICKET</span>
        <strong>#024817</strong>
        <span class="stub-price">$5</span>
      </div>
    </article>

    <p class="hint">
      Pure CSS · Foil texture · Responsive
    </p>
  </main>
</body>
</html>
