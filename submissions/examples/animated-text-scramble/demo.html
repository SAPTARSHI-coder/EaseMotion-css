<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ease-text-scramble demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <h1 class="ease-text-scramble" data-text="Welcome Aboard">Welcome Aboard</h1>

  <script>
    const chars = "!<>-_\\/[]{}—=+*^?#________";
    function scramble(el) {
      const final = el.dataset.text;
      let frame = 0;
      const totalFrames = 30;
      const interval = setInterval(() => {
        el.textContent = final
          .split("")
          .map((c, i) => (i < frame ? final[i] : chars[Math.floor(Math.random() * chars.length)]))
          .join("");
        frame += final.length / totalFrames;
        if (frame >= final.length) {
          el.textContent = final;
          clearInterval(interval);
        }
      }, 30);
    }
    scramble(document.querySelector('.ease-text-scramble'));
  </script>
</body>
</html>
