<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Circuit Trace Button - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="em-circuit-page">
        <div class="em-card" role="region" aria-label="Circuit Trace Button Showcase" tabindex="0">
            <span class="em-card-badge">TECHNICAL COMPONENTS</span>
            <h1 class="em-card-title">Circuit Trace Button</h1>
            <p class="em-card-desc">An advanced interactive button featuring animated circuit board traces and glowing pathway signals on hover using pure CSS.</p>
            
            <!-- Circuit Button Container -->
            <div class="em-circuit-container">
                <a href="#" class="em-circuit-btn" role="button">
                    <span class="em-btn-text">Initialize Circuit</span>
                    <div class="em-trace em-trace-1" aria-hidden="true"></div>
                    <div class="em-trace em-trace-2" aria-hidden="true"></div>
                </a>
            </div>

            <a href="#" class="em-card-link" role="button">View Documentation</a>
        </div>
    </div>
</body>
</html>
