<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Flip Card - EaseMotion CSS</title>
  <link rel="stylesheet" href="../../../easemotion.css">
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #111827; /* Dark theme to make it look premium */
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      margin: 0;
      color: #fff;
    }
    
    /* Give the card dimensions in the demo */
    .ease-flip-card {
      width: 320px;
      height: 440px;
      margin: 20px;
    }

    /* Demo Specific Styling */
    .front, .back {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .front {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.01));
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .back {
      background: linear-gradient(135deg, #6366f1, #a855f7);
    }

    .front img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 8px;
      margin-bottom: 24px;
      background-color: #374151; /* Placeholder color */
    }

    h2 {
      margin: 0 0 12px 0;
      font-size: 24px;
      font-weight: 600;
      letter-spacing: -0.5px;
    }

    p {
      margin: 0;
      text-align: center;
      line-height: 1.6;
      font-size: 15px;
      color: #9ca3af;
    }

    .back p {
      color: rgba(255, 255, 255, 0.9);
      margin-bottom: 12px;
    }

    .price {
      font-size: 36px;
      font-weight: 700;
      margin-top: auto;
      text-shadow: 0 2px 10px rgba(0,0,0,0.2);
    }

    .badge {
      position: absolute;
      top: 16px;
      right: 16px;
      background: #ef4444;
      color: white;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <!-- Example of 3D Flip Card -->
  <div class="ease-flip-card">
    <div class="ease-flip-card-inner">
      
      <!-- Front Face -->
      <div class="front">
        <div class="badge">New</div>
        <!-- Using a placeholder styling for image area -->
        <div style="width: 100%; height: 200px; border-radius: 8px; margin-bottom: 24px; background: linear-gradient(45deg, #374151, #1f2937); display: flex; align-items: center; justify-content: center; font-size: 48px;">👟</div>
        <h2>AeroSneak Pro</h2>
        <p>Hover to flip and see details</p>
      </div>
      
      <!-- Back Face -->
      <div class="back">
        <h2>Features</h2>
        <p>Ultra-breathable mesh</p>
        <p>Cloud-foam cushioning</p>
        <p>Anti-slip rubber outsole</p>
        <p>Eco-friendly materials</p>
        <div class="price">$149</div>
      </div>

    </div>
  </div>

</body>
</html>
