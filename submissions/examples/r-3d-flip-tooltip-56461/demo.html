<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS 3D-Flip Tooltip</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<section class="tooltip-section">

<h1>Gaming Hub Tooltips</h1>

<div class="tooltip-grid">

<div class="tooltip-item">
<button class="tooltip-btn">🎮 Battle Pass</button>
<div class="tooltip">
Unlock premium rewards, exclusive missions, and seasonal content.
</div>
</div>

<div class="tooltip-item">
<button class="tooltip-btn">⚔️ Mythic Sword</button>
<div class="tooltip">
A legendary weapon with critical-hit bonuses and blazing speed.
</div>
</div>

<div class="tooltip-item">
<button class="tooltip-btn">🛡️ Guardian Shield</button>
<div class="tooltip">
Absorbs incoming damage and grants temporary protection.
</div>
</div>

<div class="tooltip-item">
<button class="tooltip-btn">💎 Epic Crystal</button>
<div class="tooltip">
Collect rare crystals to unlock exclusive cosmetics.
</div>
</div>

</div>

</section>

</body>
</html>
