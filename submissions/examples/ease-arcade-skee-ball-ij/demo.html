<!-- EaseMotion component: arcade-skee-ball -->
<!DOCTYPE html>
<html lang="en" data-skee="ball">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Ease Arcade Skee-Ball</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="skee-alley">
  <header class="skee-head">
    <span class="skee-title">SKEE BALL</span>
    <span class="skee-score">SCORE 180</span>
  </header>
  <div class="skee-back">
    <span class="ring ring-40"><span class="ring-num">40</span></span>
    <span class="ring ring-30"><span class="ring-num">30</span></span>
    <span class="ring ring-20"><span class="ring-num">20</span></span>
    <span class="ring ring-10"><span class="ring-num">10</span></span>
  </div>
  <div class="skee-lane">
    <span class="lane-rail rail-left"></span>
    <span class="lane-rail rail-right"></span>
    <span class="skee-ball"></span>
  </div>
  <footer class="skee-foot">
    <span class="skee-tickets">TICKETS 45</span>
    <span class="skee-stars">&#9733;&#9733;&#9733;</span>
  </footer>
</main>
</body>
</html>
