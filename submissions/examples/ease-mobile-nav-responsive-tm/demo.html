<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mobile Nav | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="mnr-root">
    <div class="mnr-top">
      <a href="#" class="mnr-logo">Logo</a>
      <button class="mnr-toggle" type="button"
        onclick="this.parentElement.nextElementSibling.classList.toggle('open')">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
    <nav class="mnr-nav" id="mobileNav">
      <a href="#" class="mnr-link">Home</a>
      <a href="#" class="mnr-link">Features</a>
      <a href="#" class="mnr-link">Pricing</a>
      <a href="#" class="mnr-link">About</a>
      <a href="#" class="mnr-link">Contact</a>
    </nav>
    <div class="mnr-main">
      <h1 class="mnr-title">Responsive Navigation</h1>
      <p class="mnr-body">Click the hamburger icon above to toggle the mobile menu.
        The menu slides open with a smooth CSS transition on max-height.</p>
    </div>
  </div>
</body>
</html>
