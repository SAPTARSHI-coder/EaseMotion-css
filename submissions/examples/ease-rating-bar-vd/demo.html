<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ease Rating Bar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="rating-demo">

    <div class="rating-item">
        <div class="rating-header">
            <span>Product Quality</span>
            <strong>4.5 / 5</strong>
        </div>

        <div class="rating-bar large">
            <span class="rating-fill" style="width: 90%;"></span>
        </div>
    </div>

    <div class="rating-item">
        <div class="rating-header">
            <span>User Experience</span>
            <strong>4 / 5</strong>
        </div>

        <div class="rating-bar">
            <span class="rating-fill" style="width: 80%;"></span>
        </div>
    </div>

    <div class="rating-item">
        <div class="rating-header">
            <span>Support</span>
            <strong>3 / 5</strong>
        </div>

        <div class="rating-bar small">
            <span class="rating-fill" style="width: 60%;"></span>
        </div>
    </div>

</div>

</body>
</html>
