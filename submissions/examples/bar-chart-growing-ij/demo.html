<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-bar-chart-growing demo</title>
</head>
<body>
<div class="bcg-card">
  <span class="bcg-title">REVENUE</span>
  <div class="bcg-chart">
    <div class="bcg-bar bcg-b1"><span class="bcg-cap">40</span></div>
    <div class="bcg-bar bcg-b2"><span class="bcg-cap">72</span></div>
    <div class="bcg-bar bcg-b3"><span class="bcg-cap">55</span></div>
    <div class="bcg-bar bcg-b4"><span class="bcg-cap">89</span></div>
    <div class="bcg-bar bcg-b5"><span class="bcg-cap">64</span></div>
  </div>
  <div class="bcg-axis">
    <span class="bcg-tick">Q1</span>
    <span class="bcg-tick">Q2</span>
    <span class="bcg-tick">Q3</span>
    <span class="bcg-tick">Q4</span>
    <span class="bcg-tick">Q5</span>
  </div>
</div>
</body>
</html>
