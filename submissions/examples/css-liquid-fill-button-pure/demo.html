<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Liquid Fill Button</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="layout-container">
        
        <header class="section-header">
            <h1 class="title">Liquid Fill Button</h1>
            <p class="subtitle">A pure CSS implementation of the liquid wave fill effect utilizing spinning pseudo-elements.</p>
        </header>

        <div class="demo-area">
            
            <button class="liquid-btn">
                <span>Hover to Fill</span>
                <!-- The wave is generated via CSS ::before and ::after pseudo-elements -->
            </button>
            
        </div>
        
    </div>

</body>
</html>
