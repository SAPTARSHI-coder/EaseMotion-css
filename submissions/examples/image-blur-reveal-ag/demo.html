<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Blur Reveal Component</title>
  <link rel="stylesheet" href="./style.css">
  <style>
    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background-color: #121212;
      font-family: system-ui, -apple-system, sans-serif;
      color: #fff;
    }
    
    .instruction {
      margin-top: 2rem;
      color: #888;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>

  <!-- The Component -->
  <figure class="image-blur-reveal">
    <!-- Using a placeholder image for the demo -->
    <img src="https://picsum.photos/600/400" alt="Scenic Landscape">
  </figure>
  
  <p class="instruction">Hover over the image to sharpen and scale it in</p>

</body>
</html>
