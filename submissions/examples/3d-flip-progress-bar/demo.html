<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 3D-Flip Progress Bar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="product-card">
        <div class="product-header">
            <h3>Cyberpunk Smartwatch</h3>
            <span class="badge">Trending</span>
        </div>
        
        <div class="progress-scene">
            <div class="progress-cube">
                <div class="cube-face cube-front">
                    <span class="status-text">Funding Goal: 80%</span>
                </div>
                <div class="cube-face cube-bottom">
                    <div class="progress-track">
                        <div class="progress-fill"></div>
                    </div>
                </div>
            </div>
        </div>

        <p class="description">Hover the card to reveal the funding progress in a smooth 3D flip animation.</p>
    </div>
</body>
</html>
