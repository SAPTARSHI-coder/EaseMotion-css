<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkbox Focus-Visible Fix – EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h2>ease-checkbox – Focus-Visible Ring Fix</h2>
  <div class="demo-stack">
    <label class="ease-checkbox">
      <input class="ease-checkbox__input" type="checkbox" id="cb1">
      <span class="ease-checkbox__box"></span>
      <span class="ease-checkbox__label">Subscribe to newsletter</span>
    </label>
    <label class="ease-checkbox">
      <input class="ease-checkbox__input" type="checkbox" id="cb2" checked>
      <span class="ease-checkbox__box"></span>
      <span class="ease-checkbox__label">Accept terms and conditions</span>
    </label>
    <label class="ease-checkbox">
      <input class="ease-checkbox__input" type="checkbox" id="cb3" disabled>
      <span class="ease-checkbox__box"></span>
      <span class="ease-checkbox__label">Admin privileges (disabled)</span>
    </label>
  </div>
  <p class="note">Tab to each checkbox — a blue ring appears on keyboard focus.</p>
</body>
</html>
