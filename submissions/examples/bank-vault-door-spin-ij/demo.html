<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-bank-vault-door-spin demo</title>
</head>
<body>
<div class="bv-app">
  <span class="bv-title">BANK VAULT</span>
  <span class="bv-sign">FIDELITY</span>
  <div class="bv-frame">
    <div class="bv-door">
      <span class="bv-bolt bv-bolt-1"></span>
      <span class="bv-bolt bv-bolt-2"></span>
      <span class="bv-bolt bv-bolt-3"></span>
      <div class="bv-wheel">
        <span class="bv-spoke bv-spoke-1"></span>
        <span class="bv-spoke bv-spoke-2"></span>
        <span class="bv-spoke bv-spoke-3"></span>
        <span class="bv-spoke bv-spoke-4"></span>
        <span class="bv-hub"></span>
        <span class="bv-handle"></span>
      </div>
    </div>
    <span class="bv-hinge bv-hinge-1"></span>
    <span class="bv-hinge bv-hinge-2"></span>
  </div>
  <div class="bv-pad">
    <span class="bv-dial"></span>
    <span class="bv-led"></span>
  </div>
</div>
</body>
</html>
