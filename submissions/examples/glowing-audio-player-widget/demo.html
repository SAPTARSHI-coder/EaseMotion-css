<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glowing Audio Player Widget (Minimalist) - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="em-app-container">
        <!-- Zero-JS Checkbox Hack for Play/Pause State Toggle -->
        <input type="checkbox" id="em-play-toggle" class="em-play-checkbox" aria-hidden="true">

        <div class="em-audio-widget" role="region" aria-label="Glowing Audio Player Widget" tabindex="0">
            <div class="em-widget-header">
                <span class="em-demo-tag">WIDGET // AUDIO PLAYER</span>
                <span class="em-live-indicator" aria-hidden="true"></span>
            </div>

            <div class="em-track-info">
                <h1 class="em-track-title">Ethereal Motion (Ambient Mix)</h1>
                <p class="em-track-artist">EaseMotion Soundscapes</p>
            </div>

            <!-- Animated Equalizer Bars (Pure CSS) -->
            <div class="em-equalizer" aria-hidden="true">
                <span class="em-bar"></span>
                <span class="em-bar"></span>
                <span class="em-bar"></span>
                <span class="em-bar"></span>
                <span class="em-bar"></span>
            </div>

            <!-- Play/Pause Control Label -->
            <div class="em-controls">
                <label for="em-play-toggle" class="em-play-btn" role="button" aria-label="Toggle Play and Pause" tabindex="0">
                    <span class="em-icon-play" aria-hidden="true">▶</span>
                    <span class="em-icon-pause" aria-hidden="true">❚❚</span>
                </label>
            </div>
        </div>
    </div>
</body>
</html>
