<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ease Greenhouse Vent Louver</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<section class="showcase">

  <h1>Greenhouse Vent Louver</h1>
  <p>Automated roof ventilation control</p>

  <div class="ease-greenhouse-vent-louver">

    <div class="control-panel">
      <span>THERMAL CONTROL</span>
      <div class="indicator"></div>
    </div>

    <div class="greenhouse">
      <div class="roof">
        <div class="louver l1"></div>
        <div class="louver l2"></div>
        <div class="louver l3"></div>
      </div>

      <div class="plant">
        🌱
      </div>

    </div>

    <div class="status">
      TEMP: 24°C <br>
      VENT: OPEN
    </div>

  </div>

</section>

</body>
</html>
