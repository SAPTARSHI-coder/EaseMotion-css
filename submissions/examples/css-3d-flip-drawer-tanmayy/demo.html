<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS 3D-Flip Drawer - EaseMotion CSS</title>
  <!-- Import EaseMotion CSS -->
  <link rel="stylesheet" href="../../../easemotion.css">
  <!-- Component Specific Styles -->
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="checkout-bg">

  <div class="demo-container">
    
    <div class="checkout-panel ease-glass-card">
      <div class="checkout-header">
        <h2 class="ease-text-xl">Checkout</h2>
      </div>

      <!-- 3D-Flip Drawer Component -->
      <div class="flip-drawer-container">
        
        <!-- Hidden Checkbox for Drawer State -->
        <input type="checkbox" id="drawer-toggle" class="drawer-checkbox">
        
        <!-- Toggle Button -->
        <label for="drawer-toggle" class="drawer-toggle-btn" tabindex="0">
          <span class="btn-text">
            <span>Show Order Summary</span>
            <span class="btn-price">$145.00</span>
          </span>
          <svg class="chevron-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
        </label>
        
        <!-- The 3D Drawer -->
        <div class="flip-drawer">
          <div class="drawer-content">
            
            <div class="order-items">
              <div class="item-row">
                <div class="item-img"></div>
                <div class="item-details">
                  <h4 class="item-name">Minimalist Backpack</h4>
                  <p class="item-qty">Qty: 1</p>
                </div>
                <div class="item-price">$120.00</div>
              </div>
            </div>
            
            <div class="summary-breakdown">
              <div class="summary-line">
                <span>Subtotal</span>
                <span>$120.00</span>
              </div>
              <div class="summary-line">
                <span>Shipping</span>
                <span>$10.00</span>
              </div>
              <div class="summary-line">
                <span>Tax</span>
                <span>$15.00</span>
              </div>
            </div>
            
          </div>
        </div>
        <!-- End 3D Drawer -->
        
      </div>

      <div class="checkout-form">
        <div class="form-group">
          <label>Email Address</label>
          <div class="mock-input">john.doe@example.com</div>
        </div>
        
        <div class="form-group">
          <label>Shipping Address</label>
          <div class="mock-input">123 Design St, UI City, CA 90210</div>
        </div>
      </div>
      
      <div class="checkout-footer">
        <button class="pay-btn ease-squish-button">Complete Order</button>
      </div>
    </div>

  </div>

</body>
</html>
