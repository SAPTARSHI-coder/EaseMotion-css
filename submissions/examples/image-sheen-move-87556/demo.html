<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Sheen Move #87556 Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="showcase-container">
    <div class="sheen-frame" id="sheenCard">
      <img 
        src="https://images.unsplash.com/photo-1579546929518-9e396f3cc809?auto=format&fit=crop&w=1000&q=80" 
        alt="Abstract Holographic Gradients" 
        class="sheen-img"
      >
      <div class="card-badge">Periodic Sheen Reflection</div>
    </div>

    <div class="controls-panel">
      <span class="status-text" id="statusIndicator">Status: Sweeping every 4.5s (Hover to accelerate)</span>
      <button class="btn-toggle" id="togglePlayBtn">Pause Sheen</button>
    </div>
  </div>

  <script>
    const card = document.getElementById('sheenCard');
    const toggleBtn = document.getElementById('togglePlayBtn');
    const statusText = document.getElementById('statusIndicator');

    toggleBtn.addEventListener('click', () => {
      const isPaused = card.classList.toggle('paused');
      if (isPaused) {
        toggleBtn.textContent = 'Resume Sheen';
        statusText.textContent = 'Status: Paused';
      } else {
        toggleBtn.textContent = 'Pause Sheen';
        statusText.textContent = 'Status: Sweeping every 4.5s (Hover to accelerate)';
      }
    });
  </script>
</body>
</html>
