<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Torsion Balance Twist — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Torsion Balance Twist demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Torsion Balance Twist</h1>
      <p class="lede">Cavendish torsion balance fiber twist and boom oscillation</p>
    </header>

    <section class="ease-torsion-balance-twist" data-demo="torsion-balance-twist" aria-live="polite">
      <div class="ease-torsion-balance-twist__housing">
        <div class="ease-torsion-balance-twist__bezel">
          <div class="ease-torsion-balance-twist__face">
            <div class="ease-torsion-balance-twist__readout">
              <span class="ease-torsion-balance-twist__label">Torsion Balance Twist</span>
              <span class="ease-torsion-balance-twist__value">LIVE</span>
            </div>
            <div class="ease-torsion-balance-twist__motion" aria-hidden="true">
              <span class="ease-torsion-balance-twist__a"></span>
              <span class="ease-torsion-balance-twist__b"></span>
              <span class="ease-torsion-balance-twist__c"></span>
              <span class="ease-torsion-balance-twist__d"></span>
            </div>
            <div class="ease-torsion-balance-twist__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-torsion-balance-twist__controls">
          <button type="button" class="ease-torsion-balance-twist__btn primary">Engage</button>
          <button type="button" class="ease-torsion-balance-twist__btn">Reset</button>
          <label class="ease-torsion-balance-twist__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-torsion-balance-twist__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
