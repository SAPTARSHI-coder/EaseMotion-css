<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Torsion Balance Twist | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="torsion-demo-container">
    <header class="torsion-demo-header">
      <h1>Torsion Balance Twist</h1>
      <p>Cavendish-style torsion balance with twisting fiber and damped boom oscillation.</p>
    </header>

    <section class="ease-torsion-balance-twist">
      <div class="ease-torsion-balance-twist__housing">
        <div class="ease-torsion-balance-twist__bezel">
          <div class="ease-torsion-balance-twist__face">
            <div class="ease-torsion-balance-twist__motion" aria-hidden="true">
              <span class="ease-torsion-balance-twist__a"></span>
              <span class="ease-torsion-balance-twist__b"></span>
              <span class="ease-torsion-balance-twist__c"></span>
              <span class="ease-torsion-balance-twist__d"></span>
            </div>
          </div>
        </div>
      </div>
    </section>

    <p class="torsion-demo-hint">💡 Cavendish real-world instrument metaphor with periodic damping physics.</p>
  </main>
</body>
</html>
