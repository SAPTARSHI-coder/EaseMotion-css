<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Floating minimalist stat card built with pure CSS."
  >

  <title>Floating Stat Card — Minimalist</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="stat-page">

    <section
      class="stat-card"
      aria-labelledby="stat-title"
    >

      <div class="stat-card__top">

        <div class="stat-card__icon" aria-hidden="true">
          <svg
            viewBox="0 0 24 24"
            role="presentation"
          >
            <path d="M4 19V5"></path>
            <path d="M4 19h16"></path>
            <path d="m7 15 4-4 3 3 6-7"></path>
          </svg>
        </div>

        <span class="stat-card__period">
          THIS MONTH
        </span>

      </div>

      <div class="stat-card__body">

        <p class="stat-card__label">
          Total Revenue
        </p>

        <h1 id="stat-title" class="stat-card__value">
          $48,290
        </h1>

        <div class="stat-card__trend">

          <span
            class="stat-card__trend-icon"
            aria-hidden="true"
          >
            ↑
          </span>

          <strong>12.8%</strong>

          <span>
            vs last month
          </span>

        </div>

      </div>

      <div
        class="stat-card__chart"
        aria-hidden="true"
      >
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
      </div>

      <div class="stat-card__footer">

        <span>
          Updated today
        </span>

        <span class="stat-card__status">
          <i></i>
          On track
        </span>

      </div>

    </section>

  </main>

</body>
</html>
