<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Pure CSS 3D Velvet Smooth Transition effect."
  >
  <title>Velvet Smooth Transition</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="velvet-scene">
    <section class="velvet-stage" aria-labelledby="velvet-title">
      <div class="velvet-card">
        <div class="velvet-layer layer-back" aria-hidden="true"></div>
        <div class="velvet-layer layer-middle" aria-hidden="true"></div>

        <div class="velvet-content">
          <div class="top-bar">
            <span class="badge">3D EXPERIENCE</span>

            <span class="status">
              <span class="status-dot"></span>
              SMOOTH
            </span>
          </div>

          <div class="velvet-orb" aria-hidden="true">
            <span class="orb-ring ring-one"></span>
            <span class="orb-ring ring-two"></span>
            <span class="orb-core"></span>
          </div>

          <p class="eyebrow">VELVET MOTION</p>

          <h1 id="velvet-title">
            Smooth
            <span>Depth.</span>
          </h1>

          <p class="description">
            A soft 3D transition effect inspired by the flowing
            texture and depth of velvet fabric.
          </p>

          <div class="card-footer">
            <span class="footer-label">PURE CSS / 3D</span>

            <button class="action-button" type="button">
              Explore
              <span aria-hidden="true">→</span>
            </button>
          </div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
