<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EaseMotion — Bouncing Spring Rating</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="demo-shell">
        <section class="rating-card">
            <div class="rating-heading">
                <span class="eyebrow">EaseMotion CSS</span>
                <h1>How was your experience?</h1>
                <p>Select a rating to see the bouncing spring feedback.</p>
            </div>

            <fieldset class="rating">
                <legend class="sr-only">Rate your experience from one to five stars</legend>

                <input id="rating-5" name="rating" type="radio" value="5">
                <label for="rating-5" aria-label="5 out of 5 stars">★</label>

                <input id="rating-4" name="rating" type="radio" value="4">
                <label for="rating-4" aria-label="4 out of 5 stars">★</label>

                <input id="rating-3" name="rating" type="radio" value="3">
                <label for="rating-3" aria-label="3 out of 5 stars">★</label>

                <input id="rating-2" name="rating" type="radio" value="2">
                <label for="rating-2" aria-label="2 out of 5 stars">★</label>

                <input id="rating-1" name="rating" type="radio" value="1">
                <label for="rating-1" aria-label="1 out of 5 stars">★</label>
            </fieldset>

            <p class="rating-hint">Choose a rating</p>
        </section>
    </main>
</body>

</html>
