<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Bouncing Spring CSS Toast notification">
  <title>Bouncing Spring Toast</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">
    <section class="demo-card">
      <span class="eyebrow">CSS TOAST</span>

      <h1>Bouncing Spring</h1>

      <p class="description">
        A playful notification with a spring-inspired entrance,
        soft depth, and smooth pure CSS motion.
      </p>

      <div class="toast-stage">
        <article class="toast" role="status" aria-live="polite">
          <div class="toast-icon" aria-hidden="true">
            <span>✓</span>
          </div>

          <div class="toast-content">
            <strong>Changes saved</strong>
            <span>Your settings have been updated successfully.</span>
          </div>

          <button class="toast-close" type="button" aria-label="Dismiss notification">
            ×
          </button>
        </article>
      </div>

      <p class="hint">
        The toast uses a spring-like CSS entrance animation
      </p>
    </section>
  </main>

</body>
</html>
