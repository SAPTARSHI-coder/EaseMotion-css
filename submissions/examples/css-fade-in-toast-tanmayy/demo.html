<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Fade-In Toast - EaseMotion CSS</title>
  <!-- Import EaseMotion CSS -->
  <link rel="stylesheet" href="../../../easemotion.css">
  <!-- Component Specific Styles -->
  <link rel="stylesheet" href="style.css">
  <!-- Optional: Google Fonts for a gaming feel -->
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
</head>
<body class="gaming-hub-bg">
  
  <div class="demo-container">
    
    <!-- Toast Trigger (Hidden Checkbox) -->
    <input type="checkbox" id="toast-trigger" class="toast-trigger" hidden aria-hidden="true">
    
    <!-- Main Hub UI -->
    <div class="hub-interface">
      <h1 class="hub-title">COMMAND CENTER</h1>
      <p>Initiate sequence to unlock achievement.</p>
      
      <!-- Button to trigger the toast -->
      <label for="toast-trigger" class="trigger-btn ease-squish-button">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
        GRANT REWARD
      </label>
    </div>

    <!-- Fade-In Toast Component -->
    <div class="toast-container" role="alert" aria-live="assertive">
      <div class="toast-card ease-glass-card">
        <div class="toast-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"></path></svg>
        </div>
        <div class="toast-content">
          <h4 class="toast-title">ACHIEVEMENT UNLOCKED</h4>
          <p class="toast-message">Master of the CSS Realm</p>
        </div>
        <!-- Dismiss Button -->
        <label for="toast-trigger" class="toast-close" aria-label="Close Toast">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </label>
      </div>
    </div>
    
  </div>

</body>
</html>
