<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jackpot Counter &mdash; EaseMotion CSS Demo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="page-head">
    <p class="kicker">EaseMotion CSS &middot; Games &amp; Play</p>
    <h1>Jackpot Counter</h1>
    <p class="sub">The winnings are rolling in &mdash; watch the digits chase each other.</p>
  </header>
  <main class="stage">
    <div class="jc-holder">
      <div class="jc-glow"></div>
      <div class="jc-display">
        <span class="jc-digit">7</span>
        <span class="jc-digit">7</span>
        <span class="jc-digit">7</span>
        <span class="jc-digit">7</span>
        <span class="jc-digit">7</span>
        <span class="jc-digit">7</span>
      </div>
    </div>
  </main>
  <p class="stage-caption">Every digit rolls in sequence toward the winning line.</p>
  <footer class="page-foot">
    <span>Pure CSS &middot; zero dependencies</span>
    <span>Rolling odometer</span>
  </footer>
</body>
</html>
