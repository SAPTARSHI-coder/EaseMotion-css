<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Animated Number Input</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <!-- Number Input Component -->
  <div class="number-input-wrapper">
    
    <!-- Decrement Button -->
    <button class="stepper-btn down" aria-label="Decrease value" onclick="this.nextElementSibling.stepDown()">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M20 12H4"></path>
      </svg>
    </button>
    
    <!-- Input Field -->
    <input type="number" class="number-input" value="1" min="0" max="99" aria-label="Quantity">
    
    <!-- Increment Button -->
    <button class="stepper-btn up" aria-label="Increase value" onclick="this.previousElementSibling.stepUp()">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"></path>
      </svg>
    </button>

  </div>

</body>
</html>
