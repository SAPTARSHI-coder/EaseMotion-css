<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS DNA Strand Progress | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="dna-demo-container">
    
    <!-- DNA Strand Progress Component -->
    <article class="ease-dna-card" aria-label="Genome Sequencing Progress">
      
      <header class="ease-dna-header">
        <h2>Genome Sequencing</h2>
        <p>Analyzing molecular base pairs and markers</p>
      </header>

      <!-- Accessible DNA Double Helix Progress Visualizer -->
      <div class="ease-dna-helix" role="progressbar" aria-valuenow="75" aria-valuemin="0" aria-valuemax="100" aria-label="Sequencing progress: 75 percent complete">
        
        <!-- Rung 1 (Active) -->
        <div class="ease-dna-rung active">
          <div class="ease-node left" style="--i: 1;"></div>
          <div class="ease-node right" style="--i: 1;"></div>
        </div>

        <!-- Rung 2 (Active) -->
        <div class="ease-dna-rung active">
          <div class="ease-node left" style="--i: 2;"></div>
          <div class="ease-node right" style="--i: 2;"></div>
        </div>

        <!-- Rung 3 (Active) -->
        <div class="ease-dna-rung active">
          <div class="ease-node left" style="--i: 3;"></div>
          <div class="ease-node right" style="--i: 3;"></div>
        </div>

        <!-- Rung 4 (Active) -->
        <div class="ease-dna-rung active">
          <div class="ease-node left" style="--i: 4;"></div>
          <div class="ease-node right" style="--i: 4;"></div>
        </div>

        <!-- Rung 5 (Active) -->
        <div class="ease-dna-rung active">
          <div class="ease-node left" style="--i: 5;"></div>
          <div class="ease-node right" style="--i: 5;"></div>
        </div>

        <!-- Rung 6 (Active) -->
        <div class="ease-dna-rung active">
          <div class="ease-node left" style="--i: 6;"></div>
          <div class="ease-node right" style="--i: 6;"></div>
        </div>

        <!-- Rung 7 (Inactive) -->
        <div class="ease-dna-rung">
          <div class="ease-node left" style="--i: 7;"></div>
          <div class="ease-node right" style="--i: 7;"></div>
        </div>

        <!-- Rung 8 (Inactive) -->
        <div class="ease-dna-rung">
          <div class="ease-node left" style="--i: 8;"></div>
          <div class="ease-node right" style="--i: 8;"></div>
        </div>

      </div>

      <div class="ease-dna-meta">
        <span class="ease-dna-percentage" aria-hidden="true">75%</span>
        <span class="ease-dna-status">6 of 8 Base Segments Sequenced</span>
      </div>

    </article>

  </main>

</body>
</html>
