<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimalist Floating Dropzone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="mf-dz-container">
        <input type="file" id="mf-dz-file" class="mf-dz-input" multiple>
        <label for="mf-dz-file" class="mf-dz-label">
            <div class="mf-dz-content">
                <span class="mf-dz-icon">+</span>
                <span class="mf-dz-text">Upload File</span>
            </div>
        </label>
    </div>
</body>
</html>
