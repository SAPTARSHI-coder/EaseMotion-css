<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bioluminescent Floating Dock Navigation - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="biolum-dock">
    <div class="dock-glow-blur"></div>
    
    <div class="dock-item active">
      <span class="icon">🏠</span>
      <span class="tooltip">HOME</span>
      <div class="glow-orb"></div>
    </div>
    
    <div class="dock-item">
      <span class="icon">🚀</span>
      <span class="tooltip">EXPLORE</span>
      <div class="glow-orb"></div>
    </div>
    
    <div class="dock-item">
      <span class="icon">⚡</span>
      <span class="tooltip">FEATURES</span>
      <div class="glow-orb"></div>
    </div>
    
    <div class="dock-item">
      <span class="icon">💎</span>
      <span class="tooltip">PREMIUM</span>
      <div class="glow-orb"></div>
    </div>
    
    <div class="dock-item">
      <span class="icon">⚙️</span>
      <span class="tooltip">SETTINGS</span>
      <div class="glow-orb"></div>
    </div>
  </nav>
</body>
</html>
