<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aperture Iris Close — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Aperture Iris Close demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Aperture Iris Close</h1>
      <p class="lede">Camera iris aperture blades closing to a pinpoint</p>
    </header>

    <section class="ease-aperture-iris-close" data-demo="aperture-iris-close" aria-live="polite">
      <div class="ease-aperture-iris-close__housing">
        <div class="ease-aperture-iris-close__bezel">
          <div class="ease-aperture-iris-close__face">
            <div class="ease-aperture-iris-close__readout">
              <span class="ease-aperture-iris-close__label">Aperture Iris Close</span>
              <span class="ease-aperture-iris-close__value">LIVE</span>
            </div>
            <div class="ease-aperture-iris-close__motion" aria-hidden="true">
              <span class="ease-aperture-iris-close__a"></span>
              <span class="ease-aperture-iris-close__b"></span>
              <span class="ease-aperture-iris-close__c"></span>
              <span class="ease-aperture-iris-close__d"></span>
            </div>
            <div class="ease-aperture-iris-close__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-aperture-iris-close__controls">
          <button type="button" class="ease-aperture-iris-close__btn primary">Engage</button>
          <button type="button" class="ease-aperture-iris-close__btn">Reset</button>
          <label class="ease-aperture-iris-close__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-aperture-iris-close__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
