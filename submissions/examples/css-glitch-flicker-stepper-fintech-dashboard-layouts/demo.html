<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Glitch-Flicker Stepper Fintech Dashboard</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<main class="container">


<section class="dashboard">


<span class="badge">
FINTECH DASHBOARD
</span>


<h1>
Transaction Progress
</h1>


<p>
A futuristic CSS glitch-flicker stepper component.
</p>



<div class="stepper">


<div class="step active">

<div class="circle">
01
</div>

<h3>
Payment Started
</h3>

<p>
Transaction request created.
</p>

</div>



<div class="line"></div>



<div class="step">

<div class="circle">
02
</div>

<h3>
Verification
</h3>

<p>
Checking account details.
</p>

</div>



<div class="line"></div>



<div class="step">

<div class="circle">
03
</div>

<h3>
Completed
</h3>

<p>
Funds transferred successfully.
</p>

</div>


</div>


</section>


</main>


</body>

</html>
