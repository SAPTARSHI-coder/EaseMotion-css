<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Floating Elevation Progress</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <div class="floating-progress-card">

        <h1>Project Progress</h1>

        <div class="progress-info">
            <span>Development</span>
            <span>82%</span>
        </div>

        <div
            class="progress-bar"
            role="progressbar"
            aria-label="Development Progress"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="82">

            <div class="progress-fill"></div>

        </div>

    </div>

</div>

</body>
</html>
