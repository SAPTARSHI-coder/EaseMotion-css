<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Brutalist Hero Banner Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body style="margin: 0; background-color: #f4f4f0;">

  <section class="hero-brutalist">
    <div class="hero-brutalist__container">
      <div class="hero-brutalist__content">
        <span class="hero-brutalist__badge">EaseMotion CSS Variant</span>
        <h1 class="hero-brutalist__title">RAW. BOLD.<br>NEOBRUTALISM.</h1>
        <p class="hero-brutalist__description">
          A fully responsive, pure CSS Hero Section component featuring hard edges, bold shadows, and fluid EaseMotion state transitions.
        </p>
        <div class="hero-brutalist__actions">
          <a href="#explore" class="hero-brutalist__btn hero-brutalist__btn--primary">Explore Components</a>
          <a href="#docs" class="hero-brutalist__btn hero-brutalist__btn--secondary">Read Guide</a>
        </div>
      </div>
      
      <div class="hero-brutalist__media">
        <div class="hero-brutalist__card">
          <span class="hero-brutalist__card-tag">NO JS</span>
          <div class="hero-brutalist__card-body">
            ⚡ PURE CSS MOTION
          </div>
        </div>
      </div>
    </div>
  </section>

</body>
</html>
