<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confetti Cannon · Confetti Shoots Out</title>
    <meta name="description" content="Interactive confetti cannon that shoots colorful confetti with realistic physics, particle effects, and celebration sounds.">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1 class="title">🎉 CONFETTI CANNON</h1>
        
        <div class="canvas-wrapper">
            <canvas id="confettiCanvas" width="600" height="500"></canvas>
            <div class="glow-overlay"></div>
        </div>

        <div class="controls">
            <div class="button-group">
                <button class="fire-btn" id="fireBtn">🎉 FIRE!</button>
                <button class="clear-btn" id="clearBtn">🗑️ CLEAR</button>
                <button class="reset-btn" id="resetBtn">⟳ RESET</button>
                <button class="toggle-btn" id="toggleBtn">⏸️ PAUSE</button>
            </div>
            <div class="speed-control">
                <label>Count</label>
                <input type="range" id="countSlider" min="20" max="150" value="80">
                <span id="countLabel">80</span>
                <label>Spread</label>
                <input type="range" id="spreadSlider" min="1" max="10" value="5">
                <span id="spreadLabel">5</span>
            </div>
        </div>

        <div class="info">
            <span>🎉 CONFETTI CANNON</span>
            <small>burst · color · celebration</small>
        </div>
        <div class="hint">
            <span>🎉 click to fire a burst of colorful confetti</span>
        </div>
    </div>

    <script>
        (function() {
            const canvas = document.getElementById('confettiCanvas');
            const ctx = canvas.getContext('2d');
            const W = 600, H = 500;
            
            const fireBtn = document.getElementById('fireBtn');
            const clearBtn = document.getElementById('clearBtn');
            const resetBtn = document.getElementById('resetBtn');
            const toggleBtn = document.getElementById('toggleBtn');
            const countSlider = document.getElementById('countSlider');
            const countLabel = document.getElementById('countLabel');
            const spreadSlider = document.getElementById('spreadSlider');
            const spreadLabel = document.getElementById('spreadLabel');

            let isAnimating = true;
            let time = 0;
            let confetti = [];
            let totalFired = 0;

            // ---- Confetti Colors ----
            const COLORS = [
                '#ff6b6b', '#feca57', '#48dbfb', '#1dd1a1',
                '#b026ff', '#ff6bcd', '#00d4ff', '#ff9f43',
                '#2ecc71', '#e74c3c', '#3498db', '#f1c40f',
                '#9b59b6', '#1abc9c', '#e67e22', '#ff1493',
                '#7cfc00', '#ff4500', '#00ffff', '#ff69b4'
            ];

            // ---- Confetti Particle ----
            class ConfettiParticle {
                constructor(x, y) {
                    this.x = x || W / 2;
                    this.y = y || H / 2;
                    this.size = 4 + Math.random() * 8;
                    this.width = this.size * (0.5 + Math.random() * 0.5);
                    this.height = this.size * (0.5 + Math.random() * 0.5);
                    this.color = COLORS[Math.floor(Math.random() * COLORS.length)];
                    this.rotation = Math.random() * Math.PI * 2;
                    this.rotationSpeed = (Math.random() - 0.5) * 0.2;
                    
                    // Velocity
                    const angle = -Math.PI / 2 + (Math.random() - 0.5) * Math.PI * 1.5;
                    const speed = 3 + Math.random() * 7;
                    this.vx = Math.cos(angle) * speed * (0.5 + Math.random() * 0.5);
                    this.vy = Math.sin(angle) * speed * (0.5 + Math.random() * 0.5) - 2;
                    
                    // Physics
                    this.gravity = 0.08 + Math.random() * 0.04;
                    this.drag = 0.99;
                    this.life = 1;
                    this.decay = 0.003 + Math.random() * 0.005;
                    this.friction = 0.98;
                    
                    // Shape: rectangle, circle, or triangle
                    const shapes = ['rect', 'circle', 'triangle'];
                    this.shape = shapes[Math.floor(Math.random() * shapes.length)];
                    
                    // Wobble
                    this.wobble = Math.random() * 0.05;
                    this.wobbleSpeed = 0.02 + Math.random() * 0.03;
                    this.wobblePhase = Math.random() * Math.PI * 2;
                }

                update() {
                    this.vx *= this.friction;
                    this.vy += this.gravity;
                    this.vx += Math.sin(this.wobblePhase) * this.wobble;
                    this.x += this.vx;
                    this.y += this.vy;
                    this.rotation += this.rotationSpeed;
                    this.life -= this.decay;
                    this.wobblePhase += this.wobbleSpeed;
                    
                    // Fade out
                    if (this.life < 0.3) {
                        this.size *= 0.98;
                    }
                }

                draw(ctx) {
                    if (this.life <= 0 || this.size < 0.5) return;
                    
                    ctx.save();
                    ctx.translate(this.x, this.y);
                    ctx.rotate(this.rotation);
                    ctx.globalAlpha = Math.min(1, this.life * 1.5);
                    
                    // Glow
                    ctx.shadowColor = this.color;
                    ctx.shadowBlur = 5 * this.life;
                    
                    ctx.fillStyle = this.color;
                    
                    switch(this.shape) {
                        case 'rect':
                            ctx.fillRect(-this.width/2, -this.height/2, this.width, this.height);
                            break;
                        case 'circle':
                            ctx.beginPath();
                            ctx.arc(0, 0, this.size/2, 0, Math.PI * 2);
                            ctx.fill();
                            break;
                        case 'triangle':
                            ctx.beginPath();
                            ctx.moveTo(0, -this.size/2);
                            ctx.lineTo(this.size/2, this.size/2);
                            ctx.lineTo(-this.size/2, this.size/2);
                            ctx.closePath();
                            ctx.fill();
                            break;
                    }
                    
                    // Highlight
                    if (this.life > 0.5) {
                        ctx.shadowBlur = 0;
                        ctx.fillStyle = 'rgba(255,255,255,0.15)';
                        ctx.fillRect(-this.width/4, -this.height/4, this.width/2, 1);
                    }
                    
                    ctx.restore();
                }

                isAlive() {
                    return this.life > 0 && this.y < H + 50 && this.x > -50 && this.x < W + 50;
                }
            }

            // ---- Fire Confetti ----
            function fireConfetti() {
                const count = parseInt(countSlider.value);
                const spread = parseInt(spreadSlider.value) / 5;
                const cx = W / 2;
                const cy = H / 2;
                
                for (let i = 0; i < count; i++) {
                    const angle = -Math.PI / 2 + (Math.random() - 0.5) * Math.PI * spread;
                    const speed = 3 + Math.random() * 7 * (0.8 + spread * 0.2);
                    const p = new ConfettiParticle(
                        cx + (Math.random() - 0.5) * 20,
                        cy + (Math.random() - 0.5) * 20
                    );
                    p.vx = Math.cos(angle) * speed * (0.5 + Math.random() * 0.5);
                    p.vy = Math.sin(angle) * speed * (0.5 + Math.random() * 0.5) - 2;
                    p.gravity = 0.08 + Math.random() * 0.04;
                    p.decay = 0.002 + Math.random() * 0.006;
                    confetti.push(p);
                    totalFired++;
                }
                
                // Play sound
                playConfettiSound();
            }

            // ---- Play Confetti Sound ----
            function playConfettiSound() {
                try {
                    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    const now = audioCtx.currentTime;
                    
                    // Short burst of noise
                    const bufferSize = audioCtx.sampleRate * 0.1;
                    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                    const data = buffer.getChannelData(0);
                    for (let i = 0; i < bufferSize; i++) {
                        data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.3));
                    }
                    const noise = audioCtx.createBufferSource();
                    noise.buffer = buffer;
                    const gain = audioCtx.createGain();
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
                    noise.connect(gain);
                    gain.connect(audioCtx.destination);
                    noise.start(now);
                    noise.stop(now + 0.1);
                    
                    // High frequency sparkle
                    for (let i = 0; i < 5; i++) {
                        const osc = audioCtx.createOscillator();
                        const g = audioCtx.createGain();
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(600 + Math.random() * 800, now + i * 0.02);
                        g.gain.setValueAtTime(0.03, now + i * 0.02);
                        g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.02 + 0.04);
                        osc.connect(g);
                        g.connect(audioCtx.destination);
                        osc.start(now + i * 0.02);
                        osc.stop(now + i * 0.02 + 0.04);
                    }
                } catch (e) {
                    // Silent fail
                }
            }

            // ---- Clear ----
            function clearConfetti() {
                confetti = [];
            }

            // ---- Reset ----
            function resetConfetti() {
                confetti = [];
                totalFired = 0;
                time = 0;
            }

            // ---- Render ----
            function render() {
                // Background
                const grad = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, W);
                grad.addColorStop(0, '#0d1a2a');
                grad.addColorStop(0.3, '#0a1520');
                grad.addColorStop(0.6, '#080e18');
                grad.addColorStop(0.8, '#060a12');
                grad.addColorStop(1, '#040608');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, W, H);
                
                // Draw confetti
                for (let p of confetti) {
                    p.draw(ctx);
                }
                
                // Status info
                ctx.save();
                ctx.shadowBlur = 0;
                ctx.fillStyle = 'rgba(200, 220, 240, 0.15)';
                ctx.font = '13px monospace';
                ctx.textAlign = 'right';
                ctx.textBaseline = 'bottom';
                ctx.fillText(`Pieces: ${confetti.length}`, W - 20, H - 10);
                
                ctx.textAlign = 'left';
                ctx.fillText(`Total: ${totalFired}`, 20, H - 10);
                ctx.restore();
            }

            // ---- Animation Loop ----
            function animate() {
                if (!isAnimating) {
                    requestAnimationFrame(animate);
                    return;
                }
                
                time += 0.01;
                
                // Update confetti
                confetti = confetti.filter(p => p.isAlive());
                for (let p of confetti) {
                    p.update();
                }
                
                // Limit confetti
                if (confetti.length > 1000) {
                    confetti.splice(0, confetti.length - 1000);
                }
                
                render();
                
                requestAnimationFrame(animate);
            }

            // ---- Toggle Animation ----
            function toggleAnimation() {
                isAnimating = !isAnimating;
                toggleBtn.textContent = isAnimating ? '⏸️ PAUSE' : '▶️ PLAY';
            }

            // ---- Update Labels ----
            countSlider.addEventListener('input', function() {
                countLabel.textContent = this.value;
            });
            spreadSlider.addEventListener('input', function() {
                spreadLabel.textContent = this.value;
            });

            // ---- Event Listeners ----
            fireBtn.addEventListener('click', fireConfetti);
            clearBtn.addEventListener('click', clearConfetti);
            resetBtn.addEventListener('click', resetConfetti);
            toggleBtn.addEventListener('click', toggleAnimation);

            // ---- Keyboard Shortcuts ----
            document.addEventListener('keydown', function(e) {
                if (e.key === ' ' || e.key === 'Space') {
                    e.preventDefault();
                    fireConfetti();
                }
                if (e.key === 'c' || e.key === 'C') {
                    clearConfetti();
                }
                if (e.key === 'r' || e.key === 'R') {
                    resetConfetti();
                }
                if (e.key === 'p' || e.key === 'P') {
                    toggleAnimation();
                }
            });

            // ---- Click on canvas to fire ----
            canvas.addEventListener('click', function(e) {
                fireConfetti();
            });

            // ---- Initialize ----
            render();
            animate();

            console.log('🎉 Confetti Cannon · Click Fire or press Space to shoot confetti!');
        })();
    </script>
</body>
</html>
