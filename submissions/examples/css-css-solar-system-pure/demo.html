<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Solar System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="layout-container">
        
        <header class="section-header">
            <h1 class="title">Simplified Solar System</h1>
            <p class="subtitle">A pure CSS demonstration of orbital mechanics using nested rotations and counter-rotations to keep planetary bodies upright as they revolve.</p>
        </header>

        <div class="demo-area">
            
            <!-- 
              [TECHNIQUE] Nested Orbital System
              Each planet has its own orbit container.
              We rotate the container, and then counter-rotate the planet inside it 
              so the planet doesn't appear to spin upside down.
            -->
            <div class="solar-system" aria-label="An animated solar system with the Sun and 3 orbiting planets">
                
                <div class="sun"></div>
                
                <!-- Inner Planet (Mercury equivalent) -->
                <div class="orbit orbit-inner">
                    <div class="planet planet-inner" aria-label="Inner Planet"></div>
                </div>
                
                <!-- Middle Planet (Earth equivalent with a moon) -->
                <div class="orbit orbit-middle">
                    <!-- The planet itself acts as a hub for its moon's orbit -->
                    <div class="planet planet-middle" aria-label="Middle Planet">
                        <!-- Moon orbit container -->
                        <div class="orbit orbit-moon">
                            <div class="moon" aria-label="Moon"></div>
                        </div>
                    </div>
                </div>
                
                <!-- Outer Planet (Mars equivalent) -->
                <div class="orbit orbit-outer">
                    <div class="planet planet-outer" aria-label="Outer Planet"></div>
                </div>
                
            </div>
            
        </div>
        
    </div>

</body>
</html>
