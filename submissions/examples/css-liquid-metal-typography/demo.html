<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Liquid Metal Typography Demo</title>
<link rel="stylesheet" href="style.css">
<style>
  body {
    font-family: sans-serif;
    max-width: 700px;
    margin: 3rem auto;
    background: #0a0a0a;
    padding: 1rem;
  }
  .demo-block { margin-bottom: 3rem; }
  p.label { color: #888; font-size: 0.85rem; margin-bottom: 0.5rem; }
</style>
</head>
<body>

  <div class="demo-block">
    <p class="label">Default — Silver Metal</p>
    <h1 class="ease-text-liquid-metal">LIQUID METAL</h1>
  </div>

  <div class="demo-block">
    <p class="label">Slow Sweep</p>
    <h1 class="ease-text-liquid-metal ease-text-liquid-metal-slow">SMOOTH FLOW</h1>
  </div>

  <div class="demo-block">
    <p class="label">Gold Variant</p>
    <h1 class="ease-text-liquid-metal ease-text-liquid-metal-gold">GOLDEN</h1>
  </div>

  <div class="demo-block">
    <p class="label">Rose Variant</p>
    <h1 class="ease-text-liquid-metal ease-text-liquid-metal-rose">ROSE GLOW</h1>
  </div>

</body>
</html>
