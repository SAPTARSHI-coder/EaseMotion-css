<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elastic-Slide Portfolio Drawer - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="demo-stage">
    <header class="head">
      <h1>Elastic-Slide Drawer (<code>#54517</code>)</h1>
      <button class="elastic-trigger" onclick="document.getElementById('drawer-elastic').classList.add('open')">☰ Launch Elastic Drawer</button>
    </header>
    <p class="desc">Click the trigger button to spring out the side portfolio panel with lively, satisfying elastic bounce physics.</p>
    
    <div id="drawer-elastic" class="ease-drawer-portal">
      <div class="backdrop" onclick="document.getElementById('drawer-elastic').classList.remove('open')"></div>
      <aside class="ease-drawer-elastic">
        <div class="top">
          <h3>⚡ Creative Agency</h3>
          <button class="close-btn" onclick="document.getElementById('drawer-elastic').classList.remove('open')">×</button>
        </div>
        <nav class="nav-list">
          <a href="#">🏆 Exhibition Works</a>
          <a href="#">🚀 Houdini 3D Engine</a>
          <a href="#">🛡️ Automated Test CI</a>
          <a href="#">✉️ Connect & Inquiry</a>
        </nav>
      </aside>
    </div>
  </div>
</body>
</html>
