<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-chart-bar-graph demo</title>
</head>
<body>
<div class="cbt-chart">
  <div class="cbt-columns">
    <div class="cbt-col"><i class="cbt-bar"></i><b class="cbt-val">12</b><span class="cbt-lab">MON</span></div>
    <div class="cbt-col"><i class="cbt-bar"></i><b class="cbt-val">19</b><span class="cbt-lab">TUE</span></div>
    <div class="cbt-col"><i class="cbt-bar"></i><b class="cbt-val">8</b><span class="cbt-lab">WED</span></div>
    <div class="cbt-col"><i class="cbt-bar"></i><b class="cbt-val">26</b><span class="cbt-lab">THU</span></div>
    <div class="cbt-col"><i class="cbt-bar"></i><b class="cbt-val">15</b><span class="cbt-lab">FRI</span></div>
  </div>
  <div class="cbt-sum"><span class="cbt-title">WEEKLY VISITS</span><b class="cbt-total">80</b></div>
</div>
</body>
</html>
