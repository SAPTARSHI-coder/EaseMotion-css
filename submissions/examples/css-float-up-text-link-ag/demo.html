<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Float Up Text Link</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <!-- Variant 1: Simple Elevation Float -->
  <div>
    <a href="#" class="float-up-link" aria-label="Explore Simple Float Link">
      Float Up Link
    </a>
  </div>

  <!-- Variant 2: Roll Up Replacement Float -->
  <div>
    <a href="#" class="roll-up-link" aria-label="Explore Roll Up Link">
      <span class="link-text" data-text="Roll Up Link">Roll Up Link</span>
    </a>
  </div>

</body>
</html>
