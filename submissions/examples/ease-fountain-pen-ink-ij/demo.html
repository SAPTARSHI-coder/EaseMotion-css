<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fountain Pen Ink Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="writing-pad" aria-label="pen writing">
    <div class="paper" aria-hidden="true">
      <span class="ink-line" id="inkLine"></span>
      <span class="ink-drop" id="inkDrop"></span>
    </div>
    <div class="pen" id="pen" aria-hidden="true"></div>
    <button class="write-btn" id="writeBtn" type="button">Write</button>
    <p class="caption">A nib traces a line and drops a dot of ink.</p>
  </main>
  <script>
    const pad = document.getElementById("pen");
    const line = document.getElementById("inkLine");
    const drop = document.getElementById("inkDrop");
    const btn = document.getElementById("writeBtn");
    function write() {
      pad.classList.remove("writing");
      line.classList.remove("draw");
      drop.classList.remove("fall");
      void pad.offsetWidth;
      pad.classList.add("writing");
      line.classList.add("draw");
      drop.classList.add("fall");
    }
    btn.addEventListener("click", write);
  </script>
</body>
</html>
