<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CSS sticky memo note with folded corner.">
  <title>CSS Sticky Memo Note</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="note-wrap">
    <article class="memo" aria-labelledby="memo-title">
      <span class="pin" aria-hidden="true"></span>

      <span class="label">Reminder</span>

      <h1 id="memo-title">Don't forget to ship!</h1>

      <p>
        Finish the final review, test the responsive states,
        and submit the component before Friday.
      </p>

      <footer class="memo-footer">
        <span>— Team notes</span>
        <span aria-hidden="true">★</span>
      </footer>
    </article>
  </main>

</body>
</html>
