<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Shimmer-Sweep Card Grid Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="checkout-bg-sap">

  <div class="checkout-container-sap">
    <h2 class="checkout-title-sap">SELECT PAYMENT METHOD</h2>
    <p class="checkout-subtitle-sap">Choose your preferred payment option to complete order</p>

    <div class="card-grid-sap">

      <label for="pay-card" class="card-item-sap">
        <input type="radio" name="payment-method" id="pay-card" class="card-input-sap" checked>
        <div class="card-content-sap">
          <div class="shimmer-layer-sap"></div>
          <div class="card-header-sap">
            <span class="card-badge-sap">POPULAR</span>
            <span class="card-radio-indicator-sap"></span>
          </div>
          <div class="card-body-sap">
            <h3 class="card-name-sap">Credit / Debit Card</h3>
            <p class="card-desc-sap">Instant processing via Visa, Mastercard, or Amex</p>
          </div>
        </div>
      </label>

      <label for="pay-upi" class="card-item-sap">
        <input type="radio" name="payment-method" id="pay-upi" class="card-input-sap">
        <div class="card-content-sap">
          <div class="shimmer-layer-sap"></div>
          <div class="card-header-sap">
            <span class="card-badge-sap">INSTANT</span>
            <span class="card-radio-indicator-sap"></span>
          </div>
          <div class="card-body-sap">
            <h3 class="card-name-sap">UPI Payment</h3>
            <p class="card-desc-sap">Pay instantly via Google Pay, PhonePe, Paytm, or BHIM</p>
          </div>
        </div>
      </label>

      <label for="pay-later" class="card-item-sap">
        <input type="radio" name="payment-method" id="pay-later" class="card-input-sap">
        <div class="card-content-sap">
          <div class="shimmer-layer-sap"></div>
          <div class="card-header-sap">
            <span class="card-badge-sap">FLEXIBLE</span>
            <span class="card-radio-indicator-sap"></span>
          </div>
          <div class="card-body-sap">
            <h3 class="card-name-sap">Pay in 4 Installments</h3>
            <p class="card-desc-sap">Split total into 4 interest-free payments</p>
          </div>
        </div>
      </label>

    </div>

    <button type="button" class="checkout-btn-sap">PROCEED TO PAY</button>
  </div>

</body>
</html>
