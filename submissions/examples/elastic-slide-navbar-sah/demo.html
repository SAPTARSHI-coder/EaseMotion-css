<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elastic-Slide Accessible Navbar - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="stage">
    <header class="head">
      <h1>Elastic-Slide Navbar (<code>#54292</code>)</h1>
      <p>A tactile accessible WAI-ARIA navigation header featuring energetic spring-damped tab expansion indicators and responsive hover rebounds.</p>
    </header>
    
    <nav class="ease-nav-elastic-slide" aria-label="Spring Navigation">
      <div class="e-brand"><span>⚡ Studio Elastic</span></div>
      <ul class="e-links" role="menubar">
        <li role="none"><a href="#" class="e-tab act-spring" role="menuitem" aria-current="page" onclick="setActiveTab(this)"><span>✦ 144 PRs Merged</span></a></li>
        <li role="none"><a href="#" class="e-tab" role="menuitem" onclick="setActiveTab(this)"><span>Spatial 60.0 FPS</span></a></li>
        <li role="none"><a href="#" class="e-tab" role="menuitem" onclick="setActiveTab(this)"><span>AAA Accessibility</span></a></li>
        <li role="none"><a href="#" class="e-tab" role="menuitem" onclick="setActiveTab(this)"><span>Automation Loop</span></a></li>
      </ul>
      <button class="btn-spring" aria-label="Connect AI">✦ Connect Matrix</button>
    </nav>
  </div>

  <script>
    function setActiveTab(el) {
      document.querySelectorAll('.e-tab').forEach(t => t.classList.remove('act-spring'));
      el.classList.add('act-spring');
    }
  </script>
</body>
</html>
