<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ease Copy Chip</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="wrapper">

    <div class="copy-chip">

        <span id="copyText">
            API-7X92-QW81
        </span>

        <button id="copyBtn">
            Copy
        </button>

    </div>

</div>

<script>

const btn = document.getElementById("copyBtn");
const text = document.getElementById("copyText");

btn.addEventListener("click", async () => {

    try{

        await navigator.clipboard.writeText(text.innerText);

        btn.innerText = "Copied ✓";

        btn.classList.add("copied","ease-fade-in");

        setTimeout(()=>{

            btn.innerText = "Copy";

            btn.classList.remove("copied","ease-fade-in");

        },1800);

    }

    catch{

        btn.innerText = "Failed";

    }

});

</script>

</body>
</html>
