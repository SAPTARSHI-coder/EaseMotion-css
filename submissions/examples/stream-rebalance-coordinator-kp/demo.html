<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stream Rebalance Coordinator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="rebalance-shell" aria-labelledby="rebalance-title">
    <section class="rebalance-board">
      <p class="eyebrow">Consumer group control</p>
      <h1 id="rebalance-title">Stream Rebalance Coordinator</h1>
      <p class="summary">Partitions pause, revoke, and reassign in waves before the group resumes stable processing.</p>
      <div class="rebalance-stage" role="img" aria-label="Animated stream rebalance coordinator visualization">
        <div class="partition-lanes"><span></span><span></span><span></span><span></span></div>
        <div class="coordinator"><i></i><i></i><strong>coordinator</strong></div>
        <div class="assignment"><b></b><b></b><em>assign</em></div>
        <div class="resume-flow"><small>resumed</small><span></span><span></span></div>
      </div>
      <div class="readouts"><span>members 6</span><span>revoked 2</span><span>assigned 12</span></div>
    </section>
  </main>
</body>
</html>
