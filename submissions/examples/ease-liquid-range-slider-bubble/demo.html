<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ease Liquid Range Slider Bubble</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bubble-slider-body">
  <div class="slider-box">
    <div class="bubble" id="bVal">50</div>
    <input type="range" min="0" max="100" value="50" id="rInput" class="range-inp" />
  </div>

  <script>
    const r = document.getElementById('rInput');
    const b = document.getElementById('bVal');
    r.addEventListener('input', () => { b.textContent = r.value; });
  </script>
</body>
</html>
