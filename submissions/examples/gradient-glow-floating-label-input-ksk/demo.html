<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gradient Glow Floating Label Input - EaseMotion CSS</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="glow-input-container">
      <header class="glow-header">
        <h1 class="glow-title">Gradient Glow Input</h1>
        <p class="glow-subtitle">
          Issue #81517 / #39036 — Animated Gradient Ambient Border Glow
        </p>
      </header>

      <div class="glow-field">
        <input
          type="text"
          id="project-title"
          class="glow-input"
          placeholder=" "
          autocomplete="off"
        />
        <label for="project-title" class="glow-label">Project Title</label>
      </div>

      <div class="glow-field">
        <input
          type="email"
          id="user-email"
          class="glow-input"
          placeholder=" "
          autocomplete="off"
        />
        <label for="user-email" class="glow-label">Contact Email</label>
      </div>
    </main>
  </body>
</html>
