<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Accessible CSS job listing card">
  <title>CSS Job Listing Card</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <article class="job-card">
      <div class="job-header">
        <div class="company-logo" aria-hidden="true">N</div>

        <div class="company-info">
          <h2>NovaTech</h2>
          <p>Bengaluru, India · Remote</p>
        </div>

        <span class="job-type">Full-time</span>
      </div>

      <div class="job-content">
        <span class="category">Engineering</span>

        <h1>Frontend Developer</h1>

        <p class="description">
          Build responsive, accessible interfaces and create polished
          user experiences with modern web technologies.
        </p>

        <ul class="tags" aria-label="Required skills">
          <li>HTML</li>
          <li>CSS</li>
          <li>JavaScript</li>
          <li>React</li>
        </ul>
      </div>

      <div class="job-footer">
        <div class="salary">
          <strong>₹8–14 LPA</strong>
          <span> · 2+ years experience</span>
        </div>

        <a
          class="apply-btn"
          href="#apply"
          aria-label="Apply for Frontend Developer at NovaTech"
        >
          Apply now <span aria-hidden="true">→</span>
        </a>
      </div>
    </article>
  </main>
</body>
</html>
