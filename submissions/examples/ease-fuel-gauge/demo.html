<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fuel Gauge – Fills Up Like a Gas Tank</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrapper">
    <h1>⛽ Fuel Gauge</h1>
    <p class="subtitle">Fill up like a gas tank — click, drag, or use the buttons</p>

    <div class="gauge-container">
      <!-- Fuel gauge tank -->
      <div class="tank">
        <div class="tank-body">
          <div class="fuel-fill" id="fuelFill"></div>
          <div class="fuel-surface" id="fuelSurface"></div>
        </div>
        <div class="tank-cap"></div>
        <div class="tank-nozzle"></div>
      </div>

      <!-- Fuel level display -->
      <div class="fuel-display">
        <span class="fuel-percentage" id="fuelPercentage">0%</span>
        <span class="fuel-label">FUEL</span>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <button id="fillBtn" class="ctrl-btn fill">⛽ Fill Up</button>
      <button id="emptyBtn" class="ctrl-btn empty">🪣 Empty</button>
      <button id="halfBtn" class="ctrl-btn half">½ Half</button>
      <button id="randomBtn" class="ctrl-btn random">🎲 Random</button>
    </div>

    <!-- Interactive slider -->
    <div class="slider-container">
      <span class="slider-label">Drag to adjust fuel</span>
      <input type="range" id="fuelSlider" min="0" max="100" value="0" class="fuel-slider">
    </div>

    <!-- Status -->
    <div class="status" id="status">🔄 Click a button or drag the slider</div>

    <!-- Fuel history / animation -->
    <div class="fuel-history">
      <div class="history-bar" id="historyBar"></div>
    </div>
  </div>

  <script>
    (function() {
      "use strict";

      // DOM elements
      const fuelFill = document.getElementById('fuelFill');
      const fuelSurface = document.getElementById('fuelSurface');
      const fuelPercentage = document.getElementById('fuelPercentage');
      const status = document.getElementById('status');
      const fuelSlider = document.getElementById('fuelSlider');
      const historyBar = document.getElementById('historyBar');

      // Buttons
      const fillBtn = document.getElementById('fillBtn');
      const emptyBtn = document.getElementById('emptyBtn');
      const halfBtn = document.getElementById('halfBtn');
      const randomBtn = document.getElementById('randomBtn');

      // State
      let currentFuel = 0;          // 0-100
      let targetFuel = 0;
      let isAnimating = false;
      let animationId = null;
      let history = [];             // store last 20 fuel levels
      let historyIndex = 0;

      // ----- Helper: update UI -----
      function updateUI(fuelLevel, instant = false) {
        const clamped = Math.min(100, Math.max(0, fuelLevel));
        currentFuel = clamped;
        targetFuel = clamped;

        // Update fill height
        fuelFill.style.height = clamped + '%';
        fuelFill.style.transition = instant ? 'none' : 'height 0.6s cubic-bezier(0.34, 1.56, 0.64, 1)';

        // Update surface wave effect
        const waveOffset = clamped < 5 ? -20 : (clamped > 95 ? 20 : 0);
        fuelSurface.style.transform = `translateX(${waveOffset}px)`;

        // Update percentage text with animation
        fuelPercentage.textContent = Math.round(clamped) + '%';
        fuelPercentage.style.transform = 'scale(1.2)';
        setTimeout(() => {
          fuelPercentage.style.transform = 'scale(1)';
        }, 150);

        // Update slider
        fuelSlider.value = clamped;

        // Update status
        if (clamped === 0) {
          status.textContent = '🪣 Tank is empty! Time to refuel.';
        } else if (clamped === 100) {
          status.textContent = '⛽ Tank is full! Ready to go!';
        } else if (clamped < 25) {
          status.textContent = `⚠️ Low fuel: ${Math.round(clamped)}% — better fill up soon!`;
        } else if (clamped < 50) {
          status.textContent = `⛽ Fuel level: ${Math.round(clamped)}% — getting there.`;
        } else if (clamped < 75) {
          status.textContent = `⛽ Fuel level: ${Math.round(clamped)}% — looking good!`;
        } else {
          status.textContent = `⛽ Fuel level: ${Math.round(clamped)}% — almost full!`;
        }

        // Add to history
        addHistory(clamped);
      }

      // ----- History tracking -----
      function addHistory(value) {
        history.push(Math.round(value));
        if (history.length > 20) history.shift();
        renderHistory();
      }

      function renderHistory() {
        if (history.length === 0) {
          historyBar.innerHTML = '<span style="color: #6b7a9f; font-size: 0.8rem;">No history yet</span>';
          return;
        }
        historyBar.innerHTML = '';
        history.forEach((val, idx) => {
          const dot = document.createElement('div');
          dot.className = 'history-dot';
          const intensity = val / 100;
          const hue = 120 * intensity; // green to yellow to red
          dot.style.background = `hsl(${hue}, 80%, ${40 + intensity * 30}%)`;
          dot.style.height = (10 + val * 0.5) + 'px';
          dot.title = `${val}%`;
          historyBar.appendChild(dot);
        });
        // Scroll to end
        historyBar.scrollLeft = historyBar.scrollWidth;
      }

      // ----- Animate to target fuel level (smooth transition) -----
      function animateToFuel(target, duration = 800) {
        if (isAnimating) {
          cancelAnimationFrame(animationId);
          isAnimating = false;
        }

        target = Math.min(100, Math.max(0, target));
        targetFuel = target;

        const startFuel = currentFuel;
        const startTime = performance.now();

        isAnimating = true;

        function step(time) {
          const elapsed = time - startTime;
          const progress = Math.min(elapsed / duration, 1);

          // EaseOutElastic for playful bounce
          const eased = 1 - Math.pow(1 - progress, 3) * Math.cos(progress * Math.PI * 0.3);
          const current = startFuel + (target - startFuel) * eased;

          // Update fill
          fuelFill.style.height = current + '%';
          fuelFill.style.transition = 'none';

          // Update percentage
          fuelPercentage.textContent = Math.round(current) + '%';

          // Update slider
          fuelSlider.value = current;

          // Surface wave effect
          const waveOffset = current < 5 ? -20 : (current > 95 ? 20 : 0);
          fuelSurface.style.transform = `translateX(${waveOffset}px)`;

          if (progress < 1) {
            animationId = requestAnimationFrame(step);
          } else {
            // Finalize
            currentFuel = target;
            fuelFill.style.height = target + '%';
            fuelFill.style.transition = 'height 0.6s cubic-bezier(0.34, 1.56, 0.64, 1)';
            fuelPercentage.textContent = Math.round(target) + '%';
            fuelSlider.value = target;
            isAnimating = false;

            // Update status
            updateUI(target);
            // Add to history (already added in updateUI, but we call it again to ensure)
            addHistory(target);
          }
        }

        animationId = requestAnimationFrame(step);
      }

      // ----- Quick set (with animation) -----
      function setFuel(level, instant = false) {
        const clamped = Math.min(100, Math.max(0, level));
        if (instant) {
          currentFuel = clamped;
          targetFuel = clamped;
          fuelFill.style.height = clamped + '%';
          fuelFill.style.transition = 'none';
          fuelPercentage.textContent = Math.round(clamped) + '%';
          fuelSlider.value = clamped;
          updateUI(clamped);
          addHistory(clamped);
        } else {
          animateToFuel(clamped);
        }
      }

      // ----- Fill up (with fun animation) -----
      function fillUp() {
        // Simulate filling with multiple steps
        const start = currentFuel;
        const steps = 8;
        let step = 0;

        function doStep() {
          if (step >= steps) {
            setFuel(100);
            return;
          }
          const progress = (step + 1) / steps;
          const eased = 1 - Math.pow(1 - progress, 2);
          const level = start + (100 - start) * eased;
          fuelFill.style.height = level + '%';
          fuelPercentage.textContent = Math.round(level) + '%';
          fuelSlider.value = level;
          step++;
          setTimeout(doStep, 60 + Math.random() * 40);
        }
        doStep();
        status.textContent = '⛽ Filling up...';
        setTimeout(() => {
          updateUI(100);
          addHistory(100);
        }, steps * 80 + 100);
      }

      // ----- Empty (drain animation) -----
      function emptyTank() {
        const start = currentFuel;
        const steps = 6;
        let step = 0;

        function doStep() {
          if (step >= steps) {
            setFuel(0);
            return;
          }
          const progress = (step + 1) / steps;
          const eased = 1 - Math.pow(1 - progress, 2);
          const level = start - start * eased;
          fuelFill.style.height = level + '%';
          fuelPercentage.textContent = Math.round(level) + '%';
          fuelSlider.value = level;
          step++;
          setTimeout(doStep, 70 + Math.random() * 30);
        }
        doStep();
        status.textContent = '🪣 Draining fuel...';
        setTimeout(() => {
          updateUI(0);
          addHistory(0);
        }, steps * 80 + 100);
      }

      // ----- Half tank -----
      function halfTank() {
        setFuel(50);
        status.textContent = '½ Tank is half full!';
      }

      // ----- Random fuel -----
      function randomFuel() {
        const random = Math.floor(Math.random() * 101);
        setFuel(random);
        status.textContent = `🎲 Random fuel: ${random}%`;
      }

      // ----- Slider interaction -----
      function handleSlider(e) {
        const value = parseFloat(e.target.value);
        if (isAnimating) {
          cancelAnimationFrame(animationId);
          isAnimating = false;
        }
        // Update immediately but smoothly
        fuelFill.style.height = value + '%';
        fuelFill.style.transition = 'height 0.15s ease-out';
        fuelPercentage.textContent = Math.round(value) + '%';
        currentFuel = value;
        targetFuel = value;
        // Surface wave
        const waveOffset = value < 5 ? -20 : (value > 95 ? 20 : 0);
        fuelSurface.style.transform = `translateX(${waveOffset}px)`;
        // Update status
        updateUI(value);
        addHistory(value);
      }

      // ----- Init -----
      function init() {
        // Set initial fuel to 0
        setFuel(0, true);
        addHistory(0);

        // Button events
        fillBtn.addEventListener('click', fillUp);
        emptyBtn.addEventListener('click', emptyTank);
        halfBtn.addEventListener('click', halfTank);
        randomBtn.addEventListener('click', randomFuel);

        // Slider event
        fuelSlider.addEventListener('input', handleSlider);

        // Double-click on tank to fill
        document.querySelector('.tank-body').addEventListener('dblclick', fillUp);

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
          if (e.key === 'f' || e.key === 'F') fillUp();
          if (e.key === 'e' || e.key === 'E') emptyTank();
          if (e.key === 'h' || e.key === 'H') halfTank();
          if (e.key === 'r' || e.key === 'R') randomFuel();
        });

        // Initial status
        status.textContent = '🔄 Click a button, drag the slider, or use keyboard (F, E, H, R)';
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }

    })();
  </script>
</body>
</html>
