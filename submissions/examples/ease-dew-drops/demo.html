<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dew Drops – Water Droplets Form and Slide</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <h1>💧 Dew Drops</h1>
    <p class="subtitle">Water droplets form and slide</p>

    <div class="dew-container">
      <div class="dew-stage" id="dewStage">
        <canvas id="canvas"></canvas>
        
        <!-- Info overlay -->
        <div class="info-overlay">
          <span class="dew-status" id="dewStatus">💧 Forming</span>
          <span class="drop-count" id="dropCount">✦ 0 drops</span>
        </div>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <button class="ctrl-btn drop" id="dropBtn">💧 Drop</button>
      <button class="ctrl-btn clear" id="clearBtn">🗑️ Clear</button>
      <button class="ctrl-btn toggle" id="toggleBtn">⏸ Pause</button>
      <button class="ctrl-btn reset" id="resetBtn">↺ Reset</button>
    </div>

    <!-- Sliders -->
    <div class="slider-container">
      <span class="slider-label">Drop Size</span>
      <input type="range" id="sizeSlider" min="5" max="30" value="15" />
      <span class="slider-value" id="sizeValue">15px</span>
    </div>

    <div class="slider-container">
      <span class="slider-label">Slide Speed</span>
      <input type="range" id="speedSlider" min="1" max="10" value="5" />
      <span class="slider-value" id="speedValue">5×</span>
    </div>

    <div class="slider-container">
      <span class="slider-label">Formation Rate</span>
      <input type="range" id="rateSlider" min="1" max="10" value="5" />
      <span class="slider-value" id="rateValue">5×</span>
    </div>

    <!-- Status -->
    <div class="status" id="status">💧 Dew drops forming on the surface</div>

    <!-- Keyboard shortcuts -->
    <div class="shortcuts">
      <kbd>D</kbd> Drop · <kbd>C</kbd> Clear · <kbd>Space</kbd> Pause · <kbd>R</kbd> Reset
    </div>
  </div>

  <script>
    (function() {
      "use strict";

      // DOM elements
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      const dewStatus = document.getElementById('dewStatus');
      const dropCount = document.getElementById('dropCount');
      const dropBtn = document.getElementById('dropBtn');
      const clearBtn = document.getElementById('clearBtn');
      const toggleBtn = document.getElementById('toggleBtn');
      const resetBtn = document.getElementById('resetBtn');
      const status = document.getElementById('status');
      const sizeSlider = document.getElementById('sizeSlider');
      const sizeValue = document.getElementById('sizeValue');
      const speedSlider = document.getElementById('speedSlider');
      const speedValue = document.getElementById('speedValue');
      const rateSlider = document.getElementById('rateSlider');
      const rateValue = document.getElementById('rateValue');

      // State
      let drops = [];
      let isPaused = false;
      let animationId = null;
      let time = 0;
      let formationTimer = 0;

      // ----- Canvas setup -----
      function setupCanvas() {
        const rect = canvas.parentElement.getBoundingClientRect();
        const size = Math.min(rect.width - 40, 600);
        canvas.width = size;
        canvas.height = size;
        canvas.style.width = size + 'px';
        canvas.style.height = size + 'px';
      }

      // ----- Drop class -----
      class Drop {
        constructor(x, y, size) {
          this.x = x || 20 + Math.random() * (canvas.width - 40);
          this.y = y || 20 + Math.random() * (canvas.height * 0.6);
          this.size = size || parseInt(sizeSlider.value) * (0.5 + Math.random() * 0.8);
          this.targetY = canvas.height - 20 - Math.random() * 20;
          this.speed = 0.3 + Math.random() * 0.7 * (parseInt(speedSlider.value) / 5);
          this.opacity = 0;
          this.alive = true;
          this.slideX = 0;
          this.slideSpeed = (Math.random() - 0.5) * 0.3;
          this.wobble = 0;
          this.wobbleSpeed = 0.02 + Math.random() * 0.03;
          this.wobbleAmount = 0.5 + Math.random() * 1.5;
          this.phase = Math.random() * Math.PI * 2;
          this.trail = [];
          this.trailLength = 5 + Math.floor(Math.random() * 10);
          this.highlight = 0.3 + Math.random() * 0.4;
          this.glowSize = this.size * 2;
        }

        update() {
          // Fade in
          if (this.opacity < 1) {
            this.opacity += 0.02;
          }

          // Slide down with wobble
          this.wobble += this.wobbleSpeed;
          const wobbleOffset = Math.sin(this.wobble + this.phase) * this.wobbleAmount;
          
          this.y += this.speed * 0.3;
          this.x += this.slideX + wobbleOffset * 0.05;

          // Random slide movement
          this.slideX += (Math.random() - 0.5) * 0.02;

          // Update trail
          this.trail.push({ x: this.x, y: this.y });
          if (this.trail.length > this.trailLength) {
            this.trail.shift();
          }

          // Check if reached bottom
          if (this.y >= this.targetY) {
            this.y = this.targetY;
            this.speed *= 0.99;
            if (this.speed < 0.01) {
              this.alive = false;
            }
          }

          // Keep within bounds
          const padding = 10;
          if (this.x < padding) { this.x = padding; this.slideX = Math.abs(this.slideX); }
          if (this.x > canvas.width - padding) { this.x = canvas.width - padding; this.slideX = -Math.abs(this.slideX); }
        }

        draw(ctx) {
          if (this.opacity < 0.01) return;

          const alpha = this.opacity * 0.8;
          const size = this.size * (0.5 + 0.5 * (1 - (this.y / this.targetY) * 0.3));

          // Draw trail
          if (this.trail.length > 1) {
            for (let i = 0; i < this.trail.length - 1; i++) {
              const t = i / this.trail.length;
              const trailAlpha = alpha * t * 0.2;
              const trailSize = size * t * 0.2;
              ctx.fillStyle = `rgba(200, 230, 255, ${trailAlpha})`;
              ctx.beginPath();
              ctx.arc(this.trail[i].x, this.trail[i].y, trailSize, 0, Math.PI * 2);
              ctx.fill();
            }
          }

          // Glow
          const glowSize = size * 3;
          const gradient = ctx.createRadialGradient(
            this.x, this.y, 0,
            this.x, this.y, glowSize
          );
          gradient.addColorStop(0, `rgba(200, 240, 255, ${alpha * 0.1})`);
          gradient.addColorStop(1, `rgba(200, 240, 255, 0)`);
          ctx.fillStyle = gradient;
          ctx.beginPath();
          ctx.arc(this.x, this.y, glowSize, 0, Math.PI * 2);
          ctx.fill();

          // Shadow
          ctx.shadowColor = `rgba(0, 0, 0, ${alpha * 0.1})`;
          ctx.shadowBlur = 5;
          ctx.shadowOffsetY = 2;

          // Drop body
          const grad = ctx.createRadialGradient(
            this.x - size * 0.2, this.y - size * 0.3, 0,
            this.x, this.y, size
          );
          grad.addColorStop(0, `rgba(255, 255, 255, ${alpha * 0.9})`);
          grad.addColorStop(0.3, `rgba(220, 240, 255, ${alpha * 0.8})`);
          grad.addColorStop(0.7, `rgba(180, 220, 255, ${alpha * 0.6})`);
          grad.addColorStop(1, `rgba(140, 200, 240, ${alpha * 0.4})`);

          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.ellipse(this.x, this.y, size, size * 0.85, 0, 0, Math.PI * 2);
          ctx.fill();

          ctx.shadowBlur = 0;
          ctx.shadowOffsetY = 0;

          // Highlight (reflection)
          ctx.fillStyle = `rgba(255, 255, 255, ${alpha * 0.4 * this.highlight})`;
          ctx.beginPath();
          ctx.ellipse(
            this.x - size * 0.2,
            this.y - size * 0.25,
            size * 0.2,
            size * 0.15,
            -0.5,
            0, Math.PI * 2
          );
          ctx.fill();

          // Secondary highlight
          ctx.fillStyle = `rgba(255, 255, 255, ${alpha * 0.15 * this.highlight})`;
          ctx.beginPath();
          ctx.ellipse(
            this.x + size * 0.15,
            this.y - size * 0.1,
            size * 0.1,
            size * 0.08,
            0.3,
            0, Math.PI * 2
          );
          ctx.fill();

          // Bottom reflection (shadow highlight)
          ctx.fillStyle = `rgba(200, 230, 255, ${alpha * 0.1})`;
          ctx.beginPath();
          ctx.ellipse(
            this.x + size * 0.1,
            this.y + size * 0.4,
            size * 0.15,
            size * 0.05,
            0.5,
            0, Math.PI * 2
          );
          ctx.fill();
        }

        isAlive() {
          return this.alive && this.opacity < 1;
        }
      }

      // ----- Create drop -----
      function createDrop(x, y) {
        const size = parseInt(sizeSlider.value) * (0.5 + Math.random() * 0.8);
        const drop = new Drop(x, y, size);
        // Randomize speed based on slider
        drop.speed = 0.3 + Math.random() * 0.7 * (parseInt(speedSlider.value) / 5);
        drops.push(drop);
        dropCount.textContent = `✦ ${drops.length} drops`;
        dewStatus.textContent = '💧 Forming';
        status.textContent = `💧 New drop formed`;
        setTimeout(() => {
          if (drops.length > 0) {
            dewStatus.textContent = '💧 Sliding';
          }
        }, 500);
      }

      // ----- Random drop -----
      function randomDrop() {
        const w = canvas.width;
        const h = canvas.height;
        const x = 20 + Math.random() * (w - 40);
        const y = 20 + Math.random() * (h * 0.4);
        createDrop(x, y);
      }

      // ----- Clear drops -----
      function clearDrops() {
        drops = [];
        dropCount.textContent = '✦ 0 drops';
        dewStatus.textContent = '💧 Forming';
        status.textContent = '🗑️ Drops cleared';
        setTimeout(() => {
          status.textContent = '💧 Dew drops forming on the surface';
        }, 1000);
      }

      // ----- Toggle pause -----
      function togglePause() {
        isPaused = !isPaused;
        toggleBtn.textContent = isPaused ? '▶ Play' : '⏸ Pause';
        status.textContent = isPaused ? '⏸ Paused' : '▶ Resumed';
        dewStatus.textContent = isPaused ? '⏸ Paused' : '💧 Forming';
      }

      // ----- Reset -----
      function resetDew() {
        drops = [];
        isPaused = false;
        toggleBtn.textContent = '⏸ Pause';
        dewStatus.textContent = '💧 Forming';
        dropCount.textContent = '✦ 0 drops';
        sizeSlider.value = 15;
        sizeValue.textContent = '15px';
        speedSlider.value = 5;
        speedValue.textContent = '5×';
        rateSlider.value = 5;
        rateValue.textContent = '5×';
        formationTimer = 0;
        status.textContent = '↺ Reset';
        setTimeout(() => {
          status.textContent = '💧 Dew drops forming on the surface';
        }, 500);
      }

      // ----- Draw background -----
      function drawBackground() {
        const w = canvas.width;
        const h = canvas.height;
        const cx = w / 2;
        const cy = h / 2;

        // Deep green/blue background (leaf surface)
        const bgGradient = ctx.createRadialGradient(cx, cy * 0.7, 0, cx, cy * 0.7, w * 0.7);
        bgGradient.addColorStop(0, '#1a3a2a');
        bgGradient.addColorStop(0.3, '#142a1e');
        bgGradient.addColorStop(0.7, '#0d1a14');
        bgGradient.addColorStop(1, '#060a08');
        ctx.fillStyle = bgGradient;
        ctx.fillRect(0, 0, w, h);

        // Leaf vein texture
        ctx.strokeStyle = 'rgba(50, 100, 70, 0.05)';
        ctx.lineWidth = 0.5;
        for (let i = 0; i < 15; i++) {
          const seed = i * 137.508;
          const x = (seed * 0.618) % w;
          const y = (seed * 0.381) % h;
          const angle = seed * 0.1;
          const length = 30 + (seed % 60);
          ctx.beginPath();
          ctx.moveTo(x, y);
          ctx.lineTo(x + Math.cos(angle) * length, y + Math.sin(angle) * length * 0.3);
          ctx.stroke();
        }

        // Subtle surface texture
        for (let i = 0; i < 50; i++) {
          const seed = i * 73.189;
          const x = (seed * 0.718) % w;
          const y = (seed * 0.482) % h;
          const size = 1 + (seed % 5);
          const alpha = 0.01 + (seed % 100) / 100 * 0.02;
          ctx.fillStyle = `rgba(100, 200, 150, ${alpha})`;
          ctx.beginPath();
          ctx.arc(x, y, size, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // ----- Draw -----
      function draw() {
        const w = canvas.width;
        const h = canvas.height;

        drawBackground();

        // Update and draw drops
        if (!isPaused) {
          drops = drops.filter(d => d.alive || d.opacity < 1);
          drops.forEach(d => d.update());
        }
        drops.forEach(d => d.draw(ctx));

        // Update count
        dropCount.textContent = `✦ ${drops.length} drops`;
        if (drops.length === 0 && !isPaused) {
          dewStatus.textContent = '💧 Forming';
        }
      }

      // ----- Animation loop -----
      function animate() {
        time += 0.016;

        // Auto-formation
        if (!isPaused) {
          const rate = parseInt(rateSlider.value) / 5;
          formationTimer += 0.01 * rate;
          if (formationTimer > 1) {
            formationTimer = 0;
            if (drops.length < 30) {
              randomDrop();
            }
          }
        }

        draw();
        animationId = requestAnimationFrame(animate);
      }

      // ----- Start animation -----
      function startAnimation() {
        if (animationId) {
          cancelAnimationFrame(animationId);
        }
        animate();
      }

      // ----- Event Listeners -----
      // Click to create drop
      canvas.addEventListener('click', (e) => {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        const x = (e.clientX - rect.left) * scaleX;
        const y = (e.clientY - rect.top) * scaleY;
        createDrop(x, y);
      });

      // Touch support
      canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        const touch = e.touches[0];
        const x = (touch.clientX - rect.left) * scaleX;
        const y = (touch.clientY - rect.top) * scaleY;
        createDrop(x, y);
      });

      // Buttons
      dropBtn.addEventListener('click', randomDrop);
      clearBtn.addEventListener('click', clearDrops);
      toggleBtn.addEventListener('click', togglePause);
      resetBtn.addEventListener('click', resetDew);

      // Sliders
      sizeSlider.addEventListener('input', (e) => {
        sizeValue.textContent = e.target.value + 'px';
      });

      speedSlider.addEventListener('input', (e) => {
        speedValue.textContent = e.target.value + '×';
        // Update existing drops' speed
        drops.forEach(d => {
          d.speed = 0.3 + Math.random() * 0.7 * (parseInt(e.target.value) / 5);
        });
      });

      rateSlider.addEventListener('input', (e) => {
        rateValue.textContent = e.target.value + '×';
      });

      // Keyboard shortcuts
      document.addEventListener('keydown', (e) => {
        if (e.key === 'd' || e.key === 'D') {
          e.preventDefault();
          randomDrop();
        }
        if (e.key === 'c' || e.key === 'C') {
          e.preventDefault();
          clearDrops();
        }
        if (e.key === ' ' || e.key === 'Space') {
          e.preventDefault();
          togglePause();
        }
        if (e.key === 'r' || e.key === 'R') {
          e.preventDefault();
          resetDew();
        }
      });

      // ----- Resize handler -----
      let resizeTimeout;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(() => {
          setupCanvas();
        }, 200);
      });

      // ----- Init -----
      function init() {
        setupCanvas();
        startAnimation();
        status.textContent = '💧 Dew drops forming on the surface!';
        // Create initial drops
        setTimeout(() => {
          for (let i = 0; i < 3; i++) {
            setTimeout(() => randomDrop(), i * 800);
          }
        }, 500);
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }

    })();
  </script>
</body>
</html>
