<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-fan-remote-control</title>
</head>
<body>
<main class="frc-remote">
  <header class="frc-screen">
    <strong class="frc-temp">24 C</strong>
    <span class="frc-mode">Auto</span>
  </header>
  <section class="frc-dial" aria-label="speed dial">
    <span class="frc-notch"></span>
    <span class="frc-notch"></span>
    <span class="frc-notch"></span>
    <span class="frc-notch"></span>
    <span class="frc-knob"></span>
  </section>
  <section class="frc-keys" aria-label="control keys">
    <button class="frc-key frc-power">Power</button>
    <button class="frc-key frc-swing">Swing</button>
    <button class="frc-key frc-timer">Timer</button>
    <button class="frc-key frc-sleep">Sleep</button>
    <button class="frc-key frc-turbo">Turbo</button>
  </section>
  <footer class="frc-foot">
    <span class="frc-led"></span>
    <span class="frc-brand">BreezePro</span>
  </footer>
</main>
</body>
</html>
