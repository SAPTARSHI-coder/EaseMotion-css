<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stacked Paper Effect</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="paper">
        <h2>Important Document</h2>
        <p>This element looks like a messy stack of papers lying on a desk. We achieve this illusion purely with CSS pseudo-elements, box-shadows, and slight rotations.</p>
        <p>Hover over the stack to see it expand slightly.</p>
    </div>
</body>
</html>
