<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shimmer-Sweep Carousel - Cyberpunk Neon Layouts</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="cyberpunk-body">
    <main class="carousel-container">
        <h2 class="neon-title">Cyberpunk Shimmer Carousel</h2>
        <div class="carousel-track">
            <!-- Card 1 -->
            <div class="carousel-card ease-shimmer-sweep">
                <div class="card-content">
                    <span class="neon-badge">New</span>
                    <h3 class="card-title">Neon Override</h3>
                    <p class="card-desc">Experience the vibrant shimmer sweep over glowing edges.</p>
                </div>
            </div>
            <!-- Card 2 -->
            <div class="carousel-card ease-shimmer-sweep">
                <div class="card-content">
                    <span class="neon-badge">Trending</span>
                    <h3 class="card-title">Grid Runner</h3>
                    <p class="card-desc">Dynamic highlights that simulate moving light across dark surfaces.</p>
                </div>
            </div>
            <!-- Card 3 -->
            <div class="carousel-card ease-shimmer-sweep">
                <div class="card-content">
                    <span class="neon-badge">Exclusive</span>
                    <h3 class="card-title">Cyber Glitch</h3>
                    <p class="card-desc">Smooth and performant pure CSS shimmer animations.</p>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
