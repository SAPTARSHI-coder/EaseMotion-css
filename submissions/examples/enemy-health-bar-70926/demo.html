<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Enemy Health Bar - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <main class="demo-container">
    <header class="demo-header">
      <span class="demo-badge">EaseMotion Gaming UI</span>
      <h1>CSS Enemy Health Bar</h1>
      <p>Gaming boss health bar with damage hit shake, dynamic gradient depletion states, critical low health pulse, and pure CSS triggers.</p>
    </header>

    <!-- Enemy Health Card Showcase Container -->
    <section class="boss-health-card" aria-label="Enemy Health Bar Display">
      <!-- Pure CSS State Controls for Health Level & Hit Damage Shake -->
      <input type="radio" name="health-state" id="hp-full" class="hp-radio" checked>
      <input type="radio" name="health-state" id="hp-mid" class="hp-radio">
      <input type="radio" name="health-state" id="hp-low" class="hp-radio">
      <input type="radio" name="health-state" id="hp-critical" class="hp-radio">

      <!-- Boss Profile Header -->
      <div class="boss-header">
        <div class="boss-portrait">
          <svg class="skull-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="11" r="7"></circle>
            <rect x="9" y="18" width="6" height="4" rx="1"></rect>
            <line x1="10" y1="18" x2="10" y2="22"></line>
            <line x1="14" y1="18" x2="14" y2="22"></line>
            <circle cx="9.5" cy="10.5" r="1.5" fill="currentColor"></circle>
            <circle cx="14.5" cy="10.5" r="1.5" fill="currentColor"></circle>
          </svg>
        </div>
        
        <div class="boss-meta">
          <div class="boss-title-row">
            <h2 class="boss-name">Malakor, the Shadow Architect</h2>
            <span class="boss-level">LVL 99 BOSS</span>
          </div>
          <div class="boss-status-badges">
            <span class="status-badge phase-badge">PHASE 2</span>
            <span class="status-badge armor-badge">ARMORED</span>
          </div>
        </div>
      </div>

      <!-- Animated Health Bar Frame -->
      <div class="health-bar-frame" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100">
        <div class="health-bar-track">
          <!-- Delayed White Damage Trail Fill -->
          <div class="damage-trail-fill"></div>
          <!-- Primary Health Fill Bar -->
          <div class="health-fill-bar">
            <div class="shimmer-overlay"></div>
          </div>
          <!-- Segment Cut Dividers -->
          <div class="health-segments" aria-hidden="true">
            <span></span><span></span><span></span>
          </div>
        </div>

        <div class="hp-counter-row">
          <span class="hp-status-text">HP Status</span>
          <span class="hp-numeric">
            <span class="current-hp">10,000</span> / 10,000
          </span>
        </div>
      </div>

      <!-- Damage Controls (Simulate Attacks) -->
      <div class="attack-controls" aria-label="Simulate Attacks">
        <span class="controls-label">Simulate Attack Damage:</span>
        <div class="btn-group">
          <label for="hp-full" class="attack-btn btn-full" tabindex="0" title="Full HP (100%)">
            <span>100% HP</span>
          </label>

          <label for="hp-mid" class="attack-btn btn-mid" tabindex="0" title="Heavy Hit (-35%)">
            <span>65% HP</span>
          </label>

          <label for="hp-low" class="attack-btn btn-low" tabindex="0" title="Critical Slash (-65%)">
            <span>35% HP</span>
          </label>

          <label for="hp-critical" class="attack-btn btn-critical" tabindex="0" title="Fatal Blow (10%)">
            <span>10% HP</span>
          </label>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
