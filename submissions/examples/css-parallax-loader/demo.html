<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parallax Loader | Material Design</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="parallax-loader-card" tabindex="0" aria-label="Material Design Parallax Loader">
    <h1 class="loader-title">Parallax Loader</h1>
    <p class="loader-subtitle">Multi-layer material spinner effect</p>

    <div class="parallax-ring-container" aria-hidden="true">
        <div class="ring-layer ring-outer"></div>
        <div class="ring-layer ring-inner"></div>
        <div class="ring-layer ring-core"></div>
    </div>

    <p class="loader-status">Synchronizing layers...</p>
</main>

</body>
</html>
