<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Sci-Fi HUD: Aurora Glow</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <div class="hud-container" role="region" aria-label="System Status Dashboard">
    
    <!-- Decorative brackets -->
    <div class="hud-bracket bracket-tl" aria-hidden="true"></div>
    <div class="hud-bracket bracket-tr" aria-hidden="true"></div>
    <div class="hud-bracket bracket-bl" aria-hidden="true"></div>
    <div class="hud-bracket bracket-br" aria-hidden="true"></div>
    
    <!-- CRT Scanline overlay -->
    <div class="scanline-overlay" aria-hidden="true"></div>

    <header class="hud-header">
      <h2 class="hud-title">Sys.Monitor</h2>
      <span class="hud-status" aria-live="polite">Online</span>
    </header>

    <div class="data-row">
      <div class="data-label">
        <span>Core Temp</span>
        <span class="data-value">85%</span>
      </div>
      <div class="bar-track" aria-hidden="true">
        <div class="bar-fill fill-1"></div>
      </div>
    </div>

    <div class="data-row">
      <div class="data-label">
        <span>Memory Sync</span>
        <span class="data-value">62%</span>
      </div>
      <div class="bar-track" aria-hidden="true">
        <div class="bar-fill fill-2"></div>
      </div>
    </div>

    <div class="data-row" style="margin-bottom: 0;">
      <div class="data-label">
        <span>Network Integrity</span>
        <span class="data-value">40%</span>
      </div>
      <div class="bar-track" aria-hidden="true">
        <div class="bar-fill fill-3"></div>
      </div>
    </div>

  </div>

</body>
</html>
