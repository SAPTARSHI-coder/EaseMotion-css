<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ease Add to Cart Animation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="ease-store-wrapper">
    <!-- Global State Checkbox -->
    <input type="checkbox" id="cart-hack" class="ease-cart-trigger" aria-hidden="true">
    
    <!-- Header & Cart -->
    <header class="ease-header">
      <div class="ease-cart-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
        <span class="ease-cart-badge">1</span>
      </div>
    </header>

    <!-- Product Card -->
    <div class="ease-product">
      <div class="ease-ghost-item" aria-hidden="true">👟</div>
      <div class="ease-product-img">👟</div>
      <h3 style="color: white; margin: 0 0 1rem 0; font-family: sans-serif;">RunX Sneaker</h3>
      <!-- The Button (Label tied to Checkbox) -->
      <label for="cart-hack" class="ease-add-btn" role="button" tabindex="0">Add to Cart</label>
    </div>
  </div>
  <p style="position: absolute; bottom: 2rem; color: #64748b; font-family: system-ui; font-size: 0.875rem;">Pure CSS logic. No JavaScript event listeners.</p>
</body>
</html>
