<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Synthwave Grid Particles - EaseMotion CSS</title>
  <!-- Import EaseMotion CSS -->
  <link rel="stylesheet" href="../../../easemotion.css">
  <!-- Component Specific Styles -->
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="minimalist-bg">

  <div class="demo-container">
    
    <div class="header-section">
      <h1 class="ease-text-3xl">Synthwave Grid Particles</h1>
      <p class="ease-color-muted">A fully hardware-accelerated 3D perspective engine. Watch as glowing data packets zoom along an infinite retro grid toward the camera.</p>
    </div>

    <!-- The 3D Viewport Component -->
    <div class="synthwave-viewport" aria-label="Animated synthwave grid and retro sun" role="img">
      
      <!-- The Sky / Sunset -->
      <div class="retro-sky">
        <div class="retro-sun"></div>
      </div>

      <!-- The 3D Perspective Floor -->
      <div class="synthwave-floor-container">
        <div class="synthwave-floor">
          
          <!-- Data Packet Particles traveling on the grid lines -->
          <div class="grid-particle p-1"></div>
          <div class="grid-particle p-2"></div>
          <div class="grid-particle p-3"></div>
          <div class="grid-particle p-4"></div>
          <div class="grid-particle p-5"></div>
          <div class="grid-particle p-6"></div>
          <div class="grid-particle p-7"></div>
          <div class="grid-particle p-8"></div>
          <div class="grid-particle p-9"></div>
          <div class="grid-particle p-10"></div>
          
        </div>
      </div>

      <!-- Foreground UI overlay to prove it's a background -->
      <div class="retro-ui ease-glass-card">
        <h2 class="retro-title">SYSTEM_ONLINE</h2>
        <p class="retro-desc">3D transforms pushing rendering directly to the GPU compositor.</p>
      </div>
      
    </div>

  </div>

</body>
</html>
