<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thought Bubble</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="thought-app">

  <section class="thought-card">

    <div class="header">
      <span class="eyebrow">MENTAL SPACE</span>
      <h1>Thought Bubble</h1>
      <p>Let your thoughts drift into the atmosphere.</p>
    </div>

    <div class="thought-stage" id="stage">

      <div class="source">
        <div class="head"></div>
        <div class="body"></div>
      </div>

      <div class="bubble-cloud" id="bubbleCloud"></div>

      <div class="hint">
        Click anywhere or press Space
      </div>

    </div>

    <div class="controls">

      <button id="generateBtn">
        💭 Generate Thought
      </button>

      <button id="clearBtn" class="secondary">
        Clear
      </button>

      <label>
        Intensity
        <input
          id="intensity"
          type="range"
          min="10"
          max="100"
          value="55"
        >
        <span id="intensityValue">55%</span>
      </label>

    </div>

    <div class="stats">
      <span>Thoughts generated</span>
      <strong id="count">0</strong>
    </div>

  </section>

</main>

<script>
const stage = document.getElementById("stage");
const cloud = document.getElementById("bubbleCloud");
const generateBtn = document.getElementById("generateBtn");
const clearBtn = document.getElementById("clearBtn");
const intensity = document.getElementById("intensity");
const intensityValue = document.getElementById("intensityValue");
const countEl = document.getElementById("count");

const thoughts = [
  "What if?",
  "Keep going.",
  "I have an idea!",
  "Maybe tomorrow...",
  "Let's try something new.",
  "Interesting...",
  "I wonder why.",
  "This could work.",
  "One step at a time.",
  "Remember this.",
  "Create something.",
  "Think bigger."
];

let count = 0;

function createThought(x = null) {
  const bubble = document.createElement("div");
  bubble.className = "thought-bubble";

  const text = thoughts[Math.floor(Math.random() * thoughts.length)];

  bubble.innerHTML = `
    <span>${text}</span>
    <i></i>
    <b></b>
  `;

  const stageRect = stage.getBoundingClientRect();

  const startX = x === null
    ? stageRect.width / 2
    : x - stageRect.left;

  const offset = (Math.random() - 0.5) * 100;

  bubble.style.left = `${startX + offset}px`;
  bubble.style.setProperty(
    "--drift",
    `${(Math.random() - 0.5) * 90}px`
  );

  bubble.style.setProperty(
    "--duration",
    `${4 + Math.random() * 2}s`
  );

  cloud.appendChild(bubble);

  count++;
  countEl.textContent = count;

  setTimeout(() => bubble.remove(), 6500);
}

generateBtn.addEventListener("click", () => {
  createThought();
});

clearBtn.addEventListener("click", () => {
  cloud.innerHTML = "";
});

stage.addEventListener("click", (event) => {
  if (!event.target.closest("button")) {
    createThought(event.clientX);
  }
});

intensity.addEventListener("input", () => {
  intensityValue.textContent = `${intensity.value}%`;
});

document.addEventListener("keydown", (event) => {
  if (event.code === "Space") {
    event.preventDefault();
    createThought();
  }

  if (event.key.toLowerCase() === "c") {
    cloud.innerHTML = "";
  }
});
</script>

</body>
</html>
