<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-sprinkler-system</title>
</head>
<body>
<main class="spk-card">
  <header class="spk-head">
    <h1 class="spk-title">Zone 1</h1>
    <span class="spk-on">Running</span>
  </header>
  <section class="spk-lawn" aria-label="lawn">
    <span class="spk-nozzle spk-nozzle-a"></span>
    <span class="spk-nozzle spk-nozzle-b"></span>
    <span class="spk-spray spk-spray-a"></span>
    <span class="spk-spray spk-spray-b"></span>
    <span class="spk-drop spk-drop-1"></span>
    <span class="spk-drop spk-drop-2"></span>
    <span class="spk-drop spk-drop-3"></span>
  </section>
  <section class="spk-read">
    <span class="spk-label">Flow</span>
    <strong class="spk-flow">11 L/min</strong>
  </section>
  <footer class="spk-foot">
    <span class="spk-cycle">Cycle 12 min</span>
    <span class="spk-pressure">Pressure 3.2 bar</span>
  </footer>
</main>
</body>
</html>
