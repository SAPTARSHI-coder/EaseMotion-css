<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retro Synthwave Drum Machine - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="em-container">
    <header class="em-header">
      <h1 class="em-title">Synthwave Drum Sequencer</h1>
      <p class="em-subtitle">Retro 80s synthwave drum pad sequencer with glowing RGB pads.</p>
    </header>
    <main class="em-grid">
      <section class="em-card">
        <div class="em-card__icon">&#9672;</div>
        <h2 class="em-card__title">Sequencer Mode</h2>
        <p class="em-card__body">Hover pads to trigger interactive neon visualizers.</p>
        <button class="em-btn em-btn--primary">Start Beats</button>
      </section>
      <section class="em-card">
        <div class="em-card__icon">&#9673;</div>
        <h2 class="em-card__title">Oscilloscope</h2>
        <p class="em-card__body">Active signal wave visualizer rendering frequency shifts.</p>
        <div class="em-loader" aria-label="Loading"></div>
      </section>
    </main>
  </div>
</body>
</html>
