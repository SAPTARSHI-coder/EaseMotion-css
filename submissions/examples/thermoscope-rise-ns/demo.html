<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thermoscope Rise — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Thermoscope Rise demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Thermoscope Rise</h1>
      <p class="lede">Thermoscope fluid column rising with heat</p>
    </header>

    <section class="ease-thermoscope-rise" data-demo="thermoscope-rise" aria-live="polite">
      <div class="ease-thermoscope-rise__housing">
        <div class="ease-thermoscope-rise__bezel">
          <div class="ease-thermoscope-rise__face">
            <div class="ease-thermoscope-rise__readout">
              <span class="ease-thermoscope-rise__label">Thermoscope Rise</span>
              <span class="ease-thermoscope-rise__value">LIVE</span>
            </div>
            <div class="ease-thermoscope-rise__motion" aria-hidden="true">
              <span class="ease-thermoscope-rise__a"></span>
              <span class="ease-thermoscope-rise__b"></span>
              <span class="ease-thermoscope-rise__c"></span>
              <span class="ease-thermoscope-rise__d"></span>
            </div>
            <div class="ease-thermoscope-rise__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-thermoscope-rise__controls">
          <button type="button" class="ease-thermoscope-rise__btn primary">Engage</button>
          <button type="button" class="ease-thermoscope-rise__btn">Reset</button>
          <label class="ease-thermoscope-rise__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-thermoscope-rise__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
