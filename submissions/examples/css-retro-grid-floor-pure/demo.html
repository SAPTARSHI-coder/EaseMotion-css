<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Retro Grid Floor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="layout-container">
        
        <header class="section-header">
            <h1 class="title">Retro Grid Floor</h1>
            <p class="subtitle">An 80s outrun-style perspective grid floor built entirely in CSS. Utilizes 3D transforms (`perspective`, `rotateX`) and animated linear gradients.</p>
        </header>

        <div class="demo-area">
            
            <!-- 
              [TECHNIQUE] The Retro Grid
              The container sets the perspective, creating a 3D vanishing point.
              The inner floor element is rotated along the X-axis to lay flat.
              Scanlines are applied as an overlay.
            -->
            <div class="retro-scene" role="img" aria-label="80s Retro Synthwave Grid Floor Animation">
                
                <!-- The sun/horizon glow -->
                <div class="retro-sun"></div>
                
                <!-- The flat perspective floor -->
                <div class="retro-floor"></div>
                
                <!-- Scanline CRT overlay -->
                <div class="scanlines"></div>
                
                <div class="retro-text">80s VIBES</div>
                
            </div>
            
        </div>
        
    </div>

</body>
</html>
