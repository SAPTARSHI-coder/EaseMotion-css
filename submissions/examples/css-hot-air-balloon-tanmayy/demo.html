<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Hot Air Balloon - EaseMotion CSS</title>
  <!-- Import EaseMotion CSS -->
  <link rel="stylesheet" href="../../../easemotion.css">
  <!-- Component Specific Styles -->
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="minimalist-bg">

  <div class="demo-container">
    
    <div class="header-section">
      <h1 class="ease-text-3xl">Hot Air Balloon</h1>
      <p class="ease-color-muted">A pure CSS illustration featuring combined <code>@keyframes</code> for independent horizontal drifting and vertical bobbing physics.</p>
    </div>

    <!-- The Sky Scene -->
    <div class="sky-container" aria-label="Animated sky with drifting clouds and a hot air balloon" role="img">
      
      <!-- CSS Clouds -->
      <div class="cloud cloud-1"></div>
      <div class="cloud cloud-2"></div>
      <div class="cloud cloud-3"></div>

      <!-- The Balloon Drifter (Handles horizontal translation) -->
      <div class="balloon-drifter">
        
        <!-- The Balloon Bobber (Handles vertical bounce) -->
        <div class="balloon-bobber">
          
          <!-- The Envelope (The balloon part) -->
          <div class="balloon-envelope"></div>
          
          <!-- The Basket & Ropes -->
          <div class="balloon-basket"></div>
          
        </div>
        
      </div>
      
      <!-- Foreground Mountains (For depth parallax) -->
      <div class="mountain-range">
        <div class="mountain m-1"></div>
        <div class="mountain m-2"></div>
      </div>

    </div>

  </div>

</body>
</html>
