<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Animated Breadcrumb - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="breadcrumb-page">

    <header class="breadcrumb-header">
      <span class="section-pill">Navigation</span>
      <h1>Animated Breadcrumb</h1>
      <p>
        A modern animated breadcrumb navigation component built with
        pure HTML and CSS.
      </p>
    </header>

    <section class="breadcrumb-demo">

      <nav class="breadcrumb-bar" aria-label="Breadcrumb">
        <ol class="breadcrumb-list">

          <li class="breadcrumb-item">
            <a href="#">Home</a>
          </li>

          <li class="breadcrumb-item">
            <a href="#">Components</a>
          </li>

          <li class="breadcrumb-item">
            <a href="#">Navigation</a>
          </li>

          <li class="breadcrumb-item current" aria-current="page">
            Breadcrumb
          </li>

        </ol>
      </nav>

      <div class="breadcrumb-example">

        <nav class="breadcrumb-bar alt" aria-label="Breadcrumb example">
          <ol class="breadcrumb-list">

            <li class="breadcrumb-item">
              <a href="#">Dashboard</a>
            </li>

            <li class="breadcrumb-item">
              <a href="#">Projects</a>
            </li>

            <li class="breadcrumb-item">
              <a href="#">EaseMotion CSS</a>
            </li>

            <li class="breadcrumb-item current" aria-current="page">
              Settings
            </li>

          </ol>
        </nav>

      </div>

    </section>

  </main>

</body>
</html>
