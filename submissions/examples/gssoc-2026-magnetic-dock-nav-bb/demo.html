<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Magnetic Dock Navigation Bar - EaseMotion CSS Showcase</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="dock-demo-wrapper">
    <header class="dock-header">
      <h1 class="dock-title">Magnetic Dock Navigation</h1>
      <p class="dock-subtitle">macOS-inspired fluid magnification physics &amp; active indicator pill.</p>
    </header>

    <nav class="magnetic-dock-bar" aria-label="Main Dock Navigation">
      <div class="dock-container" id="dockContainer">
        <a href="#home" class="dock-item active" data-tooltip="Home">
          <span class="dock-icon">🏠</span>
          <span class="dock-pill"></span>
        </a>
        <a href="#apps" class="dock-item" data-tooltip="Applications">
          <span class="dock-icon">🚀</span>
          <span class="dock-pill"></span>
        </a>
        <a href="#files" class="dock-item" data-tooltip="Documents">
          <span class="dock-icon">📁</span>
          <span class="dock-pill"></span>
        </a>
        <a href="#media" class="dock-item" data-tooltip="Media Player">
          <span class="dock-icon">🎵</span>
          <span class="dock-pill"></span>
        </a>
        <a href="#settings" class="dock-item" data-tooltip="System Settings">
          <span class="dock-icon">⚙️</span>
          <span class="dock-pill"></span>
        </a>
      </div>
    </nav>
  </div>

  <script>
    const dockItems = document.querySelectorAll('.dock-item');
    dockItems.forEach(item => {
      item.addEventListener('mouseenter', () => {
        dockItems.forEach(i => i.classList.remove('active'));
        item.classList.add('active');
      });
    });
  </script>
</body>
</html>
