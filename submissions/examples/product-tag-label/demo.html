<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Product Tag Label</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="product-card">
    <div class="product-tag">New</div>
    <img src="https://via.placeholder.com/300x200" alt="Product Image" class="product-img">
    <h2 class="product-title">Sample Product</h2>
    <p class="product-desc">This is a demo product description.</p>
  </div>
</body>
</html>
