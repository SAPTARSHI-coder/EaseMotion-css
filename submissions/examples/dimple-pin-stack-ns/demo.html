<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dimple Pin Stack — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Dimple Pin Stack demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Dimple Pin Stack</h1>
      <p class="lede">Dimple pin stack reaching shear</p>
    </header>

    <section class="ease-dimple-pin-stack" data-demo="dimple-pin-stack" aria-live="polite">
      <div class="ease-dimple-pin-stack__housing">
        <div class="ease-dimple-pin-stack__bezel">
          <div class="ease-dimple-pin-stack__face">
            <div class="ease-dimple-pin-stack__readout">
              <span class="ease-dimple-pin-stack__label">Dimple Pin Stack</span>
              <span class="ease-dimple-pin-stack__value">LIVE</span>
            </div>
            <div class="ease-dimple-pin-stack__motion" aria-hidden="true">
              <span class="ease-dimple-pin-stack__a"></span>
              <span class="ease-dimple-pin-stack__b"></span>
              <span class="ease-dimple-pin-stack__c"></span>
              <span class="ease-dimple-pin-stack__d"></span>
            </div>
            <div class="ease-dimple-pin-stack__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-dimple-pin-stack__controls">
          <button type="button" class="ease-dimple-pin-stack__btn primary">Set</button>
          <button type="button" class="ease-dimple-pin-stack__btn">Drop</button>
          <label class="ease-dimple-pin-stack__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-dimple-pin-stack__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
