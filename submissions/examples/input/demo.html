<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Floating Input Field Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="demo-container">
    <h1>Responsive Floating Input Field Demo</h1>

    <form class="floating-form" aria-label="Demo Registration Form" novalidate>
      
      <!-- Grid Container for Responsive Breakpoints -->
      <div class="floating-grid">
        
        <!-- Standard Text Input -->
        <div class="floating-group">
          <input 
            type="text" 
            id="first-name" 
            class="floating-input" 
            placeholder=" " 
            required 
            aria-describedby="first-name-help"
          />
          <label for="first-name" class="floating-label">First Name</label>
          <span id="first-name-help" class="floating-help">Enter your given name</span>
        </div>

        <!-- Input with Success State -->
        <div class="floating-group floating-group--success">
          <input 
            type="email" 
            id="email-addr" 
            class="floating-input" 
            placeholder=" " 
            value="user@example.com" 
            required 
            aria-describedby="email-success"
          />
          <label for="email-addr" class="floating-label">Email Address</label>
          <span id="email-success" class="floating-help">Email verified successfully</span>
        </div>

        <!-- Input with Error State -->
        <div class="floating-group floating-group--error">
          <input 
            type="text" 
            id="username" 
            class="floating-input" 
            placeholder=" " 
            aria-invalid="true" 
            aria-describedby="username-error"
          />
          <label for="username" class="floating-label">Username</label>
          <span id="username-error" class="floating-help" role="alert">Username is already taken</span>
        </div>

        <!-- Disabled Input -->
        <div class="floating-group floating-group--disabled">
          <input 
            type="text" 
            id="account-id" 
            class="floating-input" 
            placeholder=" " 
            value="ACC-98231" 
            disabled 
            aria-describedby="account-id-help"
          />
          <label for="account-id" class="floating-label">Account ID</label>
          <span id="account-id-help" class="floating-help">Generated system identifier</span>
        </div>

      </div>
    </form>
  </main>

</body>
</html>
