<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Elastic-Slide Tooltip</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<section class="tooltip-section">

<h1>Gaming Hub Tooltips</h1>

<div class="tooltip-grid">

<div class="tooltip-item">
<button class="tooltip-btn">🎮 Battle Pass</button>
<div class="tooltip">
Unlock premium missions, seasonal rewards, and exclusive content.
</div>
</div>

<div class="tooltip-item">
<button class="tooltip-btn">⚔️ Legendary Sword</button>
<div class="tooltip">
Increase critical damage and unlock devastating combat abilities.
</div>
</div>

<div class="tooltip-item">
<button class="tooltip-btn">🛡️ Guardian Shield</button>
<div class="tooltip">
Blocks incoming attacks and grants temporary protection.
</div>
</div>

<div class="tooltip-item">
<button class="tooltip-btn">💎 Epic Crystal</button>
<div class="tooltip">
Collect crystals to unlock legendary skins and rewards.
</div>
</div>

</div>

</section>

</body>
</html>
