<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Masonry — EaseMotion CSS</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="masonry-page-tm" data-palette="rose">
  <h1 class="masonry-h-tm">Masonry</h1>
  <p class="masonry-lede-tm">A self-contained demo with three variants of the effect.</p>
  <section class="masonry-row-tm">
    <article class="masonry-1-wrap-tm">
      <div class="masonry-1-tm"></div>
      <span class="masonry-lbl-tm">Example One</span>
    </article>
    <article class="masonry-2-wrap-tm">
      <div class="masonry-2-tm"></div>
      <span class="masonry-lbl-tm">Example Two</span>
    </article>
    <article class="masonry-3-wrap-tm">
      <div class="masonry-3-tm"></div>
      <span class="masonry-lbl-tm">Example Three</span>
    </article>
  </section>
</main>
</body>
</html>
