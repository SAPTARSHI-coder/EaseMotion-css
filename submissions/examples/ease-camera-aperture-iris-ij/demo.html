<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-camera-aperture-iris demo</title>
</head>
<body>
<div class="cm-app">
  <div class="cm-head">
    <span class="cm-name">OPTICA 35</span>
    <span class="cm-badge">F/2.8</span>
  </div>
  <div class="cm-stage">
    <div class="cm-camera">
      <div class="cm-body"></div>
      <div class="cm-viewfinder"><span class="cm-view-lens"></span></div>
      <div class="cm-lens">
        <div class="cm-iris">
          <span class="cm-blade cm-blade-1"></span>
          <span class="cm-blade cm-blade-2"></span>
          <span class="cm-blade cm-blade-3"></span>
          <span class="cm-blade cm-blade-4"></span>
          <span class="cm-blade cm-blade-5"></span>
          <span class="cm-blade cm-blade-6"></span>
        </div>
        <div class="cm-aperture"></div>
      </div>
      <button class="cm-shutter" type="button"></button>
      <div class="cm-dial"><span class="cm-dial-mark"></span></div>
    </div>
  </div>
  <div class="cm-foot">ISO 100</div>
</div>
</body>
</html>
