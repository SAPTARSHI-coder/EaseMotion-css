<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Lava Lamp Text - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="em-lava-page">
        <div class="em-card" role="region" aria-label="Lava Lamp Text Showcase" tabindex="0">
            <span class="em-card-badge">TYPOGRAPHY EFFECTS</span>
            <h1 class="em-card-title">Lava Lamp Text</h1>
            <p class="em-card-desc">Dynamic typography filled with a fluid, organic lava lamp blob animation using native CSS gradients and background clipping.</p>
            
            <!-- Animated Lava Lamp Text Container -->
            <div class="em-lava-container" aria-hidden="true">
                <span class="em-lava-text">FLOW</span>
            </div>

            <!-- Screen reader accessible text for the decorative visual -->
            <span class="em-sr-only">The word "FLOW" with a moving lava lamp gradient effect inside the letters.</span>

            <a href="#" class="em-card-btn" role="button">View Source</a>
        </div>
    </div>
</body>
</html>
