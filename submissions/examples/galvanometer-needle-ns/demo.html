<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ease Galvanometer Needle</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<section class="showcase">

    <h1>Galvanometer Needle</h1>
    <p>Current sensitive analog measurement display</p>


    <div class="ease-galvanometer-needle">

        <div class="meter-header">
            <span>GALVANOMETER</span>
            <span class="status">ACTIVE</span>
        </div>


        <div class="meter">

            <div class="scale">
                <span>-</span>
                <span>0</span>
                <span>+</span>
            </div>


            <div class="needle">
                <div class="needle-tip"></div>
            </div>


            <div class="center-pin"></div>

        </div>


        <div class="reading">
            CURRENT : 2.4mA
        </div>


    </div>

</section>


</body>
</html>
