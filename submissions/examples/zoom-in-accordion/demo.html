<!DOCTYPE html>

<div class="accordion">

    <details open>

            Modern user interface designs focused on accessibility and aesthetics.
        </div>
    </details>

    <details>
        <summary>Web Development</summary>
        <div class="content">
            Responsive websites built with HTML, CSS and JavaScript.

    <details>
        <summary>Brand Identity</summary>
        <div class="content">
            Logo design, typography and visual identity systems.
        </div>
    </details>

    <details>
        <summary>Contact</summary>

            Email: portfolio@example.com

    </details>

</div>

</html>
