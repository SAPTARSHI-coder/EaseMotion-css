<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ease-context-menu-sap demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fafafa;
    }
  </style>
</head>
<body>

  <div class="context-target-sap" id="target">Right-click here</div>

  <div class="context-menu-sap" id="menu">
    <div class="menu-item">📋 Copy</div>
    <div class="menu-item">✂️ Cut</div>
    <div class="menu-item">📄 Paste</div>
    <div class="menu-divider"></div>
    <div class="menu-item">✏️ Rename</div>
    <div class="menu-item danger">🗑️ Delete</div>
  </div>

  <script>
    const target = document.getElementById('target');
    const menu = document.getElementById('menu');

    target.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      const x = Math.min(e.clientX, window.innerWidth - 200);
      const y = Math.min(e.clientY, window.innerHeight - 220);
      menu.style.left = x + 'px';
      menu.style.top = y + 'px';
      menu.classList.add('open');
    });

    document.addEventListener('click', () => {
      menu.classList.remove('open');
    });

    menu.querySelectorAll('.menu-item').forEach(item => {
      item.addEventListener('click', () => {
        menu.classList.remove('open');
      });
    });
  </script>

</body>
</html>
