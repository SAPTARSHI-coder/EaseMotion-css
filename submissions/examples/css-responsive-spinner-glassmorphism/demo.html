<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Spinner | Glassmorphism Styling</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="orb orb-1" aria-hidden="true"></div>
<div class="orb orb-2" aria-hidden="true"></div>

<main class="spinner-card" aria-label="Glassmorphism Loading Spinner Showcase">
    <div class="spinner-wrapper" role="status" aria-label="Loading content">
        <div class="spinner-ring" aria-hidden="true"></div>
        <div class="spinner-ring-inner" aria-hidden="true"></div>
        <div class="spinner-core" aria-hidden="true"></div>
    </div>

    <h1 class="spinner-title">System Synchronizing</h1>
    <p class="spinner-desc">Translucent multi-layer glass spinner featuring counter-rotating accent rings and ambient background pulse glows.</p>
</main>

</body>
</html>
