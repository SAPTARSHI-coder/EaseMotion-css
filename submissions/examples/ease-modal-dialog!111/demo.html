<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animated Tooltip - EaseMotion CSS</title>
  
  <!-- EaseMotion CSS (CDN) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css">
  
  <!-- Local Tooltip Component Styles -->
  <link rel="stylesheet" href="style.css">
  
  <style>
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: var(--ease-color-bg, #f8fafc);
      color: var(--ease-color-text, #0f172a);
      gap: 2rem;
      margin: 0;
    }
    .demo-container {
      display: flex;
      gap: 2rem;
      flex-wrap: wrap;
      justify-content: center;
      padding: 2rem;
    }
  </style>
</head>
<body>

  <h1 class="ease-fade-in">Animated Tooltip Component</h1>
  
  <div class="demo-container">
    <!-- Top Tooltip -->
    <button class="ease-btn ease-btn-primary ease-tooltip" data-tooltip="This is a top tooltip!">
      Hover Me (Top)
    </button>

    <!-- Bottom Tooltip -->
    <button class="ease-btn ease-btn-secondary ease-tooltip ease-tooltip-bottom" data-tooltip="This is a bottom tooltip!">
      Hover Me (Bottom)
    </button>
    
    <!-- Focusable element for accessibility -->
    <a href="#" class="ease-link ease-tooltip" data-tooltip="Keyboard accessible via Tab + Focus">
      Focus Me (Top)
    </a>
  </div>

  <p class="ease-fade-in" style="opacity: 0.7; font-size: 0.9rem; max-width: 400px; text-align: center;">
    Zero JavaScript. Pure CSS animations leveraging EaseMotion design tokens (<code>--ease-duration-fast</code>, <code>--ease-out</code>).
  </p>

</body>
</html>
