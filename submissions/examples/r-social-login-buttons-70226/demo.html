<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Accessible CSS social login buttons for Google, GitHub, and Apple."
  >
  <title>CSS Social Login Buttons</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section class="login-card" aria-labelledby="login-title">
      <div class="login-header">
        <span class="eyebrow">EaseMotion CSS</span>
        <h1 id="login-title">Welcome back</h1>
        <p>Continue with your preferred account</p>
      </div>

      <div class="social-buttons" aria-label="Social login options">
        <button class="social-btn google-btn" type="button" aria-label="Continue with Google">
          <span class="social-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" role="img">
              <path d="M21.35 12.27c0-.79-.07-1.54-.22-2.27H12v4.3h5.24a4.48 4.48 0 0 1-1.94 2.94v2.44h3.14c1.84-1.69 2.91-4.18 2.91-7.41Z"/>
              <path d="M12 21.7c2.63 0 4.84-.87 6.45-2.35l-3.14-2.44c-.87.58-1.98.92-3.31.92-2.54 0-4.69-1.72-5.46-4.02H3.29v2.52A9.75 9.75 0 0 0 12 21.7Z"/>
              <path d="M6.54 13.81A5.85 5.85 0 0 1 6.23 12c0-.63.11-1.24.31-1.81V7.67H3.29A9.75 9.75 0 0 0 2.25 12c0 1.57.38 3.05 1.04 4.33l3.25-2.52Z"/>
              <path d="M12 6.17c1.43 0 2.71.49 3.72 1.45l2.79-2.79C16.83 3.25 14.63 2.3 12 2.3a9.75 9.75 0 0 0-8.71 5.37l3.25 2.52C7.31 7.89 9.46 6.17 12 6.17Z"/>
            </svg>
          </span>
          <span>Continue with Google</span>
        </button>

        <button class="social-btn github-btn" type="button" aria-label="Continue with GitHub">
          <span class="social-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" role="img">
              <path
                d="M12 2.25a9.75 9.75 0 0 0-3.08 19c.49.09.67-.21.67-.47v-1.69c-2.73.59-3.31-1.16-3.31-1.16-.44-1.13-1.08-1.43-1.08-1.43-.89-.61.07-.6.07-.6.98.07 1.5 1.01 1.5 1.01.87 1.49 2.28 1.06 2.84.81.09-.63.34-1.06.62-1.31-2.18-.25-4.47-1.09-4.47-4.85 0-1.07.38-1.95 1.01-2.64-.1-.25-.44-1.25.1-2.6 0 0 .82-.26 2.68 1.01a9.27 9.27 0 0 1 4.88 0c1.86-1.27 2.68-1.01 2.68-1.01.54 1.35.2 2.35.1 2.6.63.69 1.01 1.57 1.01 2.64 0 3.77-2.29 4.6-4.48 4.84.35.3.66.89.66 1.8v2.58c0 .26.18.56.67.47A9.75 9.75 0 0 0 12 2.25Z"
              />
            </svg>
          </span>
          <span>Continue with GitHub</span>
        </button>

        <button class="social-btn apple-btn" type="button" aria-label="Continue with Apple">
          <span class="social-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" role="img">
              <path
                d="M17.05 12.54c-.02-2.34 1.91-3.47 2-3.52a4.3 4.3 0 0 0-3.38-1.83c-1.42-.15-2.79.85-3.51.85-.73 0-1.85-.83-3.05-.81a4.48 4.48 0 0 0-3.78 2.3c-1.64 2.84-.42 7.04 1.17 9.35.78 1.13 1.69 2.39 2.89 2.35 1.17-.05 1.61-.75 3.02-.75 1.41 0 1.81.75 3.03.72 1.26-.02 2.05-1.14 2.82-2.28a9.36 9.36 0 0 0 1.28-2.64 4.09 4.09 0 0 1-2.49-3.74ZM14.75 5.69a4.1 4.1 0 0 0 .94-2.93 4.2 4.2 0 0 0-2.71 1.4 3.9 3.9 0 0 0-.97 2.82 3.46 3.46 0 0 0 2.74-1.29Z"
              />
            </svg>
          </span>
          <span>Continue with Apple</span>
        </button>
      </div>

      <div class="divider" aria-hidden="true">
        <span>or</span>
      </div>

      <p class="terms">
        By continuing, you agree to our
        <a href="#" aria-label="Terms of Service">Terms</a>
        and
        <a href="#" aria-label="Privacy Policy">Privacy Policy</a>.
      </p>
    </section>
  </main>
</body>
</html>
