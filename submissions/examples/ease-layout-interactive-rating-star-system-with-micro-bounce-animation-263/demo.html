<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Interactive Rating Star System</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

</head>

<body>

<section class="container">

<div class="rating-card">

<span class="badge">
High-Contrast Accessibility Edition
</span>

<h1>
Accessible
<span>Star Rating</span>
</h1>

<p class="subtitle">
A high-contrast, keyboard-friendly rating system featuring
micro-bounce animation, accessible colors and responsive layout.
</p>

<div class="stars" role="radiogroup" aria-label="Rating">

<span class="star" data-value="1" tabindex="0" role="radio" aria-label="1 Star">★</span>

<span class="star" data-value="2" tabindex="0" role="radio" aria-label="2 Stars">★</span>

<span class="star" data-value="3" tabindex="0" role="radio" aria-label="3 Stars">★</span>

<span class="star" data-value="4" tabindex="0" role="radio" aria-label="4 Stars">★</span>

<span class="star" data-value="5" tabindex="0" role="radio" aria-label="5 Stars">★</span>

</div>

<div class="rating-info">

<h2 id="rating-number">
0 / 5
</h2>

<p id="rating-text">
Choose your rating.
</p>

</div>

<div class="progress">

<div class="progress-fill" id="progress-fill"></div>

</div>

<div class="actions">

<button id="submit-btn">
Submit Rating
</button>

<button id="reset-btn">
Reset
</button>

</div>

</div>

</section>

<script src="script.js"></script>

</body>
</html>
