<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Magnetic Cursor Trail | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="magstage" id="stage">
    <span class="magdot"></span>
    <span class="magdot"></span>
    <span class="magdot"></span>
    <span class="magdot"></span>
    <span class="magdot"></span>
    <h1 class="magtext">MOVE YOUR MOUSE</h1>
  </div>
  <script>
    const stage = document.getElementById('stage');
    const dots = stage.querySelectorAll('.magdot');
    const positions = Array(5).fill({ x: window.innerWidth/2, y: window.innerHeight/2 });
    let mouseX = window.innerWidth/2;
    let mouseY = window.innerHeight/2;
    document.addEventListener('mousemove', (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;
    });
    function animate() {
      positions[0] = { x: mouseX, y: mouseY };
      for (let i = 1; i < 5; i++) {
        positions[i] = {
          x: positions[i].x + (positions[i-1].x - positions[i].x) * 0.3,
          y: positions[i].y + (positions[i-1].y - positions[i].y) * 0.3
        };
      }
      dots.forEach((dot, i) => {
        dot.style.left = positions[i].x + 'px';
        dot.style.top = positions[i].y + 'px';
      });
      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>
