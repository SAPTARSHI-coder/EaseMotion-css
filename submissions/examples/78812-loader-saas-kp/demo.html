<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Animated Loader - SaaS Modern</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="saas-demo" aria-labelledby="loader-title">
    <section class="saas-panel">
      <p class="eyebrow">Realtime workspace</p>
      <h1 id="loader-title">Animated Loader</h1>
      <p class="summary">A focused loading state for modern SaaS dashboards while widgets, charts, and permissions sync.</p>
      <div class="loader-card" role="status" aria-live="polite">
        <span class="saas-loader" aria-hidden="true"><i></i><i></i><i></i><b></b><b></b><b></b></span>
        <strong>Preparing dashboard</strong>
        <small>Syncing widgets and permissions</small>
      </div>
    </section>
  </main>
</body>
</html>
