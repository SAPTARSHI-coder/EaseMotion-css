<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Animated Deploy Pipeline - EaseMotion CSS</title>
  <!-- Import EaseMotion CSS -->
  <link rel="stylesheet" href="../../../easemotion.css">
  <!-- Component Specific Styles -->
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@500&display=swap" rel="stylesheet">
</head>
<body class="minimalist-bg">

  <div class="demo-container">
    
    <div class="header-section">
      <h1 class="ease-text-3xl">Animated Deploy Pipeline</h1>
      <p class="ease-color-muted">Pure CSS CI/CD status indicators. Responsive timeline with animated loading states and semantic HTML structure.</p>
    </div>

    <!-- Pipeline Card -->
    <div class="pipeline-card ease-glass-card">
      
      <div class="pipeline-header">
        <div class="pipeline-meta">
          <h2>Production Deployment</h2>
          <span class="commit-hash">commit <span>#a7f29b4</span></span>
        </div>
        <div class="pipeline-timer">02:45 elapsed</div>
      </div>

      <!-- The Pipeline Component -->
      <nav aria-label="Deployment Progress">
        <ol class="pipeline-track">
          
          <!-- Step 1: Success -->
          <li class="pipeline-step status-success">
            <div class="step-content">
              <div class="step-indicator" aria-label="Completed: Build">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
              </div>
              <div class="step-details">
                <span class="step-label">Build</span>
                <span class="step-time">1m 12s</span>
              </div>
            </div>
          </li>
          
          <!-- Step 2: Running -->
          <li class="pipeline-step status-running" aria-current="step">
            <div class="step-content">
              <div class="step-indicator" aria-label="In Progress: Integration Tests">
                <div class="spinner"></div>
              </div>
              <div class="step-details">
                <span class="step-label">Integration Tests</span>
                <span class="step-time">Running...</span>
              </div>
            </div>
          </li>
          
          <!-- Step 3: Pending -->
          <li class="pipeline-step status-pending">
            <div class="step-content">
              <div class="step-indicator" aria-label="Pending: Deploy to AWS"></div>
              <div class="step-details">
                <span class="step-label">Deploy to AWS</span>
                <span class="step-time">Pending</span>
              </div>
            </div>
          </li>
          
          <!-- Step 4: Pending -->
          <li class="pipeline-step status-pending">
            <div class="step-content">
              <div class="step-indicator" aria-label="Pending: Health Checks"></div>
              <div class="step-details">
                <span class="step-label">Health Checks</span>
                <span class="step-time">Pending</span>
              </div>
            </div>
          </li>

        </ol>
      </nav>

    </div>

  </div>

</body>
</html>
