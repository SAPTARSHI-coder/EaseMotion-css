<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accessible Breadcrumb Demo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <main class="demo-container">
        <h1>Product Details</h1>
        
        <!-- 
            CRITICAL ACCESSIBILITY: Semantic Navigation 
            Wrap breadcrumbs in a <nav> element and provide a clear aria-label
            so screen readers can distinguish it from primary site navigation.
        -->
        <nav aria-label="Breadcrumb" class="breadcrumb-nav">
            <!-- 
                CRITICAL ACCESSIBILITY: Ordered List
                Use an ordered list <ol> so screen readers announce the total number of items 
                and the user's current position within the path.
            -->
            <ol class="breadcrumb-list">
                
                <li class="breadcrumb-item">
                    <a href="#" class="breadcrumb-link">Home</a>
                    <!-- Hide separators from screen readers to prevent noise -->
                    <span class="breadcrumb-separator" aria-hidden="true">/</span>
                </li>
                
                <li class="breadcrumb-item">
                    <a href="#" class="breadcrumb-link">Electronics</a>
                    <span class="breadcrumb-separator" aria-hidden="true">/</span>
                </li>
                
                <li class="breadcrumb-item">
                    <a href="#" class="breadcrumb-link">Laptops</a>
                    <span class="breadcrumb-separator" aria-hidden="true">/</span>
                </li>
                
                <!-- 
                    CRITICAL ACCESSIBILITY: Current Page 
                    Use aria-current="page" to programmatically identify the active item.
                    We also use this attribute as our CSS selector to enforce semantic styling.
                -->
                <li class="breadcrumb-item">
                    <a href="#" class="breadcrumb-link" aria-current="page">MacBook Pro</a>
                </li>
                
            </ol>
        </nav>

        <div class="content-placeholder">
            <p>Welcome to the MacBook Pro product details page.</p>
        </div>
    </main>

</body>
</html>
