<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FEATURE] CSS Color Palette Chip — Demo (#68262)</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main style="font-family: system-ui, sans-serif; padding: 2.5rem; display:grid; gap:1.25rem; place-content:start;">
    <h2 style="margin:0 0 .5rem;">FEATURE] CSS Color Palette Chip</h2>
    <p style="color:#6b7280;margin:0;">Hover and toggle the <code>is-visible</code> class to see the entrance + sheen animation. Respects <code>prefers-reduced-motion</code>.</p>

    <div class="em-feature-css-color-palette-chip is-visible">Default visible state — example label</div>

    <div class="em-feature-css-color-palette-chip is-visible" role="status">Secondary instance with sheen on hover</div>

    <button onclick="document.querySelectorAll('.em-feature-css-color-palette-chip').forEach(el=>el.classList.toggle('is-visible'))"
      style="justify-self:start;padding:.6rem 1rem;border-radius:10px;border:1px solid #d1d5db;background:#fff;cursor:pointer;font-weight:600;">
      Toggle animation
    </button>
  </main>
</body>
</html>
