<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="./style.css">
<title>ID Badge Card Demo</title>
</head>
<body>
<main class="ibc-container" role="main" aria-label="ID Badge Card Visualizer">
  <div class="ibc-wrapper">
    <div class="ibc-lanyard-strap"></div>
    <div class="ibc-lanyard-clip"></div>
    <div class="ibc-card" role="region" aria-label="Employee Identification Badge">
      <div class="ibc-clip-hole"></div>
      <div class="ibc-header">
        <span class="ibc-company-logo"></span>
        <span class="ibc-company-name">EASE MOTION</span>
      </div>
      <div class="ibc-avatar-box">
        <div class="ibc-avatar-placeholder"></div>
        <div class="ibc-status-indicator" title="Active Status"></div>
      </div>
      <div class="ibc-info">
        <h1 class="ibc-name">Alex Morgan</h1>
        <p class="ibc-role">Lead Frontend Engineer</p>
        <span class="ibc-id-tag">ID: #8042-EM</span>
      </div>
      <div class="ibc-footer">
        <div class="ibc-barcode">
          <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
        </div>
      </div>
    </div>
  </div>
</main>
</body>
</html>
