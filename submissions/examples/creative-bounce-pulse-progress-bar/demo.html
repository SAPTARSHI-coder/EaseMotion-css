<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        Bounce-Pulse Progress Bar | EaseMotion CSS
    </title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<main class="container">


    <section class="hero">

        <span class="badge">
            EaseMotion CSS
        </span>


        <h1>
            Bounce-Pulse Progress Bar
        </h1>


        <p>
            A modern CSS-only progress bar
            featuring smooth bounce and pulse
            animations for creative layouts.
        </p>

    </section>



    <section class="progress-section">



        <div class="progress-card">


            <h2>
                Frontend Development
            </h2>


            <div class="progress-track">


                <div class="progress-fill frontend">

                    <span>
                        85%
                    </span>

                </div>


            </div>


        </div>





        <div class="progress-card">


            <h2>
                UI/UX Design
            </h2>


            <div class="progress-track">


                <div class="progress-fill design">

                    <span>
                        75%
                    </span>

                </div>


            </div>


        </div>





        <div class="progress-card">


            <h2>
                Artificial Intelligence
            </h2>


            <div class="progress-track">


                <div class="progress-fill ai">

                    <span>
                        90%
                    </span>

                </div>


            </div>


        </div>



    </section>



</main>



</body>

</html>
