<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Command Palette Modal &mdash; EaseMotion CSS Demo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="page-head">
    <p class="kicker">EaseMotion CSS &middot; Dev Tools</p>
    <h1>Command Palette Modal</h1>
    <p class="sub">Press your shortcut &mdash; the palette springs into view.</p>
  </header>
  <main class="stage">
    <div class="cm-backdrop">
      <div class="cm-palette">
        <div class="cm-search">
          <span>&#128269;</span>
          <input placeholder="Type a command&hellip;" />
          <span class="cm-caret"></span>
        </div>
        <div class="cm-row"><span class="cm-icon">&#9881;</span> Preferences <span class="cm-kbd">Ctrl ,</span></div>
        <div class="cm-row"><span class="cm-icon">&#128190;</span> Go to file <span class="cm-kbd">Ctrl P</span></div>
        <div class="cm-row"><span class="cm-icon">&#9998;</span> Toggle theme <span class="cm-kbd">Ctrl K</span></div>
      </div>
    </div>
  </main>
  <p class="stage-caption">Rows nudge right and tint purple on hover.</p>
  <footer class="page-foot">
    <span>Pure CSS &middot; zero dependencies</span>
    <span>Springy palette</span>
  </footer>
</body>
</html>
