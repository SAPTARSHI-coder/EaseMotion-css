<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ease-drag-panel-collapse-resize-sap demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { height: 100vh; margin: 0; display: flex; align-items: center; justify-content: center; background: #f4f4f5; }
  </style>
</head>
<body>
  <div class="collapse-resize-sap" id="panel">
    <div class="sidebar-pane" id="sidebar">Sidebar navigation content</div>
    <div class="toggle-handle" id="handle"></div>
    <div class="main-pane">Main content area</div>
  </div>
  <script>
    document.getElementById('handle').addEventListener('dblclick', () => {
      document.getElementById('sidebar').classList.toggle('collapsed');
    });
  </script>
</body>
</html>
