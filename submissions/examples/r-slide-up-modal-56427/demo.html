<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Slide-Up Modal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<input type="checkbox" id="modal-toggle" hidden>

<section class="hero">

    <h1>Gaming Hub</h1>

    <p>
        Unlock exclusive rewards using this smooth Slide-Up Modal built entirely with HTML and CSS.
    </p>

    <label for="modal-toggle" class="open-btn">
        Open Rewards
    </label>

</section>

<div class="overlay">

    <div class="modal">

        <label for="modal-toggle" class="close-btn">&times;</label>

        <div class="icon">🎮</div>

        <h2>Mission Complete!</h2>

        <p>
            You've completed today's gaming challenge and unlocked a legendary loot crate.
        </p>

        <label for="modal-toggle" class="action-btn">
            Claim Reward
        </label>

    </div>

</div>

</body>
</html>
