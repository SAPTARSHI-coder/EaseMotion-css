<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Diamond Facet Edge CSS media player component">
  <title>Diamond Facet Edge Media Player</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section class="media-card" aria-label="Audio media player">
      <div class="facet facet-top" aria-hidden="true"></div>
      <div class="facet facet-bottom" aria-hidden="true"></div>

      <div class="media-content">
        <span class="eyebrow">AUDIO EXPERIENCE</span>

        <h1>Diamond Facet</h1>

        <p class="track">
          Atmospheric Motion
        </p>

        <div class="visualizer" aria-hidden="true">
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
        </div>

        <div class="player-controls">
          <button class="control" type="button" aria-label="Previous track">
            &#9664;&#9664;
          </button>

          <button
            class="play-button"
            type="button"
            aria-label="Play or pause"
            aria-pressed="false"
          >
            &#9654;
          </button>

          <button class="control" type="button" aria-label="Next track">
            &#9654;&#9654;
          </button>
        </div>

        <div class="progress-area">
          <span>0:00</span>
          <div class="progress-track">
            <div class="progress-value"></div>
          </div>
          <span>3:42</span>
        </div>

        <div class="volume">
          <label for="volume">Volume</label>
          <input
            id="volume"
            type="range"
            min="0"
            max="100"
            value="70"
          >
        </div>
      </div>
    </section>
  </main>
</body>
</html>
