<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Fold-Out Origami Menu</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="ease-origami-container">
        <!-- Hidden checkbox for state management -->
        <input type="checkbox" id="origami-toggle" class="origami-toggle">
        
        <!-- Main Toggle Button -->
        <label for="origami-toggle" class="main-toggle-btn">
            <span>Explore Menu</span>
            <div class="hamburger">
                <span></span><span></span><span></span>
            </div>
        </label>

        <!-- Fold Wrapper containing nested panels -->
        <div class="ease-fold-wrapper">
            <!-- Panel 1 (Root Hinge) -->
            <div class="ease-fold-panel panel-1">
                <div class="panel-content">
                    <h3>Home</h3>
                    <p>Dashboard & Overview</p>
                </div>
                
                <!-- Panel 2 -->
                <div class="ease-fold-panel panel-2">
                    <div class="panel-content">
                        <h3>Projects</h3>
                        <p>Your active repositories</p>
                    </div>
                    
                    <!-- Panel 3 -->
                    <div class="ease-fold-panel panel-3">
                        <div class="panel-content">
                            <h3>Analytics</h3>
                            <p>Statistics and charts</p>
                        </div>
                        
                        <!-- Panel 4 -->
                        <div class="ease-fold-panel panel-4">
                            <div class="panel-content">
                                <h3>Settings</h3>
                                <p>Preferences & Account</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
