<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glowing Avatar | Retro Styling</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="avatar-card" tabindex="0" aria-label="Glowing Retro Avatar Profile Showcase">
    <h1 class="card-title">Retro User Profile</h1>
    <p class="card-subtitle">80s Synthwave avatar frame with luminous pulse glow</p>

    <div class="avatar-wrapper">
        <div class="avatar-frame">
            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=300&q=80" alt="Cyberpunk user profile photo" class="avatar-img">
        </div>
        <span class="avatar-badge" title="Online" aria-label="Online status"></span>
    </div>

    <h2 class="user-name">Alex_Cyber</h2>
    <p class="user-role">Grid Runner / Level 99</p>
</main>

</body>
</html>
