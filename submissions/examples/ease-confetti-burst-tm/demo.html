<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ease-confetti-burst Demo</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 40px;
      min-height: 100vh;
      background: var(--confetti-bg);
    }
    h1 {
      font-size: 1.5rem;
      color: var(--confetti-text);
      text-align: center;
    }
    .demo-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }
    .demo-label {
      font-size: 0.85rem;
      color: rgba(223, 230, 233, 0.6);
    }
    .confetti-container {
      width: 320px;
      height: 320px;
    }
    .variant-label {
      font-size: 0.8rem;
      color: rgba(223, 230, 233, 0.5);
      margin-top: 12px;
    }
    .btn-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }
  </style>
</head>
<body>

  <h1>ease-confetti-burst Component</h1>

  <!-- Standard triggered burst -->
  <div class="demo-section">
    <span class="demo-label">Click the button to trigger the burst</span>
    <div class="confetti-container" id="burst-standard">
      <button class="confetti-trigger" onclick="triggerBurst('burst-standard')">
        Celebrate!
      </button>
      <div class="confetti-particle color-primary"></div>
      <div class="confetti-particle color-secondary"></div>
      <div class="confetti-particle color-accent"></div>
      <div class="confetti-particle color-warning"></div>
      <div class="confetti-particle color-success"></div>
      <div class="confetti-particle color-primary"></div>
      <div class="confetti-particle color-secondary"></div>
      <div class="confetti-particle color-accent"></div>
      <div class="confetti-particle color-warning"></div>
      <div class="confetti-particle color-success"></div>
      <div class="confetti-particle color-primary size-sm"></div>
      <div class="confetti-particle color-secondary size-sm"></div>
      <div class="confetti-particle color-accent size-sm"></div>
      <div class="confetti-particle color-warning size-sm"></div>
      <div class="confetti-particle color-success size-sm"></div>
      <div class="confetti-particle color-primary shape-circle"></div>
      <div class="confetti-particle color-secondary shape-circle"></div>
      <div class="confetti-particle color-accent shape-circle"></div>
      <div class="confetti-particle color-warning shape-circle"></div>
      <div class="confetti-particle color-success shape-circle"></div>
    </div>
  </div>

  <!-- Dense variant -->
  <div class="demo-section">
    <span class="demo-label">Dense variant (more particles)</span>
    <div class="confetti-container dense" id="burst-dense">
      <button class="confetti-trigger" style="background: var(--confetti-accent)" onclick="triggerBurst('burst-dense')">
        Dense Burst
      </button>
      <div class="confetti-particle color-primary"></div>
      <div class="confetti-particle color-secondary"></div>
      <div class="confetti-particle color-accent"></div>
      <div class="confetti-particle color-warning"></div>
      <div class="confetti-particle color-success"></div>
      <div class="confetti-particle color-primary"></div>
      <div class="confetti-particle color-secondary"></div>
      <div class="confetti-particle color-accent"></div>
      <div class="confetti-particle color-warning"></div>
      <div class="confetti-particle color-success"></div>
      <div class="confetti-particle color-primary size-sm"></div>
      <div class="confetti-particle color-secondary size-sm"></div>
      <div class="confetti-particle color-accent size-sm"></div>
      <div class="confetti-particle color-warning size-sm"></div>

      <div class="confetti-particle color-warning shape-circle"></div>
      <div class="confetti-particle color-success shape-circle"></div>

  </div>

  <!-- Circle shapes variant -->
  <div class="demo-section">
    <span class="demo-label">Circle shapes variant</span>
    <div class="confetti-container" id="burst-circles">
      <button class="confetti-trigger" style="background: var(--confetti-secondary)" onclick="triggerBurst('burst-circles')">
        Circle Burst

      <div class="confetti-particle color-success shape-circle"></div>
      <div class="confetti-particle color-primary shape-circle size-lg"></div>

      <div class="confetti-particle color-warning shape-circle"></div>
      <div class="confetti-particle color-success shape-circle"></div>
      <div class="confetti-particle color-primary shape-circle size-sm"></div>

        <div class="confetti-particle color-success size-sm"></div>
        <div class="confetti-particle color-primary size-sm"></div>
        <div class="confetti-particle color-secondary size-sm"></div>
        <div class="confetti-particle color-accent size-sm"></div>
        <div class="confetti-particle color-warning size-sm"></div>
        <div class="confetti-particle color-success size-sm"></div>
        <div class="confetti-particle color-primary size-sm"></div>
        <div class="confetti-particle color-secondary size-sm"></div>
        <div class="confetti-particle color-accent size-sm"></div>

        <div class="confetti-particle color-success size-sm"></div>
        <div class="confetti-particle color-primary size-sm"></div>

        <div class="confetti-particle color-secondary size-md"></div>

        <div class="confetti-particle color-primary size-md"></div>

        <div class="confetti-particle color-warning size-md"></div>

        <div class="confetti-particle color-accent size-md"></div>
        <div class="confetti-particle color-warning size-md"></div>
        <div class="confetti-particle color-success size-md"></div>

        <div class="confetti-particle color-secondary size-md"></div>
        <div class="confetti-particle color-accent size-md"></div>
        <div class="confetti-particle color-warning size-md"></div>

      </div>
      <div class="confetti-container" id="burst-lg">
        <button class="confetti-trigger" style="background: var(--confetti-success); padding: 20px 40px; font-size: 1.2rem;" onclick="triggerBurst('burst-lg')">

        <div class="confetti-particle color-primary size-lg"></div>
        <div class="confetti-particle color-secondary size-lg"></div>

        <div class="confetti-particle color-secondary size-lg"></div>

        <div class="confetti-particle color-warning size-lg"></div>
        <div class="confetti-particle color-success size-lg"></div>
      </div>
    </div>
  </div>

  <div class="component-label">ease-confetti-burst | Issue #64950</div>

  <script>
    function triggerBurst(id) {
      var el = document.getElementById(id);
      var particles = el.querySelectorAll('.confetti-particle');
      particles.forEach(function(p) {
        p.style.animation = 'none';
        p.offsetHeight; // force reflow
        p.style.animation = '';
      });
    }
  </script>
</body>
</html>
