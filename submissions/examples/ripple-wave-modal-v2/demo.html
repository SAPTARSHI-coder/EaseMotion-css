<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ripple-Wave Modal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<input type="checkbox" id="modal-toggle" hidden>

<label for="modal-toggle" class="open-btn">
    Open Modal
</label>

<div class="overlay">
    <div class="modal">
        <label for="modal-toggle" class="close-btn">&times;</label>

        <h2>Ripple-Wave Modal</h2>
        <p>
            A pure CSS modal featuring a ripple-wave entrance animation with
            responsive layout and accessibility support.
        </p>

        <button class="action-btn">Continue</button>
    </div>
</div>

</body>
</html>
