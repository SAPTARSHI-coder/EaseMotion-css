<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Open Source Contribution Card</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="osc-page-sum">
      <header class="osc-header-sum">
        <h1>Open Source Contribution Card</h1>
        <p>Build an EaseMotion-branded share card from repo meta, then export PNG.</p>
      </header>

      <div class="osc-layout-sum">
        <form class="osc-form-sum" id="osc-form-sum" aria-label="Repository metadata">
          <label>
            Repo owner/name
            <input id="osc-repo-sum" type="text" value="SAPTARSHI-coder/EaseMotion-css" />
          </label>
          <label>
            Description
            <textarea id="osc-desc-sum" rows="3">Zero-dependency, animation-first CSS framework.</textarea>
          </label>
          <label>
            Contributor
            <input id="osc-user-sum" type="text" value="suman20041" />
          </label>
          <label>
            Stars
            <input id="osc-stars-sum" type="number" min="0" value="1200" />
          </label>
          <div class="osc-actions-sum">
            <button type="button" id="osc-fetch-sum">Fetch from GitHub</button>
            <button type="button" id="osc-export-sum">Export PNG</button>
          </div>
          <p class="osc-status-sum" id="osc-status-sum" role="status" aria-live="polite"></p>
        </form>

        <section class="osc-preview-wrap-sum" aria-label="Card preview">
          <article class="osc-card-sum" id="osc-card-sum">
            <div class="osc-brand-sum">EaseMotion CSS</div>
            <h2 id="osc-card-repo-sum">SAPTARSHI-coder/EaseMotion-css</h2>
            <p id="osc-card-desc-sum">Zero-dependency, animation-first CSS framework.</p>
            <div class="osc-meta-sum">
              <span>★ <strong id="osc-card-stars-sum">1200</strong></span>
              <span>by <strong id="osc-card-user-sum">suman20041</strong></span>
            </div>
            <footer class="osc-footer-sum">Human-readable motion for the web</footer>
          </article>
          <canvas id="osc-canvas-sum" width="960" height="540" hidden aria-hidden="true"></canvas>
        </section>
      </div>
    </main>

    <script>
      (function () {
        var repo = document.getElementById('osc-repo-sum');
        var desc = document.getElementById('osc-desc-sum');
        var user = document.getElementById('osc-user-sum');
        var stars = document.getElementById('osc-stars-sum');
        var status = document.getElementById('osc-status-sum');
        var card = document.getElementById('osc-card-sum');

        function syncCard() {
          document.getElementById('osc-card-repo-sum').textContent = repo.value || 'owner/repo';
          document.getElementById('osc-card-desc-sum').textContent = desc.value || 'No description';
          document.getElementById('osc-card-user-sum').textContent = user.value || 'contributor';
          document.getElementById('osc-card-stars-sum').textContent = String(stars.value || 0);
          card.classList.remove('osc-card-sum--pulse');
          void card.offsetWidth;
          card.classList.add('osc-card-sum--pulse');
        }

        ['input', 'change'].forEach(function (evt) {
          repo.addEventListener(evt, syncCard);
          desc.addEventListener(evt, syncCard);
          user.addEventListener(evt, syncCard);
          stars.addEventListener(evt, syncCard);
        });

        document.getElementById('osc-fetch-sum').addEventListener('click', function () {
          var slug = (repo.value || '').trim();
          if (!slug.includes('/')) {
            status.textContent = 'Use owner/repo format.';
            return;
          }
          status.textContent = 'Fetching…';
          fetch('https://api.github.com/repos/' + slug)
            .then(function (res) {
              if (!res.ok) throw new Error('Repo not found');
              return res.json();
            })
            .then(function (data) {
              desc.value = data.description || '';
              stars.value = data.stargazers_count || 0;
              syncCard();
              status.textContent = 'Fetched metadata for ' + data.full_name;
            })
            .catch(function () {
              status.textContent = 'Could not fetch repo. Fill fields manually.';
            });
        });

        document.getElementById('osc-export-sum').addEventListener('click', function () {
          var canvas = document.getElementById('osc-canvas-sum');
          var ctx = canvas.getContext('2d');
          var grd = ctx.createLinearGradient(0, 0, 960, 540);
          grd.addColorStop(0, '#1e1b4b');
          grd.addColorStop(1, '#6c63ff');
          ctx.fillStyle = grd;
          ctx.fillRect(0, 0, 960, 540);
          ctx.fillStyle = '#ffffff';
          ctx.font = 'bold 28px system-ui,sans-serif';
          ctx.fillText('EaseMotion CSS', 64, 100);
          ctx.font = 'bold 42px system-ui,sans-serif';
          ctx.fillText(repo.value || 'owner/repo', 64, 180);
          ctx.font = '24px system-ui,sans-serif';
          wrapText(ctx, desc.value || '', 64, 240, 820, 34);
          ctx.font = '22px system-ui,sans-serif';
          ctx.fillText('★ ' + (stars.value || 0) + '   by ' + (user.value || 'contributor'), 64, 420);
          ctx.font = '18px system-ui,sans-serif';
          ctx.fillStyle = 'rgba(255,255,255,0.8)';
          ctx.fillText('Human-readable motion for the web', 64, 480);
          var link = document.createElement('a');
          link.download = 'easemotion-contribution-card.png';
          link.href = canvas.toDataURL('image/png');
          link.click();
          status.textContent = 'PNG exported.';
        });

        function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
          var words = text.split(' ');
          var line = '';
          for (var n = 0; n < words.length; n++) {
            var test = line + words[n] + ' ';
            if (ctx.measureText(test).width > maxWidth && n > 0) {
              ctx.fillText(line, x, y);
              line = words[n] + ' ';
              y += lineHeight;
            } else {
              line = test;
            }
          }
          ctx.fillText(line, x, y);
        }
      })();
    </script>
  </body>
</html>
