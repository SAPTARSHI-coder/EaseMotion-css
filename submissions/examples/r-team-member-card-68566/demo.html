<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Responsive CSS team member card.">
  <title>CSS Team Member Card</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="team-card" aria-labelledby="member-name">
    <div class="avatar-wrap">
      <div class="avatar" aria-hidden="true">RC</div>
      <span class="status" aria-label="Available"></span>
    </div>

    <span class="role">Frontend Engineer</span>

    <h1 id="member-name">Riya Chauhan</h1>

    <p class="bio">
      Builds accessible interfaces, expressive animations, and
      polished frontend experiences.
    </p>

    <div class="skills" aria-label="Skills">
      <span>CSS</span>
      <span>React</span>
      <span>UI</span>
    </div>

    <nav class="socials" aria-label="Social links">
      <a href="#" aria-label="GitHub profile">GH</a>
      <a href="#" aria-label="LinkedIn profile">in</a>
      <a href="#" aria-label="Email member">@</a>
    </nav>
  </main>

</body>
</html>
