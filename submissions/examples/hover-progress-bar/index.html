<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hover Progress Bar with Dark Mode Styling - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="em-demo-container">
        <!-- Pure CSS Hover Progress Bar Component Showcase with Dark Mode Styling -->
        <header class="em-progress-card" role="region" aria-label="Hover Progress Bar Showcase" tabindex="0">
            <div class="em-progress-header-bar">
                <span class="em-card-badge">COMPONENT CONTRIBUTION</span>
                <span class="em-brand-logo">DarkMotion</span>
            </div>
            <h1 class="em-card-title">Hover Progress Bar</h1>
            <p class="em-card-desc">A fully responsive, pure CSS progress bar component featuring deep dark mode styling, frosted glassmorphism, and smooth hover expansion.</p>
            <div class="em-progress-wrapper" role="progressbar" aria-valuenow="75" aria-valuemin="0" aria-valuemax="100" aria-label="Task Completion Progress">
                <div class="em-progress-track">
                    <div class="em-progress-fill"></div>
                </div>
            </div>
        </header>
    </div>
</body>
</html>
