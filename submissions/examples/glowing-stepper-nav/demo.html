<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glowing Stepper Nav (SaaS Modern) Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="stepper-widget" aria-label="Subscription Setup Wizard">
    
    <header class="widget-header">
      <h1 class="widget-title">Onboarding Pipeline</h1>
      <p class="widget-desc">A pure CSS, hardware-accelerated glowing stepper component for modern SaaS applications.</p>
    </header>

    <!-- STEPPER NAVIGATION -->
    <nav aria-label="Progress">
      <ol class="stepper-nav" role="list">

        <!-- Step 1: Completed -->
        <li class="step-item is-completed">
          <a href="#step-1" class="step-item is-completed" aria-label="Step 1: Workspace setup - Completed">
            <span class="step-node" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"></polyline>
              </svg>
            </span>
            <div class="step-content">
              <span class="step-label">Workspace</span>
              <div class="step-subtext">Setup profile</div>
            </div>
          </a>
        </li>

        <!-- Step 2: Active -->
        <li class="step-item is-active">
          <a href="#step-2" class="step-item is-active" aria-current="step" aria-label="Step 2: Team Members - In Progress">
            <span class="step-node" aria-hidden="true">2</span>
            <div class="step-content">
              <span class="step-label">Invite Team</span>
              <div class="step-subtext">Collaborators</div>
            </div>
          </a>
        </li>

        <!-- Step 3: Upcoming -->
        <li class="step-item">
          <a href="#step-3" class="step-item" aria-label="Step 3: Billing Plan - Upcoming">
            <span class="step-node" aria-hidden="true">3</span>
            <div class="step-content">
              <span class="step-label">Billing</span>
              <div class="step-subtext">Select tier</div>
            </div>
          </a>
        </li>

        <!-- Step 4: Upcoming -->
        <li class="step-item">
          <a href="#step-4" class="step-item" aria-label="Step 4: Launch - Upcoming">
            <span class="step-node" aria-hidden="true">4</span>
            <div class="step-content">
              <span class="step-label">Deploy</span>
              <div class="step-subtext">Go live</div>
            </div>
          </a>
        </li>

      </ol>
    </nav>

  </main>

</body>
</html>
