<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="CSS-only animated fire text effect"
  >

  <title>CSS Fire Text Effect</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="page">

    <header class="intro">
      <p class="eyebrow">EaseMotion CSS</p>

      <h1>CSS Fire Text Effect</h1>

      <p>
        A pure CSS animation that creates a glowing
        fire effect rising from the bottom of the text.
      </p>
    </header>

    <section
      class="fire-section"
      aria-labelledby="fire-title"
    >

      <h2 id="fire-title" class="sr-only">
        Animated fire text
      </h2>

      <div
        class="fire-text"
        tabindex="0"
        role="img"
        aria-label="Animated fiery text displaying the word Fire"
      >
        <span class="fire-layer fire-layer-back">
          FIRE
        </span>

        <span class="fire-layer fire-layer-middle">
          FIRE
        </span>

        <span class="fire-layer fire-layer-front">
          FIRE
        </span>

        <span class="fire-label">
          FIRE
        </span>
      </div>

      <p class="hint">
        Hover or focus the text to pause the animation.
      </p>

    </section>

  </main>

</body>
</html>
