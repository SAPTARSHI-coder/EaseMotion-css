<!-- EaseMotion component: smart-home-thermostat -->
<!doctype html>
<html lang="en" data-home="climate">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3, user-scalable=yes">
<title>Ease Smart Home Thermostat</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<section class="thermo-card">
  <header class="thermo-head">
    <span class="room-tag">Living Room</span>
    <span id="modeLabel" class="mode-tag">HEAT</span>
  </header>
  <div class="dial">
    <div class="dial-ring"></div>
    <div class="dial-core">
      <span id="tempValue" class="temp-read">21</span>
      <span class="temp-unit">deg C</span>
      <i id="fanIcon" class="fan-icon"></i>
    </div>
  </div>
  <div class="mode-row" role="group" aria-label="system mode">
    <button class="mode-btn heat-btn active-mode" type="button" data-mode="HEAT">Heat</button>
    <button class="mode-btn cool-btn" type="button" data-mode="COOL">Cool</button>
    <button class="mode-btn eco-btn" type="button" data-mode="ECO">Eco</button>
  </div>
  <footer class="thermo-foot">
    <span class="hum-read">Humidity 44%</span>
    <span class="energy-read">~0.8 kW</span>
  </footer>
</section>
<script>
const modeLabel=document.getElementById('modeLabel');
const fan=document.getElementById('fanIcon');
document.querySelectorAll('.mode-btn').forEach(button=>{
  button.addEventListener('click',()=>{
    document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active-mode'));
    button.classList.add('active-mode');
    modeLabel.textContent=button.dataset.mode;
    fan.classList.remove('spin');
    void fan.offsetWidth;
    fan.classList.add('spin');
  });
});
</script>
</body>
</html>
