<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Fade-In Stepper</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="catalog-layout">
        
        <h1 class="catalog-title">Account Setup</h1>
        
        <!-- The Stepper Component -->
        <div class="stepper-container">
            <!-- Step 1 (Completed) -->
            <div class="step completed">
                <div class="step-indicator">
                    <span class="step-icon">✓</span>
                </div>
                <div class="step-label">Profile</div>
            </div>
            
            <div class="step-connector completed-connector"></div>
            
            <!-- Step 2 (Active) -->
            <div class="step active fade-in-element">
                <div class="step-indicator">
                    <span class="step-number">2</span>
                </div>
                <div class="step-label">Preferences</div>
            </div>
            
            <div class="step-connector"></div>
            
            <!-- Step 3 (Pending) -->
            <div class="step">
                <div class="step-indicator">
                    <span class="step-number">3</span>
                </div>
                <div class="step-label">Billing</div>
            </div>
            
            <div class="step-connector"></div>
            
            <!-- Step 4 (Pending) -->
            <div class="step">
                <div class="step-indicator">
                    <span class="step-number">4</span>
                </div>
                <div class="step-label">Verify</div>
            </div>
        </div>
        
        <!-- Dummy Content Area for Context -->
        <div class="content-area fade-in-element">
            <h2>Step 2: Set Your Preferences</h2>
            <p>Tell us what you're interested in so we can tailor your catalog experience.</p>
            
            <div class="preferences-grid">
                <label class="pref-checkbox">
                    <input type="checkbox" checked>
                    <span class="pref-label">Technology & Gadgets</span>
                </label>
                <label class="pref-checkbox">
                    <input type="checkbox">
                    <span class="pref-label">Home Office Setup</span>
                </label>
                <label class="pref-checkbox">
                    <input type="checkbox" checked>
                    <span class="pref-label">Software Subscriptions</span>
                </label>
                <label class="pref-checkbox">
                    <input type="checkbox">
                    <span class="pref-label">Enterprise Solutions</span>
                </label>
            </div>
            
            <div class="actions">
                <button class="btn btn-secondary">Previous</button>
                <button class="btn btn-primary">Save & Continue</button>
            </div>
        </div>
        
    </div>
</body>
</html>
