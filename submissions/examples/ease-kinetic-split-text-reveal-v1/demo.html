<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ease Kinetic Staggered Split-Text Headline</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="split-text-body">
  <h1 class="split-title">
    <span style="--d:0ms">E</span>
    <span style="--d:50ms">A</span>
    <span style="--d:100ms">S</span>
    <span style="--d:150ms">E</span>
  </h1>
</body>
</html>
