<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ease Glass Blower Punty</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="glass-workstation">

    <h1>GLASS BLOWER CONTROL</h1>
    <p class="status">FURNACE ACTIVE • ROTATION STABLE</p>


    <div class="machine">

        <div class="housing">

            <span class="label">PUNTY SYSTEM</span>

            <div class="rod">
                <div class="gather"></div>
            </div>


            <div class="dial">
                <span>RPM</span>
                <b>120</b>
            </div>


        </div>


        <div class="panel">

            <div>
                <small>HEAT</small>
                <strong>980°C</strong>
            </div>

            <div>
                <small>ROTATION</small>
                <strong>ACTIVE</strong>
            </div>

            <div>
                <small>MODE</small>
                <strong>AUTO</strong>
            </div>

        </div>


    </div>

</div>


</body>
</html>
