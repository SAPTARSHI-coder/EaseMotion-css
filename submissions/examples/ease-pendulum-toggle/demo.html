<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pendulum Toggle – Swings Side to Side</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <h1>⏱️ Pendulum Toggle</h1>
    <p class="subtitle">Swings side to side with graceful motion</p>

    <div class="pendulum-container">
      <!-- Pendulum -->
      <div class="pendulum" id="pendulum">
        <div class="pivot">
          <div class="pivot-dot"></div>
        </div>
        <div class="arm" id="arm">
          <div class="arm-line"></div>
          <div class="bob" id="bob">
            <div class="bob-inner">
              <span class="bob-icon">⚡</span>
            </div>
            <div class="bob-glow"></div>
          </div>
        </div>
        <div class="toggle-indicator" id="toggleIndicator">
          <span class="indicator-label">OFF</span>
          <div class="indicator-track">
            <div class="indicator-thumb" id="indicatorThumb"></div>
          </div>
          <span class="indicator-label">ON</span>
        </div>
      </div>

      <!-- Controls -->
      <div class="controls">
        <button class="ctrl-btn start" id="startBtn">▶ Start</button>
        <button class="ctrl-btn pause" id="pauseBtn">⏸ Pause</button>
        <button class="ctrl-btn toggle" id="toggleBtn">🔄 Toggle</button>
        <button class="ctrl-btn reset" id="resetBtn">↺ Reset</button>
      </div>

      <!-- Speed Control -->
      <div class="slider-container">
        <span class="slider-label">Speed</span>
        <input type="range" id="speedSlider" min="0.1" max="3" step="0.1" value="1" />
        <span class="slider-value" id="speedValue">1.0×</span>
      </div>

      <!-- Angle Control -->
      <div class="slider-container">
        <span class="slider-label">Angle</span>
        <input type="range" id="angleSlider" min="10" max="60" step="1" value="30" />
        <span class="slider-value" id="angleValue">30°</span>
      </div>

      <!-- Status -->
      <div class="status" id="status">⏱️ Click Start to swing the pendulum</div>

      <!-- Stats -->
      <div class="stats">
        <span class="stat-item">Angle: <strong id="statAngle">0°</strong></span>
        <span class="stat-item">Speed: <strong id="statSpeed">0.0</strong></span>
        <span class="stat-item">Swing: <strong id="statSwing">0</strong></span>
      </div>

      <!-- Keyboard shortcuts -->
      <div class="shortcuts">
        <kbd>Space</kbd> Toggle · <kbd>←</kbd> <kbd>→</kbd> Speed · <kbd>↑</kbd> <kbd>↓</kbd> Angle
      </div>
    </div>
  </div>

  <script>
    (function() {
      "use strict";

      // DOM elements
      const pendulum = document.getElementById('pendulum');
      const arm = document.getElementById('arm');
      const bob = document.getElementById('bob');
      const toggleIndicator = document.getElementById('toggleIndicator');
      const indicatorThumb = document.getElementById('indicatorThumb');
      const startBtn = document.getElementById('startBtn');
      const pauseBtn = document.getElementById('pauseBtn');
      const toggleBtn = document.getElementById('toggleBtn');
      const resetBtn = document.getElementById('resetBtn');
      const speedSlider = document.getElementById('speedSlider');
      const angleSlider = document.getElementById('angleSlider');
      const speedValue = document.getElementById('speedValue');
      const angleValue = document.getElementById('angleValue');
      const status = document.getElementById('status');
      const statAngle = document.getElementById('statAngle');
      const statSpeed = document.getElementById('statSpeed');
      const statSwing = document.getElementById('statSwing');

      // State
      let isRunning = false;
      let isPaused = false;
      let angle = 0; // Current angle in degrees
      let velocity = 0;
      let maxAngle = 30; // Maximum swing angle in degrees
      let speedMultiplier = 1;
      let time = 0;
      let swingCount = 0;
      let lastDirection = 1;
      let animationId = null;

      // Physics constants
      const GRAVITY = 0.5;
      const DAMPING = 0.995;

      // ----- Update pendulum -----
      function updatePendulum() {
        // Convert angle to radians for physics
        const angleRad = angle * Math.PI / 180;

        // Apply rotation to arm
        arm.style.transform = `rotate(${angle}deg)`;

        // Update bob glow based on speed
        const speed = Math.abs(velocity);
        const glowIntensity = Math.min(1, speed / 3);
        bob.style.boxShadow = `0 0 ${20 + glowIntensity * 40}px rgba(255, 200, 100, ${0.2 + glowIntensity * 0.6})`;
        bob.style.transform = `scale(${1 + glowIntensity * 0.05})`;

        // Update toggle indicator based on angle
        const normalizedAngle = angle / maxAngle;
        const indicatorPos = 50 + normalizedAngle * 40;
        indicatorThumb.style.left = Math.max(10, Math.min(90, indicatorPos)) + '%';

        // Update stats
        statAngle.textContent = Math.round(Math.abs(angle)) + '°';
        statSpeed.textContent = Math.abs(velocity).toFixed(1);
        statSwing.textContent = swingCount;

        // Update status if at extreme
        if (Math.abs(angle) > maxAngle * 0.9) {
          const direction = angle > 0 ? 'right' : 'left';
          status.textContent = `⏱️ Swinging ${direction} at ${Math.round(Math.abs(angle))}°`;
        }
      }

      // ----- Physics update -----
      function physicsUpdate() {
        if (!isRunning || isPaused) return;

        // Simple pendulum physics: angular acceleration = -g/L * sin(theta)
        // Using scaled gravity for visual effect
        const angleRad = angle * Math.PI / 180;
        const acceleration = -GRAVITY * Math.sin(angleRad) * speedMultiplier;

        // Update velocity and angle (Verlet-like integration)
        velocity += acceleration * 0.016; // Assume ~60fps
        velocity *= DAMPING;

        // Clamp velocity to prevent instability
        if (Math.abs(velocity) > 15) {
          velocity = Math.sign(velocity) * 15;
        }

        angle += velocity * 0.016 * 60;

        // Check direction change for swing count
        const currentDirection = Math.sign(velocity);
        if (currentDirection !== 0 && currentDirection !== lastDirection) {
          if (Math.abs(angle) > 5) { // Only count significant swings
            swingCount++;
          }
          lastDirection = currentDirection;
        }

        // Apply max angle limits (elastic collision)
        if (Math.abs(angle) > maxAngle) {
          angle = Math.sign(angle) * maxAngle;
          velocity *= -0.7; // Energy loss on bounce
        }

        // Update display
        updatePendulum();
      }

      // ----- Animation loop -----
      function animate() {
        physicsUpdate();
        animationId = requestAnimationFrame(animate);
      }

      // ----- Start pendulum -----
      function startPendulum() {
        if (isRunning && !isPaused) return;

        if (angle === 0 && velocity === 0) {
          // Start with a nudge
          angle = maxAngle * 0.3;
          velocity = 1;
          swingCount = 0;
          lastDirection = 1;
        }

        isRunning = true;
        isPaused = false;
        status.textContent = '⏱️ Pendulum swinging!';
        startBtn.textContent = '▶ Running';
        startBtn.style.opacity = '0.6';
        pauseBtn.textContent = '⏸ Pause';

        if (!animationId) {
          animate();
        }
      }

      // ----- Pause pendulum -----
      function pausePendulum() {
        if (!isRunning) return;
        isPaused = !isPaused;
        pauseBtn.textContent = isPaused ? '▶ Resume' : '⏸ Pause';
        status.textContent = isPaused ? '⏸ Paused' : '⏱️ Resumed';
        startBtn.textContent = isPaused ? '⏸ Paused' : '▶ Running';
      }

      // ----- Toggle pendulum (on/off) -----
      function togglePendulum() {
        if (!isRunning) {
          startPendulum();
          return;
        }
        pausePendulum();
      }

      // ----- Reset pendulum -----
      function resetPendulum() {
        isRunning = false;
        isPaused = false;
        angle = 0;
        velocity = 0;
        swingCount = 0;
        lastDirection = 1;
        time = 0;

        if (animationId) {
          cancelAnimationFrame(animationId);
          animationId = null;
        }

        arm.style.transform = 'rotate(0deg)';
        bob.style.boxShadow = '0 0 20px rgba(255, 200, 100, 0.1)';
        bob.style.transform = 'scale(1)';
        indicatorThumb.style.left = '50%';
        statAngle.textContent = '0°';
        statSpeed.textContent = '0.0';
        statSwing.textContent = '0';
        status.textContent = '↺ Reset — Click Start to swing';
        startBtn.textContent = '▶ Start';
        startBtn.style.opacity = '1';
        pauseBtn.textContent = '⏸ Pause';
      }

      // ----- Update speed -----
      function updateSpeed(value) {
        speedMultiplier = parseFloat(value);
        speedValue.textContent = speedMultiplier.toFixed(1) + '×';
        statSpeed.textContent = Math.abs(velocity).toFixed(1);
      }

      // ----- Update angle -----
      function updateAngle(value) {
        maxAngle = parseFloat(value);
        angleValue.textContent = maxAngle + '°';
        // If pendulum is stopped, update visual
        if (!isRunning || isPaused) {
          // Just update display
          updatePendulum();
        }
      }

      // ----- Event Listeners -----
      startBtn.addEventListener('click', startPendulum);
      pauseBtn.addEventListener('click', pausePendulum);
      toggleBtn.addEventListener('click', togglePendulum);
      resetBtn.addEventListener('click', resetPendulum);

      speedSlider.addEventListener('input', (e) => {
        updateSpeed(e.target.value);
      });

      angleSlider.addEventListener('input', (e) => {
        updateAngle(e.target.value);
      });

      // Keyboard shortcuts
      document.addEventListener('keydown', (e) => {
        if (e.key === ' ' || e.key === 'Space') {
          e.preventDefault();
          togglePendulum();
        }
        if (e.key === 'ArrowRight') {
          e.preventDefault();
          const newVal = Math.min(3, parseFloat(speedSlider.value) + 0.1);
          speedSlider.value = newVal;
          updateSpeed(newVal);
        }
        if (e.key === 'ArrowLeft') {
          e.preventDefault();
          const newVal = Math.max(0.1, parseFloat(speedSlider.value) - 0.1);
          speedSlider.value = newVal;
          updateSpeed(newVal);
        }
        if (e.key === 'ArrowUp') {
          e.preventDefault();
          const newVal = Math.min(60, parseFloat(angleSlider.value) + 2);
          angleSlider.value = newVal;
          updateAngle(newVal);
        }
        if (e.key === 'ArrowDown') {
          e.preventDefault();
          const newVal = Math.max(10, parseFloat(angleSlider.value) - 2);
          angleSlider.value = newVal;
          updateAngle(newVal);
        }
        if (e.key === 'r' || e.key === 'R') {
          resetPendulum();
        }
      });

      // Click on bob to toggle
      bob.addEventListener('click', (e) => {
        e.stopPropagation();
        togglePendulum();
      });

      // Click on pendulum to start
      document.querySelector('.pendulum').addEventListener('click', (e) => {
        if (e.target.closest('.bob') || e.target.closest('.controls')) return;
        if (!isRunning) {
          startPendulum();
        } else {
          togglePendulum();
        }
      });

      // ----- Init -----
      function init() {
        updatePendulum();
        status.textContent = '⏱️ Click Start, press Space, or click the pendulum to swing';
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }

    })();
  </script>
</body>
</html>
