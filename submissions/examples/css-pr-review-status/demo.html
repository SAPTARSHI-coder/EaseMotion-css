<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS PR Review Status - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="em-pr-page">
        <div class="em-card" role="region" aria-label="PR Review Status Showcase" tabindex="0">
            <span class="em-card-badge">DEVELOPER TOOLS</span>
            <h1 class="em-card-title">PR Review Status</h1>
            <p class="em-card-desc">Pull request review status indicator featuring approval badges, reviewer avatars, and status pills using pure CSS.</p>
            
            <!-- PR Review Container -->
            <div class="em-pr-container" role="region" aria-label="Pull request review summary">
                <div class="em-pr-header">
                    <span class="em-pr-number">#70779</span>
                    <span class="em-status-badge em-approved">Approved</span>
                </div>
                <h2 class="em-pr-name">Add CSS Rotating Cube Hero Component</h2>
                <div class="em-reviewer-section">
                    <span class="em-reviewer-label">Reviewers:</span>
                    <div class="em-avatar-group" role="list" aria-label="Reviewer avatars">
                        <div class="em-avatar" role="listitem" title="Saptarshi">SC</div>
                        <div class="em-avatar" role="listitem" title="Stewartsson">JS</div>
                        <div class="em-avatar" role="listitem" title="Ujwal">U</div>
                    </div>
                </div>
            </div>

            <a href="#" class="em-card-btn" role="button">View Pull Request</a>
        </div>
    </div>
</body>
</html>
