<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Skew-Active Badge</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<section class="container">

    <div class="hero">

        <span class="tag">Accessible Web</span>

        <h1>Skew-Active Badge Collection</h1>

        <p>
            Modern accessibility-focused badges featuring elegant skew hover
            animations, active states, glassmorphism styling, and responsive
            layouts built entirely with HTML5 and CSS3.
        </p>

    </div>

    <div class="badge-grid">

        <span class="badge active">
            Featured
        </span>

        <span class="badge">
            Accessible
        </span>

        <span class="badge">
            Responsive
        </span>

        <span class="badge">
            Verified
        </span>

    </div>

</section>

</body>
</html>
