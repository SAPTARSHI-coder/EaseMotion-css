<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      Floating File Drag Dropzone Component with Brutalism Styling
      (ease-floating-dropzone)
    </title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="demo-container">
      <header class="demo-header">
        <div class="header-badge">NEO-BRUTALISM UI COMPONENT</div>
        <h1 class="demo-title">FLOATING FILE DROPZONE</h1>
        <p class="demo-subtitle">
          Pure HTML + Vanilla CSS File Upload Dropzone with Hard Offset Shadows
          &amp; Floating Lift Transition
        </p>
      </header>

      <!-- Main Brutalist Dropzone Showcase Card -->
      <section class="dropzone-showcase-card">
        <label class="ease-floating-dropzone" for="brutalist-file-input">
          <!-- Native Accessible Visually-Hidden File Input -->
          <input
            type="file"
            id="brutalist-file-input"
            class="sr-only"
            multiple
            accept=".svg,.png,.jpg,.jpeg,.pdf"
            aria-label="Upload files by dragging or clicking"
          />

          <!-- Inner Surface & Content Layout -->
          <span class="dropzone-surface">
            <!-- Upload Icon Badge -->
            <span class="upload-icon-badge" aria-hidden="true">
              <svg
                viewBox="0 0 24 24"
                width="36"
                height="36"
                fill="none"
                stroke="currentColor"
                stroke-width="2.8"
                stroke-linecap="square"
                stroke-linejoin="miter"
              >
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                <polyline points="17 8 12 3 7 8" />
                <line x1="12" y1="3" x2="12" y2="15" />
              </svg>
            </span>

            <!-- Instructional Text -->
            <span class="dropzone-heading">DRAG &amp; DROP FILES HERE</span>
            <span class="dropzone-subheading"
              >OR CLICK TO BROWSE LOCAL FILES</span
            >

            <!-- Supported File Types Tag -->
            <span class="supported-files-tag"
              >SUPPORTS PNG, JPG, SVG, PDF (MAX 25MB)</span
            >

            <!-- Action Button Graphic -->
            <span class="brutal-button-graphic">CHOOSE FILES</span>
          </span>
        </label>
      </section>

      <!-- Demo Keyboard Instructions Footer -->
      <footer class="demo-footer">
        <div class="keyboard-instruction">
          <span class="type-key">TAB</span> Focus dropzone &bull;
          <span class="type-key">SPACE / ENTER</span> Open file picker &bull;
          <span class="type-key">REDUCED MOTION</span> Static lift state
        </div>
      </footer>
    </main>
  </body>
</html>
