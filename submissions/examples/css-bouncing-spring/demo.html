<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Pure CSS 3D bouncing spring animation">
  <title>CSS 3D Bouncing Spring</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="scene">
    <section class="spring-card" aria-label="CSS 3D Bouncing Spring">
      <div class="platform"></div>

      <div class="spring" aria-hidden="true">
        <span></span>
      </div>

      <div class="ball" aria-hidden="true"></div>

      <div class="content">
        <span class="badge">PURE CSS 3D</span>
        <h1>Bouncing Spring</h1>
        <p>
          A smooth spring-inspired 3D animation created entirely
          with HTML and vanilla CSS.
        </p>
      </div>
    </section>
  </main>
</body>
</html>
