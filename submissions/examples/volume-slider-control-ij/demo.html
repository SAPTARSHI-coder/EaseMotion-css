<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-volume-slider-control demo</title>
</head>
<body>
<div class="vsc-panel">
  <div class="vsc-speaker"><b class="vsc-cone"></b><span class="vsc-wave"></span></div>
  <div class="vsc-track"><em class="vsc-fill"></em><span class="vsc-thumb"></span></div>
  <div class="vsc-meta">
    <span class="vsc-label">VOLUME</span>
    <b class="vsc-value">64%</b>
  </div>
  <button class="vsc-mute">MUTE</button>
</div>
</body>
</html>
