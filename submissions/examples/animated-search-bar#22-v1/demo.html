<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Animated Search Bar - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="search-page">

    <header class="search-header">
      <span class="section-pill">Search UI</span>
      <h1>Animated Search Bar</h1>
      <p>
        A modern expanding search bar built with pure HTML and CSS.
        Click the search icon or focus the input to expand it.
      </p>
    </header>

    <section class="search-demo">

      <div class="search-box">

        <input
          type="search"
          id="search-input"
          class="search-input"
          placeholder="Search components..."
          aria-label="Search components"
        />

        <label for="search-input" class="search-icon">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </label>

        <span class="search-shortcut">Ctrl + K</span>

      </div>

      <p class="search-hint">
        Click the icon or press Tab to focus the search input.
      </p>

    </section>

  </main>

</body>
</html>
