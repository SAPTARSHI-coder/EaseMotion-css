<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clock Drift Skew Monitor</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="clock-shell" aria-labelledby="clock-title">
    <section class="clock-board">
      <p class="eyebrow">Temporal integrity</p>
      <h1 id="clock-title">Clock Drift Skew Monitor</h1>
      <p class="summary">Distributed nodes pulse out of phase until the sync barrier narrows drift and restores a stable time window.</p>
      <div class="clock-stage" role="img" aria-label="Animated clock drift and skew monitor visualization">
        <div class="node-clock fast"><i></i><b></b><span>fast</span></div>
        <div class="sync-barrier"><em></em><em></em><strong>sync</strong></div>
        <div class="node-clock stable"><i></i><b></b><span>stable</span></div>
        <div class="node-clock slow"><i></i><b></b><span>slow</span></div>
      </div>
      <div class="readouts"><span>offset 18ms</span><span>jitter low</span><span>window locked</span></div>
    </section>
  </main>
</body>
</html>
