<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CSS Animated Bar Chart">
  <title>CSS Animated Bar Chart</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="demo-page">
    <section class="chart-card" aria-labelledby="chart-title">
      <div class="chart-header">
        <h1 id="chart-title">Monthly Performance</h1>
        <p>Animated CSS-only bar chart</p>
      </div>

      <div
        class="bar-chart"
        role="img"
        aria-label="Monthly performance: January 45 percent, February 65 percent, March 80 percent, April 55 percent, May 90 percent, June 70 percent."
      >
        <div class="bar-item">
          <div class="bar-value">45%</div>
          <div class="bar-track">
            <div class="bar" style="--bar-height: 45%;"></div>
          </div>
          <span class="bar-label">Jan</span>
        </div>

        <div class="bar-item">
          <div class="bar-value">65%</div>
          <div class="bar-track">
            <div class="bar" style="--bar-height: 65%;"></div>
          </div>
          <span class="bar-label">Feb</span>
        </div>

        <div class="bar-item">
          <div class="bar-value">80%</div>
          <div class="bar-track">
            <div class="bar" style="--bar-height: 80%;"></div>
          </div>
          <span class="bar-label">Mar</span>
        </div>

        <div class="bar-item">
          <div class="bar-value">55%</div>
          <div class="bar-track">
            <div class="bar" style="--bar-height: 55%;"></div>
          </div>
          <span class="bar-label">Apr</span>
        </div>

        <div class="bar-item">
          <div class="bar-value">90%</div>
          <div class="bar-track">
            <div class="bar" style="--bar-height: 90%;"></div>
          </div>
          <span class="bar-label">May</span>
        </div>

        <div class="bar-item">
          <div class="bar-value">70%</div>
          <div class="bar-track">
            <div class="bar" style="--bar-height: 70%;"></div>
          </div>
          <span class="bar-label">Jun</span>
        </div>
      </div>
    </section>
  </main>

</body>
</html>
