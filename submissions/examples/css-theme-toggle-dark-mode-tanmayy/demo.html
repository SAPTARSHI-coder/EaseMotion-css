<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Theme Toggle Dark Mode - EaseMotion CSS</title>
  <!-- Import EaseMotion CSS -->
  <link rel="stylesheet" href="../../../easemotion.css">
  <!-- Component Specific Styles -->
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- The Checkbox Hack driving the global theme state -->
  <input type="checkbox" id="theme-toggle" class="theme-checkbox" aria-label="Toggle Dark Mode">

  <!-- The Wrapper that consumes the theme state -->
  <div class="theme-wrapper">
    
    <div class="demo-container">
      
      <div class="header-controls">
        <h1 class="theme-title">Theme Settings</h1>
        
        <!-- The Toggle Button -->
        <label for="theme-toggle" class="theme-toggle-btn" tabindex="0" role="button" aria-label="Switch Theme">
          <!-- Sun Icon (Light Mode) -->
          <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          
          <!-- Moon Icon (Dark Mode) -->
          <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </label>
      </div>

      <div class="content-card ease-glass-card">
        <h2>Pure CSS Dark Mode</h2>
        <p>This entire layout is transitioning between light and dark modes without a single line of JavaScript. Click the sun/moon icon in the top right to watch the theme transition smoothly using native CSS variables.</p>
        
        <div class="stats-row">
          <div class="stat-box">
            <span class="stat-num">0</span>
            <span class="stat-label">Lines of JS</span>
          </div>
          <div class="stat-box">
            <span class="stat-num">100%</span>
            <span class="stat-label">CSS Powered</span>
          </div>
        </div>
      </div>

    </div>

  </div>

</body>
</html>
