<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volcano Erupt · Lava Explodes on Click</title>
    <meta name="description" content="Interactive volcano eruption with lava explosions, fire particles, and atmospheric volcanic effects.">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1 class="title">🌋 VOLCANO ERUPT</h1>
        
        <div class="canvas-wrapper">
            <canvas id="volcanoCanvas" width="600" height="500"></canvas>
            <div class="glow-overlay"></div>
        </div>

        <div class="controls">
            <div class="button-group">
                <button class="erupt-btn" id="eruptBtn">🌋 ERUPT!</button>
                <button class="reset-btn" id="resetBtn">⟳ RESET</button>
                <button class="toggle-btn" id="toggleBtn">⏸️ PAUSE</button>
            </div>
            <div class="speed-control">
                <label>Power</label>
                <input type="range" id="powerSlider" min="1" max="10" value="5">
                <span id="powerLabel">5</span>
                <label>Lava</label>
                <input type="range" id="lavaSlider" min="20" max="100" value="50">
                <span id="lavaLabel">50</span>
            </div>
        </div>

        <div class="info">
            <span>🌋 VOLCANO ERUPT</span>
            <small>lava · fire · explosion</small>
        </div>
        <div class="hint">
            <span>🌋 click to make the volcano erupt with lava!</span>
        </div>
    </div>

    <script>
        (function() {
            const canvas = document.getElementById('volcanoCanvas');
            const ctx = canvas.getContext('2d');
            const W = 600, H = 500;
            
            const eruptBtn = document.getElementById('eruptBtn');
            const resetBtn = document.getElementById('resetBtn');
            const toggleBtn = document.getElementById('toggleBtn');
            const powerSlider = document.getElementById('powerSlider');
            const powerLabel = document.getElementById('powerLabel');
            const lavaSlider = document.getElementById('lavaSlider');
            const lavaLabel = document.getElementById('lavaLabel');

            let isAnimating = true;
            let speed = 5;
            let power = 5;
            let lavaCount = 50;
            let time = 0;
            let particles = [];
            let ashParticles = [];
            let glowParticles = [];
            let totalEruptions = 0;
            let isErupting = false;

            // ---- Lava Particle ----
            class LavaParticle {
                constructor(x, y) {
                    this.x = x || 300 + (Math.random() - 0.5) * 40;
                    this.y = y || 250 + Math.random() * 30;
                    this.size = 5 + Math.random() * 15;
                    this.maxSize = this.size * (1.5 + Math.random() * 0.5);
                    
                    const angle = -Math.PI / 2 + (Math.random() - 0.5) * 1.5;
                    const speed = 3 + Math.random() * 8 * (power / 5);
                    this.vx = Math.cos(angle) * speed * (0.5 + Math.random() * 0.5);
                    this.vy = Math.sin(angle) * speed * (0.5 + Math.random() * 0.5) - 2;
                    
                    this.gravity = 0.05 + Math.random() * 0.05;
                    this.life = 1;
                    this.decay = 0.003 + Math.random() * 0.008;
                    this.drag = 0.995;
                    
                    // Lava colors
                    const hue = 20 + Math.random() * 30;
                    const sat = 80 + Math.random() * 20;
                    const light = 50 + Math.random() * 30;
                    this.color = `hsl(${hue}, ${sat}%, ${light}%)`;
                    this.glowColor = `hsl(${hue + 10}, 100%, ${light + 20}%)`;
                    this.alpha = 0.7 + Math.random() * 0.3;
                    
                    this.trail = [];
                    this.maxTrail = 5;
                }

                update() {
                    this.vy += this.gravity;
                    this.vx *= this.drag;
                    this.x += this.vx;
                    this.y += this.vy;
                    this.life -= this.decay;
                    this.alpha = this.life * 0.8;
                    
                    // Trail
                    if (this.life > 0.5) {
                        this.trail.push({ x: this.x, y: this.y, life: this.life });
                        if (this.trail.length > this.maxTrail) {
                            this.trail.shift();
                        }
                    }
                    
                    // Grow slightly
                    this.size += 0.02;
                }

                draw(ctx) {
                    if (this.life <= 0) return;
                    
                    // Trail
                    for (let i = 0; i < this.trail.length; i++) {
                        const t = this.trail[i];
                        const alpha = (i / this.trail.length) * this.alpha * 0.3;
                        ctx.save();
                        ctx.globalAlpha = alpha;
                        ctx.fillStyle = this.color;
                        ctx.shadowColor = this.glowColor;
                        ctx.shadowBlur = 10;
                        ctx.beginPath();
                        ctx.arc(t.x, t.y, this.size * (0.2 + (i / this.trail.length) * 0.3), 0, Math.PI * 2);
                        ctx.fill();
                        ctx.restore();
                    }
                    
                    // Main particle
                    ctx.save();
                    ctx.globalAlpha = this.alpha;
                    const grad = ctx.createRadialGradient(
                        this.x - this.size * 0.2, this.y - this.size * 0.2, 0,
                        this.x, this.y, this.size
                    );
                    grad.addColorStop(0, this.glowColor);
                    grad.addColorStop(0.3, this.color);
                    grad.addColorStop(0.7, this.color);
                    grad.addColorStop(1, `rgba(100, 30, 0, 0.5)`);
                    
                    ctx.shadowColor = this.glowColor;
                    ctx.shadowBlur = 20 * this.life;
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size * 0.6, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
            }

            // ---- Ash Particle ----
            class AshParticle {
                constructor(x, y) {
                    this.x = x || 300 + (Math.random() - 0.5) * 60;
                    this.y = y || 200 + Math.random() * 30;
                    this.size = 2 + Math.random() * 6;
                    this.vx = (Math.random() - 0.5) * 2;
                    this.vy = -1 - Math.random() * 3 * (power / 5);
                    this.life = 1;
                    this.decay = 0.002 + Math.random() * 0.004;
                    this.gravity = 0.01 + Math.random() * 0.02;
                    this.wobble = 0.01 + Math.random() * 0.02;
                    this.phase = Math.random() * Math.PI * 2;
                    this.alpha = 0.3 + Math.random() * 0.3;
                    this.color = `rgba(80, 80, 80, `;
                }

                update() {
                    this.vy += this.gravity;
                    this.vx += Math.sin(this.phase) * this.wobble;
                    this.x += this.vx;
                    this.y += this.vy;
                    this.life -= this.decay;
                    this.alpha = this.life * 0.4;
                    this.phase += 0.02;
                }

                draw(ctx) {
                    if (this.life <= 0) return;
                    ctx.save();
                    ctx.globalAlpha = this.alpha;
                    ctx.fillStyle = this.color + this.alpha + ')';
                    ctx.shadowColor = 'rgba(100, 100, 100, 0.02)';
                    ctx.shadowBlur = 5;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size * this.life, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
            }

            // ---- Glow Particle (ambient) ----
            class GlowParticle {
                constructor(x, y) {
                    this.x = x || 300 + (Math.random() - 0.5) * 80;
                    this.y = y || 280 + Math.random() * 20;
                    this.size = 20 + Math.random() * 40;
                    this.life = 1;
                    this.decay = 0.005 + Math.random() * 0.01;
                    this.hue = 20 + Math.random() * 30;
                    this.alpha = 0.05 + Math.random() * 0.1;
                }

                update() {
                    this.life -= this.decay;
                    this.size *= 0.99;
                    this.x += (Math.random() - 0.5) * 0.2;
                    this.y -= 0.1;
                }

                draw(ctx) {
                    if (this.life <= 0) return;
                    const grad = ctx.createRadialGradient(
                        this.x, this.y, 0,
                        this.x, this.y, this.size
                    );
                    grad.addColorStop(0, `hsla(${this.hue}, 100%, 70%, ${this.life * this.alpha * 0.5})`);
                    grad.addColorStop(0.5, `hsla(${this.hue + 10}, 100%, 60%, ${this.life * this.alpha * 0.3})`);
                    grad.addColorStop(1, `hsla(${this.hue + 20}, 80%, 40%, 0)`);
                    ctx.fillStyle = grad;
                    ctx.shadowBlur = 0;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // ---- Erupt ----
            function erupt() {
                if (isErupting) return;
                isErupting = true;
                totalEruptions++;
                
                const count = lavaCount;
                const cx = 300;
                const cy = 250;
                const powerVal = power / 5;
                
                for (let i = 0; i < count; i++) {
                    const p = new LavaParticle(cx, cy);
                    const angle = -Math.PI / 2 + (Math.random() - 0.5) * 1.2;
                    const speed = 2 + Math.random() * 8 * powerVal;
                    p.vx = Math.cos(angle) * speed * (0.5 + Math.random() * 0.5);
                    p.vy = Math.sin(angle) * speed * (0.5 + Math.random() * 0.5) - 2;
                    p.size = 3 + Math.random() * 15 * powerVal;
                    particles.push(p);
                }
                
                // Ash
                const ashCount = Math.floor(count * 0.5);
                for (let i = 0; i < ashCount; i++) {
                    const p = new AshParticle(cx, cy - 30);
                    p.vy = -2 - Math.random() * 5 * powerVal;
                    ashParticles.push(p);
                }
                
                // Glow
                for (let i = 0; i < 10; i++) {
                    const p = new GlowParticle(cx, cy);
                    glowParticles.push(p);
                }
                
                // Sound
                playEruptionSound();
                
                setTimeout(() => {
                    isErupting = false;
                }, 500);
            }

            // ---- Play Eruption Sound ----
            function playEruptionSound() {
                try {
                    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    const now = audioCtx.currentTime;
                    
                    // Explosion noise
                    const bufferSize = audioCtx.sampleRate * 0.3;
                    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                    const data = buffer.getChannelData(0);
                    for (let i = 0; i < bufferSize; i++) {
                        const env = Math.exp(-i / (bufferSize * 0.2));
                        data[i] = (Math.random() * 2 - 1) * env * 0.8;
                    }
                    const noise = audioCtx.createBufferSource();
                    noise.buffer = buffer;
                    const gainNoise = audioCtx.createGain();
                    gainNoise.gain.setValueAtTime(0.2 * (power / 5), now);
                    gainNoise.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                    noise.connect(gainNoise);
                    gainNoise.connect(audioCtx.destination);
                    noise.start(now);
                    noise.stop(now + 0.3);
                    
                    // Deep rumble
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(60 + power * 10, now);
                    osc.frequency.exponentialRampToValueAtTime(30, now + 0.3);
                    gain.gain.setValueAtTime(0.1 * (power / 5), now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 0.3);
                } catch (e) {}
            }

            // ---- Draw Volcano ----
            function drawVolcano(ctx) {
                const cx = 300;
                const cy = 320;
                
                ctx.save();
                
                // Volcano body
                const grad = ctx.createLinearGradient(cx - 120, cy, cx + 120, cy);
                grad.addColorStop(0, '#3a2a1a');
                grad.addColorStop(0.3, '#5a4a3a');
                grad.addColorStop(0.7, '#5a4a3a');
                grad.addColorStop(1, '#3a2a1a');
                ctx.fillStyle = grad;
                ctx.shadowColor = 'rgba(0,0,0,0.1)';
                ctx.shadowBlur = 20;
                ctx.beginPath();
                ctx.moveTo(cx - 120, cy + 80);
                ctx.quadraticCurveTo(cx - 80, cy - 60, cx, cy - 100);
                ctx.quadraticCurveTo(cx + 80, cy - 60, cx + 120, cy + 80);
                ctx.closePath();
                ctx.fill();
                
                // Crater glow
                const craterGrad = ctx.createRadialGradient(cx, cy - 80, 0, cx, cy - 80, 40);
                craterGrad.addColorStop(0, 'rgba(255, 150, 50, 0.2)');
                craterGrad.addColorStop(0.5, 'rgba(255, 100, 20, 0.1)');
                craterGrad.addColorStop(1, 'rgba(255, 50, 0, 0)');
                ctx.fillStyle = craterGrad;
                ctx.shadowBlur = 0;
                ctx.beginPath();
                ctx.arc(cx, cy - 80, 40, 0, Math.PI * 2);
                ctx.fill();
                
                // Lava glow at top
                if (particles.length > 0 || isErupting) {
                    const glowGrad = ctx.createRadialGradient(cx, cy - 80, 0, cx, cy - 80, 60);
                    glowGrad.addColorStop(0, 'rgba(255, 200, 100, 0.08)');
                    glowGrad.addColorStop(0.5, 'rgba(255, 150, 50, 0.04)');
                    glowGrad.addColorStop(1, 'rgba(255, 100, 0, 0)');
                    ctx.fillStyle = glowGrad;
                    ctx.beginPath();
                    ctx.arc(cx, cy - 80, 60, 0, Math.PI * 2);
                    ctx.fill();
                }
                
                ctx.restore();
            }

            // ---- Draw Ground ----
            function drawGround() {
                const grad = ctx.createLinearGradient(0, H - 40, 0, H);
                grad.addColorStop(0, 'rgba(30, 20, 10, 0)');
                grad.addColorStop(0.3, 'rgba(30, 20, 10, 0.2)');
                grad.addColorStop(0.7, 'rgba(30, 20, 10, 0.4)');
                grad.addColorStop(1, 'rgba(30, 20, 10, 0.6)');
                ctx.fillStyle = grad;
                ctx.fillRect(0, H - 40, W, 40);
            }

            // ---- Render ----
            function render() {
                // Sky
                const skyGrad = ctx.createRadialGradient(300, 100, 0, 300, 100, 500);
                skyGrad.addColorStop(0, '#1a0a0a');
                skyGrad.addColorStop(0.3, '#2a1a0a');
                skyGrad.addColorStop(0.6, '#1a0a0a');
                skyGrad.addColorStop(0.8, '#0a0a0a');
                skyGrad.addColorStop(1, '#040608');
                ctx.fillStyle = skyGrad;
                ctx.fillRect(0, 0, W, H);
                
                // Stars
                for (let i = 0; i < 30; i++) {
                    const x = (i * 137 + 20) % W;
                    const y = (i * 97 + 30) % (H * 0.6);
                    const size = 0.5 + (i % 3) * 0.5;
                    const twinkle = 0.3 + Math.sin(time * 0.015 + i * 2.5) * 0.3 + 0.3;
                    ctx.fillStyle = `rgba(200, 220, 255, ${twinkle * 0.3})`;
                    ctx.beginPath();
                    ctx.arc(x, y, size, 0, Math.PI * 2);
                    ctx.fill();
                }
                
                // Ground
                drawGround();
                
                // Draw volcano
                drawVolcano(ctx);
                
                // Update and draw glow particles
                glowParticles = glowParticles.filter(g => g.life > 0);
                for (let g of glowParticles) {
                    g.update();
                    g.draw(ctx);
                }
                
                // Update and draw ash
                ashParticles = ashParticles.filter(a => a.life > 0);
                for (let a of ashParticles) {
                    a.update();
                    a.draw(ctx);
                }
                
                // Update and draw lava
                particles = particles.filter(p => p.life > 0);
                for (let p of particles) {
                    p.update();
                    p.draw(ctx);
                }
                
                // Status
                ctx.save();
                ctx.shadowBlur = 0;
                ctx.fillStyle = 'rgba(200, 220, 240, 0.15)';
                ctx.font = '13px monospace';
                ctx.textAlign = 'right';
                ctx.textBaseline = 'bottom';
                ctx.fillText(`Lava: ${particles.length}`, W - 20, H - 10);
                
                ctx.textAlign = 'left';
                ctx.fillText(`Eruptions: ${totalEruptions}`, 20, H - 10);
                ctx.restore();
            }

            // ---- Animation Loop ----
            function animate() {
                if (!isAnimating) {
                    requestAnimationFrame(animate);
                    return;
                }
                
                time += 0.01 * (speed / 5);
                
                render();
                
                requestAnimationFrame(animate);
            }

            // ---- Toggle Animation ----
            function toggleAnimation() {
                isAnimating = !isAnimating;
                toggleBtn.textContent = isAnimating ? '⏸️ PAUSE' : '▶️ PLAY';
            }

            // ---- Reset ----
            function resetVolcano() {
                particles = [];
                ashParticles = [];
                glowParticles = [];
                totalEruptions = 0;
                isErupting = false;
                time = 0;
            }

            // ---- Update Labels ----
            powerSlider.addEventListener('input', function() {
                powerLabel.textContent = this.value;
            });
            lavaSlider.addEventListener('input', function() {
                lavaCount = parseInt(this.value);
                lavaLabel.textContent = lavaCount;
            });

            // ---- Event Listeners ----
            eruptBtn.addEventListener('click', erupt);
            resetBtn.addEventListener('click', resetVolcano);
            toggleBtn.addEventListener('click', toggleAnimation);

            // ---- Keyboard Shortcuts ----
            document.addEventListener('keydown', function(e) {
                if (e.key === ' ' || e.key === 'Space') {
                    e.preventDefault();
                    erupt();
                }
                if (e.key === 'r' || e.key === 'R') {
                    resetVolcano();
                }
                if (e.key === 'p' || e.key === 'P') {
                    toggleAnimation();
                }
            });

            // ---- Click on canvas to erupt ----
            canvas.addEventListener('click', function(e) {
                erupt();
            });

            // ---- Initialize ----
            render();
            animate();

            console.log('🌋 Volcano Erupt · Click Erupt or press Space to make the volcano explode!');
        })();
    </script>
</body>
</html>
