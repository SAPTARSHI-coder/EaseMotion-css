<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slide Fade Diagonal Move Animation</title>
  <link rel="stylesheet" href="./style.css">
  <style>
    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
    }
    
    .demo-container {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .demo-box {
      width: 150px;
      height: 150px;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      border-radius: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-weight: bold;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
    }
  </style>
</head>
<body>

  <div class="demo-container">
    <!-- Using the utility class -->
    <div class="demo-box ease-anim-slide-fade-diagonal-move">
      Animated Box
    </div>
  </div>

  <script>
    // Just to re-trigger the animation on click for demo purposes
    document.querySelector('.demo-box').addEventListener('click', function() {
      this.classList.remove('ease-anim-slide-fade-diagonal-move');
      void this.offsetWidth; // trigger reflow
      this.classList.add('ease-anim-slide-fade-diagonal-move');
    });
  </script>
</body>
</html>
