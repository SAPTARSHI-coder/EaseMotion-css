<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rotate-Fade Accessible Badge - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="stage">
    <header class="head">
      <h1>Rotate-Fade Accessible Badges (<code>#54320</code>)</h1>
      <p>An editorial suite of accessible high-contrast UI status badges that spin diagonally upward while alpha fading into intense visibility upon page arrival.</p>
    </header>
    
    <section class="ease-badges-rotate-fade" aria-label="Status Indicators">
      <span class="badge-rf pink-rf" role="status" aria-label="Verified Status">
        <span class="dot pink"></span> 144 PRs Merged ✦
      </span>
      
      <span class="badge-rf cyan-rf" role="status" aria-label="Animation Status">
        <span class="dot cyan"></span> Orbital 60.0 FPS ●
      </span>

      <span class="badge-rf emerald-rf" role="status" aria-label="Accessibility Spec">
        <span class="dot emerald"></span> WCAG AAA Spec ▲
      </span>

      <span class="badge-rf gold-rf" role="status" aria-label="Automated Loop">
        <span class="dot gold"></span> Autonomous Loop ⚡
      </span>
    </section>

    <button class="btn-badge-replay" onclick="document.querySelector('.ease-badges-rotate-fade').classList.toggle('replay')">↻ Replay Orbital Diagonal Entrance</button>
  </div>
</body>
</html>
