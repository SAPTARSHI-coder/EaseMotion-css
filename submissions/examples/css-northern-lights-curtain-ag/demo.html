<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Northern Lights Curtain</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="night-sky">
    <div class="stars"></div>
    <div class="curtain-container" aria-label="Northern lights flowing in the sky" role="img">
      <div class="northern-lights layer-1"></div>
      <div class="northern-lights layer-2"></div>
      <div class="northern-lights layer-3"></div>
    </div>
    
    <main class="content">
      <h1>Northern Lights</h1>
      <p>A pure CSS flowing aurora curtain animation.</p>
    </main>
  </div>
</body>
</html>
