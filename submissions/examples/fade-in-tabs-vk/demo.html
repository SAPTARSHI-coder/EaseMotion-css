<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fade-In Tabs</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="container">

    <h1>Fade-In Tabs</h1>
    <p class="subtitle">
        Accessible fade-in tabs built using pure HTML and CSS.
    </p>

    <div class="tabs" role="tablist" aria-label="Fade In Tabs">

        <input type="radio" name="tabs" id="tab1">
        <label for="tab1" role="tab">Home</label>

        <input type="radio" name="tabs" id="tab2">
        <label for="tab2" role="tab">Services</label>

        <input type="radio" name="tabs" id="tab3">
        <label for="tab3" role="tab">Contact</label>

        <section class="content home">
            <h2>Home</h2>
            <p>
                Build elegant interfaces with lightweight HTML and CSS.
            </p>
        </section>

        <section class="content services">
            <h2>Services</h2>
            <p>
                Create responsive layouts with smooth fade transitions.
            </p>
        </section>

        <section class="content contact">
            <h2>Contact</h2>
            <p>
                Deliver accessible user experiences without JavaScript.
            </p>
        </section>

    </div>

</main>

</body>
</html>
