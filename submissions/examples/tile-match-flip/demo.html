<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tile Match Flip #87568 Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="game-wrapper">
    <div class="header-panel">
      <div class="stat-item">Moves: <span id="moveCounter">0</span></div>
      <div class="stat-item">Matches: <span id="matchCounter">0</span>/4</div>
      <button class="reset-btn" id="resetBtn">Restart</button>
    </div>

    <div class="tile-grid-container" id="tileGrid">
      <!-- Cards rendered dynamically -->
    </div>
  </div>

  <script>
    const symbols = ["⚡", "💎", "🚀", "🔥"];
    const deck = [...symbols, ...symbols];
    const grid = document.getElementById("tileGrid");
    const moveDisplay = document.getElementById("moveCounter");
    const matchDisplay = document.getElementById("matchCounter");
    const resetBtn = document.getElementById("resetBtn");

    let flippedCards = [];
    let lockBoard = false;
    let moves = 0;
    let matches = 0;

    function shuffle(array) {
      return array.sort(() => Math.random() - 0.5);
    }

    function initGame() {
      grid.innerHTML = "";
      flippedCards = [];
      lockBoard = false;
      moves = 0;
      matches = 0;
      moveDisplay.textContent = moves;
      matchDisplay.textContent = matches;

      const shuffled = shuffle([...deck]);
      shuffled.forEach(symbol => {
        const card = document.createElement("div");
        card.classList.add("tile-card");
        card.dataset.symbol = symbol;
        card.innerHTML = `
          <div class="tile-face tile-front"></div>
          <div class="tile-face tile-back">${symbol}</div>
        `;
        card.addEventListener("click", () => handleCardClick(card));
        grid.appendChild(card);
      });
    }

    function handleCardClick(card) {
      if (lockBoard || card.classList.contains("flipped") || card.classList.contains("matched")) return;

      card.classList.add("flipped");
      flippedCards.push(card);

      if (flippedCards.length === 2) {
        moves++;
        moveDisplay.textContent = moves;
        checkMatch();
      }
    }

    function checkMatch() {
      const [card1, card2] = flippedCards;
      const isMatch = card1.dataset.symbol === card2.dataset.symbol;

      if (isMatch) {
        card1.classList.add("matched");
        card2.classList.add("matched");
        matches++;
        matchDisplay.textContent = matches;
        flippedCards = [];
      } else {
        lockBoard = true;
        setTimeout(() => {
          card1.classList.remove("flipped");
          card2.classList.remove("flipped");
          flippedCards = [];
          lockBoard = false;
        }, 1000);
      }
    }

    resetBtn.addEventListener("click", initGame);
    initGame();
  </script>
</body>
</html>
