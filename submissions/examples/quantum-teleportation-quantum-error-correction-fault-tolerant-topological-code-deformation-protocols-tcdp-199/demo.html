<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="style.css"></head><body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030712; color: #ffffff;">

    <div class="ease-card ease-card-glass tcdp-container">

            <h2>Topological Code Deformation</h2>
            <span class="ease-badge ease-badge-warning">Fault-Tolerant Quantum</span>

            <div class="tcdp-flux flux-tcdp-b"></div>
            <div class="tcdp-boundary-ring"></div>
            <div class="tcdp-core ease-center"></div>

        <div class="tcdp-footer ease-flex ease-justify-between ease-items-center">
