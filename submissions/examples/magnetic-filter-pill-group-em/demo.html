<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Magnetic Badge Filter Pill Group · EaseMotion</title>
  <meta name="description" content="A pure CSS interactive filter pill group with hover scale feedback, vibrant active states, and item count badges." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Demo Page Background -->
  <main class="demo-page">
    <div class="demo-content">
      <h1 class="demo-title">Filter Catalog</h1>
      <p class="demo-subtitle">Select a category below. Powered by pure CSS radio inputs.</p>
    </div>

    <!-- =========================================================
         FILTER PILL GROUP
    ========================================================== -->
    <fieldset class="filter-group-wrapper" aria-label="Filter Categories">
      <div class="filter-group">
        
        <!-- Pill 1 (All) -->
        <div class="filter-pill">
          <input type="radio" name="category" id="cat-all" class="filter-pill__input" value="all" checked />
          <label for="cat-all" class="filter-pill__label">
            <span class="filter-pill__text">All Products</span>
            <span class="filter-pill__badge">142</span>
          </label>
        </div>

        <!-- Pill 2 -->
        <div class="filter-pill">
          <input type="radio" name="category" id="cat-shoes" class="filter-pill__input" value="shoes" />
          <label for="cat-shoes" class="filter-pill__label">
            <span class="filter-pill__text">Sneakers</span>
            <span class="filter-pill__badge">56</span>
          </label>
        </div>

        <!-- Pill 3 -->
        <div class="filter-pill">
          <input type="radio" name="category" id="cat-apparel" class="filter-pill__input" value="apparel" />
          <label for="cat-apparel" class="filter-pill__label">
            <span class="filter-pill__text">Apparel</span>
            <span class="filter-pill__badge">38</span>
          </label>
        </div>

        <!-- Pill 4 -->
        <div class="filter-pill">
          <input type="radio" name="category" id="cat-accessories" class="filter-pill__input" value="accessories" />
          <label for="cat-accessories" class="filter-pill__label">
            <span class="filter-pill__text">Accessories</span>
            <span class="filter-pill__badge">29</span>
          </label>
        </div>

        <!-- Pill 5 -->
        <div class="filter-pill">
          <input type="radio" name="category" id="cat-sale" class="filter-pill__input" value="sale" />
          <label for="cat-sale" class="filter-pill__label">
            <span class="filter-pill__text">Clearance Sale</span>
            <span class="filter-pill__badge">19</span>
          </label>
        </div>

      </div>
    </fieldset>
  </main>

</body>
</html>
