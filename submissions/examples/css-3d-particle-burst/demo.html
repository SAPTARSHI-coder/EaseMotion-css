<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 3D Effect: Particle Burst - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="em-burst-page">
        <!-- Background 3D Particle Burst Animation Layer -->
        <div class="em-burst-bg" aria-hidden="true">
            <span class="em-burst-particle" style="--r:0deg; --d:0s;"></span>
            <span class="em-burst-particle" style="--r:45deg; --d:0.3s;"></span>
            <span class="em-burst-particle" style="--r:90deg; --d:0.6s;"></span>
            <span class="em-burst-particle" style="--r:135deg; --d:0.9s;"></span>
            <span class="em-burst-particle" style="--r:180deg; --d:1.2s;"></span>
            <span class="em-burst-particle" style="--r:225deg; --d:1.5s;"></span>
            <span class="em-burst-particle" style="--r:270deg; --d:1.8s;"></span>
            <span class="em-burst-particle" style="--r:315deg; --d:2.1s;"></span>
        </div>

        <div class="em-card" role="region" aria-label="Particle Burst 3D Showcase" tabindex="0">
            <span class="em-card-badge">3D ANIMATIONS</span>
            <h1 class="em-card-title">Particle Burst</h1>
            <p class="em-card-desc">A smooth, hardware-accelerated pure CSS 3D animation featuring dynamic particle burst styling and dark mode compatibility.</p>
            <a href="#" class="em-card-btn" role="button">Explore Effects</a>
        </div>
    </div>
</body>
</html>
