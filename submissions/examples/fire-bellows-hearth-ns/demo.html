<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ease Fire Bellows Hearth</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="ease-fire-bellows-hearth">

  <div class="hearth-panel">

    <h2>HEARTH CONTROL</h2>
    <p>BELLOWS OXYGEN SYSTEM</p>

    <div class="fire-area">

      <div class="flame flame-one"></div>
      <div class="flame flame-two"></div>
      <div class="flame flame-three"></div>

      <div class="embers"></div>

    </div>


    <div class="bellows">

      <div class="handle"></div>
      <div class="air-slot"></div>

    </div>


    <div class="status">
      <span></span>
      OXYGEN FLOW ACTIVE
    </div>

  </div>

</div>

</body>
</html>
