<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-pull-to-refresh-spinner demo</title>
</head>
<body>
<div class="pr-app">
  <span class="pr-title">FEED PULL</span>
  <div class="pr-phone">
    <span class="pr-drag">DRAG DOWN</span>
    <div class="pr-wheel">
      <span class="pr-arc"></span>
      <span class="pr-arrow">&#8595;</span>
    </div>
    <span class="pr-label">RELEASE TO REFRESH</span>
  </div>
  <span class="pr-status">LAST SYNC 12:00</span>
</div>
</body>
</html>
