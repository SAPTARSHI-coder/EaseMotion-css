<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Time Block Scheduler</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="scheduler" role="grid" aria-label="Daily Time Block Scheduler">

    <h1>Daily Planner</h1>

    <div class="time-row">
      <div class="time">08:00</div>
      <div class="block work" tabindex="0">Team Meeting</div>
    </div>

    <div class="time-row">
      <div class="time">09:00</div>
      <div class="block focus" tabindex="0">Deep Work Session</div>
    </div>

    <div class="time-row">
      <div class="time">10:00</div>
      <div class="block focus" tabindex="0">Project Development</div>
    </div>

    <div class="time-row">
      <div class="time">11:00</div>
      <div class="block break" tabindex="0">Coffee Break</div>
    </div>

    <div class="time-row">
      <div class="time">12:00</div>
      <div class="block personal" tabindex="0">Lunch</div>
    </div>

    <div class="time-row">
      <div class="time">01:00</div>
      <div class="block work" tabindex="0">Client Call</div>
    </div>

    <div class="time-row">
      <div class="time">02:00</div>
      <div class="block study" tabindex="0">Learning Session</div>
    </div>

    <div class="time-row">
      <div class="time">03:00</div>
      <div class="block study" tabindex="0">Documentation</div>
    </div>

  </div>

</body>
</html>
