<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neumorphic Notification Badge Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="neu-container">
    <h2>Notifications</h2>
    <div class="neu-button-wrapper">
      <!-- Notification Icon Button -->
      <button class="neu-icon-btn" aria-label="View Notifications">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
        </svg>
      </button>
      <!-- Active Alert Badge -->
      <span class="neu-badge pulse" aria-live="polite">3</span>
    </div>
    <p>Hover or click to test states</p>
  </main>

</body>
</html>
