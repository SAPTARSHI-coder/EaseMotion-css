<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Compare Table Column Highlight Hover</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <h1>Compare Table</h1>
    <p class="subtitle">
      Hover over a column to highlight it and its corresponding cells.
    </p>

    <div class="table-wrapper">
      <table class="compare-table">
        <thead>
          <tr>
            <th>Feature</th>
            <th class="highlight-column">Basic</th>
            <th class="highlight-column">Pro</th>
            <th class="highlight-column">Enterprise</th>
          </tr>
        </thead>

        <tbody>
          <tr>
            <th>Storage</th>
            <td>10 GB</td>
            <td>100 GB</td>
            <td>1 TB</td>
          </tr>
          <tr>
            <th>Users</th>
            <td>1</td>
            <td>10</td>
            <td>Unlimited</td>
          </tr>
          <tr>
            <th>Support</th>
            <td>Email</td>
            <td>Priority</td>
            <td>24/7 Dedicated</td>
          </tr>
          <tr>
            <th>Analytics</th>
            <td>Basic</td>
            <td>Advanced</td>
            <td>Custom</td>
          </tr>
          <tr>
            <th>API Access</th>
            <td>—</td>
            <td>✓</td>
            <td>✓</td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>

  <script>
    const table = document.querySelector(".compare-table");
    const cells = table.querySelectorAll("th, td");

    cells.forEach((cell) => {
      cell.addEventListener("mouseenter", () => {
        const columnIndex = cell.cellIndex;

        cells.forEach((item) => {
          item.classList.toggle(
            "column-highlight",
            item.cellIndex === columnIndex
          );
        });
      });
    });

    table.addEventListener("mouseleave", () => {
      cells.forEach((cell) => {
        cell.classList.remove("column-highlight");
      });
    });
  </script>
</body>
</html>
