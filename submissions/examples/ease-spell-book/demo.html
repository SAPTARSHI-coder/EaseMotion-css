<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spell Book · pages flip and glow</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <div class="spellbook-container">
      <div class="spellbook-display" id="spellbookDisplay">
        <!-- Book Cover -->
        <div class="book" id="book">
          <!-- Left Pages -->
          <div class="page page-left" id="pageLeft">
            <div class="page-content">
              <div class="spell-icon">📜</div>
              <div class="spell-title" id="leftTitle">Ancient Spells</div>
              <div class="spell-text" id="leftText">Turn the page to discover ancient magic...</div>
            </div>
          </div>
          
          <!-- Right Pages -->
          <div class="page page-right" id="pageRight">
            <div class="page-content">
              <div class="spell-icon">✨</div>
              <div class="spell-title" id="rightTitle">Arcane Wisdom</div>
              <div class="spell-text" id="rightText">Each page holds a new spell...</div>
            </div>
          </div>
          
          <!-- Page Flip Effect -->
          <div class="page-flip" id="pageFlip"></div>
          
          <!-- Book Spine -->
          <div class="book-spine"></div>
          
          <!-- Glow Effect -->
          <div class="book-glow" id="bookGlow"></div>
        </div>

        <!-- Spell Particles -->
        <div class="spell-particles" id="spellParticles"></div>

        <!-- Page Counter -->
        <div class="page-counter">
          <span class="counter-label">📖 Page</span>
          <span class="counter-value" id="pageCount">1 / 12</span>
        </div>
      </div>
      
      <div class="spellbook-status">
        <span id="spellbookStatus">📖 Click to flip the page</span>
      </div>
    </div>

    <div class="controls">
      <button class="btn btn-flip" id="flipBtn">📖 Flip Page</button>
      <button class="btn btn-auto" id="autoBtn">🔄 Auto Flip</button>
      <button class="btn btn-reset" id="resetBtn">⟳ Reset</button>
    </div>
    <div class="footer-note">
      <span>📖 magical spell book · glowing pages · 12 spells</span>
    </div>
  </div>

  <script>
    (function() {
      "use strict";

      // DOM refs
      const book = document.getElementById('book');
      const pageLeft = document.getElementById('pageLeft');
      const pageRight = document.getElementById('pageRight');
      const pageFlip = document.getElementById('pageFlip');
      const bookGlow = document.getElementById('bookGlow');
      const spellParticles = document.getElementById('spellParticles');
      const pageCount = document.getElementById('pageCount');
      const spellbookStatus = document.getElementById('spellbookStatus');
      const flipBtn = document.getElementById('flipBtn');
      const autoBtn = document.getElementById('autoBtn');
      const resetBtn = document.getElementById('resetBtn');

      // State
      let currentPage = 1;
      let totalPages = 12;
      let isFlipping = false;
      let isAutoFlipping = false;
      let autoInterval = null;

      // Spell data
      const spells = [
        { left: { title: 'Ancient Spells', text: 'Turn the page to discover ancient magic...', icon: '📜' }, right: { title: 'Arcane Wisdom', text: 'Each page holds a new spell...', icon: '✨' } },
        { left: { title: 'Fireball', text: 'Conjure a blazing sphere of flame.', icon: '🔥' }, right: { title: 'Ice Shard', text: 'Launch frozen projectiles at foes.', icon: '❄️' } },
        { left: { title: 'Lightning Bolt', text: 'Call down a strike of pure energy.', icon: '⚡' }, right: { title: 'Healing Light', text: 'Restore vitality with golden light.', icon: '💚' } },
        { left: { title: 'Invisibility', text: 'Bend light around yourself.', icon: '👻' }, right: { title: 'Telekinesis', text: 'Move objects with your mind.', icon: '🌀' } },
        { left: { title: 'Summon Familiar', text: 'Call forth a magical companion.', icon: '🐉' }, right: { title: 'Mage Armor', text: 'Shield yourself with arcane energy.', icon: '🛡️' } },
        { left: { title: 'Time Stop', text: 'Freeze the flow of time.', icon: '⏳' }, right: { title: 'Dimension Door', text: 'Tear a hole through space.', icon: '🌌' } },
        { left: { title: 'Polymorph', text: 'Transform into any creature.', icon: '🦋' }, right: { title: 'Enchantment', text: 'Weave magic into objects.', icon: '💎' } },
        { left: { title: 'Necromancy', text: 'Speak with the departed.', icon: '💀' }, right: { title: 'Divination', text: 'Glimpse the threads of fate.', icon: '🔮' } },
        { left: { title: 'Elemental Storm', text: 'Command the fury of nature.', icon: '🌪️' }, right: { title: 'Shadow Walk', text: 'Travel through the darkness.', icon: '🌑' } },
        { left: { title: 'Holy Aura', text: 'Radiate divine protection.', icon: '🌟' }, right: { title: 'Blood Magic', text: 'Sacrifice for great power.', icon: '🩸' } },
        { left: { title: 'Soul Binding', text: 'Link spirits together.', icon: '🔗' }, right: { title: 'Prismatic Spray', text: 'Unleash a rainbow of magic.', icon: '🌈' } },
        { left: { title: 'The Final Spell', text: 'The ultimate magical truth awaits...', icon: '⭐' }, right: { title: 'New Beginning', text: 'The cycle of magic continues.', icon: '🌅' } }
      ];

      // Create spell particles
      function createSpellParticles(count = 25) {
        const colors = ['#818cf8', '#a78bfa', '#c4b5fd', '#fbbf24', '#f472b6', '#34d399', '#60a5fa'];
        const rect = document.getElementById('spellbookDisplay').getBoundingClientRect();
        
        for (let i = 0; i < count; i++) {
          setTimeout(() => {
            const particle = document.createElement('div');
            particle.className = 'spell-particle';
            
            const size = Math.random() * 6 + 2;
            particle.style.width = size + 'px';
            particle.style.height = size + 'px';
            particle.style.left = (20 + Math.random() * 60) + '%';
            particle.style.top = (20 + Math.random() * 60) + '%';
            
            const color = colors[Math.floor(Math.random() * colors.length)];
            particle.style.backgroundColor = color;
            particle.style.boxShadow = `0 0 ${size * 2}px ${color}66`;
            
            const angle = Math.random() * Math.PI * 2;
            const distance = 30 + Math.random() * 80;
            particle.style.setProperty('--tx', Math.cos(angle) * distance + 'px');
            particle.style.setProperty('--ty', Math.sin(angle) * distance + 'px');
            
            particle.style.animationDuration = (Math.random() * 0.8 + 0.6) + 's';
            particle.style.animationDelay = (Math.random() * 0.3) + 's';
            
            spellParticles.appendChild(particle);
            
            setTimeout(() => {
              particle.remove();
            }, 2000);
          }, i * 30);
        }
      }

      // Update page content
      function updatePage(index) {
        const spell = spells[index];
        if (!spell) return;
        
        // Update left page
        const leftIcon = pageLeft.querySelector('.spell-icon');
        const leftTitle = pageLeft.querySelector('.spell-title');
        const leftText = pageLeft.querySelector('.spell-text');
        leftIcon.textContent = spell.left.icon;
        leftTitle.textContent = spell.left.title;
        leftText.textContent = spell.left.text;
        
        // Update right page
        const rightIcon = pageRight.querySelector('.spell-icon');
        const rightTitle = pageRight.querySelector('.spell-title');
        const rightText = pageRight.querySelector('.spell-text');
        rightIcon.textContent = spell.right.icon;
        rightTitle.textContent = spell.right.title;
        rightText.textContent = spell.right.text;
        
        // Update counter
        pageCount.textContent = `${currentPage} / ${totalPages}`;
        
        // Update status
        const spellName = spell.left.title;
        spellbookStatus.textContent = `📖 Page ${currentPage}: ${spellName}`;
        spellbookStatus.style.color = '#fbbf24';
        
        // Create glow effect
        bookGlow.classList.add('active');
        setTimeout(() => {
          bookGlow.classList.remove('active');
        }, 800);
        
        // Create particles
        createSpellParticles(20);
      }

      // Flip page
      function flipPage() {
        if (isFlipping) return;
        if (currentPage >= totalPages) {
          spellbookStatus.textContent = '📖 You\'ve reached the end of the book!';
          spellbookStatus.style.color = '#fbbf24';
          return;
        }
        
        isFlipping = true;
        const nextPage = currentPage;
        
        // Animate flip
        pageFlip.classList.add('flipping');
        pageLeft.classList.add('flipping');
        pageRight.classList.add('flipping');
        book.classList.add('flipping');
        
        // Glow during flip
        bookGlow.classList.add('active');
        
        // After flip animation, update content
        setTimeout(() => {
          currentPage = nextPage + 1;
          updatePage(currentPage - 1);
          
          // Reset flip animation
          pageFlip.classList.remove('flipping');
          pageLeft.classList.remove('flipping');
          pageRight.classList.remove('flipping');
          book.classList.remove('flipping');
          bookGlow.classList.remove('active');
          
          isFlipping = false;
          
          // Celebrate if at the end
          if (currentPage === totalPages) {
            spellbookStatus.textContent = '📖 The final page! ✨';
            spellbookStatus.style.color = '#fbbf24';
            createSpellParticles(40);
          }
        }, 600);
      }

      // Auto flip
      function toggleAutoFlip() {
        if (isAutoFlipping) {
          // Stop auto flip
          if (autoInterval) {
            clearInterval(autoInterval);
            autoInterval = null;
          }
          isAutoFlipping = false;
          autoBtn.textContent = '🔄 Auto Flip';
          autoBtn.style.background = 'linear-gradient(135deg, #8b5cf6, #7c3aed)';
          autoBtn.style.borderColor = '#a78bfa';
          spellbookStatus.textContent = '⏸️ Auto flip paused';
          spellbookStatus.style.color = '#94a3b8';
          setTimeout(() => {
            spellbookStatus.textContent = '📖 Click to flip the page';
          }, 1500);
        } else {
          // Start auto flip
          if (currentPage >= totalPages) {
            spellbookStatus.textContent = '📖 Already at the end!';
            spellbookStatus.style.color = '#fbbf24';
            return;
          }
          isAutoFlipping = true;
          autoBtn.textContent = '⏹️ Stop Auto';
          autoBtn.style.background = 'linear-gradient(135deg, #ef4444, #dc2626)';
          autoBtn.style.borderColor = '#f87171';
          spellbookStatus.textContent = '🔄 Auto flipping...';
          spellbookStatus.style.color = '#a78bfa';
          
          autoInterval = setInterval(() => {
            if (currentPage >= totalPages) {
              toggleAutoFlip();
              spellbookStatus.textContent = '📖 Reached the end!';
              spellbookStatus.style.color = '#fbbf24';
              return;
            }
            flipPage();
          }, 2000);
        }
      }

      // Reset
      function resetSpellbook() {
        if (isAutoFlipping) {
          toggleAutoFlip();
        }
        
        currentPage = 1;
        updatePage(0);
        spellParticles.innerHTML = '';
        pageFlip.classList.remove('flipping');
        pageLeft.classList.remove('flipping');
        pageRight.classList.remove('flipping');
        book.classList.remove('flipping');
        bookGlow.classList.remove('active');
        
        spellbookStatus.textContent = '🔄 Reset complete';
        spellbookStatus.style.color = '#94a3b8';
        setTimeout(() => {
          spellbookStatus.textContent = '📖 Click to flip the page';
        }, 1000);
      }

      // Event listeners
      if (flipBtn) {
        flipBtn.addEventListener('click', function(e) {
          e.preventDefault();
          flipPage();
        });
      }

      if (autoBtn) {
        autoBtn.addEventListener('click', function(e) {
          e.preventDefault();
          toggleAutoFlip();
        });
      }

      if (resetBtn) {
        resetBtn.addEventListener('click', function(e) {
          e.preventDefault();
          resetSpellbook();
        });
      }

      // Click on book to flip
      book.addEventListener('click', function(e) {
        if (e.target === this || e.target.closest('.page')) {
          flipPage();
        }
      });

      // Keyboard shortcuts
      document.addEventListener('keydown', function(e) {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

        const key = e.key;
        if (key === ' ' || key === 'Space') {
          e.preventDefault();
          flipPage();
        } else if (key === 'f' || key === 'F') {
          e.preventDefault();
          flipPage();
        } else if (key === 'a' || key === 'A') {
          e.preventDefault();
          toggleAutoFlip();
        } else if (key === 'r' || key === 'R') {
          e.preventDefault();
          resetSpellbook();
        }
      });

      // Initialize
      updatePage(0);
      console.log('📖 Spell Book ready · shortcuts: [Space/F] Flip, [A] Auto Flip, [R] Reset');
    })();
  </script>
</body>
</html>
