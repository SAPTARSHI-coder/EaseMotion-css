<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Skew-Active Popover</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="checkout-layout">
        <div class="order-summary">
            <h2 class="section-title">Order Total</h2>
            <div class="price-row">
                <span>Subtotal</span>
                <span>$149.99</span>
            </div>
            <div class="price-row">
                <span>Shipping</span>
                <span class="free-text">Free</span>
            </div>
            <div class="price-row total-row">
                <span>Total</span>
                <span>$149.99</span>
            </div>
            
            <div class="popover-container">
                <input type="checkbox" id="promo-toggle" class="popover-toggle">
                <label for="promo-toggle" class="popover-btn">
                    Apply Promo Code
                    <span class="chevron">▼</span>
                </label>
                
                <div class="popover-content">
                    <div class="popover-inner">
                        <label for="promo-input" class="popover-label">Enter Code</label>
                        <div class="input-group">
                            <input type="text" id="promo-input" class="promo-input" placeholder="e.g. SUMMER20">
                            <button class="apply-btn">Apply</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <button class="checkout-btn">Complete Purchase</button>
    </div>
</body>
</html>
