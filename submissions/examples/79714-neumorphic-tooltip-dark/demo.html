<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Neumorphic Tooltip</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<main>
  <span>EaseMotion CSS</span>
  <h1>Neumorphic Tooltip</h1>
  <p>Hover or focus the button to view the tooltip.</p>

  <button class="tip" aria-describedby="tooltip">
    Hover Me
    <span id="tooltip" role="tooltip">
      Helpful information appears here.
    </span>
  </button>
</main>

</body>
</html>
