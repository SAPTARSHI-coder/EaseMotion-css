<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Bento Grid: Quantum Energy Shield</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="dashboard-container">
        <header class="header">
            <h1 class="glow-text">QUANTUM CORE</h1>
            <p class="subtitle">ENERGY SHIELD DASHBOARD</p>
        </header>

        <!-- 
          [TECHNIQUE] The Bento Grid Layout
          Responsive CSS Grid layout.
        -->
        <main class="bento-grid">
            
            <!-- Large Card -->
            <div class="shield-card card-large delay-1">
                <div class="card-content">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <circle cx="12" cy="12" r="6"></circle>
                        <circle cx="12" cy="12" r="2"></circle>
                    </svg>
                    <h2>REACTOR CORE</h2>
                    <p>Primary containment field stable at 99.9% efficiency.</p>
                </div>
            </div>

            <!-- Medium Tall Card -->
            <div class="shield-card card-tall delay-2">
                <div class="card-content">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
                    </svg>
                    <h2>FLUX RATE</h2>
                    <p class="stat">2.44 <small>THz</small></p>
                </div>
            </div>

            <!-- Standard Card -->
            <div class="shield-card card-standard delay-3">
                <div class="card-content">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                    </svg>
                    <h2>DEFLECTOR</h2>
                    <p class="status ok">ACTIVE</p>
                </div>
            </div>

            <!-- Standard Card -->
            <div class="shield-card card-standard delay-4">
                <div class="card-content">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20.24 12.24a6 6 0 0 0-8.49-8.49L5 10.5V19h8.5z"></path>
                        <line x1="16" y1="8" x2="2" y2="22"></line>
                        <line x1="17.5" y1="15" x2="9" y2="15"></line>
                    </svg>
                    <h2>MAGNETIC FIELD</h2>
                    <p class="status warn">CHARGING</p>
                </div>
            </div>

            <!-- Wide Card -->
            <div class="shield-card card-wide delay-5">
                <div class="card-content row-content">
                    <div class="text-area">
                        <h2>HARMONIC RESONANCE</h2>
                        <p>Frequency alignment within acceptable parameters.</p>
                    </div>
                    <!-- CSS drawn wave indicator -->
                    <div class="wave-container">
                        <div class="wave w1"></div>
                        <div class="wave w2"></div>
                        <div class="wave w3"></div>
                        <div class="wave w4"></div>
                    </div>
                </div>
            </div>

        </main>
    </div>

</body>
</html>
