<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ease-fade-stepper-bh - CSS Fade-In Stepper for Gaming Hub</title>
  <link rel="stylesheet" href="style.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: system-ui, -apple-system, sans-serif; 
      background: #0f172a; 
      color: #f1f5f9; 
      padding: 2rem; 
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    h1 { 
      color: #6366f1; 
      margin-bottom: 0.5rem;
      font-size: 1.75rem;
      text-align: center;
    }
    p { 
      color: #94a3b8; 
      margin-bottom: 2rem; 
      text-align: center;
    }
    .demo-controls {
      margin-top: 2rem;
      display: flex;
      gap: 1rem;
    }
    .demo-btn {
      padding: 0.75rem 1.5rem;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border: none;
      border-radius: 0.5rem;
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .demo-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(99, 102, 241, 0.4);
    }
  </style>
</head>
<body>
  <h1>ease-fade-stepper-bh</h1>
  <p>Fade-In Stepper for Gaming Hub Layouts - Click buttons to navigate</p>
  
  <div class="ease-fade-stepper">
    <div class="ease-stepper-progress">
      <div class="ease-stepper-progress-fill" id="progressFill"></div>
    </div>
    
    <div class="ease-step active" data-step="1">
      <div class="ease-step-circle">1</div>
      <span class="ease-step-label">Setup</span>
    </div>
    
    <div class="ease-step" data-step="2">
      <div class="ease-step-circle">2</div>
      <span class="ease-step-label">Configure</span>
    </div>
    
    <div class="ease-step" data-step="3">
      <div class="ease-step-circle">3</div>
      <span class="ease-step-label">Customize</span>
    </div>
    
    <div class="ease-step" data-step="4">
      <div class="ease-step-circle">4</div>
      <span class="ease-step-label">Launch</span>
    </div>
  </div>
  
  <div class="demo-controls">
    <button class="demo-btn" onclick="prevStep()">← Previous</button>
    <button class="demo-btn" onclick="nextStep()">Next →</button>
  </div>
  
  <script>
    let currentStep = 1;
    const totalSteps = 4;
    
    function updateStepper() {
      document.querySelectorAll('.ease-step').forEach((step, index) => {
        step.classList.remove('active');
        if (index + 1 <= currentStep) {
          step.classList.add('active');
        }
      });
      
      const progress = ((currentStep - 1) / (totalSteps - 1)) * 100;
      document.getElementById('progressFill').style.width = progress + '%';
    }
    
    function nextStep() {
      if (currentStep < totalSteps) {
        currentStep++;
        updateStepper();
      }
    }
    
    function prevStep() {
      if (currentStep > 1) {
        currentStep--;
        updateStepper();
      }
    }
  </script>
</body>
</html>
