<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Spinner: Cyberpunk Styling Variation - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="em-demo-container">
        <!-- Pure CSS Cyberpunk Spinner Component Showcase -->
        <header class="em-spinner-card" role="region" aria-label="Cyberpunk Spinner Showcase" tabindex="0">
            <div class="em-spinner-header-bar">
                <span class="em-card-badge">SPINNER EFFECTS</span>
                <span class="em-brand-logo">CyberMotion</span>
            </div>
            <h1 class="em-card-title">Cyberpunk Spinner</h1>
            <p class="em-card-desc">A smooth, accessible, and performant pure CSS spinner featuring futuristic cyberpunk neon gradients, glitch-styled rotation keyframes, and frosted glassmorphism.</p>
            <div class="em-spinner-wrapper">
                <div class="em-cyberpunk-spinner" aria-label="Cyberpunk loading indicator">
                    <div class="em-ring em-ring-outer"></div>
                    <div class="em-ring em-ring-inner"></div>
                    <span class="em-spinner-text">SYSTEM LOADING</span>
                </div>
            </div>
        </header>
    </div>
</body>
</html>
