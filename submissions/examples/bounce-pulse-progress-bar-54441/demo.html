<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bounce Pulse Progress Bar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<section class="progress-demo">

    <h1>Bounce Pulse Progress Bar</h1>
    <p>Pure CSS progress bar with a smooth bounce and pulse animation.</p>

    <div
        class="em-progress"
        role="progressbar"
        aria-label="Loading progress"
        aria-valuenow="65"
        aria-valuemin="0"
        aria-valuemax="100">

        <div class="progress-fill">
            <span class="progress-value">65%</span>
        </div>

    </div>

</section>

</body>
</html>
