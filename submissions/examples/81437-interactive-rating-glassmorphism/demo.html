<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Interactive glassmorphism rating component built with pure HTML and CSS."
  >

  <title>Interactive Rating — Glassmorphism</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="page">

    <section
      class="rating-card"
      aria-labelledby="rating-title"
    >

      <div class="rating-card__glow" aria-hidden="true"></div>

      <header class="rating-card__header">

        <span class="rating-card__eyebrow">
          CUSTOMER FEEDBACK
        </span>

        <h1 id="rating-title">
          How was your experience?
        </h1>

        <p class="rating-card__description">
          Your feedback helps us make the experience better.
        </p>

      </header>

      <fieldset
        class="rating"
        aria-label="Rate your experience from one to five stars"
      >

        <legend class="sr-only">
          Select a rating from one to five stars
        </legend>

        <input
          type="radio"
          id="rating-5"
          name="rating"
          value="5"
        >

        <label
          for="rating-5"
          aria-label="5 stars"
        >
          ★
        </label>

        <input
          type="radio"
          id="rating-4"
          name="rating"
          value="4"
        >

        <label
          for="rating-4"
          aria-label="4 stars"
        >
          ★
        </label>

        <input
          type="radio"
          id="rating-3"
          name="rating"
          value="3"
        >

        <label
          for="rating-3"
          aria-label="3 stars"
        >
          ★
        </label>

        <input
          type="radio"
          id="rating-2"
          name="rating"
          value="2"
        >

        <label
          for="rating-2"
          aria-label="2 stars"
        >
          ★
        </label>

        <input
          type="radio"
          id="rating-1"
          name="rating"
          value="1"
        >

        <label
          for="rating-1"
          aria-label="1 star"
        >
          ★
        </label>

      </fieldset>

      <div class="rating-card__footer">

        <span class="rating-card__hint">
          Select a star to rate
        </span>

        <span
          class="rating-card__status"
          aria-hidden="true"
        >
          ● LIVE
        </span>

      </div>

    </section>

  </main>

</body>
</html>
