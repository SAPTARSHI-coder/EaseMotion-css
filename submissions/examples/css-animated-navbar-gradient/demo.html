<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Navbar | Gradient Styling</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- SVG Gradient Definition for Brand Logo -->
<svg style="width:0;height:0;position:absolute;" aria-hidden="true">
  <defs>
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007a" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>
  </defs>
</svg>

<header class="navbar-container" aria-label="Main Navigation Frame">
    <div class="gradient-border-wrap">
        <nav class="navbar" role="navigation">
            <!-- Brand Logo -->
            <a href="#" class="nav-brand" aria-label="Nexus Homepage">
                <svg class="brand-icon" viewBox="0 0 24 24">
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path>
                </svg>
                <span>Nexus</span>
            </a>

            <!-- Navigation Links -->
            <ul class="nav-links">
                <li><a href="#" class="nav-link active" aria-current="page">Features</a></li>
                <li><a href="#" class="nav-link">Solutions</a></li>
                <li><a href="#" class="nav-link">Pricing</a></li>
                <li><a href="#" class="nav-link">Docs</a></li>
            </ul>

            <!-- Call to Action -->
            <a href="#" class="nav-cta">Get Started</a>
        </nav>
    </div>
</header>

<main class="hero-showcase">
    <h1 class="hero-title">Animated Gradient Floating Navbar</h1>
    <p class="hero-subtitle">A responsive floating navbar component featuring an animated infinite mesh gradient border, glassmorphism backdrop blur, and interactive state pills.</p>
</main>

</body>
</html>
