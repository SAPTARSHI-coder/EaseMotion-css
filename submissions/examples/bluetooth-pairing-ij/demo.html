<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-bluetooth-pairing demo</title>
</head>
<body>
<div class="btp-stage">
  <div class="btp-phone"><span class="btp-screen"></span></div>
  <div class="btp-link">
    <span class="btp-ring"></span>
    <b class="btp-glyph">BT</b>
    <span class="btp-ring"></span>
  </div>
  <div class="btp-ears"><span class="btp-ear"></span><span class="btp-ear"></span></div>
  <div class="btp-status">
    <span class="btp-tag">PAIRING...</span>
    <div class="btp-meter"><em class="btp-fill"></em></div>
  </div>
</div>
</body>
</html>
