<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Glitch-Flicker Modal - EaseMotion CSS</title>
  <!-- Import EaseMotion CSS -->
  <link rel="stylesheet" href="../../../easemotion.css">
  <!-- Component Specific Styles -->
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="checkout-bg">

  <div class="demo-container">
    
    <div class="checkout-panel ease-glass-card">
      <div class="checkout-header">
        <h2 class="ease-text-xl">Checkout</h2>
        <span class="cyber-badge">CYBER_MONDAY</span>
      </div>

      <div class="checkout-body">
        <div class="mock-cart">
          <div class="cart-item">
            <div class="item-name">Mechanical Keyboard XYZ</div>
            <div class="item-price">$149.00</div>
          </div>
          <div class="cart-item">
            <div class="item-name">CyberPunk Keycaps</div>
            <div class="item-price">$45.00</div>
          </div>
        </div>
      </div>
      
      <div class="checkout-footer">
        <!-- Button acting as Modal Trigger (linked to hidden checkbox) -->
        <label for="glitch-modal-toggle" class="glitch-trigger-btn ease-squish-button" tabindex="0">
          Apply Flash Hack Code
        </label>
        <button class="pay-btn ease-squish-button">Proceed to Payment</button>
      </div>
    </div>

  </div>

  <!-- 
    ========================================
    Glitch-Flicker Modal Component 
    ======================================== 
  -->
  
  <!-- Hidden Checkbox for Modal State -->
  <input type="checkbox" id="glitch-modal-toggle" class="modal-checkbox">
  
  <!-- Modal Overlay / Backdrop -->
  <div class="modal-overlay">
    
    <!-- Close trigger covering entire background -->
    <label for="glitch-modal-toggle" class="modal-close-backdrop"></label>
    
    <!-- The Glitch Modal Container -->
    <div class="glitch-modal" data-text="SYSTEM_OVERRIDE">
      
      <!-- Glitch effect pseudo-layers are handled in CSS via ::before and ::after -->
      
      <div class="modal-content-wrapper">
        <div class="modal-header">
          <h3 class="modal-title">SYSTEM_OVERRIDE</h3>
          <label for="glitch-modal-toggle" class="modal-close-btn" aria-label="Close modal">
            [X]
          </label>
        </div>
        
        <div class="modal-body">
          <div class="warning-text">WARNING: FLASH SALE DETECTED</div>
          <p>A <strong>30% discount</strong> has been injected into your cart. This override will expire in <span class="countdown">04:59</span>.</p>
          <div class="hack-code">
            &gt; INJECTING: CYBER30<br>
            &gt; STATUS: SUCCESS
          </div>
        </div>
        
        <div class="modal-footer">
          <label for="glitch-modal-toggle" class="btn btn-primary">Accept Injection</label>
        </div>
      </div>
      
    </div>
  </div>

</body>
</html>
