<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D DNA Helix | EaseMotion CSS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="helix-scene">
        <div class="helix-container">
            <!-- DNA Rungs (Connecting Bars) -->
            <div class="rung rung-1"><div class="rung-bar"></div></div>
            <div class="rung rung-2"><div class="rung-bar"></div></div>
            <div class="rung rung-3"><div class="rung-bar"></div></div>
            <div class="rung rung-4"><div class="rung-bar"></div></div>
            <div class="rung rung-5"><div class="rung-bar"></div></div>
            <div class="rung rung-6"><div class="rung-bar"></div></div>
            <div class="rung rung-7"><div class="rung-bar"></div></div>
            <div class="rung rung-8"><div class="rung-bar"></div></div>
            <div class="rung rung-9"><div class="rung-bar"></div></div>
            <div class="rung rung-10"><div class="rung-bar"></div></div>

            <!-- Strand A (Left Helix) -->
            <div class="strand strand-a">
                <div class="node node-a1"><div class="node-glow"></div></div>
                <div class="node node-a2"><div class="node-glow"></div></div>
                <div class="node node-a3"><div class="node-glow"></div></div>
                <div class="node node-a4"><div class="node-glow"></div></div>
                <div class="node node-a5"><div class="node-glow"></div></div>
                <div class="node node-a6"><div class="node-glow"></div></div>
                <div class="node node-a7"><div class="node-glow"></div></div>
                <div class="node node-a8"><div class="node-glow"></div></div>
                <div class="node node-a9"><div class="node-glow"></div></div>
                <div class="node node-a10"><div class="node-glow"></div></div>
            </div>

            <!-- Strand B (Right Helix) -->
            <div class="strand strand-b">
                <div class="node node-b1"><div class="node-glow"></div></div>
                <div class="node node-b2"><div class="node-glow"></div></div>
                <div class="node node-b3"><div class="node-glow"></div></div>
                <div class="node node-b4"><div class="node-glow"></div></div>
                <div class="node node-b5"><div class="node-glow"></div></div>
                <div class="node node-b6"><div class="node-glow"></div></div>
                <div class="node node-b7"><div class="node-glow"></div></div>
                <div class="node node-b8"><div class="node-glow"></div></div>
                <div class="node node-b9"><div class="node-glow"></div></div>
                <div class="node node-b10"><div class="node-glow"></div></div>
            </div>
        </div>

        <!-- Floating Particles -->
        <div class="particles">
            <span class="particle p1"></span>
            <span class="particle p2"></span>
            <span class="particle p3"></span>
            <span class="particle p4"></span>
            <span class="particle p5"></span>
            <span class="particle p6"></span>
        </div>

        <!-- Title -->
        <div class="helix-title">
            <span>DNA</span>
            <span>SEQUENCE</span>
        </div>
    </div>
</body>
</html>
