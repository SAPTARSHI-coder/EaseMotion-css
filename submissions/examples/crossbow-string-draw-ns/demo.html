<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crossbow String Draw — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Crossbow String Draw demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Crossbow String Draw</h1>
      <p class="lede">Crossbow string drawn to latch then released</p>
    </header>

    <section class="ease-crossbow-string-draw" data-demo="crossbow-string-draw" aria-live="polite">
      <div class="ease-crossbow-string-draw__housing">
        <div class="ease-crossbow-string-draw__bezel">
          <div class="ease-crossbow-string-draw__face">
            <div class="ease-crossbow-string-draw__readout">
              <span class="ease-crossbow-string-draw__label">Crossbow String Draw</span>
              <span class="ease-crossbow-string-draw__value">LIVE</span>
            </div>
            <div class="ease-crossbow-string-draw__motion" aria-hidden="true">
              <span class="ease-crossbow-string-draw__a"></span>
              <span class="ease-crossbow-string-draw__b"></span>
              <span class="ease-crossbow-string-draw__c"></span>
              <span class="ease-crossbow-string-draw__d"></span>
            </div>
            <div class="ease-crossbow-string-draw__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-crossbow-string-draw__controls">
          <button type="button" class="ease-crossbow-string-draw__btn primary">Engage</button>
          <button type="button" class="ease-crossbow-string-draw__btn">Reset</button>
          <label class="ease-crossbow-string-draw__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-crossbow-string-draw__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
