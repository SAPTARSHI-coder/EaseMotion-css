<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Floating Label Input | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="fli-wrapper">
    <div class="fli-field">
      <input type="text" class="fli-input" id="name" placeholder=" " autocomplete="off">
      <label for="name" class="fli-label">Full Name</label>
    </div>
    <div class="fli-field">
      <input type="email" class="fli-input" id="email" placeholder=" " autocomplete="off">
      <label for="email" class="fli-label">Email Address</label>
    </div>
    <div class="fli-field">
      <input type="password" class="fli-input" id="pass" placeholder=" " autocomplete="off">
      <label for="pass" class="fli-label">Password</label>
    </div>
  </div>
</body>
</html>
