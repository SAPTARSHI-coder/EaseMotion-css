<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invisibility Cloak · fades in and out</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <div class="cloak-container">
      <div class="cloak-display" id="cloakDisplay">
        <!-- Cloak Effect -->
        <div class="cloak-scene">
          <!-- Invisibility Ripples -->
          <div class="ripple ripple-1"></div>
          <div class="ripple ripple-2"></div>
          <div class="ripple ripple-3"></div>
          
          <!-- Subject -->
          <div class="cloak-subject" id="cloakSubject">
            <div class="subject-visual">
              <div class="subject-icon">🧙</div>
              <div class="subject-glow"></div>
            </div>
            <div class="subject-label">Wizard</div>
          </div>

          <!-- Cloak Shimmer -->
          <div class="cloak-shimmer" id="cloakShimmer"></div>

          <!-- Distortion Field -->
          <div class="distortion-field" id="distortionField">
            <div class="distortion-ring"></div>
            <div class="distortion-ring"></div>
            <div class="distortion-ring"></div>
          </div>
        </div>

        <!-- Invisibility Indicator -->
        <div class="cloak-indicator">
          <div class="cloak-bar">
            <div class="cloak-fill" id="cloakFill"></div>
          </div>
          <span class="cloak-value" id="cloakValue">Visible: 100%</span>
        </div>
      </div>
      
      <div class="cloak-status">
        <span id="cloakStatus">🧙 Click to toggle invisibility</span>
      </div>
    </div>

    <div class="controls">
      <button class="btn btn-cloak" id="cloakBtn">🧙 Cloak</button>
      <button class="btn btn-reveal" id="revealBtn">👁️ Reveal</button>
      <button class="btn btn-reset" id="resetBtn">⟳ Reset</button>
    </div>
    <div class="footer-note">
      <span>🧙 invisibility cloak · shimmer effects · fade in/out</span>
    </div>
  </div>

  <script>
    (function() {
      "use strict";

      // DOM refs
      const cloakSubject = document.getElementById('cloakSubject');
      const cloakShimmer = document.getElementById('cloakShimmer');
      const distortionField = document.getElementById('distortionField');
      const cloakFill = document.getElementById('cloakFill');
      const cloakValue = document.getElementById('cloakValue');
      const cloakStatus = document.getElementById('cloakStatus');
      const cloakBtn = document.getElementById('cloakBtn');
      const revealBtn = document.getElementById('revealBtn');
      const resetBtn = document.getElementById('resetBtn');
      const ripples = document.querySelectorAll('.ripple');

      // State
      let visibility = 1; // 0 to 1 (1 = fully visible)
      let targetVisibility = 1;
      let isAnimating = false;
      let animationId = null;
      let rippleTimeout = null;

      // Update cloak
      function updateCloak() {
        // Smooth interpolation
        visibility += (targetVisibility - visibility) * 0.05;
        
        // Clamp
        visibility = Math.max(0, Math.min(1, visibility));
        
        const percent = Math.round(visibility * 100);
        
        // Update indicator
        cloakFill.style.width = percent + '%';
        cloakValue.textContent = `Visible: ${percent}%`;

        // Update subject visibility
        cloakSubject.style.opacity = visibility;
        cloakSubject.style.transform = `scale(${0.8 + visibility * 0.2})`;
        
        // Update shimmer based on invisibility
        const shimmerIntensity = 1 - visibility;
        cloakShimmer.style.opacity = shimmerIntensity * 0.6;
        cloakShimmer.style.transform = `scale(${1 + shimmerIntensity * 0.3})`;
        
        // Update distortion field
        const distortionIntensity = 1 - visibility;
        distortionField.style.opacity = distortionIntensity * 0.5;
        distortionField.style.transform = `scale(${1 + distortionIntensity * 0.2})`;
        
        // Update ripples
        ripples.forEach((ripple, index) => {
          const delay = index * 0.3;
          const rippleVisibility = Math.max(0, Math.min(1, (1 - visibility - delay) / (1 - delay)));
          ripple.style.opacity = rippleVisibility * 0.6;
          ripple.style.transform = `scale(${1 + (1 - visibility) * 0.5})`;
        });

        // Update subject glow
        const glow = cloakSubject.querySelector('.subject-glow');
        if (glow) {
          const glowIntensity = 0.1 + visibility * 0.4;
          glow.style.opacity = glowIntensity;
          glow.style.transform = `scale(${1 + (1 - visibility) * 0.5})`;
        }

        // Update status
        if (visibility < 0.05) {
          cloakStatus.textContent = '🧙 Fully invisible!';
          cloakStatus.style.color = '#a78bfa';
          cloakBtn.textContent = '🧙 Invisible';
          cloakBtn.style.background = 'linear-gradient(135deg, #a78bfa, #7c3aed)';
          cloakBtn.style.borderColor = '#a78bfa';
        } else if (visibility < 0.4) {
          cloakStatus.textContent = '🧙 Fading...';
          cloakStatus.style.color = '#818cf8';
          cloakBtn.textContent = '🧙 Cloaking...';
        } else if (visibility < 0.8) {
          cloakStatus.textContent = '🧙 Partially visible';
          cloakStatus.style.color = '#94a3b8';
        } else if (visibility < 0.95) {
          cloakStatus.textContent = '🧙 Revealing...';
          cloakStatus.style.color = '#94a3b8';
        } else {
          cloakStatus.textContent = '🧙 Fully visible';
          cloakStatus.style.color = '#4ade80';
          cloakBtn.textContent = '🧙 Cloak';
          cloakBtn.style.background = 'linear-gradient(135deg, #6366f1, #4f46e5)';
          cloakBtn.style.borderColor = '#818cf8';
        }

        // Update subject icon based on visibility
        const icon = cloakSubject.querySelector('.subject-icon');
        if (icon) {
          if (visibility < 0.1) {
            icon.textContent = '👻';
          } else if (visibility < 0.4) {
            icon.textContent = '🧙';
            icon.style.filter = `blur(${(1 - visibility) * 4}px)`;
          } else {
            icon.textContent = '🧙';
            icon.style.filter = `blur(${(1 - visibility) * 1}px)`;
          }
        }

        // Update display border
        const display = document.getElementById('cloakDisplay');
        const borderColor = visibility < 0.1 ? '#a78bfa' : '#2d3748';
        display.style.borderColor = borderColor;
        display.style.boxShadow = `inset 0 0 60px rgba(0,0,0,0.5), 0 0 ${40 + (1 - visibility) * 60}px rgba(167, 139, 250, ${(1 - visibility) * 0.3})`;
      }

      // Animation loop
      function animate() {
        if (isAnimating) {
          updateCloak();
          animationId = requestAnimationFrame(animate);
        }
      }

      // Start animation
      function startAnimation() {
        if (!isAnimating) {
          isAnimating = true;
          animate();
        }
      }

      // Stop animation
      function stopAnimation() {
        if (isAnimating) {
          isAnimating = false;
          if (animationId) {
            cancelAnimationFrame(animationId);
            animationId = null;
          }
          updateCloak();
        }
      }

      // Cloak (fade out)
      function cloak() {
        targetVisibility = 0;
        startAnimation();
        // Create ripple burst
        createRippleBurst();
      }

      // Reveal (fade in)
      function reveal() {
        targetVisibility = 1;
        startAnimation();
      }

      // Reset
      function resetCloak() {
        targetVisibility = 1;
        visibility = 1;
        stopAnimation();
        updateCloak();
        cloakBtn.textContent = '🧙 Cloak';
        cloakBtn.style.background = 'linear-gradient(135deg, #6366f1, #4f46e5)';
        cloakBtn.style.borderColor = '#818cf8';
        cloakStatus.textContent = '🔄 Reset complete';
        cloakStatus.style.color = '#94a3b8';
        setTimeout(() => {
          cloakStatus.textContent = '🧙 Click to toggle invisibility';
        }, 1000);
      }

      // Toggle
      function toggleCloak() {
        if (visibility < 0.3) {
          reveal();
        } else {
          cloak();
        }
      }

      // Create ripple burst
      function createRippleBurst() {
        const scene = document.querySelector('.cloak-scene');
        for (let i = 0; i < 5; i++) {
          setTimeout(() => {
            const ripple = document.createElement('div');
            ripple.className = 'ripple-burst';
            ripple.style.width = (20 + Math.random() * 40) + 'px';
            ripple.style.height = ripple.style.width;
            ripple.style.left = (20 + Math.random() * 60) + '%';
            ripple.style.top = (20 + Math.random() * 60) + '%';
            ripple.style.animationDuration = (1 + Math.random() * 0.5) + 's';
            ripple.style.borderColor = `rgba(167, 139, 250, ${0.2 + Math.random() * 0.3})`;
            scene.appendChild(ripple);
            
            setTimeout(() => {
              ripple.remove();
            }, 2000);
          }, i * 150);
        }
      }

      // Event listeners
      if (cloakBtn) {
        cloakBtn.addEventListener('click', function(e) {
          e.preventDefault();
          if (visibility < 0.3) {
            reveal();
          } else {
            cloak();
          }
        });
      }

      if (revealBtn) {
        revealBtn.addEventListener('click', function(e) {
          e.preventDefault();
          reveal();
        });
      }

      if (resetBtn) {
        resetBtn.addEventListener('click', function(e) {
          e.preventDefault();
          resetCloak();
        });
      }

      // Click on display to toggle
      const cloakDisplay = document.getElementById('cloakDisplay');
      cloakDisplay.addEventListener('click', function(e) {
        if (e.target === this || e.target.closest('.cloak-scene')) {
          toggleCloak();
        }
      });

      // Keyboard shortcuts
      document.addEventListener('keydown', function(e) {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

        const key = e.key;
        if (key === ' ' || key === 'Space') {
          e.preventDefault();
          toggleCloak();
        } else if (key === 'c' || key === 'C') {
          e.preventDefault();
          cloak();
        } else if (key === 'r' || key === 'R') {
          e.preventDefault();
          reveal();
        } else if (key === 'x' || key === 'X') {
          e.preventDefault();
          resetCloak();
        }
      });

      // Initialize
      updateCloak();
      console.log('🧙 Invisibility Cloak ready · shortcuts: [Space] Toggle, [C] Cloak, [R] Reveal, [X] Reset');
    })();
  </script>
</body>
</html>
