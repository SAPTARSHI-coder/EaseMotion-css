<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-arcade-highscore-input demo</title>
</head>
<body>
<div class="ar-app">
  <div class="ar-marquee"><span class="ar-marquee-glow"></span></div>
  <span class="ar-title">HIGH SCORE</span>
  <span class="ar-score">01,240</span>
  <div class="ar-initials">
    <span class="ar-char">J</span>
    <span class="ar-char">A</span>
    <span class="ar-char"><span class="ar-cursor"></span>Y</span>
  </div>
  <div class="ar-ranks">
    <span class="ar-rank">1. AAA 09,900</span>
    <span class="ar-rank ar-rank-hot">2. JAY 01,240</span>
    <span class="ar-rank">3. QQQ 00,850</span>
  </div>
  <span class="ar-prompt">ENTER YOUR NAME</span>
</div>
</body>
</html>
