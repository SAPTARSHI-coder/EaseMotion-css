<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ease-rating — EaseMotion CSS Demo</title>
<link rel="stylesheet" href="style.css">
<style>
  body{font-family:system-ui,sans-serif;background:#f7f7f9;padding:3rem;}
  h1{margin-bottom:2rem;}
  section{margin-bottom:2.5rem;}
</style>
</head>
<body>

<h1>ease-rating — Star Rating Demo</h1>

<section>
  <h2>Interactive (hover to preview, click to set)</h2>
  <div class="ease-rating" role="radiogroup" aria-label="Rating">
    <input type="radio" name="rating" id="r5" value="5"><label for="r5">★</label>
    <input type="radio" name="rating" id="r4" value="4"><label for="r4">★</label>
    <input type="radio" name="rating" id="r3" value="3" checked><label for="r3">★</label>
    <input type="radio" name="rating" id="r2" value="2"><label for="r2">★</label>
    <input type="radio" name="rating" id="r1" value="1"><label for="r1">★</label>
  </div>
</section>

<section>
  <h2>Read-only display (3.5 stars)</h2>
  <div class="ease-rating-display" style="--rating:70%;">★★★★★</div>
</section>

</body>
</html>
