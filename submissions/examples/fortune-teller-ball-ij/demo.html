<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-fortune-teller-ball</title>
</head>
<body>
<main class="ftb-card">
  <header class="ftb-head">
    <h1 class="ftb-title">Oracle</h1>
    <span class="ftb-id">8-Ball</span>
  </header>
  <section class="ftb-ball" aria-label="fortune ball">
    <div class="ftb-dome">
      <div class="ftb-answer">
        <span class="ftb-answer-tri"></span>
        <span class="ftb-answer-text">OUTLOOK</span>
      </div>
    </div>
    <div class="ftb-base">
      <span class="ftb-base-text">ASK</span>
    </div>
  </section>
  <div class="ftb-question">
    <span class="ftb-q">Will the deploy pass?</span>
  </div>
  <footer class="ftb-foot">
    <span class="ftb-shake">Shake to reveal</span>
    <span class="ftb-answer-hint">It is certain</span>
  </footer>
</main>
</body>
</html>
