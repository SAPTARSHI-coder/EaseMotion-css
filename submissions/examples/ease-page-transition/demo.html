<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pure CSS Page Transition Demo</title>
  <link rel="stylesheet" href="../../../easemotion.css">
  <link rel="stylesheet" href="./style.css">
  <style>
    /* Demo specific styles */
    body {
      background-color: #f1f5f9;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 2rem;
      /* Add the fade-in class directly to the body for the content reveal */
      animation: ease-page-fade-in 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: 0.3s; /* Wait for the overlay wipe to finish */
      opacity: 0;
    }
    
    .demo-content {
      max-width: 600px;
      text-align: center;
    }

    button {
      margin-top: 2rem;
      padding: 0.75rem 1.5rem;
      background-color: #3b82f6;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    button:hover {
      background-color: #2563eb;
    }
  </style>
</head>
<body>

  <!-- 
    The Page Transition Overlay.
    This div sits on top of everything and animates out on page load.
  -->
  <div class="ease-page-transition-overlay ease-wipe-up"></div>

  <div class="demo-content ease-card" style="padding: 3rem; background: white; border-radius: 12px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);">
    <h1 style="color: #0f172a; margin-top: 0;">Smooth Page Transitions</h1>
    <p style="color: #475569; font-size: 1.1rem; line-height: 1.6;">
      Notice how the dark overlay wiped upwards smoothly, and then this content faded in? That's the power of the <code>.ease-page-transition</code> utility. It completely eliminates the harsh flash-of-white during page loads.
    </p>
    
    <button onclick="window.location.reload()">Replay Transition</button>
  </div>

</body>
</html>
