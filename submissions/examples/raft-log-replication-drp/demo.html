<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Raft Log Replication</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="motion-shell raft_log_replication_drp" aria-labelledby="motion-title">
    <section class="motion-panel">
      <p class="eyebrow">consensus flow</p>
      <h1 id="motion-title">Raft Log Replication</h1>
      <p class="summary">A leader streams log entries to followers, waits for majority replication, and advances the commit index in a pure CSS simulation.</p>
      <div class="stage" role="img" aria-label="Animated Raft Log Replication visualization">
        <div class="orbit orbit-one"></div>
        <div class="orbit orbit-two"></div>
        <article class="node node-a"><strong>A</strong><span>leader append</span></article>
        <article class="node node-b"><strong>B</strong><span>majority ack</span></article>
        <article class="node node-c"><strong>C</strong><span>index committed</span></article>
        <div class="beam beam-ab"><i></i></div>
        <div class="beam beam-bc"><i></i></div>
        <div class="beam beam-ca"><i></i></div>
        <div class="decision">index committed</div>
      </div>
      <div class="status-grid" aria-label="Raft Log Replication status">
        <span>leader append</span>
        <span>majority ack</span>
        <span>index committed</span>
      </div>
    </section>
  </main>
</body>
</html>
