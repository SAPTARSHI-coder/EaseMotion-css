<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CSS Glitch-Flicker Dropdown gaming hub component">
  <title>Glitch-Flicker Dropdown</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="demo-shell">
    <section class="gaming-panel" aria-labelledby="demo-title">
      <p class="eyebrow">EASEMOTION // GAMING HUB</p>

      <h1 id="demo-title">Glitch-Flicker Dropdown</h1>

      <p class="intro">
        A pure CSS dropdown with a cyberpunk glitch-flicker interaction.
        Hover or focus the control to reveal the navigation options.
      </p>

      <div class="dropdown">
        <button
          class="dropdown-trigger"
          type="button"
          aria-label="Open game navigation"
        >
          <span>SELECT MISSION</span>
          <span class="trigger-icon" aria-hidden="true">+</span>
        </button>

        <div class="dropdown-menu">
          <a href="#arena">ARENA MODE</a>
          <a href="#missions">MISSIONS</a>
          <a href="#leaderboard">LEADERBOARD</a>
          <a href="#loadout">LOADOUT</a>
        </div>
      </div>

      <p class="hint">
        Hover or focus the selector to activate the effect.
      </p>
    </section>
  </main>
</body>
</html>
