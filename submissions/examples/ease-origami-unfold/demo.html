<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Origami Unfold · 3D origami unfolds</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <div class="origami-container">
      <div class="origami-display" id="origamiDisplay">
        <!-- 3D Origami Scene -->
        <div class="origami-scene">
          <div class="origami" id="origami">
            <!-- Paper layers -->
            <div class="paper paper-back" id="paperBack">
              <div class="paper-face">
                <span class="paper-icon">📄</span>
                <span class="paper-label">Back</span>
              </div>
            </div>
            <div class="paper paper-mid" id="paperMid">
              <div class="paper-face">
                <span class="paper-icon">📄</span>
                <span class="paper-label">Middle</span>
              </div>
            </div>
            <div class="paper paper-front" id="paperFront">
              <div class="paper-face">
                <span class="paper-icon">⭐</span>
                <span class="paper-label">Front</span>
              </div>
            </div>
            <div class="paper paper-top" id="paperTop">
              <div class="paper-face">
                <span class="paper-icon">✨</span>
                <span class="paper-label">Top</span>
              </div>
            </div>
          </div>
        </div>

        <!-- Unfold Indicator -->
        <div class="unfold-indicator">
          <div class="unfold-bar">
            <div class="unfold-fill" id="unfoldFill"></div>
          </div>
          <span class="unfold-value" id="unfoldValue">Unfold: 0%</span>
        </div>
      </div>
      
      <div class="origami-status">
        <span id="origamiStatus">📄 Click to unfold the origami</span>
      </div>
    </div>

    <div class="controls">
      <button class="btn btn-unfold" id="unfoldBtn">📄 Unfold</button>
      <button class="btn btn-fold" id="foldBtn">📄 Fold</button>
      <button class="btn btn-reset" id="resetBtn">⟳ Reset</button>
    </div>
    <div class="footer-note">
      <span>📄 3D origami unfolds · 4 paper layers · smooth animation</span>
    </div>
  </div>

  <script>
    (function() {
      "use strict";

      // DOM refs
      const origami = document.getElementById('origami');
      const paperBack = document.getElementById('paperBack');
      const paperMid = document.getElementById('paperMid');
      const paperFront = document.getElementById('paperFront');
      const paperTop = document.getElementById('paperTop');
      const unfoldFill = document.getElementById('unfoldFill');
      const unfoldValue = document.getElementById('unfoldValue');
      const origamiStatus = document.getElementById('origamiStatus');
      const unfoldBtn = document.getElementById('unfoldBtn');
      const foldBtn = document.getElementById('foldBtn');
      const resetBtn = document.getElementById('resetBtn');

      // State
      let unfold = 0; // 0 to 1
      let targetUnfold = 0;
      let isAnimating = false;
      let animationId = null;

      // Update origami
      function updateOrigami() {
        // Smooth interpolation
        unfold += (targetUnfold - unfold) * 0.06;
        
        // Clamp
        unfold = Math.max(0, Math.min(1, unfold));
        
        // Calculate paper transforms
        const angle = unfold * 120;
        const translateZ = unfold * 80;
        const scale = 1 + unfold * 0.15;
        const opacity = 0.3 + unfold * 0.7;

        // Apply transforms to each paper layer
        // Back paper - rotates and moves back
        paperBack.style.transform = `rotateY(-${angle * 0.5}deg) rotateX(${angle * 0.3}deg) translateZ(${-translateZ * 0.5}px) scale(${scale * 0.9})`;
        paperBack.style.opacity = 0.2 + unfold * 0.6;
        
        // Mid paper - rotates moderately
        paperMid.style.transform = `rotateY(${angle * 0.3}deg) rotateX(${-angle * 0.2}deg) translateZ(${translateZ * 0.2}px) scale(${scale * 0.95})`;
        paperMid.style.opacity = 0.3 + unfold * 0.7;
        
        // Front paper - rotates and moves forward
        paperFront.style.transform = `rotateY(${angle * 0.7}deg) rotateX(${angle * 0.4}deg) translateZ(${translateZ * 0.6}px) scale(${scale})`;
        paperFront.style.opacity = 0.4 + unfold * 0.6;
        
        // Top paper - flips and rises
        paperTop.style.transform = `rotateX(${-angle * 0.8}deg) rotateY(${angle * 0.5}deg) translateZ(${translateZ * 0.9}px) scale(${scale * 1.05})`;
        paperTop.style.opacity = 0.3 + unfold * 0.7;

        // Update indicator
        const percent = Math.round(unfold * 100);
        unfoldFill.style.width = percent + '%';
        unfoldValue.textContent = `Unfold: ${percent}%`;

        // Update status
        if (unfold > 0.9) {
          origamiStatus.textContent = '📄 Fully unfolded! ✨';
          origamiStatus.style.color = '#fbbf24';
        } else if (unfold > 0.4) {
          origamiStatus.textContent = '📄 Unfolding...';
          origamiStatus.style.color = '#818cf8';
        } else if (unfold > 0.05) {
          origamiStatus.textContent = '📄 Opening...';
          origamiStatus.style.color = '#94a3b8';
        } else {
          origamiStatus.textContent = '📄 Click to unfold the origami';
          origamiStatus.style.color = '#94a3b8';
        }

        // Update glow
        const glowIntensity = 0.1 + unfold * 0.4;
        document.querySelector('.origami-scene').style.boxShadow = 
          `0 0 ${40 + unfold * 60}px rgba(99, 102, 241, ${glowIntensity})`;
      }

      // Animation loop
      function animate() {
        if (isAnimating) {
          updateOrigami();
          animationId = requestAnimationFrame(animate);
        }
      }

      // Start animation
      function startAnimation() {
        if (!isAnimating) {
          isAnimating = true;
          animate();
        }
      }

      // Stop animation
      function stopAnimation() {
        if (isAnimating) {
          isAnimating = false;
          if (animationId) {
            cancelAnimationFrame(animationId);
            animationId = null;
          }
          updateOrigami();
        }
      }

      // Unfold
      function unfoldOrigami() {
        targetUnfold = 1;
        startAnimation();
        unfoldBtn.textContent = '📄 Unfolding...';
        unfoldBtn.style.background = 'linear-gradient(135deg, #fbbf24, #f59e0b)';
        unfoldBtn.style.borderColor = '#fcd34d';
        origami.classList.add('unfolding');
      }

      // Fold
      function foldOrigami() {
        targetUnfold = 0;
        startAnimation();
        unfoldBtn.textContent = '📄 Unfold';
        unfoldBtn.style.background = 'linear-gradient(135deg, #6366f1, #4f46e5)';
        unfoldBtn.style.borderColor = '#818cf8';
        origami.classList.remove('unfolding');
      }

      // Reset
      function resetOrigami() {
        targetUnfold = 0;
        unfold = 0;
        stopAnimation();
        updateOrigami();
        unfoldBtn.textContent = '📄 Unfold';
        unfoldBtn.style.background = 'linear-gradient(135deg, #6366f1, #4f46e5)';
        unfoldBtn.style.borderColor = '#818cf8';
        origami.classList.remove('unfolding');
        origamiStatus.textContent = '🔄 Reset complete';
        origamiStatus.style.color = '#94a3b8';
        setTimeout(() => {
          origamiStatus.textContent = '📄 Click to unfold the origami';
        }, 1000);
      }

      // Toggle unfold
      function toggleUnfold() {
        if (unfold > 0.5) {
          foldOrigami();
        } else {
          unfoldOrigami();
        }
      }

      // Event listeners
      if (unfoldBtn) {
        unfoldBtn.addEventListener('click', function(e) {
          e.preventDefault();
          if (unfold > 0.8) {
            foldOrigami();
          } else {
            unfoldOrigami();
          }
        });
      }

      if (foldBtn) {
        foldBtn.addEventListener('click', function(e) {
          e.preventDefault();
          foldOrigami();
        });
      }

      if (resetBtn) {
        resetBtn.addEventListener('click', function(e) {
          e.preventDefault();
          resetOrigami();
        });
      }

      // Click on display to toggle
      const origamiDisplay = document.getElementById('origamiDisplay');
      origamiDisplay.addEventListener('click', function(e) {
        if (e.target === this || e.target.closest('.origami-scene')) {
          toggleUnfold();
        }
      });

      // Keyboard shortcuts
      document.addEventListener('keydown', function(e) {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

        const key = e.key;
        if (key === ' ' || key === 'Space') {
          e.preventDefault();
          toggleUnfold();
        } else if (key === 'u' || key === 'U') {
          e.preventDefault();
          unfoldOrigami();
        } else if (key === 'f' || key === 'F') {
          e.preventDefault();
          foldOrigami();
        } else if (key === 'r' || key === 'R') {
          e.preventDefault();
          resetOrigami();
        }
      });

      // Initialize
      updateOrigami();
      console.log('📄 Origami Unfold ready · shortcuts: [Space] Toggle, [U] Unfold, [F] Fold, [R] Reset');
    })();
  </script>
</body>
</html>
