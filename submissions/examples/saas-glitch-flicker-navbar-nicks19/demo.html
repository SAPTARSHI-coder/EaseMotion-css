<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glitch-Flicker Navbar Demo</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background-color: #020617; /* Slate 950 */
            margin: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
        }
        .hero {
            padding: 4rem 2rem;
            text-align: center;
            color: #f8fafc;
        }
        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 1rem;
        }
        p {
            color: #94a3b8;
            font-size: 1.1rem;
            max-width: 600px;
            margin: 0 auto;
        }
    </style>
</head>
<body>
    <nav class="ease-glitch-navbar">
        <div class="ease-glitch-brand" data-text="SaaS.io">SaaS.io</div>
        <ul class="ease-glitch-nav-links">
            <li><a href="#" class="ease-glitch-nav-link" data-text="Product">Product</a></li>
            <li><a href="#" class="ease-glitch-nav-link" data-text="Pricing">Pricing</a></li>
            <li><a href="#" class="ease-glitch-nav-link" data-text="Docs">Docs</a></li>
        </ul>
    </nav>

    <div class="hero">
        <h1>Welcome to the Future</h1>
        <p>Hover over the navigation bar links and the logo to see the pure CSS glitch and flicker effects. Designed for high-tech SaaS platforms.</p>
    </div>
</body>
</html>
