<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Random Number Animation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="demo">
    <section class="hero">
      <p class="eyebrow">EaseMotion CSS</p>
      <h1>CSS Random Number Animation</h1>
      <p class="description">
        Experimental animation using the proposed CSS <code>random()</code>
        function to generate varying visual values without JavaScript.
      </p>

      <div class="random-stage" aria-label="Animated random number demonstration">
        <div class="orb orb-one" aria-hidden="true"></div>
        <div class="orb orb-two" aria-hidden="true"></div>
        <div class="orb orb-three" aria-hidden="true"></div>

        <div class="random-card">
          <span class="random-label">RANDOM()</span>
          <strong class="random-value">42</strong>
          <span class="random-caption">CSS-generated value</span>
        </div>
      </div>

      <p class="support-note">
        This demo uses an experimental CSS feature and may require a
        browser with <code>random()</code> support.
      </p>
    </section>
  </main>
</body>
</html>
