<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="CSS-only animated magnetic field lines around a magnetic element."
  >
  <title>CSS Magnetic Field Lines</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="page">
    <section class="magnetic-demo" aria-labelledby="magnetic-title">
      <div class="intro">
        <p class="eyebrow">EaseMotion CSS</p>
        <h1 id="magnetic-title">Magnetic Field Lines</h1>
        <p>
          A pure CSS animation that creates flowing magnetic field lines
          around a central magnetic element.
        </p>
      </div>

      <div
        class="magnetic-field"
        role="img"
        aria-label="Animated magnetic field surrounding a central magnet"
      >
        <div class="field-line line-1"></div>
        <div class="field-line line-2"></div>
        <div class="field-line line-3"></div>
        <div class="field-line line-4"></div>
        <div class="field-line line-5"></div>
        <div class="field-line line-6"></div>

        <div class="magnet">
          <span class="magnet-pole north">N</span>
          <span class="magnet-pole south">S</span>
        </div>
      </div>

      <p class="hint">
        CSS-only animation • No JavaScript required
      </p>
    </section>
  </main>
</body>
</html>
