<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elastic Slide Tooltip - Fintech Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="dashboard">

    <h1>Fintech Dashboard</h1>

    <div class="card-grid">

        <!-- Revenue -->
        <div class="card">
            <div class="card-header">
                <h3>Total Revenue</h3>

                <button class="info-btn" aria-label="Revenue information">
                    ⓘ
                    <span class="tooltip">
                        Revenue generated this month after completed transactions.
                    </span>
                </button>
            </div>

            <h2>$84,250</h2>
            <p class="change positive">▲ +12.6%</p>
        </div>

        <!-- Transactions -->
        <div class="card">
            <div class="card-header">
                <h3>Transactions</h3>

                <button class="info-btn" aria-label="Transactions information">
                    ⓘ
                    <span class="tooltip">
                        Total successful payment transactions processed today.
                    </span>
                </button>
            </div>

            <h2>3,482</h2>
            <p class="change positive">▲ +8.1%</p>
        </div>

        <!-- Portfolio -->
        <div class="card">
            <div class="card-header">
                <h3>Portfolio</h3>

                <button class="info-btn" aria-label="Portfolio information">
                    ⓘ
                    <span class="tooltip">
                        Current investment portfolio value across all assets.
                    </span>
                </button>
            </div>

            <h2>$142K</h2>
            <p class="change negative">▼ -1.8%</p>
        </div>

        <!-- Growth -->
        <div class="card">
            <div class="card-header">
                <h3>Growth</h3>

                <button class="info-btn" aria-label="Growth information">
                    ⓘ
                    <span class="tooltip">
                        Month-over-month business growth based on revenue trends.
                    </span>
                </button>
            </div>

            <h2>21.4%</h2>
            <p class="change positive">▲ +3.4%</p>
        </div>

    </div>

</div>

</body>
</html>
