<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-tide-level-station demo</title>
</head>
<body>
<div class="tde-post">
  <div class="tde-tube">
    <i class="tde-water"></i>
    <span class="tde-mark tde-hi">HIGH</span>
    <span class="tde-mark tde-lo">LOW</span>
  </div>
  <div class="tde-read">6.2 FT</div>
  <div class="tde-times">
    <span class="tde-time">HIGH 14:22</span>
    <span class="tde-time">LOW 20:48</span>
  </div>
</div>
</body>
</html>
