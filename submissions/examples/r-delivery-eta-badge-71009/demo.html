<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CSS Delivery ETA Badge demo">
  <title>CSS Delivery ETA Badge</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section class="demo" aria-labelledby="title">
      <p class="eyebrow">EaseMotion CSS</p>

      <h1 id="title">Delivery ETA Badge</h1>

      <p class="intro">
        A polished delivery estimate badge with a subtle animated
        truck indicator and responsive styling.
      </p>

      <div class="examples">

        <article class="delivery-card">
          <div class="product">
            <div class="product-icon" aria-hidden="true">◈</div>
            <div>
              <strong>Wireless Headphones</strong>
              <span>Order #EM2048</span>
            </div>
          </div>

          <div class="eta-badge" aria-label="Delivery expected tomorrow">
            <span class="truck" aria-hidden="true">▰</span>
            <span>
              <small>Delivery ETA</small>
              <strong>Tomorrow</strong>
            </span>
          </div>
        </article>

        <article class="delivery-card compact">
          <div class="eta-badge" aria-label="Delivery expected in two days">
            <span class="truck" aria-hidden="true">▰</span>
            <span>
              <small>Estimated arrival</small>
              <strong>2 days</strong>
            </span>
          </div>

          <span class="fast-label">
            Express delivery
          </span>
        </article>

      </div>
    </section>
  </main>
</body>
</html>
