<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Shimmer-Sweep Navbar - Minimalist Tech</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <nav class="shimmer-navbar">
        <div class="nav-brand">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
            <span>Lumina</span>
        </div>
        
        <!-- Mobile Menu Toggle (Checkbox Hack) -->
        <input type="checkbox" id="mobile-menu-toggle" class="mobile-toggle">
        <label for="mobile-menu-toggle" class="mobile-menu-btn">
            <span></span>
            <span></span>
            <span></span>
        </label>
        
        <ul class="nav-links">
            <li class="nav-item">
                <a href="#" class="nav-link shimmer-text">Documentation</a>
            </li>
            <li class="nav-item">
                <a href="#" class="nav-link shimmer-text active">API Reference</a>
            </li>
            <li class="nav-item">
                <a href="#" class="nav-link shimmer-text">Examples</a>
            </li>
            <li class="nav-item">
                <a href="#" class="nav-link shimmer-text">Changelog</a>
            </li>
        </ul>
        
        <div class="nav-actions">
            <a href="#" class="btn btn-shimmer">
                <span>Deploy Now</span>
            </a>
        </div>
    </nav>
    
    <!-- Decorative background -->
    <div class="page-content">
        <h1>Lumina Design System</h1>
        <p>Hover over the navigation links to see the metallic shimmer effect sweep across the text. The primary button features a continuous background shimmer.</p>
    </div>

</body>
</html>
