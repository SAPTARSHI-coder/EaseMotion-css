<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />
  <meta
    name="description"
    content="Responsive parallax spinner with a cyberpunk visual style."
  />
  <title>Cyberpunk Parallax Spinner</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main class="loader-page">

    <div class="cyber-grid" aria-hidden="true"></div>

    <div class="scanlines" aria-hidden="true"></div>

    <section class="loader-card" aria-label="Loading animation">

      <div class="corner corner-top-left" aria-hidden="true"></div>
      <div class="corner corner-top-right" aria-hidden="true"></div>
      <div class="corner corner-bottom-left" aria-hidden="true"></div>
      <div class="corner corner-bottom-right" aria-hidden="true"></div>

      <div class="status">
        <span class="status-dot" aria-hidden="true"></span>
        SYSTEM PROCESSING
      </div>

      <div class="spinner-stage" aria-hidden="true">

        <div class="orbit orbit-outer">
          <span class="orbit-point point-one"></span>
          <span class="orbit-point point-two"></span>
        </div>

        <div class="orbit orbit-middle">
          <span class="orbit-point point-three"></span>
        </div>

        <div class="orbit orbit-inner"></div>

        <div class="spinner-core">
          <div class="core-ring"></div>
          <div class="core-center"></div>
        </div>

        <div class="parallax-layer layer-one"></div>
        <div class="parallax-layer layer-two"></div>
        <div class="parallax-layer layer-three"></div>
      </div>

      <div class="loader-info">
        <span class="loader-label">INITIALIZING</span>

        <h1>
          CYBER
          <span>LOADING</span>
        </h1>

        <p>
          Establishing secure connection
          <span class="dots" aria-hidden="true">...</span>
        </p>
      </div>

      <div class="progress-wrapper">
        <div class="progress-meta">
          <span>DATA STREAM</span>
          <span>87%</span>
        </div>

        <div class="progress-bar">
          <div class="progress-fill"></div>
        </div>
      </div>

      <div class="terminal-line" aria-hidden="true">
        <span>&gt;_</span>
        <span>PARALLAX ENGINE ONLINE</span>
      </div>

    </section>
  </main>
</body>
</html>
