<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyberpunk Stat Metric Card Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="demo-grid">
    <!-- Card 1 -->
    <article class="stat-card-cyberpunk" tabindex="0">
      <div class="stat-header">
        <span class="stat-label">System Load</span>
        <span class="stat-tag">SYS//01</span>
      </div>
      <div class="stat-value">98.4%</div>
      <div class="stat-footer">
        <span class="stat-trend">▲ 12.3%</span>
        <span class="stat-description">vs target capacity</span>
      </div>
    </article>

    <!-- Card 2 -->
    <article class="stat-card-cyberpunk" tabindex="0">
      <div class="stat-header">
        <span class="stat-label">Neural Throughput</span>
        <span class="stat-tag">NET//02</span>
      </div>
      <div class="stat-value">1,024 GB/s</div>
      <div class="stat-footer">
        <span class="stat-trend">▲ 5.7%</span>
        <span class="stat-description">peak node activity</span>
      </div>
    </article>

    <!-- Card 3 -->
    <article class="stat-card-cyberpunk" tabindex="0">
      <div class="stat-header">
        <span class="stat-label">Security Breaches</span>
        <span class="stat-tag">SEC//03</span>
      </div>
      <div class="stat-value">00</div>
      <div class="stat-footer">
        <span class="stat-trend" style="color: var(--ease-cyber-primary);">● OPTIMAL</span>
        <span class="stat-description">zero active threats</span>
      </div>
    </article>
  </main>

</body>
</html>
