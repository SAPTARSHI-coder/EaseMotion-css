<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claymorphism Datepicker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="page">
        <section class="datepicker" aria-label="Animated datepicker calendar">
            <header class="calendar-header">
                <button class="nav-button" type="button" aria-label="Previous month">
                    ‹
                </button>

                <div class="month-year">
                    <span class="month">August</span>
                    <span class="year">2026</span>
                </div>

                <button class="nav-button" type="button" aria-label="Next month">
                    ›
                </button>
            </header>

            <div class="weekdays" aria-hidden="true">
                <span>Sun</span>
                <span>Mon</span>
                <span>Tue</span>
                <span>Wed</span>
                <span>Thu</span>
                <span>Fri</span>
                <span>Sat</span>
            </div>

            <div class="calendar-grid">
                <button class="day muted" type="button" aria-label="July 26">26</button>
                <button class="day muted" type="button" aria-label="July 27">27</button>
                <button class="day muted" type="button" aria-label="July 28">28</button>
                <button class="day muted" type="button" aria-label="July 29">29</button>
                <button class="day muted" type="button" aria-label="July 30">30</button>
                <button class="day muted" type="button" aria-label="July 31">31</button>

                <button class="day" type="button">1</button>
                <button class="day" type="button">2</button>
                <button class="day" type="button">3</button>
                <button class="day" type="button">4</button>
                <button class="day" type="button">5</button>
                <button class="day" type="button">6</button>
                <button class="day" type="button">7</button>
                <button class="day" type="button">8</button>
                <button class="day" type="button">9</button>
                <button class="day" type="button">10</button>
                <button class="day" type="button">11</button>
                <button class="day" type="button">12</button>
                <button class="day" type="button">13</button>
                <button class="day" type="button">14</button>
                <button class="day" type="button">15</button>
                <button class="day" type="button">16</button>
                <button class="day" type="button">17</button>
                <button class="day" type="button">18</button>
                <button class="day" type="button">19</button>
                <button class="day" type="button">20</button>
                <button class="day" type="button">21</button>
                <button class="day" type="button">22</button>
                <button class="day" type="button">23</button>
                <button class="day" type="button">24</button>
                <button class="day" type="button">25</button>
                <button class="day" type="button">26</button>
                <button class="day" type="button">27</button>
                <button class="day selected" type="button" aria-current="date">28</button>
                <button class="day" type="button">29</button>
                <button class="day" type="button">30</button>
                <button class="day" type="button">31</button>
            </div>

            <footer class="calendar-footer">
                <span>Selected date</span>
                <strong>August 28, 2026</strong>
            </footer>
        </section>
    </main>
</body>

</html>
