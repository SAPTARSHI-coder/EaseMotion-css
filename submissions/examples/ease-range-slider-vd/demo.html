<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ease Range Slider</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="range-demo">
    <div class="range-header">
        <span>Volume</span>
        <span>65%</span>
    </div>

    <input
        class="ease-range"
        type="range"
        min="0"
        max="100"
        value="65"
        aria-label="Volume"
    >

</div>

</body>
</html>
