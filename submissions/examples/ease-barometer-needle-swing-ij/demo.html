<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-barometer-needle-swing demo</title>
</head>
<body>
<div class="bm-case">
  <div class="bm-head">
    <span class="bm-make">TORRICELLI</span>
    <span class="bm-badge">STORM GLASS</span>
  </div>
  <div class="bm-dial">
    <div class="bm-rim"></div>
    <div class="bm-tick bm-t1"></div>
    <div class="bm-tick bm-t2"></div>
    <div class="bm-tick bm-t3"></div>
    <span class="bm-mark bm-rain">RAIN</span>
    <span class="bm-mark bm-fair">FAIR</span>
    <span class="bm-mark bm-dry">DRY</span>
    <div class="bm-needle"></div>
    <div class="bm-pivot"></div>
  </div>
  <div class="bm-reading">29.92 inHg</div>
</div>
</body>
</html>
