<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashpot Dampen Slide — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Dashpot Dampen Slide demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Dashpot Dampen Slide</h1>
      <p class="lede">Dashpot piston damping a sliding mass to rest</p>
    </header>

    <section class="ease-dashpot-dampen-slide" data-demo="dashpot-dampen-slide" aria-live="polite">
      <div class="ease-dashpot-dampen-slide__housing">
        <div class="ease-dashpot-dampen-slide__bezel">
          <div class="ease-dashpot-dampen-slide__face">
            <div class="ease-dashpot-dampen-slide__readout">
              <span class="ease-dashpot-dampen-slide__label">Dashpot Dampen Slide</span>
              <span class="ease-dashpot-dampen-slide__value">LIVE</span>
            </div>
            <div class="ease-dashpot-dampen-slide__motion" aria-hidden="true">
              <span class="ease-dashpot-dampen-slide__a"></span>
              <span class="ease-dashpot-dampen-slide__b"></span>
              <span class="ease-dashpot-dampen-slide__c"></span>
              <span class="ease-dashpot-dampen-slide__d"></span>
            </div>
            <div class="ease-dashpot-dampen-slide__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-dashpot-dampen-slide__controls">
          <button type="button" class="ease-dashpot-dampen-slide__btn primary">Engage</button>
          <button type="button" class="ease-dashpot-dampen-slide__btn">Reset</button>
          <label class="ease-dashpot-dampen-slide__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-dashpot-dampen-slide__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
