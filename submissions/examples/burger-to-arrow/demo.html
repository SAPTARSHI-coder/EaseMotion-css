<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>CSS Burger to Arrow Animation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="demo">
        <section class="component-card" aria-labelledby="demo-title">
            <p class="eyebrow">EaseMotion CSS</p>

            <h1 id="demo-title">Burger to Arrow</h1>

            <p class="description">
                A pure CSS animation that smoothly transforms a hamburger icon
                into a back arrow.
            </p>

            <div class="animation-stage">
                <div
                    class="burger-arrow"
                    role="img"
                    aria-label="Animated hamburger icon transforming into a back arrow"
                >
                    <span class="line line-top"></span>
                    <span class="line line-middle"></span>
                    <span class="line line-bottom"></span>
                </div>
            </div>

            <p class="status">
                Pure CSS · No JavaScript
            </p>
        </section>
    </main>
</body>
</html>
