<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chimney Sweep Brush — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Chimney Sweep Brush demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Chimney Sweep Brush</h1>
      <p class="lede">Chimney sweep brush ascending a flue with soot fall</p>
    </header>

    <section class="ease-chimney-sweep-brush" data-demo="chimney-sweep-brush" aria-live="polite">
      <div class="ease-chimney-sweep-brush__housing">
        <div class="ease-chimney-sweep-brush__bezel">
          <div class="ease-chimney-sweep-brush__face">
            <div class="ease-chimney-sweep-brush__readout">
              <span class="ease-chimney-sweep-brush__label">Chimney Sweep Brush</span>
              <span class="ease-chimney-sweep-brush__value">LIVE</span>
            </div>
            <div class="ease-chimney-sweep-brush__motion" aria-hidden="true">
              <span class="ease-chimney-sweep-brush__a"></span>
              <span class="ease-chimney-sweep-brush__b"></span>
              <span class="ease-chimney-sweep-brush__c"></span>
              <span class="ease-chimney-sweep-brush__d"></span>
            </div>
            <div class="ease-chimney-sweep-brush__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-chimney-sweep-brush__controls">
          <button type="button" class="ease-chimney-sweep-brush__btn primary">Engage</button>
          <button type="button" class="ease-chimney-sweep-brush__btn">Reset</button>
          <label class="ease-chimney-sweep-brush__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-chimney-sweep-brush__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
