<body>
  <main class="page">
    <header class="page-head">
      <h1>3D tilt displace card</h1>

    <section class="demo">
      <div class="3dtiltdisplacecard"><div class="3dtiltdisplacecard-bg"></div><div class="3dtiltdisplacecard-layer 3dtiltdisplacecard-l1">Title</div><div class="3dtiltdisplacecard-layer 3dtiltdisplacecard-l2">Image goes here</div><div class="3dtiltdisplacecard-layer 3dtiltdisplacecard-l3">View →</div></div>
    </section>
    <footer class="page-foot">
