<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern SaaS Pure CSS Neon Modal</title>
    <style>
        /* ==========================================
           1. CUSTOM PARAMETERS (CSS Variables)
           ========================================== */
        :root {
            --modal-bg: #0d0e12;               /* Dark Slate SaaS theme background */
            --modal-border: rgba(255, 255, 255, 0.08);
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            
            /* Animation Controls */
            --modal-timing: 0.4s;
            --modal-easing: cubic-bezier(0.16, 1, 0.3, 1); /* Ultra-smooth out-quint curve */
            --modal-scale-start: 0.94;
            
            /* Neon Configuration */
            --neon-color-raw: 0, 242, 254;     /* RGB value for transparent fallback */
            --neon-glow-color: #00f2fe;        /* Neon Cyan cyan */
            --neon-pulse-color: #7f00ff;       /* Vibrant Purple mix */
        }

        /* ==========================================
           2. BASIC RESET & BASE STYLES
           ========================================== */
        body {
            background: #060709;               /* Deep SaaS dashboard backdrop */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        /* Hide the state controller checkbox */
        .modal-state-trigger {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }

        /* Trigger Trigger Button */
        .open-modal-btn {
            background: linear-gradient(135deg, var(--neon-glow-color), var(--neon-pulse-color));
            color: #000;
            font-weight: 600;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            border: none;
            box-shadow: 0 4px 15px rgba(0, 242, 254, 0.3);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .open-modal-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(0, 242, 254, 0.5);
        }

        /* ==========================================
           3. MODAL COMPONENT & TRANSITIONS
           ========================================== */
        /* Overlay Backdrop */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(4, 5, 7, 0.75);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
            
            /* Start state hidden */
            opacity: 0;
            pointer-events: none;
            transition: opacity var(--modal-timing) var(--modal-easing);
        }

        /* The Modal Window Card */
        .modal-card {
            background: var(--modal-bg);
            border: 1px solid var(--modal-border);
            border-radius: 16px;
            padding: 32px;
            max-width: 480px;
            width: 90%;
            color: var(--text-primary);
            position: relative;
            
            /* Start state scaled down */
            transform: scale(var(--modal-scale-start));
            transition: transform var(--modal-timing) var(--modal-easing),
                        border-color var(--modal-timing) var(--modal-easing),
                        box-shadow var(--modal-timing) var(--modal-easing);
        }

        /* ==========================================
           4. INTERACTIONS & NEON PULSE LOGIC
           ========================================== */
        
        /* Continuous Neon Pulsation Keyframe */
        @keyframes neonGlowPulse {
            0%, 100% {
                box-shadow: 
                    0 0 15px rgba(var(--neon-color-raw), 0.15),
                    0 0 30px rgba(var(--neon-color-raw), 0.1),
                    inset 0 0 12px rgba(var(--neon-color-raw), 0.05);
                border-color: rgba(var(--neon-color-raw), 0.4);
            }
            50% {
                box-shadow: 
                    0 0 25px rgba(127, 0, 255, 0.3),
                    0 0 50px rgba(0, 242, 254, 0.15),
                    inset 0 0 20px rgba(127, 0, 255, 0.1);
                border-color: rgba(127, 0, 255, 0.6);
            }
        }

        /* When trigger checkbox is checked -> Open & Activate CSS animations */
        .modal-state-trigger:checked ~ .modal-overlay {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-state-trigger:checked ~ .modal-overlay .modal-card {
            transform: scale(1);
            /* Combines initial sudden transition with your custom pulse animation loop */
            animation: neonGlowPulse 3s ease-in-out infinite alternate;
            animation-delay: var(--modal-timing);
        }

        /* ==========================================
           5. INTERIOR SAAS MODAL STYLING
           ========================================== */
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .modal-header h3 {
            margin: 0;
            font-size: 1.25rem;
            font-weight: 600;
            letter-spacing: -0.025em;
        }

        .close-icon-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 1.5rem;
            cursor: pointer;
            line-height: 1;
            padding: 4px;
            transition: color 0.2s;
        }

        .close-icon-btn:hover {
            color: var(--text-primary);
        }

        .modal-body p {
            margin: 0 0 24px 0;
            font-size: 0.95rem;
            line-height: 1.6;
            color: var(--text-secondary);
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.08);
        }
    </style>
</head>
<body>

    <!-- Hidden state controller -->
    <input type="checkbox" id="saas-modal-toggle" class="modal-state-trigger">

    <!-- Actual visible trigger button -->
    <label for="saas-modal-toggle" class="open-modal-btn" role="button" tabindex="0">
        View Analytics
    </label>

    <!-- Modal Component Window Wrapper -->
    <div class="modal-overlay">
        <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
            
            <div class="modal-header">
                <h3 id="modal-title">Engine Pulse Sequence</h3>
                <!-- Close clicking behavior mapping back to state checkbox -->
                <label for="saas-modal-toggle" class="close-icon-btn" aria-label="Close modal">&times;</label>
            </div>
            
            <div class="modal-body">
                <p>Zero JavaScript active. The dynamic shifting neon glow effect reacts cleanly via state selectors utilizing hardware-accelerated rendering profiles.</p>
            </div>
            
            <div class="modal-actions">
                <label for="saas-modal-toggle" class="btn-secondary" role="button">Dismiss</label>
            </div>

        </div>
    </div>

</body>
</html>
