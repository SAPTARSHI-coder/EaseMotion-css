<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Pure CSS product card skeleton loading component"
  >
  <title>CSS Product Card Skeleton</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">
    <section class="showcase" aria-labelledby="title">
      <p class="eyebrow">EaseMotion CSS</p>

      <h1 id="title">Product Card Skeleton</h1>

      <p class="intro">
        A responsive product card loading skeleton created entirely with CSS.
      </p>

      <div
        class="product-grid"
        aria-label="Product cards loading"
      >

        <article class="product-card" aria-busy="true">
          <div class="skeleton product-image" aria-hidden="true"></div>

          <div class="product-content">
            <div class="skeleton category"></div>
            <div class="skeleton title-line"></div>
            <div class="skeleton description-line"></div>
            <div class="skeleton description-line short"></div>

            <div class="product-footer">
              <div class="skeleton price"></div>
              <div class="skeleton button"></div>
            </div>
          </div>
        </article>

        <article class="product-card" aria-busy="true">
          <div class="skeleton product-image" aria-hidden="true"></div>

          <div class="product-content">
            <div class="skeleton category"></div>
            <div class="skeleton title-line"></div>
            <div class="skeleton description-line"></div>
            <div class="skeleton description-line short"></div>

            <div class="product-footer">
              <div class="skeleton price"></div>
              <div class="skeleton button"></div>
            </div>
          </div>
        </article>

        <article class="product-card" aria-busy="true">
          <div class="skeleton product-image" aria-hidden="true"></div>

          <div class="product-content">
            <div class="skeleton category"></div>
            <div class="skeleton title-line"></div>
            <div class="skeleton description-line"></div>
            <div class="skeleton description-line short"></div>

            <div class="product-footer">
              <div class="skeleton price"></div>
              <div class="skeleton button"></div>
            </div>
          </div>
        </article>

      </div>
    </section>
  </main>

</body>
</html>
