<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ticklish Reaction – Wobbles and Giggles on Hover</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <h1>🤭 Ticklish Reaction</h1>
    <p class="subtitle">Wobbles and giggles when you hover</p>

    <div class="ticklish-container">
      <div class="ticklish-stage" id="ticklishStage">
        <canvas id="canvas"></canvas>
        
        <!-- Ticklish character -->
        <div class="ticklish-emoji" id="ticklishEmoji">
          <span class="emoji-face" id="emojiFace">🤭</span>
          <span class="emoji-label">Hover me!</span>
        </div>

        <!-- Info overlay -->
        <div class="info-overlay">
          <span class="ticklish-status" id="ticklishStatus">😊 Calm</span>
          <span class="giggle-count" id="giggleCount">✦ 0 giggles</span>
        </div>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <button class="ctrl-btn tickle" id="tickleBtn">🤭 Tickle</button>
      <button class="ctrl-btn reset" id="resetBtn">↺ Reset</button>
      <button class="ctrl-btn toggle" id="toggleBtn">⏸ Pause</button>
    </div>

    <!-- Sliders -->
    <div class="slider-container">
      <span class="slider-label">Ticklishness</span>
      <input type="range" id="intensitySlider" min="0" max="100" value="70" />
      <span class="slider-value" id="intensityValue">70%</span>
    </div>

    <div class="slider-container">
      <span class="slider-label">Wobble Speed</span>
      <input type="range" id="speedSlider" min="1" max="10" value="5" />
      <span class="slider-value" id="speedValue">5×</span>
    </div>

    <div class="slider-container">
      <span class="slider-label">Giggle Duration</span>
      <input type="range" id="durationSlider" min="1" max="10" value="5" />
      <span class="slider-value" id="durationValue">5×</span>
    </div>

    <!-- Status -->
    <div class="status" id="status">🤭 Hover over the emoji to make it giggle!</div>

    <!-- Keyboard shortcuts -->
    <div class="shortcuts">
      <kbd>Hover</kbd> Tickle · <kbd>T</kbd> Tickle · <kbd>R</kbd> Reset · <kbd>Space</kbd> Pause
    </div>
  </div>

  <script>
    (function() {
      "use strict";

      // DOM elements
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      const ticklishEmoji = document.getElementById('ticklishEmoji');
      const emojiFace = document.getElementById('emojiFace');
      const ticklishStatus = document.getElementById('ticklishStatus');
      const giggleCount = document.getElementById('giggleCount');
      const tickleBtn = document.getElementById('tickleBtn');
      const resetBtn = document.getElementById('resetBtn');
      const toggleBtn = document.getElementById('toggleBtn');
      const status = document.getElementById('status');
      const intensitySlider = document.getElementById('intensitySlider');
      const intensityValue = document.getElementById('intensityValue');
      const speedSlider = document.getElementById('speedSlider');
      const speedValue = document.getElementById('speedValue');
      const durationSlider = document.getElementById('durationSlider');
      const durationValue = document.getElementById('durationValue');

      // State
      let isGiggling = false;
      let isPaused = false;
      let animationId = null;
      let time = 0;
      let giggleCountVal = 0;
      let giggleIntensity = 0;
      let targetIntensity = 0;
      let particles = [];
      let wobbleX = 0;
      let wobbleY = 0;
      let scale = 1;
      let rotation = 0;
      let emojiStates = ['🤭', '😂', '😆', '🤣', '😊', '😄', '😁', '😹'];
      let currentEmoji = 0;
      let isHovering = false;

      // ----- Canvas setup -----
      function setupCanvas() {
        const rect = canvas.parentElement.getBoundingClientRect();
        const size = Math.min(rect.width - 40, 600);
        canvas.width = size;
        canvas.height = size;
        canvas.style.width = size + 'px';
        canvas.style.height = size + 'px';
      }

      // ----- Giggle particle class -----
      class GiggleParticle {
        constructor(x, y) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 0.5 + Math.random() * 2;
          this.x = x;
          this.y = y;
          this.vx = Math.cos(angle) * speed;
          this.vy = Math.sin(angle) * speed - 1;
          this.size = 2 + Math.random() * 5;
          this.life = 1;
          this.decay = 0.01 + Math.random() * 0.02;
          this.hue = 30 + Math.random() * 40;
          this.saturation = 80 + Math.random() * 20;
          this.lightness = 60 + Math.random() * 30;
          this.opacity = 0.5 + Math.random() * 0.5;
          this.gravity = 0.05;
          this.friction = 0.99;
          this.shape = Math.random() > 0.7 ? 'star' : 'circle';
        }

        update() {
          this.vx *= this.friction;
          this.vy *= this.friction;
          this.vy += this.gravity;
          this.x += this.vx;
          this.y += this.vy;
          this.life -= this.decay;
          this.size *= 0.998;
          return this.life > 0 && this.size > 0.1;
        }

        draw(ctx) {
          const alpha = this.life * this.opacity;
          const size = this.size * this.life;

          // Glow
          const gradient = ctx.createRadialGradient(
            this.x, this.y, 0,
            this.x, this.y, size * 4
          );
          gradient.addColorStop(0, `hsla(${this.hue + 20}, 100%, 90%, ${alpha * 0.2})`);
          gradient.addColorStop(1, `hsla(${this.hue}, 100%, 60%, 0)`);
          ctx.fillStyle = gradient;
          ctx.beginPath();
          ctx.arc(this.x, this.y, size * 4, 0, Math.PI * 2);
          ctx.fill();

          // Core
          if (this.shape === 'star') {
            ctx.fillStyle = `hsla(${this.hue + 30}, 100%, 95%, ${alpha * 0.9})`;
            ctx.beginPath();
            for (let i = 0; i < 5; i++) {
              const angle = (i / 5) * Math.PI * 2 - Math.PI / 2;
              const r = i % 2 === 0 ? size : size * 0.4;
              const x = Math.cos(angle) * r;
              const y = Math.sin(angle) * r;
              if (i === 0) ctx.moveTo(x, y);
              else ctx.lineTo(x, y);
            }
            ctx.closePath();
            ctx.fill();
          } else {
            ctx.fillStyle = `hsla(${this.hue + 30}, 100%, 95%, ${alpha * 0.9})`;
            ctx.beginPath();
            ctx.arc(this.x, this.y, size, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      }

      // ----- Create giggle particles -----
      function createGiggleParticles(x, y, count = 20) {
        for (let i = 0; i < count; i++) {
          particles.push(new GiggleParticle(x, y));
        }
      }

      // ----- Update ticklish reaction -----
      function updateTicklish() {
        const intensity = parseInt(intensitySlider.value) / 100;
        const speed = parseInt(speedSlider.value) / 5;
        const duration = parseInt(durationSlider.value) / 5;

        // Smooth intensity transition
        const diff = targetIntensity - giggleIntensity;
        if (Math.abs(diff) > 0.001) {
          giggleIntensity += diff * 0.05 * speed;
        } else {
          giggleIntensity = targetIntensity;
        }

        // Calculate wobble
        const wobbleAmount = giggleIntensity * intensity * 15;
        const wobbleSpeed = 2 + speed * 2;
        
        if (giggleIntensity > 0.01) {
          wobbleX = Math.sin(time * wobbleSpeed) * wobbleAmount;
          wobbleY = Math.cos(time * wobbleSpeed * 0.7 + 0.5) * wobbleAmount * 0.6;
          rotation = Math.sin(time * wobbleSpeed * 0.5) * wobbleAmount * 0.02;
          scale = 1 + Math.sin(time * wobbleSpeed * 1.2) * wobbleAmount * 0.008;
        } else {
          wobbleX = 0;
          wobbleY = 0;
          rotation = 0;
          scale = 1;
        }

        // Update emoji
        if (giggleIntensity > 0.5) {
          const emojiIndex = Math.floor((giggleIntensity - 0.5) * 4) % 4;
          emojiFace.textContent = ['😂', '😆', '🤣', '😹'][emojiIndex] || '😂';
        } else if (giggleIntensity > 0.1) {
          emojiFace.textContent = '😊';
        } else {
          emojiFace.textContent = '🤭';
        }

        // Apply transform to emoji
        ticklishEmoji.style.transform = `translate(${wobbleX}px, ${wobbleY}px) rotate(${rotation}rad) scale(${scale})`;
        ticklishEmoji.style.transition = 'transform 0.05s ease';

        // Update status
        if (giggleIntensity > 0.5) {
          ticklishStatus.textContent = '😂 Giggling!';
          status.textContent = '😂 Ticklish! Stop hovering!';
        } else if (giggleIntensity > 0.1) {
          ticklishStatus.textContent = '😊 Ticklish';
          status.textContent = '😊 Hehe... that tickles!';
        } else {
          ticklishStatus.textContent = '😊 Calm';
          status.textContent = '🤭 Hover over the emoji to make it giggle!';
        }
      }

      // ----- Draw -----
      function draw() {
        const w = canvas.width;
        const h = canvas.height;
        const cx = w / 2;
        const cy = h / 2;

        // Clear
        ctx.clearRect(0, 0, w, h);

        // Background
        const bgGradient = ctx.createRadialGradient(cx, cy, 0, cx, cy, w * 0.7);
        bgGradient.addColorStop(0, '#1a0a1a');
        bgGradient.addColorStop(0.5, '#0f0a12');
        bgGradient.addColorStop(1, '#050508');
        ctx.fillStyle = bgGradient;
        ctx.fillRect(0, 0, w, h);

        // Draw particles
        if (!isPaused) {
          particles = particles.filter(p => p.update());
        }
        particles.forEach(p => p.draw(ctx));

        // Update ticklish effect
        if (!isPaused) {
          updateTicklish();
        }

        // Draw emoji shadow
        const shadowGrad = ctx.createRadialGradient(cx + wobbleX * 0.3, cy + wobbleY * 0.3 + 20, 0, cx + wobbleX * 0.3, cy + wobbleY * 0.3 + 20, 40);
        shadowGrad.addColorStop(0, `rgba(0, 0, 0, ${0.1 + giggleIntensity * 0.1})`);
        shadowGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = shadowGrad;
        ctx.beginPath();
        ctx.arc(cx + wobbleX * 0.3, cy + wobbleY * 0.3 + 20, 40, 0, Math.PI * 2);
        ctx.fill();

        // Update emoji position
        ticklishEmoji.style.left = (cx + wobbleX - 50) + 'px';
        ticklishEmoji.style.top = (cy + wobbleY - 50) + 'px';

        // Update particle count
        giggleCount.textContent = `✦ ${particles.length} giggles`;
      }

      // ----- Animation loop -----
      function animate() {
        time += 0.016;
        draw();
        animationId = requestAnimationFrame(animate);
      }

      // ----- Start animation -----
      function startAnimation() {
        if (animationId) {
          cancelAnimationFrame(animationId);
        }
        animate();
      }

      // ----- Trigger tickle -----
      function triggerTickle() {
        if (isPaused) return;
        
        const intensity = parseInt(intensitySlider.value) / 100;
        targetIntensity = Math.min(1, targetIntensity + 0.3 * intensity);
        
        // Create particles
        const rect = canvas.getBoundingClientRect();
        const cx = canvas.width / 2;
        const cy = canvas.height / 2;
        const count = 10 + Math.floor(intensity * 20);
        createGiggleParticles(cx + wobbleX, cy + wobbleY, count);
        
        giggleCountVal++;
        giggleCount.textContent = `✦ ${giggleCountVal} giggles`;
        status.textContent = '🤭 Tickle!';
        
        setTimeout(() => {
          if (targetIntensity > 0.1) {
            status.textContent = '😊 Hehe... that tickles!';
          }
        }, 500);
      }

      // ----- Reset -----
      function resetTicklish() {
        targetIntensity = 0;
        giggleIntensity = 0;
        isHovering = false;
        particles = [];
        giggleCountVal = 0;
        giggleCount.textContent = '✦ 0 giggles';
        ticklishStatus.textContent = '😊 Calm';
        status.textContent = '↺ Reset';
        emojiFace.textContent = '🤭';
        ticklishEmoji.style.transform = 'translate(0, 0) rotate(0rad) scale(1)';
        intensitySlider.value = 70;
        intensityValue.textContent = '70%';
        speedSlider.value = 5;
        speedValue.textContent = '5×';
        durationSlider.value = 5;
        durationValue.textContent = '5×';
        setTimeout(() => {
          status.textContent = '🤭 Hover over the emoji to make it giggle!';
        }, 500);
      }

      // ----- Toggle pause -----
      function togglePause() {
        isPaused = !isPaused;
        toggleBtn.textContent = isPaused ? '▶ Play' : '⏸ Pause';
        status.textContent = isPaused ? '⏸ Paused' : '▶ Resumed';
        ticklishStatus.textContent = isPaused ? '⏸ Paused' : (giggleIntensity > 0.1 ? '😊 Ticklish' : '😊 Calm');
      }

      // ----- Event Listeners -----
      // Hover effects
      ticklishEmoji.addEventListener('mouseenter', () => {
        isHovering = true;
        triggerTickle();
        // Continue tickling while hovering
        if (!isPaused) {
          clearInterval(window.tickleInterval);
          window.tickleInterval = setInterval(() => {
            if (isHovering && !isPaused) {
              triggerTickle();
            }
          }, 300);
        }
      });

      ticklishEmoji.addEventListener('mouseleave', () => {
        isHovering = false;
        clearInterval(window.tickleInterval);
        setTimeout(() => {
          if (!isHovering && !isPaused) {
            targetIntensity = 0;
            status.textContent = '🤭 Hover over the emoji to make it giggle!';
            setTimeout(() => {
              if (!isHovering && giggleIntensity < 0.1) {
                ticklishStatus.textContent = '😊 Calm';
              }
            }, 500);
          }
        }, 500);
      });

      // Touch support
      ticklishEmoji.addEventListener('touchstart', (e) => {
        e.preventDefault();
        isHovering = true;
        triggerTickle();
        if (!isPaused) {
          clearInterval(window.tickleInterval);
          window.tickleInterval = setInterval(() => {
            if (isHovering && !isPaused) {
              triggerTickle();
            }
          }, 300);
        }
      });

      ticklishEmoji.addEventListener('touchend', () => {
        isHovering = false;
        clearInterval(window.tickleInterval);
        setTimeout(() => {
          if (!isHovering && !isPaused) {
            targetIntensity = 0;
            status.textContent = '🤭 Hover over the emoji to make it giggle!';
          }
        }, 500);
      });

      // Buttons
      tickleBtn.addEventListener('click', triggerTickle);
      resetBtn.addEventListener('click', resetTicklish);
      toggleBtn.addEventListener('click', togglePause);

      // Sliders
      intensitySlider.addEventListener('input', (e) => {
        intensityValue.textContent = e.target.value + '%';
      });

      speedSlider.addEventListener('input', (e) => {
        speedValue.textContent = e.target.value + '×';
      });

      durationSlider.addEventListener('input', (e) => {
        durationValue.textContent = e.target.value + '×';
      });

      // Keyboard shortcuts
      document.addEventListener('keydown', (e) => {
        if (e.key === 't' || e.key === 'T') {
          e.preventDefault();
          triggerTickle();
        }
        if (e.key === 'r' || e.key === 'R') {
          e.preventDefault();
          resetTicklish();
        }
        if (e.key === ' ' || e.key === 'Space') {
          e.preventDefault();
          togglePause();
        }
      });

      // Click canvas to tickle
      canvas.addEventListener('click', triggerTickle);

      // ----- Resize handler -----
      let resizeTimeout;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(() => {
          setupCanvas();
        }, 200);
      });

      // ----- Init -----
      function init() {
        setupCanvas();
        startAnimation();
        status.textContent = '🤭 Hover over the emoji to make it giggle!';
        // Reset ticklish emoji position
        const rect = canvas.getBoundingClientRect();
        const cx = canvas.width / 2;
        const cy = canvas.height / 2;
        ticklishEmoji.style.left = (cx - 50) + 'px';
        ticklishEmoji.style.top = (cy - 50) + 'px';
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }

    })();
  </script>
</body>
</html>
