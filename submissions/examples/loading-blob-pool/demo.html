<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loading Blob Pool — EaseMotion CSS</title>
    <link rel="stylesheet" href="style.css" />
    <style>
        /* Page-only styles, not part of the component itself */
        body {
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 24px;
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            background: #0f172a;
            color: #e2e8f0;
        }

        h1 {
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 0.02em;
        }

        p {
            max-width: 380px;
            text-align: center;
            font-size: 0.9rem;
            color: #94a3b8;
            margin-top: -12px;
        }
    </style>
</head>

<body>
    <h1>Loading Blob Pool</h1>

    <!-- Component markup: a container with any number of blob children -->
    <div class="blob-pool">
        <div class="blob-pool__blob"></div>
        <div class="blob-pool__blob"></div>
        <div class="blob-pool__blob"></div>
    </div>

    <p>Three morphing blobs bob inside a pool as an organic loading indicator.</p>
</body>

</html>
