<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gyrocompass Precess — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Gyrocompass Precess demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Gyrocompass Precess</h1>
      <p class="lede">Gyrocompass rotor precessing toward true north</p>
    </header>

    <section class="ease-gyrocompass-precess" data-demo="gyrocompass-precess" aria-live="polite">
      <div class="ease-gyrocompass-precess__housing">
        <div class="ease-gyrocompass-precess__bezel">
          <div class="ease-gyrocompass-precess__face">
            <div class="ease-gyrocompass-precess__readout">
              <span class="ease-gyrocompass-precess__label">Gyrocompass Precess</span>
              <span class="ease-gyrocompass-precess__value">LIVE</span>
            </div>
            <div class="ease-gyrocompass-precess__motion" aria-hidden="true">
              <span class="ease-gyrocompass-precess__a"></span>
              <span class="ease-gyrocompass-precess__b"></span>
              <span class="ease-gyrocompass-precess__c"></span>
              <span class="ease-gyrocompass-precess__d"></span>
            </div>
            <div class="ease-gyrocompass-precess__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-gyrocompass-precess__controls">
          <button type="button" class="ease-gyrocompass-precess__btn primary">Engage</button>
          <button type="button" class="ease-gyrocompass-precess__btn">Reset</button>
          <label class="ease-gyrocompass-precess__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-gyrocompass-precess__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
