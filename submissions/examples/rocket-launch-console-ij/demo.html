<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-rocket-launch-console</title>
</head>
<body>
<main class="rlc-console">
  <header class="rlc-top">
    <h1 class="rlc-mission">Apollo X</h1>
    <span class="rlc-status">Countdown</span>
  </header>
  <section class="rlc-count" aria-label="countdown clock">
    <strong class="rlc-clock">T-00:04:32</strong>
  </section>
  <section class="rlc-fuel" aria-label="fuel gauges">
    <div class="rlc-tank"><span class="rlc-fill rlc-ox"></span></div>
    <div class="rlc-tank"><span class="rlc-fill rlc-hy"></span></div>
  </section>
  <section class="rlc-switches" aria-label="toggle switches">
    <span class="rlc-toggle"></span>
    <span class="rlc-toggle"></span>
    <span class="rlc-toggle"></span>
  </section>
  <footer class="rlc-foot">
    <span class="rlc-abort">Abort</span>
    <span class="rlc-launch">Launch</span>
  </footer>
</main>
</body>
</html>
