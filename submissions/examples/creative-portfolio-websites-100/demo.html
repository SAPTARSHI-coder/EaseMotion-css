<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neumorphic Parallax Cards</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="hero">
    <span class="tag">CREATIVE PORTFOLIO</span>
    <h1>Creative Works</h1>
    <p>
      Explore selected projects through a soft neumorphic
      interface with interactive depth.
    </p>
  </header>

  <main class="grid">

    <article class="project">
      <div class="visual visual-one">
        <span>01</span>
      </div>

      <div class="content">
        <small>Brand Identity</small>
        <h2>Minimal Studio</h2>
        <a href="#">Explore →</a>
      </div>
    </article>

    <article class="project">
      <div class="visual visual-two">
        <span>02</span>
      </div>

      <div class="content">
        <small>Digital Product</small>
        <h2>Orbit Interface</h2>
        <a href="#">Explore →</a>
      </div>
    </article>

    <article class="project">
      <div class="visual visual-three">
        <span>03</span>
      </div>

      <div class="content">
        <small>Photography</small>
        <h2>City Stories</h2>
        <a href="#">Explore →</a>
      </div>
    </article>

    <article class="project">
      <div class="visual visual-four">
        <span>04</span>
      </div>

      <div class="content">
        <small>Web Experience</small>
        <h2>Future Space</h2>
        <a href="#">Explore →</a>
      </div>
    </article>

  </main>

  <script>
    const cards = document.querySelectorAll(".project");

    cards.forEach(card => {

      card.addEventListener("mousemove", event => {
        const box = card.getBoundingClientRect();

        const x = event.clientX - box.left;
        const y = event.clientY - box.top;

        const rotateX = ((y / box.height) - 0.5) * -7;
        const rotateY = ((x / box.width) - 0.5) * 7;

        card.style.transform =
          `perspective(800px)
           rotateX(${rotateX}deg)
           rotateY(${rotateY}deg)
           translateY(-8px)`;
      });

      card.addEventListener("mouseleave", () => {
        card.style.transform =
          "perspective(800px) rotateX(0) rotateY(0) translateY(0)";
      });

    });
  </script>

</body>
</html>
