<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Glitch Flicker Drawer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="container">

  <input type="checkbox" id="drawer-toggle">

  <label for="drawer-toggle" class="menu-btn">
    ☰ Products
  </label>

  <div class="overlay"></div>

  <aside class="drawer">

    <div class="glitch-title" data-text="PRODUCT HUB">
      PRODUCT HUB
    </div>

    <nav>
      <a href="#">New Arrivals</a>
      <a href="#">Trending</a>
      <a href="#">Accessories</a>
      <a href="#">Gaming</a>
      <a href="#">Offers</a>
      <a href="#">Wishlist</a>
      <a href="#">Support</a>
    </nav>

    <label for="drawer-toggle" class="close-btn">
      ✕ Close
    </label>

  </aside>

</div>

</body>
</html>
