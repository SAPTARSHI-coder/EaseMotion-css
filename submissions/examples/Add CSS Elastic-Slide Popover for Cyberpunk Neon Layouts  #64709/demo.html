<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Elastic-Slide Popover - Cyberpunk Neon Layouts</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="cyberpunk-container">
    <div class="popover-wrapper">
      <input type="checkbox" id="popover-toggle" class="popover-toggle-input">
      
      <label for="popover-toggle" class="cyber-btn">
        INITIATE UPLINK
        <span class="glitch-effect"></span>
      </label>
      
      <div class="elastic-popover" role="dialog" aria-label="Uplink Information">
        <div class="popover-content">
          <h3 class="neon-title">SYSTEM STATUS: ONLINE</h3>
          <p class="neon-text">Connection established. Neural interface active and synchronized.</p>
          <ul class="neon-list">
            <li>Bandwidth: 99.9%</li>
            <li>Security: Breached</li>
            <li>Tracing: Evaded</li>
          </ul>
          <label for="popover-toggle" class="close-btn" aria-label="Close popover">ABORT</label>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
