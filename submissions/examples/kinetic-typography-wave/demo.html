<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="CSS-only kinetic typography wave animation with staggered character motion."
  >
  <title>Kinetic Typography Wave</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="kinetic-demo">
    <section class="hero" aria-labelledby="wave-title">
      <p class="eyebrow">EaseMotion CSS</p>

      <h1 id="wave-title" class="wave-text" aria-label="Move with the wave">
        <span aria-hidden="true">
          <span class="char">M</span>
          <span class="char">o</span>
          <span class="char">v</span>
          <span class="char">e</span>
          <span class="space" aria-hidden="true">&nbsp;</span>
          <span class="char">w</span>
          <span class="char">i</span>
          <span class="char">t</span>
          <span class="char">h</span>
          <span class="space" aria-hidden="true">&nbsp;</span>
          <span class="char">t</span>
          <span class="char">h</span>
          <span class="char">e</span>
          <span class="space" aria-hidden="true">&nbsp;</span>
          <span class="char">w</span>
          <span class="char">a</span>
          <span class="char">v</span>
          <span class="char">e</span>
        </span>
      </h1>

      <p class="description">
        A pure CSS kinetic typography effect using staggered character
        animation delays, transforms, and opacity changes.
      </p>
    </section>
  </main>
</body>
</html>
