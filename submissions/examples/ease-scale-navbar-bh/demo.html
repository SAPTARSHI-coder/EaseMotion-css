<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EaseMotion CSS - Scale-Hover Navbar</title>
  <link rel="stylesheet" href="../../core/easemotion.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Navbar Demo -->
  <nav class="ease-scale-navbar">
    <div class="nav-brand">
      <span class="brand-icon">💹</span>
      <span class="brand-text">FinTrack</span>
    </div>
    
    <ul class="nav-links">
      <li><a href="#" class="ease-scale-nav-link ease-scale-nav-active">Dashboard</a></li>
      <li><a href="#" class="ease-scale-nav-link">Portfolio</a></li>
      <li><a href="#" class="ease-scale-nav-link">Analytics</a></li>
      <li><a href="#" class="ease-scale-nav-link">Reports</a></li>
    </ul>

    <div class="nav-actions">
      <a href="#" class="ease-scale-nav-link">Settings</a>
      <button class="ease-scale-btn">Sign Out</button>
    </div>

    <button class="mobile-toggle" aria-label="Toggle menu">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </nav>

  <div class="container">
    <header class="ease-fade-in">
      <h1>Scale-Hover Navbar</h1>
      <p class="subtitle">Fintech-style navigation with scale animations</p>
    </header>

    <main class="ease-slide-up">
      <section class="demo-section">
        <h2>Dashboard Preview</h2>
        <div class="dashboard-preview">
          <div class="sidebar">
            <a href="#" class="ease-scale-nav-link ease-scale-nav-active">📊 Overview</a>
            <a href="#" class="ease-scale-nav-link">📈 Performance</a>
            <a href="#" class="ease-scale-nav-link">💰 Accounts</a>
            <a href="#" class="ease-scale-nav-link">📋 Transactions</a>
            <a href="#" class="ease-scale-nav-link">🎯 Goals</a>
          </div>
          <div class="main-content">
            <h3>Welcome back!</h3>
            <p>Your portfolio is performing well today.</p>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script>
    // Mobile toggle functionality
    document.querySelector('.mobile-toggle').addEventListener('click', function() {
      document.querySelector('.nav-links').classList.toggle('show');
    });
  </script>
</body>
</html>
