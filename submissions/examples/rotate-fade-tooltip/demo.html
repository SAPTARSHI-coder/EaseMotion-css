<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rotate Fade Tooltip</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">

        <h1>Creative Portfolio</h1>
        <p class="subtitle">
            Hover over a project card to reveal the tooltip.
        </p>

        <section class="portfolio-grid">

            <article class="card">
                <img
                    src="https://picsum.photos/400/250?random=1"
                    alt="Portfolio Project">

                <div class="tooltip">
                    UI/UX Case Study
                </div>
            </article>

            <article class="card">
                <img
                    src="https://picsum.photos/400/250?random=2"
                    alt="Portfolio Project">

                <div class="tooltip">
                    Branding Project
                </div>
            </article>

            <article class="card">
                <img
                    src="https://picsum.photos/400/250?random=3"
                    alt="Portfolio Project">

                <div class="tooltip">
                    Mobile App Design
                </div>
            </article>

        </section>

    </main>

</body>
</html>
