<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Interactive tilt rotate card demo">
  <title>Tilt Rotate Card</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main>
    <h1>Tilt Rotate Card</h1>

    <div class="card-wrapper">
      <article class="tilt-card" id="tiltCard" tabindex="0">
        <div class="card-content">
          <span class="card-label">EASEMOTION</span>
          <h2>Tilt Rotate</h2>
          <p>
            Move your pointer across the card to see the
            3D tilt and dynamic shadow effect.
          </p>
          <button type="button">Explore</button>
        </div>
      </article>
    </div>
  </main>

  <script>
    const card = document.getElementById("tiltCard");

    const maxTilt = 12;

    card.addEventListener("pointermove", (event) => {
      const rect = card.getBoundingClientRect();

      const x = event.clientX - rect.left;
      const y = event.clientY - rect.top;

      const centerX = rect.width / 2;
      const centerY = rect.height / 2;

      const rotateY = ((x - centerX) / centerX) * maxTilt;
      const rotateX = ((centerY - y) / centerY) * maxTilt;

      const shadowX = rotateY * 1.5;
      const shadowY = rotateX * -1.5;

      card.style.setProperty(
        "--rotate-x",
        `${rotateX}deg`
      );

      card.style.setProperty(
        "--rotate-y",
        `${rotateY}deg`
      );

      card.style.setProperty(
        "--shadow-x",
        `${shadowX}px`
      );

      card.style.setProperty(
        "--shadow-y",
        `${shadowY}px`
      );
    });

    card.addEventListener("pointerleave", () => {
      card.style.setProperty("--rotate-x", "0deg");
      card.style.setProperty("--rotate-y", "0deg");
      card.style.setProperty("--shadow-x", "0px");
      card.style.setProperty("--shadow-y", "20px");
    });
  </script>
</body>
</html>
