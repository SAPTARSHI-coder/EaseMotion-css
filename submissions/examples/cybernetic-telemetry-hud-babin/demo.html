<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cybernetic Telemetry HUD Display</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="hud-container">
    <header class="hud-header">
      <div class="system-status-indicator"></div>
      <h1 class="hud-title">SYSTEM TELEMETRY HUD // v4.0.8</h1>
      <span class="hud-badge">ONLINE</span>
    </header>

    <div class="hud-grid">
      <div class="hud-card">
        <h3>CORE OVERCLOCK</h3>
        <div class="hud-metric">4.82 GHZ</div>
        <div class="hud-bar"><div class="hud-bar-fill" style="width: 82%;"></div></div>
        <p class="hud-foot">STABLE // LIQUID COOLED</p>
      </div>

      <div class="hud-card">
        <h3>QUANTUM MATRIX</h3>
        <div class="hud-metric">99.4%</div>
        <div class="hud-bar"><div class="hud-bar-fill warning" style="width: 94%;"></div></div>
        <p class="hud-foot">BUFFER SYNC ACTIVE</p>
      </div>

      <div class="hud-card">
        <h3>NEURAL THREADS</h3>
        <div class="hud-metric">1,024 /s</div>
        <div class="hud-bar"><div class="hud-bar-fill" style="width: 65%;"></div></div>
        <p class="hud-foot">PARALLEL PROCESSING</p>
      </div>
    </div>
  </div>
</body>
</html>
