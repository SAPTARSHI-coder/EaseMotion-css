<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-car-odometer-dashboard</title>
</head>
<body>
<main class="cod-panel">
  <header class="cod-head">
    <h1 class="cod-title">Cockpit</h1>
    <span class="cod-speed-live">km/h</span>
  </header>
  <section class="cod-speedo" aria-label="speed gauge">
    <span class="cod-ticks"></span>
    <span class="cod-num cod-num-0">0</span>
    <span class="cod-num cod-num-40">40</span>
    <span class="cod-num cod-num-80">80</span>
    <span class="cod-num cod-num-120">120</span>
    <span class="cod-num cod-num-160">160</span>
    <span class="cod-needle"></span>
    <strong class="cod-speed">86</strong>
  </section>
  <section class="cod-meter cod-meter-fuel">
    <span class="cod-label">Fuel</span>
    <div class="cod-fuel-track"><div class="cod-fuel-fill"></div></div>
    <span class="cod-fuel-value">3/4</span>
  </section>
  <section class="cod-meter cod-meter-temp">
    <span class="cod-label">Temp</span>
    <div class="cod-temp-track"><div class="cod-temp-fill"></div></div>
    <span class="cod-temp-value">90C</span>
  </section>
  <section class="cod-odo">
    <span class="cod-odo-label">Odometer</span>
    <div class="cod-odo-digits">
      <span class="cod-digit">0</span>
      <span class="cod-digit">4</span>
      <span class="cod-digit">8</span>
      <span class="cod-digit">2</span>
      <span class="cod-digit">6</span>
      <span class="cod-digit cod-digit-roll">3</span>
    </div>
    <span class="cod-odo-unit">km</span>
  </section>
</main>
</body>
</html>
