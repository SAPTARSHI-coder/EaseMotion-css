<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-analog-clock-face demo</title>
</head>
<body>
<div class="acf-app">
  <span class="acf-brand">MASTER CLOCK</span>
  <div class="acf-face">
    <span class="acf-tick acf-t12"></span>
    <span class="acf-tick acf-t3"></span>
    <span class="acf-tick acf-t6"></span>
    <span class="acf-tick acf-t9"></span>
    <div class="acf-hand acf-hour"></div>
    <div class="acf-hand acf-minute"></div>
    <div class="acf-hand acf-second"></div>
    <span class="acf-center"></span>
  </div>
</div>
</body>
</html>
