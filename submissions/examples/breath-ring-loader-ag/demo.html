<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Breath Ring Loader — EaseMotion</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="demo-shell">
      <header class="demo-header">
        <h1>Breath Ring Loader</h1>
        <p>
          A pure CSS, calm rhythmic loading component following an
          expand-hold-contract sequence.
        </p>
      </header>

      <section class="demo-grid" aria-label="Breath Ring Loader Showcase">
        <div class="demo-card">
          <div
            class="ease-breath-ring-wrapper"
            role="status"
            aria-live="polite"
          >
            <div class="ease-breath-ring ease-breath-ring-sm">
              <div class="ease-breath-ring-core"></div>
            </div>
            <span class="sr-only">Loading, please wait...</span>
          </div>
          <span class="demo-card-label">Small Variant</span>
        </div>

        <div class="demo-card">
          <div
            class="ease-breath-ring-wrapper"
            role="status"
            aria-live="polite"
          >
            <div class="ease-breath-ring">
              <div class="ease-breath-ring-core"></div>
            </div>
            <span class="sr-only">Loading, please wait...</span>
          </div>
          <span class="demo-card-label">Default (Primary)</span>
        </div>

        <div class="demo-card">
          <div
            class="ease-breath-ring-wrapper"
            role="status"
            aria-live="polite"
          >
            <div
              class="ease-breath-ring ease-breath-ring-lg ease-breath-ring-success"
            >
              <div class="ease-breath-ring-core"></div>
            </div>
            <span class="sr-only">Loading, please wait...</span>
          </div>
          <span class="demo-card-label">Large Success</span>
        </div>

        <div class="demo-card">
          <div
            class="ease-breath-ring-wrapper"
            role="status"
            aria-live="polite"
          >
            <div class="ease-breath-ring ease-breath-ring-info">
              <div class="ease-breath-ring-core"></div>
            </div>
            <span class="sr-only">Loading, please wait...</span>
          </div>
          <span class="demo-card-label">Info Theme</span>
        </div>
      </section>
    </main>
  </body>
</html>
