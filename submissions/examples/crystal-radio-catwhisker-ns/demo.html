<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crystal Radio Catwhisker — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Crystal Radio Catwhisker demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Crystal Radio Catwhisker</h1>
      <p class="lede">Crystal radio catwhisker probing a galena crystal</p>
    </header>

    <section class="ease-crystal-radio-catwhisker" data-demo="crystal-radio-catwhisker" aria-live="polite">
      <div class="ease-crystal-radio-catwhisker__housing">
        <div class="ease-crystal-radio-catwhisker__bezel">
          <div class="ease-crystal-radio-catwhisker__face">
            <div class="ease-crystal-radio-catwhisker__readout">
              <span class="ease-crystal-radio-catwhisker__label">Crystal Radio Catwhisker</span>
              <span class="ease-crystal-radio-catwhisker__value">LIVE</span>
            </div>
            <div class="ease-crystal-radio-catwhisker__motion" aria-hidden="true">
              <span class="ease-crystal-radio-catwhisker__a"></span>
              <span class="ease-crystal-radio-catwhisker__b"></span>
              <span class="ease-crystal-radio-catwhisker__c"></span>
              <span class="ease-crystal-radio-catwhisker__d"></span>
            </div>
            <div class="ease-crystal-radio-catwhisker__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-crystal-radio-catwhisker__controls">
          <button type="button" class="ease-crystal-radio-catwhisker__btn primary">Engage</button>
          <button type="button" class="ease-crystal-radio-catwhisker__btn">Reset</button>
          <label class="ease-crystal-radio-catwhisker__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-crystal-radio-catwhisker__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
