<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blur Entrance Tabs - Product Catalog</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<section class="catalog">

    <div class="heading">
        <h1>Product Catalog</h1>
        <p>Explore our latest collection with animated blur entrance tabs.</p>
    </div>

    <input type="radio" name="tabs" id="tab1" checked>
    <input type="radio" name="tabs" id="tab2">
    <input type="radio" name="tabs" id="tab3">

    <div class="tabs">

        <label for="tab1" class="tab">Featured</label>
        <label for="tab2" class="tab">New Arrivals</label>
        <label for="tab3" class="tab">Best Sellers</label>

    </div>

    <div class="content">

        <div class="panel panel1">

            <div class="card">
                <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500" alt="">
                <h3>Running Shoes</h3>
                <span>₹4,999</span>
                <button>View</button>
            </div>

            <div class="card">
                <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500" alt="">
                <h3>Smart Watch</h3>
                <span>₹7,999</span>
                <button>View</button>
            </div>

            <div class="card">
                <img src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=500" alt="">
                <h3>Smartphone</h3>
                <span>₹34,999</span>
                <button>View</button>
            </div>

        </div>

        <div class="panel panel2">

            <div class="card">
                <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500" alt="">
                <h3>Wireless Headphones</h3>
                <span>₹3,999</span>
                <button>View</button>
            </div>

            <div class="card">
                <img src="https://images.unsplash.com/photo-1585386959984-a41552231658?w=500" alt="">
                <h3>Gaming Mouse</h3>
                <span>₹2,499</span>
                <button>View</button>
            </div>

            <div class="card">
                <img src="https://images.unsplash.com/photo-1580910051074-3eb694886505?w=500" alt="">
                <h3>Laptop Bag</h3>
                <span>₹1,899</span>
                <button>View</button>
            </div>

        </div>

        <div class="panel panel3">

            <div class="card">
                <img src="https://images.unsplash.com/photo-1517336714739-489689fd1ca8?w=500" alt="">
                <h3>Laptop</h3>
                <span>₹69,999</span>
                <button>View</button>
            </div>

            <div class="card">
                <img src="https://images.unsplash.com/photo-1484704849700-f032a568e944?w=500" alt="">
                <h3>Bluetooth Speaker</h3>
                <span>₹2,999</span>
                <button>View</button>
            </div>

            <div class="card">
                <img src="https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?w=500" alt="">
                <h3>DSLR Camera</h3>
                <span>₹59,999</span>
                <button>View</button>
            </div>

        </div>

    </div>

</section>

</body>
</html>
