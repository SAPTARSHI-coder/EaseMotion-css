<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Cyberpunk Input Field</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="demo-container">
        <header class="demo-header">
            <h1 class="cyber-title">SYSTEM_LOGIN_</h1>
            <p>A pure CSS, JavaScript-free animated input field with geometric cut-corners, drop-shadow neon glows, and a scanning focus animation.</p>
        </header>

        <section class="demo-section">
            
            <div class="demo-form-group">
                <label for="username" class="ease-cyber-label">Operator_ID :</label>
                
                <div class="ease-cyber-input-wrapper theme-cyan">
                    <input type="text" id="username" class="ease-cyber-input" placeholder="Enter identification string...">
                    <span class="ease-cyber-scanline"></span>
                </div>
            </div>

            <div class="demo-form-group">
                <label for="password" class="ease-cyber-label">Pass_Key :</label>
                
                <div class="ease-cyber-input-wrapper theme-magenta">
                    <input type="password" id="password" class="ease-cyber-input" placeholder="Enter secure override...">
                    <span class="ease-cyber-scanline"></span>
                </div>
            </div>

            <div class="demo-form-group">
                <label for="access" class="ease-cyber-label">Access_Level :</label>
                
                <div class="ease-cyber-input-wrapper theme-yellow">
                    <input type="text" id="access" class="ease-cyber-input" value="RESTRICTED_ACCESS" disabled>
                    <span class="ease-cyber-scanline"></span>
                </div>
            </div>

        </section>
        
        <p class="demo-footer">Try focusing the inputs using your mouse or <strong>Tab</strong> key to see the scanning neon animations.</p>
    </main>
</body>
</html>
