<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ease-blur-badge-bh</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #0f172a; min-height: 100vh; padding: 2rem; color: #f1f5f9; }
    .container { max-width: 1200px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 2rem; padding: 2rem; background: rgba(30, 41, 59, 0.8); border-radius: 1rem; }
    header h1 { font-size: 2rem; font-weight: 700; background: linear-gradient(135deg, #818cf8, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    header p { color: #94a3b8; margin-top: 0.5rem; }
    .demo-section { background: rgba(30, 41, 59, 0.8); border: 1px solid rgba(148, 163, 184, 0.1); border-radius: 1rem; padding: 2rem; margin-bottom: 2rem; }
    .demo-section h2 { font-size: 1.25rem; margin-bottom: 1rem; color: #e2e8f0; }
    .badge-grid { display: flex; flex-wrap: wrap; gap: 1rem; margin-bottom: 1rem; }
    .demo-card { background: rgba(15, 23, 42, 0.5); border: 1px solid rgba(148, 163, 184, 0.1); border-radius: 0.75rem; padding: 1.5rem; }
    .demo-card h3 { font-size: 1.125rem; margin-bottom: 0.75rem; color: #f1f5f9; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>ease-blur-badge-bh</h1>
      <p>CSS Blur-Entrance Badge for Fintech Dashboards</p>
    </header>
    
    <section class="demo-section">
      <h2>Blur-Entrance Badges</h2>
      <div class="badge-grid">
        <span class="ease-badge ease-badge-blur ease-badge-new">New</span>
        <span class="ease-badge ease-badge-blur ease-badge-hot">Hot</span>
        <span class="ease-badge ease-badge-blur ease-badge-sale">Sale</span>
        <span class="ease-badge ease-badge-blur ease-badge-success">Success</span>
        <span class="ease-badge ease-badge-blur ease-badge-warning">Warning</span>
        <span class="ease-badge ease-badge-blur ease-badge-error">Error</span>
        <span class="ease-badge ease-badge-blur ease-badge-info">Info</span>
      </div>
    </section>
    
    <section class="demo-section">
      <h2>Fintech Dashboard Examples</h2>
      <div class="badge-grid">
        <div class="demo-card" style="position:relative;">
          <span class="ease-badge ease-badge-blur ease-badge-success" style="position:absolute;top:0.75rem;right:0.75rem;">+12.5%</span>
          <h3>Revenue</h3>
          <p style="color:#94a3b8;">$124.5K this month</p>
        </div>
        <div class="demo-card" style="position:relative;">
          <span class="ease-badge ease-badge-blur ease-badge-new" style="position:absolute;top:0.75rem;right:0.75rem;">New</span>
          <h3>Active Users</h3>
          <p style="color:#94a3b8;">1,247 online</p>
        </div>
        <div class="demo-card" style="position:relative;">
          <span class="ease-badge ease-badge-blur ease-badge-warning" style="position:absolute;top:0.75rem;right:0.75rem;">Pending</span>
          <h3>Transactions</h3>
          <p style="color:#94a3b8;">23 awaiting approval</p>
        </div>
      </div>
    </section>
  </div>
</body>
</html>
