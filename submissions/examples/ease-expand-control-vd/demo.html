<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ease Expand Control</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="expand-demo">

    <div class="expand-item">
        <button class="expand-control" aria-label="Expand details">
            <span class="expand-icon">⌄</span>
        </button>

        <div class="expand-content">
            <strong>Project Details</strong>
            <span>Additional information about this project.</span>
        </div>
    </div>

    <div class="expand-item expanded">
        <button class="expand-control" aria-label="Collapse details">
            <span class="expand-icon">⌄</span>
        </button>

        <div class="expand-content">
            <strong>Settings</strong>
            <span>This section is currently expanded.</span>
        </div>
    </div>

</div>

</body>
</html>
