<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern Spring Physics</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="container">

    <h1>Modern Spring Physics</h1>

    <p class="description">
      CSS spring easing presets powered by the modern linear() timing function.
      Hover over each card to see the difference.
    </p>

    <section class="grid">

      <article class="card bouncy">
        <h2>Bouncy</h2>

        <div class="demo-box"></div>

        <p class="code">
          var(--spring-bouncy)
        </p>
      </article>


      <article class="card snappy">
        <h2>Snappy</h2>

        <div class="demo-box"></div>

        <p class="code">
          var(--spring-snappy)
        </p>
      </article>


      <article class="card gentle">
        <h2>Gentle</h2>

        <div class="demo-box"></div>

        <p class="code">
          var(--spring-gentle)
        </p>
      </article>


      <article class="card stiff">
        <h2>Stiff</h2>

        <div class="demo-box"></div>

        <p class="code">
          var(--spring-stiff)
        </p>
      </article>


      <article class="card wobbly">
        <h2>Wobbly</h2>

        <div class="demo-box"></div>

        <p class="code">
          var(--spring-wobbly)
        </p>
      </article>

    </section>

  </main>

</body>
</html>
