<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Animated Night City</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="night-city" role="img" aria-label="Silhouette of a city skyline with animated lit windows">
    <div class="sky">
      <div class="moon"></div>
      <div class="stars"></div>
    </div>
    <div class="skyline">
      <div class="building b1">
        <div class="window"></div><div class="window"></div><div class="window"></div>
        <div class="window"></div><div class="window"></div><div class="window"></div>
        <div class="window"></div><div class="window"></div><div class="window"></div>
      </div>
      <div class="building b2">
        <div class="window"></div><div class="window"></div><div class="window"></div><div class="window"></div>
        <div class="window"></div><div class="window"></div><div class="window"></div><div class="window"></div>
        <div class="window"></div><div class="window"></div><div class="window"></div><div class="window"></div>
        <div class="window"></div><div class="window"></div><div class="window"></div><div class="window"></div>
      </div>
      <div class="building b3">
        <div class="window"></div><div class="window"></div>
        <div class="window"></div><div class="window"></div>
        <div class="window"></div><div class="window"></div>
        <div class="window"></div><div class="window"></div>
      </div>
      <div class="building b4">
        <div class="window"></div><div class="window"></div><div class="window"></div><div class="window"></div>
        <div class="window"></div><div class="window"></div><div class="window"></div><div class="window"></div>
        <div class="window"></div><div class="window"></div><div class="window"></div><div class="window"></div>
      </div>
      <div class="building b5">
        <div class="window"></div><div class="window"></div><div class="window"></div>
        <div class="window"></div><div class="window"></div><div class="window"></div>
        <div class="window"></div><div class="window"></div><div class="window"></div>
        <div class="window"></div><div class="window"></div><div class="window"></div>
      </div>
      <div class="building b6">
        <div class="window"></div><div class="window"></div>
        <div class="window"></div><div class="window"></div>
        <div class="window"></div><div class="window"></div>
        <div class="window"></div><div class="window"></div>
        <div class="window"></div><div class="window"></div>
      </div>
    </div>
  </div>
</body>
</html>
