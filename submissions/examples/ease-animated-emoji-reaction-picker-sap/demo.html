<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ease-animated-emoji-reaction-picker-sap demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { height: 100vh; margin: 0; display: flex; align-items: center; justify-content: center; background: #f4f4f5; }
  </style>
</head>
<body>
  <div class="reaction-picker-sap" id="picker">
    <button class="reaction-btn" data-emoji="👍">👍</button>
    <button class="reaction-btn" data-emoji="❤️">❤️</button>
    <button class="reaction-btn" data-emoji="😂">😂</button>
    <button class="reaction-btn" data-emoji="😮">😮</button>
    <button class="reaction-btn" data-emoji="🎉">🎉</button>
  </div>
  <script>
    const picker = document.getElementById('picker');
    picker.querySelectorAll('.reaction-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        picker.querySelectorAll('.reaction-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
      });
    });
  </script>
</body>
</html>
