<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Drag-reorder List</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="container">
    <h1>Drag-reorder List</h1>
    <p class="subtitle">Pure CSS styled sortable list interface</p>

    <div class="drag-list" role="list">
      <div class="drag-item" role="listitem" tabindex="0">
        <span class="drag-handle">⋮⋮</span>
        <span>Design Homepage Layout</span>
      </div>

      <div class="drag-item" role="listitem" tabindex="0">
        <span class="drag-handle">⋮⋮</span>
        <span>Write Project Documentation</span>
      </div>

      <div class="drag-item" role="listitem" tabindex="0">
        <span class="drag-handle">⋮⋮</span>
        <span>Review Pull Requests</span>
      </div>

      <div class="drag-item" role="listitem" tabindex="0">
        <span class="drag-handle">⋮⋮</span>
        <span>Deploy Latest Release</span>
      </div>

      <div class="drag-item" role="listitem" tabindex="0">
        <span class="drag-handle">⋮⋮</span>
        <span>Prepare Team Meeting</span>
      </div>
    </div>
  </div>

</body>
</html>
