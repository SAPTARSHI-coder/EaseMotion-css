<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-ship-wheel-helm demo</title>
</head>
<body>
<div class="sw-app">
  <span class="sw-label">HELM</span>
  <div class="sw-back">
    <div class="sw-compass">
      <span class="sw-tick sw-tick-n">N</span>
      <span class="sw-tick sw-tick-s">S</span>
      <span class="sw-tick sw-tick-e">E</span>
      <span class="sw-tick sw-tick-w">W</span>
      <span class="sw-needle"></span>
    </div>
  </div>
  <div class="sw-wheel">
    <span class="sw-hub"></span>
    <span class="sw-spoke sw-spoke-1"></span>
    <span class="sw-spoke sw-spoke-2"></span>
    <span class="sw-spoke sw-spoke-3"></span>
    <span class="sw-spoke sw-spoke-4"></span>
    <span class="sw-spoke sw-spoke-5"></span>
    <span class="sw-spoke sw-spoke-6"></span>
    <span class="sw-knob sw-knob-1"></span>
    <span class="sw-knob sw-knob-2"></span>
    <span class="sw-knob sw-knob-3"></span>
    <span class="sw-knob sw-knob-4"></span>
    <span class="sw-knob sw-knob-5"></span>
    <span class="sw-knob sw-knob-6"></span>
  </div>
  <div class="sw-post"></div>
</div>
</body>
</html>
