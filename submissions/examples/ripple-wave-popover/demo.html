<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ripple Wave Popover Demo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>Fintech Dashboard Popover</h1>
    <p>Hover over the buttons to reveal animated popovers.</p>

    <div class="popover-group">

        <!-- Balance -->
        <div class="popover-wrapper">

            <button class="trigger-btn">
                💰 Account Balance
            </button>

            <div class="popover">

                <div class="ripple"></div>

                <h3>Total Balance</h3>

                <p>$18,420.50 available</p>

                <span class="status success">
                    ▲ +12.4% this month
                </span>

            </div>

        </div>

        <!-- Investment -->
        <div class="popover-wrapper">

            <button class="trigger-btn">
                📈 Investments
            </button>

            <div class="popover">

                <div class="ripple"></div>

                <h3>Portfolio Growth</h3>

                <p>Annual return: 16.8%</p>

                <span class="status">
                    Diversified portfolio
                </span>

            </div>

        </div>

        <!-- Notifications -->
        <div class="popover-wrapper">

            <button class="trigger-btn">
                🔔 Alerts
            </button>

            <div class="popover">

                <div class="ripple"></div>

                <h3>Notifications</h3>

                <p>3 new payment confirmations</p>

                <span class="status warning">
                    Review today
                </span>

            </div>

        </div>

    </div>

</div>

</body>
</html>
