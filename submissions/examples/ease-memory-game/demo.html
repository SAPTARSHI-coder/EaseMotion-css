  <p style="position: absolute; bottom: 2rem; color: #475569; font-family: system-ui; font-size: 0.875rem;">3D Rendering powered entirely by CSS. Micro-JS script acts only as game referee.</p>

  <script>
    const triggers = document.querySelectorAll('.ease-card-trigger');
    let flipped = [];
    let locked = false;
    triggers.forEach(trigger => {
      trigger.addEventListener('change', (e) => {
        if (locked) return e.preventDefault();
        if (e.target.checked) flipped.push(e.target);
        else flipped = flipped.filter(t => t !== e.target);
        
        if (flipped.length === 2) {
          locked = true;
          if (flipped[0].dataset.symbol === flipped[1].dataset.symbol) {
            document.getElementById('label-' + flipped[0].id.split('-')[1]).classList.add('is-matched');
            document.getElementById('label-' + flipped[1].id.split('-')[1]).classList.add('is-matched');
            flipped = []; locked = false;
          } else {
            setTimeout(() => {
              flipped[0].checked = false; flipped[1].checked = false;
              flipped = []; locked = false;
            }, 1000);
          }
        }
      });
    });
  </script>
