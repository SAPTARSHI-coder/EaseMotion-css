<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Tilt Card Demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f4f4f5;
    }
    
    .card-wrapper {
      width: 320px;
      height: 400px;
      background: white;
      border-radius: 16px;
      padding: 32px;
      box-sizing: border-box;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }

    .card-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 16px;
      height: 100%;
      justify-content: center;
    }

    .avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      margin-bottom: 16px;
    }

    h2 { margin: 0; color: #111827; }
    p { margin: 0; color: #6b7280; }
  </style>
</head>
<body>

  <!-- Using the utility classes -->
  <div class="em-card-tilt-3d card-wrapper">
    <div class="em-card-tilt-3d-content card-content">
      <div class="avatar"></div>
      <h2>Premium Depth</h2>
      <p>Hover over this card to see a subtle 3D tilt effect, elevating the content towards you.</p>
    </div>
  </div>

</body>
</html>
