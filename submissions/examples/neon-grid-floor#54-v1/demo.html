<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Grid Floor | EaseMotion CSS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="synthwave-scene">
        <!-- Sky -->
        <div class="sky">
            <!-- Stars -->
            <div class="stars">
                <span class="star s1"></span>
                <span class="star s2"></span>
                <span class="star s3"></span>
                <span class="star s4"></span>
                <span class="star s5"></span>
                <span class="star s6"></span>
                <span class="star s7"></span>
                <span class="star s8"></span>
                <span class="star s9"></span>
                <span class="star s10"></span>
            </div>

            <!-- Sun -->
            <div class="sun">
                <div class="sun-glow"></div>
                <div class="sun-stripes">
                    <div class="stripe"></div>
                    <div class="stripe"></div>
                    <div class="stripe"></div>
                    <div class="stripe"></div>
                    <div class="stripe"></div>
                </div>
            </div>

            <!-- Mountains -->
            <div class="mountains">
                <div class="mountain m1"></div>
                <div class="mountain m2"></div>
                <div class="mountain m3"></div>
            </div>
        </div>

        <!-- Horizon Glow -->
        <div class="horizon-glow"></div>

        <!-- Grid Floor -->
        <div class="grid-container">
            <div class="grid-floor">
                <!-- Horizontal Lines (moving towards viewer) -->
                <div class="grid-lines-h">
                    <div class="line-h"></div>
                    <div class="line-h"></div>
                    <div class="line-h"></div>
                    <div class="line-h"></div>
                    <div class="line-h"></div>
                    <div class="line-h"></div>
                    <div class="line-h"></div>
                    <div class="line-h"></div>
                    <div class="line-h"></div>
                    <div class="line-h"></div>
                </div>
                <!-- Vertical Lines (perspective) -->
                <div class="grid-lines-v">
                    <div class="line-v"></div>
                    <div class="line-v"></div>
                    <div class="line-v"></div>
                    <div class="line-v"></div>
                    <div class="line-v"></div>
                    <div class="line-v"></div>
                    <div class="line-v"></div>
                    <div class="line-v"></div>
                    <div class="line-v"></div>
                    <div class="line-v"></div>
                    <div class="line-v"></div>
                </div>
            </div>
        </div>

        <!-- Side Neon Pillars -->
        <div class="pillar pillar-left">
            <div class="pillar-glow"></div>
        </div>
        <div class="pillar pillar-right">
            <div class="pillar-glow"></div>
        </div>

        <!-- Title -->
        <div class="scene-title">
            <span>SYNTHWAVE</span>
            <span>DRIVE</span>
        </div>
    </div>
</body>
</html>
