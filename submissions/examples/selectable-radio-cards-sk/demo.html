<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Selectable Radio Choice Cards</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      margin: 0; min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 1rem; padding: 24px;
      background: linear-gradient(160deg, #f8fafc, #eef2ff 55%, #f8fafc);
      color: #111827; font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      
    }
    h1 { margin: 0; font-size: 1.25rem; text-align: center; }
    .note { margin: 0; max-width: 420px; text-align: center; color: #4b5563; font-size: 0.92rem; line-height: 1.45; }
  </style>
</head>
<body>
  <h1>Selectable Radio Choice Cards</h1>
  
  <div class="choice-cards">
<label class="choice"><input type="radio" name="plan" value="basic"/><span class="choice__body"><strong>Basic</strong>Free forever</span></label>
<label class="choice"><input type="radio" name="plan" value="pro" checked/><span class="choice__body"><strong>Pro</strong>$12 / month</span></label>
</div>
  
</body>
</html>
