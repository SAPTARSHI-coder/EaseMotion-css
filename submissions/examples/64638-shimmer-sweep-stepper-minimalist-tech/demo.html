<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shimmer Sweep Stepper</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<h1>Project Workflow</h1>

<div class="stepper">

<div class="step active">
    <div class="circle">1</div>
    <div class="content">
        <h2>Planning</h2>
        <p>Define ideas and project requirements.</p>
    </div>
</div>


<div class="line"></div>


<div class="step active">
    <div class="circle">2</div>
    <div class="content">
        <h2>Development</h2>
        <p>Build modern technology solutions.</p>
    </div>
</div>


<div class="line"></div>


<div class="step">
    <div class="circle">3</div>
    <div class="content">
        <h2>Testing</h2>
        <p>Validate quality and performance.</p>
    </div>
</div>


<div class="line"></div>


<div class="step">
    <div class="circle">4</div>
    <div class="content">
        <h2>Launch</h2>
        <p>Deploy the final product.</p>
    </div>
</div>


</div>

</div>

</body>
</html>
