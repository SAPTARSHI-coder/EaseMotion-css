<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Responsive stat card with neumorphism styling using pure CSS."
  >

  <title>Responsive Stat Card — Neumorphism</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="page">

    <section
      class="stats-section"
      aria-labelledby="stats-title"
    >

      <header class="stats-heading">
        <span class="stats-heading__eyebrow">
          PERFORMANCE OVERVIEW
        </span>

        <h1 id="stats-title">
          Dashboard Stats
        </h1>

        <p>
          A responsive neumorphic stat card built with
          pure CSS and smooth interactions.
        </p>
      </header>

      <div class="stats-grid">

        <article class="stat-card stat-card--blue">

          <div class="stat-card__top">

            <div
              class="stat-card__icon"
              aria-hidden="true"
            >
              ↗
            </div>

            <span class="stat-card__trend">
              +12.8%
            </span>

          </div>

          <div class="stat-card__content">

            <span class="stat-card__label">
              TOTAL REVENUE
            </span>

            <strong class="stat-card__value">
              $48,290
            </strong>

            <span class="stat-card__caption">
              Compared with last month
            </span>

          </div>

          <div
            class="stat-card__progress"
            aria-hidden="true"
          >
            <span style="--progress: 78%"></span>
          </div>

        </article>


        <article class="stat-card stat-card--green">

          <div class="stat-card__top">

            <div
              class="stat-card__icon"
              aria-hidden="true"
            >
              ✓
            </div>

            <span class="stat-card__trend">
              +8.4%
            </span>

          </div>

          <div class="stat-card__content">

            <span class="stat-card__label">
              COMPLETED TASKS
            </span>

            <strong class="stat-card__value">
              1,284
            </strong>

            <span class="stat-card__caption">
              96 tasks completed today
            </span>

          </div>

          <div
            class="stat-card__progress"
            aria-hidden="true"
          >
            <span style="--progress: 86%"></span>
          </div>

        </article>


        <article class="stat-card stat-card--purple">

          <div class="stat-card__top">

            <div
              class="stat-card__icon"
              aria-hidden="true"
            >
              ●
            </div>

            <span class="stat-card__trend">
              +18.2%
            </span>

          </div>

          <div class="stat-card__content">

            <span class="stat-card__label">
              ACTIVE USERS
            </span>

            <strong class="stat-card__value">
              8,642
            </strong>

            <span class="stat-card__caption">
              Users active this week
            </span>

          </div>

          <div
            class="stat-card__progress"
            aria-hidden="true"
          >
            <span style="--progress: 71%"></span>
          </div>

        </article>

      </div>

    </section>

  </main>

</body>
</html>
