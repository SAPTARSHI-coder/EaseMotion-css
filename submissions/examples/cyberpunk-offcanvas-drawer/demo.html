<!-- submissions/examples/cyberpunk-offcanvas-drawer/demo.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyberpunk Offcanvas Drawer | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Hidden Checkbox for State Management -->
  <input type="checkbox" id="cyber-drawer-toggle" class="ease-cyber-toggle" aria-hidden="true">

  <!-- Backdrop (Clicking it closes the drawer) -->
  <label for="cyber-drawer-toggle" class="ease-cyber-backdrop" aria-label="Close menu"></label>

  <!-- The Offcanvas Drawer -->
  <aside class="ease-cyber-drawer" role="dialog" aria-labelledby="drawer-title">
    
    <div class="ease-cyber-header">
      <h2 id="drawer-title" class="ease-cyber-title">SYS_MENU</h2>
      <!-- Close Button -->
      <label for="cyber-drawer-toggle" class="ease-cyber-close" aria-label="Close menu" tabindex="0" role="button">
        &#10005;
      </label>
    </div>

    <nav class="ease-cyber-nav">
      <a href="#" class="ease-cyber-nav-link">Mainframe</a>
      <a href="#" class="ease-cyber-nav-link">Database</a>
      <a href="#" class="ease-cyber-nav-link">Proxy_Settings</a>
      <a href="#" class="ease-cyber-nav-link">Disconnect</a>
    </nav>
    
  </aside>

  <!-- Main Content Area -->
  <main class="demo-container">
    <h1 style="color: #0ff; text-shadow: 0 0 10px #0ff;">NEO_TOKYO TERMINAL</h1>
    
    <!-- Open Button -->
    <label for="cyber-drawer-toggle" class="ease-cyber-btn" tabindex="0" role="button">
      Access System
    </label>
  </main>

</body>
</html>
