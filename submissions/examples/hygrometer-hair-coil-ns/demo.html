<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hygrometer Hair Coil — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Hygrometer Hair Coil demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Hygrometer Hair Coil</h1>
      <p class="lede">Hair-tension hygrometer coil unwinding with humidity</p>
    </header>

    <section class="ease-hygrometer-hair-coil" data-demo="hygrometer-hair-coil" aria-live="polite">
      <div class="ease-hygrometer-hair-coil__housing">
        <div class="ease-hygrometer-hair-coil__bezel">
          <div class="ease-hygrometer-hair-coil__face">
            <div class="ease-hygrometer-hair-coil__readout">
              <span class="ease-hygrometer-hair-coil__label">Hygrometer Hair Coil</span>
              <span class="ease-hygrometer-hair-coil__value">LIVE</span>
            </div>
            <div class="ease-hygrometer-hair-coil__motion" aria-hidden="true">
              <span class="ease-hygrometer-hair-coil__a"></span>
              <span class="ease-hygrometer-hair-coil__b"></span>
              <span class="ease-hygrometer-hair-coil__c"></span>
              <span class="ease-hygrometer-hair-coil__d"></span>
            </div>
            <div class="ease-hygrometer-hair-coil__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-hygrometer-hair-coil__controls">
          <button type="button" class="ease-hygrometer-hair-coil__btn primary">Engage</button>
          <button type="button" class="ease-hygrometer-hair-coil__btn">Reset</button>
          <label class="ease-hygrometer-hair-coil__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-hygrometer-hair-coil__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
