<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jello Hover Dashboard Modal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard">
        <header class="dashboard-header">
            <h1>Analytics Dashboard</h1>
            <p>Hover over the modal to experience the EaseMotion Jello animation.</p>
        </header>
        <section class="stats-grid">
            <div class="stat-card">
                <h3>Total Revenue</h3>
                <span>$42,560</span>
            </div>
            <div class="stat-card">
                <h3>Visitors</h3>
                <span>18,934</span>
            </div>

            <div class="stat-card">
                <h3>Conversion</h3>
                <span>8.6%</span>
            </div>

            <div class="stat-card">
                <h3>Growth</h3>
                <span>+24%</span>
            </div>
        </section>
        <div class="modal-overlay">
            <div
                class="analytics-modal"
                tabindex="0"
                role="dialog"
                aria-labelledby="modal-title"
                aria-describedby="modal-description">

                <div class="modal-header">
                    <span class="status-dot"></span>

                    <div>
                        <h2 id="modal-title">
                            Weekly Performance
                        </h2>

                        <p id="modal-description">
                            Dashboard Analytics Overview
                        </p>
                    </div>
                </div>

                <div class="modal-body">

                    <div class="metric">
                        <span>Revenue</span>
                        <strong>$18,750</strong>
                    </div>

                    <div class="metric">
                        <span>Orders</span>
                        <strong>1,247</strong>
                    </div>

                    <div class="metric">
                        <span>New Users</span>
                        <strong>694</strong>
                    </div>

                    <div class="metric">
                        <span>Engagement</span>
                        <strong>92%</strong>
                    </div>

                </div>
                <div class="modal-footer">

                    <button class="secondary-btn">
                        Cancel
                    </button>

                    <button class="primary-btn">
                        View Report
                    </button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
