<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="A CSS-only animated yo-yo bouncing on a string."
    >

    <title>CSS Animated Yo-yo</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="page">
        <section class="yoyo-demo" aria-labelledby="yoyo-title">

            <div class="content">
                <p class="eyebrow">CSS Animation</p>

                <h1 id="yoyo-title">Animated Yo-yo</h1>

                <p class="description">
                    A playful yo-yo animation created entirely with CSS.
                </p>
            </div>

            <div
                class="yoyo-stage"
                role="img"
                aria-label="Animated yo-yo bouncing up and down on a string"
            >
                <div class="yoyo-string"></div>

                <div class="yoyo">
                    <div class="yoyo-disc yoyo-disc-top"></div>

                    <div class="yoyo-center">
                        <span></span>
                    </div>

                    <div class="yoyo-disc yoyo-disc-bottom"></div>
                </div>
            </div>

        </section>
    </main>
</body>
</html>
