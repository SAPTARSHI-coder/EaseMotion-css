<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Accordion Component</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="accordion-container">
        <details class="ease-accordion" open>
            <summary class="ease-accordion-summary">
                <span>What is EaseMotion CSS?</span>
                <span class="ease-accordion-icon"></span>
            </summary>
            <div class="ease-accordion-content">
                <div class="ease-accordion-body">
                    EaseMotion CSS is an animation-first CSS framework featuring human-readable class names with zero JavaScript dependencies.
                </div>
            </div>
        </details>

        <details class="ease-accordion">
            <summary class="ease-accordion-summary">
                <span>How do I install it?</span>
                <span class="ease-accordion-icon"></span>
            </summary>
            <div class="ease-accordion-content">
                <div class="ease-accordion-body">
                    Simply drop the single stylesheet link tag into your HTML `<head>` and start composing classes.
                </div>
            </div>
        </details>
    </div>

</body>
</html>
