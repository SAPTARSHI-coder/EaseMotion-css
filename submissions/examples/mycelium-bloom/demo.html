<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mycelium Bloom</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="mycelium-wrapper">

    <section class="mycelium-card">

      <div class="header">
        <div>
          <span class="eyebrow">UNDERGROUND ECOSYSTEM</span>
          <h1>🍄 Mycelium Bloom</h1>
          <p>Watch the hidden network come alive.</p>
        </div>

        <div class="counter">
          <span>CONNECTED</span>
          <strong id="nodeCount">0 / 8</strong>
        </div>
      </div>

      <div class="canvas-wrapper">
        <canvas id="myceliumCanvas"></canvas>

        <div class="status">
          <span class="status-dot"></span>
          <span id="statusText">Dormant mycelium</span>
        </div>
      </div>

      <div class="controls">

        <div class="control-row">
          <label for="growthSlider">Growth</label>

          <input
            id="growthSlider"
            type="range"
            min="0"
            max="100"
            value="0"
          >

          <span id="growthValue">0%</span>
        </div>

        <div class="actions">
          <button id="growBtn" class="primary">
            🍄 Grow Network
          </button>

          <button id="resetBtn" class="secondary">
            ↻ Reset
          </button>
        </div>

      </div>

      <div class="hint">
        Click the underground field or press Space to stimulate growth.
        Press R to reset.
      </div>

    </section>

  </main>

  <script>
    const canvas = document.getElementById("myceliumCanvas");
    const ctx = canvas.getContext("2d");

    const slider = document.getElementById("growthSlider");
    const growthValue = document.getElementById("growthValue");
    const growBtn = document.getElementById("growBtn");
    const resetBtn = document.getElementById("resetBtn");

    const nodeCount = document.getElementById("nodeCount");
    const statusText = document.getElementById("statusText");

    let width;
    let height;

    let growth = 0;
    let targetGrowth = 0;

    const nodes = [];
    const branches = [];
    const particles = [];

    function resize() {
      const rect = canvas.getBoundingClientRect();

      width = rect.width;
      height = rect.height;

      canvas.width = width * devicePixelRatio;
      canvas.height = height * devicePixelRatio;

      ctx.setTransform(
        devicePixelRatio,
        0,
        0,
        devicePixelRatio,
        0,
        0
      );

      createNodes();
      createBranches();
      createParticles();
    }

    function createNodes() {
      nodes.length = 0;

      const cx = width / 2;
      const cy = height / 2;

      for (let i = 0; i < 8; i++) {
        const angle = (Math.PI * 2 / 8) * i;

        const radiusX = width * 0.34;
        const radiusY = height * 0.34;

        nodes.push({
          x: cx + Math.cos(angle) * radiusX,
          y: cy + Math.sin(angle) * radiusY,
          phase: Math.random() * Math.PI * 2,
          active: false,
          bloom: 0
        });
      }
    }

    function createBranches() {
      branches.length = 0;

      const cx = width / 2;
      const cy = height / 2;

      nodes.forEach((node, index) => {

        const points = [];

        const segments = 14;

        for (let i = 0; i <= segments; i++) {

          const t = i / segments;

          const x =
            cx +
            (node.x - cx) * t +
            Math.sin(t * 8 + index) * 10 * t;

          const y =
            cy +
            (node.y - cy) * t +
            Math.cos(t * 7 + index) * 8 * t;

          points.push({ x, y });
        }

        branches.push(points);
      });
    }

    function createParticles() {
      particles.length = 0;

      for (let i = 0; i < 40; i++) {
        particles.push({
          x: Math.random() * width,
          y: Math.random() * height,
          radius: Math.random() * 1.5 + 0.5,
          phase: Math.random() * Math.PI * 2,
          speed: Math.random() * 0.01 + 0.005
        });
      }
    }

    function drawBackground(time) {

      const gradient = ctx.createRadialGradient(
        width / 2,
        height / 2,
        10,
        width / 2,
        height / 2,
        width
      );

      gradient.addColorStop(0, "#172d26");
      gradient.addColorStop(1, "#050b09");

      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, width, height);

      particles.forEach(p => {

        const alpha =
          0.2 +
          Math.sin(time * p.speed + p.phase) * 0.1;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);

        ctx.fillStyle = `rgba(180, 240, 190, ${alpha})`;
        ctx.fill();
      });
    }

    function drawBranches(time) {

      const visible =
        Math.min(1, growth / 100);

      branches.forEach((points, branchIndex) => {

        const count =
          Math.floor(points.length * visible);

        if (count < 2) return;

        ctx.beginPath();

        ctx.moveTo(points[0].x, points[0].y);

        for (let i = 1; i < count; i++) {
          ctx.lineTo(points[i].x, points[i].y);
        }

        ctx.lineWidth = 2;

        ctx.shadowBlur = 12;
        ctx.shadowColor = "#8affb1";

        ctx.strokeStyle = "rgba(130, 255, 170, 0.75)";
        ctx.stroke();

        ctx.shadowBlur = 0;

        if (visible > 0.35) {

          const branchPoint = points[Math.floor(count * 0.55)];

          ctx.beginPath();
          ctx.moveTo(branchPoint.x, branchPoint.y);

          ctx.lineTo(
            branchPoint.x + Math.sin(branchIndex) * 28,
            branchPoint.y + 30
          );

          ctx.strokeStyle =
            "rgba(110, 220, 150, 0.35)";

          ctx.lineWidth = 1;

          ctx.stroke();
        }
      });
    }

    function drawNodes(time) {

      const visible =
        Math.min(1, growth / 100);

      let connected = 0;

      nodes.forEach((node, index) => {

        const threshold =
          (index + 1) / nodes.length;

        const active =
          visible >= threshold * 0.9;

        node.active = active;

        if (active) {
          connected++;

          node.bloom +=
            (1 - node.bloom) * 0.04;
        }

        const pulse =
          Math.sin(time * 0.004 + node.phase) * 2;

        ctx.beginPath();

        ctx.arc(
          node.x,
          node.y,
          active ? 5 + pulse : 4,
          0,
          Math.PI * 2
        );

        ctx.shadowBlur = active ? 18 : 4;
        ctx.shadowColor = "#b5ffc9";

        ctx.fillStyle =
          active
            ? "#c5ffd5"
            : "#395947";

        ctx.fill();

        ctx.shadowBlur = 0;

        if (active) {
          drawBloom(node);
        }
      });

      nodeCount.textContent =
        `${connected} / ${nodes.length}`;
    }

    function drawBloom(node) {

      const radius = 12 * node.bloom;

      for (let i = 0; i < 5; i++) {

        const angle =
          (Math.PI * 2 / 5) * i;

        const x =
          node.x +
          Math.cos(angle) * radius;

        const y =
          node.y +
          Math.sin(angle) * radius;

        ctx.beginPath();

        ctx.arc(
          x,
          y,
          3 * node.bloom,
          0,
          Math.PI * 2
        );

        ctx.fillStyle =
          "rgba(190, 255, 210, 0.55)";

        ctx.fill();
      }
    }

    function updateStatus() {

      if (growth === 0) {
        statusText.textContent =
          "Dormant mycelium";
      } else if (growth < 40) {
        statusText.textContent =
          "Mycelium awakening";
      } else if (growth < 75) {
        statusText.textContent =
          "Network spreading";
      } else if (growth < 100) {
        statusText.textContent =
          "Nutrient nodes connecting";
      } else {
        statusText.textContent =
          "Bloom network complete";
      }
    }

    function animate(time) {

      growth +=
        (targetGrowth - growth) * 0.05;

      if (Math.abs(targetGrowth - growth) < 0.05) {
        growth = targetGrowth;
      }

      growthValue.textContent =
        `${Math.round(growth)}%`;

      updateStatus();

      drawBackground(time);
      drawBranches(time);
      drawNodes(time);

      requestAnimationFrame(animate);
    }

    slider.addEventListener("input", () => {
      targetGrowth = Number(slider.value);
    });

    growBtn.addEventListener("click", () => {
      targetGrowth = 100;
      slider.value = 100;
    });

    resetBtn.addEventListener("click", () => {
      targetGrowth = 0;
      slider.value = 0;

      nodes.forEach(node => {
        node.bloom = 0;
        node.active = false;
      });
    });

    canvas.addEventListener("click", () => {

      targetGrowth = Math.min(
        100,
        targetGrowth + 15
      );

      slider.value = targetGrowth;
    });

    document.addEventListener("keydown", event => {

      if (event.code === "Space") {
        event.preventDefault();

        targetGrowth = Math.min(
          100,
          targetGrowth + 20
        );

        slider.value = targetGrowth;
      }

      if (event.key.toLowerCase() === "r") {
        targetGrowth = 0;
        slider.value = 0;
      }
    });

    window.addEventListener("resize", resize);

    resize();
    requestAnimationFrame(animate);
  </script>

</body>
</html>
