<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <meta
    name="description"
    content="Interactive audio player widget with Material Design styling"
  >
  <title>Interactive Audio Player — Material Design</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="page">
    <section
      class="audio-player"
      aria-label="Interactive audio player"
    >

      <!-- CSS-only state controller -->
      <input
        class="player-toggle"
        type="checkbox"
        id="player-toggle"
        aria-label="Toggle play and pause"
      >

      <!-- Header -->
      <header class="player-header">
        <div>
          <span class="eyebrow">NOW PLAYING</span>
          <h1>Midnight Dreams</h1>
        </div>

        <button
          class="icon-button"
          type="button"
          aria-label="More audio options"
        >
          <span aria-hidden="true">⋮</span>
        </button>
      </header>

      <!-- Album artwork -->
      <div class="artwork-wrapper">
        <div
          class="artwork"
          role="img"
          aria-label="Abstract album artwork"
        >
          <div class="artwork-shape artwork-shape-one"></div>
          <div class="artwork-shape artwork-shape-two"></div>
          <div class="artwork-center">
            <span aria-hidden="true">♫</span>
          </div>
        </div>
      </div>

      <!-- Track information -->
      <div class="track-info">
        <p class="track-title">Midnight Dreams</p>
        <p class="artist-name">Ambient Waves</p>
      </div>

      <!-- Waveform -->
      <div
        class="waveform"
        aria-hidden="true"
      >
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
      </div>

      <!-- Progress -->
      <div class="progress-section">
        <div
          class="progress-bar"
          role="progressbar"
          aria-label="Audio progress"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="42"
        >
          <span class="progress-value"></span>
        </div>

        <div class="time-labels">
          <span>1:48</span>
          <span>4:14</span>
        </div>
      </div>

      <!-- Controls -->
      <div
        class="player-controls"
        aria-label="Audio controls"
      >

        <button
          class="control-button secondary"
          type="button"
          aria-label="Previous track"
        >
          <span aria-hidden="true">⏮</span>
        </button>

        <label
          class="play-button"
          for="player-toggle"
          aria-label="Toggle play and pause"
        >
          <span class="play-icon" aria-hidden="true">▶</span>
          <span class="pause-icon" aria-hidden="true">Ⅱ</span>
        </label>

        <button
          class="control-button secondary"
          type="button"
          aria-label="Next track"
        >
          <span aria-hidden="true">⏭</span>
        </button>

      </div>

      <!-- Footer -->
      <footer class="player-footer">
        <span>
          <span aria-hidden="true">♫</span>
          High quality audio
        </span>

        <span>2:26 remaining</span>
      </footer>

    </section>
  </main>
</body>
</html>
