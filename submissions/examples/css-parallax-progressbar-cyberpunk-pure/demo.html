<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyberpunk Parallax Progress Bar</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
</head>
<body>

    <div class="cyber-container">
        <!-- Background grid and scanline effects -->
        <div class="cyber-grid"></div>
        <div class="scanlines"></div>

        <div class="progress-wrapper">
            <h2 class="cyber-title" data-text="SYSTEM_UPGRADE">SYSTEM_UPGRADE</h2>
            
            <div class="cyber-progress-bar">
                <div class="progress-track">
                    <!-- The actual parallax fill layer -->
                    <div class="progress-fill">
                        <!-- Striped overlay to create the parallax motion effect -->
                        <div class="parallax-stripes"></div>
                    </div>
                </div>
                
                <!-- Glitch decorations and corners -->
                <div class="cyber-corner top-left"></div>
                <div class="cyber-corner bottom-right"></div>
            </div>
            
            <div class="status-panel">
                <span class="status-text blink">UPLOADING...</span>
                <span class="status-percent">75%</span>
            </div>
        </div>
    </div>

</body>
</html>
