<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Morphing Shape dashboard widget built with pure HTML and Vanilla CSS."
  >
  <title>Morphing Shape Widget</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">
    <section class="widget" aria-labelledby="widget-title">

      <div class="ambient-shape shape-one" aria-hidden="true"></div>
      <div class="ambient-shape shape-two" aria-hidden="true"></div>

      <header class="widget-header">
        <div>
          <p class="eyebrow">ADAPTIVE SYSTEM</p>
          <h1 id="widget-title">Morphing Core</h1>
        </div>

        <div class="status">
          <span class="status-dot" aria-hidden="true"></span>
          ACTIVE
        </div>
      </header>

      <div class="morph-display" aria-hidden="true">
        <div class="morph-ring ring-back"></div>
        <div class="morph-ring ring-front"></div>

        <div class="morph-shape">
          <span class="morph-shape-inner"></span>
          <span class="morph-highlight"></span>
        </div>

        <div class="orbit orbit-one"></div>
        <div class="orbit orbit-two"></div>

        <div class="core-value">72%</div>
      </div>

      <div class="metric">
        <div>
          <span class="metric-label">Adaptive Capacity</span>
          <strong class="metric-value">72<span>%</span></strong>
        </div>

        <span class="metric-change">+8.6%</span>
      </div>

      <div class="progress" aria-label="Adaptive capacity 72 percent">
        <span class="progress-value"></span>
      </div>

      <div class="stats">
        <article class="stat">
          <span class="stat-icon" aria-hidden="true">◈</span>
          <div>
            <span>Response</span>
            <strong>96.4%</strong>
          </div>
        </article>

        <article class="stat">
          <span class="stat-icon" aria-hidden="true">◇</span>
          <div>
            <span>Cycles</span>
            <strong>1,284</strong>
          </div>
        </article>

        <article class="stat">
          <span class="stat-icon" aria-hidden="true">○</span>
          <div>
            <span>Health</span>
            <strong>98.1%</strong>
          </div>
        </article>
      </div>

      <button class="action" type="button">
        <span>Explore Metrics</span>
        <span aria-hidden="true">↗</span>
      </button>

    </section>
  </main>

</body>
</html>
