<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smoothly Follow – Element Smoothly Follows Cursor</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <h1>🌀 Smoothly Follow</h1>
    <p class="subtitle">Element smoothly follows your cursor</p>

    <div class="follow-container">
      <div class="follow-stage" id="followStage">
        <canvas id="canvas"></canvas>
        
        <!-- Following element -->
        <div class="follow-element" id="followElement">
          <div class="element-inner">
            <span class="element-icon">🌀</span>
            <span class="element-label">Follow</span>
          </div>
          <div class="element-glow"></div>
        </div>

        <!-- Trail particles -->
        <div class="trail-container" id="trailContainer"></div>

        <!-- Info overlay -->
        <div class="info-overlay">
          <span class="follow-status" id="followStatus">🌀 Active</span>
          <span class="trail-length" id="trailLength">✦ 0 particles</span>
        </div>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <button class="ctrl-btn toggle" id="toggleBtn">⏸ Pause</button>
      <button class="ctrl-btn reset" id="resetBtn">↺ Reset</button>
      <button class="ctrl-btn trail" id="trailBtn">🌀 Trail</button>
    </div>

    <!-- Sliders -->
    <div class="slider-container">
      <span class="slider-label">Follow Speed</span>
      <input type="range" id="speedSlider" min="1" max="20" value="8" />
      <span class="slider-value" id="speedValue">8×</span>
    </div>

    <div class="slider-container">
      <span class="slider-label">Element Size</span>
      <input type="range" id="sizeSlider" min="30" max="120" value="70" />
      <span class="slider-value" id="sizeValue">70px</span>
    </div>

    <div class="slider-container">
      <span class="slider-label">Trail Length</span>
      <input type="range" id="trailSlider" min="0" max="30" value="12" />
      <span class="slider-value" id="trailValue">12</span>
    </div>

    <div class="slider-container">
      <span class="slider-label">Color</span>
      <input type="range" id="colorSlider" min="0" max="360" value="220" />
      <span class="slider-value" id="colorValue">220°</span>
    </div>

    <!-- Status -->
    <div class="status" id="status">🌀 Move your cursor to make the element follow</div>

    <!-- Keyboard shortcuts -->
    <div class="shortcuts">
      <kbd>Mouse</kbd> Follow · <kbd>Space</kbd> Pause · <kbd>R</kbd> Reset · <kbd>T</kbd> Trail
    </div>
  </div>

  <script>
    (function() {
      "use strict";

      // DOM elements
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      const followElement = document.getElementById('followElement');
      const followStatus = document.getElementById('followStatus');
      const trailLength = document.getElementById('trailLength');
      const toggleBtn = document.getElementById('toggleBtn');
      const resetBtn = document.getElementById('resetBtn');
      const trailBtn = document.getElementById('trailBtn');
      const status = document.getElementById('status');
      const speedSlider = document.getElementById('speedSlider');
      const speedValue = document.getElementById('speedValue');
      const sizeSlider = document.getElementById('sizeSlider');
      const sizeValue = document.getElementById('sizeValue');
      const trailSlider = document.getElementById('trailSlider');
      const trailValue = document.getElementById('trailValue');
      const colorSlider = document.getElementById('colorSlider');
      const colorValue = document.getElementById('colorValue');

      // State
      let posX = 0;
      let posY = 0;
      let targetX = 0;
      let targetY = 0;
      let isPaused = false;
      let isTrailOn = true;
      let animationId = null;
      let time = 0;
      let trailPositions = [];
      let particles = [];

      // ----- Canvas setup -----
      function setupCanvas() {
        const rect = canvas.parentElement.getBoundingClientRect();
        const size = Math.min(rect.width - 40, 600);
        canvas.width = size;
        canvas.height = size;
        canvas.style.width = size + 'px';
        canvas.style.height = size + 'px';
        // Set initial positions to center
        const cx = size / 2;
        const cy = size / 2;
        posX = cx;
        posY = cy;
        targetX = cx;
        targetY = cy;
        followElement.style.left = (cx - 35) + 'px';
        followElement.style.top = (cy - 35) + 'px';
      }

      // ----- Particle class -----
      class Particle {
        constructor(x, y) {
          this.x = x;
          this.y = y;
          this.size = 2 + Math.random() * 4;
          this.life = 1;
          this.decay = 0.01 + Math.random() * 0.02;
          this.hue = parseInt(colorSlider.value) + (Math.random() - 0.5) * 20;
          this.saturation = 80 + Math.random() * 20;
          this.lightness = 60 + Math.random() * 30;
          this.opacity = 0.3 + Math.random() * 0.5;
          this.vx = (Math.random() - 0.5) * 0.5;
          this.vy = (Math.random() - 0.5) * 0.5;
          this.glowSize = this.size * 3;
        }

        update() {
          this.x += this.vx;
          this.y += this.vy;
          this.vx *= 0.99;
          this.vy *= 0.99;
          this.life -= this.decay;
          this.size *= 0.999;
          return this.life > 0 && this.size > 0.1;
        }

        draw(ctx) {
          const alpha = this.life * this.opacity;
          const size = this.size * this.life;

          // Glow
          const gradient = ctx.createRadialGradient(
            this.x, this.y, 0,
            this.x, this.y, size * 4
          );
          gradient.addColorStop(0, `hsla(${this.hue + 20}, 100%, 90%, ${alpha * 0.2})`);
          gradient.addColorStop(1, `hsla(${this.hue}, 100%, 60%, 0)`);
          ctx.fillStyle = gradient;
          ctx.beginPath();
          ctx.arc(this.x, this.y, size * 4, 0, Math.PI * 2);
          ctx.fill();

          // Core
          ctx.fillStyle = `hsla(${this.hue + 30}, 100%, 95%, ${alpha * 0.9})`;
          ctx.beginPath();
          ctx.arc(this.x, this.y, size, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // ----- Create trail particles -----
      function createTrailParticles(x, y, count = 2) {
        for (let i = 0; i < count; i++) {
          particles.push(new Particle(x, y));
        }
        if (particles.length > 100) {
          particles = particles.slice(-80);
        }
      }

      // ----- Update follow element -----
      function updateFollow() {
        const speed = parseInt(speedSlider.value) / 10;
        const size = parseInt(sizeSlider.value);
        const hue = parseInt(colorSlider.value);
        const trailLen = parseInt(trailSlider.value);

        // Smooth interpolation
        const dx = targetX - posX;
        const dy = targetY - posY;
        const dist = Math.sqrt(dx * dx + dy * dy);

        if (dist > 0.5) {
          const moveSpeed = Math.min(speed * 0.1, dist * 0.05);
          posX += dx * moveSpeed;
          posY += dy * moveSpeed;
        } else {
          posX = targetX;
          posY = targetY;
        }

        // Update element position
        const halfSize = size / 2;
        followElement.style.left = (posX - halfSize) + 'px';
        followElement.style.top = (posY - halfSize) + 'px';
        followElement.style.width = size + 'px';
        followElement.style.height = size + 'px';

        // Update element appearance
        followElement.style.borderColor = `hsla(${hue + 20}, 100%, 70%, 0.4)`;
        followElement.style.background = `radial-gradient(circle at 30% 30%, 
          hsla(${hue + 30}, 100%, 80%, 0.2), 
          hsla(${hue}, 100%, 50%, 0.05)
        )`;
        followElement.style.boxShadow = `0 0 30px hsla(${hue}, 100%, 60%, 0.1)`;

        // Update glow
        const glow = followElement.querySelector('.element-glow');
        if (glow) {
          glow.style.background = `radial-gradient(circle at 50% 50%, 
            hsla(${hue + 20}, 100%, 70%, 0.1), 
            transparent 70%
          )`;
        }

        // Update inner element
        const inner = followElement.querySelector('.element-inner');
        if (inner) {
          inner.style.color = `hsla(${hue + 20}, 100%, 80%, 0.9)`;
        }

        // Update trail
        if (isTrailOn && !isPaused) {
          trailPositions.push({ x: posX, y: posY, time: time });
          if (trailPositions.length > trailLen) {
            trailPositions.shift();
          }
          if (trailPositions.length > 1 && trailPositions.length % 2 === 0) {
            const last = trailPositions[trailPositions.length - 1];
            createTrailParticles(last.x, last.y, 1);
          }
        }

        // Update trail length display
        trailLength.textContent = `✦ ${trailPositions.length} particles`;
      }

      // ----- Draw trail -----
      function drawTrail() {
        const w = canvas.width;
        const h = canvas.height;
        const hue = parseInt(colorSlider.value);

        // Clear with fade
        ctx.clearRect(0, 0, w, h);

        // Background
        const bgGradient = ctx.createRadialGradient(w/2, h/2, 0, w/2, h/2, w * 0.7);
        bgGradient.addColorStop(0, '#0a0a1a');
        bgGradient.addColorStop(0.5, '#060612');
        bgGradient.addColorStop(1, '#020208');
        ctx.fillStyle = bgGradient;
        ctx.fillRect(0, 0, w, h);

        // Draw trail positions as connected dots
        if (trailPositions.length > 1) {
          // Draw glow trail
          for (let i = 0; i < trailPositions.length - 1; i++) {
            const p = trailPositions[i];
            const t = i / trailPositions.length;
            const alpha = 0.05 + 0.15 * (1 - t);
            const size = 2 + 6 * (1 - t);
            const hueShift = t * 60;

            const gradient = ctx.createRadialGradient(
              p.x, p.y, 0,
              p.x, p.y, size
            );
            gradient.addColorStop(0, `hsla(${hue + hueShift + 20}, 100%, 80%, ${alpha})`);
            gradient.addColorStop(1, `hsla(${hue + hueShift}, 100%, 60%, 0)`);
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(p.x, p.y, size, 0, Math.PI * 2);
            ctx.fill();
          }

          // Draw trail line
          ctx.beginPath();
          for (let i = 0; i < trailPositions.length; i++) {
            const p = trailPositions[i];
            const t = i / trailPositions.length;
            const alpha = 0.1 + 0.3 * (1 - t);
            const hueShift = t * 60;
            
            if (i === 0) ctx.moveTo(p.x, p.y);
            else ctx.lineTo(p.x, p.y);
          }
          ctx.strokeStyle = `hsla(${hue + 20}, 100%, 70%, 0.15)`;
          ctx.lineWidth = 2;
          ctx.stroke();

          // Draw individual trail dots
          for (let i = 0; i < trailPositions.length; i++) {
            const p = trailPositions[i];
            const t = i / trailPositions.length;
            const alpha = 0.1 + 0.4 * (1 - t);
            const size = 2 + 4 * (1 - t);
            const hueShift = t * 60;

            ctx.fillStyle = `hsla(${hue + hueShift + 20}, 100%, 80%, ${alpha * 0.5})`;
            ctx.beginPath();
            ctx.arc(p.x, p.y, size * 0.3, 0, Math.PI * 2);
            ctx.fill();
          }
        }

        // Draw particles
        if (!isPaused) {
          particles = particles.filter(p => p.update());
        }
        particles.forEach(p => p.draw(ctx));

        // Update trail length
        trailLength.textContent = `✦ ${trailPositions.length + particles.length}`;
      }

      // ----- Animation loop -----
      function animate() {
        time += 0.016;

        if (!isPaused) {
          updateFollow();
        }

        drawTrail();
        animationId = requestAnimationFrame(animate);
      }

      // ----- Start animation -----
      function startAnimation() {
        if (animationId) {
          cancelAnimationFrame(animationId);
        }
        animate();
      }

      // ----- Toggle pause -----
      function togglePause() {
        isPaused = !isPaused;
        toggleBtn.textContent = isPaused ? '▶ Play' : '⏸ Pause';
        status.textContent = isPaused ? '⏸ Paused' : '▶ Resumed';
        followStatus.textContent = isPaused ? '⏸ Paused' : '🌀 Active';
      }

      // ----- Reset -----
      function resetFollow() {
        isPaused = false;
        toggleBtn.textContent = '⏸ Pause';
        const w = canvas.width;
        const h = canvas.height;
        const cx = w / 2;
        const cy = h / 2;
        posX = cx;
        posY = cy;
        targetX = cx;
        targetY = cy;
        trailPositions = [];
        particles = [];
        speedSlider.value = 8;
        speedValue.textContent = '8×';
        sizeSlider.value = 70;
        sizeValue.textContent = '70px';
        trailSlider.value = 12;
        trailValue.textContent = '12';
        colorSlider.value = 220;
        colorValue.textContent = '220°';
        isTrailOn = true;
        trailBtn.textContent = '🌀 Trail';
        status.textContent = '↺ Reset';
        followStatus.textContent = '🌀 Active';
        setTimeout(() => {
          status.textContent = '🌀 Move your cursor to make the element follow';
        }, 500);
        updateFollow();
      }

      // ----- Toggle trail -----
      function toggleTrail() {
        isTrailOn = !isTrailOn;
        trailBtn.textContent = isTrailOn ? '🌀 Trail' : '🚫 Trail';
        status.textContent = isTrailOn ? '🌀 Trail enabled' : '🚫 Trail disabled';
        if (!isTrailOn) {
          trailPositions = [];
        }
        setTimeout(() => {
          if (!isPaused) {
            status.textContent = '🌀 Move your cursor to make the element follow';
          }
        }, 1500);
      }

      // ----- Event Listeners -----
      // Mouse tracking
      canvas.addEventListener('mousemove', (e) => {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        targetX = (e.clientX - rect.left) * scaleX;
        targetY = (e.clientY - rect.top) * scaleY;
        followStatus.textContent = '🌀 Active';
      });

      canvas.addEventListener('mouseenter', () => {
        status.textContent = '🌀 Following cursor';
      });

      canvas.addEventListener('mouseleave', () => {
        status.textContent = '🌀 Move cursor back to follow';
      });

      // Touch support
      canvas.addEventListener('touchmove', (e) => {
        e.preventDefault();
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        const touch = e.touches[0];
        targetX = (touch.clientX - rect.left) * scaleX;
        targetY = (touch.clientY - rect.top) * scaleY;
        followStatus.textContent = '🌀 Active';
      });

      canvas.addEventListener('touchstart', (e) => {
        const touch = e.touches[0];
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        targetX = (touch.clientX - rect.left) * scaleX;
        targetY = (touch.clientY - rect.top) * scaleY;
        followStatus.textContent = '🌀 Active';
      });

      // Buttons
      toggleBtn.addEventListener('click', togglePause);
      resetBtn.addEventListener('click', resetFollow);
      trailBtn.addEventListener('click', toggleTrail);

      // Sliders
      speedSlider.addEventListener('input', (e) => {
        speedValue.textContent = e.target.value + '×';
      });

      sizeSlider.addEventListener('input', (e) => {
        sizeValue.textContent = e.target.value + 'px';
        updateFollow();
      });

      trailSlider.addEventListener('input', (e) => {
        trailValue.textContent = e.target.value;
        const len = parseInt(e.target.value);
        if (trailPositions.length > len) {
          trailPositions = trailPositions.slice(-len);
        }
      });

      colorSlider.addEventListener('input', (e) => {
        colorValue.textContent = e.target.value + '°';
        // Update particle colors
        particles.forEach(p => {
          p.hue = parseInt(e.target.value) + (Math.random() - 0.5) * 20;
        });
      });

      // Keyboard shortcuts
      document.addEventListener('keydown', (e) => {
        if (e.key === ' ' || e.key === 'Space') {
          e.preventDefault();
          togglePause();
        }
        if (e.key === 'r' || e.key === 'R') {
          e.preventDefault();
          resetFollow();
        }
        if (e.key === 't' || e.key === 'T') {
          e.preventDefault();
          toggleTrail();
        }
      });

      // ----- Resize handler -----
      let resizeTimeout;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(() => {
          const oldW = canvas.width;
          const oldH = canvas.height;
          setupCanvas();
          // Adjust positions proportionally
          const newW = canvas.width;
          const newH = canvas.height;
          posX = (posX / oldW) * newW;
          posY = (posY / oldH) * newH;
          targetX = posX;
          targetY = posY;
          updateFollow();
        }, 200);
      });

      // ----- Init -----
      function init() {
        setupCanvas();
        startAnimation();
        status.textContent = '🌀 Move your cursor to make the element follow!';
        // Initial position
        const w = canvas.width;
        const h = canvas.height;
        targetX = w / 2;
        targetY = h / 2;
        posX = w / 2;
        posY = h / 2;
        updateFollow();
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }

    })();
  </script>
</body>
</html>
