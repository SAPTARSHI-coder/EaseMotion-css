<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ease-fold-unfold-panel-sap demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f4f4f5;
    }
  </style>
</head>
<body>

  <div class="fold-panel-sap" id="panel">
    <div class="fold-header" id="header">
      <span>What's included in the plan?</span>
      <span class="fold-arrow">⌄</span>
    </div>
    <div class="fold-body-wrap">
      <div class="fold-body-inner">
        <div class="fold-body">
          Unlimited projects, priority support, advanced analytics, and access to all premium templates. Cancel anytime, no long-term commitment required.
        </div>
      </div>
    </div>
  </div>

  <script>
    const panel = document.getElementById('panel');
    document.getElementById('header').addEventListener('click', () => {
      panel.classList.toggle('open');
    });
  </script>

</body>
</html>
