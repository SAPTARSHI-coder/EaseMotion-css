<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <meta
    name="description"
    content="Minimalist Outline CSS Card component built with pure HTML and CSS."
  />

  <title>Minimalist Outline Card</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <main class="demo">
    <section
      class="card"
      aria-labelledby="card-title"
    >
      <div class="card__header">
        <span class="card__eyebrow">
          CSS COMPONENT
        </span>

        <span class="card__index" aria-hidden="true">
          01
        </span>
      </div>

      <div class="card__content">
        <h1 id="card-title" class="card__title">
          Minimalist Outline
        </h1>

        <p class="card__description">
          A refined CSS card built with clean outlines,
          subtle motion, and a distraction-free visual system.
        </p>
      </div>

      <div class="card__footer">
        <span class="card__tag">
          Pure CSS
        </span>

        <a
          class="card__action"
          href="#explore"
          aria-label="Explore Minimalist Outline component"
        >
          <span>Explore</span>
          <span class="card__arrow" aria-hidden="true">→</span>
        </a>
      </div>
    </section>
  </main>

</body>
</html>
