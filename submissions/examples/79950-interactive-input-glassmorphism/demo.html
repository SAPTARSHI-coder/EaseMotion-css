<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <meta
    name="description"
    content="Interactive glassmorphism input field built with HTML and CSS."
  />

  <title>Interactive Glassmorphism Input</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main class="page">
    <div class="orb orb-one"></div>
    <div class="orb orb-two"></div>
    <div class="orb orb-three"></div>

    <section class="glass-card" aria-labelledby="page-title">
      <div class="card-header">
        <span class="eyebrow">GLASS UI • INPUT COMPONENT</span>

        <h1 id="page-title">
          Interactive
          <span>Input Field</span>
        </h1>

        <p>
          A responsive glassmorphism input component with
          animated labels, focus feedback and validation states.
        </p>
      </div>

      <form class="input-form">
        <div class="field-group">
          <label for="name">Full Name</label>

          <div class="input-wrapper">
            <span class="input-icon" aria-hidden="true">
              ◉
            </span>

            <input
              id="name"
              name="name"
              type="text"
              placeholder="Enter your full name"
              autocomplete="name"
            />
          </div>

          <small class="helper-text">
            Use your first and last name.
          </small>
        </div>

        <div class="field-group">
          <label for="email">Email Address</label>

          <div class="input-wrapper">
            <span class="input-icon" aria-hidden="true">
              @
            </span>

            <input
              id="email"
              name="email"
              type="email"
              placeholder="you@example.com"
              autocomplete="email"
            />
          </div>

          <small class="helper-text">
            We'll never share your email.
          </small>
        </div>

        <div class="field-group">
          <label for="message">Message</label>

          <div class="input-wrapper textarea-wrapper">
            <span class="input-icon textarea-icon" aria-hidden="true">
              ✦
            </span>

            <textarea
              id="message"
              name="message"
              rows="4"
              placeholder="Write your message..."
            ></textarea>
          </div>

          <small class="helper-text">
            Tell us what you're working on.
          </small>
        </div>

        <button type="button" class="submit-button">
          <span>Continue</span>
          <span class="button-arrow" aria-hidden="true">→</span>
        </button>
      </form>

      <div class="status-row">
        <span class="status-dot"></span>
        <span>Secure input interface</span>
      </div>
    </section>
  </main>
</body>
</html>
