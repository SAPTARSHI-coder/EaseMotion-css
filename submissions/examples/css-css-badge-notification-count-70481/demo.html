<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Badge Notification Count - EaseMotion</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="bnc" aria-label="Badge notification count">
      <button
        type="button"
        class="bnc-btn"
        aria-label="Inbox, 5 new notifications"
      >
        <span class="bnc-ico" aria-hidden="true">&#9993;</span>
        <span class="bnc-count" aria-hidden="false">5</span>
      </button>
    </div>
  </body>
</html>
