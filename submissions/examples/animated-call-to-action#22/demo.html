<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Animated Call To Action - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="cta-page">

    <section class="cta-card">

      <span class="cta-orb orb-1"></span>
      <span class="cta-orb orb-2"></span>
      <span class="cta-orb orb-3"></span>

      <div class="cta-content">
        <span class="cta-pill">Get Started</span>

        <h1>Build beautiful animated interfaces</h1>

        <p>
          Create modern landing pages, dashboards, and product sections
          with clean HTML and smooth CSS animations.
        </p>

        <div class="cta-actions">
          <a href="#" class="cta-btn primary">Start Free</a>
          <a href="#" class="cta-btn ghost">View Docs</a>
        </div>

        <div class="cta-stats">
          <div class="cta-stat">
            <strong>20+</strong>
            <span>Components</span>
          </div>

          <div class="cta-stat">
            <strong>0</strong>
            <span>JavaScript</span>
          </div>

          <div class="cta-stat">
            <strong>100%</strong>
            <span>CSS Powered</span>
          </div>
        </div>
      </div>

    </section>

  </main>

</body>
</html>
