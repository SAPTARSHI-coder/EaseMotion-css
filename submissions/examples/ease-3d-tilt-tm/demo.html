<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ease-3d-tilt Demo</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body { display: flex; flex-direction: column; align-items: center; gap: 40px; padding: 60px 20px; background: #111827; }
    h1 { font-size: 1.4rem; color: #f8fafc; }
    .row { display: flex; gap: 24px; flex-wrap: wrap; justify-content: center; }
    .demo-section { display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .demo-label { font-size: 0.8rem; color: rgba(248,250,252,0.45); }
  </style>
</head>
<body>
  <h1>ease-3d-tilt Component</h1>

  <div class="row">
    <div class="demo-section">
      <span class="demo-label">Default (intensity-high)</span>
      <div class="tilt-card" id="tilt1">
        <div class="tilt-content">
          <h3>3D Tilt</h3>
          <p>Hover me to see the effect</p>
        </div>
      </div>
    </div>

    <div class="demo-section">
      <span class="demo-label">Low intensity</span>
      <div class="tilt-card intensity-low theme-purple" id="tilt2">
        <div class="tilt-content">
          <h3>Subtle Tilt</h3>
          <p>Low intensity mode</p>
        </div>
      </div>
    </div>

    <div class="demo-section">
      <span class="demo-label">Blue theme</span>
      <div class="tilt-card glow-border theme-blue" id="tilt3">
        <div class="tilt-content">
          <h3>Blue Glow</h3>
          <p>With border glow effect</p>
        </div>
      </div>
    </div>
  </div>

  <div class="demo-section">
    <span class="demo-label">Size variants</span>
    <div class="row">
      <div class="tilt-card size-sm theme-emerald">
        <div class="tilt-content"><h3 style="font-size:0.9rem">Small</h3></div>
      </div>
      <div class="tilt-card size-md theme-rose">
        <div class="tilt-content"><h3>Medium</h3></div>
      </div>
      <div class="tilt-card size-lg theme-purple glow-border">
        <div class="tilt-content"><h3>Large</h3></div>
      </div>
    </div>
  </div>

  <div class="component-label">ease-3d-tilt | Issue #64944</div>

  <script>
    function applyTilt(el) {
      el.addEventListener('mousemove', function(e) {
        var rect = el.getBoundingClientRect();
        var x = (e.clientX - rect.left) / rect.width * 100;
        var y = (e.clientY - rect.top) / rect.height * 100;
        var intensity = parseFloat(getComputedStyle(el).getPropertyValue('--tilt-intensity')) || 20;
        var rotY = (x - 50) / 50 * intensity;
        var rotX = (50 - y) / 50 * intensity;
        el.style.transform = 'perspective(1000px) rotateX(' + rotX + 'deg) rotateY(' + rotY + 'deg) scale(1.03)';
        el.style.setProperty('--mouse-x', x + '%');
        el.style.setProperty('--mouse-y', y + '%');
      });
      el.addEventListener('mouseleave', function() {
        el.style.transform = '';
      });
    }
    [document.getElementById('tilt1'), document.getElementById('tilt2'), document.getElementById('tilt3')].forEach(applyTilt);
    document.querySelectorAll('.tilt-card').forEach(applyTilt);
  </script>
</body>
</html>
