<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cyberpunk Elastic Slide Popover</title>

    <link rel="stylesheet" href="style.css" />
</head>

<body>

    <main class="container">

        <h1 class="title">Cyberpunk Neon Popover</h1>

        <p class="subtitle">
            Pure HTML & CSS Elastic Slide Popover
        </p>

        <div class="popover-wrapper">

            <!-- Trigger Button -->
            <button
                class="cyber-button"
                aria-label="Open cyberpunk popover">
                Open Control Panel
            </button>

            <!-- Popover -->
            <section
                class="popover"
                role="dialog"
                aria-labelledby="popover-title">

                <div class="popover-header">
                    <span class="status-dot"></span>
                    <h2 id="popover-title">
                        System Online
                    </h2>
                </div>

                <div class="popover-content">

                    <p>
                        ✔ Access Granted
                    </p>

                    <p>
                        ✔ Firewall Active
                    </p>

                    <p>
                        ✔ Signal Stable
                    </p>

                    <p>
                        ✔ Neural Link Connected
                    </p>

                </div>

            </section>

        </div>

    </main>

</body>
</html>
