<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bubble Trail Cursor · Playful Bubbles</title>

    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <!-- === BUBBLE TRAIL CURSOR === -->
    <div class="bubble-trail-container" id="bubbleContainer"></div>

    <!-- === CONTENT === -->
    <div class="card">
        <h2>🫧 Bubble Trail Cursor</h2>
        <p class="sub">bubbles trail behind cursor and pop</p>

        <div class="cursor-demo-area">
            <p>Move your mouse around</p>
            <div class="interactive-hint">
                <i class="fas fa-mouse-pointer"></i>
                <span>Watch the bubbles follow</span>
            </div>
            <div class="demo-buttons">
                <button class="demo-btn">Hover me</button>
                <button class="demo-btn">Click me</button>
                <button class="demo-btn">Bubbles!</button>
            </div>
        </div>

        <p style="margin-top: 1.5rem; font-size: 0.85rem; color: #64748b;">
            Move your mouse · watch bubbles trail and pop
        </p>
    </div>

    <!-- Embedded JavaScript -->
    <script>
        (function() {
            'use strict';

            const container = document.getElementById('bubbleContainer');
            let mouseX = 0;
            let mouseY = 0;
            let lastBubbleTime = 0;
            const bubbleInterval = 80; // ms between bubbles

            // --- Create a bubble ---
            function createBubble(x, y) {
                const bubble = document.createElement('div');
                bubble.className = 'bubble-trail';

                // Random size
                const size = 8 + Math.random() * 20;
                bubble.style.width = size + 'px';
                bubble.style.height = size + 'px';

                // Random color
                const hue = 180 + Math.random() * 60;
                const sat = 60 + Math.random() * 40;
                const lig = 60 + Math.random() * 30;
                bubble.style.background = `radial-gradient(circle at 30% 30%, hsla(${hue}, ${sat}%, ${lig}%, 0.8), hsla(${hue}, ${sat}%, ${lig - 20}%, 0.3))`;

                // Random position offset
                const offsetX = (Math.random() - 0.5) * 20;
                const offsetY = (Math.random() - 0.5) * 20;
                bubble.style.left = (x + offsetX) + 'px';
                bubble.style.top = (y + offsetY) + 'px';

                // Random animation duration
                const duration = 1.5 + Math.random() * 2;
                const delay = Math.random() * 0.3;
                bubble.style.setProperty('--duration', duration + 's');
                bubble.style.setProperty('--delay', delay + 's');

                // Random trajectory
                const tx = (Math.random() - 0.5) * 80;
                const ty = -30 - Math.random() * 80;
                bubble.style.setProperty('--tx', tx + 'px');
                bubble.style.setProperty('--ty', ty + 'px');

                // Random rotation
                const rotation = (Math.random() - 0.5) * 360;
                bubble.style.setProperty('--rotation', rotation + 'deg');

                // Random glow intensity
                const glow = 10 + Math.random() * 30;
                bubble.style.setProperty('--glow', glow + 'px');

                // Random pop delay (when bubble pops)
                const popDelay = 1.2 + Math.random() * 1.5;
                bubble.style.setProperty('--pop-delay', popDelay + 's');

                container.appendChild(bubble);

                // Remove bubble after animation
                setTimeout(() => {
                    if (bubble.parentNode) {
                        bubble.remove();
                    }
                }, (duration + delay + 0.5) * 1000);
            }

            // --- Create bubble burst (pop effect) ---
            function createBubblePop(x, y) {
                for (let i = 0; i < 6; i++) {
                    const particle = document.createElement('div');
                    particle.className = 'bubble-pop-particle';

                    const size = 2 + Math.random() * 4;
                    particle.style.width = size + 'px';
                    particle.style.height = size + 'px';

                    const hue = 180 + Math.random() * 60;
                    particle.style.background = `hsla(${hue}, 80%, 70%, 0.8)`;

                    const angle = Math.random() * 2 * Math.PI;
                    const dist = 20 + Math.random() * 40;
                    const vx = Math.cos(angle) * dist;
                    const vy = Math.sin(angle) * dist - 10;
                    particle.style.setProperty('--vx', vx + 'px');
                    particle.style.setProperty('--vy', vy + 'px');

                    particle.style.left = x + 'px';
                    particle.style.top = y + 'px';

                    container.appendChild(particle);

                    setTimeout(() => {
                        if (particle.parentNode) {
                            particle.remove();
                        }
                    }, 600);
                }
            }

            // --- Mouse move ---
            document.addEventListener('mousemove', function(e) {
                mouseX = e.clientX;
                mouseY = e.clientY;

                const now = Date.now();
                if (now - lastBubbleTime > bubbleInterval) {
                    createBubble(mouseX, mouseY);
                    lastBubbleTime = now;
                }
            });

            // --- Click to create bubble burst ---
            document.addEventListener('click', function(e) {
                const x = e.clientX;
                const y = e.clientY;

                // Create multiple bubbles on click
                for (let i = 0; i < 8; i++) {
                    setTimeout(() => {
                        createBubble(x + (Math.random() - 0.5) * 30, y + (Math.random() - 0.5) * 30);
                    }, i * 50);
                }

                // Create pop burst
                createBubblePop(x, y);

                console.log('🫧 Bubbles popped!');
            });

            // --- Touch support ---
            document.addEventListener('touchmove', function(e) {
                e.preventDefault();
                const touch = e.touches[0];
                mouseX = touch.clientX;
                mouseY = touch.clientY;

                const now = Date.now();
                if (now - lastBubbleTime > bubbleInterval) {
                    createBubble(mouseX, mouseY);
                    lastBubbleTime = now;
                }
            }, { passive: false });

            document.addEventListener('touchstart', function(e) {
                const touch = e.touches[0];
                const x = touch.clientX;
                const y = touch.clientY;

                for (let i = 0; i < 8; i++) {
                    setTimeout(() => {
                        createBubble(x + (Math.random() - 0.5) * 30, y + (Math.random() - 0.5) * 30);
                    }, i * 50);
                }
                createBubblePop(x, y);
            });

            // --- Hover effects on interactive elements ---
            const interactiveElements = document.querySelectorAll('a, button, .demo-btn, .interactive-hint');
            interactiveElements.forEach(el => {
                el.addEventListener('mouseenter', function() {
                    const rect = this.getBoundingClientRect();
                    const cx = rect.left + rect.width / 2;
                    const cy = rect.top + rect.height / 2;

                    for (let i = 0; i < 5; i++) {
                        setTimeout(() => {
                            createBubble(cx + (Math.random() - 0.5) * 40, cy + (Math.random() - 0.5) * 40);
                        }, i * 80);
                    }
                });
            });

            console.log('🫧 Bubble trail cursor initialized!');

        })();
    </script>

</body>
</html>
