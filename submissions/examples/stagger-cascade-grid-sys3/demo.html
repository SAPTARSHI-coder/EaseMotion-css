<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staggered Cascade Sequence Controller for Grid Systems</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../easemotion.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>Staggered Cascade Sequence Grid</h1>
      <p>Automated delay calculation for N-dimensional grid item cascades.</p>
      <button class="btn" onclick="replayCascade()">Replay Cascade</button>
    </header>

    <main class="grid-container" id="gridContainer">
      <!-- 12 Grid Cards generated dynamically -->
    </main>
  </div>

  <script>
    function renderGrid() {
      const container = document.getElementById('gridContainer');
      container.innerHTML = '';
      for (let i = 1; i <= 12; i++) {
        const card = document.createElement('div');
        card.className = 'grid-card ease-cascade-item';
        card.style.setProperty('--item-index', i);
        card.innerHTML = `<h3>Card ${i}</h3><p>Cascade item sequence ${i}</p>`;
        container.appendChild(card);
      }
    }

    function replayCascade() {
      renderGrid();
    }

    renderGrid();
  </script>
</body>
</html>
