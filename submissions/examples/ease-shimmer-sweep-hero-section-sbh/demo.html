<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ease-shimmer-sweep-hero-section — Demo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <section class="hero" aria-label="Hero">
      <span class="hero__eyebrow" aria-hidden="true">Shimmer · v2.4</span>
      <h1 class="hero__title" data-shimmer="Motion that glows.">Motion that glows.</h1>
      <p class="hero__lead">
        A glassmorphism hero section whose headline sweeps a diagonal shimmer across its letters on a loop, like light passing over polished glass.
      </p>
      <div class="hero__actions">
        <a class="hero__cta" href="#start" tabindex="0">Get started</a>
        <a class="hero__cta hero__cta--ghost" href="#docs" tabindex="0">Read the docs</a>
      </div>
    </section>
  </main>
</body>
</html>
