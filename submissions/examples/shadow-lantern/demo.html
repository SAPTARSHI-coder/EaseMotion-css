<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shadow Lantern</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="lantern-app">

    <section class="lantern-display" id="lanternDisplay">

      <canvas id="lanternCanvas"></canvas>

      <div class="lantern-hud">

        <div class="hud-card">
          <span class="hud-label">🕯️ Light Position</span>
          <span class="hud-value" id="positionValue">
            X: 50% · Y: 45%
          </span>
        </div>

        <div class="hud-card">
          <span class="hud-label">💡 Intensity</span>
          <span class="hud-value" id="intensityValue">
            75%
          </span>
        </div>

        <div class="hud-card">
          <span class="hud-label">🌑 Shadow Softness</span>
          <span class="hud-value" id="softnessValue">
            8px
          </span>
        </div>

      </div>

      <div class="lantern-title">
        <span>🕯️ Shadow Lantern</span>
        <small id="statusText">Lantern is flickering</small>
      </div>

    </section>

    <section class="controls">

      <div class="control-group">
        <label for="intensitySlider">
          Light Intensity
        </label>

        <input
          id="intensitySlider"
          type="range"
          min="20"
          max="100"
          value="75"
        >
      </div>

      <div class="control-group">
        <label for="softnessSlider">
          Shadow Softness
        </label>

        <input
          id="softnessSlider"
          type="range"
          min="0"
          max="20"
          value="8"
        >
      </div>

      <button class="control-button" id="flickerButton">
        ✨ Toggle Flicker
      </button>

      <button class="control-button reset" id="resetButton">
        ⟳ Reset Lantern
      </button>

    </section>

    <p class="hint">
      Drag the lantern glow or use arrow keys to move the light.
    </p>

  </main>

  <script>
    const canvas = document.getElementById("lanternCanvas");
    const ctx = canvas.getContext("2d");

    const display = document.getElementById("lanternDisplay");

    const intensitySlider =
      document.getElementById("intensitySlider");

    const softnessSlider =
      document.getElementById("softnessSlider");

    const flickerButton =
      document.getElementById("flickerButton");

    const resetButton =
      document.getElementById("resetButton");

    const positionValue =
      document.getElementById("positionValue");

    const intensityValue =
      document.getElementById("intensityValue");

    const softnessValue =
      document.getElementById("softnessValue");

    const statusText =
      document.getElementById("statusText");

    let width = 0;
    let height = 0;

    let intensity = 0.75;
    let softness = 8;
    let flickering = true;

    const lantern = {
      x: 0.5,
      y: 0.45
    };

    const defaultLantern = {
      x: 0.5,
      y: 0.45
    };

    const objects = [
      { x: 0.25, y: 0.42, r: 25, phase: 0.1 },
      { x: 0.38, y: 0.30, r: 18, phase: 1.2 },
      { x: 0.52, y: 0.34, r: 30, phase: 2.1 },
      { x: 0.68, y: 0.38, r: 22, phase: 0.8 },
      { x: 0.78, y: 0.27, r: 17, phase: 2.8 },
      { x: 0.62, y: 0.58, r: 26, phase: 1.7 }
    ];

    const dust = [];

    function resize() {
      const rect = display.getBoundingClientRect();

      width = rect.width;
      height = rect.height;

      const ratio = window.devicePixelRatio || 1;

      canvas.width = width * ratio;
      canvas.height = height * ratio;

      canvas.style.width = width + "px";
      canvas.style.height = height + "px";

      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
    }

    function createDust() {
      dust.length = 0;

      for (let i = 0; i < 35; i++) {
        dust.push({
          x: Math.random(),
          y: Math.random(),
          size: Math.random() * 2 + 0.5,
          speed: Math.random() * 0.0004 + 0.0001,
          phase: Math.random() * Math.PI * 2
        });
      }
    }

    function drawBackground() {
      const gradient = ctx.createLinearGradient(
        0,
        0,
        0,
        height
      );

      gradient.addColorStop(0, "#080713");
      gradient.addColorStop(0.55, "#141124");
      gradient.addColorStop(1, "#05050c");

      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, width, height);
    }

    function drawProjectionSurface() {
      const surfaceY = height * 0.70;

      const gradient = ctx.createLinearGradient(
        0,
        surfaceY,
        0,
        height
      );

      gradient.addColorStop(0, "rgba(255,255,255,0.08)");
      gradient.addColorStop(1, "rgba(255,255,255,0.015)");

      ctx.fillStyle = gradient;

      ctx.fillRect(
        0,
        surfaceY,
        width,
        height - surfaceY
      );

      ctx.strokeStyle = "rgba(255,255,255,0.08)";
      ctx.beginPath();
      ctx.moveTo(0, surfaceY);
      ctx.lineTo(width, surfaceY);
      ctx.stroke();
    }

    function drawShadow(object, ox, oy) {
      const lx = lantern.x * width;
      const ly = lantern.y * height;

      const dx = ox - lx;
      const dy = oy - ly;

      const distance = Math.sqrt(dx * dx + dy * dy) || 1;

      const directionX = dx / distance;
      const directionY = dy / distance;

      const projectionDistance =
        Math.min(180, 70 + distance * 0.35);

      const shadowX =
        ox + directionX * projectionDistance;

      const shadowY =
        oy + directionY * projectionDistance;

      const surfaceY = height * 0.70;

      ctx.save();

      ctx.translate(
        shadowX,
        Math.max(surfaceY, shadowY)
      );

      ctx.rotate(
        Math.atan2(directionY, directionX)
      );

      ctx.filter =
        `blur(${softness}px)`;

      const opacity =
        Math.max(
          0.12,
          Math.min(
            0.65,
            1 - distance / 700
          )
        );

      ctx.fillStyle =
        `rgba(0,0,0,${opacity})`;

      ctx.beginPath();

      ctx.ellipse(
        0,
        0,
        object.r * 1.7,
        object.r * 0.55,
        0,
        0,
        Math.PI * 2
      );

      ctx.fill();

      ctx.restore();
    }

    function drawObjects(time) {

      objects.forEach(object => {

        const floatOffset =
          Math.sin(
            time * 0.0015 +
            object.phase
          ) * 8;

        const ox = object.x * width;
        const oy =
          object.y * height +
          floatOffset;

        drawShadow(object, ox, oy);

        ctx.save();

        ctx.translate(ox, oy);

        const glow =
          ctx.createRadialGradient(
            0,
            0,
            0,
            0,
            0,
            object.r * 2
          );

        glow.addColorStop(
          0,
          "rgba(255,190,100,0.18)"
        );

        glow.addColorStop(
          1,
          "rgba(255,190,100,0)"
        );

        ctx.fillStyle = glow;

        ctx.beginPath();
        ctx.arc(
          0,
          0,
          object.r * 2,
          0,
          Math.PI * 2
        );
        ctx.fill();

        ctx.fillStyle =
          "rgba(235,225,205,0.9)";

        ctx.beginPath();
        ctx.arc(
          0,
          0,
          object.r,
          0,
          Math.PI * 2
        );

        ctx.fill();

        ctx.restore();
      });
    }

    function drawDust(time) {

      dust.forEach(particle => {

        particle.y -= particle.speed;

        if (particle.y < 0) {
          particle.y = 1;
        }

        const x =
          particle.x * width +
          Math.sin(
            time * 0.001 +
            particle.phase
          ) * 8;

        const y =
          particle.y * height;

        const dx =
          x - lantern.x * width;

        const dy =
          y - lantern.y * height;

        const distance =
          Math.sqrt(dx * dx + dy * dy);

        const visibility =
          Math.max(
            0,
            1 - distance / 400
          );

        ctx.fillStyle =
          `rgba(255,220,150,${visibility * 0.7})`;

        ctx.beginPath();

        ctx.arc(
          x,
          y,
          particle.size,
          0,
          Math.PI * 2
        );

        ctx.fill();
      });
    }

    function drawLantern(time) {

      const x = lantern.x * width;
      const y = lantern.y * height;

      let flicker = 1;

      if (flickering) {
        flicker =
          0.94 +
          Math.sin(time * 0.018) * 0.035 +
          Math.sin(time * 0.041) * 0.025;
      }

      const radius =
        150 * intensity * flicker;

      const glow =
        ctx.createRadialGradient(
          x,
          y,
          0,
          x,
          y,
          radius
        );

      glow.addColorStop(
        0,
        `rgba(255,205,110,${0.5 * intensity})`
      );

      glow.addColorStop(
        0.25,
        `rgba(255,170,70,${0.2 * intensity})`
      );

      glow.addColorStop(
        1,
        "rgba(255,130,40,0)"
      );

      ctx.fillStyle = glow;

      ctx.beginPath();

      ctx.arc(
        x,
        y,
        radius,
        0,
        Math.PI * 2
      );

      ctx.fill();

      ctx.fillStyle =
        "rgba(255,220,150,0.95)";

      ctx.shadowBlur = 30;
      ctx.shadowColor =
        "rgba(255,170,70,0.8)";

      ctx.beginPath();

      ctx.arc(
        x,
        y,
        9,
        0,
        Math.PI * 2
      );

      ctx.fill();

      ctx.shadowBlur = 0;
    }

    function updateUI() {

      positionValue.textContent =
        `X: ${Math.round(lantern.x * 100)}% · ` +
        `Y: ${Math.round(lantern.y * 100)}%`;

      intensityValue.textContent =
        `${Math.round(intensity * 100)}%`;

      softnessValue.textContent =
        `${softness}px`;

      statusText.textContent =
        flickering
          ? "Lantern is flickering"
          : "Lantern is steady";
    }

    function render(time) {

      drawBackground();
      drawProjectionSurface();
      drawObjects(time);
      drawDust(time);
      drawLantern(time);

      updateUI();

      requestAnimationFrame(render);
    }

    function moveLantern(x, y) {

      lantern.x =
        Math.max(
          0.08,
          Math.min(0.92, x)
        );

      lantern.y =
        Math.max(
          0.10,
          Math.min(0.65, y)
        );
    }

    let dragging = false;

    canvas.addEventListener(
      "pointerdown",
      event => {
        dragging = true;
        canvas.setPointerCapture(
          event.pointerId
        );
      }
    );

    canvas.addEventListener(
      "pointermove",
      event => {

        if (!dragging) return;

        const rect =
          canvas.getBoundingClientRect();

        moveLantern(
          (event.clientX - rect.left) /
            rect.width,

          (event.clientY - rect.top) /
            rect.height
        );
      }
    );

    canvas.addEventListener(
      "pointerup",
      () => {
        dragging = false;
      }
    );

    intensitySlider.addEventListener(
      "input",
      event => {
        intensity =
          Number(event.target.value) / 100;
      }
    );

    softnessSlider.addEventListener(
      "input",
      event => {
        softness =
          Number(event.target.value);
      }
    );

    flickerButton.addEventListener(
      "click",
      () => {
        flickering = !flickering;
      }
    );

    resetButton.addEventListener(
      "click",
      () => {
        lantern.x =
          defaultLantern.x;

        lantern.y =
          defaultLantern.y;
      }
    );

    window.addEventListener(
      "keydown",
      event => {

        const step = 0.025;

        if (event.key === "ArrowLeft")
          lantern.x -= step;

        if (event.key === "ArrowRight")
          lantern.x += step;

        if (event.key === "ArrowUp")
          lantern.y -= step;

        if (event.key === "ArrowDown")
          lantern.y += step;

        if (
          event.key.toLowerCase() === "r"
        ) {
          lantern.x =
            defaultLantern.x;

          lantern.y =
            defaultLantern.y;
        }

        if (event.code === "Space") {
          event.preventDefault();
          flickering = !flickering;
        }

        moveLantern(
          lantern.x,
          lantern.y
        );
      }
    );

    window.addEventListener(
      "resize",
      resize
    );

    resize();
    createDust();
    requestAnimationFrame(render);
  </script>

</body>
</html>
