<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chaos Backpressure Valve</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="pressure-shell" aria-labelledby="pressure-title">
    <section class="pressure-panel">
      <p class="eyebrow">Adaptive flow control</p>
      <h1 id="pressure-title">Chaos Backpressure Valve</h1>
      <p class="summary">Surging request lanes hit a pressure chamber while the valve narrows admission and drains overflow into cooldown recovery.</p>
      <div class="pressure-stage" role="img" aria-label="Animated chaos backpressure valve visualization">
        <div class="surge-lanes"><span></span><span></span><span></span><span></span></div>
        <div class="pressure-chamber"><i></i><i></i><strong>pressure</strong></div>
        <div class="valve-core"><b></b><b></b><em>valve</em></div>
        <div class="cooldown-drain"><small>cooldown</small><span></span><span></span><span></span></div>
      </div>
      <div class="readouts"><span>surge 88%</span><span>admit 63%</span><span>drain 25%</span></div>
    </section>
  </main>
</body>
</html>
