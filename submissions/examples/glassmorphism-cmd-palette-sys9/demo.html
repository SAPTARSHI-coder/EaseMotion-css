<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glassmorphism Command Palette with Sound-Wave Kinetic Motion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../easemotion.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>Glassmorphism Command Palette</h1>
      <p>Press <kbd>Ctrl + K</kbd> or click the button below to toggle palette.</p>
      <button class="btn" onclick="togglePalette()">Open Command Palette</button>
    </header>

    <div class="palette-overlay" id="paletteOverlay">
      <div class="cmd-palette">
        <input type="text" class="cmd-input" placeholder="Type a command or search..." autofocus>
        <ul class="cmd-list">
          <li class="cmd-item active">🚀 Launch Application</li>
          <li class="cmd-item">🎨 Change Theme Settings</li>
          <li class="cmd-item">📄 View Documentation</li>
          <li class="cmd-item">⚡ Run Speed Test</li>
        </ul>
      </div>
    </div>
  </div>

  <script>
    function togglePalette() {
      const overlay = document.getElementById('paletteOverlay');
      overlay.classList.toggle('active');
    }

    document.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
        e.preventDefault();
        togglePalette();
      }
      if (e.key === 'Escape') {
        document.getElementById('paletteOverlay').classList.remove('active');
      }
    });
  </script>
</body>
</html>
