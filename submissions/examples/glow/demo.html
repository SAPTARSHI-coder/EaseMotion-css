<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brutalist Glowing Search Bar Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="search-container">
    <div class="brutal-search-wrapper">
      <input type="text" class="brutal-search-input" placeholder="SEARCH THE ARCHIVE..." aria-label="Search" />
      <button type="submit" class="brutal-search-btn" aria-label="Submit Search">
        <span class="btn-text">EXPLORE</span>
      </button>
    </div>
  </div>
</body>
</html>
