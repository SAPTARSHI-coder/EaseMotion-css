<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Interactive CSS animation-delay visualizer">
  <title>Animation Delay Visualizer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="delay-demo">
    <section class="delay-card" aria-labelledby="title">
      <p class="eyebrow">EaseMotion CSS</p>
      <h1 id="title">Animation Delay Visualizer</h1>
      <p class="description">
        Adjust the delay to see when each animation begins.
      </p>

      <div class="controls">
        <label for="delay">
          Animation delay
          <strong id="delay-value">0.5s</strong>
        </label>

        <input
          id="delay"
          type="range"
          min="0"
          max="1.5"
          step="0.5"
          value="0.5"
          aria-describedby="delay-value"
        >

        <button id="replay" type="button">
          Replay animation
        </button>
      </div>

      <div
        id="animation-stage"
        class="animation-stage"
        aria-label="Animated elements demonstrating animation delay"
      >
        <div class="animation-item item-1">0s</div>
        <div class="animation-item item-2">0.5s</div>
        <div class="animation-item item-3">1s</div>
        <div class="animation-item item-4">1.5s</div>
      </div>

      <p class="hint">
        Change the slider and replay to compare staggered animation timing.
      </p>
    </section>
  </main>

  <script>
    const delayInput = document.getElementById("delay");
    const delayValue = document.getElementById("delay-value");
    const replayButton = document.getElementById("replay");
    const stage = document.getElementById("animation-stage");

    function updateDelay() {
      const value = `${delayInput.value}s`;
      delayValue.textContent = value;
      stage.style.setProperty("--animation-delay", value);
    }

    function replayAnimation() {
      stage.classList.remove("is-playing");

      void stage.offsetWidth;

      stage.classList.add("is-playing");
    }

    delayInput.addEventListener("input", () => {
      updateDelay();
      replayAnimation();
    });

    replayButton.addEventListener("click", replayAnimation);

    updateDelay();
    replayAnimation();
  </script>
</body>
</html>
