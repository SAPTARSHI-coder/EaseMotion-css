<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="CSS-only animated gyrocompass precession demonstration."
  >
  <title>Gyrocompass Precession | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="demo">
    <section
      class="ease-gyrocompass-precession"
      aria-labelledby="gyrocompass-title"
    >
      <div class="intro">
        <p class="eyebrow">EaseMotion CSS</p>

        <h1 id="gyrocompass-title">
          Gyrocompass Precession
        </h1>

        <p>
          A CSS-only visualization of a spinning gyro rotor
          with slow azimuth precession.
        </p>
      </div>

      <div class="ease-gyrocompass-precession__housing">
        <div class="ease-gyrocompass-precession__bezel">
          <div class="ease-gyrocompass-precession__face">

            <div
              class="ease-gyrocompass-precession__motion"
              aria-hidden="true"
            >
              <div class="compass-card">
                <span class="direction north">N</span>
                <span class="direction east">E</span>
                <span class="direction south">S</span>
                <span class="direction west">W</span>

                <span class="degree degree-1"></span>
                <span class="degree degree-2"></span>
                <span class="degree degree-3"></span>
                <span class="degree degree-4"></span>

                <div class="gyro-rotor">
                  <span></span>
                  <span></span>
                  <span></span>
                </div>
              </div>

              <span class="ease-gyrocompass-precession__a"></span>
              <span class="ease-gyrocompass-precession__b"></span>
              <span class="ease-gyrocompass-precession__c"></span>
              <span class="ease-gyrocompass-precession__d"></span>
            </div>

            <div class="center-pin" aria-hidden="true"></div>

          </div>
        </div>
      </div>

      <p class="caption">
        Continuous rotor spin with slow compass-card precession
      </p>
    </section>
  </main>
</body>
</html>
