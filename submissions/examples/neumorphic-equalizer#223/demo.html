<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neumorphic Equalizer | EaseMotion CSS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="equalizer-scene">
        <!-- Player Card -->
        <div class="player-card">
            <!-- Album Art -->
            <div class="album-art">
                <div class="album-glow"></div>
                <div class="vinyl-ring"></div>
                <div class="vinyl-center"></div>
            </div>

            <!-- Track Info -->
            <div class="track-info">
                <h2 class="track-name">Midnight Pulse</h2>
                <p class="track-artist">EaseMotion FM</p>
            </div>

            <!-- Equalizer Bars -->
            <div class="equalizer">
                <div class="eq-bar bar-1"><div class="eq-fill"></div></div>
                <div class="eq-bar bar-2"><div class="eq-fill"></div></div>
                <div class="eq-bar bar-3"><div class="eq-fill"></div></div>
                <div class="eq-bar bar-4"><div class="eq-fill"></div></div>
                <div class="eq-bar bar-5"><div class="eq-fill"></div></div>
                <div class="eq-bar bar-6"><div class="eq-fill"></div></div>
                <div class="eq-bar bar-7"><div class="eq-fill"></div></div>
                <div class="eq-bar bar-8"><div class="eq-fill"></div></div>
                <div class="eq-bar bar-9"><div class="eq-fill"></div></div>
                <div class="eq-bar bar-10"><div class="eq-fill"></div></div>
                <div class="eq-bar bar-11"><div class="eq-fill"></div></div>
                <div class="eq-bar bar-12"><div class="eq-fill"></div></div>
            </div>

            <!-- Progress Bar -->
            <div class="progress-container">
                <span class="time current">1:24</span>
                <div class="progress-track">
                    <div class="progress-fill"></div>
                    <div class="progress-thumb"></div>
                </div>
                <span class="time total">3:45</span>
            </div>

            <!-- Controls -->
            <div class="controls">
                <button class="ctrl-btn btn-prev">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                        <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/>
                    </svg>
                </button>
                <button class="ctrl-btn btn-play">
                    <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor">
                        <path d="M8 5v14l11-7z"/>
                    </svg>
                </button>
                <button class="ctrl-btn btn-next">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                        <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/>
                    </svg>
                </button>
            </div>

            <!-- Volume -->
            <div class="volume-container">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" class="vol-icon">
                    <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/>
                </svg>
                <div class="volume-track">
                    <div class="volume-fill"></div>
                    <div class="volume-thumb"></div>
                </div>
            </div>
        </div>

        <!-- Ambient Glow -->
        <div class="ambient-glow"></div>
    </div>
</body>
</html>
