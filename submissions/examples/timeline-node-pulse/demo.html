<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timeline Node Pulse</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section class="timeline">
    <article class="item done">
      <span class="node"></span>
      <h1>Brief approved</h1>
      <p>Project scope was confirmed.</p>
    </article>
    <article class="item active">
      <span class="node"></span>
      <h1>Build in progress</h1>
      <p>Components are being polished.</p>
    </article>
    <article class="item">
      <span class="node"></span>
      <h1>Final review</h1>
      <p>Quality checks will run next.</p>
    </article>
  </section>
</body>
</html>
