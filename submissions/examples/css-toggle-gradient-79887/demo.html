<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS-only Gradient Toggle</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <h1>CSS-only Gradient Toggle</h1>

    <label class="toggle">
      <input type="checkbox">
      <span class="slider">
        <span class="label off">OFF</span>
        <span class="label on">ON</span>
      </span>
    </label>
  </div>
</body>
</html>
