<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-qr-code-scanner-frame demo</title>
</head>
<body>
<div class="qsf-stage">
  <div class="qsf-viewfinder">
    <i class="qsf-corn qsf-tl"></i>
    <i class="qsf-corn qsf-tr"></i>
    <i class="qsf-corn qsf-bl"></i>
    <i class="qsf-corn qsf-br"></i>
    <span class="qsf-scanline"></span>
    <span class="qsf-grid">
      <b class="qsf-q q1"></b>
      <b class="qsf-q q2"></b>
      <b class="qsf-q q3"></b>
      <b class="qsf-q q4"></b>
      <b class="qsf-q q5"></b>
      <b class="qsf-q q6"></b>
      <b class="qsf-q q7"></b>
      <b class="qsf-q q8"></b>
      <b class="qsf-q q9"></b>
    </span>
  </div>
  <span class="qsf-label">ALIGN QR CODE</span>
</div>
</body>
</html>
