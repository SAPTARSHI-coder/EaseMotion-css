<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CSS Exam Result Card">
  <title>CSS Exam Result Card</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="page">
    <article class="result-card" aria-labelledby="result-title">

      <div class="card-header">
        <span class="eyebrow">Exam Result</span>
        <h1 id="result-title">Final Examination</h1>
        <p>Academic Year 2025–26</p>
      </div>

      <div class="student-info">
        <div>
          <span class="label">Student</span>
          <strong>Alex Morgan</strong>
        </div>

        <div>
          <span class="label">Roll Number</span>
          <strong>CS-1024</strong>
        </div>
      </div>

      <div class="score-section">
        <div class="score">
          <span class="label">Total Score</span>
          <strong>87<span>/100</span></strong>
        </div>

        <div class="percentage">
          <span class="label">Percentage</span>
          <strong>87%</strong>
        </div>
      </div>

      <div class="result-details">
        <div class="detail">
          <span class="label">Grade</span>
          <strong>A</strong>
        </div>

        <div class="detail">
          <span class="label">Result</span>
          <strong class="status">PASSED</strong>
        </div>
      </div>

      <div class="progress-area">
        <div class="progress-label">
          <span>Performance</span>
          <span>87%</span>
        </div>

        <div
          class="progress-bar"
          role="progressbar"
          aria-label="Exam performance"
          aria-valuenow="87"
          aria-valuemin="0"
          aria-valuemax="100"
        >
          <span></span>
        </div>
      </div>

      <footer class="card-footer">
        <span>Keep up the great work!</span>
        <span aria-hidden="true">★</span>
      </footer>

    </article>
  </main>
</body>
</html>
