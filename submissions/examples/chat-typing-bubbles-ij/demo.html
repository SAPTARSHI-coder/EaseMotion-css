<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-chat-typing-bubbles demo</title>
</head>
<body>
<div class="cb-app">
  <span class="cb-title">SUPPORT CHAT</span>
  <div class="cb-thread">
    <div class="cb-msg cb-msg-in">Any update on my order?</div>
    <div class="cb-msg cb-msg-out">Checking now...</div>
    <div class="cb-typing">
      <span class="cb-dot cb-dot-1"></span>
      <span class="cb-dot cb-dot-2"></span>
      <span class="cb-dot cb-dot-3"></span>
      <span class="cb-typing-label">AGENT TYPING</span>
    </div>
  </div>
  <span class="cb-online">3 AGENTS ONLINE</span>
</div>
</body>
</html>
