<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EaseMotion - CSS Skeleton Loader</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>EaseMotion Shimmer Skeleton Example</h1>

    <!-- Mock Profile Card in Loading State -->
    <div class="profile-card">
        
        <!-- Header (Avatar + Title) -->
        <div class="card-header">
            <!-- Avatar Placeholder -->
            <div class="avatar ease-shimmer"></div>
            
            <!-- Title Placeholders -->
            <div class="titles">
                <div class="title-line-1 ease-shimmer"></div>
                <div class="title-line-2 ease-shimmer"></div>
            </div>
        </div>

        <!-- Body (Text block) -->
        <div class="card-body">
            <div class="text-line ease-shimmer"></div>
            <div class="text-line short ease-shimmer"></div>
            <div class="text-line shorter ease-shimmer"></div>
        </div>

        <!-- Footer (Action button) -->
        <div class="card-footer">
            <div class="action-button ease-shimmer"></div>
        </div>

    </div>

</body>
</html>
