<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Loader: Morphing Shape</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="layout-container">
        
        <header class="section-header">
            <h1 class="title">Pure CSS Loader: Morphing Shape</h1>
            <p class="subtitle">An organic, fluid loading animation utilizing complex CSS border-radius manipulation and continuous rotation to simulate a morphing liquid droplet.</p>
        </header>

        <div class="demo-area">
            
            <div class="loader-container" aria-label="Loading content, morphing liquid animation playing">
                
                <!-- 
                  [TECHNIQUE] Morphing Shape
                  The morphing effect is achieved purely through 
                  animating the border-radius property while rotating.
                -->
                <div class="morph-wrapper" aria-hidden="true">
                    
                    <div class="morph-blob blob-1"></div>
                    <div class="morph-blob blob-2"></div>
                    <div class="morph-blob blob-3"></div>
                    
                </div>
                
                <div class="loading-text">Processing...</div>
                
            </div>
            
        </div>
        
    </div>

</body>
</html>
