<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Neumorphic Gradient Avatar component built with HTML and CSS"
  >
  <title>Neumorphic Gradient Avatar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">

    <section class="showcase">

      <div class="intro">
        <span class="eyebrow">NEUMORPHIC / GRADIENT</span>
        <h1>Gradient Avatar</h1>
        <p>
          A soft neumorphic avatar component enhanced with vibrant
          gradient rings, layered shadows, and responsive sizing.
        </p>
      </div>

      <div class="avatar-stage">

        <div class="avatar-card">

          <div class="avatar-wrapper">
            <div class="avatar-glow"></div>

            <div
              class="avatar"
              role="img"
              aria-label="Alex Morgan avatar"
            >
              AM
            </div>

            <span
              class="online-status"
              aria-label="Online"
            ></span>
          </div>

          <div class="profile-info">
            <h2>Alex Morgan</h2>
            <p>Product Designer</p>

            <div class="profile-tags">
              <span>Design</span>
              <span>Creative</span>
              <span>UI/UX</span>
            </div>
          </div>

          <button class="profile-button">
            View Profile
          </button>

        </div>

        <div class="avatar-options">

          <div class="option">
            <div class="mini-avatar gradient-one">AM</div>
            <span>Violet</span>
          </div>

          <div class="option">
            <div class="mini-avatar gradient-two">AM</div>
            <span>Ocean</span>
          </div>

          <div class="option">
            <div class="mini-avatar gradient-three">AM</div>
            <span>Sunset</span>
          </div>

        </div>

      </div>

    </section>

  </main>

</body>
</html>
