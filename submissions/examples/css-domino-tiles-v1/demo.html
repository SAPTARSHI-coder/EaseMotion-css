<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Interactive CSS domino tiles with dot patterns and flip animations."
  >

  <title>CSS Domino Tiles</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="demo">
    <header class="demo-header">
      <p class="eyebrow">EaseMotion CSS</p>

      <h1>Domino Tiles</h1>

      <p>
        Hover or focus a tile to reveal a smooth CSS-powered flip animation.
      </p>
    </header>

    <section
      class="domino-board"
      aria-label="Domino tile collection"
    >

      <!-- Domino 1 / 6 -->
      <div
        class="domino"
        tabindex="0"
        role="img"
        aria-label="Domino tile showing one and six"
      >
        <div class="domino-inner">
          <div class="domino-face domino-front">
            <span class="half">
              <span class="pip p1"></span>
            </span>

            <span class="divider"></span>

            <span class="half six">
              <span class="pip p1"></span>
              <span class="pip p2"></span>
              <span class="pip p3"></span>
              <span class="pip p4"></span>
              <span class="pip p5"></span>
              <span class="pip p6"></span>
            </span>
          </div>

          <div class="domino-face domino-back">
            <span class="back-symbol">✦</span>
          </div>
        </div>
      </div>

      <!-- Domino 2 / 5 -->
      <div
        class="domino"
        tabindex="0"
        role="img"
        aria-label="Domino tile showing two and five"
      >
        <div class="domino-inner">
          <div class="domino-face domino-front">
            <span class="half two">
              <span class="pip p1"></span>
              <span class="pip p4"></span>
            </span>

            <span class="divider"></span>

            <span class="half five">
              <span class="pip p1"></span>
              <span class="pip p2"></span>
              <span class="pip p3"></span>
              <span class="pip p4"></span>
              <span class="pip p5"></span>
            </span>
          </div>

          <div class="domino-face domino-back">
            <span class="back-symbol">✦</span>
          </div>
        </div>
      </div>

      <!-- Domino 3 / 4 -->
      <div
        class="domino"
        tabindex="0"
        role="img"
        aria-label="Domino tile showing three and four"
      >
        <div class="domino-inner">
          <div class="domino-face domino-front">
            <span class="half three">
              <span class="pip p1"></span>
              <span class="pip p3"></span>
              <span class="pip p5"></span>
            </span>

            <span class="divider"></span>

            <span class="half four">
              <span class="pip p1"></span>
              <span class="pip p2"></span>
              <span class="pip p4"></span>
              <span class="pip p5"></span>
            </span>
          </div>

          <div class="domino-face domino-back">
            <span class="back-symbol">✦</span>
          </div>
        </div>
      </div>

    </section>

    <p class="hint">
      Pure CSS · 3D flip · Keyboard accessible
    </p>
  </main>
</body>
</html>
