<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skeleton Loading Utility Demo - EaseMotion-css</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 2rem;
      background-color: #f9fafb;
      color: #1f2937;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    .card {
      background: #ffffff;
      padding: 1.5rem;
      border-radius: 8px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      margin-bottom: 2rem;
    }

    .flex {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    .flex-1 {
      flex: 1;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>EaseMotion-css: Skeleton Loader Examples</h2>

    <!-- Shimmer Skeleton Card -->
    <h3>1. Shimmer Effect Card</h3>
    <div class="card">
      <div class="flex">
        <div class="em-skeleton em-skeleton-circle em-skeleton-shimmer"></div>
        <div class="flex-1">
          <div class="em-skeleton em-skeleton-text em-skeleton-shimmer" style="width: 60%;"></div>
          <div class="em-skeleton em-skeleton-text em-skeleton-shimmer" style="width: 40%;"></div>
        </div>
      </div>
      <div class="em-skeleton em-skeleton-card em-skeleton-shimmer"></div>
    </div>

    <!-- Pulse Skeleton Card -->
    <h3>2. Pulse Effect Card</h3>
    <div class="card">
      <div class="flex">
        <div class="em-skeleton em-skeleton-circle em-skeleton-pulse"></div>
        <div class="flex-1">
          <div class="em-skeleton em-skeleton-text em-skeleton-pulse" style="width: 70%;"></div>
          <div class="em-skeleton em-skeleton-text em-skeleton-pulse" style="width: 30%;"></div>
        </div>
      </div>
      <div class="em-skeleton em-skeleton-card em-skeleton-pulse"></div>
    </div>
  </div>
</body>
</html>
