<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Firework Burst Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="night">
    <div class="burst" id="burst" aria-hidden="true"></div>
    <button class="launch" id="launch" type="button">Launch</button>
    <p class="hint">A burst of sparks radiates outward and fades like a sky firework.</p>
  </main>
  <script>
    const burst = document.getElementById("burst");
    const launch = document.getElementById("launch");
    function fire() {
      burst.classList.remove("go");
      void burst.offsetWidth;
      burst.classList.add("go");
      for (let i = 0; i < 12; i++) {
        const s = document.createElement("span");
        s.className = "spark";
        s.style.setProperty("--a", i * 30 + "deg");
        burst.appendChild(s);
        void s.offsetWidth;
        s.classList.add("go");
        s.addEventListener("animationend", function () {
          s.remove();
        });
      }
    }
    launch.addEventListener("click", fire);
  </script>
</body>
</html>
