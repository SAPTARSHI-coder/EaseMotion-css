<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Floating Action Button | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="demo-header">
    <h1>Floating Action Button (FAB)</h1>
    <p>Expandable speed dial quick actions menu with smooth CSS motion transitions.</p>
  </header>

  <main class="demo-main">
    <section class="demo-section">
      <h2>Interactive Speed Dial Demo</h2>
      <p>Click or hover the floating plus (+) button at the bottom right corner of the screen to expand quick actions.</p>
    </section>
  </main>

  <div class="ease-fab-container">
    <div class="ease-fab-actions">
      <button class="ease-fab-action" aria-label="New Document">
        <span class="ease-fab-icon">&#128196;</span>
        <span class="ease-fab-tooltip">New Document</span>
      </button>
      <button class="ease-fab-action" aria-label="Upload File">
        <span class="ease-fab-icon">&#128228;</span>
        <span class="ease-fab-tooltip">Upload File</span>
      </button>
      <button class="ease-fab-action" aria-label="Share Link">
        <span class="ease-fab-icon">&#128279;</span>
        <span class="ease-fab-tooltip">Share Link</span>
      </button>
    </div>
    <button class="ease-fab-main" id="fabBtn" aria-label="Quick Actions">
      <span class="ease-fab-main-icon">+</span>
    </button>
  </div>

  <footer class="demo-footer">
    <p>EaseMotion CSS Project</p>
  </footer>

  <script>
    const fabContainer = document.querySelector('.ease-fab-container');
    const fabBtn = document.getElementById('fabBtn');
    fabBtn.addEventListener('click', () => {
      fabContainer.classList.toggle('ease-fab-open');
    });
  </script>
</body>
</html>
