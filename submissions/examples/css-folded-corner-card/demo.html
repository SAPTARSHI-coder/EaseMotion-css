<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Folded Corner Card - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="em-fold-page">
        <div class="em-folded-card" tabindex="0" role="region" aria-label="Folded Corner Note Card">
            <div class="em-card-corner"></div>
            <header class="em-card-header">
                <span class="em-card-badge">NOTEBOOK EDIT</span>
                <h1 class="em-card-title">Folded Corner Card</h1>
            </header>
            <div class="em-card-body">
                <p>This document showcases a realistic folded corner effect crafted entirely using CSS pseudo-elements, gradients, and geometric transforms.</p>
            </div>
            <footer class="em-card-footer">
                <span class="em-footer-tag">Pure CSS Component</span>
            </footer>
        </div>
    </div>
</body>
</html>
