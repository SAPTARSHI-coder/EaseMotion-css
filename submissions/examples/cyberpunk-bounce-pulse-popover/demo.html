<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Bounce-Pulse Popover - Cyberpunk</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="cyberpunk-layout">
        
        <h1 class="neon-text">SYSTEM.DIAGNOSTICS</h1>
        
        <p class="subtitle">Hover over the modules below to inspect status.</p>
        
        <div class="module-grid">
            
            <!-- Module 1 -->
            <div class="module-node">
                <div class="node-core">
                    <span class="icon">NET</span>
                </div>
                <!-- The Popover -->
                <div class="popover">
                    <div class="popover-header">NETWORK UPLINK</div>
                    <div class="popover-body">
                        Ping: 12ms<br>
                        Bandwidth: 1.2Tbps<br>
                        Status: <span class="status-ok">OPTIMAL</span>
                    </div>
                </div>
            </div>
            
            <!-- Module 2 -->
            <div class="module-node warning-node">
                <div class="node-core">
                    <span class="icon">CPU</span>
                </div>
                <!-- The Popover -->
                <div class="popover popover-warning">
                    <div class="popover-header">CORE PROCESSOR</div>
                    <div class="popover-body">
                        Temp: 98°C<br>
                        Load: 99.9%<br>
                        Status: <span class="status-warn">CRITICAL</span>
                    </div>
                </div>
            </div>
            
            <!-- Module 3 -->
            <div class="module-node">
                <div class="node-core">
                    <span class="icon">MEM</span>
                </div>
                <!-- The Popover -->
                <div class="popover">
                    <div class="popover-header">QUANTUM RAM</div>
                    <div class="popover-body">
                        Usage: 45PB / 128PB<br>
                        Integrity: 100%<br>
                        Status: <span class="status-ok">STABLE</span>
                    </div>
                </div>
            </div>

        </div>
        
    </div>
</body>
</html>
