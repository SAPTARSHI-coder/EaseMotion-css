<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rainbow Fish · Shimmering Rainbow Colors</title>
    <meta name="description" content="Mesmerizing rainbow fish swimming with shimmering iridescent colors, dynamic rainbow gradients, and graceful underwater movements.">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1 class="title">🌈 RAINBOW FISH</h1>
        
        <div class="canvas-wrapper">
            <canvas id="fishCanvas" width="600" height="450"></canvas>
            <div class="glow-overlay"></div>
        </div>

        <div class="controls">
            <button class="toggle-btn" id="toggleBtn">⏸️ PAUSE</button>
            <button class="reset-btn" id="resetBtn">⟳ RESET</button>
            <div class="speed-control">
                <label>Speed</label>
                <input type="range" id="speedSlider" min="1" max="10" value="5">
                <span id="speedLabel">5</span>
            </div>
        </div>

        <div class="info">
            <span>🌈 RAINBOW FISH</span>
            <small>shimmer · iridescent · graceful</small>
        </div>
        <div class="hint">
            <span>🐟 fish shimmer with rainbow colors as they swim</span>
        </div>
    </div>

    <script>
        (function() {
            const canvas = document.getElementById('fishCanvas');
            const ctx = canvas.getContext('2d');
            const W = 600, H = 450;
            
            const toggleBtn = document.getElementById('toggleBtn');
            const resetBtn = document.getElementById('resetBtn');
            const speedSlider = document.getElementById('speedSlider');
            const speedLabel = document.getElementById('speedLabel');

            let isAnimating = true;
            let speed = 5;
            let time = 0;

            // ---- Rainbow Color Generator ----
            function getRainbowColor(offset, saturation, lightness) {
                const hue = (offset * 360 + time * 20) % 360;
                return `hsl(${hue}, ${saturation || 80}%, ${lightness || 60}%)`;
            }

            function getRainbowGradient(offset1, offset2) {
                const h1 = (offset1 * 360 + time * 20) % 360;
                const h2 = (offset2 * 360 + time * 20) % 360;
                return { h1, h2 };
            }

            // ---- Fish Class ----
            class RainbowFish {
                constructor(x, y) {
                    this.x = x || Math.random() * W;
                    this.y = y || Math.random() * H;
                    this.size = 20 + Math.random() * 25;
                    this.speed = 0.5 + Math.random() * 1.5;
                    this.angle = Math.random() * Math.PI * 2;
                    this.phase = Math.random() * Math.PI * 2;
                    this.tailWag = 0;
                    this.colorOffset = Math.random();
                    
                    // Movement pattern
                    this.patternRadius = 50 + Math.random() * 100;
                    this.patternSpeed = 0.005 + Math.random() * 0.01;
                    this.patternAngle = Math.random() * Math.PI * 2;
                    
                    // Shimmer
                    this.shimmerSpeed = 0.02 + Math.random() * 0.03;
                    this.shimmerPhase = Math.random() * Math.PI * 2;
                }

                update() {
                    const dt = speed / 5;
                    time += 0.01 * dt;
                    
                    // Movement - figure eight or circular pattern
                    this.patternAngle += this.patternSpeed * dt;
                    const targetX = W/2 + Math.cos(this.patternAngle) * this.patternRadius;
                    const targetY = H/2 + Math.sin(this.patternAngle * 0.6) * this.patternRadius * 0.6;
                    
                    // Move toward target
                    const dx = targetX - this.x;
                    const dy = targetY - this.y;
                    const dist = Math.sqrt(dx*dx + dy*dy);
                    if (dist > 1) {
                        const moveSpeed = this.speed * 0.02 * dt;
                        this.x += (dx / dist) * moveSpeed * 10;
                        this.y += (dy / dist) * moveSpeed * 10;
                        this.angle = Math.atan2(dy, dx);
                    }
                    
                    // Tail wag
                    this.tailWag = Math.sin(time * 0.05 * dt + this.phase) * 0.3;
                    
                    // Shimmer
                    this.shimmerPhase += this.shimmerSpeed * dt;
                    
                    // Keep in bounds with gentle bounce
                    const margin = 30;
                    if (this.x < margin) this.x = margin;
                    if (this.x > W - margin) this.x = W - margin;
                    if (this.y < margin) this.y = margin;
                    if (this.y > H - margin) this.y = H - margin;
                }

                draw(ctx) {
                    ctx.save();
                    ctx.translate(this.x, this.y);
                    ctx.rotate(this.angle);
                    
                    const size = this.size;
                    const shimmer = 0.5 + Math.sin(this.shimmerPhase) * 0.5;
                    
                    // ---- Glow ----
                    const glowGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, size * 2);
                    const glowColor = getRainbowColor(this.colorOffset + 0.5, 70, 50);
                    glowGrad.addColorStop(0, glowColor + '30');
                    glowGrad.addColorStop(0.5, glowColor + '10');
                    glowGrad.addColorStop(1, 'rgba(0,0,0,0)');
                    ctx.fillStyle = glowGrad;
                    ctx.beginPath();
                    ctx.arc(0, 0, size * 2, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // ---- Body ----
                    const bodyGrad = ctx.createLinearGradient(-size, -size/2, size, size/2);
                    const c1 = getRainbowColor(this.colorOffset + shimmer * 0.2, 90, 70);
                    const c2 = getRainbowColor(this.colorOffset + 0.3 + shimmer * 0.2, 80, 50);
                    const c3 = getRainbowColor(this.colorOffset + 0.6 + shimmer * 0.2, 70, 40);
                    bodyGrad.addColorStop(0, c1);
                    bodyGrad.addColorStop(0.5, c2);
                    bodyGrad.addColorStop(1, c3);
                    
                    ctx.shadowColor = c2;
                    ctx.shadowBlur = 20;
                    ctx.fillStyle = bodyGrad;
                    ctx.beginPath();
                    ctx.ellipse(0, 0, size, size * 0.6, 0, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // ---- Scales shimmer ----
                    for (let i = 0; i < 8; i++) {
                        const t = (i + 1) / 9;
                        const sx = -size * 0.6 + t * size * 1.2;
                        const sy = Math.sin(t * Math.PI * 2 + this.tailWag) * size * 0.2;
                        const scaleSize = size * 0.15 * (1 - t * 0.3);
                        const scaleColor = getRainbowColor(
                            this.colorOffset + t * 0.5 + shimmer * 0.3,
                            100,
                            70 + Math.sin(time * 0.03 + i + this.shimmerPhase) * 10
                        );
                        ctx.shadowBlur = 10;
                        ctx.shadowColor = scaleColor;
                        ctx.fillStyle = scaleColor;
                        ctx.globalAlpha = 0.4 + Math.sin(time * 0.04 + i * 1.5 + this.shimmerPhase) * 0.2;
                        ctx.beginPath();
                        ctx.arc(sx, sy, scaleSize, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    ctx.globalAlpha = 1;
                    
                    // ---- Eye ----
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.arc(size * 0.35, -size * 0.05, size * 0.15, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#1a1a2e';
                    ctx.beginPath();
                    ctx.arc(size * 0.4, -size * 0.02, size * 0.08, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.arc(size * 0.42, -size * 0.04, size * 0.03, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // ---- Tail ----
                    const tailWag = this.tailWag;
                    ctx.shadowColor = c2;
                    ctx.shadowBlur = 15;
                    ctx.fillStyle = c2;
                    ctx.beginPath();
                    ctx.moveTo(-size * 0.9, 0);
                    ctx.quadraticCurveTo(
                        -size * 0.7,
                        -size * 0.6 + tailWag * size * 0.3,
                        -size * 1.2,
                        -size * 0.5 + tailWag * size * 0.4
                    );
                    ctx.quadraticCurveTo(
                        -size * 0.9,
                        -size * 0.1 + tailWag * size * 0.1,
                        -size * 0.9,
                        0
                    );
                    ctx.fill();
                    
                    ctx.beginPath();
                    ctx.moveTo(-size * 0.9, 0);
                    ctx.quadraticCurveTo(
                        -size * 0.7,
                        size * 0.6 + tailWag * size * 0.3,
                        -size * 1.2,
                        size * 0.5 + tailWag * size * 0.4
                    );
                    ctx.quadraticCurveTo(
                        -size * 0.9,
                        size * 0.1 + tailWag * size * 0.1,
                        -size * 0.9,
                        0
                    );
                    ctx.fill();
                    
                    // ---- Dorsal fin ----
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = c1;
                    ctx.fillStyle = c1;
                    ctx.globalAlpha = 0.6 + Math.sin(time * 0.04 + this.shimmerPhase) * 0.2;
                    ctx.beginPath();
                    ctx.moveTo(size * 0.1, -size * 0.5);
                    ctx.quadraticCurveTo(
                        size * 0.3,
                        -size * 0.9,
                        -size * 0.1,
                        -size * 0.6
                    );
                    ctx.fill();
                    ctx.globalAlpha = 1;
                    
                    // ---- Pectoral fin ----
                    ctx.shadowBlur = 5;
                    ctx.shadowColor = c3;
                    ctx.fillStyle = c3;
                    ctx.globalAlpha = 0.5;
                    ctx.beginPath();
                    ctx.ellipse(
                        size * 0.2,
                        size * 0.4,
                        size * 0.15,
                        size * 0.1,
                        -0.3 + Math.sin(time * 0.03 + this.shimmerPhase) * 0.1,
                        0,
                        Math.PI * 2
                    );
                    ctx.fill();
                    ctx.globalAlpha = 1;
                    
                    ctx.restore();
                }
            }

            // ---- Create Fish ----
            let fish = [];
            const numFish = 6;

            function createFish() {
                fish = [];
                for (let i = 0; i < numFish; i++) {
                    const angle = (i / numFish) * Math.PI * 2;
                    const radius = 80 + Math.random() * 80;
                    const x = W/2 + Math.cos(angle) * radius;
                    const y = H/2 + Math.sin(angle) * radius * 0.6;
                    const f = new RainbowFish(x, y);
                    f.patternRadius = 60 + Math.random() * 100;
                    f.patternSpeed = 0.005 + Math.random() * 0.015;
                    f.colorOffset = i / numFish;
                    f.size = 18 + Math.random() * 25;
                    fish.push(f);
                }
            }

            // ---- Draw Background ----
            function drawBackground() {
                // Deep underwater gradient
                const gradient = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, W);
                gradient.addColorStop(0, '#0d2137');
                gradient.addColorStop(0.3, '#0a1a2a');
                gradient.addColorStop(0.6, '#0a1628');
                gradient.addColorStop(0.8, '#0d1a25');
                gradient.addColorStop(1, '#050a12');
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, W, H);
                
                // Light rays from above
                for (let i = 0; i < 6; i++) {
                    const x = 50 + i * 100 + Math.sin(time * 0.005 + i * 1.5) * 30;
                    const gradient2 = ctx.createLinearGradient(x, 0, x + 20, H);
                    gradient2.addColorStop(0, `rgba(100, 200, 255, ${0.02 + Math.sin(time * 0.01 + i) * 0.01})`);
                    gradient2.addColorStop(0.5, `rgba(100, 200, 255, ${0.01})`);
                    gradient2.addColorStop(1, 'rgba(100, 200, 255, 0)');
                    ctx.fillStyle = gradient2;
                    ctx.fillRect(x, 0, 20, H);
                }
                
                // Ambient bubbles
                for (let i = 0; i < 25; i++) {
                    const x = (i * 173 + 30) % W;
                    const y = (i * 97 + time * (0.1 + i * 0.005) * 5) % H;
                    const size = 1 + (i % 4) * 0.5;
                    const alpha = 0.02 + Math.sin(time * 0.01 + i * 2) * 0.015;
                    ctx.fillStyle = `rgba(150, 220, 255, ${alpha})`;
                    ctx.beginPath();
                    ctx.arc(x, y, size, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // ---- Animation Loop ----
            function animate() {
                if (!isAnimating) {
                    requestAnimationFrame(animate);
                    return;
                }
                
                drawBackground();
                
                for (let f of fish) {
                    f.update();
                    f.draw(ctx);
                }
                
                // Ambient sparkles
                for (let i = 0; i < 20; i++) {
                    const x = (i * 197 + 40) % W;
                    const y = (i * 131 + time * (0.02 + i * 0.005) * 4) % H;
                    const size = 0.5 + Math.sin(time * 0.02 + i * 3) * 0.5 + 0.5;
                    const hue = (i * 30 + time * 20) % 360;
                    ctx.fillStyle = `hsla(${hue}, 80%, 70%, ${0.01 + Math.sin(time * 0.015 + i) * 0.008})`;
                    ctx.beginPath();
                    ctx.arc(x, y, size, 0, Math.PI * 2);
                    ctx.fill();
                }
                
                requestAnimationFrame(animate);
            }

            // ---- Toggle Animation ----
            function toggleAnimation() {
                isAnimating = !isAnimating;
                toggleBtn.textContent = isAnimating ? '⏸️ PAUSE' : '▶️ PLAY';
            }

            // ---- Reset ----
            function resetFish() {
                createFish();
                time = 0;
            }

            // ---- Speed Control ----
            speedSlider.addEventListener('input', function() {
                speed = parseInt(this.value);
                speedLabel.textContent = speed;
            });

            // ---- Event Listeners ----
            toggleBtn.addEventListener('click', toggleAnimation);
            resetBtn.addEventListener('click', resetFish);

            // ---- Keyboard Shortcuts ----
            document.addEventListener('keydown', function(e) {
                if (e.key === ' ' || e.key === 'Space') {
                    e.preventDefault();
                    toggleAnimation();
                }
                if (e.key === 'r' || e.key === 'R') {
                    resetFish();
                }
            });

            // ---- Initialize ----
            createFish();
            animate();

            console.log('🌈 Rainbow Fish · Press Space to pause · R to reset');
        })();
    </script>
</body>
</html>
