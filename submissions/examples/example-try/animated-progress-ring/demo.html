<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Progress Ring | EaseMotion-css</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="progress-wrapper">
        <svg class="progress-ring" width="200" height="200">
            <defs>
                <!-- Modern neon gradient configuration -->
                <linearGradient id="ring-gradient" x1="0%" y1="100%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#ff7eb3" />
                    <stop offset="100%" stop-color="#7afcff" />
                </linearGradient>
            </defs>
            
            <!-- Track layer -->
            <circle class="progress-ring__track" cx="100" cy="100" r="80" />
            
            <!-- Animated fill layer -->
            <circle class="progress-ring__fill" cx="100" cy="100" r="80" />
        </svg>
        
        <!-- Center label -->
        <div class="progress-text">0%</div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const textDisplay = document.querySelector('.progress-text');
            const targetPercent = 75; // Adjust your maximum progress here
            const duration = 2000;    // Matches the 2s CSS animation exactly
            
            let startTime = null;

            // Smooth ease-out function for the text counter
            function easeOutCubic(t) {
                return 1 - Math.pow(1 - t, 3);
            }

            function updateCounter(timestamp) {
                if (!startTime) startTime = timestamp;
                const elapsed = timestamp - startTime;
                const progress = Math.min(elapsed / duration, 1);

                // Apply easing to match the visual stroke transition
                const currentVal = Math.floor(easeOutCubic(progress) * targetPercent);
                textDisplay.textContent = `${currentVal}%`;

                if (progress < 1) {
                    requestAnimationFrame(updateCounter);
                }
            }

            // Kick off counter matching the standard animation delay
            setTimeout(() => {
                requestAnimationFrame(updateCounter);
            }, 200);
        });
    </script>
</body>
</html>
