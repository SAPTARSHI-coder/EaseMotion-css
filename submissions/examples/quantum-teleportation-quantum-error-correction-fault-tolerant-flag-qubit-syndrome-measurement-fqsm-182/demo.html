<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fault Tolerant Flag Qubit Syndrome Measurement FQSM - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css"></head><body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030712; color: #ffffff;">

    <div class="ease-card ease-card-glass fqsm-container">
        <div class="fqsm-header">
            <h2>Flag Qubit Measurement</h2>
            <span class="ease-badge ease-badge-warning">Fault-Tolerant Quantum</span>
        </div>
        
        <div class="fqsm-screen ease-center">
            <div class="fqsm-flux flux-fqsm-a"></div>
            <div class="fqsm-flux flux-fqsm-b"></div>
            <div class="fqsm-boundary-ring"></div>
            <div class="fqsm-core ease-center"></div>
        </div>

        <div class="fqsm-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Auxiliary Flag Circuits &amp; Fault Isolation</span>
            <button class="ease-btn ease-btn-warning ease-btn-sm ease-hover-grow">Run Flag Measurement</button>
        </div>
    </div></body></html>
