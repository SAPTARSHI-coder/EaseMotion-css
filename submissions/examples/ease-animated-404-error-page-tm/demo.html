<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="e404-page">
    <div class="e404-orb e404-orb-1"></div>
    <div class="e404-orb e404-orb-2"></div>

    <h1 class="e404-number">404</h1>

    <div class="e404-message">
      <h2 class="e404-heading">Oops! Lost in space</h2>
      <p class="e404-subheading">
        The page you are looking for does not exist or has been moved.
        Our team has been notified. Let us guide you back to safety.
      </p>
    </div>

    <div class="e404-actions">
      <a href="#" class="e404-btn e404-btn-primary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        Go Home
      </a>
      <a href="#" class="e404-btn e404-btn-ghost">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/>
          <line x1="12" y1="17" x2="12.01" y2="17"/>
        </svg>
        View Docs
      </a>
      <a href="#" class="e404-btn e404-btn-ghost">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
        Contact Support
      </a>
    </div>

    <div class="e404-dots">
      <div class="e404-dot"></div>
      <div class="e404-dot"></div>
      <div class="e404-dot"></div>
    </div>
  </div>

</body>
</html>
