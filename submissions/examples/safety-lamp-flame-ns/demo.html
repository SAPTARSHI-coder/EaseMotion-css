<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Safety Lamp Flame — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Safety Lamp Flame demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Safety Lamp Flame</h1>
      <p class="lede">Safety lamp flame testing firedamp</p>
    </header>

    <section class="ease-safety-lamp-flame" data-demo="safety-lamp-flame" aria-live="polite">
      <div class="ease-safety-lamp-flame__housing">
        <div class="ease-safety-lamp-flame__bezel">
          <div class="ease-safety-lamp-flame__face">
            <div class="ease-safety-lamp-flame__readout">
              <span class="ease-safety-lamp-flame__label">Safety Lamp Flame</span>
              <span class="ease-safety-lamp-flame__value">LIVE</span>
            </div>
            <div class="ease-safety-lamp-flame__motion" aria-hidden="true">
              <span class="ease-safety-lamp-flame__a"></span>
              <span class="ease-safety-lamp-flame__b"></span>
              <span class="ease-safety-lamp-flame__c"></span>
              <span class="ease-safety-lamp-flame__d"></span>
            </div>
            <div class="ease-safety-lamp-flame__meters">
              <i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-safety-lamp-flame__controls">
          <button type="button" class="ease-safety-lamp-flame__btn primary">Test</button>
          <button type="button" class="ease-safety-lamp-flame__btn">Cap</button>
          <label class="ease-safety-lamp-flame__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-safety-lamp-flame__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
