<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ease Text Disintegration Particle Explosion</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="ease-dis-body">
  <div class="ease-dis-wrapper">
    <h1 class="ease-dis-text" id="targetText">DISINTEGRATE</h1>
    <button id="disBtn" class="ease-dis-btn">Explode Text 💥</button>
  </div>

  <script>
    const btn = document.getElementById('disBtn');
    const text = document.getElementById('targetText');

    btn.addEventListener('click', () => {
      text.classList.add('exploding');
      setTimeout(() => text.classList.remove('exploding'), 1200);
    });
  </script>
</body>
</html>
