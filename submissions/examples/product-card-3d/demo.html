<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Card 3D &mdash; EaseMotion CSS Demo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="page-head">
    <p class="kicker">EaseMotion CSS &middot; E-commerce</p>
    <h1>Product Card 3D</h1>
    <p class="sub">A product tile that tilts in 3D and reveals its action the moment you hover.</p>
  </header>
  <main class="stage">
    <div class="pc-card">
      <div class="pc-media">
        &#127871;
        <span class="pc-badge">-20%</span>
      </div>
      <div class="pc-body">
        <h3>Aurora Sneaker</h3>
        <div class="pc-rating">&#9733;&#9733;&#9733;&#9733;&#9734;</div>
        <div class="pc-price">$79 <s>$99</s></div>
        <button class="pc-add">Add to Cart</button>
      </div>
    </div>
  </main>
  <p class="stage-caption">Hover the card to tilt it and slide the Add to Cart button up.</p>
  <footer class="page-foot">
    <span>Pure CSS &middot; zero dependencies</span>
    <span>3D tilt reveal</span>
  </footer>
</body>
</html>
