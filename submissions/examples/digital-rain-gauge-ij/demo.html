<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-digital-rain-gauge</title>
</head>
<body>
<main class="drg-card">
  <header class="drg-head">
    <h1 class="drg-title">Rain Gauge</h1>
    <span class="drg-mode">Digital</span>
  </header>
  <section class="drg-tube" aria-label="rain tube">
    <div class="drg-water"></div>
    <span class="drg-scale drg-s-0">0</span>
    <span class="drg-scale drg-s-20">20</span>
    <span class="drg-scale drg-s-40">40</span>
    <span class="drg-scale drg-s-60">60</span>
    <span class="drg-scale drg-s-80">80</span>
    <span class="drg-drop"></span>
  </section>
  <div class="drg-readout">
    <strong class="drg-mm">48</strong>
    <span class="drg-unit">mm today</span>
  </div>
  <section class="drg-chart" aria-label="recent rainfall">
    <span class="drg-bar drg-bar-1"></span>
    <span class="drg-bar drg-bar-2"></span>
    <span class="drg-bar drg-bar-3"></span>
    <span class="drg-bar drg-bar-4"></span>
    <span class="drg-bar drg-bar-5"></span>
    <span class="drg-bar drg-bar-6"></span>
    <span class="drg-bar drg-bar-7"></span>
  </section>
  <footer class="drg-foot">
    <span class="drg-total">This week: 148mm</span>
  </footer>
</main>
</body>
</html>
