<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masonry Gallery - Mobile First</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="gallery-header">
        <h1>Discover.</h1>
        <p>A compact, mobile-first masonry experience.</p>
    </header>

    <main class="masonry-gallery">
        <div class="masonry-item">
            <img src="https://images.unsplash.com/photo-1682687220742-aba13b6e50ba?q=80&w=2940&auto=format&fit=crop" alt="Gallery Image 1">
            <div class="overlay">
                <span class="overlay-text">Nature</span>
            </div>
        </div>
        <div class="masonry-item">
            <img src="https://images.unsplash.com/photo-1707343843437-caacff5cfa74?q=80&w=2875&auto=format&fit=crop" alt="Gallery Image 2">
            <div class="overlay">
                <span class="overlay-text">Architecture</span>
            </div>
        </div>
        <div class="masonry-item">
            <img src="https://images.unsplash.com/photo-1682687982501-1e5898cb8e4b?q=80&w=2940&auto=format&fit=crop" alt="Gallery Image 3">
            <div class="overlay">
                <span class="overlay-text">Landscape</span>
            </div>
        </div>
        <div class="masonry-item">
            <img src="https://images.unsplash.com/photo-1682687221038-404cb8830901?q=80&w=2940&auto=format&fit=crop" alt="Gallery Image 4">
            <div class="overlay">
                <span class="overlay-text">Ocean</span>
            </div>
        </div>
        <div class="masonry-item">
            <img src="https://images.unsplash.com/photo-1682695796954-bad0d0f59ff1?q=80&w=2940&auto=format&fit=crop" alt="Gallery Image 5">
            <div class="overlay">
                <span class="overlay-text">Desert</span>
            </div>
        </div>
        <div class="masonry-item">
            <img src="https://images.unsplash.com/photo-1682687981974-c5ef2111640c?q=80&w=2941&auto=format&fit=crop" alt="Gallery Image 6">
            <div class="overlay">
                <span class="overlay-text">Mountains</span>
            </div>
        </div>
        <div class="masonry-item">
            <img src="https://images.unsplash.com/photo-1682687220063-4742bd7fd538?q=80&w=2940&auto=format&fit=crop" alt="Gallery Image 7">
            <div class="overlay">
                <span class="overlay-text">Canyon</span>
            </div>
        </div>
        <div class="masonry-item">
            <img src="https://images.unsplash.com/photo-1682695797221-8164ff1fafc9?q=80&w=2940&auto=format&fit=crop" alt="Gallery Image 8">
            <div class="overlay">
                <span class="overlay-text">Forest</span>
            </div>
        </div>
    </main>
</body>
</html>
