<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rotate-Fade Tooltip - Fintech Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="dashboard">

    <h1>Fintech Dashboard</h1>

    <p class="subtitle">
        Hover over the insight cards to reveal additional financial details.
    </p>

    <div class="cards">

        <div class="card">
            <h2>Portfolio</h2>
            <p>$128,450</p>

            <div class="tooltip">
                Diversified portfolio with 12% annual growth.
            </div>
        </div>

        <div class="card">
            <h2>Revenue</h2>
            <p>$84,300</p>

            <div class="tooltip">
                Quarterly revenue increased by 8.4%.
            </div>
        </div>

        <div class="card">
            <h2>Risk Score</h2>
            <p>Low</p>

            <div class="tooltip">
                Balanced asset allocation keeps portfolio risk low.
            </div>
        </div>

    </div>

</div>

</body>
</html>
