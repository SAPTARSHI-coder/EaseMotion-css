<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glassmorphism Alert Box</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="wrapper">

<div class="alert success" role="alert" aria-live="polite">
<div class="icon">✓</div>

<div class="content">
<h2>Success</h2>
<p>Your changes have been saved successfully.</p>
</div>

<button class="close" aria-label="Close Alert">×</button>
</div>

<div class="alert warning" role="alert">
<div class="icon">!</div>

<div class="content">
<h2>Warning</h2>
<p>Please review your information before continuing.</p>
</div>

<button class="close" aria-label="Close Alert">×</button>
</div>

<div class="alert error" role="alert">
<div class="icon">✕</div>

<div class="content">
<h2>Error</h2>
<p>Something went wrong while processing your request.</p>
</div>

<button class="close" aria-label="Close Alert">×</button>
</div>

</div>

</body>
</html>
