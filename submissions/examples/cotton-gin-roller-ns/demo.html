<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cotton Gin Roller — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Cotton Gin Roller demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Cotton Gin Roller</h1>
      <p class="lede">Cotton gin rollers separating fiber from seed</p>
    </header>

    <section class="ease-cotton-gin-roller" data-demo="cotton-gin-roller" aria-live="polite">
      <div class="ease-cotton-gin-roller__housing">
        <div class="ease-cotton-gin-roller__bezel">
          <div class="ease-cotton-gin-roller__face">
            <div class="ease-cotton-gin-roller__readout">
              <span class="ease-cotton-gin-roller__label">Cotton Gin Roller</span>
              <span class="ease-cotton-gin-roller__value">LIVE</span>
            </div>
            <div class="ease-cotton-gin-roller__motion" aria-hidden="true">
              <span class="ease-cotton-gin-roller__a"></span>
              <span class="ease-cotton-gin-roller__b"></span>
              <span class="ease-cotton-gin-roller__c"></span>
              <span class="ease-cotton-gin-roller__d"></span>
            </div>
            <div class="ease-cotton-gin-roller__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-cotton-gin-roller__controls">
          <button type="button" class="ease-cotton-gin-roller__btn primary">Engage</button>
          <button type="button" class="ease-cotton-gin-roller__btn">Reset</button>
          <label class="ease-cotton-gin-roller__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-cotton-gin-roller__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
