<!-- EaseMotion component: speedometer-gauge -->
<!DOCTYPE html>
<html lang="en" data-gaug="speed">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ease Speedometer Gauge</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="speedo-panel">
  <div class="speedo-gauge">
    <div class="gauge-rim">
      <span class="g-num g0">0</span>
      <span class="g-num g40">40</span>
      <span class="g-num g80">80</span>
      <span class="g-num g120">120</span>
      <i class="g-tick tk1"></i>
      <i class="g-tick tk2"></i>
      <i class="g-tick tk3"></i>
      <i class="g-tick tk4"></i>
      <i class="g-tick tk5"></i>
      <i class="g-tick tk6"></i>
      <i class="g-tick tk7"></i>
      <div class="g-needle"></div>
      <div class="g-hub"></div>
    </div>
    <div class="spd-read">
      <span class="spd-value">72</span>
      <span class="spd-unit">MPH</span>
    </div>
  </div>
  <p class="speedo-caption">CURRENT SPEED</p>
</main>
</body>
</html>
