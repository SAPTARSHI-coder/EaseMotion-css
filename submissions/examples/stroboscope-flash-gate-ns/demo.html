<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stroboscope Flash Gate — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Stroboscope Flash Gate demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Stroboscope Flash Gate</h1>
      <p class="lede">Stroboscope flash gate freezing rotating marks</p>
    </header>

    <section class="ease-stroboscope-flash-gate" data-demo="stroboscope-flash-gate" aria-live="polite">
      <div class="ease-stroboscope-flash-gate__housing">
        <div class="ease-stroboscope-flash-gate__bezel">
          <div class="ease-stroboscope-flash-gate__face">
            <div class="ease-stroboscope-flash-gate__readout">
              <span class="ease-stroboscope-flash-gate__label">Stroboscope Flash Gate</span>
              <span class="ease-stroboscope-flash-gate__value">LIVE</span>
            </div>
            <div class="ease-stroboscope-flash-gate__motion" aria-hidden="true">
              <span class="ease-stroboscope-flash-gate__a"></span>
              <span class="ease-stroboscope-flash-gate__b"></span>
              <span class="ease-stroboscope-flash-gate__c"></span>
              <span class="ease-stroboscope-flash-gate__d"></span>
            </div>
            <div class="ease-stroboscope-flash-gate__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-stroboscope-flash-gate__controls">
          <button type="button" class="ease-stroboscope-flash-gate__btn primary">Engage</button>
          <button type="button" class="ease-stroboscope-flash-gate__btn">Reset</button>
          <label class="ease-stroboscope-flash-gate__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-stroboscope-flash-gate__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
