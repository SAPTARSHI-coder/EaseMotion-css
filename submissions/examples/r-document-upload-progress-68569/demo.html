<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CSS document upload progress component.">
  <title>CSS Document Upload Progress</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="upload-card" aria-labelledby="upload-title">

    <header>
      <span class="eyebrow">File manager</span>
      <h1 id="upload-title">Uploading documents</h1>
    </header>

    <ul class="files">

      <li class="file">
        <div class="file-icon" aria-hidden="true">PDF</div>

        <div class="file-info">
          <strong>project-report.pdf</strong>
          <span>2.4 MB · 82%</span>

          <div
            class="progress"
            role="progressbar"
            aria-label="project-report.pdf upload progress"
            aria-valuenow="82"
            aria-valuemin="0"
            aria-valuemax="100"
          >
            <span style="--progress: 82%"></span>
          </div>
        </div>

        <b>82%</b>
      </li>

      <li class="file">
        <div class="file-icon doc" aria-hidden="true">DOC</div>

        <div class="file-info">
          <strong>design-notes.docx</strong>
          <span>1.8 MB · 46%</span>

          <div
            class="progress"
            role="progressbar"
            aria-label="design-notes.docx upload progress"
            aria-valuenow="46"
            aria-valuemin="0"
            aria-valuemax="100"
          >
            <span style="--progress: 46%"></span>
          </div>
        </div>

        <b>46%</b>
      </li>

    </ul>

  </main>

</body>
</html>
