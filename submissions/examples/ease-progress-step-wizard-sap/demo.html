<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ease-progress-step-wizard-sap demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { height: 100vh; margin: 0; display: flex; flex-direction: column; gap: 20px; align-items: center; justify-content: center; background: #f4f4f5; font-family: system-ui, sans-serif; }
    button { padding: 10px 18px; border-radius: 8px; border: none; background: #111; color: #fff; cursor: pointer; }
  </style>
</head>
<body>
  <div class="step-wizard-sap" id="wizard">
    <div class="step-item done"><div class="step-circle">1</div></div>
    <div class="step-connector"></div>
    <div class="step-item active"><div class="step-circle">2</div></div>
    <div class="step-connector"></div>
    <div class="step-item"><div class="step-circle">3</div></div>
    <div class="step-connector"></div>
    <div class="step-item"><div class="step-circle">4</div></div>
  </div>
  <button id="nextBtn">Next Step</button>
  <script>
    const items = [...document.querySelectorAll('.step-item')];
    document.getElementById('nextBtn').addEventListener('click', () => {
      const activeIndex = items.findIndex(i => i.classList.contains('active'));
      if (activeIndex === -1 || activeIndex >= items.length - 1) return;
      items[activeIndex].classList.remove('active');
      items[activeIndex].classList.add('done');
      items[activeIndex + 1].classList.add('active');
    });
  </script>
</body>
</html>
