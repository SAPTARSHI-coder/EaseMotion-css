<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-door-lock-keypad demo</title>
</head>
<body>
<div class="dlk-app">
  <span class="dlk-title">LOCK 2</span>
  <div class="dlk-pad">
    <span class="dlk-key">1</span>
    <span class="dlk-key">2</span>
    <span class="dlk-key">3</span>
    <span class="dlk-key">4</span>
    <span class="dlk-key">5</span>
    <span class="dlk-key">6</span>
    <span class="dlk-key">7</span>
    <span class="dlk-key">8</span>
    <span class="dlk-key">9</span>
  </div>
  <span class="dlk-status">LOCKED</span>
</div>
</body>
</html>
