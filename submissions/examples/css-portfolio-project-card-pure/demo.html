<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Project Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header class="header">
            <h1 class="title">Selected Works</h1>
            <p>Hover over the card to reveal project details.</p>
        </header>

        <main class="content-area">
            
            <article class="project-card">
                <!-- Project Image Background -->
                <div class="card-image"></div>
                
                <!-- The interactive overlay that slides up on hover -->
                <div class="card-overlay">
                    
                    <div class="card-content">
                        <h2 class="project-title">E-Commerce Dashboard</h2>
                        <p class="project-description">A comprehensive analytics dashboard for online retailers, featuring real-time sales tracking, inventory management, and customer behavior insights.</p>
                        
                        <!-- Technology Tags -->
                        <div class="tech-tags">
                            <span class="tag">React</span>
                            <span class="tag">TypeScript</span>
                            <span class="tag">Node.js</span>
                            <span class="tag">PostgreSQL</span>
                        </div>
                    </div>
                    
                    <!-- Action Links (GitHub, Live Demo) -->
                    <div class="card-actions">
                        <a href="#" class="action-link" aria-label="View Source Code">
                            <!-- GitHub Icon -->
                            <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path></svg>
                            Code
                        </a>
                        <a href="#" class="action-link primary" aria-label="View Live Site">
                            <!-- External Link Icon -->
                            <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
                            Live Demo
                        </a>
                    </div>
                    
                </div>
            </article>
            
        </main>
    </div>

</body>
</html>
