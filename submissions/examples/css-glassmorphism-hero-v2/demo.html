<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Glassmorphism Hero v2 - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="em-hero-page">
        <!-- Background Glowing Orbs -->
        <div class="em-hero-orb em-orb-1" aria-hidden="true"></div>
        <div class="em-hero-orb em-orb-2" aria-hidden="true"></div>

        <div class="em-hero-container" role="region" aria-label="Glassmorphism Hero v2 Showcase" tabindex="0">
            <!-- Main Hero Glass Card -->
            <div class="em-hero-main-card">
                <span class="em-hero-badge">NEXT-GEN UI V2</span>
                <h1 class="em-hero-title">Immersive Glassmorphic Design</h1>
                <p class="em-hero-desc">An advanced hero variant featuring multiple floating glass panels, multi-layered backdrop filters, and subtle ambient lighting.</p>
                <div class="em-hero-actions">
                    <a href="#" class="em-hero-btn em-btn-primary" role="button">Get Started</a>
                    <a href="#" class="em-hero-btn em-btn-outline" role="button">Documentation</a>
                </div>
            </div>

            <!-- Floating Glass Panel 1 (Stat Card) -->
            <div class="em-floating-panel em-panel-1" aria-hidden="true">
                <span class="em-panel-number">99.9%</span>
                <span class="em-panel-label">System Performance</span>
            </div>

            <!-- Floating Glass Panel 2 (Activity Card) -->
            <div class="em-floating-panel em-panel-2" aria-hidden="true">
                <div class="em-panel-icon"></div>
                <div class="em-panel-text">
                    <span class="em-panel-title-sm">Live Sync</span>
                    <span class="em-panel-sub">Modules active</span>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
