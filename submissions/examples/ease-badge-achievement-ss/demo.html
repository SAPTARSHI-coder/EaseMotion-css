<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Badge Achievement Component - Play Category</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="ease-achievement-stage" aria-labelledby="stage-title">
    <div style="text-align: center;">
      <h1 id="stage-title" class="ease-badge-title">Achievement Unlocked!</h1>
      <p class="ease-badge-desc">You successfully completed the core design systems sprint.</p>
    </div>

    <!-- Badge Component -->
    <div class="ease-badge-achievement" id="achievement-badge" role="img" aria-label="Gold Star Achievement Badge">
      <span class="ease-badge-star" aria-hidden="true">★</span>
      <div class="ease-badge-ribbon">Level 5</div>
    </div>

    <button type="button" class="ease-btn-replay" id="replay-btn">Replay Animation</button>
  </main>

  <script>
    const badge = document.getElementById('achievement-badge');
    const replayBtn = document.getElementById('replay-btn');

    replayBtn.addEventListener('click', () => {
      badge.classList.remove('is-animating');
      void badge.offsetWidth; // Trigger reflow
      badge.classList.add('is-animating');
    });
  </script>
</body>
</html>
