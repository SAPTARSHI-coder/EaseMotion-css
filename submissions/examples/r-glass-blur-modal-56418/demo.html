<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Glass-Blur Modal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<input type="checkbox" id="modal-toggle" hidden>

<section class="hero">

  <h1>Gaming Hub</h1>

  <p>
    Experience a futuristic Glass-Blur Modal built entirely with HTML and CSS.
  </p>

  <label for="modal-toggle" class="open-btn">
    Open Reward
  </label>

</section>

<div class="overlay">

  <div class="modal">

    <label for="modal-toggle" class="close-btn">&times;</label>

    <div class="icon">🎮</div>

    <h2>Elite Reward</h2>

    <p>
      You have unlocked an exclusive cosmetic bundle with legendary effects.
    </p>

    <label for="modal-toggle" class="action-btn">
      Claim Reward
    </label>

  </div>

</div>

</body>
</html>
