<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Velvet Smooth Transition CSS Progress Bar"
  >

  <title>Velvet Smooth Progress</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="demo">

    <section class="progress-card" aria-labelledby="progress-title">

      <div class="progress-header">
        <div>
          <p class="eyebrow">CSS PROGRESS</p>
          <h1 id="progress-title">Velvet Smooth Transition</h1>
        </div>

        <span class="progress-value" aria-hidden="true">72%</span>
      </div>

      <div class="progress-wrapper">

        <progress
          class="velvet-progress"
          value="72"
          max="100"
          aria-label="Project completion"
        >
          72%
        </progress>

        <div class="progress-glow" aria-hidden="true"></div>

      </div>

      <div class="progress-meta">
        <span>Project completion</span>
        <span>72 / 100</span>
      </div>

    </section>


    <section class="examples" aria-label="Progress examples">

      <article class="progress-item">
        <div class="item-header">
          <span>Design</span>
          <strong>35%</strong>
        </div>

        <progress
          class="velvet-progress"
          value="35"
          max="100"
          aria-label="Design progress: 35 percent"
        >
          35%
        </progress>
      </article>


      <article class="progress-item">
        <div class="item-header">
          <span>Development</span>
          <strong>65%</strong>
        </div>

        <progress
          class="velvet-progress"
          value="65"
          max="100"
          aria-label="Development progress: 65 percent"
        >
          65%
        </progress>
      </article>


      <article class="progress-item">
        <div class="item-header">
          <span>Testing</span>
          <strong>90%</strong>
        </div>

        <progress
          class="velvet-progress"
          value="90"
          max="100"
          aria-label="Testing progress: 90 percent"
        >
          90%
        </progress>
      </article>

    </section>

  </main>

</body>
</html>
