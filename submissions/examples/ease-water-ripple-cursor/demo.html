<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Water Ripple Cursor · Spreading Ripples</title>

    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <!-- === WATER RIPPLE CURSOR === -->
    <div class="ripple-container" id="rippleContainer"></div>

    <!-- === CONTENT === -->
    <div class="card">
        <h2>🌊 Water Ripple Cursor</h2>
        <p class="sub">ripples spread from cursor</p>

        <div class="cursor-demo-area">
            <p>Move your mouse around</p>
            <div class="interactive-hint">
                <i class="fas fa-mouse-pointer"></i>
                <span>Watch the ripples spread</span>
            </div>
            <div class="demo-buttons">
                <button class="demo-btn">Hover me</button>
                <button class="demo-btn">Click me</button>
                <button class="demo-btn">Ripple!</button>
            </div>
        </div>

        <p style="margin-top: 1.5rem; font-size: 0.85rem; color: #64748b;">
            Move your mouse · watch ripples spread like water
        </p>
    </div>

    <!-- Embedded JavaScript -->
    <script>
        (function() {
            'use strict';

            const container = document.getElementById('rippleContainer');
            let mouseX = 0;
            let mouseY = 0;
            let isVisible = false;

            // --- Ripple colors ---
            const rippleColors = [
                'rgba(79, 172, 254, 0.15)',
                'rgba(0, 242, 254, 0.12)',
                'rgba(67, 233, 123, 0.10)',
                'rgba(161, 140, 209, 0.12)',
                'rgba(79, 172, 254, 0.08)',
                'rgba(0, 242, 254, 0.06)'
            ];

            // --- Create a ripple ---
            function createRipple(x, y) {
                const ripple = document.createElement('div');
                ripple.className = 'water-ripple';

                // Random size
                const size = 5 + Math.random() * 15;
                ripple.style.width = size + 'px';
                ripple.style.height = size + 'px';

                // Random color
                const color = rippleColors[Math.floor(Math.random() * rippleColors.length)];
                ripple.style.borderColor = color;

                // Random opacity variation
                const opacity = 0.3 + Math.random() * 0.4;
                ripple.style.setProperty('--opacity', opacity);

                // Position
                const offsetX = (Math.random() - 0.5) * 10;
                const offsetY = (Math.random() - 0.5) * 10;
                ripple.style.left = (x + offsetX) + 'px';
                ripple.style.top = (y + offsetY) + 'px';

                // Random animation duration
                const duration = 1.0 + Math.random() * 1.2;
                ripple.style.setProperty('--duration', duration + 's');

                // Random delay
                const delay = Math.random() * 0.2;
                ripple.style.animationDelay = delay + 's';

                // Random border width
                const borderWidth = 1 + Math.random() * 2;
                ripple.style.borderWidth = borderWidth + 'px';

                container.appendChild(ripple);

                // Remove ripple after animation
                setTimeout(() => {
                    if (ripple.parentNode) {
                        ripple.remove();
                    }
                }, (duration + delay + 0.5) * 1000);
            }

            // --- Create ripple burst ---
            function createRippleBurst(x, y, count = 12) {
                for (let i = 0; i < count; i++) {
                    setTimeout(() => {
                        const ripple = document.createElement('div');
                        ripple.className = 'water-ripple';

                        const size = 8 + Math.random() * 20;
                        ripple.style.width = size + 'px';
                        ripple.style.height = size + 'px';

                        const color = rippleColors[Math.floor(Math.random() * rippleColors.length)];
                        ripple.style.borderColor = color;

                        const opacity = 0.3 + Math.random() * 0.5;
                        ripple.style.setProperty('--opacity', opacity);

                        const angle = Math.random() * 2 * Math.PI;
                        const dist = 10 + Math.random() * 30;
                        const px = x + Math.cos(angle) * dist;
                        const py = y + Math.sin(angle) * dist;
                        ripple.style.left = px + 'px';
                        ripple.style.top = py + 'px';

                        const duration = 0.8 + Math.random() * 1.4;
                        ripple.style.setProperty('--duration', duration + 's');

                        const delay = Math.random() * 0.15;
                        ripple.style.animationDelay = delay + 's';

                        const borderWidth = 1 + Math.random() * 2.5;
                        ripple.style.borderWidth = borderWidth + 'px';

                        container.appendChild(ripple);

                        setTimeout(() => {
                            if (ripple.parentNode) {
                                ripple.remove();
                            }
                        }, (duration + delay + 0.5) * 1000);
                    }, i * 30);
                }
            }

            // --- Ripple trail loop ---
            let rippleInterval = null;

            function startRipples() {
                if (rippleInterval) return;
                rippleInterval = setInterval(() => {
                    if (isVisible) {
                        for (let i = 0; i < 2; i++) {
                            createRipple(mouseX + (Math.random() - 0.5) * 15, mouseY + (Math.random() - 0.5) * 15);
                        }
                    }
                }, 60);
            }

            function stopRipples() {
                if (rippleInterval) {
                    clearInterval(rippleInterval);
                    rippleInterval = null;
                }
            }

            // --- Mouse move ---
            document.addEventListener('mousemove', function(e) {
                mouseX = e.clientX;
                mouseY = e.clientY;
                isVisible = true;
                container.style.display = 'block';
            });

            // --- Touch support ---
            document.addEventListener('touchmove', function(e) {
                e.preventDefault();
                const touch = e.touches[0];
                mouseX = touch.clientX;
                mouseY = touch.clientY;
                isVisible = true;
                container.style.display = 'block';
            }, { passive: false });

            document.addEventListener('touchstart', function(e) {
                const touch = e.touches[0];
                mouseX = touch.clientX;
                mouseY = touch.clientY;
                isVisible = true;
                container.style.display = 'block';
            });

            // --- Mouse leave ---
            document.addEventListener('mouseleave', function() {
                isVisible = false;
                container.style.display = 'none';
            });

            // --- Mouse enter ---
            document.addEventListener('mouseenter', function() {
                isVisible = true;
                container.style.display = 'block';
            });

            // --- Click burst ---
            document.addEventListener('click', function(e) {
                createRippleBurst(e.clientX, e.clientY, 20);
                console.log('🌊 Ripple burst!');
            });

            // --- Hover effects ---
            const interactiveElements = document.querySelectorAll('a, button, .demo-btn, .interactive-hint');
            interactiveElements.forEach(el => {
                el.addEventListener('mouseenter', function() {
                    const rect = this.getBoundingClientRect();
                    const cx = rect.left + rect.width / 2;
                    const cy = rect.top + rect.height / 2;
                    createRippleBurst(cx, cy, 10);
                });
            });

            // --- Start ripples ---
            startRipples();

            console.log('🌊 Water ripple cursor initialized!');

        })();
    </script>

</body>
</html>
