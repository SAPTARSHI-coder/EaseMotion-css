<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pulsar Magnetosphere Synchrotron Radiation - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030408; color: #ffffff;">

    <div class="ease-card ease-card-glass pulsar-container">
        <div class="pulsar-header">
            <h2>Pulsar Beam</h2>
            <span class="ease-badge ease-badge-warning">Beaming</span>
        </div>
        
        <div class="pulsar-screen ease-center">
            <div class="synchrotron-beam beam-1"></div>
            <div class="synchrotron-beam beam-2"></div>
            <div class="magnetospheric-ring"></div>
            <div class="neutron-star-core ease-center"></div>
        </div>

        <div class="pulsar-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Period: 33.1 ms</span>
            <button class="ease-btn ease-btn-primary ease-btn-sm ease-hover-grow">Pulse Frequency</button>
        </div>
    </div>

</body>
</html>
