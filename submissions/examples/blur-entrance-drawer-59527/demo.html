<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EaseMotion CSS - Blur-Entrance Drawer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="em-app-container">
        <!-- Drawer Toggle Checkbox -->
        <input type="checkbox" id="em-drawer-toggle" class="em-drawer-checkbox" aria-hidden="true" tabindex="-1">
        
        <!-- Navbar -->
        <header class="em-navbar">
            <div class="em-nav-content">
                <label for="em-drawer-toggle" class="em-drawer-btn" aria-label="Toggle Drawer" tabindex="0">
                    <span class="em-hamburger-line"></span>
                    <span class="em-hamburger-line"></span>
                    <span class="em-hamburger-line"></span>
                </label>
                <div class="em-brand">SaaS Platform</div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="em-main-content">
            <div class="em-hero">
                <h1>Data Analytics Dashboard</h1>
                <p>Monitor your SaaS performance with real-time insights.</p>
                
                <div class="em-metrics-grid">
                    <div class="em-metric-card">
                        <h3>Total Revenue</h3>
                        <div class="em-metric-value">$45,231</div>
                    </div>
                    <div class="em-metric-card">
                        <h3>Active Users</h3>
                        <div class="em-metric-value">12,450</div>
                    </div>
                    <div class="em-metric-card">
                        <h3>Conversion Rate</h3>
                        <div class="em-metric-value">4.2%</div>
                    </div>
                </div>
            </div>
        </main>

        <!-- Overlay -->
        <label for="em-drawer-toggle" class="em-drawer-overlay" aria-label="Close Drawer"></label>

        <!-- Drawer Menu -->
        <aside class="em-drawer">
            <div class="em-drawer-header">
                <h2>Navigation</h2>
                <label for="em-drawer-toggle" class="em-close-btn" aria-label="Close Drawer" tabindex="0">&times;</label>
            </div>
            <nav class="em-drawer-nav">
                <a href="#" class="em-nav-link active">Dashboard</a>
                <a href="#" class="em-nav-link">Analytics</a>
                <a href="#" class="em-nav-link">Reports</a>
                <a href="#" class="em-nav-link">Settings</a>
            </nav>
            <div class="em-drawer-footer">
                <div class="em-user-profile">
                    <div class="em-user-avatar"></div>
                    <div class="em-user-info">
                        <strong>Admin User</strong>
                        <span>admin@saas.com</span>
                    </div>
                </div>
            </div>
        </aside>
    </div>
</body>
</html>
