<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accessible High Contrast Modal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <button id="openModalBtn" aria-haspopup="dialog" aria-expanded="false" class="ease-btn ease-btn-primary">Open Modal</button>

    <div id="modalOverlay" class="ease-modal-overlay" aria-hidden="true" tabindex="-1">
        <div id="modalDialog" role="dialog" aria-modal="true" aria-labelledby="modalTitle" aria-describedby="modalDesc" class="ease-modal" tabindex="-1">
            <h2 id="modalTitle" class="ease-modal-title">Accessible Modal</h2>
            <p id="modalDesc" class="ease-modal-desc">This modal supports screen readers, keyboard navigation, and Windows High Contrast Mode.</p>
            <button id="closeModalBtn" class="ease-btn ease-btn-secondary" aria-label="Close modal">Close</button>
        </div>
    </div>

    <script>
        const openBtn = document.getElementById('openModalBtn');
        const closeBtn = document.getElementById('closeModalBtn');
        const modalOverlay = document.getElementById('modalOverlay');
        const modalDialog = document.getElementById('modalDialog');
        let previousActiveElement;

        function openModal() {
            previousActiveElement = document.activeElement;
            modalOverlay.classList.add('ease-modal-active');
            modalOverlay.setAttribute('aria-hidden', 'false');
            openBtn.setAttribute('aria-expanded', 'true');
            modalDialog.focus();
        }

        function closeModal() {
            modalOverlay.classList.remove('ease-modal-active');
            modalOverlay.setAttribute('aria-hidden', 'true');
            openBtn.setAttribute('aria-expanded', 'false');
            if (previousActiveElement) {
                previousActiveElement.focus();
            }
        }

        openBtn.addEventListener('click', openModal);
        closeBtn.addEventListener('click', closeModal);
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) closeModal();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && modalOverlay.classList.contains('ease-modal-active')) {
                closeModal();
            }
        });
        
        // Trap focus
        modalDialog.addEventListener('keydown', function(e) {
            let isTabPressed = e.key === 'Tab' || e.keyCode === 9;

            if (!isTabPressed) {
                return;
            }

            const focusableElements = modalDialog.querySelectorAll('a[href], button:not([disabled]), textarea:not([disabled]), input[type="text"]:not([disabled]), input[type="radio"]:not([disabled]), input[type="checkbox"]:not([disabled]), select:not([disabled])');
            const firstElement = focusableElements[0];
            const lastElement = focusableElements[focusableElements.length - 1];

            if (e.shiftKey) { 
                if (document.activeElement === firstElement) {
                    lastElement.focus();
                    e.preventDefault();
                }
            } else {
                if (document.activeElement === lastElement) {
                    firstElement.focus();
                    e.preventDefault();
                }
            }
        });
    </script>
</body>
</html>
