<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Flip Card | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="flip-container">
    <div class="flip-card" tabindex="0" aria-label="Card 1 - hover to flip">
      <div class="flip-face flip-front">
        <h2 style="margin:0; font-size:1.5rem; font-weight:700;">Front Side</h2>
        <p style="margin:0.5rem 0 0; opacity:0.8;">Hover or focus to flip</p>
      </div>
      <div class="flip-face flip-back">
        <h3 style="margin:0 0 0.5rem;">Back Side</h3>
        <p style="margin:0; opacity:0.8;">You flipped the card!</p>
      </div>
    </div>
    <div class="flip-card" tabindex="0" aria-label="Card 2 - hover to flip">
      <div class="flip-face flip-front" style="background:linear-gradient(135deg,#10b981,#059669);">
        <h2 style="margin:0; font-size:1.5rem; font-weight:700;">Hover Me</h2>
        <p style="margin:0.5rem 0 0; opacity:0.8;">Interactive 3D flip</p>
      </div>
      <div class="flip-face flip-back">
        <h3 style="margin:0 0 0.5rem;">Nice!</h3>
        <p style="margin:0; opacity:0.8;">Pure CSS, no JS</p>
      </div>
    </div>
  </div>
</body>
</html>
