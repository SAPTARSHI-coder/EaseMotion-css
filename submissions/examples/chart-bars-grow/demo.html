<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Animated growing bar chart">
  <title>Chart Bars Grow</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="chart-container">
    <header class="chart-header">
      <h1>Monthly Performance</h1>
      <p>Animated bar chart with a springy growth effect.</p>
    </header>

    <section class="chart" aria-label="Monthly performance bar chart">
      <div class="chart-grid" aria-hidden="true">
        <span>100</span>
        <span>75</span>
        <span>50</span>
        <span>25</span>
        <span>0</span>
      </div>

      <div class="bars">
        <div class="bar-group">
          <div
            class="bar"
            style="--bar-height: 72%; --delay: 0.05s;"
            role="img"
            aria-label="January: 72"
          >
            <span class="bar-value">72</span>
          </div>
          <span class="bar-label">Jan</span>
        </div>

        <div class="bar-group">
          <div
            class="bar"
            style="--bar-height: 48%; --delay: 0.15s;"
            role="img"
            aria-label="February: 48"
          >
            <span class="bar-value">48</span>
          </div>
          <span class="bar-label">Feb</span>
        </div>

        <div class="bar-group">
          <div
            class="bar"
            style="--bar-height: 85%; --delay: 0.25s;"
            role="img"
            aria-label="March: 85"
          >
            <span class="bar-value">85</span>
          </div>
          <span class="bar-label">Mar</span>
        </div>

        <div class="bar-group">
          <div
            class="bar"
            style="--bar-height: 62%; --delay: 0.35s;"
            role="img"
            aria-label="April: 62"
          >
            <span class="bar-value">62</span>
          </div>
          <span class="bar-label">Apr</span>
        </div>

        <div class="bar-group">
          <div
            class="bar"
            style="--bar-height: 94%; --delay: 0.45s;"
            role="img"
            aria-label="May: 94"
          >
            <span class="bar-value">94</span>
          </div>
          <span class="bar-label">May</span>
        </div>

        <div class="bar-group">
          <div
            class="bar"
            style="--bar-height: 76%; --delay: 0.55s;"
            role="img"
            aria-label="June: 76"
          >
            <span class="bar-value">76</span>
          </div>
          <span class="bar-label">Jun</span>
        </div>
      </div>
    </section>

    <button class="replay-button" id="replayButton">
      Replay Animation
    </button>
  </main>

  <script>
    const replayButton = document.getElementById("replayButton");
    const chart = document.querySelector(".chart");

    replayButton.addEventListener("click", () => {
      chart.classList.remove("replay");

      void chart.offsetWidth;

      chart.classList.add("replay");
    });
  </script>
</body>
</html>
