<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Elastic-Slide Modal - Minimalist Tech</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <!-- State Management Checkbox -->
    <input type="checkbox" id="modal-toggle" class="modal-toggle">

    <div class="layout-container">
        
        <header class="section-header">
            <h1 class="title">Data Export</h1>
            <p class="subtitle">Prepare and download your workspace analytics.</p>
        </header>

        <div class="dashboard">
            <div class="export-panel">
                <h3>Export Options</h3>
                <p>Generate a complete CSV dump of your analytics data from the past 90 days. This process may take a few moments depending on data volume.</p>
                
                <div class="actions">
                    <!-- Modal Trigger -->
                    <label for="modal-toggle" class="btn btn-primary">
                        Configure Export
                    </label>
                </div>
            </div>
        </div>
        
    </div>

    <!-- The Modal Overlay Background -->
    <label for="modal-toggle" class="modal-overlay"></label>

    <!-- The Elastic-Slide Modal Container -->
    <div class="modal-wrapper">
        <aside class="modal">
            <div class="modal-header">
                <h2 class="modal-title">Export Settings</h2>
                <label for="modal-toggle" class="modal-close">&times;</label>
            </div>
            
            <div class="modal-body">
                
                <div class="form-group">
                    <label class="form-label">Data Range</label>
                    <select class="form-select">
                        <option>Last 7 Days</option>
                        <option>Last 30 Days</option>
                        <option selected>Last 90 Days</option>
                        <option>All Time</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label class="form-label">File Format</label>
                    <select class="form-select">
                        <option selected>CSV (.csv)</option>
                        <option>JSON (.json)</option>
                        <option>Excel (.xlsx)</option>
                    </select>
                </div>
                
                <div class="form-group checkbox-group">
                    <input type="checkbox" id="include-pii" class="custom-checkbox">
                    <label for="include-pii" class="checkbox-label">Include Personally Identifiable Information (PII)</label>
                </div>
                
            </div>
            
            <div class="modal-footer">
                <label for="modal-toggle" class="btn btn-outline">Cancel</label>
                <label for="modal-toggle" class="btn btn-primary">Generate Export</label>
            </div>
        </aside>
    </div>

</body>
</html>
