<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Glowing Floating Label Input with Neumorphism styling"
  >
  <title>Glowing Floating Label Input</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="page">
    <section class="component" aria-labelledby="component-title">
      <div class="card">
        <span class="eyebrow">EASEMOTION CSS</span>

        <h1 id="component-title">
          Glowing Floating Label
        </h1>

        <p class="intro">
          A CSS-only floating label input with a soft neumorphic
          surface and animated glow states.
        </p>

        <form class="form" action="#" method="post">
          <div class="field">
            <input
              id="name"
              name="name"
              type="text"
              placeholder=" "
              autocomplete="name"
              required
            >
            <label for="name">Full name</label>
            <span class="field-glow" aria-hidden="true"></span>
          </div>

          <div class="field">
            <input
              id="email"
              name="email"
              type="email"
              placeholder=" "
              autocomplete="email"
              required
            >
            <label for="email">Email address</label>
            <span class="field-glow" aria-hidden="true"></span>
          </div>

          <div class="field">
            <input
              id="password"
              name="password"
              type="password"
              placeholder=" "
              autocomplete="new-password"
              minlength="8"
              required
            >
            <label for="password">Password</label>
            <span class="field-glow" aria-hidden="true"></span>
          </div>

          <button type="submit">
            Continue
          </button>
        </form>

        <p class="helper">
          Minimum 8 characters for password.
        </p>
      </div>
    </section>
  </main>
</body>
</html>
