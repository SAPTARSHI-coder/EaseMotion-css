<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kinetic Typography Hover Wave & Letter-Spacing Distortion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../easemotion.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>Kinetic Typography Wave</h1>
      <p>Hover over individual characters to see wave distortion.</p>
    </header>

    <main class="stage">
      <h2 class="wave-heading" id="waveHeading">EASEMOTION</h2>
    </main>
  </div>

  <script>
    const heading = document.getElementById('waveHeading');
    const text = heading.textContent;
    heading.innerHTML = text.split('').map((char, i) => 
      `<span style="--char-index: ${i}">${char}</span>`
    ).join('');
  </script>
</body>
</html>
