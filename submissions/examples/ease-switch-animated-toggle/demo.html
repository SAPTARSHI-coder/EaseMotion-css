<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EaseMotion CSS - Animated Toggle Switch</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>EaseMotion CSS</h1>
        <h2>Animated Toggle Switch Demo</h2>

        <!-- Default Toggle -->
        <div class="demo-item">
            <p>Default Toggle</p>
            <label class="ease-switch">
                <input type="checkbox">
                <span class="switch-track">
                    <span class="switch-thumb"></span>
                </span>
            </label>
        </div>

        <!-- Checked Toggle -->
        <div class="demo-item">
            <p>Checked Toggle</p>
            <label class="ease-switch">
                <input type="checkbox" checked>
                <span class="switch-track">
                    <span class="switch-thumb"></span>
                </span>
            </label>
        </div>

        <!-- Disabled Off -->
        <div class="demo-item">
            <p>Disabled</p>
            <label class="ease-switch">
                <input type="checkbox" disabled>
                <span class="switch-track">
                    <span class="switch-thumb"></span>
                </span>
            </label>
        </div>

        <!-- Disabled On -->
        <div class="demo-item">
            <p>Disabled Checked</p>
            <label class="ease-switch">
                <input type="checkbox" checked disabled>
                <span class="switch-track">
                    <span class="switch-thumb"></span>
                </span>
            </label>
        </div>

    </div>

</body>
</html>
