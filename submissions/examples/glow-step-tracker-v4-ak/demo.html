<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Step Progress Tracker — EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <p class="label">Pure CSS Wizard Step Progress Tracker</p>

  <div class="ease-step-progress-v4">
    <div class="ease-step-progress-bar-v4"></div>

    <div class="ease-step-item-v4 ease-step-item-v4--completed">
      <div class="ease-step-circle-v4">✓</div>
      <span class="ease-step-label-v4">Account</span>
    </div>

    <div class="ease-step-item-v4 ease-step-item-v4--active">
      <div class="ease-step-circle-v4">2</div>
      <span class="ease-step-label-v4">Billing</span>
    </div>

    <div class="ease-step-item-v4">
      <div class="ease-step-circle-v4">3</div>
      <span class="ease-step-label-v4">Confirm</span>
    </div>
  </div>

</body>
</html>
