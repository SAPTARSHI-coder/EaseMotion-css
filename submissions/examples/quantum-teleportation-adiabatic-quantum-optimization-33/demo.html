<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adiabatic Quantum Optimization - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css"></head><body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030712; color: #ffffff;">

    <div class="ease-card ease-card-glass adia-container">
        <div class="adia-header">
            <h2>Adiabatic Optimization</h2>
            <span class="ease-badge ease-badge-warning">Annealing</span>
        </div>
        
        <div class="adia-screen ease-center">
            <div class="adia-flux flux-adia-a"></div>
            <div class="adia-flux flux-adia-b"></div>
            <div class="adia-boundary-ring"></div>
            <div class="adia-core ease-center"></div>
        </div>

        <div class="adia-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Hamiltonian Interpolation H(t)</span>
            <button class="ease-btn ease-btn-warning ease-btn-sm ease-hover-grow">Run Quantum Annealing</button>
        </div>
    </div></body></html>
