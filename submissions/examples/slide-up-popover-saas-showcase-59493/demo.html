<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Slide-Up Popover Showcase</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>SaaS Showcase</h1>
            <p>Experience the Slide-Up Popover Component</p>
        </header>

        <main class="main-content">
            <!-- Hidden Checkbox for State Management -->
            <input type="checkbox" id="popover-toggle" class="popover-toggle">
            
            <div class="trigger-wrapper">
                <label for="popover-toggle" class="btn btn-primary">Toggle Popover Settings</label>
                
                <!-- The Popover -->
                <div class="popover">
                    <div class="popover-header">
                        <h3>Quick Settings</h3>
                        <label for="popover-toggle" class="btn-close">&times;</label>
                    </div>
                    <div class="popover-body">
                        <div class="setting-item">
                            <span>Enable Notifications</span>
                            <div class="toggle-switch"></div>
                        </div>
                        <div class="setting-item">
                            <span>Dark Mode</span>
                            <div class="toggle-switch"></div>
                        </div>
                    </div>
                    <div class="popover-footer">
                        <label for="popover-toggle" class="btn btn-secondary btn-sm">Close</label>
                        <button class="btn btn-primary btn-sm">Save Changes</button>
                    </div>
                    <div class="popover-arrow"></div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
