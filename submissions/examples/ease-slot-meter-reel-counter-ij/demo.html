<!-- EaseMotion component: slot-meter-reel-counter -->
<!DOCTYPE html>
<html lang="en" data-slot="meter">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
<title>Ease Slot Meter Reel Counter</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="meter-machine">
  <header class="meter-head">
    <span class="meter-title">PRIZE METER</span>
    <span class="meter-jackpot">JACKPOT</span>
  </header>
  <div class="meter-reel">
    <span class="reel-stripe">0</span>
    <span class="reel-stripe">1</span>
    <span class="reel-stripe">2</span>
    <span class="reel-stripe">3</span>
    <span class="reel-stripe">4</span>
    <span class="reel-stripe">5</span>
    <span class="reel-stripe">6</span>
    <span class="reel-stripe">7</span>
    <span class="reel-stripe">8</span>
    <span class="reel-stripe">9</span>
  </div>
  <div class="meter-tally">
    <span class="tally-label">TICKETS</span>
    <span class="tally-value">00472</span>
  </div>
  <div class="meter-lever">
    <span class="lever-shaft"></span>
    <span class="lever-grip"></span>
  </div>
  <footer class="meter-foot">
    <span class="meter-note">PULL TO WIN</span>
    <span class="meter-lamp"></span>
  </footer>
</main>
</body>
</html>
