<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Pure CSS 3D Synthwave Grid Line effect">
  <title>Synthwave Grid Line - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="demo">
    <section class="synthwave-card" aria-label="Synthwave 3D grid animation">
      <div class="sun" aria-hidden="true"></div>

      <div class="grid" aria-hidden="true">
        <div class="grid-lines horizontal"></div>
        <div class="grid-lines vertical"></div>
      </div>

      <div class="content">
        <span class="badge">3D EFFECT</span>
        <h1>Synthwave</h1>
        <p>Pure CSS Grid Line</p>
      </div>
    </section>
  </main>
</body>
</html>
