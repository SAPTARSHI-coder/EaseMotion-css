<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Glowing File Dropzone with Pastel styling"
  >
  <title>Glowing Pastel File Dropzone</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="page">
    <section class="dropzone-card" aria-labelledby="dropzone-title">
      <div class="dropzone-glow" aria-hidden="true"></div>

      <div class="dropzone-content">
        <div class="upload-icon" aria-hidden="true">
          <svg
            viewBox="0 0 24 24"
            role="img"
            aria-hidden="true"
          >
            <path d="M12 16V4"></path>
            <path d="m7 9 5-5 5 5"></path>
            <path d="M5 20h14"></path>
          </svg>
        </div>

        <h1 id="dropzone-title">Upload your files</h1>

        <p class="dropzone-description">
          Drag and drop your files here or browse from your device.
        </p>

        <label class="browse-button" for="file-input">
          Browse files
        </label>

        <input
          id="file-input"
          class="file-input"
          type="file"
          multiple
          aria-describedby="file-help"
        >

        <p id="file-help" class="file-help">
          PNG, JPG, PDF or ZIP · Up to 10 MB
        </p>
      </div>

      <div class="dropzone-status" aria-live="polite">
        <span class="status-dot" aria-hidden="true"></span>
        <span>Ready for upload</span>
      </div>
    </section>
  </main>
</body>
</html>
