<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Retro Toggle</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <header>
      <p>EaseMotion · #79686</p>
      <h1>Responsive Retro Toggle</h1>
      <p>A compact native control with bold retro color and a tactile state change.</p>
    </header>
    <label class="switch">
      <input type="checkbox">
      <span class="track"><i></i></span>
      <strong>Enable mode</strong>
    </label>
    <section>
      <h2>Implementation</h2>
      <p>The native checkbox remains accessible while CSS provides the track and thumb treatment.</p>
    </section>
  </main>
</body>
</html>
