<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Pure CSS 3D neumorphic soft shadow effect">
  <title>CSS 3D Neumorphic Soft Shadow</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="scene">
    <section class="neumorphic-card" aria-labelledby="title">
      <div class="card-icon" aria-hidden="true">
        <span></span>
      </div>

      <div class="content">
        <span class="badge">PURE CSS 3D</span>

        <h1 id="title">Soft Elevation</h1>

        <p>
          A neumorphic 3D interface card using soft shadows,
          depth, perspective, and smooth CSS motion.
        </p>

        <div class="controls" aria-label="Feature indicators">
          <div class="control">
            <span class="dot"></span>
            <span>Depth</span>
          </div>

          <div class="control">
            <span class="dot"></span>
            <span>Soft Shadow</span>
          </div>

          <div class="control">
            <span class="dot"></span>
            <span>CSS Only</span>
          </div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
