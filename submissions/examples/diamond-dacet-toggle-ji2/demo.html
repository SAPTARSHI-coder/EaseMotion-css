<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
   
  <title>Diamond Facet Edge Toggle #73889 Demo</title> 

  <link rel="stylesheet" href="style.css">

  <style>

    body {
      display: flex;
      justify-content: center;

      align-items: center; 

      min-height: 100vh;
      background-color: #050014;

      margin: 0;
    }
  </style>
</head>
<body>

  <label class="diamond-toggle-wrapper">

    <input type="checkbox" class="diamond-toggle-input">


    <span class="diamond-toggle-track">
      <span class="diamond-toggle-thumb"></span>
      
    </span>
    <span class="diamond-toggle-label">Diamond Facet</span>

  </label>

</body>
</html>
