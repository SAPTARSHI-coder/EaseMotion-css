<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Animated Notification Toasts - EaseMotion CSS</title>
  
  <!-- EaseMotion CSS CDN -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css"
  />
  
  <!-- Custom Styles for this example -->
  <link rel="stylesheet" href="style.css" />
</head>
<body class="ease-min-h-screen ease-bg-slate-900 ease-flex ease-items-center ease-justify-center ease-p-8 ease-font-sans">
  
  <main class="ease-text-center">
    <h1 class="ease-text-3xl ease-font-bold ease-text-white ease-mb-2 ease-fade-in">
      Notification Toasts
    </h1>
    <p class="ease-text-slate-400 ease-mb-12 ease-fade-in ease-delay-100">
      Click buttons to trigger animated notifications
    </p>

    <div class="ease-flex ease-flex-wrap ease-gap-4 ease-justify-center ease-mb-12 ease-fade-in ease-delay-200">
      <button class="trigger-btn trigger-btn--success" onclick="showToast('success')">
        ✓ Success Toast
      </button>
      <button class="trigger-btn trigger-btn--error" onclick="showToast('error')">
        ✕ Error Toast
      </button>
      <button class="trigger-btn trigger-btn--warning" onclick="showToast('warning')">
        ⚠ Warning Toast
      </button>
      <button class="trigger-btn trigger-btn--info" onclick="showToast('info')">
        ℹ Info Toast
      </button>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer" aria-live="polite" aria-atomic="true">
      
      <!-- Success Toast -->
      <div class="toast toast--success" id="toast-success">
        <div class="toast__icon">
          <span class="checkmark-icon">✓</span>
        </div>
        <div class="toast__content">
          <h4 class="toast__title">Success!</h4>
          <p class="toast__message">Your changes have been saved successfully.</p>
        </div>
        <button class="toast__close" aria-label="Close notification">×</button>
        <div class="toast__progress"></div>
      </div>

      <!-- Error Toast -->
      <div class="toast toast--error" id="toast-error">
        <div class="toast__icon">
          <span class="error-icon">✕</span>
        </div>
        <div class="toast__content">
          <h4 class="toast__title">Error!</h4>
          <p class="toast__message">Something went wrong. Please try again.</p>
        </div>
        <button class="toast__close" aria-label="Close notification">×</button>
        <div class="toast__progress"></div>
      </div>

      <!-- Warning Toast -->
      <div class="toast toast--warning" id="toast-warning">
        <div class="toast__icon">
          <span class="warning-icon">⚠</span>
        </div>
        <div class="toast__content">
          <h4 class="toast__title">Warning!</h4>
          <p class="toast__message">Your session will expire in 5 minutes.</p>
        </div>
        <button class="toast__close" aria-label="Close notification">×</button>
        <div class="toast__progress"></div>
      </div>

      <!-- Info Toast -->
      <div class="toast toast--info" id="toast-info">
        <div class="toast__icon">
          <span class="info-icon">ℹ</span>
        </div>
        <div class="toast__content">
          <h4 class="toast__title">Info</h4>
          <p class="toast__message">A new version is available. Refresh to update.</p>
        </div>
        <button class="toast__close" aria-label="Close notification">×</button>
        <div class="toast__progress"></div>
      </div>

    </div>
  </main>

  <!-- Minimal JS for demo (toast triggering only) -->
  <script>
    function showToast(type) {
      const toast = document.getElementById(`toast-${type}`);
      toast.classList.add('toast--visible');
      
      // Auto-dismiss after 5 seconds
      setTimeout(() => {
        toast.classList.remove('toast--visible');
      }, 5000);
    }

    // Close button functionality
    document.querySelectorAll('.toast__close').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.target.closest('.toast').classList.remove('toast--visible');
      });
    });
  </script>
</body>
</html>
