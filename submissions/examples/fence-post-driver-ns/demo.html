<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ease Fence Post Driver</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="ease-fence-post-driver">

  <div class="driver-panel">

    <h2>POST DRIVER SYSTEM</h2>
    <p>GROUND INSTALLATION CONTROL</p>

    <div class="work-area">

      <div class="hammer">
        <div class="hammer-head"></div>
        <div class="shaft"></div>
      </div>

      <div class="post"></div>

      <div class="ground"></div>

    </div>

    <div class="status">
      <span></span>
      DRIVING ACTIVE
    </div>

  </div>

</div>

</body>
</html>
