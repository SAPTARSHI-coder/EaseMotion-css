<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Loader: Quantum Energy Shield</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="layout-container">
        
        <header class="section-header">
            <h1 class="title">Pure CSS Loader: Quantum Energy Shield</h1>
            <p class="subtitle">A complex, multi-layered energy shield utilizing spinning dashed borders, intense box-shadow glows, and opposing rotation speeds.</p>
        </header>

        <div class="demo-area">
            
            <div class="loader-container" aria-label="Loading content, quantum energy shield animation playing">
                
                <!-- 
                  [TECHNIQUE] Quantum Energy Shield
                  Nested circular divs with dashed/dotted borders spinning in 
                  opposite directions create an intricate interference pattern.
                -->
                <div class="shield-wrapper" aria-hidden="true">
                    
                    <!-- The pulsing core -->
                    <div class="quantum-core"></div>
                    
                    <!-- Outer containment field -->
                    <div class="shield-ring ring-outer"></div>
                    
                    <!-- Middle energetic layer -->
                    <div class="shield-ring ring-middle"></div>
                    
                    <!-- Inner fast-spinning protective layer -->
                    <div class="shield-ring ring-inner"></div>
                    
                </div>
                
                <div class="loading-text">Stabilizing Core...</div>
                
            </div>
            
        </div>
        
    </div>

</body>
</html>
