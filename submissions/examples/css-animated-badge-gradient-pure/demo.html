<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Gradient Badge</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="badges-container">
        <!-- New Feature Badge -->
        <div class="animated-badge badge-new">
            <span class="badge-content">New Feature</span>
        </div>

        <!-- Pro Upgrade Badge -->
        <div class="animated-badge badge-pro">
            <span class="badge-content">PRO</span>
        </div>

        <!-- Sale Badge -->
        <div class="animated-badge badge-sale">
            <span class="badge-content">50% OFF</span>
        </div>
    </div>

</body>
</html>
