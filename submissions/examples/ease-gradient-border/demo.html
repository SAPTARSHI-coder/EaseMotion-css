<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    name="description"
    content="Rotating gradient border demo using CSS Houdini @property — zero JavaScript required."
  />
  <title>Ease Gradient Border — EaseMotion CSS</title>

  <style>
    /* ---------- Reset & base theme ---------- */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
  </style>

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="ease-gradient-wrapper">
    <div class="ease-gradient-border">
      <h2>Houdini Gradient</h2>
      <p>
        This border rotates smoothly at 60 fps using the CSS Houdini
        <code>@property</code> API. The browser's compositor thread
        interpolates the <code>--border-angle</code> custom property
        natively&nbsp;— no JavaScript required.
      </p>
      <button class="action-btn" type="button">Get Started</button>
    </div>
  </div>
</body>
</html>
