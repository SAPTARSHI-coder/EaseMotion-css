<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-jack-in-the-box-pop demo</title>
</head>
<body>
<div class="jb-app">
  <span class="jb-title">JACK BOX</span>
  <div class="jb-clown">
    <span class="jb-hat"></span>
    <span class="jb-head">
      <span class="jb-eye jb-eye-1"></span>
      <span class="jb-eye jb-eye-2"></span>
      <span class="jb-nose"></span>
    </span>
    <span class="jb-body"></span>
  </div>
  <div class="jb-box">
    <span class="jb-stripe jb-stripe-1"></span>
    <span class="jb-stripe jb-stripe-2"></span>
    <span class="jb-crank-hub"></span>
    <span class="jb-crank"></span>
    <span class="jb-lid"></span>
  </div>
  <span class="jb-note jb-note-1">&#9835;</span>
  <span class="jb-note jb-note-2">&#9835;</span>
  <span class="jb-note jb-note-3">&#9835;</span>
</div>
</body>
</html>
