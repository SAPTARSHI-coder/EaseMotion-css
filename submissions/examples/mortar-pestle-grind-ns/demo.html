<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mortar Pestle Grind — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Mortar Pestle Grind demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Mortar Pestle Grind</h1>
      <p class="lede">Mortar and pestle grinding in a circular press</p>
    </header>

    <section class="ease-mortar-pestle-grind" data-demo="mortar-pestle-grind" aria-live="polite">
      <div class="ease-mortar-pestle-grind__housing">
        <div class="ease-mortar-pestle-grind__bezel">
          <div class="ease-mortar-pestle-grind__face">
            <div class="ease-mortar-pestle-grind__readout">
              <span class="ease-mortar-pestle-grind__label">Mortar Pestle Grind</span>
              <span class="ease-mortar-pestle-grind__value">LIVE</span>
            </div>
            <div class="ease-mortar-pestle-grind__motion" aria-hidden="true">
              <span class="ease-mortar-pestle-grind__a"></span>
              <span class="ease-mortar-pestle-grind__b"></span>
              <span class="ease-mortar-pestle-grind__c"></span>
              <span class="ease-mortar-pestle-grind__d"></span>
            </div>
            <div class="ease-mortar-pestle-grind__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-mortar-pestle-grind__controls">
          <button type="button" class="ease-mortar-pestle-grind__btn primary">Engage</button>
          <button type="button" class="ease-mortar-pestle-grind__btn">Reset</button>
          <label class="ease-mortar-pestle-grind__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-mortar-pestle-grind__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
