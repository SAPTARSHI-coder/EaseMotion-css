<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Counter Number Tick | EaseMotion CSS</title><link rel="stylesheet" href="style.css"></head>
<body><div class="cn-root">
<div class="cn-stat"><span class="cn-icon">&#128640;</span><span class="cn-number">1,234</span><p class="cn-label">Commits</p><p class="cn-sub">This year</p></div>
<div class="cn-stat"><span class="cn-icon">&#128101;</span><span class="cn-number">5,678</span><p class="cn-label">Users</p><p class="cn-sub">Total active</p></div>
<div class="cn-stat"><span class="cn-icon">&#11088;</span><span class="cn-number">9.8</span><p class="cn-label">Rating</p><p class="cn-sub">Out of 10</p></div>
</div>
<script>
document.querySelectorAll('.cn-number').forEach(el => {
  const target = el.textContent.replace(/,/g,'');
  let current = 0;
  const step = Math.ceil(target / 40);
  const interval = setInterval(() => {
    current = Math.min(current + step, target);
    el.textContent = Number(current).toLocaleString();
    if (current >= target) clearInterval(interval);
  }, 40);
});
</script>
</body></html>
