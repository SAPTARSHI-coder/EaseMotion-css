<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EaseMotion CSS - Glow Border Card Demo</title>
  <!-- Link to the main EaseMotion CSS (adjust path if needed) -->
  <link rel="stylesheet" href="../../easemotion.min.css" />
  <link rel="stylesheet" href="style.css" />
  <style>
    /* Fallback basic styles if easemotion.min.css is not loaded locally */
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      gap: 2rem;
    }
    h1 { margin-bottom: 0.5rem; }
    p { color: #94a3b8; margin-top: 0; }
  </style>
</head>
<body>

  <div class="ease-fade-in ease-slide-up" style="text-align: center;">
    <h1>Glowing Gradient Border Card</h1>
    <p>Hover over the card to see the animated gradient border effect.</p>
  </div>

  <!-- Glow Card Component -->
  <div class="ease-glow-card">
    <div class="ease-glow-card__content">
      <h3>Feature Card</h3>
      <p>This card features a smooth, rotating gradient border animation that intensifies on hover, built purely with CSS.</p>
      <button class="ease-btn ease-btn-primary" style="align-self: flex-start;">Learn More</button>
    </div>
  </div>

</body>
</html>
