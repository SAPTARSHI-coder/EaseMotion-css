<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EaseMotion CSS - Animated Rating Stars</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="demo-container">
        <!-- 
            We use a reverse flex-direction so the CSS general sibling selector (~) 
            can easily target previous stars when hovering/checking. 
        -->
        <div class="ease-rating">
            <input type="radio" id="star5" name="rating" value="5" class="ease-rating-input">
            <label for="star5" class="ease-rating-label">
                <svg class="ease-rating-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
            </label>

            <input type="radio" id="star4" name="rating" value="4" class="ease-rating-input">
            <label for="star4" class="ease-rating-label">
                <svg class="ease-rating-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
            </label>

            <input type="radio" id="star3" name="rating" value="3" class="ease-rating-input">
            <label for="star3" class="ease-rating-label">
                <svg class="ease-rating-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
            </label>

            <input type="radio" id="star2" name="rating" value="2" class="ease-rating-input">
            <label for="star2" class="ease-rating-label">
                <svg class="ease-rating-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
            </label>

            <input type="radio" id="star1" name="rating" value="1" class="ease-rating-input">
            <label for="star1" class="ease-rating-label">
                <svg class="ease-rating-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
            </label>
        </div>
        <p class="demo-text">Leave a rating!</p>
    </div>
</body>
</html>
