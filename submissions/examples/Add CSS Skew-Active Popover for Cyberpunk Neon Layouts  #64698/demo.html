<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Skew-Active Popover - Cyberpunk Neon Layouts</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="cyberpunk-container">
    <div class="popover-wrapper">
      <input type="checkbox" id="popover-toggle" class="popover-toggle-input">
      
      <label for="popover-toggle" class="cyber-btn">
        ENGAGE PROTOCOL
      </label>
      
      <div class="skew-popover" role="dialog" aria-label="Protocol Status">
        <div class="popover-content">
          <h3 class="neon-title">PROTOCOL DELTA-9</h3>
          <p class="neon-text">Engagement sequence initiated. Neural sync at 98% and holding steady.</p>
          
          <div class="neon-stats">
            <div class="stat-box">
              <span class="stat-label">SYNC</span>
              <span class="stat-value">98%</span>
            </div>
            <div class="stat-box">
              <span class="stat-label">PWR</span>
              <span class="stat-value">120V</span>
            </div>
          </div>
          
          <label for="popover-toggle" class="close-btn" aria-label="Close popover">DISENGAGE</label>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
