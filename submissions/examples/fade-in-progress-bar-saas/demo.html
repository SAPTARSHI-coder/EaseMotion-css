<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EaseMotion CSS - Fade-In Progress Bars</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<section class="demo-container">
    <div class="header">
        <h1>Fade-In Progress Bars</h1>
        <p>Modern SaaS Analytics Dashboard Progress Indicators</p>
    </div>

    <div class="progress-wrapper">

        <div class="progress-card">
            <div class="progress-info">
                <span>Cloud Storage</span>
                <span>92%</span>
            </div>

            <div class="progress-bar">
                <div class="progress-fill blue" style="width:92%;"></div>
            </div>
        </div>

        <div class="progress-card">
            <div class="progress-info">
                <span>Team Productivity</span>
                <span>76%</span>
            </div>

            <div class="progress-bar">
                <div class="progress-fill purple" style="width:76%;"></div>
            </div>
        </div>

        <div class="progress-card">
            <div class="progress-info">
                <span>Project Completion</span>
                <span>64%</span>
            </div>

            <div class="progress-bar">
                <div class="progress-fill green" style="width:64%;"></div>
            </div>
        </div>

        <div class="progress-card">
            <div class="progress-info">
                <span>Revenue Target</span>
                <span>88%</span>
            </div>

            <div class="progress-bar">
                <div class="progress-fill orange" style="width:88%;"></div>
            </div>
        </div>

    </div>
</section>

</body>
</html>
