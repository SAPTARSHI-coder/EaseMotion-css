<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CSS Friend Request Card">
  <title>CSS Friend Request Card</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">
    <section class="friend-card" aria-labelledby="request-title">
      <div class="avatar-wrap">
        <div class="avatar" aria-hidden="true">RC</div>
        <span class="online-dot" aria-label="Online"></span>
      </div>

      <div class="content">
        <span class="eyebrow">New connection</span>

        <h1 id="request-title">Friend Request</h1>

        <p class="request-text">
          <strong>Riya Kapoor</strong> wants to connect with you.
        </p>

        <p class="mutual">
          <span aria-hidden="true">●</span>
          8 mutual friends
        </p>

        <div class="actions" aria-label="Friend request actions">
          <button class="btn accept" type="button">
            <span aria-hidden="true">✓</span>
            Accept
          </button>

          <button class="btn decline" type="button">
            <span aria-hidden="true">×</span>
            Decline
          </button>
        </div>
      </div>
    </section>
  </main>

</body>
</html>
