<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hydraulic Ram Pulse — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Hydraulic Ram Pulse demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Hydraulic Ram Pulse</h1>
      <p class="lede">Hydraulic ram delivering intermittent lift pulses</p>
    </header>

    <section class="ease-hydraulic-ram-pulse" data-demo="hydraulic-ram-pulse" aria-live="polite">
      <div class="ease-hydraulic-ram-pulse__housing">
        <div class="ease-hydraulic-ram-pulse__bezel">
          <div class="ease-hydraulic-ram-pulse__face">
            <div class="ease-hydraulic-ram-pulse__readout">
              <span class="ease-hydraulic-ram-pulse__label">Hydraulic Ram Pulse</span>
              <span class="ease-hydraulic-ram-pulse__value">LIVE</span>
            </div>
            <div class="ease-hydraulic-ram-pulse__motion" aria-hidden="true">
              <span class="ease-hydraulic-ram-pulse__a"></span>
              <span class="ease-hydraulic-ram-pulse__b"></span>
              <span class="ease-hydraulic-ram-pulse__c"></span>
              <span class="ease-hydraulic-ram-pulse__d"></span>
            </div>
            <div class="ease-hydraulic-ram-pulse__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-hydraulic-ram-pulse__controls">
          <button type="button" class="ease-hydraulic-ram-pulse__btn primary">Engage</button>
          <button type="button" class="ease-hydraulic-ram-pulse__btn">Reset</button>
          <label class="ease-hydraulic-ram-pulse__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-hydraulic-ram-pulse__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
