<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Draw-Border Line Tooltip</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <button
            class="tooltip-btn"
            aria-describedby="tooltip"
        >
            Hover or Focus Me

            <span
                class="tooltip"
                id="tooltip"
                role="tooltip"
            >
                Minimalist Tech Tooltip
            </span>

        </button>

    </div>

</body>
</html>
