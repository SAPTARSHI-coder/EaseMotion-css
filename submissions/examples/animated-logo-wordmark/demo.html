<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CSS-only animated logo wordmark">
  <title>Animated Logo Wordmark</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="demo">
    <section class="logo-section" aria-labelledby="logo-title">
      <p class="eyebrow">CSS Animation</p>

      <h1 id="logo-title" class="logo" aria-label="EaseMotion">
        <span aria-hidden="true">E</span>
        <span aria-hidden="true">a</span>
        <span aria-hidden="true">s</span>
        <span aria-hidden="true">e</span>
        <span aria-hidden="true">M</span>
        <span aria-hidden="true">o</span>
        <span aria-hidden="true">t</span>
        <span aria-hidden="true">i</span>
        <span aria-hidden="true">o</span>
        <span aria-hidden="true">n</span>
      </h1>

      <p class="description">
        A pure CSS letter-by-letter reveal animation.
      </p>
    </section>
  </main>
</body>
</html>
