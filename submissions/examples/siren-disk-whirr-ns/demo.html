<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Siren Disk Whirr — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Siren Disk Whirr demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Siren Disk Whirr</h1>
      <p class="lede">Siren disk whirring with alternating tone ports</p>
    </header>

    <section class="ease-siren-disk-whirr" data-demo="siren-disk-whirr" aria-live="polite">
      <div class="ease-siren-disk-whirr__housing">
        <div class="ease-siren-disk-whirr__bezel">
          <div class="ease-siren-disk-whirr__face">
            <div class="ease-siren-disk-whirr__readout">
              <span class="ease-siren-disk-whirr__label">Siren Disk Whirr</span>
              <span class="ease-siren-disk-whirr__value">LIVE</span>
            </div>
            <div class="ease-siren-disk-whirr__motion" aria-hidden="true">
              <span class="ease-siren-disk-whirr__a"></span>
              <span class="ease-siren-disk-whirr__b"></span>
              <span class="ease-siren-disk-whirr__c"></span>
              <span class="ease-siren-disk-whirr__d"></span>
            </div>
            <div class="ease-siren-disk-whirr__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-siren-disk-whirr__controls">
          <button type="button" class="ease-siren-disk-whirr__btn primary">Engage</button>
          <button type="button" class="ease-siren-disk-whirr__btn">Reset</button>
          <label class="ease-siren-disk-whirr__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-siren-disk-whirr__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
