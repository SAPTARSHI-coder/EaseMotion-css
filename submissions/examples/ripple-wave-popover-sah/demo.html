<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ripple-Wave Popover - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="showcase">
    <header class="head">
      <h1>Ripple-Wave Popover (<code>#54489</code>)</h1>
      <p>Hover over the specification badge below to summon a creative popover emitting continuous radiating ripple ring waves.</p>
    </header>
    
    <div class="ease-popover-anchor">
      <button class="anchor-btn">✦ Hover: Houdini Tokens ✦</button>
      
      <div class="ease-popover-ripple-wave">
        <div class="ripple-ring r1"></div>
        <div class="ripple-ring r2"></div>
        <div class="pop-card">
          <h4>Declarative Shaders</h4>
          <p>Hardware-accelerated CSS paint worklets rendering kinetic shockwave animations without layout reflows.</p>
          <span class="status">● Active at 60 FPS</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
