<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enlarger Focus Bellows — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Enlarger Focus Bellows demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Enlarger Focus Bellows</h1>
      <p class="lede">Photo enlarger bellows expanding while focus ring turns</p>
    </header>

    <section class="ease-enlarger-focus-bellows" data-demo="enlarger-focus-bellows" aria-live="polite">
      <div class="ease-enlarger-focus-bellows__housing">
        <div class="ease-enlarger-focus-bellows__bezel">
          <div class="ease-enlarger-focus-bellows__face">
            <div class="ease-enlarger-focus-bellows__readout">
              <span class="ease-enlarger-focus-bellows__label">Enlarger Focus Bellows</span>
              <span class="ease-enlarger-focus-bellows__value" id="val-enlarger-focus-bellows">READY</span>
            </div>
            <div class="ease-enlarger-focus-bellows__motion" aria-hidden="true">
              <span class="ease-enlarger-focus-bellows__arm"></span>
              <span class="ease-enlarger-focus-bellows__core"></span>
              <span class="ease-enlarger-focus-bellows__trail"></span>
              <span class="ease-enlarger-focus-bellows__mark m1"></span>
              <span class="ease-enlarger-focus-bellows__mark m2"></span>
              <span class="ease-enlarger-focus-bellows__mark m3"></span>
            </div>
            <div class="ease-enlarger-focus-bellows__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-enlarger-focus-bellows__controls">
          <button type="button" class="ease-enlarger-focus-bellows__btn primary">Engage</button>
          <button type="button" class="ease-enlarger-focus-bellows__btn">Reset</button>
          <label class="ease-enlarger-focus-bellows__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-enlarger-focus-bellows__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
