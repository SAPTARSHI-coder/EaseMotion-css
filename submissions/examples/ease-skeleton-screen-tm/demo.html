<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Skeleton Screen Loading</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="skel-grid">

    <!-- User profile skeleton -->
    <div class="skel-card">
      <div class="skel-header">
        <div class="skel-avatar skel-shimmer"></div>
        <div>
          <div class="skel-name skel-shimmer"></div>
          <div class="skel-role skel-shimmer"></div>
        </div>
      </div>
      <div class="skel-line lg skel-shimmer"></div>
      <div class="skel-line md skel-shimmer"></div>
      <div class="skel-line sm skel-shimmer"></div>
      <div class="skel-btn skel-shimmer"></div>
    </div>

    <!-- Blog card skeleton -->
    <div class="skel-card skel-accent">
      <div class="skel-image skel-shimmer"></div>
      <div class="skel-line lg skel-shimmer"></div>
      <div class="skel-line md skel-shimmer"></div>
      <div class="skel-line sm skel-shimmer"></div>
      <div class="skel-btn skel-shimmer"></div>
    </div>

  </div>
</body>
</html>
