<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="CSS savings goal tracker with animated progress milestones."
  >
  <title>CSS Savings Goal Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">
    <section class="savings-card" aria-labelledby="goal-title">

      <div class="card-header">
        <div>
          <span class="eyebrow">Savings Goal</span>
          <h1 id="goal-title">New Laptop</h1>
        </div>

        <div class="goal-icon" aria-hidden="true">₹</div>
      </div>

      <div class="amount-row">
        <div>
          <span class="label">Saved</span>
          <strong>₹72,000</strong>
        </div>

        <div class="target">
          <span class="label">Goal</span>
          <strong>₹1,00,000</strong>
        </div>
      </div>

      <div
        class="progress"
        role="progressbar"
        aria-label="Savings goal progress"
        aria-valuenow="72"
        aria-valuemin="0"
        aria-valuemax="100"
      >
        <span class="progress-fill"></span>
      </div>

      <div class="percentage">
        <strong>72%</strong>
        <span>completed</span>
      </div>

      <div class="milestones" aria-label="Savings milestones">
        <div class="milestone reached">
          <span class="dot">✓</span>
          <span>25%</span>
        </div>

        <div class="milestone reached">
          <span class="dot">✓</span>
          <span>50%</span>
        </div>

        <div class="milestone reached">
          <span class="dot">✓</span>
          <span>75%</span>
        </div>

        <div class="milestone">
          <span class="dot"></span>
          <span>100%</span>
        </div>
      </div>

      <p class="remaining">
        <span>₹28,000</span> remaining to reach your goal
      </p>

    </section>
  </main>

</body>
</html>
