<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
        name="description"
        content="Pure CSS animated Follow and Unfollow button toggle"
    >
    <title>CSS Follow Button Toggle</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="page">
        <section class="follow-card" aria-labelledby="component-title">

            <p class="eyebrow">EaseMotion CSS</p>

            <h1 id="component-title">Follow Button Toggle</h1>

            <p class="description">
                A smooth Follow and Unfollow interaction created entirely
                with CSS.
            </p>

            <div class="button-demo">
                <input
                    type="checkbox"
                    id="follow-toggle"
                    class="follow-toggle"
                    aria-label="Follow or unfollow user"
                >

                <label for="follow-toggle" class="follow-button">
                    <span class="follow-state follow-state-default">
                        <span class="icon" aria-hidden="true">+</span>
                        Follow
                    </span>

                    <span class="follow-state follow-state-active">
                        <span class="icon" aria-hidden="true">✓</span>
                        Following
                    </span>
                </label>
            </div>

            <p class="hint">
                Click the button or focus it and press Enter or Space.
            </p>

        </section>
    </main>

</body>
</html>
