<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retro Arcade Pixel Widget</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <h1>Dashboard Modules</h1>
      <p class="subtitle">Retro Arcade Pixel Variation</p>
    </header>

    <main class="dashboard-grid">
      <!-- Widget 1: Primary Arcade Metric -->
      <a href="#" class="arcade-widget theme-cyan" aria-labelledby="widget1-title">
        <!-- Decorative pixel corners (handled by pseudo-elements in CSS) -->
        <article class="widget-content">
          <header class="widget-header">
            <h2 id="widget1-title" class="widget-title">ARCADE SCORE</h2>
            
            <div class="arcade-status">
              <span class="pixel-dot"></span>
              PLAYER 01
            </div>
          </header>
          
          <div class="widget-body">
            <div class="primary-metric">
              <strong>12,480</strong>
              <span class="metric-trend positive">+18.6%</span>
            </div>
            
            <div class="arcade-divider">
              <!-- Pixelated divider created with linear-gradient in CSS -->
            </div>
            
            <div class="secondary-metrics">
              <div class="metric-block">
                <span class="metric-label">HIGH SCORE</span>
                <span class="metric-value">15,200</span>
              </div>
              <div class="metric-block">
                <span class="metric-label">COMBO</span>
                <span class="metric-value">x24</span>
              </div>
            </div>
          </div>
          
          <footer class="widget-footer">
            <span>INSERT COIN TO CONTINUE</span>
          </footer>
        </article>
      </a>

      <!-- Widget 2: Magenta Theme Metric -->
      <a href="#" class="arcade-widget theme-magenta" aria-labelledby="widget2-title">
        <article class="widget-content">
          <header class="widget-header">
            <h2 id="widget2-title" class="widget-title">SYSTEM UPTIME</h2>
            
            <div class="arcade-status offline">
              <span class="pixel-dot"></span>
              WARNING
            </div>
          </header>
          
          <div class="widget-body">
            <div class="primary-metric">
              <strong>94.2<span class="unit">%</span></strong>
              <span class="metric-trend negative">-2.1%</span>
            </div>
            
            <div class="arcade-divider"></div>
            
            <div class="secondary-metrics">
              <div class="metric-block">
                <span class="metric-label">LATENCY</span>
                <span class="metric-value">124ms</span>
              </div>
              <div class="metric-block">
                <span class="metric-label">ERRORS</span>
                <span class="metric-value">0.4%</span>
              </div>
            </div>
          </div>
          
          <footer class="widget-footer">
            <span>SYSTEM REQUIRES ATTENTION</span>
          </footer>
        </article>
      </a>
    </main>
  </div>
</body>
</html>
