<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.4">
<title>Barber Pole Spiral</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="barber-pole">
  <header class="pole-head">
    <h1 class="pole-title">THE BARBER</h1>
    <p class="pole-open">OPEN</p>
  </header>
  <section class="pole-body" aria-label="Barber pole">
    <div class="pole-cap cap-top"></div>
    <div class="pole-tube">
      <span class="strip strip-a"></span>
      <span class="strip strip-b"></span>
      <span class="strip strip-c"></span>
    </div>
    <div class="pole-cap cap-bottom"></div>
  </section>
  <footer class="pole-foot">
    <span class="pole-cut">CUT $18</span>
    <span class="pole-walk">WALK INS</span>
  </footer>
</main>
</body>
</html>
