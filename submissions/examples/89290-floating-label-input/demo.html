<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floating Label Input Component</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="form-container">
        <h2>Account Login</h2>
        <div class="ease-floating-group">
            <input type="email" id="email" class="ease-floating-input" placeholder=" " required>
            <label for="email" class="ease-floating-label">Email Address</label>
        </div>
    </div>

</body>
</html>
