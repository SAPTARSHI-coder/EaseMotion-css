<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Glassmorphism Blur Modal</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <main class="page">
    <section class="hero">
      <span class="badge">EaseMotion CSS</span>

      <h1>Glassmorphism Blur Modal</h1>

      <p>
        A smooth, responsive modal component built with
        pure HTML and Vanilla CSS.
      </p>

      <a href="#glass-modal" class="open-button">
        Open Modal
      </a>
    </section>
  </main>

  <!-- Modal -->
  <div id="glass-modal" class="modal">

    <div class="modal-backdrop"></div>

    <div
      class="modal-content"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modal-title"
    >

      <a
        href="#"
        class="modal-close"
        aria-label="Close modal"
      >
        &times;
      </a>

      <div class="modal-icon">
        ✦
      </div>

      <span class="modal-label">
        Glassmorphism
      </span>

      <h2 id="modal-title">
        Welcome to EaseMotion
      </h2>

      <p>
        This modal demonstrates a modern glassmorphism
        blur effect using only HTML and CSS.
      </p>

      <div class="modal-actions">
        <a href="#" class="secondary-button">
          Cancel
        </a>

        <a href="#" class="primary-button">
          Continue
        </a>
      </div>

    </div>
  </div>

</body>
</html>
