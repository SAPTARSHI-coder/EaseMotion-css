<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EaseMotion Particle Burst Button</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="demo">
      <p class="demo__eyebrow">EaseMotion example</p>
      <h1>Celebrate every click</h1>
      <p>Click the button to send a burst of colour into the air.</p>

      <!-- The button remains a usable button even when JavaScript is disabled. -->
      <button class="ease-particle-btn" type="button">Celebrate!</button>
    </main>

    <script src="script.js"></script>
  </body>
</html>
