<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Float-Drift Badge - Minimalist Tech</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="layout-container">
        
        <header class="section-header">
            <h1 class="title">Cloud Environments</h1>
            <p class="subtitle">A minimalist tech badge component featuring an infinite, multi-axis floating animation.</p>
        </header>

        <div class="dashboard-area">
            
            <div class="card">
                
                <div class="cloud-map">
                    
                    <!-- Center Node (Static reference point) -->
                    <div class="center-node">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="8" rx="2" ry="2"></rect><rect x="2" y="14" width="20" height="8" rx="2" ry="2"></rect><line x1="6" y1="6" x2="6.01" y2="6"></line><line x1="6" y1="18" x2="6.01" y2="18"></line></svg>
                        <span>Main Cluster</span>
                    </div>

                    <!-- Orbiting Badges (Float-Drift) -->
                    
                    <!-- Badge 1: App Server -->
                    <div class="badge float-drift pos-1 color-blue">
                        <span class="badge-dot"></span>
                        <span class="badge-text">Web-Node-Alpha</span>
                    </div>
                    
                    <!-- Badge 2: App Server -->
                    <div class="badge float-drift pos-2 color-blue">
                        <span class="badge-dot"></span>
                        <span class="badge-text">Web-Node-Beta</span>
                    </div>
                    
                    <!-- Badge 3: Cache -->
                    <div class="badge float-drift pos-3 color-purple">
                        <span class="badge-dot"></span>
                        <span class="badge-text">Redis-Cache</span>
                    </div>
                    
                    <!-- Badge 4: Workers (Delayed to desync the float) -->
                    <div class="badge float-drift pos-4 color-emerald delay-drift">
                        <span class="badge-dot"></span>
                        <span class="badge-text">Worker-Pool</span>
                        <span class="badge-count">12</span>
                    </div>
                    
                </div>
                
            </div>
            
        </div>
    </div>

</body>
</html>
