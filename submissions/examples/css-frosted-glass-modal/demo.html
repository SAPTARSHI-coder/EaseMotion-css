<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Frosted Glass Modal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="page-content">
  <h1>Frosted Glass Modal</h1>
  <p>Pure CSS modal with a glassmorphism effect.</p>
</div>

<div class="modal-overlay">
  <div
    class="modal"
    role="dialog"
    aria-labelledby="modal-title"
    aria-modal="true"
  >
    <h2 id="modal-title">Welcome</h2>

    <p>
      This frosted glass modal uses backdrop blur,
      transparency, and subtle shadows to create
      a modern glassmorphism effect.
    </p>

    <button class="modal-btn">
      Continue
    </button>
  </div>
</div>

</body>
</html>
