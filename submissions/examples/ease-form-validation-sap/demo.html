<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ease-form-validation-sap demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f4f4f5;
    }
  </style>
</head>
<body>

  <form class="form-validate-sap" id="validateForm" novalidate>
    <div class="field" id="emailField">
      <label for="emailInput">Email</label>
      <input type="email" id="emailInput" placeholder="you@example.com">
      <div class="field-msg" id="emailMsg"></div>
    </div>

    <div class="field" id="pwField">
      <label for="pwInput">Password</label>
      <input type="password" id="pwInput" placeholder="At least 8 characters">
      <div class="field-msg" id="pwMsg"></div>
    </div>

    <button type="submit">Submit</button>
  </form>

  <script>
    const form = document.getElementById('validateForm');
    const emailField = document.getElementById('emailField');
    const emailInput = document.getElementById('emailInput');
    const emailMsg = document.getElementById('emailMsg');
    const pwField = document.getElementById('pwField');
    const pwInput = document.getElementById('pwInput');
    const pwMsg = document.getElementById('pwMsg');

    function validateEmail() {
      const valid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailInput.value);
      emailField.classList.toggle('valid', valid);
      emailField.classList.toggle('invalid', !valid);
      emailMsg.textContent = valid ? 'Looks good' : 'Enter a valid email address';
      return valid;
    }

    function validatePassword() {
      const valid = pwInput.value.length >= 8;
      pwField.classList.toggle('valid', valid);
      pwField.classList.toggle('invalid', !valid);
      pwMsg.textContent = valid ? 'Looks good' : 'Must be at least 8 characters';
      return valid;
    }

    emailInput.addEventListener('input', validateEmail);
    pwInput.addEventListener('input', validatePassword);

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const emailValid = validateEmail();
      const pwValid = validatePassword();
      if (emailValid && pwValid) {
        alert('Form submitted successfully!');
      }
    });
  </script>

</body>
</html>
