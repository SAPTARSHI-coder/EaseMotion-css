<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="CSS-only clock spinner loader with animated hour and minute hands."
  >
  <title>CSS Clock Spinner Loader</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="demo-page">
    <section class="loader-card" aria-labelledby="loader-title">
      <p class="eyebrow">EaseMotion CSS</p>

      <h1 id="loader-title">Clock Spinner Loader</h1>

      <p class="description">
        A lightweight clock-face loading indicator built entirely with CSS.
      </p>

      <div
        class="clock-spinner"
        role="status"
        aria-label="Loading"
        aria-live="polite"
      >
        <span class="clock-spinner__face" aria-hidden="true">
          <span class="clock-spinner__marker clock-spinner__marker--12"></span>
          <span class="clock-spinner__marker clock-spinner__marker--3"></span>
          <span class="clock-spinner__marker clock-spinner__marker--6"></span>
          <span class="clock-spinner__marker clock-spinner__marker--9"></span>

          <span class="clock-spinner__hand clock-spinner__hand--hour"></span>
          <span class="clock-spinner__hand clock-spinner__hand--minute"></span>

          <span class="clock-spinner__center"></span>
        </span>
      </div>

      <p class="loading-text">Loading...</p>
    </section>
  </main>
</body>
</html>
