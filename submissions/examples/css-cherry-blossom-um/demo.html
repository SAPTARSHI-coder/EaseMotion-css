<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Cherry Blossom Animation - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  
  <!-- Interactive Toggle (Needs to be placed before target containers for CSS sibling selector mapping) -->
  <input type="checkbox" id="wind-toggle" class="toggle-input">

  <!-- Interactive Scene Container -->
  <div class="scene-container" role="img" aria-label="Animated Sakura Cherry Blossom Tree with pink falling petals blowing in the wind.">
    
    <header class="header-box">
      <h1 class="title">Sakura Drift</h1>
      <p class="subtitle">Pure CSS Cherry Blossom</p>
    </header>

    <!-- The Cherry Blossom Tree -->
    <div class="tree-container">
      <div class="trunk">
        <div class="branch-left"></div>
        <div class="branch-right"></div>
        <div class="canopy">
          <div class="blossom-cloud bc-1"></div>
          <div class="blossom-cloud bc-2"></div>
          <div class="blossom-cloud bc-3"></div>
          <div class="blossom-cloud bc-4"></div>
        </div>
      </div>
    </div>

    <!-- Falling Petals -->
    <div class="petals-wrapper" aria-hidden="true">
      <div class="petal p-1"></div>
      <div class="petal p-2"></div>
      <div class="petal p-3"></div>
      <div class="petal p-4"></div>
      <div class="petal p-5"></div>
      <div class="petal p-6"></div>
      <div class="petal p-7"></div>
      <div class="petal p-8"></div>
      <div class="petal p-9"></div>
      <div class="petal p-10"></div>
      <div class="petal p-11"></div>
      <div class="petal p-12"></div>
      <div class="petal p-13"></div>
      <div class="petal p-14"></div>
      <div class="petal p-15"></div>
      <div class="petal p-16"></div>
      <div class="petal p-17"></div>
      <div class="petal p-18"></div>
      <div class="petal p-19"></div>
      <div class="petal p-20"></div>
    </div>

    <!-- Interactive Control Label -->
    <label for="wind-toggle" class="control-panel">
      <span class="toggle-label">Storm Wind Mode</span>
      <div class="toggle-switch"></div>
    </label>

  </div>

</body>
</html>
