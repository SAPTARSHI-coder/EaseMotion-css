<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Pure CSS retro arcade pixel particle effect."
  >
  <title>Retro Arcade Pixel Particles</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="arcade-scene">
    <div class="scanlines" aria-hidden="true"></div>

    <div class="particle-field" aria-hidden="true">
      <span class="pixel pixel-1"></span>
      <span class="pixel pixel-2"></span>
      <span class="pixel pixel-3"></span>
      <span class="pixel pixel-4"></span>
      <span class="pixel pixel-5"></span>
      <span class="pixel pixel-6"></span>
      <span class="pixel pixel-7"></span>
      <span class="pixel pixel-8"></span>
      <span class="pixel pixel-9"></span>
      <span class="pixel pixel-10"></span>
      <span class="pixel pixel-11"></span>
      <span class="pixel pixel-12"></span>
      <span class="pixel pixel-13"></span>
      <span class="pixel pixel-14"></span>
      <span class="pixel pixel-15"></span>
      <span class="pixel pixel-16"></span>
      <span class="pixel pixel-17"></span>
      <span class="pixel pixel-18"></span>
      <span class="pixel pixel-19"></span>
      <span class="pixel pixel-20"></span>
    </div>

    <section class="arcade-card" aria-labelledby="arcade-title">
      <span class="status">PLAYER 01 • READY</span>

      <h1 id="arcade-title">PIXEL<br>ARCADE</h1>

      <p>
        A lightweight retro particle effect created entirely
        with HTML and Vanilla CSS.
      </p>

      <button class="start-button" type="button">
        START GAME
      </button>
    </section>
  </main>
</body>
</html>
