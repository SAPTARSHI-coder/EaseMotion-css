<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tooltip Component Demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f8fafc;
      gap: 3rem;
    }
    .text-container {
      font-size: 1.1rem;
      color: #334155;
    }
    .inline-link {
      color: #3b82f6;
      text-decoration: underline;
      text-underline-offset: 4px;
    }
    .btn {
      padding: 0.75rem 1.5rem;
      background: white;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 1rem;
      color: #0f172a;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }
  </style>
</head>
<body>

  <div class="text-container">
    Here is some text with an 
    <span class="tooltip-ag inline-link" data-tooltip="This explains the inline text!">
      inline tooltip
    </span>
    attached to it.
  </div>

  <button class="tooltip-ag btn" data-tooltip="Save your current progress">
    Save Document
  </button>

</body>
</html>
