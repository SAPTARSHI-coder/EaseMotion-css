<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyberpunk Glitch Text Reveal</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Teko:wght@600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="cyber-container">
        <!-- Decoration elements -->
        <div class="corner-top-left"></div>
        <div class="corner-bottom-right"></div>
        
        <div class="glitch-wrapper" onmouseenter="triggerGlitch(this)">
            <h1 class="glitch-text" data-text="NEUROMANCER">NEUROMANCER</h1>
            <h2 class="sub-text">JACK IN. EXECUTE.</h2>
        </div>
    </div>

    <script>
        function triggerGlitch(wrapper) {
            const textEl = wrapper.querySelector('.glitch-text');
            // Re-trigger CSS animation by removing and re-adding class
            textEl.classList.remove('glitch-active');
            void textEl.offsetWidth; // Trigger reflow
            textEl.classList.add('glitch-active');
        }

        // Trigger on load
        window.onload = () => {
            const textEl = document.querySelector('.glitch-text');
            textEl.classList.add('glitch-active');
        };
    </script>
</body>
</html>
