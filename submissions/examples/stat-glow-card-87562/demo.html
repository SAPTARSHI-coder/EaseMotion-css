<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stat Glow Card #87562 Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="showcase-wrapper">
    <div class="glow-kpi-card" id="kpiCard">
      <div class="card-top">
        <span class="kpi-title">Active Platform Users</span>
        <span class="kpi-badge">▲ 18.2%</span>
      </div>

      <div class="kpi-metric-wrap">
        <span class="kpi-metric" id="metricVal">94.8</span>
        <span class="kpi-unit">k</span>
      </div>

      <div class="kpi-footer">
        <span><span class="pulse-dot"></span>Real-time telemetry</span>
        <span>Target: 100k</span>
      </div>
    </div>

    <div class="controls-bar">
      <span class="status-text" id="statusLabel">Status: Breathing Glow Active</span>
      <button class="btn-toggle" id="togglePulseBtn">Pause Pulse</button>
    </div>
  </div>

  <script>
    const card = document.getElementById('kpiCard');
    const toggleBtn = document.getElementById('togglePulseBtn');
    const statusLabel = document.getElementById('statusLabel');

    toggleBtn.addEventListener('click', () => {
      const isPaused = card.classList.toggle('paused');
      if (isPaused) {
        toggleBtn.textContent = 'Resume Pulse';
        statusLabel.textContent = 'Status: Paused';
      } else {
        toggleBtn.textContent = 'Pause Pulse';
        statusLabel.textContent = 'Status: Breathing Glow Active';
      }
    });
  </script>
</body>
</html>
