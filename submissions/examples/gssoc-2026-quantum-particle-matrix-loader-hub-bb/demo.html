<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quantum Particle Matrix Loader Hub - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="loader-container">
    <header class="loader-header">
      <span class="badge">GSSoC 2026 Component</span>
      <h1>Quantum Particle Matrix Loader Hub</h1>
      <p>Multi-layered orbital particle loader with central energy core, pulse waves, and loading telemetry.</p>
    </header>

    <div class="loader-card" tabindex="0">
      <div class="particle-matrix">
        <div class="orbit orbit-1">
          <span class="particle p1"></span>
          <span class="particle p2"></span>
        </div>
        <div class="orbit orbit-2">
          <span class="particle p3"></span>
          <span class="particle p4"></span>
        </div>
        <div class="quantum-core"></div>
        <div class="pulse-wave"></div>
      </div>

      <div class="loader-telemetry">
        <div class="progress-bar-track">
          <div class="progress-fill"></div>
        </div>
        <div class="status-row">
          <span class="status-text">CALIBRATING QUANTUM MATRIX</span>
          <span class="percentage">87%</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
