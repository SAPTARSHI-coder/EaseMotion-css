<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Magnifying Hover Lens - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="em-container">
    <header class="em-header">
      <h1 class="em-title">Magnifying Hover Lens</h1>
      <p class="em-subtitle">Hover effect simulating glass magnification over detail layers.</p>
    </header>
    <main class="em-grid">
      <section class="em-card">
        <div class="em-card__icon">&#9672;</div>
        <h2 class="em-card__title">Interactive Element</h2>
        <p class="em-card__body">Hover card to see dynamic glow transition overlay.</p>
        <button class="em-btn em-btn--primary">Interact</button>
      </section>
      <section class="em-card">
        <div class="em-card__icon">&#9673;</div>
        <h2 class="em-card__title">Visual State</h2>
        <p class="em-card__body">Active loading animation powered by custom CSS keyframe spins.</p>
        <div class="em-loader" aria-label="Loading"></div>
      </section>
    </main>
  </div>
</body>
</html>
