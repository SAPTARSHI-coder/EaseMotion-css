<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Zoom-In Stepper | Glassmorphism UI</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <main class="container">

    <section class="glass-card">

      <h1>Project Setup Progress</h1>
      <p class="subtitle">
        CSS Zoom-In Stepper for Glassmorphism Layouts
      </p>

      <div class="stepper">

        <div class="step active">
          <span class="step-number">1</span>
          <div class="step-content">
            <h3>Planning</h3>
            <p>Define project requirements</p>
          </div>
        </div>


        <div class="connector"></div>


        <div class="step active">
          <span class="step-number">2</span>
          <div class="step-content">
            <h3>Design</h3>
            <p>Create glass UI components</p>
          </div>
        </div>


        <div class="connector"></div>


        <div class="step active">
          <span class="step-number">3</span>
          <div class="step-content">
            <h3>Development</h3>
            <p>Build responsive layouts</p>
          </div>
        </div>


        <div class="connector"></div>


        <div class="step">
          <span class="step-number">4</span>
          <div class="step-content">
            <h3>Launch</h3>
            <p>Deploy final product</p>
          </div>
        </div>

      </div>

    </section>

  </main>


</body>
</html>
