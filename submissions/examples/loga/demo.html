<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EaseMotion - Fold Out Drop Down Demo</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }

    .container {
      width: 320px;
    }

    .controls {
      margin-bottom: 24px;
      display: flex;
      gap: 12px;
    }

    button {
      background-color: #3b82f6;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: #2563eb;
    }

    .dropdown-card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 16px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
    }

    .dropdown-item {
      padding: 10px 12px;
      border-radius: 4px;
      margin-bottom: 4px;
      background-color: #334155;
    }

    .dropdown-item:last-child {
      margin-bottom: 0;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="controls">
      <button id="triggerBtn">Toggle Dropdown</button>
    </div>

    <div id="dropdownMenu" class="dropdown-card hidden">
      <div class="dropdown-item">Account Settings</div>
      <div class="dropdown-item">Privacy & Security</div>
      <div class="dropdown-item">Billing Preferences</div>
      <div class="dropdown-item">Sign Out</div>
    </div>
  </div>

  <script>
    const btn = document.getElementById('triggerBtn');
    const menu = document.getElementById('dropdownMenu');

    btn.addEventListener('click', () => {
      if (menu.classList.contains('hidden')) {
        menu.classList.remove('hidden', 'ease-anim-fold-out-drop-down');
        // Force reflow for re-triggering animation
        void menu.offsetWidth;
        menu.classList.add('ease-anim-fold-out-drop-down');
      } else {
        menu.classList.add('hidden');
      }
    });
  </script>
</body>
</html>
