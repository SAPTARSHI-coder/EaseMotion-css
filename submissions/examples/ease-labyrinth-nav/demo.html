<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Labyrinth Nav · Maze Path Reveal</title>

    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <div class="card">
        <h2>🌀 Labyrinth Nav</h2>
        <p class="sub">items reveal path like a maze</p>

        <!-- === LABYRINTH NAV === -->
        <nav class="labyrinth-nav" id="labyrinthNav">
            <ul class="labyrinth-grid">
                <li class="labyrinth-item">
                    <a href="#" class="labyrinth-link" data-path="A">
                        <i class="fas fa-home"></i>
                        <span>Home</span>
                    </a>
                </li>
                <li class="labyrinth-item">
                    <a href="#" class="labyrinth-link" data-path="B">
                        <i class="fas fa-compass"></i>
                        <span>Explore</span>
                    </a>
                </li>
                <li class="labyrinth-item">
                    <a href="#" class="labyrinth-link" data-path="C">
                        <i class="fas fa-images"></i>
                        <span>Gallery</span>
                    </a>
                </li>
                <li class="labyrinth-item">
                    <a href="#" class="labyrinth-link" data-path="D">
                        <i class="fas fa-blog"></i>
                        <span>Blog</span>
                    </a>
                </li>
                <li class="labyrinth-item">
                    <a href="#" class="labyrinth-link" data-path="E">
                        <i class="fas fa-envelope"></i>
                        <span>Contact</span>
                    </a>
                </li>
                <li class="labyrinth-item">
                    <a href="#" class="labyrinth-link" data-path="F">
                        <i class="fas fa-user"></i>
                        <span>Profile</span>
                    </a>
                </li>
                <li class="labyrinth-item">
                    <a href="#" class="labyrinth-link" data-path="G">
                        <i class="fas fa-cog"></i>
                        <span>Settings</span>
                    </a>
                </li>
                <li class="labyrinth-item">
                    <a href="#" class="labyrinth-link" data-path="H">
                        <i class="fas fa-question-circle"></i>
                        <span>Help</span>
                    </a>
                </li>
                <li class="labyrinth-item">
                    <a href="#" class="labyrinth-link" data-path="I">
                        <i class="fas fa-star"></i>
                        <span>Favorites</span>
                    </a>
                </li>
            </ul>
        </nav>

        <p style="margin-top: 2rem; font-size: 0.85rem; color: #64748b;">
            Hover · watch the maze path reveal itself
        </p>
    </div>

    <!-- Embedded JavaScript -->
    <script>
        (function() {
            'use strict';

            const nav = document.getElementById('labyrinthNav');
            const items = document.querySelectorAll('.labyrinth-item');

            // Click feedback
            items.forEach(item => {
                const link = item.querySelector('.labyrinth-link');
                link.addEventListener('click', function(e) {
                    e.preventDefault();
                    item.classList.add('clicked');
                    setTimeout(() => {
                        item.classList.remove('clicked');
                    }, 300);
                    const label = this.querySelector('span')?.textContent || 'Item';
                    const path = this.getAttribute('data-path') || '?';
                    console.log(`🌀 Path ${path}: ${label}`);
                });

                // Keyboard accessibility
                link.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        this.click();
                    }
                });
            });

            // Keyboard navigation between items
            const links = document.querySelectorAll('.labyrinth-link');
            links.forEach((link, index) => {
                link.addEventListener('keydown', function(e) {
                    const currentIndex = Array.from(links).indexOf(this);
                    let newIndex = -1;

                    if (e.key === 'ArrowRight') {
                        e.preventDefault();
                        newIndex = (currentIndex + 1) % links.length;
                    } else if (e.key === 'ArrowLeft') {
                        e.preventDefault();
                        newIndex = (currentIndex - 1 + links.length) % links.length;
                    } else if (e.key === 'ArrowDown') {
                        e.preventDefault();
                        newIndex = (currentIndex + 3) % links.length;
                    } else if (e.key === 'ArrowUp') {
                        e.preventDefault();
                        newIndex = (currentIndex - 3 + links.length) % links.length;
                    }

                    if (newIndex !== -1) {
                        links[newIndex].focus();
                    }
                });
            });

            // Reset animation on hover
            nav.addEventListener('mouseenter', function() {
                const items = this.querySelectorAll('.labyrinth-item');
                items.forEach(item => {
                    item.style.animation = 'none';
                    void item.offsetWidth;
                    item.style.animation = '';
                });
            });

            console.log('🌀 Labyrinth nav initialized!');

        })();
    </script>

</body>
</html>
