<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scroll Count Progress</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="top-progress" id="topProgress"></div>

  <main class="content">
    <section class="block">
      <h1>Scroll Count Progress</h1>
      <p>A top progress bar tracks scroll position, and the stat below counts up once visible.</p>
    </section>

    <section class="block stat-block">
      <span class="stat-number" id="statNumber" data-target="8500">0</span>
      <span class="stat-label">Happy users</span>
    </section>

    <section class="block"><p>More content to enable scrolling.</p></section>
    <section class="block"><p>More content to enable scrolling.</p></section>
  </main>

  <script>
    const bar = document.getElementById('topProgress');
    function updateBar() {
      const scrollable = document.documentElement.scrollHeight - window.innerHeight;
      const pct = scrollable > 0 ? (window.scrollY / scrollable) * 100 : 0;
      bar.style.width = pct + '%';
    }
    document.addEventListener('scroll', updateBar, { passive: true });
    updateBar();

    const statEl = document.getElementById('statNumber');
    const target = parseInt(statEl.dataset.target, 10);
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    function animateCount() {
      if (reduceMotion) {
        statEl.textContent = target.toLocaleString();
        return;
      }
      let current = 0;
      const duration = 1200;
      const start = performance.now();
      function tick(now) {
        const progress = Math.min((now - start) / duration, 1);
        current = Math.floor(progress * target);
        statEl.textContent = current.toLocaleString();
        if (progress < 1) requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    }

    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          animateCount();
          observer.disconnect();
        }
      });
    }, { threshold: 0.6 });

    observer.observe(document.querySelector('.stat-block'));
  </script>
</body>
</html>
