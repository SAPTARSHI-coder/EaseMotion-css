<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Spending Category Card</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="card-container">

  <div class="spending-card">
    <div class="card-header">
      <span class="icon">🍔</span>
      <div>
        <h2>Food & Dining</h2>
        <p>Monthly Budget Tracking</p>
      </div>
    </div>

    <div class="amounts">
      <span>$650 Spent</span>
      <span>$800 Budget</span>
    </div>

    <div class="progress-track">
      <div class="progress-fill food"></div>
    </div>

    <div class="status">
      <span>81% Used</span>
      <span class="good">Under Budget</span>
    </div>
  </div>

  <div class="spending-card">
    <div class="card-header">
      <span class="icon">🚗</span>
      <div>
        <h2>Transportation</h2>
        <p>Monthly Budget Tracking</p>
      </div>
    </div>

    <div class="amounts">
      <span>$280 Spent</span>
      <span>$500 Budget</span>
    </div>

    <div class="progress-track">
      <div class="progress-fill transport"></div>
    </div>

    <div class="status">
      <span>56% Used</span>
      <span class="good">Healthy</span>
    </div>
  </div>

  <div class="spending-card">
    <div class="card-header">
      <span class="icon">🛍️</span>
      <div>
        <h2>Shopping</h2>
        <p>Monthly Budget Tracking</p>
      </div>
    </div>

    <div class="amounts">
      <span>$950 Spent</span>
      <span>$900 Budget</span>
    </div>

    <div class="progress-track">
      <div class="progress-fill shopping"></div>
    </div>

    <div class="status">
      <span>106% Used</span>
      <span class="warning">Over Budget</span>
    </div>
  </div>

</div>

</body>
</html>
