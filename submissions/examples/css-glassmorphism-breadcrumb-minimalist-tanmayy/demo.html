<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Glassmorphism Breadcrumb - EaseMotion CSS</title>
  <!-- Import EaseMotion CSS -->
  <link rel="stylesheet" href="../../../easemotion.css">
  <!-- Component Specific Styles -->
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body class="minimalist-bg">

  <div class="demo-container">
    
    <div class="header-section">
      <h1 class="ease-text-3xl">Glassmorphism Breadcrumb</h1>
      <p class="ease-color-muted">A premium, hardware-accelerated navigation trail. Showcasing pristine backdrop-filter blurring, pill-shaped minimalism, and seamless OS theme integration.</p>
    </div>

    <!-- The Component Viewport -->
    <div class="glass-viewport" aria-label="Interactive glassmorphism breadcrumb showcase" role="region">
      
      <!-- The Ambient Background Engine (Blobs to highlight the glass effect) -->
      <div class="ambient-background">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
      </div>
      
      <!-- The Glassmorphism Breadcrumb -->
      <nav class="glass-breadcrumb" aria-label="Breadcrumb">
        <ol class="breadcrumb-list">
          
          <li class="breadcrumb-item">
            <a href="#" class="breadcrumb-link" aria-label="Home">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
            </a>
          </li>
          
          <li class="breadcrumb-item">
            <a href="#" class="breadcrumb-link">Dashboard</a>
          </li>
          
          <li class="breadcrumb-item">
            <a href="#" class="breadcrumb-link">Settings</a>
          </li>
          
          <li class="breadcrumb-item">
            <a href="#" class="breadcrumb-link">Account</a>
          </li>
          
          <li class="breadcrumb-item active" aria-current="page">
            <span class="breadcrumb-text">Security Profiles</span>
          </li>
          
        </ol>
      </nav>
      
    </div>

  </div>

</body>
</html>
