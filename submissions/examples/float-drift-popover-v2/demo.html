```
<main class="page">

    <h1>Float-Drift Popover</h1>

    <p>
        A lightweight CSS popover with a smooth floating animation.
    </p>

    <div class="popover-container">

        <button class="trigger">
            Account Details
        </button>

        <div class="popover">

            <div class="popover-header">
                <div class="avatar">
                    S
                </div>

                <div>
                    <h2>Srujana</h2>
                    <p>Premium Account</p>
                </div>
            </div>

            <div class="balance">
                <span>Available Balance</span>
                <strong>₹25,840</strong>
            </div>

            <div class="popover-actions">
                <a href="#">View Account</a>
                <a href="#">Transactions</a>
            </div>

        </div>

    </div>

</main>
```
