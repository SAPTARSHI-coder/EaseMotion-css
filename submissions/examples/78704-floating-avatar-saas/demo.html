<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floating Avatar - SaaS Modern</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="page">
        <section class="hero">
            <span class="eyebrow">TEAM WORKSPACE</span>

            <h1>
                Meet your
                <span>workspace team.</span>
            </h1>

            <p class="hero-text">
                A modern floating avatar component designed for SaaS dashboards,
                collaboration tools, and team-based applications.
            </p>

            <div class="avatar-stage">

                <div class="avatar-card avatar-card-main">
                    <div class="avatar-wrap">
                        <img
                            src="https://i.pravatar.cc/160?img=12"
                            alt="Alex Morgan"
                        >
                        <span class="online-dot"></span>
                    </div>

                    <div class="user-info">
                        <strong>Alex Morgan</strong>
                        <span>Product Designer</span>
                    </div>

                    <button class="message-btn" aria-label="Message Alex">
                        →
                    </button>
                </div>

                <div class="avatar-card avatar-card-one">
                    <div class="avatar-wrap small">
                        <img
                            src="https://i.pravatar.cc/120?img=32"
                            alt="Sarah Wilson"
                        >
                        <span class="online-dot"></span>
                    </div>

                    <div class="mini-info">
                        <strong>Sarah</strong>
                        <span>Online</span>
                    </div>
                </div>

                <div class="avatar-card avatar-card-two">
                    <div class="avatar-wrap small">
                        <img
                            src="https://i.pravatar.cc/120?img=49"
                            alt="Michael Lee"
                        >
                        <span class="online-dot"></span>
                    </div>

                    <div class="mini-info">
                        <strong>Michael</strong>
                        <span>Developer</span>
                    </div>
                </div>

                <div class="avatar-card avatar-card-three">
                    <div class="avatar-wrap small">
                        <img
                            src="https://i.pravatar.cc/120?img=47"
                            alt="Emma Davis"
                        >
                    </div>

                    <div class="mini-info">
                        <strong>Emma</strong>
                        <span>Marketing</span>
                    </div>
                </div>

                <div class="floating-label">
                    <span class="pulse"></span>
                    4 members online
                </div>

                <div class="orbit orbit-one"></div>
                <div class="orbit orbit-two"></div>

            </div>
        </section>
    </main>

</body>
</html>
