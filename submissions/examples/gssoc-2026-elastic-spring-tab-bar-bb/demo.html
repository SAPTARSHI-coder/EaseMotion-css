<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elastic Spring Tab Bar | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="nav-wrapper">
    <nav class="elastic-tab-bar">
      <input type="radio" id="tab-1" name="tab-group" checked>
      <label for="tab-1" class="tab-item">
        <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        <span class="tab-label">Home</span>
      </label>

      <input type="radio" id="tab-2" name="tab-group">
      <label for="tab-2" class="tab-item">
        <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <span class="tab-label">Explore</span>
      </label>

      <input type="radio" id="tab-3" name="tab-group">
      <label for="tab-3" class="tab-item">
        <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        <span class="tab-label">Alerts</span>
      </label>

      <input type="radio" id="tab-4" name="tab-group">
      <label for="tab-4" class="tab-item">
        <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span class="tab-label">Profile</span>
      </label>

      <div class="spring-indicator"></div>
    </nav>
  </div>
</body>
</html>
