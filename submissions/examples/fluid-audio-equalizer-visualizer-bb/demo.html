<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fluid Audio Equalizer Visualizer Demo - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <header class="header">
      <span class="badge">CSS Audio Motion & Keyframe Waves</span>
      <h1 class="title">Fluid Audio Equalizer</h1>
      <p class="subtitle">Interactive music player visualizer component featuring multi-frequency staggered audio bar motion and ambient glow spectrum effects.</p>
    </header>

    <div class="player-card" tabindex="0" aria-label="Audio Visualizer Player Card">
      <div class="album-art">
        <div class="disc-vinyl">🎵</div>
      </div>
      <div class="track-info">
        <span class="track-genre">Synthwave • 128 BPM</span>
        <h2>Cybernetic Resonance</h2>
        <p>EaseMotion Audio Experience</p>
      </div>

      <div class="equalizer-bars" aria-hidden="true">
        <span class="bar bar-1"></span>
        <span class="bar bar-2"></span>
        <span class="bar bar-3"></span>
        <span class="bar bar-4"></span>
        <span class="bar bar-5"></span>
        <span class="bar bar-6"></span>
        <span class="bar bar-7"></span>
        <span class="bar bar-8"></span>
      </div>

      <div class="player-controls">
        <button type="button" class="ctrl-btn" aria-label="Previous Track">⏮</button>
        <button type="button" class="ctrl-btn play-btn" aria-label="Play Pause Track">⏸</button>
        <button type="button" class="ctrl-btn" aria-label="Next Track">⏭</button>
      </div>
    </div>
  </main>
</body>
</html>
