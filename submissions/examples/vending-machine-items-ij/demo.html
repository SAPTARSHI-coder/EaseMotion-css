<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-vending-machine-items demo</title>
</head>
<body>
<div class="vn-app">
  <span class="vn-title">VENDING</span>
  <div class="vn-racks">
    <div class="vn-row">
      <div class="vn-coil"><span class="vn-can vn-can-a"></span></div>
      <div class="vn-coil"><span class="vn-can vn-can-b"></span></div>
      <div class="vn-coil"><span class="vn-can vn-can-c"></span></div>
    </div>
    <div class="vn-row">
      <div class="vn-coil"><span class="vn-can vn-can-d"></span></div>
      <div class="vn-coil"><span class="vn-can vn-can-e"></span></div>
      <div class="vn-coil"><span class="vn-can vn-can-f"></span></div>
    </div>
  </div>
  <div class="vn-chute">
    <span class="vn-drop"></span>
  </div>
  <div class="vn-hatch"><span class="vn-price">$1.25</span></div>
</div>
</body>
</html>
