<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
        name="description"
        content="Pure CSS animated form validation error demonstration"
    >
    <title>EaseMotion CSS — Animated Form Error</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="page">
        <section class="demo-card" aria-labelledby="demo-title">

            <div class="demo-header">
                <p class="eyebrow">EaseMotion CSS</p>

                <h1 id="demo-title">Animated Form Error</h1>

                <p class="description">
                    A smooth CSS-only validation error animation that drops
                    into view with a spring-like motion.
                </p>
            </div>

            <form class="form" novalidate>

                <div class="form-field">

                    <label for="email">Email address</label>

                    <input
                        id="email"
                        name="email"
                        type="email"
                        class="input"
                        placeholder="you@example.com"
                        aria-describedby="email-error"
                        required
                    >

                    <div
                        id="email-error"
                        class="form-error"
                        role="alert"
                    >
                        <span class="error-icon" aria-hidden="true">!</span>

                        <span>
                            Please enter a valid email address.
                        </span>
                    </div>

                </div>

                <button type="submit" class="submit-button">
                    Continue
                </button>

            </form>

            <div class="demo-note">
                <strong>CSS only</strong>
                <span>No JavaScript or external libraries required.</span>
            </div>

        </section>
    </main>
</body>
</html>
