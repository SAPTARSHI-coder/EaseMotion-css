<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Range Slider Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="slider-container">
    <h2 class="title">Custom Range Slider</h2>
    <div class="range-wrapper">
      <input 
        type="range" 
        min="0" 
        max="100" 
        value="50" 
        class="custom-range" 
        aria-label="Value range slider"
      >
    </div>
  </main>
</body>
</html>
