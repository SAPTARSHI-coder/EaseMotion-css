<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <meta
    name="description"
    content="Accessible pure CSS holographic flicker card component"
  >
  <title>Holographic Flicker Card</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="demo">
    <section
      class="holo-card"
      tabindex="0"
      aria-labelledby="card-title"
    >
      <div class="holo-card__shine" aria-hidden="true"></div>
      <div class="holo-card__noise" aria-hidden="true"></div>

      <div class="holo-card__content">
        <span class="holo-card__badge">
          CSS Component
        </span>

        <div class="holo-card__icon" aria-hidden="true">
          ✦
        </div>

        <h1 id="card-title">
          Holographic Flicker
        </h1>

        <p>
          A lightweight holographic card effect created entirely
          with semantic HTML and vanilla CSS.
        </p>

        <div class="holo-card__meta">
          <span>Pure CSS</span>
          <span>GPU Friendly</span>
          <span>Accessible</span>
        </div>

        <a
          class="holo-card__action"
          href="#demo"
          aria-label="Explore holographic flicker component"
        >
          Explore component
          <span aria-hidden="true">→</span>
        </a>
      </div>
    </section>
  </main>
</body>
</html>
