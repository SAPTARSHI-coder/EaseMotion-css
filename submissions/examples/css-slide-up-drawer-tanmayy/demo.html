<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Slide-Up Drawer - EaseMotion CSS</title>
  <!-- Import EaseMotion CSS -->
  <link rel="stylesheet" href="../../../easemotion.css">
  <!-- Component Specific Styles -->
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="checkout-bg">

  <div class="demo-container">
    
    <div class="checkout-panel ease-glass-card">
      <div class="checkout-header">
        <h2 class="ease-text-xl">Review Order</h2>
      </div>

      <div class="checkout-section">
        <div class="section-header">
          <h3>Shipping Address</h3>
          <!-- Button acting as Drawer Trigger (linked to hidden checkbox) -->
          <label for="drawer-toggle" class="edit-btn" tabindex="0">Change</label>
        </div>
        <div class="address-card">
          <strong>Jane Doe</strong>
          <p>123 UI/UX Boulevard, Suite 4B<br>San Francisco, CA 94107</p>
        </div>
      </div>
      
      <div class="checkout-section">
        <div class="section-header">
          <h3>Payment Method</h3>
          <button class="edit-btn">Edit</button>
        </div>
        <div class="payment-card">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect><line x1="1" y1="10" x2="23" y2="10"></line></svg>
          <span>Visa ending in 4242</span>
        </div>
      </div>

      <div class="checkout-footer">
        <button class="pay-btn ease-squish-button">Place Order - $249.00</button>
      </div>
    </div>

  </div>

  <!-- 
    ========================================
    Slide-Up Drawer Component 
    ======================================== 
  -->
  
  <!-- Hidden Checkbox for Drawer State -->
  <input type="checkbox" id="drawer-toggle" class="drawer-checkbox">
  
  <!-- Drawer Overlay / Backdrop -->
  <div class="drawer-overlay">
    
    <!-- Close trigger covering entire background -->
    <label for="drawer-toggle" class="drawer-close-backdrop"></label>
    
    <!-- The Slide-Up Drawer Container -->
    <div class="slide-up-drawer">
      
      <!-- A small handle for mobile aesthetics -->
      <div class="drawer-handle"></div>
      
      <div class="drawer-header">
        <h3 class="drawer-title">Select Address</h3>
        <label for="drawer-toggle" class="drawer-close-btn" aria-label="Close drawer">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </label>
      </div>
      
      <div class="drawer-body">
        
        <!-- Address List (Radio Group) -->
        <label class="address-option">
          <input type="radio" name="selected_address" checked>
          <div class="address-details">
            <strong>Jane Doe (Home)</strong>
            <p>123 UI/UX Boulevard, Suite 4B</p>
          </div>
          <div class="radio-circle"></div>
        </label>
        
        <label class="address-option">
          <input type="radio" name="selected_address">
          <div class="address-details">
            <strong>Jane Doe (Work)</strong>
            <p>888 Corporate Drive, Floor 12</p>
          </div>
          <div class="radio-circle"></div>
        </label>
        
        <button class="add-new-btn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          Add New Address
        </button>
        
      </div>
      
      <div class="drawer-footer">
        <label for="drawer-toggle" class="save-btn ease-squish-button">Confirm Selection</label>
      </div>
      
    </div>
  </div>

</body>
</html>
