<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS color-mix Theme Interpolation Demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }
    
    .demo-container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px;
      box-sizing: border-box;
    }

    .card {
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      max-width: 500px;
      
      /* The card background will also be mixed relative to the main background */
      /* Let's make it slightly translucent to show off the blending */
      background: inherit;
      filter: brightness(0.95);
    }
    
    h1 { margin-top: 0; }
  </style>
</head>
<body>

  <!-- The main container holding the dynamic theme interpolator -->
  <div id="theme-wrapper" class="demo-container em-theme-interpolator">
    
    <div class="card">
      <h1>Dynamic Theme Interpolation</h1>
      <p>Click the button below to seamlessly transition between a Light/Warm theme and a Dark/Cool theme.</p>
      <p>This is achieved entirely in CSS using the <code>color-mix()</code> function and an animatable <code>@property</code> percentage variable. No SASS or complex color math required!</p>
      
      <br>
      <button class="btn-theme" onclick="toggleTheme()">Toggle Theme</button>
    </div>

  </div>

  <script>
    function toggleTheme() {
      const wrapper = document.getElementById('theme-wrapper');
      wrapper.classList.toggle('theme-b-active');
    }
  </script>

</body>
</html>
