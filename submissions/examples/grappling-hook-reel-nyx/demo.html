<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grappling Hook Reel — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Grappling Hook Reel demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Grappling Hook Reel</h1>
      <p class="lede">Grappling hook flying then reeling back on cable</p>
    </header>

    <section class="ease-grappling-hook-reel" data-demo="grappling-hook-reel" aria-live="polite">
      <div class="ease-grappling-hook-reel__housing">
        <div class="ease-grappling-hook-reel__bezel">
          <div class="ease-grappling-hook-reel__face">
            <div class="ease-grappling-hook-reel__readout">
              <span class="ease-grappling-hook-reel__label">Grappling Hook Reel</span>
              <span class="ease-grappling-hook-reel__value">LIVE</span>
            </div>
            <div class="ease-grappling-hook-reel__motion" aria-hidden="true">
              <span class="ease-grappling-hook-reel__a"></span>
              <span class="ease-grappling-hook-reel__b"></span>
              <span class="ease-grappling-hook-reel__c"></span>
              <span class="ease-grappling-hook-reel__d"></span>
            </div>
            <div class="ease-grappling-hook-reel__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-grappling-hook-reel__controls">
          <button type="button" class="ease-grappling-hook-reel__btn primary">Engage</button>
          <button type="button" class="ease-grappling-hook-reel__btn">Reset</button>
          <label class="ease-grappling-hook-reel__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-grappling-hook-reel__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
