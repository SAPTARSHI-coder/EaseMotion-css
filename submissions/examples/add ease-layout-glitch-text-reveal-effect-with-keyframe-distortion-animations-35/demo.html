<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glassmorphic Glitch Reveal</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;800&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Vibrant background blobs for glassmorphism to refract -->
    <div class="bg-blob blob-1"></div>
    <div class="bg-blob blob-2"></div>
    <div class="bg-blob blob-3"></div>

    <div class="glass-layout">
        <main class="glass-card">
            <div class="card-content">
                <span class="badge">Hover to Reveal</span>
                
                <div class="glitch-wrapper">
                    <!-- The text uses data-text for the pseudo-element glitch trick -->
                    <h1 class="glitch-text" data-text="AESTHETIC">AESTHETIC</h1>
                </div>
                
                <p class="description">
                    Premium glassmorphism combined with a clean, high-fidelity keyframe distortion effect.
                </p>
            </div>
        </main>
    </div>
</body>
</html>
