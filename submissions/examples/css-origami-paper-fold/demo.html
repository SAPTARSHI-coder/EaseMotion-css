<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Pure CSS animated origami paper fold background"
  >
  <title>CSS Origami Paper Fold</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="origami-scene" aria-label="Animated origami paper fold background">
    <div class="fold fold-1" aria-hidden="true"></div>
    <div class="fold fold-2" aria-hidden="true"></div>
    <div class="fold fold-3" aria-hidden="true"></div>
    <div class="fold fold-4" aria-hidden="true"></div>
    <div class="fold fold-5" aria-hidden="true"></div>
    <div class="fold fold-6" aria-hidden="true"></div>

    <section class="content">
      <span class="eyebrow">CSS Background Animation</span>
      <h1>Origami Paper Fold</h1>
      <p>
        Layered paper-like surfaces gently fold and unfold using pure CSS.
      </p>
    </section>
  </main>
</body>
</html>
