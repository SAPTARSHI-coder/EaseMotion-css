<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liquid Memory</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">
    <section class="liquid-card">

      <div class="header">
        <div>
          <span class="eyebrow">INTERACTIVE MEMORY</span>
          <h1>Liquid Memory</h1>
          <p>
            Touch the surface and leave a temporary memory behind.
          </p>
        </div>

        <div class="stats">
          <div class="stat">
            <span class="stat-label">Memories</span>
            <strong id="memoryCount">0</strong>
          </div>

          <div class="stat">
            <span class="stat-label">Interactions</span>
            <strong id="interactionCount">0</strong>
          </div>
        </div>
      </div>

      <div
        class="liquid-display"
        id="liquidDisplay"
        tabindex="0"
        aria-label="Interactive liquid memory surface"
      >

        <div class="liquid-glow" id="liquidGlow"></div>

        <div class="surface-shine"></div>

        <div class="center-message" id="centerMessage">
          <span class="message-icon">◌</span>
          <span>Touch the surface</span>
        </div>

        <div class="memories" id="memories"></div>

      </div>

      <div class="controls">

        <button
          class="control-button primary"
          id="createButton"
          type="button"
        >
          + Create Memory
        </button>

        <button
          class="control-button"
          id="clearButton"
          type="button"
        >
          Clear Memories
        </button>

      </div>

      <div class="status" id="status">
        Surface is waiting for interaction
      </div>

    </section>
  </main>

  <script>
    const liquidDisplay = document.getElementById("liquidDisplay");
    const memories = document.getElementById("memories");
    const liquidGlow = document.getElementById("liquidGlow");

    const memoryCount = document.getElementById("memoryCount");
    const interactionCount = document.getElementById("interactionCount");

    const createButton = document.getElementById("createButton");
    const clearButton = document.getElementById("clearButton");
    const status = document.getElementById("status");
    const centerMessage = document.getElementById("centerMessage");

    const MAX_MEMORIES = 18;
    const MEMORY_LIFETIME = 6000;

    let totalInteractions = 0;
    let activeMemories = 0;

    let pointerX = 50;
    let pointerY = 50;

    function updateCounters() {
      memoryCount.textContent = activeMemories;
      interactionCount.textContent = totalInteractions;
    }

    function updateStatus(message) {
      status.textContent = message;
    }

    function createRipple(x, y) {
      const ripple = document.createElement("span");

      ripple.className = "ripple";

      ripple.style.left = `${x}px`;
      ripple.style.top = `${y}px`;

      const size = 120 + Math.random() * 120;

      ripple.style.width = `${size}px`;
      ripple.style.height = `${size}px`;

      liquidDisplay.appendChild(ripple);

      ripple.addEventListener("animationend", () => {
        ripple.remove();
      });
    }

    function createMemory(x, y) {
      if (activeMemories >= MAX_MEMORIES) {
        const oldest = memories.firstElementChild;

        if (oldest) {
          oldest.remove();
          activeMemories--;
        }
      }

      const memory = document.createElement("span");

      memory.className = "memory";

      const size = 18 + Math.random() * 24;
      const driftX = -35 + Math.random() * 70;
      const driftY = -90 - Math.random() * 100;
      const duration = 3.5 + Math.random() * 3;

      memory.style.left = `${x}px`;
      memory.style.top = `${y}px`;

      memory.style.width = `${size}px`;
      memory.style.height = `${size}px`;

      memory.style.setProperty("--drift-x", `${driftX}px`);
      memory.style.setProperty("--drift-y", `${driftY}px`);
      memory.style.setProperty(
        "--duration",
        `${duration}s`
      );

      memory.style.animationDelay = `${Math.random() * 0.25}s`;

      memory.dataset.created = Date.now();

      memories.appendChild(memory);

      activeMemories++;
      totalInteractions++;

      updateCounters();

      centerMessage.classList.add("hidden");

      updateStatus(
        `Memory created · ${activeMemories} active`
      );

      setTimeout(() => {
        if (memory.isConnected) {
          memory.classList.add("dissolving");

          setTimeout(() => {
            if (memory.isConnected) {
              memory.remove();
              activeMemories = Math.max(0, activeMemories - 1);
              updateCounters();

              if (activeMemories === 0) {
                centerMessage.classList.remove("hidden");
                updateStatus(
                  "All memories have dissolved"
                );
              }
            }
          }, 900);
        }
      }, MEMORY_LIFETIME);
    }

    function interact(x, y) {
      createRipple(x, y);
      createMemory(x, y);
    }

    function randomInteraction() {
      const rect = liquidDisplay.getBoundingClientRect();

      const x = rect.width * (0.2 + Math.random() * 0.6);
      const y = rect.height * (0.25 + Math.random() * 0.5);

      interact(x, y);
    }

    liquidDisplay.addEventListener("pointermove", (event) => {
      const rect = liquidDisplay.getBoundingClientRect();

      pointerX = event.clientX - rect.left;
      pointerY = event.clientY - rect.top;

      liquidGlow.style.left = `${pointerX}px`;
      liquidGlow.style.top = `${pointerY}px`;
    });

    liquidDisplay.addEventListener("pointerleave", () => {
      liquidGlow.style.opacity = "0";
    });

    liquidDisplay.addEventListener("pointerenter", () => {
      liquidGlow.style.opacity = "1";
    });

    liquidDisplay.addEventListener("pointerdown", (event) => {
      if (event.target.closest("button")) {
        return;
      }

      const rect = liquidDisplay.getBoundingClientRect();

      const x = event.clientX - rect.left;
      const y = event.clientY - rect.top;

      interact(x, y);
    });

    createButton.addEventListener("click", () => {
      randomInteraction();
    });

    clearButton.addEventListener("click", () => {
      memories.innerHTML = "";

      activeMemories = 0;

      updateCounters();

      centerMessage.classList.remove("hidden");

      updateStatus("All memories cleared");
    });

    document.addEventListener("keydown", (event) => {
      if (event.code === "Space") {
        event.preventDefault();

        randomInteraction();
      }

      if (event.key.toLowerCase() === "c") {
        memories.innerHTML = "";

        activeMemories = 0;

        updateCounters();

        centerMessage.classList.remove("hidden");

        updateStatus("All memories cleared");
      }
    });

    updateCounters();
  </script>

</body>
</html>
