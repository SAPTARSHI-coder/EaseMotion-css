<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neumorphic Button Demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* 
      For Neumorphism to work, the background color of the body 
      must exactly match the background color of the button.
    */
    body {
      background-color: var(--em-neumorphic-bg, #e0e5ec);
      color: #4a5568;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    .container {
      display: flex;
      gap: 32px;
      margin-top: 40px;
    }

    h1 {
      margin-top: 0;
    }
  </style>
</head>
<body>

  <h1>Soft UI / Neumorphism</h1>
  <p>Click the buttons below to see the soft UI press animation.</p>

  <div class="container">
    <button class="em-btn-soft">Click Me</button>
    <button class="em-btn-soft">Settings</button>
  </div>

</body>
</html>
