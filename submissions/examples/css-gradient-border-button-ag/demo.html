<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Gradient Border Button — EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #090d16;
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      line-height: 1.5;
    }

    .demo-container {
      max-width: 800px;
      width: 100%;
      background-color: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 1rem;
      padding: 2.5rem 2rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    .demo-header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    .demo-title {
      font-size: 1.875rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 0.5rem;
      letter-spacing: -0.025em;
    }

    .demo-subtitle {
      font-size: 1rem;
      color: #94a3b8;
    }

    .demo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1.5rem;
      align-items: center;
      justify-items: center;
      margin-bottom: 2rem;
    }

    .demo-card {
      width: 100%;
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 0.75rem;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      text-align: center;
    }

    .demo-card-label {
      font-size: 0.875rem;
      font-weight: 500;
      color: #cbd5e1;
    }

    .demo-footer {
      border-top: 1px solid #1e293b;
      padding-top: 1.25rem;
      text-align: center;
      font-size: 0.875rem;
      color: #64748b;
    }
  </style>
</head>
<body>

  <main class="demo-container">
    <header class="demo-header">
      <h1 class="demo-title">CSS Gradient Border Button</h1>
      <p class="demo-subtitle">Pure CSS animated rotating gradient border buttons with ambient glow</p>
    </header>

    <section class="demo-grid">
      <article class="demo-card">
        <span class="demo-card-label">Primary Variant</span>
        <button type="button" class="gradient-border-btn">
          <span>Get Started</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>
      </article>

      <article class="demo-card">
        <span class="demo-card-label">Sunset Palette</span>
        <button type="button" class="gradient-border-btn gradient-border-btn--sunset">
          <span>Explore Features</span>
        </button>
      </article>

      <article class="demo-card">
        <span class="demo-card-label">Pill Shape</span>
        <button type="button" class="gradient-border-btn gradient-border-btn--pill">
          <span>Upgrade Pro</span>
        </button>
      </article>

      <article class="demo-card">
        <span class="demo-card-label">Light Surface</span>
        <button type="button" class="gradient-border-btn gradient-border-btn--light">
          <span>Documentation</span>
        </button>
      </article>

      <article class="demo-card">
        <span class="demo-card-label">Disabled State</span>
        <button type="button" class="gradient-border-btn" disabled>
          <span>Unavailable</span>
        </button>
      </article>

      <article class="demo-card">
        <span class="demo-card-label">Focusable Demo</span>
        <button type="button" class="gradient-border-btn gradient-border-btn--sunset gradient-border-btn--pill">
          <span>Press Tab To Focus</span>
        </button>
      </article>
    </section>

    <footer class="demo-footer">
      <p>Accessible &bull; Zero JavaScript &bull; Responsive &bull; Reduced Motion Supported</p>
    </footer>
  </main>

</body>
</html>
