<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Asymmetric Hero Grid</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- 
          The Hero Grid Container
          Utilizes CSS Grid with asymmetric column spans and rows.
        -->
        <header class="hero-grid">
            
            <!-- Main Content Area (Spans multiple columns/rows) -->
            <div class="grid-item main-content">
                <div class="content-wrapper">
                    <span class="eyebrow">Design System 2.0</span>
                    <h1 class="hero-title">Build Digital Experiences Faster.</h1>
                    <p class="hero-desc">An asymmetric, modular CSS grid layout designed to break the mold of traditional 12-column symmetry while maintaining perfect responsiveness.</p>
                    <div class="cta-group">
                        <a href="#" class="btn btn-primary">Get Started</a>
                        <a href="#" class="btn btn-secondary">View Documentation</a>
                    </div>
                </div>
            </div>

            <!-- Image Block 1: Tall/Vertical -->
            <div class="grid-item img-tall">
                <div class="img-placeholder bg-blue">
                    <svg viewBox="0 0 24 24" width="48" height="48" stroke="rgba(255,255,255,0.8)" stroke-width="1.5" fill="none"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
                </div>
            </div>

            <!-- Image Block 2: Wide/Horizontal -->
            <div class="grid-item img-wide">
                <div class="img-placeholder bg-purple">
                    <svg viewBox="0 0 24 24" width="48" height="48" stroke="rgba(255,255,255,0.8)" stroke-width="1.5" fill="none"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
                </div>
            </div>

            <!-- Image Block 3: Small Square -->
            <div class="grid-item img-square">
                <div class="img-placeholder bg-orange">
                    <svg viewBox="0 0 24 24" width="48" height="48" stroke="rgba(255,255,255,0.8)" stroke-width="1.5" fill="none"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
                </div>
            </div>

        </header>
    </div>

</body>
</html>
