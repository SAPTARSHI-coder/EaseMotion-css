<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Crossfade #87555 Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="showcase-wrapper">
    <div class="crossfade-card" id="crossfadeCard">
      <div class="card-badge">CSS Continuous Crossfade</div>

      <!-- Base image (Day View) -->
      <img 
        src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1000&q=80" 
        alt="Mountain Lake Day" 
        class="crossfade-layer layer-bottom"
      >

      <!-- Overlay image (Night View) -->
      <img 
        src="https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=1000&q=80" 
        alt="Mountain Lake Night" 
        class="crossfade-layer layer-top"
      >
    </div>

    <div class="controls-bar">
      <span class="status-label" id="statusLabel">Status: Dissolving (Loop Active)</span>
      <button class="toggle-btn" id="pauseToggleBtn">Pause Loop</button>
    </div>
  </div>

  <script>
    const card = document.getElementById('crossfadeCard');
    const pauseBtn = document.getElementById('pauseToggleBtn');
    const statusLabel = document.getElementById('statusLabel');

    pauseBtn.addEventListener('click', () => {
      const isPaused = card.classList.toggle('paused');
      if (isPaused) {
        pauseBtn.textContent = 'Resume Loop';
        statusLabel.textContent = 'Status: Paused';
      } else {
        pauseBtn.textContent = 'Pause Loop';
        statusLabel.textContent = 'Status: Dissolving (Loop Active)';
      }
    });
  </script>
</body>
</html>
