<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="CSS haptic feedback button with tactile press animation"
  >
  <title>CSS Haptic Feedback Button</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">
    <section class="demo-card" aria-labelledby="title">
      <span class="eyebrow">EaseMotion CSS</span>

      <h1 id="title">Haptic Feedback Button</h1>

      <p class="description">
        A tactile button interaction that simulates a quick haptic
        response using only CSS.
      </p>

      <button class="haptic-button" type="button">
        <span class="button-icon" aria-hidden="true">
          <span></span>
        </span>
        <span class="button-text">Press &amp; Feel</span>
      </button>

      <p class="hint">
        Click, tap, or hold the button
      </p>
    </section>
  </main>

</body>
</html>
