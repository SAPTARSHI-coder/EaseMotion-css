<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snowfall Drift Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="winter">
    <div class="hill" aria-hidden="true"></div>
    <div class="flakes" id="flakes" aria-hidden="true"></div>
    <p class="hint">Snowflakes drift and sway on the wind, some larger and slower than others.</p>
  </main>
  <script>
    const flakes = document.getElementById("flakes");
    for (let i = 0; i < 30; i++) {
      const f = document.createElement("span");
      f.className = "flake";
      f.style.left = Math.random() * 100 + "%";
      f.style.setProperty("--size", (2 + Math.random() * 5).toFixed(1) + "px");
      f.style.setProperty("--dur", (4 + Math.random() * 5).toFixed(1) + "s");
      f.style.setProperty("--delay", (-Math.random() * 8).toFixed(1) + "s");
      f.style.setProperty("--sway", (14 + Math.random() * 22).toFixed(0) + "px");
      flakes.appendChild(f);
    }
  </script>
</body>
</html>
