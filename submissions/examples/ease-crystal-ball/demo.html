<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crystal Ball · swirling visions inside</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <div class="crystal-container">
      <div class="crystal-display" id="crystalDisplay">
        <!-- Crystal Ball -->
        <div class="crystal-ball" id="crystalBall">
          <!-- Glass Sphere -->
          <div class="sphere">
            <!-- Swirling Visions Container -->
            <div class="visions-container" id="visionsContainer">
              <div class="vision vision-1">🌟</div>
              <div class="vision vision-2">🌙</div>
              <div class="vision vision-3">⭐</div>
              <div class="vision vision-4">✨</div>
              <div class="vision vision-5">🌈</div>
              <div class="vision vision-6">🔥</div>
              <div class="vision vision-7">💫</div>
              <div class="vision vision-8">🌊</div>
              <div class="vision vision-9">🌺</div>
              <div class="vision vision-10">🦋</div>
              <div class="vision vision-11">🌅</div>
              <div class="vision vision-12">🌌</div>
            </div>
            
            <!-- Swirling Mist -->
            <div class="mist-layer mist-1"></div>
            <div class="mist-layer mist-2"></div>
            <div class="mist-layer mist-3"></div>
            
            <!-- Glass Highlights -->
            <div class="highlight highlight-1"></div>
            <div class="highlight highlight-2"></div>
            
            <!-- Crystal Glow -->
            <div class="crystal-glow" id="crystalGlow"></div>
          </div>
        </div>

        <!-- Vision Text -->
        <div class="vision-text" id="visionText">
          <span class="vision-label">🔮 The visions reveal...</span>
          <span class="vision-message" id="visionMessage">Look into the crystal ball</span>
        </div>

        <!-- Vision Counter -->
        <div class="vision-counter">
          <span class="counter-label">🔮 Visions</span>
          <span class="counter-value" id="visionCount">0</span>
        </div>
      </div>
      
      <div class="crystal-status">
        <span id="crystalStatus">🔮 Click the crystal ball to see a vision</span>
      </div>
    </div>

    <div class="controls">
      <button class="btn btn-vision" id="visionBtn">🔮 Show Vision</button>
      <button class="btn btn-mode" id="modeBtn">🌀 Toggle Swirl</button>
      <button class="btn btn-reset" id="resetBtn">⟳ Reset</button>
    </div>
    <div class="footer-note">
      <span>🔮 crystal ball · swirling visions · mystical prophecy</span>
    </div>
  </div>

  <script>
    (function() {
      "use strict";

      // DOM refs
      const crystalBall = document.getElementById('crystalBall');
      const visionsContainer = document.getElementById('visionsContainer');
      const visionMessage = document.getElementById('visionMessage');
      const visionCount = document.getElementById('visionCount');
      const crystalStatus = document.getElementById('crystalStatus');
      const crystalGlow = document.getElementById('crystalGlow');
      const visionBtn = document.getElementById('visionBtn');
      const modeBtn = document.getElementById('modeBtn');
      const resetBtn = document.getElementById('resetBtn');

      // State
      let count = 0;
      let isRevealing = false;
      let swirlMode = 0;
      let animationId = null;

      // Vision messages
      const visions = [
        { message: 'A great journey awaits you...', icon: '🌟' },
        { message: 'The stars align in your favor.', icon: '⭐' },
        { message: 'A new love is on the horizon.', icon: '🌙' },
        { message: 'Your destiny is calling.', icon: '🔮' },
        { message: 'Great wealth will come your way.', icon: '💎' },
        { message: 'A powerful ally will appear.', icon: '🦋' },
        { message: 'The path ahead is clear.', icon: '🌈' },
        { message: 'Trust your intuition today.', icon: '✨' },
        { message: 'A transformation is coming.', icon: '🔄' },
        { message: 'Peace and harmony await.', icon: '☮️' },
        { message: 'Your dreams will manifest.', icon: '💫' },
        { message: 'The universe protects you.', icon: '🌌' },
        { message: 'A new beginning is near.', icon: '🌅' },
        { message: 'Wisdom flows through you.', icon: '📜' },
        { message: 'Your light shines bright.', icon: '⭐' }
      ];

      // Vision positions for swirling animation
      const visionPositions = [
        { x: 50, y: 30 }, { x: 70, y: 20 }, { x: 85, y: 40 }, { x: 90, y: 60 },
        { x: 80, y: 80 }, { x: 60, y: 90 }, { x: 40, y: 85 }, { x: 20, y: 75 },
        { x: 10, y: 55 }, { x: 15, y: 35 }, { x: 30, y: 20 }, { x: 50, y: 15 }
      ];

      // Get random vision
      function getVision() {
        const index = Math.floor(Math.random() * visions.length);
        return visions[index];
      }

      // Update vision positions
      function updateVisionPositions(progress) {
        const visions = visionsContainer.querySelectorAll('.vision');
        visions.forEach((vision, index) => {
          const pos = visionPositions[index % visionPositions.length];
          const offset = progress * 20;
          const xOffset = Math.sin(progress * 2 + index) * 15;
          const yOffset = Math.cos(progress * 1.5 + index * 0.7) * 15;
          
          vision.style.left = (pos.x + xOffset) + '%';
          vision.style.top = (pos.y + yOffset) + '%';
          vision.style.transform = `scale(${0.6 + Math.sin(progress + index) * 0.2}) rotate(${progress * 50 + index * 30}deg)`;
          vision.style.opacity = 0.4 + Math.sin(progress * 0.8 + index) * 0.3;
        });
      }

      // Animate swirl
      function animateSwirl() {
        if (!isRevealing) return;
        
        const time = Date.now() / 1000;
        const progress = time * 0.3;
        
        updateVisionPositions(progress);
        
        // Update mist
        const mists = document.querySelectorAll('.mist-layer');
        mists.forEach((mist, index) => {
          const speed = 0.2 + index * 0.1;
          const offset = time * speed;
          mist.style.transform = `translateX(${Math.sin(offset) * 10}px) translateY(${Math.cos(offset * 0.7) * 10}px) scale(${1 + Math.sin(offset * 0.5) * 0.05})`;
        });
        
        animationId = requestAnimationFrame(animateSwirl);
      }

      // Show vision
      function showVision() {
        if (isRevealing) return;
        isRevealing = true;

        const vision = getVision();
        
        // Update count
        count++;
        visionCount.textContent = count;
        
        // Update message
        visionMessage.textContent = vision.message;
        visionMessage.style.color = '#fbbf24';
        
        // Activate glow
        crystalGlow.classList.add('active');
        crystalBall.classList.add('active');
        
        // Update status
        crystalStatus.textContent = `🔮 Vision revealed! ✨ (${count})`;
        crystalStatus.style.color = '#fbbf24';
        visionBtn.textContent = '🔮 Vision Revealed';
        visionBtn.style.background = 'linear-gradient(135deg, #fbbf24, #f59e0b)';
        visionBtn.style.borderColor = '#fcd34d';
        
        // Show visions
        visionsContainer.classList.add('active');
        
        // Start swirl animation
        if (animationId) {
          cancelAnimationFrame(animationId);
        }
        animateSwirl();
        
        // Reset after delay
        setTimeout(() => {
          // Keep swirling but allow new visions
          isRevealing = false;
          crystalStatus.textContent = '🔮 Click the crystal ball for another vision';
          crystalStatus.style.color = '#94a3b8';
          visionBtn.textContent = '🔮 Show Vision';
          visionBtn.style.background = 'linear-gradient(135deg, #6366f1, #4f46e5)';
          visionBtn.style.borderColor = '#818cf8';
        }, 3000);
      }

      // Toggle swirl mode
      function toggleSwirl() {
        swirlMode = (swirlMode + 1) % 3;
        const modes = ['Spiral', 'Wave', 'Chaos'];
        modeBtn.textContent = `🌀 ${modes[swirlMode]}`;
        
        // Adjust animation parameters
        const visions = visionsContainer.querySelectorAll('.vision');
        visions.forEach((vision, index) => {
          if (swirlMode === 0) {
            // Spiral - keep default
          } else if (swirlMode === 1) {
            // Wave - add wave motion
            vision.style.animation = `wave-vision 3s ease-in-out infinite`;
            vision.style.animationDelay = (index * 0.1) + 's';
          } else {
            // Chaos - random motion
            vision.style.animation = `chaos-vision 2s ease-in-out infinite alternate`;
            vision.style.animationDelay = (Math.random() * 0.5) + 's';
          }
        });
        
        crystalStatus.textContent = `🌀 Swirl: ${modes[swirlMode]}`;
        crystalStatus.style.color = '#a78bfa';
        setTimeout(() => {
          if (!isRevealing) {
            crystalStatus.textContent = '🔮 Click the crystal ball to see a vision';
            crystalStatus.style.color = '#94a3b8';
          }
        }, 1500);
      }

      // Reset
      function resetCrystal() {
        if (isRevealing) {
          isRevealing = false;
        }
        if (animationId) {
          cancelAnimationFrame(animationId);
          animationId = null;
        }
        
        count = 0;
        visionCount.textContent = '0';
        visionMessage.textContent = 'Look into the crystal ball';
        visionMessage.style.color = '#94a3b8';
        crystalGlow.classList.remove('active');
        crystalBall.classList.remove('active');
        visionsContainer.classList.remove('active');
        
        // Reset vision positions
        const visions = visionsContainer.querySelectorAll('.vision');
        visions.forEach((vision, index) => {
          const pos = visionPositions[index % visionPositions.length];
          vision.style.left = pos.x + '%';
          vision.style.top = pos.y + '%';
          vision.style.transform = 'scale(0.6) rotate(0deg)';
          vision.style.opacity = 0.3;
          vision.style.animation = 'none';
        });
        
        // Reset mists
        document.querySelectorAll('.mist-layer').forEach(mist => {
          mist.style.transform = 'none';
        });
        
        crystalStatus.textContent = '🔄 Reset complete';
        crystalStatus.style.color = '#94a3b8';
        visionBtn.textContent = '🔮 Show Vision';
        visionBtn.style.background = 'linear-gradient(135deg, #6366f1, #4f46e5)';
        visionBtn.style.borderColor = '#818cf8';
        setTimeout(() => {
          crystalStatus.textContent = '🔮 Click the crystal ball to see a vision';
        }, 1000);
      }

      // Event listeners
      if (visionBtn) {
        visionBtn.addEventListener('click', function(e) {
          e.preventDefault();
          showVision();
        });
      }

      if (modeBtn) {
        modeBtn.addEventListener('click', function(e) {
          e.preventDefault();
          toggleSwirl();
        });
      }

      if (resetBtn) {
        resetBtn.addEventListener('click', function(e) {
          e.preventDefault();
          resetCrystal();
        });
      }

      // Click on crystal ball to show vision
      crystalBall.addEventListener('click', function(e) {
        e.stopPropagation();
        showVision();
      });

      // Click on display to show vision
      const crystalDisplay = document.getElementById('crystalDisplay');
      crystalDisplay.addEventListener('click', function(e) {
        if (e.target === this) {
          showVision();
        }
      });

      // Keyboard shortcuts
      document.addEventListener('keydown', function(e) {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

        const key = e.key;
        if (key === ' ' || key === 'Space') {
          e.preventDefault();
          showVision();
        } else if (key === 'v' || key === 'V') {
          e.preventDefault();
          showVision();
        } else if (key === 's' || key === 'S') {
          e.preventDefault();
          toggleSwirl();
        } else if (key === 'r' || key === 'R') {
          e.preventDefault();
          resetCrystal();
        }
      });

      // Initialize
      console.log('🔮 Crystal Ball ready · shortcuts: [Space/V] Vision, [S] Swirl, [R] Reset');
    })();
  </script>
</body>
</html>
