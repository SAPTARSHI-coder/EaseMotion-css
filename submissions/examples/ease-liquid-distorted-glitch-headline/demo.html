<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ease WebGL/SVG Distortion Fluid Glitch Headline</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="glitch-text-body">
  <svg style="display:none">
    <filter id="liquidGlitch">
      <feTurbulence id="turb" type="fractalNoise" baseFrequency="0.02" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="20" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </svg>
  <h1 class="liquid-glitch-head" id="gHead">FLUID GLITCH</h1>
  <script>
    const turb = document.getElementById('turb');
    const head = document.getElementById('gHead');
    head.addEventListener('mousemove', (e) => {
      const val = 0.01 + (e.clientX / window.innerWidth) * 0.05;
      turb.setAttribute('baseFrequency', val);
    });
  </script>
</body>
</html>
