<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Level Up Banner - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Interactive Trigger (Placed as sibling above banner for CSS selector targets) -->
  <input type="checkbox" id="level-up-trigger" class="banner-trigger">

  <!-- Level Up Banner (alert landmark for screen-reader status announcements) -->
  <div class="banner-container" role="alert" aria-live="polite">
    
    <!-- Title and details -->
    <div class="banner-content">
      <h1 class="banner-title">LEVEL UP!</h1>
      <p class="banner-desc">You reached Level 25</p>
      <p class="banner-subtext">Click the action node below to re-trigger the congratulations burst.</p>
    </div>

    <!-- Radial Star Burst Stage -->
    <div class="burst-stage" aria-hidden="true">
      <div class="star s-1"></div>
      <div class="star s-2"></div>
      <div class="star s-3"></div>
      <div class="star s-4"></div>
      <div class="star s-5"></div>
      <div class="star s-6"></div>
      <div class="star s-7"></div>
      <div class="star s-8"></div>
      <div class="star s-9"></div>
      <div class="star s-10"></div>
      <div class="star s-11"></div>
      <div class="star s-12"></div>
    </div>

  </div>

  <!-- Trigger Control Box -->
  <div class="trigger-box">
    <label for="level-up-trigger" class="btn-trigger" role="button" tabindex="0"
           onkeydown="if(event.key === ' ' || event.key === 'Enter') document.getElementById('level-up-trigger').click()"></label>
  </div>

</body>
</html>
