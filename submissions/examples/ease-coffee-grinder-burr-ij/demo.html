<!-- EaseMotion component: coffee-grinder-burr -->
<!DOCTYPE html>
<html lang="en" data-coffee="burr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.5">
<title>Ease Coffee Grinder Burr</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="grind-unit">
  <header class="grind-head">
    <span class="grind-brand">BREWLAB</span>
    <span class="grind-setting">FINE</span>
  </header>
  <div class="grind-hopper">
    <span class="bean bean-1"></span>
    <span class="bean bean-2"></span>
    <span class="bean bean-3"></span>
    <span class="bean bean-4"></span>
    <span class="bean bean-5"></span>
  </div>
  <div class="grind-chamber">
    <span class="burr-cone"></span>
    <span class="burr-ring"></span>
  </div>
  <div class="grind-bin">
    <span class="ground ground-1"></span>
    <span class="ground ground-2"></span>
    <span class="ground ground-3"></span>
  </div>
  <footer class="grind-foot">
    <span class="grind-dose">DOSE 18G</span>
    <span class="grind-temp">TEMP 98C</span>
  </footer>
</main>
</body>
</html>
