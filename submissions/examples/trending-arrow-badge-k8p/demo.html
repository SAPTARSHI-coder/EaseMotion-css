<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="./style.css">
<title>Trending Arrow Badge Demo</title>
</head>
<body>
<main class="tab-container" role="main" aria-label="Trending Arrow Badge Visualizer">
  <div class="tab-card">
    <div class="tab-badge-wrapper">
      <div class="tab-arrow-box">
        <span class="tab-arrow"></span>
      </div>
      <span class="tab-prefix">trend</span>
      <strong class="tab-value">+24.8%</strong>
    </div>
    <h1 class="tab-title">Growth Analytics</h1>
    <p class="tab-description">A sleek financial metric badge featuring an energetic upward bouncing arrow animation for real-time performance indicators.</p>
  </div>
</main>
</body>
</html>
