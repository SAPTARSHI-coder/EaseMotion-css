<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Elastic Button — EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <p class="label">Pure CSS Elastic Spring Press Buttons (Click to Bounce)</p>
  <div class="demo-row">
    <!-- Primary -->
    <button class="ease-elastic-btn">Click Primary</button>

    <!-- Success -->
    <button class="ease-elastic-btn ease-elastic-btn--success">Click Success</button>

    <!-- Rose -->
    <button class="ease-elastic-btn ease-elastic-btn--rose">Click Rose</button>
  </div>

</body>
</html>
