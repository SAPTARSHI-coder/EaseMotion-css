<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Loader with Pastel Styling | EaseMotion CSS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="loader-container">
        <div class="pastel-spinner" role="status" aria-label="Loading">
            <div class="pastel-dot"></div>
            <div class="pastel-dot"></div>
            <div class="pastel-dot"></div>
            <div class="pastel-dot"></div>
        </div>
        <span class="loader-text">Loading content...</span>
    </div>
</body>
</html>
