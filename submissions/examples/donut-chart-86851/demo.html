<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Segmented Donut Chart</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="chart-card">
      <header>
        <div>
          <p class="eyebrow">Portfolio allocation</p>
          <h1>Asset mix</h1>
        </div>
        <span class="period">Q3 2026</span>
      </header>

      <section class="chart-layout">
        <div
          class="donut"
          role="img"
          aria-label="Technology 42 percent, Healthcare 27 percent, Energy 18 percent, Cash 13 percent"
        >
          <div class="donut__center">
            <strong>$84.6K</strong><span>Total value</span>
          </div>
        </div>

        <ul class="legend" aria-label="Portfolio categories">
          <li tabindex="0">
            <i class="swatch swatch--tech"></i
            ><span>Technology<small>Growth assets</small></span
            ><strong>42%</strong>
          </li>
          <li tabindex="0">
            <i class="swatch swatch--health"></i
            ><span>Healthcare<small>Defensive</small></span
            ><strong>27%</strong>
          </li>
          <li tabindex="0">
            <i class="swatch swatch--energy"></i
            ><span>Energy<small>Commodities</small></span
            ><strong>18%</strong>
          </li>
          <li tabindex="0">
            <i class="swatch swatch--cash"></i
            ><span>Cash<small>Available</small></span
            ><strong>13%</strong>
          </li>
        </ul>
      </section>

      <footer><span>Monthly return</span><strong>+6.4%</strong></footer>
    </main>
  </body>
</html>
