<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather Icon Morph Set</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      margin: 0; min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 1rem; padding: 24px;
      background: linear-gradient(160deg, #f8fafc, #eef2ff 55%, #f8fafc);
      color: #111827; font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    }
    h1 { margin: 0; font-size: 1.25rem; text-align: center; }
    .note { margin: 0; max-width: 420px; text-align: center; color: #4b5563; font-size: 0.92rem; line-height: 1.45; }
  </style>
</head>
<body>
  <h1>Weather Icon Morph Set</h1>
  
  <div class="weather"><input type="radio" name="wx" id="sun" checked/><input type="radio" name="wx" id="rain"/><input type="radio" name="wx" id="storm"/>
<div class="weather__icon" aria-hidden="true"></div>
<div class="opts"><label for="sun">Sun</label><label for="rain">Rain</label><label for="storm">Storm</label></div></div>
  
</body>
</html>
