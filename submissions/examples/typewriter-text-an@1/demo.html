<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Typewriter Text - EaseMotion CSS</title>

  <link rel="stylesheet" href="style.css" />

  <!-- Optional: main EaseMotion CSS -->
  <link rel="stylesheet" href="../../easemotion.css" />
</head>
<body>
  <main class="demo-container">
    <p class="subtitle">Pure CSS Typewriter Effect</p>

    <h1 class="ease-typewriter-an">
      EaseMotion is amazing
    </h1>

    <h2
      class="ease-typewriter-an"
      style="--tw-speed-an: 1.8s; --tw-cursor-an: #a78bfa;"
    >
      EaseMotion is amazing
    </h2>

    <p class="hint">
      Hover not needed. The animation runs on page load.
    </p>
  </main>
</body>
</html>
