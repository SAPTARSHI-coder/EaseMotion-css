<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Progress Bar with Neumorphism Styling - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="em-demo-container">
        <!-- Pure CSS Interactive Progress Bar Component Showcase with Neumorphism Styling -->
        <header class="em-progress-card" role="region" aria-label="Interactive Progress Bar Showcase" tabindex="0">
            <div class="em-progress-header-bar">
                <span class="em-card-badge">COMPONENT CONTRIBUTION</span>
                <span class="em-brand-logo">NeuMotion</span>
            </div>
            <h1 class="em-card-title">Interactive Progress Bar</h1>
            <p class="em-card-desc">A fully responsive, pure CSS progress bar component featuring soft neumorphic shadows, depressed track recessing, and smooth hover elevation.</p>
            <div class="em-progress-wrapper" role="progressbar" aria-valuenow="80" aria-valuemin="0" aria-valuemax="100" aria-label="Loading Progress">
                <div class="em-progress-track">
                    <div class="em-progress-fill"></div>
                </div>
            </div>
        </header>
    </div>
</body>
</html>
