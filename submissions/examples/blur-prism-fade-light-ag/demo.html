<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blur Prism Fade Light Animation Demo</title>
  <link rel="stylesheet" href="./style.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #0d0d12;
      color: #e0e0e0;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .demo-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
    }
    .card {
      background: #1a1a24;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 2rem;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    .card h2 {
      margin-top: 0;
      color: #fff;
    }
    .card p {
      color: #aaa;
      line-height: 1.5;
    }
    .replay-btn {
      background: #6c63ff;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 0.8rem 1.5rem;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    .replay-btn:hover {
      background: #5750d6;
    }
  </style>
</head>
<body>

  <div class="demo-container">
    <div id="target" class="card ease-anim-blur-prism-fade-light">
      <h2>Prism Light Card</h2>
      <p>This element enters with a hardware-accelerated blur-prism-fade-light animation. It combines translation, scaling, blur filter, and a cyan/magenta double drop-shadow effect.</p>
    </div>

    <button class="replay-btn" onclick="replayAnimation()">Replay Animation</button>
  </div>

  <script>
    function replayAnimation() {
      const target = document.getElementById('target');
      // Remove class
      target.classList.remove('ease-anim-blur-prism-fade-light');
      // Trigger reflow
      void target.offsetWidth;
      // Re-add class
      target.classList.add('ease-anim-blur-prism-fade-light');
    }
  </script>

</body>
</html>
