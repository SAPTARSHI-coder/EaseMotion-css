<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pulse Badge — EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <p class="label">Live Status Indicator Badges</p>
  <div class="demo-row">
    <span class="ease-pulse-badge ease-pulse-badge--success">
      <span class="ease-pulse-dot"></span> System Operational
    </span>

    <span class="ease-pulse-badge ease-pulse-badge--primary">
      <span class="ease-pulse-dot"></span> Live Stream
    </span>

    <span class="ease-pulse-badge ease-pulse-badge--warning">
      <span class="ease-pulse-dot"></span> Maintenance Away
    </span>

    <span class="ease-pulse-badge ease-pulse-badge--danger">
      <span class="ease-pulse-dot"></span> Server Down
    </span>
  </div>

  <p class="label">Large Size Variant</p>
  <div class="demo-row">
    <span class="ease-pulse-badge ease-pulse-badge--primary ease-pulse-badge--lg">
      <span class="ease-pulse-dot"></span> Broadcaster Online
    </span>
  </div>

</body>
</html>
