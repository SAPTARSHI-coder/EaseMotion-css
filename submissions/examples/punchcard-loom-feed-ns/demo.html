<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Punchcard Loom Feed — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Punchcard Loom Feed demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Punchcard Loom Feed</h1>
      <p class="lede">Punch-card loom feeding perforated pattern cards</p>
    </header>

    <section class="ease-punchcard-loom-feed" data-demo="punchcard-loom-feed" aria-live="polite">
      <div class="ease-punchcard-loom-feed__housing">
        <div class="ease-punchcard-loom-feed__bezel">
          <div class="ease-punchcard-loom-feed__face">
            <div class="ease-punchcard-loom-feed__readout">
              <span class="ease-punchcard-loom-feed__label">Punchcard Loom Feed</span>
              <span class="ease-punchcard-loom-feed__value">LIVE</span>
            </div>
            <div class="ease-punchcard-loom-feed__motion" aria-hidden="true">
              <span class="ease-punchcard-loom-feed__a"></span>
              <span class="ease-punchcard-loom-feed__b"></span>
              <span class="ease-punchcard-loom-feed__c"></span>
              <span class="ease-punchcard-loom-feed__d"></span>
            </div>
            <div class="ease-punchcard-loom-feed__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-punchcard-loom-feed__controls">
          <button type="button" class="ease-punchcard-loom-feed__btn primary">Engage</button>
          <button type="button" class="ease-punchcard-loom-feed__btn">Reset</button>
          <label class="ease-punchcard-loom-feed__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-punchcard-loom-feed__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
