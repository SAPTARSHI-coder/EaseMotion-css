<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Origami Fold Card - EaseMotion</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="ease-origami-wrapper">
    <input type="checkbox" id="origami-hack" class="ease-origami-trigger" aria-hidden="true">
    <label class="ease-origami-card" for="origami-hack" role="button" tabindex="0" aria-label="Toggle folded card">
      
      <!-- Top Flap -->
      <div class="ease-flap ease-flap-top" aria-hidden="true">
        <div class="ease-panel-content">
          <h2>Pure CSS</h2>
        </div>
      </div>

      <!-- Center Base -->
      <div class="ease-center-content">
        <h2 style="font-size: 1.2rem; color: #3b82f6;">Origami Unfold</h2>
        <p>Click to open & close</p>
      </div>

      <!-- Bottom Flap -->
      <div class="ease-flap ease-flap-bottom" aria-hidden="true">
        <div class="ease-panel-content">
          <p>3D transforms powered entirely by the CSS compositor.</p>
        </div>
      </div>

    </label>
  </div>
  <p style="position: absolute; bottom: 2rem; color: #64748b; font-family: system-ui; font-size: 0.875rem;">Uses transform-style: preserve-3d and transform-origin to create paper hinges.</p>
</body>
</html>
