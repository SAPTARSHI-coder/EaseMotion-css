<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS System Health Grid - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Dashboard Wrapper -->
  <div class="dashboard-container">
    
    <header class="dashboard-header">
      <h1 class="title">System Services Status</h1>
      <p class="subtitle">Real-time status overview. Pulsing color states and service uptime charts built natively in CSS.</p>
    </header>

    <!-- Services Grid -->
    <main class="health-grid" role="region" aria-label="System Services Dashboard">

      <!-- Service 1: API Services (Operational) -->
      <section class="service-tile" tabindex="0" aria-label="API Services status is operational, latency 14ms, uptime 99.98%">
        <div class="tile-header">
          <h2 class="service-name">API Services</h2>
          <div class="status-indicator">
            <div class="status-dot operational" aria-hidden="true"></div>
          </div>
        </div>
        
        <div class="metrics-row">
          <span>Latency</span>
          <span class="metric-value">14ms</span>
        </div>

        <div class="metrics-row">
          <span>Uptime</span>
          <span class="metric-value">99.98%</span>
        </div>

        <!-- 20-bar Uptime Chart representation -->
        <div class="uptime-chart" aria-hidden="true">
          <div class="uptime-bar ok"></div><div class="uptime-bar ok"></div><div class="uptime-bar ok"></div><div class="uptime-bar ok"></div>
          <div class="uptime-bar ok"></div><div class="uptime-bar ok"></div><div class="uptime-bar ok"></div><div class="uptime-bar ok"></div>
          <div class="uptime-bar ok"></div><div class="uptime-bar ok"></div><div class="uptime-bar ok"></div><div class="uptime-bar ok"></div>
          <div class="uptime-bar ok"></div><div class="uptime-bar ok"></div><div class="uptime-bar ok"></div><div class="uptime-bar ok"></div>
          <div class="uptime-bar ok"></div><div class="uptime-bar ok"></div><div class="uptime-bar ok"></div><div class="uptime-bar ok"></div>
        </div>
      </section>

      <!-- Service 2: Authentication Gate (Degraded) -->
      <section class="service-tile" tabindex="0" aria-label="Authentication Gate status is degraded, latency 280ms, uptime 98.45%">
        <div class="tile-header">
          <h2 class="service-name">Auth Gateway</h2>
          <div class="status-indicator">
            <div class="status-dot degraded" aria-hidden="true"></div>
          </div>
        </div>
        
        <div class="metrics-row">
          <span>Latency</span>
          <span class="metric-value">280ms</span>
        </div>

        <div class="metrics-row">
          <span>Uptime</span>
          <span class="metric-value">98.45%</span>
        </div>

        <div class="uptime-chart" aria-hidden="true">
          <div class="uptime-bar ok"></div><div class="uptime-bar ok"></div><div class="uptime-bar ok"></div><div class="uptime-bar ok"></div>
          <div class="uptime-bar ok"></div><div class="uptime-bar ok"></div><div class="uptime-bar ok"></div><div class="uptime-bar ok"></div>
          <div class="uptime-bar ok"></div><div class="uptime-bar ok"></div><div class="uptime-bar ok"></div><div class="uptime-bar ok"></div>
          <div class="uptime-bar ok"></div><div class="uptime-bar ok"></div><div class="uptime-bar warn"></div><div class="uptime-bar ok"></div>
          <div class="uptime-bar ok"></div><div class="uptime-bar ok"></div><div class="uptime-bar ok"></div><div class="uptime-bar ok"></div>
        </div>
      </section>

      <!-- Service 3: CDN Assets Delivery (Operational) -->
      <section class="service-tile" tabindex="0" aria-label="CDN Assets Delivery status is operational, latency 8ms, uptime 100.00%">
        <div class="tile-header">
          <h2 class="service-name">Assets CDN</h2>
          <div class="status-indicator">
            <div class="status-dot operational" aria-hidden="true"></div>
          </div>
        </div>
        
        <div class="metrics-row">
          <span>Latency</span>
          <span class="metric-value">8ms</span>
        </div>

        <div class="metrics-row">
          <span>Uptime</span>
          <span class="metric-value">100.00%</span>
        </div>

        <div class="uptime-chart" aria-hidden="true">
          <div class="uptime-bar ok"></div><div class="uptime-bar ok"></div><div class="uptime-bar ok"></div><div class="uptime-bar ok"></div>
          <div class="uptime-bar ok"></div><div class="uptime-bar ok"></div><div class="uptime-bar ok"></div><div class="uptime-bar ok"></div>
          <div class="uptime-bar ok"></div><div class="uptime-bar ok"></div><div class="uptime-bar ok"></div><div class="uptime-bar ok"></div>
          <div class="uptime-bar ok"></div><div class="uptime-bar ok"></div><div class="uptime-bar ok"></div><div class="uptime-bar ok"></div>
          <div class="uptime-bar ok"></div><div class="uptime-bar ok"></div><div class="uptime-bar ok"></div><div class="uptime-bar ok"></div>
        </div>
      </section>

    </main>

  </div>

</body>
</html>
