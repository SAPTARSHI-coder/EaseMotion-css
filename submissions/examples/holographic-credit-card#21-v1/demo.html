<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Holographic Credit Card | EaseMotion CSS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card-scene">
        <div class="holo-card">
            <!-- Holographic Overlay -->
            <div class="holo-overlay"></div>
            <!-- Shine Sweep -->
            <div class="shine"></div>
            <!-- Rainbow Gradient Layer -->
            <div class="rainbow-layer"></div>

            <!-- Card Content -->
            <div class="card-content">
                <div class="card-top">
                    <div class="chip">
                        <div class="chip-line"></div>
                        <div class="chip-line"></div>
                        <div class="chip-line"></div>
                        <div class="chip-line"></div>
                    </div>
                    <div class="contactless">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path d="M8.5 8.5a5 5 0 0 1 7 0"/>
                            <path d="M6 6a9 9 0 0 1 12 0"/>
                            <path d="M11 11a1.5 1.5 0 0 1 2 0"/>
                        </svg>
                    </div>
                </div>

                <div class="card-number">
                    <span>4532</span>
                    <span>••••</span>
                    <span>••••</span>
                    <span>7891</span>
                </div>

                <div class="card-bottom">
                    <div class="card-holder">
                        <span class="label">Card Holder</span>
                        <span class="value">ALEX MORGAN</span>
                    </div>
                    <div class="card-expiry">
                        <span class="label">Expires</span>
                        <span class="value">12/29</span>
                    </div>
                    <div class="card-logo">
                        <div class="logo-circle circle-1"></div>
                        <div class="logo-circle circle-2"></div>
                    </div>
                </div>
            </div>

            <!-- Floating Particles -->
            <div class="particle p1"></div>
            <div class="particle p2"></div>
            <div class="particle p3"></div>
            <div class="particle p4"></div>
            <div class="particle p5"></div>
            <div class="particle p6"></div>
        </div>
    </div>
</body>
</html>
