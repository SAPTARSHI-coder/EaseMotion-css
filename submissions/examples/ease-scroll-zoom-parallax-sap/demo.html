<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ease-scroll-zoom-parallax-sap demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #f4f4f5; }
    .spacer { height: 60vh; display: flex; align-items: center; justify-content: center; color: #94a3b8; }
    .page { max-width: 700px; margin: 0 auto; padding: 0 20px 300px; }
  </style>
</head>
<body>
  <div class="spacer">Scroll down</div>
  <div class="page">
    <div class="zoom-parallax-sap" id="zoomSection">
      <img id="zoomImg" src="https://images.unsplash.com/photo-1519681393784-d120267933ba?w=900" alt="Mountains">
      <div class="zoom-caption">Explore the Alps</div>
    </div>
  </div>
  <script>
    const section = document.getElementById('zoomSection');
    const img = document.getElementById('zoomImg');

    function update() {
      const rect = section.getBoundingClientRect();
      const vh = window.innerHeight;
      const progress = Math.min(1, Math.max(0, 1 - (rect.top / vh)));
      const scale = 1.3 - (progress * 0.3);
      img.style.transform = `scale(${Math.max(1, scale)})`;
    }

    window.addEventListener('scroll', update, { passive: true });
    update();
  </script>
</body>
</html>
