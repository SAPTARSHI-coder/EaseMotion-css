<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="A responsive CSS-only zoom-in page hero animation."
  >
  <title>CSS Zoom-In Page Hero</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <section class="hero" aria-labelledby="hero-title">
      <div class="hero__background" aria-hidden="true"></div>
      <div class="hero__overlay" aria-hidden="true"></div>

      <div class="hero__content">
        <p class="hero__eyebrow">Explore Beyond</p>

        <h1 id="hero-title">Move With the Moment</h1>

        <p class="hero__description">
          A smooth CSS-only zoom-in hero designed for immersive
          and responsive landing pages.
        </p>

        <a class="hero__button" href="#discover">
          Discover More
        </a>
      </div>
    </section>

    <section class="content" id="discover" aria-labelledby="discover-title">
      <p class="content__eyebrow">Pure CSS Animation</p>

      <h2 id="discover-title">Built without JavaScript</h2>

      <p>
        The hero background uses CSS transforms and keyframes to create
        a continuous, subtle zoom-in effect.
      </p>
    </section>
  </main>
</body>
</html>
