<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-washing-machine-drum demo</title>
</head>
<body>
<div class="wm-app">
  <span class="wm-brand">WASH</span>
  <div class="wm-panel">
    <button class="wm-knob"></button>
    <button class="wm-start">ON</button>
    <span class="wm-led"></span>
  </div>
  <div class="wm-door">
    <div class="wm-glass">
      <div class="wm-drum">
        <span class="wm-pad wm-pad-1"></span>
        <span class="wm-pad wm-pad-2"></span>
        <span class="wm-pad wm-pad-3"></span>
      </div>
      <span class="wm-sock wm-sock-1"></span>
      <span class="wm-sock wm-sock-2"></span>
      <span class="wm-bubble wm-bubble-1"></span>
      <span class="wm-bubble wm-bubble-2"></span>
      <span class="wm-bubble wm-bubble-3"></span>
    </div>
  </div>
  <div class="wm-base"></div>
</div>
</body>
</html>
