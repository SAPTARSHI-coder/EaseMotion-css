<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-popcorn-pot-shake demo</title>
</head>
<body>
<div class="pc-app">
  <div class="pc-head">
    <span class="pc-name">KERNEL KITCHEN</span>
    <span class="pc-badge">BATCH</span>
  </div>
  <div class="pc-stage">
    <div class="pc-pot">
      <span class="pc-handle"></span>
      <div class="pc-lid"></div>
      <div class="pc-inner">
        <span class="pc-kernel pc-k1"></span>
        <span class="pc-kernel pc-k2"></span>
        <span class="pc-kernel pc-k3"></span>
        <span class="pc-kernel pc-k4"></span>
        <span class="pc-kernel pc-k5"></span>
        <span class="pc-kernel pc-k6"></span>
        <span class="pc-pop pc-p1"></span>
        <span class="pc-pop pc-p2"></span>
        <span class="pc-pop pc-p3"></span>
      </div>
      <div class="pc-potbody"></div>
    </div>
    <div class="pc-flame"></div>
    <div class="pc-heap">
      <span class="pc-fluff pc-f1"></span>
      <span class="pc-fluff pc-f2"></span>
      <span class="pc-fluff pc-f3"></span>
      <span class="pc-fluff pc-f4"></span>
    </div>
  </div>
  <div class="pc-foot">HEAT MED</div>
</div>
</body>
</html>
