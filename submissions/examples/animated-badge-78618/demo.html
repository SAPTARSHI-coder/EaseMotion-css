<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Animated Badge</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="page">
      <p class="eyebrow">EaseMotion CSS · Issue #78618</p>
      <h1>Animated Badge</h1>
      <section class="badge-grid" aria-label="Badge examples">
        <a class="badge badge-success" href="#success">
          <span class="dot" aria-hidden="true"></span>
          Available
        </a>
        <a class="badge badge-info" href="#updates">
          Updates
          <span class="count" aria-label="8 updates">8</span>
        </a>
        <button class="badge badge-alert" type="button">
          <span class="dot" aria-hidden="true"></span>
          Attention
        </button>
      </section>
    </main>
  </body>
</html>
