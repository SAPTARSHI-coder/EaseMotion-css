<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Animated badge showcase for EaseMotion CSS issue #78618."
    />
    <title>Animated Badge | EaseMotion CSS</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="page">
      <section class="showcase" aria-labelledby="page-title">
        <p class="eyebrow">EaseMotion CSS · Issue #78618</p>

        <h1 id="page-title">Animated Badge</h1>

        <p class="intro">
          Compact status and notification badges with subtle motion, clear
          hierarchy, and keyboard-friendly interaction.
        </p>

        <div class="badge-grid" aria-label="Badge examples">
          <a class="badge badge-success" href="#available">
            <span class="dot" aria-hidden="true"></span>
            <span>Available</span>
          </a>

          <a class="badge badge-info" href="#updates">
            <span>Updates</span>
            <span class="count" aria-label="8 updates">8</span>
          </a>

          <button class="badge badge-alert" type="button">
            <span class="dot" aria-hidden="true"></span>
            <span>Attention</span>
          </button>
        </div>

        <p class="hint">
          Hover or keyboard-focus an interactive badge to inspect its state.
        </p>
      </section>
    </main>
  </body>
</html>
