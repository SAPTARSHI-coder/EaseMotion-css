<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Neon-Frame Modal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<input type="checkbox" id="modal-toggle" hidden>

<section class="hero">

  <h1>Gaming Hub</h1>

  <p>
    Experience a futuristic Neon-Frame Modal built entirely with HTML and CSS.
  </p>

  <label for="modal-toggle" class="open-btn">
    Open Mission
  </label>

</section>

<div class="overlay">

  <div class="modal">

    <label for="modal-toggle" class="close-btn">&times;</label>

    <div class="icon">⚡</div>

    <h2>Mission Accepted</h2>

    <p>
      Welcome, Commander! Your next elite mission is ready. Prepare for battle.
    </p>

    <label for="modal-toggle" class="action-btn">
      Start Mission
    </label>

  </div>

</div>

</body>
</html>
