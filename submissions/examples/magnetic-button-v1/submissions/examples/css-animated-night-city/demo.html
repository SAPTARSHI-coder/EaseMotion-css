<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="CSS animated night city skyline with glowing windows."
  >
  <title>CSS Animated Night City</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="city-scene" aria-label="Animated night city skyline">
    <div class="moon" aria-hidden="true"></div>

    <div class="stars" aria-hidden="true">
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
    </div>

    <div class="city" aria-hidden="true">
      <div class="building building--small">
        <div class="windows">
          <span></span><span></span>
          <span></span><span></span>
          <span></span><span></span>
        </div>
      </div>

      <div class="building building--medium">
        <div class="windows">
          <span></span><span></span><span></span>
          <span></span><span></span><span></span>
          <span></span><span></span><span></span>
        </div>
      </div>

      <div class="building building--tall">
        <div class="antenna"></div>
        <div class="windows">
          <span></span><span></span><span></span>
          <span></span><span></span><span></span>
          <span></span><span></span><span></span>
          <span></span><span></span><span></span>
        </div>
      </div>

      <div class="building building--wide">
        <div class="windows">
          <span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span>
        </div>
      </div>

      <div class="building building--medium">
        <div class="windows">
          <span></span><span></span><span></span>
          <span></span><span></span><span></span>
          <span></span><span></span><span></span>
        </div>
      </div>

      <div class="building building--small">
        <div class="windows">
          <span></span><span></span>
          <span></span><span></span>
          <span></span><span></span>
        </div>
      </div>
    </div>

    <div class="ground" aria-hidden="true"></div>

    <section class="city-content">
      <p class="eyebrow">EaseMotion CSS</p>
      <h1>Night City</h1>
      <p class="description">
        A lightweight animated skyline built entirely with HTML and CSS.
      </p>
    </section>
  </main>
</body>
</html>
