<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="CSS-only magnetic button hover interaction"
  >
  <title>Magnetic Button | EaseMotion CSS</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="demo">
    <section class="hero">
      <p class="eyebrow">EaseMotion CSS</p>

      <h1>Magnetic Button</h1>

      <p class="description">
        A CSS-only magnetic hover effect created using an invisible
        3×3 interaction grid.
      </p>

      <div class="magnetic-area">

        <!-- Top row -->
        <div class="hover-zone zone-tl" aria-hidden="true"></div>
        <div class="hover-zone zone-tc" aria-hidden="true"></div>
        <div class="hover-zone zone-tr" aria-hidden="true"></div>

        <!-- Middle row -->
        <div class="hover-zone zone-ml" aria-hidden="true"></div>

        <a href="#demo" class="magnetic-button">
          Explore
          <span aria-hidden="true">→</span>
        </a>

        <div class="hover-zone zone-mr" aria-hidden="true"></div>

        <!-- Bottom row -->
        <div class="hover-zone zone-bl" aria-hidden="true"></div>
        <div class="hover-zone zone-bc" aria-hidden="true"></div>
        <div class="hover-zone zone-br" aria-hidden="true"></div>

      </div>

      <p class="hint">
        Move your cursor around the button
      </p>
    </section>
  </main>
</body>
</html>
