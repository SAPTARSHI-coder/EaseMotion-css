<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Audio Waveform Visualizer & Player Control</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Ambient background glow blobs -->
  <div class="ambient-glow glow-1" aria-hidden="true"></div>
  <div class="ambient-glow glow-2" aria-hidden="true"></div>

  <main class="player-wrapper">
    <article class="audio-player-card" id="audio-player" aria-label="Interactive Audio Player">
      
      <!-- Top Bar / Header -->
      <header class="player-header">
        <div class="artist-avatar-container">
          <div class="avatar-ring"></div>
          <div class="avatar-image">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"></path>
              <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
              <line x1="12" y1="19" x2="12" y2="22"></line>
              <line x1="8" y1="22" x2="16" y2="22"></line>
            </svg>
          </div>
        </div>

        <div class="track-info">
          <div class="track-header-meta">
            <span class="badge-tag">AI Voice Synthesis</span>
            <span class="audio-spec">24-bit / 48kHz WAV</span>
          </div>
          <h1 class="track-title" id="track-title">Aetherial Neural Voice #042</h1>
          <p class="track-subtitle" id="track-subtitle">ElevenLabs v3.5 Neural Audio Generator</p>
        </div>

        <!-- Audio Preset Selector -->
        <div class="preset-selector-wrapper">
          <label for="preset-select" class="sr-only">Select Audio Preset</label>
          <select id="preset-select" class="preset-dropdown" title="Choose Audio Soundscape Preset">
            <option value="speech">🎙️ AI Speech</option>
            <option value="synth">🎹 Synth Pad</option>
            <option value="chiptune">👾 Chiptune Arp</option>
            <option value="lofi">🎧 Lo-Fi Chill</option>
          </select>
        </div>
      </header>

      <!-- Main Waveform Display Area -->
      <section class="waveform-section">
        <!-- Scrubbing Hover Tooltip -->
        <div class="waveform-tooltip" id="waveform-tooltip" aria-hidden="true">
          <span class="tooltip-time" id="tooltip-time">00:00</span>
        </div>

        <!-- Interactive Waveform Scrubber -->
        <div class="waveform-container" 
             id="waveform-container" 
             tabindex="0" 
             role="slider" 
             aria-label="Audio Playback Position" 
             aria-valuemin="0" 
             aria-valuemax="100" 
             aria-valuenow="0" 
             aria-valuetext="00:00 of 03:45">
          <!-- Hover scrub line position indicator -->
          <div class="scrub-hover-line" id="scrub-hover-line"></div>
          <!-- Current playback progress line overlay -->
          <div class="progress-play-line" id="progress-play-line"></div>
          <!-- Dynamic bars will be generated here by script.js -->
          <div class="bars-wrapper" id="bars-wrapper"></div>
        </div>

        <!-- Time Indicators -->
        <div class="time-display">
          <span class="time-label elapsed" id="time-elapsed">00:00</span>
          <div class="playback-status-pill" id="playback-status">
            <span class="status-dot"></span>
            <span class="status-text">Ready</span>
          </div>
          <span class="time-label remaining" id="time-remaining">-03:45</span>
        </div>
      </section>

      <!-- Player Controls Footer -->
      <footer class="player-controls">
        <!-- Secondary / Helper Controls (Left) -->
        <div class="controls-left">
          <button type="button" class="btn-icon" id="btn-mute" aria-label="Mute Audio" title="Mute (Key: M)">
            <svg class="icon-volume-on" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
              <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
            </svg>
            <svg class="icon-volume-muted hidden" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
              <line x1="23" y1="9" x2="17" y2="15"></line>
              <line x1="17" y1="9" x2="23" y2="15"></line>
            </svg>
          </button>
          
          <div class="volume-slider-wrapper">
            <label for="volume-range" class="sr-only">Volume Control</label>
            <input type="range" id="volume-range" class="volume-range" min="0" max="1" step="0.01" value="0.8" title="Volume Slider">
          </div>
        </div>

        <!-- Central Main Playback Controls -->
        <div class="controls-center">
          <button type="button" class="btn-icon btn-skip" id="btn-skip-back" aria-label="Skip Back 5 Seconds" title="Rewind 5s (Left Arrow)">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="11 19 2 12 11 5 11 19"></polygon>
              <polygon points="22 19 13 12 22 5 22 19"></polygon>
            </svg>
          </button>

          <!-- Primary Morphing Play/Pause Button -->
          <button type="button" class="btn-play-pause" id="btn-play-pause" aria-pressed="false" aria-label="Play Track" title="Play / Pause (Spacebar)">
            <span class="btn-play-pulse" aria-hidden="true"></span>
            <svg class="icon-play-state" viewBox="0 0 24 24" width="28" height="28" fill="currentColor">
              <path class="play-icon-path" d="M8 5v14l11-7z"/>
              <path class="pause-icon-path hidden" d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
            </svg>
          </button>

          <button type="button" class="btn-icon btn-skip" id="btn-skip-forward" aria-label="Skip Forward 5 Seconds" title="Forward 5s (Right Arrow)">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="13 19 22 12 13 5 13 19"></polygon>
              <polygon points="2 19 11 12 2 5 2 19"></polygon>
            </svg>
          </button>
        </div>

        <!-- Secondary Controls (Right) -->
        <div class="controls-right">
          <!-- Playback Speed Button / Pill -->
          <button type="button" class="btn-speed" id="btn-speed" aria-label="Change Playback Speed" title="Playback Speed">
            <span id="speed-label">1.0x</span>
          </button>
        </div>
      </footer>

      <!-- Keyboard Shortcuts Info Bar -->
      <div class="keyboard-hints">
        <span><kbd>Space</kbd> Play/Pause</span>
        <span><kbd>←</kbd> <kbd>→</kbd> Seek 5s</span>
        <span><kbd>M</kbd> Mute</span>
      </div>

    </article>
  </main>

  <script src="script.js"></script>
</body>
</html>
