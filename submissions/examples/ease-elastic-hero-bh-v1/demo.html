<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ease-elastic-hero-bh - CSS Elastic-Slide Hero Section</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section class="ease-elastic-hero">
    <!-- Animated particles -->
    <div class="ease-hero-particles">
      <div class="ease-hero-particle"></div>
      <div class="ease-hero-particle"></div>
      <div class="ease-hero-particle"></div>
      <div class="ease-hero-particle"></div>
      <div class="ease-hero-particle"></div>
      <div class="ease-hero-particle"></div>
      <div class="ease-hero-particle"></div>
      <div class="ease-hero-particle"></div>
      <div class="ease-hero-particle"></div>
      <div class="ease-hero-particle"></div>
    </div>
    
    <!-- Glowing orbs -->
    <div class="ease-hero-orb ease-hero-orb-1"></div>
    <div class="ease-hero-orb ease-hero-orb-2"></div>
    
    <!-- Content -->
    <div class="ease-hero-content">
      <span class="ease-hero-badge">🎮 Now Open</span>
      <h1 class="ease-hero-title">
        Enter the <span>Gaming Arena</span>
      </h1>
      <p class="ease-hero-subtitle">
        Experience next-level gaming with epic battles, tournaments, and rewards
      </p>
      <a href="#" class="ease-hero-btn">Play Now</a>
    </div>
  </section>
</body>
</html>
