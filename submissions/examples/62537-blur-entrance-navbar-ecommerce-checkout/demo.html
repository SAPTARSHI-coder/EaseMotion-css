<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blur Entrance Checkout Navbar</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header class="checkout-navbar">

<div class="logo">
<div class="logo-icon">F</div>
<span>FinPay</span>
</div>

<nav class="checkout-steps">

<div class="step active">
<span>1</span>
<p>Cart</p>
</div>

<div class="line"></div>

<div class="step active">
<span>2</span>
<p>Shipping</p>
</div>

<div class="line"></div>

<div class="step">
<span>3</span>
<p>Payment</p>
</div>

<div class="line"></div>

<div class="step">
<span>4</span>
<p>Review</p>
</div>

</nav>

<div class="checkout-actions">

<div class="search-box">
<input type="text" placeholder="Search products...">
</div>

<div class="secure">
🔒 Secure Checkout
</div>

<div class="cart">
🛒
<span>3</span>
</div>

</div>

</header>

<section class="hero">

<h1>Checkout Experience</h1>

<p>
Modern Blur-Entrance Navbar for E-Commerce Checkout Layouts
built with pure HTML & CSS.
</p>

<button>Continue Shopping</button>

</section>

</body>
</html>
