<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-weather-thermometer-scale demo</title>
</head>
<body>
<div class="wtm-app">
  <span class="wtm-title">WALL THERMO</span>
  <div class="wtm-scale">
    <span class="wtm-mark">40</span><span class="wtm-mark">30</span><span class="wtm-mark">20</span><span class="wtm-mark">10</span>
  </div>
  <div class="wtm-tube">
    <div class="wtm-fill"></div>
    <div class="wtm-bulb"></div>
  </div>
  <span class="wtm-unit">CELSIUS</span>
</div>
</body>
</html>
