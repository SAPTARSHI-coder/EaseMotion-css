<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animated Stats Counter - EaseMotion Submission</title>
  
  <!-- EaseMotion CSS Official CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="container ease-fade-in">
    <h1 class="ease-slide-up">Our Impact in Numbers</h1>
    <p class="ease-slide-up ease-delay-100">Trusted by thousands worldwide</p>
    
    <div class="stats-grid ease-slide-up ease-delay-200">
      
      <!-- Stat 1: Users -->
      <div class="stat-card ease-hover-lift">
        <div class="stat-icon">👥</div>
        <div class="stat-number" data-target="10000">0</div>
        <div class="stat-suffix">+</div>
        <div class="stat-label">Active Users</div>
      </div>

      <!-- Stat 2: Projects -->
      <div class="stat-card ease-hover-lift ease-delay-100">
        <div class="stat-icon">🚀</div>
        <div class="stat-number" data-target="500">0</div>
        <div class="stat-suffix">+</div>
        <div class="stat-label">Projects Completed</div>
      </div>

      <!-- Stat 3: Countries -->
      <div class="stat-card ease-hover-lift ease-delay-200">
        <div class="stat-icon">🌍</div>
        <div class="stat-number" data-target="50">0</div>
        <div class="stat-suffix">+</div>
        <div class="stat-label">Countries Served</div>
      </div>

      <!-- Stat 4: Awards -->
      <div class="stat-card ease-hover-lift ease-delay-300">
        <div class="stat-icon">🏆</div>
        <div class="stat-number" data-target="25">0</div>
        <div class="stat-suffix"></div>
        <div class="stat-label">Awards Won</div>
      </div>

    </div>
  </div>

  <!-- Minimal JS for counter animation -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const counters = document.querySelectorAll('.stat-number');
      const speed = 200; // Animation speed

      const animateCounter = (counter) => {
        const target = +counter.getAttribute('data-target');
        const count = +counter.innerText;
        const increment = target / speed;

        if (count < target) {
          counter.innerText = Math.ceil(count + increment);
          setTimeout(() => animateCounter(counter), 20);
        } else {
          counter.innerText = target;
        }
      };

      // Intersection Observer to trigger animation when visible
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            animateCounter(entry.target);
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: 0.5 });

      counters.forEach(counter => observer.observe(counter));
    });
  </script>

</body>
</html>
