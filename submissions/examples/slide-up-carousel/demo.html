<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Slide-Up Carousel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="checkout-layout">
        <h2 class="section-title">Select Shipping Address</h2>
        
        <div class="carousel-container">
            <input type="radio" name="address" id="addr1" class="carousel-input" checked>
            <input type="radio" name="address" id="addr2" class="carousel-input">
            <input type="radio" name="address" id="addr3" class="carousel-input">
            
            <div class="carousel-cards">
                <label for="addr1" class="carousel-card card-item-1">
                    <div class="card-header">Home</div>
                    <div class="card-body">1234 Maple Street<br>Springfield, IL 62704</div>
                    <div class="card-footer">Default</div>
                </label>
                
                <label for="addr2" class="carousel-card card-item-2">
                    <div class="card-header">Work</div>
                    <div class="card-body">987 Tech Blvd, Suite 200<br>San Francisco, CA 94107</div>
                    <div class="card-footer">Office</div>
                </label>
                
                <label for="addr3" class="carousel-card card-item-3">
                    <div class="card-header">Vacation</div>
                    <div class="card-body">45 Ocean Drive<br>Miami, FL 33139</div>
                    <div class="card-footer">Beach House</div>
                </label>
            </div>
            
            <div class="carousel-indicators">
                <label for="addr1" class="indicator"></label>
                <label for="addr2" class="indicator"></label>
                <label for="addr3" class="indicator"></label>
            </div>
        </div>
        
        <button class="checkout-btn">Continue to Payment</button>
    </div>
</body>
</html>
