<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slide-Up Carousel</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="carousel">

    <div class="card">
        <img src="https://picsum.photos/300/220?1" alt="">
        <div class="content">
            <h3>Wireless Headphones</h3>
            <p>$89</p>
            <button>Buy Now</button>
        </div>
    </div>

    <div class="card">
        <img src="https://picsum.photos/300/220?2" alt="">
        <div class="content">
            <h3>Smart Watch</h3>
            <p>$129</p>
            <button>Buy Now</button>
        </div>
    </div>

    <div class="card">
        <img src="https://picsum.photos/300/220?3" alt="">
        <div class="content">
            <h3>Gaming Mouse</h3>
            <p>$49</p>
            <button>Buy Now</button>
        </div>
    </div>

</div>

</body>
</html>
