<body>
<header class="page-head">

      <div class="mw-hole"><div class="mw-mole"></div><div class="mw-dirt"></div></div>
      <div class="mw-hole"><div class="mw-mole"></div><div class="mw-dirt"></div></div>
      <div class="mw-hole"><div class="mw-mole"></div><div class="mw-dirt"></div></div>
    </div>
  </main>
  <p class="stage-caption">Hover any hole to pop its mole up instantly.</p>
  <footer class="page-foot">
    <span>Pure CSS &middot; zero dependencies</span>
    <span>Pop animation</span>
  </footer>

</html>
