<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ease-ripple-wave-progress (SaaS showcase) — Demo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <header class="page__intro">
      <h1>ease-ripple-wave-progress</h1>
      <p>SaaS usage meters with a ripple wave traveling along the fill as it grows toward plan limits.</p>
    </header>

    <section class="panel" aria-label="Plan usage">
      <h2 class="panel__title">This month</h2>

      <div class="task">
        <div class="task__head">
          <span class="task__label">API calls</span>
          <span class="task__value"><strong>1.26M</strong> / 2.00M</span>
        </div>
        <div class="bar" role="progressbar" aria-valuenow="63" aria-valuemin="0" aria-valuemax="100" aria-label="API calls usage">
          <div class="bar__fill" style="--val: 63%"></div>
        </div>
      </div>

      <div class="task">
        <div class="task__head">
          <span class="task__label">Storage</span>
          <span class="task__value"><strong>38</strong> / 100 GB</span>
        </div>
        <div class="bar" role="progressbar" aria-valuenow="38" aria-valuemin="0" aria-valuemax="100" aria-label="Storage usage">
          <div class="bar__fill bar__fill--violet" style="--val: 38%"></div>
        </div>
      </div>

      <div class="task">
        <div class="task__head">
          <span class="task__label">Seats</span>
          <span class="task__value"><strong>19</strong> / 20</span>
        </div>
        <div class="bar" role="progressbar" aria-valuenow="95" aria-valuemin="0" aria-valuemax="100" aria-label="Seats usage">
          <div class="bar__fill bar__fill--emerald" style="--val: 95%"></div>
        </div>
      </div>

      <div class="actions">
        <button type="button" class="btn" data-replay>Replay</button>
      </div>
    </section>
  </main>

  <script>
    (function () {
      document.querySelector('[data-replay]').addEventListener('click', function () {
        document.querySelectorAll('.bar__fill').forEach(function (f) {
          var v = f.style.getPropertyValue('--val');
          f.style.setProperty('--val', '0%');
          requestAnimationFrame(function () {
            requestAnimationFrame(function () { f.style.setProperty('--val', v); });
          });
        });
      });
    })();
  </script>
</body>
</html>
