<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neumorphic Smart Thermostat Widget Showcase | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <main class="wrapper">
    <header class="header">
      <h1 class="title">SMART THERMOSTAT</h1>
      <p class="subtitle">Tactile neumorphic control dial with ambient temperature status and soft depth shadows</p>
    </header>

    <div class="thermostat-card">
      <div class="dial-container">
        <div class="dial-outer">
          <div class="dial-inner">
            <span class="temp-readout">22.5°</span>
            <span class="temp-status">COOLING ACTIVE</span>
          </div>
        </div>
      </div>

      <div class="controls">
        <button class="neu-btn" aria-label="Decrease Temperature">-</button>
        <div class="mode-badge">AUTO</div>
        <button class="neu-btn" aria-label="Increase Temperature">+</button>
      </div>
    </div>
  </main>
</body>
</html>
