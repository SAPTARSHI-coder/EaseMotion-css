<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CSS Slide-Up Progress Bar for Glassmorphism UI">
  <title>Slide-Up Progress Bar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section class="panel" aria-labelledby="progress-title">
      <span class="eyebrow">EASEMOTION CSS</span>

      <h1 id="progress-title">Project Progress</h1>

      <p class="description">
        A lightweight glassmorphism progress component with a smooth
        slide-up entrance animation.
      </p>

      <div class="progress-list">
        <div class="progress-item">
          <div class="progress-meta">
            <span>Design System</span>
            <strong>92%</strong>
          </div>
          <div class="progress-track" role="progressbar"
            aria-label="Design System"
            aria-valuenow="92"
            aria-valuemin="0"
            aria-valuemax="100">
            
          </div>
        </div>

        <div class="progress-item">
          <div class="progress-meta">
            <span>Development</span>
            <strong>76%</strong>
          </div>
          <div class="progress-track" role="progressbar"
            aria-label="Development"
            aria-valuenow="76"
            aria-valuemin="0"
            aria-valuemax="100">
            
          </div>
        </div>

        <div class="progress-item">
          <div class="progress-meta">
            <span>Testing</span>
            <strong>64%</strong>
          </div>
          <div class="progress-track" role="progressbar"
            aria-label="Testing"
            aria-valuenow="64"
            aria-valuemin="0"
            aria-valuemax="100">
            
          </div>
        </div>
      </div>

      <div class="status">
        <span class="status-dot" aria-hidden="true"></span>
        <span>On track</span>
      </div>
    </section>
  </main>
</body>
</html>
