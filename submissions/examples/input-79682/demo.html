<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Neumorphic Input</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <header>
      <p>EaseMotion · #79682</p>
      <h1>Neumorphic Input Field</h1>
      <p>A soft-depth field with clear focus and comfortable responsive spacing.</p>
    </header>
    <form class="panel">
      <label>Full name<input type="text" placeholder="Enter your name"></label>
      <label>Email<input type="email" placeholder="name@example.com"></label>
      <label>Message<textarea rows="4" placeholder="Write a short message"></textarea></label>
      <button type="submit">Submit</button>
    </form>
    <section><h2>Design notes</h2><p>Inset surfaces distinguish fields while preserving native controls and keyboard behavior.</p></section>
    <footer>Pure HTML · Vanilla CSS · Issue #79682</footer>
  </main>
</body>
</html>
