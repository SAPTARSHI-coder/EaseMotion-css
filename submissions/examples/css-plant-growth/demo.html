<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CSS-only plant growth animation">
  <title>CSS Plant Growth Animation</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="demo">
    <section
      class="plant-card"
      aria-label="Animated plant growth demonstration"
    >
      <div class="sun" aria-hidden="true"></div>

      <div class="plant" aria-hidden="true">
        <div class="stem"></div>

        <div class="leaf leaf-left">
          <span></span>
        </div>

        <div class="leaf leaf-right">
          <span></span>
        </div>

        <div class="leaf leaf-top">
          <span></span>
        </div>
      </div>

      <div class="pot" aria-hidden="true">
        <div class="soil"></div>
      </div>

      <h1>Plant Growth</h1>
      <p>A CSS-only plant growing animation.</p>

      <p class="sr-only">
        A plant grows upward from a pot when the page loads.
      </p>
    </section>
  </main>
</body>
</html>
