<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ease 3D Isometric Projection Data Dashboard Chart</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="dashboard-container">
    <header class="dashboard-header">
      <div class="header-titles">
        <span class="badge">EaseMotion CSS3 3D</span>
        <h1>Metrics Overview</h1>
        <p>Isometric 3D spatial analytics dashboard</p>
      </div>
      <div class="controls">
        <label for="metric-selector">Select Dataset:</label>
        <select id="metric-selector" class="select-dropdown">
          <option value="q1">Q1 Revenue Performance ($K)</option>
          <option value="q2">Q2 User Acquisition (k)</option>
          <option value="q3">Q3 System Throughput (req/s)</option>
        </select>
      </div>
    </header>

    <!-- Scalable stage wrapper for mobile responsiveness -->
    <div class="chart-viewport">
      <div class="isometric-stage" id="isometric-stage">
        <!-- Isometric Grid Floor -->
        <div class="isometric-grid"></div>

        <!-- 3D Bar Columns Container -->
        <div class="bars-container" id="bars-container">
          <!-- Bars injected via JavaScript -->
        </div>
      </div>

      <!-- Floating Dynamic Tooltip -->
      <div class="chart-tooltip" id="chart-tooltip" aria-hidden="true">
        <div class="tooltip-label" id="tooltip-label">Metric</div>
        <div class="tooltip-value" id="tooltip-value">0</div>
        <div class="tooltip-sub" id="tooltip-sub">+0% vs prev period</div>
      </div>
    </div>

    <!-- Interactive Data Legend -->
    <footer class="dashboard-footer" id="dashboard-legend">
      <!-- Legend items injected dynamically -->
    </footer>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const datasets = {
        q1: [
          { label: 'Sales', value: 840, unit: '$k', change: '+14%', color: '#00f2fe' },
          { label: 'Users', value: 620, unit: 'k', change: '+8%', color: '#4facfe' },
          { label: 'Revenue', value: 950, unit: '$k', change: '+22%', color: '#00c6ff' },
          { label: 'Traffic', value: 410, unit: 'k', change: '-3%', color: '#38ef7d' },
          { label: 'Orders', value: 780, unit: 'k', change: '+18%', color: '#a855f7' },
          { label: 'Growth', value: 530, unit: '%', change: '+5%', color: '#f43f5e' }
        ],
        q2: [
          { label: 'Sales', value: 610, unit: '$k', change: '+4%', color: '#00f2fe' },
          { label: 'Users', value: 890, unit: 'k', change: '+31%', color: '#4facfe' },
          { label: 'Revenue', value: 720, unit: '$k', change: '+11%', color: '#00c6ff' },
          { label: 'Traffic', value: 910, unit: 'k', change: '+27%', color: '#38ef7d' },
          { label: 'Orders', value: 640, unit: 'k', change: '+2%', color: '#a855f7' },
          { label: 'Growth', value: 710, unit: '%', change: '+12%', color: '#f43f5e' }
        ],
        q3: [
          { label: 'Sales', value: 920, unit: '$k', change: '+28%', color: '#00f2fe' },
          { label: 'Users', value: 740, unit: 'k', change: '+15%', color: '#4facfe' },
          { label: 'Revenue', value: 880, unit: '$k', change: '+19%', color: '#00c6ff' },
          { label: 'Traffic', value: 650, unit: 'k', change: '+9%', color: '#38ef7d' },
          { label: 'Orders', value: 930, unit: 'k', change: '+34%', color: '#a855f7' },
          { label: 'Growth', value: 810, unit: '%', change: '+20%', color: '#f43f5e' }
        ]
      };

      const barsContainer = document.getElementById('bars-container');
      const legendContainer = document.getElementById('dashboard-legend');
      const tooltip = document.getElementById('chart-tooltip');
      const tooltipLabel = document.getElementById('tooltip-label');
      const tooltipValue = document.getElementById('tooltip-value');
      const tooltipSub = document.getElementById('tooltip-sub');
      const metricSelect = document.getElementById('metric-selector');
      const viewport = document.querySelector('.chart-viewport');

      let currentData = datasets.q1;

      function renderChart(data) {
        barsContainer.innerHTML = '';
        legendContainer.innerHTML = '';
        const maxValue = Math.max(...data.map(d => d.value));

        data.forEach((item, index) => {
          const heightPercent = (item.value / maxValue) * 100;

          // Build 3D Isometric Column Structure
          const barEl = document.createElement('div');
          barEl.className = 'iso-bar-wrapper';
          barEl.style.setProperty('--bar-color', item.color);
          barEl.style.setProperty('--target-height', `${heightPercent}%`);
          barEl.style.setProperty('--delay', `${index * 0.08}s`);

          barEl.innerHTML = `
            <div class="iso-bar">
              <div class="face front"></div>
              <div class="face side"></div>
              <div class="face back"></div>
              <div class="face left"></div>
              <div class="face top">
                <div class="reflection"></div>
              </div>
              <div class="shadow"></div>
            </div>
            <div class="bar-tag">${item.label}</div>
          `;

          // Event listeners for tooltips
          barEl.addEventListener('mouseenter', (e) => showTooltip(e, item));
          barEl.addEventListener('mousemove', (e) => updateTooltipPosition(e));
          barEl.addEventListener('mouseleave', hideTooltip);

          barsContainer.appendChild(barEl);

          // Legend item creation
          const legendItem = document.createElement('div');
          legendItem.className = 'legend-item';
          legendItem.innerHTML = `
            <span class="legend-color" style="background: ${item.color}"></span>
            <span class="legend-text">${item.label}: <strong>${item.value}${item.unit}</strong></span>
          `;
          legendContainer.appendChild(legendItem);
        });
      }

      function showTooltip(e, item) {
        tooltipLabel.textContent = item.label;
        tooltipValue.textContent = `${item.value} ${item.unit}`;
        tooltipSub.textContent = `${item.change} vs prev quarter`;
        tooltip.style.opacity = '1';
        tooltip.setAttribute('aria-hidden', 'false');
        updateTooltipPosition(e);
      }

      function updateTooltipPosition(e) {
        const bounds = viewport.getBoundingClientRect();
        const x = e.clientX - bounds.left;
        const y = e.clientY - bounds.top;

        tooltip.style.transform = `translate(${x}px, ${y - 15}px) translate(-50%, -100%)`;
      }

      function hideTooltip() {
        tooltip.style.opacity = '0';
        tooltip.setAttribute('aria-hidden', 'true');
      }

      metricSelect.addEventListener('change', (e) => {
        currentData = datasets[e.target.value];
        renderChart(currentData);
      });

      renderChart(currentData);
    });
  </script>
</body>
</html>
