<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Foucault Pendulum Swing CSS Modal"
  >
  <title>Foucault Pendulum Swing Modal</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="demo">
    <button
      class="open-modal"
      type="button"
      popovertarget="pendulum-modal"
    >
      Open Modal
    </button>

    <div
      id="pendulum-modal"
      class="modal"
      popover
    >
      <div class="modal-content">

        <div class="pendulum" aria-hidden="true">
          <div class="pendulum-string"></div>
          <div class="pendulum-bob"></div>
        </div>

        <div class="modal-body">
          <p class="modal-label">Foucault Motion</p>

          <h1>Welcome</h1>

          <p>
            Experience a smooth modal inspired by the graceful
            swinging motion of a Foucault pendulum.
          </p>

          <button
            class="close-modal"
            type="button"
            popovertarget="pendulum-modal"
            popovertargetaction="hide"
          >
            Close
          </button>
        </div>

      </div>
    </div>
  </main>

</body>
</html>
