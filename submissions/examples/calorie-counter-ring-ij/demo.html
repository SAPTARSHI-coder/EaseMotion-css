<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-calorie-counter-ring demo</title>
</head>
<body>
<div class="ccr-app">
  <span class="ccr-title">CALORIE GOAL</span>
  <div class="ccr-ring">
    <span class="ccr-mask"></span>
    <div class="ccr-core">
      <span class="ccr-value">420</span>
      <span class="ccr-unit">KCAL</span>
    </div>
  </div>
  <span class="ccr-goal">GOAL 600</span>
</div>
</body>
</html>
