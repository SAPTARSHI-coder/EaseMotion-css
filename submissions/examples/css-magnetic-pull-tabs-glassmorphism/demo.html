<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Magnetic Pull Tabs</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<main class="glass-ui">


<header class="hero">

    <h1>
        CSS Magnetic Pull Tabs
    </h1>

    <p>
        A pure CSS animated tab component with magnetic pull
        interaction for glassmorphism UI layouts.
    </p>

</header>




<section class="tabs" aria-label="Navigation Tabs">



<button class="tab active">

    <span class="icon">
        🏠
    </span>

    Home

</button>




<button class="tab">

    <span class="icon">
        ✨
    </span>

    Features

</button>




<button class="tab">

    <span class="icon">
        📁
    </span>

    Projects

</button>




<button class="tab">

    <span class="icon">
        ⚙️
    </span>

    Settings

</button>



</section>





<section class="glass-card">


<h2>
    Magnetic Glass Interface
</h2>


<p>
    Hover over the tabs to experience smooth magnetic pull
    movement created completely with CSS.
</p>


</section>



</main>


</body>

</html>
