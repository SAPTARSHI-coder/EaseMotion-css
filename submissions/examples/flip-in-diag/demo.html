<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flip In Diagonal Demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background-color: #e2e8f0;
      gap: 2rem;
    }
    .demo-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 3rem;
    }
    .box {
      width: 150px;
      height: 150px;
      background: #10b981;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      text-align: center;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
    }
    .replay-btn {
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
      background: #3b82f6;
      color: white;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="demo-grid" id="grid">
    <div class="box flip-in-diag-1-ag">Diag 1<br>(Top-Left to Bottom-Right)</div>
    <div class="box flip-in-diag-2-ag" style="background: #ef4444;">Diag 2<br>(Bottom-Left to Top-Right)</div>
  </div>

  <button class="replay-btn" onclick="replay()">Replay Animations</button>

  <script>
    function replay() {
      const grid = document.getElementById('grid');
      const clone = grid.cloneNode(true);
      grid.parentNode.replaceChild(clone, grid);
    }
  </script>
</body>
</html>
