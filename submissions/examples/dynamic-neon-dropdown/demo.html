<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Dynamic Dropdown</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <div class="dropdown-card">

            <h1>Neon Dropdown</h1>
            <p class="subtitle">Choose your favorite category</p>

            <div class="dropdown">
                <button class="dropdown-toggle" aria-expanded="false">
                    <span>Select a category</span>
                    <span class="arrow">⌄</span>
                </button>

                <div class="dropdown-menu">
                    <button class="dropdown-item">Web Development</button>
                    <button class="dropdown-item">UI/UX Design</button>
                    <button class="dropdown-item">Artificial Intelligence</button>
                    <button class="dropdown-item">Cyber Security</button>
                    <button class="dropdown-item">Data Science</button>
                </div>
            </div>

        </div>
    </main>

    <script>
        const dropdown = document.querySelector(".dropdown");
        const toggle = document.querySelector(".dropdown-toggle");
        const items = document.querySelectorAll(".dropdown-item");
        const selectedText = toggle.querySelector("span");

        toggle.addEventListener("click", () => {
            dropdown.classList.toggle("active");

            const expanded = dropdown.classList.contains("active");
            toggle.setAttribute("aria-expanded", expanded);
        });

        items.forEach(item => {
            item.addEventListener("click", () => {
                selectedText.textContent = item.textContent;
                dropdown.classList.remove("active");
                toggle.setAttribute("aria-expanded", "false");
            });
        });

        document.addEventListener("click", (event) => {
            if (!dropdown.contains(event.target)) {
                dropdown.classList.remove("active");
                toggle.setAttribute("aria-expanded", "false");
            }
        });
    </script>

</body>
</html>
