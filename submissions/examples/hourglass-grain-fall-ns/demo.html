<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hourglass Grain Fall — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Hourglass Grain Fall demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Hourglass Grain Fall</h1>
      <p class="lede">Hourglass sand grains falling through the neck</p>
    </header>

    <section class="ease-hourglass-grain-fall" data-demo="hourglass-grain-fall" aria-live="polite">
      <div class="ease-hourglass-grain-fall__housing">
        <div class="ease-hourglass-grain-fall__bezel">
          <div class="ease-hourglass-grain-fall__face">
            <div class="ease-hourglass-grain-fall__readout">
              <span class="ease-hourglass-grain-fall__label">Hourglass Grain Fall</span>
              <span class="ease-hourglass-grain-fall__value">LIVE</span>
            </div>
            <div class="ease-hourglass-grain-fall__motion" aria-hidden="true">
              <span class="ease-hourglass-grain-fall__a"></span>
              <span class="ease-hourglass-grain-fall__b"></span>
              <span class="ease-hourglass-grain-fall__c"></span>
              <span class="ease-hourglass-grain-fall__d"></span>
            </div>
            <div class="ease-hourglass-grain-fall__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-hourglass-grain-fall__controls">
          <button type="button" class="ease-hourglass-grain-fall__btn primary">Engage</button>
          <button type="button" class="ease-hourglass-grain-fall__btn">Reset</button>
          <label class="ease-hourglass-grain-fall__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-hourglass-grain-fall__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
