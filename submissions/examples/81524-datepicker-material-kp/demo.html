<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Animated Datepicker - Material Design</title><link rel="stylesheet" href="style.css" /></head>
<body>
  <main class="datepicker-demo" aria-labelledby="picker-title">
    <section class="picker-shell">
      <p class="eyebrow">Material scheduler</p>
      <h1 id="picker-title">Animated Datepicker</h1>
      <div class="date-card" role="group" aria-label="August datepicker preview">
        <header><button aria-label="Previous month">‹</button><strong>August 2026</strong><button aria-label="Next month">›</button></header>
        <div class="weekdays"><span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span><span>Su</span></div>
        <div class="days">
          <span>27</span><span>28</span><span>29</span><span>30</span><span>31</span><button>1</button><button>2</button><button>3</button><button>4</button><button>5</button><button>6</button><button>7</button><button>8</button><button>9</button><button>10</button><button>11</button><button>12</button><button class="selected">13</button><button>14</button><button>15</button><button>16</button><button>17</button><button>18</button><button>19</button><button>20</button><button>21</button><button>22</button><button>23</button>
        </div>
        <footer><span>Design review</span><b>10:30 AM</b></footer>
      </div>
    </section>
  </main>
</body>
</html>
