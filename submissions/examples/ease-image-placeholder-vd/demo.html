<!DOCTYPE html>
<html lang="en">
<head>

    <title>Ease Image Placeholder</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="placeholder-demo">

    <div class="image-placeholder landscape">

</div>
