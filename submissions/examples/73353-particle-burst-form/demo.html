<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>Particle Burst Form</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">
    <section class="form-card" aria-labelledby="form-title">

      <div class="particles particles-one" aria-hidden="true">
        <span></span><span></span><span></span><span></span>
      </div>

      <div class="particles particles-two" aria-hidden="true">
        <span></span><span></span><span></span><span></span>
      </div>

      <header class="form-header">
        <span class="eyebrow">CONTACT</span>
        <h1 id="form-title">Start a conversation.</h1>
        <p>
          Send a message and we'll get back to you as soon as possible.
        </p>
      </header>

      <form class="particle-form" action="#" method="post">

        <div class="field">
          <label for="name">Full name</label>
          <div class="input-wrap">
            <input
              id="name"
              name="name"
              type="text"
              placeholder="Enter your name"
              autocomplete="name"
              required
            >
            <span class="field-particle" aria-hidden="true"></span>
          </div>
        </div>

        <div class="field">
          <label for="email">Email address</label>
          <div class="input-wrap">
            <input
              id="email"
              name="email"
              type="email"
              placeholder="you@example.com"
              autocomplete="email"
              required
            >
            <span class="field-particle" aria-hidden="true"></span>
          </div>
        </div>

        <div class="field">
          <label for="subject">Subject</label>
          <div class="input-wrap">
            <input
              id="subject"
              name="subject"
              type="text"
              placeholder="What is this about?"
              required
            >
            <span class="field-particle" aria-hidden="true"></span>
          </div>
        </div>

        <div class="field">
          <label for="message">Message</label>
          <div class="input-wrap textarea-wrap">
            <textarea
              id="message"
              name="message"
              rows="5"
              placeholder="Write your message..."
              required
            ></textarea>
            <span class="field-particle" aria-hidden="true"></span>
          </div>
        </div>

        <label class="consent">
          <input type="checkbox" name="consent" required>
          <span class="custom-checkbox" aria-hidden="true"></span>
          <span>I agree to be contacted about this message.</span>
        </label>

        <button class="submit-button" type="submit">
          <span class="button-text">Send Message</span>
          <span class="button-icon" aria-hidden="true">↗</span>

          <span class="burst" aria-hidden="true">
            <i></i><i></i><i></i><i></i>
            <i></i><i></i><i></i><i></i>
          </span>
        </button>

      </form>

    </section>
  </main>

</body>
</html>
