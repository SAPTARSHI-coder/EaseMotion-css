<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-music-conductor-baton demo</title>
</head>
<body>
<div class="cd-app">
  <div class="cd-stage">
    <div class="cd-podium"></div>
    <div class="cd-conductor">
      <div class="cd-head"></div>
      <div class="cd-hair"></div>
      <div class="cd-body"></div>
      <div class="cd-arm">
        <div class="cd-baton"></div>
      </div>
      <div class="cd-hand"></div>
    </div>
    <div class="cd-stand">
      <div class="cd-score"></div>
      <div class="cd-leg cd-leg-1"></div>
      <div class="cd-leg cd-leg-2"></div>
    </div>
    <span class="cd-note cd-note-1">&#9834;</span>
    <span class="cd-note cd-note-2">&#9835;</span>
    <span class="cd-note cd-note-3">&#9834;</span>
  </div>
</div>
</body>
</html>
