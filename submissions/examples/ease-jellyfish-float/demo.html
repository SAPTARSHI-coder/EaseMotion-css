<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jellyfish Float · Glowing Jellyfish Pulse</title>
    <meta name="description" content="Mesmerizing glowing jellyfish with pulsing bioluminescence, floating animations, and trailing tentacles.">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1 class="title">🪼 JELLYFISH</h1>
        
        <div class="canvas-wrapper">
            <canvas id="jellyfishCanvas" width="600" height="500"></canvas>
            <div class="glow-overlay"></div>
        </div>

        <div class="controls">
            <button class="toggle-btn" id="toggleBtn">⏸️ PAUSE</button>
            <button class="reset-btn" id="resetBtn">⟳ RESET</button>
            <div class="speed-control">
                <label>Speed</label>
                <input type="range" id="speedSlider" min="1" max="10" value="5">
                <span id="speedLabel">5</span>
            </div>
        </div>

        <div class="info">
            <span>🪼 GLOWING JELLYFISH</span>
            <small>pulse · float · bioluminescence</small>
        </div>
        <div class="hint">
            <span>✨ glowing tentacles · gentle pulse · mesmerizing float</span>
        </div>
    </div>

    <script>
        (function() {
            const canvas = document.getElementById('jellyfishCanvas');
            const ctx = canvas.getContext('2d');
            const W = 600, H = 500;
            
            const toggleBtn = document.getElementById('toggleBtn');
            const resetBtn = document.getElementById('resetBtn');
            const speedSlider = document.getElementById('speedSlider');
            const speedLabel = document.getElementById('speedLabel');

            let isAnimating = true;
            let speed = 5;
            let time = 0;

            // ---- Jellyfish Class ----
            class Jellyfish {
                constructor(x, y) {
                    this.x = x || W / 2;
                    this.y = y || H / 2;
                    this.baseX = this.x;
                    this.baseY = this.y;
                    this.size = 60 + Math.random() * 40;
                    this.color = this.randomColor();
                    this.glowColor = this.color;
                    
                    // Movement
                    this.angle = Math.random() * Math.PI * 2;
                    this.driftSpeed = 0.2 + Math.random() * 0.3;
                    this.driftRadius = 20 + Math.random() * 30;
                    this.floatSpeed = 0.3 + Math.random() * 0.4;
                    this.floatAmplitude = 10 + Math.random() * 15;
                    
                    // Pulse
                    this.pulsePhase = Math.random() * Math.PI * 2;
                    this.pulseSpeed = 0.02 + Math.random() * 0.02;
                    this.pulseAmount = 0.1 + Math.random() * 0.15;
                    
                    // Tentacles
                    this.tentacleCount = 8 + Math.floor(Math.random() * 6);
                    this.tentacles = [];
                    for (let i = 0; i < this.tentacleCount; i++) {
                        this.tentacles.push({
                            angle: (i / this.tentacleCount) * Math.PI * 2,
                            length: 40 + Math.random() * 60,
                            segments: 10 + Math.floor(Math.random() * 10),
                            waveSpeed: 0.02 + Math.random() * 0.03,
                            waveAmplitude: 5 + Math.random() * 10,
                            phase: Math.random() * Math.PI * 2
                        });
                    }
                }

                randomColor() {
                    const colors = [
                        { main: '#ff6bcd', glow: 'rgba(255, 107, 205, 0.4)' },
                        { main: '#00d4ff', glow: 'rgba(0, 212, 255, 0.4)' },
                        { main: '#b026ff', glow: 'rgba(176, 38, 255, 0.4)' },
                        { main: '#ff2d55', glow: 'rgba(255, 45, 85, 0.4)' },
                        { main: '#39ff14', glow: 'rgba(57, 255, 20, 0.3)' },
                        { main: '#ffd700', glow: 'rgba(255, 215, 0, 0.4)' },
                        { main: '#00ffcc', glow: 'rgba(0, 255, 204, 0.4)' },
                        { main: '#ff69b4', glow: 'rgba(255, 105, 180, 0.4)' }
                    ];
                    return colors[Math.floor(Math.random() * colors.length)];
                }

                update() {
                    const dt = speed / 5;
                    time += 0.01 * dt;
                    
                    // Drift movement
                    this.angle += this.driftSpeed * 0.01 * dt;
                    this.x = this.baseX + Math.cos(this.angle) * this.driftRadius;
                    this.y = this.baseY + Math.sin(this.angle * 0.7) * this.driftRadius * 0.5;
                    
                    // Float up/down
                    this.y += Math.sin(time * this.floatSpeed) * this.floatAmplitude * 0.02 * dt;
                    
                    // Pulse
                    this.pulsePhase += this.pulseSpeed * dt;
                }

                draw(ctx) {
                    const pulse = 1 + Math.sin(this.pulsePhase) * this.pulseAmount;
                    const size = this.size * pulse;
                    
                    // ---- Glow ----
                    const gradient = ctx.createRadialGradient(
                        this.x, this.y, 0,
                        this.x, this.y, size * 1.5
                    );
                    gradient.addColorStop(0, this.color.glow);
                    gradient.addColorStop(0.5, this.color.glow);
                    gradient.addColorStop(1, 'rgba(0,0,0,0)');
                    ctx.fillStyle = gradient;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, size * 1.5, 0, Math.PI * 2);
                    ctx.fill();

                    // ---- Tentacles ----
                    for (let tentacle of this.tentacles) {
                        this.drawTentacle(ctx, tentacle, size, pulse);
                    }

                    // ---- Body (dome) ----
                    ctx.save();
                    ctx.translate(this.x, this.y);
                    ctx.scale(pulse, pulse);
                    
                    // Glow ring
                    ctx.shadowColor = this.color.main;
                    ctx.shadowBlur = 30;
                    
                    // Dome
                    const gradient2 = ctx.createRadialGradient(
                        -size * 0.2, -size * 0.3, 0,
                        0, 0, size
                    );
                    gradient2.addColorStop(0, 'rgba(255,255,255,0.3)');
                    gradient2.addColorStop(0.3, this.color.main);
                    gradient2.addColorStop(0.8, this.color.main);
                    gradient2.addColorStop(1, 'rgba(0,0,0,0.1)');
                    
                    ctx.fillStyle = gradient2;
                    ctx.beginPath();
                    ctx.ellipse(0, 0, size * 0.7, size * 0.8, 0, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // Inner glow
                    ctx.shadowBlur = 60;
                    ctx.shadowColor = this.color.main;
                    ctx.fillStyle = 'rgba(255,255,255,0.05)';
                    ctx.beginPath();
                    ctx.ellipse(0, -size * 0.1, size * 0.3, size * 0.4, 0, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // Highlights
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = 'rgba(255,255,255,0.15)';
                    ctx.beginPath();
                    ctx.ellipse(-size * 0.2, -size * 0.3, size * 0.15, size * 0.2, -0.3, 0, Math.PI * 2);
                    ctx.fill();
                    
                    ctx.fillStyle = 'rgba(255,255,255,0.08)';
                    ctx.beginPath();
                    ctx.ellipse(size * 0.1, -size * 0.4, size * 0.08, size * 0.12, 0.2, 0, Math.PI * 2);
                    ctx.fill();
                    
                    ctx.restore();

                    // ---- Bioluminescent dots ----
                    for (let i = 0; i < 8; i++) {
                        const angle = (i / 8) * Math.PI * 2 + time * 0.02;
                        const dist = size * 0.4 + Math.sin(time * 0.03 + i) * size * 0.1;
                        const dotX = this.x + Math.cos(angle) * dist;
                        const dotY = this.y + Math.sin(angle) * dist * 0.6;
                        const dotSize = 2 + Math.sin(time * 0.05 + i * 2) * 1.5 + 1.5;
                        
                        ctx.save();
                        ctx.shadowColor = this.color.main;
                        ctx.shadowBlur = 20;
                        ctx.fillStyle = 'rgba(255,255,255,0.6)';
                        ctx.beginPath();
                        ctx.arc(dotX, dotY, dotSize * pulse, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.restore();
                    }
                }

                drawTentacle(ctx, tentacle, size, pulse) {
                    const segments = tentacle.segments;
                    const length = tentacle.length * (0.8 + pulse * 0.2);
                    const startX = this.x + Math.cos(tentacle.angle) * size * 0.5 * pulse;
                    const startY = this.y + Math.sin(tentacle.angle) * size * 0.6 * pulse;
                    
                    ctx.save();
                    ctx.shadowColor = this.color.main;
                    ctx.shadowBlur = 15;
                    ctx.lineWidth = 1.5 + Math.sin(time * 0.05 + tentacle.phase) * 0.5;
                    ctx.strokeStyle = this.color.main;
                    ctx.globalAlpha = 0.6 + Math.sin(time * 0.03 + tentacle.phase) * 0.2;
                    
                    ctx.beginPath();
                    ctx.moveTo(startX, startY);
                    
                    for (let i = 1; i <= segments; i++) {
                        const t = i / segments;
                        const angle = tentacle.angle + 
                            Math.sin(t * 3 + time * tentacle.waveSpeed + tentacle.phase) * 
                            tentacle.waveAmplitude * 0.02 * (1 + t * 0.5);
                        const dist = t * length;
                        const x = startX + Math.cos(angle) * dist;
                        const y = startY + Math.sin(angle) * dist + t * 20;
                        ctx.lineTo(x, y);
                    }
                    
                    ctx.stroke();
                    
                    // Glow trail
                    ctx.shadowBlur = 30;
                    ctx.globalAlpha = 0.2;
                    ctx.lineWidth = 4;
                    ctx.stroke();
                    
                    ctx.restore();
                }
            }

            // ---- Create jellyfish ----
            let jellyfish = [];
            const numJellyfish = 3;

            function createJellyfish() {
                jellyfish = [];
                for (let i = 0; i < numJellyfish; i++) {
                    const x = W * 0.2 + (i / (numJellyfish - 1)) * W * 0.6;
                    const y = H * 0.2 + Math.random() * H * 0.6;
                    const j = new Jellyfish(x, y);
                    j.baseX = x;
                    j.baseY = y;
                    j.driftRadius = 20 + Math.random() * 40;
                    j.floatAmplitude = 10 + Math.random() * 20;
                    jellyfish.push(j);
                }
            }

            // ---- Draw background ----
            function drawBackground() {
                // Deep ocean gradient
                const gradient = ctx.createLinearGradient(0, 0, 0, H);
                gradient.addColorStop(0, '#0a0a1a');
                gradient.addColorStop(0.3, '#0d1b2a');
                gradient.addColorStop(0.6, '#0a1628');
                gradient.addColorStop(1, '#050a12');
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, W, H);
                
                // Subtle light rays
                for (let i = 0; i < 5; i++) {
                    const x = 50 + i * 120 + Math.sin(time * 0.01 + i) * 20;
                    const gradient2 = ctx.createLinearGradient(x, 0, x + 20, H);
                    gradient2.addColorStop(0, 'rgba(100, 200, 255, 0.02)');
                    gradient2.addColorStop(0.5, 'rgba(100, 200, 255, 0.01)');
                    gradient2.addColorStop(1, 'rgba(100, 200, 255, 0)');
                    ctx.fillStyle = gradient2;
                    ctx.fillRect(x, 0, 20, H);
                }
                
                // Bubbles
                for (let i = 0; i < 15; i++) {
                    const x = (i * 137 + 50) % W;
                    const y = (i * 97 + time * (0.2 + i * 0.01) * 10) % H;
                    const size = 1 + (i % 5) * 0.5;
                    ctx.fillStyle = 'rgba(255,255,255,0.03)';
                    ctx.beginPath();
                    ctx.arc(x, y, size, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // ---- Animation loop ----
            function animate() {
                if (!isAnimating) {
                    requestAnimationFrame(animate);
                    return;
                }
                
                drawBackground();
                
                for (let j of jellyfish) {
                    j.update();
                    j.draw(ctx);
                }
                
                // Draw ambient glow particles
                for (let i = 0; i < 20; i++) {
                    const x = (i * 173 + 30) % W;
                    const y = (i * 113 + time * (0.1 + i * 0.005) * 5) % H;
                    const size = 0.5 + Math.sin(time * 0.02 + i) * 0.5 + 0.5;
                    ctx.fillStyle = `rgba(150, 200, 255, ${0.02 + Math.sin(time * 0.01 + i) * 0.01})`;
                    ctx.beginPath();
                    ctx.arc(x, y, size, 0, Math.PI * 2);
                    ctx.fill();
                }
                
                requestAnimationFrame(animate);
            }

            // ---- Toggle animation ----
            function toggleAnimation() {
                isAnimating = !isAnimating;
                toggleBtn.textContent = isAnimating ? '⏸️ PAUSE' : '▶️ PLAY';
            }

            // ---- Reset ----
            function resetJellyfish() {
                createJellyfish();
                time = 0;
            }

            // ---- Speed control ----
            speedSlider.addEventListener('input', function() {
                speed = parseInt(this.value);
                speedLabel.textContent = speed;
            });

            // ---- Event Listeners ----
            toggleBtn.addEventListener('click', toggleAnimation);
            resetBtn.addEventListener('click', resetJellyfish);

            // ---- Keyboard shortcuts ----
            document.addEventListener('keydown', function(e) {
                if (e.key === ' ' || e.key === 'Space') {
                    e.preventDefault();
                    toggleAnimation();
                }
                if (e.key === 'r' || e.key === 'R') {
                    resetJellyfish();
                }
            });

            // ---- Initialize ----
            createJellyfish();
            animate();

            console.log('🪼 Jellyfish Float · Press Space to pause · R to reset');
        })();
    </script>
</body>
</html>
