<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glitch Text Effect - EaseMotion CSS</title>
    <link rel="stylesheet" href="style.css">
    <!-- Linking the main framework CSS -->
    <link rel="stylesheet" href="../../easemotion.css">
</head>
<body>
    <div class="cyber-container">
        <p class="subtitle">Hover over the text below</p>
        
        <!-- Notice the data-text attribute, it is required for the CSS pseudo-elements -->
        <h1 class="ease-glitch-mk" data-text="SYSTEM OVERRIDE">
            SYSTEM OVERRIDE
        </h1>
        
        <h2 class="ease-glitch-mk small" data-text="Access Granted">
            Access Granted
        </h2>
    </div>
</body>
</html>
