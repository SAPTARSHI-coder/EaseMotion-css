<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Loader: Holographic Flicker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="layout-container">
        
        <header class="section-header">
            <h1 class="title">Pure CSS Loader: Holographic Flicker</h1>
            <p class="subtitle">A sci-fi inspired loader featuring a semi-transparent, cyan glowing orb with CRT scanlines and erratic opacity flickering.</p>
        </header>

        <div class="demo-area">
            
            <div class="loader-container" aria-label="Loading content, holographic flicker animation playing">
                
                <!-- 
                  [TECHNIQUE] Holographic Orb
                  A glowing, semi-transparent sphere that flickers like a failing hologram.
                -->
                <div class="hologram-wrapper" aria-hidden="true">
                    
                    <div class="holo-orb">
                        <!-- 
                          [TECHNIQUE] CRT Scanlines
                          A pseudo-element is used inside the orb to draw horizontal 
                          scanlines using a repeating-linear-gradient, which scroll upwards.
                        -->
                        <div class="holo-scanlines"></div>
                    </div>
                    
                    <!-- The glowing base projection platform -->
                    <div class="holo-base"></div>
                    
                </div>
                
                <div class="loading-text">Projecting Data...</div>
                
            </div>
            
        </div>
        
    </div>

</body>
</html>
