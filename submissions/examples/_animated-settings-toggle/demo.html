<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
        name="description"
        content="Pure CSS animated settings toggle component"
    >
    <title>Animated Settings Toggle</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="page">

    <section class="settings-card" aria-labelledby="settings-title">

        <div class="card-header">
            <div class="header-icon" aria-hidden="true">
                ⚙
            </div>

            <div>
                <h1 id="settings-title">Quick Settings</h1>
                <p>Manage your preferences</p>
            </div>
        </div>


        <div class="settings-list">

            <!-- Setting 1 -->
            <div class="setting-item">

                <div class="setting-info">
                    <span class="setting-title">Notifications</span>
                    <span class="setting-description">
                        Receive updates and alerts
                    </span>
                </div>

                <label class="toggle" aria-label="Enable notifications">
                    <input type="checkbox" checked>
                    <span class="toggle-track">
                        <span class="toggle-thumb"></span>
                    </span>
                </label>

            </div>


            <!-- Setting 2 -->
            <div class="setting-item">

                <div class="setting-info">
                    <span class="setting-title">Dark Mode</span>
                    <span class="setting-description">
                        Use a darker appearance
                    </span>
                </div>

                <label class="toggle" aria-label="Enable dark mode">
                    <input type="checkbox">
                    <span class="toggle-track">
                        <span class="toggle-thumb"></span>
                    </span>
                </label>

            </div>


            <!-- Setting 3 -->
            <div class="setting-item">

                <div class="setting-info">
                    <span class="setting-title">Auto Save</span>
                    <span class="setting-description">
                        Automatically save your changes
                    </span>
                </div>

                <label class="toggle" aria-label="Enable auto save">
                    <input type="checkbox" checked>
                    <span class="toggle-track">
                        <span class="toggle-thumb"></span>
                    </span>
                </label>

            </div>


            <!-- Setting 4 -->
            <div class="setting-item">

                <div class="setting-info">
                    <span class="setting-title">Online Status</span>
                    <span class="setting-description">
                        Show when you are active
                    </span>
                </div>

                <label class="toggle" aria-label="Show online status">
                    <input type="checkbox">
                    <span class="toggle-track">
                        <span class="toggle-thumb"></span>
                    </span>
                </label>

            </div>

        </div>


        <div class="card-footer">
            <span class="status-dot"></span>
            <span>Settings are saved automatically</span>
        </div>

    </section>

</main>

</body>
</html>
