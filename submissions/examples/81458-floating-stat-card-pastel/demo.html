<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Floating pastel stat card built with pure CSS."
  >

  <title>Floating Stat Card — Pastel</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="pastel-page">

    <header class="pastel-header">
      <span class="pastel-eyebrow">OVERVIEW</span>

      <h1>Performance at a glance</h1>

      <p>
        A lightweight statistical overview with soft pastel
        surfaces and subtle floating motion.
      </p>
    </header>

    <section
      class="pastel-stats"
      aria-label="Performance statistics"
    >

      <article class="pastel-stat-card pastel-stat-card--lavender">

        <div class="pastel-stat-card__top">
          <span class="pastel-stat-card__label">
            TOTAL USERS
          </span>

          <span
            class="pastel-stat-card__icon"
            aria-hidden="true"
          >
            ↗
          </span>
        </div>

        <div class="pastel-stat-card__value">
          24.8K
        </div>

        <div class="pastel-stat-card__bottom">
          <span class="pastel-stat-card__change">
            +12.8%
          </span>

          <span class="pastel-stat-card__period">
            this month
          </span>
        </div>

        <div
          class="pastel-stat-card__line"
          aria-hidden="true"
        ></div>

      </article>

      <article class="pastel-stat-card pastel-stat-card--mint">

        <div class="pastel-stat-card__top">
          <span class="pastel-stat-card__label">
            CONVERSION
          </span>

          <span
            class="pastel-stat-card__icon"
            aria-hidden="true"
          >
            %
          </span>
        </div>

        <div class="pastel-stat-card__value">
          68.4%
        </div>

        <div class="pastel-stat-card__bottom">
          <span class="pastel-stat-card__change">
            +8.2%
          </span>

          <span class="pastel-stat-card__period">
            this month
          </span>
        </div>

        <div
          class="pastel-stat-card__line"
          aria-hidden="true"
        ></div>

      </article>

      <article class="pastel-stat-card pastel-stat-card--peach">

        <div class="pastel-stat-card__top">
          <span class="pastel-stat-card__label">
            REVENUE
          </span>

          <span
            class="pastel-stat-card__icon"
            aria-hidden="true"
          >
            $
          </span>
        </div>

        <div class="pastel-stat-card__value">
          $84.2K
        </div>

        <div class="pastel-stat-card__bottom">
          <span class="pastel-stat-card__change">
            +18.6%
          </span>

          <span class="pastel-stat-card__period">
            this month
          </span>
        </div>

        <div
          class="pastel-stat-card__line"
          aria-hidden="true"
        ></div>

      </article>

    </section>

  </main>

</body>
</html>
