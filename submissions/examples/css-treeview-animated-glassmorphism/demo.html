<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glassmorphism Animated Treeview</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="ag-bg-mesh"></div>
    <div class="ag-tree-container">
        <ul class="ag-tree">
            <li class="ag-node">
                <input type="checkbox" id="ag-n1" class="ag-toggle">
                <label for="ag-n1" class="ag-label">📁 Projects</label>
                <ul class="ag-subtree">
                    <li class="ag-leaf">📄 specs.pdf</li>
                    <li class="ag-leaf">📄 budget.xlsx</li>
                </ul>
            </li>
            <li class="ag-node">
                <input type="checkbox" id="ag-n2" class="ag-toggle">
                <label for="ag-n2" class="ag-label">📁 Media</label>
                <ul class="ag-subtree">
                    <li class="ag-node">
                        <input type="checkbox" id="ag-n2-1" class="ag-toggle">
                        <label for="ag-n2-1" class="ag-label">📁 Photos</label>
                        <ul class="ag-subtree">
                            <li class="ag-leaf">🌅 img_01.jpg</li>
                            <li class="ag-leaf">🌅 img_02.jpg</li>
                        </ul>
                    </li>
                    <li class="ag-leaf">🎬 video.mp4</li>
                </ul>
            </li>
        </ul>
    </div>
</body>
</html>
