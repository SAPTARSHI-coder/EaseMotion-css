<!-- EaseMotion component: analog-clock-face -->
<!doctype html>
<html lang="en" data-face="analog">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Ease Analog Clock Face</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="clock-stand">
  <div class="clock-face">
    <span class="num n-12">12</span>
    <span class="num n-3">3</span>
    <span class="num n-6">6</span>
    <span class="num n-9">9</span>
    <i class="tick t1"></i>
    <i class="tick t2"></i>
    <i class="tick t3"></i>
    <i class="tick t4"></i>
    <i class="hand hand-hour"></i>
    <i class="hand hand-minute"></i>
    <i class="hand hand-second"></i>
    <i class="hub"></i>
  </div>
  <div class="readout">
    <span id="secDisplay" class="sec-read">32s</span>
    <span class="meridiem">AM</span>
  </div>
</main>
<script>
const sec=document.getElementById('secDisplay');
let s=32;
setInterval(()=>{s=(s+1)%60;sec.textContent=s+'s';},1000);
</script>
</body>
</html>
