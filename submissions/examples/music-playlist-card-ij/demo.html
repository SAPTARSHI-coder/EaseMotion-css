<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-music-playlist-card</title>
</head>
<body>
<main class="mpl-card">
  <div class="mpl-head">
    <div class="mpl-art">♪</div>
    <div class="mpl-meta">
      <p class="mpl-song">Midnight Drive</p>
      <p class="mpl-artist">Neon Coast</p>
    </div>
    <div class="mpl-eq">
      <span class="mpl-eq-bar-1"></span>
      <span class="mpl-eq-bar-2"></span>
      <span class="mpl-eq-bar-3"></span>
      <span class="mpl-eq-bar-4"></span>
    </div>
  </div>
  <div class="mpl-list">
    <div class="mpl-row mpl-row-1">
      <span class="mpl-num">1</span>
      <span class="mpl-track">Neon Skyline</span>
      <span class="mpl-dur">3:42</span>
    </div>
    <div class="mpl-row mpl-row-2">
      <span class="mpl-num">2</span>
      <span class="mpl-track">City Lights</span>
      <span class="mpl-dur">4:05</span>
    </div>
    <div class="mpl-row mpl-row-3">
      <span class="mpl-num">3</span>
      <span class="mpl-track">Glass Hearts</span>
      <span class="mpl-dur">3:18</span>
    </div>
    <div class="mpl-row mpl-row-4">
      <span class="mpl-num">4</span>
      <span class="mpl-track">Silver Wave</span>
      <span class="mpl-dur">5:01</span>
    </div>
  </div>
  <div class="mpl-play">▶</div>
</main>
</body>
</html>
