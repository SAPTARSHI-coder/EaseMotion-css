<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Fade-In Popover - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="cp-layout">
        <main class="cp-main">
            <h1 class="cp-title">NEURAL_INTERFACE</h1>
            <p class="cp-desc">Trigger telemetry panel to view system diagnostics.</p>
            
            <div class="cp-popover-sys">
                <input type="checkbox" id="cp-popover-toggle" class="cp-hidden-toggle">
                
                <label for="cp-popover-toggle" class="cp-btn" tabindex="0">
                    ACCESS TELEMETRY
                </label>

                <div class="cp-popover-box">
                    <div class="cp-popover-header">
                        <span class="cp-indicator"></span>
                        <h3>DIAGNOSTIC_LOG</h3>
                    </div>
                    
                    <div class="cp-popover-body">
                        <p class="cp-highlight">SYSTEM INTEGRITY: 98.4%</p>
                        <p class="cp-text">Core temperatures stable. Memory buffers clear across all primary proxy sectors.</p>
                        
                        <div class="cp-stat-row">
                            <span>CPU_LOAD</span>
                            <span class="cp-val">14.2%</span>
                        </div>
                        <div class="cp-stat-row">
                            <span>MEMORY</span>
                            <span class="cp-val">32.8 GB</span>
                        </div>
                    </div>
                    
                    <div class="cp-popover-footer">
                        <span class="cp-footer-code">SYS_ID // 0x8849F</span>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
