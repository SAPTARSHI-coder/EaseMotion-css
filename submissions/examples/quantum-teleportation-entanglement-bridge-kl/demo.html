<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Teleportation Entanglement Bridge - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030712; color: #ffffff;">

    <div class="ease-card ease-card-glass bridge-container">
        <div class="bridge-header">
            <h2>Entanglement Bridge</h2>
            <span class="ease-badge ease-badge-success">Connected</span>
        </div>
        
        <div class="bridge-screen ease-center">
            <div class="coherence-stream stream-1"></div>
            <div class="coherence-stream stream-2"></div>
            <div class="epr-channel-ring"></div>
            <div class="qubit-gateway-core ease-center"></div>
        </div>

        <div class="bridge-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">State Fidelity: 99.998%</span>
            <button class="ease-btn ease-btn-primary ease-btn-sm ease-hover-grow">Sync Bridge</button>
        </div>
    </div>

</body>
</html>
