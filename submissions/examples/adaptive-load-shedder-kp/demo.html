<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Adaptive Load Shedder</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="shedder-shell" aria-labelledby="shedder-title">
    <section class="shedder-board">
      <p class="eyebrow">Overload protection</p>
      <h1 id="shedder-title">Adaptive Load Shedder</h1>
      <p class="summary">Priority lanes pass through the admission gate while overload pressure redirects low-priority work into a shed queue.</p>
      <div class="shedder-stage" role="img" aria-label="Animated adaptive load shedder visualization">
        <div class="traffic-lanes"><span></span><span></span><span></span><span></span></div>
        <div class="admission-gate"><i></i><i></i><strong>gate</strong></div>
        <div class="priority-core"><b></b><b></b><em>priority</em></div>
        <div class="shed-queue"><small>shed</small><span></span><span></span></div>
      </div>
      <div class="readouts"><span>load 91%</span><span>admit 64%</span><span>shed 12%</span></div>
    </section>
  </main>
</body>
</html>
