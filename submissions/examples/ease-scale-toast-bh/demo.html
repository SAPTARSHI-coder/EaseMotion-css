<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ease-scale-toast-bh</title>
  <link rel="stylesheet" href="style.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #f1f5f9; padding: 2rem; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1rem; }
    h1 { color: #f97316; margin-bottom: 1rem; }
  </style>
</head>
<body>
  <h1>ease-scale-toast-bh</h1>
  
  <div class="ease-toast">
    <span class="ease-toast-icon">🎮</span>
    <div class="ease-toast-content">
      <div class="ease-toast-title">Achievement Unlocked!</div>
      <div class="ease-toast-message">You earned 500 XP</div>
    </div>
  </div>
  
  <div class="ease-toast">
    <span class="ease-toast-icon">🏆</span>
    <div class="ease-toast-content">
      <div class="ease-toast-title">Tournament Victory!</div>
      <div class="ease-toast-message">You ranked #1 this week</div>
    </div>
  </div>
  
  <div class="ease-toast">
    <span class="ease-toast-icon">🎁</span>
    <div class="ease-toast-content">
      <div class="ease-toast-title">Reward Claimed</div>
      <div class="ease-toast-message">New items added to inventory</div>
    </div>
  </div>
</body>
</html>
