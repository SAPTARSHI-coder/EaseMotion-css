<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Circular color picker — EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <header class="page-head">
      <h1>Circular color picker</h1>
      <p>A round colour-selection wheel whose hue ring glows and a rotating pointer selects the active hue.</p>
    </header>
    <section class="demo">
      <div class="circularcolorpicker" style="--h: 200; --s: 80; --l: 50"><div class="circularcolorpicker-pointer"></div><div class="circularcolorpicker-readout">hsl(200, 80%, 50%)</div></div>
    </section>
    <footer class="page-foot">
      <small>Submission folder: <code>submissions/examples/circular-color-picker/</code></small>
    </footer>
  </main>
</body>
</html>
