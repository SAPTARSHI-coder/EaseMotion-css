<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drag Swipeable Tabs</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <h1>Drag Swipeable Tabs</h1>

    <div class="tabs-wrap">
      <div class="tab-list" role="tablist">
        <button class="tab is-active" role="tab" aria-selected="true" id="t1" aria-controls="p1">Overview</button>
        <button class="tab" role="tab" aria-selected="false" id="t2" aria-controls="p2">Specs</button>
        <button class="tab" role="tab" aria-selected="false" id="t3" aria-controls="p3">Reviews</button>
      </div>
      <div class="tab-indicator" id="tabIndicator"></div>

      <div class="panel-viewport" id="panelViewport">
        <div class="panel-track" id="panelTrack">
          <div class="panel" role="tabpanel" id="p1" aria-labelledby="t1">Overview content goes here.</div>
          <div class="panel" role="tabpanel" id="p2" aria-labelledby="t2">Specs content goes here.</div>
          <div class="panel" role="tabpanel" id="p3" aria-labelledby="t3">Reviews content goes here.</div>
        </div>
      </div>
    </div>
  </main>

  <script>
    const tabs = Array.from(document.querySelectorAll('.tab'));
    const track = document.getElementById('panelTrack');
    const indicator = document.getElementById('tabIndicator');
    const viewport = document.getElementById('panelViewport');
    let current = 0;
    let startX = 0;
    let dragging = false;

    function goTo(index) {
      current = Math.min(Math.max(index, 0), tabs.length - 1);
      tabs.forEach((t, i) => {
        t.classList.toggle('is-active', i === current);
        t.setAttribute('aria-selected', String(i === current));
      });
      track.style.transform = `translateX(-${current * 100}%)`;
      indicator.style.width = tabs[current].offsetWidth + 'px';
      indicator.style.transform = `translateX(${tabs[current].offsetLeft}px)`;
    }

    tabs.forEach((tab, i) => tab.addEventListener('click', () => goTo(i)));

    tabs.forEach((tab, i) => {
      tab.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight') { e.preventDefault(); goTo(i + 1); tabs[current].focus(); }
        if (e.key === 'ArrowLeft') { e.preventDefault(); goTo(i - 1); tabs[current].focus(); }
      });
    });

    viewport.addEventListener('pointerdown', (e) => {
      dragging = true;
      startX = e.clientX;
      track.style.transition = 'none';
    });

    viewport.addEventListener('pointermove', (e) => {
      if (!dragging) return;
      const dx = e.clientX - startX;
      track.style.transform = `translateX(calc(-${current * 100}% + ${dx}px))`;
    });

    viewport.addEventListener('pointerup', (e) => {
      if (!dragging) return;
      dragging = false;
      track.style.transition = '';
      const dx = e.clientX - startX;
      if (Math.abs(dx) > 60) {
        goTo(dx < 0 ? current + 1 : current - 1);
      } else {
        goTo(current);
      }
    });

    window.addEventListener('load', () => goTo(0));
  </script>
</body>
</html>
