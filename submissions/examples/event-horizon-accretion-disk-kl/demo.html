<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Horizon Accretion Disk - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #020205; color: #ffffff;">

    <div class="ease-card ease-card-glass horizon-container">
        <div class="horizon-header">
            <h2>Event Horizon</h2>
            <span class="ease-badge ease-badge-danger">Accreting</span>
        </div>
        
        <div class="horizon-screen ease-center">
            <div class="accretion-flow flow-1"></div>
            <div class="accretion-flow flow-2"></div>
            <div class="photon-sphere-ring"></div>
            <div class="black-hole-singularity ease-center"></div>
        </div>

        <div class="horizon-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Spin: 0.98 c</span>
            <button class="ease-btn ease-btn-primary ease-btn-sm ease-hover-grow">Stabilize Disk</button>
        </div>
    </div>

</body>
</html>
