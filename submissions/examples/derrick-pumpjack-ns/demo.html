<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Derrick Pumpjack — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Derrick Pumpjack demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Derrick Pumpjack</h1>
      <p class="lede">Oil pumpjack walking-beam nodding on a derrick</p>
    </header>

    <section class="ease-derrick-pumpjack" data-demo="derrick-pumpjack" aria-live="polite">
      <div class="ease-derrick-pumpjack__housing">
        <div class="ease-derrick-pumpjack__bezel">
          <div class="ease-derrick-pumpjack__face">
            <div class="ease-derrick-pumpjack__readout">
              <span class="ease-derrick-pumpjack__label">Derrick Pumpjack</span>
              <span class="ease-derrick-pumpjack__value">LIVE</span>
            </div>
            <div class="ease-derrick-pumpjack__motion" aria-hidden="true">
              <span class="ease-derrick-pumpjack__a"></span>
              <span class="ease-derrick-pumpjack__b"></span>
              <span class="ease-derrick-pumpjack__c"></span>
              <span class="ease-derrick-pumpjack__d"></span>
            </div>
            <div class="ease-derrick-pumpjack__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-derrick-pumpjack__controls">
          <button type="button" class="ease-derrick-pumpjack__btn primary">Engage</button>
          <button type="button" class="ease-derrick-pumpjack__btn">Reset</button>
          <label class="ease-derrick-pumpjack__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-derrick-pumpjack__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
