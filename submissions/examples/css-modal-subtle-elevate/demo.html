<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Modal: Subtle Elevate - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="em-modal-page">
        <!-- Trigger Button -->
        <a href="#em-modal-box" class="em-trigger-btn" role="button">Open Modal</a>

        <!-- Pure CSS Modal Overlay -->
        <div id="em-modal-box" class="em-modal-overlay" role="dialog" aria-modal="true" aria-labelledby="em-modal-title">
            <div class="em-modal-container" tabindex="0">
                <span class="em-modal-badge">MODALS & DIALOGS</span>
                <h2 id="em-modal-title" class="em-modal-title">Subtle Elevate Modal</h2>
                <p class="em-modal-desc">A smooth, hardware-accelerated pure CSS modal featuring subtle elevate styling, backdrop blur, and dark mode compatibility.</p>
                
                <div class="em-modal-actions">
                    <a href="#" class="em-modal-btn em-btn-primary" role="button">Confirm Action</a>
                    <a href="#" class="em-modal-btn em-btn-secondary" role="button">Close</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
