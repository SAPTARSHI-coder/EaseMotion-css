<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>3D Rotating Cube Navigation Menu</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

</head>

<body>

<section class="hero">

<div class="content">

<span class="badge">
High-Contrast Accessibility Edition
</span>

<h1>
3D Cube
<span>Navigation Menu</span>
</h1>

<p>
A high-contrast interactive landing page featuring a rotating
3D cube navigation menu with accessible controls and smooth
animations.
</p>

</div>

<div class="cube-wrapper">

<div class="cube" id="cube">

<div class="face front">Home</div>

<div class="face back">About</div>

<div class="face right">Projects</div>

<div class="face left">Services</div>

<div class="face top">Blog</div>

<div class="face bottom">Contact</div>

</div>

</div>

<nav class="controls">

<button data-face="front">Home</button>

<button data-face="right">Projects</button>

<button data-face="back">About</button>

<button data-face="left">Services</button>

<button data-face="top">Blog</button>

<button data-face="bottom">Contact</button>

</nav>

</section>

<script src="script.js"></script>

</body>
</html>
