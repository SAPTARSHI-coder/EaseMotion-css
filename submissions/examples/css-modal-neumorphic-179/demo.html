<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Modal: Neumorphic Soft Shadow</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="demo-container">
    <a href="#neu-modal" class="neu-button">Open Modal</a>
  </div>

  <div id="neu-modal" class="neu-modal-overlay">
    <div class="neu-modal-content">
      <div class="neu-modal-header">
        <h2>Neumorphic Modal</h2>
        <a href="#" class="neu-close-button" aria-label="Close modal">&times;</a>
      </div>
      <div class="neu-modal-body">
        <p>This is a smooth, accessible, and performant pure CSS modal featuring Neumorphic Soft Shadow styling. It doesn't require any JavaScript to function!</p>
      </div>
      <div class="neu-modal-footer">
        <a href="#" class="neu-button neu-button-secondary">Cancel</a>
        <a href="#" class="neu-button neu-button-primary">Confirm</a>
      </div>
    </div>
  </div>
</body>
</html>
