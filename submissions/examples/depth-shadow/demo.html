<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Depth Shadow Card</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card-container">
    <h1>Depth Shadow Card Demo</h1>
    <div class="card">
      <img src="https://via.placeholder.com/300x180.png?text=Card+Image" alt="Card Image">
      <div class="card-content">
        <h2>Elegant Shadow Card</h2>
        <p>
          This card demonstrates how to use multiple layered shadows in CSS to create a sense of depth. 
          Hover over the card to see the shadow intensify.
        </p>
        <button class="cta-btn">Learn More</button>
      </div>
    </div>
  </div>
</body>
</html>
