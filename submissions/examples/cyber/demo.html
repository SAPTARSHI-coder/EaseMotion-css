<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyberpunk Floating Audio Player Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="cyber-player-wrapper">
    <div class="audio-player-card">
      <div class="player-header">
        <div class="neon-badge">LIVE // 2077</div>
        <div class="track-info">
          <span class="track-title">NEON_PULSE.wav</span>
          <span class="track-artist">Sub-Grid Sector 7</span>
        </div>
      </div>
      <audio controls class="cyber-audio">
        <source src="https://www.w3schools.com/html/horse.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
      </audio>
    </div>
  </div>
</body>
</html>
