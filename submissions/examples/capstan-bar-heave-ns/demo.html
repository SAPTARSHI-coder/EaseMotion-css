<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Capstan Bar Heave — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Capstan Bar Heave demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Capstan Bar Heave</h1>
      <p class="lede">Capstan bars heaving a cable around the drum</p>
    </header>

    <section class="ease-capstan-bar-heave" data-demo="capstan-bar-heave" aria-live="polite">
      <div class="ease-capstan-bar-heave__housing">
        <div class="ease-capstan-bar-heave__bezel">
          <div class="ease-capstan-bar-heave__face">
            <div class="ease-capstan-bar-heave__readout">
              <span class="ease-capstan-bar-heave__label">Capstan Bar Heave</span>
              <span class="ease-capstan-bar-heave__value">LIVE</span>
            </div>
            <div class="ease-capstan-bar-heave__motion" aria-hidden="true">
              <span class="ease-capstan-bar-heave__a"></span>
              <span class="ease-capstan-bar-heave__b"></span>
              <span class="ease-capstan-bar-heave__c"></span>
              <span class="ease-capstan-bar-heave__d"></span>
            </div>
            <div class="ease-capstan-bar-heave__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-capstan-bar-heave__controls">
          <button type="button" class="ease-capstan-bar-heave__btn primary">Engage</button>
          <button type="button" class="ease-capstan-bar-heave__btn">Reset</button>
          <label class="ease-capstan-bar-heave__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-capstan-bar-heave__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
