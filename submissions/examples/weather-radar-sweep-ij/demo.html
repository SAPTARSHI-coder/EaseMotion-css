<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-weather-radar-sweep demo</title>
</head>
<body>
<div class="wr-app">
  <span class="wr-title">RADAR</span>
  <div class="wr-dish">
    <span class="wr-ring wr-ring-1"></span>
    <span class="wr-ring wr-ring-2"></span>
    <span class="wr-ring wr-ring-3"></span>
    <span class="wr-cross"></span>
    <span class="wr-beam"></span>
    <span class="wr-blip wr-blip-a"></span>
    <span class="wr-blip wr-blip-b"></span>
    <span class="wr-blip wr-blip-c"></span>
  </div>
  <div class="wr-labels">
    <span class="wr-dir">N</span>
    <span class="wr-dir">E</span>
    <span class="wr-dir">S</span>
    <span class="wr-dir">W</span>
  </div>
  <span class="wr-range">RANGE 50 KM</span>
</div>
</body>
</html>
