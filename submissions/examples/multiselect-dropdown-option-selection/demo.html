<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi-Select Dropdown</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="demo">
    <h1>Multi-Select Dropdown</h1>

    <div class="dropdown">
      <label for="options">Select technologies</label>

      <select id="options" multiple>
        <option>HTML</option>
        <option>CSS</option>
        <option>JavaScript</option>
        <option>React</option>
        <option>Vue</option>
      </select>
    </div>

    <p class="hint">
      Hold Ctrl/Cmd to select multiple options.
    </p>
  </main>

</body>
</html>
