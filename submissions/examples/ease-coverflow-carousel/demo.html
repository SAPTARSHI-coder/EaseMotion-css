<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Native CSS Apple-Style CoverFlow Carousel</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="ease-carousel-wrapper">
    <div class="ease-swipe-hint">Swipe to explore</div>
    <div class="ease-coverflow-track">
      <!-- Use CSS gradients to simulate distinct album artwork -->
      <div class="ease-coverflow-card" style="background: linear-gradient(135deg, #f472b6, #e81cff);">01</div>
      <div class="ease-coverflow-card" style="background: linear-gradient(135deg, #818cf8, #3b82f6);">02</div>
      <div class="ease-coverflow-card" style="background: linear-gradient(135deg, #34d399, #10b981);">03</div>
      <div class="ease-coverflow-card" style="background: linear-gradient(135deg, #fbbf24, #f59e0b);">04</div>
      <div class="ease-coverflow-card" style="background: linear-gradient(135deg, #a78bfa, #8b5cf6);">05</div>
      <div class="ease-coverflow-card" style="background: linear-gradient(135deg, #f87171, #ef4444);">06</div>
      <div class="ease-coverflow-card" style="background: linear-gradient(135deg, #38bdf8, #0ea5e9);">07</div>
    </div>
  </div>
  <p style="position: fixed; bottom: 2rem; color: #64748b; font-size: 0.875rem; text-align: center; max-width: 600px;">Powered purely by CSS <code>scroll-snap</code> and <code>animation-timeline: view(inline)</code>. Zero JavaScript required.</p>
</body>
</html>
