<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dip Pen Ink Stroke — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Dip Pen Ink Stroke demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Dip Pen Ink Stroke</h1>
      <p class="lede">Dip pen nib drawing an ink stroke with blot control</p>
    </header>

    <section class="ease-dip-pen-ink-stroke" data-demo="dip-pen-ink-stroke" aria-live="polite">
      <div class="ease-dip-pen-ink-stroke__housing">
        <div class="ease-dip-pen-ink-stroke__bezel">
          <div class="ease-dip-pen-ink-stroke__face">
            <div class="ease-dip-pen-ink-stroke__readout">
              <span class="ease-dip-pen-ink-stroke__label">Dip Pen Ink Stroke</span>
              <span class="ease-dip-pen-ink-stroke__value">LIVE</span>
            </div>
            <div class="ease-dip-pen-ink-stroke__motion" aria-hidden="true">
              <span class="ease-dip-pen-ink-stroke__a"></span>
              <span class="ease-dip-pen-ink-stroke__b"></span>
              <span class="ease-dip-pen-ink-stroke__c"></span>
              <span class="ease-dip-pen-ink-stroke__d"></span>
            </div>
            <div class="ease-dip-pen-ink-stroke__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-dip-pen-ink-stroke__controls">
          <button type="button" class="ease-dip-pen-ink-stroke__btn primary">Engage</button>
          <button type="button" class="ease-dip-pen-ink-stroke__btn">Reset</button>
          <label class="ease-dip-pen-ink-stroke__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-dip-pen-ink-stroke__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
