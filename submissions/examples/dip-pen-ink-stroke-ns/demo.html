<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ease Dip Pen Ink Stroke</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

<main class="showcase">

<section class="ease-dip-pen-ink-stroke">

  <header class="header">
    <span class="status"></span>
    <h1>Dip Pen Studio</h1>
  </header>


  <div class="writing-board">

    <div class="ink-bottle">
      <span>INK</span>
    </div>


    <div class="pen">
      <div class="nib"></div>
    </div>


    <div class="stroke"></div>

    <div class="blot"></div>

  </div>


  <p class="label">
    Precision ink stroke simulation
  </p>

</section>

</main>

</body>
</html>
