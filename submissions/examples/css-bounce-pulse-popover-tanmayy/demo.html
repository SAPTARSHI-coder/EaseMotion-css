<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Bounce-Pulse Popover - EaseMotion CSS</title>
  <!-- Import EaseMotion CSS -->
  <link rel="stylesheet" href="../../../easemotion.css">
  <!-- Component Specific Styles -->
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="checkout-bg">

  <div class="demo-container">
    
    <div class="checkout-panel ease-glass-card">
      <div class="checkout-header">
        <h2 class="ease-text-xl">Promo & Discounts</h2>
      </div>

      <div class="checkout-form">
        <!-- Mock Promo Code Input -->
        <div class="form-group">
          <label class="label-with-popover">
            Enter Promo Code
            
            <!-- Bounce-Pulse Popover Component (Info Trigger) -->
            <div class="popover-wrapper" tabindex="0">
              <button class="info-icon" aria-label="Promo Code Help" type="button">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
              </button>
              
              <!-- The Popover Content -->
              <div class="bounce-pulse-popover popover-top">
                <div class="popover-header">Where to find codes?</div>
                <div class="popover-body">
                  <p>Check our promotional emails or follow our social media channels for the latest discount codes!</p>
                </div>
                <div class="popover-arrow"></div>
              </div>
            </div>
          </label>
          
          <div class="promo-input-row">
            <div class="mock-input">SUMMER2026</div>
            <button class="apply-btn">Apply</button>
          </div>
        </div>
      </div>
      
      <div class="checkout-footer">
        <div class="summary-row">
          <span>Subtotal</span>
          <span>$150.00</span>
        </div>
        
        <div class="summary-row discount-row">
          <div class="label-with-popover">
            <span>Discount</span>
            
            <!-- Bounce-Pulse Popover Component (Discount Breakdown Trigger) -->
            <div class="popover-wrapper" tabindex="0">
              <span class="discount-badge popover-trigger">-20% Applied</span>
              
              <div class="bounce-pulse-popover popover-left">
                <div class="popover-header">Discount Applied!</div>
                <div class="popover-body">
                  <div class="discount-line">
                    <span>Summer Sale (-15%)</span>
                    <span>-$22.50</span>
                  </div>
                  <div class="discount-line">
                    <span>Loyalty Bonus (-5%)</span>
                    <span>-$7.50</span>
                  </div>
                </div>
                <div class="popover-arrow"></div>
              </div>
            </div>
          </div>
          
          <span class="discount-val">-$30.00</span>
        </div>
        
        <div class="total-row">
          <span>Total</span>
          <span class="total-price">$120.00</span>
        </div>
        
        <button class="pay-btn ease-squish-button">Complete Purchase</button>
      </div>
    </div>

  </div>

</body>
</html>
