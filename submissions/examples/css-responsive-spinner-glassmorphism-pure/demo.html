<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Spinner: Glassmorphism</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- A vibrant background to showcase the glassmorphism blur effect -->
    <div class="background-showcase">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
        
        <header class="header">
            <h1 class="title">Glass Spinner overlay</h1>
            <p>Responsive, pure CSS glassmorphism loading overlay.</p>
        </header>

        <main class="content-area">
            
            <!-- A simulated container that the spinner covers -->
            <div class="simulated-container">
                <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2564&auto=format&fit=crop" alt="Abstract Art" class="bg-image">
                
                <div class="container-content">
                    <h2>Data Syncing...</h2>
                    <p>Please wait while we process the abstract data matrix.</p>
                </div>
                
                <!-- The Glassmorphism Spinner Overlay -->
                <div class="glass-spinner-overlay" aria-busy="true" aria-label="Loading">
                    
                    <!-- The Spinner Element -->
                    <div class="glass-spinner">
                        <!-- We use pseudo-elements for the spinning rings -->
                    </div>
                    
                </div>
            </div>
            
        </main>
    </div>

</body>
</html>
