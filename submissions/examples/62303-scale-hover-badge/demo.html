<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Scale Hover Badge | EaseMotion CSS</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <section class="card">

            <h1>Scale Hover Badge</h1>

            <p class="subtitle">
                A modern product catalog badge with smooth CSS scale hover animation.
            </p>


            <div class="products">

                <article class="product">

                    <div class="badge">
                        NEW
                    </div>

                    <h2>Premium Package</h2>

                    <p>
                        Advanced features for modern product experiences.
                    </p>

                    <button>
                        Explore
                    </button>

                </article>


                <article class="product">

                    <div class="badge">
                        SALE
                    </div>

                    <h2>Starter Package</h2>

                    <p>
                        Simple solutions for growing products.
                    </p>

                    <button>
                        Explore
                    </button>

                </article>

            </div>


        </section>

    </main>

</body>

</html>
