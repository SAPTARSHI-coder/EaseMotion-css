<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pulse Glow Status Badge</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="status-demo">
    <section class="status-showcase" aria-labelledby="title">
      <p class="status-eyebrow">EaseMotion CSS</p>
      <h1 id="title">Pulse Glow Status Badge</h1>
      <p class="status-description">
        A lightweight animated status indicator built entirely with HTML and CSS.
      </p>

      <div class="status-list">
        <span class="pulse-badge pulse-badge--success">
          <span class="pulse-badge__indicator" aria-hidden="true"></span>
          Online
        </span>

        <span class="pulse-badge pulse-badge--info">
          <span class="pulse-badge__indicator" aria-hidden="true"></span>
          Active
        </span>

        <span class="pulse-badge pulse-badge--warning">
          <span class="pulse-badge__indicator" aria-hidden="true"></span>
          Warning
        </span>

        <span class="pulse-badge pulse-badge--danger">
          <span class="pulse-badge__indicator" aria-hidden="true"></span>
          Offline
        </span>
      </div>
    </section>
  </main>
</body>
</html>
