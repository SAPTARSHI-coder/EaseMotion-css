<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Pure CSS morphing shape loader for EaseMotion CSS"
  >

  <title>CSS Morphing Shape Loader</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="demo">
    <section class="loader-card" aria-labelledby="loader-title">

      <div class="loader-stage">
        <div
          class="morph-loader"
          role="status"
          aria-label="Loading"
        >
          <span class="morph-loader__shape"></span>
          <span class="morph-loader__core"></span>
        </div>
      </div>

      <div class="loader-info">
        <span class="eyebrow">EaseMotion CSS</span>

        <h1 id="loader-title">
          Morphing Shape
        </h1>

        <p>
          A fluid CSS-only loader that continuously
          transforms its shape using border-radius,
          rotation and scale.
        </p>

        <div class="loading-status" aria-live="polite">
          <span aria-hidden="true"></span>
          Loading...
        </div>
      </div>

    </section>
  </main>
</body>
</html>
