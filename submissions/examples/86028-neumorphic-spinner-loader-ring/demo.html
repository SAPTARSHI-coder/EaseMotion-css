<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neumorphic Spinner Loader Ring</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="loader-page">
    <section class="loader-card" aria-label="Loading content">
      <div
        class="spinner"
        role="status"
        aria-label="Loading"
        aria-live="polite"
      ></div>

      <p class="loader-text">Loading...</p>
    </section>
  </main>

</body>
</html>
