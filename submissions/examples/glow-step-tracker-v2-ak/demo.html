<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Step Progress Tracker — EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <p class="label">Pure CSS Wizard Step Progress Tracker</p>

  <div class="ease-step-progress-v2">
    <div class="ease-step-progress-bar-v2"></div>

    <div class="ease-step-item-v2 ease-step-item-v2--completed">
      <div class="ease-step-circle-v2">✓</div>
      <span class="ease-step-label-v2">Account</span>
    </div>

    <div class="ease-step-item-v2 ease-step-item-v2--active">
      <div class="ease-step-circle-v2">2</div>
      <span class="ease-step-label-v2">Billing</span>
    </div>

    <div class="ease-step-item-v2">
      <div class="ease-step-circle-v2">3</div>
      <span class="ease-step-label-v2">Confirm</span>
    </div>
  </div>

</body>
</html>
