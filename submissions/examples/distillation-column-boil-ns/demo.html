<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Distillation Column Boil — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Distillation Column Boil demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Distillation Column Boil</h1>
      <p class="lede">Distillation column trays boiling and refluxing</p>
    </header>

    <section class="ease-distillation-column-boil" data-demo="distillation-column-boil" aria-live="polite">
      <div class="ease-distillation-column-boil__housing">
        <div class="ease-distillation-column-boil__bezel">
          <div class="ease-distillation-column-boil__face">
            <div class="ease-distillation-column-boil__readout">
              <span class="ease-distillation-column-boil__label">Distillation Column Boil</span>
              <span class="ease-distillation-column-boil__value">LIVE</span>
            </div>
            <div class="ease-distillation-column-boil__motion" aria-hidden="true">
              <span class="ease-distillation-column-boil__a"></span>
              <span class="ease-distillation-column-boil__b"></span>
              <span class="ease-distillation-column-boil__c"></span>
              <span class="ease-distillation-column-boil__d"></span>
            </div>
            <div class="ease-distillation-column-boil__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-distillation-column-boil__controls">
          <button type="button" class="ease-distillation-column-boil__btn primary">Engage</button>
          <button type="button" class="ease-distillation-column-boil__btn">Reset</button>
          <label class="ease-distillation-column-boil__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-distillation-column-boil__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
