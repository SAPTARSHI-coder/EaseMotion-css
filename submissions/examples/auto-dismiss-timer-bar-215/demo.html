<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="High-contrast accessible floating notification toast with auto-dismiss timer."
    >

    <title>High Contrast Toast Notification</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="page">
        <section class="demo-card" aria-labelledby="title">
            <span class="eyebrow">EaseMotion UI</span>

            <h1 id="title">Floating Notification Toast</h1>

            <p class="description">
                A high-contrast accessible notification with an animated
                auto-dismiss timer bar.
            </p>

            <button
                class="show-button"
                id="showToast"
                type="button"
            >
                Show Notification
            </button>
        </section>
    </main>

    <aside
        class="toast"
        id="toast"
        role="status"
        aria-live="polite"
        aria-atomic="true"
        hidden
    >
        <div class="toast-icon" aria-hidden="true">✓</div>

        <div class="toast-content">
            <strong class="toast-title">Success</strong>

            <p>
                Your changes have been saved successfully.
            </p>
        </div>

        <button
            class="close-button"
            id="closeToast"
            type="button"
            aria-label="Close notification"
        >
            ×
        </button>

        <div
            class="timer-bar"
            id="timerBar"
            aria-hidden="true"
        ></div>
    </aside>

    <script src="script.js"></script>
</body>
</html>
