<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Vintage Typewriter Text — Showcase</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="ease-container">
    <p class="ease-eyebrow">Vintage Typography</p>
    <h1 class="ease-heading">Typewriter Animation</h1>
    <p class="ease-subtitle">Pure CSS letter-by-letter reveal featuring a mechanical carriage blinker cursor.</p>

    <div class="ease-typewriter-card" role="region" aria-label="Typewriter text demonstration">
      <div class="ease-paper-texture">
        <div class="ease-typewriter-wrapper">
          <p class="ease-typewriter-text" aria-label="The ink dries fast, but the stories last forever.">
            The ink dries fast, but the stories last forever.
          </p>
        </div>
      </div>

      <div class="ease-card-footer">
        <span class="ease-footer-tag">Courier Monospace</span>
        <span class="ease-footer-status">⚡ Pure CSS Keyframes</span>
      </div>
    </div>
  </main>
</body>
</html>
