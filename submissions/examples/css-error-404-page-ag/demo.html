<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Error 404 Page</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <main class="error-container">
    
    <div class="character-wrapper" aria-hidden="true">
      <!-- Cute SVG Ghost -->
      <svg class="ghost-svg" viewBox="0 0 100 120" xmlns="http://www.w3.org/2000/svg">
        <!-- Ghost Body -->
        <path d="M10 50 C10 10 90 10 90 50 L90 110 L75 95 L60 110 L45 95 L30 110 L15 95 L10 110 Z" />
        <!-- Left Eye -->
        <circle cx="35" cy="45" r="5" fill="#1e1b4b" />
        <!-- Right Eye -->
        <circle cx="65" cy="45" r="5" fill="#1e1b4b" />
        <!-- Mouth -->
        <path d="M45 60 Q50 70 55 60" stroke="#1e1b4b" stroke-width="4" stroke-linecap="round" fill="none" />
      </svg>
      <div class="ghost-shadow"></div>
    </div>

    <h1 class="error-code">404</h1>
    <h2 class="error-title">Page Not Found</h2>
    <p class="error-desc">Oops! The page you are looking for seems to have floated away into the void. Let's get you back home safely.</p>
    
    <a href="#" class="home-btn" aria-label="Return to homepage">Return Home</a>

  </main>

</body>
</html>
