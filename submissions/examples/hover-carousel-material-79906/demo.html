<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hover Carousel Material Design</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="carousel-container">

  <h1>Material Hover Carousel</h1>

  <div class="carousel">

    <div class="card">
      <img src="https://picsum.photos/400/300?1" alt="Slide 1">
      <div class="overlay">
        <h3>Dashboard</h3>
        <p>Material Design interaction.</p>
      </div>
    </div>

    <div class="card">
      <img src="https://picsum.photos/400/300?2" alt="Slide 2">
      <div class="overlay">
        <h3>Analytics</h3>
        <p>Smooth hover transitions.</p>
      </div>
    </div>

    <div class="card">
      <img src="https://picsum.photos/400/300?3" alt="Slide 3">
      <div class="overlay">
        <h3>Reports</h3>
        <p>Elevated card effect.</p>
      </div>
    </div>

    <div class="card">
      <img src="https://picsum.photos/400/300?4" alt="Slide 4">
      <div class="overlay">
        <h3>Insights</h3>
        <p>Responsive layout.</p>
      </div>
    </div>

  </div>

</div>

</body>
</html>
