<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
        name="description"
        content="CSS Copyable Code Inline component"
    >
    <title>CSS Copyable Code Inline</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="demo-container">
        <section class="code-section" aria-labelledby="code-title">

            <p class="eyebrow">EaseMotion CSS</p>

            <h1 id="code-title">Copyable Code Inline</h1>

            <p class="description">
                A clean inline code component with hover, focus, and
                keyboard-accessible interaction states.
            </p>

            <div class="code-demo">
                <span class="code-label">Install:</span>

                <button
                    class="copy-code"
                    type="button"
                    aria-label="Copy npm install command"
                >
                    <code>npm install easemotion-css</code>
                    <span class="copy-icon" aria-hidden="true">⧉</span>
                    <span class="copy-tooltip" role="status">
                        Copy code
                    </span>
                </button>
            </div>

            <div class="code-demo">
                <span class="code-label">Import:</span>

                <button
                    class="copy-code"
                    type="button"
                    aria-label="Copy CSS import statement"
                >
                    <code>@import "easemotion.css";</code>
                    <span class="copy-icon" aria-hidden="true">⧉</span>
                    <span class="copy-tooltip" role="status">
                        Copy code
                    </span>
                </button>
            </div>

            <div class="code-demo">
                <span class="code-label">Class:</span>

                <button
                    class="copy-code"
                    type="button"
                    aria-label="Copy CSS class name"
                >
                    <code>.fade-in</code>
                    <span class="copy-icon" aria-hidden="true">⧉</span>
                    <span class="copy-tooltip" role="status">
                        Copy code
                    </span>
                </button>
            </div>

        </section>
    </main>

</body>
</html>
