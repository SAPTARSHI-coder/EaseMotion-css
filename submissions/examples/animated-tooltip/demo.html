<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Tooltip with Cyberpunk Styling - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="em-demo-container">
        <!-- Pure CSS Animated Tooltip Component Showcase with Cyberpunk Styling -->
        <header class="em-tooltip-card" role="region" aria-label="Animated Tooltip Showcase" tabindex="0">
            <div class="em-tooltip-header-bar">
                <span class="em-card-badge">COMPONENT CONTRIBUTION</span>
                <span class="em-brand-logo">CyberMotion</span>
            </div>
            <h1 class="em-card-title">Animated Tooltip</h1>
            <p class="em-card-desc">A fully responsive, pure CSS tooltip component featuring aggressive cyberpunk neon aesthetics, smooth fade-in animations, and frosted glassmorphism.</p>
            <div class="em-tooltip-wrapper">
                <div class="em-tooltip-container" tabindex="0" aria-label="Hover over this element for cyberpunk tooltip info">
                    <button class="em-tooltip-trigger" aria-describedby="cyber-tooltip">HVER.SYS</button>
                    <div id="cyber-tooltip" class="em-tooltip-box" role="tooltip">
                        <span class="em-tooltip-title">SYSTEM STATUS</span>
                        <p class="em-tooltip-text">Neural net connection active. Cyberpunk protocols engaged.</p>
                    </div>
                </div>
            </div>
        </header>
    </div>
</body>
</html>
