<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Typewriter Text - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="em-demo-container">
        <!-- Pure CSS Typewriter Component Showcase -->
        <header class="em-typewriter-card" role="region" aria-label="Typewriter Text Showcase" tabindex="0">
            <div class="em-typewriter-header-bar">
                <span class="em-card-badge">ANIMATION FEATURE</span>
                <span class="em-brand-logo">TypeWriterMotion</span>
            </div>
            <h1 class="em-card-title">CSS Typewriter Effect</h1>
            <p class="em-card-desc">Character-by-character text reveal simulating a mechanical typewriter, featuring custom steps timing and a blinking cursor.</p>
            <div class="em-typewriter-wrapper">
                <h2 class="ease-typewriter" aria-label="Simulated Typewriter Text">
                    Building the future of web animations...
                </h2>
            </div>
        </header>
    </div>
</body>
</html>
