<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Pure CSS 3D Aurora Glow animation."
  >
  <title>3D Aurora Glow</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="aurora-scene">
    <div class="aurora-space" aria-hidden="true">
      <div class="aurora aurora-one"></div>
      <div class="aurora aurora-two"></div>
      <div class="aurora aurora-three"></div>

      <div class="glow-orbit orbit-one"></div>
      <div class="glow-orbit orbit-two"></div>

      <div class="aurora-core"></div>
    </div>

    <section class="aurora-card" aria-labelledby="aurora-title">
      <span class="eyebrow">PURE CSS · 3D EFFECT</span>

      <h1 id="aurora-title">
        Aurora
        <span>Glow</span>
      </h1>

      <p>
        A fluid three-dimensional glow effect inspired by the
        soft movement and luminous colors of an aurora.
      </p>

      <div class="card-footer">
        <span>NO JAVASCRIPT</span>

        <button type="button">
          Explore
          <span aria-hidden="true">→</span>
        </button>
      </div>
    </section>
  </main>
</body>
</html>
