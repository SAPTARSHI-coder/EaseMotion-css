<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>3D Perspective Tilt Tabs</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="page">
      <header>
        <p class="eyebrow">EaseMotion · Tabs</p>
        <h1>Perspective Tilt</h1>
        <p>Segmented controls with a restrained three-dimensional active state.</p>
      </header>

      <section class="tabs" aria-label="Perspective tabs">
        <input checked type="radio" name="tab" id="front">
        <input type="radio" name="tab" id="depth">
        <input type="radio" name="tab" id="angle">

        <nav class="tab-list">
          <label for="front">Front</label>
          <label for="depth">Depth</label>
          <label for="angle">Angle</label>
        </nav>

        <article class="panel front">
          <h2>Front</h2>
          <p>The active surface rises toward the viewer.</p>
        </article>

        <article class="panel depth">
          <h2>Depth</h2>
          <p>Perspective and shadow create a layered control.</p>
        </article>

        <article class="panel angle">
          <h2>Angle</h2>
          <p>The treatment remains subtle so text stays readable.</p>
        </article>
      </section>
    </main>
  </body>
</html>
