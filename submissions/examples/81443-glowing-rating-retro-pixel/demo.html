<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Glowing rating component with a retro pixel styling using pure CSS."
  >

  <title>Glowing Rating — Retro Pixel</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="page">

    <section
      class="rating-section"
      aria-labelledby="rating-title"
    >

      <header class="rating-heading">

        <span class="rating-heading__eyebrow">
          PLAYER FEEDBACK
        </span>

        <h1 id="rating-title">
          Retro Rating
        </h1>

        <p>
          A glowing arcade-inspired rating component
          created with pure CSS.
        </p>

      </header>

      <article class="pixel-rating-card">

        <div class="pixel-rating-card__scanline"></div>

        <div class="pixel-rating-card__header">

          <div class="pixel-rating-card__badge" aria-hidden="true">
            ★
          </div>

          <div class="pixel-rating-card__identity">

            <span class="pixel-rating-card__label">
              SCORE
            </span>

            <div class="pixel-rating-card__score">
              <strong>4.8</strong>
              <span>/5</span>
            </div>

          </div>

        </div>

        <div
          class="pixel-stars"
          role="img"
          aria-label="Rated 4.8 out of 5 stars"
        >
          <span class="pixel-star pixel-star--active">★</span>
          <span class="pixel-star pixel-star--active">★</span>
          <span class="pixel-star pixel-star--active">★</span>
          <span class="pixel-star pixel-star--active">★</span>
          <span class="pixel-star pixel-star--partial">★</span>
        </div>

        <div class="pixel-rating-card__status">

          <span class="status-dot" aria-hidden="true"></span>

          <span>
            EXCELLENT PERFORMANCE
          </span>

        </div>

        <div class="pixel-bars" aria-hidden="true">

          <div class="pixel-bar">
            <span class="pixel-bar__label">5</span>

            <div class="pixel-bar__track">
              <span
                class="pixel-bar__fill"
                style="--bar-width: 92%"
              ></span>
            </div>

            <span class="pixel-bar__value">92</span>
          </div>

          <div class="pixel-bar">
            <span class="pixel-bar__label">4</span>

            <div class="pixel-bar__track">
              <span
                class="pixel-bar__fill"
                style="--bar-width: 76%"
              ></span>
            </div>

            <span class="pixel-bar__value">76</span>
          </div>

          <div class="pixel-bar">
            <span class="pixel-bar__label">3</span>

            <div class="pixel-bar__track">
              <span
                class="pixel-bar__fill"
                style="--bar-width: 44%"
              ></span>
            </div>

            <span class="pixel-bar__value">44</span>
          </div>

        </div>

        <footer class="pixel-rating-card__footer">
          <span>REVIEWS</span>
          <strong>1,248</strong>
        </footer>

      </article>

    </section>

  </main>

</body>
</html>
