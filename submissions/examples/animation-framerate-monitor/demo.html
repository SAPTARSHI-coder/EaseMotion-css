<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Animation Frame Rate Monitor</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="dashboard">

<h1>Animation Frame Rate Smoothness Monitor</h1>

<div class="cards">

<div class="card fps60">
<h2>60 FPS</h2>
<div class="meter">
<div class="fill sixty"></div>
</div>
<p>16.67 ms/frame</p>
<span class="status good">Stable</span>
</div>

<div class="card fps120">
<h2>120 FPS</h2>
<div class="meter">
<div class="fill oneTwenty"></div>
</div>
<p>8.33 ms/frame</p>
<span class="status excellent">Excellent</span>
</div>

</div>

<table>

<tr>
<th>Metric</th>
<th>60 FPS</th>
<th>120 FPS</th>
</tr>

<tr>
<td>Frame Time</td>
<td>16.67 ms</td>
<td>8.33 ms</td>
</tr>

<tr>
<td>Smoothness</td>
<td>Good</td>
<td>Excellent</td>
</tr>

<tr>
<td>Performance Budget</td>
<td>PASS</td>
<td>PASS</td>
</tr>

</table>

</div>

</body>
</html>
