<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Avatar Stack &mdash; EaseMotion CSS Demo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="page-head">
    <p class="kicker">EaseMotion CSS &middot; Social &amp; Chat</p>
    <h1>Avatar Stack</h1>
    <p class="sub">A tight cluster of members that fans apart the moment you hover.</p>
  </header>
  <main class="stage">
    <div class="as-stack">
      <div class="as-avatar a1">AN</div>
      <div class="as-avatar a2">RM</div>
      <div class="as-avatar a3">JS</div>
      <div class="as-avatar a4">PK</div>
      <div class="as-avatar as-more">+3</div>
    </div>
  </main>
  <p class="stage-caption">Hover the cluster to separate every member.</p>
  <footer class="page-foot">
    <span>Pure CSS &middot; zero dependencies</span>
    <span>Overlap + fan-out</span>
  </footer>
</body>
</html>
