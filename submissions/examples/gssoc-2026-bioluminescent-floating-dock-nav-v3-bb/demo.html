<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bioluminescent Floating Dock Nav - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="dock-wrapper">
    <nav class="bio-dock">
      <a href="#" class="dock-item active" data-tooltip="Home">
        <span class="dock-icon">⚡</span>
      </a>
      <a href="#" class="dock-item" data-tooltip="Analytics">
        <span class="dock-icon">📊</span>
      </a>
      <a href="#" class="dock-item" data-tooltip="Messages">
        <span class="dock-icon">💬</span>
      </a>
      <a href="#" class="dock-item" data-tooltip="Vault">
        <span class="dock-icon">🔒</span>
      </a>
      <a href="#" class="dock-item" data-tooltip="Settings">
        <span class="dock-icon">⚙️</span>
      </a>
    </nav>
  </div>
</body>
</html>
