<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Multi-color Progress Bar</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="progress-container">
        <h1>Multi-color Progress Bar</h1>
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        <p id="progressText">Progress: 0%</p>
        <div class="controls">
            <button onclick="increaseProgress(10)">+10%</button>
            <button onclick="increaseProgress(25)">+25%</button>
            <button onclick="resetProgress()">Reset</button>
        </div>
    </div>

    <script>
        let progress = 0;
        const progressFill = document.getElementById('progressFill');
        const progressText = document.getElementById('progressText');

        function increaseProgress(amount) {
            progress = Math.min(progress + amount, 100);
            progressFill.style.width = progress + "%";
            progressText.textContent = "Progress: " + progress + "%";
        }

        function resetProgress() {
            progress = 0;
            progressFill.style.width = progress + "%";
            progressText.textContent = "Progress: " + progress + "%";
        }
    </script>
</body>

</html>
