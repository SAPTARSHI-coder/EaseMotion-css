<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fault Tolerant Surface Code Error Budget Telemetry Dashboards SCEBTD - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css"></head><body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030712; color: #ffffff;">

    <div class="ease-card ease-card-glass scebtd-container">
        <div class="scebtd-header">
            <h2>Surface Code Error Budget Telemetry</h2>
            <span class="ease-badge ease-badge-success">Fault-Tolerant Quantum</span>
        </div>
        
        <div class="scebtd-screen ease-center">
            <div class="scebtd-flux flux-scebtd-a"></div>
            <div class="scebtd-flux flux-scebtd-b"></div>
            <div class="scebtd-boundary-ring"></div>
            <div class="scebtd-core ease-center"></div>
        </div>

        <div class="scebtd-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Real-Time Depolarization Tracking &amp; Fault Threshold Analysis</span>
            <button class="ease-btn ease-btn-success ease-btn-sm ease-hover-grow">Run Error Budget Dashboard</button>
        </div>
    </div></body></html>
