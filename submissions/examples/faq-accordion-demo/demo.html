<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EaseMotion CSS - FAQ Accordion Demo</title>

    <!-- Import EaseMotion CSS -->
    <link rel="stylesheet" href="../../dist/easemotion.css">

    <!-- Custom Styles -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="faq-container">

    <h1>Frequently Asked Questions</h1>

    <div class="faq">
        <button class="question">What is EaseMotion CSS?</button>
        <div class="answer">
            <p>A lightweight CSS framework for beautiful UI animations.</p>
        </div>
    </div>

    <div class="faq">
        <button class="question">Is it beginner friendly?</button>
        <div class="answer">
            <p>Yes! It is simple to learn and integrate.</p>
        </div>
    </div>

    <div class="faq">
        <button class="question">Does it work on mobile?</button>
        <div class="answer">
            <p>Absolutely. The framework is responsive by design.</p>
        </div>
    </div>

    <div class="faq">
        <button class="question">Can I customize animations?</button>
        <div class="answer">
            <p>Yes. You can combine utility classes or define your own styles.</p>
        </div>
    </div>

    <div class="faq">
        <button class="question">Is it open source?</button>
        <div class="answer">
            <p>Yes. Contributions are welcome.</p>
        </div>
    </div>

</div>

<script>
const questions = document.querySelectorAll(".question");

questions.forEach(btn=>{
    btn.addEventListener("click",()=>{
        btn.classList.toggle("active");
        const answer = btn.nextElementSibling;

        if(answer.style.maxHeight){
            answer.style.maxHeight = null;
        }else{
            answer.style.maxHeight = answer.scrollHeight + "px";
        }
    });
});
</script>

</body>
</html>
