<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elastic-Slide Accessible Progress Bar - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="stage">
    <header class="head">
      <h1>Elastic-Slide Progress Bar (<code>#54442</code>)</h1>
      <p>An accessible ARIA progress meter configured with energetic spring-damped filling expansion and tactile milestone bounce.</p>
    </header>
    
    <div class="ease-progress-elastic-slide">
      <div class="header-line">
        <strong>🚀 Spatial WebGPU Compute Pipeline</strong>
        <span class="value-tag">60% COMPILED</span>
      </div>

      <div class="elastic-track" role="progressbar" aria-valuenow="60" aria-valuemin="0" aria-valuemax="100" aria-label="Pipeline Progress">
        <div class="elastic-bar" style="width: 60%;">
          <div class="elastic-head"></div>
        </div>
      </div>

      <div class="spec-row">
        <span>● Zero Reflow Architecture</span>
        <span>● Spring Damping Curve: cubic-bezier(0.34, 1.56, 0.64, 1)</span>
      </div>

      <div class="action-footer">
        <button class="el-btn" onclick="springTo(25)">25% Spring</button>
        <button class="el-btn" onclick="springTo(60)">60% Spring</button>
        <button class="el-btn primary" onclick="springTo(100)">100% Complete ✦</button>
      </div>
    </div>
  </div>

  <script>
    function springTo(v) {
      const bar = document.querySelector('.elastic-bar');
      const track = document.querySelector('.elastic-track');
      const tag = document.querySelector('.value-tag');
      bar.style.width = v + '%';
      track.setAttribute('aria-valuenow', v);
      tag.textContent = v + '% ' + (v === 100 ? 'DEPLOYED' : 'COMPILED');
      tag.classList.remove('rebound'); void tag.offsetWidth; tag.classList.add('rebound');
    }
  </script>
</body>
</html>
