<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EaseMotion CSS — Multi-Step Progress Tracker Showcase</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="step-demo-wrapper">
    <header class="step-header">
      <span class="badge">UI Component Showcase</span>
      <h1>Multi-Step Progress Tracker</h1>
      <p>Interactive multi-step wizard progress tracker featuring active step pulse glow, connecting progress lines, and completed checkmarks.</p>
    </header>

    <main class="step-card">
      <div class="ease-step-tracker">
        <div class="step-item step-completed">
          <div class="step-icon">✓</div>
          <span class="step-label">Account Details</span>
        </div>

        <div class="step-line step-line-active"></div>

        <div class="step-item step-active">
          <div class="step-icon">2</div>
          <span class="step-label">Payment Config</span>
        </div>

        <div class="step-line"></div>

        <div class="step-item">
          <div class="step-icon">3</div>
          <span class="step-label">Review Order</span>
        </div>
      </div>
    </main>

    <footer class="step-footer">
      <p>EaseMotion CSS Component &bull; Submitted by @Ishita-Katiyar-06</p>
    </footer>
  </div>
</body>
</html>
