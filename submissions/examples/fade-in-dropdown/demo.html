<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CSS Fade-In Dropdown for fintech dashboard layouts">
  <title>Fade-In Dropdown</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="dashboard">

```
<header class="topbar">
  <div>
    <span class="label">FINTECH DASHBOARD</span>
    <h1>Financial Overview</h1>
  </div>

  <div class="dropdown">
    <button class="dropdown-button" type="button">
      Account Menu
      <span class="arrow">⌄</span>
    </button>

    <div class="dropdown-menu">
      <a href="#">Profile</a>
      <a href="#">Transactions</a>
      <a href="#">Analytics</a>
      <a href="#">Settings</a>
      <a href="#">Sign out</a>
    </div>
  </div>
</header>

<section class="dashboard-content">

  <article class="balance-card">
    <span>Available Balance</span>
    <strong>$48,250.00</strong>
    <small>+8.4% this month</small>
  </article>

  <article class="balance-card">
    <span>Monthly Revenue</span>
    <strong>$12,840.00</strong>
    <small>+12.6% this month</small>
  </article>

  <article class="balance-card">
    <span>Investments</span>
    <strong>$76,420.00</strong>
    <small>+5.8% this month</small>
  </article>

</section>
```

  </main>

</body>
</html>
