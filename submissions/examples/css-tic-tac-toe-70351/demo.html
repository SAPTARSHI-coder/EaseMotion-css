<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Tic-Tac-Toe Board UI</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
  <main class="game-wrapper">
    <div class="decorative-blob blob-1"></div>
    <div class="decorative-blob blob-2"></div>
    
    <section class="game-container">
      <header class="game-header">
        <h1 class="game-title">Tic Tac Toe</h1>
        <div class="turn-indicator">
          <span class="player active">Player X</span>
          <span class="player">Player O</span>
        </div>
      </header>

      <!-- The Board -->
      <div class="tic-tac-toe-board" role="grid" aria-label="Tic Tac Toe Board">
        <!-- Row 1 -->
        <button class="cell mark-x" role="gridcell" aria-label="Cell 1, Player X" tabindex="0">
          <div class="symbol"></div>
        </button>
        <button class="cell empty" role="gridcell" aria-label="Cell 2, Empty" tabindex="0">
          <div class="symbol"></div>
        </button>
        <button class="cell mark-o" role="gridcell" aria-label="Cell 3, Player O" tabindex="0">
          <div class="symbol"></div>
        </button>
        
        <!-- Row 2 -->
        <button class="cell empty" role="gridcell" aria-label="Cell 4, Empty" tabindex="0">
          <div class="symbol"></div>
        </button>
        <button class="cell mark-x winning-cell" role="gridcell" aria-label="Cell 5, Player X" tabindex="0">
          <div class="symbol"></div>
        </button>
        <button class="cell empty" role="gridcell" aria-label="Cell 6, Empty" tabindex="0">
          <div class="symbol"></div>
        </button>
        
        <!-- Row 3 -->
        <button class="cell mark-o" role="gridcell" aria-label="Cell 7, Player O" tabindex="0">
          <div class="symbol"></div>
        </button>
        <button class="cell empty" role="gridcell" aria-label="Cell 8, Empty" tabindex="0">
          <div class="symbol"></div>
        </button>
        <button class="cell mark-x" role="gridcell" aria-label="Cell 9, Player X" tabindex="0">
          <div class="symbol"></div>
        </button>
      </div>

      <footer class="game-footer">
        <button class="reset-btn" aria-label="Restart game">Restart Game</button>
      </footer>
    </section>
  </main>
</body>
</html>
