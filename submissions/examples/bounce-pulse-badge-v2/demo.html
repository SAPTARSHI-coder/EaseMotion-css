<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="CSS Bounce-Pulse Badge for fintech dashboard layouts"
  >
  <title>Bounce-Pulse Badge</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="showcase">
    <section class="dashboard-card" aria-labelledby="title">
      <p class="eyebrow">Fintech Dashboard</p>

      <h1 id="title">Bounce-Pulse Badge</h1>

      <div class="badge-container">
        <span class="bounce-badge" aria-label="Payment status: successful">
          <span class="badge-icon" aria-hidden="true">✓</span>
          <span class="badge-label">Payment Successful</span>
        </span>
      </div>

      <p class="description">
        A lightweight status badge using a smooth bounce and pulse animation,
        built entirely with HTML and CSS.
      </p>
    </section>
  </main>

</body>
</html>
