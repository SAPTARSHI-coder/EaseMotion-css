<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="CSS-only animated aurora text effect."
  >
  <title>CSS Aurora Text Effect</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="aurora-demo">
    <section
      class="aurora-text"
      aria-labelledby="aurora-title"
    >
      <p class="eyebrow">Pure CSS Animation</p>

      <h1 id="aurora-title">
        Aurora
      </h1>

      <p class="description">
        Flowing colors inspired by the northern lights.
      </p>
    </section>
  </main>
</body>
</html>
