<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Parallax Tooltip with SaaS Modern styling"
    >

    <title>Parallax Tooltip - SaaS Modern</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="page">

        <section class="hero">

            <span class="eyebrow">EaseMotion CSS</span>

            <h1>Parallax Tooltip</h1>

            <p class="description">
                A modern SaaS-inspired tooltip with layered parallax depth,
                soft gradients, and smooth CSS-only interactions.
            </p>

            <div class="tooltip-stage">

                <div class="tooltip-orb orb-one"></div>
                <div class="tooltip-orb orb-two"></div>

                <div class="tooltip-wrapper">

                    <button
                        class="tooltip-trigger"
                        type="button"
                        aria-describedby="saas-tooltip"
                    >
                        <span class="trigger-icon">✦</span>
                        <span>Hover me</span>
                    </button>

                    <div
                        class="tooltip"
                        id="saas-tooltip"
                        role="tooltip"
                    >
                        <div class="tooltip-icon">
                            ✨
                        </div>

                        <div class="tooltip-content">
                            <span class="tooltip-label">
                                Smart feature
                            </span>

                            <strong>
                                Everything looks better
                            </strong>

                            <p>
                                Build polished interfaces with effortless
                                interactions.
                            </p>
                        </div>

                        <span class="tooltip-arrow"></span>
                    </div>

                </div>

            </div>

        </section>

    </main>

</body>
</html>
