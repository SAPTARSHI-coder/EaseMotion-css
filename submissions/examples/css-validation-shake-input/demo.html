<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Validation Shake Input</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="demo-container">
    <h1>Subscribe to Newsletter</h1>
    <p class="description">Try submitting an empty or invalid email address to see the CSS-only validation shake.</p>
    
    <form class="validation-form" action="#">
      <div class="form-group">
        <label for="email">Email Address</label>
        <div class="input-wrapper">
          <input 
            type="email" 
            id="email" 
            name="email" 
            placeholder="you@example.com" 
            required 
            aria-describedby="email-error"
          >
          <!-- Using CSS sibling selector to show this when input is user-invalid -->
          <p id="email-error" class="error-message" aria-live="polite">Please enter a valid email address.</p>
        </div>
      </div>
      <button type="submit" class="submit-btn">Subscribe</button>
    </form>
  </main>
</body>
</html>
