<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neumorphic Slider - Retro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section class="slider-card">
      <span class="eyebrow">RETRO CONTROL</span>

      <h1>Neumorphic Slider</h1>

      <p class="description">
        A soft retro-inspired range slider with tactile neumorphic styling.
      </p>

      <div class="slider-wrapper">
        <div class="value-row">
          <span>Intensity</span>
          <output id="sliderValue">65</output>
        </div>

        <input
          id="retroSlider"
          class="retro-slider"
          type="range"
          min="0"
          max="100"
          value="65"
          aria-label="Intensity"
        />

        <div class="range-labels">
          <span>0</span>
          <span>50</span>
          <span>100</span>
        </div>
      </div>
    </section>
  </main>

  <script>
    const slider = document.getElementById("retroSlider");
    const output = document.getElementById("sliderValue");

    function updateSlider() {
      output.value = slider.value;
      slider.style.setProperty(
        "--value",
        `${slider.value}%`
      );
    }

    slider.addEventListener("input", updateSlider);
    updateSlider();
  </script>
</body>
</html>
