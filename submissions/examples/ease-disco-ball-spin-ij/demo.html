<!-- EaseMotion component: disco-ball-spin -->
<!DOCTYPE html>
<html lang="en" data-disco="spin">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
<title>Ease Disco Ball Spin</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="disco-room">
  <header class="disco-head">
    <span class="disco-title">DANCE FLOOR</span>
    <span class="disco-now">NOW PLAYING</span>
  </header>
  <div class="disco-stage">
    <span class="ceiling-bar"></span>
    <span class="disco-chain"></span>
    <span class="disco-ball">
      <span class="tile tile-a"></span>
      <span class="tile tile-b"></span>
      <span class="tile tile-c"></span>
      <span class="tile tile-d"></span>
    </span>
    <span class="spotlight"></span>
  </div>
  <div class="disco-floor">
    <span class="glint glint-1"></span>
    <span class="glint glint-2"></span>
    <span class="glint glint-3"></span>
  </div>
  <footer class="disco-foot">
    <span class="disco-bpm">BPM 122</span>
    <span class="disco-glow">GLOW</span>
  </footer>
</main>
</body>
</html>
