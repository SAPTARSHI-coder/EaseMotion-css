<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Origami Paper Fold UI - EaseMotion CSS</title>
  <!-- Import EaseMotion CSS -->
  <link rel="stylesheet" href="../../../easemotion.css">
  <!-- Component Specific Styles -->
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="minimalist-bg">

  <div class="demo-container">
    
    <div class="header-section">
      <h1 class="ease-text-3xl">Origami Glassmorphism UI</h1>
      <p class="ease-color-muted">An interactive 3D folding envelope. Built entirely with CSS checkbox-hacks, backdrop-filters, and perfectly timed Z-index swapping during hardware-accelerated 3D rotations.</p>
    </div>

    <!-- The 3D Viewport Component -->
    <div class="origami-viewport" aria-label="Interactive 3D origami glass envelope" role="img">
      
      <!-- Ambient Background Orbs to highlight the Glassmorphism -->
      <div class="orb orb-1"></div>
      <div class="orb orb-2"></div>
      <div class="orb orb-3"></div>
      
      <!-- The Interactive UI -->
      <input type="checkbox" id="toggle-envelope" class="hidden-toggle" aria-label="Toggle envelope open/close">
      
      <label for="toggle-envelope" class="envelope-wrapper">
        
        <!-- The Static Back Wall -->
        <div class="glass-panel env-back"></div>
        
        <!-- The Hidden Data Card (Slides out) -->
        <div class="glass-panel env-letter">
          <div class="letter-header">CONFIDENTIAL</div>
          <h2 class="letter-title">Origami Engine</h2>
          <p class="letter-desc">CSS allows us to seamlessly swap z-indexes midway through 3D rotations, creating flawless physical folding simulations.</p>
          <div class="letter-footer">
            <span class="status">DECRYPTED</span>
            <svg class="secure-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" /></svg>
          </div>
        </div>
        
        <!-- The Top Flap (Rotates on X-axis) -->
        <div class="glass-panel env-flap">
          <!-- Small arrow icon indicating interaction -->
          <svg class="flap-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" /></svg>
        </div>
        
        <!-- The Static Front Pocket (Clipped to a polygon) -->
        <div class="glass-panel env-front"></div>
        
      </label>

    </div>

  </div>

</body>
</html>
