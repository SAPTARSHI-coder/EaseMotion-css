<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Retro Arcade Pixel CSS slider created using pure HTML and CSS."
  >
  <title>Retro Arcade Pixel Slider</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="slider-wrapper">
    <section
      class="retro-slider"
      aria-label="Retro Arcade Pixel Slider"
    >
      <div class="slider-track">

        <article class="slide slide-one">
          <span class="pixel-label">LEVEL 01</span>
          <h1>PIXEL QUEST</h1>
          <p>ENTER THE ARCADE</p>
        </article>

        <article class="slide slide-two">
          <span class="pixel-label">LEVEL 02</span>
          <h1>NEON RUN</h1>
          <p>KEEP MOVING</p>
        </article>

        <article class="slide slide-three">
          <span class="pixel-label">LEVEL 03</span>
          <h1>FINAL BOSS</h1>
          <p>READY PLAYER?</p>
        </article>

      </div>

      <div class="slider-controls" aria-label="Slider controls">
        <a href="#slide-one" aria-label="Go to slide 1">01</a>
        <a href="#slide-two" aria-label="Go to slide 2">02</a>
        <a href="#slide-three" aria-label="Go to slide 3">03</a>
      </div>
    </section>
  </main>
</body>
</html>
