<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Git Branch Diagram</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="container">

    <h1>Git Branch Diagram</h1>

    <p class="subtitle">
        Visual representation of commits, branches and merge flow
    </p>


    <section class="git-tree" aria-label="Git branch visualization">


        <div class="branch main-branch">

            <span class="commit">
                C1
            </span>

            <span class="commit">
                C2
            </span>

            <span class="commit">
                C3
            </span>

        </div>



        <div class="branch feature-branch">

            <span class="commit">
                F1
            </span>

            <span class="commit">
                F2
            </span>

        </div>



        <div class="merge-line">

            <span class="commit merge">
                M
            </span>

        </div>


    </section>


</main>


</body>
</html>
