<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teleportation Load Balancers QTBL - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css"></head><body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030712; color: #ffffff;">

    <div class="ease-card ease-card-glass qtbl-container">
        <div class="qtbl-header">
            <h2>Teleportation Load Balancer</h2>
            <span class="ease-badge ease-badge-primary">Fault-Tolerant Quantum</span>
        </div>
        
        <div class="qtbl-screen ease-center">
            <div class="qtbl-flux flux-qtbl-a"></div>
            <div class="qtbl-flux flux-qtbl-b"></div>
            <div class="qtbl-boundary-ring"></div>
            <div class="qtbl-core ease-center"></div>
        </div>

        <div class="qtbl-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Traffic Distribution &amp; Entanglement Pool Balancing</span>
            <button class="ease-btn ease-btn-primary ease-btn-sm ease-hover-grow">Run Load Balancer</button>
        </div>
    </div></body></html>
