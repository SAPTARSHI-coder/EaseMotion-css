<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Float-Drift Modal - Minimalist Tech</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <!-- State Management Checkbox -->
    <input type="checkbox" id="modal-toggle" class="modal-toggle">

    <div class="layout-container">
        
        <header class="section-header">
            <h1 class="title">Deploy Configuration</h1>
            <p class="subtitle">Review the final parameters before initiating the deployment.</p>
        </header>

        <div class="dashboard">
            <div class="config-panel">
                <div class="config-row">
                    <span class="label">Target Environment:</span>
                    <span class="value">Production (us-east-1)</span>
                </div>
                <div class="config-row">
                    <span class="label">Instance Size:</span>
                    <span class="value">c6g.2xlarge (8 vCPUs, 16GB RAM)</span>
                </div>
                
                <div class="actions">
                    <!-- Modal Trigger -->
                    <label for="modal-toggle" class="btn btn-primary">
                        Deploy Now
                    </label>
                </div>
            </div>
        </div>
        
    </div>

    <!-- The Modal Overlay Background -->
    <label for="modal-toggle" class="modal-overlay"></label>

    <!-- The Float-Drift Modal Container -->
    <div class="modal-wrapper">
        <aside class="modal">
            <div class="modal-header">
                <h2 class="modal-title">Confirm Deployment</h2>
                <label for="modal-toggle" class="modal-close">&times;</label>
            </div>
            
            <div class="modal-body">
                
                <div class="alert-box">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
                    <span>This action will overwrite the active production state. Are you absolutely sure you want to proceed?</span>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Type "confirm" to proceed:</label>
                    <input type="text" class="form-input" placeholder="confirm">
                </div>
                
            </div>
            
            <div class="modal-footer">
                <label for="modal-toggle" class="btn btn-outline">Cancel</label>
                <label for="modal-toggle" class="btn btn-primary">Initiate Deployment</label>
            </div>
        </aside>
    </div>

</body>
</html>
