<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-microwave-oven-timer demo</title>
</head>
<body>
<div class="mwt-oven">
  <div class="mwt-face">
    <b class="mwt-time">04:32</b>
    <span class="mwt-mode">DEFROST</span>
  </div>
  <div class="mwt-door">
    <div class="mwt-plate"><span class="mwt-dish"></span></div>
  </div>
  <div class="mwt-pad">
    <button class="mwt-btn">START</button>
    <button class="mwt-btn">STOP</button>
    <button class="mwt-btn">+30S</button>
  </div>
</div>
</body>
</html>
