<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Orbiting Icon Nav Demo | EaseMotion CSS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="demo-container">
        <header class="demo-header">
            <h1>CSS Orbiting Icon Navigation</h1>
            <p>Pure CSS orbital animation with interactive hover pause, focus states, and central hub display.</p>
        </header>

        <section class="orbit-wrapper" aria-label="Orbiting Navigation Hub">
            <div class="central-hub" tabindex="0" role="region" aria-label="Central Hub: EaseMotion Core">
                <span class="hub-icon">✦</span>
                <span class="hub-text">Core Hub</span>
            </div>

            <nav class="orbit-container" aria-label="Orbital Navigation Menu">
                <ul class="orbit-list">
                    <li class="orbit-item" style="--index: 0;">
                        <a href="#home" class="orbit-link" aria-label="Home">
                            <span class="icon">🏠</span>
                            <span class="tooltip">Home</span>
                        </a>
                    </li>
                    <li class="orbit-item" style="--index: 1;">
                        <a href="#features" class="orbit-link" aria-label="Features">
                            <span class="icon">⚡</span>
                            <span class="tooltip">Features</span>
                        </a>
                    </li>
                    <li class="orbit-item" style="--index: 2;">
                        <a href="#animations" class="orbit-link" aria-label="Animations">
                            <span class="icon">🌀</span>
                            <span class="tooltip">Animations</span>
                        </a>
                    </li>
                    <li class="orbit-item" style="--index: 3;">
                        <a href="#docs" class="orbit-link" aria-label="Documentation">
                            <span class="icon">📚</span>
                            <span class="tooltip">Docs</span>
                        </a>
                    </li>
                    <li class="orbit-item" style="--index: 4;">
                        <a href="#settings" class="orbit-link" aria-label="Settings">
                            <span class="icon">⚙️</span>
                            <span class="tooltip">Settings</span>
                        </a>
                    </li>
                    <li class="orbit-item" style="--index: 5;">
                        <a href="#profile" class="orbit-link" aria-label="User Profile">
                            <span class="icon">👤</span>
                            <span class="tooltip">Profile</span>
                        </a>
                    </li>
                </ul>
            </nav>
        </section>
    </main>
</body>
</html>
