<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS XP/Level Progress Bar - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="em-xp-page">
        <div class="em-card" role="region" aria-label="XP Level Progress Bar Showcase">
            <span class="em-card-badge">GAMING STATS</span>
            <div class="em-xp-header">
                <h1 class="em-card-title">Level 42 XP Bar</h1>
                <span class="em-xp-badge-level">LVL 43 READY</span>
            </div>
            <p class="em-card-desc">Gaming-style XP progress bar featuring smooth fill animations, pulsing glow effects, and level up indicators.</p>
            
            <!-- XP Progress Container -->
            <div class="em-xp-container" role="region" aria-label="Experience Progress: 8,450 out of 10,000 XP">
                <div class="em-xp-info-row">
                    <span class="em-xp-label">Current XP</span>
                    <span class="em-xp-value">8,450 / 10,000 XP</span>
                </div>
                <div class="em-progress-track">
                    <div class="em-progress-fill" style="width: 84.5%;"></div>
                </div>
            </div>

            <div class="em-card-footer">
                <span class="em-footer-tag">Pure CSS XP Bar</span>
            </div>
        </div>
    </div>
</body>
</html>
