<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Key Distribution BB84 - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css"></head><body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030712; color: #ffffff;">

    <div class="ease-card ease-card-glass qkd-container">
        <div class="qkd-header">
            <h2>BB84 Protocol QKD</h2>
            <span class="ease-badge ease-badge-success">Secure</span>
        </div>
        
        <div class="qkd-screen ease-center">
            <div class="qkd-flux flux-qkd-a"></div>
            <div class="qkd-flux flux-qkd-b"></div>
            <div class="qkd-boundary-ring"></div>
            <div class="qkd-core ease-center"></div>
        </div>

        <div class="qkd-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">QBER &lt; 1.5%</span>
            <button class="ease-btn ease-btn-success ease-btn-sm ease-hover-grow">Sift Keys</button>
        </div>
    </div></body></html>
