<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-petrol-fuel-gauge demo</title>
</head>
<body>
<div class="pf-app">
  <span class="pf-title">FUEL STOP</span>
  <div class="pf-pump">
    <div class="pf-screen">
      <span class="pf-liters">24.5 L</span>
      <span class="pf-price">$42.10</span>
    </div>
    <div class="pf-gauge">
      <span class="pf-needle"></span>
      <div class="pf-scale">
        <span class="pf-mark">E</span>
        <span class="pf-mark">F</span>
      </div>
    </div>
    <span class="pf-nozzle"></span>
  </div>
  <span class="pf-status">FUELING</span>
</div>
</body>
</html>
