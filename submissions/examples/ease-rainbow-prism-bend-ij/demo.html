<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rainbow Prism Bend Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="tabletop">
    <div class="prism" id="prism" aria-hidden="true">
      <div class="shape"></div>
      <div class="beam beam-in"></div>
      <div class="beam beam-r"></div>
      <div class="beam beam-g"></div>
      <div class="beam beam-b"></div>
    </div>
    <button class="shine" id="shine" type="button">Shine Light</button>
    <p class="hint">White light bends through a prism and splits into color bands.</p>
  </main>
  <script>
    const prism = document.getElementById("prism");
    const shine = document.getElementById("shine");
    function light() {
      prism.classList.remove("lit");
      void prism.offsetWidth;
      prism.classList.add("lit");
    }
    shine.addEventListener("click", light);
  </script>
</body>
</html>
