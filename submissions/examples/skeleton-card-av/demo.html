<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EaseMotion CSS - Skeleton Card Loader Showcase</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background-color: #f8fafc;
      margin: 0;
      padding: 3rem 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .demo-header {
      text-align: center;
      margin-bottom: 2.5rem;
      font-family: system-ui, -apple-system, sans-serif;
      padding: 0 1rem;
    }
    .demo-header h1 {
      color: #0f172a;
      margin: 0 0 0.5rem 0;
      font-size: 2rem;
    }
    .demo-header p {
      color: #64748b;
      margin: 0;
      font-size: 1rem;
    }
  </style>
</head>
<body>

  <header class="demo-header">
    <h1>EaseMotion Skeleton Loader</h1>
    <p>Component Showcase: Pure CSS asynchronous shimmering card blocks.</p>
  </header>

  <!-- Container Grid Component -->
  <main class="em-skeleton-grid" aria-busy="true" aria-live="polite" aria-label="Loading content cards...">
    
    <!-- Skeleton Card Unit 1 -->
    <article class="em-skeleton-card">
      <div class="em-shimmer em-sk-image" aria-hidden="true"></div>
      <div class="em-shimmer em-sk-title" aria-hidden="true"></div>
      <div class="em-sk-meta-row">
        <div class="em-shimmer em-sk-avatar" aria-hidden="true"></div>
        <div class="em-shimmer em-sk-meta-line" aria-hidden="true"></div>
      </div>
      <div class="em-sk-body-group">
        <div class="em-shimmer em-sk-line long" aria-hidden="true"></div>
        <div class="em-shimmer em-sk-line mid" aria-hidden="true"></div>
        <div class="em-shimmer em-sk-line short" aria-hidden="true"></div>
      </div>
      <div class="em-shimmer em-sk-button" aria-hidden="true"></div>
    </article>

    <!-- Skeleton Card Unit 2 -->
    <article class="em-skeleton-card">
      <div class="em-shimmer em-sk-image" aria-hidden="true"></div>
      <div class="em-shimmer em-sk-title" aria-hidden="true"></div>
      <div class="em-sk-meta-row">
        <div class="em-shimmer em-sk-avatar" aria-hidden="true"></div>
        <div class="em-shimmer em-sk-meta-line" aria-hidden="true"></div>
      </div>
      <div class="em-sk-body-group">
        <div class="em-shimmer em-sk-line long" aria-hidden="true"></div>
        <div class="em-shimmer em-sk-line mid" aria-hidden="true"></div>
        <div class="em-shimmer em-sk-line short" aria-hidden="true"></div>
      </div>
      <div class="em-shimmer em-sk-button" aria-hidden="true"></div>
    </article>

    <!-- Skeleton Card Unit 3 -->
    <article class="em-skeleton-card">
      <div class="em-shimmer em-sk-image" aria-hidden="true"></div>
      <div class="em-shimmer em-sk-title" aria-hidden="true"></div>
      <div class="em-sk-meta-row">
        <div class="em-shimmer em-sk-avatar" aria-hidden="true"></div>
        <div class="em-shimmer em-sk-meta-line" aria-hidden="true"></div>
      </div>
      <div class="em-sk-body-group">
        <div class="em-shimmer em-sk-line long" aria-hidden="true"></div>
        <div class="em-shimmer em-sk-line mid" aria-hidden="true"></div>
        <div class="em-shimmer em-sk-line short" aria-hidden="true"></div>
      </div>
      <div class="em-shimmer em-sk-button" aria-hidden="true"></div>
    </article>

  </main>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Skeleton Card • EaseMotion CSS</title>

<link rel="stylesheet" href="../../easemotion.css">
<link rel="stylesheet" href="style.css">

</head>
<body>

<div class="container">

    <span class="badge">SKELETON CARD</span>

    <h1>Loading State UI</h1>

    <p>
        A modern animated skeleton loader showcasing image, title,
        description, and button placeholders.
    </p>

    <div class="skeleton-card">

        <div class="skeleton image"></div>

        <div class="content">

            <div class="skeleton title"></div>

            <div class="skeleton text"></div>

            <div class="skeleton text short"></div>

            <div class="skeleton button"></div>

        </div>

    </div>

</div>

</body>
</html>
