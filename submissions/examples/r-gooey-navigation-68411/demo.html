<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CSS-only gooey navigation">
  <title>Gooey Navigation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section class="demo" aria-labelledby="title">
      <span class="eyebrow">EaseMotion CSS</span>
      <h1 id="title">Gooey Navigation</h1>
      <p class="intro">
        A playful navigation pattern using CSS filters, transforms, and
        animated gooey blobs.
      </p>

      <nav class="gooey-nav" aria-label="Primary navigation">
        <div class="gooey-blob" aria-hidden="true"></div>

        <a class="nav-link active" href="#home" aria-current="page">
          <span class="icon" aria-hidden="true">⌂</span>
          <span>Home</span>
        </a>

        <a class="nav-link" href="#work">
          <span class="icon" aria-hidden="true">◆</span>
          <span>Work</span>
        </a>

        <a class="nav-link" href="#about">
          <span class="icon" aria-hidden="true">●</span>
          <span>About</span>
        </a>

        <a class="nav-link" href="#contact">
          <span class="icon" aria-hidden="true">✦</span>
          <span>Contact</span>
        </a>
      </nav>

      <div class="hint">
        Hover or focus a navigation item to move the gooey highlight.
      </div>
    </section>
  </main>
</body>
</html>
