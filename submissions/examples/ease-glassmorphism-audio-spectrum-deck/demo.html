<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ease Glassmorphic Audio Spectrum Analyzer Deck</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="spec-body">
  <div class="spec-deck">
    <h3>Spectrum Analyzer</h3>
    <div class="bars-container" id="bars"></div>
  </div>

  <script>
    const container = document.getElementById('bars');
    for (let i = 0; i < 16; i++) {
      const bar = document.createElement('div');
      bar.className = 'bar';
      bar.style.height = `${Math.random() * 80 + 10}%`;
      container.appendChild(bar);
    }
    setInterval(() => {
      document.querySelectorAll('.bar').forEach(b => {
        b.style.height = `${Math.random() * 80 + 10}%`;
      });
    }, 200);
  </script>
</body>
</html>
