<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frosted Glass Card - Glassmorphism Showcase</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="showcase-container">
    <div class="content-wrapper">
      <h1>Glassmorphism Showcase</h1>
      <p>Modern translucent UI elements with active backdrop blur effects.</p>

      <!-- Glassmorphism Card Component -->
      <article class="ease-glass-card" aria-labelledby="card-title">
        <div class="glass-badge">Featured</div>
        <h2 id="card-title">Frosted Glass Card</h2>
        <p>
          This card uses <code>backdrop-filter</code> and semi-transparent RGBA layers 
          to achieve a realistic glass-like illusion over vibrant backgrounds.
        </p>
        <button class="glass-btn" type="button">Explore Feature</button>
      </article>
    </div>
  </main>

</body>
</html>
