<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>ease-password-mismatch-shake</title><link rel="stylesheet" href="style.css"></head>
<body><div class="container"><h1>Password Mismatch</h1><p class="subtitle">Shake animation on mismatch</p><div class="form-card"><input class="input" type="password" id="pw1" placeholder="Enter password"><input class="input" type="password" id="pw2" placeholder="Confirm password"><button class="trigger" id="trigger">Submit</button><p class="msg" id="msg"></p></div></div>
<script>var t=document.getElementById("trigger");var p1=document.getElementById("pw1");var p2=document.getElementById("pw2");var m=document.getElementById("msg");t.addEventListener("click",function(){if(p1.value!==p2.value){m.textContent="Passwords do not match!";m.classList.add("shake");setTimeout(function(){m.classList.remove("shake")},500)}else{m.textContent="Passwords match!";m.classList.remove("shake");m.style.color="#22c55e"}});</script>
</body></html>
