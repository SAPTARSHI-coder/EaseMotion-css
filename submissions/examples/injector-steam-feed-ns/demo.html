<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Injector Steam Feed — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Injector Steam Feed demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Injector Steam Feed</h1>
      <p class="lede">Injector steam feed lifting water into the boiler</p>
    </header>

    <section class="ease-injector-steam-feed" data-demo="injector-steam-feed" aria-live="polite">
      <div class="ease-injector-steam-feed__housing">
        <div class="ease-injector-steam-feed__bezel">
          <div class="ease-injector-steam-feed__face">
            <div class="ease-injector-steam-feed__readout">
              <span class="ease-injector-steam-feed__label">Injector Steam Feed</span>
              <span class="ease-injector-steam-feed__value">LIVE</span>
            </div>
            <div class="ease-injector-steam-feed__motion" aria-hidden="true">
              <span class="ease-injector-steam-feed__a"></span>
              <span class="ease-injector-steam-feed__b"></span>
              <span class="ease-injector-steam-feed__c"></span>
              <span class="ease-injector-steam-feed__d"></span>
            </div>
            <div class="ease-injector-steam-feed__meters">
              <i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-injector-steam-feed__controls">
          <button type="button" class="ease-injector-steam-feed__btn primary">Feed</button>
          <button type="button" class="ease-injector-steam-feed__btn">Shut</button>
          <label class="ease-injector-steam-feed__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-injector-steam-feed__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
