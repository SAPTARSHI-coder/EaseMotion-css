<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plotter Pen Carriage — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Plotter Pen Carriage demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Plotter Pen Carriage</h1>
      <p class="lede">Plotter pen carriage drawing axis-aligned strokes</p>
    </header>

    <section class="ease-plotter-pen-carriage" data-demo="plotter-pen-carriage" aria-live="polite">
      <div class="ease-plotter-pen-carriage__housing">
        <div class="ease-plotter-pen-carriage__bezel">
          <div class="ease-plotter-pen-carriage__face">
            <div class="ease-plotter-pen-carriage__readout">
              <span class="ease-plotter-pen-carriage__label">Plotter Pen Carriage</span>
              <span class="ease-plotter-pen-carriage__value">LIVE</span>
            </div>
            <div class="ease-plotter-pen-carriage__motion" aria-hidden="true">
              <span class="ease-plotter-pen-carriage__a"></span>
              <span class="ease-plotter-pen-carriage__b"></span>
              <span class="ease-plotter-pen-carriage__c"></span>
              <span class="ease-plotter-pen-carriage__d"></span>
            </div>
            <div class="ease-plotter-pen-carriage__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-plotter-pen-carriage__controls">
          <button type="button" class="ease-plotter-pen-carriage__btn primary">Engage</button>
          <button type="button" class="ease-plotter-pen-carriage__btn">Reset</button>
          <label class="ease-plotter-pen-carriage__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-plotter-pen-carriage__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
