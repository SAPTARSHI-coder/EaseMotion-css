<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Cyberpunk Input Field</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="demo-container">
        <header class="demo-header">
            <h1 class="cyber-title">SYSTEM_LOGIN_</h1>
            <p>A pure CSS, JavaScript-free animated input field with floating labels, geometric cut-corners, and glowing scanline animations.</p>
        </header>

        <section class="demo-section">
            
            <div class="ease-cyber-group theme-cyan">
                <!-- Note: placeholder=" " is strictly required for the CSS floating label logic -->
                <input type="text" id="username" class="ease-cyber-input" placeholder=" " required>
                <label for="username" class="ease-cyber-floating-label">Operator_ID</label>
                <span class="ease-cyber-scanline"></span>
            </div>

            <div class="ease-cyber-group theme-magenta">
                <input type="password" id="password" class="ease-cyber-input" placeholder=" " required>
                <label for="password" class="ease-cyber-floating-label">Pass_Key</label>
                <span class="ease-cyber-scanline"></span>
            </div>

            <div class="ease-cyber-group theme-yellow">
                <input type="text" id="access" class="ease-cyber-input" placeholder=" " value="RESTRICTED_ACCESS" disabled>
                <label for="access" class="ease-cyber-floating-label">Access_Level</label>
                <span class="ease-cyber-scanline"></span>
            </div>

        </section>
        
        <p class="demo-footer">Try focusing the inputs using your mouse or <strong>Tab</strong> key to see the floating labels and neon animations.</p>
    </main>
</body>
</html>
