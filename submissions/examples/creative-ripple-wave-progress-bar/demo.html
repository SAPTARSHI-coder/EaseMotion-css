<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        Ripple-Wave Progress Bar | EaseMotion CSS
    </title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<main class="dashboard">


    <section class="hero">

        <span class="badge">
            Dashboard UI
        </span>


        <h1>
            CSS Ripple-Wave Progress Bar
        </h1>


        <p>
            A pure CSS animated progress bar
            with ripple wave effects for
            responsive dashboard layouts.
        </p>

    </section>




    <section class="progress-container"
        aria-label="Project Progress">


        <div class="progress-card">


            <div class="header">

                <h2>
                    Project Completion
                </h2>


                <span>
                    75%
                </span>

            </div>



            <div class="progress-track">


                <div class="progress-fill">

                    <span class="wave"></span>

                </div>


            </div>


        </div>





        <div class="progress-card">


            <div class="header">

                <h2>
                    Development Status
                </h2>


                <span>
                    60%
                </span>

            </div>



            <div class="progress-track">


                <div class="progress-fill second">

                    <span class="wave"></span>

                </div>


            </div>


        </div>





        <div class="progress-card">


            <div class="header">

                <h2>
                    Deployment
                </h2>


                <span>
                    90%
                </span>

            </div>



            <div class="progress-track">


                <div class="progress-fill third">

                    <span class="wave"></span>

                </div>


            </div>


        </div>


    </section>


</main>


</body>

</html>
