<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Battery Charge &mdash; EaseMotion CSS Demo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="page-head">
    <p class="kicker">EaseMotion CSS &middot; Progress</p>
    <h1>Battery Charge</h1>
    <p class="sub">Charging to 84% — the fill is striped like a real li-ion cell.</p>
  </header>
  <main class="stage">
    <div class="bc-battery"><div class="bc-fill"></div></div>
    <p class="bc-pct">84%</p>
    <p class="bc-note">&#9889; Fast charging</p>
  </main>
  <p class="stage-note">Repeating-linear-gradient draws the stripe texture without images.</p>
  <footer class="page-foot">
    <span>Pure CSS &middot; zero dependencies</span>
  </footer>
</body>
</html>
