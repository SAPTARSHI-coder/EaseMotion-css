<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Notification Bell | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <header class="demo-header">
    <h1>Animated Notification Bell</h1>
    <p>CSS bell swing animation with pulsing badge counter and dropdown panel.</p>
  </header>
  <main class="demo-main">
    <section class="demo-section">
      <h2>Live Demo</h2>
      <div class="ease-bell">
        <button class="ease-bell__btn">
          <span class="ease-bell__icon">&#128276;</span>
          <span class="ease-bell__badge ease-bell__badge--pulse">3</span>
        </button>
      </div>
    </section>
  </main>
</body>
</html>
