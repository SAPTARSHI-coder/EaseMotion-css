<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Animated Newsletter Card - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Pure CSS demo state toggle -->
  <input
    type="checkbox"
    id="newsletter-state"
    class="newsletter-state"
    aria-label="Toggle newsletter subscription success state"
  />

  <main class="newsletter-page">

    <section class="newsletter-card">

      <div class="newsletter-glow"></div>

      <!-- Form View -->
      <div class="newsletter-view form-view">
        <span class="pill">Newsletter</span>

        <h1>Stay in the loop</h1>

        <p>
          Get the latest UI components, animation effects, and open-source
          updates delivered to your inbox.
        </p>

        <div class="newsletter-form">
          <input
            type="email"
            placeholder="Enter your email"
            aria-label="Email address"
          />

          <label for="newsletter-state" class="subscribe-btn">
            Subscribe
          </label>
        </div>

        <span class="note">No spam. Unsubscribe anytime.</span>
      </div>

      <!-- Success View -->
      <div class="newsletter-view success-view">
        <div class="success-icon">✓</div>

        <h2>You are subscribed!</h2>

        <p>
          Thanks for joining. You will receive the latest updates and
          components directly in your inbox.
        </p>

        <label for="newsletter-state" class="reset-btn">
          Reset Demo
        </label>
      </div>

    </section>

  </main>

</body>
</html>
