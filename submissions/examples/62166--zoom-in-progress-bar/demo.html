<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Zoom-In Progress Bar | EaseMotion CSS</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="container">

    <section class="card">

        <h1>Project Progress</h1>

        <p class="subtitle">
            SaaS product development progress showcase
        </p>


        <div class="progress-wrapper">

            <div class="progress-info">
                <span>Product Development</span>
                <strong>80%</strong>
            </div>


            <div class="progress-track">

                <div class="progress-fill">
                    <span></span>
                </div>

            </div>

        </div>


        <div class="stats">

            <div>
                <h2>24</h2>
                <p>Tasks Done</p>
            </div>

            <div>
                <h2>6</h2>
                <p>Remaining</p>
            </div>

            <div>
                <h2>80%</h2>
                <p>Completed</p>
            </div>

        </div>


    </section>

</main>


</body>
</html>
