<!-- EaseMotion component: radar-sweep-display -->
<!DOCTYPE html>
<html lang="en" data-radar="sweep">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.3">
<title>Ease Radar Sweep Display</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="radar-screen">
  <header class="radar-head">
    <span class="radar-title">AIR DEFENSE</span>
    <span class="radar-code">RDR-7</span>
  </header>
  <div class="radar-dish">
    <span class="radar-ring ring-1"></span>
    <span class="radar-ring ring-2"></span>
    <span class="radar-ring ring-3"></span>
    <span class="radar-sweep"></span>
    <span class="radar-blip blip-a"></span>
    <span class="radar-blip blip-b"></span>
    <span class="radar-blip blip-c"></span>
  </div>
  <footer class="radar-foot">
    <span class="radar-contact">CONTACTS: 3</span>
    <span class="radar-status">SCANNING</span>
  </footer>
</main>
</body>
</html>
