<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dynamic Search Bar — Claymorphism</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="demo-shell">
    <header><p class="eyebrow">EaseMotion CSS · #85709</p><h1>Dynamic Search Bar Input</h1><p>Claymorphism styling with responsive sizing and CSS-only transitions.</p></header>
    <form class="search-demo" action="#" role="search">
      <label class="search-field">
        <span class="search-field__label">Search components</span>
        <input type="search" name="query" placeholder="Try “accordion”" autocomplete="off">
      </label>
      <button type="submit">Search</button>
    </form>
  </main>
</body>
</html>
