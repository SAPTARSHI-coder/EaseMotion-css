<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ease Skeleton to Content Morphing Transition</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="ease-skel-body">
  <div class="ease-skel-card" id="skelCard">
    <div class="ease-skel-loading">
      <div class="ease-skel-box skel-img"></div>
      <div class="ease-skel-box skel-title"></div>
      <div class="ease-skel-box skel-text"></div>
    </div>
    <div class="ease-skel-real">
      <div class="real-img">✨ Image</div>
      <h2>Real Card Title</h2>
      <p>Content loaded seamlessly without layout shifts.</p>
    </div>
  </div>
  <button id="toggleBtn" style="margin-top:20px; padding:10px 20px;">Toggle Loaded State</button>

  <script>
    document.getElementById('toggleBtn').addEventListener('click', () => {
      document.getElementById('skelCard').classList.toggle('loaded');
    });
  </script>
</body>
</html>
