<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="CSS-only hamburger menu to X toggle animation."
  >

  <title>Hamburger Menu to X Toggle</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="demo">
    <p class="eyebrow">EaseMotion CSS</p>

    <h1>Hamburger Menu Toggle</h1>

    <p class="description">
      A pure CSS hamburger icon that smoothly transforms
      into an X when activated.
    </p>

    <div class="menu-demo">
      <input
        class="menu-checkbox"
        type="checkbox"
        id="menu-toggle"
        aria-label="Toggle navigation menu"
      >

      <label
        class="ease-menu-toggle"
        for="menu-toggle"
        aria-label="Toggle navigation menu"
      >
        <span></span>
        <span></span>
        <span></span>
      </label>

      <nav
        class="demo-navigation"
        aria-label="Demo navigation"
      >
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#projects">Projects</a>
      </nav>
    </div>

    <p class="instruction">
      Click the menu icon to toggle it.
    </p>
  </main>
</body>
</html>
