<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Solar Flare Radial CSS Modal"
  >
  <title>Solar Flare Radial Modal</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="demo">
    <button
      class="open-modal"
      type="button"
      onclick="document.getElementById('solar-modal').showModal()"
    >
      Open Solar Flare Modal
    </button>
  </main>

  <dialog
    id="solar-modal"
    class="solar-modal"
    aria-labelledby="solar-modal-title"
  >
    <div class="modal-content">

      <div class="solar-flare" aria-hidden="true"></div>

      <button
        class="close-modal"
        type="button"
        aria-label="Close modal"
        onclick="this.closest('dialog').close()"
      >
        &times;
      </button>

      <div class="modal-icon" aria-hidden="true">
        ✦
      </div>

      <h1 id="solar-modal-title">
        Solar Flare
      </h1>

      <p>
        A smooth radial modal inspired by the energy and movement
        of a solar flare.
      </p>

      <div class="modal-actions">
        <button
          class="primary-action"
          type="button"
          onclick="document.getElementById('solar-modal').close()"
        >
          Continue
        </button>

        <button
          class="secondary-action"
          type="button"
          onclick="document.getElementById('solar-modal').close()"
        >
          Cancel
        </button>
      </div>

    </div>
  </dialog>

</body>
</html>
