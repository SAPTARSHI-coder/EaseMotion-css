<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark light">
  <title>Aurora Glow Mesh Gradient</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">
    <section class="aurora-card" aria-labelledby="aurora-title">

      <div class="aurora-bg" aria-hidden="true">
        <span class="aurora-blob blob-one"></span>
        <span class="aurora-blob blob-two"></span>
        <span class="aurora-blob blob-three"></span>
        <span class="aurora-blob blob-four"></span>
      </div>

      <div class="grid-overlay" aria-hidden="true"></div>

      <div class="content">
        <span class="badge">MESH GRADIENT</span>

        <h1 id="aurora-title">Aurora Glow</h1>

        <p>
          A smooth CSS-only mesh gradient inspired by the soft movement
          and luminous colors of an aurora.
        </p>

        <div class="actions">
          <button class="primary-btn" type="button">
            Explore Glow
          </button>

          <button class="secondary-btn" type="button">
            View Details
          </button>
        </div>
      </div>

      <div class="glow-ring ring-one" aria-hidden="true"></div>
      <div class="glow-ring ring-two" aria-hidden="true"></div>

    </section>
  </main>

</body>
</html>
