<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Segmented slider control — EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <header class="page-head">
      <h1>Segmented slider control</h1>
      <p>A 3-option segmented control whose active block slides between the three options on click.</p>
    </header>
    <section class="demo">
      <div class="segmentedslidercontrolv2" data-active="1"><button data-i="0">Day</button><button data-i="1">Week</button><button data-i="2">Month</button><div class="segmentedslidercontrolv2-pill"></div></div>
    </section>
    <footer class="page-foot">
      <small>Submission folder: <code>submissions/examples/segmented-slider-control-v2/</code></small>
    </footer>
  </main>
</body>
</html>
