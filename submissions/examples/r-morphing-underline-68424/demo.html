<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Morphing Underline</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="demo">
    <nav class="morph-nav" aria-label="Primary navigation">
      <a href="#home" class="morph-link active">
        <span>Home</span>
      </a>

      <a href="#about" class="morph-link">
        <span>About</span>
      </a>

      <a href="#projects" class="morph-link">
        <span>Projects</span>
      </a>

      <a href="#contact" class="morph-link">
        <span>Contact</span>
      </a>
    </nav>

    <section class="content" id="home">
      <p class="eyebrow">EaseMotion CSS</p>
      <h1>Morphing Underline</h1>
      <p>
        Hover or focus navigation items to reveal a smooth underline
        that morphs its width, shape, and color.
      </p>
    </section>
  </main>

</body>
</html>
