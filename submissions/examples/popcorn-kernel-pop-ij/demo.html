<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-popcorn-kernel-pop demo</title>
</head>
<body>
<div class="pp-app">
  <span class="pp-title">POPCORN</span>
  <div class="pp-machine">
    <span class="pp-lamp"></span>
    <div class="pp-kettle">
      <span class="pp-kernel pp-kernel-1"></span>
      <span class="pp-kernel pp-kernel-2"></span>
      <span class="pp-kernel pp-kernel-3"></span>
      <span class="pp-kernel pp-kernel-4"></span>
    </div>
    <div class="pp-case">
      <span class="pp-pop pp-pop-1"></span>
      <span class="pp-pop pp-pop-2"></span>
      <span class="pp-pop pp-pop-3"></span>
    </div>
    <span class="pp-tray"></span>
  </div>
</div>
</body>
</html>
