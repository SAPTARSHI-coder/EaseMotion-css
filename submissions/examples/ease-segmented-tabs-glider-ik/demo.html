<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EaseMotion CSS — Nav Tabs Glider Showcase</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="tabs-demo-wrapper">
    <header class="tabs-header">
      <span class="badge">UI Component Showcase</span>
      <h1>Glassmorphic Nav Tabs Glider</h1>
      <p>Accessible navigation tab bar with smooth background sliding glider, active tab glow, and zero JavaScript.</p>
    </header>

    <main class="tabs-card">
      <nav class="ease-nav-tabs">
        <input type="radio" id="tab-overview" name="nav-tab" checked>
        <label for="tab-overview">Overview</label>

        <input type="radio" id="tab-analytics" name="nav-tab">
        <label for="tab-analytics">Analytics</label>

        <input type="radio" id="tab-settings" name="nav-tab">
        <label for="tab-settings">Settings</label>

        <div class="tab-glider"></div>
      </nav>
    </main>

    <footer class="tabs-footer">
      <p>EaseMotion CSS Component &bull; Submitted by @Ishita-Katiyar-06</p>
    </footer>
  </div>
</body>
</html>
