<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ripple-wave-dropdown demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body style="margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg,#1e1b4b,#312e81); padding:3rem;">

  <div class="dropdown-ripple" id="dropdownRipple">
    <button class="dropdown-ripple__trigger" id="rippleTrigger">
      Menu ▾
    </button>
    <div class="dropdown-ripple__panel">
      <a href="#" class="dropdown-ripple__item">Dashboard</a>
      <a href="#" class="dropdown-ripple__item">Settings</a>
      <a href="#" class="dropdown-ripple__item">Sign Out</a>
    </div>
  </div>

  <script>
    const wrap = document.getElementById('dropdownRipple');
    const trigger = document.getElementById('rippleTrigger');

    trigger.addEventListener('click', (e) => {
      wrap.classList.toggle('is-open');

      const rect = trigger.getBoundingClientRect();
      const ripple = document.createElement('span');
      ripple.className = 'dropdown-ripple__ripple';
      const size = Math.max(rect.width, rect.height);
      ripple.style.width = ripple.style.height = size + 'px';
      ripple.style.left = (e.clientX - rect.left - size / 2) + 'px';
      ripple.style.top = (e.clientY - rect.top - size / 2) + 'px';
      trigger.appendChild(ripple);
      ripple.addEventListener('animationend', () => ripple.remove());
    });

    document.addEventListener('click', (e) => {
      if (!wrap.contains(e.target)) wrap.classList.remove('is-open');
    });
  </script>

</body>
</html>
