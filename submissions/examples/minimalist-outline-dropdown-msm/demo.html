    <title>Minimalist Outline Dropdown</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="demo-wrap">

            <li>
              <a href="#start">

            <li>
              <a href="#patterns">

            <li>
              <a href="#api">

              </a>
