<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Material Floating Label Input</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="demo">
    <section class="form-card">

      <h1>Material Design Input</h1>

      <p class="description">
        Responsive floating label inputs built with pure CSS.
      </p>

      <form class="material-form">

        <div class="material-field">
          <input
            class="material-input"
            type="text"
            id="name"
            name="name"
            placeholder=" "
            autocomplete="name"
            required
          >

          <label class="material-label" for="name">
            Full Name
          </label>
        </div>

        <div class="material-field">
          <input
            class="material-input"
            type="email"
            id="email"
            name="email"
            placeholder=" "
            autocomplete="email"
            required
          >

          <label class="material-label" for="email">
            Email Address
          </label>
        </div>

        <div class="material-field">
          <input
            class="material-input"
            type="password"
            id="password"
            name="password"
            placeholder=" "
            autocomplete="new-password"
            required
          >

          <label class="material-label" for="password">
            Password
          </label>
        </div>

        <div class="material-field">
          <textarea
            class="material-input material-textarea"
            id="message"
            name="message"
            placeholder=" "
            rows="4"
          ></textarea>

          <label class="material-label" for="message">
            Message
          </label>
        </div>

        <button class="material-button" type="submit">
          Submit
        </button>

      </form>

    </section>
  </main>

</body>
</html>
