<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Retro Floating Label Input — EaseMotion CSS</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="demo">
      <h1>Retro Contact Field</h1>
      <form class="field" action="#" method="post">
        <input id="email" name="email" type="email" placeholder=" " required />
        <label for="email">Email address</label>
        <small>Type into the field to see the label move into its compact position.</small>
      </form>
    </main>
  </body>
</html>
