<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Interactive Material Button</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <h1>Interactive Material Button</h1>

        <p class="description">
            A responsive CSS-only button inspired by Material Design.
        </p>

        <div class="button-group">

            <button class="material-button primary">
                Get Started
            </button>

            <button class="material-button secondary">
                Learn More
            </button>

            <button class="material-button outline">
                Explore
            </button>

        </div>

    </main>

</body>
</html>
