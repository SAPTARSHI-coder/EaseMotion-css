<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-jukebox-selector</title>
</head>
<body>
<main class="jbs-card">
  <header class="jbs-head">
    <h1 class="jbs-title">Jukebox</h1>
    <span class="jbs-credit">3 plays left</span>
  </header>
  <section class="jbs-disc-area" aria-label="disc">
    <div class="jbs-disc">
      <span class="jbs-disc-label">EASE</span>
    </div>
  </section>
  <section class="jbs-tracklist">
    <span class="jbs-track jbs-track-sel">A1 Sunrise Groove</span>
    <span class="jbs-track">A2 Night Drive</span>
    <span class="jbs-track">B1 Static Bloom</span>
    <span class="jbs-track">B2 Golden Hour</span>
  </section>
  <footer class="jbs-foot">
    <span class="jbs-now">A1</span>
    <span class="jbs-play">PLAY</span>
  </footer>
</main>
</body>
</html>
