<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EaseMotion - Search Expand</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main>
    <form class="search-box">
      <label for="search" class="search-icon" aria-label="Search">⌕</label>
      <input
        id="search"
        type="search"
        placeholder="Search..."
        aria-label="Search"
      >
    </form>
  </main>

</body>
