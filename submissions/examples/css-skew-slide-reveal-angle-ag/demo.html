<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Animation Preset: Skew Slide Reveal Angle</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <div class="demo-container">
    <h1 class="demo-text ease-anim-skew-slide-reveal-angle">
      Motion Reveal.
    </h1>
  </div>

  <!-- Re-trigger animation script just for the demo loop -->
  <script>
    const el = document.querySelector('.demo-text');
    setInterval(() => {
      el.classList.remove('ease-anim-skew-slide-reveal-angle');
      void el.offsetWidth; // trigger reflow
      el.classList.add('ease-anim-skew-slide-reveal-angle');
    }, 2500);
  </script>
</body>
</html>
