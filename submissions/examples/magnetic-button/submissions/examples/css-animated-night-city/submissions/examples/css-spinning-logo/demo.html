<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="CSS animated spinning logo that assembles on page load."
  >

  <title>CSS Spinning Logo Animation</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="logo-demo">
    <section class="logo-card" aria-labelledby="logo-title">

      <div
        class="logo"
        role="img"
        aria-label="Animated EaseMotion style geometric logo"
      >
        <svg
          class="logo-svg"
          viewBox="0 0 240 240"
          xmlns="http://www.w3.org/2000/svg"
          aria-hidden="true"
        >
          <g class="logo-mark">

            <path
              class="logo-piece logo-piece--one"
              d="M120 18 L174 49 L174 111 L120 142 L66 111 L66 49 Z"
            />

            <path
              class="logo-piece logo-piece--two"
              d="M66 129 L120 98 L174 129 L174 191 L120 222 L66 191 Z"
            />

            <path
              class="logo-piece logo-piece--three"
              d="M48 80 L102 111 L102 173 L48 142 Z"
            />

            <path
              class="logo-piece logo-piece--four"
              d="M192 80 L138 111 L138 173 L192 142 Z"
            />

            <circle
              class="logo-core"
              cx="120"
              cy="120"
              r="17"
            />

          </g>
        </svg>
      </div>

      <div class="logo-content">
        <p class="eyebrow">EaseMotion CSS</p>
        <h1 id="logo-title">Spinning Logo</h1>
        <p>
          A lightweight logo assembly animation built entirely with
          SVG and CSS.
        </p>
      </div>

    </section>
  </main>

</body>
</html>
