<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Autocomplete Dropdown</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="autocomplete-container">
  <h1>Autocomplete Dropdown</h1>

  <div class="autocomplete" role="combobox" aria-expanded="true">
    <input
      type="text"
      placeholder="Search technologies..."
      aria-label="Search technologies"
    >

    <ul class="suggestions" role="listbox">
      <li tabindex="0">HTML</li>
      <li tabindex="0">CSS</li>
      <li tabindex="0">JavaScript</li>
      <li tabindex="0">React</li>
      <li tabindex="0">Vue</li>
      <li tabindex="0">Angular</li>
      <li tabindex="0">Tailwind CSS</li>
    </ul>
  </div>

  <p class="note">
    Focus the input field to reveal suggestions.
  </p>
</div>

</body>
</html>
