<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Tarot Card - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="em-tarot-page">
        <div class="em-card" role="region" aria-label="Tarot Card Showcase" tabindex="0">
            <span class="em-card-badge">MYSTICAL UI</span>
            <h1 class="em-card-title">Tarot Card</h1>
            <p class="em-card-desc">An ornate mystical tarot card component featuring mystical borders, golden foil accents, and hover elevation using pure CSS.</p>
            
            <!-- Tarot Card Component Container -->
            <div class="em-tarot-container" role="img" aria-label="Ornate tarot card">
                <div class="em-tarot-inner">
                    <div class="em-tarot-border">
                        <div class="em-tarot-content">
                            <span class="em-tarot-symbol">🔮</span>
                            <h2 class="em-tarot-name">The Oracle</h2>
                            <p class="em-tarot-num">III</p>
                        </div>
                    </div>
                </div>
            </div>

            <a href="#" class="em-card-btn" role="button">Draw Card</a>
        </div>
    </div>
</body>
</html>
