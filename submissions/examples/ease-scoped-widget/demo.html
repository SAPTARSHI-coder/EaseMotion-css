<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Component Isolation using CSS @scope</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Left Side: Global / Unscoped Elements -->
  <div class="global-container" style="display: flex; flex-direction: column; gap: 1rem; width: 300px;">
    <h2 class="title">Global Title</h2>
    <img src="https://ui-avatars.com/api/?name=Global" alt="Avatar">
    <button class="btn">Global Button</button>
  </div>

  <!-- Right Side: Scoped Widget Component -->
  <div class="ease-complex-widget">
    <h2 class="title">Scoped Title</h2>
    <img src="https://ui-avatars.com/api/?name=Widget" alt="Avatar">
    <button class="btn">Scoped Button</button>

    <!-- Donut Hole Slot Excluded from Scope -->
    <div class="ease-slot" style="margin-top: 1rem; padding: 1rem; border: 1px dashed #475569; border-radius: 8px;">
      <h2 class="title">Slot Title</h2>
    </div>
  </div>

</body>
</html>
