<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ease Infinite Marquee</title>
    <link rel="stylesheet" href="../../../easemotion.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="ease-marquee-wrapper">
        <h3 class="ease-marquee-title">Trusted by innovative teams worldwide</h3>
        
        <div class="ease-marquee-container">
            <!-- 
              To create an infinite scrolling effect seamlessly in pure CSS, 
              we duplicate the content track so that when the first finishes, 
              the second is already filling the void.
            -->
            <div class="ease-marquee-track">
                <!-- Original Set -->
                <div class="ease-marquee-item">Logo 1</div>
                <div class="ease-marquee-item">Logo 2</div>
                <div class="ease-marquee-item">Logo 3</div>
                <div class="ease-marquee-item">Logo 4</div>
                <div class="ease-marquee-item">Logo 5</div>
                
                <!-- Duplicated Set for Seamless Loop -->
                <div class="ease-marquee-item" aria-hidden="true">Logo 1</div>
                <div class="ease-marquee-item" aria-hidden="true">Logo 2</div>
                <div class="ease-marquee-item" aria-hidden="true">Logo 3</div>
                <div class="ease-marquee-item" aria-hidden="true">Logo 4</div>
                <div class="ease-marquee-item" aria-hidden="true">Logo 5</div>
            </div>
        </div>
    </div>
</body>
</html>
