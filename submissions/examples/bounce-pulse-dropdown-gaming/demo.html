<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CSS Bounce-Pulse Dropdown for Gaming Hub Layouts">
  <title>Bounce-Pulse Gaming Dropdown</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="gaming-page">
    <section class="dropdown-showcase" aria-labelledby="title">
      <p class="eyebrow">EASEMOTION CSS</p>
      <h1 id="title">Gaming Hub</h1>
      <p class="description">
        A pure CSS bounce-pulse dropdown with no JavaScript.
      </p>

      <div class="dropdown">
        <button
          class="dropdown-toggle"
          type="button"
          aria-haspopup="true"
          aria-expanded="false"
        >
          <span>Choose Game Mode</span>
          <span class="arrow" aria-hidden="true">⌄</span>
        </button>

        <div class="dropdown-menu" role="menu">
          <a href="#" role="menuitem">
            <span class="icon">⚔</span>
            <span>
              <strong>Battle Arena</strong>
              <small>Competitive multiplayer</small>
            </span>
          </a>

          <a href="#" role="menuitem">
            <span class="icon">🚀</span>
            <span>
              <strong>Space Rush</strong>
              <small>Fast-paced adventure</small>
            </span>
          </a>

          <a href="#" role="menuitem">
            <span class="icon">🏆</span>
            <span>
              <strong>Tournament</strong>
              <small>Ranked gaming mode</small>
            </span>
          </a>

          <a href="#" role="menuitem">
            <span class="icon">🎮</span>
            <span>
              <strong>Free Play</strong>
              <small>Casual gaming session</small>
            </span>
          </a>
        </div>
      </div>
    </section>
  </main>

</body>
</html>
