<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Skew-Active Tabs - Minimalist Tech</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="layout-container">
        
        <header class="section-header">
            <h1 class="title">System Configuration</h1>
            <p class="subtitle">Select a category below to configure system preferences.</p>
        </header>

        <div class="tabs-container">
            
            <!-- State Management Radio Buttons -->
            <input type="radio" name="tab-group" id="tab-1" class="tab-radio" checked>
            <input type="radio" name="tab-group" id="tab-2" class="tab-radio">
            <input type="radio" name="tab-group" id="tab-3" class="tab-radio">
            
            <!-- Tab Navigation Header -->
            <nav class="tab-header">
                <!-- 
                  The skew-indicator is animated via CSS based on which radio is checked. 
                  It slides horizontally and de-skews when active.
                -->
                <div class="skew-indicator"></div>
                
                <label for="tab-1" class="tab-label">General</label>
                <label for="tab-2" class="tab-label">Network</label>
                <label for="tab-3" class="tab-label">Security</label>
            </nav>
            
            <!-- Tab Content Area -->
            <div class="tab-content-wrapper">
                
                <!-- Content Panel 1 -->
                <div class="tab-panel panel-1">
                    <h3>General Settings</h3>
                    <p>Configure the basic identity of your server node.</p>
                    <div class="form-group">
                        <label>Hostname</label>
                        <input type="text" value="node-alpha-01">
                    </div>
                    <div class="form-group">
                        <label>Environment</label>
                        <select>
                            <option>Production</option>
                            <option selected>Staging</option>
                            <option>Development</option>
                        </select>
                    </div>
                </div>
                
                <!-- Content Panel 2 -->
                <div class="tab-panel panel-2">
                    <h3>Network Configuration</h3>
                    <p>Manage interface binding and routing rules.</p>
                    <div class="form-group">
                        <label>Primary Interface</label>
                        <input type="text" value="eth0">
                    </div>
                    <div class="form-group">
                        <label>IP Address Allocation</label>
                        <select>
                            <option selected>DHCP</option>
                            <option>Static (Manual)</option>
                        </select>
                    </div>
                </div>
                
                <!-- Content Panel 3 -->
                <div class="tab-panel panel-3">
                    <h3>Security Policies</h3>
                    <p>Adjust firewall rules and access control limits.</p>
                    <div class="form-group">
                        <label>Default Inbound Rule</label>
                        <select>
                            <option selected>Deny All</option>
                            <option>Allow Known Only</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>SSH Port</label>
                        <input type="text" value="2222">
                    </div>
                </div>
                
            </div>
            
        </div>
        
    </div>

</body>
</html>
