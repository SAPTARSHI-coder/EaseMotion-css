<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Quantum Superposition Loader</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <div class="quantum" role="status" aria-label="Loading">
      <span class="quantum__ring quantum__ring--1" aria-hidden="true"></span>
      <span class="quantum__ring quantum__ring--2" aria-hidden="true"></span>
      <span class="quantum__ring quantum__ring--3" aria-hidden="true"></span>
      <span class="quantum__core" aria-hidden="true"></span>
      <span class="quantum__electron quantum__electron--1" aria-hidden="true"></span>
      <span class="quantum__electron quantum__electron--2" aria-hidden="true"></span>
      <span class="quantum__electron quantum__electron--3" aria-hidden="true"></span>
    </div>
  </main>
</body>
</html>
