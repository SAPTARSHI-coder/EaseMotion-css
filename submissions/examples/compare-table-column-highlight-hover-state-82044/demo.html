<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compare Table Column Highlight Hover State</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section class="comparison">
      <div class="intro">
        <p class="eyebrow">Comparison</p>
        <h1>Choose the right plan</h1>
        <p>
          Hover over a column to highlight its complete set of features.
        </p>
      </div>

      <div class="table-wrapper">
        <table class="compare-table">
          <thead>
            <tr>
              <th>Feature</th>
              <th class="plan">Starter</th>
              <th class="plan featured">Pro</th>
              <th class="plan">Enterprise</th>
            </tr>
          </thead>

          <tbody>
            <tr>
              <th>Monthly price</th>
              <td>$9</td>
              <td class="featured">$29</td>
              <td>$79</td>
            </tr>
            <tr>
              <th>Projects</th>
              <td>3</td>
              <td class="featured">25</td>
              <td>Unlimited</td>
            </tr>
            <tr>
              <th>Storage</th>
              <td>5 GB</td>
              <td class="featured">50 GB</td>
              <td>500 GB</td>
            </tr>
            <tr>
              <th>Team members</th>
              <td>1</td>
              <td class="featured">10</td>
              <td>Unlimited</td>
            </tr>
            <tr>
              <th>Priority support</th>
              <td>No</td>
              <td class="featured">Yes</td>
              <td>Yes</td>
            </tr>
            <tr>
              <th>Analytics</th>
              <td>Basic</td>
              <td class="featured">Advanced</td>
              <td>Advanced</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>
</body>
</html>
