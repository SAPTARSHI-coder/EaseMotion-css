<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compare Table Column Highlight</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">
    <section class="card">
      <h1>Compare Plans</h1>
      <p class="subtitle">Hover over any plan column to highlight it.</p>

      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Feature</th>
              <th class="plan-column">
                <span>Starter</span>
                <small>$9 / month</small>
              </th>
              <th class="plan-column">
                <span>Pro</span>
                <small>$29 / month</small>
              </th>
              <th class="plan-column">
                <span>Business</span>
                <small>$59 / month</small>
              </th>
            </tr>
          </thead>

          <tbody>
            <tr>
              <th>Projects</th>
              <td class="plan-column">3</td>
              <td class="plan-column">20</td>
              <td class="plan-column">Unlimited</td>
            </tr>

            <tr>
              <th>Storage</th>
              <td class="plan-column">5 GB</td>
              <td class="plan-column">100 GB</td>
              <td class="plan-column">1 TB</td>
            </tr>

            <tr>
              <th>Analytics</th>
              <td class="plan-column">Basic</td>
              <td class="plan-column">Advanced</td>
              <td class="plan-column">Advanced</td>
            </tr>

            <tr>
              <th>Priority Support</th>
              <td class="plan-column">No</td>
              <td class="plan-column">Yes</td>
              <td class="plan-column">Yes</td>
            </tr>

            <tr>
              <th>Team Members</th>
              <td class="plan-column">1</td>
              <td class="plan-column">10</td>
              <td class="plan-column">Unlimited</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

</body>
</html>
