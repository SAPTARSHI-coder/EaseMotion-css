<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Differential Gear Split — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Differential Gear Split demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Differential Gear Split</h1>
      <p class="lede">Differential gears splitting rotation between two outputs</p>
    </header>

    <section class="ease-differential-gear-split" data-demo="differential-gear-split" aria-live="polite">
      <div class="ease-differential-gear-split__housing">
        <div class="ease-differential-gear-split__bezel">
          <div class="ease-differential-gear-split__face">
            <div class="ease-differential-gear-split__readout">
              <span class="ease-differential-gear-split__label">Differential Gear Split</span>
              <span class="ease-differential-gear-split__value">LIVE</span>
            </div>
            <div class="ease-differential-gear-split__motion" aria-hidden="true">
              <span class="ease-differential-gear-split__a"></span>
              <span class="ease-differential-gear-split__b"></span>
              <span class="ease-differential-gear-split__c"></span>
              <span class="ease-differential-gear-split__d"></span>
            </div>
            <div class="ease-differential-gear-split__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-differential-gear-split__controls">
          <button type="button" class="ease-differential-gear-split__btn primary">Engage</button>
          <button type="button" class="ease-differential-gear-split__btn">Reset</button>
          <label class="ease-differential-gear-split__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-differential-gear-split__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
