<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Pure CSS quest and mission progress tracker with checkpoints and rewards."
  >
  <title>CSS Quest Progress Bar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">
    <section class="quest" aria-labelledby="quest-title">

      <div class="quest-header">
        <div>
          <span class="eyebrow">Weekly Challenge</span>
          <h1 id="quest-title">Frontend Explorer</h1>
          <p>Complete each checkpoint to unlock your rewards.</p>
        </div>

        <div class="progress-summary" aria-label="Quest progress">
          <strong>60%</strong>
          <span>Complete</span>
        </div>
      </div>

      <div
        class="quest-progress"
        role="progressbar"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="60"
        aria-label="Quest progress: 60 percent"
      >
        <div class="progress-track">
          <div class="progress-fill"></div>
        </div>

        <ol class="checkpoints">

          <li class="checkpoint completed">
            <span class="checkpoint-dot" aria-hidden="true">✓</span>
            <span class="checkpoint-label">Start</span>
          </li>

          <li class="checkpoint completed">
            <span class="checkpoint-dot" aria-hidden="true">✓</span>
            <span class="checkpoint-label">Explore</span>
          </li>

          <li class="checkpoint active">
            <span class="checkpoint-dot" aria-hidden="true">3</span>
            <span class="checkpoint-label">Build</span>
          </li>

          <li class="checkpoint">
            <span class="checkpoint-dot" aria-hidden="true">4</span>
            <span class="checkpoint-label">Launch</span>
          </li>

        </ol>
      </div>

      <div class="quest-footer">

        <div class="reward">
          <div class="reward-icon" aria-hidden="true">★</div>

          <div>
            <span class="reward-label">Next Reward</span>
            <strong>500 XP</strong>
          </div>
        </div>

        <div class="steps">
          <strong>3 of 5</strong>
          <span>missions completed</span>
        </div>

      </div>

    </section>
  </main>

</body>
</html>
