<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minimalist Zen Task Manager | GSSoC '26</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Ambient Soft Glow Background -->
  <div class="ambient-background" aria-hidden="true">
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>
  </div>

  <main class="zen-container">
    <!-- Header Section -->
    <header class="zen-header">
      <span class="badge">Zen Component v40.5</span>
      <h1 class="title">Mindful Productivity</h1>
      <p class="subtitle">Focus on what truly matters. One intention at a time.</p>
    </header>

    <!-- Task Manager Card -->
    <section class="zen-card">
      <!-- Input Section -->
      <form id="task-form" class="task-input-wrapper">
        <input 
          type="text" 
          id="task-input" 
          placeholder="What is your focus for today?" 
          autocomplete="off"
          required 
          aria-label="New task input"
        />
        <button type="submit" class="add-btn" aria-label="Add Task">
          <span>+</span>
        </button>
      </form>

      <!-- Progress Indicator -->
      <div class="progress-section">
        <div class="progress-labels">
          <span class="progress-title">Daily Flow</span>
          <span class="progress-count" id="progress-text">0 of 0 completed</span>
        </div>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="progress-fill"></div>
        </div>
      </div>

      <!-- Task List Container -->
      <ul id="task-list" class="task-list" role="list">
        <!-- Dynamically Populated Tasks -->
      </ul>

      <!-- Empty State View -->
      <div id="empty-state" class="empty-state">
        <div class="zen-circle"></div>
        <p>Your mind is clear. Add a focus item to begin.</p>
      </div>

      <!-- Card Footer Controls -->
      <footer class="card-footer">
        <span class="items-left" id="items-left">0 items left</span>
        <button type="button" id="clear-completed" class="clear-btn">Clear Completed</button>
      </footer>
    </section>
  </main>

  <script>
    // Task State & DOM Elements
    let tasks = JSON.parse(localStorage.getItem('zen_tasks_v405')) || [
      { id: 1, text: "Morning mindfulness & meditation", completed: true },
      { id: 2, text: "Review pull requests for GSSoC '26", completed: false },
      { id: 3, text: "Design responsive Zen UI components", completed: false }
    ];

    const taskForm = document.getElementById('task-form');
    const taskInput = document.getElementById('task-input');
    const taskList = document.getElementById('task-list');
    const emptyState = document.getElementById('empty-state');
    const progressText = document.getElementById('progress-text');
    const progressFill = document.getElementById('progress-fill');
    const itemsLeft = document.getElementById('items-left');
    const clearCompletedBtn = document.getElementById('clear-completed');

    // Save to LocalStorage
    function saveTasks() {
      localStorage.setItem('zen_tasks_v405', JSON.stringify(tasks));
    }

    // Render Function
    function renderTasks() {
      taskList.innerHTML = '';

      if (tasks.length === 0) {
        emptyState.style.display = 'flex';
      } else {
        emptyState.style.display = 'none';
      }

      let completedCount = 0;

      tasks.forEach(task => {
        if (task.completed) completedCount++;

        const li = document.createElement('li');
        li.className = `task-item ${task.completed ? 'completed' : ''}`;
        li.setAttribute('data-id', task.id);

        li.innerHTML = `
          <label class="checkbox-container">
            <input type="checkbox" ${task.completed ? 'checked' : ''} aria-label="Toggle task completion" />
            <span class="checkmark"></span>
          </label>
          <span class="task-text">${escapeHTML(task.text)}</span>
          <button class="delete-btn" aria-label="Delete Task">&times;</button>
        `;

        // Checkbox Toggle Event
        const checkbox = li.querySelector('input[type="checkbox"]');
        checkbox.addEventListener('change', () => toggleTask(task.id));

        // Delete Event
        const deleteBtn = li.querySelector('.delete-btn');
        deleteBtn.addEventListener('click', () => deleteTask(task.id));

        taskList.appendChild(li);
      });

      // Update Progress & Counts
      const total = tasks.length;
      const activeCount = total - completedCount;
      const percentage = total === 0 ? 0 : Math.round((completedCount / total) * 100);

      progressText.textContent = `${completedCount} of ${total} completed`;
      progressFill.style.width = `${percentage}%`;
      itemsLeft.textContent = `${activeCount} item${activeCount === 1 ? '' : 's'} left`;

      saveTasks();
    }

    // Helper: Prevent XSS
    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }

    // Task Actions
    function addTask(text) {
      const newTask = { id: Date.now(), text, completed: false };
      tasks.unshift(newTask);
      renderTasks();
    }

    function toggleTask(id) {
      tasks = tasks.map(t => t.id === id ? { ...t, completed: !t.completed } : t);
      renderTasks();
    }

    function deleteTask(id) {
      tasks = tasks.filter(t => t.id !== id);
      renderTasks();
    }

    // Event Listeners
    taskForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const val = taskInput.value.trim();
      if (val) {
        addTask(val);
        taskInput.value = '';
      }
    });

    clearCompletedBtn.addEventListener('click', () => {
      tasks = tasks.filter(t => !t.completed);
      renderTasks();
    });

    // Initial Render
    renderTasks();
  </script>
</body>
</html>
