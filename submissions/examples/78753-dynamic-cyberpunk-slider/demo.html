<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Responsive dynamic cyberpunk slider built with pure HTML and CSS"
  >
  <title>Dynamic Cyberpunk Slider</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="page">
    <section class="slider-shell" aria-labelledby="slider-title">
      <div class="grid-overlay"></div>
      <div class="scanline"></div>

      <header class="slider-header">
        <div>
          <span class="system-label">SYSTEM // 19769</span>
          <h1 id="slider-title">CYBER RANGE</h1>
          <p>
            Tune the interface intensity and explore a futuristic
            cyberpunk control.
          </p>
        </div>

        <span class="status">
          <span class="status-dot" aria-hidden="true"></span>
          ONLINE
        </span>
      </header>

      <div class="slider-panel">
        <div class="value-row">
          <span class="value-label">POWER LEVEL</span>
          <output class="value-display" for="power">
            72%
          </output>
        </div>

        <div class="slider-track">
          <div class="track-glow"></div>

          <input
            id="power"
            class="cyber-slider"
            type="range"
            min="0"
            max="100"
            value="72"
            aria-label="Power level"
          />
        </div>

        <div class="scale" aria-hidden="true">
          <span>00</span>
          <span>20</span>
          <span>40</span>
          <span>60</span>
          <span>80</span>
          <span>100</span>
        </div>

        <div class="telemetry">
          <div class="telemetry-item">
            <span>CORE</span>
            <strong>72.4</strong>
          </div>

          <div class="telemetry-item">
            <span>VOLT</span>
            <strong>084V</strong>
          </div>

          <div class="telemetry-item">
            <span>SYNC</span>
            <strong>99.8%</strong>
          </div>
        </div>
      </div>

      <footer class="slider-footer">
        <span>NEURAL INTERFACE</span>
        <span>INPUT // RANGE</span>
        <span>NO JS REQUIRED</span>
      </footer>
    </section>
  </main>
</body>
</html>
