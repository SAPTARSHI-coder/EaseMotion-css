<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      name="description"
      content="Morphing glassmorphism input field built with HTML and CSS."
    />

    <title>Morphing Glass Input | EaseMotion CSS</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="page">
      <div class="ambient ambient-one"></div>
      <div class="ambient ambient-two"></div>

      <section class="demo-card">
        <div class="intro">
          <span class="eyebrow">EaseMotion CSS</span>

          <h1>Morphing Input Field</h1>

          <p>
            A responsive glassmorphism input with a floating label,
            animated focus state, and subtle depth.
          </p>
        </div>

        <form class="input-form">
          <div class="field-group">
            <label class="field">
              <input
                type="text"
                name="name"
                placeholder=" "
                autocomplete="name"
                required
              />

              <span class="field-label">
                Full name
              </span>

              <span class="field-icon" aria-hidden="true">
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  xmlns="http://www.w3.org/2000/svg"
                >
                  <path
                    d="M20 21C20 17.6863 17.3137 15 14 15H10C6.68629 15 4 17.6863 4 21"
                    stroke="currentColor"
                    stroke-width="1.7"
                    stroke-linecap="round"
                  />
                  <circle
                    cx="12"
                    cy="7"
                    r="4"
                    stroke="currentColor"
                    stroke-width="1.7"
                  />
                </svg>
              </span>
            </label>
          </div>

          <div class="field-group">
            <label class="field">
              <input
                type="email"
                name="email"
                placeholder=" "
                autocomplete="email"
                required
              />

              <span class="field-label">
                Email address
              </span>

              <span class="field-icon" aria-hidden="true">
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  xmlns="http://www.w3.org/2000/svg"
                >
                  <rect
                    x="3"
                    y="5"
                    width="18"
                    height="14"
                    rx="2"
                    stroke="currentColor"
                    stroke-width="1.7"
                  />
                  <path
                    d="M4 7L12 13L20 7"
                    stroke="currentColor"
                    stroke-width="1.7"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
              </span>
            </label>
          </div>

          <div class="field-group">
            <label class="field field-message">
              <textarea
                name="message"
                placeholder=" "
                rows="4"
              ></textarea>

              <span class="field-label">
                Your message
              </span>

              <span class="field-icon" aria-hidden="true">
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  xmlns="http://www.w3.org/2000/svg"
                >
                  <path
                    d="M20 11.5C20 16.1944 16.1944 20 11.5 20C9.99925 20 8.59306 19.6117 7.37 18.9327L4 20L5.06732 16.63C4.3883 15.4069 4 14.0008 4 12.5C4 7.80558 7.80558 4 12.5 4C17.1944 4 20 7.80558 20 11.5Z"
                    stroke="currentColor"
                    stroke-width="1.7"
                    stroke-linejoin="round"
                  />
                </svg>
              </span>
            </label>
          </div>

          <button class="submit-button" type="submit">
            <span>Continue</span>

            <svg
              viewBox="0 0 24 24"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
              aria-hidden="true"
            >
              <path
                d="M5 12H19"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
              />
              <path
                d="M13 6L19 12L13 18"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
        </form>

        <p class="helper-text">
          Your information stays private and secure.
        </p>
      </section>
    </main>
  </body>
</html>
