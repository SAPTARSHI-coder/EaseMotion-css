<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Glitch-Flicker Card Grid - EaseMotion CSS</title>
  <!-- Import EaseMotion CSS -->
  <link rel="stylesheet" href="../../../easemotion.css">
  <!-- Component Specific Styles -->
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
</head>
<body class="cyber-checkout-bg">

  <div class="demo-container">
    
    <div class="checkout-panel ease-glass-card">
      <div class="checkout-header">
        <h2 class="glitch-title" data-text="PAYMENT_GATEWAY">PAYMENT_GATEWAY</h2>
        <p class="ease-color-muted">SECURE CONNECTION ESTABLISHED.</p>
      </div>

      <!-- Glitch-Flicker Card Grid (Pure CSS Radio Group) -->
      <div class="card-grid glitch-flicker-grid">
        
        <!-- Card 1 -->
        <label class="grid-card-label" tabindex="0">
          <input type="radio" name="payment_method" class="card-radio" value="credit" checked>
          <div class="card-content">
            <div class="glitch-overlay"></div>
            <div class="card-icon">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect><line x1="1" y1="10" x2="23" y2="10"></line></svg>
            </div>
            <div class="card-text">
              <h3 class="card-title">FIAT_CREDIT</h3>
              <p class="card-desc">Standard Card Payment</p>
            </div>
            <div class="card-indicator"></div>
          </div>
        </label>

        <!-- Card 2 -->
        <label class="grid-card-label" tabindex="0">
          <input type="radio" name="payment_method" class="card-radio" value="crypto">
          <div class="card-content">
            <div class="glitch-overlay"></div>
            <div class="card-icon">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M12 2v20"></path><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
            </div>
            <div class="card-text">
              <h3 class="card-title">CRYPTO_NET</h3>
              <p class="card-desc">BTC, ETH, USDC</p>
            </div>
            <div class="card-indicator"></div>
          </div>
        </label>

        <!-- Card 3 -->
        <label class="grid-card-label" tabindex="0">
          <input type="radio" name="payment_method" class="card-radio" value="paypal">
          <div class="card-content">
            <div class="glitch-overlay"></div>
            <div class="card-icon">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M7.144 21.154l3.111-19.646h9.123c3.084 0 5.483 1.259 5.483 4.887 0 4.148-2.613 7.82-7.551 7.82h-3.693l-1.396 8.814h-5.077z"></path></svg>
            </div>
            <div class="card-text">
              <h3 class="card-title">PAYPAL_LINK</h3>
              <p class="card-desc">Express Checkout</p>
            </div>
            <div class="card-indicator"></div>
          </div>
        </label>

        <!-- Card 4 -->
        <label class="grid-card-label" tabindex="0">
          <input type="radio" name="payment_method" class="card-radio" value="gift">
          <div class="card-content">
            <div class="glitch-overlay"></div>
            <div class="card-icon">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><rect x="3" y="8" width="18" height="13" rx="2" ry="2"></rect><line x1="12" y1="8" x2="12" y2="21"></line><path d="M19 16v-3a2 2 0 0 0-2-2h-3l3-3a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2l3 3H6a2 2 0 0 0-2 2v3"></path></svg>
            </div>
            <div class="card-text">
              <h3 class="card-title">CREDIT_CODE</h3>
              <p class="card-desc">Gift Card / Promo</p>
            </div>
            <div class="card-indicator"></div>
          </div>
        </label>

      </div>

      <div class="checkout-footer">
        <button class="continue-btn ease-squish-button">INITIATE_TRANSFER</button>
      </div>
    </div>

  </div>

</body>
</html>
