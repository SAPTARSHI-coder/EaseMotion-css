<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neumorphic Slider with Minimalist Styling | EaseMotion CSS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="slider-card">
        <div class="slider-header">
            <h3 class="slider-title">Volume Level</h3>
            <span class="slider-value">75%</span>
        </div>
        <input type="range" min="0" max="100" value="75" class="neumorphic-slider" aria-label="Volume Level Slider">
    </div>
</body>
</html>
