<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animated Radio Button - EaseMotion CSS Submission</title>
  
  <!-- EaseMotion CSS (Official CDN) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css">
  
  <!-- Local Radio Component Styles -->
  <link rel="stylesheet" href="style.css">
  
  <style>
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: var(--ease-color-bg, #f8fafc);
      color: var(--ease-color-text, #0f172a);
      margin: 0;
      padding: 2rem;
      gap: 3rem;
    }
    .demo-container {
      width: 100%;
      max-width: 700px;
    }
    .demo-section {
      margin-bottom: 3rem;
    }
    .demo-title {
      font-size: 1.125rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
      color: var(--ease-color-text, #0f172a);
    }
    .demo-card {
      background-color: var(--ease-color-surface, #ffffff);
      border-radius: var(--ease-radius-lg, 12px);
      padding: 2rem;
      box-shadow: var(--ease-shadow-md, 0 4px 6px -1px rgba(0, 0, 0, 0.1));
      border: 1px solid var(--ease-color-border, #e2e8f0);
    }
    .radio-group {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .radio-row {
      display: flex;
      flex-wrap: wrap;
      gap: 1.5rem;
    }
  </style>
</head>
<body>

  <div class="ease-center ease-fade-in" style="text-align: center;">
    <h1 class="ease-slide-up">Animated Radio Button Component</h1>
    <p class="ease-slide-up ease-delay-100" style="color: var(--ease-color-text-muted, #64748b); max-width: 500px;">
      Zero JavaScript. Pure CSS radio buttons with smooth selection animations and group behavior.
    </p>
  </div>

  <!-- Default Radio Buttons -->
  <div class="demo-container demo-section ease-fade-in ease-delay-200">
    <h2 class="demo-title">Default Radio Buttons</h2>
    <div class="demo-card">
      <div class="radio-group">
        <label class="ease-radio-xyz">
          <input type="radio" name="default-group" value="option1">
          <span class="ease-radio-xyz-custom"></span>
          <span class="ease-radio-xyz-label">Option 1</span>
        </label>

        <label class="ease-radio-xyz">
          <input type="radio" name="default-group" value="option2" checked>
          <span class="ease-radio-xyz-custom"></span>
          <span class="ease-radio-xyz-label">Option 2 (Selected)</span>
        </label>

        <label class="ease-radio-xyz">
          <input type="radio" name="default-group" value="option3">
          <span class="ease-radio-xyz-custom"></span>
          <span class="ease-radio-xyz-label">Option 3</span>
        </label>

        <label class="ease-radio-xyz">
          <input type="radio" name="default-group" value="option4" disabled>
          <span class="ease-radio-xyz-custom"></span>
          <span class="ease-radio-xyz-label">Disabled option</span>
        </label>
      </div>
    </div>
  </div>

  <!-- Color Variants -->
  <div class="demo-container demo-section ease-fade-in ease-delay-300">
    <h2 class="demo-title">Color Variants</h2>
    <div class="demo-card">
      <div class="radio-row">
        <label class="ease-radio-xyz ease-radio-xyz-primary">
          <input type="radio" name="color-group-1" value="primary" checked>
          <span class="ease-radio-xyz-custom"></span>
          <span class="ease-radio-xyz-label">Primary</span>
        </label>

        <label class="ease-radio-xyz ease-radio-xyz-success">
          <input type="radio" name="color-group-2" value="success" checked>
          <span class="ease-radio-xyz-custom"></span>
          <span class="ease-radio-xyz-label">Success</span>
        </label>

        <label class="ease-radio-xyz ease-radio-xyz-error">
          <input type="radio" name="color-group-3" value="error" checked>
          <span class="ease-radio-xyz-custom"></span>
          <span class="ease-radio-xyz-label">Error</span>
        </label>

        <label class="ease-radio-xyz ease-radio-xyz-warning">
          <input type="radio" name="color-group-4" value="warning" checked>
          <span class="ease-radio-xyz-custom"></span>
          <span class="ease-radio-xyz-label">Warning</span>
        </label>
      </div>
    </div>
  </div>

  <!-- Size Variants -->
  <div class="demo-container demo-section ease-fade-in ease-delay-400">
    <h2 class="demo-title">Size Variants</h2>
    <div class="demo-card">
      <div class="radio-group">
        <label class="ease-radio-xyz ease-radio-xyz-sm">
          <input type="radio" name="size-group" value="small" checked>
          <span class="ease-radio-xyz-custom"></span>
          <span class="ease-radio-xyz-label">Small radio button</span>
        </label>

        <label class="ease-radio-xyz">
          <input type="radio" name="size-group" value="default" checked>
          <span class="ease-radio-xyz-custom"></span>
          <span class="ease-radio-xyz-label">Default radio button</span>
        </label>

        <label class="ease-radio-xyz ease-radio-xyz-lg">
          <input type="radio" name="size-group" value="large" checked>
          <span class="ease-radio-xyz-custom"></span>
          <span class="ease-radio-xyz-label">Large radio button</span>
        </label>
      </div>
    </div>
  </div>

  <!-- Card Style -->
  <div class="demo-container demo-section ease-fade-in ease-delay-500">
    <h2 class="demo-title">Card Style (Selectable Cards)</h2>
    <div class="demo-card">
      <div class="radio-row">
        <label class="ease-radio-xyz ease-radio-xyz-card">
          <input type="radio" name="plan-group" value="basic">
          <div class="ease-radio-xyz-card-content">
            <span class="ease-radio-xyz-custom"></span>
            <div>
              <div class="ease-radio-xyz-card-title">Basic Plan</div>
              <div class="ease-radio-xyz-card-desc">$9/month</div>
            </div>
          </div>
        </label>

        <label class="ease-radio-xyz ease-radio-xyz-card">
          <input type="radio" name="plan-group" value="pro" checked>
          <div class="ease-radio-xyz-card-content">
            <span class="ease-radio-xyz-custom"></span>
            <div>
              <div class="ease-radio-xyz-card-title">Pro Plan</div>
              <div class="ease-radio-xyz-card-desc">$29/month</div>
            </div>
          </div>
        </label>

        <label class="ease-radio-xyz ease-radio-xyz-card">
          <input type="radio" name="plan-group" value="enterprise">
          <div class="ease-radio-xyz-card-content">
            <span class="ease-radio-xyz-custom"></span>
            <div>
              <div class="ease-radio-xyz-card-title">Enterprise</div>
              <div class="ease-radio-xyz-card-desc">$99/month</div>
            </div>
          </div>
        </label>
      </div>
    </div>
  </div>

  <!-- Button Group Style -->
  <div class="demo-container demo-section ease-fade-in ease-delay-600">
    <h2 class="demo-title">Button Group Style</h2>
    <div class="demo-card">
      <div class="ease-radio-xyz-button-group">
        <label class="ease-radio-xyz-button">
          <input type="radio" name="view-group" value="list">
          <span>List View</span>
        </label>
        <label class="ease-radio-xyz-button">
          <input type="radio" name="view-group" value="grid" checked>
          <span>Grid View</span>
        </label>
        <label class="ease-radio-xyz-button">
          <input type="radio" name="view-group" value="map">
          <span>Map View</span>
        </label>
      </div>
    </div>
  </div>

</body>
</html>
