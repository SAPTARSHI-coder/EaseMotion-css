<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EaseMotion — Popover Tooltip</title>
  <link rel="stylesheet" href="../../core/variables.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="demo-container">
    <h1>Popover Tooltip</h1>
    <p>Hover or focus elements to see contextual tooltips.</p>

    <div class="popover-card">
      <div class="popover-row">
        <button class="popover-trigger" data-tooltip="This is a tooltip on top" data-pos="top">Hover Top</button>
        <button class="popover-trigger" data-tooltip="This is a tooltip on bottom" data-pos="bottom">Hover Bottom</button>
      </div>
      <div class="popover-row">
        <button class="popover-trigger" data-tooltip="Left-aligned tooltip content" data-pos="left">Hover Left</button>
        <button class="popover-trigger" data-tooltip="Right-aligned tooltip content" data-pos="right">Hover Right</button>
      </div>
    </div>
  </div>
  <script>
    document.querySelectorAll('.popover-trigger').forEach(btn => {
      btn.addEventListener('mouseenter', showTooltip);
      btn.addEventListener('mouseleave', hideTooltip);
      btn.addEventListener('focus', showTooltip);
      btn.addEventListener('blur', hideTooltip);
    });

    function showTooltip(e) {
      const text = e.target.dataset.tooltip;
      const tip = document.createElement('div');
      tip.className = 'tooltip ' + (e.target.dataset.pos || 'top');
      tip.textContent = text;
      document.body.appendChild(tip);
      const rect = e.target.getBoundingClientRect();
      tip.style.left = rect.left + rect.width / 2 - tip.offsetWidth / 2 + 'px';
      if (e.target.dataset.pos === 'bottom') tip.style.top = rect.bottom + 8 + 'px';
      else tip.style.top = rect.top - tip.offsetHeight - 8 + 'px';
      requestAnimationFrame(() => tip.classList.add('show'));
      e.target._tooltip = tip;
    }

    function hideTooltip(e) {
      if (e.target._tooltip) {
        e.target._tooltip.remove();
        e.target._tooltip = null;
      }
    }
  </script>
</body>
</html>
