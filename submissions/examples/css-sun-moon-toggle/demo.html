<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pure CSS Sun/Moon Theme Toggle Animation</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: #87CEEB; /* Sky blue (Sun state) */
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: #333;
      transition: background-color 0.4s ease, color 0.4s ease;
    }

    .theme-container {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: -1;
      background-color: #87CEEB;
      transition: background-color 0.4s ease;
    }
    
    .ease-theme-toggle:checked ~ .theme-container {
      background-color: #2c3e50; /* Night sky (Moon state) */
    }

    .demo-content {
      text-align: center;
      padding: 2rem;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
    
    .ease-theme-toggle:checked ~ .demo-content {
      color: #ecf0f1;
      border-color: rgba(255, 255, 255, 0.1);
    }
    
    .ease-theme-toggle:checked ~ .demo-content h2 {
      color: #ecf0f1;
    }
    
    h2 {
      margin-top: 0;
      font-weight: 300;
    }
  </style>
</head>
<body>

  <!-- The hidden checkbox input -->
  <input type="checkbox" id="theme-switch" class="ease-theme-toggle">
  
  <!-- For demo purposes to switch background -->
  <div class="theme-container"></div>

  <!-- The demo content container -->
  <div class="demo-content">
    <h2>Toggle Theme</h2>
    
    <!-- The label acts as the button -->
    <label for="theme-switch" class="ease-theme-toggle-label">
      <div class="ease-theme-toggle-icon"></div>
    </label>
  </div>

</body>
</html>
