<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Pure CSS balloon inflate and float loading animation"
  >

  <title>Balloon Inflate Loader</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="loader-page">
    <section
      class="balloon-loader"
      aria-label="Loading"
      role="status"
    >
      <div class="scene" aria-hidden="true">
        <div class="balloon">
          <span class="balloon-highlight"></span>
          <span class="balloon-knot"></span>
          <span class="balloon-string"></span>
        </div>

        <div class="ground-shadow"></div>
      </div>

      <p class="loading-text">
        Loading<span class="dots" aria-hidden="true">...</span>
      </p>
    </section>
  </main>
</body>
</html>
