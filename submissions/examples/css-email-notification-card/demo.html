<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Accessible CSS email notification card with sender avatar and preview"
  >
  <title>CSS Email Notification Card</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="page">
    <article
      class="email-card"
      tabindex="0"
      aria-label="Email notification from Sarah Johnson"
    >
      <div class="avatar" aria-hidden="true">
        SJ
      </div>

      <div class="email-content">
        <div class="email-header">
          <div>
            <h1>Sarah Johnson</h1>
            <p class="email-address">sarah@example.com</p>
          </div>

          <time datetime="2026-08-11T10:30">
            10:30 AM
          </time>
        </div>

        <h2>Project Update</h2>

        <p class="preview">
          Hi! I wanted to share the latest updates on our project.
          Everything is progressing well and we're almost ready...
        </p>

        <div class="email-footer">
          <span class="badge">New</span>
          <button type="button" aria-label="Mark email as read">
            Mark as read
          </button>
        </div>
      </div>
    </article>
  </main>
</body>
</html>
