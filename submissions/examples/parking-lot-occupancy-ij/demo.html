<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-parking-lot-occupancy</title>
</head>
<body>
<main class="plo-lot">
  <header class="plo-top">
    <h1 class="plo-title">Lot B</h1>
    <span class="plo-hours">Open 24h</span>
  </header>
  <section class="plo-gate" aria-label="entry gate">
    <span class="plo-arm"></span>
  </section>
  <section class="plo-grid" aria-label="parking spaces">
    <span class="plo-space plo-free">P1</span>
    <span class="plo-space plo-used">P2</span>
    <span class="plo-space plo-free">P3</span>
    <span class="plo-space plo-free">P4</span>
    <span class="plo-space plo-used">P5</span>
    <span class="plo-space plo-free">P6</span>
    <span class="plo-space plo-used">P7</span>
    <span class="plo-space plo-free">P8</span>
    <span class="plo-space plo-used">P9</span>
    <span class="plo-space plo-free">P10</span>
    <span class="plo-space plo-free">P11</span>
    <span class="plo-space plo-used">P12</span>
  </section>
  <footer class="plo-foot">
    <span class="plo-count">7 free</span>
    <span class="plo-total">of 12</span>
  </footer>
</main>
</body>
</html>
