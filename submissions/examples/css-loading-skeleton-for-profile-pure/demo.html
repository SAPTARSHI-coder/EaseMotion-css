<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Loading Skeleton for Profile</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="layout-container">
        
        <header class="section-header">
            <h1 class="title">Profile Loading Skeleton</h1>
            <p class="subtitle">A pure CSS skeleton loader matching the layout of a standard user profile card. Uses animated linear gradients to create a shimmering loading state.</p>
        </header>

        <div class="demo-area">
            
            <!-- 
              [TECHNIQUE] The Skeleton Layout
              We build a mock card that perfectly mirrors the layout of the real 
              data card, but replace all text/images with empty div 'bones' 
              that have the .skeleton utility class applied.
            -->
            
            <div class="profile-card" aria-busy="true" aria-live="polite" aria-label="Loading user profile...">
                
                <!-- Skeleton Avatar -->
                <div class="profile-header">
                    <div class="skeleton skeleton-avatar"></div>
                </div>
                
                <!-- Skeleton Text Block -->
                <div class="profile-body">
                    <!-- Title usually has a specific width -->
                    <div class="skeleton skeleton-text skeleton-title"></div>
                    
                    <!-- Subtitle/Description lines -->
                    <div class="skeleton skeleton-text skeleton-line"></div>
                    <div class="skeleton skeleton-text skeleton-line short"></div>
                </div>
                
                <!-- Skeleton Action Buttons -->
                <div class="profile-footer">
                    <div class="skeleton skeleton-button"></div>
                    <div class="skeleton skeleton-button"></div>
                </div>
                
            </div>
            
        </div>
        
    </div>

</body>
</html>
