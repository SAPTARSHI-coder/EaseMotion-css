<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-stock-ticker-tape demo</title>
</head>
<body>
<div class="st-app">
  <span class="st-header">MARKET PULSE</span>
  <div class="st-index">
    <span class="st-index-name">S&P 500</span>
    <span class="st-index-val">5,612.40</span>
    <span class="st-index-chg st-up">+0.84%</span>
  </div>
  <div class="st-tape">
    <div class="st-runs">
      <div class="st-run">
        <span class="st-quote"><span class="st-symbol">AAPL</span><span class="st-price">242.10</span><span class="st-change st-up">+1.20</span></span>
        <span class="st-quote"><span class="st-symbol">TSLA</span><span class="st-price">331.80</span><span class="st-change st-down">-2.40</span></span>
        <span class="st-quote"><span class="st-symbol">NVDA</span><span class="st-price">141.30</span><span class="st-change st-up">+0.95</span></span>
        <span class="st-quote"><span class="st-symbol">MSFT</span><span class="st-price">488.60</span><span class="st-change st-up">+0.32</span></span>
        <span class="st-quote"><span class="st-symbol">AMZN</span><span class="st-price">221.50</span><span class="st-change st-down">-1.05</span></span>
        <span class="st-quote"><span class="st-symbol">GOOG</span><span class="st-price">186.90</span><span class="st-change st-up">+0.60</span></span>
        <span class="st-quote"><span class="st-symbol">META</span><span class="st-price">512.70</span><span class="st-change st-up">+1.85</span></span>
      </div>
      <div class="st-run">
        <span class="st-quote"><span class="st-symbol">AAPL</span><span class="st-price">242.10</span><span class="st-change st-up">+1.20</span></span>
        <span class="st-quote"><span class="st-symbol">TSLA</span><span class="st-price">331.80</span><span class="st-change st-down">-2.40</span></span>
        <span class="st-quote"><span class="st-symbol">NVDA</span><span class="st-price">141.30</span><span class="st-change st-up">+0.95</span></span>
        <span class="st-quote"><span class="st-symbol">MSFT</span><span class="st-price">488.60</span><span class="st-change st-up">+0.32</span></span>
        <span class="st-quote"><span class="st-symbol">AMZN</span><span class="st-price">221.50</span><span class="st-change st-down">-1.05</span></span>
        <span class="st-quote"><span class="st-symbol">GOOG</span><span class="st-price">186.90</span><span class="st-change st-up">+0.60</span></span>
        <span class="st-quote"><span class="st-symbol">META</span><span class="st-price">512.70</span><span class="st-change st-up">+1.85</span></span>
      </div>
    </div>
  </div>
  <span class="st-foot">DELAYED 15 MIN</span>
</div>
</body>
</html>
