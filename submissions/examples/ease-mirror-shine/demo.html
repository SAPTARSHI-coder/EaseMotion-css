<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mirror Shine – Mirror Reflects and Shines Dynamically</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <h1>🪞 Mirror Shine</h1>
    <p class="subtitle">Mirror reflects and shines dynamically</p>

    <div class="mirror-container">
      <div class="mirror-stage" id="mirrorStage">
        <!-- Mirror surface -->
        <div class="mirror-surface" id="mirrorSurface">
          <div class="mirror-reflection" id="mirrorReflection"></div>
          <div class="mirror-shine" id="mirrorShine"></div>
          <div class="mirror-sparkles" id="mirrorSparkles"></div>
          <div class="mirror-edge"></div>
          <div class="mirror-label" id="mirrorLabel">
            <span class="label-icon">🪞</span>
            <span class="label-text">Mirror</span>
          </div>
        </div>

        <!-- Info overlay -->
        <div class="info-overlay">
          <span class="mirror-status" id="mirrorStatus">✨ Shining</span>
          <span class="shine-intensity" id="shineIntensity">Intensity: 80%</span>
        </div>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <button class="ctrl-btn toggle" id="toggleBtn">💡 Toggle</button>
      <button class="ctrl-btn reset" id="resetBtn">↺ Reset</button>
      <button class="ctrl-btn sparkle" id="sparkleBtn">✨ Sparkle</button>
    </div>

    <!-- Sliders -->
    <div class="slider-container">
      <span class="slider-label">Shine Intensity</span>
      <input type="range" id="intensitySlider" min="0" max="100" value="80" />
      <span class="slider-value" id="intensityValue">80%</span>
    </div>

    <div class="slider-container">
      <span class="slider-label">Light Angle</span>
      <input type="range" id="angleSlider" min="0" max="360" value="45" />
      <span class="slider-value" id="angleValue">45°</span>
    </div>

    <div class="slider-container">
      <span class="slider-label">Reflection Clarity</span>
      <input type="range" id="claritySlider" min="0" max="100" value="70" />
      <span class="slider-value" id="clarityValue">70%</span>
    </div>

    <!-- Status -->
    <div class="status" id="status">🪞 Move your cursor across the mirror to see it shine</div>

    <!-- Keyboard shortcuts -->
    <div class="shortcuts">
      <kbd>Mouse</kbd> Shine · <kbd>T</kbd> Toggle · <kbd>R</kbd> Reset · <kbd>S</kbd> Sparkle
    </div>
  </div>

  <script>
    (function() {
      "use strict";

      // DOM elements
      const mirrorStage = document.getElementById('mirrorStage');
      const mirrorSurface = document.getElementById('mirrorSurface');
      const mirrorReflection = document.getElementById('mirrorReflection');
      const mirrorShine = document.getElementById('mirrorShine');
      const mirrorSparkles = document.getElementById('mirrorSparkles');
      const mirrorLabel = document.getElementById('mirrorLabel');
      const mirrorStatus = document.getElementById('mirrorStatus');
      const shineIntensity = document.getElementById('shineIntensity');
      const toggleBtn = document.getElementById('toggleBtn');
      const resetBtn = document.getElementById('resetBtn');
      const sparkleBtn = document.getElementById('sparkleBtn');
      const status = document.getElementById('status');
      const intensitySlider = document.getElementById('intensitySlider');
      const intensityValue = document.getElementById('intensityValue');
      const angleSlider = document.getElementById('angleSlider');
      const angleValue = document.getElementById('angleValue');
      const claritySlider = document.getElementById('claritySlider');
      const clarityValue = document.getElementById('clarityValue');

      // State
      let isActive = true;
      let mouseX = 0;
      let mouseY = 0;
      let isMouseOnStage = false;
      let animationId = null;
      let time = 0;
      let sparkles = [];

      // ----- Create sparkles -----
      function createSparkles(count = 20) {
        const container = mirrorSparkles;
        container.innerHTML = '';
        sparkles = [];

        for (let i = 0; i < count; i++) {
          const sparkle = document.createElement('div');
          sparkle.className = 'sparkle';
          const size = 2 + Math.random() * 4;
          const x = Math.random() * 100;
          const y = Math.random() * 100;
          const delay = Math.random() * 3;
          const duration = 1 + Math.random() * 2;
          const opacity = 0.2 + Math.random() * 0.6;

          sparkle.style.width = size + 'px';
          sparkle.style.height = size + 'px';
          sparkle.style.left = x + '%';
          sparkle.style.top = y + '%';
          sparkle.style.animationDelay = delay + 's';
          sparkle.style.animationDuration = duration + 's';
          sparkle.style.opacity = opacity;
          sparkle.style.background = `radial-gradient(circle, 
            rgba(255,255,255,${opacity}), 
            rgba(200,220,255,${opacity * 0.3})
          )`;
          sparkle.style.boxShadow = `0 0 ${size * 3}px rgba(200,220,255,${opacity * 0.2})`;

          container.appendChild(sparkle);
          sparkles.push({ element: sparkle, x, y, size, delay, duration, opacity });
        }
      }

      // ----- Update mirror shine -----
      function updateMirror() {
        const intensity = parseInt(intensitySlider.value) / 100;
        const angle = parseInt(angleSlider.value);
        const clarity = parseInt(claritySlider.value) / 100;

        // Update shine based on mouse position
        const rect = mirrorStage.getBoundingClientRect();
        const w = mirrorStage.clientWidth || 600;
        const h = mirrorStage.clientHeight || 450;

        // Normalize mouse position (0-1)
        const nx = isMouseOnStage ? (mouseX - rect.left) / rect.width : 0.5;
        const ny = isMouseOnStage ? (mouseY - rect.top) / rect.height : 0.5;
        const clampedX = Math.max(0, Math.min(1, nx));
        const clampedY = Math.max(0, Math.min(1, ny));

        // Calculate shine position (mirror reflection effect)
        const shineX = (1 - clampedX) * 100;
        const shineY = (1 - clampedY) * 100;

        // Apply rotation
        const rad = (angle / 180) * Math.PI;

        // Update shine gradient
        const shineOpacity = isActive ? intensity * 0.6 : 0;
        const shineSize = 30 + intensity * 70;

        mirrorShine.style.background = `
          radial-gradient(
            ellipse at ${shineX}% ${shineY}%,
            rgba(255, 255, 255, ${shineOpacity * 0.8}),
            rgba(200, 220, 255, ${shineOpacity * 0.3}),
            transparent ${shineSize}%
          )
        `;
        mirrorShine.style.opacity = isActive ? 1 : 0;

        // Update reflection
        const reflectionOpacity = isActive ? 0.1 + clarity * 0.3 : 0;
        mirrorReflection.style.opacity = reflectionOpacity;
        mirrorReflection.style.background = `
          radial-gradient(
            ellipse at ${50 - (clampedX - 0.5) * 30}% ${50 - (clampedY - 0.5) * 30}%,
            rgba(200, 220, 255, ${0.05 + clarity * 0.1}),
            rgba(100, 150, 255, ${0.02 + clarity * 0.05}),
            transparent 70%
          )
        `;
        mirrorReflection.style.transform = `rotate(${angle}deg)`;

        // Update mirror surface
        const surfaceOpacity = 0.1 + clarity * 0.2;
        mirrorSurface.style.background = `
          linear-gradient(
            ${angle + 45}deg,
            rgba(200, 220, 255, ${surfaceOpacity * 0.5}),
            rgba(180, 200, 240, ${surfaceOpacity * 0.3}),
            rgba(200, 220, 255, ${surfaceOpacity * 0.4})
          )
        `;

        // Update label
        const labelOpacity = isActive ? 0.3 + intensity * 0.3 : 0.1;
        mirrorLabel.style.opacity = labelOpacity;

        // Update status
        mirrorStatus.textContent = isActive ? '✨ Shining' : '🌑 Dark';
        shineIntensity.textContent = `Intensity: ${Math.round(intensity * 100)}%`;
        status.textContent = isActive ? '🪞 Mirror reflecting and shining' : '🌑 Mirror is dark';

        // Update sparkles
        const sparkleOpacity = isActive ? intensity * 0.5 : 0;
        mirrorSparkles.style.opacity = sparkleOpacity;
      }

      // ----- Animation loop -----
      function animate() {
        time += 0.016;
        updateMirror();
        animationId = requestAnimationFrame(animate);
      }

      // ----- Start animation -----
      function startAnimation() {
        if (animationId) {
          cancelAnimationFrame(animationId);
        }
        animate();
      }

      // ----- Toggle -----
      function toggleMirror() {
        isActive = !isActive;
        toggleBtn.textContent = isActive ? '💡 Toggle' : '💡 Off';
        status.textContent = isActive ? '🪞 Mirror activated' : '🌑 Mirror deactivated';
      }

      // ----- Reset -----
      function resetMirror() {
        isActive = true;
        toggleBtn.textContent = '💡 Toggle';
        intensitySlider.value = 80;
        intensityValue.textContent = '80%';
        angleSlider.value = 45;
        angleValue.textContent = '45°';
        claritySlider.value = 70;
        clarityValue.textContent = '70%';
        status.textContent = '↺ Reset';
        setTimeout(() => {
          status.textContent = '🪞 Move your cursor across the mirror to see it shine';
        }, 500);
        createSparkles(25);
      }

      // ----- Sparkle burst -----
      function sparkleBurst() {
        if (!isActive) return;
        createSparkles(40 + Math.floor(Math.random() * 30));
        status.textContent = '✨ Sparkle burst!';
        setTimeout(() => {
          status.textContent = '🪞 Move your cursor across the mirror to see it shine';
        }, 1000);
      }

      // ----- Event Listeners -----
      // Mouse tracking
      mirrorStage.addEventListener('mousemove', (e) => {
        mouseX = e.clientX;
        mouseY = e.clientY;
        isMouseOnStage = true;
      });

      mirrorStage.addEventListener('mouseenter', () => {
        isMouseOnStage = true;
        status.textContent = '🪞 Mirror shining...';
      });

      mirrorStage.addEventListener('mouseleave', () => {
        isMouseOnStage = false;
        status.textContent = '🪞 Move cursor back to see shine';
      });

      // Touch support
      mirrorStage.addEventListener('touchmove', (e) => {
        e.preventDefault();
        const touch = e.touches[0];
        mouseX = touch.clientX;
        mouseY = touch.clientY;
        isMouseOnStage = true;
      });

      mirrorStage.addEventListener('touchstart', (e) => {
        const touch = e.touches[0];
        mouseX = touch.clientX;
        mouseY = touch.clientY;
        isMouseOnStage = true;
      });

      mirrorStage.addEventListener('touchend', () => {
        isMouseOnStage = false;
      });

      // Buttons
      toggleBtn.addEventListener('click', toggleMirror);
      resetBtn.addEventListener('click', resetMirror);
      sparkleBtn.addEventListener('click', sparkleBurst);

      // Click on mirror to toggle
      mirrorStage.addEventListener('click', toggleMirror);

      // Sliders
      intensitySlider.addEventListener('input', (e) => {
        intensityValue.textContent = e.target.value + '%';
        updateMirror();
      });

      angleSlider.addEventListener('input', (e) => {
        angleValue.textContent = e.target.value + '°';
        updateMirror();
      });

      claritySlider.addEventListener('input', (e) => {
        clarityValue.textContent = e.target.value + '%';
        updateMirror();
      });

      // Keyboard shortcuts
      document.addEventListener('keydown', (e) => {
        if (e.key === 't' || e.key === 'T') {
          e.preventDefault();
          toggleMirror();
        }
        if (e.key === 'r' || e.key === 'R') {
          e.preventDefault();
          resetMirror();
        }
        if (e.key === 's' || e.key === 'S') {
          e.preventDefault();
          sparkleBurst();
        }
      });

      // ----- Resize handler -----
      let resizeTimeout;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(() => {
          createSparkles(25);
        }, 300);
      });

      // ----- Init -----
      function init() {
        createSparkles(25);
        startAnimation();
        status.textContent = '🪞 Move your cursor across the mirror to see it shine!';
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }

    })();
  </script>
</body>
</html>
