<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Confirmation Dialog — EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="em-modal-page-container">
    <h1>Confirmation Dialog</h1>
    <p>A modern confirmation modal with glassmorphism styling, warning icon, and responsive buttons</p>
    
    <button class="em-modal-trigger-btn" onclick="document.getElementById('em-confirm-modal').showModal()">
      Delete Account
    </button>
  </div>

  <!-- Confirmation Modal -->
  <dialog id="em-confirm-modal" class="em-confirm-modal">
    <div class="em-modal-content">
      <div class="em-modal-icon-container">
        <svg class="em-modal-icon" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
      </div>
      <h2 class="em-modal-title">Are you absolutely sure?</h2>
      <p class="em-modal-description">This action cannot be undone. This will permanently delete your account and remove all your data from our servers.</p>
      <div class="em-modal-actions">
        <button class="em-modal-btn em-modal-btn-cancel" onclick="document.getElementById('em-confirm-modal').close()">Cancel</button>
        <button class="em-modal-btn em-modal-btn-confirm" onclick="document.getElementById('em-confirm-modal').close()">Confirm Delete</button>
      </div>
    </div>
  </dialog>
</body>
</html>
