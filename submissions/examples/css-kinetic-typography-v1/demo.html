<!DOCTYPE html>
<html lang="en">
<head>

    <title>Kinetic Typography</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

        <h1 class="kinetic-text">
            <span>M</span><span>O</span><span>V</span><span>E</span>

        </h1>
    </div>
</body>
</html>
