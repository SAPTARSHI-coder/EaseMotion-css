<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="CSS luggage tag component with traveler information"
  >
  <title>CSS Luggage Tag</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section class="demo" aria-labelledby="title">

      <p class="eyebrow">EaseMotion CSS</p>

      <h1 id="title">Luggage Tag</h1>

      <p class="intro">
        A travel-inspired luggage tag component built entirely
        with HTML and CSS.
      </p>

      <div class="tag-stage">

        <article class="luggage-tag">
          <div class="tag-hole" aria-hidden="true"></div>

          <div class="tag-string" aria-hidden="true"></div>

          <div class="tag-top">
            <span class="tag-brand">EASEMOTION</span>
            <span class="tag-code">TRAVEL / 26</span>
          </div>

          <div class="destination">
            <span class="small-label">DESTINATION</span>
            <strong>PARIS</strong>
            <span class="airport">CDG · FRANCE</span>
          </div>

          <div class="traveler">
            <span class="small-label">TRAVELER</span>

            <strong>Richa Chauhan</strong>

            <span class="contact">
              richa@example.com
            </span>
          </div>

          <div class="tag-footer">
            <span>HANDLE WITH CARE</span>
            <span aria-hidden="true">✈</span>
          </div>
        </article>

      </div>

    </section>
  </main>
</body>
</html>
