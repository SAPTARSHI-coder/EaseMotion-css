<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Origami Art – Paper Folds into Shapes</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <h1>🦢 Origami Art</h1>
    <p class="subtitle">Paper folds into beautiful shapes</p>

    <div class="origami-container">
      <canvas id="canvas"></canvas>
      
      <!-- Overlay info -->
      <div class="info-overlay">
        <span class="shape-name" id="shapeName">🦢 Crane</span>
        <span class="fold-status" id="foldStatus">Fold: 0%</span>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <button class="ctrl-btn fold" id="foldBtn">📄 Fold</button>
      <button class="ctrl-btn unfold" id="unfoldBtn">📄 Unfold</button>
      <button class="ctrl-btn shape" id="shapeBtn">🔄 Shape</button>
      <button class="ctrl-btn reset" id="resetBtn">↺ Reset</button>
    </div>

    <!-- Sliders -->
    <div class="slider-container">
      <span class="slider-label">Fold Progress</span>
      <input type="range" id="foldSlider" min="0" max="100" value="0" />
      <span class="slider-value" id="foldValue">0%</span>
    </div>

    <div class="slider-container">
      <span class="slider-label">Rotation</span>
      <input type="range" id="rotateSlider" min="0" max="360" value="0" />
      <span class="slider-value" id="rotateValue">0°</span>
    </div>

    <div class="slider-container">
      <span class="slider-label">Scale</span>
      <input type="range" id="scaleSlider" min="50" max="150" value="100" />
      <span class="slider-value" id="scaleValue">100%</span>
    </div>

    <div class="slider-container">
      <span class="slider-label">Color</span>
      <input type="range" id="colorSlider" min="0" max="360" value="0" />
      <span class="slider-value" id="colorValue">0°</span>
    </div>

    <!-- Status -->
    <div class="status" id="status">🦢 Origami crane waiting to be folded</div>

    <!-- Keyboard shortcuts -->
    <div class="shortcuts">
      <kbd>F</kbd> Fold · <kbd>U</kbd> Unfold · <kbd>S</kbd> Shape · <kbd>R</kbd> Reset
    </div>
  </div>

  <script>
    (function() {
      "use strict";

      // DOM elements
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      const shapeName = document.getElementById('shapeName');
      const foldStatus = document.getElementById('foldStatus');
      const foldBtn = document.getElementById('foldBtn');
      const unfoldBtn = document.getElementById('unfoldBtn');
      const shapeBtn = document.getElementById('shapeBtn');
      const resetBtn = document.getElementById('resetBtn');
      const status = document.getElementById('status');
      const foldSlider = document.getElementById('foldSlider');
      const foldValue = document.getElementById('foldValue');
      const rotateSlider = document.getElementById('rotateSlider');
      const rotateValue = document.getElementById('rotateValue');
      const scaleSlider = document.getElementById('scaleSlider');
      const scaleValue = document.getElementById('scaleValue');
      const colorSlider = document.getElementById('colorSlider');
      const colorValue = document.getElementById('colorValue');

      // State
      let foldProgress = 0; // 0-100
      let targetFold = 0;
      let rotation = 0;
      let scale = 100;
      let hue = 0;
      let currentShape = 0;
      let isAnimating = false;
      let animationId = null;
      let time = 0;

      // Shape definitions
      const SHAPES = [
        { name: '🦢 Crane', points: getCranePoints },
        { name: '🦋 Butterfly', points: getButterflyPoints },
        { name: '🌸 Flower', points: getFlowerPoints },
        { name: '⭐ Star', points: getStarPoints },
        { name: '❤️ Heart', points: getHeartPoints },
        { name: '🌊 Wave', points: getWavePoints },
        { name: '🦊 Fox', points: getFoxPoints },
        { name: '🐱 Cat', points: getCatPoints }
      ];

      // ----- Canvas setup -----
      function setupCanvas() {
        const rect = canvas.parentElement.getBoundingClientRect();
        const size = Math.min(rect.width - 40, 600);
        canvas.width = size;
        canvas.height = size;
        canvas.style.width = size + 'px';
        canvas.style.height = size + 'px';
      }

      // ----- Shape point generators -----
      function getCranePoints(w, h, fold) {
        const cx = w / 2;
        const cy = h / 2;
        const s = Math.min(w, h) * 0.35;
        const f = fold / 100;
        
        // Crane shape with folding effect
        const pts = [
          // Body
          { x: 0, y: -s * 0.8 },
          { x: s * 0.4, y: -s * 0.3 },
          { x: s * 0.6, y: s * 0.1 },
          { x: s * 0.3, y: s * 0.5 },
          { x: 0, y: s * 0.6 },
          { x: -s * 0.3, y: s * 0.5 },
          { x: -s * 0.6, y: s * 0.1 },
          { x: -s * 0.4, y: -s * 0.3 },
        ];
        
        // Apply fold transformation
        return pts.map(p => {
          const foldOffset = (1 - p.y / s) * f * s * 0.15;
          return {
            x: cx + p.x + foldOffset * 0.3,
            y: cy + p.y + foldOffset * 0.2
          };
        });
      }

      function getButterflyPoints(w, h, fold) {
        const cx = w / 2;
        const cy = h / 2;
        const s = Math.min(w, h) * 0.35;
        const f = fold / 100;
        
        const pts = [
          // Left wing
          { x: -s * 0.1, y: -s * 0.5 },
          { x: -s * 0.6, y: -s * 0.7 },
          { x: -s * 0.8, y: -s * 0.2 },
          { x: -s * 0.6, y: s * 0.2 },
          { x: -s * 0.4, y: s * 0.5 },
          { x: -s * 0.1, y: s * 0.3 },
          // Body
          { x: 0, y: s * 0.1 },
          { x: 0, y: -s * 0.1 },
          // Right wing
          { x: s * 0.1, y: -s * 0.3 },
          { x: s * 0.4, y: s * 0.5 },
          { x: s * 0.6, y: s * 0.2 },
          { x: s * 0.8, y: -s * 0.2 },
          { x: s * 0.6, y: -s * 0.7 },
          { x: s * 0.1, y: -s * 0.5 },
        ];
        
        return pts.map(p => {
          const foldOffset = (1 - Math.abs(p.x) / s) * f * s * 0.2;
          return {
            x: cx + p.x + (p.x > 0 ? foldOffset : -foldOffset) * 0.5,
            y: cy + p.y + foldOffset * 0.3
          };
        });
      }

      function getFlowerPoints(w, h, fold) {
        const cx = w / 2;
        const cy = h / 2;
        const s = Math.min(w, h) * 0.35;
        const f = fold / 100;
        const petals = 8;
        const pts = [];
        
        for (let i = 0; i < petals * 3; i++) {
          const angle = (i / petals) * Math.PI * 2;
          const r = s * (0.3 + 0.5 * Math.sin(angle * 2 + Math.PI / 2) * 0.5 + 0.5);
          pts.push({
            x: cx + Math.cos(angle) * r * (1 - f * 0.2),
            y: cy + Math.sin(angle) * r * (1 - f * 0.2)
          });
        }
        return pts;
      }

      function getStarPoints(w, h, fold) {
        const cx = w / 2;
        const cy = h / 2;
        const s = Math.min(w, h) * 0.38;
        const f = fold / 100;
        const pts = [];
        const points = 10;
        
        for (let i = 0; i < points; i++) {
          const angle = (i / points) * Math.PI * 2 - Math.PI / 2;
          const r = i % 2 === 0 ? s : s * 0.4;
          pts.push({
            x: cx + Math.cos(angle) * r * (1 + f * 0.3),
            y: cy + Math.sin(angle) * r * (1 + f * 0.3)
          });
        }
        return pts;
      }

      function getHeartPoints(w, h, fold) {
        const cx = w / 2;
        const cy = h / 2;
        const s = Math.min(w, h) * 0.35;
        const f = fold / 100;
        const pts = [];
        const segments = 30;
        
        for (let i = 0; i <= segments; i++) {
          const t = (i / segments) * Math.PI * 2;
          const x = 16 * Math.pow(Math.sin(t), 3);
          const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
          const scale = s / 16;
          pts.push({
            x: cx + x * scale * (1 + f * 0.2),
            y: cy - y * scale * (1 + f * 0.15)
          });
        }
        return pts;
      }

      function getWavePoints(w, h, fold) {
        const cx = w / 2;
        const cy = h / 2;
        const s = Math.min(w, h) * 0.35;
        const f = fold / 100;
        const pts = [];
        const segments = 40;
        
        for (let i = 0; i <= segments; i++) {
          const t = i / segments;
          const x = -s + t * s * 2;
          const y = Math.sin(t * Math.PI * 4 + time) * s * 0.3 * (0.5 + f * 0.5);
          pts.push({
            x: cx + x,
            y: cy + y
          });
        }
        return pts;
      }

      function getFoxPoints(w, h, fold) {
        const cx = w / 2;
        const cy = h / 2;
        const s = Math.min(w, h) * 0.35;
        const f = fold / 100;
        
        const pts = [
          // Head
          { x: 0, y: -s * 0.5 },
          { x: s * 0.3, y: -s * 0.2 },
          { x: s * 0.4, y: 0 },
          { x: s * 0.2, y: s * 0.2 },
          { x: 0, y: s * 0.3 },
          { x: -s * 0.2, y: s * 0.2 },
          { x: -s * 0.4, y: 0 },
          { x: -s * 0.3, y: -s * 0.2 },
          // Ears
          { x: -s * 0.3, y: -s * 0.6 },
          { x: -s * 0.1, y: -s * 0.4 },
          { x: s * 0.1, y: -s * 0.4 },
          { x: s * 0.3, y: -s * 0.6 },
        ];
        
        return pts.map(p => {
          const foldOffset = (1 - Math.abs(p.x) / s) * f * s * 0.1;
          return {
            x: cx + p.x + foldOffset * 0.2,
            y: cy + p.y + foldOffset * 0.1
          };
        });
      }

      function getCatPoints(w, h, fold) {
        const cx = w / 2;
        const cy = h / 2;
        const s = Math.min(w, h) * 0.35;
        const f = fold / 100;
        
        const pts = [
          // Head
          { x: 0, y: -s * 0.4 },
          { x: s * 0.3, y: -s * 0.3 },
          { x: s * 0.4, y: 0 },
          { x: s * 0.3, y: s * 0.2 },
          { x: 0, y: s * 0.3 },
          { x: -s * 0.3, y: s * 0.2 },
          { x: -s * 0.4, y: 0 },
          { x: -s * 0.3, y: -s * 0.3 },
          // Ears
          { x: -s * 0.3, y: -s * 0.6 },
          { x: -s * 0.1, y: -s * 0.4 },
          { x: s * 0.1, y: -s * 0.4 },
          { x: s * 0.3, y: -s * 0.6 },
        ];
        
        return pts.map(p => {
          const foldOffset = (1 - Math.abs(p.x) / s) * f * s * 0.15;
          return {
            x: cx + p.x + foldOffset * 0.3,
            y: cy + p.y + foldOffset * 0.2
          };
        });
      }

      // ----- Draw origami -----
      function drawOrigami() {
        const w = canvas.width;
        const h = canvas.height;
        
        ctx.clearRect(0, 0, w, h);
        
        // Background
        const bgGradient = ctx.createRadialGradient(w/2, h/2, 0, w/2, h/2, w * 0.7);
        bgGradient.addColorStop(0, '#1a1a2e');
        bgGradient.addColorStop(0.5, '#0f0f1a');
        bgGradient.addColorStop(1, '#050508');
        ctx.fillStyle = bgGradient;
        ctx.fillRect(0, 0, w, h);

        // Get shape points
        const shape = SHAPES[currentShape];
        const points = shape.points(w, h, foldProgress);
        
        if (points.length < 3) return;

        // Apply rotation and scale
        const cx = w / 2;
        const cy = h / 2;
        const scaleFactor = scale / 100;
        const angle = (rotation / 180) * Math.PI;
        
        const transformed = points.map(p => {
          const dx = (p.x - cx) * scaleFactor;
          const dy = (p.y - cy) * scaleFactor;
          return {
            x: cx + dx * Math.cos(angle) - dy * Math.sin(angle),
            y: cy + dx * Math.sin(angle) + dy * Math.cos(angle)
          };
        });

        // Draw paper texture (subtle grid)
        ctx.save();
        ctx.globalAlpha = 0.03;
        for (let i = 0; i < w; i += 20) {
          ctx.beginPath();
          ctx.moveTo(i, 0);
          ctx.lineTo(i, h);
          ctx.strokeStyle = '#ffffff';
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(0, i);
          ctx.lineTo(w, i);
          ctx.stroke();
        }
        ctx.restore();

        // Draw origami shape
        ctx.save();
        
        // Shadow
        ctx.shadowColor = 'rgba(0, 0, 0, 0.3)';
        ctx.shadowBlur = 20;
        ctx.shadowOffsetX = 5;
        ctx.shadowOffsetY = 5;

        // Fill with gradient
        const grad = ctx.createRadialGradient(cx - 20, cy - 20, 0, cx, cy, w * 0.5);
        const hueVal = hue;
        grad.addColorStop(0, `hsl(${hueVal}, 80%, 70%)`);
        grad.addColorStop(0.5, `hsl(${hueVal + 20}, 70%, 55%)`);
        grad.addColorStop(1, `hsl(${hueVal + 40}, 60%, 40%)`);
        
        ctx.fillStyle = grad;
        ctx.shadowColor = `hsla(${hueVal}, 80%, 50%, 0.2)`;
        ctx.shadowBlur = 30;
        
        // Draw filled shape
        ctx.beginPath();
        ctx.moveTo(transformed[0].x, transformed[0].y);
        for (let i = 1; i < transformed.length; i++) {
          ctx.lineTo(transformed[i].x, transformed[i].y);
        }
        ctx.closePath();
        ctx.fill();

        // Draw fold lines
        ctx.shadowBlur = 0;
        ctx.strokeStyle = `hsla(${hueVal + 20}, 80%, 80%, ${0.1 + foldProgress / 100 * 0.3})`;
        ctx.lineWidth = 1.5;
        
        // Create fold pattern
        const foldLines = Math.floor(3 + foldProgress / 20);
        for (let i = 0; i < foldLines; i++) {
          const t = (i + 1) / (foldLines + 1);
          const idx = Math.floor(t * transformed.length);
          if (idx > 0 && idx < transformed.length) {
            const p1 = transformed[idx];
            const p2 = transformed[(idx + 2) % transformed.length];
            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.stroke();
          }
        }

        // Draw paper edge highlights
        ctx.shadowBlur = 0;
        ctx.strokeStyle = `hsla(${hueVal + 30}, 60%, 85%, 0.2)`;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(transformed[0].x, transformed[0].y);
        for (let i = 1; i < transformed.length; i++) {
          ctx.lineTo(transformed[i].x, transformed[i].y);
        }
        ctx.closePath();
        ctx.stroke();

        // Draw paper grain (subtle texture dots)
        for (let i = 0; i < 30; i++) {
          const seed = i * 137.508;
          const t = (seed * 0.618) % 1;
          const idx = Math.floor(t * transformed.length);
          if (idx < transformed.length) {
            const p = transformed[idx];
            const size = 0.5 + (seed % 3) * 0.5;
            const alpha = 0.05 + (seed % 100) / 100 * 0.1;
            ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
            ctx.beginPath();
            ctx.arc(p.x + (seed % 10 - 5) * 2, p.y + (seed % 10 - 5) * 2, size, 0, Math.PI * 2);
            ctx.fill();
          }
        }

        ctx.restore();

        // Update UI
        foldStatus.textContent = `Fold: ${Math.round(foldProgress)}%`;
        shapeName.textContent = shape.name;
      }

      // ----- Animation loop -----
      function animate() {
        time += 0.016;
        
        // Smoothly interpolate fold progress
        const diff = targetFold - foldProgress;
        if (Math.abs(diff) > 0.1) {
          foldProgress += diff * 0.05;
        } else {
          foldProgress = targetFold;
        }
        
        drawOrigami();
        animationId = requestAnimationFrame(animate);
      }

      // ----- Start animation -----
      function startAnimation() {
        if (animationId) {
          cancelAnimationFrame(animationId);
        }
        animate();
      }

      // ----- Fold -----
      function fold() {
        targetFold = Math.min(100, targetFold + 20);
        status.textContent = `📄 Folding... ${Math.round(targetFold)}%`;
        foldSlider.value = targetFold;
        foldValue.textContent = Math.round(targetFold) + '%';
      }

      // ----- Unfold -----
      function unfold() {
        targetFold = Math.max(0, targetFold - 20);
        status.textContent = `📄 Unfolding... ${Math.round(targetFold)}%`;
        foldSlider.value = targetFold;
        foldValue.textContent = Math.round(targetFold) + '%';
      }

      // ----- Next shape -----
      function nextShape() {
        currentShape = (currentShape + 1) % SHAPES.length;
        status.textContent = `🔄 Shape: ${SHAPES[currentShape].name}`;
        shapeName.textContent = SHAPES[currentShape].name;
        // Reset fold when changing shape
        targetFold = 0;
        foldProgress = 0;
        foldSlider.value = 0;
        foldValue.textContent = '0%';
        foldStatus.textContent = 'Fold: 0%';
      }

      // ----- Reset -----
      function resetOrigami() {
        targetFold = 0;
        foldProgress = 0;
        rotation = 0;
        scale = 100;
        hue = 0;
        currentShape = 0;
        
        foldSlider.value = 0;
        foldValue.textContent = '0%';
        rotateSlider.value = 0;
        rotateValue.textContent = '0°';
        scaleSlider.value = 100;
        scaleValue.textContent = '100%';
        colorSlider.value = 0;
        colorValue.textContent = '0°';
        
        shapeName.textContent = SHAPES[0].name;
        foldStatus.textContent = 'Fold: 0%';
        status.textContent = '↺ Reset to default';
      }

      // ----- Event Listeners -----
      foldBtn.addEventListener('click', fold);
      unfoldBtn.addEventListener('click', unfold);
      shapeBtn.addEventListener('click', nextShape);
      resetBtn.addEventListener('click', resetOrigami);

      foldSlider.addEventListener('input', (e) => {
        const val = parseFloat(e.target.value);
        targetFold = val;
        foldValue.textContent = Math.round(val) + '%';
        status.textContent = `📄 Fold: ${Math.round(val)}%`;
      });

      rotateSlider.addEventListener('input', (e) => {
        rotation = parseFloat(e.target.value);
        rotateValue.textContent = Math.round(rotation) + '°';
      });

      scaleSlider.addEventListener('input', (e) => {
        scale = parseFloat(e.target.value);
        scaleValue.textContent = Math.round(scale) + '%';
      });

      colorSlider.addEventListener('input', (e) => {
        hue = parseFloat(e.target.value);
        colorValue.textContent = Math.round(hue) + '°';
      });

      // Keyboard shortcuts
      document.addEventListener('keydown', (e) => {
        if (e.key === 'f' || e.key === 'F') {
          e.preventDefault();
          fold();
        }
        if (e.key === 'u' || e.key === 'U') {
          e.preventDefault();
          unfold();
        }
        if (e.key === 's' || e.key === 'S') {
          e.preventDefault();
          nextShape();
        }
        if (e.key === 'r' || e.key === 'R') {
          e.preventDefault();
          resetOrigami();
        }
      });

      // ----- Resize handler -----
      let resizeTimeout;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(() => {
          setupCanvas();
        }, 200);
      });

      // ----- Init -----
      function init() {
        setupCanvas();
        startAnimation();
        status.textContent = '🦢 Origami crane waiting to be folded — press F to fold!';
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }

    })();
  </script>
</body>
</html>
