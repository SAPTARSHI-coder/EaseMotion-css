<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quantum Particle Loader Ring | EaseMotion CSS Showcase</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <main class="loader-wrapper">
    <header class="header">
      <span class="badge">GSSoC 2026 Innovation</span>
      <h1 class="title">Quantum Orbital Loader</h1>
      <p class="subtitle">Pure CSS counter-rotating dual particle orbital spinner with neon aura illumination and pulsing core reactor.</p>
    </header>

    <div class="loader-card">
      <div class="quantum-spinner">
        <div class="outer-ring">
          <span class="particle p1"></span>
          <span class="particle p2"></span>
          <span class="particle p3"></span>
        </div>
        <div class="inner-ring">
          <span class="particle p4"></span>
          <span class="particle p5"></span>
        </div>
        <div class="core-reactor"></div>
      </div>

      <div class="status-container">
        <h2 class="status-title">SYNCHRONIZING QUANTUM MATRIX</h2>
        <div class="progress-track">
          <div class="progress-fill"></div>
        </div>
        <span class="status-sub">Establishing encrypted neural data tunnel...</span>
      </div>
    </div>
  </main>
</body>
</html>
