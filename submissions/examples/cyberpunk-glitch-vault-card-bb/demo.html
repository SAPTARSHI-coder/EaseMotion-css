<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyberpunk Glitch Vault Card Component - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="glitch-vault-card">
    <div class="card-glitch-overlay"></div>
    <div class="card-header">
      <span class="cyber-tag">CYBER_CRYPT // 0X88</span>
      <span class="status-indicator">ON-GRID</span>
    </div>
    
    <div class="vault-body">
      <h2 class="glitch-text" data-text="ACCESS_GRANTED">ACCESS_GRANTED</h2>
      <p class="vault-subtext">ENCRYPTED CREDENTIAL MATRIX</p>
      
      <div class="security-level">
        <span class="sec-label">SEC LEVEL: 09</span>
        <div class="sec-grid">
          <div class="sec-block active"></div>
          <div class="sec-block active"></div>
          <div class="sec-block active"></div>
          <div class="sec-block active"></div>
          <div class="sec-block"></div>
        </div>
      </div>
    </div>
    
    <div class="card-footer">
      <button class="cyber-btn">UNLOCK VAULT</button>
    </div>
  </div>
</body>
</html>
