<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="CSS animation with a prefers-reduced-motion alternative"
  >
  <title>CSS Reduced Motion Alternative</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="demo-container">
    <section class="demo-card" aria-labelledby="demo-title">
      <div class="animated-box" aria-hidden="true">
        <span class="box-dot"></span>
      </div>

      <h1 id="demo-title">Reduced Motion Animation</h1>

      <p>
        This animation respects the user's motion preference.
        Enable reduced motion in your operating system or browser
        accessibility settings to see the alternative behavior.
      </p>

      <div class="status" role="status">
        <span class="status-indicator" aria-hidden="true"></span>
        Motion-aware CSS animation
      </div>
    </section>
  </main>
</body>
</html>
