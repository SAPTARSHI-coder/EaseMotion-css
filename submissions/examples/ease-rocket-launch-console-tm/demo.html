<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rocket Launch Console | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="rlwrap">
    <div class="rlconsole">
      <div class="rlhead">
        <h2 class="rltitle">ARTEMIS VII</h2>
        <span class="rlstatus"><span class="rldot"></span>GO</span>
      </div>
      <div class="rlcountdown">
        <div class="rlcd-block">
          <span class="rlcd-num">00</span>
          <span class="rlcd-label">Hours</span>
        </div>
        <div class="rlcd-block">
          <span class="rlcd-num">08</span>
          <span class="rlcd-label">Min</span>
        </div>
        <div class="rlcd-block">
          <span class="rlcd-num">42</span>
          <span class="rlcd-label">Sec</span>
        </div>
      </div>
      <div class="rltelemetry">
        <div class="rltele-cell">
          <div class="rltele-label">Alt</div>
          <span class="rltele-val">12.4 km</span>
        </div>
        <div class="rltele-cell">
          <div class="rltele-label">Vel</div>
          <span class="rltele-val">Mach 3</span>
        </div>
        <div class="rltele-cell">
          <div class="rltele-label">Fuel</div>
          <span class="rltele-val">87%</span>
        </div>
        <div class="rltele-cell">
          <div class="rltele-label">Temp</div>
          <span class="rltele-val">-42&deg;C</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
