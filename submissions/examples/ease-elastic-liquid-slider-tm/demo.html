<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Elastic Liquid Slider | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="elastic-stage">
    <span class="elastic-label">Volume</span>
    <span class="elastic-value">65</span>
    <div class="elastic-track">
      <div class="elastic-fill"></div>
      <div class="elastic-knob"></div>
    </div>
    <p class="elastic-hint">Springy track with a liquid wave inside</p>
  </div>
</body>
</html>
