<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ferris Wheel · Wheel Turns with Interaction</title>
    <meta name="description" content="Interactive Ferris wheel with realistic rotation, glowing cabins, and city skyline background.">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1 class="title">🎡 FERRIS WHEEL</h1>
        
        <div class="canvas-wrapper">
            <canvas id="ferrisCanvas" width="600" height="500"></canvas>
            <div class="glow-overlay"></div>
        </div>

        <div class="controls">
            <div class="button-group">
                <button class="start-btn" id="startBtn">▶️ START</button>
                <button class="stop-btn" id="stopBtn">⏹️ STOP</button>
                <button class="reset-btn" id="resetBtn">⟳ RESET</button>
                <button class="toggle-btn" id="toggleBtn">⏸️ PAUSE</button>
            </div>
            <div class="speed-control">
                <label>Speed</label>
                <input type="range" id="speedSlider" min="1" max="10" value="5">
                <span id="speedLabel">5</span>
                <label>Cabins</label>
                <input type="range" id="cabinsSlider" min="6" max="16" value="10" step="2">
                <span id="cabinsLabel">10</span>
            </div>
        </div>

        <div class="info">
            <span>🎡 FERRIS WHEEL</span>
            <small>rotate · cabins · city</small>
        </div>
        <div class="hint">
            <span>🎡 click to start the Ferris wheel turning</span>
        </div>
    </div>

    <script>
        (function() {
            const canvas = document.getElementById('ferrisCanvas');
            const ctx = canvas.getContext('2d');
            const W = 600, H = 500;
            
            const startBtn = document.getElementById('startBtn');
            const stopBtn = document.getElementById('stopBtn');
            const resetBtn = document.getElementById('resetBtn');
            const toggleBtn = document.getElementById('toggleBtn');
            const speedSlider = document.getElementById('speedSlider');
            const speedLabel = document.getElementById('speedLabel');
            const cabinsSlider = document.getElementById('cabinsSlider');
            const cabinsLabel = document.getElementById('cabinsLabel');

            let isAnimating = true;
            let speed = 5;
            let numCabins = 10;
            let time = 0;
            let wheelAngle = 0;
            let angularVelocity = 0;
            let isRunning = false;
            let rotationCount = 0;

            // ---- Ferris Wheel Parameters ----
            const centerX = 300;
            const centerY = 250;
            const radius = 150;
            const cabinSize = 12;

            // ---- Start ----
            function startWheel() {
                if (isRunning) return;
                isRunning = true;
                angularVelocity = 0.005 + speed * 0.003;
                rotationCount = 0;
            }

            // ---- Stop ----
            function stopWheel() {
                isRunning = false;
                angularVelocity = 0;
            }

            // ---- Reset ----
            function resetWheel() {
                isRunning = false;
                angularVelocity = 0;
                wheelAngle = 0;
                rotationCount = 0;
            }

            // ---- Update Physics ----
            function updatePhysics() {
                const dt = 0.02 * (speed / 5);
                
                if (isRunning) {
                    wheelAngle += angularVelocity * dt * 20;
                    
                    // Track full rotations
                    if (wheelAngle > Math.PI * 2) {
                        wheelAngle -= Math.PI * 2;
                        rotationCount++;
                    }
                }
            }

            // ---- Draw Skyline ----
            function drawSkyline() {
                // Sky
                const skyGrad = ctx.createLinearGradient(0, 0, 0, H);
                skyGrad.addColorStop(0, '#0a1a2a');
                skyGrad.addColorStop(0.3, '#1a2a3a');
                skyGrad.addColorStop(0.6, '#2a3a4a');
                skyGrad.addColorStop(0.8, '#1a2a3a');
                skyGrad.addColorStop(1, '#0a1a2a');
                ctx.fillStyle = skyGrad;
                ctx.fillRect(0, 0, W, H);
                
                // Stars
                for (let i = 0; i < 40; i++) {
                    const x = (i * 137 + 20) % W;
                    const y = (i * 97 + 30) % (H * 0.6);
                    const size = 0.5 + (i % 3) * 0.5;
                    const twinkle = 0.3 + Math.sin(time * 0.015 + i * 2.5) * 0.3 + 0.3;
                    ctx.fillStyle = `rgba(200, 220, 255, ${twinkle * 0.5})`;
                    ctx.beginPath();
                    ctx.arc(x, y, size, 0, Math.PI * 2);
                    ctx.fill();
                }
                
                // City skyline
                ctx.fillStyle = 'rgba(20, 30, 40, 0.6)';
                const buildings = [
                    { x: 20, w: 30, h: 40 },
                    { x: 55, w: 25, h: 60 },
                    { x: 85, w: 35, h: 80 },
                    { x: 125, w: 20, h: 50 },
                    { x: 150, w: 40, h: 100 },
                    { x: 195, w: 25, h: 45 },
                    { x: 225, w: 30, h: 70 },
                    { x: 260, w: 20, h: 35 },
                    { x: 285, w: 35, h: 90 },
                    { x: 325, w: 25, h: 55 },
                    { x: 355, w: 40, h: 110 },
                    { x: 400, w: 30, h: 65 },
                    { x: 435, w: 20, h: 40 },
                    { x: 460, w: 35, h: 85 },
                    { x: 500, w: 25, h: 50 },
                    { x: 530, w: 30, h: 70 },
                    { x: 565, w: 25, h: 45 }
                ];
                
                for (let b of buildings) {
                    const bx = b.x;
                    const by = H - 80 - b.h;
                    ctx.fillRect(bx, by, b.w, b.h);
                    // Windows
                    ctx.fillStyle = 'rgba(255, 220, 150, 0.05)';
                    for (let wy = by + 10; wy < H - 80; wy += 15) {
                        for (let wx = bx + 5; wx < bx + b.w - 5; wx += 10) {
                            if (Math.random() < 0.2) {
                                ctx.fillRect(wx, wy, 4, 6);
                            }
                        }
                    }
                    ctx.fillStyle = 'rgba(20, 30, 40, 0.6)';
                }
            }

            // ---- Draw Ferris Wheel ----
            function drawFerrisWheel() {
                const cx = centerX;
                const cy = centerY;
                const r = radius;
                const angle = wheelAngle;
                
                ctx.save();
                ctx.translate(cx, cy);
                
                // Support legs
                ctx.shadowColor = 'rgba(0,0,0,0.1)';
                ctx.shadowBlur = 10;
                ctx.strokeStyle = 'rgba(200, 220, 240, 0.15)';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(-20, 10);
                ctx.lineTo(-60, 180);
                ctx.moveTo(20, 10);
                ctx.lineTo(60, 180);
                ctx.stroke();
                
                // Base
                ctx.shadowBlur = 15;
                ctx.fillStyle = 'rgba(200, 220, 240, 0.05)';
                ctx.beginPath();
                ctx.arc(0, 0, 15, 0, Math.PI * 2);
                ctx.fill();
                
                // Main wheel ring
                ctx.shadowBlur = 5;
                ctx.strokeStyle = 'rgba(200, 220, 240, 0.2)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(0, 0, r, 0, Math.PI * 2);
                ctx.stroke();
                
                // Inner ring
                ctx.strokeStyle = 'rgba(200, 220, 240, 0.1)';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.arc(0, 0, r * 0.85, 0, Math.PI * 2);
                ctx.stroke();
                
                // Spokes
                ctx.shadowBlur = 0;
                ctx.strokeStyle = 'rgba(200, 220, 240, 0.12)';
                ctx.lineWidth = 1;
                const numSpokes = 16;
                for (let i = 0; i < numSpokes; i++) {
                    const a = angle + (i / numSpokes) * Math.PI * 2;
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
                    ctx.stroke();
                }
                
                // Cross bracing
                ctx.strokeStyle = 'rgba(200, 220, 240, 0.06)';
                ctx.lineWidth = 0.5;
                for (let i = 0; i < numSpokes; i++) {
                    const a1 = angle + (i / numSpokes) * Math.PI * 2;
                    const a2 = angle + ((i + 1) / numSpokes) * Math.PI * 2;
                    const r1 = r * 0.7;
                    const r2 = r * 0.9;
                    const x1 = Math.cos(a1) * r1;
                    const y1 = Math.sin(a1) * r1;
                    const x2 = Math.cos(a2) * r2;
                    const y2 = Math.sin(a2) * r2;
                    ctx.beginPath();
                    ctx.moveTo(x1, y1);
                    ctx.lineTo(x2, y2);
                    ctx.stroke();
                }
                
                // Cabins
                const cabinAngle = angle;
                for (let i = 0; i < numCabins; i++) {
                    const a = cabinAngle + (i / numCabins) * Math.PI * 2;
                    const cx2 = Math.cos(a) * r;
                    const cy2 = Math.sin(a) * r;
                    
                    // Cabin arm
                    ctx.strokeStyle = 'rgba(200, 220, 240, 0.15)';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.moveTo(cx2, cy2);
                    const armLen = 15;
                    const ax = cx2 + Math.cos(a) * armLen;
                    const ay = cy2 + Math.sin(a) * armLen;
                    ctx.lineTo(ax, ay);
                    ctx.stroke();
                    
                    // Cabin
                    const cabX = cx2 + Math.cos(a) * 20;
                    const cabY = cy2 + Math.sin(a) * 20;
                    
                    // Cabin glow
                    const glowIntensity = 0.1 + (i / numCabins) * 0.1;
                    ctx.shadowColor = `rgba(255, 220, 150, ${glowIntensity * 0.05})`;
                    ctx.shadowBlur = 15;
                    
                    // Cabin body
                    const cabGrad = ctx.createRadialGradient(
                        cabX - 3, cabY - 3, 0,
                        cabX, cabY, cabinSize
                    );
                    cabGrad.addColorStop(0, `rgba(255, 220, 150, ${0.1 + glowIntensity * 0.2})`);
                    cabGrad.addColorStop(0.5, `rgba(200, 180, 150, ${0.1 + glowIntensity * 0.1})`);
                    cabGrad.addColorStop(1, `rgba(150, 140, 130, ${0.05 + glowIntensity * 0.05})`);
                    ctx.fillStyle = cabGrad;
                    ctx.shadowBlur = 10;
                    ctx.beginPath();
                    ctx.arc(cabX, cabY, cabinSize, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // Cabin window
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = `rgba(255, 220, 150, ${0.1 + glowIntensity * 0.1})`;
                    ctx.beginPath();
                    ctx.arc(cabX, cabY - 2, cabinSize * 0.4, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // Cabin highlight
                    ctx.fillStyle = `rgba(255, 255, 255, ${0.05 + glowIntensity * 0.05})`;
                    ctx.beginPath();
                    ctx.ellipse(cabX - 3, cabY - 4, 4, 3, -0.3, 0, Math.PI * 2);
                    ctx.fill();
                }
                
                // Center hub glow
                const hubGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, 20);
                hubGrad.addColorStop(0, 'rgba(200, 220, 240, 0.15)');
                hubGrad.addColorStop(0.5, 'rgba(200, 220, 240, 0.05)');
                hubGrad.addColorStop(1, 'rgba(200, 220, 240, 0)');
                ctx.fillStyle = hubGrad;
                ctx.shadowBlur = 20;
                ctx.beginPath();
                ctx.arc(0, 0, 20, 0, Math.PI * 2);
                ctx.fill();
                
                // Center dot
                ctx.shadowBlur = 0;
                ctx.fillStyle = 'rgba(200, 220, 240, 0.15)';
                ctx.beginPath();
                ctx.arc(0, 0, 5, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.restore();
            }

            // ---- Draw Ground ----
            function drawGround() {
                const grad = ctx.createLinearGradient(0, H - 30, 0, H);
                grad.addColorStop(0, 'rgba(20, 30, 40, 0)');
                grad.addColorStop(0.3, 'rgba(20, 30, 40, 0.2)');
                grad.addColorStop(0.7, 'rgba(20, 30, 40, 0.4)');
                grad.addColorStop(1, 'rgba(20, 30, 40, 0.6)');
                ctx.fillStyle = grad;
                ctx.fillRect(0, H - 30, W, 30);
                
                ctx.strokeStyle = 'rgba(100, 200, 255, 0.03)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(0, H - 30);
                ctx.lineTo(W, H - 30);
                ctx.stroke();
            }

            // ---- Render ----
            function render() {
                drawSkyline();
                drawGround();
                drawFerrisWheel();
                
                // Status info
                ctx.save();
                ctx.fillStyle = 'rgba(200, 220, 240, 0.2)';
                ctx.font = '13px monospace';
                ctx.textAlign = 'right';
                ctx.textBaseline = 'bottom';
                ctx.fillText(`Rotations: ${rotationCount}`, W - 20, H - 10);
                
                ctx.textAlign = 'left';
                const status = isRunning ? '🔄 RUNNING' : '⏸️ STOPPED';
                ctx.fillText(status, 20, H - 10);
                
                if (isRunning) {
                    const rpm = (angularVelocity * 60 / (Math.PI * 2)).toFixed(1);
                    ctx.fillText(`RPM: ${rpm}`, 20, H - 30);
                }
                ctx.restore();
            }

            // ---- Animation Loop ----
            function animate() {
                if (!isAnimating) {
                    requestAnimationFrame(animate);
                    return;
                }
                
                time += 0.01;
                
                updatePhysics();
                render();
                
                requestAnimationFrame(animate);
            }

            // ---- Toggle Animation ----
            function toggleAnimation() {
                isAnimating = !isAnimating;
                toggleBtn.textContent = isAnimating ? '⏸️ PAUSE' : '▶️ PLAY';
            }

            // ---- Update Labels ----
            speedSlider.addEventListener('input', function() {
                speed = parseInt(this.value);
                speedLabel.textContent = speed;
                if (isRunning) {
                    angularVelocity = 0.005 + speed * 0.003;
                }
            });
            cabinsSlider.addEventListener('input', function() {
                numCabins = parseInt(this.value);
                cabinsLabel.textContent = numCabins;
            });

            // ---- Event Listeners ----
            startBtn.addEventListener('click', startWheel);
            stopBtn.addEventListener('click', stopWheel);
            resetBtn.addEventListener('click', resetWheel);
            toggleBtn.addEventListener('click', toggleAnimation);

            // ---- Keyboard Shortcuts ----
            document.addEventListener('keydown', function(e) {
                if (e.key === ' ' || e.key === 'Space') {
                    e.preventDefault();
                    if (!isRunning) {
                        startWheel();
                    } else {
                        stopWheel();
                    }
                }
                if (e.key === 'r' || e.key === 'R') {
                    resetWheel();
                }
                if (e.key === 'p' || e.key === 'P') {
                    toggleAnimation();
                }
            });

            // ---- Initialize ----
            render();
            animate();

            console.log('🎡 Ferris Wheel · Click Start or press Space to turn the wheel!');
        })();
    </script>
</body>
</html>
