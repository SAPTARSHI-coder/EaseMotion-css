<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />
  <meta
    name="description"
    content="Interactive Material Design spinner created with HTML and CSS."
  />
  <title>Material Interactive Spinner</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main class="demo">
    <section class="spinner-showcase" aria-label="Material Design spinner showcase">

      <div class="intro">
        <span class="eyebrow">MATERIAL MOTION</span>

        <h1>Interactive <span>Spinner</span></h1>

        <p>
          A responsive CSS-only loading indicator inspired by
          Material Design motion and elevation principles.
        </p>
      </div>

      <div class="spinner-card">
        <div class="status-pill">
          <span class="status-dot"></span>
          Processing
        </div>

        <div class="spinner-area">
          <div
            class="spinner"
            role="status"
            aria-label="Loading"
          >
            <span class="spinner-track"></span>
            <span class="spinner-progress"></span>
            <span class="spinner-center"></span>
          </div>

          <div class="progress-ring">
            <span></span>
          </div>
        </div>

        <div class="spinner-info">
          <strong>Loading your content</strong>
          <span>Please wait a moment...</span>
        </div>

        <div class="actions">
          <button class="action-button primary" type="button">
            Loading
          </button>

          <button class="action-button secondary" type="button">
            Cancel
          </button>
        </div>
      </div>

      <div class="variants">
        <article class="variant">
          <div class="mini-spinner small">
            <span class="mini-track"></span>
            <span class="mini-progress"></span>
          </div>
          <div>
            <strong>Small</strong>
            <span>Compact indicator</span>
          </div>
        </article>

        <article class="variant">
          <div class="mini-spinner medium">
            <span class="mini-track"></span>
            <span class="mini-progress"></span>
          </div>
          <div>
            <strong>Medium</strong>
            <span>Default indicator</span>
          </div>
        </article>

        <article class="variant">
          <div class="mini-spinner large">
            <span class="mini-track"></span>
            <span class="mini-progress"></span>
          </div>
          <div>
            <strong>Large</strong>
            <span>Prominent indicator</span>
          </div>
        </article>
      </div>

    </section>
  </main>
</body>
</html>
