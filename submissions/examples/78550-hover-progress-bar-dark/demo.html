<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Responsive hover progress bar with dark mode styling built using HTML and CSS."
  >

  <title>Hover Progress Bar | EaseMotion CSS</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="page">
    <section class="progress-card">
      <span class="eyebrow">EaseMotion CSS</span>

      <h1>Hover Progress Bar</h1>

      <p class="description">
        A responsive dark-mode progress component with a smooth
        hover interaction that reveals the progress value.
      </p>

      <div class="progress-list">
        <article class="progress-item">
          <div class="progress-header">
            <span>HTML &amp; CSS</span>
            <span class="progress-value">92%</span>
          </div>

          <div
            class="progress-track"
            role="progressbar"
            aria-label="HTML and CSS progress"
            aria-valuenow="92"
            aria-valuemin="0"
            aria-valuemax="100"
          >
            <span
              class="progress-fill"
              style="--progress: 92%;"
            >
              <span class="progress-glow"></span>
            </span>
          </div>
        </article>

        <article class="progress-item">
          <div class="progress-header">
            <span>JavaScript</span>
            <span class="progress-value">78%</span>
          </div>

          <div
            class="progress-track"
            role="progressbar"
            aria-label="JavaScript progress"
            aria-valuenow="78"
            aria-valuemin="0"
            aria-valuemax="100"
          >
            <span
              class="progress-fill"
              style="--progress: 78%;"
            >
              <span class="progress-glow"></span>
            </span>
          </div>
        </article>

        <article class="progress-item">
          <div class="progress-header">
            <span>React</span>
            <span class="progress-value">68%</span>
          </div>

          <div
            class="progress-track"
            role="progressbar"
            aria-label="React progress"
            aria-valuenow="68"
            aria-valuemin="0"
            aria-valuemax="100"
          >
            <span
              class="progress-fill"
              style="--progress: 68%;"
            >
              <span class="progress-glow"></span>
            </span>
          </div>
        </article>

        <article class="progress-item">
          <div class="progress-header">
            <span>Accessibility</span>
            <span class="progress-value">84%</span>
          </div>

          <div
            class="progress-track"
            role="progressbar"
            aria-label="Accessibility progress"
            aria-valuenow="84"
            aria-valuemin="0"
            aria-valuemax="100"
          >
            <span
              class="progress-fill"
              style="--progress: 84%;"
            >
              <span class="progress-glow"></span>
            </span>
          </div>
        </article>
      </div>

      <p class="hint">
        <span aria-hidden="true">✦</span>
        Hover over a progress bar to reveal its glow effect.
      </p>
    </section>
  </main>
</body>
</html>
