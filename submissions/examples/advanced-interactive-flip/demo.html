<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Flip Flashcard</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="container">
    <h1>Interactive Flip Flashcard</h1>
    <p class="subtitle">Hover or tap the card to reveal the answer</p>

    <div class="flashcard" tabindex="0">
      <div class="card-inner">

        <section class="card-face card-front">
          <span class="label">QUESTION</span>
          <h2>What is HTML?</h2>
          <p>Hover or tap to reveal the answer</p>
        </section>

        <section class="card-face card-back">
          <span class="label">ANSWER</span>
          <h2>HyperText Markup Language</h2>
          <p>
            HTML is the standard markup language used
            to structure content on web pages.
          </p>
        </section>

      </div>
    </div>

    <div class="hint">
      <span>↻</span> Flip the card to learn
    </div>
  </main>

</body>
</html>
