<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ease Striped Progress Bar Component</title>
    <link rel="stylesheet" href="../../../../core/easemotion.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="component-viewport">
        <div class="progress-container-card">
            <div class="progress-meta">
                <div class="meta-info">
                    <span class="meta-label">COMPUTATIONAL_ENGINE</span>
                    <h3 class="meta-title">Syncing Node Clusters</h3>
                </div>
                <span class="percentage-display">74%</span>
            </div>

            <div class="ease-striped-progress-bar-wrapper">
                <div class="ease-striped-progress-bar-track">
                    <div class="ease-striped-progress-bar-fill" style="width: 74%;">
                        <div class="stripe-animation-overlay"></div>
                    </div>
                </div>
            </div>

            <div class="progress-footer">
                <span class="footer-status-text">Processing batch chunks...</span>
                <span class="footer-time-text">Estimated time: 14s</span>
            </div>
        </div>
    </div>

</body>
</html>
