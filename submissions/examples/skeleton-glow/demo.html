<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skeleton Screen Ambient Breathing Glow</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body, html {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #ffffff;
      color: #333333;
    }

    .demo-header {
      text-align: center;
      padding: 4rem 2rem;
      background: #f8fafc;
      border-bottom: 1px solid #e2e8f0;
    }

    .demo-header p {
      opacity: 0.7;
      max-width: 600px;
      margin: 0 auto;
    }

    .container {
      display: flex;
      flex-direction: column;
      gap: 2rem;
      max-width: 600px;
      margin: 3rem auto;
      padding: 0 2rem;
    }

    /* Demo layout simulating a card */
    .card-skeleton {
      display: flex;
      gap: 1.5rem;
      align-items: center;
      padding: 1.5rem;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
    }

    .skeleton-avatar {
      width: 64px;
      height: 64px;
      flex-shrink: 0;
    }

    .skeleton-content {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      width: 100%;
    }

    .skeleton-line {
      height: 16px;
    }

    .skeleton-line.short {
      width: 60%;
    }
  </style>
</head>
<body>

  <header class="demo-header">
    <h1>Skeleton Ambient Glow</h1>
    <p>A subtle, full-element ambient "breathing glow" pulsing opacity and box-shadow, perfect for premium UIs.</p>
  </header>

  <main class="container">
    
    <div class="card-skeleton">
      <div class="ease-skeleton-glow ease-skeleton-glow-circle skeleton-avatar"></div>
      <div class="skeleton-content">
        <div class="ease-skeleton-glow ease-skeleton-glow-rect skeleton-line"></div>
        <div class="ease-skeleton-glow ease-skeleton-glow-rect skeleton-line"></div>
        <div class="ease-skeleton-glow ease-skeleton-glow-rect skeleton-line short"></div>
      </div>
    </div>
    
    <div class="card-skeleton">
      <div class="ease-skeleton-glow ease-skeleton-glow-circle skeleton-avatar"></div>
      <div class="skeleton-content">
        <div class="ease-skeleton-glow ease-skeleton-glow-rect skeleton-line"></div>
        <div class="ease-skeleton-glow ease-skeleton-glow-rect skeleton-line short"></div>
      </div>
    </div>

  </main>

</body>
</html>
