<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-analog-stopwatch-timer demo</title>
</head>
<body>
<div class="sw-app">
  <span class="sw-title">STOPWATCH</span>
  <div class="sw-face">
    <span class="sw-tick sw-tick-12"></span>
    <span class="sw-tick sw-tick-3"></span>
    <span class="sw-tick sw-tick-6"></span>
    <span class="sw-tick sw-tick-9"></span>
    <span class="sw-second"></span>
    <span class="sw-minute"></span>
    <span class="sw-hub"></span>
  </div>
  <div class="sw-readout">00:14:37</div>
  <ul class="sw-laps">
    <li class="sw-lap">Lap 1 &mdash; 00:04.2</li>
    <li class="sw-lap">Lap 2 &mdash; 00:09.5</li>
    <li class="sw-lap">Lap 3 &mdash; 00:14.3</li>
  </ul>
</div>
</body>
</html>
