<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Snowman - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="ease-snowman-wrapper" role="img" aria-label="Animated pure CSS snowman with a top hat and carrot nose">
    <div class="ease-snowman">
      <div class="ease-shadow"></div>
      <div class="ease-base"></div>
      <div class="ease-body">
        <div class="ease-buttons"></div>
        <div class="ease-arm ease-arm-left"></div>
        <div class="ease-arm ease-arm-right"></div>
      </div>
      <div class="ease-head">
        <div class="ease-hat"></div>
        <div class="ease-eyes"></div>
        <div class="ease-nose"></div>
        <div class="ease-scarf"></div>
      </div>
    </div>
  </div>
  <p style="position: absolute; bottom: 2rem; color: #64748b; font-family: system-ui; font-size: 0.875rem; text-align: center;">Geometry and 3D shading rendered natively via CSS <code>radial-gradient</code> and pseudo-elements.<br>Zero image or SVG assets used.</p>
</body>
</html>
