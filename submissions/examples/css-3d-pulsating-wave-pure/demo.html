<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 3D Effect: Pulsating Wave</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="layout-container">
        
        <header class="section-header">
            <h1 class="title">Pure CSS 3D: Pulsating Wave</h1>
            <p class="subtitle">A hardware-accelerated, JavaScript-free 3D animation utilizing `transform-style: preserve-3d` and a matrix of staggered `animation-delay` properties to simulate wave physics.</p>
        </header>

        <div class="demo-area">
            
            <!-- 
              [TECHNIQUE] The 3D Scene
              The wrapper establishes the perspective, allowing child elements
              to be transformed in 3D space.
            -->
            <div class="scene-3d">
                
                <!-- 
                  The primary grid object. 
                  It is rotated into an isometric view.
                -->
                <div class="grid-3d">
                    
                    <!-- 
                      A 5x5 Matrix of 3D Columns.
                      Each column has a specific class to map its X,Y coordinate 
                      to a specific animation delay in the CSS.
                    -->
                    
                    <!-- Row 1 -->
                    <div class="column col-1-1"><div class="face top"></div><div class="face left"></div><div class="face right"></div></div>
                    <div class="column col-1-2"><div class="face top"></div><div class="face left"></div><div class="face right"></div></div>
                    <div class="column col-1-3"><div class="face top"></div><div class="face left"></div><div class="face right"></div></div>
                    <div class="column col-1-4"><div class="face top"></div><div class="face left"></div><div class="face right"></div></div>
                    <div class="column col-1-5"><div class="face top"></div><div class="face left"></div><div class="face right"></div></div>
                    
                    <!-- Row 2 -->
                    <div class="column col-2-1"><div class="face top"></div><div class="face left"></div><div class="face right"></div></div>
                    <div class="column col-2-2"><div class="face top"></div><div class="face left"></div><div class="face right"></div></div>
                    <div class="column col-2-3"><div class="face top"></div><div class="face left"></div><div class="face right"></div></div>
                    <div class="column col-2-4"><div class="face top"></div><div class="face left"></div><div class="face right"></div></div>
                    <div class="column col-2-5"><div class="face top"></div><div class="face left"></div><div class="face right"></div></div>
                    
                    <!-- Row 3 -->
                    <div class="column col-3-1"><div class="face top"></div><div class="face left"></div><div class="face right"></div></div>
                    <div class="column col-3-2"><div class="face top"></div><div class="face left"></div><div class="face right"></div></div>
                    <div class="column col-3-3"><div class="face top"></div><div class="face left"></div><div class="face right"></div></div>
                    <div class="column col-3-4"><div class="face top"></div><div class="face left"></div><div class="face right"></div></div>
                    <div class="column col-3-5"><div class="face top"></div><div class="face left"></div><div class="face right"></div></div>
                    
                    <!-- Row 4 -->
                    <div class="column col-4-1"><div class="face top"></div><div class="face left"></div><div class="face right"></div></div>
                    <div class="column col-4-2"><div class="face top"></div><div class="face left"></div><div class="face right"></div></div>
                    <div class="column col-4-3"><div class="face top"></div><div class="face left"></div><div class="face right"></div></div>
                    <div class="column col-4-4"><div class="face top"></div><div class="face left"></div><div class="face right"></div></div>
                    <div class="column col-4-5"><div class="face top"></div><div class="face left"></div><div class="face right"></div></div>
                    
                    <!-- Row 5 -->
                    <div class="column col-5-1"><div class="face top"></div><div class="face left"></div><div class="face right"></div></div>
                    <div class="column col-5-2"><div class="face top"></div><div class="face left"></div><div class="face right"></div></div>
                    <div class="column col-5-3"><div class="face top"></div><div class="face left"></div><div class="face right"></div></div>
                    <div class="column col-5-4"><div class="face top"></div><div class="face left"></div><div class="face right"></div></div>
                    <div class="column col-5-5"><div class="face top"></div><div class="face left"></div><div class="face right"></div></div>
                    
                </div>
                
            </div>
            
        </div>
        
    </div>

</body>
</html>
