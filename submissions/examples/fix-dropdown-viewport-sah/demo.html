<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dropdown Viewport Fix - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="viewport-demo">
    <header class="top-header">
      <h1>Dropdown Viewport Fix (<code>#56078</code>)</h1>
      <p>Standard dropdowns open downwards, while dropdowns near the bottom edge pivot upward automatically via <code>ease-dropdown-up</code>.</p>
    </header>
    
    <div class="demo-spacer">
      <div class="dropdown-group">
        <button class="dropdown-trigger">Standard Top Dropdown ▼</button>
        <div class="ease-dropdown-menu">
          <a href="#">Account Profile</a>
          <a href="#">Security & Auth</a>
          <a href="#">API Tokens</a>
        </div>
      </div>
    </div>

    <footer class="bottom-bar">
      <span>Footer Control Panel</span>
      <div class="dropdown-group">
        <button class="dropdown-trigger accent">Bottom Edge Dropdown ▲</button>
        <div class="ease-dropdown-menu ease-dropdown-up">
          <a href="#">System Diagnostics</a>
          <a href="#">Export Action Log</a>
          <a href="#">Terminate Session</a>
        </div>
      </div>
    </footer>
  </div>
</body>
</html>
