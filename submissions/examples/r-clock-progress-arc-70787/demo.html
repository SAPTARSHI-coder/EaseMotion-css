<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="CSS clock progress arc showing percentage progress with an animated clock hand."
  >
  <title>CSS Clock Progress Arc</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">
    <section class="progress-card" aria-labelledby="title">
      <span class="eyebrow">EaseMotion CSS</span>

      <h1 id="title">Clock Progress</h1>
      <p class="subtitle">
        A circular progress indicator styled like a clock.
      </p>

      <div
        class="clock"
        role="img"
        aria-label="Progress is 75 percent"
      >
        <div class="clock-face">

          <span class="tick tick-1"></span>
          <span class="tick tick-2"></span>
          <span class="tick tick-3"></span>
          <span class="tick tick-4"></span>
          <span class="tick tick-5"></span>
          <span class="tick tick-6"></span>
          <span class="tick tick-7"></span>
          <span class="tick tick-8"></span>
          <span class="tick tick-9"></span>
          <span class="tick tick-10"></span>
          <span class="tick tick-11"></span>
          <span class="tick tick-12"></span>

          <div class="progress-ring">
            <div class="progress-fill"></div>
          </div>

          <div class="clock-hand">
            <span></span>
          </div>

          <div class="center-dot"></div>

          <span class="percentage">75%</span>
        </div>
      </div>

      <div class="stats">
        <div class="stat">
          <span>Completed</span>
          <strong>75%</strong>
        </div>

        <div class="stat">
          <span>Remaining</span>
          <strong>25%</strong>
        </div>
      </div>
    </section>
  </main>

</body>
</html>
