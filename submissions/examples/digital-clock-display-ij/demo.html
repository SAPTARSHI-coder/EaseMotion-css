<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-digital-clock-display demo</title>
</head>
<body>
<div class="dcd-clock">
  <div class="dcd-time">
    <b class="dcd-hour">10</b>
    <span class="dcd-colon">:</span>
    <b class="dcd-min">24</b>
    <span class="dcd-sec">08</span>
  </div>
  <div class="dcd-meta">
    <span class="dcd-ampm">PM</span>
    <span class="dcd-date">AUG 11</span>
  </div>
</div>
</body>
</html>
