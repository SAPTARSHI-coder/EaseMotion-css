<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-fitness-workout-timer demo</title>
</head>
<body>
<div class="fwt-card">
  <div class="fwt-ring"><b class="fwt-time">00:42</b></div>
  <div class="fwt-meta">
    <span class="fwt-round">ROUND 3</span>
    <b class="fwt-tag">WORK</b>
  </div>
  <div class="fwt-btns">
    <button class="fwt-start">START</button>
    <button class="fwt-stop">STOP</button>
  </div>
</div>
</body>
</html>
