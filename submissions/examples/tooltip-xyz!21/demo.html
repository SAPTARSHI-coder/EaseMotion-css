<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animated Tooltip - EaseMotion CSS Submission</title>
  
  <!-- EaseMotion CSS (Official CDN) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css">
  
  <!-- Local Tooltip Component Styles -->
  <link rel="stylesheet" href="style.css">
  
  <style>
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: var(--ease-color-bg, #f8fafc);
      color: var(--ease-color-text, #0f172a);
      gap: 3rem;
      margin: 0;
      padding: 2rem;
    }
    .demo-grid {
      display: flex;
      gap: 2rem;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
    }
    .demo-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
    }
    .label {
      font-size: 0.875rem;
      color: var(--ease-color-text-muted, #64748b);
      font-weight: 500;
    }
  </style>
</head>
<body>

  <div class="ease-center ease-fade-in">
    <h1 class="ease-slide-up">Animated Tooltip Component</h1>
    <p class="ease-slide-up ease-delay-100" style="color: var(--ease-color-text-muted, #64748b); max-width: 500px; text-align: center;">
      Zero JavaScript. Pure CSS animations leveraging EaseMotion design tokens. Fully accessible via keyboard focus.
    </p>
  </div>
  
  <div class="demo-grid ease-fade-in ease-delay-200">
    <!-- Top Tooltip (Default) -->
    <div class="demo-item">
      <button class="ease-btn ease-btn-primary ease-tooltip-xyz" data-tooltip="Save your changes">
        Hover Me (Top)
      </button>
      <span class="label">Default Position</span>
    </div>

    <!-- Bottom Tooltip -->
    <div class="demo-item">
      <button class="ease-btn ease-btn-secondary ease-tooltip-xyz ease-tooltip-xyz-bottom" data-tooltip="This appears below">
        Hover Me (Bottom)
      </button>
      <span class="label">Bottom Variant</span>
    </div>
    
    <!-- Left Tooltip -->
    <div class="demo-item">
      <a href="#" class="ease-link ease-tooltip-xyz ease-tooltip-xyz-left" data-tooltip="Extra info here" tabindex="0">
        Focus Me (Left)
      </a>
      <span class="label">Left Variant (Keyboard Accessible)</span>
    </div>

    <!-- Right Tooltip -->
    <div class="demo-item">
      <span class="ease-tooltip-xyz ease-tooltip-xyz-right" data-tooltip="Go to dashboard" tabindex="0" style="padding: 0.5rem; border: 1px dashed #cbd5e1; border-radius: 6px; cursor: help;">
        ℹ️ Hover/Focus (Right)
      </span>
      <span class="label">Right Variant</span>
    </div>
  </div>

</body>
</html>
