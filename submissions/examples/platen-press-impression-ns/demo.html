<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Platen Press Impression — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Platen Press Impression demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Platen Press Impression</h1>
      <p class="lede">Platen press closing for inked impression</p>
    </header>

    <section class="ease-platen-press-impression" data-demo="platen-press-impression" aria-live="polite">
      <div class="ease-platen-press-impression__housing">
        <div class="ease-platen-press-impression__bezel">
          <div class="ease-platen-press-impression__face">
            <div class="ease-platen-press-impression__readout">
              <span class="ease-platen-press-impression__label">Platen Press Impression</span>
              <span class="ease-platen-press-impression__value">LIVE</span>
            </div>
            <div class="ease-platen-press-impression__motion" aria-hidden="true">
              <span class="ease-platen-press-impression__a"></span>
              <span class="ease-platen-press-impression__b"></span>
              <span class="ease-platen-press-impression__c"></span>
              <span class="ease-platen-press-impression__d"></span>
            </div>
            <div class="ease-platen-press-impression__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-platen-press-impression__controls">
          <button type="button" class="ease-platen-press-impression__btn primary">Engage</button>
          <button type="button" class="ease-platen-press-impression__btn">Reset</button>
          <label class="ease-platen-press-impression__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-platen-press-impression__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
