<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glitch Flicker Stepper</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="stepper">

    <div class="step active">
        <div class="circle">1</div>
        <p>Design</p>
    </div>

    <div class="line"></div>

    <div class="step active">
        <div class="circle">2</div>
        <p>Develop</p>
    </div>

    <div class="line"></div>

    <div class="step">
        <div class="circle">3</div>
        <p>Deploy</p>
    </div>

    <div class="line"></div>

    <div class="step">
        <div class="circle">4</div>
        <p>Launch</p>
    </div>

</div>

</body>
</html>
