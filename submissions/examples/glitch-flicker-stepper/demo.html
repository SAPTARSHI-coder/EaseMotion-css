<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glitch-Flicker Stepper | EaseMotion CSS</title>
    <!-- We only link to your local style.css to prevent any missing file errors! -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="demo-container">
        
        <div class="ease-stepper" data-theme="glass" data-animation="glitch-flicker">
            
            <div class="ease-step" data-state="completed">
                <div class="ease-step-indicator">1</div>
                <div class="ease-step-content">
                    <div class="ease-step-title">Initialize</div>
                    <div class="ease-step-desc">Establish secure link</div>
                </div>
            </div>

            <div class="ease-step" data-state="active">
                <div class="ease-step-indicator">2</div>
                <div class="ease-step-content">
                    <div class="ease-step-title">Decrypting</div>
                    <div class="ease-step-desc">Bypassing firewalls</div>
                </div>
            </div>

            <div class="ease-step" data-state="pending">
                <div class="ease-step-indicator">3</div>
                <div class="ease-step-content">
                    <div class="ease-step-title">Extract</div>
                    <div class="ease-step-desc">Downloading payloads</div>
                </div>
            </div>

            <div class="ease-step" data-state="pending">
                <div class="ease-step-indicator">4</div>
                <div class="ease-step-content">
                    <div class="ease-step-title">Disconnect</div>
                    <div class="ease-step-desc">Erase footprint</div>
                </div>
            </div>

        </div>

    </main>

</body>
</html>
