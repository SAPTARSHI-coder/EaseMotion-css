<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teleportation · disappears and reappears elsewhere</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <div class="teleport-container">
      <div class="teleport-display" id="teleportDisplay">
        <!-- Teleport Subject -->
        <div class="teleport-subject" id="teleportSubject">
          <div class="subject-visual">
            <div class="subject-icon">🧙</div>
            <div class="subject-glow"></div>
          </div>
          <div class="subject-label">Wizard</div>
        </div>

        <!-- Portal Rings -->
        <div class="portal-ring ring-1" id="portalRing1"></div>
        <div class="portal-ring ring-2" id="portalRing2"></div>
        <div class="portal-ring ring-3" id="portalRing3"></div>

        <!-- Afterimage Trail -->
        <div class="afterimage-trail" id="afterimageTrail"></div>

        <!-- Teleport Particles -->
        <div class="teleport-particles" id="teleportParticles"></div>

        <!-- Destination Marker -->
        <div class="destination-marker" id="destinationMarker">
          <div class="marker-ring"></div>
          <div class="marker-ring"></div>
          <div class="marker-ring"></div>
        </div>

        <!-- Teleport Counter -->
        <div class="teleport-counter">
          <span class="counter-label">🌀 Teleports</span>
          <span class="counter-value" id="teleportCount">0</span>
        </div>
      </div>
      
      <div class="teleport-status">
        <span id="teleportStatus">🌀 Click to teleport</span>
      </div>
    </div>

    <div class="controls">
      <button class="btn btn-teleport" id="teleportBtn">🌀 Teleport!</button>
      <button class="btn btn-mode" id="modeBtn">🎨 Toggle Style</button>
      <button class="btn btn-reset" id="resetBtn">⟳ Reset</button>
    </div>
    <div class="footer-note">
      <span>🌀 disappears · reappears · portal effect · afterimages</span>
    </div>
  </div>

  <script>
    (function() {
      "use strict";

      // DOM refs
      const subject = document.getElementById('teleportSubject');
      const teleportDisplay = document.getElementById('teleportDisplay');
      const portalRing1 = document.getElementById('portalRing1');
      const portalRing2 = document.getElementById('portalRing2');
      const portalRing3 = document.getElementById('portalRing3');
      const afterimageTrail = document.getElementById('afterimageTrail');
      const teleportParticles = document.getElementById('teleportParticles');
      const destinationMarker = document.getElementById('destinationMarker');
      const teleportCount = document.getElementById('teleportCount');
      const teleportStatus = document.getElementById('teleportStatus');
      const teleportBtn = document.getElementById('teleportBtn');
      const modeBtn = document.getElementById('modeBtn');
      const resetBtn = document.getElementById('resetBtn');

      // State
      let count = 0;
      let isTeleporting = false;
      let styleIndex = 0;
      let currentX = 50;
      let currentY = 50;
      let targetX = 50;
      let targetY = 50;

      // Teleport styles
      const styles = [
        {
          name: 'Magic',
          colors: ['#818cf8', '#a78bfa', '#c4b5fd'],
          glow: 'rgba(99, 102, 241, 0.3)',
          icon: '🌀'
        },
        {
          name: 'Fire',
          colors: ['#ef4444', '#f97316', '#fb923c'],
          glow: 'rgba(239, 68, 68, 0.3)',
          icon: '🔥'
        },
        {
          name: 'Lightning',
          colors: ['#fbbf24', '#f59e0b', '#fcd34d'],
          glow: 'rgba(251, 191, 36, 0.3)',
          icon: '⚡'
        },
        {
          name: 'Shadow',
          colors: ['#64748b', '#475569', '#334155'],
          glow: 'rgba(100, 116, 139, 0.3)',
          icon: '🌑'
        }
      ];

      // Create afterimage
      function createAfterimage(x, y, style) {
        const afterimage = document.createElement('div');
        afterimage.className = 'afterimage';
        
        const size = 60 + Math.random() * 20;
        afterimage.style.width = size + 'px';
        afterimage.style.height = size + 'px';
        afterimage.style.left = x + '%';
        afterimage.style.top = y + '%';
        afterimage.style.transform = 'translate(-50%, -50%)';
        afterimage.style.background = `radial-gradient(ellipse at center, ${style.colors[0]}, ${style.colors[1]})`;
        afterimage.style.boxShadow = `0 0 40px ${style.glow}`;
        afterimage.style.opacity = 0.3 + Math.random() * 0.3;
        
        // Random rotation
        afterimage.style.setProperty('--rot', (Math.random() * 720 - 360) + 'deg');
        
        // Random scale
        afterimage.style.setProperty('--scale', (0.5 + Math.random() * 0.5));
        
        afterimageTrail.appendChild(afterimage);
        
        setTimeout(() => {
          afterimage.remove();
        }, 1000);
      }

      // Create teleport particles
      function createTeleportParticles(x, y, style, count = 30) {
        for (let i = 0; i < count; i++) {
          setTimeout(() => {
            const particle = document.createElement('div');
            particle.className = 'teleport-particle';
            
            const size = Math.random() * 8 + 3;
            particle.style.width = size + 'px';
            particle.style.height = size + 'px';
            particle.style.left = x + '%';
            particle.style.top = y + '%';
            particle.style.transform = 'translate(-50%, -50%)';
            
            const color = style.colors[Math.floor(Math.random() * style.colors.length)];
            particle.style.backgroundColor = color;
            particle.style.boxShadow = `0 0 ${size * 2}px ${color}66`;
            
            const angle = Math.random() * Math.PI * 2;
            const distance = 50 + Math.random() * 120;
            particle.style.setProperty('--tx', Math.cos(angle) * distance + 'px');
            particle.style.setProperty('--ty', Math.sin(angle) * distance + 'px');
            
            particle.style.animationDuration = (Math.random() * 0.6 + 0.6) + 's';
            particle.style.animationDelay = (Math.random() * 0.3) + 's';
            
            teleportParticles.appendChild(particle);
            
            setTimeout(() => {
              particle.remove();
            }, 2000);
          }, i * 20);
        }
      }

      // Create portal ring burst
      function createPortalBurst(x, y) {
        const rings = [portalRing1, portalRing2, portalRing3];
        rings.forEach((ring, index) => {
          const style = styles[styleIndex];
          ring.style.borderColor = style.colors[index % style.colors.length];
          ring.style.boxShadow = `0 0 40px ${style.glow}`;
          ring.style.left = x + '%';
          ring.style.top = y + '%';
          ring.style.transform = 'translate(-50%, -50%) scale(0.5)';
          ring.style.opacity = 1;
          
          // Animate outward
          setTimeout(() => {
            ring.style.transform = `translate(-50%, -50%) scale(${1.5 + index * 0.5})`;
            ring.style.opacity = 0;
          }, 50);
        });
      }

      // Show destination marker
      function showDestination(x, y) {
        destinationMarker.style.left = x + '%';
        destinationMarker.style.top = y + '%';
        destinationMarker.style.opacity = 1;
        destinationMarker.style.transform = 'translate(-50%, -50%) scale(1)';
        
        const style = styles[styleIndex];
        const rings = destinationMarker.querySelectorAll('.marker-ring');
        rings.forEach((ring, index) => {
          ring.style.borderColor = style.colors[index % style.colors.length];
          ring.style.boxShadow = `0 0 30px ${style.glow}`;
        });
        
        setTimeout(() => {
          destinationMarker.style.opacity = 0;
          destinationMarker.style.transform = 'translate(-50%, -50%) scale(1.5)';
        }, 800);
      }

      // Perform teleport
      function teleport() {
        if (isTeleporting) return;
        isTeleporting = true;

        const style = styles[styleIndex];
        const rect = teleportDisplay.getBoundingClientRect();
        
        // Store current position
        const startX = currentX;
        const startY = currentY;
        
        // Generate random destination (avoid edges)
        const endX = 10 + Math.random() * 80;
        const endY = 10 + Math.random() * 80;
        
        // Create afterimages at start position
        for (let i = 0; i < 5; i++) {
          setTimeout(() => {
            createAfterimage(startX, startY, style);
          }, i * 80);
        }
        
        // Create portal burst at start
        createPortalBurst(startX, startY);
        
        // Create particles at start
        createTeleportParticles(startX, startY, style, 30);
        
        // Fade subject out
        subject.style.opacity = '0';
        subject.style.transform = 'translate(-50%, -50%) scale(0.5)';
        
        // Update status
        teleportStatus.textContent = '🌀 Teleporting...';
        teleportStatus.style.color = style.colors[0];
        
        // After delay, reappear at destination
        setTimeout(() => {
          // Update position
          currentX = endX;
          currentY = endY;
          subject.style.left = endX + '%';
          subject.style.top = endY + '%';
          
          // Show destination marker
          showDestination(endX, endY);
          
          // Create arrival particles
          createTeleportParticles(endX, endY, style, 20);
          
          // Fade subject in
          subject.style.opacity = '1';
          subject.style.transform = 'translate(-50%, -50%) scale(1)';
          
          // Update subject colors
          const icon = subject.querySelector('.subject-icon');
          const glow = subject.querySelector('.subject-glow');
          icon.style.color = style.colors[0];
          glow.style.background = `radial-gradient(circle, ${style.glow}, transparent)`;
          
          // Update counter
          count++;
          teleportCount.textContent = count;
          
          // Update status
          teleportStatus.textContent = `✨ Teleported! (${count})`;
          teleportStatus.style.color = '#4ade80';
          
          setTimeout(() => {
            teleportStatus.textContent = '🌀 Click to teleport again';
            teleportStatus.style.color = '#94a3b8';
          }, 1500);
          
          isTeleporting = false;
        }, 600);
      }

      // Toggle style
      function toggleStyle() {
        styleIndex = (styleIndex + 1) % styles.length;
        const style = styles[styleIndex];
        modeBtn.textContent = `🎨 ${style.icon} ${style.name}`;
        
        // Update subject
        const icon = subject.querySelector('.subject-icon');
        const glow = subject.querySelector('.subject-glow');
        icon.style.color = style.colors[0];
        glow.style.background = `radial-gradient(circle, ${style.glow}, transparent)`;
        
        teleportStatus.textContent = `🎨 Style: ${style.name}`;
        teleportStatus.style.color = style.colors[0];
        setTimeout(() => {
          teleportStatus.textContent = '🌀 Click to teleport';
          teleportStatus.style.color = '#94a3b8';
        }, 1500);
      }

      // Reset
      function resetTeleport() {
        if (isTeleporting) return;
        
        // Clear effects
        afterimageTrail.innerHTML = '';
        teleportParticles.innerHTML = '';
        destinationMarker.style.opacity = 0;
        
        // Reset position
        currentX = 50;
        currentY = 50;
        subject.style.left = '50%';
        subject.style.top = '50%';
        subject.style.opacity = '1';
        subject.style.transform = 'translate(-50%, -50%) scale(1)';
        
        // Reset counter
        count = 0;
        teleportCount.textContent = '0';
        
        teleportStatus.textContent = '🔄 Reset complete';
        teleportStatus.style.color = '#94a3b8';
        setTimeout(() => {
          teleportStatus.textContent = '🌀 Click to teleport';
        }, 1000);
      }

      // Event listeners
      if (teleportBtn) {
        teleportBtn.addEventListener('click', function(e) {
          e.preventDefault();
          teleport();
        });
      }

      if (modeBtn) {
        modeBtn.addEventListener('click', function(e) {
          e.preventDefault();
          toggleStyle();
        });
      }

      if (resetBtn) {
        resetBtn.addEventListener('click', function(e) {
          e.preventDefault();
          resetTeleport();
        });
      }

      // Click on display to teleport
      teleportDisplay.addEventListener('click', function(e) {
        if (e.target === this || e.target.closest('.teleport-subject')) {
          teleport();
        }
      });

      // Keyboard shortcuts
      document.addEventListener('keydown', function(e) {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

        const key = e.key;
        if (key === ' ' || key === 'Space') {
          e.preventDefault();
          teleport();
        } else if (key === 't' || key === 'T') {
          e.preventDefault();
          teleport();
        } else if (key === 's' || key === 'S') {
          e.preventDefault();
          toggleStyle();
        } else if (key === 'r' || key === 'R') {
          e.preventDefault();
          resetTeleport();
        }
      });

      // Initialize
      const initialStyle = styles[0];
      const icon = subject.querySelector('.subject-icon');
      const glow = subject.querySelector('.subject-glow');
      icon.style.color = initialStyle.colors[0];
      glow.style.background = `radial-gradient(circle, ${initialStyle.glow}, transparent)`;
      modeBtn.textContent = `🎨 ${initialStyle.icon} ${initialStyle.name}`;
      
      console.log('🌀 Teleportation ready · shortcuts: [Space/T] Teleport, [S] Style, [R] Reset');
    })();
  </script>
</body>
</html>
