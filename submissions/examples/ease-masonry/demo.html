<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pure CSS Masonry Demo</title>
  <link rel="stylesheet" href="../../../easemotion.css">
  <link rel="stylesheet" href="./style.css">
  <style>
    body {
      background-color: #f1f5f9;
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 2rem;
    }

    h1 {
      text-align: center;
      color: #0f172a;
      margin-bottom: 2rem;
    }

    /* Dummy content styles for the demo items */
    .demo-item {
      background: white;
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      font-weight: 600;
      color: #475569;
    }

    /* Variable heights to demonstrate the masonry effect */
    .h-small { height: 150px; }
    .h-med { height: 250px; }
    .h-large { height: 350px; }
  </style>
</head>
<body>

  <h1>CSS-Only Masonry Grid</h1>

  <div class="ease-masonry">
    <!-- Notice the --delay variable used for the staggered entrance animation -->
    <div class="ease-masonry-item demo-item h-med" style="--delay: 1">Item 1<br>(Medium)</div>
    <div class="ease-masonry-item demo-item h-small" style="--delay: 2">Item 2<br>(Small)</div>
    <div class="ease-masonry-item demo-item h-large" style="--delay: 3">Item 3<br>(Large)</div>
    <div class="ease-masonry-item demo-item h-small" style="--delay: 4">Item 4<br>(Small)</div>
    <div class="ease-masonry-item demo-item h-med" style="--delay: 5">Item 5<br>(Medium)</div>
    <div class="ease-masonry-item demo-item h-small" style="--delay: 6">Item 6<br>(Small)</div>
    <div class="ease-masonry-item demo-item h-large" style="--delay: 7">Item 7<br>(Large)</div>
    <div class="ease-masonry-item demo-item h-med" style="--delay: 8">Item 8<br>(Medium)</div>
    <div class="ease-masonry-item demo-item h-small" style="--delay: 9">Item 9<br>(Small)</div>
  </div>

</body>
</html>
