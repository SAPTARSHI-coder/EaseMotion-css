<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drop Hammer Forge — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Drop Hammer Forge demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Drop Hammer Forge</h1>
      <p class="lede">Industrial drop hammer falling onto hot metal</p>
    </header>

    <section class="ease-drop-hammer-forge" data-demo="drop-hammer-forge" aria-live="polite">
      <div class="ease-drop-hammer-forge__housing">
        <div class="ease-drop-hammer-forge__bezel">
          <div class="ease-drop-hammer-forge__face">
            <div class="ease-drop-hammer-forge__readout">
              <span class="ease-drop-hammer-forge__label">Drop Hammer Forge</span>
              <span class="ease-drop-hammer-forge__value">LIVE</span>
            </div>
            <div class="ease-drop-hammer-forge__motion" aria-hidden="true">
              <span class="ease-drop-hammer-forge__a"></span>
              <span class="ease-drop-hammer-forge__b"></span>
              <span class="ease-drop-hammer-forge__c"></span>
              <span class="ease-drop-hammer-forge__d"></span>
            </div>
            <div class="ease-drop-hammer-forge__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-drop-hammer-forge__controls">
          <button type="button" class="ease-drop-hammer-forge__btn primary">Engage</button>
          <button type="button" class="ease-drop-hammer-forge__btn">Reset</button>
          <label class="ease-drop-hammer-forge__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-drop-hammer-forge__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
