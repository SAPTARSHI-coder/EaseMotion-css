<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ease Multi-Layered Border Spotlight Bento Card</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="spot-card-body">
  <div class="spot-card" id="sCard">
    <div class="spot-inner">
      <h3>Spotlight Bento Card</h3>
      <p>Move mouse over card to illuminate gradient border beams.</p>
    </div>
  </div>

  <script>
    const sCard = document.getElementById('sCard');
    sCard.addEventListener('mousemove', (e) => {
      const rect = sCard.getBoundingClientRect();
      sCard.style.setProperty('--m-x', `${e.clientX - rect.left}px`);
      sCard.style.setProperty('--m-y', `${e.clientY - rect.top}px`);
    });
  </script>
</body>
</html>
