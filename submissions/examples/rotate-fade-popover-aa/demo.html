<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Rotate-Fade Popover</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="rfp-dashboard">
    <div class="rfp-wrap">
      <input type="checkbox" id="rfp-toggle" class="rfp-checkbox">
      <label for="rfp-toggle" class="rfp-trigger">
        Account Balance
      </label>
      <div class="rfp-popover">
        <div class="rfp-popover-inner">
          <h4>$48,203.12</h4>
          <p>+2.4% this week</p>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
