<!-- EaseMotion component: tag-cloud-explorer -->
<!DOCTYPE html>
<html lang="en" data-tag="cloud">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.1">
<title>Ease Tag Cloud Explorer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="tag-cloud">
  <header class="cloud-title">
    <h1 class="cloud-heading">TAG CLOUD</h1>
    <span class="cloud-count">48 topics</span>
  </header>
  <div class="cloud-field">
    <span class="cloud-tag size-xl">html</span>
    <span class="cloud-tag size-lg">css</span>
    <span class="cloud-tag size-md">javascript</span>
    <span class="cloud-tag size-sm">python</span>
    <span class="cloud-tag size-xl">react</span>
    <span class="cloud-tag size-lg">design</span>
    <span class="cloud-tag size-md">animation</span>
    <span class="cloud-tag size-sm">sass</span>
    <span class="cloud-tag size-md">typescript</span>
    <span class="cloud-tag size-sm">node</span>
    <span class="cloud-tag size-xl">css-grid</span>
    <span class="cloud-tag size-lg">svg</span>
    <span class="cloud-tag size-md">canvas</span>
    <span class="cloud-tag size-sm">gulp</span>
    <span class="cloud-tag size-lg">accessibility</span>
    <span class="cloud-tag size-md">webgl</span>
    <span class="cloud-tag size-sm">markdown</span>
    <span class="cloud-tag size-xl">frontend</span>
    <span class="cloud-tag size-md">figma</span>
    <span class="cloud-tag size-sm">vite</span>
  </div>
  <footer class="cloud-nav">
    <button class="cloud-btn">POPULAR</button>
    <button class="cloud-btn">RECENT</button>
  </footer>
</main>
</body>
</html>
