<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>High Contrast Mode forced-colors Input Audit Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Screen Reader Live Region for Dynamic Announcements -->
  <div 
    id="a11y-announcer" 
    class="sr-only" 
    role="status" 
    aria-live="polite" 
    aria-atomic="true"
  ></div>

  <main id="main-content" tabindex="-1">
    <h1>Form Input Forced-Colors Audit</h1>
    <p>
      Inspect form inputs under Windows High Contrast Mode (<code>forced-colors: active</code>). 
      Explicit 2px borders, system field colors, focus indicators, and dashed error borders remain fully visible.
    </p>

    <form id="audit-form" novalidate>
      
      <!-- Field 1: Standard Input -->
      <div class="form-group">
        <label for="username-input">Username (Required)</label>
        <input 
          type="text" 
          id="username-input" 
          class="input-control" 
          name="username" 
          aria-required="true"
          autocomplete="off"
        >
      </div>

      <!-- Field 2: Input with Validation and aria-describedby -->
      <div class="form-group">
        <label for="email-input">Work Email (Required)</label>
        <input 
          type="text" 
          id="email-input" 
          class="input-control" 
          name="email" 
          aria-required="true"
          aria-describedby="email-error"
          autocomplete="off"
        >
        <div id="email-error" class="error-message" role="alert" style="display: none;">
          <span>⚠️ Please enter a valid email address (e.g., user@domain.com).</span>
        </div>
      </div>

      <button type="submit" id="submit-btn" class="btn-submit">
        <span>Submit Registration</span>
      </button>

    </form>
  </main>

  <script src="input-controller.js"></script>
</body>
</html>
