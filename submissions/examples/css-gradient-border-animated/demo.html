<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Accessible animated CSS gradient border component."
  >
  <title>CSS Gradient Border Animated</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="page">
    <section
      class="gradient-border-card"
      aria-labelledby="gradient-border-title"
    >
      <div class="card-content">
        <p class="eyebrow">EaseMotion CSS</p>

        <h1 id="gradient-border-title">
          Animated Gradient Border
        </h1>

        <p>
          A continuously rotating gradient border created entirely with CSS.
          No JavaScript required.
        </p>

        <a
          class="demo-link"
          href="#gradient-border-demo"
          aria-label="View the animated gradient border demo"
        >
          Explore Demo
        </a>
      </div>
    </section>
  </main>
</body>
</html>
