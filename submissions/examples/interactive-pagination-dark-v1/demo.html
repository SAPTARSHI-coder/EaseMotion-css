<!-- submissions/examples/interactive-pagination-dark/demo.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Pagination (Dark Mode) | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="demo-container">
    
    <!-- Dark Mode Pagination Component -->
    <nav class="ease-pagination" aria-label="Pagination Navigation">
      <ul class="ease-page-list">
        
        <!-- Previous Button -->
        <li>
          <a href="#" class="ease-page-link prev disabled" aria-label="Previous Page" aria-disabled="true">Prev</a>
        </li>
        
        <!-- Page Numbers -->
        <li class="active-item">
          <a href="#" class="ease-page-link active" aria-current="page" aria-label="Page 1">1</a>
        </li>
        <li><a href="#" class="ease-page-link" aria-label="Page 2">2</a></li>
        <li><a href="#" class="ease-page-link" aria-label="Page 3">3</a></li>
        <li><a href="#" class="ease-page-link" aria-label="Page 4">4</a></li>
        
        <!-- Ellipsis -->
        <li><span class="ease-page-ellipsis">&hellip;</span></li>
        
        <!-- Last Page -->
        <li><a href="#" class="ease-page-link" aria-label="Page 10">10</a></li>
        
        <!-- Next Button -->
        <li>
          <a href="#" class="ease-page-link next" aria-label="Next Page">Next</a>
        </li>

      </ul>
    </nav>

  </main>

</body>
</html>
