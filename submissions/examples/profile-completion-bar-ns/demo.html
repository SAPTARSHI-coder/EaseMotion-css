<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Profile Completion Bar | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="profile-demo-container">
    
    <!-- Profile Completion Card Component -->
    <article class="ease-profile-card" aria-label="Profile Completion Status">
      
      <header class="ease-profile-header">
        <div class="ease-profile-title-group">
          <h2>Profile Strength</h2>
          <p>Complete your details to unlock full access</p>
        </div>
        <div class="ease-profile-percentage" aria-hidden="true">75%</div>
      </header>

      <!-- Accessible Progress Bar Track -->
      <div class="ease-progress-track" role="progressbar" aria-valuenow="75" aria-valuemin="0" aria-valuemax="100" aria-label="Profile completion progress: 75 percent">
        <div class="ease-progress-fill"></div>
      </div>

      <!-- Actionable Improvement Tips -->
      <section class="ease-tips-section" aria-label="Next steps to complete profile">
        <h3 class="ease-tips-heading">Recommended Steps</h3>
        
        <!-- Completed Tip -->
        <div class="ease-tip-item completed">
          <div class="ease-tip-content">
            <div class="ease-tip-icon" aria-hidden="true">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
            </div>
            <span class="ease-tip-text">Verify email address</span>
          </div>
          <span class="ease-tip-action">Done</span>
        </div>

        <!-- Pending Tip -->
        <div class="ease-tip-item pending">
          <div class="ease-tip-content">
            <div class="ease-tip-icon" aria-hidden="true">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
            </div>
            <span class="ease-tip-text">Add a profile bio (+15%)</span>
          </div>
          <a href="#bio" class="ease-tip-action">Add Bio</a>
        </div>

      </section>

    </article>

  </main>

</body>
</html>
