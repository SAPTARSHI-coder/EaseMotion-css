<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EaseMotion CSS - Cinematic Liquid Mask Reveal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="ease-support-warning">Your browser may not fully support the CSS @property API. Upgrading to a modern browser is recommended.</div>
  <div class="ease-liquid-wrapper">
    <!-- Base Layer (Visible initially) -->
    <div class="ease-layer-base">
      <h2>Hover to Reveal</h2>
      <p>Awaiting interaction...</p>
    </div>
    <!-- Reveal Layer (Masked initially) -->
    <div class="ease-layer-reveal">
      <h2>Cinematic Liquid Reveal</h2>
      <p>Powered purely by CSS @property and mask-image gradients.</p>
    </div>
  </div>
  <p style="position: absolute; bottom: 2rem; color: #64748b; font-size: 0.875rem; text-transform: uppercase; letter-spacing: 2px;">Zero SVG. Zero JavaScript.</p>
</body>
</html>
