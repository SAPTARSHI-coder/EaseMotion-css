<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Online Presence Status Dots</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      margin: 0; min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 1rem; padding: 24px;
      background: linear-gradient(160deg, #f8fafc, #eef2ff 55%, #f8fafc);
      color: #111827; font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    }
    h1 { margin: 0; font-size: 1.25rem; text-align: center; }
    .note { margin: 0; max-width: 420px; text-align: center; color: #4b5563; font-size: 0.92rem; line-height: 1.45; }
  </style>
</head>
<body>
  <h1>Online Presence Status Dots</h1>
  
  <div class="row">
<div class="presence"><span class="ph"></span><span class="presence__dot presence__dot--online" aria-label="Online"></span></div>
<div class="presence"><span class="ph"></span><span class="presence__dot presence__dot--away" aria-label="Away"></span></div>
<div class="presence"><span class="ph"></span><span class="presence__dot presence__dot--busy" aria-label="Busy"></span></div>
<div class="presence"><span class="ph"></span><span class="presence__dot presence__dot--offline" aria-label="Offline"></span></div>
</div>
  
</body>
</html>
