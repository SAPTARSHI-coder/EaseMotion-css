<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tour Wheel Escape — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Tour Wheel Escape demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Tour Wheel Escape</h1>
      <p class="lede">CSS-only motion metaphor for tour wheel escape</p>
    </header>

    <section class="ease-tour-wheel-escape" data-demo="tour-wheel-escape" aria-live="polite">
      <div class="ease-tour-wheel-escape__housing">
        <div class="ease-tour-wheel-escape__bezel">
          <div class="ease-tour-wheel-escape__face">
            <div class="ease-tour-wheel-escape__readout">
              <span class="ease-tour-wheel-escape__label">Tour Wheel Escape</span>
              <span class="ease-tour-wheel-escape__value">LIVE</span>
            </div>
            <div class="ease-tour-wheel-escape__motion" aria-hidden="true">
              <span class="ease-tour-wheel-escape__a"></span>
              <span class="ease-tour-wheel-escape__b"></span>
              <span class="ease-tour-wheel-escape__c"></span>
              <span class="ease-tour-wheel-escape__d"></span>
            </div>
            <div class="ease-tour-wheel-escape__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-tour-wheel-escape__controls">
          <button type="button" class="ease-tour-wheel-escape__btn primary">Engage</button>
          <button type="button" class="ease-tour-wheel-escape__btn">Reset</button>
          <label class="ease-tour-wheel-escape__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-tour-wheel-escape__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
