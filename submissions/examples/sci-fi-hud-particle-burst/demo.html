<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    name="description"
    content="Pure CSS Sci-Fi HUD Particle Burst animation"
  />
  <title>Sci-Fi HUD • Particle Burst</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

<main class="scene">

  <section class="hud-card">

    <div class="scan-ring ring-1"></div>
    <div class="scan-ring ring-2"></div>
    <div class="scan-ring ring-3"></div>

    <div class="burst">

      <span style="--r:0deg"></span>
      <span style="--r:20deg"></span>
      <span style="--r:40deg"></span>
      <span style="--r:60deg"></span>
      <span style="--r:80deg"></span>
      <span style="--r:100deg"></span>
      <span style="--r:120deg"></span>
      <span style="--r:140deg"></span>
      <span style="--r:160deg"></span>
      <span style="--r:180deg"></span>
      <span style="--r:200deg"></span>
      <span style="--r:220deg"></span>
      <span style="--r:240deg"></span>
      <span style="--r:260deg"></span>
      <span style="--r:280deg"></span>
      <span style="--r:300deg"></span>
      <span style="--r:320deg"></span>
      <span style="--r:340deg"></span>

    </div>

    <div class="core"></div>

    <h1>PARTICLE<br>BURST</h1>

    <p>Pure CSS • Sci-Fi HUD Interface</p>

  </section>

</main>

</body>
</html>
