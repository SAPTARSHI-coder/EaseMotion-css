<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Accessible CSS animated location pin with a drop and bounce animation."
  >
  <title>CSS Animated Location Pin</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="page">
    <section class="demo-card" aria-labelledby="demo-title">
      <h1 id="demo-title">CSS Animated Location Pin</h1>
      <p class="description">
        A location pin that drops into position with a smooth bounce animation.
      </p>

      <div class="map" aria-label="Location pin animation demo">
        <button
          class="location-pin"
          type="button"
          aria-label="Selected location"
        >
          <span class="pin-head" aria-hidden="true"></span>
          <span class="pin-shadow" aria-hidden="true"></span>
        </button>
      </div>

      <p class="hint">
        Click the pin to replay the animation.
      </p>
    </section>
  </main>

  <script>
    const pin = document.querySelector(".location-pin");

    pin.addEventListener("click", () => {
      pin.classList.remove("replay");

      void pin.offsetWidth;

      pin.classList.add("replay");
    });
  </script>
</body>
</html>
