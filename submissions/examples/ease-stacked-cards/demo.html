<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ease Stacked Cards - CSS View Timelines</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Stacked Cards</h1>
    <p>Scroll down to see the native CSS View Timeline card stacking effect.</p>
  </header>

  <div class="ease-stacked-wrapper">
    <div class="ease-stacked-card card-1">
      <h2>Card One</h2>
      <p>Sticks and scales down natively.</p>
    </div>
    <div class="ease-stacked-card card-2">
      <h2>Card Two</h2>
      <p>GPU accelerated transitions.</p>
    </div>
    <div class="ease-stacked-card card-3">
      <h2>Card Three</h2>
      <p>Zero JavaScript required.</p>
    </div>
    <div class="ease-stacked-card card-4">
      <h2>Card Four</h2>
      <p>End of stack.</p>
    </div>
  </div>
</body>
</html>
