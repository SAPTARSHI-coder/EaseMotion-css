<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real-time Physics Spring Motion Engine Plugin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../easemotion.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>Real-Time Physics Spring Motion Engine</h1>
      <p>Simulating dynamic mass, stiffness, and damping spring physics in CSS.</p>
    </header>

    <main class="demo-stage">
      <div class="spring-box-wrapper">
        <div class="spring-box" id="springBox">
          <span>Spring Target</span>
        </div>
      </div>

      <div class="controls">
        <button class="btn" onclick="triggerSpring('light')">Light Spring (Soft)</button>
        <button class="btn" onclick="triggerSpring('bouncy')">Heavy Bouncy</button>
        <button class="btn" onclick="triggerSpring('stiff')">Stiff Snap</button>
      </div>
    </main>
  </div>

  <script>
    function triggerSpring(type) {
      const box = document.getElementById('springBox');
      box.className = 'spring-box spring-anim-' + type;
      setTimeout(() => {
        box.className = 'spring-box';
      }, 1000);
    }
  </script>
</body>
</html>
