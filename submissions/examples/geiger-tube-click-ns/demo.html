<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Geiger Tube Click — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Geiger Tube Click demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Geiger Tube Click</h1>
      <p class="lede">Geiger tube ionization pulses flashing on a counter</p>
    </header>

    <section class="ease-geiger-tube-click" data-demo="geiger-tube-click" aria-live="polite">
      <div class="ease-geiger-tube-click__housing">
        <div class="ease-geiger-tube-click__bezel">
          <div class="ease-geiger-tube-click__face">
            <div class="ease-geiger-tube-click__readout">
              <span class="ease-geiger-tube-click__label">Geiger Tube Click</span>
              <span class="ease-geiger-tube-click__value">LIVE</span>
            </div>
            <div class="ease-geiger-tube-click__motion" aria-hidden="true">
              <span class="ease-geiger-tube-click__a"></span>
              <span class="ease-geiger-tube-click__b"></span>
              <span class="ease-geiger-tube-click__c"></span>
              <span class="ease-geiger-tube-click__d"></span>
            </div>
            <div class="ease-geiger-tube-click__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-geiger-tube-click__controls">
          <button type="button" class="ease-geiger-tube-click__btn primary">Engage</button>
          <button type="button" class="ease-geiger-tube-click__btn">Reset</button>
          <label class="ease-geiger-tube-click__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-geiger-tube-click__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
