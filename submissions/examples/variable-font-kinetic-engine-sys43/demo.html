<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Variable Font Kinetic Weight & Slant Interpolation Engine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,100..1000&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../easemotion.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>Variable Font Kinetic Engine</h1>
      <p>Continuous font-variation-settings interpolation driven by pointer proximity.</p>
    </header>

    <main class="stage">
      <h2 class="kinetic-text" id="kineticText">KINETIC TYPE</h2>
    </main>
  </div>

  <script>
    const text = document.getElementById('kineticText');
    document.addEventListener('mousemove', (e) => {
      const rect = text.getBoundingClientRect();
      const dist = Math.hypot(e.clientX - (rect.left + rect.width/2), e.clientY - (rect.top + rect.height/2));
      const wght = Math.max(100, Math.min(1000, 1000 - dist * 2));
      text.style.fontVariationSettings = `'wght' ${wght}`;
    });
  </script>
</body>
</html>
