<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Animated numbered list built with pure CSS"
  >
  <title>CSS Numbered List Animated</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="demo-container">
    <section class="card" aria-labelledby="title">

      <h1 id="title">CSS Numbered List</h1>
      <p class="subtitle">
        Numbers count up as each item appears.
      </p>

      <ol class="animated-list">
        <li style="--item-index: 1;">
          <span class="item-content">Plan your project</span>
        </li>

        <li style="--item-index: 2;">
          <span class="item-content">Design the interface</span>
        </li>

        <li style="--item-index: 3;">
          <span class="item-content">Build the components</span>
        </li>

        <li style="--item-index: 4;">
          <span class="item-content">Test the experience</span>
        </li>

        <li style="--item-index: 5;">
          <span class="item-content">Launch the project</span>
        </li>
      </ol>

    </section>
  </main>

</body>
</html>
