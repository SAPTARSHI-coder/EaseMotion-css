<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Vertical Accordion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="accordion">

    <input type="radio" name="accordion" id="panel1" checked>
    <label for="panel1">Profile</label>
    <div class="content">
        <p>User profile settings and account preferences.</p>
    </div>

    <input type="radio" name="accordion" id="panel2">
    <label for="panel2">Security</label>
    <div class="content">
        <p>Password management and authentication settings.</p>
    </div>

    <input type="radio" name="accordion" id="panel3">
    <label for="panel3">Notifications</label>
    <div class="content">
        <p>Email and push notification preferences.</p>
    </div>

</div>

</body>
</html>
