<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Subtle Elevate CSS 3D Effect">
  <title>Subtle Elevate - CSS 3D Effect</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="demo-container">
    <section class="demo" aria-labelledby="demo-title">
      <p class="eyebrow">CSS 3D Effect</p>

      <h1 id="demo-title">Subtle Elevate</h1>

      <div class="scene">
        <article class="elevate-card">
          <div class="card-content">
            <span class="card-number">01</span>

            <h2>Elevate</h2>

            <p>
              A subtle 3D interaction created entirely with HTML and CSS.
              Hover over the card to see it gently rise from the surface.
            </p>

            <span class="card-action">Explore →</span>
          </div>
        </article>
      </div>

      <p class="hint">Hover or focus the card</p>
    </section>
  </main>
</body>
</html>
