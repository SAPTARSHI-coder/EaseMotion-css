<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <meta
    name="description"
    content="3D pagination component with neon styling."
  />

  <title>3D Pagination — Neon</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <main class="page">

    <section class="demo">

      <span class="eyebrow">EASEMOTION CSS</span>

      <h1>3D Pagination</h1>

      <p class="intro">
        A responsive pagination component with layered 3D depth,
        neon accents, and smooth interactive states.
      </p>

      <nav
        class="pagination"
        aria-label="Pagination"
      >

        <a
          class="pagination__button pagination__button--arrow"
          href="#"
          aria-label="Previous page"
        >
          ‹
        </a>

        <a
          class="pagination__button pagination__button--active"
          href="#"
          aria-current="page"
        >
          1
        </a>

        <a
          class="pagination__button"
          href="#"
        >
          2
        </a>

        <a
          class="pagination__button"
          href="#"
        >
          3
        </a>

        <span class="pagination__dots">
          ...
        </span>

        <a
          class="pagination__button"
          href="#"
        >
          8
        </a>

        <a
          class="pagination__button pagination__button--arrow"
          href="#"
          aria-label="Next page"
        >
          ›
        </a>

      </nav>

      <div class="pagination-info">
        <span>Showing</span>
        <strong>1–8</strong>
        <span>of</span>
        <strong>64 results</strong>
      </div>

    </section>

  </main>

</body>
</html>
