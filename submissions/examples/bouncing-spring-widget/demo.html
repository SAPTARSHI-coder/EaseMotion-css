<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Bouncing Spring dashboard widget built with pure HTML and CSS."
  >
  <title>Bouncing Spring Widget</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">
    <section class="widget" aria-labelledby="widget-title">

      <div class="widget-header">
        <div>
          <p class="eyebrow">DASHBOARD WIDGET</p>
          <h1 id="widget-title">Bouncing Spring</h1>
        </div>

        <span class="status">
          <span class="status-dot" aria-hidden="true"></span>
          Live
        </span>
      </div>

      <div class="metric">
        <span class="metric-value">84</span>
        <span class="metric-unit">%</span>
      </div>

      <p class="description">
        System performance is operating smoothly with a responsive spring
        animation.
      </p>

      <div class="spring-visual" aria-hidden="true">
        <div class="spring">
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
        </div>

        <div class="spring-base"></div>
      </div>

      <div class="stats">
        <div class="stat">
          <span class="stat-label">Response</span>
          <strong>28ms</strong>
        </div>

        <div class="stat">
          <span class="stat-label">Load</span>
          <strong>42%</strong>
        </div>

        <div class="stat">
          <span class="stat-label">Uptime</span>
          <strong>99.9%</strong>
        </div>
      </div>

      <button class="action" type="button">
        View Details
        <span aria-hidden="true">→</span>
      </button>

    </section>
  </main>

</body>
</html>
