<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Particle Effect: Quantum Energy Shield - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="em-particle-page">
        <!-- Background Quantum Energy Particle Shield Layer -->
        <div class="em-particle-bg" aria-hidden="true">
            <span class="em-particle" style="--x:15vw; --y:20vh; --d:0s; --s:4px;"></span>
            <span class="em-particle" style="--x:85vw; --y:25vh; --d:0.8s; --s:6px;"></span>
            <span class="em-particle" style="--x:25vw; --y:75vh; --d:1.6s; --s:3px;"></span>
            <span class="em-particle" style="--x:75vw; --y:80vh; --d:2.4s; --s:5px;"></span>
            <span class="em-particle" style="--x:50vw; --y:15vh; --d:3.2s; --s:4px;"></span>
            <span class="em-particle" style="--x:20vw; --y:45vh; --d:4s; --s:7px;"></span>
            <span class="em-particle" style="--x:80vw; --y:55vh; --d:4.8s; --s:3px;"></span>
        </div>

        <div class="em-card" role="region" aria-label="Quantum Energy Shield Particle Showcase" tabindex="0">
            <span class="em-card-badge">PARTICLE EFFECTS</span>
            <h1 class="em-card-title">Quantum Energy Shield</h1>
            <p class="em-card-desc">A smooth, hardware-accelerated pure CSS particle effect featuring quantum energy shield styling and dark mode compatibility.</p>
            <a href="#" class="em-card-btn" role="button">Explore Effects</a>
        </div>
    </div>
</body>
</html>
