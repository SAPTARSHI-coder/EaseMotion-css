<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Pure CSS bouncing spring rating component.">

    <title>Bouncing Spring Rating</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="demo">

        <h1>Bouncing Spring Rating</h1>

        <form>
            <fieldset class="spring-rating">

                <legend>Rate your experience</legend>

                <div class="rating-options">

                    <input class="rating-input" type="radio" id="rating-1" name="rating" value="1">

                    <label class="rating-star" for="rating-1" aria-label="1 out of 5">
                        <span aria-hidden="true">★</span>
                    </label>


                    <input class="rating-input" type="radio" id="rating-2" name="rating" value="2">

                    <label class="rating-star" for="rating-2" aria-label="2 out of 5">
                        <span aria-hidden="true">★</span>
                    </label>


                    <input class="rating-input" type="radio" id="rating-3" name="rating" value="3">

                    <label class="rating-star" for="rating-3" aria-label="3 out of 5">
                        <span aria-hidden="true">★</span>
                    </label>


                    <input class="rating-input" type="radio" id="rating-4" name="rating" value="4">

                    <label class="rating-star" for="rating-4" aria-label="4 out of 5">
                        <span aria-hidden="true">★</span>
                    </label>


                    <input class="rating-input" type="radio" id="rating-5" name="rating" value="5">

                    <label class="rating-star" for="rating-5" aria-label="5 out of 5">
                        <span aria-hidden="true">★</span>
                    </label>

                </div>


                <div class="rating-status" aria-live="polite">


                    <span class="status-default">
                        Select a rating
                    </span>

                    <span class="status-message status-1">
                        1 / 5 · Needs improvement
                    </span>

                    <span class="status-message status-2">
                        2 / 5 · Could be better
                    </span>

                    <span class="status-message status-3">
                        3 / 5 · Good
                    </span>

                    <span class="status-message status-4">
                        4 / 5 · Very good
                    </span>

                    <span class="status-message status-5">
                        5 / 5 · Excellent!
                    </span>

                </div>
                <button type="reset" class="reset-button">
                    Reset
                </button>

            </fieldset>
        </form>

    </main>

</body>

</html>
