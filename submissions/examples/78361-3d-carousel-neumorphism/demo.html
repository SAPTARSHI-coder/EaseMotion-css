<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />
  <meta
    name="description"
    content="Responsive 3D carousel with neumorphic styling."
  />
  <title>3D Neumorphic Carousel</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main class="page">
    <section class="showcase" aria-labelledby="title">
      <div class="orb orb-one" aria-hidden="true"></div>
      <div class="orb orb-two" aria-hidden="true"></div>

      <header class="intro">
        <p class="eyebrow">EaseMotion CSS / Issue #78361</p>

        <h1 id="title">
          Move through
          <span>soft depth.</span>
        </h1>

        <p class="subtitle">
          A responsive CSS-only carousel built around
          perspective, layered shadows, and minimalist
          neumorphic surfaces.
        </p>
      </header>

      <div class="carousel-shell">
        <div class="carousel" aria-label="Featured cards">
          <article class="card card-left">
            <div class="card-top">
              <span class="card-index">01</span>
              <span class="card-tag">FORM</span>
            </div>

            <div class="visual visual-sphere" aria-hidden="true">
              <span></span>
              <span></span>
              <span></span>
            </div>

            <div class="card-content">
              <p>Concept / 01</p>
              <h2>Stillness</h2>
              <span class="card-line"></span>
            </div>
          </article>

          <article class="card card-center">
            <div class="card-top">
              <span class="card-index">02</span>
              <span class="card-tag">FLOW</span>
            </div>

            <div class="visual visual-rings" aria-hidden="true">
              <span></span>
              <span></span>
              <span></span>
            </div>

            <div class="card-content">
              <p>Concept / 02</p>
              <h2>Motion</h2>
              <span class="card-line"></span>
            </div>
          </article>

          <article class="card card-right">
            <div class="card-top">
              <span class="card-index">03</span>
              <span class="card-tag">SPACE</span>
            </div>

            <div class="visual visual-cube" aria-hidden="true">
              <span></span>
              <span></span>
              <span></span>
            </div>

            <div class="card-content">
              <p>Concept / 03</p>
              <h2>Balance</h2>
              <span class="card-line"></span>
            </div>
          </article>
        </div>

        <div class="controls" aria-label="Carousel navigation">
          <button
            class="control"
            type="button"
            aria-label="Previous slide"
          >
            <span class="arrow arrow-left"></span>
          </button>

          <div class="dots" aria-hidden="true">
            <span class="dot"></span>
            <span class="dot active"></span>
            <span class="dot"></span>
          </div>

          <button
            class="control"
            type="button"
            aria-label="Next slide"
          >
            <span class="arrow arrow-right"></span>
          </button>
        </div>
      </div>

      <div class="meta">
        <span>
          <i></i>
          CSS only
        </span>

        <b>/</b>

        <span>Responsive</span>

        <b>/</b>

        <span>3D depth</span>
      </div>
    </section>
  </main>
</body>
</html>
