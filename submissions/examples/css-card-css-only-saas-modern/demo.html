<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaaS Modern Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="saas-card">
        <div class="card-header">
            <span class="badge">PRO PLAN</span>
            <h3>Enterprise Analytics</h3>
            <p class="price">$49<span>/mo</span></p>
        </div>
        <ul class="card-features">
            <li>Unlimited Data Storage</li>
            <li>Custom Dashboards</li>
            <li>24/7 Priority Support</li>
        </ul>
        <button class="cta-btn">Upgrade Now</button>
    </div>
</body>
</html>
