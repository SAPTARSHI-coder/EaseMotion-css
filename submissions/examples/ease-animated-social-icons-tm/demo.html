<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Animated Social Icons | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="socstage">
    <h2 class="sochead">Follow Us</h2>
    <div class="socrow">
      <button class="socbtn soc-tw" type="button" aria-label="Twitter">T<span class="soclabel">Twitter</span></button>
      <button class="socbtn soc-fb" type="button" aria-label="Facebook">f<span class="soclabel">Facebook</span></button>
      <button class="socbtn soc-ig" type="button" aria-label="Instagram">I<span class="soclabel">Instagram</span></button>
      <button class="socbtn soc-li" type="button" aria-label="LinkedIn">in<span class="soclabel">LinkedIn</span></button>
      <button class="socbtn soc-gh" type="button" aria-label="GitHub">G<span class="soclabel">GitHub</span></button>
      <button class="socbtn soc-yt" type="button" aria-label="YouTube">Y<span class="soclabel">YouTube</span></button>
    </div>
  </div>
</body>
</html>
