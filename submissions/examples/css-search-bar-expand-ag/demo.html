<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Search Bar with Expand — EaseMotion</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="demo-wrapper">
    <header class="demo-header">
      <span class="demo-badge">EaseMotion Component</span>
      <h1>Expandable Search Bar</h1>
      <p>Pure CSS horizontal expansion with geometric icon morphing on focus.</p>
    </header>

    <section class="demo-card">
      <form class="ease-search-bar-ag" role="search" aria-label="Site search">
        <label for="ease-search-input-ag" class="sr-only">Search query</label>
        
        <input 
          type="search" 
          id="ease-search-input-ag" 
          class="ease-search-input-ag" 
          name="q" 
          placeholder="Search components, tokens, docs..." 
          autocomplete="off"
        >
        
        <button type="reset" class="ease-search-btn-ag" aria-label="Clear search">
          <span class="ease-search-icon-ag" aria-hidden="true">
            <span class="ease-icon-lens-ag"></span>
            <span class="ease-icon-handle-ag"></span>
          </span>
        </button>
      </form>
    </section>

    <footer class="demo-footer">
      <div class="hint-item">
        <kbd>Tab</kbd> / Click to focus and expand
      </div>
      <div class="hint-item">
        Icon morphs into clear (<span class="hint-icon">×</span>) on focus
      </div>
    </footer>
  </main>

</body>
</html>
