<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Aurora Glow CSS progress bar component."
  >
  <title>Aurora Glow Progress</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="demo">
    <section class="intro">
      <p class="eyebrow">EaseMotion CSS</p>
      <h1>Aurora Progress</h1>
      <p>
        A smooth, glowing progress indicator inspired by
        shifting northern lights.
      </p>
    </section>

    <section
      class="progress-card"
      aria-labelledby="progress-title"
    >
      <div class="card-header">
        <div>
          <p class="label">SYSTEM STATUS</p>
          <h2 id="progress-title">Uploading Assets</h2>
        </div>

        <strong class="percentage">78%</strong>
      </div>

      <div
        class="progress-track"
        role="progressbar"
        aria-label="Upload progress"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="78"
      >
        <div class="progress-fill">
          <span class="aurora-glow" aria-hidden="true"></span>
          <span class="progress-shine" aria-hidden="true"></span>
        </div>
      </div>

      <div class="progress-meta">
        <span>Processing...</span>
        <span>78 / 100</span>
      </div>

      <div class="status-row">
        <span class="status-indicator" aria-hidden="true"></span>
        <span>Connection stable</span>
      </div>
    </section>

    <section class="examples" aria-label="Progress examples">
      <article class="mini-card">
        <div class="mini-header">
          <span>Loading</span>
          <strong>35%</strong>
        </div>

        <div class="progress-track progress-small"
             role="progressbar"
             aria-label="Loading progress"
             aria-valuemin="0"
             aria-valuemax="100"
             aria-valuenow="35">
          <div class="progress-fill fill-35">
            <span class="aurora-glow" aria-hidden="true"></span>
          </div>
        </div>
      </article>

      <article class="mini-card">
        <div class="mini-header">
          <span>Syncing</span>
          <strong>62%</strong>
        </div>

        <div class="progress-track progress-small"
             role="progressbar"
             aria-label="Syncing progress"
             aria-valuemin="0"
             aria-valuemax="100"
             aria-valuenow="62">
          <div class="progress-fill fill-62">
            <span class="aurora-glow" aria-hidden="true"></span>
          </div>
        </div>
      </article>

      <article class="mini-card">
        <div class="mini-header">
          <span>Complete</span>
          <strong>100%</strong>
        </div>

        <div class="progress-track progress-small"
             role="progressbar"
             aria-label="Completion progress"
             aria-valuemin="0"
             aria-valuemax="100"
             aria-valuenow="100">
          <div class="progress-fill fill-100">
            <span class="aurora-glow" aria-hidden="true"></span>
          </div>
        </div>
      </article>
    </section>

    <p class="note">
      Pure HTML &amp; Vanilla CSS · No external dependencies
    </p>
  </main>
</body>
</html>
