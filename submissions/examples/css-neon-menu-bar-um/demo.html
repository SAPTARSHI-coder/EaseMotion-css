<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Neon Menu Bar - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Showcase Header -->
  <header class="showcase-header">
    <h1 class="title">Neon Menu Bar</h1>
    <p class="subtitle">Horizontal navigation bar featuring a sliding neon active underline. Select items to transition the indicator.</p>
  </header>

  <!-- Radio Nav triggers (Placed above navigation for sibling selection targets) -->
  <input type="radio" name="neon-nav" id="t-home" class="nav-trigger" checked>
  <input type="radio" name="neon-nav" id="t-articles" class="nav-trigger">
  <input type="radio" name="neon-nav" id="t-analytics" class="nav-trigger">
  <input type="radio" name="neon-nav" id="t-profile" class="nav-trigger">

  <!-- Main Navigation Bar -->
  <nav class="nav-container" role="navigation" aria-label="Neon main navigation">
    
    <div class="nav-list" role="radiogroup" aria-label="Navigation Tabs">
      
      <!-- Home Tab -->
      <label for="t-home" class="nav-item l-home" role="radio" aria-checked="true" tabindex="0"
             onkeydown="if(event.key === ' ' || event.key === 'Enter') document.getElementById('t-home').click()">Home</label>

      <!-- Articles Tab -->
      <label for="t-articles" class="nav-item l-articles" role="radio" aria-checked="false" tabindex="0"
             onkeydown="if(event.key === ' ' || event.key === 'Enter') document.getElementById('t-articles').click()">Articles</label>

      <!-- Analytics Tab -->
      <label for="t-analytics" class="nav-item l-analytics" role="radio" aria-checked="false" tabindex="0"
             onkeydown="if(event.key === ' ' || event.key === 'Enter') document.getElementById('t-analytics').click()">Analytics</label>

      <!-- Profile Tab -->
      <label for="t-profile" class="nav-item l-profile" role="radio" aria-checked="false" tabindex="0"
             onkeydown="if(event.key === ' ' || event.key === 'Enter') document.getElementById('t-profile').click()">Profile</label>

      <!-- The Sliding Neon underline element -->
      <div class="neon-indicator" aria-hidden="true"></div>

    </div>

  </nav>

</body>
</html>
