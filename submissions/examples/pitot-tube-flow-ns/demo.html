<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pitot Tube Flow — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Pitot Tube Flow demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Pitot Tube Flow</h1>
      <p class="lede">Pitot tube dynamic pressure rising with airflow</p>
    </header>

    <section class="ease-pitot-tube-flow" data-demo="pitot-tube-flow" aria-live="polite">
      <div class="ease-pitot-tube-flow__housing">
        <div class="ease-pitot-tube-flow__bezel">
          <div class="ease-pitot-tube-flow__face">
            <div class="ease-pitot-tube-flow__readout">
              <span class="ease-pitot-tube-flow__label">Pitot Tube Flow</span>
              <span class="ease-pitot-tube-flow__value">LIVE</span>
            </div>
            <div class="ease-pitot-tube-flow__motion" aria-hidden="true">
              <span class="ease-pitot-tube-flow__a"></span>
              <span class="ease-pitot-tube-flow__b"></span>
              <span class="ease-pitot-tube-flow__c"></span>
              <span class="ease-pitot-tube-flow__d"></span>
            </div>
            <div class="ease-pitot-tube-flow__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-pitot-tube-flow__controls">
          <button type="button" class="ease-pitot-tube-flow__btn primary">Engage</button>
          <button type="button" class="ease-pitot-tube-flow__btn">Reset</button>
          <label class="ease-pitot-tube-flow__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-pitot-tube-flow__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
