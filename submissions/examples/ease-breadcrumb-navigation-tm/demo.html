<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Breadcrumb Navigation | EaseMotion CSS</title><link rel="stylesheet" href="style.css"></head>
<body><div class="br-root">
<nav class="br-crumb" aria-label="Breadcrumb">

<a href="#" class="br-link">Products</a>
<span class="br-sep" aria-hidden="true">/</span>
