<!-- EaseMotion component: fitness-exercise-tracker -->
<!DOCTYPE html>
<html lang="en" data-gym="upper">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
<title>Ease Fitness Exercise Tracker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<section class="workout-card">
  <header class="workout-header">
    <h2>Upper Body Circuit</h2>
    <span class="cal-badge">about 310 kcal</span>
  </header>
  <ol class="exercise-list">
    <li class="exercise-row">
      <div class="exercise-name">
        <span class="exercise-order">01</span>
        <p class="exercise-title">Push-ups<span class="muscle-tag">Chest</span></p>
      </div>
      <div class="set-grid">
        <span class="set-cell">3 sets</span>
        <span class="rep-counter">12 reps</span>
        <label class="check-pill"><input type="checkbox"><i class="tick-box"></i>Done</label>
      </div>
    </li>
    <li class="exercise-row">
      <div class="exercise-name">
        <span class="exercise-order">02</span>
        <p class="exercise-title">Pull-ups<span class="muscle-tag">Back</span></p>
      </div>
      <div class="set-grid">
        <span class="set-cell">3 sets</span>
        <span class="rep-counter">8 reps</span>
        <label class="check-pill"><input type="checkbox"><i class="tick-box"></i>Done</label>
      </div>
    </li>
    <li class="exercise-row">
      <div class="exercise-name">
        <span class="exercise-order">03</span>
        <p class="exercise-title">Shoulder Press<span class="muscle-tag">Shoulders</span></p>
      </div>
      <div class="set-grid">
        <span class="set-cell">4 sets</span>
        <span class="rep-counter">10 reps</span>
        <label class="check-pill"><input type="checkbox"><i class="tick-box"></i>Done</label>
      </div>
    </li>
    <li class="exercise-row">
      <div class="exercise-name">
        <span class="exercise-order">04</span>
        <p class="exercise-title">Dumbbell Rows<span class="muscle-tag">Back</span></p>
      </div>
      <div class="set-grid">
        <span class="set-cell">3 sets</span>
        <span class="rep-counter">12 reps</span>
        <label class="check-pill"><input type="checkbox"><i class="tick-box"></i>Done</label>
      </div>
    </li>
  </ol>
  <footer class="workout-foot">
    <span class="progress-label">2 of 4 exercises completed</span>
    <div class="progress-track"><span class="progress-half"></span></div>
  </footer>
</section>
</body>
</html>
