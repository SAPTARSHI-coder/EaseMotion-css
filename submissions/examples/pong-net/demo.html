<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pong Net &mdash; EaseMotion CSS Demo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="page-head">
    <p class="kicker">EaseMotion CSS &middot; Games &amp; Play</p>
    <h1>Pong Net</h1>
    <p class="sub">A mini table-tennis rally where the ball never touches down.</p>
  </header>
  <main class="stage">
    <div class="pn-table">
      <div class="pn-net"></div>
      <div class="pn-pad l"></div>
      <div class="pn-pad r"></div>
      <div class="pn-ball"></div>
    </div>
  </main>
  <p class="stage-caption">Watch the ball arc and the paddles chase it.</p>
  <footer class="page-foot">
    <span>Pure CSS &middot; zero dependencies</span>
    <span>Looped rally</span>
  </footer>
</body>
</html>
