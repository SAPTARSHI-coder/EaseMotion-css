<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Colossus Tape Loop — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Colossus Tape Loop demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Colossus Tape Loop</h1>
      <p class="lede">Colossus tape loop racing the bedstead</p>
    </header>

    <section class="ease-colossus-tape-loop" data-demo="colossus-tape-loop" aria-live="polite">
      <div class="ease-colossus-tape-loop__housing">
        <div class="ease-colossus-tape-loop__bezel">
          <div class="ease-colossus-tape-loop__face">
            <div class="ease-colossus-tape-loop__readout">
              <span class="ease-colossus-tape-loop__label">Colossus Tape Loop</span>
              <span class="ease-colossus-tape-loop__value">LIVE</span>
            </div>
            <div class="ease-colossus-tape-loop__motion" aria-hidden="true">
              <span class="ease-colossus-tape-loop__a"></span>
              <span class="ease-colossus-tape-loop__b"></span>
              <span class="ease-colossus-tape-loop__c"></span>
              <span class="ease-colossus-tape-loop__d"></span>
            </div>
            <div class="ease-colossus-tape-loop__meters">
              <i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-colossus-tape-loop__controls">
          <button type="button" class="ease-colossus-tape-loop__btn primary">Run</button>
          <button type="button" class="ease-colossus-tape-loop__btn">Stop</button>
          <label class="ease-colossus-tape-loop__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-colossus-tape-loop__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
