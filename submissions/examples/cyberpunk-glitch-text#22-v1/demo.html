<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyberpunk Glitch Text | EaseMotion CSS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="glitch-scene">
        <!-- Scanline Overlay -->
        <div class="scanlines"></div>

        <!-- Main Glitch Text -->
        <div class="glitch-wrapper">
            <h1 class="glitch" data-text="CYBERPUNK">CYBERPUNK</h1>
        </div>

        <!-- Subtitle with flicker -->
        <div class="subtitle-wrapper">
            <p class="subtitle">NEURAL_INTERFACE v2.077</p>
        </div>

        <!-- Glitch Bars -->
        <div class="glitch-bars">
            <div class="bar bar-1"></div>
            <div class="bar bar-2"></div>
            <div class="bar bar-3"></div>
            <div class="bar bar-4"></div>
            <div class="bar bar-5"></div>
        </div>

        <!-- Floating Data Fragments -->
        <div class="data-fragments">
            <span class="fragment f1">0x7F3A</span>
            <span class="fragment f2">SYS.OK</span>
            <span class="fragment f3">▓▓░░</span>
            <span class="fragment f4">LINK::ACTIVE</span>
            <span class="fragment f5">01101</span>
            <span class="fragment f6">ERR_NULL</span>
        </div>

        <!-- Corner Brackets -->
        <div class="corner tl"></div>
        <div class="corner tr"></div>
        <div class="corner bl"></div>
        <div class="corner br"></div>
    </div>
</body>
</html>
