<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Glassmorphism Datepicker - EaseMotion CSS</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="glass-datepicker-card">
      <header class="datepicker-header">
        <h1 class="datepicker-title">August 2026</h1>
        <div style="display: flex; gap: 0.5rem">
          <button class="datepicker-nav-btn" aria-label="Previous Month">
            &lsaquo;
          </button>
          <button class="datepicker-nav-btn" aria-label="Next Month">
            &rsaquo;
          </button>
        </div>
      </header>

      <div class="calendar-weekdays">
        <span>Su</span><span>Mo</span><span>Tu</span><span>We</span
        ><span>Th</span><span>Fr</span><span>Sa</span>
      </div>

      <div class="calendar-days">
        <!-- Empty offset slots for August 2026 starting Saturday -->
        <span class="calendar-day-label empty"></span>
        <span class="calendar-day-label empty"></span>
        <span class="calendar-day-label empty"></span>
        <span class="calendar-day-label empty"></span>
        <span class="calendar-day-label empty"></span>
        <span class="calendar-day-label empty"></span>

        <!-- Days 1 to 14 -->
        <input
          type="radio"
          name="date"
          id="d1"
          class="calendar-day-input"
        /><label for="d1" class="calendar-day-label">1</label>
        <input
          type="radio"
          name="date"
          id="d2"
          class="calendar-day-input"
        /><label for="d2" class="calendar-day-label">2</label>
        <input
          type="radio"
          name="date"
          id="d3"
          class="calendar-day-input"
        /><label for="d3" class="calendar-day-label">3</label>
        <input
          type="radio"
          name="date"
          id="d4"
          class="calendar-day-input"
        /><label for="d4" class="calendar-day-label">4</label>
        <input
          type="radio"
          name="date"
          id="d5"
          class="calendar-day-input"
        /><label for="d5" class="calendar-day-label">5</label>
        <input
          type="radio"
          name="date"
          id="d6"
          class="calendar-day-input"
        /><label for="d6" class="calendar-day-label">6</label>
        <input
          type="radio"
          name="date"
          id="d7"
          class="calendar-day-input"
        /><label for="d7" class="calendar-day-label">7</label>
        <input
          type="radio"
          name="date"
          id="d8"
          class="calendar-day-input"
        /><label for="d8" class="calendar-day-label">8</label>
        <input
          type="radio"
          name="date"
          id="d9"
          class="calendar-day-input"
        /><label for="d9" class="calendar-day-label">9</label>
        <input
          type="radio"
          name="date"
          id="d10"
          class="calendar-day-input"
        /><label for="d10" class="calendar-day-label">10</label>
        <input
          type="radio"
          name="date"
          id="d11"
          class="calendar-day-input"
        /><label for="d11" class="calendar-day-label">11</label>

        <!-- Day 14 checked by default -->
        <input
          type="radio"
          name="date"
          id="d14"
          class="calendar-day-input"
          checked
        /><label for="d14" class="calendar-day-label">14</label>

        <input
          type="radio"
          name="date"
          id="d15"
          class="calendar-day-input"
        /><label for="d15" class="calendar-day-label">15</label>
        <input
          type="radio"
          name="date"
          id="d16"
          class="calendar-day-input"
        /><label for="d16" class="calendar-day-label">16</label>
        <input
          type="radio"
          name="date"
          id="d17"
          class="calendar-day-input"
        /><label for="d17" class="calendar-day-label">17</label>
        <input
          type="radio"
          name="date"
          id="d18"
          class="calendar-day-input"
        /><label for="d18" class="calendar-day-label">18</label>
        <input
          type="radio"
          name="date"
          id="d19"
          class="calendar-day-input"
        /><label for="d19" class="calendar-day-label">19</label>
        <input
          type="radio"
          name="date"
          id="d20"
          class="calendar-day-input"
        /><label for="d20" class="calendar-day-label">20</label>
      </div>
    </main>
  </body>
</html>
