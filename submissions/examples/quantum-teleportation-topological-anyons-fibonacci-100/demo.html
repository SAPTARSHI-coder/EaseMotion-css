<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Topological Anyons Fibonacci - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css"></head><body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030712; color: #ffffff;">

    <div class="ease-card ease-card-glass anyon-container">
        <div class="anyon-header">
            <h2>Fibonacci Anyons</h2>
            <span class="ease-badge ease-badge-success">Topological</span>
        </div>
        
        <div class="anyon-screen ease-center">
            <div class="anyon-flux flux-anyon-a"></div>
            <div class="anyon-flux flux-anyon-b"></div>
            <div class="anyon-boundary-ring"></div>
            <div class="anyon-core ease-center"></div>
        </div>

        <div class="anyon-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Non-Abelian Braiding &amp; Fusion Rules</span>
            <button class="ease-btn ease-btn-success ease-btn-sm ease-hover-grow">Run Anyon Braiding</button>
        </div>
    </div></body></html>
