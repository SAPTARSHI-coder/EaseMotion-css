<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Stepper</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="ease-stepper ease-fade-in">
    <div class="step active ease-step-item">1</div>
    <div class="step-line"></div>
    <div class="step ease-step-item">2</div>
    <div class="step-line"></div>
    <div class="step ease-step-item">3</div>
  </div>
</body>
</html>
