<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Animated CSS sun with rotating rays."
  >
  <title>CSS Animated Sun and Rays</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">
    <section class="weather-card" aria-labelledby="weather-title">

      <div class="sun" aria-hidden="true">
        <span class="ray ray-1"></span>
        <span class="ray ray-2"></span>
        <span class="ray ray-3"></span>
        <span class="ray ray-4"></span>
        <span class="ray ray-5"></span>
        <span class="ray ray-6"></span>
        <span class="ray ray-7"></span>
        <span class="ray ray-8"></span>

        <span class="sun-core"></span>
      </div>

      <div class="weather-info">
        <span class="label">Today's weather</span>

        <h1 id="weather-title">Sunny</h1>

        <p>Clear skies with a warm golden glow.</p>

        <strong class="temperature">28°</strong>
      </div>

    </section>
  </main>

</body>
</html>
