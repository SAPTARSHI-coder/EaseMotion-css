<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CSS neon sign text with a subtle flicker animation.">
  <title>CSS Neon Sign Effect</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section class="neon-card" aria-labelledby="neon-title">
      <p class="eyebrow">Pure CSS Effect</p>

      <h1 id="neon-title" class="neon-sign">
        NIGHT
      </h1>

      <p class="subtitle">Neon Sign Effect</p>

      <span class="status" aria-label="Neon sign is glowing">
        ● LIVE GLOW
      </span>
    </section>
  </main>
</body>
</html>
