<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Pure CSS dynamic treeview menu with neumorphism styling"
  >
  <title>Neumorphic Treeview Menu</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page-shell">
    <section class="tree-card" aria-labelledby="tree-title">

      <p class="eyebrow">Pure CSS component</p>

      <h1 id="tree-title">Project Explorer</h1>

      <p class="intro">
        A responsive, accessible treeview menu using native HTML
        disclosure controls.
      </p>

      <nav class="tree" aria-label="Project explorer">

        <!-- Components -->
        <details open>
          <summary>
            <span class="icon">▾</span>
            <span class="folder">📁</span>
            components
          </summary>

          <div class="tree-branch">

            <!-- Navigation -->
            <details open>
              <summary>
                <span class="icon">▾</span>
                <span class="folder">📁</span>
                navigation
              </summary>

              <div class="tree-branch">
                <a href="#treeview">
                  <span class="file">◇</span>
                  treeview.html
                </a>

                <a href="#styles">
                  <span class="file">◇</span>
                  style.css
                </a>
              </div>
            </details>

            <!-- Cards -->
            <details>
              <summary>
                <span class="icon">▸</span>
                <span class="folder">📁</span>
                cards
              </summary>

              <div class="tree-branch">
                <a href="#cards">
                  <span class="file">◇</span>
                  neumorphic-card.html
                </a>
              </div>
            </details>

          </div>
        </details>

        <!-- Submissions -->
        <details>
          <summary>
            <span class="icon">▸</span>
            <span class="folder">📁</span>
            submissions
          </summary>

          <div class="tree-branch">
            <a href="#examples">
              <span class="file">◇</span>
              examples
            </a>
          </div>
        </details>

        <!-- Files -->
        <a href="#readme">
          <span class="file">◇</span>
          README.md
        </a>

        <a href="#license">
          <span class="file">◇</span>
          LICENSE
        </a>

      </nav>

    </section>
  </main>

</body>
</html>
