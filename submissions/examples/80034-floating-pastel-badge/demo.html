<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Floating Pastel Badge</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">
    <section class="showcase">
      <span class="badge">
        <span class="badge-dot"></span>
        New Feature
      </span>

      <h1>Floating Pastel Badge</h1>

      <p>
        A soft, animated badge designed for modern interfaces.
      </p>

      <div class="badge-row">
        <span class="badge badge-pink">
          <span class="badge-dot"></span>
          Trending
        </span>

        <span class="badge badge-lavender">
          <span class="badge-dot"></span>
          Featured
        </span>

        <span class="badge badge-blue">
          <span class="badge-dot"></span>
          Active
        </span>
      </div>
    </section>
  </main>

</body>
</html>
