<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Diamond Facet Edge CSS media visualizer">
  <title>Diamond Facet Edge Media Visualizer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">
    <section
      class="media-card"
      aria-label="Diamond Facet Edge media visualizer"
    >
      <div class="diamond-visual" aria-hidden="true">
        <span class="facet facet-one"></span>
        <span class="facet facet-two"></span>
        <span class="facet facet-three"></span>
        <span class="facet facet-four"></span>

        <div class="diamond-core">
          <span class="core-line"></span>
          <span class="core-line"></span>
          <span class="core-line"></span>
        </div>
      </div>

      <div class="media-info">
        <p class="eyebrow">NOW PLAYING</p>
        <h1>Diamond Facet</h1>
        <p class="artist">Ambient Motion</p>
      </div>

      <div class="progress-area">
        <div
          class="progress-track"
          role="progressbar"
          aria-label="Playback progress"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="64"
        >
          <span class="progress-fill"></span>
        </div>

        <div class="time">
          <span>02:14</span>
          <span>03:28</span>
        </div>
      </div>

      <div class="controls" aria-label="Media controls">
        <button type="button" aria-label="Previous track">◀</button>

        <button
          type="button"
          class="play-button"
          aria-label="Play"
        >
          ▶
        </button>

        <button type="button" aria-label="Next track">▶</button>
      </div>

      <div class="sound-bars" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
      </div>
    </section>
  </main>

</body>
</html>
