<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ease Glassmorphic Fisheye Dock</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="dock-body">
  <div class="dock-container" id="dock">
    <div class="dock-item">🎨</div>
    <div class="dock-item">📁</div>
    <div class="dock-item">🚀</div>
    <div class="dock-item">⚙️</div>
    <div class="dock-item">💬</div>
  </div>

  <script>
    const dock = document.getElementById('dock');
    const items = dock.querySelectorAll('.dock-item');

    dock.addEventListener('mousemove', (e) => {
      items.forEach(item => {
        const rect = item.getBoundingClientRect();
        const center = rect.left + rect.width / 2;
        const dist = Math.abs(e.clientX - center);
        const scale = 1 + Math.max(0, (1 - dist / 120)) * 0.5;
        item.style.transform = `scale(${scale})`;
      });
    });

    dock.addEventListener('mouseleave', () => {
      items.forEach(item => item.style.transform = 'scale(1)');
    });
  </script>
</body>
</html>
