<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surface Code Matching SCM - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css"></head><body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030712; color: #ffffff;">

    <div class="ease-card ease-card-glass scm-container">
        <div class="scm-header">
            <h2>Surface Code Matching</h2>
            <span class="ease-badge ease-badge-primary">Quantum Error Correction</span>
        </div>
        
        <div class="scm-screen ease-center">
            <div class="scm-flux flux-scm-a"></div>
            <div class="scm-flux flux-scm-b"></div>
            <div class="scm-boundary-ring"></div>
            <div class="scm-core ease-center"></div>
        </div>

        <div class="scm-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">MWPM Decoders &amp; Syndrome Graph Pairing</span>
            <button class="ease-btn ease-btn-primary ease-btn-sm ease-hover-grow">Run Surface Matching</button>
        </div>
    </div></body></html>
