<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prism Nav · Rainbow Spectrum Split</title>

    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <div class="card">
        <h2>🌈 Prism Nav</h2>
        <p class="sub">items split into rainbow spectrum</p>

        <!-- === PRISM NAV === -->
        <nav class="prism-nav" id="prismNav">
            <ul class="prism-items">
                <li class="prism-item">
                    <a href="#" class="prism-link" data-color="red">
                        <i class="fas fa-home"></i>
                        <span>Home</span>
                    </a>
                </li>
                <li class="prism-item">
                    <a href="#" class="prism-link" data-color="orange">
                        <i class="fas fa-compass"></i>
                        <span>Explore</span>
                    </a>
                </li>
                <li class="prism-item">
                    <a href="#" class="prism-link" data-color="yellow">
                        <i class="fas fa-images"></i>
                        <span>Gallery</span>
                    </a>
                </li>
                <li class="prism-item">
                    <a href="#" class="prism-link" data-color="green">
                        <i class="fas fa-blog"></i>
                        <span>Blog</span>
                    </a>
                </li>
                <li class="prism-item">
                    <a href="#" class="prism-link" data-color="blue">
                        <i class="fas fa-envelope"></i>
                        <span>Contact</span>
                    </a>
                </li>
                <li class="prism-item">
                    <a href="#" class="prism-link" data-color="indigo">
                        <i class="fas fa-user"></i>
                        <span>Profile</span>
                    </a>
                </li>
                <li class="prism-item">
                    <a href="#" class="prism-link" data-color="violet">
                        <i class="fas fa-cog"></i>
                        <span>Settings</span>
                    </a>
                </li>
            </ul>
        </nav>

        <p style="margin-top: 2rem; font-size: 0.85rem; color: #64748b;">
            Hover · watch items split into rainbow colors
        </p>
    </div>

    <!-- Embedded JavaScript -->
    <script>
        (function() {
            'use strict';

            const nav = document.getElementById('prismNav');
            const items = document.querySelectorAll('.prism-item');

            // Click feedback
            items.forEach(item => {
                const link = item.querySelector('.prism-link');
                link.addEventListener('click', function(e) {
                    e.preventDefault();
                    item.classList.add('clicked');
                    setTimeout(() => {
                        item.classList.remove('clicked');
                    }, 300);
                    const label = this.querySelector('span')?.textContent || 'Item';
                    const color = this.getAttribute('data-color') || 'rainbow';
                    console.log(`🌈 ${color}: ${label}`);
                });

                // Keyboard accessibility
                link.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        this.click();
                    }
                });
            });

            // Reset animation on hover
            nav.addEventListener('mouseenter', function() {
                const items = this.querySelectorAll('.prism-item');
                items.forEach(item => {
                    item.style.animation = 'none';
                    void item.offsetWidth;
                    item.style.animation = '';
                });
            });

            console.log('🌈 Prism nav initialized!');

        })();
    </script>

</body>
</html>
