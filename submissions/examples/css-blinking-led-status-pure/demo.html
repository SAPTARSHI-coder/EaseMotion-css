<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Blinking LED Status</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="layout-container">
        
        <header class="section-header">
            <h1 class="title">Blinking LED Status</h1>
            <p class="subtitle">Pure CSS pulsating status indicators utilizing radial gradients and keyframe animations to simulate glowing LED lights.</p>
        </header>

        <div class="demo-area">
            
            <div class="status-panel">
                <h2 class="panel-title">System Health</h2>
                
                <ul class="status-list">
                    
                    <!-- 
                      [TECHNIQUE] The LED Indicator
                      The .led element handles the base styling (size, rounded shape).
                      The modifier classes (.led-green) apply specific CSS custom properties
                      for color and trigger the pulsing box-shadow animation.
                    -->
                    
                    <li class="status-item">
                        <div class="led-container" aria-hidden="true">
                            <div class="led led-green"></div>
                        </div>
                        <div class="status-text">
                            <strong>API Gateway</strong>
                            <span>Operational</span>
                        </div>
                    </li>
                    
                    <li class="status-item">
                        <div class="led-container" aria-hidden="true">
                            <!-- Yellow typically indicates a warning or degraded state. 
                                 We can adjust the animation speed in CSS for urgency. -->
                            <div class="led led-yellow pulse-slow"></div>
                        </div>
                        <div class="status-text">
                            <strong>Database Cluster</strong>
                            <span>High Latency</span>
                        </div>
                    </li>
                    
                    <li class="status-item">
                        <div class="led-container" aria-hidden="true">
                            <!-- Red indicates a critical failure. 
                                 A faster pulse draws immediate attention. -->
                            <div class="led led-red pulse-fast"></div>
                        </div>
                        <div class="status-text">
                            <strong>Payment Processor</strong>
                            <span>Offline</span>
                        </div>
                    </li>
                    
                    <li class="status-item">
                        <div class="led-container" aria-hidden="true">
                            <!-- Optional: A static LED for 'off' or 'standby' states -->
                            <div class="led led-gray"></div>
                        </div>
                        <div class="status-text">
                            <strong>Backup Server</strong>
                            <span>Standby</span>
                        </div>
                    </li>
                    
                </ul>
                
            </div>
            
        </div>
        
    </div>

</body>
</html>
