<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Snowman</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="layout-container">
        
        <header class="section-header">
            <h1 class="title">Pure CSS Snowman</h1>
            <p class="subtitle">A festive snowman built entirely using CSS borders, pseudo-elements, and box-shadows. Features subtle breathing and blinking animations.</p>
        </header>

        <div class="demo-area">
            
            <div class="snow-scene" aria-label="A gently bobbing CSS snowman with a top hat and carrot nose">
                
                <div class="snowman">
                    <!-- The Hat -->
                    <div class="snowman-hat">
                        <div class="hat-brim"></div>
                        <div class="hat-top"></div>
                        <div class="hat-band"></div>
                    </div>
                    
                    <!-- The Head -->
                    <div class="snowman-head">
                        <div class="eye left"></div>
                        <div class="eye right"></div>
                        <div class="nose"></div>
                        <div class="mouth"></div>
                    </div>
                    
                    <!-- The Scarf -->
                    <div class="snowman-scarf">
                        <div class="scarf-tail"></div>
                    </div>
                    
                    <!-- The Body (Middle) -->
                    <div class="snowman-middle">
                        <div class="button"></div>
                        <div class="button"></div>
                    </div>
                    
                    <!-- The Base (Bottom) -->
                    <div class="snowman-bottom">
                        <div class="button"></div>
                        <div class="button"></div>
                        <div class="button"></div>
                    </div>
                </div>
                
                <!-- Floor shadow -->
                <div class="snowman-shadow"></div>
                
            </div>
            
        </div>
        
    </div>

</body>
</html>
