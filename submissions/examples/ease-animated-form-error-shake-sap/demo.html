<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animated Form Error Shake</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <h1>Animated Form Error Shake</h1>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required>
        <p class="error-msg" id="emailError" role="alert"></p>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" required minlength="8">
        <p class="error-msg" id="passwordError" role="alert"></p>
      </div>

      <button type="submit" class="submit-btn">Log in</button>
    </form>
  </main>

  <script>
    const form = document.getElementById('loginForm');

    function validateField(input, errorEl, message) {
      const field = input.closest('.field');
      if (!input.checkValidity()) {
        errorEl.textContent = message;
        field.classList.remove('is-shaking');
        void field.offsetWidth;
        field.classList.add('is-shaking', 'has-error');
        input.setAttribute('aria-invalid', 'true');
        return false;
      }
      errorEl.textContent = '';
      field.classList.remove('has-error');
      input.removeAttribute('aria-invalid');
      return true;
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const emailOk = validateField(
        document.getElementById('email'),
        document.getElementById('emailError'),
        'Please enter a valid email address.'
      );
      const passwordOk = validateField(
        document.getElementById('password'),
        document.getElementById('passwordError'),
        'Password must be at least 8 characters.'
      );
      if (emailOk && passwordOk) {
        alert('Logged in (demo only).');
      }
    });
  </script>
</body>
</html>
