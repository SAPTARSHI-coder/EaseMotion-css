<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>CSS Rubik Cube Loader</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="demo-page">
    <section class="loader-card" aria-labelledby="loader-title">
      <p class="eyebrow">EaseMotion CSS</p>
      <h1 id="loader-title">Rubik Cube Loader</h1>

      <div
        class="rubik-loader"
        role="status"
        aria-label="Loading"
        aria-live="polite"
      >
        <div class="cube" aria-hidden="true">
          <div class="cube-face cube-front"></div>
          <div class="cube-face cube-back"></div>
          <div class="cube-face cube-right"></div>
          <div class="cube-face cube-left"></div>
          <div class="cube-face cube-top"></div>
          <div class="cube-face cube-bottom"></div>
        </div>
      </div>

      <p class="loading-text">Loading...</p>
      <p class="description">
        A lightweight 3D Rubik cube animation built entirely with CSS.
      </p>
    </section>
  </main>
</body>
</html>
