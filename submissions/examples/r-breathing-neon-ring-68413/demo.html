<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Pure CSS breathing neon ring animation."
  >
  <title>CSS Breathing Neon Ring</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section class="demo" aria-labelledby="title">
      <span class="eyebrow">EaseMotion CSS</span>

      <h1 id="title">Breathing Neon Ring</h1>

      <p class="intro">
        A lightweight circular neon ring with a smooth breathing glow.
      </p>

      <div class="ring-stage" aria-label="Animated breathing neon ring">
        <div class="neon-ring">
          <span class="ring-core"></span>
        </div>
      </div>

      <p class="status">
        <span class="status-dot"></span>
        Active
      </p>
    </section>
  </main>
</body>
</html>
