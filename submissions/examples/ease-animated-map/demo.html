<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EaseMotion CSS - Animated Map Background</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="ease-map-wrapper" role="region" aria-label="Animated world map showing flight paths">
    <svg class="ease-map-svg" viewBox="0 0 1000 500" preserveAspectRatio="xMidYMid meet">
      <!-- Abstract Continents -->
      <path class="ease-landmass" d="M100,100 C150,50 300,50 350,150 C400,250 250,400 150,350 C50,300 50,150 100,100 Z" /> <!-- Americas Base -->
      <path class="ease-landmass" d="M450,80 C600,20 750,80 800,150 C850,250 950,300 900,400 C800,450 600,400 500,250 C450,150 400,120 450,80 Z" /> <!-- Eurasia/Africa Base -->
      
      <!-- Flight Paths -->
      <path class="ease-flight-path" d="M 250 200 Q 400 50 550 150" />
      <path class="ease-flight-trail" d="M 250 200 Q 400 50 550 150" />
      
      <path class="ease-flight-path" d="M 550 150 Q 750 100 850 250" />
      <path class="ease-flight-trail" d="M 550 150 Q 750 100 850 250" style="animation-delay: 2s;" />
    </svg>
    
    <!-- Radar Nodes -->
    <div class="ease-map-node ease-node-ny" title="New York"></div>
    <div class="ease-map-node ease-node-london" title="London"></div>
    <div class="ease-map-node ease-node-tokyo" title="Tokyo"></div>
    
    <!-- Aircrafts using CSS offset-path -->
    <div class="ease-aircraft ease-aircraft-1">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/></svg>
    </div>
    <div class="ease-aircraft ease-aircraft-2">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/></svg>
    </div>
  </div>

  <p style="position: absolute; bottom: 2rem; color: #475569; font-family: system-ui; font-size: 0.875rem;">Aircraft animated using CSS offset-path and offset-rotate. Trail animated via stroke-dasharray. Zero JS.</p>

</body>
</html>
