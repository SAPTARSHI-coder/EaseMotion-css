<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-carousel-horse-go demo</title>
</head>
<body>
<div class="cr-app">
  <div class="cr-ride">
    <div class="cr-canopy"></div>
    <div class="cr-mast"></div>
    <div class="cr-horse cr-horse-1">
      <div class="cr-body"></div>
      <div class="cr-neck"></div>
      <div class="cr-head"></div>
      <div class="cr-tail"></div>
      <div class="cr-leg cr-leg-1"></div>
      <div class="cr-leg cr-leg-2"></div>
    </div>
    <div class="cr-horse cr-horse-2">
      <div class="cr-body"></div>
      <div class="cr-neck"></div>
      <div class="cr-head"></div>
      <div class="cr-tail"></div>
      <div class="cr-leg cr-leg-1"></div>
      <div class="cr-leg cr-leg-2"></div>
    </div>
    <div class="cr-horse cr-horse-3">
      <div class="cr-body"></div>
      <div class="cr-neck"></div>
      <div class="cr-head"></div>
      <div class="cr-tail"></div>
      <div class="cr-leg cr-leg-1"></div>
      <div class="cr-leg cr-leg-2"></div>
    </div>
    <div class="cr-base">
      <span class="cr-bulb cr-bulb-1"></span>
      <span class="cr-bulb cr-bulb-2"></span>
      <span class="cr-bulb cr-bulb-3"></span>
      <span class="cr-bulb cr-bulb-4"></span>
    </div>
  </div>
</div>
</body>
</html>
