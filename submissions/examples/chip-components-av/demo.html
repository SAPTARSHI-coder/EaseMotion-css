<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Chip Components • EaseMotion CSS</title>

    <link rel="stylesheet" href="../../easemotion.css" />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="container">
      <span class="badge"> CHIP COMPONENTS </span>

      <h1>Modern Chip Collection</h1>

      <p>
        A colorful collection of reusable chips for tags, filters, categories
        and status indicators.
      </p>

      <div class="chips">
        <button class="chip purple">🚀 Launch</button>

        <button class="chip cyan">💎 Premium</button>

        <button class="chip green">✔ Verified</button>

        <button class="chip orange">🔥 Trending</button>

        <button class="chip pink">❤️ Favorite</button>

        <button class="chip glass">✨ Glass</button>

        <button class="chip gradient">⚡ AI Powered</button>

        <button class="chip dark">🌙 Dark Mode</button>
      </div>
    </div>
  </body>
</html>
