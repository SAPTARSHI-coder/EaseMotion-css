<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Morph Glow Toast</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="toast-container">

<div class="toast success">
<div class="icon">✓</div>
<div class="content">
<h3>Victory!</h3>
<p>Mission completed successfully.</p>
</div>
</div>

<div class="toast warning">
<div class="icon">!</div>
<div class="content">
<h3>Low Energy</h3>
<p>Recharge before entering the arena.</p>
</div>
</div>

<div class="toast info">
<div class="icon">★</div>
<div class="content">
<h3>Reward Ready</h3>
<p>Your daily loot is available.</p>
</div>
</div>

</div>

</body>
</html>
