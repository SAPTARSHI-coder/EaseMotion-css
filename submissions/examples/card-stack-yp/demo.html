<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stacked Cards Demo</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="ease-card-stack-wrapper" id="cardStack">
        <!-- Card 1: Someone / Doctor (Boat & Teal Heart) -->
        <div class="ease-card card-pos-0" data-card-id="1">
            <div class="ease-card-header">
                <div class="ease-avatar">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M2 21c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1 .6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/>
                        <path d="M19.38 20A11.6 11.6 0 0 0 21 14l-9-4-9 4c0 2.9.94 5.34 2.81 7.76"/>
                        <path d="M19 13V7a2 2 0 0 0-2-2H7a2 2 0 0 0-2 2v6"/>
                    </svg>
                </div>
                <div class="ease-user-info">
                    <span class="ease-user-name">Someone</span>
                    <span class="ease-user-role">Doctor</span>
                </div>
            </div>

            <div class="ease-card-media">
                <svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#6be3c0"/>
                            <stop offset="100%" stop-color="#4dbca0"/>
                        </linearGradient>
                        <linearGradient id="boatHull" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#ff7b6e"/>
                            <stop offset="100%" stop-color="#e04a3a"/>
                        </linearGradient>
                        <linearGradient id="boatInner" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="#ffd5cc"/>
                            <stop offset="100%" stop-color="#fca89b"/>
                        </linearGradient>
                    </defs>
                    <!-- Heart Background Shape -->
                    <path d="M100 162C100 162 165 125 165 83.5C165 62.5 148 45.5 127 45.5C114.5 45.5 105 52.5 100 59.5C95 52.5 85.5 45.5 73 45.5C52 45.5 35 62.5 35 83.5C35 125 100 162 100 162Z" fill="url(#heartGrad)"/>
                    
                    <!-- 3D Boat Illustration inside Heart -->
                    <g transform="translate(48, 68) rotate(-15)">
                        <!-- Boat Shadow -->
                        <ellipse cx="50" cy="55" rx="38" ry="12" fill="rgba(0,80,60,0.18)" />
                        <!-- Outer Hull -->
                        <path d="M10 32 C 10 32, 45 62, 85 45 C 92 42, 98 32, 98 32 C 98 32, 60 18, 20 25 C 13 26, 10 32, 10 32 Z" fill="url(#boatHull)" stroke="#c43828" stroke-width="1.5"/>
                        <!-- Inner Deck Cavity -->
                        <path d="M18 31 C 18 31, 45 54, 80 41 C 85 39, 89 32, 89 32 C 89 32, 58 23, 26 27 C 20 28, 18 31, 18 31 Z" fill="url(#boatInner)"/>
                        <!-- Wooden Seats -->
                        <path d="M30 29.5 L 34 38.5 L 42 37.5 L 38 28.5 Z" fill="#e04a3a"/>
                        <path d="M52 27.5 L 56 38.5 L 64 36.5 L 60 26.5 Z" fill="#e04a3a"/>
                        <!-- Motor Engine -->
                        <rect x="8" y="27" width="7" height="9" rx="2" fill="#334155" transform="rotate(-15 8 27)"/>
                    </g>
                </svg>
            </div>

            <div class="ease-card-footer">
                <div class="ease-stats">
                    <button class="ease-stat-item ease-heart-btn" aria-label="Like">
                        <svg viewBox="0 0 24 24">
                            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                        </svg>
                        <span class="like-count">64</span>
                    </button>
                    <button class="ease-stat-item" aria-label="Comments">
                        <svg viewBox="0 0 24 24">
                            <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
                        </svg>
                        <span>12</span>
                    </button>
                </div>
                <button class="ease-move-btn" aria-label="Next Card">
                    <svg viewBox="0 0 24 24">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Card 2: Sudha Shrestha / ML Engineer (Planet & Flower Shape) -->
        <div class="ease-card card-pos-1" data-card-id="2">
            <div class="ease-card-header">
                <div class="ease-avatar">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="9"/>
                        <path d="M3.6 9h16.8"/>
                        <path d="M3.6 15h16.8"/>
                        <path d="M11.5 3a17 17 0 0 0 0 18"/>
                        <path d="M12.5 3a17 17 0 0 1 0 18"/>
                    </svg>
                </div>
                <div class="ease-user-info">
                    <span class="ease-user-name">Sudha Shrestha</span>
                    <span class="ease-user-role">ML Engineer</span>
                </div>
            </div>

            <div class="ease-card-media">
                <svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="flowerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#70e2c4"/>
                            <stop offset="100%" stop-color="#4fbfa2"/>
                        </linearGradient>
                        <linearGradient id="planetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#fde047"/>
                            <stop offset="100%" stop-color="#f97316"/>
                        </linearGradient>
                        <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#ffb703"/>
                            <stop offset="100%" stop-color="#fb8500"/>
                        </linearGradient>
                    </defs>
                    <!-- Organic Flower/Cloud Shape Background -->
                    <path d="M100 35 C115 35 125 45 138 45 C152 45 165 55 165 70 C165 85 155 98 158 112 C162 126 150 142 138 148 C125 154 112 165 98 165 C84 165 72 154 60 148 C48 142 35 128 38 112 C41 96 35 84 35 70 C35 56 48 45 62 45 C75 45 85 35 100 35 Z" fill="url(#flowerGrad)"/>
                    
                    <!-- 3D Saturn Planet with Rings -->
                    <g transform="translate(100, 100)">
                        <!-- Back half of Ring -->
                        <path d="M-55 -8 C-55 -22 55 -22 55 -8" stroke="url(#ringGrad)" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.6"/>
                        <!-- Planet Body -->
                        <circle cx="0" cy="0" r="30" fill="url(#planetGrad)" stroke="#ea580c" stroke-width="1.5"/>
                        <!-- Planet Stripes -->
                        <path d="M-28 6 C-10 12 10 12 28 6" stroke="#ea580c" stroke-width="2" opacity="0.5" fill="none"/>
                        <!-- Front half of Ring -->
                        <path d="M-55 -8 C-55 12 55 12 55 -8" stroke="url(#ringGrad)" stroke-width="7" stroke-linecap="round" fill="none"/>
                        <!-- Small Orbiting Moon -->
                        <circle cx="34" cy="-28" r="5" fill="#ef4444" stroke="#dc2626" stroke-width="1"/>
                    </g>
                </svg>
            </div>

            <div class="ease-card-footer">
                <div class="ease-stats">
                    <button class="ease-stat-item ease-heart-btn" aria-label="Like">
                        <svg viewBox="0 0 24 24">
                            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                        </svg>
                        <span class="like-count">98</span>
                    </button>
                    <button class="ease-stat-item" aria-label="Comments">
                        <svg viewBox="0 0 24 24">
                            <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
                        </svg>
                        <span>17</span>
                    </button>
                </div>
                <button class="ease-move-btn" aria-label="Next Card">
                    <svg viewBox="0 0 24 24">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Card 3: Alex Rivera / Product Designer (Rocket & Star) -->
        <div class="ease-card card-pos-2" data-card-id="3">
            <div class="ease-card-header">
                <div class="ease-avatar">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/>
                        <path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-3.05 11a22.35 22.35 0 0 1-3.95 2z"/>
                    </svg>
                </div>
                <div class="ease-user-info">
                    <span class="ease-user-name">Alex Rivera</span>
                    <span class="ease-user-role">Product Designer</span>
                </div>
            </div>

            <div class="ease-card-media">
                <svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#5eead4"/>
                            <stop offset="100%" stop-color="#14b8a6"/>
                        </linearGradient>
                    </defs>
                    <!-- Rounded Star Shape -->
                    <path d="M100 30 C108 65 135 92 170 100 C135 108 108 135 100 170 C92 135 65 108 30 100 C65 92 92 65 100 30 Z" fill="url(#starGrad)"/>
                    
                    <!-- 3D Rocket Illustration -->
                    <g transform="translate(100, 100) rotate(-45)">
                        <path d="M-12 -28 C-12 -28 0 -48 12 -28 C22 -10 20 18 12 28 L-12 28 C-20 18 -22 -10 -12 -28 Z" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
                        <circle cx="0" cy="-6" r="7" fill="#38bdf8" stroke="#0284c7" stroke-width="1.5"/>
                        <path d="M-12 12 L-22 28 L-12 24 Z" fill="#ef4444"/>
                        <path d="M12 12 L22 28 L12 24 Z" fill="#ef4444"/>
                        <path d="M-8 28 C-8 38 0 46 0 46 C0 46 8 38 8 28 Z" fill="#f97316"/>
                    </g>
                </svg>
            </div>

            <div class="ease-card-footer">
                <div class="ease-stats">
                    <button class="ease-stat-item ease-heart-btn" aria-label="Like">
                        <svg viewBox="0 0 24 24">
                            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                        </svg>
                        <span class="like-count">142</span>
                    </button>
                    <button class="ease-stat-item" aria-label="Comments">
                        <svg viewBox="0 0 24 24">
                            <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
                        </svg>
                        <span>24</span>
                    </button>
                </div>
                <button class="ease-move-btn" aria-label="Next Card">
                    <svg viewBox="0 0 24 24">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Card 4: Elena Rostova / 3D Artist (Camera & Blob) -->
        <div class="ease-card card-pos-3" data-card-id="4">
            <div class="ease-card-header">
                <div class="ease-avatar">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/>
                        <circle cx="12" cy="13" r="3"/>
                    </svg>
                </div>
                <div class="ease-user-info">
                    <span class="ease-user-name">Elena Rostova</span>
                    <span class="ease-user-role">3D Illustrator</span>
                </div>
            </div>

            <div class="ease-card-media">
                <svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="blobGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#4ade80"/>
                            <stop offset="100%" stop-color="#0d9488"/>
                        </linearGradient>
                    </defs>
                    <!-- Blob Shape -->
                    <path d="M100 32 C140 28 168 55 168 95 C168 135 138 168 98 168 C58 168 32 138 32 98 C32 58 60 36 100 32 Z" fill="url(#blobGrad)"/>
                    
                    <!-- 3D Camera Illustration -->
                    <g transform="translate(100, 100)">
                        <rect x="-35" y="-22" width="70" height="46" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
                        <path d="M-12 -22 L-6 -30 L6 -30 L12 -22 Z" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
                        <circle cx="0" cy="2" r="15" fill="#f43f5e" stroke="#be123c" stroke-width="2"/>
                        <circle cx="0" cy="2" r="8" fill="#fda4af"/>
                        <circle cx="22" cy="-12" r="3" fill="#38bdf8"/>
                    </g>
                </svg>
            </div>

            <div class="ease-card-footer">
                <div class="ease-stats">
                    <button class="ease-stat-item ease-heart-btn" aria-label="Like">
                        <svg viewBox="0 0 24 24">
                            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                        </svg>
                        <span class="like-count">210</span>
                    </button>
                    <button class="ease-stat-item" aria-label="Comments">
                        <svg viewBox="0 0 24 24">
                            <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
                        </svg>
                        <span>35</span>
                    </button>
                </div>
                <button class="ease-move-btn" aria-label="Next Card">
                    <svg viewBox="0 0 24 24">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const cards = Array.from(document.querySelectorAll('.ease-card'));
            let isAnimating = false;

            // Handle Move Card Animation
            function moveNextCard() {
                if (isAnimating) return;
                isAnimating = true;

                const topCard = document.querySelector('.card-pos-0');
                if (!topCard) {
                    isAnimating = false;
                    return;
                }

                // 1. Top card slides straight down off screen at speed and vanishes
                topCard.classList.add('moving-out');

                // 2. Shift other cards up smoothly to take front position
                setTimeout(() => {
                    cards.forEach(card => {
                        if (card === topCard) return;

                        if (card.classList.contains('card-pos-1')) {
                            card.className = 'ease-card card-pos-0';
                        } else if (card.classList.contains('card-pos-2')) {
                            card.className = 'ease-card card-pos-1';
                        } else if (card.classList.contains('card-pos-3')) {
                            card.className = 'ease-card card-pos-2';
                        }
                    });
                }, 40);

                // 3. Reset old top card to back of deck (card-pos-3)
                setTimeout(() => {
                    topCard.className = 'ease-card card-pos-3';
                    topCard.classList.remove('moving-out');
                    isAnimating = false;
                }, 380);
            }

            // Event Listeners for Move Buttons & Card Clicking
            cards.forEach(card => {
                const moveBtn = card.querySelector('.ease-move-btn');
                if (moveBtn) {
                    moveBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        moveNextCard();
                    });
                }

                // Heart Like Button Toggle
                const heartBtn = card.querySelector('.ease-heart-btn');
                if (heartBtn) {
                    heartBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const isLiked = heartBtn.classList.toggle('liked');
                        const countSpan = heartBtn.querySelector('.like-count');
                        if (countSpan) {
                            let currentCount = parseInt(countSpan.textContent, 10);
                            countSpan.textContent = isLiked ? currentCount + 1 : currentCount - 1;
                        }
                    });
                }

                // Clicking on top card body moves card down
                card.addEventListener('click', (e) => {
                    if (card.classList.contains('card-pos-0') && !e.target.closest('.ease-stat-item')) {
                        moveNextCard();
                    }
                });
            });
        });
    </script>
</body>

</html>
