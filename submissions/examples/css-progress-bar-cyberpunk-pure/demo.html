<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progress Bar: Cyberpunk</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        
        <header class="header">
            <h1 class="title" data-text="SYSTEM_OVERRIDE">SYSTEM_OVERRIDE</h1>
            <p>High-voltage, neon-infused progress indicator.</p>
        </header>

        <main class="content-area">
            
            <!-- Cyberpunk Progress Component -->
            <div class="cyber-progress-container">
                
                <!-- Glitching Label -->
                <div class="progress-label">
                    <span>UPLINK_STATUS</span>
                    <span class="percentage">78%</span>
                </div>

                <!-- The Actual Progress Bar wrapper -->
                <div class="cyber-track" role="progressbar" aria-valuenow="78" aria-valuemin="0" aria-valuemax="100" aria-label="Uplink Upload Status">
                    
                    <!-- The Glowing Fill -->
                    <div class="cyber-fill" style="width: 78%;">
                        <!-- Inner diagonal striping for texture -->
                        <div class="cyber-stripes"></div>
                    </div>
                    
                    <!-- Decorative scanning line that passes over the bar -->
                    <div class="cyber-scanner"></div>
                </div>

                <!-- Decorative UI Elements -->
                <div class="cyber-decoration">
                    <span class="dec-box"></span>
                    <span class="dec-box"></span>
                    <span class="dec-box active"></span>
                    <span class="dec-line"></span>
                </div>

            </div>
            
        </main>
    </div>

</body>
</html>
