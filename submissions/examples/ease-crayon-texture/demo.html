<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crayon Texture · waxy texture on interaction</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <div class="crayon-container">
      <div class="crayon-display" id="crayonDisplay">
        <!-- Canvas for crayon texture -->
        <canvas id="crayonCanvas"></canvas>
        
        <!-- Crayon Info -->
        <div class="crayon-info">
          <span class="info-label">🖍️ Strokes</span>
          <span class="info-value" id="strokeCount">0</span>
        </div>

        <!-- Crayon Controls -->
        <div class="crayon-controls">
          <div class="control-group">
            <label class="control-label">🖍️ Pressure</label>
            <input type="range" class="control-slider" id="pressureSlider" min="1" max="10" value="5">
            <span class="control-value" id="pressureValue">5</span>
          </div>
          <div class="control-group">
            <label class="control-label">🎨 Color</label>
            <div class="color-options">
              <button class="color-btn active" data-color="#ef4444" style="background:#ef4444;"></button>
              <button class="color-btn" data-color="#f97316" style="background:#f97316;"></button>
              <button class="color-btn" data-color="#fbbf24" style="background:#fbbf24;"></button>
              <button class="color-btn" data-color="#22c55e" style="background:#22c55e;"></button>
              <button class="color-btn" data-color="#3b82f6" style="background:#3b82f6;"></button>
              <button class="color-btn" data-color="#8b5cf6" style="background:#8b5cf6;"></button>
              <button class="color-btn" data-color="#ec4899" style="background:#ec4899;"></button>
              <button class="color-btn" data-color="#f59e0b" style="background:#f59e0b;"></button>
              <button class="color-btn" data-color="#14b8a6" style="background:#14b8a6;"></button>
              <button class="color-btn" data-color="#f472b6" style="background:#f472b6;"></button>
            </div>
          </div>
        </div>

        <!-- Crayon Text -->
        <div class="crayon-text">
          <span class="text-label">🖍️ Crayon</span>
          <span class="text-message" id="crayonMessage">Click and drag to draw with crayon</span>
        </div>
      </div>
      
      <div class="crayon-status">
        <span id="crayonStatus">🖍️ Click and drag to create waxy crayon texture</span>
      </div>
    </div>

    <div class="controls">
      <button class="btn btn-reset" id="resetBtn">⟳ Clear</button>
    </div>
    <div class="footer-note">
      <span>🖍️ waxy crayon texture · pressure control · 10 colors</span>
    </div>
  </div>

  <script>
    (function() {
      "use strict";

      // DOM refs
      const canvas = document.getElementById('crayonCanvas');
      const ctx = canvas.getContext('2d');
      const display = document.getElementById('crayonDisplay');
      const strokeCount = document.getElementById('strokeCount');
      const crayonStatus = document.getElementById('crayonStatus');
      const crayonMessage = document.getElementById('crayonMessage');
      const resetBtn = document.getElementById('resetBtn');
      const pressureSlider = document.getElementById('pressureSlider');
      const pressureValue = document.getElementById('pressureValue');
      const colorBtns = document.querySelectorAll('.color-btn');

      // State
      let isDrawing = false;
      let strokeCountNum = 0;
      let currentColor = '#ef4444';
      let currentPressure = 5;
      let lastX = 0;
      let lastY = 0;
      let crayonStrokes = [];

      // Resize canvas
      function resizeCanvas() {
        const rect = display.getBoundingClientRect();
        canvas.width = rect.width;
        canvas.height = rect.height;
        canvas.style.width = rect.width + 'px';
        canvas.style.height = rect.height + 'px';
        drawBackground();
        // Redraw existing strokes
        if (crayonStrokes.length > 0) {
          redrawAll();
        }
      }

      // Draw background
      function drawBackground() {
        const grad = ctx.createRadialGradient(
          canvas.width/2, canvas.height/2, 0,
          canvas.width/2, canvas.height/2, canvas.width * 0.7
        );
        grad.addColorStop(0, 'rgba(30, 30, 45, 0.2)');
        grad.addColorStop(0.5, 'rgba(20, 20, 35, 0.3)');
        grad.addColorStop(1, 'rgba(10, 10, 20, 0.6)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        // Add subtle paper texture
        for (let i = 0; i < 600; i++) {
          const x = Math.random() * canvas.width;
          const y = Math.random() * canvas.height;
          const size = Math.random() * 1.5 + 0.5;
          const alpha = Math.random() * 0.02;
          ctx.fillStyle = `rgba(255,255,255,${alpha})`;
          ctx.fillRect(x, y, size, size);
        }
      }

      // Get canvas coordinates
      function getCoords(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return {
          x: (clientX - rect.left) * (canvas.width / rect.width),
          y: (clientY - rect.top) * (canvas.height / rect.height)
        };
      }

      // Draw crayon stroke with waxy texture
      function drawCrayonStroke(x1, y1, x2, y2, color, pressure) {
        const dist = Math.sqrt(Math.pow(x2 - x1, 2) + Math.pow(y2 - y1, 2));
        if (dist < 1) return;

        const steps = Math.max(Math.floor(dist / 1.5), 8);
        const baseSize = 3 + pressure * 1.2;
        const waxiness = 0.3 + pressure * 0.07;

        for (let i = 0; i < steps; i++) {
          const t = i / steps;
          const x = x1 + (x2 - x1) * t;
          const y = y1 + (y2 - y1) * t;
          
          // Crayon texture - multiple waxy particles
          const particleCount = 3 + Math.floor(Math.random() * pressure);
          
          for (let j = 0; j < particleCount; j++) {
            const offsetX = (Math.random() - 0.5) * baseSize * 0.8;
            const offsetY = (Math.random() - 0.5) * baseSize * 0.8;
            const size = baseSize * (0.3 + Math.random() * 0.7);
            
            // Waxy texture - semi-transparent with grain
            const alpha = 0.3 + Math.random() * 0.4;
            const brightness = 0.7 + Math.random() * 0.3;
            
            ctx.save();
            ctx.globalAlpha = alpha * waxiness;
            
            // Irregular shape for waxy texture
            const points = 6 + Math.floor(Math.random() * 4);
            ctx.beginPath();
            for (let k = 0; k < points; k++) {
              const angle = (k / points) * Math.PI * 2 + (Math.random() - 0.5) * 0.3;
              const r = size * (0.6 + Math.random() * 0.4);
              const px = x + offsetX + Math.cos(angle) * r;
              const py = y + offsetY + Math.sin(angle) * r;
              if (k === 0) ctx.moveTo(px, py);
              else ctx.lineTo(px, py);
            }
            ctx.closePath();
            
            // Crayon color with slight variation
            const colorObj = hexToRgb(color);
            const r = Math.min(255, colorObj.r + (Math.random() - 0.5) * 30);
            const g = Math.min(255, colorObj.g + (Math.random() - 0.5) * 30);
            const b = Math.min(255, colorObj.b + (Math.random() - 0.5) * 30);
            ctx.fillStyle = `rgb(${r},${g},${b})`;
            ctx.fill();
            
            // Waxy highlight
            if (Math.random() > 0.6) {
              ctx.globalAlpha = alpha * 0.2;
              ctx.beginPath();
              ctx.arc(
                x + offsetX + (Math.random() - 0.5) * size * 0.3,
                y + offsetY + (Math.random() - 0.5) * size * 0.3,
                size * 0.2,
                0,
                Math.PI * 2
              );
              ctx.fillStyle = '#ffffff';
              ctx.fill();
            }
            
            ctx.restore();
          }
          
          // Extra waxy texture - small dots
          if (Math.random() > 0.7) {
            ctx.save();
            ctx.globalAlpha = 0.1 + Math.random() * 0.15;
            for (let k = 0; k < 3; k++) {
              const dx = (Math.random() - 0.5) * baseSize;
              const dy = (Math.random() - 0.5) * baseSize;
              const ds = baseSize * (0.05 + Math.random() * 0.08);
              ctx.beginPath();
              ctx.arc(x + dx, y + dy, ds, 0, Math.PI * 2);
              ctx.fillStyle = '#ffffff';
              ctx.fill();
            }
            ctx.restore();
          }
        }
      }

      // Hex to RGB helper
      function hexToRgb(hex) {
        const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
        return result ? {
          r: parseInt(result[1], 16),
          g: parseInt(result[2], 16),
          b: parseInt(result[3], 16)
        } : { r: 0, g: 0, b: 0 };
      }

      // Redraw all strokes
      function redrawAll() {
        drawBackground();
        for (let i = 0; i < crayonStrokes.length - 1; i++) {
          const s1 = crayonStrokes[i];
          const s2 = crayonStrokes[i + 1];
          drawCrayonStroke(s1.x, s1.y, s2.x, s2.y, s1.color, s1.pressure);
        }
      }

      // Start drawing
      function startDrawing(e) {
        e.preventDefault();
        isDrawing = true;
        const coords = getCoords(e);
        lastX = coords.x;
        lastY = coords.y;
        
        crayonStrokes.push({
          x: lastX,
          y: lastY,
          color: currentColor,
          pressure: currentPressure
        });
        
        strokeCountNum++;
        strokeCount.textContent = strokeCountNum;
        
        crayonStatus.textContent = '🖍️ Drawing with crayon...';
        crayonStatus.style.color = currentColor;
        crayonMessage.textContent = '🖍️ Drawing...';
        crayonMessage.style.color = currentColor;
      }

      // Draw
      function draw(e) {
        e.preventDefault();
        if (!isDrawing) return;
        
        const coords = getCoords(e);
        const x = coords.x;
        const y = coords.y;
        
        drawCrayonStroke(lastX, lastY, x, y, currentColor, currentPressure);
        
        crayonStrokes.push({
          x: x,
          y: y,
          color: currentColor,
          pressure: currentPressure
        });
        
        lastX = x;
        lastY = y;
        strokeCountNum++;
        strokeCount.textContent = strokeCountNum;
      }

      // Stop drawing
      function stopDrawing(e) {
        if (isDrawing) {
          isDrawing = false;
          crayonStatus.textContent = '🖍️ Crayon stroke complete!';
          crayonStatus.style.color = '#4ade80';
          crayonMessage.textContent = 'Click and drag to draw with crayon';
          crayonMessage.style.color = '#94a3b8';
          setTimeout(() => {
            crayonStatus.textContent = '🖍️ Click and drag to create waxy crayon texture';
            crayonStatus.style.color = '#94a3b8';
          }, 1500);
        }
      }

      // Set color
      function setColor(color) {
        currentColor = color;
        colorBtns.forEach(btn => {
          btn.classList.toggle('active', btn.dataset.color === color);
        });
        crayonStatus.textContent = `🎨 Color selected`;
        crayonStatus.style.color = color;
        setTimeout(() => {
          crayonStatus.textContent = '🖍️ Click and drag to create waxy crayon texture';
          crayonStatus.style.color = '#94a3b8';
        }, 1000);
      }

      // Set pressure
      function setPressure(value) {
        currentPressure = parseInt(value);
        pressureValue.textContent = currentPressure;
        crayonStatus.textContent = `🖍️ Pressure: ${currentPressure}/10`;
        crayonStatus.style.color = '#a78bfa';
        setTimeout(() => {
          crayonStatus.textContent = '🖍️ Click and drag to create waxy crayon texture';
          crayonStatus.style.color = '#94a3b8';
        }, 1500);
      }

      // Clear canvas
      function clearCanvas() {
        crayonStrokes = [];
        strokeCountNum = 0;
        strokeCount.textContent = '0';
        drawBackground();
        crayonStatus.textContent = '🧹 Canvas cleared';
        crayonStatus.style.color = '#94a3b8';
        crayonMessage.textContent = 'Click and drag to draw with crayon';
        crayonMessage.style.color = '#94a3b8';
        setTimeout(() => {
          crayonStatus.textContent = '🖍️ Click and drag to create waxy crayon texture';
          crayonStatus.style.color = '#94a3b8';
        }, 1000);
      }

      // Event listeners
      canvas.addEventListener('mousedown', startDrawing);
      canvas.addEventListener('mousemove', draw);
      canvas.addEventListener('mouseup', stopDrawing);
      canvas.addEventListener('mouseleave', stopDrawing);

      // Touch events
      canvas.addEventListener('touchstart', startDrawing, { passive: false });
      canvas.addEventListener('touchmove', draw, { passive: false });
      canvas.addEventListener('touchend', stopDrawing, { passive: false });

      // Color buttons
      colorBtns.forEach(btn => {
        btn.addEventListener('click', function() {
          setColor(this.dataset.color);
        });
      });

      // Pressure slider
      pressureSlider.addEventListener('input', function() {
        setPressure(this.value);
      });

      if (resetBtn) {
        resetBtn.addEventListener('click', function(e) {
          e.preventDefault();
          clearCanvas();
        });
      }

      // Keyboard shortcuts
      document.addEventListener('keydown', function(e) {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

        const key = e.key;
        if (key === 'c' || key === 'C') {
          e.preventDefault();
          clearCanvas();
        }
      });

      // Resize
      window.addEventListener('resize', resizeCanvas);

      // Initialize
      resizeCanvas();
      
      console.log('🖍️ Crayon Texture ready · shortcuts: [C] Clear');
    })();
  </script>
</body>
</html>
