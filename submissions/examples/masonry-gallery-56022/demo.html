<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS-Only Masonry Gallery</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            margin: 0;
            padding: 40px;
            background-color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        
        h1 {
            text-align: center;
            color: #1e293b;
            margin-bottom: 40px;
        }
    </style>
</head>
<body>
    <h1>Masonry Gallery</h1>
    
    <div class="ease-masonry-grid">
        <div class="ease-masonry-item">
            <img src="https://images.unsplash.com/photo-1513360371669-4adf3dd7dff8?q=80&w=600&auto=format&fit=crop" alt="Masonry 1">
        </div>
        <div class="ease-masonry-item">
            <img src="https://images.unsplash.com/photo-1541701494587-cb58502866ab?q=80&w=600&auto=format&fit=crop" style="height: 400px; object-fit: cover;" alt="Masonry 2">
        </div>
        <div class="ease-masonry-item">
            <img src="https://images.unsplash.com/photo-1506744626753-1fa30fd22540?q=80&w=600&auto=format&fit=crop" alt="Masonry 3">
        </div>
        <div class="ease-masonry-item">
            <img src="https://images.unsplash.com/photo-1523726491678-bf079db41b9e?q=80&w=600&auto=format&fit=crop" style="height: 350px; object-fit: cover;" alt="Masonry 4">
        </div>
        <div class="ease-masonry-item">
            <img src="https://images.unsplash.com/photo-1493246507139-91e8fad9978e?q=80&w=600&auto=format&fit=crop" alt="Masonry 5">
        </div>
        <div class="ease-masonry-item">
            <img src="https://images.unsplash.com/photo-1470770903672-7c20be6eb50e?q=80&w=600&auto=format&fit=crop" style="height: 250px; object-fit: cover;" alt="Masonry 6">
        </div>
    </div>
</body>
</html>
