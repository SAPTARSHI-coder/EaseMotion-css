<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CRT Monitor Scanlines | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="crtwrap">
    <div class="crtscreen">
      <div class="crtcontent">
        <div class="crtheader">SYSTEM BOOT v2.4.1</div>
        <p class="crtline">Loading kernel modules... OK</p>
        <p class="crtline">Mounting filesystems... OK</p>
        <p class="crtline">Starting network service... OK</p>
        <p class="crtline">Initializing user session... OK</p>
        <p class="crtline"><span class="crtprompt">user@system:~$</span> run --mode=interactive<span class="crtcursor"></span></p>
      </div>
    </div>
  </div>
</body>
</html>
