<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zoom-In Card Grid - E-Commerce Checkout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<section class="checkout-container">

    <h1>E-Commerce Checkout</h1>
    <p class="subtitle">Complete your order in three simple steps</p>

    <div class="card-grid">

        <article class="card">
            <div class="icon">📦</div>
            <h2>Shipping</h2>
            <p>Add your shipping address and delivery preferences.</p>
            <button>Select</button>
        </article>

        <article class="card">
            <div class="icon">💳</div>
            <h2>Payment</h2>
            <p>Choose your preferred payment method securely.</p>
            <button>Select</button>
        </article>

        <article class="card">
            <div class="icon">🛒</div>
            <h2>Review Order</h2>
            <p>Verify your items before placing the final order.</p>
            <button>Review</button>
        </article>

    </div>

</section>

</body>
</html>
