<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Pure CSS elastic band snap animation"
  >
  <title>CSS Elastic Band Snap</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">
    <section class="demo-card" aria-labelledby="demo-title">

      <p class="eyebrow">EaseMotion CSS</p>

      <h1 id="demo-title">Elastic Band Snap</h1>

      <p class="description">
        Hover or focus the element to see it stretch and snap back
        with a playful elastic motion.
      </p>

      <button class="elastic-button" type="button">
        <span>Snap Me</span>
      </button>

      <p class="hint">
        Hover or use the keyboard to interact
      </p>

    </section>
  </main>

</body>
</html>
