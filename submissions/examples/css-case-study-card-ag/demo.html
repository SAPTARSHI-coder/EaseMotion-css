<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Case Study Card</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <!-- The Case Study Card acts as a unified link -->
  <a href="#" class="case-study-card" aria-label="Read case study for TechCorp E-Commerce Redesign">
    
    <div class="card-image-wrapper">
      <span class="client-badge">TechCorp</span>
      <img class="card-image" src="https://images.unsplash.com/photo-1551288049-bebda4e38f71?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80" alt="Dashboard data visualization on a screen" />
    </div>
    
    <div class="card-content">
      <h3 class="card-title">E-Commerce Platform Redesign</h3>
      <p class="card-desc">We completely overhauled the user experience and underlying architecture to maximize conversion rates and reduce cart abandonment.</p>
      
      <div class="card-metrics">
        <div class="metric-item">
          <span class="metric-value">+42%</span>
          <span class="metric-label">Conversion</span>
        </div>
        <div class="metric-item">
          <span class="metric-value">-1.5s</span>
          <span class="metric-label">Load Time</span>
        </div>
      </div>
    </div>
    
    <!-- Animated reveal arrow on hover -->
    <div class="card-arrow" aria-hidden="true">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" width="20" height="20">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
      </svg>
    </div>
    
  </a>

</body>
</html>
