<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic SaaS Tab Bar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="saas-tabs">
        <input type="radio" name="stabs" id="st1" checked>
        <input type="radio" name="stabs" id="st2">
        <input type="radio" name="stabs" id="st3">
        
        <div class="st-nav">
            <label for="st1" class="st-btn">Overview</label>
            <label for="st2" class="st-btn">Integrations</label>
            <label for="st3" class="st-btn">Billing</label>
            <div class="st-slider"></div>
        </div>
        
        <div class="st-content-wrapper">
            <div class="st-panels">
                <div class="st-panel"><h3>Overview</h3><p>Your workspace analytics.</p></div>
                <div class="st-panel"><h3>Integrations</h3><p>Connect your tools.</p></div>
                <div class="st-panel"><h3>Billing</h3><p>Manage your subscription.</p></div>
            </div>
        </div>
    </div>
</body>
</html>
