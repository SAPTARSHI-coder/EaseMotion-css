<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CSS-only responsive video player modal">
  <title>CSS Video Player Modal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">
    <header class="hero">
      <p class="eyebrow">EaseMotion CSS</p>
      <h1>CSS Video Player Modal</h1>
      <p>
        A responsive video player modal built with HTML and CSS,
        without JavaScript.
      </p>
    </header>

    <section class="preview" aria-labelledby="preview-title">
      <div class="preview-card">
        <div class="thumbnail" aria-hidden="true">
          <span class="play-icon">▶</span>
        </div>

        <div class="preview-content">
          <h2 id="preview-title">Video Preview</h2>
          <p>
            Open the video player to view the responsive modal experience.
          </p>

          <a
            class="open-button"
            href="#video-modal"
            aria-label="Open video player"
          >
            ▶ Watch Video
          </a>
        </div>
      </div>
    </section>
  </main>

  <!-- CSS-only modal -->
  <div
    class="modal"
    id="video-modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="video-title"
  >
    <a
      class="modal-backdrop"
      href="#"
      aria-label="Close video player"
    ></a>

    <div class="modal-content">
      <div class="modal-header">
        <h2 id="video-title">Video Player</h2>

        <a
          href="#"
          class="close-button"
          aria-label="Close video player"
        >
          &times;
        </a>
      </div>

      <div class="video-wrapper">
        <video
          controls
          preload="metadata"
          poster="https://images.unsplash.com/photo-1485846234645-a62644f84728?auto=format&fit=crop&w=1200&q=80"
        >
          <source
            src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4"
            type="video/mp4"
          >
          Your browser does not support the video element.
        </video>
      </div>

      <div class="video-info">
        <p>CSS-only responsive video player modal</p>
      </div>
    </div>
  </div>

</body>
</html>
