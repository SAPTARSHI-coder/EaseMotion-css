<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Message Read Receipts</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="chat-container">
        <div class="message sent">
            <p>Hello, this is a test message!</p>
            <span class="receipt single">✔</span>
        </div>
        <div class="message sent">
            <p>Did you get my last message?</p>
            <span class="receipt double">✔✔</span>
        </div>
        <div class="message sent">
            <p>Great, thanks!</p>
            <span class="receipt read">✔✔</span>
        </div>
    </div>
</body>

</html>
