<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Container Query Micro-Architecture Dashboard Card</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="ease-resizable-wrapper">
    <div class="ease-dashboard-widget">
      <div class="ease-widget-header">
        <h2 class="ease-widget-title">Revenue Analytics</h2>
        <span style="background: rgba(16, 185, 129, 0.2); color: #10b981; padding: 4px 12px; border-radius: 99px; font-size: 0.75rem; font-weight: 600;">+14.2%</span>
      </div>
      <div class="ease-metrics-grid">
        <div class="ease-metric-card">
          <span class="ease-metric-label">Total Volume</span>
          <span class="ease-metric-value">$124.5K</span>
        </div>
        <div class="ease-metric-card">
          <span class="ease-metric-label">Active Users</span>
          <span class="ease-metric-value">8,492</span>
        </div>
        <div class="ease-metric-card">
          <span class="ease-metric-label">Conversion</span>
          <span class="ease-metric-value">4.2%</span>
        </div>
      </div>
      <div class="ease-chart-area">
        <!-- Mock chart bars using CSS -->
        <div style="position: absolute; bottom: 0; left: 10%; width: 10%; height: 40%; background: #38bdf8; opacity: 0.5; border-top-left-radius: 4px; border-top-right-radius: 4px;"></div>
        <div style="position: absolute; bottom: 0; left: 30%; width: 10%; height: 70%; background: #38bdf8; opacity: 0.7; border-top-left-radius: 4px; border-top-right-radius: 4px;"></div>
        <div style="position: absolute; bottom: 0; left: 50%; width: 10%; height: 50%; background: #38bdf8; opacity: 0.6; border-top-left-radius: 4px; border-top-right-radius: 4px;"></div>
        <div style="position: absolute; bottom: 0; left: 70%; width: 10%; height: 90%; background: #38bdf8; opacity: 0.9; border-top-left-radius: 4px; border-top-right-radius: 4px;"></div>
      </div>
    </div>
  </div>
</body>
</html>
