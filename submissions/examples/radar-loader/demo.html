<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radar Scan Loader Demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background-color: #0f172a;
      color: #94a3b8;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    h1 {
      color: #e2e8f0;
      margin-top: 0;
    }

    .demo-wrapper {
      margin-top: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .loading-text {
      font-size: 14px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #10b981;
      animation: pulse-text 2s infinite;
    }

    @keyframes pulse-text {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }
  </style>
</head>
<body>

  <h1>Radar Scan Loader</h1>
  <p>A pure CSS loading animation using <code>conic-gradient</code> and infinite rotation.</p>

  <div class="demo-wrapper">
    <!-- The Radar Loader -->
    <div class="em-radar-container">
      <div class="em-radar-scan"></div>
    </div>
    
    <div class="loading-text">Scanning...</div>
  </div>

</body>
</html>
