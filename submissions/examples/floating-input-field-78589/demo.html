<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Floating Input Field</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="page">
      <form class="card">
        <p class="eyebrow">EaseMotion CSS · Issue #78589</p>
        <h1>Account details</h1>
        <p class="intro">A clean SaaS-style floating label field.</p>
        <div class="field">
          <input id="email" name="email" type="email" placeholder=" " autocomplete="email" required />
          <label for="email">Work email</label>
        </div>
        <button type="submit">Continue</button>
      </form>
    </main>
  </body>
</html>
