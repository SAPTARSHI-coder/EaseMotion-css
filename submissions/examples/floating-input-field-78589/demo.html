<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Floating input field showcase for EaseMotion CSS issue #78589."
    />
    <title>Floating Input Field | EaseMotion CSS</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="page">
      <section class="card" aria-labelledby="page-title">
        <p class="eyebrow">EaseMotion CSS · Issue #78589</p>

        <h1 id="page-title">Account details</h1>

        <p class="intro">
          A responsive form field with a floating label that preserves context
          while the user types.
        </p>

        <form class="form" action="#preview" method="get">
          <div class="field">
            <input
              id="email"
              name="email"
              type="email"
              placeholder=" "
              autocomplete="email"
              required
              aria-describedby="email-help"
            />
            <label for="email">Work email</label>
          </div>

          <p class="field-help" id="email-help">
            Use the address associated with your work account.
          </p>

          <div class="field">
            <input
              id="company"
              name="company"
              type="text"
              placeholder=" "
              autocomplete="organization"
            />
            <label for="company">Company name</label>
          </div>

          <button type="submit">Continue</button>
        </form>
      </section>
    </main>
  </body>
</html>
