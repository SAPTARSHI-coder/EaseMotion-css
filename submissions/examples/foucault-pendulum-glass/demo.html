<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Foucault Pendulum Glass Effect</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="scene">
    <section class="glass-card">
      <div class="pendulum">

        </p>
      </div>
    </section>
  </main>

</body>
</html>
