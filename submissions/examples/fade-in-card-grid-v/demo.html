<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fade-In Card Grid</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<section class="card-grid">

    <div class="card">
        <h2>HTML</h2>
        <p>Semantic and accessible markup.</p>
    </div>

    <div class="card">
        <h2>CSS</h2>
        <p>Pure CSS fade-in animation.</p>
    </div>

    <div class="card">
        <h2>Responsive</h2>
        <p>Works across all screen sizes.</p>
    </div>

    <div class="card">
        <h2>Performance</h2>
        <p>Lightweight without JavaScript.</p>
    </div>

    <div class="card">
        <h2>Accessibility</h2>
        <p>Supports reduced motion.</p>
    </div>

    <div class="card">
        <h2>EaseMotion CSS</h2>
        <p>Reusable animation component.</p>
    </div>

</section>

</body>
</html>
