<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CSS Shimmer-Sweep Badge for Product Catalog Layouts">
  <title>Shimmer-Sweep Product Badge</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="catalog">
    <article class="product-card">
      <div class="product-visual">
        <span class="product-badge">NEW</span>
        <div class="product-icon" aria-hidden="true">✦</div>
      </div>

      <div class="product-content">
        <p class="category">COLLECTION 2026</p>
        <h1>Minimal Ceramic Set</h1>
        <p class="description">
          A refined product showcase with a lightweight animated shimmer badge.
        </p>
        <div class="product-footer">
          <strong>$48</strong>
          <button type="button">View Product</button>
        </div>
      </div>
    </article>
  </main>
</body>
</html>
