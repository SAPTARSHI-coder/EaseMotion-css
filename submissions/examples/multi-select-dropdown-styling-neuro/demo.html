<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neumorphic Multi-Select Dropdown</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Responsive Multi-Select Dropdown Demo</h1>
  <div class="dropdown" role="listbox" aria-label="Neumorphic multi-select dropdown">
    <button class="dropdown-toggle">Select Options ▾</button>
    <ul class="dropdown-menu">
      <li><label><input type="checkbox"> Option 1</label></li>
      <li><label><input type="checkbox"> Option 2</label></li>
      <li><label><input type="checkbox"> Option 3</label></li>
      <li><label><input type="checkbox"> Option 4</label></li>
    </ul>
  </div>
</body>
</html>
