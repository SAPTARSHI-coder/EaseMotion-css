<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <meta
    name="description"
    content="Accessible pure CSS bouncing spring card component."
  >
  <title>Bouncing Spring Card</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="demo">
    <section
      class="spring-card"
      aria-labelledby="spring-card-title"
    >
      <div class="spring-card__glow" aria-hidden="true"></div>

      <div class="spring-card__content">
        <div class="spring-card__icon" aria-hidden="true">
          <svg
            viewBox="0 0 24 24"
            role="presentation"
            focusable="false"
          >
            <path
              d="M12 3v4m0 10v4M3 12h4m10 0h4M5.64 5.64l2.83 2.83m7.06 7.06 2.83 2.83m0-12.72-2.83 2.83M8.47 15.53l-2.83 2.83"
            />
          </svg>
        </div>

        <div class="spring-card__body">
          <span class="spring-card__eyebrow">
            CSS COMPONENT
          </span>

          <h1 id="spring-card-title">
            Bouncing Spring
          </h1>

          <p>
            A lightweight card with a responsive spring-like
            interaction built entirely with semantic HTML and
            hardware-accelerated CSS.
          </p>
        </div>

        <a
          class="spring-card__action"
          href="#learn-more"
          aria-label="Explore Bouncing Spring component"
        >
          <span>Explore</span>

          <svg
            viewBox="0 0 24 24"
            aria-hidden="true"
            focusable="false"
          >
            <path d="M5 12h14m-6-6 6 6-6 6" />
          </svg>
        </a>
      </div>
    </section>
  </main>
</body>
</html>
