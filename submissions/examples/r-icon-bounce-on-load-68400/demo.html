<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CSS icon bounce on load animation">
  <title>CSS Icon Bounce On Load</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section class="showcase" aria-labelledby="title">
      <span class="eyebrow">EaseMotion CSS</span>
      <h1 id="title">Icon Bounce On Load</h1>
      <p class="description">
        A lightweight staggered bounce animation for interface icons.
      </p>

      <div class="icon-grid" aria-label="Animated feature icons">
        <div class="icon-card">
          <span class="icon icon--purple" aria-hidden="true">★</span>
          <h2>Discover</h2>
          <p>Explore new possibilities.</p>
        </div>

        <div class="icon-card">
          <span class="icon icon--cyan" aria-hidden="true">◆</span>
          <h2>Create</h2>
          <p>Build engaging experiences.</p>
        </div>

        <div class="icon-card">
          <span class="icon icon--pink" aria-hidden="true">●</span>
          <h2>Connect</h2>
          <p>Bring ideas together.</p>
        </div>

        <div class="icon-card">
          <span class="icon icon--orange" aria-hidden="true">✦</span>
          <h2>Launch</h2>
          <p>Turn concepts into reality.</p>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
