<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Parallax Carousel</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="page">
      <h1>Parallax Carousel</h1>

      <section class="carousel" aria-label="Featured cards">
        <article class="slide slide-one">
          <span>01</span>
          <h2>Motion</h2>
        </article>
        <article class="slide slide-two">
          <span>02</span>
          <h2>Depth</h2>
        </article>
        <article class="slide slide-three">
          <span>03</span>
          <h2>Flow</h2>
        </article>
      </section>
    </main>
  </body>
</html>
