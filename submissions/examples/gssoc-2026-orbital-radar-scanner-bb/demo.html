<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orbital Radar Sonar Visualizer Scanner | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="radar-wrapper">
    <div class="radar-display">
      <!-- Grid Concentric Rings -->
      <div class="ring ring-1"></div>
      <div class="ring ring-2"></div>
      <div class="ring ring-3"></div>
      
      <!-- Axis Lines -->
      <div class="axis axis-x"></div>
      <div class="axis axis-y"></div>

      <!-- Rotating Sonar Beam -->
      <div class="sonar-sweep"></div>

      <!-- Detected Target Blips -->
      <div class="target-blip blip-1" style="--top: 28%; --left: 65%;">
        <div class="blip-ping"></div>
        <span class="blip-tag">TARGET_ALPHA</span>
      </div>
      
      <div class="target-blip blip-2" style="--top: 70%; --left: 32%;">
        <div class="blip-ping"></div>
        <span class="blip-tag">TARGET_BETA</span>
      </div>

      <!-- Center Node -->
      <div class="center-node"></div>

      <!-- Live Coordinates Overlay -->
      <div class="radar-hud-overlay">
        <div class="hud-item">BEARING: 042° SE</div>
        <div class="hud-item">RANGE: 12.4 KM</div>
      </div>
    </div>
  </div>
</body>
</html>
