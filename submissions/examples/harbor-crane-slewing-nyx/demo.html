<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Harbor Crane Slewing — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Harbor Crane Slewing demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Harbor Crane Slewing</h1>
      <p class="lede">Harbor slewing crane rotating with load on hook</p>
    </header>

    <section class="ease-harbor-crane-slewing" data-demo="harbor-crane-slewing" aria-live="polite">
      <div class="ease-harbor-crane-slewing__housing">
        <div class="ease-harbor-crane-slewing__bezel">
          <div class="ease-harbor-crane-slewing__face">
            <div class="ease-harbor-crane-slewing__readout">
              <span class="ease-harbor-crane-slewing__label">Harbor Crane Slewing</span>
              <span class="ease-harbor-crane-slewing__value">LIVE</span>
            </div>
            <div class="ease-harbor-crane-slewing__motion" aria-hidden="true">
              <span class="ease-harbor-crane-slewing__a"></span>
              <span class="ease-harbor-crane-slewing__b"></span>
              <span class="ease-harbor-crane-slewing__c"></span>
              <span class="ease-harbor-crane-slewing__d"></span>
            </div>
            <div class="ease-harbor-crane-slewing__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-harbor-crane-slewing__controls">
          <button type="button" class="ease-harbor-crane-slewing__btn primary">Engage</button>
          <button type="button" class="ease-harbor-crane-slewing__btn">Reset</button>
          <label class="ease-harbor-crane-slewing__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-harbor-crane-slewing__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
