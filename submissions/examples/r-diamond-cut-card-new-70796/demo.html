<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="CSS diamond cut card with angled corners and facet decoration."
  >
  <title>CSS Diamond Cut Card</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">
    <article class="diamond-card">
      <div class="facet facet-one"></div>
      <div class="facet facet-two"></div>
      <div class="facet facet-three"></div>

      <div class="card-content">
        <span class="card-label">Premium Collection</span>

        <div class="gem-icon" aria-hidden="true">
          <span></span>
        </div>

        <h1>Diamond Cut</h1>

        <p>
          A geometric card design inspired by polished diamond facets,
          built entirely with CSS.
        </p>

        <div class="card-details">
          <div>
            <span class="detail-label">Style</span>
            <strong>Geometric</strong>
          </div>

          <div>
            <span class="detail-label">Finish</span>
            <strong>Crystal</strong>
          </div>
        </div>

        <a href="#" class="card-button" aria-label="Explore diamond collection">
          Explore
          <span aria-hidden="true">→</span>
        </a>
      </div>
    </article>
  </main>

</body>
</html>
