<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pulsing Status Badge Demo</title>
  <link rel="stylesheet" href="../../../easemotion.css">
  <link rel="stylesheet" href="./style.css">
  <style>
    body {
      background-color: #f8fafc; /* Slate 50 */
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 2rem;
    }
    
    .dashboard-panel {
      background: white;
      border-radius: 12px;
      padding: 2rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      width: 100%;
      max-width: 400px;
    }

    .server-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .server-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
    }

    .server-info {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    
    .server-name {
      font-weight: 600;
      color: #1e293b;
    }
    
    .server-status-text {
      font-size: 0.875rem;
      color: #64748b;
    }
  </style>
</head>
<body>

  <div class="dashboard-panel">
    <h3 style="margin-top: 0; margin-bottom: 1.5rem; color: #0f172a;">Server Status</h3>
    
    <div class="server-list">
      <!-- Live Server -->
      <div class="server-item">
        <div class="server-info">
          <!-- The Pulse Badge Component (Success) -->
          <div class="ease-pulse-badge ease-pulse-success"></div>
          <div>
            <div class="server-name">Production API</div>
            <div class="server-status-text">Operational (Live)</div>
          </div>
        </div>
      </div>

      <!-- Warning Server -->
      <div class="server-item">
        <div class="server-info">
          <!-- The Pulse Badge Component (Warning) -->
          <div class="ease-pulse-badge ease-pulse-warning"></div>
          <div>
            <div class="server-name">Database Cluster</div>
            <div class="server-status-text">High CPU Load</div>
          </div>
        </div>
      </div>

      <!-- Offline Server -->
      <div class="server-item">
        <div class="server-info">
          <!-- The Pulse Badge Component (Danger) -->
          <div class="ease-pulse-badge ease-pulse-danger"></div>
          <div>
            <div class="server-name">Staging Environment</div>
            <div class="server-status-text">Disconnected</div>
          </div>
        </div>
      </div>
      
    </div>
  </div>

</body>
</html>
