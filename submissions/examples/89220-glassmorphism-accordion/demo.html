<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glassmorphism Accordion Component</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="accordion-container">
        <h2>Frequently Asked Questions</h2>
        
        <details class="ease-accordion ease-accordion-expand">
            <summary class="ease-accordion-header">
                <span>What is EaseMotion CSS?</span>
                <span class="icon">+</span>
            </summary>
            <div class="ease-accordion-body">
                EaseMotion CSS is an animation-first, human-readable UI library designed for modern web applications.
            </div>
        </details>

        <details class="ease-accordion ease-accordion-expand">
            <summary class="ease-accordion-header">
                <span>Is it zero-dependency?</span>
                <span class="icon">+</span>
            </summary>
            <div class="ease-accordion-body">
                Yes! It requires no JavaScript frameworks or external build tools to work.
            </div>
        </details>
    </div>

</body>
</html>
