<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ease-scroll-parallax-layers-sap demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #f4f4f5; }
    .spacer { height: 50vh; display: flex; align-items: center; justify-content: center; color: #94a3b8; }
    .page { max-width: 700px; margin: 0 auto; padding: 0 20px 300px; }
  </style>
</head>
<body>
  <div class="spacer">Scroll down</div>
  <div class="page">
    <div class="parallax-layers-sap" id="section">
      <div class="layer layer-mountains" data-speed="0.2"></div>
      <div class="layer layer-stars" data-speed="0.5"></div>
      <div class="layer layer-text" data-speed="0.8">Explore the Cosmos</div>
    </div>
  </div>
  <script>
    const section = document.getElementById('section');
    const layers = document.querySelectorAll('.layer');
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    function update() {
      if (reduceMotion) return;
      const rect = section.getBoundingClientRect();
      const offset = rect.top;
      layers.forEach(layer => {
        const speed = parseFloat(layer.dataset.speed);
        layer.style.transform = `translateY(${offset * speed * -0.3}px)`;
      });
    }

    window.addEventListener('scroll', update, { passive: true });
    update();
  </script>
</body>
</html>
