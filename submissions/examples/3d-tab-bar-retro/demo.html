<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Responsive 3D Retro Tab Bar built with HTML and CSS">
    <title>3D Retro Tab Bar</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="page">
        <section class="demo-card">
            <span class="eyebrow">EASEMOTION CSS</span>

            <h1>3D Retro Tab Bar</h1>

            <p class="intro">
                A responsive retro-inspired tab navigation with layered
                3D depth and smooth hover interactions.
            </p>

            <nav class="retro-tabs" aria-label="Main navigation">
                <a href="#home" class="retro-tab active">
                    <span class="tab-icon">⌂</span>
                    <span>Home</span>
                </a>

                <a href="#about" class="retro-tab">
                    <span class="tab-icon">◆</span>
                    <span>About</span>
                </a>

                <a href="#projects" class="retro-tab">
                    <span class="tab-icon">▣</span>
                    <span>Projects</span>
                </a>

                <a href="#contact" class="retro-tab">
                    <span class="tab-icon">✉</span>
                    <span>Contact</span>
                </a>
            </nav>

            <div class="content-box" id="home">
                <div class="content-icon">★</div>

                <div>
                    <h2>Retro Interface</h2>
                    <p>
                        Hover over the tabs to see the layered 3D effect.
                        The component works without JavaScript.
                    </p>
                </div>
            </div>
        </section>
    </main>

</body>
</html>
