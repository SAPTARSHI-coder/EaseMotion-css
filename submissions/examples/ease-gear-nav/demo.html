<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gear Nav · Mechanical Gears</title>

    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <div class="card">
        <h2>⚙️ Gear Nav</h2>
        <p class="sub">mechanical gears interlock and rotate</p>

        <!-- === GEAR NAV === -->
        <div class="gear-container" id="gearContainer">
            <div class="gear-nav">
                <div class="gear-item gear-center">
                    <div class="gear-icon">
                        <i class="fas fa-cogs"></i>
                    </div>
                </div>

                <div class="gear-item gear-1" data-tooltip="Home">
                    <a href="#" class="gear-link">
                        <i class="fas fa-home"></i>
                    </a>
                </div>

                <div class="gear-item gear-2" data-tooltip="Explore">
                    <a href="#" class="gear-link">
                        <i class="fas fa-compass"></i>
                    </a>
                </div>

                <div class="gear-item gear-3" data-tooltip="Create">
                    <a href="#" class="gear-link">
                        <i class="fas fa-wrench"></i>
                    </a>
                </div>

                <div class="gear-item gear-4" data-tooltip="Share">
                    <a href="#" class="gear-link">
                        <i class="fas fa-share-alt"></i>
                    </a>
                </div>

                <div class="gear-item gear-5" data-tooltip="Settings">
                    <a href="#" class="gear-link">
                        <i class="fas fa-sliders-h"></i>
                    </a>
                </div>

                <div class="gear-item gear-6" data-tooltip="Help">
                    <a href="#" class="gear-link">
                        <i class="fas fa-question"></i>
                    </a>
                </div>
            </div>
        </div>

        <p style="margin-top: 2rem; font-size: 0.85rem; color: #64748b;">
            Hover · watch the gears interlock and rotate
        </p>
    </div>

    <!-- Embedded JavaScript -->
    <script>
        (function() {
            'use strict';

            const container = document.getElementById('gearContainer');
            const gearItems = document.querySelectorAll('.gear-item:not(.gear-center)');
            const centerGear = document.querySelector('.gear-center');

            // --- Gear rotation on hover ---
            gearItems.forEach(item => {
                const link = item.querySelector('.gear-link');

                // Click feedback
                link.addEventListener('click', function(e) {
                    e.preventDefault();
                    const tooltip = this.closest('.gear-item').getAttribute('data-tooltip') || 'Item';
                    console.log(`⚙️ Selected: ${tooltip}`);
                    this.closest('.gear-item').classList.add('clicked');
                    setTimeout(() => {
                        this.closest('.gear-item').classList.remove('clicked');
                    }, 300);
                });

                // Keyboard accessibility
                link.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        this.click();
                    }
                });
            });

            // --- Reset animation on hover ---
            container.addEventListener('mouseenter', function() {
                const allGears = this.querySelectorAll('.gear-item');
                allGears.forEach(g => {
                    g.style.animation = 'none';
                    void g.offsetWidth;
                    g.style.animation = '';
                });
            });

            // --- Click on container to toggle rotation ---
            container.addEventListener('click', function(e) {
                if (e.target.closest('.gear-link')) return;
                this.classList.toggle('is-active');
                console.log(`⚙️ Gear nav ${this.classList.contains('is-active') ? 'activated' : 'deactivated'}`);
            });

            // Keyboard accessibility for container
            container.setAttribute('tabindex', '0');
            container.setAttribute('role', 'button');
            container.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    this.click();
                }
            });

            console.log('⚙️ Gear nav initialized!');

        })();
    </script>

</body>
</html>
