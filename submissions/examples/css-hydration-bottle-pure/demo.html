<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Hydration Bottle</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="layout-container">
        
        <header class="section-header">
            <h1 class="title">Pure CSS Hydration Bottle</h1>
            <p class="subtitle">A daily hydration tracker featuring a continuously undulating liquid fill animation, built entirely with CSS shapes and keyframes.</p>
        </header>

        <div class="demo-area">
            
            <div class="bottle-container" aria-label="A water bottle filling up to 100% capacity">
                
                <!-- The Bottle Geometry -->
                <div class="bottle">
                    <div class="bottle-cap"></div>
                    <div class="bottle-neck"></div>
                    
                    <div class="bottle-body">
                        
                        <!-- Hydration Markers -->
                        <div class="markers">
                            <div class="marker" data-label="100%"></div>
                            <div class="marker" data-label="75%"></div>
                            <div class="marker" data-label="50%"></div>
                            <div class="marker" data-label="25%"></div>
                        </div>
                        
                        <!-- The Liquid Effect -->
                        <div class="water-container">
                            <!-- 
                              [TECHNIQUE] The Liquid Wave
                              The water level rises from 0 to 100%. 
                              The 'wave' is simulated using rotating rounded-square pseudo-elements on top of the liquid.
                            -->
                            <div class="water-level"></div>
                        </div>
                        
                    </div>
                </div>
                
            </div>
            
        </div>
        
    </div>

</body>
</html>
