<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Key Distribution BB84 - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css"></head><body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030712; color: #ffffff;">

    <div class="ease-card ease-card-glass bb84-container">
        <div class="bb84-header">
            <h2>BB84 Protocol</h2>
            <span class="ease-badge ease-badge-primary">Secure Key</span>
        </div>
        
        <div class="bb84-screen ease-center">
            <div class="bb84-flux flux-bb84-a"></div>
            <div class="bb84-flux flux-bb84-b"></div>
            <div class="bb84-boundary-ring"></div>
            <div class="bb84-core ease-center"></div>
        </div>

        <div class="bb84-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Basis Reconciliation &amp; Eavesdropping Detection</span>
            <button class="ease-btn ease-btn-primary ease-btn-sm ease-hover-grow">Run BB84 Protocol</button>
        </div>
    </div></body></html>
