<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Animated avatar with a dark mode cyber interface built using HTML and CSS."
  >

  <title>Animated Avatar - Dark Mode</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="page">

    <section
      class="avatar-section"
      aria-labelledby="avatar-title"
    >

      <div class="intro">

        <span class="eyebrow">
          PROFILE // ONLINE
        </span>

        <h1 id="avatar-title">
          Animated
          <span>Avatar</span>
        </h1>

        <p>
          A responsive dark-mode avatar component with
          glowing effects, animated rings and a live
          status indicator.
        </p>

      </div>

      <div class="avatar-stage">

        <div class="ambient ambient-one"></div>
        <div class="ambient ambient-two"></div>

        <div class="avatar-card">

          <div class="card-top">
            <span class="system-label">
              USER_ID: 08X42
            </span>

            <span class="connection">
              <span class="connection-dot"></span>
              ONLINE
            </span>
          </div>

          <div
            class="avatar"
            role="img"
            aria-label="Stylized animated user avatar"
          >

            <div class="avatar-glow"></div>

            <div class="orbit orbit-one">
              <span></span>
            </div>

            <div class="orbit orbit-two">
              <span></span>
            </div>

            <div class="avatar-head">

              <div class="hair"></div>

              <div class="ear ear-left"></div>
              <div class="ear ear-right"></div>

              <div class="face">

                <div class="brow brow-left"></div>
                <div class="brow brow-right"></div>

                <div class="eye eye-left">
                  <span></span>
                </div>

                <div class="eye eye-right">
                  <span></span>
                </div>

                <div class="nose"></div>

                <div class="mouth">
                  <span></span>
                </div>

              </div>

              <div class="neck"></div>

            </div>

            <div class="shoulders">
              <div class="shirt"></div>
            </div>

          </div>

          <div class="profile">

            <div>
              <span class="profile-label">
                CURRENT USER
              </span>

              <h2>NEON_01</h2>
            </div>

            <div class="level">
              <span>LVL</span>
              <strong>24</strong>
            </div>

          </div>

          <div class="stats">

            <div class="stat">
              <span>STATUS</span>
              <strong>ACTIVE</strong>
            </div>

            <div class="stat">
              <span>MOOD</span>
              <strong>FOCUSED</strong>
            </div>

            <div class="stat">
              <span>SYNC</span>
              <strong>98%</strong>
            </div>

          </div>

        </div>

      </div>

    </section>

  </main>

</body>
</html>
