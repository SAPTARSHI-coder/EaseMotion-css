<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive Drag & Drop File Upload · EaseMotion</title>
  <meta name="description" content="A drag-and-drop file upload zone featuring animated dashed borders, active states, and simulated ripple progress." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  
  <main class="demo-page">
    <header class="demo-header">
      <h1 class="demo-header__title">Secure Upload</h1>
      <p class="demo-header__subtitle">Drag and drop your files below or click to browse. Max size 50MB.</p>
    </header>

    <div class="upload-container">
      <!-- Dropzone -->
      <div class="dropzone" id="dropzone" role="button" tabindex="0" aria-label="File upload dropzone">
        <input type="file" id="file-input" class="dropzone__input" multiple aria-hidden="true" />
        
        <div class="dropzone__content">
          <div class="dropzone__icon-wrapper">
            <svg class="dropzone__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="17 8 12 3 7 8"></polyline>
              <line x1="12" y1="3" x2="12" y2="15"></line>
            </svg>
          </div>
          <p class="dropzone__text">
            <span class="dropzone__highlight">Click to upload</span> or drag and drop
          </p>
          <p class="dropzone__hint">SVG, PNG, JPG or PDF (max. 10MB)</p>
        </div>
      </div>

      <!-- File List -->
      <div class="file-list" id="file-list" aria-live="polite">
        <!-- Files will be injected here via script.js -->
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
