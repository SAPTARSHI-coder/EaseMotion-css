<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loading Spinner Variants</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="container">
    <h1>Loading Spinner Variants</h1>
    <p>CSS-only loading animations</p>

    <div class="spinner-grid">

      <div class="spinner-box">
        <h2>Ring</h2>
        <span class="spinner spinner-ring"></span>
      </div>

      <div class="spinner-box">
        <h2>Dots</h2>
        <span class="spinner spinner-dots">
          <span></span>
          <span></span>
          <span></span>
        </span>
      </div>

      <div class="spinner-box">
        <h2>Pulse</h2>
        <span class="spinner spinner-pulse"></span>
      </div>

      <div class="spinner-box">
        <h2>Square</h2>
        <span class="spinner spinner-square"></span>
      </div>

    </div>
  </main>

</body>
</html>
