<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-keyboard-keys-press demo</title>
</head>
<body>
<div class="kb-app">
  <span class="kb-title">KEYBOARD</span>
  <div class="kb-row kb-row-1">
    <span class="kb-key">Q</span>
    <span class="kb-key">W</span>
    <span class="kb-key">E</span>
    <span class="kb-key">R</span>
    <span class="kb-key">T</span>
    <span class="kb-key">Y</span>
  </div>
  <div class="kb-row kb-row-2">
    <span class="kb-key kb-mod">SHIFT</span>
    <span class="kb-key">A</span>
    <span class="kb-key">S</span>
    <span class="kb-key">D</span>
    <span class="kb-key">F</span>
  </div>
  <div class="kb-row kb-row-3">
    <span class="kb-key kb-wide">SPACE</span>
    <span class="kb-key kb-mod">ENTER</span>
  </div>
  <span class="kb-prompt">typing phrase ripples across</span>
</div>
</body>
</html>
