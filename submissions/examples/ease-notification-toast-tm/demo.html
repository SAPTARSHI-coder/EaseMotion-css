<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notification Toast | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body style="margin:0; background:#0f172a; min-height:100vh;">
  <div class="toast-stack">
    <div class="toast success" role="alert">
      <span class="toast-icon">&#10003;</span>
      <div class="toast-content">
        <p class="toast-title">Success</p>
        <p class="toast-msg">Your changes have been saved.</p>
      </div>
    </div>
    <div class="toast error" role="alert">
      <span class="toast-icon">&#10007;</span>
      <div class="toast-content">
        <p class="toast-title">Error</p>
        <p class="toast-msg">Something went wrong. Please try again.</p>
      </div>
    </div>
    <div class="toast warning" role="alert">
      <span class="toast-icon">&#9888;</span>
      <div class="toast-content">
        <p class="toast-title">Warning</p>
        <p class="toast-msg">Your session will expire in 5 minutes.</p>
      </div>
    </div>
    <div class="toast" role="alert">
      <span class="toast-icon">&#8505;</span>
      <div class="toast-content">
        <p class="toast-title">Info</p>
        <p class="toast-msg">New features are available now.</p>
      </div>
    </div>
  </div>
</body>
</html>
