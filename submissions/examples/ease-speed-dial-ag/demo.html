<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speed Dial FAB</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="speed-dial-container">
        <input type="checkbox" id="speed-dial-toggle" class="speed-dial-toggle">
        
        <div class="speed-dial-actions">
            <a href="#" class="action-btn" title="Add Image">🖼️</a>
            <a href="#" class="action-btn" title="Add Document">📄</a>
            <a href="#" class="action-btn" title="Add Link">🔗</a>
        </div>
        
        <label for="speed-dial-toggle" class="speed-dial-btn">
            <span class="plus-icon"></span>
        </label>
    </div>
</body>
</html>
