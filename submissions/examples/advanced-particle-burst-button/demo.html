<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Advanced particle burst button with canvas physics and recoil"
  >
  <title>Particle Burst Button | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="demo">
    <section class="card" aria-labelledby="title">
      <p class="eyebrow">EASEMOTION • ADVANCED EFFECT</p>

      <h1 id="title">Particle Burst Button</h1>

      <p class="description">
        Click the button to trigger a physics-based particle explosion
        with recoil and glow effects.
      </p>

      <div class="stage">
        <canvas id="particleCanvas" aria-hidden="true"></canvas>

        <button
          class="burst-button"
          id="burstButton"
          type="button"
          aria-label="Trigger particle burst"
        >
          <span class="button-glow"></span>
          <span class="button-content">
            <span class="button-icon">✦</span>
            <span>BURST</span>
          </span>
        </button>
      </div>

      <p class="hint">Click the button to activate the effect</p>
    </section>
  </main>

  <script>
    (() => {
      const canvas = document.getElementById("particleCanvas");
      const button = document.getElementById("burstButton");
      const ctx = canvas.getContext("2d");

      let particles = [];
      let animationFrame = null;
      let dpr = Math.min(window.devicePixelRatio || 1, 2);

      const config = {
        particleCount: 85,
        gravity: 0.075,
        friction: 0.985,
        minSpeed: 3,
        maxSpeed: 8,
        minSize: 2,
        maxSize: 5,
        life: 75
      };

      function resizeCanvas() {
        const rect = canvas.getBoundingClientRect();

        dpr = Math.min(window.devicePixelRatio || 1, 2);

        canvas.width = Math.round(rect.width * dpr);
        canvas.height = Math.round(rect.height * dpr);

        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      function random(min, max) {
        return Math.random() * (max - min) + min;
      }

      function createParticle(x, y) {
        const angle = random(0, Math.PI * 2);
        const speed = random(
          config.minSpeed,
          config.maxSpeed
        );

        return {
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,

          size: random(
            config.minSize,
            config.maxSize
          ),

          life: random(
            config.life * 0.6,
            config.life
          ),

          maxLife: config.life,

          rotation: random(0, Math.PI * 2),
          rotationSpeed: random(-0.15, 0.15),

          hue: random(155, 195)
        };
      }

      function burst() {
        const rect = canvas.getBoundingClientRect();

        const centerX = rect.width / 2;
        const centerY = rect.height / 2;

        particles = [];

        for (let i = 0; i < config.particleCount; i++) {
          particles.push(
            createParticle(centerX, centerY)
          );
        }

        button.classList.remove("recoil");

        // Restart CSS animation.
        void button.offsetWidth;

        button.classList.add("recoil");

        if (!animationFrame) {
          animate();
        }
      }

      function drawParticle(particle) {
        const opacity =
          Math.max(particle.life / particle.maxLife, 0);

        ctx.save();

        ctx.translate(
          particle.x,
          particle.y
        );

        ctx.rotate(particle.rotation);

        ctx.globalAlpha = opacity;

        ctx.shadowBlur = 14;
        ctx.shadowColor = `hsla(${particle.hue}, 100%, 70%, ${opacity})`;

        ctx.fillStyle =
          `hsl(${particle.hue}, 100%, 70%)`;

        ctx.beginPath();

        ctx.arc(
          0,
          0,
          particle.size,
          0,
          Math.PI * 2
        );

        ctx.fill();

        ctx.restore();
      }

      function updateParticle(particle) {
        particle.vx *= config.friction;
        particle.vy *= config.friction;

        particle.vy += config.gravity;

        particle.x += particle.vx;
        particle.y += particle.vy;

        particle.rotation +=
          particle.rotationSpeed;

        particle.life -= 1;
      }

      function animate() {
        const rect = canvas.getBoundingClientRect();

        ctx.clearRect(
          0,
          0,
          rect.width,
          rect.height
        );

        particles.forEach(updateParticle);
        particles.forEach(drawParticle);

        particles = particles.filter(
          particle => particle.life > 0
        );

        if (particles.length > 0) {
          animationFrame =
            requestAnimationFrame(animate);
        } else {
          cancelAnimationFrame(animationFrame);
          animationFrame = null;
        }
      }

      button.addEventListener("click", burst);

      window.addEventListener(
        "resize",
        resizeCanvas
      );

      resizeCanvas();
    })();
  </script>
</body>
</html>
