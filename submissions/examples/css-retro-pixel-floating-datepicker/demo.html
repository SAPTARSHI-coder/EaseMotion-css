<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floating Datepicker with Retro Pixel Styling | EaseMotion CSS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="datepicker-wrapper" tabindex="0">
        <button class="datepicker-input" aria-haspopup="dialog" aria-expanded="false" aria-label="Select Date">
            <span>📅 SELECT DATE</span>
        </button>

        <div class="datepicker-dropdown" role="dialog" aria-label="Retro Pixel Calendar">
            <div class="pixel-header">
                <button class="pixel-btn" aria-label="Previous Month">&lt;</button>
                <span class="pixel-title">AUG 2026</span>
                <button class="pixel-btn" aria-label="Next Month">&gt;</button>
            </div>

            <div class="pixel-grid">
                <div class="pixel-day-name">SU</div>
                <div class="pixel-day-name">MO</div>
                <div class="pixel-day-name">TU</div>
                <div class="pixel-day-name">WE</div>
                <div class="pixel-day-name">TH</div>
                <div class="pixel-day-name">FR</div>
                <div class="pixel-day-name">SA</div>

                <div class="pixel-date muted">26</div>
                <div class="pixel-date muted">27</div>
                <div class="pixel-date muted">28</div>
                <div class="pixel-date muted">29</div>
                <div class="pixel-date muted">30</div>
                <div class="pixel-date muted">31</div>
                <div class="pixel-date">01</div>

                <div class="pixel-date">02</div>
                <div class="pixel-date">03</div>
                <div class="pixel-date">04</div>
                <div class="pixel-date">05</div>
                <div class="pixel-date">06</div>
                <div class="pixel-date">07</div>
                <div class="pixel-date">08</div>

                <div class="pixel-date">09</div>
                <div class="pixel-date">10</div>
                <div class="pixel-date">11</div>
                <div class="pixel-date">12</div>
                <div class="pixel-date">13</div>
                <div class="pixel-date selected">14</div>
                <div class="pixel-date">15</div>

                <div class="pixel-date">16</div>
                <div class="pixel-date">17</div>
                <div class="pixel-date">18</div>
                <div class="pixel-date">19</div>
                <div class="pixel-date">20</div>
                <div class="pixel-date">21</div>
                <div class="pixel-date">22</div>

                <div class="pixel-date">23</div>
                <div class="pixel-date">24</div>
                <div class="pixel-date">25</div>
                <div class="pixel-date">26</div>
                <div class="pixel-date">27</div>
                <div class="pixel-date">28</div>
                <div class="pixel-date">29</div>

                <div class="pixel-date">30</div>
                <div class="pixel-date">31</div>
                <div class="pixel-date muted">01</div>
                <div class="pixel-date muted">02</div>
                <div class="pixel-date muted">03</div>
                <div class="pixel-date muted">04</div>
                <div class="pixel-date muted">05</div>
            </div>
        </div>
    </div>
</body>
</html>
