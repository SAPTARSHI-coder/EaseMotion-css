<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fault Tolerant Surface Code Lattice Surgery SCLS - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css"></head><body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030712; color: #ffffff;">

    <div class="ease-card ease-card-glass scls-container">
        <div class="scls-header">
            <h2>Surface Code Lattice Surgery</h2>
            <span class="ease-badge ease-badge-success">Fault-Tolerant Quantum</span>
        </div>
        
        <div class="scls-screen ease-center">
            <div class="scls-flux flux-scls-a"></div>
            <div class="scls-flux flux-scls-b"></div>
            <div class="scls-boundary-ring"></div>
            <div class="scls-core ease-center"></div>
        </div>

        <div class="scls-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Patch Merging, Splitting &amp; Non-Local Entanglement</span>
            <button class="ease-btn ease-btn-success ease-btn-sm ease-hover-grow">Run Lattice Surgery</button>
        </div>
    </div></body></html>
