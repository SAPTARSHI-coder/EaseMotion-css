<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aurora Headphones — EaseMotion CSS View Transitions</title>
<link rel="stylesheet" href="style.css">
<style>
  @view-transition {
    navigation: auto;
  }
</style>
</head>
<body>

  <main class="em-product-page">

    <a href="demo.html" class="em-back-link">&larr; Back to all products</a>

    <article class="em-product-detail">
      <img
        class="em-product-hero"
        style="view-transition-name: em-vt-aurora;"
        src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=1200&auto=format&fit=crop&q=80"
        alt="Aurora wireless headphones in matte white">

      <div class="em-product-info">
        <p class="em-product-eyebrow">Wireless Audio</p>
        <h1 class="em-product-name">Aurora Headphones</h1>
        <p class="em-product-detail-price">$129</p>
        <p class="em-product-desc">
          Over-ear wireless headphones with adaptive noise cancellation,
          40-hour battery life, and a matte-white finish that resists
          fingerprints. Tuned for clarity across podcasts, calls, and
          music alike.
        </p>
        <button type="button" class="em-btn em-btn-primary">Add to cart</button>
      </div>
    </article>

  </main>

</body>
</html>
