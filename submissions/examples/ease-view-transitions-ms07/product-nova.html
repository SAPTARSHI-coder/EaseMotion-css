<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova Speaker — EaseMotion CSS View Transitions</title>
<link rel="stylesheet" href="style.css">
<style>
  @view-transition {
    navigation: auto;
  }
</style>
</head>
<body>

  <main class="em-product-page">

    <a href="demo.html" class="em-back-link">&larr; Back to all products</a>

    <article class="em-product-detail">
      <img
        class="em-product-hero"
        style="view-transition-name: em-vt-nova;"
        src="https://images.unsplash.com/photo-1572635196237-14b3f281503f?w=1200&auto=format&fit=crop&q=80"
        alt="Nova wireless speaker in charcoal fabric">

      <div class="em-product-info">
        <p class="em-product-eyebrow">Home Audio</p>
        <h1 class="em-product-name">Nova Speaker</h1>
        <p class="em-product-detail-price">$89</p>
        <p class="em-product-desc">
          A compact wireless speaker wrapped in charcoal fabric, delivering
          room-filling 360° sound. Splash resistant, 12-hour battery, and
          pairs with two devices at once.
        </p>
        <button type="button" class="em-btn em-btn-primary">Add to cart</button>
      </div>
    </article>

  </main>

</body>
</html>
