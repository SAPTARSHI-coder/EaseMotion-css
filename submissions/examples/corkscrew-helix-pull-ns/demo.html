<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Corkscrew Helix Pull — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Corkscrew Helix Pull demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Corkscrew Helix Pull</h1>
      <p class="lede">Wine corkscrew helix twisting then cork extracting</p>
    </header>

    <section class="ease-corkscrew-helix-pull" data-demo="corkscrew-helix-pull" aria-live="polite">
      <div class="ease-corkscrew-helix-pull__housing">
        <div class="ease-corkscrew-helix-pull__bezel">
          <div class="ease-corkscrew-helix-pull__face">
            <div class="ease-corkscrew-helix-pull__readout">
              <span class="ease-corkscrew-helix-pull__label">Corkscrew Helix Pull</span>
              <span class="ease-corkscrew-helix-pull__value">LIVE</span>
            </div>
            <div class="ease-corkscrew-helix-pull__motion" aria-hidden="true">
              <span class="ease-corkscrew-helix-pull__a"></span>
              <span class="ease-corkscrew-helix-pull__b"></span>
              <span class="ease-corkscrew-helix-pull__c"></span>
              <span class="ease-corkscrew-helix-pull__d"></span>
            </div>
            <div class="ease-corkscrew-helix-pull__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-corkscrew-helix-pull__controls">
          <button type="button" class="ease-corkscrew-helix-pull__btn primary">Engage</button>
          <button type="button" class="ease-corkscrew-helix-pull__btn">Reset</button>
          <label class="ease-corkscrew-helix-pull__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-corkscrew-helix-pull__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
