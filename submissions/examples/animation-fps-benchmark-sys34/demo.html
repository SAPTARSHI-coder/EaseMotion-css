<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>High-Performance FPS & Animation Latency Benchmark Suite</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../easemotion.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>Animation FPS Benchmark Suite</h1>
      <p>Real-time frame rate (FPS) performance measurement tool.</p>
    </header>

    <main class="benchmark-stage">
      <div class="fps-meter" id="fpsMeter">FPS: 60</div>
      <div class="node-grid" id="nodeGrid"></div>
    </main>
  </div>

  <script>
    let frameCount = 0;
    let lastTime = performance.now();
    const meter = document.getElementById('fpsMeter');

    function loop(now) {
      frameCount++;
      if (now - lastTime >= 1000) {
        meter.textContent = `FPS: ${frameCount}`;
        frameCount = 0;
        lastTime = now;
      }
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);

    const grid = document.getElementById('nodeGrid');
    for(let i=0; i<30; i++) {
      const node = document.createElement('div');
      node.className = 'anim-node';
      grid.appendChild(node);
    }
  </script>
</body>
</html>
