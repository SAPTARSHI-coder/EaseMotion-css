<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Bounce-Pulse Card Grid</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="checkout-container">
    <header class="checkout-header">
      <h2>Select Payment Method</h2>
      <p>Choose your preferred way to pay</p>
    </header>
    
    <div class="card-grid">
      <!-- Card 1 -->
      <label class="card-item">
        <input type="radio" name="payment" class="card-input" checked>
        <div class="card-content">
          <div class="card-icon">💳</div>
          <div class="card-details">
            <span class="card-title">Credit Card</span>
            <span class="card-desc">Visa, Mastercard, Amex</span>
          </div>
          <div class="card-indicator"></div>
        </div>
      </label>

      <!-- Card 2 -->
      <label class="card-item">
        <input type="radio" name="payment" class="card-input">
        <div class="card-content">
          <div class="card-icon">📱</div>
          <div class="card-details">
            <span class="card-title">Digital Wallet</span>
            <span class="card-desc">Apple Pay, Google Pay</span>
          </div>
          <div class="card-indicator"></div>
        </div>
      </label>

      <!-- Card 3 -->
      <label class="card-item">
        <input type="radio" name="payment" class="card-input">
        <div class="card-content">
          <div class="card-icon">🏦</div>
          <div class="card-details">
            <span class="card-title">Bank Transfer</span>
            <span class="card-desc">Direct account debit</span>
          </div>
          <div class="card-indicator"></div>
        </div>
      </label>
      
      <!-- Card 4 -->
      <label class="card-item">
        <input type="radio" name="payment" class="card-input">
        <div class="card-content">
          <div class="card-icon">🪙</div>
          <div class="card-details">
            <span class="card-title">Crypto</span>
            <span class="card-desc">Bitcoin, Ethereum, USDT</span>
          </div>
          <div class="card-indicator"></div>
        </div>
      </label>
    </div>
    
    <button class="checkout-btn">Continue to Review</button>
  </div>
</body>
</html>
