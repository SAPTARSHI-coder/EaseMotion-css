<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-code-review-checklist demo</title>
</head>
<body>
<div class="crc-panel">
  <div class="crc-item crc-done">
    <span class="crc-box">&#10003;</span>
    <span class="crc-label">Adds error handling</span>
    <span class="crc-tag">DONE</span>
  </div>
  <div class="crc-item crc-done">
    <span class="crc-box">&#10003;</span>
    <span class="crc-label">Tests updated</span>
    <span class="crc-tag">DONE</span>
  </div>
  <div class="crc-item">
    <span class="crc-box"></span>
    <span class="crc-label">Docs mention breaking change</span>
    <span class="crc-tag">PENDING</span>
  </div>
  <div class="crc-item">
    <span class="crc-box"></span>
    <span class="crc-label">Migration script added</span>
    <span class="crc-tag">PENDING</span>
  </div>
  <div class="crc-actions">
    <span class="crc-approve">APPROVE</span>
  </div>
</div>
</body>
</html>
