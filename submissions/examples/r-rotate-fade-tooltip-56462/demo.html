<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Rotate-Fade Tooltip</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<section class="tooltip-section">

<h1>Gaming Hub Tooltips</h1>

<div class="tooltip-grid">

<div class="tooltip-item">
<button class="tooltip-btn">🎮 Battle Pass</button>
<span class="tooltip">
Unlock exclusive missions, premium rewards, and seasonal content.
</span>
</div>

<div class="tooltip-item">
<button class="tooltip-btn">⚔️ Legendary Sword</button>
<span class="tooltip">
A powerful weapon with bonus critical damage and faster attacks.
</span>
</div>

<div class="tooltip-item">
<button class="tooltip-btn">🛡️ Guardian Shield</button>
<span class="tooltip">
Protects against incoming damage and grants temporary immunity.
</span>
</div>

<div class="tooltip-item">
<button class="tooltip-btn">💎 Epic Crystal</button>
<span class="tooltip">
Collect rare crystals to unlock legendary cosmetic items.
</span>
</div>

</div>

</section>

</body>
</html>
