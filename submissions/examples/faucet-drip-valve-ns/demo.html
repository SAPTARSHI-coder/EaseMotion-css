<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Faucet Drip Valve — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Faucet Drip Valve demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Faucet Drip Valve</h1>
      <p class="lede">Compression faucet stem opening to a controlled drip</p>
    </header>

    <section class="ease-faucet-drip-valve" data-demo="faucet-drip-valve" aria-live="polite">
      <div class="ease-faucet-drip-valve__housing">
        <div class="ease-faucet-drip-valve__bezel">
          <div class="ease-faucet-drip-valve__face">
            <div class="ease-faucet-drip-valve__readout">
              <span class="ease-faucet-drip-valve__label">Faucet Drip Valve</span>
              <span class="ease-faucet-drip-valve__value">LIVE</span>
            </div>
            <div class="ease-faucet-drip-valve__motion" aria-hidden="true">
              <span class="ease-faucet-drip-valve__a"></span>
              <span class="ease-faucet-drip-valve__b"></span>
              <span class="ease-faucet-drip-valve__c"></span>
              <span class="ease-faucet-drip-valve__d"></span>
            </div>
            <div class="ease-faucet-drip-valve__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-faucet-drip-valve__controls">
          <button type="button" class="ease-faucet-drip-valve__btn primary">Engage</button>
          <button type="button" class="ease-faucet-drip-valve__btn">Reset</button>
          <label class="ease-faucet-drip-valve__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-faucet-drip-valve__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
