<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Bounce-Pulse Popover - Minimalist Tech</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="layout-container">
        
        <header class="section-header">
            <h1 class="title">System Alerts</h1>
            <p class="subtitle">Hover over the notification bell to view pending alerts.</p>
        </header>

        <div class="header-nav">
            
            <div class="popover-container">
                <!-- Trigger Element (Bell Icon with continuous pulse ring) -->
                <div class="trigger-wrapper">
                    <div class="pulse-ring"></div>
                    <button class="icon-btn">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
                        <span class="badge">3</span>
                    </button>
                </div>
                
                <!-- The Popover Content (Bounces in on hover) -->
                <div class="popover-content">
                    <div class="popover-header">
                        <h3 class="popover-title">Notifications</h3>
                        <a href="#" class="mark-read">Mark all as read</a>
                    </div>
                    
                    <div class="popover-body">
                        
                        <a href="#" class="notification-item unread">
                            <div class="notif-icon bg-red">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                            </div>
                            <div class="notif-content">
                                <p class="notif-text">Deployment <strong>failed</strong> for `production-api`.</p>
                                <span class="notif-time">2 mins ago</span>
                            </div>
                        </a>
                        
                        <a href="#" class="notification-item unread">
                            <div class="notif-icon bg-blue">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>
                            </div>
                            <div class="notif-content">
                                <p class="notif-text">CPU usage spiked above 90% on DB cluster.</p>
                                <span class="notif-time">45 mins ago</span>
                            </div>
                        </a>
                        
                        <a href="#" class="notification-item unread">
                            <div class="notif-icon bg-green">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
                            </div>
                            <div class="notif-content">
                                <p class="notif-text">Weekly backup completed successfully.</p>
                                <span class="notif-time">3 hours ago</span>
                            </div>
                        </a>
                        
                    </div>
                    
                    <div class="popover-footer">
                        <a href="#">View All Notifications &rarr;</a>
                    </div>
                </div>
            </div>

        </div>
        
    </div>

</body>
</html>
