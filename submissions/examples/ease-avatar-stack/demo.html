<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ease Avatar Stack</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <h1>Avatar Stack</h1>

        <p class="subtitle">
            Modern overlapping avatars with smooth hover interactions for collaboration interfaces.
        </p>

        <section class="avatar-card">

            <h2>Project Team</h2>

            <p class="team-text">
                6 active collaborators working together
            </p>

            <div class="avatar-stack">

                <img
                    src="https://api.dicebear.com/9.x/adventurer/svg?seed=Alex"
                    alt="Alex"
                    title="Alex"
                    class="avatar-stack-item">

                <img
                    src="https://api.dicebear.com/9.x/adventurer/svg?seed=Emma"
                    alt="Emma"
                    title="Emma"
                    class="avatar-stack-item">

                <img
                    src="https://api.dicebear.com/9.x/adventurer/svg?seed=David"
                    alt="David"
                    title="David"
                    class="avatar-stack-item">

                <img
                    src="https://api.dicebear.com/9.x/adventurer/svg?seed=Sophia"
                    alt="Sophia"
                    title="Sophia"
                    class="avatar-stack-item">

                <img
                    src="https://api.dicebear.com/9.x/adventurer/svg?seed=James"
                    alt="James"
                    title="James"
                    class="avatar-stack-item">

                <img
                    src="https://api.dicebear.com/9.x/adventurer/svg?seed=Olivia"
                    alt="Olivia"
                    title="Olivia"
                    class="avatar-stack-item">

                <span
                    class="avatar-stack-item avatar-stack-more"
                    title="5 more collaborators">
                    +5
                </span>

            </div>

        </section>

    </main>

</body>

</html>
