
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Animated Counter Demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="demo-wrap">
    <div class="stat"><span class="ease-counter" data-target="42">0</span>+<div>Utilities</div></div>
    <div class="stat"><span class="ease-counter" data-target="12">0</span><div>Animations</div></div>
    <div class="stat"><span class="ease-counter" data-target="99">0</span>%<div>Uptime</div></div>
  </div>

  <script>
    document.querySelectorAll('.ease-counter').forEach(el => {
      const target = +el.dataset.target;
      const duration = 1200;
      const start = performance.now();
      function tick(now) {
        const progress = Math.min((now - start) / duration, 1);
        el.textContent = Math.floor(progress * target);
        if (progress < 1) requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    });
  </script>
</body>
</html>
