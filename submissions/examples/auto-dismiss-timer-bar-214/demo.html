<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Floating notification toast with auto-dismiss timer bar."
  >
  <title>Floating Notification Toast</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="page">
    <section class="demo" aria-labelledby="title">
      <p class="eyebrow">EASEMOTION COMPONENT</p>

      <h1 id="title">Floating Toast Notification</h1>

      <p class="intro">
        A vibrant notification toast with an animated auto-dismiss timer.
      </p>

      <button class="show-button" id="showToast">
        Show Notification
      </button>
    </section>
  </main>

  <div
    class="toast-container"
    id="toastContainer"
    aria-live="polite"
    aria-atomic="true"
  ></div>

  <script>
    const showToastButton = document.getElementById("showToast");
    const toastContainer = document.getElementById("toastContainer");

    function createToast() {
      const toast = document.createElement("article");

      toast.className = "toast";
      toast.setAttribute("role", "status");

      toast.innerHTML = `
        <div class="toast-icon" aria-hidden="true">✓</div>

        <div class="toast-content">
          <strong>Success!</strong>
          <p>Your changes have been saved successfully.</p>
        </div>

        <button
          class="close-button"
          type="button"
          aria-label="Close notification"
        >
          ×
        </button>

        <div class="timer-bar"></div>
      `;

      toastContainer.appendChild(toast);

      requestAnimationFrame(() => {
        toast.classList.add("show");
      });

      const timerBar = toast.querySelector(".timer-bar");
      const closeButton = toast.querySelector(".close-button");

      let remainingTime = 5000;
      let startTime = Date.now();
      let timer;

      function removeToast() {
        clearTimeout(timer);

        toast.classList.remove("show");
        toast.classList.add("hide");

        setTimeout(() => {
          toast.remove();
        }, 350);
      }

      function startTimer() {
        startTime = Date.now();

        timer = setTimeout(() => {
          removeToast();
        }, remainingTime);
      }

      toast.addEventListener("mouseenter", () => {
        remainingTime -= Date.now() - startTime;
        clearTimeout(timer);
        timerBar.style.animationPlayState = "paused";
      });

      toast.addEventListener("mouseleave", () => {
        startTimer();

        timerBar.style.animationPlayState = "running";
      });

      closeButton.addEventListener("click", removeToast);

      startTimer();
    }

    showToastButton.addEventListener("click", createToast);
  </script>

</body>
</html>
