<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Reservoir Computing QRC - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css"></head><body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030712; color: #ffffff;">

    <div class="ease-card ease-card-glass qrc-container">
        <div class="qrc-header">
            <h2>Quantum Reservoir Computing</h2>
            <span class="ease-badge ease-badge-primary">Quantum Machine Learning</span>
        </div>
        
        <div class="qrc-screen ease-center">
            <div class="qrc-flux flux-qrc-a"></div>
            <div class="qrc-flux flux-qrc-b"></div>
            <div class="qrc-boundary-ring"></div>
            <div class="qrc-core ease-center"></div>
        </div>

        <div class="qrc-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Random Quantum Dynamics &amp; Readout Mapping</span>
            <button class="ease-btn ease-btn-primary ease-btn-sm ease-hover-grow">Run QRC Stream</button>
        </div>
    </div></body></html>
