<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glowing Dropdown | SaaS Modern Styling</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="dropdown-card" aria-label="Glowing SaaS Dropdown Showcase">
    <h1 class="card-title">Glowing SaaS Dropdown</h1>
    <p class="card-desc">Hover or focus on the selector below to reveal the glowing glassmorphic SaaS dropdown menu.</p>

    <div class="dropdown-wrapper">
        <button class="dropdown-trigger" aria-haspopup="true" aria-expanded="false">
            <span class="trigger-content">
                <svg class="trigger-icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path>
                </svg>
                <span>Select Architecture</span>
            </span>
            <svg class="chevron-icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
        </button>

        <div class="dropdown-menu" role="menu" aria-label="Architecture Options">
            <a href="#" class="dropdown-item" role="menuitem">
                <svg class="dropdown-item-icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="2" width="20" height="8" rx="2" ry="2"></rect>
                    <rect x="2" y="14" width="20" height="8" rx="2" ry="2"></rect>
                    <line x1="6" y1="6" x2="6.01" y2="6"></line>
                    <line x1="6" y1="18" x2="6.01" y2="18"></line>
                </svg>
                <span>Serverless Microservices</span>
            </a>
            <a href="#" class="dropdown-item" role="menuitem">
                <svg class="dropdown-item-icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"></path>
                </svg>
                <span>Edge Infrastructure</span>
            </a>
            <a href="#" class="dropdown-item" role="menuitem">
                <svg class="dropdown-item-icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
                    <polyline points="2 17 12 22 22 17"></polyline>
                    <polyline points="2 12 12 17 22 12"></polyline>
                </svg>
                <span>Global Database Cluster</span>
            </a>
        </div>
    </div>
</main>

</body>
</html>
