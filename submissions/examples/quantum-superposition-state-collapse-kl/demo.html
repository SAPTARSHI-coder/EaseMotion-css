<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Superposition State Collapse - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030712; color: #ffffff;">

    <div class="ease-card ease-card-glass superposition-container">
        <div class="superposition-header">
            <h2>Superposition State</h2>
            <span class="ease-badge ease-badge-warning">Probabilistic</span>
        </div>
        
        <div class="superposition-screen ease-center">
            <div class="probability-wave wave-1"></div>
            <div class="probability-wave wave-2"></div>
            <div class="bloch-sphere-ring"></div>
            <div class="wavefunction-core ease-center"></div>
        </div>

        <div class="superposition-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">State: |Ψ⟩ = α|0⟩ + β|1⟩</span>
            <button class="ease-btn ease-btn-primary ease-btn-sm ease-hover-grow">Measure State</button>
        </div>
    </div>

</body>
</html>
