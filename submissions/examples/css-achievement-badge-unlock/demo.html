<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Pure CSS animated achievement badge unlock component"
  >
  <title>Achievement Badge Unlock</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="page">
    <section class="achievement" aria-labelledby="achievement-title">
      <div class="badge-wrapper">
        <div
          class="badge"
          role="img"
          aria-label="Achievement unlocked: Star Performer"
        >
          <span class="badge-shine" aria-hidden="true"></span>

          <span class="badge-icon" aria-hidden="true">★</span>

          <span class="badge-ribbon ribbon-left" aria-hidden="true"></span>
          <span class="badge-ribbon ribbon-right" aria-hidden="true"></span>
        </div>
      </div>

      <p class="unlock-label">ACHIEVEMENT UNLOCKED</p>

      <h1 id="achievement-title">Star Performer</h1>

      <p class="description">
        You reached a new milestone!
      </p>

      <div class="confetti" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
      </div>
    </section>
  </main>
</body>
</html>
