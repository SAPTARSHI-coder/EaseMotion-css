<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Flip Modal - EaseMotion CSS</title>

<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="page">

    <input type="checkbox" id="modal-toggle">

    <label class="open-btn" for="modal-toggle">
        Complete Checkout
    </label>

    <div class="overlay">

        <div class="modal">

            <div class="icon">
                ✓
            </div>

            <h2>Payment Successful</h2>

            <p>
                Your order has been placed successfully.
                A confirmation email has been sent to your inbox.
            </p>

            <div class="buttons">

                <label class="btn secondary"
                    for="modal-toggle">
                    Close
                </label>

                <button class="btn">
                    View Order
                </button>

            </div>

        </div>

    </div>

</div>

</body>
</html>
