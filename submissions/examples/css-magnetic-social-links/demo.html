<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="CSS Magnetic Social Links demonstration"
    >

    <title>CSS Magnetic Social Links</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="demo-container">

        <section class="demo-card">

            <p class="eyebrow">EaseMotion CSS</p>

            <h1>Magnetic Social Links</h1>

            <p class="description">
                Social links with a magnetic-style hover effect created
                entirely with CSS.
            </p>

            <nav
                class="social-links"
                aria-label="Social media links"
            >

                <a
                    class="social-link github"
                    href="https://github.com/"
                    target="_blank"
                    rel="noopener noreferrer"
                    aria-label="GitHub"
                >
                    <span class="social-icon" aria-hidden="true">
                        GH
                    </span>
                    <span class="social-name">
                        GitHub
                    </span>
                </a>

                <a
                    class="social-link linkedin"
                    href="https://www.linkedin.com/"
                    target="_blank"
                    rel="noopener noreferrer"
                    aria-label="LinkedIn"
                >
                    <span class="social-icon" aria-hidden="true">
                        in
                    </span>
                    <span class="social-name">
                        LinkedIn
                    </span>
                </a>

                <a
                    class="social-link twitter"
                    href="https://x.com/"
                    target="_blank"
                    rel="noopener noreferrer"
                    aria-label="X"
                >
                    <span class="social-icon" aria-hidden="true">
                        X
                    </span>
                    <span class="social-name">
                        X
                    </span>
                </a>

                <a
                    class="social-link instagram"
                    href="https://www.instagram.com/"
                    target="_blank"
                    rel="noopener noreferrer"
                    aria-label="Instagram"
                >
                    <span class="social-icon" aria-hidden="true">
                        IG
                    </span>
                    <span class="social-name">
                        Instagram
                    </span>
                </a>

            </nav>

            <div class="info-box">
                <h2>Hover to interact</h2>

                <p>
                    Move your pointer over the social links to see them
                    scale and move toward the pointer.
                </p>
            </div>

        </section>

    </main>

</body>
</html>
