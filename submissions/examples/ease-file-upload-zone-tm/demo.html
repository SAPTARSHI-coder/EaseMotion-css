<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>File Upload Zone | EaseMotion CSS</title><link rel="stylesheet" href="style.css"></head>
<body><div class="fuz-root">
<div class="fuz-card" id="zone"
  ondragover="event.preventDefault();this.classList.add('dragover')"
  ondragleave="this.classList.remove('dragover')"
  ondrop="handleDrop(event)"
  onclick="document.getElementById('fileInput').click()">
<input type="file" id="fileInput" multiple style="display:none" onchange="handleFiles(this.files)">
<span class="fuz-icon">&#128194;</span>
<h3 class="fuz-title">Drop files here or click to browse</h3>
<p class="fuz-body">Drag and drop your files here, or click to select from your computer</p>
<button class="fuz-btn" type="button">Select Files</button>
<p class="fuz-hint">Supports: JPG, PNG, PDF, TXT up to 10MB</p>
</div>
<p class="fuz-sub">Pure CSS styled drag-and-drop file upload zone</p>
</div>
<script>
function handleDrop(e){e.preventDefault();e.target.closest('.fuz-card').classList.remove('dragover');handleFiles(e.dataTransfer.files)}
function handleFiles(files){if(files.length)alert(files.length+' file(s) selected');}
</script>
</body></html>
