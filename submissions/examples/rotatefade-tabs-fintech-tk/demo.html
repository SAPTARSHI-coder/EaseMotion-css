<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rotate Fade Tabs</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="dashboard">

    <h1>Fintech Dashboard</h1>
    <p class="subtitle">
        CSS Rotate-Fade Tabs for financial insights.
    </p>

    <div class="tabs">

        <div class="tab active">
            Portfolio
        </div>

        <div class="tab">
            Analytics
        </div>

        <div class="tab">
            Transactions
        </div>

    </div>

    <div class="content">

        <div class="panel">

            <h2>Portfolio Overview</h2>

            <div class="cards">

                <div class="card">
                    <span class="label">Balance</span>
                    <span class="value">$128,450</span>
                </div>

                <div class="card">
                    <span class="label">Monthly Growth</span>
                    <span class="value">+18.4%</span>
                </div>

                <div class="card">
                    <span class="label">Active Investments</span>
                    <span class="value">24</span>
                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
