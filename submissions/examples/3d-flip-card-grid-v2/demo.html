<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 3D Flip Card Grid</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<section class="card-grid">

    <div class="flip-card">
        <div class="flip-card-inner">

            <div class="flip-card-front">
                <h2>Valorant</h2>
            </div>

            <div class="flip-card-back">
                <p>Competitive FPS Game</p>
            </div>

        </div>
    </div>

    <div class="flip-card">
        <div class="flip-card-inner">

            <div class="flip-card-front">
                <h2>Minecraft</h2>
            </div>

            <div class="flip-card-back">
                <p>Sandbox Adventure</p>
            </div>

        </div>
    </div>

</section>

</body>
</html>
