<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="CSS-only sound wave button with animated rings"
  >
  <title>CSS Sound Wave Button</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="demo">
    <section class="card">
      <h1>Sound Wave Button</h1>

      <p class="description">
        Hover or focus the button to activate the sound wave animation.
      </p>

      <button
        class="sound-button"
        type="button"
        aria-label="Play sound"
      >
        <span class="wave wave-one" aria-hidden="true"></span>
        <span class="wave wave-two" aria-hidden="true"></span>
        <span class="wave wave-three" aria-hidden="true"></span>

        <span class="button-content">
          <span class="speaker" aria-hidden="true">
            🔊
          </span>
          <span>Play</span>
        </span>
      </button>
    </section>
  </main>
</body>
</html>
