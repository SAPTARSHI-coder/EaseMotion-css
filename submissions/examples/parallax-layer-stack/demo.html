<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Parallax Layer Stack</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="scene">

    <section class="hero">

        <div class="layer layer-back"></div>

        <div class="layer layer-middle"></div>

        <div class="layer layer-front"></div>


        <div class="content">

            <h1>CSS Parallax</h1>

            <p>
                Multi-layer scrolling animation created
                using pure CSS scroll-driven timeline.
            </p>

            <button>
                Explore
            </button>

        </div>

    </section>


    <section class="info">

        <h2>Scroll Experience</h2>

        <p>
            Layers move at different speeds creating
            a depth effect without JavaScript.
        </p>

    </section>

</main>


</body>
</html>
