<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ease-skew-drawer-bh</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #0f172a; min-height: 100vh; padding: 2rem; color: #f1f5f9; }
    .container { max-width: 1200px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 2rem; padding: 2rem; background: rgba(30, 41, 59, 0.8); border-radius: 1rem; }
    header h1 { font-size: 2rem; font-weight: 700; background: linear-gradient(135deg, #fbbf24, #f59e0b); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    header p { color: #94a3b8; margin-top: 0.5rem; }
    .demo-section { background: rgba(30, 41, 59, 0.8); border: 1px solid rgba(148, 163, 184, 0.1); border-radius: 1rem; padding: 2rem; margin-bottom: 2rem; }
    .demo-section h2 { font-size: 1.25rem; margin-bottom: 1rem; color: #e2e8f0; }
    .demo-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.5rem; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>ease-skew-drawer-bh</h1>
      <p>CSS Skew-Active Drawer for Fintech Dashboards</p>
    </header>
    
    <section class="demo-section">
      <h2>Skew-Active Drawer Examples</h2>
      <div class="demo-grid">
        <div class="ease-drawer ease-drawer-skew ease-drawer-fintech" style="position:relative;">
          <div class="ease-drawer-title">Portfolio Summary</div>
          <div class="ease-drawer-stat">$124.5K</div>
          <div class="ease-drawer-label">Total Balance</div>
        </div>
        
        <div class="ease-drawer ease-drawer-skew ease-drawer-right">
          <div class="ease-drawer-title">Quick Actions</div>
          <div class="ease-drawer-stat" style="font-size:1.5rem;margin-bottom:0.5rem;">📊</div>
          <div class="ease-drawer-label">View Analytics</div>
        </div>
        
        <div class="ease-drawer ease-drawer-skew ease-drawer-left ease-drawer-fintech" style="position:relative;">
          <div class="ease-drawer-title">Performance</div>
          <div class="ease-drawer-stat">+12.5%</div>
          <div class="ease-drawer-label">This Month</div>
        </div>
      </div>
    </section>
  </div>
</body>
</html>
