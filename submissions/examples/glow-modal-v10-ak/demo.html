<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Glowing Modal Window — EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <p class="label">Pure CSS Animated Pop-In Modal Window</p>

  <input type="checkbox" id="modal-v10-ak" class="ease-modal-checkbox-v10" />
  <label for="modal-v10-ak" class="ease-modal-trigger-v10">Open Modal</label>

  <div class="ease-modal-overlay-v10">
    <div class="ease-modal-dialog-v10">
      <h3 class="ease-modal-title-v10">✨ Neon Modal</h3>
      <p class="ease-modal-desc-v10">Spring scale pop-in modal window with glassmorphism backdrop blur. Zero JS.</p>
      <div>
        <label for="modal-v10-ak" class="ease-modal-close-v10">Close Modal</label>
      </div>
    </div>
  </div>

</body>
</html>
