<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Button | Glassmorphism Styling</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="button-card" tabindex="0" aria-label="3D Glassmorphism Button Showcase">
    <h1 class="card-title">3D Glass Button</h1>
    <p class="card-subtitle">Frosted glassmorphism button with dimensional press depth</p>

    <div class="btn-3d-wrapper">
        <button type="button" class="glass-3d-btn">
            <span>Launch Action</span>
            <span aria-hidden="true">→</span>
        </button>
    </div>
</main>

</body>
</html>
