<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Parallax Scrolling Image Gallery</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section class="parallax-section bg-1">
        <div class="content">
            <h2>Space Explorer</h2>
            <p>Journey into the unknown with seamless parallax scrolling.</p>
        </div>
    </section>

    <section class="spacer">
        <p>Keep scrolling down</p>
    </section>

    <section class="parallax-section bg-2">
        <div class="content">
            <h2>Nebula Wonders</h2>
            <p>Backgrounds move slower than foreground content, creating depth.</p>
        </div>
    </section>

    <section class="spacer">
        <p>Almost there</p>
    </section>

    <section class="parallax-section bg-3">
        <div class="content">
            <h2>Stellar Views</h2>
            <p>All achieved purely with CSS and no JavaScript.</p>
        </div>
    </section>
</body>
</html>
