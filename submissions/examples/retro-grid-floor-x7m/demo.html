<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="./style.css">
<title>Retro Grid Floor Demo</title>
</head>

<body>
<main class="rgf-container" role="main" aria-label="Retro Grid Floor Visualizer">
  <div class="rgf-card">
    <div class="rgf-viewport">
      <div class="rgf-grid-floor"></div>
      <div class="rgf-horizon-glow"></div>
      <div class="rgf-scanlines"></div>
    </div>

    <h1 class="rgf-title">Synthwave Grid</h1>
    <p class="rgf-description">An 80s inspired perspective infinite grid motion effect with continuous movement and scanline overlay.</p>
  </div>
  
</main>
</body>
</html>
