<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Gradient Modal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <input type="checkbox" id="modal-trigger" class="modal-trigger">
    <label for="modal-trigger" class="open-btn">Open 3D Modal</label>
    
    <div class="modal-overlay">
        <div class="modal-3d">
            <h2>Gradient Dimension</h2>
            <p>This modal utilizes CSS 3D transforms (rotateX/Y) to flip into view, backed by a vibrant linear gradient.</p>
            <label for="modal-trigger" class="close-btn">Close</label>
        </div>
    </div>
</body>
</html>
