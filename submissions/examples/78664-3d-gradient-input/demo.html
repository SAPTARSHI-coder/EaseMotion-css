<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    name="description"
    content="Responsive 3D gradient styled input field built with HTML and CSS."
  />
  <title>3D Gradient Input Field</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="demo-page">
    <section class="input-card" aria-labelledby="component-title">
      <div class="card-header">
        <span class="badge">EaseMotion CSS</span>

        <h1 id="component-title">3D Gradient Input</h1>

        <p>
          A layered input field with a vibrant gradient edge, depth effect,
          and smooth focus transition.
        </p>
      </div>

      <form class="input-form" action="#" method="post">
        <div class="field">
          <label for="name">Full Name</label>

          <div class="input-wrapper">
            <span class="input-icon" aria-hidden="true">✦</span>

            <input
              id="name"
              name="name"
              type="text"
              placeholder="Enter your name"
              autocomplete="name"
            />
          </div>
        </div>

        <div class="field">
          <label for="email">Email Address</label>

          <div class="input-wrapper">
            <span class="input-icon" aria-hidden="true">@</span>

            <input
              id="email"
              name="email"
              type="email"
              placeholder="you@example.com"
              autocomplete="email"
            />
          </div>
        </div>

        <div class="field">
          <label for="message">Message</label>

          <div class="input-wrapper textarea-wrapper">
            <span class="input-icon input-icon-top" aria-hidden="true">✎</span>

            <textarea
              id="message"
              name="message"
              rows="4"
              placeholder="Write something..."
            ></textarea>
          </div>
        </div>

        <button class="submit-button" type="submit">
          <span>Continue</span>
          <span aria-hidden="true">→</span>
        </button>
      </form>
    </section>
  </main>
</body>
</html>
