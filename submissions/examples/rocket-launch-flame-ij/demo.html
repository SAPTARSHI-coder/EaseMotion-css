<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-rocket-launch-flame demo</title>
</head>
<body>
<div class="rl-app">
  <span class="rl-title">LAUNCH</span>
  <span class="rl-star rl-star-1"></span>
  <span class="rl-star rl-star-2"></span>
  <span class="rl-star rl-star-3"></span>
  <div class="rl-pad"><span class="rl-pad-bar"></span></div>
  <span class="rl-tower"></span>
  <div class="rl-rocket">
    <span class="rl-nose"></span>
    <span class="rl-body"></span>
    <span class="rl-window"></span>
    <span class="rl-fin rl-fin-l"></span>
    <span class="rl-fin rl-fin-r"></span>
    <span class="rl-flame"></span>
  </div>
  <span class="rl-smoke rl-smoke-1"></span>
  <span class="rl-smoke rl-smoke-2"></span>
  <span class="rl-ready">READY</span>
</div>
</body>
</html>
