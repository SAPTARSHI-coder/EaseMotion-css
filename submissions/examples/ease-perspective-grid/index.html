<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ease Perspective Grid</title>
    <link rel="stylesheet" href="../../../easemotion.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="demo-container">
        
        <header class="header">
            <h1>Perspective Hover Grid</h1>
            <p>100% CSS 3D Physics. Powered by `:has()` and sibling combinators.</p>
        </header>

        <!-- 
          The massive grid container! 
          This is where the `:has()` pseudo-class listens for hovers.
        -->
        <div class="perspective-grid">
            
            <div class="grid-item">
                <img src="https://images.unsplash.com/photo-1682687220742-aba13b6e50ba?auto=format&fit=crop&w=600&q=80" alt="Mountain Landscape">
                <div class="overlay">
                    <h3>Expedition</h3>
                </div>
            </div>
            
            <div class="grid-item">
                <img src="https://images.unsplash.com/photo-1682687982501-1e58f813fb3f?auto=format&fit=crop&w=600&q=80" alt="Desert Dunes">
                <div class="overlay">
                    <h3>Wasteland</h3>
                </div>
            </div>
            
            <div class="grid-item">
                <img src="https://images.unsplash.com/photo-1682687220063-4742bd7fd538?auto=format&fit=crop&w=600&q=80" alt="Ocean Waves">
                <div class="overlay">
                    <h3>Currents</h3>
                </div>
            </div>
            
            <div class="grid-item">
                <img src="https://images.unsplash.com/photo-1682687218147-9806132dc697?auto=format&fit=crop&w=600&q=80" alt="Canyon">
                <div class="overlay">
                    <h3>Erosion</h3>
                </div>
            </div>
            
            <div class="grid-item">
                <img src="https://images.unsplash.com/photo-1682695796954-bad0d0f59ff1?auto=format&fit=crop&w=600&q=80" alt="Forest">
                <div class="overlay">
                    <h3>Canopy</h3>
                </div>
            </div>
            
            <div class="grid-item">
                <img src="https://images.unsplash.com/photo-1682687982185-531d09ec56fc?auto=format&fit=crop&w=600&q=80" alt="Glacier">
                <div class="overlay">
                    <h3>Tundra</h3>
                </div>
            </div>
            
        </div>
        
    </main>

</body>
</html>
