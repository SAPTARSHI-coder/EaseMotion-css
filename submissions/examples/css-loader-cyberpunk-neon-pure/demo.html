<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Loader: Cyberpunk Neon</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="layout-container">
        
        <header class="section-header">
            <h1 class="title">Pure CSS Loader: Cyberpunk Neon</h1>
            <p class="subtitle">A high-tech, hardware-accelerated loader featuring glowing neon rings and text glitch effects built completely in CSS.</p>
        </header>

        <div class="demo-area">
            
            <div class="loader-container" aria-label="Loading content, cyberpunk neon animation playing">
                
                <!-- 
                  [TECHNIQUE] Cyberpunk Loader
                  Using nested glowing rings spinning in opposite directions.
                -->
                <div class="cyberpunk-loader" aria-hidden="true">
                    <!-- The outer neon pink ring -->
                    <div class="neon-ring ring-1"></div>
                    <!-- The inner neon cyan ring -->
                    <div class="neon-ring ring-2"></div>
                </div>
                
                <!-- 
                  [TECHNIQUE] CSS Text Glitch
                  We use pseudo-elements and clip-path animations to create
                  a classic cyberpunk text glitch effect.
                -->
                <div class="glitch-wrapper">
                    <div class="glitch-text" data-text="LOADING">LOADING</div>
                </div>
                
            </div>
            
        </div>
        
    </div>

</body>
</html>
