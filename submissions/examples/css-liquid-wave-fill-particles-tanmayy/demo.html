<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Liquid Wave Fill Particles - EaseMotion CSS</title>
  <!-- Import EaseMotion CSS -->
  <link rel="stylesheet" href="../../../easemotion.css">
  <!-- Component Specific Styles -->
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="minimalist-bg">

  <div class="demo-container">
    
    <div class="header-section">
      <h1 class="ease-text-3xl">Liquid Wave Fill Particles</h1>
      <p class="ease-color-muted">A pure CSS fluid simulation using rotating geometric masks. Complete with organic, rising bubble particles that pop at the surface tension line.</p>
    </div>

    <!-- The Liquid Component Viewport -->
    <div class="liquid-viewport" aria-label="Animated liquid wave fill tank with rising bubbles" role="img">
      
      <!-- The Dashboard Widget -->
      <div class="tank-widget ease-glass-card">
        
        <h2 class="widget-title">Hydration Core</h2>
        
        <!-- The Liquid Tank -->
        <div class="tank-container">
          
          <!-- Background Wave (Depth) -->
          <div class="wave wave-back"></div>
          
          <!-- Foreground Wave -->
          <div class="wave wave-front"></div>
          
          <!-- Rising Particles (Bubbles) -->
          <div class="bubble b-1"></div>
          <div class="bubble b-2"></div>
          <div class="bubble b-3"></div>
          <div class="bubble b-4"></div>
          <div class="bubble b-5"></div>
          <div class="bubble b-6"></div>
          <div class="bubble b-7"></div>
          <div class="bubble b-8"></div>
          
          <!-- Center Text Overlay -->
          <div class="tank-value">68%</div>
          
        </div>
        
        <p class="widget-desc">System stabilizing...</p>
        
      </div>
      
    </div>

  </div>

</body>
</html>
