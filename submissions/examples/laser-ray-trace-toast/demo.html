<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark light">
  <title>Laser Ray Trace Toast</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">
    <section class="demo-area" aria-label="Laser ray trace toast demo">

      <article class="toast" role="status" aria-live="polite">

        <div class="laser-rays" aria-hidden="true">
          <span class="ray ray-one"></span>
          <span class="ray ray-two"></span>
          <span class="ray ray-three"></span>
          <span class="ray ray-four"></span>
        </div>

        <div class="toast-icon" aria-hidden="true">
          <span>✓</span>
        </div>

        <div class="toast-content">
          <span class="toast-label">SYSTEM UPDATE</span>
          <h1>Transmission Complete</h1>
          <p>Your request has been processed successfully.</p>
        </div>

        <button
          class="toast-close"
          type="button"
          aria-label="Close notification"
        >
          <span aria-hidden="true">×</span>
        </button>

      </article>

    </section>
  </main>

</body>
</html>
