<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Glowing Neon Accordion — EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <p class="label">Pure CSS Animated Glowing Accordion</p>

  <div class="ease-glow-accordion">
    <!-- Item 1 -->
    <input type="checkbox" id="gacc1" class="ease-glow-accordion-checkbox" checked />
    <div class="ease-glow-accordion-item">
      <label for="gacc1" class="ease-glow-accordion-header">
        <span>Neon Glow Accordion</span>
        <span class="ease-glow-accordion-icon">▼</span>
      </label>
      <div class="ease-glow-accordion-drawer">
        <div class="ease-glow-accordion-body">
          Combines smooth CSS Grid height opening with an active neon border glow box-shadow transition.
        </div>
      </div>
    </div>

    <!-- Item 2 -->
    <input type="checkbox" id="gacc2" class="ease-glow-accordion-checkbox" />
    <div class="ease-glow-accordion-item">
      <label for="gacc2" class="ease-glow-accordion-header">
        <span>Zero JavaScript Required</span>
        <span class="ease-glow-accordion-icon">▼</span>
      </label>
      <div class="ease-glow-accordion-drawer">
        <div class="ease-glow-accordion-body">
          Built using HTML sibling checkbox state selectors without relying on external libraries.
        </div>
      </div>
    </div>
  </div>

</body>
</html>
