<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Approximate Optimization Algorithm QAOA - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css"></head><body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030712; color: #ffffff;">

    <div class="ease-card ease-card-glass qaoa-container">
        <div class="qaoa-header">
            <h2>QAOA Optimization</h2>
            <span class="ease-badge ease-badge-primary">Optimizing</span>
        </div>
        
        <div class="qaoa-screen ease-center">
            <div class="qaoa-flux flux-qaoa-a"></div>
            <div class="qaoa-flux flux-qaoa-b"></div>
            <div class="qaoa-boundary-ring"></div>
            <div class="qaoa-core ease-center"></div>
        </div>

        <div class="qaoa-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Cost &amp; Mixer: U(C,&gamma;) U(B,&beta;)</span>
            <button class="ease-btn ease-btn-primary ease-btn-sm ease-hover-grow">Run QAOA Circuit</button>
        </div>
    </div></body></html>
