<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fade-In Carousel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="carousel-container">

    <h1>Fade-In Carousel</h1>

    <div class="carousel">

        <div class="slide slide1">
            <h2>Beautiful Landscapes</h2>
            <p>Experience smooth fade-in transitions for responsive web layouts.</p>
        </div>

        <div class="slide slide2">
            <h2>Creative Designs</h2>
            <p>Pure HTML and CSS animations with no JavaScript required.</p>
        </div>

        <div class="slide slide3">
            <h2>Accessible Motion</h2>
            <p>Supports responsive layouts and reduced-motion preferences.</p>
        </div>

    </div>

    <div class="indicators">
        <span></span>
        <span></span>
        <span></span>
    </div>

</div>

</body>
</html>
