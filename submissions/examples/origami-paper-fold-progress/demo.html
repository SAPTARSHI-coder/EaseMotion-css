<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Origami Paper Fold styled CSS progress bars"
  >
  <title>Origami Paper Fold Progress</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="demo">
    <section class="progress-card" aria-labelledby="progress-title">
      <div class="card-header">
        <div>
          <p class="eyebrow">CSS Progress</p>
          <h1 id="progress-title">Origami Paper Fold</h1>
        </div>

        <span class="status" aria-label="Progress status">
          72%
        </span>
      </div>

      <div
        class="progress"
        role="progressbar"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="72"
        aria-label="Project completion"
      >
        <div class="progress-fill" style="--progress: 72%;">
          <span class="fold fold-left" aria-hidden="true"></span>
          <span class="fold fold-right" aria-hidden="true"></span>
          <span class="shine" aria-hidden="true"></span>
        </div>
      </div>

      <div class="progress-meta">
        <span>Project completion</span>
        <strong>72%</strong>
      </div>
    </section>
  </main>
</body>
</html>
