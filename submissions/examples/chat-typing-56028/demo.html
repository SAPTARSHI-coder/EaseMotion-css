<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Typing Indicator Demo</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            margin: 0;
            height: 100vh;
            background-color: #f1f5f9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .chat-window {
            width: 320px;
            height: 400px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            gap: 15px;
        }
        
        .message-bubble {
            background-color: #3b82f6;
            color: white;
            padding: 12px 16px;
            border-radius: 20px 20px 0 20px;
            align-self: flex-end;
            max-width: 80%;
            font-size: 0.95rem;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <div class="chat-window">
        <div class="message-bubble">
            Hey! Are you there?
        </div>
        
        <!-- The Indicator Component -->
        <div class="ease-typing-indicator" style="align-self: flex-start; border-radius: 20px 20px 20px 0;">
            <div class="ease-typing-dot"></div>
            <div class="ease-typing-dot"></div>
            <div class="ease-typing-dot"></div>
        </div>
    </div>
</body>
</html>
