<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Firefly Swarm · fireflies gather and scatter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <div class="firefly-container">
      <div class="firefly-display" id="fireflyDisplay">
        <!-- Canvas for fireflies -->
        <canvas id="fireflyCanvas"></canvas>
        
        <!-- Firefly Info -->
        <div class="firefly-info">
          <span class="info-label">✨ Fireflies</span>
          <span class="info-value" id="fireflyCount">0</span>
        </div>

        <!-- Firefly Controls -->
        <div class="firefly-controls">
          <div class="control-group">
            <label class="control-label">🌟 Swarm</label>
            <input type="range" class="control-slider" id="swarmSlider" min="0" max="100" value="50">
            <span class="control-value" id="swarmValue">50%</span>
          </div>
          <div class="control-group">
            <label class="control-label">💡 Glow</label>
            <input type="range" class="control-slider" id="glowSlider" min="0" max="100" value="50">
            <span class="control-value" id="glowValue">50%</span>
          </div>
        </div>

        <!-- Firefly Text -->
        <div class="firefly-text">
          <span class="text-label">✨ Firefly Swarm</span>
          <span class="text-message" id="fireflyMessage">Watch fireflies gather and scatter</span>
        </div>
      </div>
      
      <div class="firefly-status">
        <span id="fireflyStatus">✨ Fireflies dance in the night</span>
      </div>
    </div>

    <div class="controls">
      <button class="btn btn-reset" id="resetBtn">⟳ Reset</button>
    </div>
    <div class="footer-note">
      <span>✨ firefly swarm · 4 colors · glow control</span>
    </div>
  </div>

  <script>
    (function() {
      "use strict";

      // DOM refs
      const canvas = document.getElementById('fireflyCanvas');
      const ctx = canvas.getContext('2d');
      const display = document.getElementById('fireflyDisplay');
      const fireflyCount = document.getElementById('fireflyCount');
      const fireflyStatus = document.getElementById('fireflyStatus');
      const fireflyMessage = document.getElementById('fireflyMessage');
      const resetBtn = document.getElementById('resetBtn');
      const swarmSlider = document.getElementById('swarmSlider');
      const swarmValue = document.getElementById('swarmValue');
      const glowSlider = document.getElementById('glowSlider');
      const glowValue = document.getElementById('glowValue');

      // State
      let fireflies = [];
      let animationId = null;
      let time = 0;
      let swarmCenter = { x: 0, y: 0 };

      // Firefly colors
      const fireflyColors = [
        { body: '#fbbf24', glow: 'rgba(251, 191, 36, 0.3)', bright: '#fcd34d' },
        { body: '#34d399', glow: 'rgba(52, 211, 153, 0.3)', bright: '#6ee7b7' },
        { body: '#60a5fa', glow: 'rgba(96, 165, 250, 0.3)', bright: '#93c5fd' },
        { body: '#f472b6', glow: 'rgba(244, 114, 182, 0.3)', bright: '#f9a8d4' }
      ];

      // Firefly class
      class Firefly {
        constructor() {
          this.x = Math.random() * canvas.width;
          this.y = Math.random() * canvas.height;
          this.size = 2 + Math.random() * 3;
          this.speed = 0.3 + Math.random() * 0.5;
          this.angle = Math.random() * Math.PI * 2;
          this.phase = Math.random() * Math.PI * 2;
          this.color = fireflyColors[Math.floor(Math.random() * fireflyColors.length)];
          this.wobble = 0.5 + Math.random() * 1;
          this.flashSpeed = 0.02 + Math.random() * 0.03;
          this.flashPhase = Math.random() * Math.PI * 2;
          this.targetX = this.x;
          this.targetY = this.y;
          this.returnTimer = 0;
          this.scatterTimer = 0;
        }

        update(swarm, glow, time) {
          const swarmFactor = swarm / 100;
          const w = canvas.width;
          const h = canvas.height;
          
          // Update flash
          this.flashPhase += this.flashSpeed;
          const flash = 0.3 + Math.sin(this.flashPhase) * 0.3 + 0.4;
          
          // Swarm behavior
          if (swarmFactor > 0.1) {
            // Gather toward center
            const cx = w / 2;
            const cy = h / 2;
            const dx = cx - this.x;
            const dy = cy - this.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            
            if (dist > 5) {
              const moveSpeed = swarmFactor * 0.02;
              this.x += dx * moveSpeed;
              this.y += dy * moveSpeed;
            }
            
            // Scatter occasionally
            this.scatterTimer += 0.01;
            if (this.scatterTimer > 2 + Math.random()) {
              this.scatterTimer = 0;
              this.targetX = this.x + (Math.random() - 0.5) * 100 * swarmFactor;
              this.targetY = this.y + (Math.random() - 0.5) * 100 * swarmFactor;
            }
          } else {
            // Free roam when no swarm
            this.angle += (Math.random() - 0.5) * 0.1;
            this.x += Math.cos(this.angle) * this.speed * 0.3;
            this.y += Math.sin(this.angle) * this.speed * 0.3;
          }
          
          // Wobble
          this.phase += 0.02;
          this.x += Math.sin(this.phase) * this.wobble * 0.05;
          this.y += Math.cos(this.phase * 0.7) * this.wobble * 0.05;
          
          // Keep within bounds
          if (this.x < 10) this.x = 10;
          if (this.x > w - 10) this.x = w - 10;
          if (this.y < 10) this.y = 10;
          if (this.y > h - 10) this.y = h - 10;
          
          // Return if too far from center when swarming
          if (swarmFactor > 0.3) {
            const cx = w / 2;
            const cy = h / 2;
            const dx = this.x - cx;
            const dy = this.y - cy;
            const dist = Math.sqrt(dx * dx + dy * dy);
            const maxDist = Math.min(w, h) * 0.4;
            if (dist > maxDist) {
              this.x = cx + dx * 0.95;
              this.y = cy + dy * 0.95;
            }
          }
          
          return flash;
        }

        draw(ctx, glow) {
          const glowFactor = glow / 100;
          const flash = 0.3 + Math.sin(this.flashPhase) * 0.3 + 0.4;
          const alpha = flash * (0.5 + glowFactor * 0.5);
          const size = this.size * (0.5 + flash * 0.5) * (0.5 + glowFactor * 0.5);
          
          // Glow
          ctx.save();
          const glowSize = size * (4 + glowFactor * 6);
          const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, glowSize);
          grad.addColorStop(0, this.color.body + '88');
          grad.addColorStop(0.2, this.color.body + '44');
          grad.addColorStop(0.5, this.color.glow);
          grad.addColorStop(1, 'rgba(0,0,0,0)');
          ctx.fillStyle = grad;
          ctx.shadowColor = this.color.body;
          ctx.shadowBlur = 20 * (0.3 + glowFactor * 0.7);
          ctx.globalAlpha = alpha * 0.6;
          ctx.beginPath();
          ctx.arc(this.x, this.y, glowSize, 0, Math.PI * 2);
          ctx.fill();
          
          // Core body
          ctx.shadowBlur = 10 * (0.3 + glowFactor * 0.7);
          ctx.fillStyle = this.color.bright;
          ctx.globalAlpha = alpha * 0.9;
          ctx.beginPath();
          ctx.arc(this.x, this.y, size * 0.6, 0, Math.PI * 2);
          ctx.fill();
          
          // Inner glow
          ctx.shadowBlur = 0;
          ctx.fillStyle = '#ffffff';
          ctx.globalAlpha = alpha * 0.2;
          ctx.beginPath();
          ctx.arc(this.x - size * 0.15, this.y - size * 0.15, size * 0.25, 0, Math.PI * 2);
          ctx.fill();
          
          // Wings (small transparent arcs)
          ctx.globalAlpha = alpha * 0.15;
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 0.5;
          for (let i = -1; i <= 1; i+=2) {
            ctx.beginPath();
            ctx.arc(this.x + i * size * 0.5, this.y - size * 0.2, size * 0.5, 0, Math.PI * 0.6);
            ctx.stroke();
          }
          
          ctx.restore();
        }
      }

      // Generate fireflies
      function generateFireflies() {
        const count = 40 + Math.floor(Math.random() * 20);
        fireflies = [];
        for (let i = 0; i < count; i++) {
          fireflies.push(new Firefly());
        }
        fireflyCount.textContent = fireflies.length;
      }

      // Draw background
      function drawBackground(time) {
        const w = canvas.width;
        const h = canvas.height;
        
        // Night sky
        const grad = ctx.createRadialGradient(w/2, h/2, 0, w/2, h/2, w * 0.7);
        grad.addColorStop(0, 'rgba(5, 10, 25, 0.4)');
        grad.addColorStop(0.5, 'rgba(10, 15, 30, 0.5)');
        grad.addColorStop(1, 'rgba(0, 0, 10, 0.7)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, w, h);
        
        // Stars
        for (let i = 0; i < 60; i++) {
          const x = Math.random() * w;
          const y = Math.random() * h;
          const size = 0.3 + Math.random() * 0.8;
          const alpha = 0.1 + Math.random() * 0.2;
          ctx.save();
          ctx.globalAlpha = alpha;
          ctx.fillStyle = '#ffffff';
          ctx.shadowColor = '#ffffff';
          ctx.shadowBlur = 1;
          ctx.beginPath();
          ctx.arc(x, y, size, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
        
        // Ground silhouette
        ctx.fillStyle = 'rgba(10, 15, 20, 0.15)';
        ctx.beginPath();
        ctx.moveTo(0, h);
        for (let i = 0; i <= w; i += 5) {
          const x = i;
          const y = h * 0.7 + Math.sin(i * 0.01 + 1) * 15 + Math.sin(i * 0.02 + 0.5) * 10 + 5;
          ctx.lineTo(x, y);
        }
        ctx.lineTo(w, h);
        ctx.closePath();
        ctx.fill();
        
        // Grass silhouettes
        ctx.fillStyle = 'rgba(10, 20, 15, 0.1)';
        for (let i = 0; i < 20; i++) {
          const x = Math.random() * w;
          const y = h * 0.75 + Math.sin(x * 0.02) * 10;
          const height = 5 + Math.random() * 10;
          const width = 1 + Math.random() * 2;
          ctx.fillRect(x, y - height, width, height);
        }
      }

      // Resize canvas
      function resizeCanvas() {
        const rect = display.getBoundingClientRect();
        canvas.width = rect.width;
        canvas.height = rect.height;
        canvas.style.width = rect.width + 'px';
        canvas.style.height = rect.height + 'px';
        generateFireflies();
        
        // Update firefly positions
        fireflies.forEach(f => {
          f.x = Math.min(f.x, canvas.width - 10);
          f.y = Math.min(f.y, canvas.height - 10);
        });
      }

      // Animation loop
      function animate() {
        time += 0.02;
        const swarm = parseInt(swarmSlider.value);
        const glow = parseInt(glowSlider.value);
        
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawBackground(time);
        
        // Update and draw fireflies
        fireflies.forEach(f => {
          const flash = f.update(swarm, glow, time);
          f.draw(ctx, glow);
        });
        
        // Update status
        if (swarm > 70) {
          fireflyStatus.textContent = '✨ Fireflies gathered together!';
          fireflyStatus.style.color = '#fbbf24';
        } else if (swarm > 30) {
          fireflyStatus.textContent = '✨ Fireflies dancing in the night';
          fireflyStatus.style.color = '#818cf8';
        } else {
          fireflyStatus.textContent = '✨ Fireflies scattered across the meadow';
          fireflyStatus.style.color = '#94a3b8';
        }
        
        // Update message based on glow
        if (glow > 70) {
          fireflyMessage.textContent = '✨ Fireflies glowing brightly!';
          fireflyMessage.style.color = '#fbbf24';
        } else if (glow > 30) {
          fireflyMessage.textContent = '✨ Fireflies shimmering softly';
          fireflyMessage.style.color = '#818cf8';
        } else {
          fireflyMessage.textContent = 'Watch fireflies gather and scatter';
          fireflyMessage.style.color = '#94a3b8';
        }
        
        animationId = requestAnimationFrame(animate);
      }

      // Reset
      function resetFireflies() {
        generateFireflies();
        swarmSlider.value = 50;
        swarmValue.textContent = '50%';
        glowSlider.value = 50;
        glowValue.textContent = '50%';
        fireflyStatus.textContent = '🔄 Reset complete';
        fireflyStatus.style.color = '#94a3b8';
        fireflyMessage.textContent = 'Watch fireflies gather and scatter';
        fireflyMessage.style.color = '#94a3b8';
        setTimeout(() => {
          fireflyStatus.textContent = '✨ Fireflies dance in the night';
          fireflyStatus.style.color = '#94a3b8';
        }, 1000);
      }

      // Event listeners
      swarmSlider.addEventListener('input', function() {
        swarmValue.textContent = this.value + '%';
      });

      glowSlider.addEventListener('input', function() {
        glowValue.textContent = this.value + '%';
      });

      if (resetBtn) {
        resetBtn.addEventListener('click', function(e) {
          e.preventDefault();
          resetFireflies();
        });
      }

      // Keyboard shortcuts
      document.addEventListener('keydown', function(e) {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

        const key = e.key;
        if (key === 'r' || key === 'R') {
          e.preventDefault();
          resetFireflies();
        }
      });

      // Resize
      window.addEventListener('resize', resizeCanvas);

      // Initialize
      resizeCanvas();
      animate();
      
      console.log('✨ Firefly Swarm ready · shortcuts: [R] Reset');
    })();
  </script>
</body>
</html>
