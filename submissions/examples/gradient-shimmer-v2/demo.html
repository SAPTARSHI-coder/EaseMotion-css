<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Gradient Shimmer CSS Slider">
  <title>Gradient Shimmer Slider</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="demo-container">
    <section class="slider" aria-label="Gradient Shimmer Slider">

      <div class="slider-track">
        <article class="slide">
          <div class="slide-content">
            <span class="slide-number">01</span>
            <h1>Gradient Shimmer</h1>
            <p>
              A smooth CSS-only slider with an animated gradient shimmer
              effect.
            </p>
            <button type="button">Explore</button>
          </div>
        </article>

        <article class="slide">
          <div class="slide-content">
            <span class="slide-number">02</span>
            <h1>Pure CSS Motion</h1>
            <p>
              Lightweight transitions and animations without external
              JavaScript.
            </p>
            <button type="button">Discover</button>
          </div>
        </article>

        <article class="slide">
          <div class="slide-content">
            <span class="slide-number">03</span>
            <h1>Modern Interface</h1>
            <p>
              Designed to work beautifully across modern screen sizes.
            </p>
            <button type="button">View More</button>
          </div>
        </article>
      </div>

      <div class="slider-controls" aria-label="Slider controls">
        <button class="control active" aria-label="Slide 1"></button>
        <button class="control" aria-label="Slide 2"></button>
        <button class="control" aria-label="Slide 3"></button>
      </div>

    </section>
  </main>

</body>
</html>
