<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Gradient Shimmer CSS 3D Effect"
  >
  <title>Gradient Shimmer - CSS 3D Effect</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="demo-container">
    <section class="demo" aria-labelledby="demo-title">

      <p class="eyebrow">CSS 3D Effect</p>

      <h1 id="demo-title">Gradient Shimmer</h1>

      <div class="scene">
        <article class="shimmer-card">
          <div class="shimmer-content">
            <span class="card-badge">3D</span>

            <h2>Gradient Shimmer</h2>

            <p>
              A smooth CSS-only 3D card with a moving gradient shimmer
              and subtle depth interaction.
            </p>

            <span class="card-action">Explore →</span>
          </div>
        </article>
      </div>

      <p class="hint">Hover or focus the card</p>

    </section>
  </main>
</body>
</html>
