<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Flip Label Button - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Showcase Box -->
  <main class="showcase-container" role="region" aria-label="3D Flip Button Showcase">
    
    <h1 class="title">Flip Button</h1>
    <p class="subtitle">A 3D rolling button that flips vertically. Hover over or focus on the button to reveal the alternate action label.</p>

    <!-- 3D Perspective Wrapper -->
    <div class="flip-button-wrapper">
      
      <!-- Focusable Button Anchor -->
      <a href="#" class="flip-btn" aria-label="Hover Me to reveal alternative action: Let's Go">
        
        <!-- Flipper structure -->
        <div class="flipper" aria-hidden="true">
          
          <!-- Front Face -->
          <div class="face face-front">HOVER ME</div>

          <!-- Bottom Face -->
          <div class="face face-bottom">LET'S GO!</div>

        </div>

      </a>

    </div>

  </main>

</body>
</html>
