<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CSS-only animated DNA double helix loader">
  <title>CSS DNA Helix Loader</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="demo-page">
    <section class="demo-card" aria-labelledby="loader-title">
      <span class="demo-card__eyebrow">EaseMotion CSS</span>
      <h1 id="loader-title">DNA Helix Loader</h1>
      <p class="demo-card__description">
        A lightweight DNA-inspired loading animation built entirely with CSS.
      </p>

      <div
        class="dna-loader"
        role="status"
        aria-label="Loading"
        aria-live="polite"
      >
        <span class="dna-loader__strand dna-loader__strand--one"></span>
        <span class="dna-loader__strand dna-loader__strand--two"></span>

        <span class="dna-loader__pair pair--1"></span>
        <span class="dna-loader__pair pair--2"></span>
        <span class="dna-loader__pair pair--3"></span>
        <span class="dna-loader__pair pair--4"></span>
        <span class="dna-loader__pair pair--5"></span>
        <span class="dna-loader__pair pair--6"></span>
        <span class="dna-loader__pair pair--7"></span>
        <span class="dna-loader__pair pair--8"></span>
      </div>

      <p class="loader-label">Loading...</p>
    </section>
  </main>
</body>
</html>
