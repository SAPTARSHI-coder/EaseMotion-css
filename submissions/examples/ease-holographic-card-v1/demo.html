<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ease Holographic Shimmer Foil Card</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="ease-holo-body">
  <div class="ease-holo-card" id="holoCard">
    <div class="ease-holo-foil"></div>
    <div class="ease-holo-content">
      <span class="ease-badge">LEGENDARY BADGE</span>
      <h2>Holographic Sheen</h2>
      <p>Multi-layered iridescent glare shift reacting to pointer movement</p>
    </div>
  </div>

  <script>
    const card = document.getElementById('holoCard');
    card.addEventListener('mousemove', (e) => {
      const rect = card.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      card.style.setProperty('--x', `${x}px`);
      card.style.setProperty('--y', `${y}px`);
    });
  </script>
</body>
</html>
