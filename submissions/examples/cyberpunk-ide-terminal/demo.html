<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyberpunk IDE Code Terminal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="terminal">

    <div class="terminal-header">

        <div class="traffic-lights">
            <span class="red"></span>
            <span class="yellow"></span>
            <span class="green"></span>
        </div>

        <div class="title">
            main.js — Cyberpunk IDE
        </div>

    </div>

    <div class="editor">

        <div class="lines">
            <span>1</span>
            <span>2</span>
            <span>3</span>
            <span>4</span>
            <span>5</span>
            <span>6</span>
            <span>7</span>
        </div>

        <pre class="code"><code>
<span class="keyword">const</span> <span class="variable">theme</span> = <span class="string">"Cyberpunk"</span>;

<span class="keyword">function</span> <span class="function">launch</span>() {
    <span class="keyword">return</span> <span class="string">"Hello Developer!"</span>;
}

<span class="type">console</span>.<span class="function">log</span>(<span class="function">launch</span>());
<span class="cursor"></span>
        </code></pre>

    </div>

</div>

</body>
</html>
