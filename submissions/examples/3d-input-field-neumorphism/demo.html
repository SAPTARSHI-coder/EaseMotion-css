<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Neumorphism Input Field</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="container">

  <h1>3D Input Field</h1>

  <form class="card">

    <label for="email">Email Address</label>

    <input
      type="email"
      id="email"
      placeholder="Enter your email"
      aria-label="Email Address"
    >

    <button type="submit">
      Continue
    </button>

  </form>

</div>

</body>
</html>
