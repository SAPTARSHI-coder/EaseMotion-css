<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glassmorphism Badge Component</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="badge-container">
        <span class="ease-badge ease-badge-success">
            <span class="ease-badge-dot ease-badge-pulse"></span>
            System Live
        </span>

        <span class="ease-badge ease-badge-warning">
            <span class="ease-badge-dot ease-badge-pulse"></span>
            Maintenance
        </span>
    </div>

</body>
</html>
