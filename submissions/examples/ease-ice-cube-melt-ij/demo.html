<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ice Cube Melt Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="cooler" aria-label="ice cube melting">
    <div class="glass" aria-hidden="true">
      <span class="water" id="water"></span>
      <div class="ice-cube" id="iceCube" aria-hidden="true"></div>
      <span class="condensation" aria-hidden="true"></span>
    </div>
    <button class="melt-btn" id="meltBtn" type="button">Melt Cube</button>
    <p class="caption">The cube shrinks and the water level rises.</p>
  </main>
  <script>
    const cube = document.getElementById("iceCube");
    const water = document.getElementById("water");
    const btn = document.getElementById("meltBtn");
    btn.addEventListener("click", () => {
      cube.classList.toggle("melted");
      water.classList.toggle("risen");
      btn.textContent = cube.classList.contains("melted") ? "Refreeze Cube" : "Melt Cube";
    });
  </script>
</body>
</html>
