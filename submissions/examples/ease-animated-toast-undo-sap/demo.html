<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ease-animated-toast-undo-sap demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { height: 100vh; margin: 0; display: flex; align-items: center; justify-content: center; background: #f4f4f5; font-family: system-ui, sans-serif; }
    button.trigger { padding: 10px 18px; border-radius: 8px; border: none; background: #ef4444; color: #fff; cursor: pointer; }
  </style>
</head>
<body>
  <button class="trigger" id="deleteBtn">Delete Item</button>
  <div class="undo-toast-sap" id="toast" style="position:relative;">
    <span>Item deleted</span>
    <button id="undoBtn">UNDO</button>
    <div class="toast-timer-bar"></div>
  </div>
  <script>
    const toast = document.getElementById('toast');
    let hideTimer;
    document.getElementById('deleteBtn').addEventListener('click', () => {
      toast.classList.add('visible');
      clearTimeout(hideTimer);
      hideTimer = setTimeout(() => toast.classList.remove('visible'), 4000);
    });
    document.getElementById('undoBtn').addEventListener('click', () => {
      clearTimeout(hideTimer);
      toast.classList.remove('visible');
    });
  </script>
</body>
</html>
