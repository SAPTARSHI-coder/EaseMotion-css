<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zoom-In Navbar Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top Navigation Container -->
  <header class="ease-nav-container">
    <nav class="ease-zoom-navbar" aria-label="Main Navigation">
      
      <!-- Brand/Logo -->
      <a href="#" class="ease-nav-brand">
        <span class="brand-text">Creative</span>
      </a>

      <!-- Navigation Links -->
      <ul class="ease-nav-links">
        <li class="ease-nav-item">
          <a href="#" class="ease-nav-link" aria-current="page">Work</a>
        </li>
        <li class="ease-nav-item">
          <a href="#" class="ease-nav-link">About</a>
        </li>
        <li class="ease-nav-item">
          <a href="#" class="ease-nav-link">Studio</a>
        </li>
      </ul>

      <!-- Action Button -->
      <div class="ease-nav-actions">
        <a href="#" class="ease-btn-contact">Contact</a>
      </div>
      
    </nav>
  </header>

  <!-- Dummy content to show the navbar floating above -->
  <main class="page-content">
    <h1>Zoom-In Navbar</h1>
    <p>Hover over the navigation links above to see the smooth, pure CSS scale and blur effect. This is perfect for modern creative portfolios.</p>
  </main>

</body>
</html>
