<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Pill Tab Navigation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="demo-container">
    <h1>CSS Pill Tab Navigation</h1>

    <nav class="pill-tabs" aria-label="Primary Navigation">
      <button class="pill-tab active" aria-current="page">
        Home
      </button>

      <button class="pill-tab">
        Projects
      </button>

      <button class="pill-tab">
        Analytics
      </button>

      <button class="pill-tab">
        Settings
      </button>
    </nav>

    <p class="description">
      Pill-shaped navigation with smooth hover effects and an active state indicator.
    </p>
  </main>

</body>
</html>
