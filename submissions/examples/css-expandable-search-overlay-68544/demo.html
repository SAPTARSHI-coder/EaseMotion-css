<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Expandable Search Overlay</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <input type="checkbox" id="search-toggle" hidden>

  <label for="search-toggle" class="search-button" aria-label="Open Search">
    🔍
  </label>

  <div class="search-overlay">
    <label for="search-toggle" class="close-button" aria-label="Close Search">
      ✕
    </label>

    <div class="search-box">
      <h2>Search</h2>
      <input
        type="search"
        placeholder="Search anything..."
        aria-label="Search Input"
      >
    </div>
  </div>

</body>
</html>
