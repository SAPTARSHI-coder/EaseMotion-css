<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Ripple-Wave Stepper - Minimalist Tech</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="layout-container">
        <header class="section-header">
            <h1 class="title">System Initialization</h1>
            <p class="subtitle">A minimalist tech stepper featuring a concentric ripple-wave pulse for active states.</p>
        </header>

        <div class="dashboard-area">
            
            <div class="card">
                
                <!-- Pure CSS State Management -->
                <input type="radio" id="step-1" name="stepper" class="step-input" checked>
                <input type="radio" id="step-2" name="stepper" class="step-input">
                <input type="radio" id="step-3" name="stepper" class="step-input">
                <input type="radio" id="step-4" name="stepper" class="step-input">

                <!-- The Stepper UI -->
                <div class="stepper-wrapper">
                    <!-- Progress Line (Background) -->
                    <div class="stepper-track"></div>
                    <!-- Progress Line (Fill) -->
                    <div class="stepper-fill"></div>

                    <!-- Step 1 -->
                    <div class="step-item step-item-1">
                        <label for="step-1" class="step-circle color-blue">
                            <!-- Ripple elements hidden inside the circle -->
                            <div class="ripple r-1"></div>
                            <div class="ripple r-2"></div>
                            <div class="ripple r-3"></div>
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>
                            <span class="step-num">1</span>
                        </label>
                        <div class="step-content">
                            <h3>Verify Hardware</h3>
                            <p>Checking peripheral connections.</p>
                        </div>
                    </div>

                    <!-- Step 2 -->
                    <div class="step-item step-item-2">
                        <label for="step-2" class="step-circle color-purple">
                            <div class="ripple r-1"></div>
                            <div class="ripple r-2"></div>
                            <div class="ripple r-3"></div>
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>
                            <span class="step-num">2</span>
                        </label>
                        <div class="step-content">
                            <h3>Load Firmware</h3>
                            <p>Flashing BIOS securely.</p>
                        </div>
                    </div>

                    <!-- Step 3 -->
                    <div class="step-item step-item-3">
                        <label for="step-3" class="step-circle color-pink">
                            <div class="ripple r-1"></div>
                            <div class="ripple r-2"></div>
                            <div class="ripple r-3"></div>
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>
                            <span class="step-num">3</span>
                        </label>
                        <div class="step-content">
                            <h3>Mount Volumes</h3>
                            <p>Decrypting storage arrays.</p>
                        </div>
                    </div>

                    <!-- Step 4 -->
                    <div class="step-item step-item-4">
                        <label for="step-4" class="step-circle color-emerald">
                            <div class="ripple r-1"></div>
                            <div class="ripple r-2"></div>
                            <div class="ripple r-3"></div>
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>
                            <span class="step-num">4</span>
                        </label>
                        <div class="step-content">
                            <h3>Start Services</h3>
                            <p>Initializing daemon processes.</p>
                        </div>
                    </div>

                </div>

            </div>
            
        </div>
    </div>

</body>
</html>
