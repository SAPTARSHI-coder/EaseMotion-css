<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neutral Atom Optical Tweezers - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css"></head><body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030712; color: #ffffff;">

    <div class="ease-card ease-card-glass atom-container">
        <div class="atom-header">
            <h2>Neutral Atom Tweezers</h2>
            <span class="ease-badge ease-badge-primary">Trapping</span>
        </div>
        
        <div class="atom-screen ease-center">
            <div class="atom-flux flux-atom-a"></div>
            <div class="atom-flux flux-atom-b"></div>
            <div class="atom-boundary-ring"></div>
            <div class="atom-core ease-center"></div>
        </div>

        <div class="atom-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Rydberg States &amp; AOD Arrays</span>
            <button class="ease-btn ease-btn-primary ease-btn-sm ease-hover-grow">Run Optical Tweezers</button>
        </div>
    </div></body></html>
