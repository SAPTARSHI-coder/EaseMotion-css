<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CSS Float-Drift Hero Section for Gaming Hub">
  <title>Float-Drift Gaming Hero</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="hero">
    <div class="hero-content">
      <p class="eyebrow">Gaming Hub</p>

      <h1>Enter the <span>Battle</span></h1>

      <p class="description">
        Discover exciting games, compete with players,
        and experience your next gaming adventure.
      </p>

      <div class="hero-actions">
        <a href="#" class="btn primary">Start Playing</a>
        <a href="#" class="btn secondary">Explore Games</a>
      </div>
    </div>

    <div class="hero-visual" aria-hidden="true">
      <div class="game-card main-card">
        <div class="card-icon">⚔</div>
        <h2>Epic Quest</h2>
        <p>Adventure awaits</p>
      </div>

      <div class="floating-card card-one">🎮</div>
      <div class="floating-card card-two">🏆</div>
      <div class="floating-card card-three">⭐</div>
    </div>
  </main>

</body>
</html>
