
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Slide-in Drawer</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="stage">
      <input type="checkbox" id="drawer-toggle" class="dt" hidden />
      <label for="drawer-toggle" class="open-btn">Menu</label>
      <aside class="drawer">
        <label for="drawer-toggle" class="close-btn">×</label>
        <nav>
          <a href="#">Dashboard</a>
          <a href="#">Projects</a>
          <a href="#">Settings</a>
        </nav>
      </aside>
    </main>
  </body>
</html>
