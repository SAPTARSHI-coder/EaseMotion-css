<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="A CSS-only animated sunflower with rotating petals."
  >
  <title>CSS Sunflower</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="scene">
    <section
      class="sunflower-card"
      aria-label="Animated CSS sunflower"
    >
      <div class="sunflower" aria-hidden="true">
        <div class="petals">
          <span class="petal p1"></span>
          <span class="petal p2"></span>
          <span class="petal p3"></span>
          <span class="petal p4"></span>
          <span class="petal p5"></span>
          <span class="petal p6"></span>
          <span class="petal p7"></span>
          <span class="petal p8"></span>
          <span class="petal p9"></span>
          <span class="petal p10"></span>
          <span class="petal p11"></span>
          <span class="petal p12"></span>
        </div>

        <div class="flower-center">
          <span></span>
        </div>

        <div class="stem"></div>

        <div class="leaf leaf-left"></div>
        <div class="leaf leaf-right"></div>
      </div>

      <div class="content">
        <span class="eyebrow">Pure CSS Animation</span>
        <h1>Sunflower</h1>
        <p>
          A cheerful sunflower created entirely with HTML and CSS,
          featuring gently rotating petals and swaying leaves.
        </p>
      </div>
    </section>
  </main>

</body>
</html>
