<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      Glowing Filter Bar Header Component with Brutalism Styling
      (ease-glowing-brutalist-filter-bar)
    </title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="demo-container">
      <header class="demo-header">
        <div class="header-badge">BRUTALIST HEADER UTILITY</div>
        <h1 class="demo-title">GLOWING BRUTALIST FILTER BAR</h1>
        <p class="demo-subtitle">
          Pure HTML + Vanilla CSS Filter Bar Header with Hard Offset Shadows
          &amp; Neon Glow Feedback
        </p>
      </header>

      <!-- Main Glowing Brutalist Filter Bar Header Component -->
      <header class="ease-glowing-brutalist-filter-bar" role="search">
        <div class="filter-bar-surface">
          <!-- Title / Brand Badge -->
          <div class="filter-brand-group">
            <span class="filter-brand-tag">FILTER MATRIX // SYS.01</span>
          </div>

          <!-- Form Controls Wrapper -->
          <form class="filter-controls-form" action="#" method="get">
            <!-- Search Input Group -->
            <div class="control-field search-field">
              <label for="brutal-search" class="sr-only">Search keywords</label>
              <div class="input-with-icon">
                <svg
                  class="search-icon"
                  viewBox="0 0 24 24"
                  width="18"
                  height="18"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2.5"
                  stroke-linecap="square"
                  stroke-linejoin="miter"
                  aria-hidden="true"
                >
                  <circle cx="11" cy="11" r="8" />
                  <line x1="21" y1="21" x2="16.65" y2="16.65" />
                </svg>
                <input
                  type="search"
                  id="brutal-search"
                  class="brutal-input"
                  placeholder="Search components..."
                  autocomplete="off"
                  spellcheck="false"
                />
              </div>
            </div>

            <!-- Category Select Group -->
            <div class="control-field select-field">
              <label for="brutal-category" class="control-label"
                >Category:</label
              >
              <select id="brutal-category" class="brutal-select">
                <option value="all">ALL CATEGORIES</option>
                <option value="components">COMPONENTS</option>
                <option value="animations">ANIMATIONS</option>
                <option value="utilities">UTILITIES</option>
              </select>
            </div>

            <!-- Sort Order Select Group -->
            <div class="control-field select-field">
              <label for="brutal-sort" class="control-label">Sort:</label>
              <select id="brutal-sort" class="brutal-select">
                <option value="newest">NEWEST FIRST</option>
                <option value="popular">MOST POPULAR</option>
                <option value="name">NAME (A-Z)</option>
              </select>
            </div>

            <!-- Action Buttons Group -->
            <div class="control-field actions-field">
              <button type="submit" class="brutal-btn btn-apply">
                <span>APPLY</span>
              </button>
              <button type="reset" class="brutal-btn btn-reset">
                <span>RESET</span>
              </button>
            </div>
          </form>
        </div>
      </header>

      <!-- Demo Keyboard Instructions Footer -->
      <footer class="demo-footer">
        <div class="keyboard-instruction">
          <span class="type-key">TAB</span> Focus form controls &bull;
          <span class="type-key">CYAN / MAGENTA GLOW</span> Interactive feedback
          &bull; <span class="type-key">REDUCED MOTION</span> Static glow states
        </div>
      </footer>
    </main>
  </body>
</html>
