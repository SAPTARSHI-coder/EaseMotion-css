<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cyberpunk Particle Network</title>

<link rel="stylesheet" href="style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">

</head>

<body>

<canvas id="network"></canvas>

<section class="hero">

<h1>CYBERPUNK GRID</h1>

<p>
Animated Particle Constellation Background
</p>

<button>Launch Interface</button>

</section>

<script>

const canvas=document.getElementById("network");
const ctx=canvas.getContext("2d");

function resize(){

canvas.width=innerWidth;
canvas.height=innerHeight;

}

resize();

window.addEventListener("resize",resize);

const particles=[];

for(let i=0;i<70;i++){

particles.push({

x:Math.random()*canvas.width,

y:Math.random()*canvas.height,

vx:(Math.random()-.5)*0.8,

vy:(Math.random()-.5)*0.8

});

}

function draw(){

ctx.clearRect(0,0,canvas.width,canvas.height);

particles.forEach(p=>{

p.x+=p.vx;
p.y+=p.vy;

if(p.x<0||p.x>canvas.width)p.vx*=-1;
if(p.y<0||p.y>canvas.height)p.vy*=-1;

ctx.beginPath();
ctx.arc(p.x,p.y,2.5,0,Math.PI*2);
ctx.fillStyle="#00f5ff";
ctx.fill();

});

for(let i=0;i<particles.length;i++){

for(let j=i+1;j<particles.length;j++){

const dx=particles[i].x-particles[j].x;
const dy=particles[i].y-particles[j].y;

const d=Math.sqrt(dx*dx+dy*dy);

if(d<130){

ctx.beginPath();

ctx.moveTo(particles[i].x,particles[i].y);

ctx.lineTo(particles[j].x,particles[j].y);

ctx.strokeStyle=`rgba(255,0,255,${1-d/130})`;

ctx.stroke();

}

}

}

requestAnimationFrame(draw);

}

draw();

</script>

</body>

</html>
