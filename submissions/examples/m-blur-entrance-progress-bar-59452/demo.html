<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blur Entrance Progress Bar</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<section class="dashboard">

<div class="header">

<span class="section-tag">
EaseMotion CSS
</span>

<h1>
Blur-Entrance Progress Bar
</h1>

<p>
A modern fintech dashboard progress component featuring smooth blur-entrance
animations, elegant glassmorphism styling, and responsive layouts built
entirely with HTML and CSS.
</p>

</div>

<div class="progress-panel">

<div class="progress-item">

<div class="label-row">
<span>Portfolio Growth</span>
<span>92%</span>
</div>

<div class="progress-bar">
<div class="progress-fill progress-1"></div>
</div>

</div>

<div class="progress-item">

<div class="label-row">
<span>Monthly Savings</span>
<span>74%</span>
</div>

<div class="progress-bar">
<div class="progress-fill progress-2"></div>
</div>

</div>

<div class="progress-item">

<div class="label-row">
<span>Investment Goal</span>
<span>58%</span>
</div>

<div class="progress-bar">
<div class="progress-fill progress-3"></div>
</div>

</div>

</div>

</section>

</body>
</html>
