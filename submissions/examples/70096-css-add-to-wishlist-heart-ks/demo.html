<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
        name="description"
        content="CSS-only Add to Wishlist Heart component"
    >
    <title>CSS Add to Wishlist Heart</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="page">
        <section class="wishlist-card" aria-labelledby="wishlist-title">

            <div class="product-preview">
                <div class="preview-glow"></div>

                <div class="product">
                    <div class="product-top"></div>

                    <div class="product-body">
                        <span class="product-label">ESSENTIAL</span>
                        <span class="product-name">PURE</span>
                    </div>

                    <div class="product-shadow"></div>
                </div>

                <div class="leaf leaf-left"></div>
                <div class="leaf leaf-right"></div>

                <div class="floating-dot dot-one"></div>
                <div class="floating-dot dot-two"></div>
                <div class="floating-dot dot-three"></div>
            </div>

            <div class="product-info">
                <p class="product-category">Featured Product</p>

                <h1 id="wishlist-title">Minimal Product</h1>

                <p class="product-description">
                    A simple product card with a CSS-only wishlist interaction.
                </p>

                <div class="wishlist-wrapper">
                    <input
                        type="checkbox"
                        id="wishlist"
                        class="wishlist-input"
                        aria-label="Add product to wishlist"
                    >

                    <label for="wishlist" class="wishlist-button">
                        <span class="heart" aria-hidden="true">♥</span>

                        <span class="wishlist-text">
                            <span class="add-text">Add to Wishlist</span>
                            <span class="added-text">Added to Wishlist</span>
                        </span>

                        <span class="particles" aria-hidden="true">
                            <span class="particle particle-1">♥</span>
                            <span class="particle particle-2">♥</span>
                            <span class="particle particle-3">♥</span>
                            <span class="particle particle-4">♥</span>
                        </span>
                    </label>
                </div>
            </div>

        </section>
    </main>

</body>
</html>
