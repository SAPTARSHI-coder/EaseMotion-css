<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ease-bouncy-toggle-group-sap demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f4f4f5;
    }
  </style>
</head>
<body>

  <div class="toggle-group-sap">
    <div class="toggle-sap" data-name="wifi"><div class="toggle-knob"></div></div>
    <div class="toggle-sap on" data-name="bluetooth"><div class="toggle-knob"></div></div>
    <div class="toggle-sap" data-name="location"><div class="toggle-knob"></div></div>
  </div>

  <script>
    document.querySelectorAll('.toggle-sap').forEach(toggle => {
      toggle.addEventListener('click', () => toggle.classList.toggle('on'));
    });
  </script>

</body>
</html>
