<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pulsing Radar/Sonar Demo</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            margin: 0;
            height: 100vh;
            background-color: #0f172a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .map-card {
            background-color: #1e293b;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        
        .map-card h2 {
            color: white;
            margin: 0;
            font-size: 1.2rem;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="map-card">
        <h2>Live Location</h2>
        <div class="ease-radar-container">
            <!-- The solid center dot -->
            <div class="ease-radar-dot"></div>
            
            <!-- The animated expanding rings -->
            <div class="ease-radar-ring"></div>
            <div class="ease-radar-ring"></div>
            <div class="ease-radar-ring"></div>
        </div>
    </div>
</body>
</html>
