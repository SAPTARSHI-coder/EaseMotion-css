<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-water-wheel-spin demo</title>
</head>
<body>
<div class="ww-mill">
  <div class="ww-head">
    <span class="ww-name">OLD MILL</span>
    <span class="ww-badge">FLUME</span>
  </div>
  <div class="ww-scene">
    <div class="ww-house"></div>
    <div class="ww-axle"></div>
    <div class="ww-wheel">
      <div class="ww-rim"></div>
      <div class="ww-paddle ww-p1"></div>
      <div class="ww-paddle ww-p2"></div>
      <div class="ww-paddle ww-p3"></div>
      <div class="ww-paddle ww-p4"></div>
      <div class="ww-paddle ww-p5"></div>
      <div class="ww-paddle ww-p6"></div>
    </div>
    <div class="ww-sluice">
      <div class="ww-stream"></div>
    </div>
    <div class="ww-bank"></div>
  </div>
  <div class="ww-output">GRIST 14 TON</div>
</div>
</body>
</html>
