<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CSS Matrix Code Text</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<main class="matrix-container">

    <div class="rain" aria-hidden="true">

        <span>01</span>
        <span>10</span>
        <span>010</span>
        <span>101</span>
        <span>110</span>
        <span>001</span>
        <span>111</span>

    </div>


    <h1 class="matrix-text">
        MATRIX
    </h1>


    <p>
        Pure CSS Character Rain Effect
    </p>


</main>


</body>

</html>
