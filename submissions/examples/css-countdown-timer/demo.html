<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Responsive CSS countdown timer displaying days, hours, minutes and seconds."
  >
  <title>CSS Countdown Timer</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="countdown-page">
    <section class="countdown-card" aria-labelledby="countdown-title">
      <p class="eyebrow">UPCOMING EVENT</p>

      <h1 id="countdown-title">Event Countdown</h1>

      <p class="countdown-description">
        Time remaining until the event begins
      </p>

      <div class="countdown" aria-label="Countdown timer">
        <div class="time-unit">
          <span class="time-value" aria-label="10 days">10</span>
          <span class="time-label">Days</span>
        </div>

        <span class="separator" aria-hidden="true">:</span>

        <div class="time-unit">
          <span class="time-value" aria-label="08 hours">08</span>
          <span class="time-label">Hours</span>
        </div>

        <span class="separator" aria-hidden="true">:</span>

        <div class="time-unit">
          <span class="time-value" aria-label="45 minutes">45</span>
          <span class="time-label">Minutes</span>
        </div>

        <span class="separator" aria-hidden="true">:</span>

        <div class="time-unit">
          <span class="time-value seconds" aria-label="30 seconds">30</span>
          <span class="time-label">Seconds</span>
        </div>
      </div>

      <p class="timer-note">
        CSS-only visual countdown component
      </p>
    </section>
  </main>
</body>
</html>
