<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EaseMotion — Date Time Picker</title>
  <link rel="stylesheet" href="../../core/variables.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="demo-container">
    <h1>Date Time Picker</h1>
    <p>Select a date and time with an intuitive picker UI.</p>

    <div class="picker-card">
      <div class="ease-field">
        <label class="ease-field-label">Select Date</label>
        <input type="date" class="ease-input" id="datePicker">
      </div>
      <div class="ease-field">
        <label class="ease-field-label">Select Time</label>
        <input type="time" class="ease-input" id="timePicker">
      </div>
      <div class="selected-datetime" id="output">No date/time selected</div>
    </div>
  </div>
  <script>
    const dateEl = document.getElementById('datePicker');
    const timeEl = document.getElementById('timePicker');
    const output = document.getElementById('output');
    function update() {
      if (dateEl.value && timeEl.value) {
        const d = new Date(dateEl.value + 'T' + timeEl.value);
        output.textContent = d.toLocaleString('en-US', {
          weekday: 'long', year: 'numeric', month: 'long', day: 'numeric',
          hour: '2-digit', minute: '2-digit'
        });
        output.style.color = 'var(--ease-color-text, #1e293b)';
      }
    }
    dateEl.addEventListener('change', update);
    timeEl.addEventListener('change', update);
  </script>
</body>
</html>
