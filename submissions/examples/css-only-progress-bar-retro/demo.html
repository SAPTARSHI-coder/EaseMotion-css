<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retro CSS Progress Bar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="wrapper">

  <h1>Loading...</h1>

  <div
    class="progress"
    role="progressbar"
    aria-label="Loading Progress"
    aria-valuemin="0"
    aria-valuemax="100"
    aria-valuenow="75">

    <div class="fill"></div>

  </div>

  <span>75%</span>

</div>

</body>
</html>
