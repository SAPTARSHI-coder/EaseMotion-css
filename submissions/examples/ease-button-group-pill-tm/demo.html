<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Button Group Pill | EaseMotion CSS</title><link rel="stylesheet" href="style.css"></head>
<body><div class="bgp-root">
<div class="bgp-card">
<p class="bgp-title">View Options</p>
<div class="bgp-group"><button class="bgp-btn active" type="button">Day</button><button class="bgp-btn" type="button">Week</button><button class="bgp-btn" type="button">Month</button><button class="bgp-btn" type="button">Year</button></div>
<div class="bgp-row">
<p class="bgp-title" style="margin-top:.5rem">Sort By</p>
<div class="bgp-stack"><button class="bgp-btn active" type="button">Relevance</button><button class="bgp-btn" type="button">Date</button><button class="bgp-btn" type="button">Popularity</button></div>
</div>
</div>
<p class="bgp-sub">Pure CSS button groups in horizontal and vertical layouts</p>
</div></body></html>
