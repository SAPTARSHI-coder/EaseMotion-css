<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Collapsible Tree View</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <h1>Collapsible Tree View</h1>

    <ul class="tree" role="tree">
      <li role="treeitem" aria-expanded="true">
        <button class="tree-toggle">
          <span class="tree-arrow">▶</span> src
        </button>
        <ul class="tree-children" role="group">
          <li role="treeitem" aria-expanded="false">
            <button class="tree-toggle">
              <span class="tree-arrow">▶</span> components
            </button>
            <ul class="tree-children" role="group" hidden>
              <li role="treeitem" class="tree-leaf">Button.jsx</li>
              <li role="treeitem" class="tree-leaf">Card.jsx</li>
            </ul>
          </li>
          <li role="treeitem" class="tree-leaf">index.js</li>
          <li role="treeitem" class="tree-leaf">App.jsx</li>
        </ul>
      </li>
      <li role="treeitem" class="tree-leaf">package.json</li>
      <li role="treeitem" class="tree-leaf">README.md</li>
    </ul>
  </main>

  <script>
    document.querySelectorAll('.tree-toggle').forEach(btn => {
      btn.addEventListener('click', () => {
        const item = btn.closest('[role="treeitem"]');
        const group = item.querySelector(':scope > .tree-children');
        const expanded = item.getAttribute('aria-expanded') === 'true';
        item.setAttribute('aria-expanded', String(!expanded));
        if (expanded) {
          group.hidden = true;
        } else {
          group.hidden = false;
        }
      });
    });
  </script>
</body>
</html>
