<!-- EaseMotion component: stopwatch-lap-split -->
<!DOCTYPE html>
<html lang="en" data-stop="lap">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
<title>Ease Stopwatch Lap Split</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="lap-stopwatch">
  <header class="stop-head">
    <span class="stop-brand">CHRONO 5</span>
    <span class="stop-mode">LAP SPLIT</span>
  </header>
  <div class="stop-dial">
    <span class="dial-face"></span>
    <span class="dial-hand"></span>
    <span class="dial-ticks"></span>
    <span class="dial-center"></span>
    <span class="dial-readout">12:34.8</span>
  </div>
  <div class="stop-buttons">
    <button class="stop-btn btn-split">SPLIT</button>
    <button class="stop-btn btn-start">START</button>
    <button class="stop-btn btn-reset">RESET</button>
  </div>
  <ol class="lap-list">
    <li class="lap-row"><span class="lap-num">LAP 3</span><span class="lap-time">12:34.8</span></li>
    <li class="lap-row lap-fast"><span class="lap-num">LAP 2</span><span class="lap-time">12:22.1</span></li>
    <li class="lap-row"><span class="lap-num">LAP 1</span><span class="lap-time">12:40.5</span></li>
  </ol>
  <footer class="stop-foot">
    <span class="stop-total">TOTAL 37:37.4</span>
  </footer>
</main>
</body>
</html>
