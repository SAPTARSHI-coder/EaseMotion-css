<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glide Tooltip Mixin - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="tooltip-container">
    <h1>Glide Tooltip Mixin (<code>#54701</code>)</h1>
    <p class="subtitle">Smooth directional slide-in hover titles featuring zero-flicker pointer boundaries.</p>
    
    <div class="row">
      <div class="ease-tooltip-holder">
        <span class="target-chip top">Hover Top Tooltip ▲</span>
        <div class="ease-tooltip glide-top">Verified Open Source Contributor</div>
      </div>
      
      <div class="ease-tooltip-holder">
        <span class="target-chip bottom">Hover Bottom Tooltip ▼</span>
        <div class="ease-tooltip glide-bottom">GSSoC 2026 Batch 2 Deployment</div>
      </div>
    </div>
  </div>
</body>
</html>
