<!DOCTYPE html>

<head>

  <title>Swirl Select Component - EaseMotion CSS</title>

</head>
<body>

    <h1>Swirl Select Component (<code>#54695</code>)</h1>

      <div class="ease-select-swirl">

          <option>✨ Pure CSS Houdini (Recommended)</option>
          <option>🚀 Web Animations API (WAAPI)</option>

          <option>⚙️ GPU Composited Transforms</option>
        </select>

      </div>
    </div>
  </div>
</body>
