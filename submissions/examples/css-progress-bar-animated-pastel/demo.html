<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pastel Animated Progress Bar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="pa-container">
        <h3 class="pa-title">Uploading Resources...</h3>
        <div class="pa-progress-wrap">
            <div class="pa-progress-bar">
                <div class="pa-progress-fill"></div>
            </div>
            <span class="pa-percentage">75%</span>
        </div>
        <p class="pa-status">3 of 4 files uploaded successfully.</p>
    </div>
</body>
</html>
