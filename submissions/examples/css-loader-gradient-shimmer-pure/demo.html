<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Loader: Gradient Shimmer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="layout-container">
        
        <header class="section-header">
            <h1 class="title">Pure CSS Loader: Gradient Shimmer</h1>
            <p class="subtitle">A skeleton-style loader utilizing an oversized, animated background gradient to simulate a reflective light sweeping across the element.</p>
        </header>

        <div class="demo-area">
            
            <div class="loader-container" aria-label="Loading content, gradient shimmer animation playing">
                
                <!-- 
                  [TECHNIQUE] Gradient Shimmer
                  We construct a mock UI card (skeleton loader).
                  The shimmering effect is achieved by animating the background-position
                  of a linear-gradient that is 200% wider than the element itself.
                -->
                <div class="skeleton-card" aria-hidden="true">
                    
                    <div class="skeleton-header">
                        <div class="skeleton-avatar shimmer"></div>
                        <div class="skeleton-text-group">
                            <div class="skeleton-line title shimmer"></div>
                            <div class="skeleton-line subtitle shimmer"></div>
                        </div>
                    </div>
                    
                    <div class="skeleton-body">
                        <div class="skeleton-line shimmer w-100"></div>
                        <div class="skeleton-line shimmer w-100"></div>
                        <div class="skeleton-line shimmer w-80"></div>
                        <div class="skeleton-line shimmer w-60"></div>
                    </div>
                    
                </div>
                
                <div class="loading-text">Fetching Data...</div>
                
            </div>
            
        </div>
        
    </div>

</body>
</html>
