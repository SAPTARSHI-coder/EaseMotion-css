<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Chasing Arrow Loader - EaseMotion</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div
      class="cal"
      aria-label="Chasing arrow loader"
      role="progressbar"
      aria-label="Loading"
    >
      <span class="cal-arrow cal-a1" aria-hidden="true">&rarr;</span>
      <span class="cal-arrow cal-a2" aria-hidden="true">&rarr;</span>
    </div>
  </body>
</html>
