<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Pure CSS animated burger to arrow button">
  <title>CSS Burger to Arrow</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="demo">
    <h1>CSS Burger to Arrow</h1>
    <p>Click the button to transform the hamburger icon into a back arrow.</p>

    <div class="demo-card">
      <input
        type="checkbox"
        id="menu-toggle"
        class="menu-toggle"
        aria-label="Toggle navigation menu"
      >

      <label for="menu-toggle" class="burger" aria-label="Toggle navigation">
        <span></span>
        <span></span>
        <span></span>
      </label>

      <p class="status">
        <span class="closed-text">Menu closed</span>
        <span class="open-text">Back</span>
      </p>
    </div>
  </main>
</body>
</html>
