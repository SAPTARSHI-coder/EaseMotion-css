<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Toast Stack</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<main class="toast-demo"><section class="copy"><p>Notifications</p><h1>Stack messages without visual clutter.</h1></section><section class="toast-stack" aria-label="Notification examples"><div class="toast success"><strong>Saved</strong><span>Your settings are updated.</span></div><div class="toast info"><strong>Syncing</strong><span>New records are being imported.</span></div><div class="toast error"><strong>Review needed</strong><span>Two fields need attention.</span></div></section></main>
</body>
</html>
