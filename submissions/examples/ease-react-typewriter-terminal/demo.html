<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EaseTypewriterTerminal Interactive Component</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const EaseTypewriterTerminal = () => {
      const [currentLineIndex, setCurrentLineIndex] = useState(0);
      const [copied, setCopied] = useState(false);

      const lines = [
        { type: 'cmd', text: 'npm install easemotion-css' },
        { type: 'out', text: 'Fetching packages...' },
        { type: 'out', text: 'Added 1 package in 2s' },
        { type: 'cmd', text: 'easemotion init --force' }
      ];

      useEffect(() => {
        if (currentLineIndex < lines.length) {
          const currentLine = lines[currentLineIndex];
          const delay = currentLine.type === 'cmd' ? 2000 : 800;
          const timer = setTimeout(() => {
            setCurrentLineIndex(prev => prev + 1);
          }, delay);
          return () => clearTimeout(timer);
        }
      }, [currentLineIndex]);

      const handleCopy = () => {
        const commandText = lines
          .filter(line => line.type === 'cmd')
          .map(line => line.text)
          .join('\n');
        
        navigator.clipboard.writeText(commandText).then(() => {
          setCopied(true);
          setTimeout(() => setCopied(false), 2000);
        }).catch(err => {
          console.error('Failed to copy text: ', err);
        });
      };

      return (
        <div className="ease-terminal-wrapper">
          <div className="ease-terminal-header">
            <div className="ease-mac-buttons">
              <div className="ease-mac-btn close"></div>
              <div className="ease-mac-btn minimize"></div>
              <div className="ease-mac-btn maximize"></div>
            </div>
            <button className="ease-copy-btn" onClick={handleCopy}>
              {copied ? 'Copied!' : 'Copy Code'}
            </button>
          </div>

          <div className="ease-terminal-body">
            {lines.slice(0, currentLineIndex + 1).map((line, index) => {
              const isCompleted = index < currentLineIndex;
              const isActive = index === currentLineIndex;
              const statusClass = isCompleted ? 'completed' : isActive ? 'active' : '';

              return (
                <div key={index} className={`ease-typewriter-line ${statusClass}`}>
                  {line.type === 'cmd' && <span className="ease-prefix">$</span>}
                  <span className={line.type === 'out' ? 'ease-output' : ''}>
                    {line.text}
                  </span>
                </div>
              );
            })}
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<EaseTypewriterTerminal />);
  </script>
</body>
</html>
