<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EaseMotion Sound & Haptic Hook</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="demo-container">
        <button class="ease-btn" data-ease-sound="pop">Pop Button</button>
        <button class="ease-btn" data-ease-sound="click">Click Button</button>
        <button class="ease-btn" data-ease-sound="tap">Tap Button</button>
        <button class="ease-btn" data-ease-sound="success">Success Chime</button>
        <button class="ease-btn" data-ease-sound="toggle-on">Toggle On</button>
        <button class="ease-btn" data-ease-sound="toggle-off">Toggle Off</button>
        
        <div class="hover-zone" data-ease-sound-hover>
            Hover over this zone for micro-tick sounds
        </div>
    </div>

    <script>
        class EaseMotionSound {
            constructor() {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) {
                    console.warn("Web Audio API not supported in this browser.");
                    return;
                }
                this.ctx = new AudioCtx();
                this.initEventListeners();
            }

            resume() {
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            vibrate(pattern) {
                if (typeof navigator !== 'undefined' && navigator.vibrate) {
                    navigator.vibrate(pattern);
                }
            }

            pop() {
                if (!this.ctx) return;
                this.resume();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                const now = this.ctx.currentTime;
                osc.frequency.setValueAtTime(800, now);
                osc.frequency.exponentialRampToValueAtTime(100, now + 0.1);
                gain.gain.setValueAtTime(0.5, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
                this.vibrate(10);
            }

            click() {
                this.resume();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'square';
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                const now = this.ctx.currentTime;
                osc.frequency.setValueAtTime(150, now);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.03);
                osc.start(now);
                osc.stop(now + 0.03);
                this.vibrate(5);
            }

            tap() {
                this.resume();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                const now = this.ctx.currentTime;
                osc.frequency.setValueAtTime(120, now);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
                this.vibrate(15);
            }

            toggleOn() {
                this.resume();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                const now = this.ctx.currentTime;
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.setValueAtTime(800, now + 0.05);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
                osc.start(now);
                osc.stop(now + 0.15);
                this.vibrate([10, 30, 10]);
            }

            toggleOff() {
                this.resume();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                const now = this.ctx.currentTime;
                osc.frequency.setValueAtTime(800, now);
                osc.frequency.setValueAtTime(400, now + 0.05);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
                osc.start(now);
                osc.stop(now + 0.15);
                this.vibrate([10, 30, 10]);
            }

            success() {
                this.resume();
                const now = this.ctx.currentTime;
                
                const osc1 = this.ctx.createOscillator();
                const gain1 = this.ctx.createGain();
                osc1.type = 'sine';
                osc1.frequency.value = 523.25;
                osc1.connect(gain1);
                gain1.connect(this.ctx.destination);
                
                const osc2 = this.ctx.createOscillator();
                const gain2 = this.ctx.createGain();
                osc2.type = 'sine';
                osc2.frequency.value = 659.25;
                osc2.connect(gain2);
                gain2.connect(this.ctx.destination);

                gain1.gain.setValueAtTime(0.2, now);
                gain1.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                
                gain2.gain.setValueAtTime(0.2, now + 0.1);
                gain2.gain.exponentialRampToValueAtTime(0.01, now + 0.5);

                osc1.start(now);
                osc1.stop(now + 0.4);
                osc2.start(now + 0.1);
                osc2.stop(now + 0.5);

                this.vibrate([20, 50, 30]);
            }

            hover() {
                this.resume();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'square';
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                const now = this.ctx.currentTime;
                osc.frequency.setValueAtTime(800, now);
                gain.gain.setValueAtTime(0.02, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.02);
                osc.start(now);
                osc.stop(now + 0.02);
            }

            initEventListeners() {
                document.addEventListener('click', (e) => {
                    const el = e.target.closest('[data-ease-sound]');
                    if (el) {
                        const soundType = el.getAttribute('data-ease-sound');
                        switch (soundType) {
                            case 'pop': this.pop(); break;
                            case 'click': this.click(); break;
                            case 'tap': this.tap(); break;
                            case 'toggle-on': this.toggleOn(); break;
                            case 'toggle-off': this.toggleOff(); break;
                            case 'success': this.success(); break;
                        }
                    }
                });

                document.addEventListener('mouseover', (e) => {
                    const el = e.target.closest('[data-ease-sound-hover]');
                    if (el && el !== this._lastHoverEl) {
                        this.hover();
                        this._lastHoverEl = el;
                    }
                });

                document.addEventListener('mouseout', (e) => {
                    const el = e.target.closest('[data-ease-sound-hover]');
                    if (el) {
                        this._lastHoverEl = null;
                    }
                });
            }
        }

        let initialized = false;
        const initEaseMotionSound = () => {
            if (!initialized) {
                window.easeSound = new EaseMotionSound();
                initialized = true;
                ['click', 'touchstart', 'keydown'].forEach(evt => 
                    document.removeEventListener(evt, initEaseMotionSound)
                );
            }
        };
        
        ['click', 'touchstart', 'keydown'].forEach(evt => 
            document.addEventListener(evt, initEaseMotionSound)
        );
    </script>
</body>
</html>
