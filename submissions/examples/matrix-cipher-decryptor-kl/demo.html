<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrix Cipher Decryptor - EaseMotion CSS</title>
    <!-- Include EaseMotion Core Stylesheet -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #020907; color: #ffffff;">

    <div class="ease-card ease-card-glass cipher-container">
        <div class="cipher-header">
            <h2>Cipher Decryptor</h2>
            <span class="ease-badge ease-badge-success">Decrypted</span>
        </div>
        
        <div class="cipher-screen ease-center">
            <div class="cipher-ring ring-outer"></div>
            <div class="cipher-ring ring-inner"></div>
            <div class="cipher-core ease-center">KEY</div>
        </div>

        <div class="cipher-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Status: Secure</span>
            <button class="ease-btn ease-btn-primary ease-btn-sm ease-hover-grow">Re-encrypt</button>
        </div>
    </div>

</body>
</html>
