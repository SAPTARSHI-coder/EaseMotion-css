<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anvil Hammer Strike — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Anvil Hammer Strike demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Anvil Hammer Strike</h1>
      <p class="lede">Blacksmith hammer striking an anvil with spark burst</p>
    </header>

    <section class="ease-anvil-hammer-strike" data-demo="anvil-hammer-strike" aria-live="polite">
      <div class="ease-anvil-hammer-strike__housing">
        <div class="ease-anvil-hammer-strike__bezel">
          <div class="ease-anvil-hammer-strike__face">
            <div class="ease-anvil-hammer-strike__readout">
              <span class="ease-anvil-hammer-strike__label">Anvil Hammer Strike</span>
              <span class="ease-anvil-hammer-strike__value">LIVE</span>
            </div>
            <div class="ease-anvil-hammer-strike__motion" aria-hidden="true">
              <span class="ease-anvil-hammer-strike__a"></span>
              <span class="ease-anvil-hammer-strike__b"></span>
              <span class="ease-anvil-hammer-strike__c"></span>
              <span class="ease-anvil-hammer-strike__d"></span>
            </div>
            <div class="ease-anvil-hammer-strike__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-anvil-hammer-strike__controls">
          <button type="button" class="ease-anvil-hammer-strike__btn primary">Engage</button>
          <button type="button" class="ease-anvil-hammer-strike__btn">Reset</button>
          <label class="ease-anvil-hammer-strike__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-anvil-hammer-strike__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
