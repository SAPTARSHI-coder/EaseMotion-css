<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hologram Button · Iridescent Rainbow Shimmer</title>

    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <div class="card">
        <h2>🌈 Hologram Button</h2>
        <p class="sub">iridescent rainbow shimmer moves across surface</p>

        <!-- === HOLOGRAM BUTTON === -->
        <button class="hologram-btn" id="hologramBtn">
            <span class="hologram-content">
                <i class="fas fa-gem"></i>
                <span>Hologram</span>
            </span>
            <span class="hologram-shimmer"></span>
            <span class="hologram-shimmer shimmer-2"></span>
            <span class="hologram-glow"></span>
        </button>

        <p style="margin-top: 2rem; font-size: 0.85rem; color: #64748b;">
            Hover · watch the iridescent rainbow shimmer
        </p>
    </div>

    <!-- Embedded JavaScript -->
    <script>
        (function() {
            'use strict';

            const button = document.getElementById('hologramBtn');

            // Click feedback
            button.addEventListener('click', function(e) {
                this.classList.add('click-pulse');
                setTimeout(() => {
                    this.classList.remove('click-pulse');
                }, 300);
                console.log('🌈 Hologram button clicked!');
            });

            // Keyboard accessibility
            button.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    this.click();
                }
            });

            // Reset shimmer animation on hover
            button.addEventListener('mouseenter', function() {
                const shimmers = this.querySelectorAll('.hologram-shimmer');
                shimmers.forEach(shimmer => {
                    shimmer.style.animation = 'none';
                    void shimmer.offsetWidth;
                    shimmer.style.animation = '';
                });
            });

            console.log('🌈 Hologram button initialized!');

        })();
    </script>

</body>
</html>
