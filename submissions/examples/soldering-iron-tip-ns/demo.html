<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Soldering Iron Tip — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Soldering Iron Tip demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Soldering Iron Tip</h1>
      <p class="lede">Soldering iron tip heating with flux smoke and solder bead</p>
    </header>

    <section class="ease-soldering-iron-tip" data-demo="soldering-iron-tip" aria-live="polite">
      <div class="ease-soldering-iron-tip__housing">
        <div class="ease-soldering-iron-tip__bezel">
          <div class="ease-soldering-iron-tip__face">
            <div class="ease-soldering-iron-tip__readout">
              <span class="ease-soldering-iron-tip__label">Soldering Iron Tip</span>
              <span class="ease-soldering-iron-tip__value" id="val-soldering-iron-tip">READY</span>
            </div>
            <div class="ease-soldering-iron-tip__motion" aria-hidden="true">
              <span class="ease-soldering-iron-tip__arm"></span>
              <span class="ease-soldering-iron-tip__core"></span>
              <span class="ease-soldering-iron-tip__trail"></span>
              <span class="ease-soldering-iron-tip__mark m1"></span>
              <span class="ease-soldering-iron-tip__mark m2"></span>
              <span class="ease-soldering-iron-tip__mark m3"></span>
            </div>
            <div class="ease-soldering-iron-tip__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-soldering-iron-tip__controls">
          <button type="button" class="ease-soldering-iron-tip__btn primary">Engage</button>
          <button type="button" class="ease-soldering-iron-tip__btn">Reset</button>
          <label class="ease-soldering-iron-tip__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-soldering-iron-tip__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
