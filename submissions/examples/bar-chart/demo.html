<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bar Chart &mdash; EaseMotion CSS Demo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="page-head">
    <p class="kicker">EaseMotion CSS &middot; Data</p>
    <h1>Bar Chart</h1>
    <p class="sub">Columns rise in sequence — hover any bar for its exact value.</p>
  </header>
  <main class="stage">
    <div class="br-chart" role="img" aria-label="Bar chart of weekly activity">
      <div class="br-col"><div class="br-bar" data-v="42" style="height:42%;"></div><span class="br-label">Mon</span></div>
      <div class="br-col"><div class="br-bar" data-v="67" style="height:67%;"></div><span class="br-label">Tue</span></div>
      <div class="br-col"><div class="br-bar" data-v="53" style="height:53%;"></div><span class="br-label">Wed</span></div>
      <div class="br-col"><div class="br-bar" data-v="88" style="height:88%;"></div><span class="br-label">Thu</span></div>
      <div class="br-col"><div class="br-bar" data-v="74" style="height:74%;"></div><span class="br-label">Fri</span></div>
    </div>
  </main>
  <p class="stage-note">Height is inline data; the grow animation is pure CSS.</p>
  <footer class="page-foot">
    <span>Pure CSS &middot; zero dependencies</span>
  </footer>
</body>
</html>
