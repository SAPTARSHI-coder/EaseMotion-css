<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drag File Preview</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <h1>Drag File Preview</h1>

    <label class="dropzone" id="dropzone" for="fileInput">
      <span class="dz-icon">📁</span>
      <span class="dz-text">Drag & drop files here, or click to browse</span>
      <input type="file" id="fileInput" multiple hidden>
    </label>

    <ul class="preview-list" id="previewList" aria-live="polite"></ul>
  </main>

  <script>
    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('fileInput');
    const list = document.getElementById('previewList');

    function addPreview(file) {
      const li = document.createElement('li');
      li.className = 'preview-item';
      const isImage = file.type.startsWith('image/');
      li.innerHTML = `
        <span class="pi-thumb">${isImage ? '' : '📄'}</span>
        <span class="pi-name">${file.name}</span>
      `;
      if (isImage) {
        const reader = new FileReader();
        reader.onload = e => {
          li.querySelector('.pi-thumb').style.backgroundImage = `url(${e.target.result})`;
        };
        reader.readAsDataURL(file);
      }
      list.appendChild(li);
      requestAnimationFrame(() => li.classList.add('is-in'));
    }

    function handleFiles(files) {
      Array.from(files).forEach(addPreview);
    }

    fileInput.addEventListener('change', () => handleFiles(fileInput.files));

    ['dragenter', 'dragover'].forEach(evt => {
      dropzone.addEventListener(evt, (e) => {
        e.preventDefault();
        dropzone.classList.add('is-dragover');
      });
    });

    ['dragleave', 'drop'].forEach(evt => {
      dropzone.addEventListener(evt, (e) => {
        e.preventDefault();
        dropzone.classList.remove('is-dragover');
      });
    });

    dropzone.addEventListener('drop', (e) => {
      handleFiles(e.dataTransfer.files);
    });
  </script>
</body>
</html>
