<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>News Ticker Board | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="ntstage">
    <div class="ntboard">
      <span class="ntlabel">BREAKING</span>
      <div class="ntviewport">
        <div class="nttrack">
          <span class="ntitem">Markets surge as central bank signals rate cut</span>
          <span class="ntitem">Tech giants report record quarterly earnings</span>
          <span class="ntitem">Climate summit reaches historic agreement</span>
          <span class="ntitem">Space mission successfully launches new satellite</span>
          <span class="ntitem">Olympic committee unveils host city for 2036</span>
        </div>
      </div>
      <div class="nttime">
        <span>LIVE FEED</span>
        <span>UPDATED 14:32 IST</span>
      </div>
    </div>
  </div>
</body>
</html>
