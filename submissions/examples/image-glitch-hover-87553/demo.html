<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Glitch Hover #87553 Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="showcase-container">
    <div 
      class="glitch-frame" 
      id="glitchTarget"
      style="--img-src: url('https://images.unsplash.com/photo-1508739773434-c26b3d09e071?auto=format&fit=crop&w=1000&q=80');"
    >
      <img 
        src="https://images.unsplash.com/photo-1508739773434-c26b3d09e071?auto=format&fit=crop&w=1000&q=80" 
        alt="Atmospheric Landscape" 
        class="glitch-img"
      >
    </div>

    <div class="glitch-caption">
      <span class="glitch-tag">Cyberpunk Glitch Engine</span>
      <span>Hover or touch image to trigger</span>
    </div>
  </div>

  <script>
    const frame = document.getElementById('glitchTarget');
    frame.addEventListener('click', () => {
      frame.classList.toggle('active');
    });
  </script>
</body>
</html>
