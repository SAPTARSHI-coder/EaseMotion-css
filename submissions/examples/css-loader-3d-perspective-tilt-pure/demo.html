<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Loader: 3D Perspective Tilt</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="layout-container">
        
        <header class="section-header">
            <h1 class="title">Pure CSS Loader: 3D Perspective Tilt</h1>
            <p class="subtitle">A hardware-accelerated loader utilizing CSS 3D transforms, nested perspectives, and multi-axis rotations to create a floating geometric effect.</p>
        </header>

        <div class="demo-area">
            
            <div class="loader-container" aria-label="Loading content, 3D rotating geometry animation playing">
                
                <!-- 
                  [TECHNIQUE] The 3D Scene
                  The container establishes the 3D perspective viewport.
                  Child elements must use transform-style: preserve-3d to 
                  maintain the illusion.
                -->
                <div class="perspective-scene" aria-hidden="true">
                    
                    <div class="cube-wrapper">
                        <!-- 
                          We use nested squares that rotate on the X, Y, and Z axis.
                          Their overlapping borders create the complex geometry.
                        -->
                        <div class="shape shape-1"></div>
                        <div class="shape shape-2"></div>
                        <div class="shape shape-3"></div>
                    </div>
                    
                </div>
                
                <div class="loading-text">Rendering Space...</div>
                
            </div>
            
        </div>
        
    </div>

</body>
</html>
