<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-gas-pump-terminal</title>
</head>
<body>
<main class="gpt-pump">
  <header class="gpt-top">
    <h1 class="gpt-brand">FuelMax</h1>
    <span class="gpt-pid">Pump 07</span>
  </header>
  <section class="gpt-screen" aria-label="price screen">
    <span class="gpt-line">Gallons</span>
    <strong class="gpt-gal">5.248</strong>
    <span class="gpt-line">Total</span>
    <strong class="gpt-total">$18.42</strong>
  </section>
  <section class="gpt-grades" aria-label="fuel grades">
    <button class="gpt-grade">Regular</button>
    <button class="gpt-grade">Plus</button>
    <button class="gpt-grade">Premium</button>
  </section>
  <section class="gpt-pay" aria-label="payment options">
    <button class="gpt-card">Card</button>
    <button class="gpt-cash">Cash</button>
  </section>
  <footer class="gpt-foot">
    <span class="gpt-nozzle"></span>
    <span class="gpt-hint">Lift handle</span>
  </footer>
</main>
</body>
</html>
