<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surface Code Error Correction - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css"></head><body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030712; color: #ffffff;">

    <div class="ease-card ease-card-glass surface-container">
        <div class="surface-header">
            <h2>Surface Code Error Correction</h2>
            <span class="ease-badge ease-badge-secondary">Fault-Tolerant QC</span>
        </div>
        
        <div class="surface-screen ease-center">
            <div class="surface-flux flux-surface-a"></div>
            <div class="surface-flux flux-surface-b"></div>
            <div class="surface-boundary-ring"></div>
            <div class="surface-core ease-center"></div>
        </div>

        <div class="surface-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Stabilizer Measurements &amp; Syndrome Decoding</span>
            <button class="ease-btn ease-btn-secondary ease-btn-sm ease-hover-grow">Run Syndrome Check</button>
        </div>
    </div></body></html>
