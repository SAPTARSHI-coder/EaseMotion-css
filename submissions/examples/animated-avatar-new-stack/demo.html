
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ease-avatar-stack Demo</title>
<link rel="stylesheet" href="style.css">
<style>
  body { font-family: system-ui, sans-serif; background: #0f172a; color: #f1f5f9; display: flex; flex-direction: column; align-items: center; gap: 24px; padding: 80px; }
</style>
</head>
<body>
  <h1>ease-avatar-stack</h1>

  <div class="avatar-stack">
    <img class="avatar-stack-item" src="https://i.pravatar.cc/80?img=1" alt="User 1">
    <img class="avatar-stack-item" src="https://i.pravatar.cc/80?img=2" alt="User 2">
    <img class="avatar-stack-item" src="https://i.pravatar.cc/80?img=3" alt="User 3">
    <img class="avatar-stack-item" src="https://i.pravatar.cc/80?img=4" alt="User 4">
    <span class="avatar-stack-item avatar-stack-more">+5</span>
  </div>
</body>
</html>
