<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Floating Card - Dark Mode</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <input type="checkbox" id="dark-mode" class="theme-toggle">

  <main class="page">

    <header class="header">
      <div>
        <span class="label">EASEMOTION CSS</span>
        <h1>Floating Card</h1>
      </div>

      <label for="dark-mode" class="theme-button">
        <span>☾</span>
        <span>Dark Mode</span>
      </label>
    </header>

    <section class="showcase">

      <article class="floating-card">

        <div class="glow"></div>

        <div class="card-header">
          <span class="badge">
            <span class="dot"></span>
            Active
          </span>

          <span class="menu">•••</span>
        </div>

        <div class="icon">✦</div>

        <h2>Design with motion.</h2>

        <p>
          A responsive floating card with smooth hover movement,
          subtle depth and CSS-only dark mode.
        </p>

        <div class="stats">
          <div class="stat">
            <strong>98%</strong>
            <span>Performance</span>
          </div>

          <div class="stat">
            <strong>24K</strong>
            <span>Users</span>
          </div>

          <div class="stat">
            <strong>4.9</strong>
            <span>Rating</span>
          </div>
        </div>

        <button class="card-button">
          Explore
          <span>→</span>
        </button>

      </article>

    </section>

    <footer>
      Pure HTML & CSS · No JavaScript
    </footer>

  </main>

</body>
</html>
