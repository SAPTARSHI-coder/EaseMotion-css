<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CSS Checkout Step Flow">
  <title>CSS Checkout Step Flow</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="checkout">
    <header class="checkout-header">
      <h1>Checkout</h1>
      <p>Complete the following steps to place your order.</p>
    </header>

    <nav class="steps" aria-label="Checkout progress">
      <ol>
        <li class="step active" aria-current="step">
          <span class="step-number">1</span>
          <span class="step-label">Cart</span>
        </li>

        <li class="step active">
          <span class="step-number">2</span>
          <span class="step-label">Shipping</span>
        </li>

        <li class="step">
          <span class="step-number">3</span>
          <span class="step-label">Payment</span>
        </li>

        <li class="step">
          <span class="step-number">4</span>
          <span class="step-label">Confirmation</span>
        </li>
      </ol>
    </nav>

    <section class="checkout-card" aria-labelledby="shipping-title">
      <span class="section-number">Step 2</span>
      <h2 id="shipping-title">Shipping Information</h2>
      <p>Enter your delivery information to continue.</p>

      <div class="form-grid">
        <label>
          Full Name
          <input type="text" name="name" autocomplete="name">
        </label>

        <label>
          Email
          <input type="email" name="email" autocomplete="email">
        </label>

        <label class="full-width">
          Address
          <input type="text" name="address" autocomplete="street-address">
        </label>

        <label>
          City
          <input type="text" name="city" autocomplete="address-level2">
        </label>

        <label>
          Postal Code
          <input type="text" name="postal-code" autocomplete="postal-code">
        </label>
      </div>

      <div class="actions">
        <button type="button" class="secondary">Back</button>
        <button type="button" class="primary">Continue</button>
      </div>
    </section>
  </main>
</body>
</html>
