<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pastel Floating Label Input - EaseMotion CSS</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="pastel-input-container">
      <header class="pastel-header">
        <h1 class="pastel-title">Pastel Floating Input</h1>
        <p class="pastel-subtitle">
          Issue #81516 / #61938 — Soft Micro-Interaction Styling
        </p>
      </header>

      <div class="pastel-field">
        <input
          type="text"
          id="full-name"
          class="pastel-input"
          placeholder=" "
          autocomplete="off"
        />
        <label for="full-name" class="pastel-label">Full Name</label>
      </div>

      <div class="pastel-field">
        <input
          type="email"
          id="email-address"
          class="pastel-input"
          placeholder=" "
          autocomplete="off"
        />
        <label for="email-address" class="pastel-label">Email Address</label>
      </div>
    </main>
  </body>
</html>
