<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scale-Hover Accessible Badge - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="stage">
    <header class="head">
      <h1>Scale-Hover Accessible Badges (<code>#54317</code>)</h1>
      <p>A tactile collection of accessible high-contrast indicator pills that elevate cleanly upon interaction using zero-reflow spring transform scaling.</p>
    </header>
    
    <section class="ease-badges-scale-hover" aria-label="Feature Badges">
      <span class="badge-sc emerald-sc" role="status" aria-label="Success Spec">
        <strong>✓ 144 Merges</strong><span>Verified CI</span>
      </span>
      
      <span class="badge-sc blue-sc" role="status" aria-label="Performance Spec">
        <strong>⚡ 60.0 FPS</strong><span>Houdini Tokens</span>
      </span>

      <span class="badge-sc purple-sc" role="status" aria-label="Accessibility Spec">
        <strong>● WCAG AAA</strong><span>High Contrast</span>
      </span>

      <span class="badge-sc cyan-sc" role="status" aria-label="Automation Spec">
        <strong>✦ Autonomous AI</strong><span>Sequential Batches</span>
      </span>
    </section>
  </div>
</body>
</html>
