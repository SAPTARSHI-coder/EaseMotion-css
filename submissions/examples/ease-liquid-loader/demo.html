<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EaseMotion CSS - Liquid Gooey Loader</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="ease-gooey-wrapper" role="progressbar" aria-label="Loading application data">
    <!-- The center mass -->
    <div class="ease-blob ease-blob-core"></div>
    
    <!-- The orbiting masses -->
    <div class="ease-orbit ease-orbit-1">
      <div class="ease-blob ease-moon-1"></div>
    </div>
    <div class="ease-orbit ease-orbit-2">
      <div class="ease-blob ease-moon-2"></div>
    </div>
    <div class="ease-orbit ease-orbit-3">
      <div class="ease-blob ease-moon-3"></div>
    </div>
  </div>

  <p style="position: absolute; bottom: 2rem; color: #64748b; font-family: system-ui; font-size: 0.875rem; text-align: center;">Organic liquid physics powered by CSS <code>filter: blur()</code> combined with <code>contrast()</code>.<br>Zero inline SVG &lt;feColorMatrix&gt; hacks used.</p>
</body>
</html>
