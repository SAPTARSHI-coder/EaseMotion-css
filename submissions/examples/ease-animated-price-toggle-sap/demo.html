<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animated Price Toggle</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <h1>Animated Price Toggle</h1>

    <div class="billing-toggle">
      <span class="toggle-label" id="monthlyLabel">Monthly</span>
      <button
        class="toggle-switch"
        id="billingSwitch"
        role="switch"
        aria-checked="false"
        aria-labelledby="monthlyLabel yearlyLabel"
      >
        <span class="toggle-knob"></span>
      </button>
      <span class="toggle-label" id="yearlyLabel">Yearly <em>(save 20%)</em></span>
    </div>

    <div class="price-display">
      <span class="price-currency">$</span>
      <span class="price-number" id="priceNumber">19</span>
      <span class="price-period" id="pricePeriod">/mo</span>
    </div>
  </main>

  <script>
    const btn = document.getElementById('billingSwitch');
    const priceNumber = document.getElementById('priceNumber');
    const pricePeriod = document.getElementById('pricePeriod');
    const monthly = 19, yearly = 15;

    btn.addEventListener('click', () => {
      const isYearly = btn.getAttribute('aria-checked') === 'true';
      const nowYearly = !isYearly;
      btn.setAttribute('aria-checked', String(nowYearly));
      btn.classList.toggle('is-on', nowYearly);

      priceNumber.classList.add('is-swapping');
      setTimeout(() => {
        priceNumber.textContent = nowYearly ? yearly : monthly;
        pricePeriod.textContent = nowYearly ? '/mo, billed yearly' : '/mo';
        priceNumber.classList.remove('is-swapping');
      }, 150);
    });
  </script>
</body>
</html>
