<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Origami Paper Fold Widget</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="widget">

  <div class="corner corner-top"></div>
  <div class="corner corner-bottom"></div>

  <div class="widget-header">
    <span class="tag">ACTIVE</span>
    <span class="date">12 Aug</span>
  </div>

  <h2>Origami Analytics</h2>

  <p>
    Fold-inspired dashboard widget with subtle layered paper effects,
    smooth hover animation, and responsive layout.
  </p>

  <div class="stats">
    <div>
      <h3>86%</h3>
      <small>Performance</small>
    </div>

    <div>
      <h3>1.4K</h3>
      <small>Visitors</small>
    </div>
  </div>

</div>

</body>
</html>
