<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quantum Teleportation Node Demo — EaseMotion CSS</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <!-- Hidden Circuit Execution Trigger input -->
  <input type="checkbox" id="execute-circuit" class="execution-trigger">

  <!-- Main Demo Viewport -->
  <div class="demo-page" id="app-root">

    <h1 class="demo-title">Quantum Circuit Node</h1>
    <p class="demo-desc">Interactive circuit blueprint illustrating Alice-to-Bob particle teleportation flux rotations.</p>

    <!-- Node Layout Container -->
    <div class="quantum-node-card">
      
      <!-- HUD rotating lines overlay -->
      <div class="flux-hud-rotator"></div>

      <!-- Telemetry Header Row -->
      <div class="telemetry-row">
        <div class="node-status">
          <div class="status-dot"></div>
          <span>Node 01: Active</span>
        </div>
        <div style="font-size:0.7rem;font-weight:700;color:#64748b;">
          COHERENCE REF: 0xFD91
        </div>
      </div>

      <!-- Quantum Circuit blueprint grid lines -->
      <div class="circuit-grid">
        
        <!-- Wire 0: Alice state -->
        <div class="quantum-wire">
          <span class="wire-label">|q0&gt;</span>
          <div class="wire-line"></div>
          <div class="flux-particle"></div>
          <div class="quantum-gates-row">
            <div class="quantum-gate gate-1" title="Hadamard Gate">H</div>
            <div class="quantum-gate gate-2" title="CNOT Control">●</div>
          </div>
        </div>

        <!-- Wire 1: Alice Bell Pair half -->
        <div class="quantum-wire">
          <span class="wire-label">|q1&gt;</span>
          <div class="wire-line"></div>
          <div class="flux-particle" style="animation-delay:0.3s;"></div>
          <div class="quantum-gates-row">
            <div class="quantum-gate gate-2" style="font-size:0.9rem;" title="CNOT Target">⊕</div>
          </div>
        </div>

        <!-- Wire 2: Bob Teleportation Target -->
        <div class="quantum-wire">
          <span class="wire-label">|q2&gt;</span>
          <div class="wire-line"></div>
          <div class="flux-particle" style="animation-delay:0.6s;"></div>
          <div class="quantum-gates-row" style="padding-left:140px;">
            <div class="quantum-gate gate-3" title="Measurement Gate">M</div>
          </div>
        </div>

      </div>

      <!-- Telemetry Control inputs -->
      <div class="control-row">
        
        <div style="display:flex;gap:12px;align-items:center;">
          <!-- Clicking run triggers the execute-circuit checkbox -->
          <label for="execute-circuit" class="btn-quantum btn-run" role="button" tabindex="0">
            Execute Circuit
          </label>
          <label for="execute-circuit" class="btn-quantum btn-reset" role="button" tabindex="0">
            Reset
          </label>
        </div>

        <div style="display:flex;gap:24px;align-items:center;">
          <div class="slider-container">
            <span>Coherence Index</span>
            <input type="range" class="coherence-slider" min="1" max="100" value="96" aria-label="Coherence slider">
          </div>
          <button class="btn-quantum btn-reset" id="themeBtn">
            Theme
          </button>
        </div>

      </div>

    </div>

  </div>

  <script>
    // Theme toggle helper
    const themeBtn = document.getElementById('themeBtn');
    const appRoot = document.getElementById('app-root');
    themeBtn.addEventListener('click', () => {
      appRoot.classList.toggle('light-theme');
      document.querySelector('.quantum-node-card').classList.toggle('light-theme');
    });

    // Reset circuit checker trigger
    const executeTrigger = document.getElementById('execute-circuit');
    const resetBtn = document.querySelector('.btn-reset');
    resetBtn.addEventListener('click', () => {
      executeTrigger.checked = false;
    });
  </script>

</body>
</html>
