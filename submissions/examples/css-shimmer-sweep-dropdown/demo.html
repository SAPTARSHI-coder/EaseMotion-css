<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Shimmer-Sweep Dropdown — Gaming Hub</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="ease-container">
    <p class="ease-eyebrow">Matchmaking</p>
    <h1 class="ease-heading">Select Server Region</h1>
    <p class="ease-subtitle">Hover or open the dropdown to reveal a light shimmer effect.</p>

    <div class="ease-dropdown">
      <input type="checkbox" id="ease-shimmer-dropdown-toggle" class="ease-dropdown-input" />
      <label for="ease-shimmer-dropdown-toggle" class="ease-dropdown-trigger">
        <span class="ease-dropdown-label">North America (East)</span>
        <span class="ease-dropdown-arrow">▾</span>
      </label>
      <div class="ease-dropdown-menu">
        <button class="ease-dropdown-item">
          <span>North America (East)</span>
          <span class="ease-ping-badge">12 ms</span>
        </button>
        <button class="ease-dropdown-item">
          <span>Europe (Central)</span>
          <span class="ease-ping-badge">38 ms</span>
        </button>
        <button class="ease-dropdown-item">
          <span>Asia (Tokyo)</span>
          <span class="ease-ping-badge">110 ms</span>
        </button>
      </div>
    </div>
  </main>
</body>
