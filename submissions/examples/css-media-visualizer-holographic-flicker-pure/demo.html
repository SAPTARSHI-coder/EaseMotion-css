<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Media Visualizer: Holographic Flicker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="layout-container">
        
        <header class="section-header">
            <h1 class="title">Holographic Media Visualizer</h1>
            <p class="subtitle">A hardware-accelerated, JavaScript-free UI element. Features a sci-fi holographic aesthetic with pure CSS glitch animations, chromatic aberration, and scanlines.</p>
        </header>

        <div class="demo-area">
            
            <!-- 
              [TECHNIQUE] The Holographic Card
              Uses complex box-shadows to create a glowing neon border and 
              an erratic `@keyframes` animation for the glitch effect.
            -->
            <div class="holo-media-card">
                
                <!-- 
                  [TECHNIQUE] The Scanlines
                  A pseudo-element covering the card with a repeating linear-gradient
                  to simulate a CRT or holographic projector screen.
                -->
                <div class="scanlines"></div>
                
                <!-- The actual content, which also glitches -->
                <div class="holo-content">
                    
                    <div class="card-header">
                        <div class="holo-art">
                            <!-- SVG icon instead of album art for the sci-fi feel -->
                            <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="10"></circle>
                                <polygon points="10 8 16 12 10 16 10 8"></polygon>
                            </svg>
                        </div>
                        <div class="track-info">
                            <h3 class="track-title" data-text="CYBER_PUNK_2077">CYBER_PUNK_2077</h3>
                            <p class="track-artist">System Override [HOLO_MIX]</p>
                        </div>
                    </div>
                    
                    <!-- 
                      [TECHNIQUE] The Pure CSS Audio Visualizer
                      Neon colored bars. They share the same `@keyframes` 
                      but have unique fractional delays.
                    -->
                    <div class="visualizer-container">
                        <div class="bar bar-1"></div>
                        <div class="bar bar-2"></div>
                        <div class="bar bar-3"></div>
                        <div class="bar bar-4"></div>
                        <div class="bar bar-5"></div>
                        <div class="bar bar-6"></div>
                        <div class="bar bar-7"></div>
                        <div class="bar bar-8"></div>
                        <div class="bar bar-9"></div>
                        <div class="bar bar-10"></div>
                        <div class="bar bar-11"></div>
                        <div class="bar bar-12"></div>
                        <div class="bar bar-13"></div>
                        <div class="bar bar-14"></div>
                        <div class="bar bar-15"></div>
                        <div class="bar bar-16"></div>
                    </div>
                    
                    <div class="media-controls">
                        <button class="control-btn holo-btn" aria-label="Previous">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="19 20 9 12 19 4 19 20"></polygon><line x1="5" y1="19" x2="5" y2="5"></line></svg>
                        </button>
                        
                        <!-- Checkbox hack for play/pause toggle -->
                        <input type="checkbox" id="play-pause" class="play-toggle" checked aria-label="Play/Pause">
                        <label for="play-pause" class="control-btn holo-btn play-btn">
                            <svg class="icon-play" width="28" height="28" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                            <svg class="icon-pause" width="28" height="28" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
                        </label>
                        
                        <button class="control-btn holo-btn" aria-label="Next">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 4 15 12 5 20 5 4"></polygon><line x1="19" y1="5" x2="19" y2="19"></line></svg>
                        </button>
                    </div>
                    
                </div>
            </div>
            
        </div>
        
    </div>

</body>
</html>
