<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Badge | Material Design</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="badge-card" tabindex="0" aria-label="Material Animated Badge Showcase">
    <h1 class="badge-title">Material Badges</h1>
    <p class="badge-subtitle">Animated pulse badges styled with Material Design principles</p>

    <div class="badge-group" role="region" aria-label="Badge status collection">
        <span class="material-badge success" tabindex="0">
            <span class="badge-dot" aria-hidden="true"></span>
            Active
        </span>

        <span class="material-badge primary" tabindex="0">
            <span class="badge-dot" aria-hidden="true"></span>
            Syncing
        </span>

        <span class="material-badge warning" tabindex="0">
            <span class="badge-dot" aria-hidden="true"></span>
            Pending
        </span>

        <span class="material-badge error" tabindex="0">
            <span class="badge-dot" aria-hidden="true"></span>
            Offline
        </span>
    </div>
</main>

</body>
</html>
