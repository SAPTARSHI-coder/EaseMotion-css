<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="CSS-only animated login card with error and success states"
  >
  <title>Animated Login Card</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="page">
    <section class="login-card" aria-labelledby="login-title">

      <div class="card-header">
        <div class="logo" aria-hidden="true">E</div>
        <h1 id="login-title">Welcome Back</h1>
        <p>Sign in to continue to your account.</p>
      </div>

      <!--
        CSS-only state controls.
        They are visually hidden but keyboard accessible.
      -->
      <input
        type="radio"
        name="login-state"
        id="normal-state"
        checked
      >

      <input
        type="radio"
        name="login-state"
        id="error-state"
      >

      <input
        type="radio"
        name="login-state"
        id="success-state"
      >

      <form class="login-form" action="#" method="post">

        <div class="field">
          <label for="email">Email address</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="you@example.com"
            autocomplete="email"
            required
          >
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          >
        </div>

        <div class="form-options">
          <label class="remember">
            <input type="checkbox" name="remember">
            <span>Remember me</span>
          </label>

          <a href="#" class="forgot-link">
            Forgot password?
          </a>
        </div>

        <button type="submit" class="login-button">
          Sign In
        </button>

      </form>

      <div class="state-message error-message" role="alert">
        <span aria-hidden="true">!</span>
        Invalid email or password. Please try again.
      </div>

      <div class="state-message success-message" role="status">
        <span aria-hidden="true">✓</span>
        Login successful! Welcome back.
      </div>

      <!-- Demo controls -->
      <div class="demo-controls" aria-label="Animation demo controls">
        <label for="normal-state">Normal</label>
        <label for="error-state">Show Error</label>
        <label for="success-state">Show Success</label>
      </div>

    </section>
  </main>
</body>
</html>
