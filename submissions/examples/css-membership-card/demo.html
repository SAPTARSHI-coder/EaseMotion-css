<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Membership Card</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="page">
    <section class="membership-card" aria-labelledby="membership-title">
      <div class="sheen" aria-hidden="true"></div>

      <header class="card-header">
        <div>
          <p class="eyebrow">Exclusive Membership</p>
          <h1 id="membership-title">AURORA</h1>
        </div>

        <div class="badge" aria-label="Premium membership">
          <span aria-hidden="true">★</span>
          <small>PREMIUM</small>
        </div>
      </header>

      <div class="member-details">
        <p class="label">MEMBER</p>
        <p class="member-name">ALEX MORGAN</p>
      </div>

      <footer class="card-footer">
        <span>MEMBER SINCE 2026</span>
        <span>•••• 4827</span>
      </footer>
    </section>

    <p class="hint">
      Hover over the card to reveal the metallic sheen.
    </p>
  </main>
</body>
</html>
