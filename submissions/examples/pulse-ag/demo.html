<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pulse Animation Example - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="pulse-demo">
    <h1>Pulse Animation Examples</h1>
    <p>Practical examples of the <code>.ease-pulse</code> utility class on common UI components.</p>

    <section class="demo-section">
      <h2>Buttons</h2>
      <div class="demo-row">
        <button class="btn ease-pulse">Subscribe</button>
        <button class="btn btn-secondary ease-pulse">Notify Me</button>
      </div>
    </section>

    <section class="demo-section">
      <h2>Cards</h2>
      <div class="demo-row">
        <div class="card ease-pulse">
          <h3>New Feature</h3>
          <p>Check out what's new in this release.</p>
        </div>
      </div>
    </section>

    <section class="demo-section">
      <h2>Icons</h2>
      <div class="demo-row">
        <span class="icon ease-pulse" aria-label="notification bell">🔔</span>
        <span class="icon ease-pulse" aria-label="heart">❤️</span>
      </div>
    </section>

    <section class="demo-section">
      <h2>Notifications</h2>
      <div class="demo-row">
        <div class="notification ease-pulse">
          You have 3 new messages
        </div>
      </div>
    </section>

    <section class="demo-section">
      <h2>Badges</h2>
      <div class="demo-row">
        <span class="badge ease-pulse">New</span>
        <span class="badge badge-alert ease-pulse">5</span>
      </div>
    </section>

  </main>

</body>
</html>
