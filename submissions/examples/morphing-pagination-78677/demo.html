<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Morphing pagination showcase for EaseMotion CSS issue #78677." />
    <title>Morphing Pagination</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="page">
      <section class="showcase" aria-labelledby="title">
        <p class="eyebrow">EaseMotion CSS · Issue #78677</p>
        <h1 id="title">Morphing Pagination</h1>
        <p class="intro">
          A compact pagination control whose active and interactive states
          morph between rounded and circular shapes.
        </p>

        <nav aria-label="Pagination">
          <ul class="pagination">
            <li><a href="#previous" aria-label="Previous page">‹</a></li>
            <li><a href="#one">1</a></li>
            <li><a class="active" href="#two" aria-current="page">2</a></li>
            <li><a href="#three">3</a></li>
            <li><a href="#four">4</a></li>
            <li><a href="#next" aria-label="Next page">›</a></li>
          </ul>
        </nav>

        <p class="hint">Use Tab to inspect the keyboard interaction state.</p>
      </section>
    </main>
  </body>
</html>
