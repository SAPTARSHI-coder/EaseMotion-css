<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scale Hover Carousel</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<section class="carousel-section">

<h1>Featured Checkout Products</h1>

<p class="subtitle">
Scale-Hover Carousel built using pure HTML & CSS.
</p>

<div class="carousel">

<div class="card">

<div class="badge">Hot</div>

<div class="icon">🎧</div>

<h2>Gaming Headset</h2>

<p>7.1 Surround Sound with Noise Cancellation.</p>

<span class="price">$149</span>

<button>Buy Now</button>

</div>

<div class="card featured">

<div class="badge">Best</div>

<div class="icon">⌚</div>

<h2>Smart Watch</h2>

<p>AMOLED Display with 10-Day Battery Backup.</p>

<span class="price">$219</span>

<button>Checkout</button>

</div>

<div class="card">

<div class="badge">New</div>

<div class="icon">📱</div>

<h2>Smartphone Pro</h2>

<p>Flagship Performance with AI Camera System.</p>

<span class="price">$899</span>

<button>Order</button>

</div>

</div>

</section>

</body>

</html>
