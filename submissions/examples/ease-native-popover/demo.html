<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ease Native Popover Demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background-color: #0f172a;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      margin: 0;
    }
  </style>
</head>
<body>
  <div class="ease-popover-wrapper">
    <button class="ease-popover-trigger" popovertarget="ease-menu">Open Settings</button>

    <div id="ease-menu" class="ease-native-popover" popover>
      <h3>Settings</h3>
      <p>Configure your application preferences natively using HTML Popover API without any JavaScript.</p>
      <button popovertarget="ease-menu" popovertargetaction="hide" class="ease-popover-trigger" style="background: #ef4444; margin-top: 1rem;">Close</button>
    </div>
  </div>
</body>
</html>
