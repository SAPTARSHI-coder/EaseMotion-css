<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sci-Fi Retro Arcade HUD</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="ease-hud-wrapper" aria-label="Sci-Fi Retro Arcade HUD">
    <div class="ease-scanlines" aria-hidden="true"></div>
    
    <!-- Left Telemetry -->
    <aside class="ease-panel">
      <div class="ease-data-block">
        <span class="ease-label">Shield Power</span>
        <div class="ease-energy-bar"><div class="ease-energy-fill"></div></div>
      </div>
      <div class="ease-data-block">
        <span class="ease-label">System Integrity</span>
        <div class="ease-energy-bar"><div class="ease-energy-fill danger"></div></div>
      </div>
    </aside>
    
    <!-- Center Radar -->
    <section class="ease-center-view">
      <div class="ease-reticle">
        <div class="ease-reticle-core"></div>
      </div>
    </section>
    
    <!-- Right Telemetry -->
    <aside class="ease-panel" style="text-align: right;">
      <div class="ease-data-block">
        <span class="ease-label">Target Lock</span>
        <span class="ease-value">AQUIRED</span>
      </div>
      <div class="ease-data-block">
        <span class="ease-label">Coordinates</span>
        <span class="ease-value">X:84 Y:12 Z:99</span>
      </div>
    </aside>
  </main>

  <p style="position: absolute; bottom: 1rem; color: #00ffff; opacity: 0.5; font-size: 0.75rem;">8-Bit animation simulation achieved via CSS steps() timing function.<br>Block elements generated natively via repeating-linear-gradient.</p>
</body>
</html>
