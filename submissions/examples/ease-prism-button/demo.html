<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prism Button · Splits Light into Rainbow</title>

    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <div class="card">
        <h2>🔮 Prism Button</h2>
        <p class="sub">splits light into rainbow colors on hover</p>

        <!-- === PRISM BUTTON === -->
        <button class="prism-btn" id="prismBtn">
            <span class="prism-content">
                <i class="fas fa-gem"></i>
                <span>Prism</span>
            </span>
            <span class="prism-spectrum"></span>
            <span class="prism-spectrum spectrum-2"></span>
            <span class="prism-spectrum spectrum-3"></span>
            <span class="prism-spectrum spectrum-4"></span>
            <span class="prism-spectrum spectrum-5"></span>
        </button>

        <p style="margin-top: 2rem; font-size: 0.85rem; color: #64748b;">
            Hover · watch the light split into rainbow colors
        </p>
    </div>

    <!-- Embedded JavaScript -->
    <script>
        (function() {
            'use strict';

            const btn = document.getElementById('prismBtn');

            // Click feedback
            btn.addEventListener('click', function(e) {
                this.classList.add('click-pulse');
                setTimeout(() => {
                    this.classList.remove('click-pulse');
                }, 300);
                console.log('🔮 Prism button clicked!');
            });

            // Keyboard accessibility
            btn.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    this.click();
                }
            });

            // Reset animation on hover
            btn.addEventListener('mouseenter', function() {
                const spectra = this.querySelectorAll('.prism-spectrum');
                spectra.forEach(spectrum => {
                    spectrum.style.animation = 'none';
                    void spectrum.offsetWidth;
                    spectrum.style.animation = '';
                });
            });

            console.log('🔮 Prism button initialized!');

        })();
    </script>

</body>
</html>
