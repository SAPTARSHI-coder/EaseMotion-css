<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Holographic Shift · colors shift like holographic film</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <div class="holographic-container">
      <div class="holographic-display" id="holographicDisplay">
        <!-- Canvas for holographic shift -->
        <canvas id="holographicCanvas"></canvas>
        
        <!-- Holographic Info -->
        <div class="holographic-info">
          <span class="info-label">🌈 Hologram</span>
          <span class="info-value" id="hologramCount">0</span>
        </div>

        <!-- Holographic Controls -->
        <div class="holographic-controls">
          <div class="control-group">
            <label class="control-label">🌀 Shift</label>
            <input type="range" class="control-slider" id="shiftSlider" min="0" max="100" value="50">
            <span class="control-value" id="shiftValue">50%</span>
          </div>
          <div class="control-group">
            <label class="control-label">🌈 Palette</label>
            <div class="palette-options">
              <button class="palette-btn active" data-palette="rainbow" title="Rainbow">🌈</button>
              <button class="palette-btn" data-palette="sunset" title="Sunset">🌅</button>
              <button class="palette-btn" data-palette="aurora" title="Aurora">🌌</button>
              <button class="palette-btn" data-palette="neon" title="Neon">💜</button>
            </div>
          </div>
        </div>

        <!-- Holographic Text -->
        <div class="holographic-text">
          <span class="text-label">🌈 Holographic</span>
          <span class="text-message" id="holographicMessage">Colors shift like holographic film</span>
        </div>
      </div>
      
      <div class="holographic-status">
        <span id="holographicStatus">🌈 Move cursor to shift holographic colors</span>
      </div>
    </div>

    <div class="controls">
      <button class="btn btn-reset" id="resetBtn">⟳ Reset</button>
    </div>
    <div class="footer-note">
      <span>🌈 holographic shift · 4 palettes · iridescent</span>
    </div>
  </div>

  <script>
    (function() {
      "use strict";

      // DOM refs
      const canvas = document.getElementById('holographicCanvas');
      const ctx = canvas.getContext('2d');
      const display = document.getElementById('holographicDisplay');
      const hologramCount = document.getElementById('hologramCount');
      const holographicStatus = document.getElementById('holographicStatus');
      const holographicMessage = document.getElementById('holographicMessage');
      const resetBtn = document.getElementById('resetBtn');
      const shiftSlider = document.getElementById('shiftSlider');
      const shiftValue = document.getElementById('shiftValue');
      const paletteBtns = document.querySelectorAll('.palette-btn');

      // State
      let particles = [];
      let animationId = null;
      let time = 0;
      let mouseX = 0;
      let mouseY = 0;
      let currentPalette = 'rainbow';
      let totalParticles = 0;

      // Color palettes
      const palettes = {
        rainbow: {
          name: 'Rainbow',
          colors: ['#ef4444', '#f97316', '#fbbf24', '#22c55e', '#3b82f6', '#8b5cf6', '#ec4899']
        },
        sunset: {
          name: 'Sunset',
          colors: ['#ef4444', '#f97316', '#fb923c', '#fbbf24', '#f472b6', '#8b5cf6', '#6366f1']
        },
        aurora: {
          name: 'Aurora',
          colors: ['#34d399', '#60a5fa', '#a78bfa', '#f472b6', '#fbbf24', '#22c55e', '#3b82f6']
        },
        neon: {
          name: 'Neon',
          colors: ['#ec4899', '#8b5cf6', '#3b82f6', '#22c55e', '#fbbf24', '#f97316', '#ef4444']
        }
      };

      // Holographic particle class
      class HolographicParticle {
        constructor() {
          this.reset();
          this.x = Math.random() * canvas.width;
          this.y = Math.random() * canvas.height;
        }

        reset() {
          const w = canvas.width;
          const h = canvas.height;
          this.x = Math.random() * w;
          this.y = Math.random() * h;
          this.size = 2 + Math.random() * 6;
          this.baseSize = this.size;
          this.angle = Math.random() * Math.PI * 2;
          this.speed = 0.2 + Math.random() * 0.5;
          this.phase = Math.random() * Math.PI * 2;
          this.colorIndex = Math.floor(Math.random() * 7);
          this.twinkleSpeed = 0.01 + Math.random() * 0.02;
          this.twinklePhase = Math.random() * Math.PI * 2;
          this.opacity = 0.3 + Math.random() * 0.7;
          this.shiftOffset = Math.random() * Math.PI * 2;
          this.trail = [];
        }

        update(cx, cy, shift, time) {
          const shiftFactor = shift / 100;
          
          // Orbit around cursor with holographic shift
          const dx = cx - this.x;
          const dy = cy - this.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          
          if (dist > 5) {
            const angle = Math.atan2(dy, dx);
            const moveSpeed = 0.02 + shiftFactor * 0.03;
            this.x += Math.cos(angle + this.phase * 0.1) * moveSpeed * dist * 0.02;
            this.y += Math.sin(angle + this.phase * 0.1) * moveSpeed * dist * 0.02;
          }
          
          // Twinkle
          this.twinklePhase += this.twinkleSpeed;
          const twinkle = 0.5 + Math.sin(this.twinklePhase) * 0.5;
          this.size = this.baseSize * (0.5 + twinkle * 0.5);
          this.opacity = 0.3 + twinkle * 0.5;
          
          // Color shift
          this.colorIndex += 0.002 * shiftFactor;
          if (this.colorIndex >= 7) this.colorIndex -= 7;
          
          // Trail
          this.trail.push({ x: this.x, y: this.y, life: 1 });
          if (this.trail.length > 8) {
            this.trail.shift();
          }
          this.trail.forEach(t => t.life -= 0.05);
          
          // Wrap around edges
          if (this.x < -20) this.x = canvas.width + 20;
          if (this.x > canvas.width + 20) this.x = -20;
          if (this.y < -20) this.y = canvas.height + 20;
          if (this.y > canvas.height + 20) this.y = -20;
        }

        draw(ctx, palette, time) {
          const colors = palette.colors;
          const colorIndex = Math.floor(this.colorIndex) % colors.length;
          const nextIndex = (colorIndex + 1) % colors.length;
          const mix = this.colorIndex - Math.floor(this.colorIndex);
          
          // Interpolate colors
          const color1 = colors[colorIndex];
          const color2 = colors[nextIndex];
          const color = this.lerpColor(color1, color2, mix);
          
          const alpha = this.opacity * 0.7;
          
          // Trail
          this.trail.forEach((t, i) => {
            if (t.life > 0) {
              ctx.save();
              ctx.globalAlpha = t.life * alpha * 0.2;
              ctx.fillStyle = color;
              ctx.shadowColor = color;
              ctx.shadowBlur = 8;
              ctx.beginPath();
              ctx.arc(t.x, t.y, this.size * 0.3 * t.life, 0, Math.PI * 2);
              ctx.fill();
              ctx.restore();
            }
          });
          
          // Holographic glow
          ctx.save();
          const glowSize = this.size * 5;
          const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, glowSize);
          grad.addColorStop(0, color + '66');
          grad.addColorStop(0.3, color + '33');
          grad.addColorStop(1, 'transparent');
          ctx.fillStyle = grad;
          ctx.shadowColor = color;
          ctx.shadowBlur = 20;
          ctx.globalAlpha = alpha * 0.5;
          ctx.beginPath();
          ctx.arc(this.x, this.y, glowSize, 0, Math.PI * 2);
          ctx.fill();
          
          // Core particle
          ctx.shadowBlur = 15;
          ctx.fillStyle = color;
          ctx.globalAlpha = alpha * 0.9;
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
          ctx.fill();
          
          // Holographic highlight
          ctx.shadowBlur = 0;
          ctx.globalAlpha = alpha * 0.3;
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(this.x - this.size * 0.2, this.y - this.size * 0.2, this.size * 0.25, 0, Math.PI * 2);
          ctx.fill();
          
          // Cross sparkle
          ctx.globalAlpha = alpha * 0.15;
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 0.5;
          const sparkleSize = this.size * 2;
          ctx.beginPath();
          ctx.moveTo(this.x - sparkleSize, this.y);
          ctx.lineTo(this.x + sparkleSize, this.y);
          ctx.moveTo(this.x, this.y - sparkleSize);
          ctx.lineTo(this.x, this.y + sparkleSize);
          ctx.stroke();
          
          ctx.restore();
        }

        lerpColor(c1, c2, t) {
          const r1 = parseInt(c1.slice(1,3), 16);
          const g1 = parseInt(c1.slice(3,5), 16);
          const b1 = parseInt(c1.slice(5,7), 16);
          const r2 = parseInt(c2.slice(1,3), 16);
          const g2 = parseInt(c2.slice(3,5), 16);
          const b2 = parseInt(c2.slice(5,7), 16);
          
          const r = Math.round(r1 + (r2 - r1) * t);
          const g = Math.round(g1 + (g2 - g1) * t);
          const b = Math.round(b1 + (b2 - b1) * t);
          
          return `#${r.toString(16).padStart(2, '0')}${g.toString(16).padStart(2, '0')}${b.toString(16).padStart(2, '0')}`;
        }
      }

      // Generate particles
      function generateParticles() {
        const count = 80 + Math.floor(Math.random() * 40);
        particles = [];
        for (let i = 0; i < count; i++) {
          particles.push(new HolographicParticle());
        }
        totalParticles = particles.length;
        hologramCount.textContent = totalParticles;
      }

      // Draw background
      function drawBackground() {
        const w = canvas.width;
        const h = canvas.height;
        
        // Dark gradient
        const grad = ctx.createRadialGradient(w/2, h/2, 0, w/2, h/2, w * 0.7);
        grad.addColorStop(0, 'rgba(10, 5, 20, 0.4)');
        grad.addColorStop(0.5, 'rgba(5, 2, 15, 0.5)');
        grad.addColorStop(1, 'rgba(0, 0, 5, 0.7)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, w, h);
        
        // Subtle holographic background shimmer
        for (let i = 0; i < 20; i++) {
          const x = Math.random() * w;
          const y = Math.random() * h;
          const size = 10 + Math.random() * 30;
          const alpha = 0.02 + Math.random() * 0.03;
          ctx.save();
          ctx.globalAlpha = alpha;
          const grad2 = ctx.createRadialGradient(x, y, 0, x, y, size);
          grad2.addColorStop(0, '#818cf8');
          grad2.addColorStop(1, 'transparent');
          ctx.fillStyle = grad2;
          ctx.beginPath();
          ctx.arc(x, y, size, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      }

      // Resize canvas
      function resizeCanvas() {
        const rect = display.getBoundingClientRect();
        canvas.width = rect.width;
        canvas.height = rect.height;
        canvas.style.width = rect.width + 'px';
        canvas.style.height = rect.height + 'px';
        generateParticles();
        
        mouseX = canvas.width / 2;
        mouseY = canvas.height / 2;
      }

      // Animation loop
      function animate() {
        time += 0.02;
        const shift = parseInt(shiftSlider.value);
        const palette = palettes[currentPalette];
        
        // Smooth cursor follow
        const cx = mouseX;
        const cy = mouseY;
        
        // Clear and draw background
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawBackground();
        
        // Update and draw particles
        particles.forEach(p => {
          p.update(cx, cy, shift, time);
          p.draw(ctx, palette, time);
        });
        
        // Update status
        if (shift > 70) {
          holographicStatus.textContent = '🌈 Holographic colors shifting vibrantly! ✨';
          holographicStatus.style.color = '#fbbf24';
        } else if (shift > 30) {
          holographicStatus.textContent = '🌈 Colors shifting like holographic film';
          holographicStatus.style.color = '#818cf8';
        } else {
          holographicStatus.textContent = '🌈 Move cursor to shift holographic colors';
          holographicStatus.style.color = '#94a3b8';
        }
        
        animationId = requestAnimationFrame(animate);
      }

      // Set palette
      function setPalette(palette) {
        currentPalette = palette;
        paletteBtns.forEach(btn => {
          btn.classList.toggle('active', btn.dataset.palette === palette);
        });
        const paletteData = palettes[palette];
        holographicStatus.textContent = `🎨 Palette: ${paletteData.name}`;
        holographicStatus.style.color = '#a78bfa';
        setTimeout(() => {
          holographicStatus.textContent = '🌈 Move cursor to shift holographic colors';
          holographicStatus.style.color = '#94a3b8';
        }, 1500);
      }

      // Reset
      function resetHolographic() {
        generateParticles();
        holographicStatus.textContent = '🔄 Reset complete';
        holographicStatus.style.color = '#94a3b8';
        holographicMessage.textContent = 'Colors shift like holographic film';
        holographicMessage.style.color = '#94a3b8';
        setTimeout(() => {
          holographicStatus.textContent = '🌈 Move cursor to shift holographic colors';
          holographicStatus.style.color = '#94a3b8';
        }, 1000);
      }

      // Event listeners
      display.addEventListener('mousemove', function(e) {
        const rect = canvas.getBoundingClientRect();
        mouseX = e.clientX - rect.left;
        mouseY = e.clientY - rect.top;
      });

      display.addEventListener('mouseleave', function() {
        mouseX = canvas.width / 2;
        mouseY = canvas.height / 2;
      });

      // Touch support
      display.addEventListener('touchmove', function(e) {
        e.preventDefault();
        const rect = canvas.getBoundingClientRect();
        const touch = e.touches[0];
        mouseX = touch.clientX - rect.left;
        mouseY = touch.clientY - rect.top;
      }, { passive: false });

      display.addEventListener('touchend', function() {
        mouseX = canvas.width / 2;
        mouseY = canvas.height / 2;
      });

      shiftSlider.addEventListener('input', function() {
        shiftValue.textContent = this.value + '%';
      });

      paletteBtns.forEach(btn => {
        btn.addEventListener('click', function() {
          setPalette(this.dataset.palette);
        });
      });

      if (resetBtn) {
        resetBtn.addEventListener('click', function(e) {
          e.preventDefault();
          resetHolographic();
        });
      }

      // Keyboard shortcuts
      document.addEventListener('keydown', function(e) {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

        const key = e.key;
        if (key === 'r' || key === 'R') {
          e.preventDefault();
          resetHolographic();
        }
      });

      // Resize
      window.addEventListener('resize', resizeCanvas);

      // Initialize
      resizeCanvas();
      animate();
      
      console.log('🌈 Holographic Shift ready · shortcuts: [R] Reset');
    })();
  </script>
</body>
</html>
