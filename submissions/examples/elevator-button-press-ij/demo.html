<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-elevator-button-press demo</title>
</head>
<body>
<div class="eb-app">
  <span class="eb-title">ELEVATOR</span>
  <div class="eb-shaft">
    <div class="eb-door eb-door-1"></div>
    <div class="eb-door eb-door-2"></div>
  </div>
  <div class="eb-panel">
    <div class="eb-display"><span class="eb-floor">3</span></div>
    <button class="eb-btn eb-btn-up" aria-label="call up">&#9650;</button>
    <button class="eb-btn eb-btn-down" aria-label="call down">&#9660;</button>
    <div class="eb-arrow"></div>
  </div>
</div>
</body>
</html>
