<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Gradient Card</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="card-container">
        <!-- The Dynamic Gradient Card -->
        <div class="dynamic-card">
            <!-- Animated background layer -->
            <div class="gradient-bg"></div>
            
            <!-- Content layer -->
            <div class="card-content">
                <div class="card-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
                    </svg>
                </div>
                <h3 class="card-title">Lightning Fast</h3>
                <p class="card-text">Experience unparalleled performance with our dynamically optimized global edge network.</p>
                <a href="#" class="card-link">Learn more <span>&rarr;</span></a>
            </div>
        </div>
    </div>

</body>
</html>
