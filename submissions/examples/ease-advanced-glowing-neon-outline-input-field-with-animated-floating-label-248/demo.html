<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
Glowing Neon Outline Input Field
</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<main class="container">


<section class="card">


<h1>
Neon Login
</h1>


<p>
Animated Floating Label Input
</p>



<div class="input-group">

<input 
type="text"
id="username"
required
>

<label for="username">
Username
</label>

</div>



<div class="input-group">

<input 
type="email"
id="email"
required
>

<label for="email">
Email Address
</label>

</div>



<div class="input-group">

<input 
type="password"
id="password"
required
>

<label for="password">
Password
</label>

</div>



<button>
Continue
</button>


</section>


</main>


<script src="script.js"></script>


</body>

</html>
