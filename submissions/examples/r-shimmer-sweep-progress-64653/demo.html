<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Pure CSS Shimmer-Sweep Progress Bar for Minimalist Tech layouts"
  >
  <title>Shimmer-Sweep Progress Bar</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="showcase">
    <header class="hero">
      <p class="eyebrow">EASEMOTION CSS</p>
      <h1>Shimmer-Sweep Progress</h1>
      <p class="subtitle">
        A lightweight CSS progress component with a smooth animated shimmer
        sweep for modern technology interfaces.
      </p>
    </header>

    <section class="progress-panel" aria-label="Project progress">
      <div class="progress-header">
        <div>
          <span class="label">SYSTEM DEPLOYMENT</span>
          <h2>Deployment Progress</h2>
        </div>

        <span class="percentage">78%</span>
      </div>

      <div
        class="progress-bar"
        role="progressbar"
        aria-valuenow="78"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-label="Deployment progress: 78 percent"
      >
        <span class="progress-fill"></span>
      </div>

      <div class="progress-meta">
        <span>PROCESSING</span>
        <span>78 / 100</span>
      </div>
    </section>

    <section class="progress-grid" aria-label="System metrics">
      <article class="metric">
        <div class="metric-top">
          <span>CORE SYSTEM</span>
          <strong>92%</strong>
        </div>

        <div
          class="progress-bar small"
          role="progressbar"
          aria-valuenow="92"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-label="Core system: 92 percent"
        >
          <span class="progress-fill fill-92"></span>
        </div>
      </article>

      <article class="metric">
        <div class="metric-top">
          <span>NETWORK</span>
          <strong>64%</strong>
        </div>

        <div
          class="progress-bar small"
          role="progressbar"
          aria-valuenow="64"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-label="Network: 64 percent"
        >
          <span class="progress-fill fill-64"></span>
        </div>
      </article>

      <article class="metric">
        <div class="metric-top">
          <span>DATABASE</span>
          <strong>84%</strong>
        </div>

        <div
          class="progress-bar small"
          role="progressbar"
          aria-valuenow="84"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-label="Database: 84 percent"
        >
          <span class="progress-fill fill-84"></span>
        </div>
      </article>
    </section>
  </main>
</body>
</html>
