<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rating & Feedback Widget | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="demo-header">
    <h1>Rating & Feedback Widget</h1>
    <p>Interactive 5-star rating control with CSS star glow animations.</p>
  </header>

  <main class="demo-main">
    <section class="demo-section">
      <div class="ease-rating-card">
        <h3>How was your experience?</h3>
        <div class="ease-rating-stars">
          <span class="ease-star" data-rating="1">&#9733;</span>
          <span class="ease-star" data-rating="2">&#9733;</span>
          <span class="ease-star" data-rating="3">&#9733;</span>
          <span class="ease-star" data-rating="4">&#9733;</span>
          <span class="ease-star" data-rating="5">&#9733;</span>
        </div>
        <p class="ease-rating-text">Click a star to rate</p>
      </div>
    </section>
  </main>

  <footer class="demo-footer"><p>EaseMotion CSS Project</p></footer>

  <script>
    const stars = document.querySelectorAll('.ease-star');
    const text = document.querySelector('.ease-rating-text');
    stars.forEach((star, idx) => {
      star.addEventListener('click', () => {
        stars.forEach((s, i) => {
          s.classList.toggle('ease-star-active', i <= idx);
        });
        text.textContent = `You rated ${idx + 1} out of 5 stars!`;
      });
    });
  </script>
</body>
</html>
