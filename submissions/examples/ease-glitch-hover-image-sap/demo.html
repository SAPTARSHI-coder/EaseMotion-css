<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glitch Hover Image</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <h1>Glitch Hover Image</h1>

    <div class="glitch-card" style="--img: url('https://picsum.photos/seed/glitch/480/320');">
      <div class="glitch-layer glitch-base"></div>
      <div class="glitch-layer glitch-r"></div>
      <div class="glitch-layer glitch-b"></div>
      <span class="glitch-caption">Hover to glitch</span>
    </div>

    <p class="hint">No canvas/JS — pure CSS clip-path + filter layers.</p>
  </main>
</body>
</html>
