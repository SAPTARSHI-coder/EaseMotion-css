<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Pastel Carousel - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="ease-carousel-wrapper">
    <!-- State Controllers -->
    <input type="radio" name="carousel" id="c-1" class="ease-carousel-inputs" checked>
    <input type="radio" name="carousel" id="c-2" class="ease-carousel-inputs">
    <input type="radio" name="carousel" id="c-3" class="ease-carousel-inputs">
    <input type="radio" name="carousel" id="c-4" class="ease-carousel-inputs">
    <input type="radio" name="carousel" id="c-5" class="ease-carousel-inputs">
    
    <!-- 3D Scene -->
    <div class="ease-scene">
      <div class="ease-card ease-card-1">Card 1</div>
      <div class="ease-card ease-card-2">Card 2</div>
      <div class="ease-card ease-card-3">Card 3</div>
      <div class="ease-card ease-card-4">Card 4</div>
      <div class="ease-card ease-card-5">Card 5</div>
    </div>
    
    <!-- Navigation -->
    <div class="ease-nav">
      <label for="c-1" class="ease-nav-dot"></label>
      <label for="c-2" class="ease-nav-dot"></label>
      <label for="c-3" class="ease-nav-dot"></label>
      <label for="c-4" class="ease-nav-dot"></label>
      <label for="c-5" class="ease-nav-dot"></label>
    </div>
  </div>
  <p style="position: absolute; bottom: 2rem; color: #94a3b8; font-size: 0.875rem; text-transform: uppercase; letter-spacing: 1px;">Zero JavaScript. Pure CSS 3D Geometry.</p>
</body>
</html>
