<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Blur-Entrance Dropdown for product catalog layouts">
    <title>Blur-Entrance Dropdown</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="page">

        <section class="catalog">

            <p class="eyebrow">EASEMOTION CSS</p>

            <h1>Product Catalog</h1>

            <p class="description">
                Explore product categories with a smooth
                blur-entrance dropdown interaction.
            </p>

            <div class="dropdown">

                <input
                    type="checkbox"
                    id="catalog-dropdown"
                    class="dropdown-toggle"
                >

                <label
                    for="catalog-dropdown"
                    class="dropdown-button"
                >
                    <span>Select Category</span>
                    <span class="arrow">+</span>
                </label>

                <div class="dropdown-menu">

                    <a href="#" class="dropdown-item">
                        <span class="number">01</span>
                        <span>Electronics</span>
                    </a>

                    <a href="#" class="dropdown-item">
                        <span class="number">02</span>
                        <span>Fashion</span>
                    </a>

                    <a href="#" class="dropdown-item">
                        <span class="number">03</span>
                        <span>Home &amp; Living</span>
                    </a>

                    <a href="#" class="dropdown-item">
                        <span class="number">04</span>
                        <span>Accessories</span>
                    </a>

                    <a href="#" class="dropdown-item">
                        <span class="number">05</span>
                        <span>New Arrivals</span>
                    </a>

                </div>

            </div>

        </section>

    </main>

</body>
</html>
