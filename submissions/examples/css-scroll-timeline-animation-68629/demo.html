<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Scroll Timeline Animation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="header">
    <h1>Scroll Down to Animate</h1>
  </div>
  
  <div class="scroll-container">
    <div class="progress-bar" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
    
    <div class="content">
      <div class="scroll-item item-1">
        <h2>Scroll Item 1</h2>
        <p>This item fades in and moves up as you scroll past it.</p>
      </div>
      <div class="scroll-item item-2">
        <h2>Scroll Item 2</h2>
        <p>This item fades in and scales up as you scroll.</p>
      </div>
      <div class="scroll-item item-3">
        <h2>Scroll Item 3</h2>
        <p>This item rotates into view as you scroll.</p>
      </div>
    </div>
  </div>
  
  <div class="footer">
    <p>End of Scroll Area</p>
  </div>
</body>
</html>
