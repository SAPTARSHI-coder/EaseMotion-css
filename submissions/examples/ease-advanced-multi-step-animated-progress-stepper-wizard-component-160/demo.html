<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Multi-Step Animated Progress Stepper Wizard</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

</head>

<body>

<section class="wizard">

<div class="wizard-card">

<span class="badge">
Compact Mobile-First Edition
</span>

<h1>Progress Stepper Wizard</h1>

<div class="progress-container">

<div class="progress-bar">
<div class="progress-fill" id="progress"></div>
</div>

<div class="steps">

<div class="step active">
<span>1</span>
<p>Account</p>
</div>

<div class="step">
<span>2</span>
<p>Profile</p>
</div>

<div class="step">
<span>3</span>
<p>Payment</p>
</div>

<div class="step">
<span>4</span>
<p>Finish</p>
</div>

</div>

</div>

<div class="content">

<h2 id="title">
Create Your Account
</h2>

<p id="description">
Start by creating your account to continue with the onboarding process.
</p>

</div>

<div class="buttons">

<button id="prev" disabled>
Previous
</button>

<button id="next">
Next
</button>

</div>

</div>

</section>

<script src="script.js"></script>

</body>
</html>
