<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Color Mode Toggle</title>
<link rel="stylesheet" href="style.css" />
<script>
  function cmtApply(mode) {
    document.documentElement.setAttribute('data-theme', mode);
    try { localStorage.setItem('cmt-theme', mode); } catch {}
  }
  (function () {
    var stored = null;
    try { stored = localStorage.getItem('cmt-theme'); } catch {}
    if (stored) document.documentElement.setAttribute('data-theme', stored);
  })();
</script>
</head>
<body>
<main class="cmt-wrap">
  <h1 class="cmt-h1">Color Mode</h1>
  <p class="cmt-lede">A three-way light/dark/system toggle. "System" removes the data-theme override entirely so prefers-color-scheme takes back over, rather than storing a resolved light/dark value.</p>

  <div class="cmt-group" role="radiogroup" aria-label="Colour mode">
    <button type="button" class="cmt-opt" onclick="cmtApply('light')" aria-pressed="false">Light</button>
    <button type="button" class="cmt-opt" onclick="cmtApply('dark')" aria-pressed="false">Dark</button>
    <button type="button" class="cmt-opt" onclick="document.documentElement.removeAttribute('data-theme'); try { localStorage.removeItem('cmt-theme'); } catch {}" aria-pressed="true">System</button>
  </div>

  <div class="cmt-preview">
    <p>This card follows the selected mode.</p>
  </div>
</main>
</body>
</html>
