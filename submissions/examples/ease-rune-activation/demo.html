<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rune Activation · glowing runes activate</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <div class="rune-container">
      <div class="rune-display" id="runeDisplay">
        <!-- Rune Grid -->
        <div class="rune-grid">
          <div class="rune rune-1" data-index="0">
            <span class="rune-symbol">ᚠ</span>
            <span class="rune-name">Fehu</span>
          </div>
          <div class="rune rune-2" data-index="1">
            <span class="rune-symbol">ᚢ</span>
            <span class="rune-name">Uruz</span>
          </div>
          <div class="rune rune-3" data-index="2">
            <span class="rune-symbol">ᚦ</span>
            <span class="rune-name">Thurisaz</span>
          </div>
          <div class="rune rune-4" data-index="3">
            <span class="rune-symbol">ᚨ</span>
            <span class="rune-name">Ansuz</span>
          </div>
          <div class="rune rune-5" data-index="4">
            <span class="rune-symbol">ᚱ</span>
            <span class="rune-name">Raido</span>
          </div>
          <div class="rune rune-6" data-index="5">
            <span class="rune-symbol">ᚲ</span>
            <span class="rune-name">Kenaz</span>
          </div>
          <div class="rune rune-7" data-index="6">
            <span class="rune-symbol">ᚷ</span>
            <span class="rune-name">Gebo</span>
          </div>
          <div class="rune rune-8" data-index="7">
            <span class="rune-symbol">ᚹ</span>
            <span class="rune-name">Wunjo</span>
          </div>
          <div class="rune rune-9" data-index="8">
            <span class="rune-symbol">ᚺ</span>
            <span class="rune-name">Hagalaz</span>
          </div>
        </div>

        <!-- Activation Indicator -->
        <div class="activation-indicator">
          <div class="activation-bar">
            <div class="activation-fill" id="activationFill"></div>
          </div>
          <span class="activation-value" id="activationValue">Activated: 0/9</span>
        </div>
      </div>
      
      <div class="rune-status">
        <span id="runeStatus">🔮 Click a rune to activate it</span>
      </div>
    </div>

    <div class="controls">
      <button class="btn btn-activate" id="activateBtn">🔮 Activate All</button>
      <button class="btn btn-random" id="randomBtn">🎲 Random Rune</button>
      <button class="btn btn-reset" id="resetBtn">⟳ Reset</button>
    </div>
    <div class="footer-note">
      <span>🔮 9 elder runes · glowing activation · ancient magic</span>
    </div>
  </div>

  <script>
    (function() {
      "use strict";

      // DOM refs
      const runes = document.querySelectorAll('.rune');
      const activationFill = document.getElementById('activationFill');
      const activationValue = document.getElementById('activationValue');
      const runeStatus = document.getElementById('runeStatus');
      const activateBtn = document.getElementById('activateBtn');
      const randomBtn = document.getElementById('randomBtn');
      const resetBtn = document.getElementById('resetBtn');

      // State
      let activeRunes = new Set();
      let isActivating = false;

      // Rune colors
      const runeColors = {
        active: '#fbbf24',
        glow: 'rgba(251, 191, 36, 0.6)',
        inactive: '#2d3748',
        pulse: '#fcd34d'
      };

      // Activate a rune
      function activateRune(rune) {
        const index = parseInt(rune.dataset.index);
        if (activeRunes.has(index)) return;
        
        activeRunes.add(index);
        rune.classList.add('active');
        
        // Add glow animation
        const glow = document.createElement('div');
        glow.className = 'rune-glow';
        rune.appendChild(glow);
        
        // Update indicator
        updateIndicator();
        
        // Update status
        const name = rune.querySelector('.rune-name').textContent;
        const symbol = rune.querySelector('.rune-symbol').textContent;
        runeStatus.textContent = `✨ ${symbol} ${name} activated! (${activeRunes.size}/9)`;
        runeStatus.style.color = '#fbbf24';
        
        // Create sparkle burst
        createRuneSparkles(rune);
        
        setTimeout(() => {
          if (activeRunes.size < 9) {
            runeStatus.textContent = `🔮 ${activeRunes.size}/9 runes activated`;
            runeStatus.style.color = '#818cf8';
          } else {
            runeStatus.textContent = '🌟 All runes activated! Ancient power unleashed!';
            runeStatus.style.color = '#fbbf24';
            // Celebration effect
            createCelebration();
          }
        }, 1500);
      }

      // Deactivate a rune
      function deactivateRune(rune) {
        const index = parseInt(rune.dataset.index);
        if (!activeRunes.has(index)) return;
        
        activeRunes.delete(index);
        rune.classList.remove('active');
        
        // Remove glow
        const glow = rune.querySelector('.rune-glow');
        if (glow) glow.remove();
        
        // Update indicator
        updateIndicator();
        
        // Update status
        const name = rune.querySelector('.rune-name').textContent;
        runeStatus.textContent = `🔮 ${name} deactivated (${activeRunes.size}/9)`;
        runeStatus.style.color = '#94a3b8';
      }

      // Toggle rune
      function toggleRune(rune) {
        const index = parseInt(rune.dataset.index);
        if (activeRunes.has(index)) {
          deactivateRune(rune);
        } else {
          activateRune(rune);
        }
      }

      // Update indicator
      function updateIndicator() {
        const count = activeRunes.size;
        const percent = (count / 9) * 100;
        activationFill.style.width = percent + '%';
        activationValue.textContent = `Activated: ${count}/9`;
        
        // Change color based on progress
        if (count === 9) {
          activationFill.style.background = 'linear-gradient(90deg, #fbbf24, #f59e0b, #fcd34d)';
        } else if (count > 5) {
          activationFill.style.background = 'linear-gradient(90deg, #818cf8, #a78bfa, #c4b5fd)';
        } else {
          activationFill.style.background = 'linear-gradient(90deg, #6366f1, #818cf8, #a78bfa)';
        }
      }

      // Create rune sparkles
      function createRuneSparkles(rune) {
        const rect = rune.getBoundingClientRect();
        const displayRect = document.getElementById('runeDisplay').getBoundingClientRect();
        const x = rect.left - displayRect.left + rect.width / 2;
        const y = rect.top - displayRect.top + rect.height / 2;
        
        for (let i = 0; i < 12; i++) {
          const sparkle = document.createElement('div');
          sparkle.className = 'rune-sparkle';
          
          const size = Math.random() * 6 + 3;
          sparkle.style.width = size + 'px';
          sparkle.style.height = size + 'px';
          sparkle.style.left = x + 'px';
          sparkle.style.top = y + 'px';
          sparkle.style.backgroundColor = ['#fbbf24', '#fcd34d', '#f59e0b', '#fde68a'][Math.floor(Math.random() * 4)];
          
          const angle = Math.random() * Math.PI * 2;
          const distance = 30 + Math.random() * 60;
          sparkle.style.setProperty('--tx', Math.cos(angle) * distance + 'px');
          sparkle.style.setProperty('--ty', Math.sin(angle) * distance + 'px');
          
          sparkle.style.animationDuration = (Math.random() * 0.5 + 0.5) + 's';
          
          document.getElementById('runeDisplay').appendChild(sparkle);
          
          setTimeout(() => {
            sparkle.remove();
          }, 1200);
        }
      }

      // Create celebration
      function createCelebration() {
        const display = document.getElementById('runeDisplay');
        for (let i = 0; i < 50; i++) {
          setTimeout(() => {
            const sparkle = document.createElement('div');
            sparkle.className = 'rune-sparkle';
            
            const size = Math.random() * 8 + 4;
            sparkle.style.width = size + 'px';
            sparkle.style.height = size + 'px';
            sparkle.style.left = Math.random() * 100 + '%';
            sparkle.style.top = Math.random() * 100 + '%';
            sparkle.style.backgroundColor = ['#fbbf24', '#fcd34d', '#f59e0b', '#fde68a', '#818cf8', '#a78bfa'][Math.floor(Math.random() * 6)];
            
            const angle = Math.random() * Math.PI * 2;
            const distance = 50 + Math.random() * 100;
            sparkle.style.setProperty('--tx', Math.cos(angle) * distance + 'px');
            sparkle.style.setProperty('--ty', Math.sin(angle) * distance + 'px');
            
            sparkle.style.animationDuration = (Math.random() * 0.8 + 0.6) + 's';
            
            display.appendChild(sparkle);
            
            setTimeout(() => {
              sparkle.remove();
            }, 1500);
          }, i * 50);
        }
      }

      // Activate all runes
      function activateAll() {
        if (isActivating) return;
        isActivating = true;
        
        const inactiveRunes = Array.from(runes).filter(r => !activeRunes.has(parseInt(r.dataset.index)));
        
        inactiveRunes.forEach((rune, index) => {
          setTimeout(() => {
            activateRune(rune);
            if (index === inactiveRunes.length - 1) {
              setTimeout(() => {
                isActivating = false;
              }, 500);
            }
          }, index * 200);
        });
        
        if (inactiveRunes.length === 0) {
          isActivating = false;
          runeStatus.textContent = '🌟 All runes already activated!';
          runeStatus.style.color = '#fbbf24';
        }
      }

      // Random rune
      function randomRune() {
        const inactiveRunes = Array.from(runes).filter(r => !activeRunes.has(parseInt(r.dataset.index)));
        if (inactiveRunes.length === 0) {
          runeStatus.textContent = '🌟 All runes already activated!';
          runeStatus.style.color = '#fbbf24';
          return;
        }
        const random = inactiveRunes[Math.floor(Math.random() * inactiveRunes.length)];
        activateRune(random);
      }

      // Reset
      function resetRunes() {
        if (isActivating) return;
        runes.forEach(rune => {
          deactivateRune(rune);
        });
        runeStatus.textContent = '🔄 Reset complete';
        runeStatus.style.color = '#94a3b8';
        setTimeout(() => {
          runeStatus.textContent = '🔮 Click a rune to activate it';
        }, 1000);
      }

      // Event listeners
      runes.forEach(rune => {
        rune.addEventListener('click', function(e) {
          e.stopPropagation();
          toggleRune(this);
        });
      });

      if (activateBtn) {
        activateBtn.addEventListener('click', function(e) {
          e.preventDefault();
          activateAll();
        });
      }

      if (randomBtn) {
        randomBtn.addEventListener('click', function(e) {
          e.preventDefault();
          randomRune();
        });
      }

      if (resetBtn) {
        resetBtn.addEventListener('click', function(e) {
          e.preventDefault();
          resetRunes();
        });
      }

      // Keyboard shortcuts
      document.addEventListener('keydown', function(e) {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

        const key = e.key;
        if (key === 'a' || key === 'A') {
          e.preventDefault();
          activateAll();
        } else if (key === 'r' || key === 'R') {
          e.preventDefault();
          randomRune();
        } else if (key === 'x' || key === 'X') {
          e.preventDefault();
          resetRunes();
        } else if (key >= '1' && key <= '9') {
          e.preventDefault();
          const index = parseInt(key) - 1;
          if (index < runes.length) {
            toggleRune(runes[index]);
          }
        }
      });

      // Initialize
      updateIndicator();
      console.log('🔮 Rune Activation ready · shortcuts: [A] All, [R] Random, [X] Reset, [1-9] Toggle rune');
    })();
  </script>
</body>
</html>
