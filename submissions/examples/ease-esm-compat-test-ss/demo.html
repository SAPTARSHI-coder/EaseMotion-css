<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESM Module Export Import Compatibility Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <span class="badge">Vitest & ESM Spec</span>
      <h1>ESM Module Export/Import Compatibility</h1>
      <p>Interactive browser test suite for ES6 named, default, and dynamic ESM exports.</p>
    </header>

    <main class="test-runner">
      <div class="card">
        <h2>Module Resolution Status</h2>
        <div id="resolution-results" class="results-grid">
          <div class="loading">Evaluating ESM Module Exports...</div>
        </div>
      </div>

      <div class="card">
        <h2>Live Execution Sandbox</h2>
        <div class="controls">
          <div class="input-group">
            <label for="numA">Param A:</label>
            <input type="text" id="numA" value="5">
          </div>
          <div class="input-group">
            <label for="numB">Param B:</label>
            <input type="text" id="numB" value="7">
          </div>
        </div>
        <div class="actions">
          <button id="btn-add">Execute add(a, b)</button>
          <button id="btn-sub">Execute subtract(a, b)</button>
          <button id="btn-mult">Execute default.multiply(a, b)</button>
        </div>
        <div class="output-box">
          <span>Result:</span>
          <strong id="calc-output">Ready</strong>
        </div>
      </div>
    </main>
  </div>

  <script type="module">
    import defaultCalculator, { add, subtract } from './esmExports.js';

    document.addEventListener('DOMContentLoaded', async () => {
      const resultsContainer = document.getElementById('resolution-results');
      resultsContainer.innerHTML = '';

      const testCases = [
        { name: 'Named Export: add', type: typeof add, valid: typeof add === 'function' },
        { name: 'Named Export: subtract', type: typeof subtract, valid: typeof subtract === 'function' },
        { name: 'Default Export: calculator', type: typeof defaultCalculator, valid: typeof defaultCalculator === 'object' },
        { name: 'Default Export Method: multiply', type: typeof defaultCalculator?.multiply, valid: typeof defaultCalculator?.multiply === 'function' },
        { name: 'Default Export Version', type: defaultCalculator?.version, valid: defaultCalculator?.version === '1.0.0' }
      ];

      try {
        const dynamicMod = await import('./esmExports.js');
        testCases.push({
          name: 'Dynamic import()',
          type: 'Promise resolved',
          valid: !!dynamicMod.add && !!dynamicMod.default
        });
      } catch (err) {
        testCases.push({
          name: 'Dynamic import()',
          type: err.message,
          valid: false
        });
      }

      testCases.forEach(tc => {
        const item = document.createElement('div');
        item.className = `result-item ${tc.valid ? 'pass' : 'fail'}`;
        item.innerHTML = `
          <div class="status-icon">${tc.valid ? '✓' : '✗'}</div>
          <div class="info">
            <strong>${tc.name}</strong>
            <small>Resolved: ${tc.type}</small>
          </div>
        `;
        resultsContainer.appendChild(item);
      });

      // Calculator bindings
      const numA = document.getElementById('numA');
      const numB = document.getElementById('numB');
      const output = document.getElementById('calc-output');

      const getInputs = () => {
        const valA = numA.value.trim() === '' ? undefined : (isNaN(Number(numA.value)) ? numA.value : Number(numA.value));
        const valB = numB.value.trim() === '' ? undefined : (isNaN(Number(numB.value)) ? numB.value : Number(numB.value));
        return [valA, valB];
      };

      document.getElementById('btn-add').addEventListener('click', () => {
        const [a, b] = getInputs();
        output.textContent = String(add(a, b));
      });

      document.getElementById('btn-sub').addEventListener('click', () => {
        const [a, b] = getInputs();
        output.textContent = String(subtract(a, b));
      });

      document.getElementById('btn-mult').addEventListener('click', () => {
        const [a, b] = getInputs();
        output.textContent = String(defaultCalculator.multiply(a, b));
      });
    });
  </script>
</body>
</html>
