<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glitch Flicker Fintech Modal</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="page">

    <button id="openModal" class="open-btn">
        Open Transaction Alert
    </button>

</div>

<div class="modal-overlay" id="overlay">

    <div class="glitch-modal">

        <div class="glitch-line"></div>

        <h1 class="modal-title">
            Transaction Alert
        </h1>

        <p class="modal-text">
            An unusual transaction has been detected on your account.
            Please verify your identity before continuing.
        </p>

        <div class="modal-buttons">

            <button class="verify-btn">
                Verify Now
            </button>

            <button class="close-btn">
                Close
            </button>

        </div>

    </div>

</div>

<script>

const overlay=document.getElementById("overlay");

document.getElementById("openModal").onclick=()=>{
overlay.classList.add("show");
};

document.querySelector(".close-btn").onclick=()=>{
overlay.classList.remove("show");
};

overlay.onclick=(e)=>{
if(e.target===overlay){
overlay.classList.remove("show");
}
};

document.addEventListener("keydown",(e)=>{
if(e.key==="Escape"){
overlay.classList.remove("show");
}
});

</script>

</body>
</html>
