<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Animated Wristwatch</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="watch-container" aria-label="Animated CSS Wristwatch">

    <div class="watch">

      <div class="strap top"></div>

      <div class="clock">

        <div class="number n12">12</div>
        <div class="number n3">3</div>
        <div class="number n6">6</div>
        <div class="number n9">9</div>

        <div class="hand hour"></div>
        <div class="hand minute"></div>
        <div class="hand second"></div>

        <div class="center"></div>

      </div>

      <div class="strap bottom"></div>

    </div>

  </main>

</body>
</html>
