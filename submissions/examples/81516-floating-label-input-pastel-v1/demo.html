<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Interactive floating label input with pastel styling built using pure CSS."
  >

  <title>Interactive Floating Label Input</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="page">
    <section class="form-card" aria-labelledby="form-title">

      <div class="intro">
        <span class="eyebrow">EaseMotion CSS</span>

        <h1 id="form-title">
          Tell us about you
        </h1>

        <p>
          A playful floating-label form with soft pastel
          colors and smooth CSS-only interactions.
        </p>
      </div>

      <form class="pastel-form">

        <div class="field">
          <input
            class="field-input"
            type="text"
            id="name"
            name="name"
            placeholder=" "
            autocomplete="name"
            required
          >

          <label class="field-label" for="name">
            Full name
          </label>

          <span class="field-accent" aria-hidden="true"></span>
        </div>

        <div class="field">
          <input
            class="field-input"
            type="email"
            id="email"
            name="email"
            placeholder=" "
            autocomplete="email"
            required
          >

          <label class="field-label" for="email">
            Email address
          </label>

          <span class="field-accent" aria-hidden="true"></span>
        </div>

        <div class="field">
          <input
            class="field-input"
            type="text"
            id="company"
            name="company"
            placeholder=" "
            autocomplete="organization"
          >

          <label class="field-label" for="company">
            Company
          </label>

          <span class="field-accent" aria-hidden="true"></span>
        </div>

        <div class="field field-textarea">
          <textarea
            class="field-input"
            id="message"
            name="message"
            placeholder=" "
            rows="4"
          ></textarea>

          <label class="field-label" for="message">
            Your message
          </label>

          <span class="field-accent" aria-hidden="true"></span>
        </div>

        <button class="submit-button" type="submit">
          <span>Continue</span>
          <span aria-hidden="true">→</span>
        </button>

      </form>

      <p class="helper-text">
        Pure CSS · Responsive · Reduced-motion friendly
      </p>
    </section>
  </main>

  <script>
    document.querySelector(".pastel-form").addEventListener(
      "submit",
      (event) => event.preventDefault()
    );
  </script>
</body>
</html>
