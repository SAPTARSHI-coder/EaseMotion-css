<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Michelson Interferometer Fringe — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Michelson Interferometer Fringe demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Michelson Interferometer Fringe</h1>
      <p class="lede">Michelson interferometer fringe pattern drifting on detector</p>
    </header>

    <section class="ease-michelson-interferometer-fringe" data-demo="michelson-interferometer-fringe" aria-live="polite">
      <div class="ease-michelson-interferometer-fringe__housing">
        <div class="ease-michelson-interferometer-fringe__bezel">
          <div class="ease-michelson-interferometer-fringe__face">
            <div class="ease-michelson-interferometer-fringe__readout">
              <span class="ease-michelson-interferometer-fringe__label">Michelson Interferometer Fringe</span>
              <span class="ease-michelson-interferometer-fringe__value">LIVE</span>
            </div>
            <div class="ease-michelson-interferometer-fringe__motion" aria-hidden="true">
              <span class="ease-michelson-interferometer-fringe__a"></span>
              <span class="ease-michelson-interferometer-fringe__b"></span>
              <span class="ease-michelson-interferometer-fringe__c"></span>
              <span class="ease-michelson-interferometer-fringe__d"></span>
            </div>
            <div class="ease-michelson-interferometer-fringe__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-michelson-interferometer-fringe__controls">
          <button type="button" class="ease-michelson-interferometer-fringe__btn primary">Engage</button>
          <button type="button" class="ease-michelson-interferometer-fringe__btn">Reset</button>
          <label class="ease-michelson-interferometer-fringe__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-michelson-interferometer-fringe__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
