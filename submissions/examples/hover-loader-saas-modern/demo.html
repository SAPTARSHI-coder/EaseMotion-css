<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />
  <meta
    name="description"
    content="CSS-only Hover Loader with a clean SaaS Modern design."
  />
  <title>SaaS Modern Hover Loader</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main class="page">
    <section class="loader-demo" aria-labelledby="loader-title">
      <div class="loader-card">
        <div class="loader-badge">
          <span class="status-dot" aria-hidden="true"></span>
          CSS Component
        </div>

        <h1 id="loader-title">Hover Loader</h1>

        <p class="loader-description">
          Move your cursor over the button to activate the
          SaaS-style loading animation.
        </p>

        <button class="hover-loader" type="button" aria-label="Hover loader">
          <span class="button-content">
            <span class="button-icon" aria-hidden="true">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  d="M12 5V3M12 21V19M5 12H3M21 12H19M6.05 6.05L4.64 4.64M19.36 19.36L17.95 17.95M17.95 6.05L19.36 4.64M4.64 19.36L6.05 17.95"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                />
              </svg>
            </span>

            <span class="button-text">Hover to Load</span>
          </span>

          <span class="loader" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
          </span>
        </button>

        <div class="loader-meta">
          <span>Pure CSS</span>
          <span class="meta-divider"></span>
          <span>Responsive</span>
          <span class="meta-divider"></span>
          <span>No JavaScript</span>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
