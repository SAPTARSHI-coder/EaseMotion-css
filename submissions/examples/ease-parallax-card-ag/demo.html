<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parallax Depth Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card-container">
        <div class="parallax-card">
            <div class="card-bg"></div>
            <div class="card-content">
                <h2>Parallax Depth</h2>
                <p>Hover over this card to see a stunning 3D parallax depth effect created entirely with CSS transforms.</p>
                <button class="card-btn">Explore</button>
            </div>
        </div>
    </div>
</body>
</html>
