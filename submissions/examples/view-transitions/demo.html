<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>View Transitions API Demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      padding: 40px;
      color: #333;
      max-width: 600px;
      margin: 0 auto;
    }
    .header {
      background: #6c63ff;
      color: white;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
      text-align: center;
    }
    .card {
      background: #f1f5f9;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      cursor: pointer;
    }
    .hero {
      background: #ff6584;
      color: white;
      padding: 60px 30px;
      border-radius: 8px;
      text-align: center;
      display: none; /* hidden by default */
    }
  </style>
</head>
<body>

  <!-- Using the view transition classes -->
  <div class="header em-view-transition-header" id="header">
    <h1>EaseMotion API</h1>
  </div>

  <div class="card em-view-transition-card" id="card" onclick="toggleView()">
    <h2>Click me to trigger View Transition</h2>
    <p>This card will animate out using the custom slide animation, and a hero block will animate in.</p>
  </div>

  <div class="hero em-view-transition-hero" id="hero" onclick="toggleView()">
    <h2>Hero Section</h2>
    <p>Click me to go back.</p>
  </div>

  <script>
    function updateDOM() {
      const card = document.getElementById('card');
      const hero = document.getElementById('hero');
      
      if (card.style.display === 'none') {
        card.style.display = 'block';
        hero.style.display = 'none';
      } else {
        card.style.display = 'none';
        hero.style.display = 'block';
      }
    }

    function toggleView() {
      // Fallback for browsers that don't support the API
      if (!document.startViewTransition) {
        updateDOM();
        return;
      }

      // Trigger the View Transition API
      document.startViewTransition(() => {
        updateDOM();
      });
    }
  </script>

</body>
</html>
