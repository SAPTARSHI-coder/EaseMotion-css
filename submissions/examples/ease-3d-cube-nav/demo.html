<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ease 3D Cube Perspective Navigation Menu</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="ease-cube-body">
  <div class="ease-cube-stage">
    <div class="ease-cube" id="cube">
      <div class="cube-face face-front">Home</div>
      <div class="cube-face face-right">About</div>
      <div class="cube-face face-back">Services</div>
      <div class="cube-face face-left">Contact</div>
    </div>
  </div>

  <div class="ease-cube-controls">
    <button onclick="rotateCube(0)">Front</button>
    <button onclick="rotateCube(-90)">Right</button>
    <button onclick="rotateCube(-180)">Back</button>
    <button onclick="rotateCube(-270)">Left</button>
  </div>

  <script>
    function rotateCube(deg) {
      document.getElementById('cube').style.transform = `rotateY(${deg}deg)`;
    }
  </script>
</body>
</html>
