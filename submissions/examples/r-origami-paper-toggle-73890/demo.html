<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Accessible pure CSS origami paper fold toggle"
  >
  <title>Origami Paper Fold Toggle</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="demo">
    <section class="showcase" aria-labelledby="title">
      <p class="eyebrow">PURE CSS COMPONENT</p>

      <h1 id="title">Origami Paper Fold</h1>

      <p class="description">
        A smooth toggle inspired by folded paper, created entirely with
        HTML and CSS.
      </p>

      <div class="toggle-card">
        <div class="toggle-copy">
          <span class="toggle-title">Paper Mode</span>
          <span class="toggle-status">Toggle the folded note</span>
        </div>

        <label class="origami-toggle">
          <input
            class="origami-toggle__input"
            type="checkbox"
            aria-label="Toggle paper mode"
          >

          <span class="origami-toggle__visual" aria-hidden="true">
            <span class="origami-toggle__base"></span>

            <span class="origami-toggle__fold origami-toggle__fold--left"></span>
            <span class="origami-toggle__fold origami-toggle__fold--right"></span>

            <span class="origami-toggle__sheet">
              <span class="origami-toggle__check"></span>
            </span>
          </span>
        </label>
      </div>

      <div class="state-note">
        <span class="state-note__dot"></span>
        <span>Keyboard accessible</span>
      </div>
    </section>
  </main>

</body>
</html>
