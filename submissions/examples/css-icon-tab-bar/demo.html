<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Icon Tab Bar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="tab-bar" aria-label="Icon Navigation">
    <input type="radio" name="tab" id="home" checked>
    <label for="home" class="tab">
      <span class="icon">🏠</span>
      <span class="text">Home</span>
    </label>

    <input type="radio" name="tab" id="search">
    <label for="search" class="tab">
      <span class="icon">🔍</span>
      <span class="text">Search</span>
    </label>

    <input type="radio" name="tab" id="favorite">
    <label for="favorite" class="tab">
      <span class="icon">❤️</span>
      <span class="text">Favorites</span>
    </label>

    <input type="radio" name="tab" id="profile">
    <label for="profile" class="tab">
      <span class="icon">👤</span>
      <span class="text">Profile</span>
    </label>
  </nav>
</body>
</html>
