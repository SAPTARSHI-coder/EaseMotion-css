<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shimmer Skeleton Loader Demo | EaseMotion CSS</title>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Demo Styling -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="demo-container">
      <!-- Header Section -->
      <header class="demo-header">
        <span class="badge">EaseMotion CSS Example</span>
        <h1 class="demo-title">Modern Shimmer Skeleton Loader</h1>
        <p class="demo-subtitle">
          Zero-dependency, accessible, responsive linear gradient shimmer
          animation for modern UI loading states.
        </p>
      </header>

      <!-- Card Grid Section -->
      <div class="card-grid">
        <!-- Card 1: User Profile Skeleton -->
        <article class="skeleton-card" aria-label="Loading Profile Card">
          <div class="card-header">
            <!-- Profile Avatar Skeleton -->
            <div class="skeleton skeleton-avatar"></div>
            <div class="header-text">
              <!-- User Name Skeleton -->
              <div class="skeleton skeleton-title"></div>
              <!-- User Handle/Role Skeleton -->
              <div class="skeleton skeleton-subtitle"></div>
            </div>
          </div>

          <div class="card-body">
            <!-- Text Paragraph Lines -->
            <div class="skeleton skeleton-text"></div>
            <div class="skeleton skeleton-text short"></div>
            <!-- Banner Image Placeholder -->
            <div class="skeleton skeleton-image"></div>
          </div>

          <div class="card-footer">
            <div class="skeleton skeleton-button"></div>
            <div class="skeleton skeleton-pill"></div>
          </div>
        </article>

        <!-- Card 2: Product Showcase Skeleton -->
        <article class="skeleton-card" aria-label="Loading Product Card">
          <div class="card-body">
            <!-- Product Media Placeholder -->
            <div class="skeleton skeleton-image media-hero"></div>
            <div class="skeleton skeleton-title full-width"></div>
            <div class="skeleton skeleton-text"></div>
            <div class="skeleton skeleton-text medium"></div>
          </div>

          <div class="card-footer space-between">
            <div class="skeleton skeleton-price"></div>
            <div class="skeleton skeleton-button-primary"></div>
          </div>
        </article>

        <!-- Card 3: Article / Feed Post Skeleton -->
        <article class="skeleton-card" aria-label="Loading Article Card">
          <div class="card-header">
            <div class="skeleton skeleton-avatar small"></div>
            <div class="header-text">
              <div class="skeleton skeleton-subtitle medium"></div>
            </div>
          </div>

          <div class="card-body">
            <div class="skeleton skeleton-title"></div>
            <div class="skeleton skeleton-text"></div>
            <div class="skeleton skeleton-text"></div>
            <div class="skeleton skeleton-text short"></div>
          </div>

          <div class="card-footer">
            <div class="skeleton skeleton-pill"></div>
            <div class="skeleton skeleton-pill"></div>
          </div>
        </article>
      </div>
    </main>
  </body>
</html>
