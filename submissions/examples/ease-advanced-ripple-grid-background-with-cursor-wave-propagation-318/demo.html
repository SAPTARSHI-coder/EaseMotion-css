<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advanced Ripple Grid Background</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="ripple-grid-container">
    <div class="grid-background"></div>
    <div class="cursor-glow" id="cursorGlow"></div>
    
    <div class="content-card">
      <h1>Wave Grid</h1>
      <p>Move your cursor to explore. Click to send a wave.</p>
    </div>
    
    <div class="interactive-layer" id="interactiveLayer"></div>
  </div>

  <script>
    const interactiveLayer = document.getElementById('interactiveLayer');
    const container = document.querySelector('.ripple-grid-container');

    // Update cursor position for the glow effect
    interactiveLayer.addEventListener('mousemove', (e) => {
      container.style.setProperty('--mouse-x', e.clientX);
      container.style.setProperty('--mouse-y', e.clientY);
    });

    // Create a wave ripple on click
    interactiveLayer.addEventListener('click', (e) => {
      const ripple = document.createElement('div');
      ripple.classList.add('wave-ripple');
      
      // Position the ripple at the click coordinates
      ripple.style.left = `${e.clientX}px`;
      ripple.style.top = `${e.clientY}px`;
      
      container.appendChild(ripple);
      
      // Remove the ripple element after the animation completes (1.5s match CSS animation)
      setTimeout(() => {
        ripple.remove();
      }, 1500);
    });
  </script>
</body>
</html>
