<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Responsive CSS receipt component demo"
  >
  <title>CSS Receipt Component</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="receipt-page">
    <article class="receipt" aria-labelledby="receipt-title">

      <header class="receipt__header">
        <div class="receipt__icon" aria-hidden="true">✓</div>

        <h1 id="receipt-title">Payment Successful</h1>
        <p class="receipt__subtitle">Thank you for your purchase!</p>
      </header>

      <div class="receipt__divider" aria-hidden="true"></div>

      <section class="receipt__details" aria-label="Order details">
        <div class="receipt__row">
          <span>Order ID</span>
          <strong>#EM-2026-0812</strong>
        </div>

        <div class="receipt__row">
          <span>Date</span>
          <strong>August 12, 2026</strong>
        </div>

        <div class="receipt__row">
          <span>Payment</span>
          <strong>Card •••• 4242</strong>
        </div>
      </section>

      <div class="receipt__divider" aria-hidden="true"></div>

      <section class="receipt__items" aria-label="Purchased items">
        <h2>Items</h2>

        <div class="receipt__item">
          <div>
            <strong>Premium Plan</strong>
            <span>1 × ₹799</span>
          </div>
          <strong>₹799</strong>
        </div>

        <div class="receipt__item">
          <div>
            <strong>Extra Storage</strong>
            <span>1 × ₹199</span>
          </div>
          <strong>₹199</strong>
        </div>
      </section>

      <div class="receipt__divider" aria-hidden="true"></div>

      <section class="receipt__summary" aria-label="Payment summary">
        <div class="receipt__row">
          <span>Subtotal</span>
          <span>₹998</span>
        </div>

        <div class="receipt__row">
          <span>Tax</span>
          <span>₹100</span>
        </div>

        <div class="receipt__row receipt__row--total">
          <span>Total</span>
          <strong>₹1,098</strong>
        </div>
      </section>

      <footer class="receipt__footer">
        <p>Thank you for choosing EaseMotion.</p>
        <small>Pure HTML &amp; CSS component</small>
      </footer>

    </article>
  </main>
</body>
</html>
