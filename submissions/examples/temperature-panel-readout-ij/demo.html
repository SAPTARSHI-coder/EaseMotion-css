<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-temperature-panel-readout demo</title>
</head>
<body>
<div class="tpr-app">
  <span class="tpr-title">CLIMATE PANEL</span>
  <div class="tpr-screen">
    <span class="tpr-temp">22</span>
    <span class="tpr-unit">C</span>
  </div>
  <div class="tpr-arrows">
    <span class="tpr-up">UP</span>
    <span class="tpr-down">DN</span>
  </div>
  <div class="tpr-dial">
    <span class="tpr-needle"></span>
  </div>
  <span class="tpr-humid">HUMIDITY 48%</span>
</div>
</body>
</html>
