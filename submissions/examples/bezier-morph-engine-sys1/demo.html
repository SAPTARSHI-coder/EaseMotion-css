<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dynamic Bezier Morphing Keyframe Engine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../easemotion.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>Dynamic Bezier Morphing Keyframe Engine</h1>
      <p>Interactive demonstration of CSS clip-path morphing using custom cubic-bezier curves.</p>
    </header>

    <main class="demo-stage">
      <div class="morph-card-container">
        <div class="morph-shape" id="morphTarget">
          <span class="morph-label">Morphing Vector</span>
        </div>
      </div>

      <div class="control-panel">
        <h3>Morph States</h3>
        <div class="button-group">
          <button class="btn" onclick="setMorphState('circle')">Circle</button>
          <button class="btn" onclick="setMorphState('star')">Star</button>
          <button class="btn" onclick="setMorphState('polygon')">Octagon</button>
          <button class="btn" onclick="setMorphState('badge')">Shield Badge</button>
        </div>
      </div>
    </main>
  </div>

  <script>
    function setMorphState(state) {
      const target = document.getElementById('morphTarget');
      target.className = 'morph-shape morph-' + state;
    }
  </script>
</body>
</html>
