<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fault Tolerant Quantum Teleportation Fidelity Verifiers QTFV - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css"></head><body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030712; color: #ffffff;">

    <div class="ease-card ease-card-glass qtfv-container">
        <div class="qtfv-header">
            <h2>Teleportation Fidelity Verifier</h2>
            <span class="ease-badge ease-badge-success">Fault-Tolerant Quantum</span>
        </div>
        
        <div class="qtfv-screen ease-center">
            <div class="qtfv-flux flux-qtfv-a"></div>
            <div class="qtfv-flux flux-qtfv-b"></div>
            <div class="qtfv-boundary-ring"></div>
            <div class="qtfv-core ease-center"></div>
        </div>

        <div class="qtfv-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">State Tomography &amp; Acceptance Threshold Validation</span>
            <button class="ease-btn ease-btn-success ease-btn-sm ease-hover-grow">Run Fidelity Verifier</button>
        </div>
    </div></body></html>
