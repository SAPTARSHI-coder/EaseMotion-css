<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Online Status Dot &mdash; EaseMotion CSS Demo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="page-head">
    <p class="kicker">EaseMotion CSS &middot; Social &amp; Chat</p>
    <h1>Online Status Dot</h1>
    <p class="sub">A glowing presence dot that softly breathes to show who's around.</p>
  </header>
  <main class="stage">
    <div class="os-user">
      RM
      <span class="os-dot"></span>
    </div>
    <p class="os-label">Online</p>
  </main>
  <p class="stage-caption">The halo ring expands and fades in a calm loop.</p>
  <footer class="page-foot">
    <span>Pure CSS &middot; zero dependencies</span>
    <span>Breathing halo</span>
  </footer>
</body>
</html>
