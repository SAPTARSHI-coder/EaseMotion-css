<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CSS Magnet Loader</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="ease-magnet-loader" 
     role="status" 
     aria-label="Magnetic loading animation">

    <h1>MAGNET LOADER</h1>

    <div class="magnet-system">

        <span class="dot dot-one"></span>
        <span class="dot dot-two"></span>
        <span class="dot dot-three"></span>
        <span class="dot dot-four"></span>
        <span class="dot dot-five"></span>

    </div>

    <p>Magnetic attraction active</p>

</div>


</body>
</html>
