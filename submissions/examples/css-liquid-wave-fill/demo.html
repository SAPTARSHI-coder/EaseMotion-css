<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Accessible pure CSS liquid wave fill loader."
  >

  <title>CSS Liquid Wave Fill Loader</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="page">
    <section
      class="loader-demo"
      aria-labelledby="loader-title"
    >
      <div class="loader-content">
        <p class="eyebrow">CSS Loader</p>

        <h1 id="loader-title">Liquid Wave Fill</h1>

        <div
          class="liquid-loader"
          role="status"
          aria-label="Loading"
        >
          <span class="loader-wave loader-wave--back"></span>
          <span class="loader-wave loader-wave--front"></span>

          <span class="loader-glow" aria-hidden="true"></span>

          <span class="loader-percent" aria-hidden="true">
            <span>Loading</span>
          </span>
        </div>

        <p class="loader-description">
          A smooth liquid wave animation created entirely with HTML and CSS.
        </p>

        <span class="sr-only">Content is loading</span>
      </div>
    </section>
  </main>
</body>
</html>
