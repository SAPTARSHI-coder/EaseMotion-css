<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.5">
<title>Analog Stopwatch</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stopwatch">
  <header class="watch-head">
    <h1 class="watch-name">CHRONO</h1>
    <p class="watch-mode">SPLIT TIMES</p>
  </header>
  <section class="watch-face" aria-label="Stopwatch dial">
    <div class="main-dial">
      <span class="tick tick-a">60</span>
      <span class="tick tick-b">15</span>
      <span class="tick tick-c">30</span>
      <span class="tick tick-d">45</span>
      <span class="second-hand"></span>
      <span class="split-hand"></span>
      <span class="dial-hub"></span>
    </div>
    <div class="sub-dial"><span class="minute-hand"></span></div>
  </section>
  <section class="watch-buttons" aria-label="Stopwatch buttons">
    <button class="btn btn-start" type="button">START</button>
    <button class="btn btn-lap" type="button">LAP</button>
    <button class="btn btn-reset" type="button">RESET</button>
  </section>
  <footer class="watch-foot">
    <span class="watch-lap">LAP 4</span>
    <span class="watch-time">01:12</span>
  </footer>
</main>
</body>
</html>
