<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CSS glitch-flicker dropdown for glassmorphism UI layouts">
  <title>Glitch-Flicker Dropdown — Glassmorphism</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="gfd-nav">
    <span class="gfd-nav__brand">Prism</span>
    <span class="gfd-nav__gap"></span>

    <div class="gfd-dd">
      <button class="gfd-dd__trigger" aria-haspopup="true" aria-expanded="false">
        Product
        <span class="gfd-dd__chev"></span>
      </button>
      <ul class="gfd-dd__menu" role="menu">
        <li role="menuitem" class="gfd-dd__item">Overview</li>
        <li role="menuitem" class="gfd-dd__item">Features</li>
        <li role="menuitem" class="gfd-dd__item">Changelog</li>
      </ul>
    </div>

    <div class="gfd-dd">
      <button class="gfd-dd__trigger" aria-haspopup="true" aria-expanded="false">
        Developers
        <span class="gfd-dd__chev"></span>
      </button>
      <ul class="gfd-dd__menu" role="menu">
        <li role="menuitem" class="gfd-dd__item">Documentation</li>
        <li role="menuitem" class="gfd-dd__item">API Reference</li>
        <li role="menuitem" class="gfd-dd__item">Status</li>
      </ul>
    </div>

    <span class="gfd-nav__item">Pricing</span>
    <span class="gfd-nav__item gfd-nav__item--cta">Sign Up</span>
  </nav>

  <section class="gfd-hero">
    <h1 class="gfd-hero__title">Build faster with confidence</h1>
    <p class="gfd-hero__sub">A modern platform for shipping reliable software at scale.</p>
  </section>

</body>
</html>
