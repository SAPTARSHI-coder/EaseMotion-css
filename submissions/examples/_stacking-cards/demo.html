<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stacking Cards</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card-stack">

    <div class="card card-1">
      <span>01</span>
      <h2>Creative</h2>
      <p>Build beautiful and modern interfaces.</p>
    </div>

    <div class="card card-2">
      <span>02</span>
      <h2>Modern</h2>
      <p>Create smooth and interactive experiences.</p>
    </div>

    <div class="card card-3">
      <span>03</span>
      <h2>Powerful</h2>
      <p>Bring your ideas to life with CSS.</p>
    </div>

    <div class="card card-4">
      <span>04</span>
      <h2>Simple</h2>
      <p>Clean code with impressive visual effects.</p>
    </div>

  </div>

</body>
</html>
