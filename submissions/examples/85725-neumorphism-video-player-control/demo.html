<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      Neumorphic Custom Video Player Control Component (ease-neu-video-player)
    </title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="demo-container">
      <header class="demo-header">
        <div class="header-badge">SOFT UI MEDIA CONTROL</div>
        <h1 class="demo-title">NEUMORPHIC VIDEO PLAYER CONTROL</h1>
        <p class="demo-subtitle">
          Pure HTML + Vanilla CSS Soft Extruded &amp; Inset Control Surface
          without JavaScript
        </p>
      </header>

      <!-- Main Neumorphic Video Player Stage & Control Surface -->
      <section class="player-showcase-card">
        <div class="ease-neu-video-player">
          <!-- Soft Video Stage Canvas -->
          <div class="ease-neu-video-stage">
            <div class="stage-ambient-glow" aria-hidden="true"></div>

            <!-- Media Badge -->
            <div class="stage-media-badge">1080P // SOFT UI</div>

            <!-- Center Overlay Play Button -->
            <button
              type="button"
              class="ease-neu-center-play"
              aria-label="Play Neumorphic Video"
            >
              <svg
                class="play-icon"
                viewBox="0 0 24 24"
                width="32"
                height="32"
                aria-hidden="true"
                fill="currentColor"
              >
                <path d="M8 5v14l11-7z" />
              </svg>
            </button>
          </div>

          <!-- Neumorphic Control Bar Surface -->
          <div
            class="ease-neu-control-bar"
            role="toolbar"
            aria-label="Neumorphic Video Controls"
          >
            <!-- Inset Timeline Seek Slider -->
            <div class="ease-neu-timeline-container">
              <label for="neu-seek-range" class="sr-only"
                >Seek video timeline</label
              >
              <input
                type="range"
                id="neu-seek-range"
                class="ease-neu-seek-slider"
                min="0"
                max="100"
                value="52"
                aria-valuemin="0"
                aria-valuemax="100"
                aria-valuenow="52"
                aria-valuetext="01:45 of 03:20"
              />
            </div>

            <!-- Bottom Controls Row -->
            <div class="ease-neu-controls-row">
              <!-- Left Controls: Play/Pause & Soft Time Readout -->
              <div class="controls-group-left">
                <button
                  type="button"
                  class="neu-ctrl-btn play-pause-btn"
                  aria-label="Play / Pause"
                >
                  <svg
                    class="ctrl-icon"
                    viewBox="0 0 24 24"
                    width="20"
                    height="20"
                    aria-hidden="true"
                    fill="currentColor"
                  >
                    <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" />
                  </svg>
                </button>

                <div class="neu-time-readout" aria-label="Time Elapsed">
                  <span class="neu-time-current">01:45</span>
                  <span class="neu-time-divider">/</span>
                  <span class="neu-time-duration">03:20</span>
                </div>
              </div>

              <!-- Right Controls: Volume, Quality, Settings, Fullscreen -->
              <div class="controls-group-right">
                <!-- Volume Group with Inset Slider Popup -->
                <div class="volume-control-wrapper">
                  <button
                    type="button"
                    class="neu-ctrl-btn volume-btn"
                    aria-label="Volume / Mute"
                  >
                    <svg
                      class="ctrl-icon"
                      viewBox="0 0 24 24"
                      width="20"
                      height="20"
                      aria-hidden="true"
                      fill="currentColor"
                    >
                      <path
                        d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"
                      />
                    </svg>
                  </button>

                  <div class="volume-slider-popup">
                    <label for="neu-volume-range" class="sr-only"
                      >Adjust Volume</label
                    >
                    <input
                      type="range"
                      id="neu-volume-range"
                      class="ease-neu-volume-slider"
                      min="0"
                      max="100"
                      value="75"
                      aria-label="Adjust Volume"
                    />
                  </div>
                </div>

                <!-- Quality Badge -->
                <button
                  type="button"
                  class="neu-ctrl-btn quality-badge-btn"
                  aria-label="Resolution Quality"
                >
                  HD
                </button>

                <!-- Settings Gear Button -->
                <button
                  type="button"
                  class="neu-ctrl-btn settings-btn"
                  aria-label="Player Settings"
                >
                  <svg
                    class="ctrl-icon"
                    viewBox="0 0 24 24"
                    width="20"
                    height="20"
                    aria-hidden="true"
                    fill="currentColor"
                  >
                    <path
                      d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"
                    />
                  </svg>
                </button>

                <!-- Fullscreen Button -->
                <button
                  type="button"
                  class="neu-ctrl-btn fullscreen-btn"
                  aria-label="Toggle Fullscreen"
                >
                  <svg
                    class="ctrl-icon"
                    viewBox="0 0 24 24"
                    width="20"
                    height="20"
                    aria-hidden="true"
                    fill="currentColor"
                  >
                    <path
                      d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"
                    />
                  </svg>
                </button>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- Demo Keyboard Instructions Footer -->
      <footer class="demo-footer">
        <div class="keyboard-instruction">
          <span class="type-key">TAB</span> Focus controls &bull;
          <span class="type-key">EMBOSSED / INSET</span> Neumorphic soft shadows
          &bull; <span class="type-key">REDUCED MOTION</span> Static control
          surface
        </div>
      </footer>
    </main>
  </body>
</html>
