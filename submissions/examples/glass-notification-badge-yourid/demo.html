<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Glassmorphism Notification Badge</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; gap: 2rem;
           font-family: Inter, system-ui, sans-serif; color: #fff;
           background: linear-gradient(135deg, #4f46e5, #ec4899, #f59e0b); padding: 2rem; }
    .row { display: flex; flex-wrap: wrap; gap: 2rem; align-items: center; justify-content: center; }
    .btn { padding: 0.75rem 1.5rem; border: 0; border-radius: 0.75rem; font-size: 1rem;
           background: rgba(0,0,0,.35); color: #fff; }
  </style>
</head>
<body>
  <h1>Glass Notification Badges</h1>
  <div class="row">
    <span class="ease-badge-glass-yourid" tabindex="0" role="status" aria-label="3 new notifications">3</span>
    <span class="ease-badge-glass-yourid is-success" tabindex="0" role="status" aria-label="Success">✓</span>
    <span class="ease-badge-glass-yourid is-warning" tabindex="0" role="status" aria-label="12 warnings">12</span>
    <span class="ease-badge-glass-yourid is-danger ease-badge-pulse-yourid" tabindex="0" role="status" aria-label="99 plus alerts">99+</span>
    <span class="ease-badge-glass-yourid is-read" tabindex="0" role="status" aria-label="Read">5</span>
    <span class="ease-badge-glass-yourid is-dot is-danger ease-badge-pulse-yourid" role="status" aria-label="New alert"></span>
  </div>
  <div class="row">
    <span class="ease-badge-anchor-yourid">
      <button class="btn">Inbox</button>
      <span class="ease-badge-glass-yourid is-danger ease-badge-pulse-yourid" aria-label="8 unread">8</span>
    </span>
  </div>
</body>
</html>
