<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Machine Learning QML - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css"></head><body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030712; color: #ffffff;">

    <div class="ease-card ease-card-glass qml-container">
        <div class="qml-header">
            <h2>Quantum Machine Learning</h2>
            <span class="ease-badge ease-badge-secondary">Training</span>
        </div>
        
        <div class="qml-screen ease-center">
            <div class="qml-flux flux-qml-a"></div>
            <div class="qml-flux flux-qml-b"></div>
            <div class="qml-boundary-ring"></div>
            <div class="qml-core ease-center"></div>
        </div>

        <div class="qml-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Parameterized Kernels &amp; Quantum Neural Nets</span>
            <button class="ease-btn ease-btn-secondary ease-btn-sm ease-hover-grow">Run QML Training</button>
        </div>
    </div></body></html>
