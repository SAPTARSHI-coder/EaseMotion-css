<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Pagination: Neon</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header class="header">
            <h1 class="neon-title">DATA PAGES</h1>
            <p>Pure CSS pagination with interactive glowing states.</p>
        </header>

        <main class="content-area">
            
            <nav aria-label="Pagination Navigation" class="neon-pagination-nav">
                <ul class="neon-pagination">
                    
                    <!-- Previous Button -->
                    <li class="page-item">
                        <a href="#" class="page-link prev-next" aria-label="Previous">
                            <span aria-hidden="true">&laquo;</span>
                        </a>
                    </li>
                    
                    <!-- Page Numbers -->
                    <li class="page-item"><a href="#" class="page-link">1</a></li>
                    <li class="page-item"><a href="#" class="page-link">2</a></li>
                    
                    <!-- Active Page -->
                    <li class="page-item active" aria-current="page">
                        <a href="#" class="page-link">3</a>
                    </li>
                    
                    <li class="page-item"><a href="#" class="page-link">4</a></li>
                    <li class="page-item"><a href="#" class="page-link">5</a></li>
                    
                    <!-- Next Button -->
                    <li class="page-item">
                        <a href="#" class="page-link prev-next" aria-label="Next">
                            <span aria-hidden="true">&raquo;</span>
                        </a>
                    </li>
                    
                </ul>
            </nav>

        </main>
    </div>

</body>
</html>
