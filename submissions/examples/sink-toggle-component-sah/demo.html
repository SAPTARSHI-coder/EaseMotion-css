<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sink Toggle Switch Component - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="showcase">
    <h1>Sink Toggle Component (<code>#54665</code>)</h1>
    <p class="subtitle">Tactile toggle switches that depress down into recessed background grooves with realistic physical damping when clicked.</p>
    
    <div class="toggles-stack">
      <label class="toggle-row">
        <span>⚡ Hardware GPU Acceleration</span>
        <div class="ease-toggle-sink">
          <input type="checkbox" checked />
          <div class="slider blue"></div>
        </div>
      </label>

      <label class="toggle-row">
        <span>🚀 Automated PR Submission</span>
        <div class="ease-toggle-sink">
          <input type="checkbox" checked />
          <div class="slider emerald"></div>
        </div>
      </label>

      <label class="toggle-row">
        <span>🛡️ Strict Lint Rules Enforcement</span>
        <div class="ease-toggle-sink">
          <input type="checkbox" />
          <div class="slider purple"></div>
        </div>
      </label>
    </div>
  </div>
</body>
</html>
