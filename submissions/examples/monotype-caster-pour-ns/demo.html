<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monotype Caster Pour — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Monotype Caster Pour demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Monotype Caster Pour</h1>
      <p class="lede">Monotype caster molten metal pour</p>
    </header>

    <section class="ease-monotype-caster-pour" data-demo="monotype-caster-pour" aria-live="polite">
      <div class="ease-monotype-caster-pour__housing">
        <div class="ease-monotype-caster-pour__bezel">
          <div class="ease-monotype-caster-pour__face">
            <div class="ease-monotype-caster-pour__readout">
              <span class="ease-monotype-caster-pour__label">Monotype Caster Pour</span>
              <span class="ease-monotype-caster-pour__value">LIVE</span>
            </div>
            <div class="ease-monotype-caster-pour__motion" aria-hidden="true">
              <span class="ease-monotype-caster-pour__a"></span>
              <span class="ease-monotype-caster-pour__b"></span>
              <span class="ease-monotype-caster-pour__c"></span>
              <span class="ease-monotype-caster-pour__d"></span>
            </div>
            <div class="ease-monotype-caster-pour__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-monotype-caster-pour__controls">
          <button type="button" class="ease-monotype-caster-pour__btn primary">Engage</button>
          <button type="button" class="ease-monotype-caster-pour__btn">Reset</button>
          <label class="ease-monotype-caster-pour__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-monotype-caster-pour__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
