<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Darkroom Safelight — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Darkroom Safelight demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Darkroom Safelight</h1>
      <p class="lede">Darkroom safelight glowing while a print develops</p>
    </header>

    <section class="ease-darkroom-safelight" data-demo="darkroom-safelight" aria-live="polite">
      <div class="ease-darkroom-safelight__housing">
        <div class="ease-darkroom-safelight__bezel">
          <div class="ease-darkroom-safelight__face">
            <div class="ease-darkroom-safelight__readout">
              <span class="ease-darkroom-safelight__label">Darkroom Safelight</span>
              <span class="ease-darkroom-safelight__value">LIVE</span>
            </div>
            <div class="ease-darkroom-safelight__motion" aria-hidden="true">
              <span class="ease-darkroom-safelight__a"></span>
              <span class="ease-darkroom-safelight__b"></span>
              <span class="ease-darkroom-safelight__c"></span>
              <span class="ease-darkroom-safelight__d"></span>
            </div>
            <div class="ease-darkroom-safelight__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-darkroom-safelight__controls">
          <button type="button" class="ease-darkroom-safelight__btn primary">Engage</button>
          <button type="button" class="ease-darkroom-safelight__btn">Reset</button>
          <label class="ease-darkroom-safelight__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-darkroom-safelight__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
