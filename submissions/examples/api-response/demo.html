<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS API Response Badge</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="badge-container">
        <h1>API Response Badges</h1>
        <div class="badge success">200 OK</div>
        <div class="badge error">500 ERROR</div>
        <div class="badge loading">Loading...</div>
        <div class="badge warning">404 Not Found</div>
    </div>
</body>

</html>
