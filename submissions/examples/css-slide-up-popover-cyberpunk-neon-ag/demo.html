<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Slide-Up Popover - Cyberpunk Neon Layouts</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <div class="popover-container">
    <button class="cyber-button" aria-haspopup="true" aria-expanded="false">
      Connect Uplink
    </button>
    <div class="popover-content" role="tooltip">
      <h3 class="popover-title">Uplink Status</h3>
      <p class="popover-text">Secure connection established. Ready for data transfer.</p>
    </div>
  </div>

</body>
</html>
