<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.1">
<title>Weather Vane Wind</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="vane-rig">
  <header class="vane-head">
    <h1 class="vane-title">ROOF RIG</h1>
    <p class="vane-gust">GUST 24</p>
  </header>
  <section class="vane-scene" aria-label="Weather vane on a roof">
    <div class="vane-tower">
      <span class="vane-letter letter-n">N</span>
      <span class="vane-letter letter-e">E</span>
      <span class="vane-letter letter-s">S</span>
      <span class="vane-letter letter-w">W</span>
      <div class="vane-arrow">
        <span class="arrow-head"></span>
        <span class="arrow-shaft"></span>
        <span class="arrow-tail"></span>
      </div>
      <span class="vane-pivot"></span>
      <span class="vane-mast"></span>
      <span class="vane-ball"></span>
    </div>
    <div class="roof-tiles"></div>
  </section>
  <footer class="vane-foot">
    <span class="vane-bearing">BEARING 042</span>
    <span class="vane-wind">NW 5</span>
  </footer>
</main>
</body>
</html>
