<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Pagination: Hover Dark Mode Styling - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="em-demo-container">
        <!-- Pure CSS Hover Pagination Component Showcase -->
        <header class="em-pagination-card" role="region" aria-label="Hover Dark Mode Pagination Showcase" tabindex="0">
            <div class="em-pagination-header-bar">
                <span class="em-card-badge">COMPONENT VARIANT</span>
                <span class="em-brand-logo">DarkPagination</span>
            </div>
            <h1 class="em-card-title">Hover Pagination</h1>
            <p class="em-card-desc">A fully responsive, zero-JS pure CSS pagination navigation component featuring immersive dark mode styling, frosted glassmorphism, and smooth hover elevation lifts.</p>
            <div class="em-pagination-wrapper">
                <nav class="ease-hover-pagination" aria-label="Pagination Navigation" tabindex="0">
                    <button class="em-page-btn" aria-label="Previous Page">Prev</button>
                    <div class="em-page-numbers">
                        <a href="#" class="em-page-item">1</a>
                        <a href="#" class="em-page-item active" aria-current="page">2</a>
                        <a href="#" class="em-page-item">3</a>
                        <span class="em-page-dots">...</span>
                        <a href="#" class="em-page-item">10</a>
                    </div>
                    <button class="em-page-btn" aria-label="Next Page">Next</button>
                </nav>
            </div>
        </header>
    </div>
</body>
</html>
