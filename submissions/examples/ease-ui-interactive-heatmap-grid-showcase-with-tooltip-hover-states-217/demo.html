<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Heatmap</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="heatmap">

<div class="cell high" data-value="96%"></div>
<div class="cell medium" data-value="74%"></div>
<div class="cell low" data-value="32%"></div>
<div class="cell medium" data-value="68%"></div>

<div class="cell low" data-value="25%"></div>
<div class="cell high" data-value="91%"></div>
<div class="cell medium" data-value="60%"></div>
<div class="cell high" data-value="88%"></div>

<div class="cell medium" data-value="58%"></div>
<div class="cell high" data-value="99%"></div>
<div class="cell low" data-value="19%"></div>
<div class="cell medium" data-value="70%"></div>

<div class="cell high" data-value="94%"></div>
<div class="cell medium" data-value="63%"></div>
<div class="cell low" data-value="27%"></div>
<div class="cell high" data-value="90%"></div>

</div>

</body>
</html>
