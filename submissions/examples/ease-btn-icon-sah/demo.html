<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Icon Button Variants - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="btn-gallery">
    <h1>Icon Button Variants (<code>ease-btn-icon</code>)</h1>
    <div class="button-row">
      <button class="ease-btn-icon square" title="Settings">⚙️</button>
      <button class="ease-btn-icon square accent" title="Like">❤️</button>
      <button class="ease-btn-icon circle primary" title="Add">➕</button>
      <button class="ease-btn-icon circle success" title="Confirm">✓</button>
      <button class="ease-btn-icon circle danger" title="Delete">🗑️</button>
    </div>
  </main>
</body>
</html>
