<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Elastic-Slide Badge - Minimalist Tech</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="layout-container">
        
        <header class="section-header">
            <h1 class="title">System Log Tags</h1>
            <p class="subtitle">A minimalist tech badge component featuring a staggered, elastic horizontal slide-in entrance.</p>
        </header>

        <div class="dashboard-area">
            
            <div class="card">
                
                <!-- 
                   Pure CSS State Management for Badge Container 
                   We use a checkbox to toggle the state to replay the entrance animation.
                -->
                <div class="controls">
                    <input type="checkbox" id="replay-toggle" class="replay-input" checked>
                    <label for="replay-toggle" class="btn-replay">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"></polyline><polyline points="23 20 23 14 17 14"></polyline><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"></path></svg>
                        Replay Entrance
                    </label>
                    
                    <div class="badge-container elastic-slide-group">
                        
                        <!-- Badge 1 -->
                        <div class="badge color-gray delay-1">
                            <svg class="badge-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"></path></svg>
                            <span class="badge-text">syslog</span>
                        </div>
                        
                        <!-- Badge 2 -->
                        <div class="badge color-blue delay-2">
                            <span class="badge-dot"></span>
                            <span class="badge-text">auth.info</span>
                        </div>
                        
                        <!-- Badge 3 -->
                        <div class="badge color-emerald delay-3">
                            <span class="badge-dot"></span>
                            <span class="badge-text">cron.success</span>
                        </div>
                        
                        <!-- Badge 4 -->
                        <div class="badge color-red delay-4">
                            <svg class="badge-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
                            <span class="badge-text">kernel.panic</span>
                        </div>
                        
                    </div>
                </div>
                
            </div>
            
        </div>
    </div>

</body>
</html>
