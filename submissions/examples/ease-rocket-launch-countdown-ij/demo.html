<!-- EaseMotion component: rocket-launch-countdown -->
<!DOCTYPE html>
<html lang="en" data-rocket="count">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.4">
<title>Ease Rocket Launch Countdown</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="launch-complex">
  <header class="launch-head">
    <span class="launch-mission">APOLLO-X</span>
    <span class="launch-count">T-09</span>
  </header>
  <div class="launch-sky">
    <span class="sky-star sk-1"></span>
    <span class="sky-star sk-2"></span>
    <span class="sky-star sk-3"></span>
  </div>
  <div class="launch-pad">
    <span class="rocket">
      <span class="rocket-nose"></span>
      <span class="rocket-body"></span>
      <span class="rocket-window"></span>
      <span class="rocket-fin fin-left"></span>
      <span class="rocket-fin fin-right"></span>
      <span class="rocket-nozzle"></span>
      <span class="rocket-flame"></span>
    </span>
    <span class="gantry">
      <span class="gantry-arm"></span>
      <span class="gantry-leg"></span>
    </span>
  </div>
  <footer class="launch-foot">
    <span class="launch-wind">WIND 6KTS</span>
    <span class="launch-go">GO</span>
  </footer>
</main>
</body>
</html>
