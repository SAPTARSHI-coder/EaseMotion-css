<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Relative Color Syntax - ps</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="relative-color-container-ps">
    <div class="color-card-ps blue-ps">
      <div class="card-header-ps">
        <h3>Pro Plan</h3>
        <span class="badge-ps">Popular</span>
      </div>
      <div class="card-body-ps">
        <div class="price-ps">$29<span>/mo</span></div>
        <ul class="features-ps">
          <li>Advanced Analytics</li>
          <li>Custom Domain</li>
          <li>Priority Support</li>
        </ul>
        <button class="action-btn-ps">Subscribe Now</button>
      </div>
    </div>

    <div class="color-card-ps emerald-ps">
      <div class="card-header-ps">
        <h3>Team Plan</h3>
        <span class="badge-ps">Best Value</span>
      </div>
      <div class="card-body-ps">
        <div class="price-ps">$79<span>/mo</span></div>
        <ul class="features-ps">
          <li>Everything in Pro</li>
          <li>Up to 10 Users</li>
          <li>Team Dashboards</li>
        </ul>
        <button class="action-btn-ps">Subscribe Now</button>
      </div>
    </div>
    
    <div class="color-card-ps rose-ps">
      <div class="card-header-ps">
        <h3>Enterprise</h3>
        <span class="badge-ps">Premium</span>
      </div>
      <div class="card-body-ps">
        <div class="price-ps">$199<span>/mo</span></div>
        <ul class="features-ps">
          <li>Unlimited Users</li>
          <li>Dedicated Account Manager</li>
          <li>SLA Guarantee</li>
        </ul>
        <button class="action-btn-ps">Contact Sales</button>
      </div>
    </div>
  </div>
</body>
</html>
