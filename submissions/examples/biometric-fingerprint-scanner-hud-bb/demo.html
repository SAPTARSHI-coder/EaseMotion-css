<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Biometric Fingerprint Scanner HUD - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="scanner-container">
    <div class="scanner-header">
      <div class="security-badge">
        <span class="lock-icon">🔒</span>
        <span class="security-level">LEVEL 4 AUTHENTICATION</span>
      </div>
      <h1 class="scanner-title">Biometric Scanner HUD</h1>
      <p class="scanner-subtitle">Pure CSS laser line scanner with fingerprint arc mesh & verification glow states</p>
    </div>

    <div class="scanner-screen">
      <div class="scanner-laser"></div>
      
      <div class="fingerprint-graphic">
        <div class="fp-arc arc-1"></div>
        <div class="fp-arc arc-2"></div>
        <div class="fp-arc arc-3"></div>
        <div class="fp-arc arc-4"></div>
        <div class="fp-arc arc-5"></div>
      </div>

      <div class="hud-corners">
        <span class="corner top-left"></span>
        <span class="corner top-right"></span>
        <span class="corner bottom-left"></span>
        <span class="corner bottom-right"></span>
      </div>
    </div>

    <div class="scanner-status">
      <div class="status-box">
        <span class="status-label">SCANNER STATUS</span>
        <span class="status-val active">VERIFYING BIOMETRICS...</span>
      </div>
      <div class="status-box">
        <span class="status-label">MATCH CONFIDENCE</span>
        <span class="status-val glow">99.8% MATCH</span>
      </div>
    </div>
  </div>
</body>
</html>
