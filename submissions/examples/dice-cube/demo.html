<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dice Cube &mdash; EaseMotion CSS Demo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="page-head">
    <p class="kicker">EaseMotion CSS &middot; Games &amp; Play</p>
    <h1>Dice Cube</h1>
    <p class="sub">A dice that tumbles through space and keeps rolling its faces.</p>
  </header>
  <main class="stage">
    <div class="dc-scene">
      <div class="dc-cube">
        <div class="dc-face f1"><div class="dc-pips"></div></div>
        <div class="dc-face f2"><div class="dc-pips"></div></div>
        <div class="dc-face f3"><div class="dc-pips"></div></div>
        <div class="dc-face f4"><div class="dc-pips"></div></div>
        <div class="dc-face f5"><div class="dc-pips"></div></div>
        <div class="dc-face f6"><div class="dc-pips"></div></div>
      </div>
    </div>
  </main>
  <p class="stage-caption">Six faces, endless combinations, pure CSS motion.</p>
  <footer class="page-foot">
    <span>Pure CSS &middot; zero dependencies</span>
    <span>Preserve-3d roll</span>
  </footer>
</body>
</html>
