<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hyper-Spatial Wormhole Warp Gate - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030308; color: #ffffff;">

    <div class="ease-card ease-card-glass wormhole-container">
        <div class="wormhole-header">
            <h2>Warp Gate</h2>
            <span class="ease-badge ease-badge-success">Stabilized</span>
        </div>
        
        <div class="wormhole-screen ease-center">
            <div class="spacetime-vortex vortex-1"></div>
            <div class="spacetime-vortex vortex-2"></div>
            <div class="event-horizon-gate"></div>
            <div class="singularity-throat ease-center"></div>
        </div>

        <div class="wormhole-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Coordinates: Alpha-9</span>
            <button class="ease-btn ease-btn-primary ease-btn-sm ease-hover-grow">Engage Jump</button>
        </div>
    </div>

</body>
</html>
