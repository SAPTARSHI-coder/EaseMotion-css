<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        Morph-Glow Progress Bar | EaseMotion CSS
    </title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<main class="container">


<section class="hero">

    <span class="badge">
        EaseMotion CSS
    </span>


    <h1>
        CSS Morph-Glow Progress Bar
    </h1>


    <p>
        A pure CSS animated progress bar with
        morphing glow effects designed for
        responsive dashboard layouts.
    </p>

</section>




<section class="dashboard" aria-label="Progress Dashboard">


    <article class="progress-card">


        <h2>
            Frontend Development
        </h2>


        <div class="progress-track">


            <div class="progress-fill first">

                <span>
                    85%
                </span>

            </div>


        </div>


    </article>





    <article class="progress-card">


        <h2>
            Backend Development
        </h2>


        <div class="progress-track">


            <div class="progress-fill second">

                <span>
                    75%
                </span>

            </div>


        </div>


    </article>





    <article class="progress-card">


        <h2>
            Artificial Intelligence
        </h2>


        <div class="progress-track">


            <div class="progress-fill third">

                <span>
                    90%
                </span>

            </div>


        </div>


    </article>



</section>


</main>


</body>

</html>
