<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Pure CSS solar flare radial background animation"
  >

  <title>CSS Solar Flare Radial</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="solar-scene">
    <div class="solar-flare flare-one" aria-hidden="true"></div>
    <div class="solar-flare flare-two" aria-hidden="true"></div>
    <div class="solar-flare flare-three" aria-hidden="true"></div>

    <div class="solar-core" aria-hidden="true"></div>

    <div class="solar-ray ray-one" aria-hidden="true"></div>
    <div class="solar-ray ray-two" aria-hidden="true"></div>
    <div class="solar-ray ray-three" aria-hidden="true"></div>
    <div class="solar-ray ray-four" aria-hidden="true"></div>

    <section class="solar-content">
      <span class="eyebrow">CSS Background Animation</span>

      <h1>Solar Flare</h1>

      <p>
        A radiant radial background effect inspired by the
        dynamic energy of solar flares.
      </p>

      <div class="status">
        <span class="status-dot"></span>
        Pure CSS · No JavaScript
      </div>
    </section>
  </main>
</body>
</html>
