<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Tilt Card Grid</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="card-grid">

  <article class="tilt-card" tabindex="0">
    <h3>Design</h3>
    <p>Create beautiful user experiences with modern layouts.</p>
  </article>

  <article class="tilt-card" tabindex="0">
    <h3>Development</h3>
    <p>Build responsive and scalable web applications.</p>
  </article>

  <article class="tilt-card" tabindex="0">
    <h3>Marketing</h3>
    <p>Grow your audience through effective campaigns.</p>
  </article>

  <article class="tilt-card" tabindex="0">
    <h3>Analytics</h3>
    <p>Gain insights and make data-driven decisions.</p>
  </article>

</div>

</body>
</html>
