<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ease-sticker-peel — Corner Peel Demo</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { min-height: 100vh; background: #f0ede6; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2.5rem; font-family: system-ui, sans-serif; padding: 2rem; }
    h1 { font-size: 1.3rem; font-weight: 400; color: #2a2a3a; }
    .demo-row { display: flex; gap: 2.5rem; flex-wrap: wrap; justify-content: center; }
    .demo-card { display: flex; flex-direction: column; align-items: center; gap: 0.75rem; }
    .demo-card span { font-size: 0.8rem; color: #7a6a5a; }
    .sticker { width: var(--sticker-width); height: var(--sticker-height); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; border-radius: 8px; background: var(--sticker-bg); color: white; font-weight: 700; font-size: 0.9rem; text-align: center; padding: 1rem; box-shadow: var(--sticker-shadow-depth) var(--sticker-shadow-depth) 0 var(--sticker-shadow); position: relative; }
    .sticker::before { content: ''; position: absolute; inset: 0; border-radius: 8px; background: linear-gradient(135deg, rgba(255,255,255,0.2) 0%, transparent 50%); pointer-events: none; }
    .sticker-peel { animation: sticker-peel-up var(--sticker-peel-duration) var(--sticker-peel-ease) both; }
    .sticker-bounce { animation: sticker-bounce-in var(--sticker-peel-duration) var(--sticker-peel-ease) both; }
    .sticker-shadow-drift { animation: sticker-shadow-drift 3s ease-in-out infinite; }
    .sticker-float { animation: sticker-float 2s ease-in-out infinite; }
    .sticker-gold { background: var(--sticker-bg-gold); }
    .sticker-success { background: var(--sticker-bg-success); }
    .sticker-danger { background: var(--sticker-bg-danger); }
    .sticker-icon { font-size: 2rem; }
    .sticker-sub { font-size: 0.7rem; font-weight: 400; opacity: 0.85; }
  </style>
</head>
<body>
  <h1>ease-sticker-peel</h1>
  <div class="demo-row">
    <div class="demo-card">
      <div class="sticker sticker-peel" style="--sticker-bg: #6366f1;"><span class="sticker-icon">NEW</span><span class="sticker-sub">Arrived Today</span></div>
      <span>Peel Up</span>
    </div>
    <div class="demo-card">
      <div class="sticker sticker-bounce" style="--sticker-bg: #f59e0b;"><span class="sticker-icon">SALE</span><span class="sticker-sub">50% Off</span></div>
      <span>Bounce In</span>
    </div>
    <div class="demo-card">
      <div class="sticker sticker-shadow-drift" style="--sticker-bg: #22c55e;"><span class="sticker-icon">VERIFIED</span><span class="sticker-sub">Authentic</span></div>
      <span>Shadow Drift</span>
    </div>
    <div class="demo-card">
      <div class="sticker sticker-float" style="--sticker-bg: #ef4444;"><span class="sticker-icon">HOT</span><span class="sticker-sub">Trending Now</span></div>
      <span>Float</span>
    </div>
  </div>
</body>
</html>
