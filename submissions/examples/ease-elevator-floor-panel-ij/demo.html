<!-- EaseMotion component: elevator-floor-panel -->
<!DOCTYPE html>
<html lang="en" data-elevator="lobby">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
<title>Ease Elevator Floor Panel</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="elev-cab">
  <div class="floor-screen">
    <span id="floorRead" class="floor-read">1</span>
    <span class="arrow-up">up</span>
  </div>
  <div class="btn-column">
    <button class="floor-btn" type="button" data-floor="6">6</button>
    <button class="floor-btn" type="button" data-floor="5">5</button>
    <button class="floor-btn" type="button" data-floor="4">4</button>
    <button class="floor-btn" type="button" data-floor="3">3</button>
    <button class="floor-btn" type="button" data-floor="2">2</button>
    <button class="floor-btn" type="button" data-floor="1">1</button>
  </div>
  <button class="alarm-btn" type="button" aria-label="emergency alarm">ALARM</button>
  <span class="call-bell"></span>
</main>
<script>
const floorRead=document.getElementById('floorRead');
document.querySelectorAll('.floor-btn').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('.floor-btn').forEach(x=>x.classList.remove('lit'));
    b.classList.add('lit');
    floorRead.classList.remove('roll');
    void floorRead.offsetWidth;
    floorRead.classList.add('roll');
    floorRead.textContent=b.dataset.floor;
  });
});
</script>
</body>
</html>
