<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modal Animation</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="container">

    <h1>Modal Animation</h1>
    <p>
      A CSS-only modal with scale and backdrop animation.
    </p>

    <button class="open-button" onclick="document.getElementById('modal').showModal()">
      Open Modal
    </button>

    <dialog id="modal" class="modal">

      <div class="modal-content">

        <button
          class="close-button"
          onclick="document.getElementById('modal').close()"
          aria-label="Close modal">
          &times;
        </button>

        <div class="icon">✓</div>

        <h2>Welcome!</h2>

        <p>
          This modal uses a smooth scale animation together with
          a backdrop transition.
        </p>

        <button
          class="confirm-button"
          onclick="document.getElementById('modal').close()">
          Continue
        </button>

      </div>

    </dialog>

  </main>

</body>
</html>
