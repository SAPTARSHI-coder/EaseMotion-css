<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Float Tag Hover Effect - A smooth upward floating animation on hover">
    <title>Float Tag Hover Effect - Example</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container-ag">
        <section class="demo-section-ag">
            <h1 class="title-ag">Float Tag Hover Effect</h1>
            <p class="description-ag">Hover over the tags to see the smooth floating animation</p>
            
            <!-- Tag container with multiple examples -->
            <div class="tag-group-ag">
                <span class="float-tag-ag">HTML</span>
                <span class="float-tag-ag">CSS</span>
                <span class="float-tag-ag">JavaScript</span>
                <span class="float-tag-ag">React</span>
                <span class="float-tag-ag">Vue.js</span>
                <span class="float-tag-ag">Node.js</span>
                <span class="float-tag-ag">Python</span>
                <span class="float-tag-ag">TypeScript</span>
            </div>

            <!-- Variant styles demonstration -->
            <div class="variants-section-ag">
                <h2 class="subtitle-ag">Style Variants</h2>
                
                <div class="variant-group-ag">
                    <h3 class="variant-title-ag">Primary</h3>
                    <div class="tag-group-ag">
                        <span class="float-tag-ag float-tag-primary-ag">Primary Tag</span>
                        <span class="float-tag-ag float-tag-primary-ag">Featured</span>
                    </div>
                </div>

                <div class="variant-group-ag">
                    <h3 class="variant-title-ag">Success</h3>
                    <div class="tag-group-ag">
                        <span class="float-tag-ag float-tag-success-ag">Success Tag</span>
                        <span class="float-tag-ag float-tag-success-ag">Completed</span>
                    </div>
                </div>

                <div class="variant-group-ag">
                    <h3 class="variant-title-ag">Warning</h3>
                    <div class="tag-group-ag">
                        <span class="float-tag-ag float-tag-warning-ag">Warning Tag</span>
                        <span class="float-tag-ag float-tag-warning-ag">Beta</span>
                    </div>
                </div>

                <div class="variant-group-ag">
                    <h3 class="variant-title-ag">Danger</h3>
                    <div class="tag-group-ag">
                        <span class="float-tag-ag float-tag-danger-ag">Danger Tag</span>
                        <span class="float-tag-ag float-tag-danger-ag">Deprecated</span>
                    </div>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
