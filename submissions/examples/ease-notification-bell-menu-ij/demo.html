<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notification Dropdown - EaseMotion Submission</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="stage">
    <div class="bell-wrap">
      <button class="bell-btn" id="bellBtn" aria-expanded="false" aria-label="Notifications">
        <span class="bell-icon">&#x1F514;</span>
        <span class="badge" id="badge">3</span>
      </button>

      <div class="dropdown" id="dropdown">
        <header class="drop-head">
          <strong>Notifications</strong>
          <button class="mark-all" id="markAll">Mark all read</button>
        </header>

        <ul class="notif-list">
          <li class="notif unread">
            <span class="n-avatar" style="--a:#6366f1;">AL</span>
            <div class="n-body">
              <strong>Alia</strong> mentioned you in <em>#design</em>
              <span class="n-time">2m ago</span>
            </div>
          </li>
          <li class="notif unread">
            <span class="n-avatar" style="--a:#22c55e;">PR</span>
            <div class="n-body">
              Pull request <strong>#442</strong> was merged
              <span class="n-time">18m ago</span>
            </div>
          </li>
          <li class="notif unread">
            <span class="n-avatar" style="--a:#ec4899;">RK</span>
            <div class="n-body">
              <strong>Rohan</strong> starred EaseMotion-css
              <span class="n-time">1h ago</span>
            </div>
          </li>
          <li class="notif">
            <span class="n-avatar" style="--a:#f59e0b;">TN</span>
            <div class="n-body">
              <strong>Tara</strong> replied to your comment
              <span class="n-time">3h ago</span>
            </div>
          </li>
        </ul>
      </div>
    </div>

    <p class="hint">Click the bell to open the panel; clicking an unread item marks it read.</p>
  </main>

  <script>
    const bellBtn = document.getElementById('bellBtn');
    const dropdown = document.getElementById('dropdown');
    const badge = document.getElementById('badge');
    const markAll = document.getElementById('markAll');
    const notifs = document.querySelectorAll('.notif.unread');

    function refreshBadge() {
      const count = document.querySelectorAll('.notif.unread').length;
      badge.textContent = count;
      badge.classList.toggle('hidden', count === 0);
    }

    bellBtn.addEventListener('click', e => {
      e.stopPropagation();
      const open = dropdown.classList.toggle('open');
      bellBtn.setAttribute('aria-expanded', String(open));
      bellBtn.classList.toggle('active', open);
    });

    notifs.forEach(item => {
      item.addEventListener('click', () => {
        item.classList.remove('unread');
        refreshBadge();
      });
    });

    markAll.addEventListener('click', () => {
      document.querySelectorAll('.notif.unread').forEach(item => item.classList.remove('unread'));
      refreshBadge();
    });

    document.addEventListener('click', () => {
      dropdown.classList.remove('open');
      bellBtn.setAttribute('aria-expanded', 'false');
      bellBtn.classList.remove('active');
    });
  </script>
</body>
</html>
