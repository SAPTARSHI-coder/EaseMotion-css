<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expandable Floating Action Button - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Background decorative glows -->
  <div class="bg-decor"></div>
  <div class="bg-decor-2"></div>

  <!-- Main Playground Card -->
  <main class="playground-container">
    <header class="header">
      <h1>EaseMotion Expandable FAB</h1>
      <p>
        A lightweight, accessible, framework-independent Floating Action Button (FAB)
        featuring staggered animations, theme support, and full keyboard navigation.
      </p>
    </header>

    <!-- Visual Click Feedback Logger -->
    <section class="logger-panel" aria-label="Action Logger">
      <div class="logger-header">
        <span>Action Logger</span>
        <span style="font-size: 0.75rem; text-transform: none;">Click any FAB action below</span>
      </div>
      <ul class="logger-logs" id="logger-logs">
        <li class="logger-item" style="background: transparent; border: 1px dashed var(--border-color); color: var(--text-secondary); text-align: center;">
          Waiting for actions...
        </li>
      </ul>
    </section>

    <!-- Theme Selection -->
    <div class="theme-section">
      <button id="theme-toggle" class="btn-theme" type="button" aria-label="Toggle light or dark theme">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
        <span>Dark Mode</span>
      </button>
    </div>
  </main>

  <!-- FLOATING ACTION BUTTON COMPONENT -->
  <div class="fab-container" id="fab-container" data-expanded="false">
    
    <!-- Primary Trigger FAB -->
    <button 
      class="fab-trigger" 
      id="fab-trigger" 
      type="button"
      aria-expanded="false" 
      aria-haspopup="true" 
      aria-controls="fab-menu" 
      aria-label="Toggle action menu"
    >
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
        <line x1="12" y1="5" x2="12" y2="19" stroke-linecap="round"></line>
        <line x1="5" y1="12" x2="19" y2="12" stroke-linecap="round"></line>
      </svg>
    </button>

    <!-- Expandable Menu -->
    <ul class="fab-menu" id="fab-menu" role="menu" aria-labelledby="fab-trigger">
      <!-- 1. Home -->
      <li class="fab-menu-item" data-item="home" role="none">
        <button 
          class="btn-action" 
          type="button" 
          role="menuitem" 
          tabindex="-1"
          data-tooltip="Home" 
          aria-label="Navigate to Home"
        >
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
          </svg>
        </button>
      </li>

      <!-- 2. Search -->
      <li class="fab-menu-item" data-item="search" role="none">
        <button 
          class="btn-action" 
          type="button" 
          role="menuitem" 
          tabindex="-1"
          data-tooltip="Search" 
          aria-label="Open Search"
        >
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </button>
      </li>

      <!-- 3. Favorite -->
      <li class="fab-menu-item" data-item="favorite" role="none">
        <button 
          class="btn-action" 
          type="button" 
          role="menuitem" 
          tabindex="-1"
          data-tooltip="Favorite" 
          aria-label="Add to Favorites"
        >
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"></path>
          </svg>
        </button>
      </li>

      <!-- 4. Share -->
      <li class="fab-menu-item" data-item="share" role="none">
        <button 
          class="btn-action" 
          type="button" 
          role="menuitem" 
          tabindex="-1"
          data-tooltip="Share" 
          aria-label="Share Content"
        >
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="18" cy="5" r="3"></circle>
            <circle cx="6" cy="12" r="3"></circle>
            <circle cx="18" cy="19" r="3"></circle>
            <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
            <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
          </svg>
        </button>
      </li>

      <!-- 5. Settings -->
      <li class="fab-menu-item" data-item="settings" role="none">
        <button 
          class="btn-action" 
          type="button" 
          role="menuitem" 
          tabindex="-1"
          data-tooltip="Settings" 
          aria-label="Open Settings"
        >
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.1a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
        </button>
      </li>
    </ul>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const container = document.getElementById("fab-container");
      const trigger = document.getElementById("fab-trigger");
      const actionButtons = container.querySelectorAll(".btn-action");
      const loggerLogs = document.getElementById("logger-logs");

      // Visual feedback logger helper
      const logAction = (actionName) => {
        const timestamp = new Date().toLocaleTimeString();
        const firstItem = loggerLogs.querySelector("li");
        
        // Remove baseline placeholder
        if (firstItem && firstItem.style.borderStyle === "dashed") {
          loggerLogs.innerHTML = "";
        }

        const logItem = document.createElement("li");
        logItem.className = "logger-item";
        logItem.innerHTML = `<strong>[${timestamp}]</strong> Triggered action: <code>${actionName}</code>`;
        
        loggerLogs.appendChild(logItem);
        loggerLogs.scrollTop = loggerLogs.scrollHeight;
      };

      // Toggle state helper
      const toggleMenu = () => {
        const isExpanded = container.getAttribute("data-expanded") === "true";
        const nextState = !isExpanded;

        container.setAttribute("data-expanded", String(nextState));
        trigger.setAttribute("aria-expanded", String(nextState));

        // Toggle focusable state (tabindex) for action buttons when collapsed/expanded
        actionButtons.forEach(btn => {
          btn.setAttribute("tabindex", nextState ? "0" : "-1");
        });
      };

      const closeMenu = () => {
        if (container.getAttribute("data-expanded") === "true") {
          container.setAttribute("data-expanded", "false");
          trigger.setAttribute("aria-expanded", "false");
          actionButtons.forEach(btn => btn.setAttribute("tabindex", "-1"));
        }
      };

      // Toggle on FAB click
      trigger.addEventListener("click", (e) => {
        e.stopPropagation();
        toggleMenu();
      });

      // Bind actions on item clicks
      actionButtons.forEach(btn => {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          const action = btn.getAttribute("data-tooltip");
          logAction(action);
          
          // Collapse menu with subtle stagger delay after clicking an action
          setTimeout(() => {
            closeMenu();
            // Restore focus back to main FAB trigger for keyboard navigation flow
            trigger.focus();
          }, 250);
        });
      });

      // Close when clicking outside
      document.addEventListener("click", (e) => {
        if (!container.contains(e.target)) {
          closeMenu();
        }
      });

      // Close on Escape key press
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          if (container.getAttribute("data-expanded") === "true") {
            closeMenu();
            trigger.focus();
          }
        }
      });

      // Theme toggle implementation
      const themeToggle = document.getElementById("theme-toggle");
      const systemPrefersDark = window.matchMedia("(prefers-color-scheme: dark)");

      const getSavedTheme = () => {
        const saved = localStorage.getItem("theme");
        if (saved) return saved;
        return systemPrefersDark.matches ? "dark" : "light";
      };

      const applyTheme = (theme) => {
        document.documentElement.setAttribute("data-theme", theme);
        localStorage.setItem("theme", theme);

        const isDark = theme === "dark";
        themeToggle.innerHTML = isDark
          ? `
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="5"></circle>
              <line x1="12" y1="1" x2="12" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="23"></line>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
              <line x1="1" y1="12" x2="3" y2="12"></line>
              <line x1="21" y1="12" x2="23" y2="12"></line>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
            <span>Light Mode</span>
          `
          : `
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
            <span>Dark Mode</span>
          `;
      };

      // Initialize Theme
      applyTheme(getSavedTheme());

      // Theme toggle listener
      themeToggle.addEventListener("click", () => {
        const activeTheme = document.documentElement.getAttribute("data-theme");
        const nextTheme = activeTheme === "dark" ? "light" : "dark";
        applyTheme(nextTheme);
      });
    });
  </script>
</body>
</html>
