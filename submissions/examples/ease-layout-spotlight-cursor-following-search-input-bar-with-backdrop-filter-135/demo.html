<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Spotlight Cursor Search Input</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

</head>

<body>

<section class="hero">

<div class="search-card" id="card">

<span class="badge">
High-Contrast Accessibility Edition
</span>

<h1>
Spotlight Search
<span>Input Bar</span>
</h1>

<p class="subtitle">
A cursor-following spotlight search field with high-contrast accessibility,
smooth interactions and responsive backdrop-inspired visuals.
</p>

<div class="search-box" id="searchBox">

<div class="spotlight"></div>

<span class="icon">
🔍
</span>

<input
type="text"
placeholder="Search anything..."
aria-label="Search"
/>

<button>
Search
</button>

</div>

</div>

</section>

<script src="script.js"></script>

</body>
</html>
