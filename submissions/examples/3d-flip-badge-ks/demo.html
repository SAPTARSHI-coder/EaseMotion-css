<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS 3D-Flip Badge</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="demo-wrapper">
    <header class="demo-header">
      <h1>3D-Flip Badges</h1>
      <p>Hover or focus the badges to reveal more information.</p>
    </header>
    
    <div class="badges-grid">
      <!-- Badge 1: Status -->
      <div class="badge-container" tabindex="0" aria-label="System Status: All systems operational">
        <div class="badge-flipper">
          <div class="badge-face badge-front">
            <span class="icon">✓</span>
            <span class="title">System Status</span>
          </div>
          <div class="badge-face badge-back status-back">
            <span class="subtitle">Operational</span>
            <span class="detail">99.9% Uptime</span>
          </div>
        </div>
      </div>

      <!-- Badge 2: Technology -->
      <div class="badge-container" tabindex="0" aria-label="Technology: CSS3 Transforms">
        <div class="badge-flipper">
          <div class="badge-face badge-front">
            <span class="icon">&lt;/&gt;</span>
            <span class="title">CSS3</span>
          </div>
          <div class="badge-face badge-back tech-back">
            <span class="subtitle">Transforms</span>
            <span class="detail">preserve-3d</span>
          </div>
        </div>
      </div>

      <!-- Badge 3: Security -->
      <div class="badge-container" tabindex="0" aria-label="Security: End-to-end Encrypted">
        <div class="badge-flipper">
          <div class="badge-face badge-front">
            <span class="icon">🔒</span>
            <span class="title">Security</span>
          </div>
          <div class="badge-face badge-back security-back">
            <span class="subtitle">Encrypted</span>
            <span class="detail">AES-256</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
