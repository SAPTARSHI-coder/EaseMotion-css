<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tab Bar — EaseMotion CSS</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="tabbar-page-tm" data-palette="forest">
  <h1 class="tabbar-h-tm">Tab Bar</h1>
  <p class="tabbar-lede-tm">A self-contained demo with three variants of the effect.</p>
  <section class="tabbar-row-tm">
    <article class="tabbar-1-wrap-tm">
      <div class="tabbar-1-tm"></div>
      <span class="tabbar-lbl-tm">Example One</span>
    </article>
    <article class="tabbar-2-wrap-tm">
      <div class="tabbar-2-tm"></div>
      <span class="tabbar-lbl-tm">Example Two</span>
    </article>
    <article class="tabbar-3-wrap-tm">
      <div class="tabbar-3-tm"></div>
      <span class="tabbar-lbl-tm">Example Three</span>
    </article>
  </section>
</main>
</body>
</html>
