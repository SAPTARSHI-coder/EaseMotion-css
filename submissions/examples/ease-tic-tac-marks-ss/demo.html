<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic Tac Marks Component - Play Category</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="ease-tictac-wrapper" aria-labelledby="stage-title">
    <div class="ease-tictac-header">
      <h1 id="stage-title" class="ease-tictac-title">Tic-Tac-Toe Sequence</h1>
      <p class="ease-tictac-desc">X and O marks drawing themselves in sequence using SVG stroke animations.</p>
    </div>

    <!-- Tic Tac Toe Grid Arena -->
    <div class="ease-tictac-grid" id="tictac-grid" role="region" aria-label="Tic Tac Toe Animation Grid">
      <!-- Step 1: X (Top-Left) -->
      <div class="ease-cell">
        <svg class="ease-mark ease-mark-x" viewBox="0 0 52 52" style="--step: 1;">
          <path d="M 12 12 L 40 40 M 40 12 L 12 40" />
        </svg>
      </div>
      <!-- Step 2: O (Top-Center) -->
      <div class="ease-cell">
        <svg class="ease-mark ease-mark-o" viewBox="0 0 52 52" style="--step: 2;">
          <circle cx="26" cy="26" r="16" />
        </svg>
      </div>
      <!-- Step 3: X (Top-Right) -->
      <div class="ease-cell">
        <svg class="ease-mark ease-mark-x" viewBox="0 0 52 52" style="--step: 3;">
          <path d="M 12 12 L 40 40 M 40 12 L 12 40" />
        </svg>
      </div>
      <!-- Step 4: O (Center) -->
      <div class="ease-cell">
        <svg class="ease-mark ease-mark-o" viewBox="0 0 52 52" style="--step: 4;">
          <circle cx="26" cy="26" r="16" />
        </svg>
      </div>
      <!-- Step 5: X (Bottom-Right - Winning Move) -->
      <div class="ease-cell">
        <svg class="ease-mark ease-mark-x" viewBox="0 0 52 52" style="--step: 5;">
          <path d="M 12 12 L 40 40 M 40 12 L 12 40" />
        </svg>
      </div>
      <!-- Empty cells to complete 3x3 grid -->
      <div class="ease-cell"></div>
      <div class="ease-cell"></div>
      <div class="ease-cell"></div>
      <div class="ease-cell"></div>
    </div>

    <button type="button" class="ease-btn-tictac" id="replay-btn">Replay Sequence</button>
  </main>

  <script>
    const grid = document.getElementById('tictac-grid');
    const replayBtn = document.getElementById('replay-btn');

    replayBtn.addEventListener('click', () => {
      grid.classList.add('is-animating');
      void grid.offsetWidth; // Trigger DOM reflow
      grid.classList.remove('is-animating');
    });
  </script>
</body>
</html>
