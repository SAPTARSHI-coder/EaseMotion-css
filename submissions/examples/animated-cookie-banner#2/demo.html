<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Animated Cookie Banner - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Pure CSS state toggle -->
  <input
    type="checkbox"
    id="cookie-consent"
    class="cookie-state"
    aria-label="Cookie consent state"
  />

  <main class="page">
    <header class="hero">
      <span class="pill">Demo Page</span>
      <h1>Animated Cookie Banner</h1>
      <p>
        A modern cookie consent banner built with pure HTML and CSS.
        Click Accept or Decline to hide the banner.
      </p>

      <label for="cookie-consent" class="reset-btn">
        Reset Banner
      </label>
    </header>
  </main>

  <section class="cookie-banner" role="region" aria-label="Cookie consent">

    <div class="cookie-content">
      <div class="cookie-icon">🍪</div>

      <div class="cookie-text">
        <h2>We use cookies</h2>
        <p>
          This website uses cookies to improve your experience and analyze
          traffic. You can accept or decline them.
        </p>
      </div>

      <div class="cookie-actions">
        <label for="cookie-consent" class="cookie-btn decline">
          Decline
        </label>

        <label for="cookie-consent" class="cookie-btn accept">
          Accept
        </label>
      </div>
    </div>

  </section>

</body>
</html>
