<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CSS Glitch-Flicker Tooltip | Fintech Dashboard</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<header class="dashboard-header">

<h1>
FinTech Analytics
</h1>

<p>
Glitch-Flicker Tooltip Interface
</p>

</header>


<main class="cards">


<div class="card tooltip-container">

<div class="icon">
$
</div>

<h2>
Revenue
</h2>

<p>
Monthly earnings overview
</p>


<div class="tooltip">
<span>LIVE</span>
Revenue data updated instantly
</div>

</div>



<div class="card tooltip-container">

<div class="icon">
%
</div>

<h2>
Growth
</h2>

<p>
Performance tracking
</p>


<div class="tooltip">
<span>+24%</span>
Growth analytics available
</div>

</div>



<div class="card tooltip-container">

<div class="icon">
🔒
</div>

<h2>
Security
</h2>

<p>
Protected transactions
</p>


<div class="tooltip">
<span>SAFE</span>
Security monitoring active
</div>

</div>


</main>


</body>
</html>
