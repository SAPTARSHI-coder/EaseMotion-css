<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ease-feature-accessible-multistep-form-wizard-with-anim Component Demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #f1f5f9;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
  </style>
</head>
<body>

  <div class="ease-feature-accessible-multistep-form-wizard-with-anim-container">
    <h1 class="ease-feature-accessible-multistep-form-wizard-with-anim-title">Multi-Step Registration</h1>

    <!-- Progress Bar -->
    <div class="ease-feature-accessible-multistep-form-wizard-with-anim-progress-bar">
      <div class="ease-feature-accessible-multistep-form-wizard-with-anim-progress-fill" id="progress-fill" style="width: 33%"></div>
    </div>

    <!-- Stepper -->
    <div class="ease-feature-accessible-multistep-form-wizard-with-anim-stepper">
      <div class="ease-feature-accessible-multistep-form-wizard-with-anim-step active" data-step="1">
        <div class="ease-feature-accessible-multistep-form-wizard-with-anim-step-circle">1</div>
        <div class="ease-feature-accessible-multistep-form-wizard-with-anim-step-label">Account</div>
      </div>
      <div class="ease-feature-accessible-multistep-form-wizard-with-anim-step" data-step="2">
        <div class="ease-feature-accessible-multistep-form-wizard-with-anim-step-circle">2</div>
        <div class="ease-feature-accessible-multistep-form-wizard-with-anim-step-label">Profile</div>
      </div>
      <div class="ease-feature-accessible-multistep-form-wizard-with-anim-step" data-step="3">
        <div class="ease-feature-accessible-multistep-form-wizard-with-anim-step-circle">3</div>
        <div class="ease-feature-accessible-multistep-form-wizard-with-anim-step-label">Confirm</div>
      </div>
    </div>

    <!-- Step 1 -->
    <div class="ease-feature-accessible-multistep-form-wizard-with-anim-step-content active" data-step="1">
      <div class="ease-feature-accessible-multistep-form-wizard-with-anim-form-group">
        <label class="ease-feature-accessible-multistep-form-wizard-with-anim-label">Username</label>
        <input class="ease-feature-accessible-multistep-form-wizard-with-anim-input" type="text" placeholder="Choose a username" value="">
      </div>
      <div class="ease-feature-accessible-multistep-form-wizard-with-anim-form-group">
        <label class="ease-feature-accessible-multistep-form-wizard-with-anim-label">Email Address</label>
        <input class="ease-feature-accessible-multistep-form-wizard-with-anim-input" type="email" placeholder="you@cybernet.io" value="">
      </div>
      <div class="ease-feature-accessible-multistep-form-wizard-with-anim-form-group">
        <label class="ease-feature-accessible-multistep-form-wizard-with-anim-label">Password</label>
        <input class="ease-feature-accessible-multistep-form-wizard-with-anim-input" type="password" placeholder="Min 12 characters" value="">
      </div>
      <div class="ease-feature-accessible-multistep-form-wizard-with-anim-btn-row">
        <button class="ease-feature-accessible-multistep-form-wizard-with-anim-btn ease-feature-accessible-multistep-form-wizard-with-anim-btn-primary" onclick="nextStep(1)">Continue</button>
      </div>
    </div>

    <!-- Step 2 -->
    <div class="ease-feature-accessible-multistep-form-wizard-with-anim-step-content" data-step="2">
      <div class="ease-feature-accessible-multistep-form-wizard-with-anim-form-group">
        <label class="ease-feature-accessible-multistep-form-wizard-with-anim-label">Full Name</label>
        <input class="ease-feature-accessible-multistep-form-wizard-with-anim-input" type="text" placeholder="Your full name" value="">
      </div>
      <div class="ease-feature-accessible-multistep-form-wizard-with-anim-form-group">
        <label class="ease-feature-accessible-multistep-form-wizard-with-anim-label">Organization</label>
        <input class="ease-feature-accessible-multistep-form-wizard-with-anim-input" type="text" placeholder="Company or project name" value="">
      </div>
      <div class="ease-feature-accessible-multistep-form-wizard-with-anim-form-group">
        <label class="ease-feature-accessible-multistep-form-wizard-with-anim-label">Role</label>
        <input class="ease-feature-accessible-multistep-form-wizard-with-anim-input" type="text" placeholder="Your role" value="">
      </div>
      <div class="ease-feature-accessible-multistep-form-wizard-with-anim-btn-row">
        <button class="ease-feature-accessible-multistep-form-wizard-with-anim-btn ease-feature-accessible-multistep-form-wizard-with-anim-btn-secondary" onclick="prevStep(2)">Back</button>
        <button class="ease-feature-accessible-multistep-form-wizard-with-anim-btn ease-feature-accessible-multistep-form-wizard-with-anim-btn-primary" onclick="nextStep(2)">Continue</button>
      </div>
    </div>

    <!-- Step 3 -->
    <div class="ease-feature-accessible-multistep-form-wizard-with-anim-step-content" data-step="3">
      <div class="ease-feature-accessible-multistep-form-wizard-with-anim-form-group">
        <label class="ease-feature-accessible-multistep-form-wizard-with-anim-label">Review Your Information</label>
        <div style="background:#f1f5f9;padding:1rem;border-radius:0.5rem;font-size:0.875rem;color:#475569;line-height:1.8;">
          <div><strong>Username:</strong> cybernet_user</div>
          <div><strong>Email:</strong> you@cybernet.io</div>
          <div><strong>Full Name:</strong> Verified User</div>
        </div>
      </div>
      <div class="ease-feature-accessible-multistep-form-wizard-with-anim-form-group">
        <label style="display:flex;align-items:center;gap:0.5rem;font-size:0.875rem;color:#64748b;cursor:pointer;">
          <input type="checkbox"> I agree to the terms of service
        </label>
      </div>
      <div class="ease-feature-accessible-multistep-form-wizard-with-anim-btn-row">
        <button class="ease-feature-accessible-multistep-form-wizard-with-anim-btn ease-feature-accessible-multistep-form-wizard-with-anim-btn-secondary" onclick="prevStep(3)">Back</button>
        <button class="ease-feature-accessible-multistep-form-wizard-with-anim-btn ease-feature-accessible-multistep-form-wizard-with-anim-btn-primary" onclick="alert('Form submitted!')">Submit</button>
      </div>
    </div>
  </div>

  <script>
    let currentStep = 1;
    function nextStep(step) {
      document.querySelector(`.ease-feature-accessible-multistep-form-wizard-with-anim-step-content[data-step="${step}"]`).classList.remove('active');
      document.querySelector(`.ease-feature-accessible-multistep-form-wizard-with-anim-step[data-step="${step}"]`).classList.remove('active');
      document.querySelector(`.ease-feature-accessible-multistep-form-wizard-with-anim-step[data-step="${step}"]`).classList.add('completed');
      currentStep = step + 1;
      document.querySelector(`.ease-feature-accessible-multistep-form-wizard-with-anim-step-content[data-step="${currentStep}"]`).classList.add('active');
      document.querySelector(`.ease-feature-accessible-multistep-form-wizard-with-anim-step[data-step="${currentStep}"]`).classList.add('active');
      document.getElementById('progress-fill').style.width = (currentStep * 33) + '%';
    }
    function prevStep(step) {
      document.querySelector(`.ease-feature-accessible-multistep-form-wizard-with-anim-step-content[data-step="${step}"]`).classList.remove('active');
      document.querySelector(`.ease-feature-accessible-multistep-form-wizard-with-anim-step[data-step="${step}"]`).classList.remove('active');
      currentStep = step - 1;
      document.querySelector(`.ease-feature-accessible-multistep-form-wizard-with-anim-step[data-step="${currentStep}"]`).classList.remove('completed');
      document.querySelector(`.ease-feature-accessible-multistep-form-wizard-with-anim-step-content[data-step="${currentStep}"]`).classList.add('active');
      document.querySelector(`.ease-feature-accessible-multistep-form-wizard-with-anim-step[data-step="${currentStep}"]`).classList.add('active');
      document.getElementById('progress-fill').style.width = (currentStep * 33) + '%';
    }
  </script>

</body>
</html>
