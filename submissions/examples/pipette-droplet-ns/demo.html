<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pipette Droplet — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Pipette Droplet demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Pipette Droplet</h1>
      <p class="lede">Pipette dispensing a forming and falling droplet</p>
    </header>

    <section class="ease-pipette-droplet" data-demo="pipette-droplet" aria-live="polite">
      <div class="ease-pipette-droplet__housing">
        <div class="ease-pipette-droplet__bezel">
          <div class="ease-pipette-droplet__face">
            <div class="ease-pipette-droplet__readout">
              <span class="ease-pipette-droplet__label">Pipette Droplet</span>
              <span class="ease-pipette-droplet__value">20 µL</span>
            </div>
            <div class="ease-pipette-droplet__motion" aria-hidden="true">
              <span class="ease-pipette-droplet__shaft"></span>
              <span class="ease-pipette-droplet__tip"></span>
              <span class="ease-pipette-droplet__drop"></span>
              <span class="ease-pipette-droplet__well"></span>
              <span class="ease-pipette-droplet__splash"></span>
            </div>
            <div class="ease-pipette-droplet__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-pipette-droplet__controls">
          <button type="button" class="ease-pipette-droplet__btn primary">Engage</button>
          <button type="button" class="ease-pipette-droplet__btn">Reset</button>
          <label class="ease-pipette-droplet__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-pipette-droplet__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
