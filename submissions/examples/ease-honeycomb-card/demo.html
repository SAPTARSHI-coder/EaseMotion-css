<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Honeycomb Card · Hexagonal Pattern Expansion</title>

    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <div class="card">
        <h2>🐝 Honeycomb Card</h2>
        <p class="sub">expands with hexagonal honeycomb pattern</p>

        <!-- === HONEYCOMB CARD === -->
        <div class="honeycomb-container" id="honeycombContainer">
            <div class="honeycomb-card">
                <div class="honeycomb-content">
                    <i class="fas fa-hexagon"></i>
                    <h3>Hexagon</h3>
                    <p>Hover to see the honeycomb expand</p>
                    <span class="honeycomb-badge">🐝</span>
                </div>
                <div class="honeycomb-grid">
                    <div class="hex hex-1"></div>
                    <div class="hex hex-2"></div>
                    <div class="hex hex-3"></div>
                    <div class="hex hex-4"></div>
                    <div class="hex hex-5"></div>
                    <div class="hex hex-6"></div>
                    <div class="hex hex-7"></div>
                    <div class="hex hex-8"></div>
                    <div class="hex hex-9"></div>
                    <div class="hex hex-10"></div>
                    <div class="hex hex-11"></div>
                    <div class="hex hex-12"></div>
                    <div class="hex hex-13"></div>
                    <div class="hex hex-14"></div>
                    <div class="hex hex-15"></div>
                    <div class="hex hex-16"></div>
                    <div class="hex hex-17"></div>
                    <div class="hex hex-18"></div>
                    <div class="hex hex-19"></div>
                </div>
            </div>
        </div>

        <p style="margin-top: 2rem; font-size: 0.85rem; color: #64748b;">
            Hover · watch the hexagonal pattern expand
        </p>
    </div>

    <!-- Embedded JavaScript -->
    <script>
        (function() {
            'use strict';

            const container = document.getElementById('honeycombContainer');

            // Click feedback
            container.addEventListener('click', function() {
                const card = this.querySelector('.honeycomb-card');
                card.classList.add('click-pulse');
                setTimeout(() => {
                    card.classList.remove('click-pulse');
                }, 300);
                console.log('🐝 Honeycomb card clicked!');
            });

            // Keyboard accessibility
            container.setAttribute('tabindex', '0');
            container.setAttribute('role', 'button');
            container.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    this.click();
                }
            });

            // Reset animation on hover
            container.addEventListener('mouseenter', function() {
                const hexes = this.querySelectorAll('.hex');
                hexes.forEach(hex => {
                    hex.style.animation = 'none';
                    void hex.offsetWidth;
                    hex.style.animation = '';
                });
            });

            console.log('🐝 Honeycomb card initialized!');

        })();
    </script>

</body>
</html>
