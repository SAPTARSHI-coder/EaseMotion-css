<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CSS countdown to event display.">
  <title>CSS Countdown to Event</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="countdown" aria-labelledby="event-title">

    <span class="eyebrow">Upcoming event</span>

    <h1 id="event-title">Launch Day</h1>

    <p class="date">August 30, 2026 · 10:00 AM</p>

    <div class="timer" aria-label="Countdown timer">

      <div class="time-box">
        <strong>21</strong>
        <span>Days</span>
      </div>

      <div class="separator" aria-hidden="true">:</div>

      <div class="time-box">
        <strong>08</strong>
        <span>Hours</span>
      </div>

      <div class="separator" aria-hidden="true">:</div>

      <div class="time-box">
        <strong>42</strong>
        <span>Minutes</span>
      </div>

    </div>

    <p class="note">
      The countdown display is styled with CSS only.
    </p>

  </main>

</body>
</html>
