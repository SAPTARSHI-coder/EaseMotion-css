<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toast Notifications - Slide & Fade | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Container for Toast Stack -->
  <div class="toast-container" aria-live="polite">

    <!-- Success Toast -->
    <div class="toast toast-success easemotion-slide-fade-in">
      <div class="toast-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" class="icon"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
      </div>
      <div class="toast-content">
        <h4 class="toast-title">Success</h4>
        <p class="toast-message">Your profile settings have been updated.</p>
      </div>
      <button class="toast-close" aria-label="Close notification">&times;</button>
      <div class="toast-progress"></div>
    </div>

    <!-- Error Toast -->
    <div class="toast toast-error easemotion-slide-fade-in">
      <div class="toast-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" class="icon"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
      </div>
      <div class="toast-content">
        <h4 class="toast-title">Connection Lost</h4>
        <p class="toast-message">Failed to reach the server. Please try again.</p>
      </div>
      <button class="toast-close" aria-label="Close notification">&times;</button>
      <div class="toast-progress"></div>
    </div>

    <!-- Info Toast -->
    <div class="toast toast-info easemotion-slide-fade-in">
      <div class="toast-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" class="icon"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
      </div>
      <div class="toast-content">
        <h4 class="toast-title">System Update</h4>
        <p class="toast-message">A new tournament schedule is now live.</p>
      </div>
      <button class="toast-close" aria-label="Close notification">&times;</button>
      <div class="toast-progress"></div>
    </div>

  </div>

  <!-- Showcase Demo Canvas -->
  <main class="demo-canvas">
    <div class="demo-card">
      <h1>Toast Notifications</h1>
      <p>Pure CSS notification UI with EaseMotion entrance curves and progress bars.</p>
    </div>
  </main>
</body>
</html>
