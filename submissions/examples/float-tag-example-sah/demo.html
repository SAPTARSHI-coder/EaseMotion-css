<!DOCTYPE html>

  <title>Float Tag Example - EaseMotion CSS</title>

</head>
<body>
  <div class="showcase">

      <div class="ease-tag-float">

      <div class="ease-tag-float">
        <span class="tag-body purple">🚀 GSSoC 2026 Batch 3</span>
        <div class="tag-shadow"></div>
      </div>

      <div class="ease-tag-float">
        <span class="tag-body amber">⚡ Zero Layout Reflows</span>
        <div class="tag-shadow"></div>
      </div>
    </div>
  </div>
