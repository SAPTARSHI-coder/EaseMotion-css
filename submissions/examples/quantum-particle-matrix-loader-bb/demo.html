<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quantum Particle Matrix Loader Component - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="matrix-card">
    <div class="matrix-header">
      <h3>QUANTUM CORE STATE</h3>
      <span class="matrix-badge">STABLE</span>
    </div>
    
    <div class="particle-matrix-wrapper">
      <div class="matrix-ring ring-1"></div>
      <div class="matrix-ring ring-2"></div>
      
      <div class="particle-node node-1"></div>
      <div class="particle-node node-2"></div>
      <div class="particle-node node-3"></div>
      <div class="particle-node node-4"></div>
      
      <div class="quantum-core"></div>
    </div>
    
    <div class="quantum-status">
      <p>ENTANGLEMENT: <span>99.99 MHz</span></p>
      <div class="loading-bar"><div class="bar-progress"></div></div>
    </div>
  </div>
</body>
</html>
