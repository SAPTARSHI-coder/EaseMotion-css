<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Responsive glowing cyberpunk navbar built with pure HTML and CSS."
  >

  <title>Glowing Navbar - Cyberpunk</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header class="site-header">
    <nav class="navbar" aria-label="Primary navigation">
      <a href="#" class="brand" aria-label="NEXUS home">
        <span class="brand-mark" aria-hidden="true">N</span>
        <span class="brand-text">NEXUS</span>
      </a>

      <input
        type="checkbox"
        id="nav-toggle"
        class="nav-toggle"
        aria-label="Toggle navigation"
      >

      <label for="nav-toggle" class="menu-toggle">
        <span></span>
        <span></span>
        <span></span>
      </label>

      <div class="nav-panel">
        <ul class="nav-links">
          <li>
            <a href="#home" class="nav-link active">
              <span class="link-index">01</span>
              <span>Home</span>
            </a>
          </li>

          <li>
            <a href="#systems" class="nav-link">
              <span class="link-index">02</span>
              <span>Systems</span>
            </a>
          </li>

          <li>
            <a href="#network" class="nav-link">
              <span class="link-index">03</span>
              <span>Network</span>
            </a>
          </li>

          <li>
            <a href="#about" class="nav-link">
              <span class="link-index">04</span>
              <span>About</span>
            </a>
          </li>
        </ul>

        <a href="#connect" class="connect-button">
          <span>Connect</span>
          <span class="button-arrow" aria-hidden="true">↗</span>
        </a>
      </div>
    </nav>
  </header>

  <main>
    <section class="hero" id="home">
      <div class="hero-grid"></div>

      <div class="hero-content">
        <span class="status">
          <span class="status-dot"></span>
          SYSTEM ONLINE
        </span>

        <h1>
          ENTER THE
          <span>NEON GRID</span>
        </h1>

        <p>
          A futuristic navigation experience designed with
          glowing cyberpunk aesthetics and responsive interactions.
        </p>

        <a href="#systems" class="hero-button">
          Explore System
          <span aria-hidden="true">→</span>
        </a>
      </div>

      <div class="corner corner-top"></div>
      <div class="corner corner-bottom"></div>
    </section>
  </main>
</body>
</html>
