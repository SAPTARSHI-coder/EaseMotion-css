<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Accessible CSS-only liquid wave progress bars"
  >

  <title>Liquid Wave Fill Progress</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="demo">

    <header class="demo-header">
      <p class="eyebrow">CSS PROGRESS COMPONENT</p>

      <h1>Liquid Wave Fill</h1>

      <p class="subtitle">
        A smooth, animated progress indicator created entirely
        with HTML and vanilla CSS.
      </p>
    </header>

    <section class="progress-card" aria-label="Progress examples">

      <!-- 25% -->
      <div class="progress-item">

        <div class="progress-meta">
          <span>Uploading assets</span>
          <strong>25%</strong>
        </div>

        <div
          class="progress"
          role="progressbar"
          aria-label="Uploading assets"
          aria-valuenow="25"
          aria-valuemin="0"
          aria-valuemax="100"
          style="--progress: 25%;"
        >
          <div class="progress-fill">
            <span class="wave wave-one"></span>
            <span class="wave wave-two"></span>
          </div>
        </div>

      </div>

      <!-- 55% -->
      <div class="progress-item">

        <div class="progress-meta">
          <span>Processing data</span>
          <strong>55%</strong>
        </div>

        <div
          class="progress"
          role="progressbar"
          aria-label="Processing data"
          aria-valuenow="55"
          aria-valuemin="0"
          aria-valuemax="100"
          style="--progress: 55%;"
        >
          <div class="progress-fill">
            <span class="wave wave-one"></span>
            <span class="wave wave-two"></span>
          </div>
        </div>

      </div>

      <!-- 78% -->
      <div class="progress-item">

        <div class="progress-meta">
          <span>Building application</span>
          <strong>78%</strong>
        </div>

        <div
          class="progress"
          role="progressbar"
          aria-label="Building application"
          aria-valuenow="78"
          aria-valuemin="0"
          aria-valuemax="100"
          style="--progress: 78%;"
        >
          <div class="progress-fill">
            <span class="wave wave-one"></span>
            <span class="wave wave-two"></span>
          </div>
        </div>

      </div>

      <!-- 100% -->
      <div class="progress-item">

        <div class="progress-meta">
          <span>Deployment complete</span>
          <strong>100%</strong>
        </div>

        <div
          class="progress"
          role="progressbar"
          aria-label="Deployment complete"
          aria-valuenow="100"
          aria-valuemin="0"
          aria-valuemax="100"
          style="--progress: 100%;"
        >
          <div class="progress-fill">
            <span class="wave wave-one"></span>
            <span class="wave wave-two"></span>
          </div>
        </div>

      </div>

    </section>

    <p class="demo-note">
      Pure HTML + CSS · No JavaScript · Responsive · Accessible
    </p>

  </main>

</body>
</html>
