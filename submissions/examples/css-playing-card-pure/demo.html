<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Playing Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="layout-container">
        
        <header class="section-header">
            <h1 class="title">Pure CSS Playing Card</h1>
            <p class="subtitle">A 3D flipping playing card (Ace of Spades) built entirely with CSS. Hover over the card to reveal the front face.</p>
        </header>

        <div class="demo-area">
            
            <!-- 
              [TECHNIQUE] 3D Card Flip
              The container sets the perspective. 
              The inner wrapper handles the rotateY animation on hover.
              The front and back faces use backface-visibility: hidden.
            -->
            <div class="card-container" tabindex="0" aria-label="Ace of Spades playing card. Hover to flip.">
                
                <div class="card-wrapper">
                    
                    <!-- Card Back (The pattern) -->
                    <div class="card-face card-back" aria-hidden="true">
                        <div class="card-back-pattern"></div>
                        <div class="card-back-border"></div>
                    </div>
                    
                    <!-- Card Front (The Ace of Spades) -->
                    <div class="card-face card-front" aria-hidden="true">
                        
                        <!-- Top Left Corner -->
                        <div class="corner corner-top-left">
                            <div class="rank">A</div>
                            <div class="suit">&spades;</div>
                        </div>
                        
                        <!-- Center Main Suit -->
                        <div class="center-suit">
                            &spades;
                        </div>
                        
                        <!-- Bottom Right Corner (Inverted) -->
                        <div class="corner corner-bottom-right">
                            <div class="rank">A</div>
                            <div class="suit">&spades;</div>
                        </div>
                        
                    </div>
                    
                </div>
                
                <!-- Floor shadow for realism -->
                <div class="card-shadow"></div>
                
            </div>
            
        </div>
        
    </div>

</body>
</html>
