<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Typewriter Effect — EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <p class="label">Pure CSS Typewriter Text Animation</p>
  
  <!-- One-shot Typing -->
  <div class="ease-typewriter" style="--ch-count: 22ch; --steps-count: 22; --type-duration: 3s;">
    EaseMotion CSS Framework
  </div>

  <p class="label">Cyan Theme Variant</p>
  <div class="ease-typewriter ease-typewriter--cyan" style="--ch-count: 24ch; --steps-count: 24; --type-duration: 3.5s;">
    const motion = "Zero JS";
  </div>

  <p class="label">Alternate Loop Mode</p>
  <div class="ease-typewriter ease-typewriter--emerald ease-typewriter--loop">
    npm i easemotion-css
  </div>

</body>
</html>
