<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ease Time Chip</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="time-group">

    <div class="time-chip">
        <span class="time-icon">◷</span>
        <span>10:30 AM</span>
    </div>

    <div class="time-chip">
        <span class="time-icon">◷</span>
        <span>45 min</span>
    </div>

    <div class="time-chip">
        <span class="time-icon">◷</span>
        <span>2h 15m</span>
    </div>

</div>

</body>
</html>
