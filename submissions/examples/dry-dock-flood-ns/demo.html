<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dry Dock Flood — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Dry Dock Flood demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Dry Dock Flood</h1>
      <p class="lede">Dry dock flooding as keel blocks disappear under water</p>
    </header>

    <section class="ease-dry-dock-flood" data-demo="dry-dock-flood" aria-live="polite">
      <div class="ease-dry-dock-flood__housing">
        <div class="ease-dry-dock-flood__bezel">
          <div class="ease-dry-dock-flood__face">
            <div class="ease-dry-dock-flood__readout">
              <span class="ease-dry-dock-flood__label">Dry Dock Flood</span>
              <span class="ease-dry-dock-flood__value">LIVE</span>
            </div>
            <div class="ease-dry-dock-flood__motion" aria-hidden="true">
              <span class="ease-dry-dock-flood__a"></span>
              <span class="ease-dry-dock-flood__b"></span>
              <span class="ease-dry-dock-flood__c"></span>
              <span class="ease-dry-dock-flood__d"></span>
            </div>
            <div class="ease-dry-dock-flood__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-dry-dock-flood__controls">
          <button type="button" class="ease-dry-dock-flood__btn primary">Engage</button>
          <button type="button" class="ease-dry-dock-flood__btn">Reset</button>
          <label class="ease-dry-dock-flood__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-dry-dock-flood__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
