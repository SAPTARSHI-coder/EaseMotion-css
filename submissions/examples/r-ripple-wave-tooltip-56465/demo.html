<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Ripple-Wave Tooltip</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<section class="tooltip-section">

<h1>Gaming Hub Tooltips</h1>

<div class="tooltip-grid">

<div class="tooltip-item">
<button class="tooltip-btn">🎮 Battle Pass</button>
<span class="tooltip">Unlock premium missions, exclusive rewards, and seasonal bonuses.</span>
</div>

<div class="tooltip-item">
<button class="tooltip-btn">⚔️ Weapon</button>
<span class="tooltip">Epic weapon with increased attack speed and critical damage.</span>
</div>

<div class="tooltip-item">
<button class="tooltip-btn">🛡️ Shield</button>
<span class="tooltip">Blocks heavy attacks and grants temporary invulnerability.</span>
</div>

<div class="tooltip-item">
<button class="tooltip-btn">💎 Treasure</button>
<span class="tooltip">Collect rare gems to unlock legendary cosmetics.</span>
</div>

</div>

</section>

</body>
</html>
