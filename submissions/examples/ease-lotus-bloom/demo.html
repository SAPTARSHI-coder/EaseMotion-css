<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lotus Bloom · lotus flower slowly opens</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <div class="lotus-container">
      <div class="lotus-display" id="lotusDisplay">
        <!-- Canvas for lotus bloom -->
        <canvas id="lotusCanvas"></canvas>
        
        <!-- Lotus Info -->
        <div class="lotus-info">
          <span class="info-label">🌸 Bloom</span>
          <span class="info-value" id="bloomPercent">0%</span>
        </div>

        <!-- Lotus Controls -->
        <div class="lotus-controls">
          <div class="control-group">
            <label class="control-label">🌸 Bloom</label>
            <input type="range" class="control-slider" id="bloomSlider" min="0" max="100" value="0">
            <span class="control-value" id="bloomValue">0%</span>
          </div>
          <div class="control-group">
            <label class="control-label">🎨 Style</label>
            <div class="style-options">
              <button class="style-btn active" data-style="pink" title="Pink">🌸</button>
              <button class="style-btn" data-style="white" title="White">🤍</button>
              <button class="style-btn" data-style="purple" title="Purple">💜</button>
              <button class="style-btn" data-style="golden" title="Golden">🌟</button>
            </div>
          </div>
        </div>

        <!-- Lotus Text -->
        <div class="lotus-text">
          <span class="text-label">🌸 Lotus Bloom</span>
          <span class="text-message" id="lotusMessage">A sacred lotus slowly opens its petals</span>
        </div>
      </div>
      
      <div class="lotus-status">
        <span id="lotusStatus">🌸 Lotus flower slowly opening...</span>
      </div>
    </div>

    <div class="controls">
      <button class="btn btn-bloom" id="bloomBtn">🌸 Bloom</button>
      <button class="btn btn-reset" id="resetBtn">⟳ Reset</button>
    </div>
    <div class="footer-note">
      <span>🌸 lotus opens · 4 styles · sacred bloom</span>
    </div>
  </div>

  <script>
    (function() {
      "use strict";

      // DOM refs
      const canvas = document.getElementById('lotusCanvas');
      const ctx = canvas.getContext('2d');
      const display = document.getElementById('lotusDisplay');
      const bloomPercent = document.getElementById('bloomPercent');
      const bloomValue = document.getElementById('bloomValue');
      const lotusStatus = document.getElementById('lotusStatus');
      const lotusMessage = document.getElementById('lotusMessage');
      const bloomSlider = document.getElementById('bloomSlider');
      const bloomBtn = document.getElementById('bloomBtn');
      const resetBtn = document.getElementById('resetBtn');
      const styleBtns = document.querySelectorAll('.style-btn');

      // State
      let bloom = 0; // 0 to 1
      let targetBloom = 0;
      let currentStyle = 'pink';
      let animationId = null;

      // Lotus styles
      const lotusStyles = {
        pink: {
          name: 'Pink',
          petalOuter: '#f472b6',
          petalMid: '#f9a8d4',
          petalInner: '#fbcfe8',
          center: '#fbbf24',
          glow: 'rgba(244, 114, 182, 0.2)'
        },
        white: {
          name: 'White',
          petalOuter: '#e2e8f0',
          petalMid: '#f1f5f9',
          petalInner: '#f8fafc',
          center: '#fbbf24',
          glow: 'rgba(226, 232, 240, 0.2)'
        },
        purple: {
          name: 'Purple',
          petalOuter: '#8b5cf6',
          petalMid: '#a78bfa',
          petalInner: '#c4b5fd',
          center: '#fbbf24',
          glow: 'rgba(139, 92, 246, 0.2)'
        },
        golden: {
          name: 'Golden',
          petalOuter: '#f59e0b',
          petalMid: '#fbbf24',
          petalInner: '#fcd34d',
          center: '#fde68a',
          glow: 'rgba(251, 191, 36, 0.2)'
        }
      };

      // Draw lotus
      function drawLotus(progress) {
        const style = lotusStyles[currentStyle];
        const w = canvas.width;
        const h = canvas.height;
        const cx = w / 2;
        const cy = h / 2 + 20;
        const maxSize = Math.min(w, h) * 0.35;
        const size = maxSize * (0.6 + progress * 0.4);
        
        // Clear and draw background
        drawBackground();
        
        // Glow
        const glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, size * 1.3);
        glow.addColorStop(0, style.glow);
        glow.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(cx, cy, size * 1.3, 0, Math.PI * 2);
        ctx.fill();
        
        // Water ripple
        for (let i = 0; i < 3; i++) {
          const rippleSize = size * (0.8 + i * 0.4);
          ctx.beginPath();
          ctx.ellipse(cx, cy + 10, rippleSize, rippleSize * 0.2, 0, 0, Math.PI * 2);
          ctx.strokeStyle = `rgba(100, 180, 200, ${0.05 - i * 0.015})`;
          ctx.lineWidth = 1;
          ctx.stroke();
        }
        
        // Lotus petals - multiple layers
        const petalLayers = [
          { count: 6, size: size * 1.0, offset: 0.1, progress: progress },
          { count: 8, size: size * 0.8, offset: 0.2, progress: Math.min(1, progress * 1.3) },
          { count: 10, size: size * 0.6, offset: 0.3, progress: Math.min(1, progress * 1.6) },
          { count: 12, size: size * 0.4, offset: 0.4, progress: Math.min(1, progress * 2.0) }
        ];
        
        petalLayers.forEach((layer, layerIdx) => {
          const p = layer.progress;
          const petalSize = layer.size * (0.3 + p * 0.7);
          const spread = 0.3 + p * 0.7;
          
          for (let i = 0; i < layer.count; i++) {
            const angle = (i / layer.count) * Math.PI * 2 + layer.offset;
            const px = cx + Math.cos(angle) * petalSize * 0.15 * spread;
            const py = cy + Math.sin(angle) * petalSize * 0.15 * spread;
            
            ctx.save();
            ctx.translate(px, py);
            ctx.rotate(angle);
            
            // Petal shape
            const petalWidth = petalSize * 0.3;
            const petalHeight = petalSize * (0.5 + p * 0.3);
            const petalOpen = 0.5 + p * 0.5;
            
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.quadraticCurveTo(
              petalWidth * 0.5 * petalOpen,
              -petalHeight * 0.4,
              petalWidth * 0.3,
              -petalHeight
            );
            ctx.quadraticCurveTo(
              0,
              -petalHeight * 0.8,
              -petalWidth * 0.3,
              -petalHeight
            );
            ctx.quadraticCurveTo(
              -petalWidth * 0.5 * petalOpen,
              -petalHeight * 0.4,
              0,
              0
            );
            ctx.closePath();
            
            // Petal gradient
            const grad = ctx.createRadialGradient(0, -petalHeight * 0.3, 0, 0, -petalHeight * 0.3, petalHeight);
            const innerColor = layerIdx === petalLayers.length - 1 ? style.center : style.petalInner;
            const midColor = layerIdx === petalLayers.length - 1 ? style.petalInner : style.petalMid;
            const outerColor = layerIdx === petalLayers.length - 1 ? style.petalMid : style.petalOuter;
            
            grad.addColorStop(0, innerColor);
            grad.addColorStop(0.4, midColor);
            grad.addColorStop(1, outerColor);
            ctx.fillStyle = grad;
            ctx.fill();
            
            // Petal vein
            ctx.globalAlpha = 0.15;
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 0.5;
            ctx.beginPath();
            ctx.moveTo(0, -petalHeight * 0.1);
            ctx.quadraticCurveTo(0, -petalHeight * 0.5, 0, -petalHeight * 0.9);
            ctx.stroke();
            ctx.globalAlpha = 1;
            
            ctx.restore();
          }
        });
        
        // Lotus center
        ctx.save();
        ctx.translate(cx, cy);
        
        // Center glow
        const centerGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, size * 0.2);
        centerGrad.addColorStop(0, style.center);
        centerGrad.addColorStop(0.5, style.petalInner);
        centerGrad.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = centerGrad;
        ctx.beginPath();
        ctx.arc(0, 0, size * 0.2, 0, Math.PI * 2);
        ctx.fill();
        
        // Center dots (seeds)
        for (let i = 0; i < 8; i++) {
          const angle = (i / 8) * Math.PI * 2;
          const dist = size * 0.08;
          const dx = Math.cos(angle) * dist;
          const dy = Math.sin(angle) * dist;
          ctx.fillStyle = 'rgba(139, 92, 80, 0.3)';
          ctx.beginPath();
          ctx.arc(dx, dy, size * 0.02, 0, Math.PI * 2);
          ctx.fill();
        }
        
        ctx.restore();
        
        // Water reflection
        ctx.save();
        ctx.globalAlpha = 0.05;
        for (let i = 0; i < 5; i++) {
          const rx = cx + (Math.random() - 0.5) * size * 0.8;
          const ry = cy + size * 0.4 + Math.random() * size * 0.3;
          const rw = 10 + Math.random() * 20;
          ctx.fillStyle = style.petalOuter;
          ctx.beginPath();
          ctx.ellipse(rx, ry, rw, rw * 0.15, 0, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }

      // Draw background
      function drawBackground() {
        const w = canvas.width;
        const h = canvas.height;
        
        // Water gradient
        const grad = ctx.createRadialGradient(w/2, h/2, 0, w/2, h/2, w * 0.7);
        grad.addColorStop(0, 'rgba(20, 60, 80, 0.2)');
        grad.addColorStop(0.5, 'rgba(15, 40, 60, 0.3)');
        grad.addColorStop(1, 'rgba(10, 30, 50, 0.4)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, w, h);
        
        // Water texture
        for (let i = 0; i < 30; i++) {
          const x = Math.random() * w;
          const y = Math.random() * h;
          const r = 5 + Math.random() * 20;
          ctx.beginPath();
          ctx.ellipse(x, y, r, r * 0.15, Math.random() * Math.PI, 0, Math.PI * 2);
          ctx.strokeStyle = `rgba(100, 180, 200, ${0.02 + Math.random() * 0.02})`;
          ctx.lineWidth = 0.5;
          ctx.stroke();
        }
        
        // Moon glow
        const moonGrad = ctx.createRadialGradient(w * 0.8, h * 0.15, 0, w * 0.8, h * 0.15, 80);
        moonGrad.addColorStop(0, 'rgba(200, 220, 240, 0.03)');
        moonGrad.addColorStop(1, 'rgba(200, 220, 240, 0)');
        ctx.fillStyle = moonGrad;
        ctx.beginPath();
        ctx.arc(w * 0.8, h * 0.15, 80, 0, Math.PI * 2);
        ctx.fill();
      }

      // Resize canvas
      function resizeCanvas() {
        const rect = display.getBoundingClientRect();
        canvas.width = rect.width;
        canvas.height = rect.height;
        canvas.style.width = rect.width + 'px';
        canvas.style.height = rect.height + 'px';
        drawLotus(bloom);
      }

      // Update bloom
      function updateBloom() {
        const progress = bloom;
        const percent = Math.round(progress * 100);
        bloomPercent.textContent = percent + '%';
        bloomValue.textContent = percent + '%';
        bloomSlider.value = percent;
        
        drawLotus(progress);
        
        if (progress > 0.9) {
          lotusStatus.textContent = '🌸 Lotus fully bloomed! Sacred beauty revealed ✨';
          lotusStatus.style.color = '#fbbf24';
          lotusMessage.textContent = 'The sacred lotus has fully opened';
          lotusMessage.style.color = '#fbbf24';
        } else if (progress > 0.4) {
          lotusStatus.textContent = '🌸 Lotus petals slowly unfolding...';
          lotusStatus.style.color = '#f472b6';
          lotusMessage.textContent = 'The lotus is gracefully opening';
          lotusMessage.style.color = '#f472b6';
        } else if (progress > 0.05) {
          lotusStatus.textContent = '🌸 The lotus begins to bloom...';
          lotusStatus.style.color = '#818cf8';
          lotusMessage.textContent = 'A sacred lotus slowly opens its petals';
          lotusMessage.style.color = '#818cf8';
        } else {
          lotusStatus.textContent = '🌸 A sacred lotus waits to bloom';
          lotusStatus.style.color = '#94a3b8';
          lotusMessage.textContent = 'A sacred lotus slowly opens its petals';
          lotusMessage.style.color = '#94a3b8';
        }
        
        // Update button
        if (progress > 0.9) {
          bloomBtn.textContent = '🌸 Fully Bloomed';
          bloomBtn.style.background = 'linear-gradient(135deg, #fbbf24, #f59e0b)';
          bloomBtn.style.borderColor = '#fcd34d';
        } else if (progress > 0.05) {
          bloomBtn.textContent = '🌸 Blooming...';
          bloomBtn.style.background = 'linear-gradient(135deg, #f472b6, #ec4899)';
          bloomBtn.style.borderColor = '#f9a8d4';
        } else {
          bloomBtn.textContent = '🌸 Bloom';
          bloomBtn.style.background = 'linear-gradient(135deg, #6366f1, #4f46e5)';
          bloomBtn.style.borderColor = '#818cf8';
        }
      }

      // Animate bloom
      function animateBloom() {
        if (Math.abs(bloom - targetBloom) < 0.001) {
          bloom = targetBloom;
          updateBloom();
          animationId = null;
          return;
        }
        
        bloom += (targetBloom - bloom) * 0.06;
        updateBloom();
        animationId = requestAnimationFrame(animateBloom);
      }

      // Start bloom animation
      function startBloom() {
        if (animationId) {
          cancelAnimationFrame(animationId);
          animationId = null;
        }
        animateBloom();
      }

      // Set bloom
      function setBloom(value) {
        targetBloom = Math.max(0, Math.min(1, value / 100));
        if (targetBloom > 0.9) {
          lotusStatus.textContent = '🌸 Lotus fully bloomed! Sacred beauty revealed ✨';
          lotusStatus.style.color = '#fbbf24';
        }
        startBloom();
      }

      // Toggle bloom
      function toggleBloom() {
        if (bloom > 0.5) {
          targetBloom = 0;
          bloomBtn.textContent = '🌸 Bloom';
          bloomBtn.style.background = 'linear-gradient(135deg, #6366f1, #4f46e5)';
          bloomBtn.style.borderColor = '#818cf8';
        } else {
          targetBloom = 1;
        }
        startBloom();
      }

      // Set style
      function setStyle(style) {
        currentStyle = style;
        styleBtns.forEach(btn => {
          btn.classList.toggle('active', btn.dataset.style === style);
        });
        const styleNames = {
          pink: 'Pink',
          white: 'White',
          purple: 'Purple',
          golden: 'Golden'
        };
        lotusStatus.textContent = `🎨 Style: ${styleNames[style]}`;
        lotusStatus.style.color = '#a78bfa';
        setTimeout(() => {
          if (bloom < 0.1) {
            lotusStatus.textContent = '🌸 A sacred lotus waits to bloom';
            lotusStatus.style.color = '#94a3b8';
          }
        }, 1500);
        updateBloom();
      }

      // Reset
      function resetLotus() {
        if (animationId) {
          cancelAnimationFrame(animationId);
          animationId = null;
        }
        bloom = 0;
        targetBloom = 0;
        updateBloom();
        bloomBtn.textContent = '🌸 Bloom';
        bloomBtn.style.background = 'linear-gradient(135deg, #6366f1, #4f46e5)';
        bloomBtn.style.borderColor = '#818cf8';
        lotusStatus.textContent = '🔄 Reset complete';
        lotusStatus.style.color = '#94a3b8';
        lotusMessage.textContent = 'A sacred lotus slowly opens its petals';
        lotusMessage.style.color = '#94a3b8';
        setTimeout(() => {
          lotusStatus.textContent = '🌸 A sacred lotus waits to bloom';
          lotusStatus.style.color = '#94a3b8';
        }, 1000);
      }

      // Event listeners
      bloomSlider.addEventListener('input', function() {
        setBloom(parseInt(this.value));
      });

      styleBtns.forEach(btn => {
        btn.addEventListener('click', function() {
          setStyle(this.dataset.style);
        });
      });

      if (bloomBtn) {
        bloomBtn.addEventListener('click', function(e) {
          e.preventDefault();
          toggleBloom();
        });
      }

      if (resetBtn) {
        resetBtn.addEventListener('click', function(e) {
          e.preventDefault();
          resetLotus();
        });
      }

      // Click on display to toggle
      display.addEventListener('click', function(e) {
        if (e.target === this || e.target === canvas) {
          toggleBloom();
        }
      });

      // Keyboard shortcuts
      document.addEventListener('keydown', function(e) {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

        const key = e.key;
        if (key === ' ' || key === 'Space') {
          e.preventDefault();
          toggleBloom();
        } else if (key === 'r' || key === 'R') {
          e.preventDefault();
          resetLotus();
        }
      });

      // Resize
      window.addEventListener('resize', resizeCanvas);

      // Initialize
      resizeCanvas();
      
      console.log('🌸 Lotus Bloom ready · shortcuts: [Space] Toggle, [R] Reset');
    })();
  </script>
</body>
</html>
