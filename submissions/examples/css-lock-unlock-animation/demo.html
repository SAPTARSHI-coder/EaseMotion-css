<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Lock Unlock Animation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="lock-demo">
    <h1>CSS Lock Animation</h1>
    <p class="description">Toggle the lock state by clicking or using the keyboard (Space/Enter).</p>
    
    <div class="lock-container">
      <input type="checkbox" id="lock-toggle" class="visually-hidden">
      
      <label for="lock-toggle" class="lock-label">
        <span class="visually-hidden">Toggle lock state</span>
        
        <div class="padlock" aria-hidden="true">
          <div class="padlock-shackle"></div>
          <div class="padlock-body">
            <div class="padlock-keyhole"></div>
          </div>
        </div>
        
        <div class="lock-status" aria-live="polite">
          <span class="status-locked">Locked</span>
          <span class="status-unlocked">Unlocked</span>
        </div>
      </label>
    </div>
  </div>
</body>
</html>
