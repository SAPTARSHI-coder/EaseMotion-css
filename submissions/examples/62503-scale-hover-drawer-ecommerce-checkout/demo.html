<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scale Hover Drawer</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="page">

<div class="content">
<h1>E-Commerce Checkout</h1>
<p>
Hover over the checkout drawer to preview your order summary,
shipping details, and payment information.
</p>

<button class="shop-btn">Continue Shopping</button>
</div>

<aside class="drawer">

<div class="drawer-header">
<h2>Checkout</h2>
<button class="close-btn">&times;</button>
</div>

<div class="cart-items">

<div class="item">
<div class="icon">📱</div>
<div>
<h4>Smartphone</h4>
<span>$699</span>
</div>
</div>

<div class="item">
<div class="icon">⌚</div>
<div>
<h4>Smart Watch</h4>
<span>$249</span>
</div>
</div>

</div>

<div class="coupon">
<input type="text" placeholder="Coupon Code">
<button>Apply</button>
</div>

<div class="summary">

<div>
<span>Subtotal</span>
<strong>$948</strong>
</div>

<div>
<span>Shipping</span>
<strong>Free</strong>
</div>

<div class="total">
<span>Total</span>
<strong>$948</strong>
</div>

</div>

<button class="checkout-btn">
Secure Checkout
</button>

</aside>

</div>

</body>
</html>
