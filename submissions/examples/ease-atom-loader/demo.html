<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atom Loader · Electron Orbit</title>

    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <div class="card">
        <h2>⚛️ Atom Loader</h2>
        <p class="sub">electrons orbit a nucleus like an atom</p>

        <!-- === ATOM LOADER === -->
        <div class="atom-container" id="atomContainer">
            <div class="atom">
                <!-- Nucleus -->
                <div class="nucleus">
                    <div class="nucleus-core"></div>
                    <div class="nucleus-glow"></div>
                </div>

                <!-- Orbit 1 -->
                <div class="orbit orbit-1">
                    <div class="electron electron-1">
                        <div class="electron-dot"></div>
                    </div>
                    <div class="electron electron-2">
                        <div class="electron-dot"></div>
                    </div>
                </div>

                <!-- Orbit 2 -->
                <div class="orbit orbit-2">
                    <div class="electron electron-3">
                        <div class="electron-dot"></div>
                    </div>
                    <div class="electron electron-4">
                        <div class="electron-dot"></div>
                    </div>
                </div>

                <!-- Orbit 3 -->
                <div class="orbit orbit-3">
                    <div class="electron electron-5">
                        <div class="electron-dot"></div>
                    </div>
                    <div class="electron electron-6">
                        <div class="electron-dot"></div>
                    </div>
                </div>
            </div>
        </div>

        <p style="margin-top: 2rem; font-size: 0.85rem; color: #64748b;">
            Electrons orbiting · atomic loading animation
        </p>
    </div>

    <!-- Embedded JavaScript -->
    <script>
        (function() {
            'use strict';

            const container = document.getElementById('atomContainer');

            // Click to restart animation
            container.addEventListener('click', function() {
                const orbits = this.querySelectorAll('.orbit');
                const electrons = this.querySelectorAll('.electron');
                const nucleus = this.querySelector('.nucleus-glow');

                orbits.forEach(orbit => {
                    orbit.style.animation = 'none';
                    void orbit.offsetWidth;
                    orbit.style.animation = '';
                });

                electrons.forEach(electron => {
                    electron.style.animation = 'none';
                    void electron.offsetWidth;
                    electron.style.animation = '';
                });

                nucleus.style.animation = 'none';
                void nucleus.offsetWidth;
                nucleus.style.animation = '';

                this.classList.add('click-pulse');
                setTimeout(() => {
                    this.classList.remove('click-pulse');
                }, 300);

                console.log('⚛️ Atom loader restarted!');
            });

            // Keyboard accessibility
            container.setAttribute('tabindex', '0');
            container.setAttribute('role', 'button');
            container.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    this.click();
                }
            });

            console.log('⚛️ Atom loader initialized!');

        })();
    </script>

</body>
</html>
