<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card Carousel Demo | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body style="margin:0; background:var(--comp-bg); min-height:100vh;">
  <div class="card-carousel-container">
    <h1 style="font-size:2rem; font-weight:700; color:var(--comp-text); margin:0 0 0.5rem 0;">Card Carousel Component</h1>
    <p style="color:var(--comp-text-muted); margin:0 0 2rem 0;">Issue #69795 - Pure CSS card carousel.</p>
    <div class="card-carousel-card card-carousel-animate">
      <h2 class="card-carousel-title">Card Carousel Demo</h2>
      <p class="card-carousel-desc">A pure CSS card carousel with smooth animations and dark/light mode support.</p>
      <a href="#" class="card-carousel-btn">Get Started</a>

    <div style="text-align:center; margin-top:3rem; color:var(--comp-text-muted); font-size:0.875rem;">
