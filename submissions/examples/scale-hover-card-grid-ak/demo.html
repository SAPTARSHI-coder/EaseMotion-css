<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Scale-Hover Card Grid — Gaming Hub</title>
<link rel="stylesheet" href="style.css">
<style>
  body {
    font-family: sans-serif;
    background: #0d0d17;
    color: #fff;
    margin: 0;
  }
  h1 {
    padding: 24px 24px 0;
    font-size: 22px;
  }
  .placeholder-art {
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, #6366f1, #22d3ee);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    color: rgba(255,255,255,0.6);
  }
</style>
</head>
<body>
  <h1>Gaming Hub</h1>
  <div class="game-grid">
    <div class="game-card" tabindex="0">
      <div class="placeholder-art">Cover Art</div>
      <div class="game-title">Nebula Drift</div>
    </div>
    <div class="game-card" tabindex="0">
      <div class="placeholder-art">Cover Art</div>
      <div class="game-title">Iron Vanguard</div>
    </div>
    <div class="game-card" tabindex="0">
      <div class="placeholder-art">Cover Art</div>
      <div class="game-title">Shadow Realms</div>
    </div>
    <div class="game-card" tabindex="0">
      <div class="placeholder-art">Cover Art</div>
      <div class="game-title">Skybound Legends</div>
    </div>
  </div>
</body>
</html>
