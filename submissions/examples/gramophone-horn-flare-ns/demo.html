<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gramophone Horn Flare — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Gramophone Horn Flare demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Gramophone Horn Flare</h1>
      <p class="lede">Gramophone horn flaring acoustic rings outward</p>
    </header>

    <section class="ease-gramophone-horn-flare" data-demo="gramophone-horn-flare" aria-live="polite">
      <div class="ease-gramophone-horn-flare__housing">
        <div class="ease-gramophone-horn-flare__bezel">
          <div class="ease-gramophone-horn-flare__face">
            <div class="ease-gramophone-horn-flare__readout">
              <span class="ease-gramophone-horn-flare__label">Gramophone Horn Flare</span>
              <span class="ease-gramophone-horn-flare__value">LIVE</span>
            </div>
            <div class="ease-gramophone-horn-flare__motion" aria-hidden="true">
              <span class="ease-gramophone-horn-flare__a"></span>
              <span class="ease-gramophone-horn-flare__b"></span>
              <span class="ease-gramophone-horn-flare__c"></span>
              <span class="ease-gramophone-horn-flare__d"></span>
            </div>
            <div class="ease-gramophone-horn-flare__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-gramophone-horn-flare__controls">
          <button type="button" class="ease-gramophone-horn-flare__btn primary">Engage</button>
          <button type="button" class="ease-gramophone-horn-flare__btn">Reset</button>
          <label class="ease-gramophone-horn-flare__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-gramophone-horn-flare__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
