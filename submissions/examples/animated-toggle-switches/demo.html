<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animated Toggle Switches</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>Animated Toggle Switches</h1>

    <label class="switch">
      <input type="checkbox">
      <span class="slider"></span>
    </label>

    <label class="switch">
      <input type="checkbox" checked>
      <span class="slider"></span>
    </label>

    <label class="switch round">
      <input type="checkbox">
      <span class="slider"></span>
    </label>

    <label class="switch round">
      <input type="checkbox" checked>
      <span class="slider"></span>
    </label>
  </div>

</body>
</html>
