<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Toast Notification Component</title>
<link rel="stylesheet" href="style.css">
<style>
  body {
    font-family: sans-serif;
    background: #111;
    color: #fff;
    padding: 32px;
  }
  button {
    background: #1b1b2f;
    color: #fff;
    border: 1px solid #333;
    padding: 10px 16px;
    border-radius: 6px;
    cursor: pointer;
    margin-right: 8px;
    font-size: 14px;
  }
  button:hover {
    border-color: #6366f1;
  }
</style>
</head>
<body>
  <h1>Toast Notification Demo</h1>
  <p>Static examples below (no JS in this demo — see README for dismiss/trigger pattern).</p>

  <div class="toast-container" style="position: static; margin-top: 24px;">
    <div class="toast toast--success">
      <span class="toast-icon">✅</span>
      <div class="toast-content">
        <div class="toast-title">Success</div>
        Your changes have been saved.
      </div>
      <button class="toast-close" aria-label="Close">✕</button>
    </div>

    <div class="toast toast--error">
      <span class="toast-icon">⚠️</span>
      <div class="toast-content">
        <div class="toast-title">Error</div>
        Something went wrong. Please try again.
      </div>
      <button class="toast-close" aria-label="Close">✕</button>
    </div>

    <div class="toast toast--warning">
      <span class="toast-icon">🔔</span>
      <div class="toast-content">
        <div class="toast-title">Warning</div>
        Your session will expire in 5 minutes.
      </div>
      <button class="toast-close" aria-label="Close">✕</button>
    </div>
  </div>
</body>
</html>
