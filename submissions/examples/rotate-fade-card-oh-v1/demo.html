<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rotate-Fade Card Grid</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="card-grid">
    <div class="ease-rotate-fade-card card">
      <h3>Rotate Card</h3>
      <p>3D rotation effect</p>
    </div>
    <div class="ease-rotate-fade-card card">
      <h3>Fade In</h3>
      <p>Smooth fade animation</p>
    </div>
    <div class="ease-rotate-fade-card card">
      <h3>Neon Style</h3>
      <p>Cyberpunk glow</p>
    </div>
  </div>
</body>
</html>
