<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blooming Flower – Flower Blooms from Center Outward</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <h1>🌸 Blooming Flower</h1>
    <p class="subtitle">Flower blooms from the center outward</p>

    <div class="flower-container">
      <div class="flower-stage" id="flowerStage">
        <canvas id="canvas"></canvas>
        
        <!-- Info overlay -->
        <div class="info-overlay">
          <span class="flower-status" id="flowerStatus">🌱 Bud</span>
          <span class="petal-count" id="petalCount">✦ 0 petals</span>
        </div>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <button class="ctrl-btn bloom" id="bloomBtn">🌸 Bloom</button>
      <button class="ctrl-btn reset" id="resetBtn">↺ Reset</button>
      <button class="ctrl-btn toggle" id="toggleBtn">⏸ Pause</button>
      <button class="ctrl-btn color" id="colorBtn">🎨 Color</button>
    </div>

    <!-- Sliders -->
    <div class="slider-container">
      <span class="slider-label">Bloom Speed</span>
      <input type="range" id="speedSlider" min="1" max="10" value="5" />
      <span class="slider-value" id="speedValue">5×</span>
    </div>

    <div class="slider-container">
      <span class="slider-label">Petal Count</span>
      <input type="range" id="petalSlider" min="5" max="24" value="12" step="1" />
      <span class="slider-value" id="petalValue">12</span>
    </div>

    <div class="slider-container">
      <span class="slider-label">Flower Size</span>
      <input type="range" id="sizeSlider" min="30" max="100" value="70" />
      <span class="slider-value" id="sizeValue">70%</span>
    </div>

    <!-- Status -->
    <div class="status" id="status">🌸 Click Bloom to watch the flower open</div>

    <!-- Keyboard shortcuts -->
    <div class="shortcuts">
      <kbd>B</kbd> Bloom · <kbd>R</kbd> Reset · <kbd>Space</kbd> Pause · <kbd>C</kbd> Color
    </div>
  </div>

  <script>
    (function() {
      "use strict";

      // DOM elements
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      const flowerStatus = document.getElementById('flowerStatus');
      const petalCount = document.getElementById('petalCount');
      const bloomBtn = document.getElementById('bloomBtn');
      const resetBtn = document.getElementById('resetBtn');
      const toggleBtn = document.getElementById('toggleBtn');
      const colorBtn = document.getElementById('colorBtn');
      const status = document.getElementById('status');
      const speedSlider = document.getElementById('speedSlider');
      const speedValue = document.getElementById('speedValue');
      const petalSlider = document.getElementById('petalSlider');
      const petalValue = document.getElementById('petalValue');
      const sizeSlider = document.getElementById('sizeSlider');
      const sizeValue = document.getElementById('sizeValue');

      // State
      let bloomProgress = 0; // 0-1
      let targetBloom = 0;
      let isPaused = false;
      let animationId = null;
      let time = 0;
      let hue = 320; // Pink
      let particles = [];

      // ----- Canvas setup -----
      function setupCanvas() {
        const rect = canvas.parentElement.getBoundingClientRect();
        const size = Math.min(rect.width - 40, 600);
        canvas.width = size;
        canvas.height = size;
        canvas.style.width = size + 'px';
        canvas.style.height = size + 'px';
      }

      // ----- Particle class for bloom effect -----
      class Particle {
        constructor(x, y, angle, speed) {
          this.x = x;
          this.y = y;
          this.angle = angle;
          this.speed = speed;
          this.life = 1;
          this.size = 1 + Math.random() * 3;
          this.decay = 0.01 + Math.random() * 0.02;
          this.hue = hue + (Math.random() - 0.5) * 30;
          this.saturation = 80 + Math.random() * 20;
          this.lightness = 60 + Math.random() * 30;
        }

        update() {
          this.x += Math.cos(this.angle) * this.speed;
          this.y += Math.sin(this.angle) * this.speed;
          this.life -= this.decay;
          this.size *= 0.99;
          return this.life > 0;
        }

        draw(ctx) {
          const alpha = this.life * 0.8;
          const size = this.size * this.life;
          
          // Glow
          const gradient = ctx.createRadialGradient(
            this.x, this.y, 0,
            this.x, this.y, size * 4
          );
          gradient.addColorStop(0, `hsla(${this.hue}, 100%, 90%, ${alpha * 0.3})`);
          gradient.addColorStop(1, `hsla(${this.hue}, 100%, 60%, 0)`);
          ctx.fillStyle = gradient;
          ctx.beginPath();
          ctx.arc(this.x, this.y, size * 4, 0, Math.PI * 2);
          ctx.fill();

          // Core
          ctx.fillStyle = `hsla(${this.hue}, 100%, 85%, ${alpha * 0.9})`;
          ctx.beginPath();
          ctx.arc(this.x, this.y, size, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // ----- Create bloom particles -----
      function createBloomParticles(cx, cy, count = 30) {
        for (let i = 0; i < count; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 1 + Math.random() * 3;
          const p = new Particle(cx, cy, angle, speed);
          particles.push(p);
        }
      }

      // ----- Draw flower -----
      function drawFlower() {
        const w = canvas.width;
        const h = canvas.height;
        const cx = w / 2;
        const cy = h / 2;
        const progress = bloomProgress;
        const petalCountVal = parseInt(petalSlider.value);
        const sizeMult = parseInt(sizeSlider.value) / 100;
        const speed = parseInt(speedSlider.value) / 5;

        // Clear
        ctx.clearRect(0, 0, w, h);

        // Background
        const bgGradient = ctx.createRadialGradient(cx, cy, 0, cx, cy, w * 0.8);
        bgGradient.addColorStop(0, '#0a0a1a');
        bgGradient.addColorStop(0.5, '#060612');
        bgGradient.addColorStop(1, '#020208');
        ctx.fillStyle = bgGradient;
        ctx.fillRect(0, 0, w, h);

        // Background glow
        const bgGlow = ctx.createRadialGradient(cx, cy, 0, cx, cy, w * 0.4);
        bgGlow.addColorStop(0, `hsla(${hue}, 60%, 20%, ${0.1 * progress})`);
        bgGlow.addColorStop(1, `hsla(${hue}, 60%, 10%, 0)`);
        ctx.fillStyle = bgGlow;
        ctx.beginPath();
        ctx.arc(cx, cy, w * 0.4, 0, Math.PI * 2);
        ctx.fill();

        // Draw petals
        const maxRadius = Math.min(w, h) * 0.35 * sizeMult;
        const petalLength = maxRadius * (0.2 + 0.8 * progress);
        const petalWidth = maxRadius * 0.2;

        for (let i = 0; i < petalCountVal; i++) {
          const angle = (i / petalCountVal) * Math.PI * 2 + time * 0.01 * speed * (1 - progress * 0.5);
          const x = cx + Math.cos(angle) * petalLength * 0.3;
          const y = cy + Math.sin(angle) * petalLength * 0.3;
          
          // Petal shape with bloom effect
          const petalProgress = Math.min(1, progress * 1.5);
          const pLength = petalLength * (0.3 + 0.7 * petalProgress);
          const pWidth = petalWidth * (0.5 + 0.5 * petalProgress);
          
          // Petal color
          const hueOffset = (i / petalCountVal) * 30 + (1 - progress) * 10;
          const lightness = 50 + 30 * petalProgress * (0.5 + 0.5 * Math.sin(angle * 2 + time));
          
          ctx.save();
          ctx.translate(cx, cy);
          ctx.rotate(angle);
          
          // Petal glow
          const glowGrad = ctx.createRadialGradient(
            pLength * 0.3, 0, 0,
            pLength * 0.3, 0, pLength * 0.8
          );
          glowGrad.addColorStop(0, `hsla(${hue + hueOffset}, 80%, ${lightness + 20}%, ${0.1 * petalProgress})`);
          glowGrad.addColorStop(1, `hsla(${hue + hueOffset}, 80%, ${lightness}, 0)`);
          ctx.fillStyle = glowGrad;
          ctx.beginPath();
          ctx.ellipse(pLength * 0.3, 0, pLength * 0.8, pLength * 0.3, 0, 0, Math.PI * 2);
          ctx.fill();

          // Petal body
          ctx.shadowColor = `hsla(${hue + hueOffset}, 80%, 60%, ${0.05 * petalProgress})`;
          ctx.shadowBlur = 20;

          const grad = ctx.createRadialGradient(
            pLength * 0.2, 0, 0,
            pLength * 0.5, 0, pLength * 0.7
          );
          const sat = 70 + 30 * petalProgress;
          const light = 50 + 30 * petalProgress * (0.5 + 0.5 * Math.sin(angle * 2 + time));
          grad.addColorStop(0, `hsla(${hue + hueOffset + 10}, ${sat + 10}%, ${light + 20}%, ${0.9 * petalProgress})`);
          grad.addColorStop(0.5, `hsla(${hue + hueOffset}, ${sat}%, ${light}%, ${0.8 * petalProgress})`);
          grad.addColorStop(1, `hsla(${hue + hueOffset - 10}, ${sat - 10}%, ${light - 20}%, ${0.6 * petalProgress})`);

          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.ellipse(pLength * 0.4, 0, pLength * 0.6, pWidth * 0.6, 0, 0, Math.PI * 2);
          ctx.fill();

          // Petal tip detail
          ctx.shadowBlur = 0;
          ctx.fillStyle = `hsla(${hue + hueOffset + 20}, 80%, ${light + 30}%, ${0.15 * petalProgress})`;
          ctx.beginPath();
          ctx.ellipse(pLength * 0.8, 0, pLength * 0.15, pWidth * 0.15, 0, 0, Math.PI * 2);
          ctx.fill();

          ctx.restore();
        }

        // Draw inner petals (staggered)
        const innerCount = Math.floor(petalCountVal * 0.6);
        for (let i = 0; i < innerCount; i++) {
          const angle = (i / innerCount) * Math.PI * 2 + Math.PI / innerCount + time * 0.008 * speed * (1 - progress * 0.5);
          const innerProgress = Math.min(1, progress * 1.2);
          const pLength = maxRadius * 0.25 * (0.2 + 0.8 * innerProgress);
          const pWidth = maxRadius * 0.12 * (0.3 + 0.7 * innerProgress);
          
          ctx.save();
          ctx.translate(cx, cy);
          ctx.rotate(angle);
          
          const hueOffset = (i / innerCount) * 20 + 10;
          const grad = ctx.createRadialGradient(
            pLength * 0.3, 0, 0,
            pLength * 0.5, 0, pLength * 0.7
          );
          grad.addColorStop(0, `hsla(${hue + hueOffset + 20}, 80%, 80%, ${0.5 * innerProgress})`);
          grad.addColorStop(0.5, `hsla(${hue + hueOffset}, 70%, 60%, ${0.4 * innerProgress})`);
          grad.addColorStop(1, `hsla(${hue + hueOffset - 10}, 60%, 40%, ${0.3 * innerProgress})`);
          
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.ellipse(pLength * 0.4, 0, pLength * 0.5, pWidth * 0.5, 0, 0, Math.PI * 2);
          ctx.fill();
          
          ctx.restore();
        }

        // Draw center
        const centerSize = maxRadius * 0.15 * (0.3 + 0.7 * progress);
        const centerGrad = ctx.createRadialGradient(
          cx - centerSize * 0.2, cy - centerSize * 0.2, 0,
          cx, cy, centerSize
        );
        centerGrad.addColorStop(0, `hsla(${hue + 30}, 80%, 90%, ${0.8 * progress})`);
        centerGrad.addColorStop(0.5, `hsla(${hue + 10}, 70%, 60%, ${0.6 * progress})`);
        centerGrad.addColorStop(1, `hsla(${hue - 10}, 60%, 30%, ${0.4 * progress})`);
        ctx.fillStyle = centerGrad;
        ctx.shadowColor = `hsla(${hue}, 80%, 60%, ${0.1 * progress})`;
        ctx.shadowBlur = 30;
        ctx.beginPath();
        ctx.arc(cx, cy, centerSize, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;

        // Center detail dots
        if (progress > 0.3) {
          const dotCount = Math.floor(10 + progress * 20);
          for (let i = 0; i < dotCount; i++) {
            const angle = (i / dotCount) * Math.PI * 2 + time * 0.02;
            const r = centerSize * (0.3 + 0.5 * Math.sin(i * 1.5 + time * 0.5));
            const x = cx + Math.cos(angle) * r;
            const y = cy + Math.sin(angle) * r;
            const dotSize = 1 + progress * 2 * (0.5 + 0.5 * Math.sin(i * 2 + time));
            ctx.fillStyle = `hsla(${hue + 30}, 100%, 90%, ${0.3 * progress})`;
            ctx.beginPath();
            ctx.arc(x, y, dotSize, 0, Math.PI * 2);
            ctx.fill();
          }
        }

        // Draw particles
        particles = particles.filter(p => p.update());
        particles.forEach(p => p.draw(ctx));

        // Update status
        if (progress < 0.1) {
          flowerStatus.textContent = '🌱 Bud';
          status.textContent = '🌱 Flower is budding...';
        } else if (progress < 0.4) {
          flowerStatus.textContent = '🌿 Opening';
          status.textContent = '🌿 Flower is opening...';
        } else if (progress < 0.7) {
          flowerStatus.textContent = '🌸 Blooming';
          status.textContent = '🌸 Flower is blooming!';
        } else if (progress < 0.95) {
          flowerStatus.textContent = '🌺 Full Bloom';
          status.textContent = '🌺 Flower is in full bloom!';
        } else {
          flowerStatus.textContent = '🌺 Bloomed';
          status.textContent = '🌺 Flower fully bloomed!';
        }
        petalCount.textContent = `✦ ${petalCountVal} petals`;
      }

      // ----- Animation loop -----
      function animate() {
        time += 0.016;

        if (!isPaused) {
          const speed = parseInt(speedSlider.value) / 5;
          const diff = targetBloom - bloomProgress;
          if (Math.abs(diff) > 0.001) {
            bloomProgress += diff * 0.03 * speed;
          } else {
            bloomProgress = targetBloom;
          }
        }

        drawFlower();
        animationId = requestAnimationFrame(animate);
      }

      // ----- Start animation -----
      function startAnimation() {
        if (animationId) {
          cancelAnimationFrame(animationId);
        }
        animate();
      }

      // ----- Bloom -----
      function bloom() {
        targetBloom = 1;
        status.textContent = '🌸 Flower blooming...';
        // Create particles
        const cx = canvas.width / 2;
        const cy = canvas.height / 2;
        createBloomParticles(cx, cy, 40);
        setTimeout(() => {
          if (bloomProgress > 0.9) {
            status.textContent = '🌺 Flower fully bloomed!';
          }
        }, 2000);
      }

      // ----- Reset -----
      function resetFlower() {
        targetBloom = 0;
        bloomProgress = 0;
        particles = [];
        status.textContent = '↺ Reset';
        flowerStatus.textContent = '🌱 Bud';
        setTimeout(() => {
          status.textContent = '🌸 Click Bloom to watch the flower open';
        }, 500);
      }

      // ----- Toggle pause -----
      function togglePause() {
        isPaused = !isPaused;
        toggleBtn.textContent = isPaused ? '▶ Play' : '⏸ Pause';
        status.textContent = isPaused ? '⏸ Paused' : '▶ Resumed';
      }

      // ----- Change color -----
      function changeColor() {
        const colors = [320, 340, 0, 20, 40, 180, 220, 280];
        const currentIndex = colors.indexOf(hue);
        const nextIndex = (currentIndex + 1) % colors.length;
        hue = colors[nextIndex];
        const colorNames = ['Pink', 'Rose', 'Red', 'Orange', 'Yellow', 'Teal', 'Blue', 'Purple'];
        status.textContent = `🎨 Color: ${colorNames[nextIndex]}`;
        // Create color change particles
        const cx = canvas.width / 2;
        const cy = canvas.height / 2;
        createBloomParticles(cx, cy, 20);
        setTimeout(() => {
          status.textContent = '🌸 Click Bloom to watch the flower open';
        }, 1500);
      }

      // ----- Event Listeners -----
      bloomBtn.addEventListener('click', bloom);
      resetBtn.addEventListener('click', resetFlower);
      toggleBtn.addEventListener('click', togglePause);
      colorBtn.addEventListener('click', changeColor);

      speedSlider.addEventListener('input', (e) => {
        speedValue.textContent = e.target.value + '×';
      });

      petalSlider.addEventListener('input', (e) => {
        petalValue.textContent = e.target.value;
        // Reset flower when petal count changes
        resetFlower();
        setTimeout(() => bloom(), 300);
      });

      sizeSlider.addEventListener('input', (e) => {
        sizeValue.textContent = e.target.value + '%';
      });

      // Keyboard shortcuts
      document.addEventListener('keydown', (e) => {
        if (e.key === 'b' || e.key === 'B') {
          e.preventDefault();
          bloom();
        }
        if (e.key === 'r' || e.key === 'R') {
          e.preventDefault();
          resetFlower();
        }
        if (e.key === ' ' || e.key === 'Space') {
          e.preventDefault();
          togglePause();
        }
        if (e.key === 'c' || e.key === 'C') {
          e.preventDefault();
          changeColor();
        }
      });

      // Click canvas to bloom
      canvas.addEventListener('click', bloom);

      // ----- Resize handler -----
      let resizeTimeout;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(() => {
          setupCanvas();
        }, 200);
      });

      // ----- Init -----
      function init() {
        setupCanvas();
        startAnimation();
        // Start with a bud
        targetBloom = 0.1;
        bloomProgress = 0.1;
        status.textContent = '🌸 Click Bloom to watch the flower open!';
        // Auto-bloom after a moment
        setTimeout(() => {
          bloom();
        }, 800);
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }

    })();
  </script>
</body>
</html>
