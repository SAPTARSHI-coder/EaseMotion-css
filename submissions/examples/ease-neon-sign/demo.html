<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon Sign · flickering neon sign effect</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <div class="neon-container">
      <div class="neon-display" id="neonDisplay">
        <!-- Canvas for neon sign -->
        <canvas id="neonCanvas"></canvas>
        
        <!-- Neon Info -->
        <div class="neon-info">
          <span class="info-label">💡 Brightness</span>
          <span class="info-value" id="brightnessLevel">100%</span>
        </div>

        <!-- Neon Controls -->
        <div class="neon-controls">
          <div class="control-group">
            <label class="control-label">⚡ Flicker</label>
            <input type="range" class="control-slider" id="flickerSlider" min="0" max="100" value="50">
            <span class="control-value" id="flickerValue">50%</span>
          </div>
          <div class="control-group">
            <label class="control-label">🎨 Color</label>
            <div class="color-options">
              <button class="color-btn active" data-color="pink" title="Pink">💗</button>
              <button class="color-btn" data-color="blue" title="Blue">💙</button>
              <button class="color-btn" data-color="green" title="Green">💚</button>
              <button class="color-btn" data-color="red" title="Red">❤️</button>
              <button class="color-btn" data-color="purple" title="Purple">💜</button>
            </div>
          </div>
        </div>

        <!-- Neon Text -->
        <div class="neon-text">
          <span class="text-label">💡 Neon Sign</span>
          <span class="text-message" id="neonMessage">Flickering neon sign</span>
        </div>
      </div>
      
      <div class="neon-status">
        <span id="neonStatus">💡 Neon sign flickering in the night</span>
      </div>
    </div>

    <div class="controls">
      <button class="btn btn-reset" id="resetBtn">⟳ Reset</button>
    </div>
    <div class="footer-note">
      <span>💡 neon sign · 5 colors · flicker control</span>
    </div>
  </div>

  <script>
    (function() {
      "use strict";

      // DOM refs
      const canvas = document.getElementById('neonCanvas');
      const ctx = canvas.getContext('2d');
      const display = document.getElementById('neonDisplay');
      const brightnessLevel = document.getElementById('brightnessLevel');
      const neonStatus = document.getElementById('neonStatus');
      const neonMessage = document.getElementById('neonMessage');
      const resetBtn = document.getElementById('resetBtn');
      const flickerSlider = document.getElementById('flickerSlider');
      const flickerValue = document.getElementById('flickerValue');
      const colorBtns = document.querySelectorAll('.color-btn');

      // State
      let time = 0;
      let animationId = null;
      let currentColor = 'pink';
      let flickerAmount = 0.5;
      let glowParticles = [];

      // Color configurations
      const colorConfigs = {
        pink: { main: '#f472b6', glow: 'rgba(244, 114, 182, 0.4)', bright: '#f9a8d4', dark: '#831843', label: 'Pink' },
        blue: { main: '#60a5fa', glow: 'rgba(96, 165, 250, 0.4)', bright: '#93c5fd', dark: '#1e3a5f', label: 'Blue' },
        green: { main: '#34d399', glow: 'rgba(52, 211, 153, 0.4)', bright: '#6ee7b7', dark: '#065f46', label: 'Green' },
        red: { main: '#f87171', glow: 'rgba(248, 113, 113, 0.4)', bright: '#fca5a5', dark: '#7f1d1d', label: 'Red' },
        purple: { main: '#a78bfa', glow: 'rgba(167, 139, 250, 0.4)', bright: '#c4b5fd', dark: '#4c1d95', label: 'Purple' }
      };

      // Glow particle class
      class GlowParticle {
        constructor() {
          this.reset();
        }

        reset() {
          const w = canvas.width;
          const h = canvas.height;
          this.x = Math.random() * w;
          this.y = Math.random() * h;
          this.size = 1 + Math.random() * 3;
          this.speed = 0.1 + Math.random() * 0.3;
          this.angle = Math.random() * Math.PI * 2;
          this.phase = Math.random() * Math.PI * 2;
          this.life = 0.5 + Math.random() * 0.5;
          this.maxLife = this.life;
          this.color = ['#f472b6', '#60a5fa', '#34d399', '#f87171', '#a78bfa'][Math.floor(Math.random() * 5)];
        }

        update(brightness) {
          this.phase += 0.02;
          this.x += Math.cos(this.angle) * 0.2 * (0.5 + brightness);
          this.y += Math.sin(this.angle) * 0.2 * (0.5 + brightness);
          this.life -= 0.002;
          this.angle += 0.01;
          
          if (this.life <= 0) {
            this.reset();
            this.life = 0.5 + Math.random() * 0.5;
            this.maxLife = this.life;
          }
          
          if (this.x < -10) this.x = canvas.width + 10;
          if (this.x > canvas.width + 10) this.x = -10;
          if (this.y < -10) this.y = canvas.height + 10;
          if (this.y > canvas.height + 10) this.y = -10;
        }

        draw(ctx, color, brightness) {
          const alpha = (this.life / this.maxLife) * (0.1 + brightness * 0.3);
          const size = this.size * (0.3 + brightness * 0.7);
          
          ctx.save();
          ctx.globalAlpha = alpha;
          ctx.fillStyle = color;
          ctx.shadowColor = color;
          ctx.shadowBlur = 10 * brightness;
          ctx.beginPath();
          ctx.arc(this.x, this.y, size, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      }

      // Generate glow particles
      function generateGlowParticles() {
        glowParticles = [];
        for (let i = 0; i < 50; i++) {
          glowParticles.push(new GlowParticle());
        }
      }

      // Draw neon sign
      function drawNeonSign(brightness, color) {
        const w = canvas.width;
        const h = canvas.height;
        const cx = w / 2;
        const cy = h / 2;
        const colorData = colorConfigs[color];
        const mainColor = colorData.main;
        const glowColor = colorData.glow;
        const brightColor = colorData.bright;
        const darkColor = colorData.dark;
        
        // Background
        const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, w * 0.6);
        grad.addColorStop(0, 'rgba(5, 5, 15, 0.5)');
        grad.addColorStop(0.5, 'rgba(10, 10, 20, 0.4)');
        grad.addColorStop(1, 'rgba(0, 0, 5, 0.6)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, w, h);
        
        // Ambient glow
        ctx.save();
        const ambientGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, w * 0.4);
        ambientGrad.addColorStop(0, glowColor + '22');
        ambientGrad.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = ambientGrad;
        ctx.globalAlpha = brightness * 0.3;
        ctx.fillRect(0, 0, w, h);
        ctx.restore();
        
        // Neon sign shapes
        const shapes = [
          // NEON text
          { type: 'text', x: cx, y: cy - 60, text: 'NEON', size: 60 },
          // Decorative lines
          { type: 'line', x1: cx - 120, y1: cy - 10, x2: cx + 120, y2: cy - 10 },
          { type: 'line', x1: cx - 100, y1: cy + 10, x2: cx + 100, y2: cy + 10 },
          // SIGN text
          { type: 'text', x: cx, y: cy + 50, text: 'SIGN', size: 30 },
          // Decorative dots
          { type: 'dot', x: cx - 130, y: cy - 10, r: 4 },
          { type: 'dot', x: cx + 130, y: cy - 10, r: 4 },
          { type: 'dot', x: cx - 110, y: cy + 10, r: 3 },
          { type: 'dot', x: cx + 110, y: cy + 10, r: 3 },
          // Outer frame
          { type: 'rect', x: cx - 140, y: cy - 90, w: 280, h: 170 }
        ];
        
        // Draw each shape with neon effect
        shapes.forEach(shape => {
          ctx.save();
          
          // Flicker effect
          const flicker = 0.7 + Math.random() * 0.3;
          const finalBrightness = brightness * flicker;
          
          if (finalBrightness < 0.05) {
            ctx.restore();
            return;
          }
          
          // Glow layers
          for (let i = 0; i < 3; i++) {
            const glowSize = (i + 1) * 15;
            const glowAlpha = 0.05 + (1 - i * 0.3) * 0.15 * finalBrightness;
            ctx.shadowColor = mainColor;
            ctx.shadowBlur = glowSize * finalBrightness;
            ctx.globalAlpha = glowAlpha;
            
            ctx.beginPath();
            if (shape.type === 'text') {
              ctx.font = `bold ${shape.size}px sans-serif`;
              ctx.textAlign = 'center';
              ctx.textBaseline = 'middle';
              ctx.fillStyle = mainColor;
              ctx.fillText(shape.text, shape.x, shape.y);
            } else if (shape.type === 'line') {
              ctx.moveTo(shape.x1, shape.y1);
              ctx.lineTo(shape.x2, shape.y2);
              ctx.strokeStyle = mainColor;
              ctx.lineWidth = 2 + i * 0.5;
              ctx.stroke();
            } else if (shape.type === 'dot') {
              ctx.arc(shape.x, shape.y, shape.r, 0, Math.PI * 2);
              ctx.fillStyle = mainColor;
              ctx.fill();
            } else if (shape.type === 'rect') {
              ctx.rect(shape.x, shape.y, shape.w, shape.h);
              ctx.strokeStyle = mainColor;
              ctx.lineWidth = 2 + i * 0.5;
              ctx.stroke();
            }
          }
          
          // Main bright layer
          ctx.shadowBlur = 10 * finalBrightness;
          ctx.shadowColor = mainColor;
          ctx.globalAlpha = 0.7 * finalBrightness;
          ctx.fillStyle = brightColor;
          ctx.strokeStyle = brightColor;
          ctx.lineWidth = 2;
          
          if (shape.type === 'text') {
            ctx.font = `bold ${shape.size}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(shape.text, shape.x, shape.y);
          } else if (shape.type === 'line') {
            ctx.beginPath();
            ctx.moveTo(shape.x1, shape.y1);
            ctx.lineTo(shape.x2, shape.y2);
            ctx.stroke();
          } else if (shape.type === 'dot') {
            ctx.beginPath();
            ctx.arc(shape.x, shape.y, shape.r, 0, Math.PI * 2);
            ctx.fill();
          } else if (shape.type === 'rect') {
            ctx.beginPath();
            ctx.rect(shape.x, shape.y, shape.w, shape.h);
            ctx.stroke();
          }
          
          ctx.restore();
        });
        
        // Update brightness display
        const percent = Math.round(brightness * 100);
        brightnessLevel.textContent = percent + '%';
        brightnessLevel.style.color = brightness > 0.3 ? mainColor : '#94a3b8';
        
        // Update status
        if (brightness > 0.8) {
          neonStatus.textContent = '💡 Neon sign blazing bright! ✨';
          neonStatus.style.color = mainColor;
        } else if (brightness > 0.4) {
          neonStatus.textContent = '💡 Neon sign flickering in the night';
          neonStatus.style.color = mainColor;
        } else if (brightness > 0.05) {
          neonStatus.textContent = '💡 Neon sign struggling to light up...';
          neonStatus.style.color = '#818cf8';
        } else {
          neonStatus.textContent = '💡 Neon sign is off';
          neonStatus.style.color = '#94a3b8';
        }
      }

      // Animation loop
      function animate() {
        time += 0.02;
        const flicker = parseInt(flickerSlider.value) / 100;
        const color = currentColor;
        const colorData = colorConfigs[color];
        
        // Calculate brightness with flicker
        const flickerPattern = Math.sin(time * 3) * 0.1 + 
                              Math.sin(time * 7 + 1) * 0.05 +
                              Math.sin(time * 13 + 2) * 0.03;
        const baseBrightness = 0.5 + flicker * 0.5;
        const flickerAmount = 1 - flicker * 0.4;
        const randomFlicker = Math.random() * 0.15 * flicker;
        const brightness = Math.max(0, Math.min(1, baseBrightness + flickerPattern * flickerAmount + randomFlicker));
        
        // Update particles
        glowParticles.forEach(p => {
          p.update(brightness);
        });
        
        // Draw scene
        drawNeonSign(brightness, color);
        
        // Draw glow particles
        glowParticles.forEach(p => {
          p.draw(ctx, colorData.main, brightness);
        });
        
        // Update neon message based on flicker
        if (flicker > 0.7) {
          neonMessage.textContent = '✨ Neon sign flickering wildly!';
          neonMessage.style.color = colorData.main;
        } else if (flicker > 0.3) {
          neonMessage.textContent = '💡 Neon sign with gentle flicker';
          neonMessage.style.color = colorData.main;
        } else {
          neonMessage.textContent = '💡 Steady neon glow';
          neonMessage.style.color = colorData.main;
        }
        
        animationId = requestAnimationFrame(animate);
      }

      // Set color
      function setColor(color) {
        currentColor = color;
        colorBtns.forEach(btn => {
          btn.classList.toggle('active', btn.dataset.color === color);
        });
        const colorData = colorConfigs[color];
        neonStatus.textContent = `🎨 Color: ${colorData.label}`;
        neonStatus.style.color = colorData.main;
        setTimeout(() => {
          neonStatus.textContent = '💡 Neon sign flickering in the night';
          neonStatus.style.color = '#94a3b8';
        }, 1500);
      }

      // Reset
      function resetNeon() {
        flickerSlider.value = 50;
        flickerValue.textContent = '50%';
        neonStatus.textContent = '🔄 Reset complete';
        neonStatus.style.color = '#94a3b8';
        neonMessage.textContent = 'Flickering neon sign';
        neonMessage.style.color = '#94a3b8';
        setTimeout(() => {
          neonStatus.textContent = '💡 Neon sign flickering in the night';
          neonStatus.style.color = '#94a3b8';
        }, 1000);
      }

      // Resize canvas
      function resizeCanvas() {
        const rect = display.getBoundingClientRect();
        canvas.width = rect.width;
        canvas.height = rect.height;
        canvas.style.width = rect.width + 'px';
        canvas.style.height = rect.height + 'px';
        generateGlowParticles();
      }

      // Event listeners
      flickerSlider.addEventListener('input', function() {
        flickerValue.textContent = this.value + '%';
      });

      colorBtns.forEach(btn => {
        btn.addEventListener('click', function() {
          setColor(this.dataset.color);
        });
      });

      if (resetBtn) {
        resetBtn.addEventListener('click', function(e) {
          e.preventDefault();
          resetNeon();
        });
      }

      // Keyboard shortcuts
      document.addEventListener('keydown', function(e) {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

        const key = e.key;
        if (key === 'r' || key === 'R') {
          e.preventDefault();
          resetNeon();
        }
      });

      // Resize
      window.addEventListener('resize', resizeCanvas);

      // Initialize
      resizeCanvas();
      animate();
      
      console.log('💡 Neon Sign ready · shortcuts: [R] Reset');
    })();
  </script>
</body>
</html>
