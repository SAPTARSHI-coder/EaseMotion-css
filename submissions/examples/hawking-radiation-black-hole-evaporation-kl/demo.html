<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hawking Radiation Black Hole Evaporation - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #0c0a09; color: #ffffff;">

    <div class="ease-card ease-card-glass hawking-container">
        <div class="hawking-header">
            <h2>Black Hole Horizon</h2>
            <span class="ease-badge ease-badge-warning">Evaporating</span>
        </div>
        
        <div class="hawking-screen ease-center">
            <div class="thermal-emission-flux flux-1"></div>
            <div class="thermal-emission-flux flux-2"></div>
            <div class="event-horizon-ring"></div>
            <div class="singularity-core ease-center"></div>
        </div>

        <div class="hawking-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Temperature: 65.4 nK</span>
            <button class="ease-btn ease-btn-primary ease-btn-sm ease-hover-grow">Measure Radiation</button>
        </div>
    </div>

</body>
</html>
