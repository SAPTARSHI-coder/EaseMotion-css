<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parallax Glassmorphism Navbar</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Parallax Background Layer -->
    <div class="parallax-bg"></div>

    <!-- Navigation Bar -->
    <nav class="glass-navbar">
        <div class="nav-container">
            <a href="#" class="nav-logo">GLASSO</a>
            
            <div class="nav-links">
                <a href="#" class="nav-link active">Home</a>
                <a href="#" class="nav-link">About</a>
                <a href="#" class="nav-link">Services</a>
                <a href="#" class="nav-link">Portfolio</a>
            </div>

            <a href="#" class="nav-cta">Contact Us</a>

            <!-- Mobile menu button -->
            <button class="mobile-menu-btn">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </nav>

    <!-- Main Content for Scrolling Context -->
    <main class="content">
        <h1>Scroll Down</h1>
        <p>Experience the smooth parallax background effect underneath the frosted glass navigation bar.</p>
        <div class="scroll-indicator">↓</div>
    </main>

    <!-- Extra spacer to allow scrolling -->
    <div style="height: 150vh;"></div>

</body>
</html>
