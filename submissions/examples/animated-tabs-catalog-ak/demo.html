<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Catalog Jello-Hover Tabs | EaseMotion CSS</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="ease-center ease-fade-in" style="min-height: 100vh; background: #f8fafc; font-family: 'Inter', sans-serif; padding: 2rem;">

  <div class="tabs-container">
    <header class="tabs-header ease-slide-up">
      <h1 class="ease-fade-in">Product Catalog Tabs</h1>
      <p class="ease-slide-up ease-delay-100">Pure CSS interactive tabs featuring a smooth jello-hover transition for store layouts.</p>
    </header>

    <!-- Tabs Wrapper -->
    <div class="ease-tabs-catalog-ak ease-slide-up ease-delay-200">
      <div class="tabs-list" role="tablist">
        <button role="tab" aria-selected="true" class="tab-btn active">Electronics</button>
        <button role="tab" aria-selected="false" class="tab-btn">Apparel</button>
        <button role="tab" aria-selected="false" class="tab-btn">Home Decor</button>
      </div>
      <div class="tabs-panels">
        <div role="tabpanel" class="tab-panel active">
          <h3>Featured Electronics</h3>
          <p>Explore high-performance gear with zero JavaScript overhead and expressive micro-interactions.</p>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
