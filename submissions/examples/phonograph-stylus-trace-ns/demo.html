<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phonograph Stylus Trace — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Phonograph Stylus Trace demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Phonograph Stylus Trace</h1>
      <p class="lede">Phonograph stylus tracing a groove under tonearm sway</p>
    </header>

    <section class="ease-phonograph-stylus-trace" data-demo="phonograph-stylus-trace" aria-live="polite">
      <div class="ease-phonograph-stylus-trace__housing">
        <div class="ease-phonograph-stylus-trace__bezel">
          <div class="ease-phonograph-stylus-trace__face">
            <div class="ease-phonograph-stylus-trace__readout">
              <span class="ease-phonograph-stylus-trace__label">Phonograph Stylus Trace</span>
              <span class="ease-phonograph-stylus-trace__value">LIVE</span>
            </div>
            <div class="ease-phonograph-stylus-trace__motion" aria-hidden="true">
              <span class="ease-phonograph-stylus-trace__a"></span>
              <span class="ease-phonograph-stylus-trace__b"></span>
              <span class="ease-phonograph-stylus-trace__c"></span>
              <span class="ease-phonograph-stylus-trace__d"></span>
            </div>
            <div class="ease-phonograph-stylus-trace__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-phonograph-stylus-trace__controls">
          <button type="button" class="ease-phonograph-stylus-trace__btn primary">Engage</button>
          <button type="button" class="ease-phonograph-stylus-trace__btn">Reset</button>
          <label class="ease-phonograph-stylus-trace__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-phonograph-stylus-trace__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
