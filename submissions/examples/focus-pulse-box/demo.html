<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Focus Pulse Box &mdash; EaseMotion CSS Demo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="page-head">
    <p class="kicker">EaseMotion CSS &middot; Productivity</p>
    <h1>Focus Pulse Box</h1>
    <p class="sub">An input that announces its focus with soft waves.</p>
  </header>
  <main class="stage">
    <div class="fp-field">
      <label class="fp-label">Your email</label>
      <input class="fp-input" type="text" placeholder="hello@world.dev" />
    </div>
  </main>
  <p class="stage-caption">Hover, then click the field &mdash; the pulse ring blooms.</p>
  <footer class="page-foot">
    <span>Pure CSS &middot; zero dependencies</span>
    <span>Pulse ring</span>
  </footer>
</body>
</html>
