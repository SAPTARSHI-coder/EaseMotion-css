<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Masonry Photo Grid - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="em-masonry-page">
        <div class="em-card" role="region" aria-label="Masonry Photo Grid Showcase">
            <span class="em-card-badge">PINTEREST STYLE</span>
            <h1 class="em-card-title">Masonry Photo Grid</h1>
            <p class="em-card-desc">Pinterest-style masonry photo layout crafted entirely using pure CSS column layouts and break-inside avoidance.</p>
            
            <!-- Masonry Grid Container -->
            <div class="em-masonry-grid" role="feed" aria-label="Masonry Photo Feed">
                <div class="em-masonry-item" tabindex="0" role="article" aria-label="Mountain Landscape Photo">
                    <div class="em-masonry-img em-h1"></div>
                    <div class="em-masonry-overlay"><span>Alpine Heights</span></div>
                </div>
                <div class="em-masonry-item" tabindex="0" role="article" aria-label="Neon City Lights Photo">
                    <div class="em-masonry-img em-h2"></div>
                    <div class="em-masonry-overlay"><span>Cyberpunk Nights</span></div>
                </div>
                <div class="em-masonry-item" tabindex="0" role="article" aria-label="Abstract Wave Pattern Photo">
                    <div class="em-masonry-img em-h3"></div>
                    <div class="em-masonry-overlay"><span>Fluid Dynamics</span></div>
                </div>
                <div class="em-masonry-item" tabindex="0" role="article" aria-label="Minimalist Architecture Photo">
                    <div class="em-masonry-img em-h4"></div>
                    <div class="em-masonry-overlay"><span>Brutalist Geometry</span></div>
                </div>
                <div class="em-masonry-item" tabindex="0" role="article" aria-label="Serene Forest Canopy Photo">
                    <div class="em-masonry-img em-h5"></div>
                    <div class="em-masonry-overlay"><span>Emerald Canopy</span></div>
                </div>
                <div class="em-masonry-item" tabindex="0" role="article" aria-label="Golden Sunset Beach Photo">
                    <div class="em-masonry-img em-h6"></div>
                    <div class="em-masonry-overlay"><span>Solitude Shore</span></div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
