<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ease-form-validation — CSS :has() Demo</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    /* Page-level reset (demo only) */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f172a;
      font-family: system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    /* Submit button (demo only) */
    .ease-submit-btn {
      padding: 0.75rem 1.5rem;
      background: #3b82f6;
      color: #f8fafc;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    .ease-submit-btn:hover {
      background: #2563eb;
    }
  </style>
</head>
<body>

  <form class="ease-form-wrapper" novalidate>

    <!-- Email Field -->
    <div class="ease-input-group">
      <label for="email">Email Address</label>
      <input
        id="email"
        type="email"
        required
        placeholder="name@company.com"
      />
      <span class="ease-error-msg">Please enter a valid email address.</span>
    </div>

    <!-- Password Field -->
    <div class="ease-input-group">
      <label for="password">Password</label>
      <input
        id="password"
        type="password"
        required
        pattern=".{8,}"
        placeholder="Min. 8 characters"
      />
      <span class="ease-error-msg">Password must be at least 8 characters.</span>
    </div>

    <button type="submit" class="ease-submit-btn">Sign In</button>

  </form>

</body>
</html>
