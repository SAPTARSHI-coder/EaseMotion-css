<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Echo Chamber</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="app">

  <section class="card">

    <header>
      <span>VISUAL AUDIO</span>
      <h1>Echo Chamber</h1>
      <p>Every interaction leaves an echo.</p>
    </header>

    <div class="chamber" id="chamber">
      <div class="center-dot"></div>
      <div id="echoes"></div>

      <div class="instruction">
        Click anywhere to create an echo
      </div>
    </div>

    <div class="controls">
      <button id="clear">Clear Echoes</button>

      <label>
        Strength
        <input id="strength" type="range" min="30" max="100" value="70">
        <span id="strengthValue">70%</span>
      </label>

      <strong id="count">0 echoes</strong>
    </div>

  </section>

</main>

<script>
const chamber = document.getElementById("chamber");
const echoes = document.getElementById("echoes");
const countEl = document.getElementById("count");
const strength = document.getElementById("strength");
const strengthValue = document.getElementById("strengthValue");

let count = 0;

function createEcho(x, y) {
  const rect = chamber.getBoundingClientRect();

  const echo = document.createElement("div");
  echo.className = "echo";

  const localX = x - rect.left;
  const localY = y - rect.top;

  const size = 50 + Number(strength.value) * 2.2;

  echo.style.left = `${localX}px`;
  echo.style.top = `${localY}px`;
  echo.style.width = `${size}px`;
  echo.style.height = `${size}px`;

  echo.style.setProperty(
    "--delay",
    `${Math.random() * .15}s`
  );

  echoes.appendChild(echo);

  count++;
  countEl.textContent = `${count} echoes`;

  setTimeout(() => {
    echo.remove();
  }, 2200);
}

chamber.addEventListener("click", event => {
  createEcho(event.clientX, event.clientY);
});

document.getElementById("clear").addEventListener("click", () => {
  echoes.innerHTML = "";
});

strength.addEventListener("input", () => {
  strengthValue.textContent = `${strength.value}%`;
});

document.addEventListener("keydown", event => {
  if (event.code === "Space") {
    event.preventDefault();

    const rect = chamber.getBoundingClientRect();

    createEcho(
      rect.left + rect.width / 2,
      rect.top + rect.height / 2
    );
  }
});
</script>

</body>
</html>
