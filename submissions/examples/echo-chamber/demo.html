<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Echo Chamber</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="echo-app">
      <header>
        <div>
          <span>🔮 INTERACTIVE FIELD</span>
          <h1>Echo Chamber</h1>
        </div>
        <div class="counter">Echoes <strong id="count">0</strong></div>
      </header>
      <div class="echo-field" id="field" aria-label="Interactive echo field">
        <div class="core"></div>
        <div class="hint">Click anywhere to create an echo</div>
      </div>
      <div class="controls">
        <label>
          Echo Intensity
          <input id="intensity" type="range" min="20" max="100" value="60" />
        </label>
        <button id="clearBtn">Clear Echoes</button>
        <p id="status">The chamber is silent.</p>
      </div>
    </div>
    <script>
      const field = document.getElementById("field");
      const count = document.getElementById("count");
      const intensity = document.getElementById("intensity");
      const clearBtn = document.getElementById("clearBtn");
      const status = document.getElementById("status");
      let echoCount = 0;
      function createEcho(x, y) {
        const rect = field.getBoundingClientRect();
        const echo = document.createElement("div");
        echo.className = "echo";
        const size = 60 + Number(intensity.value) * 1.8;
        echo.style.left = `${x - rect.left}px`;
        echo.style.top = `${y - rect.top}px`;
        echo.style.width = `${size}px`;
        echo.style.height = `${size}px`;
        field.appendChild(echo);
        echoCount++;
        count.textContent = echoCount;
        status.textContent = `${echoCount} echo${echoCount === 1 ? "" : "es"} active.`;
        echo.addEventListener("animationend", () => {
          echo.remove();
          if (!field.querySelector(".echo")) {
            status.textContent = "The chamber is silent.";
          }
        });
      }
      field.addEventListener("click", (event) => {
        createEcho(event.clientX, event.clientY);
      });
      clearBtn.addEventListener("click", () => {
        field.querySelectorAll(".echo").forEach((echo) => echo.remove());
        echoCount = 0;
        count.textContent = "0";
        status.textContent = "The chamber is silent.";
      });
      document.addEventListener("keydown", (event) => {
        if (event.code === "Space") {
          event.preventDefault();
          const rect = field.getBoundingClientRect();
          createEcho(rect.left + rect.width / 2, rect.top + rect.height / 2);
        }
        if (event.key.toLowerCase() === "r") {
          clearBtn.click();
        }
      });
    </script>
  </body>
</html>
