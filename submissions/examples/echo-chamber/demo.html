<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Interactive soundless Echo Chamber visualizer.">
  <title>Echo Chamber</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="page">
    <section class="card">
      <header class="header">
        <div>
          <p class="eyebrow">Interactive Visualizer</p>
          <h1>Echo Chamber</h1>
        </div>

        <div class="counter" aria-live="polite">
          <span>Echoes</span>
          <strong id="echoCount">0</strong>
        </div>
      </header>

      <p class="description">
        Click inside the chamber to create visual echoes.
        Each ripple expands, reflects, and gradually disappears.
      </p>

      <div
        class="chamber"
        id="chamber"
        tabindex="0"
        role="application"
        aria-label="Interactive echo chamber. Click or press Space to create an echo."
      >
        <svg
          id="echoSvg"
          class="echo-svg"
          viewBox="0 0 600 420"
          preserveAspectRatio="none"
          aria-hidden="true"
        >
          <defs>
            <filter id="glow">
              <feGaussianBlur stdDeviation="3" result="blur"></feGaussianBlur>
              <feMerge>
                <feMergeNode in="blur"></feMergeNode>
                <feMergeNode in="SourceGraphic"></feMergeNode>
              </feMerge>
            </filter>
          </defs>
        </svg>

        <div class="hint" id="hint">
          <span class="hint-icon" aria-hidden="true">✦</span>
          <span>Click to create an echo</span>
        </div>
      </div>

      <div class="controls">
        <label class="strength-control" for="strength">
          <span>Echo strength</span>

          <input
            id="strength"
            type="range"
            min="0.5"
            max="2"
            step="0.1"
            value="1"
          >

          <output id="strengthValue" for="strength">1.0×</output>
        </label>

        <button id="clearButton" class="clear-button" type="button">
          Clear Echoes
        </button>
      </div>
    </section>
  </main>

  <script>
    const chamber = document.getElementById("chamber");
    const svg = document.getElementById("echoSvg");
    const echoCount = document.getElementById("echoCount");
    const strength = document.getElementById("strength");
    const strengthValue = document.getElementById("strengthValue");
    const clearButton = document.getElementById("clearButton");
    const hint = document.getElementById("hint");

    const SVG_WIDTH = 600;
    const SVG_HEIGHT = 420;

    let echoes = [];

    function getPoint(event) {
      const rect = chamber.getBoundingClientRect();

      return {
        x: ((event.clientX - rect.left) / rect.width) * SVG_WIDTH,
        y: ((event.clientY - rect.top) / rect.height) * SVG_HEIGHT
      };
    }

    function createEcho(x, y) {
      const group = document.createElementNS(
        "http://www.w3.org/2000/svg",
        "g"
      );

      group.setAttribute("filter", "url(#glow)");

      const ring = document.createElementNS(
        "http://www.w3.org/2000/svg",
        "ellipse"
      );

      const glow = document.createElementNS(
        "http://www.w3.org/2000/svg",
        "ellipse"
      );

      ring.setAttribute("cx", x);
      ring.setAttribute("cy", y);
      ring.setAttribute("rx", 2);
      ring.setAttribute("ry", 1.4);
      ring.classList.add("echo-ring");

      glow.setAttribute("cx", x);
      glow.setAttribute("cy", y);
      glow.setAttribute("rx", 2);
      glow.setAttribute("ry", 1.4);
      glow.classList.add("echo-glow");

      group.append(glow, ring);
      svg.appendChild(group);

      echoes.push({
        element: group,
        radius: 2,
        opacity: 1,
        speed: 0.8 * Number(strength.value),
        maxRadius: 340,
        reflected: false
      });

      hint.classList.add("hidden");
      updateCounter();
    }

    function createReflection(echo) {
      if (echo.reflected) {
        return;
      }

      echo.reflected = true;

      const reflection = document.createElementNS(
        "http://www.w3.org/2000/svg",
        "ellipse"
      );

      reflection.setAttribute("cx", 300);
      reflection.setAttribute("cy", 210);
      reflection.setAttribute("rx", echo.radius * 0.65);
      reflection.setAttribute("ry", echo.radius * 0.45);
      reflection.classList.add("reflection-ring");

      echo.element.appendChild(reflection);
    }

    function animate() {
      echoes = echoes.filter((echo) => {
        echo.radius += echo.speed;
        echo.opacity -= 0.0045;

        if (echo.radius >= echo.maxRadius * 0.65) {
          createReflection(echo);
        }

        const ring = echo.element.querySelector(".echo-ring");
        const glow = echo.element.querySelector(".echo-glow");
        const reflection = echo.element.querySelector(".reflection-ring");

        ring.setAttribute("rx", echo.radius);
        ring.setAttribute("ry", echo.radius * 0.7);
        ring.style.opacity = Math.max(echo.opacity, 0);

        glow.setAttribute("rx", echo.radius * 1.04);
        glow.setAttribute("ry", echo.radius * 0.72);
        glow.style.opacity = Math.max(echo.opacity * 0.3, 0);

        if (reflection) {
          const reflectionRadius =
            Math.max(echo.radius * 0.65 - (echo.radius - echo.maxRadius * 0.65), 0);

          reflection.setAttribute("rx", reflectionRadius);
          reflection.setAttribute("ry", reflectionRadius * 0.7);
          reflection.style.opacity =
            Math.max((1 - echo.radius / echo.maxRadius) * 0.6, 0);
        }

        if (echo.opacity <= 0) {
          echo.element.remove();
          return false;
        }

        return true;
      });

      updateCounter();
      requestAnimationFrame(animate);
    }

    function updateCounter() {
      echoCount.textContent = echoes.length;
    }

    function clearEchoes() {
      echoes.forEach((echo) => echo.element.remove());
      echoes = [];
      updateCounter();
    }

    chamber.addEventListener("pointerdown", (event) => {
      if (event.pointerType === "mouse" && event.button !== 0) {
        return;
      }

      const point = getPoint(event);
      createEcho(point.x, point.y);
    });

    chamber.addEventListener("keydown", (event) => {
      if (event.code !== "Space") {
        return;
      }

      event.preventDefault();
      createEcho(SVG_WIDTH / 2, SVG_HEIGHT / 2);
    });

    strength.addEventListener("input", () => {
      strengthValue.textContent =
        `${Number(strength.value).toFixed(1)}×`;
    });

    clearButton.addEventListener("click", clearEchoes);

    animate();
  </script>
</body>
</html>
