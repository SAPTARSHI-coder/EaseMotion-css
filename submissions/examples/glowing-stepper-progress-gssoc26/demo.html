<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glowing Stepper Progress - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="stepper-container">
    <header class="stepper-header">
      <h2>Glowing Stepper Workflow Progress</h2>
      <p>Animated neon pulse step nodes with active progress line filling.</p>
    </header>

    <div class="stepper-wrapper">
      <div class="progress-track">
        <div class="progress-line-fill"></div>
      </div>

      <div class="stepper-step completed">
        <div class="step-node"><span class="check">✓</span></div>
        <span class="step-label">Account Info</span>
      </div>

      <div class="stepper-step active">
        <div class="step-node"><span class="pulse"></span>2</div>
        <span class="step-label">Verification</span>
      </div>

      <div class="stepper-step">
        <div class="step-node">3</div>
        <span class="step-label">Preferences</span>
      </div>

      <div class="stepper-step">
        <div class="step-node">4</div>
        <span class="step-label">Launch</span>
      </div>
    </div>
  </div>
</body>
</html>
