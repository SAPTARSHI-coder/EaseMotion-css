<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Coupon Code Field</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="layout-container">
        
        <header class="section-header">
            <h1 class="title">Coupon Code Field</h1>
            <p class="subtitle">A pure CSS interactive coupon input featuring an animated scissors cutting effect and a validated success state using the CSS <code>:valid</code> pseudo-class.</p>
        </header>

        <div class="demo-area">
            
            <div class="coupon-card">
                
                <div class="card-header">
                    <h2>Have a promo code?</h2>
                    <p>Enter it below to redeem your discount.</p>
                </div>
                
                <!-- 
                  [TECHNIQUE] CSS Validation State
                  We use pattern="SUMMER2026" and required to let HTML5 handle validation.
                  CSS :valid pseudo-class then triggers the success styling automatically.
                -->
                <form class="coupon-form" onsubmit="event.preventDefault();">
                    
                    <div class="input-wrapper">
                        
                        <!-- 
                          The Scissors Icon 
                          Animates (snips) when the input is focused.
                        -->
                        <div class="icon-scissors">
                            <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none">
                                <circle cx="6" cy="6" r="3"></circle>
                                <circle cx="6" cy="18" r="3"></circle>
                                <line class="scissor-blade top-blade" x1="20" y1="4" x2="8.12" y2="15.88"></line>
                                <line class="scissor-blade bottom-blade" x1="14.47" y1="14.48" x2="20" y2="20"></line>
                                <line x1="8.12" y1="8.12" x2="12" y2="12"></line>
                            </svg>
                        </div>
                        
                        <input 
                            type="text" 
                            id="coupon-input" 
                            class="coupon-input" 
                            placeholder="e.g. SUMMER2026" 
                            pattern="SUMMER2026" 
                            required 
                            aria-label="Coupon Code"
                        >
                        
                        <button type="submit" class="btn-apply">Apply</button>
                        
                    </div>
                    
                    <!-- 
                      Success / Helper text 
                      Shown/Hidden based on the :valid state of the input.
                    -->
                    <div class="feedback-msg">
                        <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
                        <span>Code applied! 20% off your order.</span>
                    </div>
                    <div class="hint-msg">
                        <span>Psst... try "SUMMER2026"</span>
                    </div>
                    
                </form>
                
            </div>
            
        </div>
        
    </div>

</body>
</html>
