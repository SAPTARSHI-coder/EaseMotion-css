<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dash Trail · speed trail effect</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <div class="dash-container">
      <div class="dash-area" id="dashArea">
        <!-- Dash Trail Container -->
        <div class="trail-container" id="trailContainer"></div>
        
        <!-- Dash Character -->
        <div class="dash-character" id="dashCharacter">
          <div class="character-body">⚡</div>
        </div>
        
        <!-- Dash Trail Elements -->
        <div class="trail-trails" id="trailTrails"></div>
      </div>
      
      <div class="dash-status">
        <span id="dashStatus">💨 Press space or click to dash</span>
      </div>
    </div>

    <div class="controls">
      <button class="btn btn-dash" id="dashBtn">💨 Dash!</button>
      <button class="btn btn-direction" id="directionBtn">🔄 Change Direction</button>
      <button class="btn btn-reset" id="resetBtn">⟳ Reset Trail</button>
    </div>
    <div class="footer-note">
      <span>⬆️ dash leaves trail · trail fades over time · press Space to dash</span>
    </div>
  </div>

  <script>
    (function() {
      "use strict";

      // DOM refs
      const dashArea = document.getElementById('dashArea');
      const dashCharacter = document.getElementById('dashCharacter');
      const trailContainer = document.getElementById('trailContainer');
      const trailTrails = document.getElementById('trailTrails');
      const dashStatus = document.getElementById('dashStatus');
      const dashBtn = document.getElementById('dashBtn');
      const directionBtn = document.getElementById('directionBtn');
      const resetBtn = document.getElementById('resetBtn');

      // State
      let isDashing = false;
      let direction = 'right'; // right, left, up, down
      let position = { x: 50, y: 50 };
      const trailTrailsArray = [];
      let trailCounter = 0;

      // Update character position
      function updateCharacter() {
        dashCharacter.style.left = position.x + '%';
        dashCharacter.style.top = position.y + '%';
        
        // Rotate character based on direction
        let rotation = 0;
        switch(direction) {
          case 'right': rotation = 0; break;
          case 'left': rotation = 180; break;
          case 'up': rotation = -90; break;
          case 'down': rotation = 90; break;
        }
        dashCharacter.style.transform = `translate(-50%, -50%) rotate(${rotation}deg)`;
      }

      // Create a trail element
      function createTrail(x, y, dir) {
        const trail = document.createElement('div');
        trail.className = 'trail-piece';
        
        // Random size and opacity variation
        const size = Math.random() * 12 + 6;
        trail.style.width = size + 'px';
        trail.style.height = size + 'px';
        trail.style.left = x + '%';
        trail.style.top = y + '%';
        trail.style.transform = 'translate(-50%, -50%)';
        
        // Random color variation (blue/cyan/purple speed trail)
        const colors = [
          'rgba(99, 102, 241, 0.6)',
          'rgba(139, 92, 246, 0.5)',
          'rgba(96, 165, 250, 0.5)',
          'rgba(167, 139, 250, 0.4)',
          'rgba(56, 189, 248, 0.6)'
        ];
        trail.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        
        // Random shape
        if (Math.random() > 0.5) {
          trail.style.clipPath = 'polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%)';
        } else {
          trail.style.borderRadius = '50%';
        }
        
        // Random animation duration
        trail.style.animationDuration = (Math.random() * 0.5 + 0.6) + 's';
        trail.style.animationDelay = (Math.random() * 0.2) + 's';
        
        trailTrails.appendChild(trail);
        
        // Remove trail after animation
        setTimeout(() => {
          trail.remove();
        }, 1500);
        
        return trail;
      }

      // Create dash trail effect
      function createDashTrail() {
        const steps = 20;
        let currentStep = 0;
        const startX = position.x;
        const startY = position.y;
        let stepX = 0, stepY = 0;
        
        // Calculate step movement based on direction
        const distance = 30; // Percentage to move
        switch(direction) {
          case 'right': stepX = distance / steps; break;
          case 'left': stepX = -distance / steps; break;
          case 'up': stepY = -distance / steps; break;
          case 'down': stepY = distance / steps; break;
        }
        
        // Disable dashing during animation
        isDashing = true;
        dashStatus.textContent = '💨 Dashing!';
        dashCharacter.classList.add('dashing');
        
        // Create trail at intervals
        const interval = setInterval(() => {
          if (currentStep >= steps) {
            clearInterval(interval);
            isDashing = false;
            dashCharacter.classList.remove('dashing');
            dashStatus.textContent = '⚡ Ready to dash!';
            return;
          }
          
          // Move character
          position.x += stepX;
          position.y += stepY;
          
          // Clamp position
          position.x = Math.max(5, Math.min(95, position.x));
          position.y = Math.max(5, Math.min(95, position.y));
          
          // Create trail at current position
          createTrail(position.x, position.y, direction);
          
          // Update character position
          updateCharacter();
          
          currentStep++;
        }, 50);
      }

      // Perform dash
      function dash() {
        if (isDashing) return;
        createDashTrail();
      }

      // Change direction
      function changeDirection() {
        const directions = ['right', 'down', 'left', 'up'];
        const currentIndex = directions.indexOf(direction);
        direction = directions[(currentIndex + 1) % directions.length];
        
        // Update direction label
        const directionNames = {
          'right': '→ Right',
          'left': '← Left',
          'up': '↑ Up',
          'down': '↓ Down'
        };
        dashStatus.textContent = `🎯 Direction: ${directionNames[direction]}`;
        updateCharacter();
      }

      // Reset trail
      function resetTrail() {
        trailTrails.innerHTML = '';
        position = { x: 50, y: 50 };
        direction = 'right';
        updateCharacter();
        dashStatus.textContent = '🧹 Trail cleared!';
        setTimeout(() => {
          dashStatus.textContent = '💨 Press space or click to dash';
        }, 1000);
      }

      // Event listeners
      if (dashBtn) {
        dashBtn.addEventListener('click', function(e) {
          e.preventDefault();
          dash();
        });
      }

      if (directionBtn) {
        directionBtn.addEventListener('click', function(e) {
          e.preventDefault();
          changeDirection();
        });
      }

      if (resetBtn) {
        resetBtn.addEventListener('click', function(e) {
          e.preventDefault();
          resetTrail();
        });
      }

      // Keyboard shortcuts
      document.addEventListener('keydown', function(e) {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

        const key = e.key;
        if (key === ' ' || key === 'Space') {
          e.preventDefault();
          dash();
        } else if (key === 'd' || key === 'D') {
          e.preventDefault();
          changeDirection();
        } else if (key === 'r' || key === 'R') {
          e.preventDefault();
          resetTrail();
        }
      });

      // Click on dash area to dash
      dashArea.addEventListener('click', function(e) {
        if (e.target === dashArea || e.target === trailContainer || e.target === trailTrails) {
          dash();
        }
      });

      // Initial setup
      updateCharacter();
      dashStatus.textContent = '💨 Press space or click to dash';
      console.log('💨 Dash Trail ready · shortcuts: [Space] Dash, [D] Direction, [R] Reset');
    })();
  </script>
</body>
</html>
