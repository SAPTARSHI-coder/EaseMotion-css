<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fluid Audio Equalizer Visualizer - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="eq-container">
    <header class="eq-header">
      <span class="badge">GSSoC 2026 Component</span>
      <h1>Fluid Neon Audio Equalizer</h1>
      <p>Pure CSS kinetic frequency bars with multi-layer neon glow reflections and rhythmic animation keyframes.</p>
    </header>

    <div class="eq-card" tabindex="0">
      <div class="track-info">
        <div class="track-cover">
          <div class="disc-spin"></div>
        </div>
        <div class="track-details">
          <span class="track-title">Cybernetic Synthwave</span>
          <span class="track-artist">Neon Horizon • 128 BPM</span>
        </div>
      </div>

      <div class="equalizer-bars">
        <div class="bar bar-1"></div>
        <div class="bar bar-2"></div>
        <div class="bar bar-3"></div>
        <div class="bar bar-4"></div>
        <div class="bar bar-5"></div>
        <div class="bar bar-6"></div>
        <div class="bar bar-7"></div>
        <div class="bar bar-8"></div>
        <div class="bar bar-9"></div>
        <div class="bar bar-10"></div>
      </div>

      <div class="eq-controls">
        <button class="ctrl-btn" aria-label="Previous Track">⏮</button>
        <button class="ctrl-btn play-btn" aria-label="Pause Audio">⏸</button>
        <button class="ctrl-btn" aria-label="Next Track">⏭</button>
      </div>
    </div>
  </div>
</body>
</html>
