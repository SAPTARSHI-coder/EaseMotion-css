<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fault Tolerant Transversal Gates FTTG - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css"></head><body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030712; color: #ffffff;">

    <div class="ease-card ease-card-glass fttg-container">
        <div class="fttg-header">
            <h2>Transversal Gates</h2>
            <span class="ease-badge ease-badge-warning">Fault-Tolerant Quantum</span>
        </div>
        
        <div class="fttg-screen ease-center">
            <div class="fttg-flux flux-fttg-a"></div>
            <div class="fttg-flux flux-fttg-b"></div>
            <div class="fttg-boundary-ring"></div>
            <div class="fttg-core ease-center"></div>
        </div>

        <div class="fttg-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Bit-Wise Operations &amp; Error Propagation Control</span>
            <button class="ease-btn ease-btn-warning ease-btn-sm ease-hover-grow">Run Transversal Gates</button>
        </div>
    </div></body></html>
