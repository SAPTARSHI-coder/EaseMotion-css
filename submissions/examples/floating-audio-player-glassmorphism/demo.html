<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Floating glassmorphism audio player widget">
    <title>Floating Audio Player · Glassmorphism</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="page">
        <section class="hero" aria-labelledby="player-title">
            <span class="eyebrow">EASEMOTION · AUDIO</span>

            <h1 id="player-title">Floating Audio Player</h1>

            <p class="intro">
                A responsive glassmorphism audio-player interface built with
                semantic HTML and CSS.
            </p>

            <div class="visualizer" aria-hidden="true">
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
            </div>
        </section>

        <aside class="audio-player" aria-label="Audio player">
            <div class="track-info">
                <div class="album-art" aria-hidden="true">
                    <span>FM</span>
                </div>

                <div class="track-copy">
                    <p class="track-label">NOW PLAYING</p>
                    <h2>Midnight Signals</h2>
                    <p class="artist">EaseMotion Sessions</p>
                </div>
            </div>

            <div class="player-controls">
                <button class="control-button" type="button" aria-label="Previous track">
                    <span aria-hidden="true">|&lt;</span>
                </button>

                <button class="play-button" type="button" aria-label="Play Midnight Signals">
                    <span aria-hidden="true">▶</span>
                </button>

                <button class="control-button" type="button" aria-label="Next track">
                    <span aria-hidden="true">&gt;|</span>
                </button>
            </div>

            <div class="progress-area">
                <span>1:24</span>
                <div class="progress-track" role="progressbar" aria-label="Audio progress" aria-valuemin="0"
                    aria-valuemax="100" aria-valuenow="42">
                    <span class="progress-value"></span>
                </div>
                <span>3:18</span>
            </div>

            <div class="player-footer">
                <span class="status">
                    <span class="status-dot" aria-hidden="true"></span>
                    READY
                </span>

                <div class="volume" aria-label="Volume">
                    <span aria-hidden="true">VOL</span>
                    <span class="volume-track" aria-hidden="true">
                        <span></span>
                    </span>
                </div>
            </div>
        </aside>
    </main>
</body>

</html>
