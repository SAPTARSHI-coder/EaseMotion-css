<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atomic Clock Optical Transitions - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css"></head><body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030712; color: #ffffff;">

    <div class="ease-card ease-card-glass clock-container">
        <div class="clock-header">
            <h2>Optical Atomic Clock</h2>
            <span class="ease-badge ease-badge-primary">Stabilizing</span>
        </div>
        
        <div class="clock-screen ease-center">
            <div class="clock-flux flux-clock-a"></div>
            <div class="clock-flux flux-clock-b"></div>
            <div class="clock-boundary-ring"></div>
            <div class="clock-core ease-center"></div>
        </div>

        <div class="clock-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Clock Transitions &amp; Ultra-Stable Lasers</span>
            <button class="ease-btn ease-btn-primary ease-btn-sm ease-hover-grow">Run Atomic Clock</button>
        </div>
    </div></body></html>
