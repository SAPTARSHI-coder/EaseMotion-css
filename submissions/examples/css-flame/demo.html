```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Flame Progress Bar</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <section class="intro">
            <span class="eyebrow">SYSTEM PROGRESS</span>

            <h1>Fuel the Progress.</h1>

            <p>
                A glowing flame-inspired progress indicator built entirely
                with HTML and CSS.
            </p>
        </section>

        <section class="progress-card">

            <div class="progress-header">
                <div>
                    <span class="label">CURRENT PROGRESS</span>
                    <h2>Development</h2>
                </div>

                <strong class="percentage">78%</strong>
            </div>

            <div class="progress-area">

                <div class="track">
                    <div class="progress-fill">
                        <div class="flame">

                            <span class="flame-core"></span>
                            <span class="flame-inner"></span>
                            <span class="flame-outer"></span>

                        </div>
                    </div>
                </div>

            </div>

            <div class="progress-footer">
                <span>START</span>
                <span>78 / 100</span>
                <span>COMPLETE</span>
            </div>

        </section>

        <section class="stats">

            <div class="stat">
                <span>STATUS</span>
                <strong>ACTIVE</strong>
            </div>

            <div class="stat">
                <span>REMAINING</span>
                <strong>22%</strong>
            </div>

            <div class="stat">
                <span>PHASE</span>
                <strong>BUILD</strong>
            </div>

        </section>

    </main>

</body>

</html>
```
