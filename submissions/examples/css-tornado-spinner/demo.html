<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Pure CSS tornado spinner loading animation"
  >
  <title>CSS Tornado Spinner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">
    <section
      class="spinner-card"
      aria-labelledby="spinner-title"
    >
      <h1 id="spinner-title">Tornado Spinner</h1>

      <div
        class="tornado-spinner"
        role="status"
        aria-label="Loading"
      >
        <span class="tornado-ring ring-1"></span>
        <span class="tornado-ring ring-2"></span>
        <span class="tornado-ring ring-3"></span>
        <span class="tornado-ring ring-4"></span>
        <span class="tornado-ring ring-5"></span>
        <span class="tornado-ring ring-6"></span>
      </div>

      <p class="loading-text">Loading...</p>
    </section>
  </main>

</body>
</html>
