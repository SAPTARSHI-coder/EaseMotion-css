<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retro Pixel Toggle Switch - Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="demo-container">
    <h1>Retro Pixel Toggle Switch</h1>

    <!-- Standard Toggle -->
    <section class="demo-section">
      <h2>1. Standard Toggle Switch</h2>
      <label class="pixel-toggle" for="toggle-basic">
        <input type="checkbox" id="toggle-basic" class="pixel-toggle__input">
        <span class="pixel-toggle__track" aria-hidden="true">
          <span class="pixel-toggle__thumb"></span>
        </span>
        <span class="pixel-toggle__label">Sound FX</span>
      </label>
    </section>

    <!-- Size Modifiers -->
    <section class="demo-section">
      <h2>2. Size Modifiers</h2>
      
      <label class="pixel-toggle pixel-toggle--sm" for="toggle-sm">
        <input type="checkbox" id="toggle-sm" class="pixel-toggle__input">
        <span class="pixel-toggle__track" aria-hidden="true">
          <span class="pixel-toggle__thumb"></span>
        </span>
        <span class="pixel-toggle__label">Small Toggle</span>
      </label>

      <label class="pixel-toggle pixel-toggle--lg" for="toggle-lg">
        <input type="checkbox" id="toggle-lg" class="pixel-toggle__input" checked>
        <span class="pixel-toggle__track" aria-hidden="true">
          <span class="pixel-toggle__thumb"></span>
        </span>
        <span class="pixel-toggle__label">Large Toggle</span>
      </label>
    </section>

    <!-- Theme Overrides -->
    <section class="demo-section">
      <h2>3. Custom CSS Overrides</h2>
      <label class="pixel-toggle pixel-toggle--custom" for="toggle-custom">
        <input type="checkbox" id="toggle-custom" class="pixel-toggle__input" checked>
        <span class="pixel-toggle__track" aria-hidden="true">
          <span class="pixel-toggle__thumb"></span>
        </span>
        <span class="pixel-toggle__label">Neon Arcade Theme</span>
      </label>
    </section>

    <!-- Disabled State -->
    <section class="demo-section">
      <h2>4. Disabled State</h2>
      <label class="pixel-toggle" for="toggle-disabled">
        <input type="checkbox" id="toggle-disabled" class="pixel-toggle__input" disabled>
        <span class="pixel-toggle__track" aria-hidden="true">
          <span class="pixel-toggle__thumb"></span>
        </span>
        <span class="pixel-toggle__label">Locked Feature</span>
      </label>
    </section>
  </main>

</body>
</html>
