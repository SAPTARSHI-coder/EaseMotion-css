<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Electric Shock Text - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="em-shock-page">
        <div class="em-card" role="region" aria-label="Electric Shock Text Showcase" tabindex="0">
            <span class="em-card-badge">HOVER EFFECTS</span>
            <h1 class="em-card-title">Electric Shock Text</h1>
            <p class="em-card-desc">Interactive typography featuring high-voltage electrical lightning glow and crackling text effects on hover using pure CSS.</p>
            
            <!-- Shock Text Container -->
            <div class="em-shock-container" aria-label="Interactive electric shock text">
                <span class="em-shock-text" data-text="HIGH VOLTAGE">HIGH VOLTAGE</span>
            </div>

            <a href="#" class="em-card-btn" role="button">Discharge Power</a>
        </div>
    </div>
</body>
</html>
