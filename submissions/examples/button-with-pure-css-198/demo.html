<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Vibrant gradient ripple wave button created with pure CSS."
  >

  <title>Ripple Wave Button</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="page">

    <section class="demo" aria-labelledby="title">

      <p class="eyebrow">EASEMOTION • MICRO ANIMATION</p>

      <h1 id="title">
        Ripple Wave
        <span>Button</span>
      </h1>

      <p class="description">
        A vibrant gradient button with expanding ripple waves
        and interactive hover feedback.
      </p>

      <div class="button-stage">

        <button class="ripple-button" type="button">
          <span class="button-text">Explore Now</span>
          <span class="button-icon" aria-hidden="true">↗</span>
        </button>

      </div>

      <p class="hint">
        Hover or focus the button
      </p>

    </section>

  </main>

</body>
</html>
