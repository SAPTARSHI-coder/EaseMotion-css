<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS-Only Star Rating Widget</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f3f4f6;
            margin: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }
    </style>
</head>
<body>
    <div class="rating-container" role="radiogroup" aria-label="Star Rating">
        <!-- 5 Stars, ordered in reverse for the ~ sibling selector magic -->
        <input type="radio" name="rating" id="star5" value="5">
        <label for="star5" aria-label="5 stars" title="5 stars">
            <svg class="star" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/>
            </svg>
        </label>
        
        <input type="radio" name="rating" id="star4" value="4">
        <label for="star4" aria-label="4 stars" title="4 stars">
            <svg class="star" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/>
            </svg>
        </label>
        
        <input type="radio" name="rating" id="star3" value="3">
        <label for="star3" aria-label="3 stars" title="3 stars">
            <svg class="star" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/>
            </svg>
        </label>
        
        <input type="radio" name="rating" id="star2" value="2">
        <label for="star2" aria-label="2 stars" title="2 stars">
            <svg class="star" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/>
            </svg>
        </label>
        
        <input type="radio" name="rating" id="star1" value="1">
        <label for="star1" aria-label="1 star" title="1 star">
            <svg class="star" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/>
            </svg>
        </label>
    </div>
</body>
</html>
