<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-security-camera-feed</title>
</head>
<body>
<main class="scf-card">
  <header class="scf-head">
    <h1 class="scf-title">Cam 4</h1>
    <span class="scf-rec">REC</span>
  </header>
  <section class="scf-screen" aria-label="camera feed">
    <span class="scf-corner scf-corner-tl"></span>
    <span class="scf-corner scf-corner-tr"></span>
    <span class="scf-corner scf-corner-bl"></span>
    <span class="scf-corner scf-corner-br"></span>
    <span class="scf-sweep"></span>
    <span class="scf-cam-label">Lobby</span>
    <span class="scf-time">14:32:08</span>
    <span class="scf-person"></span>
  </section>
  <footer class="scf-foot">
    <span class="scf-ch">CH 04</span>
    <span class="scf-status">Motion detected</span>
  </footer>
</main>
</body>
</html>
