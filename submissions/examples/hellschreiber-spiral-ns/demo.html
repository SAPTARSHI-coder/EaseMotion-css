<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hellschreiber Spiral — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Hellschreiber Spiral demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Hellschreiber Spiral</h1>
      <p class="lede">Hellschreiber spiral printing a column of dots</p>
    </header>

    <section class="ease-hellschreiber-spiral" data-demo="hellschreiber-spiral" aria-live="polite">
      <div class="ease-hellschreiber-spiral__housing">
        <div class="ease-hellschreiber-spiral__bezel">
          <div class="ease-hellschreiber-spiral__face">
            <div class="ease-hellschreiber-spiral__readout">
              <span class="ease-hellschreiber-spiral__label">Hellschreiber Spiral</span>
              <span class="ease-hellschreiber-spiral__value">LIVE</span>
            </div>
            <div class="ease-hellschreiber-spiral__motion" aria-hidden="true">
              <span class="ease-hellschreiber-spiral__a"></span>
              <span class="ease-hellschreiber-spiral__b"></span>
              <span class="ease-hellschreiber-spiral__c"></span>
              <span class="ease-hellschreiber-spiral__d"></span>
            </div>
            <div class="ease-hellschreiber-spiral__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-hellschreiber-spiral__controls">
          <button type="button" class="ease-hellschreiber-spiral__btn primary">Print</button>
          <button type="button" class="ease-hellschreiber-spiral__btn">Idle</button>
          <label class="ease-hellschreiber-spiral__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-hellschreiber-spiral__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
