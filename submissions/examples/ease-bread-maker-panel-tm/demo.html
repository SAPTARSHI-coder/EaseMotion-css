<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bread Maker Panel | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bmstage">
    <div class="bmunit">
      <div class="bmhead">
        <span class="bmbrand">BakeryPro</span>
        <span class="bmmodel">XL-500</span>
      </div>
      <div class="bmmenu">
        <div class="bmmode">Basic</div>
        <div class="bmmode active">Whole Wheat</div>
        <div class="bmmode">French</div>
        <div class="bmmode">Sweet</div>
        <div class="bmmode">Gluten Free</div>
        <div class="bmmode">Rapid</div>
      </div>
      <div class="bmtimer">
        <span class="bmtimer-num">2:45</span>
        <span class="bmtimer-label">Hours Remaining</span>
      </div>
      <div class="bmbar">
        <div class="bmbar-fill"></div>
      </div>
      <div class="bmbar-label">
        <span>Kneading</span>
        <span>45% Complete</span>
      </div>
    </div>
  </div>
</body>
</html>
