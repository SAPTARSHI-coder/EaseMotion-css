<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Fade-In Badge</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<section class="badge-section">

<h1>Gaming Achievement Badges</h1>

<div class="badge-grid">

<div class="badge">
<span class="icon">🏆</span>
<h3>Champion</h3>
<p>Win 100 ranked matches.</p>
</div>

<div class="badge">
<span class="icon">⚔️</span>
<h3>Warrior</h3>
<p>Complete every combat mission.</p>
</div>

<div class="badge">
<span class="icon">🎯</span>
<h3>Sharpshooter</h3>
<p>Achieve perfect accuracy.</p>
</div>

<div class="badge">
<span class="icon">👑</span>
<h3>Legend</h3>
<p>Reach the highest league.</p>
</div>

</div>

</section>

</body>
</html>
