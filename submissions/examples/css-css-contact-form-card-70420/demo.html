<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Contact Form Card - EaseMotion</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <form class="cfc" aria-label="Contact form card" onsubmit="return false;">
      <h2 class="cfc-h">Contact Us</h2>
      <label class="cfc-field"
        >Name<input type="text" class="cfc-input" placeholder="Jane Doe"
      /></label>
      <label class="cfc-field"
        >Email<input
          type="email"
          class="cfc-input"
          placeholder="jane@example.com"
      /></label>
      <label class="cfc-field"
        >Message<textarea
          class="cfc-input cfc-area"
          placeholder="How can we help?"
        ></textarea>
      </label>
      <button type="submit" class="cfc-btn">Send Message</button>
    </form>
  </body>
</html>
