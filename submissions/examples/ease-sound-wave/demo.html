<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sound Wave – Audio Wave Visualizer Reacts to Interaction</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <h1>🎵 Sound Wave</h1>
    <p class="subtitle">Audio wave visualizer reacts to your interaction</p>

    <div class="sound-container">
      <div class="sound-stage" id="soundStage">
        <canvas id="canvas"></canvas>
        
        <!-- Info overlay -->
        <div class="info-overlay">
          <span class="sound-status" id="soundStatus">🎵 Ready</span>
          <span class="wave-count" id="waveCount">✦ 0 waves</span>
        </div>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <button class="ctrl-btn play" id="playBtn">▶ Play</button>
      <button class="ctrl-btn pause" id="pauseBtn">⏸ Pause</button>
      <button class="ctrl-btn toggle" id="toggleBtn">🔄 Toggle</button>
      <button class="ctrl-btn reset" id="resetBtn">↺ Reset</button>
    </div>

    <!-- Sliders -->
    <div class="slider-container">
      <span class="slider-label">Wave Amplitude</span>
      <input type="range" id="amplitudeSlider" min="0" max="100" value="60" />
      <span class="slider-value" id="amplitudeValue">60%</span>
    </div>

    <div class="slider-container">
      <span class="slider-label">Wave Frequency</span>
      <input type="range" id="frequencySlider" min="1" max="10" value="4" />
      <span class="slider-value" id="frequencyValue">4×</span>
    </div>

    <div class="slider-container">
      <span class="slider-label">Wave Speed</span>
      <input type="range" id="speedSlider" min="1" max="10" value="5" />
      <span class="slider-value" id="speedValue">5×</span>
    </div>

    <div class="slider-container">
      <span class="slider-label">Color</span>
      <input type="range" id="colorSlider" min="0" max="360" value="220" />
      <span class="slider-value" id="colorValue">220°</span>
    </div>

    <!-- Status -->
    <div class="status" id="status">🎵 Move your cursor or click to create sound waves</div>

    <!-- Keyboard shortcuts -->
    <div class="shortcuts">
      <kbd>Mouse</kbd> Create waves · <kbd>Space</kbd> Toggle · <kbd>P</kbd> Play/Pause
    </div>
  </div>

  <script>
    (function() {
      "use strict";

      // DOM elements
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      const soundStatus = document.getElementById('soundStatus');
      const waveCount = document.getElementById('waveCount');
      const playBtn = document.getElementById('playBtn');
      const pauseBtn = document.getElementById('pauseBtn');
      const toggleBtn = document.getElementById('toggleBtn');
      const resetBtn = document.getElementById('resetBtn');
      const status = document.getElementById('status');
      const amplitudeSlider = document.getElementById('amplitudeSlider');
      const amplitudeValue = document.getElementById('amplitudeValue');
      const frequencySlider = document.getElementById('frequencySlider');
      const frequencyValue = document.getElementById('frequencyValue');
      const speedSlider = document.getElementById('speedSlider');
      const speedValue = document.getElementById('speedValue');
      const colorSlider = document.getElementById('colorSlider');
      const colorValue = document.getElementById('colorValue');

      // State
      let wavePoints = [];
      let particles = [];
      let isPlaying = true;
      let isPaused = false;
      let animationId = null;
      let time = 0;
      let mouseX = 0;
      let mouseY = 0;
      let isMouseOnCanvas = false;
      let waveCountVal = 0;

      // ----- Canvas setup -----
      function setupCanvas() {
        const rect = canvas.parentElement.getBoundingClientRect();
        const size = Math.min(rect.width - 40, 600);
        canvas.width = size;
        canvas.height = size;
        canvas.style.width = size + 'px';
        canvas.style.height = size + 'px';
      }

      // ----- Wave particle class -----
      class WaveParticle {
        constructor(x, y, hue) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 0.5 + Math.random() * 1.5;
          this.x = x;
          this.y = y;
          this.vx = Math.cos(angle) * speed;
          this.vy = Math.sin(angle) * speed;
          this.size = 1 + Math.random() * 3;
          this.life = 1;
          this.decay = 0.005 + Math.random() * 0.015;
          this.hue = hue + (Math.random() - 0.5) * 30;
          this.saturation = 80 + Math.random() * 20;
          this.lightness = 60 + Math.random() * 30;
          this.opacity = 0.5 + Math.random() * 0.5;
          this.glowSize = this.size * 4;
        }

        update() {
          this.x += this.vx;
          this.y += this.vy;
          this.vx *= 0.99;
          this.vy *= 0.99;
          this.life -= this.decay;
          this.size *= 0.998;
          return this.life > 0 && this.size > 0.1;
        }

        draw(ctx) {
          const alpha = this.life * this.opacity * 0.8;
          const size = this.size * this.life;

          // Glow
          const gradient = ctx.createRadialGradient(
            this.x, this.y, 0,
            this.x, this.y, size * 5
          );
          gradient.addColorStop(0, `hsla(${this.hue + 20}, 100%, 90%, ${alpha * 0.3})`);
          gradient.addColorStop(1, `hsla(${this.hue}, 100%, 60%, 0)`);
          ctx.fillStyle = gradient;
          ctx.beginPath();
          ctx.arc(this.x, this.y, size * 5, 0, Math.PI * 2);
          ctx.fill();

          // Core
          ctx.fillStyle = `hsla(${this.hue + 30}, 100%, 95%, ${alpha * 0.9})`;
          ctx.beginPath();
          ctx.arc(this.x, this.y, size, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // ----- Generate wave -----
      function generateWave(x, y) {
        const w = canvas.width;
        const h = canvas.height;
        const amplitude = parseInt(amplitudeSlider.value) / 100;
        const frequency = parseInt(frequencySlider.value);
        const speed = parseInt(speedSlider.value) / 5;
        const hue = parseInt(colorSlider.value);
        const cx = x || w / 2;
        const cy = y || h / 2;

        // Create wave particles
        const count = 20 + Math.floor(amplitude * 30);
        for (let i = 0; i < count; i++) {
          const angle = Math.random() * Math.PI * 2;
          const dist = Math.random() * 30;
          const px = cx + Math.cos(angle) * dist;
          const py = cy + Math.sin(angle) * dist;
          particles.push(new WaveParticle(px, py, hue));
        }

        // Generate wave points for visualization
        const numPoints = 80;
        const newWavePoints = [];
        for (let i = 0; i <= numPoints; i++) {
          const t = i / numPoints;
          const angle = t * Math.PI * 2;
          const wave = Math.sin(angle * frequency + time * speed) * amplitude * 80;
          const radius = 30 + wave;
          const px = cx + Math.cos(angle) * radius;
          const py = cy + Math.sin(angle) * radius;
          newWavePoints.push({ x: px, y: py, t: t });
        }

        wavePoints.push({
          points: newWavePoints,
          cx: cx,
          cy: cy,
          life: 1,
          hue: hue,
          amplitude: amplitude,
          frequency: frequency,
          speed: speed,
          time: time
        });

        // Limit wave count
        if (wavePoints.length > 20) {
          wavePoints.shift();
        }

        waveCountVal++;
        waveCount.textContent = `✦ ${waveCountVal} waves`;
        soundStatus.textContent = '🎵 Wave!';
        status.textContent = `🎵 Sound wave at (${Math.round(cx)}, ${Math.round(cy)})`;
        setTimeout(() => {
          if (wavePoints.length > 0) {
            soundStatus.textContent = '🎵 Active';
          } else {
            soundStatus.textContent = '🎵 Ready';
          }
        }, 1000);
      }

      // ----- Draw wave -----
      function drawWave(waveData) {
        const points = waveData.points;
        const life = waveData.life;
        const hue = waveData.hue;
        const alpha = life * 0.8;

        // Draw wave glow
        for (let i = 0; i < points.length; i++) {
          const p = points[i];
          const glowSize = 10 * life * waveData.amplitude;
          const gradient = ctx.createRadialGradient(
            p.x, p.y, 0,
            p.x, p.y, glowSize
          );
          gradient.addColorStop(0, `hsla(${hue + 20}, 100%, 80%, ${alpha * 0.05})`);
          gradient.addColorStop(1, `hsla(${hue + 20}, 100%, 60%, 0)`);
          ctx.fillStyle = gradient;
          ctx.beginPath();
          ctx.arc(p.x, p.y, glowSize, 0, Math.PI * 2);
          ctx.fill();
        }

        // Draw wave line
        ctx.beginPath();
        for (let i = 0; i < points.length; i++) {
          const p = points[i];
          if (i === 0) ctx.moveTo(p.x, p.y);
          else ctx.lineTo(p.x, p.y);
        }
        ctx.closePath();

        const grad = ctx.createRadialGradient(
          waveData.cx, waveData.cy, 0,
          waveData.cx, waveData.cy, 150
        );
        grad.addColorStop(0, `hsla(${hue + 30}, 100%, 90%, ${alpha * 0.8})`);
        grad.addColorStop(0.5, `hsla(${hue + 10}, 100%, 70%, ${alpha * 0.6})`);
        grad.addColorStop(1, `hsla(${hue - 10}, 100%, 50%, ${alpha * 0.3})`);

        ctx.shadowColor = `hsla(${hue}, 100%, 60%, ${alpha * 0.1})`;
        ctx.shadowBlur = 20;
        ctx.strokeStyle = grad;
        ctx.lineWidth = 2 + 4 * waveData.amplitude * life;
        ctx.stroke();
        ctx.shadowBlur = 0;

        // Draw wave points (nodes)
        for (let i = 0; i < points.length; i += 3) {
          const p = points[i];
          const nodeSize = 2 + 3 * waveData.amplitude * life * (0.5 + 0.5 * Math.sin(i * 0.5 + time));
          const grad2 = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, nodeSize);
          grad2.addColorStop(0, `hsla(${hue + 40}, 100%, 95%, ${alpha * 0.9})`);
          grad2.addColorStop(1, `hsla(${hue + 20}, 100%, 70%, ${alpha * 0.3})`);
          ctx.fillStyle = grad2;
          ctx.beginPath();
          ctx.arc(p.x, p.y, nodeSize, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // ----- Draw background -----
      function drawBackground() {
        const w = canvas.width;
        const h = canvas.height;
        const cx = w / 2;
        const cy = h / 2;

        // Dark background
        const bgGradient = ctx.createRadialGradient(cx, cy, 0, cx, cy, w * 0.7);
        bgGradient.addColorStop(0, '#0a0a1a');
        bgGradient.addColorStop(0.5, '#060612');
        bgGradient.addColorStop(1, '#020208');
        ctx.fillStyle = bgGradient;
        ctx.fillRect(0, 0, w, h);

        // Subtle grid
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.02)';
        ctx.lineWidth = 0.5;
        for (let i = 0; i < w; i += 40) {
          ctx.beginPath();
          ctx.moveTo(i, 0);
          ctx.lineTo(i, h);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(0, i);
          ctx.lineTo(w, i);
          ctx.stroke();
        }
      }

      // ----- Draw -----
      function draw() {
        const w = canvas.width;
        const h = canvas.height;

        drawBackground();

        // Update wave points
        if (isPlaying && !isPaused) {
          // Update existing waves
          wavePoints = wavePoints.filter(w => w.life > 0.01);
          wavePoints.forEach(w => {
            w.life *= 0.995;
            // Update wave shape
            const speed = parseInt(speedSlider.value) / 5;
            const amplitude = parseInt(amplitudeSlider.value) / 100;
            const frequency = parseInt(frequencySlider.value);
            const points = w.points;
            for (let i = 0; i < points.length; i++) {
              const t = points[i].t;
              const angle = t * Math.PI * 2;
              const wave = Math.sin(angle * frequency + time * speed) * amplitude * 80 * w.life;
              const radius = 30 + wave;
              points[i].x = w.cx + Math.cos(angle) * radius;
              points[i].y = w.cy + Math.sin(angle) * radius;
            }
          });

          // Update particles
          particles = particles.filter(p => p.update());
        }

        // Draw waves (sorted by life for depth)
        const sortedWaves = [...wavePoints].sort((a, b) => a.life - b.life);
        sortedWaves.forEach(w => drawWave(w));

        // Draw particles
        particles.forEach(p => p.draw(ctx));

        // Update status
        if (wavePoints.length === 0 && particles.length === 0 && !isPaused) {
          soundStatus.textContent = '🎵 Ready';
        }
        waveCount.textContent = `✦ ${wavePoints.length + particles.length}`;
      }

      // ----- Animation loop -----
      function animate() {
        time += 0.016;
        draw();
        animationId = requestAnimationFrame(animate);
      }

      // ----- Start animation -----
      function startAnimation() {
        if (animationId) {
          cancelAnimationFrame(animationId);
        }
        animate();
      }

      // ----- Play -----
      function play() {
        isPlaying = true;
        isPaused = false;
        playBtn.textContent = '▶ Play';
        pauseBtn.textContent = '⏸ Pause';
        status.textContent = '▶ Playing';
        soundStatus.textContent = '🎵 Active';
      }

      // ----- Pause -----
      function pause() {
        isPaused = true;
        playBtn.textContent = '▶ Play';
        pauseBtn.textContent = '▶ Resume';
        status.textContent = '⏸ Paused';
        soundStatus.textContent = '⏸ Paused';
      }

      // ----- Toggle -----
      function togglePlay() {
        if (isPaused) {
          play();
        } else {
          pause();
        }
      }

      // ----- Reset -----
      function resetSound() {
        wavePoints = [];
        particles = [];
        isPlaying = true;
        isPaused = false;
        playBtn.textContent = '▶ Play';
        pauseBtn.textContent = '⏸ Pause';
        soundStatus.textContent = '🎵 Ready';
        waveCount.textContent = '✦ 0 waves';
        amplitudeSlider.value = 60;
        amplitudeValue.textContent = '60%';
        frequencySlider.value = 4;
        frequencyValue.textContent = '4×';
        speedSlider.value = 5;
        speedValue.textContent = '5×';
        colorSlider.value = 220;
        colorValue.textContent = '220°';
        status.textContent = '↺ Reset';
        setTimeout(() => {
          status.textContent = '🎵 Move your cursor or click to create sound waves';
        }, 500);
      }

      // ----- Event Listeners -----
      // Mouse tracking
      canvas.addEventListener('mousemove', (e) => {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        mouseX = (e.clientX - rect.left) * scaleX;
        mouseY = (e.clientY - rect.top) * scaleY;
        isMouseOnCanvas = true;
      });

      canvas.addEventListener('mouseenter', () => {
        isMouseOnCanvas = true;
        status.textContent = '🎵 Move to create sound waves';
      });

      canvas.addEventListener('mouseleave', () => {
        isMouseOnCanvas = false;
        status.textContent = '🎵 Move cursor back to create waves';
      });

      // Click to generate wave
      canvas.addEventListener('click', (e) => {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        const x = (e.clientX - rect.left) * scaleX;
        const y = (e.clientY - rect.top) * scaleY;
        generateWave(x, y);
      });

      // Touch support
      canvas.addEventListener('touchmove', (e) => {
        e.preventDefault();
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        const touch = e.touches[0];
        mouseX = (touch.clientX - rect.left) * scaleX;
        mouseY = (touch.clientY - rect.top) * scaleY;
        isMouseOnCanvas = true;
        // Generate wave on touch move
        if (Math.random() < 0.1) {
          generateWave(mouseX, mouseY);
        }
      });

      canvas.addEventListener('touchstart', (e) => {
        const touch = e.touches[0];
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        mouseX = (touch.clientX - rect.left) * scaleX;
        mouseY = (touch.clientY - rect.top) * scaleY;
        isMouseOnCanvas = true;
        generateWave(mouseX, mouseY);
      });

      // Buttons
      playBtn.addEventListener('click', play);
      pauseBtn.addEventListener('click', togglePlay);
      toggleBtn.addEventListener('click', togglePlay);
      resetBtn.addEventListener('click', resetSound);

      // Sliders
      amplitudeSlider.addEventListener('input', (e) => {
        amplitudeValue.textContent = e.target.value + '%';
      });

      frequencySlider.addEventListener('input', (e) => {
        frequencyValue.textContent = e.target.value + '×';
      });

      speedSlider.addEventListener('input', (e) => {
        speedValue.textContent = e.target.value + '×';
      });

      colorSlider.addEventListener('input', (e) => {
        colorValue.textContent = e.target.value + '°';
      });

      // Keyboard shortcuts
      document.addEventListener('keydown', (e) => {
        if (e.key === ' ' || e.key === 'Space') {
          e.preventDefault();
          togglePlay();
        }
        if (e.key === 'p' || e.key === 'P') {
          e.preventDefault();
          togglePlay();
        }
        if (e.key === 'r' || e.key === 'R') {
          e.preventDefault();
          resetSound();
        }
      });

      // ----- Resize handler -----
      let resizeTimeout;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(() => {
          setupCanvas();
        }, 200);
      });

      // ----- Init -----
      function init() {
        setupCanvas();
        startAnimation();
        status.textContent = '🎵 Move your cursor or click to create sound waves!';
        // Generate initial waves
        setTimeout(() => {
          const w = canvas.width;
          const h = canvas.height;
          const cx = w / 2;
          const cy = h / 2;
          generateWave(cx - 80, cy);
          setTimeout(() => generateWave(cx + 80, cy), 300);
          setTimeout(() => generateWave(cx, cy - 80), 600);
          setTimeout(() => generateWave(cx, cy + 80), 900);
        }, 500);
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }

    })();
  </script>
</body>
</html>
