<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Float-Drift Accessible Progress Bar - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="showcase">
    <header class="head">
      <h1>Float-Drift Progress Bar (<code>#54446</code>)</h1>
      <p>An accessible ARIA progress meter equipped with gentle zero-gravity levitating status badges and hardware-accelerated filling.</p>
    </header>
    
    <div class="ease-progress-float-drift">
      <div class="meta-row">
        <span class="label-title">✦ AI Agent Verification Loop</span>
        <div class="floating-badge"><span>● 75% COMPLETE</span></div>
      </div>

      <div class="track-container" role="progressbar" aria-valuenow="75" aria-valuemin="0" aria-valuemax="100" aria-label="Contribution Progress">
        <div class="bar-fill" style="width: 75%;">
          <div class="glow-tip"></div>
        </div>
      </div>

      <div class="step-markers">
        <span class="step done">Phase 1: Claim (90/90)</span>
        <span class="step done">Phase 2: Build Solutions</span>
        <span class="step active">Phase 3: Automated PR Merging</span>
      </div>

      <div class="actions-demo">
        <button class="demo-btn" onclick="setProgress(35)">Set 35%</button>
        <button class="demo-btn" onclick="setProgress(75)">Set 75%</button>
        <button class="demo-btn primary" onclick="setProgress(100)">Complete 100% ✦</button>
      </div>
    </div>
  </div>

  <script>
    function setProgress(val) {
      const bar = document.querySelector('.bar-fill');
      const track = document.querySelector('.track-container');
      const badge = document.querySelector('.floating-badge span');
      bar.style.width = val + '%';
      track.setAttribute('aria-valuenow', val);
      badge.textContent = '● ' + val + '% ' + (val === 100 ? 'MERGED' : 'COMPLETE');
    }
  </script>
</body>
</html>
