<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Glitch-Flicker Tabs - Cyberpunk Neon Layouts</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="cyberpunk-container">
    <div class="glitch-tabs-wrapper">
      <!-- Radio Inputs (Hidden) -->
      <input type="radio" name="cyber-tabs" id="tab-1" class="tab-input" checked>
      <input type="radio" name="cyber-tabs" id="tab-2" class="tab-input">
      <input type="radio" name="cyber-tabs" id="tab-3" class="tab-input">
      
      <!-- Tab Headers -->
      <div class="tab-headers">
        <label for="tab-1" class="tab-label">OVERRIDE</label>
        <label for="tab-2" class="tab-label">DATABANKS</label>
        <label for="tab-3" class="tab-label">PROXY</label>
      </div>
      
      <!-- Tab Contents -->
      <div class="tab-content-container">
        
        <div class="tab-content content-1">
          <div class="glitch-effect-box">
            <h3 class="neon-title" data-text="SYSTEM OVERRIDE">SYSTEM OVERRIDE</h3>
            <p class="neon-text">Mainframe access granted. Security protocols bypassed successfully.</p>
          </div>
        </div>
        
        <div class="tab-content content-2">
          <div class="glitch-effect-box">
            <h3 class="neon-title" data-text="DATABANKS">DATABANKS</h3>
            <p class="neon-text">Archive alpha loaded. Encrypted payload ready for extraction.</p>
          </div>
        </div>
        
        <div class="tab-content content-3">
          <div class="glitch-effect-box">
            <h3 class="neon-title" data-text="PROXY NETWORK">PROXY NETWORK</h3>
            <p class="neon-text">Rerouting signal through 7 anonymous nodes. Tracing blocked.</p>
          </div>
        </div>
        
      </div>
    </div>
  </div>
</body>
</html>
