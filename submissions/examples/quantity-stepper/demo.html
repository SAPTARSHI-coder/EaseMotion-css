<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quantity Stepper &mdash; EaseMotion CSS Demo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="page-head">
    <p class="kicker">EaseMotion CSS &middot; E-commerce</p>
    <h1>Quantity Stepper</h1>
    <p class="sub">Pick how many you need with a stepper that clicks with confidence.</p>
  </header>
  <main class="stage">
    <div class="qs-stepper">
      <button class="qs-btn minus" aria-label="Decrease">&#8722;</button>
      <div class="qs-value">2</div>
      <button class="qs-btn plus" aria-label="Increase">&#43;</button>
    </div>
  </main>
  <p class="stage-caption">The readout spins in place whenever the quantity changes.</p>
  <footer class="page-foot">
    <span>Pure CSS &middot; zero dependencies</span>
    <span>Press + spin readout</span>
  </footer>
</body>
</html>
