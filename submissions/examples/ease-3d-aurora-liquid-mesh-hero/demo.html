<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ease 3D Aurora Liquid Mesh Hero</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="aurora-body">
  <canvas id="auroraCanvas"></canvas>
  <div class="aurora-hero-content">
    <h1>Next-Gen Motion Framework</h1>
    <p>Spatial liquid wave mesh background with HSL gradient distortion.</p>
    <button class="aurora-btn">Explore Mesh →</button>
  </div>
  <script>
    const canvas = document.getElementById('auroraCanvas');
    const ctx = canvas.getContext('2d');
    let width, height, time = 0;
    function resize() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; }
    window.addEventListener('resize', resize);
    resize();
    function animate() {
      time += 0.01;
      ctx.fillStyle = '#050811';
      ctx.fillRect(0, 0, width, height);
      for (let i = 0; i < 3; i++) {
        ctx.beginPath();
        const grad = ctx.createLinearGradient(0, 0, width, height);
        grad.addColorStop(0, `hsla(${200 + i * 40 + Math.sin(time) * 30}, 80%, 55%, 0.4)`);
        grad.addColorStop(1, `hsla(${280 + i * 40}, 80%, 50%, 0.1)`);
        ctx.fillStyle = grad;
        ctx.moveTo(0, height);
        for (let x = 0; x <= width; x += 30) {
          const y = Math.sin(x * 0.003 + time + i) * 100 + Math.cos(time * 0.8) * 50 + height * 0.5;
          ctx.lineTo(x, y);
        }
        ctx.lineTo(width, height);
        ctx.closePath();
        ctx.fill();
      }
      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>
