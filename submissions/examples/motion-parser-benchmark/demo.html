<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Motion Engine Parser Benchmark</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="benchmark">
    <section class="card">
      <span class="badge">EaseMotion CSS</span>

      <h1>Motion Parser Benchmark</h1>

      <p class="description">
        A lightweight browser benchmark for measuring motion attribute
        parsing performance and frame execution time.
      </p>

      <div class="metrics">
        <div class="metric">
          <span class="label">Operations/sec</span>
          <strong id="ops">—</strong>
        </div>

        <div class="metric">
          <span class="label">Execution</span>
          <strong id="execution">—</strong>
        </div>

        <div class="metric">
          <span class="label">FPS</span>
          <strong id="fps">—</strong>
        </div>

        <div class="metric">
          <span class="label">Status</span>
          <strong id="status">Ready</strong>
        </div>
      </div>

      <button id="runBenchmark" class="benchmark-btn">
        Run Benchmark
      </button>

      <p class="threshold">
        Target: ≥ 60 FPS · ≤ 16.67ms/frame
      </p>
    </section>
  </main>

  <script>
    const samples = [
      "fade-in 300ms ease-out",
      "slide-up 400ms ease-out delay-100ms",
      "slide-down 500ms ease-in",
      "slide-left 450ms ease-in-out",
      "slide-right 450ms ease-out",
      "bounce 800ms ease-in-out",
      "spin 1000ms linear",
      "pulse 700ms ease-in-out",
      "zoom-in 350ms ease-out",
      "zoom-out 350ms ease-in"
    ];

    function parseMotionAttribute(value) {
      const tokens = value.trim().split(/\s+/);

      return {
        animation: tokens[0] || "",
        duration: tokens.find(token => token.endsWith("ms")) || "0ms",
        easing: tokens.find(token =>
          ["linear", "ease", "ease-in", "ease-out", "ease-in-out"]
            .includes(token)
        ) || "ease"
      };
    }

    function runBenchmark() {
      const iterations = 100000;
      let operations = 0;

      const start = performance.now();

      for (let i = 0; i < iterations; i++) {
        for (const sample of samples) {
          parseMotionAttribute(sample);
          operations++;
        }
      }

      const end = performance.now();

      const executionMs = end - start;
      const seconds = executionMs / 1000;
      const opsPerSecond = operations / seconds;
      const fps = 1000 / (executionMs / iterations);

      document.getElementById("ops").textContent =
        Math.round(opsPerSecond).toLocaleString();

      document.getElementById("execution").textContent =
        (executionMs / iterations).toFixed(4) + " ms";

      document.getElementById("fps").textContent =
        fps.toFixed(2);

      const status = document.getElementById("status");

      if (fps >= 60) {
        status.textContent = "PASS";
        status.className = "pass";
      } else {
        status.textContent = "FAIL";
        status.className = "fail";
      }
    }

    document
      .getElementById("runBenchmark")
      .addEventListener("click", runBenchmark);
  </script>

</body>
</html>
