<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CSS Mood Selector</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <header class="hero">
      <p class="eyebrow">EaseMotion CSS · #68523</p>
      <h1>Mood selector</h1>
      <p>An emoji-based selector where each choice changes the visual face and supporting mood description.</p>
    </header>
    <section class="widget" aria-labelledby="mood-title">
      <div class="face" aria-hidden="true"><div class="eyes"><i></i><i></i></div><div class="mouth"></div></div>
      <div class="copy"><p class="label">How are you feeling?</p><h2 id="mood-title">Choose a mood</h2><p class="description">Pick the expression that best matches your current energy.</p></div>
      <div class="choices" role="group" aria-label="Mood choices">
        <button type="button" class="choice active" aria-label="Happy">😊<span>Happy</span></button>
        <button type="button" class="choice" aria-label="Calm">😌<span>Calm</span></button>
        <button type="button" class="choice" aria-label="Excited">🤩<span>Excited</span></button>
        <button type="button" class="choice" aria-label="Tired">😴<span>Tired</span></button>
        <button type="button" class="choice" aria-label="Focused">🧐<span>Focused</span></button>
      </div>
    </section>
  </main>
</body>
</html>
