<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Ripple-Wave Hero Section for product catalog layouts">
    <title>Ripple-Wave Hero Section</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main>

        <section class="hero">

            <div class="ripple ripple-one"></div>
            <div class="ripple ripple-two"></div>
            <div class="ripple ripple-three"></div>

            <div class="hero-content">

                <p class="eyebrow">EASEMOTION CSS</p>

                <h1>
                    Discover Products
                    <span>Made to Move</span>
                </h1>

                <p class="hero-description">
                    Explore a modern collection of products designed
                    with simplicity, quality and performance in mind.
                </p>

                <div class="hero-actions">
                    <a href="#" class="hero-button primary-button">
                        Explore Products
                    </a>

                    <a href="#" class="hero-button secondary-button">
                        View Collection
                    </a>
                </div>

            </div>

            <div class="hero-badge">
                <span class="badge-dot"></span>
                New Collection
            </div>

            <div class="scroll-indicator">
                <span></span>
                Scroll to explore
            </div>

        </section>

    </main>

</body>
</html>
