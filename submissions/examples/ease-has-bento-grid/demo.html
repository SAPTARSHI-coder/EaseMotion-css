<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS :has() Dynamic Bento Grid</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="ease-bento-grid">
    <!-- Card 1 (Column 1, spans 2 rows) -->
    <div class="ease-bento-card ease-card-tall ease-col-1">
      <div class="ease-card-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg></div>
      <h3 class="ease-card-title">Relational Logic</h3>
    </div>
    <!-- Card 2 (Column 2, Top) -->
    <div class="ease-bento-card ease-col-2">
      <div class="ease-card-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#f472b6" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg></div>
      <h3 class="ease-card-title">Dynamic Interpolation</h3>
    </div>
    <!-- Card 3 (Column 3, Top) -->
    <div class="ease-bento-card ease-col-3">
      <div class="ease-card-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#a78bfa" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div>
      <h3 class="ease-card-title">Zero JavaScript</h3>
    </div>
    <!-- Card 4 (Columns 2 & 3, Bottom) -->
    <div class="ease-bento-card ease-card-wide ease-col-2 ease-col-3">
      <div class="ease-card-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#4ade80" stroke-width="2"><path d="M18 20V10M12 20V4M6 20v-4"/></svg></div>
      <h3 class="ease-card-title">GPU Accelerated State</h3>
    </div>
  </div>
  <p style="position: absolute; bottom: 2rem; color: #64748b; font-size: 0.875rem; text-transform: uppercase; letter-spacing: 2px;">Hover over cards to trigger :has() layout shift</p>
</body>
</html>
