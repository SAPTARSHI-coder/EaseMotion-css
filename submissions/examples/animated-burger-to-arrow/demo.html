<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CSS animated hamburger menu transforming into a back arrow">
  <title>Animated Burger to Arrow</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="demo">
    <h1>Animated Burger to Arrow</h1>
    <p class="subtitle">
      Pure CSS hamburger icon that transforms into a back arrow.
    </p>

    <div class="demo-card">
      <label class="menu-toggle">
        <input
          type="checkbox"
          aria-label="Toggle navigation menu"
        >

        <span class="hamburger" aria-hidden="true">
          <span class="line line-top"></span>
          <span class="line line-middle"></span>
          <span class="line line-bottom"></span>
        </span>
      </label>

      <p class="instruction">
        Click the icon to animate
      </p>
    </div>
  </main>
</body>
</html>
