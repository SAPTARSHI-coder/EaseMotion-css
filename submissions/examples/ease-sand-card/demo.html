<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sand Card · Zen Garden Sand Shifts</title>

    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <div class="card">
        <h2>🏜️ Sand Card</h2>
        <p class="sub">sand shifts and settles like a zen garden</p>

        <!-- === SAND CARD === -->
        <div class="sand-container" id="sandContainer">
            <div class="sand-card">
                <div class="sand-content">
                    <i class="fas fa-spa"></i>
                    <h3>Zen Garden</h3>
                    <p>Hover to see the sand shift</p>
                    <span class="sand-zen">✦ Peace ✦</span>
                </div>
                <div class="sand-grains">
                    <div class="grain g1"></div>
                    <div class="grain g2"></div>
                    <div class="grain g3"></div>
                    <div class="grain g4"></div>
                    <div class="grain g5"></div>
                    <div class="grain g6"></div>
                    <div class="grain g7"></div>
                    <div class="grain g8"></div>
                    <div class="grain g9"></div>
                    <div class="grain g10"></div>
                    <div class="grain g11"></div>
                    <div class="grain g12"></div>
                    <div class="grain g13"></div>
                    <div class="grain g14"></div>
                    <div class="grain g15"></div>
                    <div class="grain g16"></div>
                    <div class="grain g17"></div>
                    <div class="grain g18"></div>
                    <div class="grain g19"></div>
                    <div class="grain g20"></div>
                </div>
                <div class="sand-ripple r1"></div>
                <div class="sand-ripple r2"></div>
                <div class="sand-ripple r3"></div>
            </div>
        </div>

        <p style="margin-top: 2rem; font-size: 0.85rem; color: #64748b;">
            Hover · watch the sand shift and settle
        </p>
    </div>

    <!-- Embedded JavaScript -->
    <script>
        (function() {
            'use strict';

            const container = document.getElementById('sandContainer');

            // Click feedback
            container.addEventListener('click', function() {
                const card = this.querySelector('.sand-card');
                card.classList.add('click-pulse');
                setTimeout(() => {
                    card.classList.remove('click-pulse');
                }, 300);
                console.log('🏜️ Sand card clicked!');
            });

            // Keyboard accessibility
            container.setAttribute('tabindex', '0');
            container.setAttribute('role', 'button');
            container.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    this.click();
                }
            });

            // Reset animation on hover
            container.addEventListener('mouseenter', function() {
                const grains = this.querySelectorAll('.grain');
                grains.forEach(g => {
                    g.style.animation = 'none';
                    void g.offsetWidth;
                    g.style.animation = '';
                });
                const ripples = this.querySelectorAll('.sand-ripple');
                ripples.forEach(r => {
                    r.style.animation = 'none';
                    void r.offsetWidth;
                    r.style.animation = '';
                });
            });

            console.log('🏜️ Sand card initialized!');

        })();
    </script>

</body>
</html>
