<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ease Fluid Magnetic Navbar — EaseMotion CSS</title>

  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- EaseMotion Core Styles -->
  <link rel="stylesheet" href="../../easemotion.min.css" />

  <!-- Component Specific Styles -->
  <link rel="stylesheet" href="style.css" />
</head>
<body class="ease-magnetic-demo-body">

  <div class="ease-magnetic-wrapper">
    <!-- Header -->
    <header class="ease-header ease-center ease-fade-in">
      <span class="ease-badge-pill">⚡ EaseMotion Component</span>
      <h1 class="ease-gradient-title ease-slide-up ease-delay-100">Fluid Magnetic Navbar</h1>
      <p class="ease-subtitle ease-slide-up ease-delay-200">
        macOS-inspired liquid dock navbar with cursor magnetic attraction, fluid sliding indicator pill, and glassmorphism styling.
      </p>
    </header>

    <!-- Magnetic Navbar Component -->
    <nav class="ease-magnetic-navbar ease-slide-up ease-delay-300" id="magneticNavbar" aria-label="Main Navigation">
      <div class="ease-pill-indicator" id="pillIndicator"></div>
      
      <a href="#home" class="ease-nav-item active" data-nav="home">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
        <span>Home</span>
      </a>
      <a href="#features" class="ease-nav-item" data-nav="features">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
        <span>Features</span>
      </a>
      <a href="#showcase" class="ease-nav-item" data-nav="showcase">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
        <span>Showcase</span>
      </a>
      <a href="#pricing" class="ease-nav-item" data-nav="pricing">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
        <span>Pricing</span>
      </a>
      <a href="#contact" class="ease-nav-item" data-nav="contact">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
        <span>Contact</span>
      </a>
    </nav>
  </div>

  <!-- Interactive Magnetic Script -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const navbar = document.getElementById('magneticNavbar');
      const pill = document.getElementById('pillIndicator');
      const items = document.querySelectorAll('.ease-nav-item');

      // Update Pill Position & Size
      function updatePill(target) {
        if (!target) return;
        const rect = target.getBoundingClientRect();
        const navRect = navbar.getBoundingClientRect();

        pill.style.width = `${rect.width}px`;
        pill.style.left = `${rect.left - navRect.left}px`;
      }

      // Initial active pill alignment
      const activeItem = document.querySelector('.ease-nav-item.active');
      if (activeItem) {
        updatePill(activeItem);
      }

      // Magnetic Attraction & Hover Listeners
      items.forEach(item => {
        item.addEventListener('mouseenter', (e) => {
          updatePill(e.currentTarget);
        });

        item.addEventListener('mousemove', (e) => {
          const rect = item.getBoundingClientRect();
          const centerX = rect.left + rect.width / 2;
          const centerY = rect.top + rect.height / 2;

          // Calculate magnetic pull offset vector
          const deltaX = (e.clientX - centerX) * 0.35;
          const deltaY = (e.clientY - centerY) * 0.35;

          item.style.transform = `translate3d(${deltaX}px, ${deltaY}px, 0)`;
        });

        item.addEventListener('mouseleave', () => {
          item.style.transform = `translate3d(0px, 0px, 0)`;
          const currentActive = document.querySelector('.ease-nav-item.active');
          if (currentActive) {
            updatePill(currentActive);
          }
        });

        item.addEventListener('click', (e) => {
          e.preventDefault();
          items.forEach(i => i.classList.remove('active'));
          item.classList.add('active');
          updatePill(item);
        });
      });

      // Window resize re-alignment
      window.addEventListener('resize', () => {
        const currentActive = document.querySelector('.ease-nav-item.active');
        if (currentActive) {
          updatePill(currentActive);
        }
      });
    });
  </script>
</body>
</html>
