```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Animated file drag and dropzone with dark mode styling"
  >
  <title>Animated File Drag Dropzone</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="demo-page">
    <section class="dropzone-section" aria-labelledby="dropzone-title">

      <div class="dropzone-header">
        <span class="eyebrow">EaseMotion Component</span>

        <h1 id="dropzone-title">
          Upload your files
        </h1>

        <p>
          Drag and drop your files here, or browse from your device.
        </p>
      </div>

      <div
        class="file-dropzone"
        role="group"
        aria-label="File upload area"
      >
        <div class="dropzone-icon" aria-hidden="true">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M12 16V4"></path>
            <path d="M7 9l5-5 5 5"></path>
            <path d="M5 20h14"></path>
          </svg>
        </div>

        <div class="dropzone-content">
          <h2>Drop your files here</h2>

          <p>
            or
            <a href="#" class="browse-link">
              browse files
            </a>
          </p>

          <span class="file-hint">
            PNG, JPG, PDF or ZIP · Maximum 10 MB
          </span>
        </div>

        <div class="dropzone-indicator" aria-hidden="true">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>

      <p class="accessibility-note">
        Files can be selected from your device using the browse option.
      </p>

    </section>
  </main>
</body>
</html>
```
