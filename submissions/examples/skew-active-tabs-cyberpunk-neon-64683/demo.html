<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skew-Active Tabs - Cyberpunk Neon Layouts</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background-color: #050505;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: sans-serif;
        }
        .container {
            width: 100%;
            max-width: 600px;
            padding: 2rem;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="ease-skew-tabs-cyberpunk" role="tablist" aria-label="Cyberpunk Neon Tabs">
        <button class="ease-skew-tab active" role="tab" aria-selected="true">
            <span>System</span>
        </button>
        <button class="ease-skew-tab" role="tab" aria-selected="false">
            <span>Network</span>
        </button>
        <button class="ease-skew-tab" role="tab" aria-selected="false">
            <span>Firewall</span>
        </button>
    </div>
</div>

<script>
    const tabs = document.querySelectorAll('.ease-skew-tab');
    tabs.forEach(tab => {
        tab.addEventListener('click', () => {
            tabs.forEach(t => {
                t.classList.remove('active');
                t.setAttribute('aria-selected', 'false');
            });
            tab.classList.add('active');
            tab.setAttribute('aria-selected', 'true');
        });
    });
</script>

</body>
</html>
