<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Pure CSS Aurora Glow glassmorphism effect."
  >
  <title>Aurora Glow Glass Effect</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="aurora-scene">
    <div class="aurora-field" aria-hidden="true">
      <span class="aurora aurora-one"></span>
      <span class="aurora aurora-two"></span>
      <span class="aurora aurora-three"></span>
      <span class="aurora aurora-four"></span>
    </div>

    <section class="glass-card" aria-labelledby="aurora-title">
      <div class="glass-highlight" aria-hidden="true"></div>

      <header class="card-header">
        <span class="card-label">AURORA UI</span>

        <span class="live-indicator">
          <span class="live-dot"></span>
          ACTIVE
        </span>
      </header>

      <div class="aurora-icon" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
      </div>

      <h1 id="aurora-title">Aurora Glow</h1>

      <p>
        A translucent glass interface illuminated by soft,
        continuously shifting aurora gradients.
      </p>

      <div class="card-footer">
        <span class="footer-text">PURE CSS</span>

        <button class="glow-button" type="button">
          Explore
          <span aria-hidden="true">→</span>
        </button>
      </div>
    </section>
  </main>
</body>
</html>
