<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Progress Bar Orb</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="shell" aria-labelledby="title">
    <section class="card">
      <p class="eyebrow">progress</p>
      <h1 id="title">Progress Bar Orb</h1>
      <p class="summary">A CSS-only progress bar with a soft orb accent that travels with the fill.</p>
      <div class="stage" role="img" aria-label="Animated Progress Bar Orb">
        <div class="track">
          <div class="fill"></div>
          <div class="orb"></div>
        </div>
        <article class="tile">
          <strong>01</strong>
          <span>Orb follows the fill edge</span>
        </article>
        <article class="tile">
          <strong>02</strong>
          <span>Compact rounded track</span>
        </article>
        <article class="tile">
          <strong>03</strong>
          <span>Soft glow motion</span>
        </article>
        <article class="tile">
          <strong>04</strong>
          <span>Reduced-motion friendly</span>
        </article>
      </div>
      <div class="tags" aria-label="Progress Bar Orb features">
        <span>Orb follows the fill edge</span>
        <span>Compact rounded track</span>
        <span>Soft glow motion</span>
        <span>Reduced-motion friendly</span>
      </div>
    </section>
  </main>
</body>
</html>
