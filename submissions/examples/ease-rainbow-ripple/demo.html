<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rainbow Ripple – Rainbow Rings Expand from Interaction</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <h1>🌈 Rainbow Ripple</h1>
    <p class="subtitle">Rainbow rings expand from your interaction</p>

    <div class="ripple-container">
      <div class="ripple-stage" id="rippleStage">
        <canvas id="canvas"></canvas>
        
        <!-- Info overlay -->
        <div class="info-overlay">
          <span class="ripple-status" id="rippleStatus">🌈 Active</span>
          <span class="ripple-count" id="rippleCount">✦ 0 ripples</span>
        </div>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <button class="ctrl-btn toggle" id="toggleBtn">💡 Toggle</button>
      <button class="ctrl-btn clear" id="clearBtn">🗑️ Clear</button>
      <button class="ctrl-btn burst" id="burstBtn">💥 Burst</button>
      <button class="ctrl-btn reset" id="resetBtn">↺ Reset</button>
    </div>

    <!-- Sliders -->
    <div class="slider-container">
      <span class="slider-label">Ripple Speed</span>
      <input type="range" id="speedSlider" min="1" max="10" value="5" />
      <span class="slider-value" id="speedValue">5×</span>
    </div>

    <div class="slider-container">
      <span class="slider-label">Ripple Size</span>
      <input type="range" id="sizeSlider" min="20" max="100" value="60" />
      <span class="slider-value" id="sizeValue">60%</span>
    </div>

    <div class="slider-container">
      <span class="slider-label">Ring Count</span>
      <input type="range" id="ringSlider" min="3" max="12" value="6" />
      <span class="slider-value" id="ringValue">6</span>
    </div>

    <div class="slider-container">
      <span class="slider-label">Opacity</span>
      <input type="range" id="opacitySlider" min="0" max="100" value="60" />
      <span class="slider-value" id="opacityValue">60%</span>
    </div>

    <!-- Status -->
    <div class="status" id="status">🌈 Click anywhere to create rainbow ripples</div>

    <!-- Keyboard shortcuts -->
    <div class="shortcuts">
      <kbd>Click</kbd> Ripple · <kbd>T</kbd> Toggle · <kbd>C</kbd> Clear · <kbd>B</kbd> Burst
    </div>
  </div>

  <script>
    (function() {
      "use strict";

      // DOM elements
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      const rippleStatus = document.getElementById('rippleStatus');
      const rippleCount = document.getElementById('rippleCount');
      const toggleBtn = document.getElementById('toggleBtn');
      const clearBtn = document.getElementById('clearBtn');
      const burstBtn = document.getElementById('burstBtn');
      const resetBtn = document.getElementById('resetBtn');
      const status = document.getElementById('status');
      const speedSlider = document.getElementById('speedSlider');
      const speedValue = document.getElementById('speedValue');
      const sizeSlider = document.getElementById('sizeSlider');
      const sizeValue = document.getElementById('sizeValue');
      const ringSlider = document.getElementById('ringSlider');
      const ringValue = document.getElementById('ringValue');
      const opacitySlider = document.getElementById('opacitySlider');
      const opacityValue = document.getElementById('opacityValue');

      // State
      let ripples = [];
      let isActive = true;
      let animationId = null;
      let time = 0;

      // ----- Canvas setup -----
      function setupCanvas() {
        const rect = canvas.parentElement.getBoundingClientRect();
        const size = Math.min(rect.width - 40, 600);
        canvas.width = size;
        canvas.height = size;
        canvas.style.width = size + 'px';
        canvas.style.height = size + 'px';
      }

      // ----- Ripple class -----
      class Ripple {
        constructor(x, y, hue = 0) {
          this.x = x;
          this.y = y;
          this.radius = 5;
          this.maxRadius = Math.min(canvas.width, canvas.height) * 0.45 * (parseInt(sizeSlider.value) / 100);
          this.speed = 0.5 + parseInt(speedSlider.value) * 0.15;
          this.hue = hue;
          this.opacity = parseInt(opacitySlider.value) / 100;
          this.alive = true;
          this.rings = parseInt(ringSlider.value);
          this.trail = [];
          this.trailLength = 10 + Math.floor(Math.random() * 15);
          this.wobble = 0;
          this.wobbleSpeed = 0.02 + Math.random() * 0.03;
          this.wobbleAmount = 1 + Math.random() * 2;
        }

        update() {
          this.radius += this.speed;
          this.wobble += this.wobbleSpeed;
          
          // Add some organic wobble
          const wobbleOffset = Math.sin(this.wobble) * this.wobbleAmount;
          
          if (this.radius > this.maxRadius) {
            this.alive = false;
          }

          // Update trail
          this.trail.push({ x: this.x + wobbleOffset * 0.5, y: this.y + Math.cos(this.wobble * 0.7) * this.wobbleAmount * 0.5 });
          if (this.trail.length > this.trailLength) {
            this.trail.shift();
          }
        }

        draw(ctx) {
          const ringCount = this.rings;
          const baseOpacity = this.opacity * (1 - this.radius / this.maxRadius * 0.3);
          
          // Draw trail
          if (this.trail.length > 1) {
            for (let i = 0; i < this.trail.length - 1; i++) {
              const t = i / this.trail.length;
              const trailRadius = this.radius * t * 0.3;
              const trailOpacity = baseOpacity * t * 0.2;
              if (trailRadius > 1) {
                const hue = (this.hue + t * 120) % 360;
                ctx.strokeStyle = `hsla(${hue}, 100%, 60%, ${trailOpacity})`;
                ctx.lineWidth = 1 + t * 2;
                ctx.beginPath();
                ctx.arc(this.trail[i].x, this.trail[i].y, trailRadius, 0, Math.PI * 2);
                ctx.stroke();
              }
            }
          }

          // Draw rings
          for (let i = 0; i < ringCount; i++) {
            const ringRadius = this.radius * (0.2 + (i / ringCount) * 0.8);
            const ringOpacity = baseOpacity * (1 - i / ringCount * 0.3);
            const hue = (this.hue + (i / ringCount) * 360) % 360;
            const width = 1.5 + (1 - i / ringCount) * 3;

            if (ringRadius < 2) continue;

            // Glow
            ctx.shadowColor = `hsla(${hue}, 100%, 60%, ${ringOpacity * 0.3})`;
            ctx.shadowBlur = 15;

            ctx.strokeStyle = `hsla(${hue}, 100%, 65%, ${ringOpacity})`;
            ctx.lineWidth = width;
            ctx.beginPath();
            ctx.arc(this.x, this.y, ringRadius, 0, Math.PI * 2);
            ctx.stroke();

            // Inner glow ring
            if (i % 2 === 0) {
              ctx.strokeStyle = `hsla(${hue + 30}, 100%, 80%, ${ringOpacity * 0.2})`;
              ctx.lineWidth = width * 0.5;
              ctx.shadowBlur = 0;
              ctx.beginPath();
              ctx.arc(this.x, this.y, ringRadius * 0.8, 0, Math.PI * 2);
              ctx.stroke();
            }

            ctx.shadowBlur = 0;
          }

          // Center glow
          if (this.radius < this.maxRadius * 0.2) {
            const centerGlow = ctx.createRadialGradient(
              this.x, this.y, 0,
              this.x, this.y, this.radius * 0.3
            );
            const hue = this.hue % 360;
            centerGlow.addColorStop(0, `hsla(${hue}, 100%, 90%, ${baseOpacity * 0.3})`);
            centerGlow.addColorStop(1, `hsla(${hue + 60}, 100%, 60%, 0)`);
            ctx.fillStyle = centerGlow;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius * 0.3, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      }

      // ----- Create ripple -----
      function createRipple(x, y) {
        if (!isActive) return;
        const hue = Math.random() * 360;
        const ripple = new Ripple(x, y, hue);
        ripples.push(ripple);
        if (ripples.length > 50) {
          ripples.shift();
        }
        rippleCount.textContent = `✦ ${ripples.length} ripples`;
        status.textContent = `🌈 Ripple created at (${Math.round(x)}, ${Math.round(y)})`;
      }

      // ----- Create burst -----
      function createBurst() {
        if (!isActive) return;
        const w = canvas.width;
        const h = canvas.height;
        const count = 8 + Math.floor(Math.random() * 8);
        for (let i = 0; i < count; i++) {
          const x = 20 + Math.random() * (w - 40);
          const y = 20 + Math.random() * (h - 40);
          setTimeout(() => {
            createRipple(x, y);
          }, i * 100);
        }
        status.textContent = `💥 Burst of ${count} ripples!`;
        setTimeout(() => {
          status.textContent = '🌈 Click anywhere to create rainbow ripples';
        }, 1500);
      }

      // ----- Clear ripples -----
      function clearRipples() {
        ripples = [];
        rippleCount.textContent = '✦ 0 ripples';
        status.textContent = '🗑️ Ripples cleared';
        setTimeout(() => {
          status.textContent = '🌈 Click anywhere to create rainbow ripples';
        }, 1000);
      }

      // ----- Toggle -----
      function toggleRipples() {
        isActive = !isActive;
        toggleBtn.textContent = isActive ? '💡 Toggle' : '💡 Off';
        rippleStatus.textContent = isActive ? '🌈 Active' : '🌑 Inactive';
        status.textContent = isActive ? '🌈 Ripples active' : '🌑 Ripples paused';
      }

      // ----- Reset -----
      function resetRipples() {
        ripples = [];
        isActive = true;
        toggleBtn.textContent = '💡 Toggle';
        rippleStatus.textContent = '🌈 Active';
        rippleCount.textContent = '✦ 0 ripples';
        speedSlider.value = 5;
        speedValue.textContent = '5×';
        sizeSlider.value = 60;
        sizeValue.textContent = '60%';
        ringSlider.value = 6;
        ringValue.textContent = '6';
        opacitySlider.value = 60;
        opacityValue.textContent = '60%';
        status.textContent = '↺ Reset';
        setTimeout(() => {
          status.textContent = '🌈 Click anywhere to create rainbow ripples';
        }, 500);
      }

      // ----- Draw -----
      function draw() {
        const w = canvas.width;
        const h = canvas.height;
        const cx = w / 2;
        const cy = h / 2;

        // Clear
        ctx.clearRect(0, 0, w, h);

        // Background with subtle gradient
        const bgGradient = ctx.createRadialGradient(cx, cy, 0, cx, cy, w * 0.8);
        bgGradient.addColorStop(0, '#0a0a1a');
        bgGradient.addColorStop(0.5, '#060612');
        bgGradient.addColorStop(1, '#020208');
        ctx.fillStyle = bgGradient;
        ctx.fillRect(0, 0, w, h);

        // Draw ripples
        if (isActive) {
          ripples = ripples.filter(r => r.alive);
          ripples.forEach(r => r.update());
        }
        ripples.forEach(r => r.draw(ctx));

        // Update count
        rippleCount.textContent = `✦ ${ripples.length} ripples`;
      }

      // ----- Animation loop -----
      function animate() {
        time += 0.016;
        draw();
        animationId = requestAnimationFrame(animate);
      }

      // ----- Start animation -----
      function startAnimation() {
        if (animationId) {
          cancelAnimationFrame(animationId);
        }
        animate();
      }

      // ----- Event Listeners -----
      // Mouse clicks
      canvas.addEventListener('click', (e) => {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        const x = (e.clientX - rect.left) * scaleX;
        const y = (e.clientY - rect.top) * scaleY;
        createRipple(x, y);
      });

      // Touch support
      canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        const touch = e.touches[0];
        const x = (touch.clientX - rect.left) * scaleX;
        const y = (touch.clientY - rect.top) * scaleY;
        createRipple(x, y);
      });

      // Buttons
      toggleBtn.addEventListener('click', toggleRipples);
      clearBtn.addEventListener('click', clearRipples);
      burstBtn.addEventListener('click', createBurst);
      resetBtn.addEventListener('click', resetRipples);

      // Sliders
      speedSlider.addEventListener('input', (e) => {
        speedValue.textContent = e.target.value + '×';
        // Update existing ripples' speed
        ripples.forEach(r => {
          r.speed = 0.5 + parseInt(e.target.value) * 0.15;
        });
      });

      sizeSlider.addEventListener('input', (e) => {
        sizeValue.textContent = e.target.value + '%';
      });

      ringSlider.addEventListener('input', (e) => {
        ringValue.textContent = e.target.value;
      });

      opacitySlider.addEventListener('input', (e) => {
        opacityValue.textContent = e.target.value + '%';
        ripples.forEach(r => {
          r.opacity = parseInt(e.target.value) / 100;
        });
      });

      // Keyboard shortcuts
      document.addEventListener('keydown', (e) => {
        if (e.key === 't' || e.key === 'T') {
          e.preventDefault();
          toggleRipples();
        }
        if (e.key === 'c' || e.key === 'C') {
          e.preventDefault();
          clearRipples();
        }
        if (e.key === 'b' || e.key === 'B') {
          e.preventDefault();
          createBurst();
        }
        if (e.key === 'r' || e.key === 'R') {
          e.preventDefault();
          resetRipples();
        }
        if (e.key === ' ' || e.key === 'Space') {
          e.preventDefault();
          toggleRipples();
        }
      });

      // ----- Resize handler -----
      let resizeTimeout;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(() => {
          setupCanvas();
        }, 200);
      });

      // ----- Init -----
      function init() {
        setupCanvas();
        startAnimation();
        status.textContent = '🌈 Click anywhere to create rainbow ripples!';
        // Create initial ripples
        setTimeout(() => {
          const w = canvas.width;
          const h = canvas.height;
          const cx = w / 2;
          const cy = h / 2;
          createRipple(cx - 80, cy);
          setTimeout(() => createRipple(cx, cy - 80), 300);
          setTimeout(() => createRipple(cx + 80, cy), 600);
          setTimeout(() => createRipple(cx, cy + 80), 900);
        }, 500);
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
      <></>
    })();
  </script>
</body>

</html>
