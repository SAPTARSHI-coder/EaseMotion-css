<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Cyberpunk Neon Sci-Fi HUD built with pure HTML and CSS"
  >
  <title>Cyberpunk Neon Sci-Fi HUD</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="hud-container">
    <section class="hud" aria-label="Cyberpunk neon system interface">

      <div class="hud-grid"></div>
      <div class="hud-glow"></div>

      <div class="hud-corner corner-tl"></div>
      <div class="hud-corner corner-tr"></div>
      <div class="hud-corner corner-bl"></div>
      <div class="hud-corner corner-br"></div>

      <header class="hud-header">
        <span>SYS://NEON-702</span>
        <span class="status">● SYSTEM ONLINE</span>
      </header>

      <div class="hud-main">

        <div class="target-ring">
          <div class="ring ring-one"></div>
          <div class="ring ring-two"></div>
          <div class="ring ring-three"></div>
          <div class="target-core">702</div>
        </div>

        <div class="hud-info">
          <p class="eyebrow">CYBERNETIC INTERFACE</p>

          <h1>
            CYBER
            <span>NEON</span>
          </h1>

          <p class="description">
            A futuristic cyberpunk HUD interface powered entirely by
            HTML and Vanilla CSS.
          </p>

          <div class="stats">
            <div class="stat">
              <span>POWER</span>
              <strong>98%</strong>
            </div>

            <div class="stat">
              <span>ENERGY</span>
              <strong>87%</strong>
            </div>

            <div class="stat">
              <span>STATUS</span>
              <strong>ACTIVE</strong>
            </div>
          </div>
        </div>

      </div>

      <footer class="hud-footer">
        <span>SECURE CHANNEL</span>
        <span>PURE CSS // NO JS</span>
      </footer>

    </section>
  </main>

</body>
</html>
