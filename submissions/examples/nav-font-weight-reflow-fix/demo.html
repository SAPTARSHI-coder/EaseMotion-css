<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EaseMotion CSS Sandbox — Nav Font Weight Reflow Fix</title>
  
  <!-- Relative path loading your sandbox style context cleanly -->
  <link rel="stylesheet" href="./style.css">
  
  <style>
    body {
      background-color: #0b1121;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 1.5rem;
    }
  </style>
</head>
<body>

  <header style="margin-bottom: 2rem; text-align: center; max-width: 480px;">
    <h1 style="color: white; margin: 0; font-size: 1.5rem; font-weight: 700;">Nav Font Weight Reflow Canvas</h1>
    <p style="color: #64748b; margin: 4px 0 0 0; font-size: 0.875rem; line-height: 1.5;">Hover over the navigation items below. Pre-reserving glyph advance widths via <code>attr(data-text)</code> eliminates horizontal layout shifts with 0 scripts.</p>
  </header>

  <!-- Sandbox Active Stage Envelope -->
  <div class="alm-sandbox-stage">
    
    <!-- NAVIGATION BAR -->
    <nav class="alm-navbar-container">
      <span class="alm-card-tag">[Zero_Reflow_Nav]</span>

      <ul class="alm-nav-list">
        <li>
          <a href="#" class="alm-nav-link active" data-text="Dashboard">Dashboard</a>
        </li>
        <li>
          <a href="#" class="alm-nav-link" data-text="Telemetry">Telemetry</a>
        </li>
        <li>
          <a href="#" class="alm-nav-link" data-text="Analytics">Analytics</a>
        </li>
        <li>
          <a href="#" class="alm-nav-link" data-text="Settings">Settings</a>
        </li>
      </ul>
    </nav>

  </div>

</body>
</html>
