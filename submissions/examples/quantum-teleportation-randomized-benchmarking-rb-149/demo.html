<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Randomized Benchmarking RB - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css"></head><body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030712; color: #ffffff;">

    <div class="ease-card ease-card-glass rb-container">
        <div class="rb-header">
            <h2>Randomized Benchmarking</h2>
            <span class="ease-badge ease-badge-primary">Quantum Characterization</span>
        </div>
        
        <div class="rb-screen ease-center">
            <div class="rb-flux flux-rb-a"></div>
            <div class="rb-flux flux-rb-b"></div>
            <div class="rb-boundary-ring"></div>
            <div class="rb-core ease-center"></div>
        </div>

        <div class="rb-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Clifford Sequences &amp; Fidelity Decay</span>
            <button class="ease-btn ease-btn-primary ease-btn-sm ease-hover-grow">Run Benchmark</button>
        </div>
    </div></body></html>
