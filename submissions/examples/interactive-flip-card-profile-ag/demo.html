<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Flip Card Profile</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="flip-card">
        <div class="flip-card-inner">
            <!-- Front of the card -->
            <div class="flip-card-front">
                <img src="https://picsum.photos/250/250?random=10" alt="Avatar" class="avatar">
                <h2>Jane Doe</h2>
                <p>Frontend Developer</p>
                <div class="hint">Hover to flip <span>&rarr;</span></div>
            </div>
            <!-- Back of the card -->
            <div class="flip-card-back">
                <h2>About Me</h2>
                <p>I love building beautiful interfaces purely with CSS. No JS needed!</p>
                <div class="socials">
                    <span class="social-icon">GH</span>
                    <span class="social-icon">LI</span>
                    <span class="social-icon">TW</span>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
