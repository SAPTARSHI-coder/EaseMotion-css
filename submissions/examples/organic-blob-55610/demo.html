<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organic Morphing Blob Demo</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            margin: 0;
            height: 100vh;
            background-color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .avatar {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <div class="ease-blob-container">
        <!-- The Background Blob -->
        <div class="ease-blob"></div>
        
        <!-- The Content inside/over the blob -->
        <div class="ease-blob-content">
            <img src="https://ui-avatars.com/api/?name=User&background=fff&color=6366f1&size=200" alt="Avatar" class="avatar">
        </div>
    </div>
</body>
</html>
