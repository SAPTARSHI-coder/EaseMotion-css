<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skew-Active Card Grid - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="em-container">
    <header class="em-header">
      <h1>EaseMotion CSS</h1>
      <p>Skew-Active Card Grid - E-Commerce Showcase</p>
    </header>

    <main class="em-grid-wrapper">
      <div class="em-card-grid">
        <!-- Card 1 -->
        <article class="em-card" tabindex="0">
          <div class="em-card-image" style="--bg-color: #ff9a9e; --bg-color-alt: #fecfef;"></div>
          <div class="em-card-content">
            <h2 class="em-card-title">Aura Sneakers</h2>
            <p class="em-card-price">$129.00</p>
            <button class="em-card-btn">Add to Cart</button>
          </div>
        </article>

        <!-- Card 2 -->
        <article class="em-card" tabindex="0">
          <div class="em-card-image" style="--bg-color: #a18cd1; --bg-color-alt: #fbc2eb;"></div>
          <div class="em-card-content">
            <h2 class="em-card-title">Nova Smartwatch</h2>
            <p class="em-card-price">$199.00</p>
            <button class="em-card-btn">Add to Cart</button>
          </div>
        </article>

        <!-- Card 3 -->
        <article class="em-card" tabindex="0">
          <div class="em-card-image" style="--bg-color: #84fab0; --bg-color-alt: #8fd3f4;"></div>
          <div class="em-card-content">
            <h2 class="em-card-title">Echo Headphones</h2>
            <p class="em-card-price">$159.00</p>
            <button class="em-card-btn">Add to Cart</button>
          </div>
        </article>
        
        <!-- Card 4 -->
        <article class="em-card" tabindex="0">
          <div class="em-card-image" style="--bg-color: #fccb90; --bg-color-alt: #d57eeb;"></div>
          <div class="em-card-content">
            <h2 class="em-card-title">Lumina Backpack</h2>
            <p class="em-card-price">$89.00</p>
            <button class="em-card-btn">Add to Cart</button>
          </div>
        </article>
      </div>
    </main>
  </div>
</body>
</html>
