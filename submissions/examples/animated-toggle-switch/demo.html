
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Animated Toggle Switch Demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="demo-wrap">
    <div class="row">
      <span>Dark mode</span>
      <label class="switch">
        <input type="checkbox">
        <span class="switch-track"><span class="switch-thumb"></span></span>
      </label>
    </div>
    <div class="row">
      <span>Email notifications</span>
      <label class="switch">
        <input type="checkbox" checked>
        <span class="switch-track"><span class="switch-thumb"></span></span>
      </label>
    </div>
  </div>
</body>
</html>
