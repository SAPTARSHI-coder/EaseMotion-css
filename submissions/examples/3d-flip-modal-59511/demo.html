<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 3D-Flip Modal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>SaaS Showcase</h1>
            <p>Experience the 3D-Flip Modal</p>
        </header>

        <main class="main-content">
            <input type="checkbox" id="modal-toggle" class="modal-toggle">
            <label for="modal-toggle" class="btn btn-primary">Open 3D-Flip Modal</label>

            <div class="modal-wrapper">
                <label for="modal-toggle" class="modal-overlay"></label>
                <div class="modal">
                    <div class="modal-header">
                        <h2>Upgrade to Pro</h2>
                        <label for="modal-toggle" class="btn-close">&times;</label>
                    </div>
                    <div class="modal-body">
                        <p>Unlock advanced features, premium support, and exclusive access with our Pro plan. Elevate your workflow to the next dimension.</p>
                        <ul class="feature-list">
                            <li>✨ Unlimited Projects</li>
                            <li>🚀 Priority Rendering</li>
                            <li>🔒 Advanced Security</li>
                        </ul>
                    </div>
                    <div class="modal-footer">
                        <label for="modal-toggle" class="btn btn-secondary">Cancel</label>
                        <button class="btn btn-primary">Upgrade Now</button>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
