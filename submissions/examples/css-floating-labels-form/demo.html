<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Floating Labels Form - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="em-float-page">
        <div class="em-card" role="region" aria-label="Floating Labels Form Showcase">
            <span class="em-card-badge">INPUT PATTERNS</span>
            <h1 class="em-card-title">Floating Labels Form</h1>
            <p class="em-card-desc">Modern input fields with smooth floating label animations and built-in validation styling, crafted entirely with pure CSS.</p>
            
            <!-- Floating Labels Form -->
            <form class="em-float-form" novalidate>
                <div class="em-input-group">
                    <input type="text" id="fullname" class="em-float-input" placeholder=" " required>
                    <label for="fullname" class="em-float-label">Full Name</label>
                </div>

                <div class="em-input-group">
                    <input type="email" id="email" class="em-float-input" placeholder=" " required>
                    <label for="email" class="em-float-label">Email Address</label>
                </div>

                <div class="em-input-group">
                    <textarea id="message" class="em-float-input em-textarea" placeholder=" " required></textarea>
                    <label for="message" class="em-float-label">Your Message</label>
                </div>

                <button type="submit" class="em-card-btn" role="button">Send Message</button>
            </form>
        </div>
    </div>
</body>
</html>
