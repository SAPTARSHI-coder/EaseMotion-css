<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Sci-Fi HUD: Solar Flare Radial</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Ambient background glow -->
    <div class="void-bg"></div>

    <div class="hud-container">
        
        <!-- 
          [TECHNIQUE] The Solar HUD
          Heavily relies on radial-gradients, conic-gradients, and overlapping
          circular elements to create a stellar navigation UI.
        -->
        <div class="hud-layout">
            
            <header class="hud-header">
                <div class="header-line left-line"></div>
                <div class="title-box">
                    <h1 class="stellar-title">STELLAR NAVIGATOR</h1>
                    <div class="subtitle">HELIOS SYSTEM | SECTOR 7G</div>
                </div>
                <div class="header-line right-line"></div>
            </header>

            <main class="hud-main">
                
                <!-- Left Panel: Orbital Data -->
                <aside class="side-panel left-panel">
                    <div class="data-ring-container">
                        <svg class="data-ring-svg" viewBox="0 0 100 100">
                            <!-- SVG used only for the curved text path, all styling is CSS -->
                            <path id="curve-left" d="M 50, 90 A 40, 40 0 1, 1 50, 10" fill="transparent" />
                            <text class="ring-text"><textPath href="#curve-left" startOffset="50%" text-anchor="middle">SOLAR FLUX DENSITY</textPath></text>
                        </svg>
                        
                        <div class="stat-value text-orange">4.2<small>e</small>W</div>
                        
                        <!-- Conic gradient progress ring -->
                        <div class="radial-progress flux-progress">
                            <div class="radial-inner"></div>
                        </div>
                    </div>

                    <div class="telemetry-box mt-4">
                        <div class="tel-row">
                            <span>CORONA TEMP</span>
                            <span class="text-yellow">5,800 K</span>
                        </div>
                        <div class="tel-row">
                            <span>PLASMA VEL</span>
                            <span class="text-orange">400 km/s</span>
                        </div>
                        <div class="tel-row">
                            <span>MAGNETIC</span>
                            <span class="text-red">UNSTABLE</span>
                        </div>
                    </div>
                </aside>

                <!-- Center Display: The Sun -->
                <section class="center-display">
                    
                    <div class="solar-system">
                        
                        <!-- Outer Orbital Rings -->
                        <div class="orbit-ring ring-1"></div>
                        <div class="orbit-ring ring-2">
                            <!-- Orbiting object -->
                            <div class="satellite"></div>
                        </div>
                        
                        <!-- The Sun Core -->
                        <div class="sun-core">
                            <!-- Multiple layered radial gradients to create the burning effect -->
                            <div class="sun-layer base"></div>
                            <div class="sun-layer plasma"></div>
                            <div class="sun-layer flare"></div>
                            
                            <!-- Erupting prominences -->
                            <div class="prominence p1"></div>
                            <div class="prominence p2"></div>
                            
                            <!-- Central readout -->
                            <div class="core-readout">
                                <span class="blink">FUSION ACTIVE</span>
                            </div>
                        </div>
                        
                    </div>
                    
                </section>

                <!-- Right Panel: Navigation -->
                <aside class="side-panel right-panel">
                    <div class="data-ring-container">
                        <svg class="data-ring-svg" viewBox="0 0 100 100">
                            <path id="curve-right" d="M 50, 10 A 40, 40 0 1, 1 50, 90" fill="transparent" />
                            <text class="ring-text"><textPath href="#curve-right" startOffset="50%" text-anchor="middle">SHIELD INTEGRITY</textPath></text>
                        </svg>
                        
                        <div class="stat-value text-yellow">87<small>%</small></div>
                        
                        <div class="radial-progress shield-progress">
                            <div class="radial-inner"></div>
                        </div>
                    </div>

                    <!-- Sector Grid -->
                    <div class="sector-grid mt-4">
                        <div class="grid-cell"></div>
                        <div class="grid-cell active blink"></div>
                        <div class="grid-cell"></div>
                        <div class="grid-cell"></div>
                        <div class="grid-cell danger"></div>
                        <div class="grid-cell"></div>
                        <div class="grid-cell"></div>
                        <div class="grid-cell"></div>
                        <div class="grid-cell"></div>
                    </div>
                    
                    <button class="flare-btn mt-auto">
                        INITIATE JUMP
                    </button>
                </aside>
                
            </main>
            
        </div>
        
    </div>

</body>
</html>
