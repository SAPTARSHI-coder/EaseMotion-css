<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lightbox Gallery | EaseMotion CSS</title><link rel="stylesheet" href="style.css"></head><body><div class="lbg-root"><h2 class="lbg-title">Photo Gallery</h2><div class="lbg-grid"><div class="lbg-thumb" onclick="openLbg(1)"><div class="lbg-t1"></div></div><div class="lbg-thumb" onclick="openLbg(2)"><div class="lbg-t2"></div></div><div class="lbg-thumb" onclick="openLbg(3)"><div class="lbg-t3"></div></div><div class="lbg-thumb" onclick="openLbg(4)"><div class="lbg-t4"></div></div><div class="lbg-thumb" onclick="openLbg(5)"><div class="lbg-t5"></div></div><div class="lbg-thumb" onclick="openLbg(6)"><div class="lbg-t6"></div></div></div></div><div class="lbg-overlay" id="lbgOverlay" onclick="closeLbg()"><button class="lbg-close" type="button">&times;</button><div class="lbg-large" id="lbgImg"></div></div><script>const colors=['#1e3a5f,#6366f1','#2d1b69,#ec4899','#1a3a2d,#10b981','#3a1e1e,#f59e0b','#1e3a5f,#818cf8','#2d1b69,#f472b6'];function openLbg(n){document.getElementById('lbgImg').style.background=`linear-gradient(135deg,${colors[n-1]})`;document.getElementById('lbgOverlay').classList.add('open')}function closeLbg(){document.getElementById('lbgOverlay').classList.remove('open')}</script></body></html>
