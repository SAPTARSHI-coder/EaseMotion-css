<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pricing Toggle</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<main class="pricing-demo">
  <section class="pricing-card">
    <p class="label">Plan picker</p><h1>Choose a billing rhythm.</h1>
    <label class="switch-row"><span>Monthly</span><input class="billing-toggle" type="checkbox" /><span class="switch"><i></i></span><span>Yearly</span></label>
    <div class="price-wrap"><p class="monthly"><strong>$19</strong><span>/ month</span></p><p class="yearly"><strong>$190</strong><span>/ year</span></p></div>
    <ul><li>Motion-ready components</li><li>Accessible examples</li><li>Reusable CSS tokens</li></ul>
    <button>Select plan</button>
  </section>
</main>
</body>
</html>
