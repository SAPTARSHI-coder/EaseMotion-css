<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="3D Perspective Tilt dashboard widget built with pure HTML and Vanilla CSS."
  >
  <title>3D Perspective Tilt Widget</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">
    <section class="widget" aria-labelledby="widget-title">

      <div class="ambient ambient-one" aria-hidden="true"></div>
      <div class="ambient ambient-two" aria-hidden="true"></div>

      <header class="widget-header">
        <div>
          <p class="eyebrow">SPATIAL ANALYTICS</p>
          <h1 id="widget-title">3D Performance</h1>
        </div>

        <span class="live-status">
          <span aria-hidden="true"></span>
          LIVE
        </span>
      </header>

      <div class="tilt-stage">
        <div class="tilt-card">

          <div class="card-grid" aria-hidden="true"></div>
          <div class="card-shine" aria-hidden="true"></div>

          <div class="depth depth-back" aria-hidden="true"></div>
          <div class="depth depth-front" aria-hidden="true"></div>

          <div class="card-content">
            <div class="card-top">
              <span class="card-label">SYSTEM LOAD</span>
              <span class="card-index">03D</span>
            </div>

            <div class="score">
              <strong>84</strong>
              <span>%</span>
            </div>

            <div class="score-caption">
              Optimal performance
            </div>

            <div class="mini-bars" aria-hidden="true">
              <span style="--bar: 45%"></span>
              <span style="--bar: 68%"></span>
              <span style="--bar: 58%"></span>
              <span style="--bar: 82%"></span>
              <span style="--bar: 73%"></span>
              <span style="--bar: 94%"></span>
              <span style="--bar: 84%"></span>
            </div>
          </div>
        </div>
      </div>

      <div class="metric-row">
        <div class="metric">
          <span>Processing</span>
          <strong>94.8%</strong>
        </div>

        <div class="metric">
          <span>Latency</span>
          <strong>18ms</strong>
        </div>

        <div class="metric">
          <span>Stability</span>
          <strong>99.2%</strong>
        </div>
      </div>

      <div class="performance">
        <div class="performance-heading">
          <span>Performance Index</span>
          <strong>84 / 100</strong>
        </div>

        <div class="progress" aria-label="Performance index 84 percent">
          <span></span>
        </div>
      </div>

      <button class="action" type="button">
        <span>View Performance</span>
        <span aria-hidden="true">↗</span>
      </button>

    </section>
  </main>

</body>
</html>
