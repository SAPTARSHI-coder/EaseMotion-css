<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 3D Effect: Morphing Shape</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="layout-container">
        
        <header class="section-header">
            <h1 class="title">Pure CSS 3D: Morphing Shape</h1>
            <p class="subtitle">A hardware-accelerated, JavaScript-free 3D animation utilizing `transform-style: preserve-3d` and complex, multi-axis `border-radius` animations to simulate a fluid, morphing 3D object.</p>
        </header>

        <div class="demo-area">
            
            <!-- 
              [TECHNIQUE] The 3D Scene
              The wrapper establishes the perspective, allowing child elements
              to be transformed in 3D space.
            -->
            <div class="scene-3d">
                
                <!-- 
                  The primary rotating container. 
                  It uses preserve-3d to ensure its children maintain their 3D positions.
                -->
                <div class="object-3d">
                    
                    <!-- 
                      The Morphing Planes
                      By stacking multiple planes with complex, shifting border-radii 
                      and rotating them slightly on different axes, we create the 
                      illusion of a single, continuous 3D volumetric blob.
                    -->
                    <div class="morph-plane plane-x"></div>
                    <div class="morph-plane plane-y"></div>
                    <div class="morph-plane plane-z"></div>
                    
                    <!-- Inner Core -->
                    <div class="morph-core">
                        <div class="icon-fluid">
                            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"></path>
                            </svg>
                        </div>
                    </div>
                    
                </div>
                
            </div>
            
        </div>
        
    </div>

</body>
</html>
