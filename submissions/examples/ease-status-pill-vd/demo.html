<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ease Status Pill</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <div class="status-pill online">
        <span class="dot"></span>
        Online
    </div>

    <div class="status-pill away">
        <span class="dot"></span>
        Away
    </div>

    <div class="status-pill busy">
        <span class="dot"></span>
        Busy
    </div>

    <div class="status-pill offline">
        <span class="dot"></span>
        Offline
    </div>

</div>

</body>
</html>
