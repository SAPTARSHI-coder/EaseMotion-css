<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Piano Jack Escapement — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Piano Jack Escapement demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Piano Jack Escapement</h1>
      <p class="lede">Piano jack escapement letting the hammer fly free</p>
    </header>

    <section class="ease-piano-jack-escapement" data-demo="piano-jack-escapement" aria-live="polite">
      <div class="ease-piano-jack-escapement__housing">
        <div class="ease-piano-jack-escapement__bezel">
          <div class="ease-piano-jack-escapement__face">
            <div class="ease-piano-jack-escapement__readout">
              <span class="ease-piano-jack-escapement__label">Piano Jack Escapement</span>
              <span class="ease-piano-jack-escapement__value">LIVE</span>
            </div>
            <div class="ease-piano-jack-escapement__motion" aria-hidden="true">
              <span class="ease-piano-jack-escapement__a"></span>
              <span class="ease-piano-jack-escapement__b"></span>
              <span class="ease-piano-jack-escapement__c"></span>
              <span class="ease-piano-jack-escapement__d"></span>
            </div>
            <div class="ease-piano-jack-escapement__meters">
              <i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-piano-jack-escapement__controls">
          <button type="button" class="ease-piano-jack-escapement__btn primary">Strike</button>
          <button type="button" class="ease-piano-jack-escapement__btn">Rest</button>
          <label class="ease-piano-jack-escapement__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-piano-jack-escapement__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
