<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Pure CSS Bouncing Spring Dropdown"
  >
  <title>Bouncing Spring Dropdown</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="page">
    <section class="demo">
      <span class="label">CSS DROPDOWN</span>

      <h1>Bouncing Spring</h1>

      <p class="intro">
        A playful dropdown interaction powered entirely by HTML and CSS.
      </p>

      <details class="spring-dropdown">
        <summary>
          <span>Explore options</span>
          <span class="arrow" aria-hidden="true"></span>
        </summary>

        <div class="dropdown-panel">
          <a href="#profile">
            <span class="item-icon">01</span>
            <span>
              <strong>Profile</strong>
              <small>View your profile</small>
            </span>
          </a>

          <a href="#projects">
            <span class="item-icon">02</span>
            <span>
              <strong>Projects</strong>
              <small>Browse your projects</small>
            </span>
          </a>

          <a href="#settings">
            <span class="item-icon">03</span>
            <span>
              <strong>Settings</strong>
              <small>Manage preferences</small>
            </span>
          </a>

          <a href="#help">
            <span class="item-icon">04</span>
            <span>
              <strong>Help Center</strong>
              <small>Find useful information</small>
            </span>
          </a>
        </div>
      </details>
    </section>
  </main>
</body>
</html>
