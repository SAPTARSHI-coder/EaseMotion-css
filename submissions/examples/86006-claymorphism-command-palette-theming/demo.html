<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claymorphism Command Palette</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">
    <section class="palette" aria-labelledby="palette-title">

      <header class="palette-header">
        <div>
          <p class="eyebrow">CLAY UI</p>
          <h1 id="palette-title">Command Palette</h1>
          <p class="subtitle">
            Quickly access common application commands.
          </p>
        </div>

        <kbd class="shortcut">Ctrl K</kbd>
      </header>

      <div class="search-area">
        <label for="command-search">Search commands</label>

        <div class="search-box">
          <span aria-hidden="true">⌕</span>
          <input
            id="command-search"
            type="search"
            placeholder="Search commands..."
            autocomplete="off"
          >
        </div>
      </div>

      <div class="command-list" aria-label="Available commands">

        <button class="command" type="button">
          <span class="command-icon" aria-hidden="true">+</span>

          <span class="command-info">
            <strong>Create Project</strong>
            <small>Start a new project</small>
          </span>

          <kbd>⌘ N</kbd>
        </button>

        <button class="command" type="button">
          <span class="command-icon" aria-hidden="true">↗</span>

          <span class="command-info">
            <strong>Open Dashboard</strong>
            <small>View your project overview</small>
          </span>

          <kbd>⌘ D</kbd>
        </button>

        <button class="command" type="button">
          <span class="command-icon" aria-hidden="true">⚙</span>

          <span class="command-info">
            <strong>Settings</strong>
            <small>Manage application preferences</small>
          </span>

          <kbd>⌘ ,</kbd>
        </button>

        <button class="command" type="button">
          <span class="command-icon" aria-hidden="true">?</span>

          <span class="command-info">
            <strong>Help Center</strong>
            <small>Browse documentation and support</small>
          </span>

          <kbd>?</kbd>
        </button>

      </div>

      <footer class="palette-footer">
        <span><kbd>Tab</kbd> Navigate</span>
        <span><kbd>Enter</kbd> Select</span>
        <span><kbd>Esc</kbd> Close</span>
      </footer>

    </section>
  </main>

</body>
</html>
