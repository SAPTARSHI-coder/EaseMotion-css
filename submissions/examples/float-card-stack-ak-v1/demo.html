<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stacked Cards Fan Out — EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <p class="label">Pure CSS Stacked Cards Hover Fan-Out Effect</p>

  <div class="ease-card-stack">
    <!-- Card 1 (Top) -->
    <div class="ease-card-stack-item">
      <span class="ease-card-stack-title">🎨 Design Tokens</span>
      <span class="ease-card-stack-subtitle">Card 01 / 03</span>
    </div>

    <!-- Card 2 (Middle) -->
    <div class="ease-card-stack-item">
      <span class="ease-card-stack-title">⚡ Motion Physics</span>
      <span class="ease-card-stack-subtitle">Card 02 / 03</span>
    </div>

    <!-- Card 3 (Bottom) -->
    <div class="ease-card-stack-item">
      <span class="ease-card-stack-title">📦 Zero Dependencies</span>
      <span class="ease-card-stack-subtitle">Card 03 / 03</span>
    </div>
  </div>

</body>
</html>
