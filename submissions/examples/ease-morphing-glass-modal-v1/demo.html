<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ease Morphing Floating Glass Modal</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="modal-body">
  <button class="morph-btn" id="mBtn">Open Glass Modal</button>
  <div class="morph-modal" id="mBox">
    <h3>Morphing Glass Dialog</h3>
    <p>Floating button morphs directly into a glass dialog overlay.</p>
    <button id="cBtn">Close</button>
  </div>

  <script>
    const mBtn = document.getElementById('mBtn');
    const mBox = document.getElementById('mBox');
    const cBtn = document.getElementById('cBtn');

    mBtn.addEventListener('click', () => mBox.classList.add('open'));
    cBtn.addEventListener('click', () => mBox.classList.remove('open'));
  </script>
</body>
</html>
