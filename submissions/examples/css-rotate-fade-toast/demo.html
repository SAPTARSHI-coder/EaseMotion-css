<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Rotate-Fade Toast — Gaming Hub</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="ease-container">
    <p class="ease-eyebrow">System Alert</p>
    <h1 class="ease-heading">Ranked Match Found</h1>
    <p class="ease-subtitle">Toggle or view the alert with a rotating icon and smooth entry spin.</p>

    <div class="ease-toast-wrapper">
      <input type="checkbox" id="ease-toast-toggle" class="ease-toast-input" checked />
      
      <label for="ease-toast-toggle" class="ease-trigger-btn">
        Toggle Alert
      </label>

      <div class="ease-toast">
        <div class="ease-icon-box">
          <span class="ease-toast-icon">⚔️</span>
        </div>
        <div class="ease-toast-content">
          <p class="ease-toast-title">Match Ready!</p>
          <p class="ease-toast-message">Competitive Queue • Server: EU West</p>
        </div>
        <label for="ease-toast-toggle" class="ease-toast-close" title="Close">✕</label>
      </div>
    </div>
  </main>
</body>
</html>
