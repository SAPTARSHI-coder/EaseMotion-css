<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Parallax Stacking Cards with Interactive Tilt & Scale Depth</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../easemotion.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>3D Parallax Stacking Cards</h1>
      <p>Click top card to dismiss and advance stack depth.</p>
    </header>

    <main class="stack-stage">
      <div class="card-stack" id="cardStack">
        <div class="stack-card card-1" onclick="dismissCard(this)"><h3>Card 1</h3><p>Click to dismiss</p></div>
        <div class="stack-card card-2"><h3>Card 2</h3><p>Stack depth 2</p></div>
        <div class="stack-card card-3"><h3>Card 3</h3><p>Stack depth 3</p></div>
      </div>
    </main>
  </div>

  <script>
    function dismissCard(card) {
      card.style.transform = 'translateY(-150%) rotate(15deg)';
      card.style.opacity = '0';
      setTimeout(() => {
        card.remove();
      }, 400);
    }
  </script>
</body>
</html>
