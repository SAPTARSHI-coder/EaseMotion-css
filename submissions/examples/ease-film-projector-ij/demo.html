<!-- EaseMotion component: film-projector -->
<!DOCTYPE html>
<html lang="en" data-film="proj">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, viewport-fit=cover, initial-scale=1.0">
<title>Ease Film Projector</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="projector-rig">
  <div class="supply-reel">
    <span class="reel-plate plate-a"></span>
    <span class="reel-core core-a"></span>
  </div>
  <div class="projector-body">
    <div class="lens-housing">
      <span class="lens-glass"></span>
    </div>
    <div class="beam-cone"></div>
    <div class="vent-block">
      <i class="vent-slot vs-1"></i>
      <i class="vent-slot vs-2"></i>
      <i class="vent-slot vs-3"></i>
    </div>
  </div>
  <div class="takeup-reel">
    <span class="reel-plate plate-b"></span>
    <span class="reel-core core-b"></span>
  </div>
  <div class="projector-base">
    <span class="base-tag">16MM</span>
  </div>
</main>
</body>
</html>
