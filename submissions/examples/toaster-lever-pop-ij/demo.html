<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-toaster-lever-pop demo</title>
</head>
<body>
<div class="ts-app">
  <span class="ts-title">TOASTER</span>
  <div class="ts-body">
    <span class="ts-slot ts-slot-1"></span>
    <span class="ts-slot ts-slot-2"></span>
    <span class="ts-toast ts-toast-1"></span>
    <span class="ts-toast ts-toast-2"></span>
    <span class="ts-coil ts-coil-1"></span>
    <span class="ts-coil ts-coil-2"></span>
    <span class="ts-dial"></span>
  </div>
  <div class="ts-lever">
    <span class="ts-knob"></span>
  </div>
</div>
</body>
</html>
