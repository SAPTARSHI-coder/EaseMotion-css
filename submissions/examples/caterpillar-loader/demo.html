<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="A pure CSS segmented caterpillar loader crawling across a progress track."
  >
  <title>CSS Caterpillar Loader</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="loader-demo">
    <header class="demo-header">
      <p class="eyebrow">EaseMotion CSS</p>
      <h1>Caterpillar Loader</h1>
      <p>
        A segmented caterpillar crawls across a responsive progress track.
      </p>
    </header>

    <section
      class="loader-card"
      aria-label="Loading content"
    >
      <div
        class="loader"
        role="progressbar"
        aria-label="Loading"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuetext="Loading"
      >
        <div class="track">
          <div class="progress"></div>

          <div class="caterpillar" aria-hidden="true">
            <span class="segment head">
              <span class="eye eye-left"></span>
              <span class="eye eye-right"></span>
            </span>

            <span class="segment"></span>
            <span class="segment"></span>
            <span class="segment"></span>
            <span class="segment"></span>
            <span class="segment tail"></span>
          </div>
        </div>
      </div>

      <div class="loader-status" aria-live="polite">
        <span>Loading</span>
        <span class="dots" aria-hidden="true">...</span>
      </div>
    </section>

    <p class="hint">
      Pure CSS · Responsive · Reduced-motion friendly
    </p>
  </main>
</body>
</html>
