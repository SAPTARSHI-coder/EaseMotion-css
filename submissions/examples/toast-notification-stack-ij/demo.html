<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-toast-notification-stack demo</title>
</head>
<body>
<div class="ts-app">
  <span class="ts-header">NOTIFICATIONS</span>
  <div class="ts-stack">
    <div class="ts-toast ts-toast-1">
      <span class="ts-icon">&#9888;</span>
      <span class="ts-title">Storage warning</span>
      <span class="ts-msg">90% of quota used</span>
      <span class="ts-close">&#10005;</span>
    </div>
    <div class="ts-toast ts-toast-2">
      <span class="ts-icon">&#9993;</span>
      <span class="ts-title">New message</span>
      <span class="ts-msg">You have 1 unread</span>
      <span class="ts-close">&#10005;</span>
    </div>
    <div class="ts-toast ts-toast-3">
      <span class="ts-icon">&#10004;</span>
      <span class="ts-title">Sync complete</span>
      <span class="ts-msg">3 files updated</span>
      <span class="ts-close">&#10005;</span>
    </div>
  </div>
  <span class="ts-count">3 NEW</span>
</div>
</body>
</html>
