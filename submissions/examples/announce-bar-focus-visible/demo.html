<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Announcement Bar Focus Visible Demo</title>

    <link rel="stylesheet" href="style.css">

    <style>
        body {
            margin: 40px;
            font-family: Arial, sans-serif;
            background: #f8f9fb;
        }

        .ease-announce-bar {
            position: relative;
            padding: 0.75rem 1rem;
            background: #6c63ff;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            border-radius: 8px;
        }

        .ease-announce-bar-content {
            flex: 1;
            text-align: center;
        }

        .ease-announce-bar-content a {
            color: inherit;
            text-decoration: underline;
        }

        .ease-announce-bar-close {
            background: none;
            border: none;
            color: inherit;
            cursor: pointer;
            padding: 0.25rem;
            font-size: 1.1rem;
            line-height: 1;
            opacity: 0.8;
        }

        .ease-announce-bar-close:hover {
            opacity: 1;
        }
    </style>
</head>
<body>

<div class="ease-announce-bar">
    <div class="ease-announce-bar-content">
        New features are available!
        <a href="#">Learn more</a>
    </div>

    <button class="ease-announce-bar-close" aria-label="Dismiss announcement">
        ×
    </button>
</div>

<p>
    Press <strong>Tab</strong> until the close button receives focus to see the
    visible focus indicator.
</p>

</body>
</html>
