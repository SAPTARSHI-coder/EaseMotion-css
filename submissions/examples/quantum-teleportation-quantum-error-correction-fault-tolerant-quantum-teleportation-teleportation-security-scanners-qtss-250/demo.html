<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teleportation Security Scanners QTSS - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css"></head><body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030712; color: #ffffff;">

    <div class="ease-card ease-card-glass qtss-container">
        <div class="qtss-header">
            <h2>Teleportation Security Scanner</h2>
            <span class="ease-badge ease-badge-danger">Fault-Tolerant Quantum</span>
        </div>
        
        <div class="qtss-screen ease-center">
            <div class="qtss-flux flux-qtss-a"></div>
            <div class="qtss-flux flux-qtss-b"></div>
            <div class="qtss-boundary-ring"></div>
            <div class="qtss-core ease-center"></div>
        </div>

        <div class="qtss-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Vulnerability Detection &amp; Entanglement Security Auditing</span>
            <button class="ease-btn ease-btn-danger ease-btn-sm ease-hover-grow">Run Security Scanner</button>
        </div>
    </div></body></html>
