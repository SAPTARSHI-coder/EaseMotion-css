<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fade-In Carousel - E-Commerce Checkout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<section class="checkout-section">

    <h1>Checkout Progress</h1>

    <div class="carousel">

        <div class="card">
            <span>01</span>
            <h2>Shipping Address</h2>
            <p>Add your delivery address for fast shipping.</p>
        </div>

        <div class="card">
            <span>02</span>
            <h2>Payment Method</h2>
            <p>Select secure payment options including UPI and Cards.</p>
        </div>

        <div class="card">
            <span>03</span>
            <h2>Order Summary</h2>
            <p>Review your products before placing the order.</p>
        </div>

    </div>

</section>

</body>
</html>
