<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Score Roll Counter Component - Play Category</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="ease-score-stage" aria-labelledby="stage-title">
    <div style="text-align: center;">
      <p class="ease-score-label" id="stage-title">Current Score</p>
      <!-- Score Display Component -->
      <div class="ease-score-display" id="score-counter" role="timer" aria-live="polite">02450</div>
    </div>

    <button type="button" class="ease-btn-score" id="roll-btn">+500 Points</button>
  </main>

  <script>
    const counter = document.getElementById('score-counter');
    const rollBtn = document.getElementById('roll-btn');
    let currentScore = 2450;

    rollBtn.addEventListener('click', () => {
      currentScore += 500;
      counter.textContent = String(currentScore).padStart(5, '0');
      
      counter.classList.remove('is-rolling');
      void counter.offsetWidth; // Trigger DOM reflow
      counter.classList.add('is-rolling');
    });
  </script>
</body>
</html>
