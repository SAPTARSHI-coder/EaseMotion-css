<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Cascading Variables</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="container">
    <h1>CSS Cascading Variables Demo</h1>
    <p>Each card inherits CSS variables from its parent while overriding selected values.</p>

    <div class="theme-root">
      Root Theme

      <div class="card level-1">
        Level 1 Inheritance

        <div class="card level-2">
          Level 2 Override

          <div class="card level-3">
            Level 3 Override
          </div>

        </div>
      </div>
    </div>
  </div>

</body>
</html>
