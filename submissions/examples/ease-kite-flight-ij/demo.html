<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kite Flight Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="meadow">
    <div class="kite" id="kite" aria-hidden="true">
      <div class="sail"></div>
      <div class="cross"></div>
      <div class="tail"></div>
    </div>
    <p class="hint">A diamond kite bobs on the wind, tail ribbon streaming behind it.</p>
  </main>
</body>
</html>
