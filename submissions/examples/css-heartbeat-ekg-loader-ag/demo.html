<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Heartbeat EKG Loader</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <div class="loader-container" role="status" aria-live="polite" aria-label="Loading system status">
    
    <svg class="ekg-svg" viewBox="0 0 400 100" xmlns="http://www.w3.org/2000/svg">
      <!-- Faint background track -->
      <path class="ekg-track" d="M 0,50 L 120,50 L 140,30 L 150,50 L 165,50 L 180,10 L 200,90 L 210,50 L 230,50 L 250,65 L 265,50 L 400,50" />
      
      <!-- Animated glowing heartbeat pulse -->
      <!-- pathLength="100" normalizes the stroke Math for CSS -->
      <path class="ekg-line" pathLength="100" d="M 0,50 L 120,50 L 140,30 L 150,50 L 165,50 L 180,10 L 200,90 L 210,50 L 230,50 L 250,65 L 265,50 L 400,50" />
    </svg>

    <div class="loading-text">Monitoring Status...</div>

  </div>

</body>
</html>
