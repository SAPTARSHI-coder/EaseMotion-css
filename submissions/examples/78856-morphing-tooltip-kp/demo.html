<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Morphing Tooltip SaaS Modern</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="tooltip-demo" aria-labelledby="tooltip-title">
    <section class="workspace-panel">
      <p class="eyebrow">SaaS modern tooltip</p>
      <h1 id="tooltip-title">Morphing Tooltip</h1>
      <p class="summary">Focus the help control to morph a compact hint into a rich contextual guidance panel.</p>
      <div class="control-row">
        <button class="help-trigger" aria-describedby="morph-tip">
          <span class="pulse-dot"></span>
          Deployment health
        </button>
        <div class="morph-tooltip" id="morph-tip" role="tooltip">
          <span class="meter"><i></i></span>
          <strong>Ready to deploy</strong>
          <small>All checks passed. Traffic will shift gradually across the first five minutes.</small>
          <span class="chips"><b>99.98% uptime</b><b>4 regions</b><b>rollback ready</b></span>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
