<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teleportation Node Monitors QTNM - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css"></head><body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030712; color: #ffffff;">

    <div class="ease-card ease-card-glass qtnm-container">
        <div class="qtnm-header">
            <h2>Teleportation Node Monitor</h2>
            <span class="ease-badge ease-badge-primary">Fault-Tolerant Quantum</span>
        </div>
        
        <div class="qtnm-screen ease-center">
            <div class="qtnm-flux flux-qtnm-a"></div>
            <div class="qtnm-flux flux-qtnm-b"></div>
            <div class="qtnm-boundary-ring"></div>
            <div class="qtnm-core ease-center"></div>
        </div>

        <div class="qtnm-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Inter-Node Connectivity &amp; Status Audit</span>
            <button class="ease-btn ease-btn-primary ease-btn-sm ease-hover-grow">Run Node Monitor</button>
        </div>
    </div></body></html>
