<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Loader Ring - EaseMotion CSS</title>
    <!-- Include EaseMotion Core Stylesheet -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030712; color: #ffffff;">

    <div class="ease-card ease-card-glass loader-container">
        <div class="loader-header">
            <h2>Cyber Loader</h2>
            <span class="ease-badge ease-badge-success">Active</span>
        </div>
        
        <div class="loader-screen ease-center">
            <div class="cyber-ring ring-outer"></div>
            <div class="cyber-ring ring-inner"></div>
            <div class="loader-core ease-center">99%</div>
        </div>

        <div class="loader-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Status: Loading assets</span>
            <button class="ease-btn ease-btn-primary ease-btn-sm ease-hover-grow">Restart</button>
        </div>
    </div>

</body>
</html>
