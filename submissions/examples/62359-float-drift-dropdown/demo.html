<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Float-Drift Dropdown</title>

    <link rel="stylesheet" href="style.css">
</head>


<body>


<div class="container">


    <h1>
        Product Catalog
    </h1>

    <p class="subtitle">
        CSS Float-Drift Dropdown Animation
    </p>



    <div class="dropdown">


        <button class="dropdown-btn">
            Select Product Category
            <span>⌄</span>
        </button>


        <div class="dropdown-menu">


            <div class="item">
                <span>💻</span>
                <div>
                    <h3>Laptops</h3>
                    <p>Smart computing devices</p>
                </div>
            </div>



            <div class="item">
                <span>📱</span>
                <div>
                    <h3>Smartphones</h3>
                    <p>Latest mobile technology</p>
                </div>
            </div>



            <div class="item">
                <span>🎧</span>
                <div>
                    <h3>Accessories</h3>
                    <p>Premium tech gadgets</p>
                </div>
            </div>



            <div class="item">
                <span>⌚</span>
                <div>
                    <h3>Wearables</h3>
                    <p>Modern smart devices</p>
                </div>
            </div>


        </div>


    </div>


</div>



</body>

</html>
