<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EaseMotion Membership Card</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="ease-card-wrapper" role="region" aria-label="Premium Membership Card">
    <div class="ease-premium-card">
      <div class="ease-card-header">
        <div class="ease-card-badge" aria-hidden="true"></div>
        <h2 class="ease-card-title">EaseMotion VIP</h2>
      </div>
      <div class="ease-card-number" aria-label="Card Number">0123 4567 8910 1112</div>
      <div class="ease-card-footer">
        <div>
          <span>Cardholder</span>
          <div class="ease-member-name">Alex Developer</div>
        </div>
        <div>
          <span>Valid Thru</span>
          <div>12/28</div>
        </div>
      </div>
    </div>
  </div>
  <p style="position: absolute; bottom: 2rem; color: #64748b; font-family: system-ui; font-size: 0.875rem; text-align: center;">Hover to tilt in 3D. The sweeping metallic sheen is powered by a pseudo-element and linear-gradient skewing.<br>Zero images. Zero JavaScript.</p>
</body>
</html>
