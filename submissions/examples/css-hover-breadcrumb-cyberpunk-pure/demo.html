<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hover Breadcrumb: Cyberpunk</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header class="header">
            <h1 class="cyber-title">SYSTEM BREADCRUMBS</h1>
            <p>Hover over the links to activate the cyberpunk data stream.</p>
        </header>

        <main class="content-area">
            
            <nav aria-label="Breadcrumb" class="cyber-breadcrumb-nav">
                <ol class="cyber-breadcrumb">
                    <li class="breadcrumb-item">
                        <a href="#" class="breadcrumb-link" data-text="ROOT">ROOT</a>
                    </li>
                    <li class="breadcrumb-item">
                        <a href="#" class="breadcrumb-link" data-text="MAINFRAME">MAINFRAME</a>
                    </li>
                    <li class="breadcrumb-item">
                        <a href="#" class="breadcrumb-link" data-text="DATABANKS">DATABANKS</a>
                    </li>
                    <li class="breadcrumb-item" aria-current="page">
                        <span class="breadcrumb-current" data-text="SECTOR_7G">SECTOR_7G</span>
                    </li>
                </ol>
            </nav>

        </main>
    </div>

</body>
</html>
