<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animated Slider Thumb</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <h1>Animated Slider Thumb</h1>

    <div class="slider-wrap">
      <label for="volume" class="slider-label">Volume: <span id="volumeValue">40</span>%</label>
      <input type="range" id="volume" class="range" min="0" max="100" value="40">
    </div>
  </main>

  <script>
    const slider = document.getElementById('volume');
    const valueEl = document.getElementById('volumeValue');

    function updateFill() {
      const pct = (slider.value - slider.min) / (slider.max - slider.min) * 100;
      slider.style.setProperty('--fill', pct + '%');
      valueEl.textContent = slider.value;
    }

    slider.addEventListener('input', updateFill);
    slider.addEventListener('mousedown', () => slider.classList.add('is-active'));
    slider.addEventListener('touchstart', () => slider.classList.add('is-active'));
    ['mouseup', 'touchend'].forEach(evt =>
      slider.addEventListener(evt, () => slider.classList.remove('is-active'))
    );

    updateFill();
  </script>
</body>
</html>
