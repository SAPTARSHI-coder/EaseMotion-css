<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Responsive neumorphic loader built using pure HTML and CSS."
    >

    <title>Neumorphic SaaS Loader</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="page">

        <section
            class="loader-card"
            aria-label="Loading content"
        >

            <div class="loader-wrapper" aria-hidden="true">
                <div class="loader-ring">
                    <span class="loader-dot"></span>
                </div>
            </div>

            <div class="loader-content">
                <p class="loader-status">
                    Loading
                    <span class="loading-dots" aria-hidden="true">
                        <span>.</span>
                        <span>.</span>
                        <span>.</span>
                    </span>
                </p>

                <p class="loader-description">
                    Preparing your workspace
                </p>
            </div>

            <div
                class="progress-track"
                role="progressbar"
                aria-label="Loading progress"
                aria-valuemin="0"
                aria-valuemax="100"
            >
                <span class="progress-bar"></span>
            </div>

        </section>

    </main>

</body>
</html>
