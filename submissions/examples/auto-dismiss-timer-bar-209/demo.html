<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Dark mode floating notification toast with auto-dismiss timer.">
  <title>Floating Notification Toast | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="page">
    <section class="showcase" aria-labelledby="title">
      <p class="eyebrow">EASEMOTION COMPONENT</p>
      <h1 id="title">Dark Mode Toast Notification</h1>
      <p class="intro">
        A sleek floating notification with an animated auto-dismiss timer.
      </p>

      <button class="trigger" id="showToast" type="button">
        Show Notification
      </button>
    </section>

    <aside
      class="toast"
      id="toast"
      role="status"
      aria-live="polite"
      aria-hidden="true"
    >
      <div class="toast-icon" aria-hidden="true">✓</div>

      <div class="toast-content">
        <strong>Changes saved</strong>
        <span>Your profile has been updated successfully.</span>
      </div>

      <button
        class="close-button"
        id="closeToast"
        type="button"
        aria-label="Close notification"
      >
        ×
      </button>

      <div class="timer-track">
        <div class="timer-bar"></div>
      </div>
    </aside>
  </main>

  <script src="script.js"></script>
</body>
</html>
