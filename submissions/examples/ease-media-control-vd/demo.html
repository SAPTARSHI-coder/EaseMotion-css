<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ease Media Control</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="media-demo">

    <div class="media-control">
        <button class="media-button play" aria-label="Play">
            ▶
        </button>

        <button class="media-button pause" aria-label="Pause">
            ||
        </button>

        <button class="media-button stop" aria-label="Stop">
            ■
        </button>
    </div>

    <span class="media-label">Media Controls</span>

</div>

</body>
</html>
