<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Skew-Active Progress Bar - EaseMotion CSS</title>
  <!-- Import EaseMotion CSS -->
  <link rel="stylesheet" href="../../../easemotion.css">
  <!-- Component Specific Styles -->
  <link rel="stylesheet" href="style.css">
  <!-- Optional: Google Fonts for a gaming feel -->
  <link href="https://fonts.googleapis.com/css2?family=Teko:wght@400;600&display=swap" rel="stylesheet">
</head>
<body class="gaming-hub-bg">
  
  <div class="demo-container">
    
    <!-- Gaming Player Profile Card -->
    <div class="player-card ease-glass-card">
      <div class="player-header">
        <div class="player-avatar"></div>
        <div class="player-info">
          <h2>PLAYER_ONE</h2>
          <span class="rank-badge">RANK: ONYX</span>
        </div>
      </div>
      
      <!-- Skew-Active Progress Bar Component -->
      <div class="progress-section">
        <div class="progress-labels">
          <span class="progress-title">XP_PROGRESS</span>
          <span class="progress-value">75%</span>
        </div>
        
        <div class="skew-progress-container" role="progressbar" aria-valuenow="75" aria-valuemin="0" aria-valuemax="100">
          <div class="skew-progress-track">
            <!-- Active Fill -->
            <div class="skew-progress-fill" style="--target-width: 75%;">
              <!-- Inner striped pattern for the 'active' effect -->
              <div class="skew-progress-stripes"></div>
            </div>
          </div>
        </div>
      </div>
      
      <!-- Another bar showing an alternative color/state -->
      <div class="progress-section">
        <div class="progress-labels">
          <span class="progress-title">SHIELD_CAPACITY</span>
          <span class="progress-value alert">25%</span>
        </div>
        
        <div class="skew-progress-container alert-state" role="progressbar" aria-valuenow="25" aria-valuemin="0" aria-valuemax="100">
          <div class="skew-progress-track">
            <div class="skew-progress-fill" style="--target-width: 25%;">
              <div class="skew-progress-stripes"></div>
            </div>
          </div>
        </div>
      </div>
      
    </div>
    
  </div>

</body>
</html>
