<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pulse Wave – Energy Pulse Expands Outward</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <h1>🌊 Pulse Wave</h1>
    <p class="subtitle">Energy pulse expands outward</p>

    <div class="pulse-container">
      <div class="pulse-stage" id="pulseStage">
        <canvas id="canvas"></canvas>
        
        <!-- Info overlay -->
        <div class="info-overlay">
          <span class="pulse-status" id="pulseStatus">🌊 Ready</span>
          <span class="wave-count" id="waveCount">✦ 0 waves</span>
        </div>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <button class="ctrl-btn pulse" id="pulseBtn">💥 Pulse</button>
      <button class="ctrl-btn clear" id="clearBtn">🗑️ Clear</button>
      <button class="ctrl-btn toggle" id="toggleBtn">⏸ Pause</button>
      <button class="ctrl-btn reset" id="resetBtn">↺ Reset</button>
    </div>

    <!-- Sliders -->
    <div class="slider-container">
      <span class="slider-label">Pulse Speed</span>
      <input type="range" id="speedSlider" min="1" max="10" value="5" />
      <span class="slider-value" id="speedValue">5×</span>
    </div>

    <div class="slider-container">
      <span class="slider-label">Pulse Size</span>
      <input type="range" id="sizeSlider" min="20" max="100" value="60" />
      <span class="slider-value" id="sizeValue">60%</span>
    </div>

    <div class="slider-container">
      <span class="slider-label">Wave Intensity</span>
      <input type="range" id="intensitySlider" min="0" max="100" value="70" />
      <span class="slider-value" id="intensityValue">70%</span>
    </div>

    <div class="slider-container">
      <span class="slider-label">Color</span>
      <input type="range" id="colorSlider" min="0" max="360" value="220" />
      <span class="slider-value" id="colorValue">220°</span>
    </div>

    <!-- Status -->
    <div class="status" id="status">🌊 Click Pulse to send out an energy wave</div>

    <!-- Keyboard shortcuts -->
    <div class="shortcuts">
      <kbd>P</kbd> Pulse · <kbd>C</kbd> Clear · <kbd>Space</kbd> Pause · <kbd>R</kbd> Reset
    </div>
  </div>

  <script>
    (function() {
      "use strict";

      // DOM elements
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      const pulseStatus = document.getElementById('pulseStatus');
      const waveCount = document.getElementById('waveCount');
      const pulseBtn = document.getElementById('pulseBtn');
      const clearBtn = document.getElementById('clearBtn');
      const toggleBtn = document.getElementById('toggleBtn');
      const resetBtn = document.getElementById('resetBtn');
      const status = document.getElementById('status');
      const speedSlider = document.getElementById('speedSlider');
      const speedValue = document.getElementById('speedValue');
      const sizeSlider = document.getElementById('sizeSlider');
      const sizeValue = document.getElementById('sizeValue');
      const intensitySlider = document.getElementById('intensitySlider');
      const intensityValue = document.getElementById('intensityValue');
      const colorSlider = document.getElementById('colorSlider');
      const colorValue = document.getElementById('colorValue');

      // State
      let waves = [];
      let particles = [];
      let isPaused = false;
      let animationId = null;
      let time = 0;
      let waveCountVal = 0;

      // ----- Canvas setup -----
      function setupCanvas() {
        const rect = canvas.parentElement.getBoundingClientRect();
        const size = Math.min(rect.width - 40, 600);
        canvas.width = size;
        canvas.height = size;
        canvas.style.width = size + 'px';
        canvas.style.height = size + 'px';
      }

      // ----- Wave class -----
      class Wave {
        constructor() {
          const w = canvas.width;
          const h = canvas.height;
          const cx = w / 2;
          const cy = h / 2;
          
          this.x = cx;
          this.y = cy;
          this.radius = 10;
          this.maxRadius = Math.min(w, h) * 0.45 * (parseInt(sizeSlider.value) / 100);
          this.speed = 1 + parseInt(speedSlider.value) * 0.3;
          this.intensity = parseInt(intensitySlider.value) / 100;
          this.hue = parseInt(colorSlider.value);
          this.opacity = 0.7 + 0.3 * this.intensity;
          this.alive = true;
          this.wobble = 0;
          this.wobbleSpeed = 0.02 + Math.random() * 0.03;
          this.wobbleAmount = 1 + Math.random() * 2;
          this.trail = [];
          this.trailLength = 10 + Math.floor(Math.random() * 15);
          this.rings = 3 + Math.floor(this.intensity * 4);
          this.particles = [];
          this.glowSize = 20 + this.intensity * 40;
        }

        update() {
          this.radius += this.speed;
          this.wobble += this.wobbleSpeed;
          
          if (this.radius > this.maxRadius) {
            this.alive = false;
          }

          // Update trail
          const wobbleOffset = Math.sin(this.wobble) * this.wobbleAmount;
          this.trail.push({ 
            x: this.x + wobbleOffset * 0.5, 
            y: this.y + Math.cos(this.wobble * 0.7) * this.wobbleAmount * 0.5,
            radius: this.radius
          });
          if (this.trail.length > this.trailLength) {
            this.trail.shift();
          }

          // Generate particles along the wave
          if (this.radius < this.maxRadius * 0.8 && Math.random() < 0.1 * this.intensity) {
            const angle = Math.random() * Math.PI * 2;
            const r = this.radius * (0.8 + Math.random() * 0.2);
            const x = this.x + Math.cos(angle) * r;
            const y = this.y + Math.sin(angle) * r;
            this.particles.push(new WaveParticle(x, y, this.hue + (Math.random() - 0.5) * 30));
          }
        }

        draw(ctx) {
          const progress = this.radius / this.maxRadius;
          const alpha = this.opacity * (1 - progress * 0.7);

          // Draw glow
          const glowGrad = ctx.createRadialGradient(
            this.x, this.y, 0,
            this.x, this.y, this.radius * 1.2
          );
          glowGrad.addColorStop(0, `hsla(${this.hue + 20}, 100%, 80%, ${alpha * 0.05})`);
          glowGrad.addColorStop(0.5, `hsla(${this.hue + 10}, 100%, 60%, ${alpha * 0.03})`);
          glowGrad.addColorStop(1, `hsla(${this.hue}, 100%, 40%, 0)`);
          ctx.fillStyle = glowGrad;
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.radius * 1.2, 0, Math.PI * 2);
          ctx.fill();

          // Draw wave rings
          for (let i = 0; i < this.rings; i++) {
            const ringRadius = this.radius * (0.2 + (i / this.rings) * 0.8);
            const ringAlpha = alpha * (1 - i / this.rings * 0.5);
            const hue = this.hue + (i / this.rings) * 60;
            
            if (ringRadius < 2) continue;

            // Glow
            ctx.shadowColor = `hsla(${hue + 20}, 100%, 60%, ${ringAlpha * 0.2})`;
            ctx.shadowBlur = 15;

            // Main ring
            ctx.strokeStyle = `hsla(${hue}, 100%, 70%, ${ringAlpha * 0.8})`;
            ctx.lineWidth = 1.5 + (1 - i / this.rings) * 3;
            
            // Wavy ring
            const wobbleOffset = Math.sin(this.wobble + i * 0.5) * this.wobbleAmount * 0.3;
            const segments = 60;
            ctx.beginPath();
            for (let j = 0; j <= segments; j++) {
              const angle = (j / segments) * Math.PI * 2;
              const wavyR = ringRadius + Math.sin(angle * 4 + time * 0.5 + i * 0.3) * wobbleOffset * 0.5;
              const x = this.x + Math.cos(angle) * wavyR;
              const y = this.y + Math.sin(angle) * wavyR;
              if (j === 0) ctx.moveTo(x, y);
              else ctx.lineTo(x, y);
            }
            ctx.closePath();
            ctx.stroke();
            ctx.shadowBlur = 0;

            // Inner glow ring
            if (i % 2 === 0) {
              ctx.strokeStyle = `hsla(${hue + 30}, 100%, 80%, ${ringAlpha * 0.15})`;
              ctx.lineWidth = 1;
              ctx.beginPath();
              for (let j = 0; j <= segments; j++) {
                const angle = (j / segments) * Math.PI * 2;
                const wavyR = ringRadius * 0.7 + Math.sin(angle * 3 + time * 0.3 + i * 0.5) * wobbleOffset * 0.3;
                const x = this.x + Math.cos(angle) * wavyR;
                const y = this.y + Math.sin(angle) * wavyR;
                if (j === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
              }
              ctx.closePath();
              ctx.stroke();
            }
          }

          // Draw trail rings
          if (this.trail.length > 1) {
            for (let i = 0; i < this.trail.length - 1; i += 2) {
              const t = i / this.trail.length;
              const trailAlpha = alpha * t * 0.15;
              const trailRadius = this.trail[i].radius * (0.5 + 0.5 * t);
              const hue = this.hue + t * 60;
              
              if (trailRadius > 2) {
                ctx.strokeStyle = `hsla(${hue}, 100%, 70%, ${trailAlpha})`;
                ctx.lineWidth = 0.5 + t * 1.5;
                ctx.beginPath();
                ctx.arc(this.trail[i].x, this.trail[i].y, trailRadius, 0, Math.PI * 2);
                ctx.stroke();
              }
            }
          }

          // Draw center glow
          if (this.radius < this.maxRadius * 0.2) {
            const centerGrad = ctx.createRadialGradient(
              this.x, this.y, 0,
              this.x, this.y, this.radius * 0.3
            );
            centerGrad.addColorStop(0, `hsla(${this.hue + 30}, 100%, 90%, ${alpha * 0.2})`);
            centerGrad.addColorStop(1, `hsla(${this.hue}, 100%, 60%, 0)`);
            ctx.fillStyle = centerGrad;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius * 0.3, 0, Math.PI * 2);
            ctx.fill();
          }

          // Draw particles
          this.particles.forEach(p => p.draw(ctx));
        }
      }

      // ----- Wave particle class -----
      class WaveParticle {
        constructor(x, y, hue) {
          this.x = x;
          this.y = y;
          this.hue = hue;
          this.size = 1 + Math.random() * 3;
          this.life = 1;
          this.decay = 0.01 + Math.random() * 0.02;
          this.vx = (Math.random() - 0.5) * 0.5;
          this.vy = (Math.random() - 0.5) * 0.5;
          this.opacity = 0.3 + Math.random() * 0.5;
          this.glowSize = this.size * 3;
        }

        update() {
          this.x += this.vx;
          this.y += this.vy;
          this.life -= this.decay;
          this.size *= 0.998;
          return this.life > 0 && this.size > 0.1;
        }

        draw(ctx) {
          const alpha = this.life * this.opacity;
          const size = this.size * this.life;

          // Glow
          const gradient = ctx.createRadialGradient(
            this.x, this.y, 0,
            this.x, this.y, this.glowSize * this.life
          );
          gradient.addColorStop(0, `hsla(${this.hue + 20}, 100%, 90%, ${alpha * 0.3})`);
          gradient.addColorStop(1, `hsla(${this.hue}, 100%, 60%, 0)`);
          ctx.fillStyle = gradient;
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.glowSize * this.life, 0, Math.PI * 2);
          ctx.fill();

          // Core
          ctx.fillStyle = `hsla(${this.hue + 30}, 100%, 95%, ${alpha * 0.9})`;
          ctx.beginPath();
          ctx.arc(this.x, this.y, size, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // ----- Create pulse -----
      function createPulse() {
        const wave = new Wave();
        waves.push(wave);
        waveCountVal++;
        waveCount.textContent = `✦ ${waveCountVal} waves`;
        pulseStatus.textContent = '🌊 Pulsing!';
        status.textContent = '💥 Energy pulse expanding!';
        setTimeout(() => {
          if (waves.length > 0) {
            pulseStatus.textContent = '🌊 Active';
          } else {
            pulseStatus.textContent = '🌊 Ready';
          }
        }, 1000);
      }

      // ----- Clear waves -----
      function clearWaves() {
        waves = [];
        waveCountVal = 0;
        waveCount.textContent = '✦ 0 waves';
        pulseStatus.textContent = '🌊 Ready';
        status.textContent = '🗑️ Waves cleared';
        setTimeout(() => {
          status.textContent = '🌊 Click Pulse to send out an energy wave';
        }, 1000);
      }

      // ----- Toggle pause -----
      function togglePause() {
        isPaused = !isPaused;
        toggleBtn.textContent = isPaused ? '▶ Play' : '⏸ Pause';
        status.textContent = isPaused ? '⏸ Paused' : '▶ Resumed';
        pulseStatus.textContent = isPaused ? '⏸ Paused' : '🌊 Ready';
      }

      // ----- Reset -----
      function resetPulse() {
        waves = [];
        isPaused = false;
        toggleBtn.textContent = '⏸ Pause';
        pulseStatus.textContent = '🌊 Ready';
        waveCountVal = 0;
        waveCount.textContent = '✦ 0 waves';
        speedSlider.value = 5;
        speedValue.textContent = '5×';
        sizeSlider.value = 60;
        sizeValue.textContent = '60%';
        intensitySlider.value = 70;
        intensityValue.textContent = '70%';
        colorSlider.value = 220;
        colorValue.textContent = '220°';
        status.textContent = '↺ Reset';
        setTimeout(() => {
          status.textContent = '🌊 Click Pulse to send out an energy wave';
        }, 500);
      }

      // ----- Draw background -----
      function drawBackground() {
        const w = canvas.width;
        const h = canvas.height;
        const cx = w / 2;
        const cy = h / 2;

        // Dark background
        const bgGradient = ctx.createRadialGradient(cx, cy, 0, cx, cy, w * 0.7);
        bgGradient.addColorStop(0, '#0a0a1a');
        bgGradient.addColorStop(0.5, '#060612');
        bgGradient.addColorStop(1, '#020208');
        ctx.fillStyle = bgGradient;
        ctx.fillRect(0, 0, w, h);

        // Subtle grid
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.02)';
        ctx.lineWidth = 0.5;
        for (let i = 0; i < w; i += 40) {
          ctx.beginPath();
          ctx.moveTo(i, 0);
          ctx.lineTo(i, h);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(0, i);
          ctx.lineTo(w, i);
          ctx.stroke();
        }
      }

      // ----- Draw -----
      function draw() {
        drawBackground();

        // Update waves
        if (!isPaused) {
          waves = waves.filter(w => w.alive);
          waves.forEach(w => w.update());
          
          // Update particles
          waves.forEach(w => {
            w.particles = w.particles.filter(p => p.update());
          });
        }

        // Draw waves
        waves.forEach(w => w.draw(ctx));

        // Update status
        if (waves.length === 0 && !isPaused) {
          pulseStatus.textContent = '🌊 Ready';
        }
      }

      // ----- Animation loop -----
      function animate() {
        time += 0.016;
        draw();
        animationId = requestAnimationFrame(animate);
      }

      // ----- Start animation -----
      function startAnimation() {
        if (animationId) {
          cancelAnimationFrame(animationId);
        }
        animate();
      }

      // ----- Event Listeners -----
      pulseBtn.addEventListener('click', createPulse);
      clearBtn.addEventListener('click', clearWaves);
      toggleBtn.addEventListener('click', togglePause);
      resetBtn.addEventListener('click', resetPulse);

      speedSlider.addEventListener('input', (e) => {
        speedValue.textContent = e.target.value + '×';
        // Update existing waves' speed
        waves.forEach(w => {
          w.speed = 1 + parseInt(e.target.value) * 0.3;
        });
      });

      sizeSlider.addEventListener('input', (e) => {
        sizeValue.textContent = e.target.value + '%';
      });

      intensitySlider.addEventListener('input', (e) => {
        intensityValue.textContent = e.target.value + '%';
      });

      colorSlider.addEventListener('input', (e) => {
        colorValue.textContent = e.target.value + '°';
        waves.forEach(w => {
          w.hue = parseInt(e.target.value);
        });
      });

      // Click canvas to pulse
      canvas.addEventListener('click', createPulse);

      // Keyboard shortcuts
      document.addEventListener('keydown', (e) => {
        if (e.key === 'p' || e.key === 'P') {
          e.preventDefault();
          createPulse();
        }
        if (e.key === 'c' || e.key === 'C') {
          e.preventDefault();
          clearWaves();
        }
        if (e.key === ' ' || e.key === 'Space') {
          e.preventDefault();
          togglePause();
        }
        if (e.key === 'r' || e.key === 'R') {
          e.preventDefault();
          resetPulse();
        }
      });

      // ----- Resize handler -----
      let resizeTimeout;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(() => {
          setupCanvas();
        }, 200);
      });

      // ----- Init -----
      function init() {
        setupCanvas();
        startAnimation();
        status.textContent = '🌊 Click Pulse to send out an energy wave!';
        // Create initial wave after a moment
        setTimeout(() => {
          createPulse();
        }, 500);
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }

    })();
  </script>
</body>
</html>
