<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Overlay with Progress Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Trigger -->
  <input type="checkbox" id="show-overlay" class="ease-trigger">
  <label for="show-overlay" class="ease-btn" role="button" tabindex="0">Simulate Task Overlay</label>

  <p style="color: #64748b; font-family: system-ui; font-size: 0.875rem; max-width: 400px; text-align: center; margin-top: 1rem;">The counting text and the radial ring are powered entirely by the CSS <code>@property</code> API and <code>conic-gradient</code>. Zero SVGs. Zero JavaScript intervals.</p>

  <!-- The Overlay -->
  <div class="ease-overlay" role="dialog" aria-modal="true" aria-busy="true" aria-live="assertive">
    <div class="ease-radial-spinner" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-label="Processing data"></div>
    <div class="ease-overlay-text">Processing Request...</div>
    <label for="show-overlay" style="position:absolute; top:2rem; right:2rem; color:#94a3b8; cursor:pointer; font-size:2rem;">&times;</label>
  </div>
</body>
</html>
