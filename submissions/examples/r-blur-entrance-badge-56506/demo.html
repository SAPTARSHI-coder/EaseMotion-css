<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Blur-Entrance Badge</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<section class="badge-section">

<h1>Gaming Achievement Badges</h1>

<div class="badge-grid">

<div class="badge legendary">
<span class="icon">🏆</span>
<h3>Legendary</h3>
<p>Top ranked player</p>
</div>

<div class="badge champion">
<span class="icon">⚔️</span>
<h3>Champion</h3>
<p>100 PvP victories</p>
</div>

<div class="badge explorer">
<span class="icon">🗺️</span>
<h3>Explorer</h3>
<p>All maps completed</p>
</div>

<div class="badge elite">
<span class="icon">👑</span>
<h3>Elite</h3>
<p>Seasonal Elite Rank</p>
</div>

</div>

</section>

</body>
</html>
