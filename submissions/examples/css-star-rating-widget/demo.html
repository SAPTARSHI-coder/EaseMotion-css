<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Accessible CSS-only five-star rating widget using radio inputs."
  >
  <title>CSS Star Rating Widget</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="demo">
    <section class="rating-card" aria-labelledby="rating-title">
      <div class="rating-icon" aria-hidden="true">★</div>

      <h1 id="rating-title">Rate your experience</h1>

      <p class="rating-description">
        How would you rate your experience with our service?
      </p>

      <form class="rating-form" action="#" method="get">
        <fieldset class="rating-group">
          <legend class="sr-only">Choose a rating from one to five stars</legend>

          <div class="star-rating">
            <label class="star" for="rating-1">
              <input
                id="rating-1"
                type="radio"
                name="rating"
                value="1"
              >
              <span aria-hidden="true">★</span>
              <span class="sr-only">1 star</span>
            </label>

            <label class="star" for="rating-2">
              <input
                id="rating-2"
                type="radio"
                name="rating"
                value="2"
              >
              <span aria-hidden="true">★</span>
              <span class="sr-only">2 stars</span>
            </label>

            <label class="star" for="rating-3">
              <input
                id="rating-3"
                type="radio"
                name="rating"
                value="3"
              >
              <span aria-hidden="true">★</span>
              <span class="sr-only">3 stars</span>
            </label>

            <label class="star" for="rating-4">
              <input
                id="rating-4"
                type="radio"
                name="rating"
                value="4"
              >
              <span aria-hidden="true">★</span>
              <span class="sr-only">4 stars</span>
            </label>

            <label class="star" for="rating-5">
              <input
                id="rating-5"
                type="radio"
                name="rating"
                value="5"
              >
              <span aria-hidden="true">★</span>
              <span class="sr-only">5 stars</span>
            </label>
          </div>
        </fieldset>

        <button class="submit-button" type="submit">
          Submit rating
        </button>
      </form>

      <p class="rating-hint">
        Use your mouse or keyboard to select a rating.
      </p>
    </section>
  </main>
</body>
</html>
