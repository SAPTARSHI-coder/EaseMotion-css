<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rising Bubble Ambient Field</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="scene">

    <div class="bubbles" aria-hidden="true">

        <span style="--size:16px; --left:8%; --duration:12s; --delay:0s;"></span>
        <span style="--size:28px; --left:20%; --duration:15s; --delay:2s;"></span>
        <span style="--size:18px; --left:35%; --duration:10s; --delay:4s;"></span>
        <span style="--size:36px; --left:48%; --duration:17s; --delay:1s;"></span>
        <span style="--size:14px; --left:62%; --duration:11s; --delay:5s;"></span>
        <span style="--size:24px; --left:75%; --duration:14s; --delay:3s;"></span>
        <span style="--size:32px; --left:88%; --duration:18s; --delay:0s;"></span>

        <span class="blur" style="--size:42px; --left:15%; --duration:20s; --delay:6s;"></span>
        <span class="blur" style="--size:50px; --left:70%; --duration:22s; --delay:8s;"></span>

    </div>

    <div class="content">
        <h1>Rising Bubble Ambient Field</h1>

        <p>
            Lightweight CSS ambient background featuring rising bubbles,
            layered blur depth and reduced motion accessibility.
        </p>
    </div>

</div>

</body>
</html>
