<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <meta
        name="description"
        content="Accessible gradient shimmer progress bars built with pure HTML and CSS."
    >
    <title>Gradient Shimmer Progress</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="progress-section">
        <div class="progress-card">
            <div class="card-header">
                <div>
                    <p class="eyebrow">CSS PROGRESS</p>
                    <h1>Gradient Shimmer</h1>
                    <p class="description">
                        Smooth animated progress indicators using pure HTML and CSS.
                    </p>
                </div>

                <span class="status">ACTIVE</span>
            </div>

            <div class="progress-list">

                <div class="progress-item">
                    <div class="progress-info">
                        <span>HTML & CSS</span>
                        <strong>85%</strong>
                    </div>

                    <div
                        class="progress-track"
                        role="progressbar"
                        aria-label="HTML and CSS progress"
                        aria-valuenow="85"
                        aria-valuemin="0"
                        aria-valuemax="100"
                    >
                        <div class="progress-fill progress-85"></div>
                    </div>
                </div>

                <div class="progress-item">
                    <div class="progress-info">
                        <span>JavaScript</span>
                        <strong>70%</strong>
                    </div>

                    <div
                        class="progress-track"
                        role="progressbar"
                        aria-label="JavaScript progress"
                        aria-valuenow="70"
                        aria-valuemin="0"
                        aria-valuemax="100"
                    >
                        <div class="progress-fill progress-70"></div>
                    </div>
                </div>

                <div class="progress-item">
                    <div class="progress-info">
                        <span>React</span>
                        <strong>60%</strong>
                    </div>

                    <div
                        class="progress-track"
                        role="progressbar"
                        aria-label="React progress"
                        aria-valuenow="60"
                        aria-valuemin="0"
                        aria-valuemax="100"
                    >
                        <div class="progress-fill progress-60"></div>
                    </div>
                </div>

                <div class="progress-item">
                    <div class="progress-info">
                        <span>Advanced CSS</span>
                        <strong>95%</strong>
                    </div>

                    <div
                        class="progress-track"
                        role="progressbar"
                        aria-label="Advanced CSS progress"
                        aria-valuenow="95"
                        aria-valuemin="0"
                        aria-valuemax="100"
                    >
                        <div class="progress-fill progress-95"></div>
                    </div>
                </div>

            </div>

            <footer class="card-footer">
                <span>Pure HTML & Vanilla CSS</span>
                <span>CSS Animation</span>
                <span>Accessible</span>
            </footer>
        </div>
    </main>
</body>
</html>
