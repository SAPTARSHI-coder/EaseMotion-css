<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lock Escalation Heatmap</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="motion-shell lock_escalation_heatmap_drp" aria-labelledby="motion-title">
    <section class="motion-panel">
      <p class="eyebrow">contention monitor</p>
      <h1 id="motion-title">Lock Escalation Heatmap</h1>
      <p class="summary">Row locks intensify into page and table locks while a heatmap highlights the escalation threshold and blocked writers.</p>
      <div class="stage" role="img" aria-label="Animated Lock Escalation Heatmap visualization">
        <div class="orbit orbit-one"></div>
        <div class="orbit orbit-two"></div>
        <article class="node node-a"><strong>A</strong><span>rows locked</span></article>
        <article class="node node-b"><strong>B</strong><span>threshold crossed</span></article>
        <article class="node node-c"><strong>C</strong><span>table lock raised</span></article>
        <div class="beam beam-ab"><i></i></div>
        <div class="beam beam-bc"><i></i></div>
        <div class="beam beam-ca"><i></i></div>
        <div class="decision">table lock raised</div>
      </div>
      <div class="status-grid" aria-label="Lock Escalation Heatmap status">
        <span>rows locked</span>
        <span>threshold crossed</span>
        <span>table lock raised</span>
      </div>
    </section>
  </main>
</body>
</html>
