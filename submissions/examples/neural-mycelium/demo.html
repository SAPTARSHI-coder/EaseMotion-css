<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Neural Mycelium</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="mycelium-app">

    <section class="mycelium-card">

      <header class="mycelium-header">

        <div>
          <span class="eyebrow">BIOLOGICAL NETWORK</span>
          <h1>🧬 Neural Mycelium</h1>
          <p>
            A living network searching for nutrients beneath the surface.
          </p>
        </div>

        <div class="status">
          <span class="status-dot"></span>
          <span id="statusText">Growing</span>
        </div>

      </header>

      <div class="mycelium-display">

        <canvas id="myceliumCanvas"></canvas>

        <div class="soil-label">
          <span>UNDERGROUND ECOSYSTEM</span>
        </div>

        <div class="network-stats">

          <div class="stat">
            <span class="stat-label">Branches</span>
            <span class="stat-value" id="branchCount">0</span>
          </div>

          <div class="stat">
            <span class="stat-label">Nutrients</span>
            <span class="stat-value" id="nutrientCount">0</span>
          </div>

          <div class="stat">
            <span class="stat-label">Connections</span>
            <span class="stat-value" id="connectionCount">0</span>
          </div>

          <div class="stat">
            <span class="stat-label">Network</span>
            <span class="stat-value" id="networkLength">0</span>
          </div>

        </div>

        <div class="interaction-hint">
          Click anywhere to introduce a nutrient
        </div>

      </div>

      <div class="controls">

        <div class="control-group">

          <div class="control-heading">
            <label for="intelligenceSlider">
              🧠 Network Intelligence
            </label>

            <span id="intelligenceValue">65%</span>
          </div>

          <input
            id="intelligenceSlider"
            class="control-slider"
            type="range"
            min="0"
            max="100"
            value="65"
          >

        </div>

        <div class="control-group">

          <div class="control-heading">
            <label for="decaySlider">
              🍂 Path Decay
            </label>

            <span id="decayValue">25%</span>
          </div>

          <input
            id="decaySlider"
            class="control-slider"
            type="range"
            min="0"
            max="100"
            value="25"
          >

        </div>

        <div class="control-group">

          <span class="control-heading">
            🌿 Environment
          </span>

          <div class="mode-buttons">

            <button
              class="mode-btn"
              data-mode="dormant">
              Dormant
            </button>

            <button
              class="mode-btn active"
              data-mode="growing">
              Growing
            </button>

            <button
              class="mode-btn"
              data-mode="blooming">
              Blooming
            </button>

          </div>

        </div>

      </div>

      <div class="actions">

        <button
          class="action-btn primary"
          id="pauseBtn">
          ⏸ Pause
        </button>

        <button
          class="action-btn"
          id="resetBtn">
          ↻ Reset Network
        </button>

      </div>

      <footer class="mycelium-footer">

        <span>
          🧬 Living Network
        </span>

        <span>
          Space — Pause
        </span>

        <span>
          R — Reset
        </span>

      </footer>

    </section>

  </main>

  <script>

    const canvas = document.getElementById("myceliumCanvas");
    const ctx = canvas.getContext("2d");

    const branchCount = document.getElementById("branchCount");
    const nutrientCount = document.getElementById("nutrientCount");
    const connectionCount = document.getElementById("connectionCount");
    const networkLength = document.getElementById("networkLength");

    const intelligenceSlider =
      document.getElementById("intelligenceSlider");

    const decaySlider =
      document.getElementById("decaySlider");

    const intelligenceValue =
      document.getElementById("intelligenceValue");

    const decayValue =
      document.getElementById("decayValue");

    const pauseBtn =
      document.getElementById("pauseBtn");

    const resetBtn =
      document.getElementById("resetBtn");

    const statusText =
      document.getElementById("statusText");

    let width = 0;
    let height = 0;

    let branches = [];
    let nutrients = [];
    let spores = [];

    let paused = false;
    let mode = "growing";

    let intelligence = 0.65;
    let decay = 0.25;

    let lastTime = 0;

    const MAX_BRANCHES = 140;

    function resizeCanvas() {

      const rect = canvas.getBoundingClientRect();

      const ratio = window.devicePixelRatio || 1;

      width = rect.width;
      height = rect.height;

      canvas.width = width * ratio;
      canvas.height = height * ratio;

      ctx.setTransform(
        ratio,
        0,
        0,
        ratio,
        0,
        0
      );
    }

    window.addEventListener(
      "resize",
      resizeCanvas
    );

    class Nutrient {

      constructor(x, y) {

        this.x = x;
        this.y = y;

        this.radius = 4 + Math.random() * 4;

        this.energy = 1;

        this.connected = false;

        this.phase =
          Math.random() * Math.PI * 2;
      }

      update(dt) {

        this.phase += dt * 2;

        if (this.connected) {

          this.energy -= dt * 0.01;

          if (this.energy < 0.35) {
            this.energy = 0.35;
          }
        }
      }

      draw() {

        const pulse =
          Math.sin(this.phase) * 2;

        ctx.save();

        ctx.shadowBlur = 18;

        ctx.shadowColor =
          "rgba(120, 255, 190, 0.8)";

        ctx.fillStyle =
          "rgba(150, 255, 200, 0.9)";

        ctx.beginPath();

        ctx.arc(
          this.x,
          this.y,
          this.radius + pulse,
          0,
          Math.PI * 2
        );

        ctx.fill();

        ctx.restore();
      }
    }

    class Branch {

      constructor(x, y, angle, parent = null) {

        this.x = x;
        this.y = y;

        this.startX = x;
        this.startY = y;

        this.angle = angle;

        this.length = 0;

        this.maxLength =
          25 + Math.random() * 55;

        this.speed =
          0.5 + Math.random() * 0.9;

        this.width =
          parent
            ? Math.max(0.7, parent.width * 0.78)
            : 2.2;

        this.parent = parent;

        this.children = [];

        this.life = 1;

        this.connected = false;

        this.target = null;

        this.phase =
          Math.random() * Math.PI * 2;
      }

      update(dt) {

        this.phase += dt;

        const modeMultiplier =
          mode === "dormant"
            ? 0.35
            : mode === "blooming"
              ? 1.8
              : 1;

        const growth =
          this.speed *
          modeMultiplier *
          dt *
          30;

        if (this.length < this.maxLength) {

          this.findTarget();

          if (this.target) {

            const targetAngle =
              Math.atan2(
                this.target.y - this.y,
                this.target.x - this.x
              );

            let difference =
              targetAngle - this.angle;

            while (difference > Math.PI) {
              difference -= Math.PI * 2;
            }

            while (difference < -Math.PI) {
              difference += Math.PI * 2;
            }

            this.angle +=
              difference *
              intelligence *
              0.035;
          }

          this.length += growth;

          this.x =
            this.startX +
            Math.cos(this.angle) *
            this.length;

          this.y =
            this.startY +
            Math.sin(this.angle) *
            this.length;

          this.x =
            Math.max(10, Math.min(width - 10, this.x));

          this.y =
            Math.max(10, Math.min(height - 10, this.y));

        } else {

          if (
            Math.random() <
            0.012 * modeMultiplier &&
            branches.length < MAX_BRANCHES
          ) {

            const spread =
              (Math.random() - 0.5) *
              1.5;

            const child =
              new Branch(
                this.x,
                this.y,
                this.angle + spread,
                this
              );

            child.width =
              Math.max(
                0.7,
                this.width * 0.78
              );

            this.children.push(child);

            branches.push(child);
          }
        }

        this.checkNutrients();

        this.life -=
          decay *
          0.00035 *
          dt *
          60;

        if (this.life < 0.35) {
          this.life = 0.35;
        }
      }

      findTarget() {

        let closest = null;
        let distance = Infinity;

        for (const nutrient of nutrients) {

          if (nutrient.connected) {
            continue;
          }

          const dx =
            nutrient.x - this.x;

          const dy =
            nutrient.y - this.y;

          const d =
            Math.sqrt(
              dx * dx +
              dy * dy
            );

          if (d < distance && d < 150) {

            distance = d;
            closest = nutrient;
          }
        }

        this.target = closest;
      }

      checkNutrients() {

        for (const nutrient of nutrients) {

          const dx =
            nutrient.x - this.x;

          const dy =
            nutrient.y - this.y;

          const distance =
            Math.sqrt(
              dx * dx +
              dy * dy
            );

          if (
            distance <
            nutrient.radius + 8
          ) {

            if (!nutrient.connected) {

              nutrient.connected = true;

              createSpores(
                this,
                nutrient
              );
            }

            this.connected = true;
          }
        }
      }

      draw() {

        const endX = this.x;
        const endY = this.y;

        ctx.save();

        ctx.globalAlpha =
          this.life;

        ctx.lineCap = "round";

        ctx.lineWidth =
          this.width;

        ctx.strokeStyle =
          this.connected
            ? "rgba(135, 255, 190, 0.9)"
            : "rgba(110, 210, 150, 0.65)";

        ctx.shadowBlur =
          this.connected ? 12 : 5;

        ctx.shadowColor =
          "rgba(90, 255, 170, 0.6)";

        ctx.beginPath();

        ctx.moveTo(
          this.startX,
          this.startY
        );

        ctx.lineTo(
          endX,
          endY
        );

        ctx.stroke();

        ctx.restore();

        if (
          this.length <
          this.maxLength
        ) {

          ctx.save();

          ctx.fillStyle =
            "rgba(190, 255, 210, 0.9)";

          ctx.shadowBlur = 10;

          ctx.shadowColor =
            "rgba(100,255,170,0.9)";

          ctx.beginPath();

          ctx.arc(
            endX,
            endY,
            2,
            0,
            Math.PI * 2
          );

          ctx.fill();

          ctx.restore();
        }
      }
    }

    class Spore {

      constructor(branch, nutrient) {

        this.branch = branch;

        this.nutrient = nutrient;

        this.progress = 0;

        this.speed =
          0.25 + Math.random() * 0.3;
      }

      update(dt) {

        this.progress +=
          this.speed * dt;

        if (this.progress > 1) {
          this.progress = 0;
        }
      }

      draw() {

        const x =
          this.branch.startX +
          (
            this.branch.x -
            this.branch.startX
          ) *
          this.progress;

        const y =
          this.branch.startY +
          (
            this.branch.y -
            this.branch.startY
          ) *
          this.progress;

        ctx.save();

        ctx.fillStyle =
          "rgba(210,255,225,0.9)";

        ctx.shadowBlur = 12;

        ctx.shadowColor =
          "rgba(100,255,180,0.9)";

        ctx.beginPath();

        ctx.arc(
          x,
          y,
          2,
          0,
          Math.PI * 2
        );

        ctx.fill();

        ctx.restore();
      }
    }

    function createSpores(branch, nutrient) {

      for (
        let i = 0;
        i < 3;
        i++
      ) {

        spores.push(
          new Spore(
            branch,
            nutrient
          )
        );
      }
    }

    function generateInitialNetwork() {

      branches = [];
      nutrients = [];
      spores = [];

      const centerX =
        width / 2;

      const centerY =
        height * 0.58;

      for (
        let i = 0;
        i < 14;
        i++
      ) {

        const angle =
          Math.random() *
          Math.PI * 2;

        branches.push(
          new Branch(
            centerX,
            centerY,
            angle
          )
        );
      }

      for (
        let i = 0;
        i < 14;
        i++
      ) {

        nutrients.push(
          new Nutrient(
            30 +
              Math.random() *
              (width - 60),

            30 +
              Math.random() *
              (height - 80)
          )
        );
      }
    }

    function drawBackground() {

      const gradient =
        ctx.createLinearGradient(
          0,
          0,
          0,
          height
        );

      gradient.addColorStop(
        0,
        "#111b17"
      );

      gradient.addColorStop(
        1,
        "#050908"
      );

      ctx.fillStyle =
        gradient;

      ctx.fillRect(
        0,
        0,
        width,
        height
      );

      ctx.fillStyle =
        "rgba(110,150,120,0.06)";

      for (
        let i = 0;
        i < 100;
        i++
      ) {

        const x =
          (i * 83) %
          width;

        const y =
          (i * 47) %
          height;

        ctx.beginPath();

        ctx.arc(
          x,
          y,
          1,
          0,
          Math.PI * 2
        );

        ctx.fill();
      }
    }

    function drawCore() {

      const x =
        width / 2;

      const y =
        height * 0.58;

      const pulse =
        Math.sin(
          performance.now() * 0.003
        ) * 2;

      ctx.save();

      ctx.shadowBlur =
        30 + pulse;

      ctx.shadowColor =
        "rgba(120,255,170,0.8)";

      ctx.fillStyle =
        "rgba(130,255,180,0.95)";

      ctx.beginPath();

      ctx.arc(
        x,
        y,
        7 + pulse,
        0,
        Math.PI * 2
      );

      ctx.fill();

      ctx.restore();
    }

    function update(dt) {

      if (paused) {
        return;
      }

      for (const nutrient of nutrients) {
        nutrient.update(dt);
      }

      for (const branch of branches) {
        branch.update(dt);
      }

      for (const spore of spores) {
        spore.update(dt);
      }

      if (
        spores.length > 80
      ) {
        spores.splice(
          0,
          spores.length - 80
        );
      }
    }

    function render() {

      drawBackground();

      for (const nutrient of nutrients) {
        nutrient.draw();
      }

      for (const branch of branches) {
        branch.draw();
      }

      for (const spore of spores) {
        spore.draw();
      }

      drawCore();

      updateStats();
    }

    function updateStats() {

      branchCount.textContent =
        branches.length;

      nutrientCount.textContent =
        nutrients.length;

      connectionCount.textContent =
        nutrients.filter(
          n => n.connected
        ).length;

      const totalLength =
        branches.reduce(
          (sum, branch) =>
            sum + branch.length,
          0
        );

      networkLength.textContent =
        Math.round(totalLength) + " px";
    }

    function animate(timestamp) {

      const dt =
        Math.min(
          0.05,
          (timestamp - lastTime) / 1000 || 0
        );

      lastTime = timestamp;

      update(dt);

      render();

      requestAnimationFrame(
        animate
      );
    }

    canvas.addEventListener(
      "click",
      event => {

        const rect =
          canvas.getBoundingClientRect();

        const x =
          event.clientX -
          rect.left;

        const y =
          event.clientY -
          rect.top;

        nutrients.push(
          new Nutrient(
            x,
            y
          )
        );
      }
    );

    intelligenceSlider.addEventListener(
      "input",
      () => {

        intelligence =
          Number(
            intelligenceSlider.value
          ) / 100;

        intelligenceValue.textContent =
          intelligenceSlider.value + "%";
      }
    );

    decaySlider.addEventListener(
      "input",
      () => {

        decay =
          Number(
            decaySlider.value
          ) / 100;

        decayValue.textContent =
          decaySlider.value + "%";
      }
    );

    document
      .querySelectorAll(".mode-btn")
      .forEach(button => {

        button.addEventListener(
          "click",
          () => {

            document
              .querySelectorAll(
                ".mode-btn"
              )
              .forEach(
                b =>
                  b.classList.remove(
                    "active"
                  )
              );

            button.classList.add(
              "active"
            );

            mode =
              button.dataset.mode;

            statusText.textContent =
              button.textContent.trim();
          }
        );
      });

    pauseBtn.addEventListener(
      "click",
      () => {

        paused = !paused;

        pauseBtn.textContent =
          paused
            ? "▶ Resume"
            : "⏸ Pause";

        statusText.textContent =
          paused
            ? "Paused"
            : mode;
      }
    );

    resetBtn.addEventListener(
      "click",
      () => {

        generateInitialNetwork();

        paused = false;

        pauseBtn.textContent =
          "⏸ Pause";

        statusText.textContent =
          mode;
      }
    );

    document.addEventListener(
      "keydown",
      event => {

        if (
          event.code === "Space"
        ) {

          event.preventDefault();

          pauseBtn.click();
        }

        if (
          event.key.toLowerCase() === "r"
        ) {

          resetBtn.click();
        }
      }
    );

    resizeCanvas();

    generateInitialNetwork();

    requestAnimationFrame(
      animate
    );

  </script>

</body>
</html>
