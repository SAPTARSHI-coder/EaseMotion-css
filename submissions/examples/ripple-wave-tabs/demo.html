<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ripple Wave Tabs</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="tabs">

    <input type="radio" name="tab" id="tab1" checked>
    <input type="radio" name="tab" id="tab2">
    <input type="radio" name="tab" id="tab3">

    <div class="tab-buttons">
        <label for="tab1">About</label>
        <label for="tab2">Projects</label>
        <label for="tab3">Contact</label>
    </div>

    <div class="contents">
        <section class="content one">
            <h2>About</h2>
            <p>Creative portfolio with elegant CSS ripple-wave tab animations.</p>
        </section>

        <section class="content two">
            <h2>Projects</h2>
            <p>Explore beautiful UI components crafted using pure HTML and CSS.</p>
        </section>

        <section class="content three">
            <h2>Contact</h2>
            <p>Let's build modern web experiences together.</p>
        </section>
    </div>

</div>

</body>
</html>
