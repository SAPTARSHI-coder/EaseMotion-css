<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Qubit Grid - EaseMotion CSS</title>
    <!-- Include EaseMotion Core Stylesheet -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030814; color: #ffffff;">

    <div class="ease-card ease-card-glass qubit-container">
        <div class="qubit-header">
            <h2>Qubit Grid</h2>
            <span class="ease-badge ease-badge-primary">Entangled</span>
        </div>
        
        <div class="qubit-screen ease-center">
            <div class="qubit-link link-1"></div>
            <div class="qubit-link link-2"></div>
            <div class="qubit-node q-1">|0⟩</div>
            <div class="qubit-node q-2">|1⟩</div>
            <div class="qubit-node q-3">|ψ⟩</div>
            <div class="qubit-node q-4">|1⟩</div>
        </div>

        <div class="qubit-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Coherence: 99.8%</span>
            <button class="ease-btn ease-btn-primary ease-btn-sm ease-hover-grow">Superposition</button>
        </div>
    </div>

</body>
</html>
