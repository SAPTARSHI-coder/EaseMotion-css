<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CSS Prism Rotate Loader</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<main class="container">

<div class="loader" role="status" aria-label="Prism loading animation">

    <div class="prism">

        <span class="face front"></span>

        <span class="face right"></span>

        <span class="face left"></span>

    </div>

</div>


<p>Prism Rotate Loader</p>


</main>



</body>

</html>
