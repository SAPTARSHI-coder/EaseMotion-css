<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Curtain Slide Reveal Door</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="demo">
    <h1>Curtain Slide Reveal Door</h1>

    <p class="description">
      A smooth curtain-style reveal animation using hardware-accelerated
      transforms and opacity.
    </p>

    <section class="reveal-stage">
      <div class="reveal-content">
        <span class="content-icon">◆</span>
        <h2>Welcome</h2>
        <p>The door is open.</p>
      </div>

      <div class="curtain-door ease-anim-curtain-slide-reveal-door">
        <div class="curtain-panel curtain-left"></div>
        <div class="curtain-panel curtain-right"></div>
      </div>
    </section>

    <p class="hint">
      Pure CSS animation · No JavaScript required
    </p>
  </main>
</body>
</html>
