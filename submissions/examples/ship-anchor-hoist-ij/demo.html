<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-ship-anchor-hoist demo</title>
</head>
<body>
<div class="sh-app">
  <div class="sh-sea"></div>
  <div class="sh-wave"></div>
  <div class="sh-hull">
    <div class="sh-cabin"></div>
    <div class="sh-funnel"></div>
    <div class="sh-porthole sh-porthole-1"></div>
    <div class="sh-porthole sh-porthole-2"></div>
    <div class="sh-porthole sh-porthole-3"></div>
    <span class="sh-name">M.V. TIDE</span>
  </div>
  <div class="sh-boom"></div>
  <div class="sh-chain"></div>
  <div class="sh-anchor">
    <div class="sh-shank"></div>
    <div class="sh-fluke sh-fluke-l"></div>
    <div class="sh-fluke sh-fluke-r"></div>
  </div>
  <span class="sh-status">HOISTING</span>
</div>
</body>
</html>
