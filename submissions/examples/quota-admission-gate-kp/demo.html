<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quota Admission Gate</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="quota-shell" aria-labelledby="quota-title">
    <section class="quota-board">
      <p class="eyebrow">Fair capacity control</p>
      <h1 id="quota-title">Quota Admission Gate</h1>
      <p class="summary">Tenant quota meters pulse at the admission gate while overflow traffic is throttled into a recovery lane.</p>
      <div class="quota-stage" role="img" aria-label="Animated quota admission gate visualization">
        <div class="tenant-lanes"><span></span><span></span><span></span><span></span></div>
        <div class="quota-gate"><i></i><i></i><strong>quota</strong></div>
        <div class="admission-core"><b></b><b></b><em>admit</em></div>
        <div class="throttle-lane"><small>throttle</small><span></span><span></span></div>
      </div>
      <div class="readouts"><span>tenant a 74%</span><span>admit 68%</span><span>throttle 9%</span></div>
    </section>
  </main>
</body>
</html>
