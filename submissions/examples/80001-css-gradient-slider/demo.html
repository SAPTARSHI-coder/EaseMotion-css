<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="CSS-only responsive gradient slider component"
  >
  <title>Gradient Slider</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">
    <section class="slider-card" aria-labelledby="slider-title">
      <div class="slider-header">
        <div>
          <p class="eyebrow">CSS COMPONENT</p>
          <h1 id="slider-title">Gradient Slider</h1>
        </div>

        <span class="value-badge">75%</span>
      </div>

      <div class="slider-area">
        <label class="sr-only" for="gradient-slider">
          Select a value
        </label>

        <input
          id="gradient-slider"
          class="gradient-slider"
          type="range"
          min="0"
          max="100"
          value="75"
        >

        <div class="slider-labels" aria-hidden="true">
          <span>0</span>
          <span>25</span>
          <span>50</span>
          <span>75</span>
          <span>100</span>
        </div>
      </div>

      <div class="slider-footer">
        <span>Adjust the intensity</span>
        <span>CSS only</span>
      </div>
    </section>
  </main>

</body>
</html>
