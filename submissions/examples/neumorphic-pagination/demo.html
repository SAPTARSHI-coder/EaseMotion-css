<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
        name="description"
        content="Responsive neumorphic pagination component built with pure HTML and CSS"
    >
    <title>Neumorphic Pagination</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="page">

    <section class="pagination-demo" aria-labelledby="pagination-title">

        <div class="heading">
            <p class="eyebrow">CSS COMPONENT</p>

            <h1 id="pagination-title">
                Neumorphic Pagination
            </h1>

            <p class="subtitle">
                A clean and responsive pagination component with
                soft neumorphic styling.
            </p>
        </div>

        <nav
            class="pagination"
            aria-label="Pagination navigation"
        >

            <a
                href="#"
                class="page-btn navigation-btn"
                aria-label="Previous page"
            >
                <span aria-hidden="true">‹</span>
                <span class="btn-label">Previous</span>
            </a>

            <div class="page-numbers">

                <a
                    href="#"
                    class="page-btn active"
                    aria-current="page"
                >
                    1
                </a>

                <a href="#" class="page-btn">
                    2
                </a>

                <a href="#" class="page-btn">
                    3
                </a>

                <span class="dots" aria-hidden="true">
                    ...
                </span>

                <a href="#" class="page-btn">
                    8
                </a>

                <a href="#" class="page-btn">
                    9
                </a>

                <a href="#" class="page-btn">
                    10
                </a>

            </div>

            <a
                href="#"
                class="page-btn navigation-btn"
                aria-label="Next page"
            >
                <span class="btn-label">Next</span>
                <span aria-hidden="true">›</span>
            </a>

        </nav>

        <p class="page-info">
            Showing <strong>1</strong> of <strong>10</strong> pages
        </p>

    </section>

</main>

</body>
</html>
