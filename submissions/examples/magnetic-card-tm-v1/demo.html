<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Magnetic card hover — EaseMotion CSS</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="mag-page-tm">
  <h1>Magnetic card</h1>
  <p class="mag-lede-tm">Hover any card to see it lean toward the cursor.</p>

  <section class="mag-row-tm">
    <article class="mag-card-tm mag-soft-tm">
      <span class="mag-tag-tm">Free</span>
      <h3>Starter</h3>
      <p>For solo developers exploring the library.</p>
    </article>
    <article class="mag-card-tm">
      <span class="mag-tag-tm mag-tag-hot-tm">Popular</span>
      <h3>Studio</h3>
      <p>For small teams shipping production UI.</p>
    </article>
    <article class="mag-card-tm mag-bold-tm">
      <span class="mag-tag-tm">Enterprise</span>
      <h3>Scale</h3>
      <p>For organisations with custom theming needs.</p>
    </article>
  </section>
</main>
</body>
</html>
