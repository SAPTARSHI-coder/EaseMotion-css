<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CSS Karaoke Highlight</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<main class="karaoke-container">

    <h1>
        CSS Karaoke Highlight
    </h1>


    <div class="lyrics" aria-label="Animated lyrics">

        <span class="line">
            <span class="word">Every</span>
            <span class="word">moment</span>
            <span class="word">creates</span>
            <span class="word">a</span>
            <span class="word">new</span>
            <span class="word">story</span>
        </span>

    </div>


</main>


</body>

</html>
