<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-weather-vane-turn demo</title>
</head>
<body>
<div class="wv-app">
  <div class="wv-sky">
    <div class="wv-vane">
      <div class="wv-arrow">
        <div class="wv-tail"></div>
        <div class="wv-head"></div>
      </div>
      <div class="wv-rooster"></div>
      <div class="wv-pole"></div>
      <div class="wv-arm wv-arm-n">N</div>
      <div class="wv-arm wv-arm-e">E</div>
      <div class="wv-arm wv-arm-s">S</div>
      <div class="wv-arm wv-arm-w">W</div>
    </div>
    <div class="wv-smoke wv-smoke-1"></div>
    <div class="wv-smoke wv-smoke-2"></div>
    <div class="wv-roof">
      <div class="wv-chimney"></div>
      <div class="wv-shingle wv-shingle-1"></div>
      <div class="wv-shingle wv-shingle-2"></div>
    </div>
  </div>
</div>
</body>
</html>
