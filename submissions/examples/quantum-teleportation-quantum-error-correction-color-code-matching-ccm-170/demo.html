<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Code Matching CCM - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css"></head><body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030712; color: #ffffff;">

    <div class="ease-card ease-card-glass ccm-container">
        <div class="ccm-header">
            <h2>Color Code Matching</h2>
            <span class="ease-badge ease-badge-success">Quantum Error Correction</span>
        </div>
        
        <div class="ccm-screen ease-center">
            <div class="ccm-flux flux-ccm-a"></div>
            <div class="ccm-flux flux-ccm-b"></div>
            <div class="ccm-boundary-ring"></div>
            <div class="ccm-core ease-center"></div>
        </div>

        <div class="ccm-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Syndrome Graph Decoders &amp; MWPM Matching</span>
            <button class="ease-btn ease-btn-success ease-btn-sm ease-hover-grow">Run Code Matching</button>
        </div>
    </div></body></html>
