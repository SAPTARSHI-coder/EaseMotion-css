<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Toggle Switch — Glassmorphic Style</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="ease-glass-panel">
    <p class="ease-eyebrow">Display</p>
    <h1 class="ease-heading">Appearance</h1>
    <p class="ease-subtitle">A glassmorphic toggle switch with a smooth elastic snap.</p>

    <div class="ease-toggle-row">
      <span class="ease-toggle-label">Dark mode</span>
      <label class="ease-toggle">
        <input type="checkbox" class="ease-toggle-input" checked />
        <span class="ease-toggle-track"><span class="ease-toggle-thumb"></span></span>
      </label>
    </div>

    <div class="ease-toggle-row">
      <span class="ease-toggle-label">Reduced transparency</span>
      <label class="ease-toggle">
        <input type="checkbox" class="ease-toggle-input" />
        <span class="ease-toggle-track"><span class="ease-toggle-thumb"></span></span>
      </label>
    </div>
  </div>

</body>
</html>
