<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animated Search Expand</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <h1>Animated Search Expand</h1>

    <div class="search-wrap">
      <button class="search-toggle" id="searchToggle" aria-expanded="false" aria-controls="searchInput" aria-label="Open search">
        🔍
      </button>
      <form class="search-form" id="searchForm" role="search">
        <input
          type="search"
          id="searchInput"
          class="search-input"
          placeholder="Search docs..."
          aria-label="Search"
        >
      </form>
    </div>
  </main>

  <script>
    const toggle = document.getElementById('searchToggle');
    const wrap = document.querySelector('.search-wrap');
    const input = document.getElementById('searchInput');

    function open() {
      wrap.classList.add('is-open');
      toggle.setAttribute('aria-expanded', 'true');
      toggle.setAttribute('aria-label', 'Close search');
      input.focus();
    }

    function close() {
      wrap.classList.remove('is-open');
      toggle.setAttribute('aria-expanded', 'false');
      toggle.setAttribute('aria-label', 'Open search');
    }

    toggle.addEventListener('click', () => {
      wrap.classList.contains('is-open') ? close() : open();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && wrap.classList.contains('is-open')) {
        close();
        toggle.focus();
      }
    });

    document.addEventListener('click', (e) => {
      if (!wrap.contains(e.target) && wrap.classList.contains('is-open')) close();
    });
  </script>
</body>
</html>
