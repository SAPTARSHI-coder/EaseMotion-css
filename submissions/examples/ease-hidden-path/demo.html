<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hidden Path · Path Appears as You Move</title>
    <meta name="description" content="Interactive hidden path that reveals itself as you move your cursor across the canvas.">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1 class="title">🗺️ HIDDEN PATH</h1>
        
        <div class="canvas-wrapper">
            <canvas id="pathCanvas" width="600" height="450"></canvas>
            <div class="glow-overlay"></div>
        </div>

        <div class="controls">
            <div class="button-group">
                <button class="reset-btn" id="resetBtn">⟳ RESET</button>
                <button class="toggle-btn" id="toggleBtn">⏸️ PAUSE</button>
            </div>
            <div class="speed-control">
                <label>Size</label>
                <input type="range" id="sizeSlider" min="10" max="60" value="30">
                <span id="sizeLabel">30</span>
                <label>Speed</label>
                <input type="range" id="speedSlider" min="1" max="10" value="5">
                <span id="speedLabel">5</span>
            </div>
        </div>

        <div class="info">
            <span>🗺️ HIDDEN PATH</span>
            <small>move cursor · path appears · explore</small>
        </div>
        <div class="hint">
            <span>🪄 move your mouse to reveal the hidden path</span>
        </div>
    </div>

    <script>
        (function() {
            const canvas = document.getElementById('pathCanvas');
            const ctx = canvas.getContext('2d');
            const W = 600, H = 450;
            
            const resetBtn = document.getElementById('resetBtn');
            const toggleBtn = document.getElementById('toggleBtn');
            const sizeSlider = document.getElementById('sizeSlider');
            const sizeLabel = document.getElementById('sizeLabel');
            const speedSlider = document.getElementById('speedSlider');
            const speedLabel = document.getElementById('speedLabel');

            let isAnimating = true;
            let speed = 5;
            let time = 0;
            let revealSize = 30;
            let mouseX = -100;
            let mouseY = -100;

            // ---- Path System ----
            let pathPoints = [];
            let revealedPath = [];
            let pathProgress = 0;
            let isRevealing = false;

            // ---- Generate Hidden Path ----
            function generatePath() {
                pathPoints = [];
                revealedPath = [];
                pathProgress = 0;
                isRevealing = false;
                
                // Create a winding path through the canvas
                const numPoints = 30 + Math.floor(Math.random() * 20);
                let x = 30 + Math.random() * 50;
                let y = 30 + Math.random() * 50;
                let angle = Math.random() * Math.PI * 2;
                
                for (let i = 0; i < numPoints; i++) {
                    pathPoints.push({ x, y });
                    
                    // Change direction occasionally
                    if (Math.random() < 0.2) {
                        angle += (Math.random() - 0.5) * 1.5;
                    }
                    
                    const step = 15 + Math.random() * 25;
                    x += Math.cos(angle) * step;
                    y += Math.sin(angle) * step;
                    
                    // Keep within bounds
                    if (x < 20) { x = 20; angle += 1; }
                    if (x > W - 20) { x = W - 20; angle -= 1; }
                    if (y < 20) { y = 20; angle += 1; }
                    if (y > H - 20) { y = H - 20; angle -= 1; }
                }
                
                // Smooth the path
                pathPoints = smoothPath(pathPoints);
                
                // Initialize revealed path
                for (let i = 0; i < pathPoints.length; i++) {
                    revealedPath[i] = 0;
                }
            }

            // ---- Smooth Path ----
            function smoothPath(points) {
                if (points.length < 3) return points;
                const smoothed = [];
                const windowSize = 3;
                const halfWindow = Math.floor(windowSize / 2);
                
                for (let i = 0; i < points.length; i++) {
                    let sumX = 0, sumY = 0, count = 0;
                    for (let j = -halfWindow; j <= halfWindow; j++) {
                        const idx = Math.min(Math.max(i + j, 0), points.length - 1);
                        sumX += points[idx].x;
                        sumY += points[idx].y;
                        count++;
                    }
                    smoothed.push({ x: sumX / count, y: sumY / count });
                }
                return smoothed;
            }

            // ---- Check Reveal ----
            function checkReveal(mx, my) {
                const radius = revealSize;
                let anyRevealed = false;
                
                for (let i = 0; i < pathPoints.length; i++) {
                    const p = pathPoints[i];
                    const dx = p.x - mx;
                    const dy = p.y - my;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    
                    if (dist < radius) {
                        const intensity = 1 - (dist / radius);
                        revealedPath[i] = Math.min(1, revealedPath[i] + intensity * 0.02 * (speed / 5));
                        if (revealedPath[i] > 0.1) anyRevealed = true;
                    }
                }
            }

            // ---- Draw ----
            function draw() {
                // Background - mysterious dark
                const grad = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, W);
                grad.addColorStop(0, '#0d1a2a');
                grad.addColorStop(0.3, '#0a1520');
                grad.addColorStop(0.6, '#080e18');
                grad.addColorStop(0.8, '#060a12');
                grad.addColorStop(1, '#040608');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, W, H);
                
                // Subtle texture
                for (let i = 0; i < 200; i++) {
                    const x = (i * 137 + 20) % W;
                    const y = (i * 97 + 30) % H;
                    const size = 0.5 + (i % 3) * 0.5;
                    ctx.fillStyle = `rgba(255, 255, 255, ${0.01 + (i % 5) * 0.005})`;
                    ctx.beginPath();
                    ctx.arc(x, y, size, 0, Math.PI * 2);
                    ctx.fill();
                }
                
                // Draw hidden path (unrevealed - very faint)
                for (let i = 0; i < pathPoints.length - 1; i++) {
                    const p1 = pathPoints[i];
                    const p2 = pathPoints[i + 1];
                    const reveal = revealedPath[i] || 0;
                    
                    if (reveal < 0.1) {
                        ctx.strokeStyle = `rgba(255, 255, 255, ${0.02})`;
                        ctx.lineWidth = 1;
                        ctx.beginPath();
                        ctx.moveTo(p1.x, p1.y);
                        ctx.lineTo(p2.x, p2.y);
                        ctx.stroke();
                    }
                }
                
                // Draw revealed path
                for (let i = 0; i < pathPoints.length - 1; i++) {
                    const p1 = pathPoints[i];
                    const p2 = pathPoints[i + 1];
                    const reveal = revealedPath[i] || 0;
                    
                    if (reveal > 0.05) {
                        const alpha = Math.min(1, reveal * 1.2);
                        const width = 2 + reveal * 6;
                        
                        // Glow
                        ctx.shadowColor = `rgba(100, 200, 255, ${alpha * 0.2})`;
                        ctx.shadowBlur = 15 * reveal;
                        
                        // Path color - gradient from blue to gold
                        const hue = 200 + reveal * 40;
                        ctx.strokeStyle = `hsla(${hue}, 80%, ${60 + reveal * 30}%, ${alpha * 0.8})`;
                        ctx.lineWidth = width;
                        ctx.lineCap = 'round';
                        ctx.lineJoin = 'round';
                        ctx.beginPath();
                        ctx.moveTo(p1.x, p1.y);
                        ctx.lineTo(p2.x, p2.y);
                        ctx.stroke();
                        
                        // Inner glow
                        ctx.shadowBlur = 30 * reveal;
                        ctx.strokeStyle = `hsla(${hue + 20}, 100%, 80%, ${alpha * 0.15})`;
                        ctx.lineWidth = width + 4;
                        ctx.beginPath();
                        ctx.moveTo(p1.x, p1.y);
                        ctx.lineTo(p2.x, p2.y);
                        ctx.stroke();
                    }
                }
                
                // Draw path points (waypoints)
                for (let i = 0; i < pathPoints.length; i++) {
                    const p = pathPoints[i];
                    const reveal = revealedPath[i] || 0;
                    
                    if (reveal > 0.1) {
                        const alpha = Math.min(1, reveal * 1.5);
                        const size = 2 + reveal * 4;
                        
                        ctx.shadowColor = `rgba(100, 200, 255, ${alpha * 0.3})`;
                        ctx.shadowBlur = 20 * reveal;
                        ctx.fillStyle = `rgba(200, 230, 255, ${alpha * 0.5})`;
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, size, 0, Math.PI * 2);
                        ctx.fill();
                        
                        // Glow ring
                        ctx.shadowBlur = 0;
                        ctx.strokeStyle = `rgba(200, 230, 255, ${alpha * 0.1})`;
                        ctx.lineWidth = 1;
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, size * 2, 0, Math.PI * 2);
                        ctx.stroke();
                    }
                }
                
                // Draw cursor glow
                if (mouseX > 0 && mouseY > 0) {
                    const cursorGrad = ctx.createRadialGradient(
                        mouseX, mouseY, 0,
                        mouseX, mouseY, revealSize * 1.5
                    );
                    cursorGrad.addColorStop(0, `rgba(100, 200, 255, ${0.04})`);
                    cursorGrad.addColorStop(0.5, `rgba(100, 200, 255, ${0.02})`);
                    cursorGrad.addColorStop(1, 'rgba(100, 200, 255, 0)');
                    ctx.fillStyle = cursorGrad;
                    ctx.beginPath();
                    ctx.arc(mouseX, mouseY, revealSize * 1.5, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // Cursor ring
                    ctx.shadowBlur = 0;
                    ctx.strokeStyle = `rgba(100, 200, 255, ${0.08})`;
                    ctx.lineWidth = 1;
                    ctx.setLineDash([4, 8]);
                    ctx.beginPath();
                    ctx.arc(mouseX, mouseY, revealSize, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.setLineDash([]);
                }
                
                // Completion message
                const avgReveal = revealedPath.reduce((a, b) => a + b, 0) / revealedPath.length;
                if (avgReveal > 0.8) {
                    ctx.save();
                    ctx.shadowColor = 'rgba(100, 200, 255, 0.2)';
                    ctx.shadowBlur = 30;
                    ctx.fillStyle = 'rgba(100, 200, 255, 0.6)';
                    ctx.font = '24px monospace';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('✨ Path Revealed! ✨', W/2, 30);
                    ctx.restore();
                }
            }

            // ---- Animation Loop ----
            function animate() {
                if (!isAnimating) {
                    requestAnimationFrame(animate);
                    return;
                }
                
                time += 0.01 * (speed / 5);
                
                // Gradually fade unrevealed parts
                for (let i = 0; i < revealedPath.length; i++) {
                    if (revealedPath[i] > 0 && revealedPath[i] < 0.05) {
                        revealedPath[i] *= 0.99;
                    }
                }
                
                draw();
                
                requestAnimationFrame(animate);
            }

            // ---- Mouse/Touch tracking ----
            function handleMove(e) {
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;
                
                let clientX, clientY;
                if (e.touches) {
                    clientX = e.touches[0].clientX;
                    clientY = e.touches[0].clientY;
                    e.preventDefault();
                } else {
                    clientX = e.clientX;
                    clientY = e.clientY;
                }
                
                mouseX = (clientX - rect.left) * scaleX;
                mouseY = (clientY - rect.top) * scaleY;
                
                if (mouseX >= 0 && mouseX <= W && mouseY >= 0 && mouseY <= H) {
                    checkReveal(mouseX, mouseY);
                }
            }

            function handleLeave() {
                mouseX = -100;
                mouseY = -100;
            }

            // ---- Reset ----
            function resetPath() {
                generatePath();
                mouseX = -100;
                mouseY = -100;
                time = 0;
                draw();
            }

            // ---- Toggle Animation ----
            function toggleAnimation() {
                isAnimating = !isAnimating;
                toggleBtn.textContent = isAnimating ? '⏸️ PAUSE' : '▶️ PLAY';
            }

            // ---- Speed Control ----
            sizeSlider.addEventListener('input', function() {
                revealSize = parseInt(this.value);
                sizeLabel.textContent = revealSize;
            });

            speedSlider.addEventListener('input', function() {
                speed = parseInt(this.value);
                speedLabel.textContent = speed;
            });

            // ---- Event Listeners ----
            resetBtn.addEventListener('click', resetPath);
            toggleBtn.addEventListener('click', toggleAnimation);
            canvas.addEventListener('mousemove', handleMove);
            canvas.addEventListener('mouseleave', handleLeave);
            canvas.addEventListener('touchmove', handleMove, { passive: false });
            canvas.addEventListener('touchstart', handleMove, { passive: false });

            // ---- Keyboard Shortcuts ----
            document.addEventListener('keydown', function(e) {
                if (e.key === ' ' || e.key === 'Space') {
                    e.preventDefault();
                    toggleAnimation();
                }
                if (e.key === 'r' || e.key === 'R') {
                    resetPath();
                }
            });

            // ---- Initialize ----
            generatePath();
            draw();
            animate();

            console.log('🗺️ Hidden Path · Move your mouse to reveal the hidden path!');
        })();
    </script>
</body>
</html>
