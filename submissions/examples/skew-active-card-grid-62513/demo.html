<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skew-Active Card Grid - EaseMotion CSS</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <main class="checkout-grid">
        <!-- Card 1 -->
        <article class="checkout-card" tabindex="0">
            <div class="checkout-card-content">
                <header class="card-header">
                    <h2 class="card-title">Basic</h2>
                    <span class="card-price">$9<small>/mo</small></span>
                </header>
                <ul class="card-features" aria-label="Basic plan features">
                    <li>1 User Account</li>
                    <li>5GB Storage</li>
                    <li>Basic Support</li>
                </ul>
                <button class="select-btn">Select Plan</button>
            </div>
        </article>

        <!-- Card 2 -->
        <article class="checkout-card" tabindex="0">
            <div class="checkout-card-content">
                <header class="card-header">
                    <h2 class="card-title">Pro</h2>
                    <span class="card-price">$29<small>/mo</small></span>
                </header>
                <ul class="card-features" aria-label="Pro plan features">
                    <li>5 User Accounts</li>
                    <li>50GB Storage</li>
                    <li>Priority Support</li>
                    <li>Advanced Analytics</li>
                </ul>
                <button class="select-btn">Select Plan</button>
            </div>
        </article>

        <!-- Card 3 -->
        <article class="checkout-card" tabindex="0">
            <div class="checkout-card-content">
                <header class="card-header">
                    <h2 class="card-title">Enterprise</h2>
                    <span class="card-price">$99<small>/mo</small></span>
                </header>
                <ul class="card-features" aria-label="Enterprise plan features">
                    <li>Unlimited Users</li>
                    <li>500GB Storage</li>
                    <li>24/7 Dedicated Support</li>
                    <li>Custom Integrations</li>
                </ul>
                <button class="select-btn">Select Plan</button>
            </div>
        </article>
    </main>

</body>
</html>
