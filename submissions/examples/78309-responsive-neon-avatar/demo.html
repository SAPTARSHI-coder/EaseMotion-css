<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Responsive neon avatar component built with HTML and CSS"
  >

  <title>Responsive Neon Avatar</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="page">
    <section class="showcase" aria-labelledby="avatar-title">

      <span class="eyebrow">EASEMOTION CSS</span>

      <h1 id="avatar-title">
        Responsive Neon Avatar
      </h1>

      <p class="intro">
        A reusable avatar component with animated neon rings,
        status indicators, and responsive sizing.
      </p>

      <div class="avatar-stage">

        <div class="avatar-wrapper">

          <div class="neon-ring ring-one"></div>
          <div class="neon-ring ring-two"></div>

          <div class="avatar">

            <div class="avatar-image" role="img" aria-label="User avatar">
              <span class="avatar-letter">A</span>
            </div>

            <span class="status" aria-label="Online"></span>

          </div>

        </div>

        <div class="avatar-info">
          <h2>Alex Morgan</h2>

          <p>
            Full Stack Developer
          </p>

          <span class="online-label">
            <span></span>
            Available now
          </span>
        </div>

      </div>

      <div class="avatar-sizes" aria-label="Avatar sizes">

        <div class="size-item">
          <span class="mini-avatar">
            A
          </span>
          <small>Small</small>
        </div>

        <div class="size-item">
          <span class="medium-avatar">
            A
          </span>
          <small>Medium</small>
        </div>

        <div class="size-item">
          <span class="large-avatar">
            A
          </span>
          <small>Large</small>
        </div>

      </div>

    </section>
  </main>
</body>
</html>
