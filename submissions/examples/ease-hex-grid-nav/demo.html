<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hex Grid Nav · Hexagonal Grid with Glow</title>

    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <div class="card">
        <h2>🔷 Hex Grid Nav</h2>
        <p class="sub">items in hexagonal grid with hover glow</p>

        <!-- === HEX GRID NAV === -->
        <nav class="hex-nav" id="hexNav">
            <ul class="hex-grid">
                <li class="hex-item">
                    <a href="#" class="hex-link" data-tooltip="Dashboard">
                        <i class="fas fa-chart-pie"></i>
                        <span>Dashboard</span>
                    </a>
                </li>
                <li class="hex-item">
                    <a href="#" class="hex-link" data-tooltip="Analytics">
                        <i class="fas fa-chart-line"></i>
                        <span>Analytics</span>
                    </a>
                </li>
                <li class="hex-item">
                    <a href="#" class="hex-link" data-tooltip="Reports">
                        <i class="fas fa-file-alt"></i>
                        <span>Reports</span>
                    </a>
                </li>
                <li class="hex-item">
                    <a href="#" class="hex-link" data-tooltip="Settings">
                        <i class="fas fa-cog"></i>
                        <span>Settings</span>
                    </a>
                </li>
                <li class="hex-item">
                    <a href="#" class="hex-link" data-tooltip="Users">
                        <i class="fas fa-users"></i>
                        <span>Users</span>
                    </a>
                </li>
                <li class="hex-item">
                    <a href="#" class="hex-link" data-tooltip="Messages">
                        <i class="fas fa-envelope"></i>
                        <span>Messages</span>
                    </a>
                </li>
                <li class="hex-item">
                    <a href="#" class="hex-link" data-tooltip="Tasks">
                        <i class="fas fa-tasks"></i>
                        <span>Tasks</span>
                    </a>
                </li>
                <li class="hex-item">
                    <a href="#" class="hex-link" data-tooltip="Calendar">
                        <i class="fas fa-calendar"></i>
                        <span>Calendar</span>
                    </a>
                </li>
                <li class="hex-item">
                    <a href="#" class="hex-link" data-tooltip="Help">
                        <i class="fas fa-question-circle"></i>
                        <span>Help</span>
                    </a>
                </li>
            </ul>
        </nav>

        <p style="margin-top: 2rem; font-size: 0.85rem; color: #64748b;">
            Hover · watch the hexagons glow with light
        </p>
    </div>

    <!-- Embedded JavaScript -->
    <script>
        (function() {
            'use strict';

            const nav = document.getElementById('hexNav');
            const items = document.querySelectorAll('.hex-link');

            // Click feedback
            items.forEach(item => {
                item.addEventListener('click', function(e) {
                    e.preventDefault();
                    const parent = this.closest('.hex-item');
                    parent.classList.add('clicked');
                    setTimeout(() => {
                        parent.classList.remove('clicked');
                    }, 300);
                    const label = this.getAttribute('data-tooltip') || 'Item';
                    console.log(`🔷 Selected: ${label}`);
                });

                // Keyboard accessibility
                item.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        this.click();
                    }
                });
            });

            // Keyboard navigation between items
            const hexItems = document.querySelectorAll('.hex-item');
            hexItems.forEach((item, index) => {
                item.addEventListener('keydown', function(e) {
                    const currentIndex = Array.from(hexItems).indexOf(this);
                    let newIndex = -1;

                    if (e.key === 'ArrowRight') {
                        e.preventDefault();
                        newIndex = (currentIndex + 1) % hexItems.length;
                    } else if (e.key === 'ArrowLeft') {
                        e.preventDefault();
                        newIndex = (currentIndex - 1 + hexItems.length) % hexItems.length;
                    } else if (e.key === 'ArrowDown') {
                        e.preventDefault();
                        newIndex = (currentIndex + 3) % hexItems.length;
                    } else if (e.key === 'ArrowUp') {
                        e.preventDefault();
                        newIndex = (currentIndex - 3 + hexItems.length) % hexItems.length;
                    }

                    if (newIndex !== -1) {
                        hexItems[newIndex].querySelector('.hex-link').focus();
                    }
                });
            });

            console.log('🔷 Hex grid nav initialized!');

        })();
    </script>

</body>
</html>
