<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EaseMotion CSS - RTL Toggle</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <input type="checkbox" id="rtl-toggle" class="ease-rtl-checkbox" aria-label="Toggle RTL mode">
  <label for="rtl-toggle" class="ease-toggle-label">
    <span>LTR</span><span>RTL</span>
  </label>

  <div class="ease-rtl-wrapper">
    <div class="ease-rtl-card">
      <!-- Avatar (Item 1) -->
      <div class="ease-layout-item">
        <div class="ease-avatar">👤</div>
      </div>
      <!-- Text Content (Item 2) -->
      <div class="ease-layout-item ease-text-group">
        <h3>Alex Developer</h3>
        <p>Software Engineer</p>
      </div>
      <!-- Action Button (Item 3) -->
      <div class="ease-layout-item">
        <button class="ease-action-btn">Follow</button>
      </div>
    </div>
  </div>

  <p style="color: #64748b; font-family: system-ui; font-size: 0.875rem; text-align: center; max-width: 400px; line-height: 1.5;">
    Notice how it smoothly swaps layout positions. Native CSS properties like <code>direction: rtl</code> cannot be animated. We achieved this 60fps interpolation using nested 3D counter-rotations.
  </p>
</body>
</html>
