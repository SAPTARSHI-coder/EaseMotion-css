<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Rotate-Fade Progress Bar - Minimalist Tech</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="layout-container">
        
        <header class="section-header">
            <h1 class="title">Upload Status</h1>
            <p class="subtitle">A minimalist tech layout featuring a dynamic rotate-fade progress indicator.</p>
        </header>

        <div class="dashboard-area">
            
            <div class="card">
                
                <div class="controls">
                    <p class="instruction-text">Initiate the upload to observe the animation sequence.</p>
                    
                    <!-- 
                       Pure CSS State Management for Demo
                       We use a checkbox to toggle the progress state.
                    -->
                    <input type="checkbox" id="progress-trigger" class="progress-input">
                    
                    <label for="progress-trigger" class="btn-trigger">
                        <span class="btn-text-idle">Start Upload</span>
                        <span class="btn-text-active">Reset</span>
                    </label>
                    
                    <!-- The Progress Component -->
                    <div class="progress-container">
                        
                        <div class="progress-info">
                            <span class="file-name">dataset_v3_final.csv</span>
                            <span class="file-size">42.5 MB</span>
                        </div>
                        
                        <div class="progress-track">
                            <!-- 
                              The actual filling bar.
                              The Rotate-Fade animation is applied to a pseudo-element on this bar.
                            -->
                            <div class="progress-fill rotate-fade-active"></div>
                        </div>
                        
                        <div class="progress-status">
                            <span class="status-text idle-text">Waiting...</span>
                            <span class="status-text active-text">Uploading...</span>
                            <span class="status-text complete-text">Done</span>
                        </div>
                        
                    </div>
                </div>
                
            </div>
            
        </div>
    </div>

</body>
</html>
