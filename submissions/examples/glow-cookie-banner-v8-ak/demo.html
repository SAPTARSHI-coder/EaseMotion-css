<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cookie Banner — EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <p class="label">Pure CSS Floating Cookie Privacy Banner</p>

  <div class="ease-cookie-banner-v8">
    <div class="ease-cookie-header-v8">
      <span>🍪</span> Privacy Notice
    </div>
    <p class="ease-cookie-desc-v8">
      We use cookies to improve your experience. Click Accept to consent.
    </p>
    <div class="ease-cookie-actions-v8">
      <button class="ease-cookie-btn-v8 ease-cookie-btn-decline-v8">Decline</button>
      <button class="ease-cookie-btn-v8 ease-cookie-btn-accept-v8">Accept</button>
    </div>
  </div>

</body>
</html>
