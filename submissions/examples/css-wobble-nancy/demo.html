<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SaaS Showcase Wobble Popover</title>
  <style>
    /* --- CSS Custom Properties for Configuration --- */
    :root {
      --popover-bg: #ffffff;
      --popover-border: #e2e8f0;
      --popover-radius: 12px;
      --popover-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
      --popover-width: 280px;
      
      /* Animation Variables */
      --wobble-duration: 0.6s;
      --wobble-timing: cubic-bezier(0.25, 1, 0.5, 1);
      --wobble-scale-start: 0.92;
    }

    /* --- Container & Layout --- */
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .saas-card {
      position: relative;
      display: inline-block;
    }

    /* --- Interactive Trigger Trigger (SaaS Button Aesthetic) --- */
    .popover-trigger {
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.2);
      transition: background 0.2s ease;
    }

    .popover-trigger:hover {
      background: linear-gradient(135deg, #4338ca, #6d28d9);
    }

    /* --- Popover Component Structural Setup --- */
    .popover-content {
      position: absolute;
      bottom: calc(100% + 12px);
      left: 50%;
      transform: translateX(-50%) scale(var(--wobble-scale-start));
      width: var(--popover-width);
      background: var(--popover-bg);
      border: 1px solid var(--popover-border);
      border-radius: var(--popover-radius);
      box-shadow: var(--popover-shadow);
      padding: 16px;
      z-index: 100;
      
      /* Hidden by default */
      opacity: 0;
      pointer-events: none;
      visibility: hidden;
      transform-origin: bottom center;
    }

    /* --- Keyframe Wobble Transition Matrix --- */
    @keyframes wobbleFocus {
      0% {
        transform: translateX(-50%) scale(var(--wobble-scale-start)) rotate(0deg);
        opacity: 0;
      }
      15% {
        transform: translateX(-50%) scale(1.05) rotate(-3deg);
        opacity: 1;
      }
      30% {
        transform: translateX(-50%) scale(0.98) rotate(2deg);
      }
      45% {
        transform: translateX(-50%) scale(1.02) rotate(-1deg);
      }
      60% {
        transform: translateX(-50%) scale(0.99) rotate(1deg);
      }
      75% {
        transform: translateX(-50%) scale(1.005) rotate(-0.5deg);
      }
      100% {
        transform: translateX(-50%) scale(1) rotate(0deg);
        opacity: 1;
      }
    }

    /* --- Pure CSS Focus & Hover States (No JS) --- */
    .saas-card:hover .popover-content,
    .popover-trigger:focus + .popover-content,
    .popover-content:focus-within {
      opacity: 1;
      pointer-events: auto;
      visibility: visible;
      animation: wobbleFocus var(--wobble-duration) var(--wobble-timing) forwards;
    }

    /* --- Aesthetic SaaS Styling Elements inside Popover --- */
    .popover-header {
      font-size: 14px;
      font-weight: 600;
      color: #0f172a;
      margin: 0 0 6px 0;
    }

    .popover-body {
      font-size: 13px;
      color: #475569;
      line-height: 1.5;
      margin: 0 0 12px 0;
    }

    .popover-link {
      font-size: 13px;
      color: #4f46e5;
      text-decoration: none;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
    }

    .popover-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <!-- Wrapper providing local context positioning -->
  <div class="saas-card">
    
    <!-- Trigger Element (Accessible via TAB key) -->
    <button class="popover-trigger" aria-haspopup="true">View Feature Analytics</button>
    
    <!-- Popover Element -->
    <div class="popover-content" role="tooltip">
      <h3 class="popover-header">⚡ Real-time Conversion</h3>
      <p class="popover-body">Track conversion metrics, customer onboarding drops, and checkout success velocities instantly.</p>
      <a href="#details" class="popover-link">Explore documentation →</a>
    </div>

  </div>

</body>
</html>
