<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CSS morphing shape loader that continuously morphs between circle, square, and triangle">
  <title>Morphing Shape Loader — EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="msl-nav">
    <span class="msl-nav__brand">EaseMotion</span>
    <span class="msl-nav__gap"></span>
    <span class="msl-nav__item">Components</span>
  </nav>

  <header class="msl-header">
    <h1 class="msl-header__title">Morphing Shape Loader</h1>
    <p class="msl-header__sub">A shape that continuously morphs between circle, square, and triangle.</p>
  </header>

  <main class="msl-showcase">

    <div class="msl-group">
      <div class="msl-loader" aria-label="Loading" role="status"></div>
      <span class="msl-label">Default</span>
    </div>

    <div class="msl-group">
      <div class="msl-loader msl-loader--accent" aria-label="Loading" role="status"></div>
      <span class="msl-label">Accent</span>
    </div>

    <div class="msl-group">
      <div class="msl-loader msl-loader--large" aria-label="Loading" role="status"></div>
      <span class="msl-label">Large</span>
    </div>

  </main>

</body>
</html>
