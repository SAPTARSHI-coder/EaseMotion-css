<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Morph Glow Progress Bar</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<section class="container">

<h1>Product Catalog Progress</h1>
<p>Animated Morph-Glow Progress Bars</p>

<div class="card">

<div class="item">
<div class="label">
<span>Wireless Headphones</span>
<span>92%</span>
</div>

<div class="progress">
<div class="fill p92"></div>
</div>

</div>

<div class="item">
<div class="label">
<span>Gaming Mouse</span>
<span>76%</span>
</div>

<div class="progress">
<div class="fill p76"></div>
</div>

</div>

<div class="item">
<div class="label">
<span>Mechanical Keyboard</span>
<span>63%</span>
</div>

<div class="progress">
<div class="fill p63"></div>
</div>

</div>

</div>

</section>

</body>
</html>
