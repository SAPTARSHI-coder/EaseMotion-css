<title>Slide-Up Modal | EaseMotion CSS</title>

<link rel="stylesheet" href="style.css">
```

</head>

<body>

```
<main class="page">

    <h1>Slide-Up Modal</h1>

    <p>
        A simple CSS-only modal with a smooth slide-up entrance animation.
    </p>

    <div class="modal-overlay">

        <div class="modal">

            <button class="close" aria-label="Close modal">
                &times;
            </button>

            <div class="icon">
                ✓
            </div>

            <h2>Payment Successful</h2>

            <p class="message">
                Your payment has been successfully completed.
            </p>

            <div class="details">

                <div>
                    <span>Amount</span>
                    <strong>₹8,500</strong>
                </div>

                <div>
                    <span>Status</span>
                    <strong>Completed</strong>
                </div>

            </div>

            <button class="button">
                Continue
            </button>

        </div>

    </div>

</main>
```

</body>
</html>
