<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steane Code SC - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css"></head><body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030712; color: #ffffff;">

    <div class="ease-card ease-card-glass steane-container">
        <div class="steane-header">
            <h2>Steane Code</h2>
            <span class="ease-badge ease-badge-success">Quantum Error Correction</span>
        </div>
        
        <div class="steane-screen ease-center">
            <div class="steane-flux flux-steane-a"></div>
            <div class="steane-flux flux-steane-b"></div>
            <div class="steane-boundary-ring"></div>
            <div class="steane-core ease-center"></div>
        </div>

        <div class="steane-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">7-Qubit CSS Construction &amp; Transversal Hadamard</span>
            <button class="ease-btn ease-btn-success ease-btn-sm ease-hover-grow">Run Steane Code</button>
        </div>
    </div></body></html>
