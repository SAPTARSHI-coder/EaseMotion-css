<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-stock-candlestick-chart demo</title>
</head>
<body>
<div class="scc-chart">
  <div class="scc-head">
    <b>ACME</b>
    <span>+2.4%</span>
  </div>
  <div class="scc-plot">
    <i class="scc-candle scc-up"></i>
    <i class="scc-candle scc-down"></i>
    <i class="scc-candle scc-up"></i>
    <i class="scc-candle scc-up"></i>
    <i class="scc-candle scc-down"></i>
  </div>
  <div class="scc-foot"><span>VOL 1.2M</span><span>LAST 154.30</span></div>
</div>
</body>
</html>
