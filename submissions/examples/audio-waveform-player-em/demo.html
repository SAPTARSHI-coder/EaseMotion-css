<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive Audio Waveform Player · EaseMotion</title>
  <meta name="description" content="A custom audio player card featuring animated CSS equalizer bars, play/pause state morphing, and seek bar progress styling." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Demo Page Background -->
  <main class="demo-page">
    <div class="demo-content">
      <h1 class="demo-title">Audio Player UI</h1>
      <p class="demo-subtitle">A custom styled media player with CSS-driven waveform equalizer animations.</p>
    </div>

    <!-- =========================================================
         AUDIO PLAYER CARD
    ========================================================== -->
    <article class="audio-player" aria-label="Audio Player">
      
      <!-- Track Metadata & Controls -->
      <div class="player-header">
        
        <!-- Artwork -->
        <div class="player-artwork">
          <div class="player-artwork__inner">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 18V5l12-2v13"></path>
              <circle cx="6" cy="18" r="3"></circle>
              <circle cx="18" cy="16" r="3"></circle>
            </svg>
          </div>
        </div>

        <!-- Track Info -->
        <div class="player-info">
          <h2 class="player-info__title">EaseMotion Podcast</h2>
          <p class="player-info__artist">Episode 42: UI Animation</p>
        </div>

        <!-- Play / Pause Toggle Button -->
        <button type="button" class="player-toggle" id="play-pause-btn" aria-label="Play Track" aria-pressed="false">
          <!-- Play Icon -->
          <svg class="icon-play" viewBox="0 0 24 24" fill="currentColor">
            <polygon points="5 3 19 12 5 21 5 3"></polygon>
          </svg>
          <!-- Pause Icon -->
          <svg class="icon-pause" viewBox="0 0 24 24" fill="currentColor">
            <rect x="6" y="4" width="4" height="16"></rect>
            <rect x="14" y="4" width="4" height="16"></rect>
          </svg>
        </button>

      </div>

      <!-- Waveform Equalizer -->
      <div class="player-waveform" id="waveform-container" aria-hidden="true">
        <!-- Bars are generated via JS or statically in HTML -->
        <div class="wave-bar" style="--anim-delay: 0.1s;"></div>
        <div class="wave-bar" style="--anim-delay: 0.4s;"></div>
        <div class="wave-bar" style="--anim-delay: 0.2s;"></div>
        <div class="wave-bar" style="--anim-delay: 0.7s;"></div>
        <div class="wave-bar" style="--anim-delay: 0.5s;"></div>
        <div class="wave-bar" style="--anim-delay: 0.3s;"></div>
        <div class="wave-bar" style="--anim-delay: 0.8s;"></div>
        <div class="wave-bar" style="--anim-delay: 0.6s;"></div>
        <div class="wave-bar" style="--anim-delay: 0.2s;"></div>
        <div class="wave-bar" style="--anim-delay: 0.5s;"></div>
        <div class="wave-bar" style="--anim-delay: 0.9s;"></div>
        <div class="wave-bar" style="--anim-delay: 0.4s;"></div>
        <div class="wave-bar" style="--anim-delay: 0.1s;"></div>
        <div class="wave-bar" style="--anim-delay: 0.3s;"></div>
        <div class="wave-bar" style="--anim-delay: 0.7s;"></div>
        <div class="wave-bar" style="--anim-delay: 0.5s;"></div>
        <div class="wave-bar" style="--anim-delay: 0.2s;"></div>
        <div class="wave-bar" style="--anim-delay: 0.8s;"></div>
        <div class="wave-bar" style="--anim-delay: 0.4s;"></div>
        <div class="wave-bar" style="--anim-delay: 0.1s;"></div>
      </div>

      <!-- Progress / Seek Bar -->
      <div class="player-progress">
        <span class="player-time player-time--current" id="time-current">0:00</span>
        
        <!-- Range slider for seeking -->
        <div class="seek-wrapper">
          <input type="range" class="seek-slider" id="seek-slider" min="0" max="100" value="0" aria-label="Seek position" />
          <div class="seek-fill" id="seek-fill"></div>
        </div>
        
        <span class="player-time player-time--total">4:20</span>
      </div>

    </article>
  </main>

  <!-- Dummy Audio Element (In real world, you would use this for playback) -->
  <audio id="audio-element" preload="metadata">
    <!-- <source src="your-audio.mp3" type="audio/mpeg"> -->
  </audio>

  <script src="script.js"></script>
</body>
</html>
