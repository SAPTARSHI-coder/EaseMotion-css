<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floating Glassmorphic Audio Player</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="audio-player">

        <!-- Play state toggle (must be first child for ~ selectors to reach every sibling below) -->
        <input type="checkbox" id="playToggle" class="play-toggle" hidden>

        <!-- Album Section -->
        <div class="player-header">
            <img
                src="https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?w=300"
                alt="Album Cover"
                class="album-cover"
            >

            <div class="track-info">
                <h2>Midnight Drive</h2>
                <p>EaseMotion Studio</p>
            </div>
        </div>

        <!-- Equalizer -->
        <div class="equalizer">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
        </div>

        <!-- Progress -->
        <div class="progress-container">
            <span class="time-current">0:32</span>

            <input
                type="range"
                min="0"
                max="100"
                value="35"
                class="progress-bar"
            >

            <span class="time-total">3:48</span>
        </div>

        <!-- Controls -->
        <div class="controls">

            <button class="control-btn" aria-label="Previous">
                ⏮
            </button>

            <label for="playToggle" class="play-btn" aria-label="Play/Pause"></label>

            <button class="control-btn" aria-label="Next">
                ⏭
            </button>

        </div>

        <!-- Volume -->
        <div class="volume-container">

            <span>🔊</span>

            <input
                type="range"
                min="0"
                max="100"
                value="80"
                class="volume-slider"
            >

        </div>

    </div>

</body>
</html>
