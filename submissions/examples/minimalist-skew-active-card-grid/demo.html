<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Skew-Active Card Grid - Minimalist Tech</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="layout-container">
        
        <header class="section-header">
            <h1 class="title">Pricing Tiers</h1>
            <p class="subtitle">Select a plan to see the skew-active confirmation effect.</p>
        </header>

        <div class="card-grid">
            
            <!-- We use radio buttons + labels to manage the active state without JS -->
            <!-- Card 1 -->
            <input type="radio" name="pricing-tier" id="tier-hobby" class="tier-radio" checked>
            <label for="tier-hobby" class="skew-card">
                <div class="card-content">
                    <div class="tier-badge">Hobby</div>
                    <h3 class="card-title">$0<span class="period">/mo</span></h3>
                    <p class="card-desc">Perfect for side projects and learning the platform.</p>
                    
                    <ul class="feature-list">
                        <li>Up to 3 projects</li>
                        <li>Community support</li>
                        <li>Basic analytics</li>
                    </ul>
                </div>
                <!-- The Skew Background Element -->
                <div class="skew-bg"></div>
                <!-- Selection Indicator -->
                <div class="selection-check">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"></polyline></svg>
                </div>
            </label>

            <!-- Card 2 -->
            <input type="radio" name="pricing-tier" id="tier-pro" class="tier-radio">
            <label for="tier-pro" class="skew-card">
                <div class="card-content">
                    <div class="tier-badge popular">Pro</div>
                    <h3 class="card-title">$29<span class="period">/mo</span></h3>
                    <p class="card-desc">Advanced features for professional developers.</p>
                    
                    <ul class="feature-list">
                        <li>Unlimited projects</li>
                        <li>Priority email support</li>
                        <li>Advanced analytics & logs</li>
                    </ul>
                </div>
                <!-- The Skew Background Element -->
                <div class="skew-bg"></div>
                <!-- Selection Indicator -->
                <div class="selection-check">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"></polyline></svg>
                </div>
            </label>

            <!-- Card 3 -->
            <input type="radio" name="pricing-tier" id="tier-enterprise" class="tier-radio">
            <label for="tier-enterprise" class="skew-card">
                <div class="card-content">
                    <div class="tier-badge">Enterprise</div>
                    <h3 class="card-title">$99<span class="period">/mo</span></h3>
                    <p class="card-desc">Dedicated infrastructure for large-scale teams.</p>
                    
                    <ul class="feature-list">
                        <li>Dedicated account manager</li>
                        <li>24/7 phone support</li>
                        <li>Custom SLAs</li>
                    </ul>
                </div>
                <!-- The Skew Background Element -->
                <div class="skew-bg"></div>
                <!-- Selection Indicator -->
                <div class="selection-check">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"></polyline></svg>
                </div>
            </label>

        </div>
        
    </div>
</body>
</html>
