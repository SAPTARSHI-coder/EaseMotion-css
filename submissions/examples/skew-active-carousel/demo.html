<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Skew-Active Carousel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="carousel-container">
        <h2 class="carousel-title">Select Payment Method</h2>
        <div class="carousel-track">
            <label class="carousel-item">
                <input type="radio" name="payment" value="card" checked>
                <div class="carousel-card">
                    <div class="card-icon">💳</div>
                    <div class="card-text">Credit Card</div>
                </div>
            </label>
            <label class="carousel-item">
                <input type="radio" name="payment" value="paypal">
                <div class="carousel-card">
                    <div class="card-icon">🅿️</div>
                    <div class="card-text">PayPal</div>
                </div>
            </label>
            <label class="carousel-item">
                <input type="radio" name="payment" value="crypto">
                <div class="carousel-card">
                    <div class="card-icon">₿</div>
                    <div class="card-text">Crypto</div>
                </div>
            </label>
            <label class="carousel-item">
                <input type="radio" name="payment" value="bank">
                <div class="carousel-card">
                    <div class="card-icon">🏦</div>
                    <div class="card-text">Bank Transfer</div>
                </div>
            </label>
        </div>
        <button class="checkout-btn">Continue to Review</button>
    </div>
</body>
</html>
