<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Skew-Active Carousel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="checkout-layout">
        <h2 class="section-title">Select Payment Method</h2>
        
        <div class="carousel-container">
            <input type="radio" name="payment" id="card1" class="carousel-input" checked>
            <input type="radio" name="payment" id="card2" class="carousel-input">
            <input type="radio" name="payment" id="card3" class="carousel-input">
            
            <div class="carousel-cards">
                <label for="card1" class="carousel-card card-item-1">
                    <div class="card-chip"></div>
                    <div class="card-number">**** **** **** 1234</div>
                    <div class="card-name">Visa</div>
                </label>
                
                <label for="card2" class="carousel-card card-item-2">
                    <div class="card-chip"></div>
                    <div class="card-number">**** **** **** 5678</div>
                    <div class="card-name">Mastercard</div>
                </label>
                
                <label for="card3" class="carousel-card card-item-3">
                    <div class="card-chip"></div>
                    <div class="card-number">**** **** **** 9012</div>
                    <div class="card-name">Amex</div>
                </label>
            </div>
            
            <div class="carousel-indicators">
                <label for="card1" class="indicator"></label>
                <label for="card2" class="indicator"></label>
                <label for="card3" class="indicator"></label>
            </div>
        </div>
        
        <button class="checkout-btn">Proceed to Checkout</button>
    </div>
</body>
</html>
