<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Pure CSS 3D Diamond Facet Edge animation"
  >

  <title>Diamond Facet Edge</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="demo">
    <section class="card" aria-label="Diamond facet edge 3D animation">

      <header class="header">
        <span class="eyebrow">CSS 3D EFFECT</span>

        <h1>Diamond Facet</h1>

        <p>
          A pure CSS 3D diamond with animated facet edges.
        </p>
      </header>

      <div class="stage">

        <div class="diamond-scene">

          <div class="diamond">

            <div class="facet facet-top"></div>
            <div class="facet facet-right"></div>
            <div class="facet facet-bottom"></div>
            <div class="facet facet-left"></div>

            <div class="facet facet-back"></div>

            <div class="diamond-core"></div>

          </div>

        </div>

        <div class="reflection"></div>

      </div>

      <div class="features">

        <div class="feature">
          <strong>3D Transform</strong>
          <span>CSS perspective</span>
        </div>

        <div class="feature">
          <strong>Facet Motion</strong>
          <span>Smooth animation</span>
        </div>

        <div class="feature">
          <strong>Performance</strong>
          <span>GPU friendly</span>
        </div>

      </div>

    </section>
  </main>

</body>
</html>
