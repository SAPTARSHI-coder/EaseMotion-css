<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glowing Avatar with SaaS Modern Styling | EaseMotion CSS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="avatar-card">
        <div class="avatar-wrapper">
            <div class="avatar-ring"></div>
            <div class="avatar-img-container" role="img" aria-label="Alex Morgan profile picture">AM</div>
            <div class="status-badge" aria-label="Online status"></div>
        </div>
        <div class="avatar-info">
            <h3 class="avatar-name">Alex Morgan</h3>
            <p class="avatar-role">Lead Product Designer</p>
        </div>
    </div>
</body>
</html>
