<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facade Reveal · Building Facade with Windows Lighting</title>
    <meta name="description" content="Interactive building facade reveal with windows lighting up, floor-by-floor animation, and architectural details.">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1 class="title">🏢 FACADE REVEAL</h1>
        
        <div class="canvas-wrapper">
            <canvas id="facadeCanvas" width="600" height="500"></canvas>
            <div class="glow-overlay"></div>
        </div>

        <div class="controls">
            <div class="button-group">
                <button class="reveal-btn" id="revealBtn">✨ REVEAL</button>
                <button class="reset-btn" id="resetBtn">⟳ RESET</button>
                <button class="toggle-btn" id="toggleBtn">⏸️ PAUSE</button>
            </div>
            <div class="speed-control">
                <label>Speed</label>
                <input type="range" id="speedSlider" min="1" max="10" value="5">
                <span id="speedLabel">5</span>
                <label>Floors</label>
                <input type="range" id="floorsSlider" min="3" max="10" value="7">
                <span id="floorsLabel">7</span>
            </div>
        </div>

        <div class="info">
            <span>🏢 FACADE REVEAL</span>
            <small>windows · lighting · architecture</small>
        </div>
        <div class="hint">
            <span>✨ click to reveal the building floor by floor</span>
        </div>
    </div>

    <script>
        (function() {
            const canvas = document.getElementById('facadeCanvas');
            const ctx = canvas.getContext('2d');
            const W = 600, H = 500;
            
            const revealBtn = document.getElementById('revealBtn');
            const resetBtn = document.getElementById('resetBtn');
            const toggleBtn = document.getElementById('toggleBtn');
            const speedSlider = document.getElementById('speedSlider');
            const speedLabel = document.getElementById('speedLabel');
            const floorsSlider = document.getElementById('floorsSlider');
            const floorsLabel = document.getElementById('floorsLabel');

            let isAnimating = true;
            let speed = 5;
            let time = 0;
            let numFloors = 7;
            let revealProgress = 0;
            let isRevealing = false;
            let isRevealed = false;
            
            // ---- Window States ----
            let windows = [];
            let windowStates = [];

            // ---- Generate Windows ----
            function generateWindows() {
                windows = [];
                windowStates = [];
                
                const floors = numFloors;
                const windowsPerFloor = 6 + Math.floor(Math.random() * 4);
                const buildingWidth = 300;
                const buildingHeight = floors * 50 + 20;
                const startX = (W - buildingWidth) / 2;
                const startY = (H - buildingHeight) / 2;
                const floorHeight = 45;
                const windowWidth = 25;
                const windowHeight = 30;
                const spacing = 8;
                
                for (let f = 0; f < floors; f++) {
                    const floorY = startY + f * floorHeight + 10;
                    const numWindows = windowsPerFloor + (f % 2 === 0 ? 0 : -1);
                    const totalWidth = numWindows * (windowWidth + spacing) - spacing;
                    const offsetX = (buildingWidth - totalWidth) / 2;
                    
                    for (let w = 0; w < numWindows; w++) {
                        const wx = startX + offsetX + w * (windowWidth + spacing);
                        const wy = floorY + 8;
                        
                        // Random initial state (some windows lit, some dark)
                        const lit = Math.random() < 0.2;
                        const brightness = lit ? 0.3 + Math.random() * 0.4 : 0;
                        const color = lit ? 
                            `hsl(${40 + Math.random() * 20}, ${60 + Math.random() * 30}%, ${40 + Math.random() * 30}%)` : 
                            `hsl(220, 10%, ${10 + Math.random() * 10}%)`;
                        
                        windows.push({
                            x: wx,
                            y: wy,
                            w: windowWidth,
                            h: windowHeight,
                            lit: lit,
                            brightness: brightness,
                            targetBrightness: lit ? 0.5 : 0,
                            color: color,
                            floor: f,
                            index: w,
                            delay: Math.random() * 2,
                            flickerPhase: Math.random() * Math.PI * 2
                        });
                        
                        windowStates.push({
                            revealed: false,
                            progress: 0
                        });
                    }
                }
                
                // Add some random flickering windows
                for (let w of windows) {
                    if (Math.random() < 0.3) {
                        w.flickerSpeed = 0.02 + Math.random() * 0.05;
                    } else {
                        w.flickerSpeed = 0;
                    }
                }
            }

            // ---- Reveal Building ----
            function revealBuilding() {
                if (isRevealing) return;
                isRevealing = true;
                isRevealed = false;
                revealProgress = 0;
                
                // Reset window states
                for (let i = 0; i < windowStates.length; i++) {
                    windowStates[i].revealed = false;
                    windowStates[i].progress = 0;
                }
            }

            // ---- Reset ----
            function resetFacade() {
                isRevealing = false;
                isRevealed = false;
                revealProgress = 0;
                generateWindows();
                render();
            }

            // ---- Update Windows ----
            function updateWindows() {
                const dt = 0.02 * (speed / 5);
                
                if (isRevealing && revealProgress < 1) {
                    revealProgress += 0.004 * (speed / 5);
                    if (revealProgress > 1) {
                        revealProgress = 1;
                        isRevealing = false;
                        isRevealed = true;
                    }
                }
                
                // Reveal windows floor by floor
                const floors = numFloors;
                const revealedFloors = Math.floor(revealProgress * floors);
                const floorProgress = (revealProgress * floors) % 1;
                
                for (let i = 0; i < windows.length; i++) {
                    const w = windows[i];
                    const floor = w.floor;
                    
                    if (floor < revealedFloors) {
                        windowStates[i].revealed = true;
                        windowStates[i].progress = 1;
                    } else if (floor === revealedFloors) {
                        windowStates[i].revealed = true;
                        windowStates[i].progress = Math.min(1, floorProgress * 1.5);
                    } else {
                        windowStates[i].revealed = false;
                        windowStates[i].progress = 0;
                    }
                }
                
                // Update window brightness
                for (let w of windows) {
                    // Flicker
                    if (w.flickerSpeed > 0 && w.lit) {
                        w.flickerPhase += w.flickerSpeed * dt;
                        const flicker = 0.7 + Math.sin(w.flickerPhase) * 0.3;
                        w.brightness = w.targetBrightness * flicker * (0.8 + Math.random() * 0.2);
                    } else if (w.lit) {
                        w.brightness = w.targetBrightness * (0.8 + Math.random() * 0.2);
                    }
                }
            }

            // ---- Draw Building ----
            function drawBuilding() {
                const floors = numFloors;
                const buildingWidth = 300;
                const buildingHeight = floors * 50 + 20;
                const startX = (W - buildingWidth) / 2;
                const startY = (H - buildingHeight) / 2;
                
                ctx.save();
                
                // Building shadow
                ctx.shadowColor = 'rgba(0,0,0,0.2)';
                ctx.shadowBlur = 30;
                ctx.shadowOffsetX = 5;
                ctx.shadowOffsetY = 5;
                
                // Building body
                const buildingGrad = ctx.createLinearGradient(startX, startY, startX + buildingWidth, startY);
                buildingGrad.addColorStop(0, '#1a2a3a');
                buildingGrad.addColorStop(0.3, '#2a3a4a');
                buildingGrad.addColorStop(0.7, '#2a3a4a');
                buildingGrad.addColorStop(1, '#1a2a3a');
                
                ctx.fillStyle = buildingGrad;
                ctx.shadowColor = 'rgba(0,0,0,0.15)';
                ctx.shadowBlur = 20;
                ctx.shadowOffsetX = 4;
                ctx.shadowOffsetY = 4;
                ctx.fillRect(startX, startY, buildingWidth, buildingHeight);
                
                // Building outline
                ctx.shadowBlur = 0;
                ctx.strokeStyle = 'rgba(200, 220, 240, 0.05)';
                ctx.lineWidth = 1;
                ctx.strokeRect(startX, startY, buildingWidth, buildingHeight);
                
                // Floors
                for (let f = 0; f < floors; f++) {
                    const floorY = startY + f * 50;
                    
                    // Floor line
                    ctx.strokeStyle = 'rgba(200, 220, 240, 0.03)';
                    ctx.lineWidth = 0.5;
                    ctx.beginPath();
                    ctx.moveTo(startX + 10, floorY);
                    ctx.lineTo(startX + buildingWidth - 10, floorY);
                    ctx.stroke();
                }
                
                // Windows
                for (let i = 0; i < windows.length; i++) {
                    const w = windows[i];
                    const state = windowStates[i];
                    const progress = state.progress;
                    const revealed = state.revealed;
                    
                    if (!revealed && progress < 0.01) continue;
                    
                    const alpha = Math.min(1, progress * 1.5);
                    const brightness = w.lit ? w.brightness * alpha : 0;
                    
                    // Window glow
                    if (brightness > 0.05) {
                        const glowGrad = ctx.createRadialGradient(
                            w.x + w.w/2, w.y + w.h/2, 0,
                            w.x + w.w/2, w.y + w.h/2, w.w * 0.8
                        );
                        glowGrad.addColorStop(0, `rgba(255, 200, 100, ${brightness * 0.1 * alpha})`);
                        glowGrad.addColorStop(0.5, `rgba(255, 200, 100, ${brightness * 0.05 * alpha})`);
                        glowGrad.addColorStop(1, 'rgba(255, 200, 100, 0)');
                        ctx.fillStyle = glowGrad;
                        ctx.beginPath();
                        ctx.arc(w.x + w.w/2, w.y + w.h/2, w.w * 0.8, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    
                    // Window frame
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = brightness > 0.1 ? 
                        `rgba(255, 220, 150, ${brightness * 0.3 * alpha})` : 
                        `rgba(40, 50, 60, ${0.3 + progress * 0.5})`;
                    
                    // Window body
                    const windowColor = brightness > 0.1 ?
                        `rgba(255, 220, 150, ${brightness * 0.6 * alpha})` :
                        `rgba(20, 30, 40, ${0.4 + progress * 0.5})`;
                    
                    ctx.fillStyle = windowColor;
                    ctx.fillRect(w.x, w.y, w.w, w.h);
                    
                    // Window border
                    ctx.strokeStyle = `rgba(200, 220, 240, ${0.05 + progress * 0.1})`;
                    ctx.lineWidth = 0.5;
                    ctx.strokeRect(w.x, w.y, w.w, w.h);
                    
                    // Window cross (mullions)
                    ctx.strokeStyle = `rgba(200, 220, 240, ${0.03 + progress * 0.05})`;
                    ctx.lineWidth = 0.5;
                    ctx.beginPath();
                    ctx.moveTo(w.x + w.w/2, w.y);
                    ctx.lineTo(w.x + w.w/2, w.y + w.h);
                    ctx.moveTo(w.x, w.y + w.h/2);
                    ctx.lineTo(w.x + w.w, w.y + w.h/2);
                    ctx.stroke();
                    
                    // Window highlight (when lit)
                    if (brightness > 0.2) {
                        ctx.fillStyle = `rgba(255, 255, 255, ${brightness * 0.1 * alpha})`;
                        ctx.fillRect(w.x + 2, w.y + 2, w.w * 0.3, w.h * 0.2);
                    }
                }
                
                // Roof details
                ctx.shadowBlur = 0;
                ctx.fillStyle = 'rgba(30, 40, 50, 0.5)';
                ctx.fillRect(startX + 10, startY - 5, buildingWidth - 20, 5);
                
                // Antenna
                ctx.fillStyle = 'rgba(50, 60, 70, 0.3)';
                ctx.fillRect(startX + buildingWidth/2 - 2, startY - 25, 4, 20);
                ctx.fillRect(startX + buildingWidth/2 - 6, startY - 28, 12, 3);
                
                // Ground
                const groundGrad = ctx.createLinearGradient(0, H - 20, 0, H);
                groundGrad.addColorStop(0, 'rgba(20, 30, 40, 0)');
                groundGrad.addColorStop(0.5, 'rgba(20, 30, 40, 0.2)');
                groundGrad.addColorStop(1, 'rgba(20, 30, 40, 0.4)');
                ctx.fillStyle = groundGrad;
                ctx.fillRect(0, H - 20, W, 20);
                
                ctx.restore();
            }

            // ---- Render ----
            function render() {
                // Background - night sky
                const skyGrad = ctx.createRadialGradient(W/2, 0, 0, W/2, 0, H);
                skyGrad.addColorStop(0, '#0a1a2a');
                skyGrad.addColorStop(0.3, '#0d1a25');
                skyGrad.addColorStop(0.6, '#0a1520');
                skyGrad.addColorStop(0.8, '#080e18');
                skyGrad.addColorStop(1, '#040608');
                ctx.fillStyle = skyGrad;
                ctx.fillRect(0, 0, W, H);
                
                // Stars
                for (let i = 0; i < 30; i++) {
                    const x = (i * 137 + 20) % W;
                    const y = (i * 97 + 30) % (H * 0.6);
                    const size = 0.5 + (i % 3) * 0.5;
                    const twinkle = 0.3 + Math.sin(time * 0.015 + i * 2.5) * 0.3 + 0.3;
                    ctx.fillStyle = `rgba(200, 220, 255, ${twinkle * 0.4})`;
                    ctx.beginPath();
                    ctx.arc(x, y, size, 0, Math.PI * 2);
                    ctx.fill();
                }
                
                drawBuilding();
                
                // Status info
                ctx.save();
                ctx.fillStyle = 'rgba(200, 220, 240, 0.2)';
                ctx.font = '13px monospace';
                ctx.textAlign = 'right';
                ctx.textBaseline = 'bottom';
                const revealedCount = windowStates.filter(s => s.revealed).length;
                ctx.fillText(`Windows: ${revealedCount}/${windows.length}`, W - 20, H - 10);
                
                ctx.textAlign = 'left';
                const status = isRevealed ? '✨ REVEALED' : 
                              isRevealing ? '🔄 REVEALING...' : 
                              '🏢 READY';
                ctx.fillText(status, 20, H - 10);
                ctx.restore();
            }

            // ---- Animation Loop ----
            function animate() {
                if (!isAnimating) {
                    requestAnimationFrame(animate);
                    return;
                }
                
                time += 0.01;
                
                updateWindows();
                render();
                
                requestAnimationFrame(animate);
            }

            // ---- Toggle Animation ----
            function toggleAnimation() {
                isAnimating = !isAnimating;
                toggleBtn.textContent = isAnimating ? '⏸️ PAUSE' : '▶️ PLAY';
            }

            // ---- Update Labels ----
            speedSlider.addEventListener('input', function() {
                speedLabel.textContent = this.value;
            });
            floorsSlider.addEventListener('input', function() {
                numFloors = parseInt(this.value);
                floorsLabel.textContent = numFloors;
                resetFacade();
            });

            // ---- Event Listeners ----
            revealBtn.addEventListener('click', revealBuilding);
            resetBtn.addEventListener('click', resetFacade);
            toggleBtn.addEventListener('click', toggleAnimation);

            // ---- Keyboard Shortcuts ----
            document.addEventListener('keydown', function(e) {
                if (e.key === ' ' || e.key === 'Space') {
                    e.preventDefault();
                    if (!isRevealing && !isRevealed) {
                        revealBuilding();
                    }
                }
                if (e.key === 'r' || e.key === 'R') {
                    resetFacade();
                }
                if (e.key === 'p' || e.key === 'P') {
                    toggleAnimation();
                }
            });

            // ---- Initialize ----
            generateWindows();
            render();
            animate();

            console.log('🏢 Facade Reveal · Click Reveal to illuminate the building floor by floor!');
        })();
    </script>
</body>
</html>
