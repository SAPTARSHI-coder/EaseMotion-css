<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EaseMotion — Tabs & Keyboard Shortcuts</title>
  <link rel="stylesheet" href="../../core/variables.css">
  <link rel="stylesheet" href="../../components/tabs.css">
  <link rel="stylesheet" href="../../components/kbd.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="demo-container">
    <h1>Tabs & Keyboard Shortcuts</h1>

    <section class="demo-section">
      <h3>Tabs</h3>
      <div class="ease-tabs">
        <button class="ease-tab ease-tab-active" onclick="switchTab(this, 'tab1')">Overview</button>
        <button class="ease-tab" onclick="switchTab(this, 'tab2')">Features</button>
        <button class="ease-tab" onclick="switchTab(this, 'tab3')">Pricing</button>
      </div>
      <div id="tab1" class="tab-content active">
        <p>This is the overview tab content.</p>
      </div>
      <div id="tab2" class="tab-content">
        <p>Feature details go here.</p>
      </div>
      <div id="tab3" class="tab-content">
        <p>Pricing information displayed here.</p>
      </div>
    </section>

    <section class="demo-section">
      <h3>Keyboard Shortcuts</h3>
      <div class="shortcuts-grid">
        <div class="shortcut-row">
          <span class="shortcut-desc">Copy</span>
          <span class="ease-kbd">Ctrl</span> + <span class="ease-kbd">C</span>
        </div>
        <div class="shortcut-row">
          <span class="shortcut-desc">Paste</span>
          <span class="ease-kbd">Ctrl</span> + <span class="ease-kbd">V</span>
        </div>
        <div class="shortcut-row">
          <span class="shortcut-desc">Save</span>
          <span class="ease-kbd">Ctrl</span> + <span class="ease-kbd">S</span>
        </div>
        <div class="shortcut-row">
          <span class="shortcut-desc">Undo</span>
          <span class="ease-kbd">Ctrl</span> + <span class="ease-kbd">Z</span>
        </div>
        <div class="shortcut-row">
          <span class="shortcut-desc">Find</span>
          <span class="ease-kbd">Ctrl</span> + <span class="ease-kbd">F</span>
        </div>
      </div>
    </section>
  </div>

  <script>
    function switchTab(btn, tabId) {
      document.querySelectorAll('.ease-tab').forEach(t => t.classList.remove('ease-tab-active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      btn.classList.add('ease-tab-active');
      document.getElementById(tabId).classList.add('active');
    }
  </script>
</body>
</html>
