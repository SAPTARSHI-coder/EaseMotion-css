<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Scale-Hover Badge - Minimalist Tech</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="layout-container">
        
        <header class="section-header">
            <h1 class="title">Interactive Labels</h1>
            <p class="subtitle">A minimalist tech badge component featuring tactile scale-hover feedback and active depression states.</p>
        </header>

        <div class="dashboard-area">
            
            <div class="card">
                
                <div class="badge-container">
                    
                    <!-- Badge 1: Default/Interactive -->
                    <a href="#" class="badge scale-hover color-blue">
                        <svg class="badge-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 16 16 12 12 8"></polyline><line x1="8" y1="12" x2="16" y2="12"></line></svg>
                        <span class="badge-text">v3.0 Release Notes</span>
                    </a>
                    
                    <!-- Badge 2: Default/Interactive -->
                    <a href="#" class="badge scale-hover color-emerald">
                        <span class="badge-dot"></span>
                        <span class="badge-text">API Status</span>
                    </a>
                    
                    <!-- Badge 3: Removable tag style -->
                    <div class="badge scale-hover tag-style">
                        <span class="badge-text">production-env</span>
                        <button class="remove-btn" aria-label="Remove tag">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                        </button>
                    </div>

                    <!-- Badge 4: Removable tag style -->
                    <div class="badge scale-hover tag-style">
                        <span class="badge-text">eu-central-1</span>
                        <button class="remove-btn" aria-label="Remove tag">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                        </button>
                    </div>
                    
                </div>
                
            </div>
            
        </div>
    </div>

</body>
</html>
