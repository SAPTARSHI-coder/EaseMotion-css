<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Text Reveal Mask — EaseMotion CSS</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="page">
        <section class="demo" aria-labelledby="demo-title">
            <div class="content">
                <p class="eyebrow">EaseMotion CSS · Text</p>

                <div class="headline-wrap">
                    <h1 id="demo-title" class="headline" aria-label="Ideas become motion">
                        <span class="line">
                            <span class="line-mask">
                                <span class="line-text">Ideas become</span>
                            </span>
                        </span>

                        <span class="line">
                            <span class="line-mask">
                                <span class="line-text">motion.</span>
                            </span>
                        </span>
                    </h1>
                </div>

                <p class="description">
                    A line-by-line headline reveal using a sliding mask and pure CSS.
                </p>

                <input class="replay-toggle" type="checkbox" id="replay" aria-label="Replay text reveal animation">

                <label class="replay-button" for="replay">
                    <span class="button-icon" aria-hidden="true">↻</span>
                    Replay reveal
                </label>
            </div>
        </section>
    </main>
</body>

</html>
