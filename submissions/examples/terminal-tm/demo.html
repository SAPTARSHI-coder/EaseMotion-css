<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Terminal — EaseMotion CSS</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="terminal-page-tm" data-palette="warm">
  <h1 class="terminal-h-tm">Terminal</h1>
  <p class="terminal-lede-tm">A self-contained demo with three variants of the effect.</p>
  <section class="terminal-row-tm">
    <article class="terminal-1-wrap-tm">
      <div class="terminal-1-tm"></div>
      <span class="terminal-lbl-tm">Example One</span>
    </article>
    <article class="terminal-2-wrap-tm">
      <div class="terminal-2-tm"></div>
      <span class="terminal-lbl-tm">Example Two</span>
    </article>
    <article class="terminal-3-wrap-tm">
      <div class="terminal-3-tm"></div>
      <span class="terminal-lbl-tm">Example Three</span>
    </article>
  </section>
</main>
</body>
</html>
