<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rotation Tooltip Hover Scale</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>Rotation Tooltip Demo</h1>
    <p>Hover over any button to reveal the tooltip.</p>

    <div class="tooltip-grid">

        <div class="tooltip-container">
            <button class="tooltip-trigger">Hover Me</button>
            <span class="tooltip-box top">Premium Tooltip</span>
        </div>

        <div class="tooltip-container">
            <button class="tooltip-trigger">Profile</button>
            <span class="tooltip-box bottom">View Profile</span>
        </div>

        <div class="tooltip-container">
            <button class="tooltip-trigger">Settings</button>
            <span class="tooltip-box left">Customize Preferences</span>
        </div>

        <div class="tooltip-container">
            <button class="tooltip-trigger">Share</button>
            <span class="tooltip-box right">Share this page</span>
        </div>

    </div>
</div>

</body>
</html>
