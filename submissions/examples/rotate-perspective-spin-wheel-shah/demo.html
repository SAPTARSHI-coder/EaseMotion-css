<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rotate Perspective Spin Wheel</title>
  <link rel="stylesheet" href="./style.css">
  <style>
    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background-color: #0f172a;
      font-family: system-ui, -apple-system, sans-serif;
    }
    
    .demo-container {
      /* Applying perspective to the parent creates the 3D space */
      perspective: 1000px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .demo-wheel {
      width: 120px;
      height: 120px;
      background: conic-gradient(from 0deg, #ec4899, #8b5cf6, #3b82f6, #14b8a6, #ec4899);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 30px rgba(139, 92, 246, 0.5);
    }
    
    .demo-inner {
      width: 80px;
      height: 80px;
      background: #0f172a;
      border-radius: 50%;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="demo-container">
    <!-- Using the utility class -->
    <div class="demo-wheel ease-anim-rotate-perspective-spin-wheel">
      <div class="demo-inner">Spin</div>
    </div>
  </div>

</body>
</html>
