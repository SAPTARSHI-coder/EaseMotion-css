<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glowing Toggle - Dark Mode</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="demo">
    <section class="toggle-card">
      <span class="status-text">Dark Mode</span>

      <label class="glow-toggle" aria-label="Toggle dark mode">
        <input type="checkbox">
        <span class="toggle-track">
          <span class="toggle-thumb"></span>
        </span>
      </label>
    </section>
  </main>

</body>
</html>
