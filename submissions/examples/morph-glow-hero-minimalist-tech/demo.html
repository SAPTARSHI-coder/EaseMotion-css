<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CSS Morph-Glow Hero Section with minimalist tech styling. Pure CSS hero with morphing blob glow, clean card layout, and light theme.">
  <title>Morph-Glow Hero Section – Minimalist Tech Layouts</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="mgh-hero">
    <div class="mgh-hero__glow" aria-hidden="true"></div>

    <div class="mgh-hero__inner">
      <span class="mgh-hero__chip">Minimalist Tech</span>
      <h1 class="mgh-hero__title">Ship code<br>that matters.</h1>
      <p class="mgh-hero__desc">Tools and workflows for developers who value clean architecture, fast iteration, and zero bloat.</p>
      <div class="mgh-hero__row">
        <a href="#" class="mgh-hero__cta mgh-hero__cta--primary">Start Building</a>
        <a href="#" class="mgh-hero__cta mgh-hero__cta--subtle">Read the Blog</a>
      </div>
    </div>

    <div class="mgh-hero__stats">
      <div class="mgh-hero__stat">
        <span class="mgh-hero__stat-num">12K+</span>
        <span class="mgh-hero__stat-label">Developers</span>
      </div>
      <div class="mgh-hero__stat">
        <span class="mgh-hero__stat-num">98%</span>
        <span class="mgh-hero__stat-label">Satisfaction</span>
      </div>
      <div class="mgh-hero__stat">
        <span class="mgh-hero__stat-num">&lt;50ms</span>
        <span class="mgh-hero__stat-label">Avg Response</span>
      </div>
    </div>
  </header>

</body>
</html>
