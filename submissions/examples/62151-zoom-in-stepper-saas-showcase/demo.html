<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zoom-In Stepper</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<section class="stepper-section">

    <h1>Zoom-In Stepper</h1>
    <p class="subtitle">
        A modern onboarding process for SaaS products.
    </p>

    <div class="stepper">

        <div class="progress-line"></div>

        <div class="step active">
            <div class="circle">1</div>
            <h3>Create Account</h3>
            <p>Sign up using your email address.</p>
        </div>

        <div class="step">
            <div class="circle">2</div>
            <h3>Connect Workspace</h3>
            <p>Configure your workspace settings.</p>
        </div>

        <div class="step">
            <div class="circle">3</div>
            <h3>Invite Team</h3>
            <p>Collaborate with your teammates.</p>
        </div>

        <div class="step">
            <div class="circle">4</div>
            <h3>Launch</h3>
            <p>Start using your dashboard instantly.</p>
        </div>

    </div>

</section>

</body>
</html>
