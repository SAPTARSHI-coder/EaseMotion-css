<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Scroll Snap Gallery</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="gallery" aria-label="Scroll Snap Gallery">

    <section class="slide slide-1">
      <div class="content">
        <h1>Mountain Escape</h1>
        <p>Pure CSS full-screen scroll snap gallery.</p>
      </div>
    </section>

    <section class="slide slide-2">
      <div class="content">
        <h1>Ocean View</h1>
        <p>Smooth snapping between sections.</p>
      </div>
    </section>

    <section class="slide slide-3">
      <div class="content">
        <h1>Forest Trail</h1>
        <p>Responsive and accessible design.</p>
      </div>
    </section>

    <section class="slide slide-4">
      <div class="content">
        <h1>Desert Adventure</h1>
        <p>No JavaScript required.</p>
      </div>
    </section>

  </div>

</body>
</html>
