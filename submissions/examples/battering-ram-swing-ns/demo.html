<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Battering Ram Swing — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Battering Ram Swing demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Battering Ram Swing</h1>
      <p class="lede">Battering ram pendulum swing impact</p>
    </header>

    <section class="ease-battering-ram-swing" data-demo="battering-ram-swing" aria-live="polite">
      <div class="ease-battering-ram-swing__housing">
        <div class="ease-battering-ram-swing__bezel">
          <div class="ease-battering-ram-swing__face">
            <div class="ease-battering-ram-swing__readout">
              <span class="ease-battering-ram-swing__label">Battering Ram Swing</span>
              <span class="ease-battering-ram-swing__value">LIVE</span>
            </div>
            <div class="ease-battering-ram-swing__motion" aria-hidden="true">
              <span class="ease-battering-ram-swing__a"></span>
              <span class="ease-battering-ram-swing__b"></span>
              <span class="ease-battering-ram-swing__c"></span>
              <span class="ease-battering-ram-swing__d"></span>
            </div>
            <div class="ease-battering-ram-swing__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-battering-ram-swing__controls">
          <button type="button" class="ease-battering-ram-swing__btn primary">Engage</button>
          <button type="button" class="ease-battering-ram-swing__btn">Reset</button>
          <label class="ease-battering-ram-swing__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-battering-ram-swing__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
