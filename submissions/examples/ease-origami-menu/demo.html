<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EaseMotion — 3D Origami Menu</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <div class="origami-menu">
    <input type="checkbox" id="origami-toggle" class="origami-toggle" />

    <label for="origami-toggle" class="origami-trigger">
      <span class="trigger-icon">
        <span></span>
        <span></span>
        <span></span>
      </span>
      <span class="trigger-label">Menu</span>
    </label>

    <nav class="origami-nav" aria-label="Main navigation">
      <a href="#home">Home</a>
      <a href="#about">About</a>
      <a href="#work">Work</a>
      <a href="#contact">Contact</a>
    </nav>
  </div>

  <main>
    <section id="home">
      <p class="eyebrow">EaseMotion CSS</p>
      <h1>Pure CSS<br />Origami Menu</h1>
      <p>
        Click the menu button to unfold the navigation using a
        3D paper-fold animation.
      </p>
    </section>
  </main>

</body>
</html>
