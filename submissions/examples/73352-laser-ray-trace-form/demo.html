<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>Laser Ray Trace Form</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">
    <section class="form-card" aria-labelledby="form-title">

      <div class="card-glow" aria-hidden="true"></div>

      <div class="intro">
        <span class="eyebrow">LASER RAY TRACE</span>

        <h1 id="form-title">Build something precise.</h1>

        <p>
          A pure CSS form concept featuring animated laser traces,
          focused inputs, responsive layout, and dark mode support.
        </p>
      </div>

      <form class="laser-form">

        <div class="field-row">

          <div class="field">
            <label for="first-name">First name</label>

            <div class="input-wrap">
              <input
                id="first-name"
                name="first-name"
                type="text"
                placeholder="Avinash"
                autocomplete="given-name"
                required
              >
              <span class="laser-line" aria-hidden="true"></span>
              <span class="laser-corner top-left" aria-hidden="true"></span>
              <span class="laser-corner bottom-right" aria-hidden="true"></span>
            </div>
          </div>

          <div class="field">
            <label for="last-name">Last name</label>

            <div class="input-wrap">
              <input
                id="last-name"
                name="last-name"
                type="text"
                placeholder="Kumar"
                autocomplete="family-name"
                required
              >
              <span class="laser-line" aria-hidden="true"></span>
              <span class="laser-corner top-left" aria-hidden="true"></span>
              <span class="laser-corner bottom-right" aria-hidden="true"></span>
            </div>
          </div>

        </div>

        <div class="field">
          <label for="email">Email address</label>

          <div class="input-wrap">
            <input
              id="email"
              name="email"
              type="email"
              placeholder="you@example.com"
              autocomplete="email"
              required
            >
            <span class="laser-line" aria-hidden="true"></span>
            <span class="laser-corner top-left" aria-hidden="true"></span>
            <span class="laser-corner bottom-right" aria-hidden="true"></span>
          </div>
        </div>

        <div class="field">
          <label for="subject">Subject</label>

          <div class="input-wrap">
            <select id="subject" name="subject" required>
              <option value="" selected disabled>Select a topic</option>
              <option value="project">Project inquiry</option>
              <option value="collaboration">Collaboration</option>
              <option value="feedback">Feedback</option>
              <option value="other">Other</option>
            </select>

            <span class="laser-line" aria-hidden="true"></span>
            <span class="laser-corner top-left" aria-hidden="true"></span>
            <span class="laser-corner bottom-right" aria-hidden="true"></span>
          </div>
        </div>

        <div class="field">
          <label for="message">Message</label>

          <div class="input-wrap textarea-wrap">
            <textarea
              id="message"
              name="message"
              rows="6"
              placeholder="Tell us about your idea..."
              required
            ></textarea>

            <span class="laser-line" aria-hidden="true"></span>
            <span class="laser-corner top-left" aria-hidden="true"></span>
            <span class="laser-corner bottom-right" aria-hidden="true"></span>
          </div>
        </div>

        <label class="consent">
          <input type="checkbox" required>
          <span>
            I agree to receive a response regarding this request.
          </span>
        </label>

        <button class="submit-button" type="submit">
          <span>Send message</span>
          <span class="button-ray" aria-hidden="true"></span>
          <span aria-hidden="true">↗</span>
        </button>

      </form>

    </section>
  </main>

</body>
</html>
