<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Minimal FAQ Grid</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<section class="faq-grid">

<div class="faq">
<button class="question">
What is EaseMotion CSS?
<span>+</span>
</button>
<div class="answer">
<p>A modern collection of beautiful reusable CSS components.</p>
</div>
</div>

<div class="faq">
<button class="question">
Is it responsive?
<span>+</span>
</button>
<div class="answer">
<p>Yes. Every component is designed for desktop and mobile devices.</p>
</div>
</div>

<div class="faq">
<button class="question">
Can I customize it?
<span>+</span>
</button>
<div class="answer">
<p>Absolutely. Colors, spacing and typography are easy to modify.</p>
</div>
</div>

<div class="faq">
<button class="question">
Does it require frameworks?
<span>+</span>
</button>
<div class="answer">
<p>No. Everything is built using pure HTML, CSS and JavaScript.</p>
</div>
</div>

</section>

<script src="script.js"></script>

</body>
</html>
