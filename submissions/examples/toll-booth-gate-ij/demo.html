<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-toll-booth-gate</title>
</head>
<body>
<main class="tbg-card">
  <header class="tbg-head">
    <h1 class="tbg-title">Toll Plaza</h1>
    <span class="tbg-lane">Lane 3</span>
  </header>
  <section class="tbg-booth" aria-label="toll booth">
    <span class="tbg-roof"></span>
    <span class="tbg-window"></span>
    <span class="tbg-sign">TOLL</span>
    <span class="tbg-lane-light"></span>
    <span class="tbg-gate">
      <span class="tbg-arm"></span>
      <span class="tbg-arm-base"></span>
    </span>
    <span class="tbg-car"></span>
  </section>
  <section class="tbg-display">
    <span class="tbg-fee-label">Fee</span>
    <strong class="tbg-fee">$2.50</strong>
  </section>
  <footer class="tbg-foot">
    <span class="tbg-msg">Tap card to pay</span>
    <span class="tbg-pay">PAY</span>
  </footer>
</main>
</body>
</html>
