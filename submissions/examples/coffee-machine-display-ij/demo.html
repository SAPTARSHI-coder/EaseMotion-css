<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-coffee-machine-display demo</title>
</head>
<body>
<div class="cmd-machine">
  <span class="cmd-brand">BREW</span>
  <div class="cmd-screen">
    <span class="cmd-drink">ESPRESSO</span>
    <span class="cmd-temp">92</span>
    <div class="cmd-steam">
      <span class="cmd-puff"></span>
      <span class="cmd-puff"></span>
    </div>
  </div>
  <div class="cmd-pad">
    <span class="cmd-btn">ESP</span>
    <span class="cmd-btn">LAT</span>
    <span class="cmd-btn">CAP</span>
  </div>
  <div class="cmd-tray">
    <span class="cmd-cup"></span>
    <span class="cmd-drip"></span>
  </div>
</div>
</body>
</html>
