<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Accordion Timeline Journey Component</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../easemotion.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>Accordion Timeline Journey</h1>
      <p>Click timeline nodes to expand accordion detail drawers.</p>
    </header>

    <main class="timeline-container">
      <div class="timeline-item" onclick="toggleTimeline(this)">
        <div class="timeline-node">1</div>
        <div class="timeline-content">
          <h3>Phase 1: Research</h3>
          <div class="accordion-drawer">Detailed architectural research and planning.</div>
        </div>
      </div>
      <div class="timeline-item" onclick="toggleTimeline(this)">
        <div class="timeline-node">2</div>
        <div class="timeline-content">
          <h3>Phase 2: Execution</h3>
          <div class="accordion-drawer">Modular CSS component implementation.</div>
        </div>
      </div>
    </main>
  </div>

  <script>
    function toggleTimeline(item) {
      item.classList.toggle('active');
    }
  </script>
</body>
</html>
