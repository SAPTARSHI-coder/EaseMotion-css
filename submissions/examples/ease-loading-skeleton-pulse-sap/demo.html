<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading Skeleton Pulse</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <h1>Loading Skeleton Pulse</h1>

    <div class="skeleton-card" role="status" aria-label="Loading content">
      <div class="skel skel-avatar"></div>
      <div class="skel-lines">
        <div class="skel skel-line" style="width: 70%;"></div>
        <div class="skel skel-line" style="width: 90%;"></div>
        <div class="skel skel-line" style="width: 50%;"></div>
      </div>
    </div>
  </main>
</body>
</html>
