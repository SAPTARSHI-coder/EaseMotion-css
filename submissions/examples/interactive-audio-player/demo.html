<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Audio Player</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="page">
    <section class="audio-player" aria-label="Audio player">

      <div class="album-art" aria-hidden="true">
        <span>♪</span>
      </div>

      <div class="player-content">
        <div class="track-info">
          <p class="eyebrow">NOW PLAYING</p>
          <h1>Midnight Dreams</h1>
          <p class="artist">EaseMotion Studio</p>
        </div>

        <div class="progress-section">
          <div class="progress-bar" role="progressbar"
               aria-label="Audio progress"
               aria-valuemin="0"
               aria-valuemax="100"
               aria-valuenow="42">
            <span class="progress"></span>
          </div>

          <div class="time">
            <span>1:24</span>
            <span>3:32</span>
          </div>
        </div>

        <div class="controls">
          <button class="icon-button" type="button" aria-label="Previous track">
            <span>⏮</span>
          </button>

          <button class="play-button" type="button" aria-label="Play">
            <span>▶</span>
          </button>

          <button class="icon-button" type="button" aria-label="Next track">
            <span>⏭</span>
          </button>
        </div>

        <div class="volume">
          <span aria-hidden="true">🔊</span>

          <div class="volume-bar" role="slider"
               aria-label="Volume"
               aria-valuemin="0"
               aria-valuemax="100"
               aria-valuenow="70"
               tabindex="0">
            <span class="volume-level"></span>
          </div>
        </div>
      </div>

    </section>
  </main>
</body>
</html>
