<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EaseMotion Accordion Demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      padding: 2rem;
      max-width: 600px;
      margin: 0 auto;
      background: #f8fafc;
    }
    @media (prefers-color-scheme: dark) {
      body {
        background: #0f172a;
      }
    }
  </style>
</head>
<body>

  <details class="ease-accordion">
    <summary class="ease-accordion-header">
      What is EaseMotion?
      <span class="ease-accordion-icon">↓</span>
    </summary>
    <div class="ease-accordion-content">
      <div class="ease-accordion-inner">
        <div class="ease-accordion-body">
          EaseMotion is a modern CSS animation framework designed for simple, fluid motion.
        </div>
      </div>
    </div>
  </details>

  <details class="ease-accordion">
    <summary class="ease-accordion-header">
      How does this accordion work?
      <span class="ease-accordion-icon">↓</span>
    </summary>
    <div class="ease-accordion-content">
      <div class="ease-accordion-inner">
        <div class="ease-accordion-body">
          It uses the CSS Grid <code>1fr</code> transition trick alongside native HTML details/summary elements to achieve smooth, JavaScript-free height animation.
        </div>
      </div>
    </div>
  </details>

</body>
</html>
