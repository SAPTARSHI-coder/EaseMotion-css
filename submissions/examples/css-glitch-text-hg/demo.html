<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Only Glitch Text Effect</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="glitch-container">
    <!-- The data-text attribute feeds the content property in CSS pseudo-elements -->
    <h1 class="glitch-text" data-text="CYBERPUNK">CYBERPUNK</h1>
    <p class="subtitle">Hardware-accelerated zero-JS glitch animation using <code>clip-path</code> polygon slices.</p>
  </main>

</body>
</html>
