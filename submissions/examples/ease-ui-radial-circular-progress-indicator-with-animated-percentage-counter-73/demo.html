<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
Radial Circular Progress Indicator
</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<main class="container">


<div class="progress-card">


<h1>
Performance
</h1>


<p>
Animated Circular Progress
</p>



<div class="progress">


<svg>

<circle 
class="bg"
cx="100"
cy="100"
r="85">
</circle>


<circle 
class="bar"
cx="100"
cy="100"
r="85">
</circle>


</svg>



<div class="counter">

<span id="value">
0
</span>

%

</div>


</div>



<button id="animate">
Start Progress
</button>


</div>


</main>



<script src="script.js"></script>


</body>

</html>
