<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />
  <meta
    name="description"
    content="Glassmorphism Spinner with Cyberpunk styling - CSS-only component."
  />
  <title>Cyberpunk Glassmorphism Spinner</title>

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <section class="spinner-card" aria-label="Loading">
      <div class="card-glow card-glow-one"></div>
      <div class="card-glow card-glow-two"></div>

      <div class="spinner-shell">
        <div class="spinner spinner-primary" aria-hidden="true">
          <span></span>
          <span></span>
          <span></span>
        </div>

        <div class="spinner-core" aria-hidden="true">
          <div class="core-dot"></div>
        </div>
      </div>

      <div class="loading-content">
        <p class="eyebrow">SYSTEM ONLINE</p>

        <h1>Loading<span class="loading-dots">...</span></h1>

        <p class="loading-text">
          Initializing cyber interface
        </p>
      </div>

      <div class="status-bar" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
      </div>
    </section>
  </main>
</body>
</html>
