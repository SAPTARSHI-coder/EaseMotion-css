<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Material Design Dynamic Flyout Popover</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="md-popover-container">
    <!-- Checkbox input for Pure CSS State Toggle -->
    <input type="checkbox" id="md-popover-toggle" class="popover-toggle" aria-hidden="true">

    <!-- Material Trigger Button -->
    <label for="md-popover-toggle" class="md-btn" role="button" tabindex="0" aria-haspopup="true" aria-expanded="false">
      <span>Show Details</span>
    </label>

    <!-- Material Dynamic Flyout Popover Panel -->
    <div class="md-popover" role="dialog" aria-label="Material Dynamic Popover Panel">
      <div class="popover-header">
        <h2 class="popover-title">Notification Settings</h2>
        <label for="md-popover-toggle" class="close-btn" aria-label="Close dialog">✕</label>
      </div>
      <div class="popover-body">
        <p>This dynamic popover follows Material Design guidelines, complete with elevation surfaces, rounded corners, and pure CSS state transitions using EaseMotion tokens.</p>
        <div class="popover-actions">
          <label for="md-popover-toggle" class="md-text-btn">Cancel</label>
          <label for="md-popover-toggle" class="md-text-btn">Save</label>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Keyboard accessibility support for label acting as a button
    document.querySelector('.md-btn').addEventListener('keydown', (e) => {
      if (e.key === ' ' || e.key === 'Enter') {
        e.preventDefault();
        document.getElementById('md-popover-toggle').click();
      }
    });
  </script>

</body>
</html>
