<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Glowing Tag Chips — EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <p class="label">Pure CSS Interactive Glowing Tag Chips</p>
  <div class="demo-row">
    <!-- Default Purple -->
    <span class="ease-glow-chip">
      <span class="ease-glow-chip__icon">⚡</span> Motion
    </span>

    <!-- Emerald -->
    <span class="ease-glow-chip ease-glow-chip--emerald">
      <span class="ease-glow-chip__icon">🌱</span> Organic
    </span>

    <!-- Rose -->
    <span class="ease-glow-chip ease-glow-chip--rose">
      <span class="ease-glow-chip__icon">🔥</span> Trending
    </span>

    <!-- Cyan -->
    <span class="ease-glow-chip ease-glow-chip--cyan">
      <span class="ease-glow-chip__icon">💎</span> Premium
    </span>
  </div>

</body>
</html>
