<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Budget Ring Chart - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Dashboard Card -->
  <main class="dashboard-card" role="region" aria-label="Monthly Budget Allocation Dashboard">
    
    <header class="chart-header">
      <h1 class="title">Monthly Budget</h1>
      <p class="subtitle">Interactive ring chart showing allocation across core categories.</p>
    </header>

    <div class="chart-content">

      <!-- The SVG Donut Chart Visual -->
      <div class="chart-visual-wrapper">
        <svg class="ring-svg" viewBox="0 0 100 100" aria-label="Budget donut chart breakdown">
          
          <!-- Housing Segment (40%) -->
          <circle class="ring-segment housing" cx="50" cy="50" r="40" 
                  tabindex="0" role="img" aria-label="Housing: 40% allocation"></circle>
          
          <!-- Food & Dining Segment (25%) -->
          <circle class="ring-segment food" cx="50" cy="50" r="40" 
                  tabindex="0" role="img" aria-label="Food and Dining: 25% allocation"></circle>
          
          <!-- Transportation Segment (15%) -->
          <circle class="ring-segment transportation" cx="50" cy="50" r="40" 
                  tabindex="0" role="img" aria-label="Transportation: 15% allocation"></circle>
          
          <!-- Utilities Segment (12%) -->
          <circle class="ring-segment utilities" cx="50" cy="50" r="40" 
                  tabindex="0" role="img" aria-label="Utilities: 12% allocation"></circle>
          
          <!-- Savings Segment (8%) -->
          <circle class="ring-segment savings" cx="50" cy="50" r="40" 
                  tabindex="0" role="img" aria-label="Savings: 8% allocation"></circle>

        </svg>

        <!-- Center Details Display (Replaces values based on hovered/focused segment) -->
        <div class="chart-center-details" aria-live="polite">
          
          <!-- Default (when no segments are hovered) -->
          <div class="default-details">
            <p class="center-title">Total</p>
            <p class="center-val" style="color: #fff;">$5,000</p>
          </div>

          <!-- Housing hover details -->
          <div class="h-details">
            <p class="center-title" style="color: var(--c-housing);">Housing</p>
            <p class="center-val" style="color: var(--c-housing);">$2,000</p>
          </div>

          <!-- Food hover details -->
          <div class="f-details">
            <p class="center-title" style="color: var(--c-food);">Food</p>
            <p class="center-val" style="color: var(--c-food);">$1,250</p>
          </div>

          <!-- Trans hover details -->
          <div class="t-details">
            <p class="center-title" style="color: var(--c-trans);">Transit</p>
            <p class="center-val" style="color: var(--c-trans);">$750</p>
          </div>

          <!-- Utilities hover details -->
          <div class="u-details">
            <p class="center-title" style="color: var(--c-utils);">Utilities</p>
            <p class="center-val" style="color: var(--c-utils);">$600</p>
          </div>

          <!-- Savings hover details -->
          <div class="s-details">
            <p class="center-title" style="color: var(--c-savings);">Savings</p>
            <p class="center-val" style="color: var(--c-savings);">$400</p>
          </div>

        </div>
      </div>

      <!-- Legend Sidebar -->
      <div class="chart-legend" role="list">
        
        <!-- Housing Item -->
        <div class="legend-item l-housing" role="listitem">
          <div class="legend-label-box">
            <div class="color-dot dot-housing"></div>
            <span class="legend-text">Housing</span>
          </div>
          <span class="legend-percent">40%</span>
        </div>

        <!-- Food Item -->
        <div class="legend-item l-food" role="listitem">
          <div class="legend-label-box">
            <div class="color-dot dot-food"></div>
            <span class="legend-text">Food & Dining</span>
          </div>
          <span class="legend-percent">25%</span>
        </div>

        <!-- Transportation Item -->
        <div class="legend-item l-trans" role="listitem">
          <div class="legend-label-box">
            <div class="color-dot dot-trans"></div>
            <span class="legend-text">Transportation</span>
          </div>
          <span class="legend-percent">15%</span>
        </div>

        <!-- Utilities Item -->
        <div class="legend-item l-utils" role="listitem">
          <div class="legend-label-box">
            <div class="color-dot dot-utils"></div>
            <span class="legend-text">Utilities</span>
          </div>
          <span class="legend-percent">12%</span>
        </div>

        <!-- Savings Item -->
        <div class="legend-item l-savings" role="listitem">
          <div class="legend-label-box">
            <div class="color-dot dot-savings"></div>
            <span class="legend-text">Savings</span>
          </div>
          <span class="legend-percent">8%</span>
        </div>

      </div>

    </div>

  </main>

</body>
</html>
