<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Popover Card</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="popover-container">
    <button
      class="popover-trigger"
      aria-label="Open Popover">
      Hover or Focus Me
    </button>

    <div
      class="popover-card"
      role="tooltip"
      aria-live="polite">

      <h3>Popover Card</h3>

      <p>
        This floating card appears near the trigger element
        using only CSS hover and focus interactions.
      </p>

      <div class="popover-actions">
        <button class="popover-btn primary">Accept</button>
        <button class="popover-btn secondary">Dismiss</button>
      </div>

    </div>
  </div>

</body>
</html>
