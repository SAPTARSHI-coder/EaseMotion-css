<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coffee Maker Settings | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="cmstage">
    <div class="cmunit">
      <div class="cmscreen">
        BREW SIZE
        <strong>12 oz</strong>
      </div>
      <div class="cmselector">
        <div class="cmseg"><span class="cmseg-name">Mild</span><span class="cmseg-amount">6 oz</span></div>
        <div class="cmseg active"><span class="cmseg-name">Regular</span><span class="cmseg-amount">12 oz</span></div>
        <div class="cmseg"><span class="cmseg-name">Bold</span><span class="cmseg-amount">16 oz</span></div>
        <div class="cmseg"><span class="cmseg-name">Strong</span><span class="cmseg-amount">20 oz</span></div>
      </div>
      <button class="cmaction" type="button">Brew Now</button>
    </div>
  </div>
</body>
</html>
