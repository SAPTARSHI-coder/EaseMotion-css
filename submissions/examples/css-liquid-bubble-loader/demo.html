<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Liquid Bubble Loader | EaseMotion CSS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="loader-wrapper" role="region" aria-label="Liquid Bubble Loader Animation">
    <div class="bubble-container" aria-hidden="true">
        <div class="liquid-pool"></div>
        <div class="bubble bubble-1"></div>
        <div class="bubble bubble-2"></div>
        <div class="bubble bubble-3"></div>
        <div class="bubble bubble-4"></div>
    </div>
    <h2 class="loader-title">Loading Experience</h2>
    <p class="loader-subtitle">Please wait while assets prepare...</p>
</div>

</body>
</html>
