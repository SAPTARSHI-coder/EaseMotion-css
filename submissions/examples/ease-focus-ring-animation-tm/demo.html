<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Focus Ring Animation | EaseMotion CSS</title><link rel="stylesheet" href="style.css"></head>
<body><div class="fr-root">
<div class="fr-card">
<div class="fr-field"><label class="fr-label">Email</label><input type="email" class="fr-input" placeholder="you@example.com" tabindex="0"></div>
<div class="fr-field"><label class="fr-label">Password</label><input type="password" class="fr-input" placeholder="Enter password" tabindex="0"></div>
<button class="fr-btn" type="button" tabindex="0">Sign In</button>
</div>
<p class="fr-note">Tab to elements and press Enter. Focus rings pulse with animation. Pure CSS using :focus-visible.</p>
</div></body></html>
