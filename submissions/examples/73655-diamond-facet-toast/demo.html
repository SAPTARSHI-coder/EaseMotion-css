<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Diamond Facet Edge CSS Toast notification"
  >
  <title>Diamond Facet Edge Toast</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">
    <section class="demo-card">
      <span class="eyebrow">CSS TOAST</span>

      <h1>Diamond Facet Edge</h1>

      <p class="description">
        A polished notification with angular diamond-inspired edges,
        subtle facets, and smooth CSS motion.
      </p>

      <div class="toast-stage">
        <article class="toast" role="status" aria-live="polite">
          <span class="facet facet-top" aria-hidden="true"></span>
          <span class="facet facet-bottom" aria-hidden="true"></span>

          <div class="toast-icon" aria-hidden="true">
            <span>✓</span>
          </div>

          <div class="toast-content">
            <strong>Upload complete</strong>
            <span>Your project has been uploaded successfully.</span>
          </div>

          <button
            class="toast-close"
            type="button"
            aria-label="Dismiss notification"
          >
            ×
          </button>
        </article>
      </div>

      <p class="hint">
        Diamond-inspired facet edges created entirely with CSS
      </p>
    </section>
  </main>

</body>
</html>
