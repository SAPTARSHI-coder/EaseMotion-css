
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notification Toast</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="demo">
        <h1>Notification Toast</h1>
        <p class="subtitle">
            CSS-only toast notification with slide and bounce animation.
        </p>

        <section class="toast-container" aria-label="Notifications">

            <article class="toast toast-success" role="status">
                <div class="toast-icon">✓</div>

                <div class="toast-content">
                    <h2>Success</h2>
                    <p>Your changes have been saved successfully.</p>
                </div>

                <button class="toast-close" aria-label="Close notification">
                    &times;
                </button>
            </article>

            <article class="toast toast-info" role="status">
                <div class="toast-icon">i</div>

                <div class="toast-content">
                    <h2>Information</h2>
                    <p>Your profile is ready to be updated.</p>
                </div>

                <button class="toast-close" aria-label="Close notification">
                    &times;
                </button>
            </article>

            <article class="toast toast-warning" role="alert">
                <div class="toast-icon">!</div>

                <div class="toast-content">
                    <h2>Warning</h2>
                    <p>Your session will expire soon.</p>
                </div>

                <button class="toast-close" aria-label="Close notification">
                    &times;
                </button>
            </article>

        </section>
    </main>

</body>
</html>
