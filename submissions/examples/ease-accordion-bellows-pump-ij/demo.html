<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-accordion-bellows-pump demo</title>
</head>
<body>
<div class="ad-app">
  <div class="ad-head">
    <span class="ad-name">FOLK FEST</span>
    <span class="ad-badge">BUTTON BOX</span>
  </div>
  <div class="ad-stage">
    <div class="ad-accordion">
      <div class="ad-left">
        <span class="ad-button ad-button-1"></span>
        <span class="ad-button ad-button-2"></span>
        <span class="ad-button ad-button-3"></span>
        <span class="ad-button ad-button-4"></span>
      </div>
      <div class="ad-bellows">
        <span class="ad-fold ad-fold-1"></span>
        <span class="ad-fold ad-fold-2"></span>
        <span class="ad-fold ad-fold-3"></span>
        <span class="ad-fold ad-fold-4"></span>
      </div>
      <div class="ad-keys">
        <span class="ad-key ad-key-1">1</span>
        <span class="ad-key ad-key-2">2</span>
        <span class="ad-key ad-key-3">3</span>
        <span class="ad-key ad-key-4">4</span>
        <span class="ad-key ad-key-5">5</span>
      </div>
    </div>
    <span class="ad-note">&#9835;</span>
  </div>
  <div class="ad-foot">POLKA 2/4</div>
</div>
</body>
</html>
