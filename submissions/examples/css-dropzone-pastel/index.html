<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS File Dropzone: Glowing Pastel Styling - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="em-demo-container">
        <!-- Pure CSS Glowing Pastel File Dropzone Component Showcase -->
        <header class="em-dropzone-card" role="region" aria-label="Glowing Pastel Dropzone Showcase" tabindex="0">
            <div class="em-dropzone-header-bar">
                <span class="em-card-badge">COMPONENT VARIANT</span>
                <span class="em-brand-logo">PastelDropzone</span>
            </div>
            <h1 class="em-card-title">Glowing File Dropzone</h1>
            <p class="em-card-desc">A fully responsive, zero-JS pure CSS file dropzone component featuring glowing pastel gradients, dashed border animation hints, and frosted glassmorphism.</p>
            <div class="em-dropzone-wrapper">
                <label class="em-pastel-dropzone" role="button" aria-label="File Upload Dropzone">
                    <input type="file" class="em-file-input" aria-hidden="true">
                    <div class="em-dropzone-content">
                        <span class="em-dropzone-icon">📁</span>
                        <h3 class="em-dropzone-title">Drop your files here</h3>
                        <p class="em-dropzone-text">or <span class="em-highlight-text">browse files</span> from your device</p>
                    </div>
                </label>
            </div>
        </header>
    </div>
</body>
</html>
