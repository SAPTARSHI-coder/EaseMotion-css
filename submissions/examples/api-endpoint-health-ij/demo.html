<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-api-endpoint-health demo</title>
</head>
<body>
<div class="aeh-panel">
  <div class="aeh-row aeh-ok">
    <span class="aeh-method">GET</span>
    <span class="aeh-path">/api/users</span>
    <span class="aeh-latency">42ms</span>
    <span class="aeh-dot"></span>
  </div>
  <div class="aeh-row aeh-ok">
    <span class="aeh-method">GET</span>
    <span class="aeh-path">/api/orders</span>
    <span class="aeh-latency">61ms</span>
    <span class="aeh-dot"></span>
  </div>
  <div class="aeh-row aeh-ok">
    <span class="aeh-method">POST</span>
    <span class="aeh-path">/api/checkout</span>
    <span class="aeh-latency">88ms</span>
    <span class="aeh-dot"></span>
  </div>
  <div class="aeh-row aeh-down">
    <span class="aeh-method">GET</span>
    <span class="aeh-path">/api/payments</span>
    <span class="aeh-latency">ERR</span>
    <span class="aeh-dot"></span>
  </div>
</div>
</body>
</html>
