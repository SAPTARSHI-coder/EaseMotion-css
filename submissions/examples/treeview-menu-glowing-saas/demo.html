<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EaseMotion - Glowing Treeview Menu</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="em-container">
    <div class="em-card">
      <h2 class="em-card-title">Project Directory</h2>
      
      <!-- Pure CSS Treeview -->
      <ul class="em-treeview">
        <!-- Node 1 -->
        <li class="em-treeview-node">
          <input type="checkbox" id="node-1" class="em-treeview-toggle" aria-hidden="true" />
          <label for="node-1" class="em-treeview-label" tabindex="0">
            <span class="em-icon-folder"></span>
            src
          </label>
          <ul class="em-treeview-sub">
            <li class="em-treeview-leaf">
              <a href="#" class="em-treeview-link"><span class="em-icon-file"></span>index.js</a>
            </li>
            <li class="em-treeview-leaf">
              <a href="#" class="em-treeview-link"><span class="em-icon-file"></span>app.js</a>
            </li>
            
            <!-- Nested Node -->
            <li class="em-treeview-node">
              <input type="checkbox" id="node-1-1" class="em-treeview-toggle" aria-hidden="true" />
              <label for="node-1-1" class="em-treeview-label" tabindex="0">
                <span class="em-icon-folder"></span>
                components
              </label>
              <ul class="em-treeview-sub">
                <li class="em-treeview-leaf">
                  <a href="#" class="em-treeview-link"><span class="em-icon-file"></span>Button.jsx</a>
                </li>
                <li class="em-treeview-leaf">
                  <a href="#" class="em-treeview-link"><span class="em-icon-file"></span>Card.jsx</a>
                </li>
              </ul>
            </li>
          </ul>
        </li>

        <!-- Node 2 -->
        <li class="em-treeview-node">
          <input type="checkbox" id="node-2" class="em-treeview-toggle" aria-hidden="true" />
          <label for="node-2" class="em-treeview-label" tabindex="0">
            <span class="em-icon-folder"></span>
            public
          </label>
          <ul class="em-treeview-sub">
            <li class="em-treeview-leaf">
              <a href="#" class="em-treeview-link"><span class="em-icon-file"></span>index.html</a>
            </li>
            <li class="em-treeview-leaf">
              <a href="#" class="em-treeview-link"><span class="em-icon-file"></span>favicon.ico</a>
            </li>
          </ul>
        </li>
        
        <!-- Leaf -->
        <li class="em-treeview-leaf root-leaf">
          <a href="#" class="em-treeview-link"><span class="em-icon-file"></span>package.json</a>
        </li>
      </ul>
    </div>
  </main>
</body>
</html>
