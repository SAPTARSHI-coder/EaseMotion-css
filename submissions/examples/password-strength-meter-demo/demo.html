<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EaseMotion — Password Strength Meter</title>
  <link rel="stylesheet" href="../../core/variables.css">
  <link rel="stylesheet" href="../../components/password-strength.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="demo-container">
    <h1>Password Strength Meter</h1>
    <p>Type a password to see real-time strength feedback.</p>

    <div class="password-card">
      <div class="ease-field">
        <label class="ease-field-label">Password</label>
        <input type="password" class="ease-input" id="pwd" placeholder="Enter password" oninput="checkStrength()">
      </div>
      <div class="strength-bar">
        <div id="strengthFill" class="strength-fill"></div>
      </div>
      <span id="strengthLabel" class="strength-label"></span>
      <ul id="checks" class="checklist">
        <li id="checkLen">At least 8 characters</li>
        <li id="checkUpper">Uppercase letter</li>
        <li id="checkLower">Lowercase letter</li>
        <li id="checkNum">Number</li>
        <li id="checkSpec">Special character</li>
      </ul>
    </div>
  </div>

  <script>
    function checkStrength() {
      const pwd = document.getElementById('pwd').value;
      let score = 0;
      if (pwd.length >= 8) score++;
      if (/[A-Z]/.test(pwd)) score++;
      if (/[a-z]/.test(pwd)) score++;
      if (/[0-9]/.test(pwd)) score++;
      if (/[^A-Za-z0-9]/.test(pwd)) score++;

      const fill = document.getElementById('strengthFill');
      const label = document.getElementById('strengthLabel');
      const pct = (score / 5) * 100;
      fill.style.width = pct + '%';

      const colors = ['#ef4444', '#f59e0b', '#f59e0b', '#22c55e', '#22c55e'];
      const labels = ['Very Weak', 'Weak', 'Fair', 'Strong', 'Very Strong'];
      fill.style.background = score > 0 ? colors[score - 1] : '#e2e8f0';
      label.textContent = pwd.length > 0 ? labels[score - 1] || '' : '';
      label.style.color = score > 0 ? colors[score - 1] : '';

      document.getElementById('checkLen').className = pwd.length >= 8 ? 'pass' : '';
      document.getElementById('checkUpper').className = /[A-Z]/.test(pwd) ? 'pass' : '';
      document.getElementById('checkLower').className = /[a-z]/.test(pwd) ? 'pass' : '';
      document.getElementById('checkNum').className = /[0-9]/.test(pwd) ? 'pass' : '';
      document.getElementById('checkSpec').className = /[^A-Za-z0-9]/.test(pwd) ? 'pass' : '';
    }
  </script>
</body>
</html>
