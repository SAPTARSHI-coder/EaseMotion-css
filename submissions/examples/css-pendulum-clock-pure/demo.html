<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Pendulum Clock</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="layout-container">
        
        <header class="section-header">
            <h1 class="title">Pure CSS Pendulum Clock</h1>
            <p class="subtitle">A classic grandfather-style clock featuring a swinging pendulum and a ticking second hand, animated entirely with CSS keyframes.</p>
        </header>

        <div class="demo-area">
            
            <div class="clock-housing" aria-label="A swinging pendulum clock">
                
                <!-- The top face of the clock -->
                <div class="clock-face">
                    <!-- The center pin -->
                    <div class="clock-center"></div>
                    
                    <!-- 
                      [TECHNIQUE] The Ticking Hand
                      The second hand uses steps(60) to tick perfectly 
                      once every second.
                    -->
                    <div class="hand second-hand" aria-hidden="true"></div>
                    
                    <!-- Decorative static hands for hour/minute -->
                    <div class="hand minute-hand" aria-hidden="true"></div>
                    <div class="hand hour-hand" aria-hidden="true"></div>
                </div>
                
                <!-- The bottom body housing the pendulum -->
                <div class="clock-body">
                    
                    <!-- 
                      [TECHNIQUE] The Swinging Pendulum
                      Anchored at the top center using transform-origin, 
                      swinging back and forth using an infinite alternate keyframe.
                    -->
                    <div class="pendulum">
                        <div class="pendulum-rod"></div>
                        <div class="pendulum-bob"></div>
                    </div>
                    
                </div>
                
            </div>
            
        </div>
        
    </div>

</body>
</html>
