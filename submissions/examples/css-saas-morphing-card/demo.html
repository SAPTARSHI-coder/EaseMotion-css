<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Morphing Card with SaaS Modern Styling | EaseMotion CSS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <article class="saas-card" aria-label="SaaS Feature Card">
        <div class="card-icon-wrapper" aria-hidden="true">⚡</div>
        <h2 class="card-title">Cloud Infrastructure</h2>
        <p class="card-description">Scale workloads dynamically with zero-downtime deployment pipelines and automated load balancing across global edge regions.</p>
        <div class="card-footer">
            <button class="card-link" type="button">Learn more &rarr;</button>
            <span class="card-badge">Pro Tier</span>
        </div>
    </article>
</body>
</html>
