<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ice Saw Kerf — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Ice Saw Kerf demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Ice Saw Kerf</h1>
      <p class="lede">Ice harvest saw cutting a kerf across a frozen block</p>
    </header>

    <section class="ease-ice-saw-kerf" data-demo="ice-saw-kerf" aria-live="polite">
      <div class="ease-ice-saw-kerf__housing">
        <div class="ease-ice-saw-kerf__bezel">
          <div class="ease-ice-saw-kerf__face">
            <div class="ease-ice-saw-kerf__readout">
              <span class="ease-ice-saw-kerf__label">Ice Saw Kerf</span>
              <span class="ease-ice-saw-kerf__value">LIVE</span>
            </div>
            <div class="ease-ice-saw-kerf__motion" aria-hidden="true">
              <span class="ease-ice-saw-kerf__a"></span>
              <span class="ease-ice-saw-kerf__b"></span>
              <span class="ease-ice-saw-kerf__c"></span>
              <span class="ease-ice-saw-kerf__d"></span>
            </div>
            <div class="ease-ice-saw-kerf__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-ice-saw-kerf__controls">
          <button type="button" class="ease-ice-saw-kerf__btn primary">Engage</button>
          <button type="button" class="ease-ice-saw-kerf__btn">Reset</button>
          <label class="ease-ice-saw-kerf__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-ice-saw-kerf__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
