<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tessellation Loader – Geometric Patterns</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="loader-container">
        <div id="canvas-container">
            <!-- shapes will be added here via JS -->
        </div>
        <div class="controls">
            <h2>Tessellation Loader</h2>
            
            <div class="control-group">
                <label for="pattern-type">Pattern Type</label>
                <select id="pattern-type">
                    <option value="hexagonal">Hexagonal</option>
                    <option value="triangular">Triangular</option>
                    <option value="square">Square</option>
                    <option value="diamond">Diamond</option>
                </select>
            </div>
            
            <div class="control-group">
                <label for="speed">Speed (<span id="speed-val">1x</span>)</label>
                <input type="range" id="speed" min="1" max="10" value="1" step="0.1">
            </div>
            
            <div class="control-group">
                <label for="size">Tile Size (<span id="size-val">40px</span>)</label>
                <input type="range" id="size" min="20" max="80" value="40" step="1">
            </div>
            
            <div class="control-group">
                <label for="shift">Shift Intensity (<span id="shift-val">50%</span>)</label>
                <input type="range" id="shift" min="0" max="100" value="50" step="1">
            </div>
            
            <div class="buttons">
                <button id="play-pause">Pause</button>
            </div>
            
            <div class="stats">
                Shape Count: <span id="shape-count">0</span>
            </div>
            
            <div class="shortcuts-info">
                Shortcuts: [Space] Play/Pause, [P] Change Pattern, [R] Reset
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
