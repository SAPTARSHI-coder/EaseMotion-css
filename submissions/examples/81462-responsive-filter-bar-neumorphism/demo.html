<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Responsive neumorphic filter bar built with pure CSS."
  >

  <title>Neumorphic Filter Bar</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="page">

    <section
      class="filter-section"
      aria-labelledby="filter-title"
    >

      <div class="filter-heading">
        <span class="filter-heading__eyebrow">
          PRODUCT EXPLORER
        </span>

        <h1 id="filter-title">
          Browse products
        </h1>

        <p>
          Refine your results using the available filters.
        </p>
      </div>

      <form class="filter-bar">

        <div class="filter-bar__search">
          <label
            class="filter-label"
            for="search"
          >
            Search
          </label>

          <div class="search-field">

            <span
              class="search-icon"
              aria-hidden="true"
            >
              ⌕
            </span>

            <input
              id="search"
              type="search"
              placeholder="Search products..."
              autocomplete="off"
            >

          </div>
        </div>

        <div class="filter-control">

          <label
            class="filter-label"
            for="category"
          >
            Category
          </label>

          <select id="category">
            <option>All categories</option>
            <option>Technology</option>
            <option>Design</option>
            <option>Business</option>
            <option>Marketing</option>
          </select>

        </div>

        <div class="filter-control">

          <label
            class="filter-label"
            for="sort"
          >
            Sort by
          </label>

          <select id="sort">
            <option>Recommended</option>
            <option>Newest</option>
            <option>Most popular</option>
            <option>Price: Low to high</option>
          </select>

        </div>

        <button
          class="filter-action filter-action--primary"
          type="submit"
        >
          Apply filters
        </button>

        <button
          class="filter-action filter-action--secondary"
          type="reset"
        >
          Reset
        </button>

      </form>

      <div class="active-filters">

        <span class="active-filters__label">
          Quick filters
        </span>

        <button
          class="filter-chip is-active"
          type="button"
          aria-pressed="true"
        >
          Popular
        </button>

        <button
          class="filter-chip"
          type="button"
          aria-pressed="false"
        >
          New arrivals
        </button>

        <button
          class="filter-chip"
          type="button"
          aria-pressed="false"
        >
          On sale
        </button>

        <button
          class="filter-chip"
          type="button"
          aria-pressed="false"
        >
          Recommended
        </button>

      </div>

    </section>

  </main>

</body>
</html>
