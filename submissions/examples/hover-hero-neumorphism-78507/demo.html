<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neumorphic Hover Hero Section</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="ease-neu-hero">
        <div class="ease-neu-hero-content">
            <h1 class="ease-neu-title">Elevate Your <span>Experience</span></h1>
            <p class="ease-neu-subtitle">
                Discover the power of soft UI design with this beautifully crafted neumorphic hero section, featuring smooth hover interactions and responsive layouts.
            </p>
            <div class="ease-neu-actions">
                <a href="#" class="ease-neu-btn ease-neu-btn-primary">Get Started</a>
                <a href="#" class="ease-neu-btn ease-neu-btn-secondary">Learn More</a>
            </div>
        </div>

        <div class="ease-neu-hero-visual" aria-hidden="true">
            <!-- Neumorphic Decorative Elements -->
            <div class="ease-neu-card ease-neu-card-1">
                <div class="ease-neu-circle"></div>
                <div class="ease-neu-bar"></div>
                <div class="ease-neu-bar short"></div>
            </div>
            <div class="ease-neu-card ease-neu-card-2">
                <div class="ease-neu-circle small"></div>
                <div class="ease-neu-bar"></div>
            </div>
        </div>
    </header>
</body>
</html>
