<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ease Conic Gradient Color Wheel Selector</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="color-wheel-body">
  <div class="wheel-wrapper">
    <div class="color-wheel" id="wheel"></div>
    <div class="preview-card" id="preview">Selected Color</div>
  </div>

  <script>
    const wheel = document.getElementById('wheel');
    const preview = document.getElementById('preview');

    wheel.addEventListener('click', (e) => {
      const rect = wheel.getBoundingClientRect();
      const x = e.clientX - (rect.left + rect.width / 2);
      const y = e.clientY - (rect.top + rect.height / 2);
      const angle = (Math.atan2(y, x) * (180 / Math.PI) + 360) % 360;
      preview.style.background = `hsl(${angle}, 80%, 50%)`;
    });
  </script>
</body>
</html>
