<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>[FEATURE] CSS Step Indicator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<main class="em-css-step-indicator">
  <div class="em-css-step-indicator-step done"><span class="em-css-step-indicator-dot">1</span><span>Account</span></div>
  <div class="em-css-step-indicator-line done"></div>
  <div class="em-css-step-indicator-step done"><span class="em-css-step-indicator-dot">2</span><span>Profile</span></div>
  <div class="em-css-step-indicator-line"></div>
  <div class="em-css-step-indicator-step active"><span class="em-css-step-indicator-dot">3</span><span>Payment</span></div>
  <div class="em-css-step-indicator-line"></div>
  <div class="em-css-step-indicator-step"><span class="em-css-step-indicator-dot">4</span><span>Done</span></div>
</main>
</body>
</html>
