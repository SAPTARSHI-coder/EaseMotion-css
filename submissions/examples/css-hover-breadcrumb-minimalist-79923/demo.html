<!DOCTYPE html>

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Hover Breadcrumb</h1>

      <a href="#">Components</a>
      <span>/</span>

      <a href="#">Navigation</a>
      <span>/</span>

    </nav>
  </div>
</body>
</html>
