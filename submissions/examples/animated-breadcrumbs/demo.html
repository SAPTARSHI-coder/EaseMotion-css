<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Breadcrumbs</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">

        <h1>Animated Breadcrumbs</h1>
        <p class="description">
            A pure CSS breadcrumb navigation with staggered entrance
            and smooth hover animations.
        </p>

        <nav class="breadcrumb" aria-label="Breadcrumb">
            <ol>
                <li>
                    <a href="#">Home</a>
                </li>

                <li>
                    <a href="#">Products</a>
                </li>

                <li>
                    <a href="#">Web Development</a>
                </li>

                <li aria-current="page">
                    Documentation
                </li>
            </ol>
        </nav>

        <section class="content">
            <h2>Documentation</h2>
            <p>
                Breadcrumb navigation helps users understand their
                current location within a website.
            </p>
        </section>

    </main>

</body>
</html>
