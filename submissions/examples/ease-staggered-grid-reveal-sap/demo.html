<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ease-staggered-grid-reveal-sap demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { height: 100vh; margin: 0; display: flex; align-items: center; justify-content: center; background: #f4f4f5; }
  </style>
</head>
<body>
  <div class="staggered-grid-sap" id="grid"></div>
  <script>
    const grid = document.getElementById('grid');
    const colors = ['#2563eb', '#7c3aed', '#ec4899', '#f59e0b', '#22c55e', '#0ea5e9', '#ef4444', '#a855f7', '#14b8a6'];
    colors.forEach((c, i) => {
      const tile = document.createElement('div');
      tile.className = 'grid-tile';
      tile.style.background = c;
      tile.style.animationDelay = `${i * 0.06}s`;
      grid.appendChild(tile);
    });
  </script>
</body>
</html>
