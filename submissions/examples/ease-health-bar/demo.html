<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Health bar · deplete & regenerate</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <div class="health-container">
      <div class="health-label">
        <span>❤️ Health</span>
        <span id="healthDisplay" class="badge">100 / 100</span>
      </div>
      <div class="health-track">
        <div id="healthFill" class="health-fill">100%</div>
      </div>
    </div>

    <div class="controls">
      <button class="btn btn-danger" id="depleteBtn">⚔️ Deplete 15</button>
      <button class="btn btn-success" id="regenerateBtn">💚 Regen 10</button>
      <button class="btn btn-outline" id="resetBtn">⟳ Reset</button>
    </div>
    <div class="footer-note">
      <span>⬇️ depletes · ⬆️ regenerates (clamped 0–100)</span>
    </div>
  </div>

  <script>
    (function() {
      "use strict";

      // DOM refs
      const healthFill = document.getElementById('healthFill');
      const healthDisplay = document.getElementById('healthDisplay');

      // state
      const MAX_HEALTH = 100;
      const MIN_HEALTH = 0;
      let currentHealth = 100;

      function clamp(value, min, max) {
        return Math.min(max, Math.max(min, value));
      }

      function renderHealth() {
        const percent = Math.round((currentHealth / MAX_HEALTH) * 100);
        const clampedPercent = clamp(percent, 0, 100);

        healthFill.style.width = clampedPercent + '%';
        healthFill.textContent = clampedPercent + '%';
        healthDisplay.textContent = `${Math.round(currentHealth)} / ${MAX_HEALTH}`;

        if (currentHealth <= 25) {
          healthFill.classList.add('low');
        } else {
          healthFill.classList.remove('low');
        }
      }

      function deplete(amount) {
        if (amount <= 0) return;
        currentHealth = clamp(currentHealth - amount, MIN_HEALTH, MAX_HEALTH);
        renderHealth();
      }

      function regenerate(amount) {
        if (amount <= 0) return;
        currentHealth = clamp(currentHealth + amount, MIN_HEALTH, MAX_HEALTH);
        renderHealth();
      }

      function resetHealth() {
        currentHealth = MAX_HEALTH;
        renderHealth();
      }

      const depleteBtn = document.getElementById('depleteBtn');
      const regenerateBtn = document.getElementById('regenerateBtn');
      const resetBtn = document.getElementById('resetBtn');

      if (depleteBtn) {
        depleteBtn.addEventListener('click', function(e) {
          e.preventDefault();
          deplete(15);
        });
      }

      if (regenerateBtn) {
        regenerateBtn.addEventListener('click', function(e) {
          e.preventDefault();
          regenerate(10);
        });
      }

      if (resetBtn) {
        resetBtn.addEventListener('click', function(e) {
          e.preventDefault();
          resetHealth();
        });
      }

      // Keyboard shortcuts
      document.addEventListener('keydown', function(e) {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

        const key = e.key;
        if (key === 'd' || key === 'D') {
          e.preventDefault();
          deplete(15);
        } else if (key === 'r' || key === 'R') {
          e.preventDefault();
          regenerate(10);
        } else if (key === 'x' || key === 'X') {
          e.preventDefault();
          resetHealth();
        }
      });

      renderHealth();
      console.log('⚡ Health bar ready · shortcuts: [D]eplete 15, [R]egen 10, [X] Reset');
    })();
  </script>
</body>
</html>
