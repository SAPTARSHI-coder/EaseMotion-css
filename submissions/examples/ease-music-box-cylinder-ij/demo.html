<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-music-box-cylinder demo</title>
</head>
<body>
<div class="mb-app">
  <div class="mb-head">
    <span class="mb-name">SWEET MELODY</span>
    <span class="mb-badge">WIND UP</span>
  </div>
  <div class="mb-stage">
    <div class="mb-box">
      <span class="mb-lid"></span>
      <div class="mb-casing">
        <span class="mb-comb"></span>
        <span class="mb-screw mb-screw-1"></span>
        <span class="mb-screw mb-screw-2"></span>
        <div class="mb-cylinder">
          <span class="mb-pin mb-pin-1"></span>
          <span class="mb-pin mb-pin-2"></span>
          <span class="mb-pin mb-pin-3"></span>
          <span class="mb-pin mb-pin-4"></span>
          <span class="mb-pin mb-pin-5"></span>
          <span class="mb-pin mb-pin-6"></span>
          <span class="mb-pin mb-pin-7"></span>
        </div>
        <div class="mb-key">
          <span class="mb-stem"></span>
          <span class="mb-wings"></span>
        </div>
        <span class="mb-inlay">1908</span>
      </div>
      <span class="mb-note mb-note-1">&#9833;</span>
      <span class="mb-note mb-note-2">&#9833;</span>
    </div>
  </div>
  <div class="mb-foot">TUNE ADAGIO</div>
</div>
</body>
</html>
