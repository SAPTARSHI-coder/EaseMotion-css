<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CSS User Card Hover</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="content-wrapper">
    <p>
      Special thanks to 
      <span class="user-hover-wrapper">
        <a href="#profile" class="username-trigger">@alexdev</a>
        <div class="user-card" role="tooltip">
          <div class="card-top">
            <div class="avatar">AD</div>
            <button class="follow-btn" type="button">Follow</button>
          </div>
          <h2 class="display-name">Alex Rivera</h2>
          <span class="handle">@alexdev</span>
          <p class="bio">Building open-source CSS components & layout primitives.</p>
          <div class="stats">
            <div><span class="stat-num">1.4k</span> Following</div>
            <div><span class="stat-num">8.9k</span> Followers</div>
          </div>
        </div>
      </span>
      for contributing this pattern.
    </p>
  </main>
</body>
</html>
