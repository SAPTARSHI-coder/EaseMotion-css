<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Pricing Calculator - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="pricing-container">
    <header class="pricing-header">
      <span class="badge">Flexible Plans</span>
      <h1>Simple, Transparent Pricing</h1>
      <p>Scale your infrastructure effortlessly with interactive seat and feature toggles.</p>
    </header>

    <!-- Billing Cycle Toggle -->
    <div class="toggle-wrapper">
    <span class="toggle-label active" id="monthlyLabel">Monthly</span>
    <label class="switch">
        <input type="checkbox" id="billingToggle" aria-label="Toggle billing cycle between monthly and yearly">
        <span class="slider"></span>
    </label>
    <span class="toggle-label" id="yearlyLabel">Yearly <span class="discount-tag">Save 20%</span></span>
    </div>

    <!-- Interactive Controls -->
    <div class="calculator-card">
      <div class="slider-group">
        <div class="slider-header">
          <label for="userSlider">Number of Active Users</label>
          <span class="user-count" id="userCountDisplay">25 Users</span>
        </div>
        <input type="range" id="userSlider" min="5" max="100" value="25" step="5" class="range-input">
      </div>

      <div class="features-checklist">
        <h3>Add-On Modules</h3>
        <label class="checkbox-item">
          <input type="checkbox" id="addonAnalytics" class="addon-checkbox" data-price="15">
          <span class="checkmark"></span>
          <span class="item-text">Advanced Analytics & Reporting</span>
          <span class="item-price">+$15/mo</span>
        </label>
        <label class="checkbox-item">
          <input type="checkbox" id="addonSupport" class="addon-checkbox" data-price="25">
          <span class="checkmark"></span>
          <span class="item-text">24/7 Dedicated Priority Support</span>
          <span class="item-price">+$25/mo</span>
        </label>
      </div>

      <div class="summary-box">
        <div class="price-display">
          <span class="currency">$</span>
          <span class="amount" id="totalPriceDisplay">49</span>
          <span class="period" id="periodDisplay">/ month</span>
        </div>
        <p class="billing-note" id="billingNote">Billed monthly. Cancel anytime.</p>
        <button class="cta-button">Get Started Now</button>
      </div>
    </div>
  </div>

  <script>
    const userSlider = document.getElementById('userSlider');
    const userCountDisplay = document.getElementById('userCountDisplay');
    const billingToggle = document.getElementById('billingToggle');
    const totalPriceDisplay = document.getElementById('totalPriceDisplay');
    const periodDisplay = document.getElementById('periodDisplay');
    const billingNote = document.getElementById('billingNote');
    const monthlyLabel = document.getElementById('monthlyLabel');
    const yearlyLabel = document.getElementById('yearlyLabel');
    const addonCheckboxes = document.querySelectorAll('.addon-checkbox');

    function calculateTotal() {
      const users = parseInt(userSlider.value, 10);
      userCountDisplay.textContent = `${users} Users`;

      let basePrice = 19 + (users - 5) * 1.5;

      addonCheckboxes.forEach(checkbox => {
        if (checkbox.checked) {
          basePrice += parseFloat(checkbox.getAttribute('data-price'));
        }
      });

      const isYearly = billingToggle.checked;
      if (isYearly) {
        basePrice = basePrice * 0.8;
        periodDisplay.textContent = '/ month (billed yearly)';
        billingNote.textContent = 'Billed annually ($' + Math.round(basePrice * 12) + '/year).';
        monthlyLabel.classList.remove('active');
        yearlyLabel.classList.add('active');
      } else {
        periodDisplay.textContent = '/ month';
        billingNote.textContent = 'Billed monthly. Cancel anytime.';
        monthlyLabel.classList.add('active');
        yearlyLabel.classList.remove('active');
      }

      totalPriceDisplay.textContent = Math.round(basePrice);
    }

    userSlider.addEventListener('input', calculateTotal);
    billingToggle.addEventListener('change', calculateTotal);
    addonCheckboxes.forEach(cb => cb.addEventListener('change', calculateTotal));

    calculateTotal();
  </script>
</body>
</html>
