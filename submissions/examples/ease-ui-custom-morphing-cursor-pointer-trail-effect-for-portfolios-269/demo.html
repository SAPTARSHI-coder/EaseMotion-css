<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Morphing Cursor Trail</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Custom Cursor -->
    <div class="cursor-dot"></div>
    <div class="cursor-outline"></div>

    <!-- Hero -->
    <header class="hero">
        <nav>
            <h2 class="logo">Archfolio.</h2>

            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Projects</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>

        <div class="hero-content">
            <p>Creative Developer</p>

            <h1>
                Building elegant web experiences with clean
                interactions.
            </h1>

            <button class="btn">
                Explore Work
            </button>
        </div>
    </header>

    <!-- Projects -->
    <main class="projects">

        <div class="card">
            <h3>Portfolio</h3>
            <p>Minimal interface with smooth interactions.</p>
        </div>

        <div class="card">
            <h3>Dashboard</h3>
            <p>Glassmorphism admin dashboard.</p>
        </div>

        <div class="card">
            <h3>Landing Page</h3>
            <p>Modern product website.</p>
        </div>

    </main>

<script>

const dot=document.querySelector(".cursor-dot");
const outline=document.querySelector(".cursor-outline");

let mouseX=0;
let mouseY=0;

let outlineX=0;
let outlineY=0;

document.addEventListener("mousemove",(e)=>{

mouseX=e.clientX;
mouseY=e.clientY;

dot.style.left=mouseX+"px";
dot.style.top=mouseY+"px";

createTrail(mouseX,mouseY);

});

function animate(){

outlineX+=(mouseX-outlineX)*0.15;
outlineY+=(mouseY-outlineY)*0.15;

outline.style.left=outlineX+"px";
outline.style.top=outlineY+"px";

requestAnimationFrame(animate);

}

animate();

function createTrail(x,y){

const trail=document.createElement("span");

trail.className="trail";

trail.style.left=x+"px";
trail.style.top=y+"px";

document.body.appendChild(trail);

setTimeout(()=>{
trail.remove();
},600);

}

const items=document.querySelectorAll("a,button,.card");

items.forEach(item=>{

item.addEventListener("mouseenter",()=>{

outline.classList.add("active");

});

item.addEventListener("mouseleave",()=>{

outline.classList.remove("active");

});

});

</script>

</body>
</html>
