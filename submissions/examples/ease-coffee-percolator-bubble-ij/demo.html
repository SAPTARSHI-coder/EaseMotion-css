<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-coffee-percolator-bubble demo</title>
</head>
<body>
<div class="cp-app">
  <div class="cp-burner">
    <div class="cp-flame cp-flame-1"></div>
    <div class="cp-flame cp-flame-2"></div>
  </div>
  <div class="cp-pot">
    <div class="cp-knob">
      <span class="cp-bubble cp-bubble-1"></span>
      <span class="cp-bubble cp-bubble-2"></span>
    </div>
    <div class="cp-spout">
      <span class="cp-steam cp-steam-1"></span>
    </div>
    <div class="cp-handle"></div>
    <div class="cp-band"></div>
  </div>
  <div class="cp-tray"></div>
</div>
</body>
</html>
