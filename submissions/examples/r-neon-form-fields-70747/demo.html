<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Pure CSS neon glow form fields">
  <title>CSS Neon Form Fields</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">
    <section class="form-card" aria-labelledby="form-title">
      <div class="intro">
        <span class="eyebrow">EaseMotion CSS</span>
        <h1 id="form-title">Neon Contact Form</h1>
        <p>Focus any field to activate the neon glow effect.</p>
      </div>

      <form class="neon-form" action="#">
        <div class="field">
          <label for="name">Full Name</label>
          <input
            id="name"
            name="name"
            type="text"
            placeholder="Enter your name"
            autocomplete="name"
            required
          >
        </div>

        <div class="field">
          <label for="email">Email Address</label>
          <input
            id="email"
            name="email"
            type="email"
            placeholder="you@example.com"
            autocomplete="email"
            required
          >
        </div>

        <div class="field">
          <label for="subject">Subject</label>
          <input
            id="subject"
            name="subject"
            type="text"
            placeholder="What is this about?"
            required
          >
        </div>

        <div class="field">
          <label for="message">Message</label>
          <textarea
            id="message"
            name="message"
            rows="5"
            placeholder="Write your message..."
            required
          ></textarea>
        </div>

        <button type="submit" class="submit-button">
          Send Message
          <span aria-hidden="true">→</span>
        </button>
      </form>
    </section>
  </main>

</body>
</html>
