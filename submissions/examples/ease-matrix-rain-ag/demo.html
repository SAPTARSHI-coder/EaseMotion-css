<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrix Digital Rain | EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="matrix-container">
        <!-- We use multiple columns with different animation delays -->
        <div class="column" style="--delay: 0s; --duration: 4s; left: 5%;">
            <span>日</span><span>本</span><span>語</span><span>の</span><span>文</span><span>字</span><span>列</span><span>は</span><span>美</span><span>し</span><span>い</span>
        </div>
        <div class="column" style="--delay: 1.5s; --duration: 3s; left: 15%;">
            <span>a</span><span>b</span><span>c</span><span>d</span><span>e</span><span>f</span><span>g</span><span>h</span><span>i</span><span>j</span><span>k</span>
        </div>
        <div class="column" style="--delay: 0.5s; --duration: 5s; left: 25%;">
            <span>1</span><span>0</span><span>1</span><span>0</span><span>0</span><span>1</span><span>1</span><span>1</span><span>0</span><span>0</span><span>1</span>
        </div>
        <div class="column" style="--delay: 2s; --duration: 3.5s; left: 35%;">
            <span>ア</span><span>イ</span><span>ウ</span><span>エ</span><span>オ</span><span>カ</span><span>キ</span><span>ク</span><span>ケ</span><span>コ</span><span>サ</span>
        </div>
        <div class="column" style="--delay: 1s; --duration: 4.5s; left: 45%;">
            <span>Ω</span><span>μ</span><span>π</span><span>λ</span><span>Σ</span><span>Δ</span><span>θ</span><span>φ</span><span>γ</span><span>α</span><span>β</span>
        </div>
        <div class="column" style="--delay: 3s; --duration: 3.2s; left: 55%;">
            <span>T</span><span>H</span><span>E</span><span>M</span><span>A</span><span>T</span><span>R</span><span>I</span><span>X</span><span>H</span><span>A</span>
        </div>
        <div class="column" style="--delay: 0.2s; --duration: 4.8s; left: 65%;">
            <span>*</span><span>&</span><span>^</span><span>%</span><span>$</span><span>#</span><span>@</span><span>!</span><span>?</span><span>/</span><span>></span>
        </div>
        <div class="column" style="--delay: 1.8s; --duration: 3.8s; left: 75%;">
            <span>Q</span><span>W</span><span>E</span><span>R</span><span>T</span><span>Y</span><span>U</span><span>I</span><span>O</span><span>P</span><span>A</span>
        </div>
        <div class="column" style="--delay: 0.8s; --duration: 5.2s; left: 85%;">
            <span>Z</span><span>X</span><span>C</span><span>V</span><span>B</span><span>N</span><span>M</span><span>1</span><span>2</span><span>3</span><span>4</span>
        </div>
        <div class="column" style="--delay: 2.5s; --duration: 4.1s; left: 95%;">
            <span>0</span><span>x</span><span>F</span><span>F</span><span>A</span><span>B</span><span>C</span><span>D</span><span>E</span><span>F</span><span>0</span>
        </div>
    </div>
</body>
</html>
