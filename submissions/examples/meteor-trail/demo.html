<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meteor Trail</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="page">
  <section class="meteor-card">

    <header class="topbar">
      <div>
        <span class="label">DEEP SPACE</span>
        <h1>Meteor Trail</h1>
        <p>Launch a shooting star into the night.</p>
      </div>

      <div class="meter">
        <span>METEORS</span>
        <strong id="meteorCount">0</strong>
      </div>
    </header>

    <div class="meteor-stage" id="stage">
      <div class="nebula"></div>
    </div>

    <div class="actions">
      <button id="launch">Launch Meteor</button>
      <button id="reset">Reset</button>
    </div>

    <p class="help">
      Click the sky · Space launches · R resets
    </p>

  </section>
</main>

<script>
  const stage = document.getElementById("stage");
  const countElement = document.getElementById("meteorCount");

  let meteorCount = 0;
  let meteors = [];

  for (let i = 0; i < 90; i++) {
    const star = document.createElement("span");
    star.className = "star";

    const depth = Math.random();

    star.style.left = `${Math.random() * 100}%`;
    star.style.top = `${Math.random() * 100}%`;
    star.style.width = `${1 + depth * 2}px`;
    star.style.height = star.style.width;
    star.style.opacity = `${0.25 + depth * 0.65}`;
    star.style.animationDuration = `${5 + depth * 8}s`;
    star.style.animationDelay = `${Math.random() * -8}s`;

    stage.appendChild(star);
  }

  function launchMeteor(x, y, angle = null) {
    const meteor = document.createElement("div");
    meteor.className = "meteor";

    const startX = x ?? Math.random() * stage.clientWidth;
    const startY = y ?? -20;

    const direction =
      angle ??
      (Math.random() * 28 + 25);

    const length = 130 + Math.random() * 90;
    const duration = 850 + Math.random() * 650;

    meteor.style.left = `${startX}px`;
    meteor.style.top = `${startY}px`;
    meteor.style.setProperty("--angle", `${direction}deg`);
    meteor.style.setProperty("--length", `${length}px`);
    meteor.style.setProperty("--duration", `${duration}ms`);

    const core = document.createElement("span");
    core.className = "meteor-core";

    const trail = document.createElement("span");
    trail.className = "meteor-trail";

    meteor.appendChild(trail);
    meteor.appendChild(core);

    stage.appendChild(meteor);
    meteors.push(meteor);

    meteorCount++;
    countElement.textContent = meteorCount;

    setTimeout(() => {
      createBurst(startX, startY);
      meteor.remove();
      meteors = meteors.filter(item => item !== meteor);
    }, duration);
  }

  function createBurst(x, y) {
    for (let i = 0; i < 8; i++) {
      const particle = document.createElement("span");
      particle.className = "burst-particle";

      particle.style.left = `${x}px`;
      particle.style.top = `${y}px`;
      particle.style.setProperty("--x", `${(Math.random() - 0.5) * 70}px`);
      particle.style.setProperty("--y", `${(Math.random() - 0.5) * 70}px`);

      stage.appendChild(particle);

      setTimeout(() => particle.remove(), 600);
    }
  }

  stage.addEventListener("pointerdown", event => {
    const rect = stage.getBoundingClientRect();

    launchMeteor(
      event.clientX - rect.left,
      event.clientY - rect.top,
      35
    );
  });

  document.getElementById("launch").addEventListener("click", () => {
    launchMeteor();
  });

  document.getElementById("reset").addEventListener("click", () => {
    meteors.forEach(meteor => meteor.remove());
    meteors = [];
    meteorCount = 0;
    countElement.textContent = "0";
  });

  document.addEventListener("keydown", event => {
    if (event.code === "Space") {
      event.preventDefault();
      launchMeteor();
    }

    if (event.key.toLowerCase() === "r") {
      document.getElementById("reset").click();
    }
  });

  setInterval(() => {
    launchMeteor();
  }, 2600);
</script>

</body>
</html>
