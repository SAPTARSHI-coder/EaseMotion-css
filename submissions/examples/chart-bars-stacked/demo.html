<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chart Bars Stacked &mdash; EaseMotion CSS Demo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="cbs-chart">
  <div class="cbs-col" style="--h:64%;--d:0s">
    <i class="cbs-a" style="--p:50%"></i><i class="cbs-b" style="--p:30%"></i><i class="cbs-c" style="--p:20%"></i>
  </div>
  <div class="cbs-col" style="--h:92%;--d:0.3s">
    <i class="cbs-a" style="--p:45%"></i><i class="cbs-b" style="--p:35%"></i><i class="cbs-c" style="--p:20%"></i>
  </div>
  <div class="cbs-col" style="--h:48%;--d:0.6s">
    <i class="cbs-a" style="--p:40%"></i><i class="cbs-b" style="--p:40%"></i><i class="cbs-c" style="--p:20%"></i>
  </div>
  <div class="cbs-col" style="--h:78%;--d:0.9s">
    <i class="cbs-a" style="--p:55%"></i><i class="cbs-b" style="--p:25%"></i><i class="cbs-c" style="--p:20%"></i>
  </div>
</div>
</body>
</html>
