<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Cyberpunk ripple wave button built with pure CSS."
  >

  <title>Cyberpunk Ripple Wave Button</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="page">

    <section class="demo" aria-labelledby="title">

      <div class="scan-line" aria-hidden="true"></div>

      <p class="eyebrow">
        EASEMOTION // MICRO-ANIMATION
      </p>

      <h1 id="title">
        RIPPLE
        <span>PROTOCOL</span>
      </h1>

      <p class="description">
        A cyberpunk-inspired ripple wave interaction
        powered entirely by CSS.
      </p>

      <div class="button-stage">

        <button
          class="cyber-button"
          type="button"
          aria-label="Activate ripple protocol"
        >
          <span class="corner corner-tl"></span>
          <span class="corner corner-tr"></span>
          <span class="corner corner-bl"></span>
          <span class="corner corner-br"></span>

          <span class="ripple ripple-one"></span>
          <span class="ripple ripple-two"></span>

          <span class="button-content">
            <span class="status-dot" aria-hidden="true"></span>
            <span>ACTIVATE</span>
            <span class="arrow" aria-hidden="true">↗</span>
          </span>
        </button>

      </div>

      <div class="system-status">
        <span class="status-indicator"></span>
        SYSTEM READY
      </div>

      <p class="hint">
        HOVER / FOCUS TO ENGAGE
      </p>

    </section>

  </main>

</body>
</html>
