<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="CSS passport stamp with animated ink spread effect"
  >
  <title>CSS Passport Stamp</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section class="passport" aria-labelledby="title">
      <div class="passport-header">
        <span class="eyebrow">Travel Journal</span>
        <span class="passport-label">PASSPORT</span>
      </div>

      <div class="stamp-area">
        <div class="stamp" tabindex="0" aria-label="Tokyo passport entry stamp">
          <div class="stamp-inner">
            <span class="stamp-country">JAPAN</span>
            <span class="stamp-symbol" aria-hidden="true">✈</span>
            <strong id="title">TOKYO</strong>
            <span class="stamp-date">10 · AUG · 2026</span>
            <span class="stamp-type">ENTRY</span>
          </div>
        </div>
      </div>

      <div class="passport-footer">
        <span>Destination</span>
        <strong>Tokyo, Japan</strong>
        <span class="status">APPROVED</span>
      </div>
    </section>
  </main>
</body>
</html>
