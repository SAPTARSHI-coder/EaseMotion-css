<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="High-contrast floating notification toast with auto-dismiss timer">
    <title>Accessible Floating Toast</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="page">
        <section class="showcase" aria-labelledby="heading">
            <span class="badge">EaseMotion UI</span>

            <h1 id="heading">Floating Notification</h1>

            <p>
                A high-contrast accessible toast notification with an
                auto-dismiss timer and smooth interaction.
            </p>

            <button id="showToast" class="show-btn" type="button">
                Show Notification
            </button>
        </section>
    </main>

    <aside
        id="toast"
        class="toast"
        role="status"
        aria-live="polite"
        aria-atomic="true"
        hidden
    >
        <div class="toast-icon" aria-hidden="true">✓</div>

        <div class="toast-content">
            <strong>Success</strong>
            <p>Your changes were saved successfully.</p>
        </div>

        <button
            id="closeToast"
            class="close-btn"
            type="button"
            aria-label="Close notification"
        >
            ×
        </button>

        <div id="timerBar" class="timer-bar" aria-hidden="true"></div>
    </aside>

    <script src="script.js"></script>
</body>
</html>
