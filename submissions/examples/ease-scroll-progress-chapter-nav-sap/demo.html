<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scroll Progress Chapter Nav</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="chapter-nav" aria-label="Chapters">
    <button class="chapter-dot is-active" data-target="ch1" aria-label="Chapter 1: Introduction"></button>
    <button class="chapter-dot" data-target="ch2" aria-label="Chapter 2: Getting Started"></button>
    <button class="chapter-dot" data-target="ch3" aria-label="Chapter 3: Advanced Usage"></button>
    <button class="chapter-dot" data-target="ch4" aria-label="Chapter 4: Conclusion"></button>
  </nav>

  <main class="content">
    <section id="ch1" class="chapter"><h1>Introduction</h1><p>Scroll down — the dots on the right track your chapter progress.</p></section>
    <section id="ch2" class="chapter"><h2>Getting Started</h2><p>Chapter content.</p></section>
    <section id="ch3" class="chapter"><h2>Advanced Usage</h2><p>Chapter content.</p></section>
    <section id="ch4" class="chapter"><h2>Conclusion</h2><p>Chapter content.</p></section>
  </main>

  <script>
    const dots = document.querySelectorAll('.chapter-dot');
    const chapters = document.querySelectorAll('.chapter');

    dots.forEach(dot => {
      dot.addEventListener('click', () => {
        document.getElementById(dot.dataset.target).scrollIntoView({ behavior: 'smooth' });
      });
    });

    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          dots.forEach(d => d.classList.remove('is-active'));
          document.querySelector(`.chapter-dot[data-target="${entry.target.id}"]`).classList.add('is-active');
        }
      });
    }, { rootMargin: '-45% 0px -45% 0px' });

    chapters.forEach(ch => observer.observe(ch));
  </script>
</body>
</html>
