<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Sci-Fi HUD: Synthwave Grid Line</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <main class="synthwave-hud" role="region" aria-label="Synthwave Dashboard">
    
    <!-- Sun and Grid Background -->
    <div class="synth-sun" aria-hidden="true"></div>
    <div class="synth-grid-container" aria-hidden="true">
      <div class="synth-grid"></div>
    </div>
    
    <!-- UI Overlay -->
    <header class="hud-content">
      <h2 class="hud-title">Vectrex</h2>
      <div class="hud-subtitle">SYS_OVERRIDE_ACTIVE</div>
    </header>

    <div class="readout-panel">
      <div class="readout">
        <span class="readout-label">SPD</span>
        <span class="readout-value" aria-live="polite">284</span>
      </div>
      <div class="readout">
        <span class="readout-label">PWR</span>
        <span class="readout-value" aria-live="polite">99%</span>
      </div>
      <div class="readout">
        <span class="readout-label">ALT</span>
        <span class="readout-value" aria-live="polite">14K</span>
      </div>
    </div>

  </main>

</body>
</html>
