<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>High-Contrast Accessible Screen Reader Motion-State Indicator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../easemotion.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>Accessible Motion State Indicator</h1>
      <p>Synchronized aria-live announcements and high-contrast focus rings.</p>
      <button class="a11y-btn" onclick="triggerAction()">Trigger Accessible State</button>
    </header>

    <div aria-live="polite" class="sr-only" id="ariaAnnouncer"></div>
    <div class="status-card" id="statusCard">Status: Idle</div>
  </div>

  <script>
    function triggerAction() {
      const card = document.getElementById('statusCard');
      const announcer = document.getElementById('ariaAnnouncer');
      card.classList.add('active');
      card.textContent = 'Status: Operation Complete';
      announcer.textContent = 'Operation completed successfully.';
      setTimeout(() => card.classList.remove('active'), 2000);
    }
  </script>
</body>
</html>
