<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cinematic Depth-of-Field Parallax</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="parallax-scene">
    <!-- Background Layer: Starts sharp, becomes blurry as you scroll -->
    <div class="parallax-layer layer-bg"></div>
    
    <!-- Midground Layer: Stays relatively sharp -->
    <div class="parallax-layer layer-mid"></div>
    
    <!-- Foreground Layer: Starts blurry, becomes sharp, then blurry again -->
    <div class="parallax-layer layer-fg"></div>
  </div>

  <div class="content">
    <h1>Scroll Down</h1>
    <p>Notice the focal plane shifting dynamically.</p>
    
    <div class="spacer"></div>
    
    <h2>True Cinematic Depth of Field</h2>
    <p>Powered entirely by CSS <code>animation-timeline: scroll()</code>.</p>
    
    <div class="spacer"></div>
    
    <h2>No JavaScript Required</h2>
    <p>High performance GPU-accelerated blur and translation.</p>
    
    <div class="spacer"></div>
  </div>
</body>
</html>
