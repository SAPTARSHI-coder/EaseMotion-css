<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cinematic Depth-of-Field Parallax Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="ease-camera-viewport" aria-hidden="true">
    <div class="ease-layer ease-layer-back"></div>
    <div class="ease-layer ease-layer-mid"></div>
    <div class="ease-layer ease-layer-front"></div>
    <h1 class="ease-cinematic-title">Cinematic</h1>
  </div>
  <div class="ease-scroll-hint">Scroll Down</div>
  <!-- Note: Body has min-height 400vh to force the scrollbar natively -->
  <p style="position: absolute; bottom: 2rem; color: #64748b; font-family: system-ui; font-size: 0.875rem; text-align: center; width: 100%;">Focal plane physics and Depth-of-Field calculated purely via CSS animation-timeline.<br>Zero JavaScript IntersectionObservers.</p>
</body>
</html>
