<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Interactive Signal Bloom visualization with expanding signal rings and particle blooms."
  >

  <title>Signal Bloom</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="page">
    <header class="page-header">
      <p class="eyebrow">EaseMotion CSS</p>

      <h1>Signal Bloom</h1>

      <p>
        Send a communication signal from the central transmitter
        and watch it grow into a luminous particle bloom.
      </p>
    </header>

    <section class="controls" aria-label="Signal controls">
      <div class="control-group">
        <label for="strength">
          Signal Strength
          <output id="strength-value">60%</output>
        </label>

        <input
          id="strength"
          type="range"
          min="20"
          max="100"
          value="60"
        >
      </div>

      <div class="control-group">
        <label for="frequency">
          Frequency
          <output id="frequency-value">Medium</output>
        </label>

        <select id="frequency">
          <option value="slow">Low</option>
          <option value="medium" selected>Medium</option>
          <option value="fast">High</option>
        </select>
      </div>

      <div class="transmission-count">
        <span>Transmissions</span>
        <strong id="transmission-count" aria-live="polite">0</strong>
      </div>

      <button
        class="clear-button"
        id="clear-signals"
        type="button"
      >
        Clear
      </button>
    </section>

    <section
      class="signal-stage"
      id="signal-stage"
      aria-label="Interactive signal visualization"
    >
      <div class="star-field" aria-hidden="true"></div>

      <div
        class="signal-layer"
        id="signal-layer"
        aria-hidden="true"
      ></div>

      <button
        class="transmitter"
        id="transmitter"
        type="button"
        aria-label="Send signal"
      >
        <span class="transmitter-core"></span>
        <span class="transmitter-ring ring-one"></span>
        <span class="transmitter-ring ring-two"></span>
        <span class="transmitter-ring ring-three"></span>

        <span class="transmitter-label">
          TRANSMIT
        </span>
      </button>

      <p class="stage-hint">
        Click transmitter · Press Enter or Space
      </p>
    </section>

    <p
      class="status"
      id="status"
      aria-live="polite"
    >
      Transmitter ready.
    </p>
  </main>

  <script src="script.js"></script>
</body>
</html>
