<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Float-Drift Modal - EaseMotion CSS</title>
  <!-- Import EaseMotion CSS -->
  <link rel="stylesheet" href="../../../easemotion.css">
  <!-- Component Specific Styles -->
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="checkout-bg">

  <div class="demo-container">
    
    <div class="checkout-panel ease-glass-card">
      <div class="checkout-header">
        <h2 class="ease-text-xl">Checkout</h2>
      </div>

      <div class="checkout-body">
        <div class="summary-item">
          <span>Subtotal</span>
          <span>$185.00</span>
        </div>
        <div class="summary-item">
          <span>Shipping</span>
          <span>$15.00</span>
        </div>
        <div class="summary-total">
          <span>Total</span>
          <span>$200.00</span>
        </div>
      </div>
      
      <div class="checkout-footer">
        <!-- Button acting as Modal Trigger (linked to hidden checkbox) -->
        <label for="modal-toggle" class="pay-btn ease-squish-button" tabindex="0">
          Confirm & Pay
        </label>
      </div>
    </div>

  </div>

  <!-- 
    ========================================
    Float-Drift Modal Component 
    ======================================== 
  -->
  
  <!-- Hidden Checkbox for Modal State -->
  <input type="checkbox" id="modal-toggle" class="modal-checkbox">
  
  <!-- Modal Overlay / Backdrop -->
  <div class="modal-overlay">
    
    <!-- Close trigger covering entire background -->
    <label for="modal-toggle" class="modal-close-backdrop"></label>
    
    <!-- The Float-Drift Modal Container -->
    <div class="float-drift-modal">
      
      <div class="modal-header">
        <div class="modal-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
        </div>
        <h3 class="modal-title">Confirm Your Order</h3>
        <label for="modal-toggle" class="modal-close-btn" aria-label="Close modal">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </label>
      </div>
      
      <div class="modal-body">
        <p>You are about to charge <strong>$200.00</strong> to your card ending in <strong>4242</strong>.</p>
        <p class="modal-note">By confirming, you agree to our terms of service and return policy.</p>
      </div>
      
      <div class="modal-footer">
        <label for="modal-toggle" class="btn btn-secondary">Cancel</label>
        <button class="btn btn-primary">Submit Payment</button>
      </div>
      
    </div>
  </div>

</body>
</html>
