
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Glassmorphic infinite seamless logo carousel with pause on hover"
  >
  <title>Glassmorphic Logo Carousel</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="page">
    <section class="showcase" aria-labelledby="title">

      <div class="heading">
        <span class="eyebrow">OUR ECOSYSTEM</span>

        <h1 id="title">
          Technology that
          <span>moves with you.</span>
        </h1>

        <p>
          A seamless glassmorphic logo carousel designed
          for modern interfaces and smooth interactions.
        </p>
      </div>

      <div
        class="carousel"
        aria-label="Technology partners"
      >
        <div class="carousel-track">

          <article class="logo-card">
            <div class="logo-mark mark-alpha">A</div>
            <span>ALPHA</span>
          </article>

          <article class="logo-card">
            <div class="logo-mark mark-nova">N</div>
            <span>NOVA</span>
          </article>

          <article class="logo-card">
            <div class="logo-mark mark-zenith">Z</div>
            <span>ZENITH</span>
          </article>

          <article class="logo-card">
            <div class="logo-mark mark-pulse">P</div>
            <span>PULSE</span>
          </article>

          <article class="logo-card">
            <div class="logo-mark mark-orbit">O</div>
            <span>ORBIT</span>
          </article>

          <article class="logo-card">
            <div class="logo-mark mark-vector">V</div>
            <span>VECTOR</span>
          </article>

          <!-- Duplicate set for seamless looping -->

          <article class="logo-card" aria-hidden="true">
            <div class="logo-mark mark-alpha">A</div>
            <span>ALPHA</span>
          </article>

          <article class="logo-card" aria-hidden="true">
            <div class="logo-mark mark-nova">N</div>
            <span>NOVA</span>
          </article>

          <article class="logo-card" aria-hidden="true">
            <div class="logo-mark mark-zenith">Z</div>
            <span>ZENITH</span>
          </article>

          <article class="logo-card" aria-hidden="true">
            <div class="logo-mark mark-pulse">P</div>
            <span>PULSE</span>
          </article>

          <article class="logo-card" aria-hidden="true">
            <div class="logo-mark mark-orbit">O</div>
            <span>ORBIT</span>
          </article>

          <article class="logo-card" aria-hidden="true">
            <div class="logo-mark mark-vector">V</div>
            <span>VECTOR</span>
          </article>

        </div>
      </div>

      <div class="hint">
        <span class="hint-dot"></span>
        <span>Hover to pause</span>
      </div>

    </section>
  </main>
</body>
</html>
