<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 3D Flip Badge</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="badge-container">

    <div class="badge">
        <div class="badge-inner">
            <div class="badge-front">Featured</div>
            <div class="badge-back">Live</div>
        </div>
    </div>

    <div class="badge success">
        <div class="badge-inner">
            <div class="badge-front">Accessible</div>
            <div class="badge-back">WCAG</div>
        </div>
    </div>

    <div class="badge warning">
        <div class="badge-inner">
            <div class="badge-front">New</div>
            <div class="badge-back">2026</div>
        </div>
    </div>

</div>

</body>
</html>
