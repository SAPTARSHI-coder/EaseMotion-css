<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CSS transaction history rows.">
  <title>CSS Transaction History Row</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="transactions" aria-labelledby="transactions-title">

    <header>
      <span class="eyebrow">Activity</span>
      <h1 id="transactions-title">Transaction History</h1>
    </header>

    <div class="transaction-list">

      <article class="transaction">
        <div class="icon income" aria-hidden="true">↓</div>

        <div class="details">
          <strong>Salary payment</strong>
          <span>Today · 10:24 AM</span>
        </div>

        <div class="amount">
          <strong>+$2,400</strong>
          <span class="success">Completed</span>
        </div>
      </article>

      <article class="transaction">
        <div class="icon expense" aria-hidden="true">↑</div>

        <div class="details">
          <strong>Online purchase</strong>
          <span>Yesterday · 4:18 PM</span>
        </div>

        <div class="amount">
          <strong>-$86.40</strong>
          <span class="success">Completed</span>
        </div>
      </article>

      <article class="transaction">
        <div class="icon pending" aria-hidden="true">↻</div>

        <div class="details">
          <strong>Bank transfer</strong>
          <span>Yesterday · 1:40 PM</span>
        </div>

        <div class="amount">
          <strong>-$350</strong>
          <span class="warning">Pending</span>
        </div>
      </article>

    </div>

  </main>

</body>
</html>
