<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CSS Zoom-In Tooltip | Fintech Dashboard</title>

<link rel="stylesheet" href="style.css">

</head>


<body>

<header class="header">

<h1>FinVault Dashboard</h1>

<p>Zoom-In Tooltip Interaction</p>

</header>


<main class="grid">


<div class="card tooltip-box">

<div class="circle">
$
</div>

<h2>Revenue</h2>

<p>Track financial performance</p>


<div class="tooltip">

<h3>Revenue Growth</h3>

<span>
+32% increase this month
</span>

</div>

</div>



<div class="card tooltip-box">

<div class="circle">
%
</div>

<h2>Investment</h2>

<p>Monitor portfolio activity</p>


<div class="tooltip">

<h3>Portfolio Status</h3>

<span>
Stable market position
</span>

</div>

</div>




<div class="card tooltip-box">

<div class="circle">
🔒
</div>

<h2>Security</h2>

<p>Protected transactions</p>


<div class="tooltip">

<h3>Security Level</h3>

<span>
Maximum protection enabled
</span>

</div>

</div>


</main>


</body>

</html>
