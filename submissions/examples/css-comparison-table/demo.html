<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Comparison Table - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="em-comp-page">
        <div class="em-card" role="region" aria-label="Comparison Table Showcase">
            <span class="em-card-badge">PRICING & FEATURES</span>
            <h1 class="em-card-title">Feature Comparison</h1>
            <p class="em-card-desc">Side-by-side feature comparison table with checkmarks, highlights, and responsive column layouts.</p>
            
            <!-- Comparison Table Container -->
            <div class="em-table-container" tabindex="0" role="region" aria-label="Comparison Matrix">
                <table class="em-comparison-table">
                    <thead>
                        <tr>
                            <th>Features</th>
                            <th>Starter</th>
                            <th class="em-highlight-col">Pro</th>
                            <th>Enterprise</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>Pure CSS Animations</td>
                            <td><span class="em-check" aria-label="Included">✓</span></td>
                            <td class="em-highlight-col"><span class="em-check" aria-label="Included">✓</span></td>
                            <td><span class="em-check" aria-label="Included">✓</span></td>
                        </tr>
                        <tr>
                            <td>Custom Variables</td>
                            <td><span class="em-cross" aria-label="Not included">✕</span></td>
                            <td class="em-highlight-col"><span class="em-check" aria-label="Included">✓</span></td>
                            <td><span class="em-check" aria-label="Included">✓</span></td>
                        </tr>
                        <tr>
                            <td>Priority Support</td>
                            <td><span class="em-cross" aria-label="Not included">✕</span></td>
                            <td class="em-highlight-col"><span class="em-check" aria-label="Included">✓</span></td>
                            <td><span class="em-check" aria-label="Included">✓</span></td>
                        </tr>
                        <tr>
                            <td>Advanced Analytics</td>
                            <td><span class="em-cross" aria-label="Not included">✕</span></td>
                            <td><span class="em-cross" aria-label="Not included">✕</span></td>
                            <td class="em-highlight-col"><span class="em-check" aria-label="Included">✓</span></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
