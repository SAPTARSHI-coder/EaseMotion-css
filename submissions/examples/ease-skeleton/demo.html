<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animated Skeleton Loaders Demo</title>
  <link rel="stylesheet" href="../../../easemotion.css">
  <link rel="stylesheet" href="./style.css">
  <style>
    body {
      background-color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 2rem;
    }
    
    .demo-card {
      background: white;
      border-radius: 12px;
      padding: 2rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 400px;
    }

    .flex-row {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .flex-col {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      flex: 1;
    }
  </style>
</head>
<body>

  <div class="demo-card">
    <div class="flex-row">
      <!-- Circle Avatar Skeleton -->
      <div class="ease-skeleton ease-skeleton-circle" style="width: 3.5rem; height: 3.5rem;"></div>
      
      <!-- Text Skeletons -->
      <div class="flex-col">
        <div class="ease-skeleton ease-skeleton-text" style="width: 60%;"></div>
        <div class="ease-skeleton ease-skeleton-text" style="width: 40%;"></div>
      </div>
    </div>

    <!-- Paragraph Skeletons -->
    <div class="flex-col" style="gap: 0.75rem;">
      <div class="ease-skeleton ease-skeleton-text" style="width: 100%;"></div>
      <div class="ease-skeleton ease-skeleton-text" style="width: 100%;"></div>
      <div class="ease-skeleton ease-skeleton-text" style="width: 85%;"></div>
    </div>
  </div>

</body>
</html>
