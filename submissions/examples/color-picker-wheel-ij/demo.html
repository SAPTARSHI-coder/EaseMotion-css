<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-color-picker-wheel demo</title>
</head>
<body>
<div class="cw-app">
  <span class="cw-title">COLOR PICKER</span>
  <div class="cw-wheel">
    <span class="cw-sector cw-sector-1"></span>
    <span class="cw-sector cw-sector-2"></span>
    <span class="cw-sector cw-sector-3"></span>
    <span class="cw-sector cw-sector-4"></span>
    <span class="cw-sector cw-sector-5"></span>
    <span class="cw-sector cw-sector-6"></span>
    <span class="cw-sector cw-sector-7"></span>
    <span class="cw-sector cw-sector-8"></span>
    <span class="cw-hub"></span>
    <span class="cw-picker"></span>
  </div>
  <div class="cw-swatch">
    <span class="cw-hex">#E0533D</span>
  </div>
</div>
</body>
</html>
