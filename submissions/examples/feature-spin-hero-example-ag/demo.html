<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spin Hero (Error State)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<section class="spin-hero-example-ag" aria-label="Error State Hero">
    <div class="spin-card-ag">
        <div class="error-icon-ag" aria-hidden="true">⚠</div>
        <h1>Something Went Wrong</h1>
        <p>
            We couldn't complete your request.
            Please try again in a moment.
        </p>

        <button class="retry-btn-ag">
            Retry
        </button>
    </div>
</section>

</body>
</html>
