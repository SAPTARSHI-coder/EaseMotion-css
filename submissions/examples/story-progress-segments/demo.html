<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Story Progress Segments</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="stories">

    <div class="stories-progress" aria-hidden="true">
        <span class="seg is-done"></span>
        <span class="seg is-active"></span>
        <span class="seg"></span>
        <span class="seg"></span>
    </div>

    <input type="radio" name="story" id="story1" checked>
    <input type="radio" name="story" id="story2">
    <input type="radio" name="story" id="story3">
    <input type="radio" name="story" id="story4">

    <section class="stories-panel">
        <h2>Story One</h2>
        <p>Welcome to the EaseMotion CSS story progress demo.</p>
    </section>

    <section class="stories-panel">
        <h2>Story Two</h2>
        <p>Each segment represents an individual story in the sequence.</p>
    </section>

    <section class="stories-panel">
        <h2>Story Three</h2>
        <p>The active segment animates while completed ones remain filled.</p>
    </section>

    <section class="stories-panel">
        <h2>Story Four</h2>
        <p>Hover over the progress bar to pause the active animation.</p>
    </section>

    <div class="story-controls">
        <label for="story1">1</label>
        <label for="story2">2</label>
        <label for="story3">3</label>
        <label for="story4">4</label>
    </div>

</div>

</body>
</html>
