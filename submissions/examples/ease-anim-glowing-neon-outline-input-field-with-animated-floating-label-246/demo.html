<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glowing Neon Outline Input Field - Vibrant Gradient</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="container">
    <div class="input-wrapper">
      <!-- We use a placeholder " " so that the :placeholder-shown pseudo-class works correctly -->
      <input type="text" id="neon-input" class="neon-input" placeholder=" " required autocomplete="off">
      <label for="neon-input" class="floating-label">Enter your email</label>
      <div class="neon-border"></div>
      <div class="neon-glow"></div>
    </div>
  </main>

</body>
</html>
