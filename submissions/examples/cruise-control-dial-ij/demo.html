<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-cruise-control-dial</title>
</head>
<body>
<main class="ccd-card">
  <header class="ccd-head">
    <h1 class="ccd-title">Cruise Ctrl</h1>
    <span class="ccd-on">Active</span>
  </header>
  <section class="ccd-stage" aria-label="speed dial">
    <span class="ccd-gauge">
      <span class="ccd-tick ccd-tick-0"></span>
      <span class="ccd-tick ccd-tick-1"></span>
      <span class="ccd-tick ccd-tick-2"></span>
      <span class="ccd-tick ccd-tick-3"></span>
      <span class="ccd-needle"></span>
      <strong class="ccd-speed">55</strong>
      <span class="ccd-unit">mph</span>
    </span>
  </section>
  <section class="ccd-set" aria-label="set speed">
    <span class="ccd-set-label">Set</span>
    <strong class="ccd-set-val">58</strong>
  </section>
  <section class="ccd-keys" aria-label="cruise keys">
    <span class="ccd-key ccd-key-set">SET</span>
    <span class="ccd-key">RES</span>
    <span class="ccd-key">ACC</span>
    <span class="ccd-key ccd-key-can">CANCEL</span>
  </section>
  <footer class="ccd-foot">
    <span class="ccd-road">Cruising</span>
    <span class="ccd-brake">Brake tap</span>
  </footer>
</main>
</body>
</html>
