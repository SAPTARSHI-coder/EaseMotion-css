<!doctype html>
<html lang="en">
<head>

<link rel="stylesheet" href="style.css">
<title>ease-airplane-boarding-pass demo</title>
</head>
<body>
<div class="bop-pass">

    <span class="bop-air">SKYWAY</span>

  <div class="bop-mid">
    <span class="bop-city">BLR</span>
