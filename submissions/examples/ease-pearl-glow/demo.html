<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pearl Glow · Glowing Pearl with Iridescence</title>
    <meta name="description" content="Mesmerizing glowing pearl with iridescent shimmer, rainbow reflections, and soft luminescent glow.">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1 class="title">🪷 PEARL GLOW</h1>
        
        <div class="canvas-wrapper">
            <canvas id="pearlCanvas" width="600" height="500"></canvas>
            <div class="glow-overlay"></div>
        </div>

        <div class="controls">
            <button class="toggle-btn" id="toggleBtn">⏸️ PAUSE</button>
            <button class="reset-btn" id="resetBtn">⟳ RESET</button>
            <div class="speed-control">
                <label>Speed</label>
                <input type="range" id="speedSlider" min="1" max="10" value="5">
                <span id="speedLabel">5</span>
            </div>
        </div>

        <div class="info">
            <span>🪷 PEARL GLOW</span>
            <small>iridescent · luminous · shimmer</small>
        </div>
        <div class="hint">
            <span>✨ glowing pearl with iridescent rainbow reflections</span>
        </div>
    </div>

    <script>
        (function() {
            const canvas = document.getElementById('pearlCanvas');
            const ctx = canvas.getContext('2d');
            const W = 600, H = 500;
            
            const toggleBtn = document.getElementById('toggleBtn');
            const resetBtn = document.getElementById('resetBtn');
            const speedSlider = document.getElementById('speedSlider');
            const speedLabel = document.getElementById('speedLabel');

            let isAnimating = true;
            let speed = 5;
            let time = 0;

            // ---- Pearl Class ----
            class Pearl {
                constructor() {
                    this.x = W / 2;
                    this.y = H / 2;
                    this.radius = 80;
                    this.baseRadius = 80;
                    
                    // Float
                    this.floatPhase = 0;
                    this.floatSpeed = 0.01;
                    this.floatAmplitude = 8;
                    
                    // Glow pulse
                    this.pulsePhase = 0;
                    this.pulseSpeed = 0.015;
                    this.pulseAmount = 0.1;
                    
                    // Iridescent shift
                    this.iridescentPhase = 0;
                    this.iridescentSpeed = 0.008;
                }

                update() {
                    const dt = speed / 5;
                    this.floatPhase += this.floatSpeed * dt;
                    this.pulsePhase += this.pulseSpeed * dt;
                    this.iridescentPhase += this.iridescentSpeed * dt;
                    
                    // Float
                    this.y = H / 2 + Math.sin(this.floatPhase) * this.floatAmplitude;
                    
                    // Pulse
                    const pulse = 1 + Math.sin(this.pulsePhase) * this.pulseAmount;
                    this.radius = this.baseRadius * pulse;
                }

                draw(ctx) {
                    const r = this.radius;
                    const x = this.x;
                    const y = this.y;
                    
                    // ---- Outer glow ----
                    const glowGrad = ctx.createRadialGradient(x, y, 0, x, y, r * 3);
                    const glowColor = `hsla(${(this.iridescentPhase * 360 + 200) % 360}, 80%, 70%, 0.15)`;
                    glowGrad.addColorStop(0, `hsla(${(this.iridescentPhase * 360 + 180) % 360}, 80%, 80%, 0.3)`);
                    glowGrad.addColorStop(0.3, `hsla(${(this.iridescentPhase * 360 + 220) % 360}, 80%, 70%, 0.15)`);
                    glowGrad.addColorStop(0.7, `hsla(${(this.iridescentPhase * 360 + 260) % 360}, 70%, 60%, 0.05)`);
                    glowGrad.addColorStop(1, 'rgba(0,0,0,0)');
                    ctx.fillStyle = glowGrad;
                    ctx.shadowBlur = 0;
                    ctx.beginPath();
                    ctx.arc(x, y, r * 3, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // ---- Pearl body ----
                    ctx.save();
                    ctx.shadowColor = `hsla(${(this.iridescentPhase * 360 + 200) % 360}, 100%, 80%, 0.3)`;
                    ctx.shadowBlur = 40;
                    
                    // Base gradient
                    const bodyGrad = ctx.createRadialGradient(
                        x - r * 0.3, y - r * 0.3, 0,
                        x, y, r
                    );
                    bodyGrad.addColorStop(0, `hsla(${(this.iridescentPhase * 360 + 180) % 360}, 60%, 95%, 1)`);
                    bodyGrad.addColorStop(0.2, `hsla(${(this.iridescentPhase * 360 + 200) % 360}, 50%, 90%, 1)`);
                    bodyGrad.addColorStop(0.4, `hsla(${(this.iridescentPhase * 360 + 230) % 360}, 40%, 85%, 1)`);
                    bodyGrad.addColorStop(0.6, `hsla(${(this.iridescentPhase * 360 + 260) % 360}, 35%, 80%, 1)`);
                    bodyGrad.addColorStop(0.8, `hsla(${(this.iridescentPhase * 360 + 290) % 360}, 30%, 75%, 1)`);
                    bodyGrad.addColorStop(1, `hsla(${(this.iridescentPhase * 360 + 320) % 360}, 25%, 70%, 1)`);
                    
                    ctx.fillStyle = bodyGrad;
                    ctx.beginPath();
                    ctx.arc(x, y, r, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // ---- Iridescent rings ----
                    for (let i = 0; i < 5; i++) {
                        const ringRadius = r * (0.2 + i * 0.15);
                        const ringHue = (this.iridescentPhase * 360 + i * 40 + 180) % 360;
                        ctx.shadowBlur = 20;
                        ctx.shadowColor = `hsla(${ringHue}, 100%, 70%, 0.2)`;
                        ctx.strokeStyle = `hsla(${ringHue}, 80%, 75%, ${0.1 + Math.sin(this.pulsePhase + i) * 0.05})`;
                        ctx.lineWidth = 1 + Math.sin(this.pulsePhase + i * 0.5) * 0.5;
                        ctx.beginPath();
                        ctx.arc(x, y, ringRadius, 0, Math.PI * 2);
                        ctx.stroke();
                    }
                    
                    // ---- Inner glow core ----
                    ctx.shadowBlur = 0;
                    const coreGrad = ctx.createRadialGradient(
                        x - r * 0.2, y - r * 0.2, 0,
                        x, y, r * 0.5
                    );
                    coreGrad.addColorStop(0, `hsla(${(this.iridescentPhase * 360 + 180) % 360}, 80%, 98%, 0.8)`);
                    coreGrad.addColorStop(0.5, `hsla(${(this.iridescentPhase * 360 + 200) % 360}, 70%, 95%, 0.4)`);
                    coreGrad.addColorStop(1, 'rgba(255,255,255,0)');
                    ctx.fillStyle = coreGrad;
                    ctx.beginPath();
                    ctx.arc(x, y, r * 0.5, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // ---- Highlights ----
                    ctx.shadowBlur = 0;
                    
                    // Main highlight
                    ctx.fillStyle = `hsla(${(this.iridescentPhase * 360 + 200) % 360}, 60%, 100%, 0.4)`;
                    ctx.beginPath();
                    ctx.ellipse(
                        x - r * 0.25,
                        y - r * 0.3,
                        r * 0.3,
                        r * 0.15,
                        -0.5,
                        0,
                        Math.PI * 2
                    );
                    ctx.fill();
                    
                    // Secondary highlight
                    ctx.fillStyle = `hsla(${(this.iridescentPhase * 360 + 240) % 360}, 50%, 100%, 0.2)`;
                    ctx.beginPath();
                    ctx.ellipse(
                        x + r * 0.15,
                        y - r * 0.15,
                        r * 0.15,
                        r * 0.08,
                        0.3,
                        0,
                        Math.PI * 2
                    );
                    ctx.fill();
                    
                    // ---- Iridescent specks ----
                    for (let i = 0; i < 12; i++) {
                        const angle = (i / 12) * Math.PI * 2 + this.iridescentPhase * 0.5;
                        const dist = r * (0.5 + Math.sin(this.pulsePhase + i) * 0.2);
                        const sx = x + Math.cos(angle) * dist;
                        const sy = y + Math.sin(angle) * dist * 0.7;
                        const speckSize = 1.5 + Math.sin(this.pulsePhase * 1.5 + i * 2) * 1;
                        const hue = (this.iridescentPhase * 360 + i * 30 + 180) % 360;
                        ctx.fillStyle = `hsla(${hue}, 100%, 90%, ${0.2 + Math.sin(this.pulsePhase + i) * 0.1})`;
                        ctx.shadowColor = `hsla(${hue}, 100%, 80%, 0.2)`;
                        ctx.shadowBlur = 10;
                        ctx.beginPath();
                        ctx.arc(sx, sy, speckSize, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    
                    ctx.restore();
                    
                    // ---- Outer glow ring ----
                    ctx.save();
                    const ringHue = (this.iridescentPhase * 360 + 200) % 360;
                    ctx.shadowColor = `hsla(${ringHue}, 100%, 80%, 0.2)`;
                    ctx.shadowBlur = 50;
                    ctx.strokeStyle = `hsla(${ringHue}, 80%, 80%, ${0.1 + Math.sin(this.pulsePhase) * 0.05})`;
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(x, y, r * 1.1, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.restore();
                    
                    // ---- Reflections on surface ----
                    ctx.save();
                    for (let i = 0; i < 3; i++) {
                        const angle = (i / 3) * Math.PI * 2 + this.iridescentPhase * 0.3;
                        const dist = r * 0.3;
                        const rx = x + Math.cos(angle) * dist;
                        const ry = y + Math.sin(angle) * dist * 0.5;
                        const hue = (this.iridescentPhase * 360 + i * 60 + 200) % 360;
                        const grad = ctx.createRadialGradient(rx, ry, 0, rx, ry, r * 0.15);
                        grad.addColorStop(0, `hsla(${hue}, 100%, 95%, 0.15)`);
                        grad.addColorStop(1, `hsla(${hue}, 100%, 95%, 0)`);
                        ctx.fillStyle = grad;
                        ctx.beginPath();
                        ctx.arc(rx, ry, r * 0.15, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    ctx.restore();
                }
            }

            // ---- Draw Background ----
            function drawBackground() {
                // Deep ocean gradient with pearl tones
                const gradient = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, W);
                gradient.addColorStop(0, '#0d1f3c');
                gradient.addColorStop(0.2, '#0a1a2a');
                gradient.addColorStop(0.5, '#0d1a25');
                gradient.addColorStop(0.8, '#0a1628');
                gradient.addColorStop(1, '#050a12');
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, W, H);
                
                // Ambient light rays
                for (let i = 0; i < 5; i++) {
                    const x = 50 + i * 125 + Math.sin(time * 0.005 + i * 1.5) * 30;
                    const gradient2 = ctx.createLinearGradient(x, 0, x + 15, H);
                    gradient2.addColorStop(0, `rgba(150, 200, 255, ${0.015 + Math.sin(time * 0.01 + i) * 0.01})`);
                    gradient2.addColorStop(0.5, `rgba(150, 200, 255, ${0.008})`);
                    gradient2.addColorStop(1, 'rgba(150, 200, 255, 0)');
                    ctx.fillStyle = gradient2;
                    ctx.fillRect(x, 0, 15, H);
                }
                
                // Bubbles
                for (let i = 0; i < 20; i++) {
                    const x = (i * 173 + 30) % W;
                    const y = (i * 97 + time * (0.1 + i * 0.005) * 5) % H;
                    const size = 1 + (i % 4) * 0.5;
                    const alpha = 0.015 + Math.sin(time * 0.01 + i * 2) * 0.01;
                    ctx.fillStyle = `rgba(200, 230, 255, ${alpha})`;
                    ctx.beginPath();
                    ctx.arc(x, y, size, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // ---- Create Pearl ----
            let pearl;

            function createPearl() {
                pearl = new Pearl();
            }

            // ---- Animation Loop ----
            function animate() {
                if (!isAnimating) {
                    requestAnimationFrame(animate);
                    return;
                }
                
                drawBackground();
                pearl.update();
                pearl.draw(ctx);
                
                // Ambient particles
                for (let i = 0; i < 15; i++) {
                    const x = (i * 197 + 40) % W;
                    const y = (i * 131 + time * (0.02 + i * 0.005) * 4) % H;
                    const size = 0.5 + Math.sin(time * 0.02 + i * 3) * 0.5 + 0.5;
                    const hue = (i * 40 + time * 15 + 200) % 360;
                    ctx.fillStyle = `hsla(${hue}, 80%, 80%, ${0.01 + Math.sin(time * 0.015 + i) * 0.008})`;
                    ctx.beginPath();
                    ctx.arc(x, y, size, 0, Math.PI * 2);
                    ctx.fill();
                }
                
                requestAnimationFrame(animate);
            }

            // ---- Toggle Animation ----
            function toggleAnimation() {
                isAnimating = !isAnimating;
                toggleBtn.textContent = isAnimating ? '⏸️ PAUSE' : '▶️ PLAY';
            }

            // ---- Reset ----
            function resetPearl() {
                createPearl();
                time = 0;
            }

            // ---- Speed Control ----
            speedSlider.addEventListener('input', function() {
                speed = parseInt(this.value);
                speedLabel.textContent = speed;
            });

            // ---- Event Listeners ----
            toggleBtn.addEventListener('click', toggleAnimation);
            resetBtn.addEventListener('click', resetPearl);

            // ---- Keyboard Shortcuts ----
            document.addEventListener('keydown', function(e) {
                if (e.key === ' ' || e.key === 'Space') {
                    e.preventDefault();
                    toggleAnimation();
                }
                if (e.key === 'r' || e.key === 'R') {
                    resetPearl();
                }
            });

            // ---- Initialize ----
            createPearl();
            animate();

            console.log('🪷 Pearl Glow · Press Space to pause · R to reset');
        })();
    </script>
</body>
</html>
