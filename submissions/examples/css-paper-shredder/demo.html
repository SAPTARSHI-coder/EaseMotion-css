<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Pure CSS paper shredder deletion animation"
  >
  <title>CSS Paper Shredder Effect</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="demo">
    <h1>CSS Paper Shredder Effect</h1>

    <p class="description">
      A paper sheet visually shreds into falling strips using only CSS.
    </p>

    <section class="shredder-demo" aria-label="Paper shredding animation">
      <div class="paper" aria-hidden="true">
        <span class="paper-strip strip-1">CSS</span>
        <span class="paper-strip strip-2">PAPER</span>
        <span class="paper-strip strip-3">EFFECT</span>
        <span class="paper-strip strip-4">DELETE</span>
        <span class="paper-strip strip-5">NOW</span>
        <span class="paper-strip strip-6">!</span>
      </div>

      <div class="shredder" aria-hidden="true">
        <div class="shredder-top"></div>
        <div class="shredder-body">
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>
    </section>

    <p class="status">
      Pure CSS • No JavaScript
    </p>
  </main>
</body>
</html>
