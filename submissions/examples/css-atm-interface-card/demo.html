<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS ATM Interface Card</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="page">
    <section class="atm-card" aria-labelledby="atm-title">
      <header class="atm-header">
        <div class="bank-mark" aria-hidden="true">ATM</div>

        <div>
          <p class="eyebrow">Personal Banking</p>
          <h1 id="atm-title">My Account</h1>
        </div>

        <span class="status" aria-label="Account status: active">
          Active
        </span>
      </header>

      <div class="balance-section">
        <p>Available Balance</p>
        <strong aria-label="Available balance: 24,580 rupees">
          ₹24,580.00
        </strong>
      </div>

      <nav class="menu" aria-label="ATM menu">
        <button type="button" class="menu-item">
          <span class="menu-icon" aria-hidden="true">↓</span>
          <span>
            <strong>Withdraw</strong>
            <small>Take out cash</small>
          </span>
        </button>

        <button type="button" class="menu-item">
          <span class="menu-icon" aria-hidden="true">↑</span>
          <span>
            <strong>Deposit</strong>
            <small>Add money</small>
          </span>
        </button>

        <button type="button" class="menu-item">
          <span class="menu-icon" aria-hidden="true">↔</span>
          <span>
            <strong>Transfer</strong>
            <small>Move money</small>
          </span>
        </button>

        <button type="button" class="menu-item">
          <span class="menu-icon" aria-hidden="true">≡</span>
          <span>
            <strong>Transactions</strong>
            <small>View activity</small>
          </span>
        </button>
      </nav>

      <footer class="atm-footer">
        <span>•••• 4821</span>
        <span>Secure account</span>
      </footer>
    </section>
  </main>
</body>
</html>
