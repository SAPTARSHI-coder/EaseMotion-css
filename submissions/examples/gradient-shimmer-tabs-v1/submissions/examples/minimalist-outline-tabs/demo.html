<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimalist Outline Tabs</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>Minimalist Outline Tabs</h1>

    <input type="radio" id="tab1" name="tabs" checked>
    <input type="radio" id="tab2" name="tabs">
    <input type="radio" id="tab3" name="tabs">
    <input type="radio" id="tab4" name="tabs">

    <div class="tabs">
        <label for="tab1">Overview</label>
        <label for="tab2">Analytics</label>
        <label for="tab3">Settings</label>
        <label for="tab4">Profile</label>
    </div>

    <div class="content">
        <section class="panel panel1">
            <h2>Overview</h2>
            <p>Simple outlined tabs with smooth animations and clean spacing.</p>
        </section>

        <section class="panel panel2">
            <h2>Analytics</h2>
            <p>Elegant minimalist styling suitable for modern interfaces.</p>
        </section>

        <section class="panel panel3">
            <h2>Settings</h2>
            <p>Responsive layout built using semantic HTML and pure CSS.</p>
        </section>

        <section class="panel panel4">
            <h2>Profile</h2>
            <p>No JavaScript required for switching tabs.</p>
        </section>
    </div>

</div>

</body>
</html>
