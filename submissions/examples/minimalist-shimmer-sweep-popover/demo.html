<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Shimmer-Sweep Popover - Minimalist Tech</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="layout-container">
        
        <header class="section-header">
            <h1 class="title">Product Details</h1>
            <p class="subtitle">Hover over the info badge to view the premium shimmer sweep effect.</p>
        </header>

        <div class="dashboard-area">
            
            <div class="product-card">
                <div class="product-image"></div>
                <div class="product-info">
                    <div class="product-title-row">
                        <h3>Mechanical Keyboard Pro</h3>
                        
                        <!-- Popover Container -->
                        <div class="popover-container">
                            <!-- Trigger Element -->
                            <div class="info-trigger">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
                            </div>
                            
                            <!-- The Popover Content -->
                            <div class="popover-content shimmer-target">
                                <div class="shimmer-overlay"></div>
                                <div class="popover-inner">
                                    <h4>Premium Build</h4>
                                    <p>Constructed with aerospace-grade aluminum and features double-shot PBT keycaps for maximum durability.</p>
                                    <div class="specs-grid">
                                        <div class="spec">
                                            <span class="label">Switches</span>
                                            <span class="value">Cherry MX Red</span>
                                        </div>
                                        <div class="spec">
                                            <span class="label">Polling</span>
                                            <span class="value">1000Hz</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                    </div>
                    <div class="product-price">$149.00</div>
                    <button class="btn btn-primary mt-4 w-full">Add to Cart</button>
                </div>
            </div>

        </div>
        
    </div>

</body>
</html>
