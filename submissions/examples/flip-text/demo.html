<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Flip Text — EaseMotion CSS</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="page">
        <section class="demo" aria-labelledby="demo-title">
            <div class="intro">
                <p class="eyebrow">EaseMotion CSS · Text</p>
                <h1 id="demo-title">Flip Text</h1>
                <p>Hover over the phrase and watch each letter roll vertically into place.</p>
            </div>

            <div class="showcase">
                <a class="flip-text" href="#" aria-label="Explore motion">
                    <span class="flip-word" aria-hidden="true">
            <span class="letter" style="--i: 0"><span>H</span><span>H</span></span>
                    <span class="letter" style="--i: 1"><span>O</span><span>O</span></span>
                    <span class="letter" style="--i: 2"><span>V</span><span>V</span></span>
                    <span class="letter" style="--i: 3"><span>E</span><span>E</span></span>
                    <span class="letter" style="--i: 4"><span>R</span><span>R</span></span>
                    </span>

                    <span class="flip-word" aria-hidden="true">
            <span class="letter" style="--i: 5"><span>M</span><span>M</span></span>
                    <span class="letter" style="--i: 6"><span>E</span><span>E</span></span>
                    </span>
                </a>

                <p class="hint">Move your cursor over the text</p>
            </div>
        </section>
    </main>
</body>

</html>
