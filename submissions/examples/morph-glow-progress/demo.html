<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EaseMotion CSS - Morph-Glow Progress Bar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="tech-container">
        <header class="tech-header">
            <h1>System Diagnostics</h1>
            <p>Initializing core components...</p>
        </header>

        <section class="progress-section">
            <div class="progress-label-group">
                <span class="progress-label">Neural Network Sync</span>
                <span class="progress-percentage">85%</span>
            </div>
            
            <!-- Morph-Glow Progress Bar Structure -->
            <div class="em-progress-track" role="progressbar" aria-valuenow="85" aria-valuemin="0" aria-valuemax="100">
                <div class="em-progress-fill morph-glow" style="--target-width: 85%;"></div>
            </div>
        </section>

        <section class="progress-section">
            <div class="progress-label-group">
                <span class="progress-label">Data Encryption</span>
                <span class="progress-percentage">100%</span>
            </div>
            
            <!-- Morph-Glow Progress Bar Structure (Completed state) -->
            <div class="em-progress-track" role="progressbar" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100">
                <div class="em-progress-fill morph-glow complete" style="--target-width: 100%;"></div>
            </div>
        </section>
    </main>
</body>
</html>
