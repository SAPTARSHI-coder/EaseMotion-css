<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Stabilizer Code Teleport - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css"></head><body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030712; color: #ffffff;">

    <div class="ease-card ease-card-glass stabilizer-container">
        <div class="stabilizer-header">
            <h2>Stabilizer Code Teleport</h2>
            <span class="ease-badge ease-badge-info">Active</span>
        </div>
        
        <div class="stabilizer-screen ease-center">
            <div class="syndrome-flux flux-alpha"></div>
            <div class="syndrome-flux flux-beta"></div>
            <div class="stabilizer-lattice-ring"></div>
            <div class="qubit-node-core ease-center"></div>
        </div>

        <div class="stabilizer-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Syndrome: S = Z &otimes; Z &otimes; X</span>
            <button class="ease-btn ease-btn-info ease-btn-sm ease-hover-grow">Run Syndrome Check</button>
        </div>
    </div></body></html>
