<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shift Basket Raise — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Shift Basket Raise demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Shift Basket Raise</h1>
      <p class="lede">Shift basket raising the lowercase type</p>
    </header>

    <section class="ease-shift-basket-raise" data-demo="shift-basket-raise" aria-live="polite">
      <div class="ease-shift-basket-raise__housing">
        <div class="ease-shift-basket-raise__bezel">
          <div class="ease-shift-basket-raise__face">
            <div class="ease-shift-basket-raise__readout">
              <span class="ease-shift-basket-raise__label">Shift Basket Raise</span>
              <span class="ease-shift-basket-raise__value">LIVE</span>
            </div>
            <div class="ease-shift-basket-raise__motion" aria-hidden="true">
              <span class="ease-shift-basket-raise__a"></span>
              <span class="ease-shift-basket-raise__b"></span>
              <span class="ease-shift-basket-raise__c"></span>
              <span class="ease-shift-basket-raise__d"></span>
            </div>
            <div class="ease-shift-basket-raise__meters">
              <i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-shift-basket-raise__controls">
          <button type="button" class="ease-shift-basket-raise__btn primary">Shift</button>
          <button type="button" class="ease-shift-basket-raise__btn">Lock</button>
          <label class="ease-shift-basket-raise__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-shift-basket-raise__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
