<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sunburst Effect</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="sunburst-wrap">
    <canvas id="sunburst-canvas"></canvas>

    <div class="controls-panel">
      <h1 class="panel-title">Sunburst</h1>
      <p class="panel-hint">Click the canvas or press Space to burst</p>

      <div class="control-row">
        <label for="mode-select">Mode</label>
        <select id="mode-select">
          <option value="burst">Burst</option>
          <option value="pulse">Pulse</option>
        </select>
      </div>

      <div class="control-row">
        <label for="color-select">Color scheme</label>
        <select id="color-select">
          <option value="golden">Golden</option>
          <option value="sunset">Sunset</option>
          <option value="sunrise">Sunrise</option>
          <option value="cool">Cool</option>
          <option value="neon">Neon</option>
          <option value="fire">Fire</option>
          <option value="ice">Ice</option>
          <option value="aurora">Aurora</option>
        </select>
      </div>

      <div class="control-row">
        <label for="ray-count">Ray count: <span id="ray-count-val">32</span></label>
        <input type="range" id="ray-count" min="8" max="72" value="32">
      </div>

      <div class="control-row">
        <label for="ray-speed">Burst speed: <span id="ray-speed-val">5</span></label>
        <input type="range" id="ray-speed" min="1" max="10" value="5">
      </div>

      <div class="control-row">
        <label for="ray-length">Ray length: <span id="ray-length-val">220</span></label>
        <input type="range" id="ray-length" min="80" max="400" value="220">
      </div>

      <div class="control-row">
        <label for="glow-intensity">Glow intensity: <span id="glow-intensity-val">15</span></label>
        <input type="range" id="glow-intensity" min="0" max="40" value="15">
      </div>

      <button id="burst-btn" class="burst-btn">Burst</button>

      <p class="kbd-hint">
        <kbd>Space</kbd> burst &middot; <kbd>P</kbd> toggle pulse
      </p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
