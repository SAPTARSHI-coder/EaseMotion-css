<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-hot-air-balloon-lift demo</title>
</head>
<body>
<div class="hb-card">
  <div class="hb-head">
    <span class="hb-fest">SKYFEST</span>
    <span class="hb-badge">ASCEND</span>
  </div>
  <div class="hb-scene">
    <div class="hb-balloon">
      <div class="hb-envelope">
        <div class="hb-gore hb-g1"></div>
        <div class="hb-gore hb-g2"></div>
      </div>
      <div class="hb-burner">
        <div class="hb-flame"></div>
      </div>
      <div class="hb-basket"></div>
    </div>
    <div class="hb-rope hb-rope-left"></div>
    <div class="hb-rope hb-rope-right"></div>
    <div class="hb-meadow"></div>
  </div>
  <div class="hb-alt">ALT 2,400 FT</div>
</div>
</body>
</html>
