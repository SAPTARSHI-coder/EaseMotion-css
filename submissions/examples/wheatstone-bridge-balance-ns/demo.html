<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wheatstone Bridge Balance — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Wheatstone Bridge Balance demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Wheatstone Bridge Balance</h1>
      <p class="lede">Wheatstone bridge needle centering at null balance</p>
    </header>

    <section class="ease-wheatstone-bridge-balance" data-demo="wheatstone-bridge-balance" aria-live="polite">
      <div class="ease-wheatstone-bridge-balance__housing">
        <div class="ease-wheatstone-bridge-balance__bezel">
          <div class="ease-wheatstone-bridge-balance__face">
            <div class="ease-wheatstone-bridge-balance__readout">
              <span class="ease-wheatstone-bridge-balance__label">Wheatstone Bridge Balance</span>
              <span class="ease-wheatstone-bridge-balance__value">LIVE</span>
            </div>
            <div class="ease-wheatstone-bridge-balance__motion" aria-hidden="true">
              <span class="ease-wheatstone-bridge-balance__a"></span>
              <span class="ease-wheatstone-bridge-balance__b"></span>
              <span class="ease-wheatstone-bridge-balance__c"></span>
              <span class="ease-wheatstone-bridge-balance__d"></span>
            </div>
            <div class="ease-wheatstone-bridge-balance__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-wheatstone-bridge-balance__controls">
          <button type="button" class="ease-wheatstone-bridge-balance__btn primary">Engage</button>
          <button type="button" class="ease-wheatstone-bridge-balance__btn">Reset</button>
          <label class="ease-wheatstone-bridge-balance__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-wheatstone-bridge-balance__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
