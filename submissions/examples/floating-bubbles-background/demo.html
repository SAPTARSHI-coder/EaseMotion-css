<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Floating Bubbles Background</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bubbles-wrap">
    <div class="bubble" style="--size: 40px; --left: 10%; --delay: 0s;"></div>
    <div class="bubble" style="--size: 60px; --left: 30%; --delay: 2s;"></div>
    <div class="bubble" style="--size: 30px; --left: 60%; --delay: 1s;"></div>
    <div class="bubble" style="--size: 50px; --left: 80%; --delay: 3s;"></div>
  </div>
</body>
</html>
