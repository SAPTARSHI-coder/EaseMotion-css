<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Button Loading States - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <h1>Button Loading State (<code>ease-btn-loading</code>)</h1>
    <p>Pure-CSS animated spinner with automatic disabled interaction styling.</p>
    <div class="btn-grid">
      <button class="btn primary ease-btn-loading">Saving Data...</button>
      <button class="btn success ease-btn-loading">Deploying...</button>
      <button class="btn accent ease-btn-loading">Generating...</button>
    </div>
  </main>
</body>
</html>
