<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glowing Neon Outline Input Field</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="cyber-grid"></div>

<section class="demo-container">

    <div class="glass-card">

        <span class="chip">Cyberpunk Theme</span>

        <h1>Neon Login</h1>

        <p>
            Futuristic glowing input field with animated floating labels.
        </p>

        <form>

            <div class="input-group">

                <input
                    type="text"
                    id="username"
                    placeholder=" "
                    required
                >

                <label for="username">
                    Username
                </label>

                <span class="line"></span>

            </div>

            <div class="input-group">

                <input
                    type="email"
                    id="email"
                    placeholder=" "
                    required
                >

                <label for="email">
                    Email Address
                </label>

                <span class="line"></span>

            </div>

            <div class="input-group">

                <input
                    type="password"
                    id="password"
                    placeholder=" "
                    required
                >

                <label for="password">
                    Password
                </label>

                <span class="line"></span>

            </div>

            <button type="submit" class="neon-btn">

                Login

            </button>

        </form>

        <div class="footer-links">

            <a href="#">Forgot Password?</a>

            <a href="#">Create Account</a>

        </div>

    </div>

</section>

</body>
</html>
