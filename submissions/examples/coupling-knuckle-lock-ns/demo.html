<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coupling Knuckle Lock — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Coupling Knuckle Lock demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Coupling Knuckle Lock</h1>
      <p class="lede">Knuckle coupler closing on the pin</p>
    </header>

    <section class="ease-coupling-knuckle-lock" data-demo="coupling-knuckle-lock" aria-live="polite">
      <div class="ease-coupling-knuckle-lock__housing">
        <div class="ease-coupling-knuckle-lock__bezel">
          <div class="ease-coupling-knuckle-lock__face">
            <div class="ease-coupling-knuckle-lock__readout">
              <span class="ease-coupling-knuckle-lock__label">Coupling Knuckle Lock</span>
              <span class="ease-coupling-knuckle-lock__value">LIVE</span>
            </div>
            <div class="ease-coupling-knuckle-lock__motion" aria-hidden="true">
              <span class="ease-coupling-knuckle-lock__a"></span>
              <span class="ease-coupling-knuckle-lock__b"></span>
              <span class="ease-coupling-knuckle-lock__c"></span>
              <span class="ease-coupling-knuckle-lock__d"></span>
            </div>
            <div class="ease-coupling-knuckle-lock__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-coupling-knuckle-lock__controls">
          <button type="button" class="ease-coupling-knuckle-lock__btn primary">Lock</button>
          <button type="button" class="ease-coupling-knuckle-lock__btn">Pull</button>
          <label class="ease-coupling-knuckle-lock__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-coupling-knuckle-lock__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
