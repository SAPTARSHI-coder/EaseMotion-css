<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ease-hover-spotlight-grid-sap demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f4f4f5;
    }
  </style>
</head>
<body>

  <div class="spotlight-grid-sap" id="grid">
    <div class="grid-cell"><h4>Fast</h4><p>Optimized performance</p></div>
    <div class="grid-cell"><h4>Secure</h4><p>End-to-end encrypted</p></div>
    <div class="grid-cell"><h4>Scalable</h4><p>Grows with your needs</p></div>
    <div class="grid-cell"><h4>Reliable</h4><p>99.9% uptime SLA</p></div>
    <div class="grid-cell"><h4>Flexible</h4><p>Customizable workflows</p></div>
    <div class="grid-cell"><h4>Support</h4><p>24/7 live assistance</p></div>
  </div>

  <script>
    document.querySelectorAll('.grid-cell').forEach(cell => {
      cell.addEventListener('mousemove', (e) => {
        const rect = cell.getBoundingClientRect();
        cell.style.setProperty('--mx', (e.clientX - rect.left) + 'px');
        cell.style.setProperty('--my', (e.clientY - rect.top) + 'px');
      });
    });
  </script>

</body>
</html>
