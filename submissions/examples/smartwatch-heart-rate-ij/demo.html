<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-smartwatch-heart-rate demo</title>
</head>
<body>
<div class="shr-watch">
  <span class="shr-strap shr-top"></span>
  <div class="shr-face">
    <span class="shr-time">10:12</span>
    <div class="shr-read">
      <b class="shr-heart">♥</b>
      <span class="shr-rate">92 BPM</span>
    </div>
    <div class="shr-graph">
      <i class="shr-dot"></i>
      <i class="shr-dot"></i>
      <i class="shr-dot"></i>
      <i class="shr-dot"></i>
      <i class="shr-dot"></i>
      <i class="shr-dot"></i>
      <i class="shr-dot"></i>
      <i class="shr-dot"></i>
      <i class="shr-dot"></i>
      <i class="shr-dot"></i>
    </div>
  </div>
  <span class="shr-strap shr-bottom"></span>
</div>
</body>
</html>
