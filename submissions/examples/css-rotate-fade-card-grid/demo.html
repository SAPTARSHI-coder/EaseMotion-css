<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Rotate-Fade Card Grid - EaseMotion CSS</title>
  <!-- Import EaseMotion CSS -->
  <link rel="stylesheet" href="../../../easemotion.css">
  <!-- Component Specific Styles -->
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="ecommerce-bg">

  <div class="demo-container">
    
    <div class="checkout-panel ease-glass-card">
      <div class="checkout-header">
        <h2 class="ease-text-2xl">Select Payment Method</h2>
        <p class="ease-text-sm ease-color-muted">Choose your preferred way to pay securely.</p>
      </div>

      <!-- Rotate-Fade Card Grid (Pure CSS Radio Group) -->
      <div class="card-grid rotate-fade-grid">
        
        <!-- Card 1 -->
        <label class="grid-card-label" tabindex="0">
          <input type="radio" name="payment_method" class="card-radio" value="credit" checked>
          <div class="card-content">
            <div class="card-icon">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect><line x1="1" y1="10" x2="23" y2="10"></line></svg>
            </div>
            <div class="card-text">
              <h3 class="card-title">Credit Card</h3>
              <p class="card-desc">Visa, Mastercard, Amex</p>
            </div>
            <div class="card-indicator">
              <div class="indicator-ring"></div>
            </div>
          </div>
        </label>

        <!-- Card 2 -->
        <label class="grid-card-label" tabindex="0">
          <input type="radio" name="payment_method" class="card-radio" value="paypal">
          <div class="card-content">
            <div class="card-icon">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.144 21.154l3.111-19.646h9.123c3.084 0 5.483 1.259 5.483 4.887 0 4.148-2.613 7.82-7.551 7.82h-3.693l-1.396 8.814h-5.077z"></path></svg>
            </div>
            <div class="card-text">
              <h3 class="card-title">PayPal</h3>
              <p class="card-desc">Fast and secure checkout</p>
            </div>
            <div class="card-indicator">
              <div class="indicator-ring"></div>
            </div>
          </div>
        </label>

        <!-- Card 3 -->
        <label class="grid-card-label" tabindex="0">
          <input type="radio" name="payment_method" class="card-radio" value="applepay">
          <div class="card-content">
            <div class="card-icon">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20.94c1.5 0 2.75 1.06 4 1.06 3 0 6-8 6-12.22A4.91 4.91 0 0 0 17 5c-2.22 0-4 1.44-5 2-1-.56-2.78-2-5-2a4.9 4.9 0 0 0-5 4.78C2 14 5 22 8 22c1.25 0 2.5-1.06 4-1.06Z"></path><path d="M10 2c1 .5 2 2 2 5"></path></svg>
            </div>
            <div class="card-text">
              <h3 class="card-title">Apple Pay</h3>
              <p class="card-desc">Pay directly via device</p>
            </div>
            <div class="card-indicator">
              <div class="indicator-ring"></div>
            </div>
          </div>
        </label>

        <!-- Card 4 -->
        <label class="grid-card-label" tabindex="0">
          <input type="radio" name="payment_method" class="card-radio" value="crypto">
          <div class="card-content">
            <div class="card-icon">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M14.5 9a3.5 3.5 0 0 0-5 0v6a3.5 3.5 0 0 0 5 0"></path><line x1="12" y1="7" x2="12" y2="17"></line></svg>
            </div>
            <div class="card-text">
              <h3 class="card-title">Crypto</h3>
              <p class="card-desc">Bitcoin, Ethereum, USDC</p>
            </div>
            <div class="card-indicator">
              <div class="indicator-ring"></div>
            </div>
          </div>
        </label>

      </div>

      <div class="checkout-footer">
        <button class="continue-btn ease-squish-button">Continue to Summary</button>
      </div>
    </div>

  </div>

</body>
</html>
