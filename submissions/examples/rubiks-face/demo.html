<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rubik's Face &mdash; EaseMotion CSS Demo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="page-head">
    <p class="kicker">EaseMotion CSS &middot; Games &amp; Play</p>
    <h1>Rubik's Face</h1>
    <p class="sub">A puzzle face that tilts and slides its tiles the moment you look at it.</p>
  </header>
  <main class="stage">
    <div class="rf-face">
      <div class="rf-cell rf-c1"></div>
      <div class="rf-cell rf-c2"></div>
      <div class="rf-cell rf-c3"></div>
      <div class="rf-cell rf-c4"></div>
      <div class="rf-cell rf-c5"></div>
      <div class="rf-cell rf-c6"></div>
      <div class="rf-cell rf-c7"></div>
      <div class="rf-cell rf-c8"></div>
      <div class="rf-cell rf-c9"></div>
    </div>
  </main>
  <p class="stage-caption">Hover the face to tilt it and fan the outer tiles apart.</p>
  <footer class="page-foot">
    <span>Pure CSS &middot; zero dependencies</span>
    <span>3D tilt + tile slide</span>
  </footer>
</body>
</html>
