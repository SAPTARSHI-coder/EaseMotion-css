<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Circuit Breaker Probe</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="breaker-shell" aria-labelledby="breaker-title">
    <section class="breaker-panel">
      <p class="eyebrow">Resilience pattern</p>
      <h1 id="breaker-title">Circuit Breaker Probe</h1>
      <p class="summary">Probe pulses move through a half-open path while the breaker trips, cools down, and restores controlled traffic.</p>
      <div class="breaker-stage" role="img" aria-label="Animated circuit breaker probe visualization">
        <div class="traffic-rails"><span></span><span></span><span></span></div>
        <div class="breaker-switch"><i></i><strong>half-open</strong></div>
        <div class="probe-core"><b></b><b></b><em>probe</em></div>
        <div class="failure-arc"><span></span><span></span><small>trip</small></div>
      </div>
      <div class="metrics"><span>closed 81%</span><span>probe 12%</span><span>open 7%</span></div>
    </section>
  </main>
</body>
</html>
