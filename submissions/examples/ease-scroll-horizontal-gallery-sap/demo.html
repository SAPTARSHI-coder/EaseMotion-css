<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scroll Horizontal Gallery</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <h1>Scroll Horizontal Gallery</h1>

    <div class="gallery" tabindex="0" aria-label="Image gallery, scroll horizontally">
      <div class="gallery-track">
        <figure class="gallery-item"><div class="ph" style="background:#6366f1;">1</div></figure>
        <figure class="gallery-item"><div class="ph" style="background:#8b5cf6;">2</div></figure>
        <figure class="gallery-item"><div class="ph" style="background:#ec4899;">3</div></figure>
        <figure class="gallery-item"><div class="ph" style="background:#f59e0b;">4</div></figure>
        <figure class="gallery-item"><div class="ph" style="background:#10b981;">5</div></figure>
        <figure class="gallery-item"><div class="ph" style="background:#0ea5e9;">6</div></figure>
      </div>
    </div>

    <div class="nav-buttons">
      <button id="prevBtn" aria-label="Scroll left">←</button>
      <button id="nextBtn" aria-label="Scroll right">→</button>
    </div>
  </main>

  <script>
    const gallery = document.querySelector('.gallery');
    const step = 260;
    document.getElementById('prevBtn').addEventListener('click', () => {
      gallery.scrollBy({ left: -step, behavior: 'smooth' });
    });
    document.getElementById('nextBtn').addEventListener('click', () => {
      gallery.scrollBy({ left: step, behavior: 'smooth' });
    });
    gallery.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') gallery.scrollBy({ left: step, behavior: 'smooth' });
      if (e.key === 'ArrowLeft') gallery.scrollBy({ left: -step, behavior: 'smooth' });
    });
  </script>
</body>
</html>
