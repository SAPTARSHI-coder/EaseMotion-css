<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Card | Minimalist Styling</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Dynamic Minimalist Card Showcase -->
<article class="minimalist-card">
    <div class="card-accent" aria-hidden="true"></div>
    
    <span class="card-tag">Architecture</span>
    
    <h2 class="card-title">The Beauty of Negative Space</h2>
    
    <p class="card-description">
        Explore how modern design paradigms utilize whitespace not as emptiness, but as an active element that defines structure, enhances readability, and directs user focus gracefully.
    </p>
    
    <a href="#" class="card-action" aria-label="Read more about negative space">
        <span>Read Insight</span>
        <svg class="action-icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
    </a>
</article>

</body>
</html>
