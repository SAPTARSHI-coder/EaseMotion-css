<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Enhanced Skeleton Screen Demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      padding: 40px;
      background-color: #f8fafc;
    }
    
    .ease-card {
      padding: 24px;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      background: white;
      display: flex;
      gap: 16px;
      max-width: 400px;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05);
      margin-bottom: 24px;
    }
    
    .ease-card-content {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    
    .demo-grid {
      display: grid;
      gap: 20px;
    }
  </style>
</head>
<body>

  <h1>Enhanced Skeleton Utilities</h1>
  
  <div class="demo-grid">
    <!-- Medium Avatar Example -->
    <div class="ease-card ease-skeleton-card"> 
      <div class="ease-skeleton-avatar ease-skeleton-avatar-md ease-skeleton-shimmer"></div> 
      <div class="ease-card-content">
        <div class="ease-skeleton-text w-75 ease-skeleton-shimmer"></div> 
        <div class="ease-skeleton-text w-50 ease-skeleton-shimmer"></div> 
      </div>
    </div>
    
    <!-- Large Avatar Example -->
    <div class="ease-card ease-skeleton-card"> 
      <div class="ease-skeleton-avatar ease-skeleton-avatar-lg ease-skeleton-shimmer"></div> 
      <div class="ease-card-content">
        <div class="ease-skeleton-text w-100 ease-skeleton-shimmer"></div> 
        <div class="ease-skeleton-text w-100 ease-skeleton-shimmer"></div> 
        <div class="ease-skeleton-text w-75 ease-skeleton-shimmer"></div> 
      </div>
    </div>
    
    <!-- Small Avatar Example -->
    <div class="ease-card ease-skeleton-card"> 
      <div class="ease-skeleton-avatar ease-skeleton-avatar-sm ease-skeleton-shimmer"></div> 
      <div class="ease-card-content">
        <div class="ease-skeleton-text w-100 ease-skeleton-shimmer"></div> 
      </div>
    </div>
  </div>

</body>
</html>
