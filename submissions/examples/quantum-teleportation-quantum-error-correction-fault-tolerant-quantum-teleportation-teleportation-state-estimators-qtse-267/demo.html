<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teleportation State Estimators QTSE - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css"></head><body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030712; color: #ffffff;">

    <div class="ease-card ease-card-glass qtse-container">
        <div class="qtse-header">
            <h2>Teleportation State Estimator</h2>
            <span class="ease-badge ease-badge-warning">Fault-Tolerant Quantum</span>
        </div>
        
        <div class="qtse-screen ease-center">
            <div class="qtse-flux flux-qtse-a"></div>
            <div class="qtse-flux flux-qtse-b"></div>
            <div class="qtse-boundary-ring"></div>
            <div class="qtse-core ease-center"></div>
        </div>

        <div class="qtse-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Quantum State Reconstruction &amp; Estimation</span>
            <button class="ease-btn ease-btn-warning ease-btn-sm ease-hover-grow">Run State Estimator</button>
        </div>
    </div></body></html>
