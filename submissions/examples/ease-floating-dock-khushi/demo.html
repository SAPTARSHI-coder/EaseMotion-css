<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EaseMotion - Floating Dock</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="demo">
        <h1>Native CSS Floating Dock</h1>
        <p>Hover over the icons to see the dock respond.</p>
    </main>

    <nav class="dock" aria-label="Application dock">

        <a href="#" class="dock-item" aria-label="Finder">
            <span class="dock-icon">⌘</span>
            <span class="dock-label">Finder</span>
        </a>

        <a href="#" class="dock-item" aria-label="Browser">
            <span class="dock-icon">🌐</span>
            <span class="dock-label">Browser</span>
        </a>

        <a href="#" class="dock-item" aria-label="Messages">
            <span class="dock-icon">💬</span>
            <span class="dock-label">Messages</span>
        </a>

        <a href="#" class="dock-item" aria-label="Music">
            <span class="dock-icon">♫</span>
            <span class="dock-label">Music</span>
        </a>

        <a href="#" class="dock-item" aria-label="Photos">
            <span class="dock-icon">🌈</span>
            <span class="dock-label">Photos</span>
        </a>

        <a href="#" class="dock-item" aria-label="Settings">
            <span class="dock-icon">⚙</span>
            <span class="dock-label">Settings</span>
        </a>

        <span class="dock-divider" aria-hidden="true"></span>

        <a href="#" class="dock-item" aria-label="Trash">
            <span class="dock-icon">🗑</span>
            <span class="dock-label">Trash</span>
        </a>

    </nav>

</body>
</html>
