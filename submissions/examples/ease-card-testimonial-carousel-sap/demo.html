<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ease-card-testimonial-carousel-sap Demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="demo-wrap">
    <div class="testimonial-carousel-sap">
      <div class="testimonial-carousel-sap__track">
        <div class="testimonial-carousel-sap__slide is-active">
          <p>"This library saved us weeks of animation work."</p>
          <span>— Dev Team Lead</span>
        </div>
        <div class="testimonial-carousel-sap__slide">
          <p>"Clean, dependency-free, and easy to theme."</p>
          <span>— Frontend Engineer</span>
        </div>
        <div class="testimonial-carousel-sap__slide">
          <p>"Exactly the polish our landing page needed."</p>
          <span>— Product Designer</span>
        </div>
      </div>
      <div class="testimonial-carousel-sap__dots"></div>
    </div>
  </div>

  <script>
    const root = document.querySelector('.testimonial-carousel-sap');
    const slides = [...root.querySelectorAll('.testimonial-carousel-sap__slide')];
    const dotsWrap = root.querySelector('.testimonial-carousel-sap__dots');
    let index = 0;

    slides.forEach((_, i) => {
      const dot = document.createElement('button');
      dot.className = 'testimonial-carousel-sap__dot' + (i === 0 ? ' is-active' : '');
      dot.addEventListener('click', () => goTo(i));
      dotsWrap.appendChild(dot);
    });
    const dots = [...dotsWrap.children];

    function goTo(i) {
      slides[index].classList.remove('is-active');
      dots[index].classList.remove('is-active');
      index = i;
      slides[index].classList.add('is-active');
      dots[index].classList.add('is-active');
    }

    setInterval(() => goTo((index + 1) % slides.length), 4000);
  </script>
</body>
</html>
