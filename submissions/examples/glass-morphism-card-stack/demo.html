<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glass Morphism Card Stack</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="card-stack">
    <div class="card" style="--i:0">
        <div class="card-content">
            <h3>Dashboard</h3>
            <p>Analytics overview</p>
        </div>
    </div>
    <div class="card" style="--i:1">
        <div class="card-content">
            <h3>Projects</h3>
            <p>Active tasks</p>
        </div>
    </div>
    <div class="card" style="--i:2">
        <div class="card-content">
            <h3>Settings</h3>
            <p>Preferences</p>
        </div>
    </div>
    <div class="card" style="--i:3">
        <div class="card-content">
            <h3>Profile</h3>
            <p>Account details</p>
        </div>
    </div>
    <div class="card" style="--i:4">
        <div class="card-content">
            <h3>Reports</h3>
            <p>Export data</p>
        </div>
    </div>
</div>

</body>
</html>
