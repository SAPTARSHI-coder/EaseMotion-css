<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CSS morphing polygon background animation">
  <title>CSS Morphing Polygon Background</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <div class="polygon-background" aria-hidden="true">
      <span class="polygon polygon-one"></span>
      <span class="polygon polygon-two"></span>
      <span class="polygon polygon-three"></span>
      <span class="polygon polygon-four"></span>
      <span class="polygon polygon-five"></span>
      <span class="polygon polygon-six"></span>
    </div>

    <section class="content">
      <p class="eyebrow">EaseMotion CSS</p>

      <h1>CSS Morphing Polygon Background</h1>

      <p class="description">
        A low-poly mesh background created entirely with CSS.
        The polygon shapes slowly morph and shift to create
        a dynamic visual effect.
      </p>

      <div class="feature-card">
        <span class="card-icon" aria-hidden="true">◆</span>

        <div>
          <h2>Pure CSS Motion</h2>
          <p>
            No JavaScript required. Built using CSS polygons,
            gradients, and keyframe animations.
          </p>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
