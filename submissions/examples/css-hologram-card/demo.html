<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Hologram Card</title>

    <link rel="stylesheet" href="style.css">
</head>


<body>

<main class="wrapper">

    <article class="holo-card" tabindex="0" aria-label="Hologram card">

        <div class="scan-line"></div>

        <div class="holo-content">

            <span class="badge">
                HOLOGRAM
            </span>

            <h1>
                Cyber Card
            </h1>

            <p>
                Futuristic holographic interference effect created using pure CSS.
            </p>

            <button>
                View Details
            </button>

        </div>


    </article>

</main>


</body>

</html>
