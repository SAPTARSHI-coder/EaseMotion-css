<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ease Action Chip</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="action-group">

    <button class="action-chip">
        <span class="action-icon">+</span>
        <span>Add Item</span>
    </button>

    <button class="action-chip">
        <span class="action-icon">↗</span>
        <span>Share</span>
    </button>

    <button class="action-chip">
        <span class="action-icon">↓</span>
        <span>Download</span>
    </button>

</div>

</body>
</html>
