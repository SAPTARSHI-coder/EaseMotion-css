<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-gas-pump-meter demo</title>
</head>
<body>
<div class="gpm-pump">
  <div class="gpm-display">
    <span class="gpm-price">12.75</span>
    <span class="gpm-gallons">3.400</span>
  </div>
  <div class="gpm-grades">
    <button class="gpm-grade">REG</button>
    <button class="gpm-grade">MID</button>
    <button class="gpm-grade">PRE</button>
  </div>
  <div class="gpm-hose">
    <i class="gpm-nozzle"></i>
  </div>
  <div class="gpm-led">READY</div>
</div>
</body>
</html>
