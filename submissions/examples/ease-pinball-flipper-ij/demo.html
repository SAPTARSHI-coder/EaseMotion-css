<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pinball Flipper Component - Ease Animation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="flipper-showcase">
    <header class="component-header">
      <h1>Pinball Flipper Control</h1>
      <p>Interactive mechanical flipper simulation with advanced easing curves.</p>
    </header>

    <!-- Main Pinball Machine Section -->
    <main class="pinball-table">
      <!-- Decorative Mechanical Dials -->
      <div class="dashboard-dials">
        <div class="dial-container">
          <span class="dial-label">Velocity</span>
          <div class="dial dial-velocity">
            <div class="dial-hand"></div>
          </div>
        </div>
        <div class="dial-container">
          <span class="dial-label">Force</span>
          <div class="dial dial-force">
            <div class="dial-hand"></div>
          </div>
        </div>
      </div>

      <!-- Playfield where the flippers live -->
      <div class="playfield">
        <div class="flipper-assembly left-assembly">
          <div class="flipper-shaft"></div>
          <div class="flipper-blade left-blade" id="leftFlipper">
            <span class="rubber-band"></span>
          </div>
        </div>

        <div class="flipper-assembly right-assembly">
          <div class="flipper-blade right-blade" id="rightFlipper">
            <span class="rubber-band"></span>
          </div>
          <div class="flipper-shaft"></div>
        </div>
      </div>

      <!-- Semantic Interactive Controls -->
      <footer class="control-panel">
        <div class="control-group">
          <label class="btn-label" for="btnLeft">Left Trigger (A)</label>
          <button id="btnLeft" class="flipper-btn active-state-target">FLIP L</button>
        </div>
        
        <div class="control-group">
          <label class="btn-label" for="btnRight">Right Trigger (D)</label>
          <button id="btnRight" class="flipper-btn active-state-target">FLIP R</button>
        </div>
      </footer>
    </main>
  </div>

  <script>
    const leftFlipper = document.getElementById('leftFlipper');
    const rightFlipper = document.getElementById('rightFlipper');
    const btnLeft = document.getElementById('btnLeft');
    const btnRight = document.getElementById('btnRight');

    // Trigger states via JS classes to cleanly tie into custom CSS easing timelines
    function activateLeft() {
      leftFlipper.classList.add('is-flipped');
      btnLeft.classList.add('is-pressed');
    }
    function deactivateLeft() {
      leftFlipper.classList.remove('is-flipped');
      btnLeft.classList.remove('is-pressed');
    }
    function activateRight() {
      rightFlipper.classList.add('is-flipped');
      btnRight.classList.add('is-pressed');
    }
    function deactivateRight() {
      rightFlipper.classList.remove('is-flipped');
      btnRight.classList.remove('is-pressed');
    }

    // Click/Touch Listeners
    btnLeft.addEventListener('mousedown', activateLeft);
    btnLeft.addEventListener('mouseup', deactivateLeft);
    btnLeft.addEventListener('mouseleave', deactivateLeft);
    btnLeft.addEventListener('touchstart', (e) => { e.preventDefault(); activateLeft(); });
    btnLeft.addEventListener('touchend', deactivateLeft);

    btnRight.addEventListener('mousedown', activateRight);
    btnRight.addEventListener('mouseup', deactivateRight);
    btnRight.addEventListener('mouseleave', deactivateRight);
    btnRight.addEventListener('touchstart', (e) => { e.preventDefault(); activateRight(); });
    btnRight.addEventListener('touchend', deactivateRight);

    // Keyboard Listeners (A / D or Left / Right Arrows)
    window.addEventListener('keydown', (e) => {
      if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') activateLeft();
      if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') activateRight();
    });

    window.addEventListener('keyup', (e) => {
      if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') deactivateLeft();
      if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') deactivateRight();
    });
  </script>
</body>
</html>
