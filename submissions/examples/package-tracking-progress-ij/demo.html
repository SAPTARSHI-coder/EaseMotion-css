<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-package-tracking-progress demo</title>
</head>
<body>
<div class="ptp-card">
  <div class="ptp-head">
    <b class="ptp-id">#TRK-8812</b>
    <span class="ptp-est">Arriving Mon</span>
  </div>
  <div class="ptp-truck"><span class="ptp-box"></span></div>
  <div class="ptp-route">
    <span class="ptp-step">Picked up</span>
    <span class="ptp-step">In transit</span>
    <span class="ptp-step">Out for delivery</span>
    <span class="ptp-step">Delivered</span>
  </div>
  <div class="ptp-bar"><em class="ptp-fill"></em></div>
</div>
</body>
</html>
