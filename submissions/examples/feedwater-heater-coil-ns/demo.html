<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feedwater Heater Coil — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Feedwater Heater Coil demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Feedwater Heater Coil</h1>
      <p class="lede">Feedwater heater coil warming the injector supply</p>
    </header>

    <section class="ease-feedwater-heater-coil" data-demo="feedwater-heater-coil" aria-live="polite">
      <div class="ease-feedwater-heater-coil__housing">
        <div class="ease-feedwater-heater-coil__bezel">
          <div class="ease-feedwater-heater-coil__face">
            <div class="ease-feedwater-heater-coil__readout">
              <span class="ease-feedwater-heater-coil__label">Feedwater Heater Coil</span>
              <span class="ease-feedwater-heater-coil__value">LIVE</span>
            </div>
            <div class="ease-feedwater-heater-coil__motion" aria-hidden="true">
              <span class="ease-feedwater-heater-coil__a"></span>
              <span class="ease-feedwater-heater-coil__b"></span>
              <span class="ease-feedwater-heater-coil__c"></span>
              <span class="ease-feedwater-heater-coil__d"></span>
            </div>
            <div class="ease-feedwater-heater-coil__meters">
              <i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-feedwater-heater-coil__controls">
          <button type="button" class="ease-feedwater-heater-coil__btn primary">Heat</button>
          <button type="button" class="ease-feedwater-heater-coil__btn">Bypass</button>
          <label class="ease-feedwater-heater-coil__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-feedwater-heater-coil__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
