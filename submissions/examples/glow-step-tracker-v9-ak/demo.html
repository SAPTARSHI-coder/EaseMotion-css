<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Step Progress Tracker — EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <p class="label">Pure CSS Wizard Step Progress Tracker</p>

  <div class="ease-step-progress-v9">
    <div class="ease-step-progress-bar-v9"></div>

    <div class="ease-step-item-v9 ease-step-item-v9--completed">
      <div class="ease-step-circle-v9">✓</div>
      <span class="ease-step-label-v9">Account</span>
    </div>

    <div class="ease-step-item-v9 ease-step-item-v9--active">
      <div class="ease-step-circle-v9">2</div>
      <span class="ease-step-label-v9">Billing</span>
    </div>

    <div class="ease-step-item-v9">
      <div class="ease-step-circle-v9">3</div>
      <span class="ease-step-label-v9">Confirm</span>
    </div>
  </div>

</body>
</html>
