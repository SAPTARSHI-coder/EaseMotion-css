<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Pure CSS confetti rain animation."
  >
  <title>CSS Confetti Rain Animation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="confetti-page">
    <section class="confetti-demo" aria-labelledby="confetti-title">
      <div class="confetti-rain" aria-hidden="true">
        <span class="confetti confetti--1"></span>
        <span class="confetti confetti--2"></span>
        <span class="confetti confetti--3"></span>
        <span class="confetti confetti--4"></span>
        <span class="confetti confetti--5"></span>
        <span class="confetti confetti--6"></span>
        <span class="confetti confetti--7"></span>
        <span class="confetti confetti--8"></span>
        <span class="confetti confetti--9"></span>
        <span class="confetti confetti--10"></span>
        <span class="confetti confetti--11"></span>
        <span class="confetti confetti--12"></span>
        <span class="confetti confetti--13"></span>
        <span class="confetti confetti--14"></span>
        <span class="confetti confetti--15"></span>
        <span class="confetti confetti--16"></span>
        <span class="confetti confetti--17"></span>
        <span class="confetti confetti--18"></span>
      </div>

      <span class="eyebrow">EaseMotion CSS</span>

      <h1 id="confetti-title">Confetti Rain</h1>

      <p>
        A colorful celebration effect created entirely with HTML and CSS.
      </p>

      <div class="celebration-card">
        <span class="celebration-icon" aria-hidden="true">✦</span>
        <h2>Celebrate the Moment</h2>
        <p>
          Lightweight animated confetti falling continuously from above.
        </p>
      </div>
    </section>
  </main>
</body>
</html>
