<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fire Bellows Hearth — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Fire Bellows Hearth demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Fire Bellows Hearth</h1>
      <p class="lede">Hearth bellows feeding oxygen to dancing flames</p>
    </header>

    <section class="ease-fire-bellows-hearth" data-demo="fire-bellows-hearth" aria-live="polite">
      <div class="ease-fire-bellows-hearth__housing">
        <div class="ease-fire-bellows-hearth__bezel">
          <div class="ease-fire-bellows-hearth__face">
            <div class="ease-fire-bellows-hearth__readout">
              <span class="ease-fire-bellows-hearth__label">Fire Bellows Hearth</span>
              <span class="ease-fire-bellows-hearth__value">LIVE</span>
            </div>
            <div class="ease-fire-bellows-hearth__motion" aria-hidden="true">
              <span class="ease-fire-bellows-hearth__a"></span>
              <span class="ease-fire-bellows-hearth__b"></span>
              <span class="ease-fire-bellows-hearth__c"></span>
              <span class="ease-fire-bellows-hearth__d"></span>
            </div>
            <div class="ease-fire-bellows-hearth__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-fire-bellows-hearth__controls">
          <button type="button" class="ease-fire-bellows-hearth__btn primary">Engage</button>
          <button type="button" class="ease-fire-bellows-hearth__btn">Reset</button>
          <label class="ease-fire-bellows-hearth__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-fire-bellows-hearth__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
