<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glassmorphic User Profile Status Switcher</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="status-switcher">

        <!-- Dropdown open/close toggle -->
        <input type="checkbox" id="dropdownToggle" class="dropdown-toggle" hidden>

        <!-- Status state (drives colors via :has()) -->
        <input type="radio" name="status" id="status-online" class="status-radio" checked hidden>
        <input type="radio" name="status" id="status-busy" class="status-radio" hidden>
        <input type="radio" name="status" id="status-away" class="status-radio" hidden>
        <input type="radio" name="status" id="status-invisible" class="status-radio" hidden>

        <div class="profile-card">

            <label for="dropdownToggle" class="avatar-wrapper">
                <img
                    src="https://i.pravatar.cc/100?img=12"
                    alt="User avatar"
                    class="avatar"
                >
                <span class="status-dot"></span>
            </label>

            <div class="profile-info">
                <h3>Ava Sinclair</h3>
                <p class="current-status-label">
                    <span class="status-text status-text-online">Online</span>
                    <span class="status-text status-text-busy">Busy</span>
                    <span class="status-text status-text-away">Away</span>
                    <span class="status-text status-text-invisible">Invisible</span>
                </p>
            </div>

            <label for="dropdownToggle" class="dropdown-trigger" aria-label="Change status">
                ▾
            </label>

        </div>

        <div class="status-dropdown">

            <label class="status-option" for="status-online">
                <span class="dot dot-online"></span> Online
            </label>

            <label class="status-option" for="status-busy">
                <span class="dot dot-busy"></span> Busy
            </label>

            <label class="status-option" for="status-away">
                <span class="dot dot-away"></span> Away
            </label>

            <label class="status-option" for="status-invisible">
                <span class="dot dot-invisible"></span> Invisible
            </label>

            <input
                type="text"
                class="status-message"
                placeholder="Set a custom status message..."
            >

        </div>

    </div>

</body>
</html>
