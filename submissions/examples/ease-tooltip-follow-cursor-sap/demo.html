<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tooltip Follow Cursor</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <h1>Tooltip Follow Cursor</h1>

    <div class="hover-zone" id="hoverZone" aria-describedby="followTip">
      Move your cursor across this area
    </div>
    <span class="follow-tip" id="followTip" role="tooltip">Custom label preview</span>
  </main>

  <script>
    const zone = document.getElementById('hoverZone');
    const tip = document.getElementById('followTip');

    zone.addEventListener('mousemove', (e) => {
      const rect = zone.getBoundingClientRect();
      tip.style.left = (e.clientX - rect.left + 16) + 'px';
      tip.style.top = (e.clientY - rect.top + 16) + 'px';
    });

    zone.addEventListener('mouseenter', () => tip.classList.add('is-visible'));
    zone.addEventListener('mouseleave', () => tip.classList.remove('is-visible'));

    zone.addEventListener('focus', () => {
      tip.style.left = '50%';
      tip.style.top = '-2.2rem';
      tip.classList.add('is-visible');
    });
    zone.addEventListener('blur', () => tip.classList.remove('is-visible'));
  </script>
</body>
</html>
