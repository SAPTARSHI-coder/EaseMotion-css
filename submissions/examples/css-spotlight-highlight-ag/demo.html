<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Spotlight Highlight</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <!-- The Card -->
  <div class="spotlight-card" id="spotlight-card">
    <div class="card-content">
      <div class="card-icon">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
      </div>
      <h2 class="card-title">Dynamic Spotlight</h2>
      <p class="card-desc">Move your mouse over this card to see the spotlight and border glow effect smoothly follow your cursor.</p>
    </div>
  </div>

  <!-- Tiny JS snippet to track mouse position for the CSS variables -->
  <script>
    const card = document.getElementById('spotlight-card');
    
    card.addEventListener('mousemove', (e) => {
      const rect = card.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      
      // Update CSS variables for the exact mouse position
      card.style.setProperty('--x', `${x}px`);
      card.style.setProperty('--y', `${y}px`);
    });
  </script>
</body>
</html>
