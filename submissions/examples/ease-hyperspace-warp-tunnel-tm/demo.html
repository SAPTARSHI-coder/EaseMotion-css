<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ease-hyperspace-warp — Loader Demo</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { min-height: 100vh; background: var(--warp-bg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3rem; font-family: system-ui, sans-serif; color: #e0e0ff; padding: 2rem; overflow: hidden; }
    h1 { font-size: 1.3rem; font-weight: 400; letter-spacing: 0.05em; }
    .demo-row { display: flex; gap: 3rem; align-items: center; flex-wrap: wrap; justify-content: center; }
    .demo-card { display: flex; flex-direction: column; align-items: center; gap: 0.75rem; }
    .demo-card span { font-size: 0.8rem; color: #8888cc; }
    .warp-tunnel { width: var(--warp-tunnel-size); height: var(--warp-tunnel-size); position: relative; display: flex; align-items: center; justify-content: center; }
    .warp-ring { position: absolute; border-radius: 50%; border: 2px solid var(--warp-color-1); animation: warp-ring-expand var(--warp-tunnel-duration) var(--warp-tunnel-ease) infinite; }
    .warp-ring:nth-child(1) { animation-delay: 0s; border-color: var(--warp-color-1); }
    .warp-ring:nth-child(2) { animation-delay: 0.3s; border-color: var(--warp-color-2); }
    .warp-ring:nth-child(3) { animation-delay: 0.6s; border-color: var(--warp-color-3); }
    .warp-ring:nth-child(4) { animation-delay: 0.9s; border-color: var(--warp-color-4); }
    .warp-ring:nth-child(5) { animation-delay: 1.2s; border-color: var(--warp-color-1); }
    .warp-ring:nth-child(6) { animation-delay: 1.5s; border-color: var(--warp-color-2); }
    .warp-ring:nth-child(7) { animation-delay: 1.8s; border-color: var(--warp-color-3); }
    .warp-ring:nth-child(8) { animation-delay: 2.1s; border-color: var(--warp-color-4); }
    .warp-center { width: 20%; height: 20%; border-radius: 50%; background: radial-gradient(circle, var(--warp-color-1), var(--warp-color-2)); animation: warp-center-glow 1.5s ease-in-out infinite; box-shadow: 0 0 20px var(--warp-glow); }
    .warp-spin-slow { animation: warp-spin-slow 8s linear infinite; }
    .warp-hue { animation: warp-pulse-color 4s ease-in-out infinite; }
    .warp-glow { filter: drop-shadow(0 0 8px var(--warp-glow)); }
  </style>
</head>
<body>
  <h1>ease-hyperspace-warp Tunnel Loader</h1>
  <div class="demo-row">
    <div class="demo-card">
      <div class="warp-tunnel warp-glow">
        <div class="warp-ring"></div><div class="warp-ring"></div><div class="warp-ring"></div><div class="warp-ring"></div>
        <div class="warp-ring"></div><div class="warp-ring"></div><div class="warp-ring"></div><div class="warp-ring"></div>
        <div class="warp-center"></div>
      </div>
      <span>Expanding Rings</span>
    </div>
    <div class="demo-card">
      <div class="warp-tunnel warp-spin-slow warp-glow">
        <div class="warp-ring"></div><div class="warp-ring"></div><div class="warp-ring"></div><div class="warp-ring"></div>
        <div class="warp-ring"></div><div class="warp-ring"></div><div class="warp-ring"></div><div class="warp-ring"></div>
        <div class="warp-center"></div>
      </div>
      <span>Spin + Expand</span>
    </div>
    <div class="demo-card">
      <div class="warp-tunnel warp-hue warp-glow">
        <div class="warp-ring"></div><div class="warp-ring"></div><div class="warp-ring"></div><div class="warp-ring"></div>
        <div class="warp-ring"></div><div class="warp-ring"></div><div class="warp-ring"></div><div class="warp-ring"></div>
        <div class="warp-center"></div>
      </div>
      <span>Hue Rotation</span>
    </div>
  </div>
</body>
</html>
