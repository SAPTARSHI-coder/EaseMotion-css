<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <meta
    name="description"
    content="Quantum Energy Shield card built with pure HTML and CSS."
  >
  <title>Quantum Energy Shield Card</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="showcase">
    <article class="quantum-card">
      <div class="shield-orbit" aria-hidden="true"></div>
      <div class="shield-orbit shield-orbit--inner" aria-hidden="true"></div>

      <div class="energy-grid" aria-hidden="true"></div>

      <div class="quantum-card__content">
        <div class="quantum-card__icon" aria-hidden="true">
          <span class="core"></span>
        </div>

        <div class="quantum-card__body">
          <span class="quantum-card__eyebrow">
            QUANTUM SYSTEM
          </span>

          <h1>Energy Shield</h1>

          <p>
            Advanced protection powered by a responsive quantum
            energy field.
          </p>
        </div>

        <div class="quantum-card__status">
          <span class="status-dot"></span>
          <span>Shield Active</span>
        </div>

        <a class="quantum-card__action" href="#details">
          <span>Explore Shield</span>
          <span class="arrow" aria-hidden="true">→</span>
        </a>
      </div>

      <div class="energy-pulse pulse-one" aria-hidden="true"></div>
      <div class="energy-pulse pulse-two" aria-hidden="true"></div>
      <div class="energy-pulse pulse-three" aria-hidden="true"></div>
    </article>
  </main>

  <section id="details" class="sr-only">
    Quantum Energy Shield information.
  </section>
</body>
</html>
