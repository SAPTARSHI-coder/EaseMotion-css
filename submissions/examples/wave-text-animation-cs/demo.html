<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
        name="description"
        content="CSS-only wave text animation example for EaseMotion CSS."
    >
    <title>EaseMotion CSS — Wave Text Animation</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <a class="skip-link" href="#main-content">
        Skip to content
    </a>

    <main id="main-content">
        <section class="hero" aria-labelledby="page-title">
            <div class="hero-content">
                <p class="eyebrow">EaseMotion CSS</p>

                <h1 id="page-title">
                    <span
                        class="wave-text"
                        aria-label="Wave Text"
                    >
                        <span aria-hidden="true">
                            <span class="wave-char" style="--i: 0">W</span>
                            <span class="wave-char" style="--i: 1">a</span>
                            <span class="wave-char" style="--i: 2">v</span>
                            <span class="wave-char" style="--i: 3">e</span>
                            <span class="wave-space" aria-hidden="true"></span>
                            <span class="wave-char" style="--i: 4">T</span>
                            <span class="wave-char" style="--i: 5">e</span>
                            <span class="wave-char" style="--i: 6">x</span>
                            <span class="wave-char" style="--i: 7">t</span>
                        </span>
                    </span>
                </h1>

                <p class="description">
                    A pure CSS animation where individual characters move
                    through a smooth, continuous wave.
                </p>
            </div>

            <div class="showcase-card">
                <div class="card-header">
                    <span class="status-dot" aria-hidden="true"></span>
                    <span>Live CSS animation</span>
                </div>

                <div
                    class="wave-stage"
                    aria-label="Animated text reading EaseMotion"
                >
                    <span
                        class="wave-text wave-text--large"
                        aria-label="EaseMotion"
                    >
                        <span aria-hidden="true">
                            <span class="wave-char" style="--i: 0">E</span>
                            <span class="wave-char" style="--i: 1">a</span>
                            <span class="wave-char" style="--i: 2">s</span>
                            <span class="wave-char" style="--i: 3">e</span>
                            <span class="wave-char" style="--i: 4">M</span>
                            <span class="wave-char" style="--i: 5">o</span>
                            <span class="wave-char" style="--i: 6">t</span>
                            <span class="wave-char" style="--i: 7">i</span>
                            <span class="wave-char" style="--i: 8">o</span>
                            <span class="wave-char" style="--i: 9">n</span>
                        </span>
                    </span>
                </div>

                <div class="feature-grid">
                    <article class="feature">
                        <span class="feature-label">Animation</span>
                        <strong>CSS Keyframes</strong>
                    </article>

                    <article class="feature">
                        <span class="feature-label">Runtime</span>
                        <strong>No JavaScript</strong>
                    </article>

                    <article class="feature">
                        <span class="feature-label">Motion</span>
                        <strong>Reduced Motion</strong>
                    </article>
                </div>
            </div>
        </section>
    </main>
</body>    
</html>
