<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Union Find Decoders UFD - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css"></head><body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030712; color: #ffffff;">

    <div class="ease-card ease-card-glass ufd-container">
        <div class="ufd-header">
            <h2>Union-Find Decoders</h2>
            <span class="ease-badge ease-badge-secondary">Quantum Error Correction</span>
        </div>
        
        <div class="ufd-screen ease-center">
            <div class="ufd-flux flux-ufd-a"></div>
            <div class="ufd-flux flux-ufd-b"></div>
            <div class="ufd-boundary-ring"></div>
            <div class="ufd-core ease-center"></div>
        </div>

        <div class="ufd-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Near-Linear Time Decoding &amp; Disjoint-Set Clusters</span>
            <button class="ease-btn ease-btn-secondary ease-btn-sm ease-hover-grow">Run Union-Find</button>
        </div>
    </div></body></html>
