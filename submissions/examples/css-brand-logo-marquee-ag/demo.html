<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Brand Logo Marquee</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <!-- Using aria-label for the region -->
  <div class="marquee-container" role="region" aria-label="Partner Logos">
    <div class="marquee-track">
      
      <!-- Group 1 (Original) -->
      <a href="#" class="brand-logo" aria-label="Brand A">
        <svg viewBox="0 0 100 40"><text x="50" y="25" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="24">BRAND A</text></svg>
      </a>
      <a href="#" class="brand-logo" aria-label="Brand B">
        <svg viewBox="0 0 100 40"><text x="50" y="25" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="24">BRAND B</text></svg>
      </a>
      <a href="#" class="brand-logo" aria-label="Brand C">
        <svg viewBox="0 0 100 40"><text x="50" y="25" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="24">BRAND C</text></svg>
      </a>
      <a href="#" class="brand-logo" aria-label="Brand D">
        <svg viewBox="0 0 100 40"><text x="50" y="25" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="24">BRAND D</text></svg>
      </a>
      <a href="#" class="brand-logo" aria-label="Brand E">
        <svg viewBox="0 0 100 40"><text x="50" y="25" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="24">BRAND E</text></svg>
      </a>
      <a href="#" class="brand-logo" aria-label="Brand F">
        <svg viewBox="0 0 100 40"><text x="50" y="25" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="24">BRAND F</text></svg>
      </a>

      <!-- Group 2 (Duplicated for seamless loop) -->
      <!-- We use aria-hidden="true" and tabindex="-1" so keyboard and screen reader users don't encounter redundant links -->
      <a href="#" class="brand-logo" aria-hidden="true" tabindex="-1">
        <svg viewBox="0 0 100 40"><text x="50" y="25" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="24">BRAND A</text></svg>
      </a>
      <a href="#" class="brand-logo" aria-hidden="true" tabindex="-1">
        <svg viewBox="0 0 100 40"><text x="50" y="25" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="24">BRAND B</text></svg>
      </a>
      <a href="#" class="brand-logo" aria-hidden="true" tabindex="-1">
        <svg viewBox="0 0 100 40"><text x="50" y="25" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="24">BRAND C</text></svg>
      </a>
      <a href="#" class="brand-logo" aria-hidden="true" tabindex="-1">
        <svg viewBox="0 0 100 40"><text x="50" y="25" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="24">BRAND D</text></svg>
      </a>
      <a href="#" class="brand-logo" aria-hidden="true" tabindex="-1">
        <svg viewBox="0 0 100 40"><text x="50" y="25" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="24">BRAND E</text></svg>
      </a>
      <a href="#" class="brand-logo" aria-hidden="true" tabindex="-1">
        <svg viewBox="0 0 100 40"><text x="50" y="25" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="24">BRAND F</text></svg>
      </a>

    </div>
  </div>

</body>
</html>
