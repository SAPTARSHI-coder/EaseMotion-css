<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EaseMotion CSS - Drag Reorder</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h2>Drag & Reorder List</h2>

    <ul class="ease-drag-reorder" id="sortable">

        <li draggable="true">HTML</li>

        <li draggable="true">CSS</li>

        <li draggable="true">JavaScript</li>

        <li draggable="true">React</li>

        <li draggable="true">TypeScript</li>

    </ul>

</div>

<script>

const list=document.getElementById("sortable");

let draggedItem=null;

list.querySelectorAll("li").forEach(item=>{

    item.addEventListener("dragstart",()=>{

        draggedItem=item;

        item.classList.add("dragging");

    });

    item.addEventListener("dragend",()=>{

        item.classList.remove("dragging");

    });

    item.addEventListener("dragover",(e)=>{

        e.preventDefault();

    });

    item.addEventListener("drop",(e)=>{

        e.preventDefault();

        if(draggedItem!==item){

            const items=[...list.children];

            const draggedIndex=items.indexOf(draggedItem);

            const targetIndex=items.indexOf(item);

            if(draggedIndex<targetIndex){

                list.insertBefore(draggedItem,item.nextSibling);

            }else{

                list.insertBefore(draggedItem,item);

            }

        }

    });

});

</script>

</body>
</html>
