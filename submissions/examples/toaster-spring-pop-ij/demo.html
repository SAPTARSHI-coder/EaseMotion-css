<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-toaster-spring-pop demo</title>
</head>
<body>
<div class="ts-app">
  <span class="ts-title">TOAST</span>
  <div class="ts-toaster">
    <div class="ts-slot ts-slot-1"><span class="ts-toast ts-toast-1"></span></div>
    <div class="ts-slot ts-slot-2"><span class="ts-toast ts-toast-2"></span></div>
    <button class="ts-lever"></button>
    <span class="ts-knob"></span>
    <span class="ts-heat"></span>
  </div>
  <span class="ts-crumb ts-crumb-1"></span>
  <span class="ts-crumb ts-crumb-2"></span>
</div>
</body>
</html>
