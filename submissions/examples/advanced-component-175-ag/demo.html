<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Pure CSS Component 175</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="demo-container">
        <div class="header-text">
            <h1>Advanced Component Iteration 175</h1>
            <p>Hover over the card to reveal the 3D isometric layering effect using pure CSS.</p>
        </div>

        <!-- The 3D Isometric Context Wrapper -->
        <div class="ease-isometric-wrapper">
            
            <!-- The Main Card Anchor -->
            <div class="ease-iso-card">
                
                <!-- Bottom Shadow/Base Layer -->
                <div class="iso-layer layer-bottom"></div>
                
                <!-- Middle Glassmorphic Layer -->
                <div class="iso-layer layer-middle"></div>
                
                <!-- Top Content Layer -->
                <div class="iso-layer layer-top">
                    <div class="card-content">
                        <span class="card-icon">🚀</span>
                        <h3>Level 175</h3>
                        <p>Pure CSS 3D Depth</p>
                    </div>
                </div>

            </div>
        </div>
    </main>

</body>
</html>
