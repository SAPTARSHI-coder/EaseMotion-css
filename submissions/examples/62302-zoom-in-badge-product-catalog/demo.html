<!DOCTYPE html>
<html lang="en">

<head>

<title>Zoom-In Badge Product Catalog</title>

<link rel="stylesheet" href="style.css">

</head>

alt="Premium Product">

Premium Smart Device

Buy Now

</div>


</div>
