<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        Float-Drift Progress Bar | EaseMotion CSS
    </title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<main class="container">


    <section class="hero">


        <span class="badge">
            EaseMotion CSS
        </span>


        <h1>
            Float-Drift Progress Bar
        </h1>


        <p>
            A modern CSS-only progress component
            featuring floating drift animations,
            smooth transitions and responsive
            portfolio layouts.
        </p>


    </section>




    <section class="progress-wrapper">


        <article class="progress-card">


            <div class="progress-header">

                <h2>
                    UI Design
                </h2>

                <span>
                    85%
                </span>

            </div>


            <div class="progress-bar">


                <div class="progress-fill">

                </div>


            </div>


        </article>





        <article class="progress-card">


            <div class="progress-header">

                <h2>
                    Development
                </h2>

                <span>
                    70%
                </span>

            </div>


            <div class="progress-bar">


                <div class="progress-fill second">

                </div>


            </div>


        </article>





        <article class="progress-card">


            <div class="progress-header">

                <h2>
                    Innovation
                </h2>

                <span>
                    95%
                </span>

            </div>


            <div class="progress-bar">


                <div class="progress-fill third">

                </div>


            </div>


        </article>



    </section>


</main>


</body>

</html>
