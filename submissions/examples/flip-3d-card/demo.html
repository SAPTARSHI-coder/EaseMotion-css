<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flip 3D Card</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="demo-shell">
      <section class="demo-card" aria-labelledby="f3d-title">
        <p class="eyebrow">Card</p>
        <h1 id="f3d-title">Flip 3D card</h1>
        <p class="demo-copy">
          A photo card that flips 180 degrees to reveal details on its back
          face. Hover or focus to flip.
        </p>
        <div class="flip-3d-card" tabindex="0" aria-label="Flip card">
          <div class="flip-3d-card__inner">
            <div class="flip-3d-card__face flip-3d-card__face--front">
              <span class="flip-3d-card__emoji" aria-hidden="true">&#127873;</span>
              <p class="flip-3d-card__caption">Hover to reveal</p>
            </div>
            <div class="flip-3d-card__face flip-3d-card__face--back">
              <p class="flip-3d-card__back-title">You&#39;re invited</p>
              <p class="flip-3d-card__back-copy">
                Saturday &middot; 7pm &middot; The rooftop garden
              </p>
              <span class="flip-3d-card__badge">RSVP</span>
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
