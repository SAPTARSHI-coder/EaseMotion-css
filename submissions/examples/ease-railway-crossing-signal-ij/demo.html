<!-- EaseMotion component: railway-crossing-signal -->
<!DOCTYPE html>
<html lang="en" data-rail="cross">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ease Railway Crossing Signal</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="crossing-signal">
  <div class="x-sign">
    <span class="x-board board-a">RAILROAD</span>
    <span class="x-board board-b">CROSSING</span>
  </div>
  <div class="signal-mast">
    <span class="signal-lamp lamp-a"></span>
    <span class="signal-lamp lamp-b"></span>
  </div>
  <div class="barrier-arm">
    <span class="barrier-stripe bs-1"></span>
    <span class="barrier-stripe bs-2"></span>
    <span class="barrier-tip"></span>
  </div>
  <div class="crossing-post"></div>
</main>
</body>
</html>
