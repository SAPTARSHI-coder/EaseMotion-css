<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-parking-meter-timer demo</title>
</head>
<body>
<div class="pm-app">
  <span class="pm-title">PARKING METER</span>
  <div class="pm-head">
    <span class="pm-coin-slot"></span>
    <span class="pm-digits">
      <span class="pm-digit pm-digit-1">1</span>
      <span class="pm-digit pm-digit-2">5</span>
    </span>
    <div class="pm-dial">
      <span class="pm-tick pm-tick-1"></span>
      <span class="pm-tick pm-tick-2"></span>
      <span class="pm-tick pm-tick-3"></span>
      <span class="pm-needle"></span>
      <span class="pm-hub"></span>
    </div>
    <span class="pm-flag"></span>
    <span class="pm-inset"></span>
  </div>
  <span class="pm-post"></span>
</div>
</body>
</html>
