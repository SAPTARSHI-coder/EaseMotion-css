<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-parking-meter-timer demo</title>
</head>
<body>
<div class="pmt-meter">
  <span class="pmt-head">CITY PARKING</span>
  <div class="pmt-slot">
    <span class="pmt-coin"></span>
  </div>
  <div class="pmt-display">
    <span class="pmt-time">17</span>
    <span class="pmt-sec">:00</span>
  </div>
  <div class="pmt-flag">
    <span class="pmt-label">TIME LEFT</span>
  </div>
  <span class="pmt-zone">ZONE 4</span>
</div>
</body>
</html>
