<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liquid Wave Fluid Drop Particle Burst Button</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../easemotion.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>Liquid Particle Burst Button</h1>
      <p>Click the button to trigger liquid droplet expansion and particle bursts.</p>
    </header>

    <main class="stage">
      <button class="liquid-btn" onclick="triggerLiquid(event)">
        Click for Burst
      </button>
    </main>
  </div>

  <script>
    function triggerLiquid(e) {
      const btn = e.currentTarget;
      const ripple = document.createElement('span');
      ripple.className = 'liquid-ripple';
      
      const rect = btn.getBoundingClientRect();
      ripple.style.left = (e.clientX - rect.left) + 'px';
      ripple.style.top = (e.clientY - rect.top) + 'px';
      
      btn.appendChild(ripple);
      setTimeout(() => ripple.remove(), 600);
    }
  </script>
</body>
</html>
