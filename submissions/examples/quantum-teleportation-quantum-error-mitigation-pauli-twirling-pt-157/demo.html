<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pauli Twirling PT - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css"></head><body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030712; color: #ffffff;">

    <div class="ease-card ease-card-glass pt-container">
        <div class="pt-header">
            <h2>Pauli Twirling</h2>
            <span class="ease-badge ease-badge-secondary">Quantum Error Mitigation</span>
        </div>
        
        <div class="pt-screen ease-center">
            <div class="pt-flux flux-pt-a"></div>
            <div class="pt-flux flux-pt-b"></div>
            <div class="pt-boundary-ring"></div>
            <div class="pt-core ease-center"></div>
        </div>

        <div class="pt-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Randomized Pauli Operators &amp; Stochastification</span>
            <button class="ease-btn ease-btn-secondary ease-btn-sm ease-hover-grow">Run Pauli Twirling</button>
        </div>
    </div></body></html>
