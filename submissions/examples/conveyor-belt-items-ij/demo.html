<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-conveyor-belt-items demo</title>
</head>
<body>
<div class="cv-app">
  <span class="cv-title">FACTORY LINE</span>
  <div class="cv-frame">
    <span class="cv-roller cv-roller-1"></span>
    <span class="cv-roller cv-roller-2"></span>
    <span class="cv-roller cv-roller-3"></span>
    <span class="cv-roller cv-roller-4"></span>
    <div class="cv-belt"></div>
    <span class="cv-box cv-box-1">A</span>
    <span class="cv-box cv-box-2">B</span>
    <span class="cv-box cv-box-3">C</span>
    <span class="cv-arm"></span>
    <span class="cv-chute"></span>
  </div>
  <div class="cv-panel">
    <span class="cv-led cv-led-1"></span>
    <span class="cv-led cv-led-2"></span>
    <span class="cv-meter"></span>
  </div>
</div>
</body>
</html>
