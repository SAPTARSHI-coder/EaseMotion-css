<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Subtle Elevate CSS media visualizer built with pure HTML and Vanilla CSS."
  >
  <title>Subtle Elevate Media Visualizer</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="visualizer-page">
    <section class="media-card" aria-label="Subtle Elevate media visualizer">

      <div class="media-header">
        <div>
          <p class="eyebrow">NOW PLAYING</p>
          <h1>Midnight Motion</h1>
          <p class="artist">EaseMotion Sessions</p>
        </div>

        <span class="status" aria-label="Currently playing">
          <span class="status-dot"></span>
          LIVE
        </span>
      </div>

      <div class="visualizer" aria-hidden="true">
        <span class="bar bar-1"></span>
        <span class="bar bar-2"></span>
        <span class="bar bar-3"></span>
        <span class="bar bar-4"></span>
        <span class="bar bar-5"></span>
        <span class="bar bar-6"></span>
        <span class="bar bar-7"></span>
        <span class="bar bar-8"></span>
        <span class="bar bar-9"></span>
        <span class="bar bar-10"></span>
        <span class="bar bar-11"></span>
        <span class="bar bar-12"></span>
        <span class="bar bar-13"></span>
        <span class="bar bar-14"></span>
        <span class="bar bar-15"></span>
        <span class="bar bar-16"></span>
      </div>

      <div class="progress-area">
        <div class="progress-track" role="progressbar"
             aria-label="Playback progress"
             aria-valuemin="0"
             aria-valuemax="100"
             aria-valuenow="64">
          <span class="progress-fill"></span>
        </div>

        <div class="time-row">
          <span>02:14</span>
          <span>03:47</span>
        </div>
      </div>

      <div class="controls" aria-label="Media controls">

        <button class="control-button" type="button" aria-label="Previous track">
          <span aria-hidden="true">◀◀</span>
        </button>

        <button
          class="control-button play-button"
          type="button"
          aria-label="Play or pause"
        >
          <span aria-hidden="true">▶</span>
        </button>

        <button class="control-button" type="button" aria-label="Next track">
          <span aria-hidden="true">▶▶</span>
        </button>

      </div>

      <div class="volume">
        <span aria-hidden="true">VOL</span>
        <div class="volume-track" aria-hidden="true">
          <span class="volume-fill"></span>
        </div>
        <span>78%</span>
      </div>

    </section>
  </main>
</body>
</html>
