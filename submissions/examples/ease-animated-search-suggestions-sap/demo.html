<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ease-animated-search-suggestions-sap demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { height: 100vh; margin: 0; display: flex; align-items: flex-start; justify-content: center; padding-top: 100px; background: #f4f4f5; }
  </style>
</head>
<body>
  <div class="search-suggest-sap">
    <input type="text" id="searchInput" placeholder="Search products...">
    <div class="suggest-list" id="suggestList">
      <div class="suggest-inner">
        <div class="suggest-item">Wireless Headphones</div>
        <div class="suggest-item">Wireless Mouse</div>
        <div class="suggest-item">Wireless Charger</div>
      </div>
    </div>
  </div>
  <script>
    const input = document.getElementById('searchInput');
    const list = document.getElementById('suggestList');
    input.addEventListener('input', () => list.classList.toggle('open', input.value.length > 0));
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.search-suggest-sap')) list.classList.remove('open');
    });
  </script>
</body>
</html>
