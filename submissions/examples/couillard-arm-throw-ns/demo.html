<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Couillard Arm Throw — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Couillard Arm Throw demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Couillard Arm Throw</h1>
      <p class="lede">Couillard trebuchet arm throw release</p>
    </header>

    <section class="ease-couillard-arm-throw" data-demo="couillard-arm-throw" aria-live="polite">
      <div class="ease-couillard-arm-throw__housing">
        <div class="ease-couillard-arm-throw__bezel">
          <div class="ease-couillard-arm-throw__face">
            <div class="ease-couillard-arm-throw__readout">
              <span class="ease-couillard-arm-throw__label">Couillard Arm Throw</span>
              <span class="ease-couillard-arm-throw__value">LIVE</span>
            </div>
            <div class="ease-couillard-arm-throw__motion" aria-hidden="true">
              <span class="ease-couillard-arm-throw__a"></span>
              <span class="ease-couillard-arm-throw__b"></span>
              <span class="ease-couillard-arm-throw__c"></span>
              <span class="ease-couillard-arm-throw__d"></span>
            </div>
            <div class="ease-couillard-arm-throw__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-couillard-arm-throw__controls">
          <button type="button" class="ease-couillard-arm-throw__btn primary">Engage</button>
          <button type="button" class="ease-couillard-arm-throw__btn">Reset</button>
          <label class="ease-couillard-arm-throw__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-couillard-arm-throw__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
