<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Snowglobe Background</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="snowglobe" aria-label="Animated snowglobe scene">
    <div class="snow"></div>

    <div class="globe">
      <div class="moon"></div>

      <div class="mountain mountain-back"></div>
      <div class="mountain mountain-front"></div>

      <div class="tree tree-left">
        <span></span>
        <span></span>
        <span></span>
      </div>

      <div class="tree tree-right">
        <span></span>
        <span></span>
        <span></span>
      </div>

      <div class="snow-ground"></div>
    </div>

    <div class="globe-base">
      <span>SNOWGLOBE</span>
    </div>
  </main>

</body>
</html>
