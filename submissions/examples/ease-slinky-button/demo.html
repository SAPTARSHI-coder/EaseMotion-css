<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Slinky Button – Compresses and Expands Like a Slinky</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <h1>🌀 Slinky Button</h1>
    <p class="subtitle">Compresses and expands like a slinky</p>

    <div class="slinky-container">
      <div class="slinky-wrapper">
        <canvas id="canvas"></canvas>
        <button class="slinky-btn" id="slinkyBtn">
          <span class="btn-label">Click Me</span>
          <span class="btn-sub">✨ Slinky Effect</span>
        </button>
      </div>
      
      <!-- Overlay info -->
      <div class="info-overlay">
        <span class="slinky-status" id="slinkyStatus">🌀 Expanded</span>
        <span class="coil-count" id="coilCount">✦ 12 coils</span>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <button class="ctrl-btn compress" id="compressBtn">📦 Compress</button>
      <button class="ctrl-btn expand" id="expandBtn">📤 Expand</button>
      <button class="ctrl-btn toggle" id="toggleBtn">🔄 Toggle</button>
      <button class="ctrl-btn reset" id="resetBtn">↺ Reset</button>
    </div>

    <!-- Sliders -->
    <div class="slider-container">
      <span class="slider-label">Compression</span>
      <input type="range" id="compressionSlider" min="0" max="100" value="0" />
      <span class="slider-value" id="compressionValue">0%</span>
    </div>

    <div class="slider-container">
      <span class="slider-label">Coils</span>
      <input type="range" id="coilsSlider" min="6" max="24" value="12" step="2" />
      <span class="slider-value" id="coilsValue">12</span>
    </div>

    <div class="slider-container">
      <span class="slider-label">Speed</span>
      <input type="range" id="speedSlider" min="1" max="10" value="5" />
      <span class="slider-value" id="speedValue">5×</span>
    </div>

    <div class="slider-container">
      <span class="slider-label">Color</span>
      <input type="range" id="colorSlider" min="0" max="360" value="200" />
      <span class="slider-value" id="colorValue">200°</span>
    </div>

    <!-- Status -->
    <div class="status" id="status">🌀 Slinky button ready — click to compress!</div>

    <!-- Keyboard shortcuts -->
    <div class="shortcuts">
      <kbd>Click</kbd> Compress/Expand · <kbd>C</kbd> Compress · <kbd>E</kbd> Expand · <kbd>T</kbd> Toggle · <kbd>R</kbd> Reset
    </div>
  </div>

  <script>
    (function() {
      "use strict";

      // DOM elements
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      const slinkyBtn = document.getElementById('slinkyBtn');
      const slinkyStatus = document.getElementById('slinkyStatus');
      const coilCount = document.getElementById('coilCount');
      const compressBtn = document.getElementById('compressBtn');
      const expandBtn = document.getElementById('expandBtn');
      const toggleBtn = document.getElementById('toggleBtn');
      const resetBtn = document.getElementById('resetBtn');
      const status = document.getElementById('status');
      const compressionSlider = document.getElementById('compressionSlider');
      const compressionValue = document.getElementById('compressionValue');
      const coilsSlider = document.getElementById('coilsSlider');
      const coilsValue = document.getElementById('coilsValue');
      const speedSlider = document.getElementById('speedSlider');
      const speedValue = document.getElementById('speedValue');
      const colorSlider = document.getElementById('colorSlider');
      const colorValue = document.getElementById('colorValue');

      // State
      let compression = 0; // 0 = expanded, 100 = fully compressed
      let targetCompression = 0;
      let coilCountVal = 12;
      let hue = 200;
      let isAnimating = false;
      let animationId = null;
      let time = 0;

      // ----- Canvas setup -----
      function setupCanvas() {
        const rect = canvas.parentElement.getBoundingClientRect();
        const size = Math.min(rect.width - 40, 500);
        canvas.width = size;
        canvas.height = size;
        canvas.style.width = size + 'px';
        canvas.style.height = size + 'px';
      }

      // ----- Draw slinky -----
      function drawSlinky() {
        const w = canvas.width;
        const h = canvas.height;
        const cx = w / 2;
        const cy = h / 2;
        const maxHeight = Math.min(w, h) * 0.7;
        const minHeight = Math.min(w, h) * 0.15;
        const width = Math.min(w, h) * 0.35;
        const coils = coilCountVal;
        const compress = compression / 100;

        // Calculate current height
        const currentHeight = maxHeight - (maxHeight - minHeight) * compress;
        const coilSpacing = currentHeight / coils;

        // Clear
        ctx.clearRect(0, 0, w, h);

        // Background
        const bgGradient = ctx.createRadialGradient(cx, cy, 0, cx, cy, w * 0.7);
        bgGradient.addColorStop(0, `hsla(${hue + 30}, 40%, 12%, 0.8)`);
        bgGradient.addColorStop(0.5, `hsla(${hue + 20}, 30%, 8%, 0.6)`);
        bgGradient.addColorStop(1, '#020208');
        ctx.fillStyle = bgGradient;
        ctx.fillRect(0, 0, w, h);

        // Draw glow behind slinky
        const glowGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, width * 1.2);
        glowGrad.addColorStop(0, `hsla(${hue}, 80%, 60%, ${0.05 + compress * 0.05})`);
        glowGrad.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = glowGrad;
        ctx.beginPath();
        ctx.arc(cx, cy, width * 1.2, 0, Math.PI * 2);
        ctx.fill();

        // Draw slinky coils
        const startY = cy - currentHeight / 2;

        for (let i = 0; i <= coils; i++) {
          const t = i / coils;
          const y = startY + t * currentHeight;
          const radius = width * (0.6 + 0.4 * Math.sin(t * Math.PI * 2 + time * 0.5));
          
          // Coil wobble
          const wobble = Math.sin(t * Math.PI * 4 + time * 0.3) * 3 * (1 - compress * 0.5);
          const xOffset = wobble;

          // Coil glow
          const coilGlow = ctx.createRadialGradient(
            cx + xOffset, y, 0,
            cx + xOffset, y, radius * 1.5
          );
          const alpha = 0.1 + 0.1 * (1 - compress) * (0.5 + 0.5 * Math.sin(t * Math.PI * 2 + time * 0.5));
          coilGlow.addColorStop(0, `hsla(${hue + 20}, 100%, 80%, ${alpha})`);
          coilGlow.addColorStop(1, `hsla(${hue + 20}, 100%, 60%, 0)`);
          ctx.fillStyle = coilGlow;
          ctx.beginPath();
          ctx.arc(cx + xOffset, y, radius * 1.5, 0, Math.PI * 2);
          ctx.fill();

          // Main coil
          const grad = ctx.createRadialGradient(
            cx + xOffset - radius * 0.2, y - radius * 0.2, 0,
            cx + xOffset, y, radius
          );
          const brightness = 60 + 40 * (1 - compress) * (0.8 + 0.2 * Math.sin(t * Math.PI * 2 + time * 0.5));
          const sat = 70 + 30 * (1 - compress);
          grad.addColorStop(0, `hsla(${hue}, ${sat}%, ${brightness + 20}%, 0.9)`);
          grad.addColorStop(0.5, `hsla(${hue + 10}, ${sat}%, ${brightness}%, 0.8)`);
          grad.addColorStop(1, `hsla(${hue + 20}, ${sat - 10}%, ${brightness - 20}%, 0.6)`);

          ctx.shadowColor = `hsla(${hue}, 100%, 60%, ${0.1 * (1 - compress)})`;
          ctx.shadowBlur = 15;
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(cx + xOffset, y, radius, 0, Math.PI * 2);
          ctx.fill();
          ctx.shadowBlur = 0;

          // Coil highlight
          const highlight = ctx.createRadialGradient(
            cx + xOffset - radius * 0.3, y - radius * 0.3, 0,
            cx + xOffset - radius * 0.3, y - radius * 0.3, radius * 0.5
          );
          const highlightAlpha = 0.3 + 0.3 * (1 - compress);
          highlight.addColorStop(0, `hsla(${hue + 30}, 100%, 95%, ${highlightAlpha})`);
          highlight.addColorStop(1, `hsla(${hue + 30}, 100%, 80%, 0)`);
          ctx.fillStyle = highlight;
          ctx.beginPath();
          ctx.arc(cx + xOffset - radius * 0.3, y - radius * 0.3, radius * 0.5, 0, Math.PI * 2);
          ctx.fill();

          // Edge highlight (top and bottom of coil)
          ctx.strokeStyle = `hsla(${hue + 30}, 80%, 90%, ${0.1 * (1 - compress)})`;
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.arc(cx + xOffset, y, radius * 0.7, -0.5, 0.5);
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(cx + xOffset, y, radius * 0.7, Math.PI - 0.5, Math.PI + 0.5);
          ctx.stroke();
        }

        // Draw connecting lines between coils (for slinky effect)
        ctx.strokeStyle = `hsla(${hue + 20}, 60%, 70%, ${0.1 * (1 - compress)})`;
        ctx.lineWidth = 1;
        for (let i = 0; i < coils; i++) {
          const t1 = i / coils;
          const t2 = (i + 1) / coils;
          const y1 = startY + t1 * currentHeight;
          const y2 = startY + t2 * currentHeight;
          const r1 = width * (0.6 + 0.4 * Math.sin(t1 * Math.PI * 2 + time * 0.5));
          const r2 = width * (0.6 + 0.4 * Math.sin(t2 * Math.PI * 2 + time * 0.5));
          const w1 = Math.sin(t1 * Math.PI * 4 + time * 0.3) * 3 * (1 - compress * 0.5);
          const w2 = Math.sin(t2 * Math.PI * 4 + time * 0.3) * 3 * (1 - compress * 0.5);
          
          ctx.beginPath();
          ctx.moveTo(cx + w1 - r1 * 0.6, y1);
          ctx.quadraticCurveTo(cx + (w1 + w2) / 2, (y1 + y2) / 2 - 5, cx + w2 - r2 * 0.6, y2);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(cx + w1 + r1 * 0.6, y1);
          ctx.quadraticCurveTo(cx + (w1 + w2) / 2, (y1 + y2) / 2 + 5, cx + w2 + r2 * 0.6, y2);
          ctx.stroke();
        }

        // Update UI
        const statusText = compression < 20 ? '🌀 Expanded' : 
                          compression < 50 ? '🌀 Compressing' : 
                          compression < 80 ? '🌀 Compressed' : '📦 Fully Compressed';
        slinkyStatus.textContent = statusText;
        coilCount.textContent = `✦ ${coils} coils`;
      }

      // ----- Animation loop -----
      function animate() {
        time += 0.016;

        // Smoothly interpolate compression
        const diff = targetCompression - compression;
        if (Math.abs(diff) > 0.1) {
          const speed = parseInt(speedSlider.value) / 5;
          compression += diff * 0.08 * speed;
        } else {
          compression = targetCompression;
        }

        drawSlinky();
        animationId = requestAnimationFrame(animate);
      }

      // ----- Start animation -----
      function startAnimation() {
        if (animationId) {
          cancelAnimationFrame(animationId);
        }
        animate();
      }

      // ----- Set compression -----
      function setCompression(value, updateSlider = true) {
        const clamped = Math.max(0, Math.min(100, value));
        targetCompression = clamped;
        if (updateSlider) {
          compressionSlider.value = clamped;
          compressionValue.textContent = Math.round(clamped) + '%';
        }
        status.textContent = clamped < 20 ? '🌀 Slinky expanded' :
                            clamped < 50 ? '🌀 Slinky compressing...' :
                            clamped < 80 ? '🌀 Slinky compressed' : '📦 Slinky fully compressed!';
      }

      // ----- Compress -----
      function compress() {
        const target = Math.min(100, targetCompression + 25);
        setCompression(target);
        status.textContent = '📦 Compressing slinky...';
        slinkyStatus.textContent = '📦 Compressing';
      }

      // ----- Expand -----
      function expand() {
        const target = Math.max(0, targetCompression - 25);
        setCompression(target);
        status.textContent = '📤 Expanding slinky...';
        slinkyStatus.textContent = '📤 Expanding';
      }

      // ----- Toggle -----
      function toggleSlinky() {
        const target = targetCompression < 50 ? 100 : 0;
        setCompression(target);
        status.textContent = target === 0 ? '🌀 Expanding slinky...' : '📦 Compressing slinky...';
      }

      // ----- Reset -----
      function resetSlinky() {
        setCompression(0);
        coilCountVal = 12;
        hue = 200;
        coilsSlider.value = 12;
        coilsValue.textContent = '12';
        colorSlider.value = 200;
        colorValue.textContent = '200°';
        status.textContent = '↺ Slinky reset to expanded state';
        slinkyStatus.textContent = '🌀 Expanded';
      }

      // ----- Event Listeners -----
      // Button click on slinky
      slinkyBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        toggleSlinky();
      });

      compressBtn.addEventListener('click', compress);
      expandBtn.addEventListener('click', expand);
      toggleBtn.addEventListener('click', toggleSlinky);
      resetBtn.addEventListener('click', resetSlinky);

      compressionSlider.addEventListener('input', (e) => {
        const val = parseFloat(e.target.value);
        setCompression(val, false);
        compressionValue.textContent = Math.round(val) + '%';
      });

      coilsSlider.addEventListener('input', (e) => {
        coilCountVal = parseInt(e.target.value);
        coilsValue.textContent = coilCountVal;
        status.textContent = `🔄 Coils set to ${coilCountVal}`;
      });

      speedSlider.addEventListener('input', (e) => {
        speedValue.textContent = e.target.value + '×';
      });

      colorSlider.addEventListener('input', (e) => {
        hue = parseFloat(e.target.value);
        colorValue.textContent = Math.round(hue) + '°';
        status.textContent = `🎨 Color changed to ${Math.round(hue)}°`;
      });

      // Keyboard shortcuts
      document.addEventListener('keydown', (e) => {
        if (e.key === 'c' || e.key === 'C') {
          e.preventDefault();
          compress();
        }
        if (e.key === 'e' || e.key === 'E') {
          e.preventDefault();
          expand();
        }
        if (e.key === 't' || e.key === 'T') {
          e.preventDefault();
          toggleSlinky();
        }
        if (e.key === 'r' || e.key === 'R') {
          e.preventDefault();
          resetSlinky();
        }
        if (e.key === ' ' || e.key === 'Space') {
          e.preventDefault();
          toggleSlinky();
        }
      });

      // Click on canvas to toggle
      canvas.addEventListener('click', (e) => {
        // Don't trigger if clicking the button
        if (e.target.closest('.slinky-btn')) return;
        toggleSlinky();
      });

      // ----- Resize handler -----
      let resizeTimeout;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(() => {
          setupCanvas();
        }, 200);
      });

      // ----- Init -----
      function init() {
        setupCanvas();
        startAnimation();
        status.textContent = '🌀 Slinky button ready — click the button or press Space to toggle!';
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }

    })();
  </script>
</body>
</html>
