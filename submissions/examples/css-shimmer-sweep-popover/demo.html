<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Shimmer-Sweep Popover - E-Commerce Checkout</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="checkout-wrapper">
    <header class="checkout-header">
      <h1>Order Checkout</h1>
      <p>Review discounts and apply promo codes before placing your order.</p>
    </header>

    <div class="checkout-card">
      <div class="summary-details">
        <div class="summary-row">
          <span>Subtotal (2 Items)</span>
          <span>$180.00</span>
        </div>
        <div class="summary-row">
          <span>Shipping</span>
          <span>$10.00</span>
        </div>
        <div class="summary-row promo-applied">
          <span>Promo Code (SUMMER20)</span>
          <span class="discount">-$20.00</span>
        </div>
      </div>

      <!-- Shimmer-Sweep Trigger Element -->
      <div class="popover-wrapper">
        <input type="checkbox" id="popover-toggle" class="popover-checkbox">
        
        <label for="popover-toggle" class="shimmer-trigger" tabIndex="0">
          <span class="trigger-icon">🏷️</span>
          <span class="trigger-text">View Applicable Offers & Coupons</span>
          <span class="badge">2 Active</span>
          <span class="shimmer-sweep"></span>
        </label>

        <!-- Popover Overlay & Content -->
        <div class="popover-content" role="dialog" aria-label="Available Promo Codes">
          <div class="popover-header">
            <h3>Available Savings</h3>
            <label for="popover-toggle" class="popover-close" aria-label="Close popover">&times;</label>
          </div>
          
          <div class="coupon-list">
            <div class="coupon-item">
              <div class="coupon-info">
                <strong>SAVE2026</strong>
                <p>Extra 15% off on orders above $100</p>
              </div>
              <button type="button" class="btn-apply">Applied</button>
            </div>

            <div class="coupon-item">
              <div class="coupon-info">
                <strong>FREESHIP</strong>
                <p>Free standard express shipping</p>
              </div>
              <button type="button" class="btn-apply btn-outline">Apply</button>
            </div>
          </div>
        </div>
        
        <!-- Backdrop for closing popover on click outside -->
        <label for="popover-toggle" class="popover-backdrop"></label>
      </div>

      <div class="total-row">
        <span>Total Due</span>
        <span class="total-price">$170.00</span>
      </div>

      <button type="button" class="btn-checkout">Complete Payment</button>
    </div>
  </main>
</body>
</html>
