<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Morph-Glow Portfolio Drawer - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-stage">
    <header class="head">
      <h1>Morph-Glow Drawer (<code>#54520</code>)</h1>
      <button class="open-btn" onclick="document.getElementById('drawer-morph').classList.add('open')">☰ Open Neon Morph Drawer</button>
    </header>
    <p class="desc">Slide out the portfolio side panel to explore menu items that dynamically morph geometries and radiate neon auras upon hover.</p>
    
    <div id="drawer-morph" class="ease-drawer-holder">
      <div class="backdrop" onclick="document.getElementById('drawer-morph').classList.remove('open')"></div>
      <aside class="ease-drawer-morph">
        <div class="top-row">
          <h3>✦ Studio Navigation</h3>
          <button class="close-btn" onclick="document.getElementById('drawer-morph').classList.remove('open')">×</button>
        </div>
        <nav class="morph-menu">
          <a href="#" class="morph-link active">🏠 Overview Showcase</a>
          <a href="#" class="morph-link">🎨 WebGL Interactive</a>
          <a href="#" class="morph-link">🚀 54 Merged PR CI</a>
          <a href="#" class="morph-link">⚙️ Houdini Token Grid</a>
        </nav>
      </aside>
    </div>
  </div>
</body>
</html>
