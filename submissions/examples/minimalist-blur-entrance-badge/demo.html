<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Blur-Entrance Badge - Minimalist Tech</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="layout-container">
        
        <header class="section-header">
            <h1 class="title">Deployments</h1>
            <p class="subtitle">Recent builds are resolving status...</p>
        </header>

        <div class="deployment-list">
            
            <!-- Item 1 (Immediate) -->
            <div class="deployment-item">
                <div class="deploy-info">
                    <span class="commit-hash">#a7f932c</span>
                    <span class="deploy-message">Update authorization middleware</span>
                </div>
                <div class="badge badge-success blur-enter" style="--delay: 1;">
                    SUCCESS
                </div>
            </div>

            <!-- Item 2 (Slight Delay) -->
            <div class="deployment-item">
                <div class="deploy-info">
                    <span class="commit-hash">#88bd41e</span>
                    <span class="deploy-message">Refactor user settings schema</span>
                </div>
                <div class="badge badge-pending blur-enter" style="--delay: 3;">
                    BUILDING
                </div>
            </div>

            <!-- Item 3 (Long Delay) -->
            <div class="deployment-item">
                <div class="deploy-info">
                    <span class="commit-hash">#92cce11</span>
                    <span class="deploy-message">Hotfix: Resolve memory leak in worker</span>
                </div>
                <div class="badge badge-error blur-enter" style="--delay: 5;">
                    FAILED
                </div>
            </div>

        </div>
        
    </div>
</body>
</html>
