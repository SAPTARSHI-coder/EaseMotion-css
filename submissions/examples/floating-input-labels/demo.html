<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Floating Input Labels Demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #f1f5f9;
      font-family: system-ui, sans-serif;
    }
    .demo-container {
      background: white;
      padding: 2rem;
      border-radius: 1rem;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
      width: 100%;
      max-width: 400px;
    }
    h2 {
      margin-top: 0;
      margin-bottom: 1.5rem;
      color: #1e293b;
    }
  </style>
</head>
<body>
  <div class="demo-container">
    <h2>Login</h2>
    <div class="ease-floating-input">
      <input type="text" id="username" class="ease-input" placeholder=" " />
      <label for="username">Username</label>
    </div>
    <div class="ease-floating-input">
      <input type="password" id="password" class="ease-input" placeholder=" " />
      <label for="password">Password</label>
    </div>
  </div>
</body>
</html>
