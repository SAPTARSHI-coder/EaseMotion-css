<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ink Drop Button · Watercolor Spread</title>

    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <div class="card">
        <h2>🖌️ Ink Drop Button</h2>
        <p class="sub">ink spreads outward like watercolor</p>

        <!-- === INK DROP BUTTON === -->
        <button class="ink-btn" id="inkBtn">
            <span class="ink-content">
                <i class="fas fa-paint-brush"></i>
                <span>Ink</span>
            </span>
        </button>

        <p style="margin-top: 2rem; font-size: 0.85rem; color: #64748b;">
            Click · watch the ink spread like watercolor
        </p>
    </div>

    <!-- Embedded JavaScript -->
    <script>
        (function() {
            'use strict';

            const btn = document.getElementById('inkBtn');

            // --- Create ink drop effect ---
            function createInkDrop(x, y) {
                const colors = [
                    '#4facfe', '#00f2fe', '#43e97b', '#fa709a',
                    '#fbc2eb', '#a18cd1', '#fee140', '#f43f5e',
                    '#4facfe', '#10b981', '#7c3aed', '#ec4899'
                ];

                const numDrops = 15 + Math.floor(Math.random() * 10);

                for (let i = 0; i < numDrops; i++) {
                    const drop = document.createElement('div');
                    drop.className = 'ink-drop';

                    const size = 20 + Math.random() * 60;
                    const color = colors[Math.floor(Math.random() * colors.length)];
                    const angle = Math.random() * 2 * Math.PI;
                    const distance = 50 + Math.random() * 120;
                    const duration = 600 + Math.random() * 800;
                    const delay = Math.random() * 300;

                    const vx = Math.cos(angle) * distance;
                    const vy = Math.sin(angle) * distance;

                    drop.style.width = size + 'px';
                    drop.style.height = size + 'px';
                    drop.style.background = color;
                    drop.style.left = (x - size / 2) + 'px';
                    drop.style.top = (y - size / 2) + 'px';
                    drop.style.setProperty('--vx', vx + 'px');
                    drop.style.setProperty('--vy', vy + 'px');
                    drop.style.setProperty('--duration', duration + 'ms');
                    drop.style.setProperty('--delay', delay + 'ms');
                    drop.style.opacity = 0.3 + Math.random() * 0.4;

                    // Random shape variation
                    const shape = Math.random();
                    if (shape < 0.3) {
                        drop.style.borderRadius = '30% 70% 50% 50% / 50% 40% 60% 50%';
                    } else if (shape < 0.6) {
                        drop.style.borderRadius = '40% 60% 70% 30% / 60% 30% 70% 40%';
                    } else {
                        drop.style.borderRadius = '50% 50% 50% 50% / 50% 50% 50% 50%';
                    }

                    document.body.appendChild(drop);

                    // Animate
                    drop.animate([
                        {
                            transform: 'translate(0, 0) scale(0)',
                            opacity: 0.6
                        },
                        {
                            transform: `translate(var(--vx), var(--vy)) scale(1)`,
                            opacity: 0
                        }
                    ], {
                        duration: duration + 200,
                        delay: delay,
                        easing: 'cubic-bezier(0.34, 1.56, 0.64, 1)',
                        fill: 'forwards'
                    }).onfinish = function() {
                        drop.remove();
                    };
                }

                // Add a central splash
                const splash = document.createElement('div');
                splash.className = 'ink-splash';
                splash.style.left = (x - 30) + 'px';
                splash.style.top = (y - 30) + 'px';
                splash.style.width = '60px';
                splash.style.height = '60px';
                splash.style.background = 'radial-gradient(circle, rgba(79,172,254,0.3), transparent)';
                document.body.appendChild(splash);

                splash.animate([
                    {
                        transform: 'scale(0)',
                        opacity: 0.8
                    },
                    {
                        transform: 'scale(3)',
                        opacity: 0
                    }
                ], {
                    duration: 800,
                    easing: 'ease-out',
                    fill: 'forwards'
                }).onfinish = function() {
                    splash.remove();
                };
            }

            // --- Handle click ---
            function handleClick(e) {
                const rect = btn.getBoundingClientRect();
                const x = e.clientX || (e.touches && e.touches[0].clientX);
                const y = e.clientY || (e.touches && e.touches[0].clientY);

                // Calculate position relative to button
                const btnX = x - rect.left;
                const btnY = y - rect.top;

                // Create ink drops
                createInkDrop(e.clientX, e.clientY);

                // Button feedback
                btn.classList.add('clicked');
                setTimeout(() => {
                    btn.classList.remove('clicked');
                }, 400);

                // Pulse effect
                btn.classList.add('click-pulse');
                setTimeout(() => {
                    btn.classList.remove('click-pulse');
                }, 300);

                console.log(`🖌️ Ink drop at (${Math.round(btnX)}, ${Math.round(btnY)})`);
            }

            // --- Event Listeners ---
            btn.addEventListener('click', handleClick);

            // Touch support
            btn.addEventListener('touchstart', function(e) {
                e.preventDefault();
                const touch = e.touches[0];
                const rect = btn.getBoundingClientRect();
                const x = touch.clientX;
                const y = touch.clientY;

                // Create ink drops at touch position
                createInkDrop(x, y);

                btn.classList.add('clicked');
                setTimeout(() => {
                    btn.classList.remove('clicked');
                }, 400);

                btn.classList.add('click-pulse');
                setTimeout(() => {
                    btn.classList.remove('click-pulse');
                }, 300);
            });

            // Keyboard accessibility
            btn.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    const rect = btn.getBoundingClientRect();
                    const x = rect.left + rect.width / 2;
                    const y = rect.top + rect.height / 2;
                    createInkDrop(x, y);
                    btn.classList.add('clicked');
                    setTimeout(() => {
                        btn.classList.remove('clicked');
                    }, 400);
                    btn.classList.add('click-pulse');
                    setTimeout(() => {
                        btn.classList.remove('click-pulse');
                    }, 300);
                }
            });

            console.log('🖌️ Ink drop button initialized!');

        })();
    </script>

</body>
</html>
