<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EaseMotion - Curtain Slide Reveal Door Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>EaseMotion Core</h1>
  <p>Pattern: Curtain Slide Reveal Door (60 FPS Hardware Accelerated)</p>

  <div id="demoCard" class="demo-container ease-anim-curtain-slide-reveal-door">
    <div class="ease-curtain-content card-content">
      <h2>Exclusive Content</h2>
      <p>This content was revealed using GPU-accelerated split curtain transform animations.</p>
    </div>
  </div>

  <div class="controls">
    <button onclick="replayAnimation()">Replay Animation</button>
  </div>

  <script>
    function replayAnimation() {
      const card = document.getElementById('demoCard');
      card.classList.remove('ease-anim-curtain-slide-reveal-door');
      // Force DOM reflow to restart CSS keyframe animation
      void card.offsetWidth;
      card.classList.add('ease-anim-curtain-slide-reveal-door');
    }
  </script>

</body>
</html>
