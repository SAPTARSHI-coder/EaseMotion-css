<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Responsive split-screen CSS login page with smooth animations."
  >

  <title>Split Screen Login | EaseMotion CSS</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="login-page">

    <!-- Visual Panel -->
    <section class="visual-panel" aria-label="Welcome section">
      <div class="visual-content">
        <span class="eyebrow">WELCOME BACK</span>

        <h1>
          Build something
          <span>beautiful.</span>
        </h1>

        <p>
          A modern split-screen login experience created entirely
          with HTML and vanilla CSS.
        </p>

        <div class="visual-decoration" aria-hidden="true">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>
    </section>

    <!-- Login Panel -->
    <section class="form-panel" aria-labelledby="login-title">

      <div class="form-wrapper">

        <header class="form-header">
          <div class="brand-mark" aria-hidden="true">E</div>

          <h2 id="login-title">Welcome back</h2>

          <p>
            Sign in to continue to your account.
          </p>
        </header>

        <form class="login-form">

          <div class="form-group">
            <label for="email">Email address</label>

            <input
              id="email"
              name="email"
              type="email"
              autocomplete="email"
              placeholder="you@example.com"
              required
            >
          </div>

          <div class="form-group">
            <div class="password-label">
              <label for="password">Password</label>

              <a href="#" class="forgot-link">
                Forgot password?
              </a>
            </div>

            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              placeholder="Enter your password"
              required
            >
          </div>

          <label class="remember-me">
            <input type="checkbox" name="remember">
            <span>Remember me</span>
          </label>

          <button type="submit" class="login-button">
            <span>Sign in</span>
            <span class="button-arrow" aria-hidden="true">→</span>
          </button>

        </form>

        <div class="divider">
          <span>OR</span>
        </div>

        <p class="signup-text">
          Don't have an account?
          <a href="#">Create an account</a>
        </p>

      </div>

    </section>

  </main>
</body>
</html>
