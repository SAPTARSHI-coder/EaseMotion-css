<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Scale-Hover Tooltip - EaseMotion CSS</title>
  <!-- Import EaseMotion CSS -->
  <link rel="stylesheet" href="../../../easemotion.css">
  <!-- Component Specific Styles -->
  <link rel="stylesheet" href="style.css">
  <!-- Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="catalog-bg">

  <div class="demo-container">
    
    <!-- Product Catalog Card -->
    <div class="product-card ease-glass-card">
      <div class="product-image-container">
        <!-- Placeholder for product image -->
        <div class="product-image"></div>
        
        <!-- Image Overlay Tooltip (e.g. Quick View) -->
        <div class="tooltip-wrapper image-tooltip" tabindex="0">
          <button class="icon-btn" aria-label="More Info">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
          </button>
          
          <!-- The Tooltip Content -->
          <div class="scale-tooltip tooltip-left">
            <h4>Premium Material</h4>
            <p>Crafted from 100% sustainable organic cotton for maximum comfort.</p>
          </div>
        </div>
      </div>
      
      <div class="product-info">
        <h2 class="product-title">Minimalist Urban Backpack</h2>
        
        <div class="product-meta">
          <span class="product-price">$129.00</span>
          
          <!-- Small Tooltip for shipping info -->
          <div class="tooltip-wrapper" tabindex="0">
            <span class="shipping-badge">Free Shipping</span>
            <div class="scale-tooltip tooltip-top">
              Ships within 24 hours via Priority Mail.
              <div class="tooltip-arrow"></div>
            </div>
          </div>
        </div>
        
        <!-- Color Swatches with Tooltips -->
        <div class="color-options">
          <span class="options-label">Color:</span>
          
          <div class="swatch-group">
            <label class="tooltip-wrapper" tabindex="0">
              <input type="radio" name="color" value="charcoal" class="swatch-radio" checked>
              <span class="swatch" style="background-color: #333333;"></span>
              <div class="scale-tooltip tooltip-top">
                Charcoal Black
                <div class="tooltip-arrow"></div>
              </div>
            </label>
            
            <label class="tooltip-wrapper" tabindex="0">
              <input type="radio" name="color" value="olive" class="swatch-radio">
              <span class="swatch" style="background-color: #556b2f;"></span>
              <div class="scale-tooltip tooltip-top">
                Olive Green
                <div class="tooltip-arrow"></div>
              </div>
            </label>
            
            <label class="tooltip-wrapper" tabindex="0">
              <input type="radio" name="color" value="sand" class="swatch-radio">
              <span class="swatch" style="background-color: #d2b48c;"></span>
              <div class="scale-tooltip tooltip-top">
                Desert Sand
                <div class="tooltip-arrow"></div>
              </div>
            </label>
          </div>
        </div>
        
        <button class="add-to-cart-btn ease-squish-button">Add to Cart</button>
      </div>
    </div>
    
  </div>

</body>
</html>
