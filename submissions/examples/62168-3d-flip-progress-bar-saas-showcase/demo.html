<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EaseMotion CSS | 3D Flip Progress Bar</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<section class="progress-showcase">

  <div class="heading">
    <h1>3D Flip Progress Bars</h1>
    <p>Modern SaaS Dashboard Progress Indicators</p>
  </div>

  <div class="progress-grid">

    <div class="progress-card">
      <div class="card-top">
        <h3>Project Completion</h3>
        <span>92%</span>
      </div>

      <div class="flip-progress">
        <div class="progress-fill p92"></div>
      </div>
    </div>

    <div class="progress-card">
      <div class="card-top">
        <h3>Cloud Migration</h3>
        <span>78%</span>
      </div>

      <div class="flip-progress">
        <div class="progress-fill p78"></div>
      </div>
    </div>

    <div class="progress-card">
      <div class="card-top">
        <h3>Security Audit</h3>
        <span>64%</span>
      </div>

      <div class="flip-progress">
        <div class="progress-fill p64"></div>
      </div>
    </div>

    <div class="progress-card">
      <div class="card-top">
        <h3>AI Integration</h3>
        <span>45%</span>
      </div>

      <div class="flip-progress">
        <div class="progress-fill p45"></div>
      </div>
    </div>

    <div class="progress-card">
      <div class="card-top">
        <h3>Marketing Campaign</h3>
        <span>83%</span>
      </div>

      <div class="flip-progress">
        <div class="progress-fill p83"></div>
      </div>
    </div>

    <div class="progress-card">
      <div class="card-top">
        <h3>Customer Success</h3>
        <span>97%</span>
      </div>

      <div class="flip-progress">
        <div class="progress-fill p97"></div>
      </div>
    </div>

  </div>

</section>

</body>
</html>
