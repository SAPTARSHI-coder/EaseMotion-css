<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Flip Card - EaseMotion CSS</title>

  <link rel="stylesheet" href="style.css" />

  <!-- Optional: main EaseMotion CSS -->
  <link rel="stylesheet" href="../../easemotion.css" />
</head>
<body>
  <main class="demo-container">
    <h1>3D Flip Card</h1>
    <p class="subtitle">Hover over the card to flip it</p>

    <div class="ease-flip-card-an">
      <div class="ease-flip-inner-an">
        <!-- Front Face -->
        <div class="ease-flip-front-an">
          <div class="card-icon">🚀</div>
          <h2>Front Side</h2>
          <p>Hover to flip</p>
        </div>

        <!-- Back Face -->
        <div class="ease-flip-back-an">
          <h2>Back Side</h2>
          <p>This is the hidden content revealed on flip.</p>
          <button class="flip-btn">Learn More</button>
        </div>
      </div>
    </div>

    <p class="hint">
      Pure CSS 3D transform. No JavaScript required.
    </p>
  </main>
</body>
</html>
