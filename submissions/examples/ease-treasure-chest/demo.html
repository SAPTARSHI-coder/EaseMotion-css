<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Treasure Chest · sparkle on click</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <div class="chest-container">
      <div class="chest-wrapper" id="chestWrapper">
        <div class="chest" id="chest">
          <!-- Chest Lid -->
          <div class="chest-lid" id="chestLid">
            <div class="chest-lid-top"></div>
            <div class="chest-lid-front"></div>
            <div class="chest-lid-lock"></div>
          </div>
          <!-- Chest Body -->
          <div class="chest-body">
            <div class="chest-body-front">
              <div class="chest-body-lock"></div>
              <div class="chest-body-handle"></div>
            </div>
            <div class="chest-body-bottom"></div>
          </div>
        </div>
        <!-- Sparkle Container -->
        <div class="sparkle-container" id="sparkleContainer"></div>
        <!-- Glow Effect -->
        <div class="chest-glow" id="chestGlow"></div>
      </div>
      
      <div class="chest-status">
        <span id="chestStatus">🔒 Click to open</span>
      </div>
    </div>

    <div class="controls">
      <button class="btn btn-open" id="openBtn">🔑 Open Chest</button>
      <button class="btn btn-close" id="closeBtn">🔒 Close Chest</button>
      <button class="btn btn-reset" id="resetBtn">⟳ Reset</button>
    </div>
    <div class="footer-note">
      <span>✨ click the chest or use buttons · sparkle on open</span>
    </div>
  </div>

  <script>
    (function() {
      "use strict";

      // DOM refs
      const chest = document.getElementById('chest');
      const chestLid = document.getElementById('chestLid');
      const chestWrapper = document.getElementById('chestWrapper');
      const sparkleContainer = document.getElementById('sparkleContainer');
      const chestGlow = document.getElementById('chestGlow');
      const chestStatus = document.getElementById('chestStatus');
      const openBtn = document.getElementById('openBtn');
      const closeBtn = document.getElementById('closeBtn');
      const resetBtn = document.getElementById('resetBtn');

      let isOpen = false;

      function createSparkle(x, y) {
        const sparkle = document.createElement('div');
        sparkle.className = 'sparkle';
        
        // Random size between 4-12px
        const size = Math.random() * 8 + 4;
        sparkle.style.width = size + 'px';
        sparkle.style.height = size + 'px';
        
        // Random color from gold/yellow palette
        const colors = ['#fbbf24', '#f59e0b', '#fcd34d', '#fde68a', '#fbbf24', '#ffd700'];
        sparkle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        
        // Random position around the chest
        const angle = Math.random() * Math.PI * 2;
        const distance = Math.random() * 120 + 40;
        const xOffset = Math.cos(angle) * distance;
        const yOffset = Math.sin(angle) * distance - 40;
        
        sparkle.style.setProperty('--tx', xOffset + 'px');
        sparkle.style.setProperty('--ty', yOffset + 'px');
        
        // Random rotation
        sparkle.style.setProperty('--rot', (Math.random() * 720 - 360) + 'deg');
        
        // Random animation duration
        sparkle.style.animationDuration = (Math.random() * 0.8 + 0.6) + 's';
        sparkle.style.animationDelay = (Math.random() * 0.3) + 's';
        
        // Random shape (star or circle)
        if (Math.random() > 0.5) {
          sparkle.style.clipPath = 'polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%)';
          sparkle.style.borderRadius = '0';
        } else {
          sparkle.style.borderRadius = '50%';
        }
        
        sparkleContainer.appendChild(sparkle);
        
        // Remove sparkle after animation
        setTimeout(() => {
          sparkle.remove();
        }, 2000);
      }

      function createSparkleBurst() {
        const rect = chestWrapper.getBoundingClientRect();
        const centerX = rect.width / 2;
        const centerY = rect.height / 2;
        
        // Create 30-40 sparkles
        const count = Math.floor(Math.random() * 10) + 30;
        for (let i = 0; i < count; i++) {
          setTimeout(() => {
            createSparkle(centerX, centerY);
          }, Math.random() * 300);
        }
      }

      function openChest() {
        if (isOpen) return;
        isOpen = true;
        
        // Open lid animation
        chestLid.classList.add('open');
        chestWrapper.classList.add('open');
        
        // Show glow
        chestGlow.classList.add('active');
        
        // Create sparkle burst
        createSparkleBurst();
        
        // Update status
        chestStatus.textContent = '✨ Treasure opened! ✨';
        chestStatus.style.color = '#fbbf24';
        
        // Update chest emoji or icon
        chestStatus.textContent = '🎁 Treasure opened! ✨';
      }

      function closeChest() {
        if (!isOpen) return;
        isOpen = false;
        
        // Close lid animation
        chestLid.classList.remove('open');
        chestWrapper.classList.remove('open');
        
        // Hide glow
        chestGlow.classList.remove('active');
        
        // Update status
        chestStatus.textContent = '🔒 Chest closed';
        chestStatus.style.color = '#94a3b8';
      }

      function resetChest() {
        closeChest();
        // Remove any remaining sparkles
        sparkleContainer.innerHTML = '';
        chestStatus.textContent = '🔒 Click to open';
        chestStatus.style.color = '#94a3b8';
      }

      // Event listeners
      chest.addEventListener('click', function(e) {
        e.stopPropagation();
        if (isOpen) {
          closeChest();
        } else {
          openChest();
        }
      });

      if (openBtn) {
        openBtn.addEventListener('click', function(e) {
          e.preventDefault();
          openChest();
        });
      }

      if (closeBtn) {
        closeBtn.addEventListener('click', function(e) {
          e.preventDefault();
          closeChest();
        });
      }

      if (resetBtn) {
        resetBtn.addEventListener('click', function(e) {
          e.preventDefault();
          resetChest();
        });
      }

      // Keyboard shortcuts
      document.addEventListener('keydown', function(e) {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

        const key = e.key;
        if (key === 'o' || key === 'O') {
          e.preventDefault();
          openChest();
        } else if (key === 'c' || key === 'C') {
          e.preventDefault();
          closeChest();
        } else if (key === 'r' || key === 'R') {
          e.preventDefault();
          resetChest();
        }
      });

      // Initial state
      resetChest();
      console.log('📦 Treasure Chest ready · shortcuts: [O]pen, [C]lose, [R] Reset');
    })();
  </script>
</body>
</html>
