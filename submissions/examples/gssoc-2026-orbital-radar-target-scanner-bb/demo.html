<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orbital Radar Target Scanner | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
</head>
<body>
  <div class="radar-card">
    <div class="radar-screen">
      <div class="ring ring-1"></div>
      <div class="ring ring-2"></div>
      <div class="ring ring-3"></div>
      <div class="axis axis-x"></div>
      <div class="axis axis-y"></div>
      <div class="sweep-hand"></div>

      <div class="ping ping-1"></div>
      <div class="ping ping-2"></div>
      <div class="ping ping-3"></div>
    </div>
    <div class="radar-hud">
      <span class="hud-status">ORBITAL TARGET LOCK</span>
      <span class="hud-coords">LAT: 37.7749 | LON: -122.4194</span>
    </div>
  </div>
</body>
</html>
