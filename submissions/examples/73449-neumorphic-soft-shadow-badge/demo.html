<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>Neumorphic Soft Shadow Badge</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section class="showcase" aria-labelledby="title">
      <p class="eyebrow">CSS BADGE</p>

      <h1 id="title">Neumorphic Soft Shadow</h1>

      <p class="intro">
        Softly elevated badges with tactile shadows and smooth interactions,
        built entirely with HTML and CSS.
      </p>

      <div class="badge-panel">
        <span class="badge badge-primary">
          <span class="badge-dot"></span>
          Available
        </span>

        <span class="badge badge-success">
          <span class="badge-dot"></span>
          Verified
        </span>

        <span class="badge badge-warning">
          <span class="badge-dot"></span>
          Pending
        </span>

        <span class="badge badge-danger">
          <span class="badge-dot"></span>
          Offline
        </span>

        <span class="badge badge-neutral">
          <span class="badge-icon">✦</span>
          Featured
        </span>
      </div>

      <div class="status-card">
        <div class="status-icon" aria-hidden="true">✓</div>

        <div class="status-content">
          <strong>System Status</strong>
          <span>Everything is running smoothly.</span>
        </div>

        <span class="status-badge">
          Operational
        </span>
      </div>
    </section>
  </main>
</body>
</html>
