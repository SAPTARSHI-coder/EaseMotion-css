<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>[FEATURE] CSS Reading Time Indicator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="em-css-reading-time-indicator" id="rt"></div>
<script>addEventListener('scroll',()=>{document.getElementById('rt').style.transform='scaleX('+(scrollY/(document.body.scrollHeight-innerHeight))+')'});</script>
<main class="em-css-reading-time-indicator-demo"><h2>CSS Reading Time Indicator</h2><p>Reading progress fixed at the top.</p></main>
</body>
</html>
