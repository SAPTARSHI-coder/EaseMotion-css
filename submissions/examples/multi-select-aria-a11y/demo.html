<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accessible Multi-Select Dropdown</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <main class="demo-container">
        <h1>Filter Results</h1>
        <p>This demo illustrates an accessible multi-select dropdown using <code>role="menuitemcheckbox"</code> and <code>aria-checked</code>.</p>
        
        <div class="dropdown-wrapper">
            <!-- 
                CRITICAL ACCESSIBILITY: Dropdown Trigger 
                Uses aria-expanded and aria-haspopup to inform screen readers of the associated menu.
            -->
            <button 
                type="button" 
                id="dropdown-btn" 
                class="dropdown-btn" 
                aria-haspopup="menu" 
                aria-expanded="false" 
                aria-controls="dropdown-menu"
            >
                Categories
                <svg class="chevron-icon" aria-hidden="true" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="6 9 12 15 18 9"></polyline>
                </svg>
            </button>

            <!-- 
                CRITICAL ACCESSIBILITY: The Menu 
                Role="menu" signifies a complex interactive widget. 
            -->
            <div id="dropdown-menu" class="dropdown-menu" role="menu" aria-label="Filter by Category" hidden>
                
                <!-- 
                    CRITICAL ACCESSIBILITY: Menu Item Checkbox 
                    Use role="menuitemcheckbox" and toggle aria-checked="true/false".
                    This is vastly superior to nesting actual <input type="checkbox"> inside a menu,
                    which often causes screen reader double-announcements.
                -->
                <div 
                    class="menu-item" 
                    role="menuitemcheckbox" 
                    aria-checked="false" 
                    tabindex="0"
                >
                    <div class="checkbox-visual" aria-hidden="true">
                        <svg class="check-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                            <polyline points="20 6 9 17 4 12"></polyline>
                        </svg>
                    </div>
                    Frontend
                </div>

                <div 
                    class="menu-item" 
                    role="menuitemcheckbox" 
                    aria-checked="false" 
                    tabindex="-1"
                >
                    <div class="checkbox-visual" aria-hidden="true">
                        <svg class="check-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                            <polyline points="20 6 9 17 4 12"></polyline>
                        </svg>
                    </div>
                    Backend
                </div>

                <div 
                    class="menu-item" 
                    role="menuitemcheckbox" 
                    aria-checked="false" 
                    tabindex="-1"
                >
                    <div class="checkbox-visual" aria-hidden="true">
                        <svg class="check-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                            <polyline points="20 6 9 17 4 12"></polyline>
                        </svg>
                    </div>
                    Design
                </div>

            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const btn = document.getElementById('dropdown-btn');
            const menu = document.getElementById('dropdown-menu');
            const menuItems = Array.from(menu.querySelectorAll('[role="menuitemcheckbox"]'));

            // Toggle Dropdown
            btn.addEventListener('click', () => {
                const isExpanded = btn.getAttribute('aria-expanded') === 'true';
                if (isExpanded) {
                    closeMenu();
                } else {
                    openMenu();
                }
            });

            function openMenu() {
                btn.setAttribute('aria-expanded', 'true');
                menu.removeAttribute('hidden');
                menuItems[0].focus();
            }

            function closeMenu() {
                btn.setAttribute('aria-expanded', 'false');
                menu.setAttribute('hidden', 'true');
                btn.focus();
            }

            // Close on escape or outside click
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && btn.getAttribute('aria-expanded') === 'true') {
                    closeMenu();
                }
            });
            
            document.addEventListener('click', (e) => {
                if (!btn.contains(e.target) && !menu.contains(e.target) && btn.getAttribute('aria-expanded') === 'true') {
                    closeMenu();
                }
            });

            // Menu Item Logic (Arrow Keys & Selection)
            menuItems.forEach((item, index) => {
                
                // Click to toggle
                item.addEventListener('click', (e) => {
                    toggleItem(item);
                });

                // Keyboard interactions
                item.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        toggleItem(item);
                    }
                    
                    if (e.key === 'ArrowDown') {
                        e.preventDefault();
                        const next = menuItems[index + 1] || menuItems[0];
                        setFocus(next);
                    }
                    
                    if (e.key === 'ArrowUp') {
                        e.preventDefault();
                        const prev = menuItems[index - 1] || menuItems[menuItems.length - 1];
                        setFocus(prev);
                    }
                    
                    if (e.key === 'Tab') {
                        // Tabbing out of the menu should close it
                        closeMenu();
                    }
                });
            });

            function toggleItem(item) {
                const isChecked = item.getAttribute('aria-checked') === 'true';
                item.setAttribute('aria-checked', !isChecked ? 'true' : 'false');
            }

            function setFocus(targetItem) {
                // Roving tabindex pattern
                menuItems.forEach(i => i.setAttribute('tabindex', '-1'));
                targetItem.setAttribute('tabindex', '0');
                targetItem.focus();
            }
        });
    </script>
</body>
</html>
