<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accessible Loading Button</title>
  <link rel="stylesheet" href="style.css">
</head>
<body style="padding: 2rem; font-family: system-ui, sans-serif; background: #0f1115; color: #fff;">
  
  <h2>Accessible Loading Button Component</h2>
  <p style="color: #8b949e; margin-bottom: 2rem;">
    Demonstrating the loading button with proper ARIA attributes for screen readers.
  </p>
  
  <!-- The Fix: Added aria-busy and aria-label -->
  <button class="ease-btn ease-btn-loading" aria-busy="true" aria-label="Loading...">
    <!-- Leave empty if the framework uses a CSS spinner, or add text if needed -->
  </button>

</body>
</html>
