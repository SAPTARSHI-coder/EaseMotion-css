<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accessible Loading Button Showcase</title>
  <link rel="stylesheet" href="../../style.css">
</head>
<body>
  <main style="padding: 2rem;">
    <h2>Accessible Loading Button Component</h2>
    <p>Enhanced loading button with standard ARIA accessibility attributes.</p>
    
    <!-- Loading Button with ARIA attributes -->
    <button class="ease-btn ease-btn-loading" aria-busy="true" aria-label="Loading...">
      <span aria-hidden="true">Loading</span>
    </button>
  </main>
</body>
</html>
