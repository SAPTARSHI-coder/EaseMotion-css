<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-currency-exchange-rate demo</title>
</head>
<body>
<div class="cer-board">
  <div class="cer-hero">
    <span class="cer-pair">EUR / USD</span>
    <b class="cer-rate">1.0876</b>
    <span class="cer-delta">▲ +0.0012</span>
  </div>
  <div class="cer-list">
    <span class="cer-row">GBP / USD 1.2741</span>
    <span class="cer-row">USD / JPY 149.32</span>
    <span class="cer-row">EUR / GBP 0.8534</span>
  </div>
  <div class="cer-ticker">LIVE RATES ● UPDATED DAILY ● MARKET CLOSED SUN</div>
</div>
</body>
</html>
