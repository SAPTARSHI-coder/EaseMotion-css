<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jiggle Dialog Example - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="showcase">
    <h1>Jiggle Dialog Example (<code>#54668</code>)</h1>
    <p class="subtitle">Modal alert boxes that jiggle rapidly to signal high-priority confirmations or form error exceptions.</p>
    
    <div class="stage">
      <div class="ease-dialog-jiggle" id="modal">
        <div class="warn-icon">⚠️</div>
        <h3>Overwrite Protected Repository?</h3>
        <p>You are attempting to push 18 commit branches directly to main. Automated test checkpoints must pass before merging.</p>
        <div class="actions">
          <button class="btn-cancel" onclick="document.getElementById('modal').classList.remove('jiggle'); void document.getElementById('modal').offsetWidth; document.getElementById('modal').classList.add('jiggle');">Trigger Jiggle ⚡</button>
          <button class="btn-ok">Confirm PRs ✓</button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
