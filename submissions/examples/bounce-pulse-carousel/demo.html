<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bounce-Pulse Carousel | EaseMotion CSS</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="container">

    <h1>🎮 Bounce-Pulse Gaming Carousel</h1>
    <p class="subtitle">
        A pure CSS carousel with bouncing pulse animations.
    </p>

    <div class="carousel">

        <div class="card">
            <h2>⚔️ Warrior Zone</h2>
            <p>Enter epic battles and conquer enemies.</p>
        </div>

        <div class="card">
            <h2>🚀 Space World</h2>
            <p>Discover planets and futuristic missions.</p>
        </div>

        <div class="card">
            <h2>🏆 Champion Arena</h2>
            <p>Compete and climb the leaderboard.</p>
        </div>

    </div>

</main>

</body>
</html>
