<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Swipeable Product Gallery | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="gallery-card">
    <header class="gallery-header">
      <h1>AeroPulse Wireless Earbuds</h1>
      <p>Swipe or tap dots to explore product views</p>
    </header>

    <div class="gallery-wrapper" aria-label="Product image gallery">
      <!-- Hidden Radio Controls for Pure CSS Navigation -->
      <input type="radio" name="gallery-radio" id="slide-opt-1" checked aria-label="Slide 1: Front view">
      <input type="radio" name="gallery-radio" id="slide-opt-2" aria-label="Slide 2: Side profile">
      <input type="radio" name="gallery-radio" id="slide-opt-3" aria-label="Slide 3: Charging case">
      <input type="radio" name="gallery-radio" id="slide-opt-4" aria-label="Slide 4: Accessories">

      <!-- Swipeable Image Viewport -->
      <div class="gallery-viewport" tabindex="0" aria-label="Product images scroll container">
        <div id="img-1" class="gallery-slide slide-1">
          <svg class="slide-svg" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 18v-6a9 9 0 0 1 18 0v6"></path>
            <path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"></path>
          </svg>
          <span class="slide-caption">Matte Black Edition</span>
          <span class="slide-sub">Angle 01 — Front Profile</span>
        </div>

        <div id="img-2" class="gallery-slide slide-2">
          <svg class="slide-svg" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"></circle>
            <path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"></path>
          </svg>
          <span class="slide-caption">Ergonomic Fit</span>
          <span class="slide-sub">Angle 02 — Side Detail</span>
        </div>

        <div id="img-3" class="gallery-slide slide-3">
          <svg class="slide-svg" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="6" width="20" height="12" rx="4"></rect>
            <path d="M6 12h12"></path>
          </svg>
          <span class="slide-caption">Smart Charging Case</span>
          <span class="slide-sub">Angle 03 — 36hr Total Battery</span>
        </div>

        <div id="img-4" class="gallery-slide slide-4">
          <svg class="slide-svg" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
          </svg>
          <span class="slide-caption">Included Accessories</span>
          <span class="slide-sub">Angle 04 — Ear tips & USB-C Cable</span>
        </div>
      </div>

      <!-- Pagination Indicators Linked to Radios -->
      <nav class="gallery-dots" aria-label="Product image pagination">
        <label for="slide-opt-1" class="gallery-dot-label" title="View slide 1"></label>
        <label for="slide-opt-2" class="gallery-dot-label" title="View slide 2"></label>
        <label for="slide-opt-3" class="gallery-dot-label" title="View slide 3"></label>
        <label for="slide-opt-4" class="gallery-dot-label" title="View slide 4"></label>
      </nav>
    </div>

    <footer class="product-info">
      <div>
        <div class="product-price">$149.00</div>
      </div>
      <button type="button" class="add-to-cart-btn">Add to Cart</button>
    </footer>
  </main>
</body>
</html>
