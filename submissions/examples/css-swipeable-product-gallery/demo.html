<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Accessible CSS-only swipeable product gallery"
  >
  <title>CSS Swipeable Product Gallery</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="page">
    <section class="gallery-section" aria-labelledby="gallery-title">
      <h1 id="gallery-title">Swipeable Product Gallery</h1>

      <div class="gallery">
        <div class="gallery-track" tabindex="0" aria-label="Product images">
          <figure class="slide" id="product-1">
            <img
              src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=900&q=80"
              alt="Red athletic shoe"
            >
            <figcaption>Sport Runner</figcaption>
          </figure>

          <figure class="slide" id="product-2">
            <img
              src="https://images.unsplash.com/photo-1525966222134-fcfa99b8ae77?auto=format&fit=crop&w=900&q=80"
              alt="White casual sneaker"
            >
            <figcaption>Classic Sneaker</figcaption>
          </figure>

          <figure class="slide" id="product-3">
            <img
              src="https://images.unsplash.com/photo-1495555961986-6d4c1ecb7be3?auto=format&fit=crop&w=900&q=80"
              alt="Black running shoe"
            >
            <figcaption>Urban Runner</figcaption>
          </figure>

          <figure class="slide" id="product-4">
            <img
              src="https://images.unsplash.com/photo-1552346154-21d32810aba3?auto=format&fit=crop&w=900&q=80"
              alt="Blue athletic shoe"
            >
            <figcaption>Street Sport</figcaption>
          </figure>
        </div>

        <nav class="gallery-dots" aria-label="Product image navigation">
          <a
            href="#product-1"
            class="dot active"
            aria-label="View product image 1"
          ></a>

          <a
            href="#product-2"
            class="dot"
            aria-label="View product image 2"
          ></a>

          <a
            href="#product-3"
            class="dot"
            aria-label="View product image 3"
          ></a>

          <a
            href="#product-4"
            class="dot"
            aria-label="View product image 4"
          ></a>
        </nav>
      </div>

      <p class="hint">
        Swipe horizontally on touch devices or use the navigation dots.
      </p>
    </section>
  </main>
</body>
</html>
