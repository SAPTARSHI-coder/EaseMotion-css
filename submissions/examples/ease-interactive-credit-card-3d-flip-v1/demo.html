<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ease 3D Flip Credit Card Form</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="card-flip-body">
  <div class="c-preview" id="cPrev">
    <div class="c-side front">•••• •••• •••• 4242</div>
    <div class="c-side back">CVV: 123</div>
  </div>
  <input type="text" placeholder="CVV" onfocus="document.getElementById('cPrev').classList.add('flip')" onblur="document.getElementById('cPrev').classList.remove('flip')" class="cvv-inp" />
</body>
</html>
