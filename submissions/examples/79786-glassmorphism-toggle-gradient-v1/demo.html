<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Responsive glassmorphism toggle with gradient styling"
    >

    <title>Glassmorphism Gradient Toggle</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="page">
        <section class="toggle-card">

            <div class="glow glow-one"></div>
            <div class="glow glow-two"></div>

            <div class="content">
                <span class="eyebrow">CSS COMPONENT</span>

                <h1>Glassmorphism Toggle</h1>

                <p>
                    A modern gradient toggle with a translucent glass
                    interface and smooth interactive states.
                </p>

                <div class="toggle-wrapper">
                    <span class="state-label" id="stateLabel">
                        OFF
                    </span>

                    <label
                        class="toggle"
                        for="gradient-toggle"
                    >
                        <input
                            type="checkbox"
                            id="gradient-toggle"
                            aria-label="Toggle gradient mode"
                        >

                        <span class="slider">
                            <span class="knob"></span>
                        </span>
                    </label>
                </div>

                <p class="status" id="status">
                    Gradient mode is disabled
                </p>
            </div>

        </section>
    </main>

    <script>
        const toggle = document.getElementById("gradient-toggle");
        const stateLabel = document.getElementById("stateLabel");
        const status = document.getElementById("status");

        toggle.addEventListener("change", () => {
            const enabled = toggle.checked;

            stateLabel.textContent = enabled ? "ON" : "OFF";

            status.textContent = enabled
                ? "Gradient mode is enabled"
                : "Gradient mode is disabled";
        });
    </script>

</body>
</html>
