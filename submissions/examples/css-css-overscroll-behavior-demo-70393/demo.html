<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS overscroll-behavior Demo - EaseMotion</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="ovb" aria-label="Overscroll behavior demo">
      <p class="ovb-hint">Scroll inside the box — it contains itself.</p>
      <div class="ovb-scroll" tabindex="0" aria-label="Contained scroll area">
        <p>Item 1</p>
        <p>Item 2</p>
        <p>Item 3</p>
        <p>Item 4</p>
        <p>Item 5</p>
        <p>Item 6</p>
        <p>Item 7</p>
        <p>Item 8</p>
      </div>
      <p class="ovb-note">
        overscroll-behavior: contain prevents scroll chaining.
      </p>
    </div>
  </body>
</html>
