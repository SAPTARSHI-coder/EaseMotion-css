<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Foucault Pendulum Swing CSS media visualizer"
  >
  <title>Foucault Pendulum Swing</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="visualizer">
    <section class="media-card" aria-label="Foucault Pendulum media visualizer">

      <div class="card-header">
        <div>
          <span class="eyebrow">MEDIA VISUALIZER</span>
          <h1>Foucault Pendulum</h1>
        </div>

        <span class="status" aria-label="Playing">
          <span class="status-dot"></span>
          LIVE
        </span>
      </div>

      <div class="pendulum-stage">
        <div class="orbit orbit-one"></div>
        <div class="orbit orbit-two"></div>

        <div class="pendulum">
          <div class="thread"></div>
          <div class="bob"></div>
        </div>

        <div class="floor">
          <span></span>
        </div>
      </div>

      <div class="track">
        <div class="track-time">
          <span>01:24</span>
          <span>03:42</span>
        </div>

        <div class="progress">
          <span class="progress-value"></span>
        </div>
      </div>

      <div class="controls">
        <button class="control-button" type="button" aria-label="Previous">
          &#9664;&#9664;
        </button>

        <button
          class="play-button"
          type="button"
          aria-label="Playing"
          aria-pressed="true"
        >
          &#10074;&#10074;
        </button>

        <button class="control-button" type="button" aria-label="Next">
          &#9654;&#9654;
        </button>
      </div>

      <div class="visualizer-bars" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
      </div>

    </section>
  </main>
</body>
</html>
