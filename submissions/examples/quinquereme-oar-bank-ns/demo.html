<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quinquereme Oar Bank — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Quinquereme Oar Bank demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Quinquereme Oar Bank</h1>
      <p class="lede">Quinquereme oar bank synchronized stroke</p>
    </header>

    <section class="ease-quinquereme-oar-bank" data-demo="quinquereme-oar-bank" aria-live="polite">
      <div class="ease-quinquereme-oar-bank__housing">
        <div class="ease-quinquereme-oar-bank__bezel">
          <div class="ease-quinquereme-oar-bank__face">
            <div class="ease-quinquereme-oar-bank__readout">
              <span class="ease-quinquereme-oar-bank__label">Quinquereme Oar Bank</span>
              <span class="ease-quinquereme-oar-bank__value">LIVE</span>
            </div>
            <div class="ease-quinquereme-oar-bank__motion" aria-hidden="true">
              <span class="ease-quinquereme-oar-bank__a"></span>
              <span class="ease-quinquereme-oar-bank__b"></span>
              <span class="ease-quinquereme-oar-bank__c"></span>
              <span class="ease-quinquereme-oar-bank__d"></span>
            </div>
            <div class="ease-quinquereme-oar-bank__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-quinquereme-oar-bank__controls">
          <button type="button" class="ease-quinquereme-oar-bank__btn primary">Engage</button>
          <button type="button" class="ease-quinquereme-oar-bank__btn">Reset</button>
          <label class="ease-quinquereme-oar-bank__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-quinquereme-oar-bank__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
