<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EaseMotion — High-Conversion Responsive Checkout</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="checkout-container">
    <!-- Left Column: Checkout Forms -->
    <main class="checkout-main em-fade-in">
      
      <!-- Section 1: Billing & Shipping -->
      <section class="checkout-section em-slide-up delay-1">
        <h2 class="section-title"><span class="step-badge">1</span> Shipping &amp; Billing Details</h2>
        
        <form class="checkout-form" onsubmit="event.preventDefault();">
          <div class="form-grid">
            <div class="input-group">
              <label for="first-name">First Name</label>
              <input type="text" id="first-name" placeholder="Alex" required>
            </div>
            <div class="input-group">
              <label for="last-name">Last Name</label>
              <input type="text" id="last-name" placeholder="Morgan" required>
            </div>
          </div>

          <div class="input-group">
            <label for="address">Street Address</label>
            <input type="text" id="address" placeholder="123 Innovation Way" required>
          </div>

          <div class="form-grid triple">
            <div class="input-group">
              <label for="city">City</label>
              <input type="text" id="city" placeholder="San Francisco" required>
            </div>
            <div class="input-group">
              <label for="state">State</label>
              <input type="text" id="state" placeholder="CA" required>
            </div>
            <div class="input-group">
              <label for="zip">Zip Code</label>
              <input type="text" id="zip" placeholder="94105" required>
            </div>
          </div>
        </form>
      </section>

      <!-- Section 2: Payment Gateway Configurations -->
      <section class="checkout-section em-slide-up delay-2">
        <h2 class="section-title"><span class="step-badge">2</span> Payment Method</h2>
        
        <div class="payment-tabs">
          <label class="payment-tab em-scale-hover">
            <input type="radio" name="payment" checked>
            <div class="tab-content">
              <span class="payment-icon">💳</span>
              <span class="tab-label">Credit Card</span>
            </div>
          </label>
          <label class="payment-tab em-scale-hover">
            <input type="radio" name="payment">
            <div class="tab-content">
              <span class="payment-icon">🌐</span>
              <span class="tab-label">PayPal</span>
            </div>
          </label>
        </div>

        <div class="credit-card-fields">
          <div class="input-group">
            <label for="card-num">Card Number</label>
            <input type="text" id="card-num" placeholder="4111 2222 3333 4444" required>
          </div>
          <div class="form-grid">
            <div class="input-group">
              <label for="card-expiry">Expiry Date</label>
              <input type="text" id="card-expiry" placeholder="MM/YY" required>
            </div>
            <div class="input-group">
              <label for="card-cvc">CVC</label>
              <input type="text" id="card-cvc" placeholder="321" required>
            </div>
          </div>
        </div>
      </section>

    </main>

    <!-- Right Column: Sticky Sticky Order Summary Sidebar -->
    <aside class="checkout-sidebar em-fade-in delay-3">
      <div class="sticky-sidebar-wrapper">
        <h2 class="sidebar-title">Order Summary</h2>
        
        <!-- Cart Line Items -->
        <div class="cart-items-list">
          <div class="cart-item em-scale-hover">
            <div class="item-details">
              <span class="item-name">EaseMotion Pro License</span>
              <span class="item-tier">Developer Tier · Lifetime</span>
            </div>
            <span class="item-price">$79.00</span>
          </div>
          <div class="cart-item em-scale-hover">
            <div class="item-details">
              <span class="item-name">UI Extension Matrix Pack</span>
              <span class="item-tier">Add-on Suite</span>
            </div>
            <span class="item-price">$20.00</span>
          </div>
        </div>

        <!-- Ledger Financials -->
        <div class="pricing-ledger">
          <div class="ledger-row">
            <span>Subtotal</span>
            <span>$99.00</span>
          </div>
          <div class="ledger-row">
            <span>Shipping</span>
            <span class="text-free">FREE</span>
          </div>
          <hr class="ledger-divider">
          <div class="ledger-row total-row">
            <span>Total to Pay</span>
            <span class="final-price">$99.00</span>
          </div>
        </div>

        <!-- Submission Call to Action Button -->
        <button type="submit" class="place-order-btn em-pulse-hover">
          Place Secure Order
        </button>
        
        <p class="security-notice">🔒 Encrypted 256-bit SSL Connection Secured</p>
      </div>
    </aside>
  </div>

</body>
</html>
