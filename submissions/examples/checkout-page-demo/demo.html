<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EaseMotion — Responsive Checkout Layout Showcase</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="checkout-wrapper">
    <header class="checkout-header">
      <span class="step-indicator">Secure Checkout</span>
      <h1>Review and Complete Order</h1>
    </header>

    <div class="checkout-layout-grid">
      <main class="checkout-main-forms">
        
        <section class="checkout-card pane-delay-1">
          <h2 class="section-title"><span class="step-num">1</span> Billing Information</h2>
          <div class="form-grid">
            <div class="form-group val-half">
              <label for="first-name">First Name</label>
              <input type="text" id="first-name" class="ease-input" placeholder="Alex" required>
            </div>
            <div class="form-group val-half">
              <label for="last-name">Last Name</label>
              <input type="text" id="last-name" class="ease-input" placeholder="Morgan" required>
            </div>
            <div class="form-group val-full">
              <label for="email-addr">Email Address</label>
              <input type="email" id="email-addr" class="ease-input" placeholder="alex.m@example.com" required>
            </div>
          </div>
        </section>

        <section class="checkout-card pane-delay-2">
          <h2 class="section-title"><span class="step-num">2</span> Shipping Address</h2>
          <div class="form-grid">
            <div class="form-group val-full">
              <label for="street-address">Street Address</label>
              <input type="text" id="street-address" class="ease-input" placeholder="1042 Innovation Way, Suite 400" required>
            </div>
            <div class="form-group val-half">
              <label for="city-locality">City</label>
              <input type="text" id="city-locality" class="ease-input" placeholder="San Francisco" required>
            </div>
            <div class="form-group val-quarter">
              <label for="state-region">State</label>
              <input type="text" id="state-region" class="ease-input" placeholder="CA" required>
            </div>
            <div class="form-group val-quarter">
              <label for="zip-code">Zip Code</label>
              <input type="text" id="zip-code" class="ease-input" placeholder="94105" required>
            </div>
          </div>
        </section>

        <section class="checkout-card pane-delay-3">
          <h2 class="section-title"><span class="step-num">3</span> Payment Method</h2>
          <div class="payment-selector-group">
            <input type="radio" id="pay-card" name="payment-type" class="payment-radio" checked>
            <label for="pay-card" class="payment-method-tile">
              <span class="tile-icon">💳</span>
              <span class="tile-label">Credit / Debit Card</span>
            </label>

            <input type="radio" id="pay-crypto" name="payment-type" class="payment-radio">
            <label for="pay-crypto" class="payment-method-tile">
              <span class="tile-icon">🌐</span>
              <span class="tile-label">Digital Vault Transfer</span>
            </label>
          </div>

          <div class="form-grid payment-details-pane">
            <div class="form-group val-full">
              <label for="card-num">Card Number</label>
              <input type="text" id="card-num" class="ease-input" placeholder="4111 •••• •••• 8832">
            </div>
            <div class="form-group val-half">
              <label for="card-expiry">Expiration Date</label>
              <input type="text" id="card-expiry" class="ease-input" placeholder="MM / YY">
            </div>
            <div class="form-group val-half">
              <label for="card-cvc">Security Code (CVC)</label>
              <input type="password" id="card-cvc" class="ease-input" placeholder="•••">
            </div>
          </div>
        </section>

      </main>

      <aside class="checkout-sidebar pane-delay-4">
        <div class="checkout-card sticky-sidebar-panel">
          <h2 class="section-title">Order Summary</h2>
          
          <ul class="summary-item-list">
            <li class="summary-item">
              <div class="item-desc">
                <span class="item-name">Quantum Core Case</span>
                <span class="item-qty">Qty: 1</span>
              </div>
              <span class="item-price">$299.00</span>
            </li>
            <li class="summary-item">
              <div class="item-desc">
                <span class="item-name">Vortex Cooling Pod</span>
                <span class="item-qty">Qty: 2</span>
              </div>
              <span class="item-price">$178.00</span>
            </li>
          </ul>

          <hr class="summary-divider">

          <div class="fee-breakdown-table">
            <div class="fee-row">
              <span>Subtotal</span>
              <span>$477.00</span>
            </div>
            <div class="fee-row">
              <span>Secure Shipping</span>
              <span class="text-free">FREE</span>
            </div>
            <div class="fee-row">
              <span>Estimated Tax</span>
              <span>$38.16</span>
            </div>
            <hr class="summary-divider">
            <div class="fee-row total-row">
              <span>Total Due</span>
              <span>$515.16</span>
            </div>
          </div>

          <button class="ease-order-submit-btn">Place Secure Order</button>
        </div>
      </aside>

    </div>
  </div>

</body>
</html>
