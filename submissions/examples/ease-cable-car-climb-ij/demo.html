<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.55">
<title>Cable Car Climb</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="aerial-lift">
  <header class="lift-head">
    <h1 class="lift-name">ALPINE LINE</h1>
    <p class="lift-station">STATION 2</p>
  </header>
  <section class="lift-scene" aria-label="Cable car over the valley">
    <div class="valley-back"></div>
    <div class="lift-tower">
      <span class="tower-leg post-a"></span>
      <span class="tower-leg post-b"></span>
      <span class="tower-crossarm"></span>
    </div>
    <span class="lift-cable"></span>
    <div class="cable-car">
      <span class="gondola-roof"></span>
      <span class="gondola-body"></span>
      <span class="gondola-window gwin-1"></span>
      <span class="gondola-window gwin-2"></span>
      <span class="gondola-window gwin-3"></span>
      <span class="gondola-hanger hang-1"></span>
      <span class="gondola-hanger hang-2"></span>
      <span class="gondola-bottom"></span>
    </div>
    <div class="counterweight"></div>
    <div class="valley-station">
      <span class="station-roof"></span>
      <span class="station-door"></span>
    </div>
  </section>
  <footer class="lift-foot">
    <span class="lift-climb">CLIMB 42m</span>
    <span class="lift-grip">GRIP</span>
  </footer>
</main>
</body>
</html>
