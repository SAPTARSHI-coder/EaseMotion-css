<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glowing Gradient Modal</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <button class="open-btn" id="openModal">Launch Modal</button>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-wrapper">
            <!-- Glowing gradient background -->
            <div class="modal-glow"></div>
            
            <div class="modal-content">
                <div class="modal-icon">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
                    </svg>
                </div>
                <h2 class="modal-title">Upgrade Your Plan</h2>
                <p class="modal-text">Unlock premium features, faster rendering, and priority support. Take your experience to the next level today.</p>
                <div class="modal-actions">
                    <button class="btn btn-secondary" id="closeModal">Maybe Later</button>
                    <button class="btn btn-primary">Upgrade Now</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const openModal = document.getElementById('openModal');
        const closeModal = document.getElementById('closeModal');
        const modalOverlay = document.getElementById('modalOverlay');

        openModal.addEventListener('click', () => {
            modalOverlay.classList.add('active');
        });

        closeModal.addEventListener('click', () => {
            modalOverlay.classList.remove('active');
        });

        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) {
                modalOverlay.classList.remove('active');
            }
        });
    </script>
</body>
</html>
