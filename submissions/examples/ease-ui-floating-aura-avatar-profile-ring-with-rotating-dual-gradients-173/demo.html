<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floating Aura Avatar Profile Ring</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>Floating Aura Avatar Profile Ring</h1>
    <p class="subtitle">
        Minimalist Clean Edition
    </p>

    <div class="avatar-wrapper">

        <div class="outer-ring"></div>
        <div class="inner-ring"></div>

        <div class="avatar">

            <img
                src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=600"
                alt="Avatar">

        </div>

        <span class="status online"></span>

    </div>

    <div class="profile">

        <h2>John Anderson</h2>

        <p>Frontend Developer</p>

        <button>
            Follow
        </button>

    </div>

</div>

</body>
</html>
