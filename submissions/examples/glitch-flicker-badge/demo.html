<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CSS Glitch-Flicker Badge for fintech dashboard layouts">
  <title>Glitch-Flicker Badge</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="showcase">
    <section class="badge-card" aria-labelledby="badge-title">
      <p class="eyebrow">Fintech Dashboard</p>

      <h1 id="badge-title">Glitch-Flicker Badge</h1>

      <div class="badge-wrapper">
        <span class="glitch-badge" aria-label="Live status">
          <span class="badge-dot" aria-hidden="true"></span>
          <span class="badge-text">LIVE</span>
        </span>
      </div>

      <p class="description">
        A lightweight status badge with a subtle glitch and flicker animation,
        built entirely with HTML and CSS.
      </p>
    </section>
  </main>

</body>
</html>
