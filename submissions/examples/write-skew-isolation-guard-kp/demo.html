<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Write Skew Isolation Guard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="isolation-shell" aria-labelledby="isolation-title">
    <section class="isolation-board">
      <p class="eyebrow">Serializable safety</p>
      <h1 id="isolation-title">Write Skew Isolation Guard</h1>
      <p class="summary">Parallel snapshots approach the same invariant while predicate locks detect drift and block unsafe commits.</p>
      <div class="isolation-stage" role="img" aria-label="Animated write skew isolation guard visualization">
        <div class="txn txn-a"><strong>T1</strong><span></span><span></span><span></span></div>
        <div class="snapshot-grid"><i></i><i></i><i></i><i></i><b></b></div>
        <div class="guard-wall"><span></span><span></span><span></span><em>guard</em></div>
        <div class="txn txn-b"><strong>T2</strong><span></span><span></span><span></span></div>
      </div>
      <div class="status"><span>predicate locked</span><span>skew blocked</span><span>serializable</span></div>
    </section>
  </main>
</body>
</html>
