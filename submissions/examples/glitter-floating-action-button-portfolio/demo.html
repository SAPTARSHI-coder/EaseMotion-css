<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glitter Floating Action Button - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Background Environment Simulator for a Creative Portfolio -->
  <div class="portfolio-preview">
    <header class="portfolio-header">
      <h1>Creative Workspace</h1>
      <p>Scroll down or tap the interactive action button to get in touch.</p>
    </header>
    
    <main class="portfolio-content">
      <div class="card-skeleton"></div>
      <div class="card-skeleton"></div>
    </main>

    <!-- The Glitter Floating Action Button -->
    <button class="glitter-fab" aria-label="Open contact options">
      <div class="glitter-stars-layer"></div>
      <div class="glitter-shimmer-overlay"></div>
      <svg class="fab-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"></line>
        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
      </svg>
    </button>
  </div>

</body>
</html>
