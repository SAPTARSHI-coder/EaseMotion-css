<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="CSS-only animated wave ocean scene with a bobbing boat."
  >
  <title>CSS Wave Ocean</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="scene" aria-label="Animated ocean scene">
    <div class="sun" aria-hidden="true"></div>

    <div class="cloud cloud-one" aria-hidden="true"></div>
    <div class="cloud cloud-two" aria-hidden="true"></div>

    <div class="ocean" aria-hidden="true">
      <div class="wave wave-back"></div>
      <div class="wave wave-middle"></div>
      <div class="wave wave-front"></div>
    </div>

    <div
      class="boat"
      tabindex="0"
      role="img"
      aria-label="Small boat gently bobbing on the ocean"
    >
      <div class="boat-sail"></div>
      <div class="boat-mast"></div>
      <div class="boat-body"></div>
    </div>

    <section class="scene-content">
      <h1>Wave Ocean</h1>
      <p>Pure CSS animated ocean scene</p>
    </section>
  </main>
</body>
</html>
