<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hover Progress Bar Cyberpunk</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="cyber-demo" aria-labelledby="progress-title">
    <section class="cyber-panel">
      <p class="eyebrow">Cyberpunk component</p>
      <h1 id="progress-title">Hover Progress Bar</h1>
      <p class="summary">Hover or focus the module to charge a neon progress rail with scanline energy and threshold pulses.</p>
      <button class="progress-module" aria-describedby="progress-copy">
        <span class="module-top"><strong>Neural sync</strong><em>standby</em></span>
        <span class="progress-track"><i></i><b></b><b></b><b></b></span>
        <span class="module-bottom" id="progress-copy"><small>charge 18%</small><small>hover target 92%</small></span>
      </button>
    </section>
  </main>
</body>
</html>
