<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>View Transitions Fallback - Edge Cases</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <h1>View Transitions Fallback</h1>

    <p class="subtitle">
      This example demonstrates safe fallback behavior when the View
      Transitions API is unavailable or invalid.
    </p>

    <section class="card" id="content">
      <span class="badge" id="state">State 1</span>
      <h2 id="title">Fallback Ready</h2>
      <p id="message">
        The content can still update without the View Transitions API.
      </p>
    </section>

    <div class="controls">
      <button id="updateButton" type="button">
        Update Content
      </button>

      <button id="resetButton" type="button">
        Reset
      </button>
    </div>

    <p id="supportStatus" class="support-status" aria-live="polite"></p>
  </main>

  <script>
    const content = document.querySelector("#content");
    const state = document.querySelector("#state");
    const title = document.querySelector("#title");
    const message = document.querySelector("#message");
    const updateButton = document.querySelector("#updateButton");
    const resetButton = document.querySelector("#resetButton");
    const supportStatus = document.querySelector("#supportStatus");

    let currentState = 1;

    function updateContent() {
      currentState = currentState === 1 ? 2 : 1;

      if (currentState === 2) {
        state.textContent = "State 2";
        title.textContent = "Fallback Update Complete";
        message.textContent =
          "The content was updated successfully.";
      } else {
        state.textContent = "State 1";
        title.textContent = "Fallback Ready";
        message.textContent =
          "The content can still update without the View Transitions API.";
      }
    }

    function runTransition(update) {
      if (typeof document.startViewTransition === "function") {
        return document.startViewTransition(update);
      }

      update();
      return null;
    }

    updateButton.addEventListener("click", () => {
      runTransition(updateContent);
    });

    resetButton.addEventListener("click", () => {
      currentState = 1;
      state.textContent = "State 1";
      title.textContent = "Fallback Ready";
      message.textContent =
        "The content can still update without the View Transitions API.";
    });

    supportStatus.textContent =
      typeof document.startViewTransition === "function"
        ? "View Transitions API detected."
        : "View Transitions unavailable. Fallback is active.";
  </script>
</body>
</html>
