<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
Bento Grid Interactive Dashboard
</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<main class="dashboard">


<header class="header">

<h1>
Accessible Dashboard
</h1>

<p>
Bento Grid Layout with CSS Grid & Flexbox
</p>

</header>



<section class="bento-grid">


<article class="card large">

<h2>
Analytics
</h2>

<div class="chart">

<div class="bar one"></div>
<div class="bar two"></div>
<div class="bar three"></div>
<div class="bar four"></div>

</div>

<p>
Monthly performance overview
</p>

</article>



<article class="card">

<h2>
Users
</h2>

<strong>
24.8K
</strong>

<p>
Active members</p>

</article>



<article class="card">

<h2>
Revenue
</h2>

<strong>
$86K
</strong>

<p>
Current growth</p>

</article>



<article class="card wide">

<h2>
System Status
</h2>


<div class="status">

<span></span>

All services operational

</div>


</article>



<article class="card">

<h2>
Tasks
</h2>

<ul>

<li>Design Review</li>

<li>Accessibility Check</li>

<li>Deployment</li>

</ul>


</article>



</section>


</main>



<script src="script.js"></script>


</body>

</html>
