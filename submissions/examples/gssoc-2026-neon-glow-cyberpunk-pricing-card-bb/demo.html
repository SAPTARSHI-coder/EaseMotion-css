<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon Glow Cyberpunk Pricing Card | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="pricing-container">
    <div class="neon-card popular">
      <div class="neon-border"></div>
      <div class="badge">Popular Choice</div>
      <div class="card-header">
        <h3 class="plan-name">CYBER PRO</h3>
        <div class="price-container">
          <span class="currency">$</span>
          <span class="price">49</span>
          <span class="period">/mo</span>
        </div>
      </div>
      <ul class="feature-list">
        <li><span>✓</span> Ultra-Low Latency Neural Hub</li>
        <li><span>✓</span> Unlimited Holographic Data Stream</li>
        <li><span>✓</span> Quantum Encryption Shield</li>
        <li><span>✓</span> 24/7 AI Synthetic Support</li>
      </ul>
      <button class="neon-btn">INITIALIZE PLAN</button>
    </div>
  </div>
</body>
</html>
