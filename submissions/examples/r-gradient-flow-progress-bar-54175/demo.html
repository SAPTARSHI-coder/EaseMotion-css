<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Gradient-Flow Progress Bar</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<section class="dashboard">

    <div class="card">

        <h1>Project Progress</h1>
        <p>Responsive Dashboard Overview</p>

        <div class="progress-item">

            <div class="progress-info">
                <span>Frontend</span>
                <span>95%</span>
            </div>

            <div class="progress-bar">
                <div class="progress-fill frontend"></div>
            </div>

        </div>

        <div class="progress-item">

            <div class="progress-info">
                <span>Backend</span>
                <span>82%</span>
            </div>

            <div class="progress-bar">
                <div class="progress-fill backend"></div>
            </div>

        </div>

        <div class="progress-item">

            <div class="progress-info">
                <span>Testing</span>
                <span>66%</span>
            </div>

            <div class="progress-bar">
                <div class="progress-fill testing"></div>
            </div>

        </div>

        <div class="progress-item">

            <div class="progress-info">
                <span>Deployment</span>
                <span>48%</span>
            </div>

            <div class="progress-bar">
                <div class="progress-fill deploy"></div>
            </div>

        </div>

    </div>

</section>

</body>
</html>
