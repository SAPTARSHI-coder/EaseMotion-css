<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Tilt Reveal Image Card</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="showcase">
    <article class="tilt-card">
      <div class="tilt-card__image">
        <img
          src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=900&q=80"
          alt="Mountain landscape surrounded by mist"
        >
      </div>

      <div class="tilt-card__content">
        <span class="tilt-card__tag">Explore</span>
        <h1>Into The Wild</h1>
        <p>
          Discover quiet landscapes and unforgettable moments beyond
          the ordinary.
        </p>
        <a href="#" class="tilt-card__link">Discover More →</a>
      </div>
    </article>
  </main>

</body>
</html>
