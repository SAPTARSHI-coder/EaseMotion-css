<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flower Nav · Blooming Petals</title>

    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <div class="card">
        <h2>🌸 Flower Nav</h2>
        <p class="sub">petals open like a blooming flower</p>

        <!-- === FLOWER NAV === -->
        <div class="flower-container" id="flowerContainer">
            <button class="flower-center" id="flowerCenter" aria-label="Toggle flower">
                <i class="fas fa-seedling"></i>
            </button>

            <ul class="flower-petals" id="flowerPetals">
                <li>
                    <a href="#" class="petal" data-tooltip="Home">
                        <i class="fas fa-home"></i>
                    </a>
                </li>
                <li>
                    <a href="#" class="petal" data-tooltip="Explore">
                        <i class="fas fa-compass"></i>
                    </a>
                </li>
                <li>
                    <a href="#" class="petal" data-tooltip="Gallery">
                        <i class="fas fa-images"></i>
                    </a>
                </li>
                <li>
                    <a href="#" class="petal" data-tooltip="Blog">
                        <i class="fas fa-blog"></i>
                    </a>
                </li>
                <li>
                    <a href="#" class="petal" data-tooltip="Contact">
                        <i class="fas fa-envelope"></i>
                    </a>
                </li>
                <li>
                    <a href="#" class="petal" data-tooltip="Profile">
                        <i class="fas fa-user"></i>
                    </a>
                </li>
                <li>
                    <a href="#" class="petal" data-tooltip="Settings">
                        <i class="fas fa-cog"></i>
                    </a>
                </li>
                <li>
                    <a href="#" class="petal" data-tooltip="Help">
                        <i class="fas fa-question-circle"></i>
                    </a>
                </li>
            </ul>
        </div>

        <p style="margin-top: 2rem; font-size: 0.85rem; color: #64748b;">
            Hover or click · watch the petals bloom like a flower
        </p>
    </div>

    <!-- Embedded JavaScript -->
    <script>
        (function() {
            'use strict';

            const container = document.getElementById('flowerContainer');
            const center = document.getElementById('flowerCenter');
            const petals = document.getElementById('flowerPetals');
            const petalLinks = document.querySelectorAll('.petal');
            let isOpen = false;

            // --- Toggle Flower ---
            function toggleFlower() {
                isOpen = !isOpen;
                container.classList.toggle('is-open', isOpen);
                center.classList.toggle('is-active', isOpen);

                const icon = center.querySelector('i');
                if (isOpen) {
                    icon.className = 'fas fa-times';
                } else {
                    icon.className = 'fas fa-seedling';
                }

                console.log(`🌸 Flower ${isOpen ? 'bloomed' : 'closed'}`);
            }

            // --- Open Flower ---
            function openFlower() {
                if (isOpen) return;
                toggleFlower();
            }

            // --- Close Flower ---
            function closeFlower() {
                if (!isOpen) return;
                toggleFlower();
            }

            // --- Event Listeners ---

            // Center button
            center.addEventListener('click', function(e) {
                e.stopPropagation();
                toggleFlower();
                this.classList.add('click-pulse');
                setTimeout(() => {
                    this.classList.remove('click-pulse');
                }, 300);
            });

            // Petal clicks
            petalLinks.forEach((petal, index) => {
                petal.addEventListener('click', function(e) {
                    e.preventDefault();
                    const label = this.getAttribute('data-tooltip') || 'Item';
                    console.log(`🌸 Selected: ${label}`);

                    this.classList.add('clicked');
                    setTimeout(() => {
                        this.classList.remove('clicked');
                    }, 300);

                    setTimeout(() => {
                        closeFlower();
                    }, 400);
                });
            });

            // Click outside to close
            document.addEventListener('click', function(e) {
                if (!container.contains(e.target)) {
                    closeFlower();
                }
            });

            // Keyboard accessibility
            center.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    toggleFlower();
                }
            });

            petalLinks.forEach(petal => {
                petal.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        this.click();
                    }
                    if (e.key === 'Escape') {
                        closeFlower();
                    }
                });
            });

            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && isOpen) {
                    closeFlower();
                    center.focus();
                }
            });

            // Auto-bloom on load for demo
            setTimeout(() => {
                openFlower();
                setTimeout(() => {
                    closeFlower();
                }, 3000);
            }, 500);

            console.log('🌸 Flower nav initialized!');

        })();
    </script>

</body>
</html>
