<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Traffic Source Chart - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="em-chart-page">
        <!-- Pure CSS Dashboard Traffic Source Chart Widget -->
        <div class="em-card" role="region" aria-label="Traffic Source Chart Showcase" tabindex="0">
            <span class="em-card-badge">DASHBOARD WIDGETS</span>
            <h1 class="em-card-title">Traffic Sources</h1>
            <p class="em-card-desc">A smooth, responsive, and accessible pure CSS horizontal bar chart showing traffic sources and percentages.</p>

            <div class="em-chart-container" role="figure" aria-label="Traffic sources horizontal bar chart">
                <!-- Bar 1 -->
                <div class="em-chart-row">
                    <div class="em-row-info">
                        <span class="em-source-name">Direct Search</span>
                        <span class="em-source-val">42%</span>
                    </div>
                    <div class="em-bar-track">
                        <div class="em-bar-fill em-fill-1" style="--em-progress: 42%;"></div>
                    </div>
                </div>

                <!-- Bar 2 -->
                <div class="em-chart-row">
                    <div class="em-row-info">
                        <span class="em-source-name">Organic Referral</span>
                        <span class="em-source-val">28%</span>
                    </div>
                    <div class="em-bar-track">
                        <div class="em-bar-fill em-fill-2" style="--em-progress: 28%;"></div>
                    </div>
                </div>

                <!-- Bar 3 -->
                <div class="em-chart-row">
                    <div class="em-row-info">
                        <span class="em-source-name">Social Media</span>
                        <span class="em-source-val">18%</span>
                    </div>
                    <div class="em-bar-track">
                        <div class="em-bar-fill em-fill-3" style="--em-progress: 18%;"></div>
                    </div>
                </div>

                <!-- Bar 4 -->
                <div class="em-chart-row">
                    <div class="em-row-info">
                        <span class="em-source-name">Email Campaigns</span>
                        <span class="em-source-val">12%</span>
                    </div>
                    <div class="em-bar-track">
                        <div class="em-bar-fill em-fill-4" style="--em-progress: 12%;"></div>
                    </div>
                </div>
            </div>

            <a href="#" class="em-card-btn" role="button">Export Analytics</a>
        </div>
    </div>
</body>
</html>
