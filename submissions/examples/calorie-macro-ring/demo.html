<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="CSS-only calorie and macronutrient tracking ring"
  >

  <title>Calorie Macro Ring</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="macro-dashboard">

    <section class="macro-card" aria-labelledby="macro-title">

      <header class="macro-header">
        <div>
          <span class="eyebrow">DAILY NUTRITION</span>
          <h1 id="macro-title">Macro Balance</h1>
        </div>

        <span class="status-badge">
          ● On Track
        </span>
      </header>

      <div class="ring-area">

        <div class="macro-rings" aria-label="Daily macronutrient progress">

          <div
            class="ring ring-carb"
            role="progressbar"
            aria-label="Carbohydrates"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="72"
          ></div>

          <div
            class="ring ring-protein"
            role="progressbar"
            aria-label="Protein"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="84"
          ></div>

          <div
            class="ring ring-fat"
            role="progressbar"
            aria-label="Fat"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="61"
          ></div>

          <div class="ring-center">
            <span class="calorie-value">1,680</span>
            <span class="calorie-label">of 2,200 kcal</span>
          </div>

        </div>

        <div class="ring-caption">
          <strong>76%</strong>
          <span>Daily goal completed</span>
        </div>

      </div>

      <div class="macro-list">

        <article class="macro-item">
          <div class="macro-info">
            <span class="dot carb"></span>
            <div>
              <strong>Carbohydrates</strong>
              <small>180g / 250g</small>
            </div>
          </div>

          <strong class="percentage">72%</strong>
        </article>

        <article class="macro-item">
          <div class="macro-info">
            <span class="dot protein"></span>
            <div>
              <strong>Protein</strong>
              <small>126g / 150g</small>
            </div>
          </div>

          <strong class="percentage">84%</strong>
        </article>

        <article class="macro-item">
          <div class="macro-info">
            <span class="dot fat"></span>
            <div>
              <strong>Fat</strong>
              <small>43g / 70g</small>
            </div>
          </div>

          <strong class="percentage">61%</strong>
        </article>

      </div>

      <footer class="macro-footer">
        <span>Updated today</span>
        <span class="pulse-dot"></span>
        <span>Nutrition goal</span>
      </footer>

    </section>

  </main>

</body>
</html>
