<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="CSS-only plant growth animation demonstration"
  >
  <title>CSS Plant Growth Animation</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="demo-container">
    <section
      class="plant-scene"
      aria-label="Animated plant growing from the soil"
    >
      <div class="plant" aria-hidden="true">
        <div class="stem"></div>

        <div class="leaf leaf-left"></div>
        <div class="leaf leaf-right"></div>
        <div class="leaf leaf-top"></div>
      </div>

      <div class="soil" aria-hidden="true"></div>

      <h1>CSS Plant Growth</h1>
      <p>A pure CSS plant animation that grows on page load.</p>
    </section>
  </main>
</body>
</html>
