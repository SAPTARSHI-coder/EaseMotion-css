<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Loader: Diamond Facet Edge</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="layout-container">
        
        <header class="section-header">
            <h1 class="title">Pure CSS Loader: Diamond Facet</h1>
            <p class="subtitle">A geometric, 3D-spinning gemstone loader utilizing sharp conic gradients to simulate physical light refracting across cut facets.</p>
        </header>

        <div class="demo-area">
            
            <div class="loader-container" aria-label="Loading content, diamond facet animation playing">
                
                <!-- 
                  [TECHNIQUE] Diamond Facet Edge
                  The gemstone is constructed using a rotated square. 
                  Its four interior facets are drawn using a conic gradient.
                  The entire structure is then spun in 3D space using rotateY.
                -->
                <div class="diamond-wrapper" aria-hidden="true">
                    
                    <div class="diamond-gem"></div>
                    <!-- A soft ground shadow that reacts to the spinning gem -->
                    <div class="diamond-shadow"></div>
                    
                </div>
                
                <div class="loading-text">Polishing Gem...</div>
                
            </div>
            
        </div>
        
    </div>

</body>
</html>
