<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chart Bars Grow #87558 Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="chart-card">
    <div class="chart-header">
      <div class="chart-title">Weekly Throughput Growth</div>
      <div class="chart-badge">+38.4% Peak</div>
    </div>

    <div class="chart-viewport" id="chartViewport">
      <div class="bar-track">
        <div class="bar-column" style="--bar-height: 45%; --delay: 0.05s;">
          <span class="bar-tooltip">450</span>
        </div>
        <span class="bar-label">Mon</span>
      </div>

      <div class="bar-track">
        <div class="bar-column" style="--bar-height: 65%; --delay: 0.15s;">
          <span class="bar-tooltip">650</span>
        </div>
        <span class="bar-label">Tue</span>
      </div>

      <div class="bar-track">
        <div class="bar-column" style="--bar-height: 82%; --delay: 0.25s;">
          <span class="bar-tooltip">820</span>
        </div>
        <span class="bar-label">Wed</span>
      </div>

      <div class="bar-track">
        <div class="bar-column" style="--bar-height: 54%; --delay: 0.35s;">
          <span class="bar-tooltip">540</span>
        </div>
        <span class="bar-label">Thu</span>
      </div>

      <div class="bar-track">
        <div class="bar-column" style="--bar-height: 94%; --delay: 0.45s;">
          <span class="bar-tooltip">940</span>
        </div>
        <span class="bar-label">Fri</span>
      </div>

      <div class="bar-track">
        <div class="bar-column" style="--bar-height: 70%; --delay: 0.55s;">
          <span class="bar-tooltip">700</span>
        </div>
        <span class="bar-label">Sat</span>
      </div>

      <div class="bar-track">
        <div class="bar-column" style="--bar-height: 88%; --delay: 0.65s;">
          <span class="bar-tooltip">880</span>
        </div>
        <span class="bar-label">Sun</span>
      </div>
    </div>

    <div class="chart-controls">
      <span class="legend-text">Spring overshoot scale transition</span>
      <button class="btn-replay" id="replayBtn">Replay Animation</button>
    </div>
  </div>

  <script>
    const replayBtn = document.getElementById('replayBtn');
    const chartViewport = document.getElementById('chartViewport');

    replayBtn.addEventListener('click', () => {
      const bars = chartViewport.querySelectorAll('.bar-column');
      bars.forEach(bar => {
        bar.style.animation = 'none';
        bar.offsetHeight; /* Trigger reflow */
        bar.style.animation = '';
      });
    });
  </script>
</body>
</html>
