<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mandala Nav · Symmetrical Pattern Unfolds</title>

    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <div class="card">
        <h2>🕉️ Mandala Nav</h2>
        <p class="sub">symmetrical pattern unfolds outward</p>

        <!-- === MANDALA NAV === -->
        <div class="mandala-container" id="mandalaContainer">
            <button class="mandala-center" id="mandalaCenter" aria-label="Toggle mandala">
                <i class="fas fa-om"></i>
            </button>

            <ul class="mandala-petals" id="mandalaPetals">
                <!-- Ring 1: 6 petals -->
                <li class="petal p1"><a href="#" data-tooltip="Peace"><i class="fas fa-dove"></i></a></li>
                <li class="petal p2"><a href="#" data-tooltip="Love"><i class="fas fa-heart"></i></a></li>
                <li class="petal p3"><a href="#" data-tooltip="Harmony"><i class="fas fa-yin-yang"></i></a></li>
                <li class="petal p4"><a href="#" data-tooltip="Balance"><i class="fas fa-scale-balanced"></i></a></li>
                <li class="petal p5"><a href="#" data-tooltip="Light"><i class="fas fa-sun"></i></a></li>
                <li class="petal p6"><a href="#" data-tooltip="Wisdom"><i class="fas fa-brain"></i></a></li>

                <!-- Ring 2: 12 petals (interleaved) -->
                <li class="petal p7"><a href="#" data-tooltip="Unity"><i class="fas fa-hand-holding-heart"></i></a></li>
                <li class="petal p8"><a href="#" data-tooltip="Compassion"><i class="fas fa-hand-sparkles"></i></a></li>
                <li class="petal p9"><a href="#" data-tooltip="Gratitude"><i class="fas fa-hands"></i></a></li>
                <li class="petal p10"><a href="#" data-tooltip="Joy"><i class="fas fa-face-smile"></i></a></li>
                <li class="petal p11"><a href="#" data-tooltip="Kindness"><i class="fas fa-hand-peace"></i></a></li>
                <li class="petal p12"><a href="#" data-tooltip="Hope"><i class="fas fa-seedling"></i></a></li>
                <li class="petal p13"><a href="#" data-tooltip="Faith"><i class="fas fa-star-and-crescent"></i></a></li>
                <li class="petal p14"><a href="#" data-tooltip="Courage"><i class="fas fa-shield"></i></a></li>
                <li class="petal p15"><a href="#" data-tooltip="Truth"><i class="fas fa-eye"></i></a></li>
                <li class="petal p16"><a href="#" data-tooltip="Freedom"><i class="fas fa-feather"></i></a></li>
                <li class="petal p17"><a href="#" data-tooltip="Flow"><i class="fas fa-water"></i></a></li>
                <li class="petal p18"><a href="#" data-tooltip="Eternity"><i class="fas fa-infinity"></i></a></li>
            </ul>
        </div>

        <p style="margin-top: 2rem; font-size: 0.85rem; color: #64748b;">
            Hover or click · watch the mandala unfold
        </p>
    </div>

    <!-- Embedded JavaScript -->
    <script>
        (function() {
            'use strict';

            const container = document.getElementById('mandalaContainer');
            const center = document.getElementById('mandalaCenter');
            const petals = document.getElementById('mandalaPetals');
            const petalLinks = document.querySelectorAll('.petal a');
            let isOpen = false;

            // --- Toggle Mandala ---
            function toggleMandala() {
                isOpen = !isOpen;
                container.classList.toggle('is-open', isOpen);
                center.classList.toggle('is-active', isOpen);

                const icon = center.querySelector('i');
                if (isOpen) {
                    icon.className = 'fas fa-times';
                } else {
                    icon.className = 'fas fa-om';
                }

                console.log(`🕉️ Mandala ${isOpen ? 'unfolded' : 'folded'}`);
            }

            // --- Open Mandala ---
            function openMandala() {
                if (isOpen) return;
                toggleMandala();
            }

            // --- Close Mandala ---
            function closeMandala() {
                if (!isOpen) return;
                toggleMandala();
            }

            // --- Event Listeners ---

            // Center button
            center.addEventListener('click', function(e) {
                e.stopPropagation();
                toggleMandala();
                this.classList.add('click-pulse');
                setTimeout(() => {
                    this.classList.remove('click-pulse');
                }, 300);
            });

            // Petal clicks
            petalLinks.forEach(link => {
                link.addEventListener('click', function(e) {
                    e.preventDefault();
                    const tooltip = this.getAttribute('data-tooltip') || 'Item';
                    console.log(`🕉️ Selected: ${tooltip}`);
                    this.closest('.petal').classList.add('clicked');
                    setTimeout(() => {
                        this.closest('.petal').classList.remove('clicked');
                    }, 300);
                    setTimeout(() => {
                        closeMandala();
                    }, 400);
                });

                // Keyboard accessibility
                link.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        this.click();
                    }
                    if (e.key === 'Escape') {
                        closeMandala();
                    }
                });
            });

            // Click outside to close
            document.addEventListener('click', function(e) {
                if (!container.contains(e.target)) {
                    closeMandala();
                }
            });

            // Keyboard accessibility
            center.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    toggleMandala();
                }
            });

            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && isOpen) {
                    closeMandala();
                    center.focus();
                }
            });

            // Auto-unfold on load for demo
            setTimeout(() => {
                openMandala();
                setTimeout(() => {
                    closeMandala();
                }, 3500);
            }, 500);

            console.log('🕉️ Mandala nav initialized!');

        })();
    </script>

</body>
</html>
