<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dip Circle Inclination — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Dip Circle Inclination demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Dip Circle Inclination</h1>
      <p class="lede">Magnetic dip circle needle settling to local inclination angle</p>
    </header>

    <section class="ease-dip-circle-inclination" data-demo="dip-circle-inclination" aria-live="polite">
      <div class="ease-dip-circle-inclination__housing">
        <div class="ease-dip-circle-inclination__bezel">
          <div class="ease-dip-circle-inclination__face">
            <div class="ease-dip-circle-inclination__readout">
              <span class="ease-dip-circle-inclination__label">Dip Circle Inclination</span>
              <span class="ease-dip-circle-inclination__value">LIVE</span>
            </div>
            <div class="ease-dip-circle-inclination__motion" aria-hidden="true">
              <span class="ease-dip-circle-inclination__a"></span>
              <span class="ease-dip-circle-inclination__b"></span>
              <span class="ease-dip-circle-inclination__c"></span>
              <span class="ease-dip-circle-inclination__d"></span>
            </div>
            <div class="ease-dip-circle-inclination__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-dip-circle-inclination__controls">
          <button type="button" class="ease-dip-circle-inclination__btn primary">Engage</button>
          <button type="button" class="ease-dip-circle-inclination__btn">Reset</button>
          <label class="ease-dip-circle-inclination__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-dip-circle-inclination__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
