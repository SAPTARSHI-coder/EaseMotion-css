<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liquid Morph Blob | EaseMotion CSS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="blob-scene">
        <!-- Primary Morphing Blob -->
        <div class="blob-container primary">
            <div class="blob blob-shape-1"></div>
            <div class="blob-inner"></div>
        </div>

        <!-- Secondary Floating Blobs -->
        <div class="blob-container secondary">
            <div class="blob blob-shape-2"></div>
        </div>
        <div class="blob-container tertiary">
            <div class="blob blob-shape-3"></div>
        </div>
        <div class="blob-container quaternary">
            <div class="blob blob-shape-4"></div>
        </div>

        <!-- Center Label -->
        <div class="blob-label">
            <span>Liquid</span>
            <span>Morph</span>
        </div>
    </div>
</body>
</html>
