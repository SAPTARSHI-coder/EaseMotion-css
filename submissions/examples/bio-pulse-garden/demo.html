<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BioPulse Garden</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="garden">
      <header>
        <div>
          <span class="eyebrow">🌱 LIVING COMPONENT</span>
          <h1>BioPulse Garden</h1>
        </div>
        <strong id="growthValue">0%</strong>
      </header>
      <section class="scene" id="scene">
        <div class="sun"></div>
        <div class="pollen pollen-one"></div>
        <div class="pollen pollen-two"></div>
        <div class="pollen pollen-three"></div>
        <div class="pollen pollen-four"></div>
        <div class="plant">
          <div class="stem"></div>
          <div class="leaf leaf-left"></div>
          <div class="leaf leaf-right"></div>
          <div class="leaf leaf-left-two"></div>
          <div class="leaf leaf-right-two"></div>
          <div class="flower">
            <i></i> <i></i> <i></i> <i></i> <span></span>
          </div>
          <div class="seed"></div>
        </div>
        <div class="ground"></div>
      </section>
      <section class="controls">
        <label>
          Growth
          <input id="growthSlider" type="range" min="0" max="100" value="0" />
        </label>
        <div class="actions">
          <button id="waterBtn">💧 Water</button>
          <button id="resetBtn">↻ Reset</button>
        </div>
        <p id="message">A seed is waiting to grow.</p>
      </section>
    </main>
    <script>
      const slider = document.getElementById("growthSlider");
      const value = document.getElementById("growthValue");
      const message = document.getElementById("message");
      function updateGrowth() {
        const growth = Number(slider.value);
        value.textContent = growth + "%";
        document.documentElement.style.setProperty("--growth", growth / 100);
        if (growth < 20) {
          message.textContent = "A seed is waiting to grow.";
        } else if (growth < 45) {
          message.textContent = "A tiny sprout has appeared.";
        } else if (growth < 70) {
          message.textContent = "The plant is developing new leaves.";
        } else if (growth < 90) {
          message.textContent = "The plant is preparing to bloom.";
        } else {
          message.textContent = "Full bloom achieved! 🌸";
        }
      }
      document.getElementById("waterBtn").addEventListener("click", () => {
        slider.value = Math.min(100, Number(slider.value) + 10);
        updateGrowth();
      });
      document.getElementById("resetBtn").addEventListener("click", () => {
        slider.value = 0;
        updateGrowth();
      });
      slider.addEventListener("input", updateGrowth);
      document.addEventListener("keydown", (event) => {
        if (event.code === "Space") {
          event.preventDefault();
          document.getElementById("waterBtn").click();
        }
        if (event.key.toLowerCase() === "r") {
          document.getElementById("resetBtn").click();
        }
      });
      updateGrowth();
    </script>
  </body>
</html>
