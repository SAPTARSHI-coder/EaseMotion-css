<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Mode Animated Timeline</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="ad-timeline">
        <div class="ad-node">
            <div class="ad-marker"></div>
            <div class="ad-content">
                <span class="ad-date">2026 Q1</span>
                <h3>Project Kickoff</h3>
                <p>Initial requirements gathering and system architecture planning.</p>
            </div>
        </div>
        <div class="ad-node">
            <div class="ad-marker"></div>
            <div class="ad-content">
                <span class="ad-date">2026 Q2</span>
                <h3>Core Development</h3>
                <p>Building out the main APIs and frontend component library.</p>
            </div>
        </div>
        <div class="ad-node">
            <div class="ad-marker"></div>
            <div class="ad-content">
                <span class="ad-date">2026 Q3</span>
                <h3>Beta Release</h3>
                <p>User testing and bug fixing phase before final launch.</p>
            </div>
        </div>
    </div>
</body>
</html>
