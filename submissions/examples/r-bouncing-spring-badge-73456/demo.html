<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
        name="description"
        content="Bouncing Spring CSS badge component"
    >
    <title>Bouncing Spring Badge</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="page">
        <section class="demo-card" aria-labelledby="demo-title">
            <p class="eyebrow">EaseMotion CSS</p>

            <h1 id="demo-title">Bouncing Spring Badge</h1>

            <p class="description">
                A playful CSS-only badge with a smooth spring-inspired
                interaction.
            </p>

            <div class="badge-group" aria-label="Badge examples">
                <span class="spring-badge">New</span>
                <span class="spring-badge">Featured</span>
                <span class="spring-badge">Trending</span>
            </div>

            <p class="hint">
                Hover or focus a badge to see the spring motion.
            </p>
        </section>
    </main>

</body>
</html>
