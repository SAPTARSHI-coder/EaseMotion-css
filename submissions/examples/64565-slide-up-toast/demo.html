<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Slide-Up Toast | EaseMotion CSS</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <section class="card">

            <h1>Slide-Up Toast</h1>

            <p class="subtitle">
                A minimalist tech inspired toast notification with smooth CSS animation.
            </p>

            <div class="toast">

                <div class="icon">
                    ✓
                </div>

                <div class="content">
                    <h2>Deployment Successful</h2>
                    <p>
                        Your latest update has been published successfully.
                    </p>
                </div>

            </div>

        </section>

    </main>

</body>
</html>
