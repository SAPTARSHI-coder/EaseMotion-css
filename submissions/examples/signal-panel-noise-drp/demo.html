<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Signal Panel Noise</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="shell" aria-labelledby="title">
    <section class="card">
      <p class="eyebrow">signal</p>
      <h1 id="title">Signal Panel Noise</h1>
      <p class="summary">A CSS-only signal panel with animated noise bands, a scanning beam, and a focused status core.</p>
      <div class="stage" role="img" aria-label="Animated Signal Panel Noise">
        <div class="panel">
          <div class="scan"></div>
          <div class="noise noise-a"></div>
          <div class="noise noise-b"></div>
          <div class="core"></div>
        </div>
        <article class="tile"><strong>01</strong><span>Noise band drift</span></article>
        <article class="tile"><strong>02</strong><span>Scanning beam</span></article>
        <article class="tile"><strong>03</strong><span>Status core pulse</span></article>
        <article class="tile"><strong>04</strong><span>Reduced-motion friendly</span></article>
      </div>
      <div class="tags" aria-label="Signal Panel Noise features">
        <span>Noise band drift</span>
        <span>Scanning beam</span>
        <span>Status core pulse</span>
        <span>Reduced-motion friendly</span>
      </div>
    </section>
  </main>
</body>
</html>
