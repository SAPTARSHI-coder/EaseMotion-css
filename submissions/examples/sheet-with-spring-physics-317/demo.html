<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Gesture Driven Bottom Sheet</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="demo-page">

    <div class="page-content">

      <span class="eyebrow">
        EASEMOTION
      </span>

      <h1>
        Gesture Driven
        <span>Bottom Sheet</span>
      </h1>

      <p>
        Swipe the bottom sheet upward and downward.
        Release it to experience spring-based snapping.
      </p>

      <button
        class="open-button"
        id="openSheet"
        type="button"
      >
        Open Bottom Sheet
      </button>

    </div>


    <div
      class="sheet-overlay"
      id="sheetOverlay"
      aria-hidden="true"
    ></div>


    <section
      class="bottom-sheet"
      id="bottomSheet"
      aria-label="Interactive bottom sheet"
    >

      <div
        class="sheet-handle-area"
        id="sheetHandle"
        aria-label="Drag bottom sheet"
        role="button"
        tabindex="0"
      >
        <div class="sheet-handle"></div>
      </div>


      <div class="sheet-content">

        <span class="sheet-label">
          QUICK ACTIONS
        </span>

        <h2>
          Your Bottom Sheet
        </h2>

        <p>
          Drag the sheet with your finger or mouse.
          The sheet uses velocity-aware snapping and
          spring physics for a natural interaction.
        </p>


        <div class="action-list">

          <button class="action-item" type="button">
            <span class="action-icon">✦</span>

            <span>
              <strong>Explore</strong>
              <small>Discover something new</small>
            </span>

            <span class="action-arrow">›</span>
          </button>


          <button class="action-item" type="button">
            <span class="action-icon">⌁</span>

            <span>
              <strong>Activity</strong>
              <small>View recent activity</small>
            </span>

            <span class="action-arrow">›</span>
          </button>


          <button class="action-item" type="button">
            <span class="action-icon">⚙</span>

            <span>
              <strong>Settings</strong>
              <small>Manage preferences</small>
            </span>

            <span class="action-arrow">›</span>
          </button>

        </div>

      </div>

    </section>

  </main>


  <script>

    const sheet = document.getElementById("bottomSheet");
    const handle = document.getElementById("sheetHandle");
    const overlay = document.getElementById("sheetOverlay");
    const openButton = document.getElementById("openSheet");


    let isDragging = false;

    let startY = 0;
    let currentY = 0;

    let startTime = 0;

    let sheetHeight = 0;

    let currentOffset = 0;

    let velocity = 0;


    /*
     * Sheet positions.
     *
     * 0 = fully expanded
     * 1 = partially visible
     */

    const EXPANDED = 0;
    const COLLAPSED = 0.68;


    function getSheetHeight() {

      sheetHeight = sheet.offsetHeight;

      return sheetHeight;

    }


    function getOffset(position) {

      return getSheetHeight() * position;

    }


    function setSheetPosition(position, animate = false) {

      if (animate) {

        sheet.style.transition =
          "transform 0.55s cubic-bezier(0.22, 1, 0.36, 1)";

      } else {

        sheet.style.transition = "none";

      }

      sheet.style.transform =
        `translate3d(0, ${getOffset(position)}px, 0)`;

      currentOffset = position;

    }


    function openSheet() {

      overlay.classList.add("active");

      overlay.setAttribute(
        "aria-hidden",
        "false"
      );

      setSheetPosition(
        EXPANDED,
        true
      );

    }


    function closeSheet() {

      overlay.classList.remove("active");

      overlay.setAttribute(
        "aria-hidden",
        "true"
      );

      setSheetPosition(
        COLLAPSED,
        true
      );

    }


    function pointerStart(clientY) {

      isDragging = true;

      startY = clientY;

      currentY =
        getOffset(currentOffset);

      startTime = performance.now();

      velocity = 0;

      sheet.style.transition = "none";

    }


    function pointerMove(clientY) {

      if (!isDragging) {
        return;
      }


      const deltaY =
        clientY - startY;


      let nextOffset =
        currentY + deltaY;


      const maxOffset =
        getOffset(COLLAPSED);


      /*
       * Rubber-band resistance.
       */

      if (nextOffset < 0) {

        nextOffset =
          nextOffset * 0.25;

      }


      if (nextOffset > maxOffset) {

        const excess =
          nextOffset - maxOffset;

        nextOffset =
          maxOffset + excess * 0.25;

      }


      const elapsed =
        Math.max(
          performance.now() - startTime,
          1
        );


      velocity =
        deltaY / elapsed;


      const normalized =
        nextOffset / getSheetHeight();


      currentOffset =
        Math.max(
          -0.12,
          Math.min(
            0.85,
            normalized
          )
        );


      sheet.style.transform =
        `translate3d(
          0,
          ${nextOffset}px,
          0
        )`;

    }


    function pointerEnd() {

      if (!isDragging) {
        return;
      }

      isDragging = false;


      /*
       * Negative velocity means
       * the user was moving upward.
       */

      const velocityThreshold = 0.45;


      if (
        velocity < -velocityThreshold
      ) {

        setSheetPosition(
          EXPANDED,
          true
        );

        return;

      }


      if (
        velocity > velocityThreshold
      ) {

        closeSheet();

        return;

      }


      /*
       * If there is no strong gesture,
       * snap to the closest position.
       */

      if (currentOffset < 0.34) {

        setSheetPosition(
          EXPANDED,
          true
        );

      } else {

        setSheetPosition(
          COLLAPSED,
          true
        );

      }

    }


    /* Pointer events */

    handle.addEventListener(
      "pointerdown",
      (event) => {

        handle.setPointerCapture(
          event.pointerId
        );

        pointerStart(
          event.clientY
        );

      }
    );


    handle.addEventListener(
      "pointermove",
      (event) => {

        pointerMove(
          event.clientY
        );

      }
    );


    handle.addEventListener(
      "pointerup",
      pointerEnd
    );


    handle.addEventListener(
      "pointercancel",
      pointerEnd
    );


    /*
     * Allow dragging from the sheet itself
     * on touch devices.
     */

    sheet.addEventListener(
      "pointerdown",
      (event) => {

        if (
          event.target.closest(
            "button"
          )
        ) {
          return;
        }

        pointerStart(
          event.clientY
        );

      }
    );


    sheet.addEventListener(
      "pointermove",
      (event) => {

        if (isDragging) {

          pointerMove(
            event.clientY
          );

        }

      }
    );


    sheet.addEventListener(
      "pointerup",
      pointerEnd
    );


    sheet.addEventListener(
      "pointercancel",
      pointerEnd
    );


    /*
     * Open button.
     */

    openButton.addEventListener(
      "click",
      openSheet
    );


    /*
     * Overlay closes the sheet.
     */

    overlay.addEventListener(
      "click",
      closeSheet
    );


    /*
     * Keyboard support.
     */

    document.addEventListener(
      "keydown",
      (event) => {

        if (event.key === "Escape") {

          closeSheet();

        }

      }
    );


    /*
     * Keyboard interaction with handle.
     */

    handle.addEventListener(
      "keydown",
      (event) => {

        if (
          event.key === "ArrowUp"
        ) {

          setSheetPosition(
            EXPANDED,
            true
          );

        }

        if (
          event.key === "ArrowDown"
        ) {

          closeSheet();

        }

      }
    );


    /*
     * Initial position.
     */

    window.addEventListener(
      "resize",
      () => {

        setSheetPosition(
          currentOffset,
          false
        );

      }
    );


    requestAnimationFrame(() => {

      setSheetPosition(
        COLLAPSED,
        false
      );

    });

  </script>

</body>
</html>
