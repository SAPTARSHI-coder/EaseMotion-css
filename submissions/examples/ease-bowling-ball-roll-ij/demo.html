<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-bowling-ball-roll demo</title>
</head>
<body>
<div class="bl-app">
  <div class="bl-head">
    <span class="bl-name">STRIKE LANES</span>
    <span class="bl-badge">FRAME 7</span>
  </div>
  <div class="bl-lane">
    <div class="bl-approach">
      <span class="bl-dot bl-dot-1"></span>
      <span class="bl-dot bl-dot-2"></span>
      <span class="bl-dot bl-dot-3"></span>
    </div>
    <span class="bl-ball"></span>
    <div class="bl-arrows">
      <span class="bl-arrow bl-arrow-1"></span>
      <span class="bl-arrow bl-arrow-2"></span>
      <span class="bl-arrow bl-arrow-3"></span>
    </div>
    <div class="bl-pins">
      <span class="bl-pin bl-pin-1"></span>
      <span class="bl-pin bl-pin-2"></span>
      <span class="bl-pin bl-pin-3"></span>
      <span class="bl-pin bl-pin-4"></span>
      <span class="bl-pin bl-pin-5"></span>
      <span class="bl-pin bl-pin-6"></span>
      <span class="bl-pin bl-pin-7"></span>
      <span class="bl-pin bl-pin-8"></span>
      <span class="bl-pin bl-pin-9"></span>
      <span class="bl-pin bl-pin-10"></span>
    </div>
    <span class="bl-gutter bl-gutter-1"></span>
    <span class="bl-gutter bl-gutter-2"></span>
  </div>
  <div class="bl-foot">SCORE 187</div>
</div>
</body>
</html>
