<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive SVG Map with Region Hover & Data Tooltip</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="map-container">
    <header class="map-header">
      <h1>Interactive Regional Map</h1>
      <p>Hover over any continent region to highlight and view dynamic contextual data.</p>
    </header>

    <!-- SVG Map Canvas -->
    <div class="map-wrapper">
      <svg class="interactive-map" viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg">
        <!-- Background Grid -->
        <defs>
          <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1"/>
          </pattern>
        </defs>
        <rect width="1000" height="500" fill="url(#grid)" />

        <!-- Region: North America -->
        <path class="map-region" 
              data-region="North America" 
              data-users="142,500" 
              data-status="Active Nodes: 8"
              d="M 150,100 L 320,100 L 350,220 L 250,260 L 120,180 Z" />

        <!-- Region: South America -->
        <path class="map-region" 
              data-region="South America" 
              data-users="88,200" 
              data-status="Active Nodes: 5"
              d="M 280,280 L 370,280 L 340,440 L 290,420 Z" />

        <!-- Region: Europe -->
        <path class="map-region" 
              data-region="Europe" 
              data-users="215,000" 
              data-status="Active Nodes: 12"
              d="M 460,80 L 600,80 L 620,180 L 480,190 Z" />

        <!-- Region: Africa -->
        <path class="map-region" 
              data-region="Africa" 
              data-users="64,100" 
              data-status="Active Nodes: 4"
              d="M 470,210 L 610,200 L 620,380 L 510,390 Z" />

        <!-- Region: Asia -->
        <path class="map-region" 
              data-region="Asia" 
              data-users="310,400" 
              data-status="Active Nodes: 18"
              d="M 630,70 L 880,70 L 920,240 L 650,220 Z" />

        <!-- Region: Oceania -->
        <path class="map-region" 
              data-region="Oceania" 
              data-users="42,800" 
              data-status="Active Nodes: 3"
              d="M 780,290 L 900,290 L 880,410 L 760,380 Z" />
      </svg>

      <!-- Floating Data Tooltip -->
      <div class="map-tooltip" id="mapTooltip">
        <h3 class="tooltip-title" id="tooltipTitle">Region</h3>
        <div class="tooltip-row">
          <span>Active Users:</span>
          <strong id="tooltipUsers">0</strong>
        </div>
        <div class="tooltip-row">
          <span>Status:</span>
          <strong id="tooltipStatus">Offline</strong>
        </div>
      </div>
    </div>
  </main>

  <script>
    const tooltip = document.getElementById('mapTooltip');
    const tooltipTitle = document.getElementById('tooltipTitle');
    const tooltipUsers = document.getElementById('tooltipUsers');
    const tooltipStatus = document.getElementById('tooltipStatus');
    const regions = document.querySelectorAll('.map-region');
    const mapWrapper = document.querySelector('.map-wrapper');

    regions.forEach(region => {
      region.addEventListener('mousemove', (e) => {
        const bounds = mapWrapper.getBoundingClientRect();
        const x = e.clientX - bounds.left;
        const y = e.clientY - bounds.top;

        tooltipTitle.textContent = region.getAttribute('data-region');
        tooltipUsers.textContent = region.getAttribute('data-users');
        tooltipStatus.textContent = region.getAttribute('data-status');

        tooltip.style.transform = `translate(${x + 15}px, ${y + 15}px)`;
        tooltip.classList.add('visible');
      });

      region.addEventListener('mouseleave', () => {
        tooltip.classList.remove('visible');
      });
    });
  </script>
</body>
</html>
