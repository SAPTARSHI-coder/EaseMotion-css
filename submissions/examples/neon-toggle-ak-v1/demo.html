<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neon Toggle Switch — EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <p class="label">Pure CSS Animated Neon Glow Toggle Switches</p>
  <div class="demo-row">
    <!-- Default Purple -->
    <label class="ease-neon-switch">
      <input type="checkbox" checked />
      <span class="ease-neon-slider"></span>
    </label>

    <!-- Cyan Glow -->
    <label class="ease-neon-switch ease-neon-switch--cyan">
      <input type="checkbox" checked />
      <span class="ease-neon-slider"></span>
    </label>

    <!-- Emerald Glow -->
    <label class="ease-neon-switch ease-neon-switch--emerald">
      <input type="checkbox" checked />
      <span class="ease-neon-slider"></span>
    </label>
  </div>

</body>
</html>
