<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skew-Active Accessible Badge - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="stage">
    <header class="head">
      <h1>Skew-Active Accessible Badges (<code>#54312</code>)</h1>
      <p>A cyberpunk suite of geometric parallelogram WAI-ARIA indicator labels engineered with interactive hover tilt alignment and unskewed legible typography.</p>
    </header>
    
    <section class="ease-badges-skew-active" aria-label="Cyber Badges">
      <span class="badge-sk blue-sk" role="status" aria-label="Matrix Status">
        <span class="unsk">⚡ MATRIX: 144_PRs_MERGED</span>
      </span>

      <span class="badge-sk emerald-sk" role="status" aria-label="Performance Status">
        <span class="unsk">✦ HOUDINI: 60.0_FPS</span>
      </span>

      <span class="badge-sk pink-sk" role="status" aria-label="Accessibility Status">
        <span class="unsk">● WCAG_AAA_CONTRAST</span>
      </span>
    </section>
  </div>
</body>
</html>
