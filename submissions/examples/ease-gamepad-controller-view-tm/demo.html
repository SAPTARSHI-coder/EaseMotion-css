<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gamepad Controller View | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="gpstage2">
    <div class="gpbody">
      <div class="gpdpad">
        <button class="gpdpad-btn up" type="button">&#9650;</button>
        <button class="gpdpad-btn left" type="button">&#9664;</button>
        <button class="gpdpad-btn right" type="button">&#9654;</button>
        <button class="gpdpad-btn down" type="button">&#9660;</button>
      </div>
      <div class="gpcenter">
        <span class="gplogo">PLAY</span>
        <div class="gpstick"></div>
      </div>
      <div class="gpbuttons">
        <button class="gpface-btn gpbtn-y" type="button">Y</button>
        <button class="gpface-btn gpbtn-x" type="button">X</button>
        <button class="gpface-btn gpbtn-b" type="button">B</button>
        <button class="gpface-btn gpbtn-a" type="button">A</button>
      </div>
    </div>
    <p class="gpinfo">Wireless controller</p>
  </div>
</body>
</html>
