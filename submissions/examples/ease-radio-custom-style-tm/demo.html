<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Custom Radio | EaseMotion CSS</title><link rel="stylesheet" href="style.css"></head>
<body><div class="crd-root">
<div class="crd-card">
<h2 class="crd-title">Select Plan</h2>
<label class="crd-option">
<input type="radio" name="plan" class="crd-input" value="free" checked>
<span class="crd-dot"></span>
<span class="crd-label">Free Plan — $0/month</span>
</label>
<label class="crd-option">
<input type="radio" name="plan" class="crd-input" value="pro">
<span class="crd-dot"></span>
<span class="crd-label">Pro Plan — $12/month</span>
</label>
<label class="crd-option">
<input type="radio" name="plan" class="crd-input" value="team">
<span class="crd-dot"></span>
<span class="crd-label">Team Plan — $49/month</span>
</label>
</div>
<p class="crd-sub">Pure CSS custom radio buttons with spring dot animation</p>
</div></body></html>
