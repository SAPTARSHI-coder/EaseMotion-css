<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="./style.css">
<title>Star Map Navigation Demo</title>
</head>
<body>
<main class="smn-container" role="main" aria-label="Star Map Navigation Visualizer">
  <div class="smn-card">
    <div class="smn-header">
      <span class="smn-badge">Celestial Map</span>
      <span class="smn-status">Sector Alpha</span>
    </div>
    <nav class="smn-map" aria-label="Constellation navigation">
      <div class="smn-grid-overlay" aria-hidden="true"></div>
      <div class="smn-constellation-lines" aria-hidden="true">
        <span class="smn-line smn-line-1"></span>
        <span class="smn-line smn-line-2"></span>
        <span class="smn-line smn-line-3"></span>
      </div>
      <ul class="smn-nav-list">
        <li class="smn-nav-item smn-pos-1">
          <a href="#polaris" class="smn-star-link">
            <span class="smn-star"></span>
            <span class="smn-label">Polaris</span>
          </a>
        </li>
        <li class="smn-nav-item smn-pos-2">
          <a href="#orion" class="smn-star-link">
            <span class="smn-star"></span>
            <span class="smn-label">Orion</span>
          </a>
        </li>
        <li class="smn-nav-item smn-pos-3">
          <a href="#cygnus" class="smn-star-link">
            <span class="smn-star"></span>
            <span class="smn-label">Cygnus</span>
          </a>
        </li>
        <li class="smn-nav-item smn-pos-4">
          <a href="#lyra" class="smn-star-link">
            <span class="smn-star"></span>
            <span class="smn-label">Lyra</span>
          </a>
        </li>
      </ul>
    </nav>
    <h1 class="smn-title">Star Map Navigation</h1>
    <p class="smn-description">An interactive celestial constellation navigation interface featuring twinkling stars, glowing constellation connectors, and smooth hover focus effects.</p>
  </div>
</main>
</body>
</html>
