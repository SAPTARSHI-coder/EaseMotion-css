<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Wishlist Heart Toggle</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <div class="wishlist-container">
    <!-- Screen reader text can be linked via aria-labelledby or aria-label -->
    <input type="checkbox" id="wishlist-toggle" class="heart-checkbox" aria-label="Add to wishlist" />
    
    <label for="wishlist-toggle" class="heart-label" title="Toggle Wishlist">
      <!-- Standard SVG Heart -->
      <svg class="heart-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
      </svg>
    </label>
    
    <h3 style="margin:0; color:#334155;">Limited Edition Sneakers</h3>
    <p style="margin:0; color:#64748b; font-size:0.9rem;">Tap the heart to save</p>
  </div>

</body>
</html>
