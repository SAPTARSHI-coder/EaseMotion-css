<!-- EaseMotion component: sonar-radar-sweep -->
<!DOCTYPE html>
<html lang="en" data-sonar="radar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=0.9">
<title>Ease Sonar Radar Sweep</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="radar-console">
  <header class="radar-head">
    <span class="radar-name">SONAR</span>
    <span class="radar-range">RNG 24NM</span>
  </header>
  <div class="radar-scope">
    <span class="range-ring ring-outer"></span>
    <span class="range-ring ring-mid"></span>
    <span class="range-ring ring-inner"></span>
    <span class="sweep-line"></span>
    <span class="blip blip-a"></span>
    <span class="blip blip-b"></span>
    <span class="blip blip-c"></span>
    <span class="radar-center"></span>
  </div>
  <div class="radar-readout">
    <span class="readout-label">CONTACTS</span>
    <span class="readout-value">03</span>
  </div>
  <footer class="radar-foot">
    <span class="radar-mode">ACTIVE</span>
    <span class="radar-lock">LOCK 2</span>
  </footer>
</main>
</body>
</html>
