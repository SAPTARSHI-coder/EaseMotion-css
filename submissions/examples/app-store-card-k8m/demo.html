<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="./style.css">
<title>CSS App Store Card Demo</title>
</head>
<body>
<div class="asc-card-container">
  <div class="asc-banner">
    <span class="asc-badge">FEATURED</span>
  </div>
  <div class="asc-content">
    <div class="asc-header">
      <div class="asc-icon">
        <div class="asc-icon-inner"></div>
      </div>
      <div class="asc-meta">
        <h3 class="asc-title">Apex Motion Studio</h3>
        <p class="asc-category">Graphics & Design</p>
        <div class="asc-rating">
          <div class="asc-stars" aria-label="Rating: 4.8 out of 5 stars">
            <span class="asc-star">★</span>
            <span class="asc-star">★</span>
            <span class="asc-star">★</span>
            <span class="asc-star">★</span>
            <span class="asc-star asc-star-half">★</span>
          </div>
          <span class="asc-review-count">4.8 (12.4k)</span>
        </div>
      </div>
    </div>
    <p class="asc-description">
      Create interactive keyframe animations and high-performance UI motion effects directly on your mobile device.
    </p>
    <div class="asc-action-bar">
      <button class="asc-btn-download" type="button" aria-label="Get Apex Motion Studio">
        <span class="asc-btn-text">GET</span>
        <span class="asc-btn-subtext">In-App Purchases</span>
      </button>
    </div>
  </div>
</div>
</body>
</html>
