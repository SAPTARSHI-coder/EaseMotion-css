<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Checkout Step Flow</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="checkout" aria-label="Checkout progress">

    <h1>Checkout Flow</h1>

    <div class="steps">

      <div class="step active">
        <div class="circle">1</div>
        <span>Cart</span>
      </div>

      <div class="line"></div>

      <div class="step">
        <div class="circle">2</div>
        <span>Shipping</span>
      </div>

      <div class="line"></div>

      <div class="step">
        <div class="circle">3</div>
        <span>Payment</span>
      </div>

      <div class="line"></div>

      <div class="step">
        <div class="circle">4</div>
        <span>Confirmation</span>
      </div>

    </div>


    <section class="card">
      <h2>Your Order</h2>
      <p>Complete each step to finish your purchase.</p>
    </section>

  </main>

</body>
</html>
