<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Subtle Elevate Progress Bar</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>Subtle Elevate Progress</h1>

    <div class="progress-card">
        <div class="label">
            <span>Project Completion</span>
            <span>75%</span>
        </div>

        <div
            class="progress-bar"
            role="progressbar"
            aria-valuenow="75"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-label="Project Completion Progress">
            <div class="progress-fill"></div>
        </div>
    </div>
</div>

</body>
</html>
