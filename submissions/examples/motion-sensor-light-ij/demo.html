<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-motion-sensor-light</title>
</head>
<body>
<main class="msl-card">
  <header class="msl-head">
    <h1 class="msl-title">Hall Sensor</h1>
    <span class="msl-mode">Auto</span>
  </header>
  <section class="msl-room" aria-label="sensor room">
    <span class="msl-pir">
      <span class="msl-pir-dome"></span>
    </span>
    <span class="msl-beam"></span>
    <span class="msl-lamp"></span>
    <span class="msl-shadow"></span>
  </section>
  <section class="msl-read">
    <span class="msl-badge">Motion</span>
    <strong class="msl-val">Detected</strong>
  </section>
  <footer class="msl-foot">
    <span class="msl-battery">93%</span>
    <span class="msl-range">8 m</span>
  </footer>
</main>
</body>
</html>
