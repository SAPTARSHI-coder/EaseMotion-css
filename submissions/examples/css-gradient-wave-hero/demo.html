<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CSS Gradient Wave Hero demonstration">
  <title>CSS Gradient Wave Hero</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main>
    <section class="gradient-wave-hero" aria-labelledby="hero-title">
      <div class="hero-content">
        <p class="hero-label">CSS Animation</p>

        <h1 id="hero-title">Gradient Wave Hero</h1>

        <p class="hero-description">
          A responsive hero section featuring a smoothly animated
          gradient background and flowing wave at the bottom.
        </p>

        <a href="#content" class="hero-button">
          Explore More
        </a>
      </div>

      <div class="wave" aria-hidden="true"></div>
    </section>

    <section id="content" class="content-section">
      <h2>Pure CSS Motion</h2>
      <p>
        This hero uses CSS gradients, pseudo-elements and keyframe
        animations without JavaScript.
      </p>
    </section>
  </main>

</body>
</html>
