<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="CSS-only animated QR code frame with scanning line"
  >
  <title>Animated QR Code Frame</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="page">
    <section class="qr-section" aria-labelledby="qr-title">
      <p class="eyebrow">EaseMotion CSS</p>

      <h1 id="qr-title">Animated QR Code Frame</h1>

      <div
        class="qr-frame"
        role="img"
        aria-label="QR code with an animated scanning frame"
      >
        <div class="corner corner-top-left"></div>
        <div class="corner corner-top-right"></div>
        <div class="corner corner-bottom-left"></div>
        <div class="corner corner-bottom-right"></div>

        <div class="qr-placeholder" aria-hidden="true">
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
        </div>

        <div class="scan-line" aria-hidden="true"></div>
      </div>

      <p class="instruction">
        Position the QR code inside the frame to scan.
      </p>
    </section>
  </main>
</body>
</html>
