<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>3D Glassmorphism Tilt Card | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="glt-stage">
    <div class="glt-card">
      <div class="glt-face glt-front">
        <div class="glt-header">
          <div class="glt-chip"></div>
          <span class="glt-name">Glass Card</span>
        </div>
        <div class="glt-display">4242 8888 1234 5678</div>
        <div class="glt-foot">
          <span>VALID THRU 12/29</span>
          <span>TM DEV</span>
        </div>
      </div>
      <div class="glt-face glt-back">
        <h2 class="glt-back-title">Flip Reveal</h2>
        <p class="glt-back-desc">Hover over the card to see it flip with a glassmorphism front and gradient back.</p>
        <button class="glt-back-cta" type="button">Learn More</button>
      </div>
    </div>
  </div>
</body>
</html>
