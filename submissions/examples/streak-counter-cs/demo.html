<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Streak Counter — EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section class="streak-card" aria-labelledby="streak-title">
      <div class="card-header">
        <div>
          <p class="eyebrow">Weekly habit</p>
          <h1 id="streak-title">Keep the streak alive</h1>
        </div>

        <div class="flame-badge" aria-label="5 day streak">
          <span class="flame" aria-hidden="true">🔥</span>
          <span class="streak-number" data-streak>5</span>
          <span class="streak-label">day streak</span>
        </div>
      </div>

      <div class="week" role="group" aria-label="Weekly habit tracker">
        <button class="day is-complete" type="button" aria-pressed="true" data-complete>
          <span class="day-name">Mon</span>
          <span class="day-circle" aria-hidden="true">✓</span>
          <span class="day-status">Done</span>
        </button>

        <button class="day is-complete" type="button" aria-pressed="true" data-complete>
          <span class="day-name">Tue</span>
          <span class="day-circle" aria-hidden="true">✓</span>
          <span class="day-status">Done</span>
        </button>

        <button class="day is-complete" type="button" aria-pressed="true" data-complete>
          <span class="day-name">Wed</span>
          <span class="day-circle" aria-hidden="true">✓</span>
          <span class="day-status">Done</span>
        </button>

        <button class="day is-complete" type="button" aria-pressed="true" data-complete>
          <span class="day-name">Thu</span>
          <span class="day-circle" aria-hidden="true">✓</span>
          <span class="day-status">Done</span>
        </button>

        <button class="day is-complete" type="button" aria-pressed="true" data-complete>
          <span class="day-name">Fri</span>
          <span class="day-circle" aria-hidden="true">✓</span>
          <span class="day-status">Done</span>
        </button>

        <button class="day is-today" type="button" aria-pressed="false" data-complete>
          <span class="day-name">Sat</span>
          <span class="day-circle" aria-hidden="true">+</span>
          <span class="day-status">Today</span>
        </button>

        <button class="day" type="button" aria-pressed="false" data-complete>
          <span class="day-name">Sun</span>
          <span class="day-circle" aria-hidden="true">+</span>
          <span class="day-status">Next</span>
        </button>
      </div>

      <div class="progress-row">
        <span>Weekly progress</span>
        <strong><span data-completed>5</span>/7</strong>
      </div>
      <div class="progress" aria-hidden="true">
        <span class="progress-value" data-progress></span>
      </div>

      <p class="hint">Click any day to mark it complete or incomplete.</p>
    </section>
  </main>

  <script>
    const days = [...document.querySelectorAll("[data-complete]")];
    const completed = document.querySelector("[data-completed]");
    const streak = document.querySelector("[data-streak]");
    const progress = document.querySelector("[data-progress]");
    const badge = document.querySelector(".flame-badge");

    function updateCounter() {
      const count = days.filter(day => day.classList.contains("is-complete")).length;
      completed.textContent = count;
      streak.textContent = count;
      progress.style.width = `${(count / days.length) * 100}%`;
      badge.setAttribute("aria-label", `${count} day streak`);

      days.forEach(day => {
        const done = day.classList.contains("is-complete");
        day.setAttribute("aria-pressed", String(done));
        day.querySelector(".day-circle").textContent = done ? "✓" : "+";
        day.querySelector(".day-status").textContent =
          done ? "Done" : day.classList.contains("is-today") ? "Today" : "Next";
      });
    }

    days.forEach(day => {
      day.addEventListener("click", () => {
        day.classList.toggle("is-complete");
        updateCounter();
      });
    });

    updateCounter();
  </script>
</body>
</html>
