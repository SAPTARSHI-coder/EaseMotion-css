<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-quiz-score-counter demo</title>
</head>
<body>
<div class="qsc-board">
  <div class="qsc-header">
    <b class="qsc-score">2,450</b>
    <span class="qsc-label">POINTS</span>
  </div>
  <div class="qsc-stats">
    <span class="qsc-streak">x3 STREAK</span>
    <span class="qsc-timer">00:24</span>
  </div>
  <div class="qsc-grid">
    <button class="qsc-tile">A</button>
    <button class="qsc-tile">B</button>
    <button class="qsc-tile">C</button>
    <button class="qsc-tile">D</button>
  </div>
</div>
</body>
</html>
