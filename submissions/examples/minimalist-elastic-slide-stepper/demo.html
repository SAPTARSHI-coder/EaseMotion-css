<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Elastic-Slide Stepper</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="container">

    <header class="page-header">
        <h1>Elastic-Slide Stepper</h1>
        <p>Pure HTML & CSS • Minimalist Tech Layout</p>
    </header>

    <section
        class="stepper"
        aria-label="Project Progress">

        <article class="step completed">

            <div class="step-circle">
                ✓
            </div>

            <h2>Planning</h2>

            <p>
                Requirements gathered and finalized.
            </p>

        </article>

        <article class="step completed">

            <div class="step-circle">
                ✓
            </div>

            <h2>Design</h2>

            <p>
                User interface and layouts completed.
            </p>

        </article>

        <article class="step active">

            <div class="step-circle">
                3
            </div>

            <h2>Development</h2>

            <p>
                Components are actively being implemented.
            </p>

        </article>

        <article class="step">

            <div class="step-circle">
                4
            </div>

            <h2>Deployment</h2>

            <p>
                Final testing and production release.
            </p>

        </article>

    </section>

</main>

</body>
</html>
