<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Shimmer-Sweep Stepper</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="catalog-layout">
        
        <h1 class="catalog-title">Product Configuration</h1>
        
        <!-- The Stepper Component -->
        <div class="stepper-container">
            <!-- Step 1 (Completed) -->
            <div class="step completed">
                <div class="step-indicator shimmer-active">
                    <span class="step-icon">✓</span>
                </div>
                <div class="step-label">Select Model</div>
            </div>
            
            <div class="step-connector completed-connector"></div>
            
            <!-- Step 2 (Active) -->
            <div class="step active">
                <div class="step-indicator shimmer-active">
                    <span class="step-number">2</span>
                </div>
                <div class="step-label">Customize</div>
            </div>
            
            <div class="step-connector"></div>
            
            <!-- Step 3 (Pending) -->
            <div class="step">
                <div class="step-indicator">
                    <span class="step-number">3</span>
                </div>
                <div class="step-label">Accessories</div>
            </div>
            
            <div class="step-connector"></div>
            
            <!-- Step 4 (Pending) -->
            <div class="step">
                <div class="step-indicator">
                    <span class="step-number">4</span>
                </div>
                <div class="step-label">Summary</div>
            </div>
        </div>
        
        <!-- Dummy Content Area for Context -->
        <div class="content-area">
            <h2>Step 2: Customize Your Device</h2>
            <p>Choose your preferred color, storage capacity, and memory options.</p>
            
            <div class="options-grid">
                <div class="option-card selected">Midnight Black</div>
                <div class="option-card">Starlight White</div>
                <div class="option-card">Space Gray</div>
            </div>
            
            <div class="actions">
                <button class="btn btn-secondary">Back</button>
                <button class="btn btn-primary shimmer-active">Next Step</button>
            </div>
        </div>
        
    </div>
</body>
</html>
