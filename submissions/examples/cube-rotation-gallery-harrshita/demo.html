<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Cube Rotation Gallery | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="demo-header">
    <h1>3D Cube Rotation Gallery</h1>
    <p>Interactive 3D perspective cube gallery using CSS transform-style preserve-3d.</p>
  </header>

  <main class="demo-main">
    <section class="demo-section">
      <div class="ease-cube-scene">
        <div class="ease-cube">
          <div class="ease-cube-face ease-face-front">Front</div>
          <div class="ease-cube-face ease-face-back">Back</div>
          <div class="ease-cube-face ease-face-right">Right</div>
          <div class="ease-cube-face ease-face-left">Left</div>
          <div class="ease-cube-face ease-face-top">Top</div>
          <div class="ease-cube-face ease-face-bottom">Bottom</div>
        </div>
      </div>
    </section>
  </main>
  <footer class="demo-footer"><p>EaseMotion CSS Project</p></footer>
</body>
</html>
