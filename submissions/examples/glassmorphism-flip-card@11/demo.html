<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glassmorphism Flip Card - EaseMotion CSS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card-container" tabindex="0" aria-label="Interactive flip card. Press Enter to flip.">
        <div class="card">
            <div class="card-face card-front">
                <h2>Front Face</h2>
                <p>Hover or Focus to Flip</p>
            </div>
            <div class="card-face card-back">
                <h2>Back Face</h2>
                <p>Built with pure CSS and EaseMotion!</p>
                <button class="btn">Learn More</button>
            </div>
        </div>
    </div>

</body>
</html>
