<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Entanglement Swap Protocol - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030712; color: #ffffff;">

    <div class="ease-card ease-card-glass swap-container">
        <div class="swap-header">
            <h2>Entanglement Swap</h2>
            <span class="ease-badge ease-badge-success">Protocol Active</span>
        </div>
        
        <div class="swap-screen ease-center">
            <div class="bell-state-flux flux-1"></div>
            <div class="bell-state-flux flux-2"></div>
            <div class="teleportation-channel-ring"></div>
            <div class="bell-measurement-core ease-center"></div>
        </div>

        <div class="swap-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Fidelity: 99.98%</span>
            <button class="ease-btn ease-btn-primary ease-btn-sm ease-hover-grow">Execute Swap</button>
        </div>
    </div>

</body>
</html>
