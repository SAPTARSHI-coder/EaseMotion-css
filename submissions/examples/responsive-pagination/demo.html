<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="CSS-Only Responsive Pagination with Dynamic Ellipsis">
    <title>Responsive Pagination - EaseMotion</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <div class="content-wrapper">
            <h1 class="title">Responsive Pagination</h1>
            <p class="subtitle">Resize the window below 600px to see the pure CSS dynamic ellipsis in action.</p>
            
            <nav class="ease-pagination" aria-label="Pagination Navigation">
                <ul class="pagination-list">
                    <li class="pagination-item"><a href="#" class="pagination-link nav-btn" aria-label="Previous Page"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></a></li>
                    <li class="pagination-item"><a href="#" class="pagination-link">1</a></li>
                    <li class="pagination-item"><a href="#" class="pagination-link">2</a></li>
                    <li class="pagination-item"><a href="#" class="pagination-link active" aria-current="page">3</a></li>
                    <li class="pagination-item"><a href="#" class="pagination-link">4</a></li>
                    <li class="pagination-item"><a href="#" class="pagination-link">5</a></li>
                    <li class="pagination-item"><a href="#" class="pagination-link">6</a></li>
                    <li class="pagination-item"><a href="#" class="pagination-link">7</a></li>
                    <li class="pagination-item"><a href="#" class="pagination-link">8</a></li>
                    <li class="pagination-item"><a href="#" class="pagination-link">9</a></li>
                    <li class="pagination-item"><a href="#" class="pagination-link">10</a></li>
                    <li class="pagination-item"><a href="#" class="pagination-link nav-btn" aria-label="Next Page"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></a></li>
                </ul>
            </nav>
        </div>
    </main>
</body>
</html>
