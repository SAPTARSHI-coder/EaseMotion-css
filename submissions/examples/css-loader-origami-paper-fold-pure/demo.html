<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Loader: Origami Paper Fold</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="layout-container">
        
        <header class="section-header">
            <h1 class="title">Pure CSS Loader: Origami Paper Fold</h1>
            <p class="subtitle">A 3D loader utilizing CSS border-width triangles and transform origins to simulate paper flaps folding and unfolding continuously.</p>
        </header>

        <div class="demo-area">
            
            <div class="loader-container" aria-label="Loading content, origami paper folding animation playing">
                
                <!-- 
                  [TECHNIQUE] Origami Paper Fold
                  Four CSS triangles are arranged in a square.
                  By moving the transform-origin to their outer edges and applying
                  rotateX/rotateY, we can fold them inward like the flaps of a cardboard box.
                -->
                <div class="origami-wrapper" aria-hidden="true">
                    
                    <!-- The four paper flaps -->
                    <div class="origami-flap flap-top"></div>
                    <div class="origami-flap flap-right"></div>
                    <div class="origami-flap flap-bottom"></div>
                    <div class="origami-flap flap-left"></div>
                    
                </div>
                
                <div class="loading-text">Folding...</div>
                
            </div>
            
        </div>
        
    </div>

</body>
</html>
