<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floating Pastel Dropdown</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="container">
        
        <!-- Floating Pastel Dropdown Container -->
        <div class="dropdown-wrapper">
            
            <!-- Hidden Checkbox for State -->
            <input type="checkbox" id="dropdown-toggle" class="dropdown-input">
            
            <!-- Dropdown Trigger Button -->
            <label for="dropdown-toggle" class="dropdown-btn">
                <span>Select Mood</span>
                <svg viewBox="0 0 24 24" class="chevron"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/></svg>
            </label>
            
            <!-- Floating Menu -->
            <div class="dropdown-menu">
                <ul class="dropdown-list">
                    
                    <li class="dropdown-item">
                        <input type="radio" name="mood" id="mood-happy" class="item-input">
                        <label for="mood-happy" class="item-label pastel-yellow">
                            <span class="icon">✨</span>
                            <span class="text">Joyful</span>
                        </label>
                    </li>
                    
                    <li class="dropdown-item">
                        <input type="radio" name="mood" id="mood-calm" class="item-input">
                        <label for="mood-calm" class="item-label pastel-blue">
                            <span class="icon">🌊</span>
                            <span class="text">Serene</span>
                        </label>
                    </li>
                    
                    <li class="dropdown-item">
                        <input type="radio" name="mood" id="mood-energetic" class="item-input">
                        <label for="mood-energetic" class="item-label pastel-pink">
                            <span class="icon">🌸</span>
                            <span class="text">Vibrant</span>
                        </label>
                    </li>
                    
                    <li class="dropdown-item">
                        <input type="radio" name="mood" id="mood-focused" class="item-input">
                        <label for="mood-focused" class="item-label pastel-green">
                            <span class="icon">🍃</span>
                            <span class="text">Focused</span>
                        </label>
                    </li>

                </ul>
            </div>

        </div>

    </div>

</body>
</html>
