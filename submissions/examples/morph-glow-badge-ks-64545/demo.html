<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Morph-Glow Badge | EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="showcase">
        <header class="showcase-header">
            <h1>Morph-Glow Badges</h1>
            <p>Minimalist tech aesthetics powered by pure CSS morphing and dynamic glows.</p>
        </header>

        <section class="badge-container">
            <div class="morph-badge badge-active" tabindex="0" role="button" aria-label="Active status">
                <span class="badge-text">Active</span>
            </div>

            <div class="morph-badge badge-verified" tabindex="0" role="button" aria-label="Verified status">
                <span class="badge-text">Verified</span>
            </div>

            <div class="morph-badge badge-ai" tabindex="0" role="button" aria-label="AI status">
                <span class="badge-text">AI</span>
            </div>

            <div class="morph-badge badge-os" tabindex="0" role="button" aria-label="Open Source status">
                <span class="badge-text">Open Source</span>
            </div>
        </section>
    </main>
</body>
</html>
