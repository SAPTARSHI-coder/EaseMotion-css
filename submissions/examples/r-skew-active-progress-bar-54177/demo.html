<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Skew-Active Progress Bar</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<section class="dashboard">

    <div class="card">

        <h1>Dashboard Progress</h1>
        <p>Weekly productivity overview</p>

        <div class="progress-item">

            <div class="progress-info">
                <span>Development</span>
                <span>90%</span>
            </div>

            <div class="progress-bar">
                <div class="progress-fill dev"></div>
            </div>

        </div>

        <div class="progress-item">

            <div class="progress-info">
                <span>Design</span>
                <span>75%</span>
            </div>

            <div class="progress-bar">
                <div class="progress-fill design"></div>
            </div>

        </div>

        <div class="progress-item">

            <div class="progress-info">
                <span>Testing</span>
                <span>60%</span>
            </div>

            <div class="progress-bar">
                <div class="progress-fill test"></div>
            </div>

        </div>

        <div class="progress-item">

            <div class="progress-info">
                <span>Deployment</span>
                <span>45%</span>
            </div>

            <div class="progress-bar">
                <div class="progress-fill deploy"></div>
            </div>

        </div>

    </div>

</section>

</body>
</html>
