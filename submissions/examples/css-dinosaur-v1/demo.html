<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Pixel Art Dinosaur | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <article class="dino-card" tabindex="0" aria-label="Animated Pixel Art Dinosaur Demo">
      <header class="dino-header">
        <h1 class="dino-title">CSS Pixel Dinosaur</h1>
        <p class="dino-subtitle">Pure CSS retro sprite with blinking eye mechanics & stride animation</p>
      </header>

      <div class="dino-stage" role="img" aria-label="Retro pixel dinosaur running with periodic blinking eye animation">
        <div class="dino-container">
          <div class="pixel-dino" aria-hidden="true">
            <div class="dino-head">
              <div class="dino-eye-socket">
                <div class="dino-pupil"></div>
                <div class="dino-eyelid"></div>
              </div>
            </div>
            <div class="dino-snout"></div>
            <div class="dino-spikes"></div>
            <div class="dino-torso"></div>
            <div class="dino-tail"></div>
            <div class="dino-arm"></div>
            <div class="dino-legs">
              <div class="leg leg-left"></div>
              <div class="leg leg-right"></div>
            </div>
          </div>
        </div>

        <div class="ground"></div>
        <div class="ground-dots"></div>
      </div>
    </article>
  </main>
</body>
</html>
