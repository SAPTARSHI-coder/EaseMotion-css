
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elastic Bounce Dropdown</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <div class="card">
            <span class="tag">EASEMOTION</span>

            <h1>Choose a Category</h1>

            <div class="dropdown">
                <button
                    id="dropdownButton"
                    class="dropdown-button"
                    aria-expanded="false"
                    aria-haspopup="listbox">
                    <span id="selectedText">Select an option</span>
                    <span class="arrow">⌄</span>
                </button>

                <ul
                    id="dropdownMenu"
                    class="dropdown-menu"
                    role="listbox"
                    tabindex="-1">

                    <li role="option" tabindex="-1" data-value="Frontend">
                        Frontend Development
                    </li>

                    <li role="option" tabindex="-1" data-value="Backend">
                        Backend Development
                    </li>

                    <li role="option" tabindex="-1" data-value="Design">
                        UI/UX Design
                    </li>

                    <li role="option" tabindex="-1" data-value="AI">
                        Artificial Intelligence
                    </li>
                </ul>
            </div>

            <p id="result">Choose an option from the menu.</p>
        </div>
    </main>

    <script>
        const button = document.getElementById("dropdownButton");
        const menu = document.getElementById("dropdownMenu");
        const selectedText = document.getElementById("selectedText");
        const result = document.getElementById("result");
        const options = [...menu.querySelectorAll("[role='option']")];

        let currentIndex = -1;

        function openMenu() {
            menu.classList.add("open");
            button.setAttribute("aria-expanded", "true");
        }

        function closeMenu() {
            menu.classList.remove("open");
            button.setAttribute("aria-expanded", "false");
            currentIndex = -1;
        }

        function selectOption(option) {
            selectedText.textContent = option.dataset.value;
            result.textContent = `Selected: ${option.dataset.value}`;
            closeMenu();
            button.focus();
        }

        button.addEventListener("click", () => {
            if (menu.classList.contains("open")) {
                closeMenu();
            } else {
                openMenu();
            }
        });

        options.forEach((option, index) => {
            option.addEventListener("click", () => {
                selectOption(option);
            });

            option.addEventListener("mouseenter", () => {
                currentIndex = index;
            });
        });

        button.addEventListener("keydown", (event) => {
            if (event.key === "Enter" || event.key === " ") {
                event.preventDefault();

                if (menu.classList.contains("open")) {
                    closeMenu();
                } else {
                    openMenu();
                    options[0].focus();
                    currentIndex = 0;
                }
            }

            if (event.key === "ArrowDown") {
                event.preventDefault();

                if (!menu.classList.contains("open")) {
                    openMenu();
                }

                currentIndex = (currentIndex + 1) % options.length;
                options[currentIndex].focus();
            }

            if (event.key === "ArrowUp") {
                event.preventDefault();

                if (!menu.classList.contains("open")) {
                    openMenu();
                }

                currentIndex =
                    currentIndex <= 0
                        ? options.length - 1
                        : currentIndex - 1;

                options[currentIndex].focus();
            }

            if (event.key === "Escape") {
                closeMenu();
            }
        });

        menu.addEventListener("keydown", (event) => {
            if (event.key === "ArrowDown") {
                event.preventDefault();

                currentIndex = (currentIndex + 1) % options.length;
                options[currentIndex].focus();
            }

            if (event.key === "ArrowUp") {
                event.preventDefault();

                currentIndex =
                    currentIndex <= 0
                        ? options.length - 1
                        : currentIndex - 1;

                options[currentIndex].focus();
            }

            if (event.key === "Enter" || event.key === " ") {
                event.preventDefault();

                if (currentIndex >= 0) {
                    selectOption(options[currentIndex]);
                }
            }

            if (event.key === "Escape") {
                closeMenu();
                button.focus();
            }
        });

        document.addEventListener("click", (event) => {
            if (!event.target.closest(".dropdown")) {
                closeMenu();
            }
        });
    </script>

</body>
</html>
