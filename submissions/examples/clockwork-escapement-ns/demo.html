<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clockwork Escapement — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Clockwork Escapement demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Clockwork Escapement</h1>
      <p class="lede">Anchor escapement ticking against an escape wheel</p>
    </header>

    <section class="ease-clockwork-escapement" data-demo="clockwork-escapement" aria-live="polite">
      <div class="ease-clockwork-escapement__housing">
        <div class="ease-clockwork-escapement__bezel">
          <div class="ease-clockwork-escapement__face">
            <div class="ease-clockwork-escapement__readout">
              <span class="ease-clockwork-escapement__label">Clockwork Escapement</span>
              <span class="ease-clockwork-escapement__value">LIVE</span>
            </div>
            <div class="ease-clockwork-escapement__motion" aria-hidden="true">
              <span class="ease-clockwork-escapement__a"></span>
              <span class="ease-clockwork-escapement__b"></span>
              <span class="ease-clockwork-escapement__c"></span>
              <span class="ease-clockwork-escapement__d"></span>
            </div>
            <div class="ease-clockwork-escapement__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-clockwork-escapement__controls">
          <button type="button" class="ease-clockwork-escapement__btn primary">Engage</button>
          <button type="button" class="ease-clockwork-escapement__btn">Reset</button>
          <label class="ease-clockwork-escapement__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-clockwork-escapement__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
