<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.5">
<title>Train Crossing Gate</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="crossing">
  <header class="cross-head">
    <h1 class="cross-title">CROSSING 9</h1>
    <p class="cross-bell">BELL</p>
  </header>
  <section class="cross-scene" aria-label="Railroad crossing">
    <div class="signal-mast">
      <span class="signal-lamp lamp-a"></span>
      <span class="signal-lamp lamp-b"></span>
    </div>
    <div class="gate-post">
      <span class="gate-arm"></span>
      <span class="gate-crank"></span>
    </div>
    <div class="rail-bed">
      <span class="rail rail-far"></span>
      <span class="rail rail-near"></span>
    </div>
  </section>
  <footer class="cross-foot">
    <span class="cross-zone">TRACK 2</span>
    <span class="cross-warn">LIGHTS</span>
  </footer>
</main>
</body>
</html>
