<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Animated Checkbox — EaseMotion</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="demo-container">
    <header class="demo-header">
      <h1 class="demo-title">CSS Animated Checkbox</h1>
      <p class="demo-subtitle">Pure CSS custom animated checkmark component for EaseMotion CSS</p>
    </header>

    <!-- Basic States -->
    <section class="demo-section">
      <h2 class="demo-section-title">Default & Checked States</h2>
      <div class="demo-row">
        <label class="ease-checkbox" for="cb-default">
          <input type="checkbox" id="cb-default" class="ease-checkbox-input">
          <span class="ease-checkbox-box">
            <svg class="ease-checkbox-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20 6L9 17l-5-5"></path>
            </svg>
          </span>
          <span class="ease-checkbox-label">Default Unchecked</span>
        </label>

        <label class="ease-checkbox" for="cb-checked">
          <input type="checkbox" id="cb-checked" class="ease-checkbox-input" checked>
          <span class="ease-checkbox-box">
            <svg class="ease-checkbox-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20 6L9 17l-5-5"></path>
            </svg>
          </span>
          <span class="ease-checkbox-label">Pre-checked</span>
        </label>
      </div>
    </section>

    <!-- Color Variants -->
    <section class="demo-section">
      <h2 class="demo-section-title">Color Variants</h2>
      <div class="demo-row">
        <label class="ease-checkbox ease-checkbox-primary" for="cb-primary">
          <input type="checkbox" id="cb-primary" class="ease-checkbox-input" checked>
          <span class="ease-checkbox-box">
            <svg class="ease-checkbox-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20 6L9 17l-5-5"></path>
            </svg>
          </span>
          <span class="ease-checkbox-label">Primary</span>
        </label>

        <label class="ease-checkbox ease-checkbox-success" for="cb-success">
          <input type="checkbox" id="cb-success" class="ease-checkbox-input" checked>
          <span class="ease-checkbox-box">
            <svg class="ease-checkbox-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20 6L9 17l-5-5"></path>
            </svg>
          </span>
          <span class="ease-checkbox-label">Success</span>
        </label>

        <label class="ease-checkbox ease-checkbox-danger" for="cb-danger">
          <input type="checkbox" id="cb-danger" class="ease-checkbox-input" checked>
          <span class="ease-checkbox-box">
            <svg class="ease-checkbox-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20 6L9 17l-5-5"></path>
            </svg>
          </span>
          <span class="ease-checkbox-label">Danger</span>
        </label>

        <label class="ease-checkbox ease-checkbox-warning" for="cb-warning">
          <input type="checkbox" id="cb-warning" class="ease-checkbox-input" checked>
          <span class="ease-checkbox-box">
            <svg class="ease-checkbox-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20 6L9 17l-5-5"></path>
            </svg>
          </span>
          <span class="ease-checkbox-label">Warning</span>
        </label>
      </div>
    </section>

    <!-- Size Variants -->
    <section class="demo-section">
      <h2 class="demo-section-title">Size Variants</h2>
      <div class="demo-row">
        <label class="ease-checkbox ease-checkbox-sm" for="cb-size-sm">
          <input type="checkbox" id="cb-size-sm" class="ease-checkbox-input" checked>
          <span class="ease-checkbox-box">
            <svg class="ease-checkbox-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20 6L9 17l-5-5"></path>
            </svg>
          </span>
          <span class="ease-checkbox-label">Small</span>
        </label>

        <label class="ease-checkbox" for="cb-size-md">
          <input type="checkbox" id="cb-size-md" class="ease-checkbox-input" checked>
          <span class="ease-checkbox-box">
            <svg class="ease-checkbox-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20 6L9 17l-5-5"></path>
            </svg>
          </span>
          <span class="ease-checkbox-label">Medium (Default)</span>
        </label>

        <label class="ease-checkbox ease-checkbox-lg" for="cb-size-lg">
          <input type="checkbox" id="cb-size-lg" class="ease-checkbox-input" checked>
          <span class="ease-checkbox-box">
            <svg class="ease-checkbox-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20 6L9 17l-5-5"></path>
            </svg>
          </span>
          <span class="ease-checkbox-label">Large</span>
        </label>
      </div>
    </section>

    <!-- Disabled State -->
    <section class="demo-section">
      <h2 class="demo-section-title">Disabled State</h2>
      <div class="demo-row">
        <label class="ease-checkbox" for="cb-disabled-off">
          <input type="checkbox" id="cb-disabled-off" class="ease-checkbox-input" disabled>
          <span class="ease-checkbox-box">
            <svg class="ease-checkbox-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20 6L9 17l-5-5"></path>
            </svg>
          </span>
          <span class="ease-checkbox-label">Disabled Unchecked</span>
        </label>

        <label class="ease-checkbox" for="cb-disabled-on">
          <input type="checkbox" id="cb-disabled-on" class="ease-checkbox-input" checked disabled>
          <span class="ease-checkbox-box">
            <svg class="ease-checkbox-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20 6L9 17l-5-5"></path>
            </svg>
          </span>
          <span class="ease-checkbox-label">Disabled Checked</span>
        </label>
      </div>
    </section>

    <!-- Task List Example -->
    <section class="demo-section">
      <h2 class="demo-section-title">Interactive Task List</h2>
      <div class="demo-grid">
        <label class="ease-checkbox ease-checkbox-success" for="task-1">
          <input type="checkbox" id="task-1" class="ease-checkbox-input" checked>
          <span class="ease-checkbox-box">
            <svg class="ease-checkbox-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20 6L9 17l-5-5"></path>
            </svg>
          </span>
          <span class="ease-checkbox-label">Inspect EaseMotion repository architecture</span>
        </label>

        <label class="ease-checkbox ease-checkbox-success" for="task-2">
          <input type="checkbox" id="task-2" class="ease-checkbox-input" checked>
          <span class="ease-checkbox-box">
            <svg class="ease-checkbox-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20 6L9 17l-5-5"></path>
            </svg>
          </span>
          <span class="ease-checkbox-label">Create pure CSS checkmark stroke animation</span>
        </label>

        <label class="ease-checkbox ease-checkbox-primary" for="task-3">
          <input type="checkbox" id="task-3" class="ease-checkbox-input">
          <span class="ease-checkbox-box">
            <svg class="ease-checkbox-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20 6L9 17l-5-5"></path>
            </svg>
          </span>
          <span class="ease-checkbox-label">Verify keyboard accessibility and focus styles</span>
        </label>
      </div>
    </section>
  </div>
</body>

</html>
