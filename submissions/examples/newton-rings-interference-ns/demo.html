<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Newton Rings Interference — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Newton Rings Interference demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Newton Rings Interference</h1>
      <p class="lede">Newton rings interference pattern pulsing on a lens contact</p>
    </header>

    <section class="ease-newton-rings-interference" data-demo="newton-rings-interference" aria-live="polite">
      <div class="ease-newton-rings-interference__housing">
        <div class="ease-newton-rings-interference__bezel">
          <div class="ease-newton-rings-interference__face">
            <div class="ease-newton-rings-interference__readout">
              <span class="ease-newton-rings-interference__label">Newton Rings Interference</span>
              <span class="ease-newton-rings-interference__value">LIVE</span>
            </div>
            <div class="ease-newton-rings-interference__motion" aria-hidden="true">
              <span class="ease-newton-rings-interference__a"></span>
              <span class="ease-newton-rings-interference__b"></span>
              <span class="ease-newton-rings-interference__c"></span>
              <span class="ease-newton-rings-interference__d"></span>
            </div>
            <div class="ease-newton-rings-interference__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-newton-rings-interference__controls">
          <button type="button" class="ease-newton-rings-interference__btn primary">Engage</button>
          <button type="button" class="ease-newton-rings-interference__btn">Reset</button>
          <label class="ease-newton-rings-interference__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-newton-rings-interference__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
