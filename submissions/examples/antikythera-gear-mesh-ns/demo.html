<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Antikythera Gear Mesh — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Antikythera Gear Mesh demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Antikythera Gear Mesh</h1>
      <p class="lede">Antikythera mechanism gear train mesh</p>
    </header>

    <section class="ease-antikythera-gear-mesh" data-demo="antikythera-gear-mesh" aria-live="polite">
      <div class="ease-antikythera-gear-mesh__housing">
        <div class="ease-antikythera-gear-mesh__bezel">
          <div class="ease-antikythera-gear-mesh__face">
            <div class="ease-antikythera-gear-mesh__readout">
              <span class="ease-antikythera-gear-mesh__label">Antikythera Gear Mesh</span>
              <span class="ease-antikythera-gear-mesh__value">LIVE</span>
            </div>
            <div class="ease-antikythera-gear-mesh__motion" aria-hidden="true">
              <span class="ease-antikythera-gear-mesh__a"></span>
              <span class="ease-antikythera-gear-mesh__b"></span>
              <span class="ease-antikythera-gear-mesh__c"></span>
              <span class="ease-antikythera-gear-mesh__d"></span>
            </div>
            <div class="ease-antikythera-gear-mesh__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-antikythera-gear-mesh__controls">
          <button type="button" class="ease-antikythera-gear-mesh__btn primary">Engage</button>
          <button type="button" class="ease-antikythera-gear-mesh__btn">Reset</button>
          <label class="ease-antikythera-gear-mesh__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-antikythera-gear-mesh__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
