<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aurora Glass Card | EaseMotion CSS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="scene">
        <!-- Wrapper for the rotating conic border -->
        <div class="card-wrapper">
            <div class="aurora-card">
                <!-- Animated Aurora Blobs Background -->
                <div class="aurora-bg">
                    <div class="blob blob-1"></div>
                    <div class="blob blob-2"></div>
                    <div class="blob blob-3"></div>
                </div>
                
                <!-- Glassmorphism Content -->
                <div class="glass-content">
                    <div class="profile-ring">
                        <div class="avatar"></div>
                    </div>
                    <h2 class="name">Alex Morgan</h2>
                    <p class="role">Senior UI/UX Architect</p>
                    
                    <div class="stats">
                        <div class="stat">
                            <span class="stat-num">142</span>
                            <span class="stat-label">Projects</span>
                        </div>
                        <div class="stat">
                            <span class="stat-num">12K</span>
                            <span class="stat-label">Followers</span>
                        </div>
                    </div>
                    
                    <button class="glass-btn">
                        <span>Connect</span>
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M5 12h14M12 5l7 7-7 7"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
