<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ease-kanban-drag-sap demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f4f4f5;
    }
  </style>
</head>
<body>

  <div class="kanban-sap">
    <div class="kanban-col" data-col="todo">
      <h4>To Do</h4>
      <div class="kanban-card" draggable="true">Design homepage</div>
      <div class="kanban-card" draggable="true">Write API docs</div>
    </div>
    <div class="kanban-col" data-col="progress">
      <h4>In Progress</h4>
      <div class="kanban-card" draggable="true">Build auth flow</div>
    </div>
    <div class="kanban-col" data-col="done">
      <h4>Done</h4>
      <div class="kanban-card" draggable="true">Setup repo</div>
    </div>
  </div>

  <script>
    const cards = document.querySelectorAll('.kanban-card');
    const cols = document.querySelectorAll('.kanban-col');
    let dragged = null;

    cards.forEach(card => {
      card.addEventListener('dragstart', () => {
        dragged = card;
        card.classList.add('dragging');
      });
      card.addEventListener('dragend', () => {
        card.classList.remove('dragging');
        dragged = null;
      });
    });

    cols.forEach(col => {
      col.addEventListener('dragover', (e) => {
        e.preventDefault();
        col.classList.add('drag-over');
      });
      col.addEventListener('dragleave', () => {
        col.classList.remove('drag-over');
      });
      col.addEventListener('drop', (e) => {
        e.preventDefault();
        col.classList.remove('drag-over');
        if (dragged) col.appendChild(dragged);
      });
    });
  </script>

</body>
</html>
