<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glassmorphism CSS Card</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Dynamic background to showcase the glass effect -->
    <div class="color-blob blob-1"></div>
    <div class="color-blob blob-2"></div>
    <div class="color-blob blob-3"></div>

    <div class="container">
        
        <div class="glass-card">
            
            <div class="card-header">
                <div class="card-badge">Premium</div>
                <div class="card-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"></path></svg>
                </div>
            </div>
            
            <div class="card-body">
                <h3 class="card-title">Glass UI Kit</h3>
                <p class="card-desc">Experience the depth of modern interfaces with authentic frosted glass effects, layered over dynamic backgrounds.</p>
                
                <div class="card-stats">
                    <div class="stat">
                        <span class="stat-value">50+</span>
                        <span class="stat-label">Components</span>
                    </div>
                    <div class="stat">
                        <span class="stat-value">100%</span>
                        <span class="stat-label">Responsive</span>
                    </div>
                </div>
            </div>
            
            <div class="card-footer">
                <button class="glass-btn primary-btn">Explore Kit</button>
                <button class="glass-btn icon-btn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"></path></svg>
                </button>
            </div>
            
        </div>

    </div>

</body>
</html>
