<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teleportation Gate Dispatchers QTGD - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css"></head><body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030712; color: #ffffff;">

    <div class="ease-card ease-card-glass qtgd-container">
        <div class="qtgd-header">
            <h2>Teleportation Gate Dispatcher</h2>
            <span class="ease-badge ease-badge-secondary">Fault-Tolerant Quantum</span>
        </div>
        
        <div class="qtgd-screen ease-center">
            <div class="qtgd-flux flux-qtgd-a"></div>
            <div class="qtgd-flux flux-qtgd-b"></div>
            <div class="qtgd-boundary-ring"></div>
            <div class="qtgd-core ease-center"></div>
        </div>

        <div class="qtgd-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Gate Scheduling &amp; Micro-Instruction Routing</span>
            <button class="ease-btn ease-btn-secondary ease-btn-sm ease-hover-grow">Run Gate Dispatcher</button>
        </div>
    </div></body></html>
