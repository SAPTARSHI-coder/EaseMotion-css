<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claymorphism Command Palette</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">
    <section class="palette" aria-labelledby="palette-title">

      <div class="palette-header">
        <div>
          <p class="eyebrow">QUICKSTART</p>
          <h1 id="palette-title">Command Palette</h1>
        </div>

        <kbd class="shortcut" aria-label="Control K">
          Ctrl K
        </kbd>
      </div>

      <label class="search-box" for="command-search">
        <span aria-hidden="true">⌕</span>
        <input
          id="command-search"
          type="search"
          placeholder="Search commands..."
          autocomplete="off"
        >
      </label>

      <div class="command-list" role="listbox" aria-label="Commands">

        <button class="command" type="button">
          <span class="command-icon" aria-hidden="true">+</span>
          <span>
            <strong>Create Project</strong>
            <small>Start a new project</small>
          </span>
          <kbd>⌘ N</kbd>
        </button>

        <button class="command" type="button">
          <span class="command-icon" aria-hidden="true">↗</span>
          <span>
            <strong>Open Dashboard</strong>
            <small>View project overview</small>
          </span>
          <kbd>⌘ D</kbd>
        </button>

        <button class="command" type="button">
          <span class="command-icon" aria-hidden="true">⚙</span>
          <span>
            <strong>Settings</strong>
            <small>Manage preferences</small>
          </span>
          <kbd>⌘ ,</kbd>
        </button>

        <button class="command" type="button">
          <span class="command-icon" aria-hidden="true">?</span>
          <span>
            <strong>Help Center</strong>
            <small>Find documentation</small>
          </span>
          <kbd>?</kbd>
        </button>

      </div>

      <footer class="palette-footer">
        <span>↑↓ Navigate</span>
        <span>Enter Select</span>
        <span>Esc Close</span>
      </footer>

    </section>
  </main>

</body>
</html>
