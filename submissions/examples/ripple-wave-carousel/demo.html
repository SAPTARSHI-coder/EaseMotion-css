<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ripple-Wave Carousel Checkout</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="checkout-container">
    <header class="checkout-header">
      <h1>Secure Checkout</h1>
      <p>Complete your purchase securely.</p>
    </header>

    <main class="checkout-main">
      <!-- Ripple-Wave Carousel Section -->
      <section class="carousel-section" aria-label="Featured Products">
        <div class="ripple-wave-carousel">
          <div class="carousel-track">
            <div class="carousel-item card">
              <div class="ripple-bg"></div>
              <h3>Premium Headphones</h3>
              <p>$299.00</p>
            </div>
            <div class="carousel-item card">
              <div class="ripple-bg"></div>
              <h3>Smart Watch</h3>
              <p>$199.00</p>
            </div>
            <div class="carousel-item card">
              <div class="ripple-bg"></div>
              <h3>Wireless Earbuds</h3>
              <p>$149.00</p>
            </div>
          </div>
        </div>
      </section>

      <!-- Checkout Details -->
      <section class="checkout-details">
        <div class="card shipping-card">
          <h2>Shipping Information</h2>
          <form class="checkout-form">
            <div class="input-group">
              <label for="name">Full Name</label>
              <input type="text" id="name" name="name" required placeholder="John Doe">
            </div>
            <div class="input-group">
              <label for="address">Address</label>
              <input type="text" id="address" name="address" required placeholder="123 Main St">
            </div>
          </form>
        </div>

        <div class="card payment-card">
          <h2>Payment Method</h2>
          <form class="checkout-form">
            <div class="input-group">
              <label for="card">Card Number</label>
              <input type="text" id="card" name="card" required placeholder="XXXX-XXXX-XXXX-XXXX">
            </div>
            <div class="form-row">
              <div class="input-group">
                <label for="exp">Expiry</label>
                <input type="text" id="exp" name="exp" required placeholder="MM/YY">
              </div>
              <div class="input-group">
                <label for="cvv">CVV</label>
                <input type="text" id="cvv" name="cvv" required placeholder="123">
              </div>
            </div>
          </form>
        </div>

        <div class="card coupon-card">
          <h2>Coupon Code</h2>
          <form class="checkout-form promo-form">
            <input type="text" id="coupon" name="coupon" placeholder="Enter code">
            <button type="button" class="btn-secondary">Apply</button>
          </form>
        </div>
      </section>

      <!-- Order Summary -->
      <aside class="order-summary card">
        <h2>Order Summary</h2>
        <ul class="summary-list">
          <li><span>Subtotal</span> <span>$647.00</span></li>
          <li><span>Shipping</span> <span>Free</span></li>
          <li><span>Tax</span> <span>$51.76</span></li>
        </ul>
        <div class="summary-total">
          <span>Total</span>
          <span>$698.76</span>
        </div>
        <button class="cta-button" type="submit">Place Order</button>
      </aside>
    </main>
  </div>
</body>
</html>
