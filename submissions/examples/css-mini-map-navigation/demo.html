<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Mini Map Navigation</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<header>

    <h1>CSS Mini Map Navigation</h1>

    <p>
        Scroll the page and see the mini map indicator
    </p>

</header>



<aside class="mini-map" aria-label="Page navigation map">

    <span class="indicator"></span>


    <a href="#section1" aria-label="Section one"></a>

    <a href="#section2" aria-label="Section two"></a>

    <a href="#section3" aria-label="Section three"></a>

    <a href="#section4" aria-label="Section four"></a>


</aside>



<main>


<section id="section1">

    <h2>Section One</h2>

    <p>
        Introduction content area.
    </p>

</section>



<section id="section2">

    <h2>Section Two</h2>

    <p>
        Features and information.
    </p>

</section>



<section id="section3">

    <h2>Section Three</h2>

    <p>
        More page content.
    </p>

</section>



<section id="section4">

    <h2>Section Four</h2>

    <p>
        Final section.
    </p>

</section>


</main>


</body>

</html>
