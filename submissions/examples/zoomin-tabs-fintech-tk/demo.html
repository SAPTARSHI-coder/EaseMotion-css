<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zoom-In Tabs</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="dashboard">

    <h1>Fintech Dashboard</h1>

    <p class="subtitle">
        CSS Zoom-In Tabs for financial insights.
    </p>

    <div class="tabs">

        <div class="tab active">
            Overview
        </div>

        <div class="tab">
            Investments
        </div>

        <div class="tab">
            Reports
        </div>

    </div>

    <div class="content">

        <div class="panel">

            <h2>Account Overview</h2>

            <div class="cards">

                <div class="card">

                    <span class="label">
                        Account Balance
                    </span>

                    <span class="value">
                        $128,450
                    </span>

                </div>

                <div class="card">

                    <span class="label">
                        Monthly Growth
                    </span>

                    <span class="value">
                        +18.2%
                    </span>

                </div>

                <div class="card">

                    <span class="label">
                        Active Assets
                    </span>

                    <span class="value">
                        24
                    </span>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
