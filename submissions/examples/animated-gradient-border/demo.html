<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animated Gradient Border Demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background-color: #0f0f17;
      color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .card {
      width: 300px;
      padding: 40px;
      text-align: center;
      /* Inheriting bg-color from the component's CSS variable */
      background-color: var(--em-bg-color); 
    }

    h2 {
      margin-top: 0;
      color: #00ffcc;
    }
    
    p {
      color: #a1a1aa;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <!-- Card with Animated Gradient Border -->
  <div class="card em-animated-border">
    <h2>CSS @property Magic</h2>
    <p>This glowing, spinning border is created entirely in CSS without any JavaScript, using the modern CSS @property feature to interpolate gradient angles.</p>
  </div>

</body>
</html>
