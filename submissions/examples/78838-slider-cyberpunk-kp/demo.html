<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Glassmorphism Cyberpunk Slider</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="cyber-demo" aria-labelledby="slider-title">
    <section class="cyber-panel">
      <p class="eyebrow">Cyberpunk component</p>
      <h1 id="slider-title">Glassmorphism Slider</h1>
      <p class="summary">A frosted slider with a neon rail, animated signal fill, threshold ticks, and keyboard-visible focus states.</p>
      <form class="slider-card">
        <label for="signal">Signal intensity <strong>76%</strong></label>
        <input id="signal" type="range" min="0" max="100" value="76" />
        <div class="ticks" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
        <p>Hover or focus the thumb to boost the cyber glass glow.</p>
      </form>
    </section>
  </main>
</body>
</html>
