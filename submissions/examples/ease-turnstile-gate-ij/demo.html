<!-- EaseMotion component: turnstile-gate -->
<!DOCTYPE html>
<html lang="en" data-gate="turn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.5">
<title>Ease Turnstile Gate</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="turnstile">
  <div class="gate-housing">
    <span class="gate-arm g-arm-1"></span>
    <span class="gate-arm g-arm-2"></span>
    <span class="gate-arm g-arm-3"></span>
    <span class="gate-hub"></span>
  </div>
  <div class="reader-panel">
    <span class="reader-lamp"></span>
    <span class="reader-slot"></span>
  </div>
  <div class="gate-display">
    <span class="display-text">SWIPE</span>
  </div>
  <div class="gate-base">
    <span class="gate-tag">EXIT</span>
  </div>
</main>
</body>
</html>
