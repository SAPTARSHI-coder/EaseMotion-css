<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Animated cyberpunk datepicker built with pure HTML and CSS."
  >

  <title>Cyberpunk Animated Datepicker</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="cyber-page">
    <section
      class="datepicker"
      aria-labelledby="datepicker-title"
    >
      <div class="cyber-grid" aria-hidden="true"></div>

      <div class="corner corner-top-left" aria-hidden="true"></div>
      <div class="corner corner-top-right" aria-hidden="true"></div>
      <div class="corner corner-bottom-left" aria-hidden="true"></div>
      <div class="corner corner-bottom-right" aria-hidden="true"></div>

      <header class="datepicker-header">
        <div class="status">
          <span class="status-dot" aria-hidden="true"></span>
          SYSTEM ONLINE
        </div>

        <span class="header-code" aria-hidden="true">
          DATE://01
        </span>
      </header>

      <div class="intro">
        <span class="eyebrow">
          TEMPORAL INTERFACE
        </span>

        <h1 id="datepicker-title">
          Select<span class="accent">_</span>Date
        </h1>

        <p>
          Choose a temporal coordinate to continue the operation.
        </p>
      </div>

      <form class="date-form">
        <div class="field-label">
          <span>INPUT_01</span>
          <span class="field-state">READY</span>
        </div>

        <div class="date-field">
          <input
            class="date-input"
            type="date"
            id="mission-date"
            name="mission-date"
            required
            aria-describedby="date-help"
          >

          <label
            class="date-label"
            for="mission-date"
          >
            Mission date
          </label>

          <span class="date-scan" aria-hidden="true"></span>
        </div>

        <p id="date-help" class="date-help">
          Select a valid date using the native calendar interface.
        </p>

        <div class="terminal-output" aria-live="polite">
          <span class="terminal-symbol" aria-hidden="true">
            &gt;
          </span>

          <span>
            AWAITING TEMPORAL INPUT
          </span>

          <span class="terminal-cursor" aria-hidden="true"></span>
        </div>

        <button
          class="execute-button"
          type="submit"
        >
          <span>EXECUTE</span>
          <span class="button-arrow" aria-hidden="true">›</span>
        </button>
      </form>

      <footer class="datepicker-footer">
        <span>SECURE INPUT</span>
        <span aria-hidden="true">///</span>
        <span>NO JAVASCRIPT</span>
      </footer>
    </section>
  </main>
</body>
</html>
