<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tooltip Collection</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="container">
    <h1>Tooltip Collection</h1>
    <p class="subtitle">
      Fade and directional slide tooltips using pure CSS.
    </p>

    <section class="tooltip-grid">

      <!-- Fade Tooltip -->
      <button class="tooltip fade-tooltip" data-tooltip="This is a fade tooltip">
        Fade
      </button>

      <!-- Top Tooltip -->
      <button class="tooltip tooltip-top" data-tooltip="Tooltip appears above">
        Slide Top
      </button>

      <!-- Bottom Tooltip -->
      <button class="tooltip tooltip-bottom" data-tooltip="Tooltip appears below">
        Slide Bottom
      </button>

      <!-- Left Tooltip -->
      <button class="tooltip tooltip-left" data-tooltip="Tooltip appears on the left">
        Slide Left
      </button>

      <!-- Right Tooltip -->
      <button class="tooltip tooltip-right" data-tooltip="Tooltip appears on the right">
        Slide Right
      </button>

    </section>
  </main>

</body>
</html>
