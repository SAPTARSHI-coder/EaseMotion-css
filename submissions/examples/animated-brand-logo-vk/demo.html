<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Animated Brand Logo</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="demo">

        <section class="brand-showcase" aria-labelledby="brand-heading">

            <h1 id="brand-heading">Animated Brand Logo</h1>

            <div class="brand-logo">
                <svg
                    class="brand-logo__svg"
                    viewBox="0 0 320 120"
                    role="img"
                    aria-labelledby="logo-title logo-description"
                >

                    <title id="logo-title">Nova animated brand logo</title>

                    <desc id="logo-description">
                        A geometric brand logo that draws itself and then fills
                        with color using a CSS animation.
                    </desc>

                    <!-- Logo outline -->
                    <path
                        class="brand-logo__outline"
                        d="M60 90 L95 30 L130 90 L110 90 L95 62 L80 90 Z
                           M155 90 L155 30 L175 30 L210 65 L210 30 L230 30 L230 90
                           L210 90 L175 55 L175 90 Z"
                    />

                    <!-- Filled logo -->
                    <path
                        class="brand-logo__fill"
                        d="M60 90 L95 30 L130 90 L110 90 L95 62 L80 90 Z
                           M155 90 L155 30 L175 30 L210 65 L210 30 L230 30 L230 90
                           L210 90 L175 55 L175 90 Z"
                    />

                </svg>
            </div>

            <p class="brand-caption">
                Pure CSS animated brand mark
            </p>

        </section>

    </main>

</body>
</html>
