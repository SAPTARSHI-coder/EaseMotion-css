<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bounce Pulse Carousel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>Fintech Dashboard</h1>
    <p class="subtitle">
        CSS Bounce-Pulse Carousel for financial insights.
    </p>

    <div class="carousel">

        <div class="card active">
            <h2>Revenue</h2>
            <div class="value">$82,450</div>
            <p>Monthly Earnings</p>
        </div>

        <div class="card">
            <h2>Portfolio</h2>
            <div class="value">+18.6%</div>
            <p>Growth This Month</p>
        </div>

        <div class="card">
            <h2>Expenses</h2>
            <div class="value">$29,180</div>
            <p>Operating Costs</p>
        </div>

    </div>

    <div class="dots">
        <span class="dot active"></span>
        <span class="dot"></span>
        <span class="dot"></span>
    </div>

</div>

</body>
</html>
