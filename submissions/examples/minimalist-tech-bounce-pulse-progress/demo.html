<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Bounce-Pulse Progress Bar - Minimalist Tech</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="layout-container">
        <header class="section-header">
            <h1 class="title">System Operations</h1>
            <p class="subtitle">A minimalist tech progress bar featuring a continuous bounce-pulse animation upon completion.</p>
        </header>

        <div class="dashboard-area">
            
            <div class="card">
                <div class="card-header">
                    <h2>Deploying Build #8492</h2>
                    <!-- Checkbox controls the animation state -->
                    <input type="checkbox" id="trigger-anim-1" class="trigger-checkbox">
                    <label for="trigger-anim-1" class="btn-trigger">Execute</label>
                    
                    <div class="progress-section">
                        <div class="progress-info">
                            <span class="progress-label">Pushing image to registry</span>
                            <span class="progress-value">88%</span>
                        </div>
                        
                        <div class="progress-track">
                            <div class="progress-fill bounce-pulse" style="--target-width: 88%;"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card mt-4">
                <div class="card-header">
                    <h2>Syncing Replicas</h2>
                    <input type="checkbox" id="trigger-anim-2" class="trigger-checkbox">
                    <label for="trigger-anim-2" class="btn-trigger">Execute</label>
                    
                    <div class="progress-section">
                        <div class="progress-info">
                            <span class="progress-label">Updating state across availability zones</span>
                            <span class="progress-value">100%</span>
                        </div>
                        
                        <div class="progress-track">
                            <div class="progress-fill bounce-pulse color-purple" style="--target-width: 100%;"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card mt-4">
                <div class="card-header">
                    <h2>Provisioning Sandbox</h2>
                    <input type="checkbox" id="trigger-anim-3" class="trigger-checkbox">
                    <label for="trigger-anim-3" class="btn-trigger">Execute</label>
                    
                    <div class="progress-section">
                        <div class="progress-info">
                            <span class="progress-label">Allocating dynamic subnets</span>
                            <span class="progress-value">45%</span>
                        </div>
                        
                        <div class="progress-track">
                            <div class="progress-fill bounce-pulse color-pink" style="--target-width: 45%;"></div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
