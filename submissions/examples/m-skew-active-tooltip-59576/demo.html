<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skew Active Tooltip</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<section class="hero">

<div class="content">

<span class="section-tag">
EaseMotion CSS
</span>

<h1>
Skew-Active Tooltip
</h1>

<p>
A modern SaaS tooltip featuring an animated skew transition, smooth hover
effects and glassmorphism styling built entirely with HTML and CSS.
</p>

<div class="tooltip-grid">

<div class="tooltip-card">

<button class="tooltip-trigger">

Dashboard

<span class="tooltip">
View Analytics
</span>

</button>

</div>

<div class="tooltip-card">

<button class="tooltip-trigger">

Projects

<span class="tooltip">
Manage Workspace
</span>

</button>

</div>

<div class="tooltip-card">

<button class="tooltip-trigger">

Reports

<span class="tooltip">
Generate Insights
</span>

</button>

</div>

</div>

</div>

</section>

</body>
</html>
