<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glassmorphism Shine Demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, sans-serif;
      color: white;
      
      /* A vibrant background to show off the glass blur */
      background: linear-gradient(135deg, #6c63ff, #ff6584, #fca5a5);
      background-size: 200% 200%;
      animation: gradient-shift 10s ease infinite;
    }

    @keyframes gradient-shift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .container {
      display: flex;
      gap: 40px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .card-demo {
      width: 280px;
      padding: 30px;
      text-align: center;
    }

    h2 {
      margin-top: 0;
      font-weight: 600;
    }

    p {
      color: rgba(255, 255, 255, 0.9);
      line-height: 1.5;
    }

  </style>
</head>
<body>

  <div class="container">
    <!-- Card with Hover Shine -->
    <div class="em-glass-card em-glass-shine card-demo">
      <h2>Hover Me</h2>
      <p>This glass card features a dynamic light reflection that sweeps across the surface when you hover over it.</p>
    </div>

    <!-- Card with Infinite Loop Shine -->
    <div class="em-glass-card em-glass-shine em-glass-shine-loop card-demo">
      <h2>Infinite Loop</h2>
      <p>This glass card has a slow, continuous light reflection sweeping across its surface to catch the user's eye.</p>
    </div>
  </div>

</body>
</html>
