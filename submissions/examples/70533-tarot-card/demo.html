<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Tarot Card</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <main class="scene">

    <article class="tarot-card" tabindex="0" aria-label="Mystical tarot card">

      <div class="card-border">

        <div class="symbol">
          ☾
        </div>

        <h1>The Mystic</h1>

        <div class="ornament">
          ✦ ✧ ✦
        </div>

        <p>
          Inner Wisdom
        </p>

      </div>

    </article>

  </main>

</body>

</html>
