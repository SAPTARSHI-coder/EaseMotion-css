<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gravity Well</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="space-page">

    <section class="space-card">

      <header>
        <div>
          <span class="eyebrow">SPACE-TIME FIELD</span>
          <h1>🪐 Gravity Well</h1>
          <p>Manipulate the gravitational force of a cosmic core.</p>
        </div>

        <div class="gravity-state" id="gravityState">
          STABLE
        </div>
      </header>

      <div class="space" id="space">

        <canvas id="spaceCanvas"></canvas>

        <div class="gravity-core">
          <div class="core-glow"></div>
          <div class="core-center"></div>
        </div>

        <div class="orbit orbit-one"></div>
        <div class="orbit orbit-two"></div>
        <div class="orbit orbit-three"></div>

        <div class="gravity-info">
          <span>GRAVITY</span>
          <strong id="gravityValue">50%</strong>
        </div>

      </div>

      <section class="controls">

        <div class="control-header">
          <span>🌀 Gravitational Strength</span>
          <strong id="strengthValue">50%</strong>
        </div>

        <input
          id="gravitySlider"
          type="range"
          min="0"
          max="100"
          value="50"
        >

        <div class="actions">
          <button id="pulseButton">⚡ Gravity Pulse</button>
          <button id="resetButton">↻ Reset</button>
        </div>

      </section>

      <footer>
        <span>Orbiting Bodies <strong id="particleCount">0</strong></span>
        <span>Field <strong id="fieldState">Stable</strong></span>
      </footer>

    </section>

  </main>

  <script>
    const canvas = document.getElementById("spaceCanvas");
    const ctx = canvas.getContext("2d");

    const slider = document.getElementById("gravitySlider");
    const gravityValue = document.getElementById("gravityValue");
    const strengthValue = document.getElementById("strengthValue");
    const gravityState = document.getElementById("gravityState");
    const fieldState = document.getElementById("fieldState");
    const particleCount = document.getElementById("particleCount");

    let gravity = 50;
    let pulse = 0;

    const particles = [];

    function resize() {
      canvas.width = canvas.clientWidth * devicePixelRatio;
      canvas.height = canvas.clientHeight * devicePixelRatio;

      ctx.setTransform(
        devicePixelRatio,
        0,
        0,
        devicePixelRatio,
        0,
        0
      );
    }

    function createParticle() {
      const width = canvas.clientWidth;
      const height = canvas.clientHeight;

      const angle = Math.random() * Math.PI * 2;
      const radius = 80 + Math.random() * 220;

      particles.push({
        angle,
        radius,
        speed: 0.002 + Math.random() * 0.006,
        size: 1 + Math.random() * 2,
        phase: Math.random() * Math.PI * 2,
        width,
        height
      });
    }

    for (let i = 0; i < 90; i++) {
      createParticle();
    }

    function updateState() {
      gravityValue.textContent = `${gravity}%`;
      strengthValue.textContent = `${gravity}%`;

      if (gravity <= 25) {
        gravityState.textContent = "WEAK";
        fieldState.textContent = "Weak";
      } else if (gravity <= 50) {
        gravityState.textContent = "STABLE";
        fieldState.textContent = "Stable";
      } else if (gravity <= 75) {
        gravityState.textContent = "STRONG";
        fieldState.textContent = "Strong";
      } else {
        gravityState.textContent = "EXTREME";
        fieldState.textContent = "Extreme";
      }
    }

    function animate() {
      const width = canvas.clientWidth;
      const height = canvas.clientHeight;

      ctx.clearRect(0, 0, width, height);

      const centerX = width / 2;
      const centerY = height / 2;

      pulse *= 0.95;

      particles.forEach(p => {
        const attraction = gravity / 1500;

        p.angle += p.speed * (1 + gravity / 30);

        p.radius -= attraction;

        if (p.radius < 55) {
          p.radius = 230 + Math.random() * 100;
        }

        const x =
          centerX +
          Math.cos(p.angle) * p.radius;

        const y =
          centerY +
          Math.sin(p.angle) * p.radius * 0.62;

        ctx.beginPath();
        ctx.arc(x, y, p.size, 0, Math.PI * 2);

        ctx.fillStyle = "#d9e9ff";
        ctx.shadowBlur = 8;
        ctx.shadowColor = "#8cbcff";
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(
          centerX + Math.cos(p.angle - 0.02) * p.radius,
          centerY + Math.sin(p.angle - 0.02) * p.radius * 0.62
        );

        ctx.lineTo(x, y);

        ctx.strokeStyle = "rgba(130,180,255,.08)";
        ctx.stroke();
      });

      ctx.globalAlpha = 1;
      ctx.shadowBlur = 0;

      particleCount.textContent = particles.length;

      requestAnimationFrame(animate);
    }

    slider.addEventListener("input", event => {
      gravity = Number(event.target.value);
      updateState();
    });

    document.getElementById("pulseButton")
      .addEventListener("click", () => {
        pulse = 1;

        particles.forEach(p => {
          p.radius += 30;
        });
      });

    document.getElementById("resetButton")
      .addEventListener("click", () => {
        gravity = 50;
        slider.value = 50;
        pulse = 0;

        particles.length = 0;

        for (let i = 0; i < 90; i++) {
          createParticle();
        }

        updateState();
      });

    document.addEventListener("keydown", event => {
      if (event.code === "Space") {
        event.preventDefault();

        particles.forEach(p => {
          p.radius += 30;
        });
      }

      if (event.key.toLowerCase() === "r") {
        gravity = 50;
        slider.value = 50;
        updateState();
      }
    });

    window.addEventListener("resize", resize);

    resize();
    updateState();
    animate();
  </script>

</body>
</html>
