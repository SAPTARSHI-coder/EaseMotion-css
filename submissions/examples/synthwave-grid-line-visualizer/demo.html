<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>Synthwave Grid Line Visualizer</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="visualizer">
    <section class="visualizer-header">
      <div>
        <p class="eyebrow">EASEMOTION MEDIA UI</p>
        <h1>Synthwave Grid</h1>
        <p class="subtitle">
          A pure CSS media visualizer inspired by retro-futuristic
          synthwave grid lines.
        </p>
      </div>

      <div class="status" aria-label="Visualizer status">
        <span class="status-dot"></span>
        LIVE
      </div>
    </section>

    <section class="visualizer-panel" aria-label="Synthwave media visualizer">

      <div class="grid-floor" aria-hidden="true">
        <div class="grid-line horizontal line-1"></div>
        <div class="grid-line horizontal line-2"></div>
        <div class="grid-line horizontal line-3"></div>
        <div class="grid-line horizontal line-4"></div>
        <div class="grid-line horizontal line-5"></div>

        <div class="grid-line vertical line-v1"></div>
        <div class="grid-line vertical line-v2"></div>
        <div class="grid-line vertical line-v3"></div>
        <div class="grid-line vertical line-v4"></div>
        <div class="grid-line vertical line-v5"></div>
        <div class="grid-line vertical line-v6"></div>
      </div>

      <div class="sun" aria-hidden="true"></div>

      <div class="visualizer-content">

        <div class="track-info">
          <span class="track-label">NOW PLAYING</span>

          <h2>Neon Horizon</h2>

          <p>
            Synthwave transmission / 04:28
          </p>
        </div>

        <div class="equalizer" aria-label="Animated audio visualization">
          <span class="bar bar-1"></span>
          <span class="bar bar-2"></span>
          <span class="bar bar-3"></span>
          <span class="bar bar-4"></span>
          <span class="bar bar-5"></span>
          <span class="bar bar-6"></span>
          <span class="bar bar-7"></span>
          <span class="bar bar-8"></span>
          <span class="bar bar-9"></span>
          <span class="bar bar-10"></span>
          <span class="bar bar-11"></span>
          <span class="bar bar-12"></span>
        </div>

        <div class="media-controls">
          <button type="button" aria-label="Previous track">◀</button>

          <button
            type="button"
            class="play-button"
            aria-label="Play"
          >
            ▶
          </button>

          <button type="button" aria-label="Next track">▶</button>
        </div>

        <div class="progress-area">
          <span>01:42</span>

          <div class="progress-track">
            <div class="progress-value"></div>
          </div>

          <span>04:28</span>
        </div>

      </div>
    </section>

    <p class="footer-note">
      PURE CSS · NO JAVASCRIPT · HARDWARE ACCELERATED
    </p>
  </main>
</body>
</html>
