<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Media Visualizer: Liquid Wave Fill</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="layout-container">
        
        <header class="section-header">
            <h1 class="title">Liquid Wave Fill Visualizer</h1>
            <p class="subtitle">A hardware-accelerated, JavaScript-free audio and media UI element. Features a fluid, physically simulated liquid wave animation that sloshes over the album art.</p>
        </header>

        <div class="demo-area">
            
            <div class="media-player-card">
                
                <div class="visualizer-stage">
                    
                    <!-- 
                      [TECHNIQUE] The Liquid Masking Container
                      This circular container clips the liquid elements inside it.
                    -->
                    <div class="album-art-mask">
                        
                        <div class="album-art-bg"></div>
                        
                        <!-- 
                          [TECHNIQUE] The Liquid Waves
                          These are oversized, slightly rounded squares.
                          When rotated inside the circular mask, they look like 
                          sloshing liquid physically filling the circle.
                        -->
                        <div class="liquid-wave wave-back"></div>
                        <div class="liquid-wave wave-front"></div>
                        
                    </div>
                    
                </div>
                
                <div class="track-info">
                    <h3 class="track-title">Oceanic Dreams</h3>
                    <p class="track-artist">EaseMotion Fluidity</p>
                </div>
                
                <div class="media-controls">
                    <button class="control-btn" aria-label="Previous">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="19 20 9 12 19 4 19 20"></polygon><line x1="5" y1="19" x2="5" y2="5"></line></svg>
                    </button>
                    
                    <!-- Checkbox hack for play/pause toggle -->
                    <input type="checkbox" id="play-pause" class="play-toggle" checked aria-label="Play/Pause">
                    <label for="play-pause" class="control-btn play-btn">
                        <svg class="icon-play" width="28" height="28" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                        <svg class="icon-pause" width="28" height="28" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
                    </label>
                    
                    <button class="control-btn" aria-label="Next">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 4 15 12 5 20 5 4"></polygon><line x1="19" y1="5" x2="19" y2="19"></line></svg>
                    </button>
                </div>
                
            </div>
            
        </div>
        
    </div>

</body>
</html>
