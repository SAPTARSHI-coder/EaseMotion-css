<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floating Aura Avatar Profile Ring</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="background-gradient"></div>

<section class="wrapper">

    <div class="profile-card">

        <!-- Avatar -->

        <div class="avatar-wrapper">

            <div class="ring ring-one"></div>
            <div class="ring ring-two"></div>

            <div class="avatar">

                <img
                    src="https://images.unsplash.com/photo-1500648767791-00dcc994a43?w=600"
                    alt="Profile Avatar"
                >

            </div>

        </div>

        <!-- Content -->

        <div class="content">

            <span class="badge">
                Compact Mobile-First Edition
            </span>

            <h1>
                Alex Carter
            </h1>

            <h3>
                UI / UX Designer
            </h3>

            <p>
                Passionate about creating modern digital experiences,
                beautiful interfaces and delightful interactions with
                accessibility at the core.
            </p>

            <div class="stats">

                <div class="stat">
                    <h2>128</h2>
                    <span>Projects</span>
                </div>

                <div class="stat">
                    <h2>18K</h2>
                    <span>Followers</span>
                </div>

                <div class="stat">
                    <h2>4.9</h2>
                    <span>Rating</span>
                </div>

            </div>

            <div class="buttons">

                <button class="primary-btn">
                    Follow
                </button>

                <button class="secondary-btn">
                    Message
                </button>

            </div>

        </div>

    </div>

</section>

<script src="script.js"></script>

</body>
</html>
