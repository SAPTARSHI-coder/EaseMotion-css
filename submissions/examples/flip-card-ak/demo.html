<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flip Card — EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Default purple -->
  <div class="ease-flip-card">
    <div class="ease-flip-card__inner">
      <div class="ease-flip-card__front">
        <div class="ease-flip-card__icon">🎨</div>
        <div class="ease-flip-card__title">Design</div>
        <div class="ease-flip-card__subtitle">Hover to flip</div>
      </div>
      <div class="ease-flip-card__back">
        <div class="ease-flip-card__icon">✨</div>
        <div class="ease-flip-card__title">EaseMotion</div>
        <div class="ease-flip-card__subtitle">Animation first CSS</div>
      </div>
    </div>
  </div>

  <!-- Success -->
  <div class="ease-flip-card ease-flip-card--success">
    <div class="ease-flip-card__inner">
      <div class="ease-flip-card__front">
        <div class="ease-flip-card__icon">🚀</div>
        <div class="ease-flip-card__title">Performance</div>
        <div class="ease-flip-card__subtitle">Hover to flip</div>
      </div>
      <div class="ease-flip-card__back">
        <div class="ease-flip-card__icon">⚡</div>
        <div class="ease-flip-card__title">Zero deps</div>
        <div class="ease-flip-card__subtitle">Lightweight & fast</div>
      </div>
    </div>
  </div>

  <!-- Danger -->
  <div class="ease-flip-card ease-flip-card--danger">
    <div class="ease-flip-card__inner">
      <div class="ease-flip-card__front">
        <div class="ease-flip-card__icon">🔒</div>
        <div class="ease-flip-card__title">Security</div>
        <div class="ease-flip-card__subtitle">Hover to flip</div>
      </div>
      <div class="ease-flip-card__back">
        <div class="ease-flip-card__icon">🛡️</div>
        <div class="ease-flip-card__title">Safe & Open</div>
        <div class="ease-flip-card__subtitle">MIT Licensed</div>
      </div>
    </div>
  </div>

  <!-- Vertical flip -->
  <div class="ease-flip-card ease-flip-card--vertical ease-flip-card--gold">
    <div class="ease-flip-card__inner">
      <div class="ease-flip-card__front">
        <div class="ease-flip-card__icon">📦</div>
        <div class="ease-flip-card__title">Vertical Flip</div>
        <div class="ease-flip-card__subtitle">Hover to flip</div>
      </div>
      <div class="ease-flip-card__back">
        <div class="ease-flip-card__icon">🎯</div>
        <div class="ease-flip-card__title">rotateX</div>
        <div class="ease-flip-card__subtitle">--vertical modifier</div>
      </div>
    </div>
  </div>

</body>
</html>
