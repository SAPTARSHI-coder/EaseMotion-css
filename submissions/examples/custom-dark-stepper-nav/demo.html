<!-- submissions/examples/custom-dark-stepper-nav/demo.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Custom Dark Mode Stepper Nav | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="demo-container">
    
    <!-- Semantic Stepper Navigation -->
    <nav aria-label="Progress">
      <ol class="ease-dark-stepper">
        
        <!-- Completed Step -->
        <li class="ease-step completed">
          <div class="ease-step-indicator" aria-hidden="true">&#10003;</div>
          <span class="ease-step-label">Repository Setup</span>
        </li>
        
        <!-- Completed Step -->
        <li class="ease-step completed">
          <div class="ease-step-indicator" aria-hidden="true">&#10003;</div>
          <span class="ease-step-label">Branch Created</span>
        </li>
        
        <!-- Active/Current Step -->
        <li class="ease-step active" aria-current="step">
          <div class="ease-step-indicator" aria-hidden="true">3</div>
          <span class="ease-step-label">Code Commits</span>
        </li>
        
        <!-- Pending/Future Step -->
        <li class="ease-step">
          <div class="ease-step-indicator" aria-hidden="true">4</div>
          <span class="ease-step-label">Pull Request</span>
        </li>
        
      </ol>
    </nav>

  </main>

</body>
</html>
