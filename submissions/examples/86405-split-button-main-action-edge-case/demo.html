<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Split Button - Main Action Click Handler</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <h1>Split Button</h1>
    <p class="subtitle">
      The main button performs the primary action while the secondary button
      opens additional actions.
    </p>

    <div class="split-button" id="splitButton">
      <button
        class="main-action"
        id="mainAction"
        type="button"
        aria-label="Save changes"
      >
        Save
      </button>

      <button
        class="dropdown-toggle"
        id="dropdownToggle"
        type="button"
        aria-label="More save options"
        aria-expanded="false"
        aria-controls="actionMenu"
      >
        <span aria-hidden="true">⌄</span>
      </button>

      <div class="action-menu" id="actionMenu" hidden>
        <button type="button" data-action="save-as">Save As</button>
        <button type="button" data-action="save-copy">Save a Copy</button>
        <button type="button" data-action="save-template">
          Save as Template
        </button>
      </div>
    </div>

    <p class="status" id="status" aria-live="polite">
      No action performed yet.
    </p>
  </main>

  <script>
    const mainAction = document.querySelector("#mainAction");
    const dropdownToggle = document.querySelector("#dropdownToggle");
    const actionMenu = document.querySelector("#actionMenu");
    const status = document.querySelector("#status");

    function handleMainAction() {
      status.textContent = "Primary Save action triggered.";
    }

    mainAction.addEventListener("click", handleMainAction);

    dropdownToggle.addEventListener("click", () => {
      const isOpen = dropdownToggle.getAttribute("aria-expanded") === "true";

      dropdownToggle.setAttribute("aria-expanded", String(!isOpen));
      actionMenu.hidden = isOpen;
    });

    actionMenu.addEventListener("click", (event) => {
      const action = event.target.dataset.action;

      if (action) {
        status.textContent = `${action} selected.`;
        actionMenu.hidden = true;
        dropdownToggle.setAttribute("aria-expanded", "false");
      }
    });

    document.addEventListener("click", (event) => {
      if (!event.target.closest(".split-button")) {
        actionMenu.hidden = true;
        dropdownToggle.setAttribute("aria-expanded", "false");
      }
    });
  </script>
</body>
</html>
