<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Pure CSS Rating Input Stars component with half-star precision, hover preview, and full keyboard accessibility.">
  <title>CSS Rating Input Stars — EaseMotion CSS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../easemotion.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="container">
    <header class="header">
      <span class="badge">EaseMotion Component</span>
      <h1>CSS Rating Input Stars</h1>
      <p>Pure CSS interactive rating control supporting half-star precision, hover preview, and native keyboard navigation.</p>
    </header>

    <!-- Interactive Rating Example -->
    <section class="demo-card">
      <h2>Interactive Rating Input</h2>
      <p class="demo-desc">Hover to preview half or full star values. Click or use keyboard arrow keys to select.</p>

      <fieldset class="ease-rating-fieldset">
        <legend class="ease-rating-legend">Product Rating</legend>

        <div class="ease-rating">
          <input type="radio" id="demo1-star-0-5" name="rating-demo1" value="0.5" class="ease-rating-input">
          <input type="radio" id="demo1-star-1-0" name="rating-demo1" value="1.0" class="ease-rating-input">
          <input type="radio" id="demo1-star-1-5" name="rating-demo1" value="1.5" class="ease-rating-input">
          <input type="radio" id="demo1-star-2-0" name="rating-demo1" value="2.0" class="ease-rating-input">
          <input type="radio" id="demo1-star-2-5" name="rating-demo1" value="2.5" class="ease-rating-input">
          <input type="radio" id="demo1-star-3-0" name="rating-demo1" value="3.0" class="ease-rating-input">
          <input type="radio" id="demo1-star-3-5" name="rating-demo1" value="3.5" class="ease-rating-input">
          <input type="radio" id="demo1-star-4-0" name="rating-demo1" value="4.0" class="ease-rating-input">
          <input type="radio" id="demo1-star-4-5" name="rating-demo1" value="4.5" class="ease-rating-input">
          <input type="radio" id="demo1-star-5-0" name="rating-demo1" value="5.0" class="ease-rating-input">

          <div class="ease-rating-stars" aria-hidden="true">
            <!-- Star 1 -->
            <div class="ease-star-item">
              <label for="demo1-star-0-5" class="ease-star-hit ease-star-left" title="0.5 stars"></label>
              <label for="demo1-star-1-0" class="ease-star-hit ease-star-right" title="1.0 star"></label>
              <div class="ease-star-graphic">
                <svg class="ease-star-svg ease-star-bg" viewBox="0 0 24 24">
                  <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
                </svg>
                <div class="ease-star-fill">
                  <svg class="ease-star-svg" viewBox="0 0 24 24">
                    <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
                  </svg>
                </div>
              </div>
            </div>

            <!-- Star 2 -->
            <div class="ease-star-item">
              <label for="demo1-star-1-5" class="ease-star-hit ease-star-left" title="1.5 stars"></label>
              <label for="demo1-star-2-0" class="ease-star-hit ease-star-right" title="2.0 stars"></label>
              <div class="ease-star-graphic">
                <svg class="ease-star-svg ease-star-bg" viewBox="0 0 24 24">
                  <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
                </svg>
                <div class="ease-star-fill">
                  <svg class="ease-star-svg" viewBox="0 0 24 24">
                    <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
                  </svg>
                </div>
              </div>
            </div>

            <!-- Star 3 -->
            <div class="ease-star-item">
              <label for="demo1-star-2-5" class="ease-star-hit ease-star-left" title="2.5 stars"></label>
              <label for="demo1-star-3-0" class="ease-star-hit ease-star-right" title="3.0 stars"></label>
              <div class="ease-star-graphic">
                <svg class="ease-star-svg ease-star-bg" viewBox="0 0 24 24">
                  <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
                </svg>
                <div class="ease-star-fill">
                  <svg class="ease-star-svg" viewBox="0 0 24 24">
                    <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
                  </svg>
                </div>
              </div>
            </div>

            <!-- Star 4 -->
            <div class="ease-star-item">
              <label for="demo1-star-3-5" class="ease-star-hit ease-star-left" title="3.5 stars"></label>
              <label for="demo1-star-4-0" class="ease-star-hit ease-star-right" title="4.0 stars"></label>
              <div class="ease-star-graphic">
                <svg class="ease-star-svg ease-star-bg" viewBox="0 0 24 24">
                  <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
                </svg>
                <div class="ease-star-fill">
                  <svg class="ease-star-svg" viewBox="0 0 24 24">
                    <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
                  </svg>
                </div>
              </div>
            </div>

            <!-- Star 5 -->
            <div class="ease-star-item">
              <label for="demo1-star-4-5" class="ease-star-hit ease-star-left" title="4.5 stars"></label>
              <label for="demo1-star-5-0" class="ease-star-hit ease-star-right" title="5.0 stars"></label>
              <div class="ease-star-graphic">
                <svg class="ease-star-svg ease-star-bg" viewBox="0 0 24 24">
                  <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
                </svg>
                <div class="ease-star-fill">
                  <svg class="ease-star-svg" viewBox="0 0 24 24">
                    <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
                  </svg>
                </div>
              </div>
            </div>
          </div>

          <span class="ease-rating-value" aria-live="polite"></span>
        </div>
      </fieldset>
    </section>
  </main>

  <style>
    body {
      font-family: var(--ease-font-sans, 'Inter', system-ui, sans-serif);
      background-color: #090714;
      background-image: 
        radial-gradient(at 0% 0%, rgba(244, 63, 94, 0.12) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.12) 0px, transparent 50%);
      color: #f1f5f9;
      margin: 0;
      padding: 2.5rem 1rem;
      min-height: 100vh;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 540px;
    }

    .header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .badge {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #fb7185;
      background: rgba(244, 63, 94, 0.12);
      border: 1px solid rgba(244, 63, 94, 0.25);
      border-radius: 9999px;
      padding: 0.25rem 0.75rem;
      margin-bottom: 0.75rem;
    }

    .header h1 {
      font-size: 2.25rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      margin: 0 0 0.5rem 0;
      background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header p {
      font-size: 0.9375rem;
      color: #94a3b8;
      margin: 0;
      line-height: 1.5;
    }

    .demo-card {
      background: rgba(18, 15, 36, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(244, 63, 94, 0.2);
      border-radius: 1.25rem;
      padding: 2rem;
      box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.5),
                  0 0 30px rgba(244, 63, 94, 0.08);
    }

    .demo-card h2 {
      font-size: 1.125rem;
      font-weight: 600;
      margin: 0 0 0.375rem 0;
      color: #f8fafc;
    }

    .demo-desc {
      font-size: 0.875rem;
      color: #94a3b8;
      margin: 0 0 1.5rem 0;
      line-height: 1.4;
    }

    .ease-rating-fieldset {
      background: rgba(10, 8, 20, 0.6);
      border-color: rgba(244, 63, 94, 0.25);
    }
  </style>

</body>
</html>
