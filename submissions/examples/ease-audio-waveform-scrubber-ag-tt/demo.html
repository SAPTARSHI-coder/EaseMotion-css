<!DOCTYPE html>
<html lang="en" data-theme="cyberpunk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audio Waveform Scrubber – EaseMotion CSS</title>
  <meta name="description" content="Interactive audio waveform scrubber with playback controls, loop region, timestamp tooltip, and theme switching. Built with vanilla HTML, CSS, and JavaScript.">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="aws-app" id="awsApp">

    <!-- ── Header ─────────────────────────────────────────── -->
    <header class="aws-header">
      <div class="aws-header__brand">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round"
             stroke-linejoin="round" aria-hidden="true" focusable="false">
          <path d="M9 18V5l12-2v13"/>
          <circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
        </svg>
        <span>EaseMotion Waveform</span>
      </div>

      <!-- Theme selector -->
      <div class="aws-themes" role="group" aria-label="Color theme">
        <button class="aws-theme-btn aws-theme-btn--active" data-theme="cyberpunk"
                aria-label="Cyberpunk Neon theme" aria-pressed="true">Cyberpunk</button>
        <button class="aws-theme-btn" data-theme="amber"
                aria-label="Amber Gold theme" aria-pressed="false">Amber</button>
        <button class="aws-theme-btn" data-theme="midnight"
                aria-label="Midnight Blue theme" aria-pressed="false">Midnight</button>
        <button class="aws-theme-btn" data-theme="emerald"
                aria-label="Emerald Mint theme" aria-pressed="false">Emerald</button>
      </div>
    </header>

    <!-- ── Player card ────────────────────────────────────── -->
    <section class="aws-card" aria-label="Audio player">

      <!-- Track info -->
      <div class="aws-track-info">
        <div class="aws-track-cover" aria-hidden="true" id="trackCover">♪</div>
        <div class="aws-track-meta">
          <h1 class="aws-track-name" id="trackName">Neon Cascade</h1>
          <p class="aws-track-artist" id="trackArtist">EaseMotion Beats</p>
        </div>
        <div class="aws-time-display" aria-live="polite" aria-atomic="true">
          <span id="currentTimeDisplay" aria-label="Current time">0:00</span>
          <span class="aws-time-sep" aria-hidden="true"> / </span>
          <span id="durationDisplay" aria-label="Duration">0:00</span>
        </div>
      </div>

      <!-- ── Waveform scrubber ──────────────────────────── -->
      <div class="aws-scrubber-wrap">

        <!-- Timestamp tooltip -->
        <div class="aws-tooltip" id="awsTooltip" role="tooltip" aria-hidden="true">0:00</div>

        <!-- The scrubber itself: keyboard role=slider -->
        <div class="aws-scrubber"
             id="awsScrubber"
             role="slider"
             aria-label="Playback position"
             aria-valuemin="0"
             aria-valuemax="100"
             aria-valuenow="0"
             aria-valuetext="0 seconds"
             tabindex="0">

          <!-- Loop region highlight -->
          <div class="aws-loop-region" id="awsLoopRegion"
               aria-hidden="true"
               style="--loop-start: 25%; --loop-end: 60%;">
          </div>

          <!-- Waveform bars (rendered by JS) -->
          <div class="aws-bars" id="awsBars" aria-hidden="true"></div>

          <!-- Playhead -->
          <div class="aws-playhead" id="awsPlayhead"
               aria-hidden="true"
               style="--progress: 0%;">
            <div class="aws-playhead__line"></div>
            <div class="aws-playhead__handle"></div>
          </div>

          <!-- Loop handles -->
          <div class="aws-loop-handle aws-loop-handle--start"
               id="loopHandleStart"
               role="slider"
               aria-label="Loop start"
               aria-valuemin="0"
               aria-valuemax="100"
               aria-valuenow="25"
               tabindex="0"
               style="left: 25%;">
            <span class="aws-loop-handle__label">S</span>
          </div>
          <div class="aws-loop-handle aws-loop-handle--end"
               id="loopHandleEnd"
               role="slider"
               aria-label="Loop end"
               aria-valuemin="0"
               aria-valuemax="100"
               aria-valuenow="60"
               tabindex="0"
               style="left: 60%;">
            <span class="aws-loop-handle__label">E</span>
          </div>

        </div><!-- /.aws-scrubber -->
      </div><!-- /.aws-scrubber-wrap -->

      <!-- ── Media controls ────────────────────────────── -->
      <div class="aws-controls">

        <div class="aws-controls__row aws-controls__row--main">

          <!-- Rewind -->
          <button class="aws-ctrl-btn" id="btnRewind"
                  aria-label="Rewind 5 seconds">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round"
                 stroke-linejoin="round" aria-hidden="true" focusable="false">
              <polyline points="1 4 1 10 7 10"/>
              <path d="M3.51 15a9 9 0 1 0 .49-3.5"/>
            </svg>
            <span class="aws-ctrl-label" aria-hidden="true">−5s</span>
          </button>

          <!-- Play / Pause -->
          <button class="aws-ctrl-btn aws-ctrl-btn--play" id="btnPlay"
                  aria-label="Play">
            <svg class="aws-play-icon" width="22" height="22" viewBox="0 0 24 24"
                 fill="currentColor" aria-hidden="true" focusable="false">
              <polygon points="5 3 19 12 5 21 5 3"/>
            </svg>
            <svg class="aws-pause-icon" width="22" height="22" viewBox="0 0 24 24"
                 fill="currentColor" aria-hidden="true" focusable="false">
              <rect x="6" y="4" width="4" height="16"/>
              <rect x="14" y="4" width="4" height="16"/>
            </svg>
          </button>

          <!-- Forward -->
          <button class="aws-ctrl-btn" id="btnForward"
                  aria-label="Forward 5 seconds">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round"
                 stroke-linejoin="round" aria-hidden="true" focusable="false">
              <polyline points="23 4 23 10 17 10"/>
              <path d="M20.49 15a9 9 0 1 1-.49-3.5"/>
            </svg>
            <span class="aws-ctrl-label" aria-hidden="true">+5s</span>
          </button>

        </div><!-- /.aws-controls__row--main -->

        <div class="aws-controls__row aws-controls__row--secondary">

          <!-- Volume -->
          <div class="aws-volume">
            <label for="volumeSlider" class="aws-ctrl-label">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="2" stroke-linecap="round"
                   stroke-linejoin="round" aria-hidden="true" focusable="false">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
                <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
                <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
              </svg>
              <span class="visually-hidden">Volume</span>
            </label>
            <input type="range" id="volumeSlider" class="aws-range"
                   min="0" max="1" step="0.01" value="0.8"
                   aria-label="Volume" aria-valuetext="80%">
          </div>

          <!-- Speed buttons -->
          <div class="aws-speeds" role="group" aria-label="Playback speed">
            <button class="aws-speed-btn" data-speed="0.75" aria-pressed="false"
                    aria-label="0.75× speed">0.75×</button>
            <button class="aws-speed-btn aws-speed-btn--active" data-speed="1" aria-pressed="true"
                    aria-label="1× speed — normal">1×</button>
            <button class="aws-speed-btn" data-speed="1.25" aria-pressed="false"
                    aria-label="1.25× speed">1.25×</button>
            <button class="aws-speed-btn" data-speed="1.5" aria-pressed="false"
                    aria-label="1.5× speed">1.5×</button>
          </div>

        </div><!-- /.aws-controls__row--secondary -->

      </div><!-- /.aws-controls -->

      <!-- ── Track presets ─────────────────────────────── -->
      <div class="aws-tracks" role="group" aria-label="Track presets">
        <button class="aws-track-btn aws-track-btn--active" data-track="0"
                aria-pressed="true">Neon Cascade</button>
        <button class="aws-track-btn" data-track="1"
                aria-pressed="false">Deep Space</button>
        <button class="aws-track-btn" data-track="2"
                aria-pressed="false">Golden Hour</button>
        <button class="aws-track-btn" data-track="3"
                aria-pressed="false">Mint Wave</button>
      </div>

    </section><!-- /.aws-card -->

  </main>

  <!-- Native <audio> element — hidden, used for real playback -->
  <audio id="awsAudio"
         preload="metadata"
         aria-label="Audio playback engine"></audio>

  <script src="script.js"></script>
</body>
</html>
