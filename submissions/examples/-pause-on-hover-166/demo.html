
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Infinite Seamless Logo Carousel Slider with Pause on Hover"
  >
  <title>Vibrant Gradient Logo Carousel</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="page">
    <section class="carousel-section" aria-labelledby="carousel-title">

      <div class="section-header">
        <span class="eyebrow">POWERED BY INNOVATION</span>

        <h1 id="carousel-title">
          Trusted by
          <span>creative minds.</span>
        </h1>

        <p>
          Explore the technologies and platforms powering
          the next generation of digital experiences.
        </p>
      </div>

      <div
        class="logo-carousel"
        aria-label="Technology partners"
      >
        <div class="carousel-track">

          <article class="logo-card">
            <div class="logo-icon icon-orbit">O</div>
            <span>ORBIT</span>
          </article>

          <article class="logo-card">
            <div class="logo-icon icon-nova">N</div>
            <span>NOVA</span>
          </article>

          <article class="logo-card">
            <div class="logo-icon icon-flow">F</div>
            <span>FLOW</span>
          </article>

          <article class="logo-card">
            <div class="logo-icon icon-vertex">V</div>
            <span>VERTEX</span>
          </article>

          <article class="logo-card">
            <div class="logo-icon icon-pulse">P</div>
            <span>PULSE</span>
          </article>

          <article class="logo-card">
            <div class="logo-icon icon-luma">L</div>
            <span>LUMA</span>
          </article>

          <!-- Duplicate cards for seamless looping -->

          <article class="logo-card" aria-hidden="true">
            <div class="logo-icon icon-orbit">O</div>
            <span>ORBIT</span>
          </article>

          <article class="logo-card" aria-hidden="true">
            <div class="logo-icon icon-nova">N</div>
            <span>NOVA</span>
          </article>

          <article class="logo-card" aria-hidden="true">
            <div class="logo-icon icon-flow">F</div>
            <span>FLOW</span>
          </article>

          <article class="logo-card" aria-hidden="true">
            <div class="logo-icon icon-vertex">V</div>
            <span>VERTEX</span>
          </article>

          <article class="logo-card" aria-hidden="true">
            <div class="logo-icon icon-pulse">P</div>
            <span>PULSE</span>
          </article>

          <article class="logo-card" aria-hidden="true">
            <div class="logo-icon icon-luma">L</div>
            <span>LUMA</span>
          </article>

        </div>
      </div>

      <div class="carousel-footer">
        <span class="status-dot"></span>
        <span>Hover to pause animation</span>
      </div>

    </section>
  </main>
</body>
</html>
