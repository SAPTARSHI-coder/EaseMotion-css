<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS-only Tab Bar - Dark Mode</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="tabs-demo" aria-labelledby="tabs-title">
    <section class="tabs-shell">
      <p class="eyebrow">Workspace controls</p>
      <h1 id="tabs-title">CSS-only Tab Bar</h1>
      <div class="tab-card">
        <input checked id="tab-overview" name="dash-tabs" type="radio" />
        <input id="tab-activity" name="dash-tabs" type="radio" />
        <input id="tab-billing" name="dash-tabs" type="radio" />
        <nav class="tab-list" aria-label="Dashboard tabs">
          <label for="tab-overview">Overview</label>
          <label for="tab-activity">Activity</label>
          <label for="tab-billing">Billing</label>
          <span class="tab-indicator" aria-hidden="true"></span>
        </nav>
        <section class="tab-panel overview"><strong>72%</strong><span>Workspace health is stable.</span></section>
        <section class="tab-panel activity"><strong>18</strong><span>Automations completed today.</span></section>
        <section class="tab-panel billing"><strong>$248</strong><span>Projected monthly usage.</span></section>
      </div>
    </section>
  </main>
</body>
</html>
