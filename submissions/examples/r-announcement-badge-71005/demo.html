<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="CSS announcement badge for navigation and buttons"
  >
  <title>CSS Announcement Badge</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section class="demo" aria-labelledby="title">
      <p class="eyebrow">EaseMotion CSS</p>

      <h1 id="title">Announcement Badge</h1>

      <p class="intro">
        A lightweight CSS-only badge for highlighting new announcements
        on navigation items and action buttons.
      </p>

      <div class="examples">
        <nav class="nav-card" aria-label="Example navigation">
          <a href="#home" class="nav-link active">Home</a>

          <a href="#updates" class="nav-link announcement">
            Updates
            <span class="badge" aria-label="New announcement">NEW</span>
          </a>

          <a href="#docs" class="nav-link">Documentation</a>
        </nav>

        <div class="action-card">
          <h2>Product updates</h2>
          <p>
            See the latest features, improvements, and announcements.
          </p>

          <a href="#updates" class="announcement-button">
            <span>View updates</span>
            <span class="badge badge-button" aria-label="New announcement">
              NEW
            </span>
          </a>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
