<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyberpunk Glowing Navbar</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Cyberpunk Grid Background -->
    <div class="cyber-grid"></div>

    <nav class="cyber-navbar">
        
        <div class="nav-brand">
            <span class="glitch-text" data-text="NEURAL_NET">NEURAL_NET</span>
        </div>

        <!-- Hidden checkbox for mobile menu toggle -->
        <input type="checkbox" id="mobile-toggle" class="mobile-toggle-input">
        
        <label for="mobile-toggle" class="mobile-toggle-btn">
            <span></span>
            <span></span>
            <span></span>
        </label>

        <ul class="nav-links">
            <li class="nav-item">
                <a href="#" class="nav-link active">
                    <span class="link-bracket">[</span>
                    CORE_SYS
                    <span class="link-bracket">]</span>
                </a>
            </li>
            <li class="nav-item">
                <a href="#" class="nav-link">
                    <span class="link-bracket">[</span>
                    DATABASE
                    <span class="link-bracket">]</span>
                </a>
            </li>
            <li class="nav-item">
                <a href="#" class="nav-link">
                    <span class="link-bracket">[</span>
                    UPLINK
                    <span class="link-bracket">]</span>
                </a>
            </li>
            <li class="nav-item nav-action">
                <a href="#" class="cyber-btn">
                    INITIATE
                </a>
            </li>
        </ul>

    </nav>

    <main class="dummy-content">
        <h1>SYSTEM READY</h1>
        <p>Awaiting input stream...</p>
    </main>

</body>
</html>
