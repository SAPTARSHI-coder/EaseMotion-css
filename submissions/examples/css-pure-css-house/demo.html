<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pure CSS House Illustration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header class="header">
            <h1 class="title">Pure CSS House</h1>
            <p>An illustration constructed entirely with CSS geometry and borders.</p>
        </header>

        <main class="content-area">
            
            <!-- 
              The Scene Container 
              Using role="img" for accessibility since this is essentially an SVG replacement.
            -->
            <div class="scene" role="img" aria-label="A simple illustration of a house with a chimney and smoke.">
                
                <!-- Background Elements -->
                <div class="sun"></div>
                <div class="cloud cloud-1"></div>
                <div class="cloud cloud-2"></div>

                <!-- The House Structure -->
                <div class="house">
                    
                    <!-- Smoke coming out of chimney -->
                    <div class="smoke-stack">
                        <div class="smoke puff-1"></div>
                        <div class="smoke puff-2"></div>
                        <div class="smoke puff-3"></div>
                    </div>

                    <!-- Chimney -->
                    <div class="chimney"></div>
                    
                    <!-- Roof (Created using CSS Border Triangles) -->
                    <div class="roof">
                        <div class="roof-overhang"></div>
                    </div>
                    
                    <!-- Main Body -->
                    <div class="wall">
                        <!-- Windows -->
                        <div class="window window-left">
                            <div class="window-pane"></div>
                        </div>
                        <div class="window window-right">
                            <div class="window-pane"></div>
                        </div>
                        
                        <!-- Door -->
                        <div class="door">
                            <div class="doorknob"></div>
                        </div>
                    </div>
                </div>
                
                <!-- Ground -->
                <div class="ground">
                    <div class="bush bush-left"></div>
                    <div class="bush bush-right"></div>
                </div>

            </div>
            
        </main>
    </div>

</body>
</html>
