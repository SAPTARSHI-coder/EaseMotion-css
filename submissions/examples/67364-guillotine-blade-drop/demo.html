<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ease Guillotine Blade Drop</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="guillotine-container">

    <div class="machine">

        <h1>PAPER CUT SYSTEM</h1>
        <p class="status">READY • PRECISION MODE</p>


        <div class="guillotine">

            <div class="top-frame">
                <span class="label">BLADE UNIT</span>

                <div class="blade">
                    <div class="edge"></div>
                </div>

            </div>


            <div class="paper">

                <span>DOCUMENT</span>

            </div>


            <div class="cut-line"></div>


        </div>


        <div class="controls">

            <div>
                <small>PRESSURE</small>
                <b>98%</b>
            </div>

            <div>
                <small>SPEED</small>
                <b>FAST</b>
            </div>

            <div>
                <small>STATUS</small>
                <b>ACTIVE</b>
            </div>

        </div>


    </div>

</div>


</body>
</html>
