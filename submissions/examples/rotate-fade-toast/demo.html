<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rotate Fade Toast</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">
        <h1>Rotate-Fade Toast</h1>
        <p>CSS Animated Toast Notification</p>

        <section class="toast-wrapper">

            <div class="toast">
                <div class="icon">✓</div>

                <div class="content">
                    <h2>Product Added</h2>
                    <p>Your item has been added to the catalog.</p>
                </div>

                <button class="close">×</button>
            </div>

        </section>

    </main>

</body>
</html>
