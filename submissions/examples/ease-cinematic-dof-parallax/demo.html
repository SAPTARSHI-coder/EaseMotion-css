<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cinematic Depth-of-Field Parallax Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="ease-dof-viewport">
    <div class="ease-layer ease-layer-bg"></div>
    <div class="ease-layer ease-layer-mid"></div>
    <div class="ease-layer ease-layer-fg"></div>
  </div>
  <main class="ease-scroll-content">
    <div>
      <h1 class="ease-title">Cinematic Depth</h1>
      <p style="color: #94a3b8; font-size: 1.2rem;">Scroll down to shift the focal plane</p>
    </div>
    <div><p style="color: #cbd5e1; font-size: 1.5rem; max-width: 600px; line-height: 1.6;">Notice how the foreground slowly blurs out of focus while the background mountain peaks come into razor-sharp clarity. The camera's focal point physically shifts.</p></div>
    <div><p style="color: #94a3b8; font-size: 1rem; text-transform: uppercase; letter-spacing: 2px;">Zero JavaScript Required</p></div>
  </main>
</body>
</html>
