<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />
  <meta
    name="description"
    content="CSS Album Art Grid with animated album covers"
  />
  <title>CSS Album Art Grid</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main class="page">
    <header class="header">
      <p class="eyebrow">EaseMotion CSS</p>
      <h1>Album Art Grid</h1>
      <p class="subtitle">
        A responsive mosaic of album covers with smooth CSS hover effects.
      </p>
    </header>

    <section
      class="album-grid"
      aria-label="Album collection"
    >
      <article class="album-card album-large">
        <div class="album-art art-one">
          <span class="album-number">01</span>
        </div>
        <div class="album-info">
          <h2>Midnight Echo</h2>
          <p>Neon Dreams</p>
        </div>
      </article>

      <article class="album-card">
        <div class="album-art art-two">
          <span class="album-number">02</span>
        </div>
        <div class="album-info">
          <h2>Golden Hour</h2>
          <p>Sunset Stories</p>
        </div>
      </article>

      <article class="album-card">
        <div class="album-art art-three">
          <span class="album-number">03</span>
        </div>
        <div class="album-info">
          <h2>Afterglow</h2>
          <p>City Lights</p>
        </div>
      </article>

      <article class="album-card">
        <div class="album-art art-four">
          <span class="album-number">04</span>
        </div>
        <div class="album-info">
          <h2>Blue Motion</h2>
          <p>Ocean Drive</p>
        </div>
      </article>

      <article class="album-card album-wide">
        <div class="album-art art-five">
          <span class="album-number">05</span>
        </div>
        <div class="album-info">
          <h2>Electric Soul</h2>
          <p>Future Frequencies</p>
        </div>
      </article>

      <article class="album-card">
        <div class="album-art art-six">
          <span class="album-number">06</span>
        </div>
        <div class="album-info">
          <h2>Velvet Sky</h2>
          <p>Late Night Radio</p>
        </div>
      </article>
    </section>
  </main>
</body>
</html>
