<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bookbinding Sewing Frame — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Bookbinding Sewing Frame demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Bookbinding Sewing Frame</h1>
      <p class="lede">Bookbinding sewing frame needle pass</p>
    </header>

    <section class="ease-bookbinding-sewing-frame" data-demo="bookbinding-sewing-frame" aria-live="polite">
      <div class="ease-bookbinding-sewing-frame__housing">
        <div class="ease-bookbinding-sewing-frame__bezel">
          <div class="ease-bookbinding-sewing-frame__face">
            <div class="ease-bookbinding-sewing-frame__readout">
              <span class="ease-bookbinding-sewing-frame__label">Bookbinding Sewing Frame</span>
              <span class="ease-bookbinding-sewing-frame__value">LIVE</span>
            </div>
            <div class="ease-bookbinding-sewing-frame__motion" aria-hidden="true">
              <span class="ease-bookbinding-sewing-frame__a"></span>
              <span class="ease-bookbinding-sewing-frame__b"></span>
              <span class="ease-bookbinding-sewing-frame__c"></span>
              <span class="ease-bookbinding-sewing-frame__d"></span>
            </div>
            <div class="ease-bookbinding-sewing-frame__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-bookbinding-sewing-frame__controls">
          <button type="button" class="ease-bookbinding-sewing-frame__btn primary">Engage</button>
          <button type="button" class="ease-bookbinding-sewing-frame__btn">Reset</button>
          <label class="ease-bookbinding-sewing-frame__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-bookbinding-sewing-frame__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
