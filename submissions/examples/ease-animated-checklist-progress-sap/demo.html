<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ease-animated-checklist-progress-sap demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f4f4f5;
    }
  </style>
</head>
<body>

  <div class="checklist-progress-sap" id="checklist">
    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="check-item" data-done="false">
      <span class="check-circle"><svg viewBox="0 0 24 24"><path d="M4 12l6 6L20 6"/></svg></span>
      <span class="check-label">Create account</span>
    </div>
    <div class="check-item" data-done="false">
      <span class="check-circle"><svg viewBox="0 0 24 24"><path d="M4 12l6 6L20 6"/></svg></span>
      <span class="check-label">Verify email</span>
    </div>
    <div class="check-item" data-done="false">
      <span class="check-circle"><svg viewBox="0 0 24 24"><path d="M4 12l6 6L20 6"/></svg></span>
      <span class="check-label">Complete profile</span>
    </div>
    <div class="check-item" data-done="false">
      <span class="check-circle"><svg viewBox="0 0 24 24"><path d="M4 12l6 6L20 6"/></svg></span>
      <span class="check-label">Add payment method</span>
    </div>
  </div>

  <script>
    const items = document.querySelectorAll('.check-item');
    const fill = document.getElementById('progressFill');

    function updateProgress() {
      const done = document.querySelectorAll('.check-item.done').length;
      fill.style.width = (done / items.length * 100) + '%';
    }

    items.forEach(item => {
      item.addEventListener('click', () => {
        item.classList.toggle('done');
        updateProgress();
      });
    });
  </script>

</body>
</html>
