<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Shimmer-Sweep Dropdown — SaaS Showcase</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="ease-container">
    <p class="ease-eyebrow">Billing & Plans</p>
    <h1 class="ease-heading">Subscription Tier</h1>
    <p class="ease-subtitle">Select an enterprise plan with a sleek, metallic shimmer sweep highlight.</p>

    <div class="ease-dropdown">
      <input type="checkbox" id="ease-saas-shimmer-toggle" class="ease-dropdown-input" />
      <label for="ease-saas-shimmer-toggle" class="ease-dropdown-trigger">
        <span class="ease-dropdown-label">Pro Scale — $49/mo</span>
        <span class="ease-dropdown-arrow">▾</span>
      </label>
      <div class="ease-dropdown-menu">
        <button class="ease-dropdown-item">
          <div class="ease-item-info">
            <span class="ease-item-title">Starter Tier</span>
            <span class="ease-item-sub">For small teams up to 5</span>
          </div>
          <span class="ease-price-tag">$19/mo</span>
        </button>
        <button class="ease-dropdown-item active">
          <div class="ease-item-info">
            <span class="ease-item-title">Pro Scale</span>
            <span class="ease-item-sub">Advanced analytics & API access</span>
          </div>
          <span class="ease-price-tag">$49/mo</span>
        </button>
        <button class="ease-dropdown-item">
          <div class="ease-item-info">
            <span class="ease-item-title">Enterprise Cloud</span>
            <span class="ease-item-sub">Dedicated support & custom SLA</span>
          </div>
          <span class="ease-price-tag">Custom</span>
        </button>
      </div>
    </div>
  </main>
</body>
</html>
