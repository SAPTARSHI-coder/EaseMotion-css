<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notification Alert Badge</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="demo">
    <section class="notification-card" aria-label="Notification preview">

      <div class="notification-icon" aria-hidden="true">
        <svg
          viewBox="0 0 24 24"
          width="32"
          height="32"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"></path>
          <path d="M10 21h4"></path>
        </svg>
      </div>

      <div class="notification-content">
        <span class="notification-label">Notifications</span>
        <span class="notification-status">You have new alerts</span>
      </div>

      <button
        class="notification-badge"
        type="button"
        aria-label="7 unread notifications"
      >
        <span aria-hidden="true">7</span>
      </button>

    </section>
  </main>

</body>
</html>
