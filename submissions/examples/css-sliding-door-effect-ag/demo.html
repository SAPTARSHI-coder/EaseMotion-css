<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Sliding Door Effect</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <main class="slider-wrapper" aria-label="Before and After Image Comparison">
    
    <div class="slider-aspect">
      
      <!-- The Background / "Before" Image -->
      <!-- Using placeholder images for demonstration -->
      <img class="img-before" src="https://images.unsplash.com/photo-1555685812-4b943f1cb0eb?ixlib=rb-4.0.3&auto=format&fit=crop&w=1600&q=80" alt="Black and white sketch" />
      <span class="slider-label label-before">Before</span>

      <!-- The Resizable Foreground / "After" Image Container -->
      <div class="resize-container" aria-label="Slider handle">
        <!-- The after image uses CSS Container Queries (100cqw) to remain full width while being clipped -->
        <img class="img-after" src="https://images.unsplash.com/photo-1620121692029-d088224ddc74?ixlib=rb-4.0.3&auto=format&fit=crop&w=1600&q=80" alt="Full color rendered image" />
        <span class="slider-label label-after">After</span>
        
        <!-- Visual dragging indicator for the bottom-right native resize handle -->
        <div class="drag-indicator">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 9l4-4 4 4m0 6l-4 4-4-4"></path></svg>
        </div>
      </div>

    </div>
    
    <p class="slider-instructions">Drag the bottom-right corner of the image to compare.</p>
    
  </main>

</body>
</html>
