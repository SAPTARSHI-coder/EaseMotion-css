<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Morph Glow Carousel</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<section class="carousel-section">

<h1>Featured Checkout Deals</h1>

<p class="subtitle">
Morph-Glow Carousel built using pure HTML & CSS.
</p>

<div class="carousel">

<div class="card active">

<div class="badge">Best Seller</div>

<div class="icon">📱</div>

<h2>Smartphone Pro</h2>

<p>
Powerful performance with secure checkout.
</p>

<span class="price">$699</span>

<button>Buy Now</button>

</div>

<div class="card">

<div class="badge">New</div>

<div class="icon">⌚</div>

<h2>Smart Watch</h2>

<p>
Track fitness and receive instant updates.
</p>

<span class="price">$249</span>

<button>Buy Now</button>

</div>

<div class="card">

<div class="badge">Trending</div>

<div class="icon">🎧</div>

<h2>Headphones</h2>

<p>
Immersive sound with premium comfort.
</p>

<span class="price">$149</span>

<button>Buy Now</button>

</div>

</div>

<div class="dots">

<span class="dot active"></span>

<span class="dot"></span>

<span class="dot"></span>

</div>

</section>

</body>
</html>
