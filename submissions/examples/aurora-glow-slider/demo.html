<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aurora Glow Slider</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="slider-container">

    <h1 class="title">Aurora Glow Slider</h1>

    <div class="slider">

        <input type="radio" name="slide" id="slide1" checked>
        <input type="radio" name="slide" id="slide2">
        <input type="radio" name="slide" id="slide3">

        <div class="slides">

            <div class="slide s1">
                <h2>Explore Aurora</h2>
                <p>Beautiful glowing gradients inspired by the northern lights.</p>
            </div>

            <div class="slide s2">
                <h2>Pure CSS</h2>
                <p>No JavaScript required. Smooth transitions powered by CSS.</p>
            </div>

            <div class="slide s3">
                <h2>Responsive Design</h2>
                <p>Works seamlessly across desktop, tablet, and mobile screens.</p>
            </div>

        </div>

        <div class="navigation" aria-label="Slider Navigation">
            <label for="slide1"></label>
            <label for="slide2"></label>
            <label for="slide3"></label>
        </div>

    </div>

</div>

</body>
</html>
