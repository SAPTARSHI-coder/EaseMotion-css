<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <meta
    name="description"
    content="Floating file dropzone with neumorphism styling built with pure CSS."
  />

  <title>Neumorphic File Dropzone</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <main class="page">

    <section
      class="dropzone-section"
      aria-labelledby="dropzone-title"
    >

      <div class="section-heading">
        <span class="eyebrow">EaseMotion CSS</span>

        <h1 id="dropzone-title">
          Upload your files
        </h1>

        <p>
          A floating, responsive file dropzone with soft
          neumorphic depth and smooth CSS interactions.
        </p>
      </div>

      <div class="dropzone-wrapper">

        <div class="dropzone-shadow" aria-hidden="true"></div>

        <div class="dropzone">

          <div class="dropzone-icon" aria-hidden="true">
            <svg
              viewBox="0 0 64 64"
              role="img"
              aria-hidden="true"
            >
              <path
                d="M32 42V12"
              />
              <path
                d="M20 24l12-12 12 12"
              />
              <path
                d="M13 42v7a5 5 0 005 5h28a5 5 0 005-5v-7"
              />
            </svg>
          </div>

          <h2>
            Drop your files here
          </h2>

          <p class="dropzone-text">
            or choose files from your device
          </p>

          <label
            class="browse-button"
            for="file-upload"
          >
            Browse Files
          </label>

          <input
            id="file-upload"
            class="file-input"
            type="file"
            aria-describedby="file-help"
          />

          <p
            id="file-help"
            class="file-help"
          >
            PNG, JPG, PDF or ZIP · Maximum 10 MB
          </p>

          <div class="dropzone-status">

            <span
              class="status-dot"
              aria-hidden="true"
            ></span>

            <span>
              Secure and ready
            </span>

          </div>

        </div>

        <div
          class="floating-chip floating-chip-top"
          aria-hidden="true"
        >
          <span class="chip-icon">✦</span>
          Smooth upload
        </div>

        <div
          class="floating-chip floating-chip-bottom"
          aria-hidden="true"
        >
          <span class="chip-icon">✓</span>
          CSS only
        </div>

      </div>

    </section>

  </main>

</body>
</html>
