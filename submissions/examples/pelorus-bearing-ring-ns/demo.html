<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pelorus Bearing Ring — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Pelorus Bearing Ring demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Pelorus Bearing Ring</h1>
      <p class="lede">Pelorus bearing ring rotating to a relative bearing</p>
    </header>

    <section class="ease-pelorus-bearing-ring" data-demo="pelorus-bearing-ring" aria-live="polite">
      <div class="ease-pelorus-bearing-ring__housing">
        <div class="ease-pelorus-bearing-ring__bezel">
          <div class="ease-pelorus-bearing-ring__face">
            <div class="ease-pelorus-bearing-ring__readout">
              <span class="ease-pelorus-bearing-ring__label">Pelorus Bearing Ring</span>
              <span class="ease-pelorus-bearing-ring__value">LIVE</span>
            </div>
            <div class="ease-pelorus-bearing-ring__motion" aria-hidden="true">
              <span class="ease-pelorus-bearing-ring__a"></span>
              <span class="ease-pelorus-bearing-ring__b"></span>
              <span class="ease-pelorus-bearing-ring__c"></span>
              <span class="ease-pelorus-bearing-ring__d"></span>
            </div>
            <div class="ease-pelorus-bearing-ring__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-pelorus-bearing-ring__controls">
          <button type="button" class="ease-pelorus-bearing-ring__btn primary">Engage</button>
          <button type="button" class="ease-pelorus-bearing-ring__btn">Reset</button>
          <label class="ease-pelorus-bearing-ring__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-pelorus-bearing-ring__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
