<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kinetic Text Marquee</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="kinetic-container">
        <div class="kinetic-text">
            <span style="animation-delay: 0.1s">K</span>
            <span style="animation-delay: 0.2s">I</span>
            <span style="animation-delay: 0.3s">N</span>
            <span style="animation-delay: 0.4s">E</span>
            <span style="animation-delay: 0.5s">T</span>
            <span style="animation-delay: 0.6s">I</span>
            <span style="animation-delay: 0.7s">C</span>
            <span style="animation-delay: 0.8s">&nbsp;</span>
            <span style="animation-delay: 0.9s">W</span>
            <span style="animation-delay: 1.0s">A</span>
            <span style="animation-delay: 1.1s">V</span>
            <span style="animation-delay: 1.2s">E</span>
        </div>
    </div>
</body>
</html>
