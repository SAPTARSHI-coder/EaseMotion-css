<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CSS Calendar Heat Grid</title>

<link rel="stylesheet" href="style.css">

</head>


<body>

<main class="container">

<h1>Calendar Heat Grid</h1>

<p>
Activity tracking heatmap built with pure CSS
</p>


<section class="calendar" aria-label="Monthly activity heat grid">

<div class="day title">Mon</div>
<div class="day title">Tue</div>
<div class="day title">Wed</div>
<div class="day title">Thu</div>
<div class="day title">Fri</div>
<div class="day title">Sat</div>
<div class="day title">Sun</div>


<div class="cell level-1"></div>
<div class="cell level-2"></div>
<div class="cell level-3"></div>
<div class="cell level-4"></div>
<div class="cell level-1"></div>
<div class="cell level-0"></div>
<div class="cell level-2"></div>


<div class="cell level-3"></div>
<div class="cell level-4"></div>
<div class="cell level-2"></div>
<div class="cell level-1"></div>
<div class="cell level-4"></div>
<div class="cell level-3"></div>
<div class="cell level-0"></div>


<div class="cell level-2"></div>
<div class="cell level-1"></div>
<div class="cell level-3"></div>
<div class="cell level-4"></div>
<div class="cell level-2"></div>
<div class="cell level-1"></div>
<div class="cell level-3"></div>


<div class="cell level-4"></div>
<div class="cell level-2"></div>
<div class="cell level-0"></div>
<div class="cell level-3"></div>
<div class="cell level-1"></div>
<div class="cell level-4"></div>
<div class="cell level-2"></div>


</section>


<div class="legend">

<span>Less</span>

<i class="l0"></i>
<i class="l1"></i>
<i class="l2"></i>
<i class="l3"></i>
<i class="l4"></i>

<span>More</span>

</div>


</main>

</body>

</html>
