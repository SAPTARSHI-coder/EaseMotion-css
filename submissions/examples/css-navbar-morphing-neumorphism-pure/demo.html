<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Morphing Neumorphism Navbar</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <nav class="neu-navbar">
        
        <div class="nav-brand">
            <div class="brand-icon">
                <svg viewBox="0 0 24 24"><path d="M12 2L2 22h20L12 2zm0 3.99L17.53 19H6.47L12 5.99z"/></svg>
            </div>
            <span>NeuMorph</span>
        </div>

        <ul class="nav-links">
            <li class="nav-item">
                <a href="#" class="nav-link active">
                    <span class="link-text">Home</span>
                </a>
            </li>
            <li class="nav-item">
                <a href="#" class="nav-link">
                    <span class="link-text">Products</span>
                </a>
            </li>
            <li class="nav-item">
                <a href="#" class="nav-link">
                    <span class="link-text">Services</span>
                </a>
            </li>
            <li class="nav-item">
                <a href="#" class="nav-link">
                    <span class="link-text">About</span>
                </a>
            </li>
        </ul>

        <div class="nav-actions">
            <!-- Morphing Search Button -->
            <input type="checkbox" id="search-toggle" class="search-toggle">
            <div class="search-container">
                <input type="text" class="search-input" placeholder="Search...">
                <label for="search-toggle" class="neu-btn search-btn">
                    <svg viewBox="0 0 24 24" class="icon-search"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                    <svg viewBox="0 0 24 24" class="icon-close"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                </label>
            </div>
            
            <a href="#" class="neu-btn primary">Login</a>
        </div>

    </nav>

    <main class="dummy-content">
        <h1>Soft UI Experience</h1>
        <p>A beautifully tactile navigation concept.</p>
    </main>

</body>
</html>
