<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CSS free shipping progress bar">
  <title>CSS Free Shipping Progress Bar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="shipping-card" aria-labelledby="shipping-title">
    <div class="shipping-icon" aria-hidden="true">🚚</div>

    <div class="shipping-content">
      <div class="shipping-header">
        <div>
          <span class="eyebrow">Shipping reward</span>
          <h1 id="shipping-title">You're almost there!</h1>
        </div>

        <strong class="amount">$18</strong>
      </div>

      <p>
        Add <strong>$18</strong> more to unlock free shipping.
      </p>

      <div
        class="progress"
        role="progressbar"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="82"
        aria-label="82 percent toward free shipping"
      >
        <span class="progress-fill"></span>
      </div>

      <div class="progress-labels">
        <span>$82 spent</span>
        <span>$100 for free shipping</span>
      </div>

      <div class="reward">
        <span aria-hidden="true">✓</span>
        Free shipping unlocks at $100
      </div>
    </div>
  </main>

</body>
</html>
