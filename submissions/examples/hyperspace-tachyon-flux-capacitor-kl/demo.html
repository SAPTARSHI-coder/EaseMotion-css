<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hyperspace Tachyon Flux Capacitor - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #02232b; color: #ffffff;">

    <div class="ease-card ease-card-glass capacitor-container">
        <div class="capacitor-header">
            <h2>Flux Capacitor</h2>
            <span class="ease-badge ease-badge-info">Charged</span>
        </div>
        
        <div class="capacitor-screen ease-center">
            <div class="flux-discharge discharge-1"></div>
            <div class="flux-discharge discharge-2"></div>
            <div class="temporal-shield-ring"></div>
            <div class="tachyon-core ease-center"></div>
        </div>

        <div class="capacitor-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Output: 1.21 GW</span>
            <button class="ease-btn ease-btn-primary ease-btn-sm ease-hover-grow">Initiate Flux</button>
        </div>
    </div>

</body>
</html>
