<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crimson Sprint X - EaseMotion</title>
    
    <!-- 
      THE MAGIC TAG (Target Page)
      Because this page also has the same-origin view-transition tag,
      the browser knows it should animate the entry of this page!
    -->
    <meta name="view-transition" content="same-origin">
    
    <link rel="stylesheet" href="../../../easemotion.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="detail-page-body">

    <header class="app-header detail-header">
        <!-- We match the view-transition-name. The logo will seamlessly slide into its new position! -->
        <div class="logo" style="view-transition-name: app-logo;">EaseMotion</div>
        <nav class="app-nav">
            <a href="index.html">Back to Gallery</a>
        </nav>
    </header>

    <main class="detail-container">
        
        <div class="detail-hero">
            <!-- 
              This is the exact same image, but massively scaled and positioned differently.
              Because it shares `view-transition-name: hero-product-image`, the browser 
              will physically interpolate its position, width, height, and border-radius 
              from the thumbnail on the previous page to this massive hero layout!
            -->
            <img 
                src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&q=80&w=1600" 
                alt="Red Sneaker" 
                class="detail-hero-image"
                style="view-transition-name: hero-product-image;"
            >
        </div>

        <div class="detail-content">
            <div class="detail-header-row">
                <!-- Matches the title from the previous page -->
                <h1 class="detail-title" style="view-transition-name: hero-product-title;">Crimson Sprint X</h1>
                <p class="detail-price">$149.99</p>
            </div>
            
            <p class="detail-description">
                Experience unparalleled speed and comfort with the Crimson Sprint X. 
                Engineered with aerospace-grade materials, this shoe features a proprietary 
                carbon-fiber propulsion plate and ultra-responsive foam cushioning.
            </p>
            
            <div class="detail-actions">
                <button class="add-to-cart">Add to Cart</button>
                <a href="index.html" class="back-link">Return to Gallery</a>
            </div>
        </div>

    </main>

</body>
</html>
