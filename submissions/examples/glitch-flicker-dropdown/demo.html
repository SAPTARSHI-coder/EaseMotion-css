<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Glitch-Flicker Dropdown for product catalog layouts">
    <title>Glitch-Flicker Dropdown</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="page">

        <section class="catalog">

            <p class="eyebrow">EASEMOTION CSS</p>

            <h1>Product Catalog</h1>

            <p class="description">
                Browse our collection and choose a category
                to discover products.
            </p>

            <div class="dropdown">

                <input
                    type="checkbox"
                    id="catalog-toggle"
                    class="dropdown-toggle"
                >

                <label for="catalog-toggle" class="dropdown-button">
                    <span>Select Category</span>
                    <span class="arrow">+</span>
                </label>

                <div class="dropdown-menu">

                    <a href="#" class="dropdown-item">
                        <span>01</span>
                        Electronics
                    </a>

                    <a href="#" class="dropdown-item">
                        <span>02</span>
                        Fashion
                    </a>

                    <a href="#" class="dropdown-item">
                        <span>03</span>
                        Home &amp; Living
                    </a>

                    <a href="#" class="dropdown-item">
                        <span>04</span>
                        Accessories
                    </a>

                    <a href="#" class="dropdown-item">
                        <span>05</span>
                        New Arrivals
                    </a>

                </div>

            </div>

        </section>

    </main>

</body>
</html>
