<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Inventory Slot Grid - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="em-inventory-page">
        <div class="em-inventory-card" role="region" aria-label="Game Inventory Grid">
            <header class="em-inventory-header">
                <span class="em-inventory-badge">EQUIPMENT STORAGE</span>
                <h1 class="em-inventory-title">Inventory Slot Grid</h1>
                <p class="em-inventory-subtitle">Game inventory interface with item slots, tooltips, and hover states.</p>
            </header>

            <div class="em-inventory-grid" role="grid" aria-label="Inventory Slots">
                <div class="em-slot em-slot-active" tabindex="0" role="gridcell" aria-label="Plasma Rifle, Rare Item">
                    <div class="em-item em-item-weapon">
                        <span class="em-item-icon">⚡</span>
                        <span class="em-item-count">1</span>
                    </div>
                    <div class="em-tooltip" role="tooltip">
                        <span class="em-tooltip-title">Plasma Rifle</span>
                        <span class="em-tooltip-type">Rare Energy Weapon</span>
                    </div>
                </div>

                <div class="em-slot" tabindex="0" role="gridcell" aria-label="Nano Stimpack, Consumable">
                    <div class="em-item em-item-potion">
                        <span class="em-item-icon">🧪</span>
                        <span class="em-item-count">5</span>
                    </div>
                    <div class="em-tooltip" role="tooltip">
                        <span class="em-tooltip-title">Nano Stimpack</span>
                        <span class="em-tooltip-type">Consumable Health</span>
                    </div>
                </div>

                <div class="em-slot" tabindex="0" role="gridcell" aria-label="Titanium Shield Core, Armor Component">
                    <div class="em-item em-item-armor">
                        <span class="em-item-icon">🛡️</span>
                        <span class="em-item-count">1</span>
                    </div>
                    <div class="em-tooltip" role="tooltip">
                        <span class="em-tooltip-title">Titanium Core</span>
                        <span class="em-tooltip-type">Armor Component</span>
                    </div>
                </div>

                <div class="em-slot" tabindex="0" role="gridcell" aria-label="Empty Slot"></div>
                <div class="em-slot" tabindex="0" role="gridcell" aria-label="Empty Slot"></div>
                <div class="em-slot" tabindex="0" role="gridcell" aria-label="Empty Slot"></div>
            </div>
        </div>
    </div>
</body>
</html>
