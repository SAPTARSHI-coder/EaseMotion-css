<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EaseMotion - Neon Text Flicker Sign Demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background-color: #080810;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .container {
      text-align: center;
    }
    .neon-sign {
      font-size: 4rem;
      font-weight: 900;
      letter-spacing: 0.3rem;
      text-transform: uppercase;
      color: #ffffff;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="neon-sign ease-anim-neon-text-flicker-sign">OPEN 24/7</h1>
  </div>
</body>
</html>
