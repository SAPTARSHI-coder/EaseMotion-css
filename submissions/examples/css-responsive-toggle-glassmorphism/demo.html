<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Toggle | Glassmorphism Styling</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="glass-card" aria-label="Settings Panel">
    <div class="toggle-group">
        <div class="toggle-label-text">
            <span class="toggle-title" id="notifications-label">Push Notifications</span>
            <span class="toggle-subtitle">Receive real-time operational updates</span>
        </div>
        <label class="glass-switch">
            <input type="checkbox" checked aria-labelledby="notifications-label">
            <span class="slider"></span>
        </label>
    </div>

    <div class="toggle-group">
        <div class="toggle-label-text">
            <span class="toggle-title" id="darkmode-label">Glass Backlight Glow</span>
            <span class="toggle-subtitle">Enable ambient glowing accent borders</span>
        </div>
        <label class="glass-switch">
            <input type="checkbox" aria-labelledby="darkmode-label">
            <span class="slider"></span>
        </label>
    </div>
</main>

</body>
</html>
