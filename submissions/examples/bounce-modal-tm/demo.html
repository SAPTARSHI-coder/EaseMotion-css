<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bounce-in modal — EaseMotion CSS</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="md-page-tm">
  <h1>Bounce-in modal</h1>
  <p class="md-lede-tm">Three modal sizes, all entering with a soft overshoot.</p>

  <section class="md-stage-tm">
    <div class="modal-tm" role="dialog" aria-modal="true">
      <h2>Confirm</h2>
      <p>This action cannot be undone.</p>
      <div class="modal-actions-tm">
        <button class="modal-btn-tm">Cancel</button>
        <button class="modal-btn-tm modal-btn-primary-tm">Confirm</button>
      </div>
    </div>
  </section>

  <section class="md-stage-tm">
    <div class="modal-tm modal-md-tm" role="dialog" aria-modal="true">
      <h2>Quick form</h2>
      <p>Subscribe to the changelog for monthly updates.</p>
      <input class="modal-input-tm" placeholder="you@example.com">
      <div class="modal-actions-tm">
        <button class="modal-btn-tm">Later</button>
        <button class="modal-btn-tm modal-btn-primary-tm">Subscribe</button>
      </div>
    </div>
  </section>

  <section class="md-stage-tm">
    <div class="modal-tm modal-lg-tm" role="dialog" aria-modal="true">
      <h2>Heads up</h2>
      <p>This is a larger modal for content that needs more room. The same bounce curve scales naturally to any size.</p>
      <div class="modal-actions-tm">
        <button class="modal-btn-tm modal-btn-primary-tm">Got it</button>
      </div>
    </div>
  </section>
</main>
</body>
</html>
