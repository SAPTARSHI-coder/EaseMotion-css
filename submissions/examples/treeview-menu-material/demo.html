<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EaseMotion - Material Design Treeview</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="em-container">
    <div class="em-material-card">
      <h2 class="em-material-title">My Drive</h2>
      
      <!-- Pure CSS Material Treeview -->
      <ul class="em-treeview">
        
        <!-- Node 1 -->
        <li class="em-treeview-node">
          <input type="checkbox" id="md-work" class="em-treeview-toggle" aria-hidden="true" />
          <label for="md-work" class="em-treeview-label" tabindex="0">
            <span class="em-treeview-chevron"></span>
            <span class="em-treeview-icon">📁</span>
            <span class="em-treeview-text">Work Documents</span>
          </label>
          <div class="em-treeview-sub-container">
            <ul class="em-treeview-sub">
              <li class="em-treeview-leaf">
                <a href="#" class="em-treeview-link">
                  <span class="em-treeview-icon">📄</span>
                  <span class="em-treeview-text">Q3 Report.pdf</span>
                </a>
              </li>
              <li class="em-treeview-leaf">
                <a href="#" class="em-treeview-link">
                  <span class="em-treeview-icon">📊</span>
                  <span class="em-treeview-text">Budget_v2.xlsx</span>
                </a>
              </li>
            </ul>
          </div>
        </li>

        <!-- Node 2 -->
        <li class="em-treeview-node">
          <input type="checkbox" id="md-personal" class="em-treeview-toggle" aria-hidden="true" />
          <label for="md-personal" class="em-treeview-label" tabindex="0">
            <span class="em-treeview-chevron"></span>
            <span class="em-treeview-icon">📁</span>
            <span class="em-treeview-text">Personal</span>
          </label>
          <div class="em-treeview-sub-container">
            <ul class="em-treeview-sub">
              <!-- Nested Node -->
              <li class="em-treeview-node">
                <input type="checkbox" id="md-travel" class="em-treeview-toggle" aria-hidden="true" />
                <label for="md-travel" class="em-treeview-label" tabindex="0">
                  <span class="em-treeview-chevron"></span>
                  <span class="em-treeview-icon">📁</span>
                  <span class="em-treeview-text">Travel Plans</span>
                </label>
                <div class="em-treeview-sub-container">
                  <ul class="em-treeview-sub">
                    <li class="em-treeview-leaf">
                      <a href="#" class="em-treeview-link">
                        <span class="em-treeview-icon">✈️</span>
                        <span class="em-treeview-text">Itinerary.docx</span>
                      </a>
                    </li>
                  </ul>
                </div>
              </li>
              
              <li class="em-treeview-leaf">
                <a href="#" class="em-treeview-link">
                  <span class="em-treeview-icon">🖼️</span>
                  <span class="em-treeview-text">Family_Photo.jpg</span>
                </a>
              </li>
            </ul>
          </div>
        </li>
        
        <!-- Leaf (Direct link at root level) -->
        <li class="em-treeview-leaf">
          <a href="#" class="em-treeview-link">
            <span class="em-treeview-spacer"></span>
            <span class="em-treeview-icon">⚙️</span>
            <span class="em-treeview-text">Settings</span>
          </a>
        </li>
        
      </ul>
    </div>
  </main>
</body>
</html>
