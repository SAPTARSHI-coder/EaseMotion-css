<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blur Entrance Stepper</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="stepper">

    <div class="step active">
        <div class="circle">1</div>
        <span>Plan</span>
    </div>

    <div class="line"></div>

    <div class="step active">
        <div class="circle">2</div>
        <span>Design</span>
    </div>

    <div class="line"></div>

    <div class="step">
        <div class="circle">3</div>
        <span>Develop</span>
    </div>

    <div class="line"></div>

    <div class="step">
        <div class="circle">4</div>
        <span>Launch</span>
    </div>

</div>

</body>
</html>
