<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Donut Chart | EaseMotion CSS</title><link rel="stylesheet" href="style.css"></head>
<body><div class="dcc-root">
<div class="dcc-card">
<div class="dcc-chart"><div class="dcc-ring"><div class="dcc-center"><span class="dcc-pct">55%</span><span class="dcc-lbl">Complete</span></div></div></div>
<div class="dcc-legend">
<div class="dcc-legend-row"><span class="dcc-dot" style="background:var(--dcc-accent)"></span>Design — 35%</div>
<div class="dcc-legend-row"><span class="dcc-dot" style="background:var(--dcc-accent2)"></span>Dev — 25%</div>
<div class="dcc-legend-row"><span class="dcc-dot" style="background:var(--dcc-accent3)"></span>Testing — 14%</div>
<div class="dcc-legend-row"><span class="dcc-dot" style="background:var(--dcc-border)"></span>Pending — 26%</div>
</div>
</div>
<div class="dcc-card">
<div class="dcc-chart"><div class="dcc-ring" style="background:conic-gradient(var(--dcc-accent3) 0deg 280deg,var(--dcc-accent4) 280deg 324deg,var(--dcc-border) 324deg 360deg)"><div class="dcc-center"><span class="dcc-pct">78%</span><span class="dcc-lbl">On Track</span></div></div></div>
<div class="dcc-legend">
<div class="dcc-legend-row"><span class="dcc-dot" style="background:var(--dcc-accent3)"></span>On Track — 78%</div>
<div class="dcc-legend-row"><span class="dcc-dot" style="background:var(--dcc-accent4)"></span>At Risk — 12%</div>
<div class="dcc-legend-row"><span class="dcc-dot" style="background:var(--dcc-border)"></span>Off Track — 10%</div>
</div>
</div>
</div></body></html>
