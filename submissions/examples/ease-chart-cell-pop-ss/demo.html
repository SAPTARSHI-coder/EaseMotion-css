<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chart Cell Pop Component - Charts Category</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="ease-chart-stage" aria-labelledby="stage-title">
    <div class="ease-chart-header">
      <h1 id="stage-title" class="ease-chart-title">Activity Heatmap Intensity</h1>
      <p class="ease-chart-desc">Heatmap cells popping and glowing in sequence to visualize data intensity.</p>
    </div>

    <!-- Chart Cell Grid Component -->
    <div class="ease-chart-cell-grid" id="chart-grid" role="region" aria-label="Activity Heatmap Grid">
      <div class="ease-chart-cell intensity-1" style="--delay: 1;" aria-hidden="true"></div>
      <div class="ease-chart-cell intensity-2" style="--delay: 2;" aria-hidden="true"></div>
      <div class="ease-chart-cell intensity-3" style="--delay: 3;" aria-hidden="true"></div>
      <div class="ease-chart-cell intensity-4" style="--delay: 4;" aria-hidden="true"></div>
      <div class="ease-chart-cell intensity-2" style="--delay: 5;" aria-hidden="true"></div>
      <div class="ease-chart-cell intensity-4" style="--delay: 6;" aria-hidden="true"></div>
      <div class="ease-chart-cell intensity-1" style="--delay: 7;" aria-hidden="true"></div>
      <div class="ease-chart-cell intensity-3" style="--delay: 8;" aria-hidden="true"></div>
      <div class="ease-chart-cell intensity-3" style="--delay: 9;" aria-hidden="true"></div>
      <div class="ease-chart-cell intensity-1" style="--delay: 10;" aria-hidden="true"></div>
      <div class="ease-chart-cell intensity-4" style="--delay: 11;" aria-hidden="true"></div>
      <div class="ease-chart-cell intensity-2" style="--delay: 12;" aria-hidden="true"></div>
    </div>

    <button type="button" class="ease-btn-chart" id="replay-btn">Replay Sequence</button>
  </main>

  <script>
    const grid = document.getElementById('chart-grid');
    const replayBtn = document.getElementById('replay-btn');

    replayBtn.addEventListener('click', () => {
      grid.classList.add('is-animating');
      void grid.offsetWidth; // Trigger DOM reflow
      grid.classList.remove('is-animating');
    });
  </script>
</body>
</html>
