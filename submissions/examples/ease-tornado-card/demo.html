<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tornado Card · Whirlwind Spin Effect</title>

    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <div class="card">
        <h2>🌪️ Tornado Card</h2>
        <p class="sub">spins with a whirlwind effect on hover</p>

        <!-- === TORNADO CARD === -->
        <div class="tornado-container" id="tornadoContainer">
            <div class="tornado-card">
                <div class="tornado-content">
                    <i class="fas fa-wind"></i>
                    <h3>Whirlwind</h3>
                    <p>Hover to see the tornado spin</p>
                    <span class="tornado-badge">🌀</span>
                </div>
                <div class="tornado-particle p1"></div>
                <div class="tornado-particle p2"></div>
                <div class="tornado-particle p3"></div>
                <div class="tornado-particle p4"></div>
                <div class="tornado-particle p5"></div>
                <div class="tornado-particle p6"></div>
                <div class="tornado-particle p7"></div>
                <div class="tornado-particle p8"></div>
                <div class="tornado-particle p9"></div>
                <div class="tornado-particle p10"></div>
                <div class="tornado-particle p11"></div>
                <div class="tornado-particle p12"></div>
            </div>
        </div>

        <p style="margin-top: 2rem; font-size: 0.85rem; color: #64748b;">
            Hover · watch the card spin like a tornado
        </p>
    </div>

    <!-- Embedded JavaScript -->
    <script>
        (function() {
            'use strict';

            const container = document.getElementById('tornadoContainer');

            // Click feedback
            container.addEventListener('click', function() {
                const card = this.querySelector('.tornado-card');
                card.classList.add('click-pulse');
                setTimeout(() => {
                    card.classList.remove('click-pulse');
                }, 300);
                console.log('🌪️ Tornado card clicked!');
            });

            // Keyboard accessibility
            container.setAttribute('tabindex', '0');
            container.setAttribute('role', 'button');
            container.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    this.click();
                }
            });

            // Reset animation on hover
            container.addEventListener('mouseenter', function() {
                const particles = this.querySelectorAll('.tornado-particle');
                particles.forEach(p => {
                    p.style.animation = 'none';
                    void p.offsetWidth;
                    p.style.animation = '';
                });
            });

            console.log('🌪️ Tornado card initialized!');

        })();
    </script>

</body>
</html>
