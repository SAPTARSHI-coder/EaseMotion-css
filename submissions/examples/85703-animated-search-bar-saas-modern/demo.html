<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      SaaS Modern Animated Search Bar Input Component (ease-saas-search-bar)
    </title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="demo-container">
      <header class="demo-header">
        <div class="header-badge">SAAS PRODUCT UI UTILITY</div>
        <h1 class="demo-title">ANIMATED SAAS SEARCH BAR</h1>
        <p class="demo-subtitle">
          Pure HTML + Vanilla CSS Smooth Expanding Search Input without
          JavaScript
        </p>
      </header>

      <!-- Main SaaS Search Bar Showcase Card -->
      <section class="search-showcase-card">
        <form
          class="ease-saas-search-bar"
          role="search"
          action="#"
          method="get"
        >
          <!-- Accessible Hidden Label -->
          <label for="saas-search-input" class="sr-only"
            >Search workspace, documents, or projects</label
          >

          <!-- Search Magnifying Glass Icon -->
          <span class="search-icon-wrapper" aria-hidden="true">
            <svg
              class="search-icon"
              viewBox="0 0 24 24"
              width="20"
              height="20"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="11" cy="11" r="8" />
              <line x1="21" y1="21" x2="16.65" y2="16.65" />
            </svg>
          </span>

          <!-- Search Input Field -->
          <input
            type="search"
            id="saas-search-input"
            class="saas-search-input"
            placeholder="Search workspace..."
            autocomplete="off"
            spellcheck="false"
          />

          <!-- Keyboard Shortcut Badge -->
          <div class="saas-kbd-wrapper" aria-hidden="true">
            <kbd class="saas-kbd-badge"><abbr title="Command">⌘</abbr>K</kbd>
          </div>

          <!-- Action Submit Button -->
          <button
            type="submit"
            class="saas-search-submit"
            aria-label="Submit Search"
          >
            <svg
              class="arrow-icon"
              viewBox="0 0 24 24"
              width="16"
              height="16"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <line x1="5" y1="12" x2="19" y2="12" />
              <polyline points="12 5 19 12 12 19" />
            </svg>
          </button>
        </form>
      </section>

      <!-- Demo Keyboard Instructions Footer -->
      <footer class="demo-footer">
        <div class="keyboard-instruction">
          <span class="type-key">TAB</span> Focus input &bull;
          <span class="type-key">FOCUS EXPANSION</span> Smooth width transition
          &bull; <span class="type-key">REDUCED MOTION</span> Instant state
          transition
        </div>
      </footer>
    </main>
  </body>
</html>
