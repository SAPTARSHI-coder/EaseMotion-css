
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Responsive glassmorphism dropdown built with HTML and CSS"
  >
  <title>Glassmorphism Dropdown</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="page">
    <section class="dropdown-demo" aria-labelledby="dropdown-title">
      <span class="eyebrow">EaseMotion CSS</span>

      <h1 id="dropdown-title">Glassmorphism Dropdown</h1>

      <p class="description">
        A responsive dropdown component built using only HTML and CSS.
      </p>

      <details class="glass-dropdown">
        <summary>
          <span class="summary-content">
            <span class="summary-icon">✦</span>
            <span>
              <strong>Select an option</strong>
              <small>Choose from the available options</small>
            </span>
          </span>

          <span class="arrow" aria-hidden="true">⌄</span>
        </summary>

        <div class="dropdown-menu">
          <a href="#profile" class="dropdown-item">
            <span class="item-icon">◉</span>
            <span>
              <strong>Profile</strong>
              <small>View your profile</small>
            </span>
          </a>

          <a href="#settings" class="dropdown-item">
            <span class="item-icon">⚙</span>
            <span>
              <strong>Settings</strong>
              <small>Manage your preferences</small>
            </span>
          </a>

          <a href="#projects" class="dropdown-item">
            <span class="item-icon">◆</span>
            <span>
              <strong>Projects</strong>
              <small>Explore your projects</small>
            </span>
          </a>

          <a href="#help" class="dropdown-item">
            <span class="item-icon">?</span>
            <span>
              <strong>Help Center</strong>
              <small>Get support and assistance</small>
            </span>
          </a>
        </div>
      </details>
    </section>
  </main>

</body>
</html>
