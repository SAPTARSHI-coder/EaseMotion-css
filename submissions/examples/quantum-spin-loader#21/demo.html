<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Spin Loader | EaseMotion CSS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="scene">
        <!-- Main Loader Container -->
        <div class="quantum-loader">
            <!-- 3D Rotating Rings -->
            <div class="ring ring-x"></div>
            <div class="ring ring-y"></div>
            <div class="ring ring-z"></div>
            
            <!-- Pulsating Core with Orbiting Particles -->
            <div class="core">
                <div class="particle p1"></div>
                <div class="particle p2"></div>
                <div class="particle p3"></div>
                <div class="particle p4"></div>
                <div class="core-inner"></div>
            </div>
        </div>
        <p class="loading-text">Initializing Quantum Matrix...</p>
    </div>
</body>
</html>
