<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ease Custom Contextual Cursor Trailer</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="ease-cursor-body">
  <div class="ease-cursor-follower" id="follower"><span id="cursorLabel"></span></div>

  <main class="ease-cursor-demo">
    <h1>Custom Contextual Cursor</h1>
    <div class="ease-box" data-cursor="VIEW">Hover for View</div>
    <button class="ease-box-btn" data-cursor="MAGNETIC">Magnetic Button</button>
  </main>

  <script>
    const follower = document.getElementById('follower');
    const label = document.getElementById('cursorLabel');
    let mouseX = 0, mouseY = 0;
    let posX = 0, posY = 0;

    document.addEventListener('mousemove', (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;
    });

    function loop() {
      posX += (mouseX - posX) * 0.15;
      posY += (mouseY - posY) * 0.15;
      follower.style.transform = `translate3d(${posX - 16}px, ${posY - 16}px, 0)`;
      requestAnimationFrame(loop);
    }
    loop();

    document.querySelectorAll('[data-cursor]').forEach(el => {
      el.addEventListener('mouseenter', () => {
        const text = el.getAttribute('data-cursor');
        follower.classList.add('active');
        label.textContent = text;
      });
      el.addEventListener('mouseleave', () => {
        follower.classList.remove('active');
        label.textContent = '';
      });
    });
  </script>
</body>
</html>
