<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pretzel Dough Twister — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Pretzel Dough Twister demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Pretzel Dough Twister</h1>
      <p class="lede">Pretzel dough twisting into classic knot shape</p>
    </header>

    <section class="ease-pretzel-dough-twister" data-demo="pretzel-dough-twister" aria-live="polite">
      <div class="ease-pretzel-dough-twister__housing">
        <div class="ease-pretzel-dough-twister__bezel">
          <div class="ease-pretzel-dough-twister__face">
            <div class="ease-pretzel-dough-twister__readout">
              <span class="ease-pretzel-dough-twister__label">Pretzel Dough Twister</span>
              <span class="ease-pretzel-dough-twister__value" id="val-pretzel-dough-twister">READY</span>
            </div>
            <div class="ease-pretzel-dough-twister__motion" aria-hidden="true">
              <span class="ease-pretzel-dough-twister__arm"></span>
              <span class="ease-pretzel-dough-twister__core"></span>
              <span class="ease-pretzel-dough-twister__trail"></span>
              <span class="ease-pretzel-dough-twister__mark m1"></span>
              <span class="ease-pretzel-dough-twister__mark m2"></span>
              <span class="ease-pretzel-dough-twister__mark m3"></span>
            </div>
            <div class="ease-pretzel-dough-twister__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-pretzel-dough-twister__controls">
          <button type="button" class="ease-pretzel-dough-twister__btn primary">Engage</button>
          <button type="button" class="ease-pretzel-dough-twister__btn">Reset</button>
          <label class="ease-pretzel-dough-twister__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-pretzel-dough-twister__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
