<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Badge | Pastel Styling</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="badge-card" aria-label="Dynamic Pastel Badges Showcase">
    <h1 class="card-title">Dynamic Pastel Badges</h1>
    <p class="card-desc">Soft, high-contrast pastel status indicators featuring dynamic pulsing beacons and spring interaction states.</p>

    <div class="badge-group" role="region" aria-label="Status Badges">
        <span class="badge-pastel badge-lavender">
            <span class="badge-dot" aria-hidden="true"></span>
            Pro Plan
        </span>

        <span class="badge-pastel badge-mint">
            <span class="badge-dot" aria-hidden="true"></span>
            Active
        </span>

        <span class="badge-pastel badge-peach">
            <span class="badge-dot" aria-hidden="true"></span>
            Scheduled
        </span>

        <span class="badge-pastel badge-sky">
            <span class="badge-dot" aria-hidden="true"></span>
            v2.4 Live
        </span>
    </div>
</main>

</body>
</html>
