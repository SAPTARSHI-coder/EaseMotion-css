<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diamond Facet Edge Widget</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <h1>Financial Overview</h1>
      <p class="subtitle">Geometric Diamond Facet Edge Variation</p>
    </header>

    <main class="dashboard-grid">
      <!-- Widget 1: Portfolio Health -->
      <a href="#" class="diamond-widget" aria-labelledby="widget1-title">
        <div class="diamond-facet-wrapper">
          <article class="widget-content">
            <header class="widget-header">
              <h2 id="widget1-title" class="widget-title">Portfolio Health</h2>
              <div class="status-indicator online" aria-label="Status: Strong"></div>
            </header>
            
            <div class="widget-body">
              <div class="primary-metric">84<span class="metric-unit">%</span></div>
              <div class="secondary-metric">
                <span class="trend-icon positive" aria-hidden="true">↑</span>
                <span class="trend-value">Strong</span>
                <span class="trend-label">Updated today</span>
              </div>
            </div>
            
            <footer class="widget-footer">
              <p>Risk exposure minimal</p>
            </footer>
          </article>
        </div>
      </a>

      <!-- Widget 2: Managed Assets -->
      <a href="#" class="diamond-widget" aria-labelledby="widget2-title">
        <div class="diamond-facet-wrapper">
          <article class="widget-content">
            <header class="widget-header">
              <h2 id="widget2-title" class="widget-title">Managed Assets</h2>
              <div class="status-indicator processing" aria-label="Status: Rebalancing"></div>
            </header>
            
            <div class="widget-body">
              <div class="primary-metric">2.4<span class="metric-unit">M</span></div>
              <div class="secondary-metric">
                <span class="trend-icon positive" aria-hidden="true">↑</span>
                <span class="trend-value">+4.2%</span>
                <span class="trend-label">YTD</span>
              </div>
            </div>
            
            <footer class="widget-footer">
              <p>Rebalancing in progress</p>
            </footer>
          </article>
        </div>
      </a>
    </main>
  </div>
</body>
</html>
