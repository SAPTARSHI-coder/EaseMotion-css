<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chip Component Dismiss Button ARIA Label Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Screen Reader Live Region for State Announcements -->
  <div 
    id="a11y-announcer" 
    class="sr-only" 
    role="status" 
    aria-live="polite" 
    aria-atomic="true"
  ></div>

  <main id="main-content" tabindex="-1">
    <h1>Filter Tags Matrix</h1>
    <p>
      Tab into the filter chips below. Each dismiss button features an explicit contextual 
      ARIA label and supports keyboard removal (<kbd>Space</kbd>, <kbd>Enter</kbd>, <kbd>Delete</kbd>, <kbd>Backspace</kbd>) 
      with seamless focus transfer and live region status updates.
    </p>

    <!-- CHIP LIST CONTAINER -->
    <ul class="chip-group" role="list" aria-label="Active Filters">
      
      <!-- Chip 1: React -->
      <li class="chip-item" id="chip-react">
        <span class="chip-label" id="chip-label-react">React</span>
        <button 
          type="button" 
          class="chip-dismiss-btn"
          aria-label="Remove React filter"
          data-chip-id="chip-react"
        >
          <svg class="chip-icon" focusable="false" aria-hidden="true" width="12" height="12" viewBox="0 0 16 16">
            <path d="M4.646 4.646a.5.5 0 0 1 .708 0L8 7.293l2.646-2.647a.5.5 0 0 1 .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708.708L8 8.707l-2.646 2.647a.5.5 0 0 1-.708-.708L7.293 8 4.646 5.354a.5.5 0 0 1 0-.708z"/>
          </svg>
        </button>
      </li>

      <!-- Chip 2: Vue.js -->
      <li class="chip-item" id="chip-vue">
        <span class="chip-label" id="chip-label-vue">Vue.js</span>
        <button 
          type="button" 
          class="chip-dismiss-btn"
          aria-label="Remove Vue.js filter"
          data-chip-id="chip-vue"
        >
          <svg class="chip-icon" focusable="false" aria-hidden="true" width="12" height="12" viewBox="0 0 16 16">
            <path d="M4.646 4.646a.5.5 0 0 1 .708 0L8 7.293l2.646-2.647a.5.5 0 0 1 .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708.708L8 8.707l-2.646 2.647a.5.5 0 0 1-.708-.708L7.293 8 4.646 5.354a.5.5 0 0 1 0-.708z"/>
          </svg>
        </button>
      </li>

      <!-- Chip 3: TypeScript -->
      <li class="chip-item" id="chip-ts">
        <span class="chip-label" id="chip-label-ts">TypeScript</span>
        <button 
          type="button" 
          class="chip-dismiss-btn"
          aria-label="Remove TypeScript filter"
          data-chip-id="chip-ts"
        >
          <svg class="chip-icon" focusable="false" aria-hidden="true" width="12" height="12" viewBox="0 0 16 16">
            <path d="M4.646 4.646a.5.5 0 0 1 .708 0L8 7.293l2.646-2.647a.5.5 0 0 1 .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708.708L8 8.707l-2.646 2.647a.5.5 0 0 1-.708-.708L7.293 8 4.646 5.354a.5.5 0 0 1 0-.708z"/>
          </svg>
        </button>
      </li>

    </ul>
  </main>

  <script src="chip-controller.js"></script>
</body>
</html>
