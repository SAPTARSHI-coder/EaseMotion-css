<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Visual CSS Gradient Picker. Generate gradient styles and copy output CSS code interactively."
    />
    <title>CSS Gradient Picker - EaseMotion CSS</title>
    <!-- Outfit Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>CSS Gradient Picker</h1>
      <p>
        Build, preview, and generate clean, performant CSS gradient backgrounds
        dynamically. Customize colors, angles, and stops in real time.
      </p>
    </header>

    <main class="picker-container" id="gradient-picker-app">
      <!-- Left Side: Controls -->
      <section
        class="control-panel"
        aria-label="Gradient customization controls"
      >
        <!-- Type Selection -->
        <div class="control-group">
          <h2 class="section-title">Gradient Type</h2>
          <div
            class="type-selector"
            role="radiogroup"
            aria-label="Select gradient style"
          >
            <button
              type="button"
              class="type-btn active"
              id="btn-linear"
              role="radio"
              aria-checked="true"
            >
              Linear
            </button>
            <button
              type="button"
              class="type-btn"
              id="btn-radial"
              role="radio"
              aria-checked="false"
            >
              Radial
            </button>
          </div>
        </div>

        <!-- Color Inputs -->
        <div class="control-group">
          <h2 class="section-title">Colors</h2>
          <div class="control-row">
            <div class="color-picker-row">
              <div class="color-input-wrapper">
                <input
                  type="color"
                  id="picker-color-1"
                  value="#6366f1"
                  aria-label="First gradient color"
                />
              </div>
              <input
                type="text"
                class="color-text-input"
                id="text-color-1"
                value="#6366f1"
                aria-label="First color hex value"
              />
            </div>
            <div class="color-picker-row">
              <div class="color-input-wrapper">
                <input
                  type="color"
                  id="picker-color-2"
                  value="#ec4899"
                  aria-label="Second gradient color"
                />
              </div>
              <input
                type="text"
                class="color-text-input"
                id="text-color-2"
                value="#ec4899"
                aria-label="Second color hex value"
              />
            </div>
          </div>
        </div>

        <!-- Stop Ranges -->
        <div class="control-group">
          <h2 class="section-title">Color Stops</h2>
          <div class="control-row">
            <div>
              <label for="stop-1"
                >Color 1 Stop
                <span class="value-display" id="val-stop-1">0%</span></label
              >
              <input
                type="range"
                id="stop-1"
                min="0"
                max="100"
                value="0"
                step="1"
              />
            </div>
            <div>
              <label for="stop-2"
                >Color 2 Stop
                <span class="value-display" id="val-stop-2">100%</span></label
              >
              <input
                type="range"
                id="stop-2"
                min="0"
                max="100"
                value="100"
                step="1"
              />
            </div>
          </div>
        </div>

        <!-- Angle Range -->
        <div class="control-group" id="angle-control-group">
          <h2 class="section-title">Angle</h2>
          <label for="angle"
            >Rotation
            <span class="value-display" id="val-angle">135°</span></label
          >
          <input
            type="range"
            id="angle"
            min="0"
            max="360"
            value="135"
            step="1"
          />
        </div>
      </section>

      <!-- Right Side: Preview & Code -->
      <section
        class="preview-pane"
        aria-label="Gradient visual preview and output code"
      >
        <!-- Live Preview -->
        <div class="preview-box" id="preview-box">
          <div class="preview-gradient-layer" id="preview-layer"></div>
        </div>

        <!-- Output CSS -->
        <div class="output-box">
          <pre class="code-display" id="code-output">
background: linear-gradient(135deg, #6366f1 0%, #ec4899 100%);</pre>
          <button
            class="copy-btn"
            id="copy-btn"
            aria-label="Copy CSS code output"
          >
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path
                d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"
              ></path>
            </svg>
          </button>
        </div>
      </section>
    </main>

    <div class="toast-msg" id="toast-msg">CSS Copied to clipboard!</div>

    <script>
      // State values
      let gradientType = "linear-gradient";
      let color1 = "#6366f1";
      let color2 = "#ec4899";
      let stop1 = "0%";
      let stop2 = "100%";
      let angle = "135deg";

      // DOM Elements
      const root = document.documentElement;
      const btnLinear = document.getElementById("btn-linear");
      const btnRadial = document.getElementById("btn-radial");
      const pickerColor1 = document.getElementById("picker-color-1");
      const textColor1 = document.getElementById("text-color-1");
      const pickerColor2 = document.getElementById("picker-color-2");
      const textColor2 = document.getElementById("text-color-2");
      const sliderStop1 = document.getElementById("stop-1");
      const valStop1 = document.getElementById("val-stop-1");
      const sliderStop2 = document.getElementById("stop-2");
      const valStop2 = document.getElementById("val-stop-2");
      const sliderAngle = document.getElementById("angle");
      const valAngle = document.getElementById("val-angle");
      const angleGroup = document.getElementById("angle-control-group");
      const previewBox = document.getElementById("preview-box");
      const codeOutput = document.getElementById("code-output");
      const copyBtn = document.getElementById("copy-btn");
      const toast = document.getElementById("toast-msg");

      // Update gradient preview
      function updateGradient() {
        root.style.setProperty("--grad-type", gradientType);
        root.style.setProperty("--grad-color-1", color1);
        root.style.setProperty("--grad-color-2", color2);
        root.style.setProperty("--grad-stop-1", stop1);
        root.style.setProperty("--grad-stop-2", stop2);

        let cssCode = "";
        if (gradientType === "linear-gradient") {
          root.style.setProperty("--grad-angle", angle);
          previewBox.classList.remove("radial-gradient-active");
          cssCode = `background: linear-gradient(${angle}, ${color1} ${stop1}, ${color2} ${stop2});`;
        } else {
          previewBox.classList.add("radial-gradient-active");
          cssCode = `background: radial-gradient(circle, ${color1} ${stop1}, ${color2} ${stop2});`;
        }
        codeOutput.textContent = cssCode;
      }

      // Event Listeners for Types
      btnLinear.addEventListener("click", () => {
        gradientType = "linear-gradient";
        btnLinear.classList.add("active");
        btnLinear.setAttribute("aria-checked", "true");
        btnRadial.classList.remove("active");
        btnRadial.setAttribute("aria-checked", "false");
        angleGroup.style.display = "flex";
        updateGradient();
      });

      btnRadial.addEventListener("click", () => {
        gradientType = "radial-gradient";
        btnRadial.classList.add("active");
        btnRadial.setAttribute("aria-checked", "true");
        btnLinear.classList.remove("active");
        btnLinear.setAttribute("aria-checked", "false");
        angleGroup.style.display = "none";
        updateGradient();
      });

      // Color Pickers
      pickerColor1.addEventListener("input", (e) => {
        color1 = e.target.value;
        textColor1.value = color1;
        updateGradient();
      });
      textColor1.addEventListener("input", (e) => {
        const val = e.target.value;
        if (val.match(/^#[0-9A-F]{6}$/i)) {
          color1 = val;
          pickerColor1.value = color1;
          updateGradient();
        }
      });

      pickerColor2.addEventListener("input", (e) => {
        color2 = e.target.value;
        textColor2.value = color2;
        updateGradient();
      });
      textColor2.addEventListener("input", (e) => {
        const val = e.target.value;
        if (val.match(/^#[0-9A-F]{6}$/i)) {
          color2 = val;
          pickerColor2.value = color2;
          updateGradient();
        }
      });

      // Stops
      sliderStop1.addEventListener("input", (e) => {
        stop1 = e.target.value + "%";
        valStop1.textContent = stop1;
        updateGradient();
      });

      sliderStop2.addEventListener("input", (e) => {
        stop2 = e.target.value + "%";
        valStop2.textContent = stop2;
        updateGradient();
      });

      // Angle
      sliderAngle.addEventListener("input", (e) => {
        angle = e.target.value + "deg";
        valAngle.textContent = e.target.value + "°";
        updateGradient();
      });

      // Copy Clipboards
      copyBtn.addEventListener("click", () => {
        navigator.clipboard.writeText(codeOutput.textContent).then(() => {
          toast.classList.add("show");
          setTimeout(() => {
            toast.classList.remove("show");
          }, 2000);
        });
      });
    </script>
  </body>
</html>
