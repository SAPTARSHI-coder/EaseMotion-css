<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glowing Neon Outline Input Field - Minimalist Clean</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="container">
    <div class="input-wrapper">
      <!-- We use a placeholder " " so that the :placeholder-shown pseudo-class works correctly -->
      <input type="text" id="clean-input" class="clean-input" placeholder=" " required autocomplete="off">
      <label for="clean-input" class="floating-label">Email address</label>
      <div class="clean-glow"></div>
    </div>
  </main>

</body>
</html>
