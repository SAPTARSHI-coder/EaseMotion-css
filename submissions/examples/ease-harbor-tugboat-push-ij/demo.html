<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.45">
<title>Harbor Tugboat Push</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="harbor">
  <header class="harbor-head">
    <h1 class="harbor-name">PORT 12</h1>
    <p class="harbor-tide">TIDE OUT</p>
  </header>
  <section class="harbor-scene" aria-label="Tugboat pushing a cargo ship">
    <div class="harbor-sky">
      <span class="sky-lamp lamp-1"></span>
      <span class="sky-lamp lamp-2"></span>
    </div>
    <div class="cargo-ship">
      <span class="ship-hull"></span>
      <span class="ship-bridge"></span>
      <span class="ship-stack"></span>
      <span class="ship-container"></span>
    </div>
    <div class="tug-boat">
      <span class="tug-hull"></span>
      <span class="tug-cabin"></span>
      <span class="tug-chimney"></span>
      <span class="tug-fender"></span>
    </div>
    <div class="harbor-water"></div>
    <div class="harbor-wake">
      <span class="wake-line line-a"></span>
      <span class="wake-line line-b"></span>
    </div>
  </section>
  <footer class="harbor-foot">
    <span class="harbor-bow">BOW 0.8</span>
    <span class="harbor-push">PUSH</span>
  </footer>
</main>
</body>
</html>
