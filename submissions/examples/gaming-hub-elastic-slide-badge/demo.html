<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CSS Elastic-Slide Badge for Gaming Hub Layouts using EaseMotion CSS." />
    <title>CSS Elastic-Slide Badge for Gaming Hub Layouts</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="dashboard ease-fade-in">
      <header class="dashboard__header ease-slide-up ease-delay-100">
        <h1 class="dashboard__title">Gaming Hub</h1>
        <nav class="dashboard__nav" aria-label="Main Navigation">
          <ul class="dashboard__nav-list">
            <li><a href="#" class="dashboard__nav-link active" aria-current="page">Home</a></li>
            <li><a href="#" class="dashboard__nav-link">Tournaments</a></li>
            <li><a href="#" class="dashboard__nav-link">Leaderboard</a></li>
          </ul>
        </nav>
      </header>

      <section class="hero-card ease-slide-up ease-delay-200" aria-labelledby="game-title">
        <div class="hero-card__bg" aria-hidden="true"></div>
        
        <div class="hero-card__content">
          <div class="hero-card__badge-wrapper ease-fade-in ease-delay-300">
            <!-- Focusable badge to allow keyboard users to experience the elastic slide interaction -->
            <div class="elastic-badge" tabindex="0" role="status" aria-label="Live Status: Broadcasting">
              <span class="elastic-badge__dot" aria-hidden="true"></span>
              <span class="elastic-badge__text">LIVE</span>
            </div>
          </div>
          
          <h2 id="game-title" class="hero-card__game-title ease-slide-up ease-delay-400">Cyber Drift 2077</h2>
          
          <p class="hero-card__status ease-slide-up ease-delay-500">
            Global Championship Finals <span aria-hidden="true">&bull;</span> <strong class="text-neon-cyan">Online</strong>
          </p>
          
          <!-- Semantic description list for structured key-value data -->
          <dl class="hero-card__stats ease-slide-up ease-delay-600">
            <div class="stat-item">
              <dt class="stat-item__label">Players Online</dt>
              <dd class="stat-item__value">142,890</dd>
            </div>
            <div class="stat-item">
              <dt class="stat-item__label">Tournament Stage</dt>
              <dd class="stat-item__value">Quarter-Finals</dd>
            </div>
          </dl>
          
          <div class="hero-card__actions ease-slide-up ease-delay-700">
            <button class="btn btn--primary" type="button">Watch Stream</button>
            <button class="btn btn--secondary" type="button">View Bracket</button>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
