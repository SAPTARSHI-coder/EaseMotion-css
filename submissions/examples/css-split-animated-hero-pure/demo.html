<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Split Animated Hero</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 
      [TECHNIQUE] The Curtain Wrapper
      This container holds the main hero content, but also acts as the 
      relative anchor for the two absolute curtain panels.
    -->
    <div class="hero-wrapper">
        
        <!-- The Left Curtain -->
        <div class="curtain curtain-left" aria-hidden="true"></div>
        
        <!-- The Right Curtain -->
        <div class="curtain curtain-right" aria-hidden="true"></div>
        
        <!-- The Main Hero Content (Revealed underneath) -->
        <main class="hero-content">
            <h1 class="hero-title">Welcome to EaseMotion</h1>
            <p class="hero-subtitle">Pure CSS animations, zero JavaScript overhead.</p>
            <div class="hero-actions">
                <a href="#" class="btn btn-primary">Get Started</a>
                <a href="#" class="btn btn-secondary">View Docs</a>
            </div>
        </main>
        
    </div>

    <!-- Replay button for demonstration purposes only -->
    <div class="demo-controls">
        <p>Refresh the page to replay the load animation.</p>
    </div>

</body>
</html>
