<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fade-In Tabs | EaseMotion CSS</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <h1>🎮 Gaming Hub Fade-In Tabs</h1>
        <p class="subtitle">
            Pure CSS animated tabs with smooth fade-in transitions.
        </p>

        <div class="tabs">

            <input type="radio" name="tab" id="tab1" checked>
            <label for="tab1">Games</label>

            <input type="radio" name="tab" id="tab2">
            <label for="tab2">Players</label>

            <input type="radio" name="tab" id="tab3">
            <label for="tab3">Leaderboard</label>


            <section class="content content1">
                <h2>🎮 Popular Games</h2>
                <p>
                    Explore trending games and latest releases.
                </p>
            </section>

            <section class="content content2">
                <h2>👾 Players</h2>
                <p>
                    Connect with gaming communities and players.
                </p>
            </section>

            <section class="content content3">
                <h2>🏆 Leaderboard</h2>
                <p>
                    Track scores and achievements.
                </p>
            </section>

        </div>

    </main>

</body>
</html>
