<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Pure CSS Holographic Flicker progress bar"
  >
  <title>Holographic Flicker Progress</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="demo">
    <section class="progress-card" aria-labelledby="progress-title">
      <p class="eyebrow">CSS PROGRESS</p>

      <h1 id="progress-title">Holographic Flicker</h1>

      <p class="description">
        A futuristic progress indicator built entirely with HTML and CSS.
      </p>

      <div class="progress-wrapper">
        <div
          class="progress-track"
          role="progressbar"
          aria-label="Project completion"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="72"
        >
          <div class="progress-fill"></div>
          <div class="progress-glare"></div>
        </div>

        <div class="progress-info">
          <span>Project Progress</span>
          <strong>72%</strong>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
