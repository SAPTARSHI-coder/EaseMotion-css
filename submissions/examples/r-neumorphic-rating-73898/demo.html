<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Neumorphic soft shadow CSS rating component">
    <title>Neumorphic Soft Shadow Rating</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="page">
        <section class="rating-card" aria-labelledby="rating-title">
            <div class="rating-icon" aria-hidden="true">★</div>

            <p class="eyebrow">Rating &amp; Feedback</p>
            <h1 id="rating-title">How was your experience?</h1>
            <p class="description">
                Choose a rating to share your feedback.
            </p>

            <fieldset class="rating">
                <legend class="sr-only">Select a rating from 1 to 5 stars</legend>

                <input
                    type="radio"
                    id="rating-5"
                    name="rating"
                    value="5"
                >
                <label for="rating-5" title="5 out of 5 stars">
                    <span aria-hidden="true">★</span>
                    <span class="sr-only">5 stars</span>
                </label>

                <input
                    type="radio"
                    id="rating-4"
                    name="rating"
                    value="4"
                >
                <label for="rating-4" title="4 out of 5 stars">
                    <span aria-hidden="true">★</span>
                    <span class="sr-only">4 stars</span>
                </label>

                <input
                    type="radio"
                    id="rating-3"
                    name="rating"
                    value="3"
                >
                <label for="rating-3" title="3 out of 5 stars">
                    <span aria-hidden="true">★</span>
                    <span class="sr-only">3 stars</span>
                </label>

                <input
                    type="radio"
                    id="rating-2"
                    name="rating"
                    value="2"
                >
                <label for="rating-2" title="2 out of 5 stars">
                    <span aria-hidden="true">★</span>
                    <span class="sr-only">2 stars</span>
                </label>

                <input
                    type="radio"
                    id="rating-1"
                    name="rating"
                    value="1"
                >
                <label for="rating-1" title="1 out of 5 stars">
                    <span aria-hidden="true">★</span>
                    <span class="sr-only">1 star</span>
                </label>
            </fieldset>

            <p class="hint">Use Tab and arrow keys to navigate.</p>
        </section>
    </main>
</body>
</html>
