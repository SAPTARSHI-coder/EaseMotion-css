<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EaseMotion — Speech-to-Text Display</title>
  <link rel="stylesheet" href="../../core/variables.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="demo-container">
    <h1>Speech-to-Text Display</h1>
    <p>Simulated real-time transcription display for conversation partners.</p>

    <div class="transcript-card">
      <div class="transcript-header">
        <span class="ease-badge ease-badge-success">Live</span>
        <span class="speaker-label">Speaker</span>
      </div>
      <div id="transcript" class="transcript-body">
        <span class="transcript-placeholder">Waiting for speech input...</span>
      </div>
      <div class="transcript-footer">
        <button id="startBtn" class="demo-btn">Start Demo</button>
        <span id="status" class="status-text"></span>
      </div>
    </div>

    <div class="transcript-card">
      <div class="transcript-header">
        <span class="ease-badge">History</span>
        <span class="speaker-label">Previous utterances</span>
      </div>
      <div class="transcript-history">
        <div class="history-item">"Hello, how are you today?"</div>
        <div class="history-item">"I'm doing well, thanks for asking."</div>
        <div class="history-item">"Let me show you the demo."</div>
      </div>
    </div>
  </div>

  <script>
    const samples = [
      "This is a real-time speech-to-text transcription display.",
      "Conversation partners can read typed input as it is being processed.",
      "The text appears word by word for natural reading flow.",
      "EdgeMotion CSS provides smooth animations for the transcript."
    ];
    let idx = 0;
    document.getElementById('startBtn').addEventListener('click', function() {
      const el = document.getElementById('transcript');
      const status = document.getElementById('status');
      el.innerHTML = '';
      status.textContent = 'Listening...';
      const text = samples[idx % samples.length];
      idx++;
      let i = 0;
      const interval = setInterval(() => {
        if (i < text.length) {
          el.innerHTML += text[i] === ' ' ? ' ' : text[i];
          i++;
        } else {
          clearInterval(interval);
          status.textContent = 'Done';
          setTimeout(() => { status.textContent = ''; }, 2000);
        }
      }, 40);
    });
  </script>
</body>
</html>
