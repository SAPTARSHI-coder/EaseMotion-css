<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
        name="description"
        content="CSS Fade-In Toast notification for fintech dashboard layouts"
    >
    <title>Fade-In Toast</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="demo-page">
        <section class="toast-demo" aria-label="Fade-in toast example">

            <div class="toast" role="status">
                <div class="toast-icon" aria-hidden="true">
                    ✓
                </div>

                <div class="toast-content">
                    <span class="toast-label">Payment Successful</span>
                    <strong>$2,450.00</strong>
                    <p>Your transaction has been completed successfully.</p>
                </div>

                <button
                    class="toast-close"
                    type="button"
                    aria-label="Close notification"
                >
                    ×
                </button>
            </div>

            <p class="hint">
                A lightweight CSS-only fade-in notification.
            </p>

        </section>
    </main>

</body>
</html>
