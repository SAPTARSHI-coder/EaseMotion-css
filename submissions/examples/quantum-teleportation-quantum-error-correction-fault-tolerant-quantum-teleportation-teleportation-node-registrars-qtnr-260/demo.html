<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teleportation Node Registrars QTNR - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css"></head><body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030712; color: #ffffff;">

    <div class="ease-card ease-card-glass qtnr-container">
        <div class="qtnr-header">
            <h2>Teleportation Node Registrar</h2>
            <span class="ease-badge ease-badge-success">Fault-Tolerant Quantum</span>
        </div>
        
        <div class="qtnr-screen ease-center">
            <div class="qtnr-flux flux-qtnr-a"></div>
            <div class="qtnr-flux flux-qtnr-b"></div>
            <div class="qtnr-boundary-ring"></div>
            <div class="qtnr-core ease-center"></div>
        </div>

        <div class="qtnr-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Distributed Node Topology &amp; Session Registry</span>
            <button class="ease-btn ease-btn-success ease-btn-sm ease-hover-grow">Run Node Registrar</button>
        </div>
    </div></body></html>
