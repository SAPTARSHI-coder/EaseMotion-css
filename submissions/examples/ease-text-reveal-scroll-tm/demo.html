<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Text Reveal on Scroll | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="rev-page">
  <section class="rev-section">
    <h1 class="rev-heading rev-animate" style="--i:0;">Reveal Text</h1>
    <p class="rev-body rev-animate" style="--i:1;">
      Pure CSS text reveal animation that triggers on scroll using intersection observer.
    </p>
  </section>
  <section class="rev-section">
    <h2 class="rev-heading rev-animate" style="--i:2; font-size:2.5rem;">Scroll Down</h2>
    <div class="rev-card rev-animate" style="--i:3;">
      <h3 class="rev-card-title">Animated Card</h3>
      <p class="rev-card-body">This card slides up when it enters the viewport. Pure CSS with custom properties.</p>
    </div>
  </section>
  <script>
    const els = document.querySelectorAll('.rev-animate');
    const obs = new IntersectionObserver(o => {
      o.forEach(e => { if (e.isIntersecting) e.target.style.animationPlayState = 'running'; });
    }, { threshold: 0.2 });
    els.forEach(el => { el.style.animationPlayState = 'paused'; obs.observe(el); });
  </script>
</body>
</html>
