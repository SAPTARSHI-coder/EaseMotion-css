<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EV Charging Handshake Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="ease-ev-charging-handshake-sabya">
    <!-- The main housing shell of the charge port -->
    <div class="port-housing">
      <div class="port-label">EV CHARGE PORT</div>
      
      <!-- The physical plug that will slide in -->
      <div class="connector-latch">
         <div class="plug-head"></div>
      </div>

      <!-- The glowing track where energy travels -->
      <div class="energy-flow-track">
        <div class="energy-dash"></div>
        <div class="energy-dash"></div>
        <div class="energy-dash"></div>
      </div>
    </div>
  </div>
</body>
</html>
