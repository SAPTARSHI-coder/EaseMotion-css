<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Accessible CSS Tic Tac Toe board with animated hover effects."
    >

    <title>CSS Tic Tac Toe | EaseMotion CSS</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="page">
        <section
            class="game-card"
            aria-labelledby="game-title"
        >

            <header class="game-header">
                <p class="eyebrow">EaseMotion CSS</p>

                <h1 id="game-title">Tic Tac Toe</h1>

                <p class="subtitle">
                    A responsive Tic Tac Toe board built entirely with HTML and CSS.
                </p>
            </header>

            <div
                class="game-status"
                role="status"
                aria-live="polite"
            >
                <span class="status-dot" aria-hidden="true"></span>
                Player X's turn
            </div>

            <div
                class="board"
                role="grid"
                aria-label="Tic Tac Toe game board"
            >

                <button
                    class="cell"
                    type="button"
                    role="gridcell"
                    aria-label="Top left, empty"
                >
                    <span aria-hidden="true"></span>
                </button>

                <button
                    class="cell"
                    type="button"
                    role="gridcell"
                    aria-label="Top center, empty"
                >
                    <span aria-hidden="true"></span>
                </button>

                <button
                    class="cell"
                    type="button"
                    role="gridcell"
                    aria-label="Top right, empty"
                >
                    <span aria-hidden="true"></span>
                </button>

                <button
                    class="cell"
                    type="button"
                    role="gridcell"
                    aria-label="Middle left, empty"
                >
                    <span aria-hidden="true"></span>
                </button>

                <button
                    class="cell"
                    type="button"
                    role="gridcell"
                    aria-label="Center, empty"
                >
                    <span aria-hidden="true"></span>
                </button>

                <button
                    class="cell"
                    type="button"
                    role="gridcell"
                    aria-label="Middle right, empty"
                >
                    <span aria-hidden="true"></span>
                </button>

                <button
                    class="cell"
                    type="button"
                    role="gridcell"
                    aria-label="Bottom left, empty"
                >
                    <span aria-hidden="true"></span>
                </button>

                <button
                    class="cell"
                    type="button"
                    role="gridcell"
                    aria-label="Bottom center, empty"
                >
                    <span aria-hidden="true"></span>
                </button>

                <button
                    class="cell"
                    type="button"
                    role="gridcell"
                    aria-label="Bottom right, empty"
                >
                    <span aria-hidden="true"></span>
                </button>

            </div>

            <div class="legend" aria-label="Player symbols">
                <span class="player player-x">
                    <strong>X</strong>
                    Player X
                </span>

                <span class="player player-o">
                    <strong>O</strong>
                    Player O
                </span>
            </div>

            <p class="keyboard-hint">
                Use Tab to move between cells.
            </p>

        </section>
    </main>

</body>
</html>
