<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parallax Depth · multi-layer depth movement</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <div class="parallax-container">
      <div class="parallax-display" id="parallaxDisplay">
        <!-- Parallax Layers -->
        <div class="parallax-layer layer-1" id="layer1" data-depth="0.1">
          <div class="layer-content">
            <span class="layer-emoji">🌌</span>
            <span class="layer-label">Depth 0.1x</span>
          </div>
        </div>
        
        <div class="parallax-layer layer-2" id="layer2" data-depth="0.3">
          <div class="layer-content">
            <span class="layer-emoji">🏔️</span>
            <span class="layer-label">Depth 0.3x</span>
          </div>
        </div>
        
        <div class="parallax-layer layer-3" id="layer3" data-depth="0.6">
          <div class="layer-content">
            <span class="layer-emoji">🌳</span>
            <span class="layer-label">Depth 0.6x</span>
          </div>
        </div>
        
        <div class="parallax-layer layer-4" id="layer4" data-depth="1.0">
          <div class="layer-content">
            <span class="layer-emoji">✨</span>
            <span class="layer-label">Depth 1.0x</span>
          </div>
        </div>
        
        <div class="parallax-layer layer-5" id="layer5" data-depth="1.8">
          <div class="layer-content">
            <span class="layer-emoji">🎯</span>
            <span class="layer-label">Depth 1.8x</span>
          </div>
        </div>

        <!-- Parallax Indicator -->
        <div class="parallax-indicator">
          <div class="parallax-indicator-item">
            <span class="indicator-dot" style="background: #6366f1;"></span>
            <span class="indicator-label">0.1x</span>
          </div>
          <div class="parallax-indicator-item">
            <span class="indicator-dot" style="background: #818cf8;"></span>
            <span class="indicator-label">0.3x</span>
          </div>
          <div class="parallax-indicator-item">
            <span class="indicator-dot" style="background: #a78bfa;"></span>
            <span class="indicator-label">0.6x</span>
          </div>
          <div class="parallax-indicator-item">
            <span class="indicator-dot" style="background: #c4b5fd;"></span>
            <span class="indicator-label">1.0x</span>
          </div>
          <div class="parallax-indicator-item">
            <span class="indicator-dot" style="background: #ddd6fe;"></span>
            <span class="indicator-label">1.8x</span>
          </div>
        </div>
      </div>
      
      <div class="parallax-status">
        <span id="parallaxStatus">🔄 Move mouse to see parallax depth</span>
      </div>
    </div>

    <div class="controls">
      <button class="btn btn-reset" id="resetBtn">⟳ Reset Position</button>
      <button class="btn btn-mode" id="modeBtn">🔄 Toggle Mode</button>
      <button class="btn btn-animate" id="animateBtn">🎬 Auto Parallax</button>
    </div>
    <div class="footer-note">
      <span>🔮 5 layers · different depths · smooth parallax movement</span>
    </div>
  </div>

  <script>
    (function() {
      "use strict";

      // DOM refs
      const parallaxDisplay = document.getElementById('parallaxDisplay');
      const layers = document.querySelectorAll('.parallax-layer');
      const parallaxStatus = document.getElementById('parallaxStatus');
      const resetBtn = document.getElementById('resetBtn');
      const modeBtn = document.getElementById('modeBtn');
      const animateBtn = document.getElementById('animateBtn');

      // State
      let mouseX = 0;
      let mouseY = 0;
      let targetX = 0;
      let targetY = 0;
      let currentX = 0;
      let currentY = 0;
      let mode = 'cursor'; // cursor, reverse, radial, wave
      let isAnimating = false;
      let animationId = null;
      let time = 0;

      // Mode configurations
      const modes = {
        cursor: {
          label: 'Cursor',
          icon: '🖱️',
          description: 'Follows cursor movement'
        },
        reverse: {
          label: 'Reverse',
          icon: '🔄',
          description: 'Opposite cursor direction'
        },
        radial: {
          label: 'Radial',
          icon: '🎯',
          description: 'Radial from center'
        },
        wave: {
          label: 'Wave',
          icon: '🌊',
          description: 'Wave pattern motion'
        }
      };

      // Update parallax
      function updateParallax() {
        // Smooth interpolation
        currentX += (targetX - currentX) * 0.08;
        currentY += (targetY - currentY) * 0.08;

        const maxOffset = 80;

        layers.forEach((layer) => {
          const depth = parseFloat(layer.dataset.depth) || 0.5;
          const offsetX = currentX * maxOffset * depth;
          const offsetY = currentY * maxOffset * depth;
          
          // Apply transform with depth-based scaling
          const scale = 1 + (depth - 0.5) * 0.15;
          const rotation = depth * currentX * 2;
          
          layer.style.transform = `
            translate(${offsetX}px, ${offsetY}px) 
            scale(${scale}) 
            rotate(${rotation}deg)
          `;
          
          // Opacity based on depth
          layer.style.opacity = 0.6 + depth * 0.3;
          
          // Z-index based on depth (higher depth = closer)
          layer.style.zIndex = Math.round(depth * 10);
        });

        // Update status
        const intensity = Math.abs(currentX) + Math.abs(currentY);
        if (intensity > 1.5) {
          parallaxStatus.textContent = '🌀 Parallax active!';
          parallaxStatus.style.color = '#fbbf24';
        } else if (intensity > 0.5) {
          parallaxStatus.textContent = '🌀 Moving...';
          parallaxStatus.style.color = '#818cf8';
        } else {
          parallaxStatus.textContent = '🔄 Move mouse to see parallax depth';
          parallaxStatus.style.color = '#94a3b8';
        }
      }

      // Calculate target position based on mode
      function calculateTarget(e) {
        const rect = parallaxDisplay.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;
        
        let rawX = 0;
        let rawY = 0;

        switch(mode) {
          case 'cursor':
            rawX = (e.clientX - centerX) / (rect.width / 2);
            rawY = (e.clientY - centerY) / (rect.height / 2);
            break;
          case 'reverse':
            rawX = -(e.clientX - centerX) / (rect.width / 2);
            rawY = -(e.clientY - centerY) / (rect.height / 2);
            break;
          case 'radial':
            const dx = e.clientX - centerX;
            const dy = e.clientY - centerY;
            const distance = Math.sqrt(dx*dx + dy*dy);
            const maxDist = Math.sqrt((rect.width/2)*(rect.width/2) + (rect.height/2)*(rect.height/2));
            const normalizedDist = Math.min(distance / maxDist, 1);
            const angle = Math.atan2(dy, dx);
            rawX = Math.cos(angle) * normalizedDist;
            rawY = Math.sin(angle) * normalizedDist;
            break;
          case 'wave':
            rawX = Math.sin(time + e.clientX * 0.01) * 0.8;
            rawY = Math.cos(time + e.clientY * 0.01) * 0.8;
            break;
          default:
            rawX = (e.clientX - centerX) / (rect.width / 2);
            rawY = (e.clientY - centerY) / (rect.height / 2);
        }

        // Clamp
        targetX = Math.max(-1, Math.min(1, rawX));
        targetY = Math.max(-1, Math.min(1, rawY));
      }

      // Handle mouse move
      function handleMouseMove(e) {
        if (isAnimating) return;
        calculateTarget(e);
        updateParallax();
      }

      // Handle mouse leave
      function handleMouseLeave() {
        if (!isAnimating) {
          targetX = 0;
          targetY = 0;
          updateParallax();
        }
      }

      // Reset parallax
      function resetParallax() {
        if (animationId) {
          cancelAnimationFrame(animationId);
          animationId = null;
        }
        isAnimating = false;
        animateBtn.textContent = '🎬 Auto Parallax';
        targetX = 0;
        targetY = 0;
        currentX = 0;
        currentY = 0;
        time = 0;
        updateParallax();
        parallaxStatus.textContent = '🔄 Reset complete';
        parallaxStatus.style.color = '#94a3b8';
        setTimeout(() => {
          parallaxStatus.textContent = '🔄 Move mouse to see parallax depth';
        }, 1000);
      }

      // Toggle mode
      function toggleMode() {
        const modeKeys = Object.keys(modes);
        const currentIndex = modeKeys.indexOf(mode);
        const nextIndex = (currentIndex + 1) % modeKeys.length;
        mode = modeKeys[nextIndex];
        
        const modeData = modes[mode];
        modeBtn.textContent = `🔄 ${modeData.icon} ${modeData.label}`;
        
        parallaxStatus.textContent = `🎯 Mode: ${modeData.label} (${modeData.description})`;
        parallaxStatus.style.color = '#a78bfa';
        
        // Reset to center
        targetX = 0;
        targetY = 0;
        currentX = 0;
        currentY = 0;
        updateParallax();
        
        setTimeout(() => {
          if (!isAnimating) {
            parallaxStatus.textContent = '🔄 Move mouse to see parallax depth';
            parallaxStatus.style.color = '#94a3b8';
          }
        }, 1500);
      }

      // Auto animate
      function autoParallax() {
        if (isAnimating) {
          // Stop animation
          if (animationId) {
            cancelAnimationFrame(animationId);
            animationId = null;
          }
          isAnimating = false;
          animateBtn.textContent = '🎬 Auto Parallax';
          targetX = 0;
          targetY = 0;
          updateParallax();
          return;
        }

        isAnimating = true;
        animateBtn.textContent = '⏹️ Stop';
        time = 0;

        function animate() {
          time += 0.02;
          
          // Sinusoidal motion with different frequencies
          const x = Math.sin(time * 0.7) * 0.8 + Math.sin(time * 1.3) * 0.2;
          const y = Math.cos(time * 0.5) * 0.8 + Math.cos(time * 1.1) * 0.2;
          
          targetX = x;
          targetY = y;
          
          updateParallax();
          
          animationId = requestAnimationFrame(animate);
        }
        
        animate();
      }

      // Event listeners
      parallaxDisplay.addEventListener('mousemove', handleMouseMove);
      parallaxDisplay.addEventListener('mouseleave', handleMouseLeave);

      // Touch support
      let touchX = 0;
      let touchY = 0;

      parallaxDisplay.addEventListener('touchstart', function(e) {
        const touch = e.touches[0];
        touchX = touch.clientX;
        touchY = touch.clientY;
      });

      parallaxDisplay.addEventListener('touchmove', function(e) {
        e.preventDefault();
        if (isAnimating) return;
        const touch = e.touches[0];
        // Create a synthetic mouse event
        const syntheticEvent = {
          clientX: touch.clientX,
          clientY: touch.clientY
        };
        calculateTarget(syntheticEvent);
        updateParallax();
      });

      parallaxDisplay.addEventListener('touchend', function() {
        if (!isAnimating) {
          targetX = 0;
          targetY = 0;
          updateParallax();
        }
      });

      if (resetBtn) {
        resetBtn.addEventListener('click', function(e) {
          e.preventDefault();
          resetParallax();
        });
      }

      if (modeBtn) {
        modeBtn.addEventListener('click', function(e) {
          e.preventDefault();
          toggleMode();
        });
      }

      if (animateBtn) {
        animateBtn.addEventListener('click', function(e) {
          e.preventDefault();
          autoParallax();
        });
      }

      // Keyboard shortcuts
      document.addEventListener('keydown', function(e) {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

        const key = e.key;
        if (key === 'r' || key === 'R') {
          e.preventDefault();
          resetParallax();
        } else if (key === 'm' || key === 'M') {
          e.preventDefault();
          toggleMode();
        } else if (key === 'a' || key === 'A') {
          e.preventDefault();
          autoParallax();
        }
      });

      // Initialize
      updateParallax();
      console.log('🔮 Parallax Depth ready · shortcuts: [R] Reset, [M] Mode, [A] Auto Parallax');
    })();
  </script>
</body>
</html>
