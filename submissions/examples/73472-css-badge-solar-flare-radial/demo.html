<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Solar Flare Radial CSS Badge Component</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="demo-container">
      <header class="demo-header">
        <div class="header-badge">SOLAR DESIGN ENGINE</div>
        <h1 class="demo-title">SOLAR FLARE RADIAL BADGE</h1>
        <p class="demo-subtitle">
          Pure HTML + Vanilla CSS Badge &amp; Action Chip with Glowing Solar
          Dynamics
        </p>
      </header>

      <section class="demo-card">
        <div class="demo-group">
          <h2 class="group-title">Informational Status Badges</h2>
          <div class="badge-row">
            <span class="solar-badge">
              <span class="solar-core-dot" aria-hidden="true"></span>
              <span>Active</span>
            </span>

            <span class="solar-badge badge-featured">
              <span class="solar-core-dot" aria-hidden="true"></span>
              <span>Featured</span>
            </span>

            <span class="solar-badge badge-verified">
              <span class="solar-core-dot" aria-hidden="true"></span>
              <span>Verified</span>
            </span>

            <span class="solar-badge badge-alert">
              <span class="solar-core-dot" aria-hidden="true"></span>
              <span>High Energy</span>
            </span>
          </div>
        </div>

        <div class="demo-group">
          <h2 class="group-title">Interactive Action Chips</h2>
          <div class="instructions-banner">
            <span class="banner-icon">💡</span>
            <span
              >Press <kbd class="solar-kbd">Tab</kbd> to navigate interactive
              chips and trigger solar flare hover/focus states.</span
            >
          </div>
          <div class="badge-row">
            <button type="button" class="solar-badge-btn">
              <span class="solar-core-dot" aria-hidden="true"></span>
              <span>Explore System</span>
            </button>

            <button type="button" class="solar-badge-btn badge-featured">
              <span class="solar-core-dot" aria-hidden="true"></span>
              <span>Launch Probe</span>
            </button>

            <button type="button" class="solar-badge-btn badge-verified">
              <span class="solar-core-dot" aria-hidden="true"></span>
              <span>Sync Data</span>
            </button>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
