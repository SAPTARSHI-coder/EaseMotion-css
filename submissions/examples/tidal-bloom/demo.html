<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tidal Bloom</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="tidal-page">

    <section class="tidal-display" id="tidalDisplay">

      <canvas id="tidalCanvas"></canvas>

      <div class="tidal-header">
        <span class="tidal-title">🌊 Tidal Bloom</span>
        <span class="tidal-subtitle">A living ocean pulse</span>
      </div>

      <div class="tide-info">
        <span class="tide-label">Current Tide</span>
        <span class="tide-value" id="tideValue">50%</span>
      </div>

      <div class="tide-status" id="tideStatus">
        Rising Tide
      </div>

      <div class="tidal-controls">

        <div class="control-group">
          <label for="tideSlider">🌊 Tide Level</label>

          <input
            type="range"
            id="tideSlider"
            min="0"
            max="100"
            value="50"
          >

        </div>

        <div class="button-group">

          <button
            class="tidal-button bloom-button"
            id="bloomButton"
          >
            ✨ Trigger Bloom
          </button>

          <button
            class="tidal-button reset-button"
            id="resetButton"
          >
            ↻ Reset
          </button>

        </div>

      </div>

      <div class="tidal-hint">
        SPACE — Bloom &nbsp; • &nbsp; R — Reset
      </div>

    </section>

  </main>

<script>

const canvas = document.getElementById("tidalCanvas");
const ctx = canvas.getContext("2d");

const slider = document.getElementById("tideSlider");
const tideValue = document.getElementById("tideValue");
const tideStatus = document.getElementById("tideStatus");
const bloomButton = document.getElementById("bloomButton");
const resetButton = document.getElementById("resetButton");

let width;
let height;

let targetTide = 50;
let currentTide = 50;

let pulse = 0;

const particles = [];
const waves = [];

function resizeCanvas() {
  const rect = canvas.getBoundingClientRect();

  width = canvas.width = rect.width * devicePixelRatio;
  height = canvas.height = rect.height * devicePixelRatio;

  ctx.setTransform(
    devicePixelRatio,
    0,
    0,
    devicePixelRatio,
    0,
    0
  );

  width = rect.width;
  height = rect.height;
}

window.addEventListener("resize", resizeCanvas);

resizeCanvas();

class Particle {

  constructor() {
    this.reset();
  }

  reset() {
    this.x = Math.random() * width;
    this.y = Math.random() * height;
    this.size = Math.random() * 2.5 + 0.5;
    this.speed = Math.random() * 0.35 + 0.08;
    this.phase = Math.random() * Math.PI * 2;
    this.wobble = Math.random() * 0.6 + 0.2;
  }

  update() {

    this.y -= this.speed;

    this.x += Math.sin(
      this.phase + this.y * 0.01
    ) * this.wobble * 0.1;

    if (this.y < -10) {
      this.reset();
      this.y = height + 10;
    }
  }

  draw() {

    const alpha =
      0.2 +
      (currentTide / 100) * 0.7;

    ctx.beginPath();

    ctx.arc(
      this.x,
      this.y,
      this.size,
      0,
      Math.PI * 2
    );

    ctx.fillStyle =
      `rgba(120, 240, 255, ${alpha})`;

    ctx.shadowBlur = 10;

    ctx.shadowColor =
      "rgba(80, 230, 255, 0.8)";

    ctx.fill();

    ctx.shadowBlur = 0;
  }
}

class Wave {

  constructor() {
    this.reset();
  }

  reset() {
    this.radius = 20;
    this.alpha = 0.8;
    this.speed =
      Math.random() * 0.7 + 0.5;
    this.phase = Math.random();
  }

  update() {

    this.radius +=
      this.speed *
      (0.5 + currentTide / 100);

    this.alpha -= 0.004;

    if (this.radius > Math.min(width, height) * 0.6) {
      this.reset();
    }
  }

  draw(cx, cy) {

    ctx.beginPath();

    ctx.arc(
      cx,
      cy,
      this.radius,
      0,
      Math.PI * 2
    );

    ctx.strokeStyle =
      `rgba(100, 230, 255, ${this.alpha * 0.25})`;

    ctx.lineWidth = 1.5;

    ctx.stroke();
  }
}

for (let i = 0; i < 45; i++) {
  particles.push(new Particle());
}

for (let i = 0; i < 5; i++) {
  waves.push(new Wave());
}

function lerp(a, b, amount) {
  return a + (b - a) * amount;
}

function getTideState(value) {

  if (value < 25) {
    return "Low Tide";
  }

  if (value < 60) {
    return "Rising Tide";
  }

  if (value < 85) {
    return "High Tide";
  }

  return "Peak Tide";
}

function triggerBloom() {
  pulse = 1;

  for (let i = 0; i < 2; i++) {
    waves.push(new Wave());
  }
}

function resetTide() {

  targetTide = 50;
  slider.value = 50;
}

slider.addEventListener("input", () => {
  targetTide = Number(slider.value);
});

bloomButton.addEventListener(
  "click",
  triggerBloom
);

resetButton.addEventListener(
  "click",
  resetTide
);

document.addEventListener("keydown", event => {

  if (event.code === "Space") {
    event.preventDefault();
    triggerBloom();
  }

  if (
    event.key === "r" ||
    event.key === "R"
  ) {
    resetTide();
  }
});

function drawBackground() {

  const gradient =
    ctx.createLinearGradient(
      0,
      0,
      0,
      height
    );

  gradient.addColorStop(
    0,
    "#061c35"
  );

  gradient.addColorStop(
    0.5,
    "#073957"
  );

  gradient.addColorStop(
    1,
    "#020d1c"
  );

  ctx.fillStyle = gradient;

  ctx.fillRect(
    0,
    0,
    width,
    height
  );
}

function drawBloom(cx, cy) {

  const tideFactor =
    currentTide / 100;

  const baseRadius =
    35 + tideFactor * 70;

  pulse = Math.max(
    0,
    pulse - 0.015
  );

  const radius =
    baseRadius +
    pulse * 45;

  const glow =
    15 +
    tideFactor * 30 +
    pulse * 25;

  const gradient =
    ctx.createRadialGradient(
      cx,
      cy,
      0,
      cx,
      cy,
      radius
    );

  gradient.addColorStop(
    0,
    "rgba(180,255,255,0.95)"
  );

  gradient.addColorStop(
    0.3,
    "rgba(70,230,255,0.65)"
  );

  gradient.addColorStop(
    0.7,
    "rgba(70,160,255,0.18)"
  );

  gradient.addColorStop(
    1,
    "rgba(30,120,220,0)"
  );

  ctx.shadowBlur = glow;

  ctx.shadowColor =
    "rgba(80,230,255,0.9)";

  ctx.fillStyle = gradient;

  ctx.beginPath();

  ctx.arc(
    cx,
    cy,
    radius,
    0,
    Math.PI * 2
  );

  ctx.fill();

  ctx.shadowBlur = 0;

  for (let i = 0; i < 8; i++) {

    const angle =
      (Math.PI * 2 / 8) * i;

    const petalLength =
      radius * (0.8 + tideFactor * 0.4);

    const x =
      cx +
      Math.cos(angle) *
      petalLength;

    const y =
      cy +
      Math.sin(angle) *
      petalLength;

    ctx.beginPath();

    ctx.moveTo(cx, cy);

    ctx.quadraticCurveTo(
      cx +
        Math.cos(angle + 0.4) *
        radius,
      cy +
        Math.sin(angle + 0.4) *
        radius,
      x,
      y
    );

    ctx.strokeStyle =
      `rgba(120,245,255,${0.25 + tideFactor * 0.5})`;

    ctx.lineWidth = 2;

    ctx.stroke();
  }

  ctx.beginPath();

  ctx.arc(
    cx,
    cy,
    7 + tideFactor * 7,
    0,
    Math.PI * 2
  );

  ctx.fillStyle =
    "rgba(220,255,255,0.95)";

  ctx.fill();
}

function animate() {

  currentTide = lerp(
    currentTide,
    targetTide,
    0.05
  );

  tideValue.textContent =
    `${Math.round(currentTide)}%`;

  tideStatus.textContent =
    getTideState(currentTide);

  drawBackground();

  particles.forEach(
    particle => {
      particle.update();
      particle.draw();
    }
  );

  const cx = width / 2;
  const cy = height / 2;

  waves.forEach(wave => {
    wave.update();
    wave.draw(cx, cy);
  });

  drawBloom(cx, cy);

  requestAnimationFrame(animate);
}

animate();

</script>

</body>
</html>
