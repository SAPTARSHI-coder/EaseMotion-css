<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Badge: 3D Perspective Tilt Variation - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="em-demo-container">
        <!-- Pure CSS 3D Perspective Tilt Badge Component Showcase -->
        <header class="em-badge-card" role="region" aria-label="3D Perspective Tilt Badge Showcase" tabindex="0">
            <div class="em-badge-header-bar">
                <span class="em-card-badge">BADGES & CHIPS</span>
                <span class="em-brand-logo">TiltMotion</span>
            </div>
            <h1 class="em-card-title">3D Tilt Badge</h1>
            <p class="em-card-desc">A smooth, accessible, and performant pure CSS badge featuring interactive 3D perspective tilt effects, smooth hardware-accelerated transforms, and frosted glassmorphism.</p>
            <div class="em-badge-wrapper">
                <div class="em-tilt-badge" aria-label="Interactive status element">
                    <span class="em-badge-text">3D PERSPECTIVE</span>
                </div>
            </div>
        </header>
    </div>
</body>
</html>
