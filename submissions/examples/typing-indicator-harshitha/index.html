<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Typing Indicator - CSS (Pure)</title>
    <link rel="stylesheet" href="./style.css" />
  </head>

  <body>
    <main class="page">
      <h1 class="title">Typing Indicator (3 animated dots) - Pure CSS</h1>
      <p class="subtitle">
        Lightweight, responsive, and customizable using CSS variables. No JavaScript.
      </p>

      <section class="demo" aria-label="Typing indicator demos">
        <article class="card">
          <h2 class="card-title">Default</h2>
          <div class="chat-row">
            <div class="avatar" aria-hidden="true"></div>
            <div class="bubble bubble--assistant">
              <div class="ease-typing-indicator-harshitha" role="status" aria-live="polite" aria-label="User is typing">
                <span class="dot" aria-hidden="true"></span>
                <span class="dot" aria-hidden="true"></span>
                <span class="dot" aria-hidden="true"></span>
              </div>
            </div>
          </div>
        </article>

        <article class="card">
          <h2 class="card-title">Custom color + size + speed</h2>
          <div class="chat-row">
            <div class="avatar avatar--alt" aria-hidden="true"></div>
            <div
              class="bubble bubble--assistant"
              style="--ti-color:#22c55e; --ti-dot-size: 0.68rem; --ti-speed: 0.65s; --ti-gap: 0.35rem;"
            >
              <div
                class="ease-typing-indicator-harshitha"
                role="status"
                aria-live="polite"
                aria-label="User is typing"
              >
                <span class="dot" aria-hidden="true"></span>
                <span class="dot" aria-hidden="true"></span>
                <span class="dot" aria-hidden="true"></span>
              </div>
            </div>
          </div>
        </article>
      </section>

      <section class="note" aria-label="Accessibility note">
        <strong>Accessibility:</strong> The indicator uses <code>role="status"</code> and <code>aria-live="polite"</code>.
        Animation respects <code>prefers-reduced-motion</code>.
      </section>
    </main>
  </body>
</html>
