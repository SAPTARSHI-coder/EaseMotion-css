<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EaseMotion - Typing Indicator (Demo)</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div style="font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; padding: 2rem; display: grid; gap: 1rem;">
      <h1 style="margin: 0; font-size: 1.6rem;">Typing Indicator</h1>
      <p style="margin: 0; opacity: 0.8;">Pure CSS animated typing dots.</p>

      <div style="display: grid; gap: 1rem;">
        <div style="display: grid; gap: 0.5rem;">
          <div style="opacity: 0.8;">Default</div>
          <div class="ease-typing-indicator-harshitha" aria-label="Typing" role="status">
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
          </div>
        </div>

        <div style="display: grid; gap: 0.5rem;">
          <div style="opacity: 0.8;">Custom size</div>
          <div class="ease-typing-indicator-harshitha" style="--ease-typing-dot-size: 10px;" aria-label="Typing" role="status">
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
          </div>
        </div>
      </div>

      <div style="opacity: 0.75; font-size: 0.92rem;">
        Tip: Hover/focus not required—animation is purely CSS and respects reduced motion.
      </div>
    </div>
  </body>
</html>
