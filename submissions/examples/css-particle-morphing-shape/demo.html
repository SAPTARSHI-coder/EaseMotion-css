<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Pure CSS morphing shape particle effect"
  >
  <title>CSS Morphing Shape Particle Effect</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="scene" aria-label="Morphing particle animation">
    <div class="particle-field" aria-hidden="true">
      <span class="particle particle-1"></span>
      <span class="particle particle-2"></span>
      <span class="particle particle-3"></span>
      <span class="particle particle-4"></span>
      <span class="particle particle-5"></span>
      <span class="particle particle-6"></span>
      <span class="particle particle-7"></span>
      <span class="particle particle-8"></span>
    </div>

    <section class="content">
      <span class="label">CSS Particle Effect</span>
      <h1>Morphing Shapes</h1>
      <p>
        Organic particles smoothly transform between rounded shapes using
        CSS animations only.
      </p>
    </section>
  </main>
</body>
</html>
