<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Accessible interactive heatmap grid with keyboard-friendly tooltips."
  >
  <title>Interactive Heatmap Grid</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="page">
    <section class="heatmap-card" aria-labelledby="heatmap-title">

      <header class="header">
        <div>
          <p class="eyebrow">ACTIVITY MONITOR</p>
          <h1 id="heatmap-title">Interactive Heatmap</h1>
          <p class="description">
            Explore activity levels by hovering or focusing on each cell.
          </p>
        </div>

        <div class="status" aria-label="System status">
          <span class="status-dot"></span>
          LIVE DATA
        </div>
      </header>

      <div class="heatmap-wrapper">
        <div class="day-labels" aria-hidden="true">
          <span>MON</span>
          <span>TUE</span>
          <span>WED</span>
          <span>THU</span>
          <span>FRI</span>
          <span>SAT</span>
          <span>SUN</span>
        </div>

        <div
          class="heatmap"
          id="heatmap"
          role="grid"
          aria-label="Weekly activity heatmap"
        ></div>
      </div>

      <div class="legend" aria-label="Activity intensity legend">
        <span>LOW</span>

        <div class="legend-scale">
          <span class="level level-0"></span>
          <span class="level level-1"></span>
          <span class="level level-2"></span>
          <span class="level level-3"></span>
          <span class="level level-4"></span>
        </div>

        <span>HIGH</span>
      </div>

      <footer class="footer">
        <span>52 WEEKS</span>
        <span class="separator">•</span>
        <span id="totalActivity">0 ACTIVITIES</span>
      </footer>

    </section>
  </main>

  <script>
    const heatmap = document.getElementById("heatmap");
    const totalActivityElement = document.getElementById("totalActivity");

    const weeks = 52;
    const days = 7;

    let totalActivity = 0;

    function getLevel(value) {
      if (value === 0) return 0;
      if (value <= 3) return 1;
      if (value <= 7) return 2;
      if (value <= 12) return 3;
      return 4;
    }

    for (let week = 0; week < weeks; week++) {
      for (let day = 0; day < days; day++) {

        const activity = Math.floor(Math.random() * 18);

        totalActivity += activity;

        const cell = document.createElement("button");

        cell.type = "button";
        cell.className = `cell level-${getLevel(activity)}`;

        cell.setAttribute("role", "gridcell");
        cell.setAttribute(
          "aria-label",
          `${activity} activities on day ${day + 1}, week ${week + 1}`
        );

        cell.dataset.activity = activity;
        cell.dataset.week = week + 1;
        cell.dataset.day = day + 1;

        const tooltip = document.createElement("span");
        tooltip.className = "tooltip";
        tooltip.setAttribute("role", "tooltip");

        tooltip.textContent =
          `${activity} activit${activity === 1 ? "y" : "ies"} • Week ${week + 1}`;

        cell.appendChild(tooltip);
        heatmap.appendChild(cell);
      }
    }

    totalActivityElement.textContent =
      `${totalActivity.toLocaleString()} ACTIVITIES`;

    const cells = document.querySelectorAll(".cell");

    cells.forEach((cell) => {

      cell.addEventListener("mouseenter", () => {
        cell.classList.add("active");
      });

      cell.addEventListener("mouseleave", () => {
        cell.classList.remove("active");
      });

      cell.addEventListener("focus", () => {
        cell.classList.add("active");
      });

      cell.addEventListener("blur", () => {
        cell.classList.remove("active");
      });
    });
  </script>
</body>
</html>
