<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pulse Badge Component</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="badge-container">
        <div class="ease-badge-pulse ease-badge-success">
            <span class="ease-badge-pulse-dot"></span>
            <span>Live Server</span>
        </div>

        <div class="ease-badge-pulse ease-badge-warning">
            <span class="ease-badge-pulse-dot"></span>
            <span>Maintenance</span>
        </div>
    </div>

</body>
</html>
