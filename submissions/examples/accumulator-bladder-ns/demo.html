<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accumulator Bladder — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Accumulator Bladder demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Accumulator Bladder</h1>
      <p class="lede">Hydraulic accumulator bladder compressing and recovering</p>
    </header>

    <section class="ease-accumulator-bladder" data-demo="accumulator-bladder" aria-live="polite">
      <div class="ease-accumulator-bladder__housing">
        <div class="ease-accumulator-bladder__bezel">
          <div class="ease-accumulator-bladder__face">
            <div class="ease-accumulator-bladder__readout">
              <span class="ease-accumulator-bladder__label">Accumulator Bladder</span>
              <span class="ease-accumulator-bladder__value">LIVE</span>
            </div>
            <div class="ease-accumulator-bladder__motion" aria-hidden="true">
              <span class="ease-accumulator-bladder__a"></span>
              <span class="ease-accumulator-bladder__b"></span>
              <span class="ease-accumulator-bladder__c"></span>
              <span class="ease-accumulator-bladder__d"></span>
            </div>
            <div class="ease-accumulator-bladder__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-accumulator-bladder__controls">
          <button type="button" class="ease-accumulator-bladder__btn primary">Engage</button>
          <button type="button" class="ease-accumulator-bladder__btn">Reset</button>
          <label class="ease-accumulator-bladder__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-accumulator-bladder__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
