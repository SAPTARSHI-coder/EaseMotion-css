<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
Glassmorphic Floating Toast Notification
</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<main class="container">


<section class="hero">

<h1>
Glass Toast Alert
</h1>

<p>
Floating notification with auto dismiss timer
</p>


<button id="showToast">
Show Notification
</button>


</section>



<div class="toast" id="toast">


<div class="icon">
✓
</div>


<div class="message">

<h3>
Success
</h3>

<p>
Your request was completed successfully.
</p>


<div class="progress"></div>


</div>



<button id="closeToast">
×
</button>


</div>



</main>


<script src="script.js"></script>


</body>

</html>
