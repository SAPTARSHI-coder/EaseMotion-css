<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-hospital-heart-monitor demo</title>
</head>
<body>
<div class="hhm-monitor">
  <span class="hhm-label">PATIENT A</span>
  <div class="hhm-screen">
    <svg class="hhm-trace" viewBox="0 0 320 96" preserveAspectRatio="none">
      <polyline points="0,60 30,60 40,54 46,66 56,20 64,80 74,52 96,52 104,60 320,60" fill="none"/>
    </svg>
    <span class="hhm-lead">LEAD II</span>
  </div>
  <div class="hhm-readout">
    <span class="hhm-vital"><b>HR</b> 72</span>
    <span class="hhm-vital"><b>O2</b> 98</span>
    <span class="hhm-vital"><b>BP</b> 120/80</span>
  </div>
  <span class="hhm-alarm">ALARM STANDBY</span>
</div>
</body>
</html>
