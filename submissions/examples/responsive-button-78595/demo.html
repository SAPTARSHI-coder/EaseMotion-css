<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Responsive button showcase for EaseMotion CSS issue #78595."
    />
    <title>Responsive Button | EaseMotion CSS</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="page">
      <section class="card" aria-labelledby="page-title">
        <p class="eyebrow">EaseMotion CSS · Issue #78595</p>

        <h1 id="page-title">Make something beautiful</h1>

        <p class="intro">
          Pastel actions with flexible spacing that stays comfortable across
          desktop and mobile screens.
        </p>

        <div class="actions" aria-label="Example actions">
          <button type="button" class="primary">Get started</button>
          <button type="button" class="secondary">Learn more</button>
          <button type="button" class="secondary" disabled>Unavailable</button>
        </div>

        <p class="hint">
          Resize the viewport and use Tab to inspect responsive and focus states.
        </p>
      </section>
    </main>
  </body>
</html>
