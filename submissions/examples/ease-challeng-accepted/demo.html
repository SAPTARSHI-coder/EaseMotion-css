<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Challenge Accepted · transform into challenge mode</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <div class="challenge-container">
      <!-- Challenge Mode Display -->
      <div class="challenge-display" id="challengeDisplay">
        <!-- Default State -->
        <div class="challenge-default" id="challengeDefault">
          <div class="challenge-icon">🏆</div>
          <div class="challenge-title">Ready for Challenge</div>
          <div class="challenge-subtitle">Click to accept</div>
        </div>
        
        <!-- Challenge Active State -->
        <div class="challenge-active" id="challengeActive">
          <div class="challenge-active-icon">⚔️</div>
          <div class="challenge-active-title" id="challengeTitle">Challenge Accepted!</div>
          <div class="challenge-active-subtitle" id="challengeSubtitle">Mode: Normal</div>
          <div class="challenge-stats">
            <div class="stat">
              <span class="stat-label">⚡ Power</span>
              <span class="stat-value" id="powerStat">100</span>
            </div>
            <div class="stat">
              <span class="stat-label">🛡️ Defense</span>
              <span class="stat-value" id="defenseStat">80</span>
            </div>
            <div class="stat">
              <span class="stat-label">⭐ Level</span>
              <span class="stat-value" id="levelStat">1</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Transformation Effects -->
      <div class="transformation-effects" id="transformationEffects">
        <div class="effect-particle" id="effectParticle1"></div>
        <div class="effect-particle" id="effectParticle2"></div>
        <div class="effect-particle" id="effectParticle3"></div>
        <div class="effect-particle" id="effectParticle4"></div>
        <div class="effect-particle" id="effectParticle5"></div>
        <div class="effect-particle" id="effectParticle6"></div>
        <div class="effect-particle" id="effectParticle7"></div>
        <div class="effect-particle" id="effectParticle8"></div>
      </div>
      
      <div class="challenge-status">
        <span id="challengeStatus">🔓 Click to accept challenge</span>
      </div>
    </div>

    <div class="controls">
      <button class="btn btn-accept" id="acceptBtn">⚔️ Accept Challenge</button>
      <button class="btn btn-mode" id="modeBtn">🔄 Change Mode</button>
      <button class="btn btn-reset" id="resetBtn">⟳ Reset</button>
    </div>
    <div class="footer-note">
      <span>⚔️ transforms into challenge mode · epic effects · 3 challenge types</span>
    </div>
  </div>

  <script>
    (function() {
      "use strict";

      // DOM refs
      const challengeDisplay = document.getElementById('challengeDisplay');
      const challengeDefault = document.getElementById('challengeDefault');
      const challengeActive = document.getElementById('challengeActive');
      const challengeTitle = document.getElementById('challengeTitle');
      const challengeSubtitle = document.getElementById('challengeSubtitle');
      const challengeStatus = document.getElementById('challengeStatus');
      const powerStat = document.getElementById('powerStat');
      const defenseStat = document.getElementById('defenseStat');
      const levelStat = document.getElementById('levelStat');
      const acceptBtn = document.getElementById('acceptBtn');
      const modeBtn = document.getElementById('modeBtn');
      const resetBtn = document.getElementById('resetBtn');
      const effectsContainer = document.getElementById('transformationEffects');

      // State
      let isActive = false;
      let modeIndex = 0;
      let level = 1;

      // Challenge modes
      const modes = [
        {
          name: 'Normal',
          icon: '⚔️',
          power: 100,
          defense: 80,
          color: '#6366f1',
          subtitle: 'Mode: Normal',
          description: 'Standard challenge mode'
        },
        {
          name: 'Heroic',
          icon: '🦸',
          power: 150,
          defense: 100,
          color: '#f59e0b',
          subtitle: 'Mode: Heroic ⭐',
          description: 'Heroic challenge mode'
        },
        {
          name: 'Legendary',
          icon: '👑',
          power: 200,
          defense: 150,
          color: '#ec4899',
          subtitle: 'Mode: Legendary 👑',
          description: 'Legendary challenge mode'
        }
      ];

      // Create transformation particles
      function createTransformationParticles() {
        const particles = effectsContainer.querySelectorAll('.effect-particle');
        particles.forEach((particle, index) => {
          // Reset particle
          particle.style.opacity = '0';
          particle.style.transform = 'scale(0)';
          
          // Randomize position
          const angle = Math.random() * Math.PI * 2;
          const distance = 100 + Math.random() * 150;
          const x = Math.cos(angle) * distance;
          const y = Math.sin(angle) * distance;
          
          particle.style.setProperty('--tx', x + 'px');
          particle.style.setProperty('--ty', y + 'px');
          
          // Random size
          const size = 20 + Math.random() * 40;
          particle.style.width = size + 'px';
          particle.style.height = size + 'px';
          
          // Random color from mode
          const mode = modes[modeIndex];
          const colors = [
            mode.color,
            mode.color + '88',
            '#ffffff',
            '#fbbf24',
            '#a78bfa'
          ];
          particle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
          
          // Random shape
          if (Math.random() > 0.5) {
            particle.style.clipPath = 'polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%)';
            particle.style.borderRadius = '0';
          } else {
            particle.style.clipPath = 'none';
            particle.style.borderRadius = '50%';
          }
          
          // Trigger animation with delay
          setTimeout(() => {
            particle.style.opacity = '1';
            particle.style.transform = 'scale(1)';
            particle.style.animation = `particle-burst ${0.6 + Math.random() * 0.4}s ease-out forwards`;
          }, index * 80);
        });
      }

      // Clear particles
      function clearParticles() {
        const particles = effectsContainer.querySelectorAll('.effect-particle');
        particles.forEach(particle => {
          particle.style.opacity = '0';
          particle.style.transform = 'scale(0)';
          particle.style.animation = 'none';
        });
      }

      // Transform to challenge mode
      function transformToChallenge() {
        if (isActive) return;
        isActive = true;

        const mode = modes[modeIndex];

        // Update status
        challengeStatus.textContent = `⚔️ ${mode.name} Mode Activated!`;
        challengeStatus.style.color = mode.color;

        // Hide default, show active
        challengeDefault.style.opacity = '0';
        challengeDefault.style.transform = 'scale(0.8)';
        setTimeout(() => {
          challengeDefault.style.display = 'none';
          challengeActive.style.display = 'flex';
          // Trigger active animation
          setTimeout(() => {
            challengeActive.classList.add('active');
          }, 50);
        }, 300);

        // Update challenge content
        challengeTitle.textContent = `Challenge Accepted!`;
        challengeTitle.style.color = mode.color;
        challengeSubtitle.textContent = mode.subtitle;
        challengeSubtitle.style.color = mode.color;

        // Update stats with animation
        const currentPower = parseInt(powerStat.textContent);
        const currentDefense = parseInt(defenseStat.textContent);
        const currentLevel = parseInt(levelStat.textContent);

        // Animate stats
        animateStat(powerStat, currentPower, mode.power);
        animateStat(defenseStat, currentDefense, mode.defense);
        levelStat.textContent = level;

        // Create transformation particles
        createTransformationParticles();

        // Update button
        acceptBtn.textContent = '⚔️ Challenge Active';
        acceptBtn.style.background = `linear-gradient(135deg, ${mode.color}, ${mode.color}dd)`;
        acceptBtn.style.borderColor = mode.color;

        // Update mode button
        modeBtn.textContent = `🔄 ${mode.icon} ${mode.name}`;

        // Play sound effect (visual only)
        challengeDisplay.style.transition = 'all 0.3s ease';
      }

      // Animate stat change
      function animateStat(element, from, to) {
        const duration = 800;
        const startTime = Date.now();
        
        function update() {
          const elapsed = Date.now() - startTime;
          const progress = Math.min(elapsed / duration, 1);
          
          // Ease out cubic
          const eased = 1 - Math.pow(1 - progress, 3);
          const current = Math.round(from + (to - from) * eased);
          
          element.textContent = current;
          
          // Scale animation
          element.style.transform = 'scale(1.3)';
          element.style.color = modes[modeIndex].color;
          setTimeout(() => {
            element.style.transform = 'scale(1)';
          }, 100);
          
          if (progress < 1) {
            requestAnimationFrame(update);
          } else {
            element.textContent = to;
            element.style.color = '#e2e8f0';
          }
        }
        
        update();
      }

      // Revert to default
      function revertToDefault() {
        if (!isActive) return;
        isActive = false;

        // Hide active, show default
        challengeActive.classList.remove('active');
        challengeActive.style.display = 'none';
        challengeDefault.style.display = 'flex';
        setTimeout(() => {
          challengeDefault.style.opacity = '1';
          challengeDefault.style.transform = 'scale(1)';
        }, 100);

        // Clear particles
        clearParticles();

        // Reset status
        challengeStatus.textContent = '🔓 Click to accept challenge';
        challengeStatus.style.color = '#94a3b8';

        // Reset button
        acceptBtn.textContent = '⚔️ Accept Challenge';
        acceptBtn.style.background = 'linear-gradient(135deg, #6366f1, #4f46e5)';
        acceptBtn.style.borderColor = '#818cf8';

        // Reset stats
        powerStat.textContent = '100';
        defenseStat.textContent = '80';
        levelStat.textContent = '1';
        level = 1;

        // Reset mode button
        const mode = modes[modeIndex];
        modeBtn.textContent = `🔄 ${mode.icon} ${mode.name}`;
      }

      // Change mode
      function changeMode() {
        modeIndex = (modeIndex + 1) % modes.length;
        const mode = modes[modeIndex];
        
        if (isActive) {
          // Update active challenge with new mode
          challengeTitle.textContent = `Challenge Accepted!`;
          challengeTitle.style.color = mode.color;
          challengeSubtitle.textContent = mode.subtitle;
          challengeSubtitle.style.color = mode.color;
          
          // Update stats
          const currentPower = parseInt(powerStat.textContent);
          const currentDefense = parseInt(defenseStat.textContent);
          animateStat(powerStat, currentPower, mode.power);
          animateStat(defenseStat, currentDefense, mode.defense);
          
          // Update colors
          acceptBtn.style.background = `linear-gradient(135deg, ${mode.color}, ${mode.color}dd)`;
          acceptBtn.style.borderColor = mode.color;
          
          // Create new particles
          clearParticles();
          setTimeout(() => {
            createTransformationParticles();
          }, 100);
          
          // Update status
          challengeStatus.textContent = `⚔️ ${mode.name} Mode Activated!`;
          challengeStatus.style.color = mode.color;
        } else {
          // Update default display
          challengeStatus.textContent = `🔓 Mode: ${mode.name} (${mode.description})`;
          challengeStatus.style.color = mode.color;
          setTimeout(() => {
            challengeStatus.textContent = '🔓 Click to accept challenge';
            challengeStatus.style.color = '#94a3b8';
          }, 2000);
        }
        
        modeBtn.textContent = `🔄 ${mode.icon} ${mode.name}`;
      }

      // Reset everything
      function resetChallenge() {
        if (isActive) {
          revertToDefault();
        }
        modeIndex = 0;
        level = 1;
        const mode = modes[0];
        modeBtn.textContent = `🔄 ${mode.icon} ${mode.name}`;
        challengeStatus.textContent = '🔄 Reset complete';
        challengeStatus.style.color = '#94a3b8';
        setTimeout(() => {
          challengeStatus.textContent = '🔓 Click to accept challenge';
        }, 1500);
        clearParticles();
      }

      // Event listeners
      if (acceptBtn) {
        acceptBtn.addEventListener('click', function(e) {
          e.preventDefault();
          if (isActive) {
            // Level up
            level++;
            levelStat.textContent = level;
            challengeStatus.textContent = `⭐ Level Up! Now Level ${level}`;
            challengeStatus.style.color = '#fbbf24';
            
            // Create celebration particles
            clearParticles();
            setTimeout(() => {
              createTransformationParticles();
            }, 100);
            
            setTimeout(() => {
              const mode = modes[modeIndex];
              challengeStatus.textContent = `⚔️ ${mode.name} Mode Active - Level ${level}`;
              challengeStatus.style.color = mode.color;
            }, 1500);
          } else {
            transformToChallenge();
          }
        });
      }

      if (modeBtn) {
        modeBtn.addEventListener('click', function(e) {
          e.preventDefault();
          changeMode();
        });
      }

      if (resetBtn) {
        resetBtn.addEventListener('click', function(e) {
          e.preventDefault();
          resetChallenge();
        });
      }

      // Keyboard shortcuts
      document.addEventListener('keydown', function(e) {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

        const key = e.key;
        if (key === 'a' || key === 'A') {
          e.preventDefault();
          acceptBtn.click();
        } else if (key === 'm' || key === 'M') {
          e.preventDefault();
          changeMode();
        } else if (key === 'r' || key === 'R') {
          e.preventDefault();
          resetChallenge();
        }
      });

      // Initialize
      challengeDefault.style.display = 'flex';
      challengeActive.style.display = 'none';
      console.log('⚔️ Challenge Accepted ready · shortcuts: [A]ccept, [M]ode, [R] Reset');
    })();
  </script>
</body>
</html>
