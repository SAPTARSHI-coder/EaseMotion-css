<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gallery Caption &mdash; EaseMotion CSS Demo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="page-head">
    <p class="kicker">EaseMotion CSS &middot; Media &amp; Gallery</p>
    <h1>Gallery Caption</h1>
    <p class="sub">A tidy photo grid with captions that rise up from the bottom edge.</p>
  </header>
  <main class="stage">
    <div class="gc-grid">
      <div class="gc-item"><div class="art gc-art1"></div><div class="cap">Indigo Bloom</div></div>
      <div class="gc-item"><div class="art gc-art2"></div><div class="cap">Deep Azure</div></div>
      <div class="gc-item"><div class="art gc-art3"></div><div class="cap">Rose Ember</div></div>
      <div class="gc-item"><div class="art gc-art4"></div><div class="cap">Lagoon</div></div>
      <div class="gc-item"><div class="art gc-art5"></div><div class="cap">Amber Field</div></div>
      <div class="gc-item"><div class="art gc-art6"></div><div class="cap">Violet Noon</div></div>
    </div>
  </main>
  <p class="stage-caption">Hover any tile to reveal its caption and a gentle zoom.</p>
  <footer class="page-foot">
    <span>Pure CSS &middot; zero dependencies</span>
    <span>Caption slide-up</span>
  </footer>
</body>
</html>
