<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Bounce-Pulse Navbar</title>
  <link rel="stylesheet" href="../../../easemotion.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="bounce-navbar">
    <div class="navbar-container">
      <a href="#" class="logo">SaaS<span>App</span></a>
      
      <!-- Hamburger menu for mobile without JS -->
      <input type="checkbox" id="menu-toggle" class="menu-toggle">
      <label for="menu-toggle" class="hamburger" aria-label="Toggle Navigation">
        <span></span>
        <span></span>
        <span></span>
      </label>

      <ul class="nav-links">
        <li><a href="#" class="nav-link">Product</a></li>
        <li><a href="#" class="nav-link">Solutions</a></li>
        <li><a href="#" class="nav-link">Resources</a></li>
        <li><a href="#" class="nav-link">Pricing</a></li>
        <li><a href="#" class="btn pulse-btn">Start Free Trial</a></li>
      </ul>
    </div>
  </nav>

  <main style="padding: 4rem 2rem; text-align: center; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
    <h1 style="font-size: 3rem; margin-bottom: 1rem;">Bounce-Pulse Navbar</h1>
    <p style="font-size: 1.25rem; color: #6b7280; max-width: 600px; margin: 0 auto;">
      Hover over the links to see a playful bounce effect, and notice the continuous inviting pulse on the main call-to-action button.
    </p>
  </main>
</body>
</html>
