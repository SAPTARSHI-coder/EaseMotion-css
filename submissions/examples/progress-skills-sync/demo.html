<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skills Progress Bars</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Skills Progress Bars Demo</h1>
  <div class="skills" role="region" aria-label="Skill proficiency bars">
    <div class="skill">
      <span class="label">HTML</span>
      <div class="progress" aria-valuenow="90" aria-valuemin="0" aria-valuemax="100">
        <div class="progress-bar" style="width:90%">90%</div>
      </div>
    </div>
    <div class="skill">
      <span class="label">CSS</span>
      <div class="progress" aria-valuenow="80" aria-valuemin="0" aria-valuemax="100">
        <div class="progress-bar" style="width:80%">80%</div>
      </div>
    </div>
    <div class="skill">
      <span class="label">JavaScript</span>
      <div class="progress" aria-valuenow="70" aria-valuemin="0" aria-valuemax="100">
        <div class="progress-bar" style="width:70%">70%</div>
      </div>
    </div>
  </div>
</body>
</html>
