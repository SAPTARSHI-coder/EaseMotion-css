<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Rubik Cube Loader - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
  <style>
    :root {
      --bg-color: #090d16;
      --card-bg: #111827;
      --border-color: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    [data-theme="light"] {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --border-color: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #64748b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .demo-container {
      max-width: 640px;
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 2.5rem 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
    }

    .demo-header {
      text-align: center;
    }

    .demo-header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      margin-bottom: 0.5rem;
    }

    .demo-header p {
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    .loader-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      padding: 2rem;
      width: 100%;
    }

    .loader-label {
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text-muted);
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .theme-toggle {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 0.5rem 1rem;
      border-radius: 8px;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }

    .theme-toggle:hover {
      background: rgba(255, 255, 255, 0.05);
    }

    .theme-toggle:focus-visible {
      outline: 2px solid #3b82f6;
      outline-offset: 2px;
    }
  </style>
</head>

<body>
  <div class="demo-container">
    <div class="demo-header">
      <h1>Rubik Cube Loader</h1>
      <p>Pure CSS 3D animated loader for EaseMotion CSS</p>
    </div>

    <div class="loader-card">
      <div class="ease-rubik-wrapper" role="status" aria-live="polite">
        <div class="ease-rubik-cube">
          <div class="ease-rubik-face ease-rubik-front">
            <span class="ease-rubik-tile"></span><span class="ease-rubik-tile"></span><span
              class="ease-rubik-tile"></span>
            <span class="ease-rubik-tile"></span><span class="ease-rubik-tile"></span><span
              class="ease-rubik-tile"></span>
            <span class="ease-rubik-tile"></span><span class="ease-rubik-tile"></span><span
              class="ease-rubik-tile"></span>
          </div>
          <div class="ease-rubik-face ease-rubik-back">
            <span class="ease-rubik-tile"></span><span class="ease-rubik-tile"></span><span
              class="ease-rubik-tile"></span>
            <span class="ease-rubik-tile"></span><span class="ease-rubik-tile"></span><span
              class="ease-rubik-tile"></span>
            <span class="ease-rubik-tile"></span><span class="ease-rubik-tile"></span><span
              class="ease-rubik-tile"></span>
          </div>
          <div class="ease-rubik-face ease-rubik-right">
            <span class="ease-rubik-tile"></span><span class="ease-rubik-tile"></span><span
              class="ease-rubik-tile"></span>
            <span class="ease-rubik-tile"></span><span class="ease-rubik-tile"></span><span
              class="ease-rubik-tile"></span>
            <span class="ease-rubik-tile"></span><span class="ease-rubik-tile"></span><span
              class="ease-rubik-tile"></span>
          </div>
          <div class="ease-rubik-face ease-rubik-left">
            <span class="ease-rubik-tile"></span><span class="ease-rubik-tile"></span><span
              class="ease-rubik-tile"></span>
            <span class="ease-rubik-tile"></span><span class="ease-rubik-tile"></span><span
              class="ease-rubik-tile"></span>
            <span class="ease-rubik-tile"></span><span class="ease-rubik-tile"></span><span
              class="ease-rubik-tile"></span>
          </div>
          <div class="ease-rubik-face ease-rubik-top">
            <span class="ease-rubik-tile"></span><span class="ease-rubik-tile"></span><span
              class="ease-rubik-tile"></span>
            <span class="ease-rubik-tile"></span><span class="ease-rubik-tile"></span><span
              class="ease-rubik-tile"></span>
            <span class="ease-rubik-tile"></span><span class="ease-rubik-tile"></span><span
              class="ease-rubik-tile"></span>
          </div>
          <div class="ease-rubik-face ease-rubik-bottom">
            <span class="ease-rubik-tile"></span><span class="ease-rubik-tile"></span><span
              class="ease-rubik-tile"></span>
            <span class="ease-rubik-tile"></span><span class="ease-rubik-tile"></span><span
              class="ease-rubik-tile"></span>
            <span class="ease-rubik-tile"></span><span class="ease-rubik-tile"></span><span
              class="ease-rubik-tile"></span>
          </div>
        </div>
        <span class="ease-rubik-sr-only">Loading, please wait...</span>
      </div>
      <span class="loader-label">Loading resources....</span>
    </div>

    <button class="theme-toggle"
      onclick="document.documentElement.setAttribute('data-theme', document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light')">
      Toggle Light / Dark Mode
    </button>
  </div>
</body>

</html>
