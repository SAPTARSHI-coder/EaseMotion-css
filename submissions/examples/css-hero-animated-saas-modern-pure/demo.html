<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaaS Modern Animated Hero</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <section class="hero-section">
        
        <!-- Abstract Animated Background Elements -->
        <div class="bg-shape shape-1"></div>
        <div class="bg-shape shape-2"></div>
        <div class="grid-overlay"></div>

        <div class="hero-container">
            
            <div class="hero-content">
                
                <div class="badge fade-up delay-1">
                    <span class="badge-dot"></span>
                    Announcing EaseMotion 2.0
                </div>

                <h1 class="hero-title fade-up delay-2">
                    Build software <br>
                    <span class="text-gradient">at the speed of light.</span>
                </h1>

                <p class="hero-subtitle fade-up delay-3">
                    The modern platform for high-velocity engineering teams. Ship faster, scale infinitely, and monitor everything in real-time.
                </p>

                <div class="hero-actions fade-up delay-4">
                    <a href="#" class="btn btn-primary">
                        Start for free
                        <svg viewBox="0 0 24 24" class="btn-icon"><path d="M5 12h14M12 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    </a>
                    <a href="#" class="btn btn-secondary">Book a demo</a>
                </div>
                
                <div class="social-proof fade-up delay-5">
                    <p>Trusted by innovative teams worldwide</p>
                    <div class="avatar-group">
                        <img src="https://i.pravatar.cc/100?img=1" alt="User 1" class="avatar">
                        <img src="https://i.pravatar.cc/100?img=2" alt="User 2" class="avatar">
                        <img src="https://i.pravatar.cc/100?img=3" alt="User 3" class="avatar">
                        <img src="https://i.pravatar.cc/100?img=4" alt="User 4" class="avatar">
                        <div class="avatar more">+2k</div>
                    </div>
                </div>

            </div>
            
            <!-- Dashboard Mockup -->
            <div class="hero-visual fade-in-scale delay-6">
                <div class="dashboard-mockup">
                    <div class="mockup-header">
                        <div class="traffic-lights">
                            <span></span><span></span><span></span>
                        </div>
                    </div>
                    <div class="mockup-body">
                        <div class="skeleton-chart">
                            <div class="bar" style="height: 40%"></div>
                            <div class="bar" style="height: 60%"></div>
                            <div class="bar" style="height: 30%"></div>
                            <div class="bar" style="height: 80%"></div>
                            <div class="bar" style="height: 50%"></div>
                            <div class="bar" style="height: 100%"></div>
                            <div class="bar" style="height: 70%"></div>
                        </div>
                        <div class="skeleton-text-group">
                            <div class="skeleton-line w-100"></div>
                            <div class="skeleton-line w-75"></div>
                            <div class="skeleton-line w-50"></div>
                        </div>
                    </div>
                </div>
                
                <!-- Floating Elements over mockup -->
                <div class="floating-card float-1">
                    <div class="icon-box green">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                    </div>
                    <div class="card-text">
                        <span class="card-title">Deploy Successful</span>
                        <span class="card-sub">Just now</span>
                    </div>
                </div>
                
            </div>

        </div>

    </section>

</body>
</html>
