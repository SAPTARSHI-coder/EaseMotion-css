<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fluid Dynamic Audio Equalizer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="player-card">

    <h1>Now Playing</h1>

    <p>Cyber Dreams • Synthwave Mix</p>

    <div class="equalizer">

        <span class="bar" style="--delay:0s"></span>
        <span class="bar" style="--delay:.1s"></span>
        <span class="bar" style="--delay:.2s"></span>
        <span class="bar" style="--delay:.3s"></span>
        <span class="bar" style="--delay:.4s"></span>
        <span class="bar" style="--delay:.5s"></span>
        <span class="bar" style="--delay:.6s"></span>
        <span class="bar" style="--delay:.7s"></span>
        <span class="bar" style="--delay:.8s"></span>
        <span class="bar" style="--delay:.9s"></span>

    </div>

    <button>▶ Playing</button>

</div>

</body>
</html>
