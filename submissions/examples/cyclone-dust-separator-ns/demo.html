<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyclone Dust Separator — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Cyclone Dust Separator demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Cyclone Dust Separator</h1>
      <p class="lede">Workshop cyclone separator spinning dust downward</p>
    </header>

    <section class="ease-cyclone-dust-separator" data-demo="cyclone-dust-separator" aria-live="polite">
      <div class="ease-cyclone-dust-separator__housing">
        <div class="ease-cyclone-dust-separator__bezel">
          <div class="ease-cyclone-dust-separator__face">
            <div class="ease-cyclone-dust-separator__readout">
              <span class="ease-cyclone-dust-separator__label">Cyclone Dust Separator</span>
              <span class="ease-cyclone-dust-separator__value">LIVE</span>
            </div>
            <div class="ease-cyclone-dust-separator__motion" aria-hidden="true">
              <span class="ease-cyclone-dust-separator__a"></span>
              <span class="ease-cyclone-dust-separator__b"></span>
              <span class="ease-cyclone-dust-separator__c"></span>
              <span class="ease-cyclone-dust-separator__d"></span>
            </div>
            <div class="ease-cyclone-dust-separator__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-cyclone-dust-separator__controls">
          <button type="button" class="ease-cyclone-dust-separator__btn primary">Engage</button>
          <button type="button" class="ease-cyclone-dust-separator__btn">Reset</button>
          <label class="ease-cyclone-dust-separator__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-cyclone-dust-separator__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
