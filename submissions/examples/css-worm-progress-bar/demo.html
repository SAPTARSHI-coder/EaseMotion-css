<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Worm Progress Bar | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <article class="demo-card">
      <header class="card-header">
        <div>
          <h1 class="card-title">System Diagnostics</h1>
          <p class="card-subtitle">Crawling node clusters for integrity check</p>
        </div>
        <span class="status-badge">Live Crawl</span>
      </header>

      <!-- Accessible Worm Progress Bar -->
      <div 
        class="worm-track-container" 
        role="progressbar" 
        aria-valuenow="70" 
        aria-valuemin="0" 
        aria-valuemax="100" 
        aria-label="Node cluster scanning progress"
      >
        <div class="worm" aria-hidden="true"></div>
      </div>

      <footer class="card-footer">
        <div class="indicator">
          <span class="pulse-dot" aria-hidden="true"></span>
          <span>Scanning worker_03...</span>
        </div>
        <span>Active Track</span>
      </footer>
    </article>
  </main>
</body>
</html>
