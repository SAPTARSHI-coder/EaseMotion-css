<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Route Map Line</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="layout-container">
        
        <header class="section-header">
            <h1 class="title">Pure CSS Route Map Line</h1>
            <p class="subtitle">An animated dashed line tracing a route across a map, powered entirely by CSS <code>stroke-dashoffset</code> keyframe animations on an SVG path.</p>
        </header>

        <div class="demo-area">
            
            <div class="map-container" aria-label="A stylized map showing an animated route from Point A to Point B">
                
                <!-- Map Background (A simple CSS grid/pattern for demo purposes) -->
                <div class="map-grid"></div>
                
                <!-- The Route Overlay -->
                <svg class="route-svg" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
                    
                    <!-- 
                      [TECHNIQUE] The Base Line (Faded)
                      Shows the full path before it is 'driven'.
                    -->
                    <path class="route-track" d="M 50 350 C 150 350, 100 150, 250 200 C 400 250, 350 50, 550 100" />
                    
                    <!-- 
                      [TECHNIQUE] The Animated Route Line
                      This path exactly duplicates the base line, but uses CSS stroke-dasharray
                      and stroke-dashoffset to animate the drawing effect.
                    -->
                    <path class="route-animated" d="M 50 350 C 150 350, 100 150, 250 200 C 400 250, 350 50, 550 100" />
                    
                </svg>
                
                <!-- Waypoints -->
                <div class="waypoint point-a">
                    <div class="pin"></div>
                    <span class="label">Start</span>
                </div>
                
                <div class="waypoint point-b">
                    <div class="pin end"></div>
                    <span class="label">Destination</span>
                </div>
                
            </div>
            
        </div>
        
    </div>

</body>
</html>
