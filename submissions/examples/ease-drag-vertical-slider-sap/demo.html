<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drag Vertical Slider</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <h1>Drag Vertical Slider</h1>

    <div
      class="v-slider"
      id="vSlider"
      role="slider"
      tabindex="0"
      aria-orientation="vertical"
      aria-label="Volume"
      aria-valuemin="0"
      aria-valuemax="100"
      aria-valuenow="60"
    >
      <div class="v-track">
        <div class="v-fill" id="vFill" style="height: 60%;"></div>
        <div class="v-thumb" id="vThumb" style="bottom: 60%;"></div>
      </div>
    </div>

    <p class="value-label">Volume: <span id="vValue">60</span></p>
  </main>

  <script>
    const slider = document.getElementById('vSlider');
    const track = slider.querySelector('.v-track');
    const fill = document.getElementById('vFill');
    const thumb = document.getElementById('vThumb');
    const valueLabel = document.getElementById('vValue');
    let dragging = false;
    let value = 60;

    function setValue(v) {
      value = Math.min(100, Math.max(0, v));
      fill.style.height = value + '%';
      thumb.style.bottom = value + '%';
      slider.setAttribute('aria-valuenow', Math.round(value));
      valueLabel.textContent = Math.round(value);
    }

    function valueFromPointer(clientY) {
      const rect = track.getBoundingClientRect();
      const pct = ((rect.bottom - clientY) / rect.height) * 100;
      return pct;
    }

    slider.addEventListener('pointerdown', (e) => {
      dragging = true;
      slider.setPointerCapture(e.pointerId);
      setValue(valueFromPointer(e.clientY));
    });

    slider.addEventListener('pointermove', (e) => {
      if (!dragging) return;
      setValue(valueFromPointer(e.clientY));
    });

    ['pointerup', 'pointercancel'].forEach(evt =>
      slider.addEventListener(evt, () => { dragging = false; })
    );

    slider.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowUp') { e.preventDefault(); setValue(value + 5); }
      if (e.key === 'ArrowDown') { e.preventDefault(); setValue(value - 5); }
      if (e.key === 'Home') { e.preventDefault(); setValue(0); }
      if (e.key === 'End') { e.preventDefault(); setValue(100); }
    });

    setValue(60);
  </script>
</body>
</html>
