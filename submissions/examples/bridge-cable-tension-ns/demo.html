<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bridge Cable Tension — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Bridge Cable Tension demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Bridge Cable Tension</h1>
      <p class="lede">Suspension bridge cable clamps flexing under load</p>
    </header>

    <section class="ease-bridge-cable-tension" data-demo="bridge-cable-tension" aria-live="polite">
      <div class="ease-bridge-cable-tension__housing">
        <div class="ease-bridge-cable-tension__bezel">
          <div class="ease-bridge-cable-tension__face">
            <div class="ease-bridge-cable-tension__readout">
              <span class="ease-bridge-cable-tension__label">Bridge Cable Tension</span>
              <span class="ease-bridge-cable-tension__value">LIVE</span>
            </div>
            <div class="ease-bridge-cable-tension__motion" aria-hidden="true">
              <span class="ease-bridge-cable-tension__a"></span>
              <span class="ease-bridge-cable-tension__b"></span>
              <span class="ease-bridge-cable-tension__c"></span>
              <span class="ease-bridge-cable-tension__d"></span>
            </div>
            <div class="ease-bridge-cable-tension__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-bridge-cable-tension__controls">
          <button type="button" class="ease-bridge-cable-tension__btn primary">Engage</button>
          <button type="button" class="ease-bridge-cable-tension__btn">Reset</button>
          <label class="ease-bridge-cable-tension__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-bridge-cable-tension__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
