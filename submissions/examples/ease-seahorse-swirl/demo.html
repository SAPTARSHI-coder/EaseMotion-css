<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seahorse Swirl · Seahorses Curl & Swirl</title>
    <meta name="description" content="Mesmerizing seahorses curling and swirling through ocean currents with graceful movements and bioluminescent glow.">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1 class="title">🐚 SEAHORSE SWIRL</h1>
        
        <div class="canvas-wrapper">
            <canvas id="seahorseCanvas" width="600" height="500"></canvas>
            <div class="glow-overlay"></div>
        </div>

        <div class="controls">
            <button class="toggle-btn" id="toggleBtn">⏸️ PAUSE</button>
            <button class="reset-btn" id="resetBtn">⟳ RESET</button>
            <div class="speed-control">
                <label>Speed</label>
                <input type="range" id="speedSlider" min="1" max="10" value="5">
                <span id="speedLabel">5</span>
            </div>
        </div>

        <div class="info">
            <span>🐚 SEAHORSE SWIRL</span>
            <small>curl · swirl · graceful dance</small>
        </div>
        <div class="hint">
            <span>🌊 seahorses curl and swirl through ocean currents</span>
        </div>
    </div>

    <script>
        (function() {
            const canvas = document.getElementById('seahorseCanvas');
            const ctx = canvas.getContext('2d');
            const W = 600, H = 500;
            
            const toggleBtn = document.getElementById('toggleBtn');
            const resetBtn = document.getElementById('resetBtn');
            const speedSlider = document.getElementById('speedSlider');
            const speedLabel = document.getElementById('speedLabel');

            let isAnimating = true;
            let speed = 5;
            let time = 0;

            // ---- Seahorse Class ----
            class Seahorse {
                constructor(x, y) {
                    this.x = x || W / 2;
                    this.y = y || H / 2;
                    this.baseX = this.x;
                    this.baseY = this.y;
                    this.size = 30 + Math.random() * 20;
                    this.color = this.randomColor();
                    
                    // Swirl movement
                    this.swirlAngle = Math.random() * Math.PI * 2;
                    this.swirlSpeed = 0.008 + Math.random() * 0.012;
                    this.swirlRadius = 60 + Math.random() * 80;
                    this.swirlOffset = Math.random() * Math.PI * 2;
                    
                    // Float
                    this.floatPhase = Math.random() * Math.PI * 2;
                    this.floatSpeed = 0.015 + Math.random() * 0.02;
                    this.floatAmplitude = 15 + Math.random() * 20;
                    
                    // Curl
                    this.curlPhase = Math.random() * Math.PI * 2;
                    this.curlSpeed = 0.02 + Math.random() * 0.03;
                    this.curlAmount = 0.3 + Math.random() * 0.4;
                    
                    // Body segments for drawing
                    this.segments = 12;
                    
                    // Tail curl
                    this.tailCurl = 0;
                }

                randomColor() {
                    const colors = [
                        { main: '#ff6b6b', light: '#ff9a9a', dark: '#cc4444', glow: 'rgba(255,107,107,0.3)' },
                        { main: '#ff9ff3', light: '#ffb8f5', dark: '#cc66cc', glow: 'rgba(255,159,243,0.3)' },
                        { main: '#feca57', light: '#ffe08a', dark: '#cc9933', glow: 'rgba(254,202,87,0.3)' },
                        { main: '#48dbfb', light: '#8ae5fc', dark: '#1a9bbf', glow: 'rgba(72,219,251,0.3)' },
                        { main: '#1dd1a1', light: '#5eddb8', dark: '#0f8f6f', glow: 'rgba(29,209,161,0.3)' },
                        { main: '#b026ff', light: '#cc66ff', dark: '#7711aa', glow: 'rgba(176,38,255,0.3)' },
                        { main: '#ff6bcd', light: '#ff99dd', dark: '#cc4499', glow: 'rgba(255,107,205,0.3)' },
                        { main: '#00d4ff', light: '#66ddff', dark: '#0088aa', glow: 'rgba(0,212,255,0.3)' }
                    ];
                    return colors[Math.floor(Math.random() * colors.length)];
                }

                update() {
                    const dt = speed / 5;
                    time += 0.01 * dt;
                    
                    // Swirl movement
                    this.swirlAngle += this.swirlSpeed * dt;
                    const swirlX = Math.cos(this.swirlAngle + this.swirlOffset) * this.swirlRadius;
                    const swirlY = Math.sin(this.swirlAngle * 0.7 + this.swirlOffset) * this.swirlRadius * 0.5;
                    
                    // Float
                    this.floatPhase += this.floatSpeed * dt;
                    const floatY = Math.sin(this.floatPhase) * this.floatAmplitude;
                    
                    // Curl
                    this.curlPhase += this.curlSpeed * dt;
                    this.tailCurl = 0.5 + Math.sin(this.curlPhase) * 0.5;
                    
                    // Apply position
                    this.x = this.baseX + swirlX;
                    this.y = this.baseY + swirlY + floatY;
                }

                draw(ctx) {
                    ctx.save();
                    ctx.translate(this.x, this.y);
                    
                    // Rotate based on movement direction
                    const angle = Math.atan2(
                        Math.cos(this.swirlAngle * 0.7 + this.swirlOffset) * this.swirlRadius * 0.5 * this.swirlSpeed * 0.7,
                        -Math.sin(this.swirlAngle + this.swirlOffset) * this.swirlRadius * this.swirlSpeed
                    );
                    ctx.rotate(angle + Math.PI / 2);
                    
                    const size = this.size;
                    const curl = this.tailCurl;
                    
                    // ---- Glow ----
                    const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, size * 2);
                    gradient.addColorStop(0, this.color.glow);
                    gradient.addColorStop(0.5, this.color.glow);
                    gradient.addColorStop(1, 'rgba(0,0,0,0)');
                    ctx.fillStyle = gradient;
                    ctx.beginPath();
                    ctx.arc(0, 0, size * 2, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // ---- Draw Seahorse Body ----
                    ctx.shadowColor = this.color.main;
                    ctx.shadowBlur = 20;
                    
                    // Body curve points
                    const points = [];
                    const numPoints = this.segments;
                    for (let i = 0; i <= numPoints; i++) {
                        const t = i / numPoints;
                        const curveX = Math.sin(t * Math.PI * 0.8 + curl * 0.5) * size * 0.3;
                        const curveY = -t * size * 0.7 + (1 - t) * size * 0.1;
                        const width = (1 - t * 0.3) * size * 0.25;
                        points.push({ x: curveX, y: curveY, w: width });
                    }
                    
                    // Draw body as connected shapes
                    for (let i = 0; i < points.length - 1; i++) {
                        const p = points[i];
                        const pNext = points[i + 1];
                        const t = i / numPoints;
                        
                        // Body segment
                        ctx.fillStyle = i % 2 === 0 ? this.color.main : this.color.light;
                        ctx.shadowBlur = 15;
                        
                        ctx.beginPath();
                        ctx.ellipse(p.x, p.y, p.w, p.w * 0.7, 0, 0, Math.PI * 2);
                        ctx.fill();
                        
                        // Highlight
                        ctx.shadowBlur = 0;
                        ctx.fillStyle = 'rgba(255,255,255,0.1)';
                        ctx.beginPath();
                        ctx.ellipse(p.x - p.w * 0.3, p.y - p.w * 0.2, p.w * 0.3, p.w * 0.2, -0.3, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    
                    // ---- Head ----
                    ctx.shadowBlur = 20;
                    ctx.shadowColor = this.color.main;
                    const headX = points[0].x;
                    const headY = points[0].y - size * 0.1;
                    ctx.fillStyle = this.color.main;
                    ctx.beginPath();
                    ctx.ellipse(headX, headY, size * 0.2, size * 0.25, 0, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // Snout
                    ctx.fillStyle = this.color.light;
                    ctx.shadowBlur = 10;
                    ctx.beginPath();
                    ctx.ellipse(headX + size * 0.15, headY - size * 0.05, size * 0.12, size * 0.06, 0.3, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // Eye
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.arc(headX + size * 0.05, headY - size * 0.08, size * 0.06, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#1a1a2e';
                    ctx.beginPath();
                    ctx.arc(headX + size * 0.08, headY - size * 0.06, size * 0.035, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // ---- Dorsal Fin ----
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = this.color.main;
                    ctx.fillStyle = this.color.light;
                    ctx.globalAlpha = 0.6 + Math.sin(time * 0.05 + this.curlPhase) * 0.2;
                    ctx.beginPath();
                    ctx.moveTo(0, -size * 0.3);
                    ctx.quadraticCurveTo(
                        size * 0.2 * (0.5 + Math.sin(time * 0.04 + this.curlPhase) * 0.2),
                        -size * 0.5,
                        size * 0.1,
                        -size * 0.2
                    );
                    ctx.fill();
                    ctx.globalAlpha = 1;
                    
                    // ---- Tail curl ----
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = this.color.main;
                    const tailStart = points[points.length - 1];
                    const tailSegments = 8;
                    ctx.beginPath();
                    ctx.moveTo(tailStart.x, tailStart.y);
                    
                    for (let i = 0; i <= tailSegments; i++) {
                        const t = i / tailSegments;
                        const curlAngle = t * Math.PI * 1.5 * curl + Math.PI * 0.3;
                        const curlRadius = size * 0.15 * t * (1 + curl * 0.5);
                        const tx = tailStart.x + Math.cos(curlAngle) * curlRadius * 2;
                        const ty = tailStart.y + Math.sin(curlAngle) * curlRadius * 2 + t * size * 0.15;
                        ctx.lineTo(tx, ty);
                    }
                    ctx.strokeStyle = this.color.main;
                    ctx.lineWidth = size * 0.08;
                    ctx.stroke();
                    
                    // Tail glow trail
                    ctx.shadowBlur = 30;
                    ctx.globalAlpha = 0.3;
                    ctx.lineWidth = size * 0.15;
                    ctx.stroke();
                    ctx.globalAlpha = 1;
                    
                    // ---- Bioluminescent dots ----
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = this.color.main;
                    for (let i = 0; i < points.length; i += 2) {
                        const p = points[i];
                        const dotSize = 2 + Math.sin(time * 0.04 + i + this.curlPhase) * 1 + 1;
                        ctx.fillStyle = 'rgba(255,255,255,0.5)';
                        ctx.beginPath();
                        ctx.arc(p.x + p.w * 0.3, p.y - p.w * 0.2, dotSize, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    
                    ctx.restore();
                }
            }

            // ---- Create Seahorses ----
            let seahorses = [];
            const numSeahorses = 4;

            function createSeahorses() {
                seahorses = [];
                for (let i = 0; i < numSeahorses; i++) {
                    const angle = (i / numSeahorses) * Math.PI * 2;
                    const radius = 80 + Math.random() * 60;
                    const x = W / 2 + Math.cos(angle) * radius;
                    const y = H / 2 + Math.sin(angle) * radius * 0.6;
                    const s = new Seahorse(x, y);
                    s.swirlOffset = angle;
                    s.swirlRadius = 50 + Math.random() * 60;
                    s.floatAmplitude = 15 + Math.random() * 25;
                    seahorses.push(s);
                }
            }

            // ---- Draw Background ----
            function drawBackground() {
                // Deep ocean gradient
                const gradient = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, W);
                gradient.addColorStop(0, '#0d1f3c');
                gradient.addColorStop(0.3, '#0a1628');
                gradient.addColorStop(0.6, '#0a1a2a');
                gradient.addColorStop(1, '#050a12');
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, W, H);
                
                // Light rays from above
                for (let i = 0; i < 6; i++) {
                    const x = 50 + i * 100 + Math.sin(time * 0.005 + i * 1.5) * 30;
                    const gradient2 = ctx.createLinearGradient(x, 0, x + 20, H);
                    gradient2.addColorStop(0, 'rgba(100, 200, 255, 0.02)');
                    gradient2.addColorStop(0.5, 'rgba(100, 200, 255, 0.01)');
                    gradient2.addColorStop(1, 'rgba(100, 200, 255, 0)');
                    ctx.fillStyle = gradient2;
                    ctx.fillRect(x, 0, 20, H);
                }
                
                // Swirling particles (plankton)
                for (let i = 0; i < 40; i++) {
                    const angle = i * 0.8 + time * 0.005;
                    const radius = 100 + (i % 20) * 20 + Math.sin(time * 0.01 + i) * 30;
                    const x = W/2 + Math.cos(angle + time * 0.002) * radius;
                    const y = H/2 + Math.sin(angle * 0.6 + time * 0.003) * radius * 0.5;
                    const size = 0.5 + (i % 3) * 0.5;
                    const alpha = 0.02 + Math.sin(time * 0.01 + i * 0.5) * 0.015;
                    ctx.fillStyle = `rgba(150, 220, 255, ${alpha})`;
                    ctx.beginPath();
                    ctx.arc(x, y, size, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // ---- Animation Loop ----
            function animate() {
                if (!isAnimating) {
                    requestAnimationFrame(animate);
                    return;
                }
                
                drawBackground();
                
                for (let s of seahorses) {
                    s.update();
                    s.draw(ctx);
                }
                
                // Ambient sparkles
                for (let i = 0; i < 15; i++) {
                    const x = (i * 197 + 40) % W;
                    const y = (i * 131 + time * (0.03 + i * 0.005) * 4) % H;
                    const size = 0.5 + Math.sin(time * 0.02 + i * 3) * 0.5 + 0.5;
                    ctx.fillStyle = `rgba(200, 240, 255, ${0.01 + Math.sin(time * 0.015 + i) * 0.008})`;
                    ctx.beginPath();
                    ctx.arc(x, y, size, 0, Math.PI * 2);
                    ctx.fill();
                }
                
                requestAnimationFrame(animate);
            }

            // ---- Toggle Animation ----
            function toggleAnimation() {
                isAnimating = !isAnimating;
                toggleBtn.textContent = isAnimating ? '⏸️ PAUSE' : '▶️ PLAY';
            }

            // ---- Reset ----
            function resetSeahorses() {
                createSeahorses();
                time = 0;
            }

            // ---- Speed Control ----
            speedSlider.addEventListener('input', function() {
                speed = parseInt(this.value);
                speedLabel.textContent = speed;
            });

            // ---- Event Listeners ----
            toggleBtn.addEventListener('click', toggleAnimation);
            resetBtn.addEventListener('click', resetSeahorses);

            // ---- Keyboard Shortcuts ----
            document.addEventListener('keydown', function(e) {
                if (e.key === ' ' || e.key === 'Space') {
                    e.preventDefault();
                    toggleAnimation();
                }
                if (e.key === 'r' || e.key === 'R') {
                    resetSeahorses();
                }
            });

            // ---- Initialize ----
            createSeahorses();
            animate();

            console.log('🐚 Seahorse Swirl · Press Space to pause · R to reset');
        })();
    </script>
</body>
</html>
