<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Interactive 3D Globe</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="globe-section">

    <div class="globe-header">
      <span class="globe-badge">EASEMOTION</span>

      <h1>Interactive 3D Globe</h1>

      <p>
        Drag the globe to rotate it and explore the particle atmosphere.
      </p>
    </div>

    <div class="globe-wrapper">

      <div class="globe">

        <div class="globe-sphere">

          <div class="latitude latitude-1"></div>
          <div class="latitude latitude-2"></div>
          <div class="latitude latitude-3"></div>

          <div class="longitude longitude-1"></div>
          <div class="longitude longitude-2"></div>
          <div class="longitude longitude-3"></div>

          <div class="globe-light"></div>

        </div>

        <div class="atmosphere"></div>

        <div class="particles">
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
        </div>

      </div>

    </div>

    <div class="globe-controls">
      <span>↔ Drag to rotate</span>
      <span>•</span>
      <span>Auto rotation enabled</span>
    </div>

  </main>

  <script src="script.js"></script>

</body>
</html>
