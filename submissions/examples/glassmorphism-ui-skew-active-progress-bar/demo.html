<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Skew-Active Progress Bar - Glassmorphism UI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 
       A colorful, abstract background is essential for Glassmorphism 
       to demonstrate the frosted glass blur effect.
    -->
    <div class="glass-background">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <div class="layout-container">
        
        <header class="section-header">
            <h1 class="title">System Resources</h1>
            <p class="subtitle">A glassmorphism UI layout featuring a dynamic skew-active entrance animation for progress metrics.</p>
        </header>

        <div class="dashboard-area">
            
            <div class="glass-card">
                
                <!-- 
                   Pure CSS State Management for Demo
                   We use a checkbox to toggle the state to replay the entrance animation.
                -->
                <div class="controls">
                    <input type="checkbox" id="replay-toggle" class="replay-input" checked>
                    <label for="replay-toggle" class="btn-replay">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"></polyline><polyline points="23 20 23 14 17 14"></polyline><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"></path></svg>
                        Refresh Metrics
                    </label>
                    
                    <div class="progress-container skew-active-group">
                        
                        <!-- Progress Bar 1: CPU -->
                        <div class="progress-widget delay-1">
                            <div class="progress-header">
                                <span class="progress-label">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="2" ry="2"></rect><rect x="9" y="9" width="6" height="6"></rect><line x1="9" y1="1" x2="9" y2="4"></line><line x1="15" y1="1" x2="15" y2="4"></line><line x1="9" y1="20" x2="9" y2="23"></line><line x1="15" y1="20" x2="15" y2="23"></line><line x1="20" y1="9" x2="23" y2="9"></line><line x1="20" y1="14" x2="23" y2="14"></line><line x1="1" y1="9" x2="4" y2="9"></line><line x1="1" y1="14" x2="4" y2="14"></line></svg>
                                    CPU Usage
                                </span>
                                <span class="progress-value">84%</span>
                            </div>
                            <div class="progress-track">
                                <div class="progress-fill fill-cyan" style="--target-width: 84%;"></div>
                            </div>
                        </div>
                        
                        <!-- Progress Bar 2: Memory -->
                        <div class="progress-widget delay-2">
                            <div class="progress-header">
                                <span class="progress-label">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
                                    Memory Allocation
                                </span>
                                <span class="progress-value">62%</span>
                            </div>
                            <div class="progress-track">
                                <div class="progress-fill fill-purple" style="--target-width: 62%;"></div>
                            </div>
                        </div>
                        
                        <!-- Progress Bar 3: Storage -->
                        <div class="progress-widget delay-3">
                            <div class="progress-header">
                                <span class="progress-label">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="5" rx="9" ry="3"></ellipse><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path></svg>
                                    Network Volume
                                </span>
                                <span class="progress-value">95%</span>
                            </div>
                            <div class="progress-track">
                                <div class="progress-fill fill-rose" style="--target-width: 95%;"></div>
                            </div>
                        </div>

                    </div>
                </div>
                
            </div>
            
        </div>
    </div>

</body>
</html>
