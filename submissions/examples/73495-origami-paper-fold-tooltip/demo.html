<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>Origami Paper Fold Tooltip</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section class="showcase">
      <span class="eyebrow">CSS TOOLTIP / 247</span>

      <h1>Origami Paper Fold</h1>

      <p class="intro">
        Hover or focus the elements below to reveal a tooltip
        inspired by a folded sheet of paper.
      </p>

      <div class="tooltip-grid">

        <div class="tooltip-wrap">
          <button
            class="tooltip-trigger"
            type="button"
            aria-describedby="tooltip-one"
          >
            Hover me
          </button>

          <div
            class="tooltip"
            id="tooltip-one"
            role="tooltip"
          >
            <span class="fold fold-a" aria-hidden="true"></span>
            <span class="fold fold-b" aria-hidden="true"></span>

            <span class="tooltip-content">
              A folded paper-style tooltip.
            </span>
          </div>
        </div>

        <div class="tooltip-wrap">
          <button
            class="tooltip-trigger secondary"
            type="button"
            aria-describedby="tooltip-two"
          >
            More info
          </button>

          <div
            class="tooltip"
            id="tooltip-two"
            role="tooltip"
          >
            <span class="fold fold-a" aria-hidden="true"></span>
            <span class="fold fold-b" aria-hidden="true"></span>

            <span class="tooltip-content">
              Pure CSS with no JavaScript.
            </span>
          </div>
        </div>

        <div class="tooltip-wrap">
          <button
            class="tooltip-trigger"
            type="button"
            aria-describedby="tooltip-three"
          >
            Details
          </button>

          <div
            class="tooltip"
            id="tooltip-three"
            role="tooltip"
          >
            <span class="fold fold-a" aria-hidden="true"></span>
            <span class="fold fold-b" aria-hidden="true"></span>

            <span class="tooltip-content">
              Smooth and accessible interaction.
            </span>
          </div>
        </div>

      </div>
    </section>
  </main>
</body>
</html>
