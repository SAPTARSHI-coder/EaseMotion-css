<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Pulse-Glow Status Badge</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="demo">
    <section class="showcase">
      <p class="eyebrow">EaseMotion CSS</p>
      <h1>Pulse-Glow Status Badge</h1>
      <p class="intro">
        A lightweight status indicator with a soft pulsing glow,
        designed for dashboards, cards, notifications, and live interfaces.
      </p>

      <div class="badge-panel">

        <span class="status-badge status-badge--online">
          <span class="status-badge__dot" aria-hidden="true"></span>
          <span>Online</span>
        </span>

        <span class="status-badge status-badge--active">
          <span class="status-badge__dot" aria-hidden="true"></span>
          <span>Active</span>
        </span>

        <span class="status-badge status-badge--warning">
          <span class="status-badge__dot" aria-hidden="true"></span>
          <span>Warning</span>
        </span>

        <span class="status-badge status-badge--offline">
          <span class="status-badge__dot" aria-hidden="true"></span>
          <span>Offline</span>
        </span>

      </div>

      <div class="status-card">
        <div>
          <span class="status-card__label">SYSTEM STATUS</span>
          <h2>Server Cluster</h2>
        </div>

        <span class="status-badge status-badge--online">
          <span class="status-badge__dot" aria-hidden="true"></span>
          Operational
        </span>
      </div>
    </section>
  </main>

</body>
</html>
