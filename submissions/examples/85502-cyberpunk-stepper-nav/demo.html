<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyberpunk Dynamic Stepper Nav</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <div class="stepper">

    <div class="progress"></div>

    <div class="step completed">
      <div class="circle">1</div>
      <span>Initialize</span>
    </div>

    <div class="step completed">
      <div class="circle">2</div>
      <span>Encrypt</span>
    </div>

    <div class="step active" aria-current="step">
      <div class="circle">3</div>
      <span>Upload</span>
    </div>

    <div class="step">
      <div class="circle">4</div>
      <span>Deploy</span>
    </div>

  </div>

  <section class="card">
    <h1>Cyberpunk Stepper</h1>

    <p>
      Dynamic neon navigation inspired by futuristic cyberpunk interfaces.
      Built using only HTML and CSS with responsive behavior.
    </p>

    <button>Continue</button>
  </section>

</div>

</body>
</html>
