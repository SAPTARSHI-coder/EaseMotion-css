<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CSS Skew-Active Dropdown for Gaming Hub layouts">
  <title>Skew-Active Gaming Dropdown</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">
    <section class="dropdown-section" aria-labelledby="title">

      <div class="intro">
        <p class="eyebrow">GAMING HUB</p>
        <h1 id="title">Explore Your Games</h1>
        <p>
          Browse gaming categories using a responsive CSS-only
          skew-active dropdown.
        </p>
      </div>

      <div class="dropdown">
        <details>
          <summary>
            <span>Game Categories</span>
            <span class="arrow" aria-hidden="true">⌄</span>
          </summary>

          <div class="menu">
            <a href="#action">
              <span class="number">01</span>
              <span>
                <strong>Action</strong>
                <small>Fast-paced adventures</small>
              </span>
            </a>

            <a href="#strategy">
              <span class="number">02</span>
              <span>
                <strong>Strategy</strong>
                <small>Build, plan and conquer</small>
              </span>
            </a>

            <a href="#racing">
              <span class="number">03</span>
              <span>
                <strong>Racing</strong>
                <small>Speed beyond limits</small>
              </span>
            </a>

            <a href="#multiplayer">
              <span class="number">04</span>
              <span>
                <strong>Multiplayer</strong>
                <small>Play with your squad</small>
              </span>
            </a>
          </div>
        </details>
      </div>

    </section>
  </main>

</body>
</html>
