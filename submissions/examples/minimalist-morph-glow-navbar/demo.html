<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Morph-Glow Navbar - Minimalist Tech</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <nav class="morph-navbar">
        <div class="nav-brand">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
            <span>Nexus</span>
        </div>
        
        <!-- Mobile Menu Toggle (Checkbox Hack) -->
        <input type="checkbox" id="mobile-menu-toggle" class="mobile-toggle">
        <label for="mobile-menu-toggle" class="mobile-menu-btn">
            <span></span>
            <span></span>
            <span></span>
        </label>
        
        <ul class="nav-links">
            <li class="nav-item">
                <a href="#" class="nav-link">Platform</a>
                <div class="morph-glow"></div>
            </li>
            <li class="nav-item">
                <a href="#" class="nav-link active">Solutions</a>
                <div class="morph-glow"></div>
            </li>
            <li class="nav-item">
                <a href="#" class="nav-link">Resources</a>
                <div class="morph-glow"></div>
            </li>
            <li class="nav-item">
                <a href="#" class="nav-link">Pricing</a>
                <div class="morph-glow"></div>
            </li>
        </ul>
        
        <div class="nav-actions">
            <a href="#" class="btn btn-ghost">Sign In</a>
            <a href="#" class="btn btn-primary">Get Started</a>
        </div>
    </nav>
    
    <!-- Decorative background to show off navbar transparency -->
    <div class="page-content">
        <h1>Next-Generation Infrastructure</h1>
        <p>Scroll down to observe the navbar's backdrop-filter blur effect over the grid background.</p>
    </div>

</body>
</html>
