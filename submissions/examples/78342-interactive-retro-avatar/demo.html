<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    name="description"
    content="Interactive retro-style avatar built with HTML and CSS."
  />
  <title>Interactive Retro Avatar</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <div class="scanlines"></div>

    <section class="avatar-card">
      <div class="avatar-card__top">
        <span class="eyebrow">PROFILE_MODULE // 78342</span>
        <span class="status">
          <span class="status__dot"></span>
          ONLINE
        </span>
      </div>

      <div class="avatar-stage">
        <div class="pixel-orbit pixel-orbit--one"></div>
        <div class="pixel-orbit pixel-orbit--two"></div>

        <div class="avatar">
          <div class="avatar__shadow"></div>

          <div class="avatar__head">
            <div class="avatar__hair">
              <span></span>
              <span></span>
              <span></span>
            </div>

            <div class="avatar__face">
              <div class="avatar__ear avatar__ear--left"></div>
              <div class="avatar__ear avatar__ear--right"></div>

              <div class="avatar__eye avatar__eye--left"></div>
              <div class="avatar__eye avatar__eye--right"></div>

              <div class="avatar__nose"></div>

              <div class="avatar__mouth">
                <span></span>
              </div>

              <div class="avatar__blush avatar__blush--left"></div>
              <div class="avatar__blush avatar__blush--right"></div>
            </div>
          </div>

          <div class="avatar__body">
            <div class="shirt">
              <span class="shirt__badge">AK</span>
            </div>
          </div>

          <div class="avatar__cursor">
            <span></span>
          </div>
        </div>
      </div>

      <div class="avatar-card__content">
        <div>
          <p class="profile-label">USER_ID</p>
          <h1>AVINASH</h1>
        </div>

        <div class="role">
          <span>ROLE</span>
          <strong>CREATIVE CODER</strong>
        </div>
      </div>

      <div class="stats">
        <div class="stat">
          <span class="stat__value">24</span>
          <span class="stat__label">PROJECTS</span>
        </div>

        <div class="stat">
          <span class="stat__value">98%</span>
          <span class="stat__label">UPTIME</span>
        </div>

        <div class="stat">
          <span class="stat__value">07</span>
          <span class="stat__label">LEVEL</span>
        </div>
      </div>

      <div class="actions">
        <button class="action action--primary" type="button">
          <span>VIEW PROFILE</span>
          <span class="action__arrow">→</span>
        </button>

        <button
          class="action action--secondary"
          type="button"
          aria-label="Open settings"
        >
          ⚙
        </button>
      </div>
    </section>

    <p class="hint">
      HOVER THE AVATAR TO ACTIVATE // INTERACTIVE RETRO MODE
    </p>
  </main>
</body>
</html>
