<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Ancient Scroll Card - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="em-scroll-page">
        <div class="em-card" role="region" aria-label="Ancient Scroll Card Showcase" tabindex="0">
            <span class="em-card-badge">MYSTICAL UI</span>
            <h1 class="em-card-title">Ancient Scroll Card</h1>
            <p class="em-card-desc">A parchment-styled card featuring papyrus tones, antique borders, and mystical typography using pure CSS.</p>
            
            <!-- Scroll Card Container -->
            <div class="em-scroll-container" role="region" aria-label="Ancient papyrus parchment">
                <article class="em-papyrus-card">
                    <span class="em-papyrus-seal">📜</span>
                    <h2>The Scroll of Wisdom</h2>
                    <p>Ancient secrets of pure CSS architectures lie within this sacred parchment, waiting for developers to unveil.</p>
                </article>
            </div>

            <a href="#" class="em-card-btn" role="button">Unfurl Scroll</a>
        </div>
    </div>
</body>
</html>
