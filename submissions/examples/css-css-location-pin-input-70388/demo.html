<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Location Pin Input - EaseMotion</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <form class="lpi" aria-label="Location pin input" onsubmit="return false;">
      <label class="lpi-field"
        ><span class="lpi-pin" aria-hidden="true"></span
        ><input type="text" class="lpi-input" placeholder="Enter address"
      /></label>
    </form>
  </body>
</html>
