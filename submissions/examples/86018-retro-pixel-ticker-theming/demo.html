<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Retro Pixel Ticker Marquee</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="ticker-page">
    <section
      class="ticker-card"
      aria-labelledby="ticker-title"
    >
      <p class="eyebrow">RETRO / 86</p>

      <h1 id="ticker-title">
        Retro Pixel Ticker Marquee
      </h1>

      <div
        class="ticker"
        role="region"
        aria-label="Latest updates"
      >
        <div class="ticker-track">
          <span class="ticker-item">NEW UPDATE</span>
          <span class="pixel-separator">◆</span>

          <span class="ticker-item">CSS MOTION</span>
          <span class="pixel-separator">◆</span>

          <span class="ticker-item">OPEN SOURCE</span>
          <span class="pixel-separator">◆</span>

          <span class="ticker-item">RETRO UI</span>
          <span class="pixel-separator">◆</span>

          <span class="ticker-item">EASEMOTION</span>
          <span class="pixel-separator">◆</span>

          <span class="ticker-item">NEW UPDATE</span>
          <span class="pixel-separator">◆</span>

          <span class="ticker-item">CSS MOTION</span>
          <span class="pixel-separator">◆</span>

          <span class="ticker-item">OPEN SOURCE</span>
          <span class="pixel-separator">◆</span>
        </div>
      </div>

      <div class="controls">
        <button
          class="ticker-toggle"
          type="button"
          onclick="document.querySelector('.ticker').classList.toggle('is-paused')"
        >
          Pause / Resume
        </button>
      </div>
    </section>
  </main>

</body>
</html>
