<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>circular-spinning-progress-arc</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="arc-container">
  <svg class="progress-ring" width="120" height="120">
    <circle class="progress-ring-bg" stroke="rgba(255,255,255,0.05)" stroke-width="8" fill="transparent" r="50" cx="60" cy="60"/>
    <circle class="progress-ring-fill" stroke="#10b981" stroke-width="8" stroke-dasharray="314.16" stroke-dashoffset="80" fill="transparent" r="50" cx="60" cy="60"/>
  </svg>
</div>
</body>
</html>
