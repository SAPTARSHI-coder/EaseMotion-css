<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Carousel Slider &mdash; EaseMotion CSS Demo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="page-head">
    <p class="kicker">EaseMotion CSS &middot; Media &amp; Gallery</p>
    <h1>Carousel Slider</h1>
    <p class="sub">A smooth scroll-snap carousel that lets visitors flick through slides with a satisfying snap.</p>
  </header>
  <main class="stage">
    <div class="cs-rail">
      <div class="cs-slide cs-s1">Slide 01</div>
      <div class="cs-slide cs-s2">Slide 02</div>
      <div class="cs-slide cs-s3">Slide 03</div>
      <div class="cs-slide cs-s4">Slide 04</div>
    </div>
    <div class="cs-dots">
      <a href="#"></a><a href="#"></a><a href="#"></a><a href="#"></a>
    </div>
  </main>
  <p class="stage-caption">Drag or flick the rail &mdash; it snaps to each slide automatically.</p>
  <footer class="page-foot">
    <span>Pure CSS &middot; zero dependencies</span>
    <span>Scroll-snap powered</span>
  </footer>
</body>
</html>
