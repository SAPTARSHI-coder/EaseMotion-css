<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="CSS-only countdown launch hero animation"
    >

    <title>CSS Countdown Launch Hero</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="launch-hero">

        <div class="hero-content">

            <p class="eyebrow">Something exciting is coming</p>

            <h1>Our Next Big Launch</h1>

            <p class="hero-description">
                We're preparing something special.
                Stay tuned for the launch.
            </p>

            <section
                class="countdown"
                aria-label="Launch countdown"
            >

                <div class="time-box">
                    <span class="time-value">12</span>
                    <span class="time-label">Days</span>
                </div>

                <span class="separator" aria-hidden="true">:</span>

                <div class="time-box">
                    <span class="time-value">08</span>
                    <span class="time-label">Hours</span>
                </div>

                <span class="separator" aria-hidden="true">:</span>

                <div class="time-box">
                    <span class="time-value">45</span>
                    <span class="time-label">Minutes</span>
                </div>

                <span class="separator" aria-hidden="true">:</span>

                <div class="time-box seconds-box">
                    <span class="time-value">30</span>
                    <span class="time-label">Seconds</span>
                </div>

            </section>

            <div
                class="progress"
                role="progressbar"
                aria-label="Launch preparation progress"
                aria-valuemin="0"
                aria-valuemax="100"
                aria-valuenow="75"
            >
                <span class="progress-fill"></span>
            </div>

            <p class="status">
                Launch preparation in progress...
            </p>

        </div>

    </main>

</body>
</html>
