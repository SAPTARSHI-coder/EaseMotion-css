<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>CSS Hero Text Reveal Animation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="hero" aria-labelledby="hero-title">
    <div class="hero-content">

      <p class="hero-label">
        CSS MOTION
      </p>

      <h1 id="hero-title" class="hero-title">
        <span class="hero-line">
          <span class="hero-line-inner">Build interfaces</span>
        </span>

        <span class="hero-line">
          <span class="hero-line-inner">that feel alive.</span>
        </span>
      </h1>

      <p class="hero-description">
        A pure CSS staggered text reveal animation for modern hero sections.
        No JavaScript required.
      </p>

      <div class="hero-actions">
        <a href="#" class="hero-button">Explore Motion</a>
        <a href="#" class="hero-link">Learn more →</a>
      </div>

    </div>

    <div class="hero-decoration" aria-hidden="true">
      <span class="orb orb-one"></span>
      <span class="orb orb-two"></span>
      <span class="orb orb-three"></span>
    </div>
  </main>

</body>
</html>
