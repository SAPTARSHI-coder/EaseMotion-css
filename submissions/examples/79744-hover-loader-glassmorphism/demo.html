<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />
  <meta
    name="description"
    content="Hover loader with glassmorphism styling built using pure HTML and CSS."
  />

  <title>Hover Loader — Glassmorphism</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main class="page">
    <section
      class="loader-section"
      aria-labelledby="loader-title"
    >
      <div class="glass-card">

        <div
          class="glass-card__orb glass-card__orb--one"
          aria-hidden="true"
        ></div>

        <div
          class="glass-card__orb glass-card__orb--two"
          aria-hidden="true"
        ></div>

        <header class="loader-header">
          <span class="loader-header__eyebrow">
            GLASS UI / 79744
          </span>

          <h1 id="loader-title">
            Hover to load
          </h1>

          <p>
            A responsive CSS-only loader with a soft glassmorphism
            surface and smooth hover motion.
          </p>
        </header>

        <div
          class="loader"
          role="status"
          aria-label="Loading indicator"
        >
          <div class="loader__ring loader__ring--outer"></div>
          <div class="loader__ring loader__ring--middle"></div>
          <div class="loader__core">
            <span class="loader__dot"></span>
          </div>
        </div>

        <div class="loader-status">
          <span class="loader-status__dot"></span>
          <span>Hover the loader</span>
        </div>

        <div class="loader-progress" aria-hidden="true">
          <span class="loader-progress__bar"></span>
        </div>

      </div>
    </section>
  </main>
</body>
</html>
