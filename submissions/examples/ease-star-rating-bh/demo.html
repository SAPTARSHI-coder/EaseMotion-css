<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ease-star-rating-bh</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #0f172a; min-height: 100vh; padding: 2rem; color: #f1f5f9; }
    .container { max-width: 800px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 3rem; padding: 2rem; background: rgba(30, 41, 59, 0.8); border-radius: 1rem; }
    header h1 { font-size: 2rem; font-weight: 700; background: linear-gradient(135deg, #fbbf24, #f59e0b); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 0.5rem; }
    header p { color: #94a3b8; }
    .demo-section { background: rgba(30, 41, 59, 0.8); border: 1px solid rgba(148, 163, 184, 0.1); border-radius: 1rem; padding: 2rem; margin-bottom: 2rem; }
    .demo-section h2 { font-size: 1.25rem; margin-bottom: 1.5rem; color: #e2e8f0; }
    .demo-item { margin-bottom: 2rem; }
    .demo-item h3 { font-size: 0.875rem; color: #94a3b8; margin-bottom: 1rem; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>ease-star-rating-bh</h1>
      <p>Pure CSS Interactive Star Rating Component</p>
    </header>
    
    <section class="demo-section">
      <h2>Basic Star Rating - Click to Rate</h2>
      
      <div class="demo-item">
        <h3>Default</h3>
        <div class="ease-star-rating-bh">
          <input type="radio" name="rating1" id="star1-5" value="5">
          <label for="star1-5">★</label>
          <input type="radio" name="rating1" id="star1-4" value="4">
          <label for="star1-4">★</label>
          <input type="radio" name="rating1" id="star1-3" value="3">
          <label for="star1-3">★</label>
          <input type="radio" name="rating1" id="star1-2" value="2">
          <label for="star1-2">★</label>
          <input type="radio" name="rating1" id="star1-1" value="1">
          <label for="star1-1">★</label>
        </div>
      </div>
      
      <div class="demo-item">
        <h3>With Glow Effect</h3>
        <div class="ease-star-rating-bh ease-star-rating-bh-glow">
          <input type="radio" name="rating2" id="star2-5" value="5">
          <label for="star2-5">★</label>
          <input type="radio" name="rating2" id="star2-4" value="4">
          <label for="star2-4">★</label>
          <input type="radio" name="rating2" id="star2-3" value="3">
          <label for="star2-3">★</label>
          <input type="radio" name="rating2" id="star2-2" value="2">
          <label for="star2-2">★</label>
          <input type="radio" name="rating2" id="star2-1" value="1">
          <label for="star2-1">★</label>
        </div>
      </div>
    </section>
    
    <section class="demo-section">
      <h2>Animation Variants</h2>
      
      <div class="demo-item">
        <h3>Pulse Animation</h3>
        <div class="ease-star-rating-bh ease-star-rating-bh-pulse">
          <input type="radio" name="rating3" id="star3-5" value="5">
          <label for="star3-5">★</label>
          <input type="radio" name="rating3" id="star3-4" value="4">
          <label for="star3-4">★</label>
          <input type="radio" name="rating3" id="star3-3" value="3">
          <label for="star3-3">★</label>
          <input type="radio" name="rating3" id="star3-2" value="2">
          <label for="star3-2">★</label>
          <input type="radio" name="rating3" id="star3-1" value="1">
          <label for="star3-1">★</label>
        </div>
      </div>
      
      <div class="demo-item">
        <h3>Bounce Animation</h3>
        <div class="ease-star-rating-bh ease-star-rating-bh-bounce">
          <input type="radio" name="rating4" id="star4-5" value="5">
          <label for="star4-5">★</label>
          <input type="radio" name="rating4" id="star4-4" value="4">
          <label for="star4-4">★</label>
          <input type="radio" name="rating4" id="star4-3" value="3">
          <label for="star4-3">★</label>
          <input type="radio" name="rating4" id="star4-2" value="2">
          <label for="star4-2">★</label>
          <input type="radio" name="rating4" id="star4-1" value="1">
          <label for="star4-1">★</label>
        </div>
      </div>
      
      <div class="demo-item">
        <h3>Float Animation</h3>
        <div class="ease-star-rating-bh ease-star-rating-bh-float">
          <input type="radio" name="rating5" id="star5-5" value="5">
          <label for="star5-5">★</label>
          <input type="radio" name="rating5" id="star5-4" value="4">
          <label for="star5-4">★</label>
          <input type="radio" name="rating5" id="star5-3" value="3">
          <label for="star5-3">★</label>
          <input type="radio" name="rating5" id="star5-2" value="2">
          <label for="star5-2">★</label>
          <input type="radio" name="rating5" id="star5-1" value="1">
          <label for="star5-1">★</label>
        </div>
      </div>
    </section>
    
    <section class="demo-section">
      <h2>Size Variants</h2>
      
      <div class="demo-item">
        <h3>Small</h3>
        <div class="ease-star-rating-bh ease-star-rating-bh-sm">
          <input type="radio" name="rating6" id="star6-5" value="5">
          <label for="star6-5">★</label>
          <input type="radio" name="rating6" id="star6-4" value="4">
          <label for="star6-4">★</label>
          <input type="radio" name="rating6" id="star6-3" value="3">
          <label for="star6-3">★</label>
          <input type="radio" name="rating6" id="star6-2" value="2">
          <label for="star6-2">★</label>
          <input type="radio" name="rating6" id="star6-1" value="1">
          <label for="star6-1">★</label>
        </div>
      </div>
      
      <div class="demo-item">
        <h3>Large</h3>
        <div class="ease-star-rating-bh ease-star-rating-bh-lg">
          <input type="radio" name="rating7" id="star7-5" value="5">
          <label for="star7-5">★</label>
          <input type="radio" name="rating7" id="star7-4" value="4">
          <label for="star7-4">★</label>
          <input type="radio" name="rating7" id="star7-3" value="3">
          <label for="star7-3">★</label>
          <input type="radio" name="rating7" id="star7-2" value="2">
          <label for="star7-2">★</label>
          <input type="radio" name="rating7" id="star7-1" value="1">
          <label for="star7-1">★</label>
        </div>
      </div>
    </section>
    
    <section class="demo-section">
      <h2>Color Variants</h2>
      
      <div class="demo-item">
        <h3>Gold</h3>
        <div class="ease-star-rating-bh ease-star-rating-bh-gold">
          <input type="radio" name="rating8" id="star8-5" value="5" checked>
          <label for="star8-5">★</label>
          <input type="radio" name="rating8" id="star8-4" value="4">
          <label for="star8-4">★</label>
          <input type="radio" name="rating8" id="star8-3" value="3">
          <label for="star8-3">★</label>
          <input type="radio" name="rating8" id="star8-2" value="2">
          <label for="star8-2">★</label>
          <input type="radio" name="rating8" id="star8-1" value="1">
          <label for="star8-1">★</label>
        </div>
      </div>
      
      <div class="demo-item">
        <h3>Green</h3>
        <div class="ease-star-rating-bh ease-star-rating-bh-green">
          <input type="radio" name="rating9" id="star9-5" value="5">
          <label for="star9-5">★</label>
          <input type="radio" name="rating9" id="star9-4" value="4">
          <label for="star9-4">★</label>
          <input type="radio" name="rating9" id="star9-3" value="3">
          <label for="star9-3">★</label>
          <input type="radio" name="rating9" id="star9-2" value="2">
          <label for="star9-2">★</label>
          <input type="radio" name="rating9" id="star9-1" value="1">
          <label for="star9-1">★</label>
        </div>
      </div>
    </section>
  </div>
</body>
</html>
