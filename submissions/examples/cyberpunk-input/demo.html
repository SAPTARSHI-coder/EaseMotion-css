<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyberpunk Glowing Input</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="cyberpunk-container">
        <label for="cyber-input" class="cyber-label">Enter Access Code</label>
        <div class="input-wrapper">
            <input type="text" id="cyber-input" class="cyber-input" placeholder="ACCESS_CODE">
            <span class="glitch-effect"></span>
        </div>
    </div>
</body>
</html>
