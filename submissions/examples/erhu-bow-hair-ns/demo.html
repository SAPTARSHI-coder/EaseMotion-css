<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Erhu Bow Hair — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Erhu Bow Hair demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Erhu Bow Hair</h1>
      <p class="lede">Erhu bow hair trapped between the strings</p>
    </header>

    <section class="ease-erhu-bow-hair" data-demo="erhu-bow-hair" aria-live="polite">
      <div class="ease-erhu-bow-hair__housing">
        <div class="ease-erhu-bow-hair__bezel">
          <div class="ease-erhu-bow-hair__face">
            <div class="ease-erhu-bow-hair__readout">
              <span class="ease-erhu-bow-hair__label">Erhu Bow Hair</span>
              <span class="ease-erhu-bow-hair__value">LIVE</span>
            </div>
            <div class="ease-erhu-bow-hair__motion" aria-hidden="true">
              <span class="ease-erhu-bow-hair__a"></span>
              <span class="ease-erhu-bow-hair__b"></span>
              <span class="ease-erhu-bow-hair__c"></span>
              <span class="ease-erhu-bow-hair__d"></span>
            </div>
            <div class="ease-erhu-bow-hair__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-erhu-bow-hair__controls">
          <button type="button" class="ease-erhu-bow-hair__btn primary">Bow</button>
          <button type="button" class="ease-erhu-bow-hair__btn">Rest</button>
          <label class="ease-erhu-bow-hair__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-erhu-bow-hair__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
