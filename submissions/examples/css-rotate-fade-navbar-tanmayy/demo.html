<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Rotate-Fade Navbar - EaseMotion CSS</title>
  <!-- Import EaseMotion CSS -->
  <link rel="stylesheet" href="../../../easemotion.css">
  <!-- Component Specific Styles -->
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body class="ecommerce-bg">

  <div class="demo-container">
    <div class="checkout-wrapper ease-glass-card">
      
      <header class="checkout-header">
        <h1 class="ease-text-xl">Checkout</h1>
      </header>

      <!-- Rotate-Fade Navbar Component -->
      <nav class="rotate-fade-navbar" aria-label="Checkout Progress">
        
        <!-- Hidden Radio Inputs for State -->
        <input type="radio" name="checkout_nav" id="step-cart" class="nav-radio" checked>
        <input type="radio" name="checkout_nav" id="step-shipping" class="nav-radio">
        <input type="radio" name="checkout_nav" id="step-payment" class="nav-radio">
        <input type="radio" name="checkout_nav" id="step-review" class="nav-radio">

        <div class="nav-steps-container">
          
          <!-- Step 1: Cart -->
          <label for="step-cart" class="nav-step" tabindex="0">
            <div class="step-indicator">
              <span class="step-number">1</span>
              <div class="rotate-fade-highlight"></div>
            </div>
            <span class="step-label">Cart</span>
          </label>
          
          <div class="nav-connector"></div>

          <!-- Step 2: Shipping -->
          <label for="step-shipping" class="nav-step" tabindex="0">
            <div class="step-indicator">
              <span class="step-number">2</span>
              <div class="rotate-fade-highlight"></div>
            </div>
            <span class="step-label">Shipping</span>
          </label>
          
          <div class="nav-connector"></div>

          <!-- Step 3: Payment -->
          <label for="step-payment" class="nav-step" tabindex="0">
            <div class="step-indicator">
              <span class="step-number">3</span>
              <div class="rotate-fade-highlight"></div>
            </div>
            <span class="step-label">Payment</span>
          </label>
          
          <div class="nav-connector"></div>

          <!-- Step 4: Review -->
          <label for="step-review" class="nav-step" tabindex="0">
            <div class="step-indicator">
              <span class="step-number">4</span>
              <div class="rotate-fade-highlight"></div>
            </div>
            <span class="step-label">Review</span>
          </label>

        </div>
      </nav>

      <main class="checkout-content">
        <p class="ease-color-muted" style="text-align: center; margin-top: 40px;">
          Click on the navigation steps above to see the pure CSS Rotate-Fade interaction.
        </p>
      </main>

    </div>
  </div>

</body>
</html>
