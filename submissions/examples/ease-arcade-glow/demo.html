<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade Glow · Neon Arcade Effect</title>
    <meta name="description" content="Interactive neon arcade glow effects with hover animations, retro color schemes, and pulsating neon lights.">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1 class="arcade-title">ARCADE</h1>
        <div class="arcade-grid">
            <div class="arcade-card" data-color="pink">
                <div class="card-content">
                    <span class="icon">🕹️</span>
                    <h3>RETRO</h3>
                    <p>Classic arcade feel</p>
                </div>
                <div class="glow-effect"></div>
            </div>
            
            <div class="arcade-card" data-color="blue">
                <div class="card-content">
                    <span class="icon">🎮</span>
                    <h3>GAMING</h3>
                    <p>Neon glow effects</p>
                </div>
                <div class="glow-effect"></div>
            </div>
            
            <div class="arcade-card" data-color="green">
                <div class="card-content">
                    <span class="icon">👾</span>
                    <h3>8-BIT</h3>
                    <p>Pixel perfect style</p>
                </div>
                <div class="glow-effect"></div>
            </div>
            
            <div class="arcade-card" data-color="purple">
                <div class="card-content">
                    <span class="icon">⚡</span>
                    <h3>NEON</h3>
                    <p>Electric vibes</p>
                </div>
                <div class="glow-effect"></div>
            </div>
            
            <div class="arcade-card" data-color="orange">
                <div class="card-content">
                    <span class="icon">🔥</span>
                    <h3>RADICAL</h3>
                    <p>90s arcade style</p>
                </div>
                <div class="glow-effect"></div>
            </div>
            
            <div class="arcade-card" data-color="cyan">
                <div class="card-content">
                    <span class="icon">✨</span>
                    <h3>GLOW</h3>
                    <p>Pulse & shine</p>
                </div>
                <div class="glow-effect"></div>
            </div>
        </div>
        <div class="info">
            <span>🎰 ARCADE GLOW</span>
            <small>hover over cards → neon glow</small>
        </div>
        <div class="hint">
            <span>neon colors · pulse animation · arcade vibes</span>
        </div>
    </div>
    <script>
        (function() {
            const cards = document.querySelectorAll('.arcade-card');
            
            // ---- Add random sparkle effects ----
            function createSparkle() {
                const sparkle = document.createElement('div');
                sparkle.className = 'sparkle';
                sparkle.style.cssText = `
                    position: fixed;
                    width: 4px;
                    height: 4px;
                    background: white;
                    border-radius: 50%;
                    pointer-events: none;
                    z-index: 9999;
                    box-shadow: 0 0 10px rgba(255,255,255,0.8), 0 0 20px rgba(255,255,255,0.4);
                `;
                document.body.appendChild(sparkle);
                return sparkle;
            }

            // ---- Mouse move sparkle trail ----
            let sparkles = [];
            let sparkleIndex = 0;
            const MAX_SPARKLES = 20;

            document.addEventListener('mousemove', function(e) {
                // Only create sparkles when over cards
                const target = e.target.closest('.arcade-card');
                if (!target) return;
                
                const sparkle = createSparkle();
                sparkle.style.left = (e.clientX - 2) + 'px';
                sparkle.style.top = (e.clientY - 2) + 'px';
                
                // Random color from card's theme
                const color = target.dataset.color;
                const colors = {
                    pink: '#ff2d75',
                    blue: '#00d4ff',
                    green: '#39ff14',
                    purple: '#b026ff',
                    orange: '#ff6b00',
                    cyan: '#00ffcc'
                };
                sparkle.style.background = colors[color] || '#ffffff';
                sparkle.style.boxShadow = `0 0 15px ${colors[color] || '#ffffff'}, 0 0 30px ${colors[color] || '#ffffff'}`;
                
                sparkles.push(sparkle);
                
                // Remove old sparkles
                if (sparkles.length > MAX_SPARKLES) {
                    const old = sparkles.shift();
                    if (old && old.parentNode) {
                        old.style.transition = 'opacity 0.3s ease';
                        old.style.opacity = '0';
                        setTimeout(() => {
                            if (old.parentNode) old.remove();
                        }, 300);
                    }
                }
                
                // Auto-remove after 1 second
                setTimeout(() => {
                    if (sparkle.parentNode) {
                        sparkle.style.transition = 'opacity 0.3s ease';
                        sparkle.style.opacity = '0';
                        setTimeout(() => {
                            if (sparkle.parentNode) sparkle.remove();
                        }, 300);
                    }
                }, 1000);
            });

            // ---- Add subtle random pulse to cards ----
            setInterval(() => {
                cards.forEach(card => {
                    const glow = card.querySelector('.glow-effect');
                    if (card.matches(':hover')) {
                        // Enhance glow randomly
                        const intensity = 0.8 + Math.random() * 0.4;
                        glow.style.opacity = intensity;
                        setTimeout(() => {
                            glow.style.opacity = '1';
                        }, 100);
                    }
                });
            }, 500);

            console.log('🎰 Arcade Glow · hover for neon effects · sparkle trail included');
        })();
    </script>
</body>
</html>
