<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <meta
    name="description"
    content="3D pagination component with cyberpunk styling built using HTML and CSS."
  />

  <title>3D Cyberpunk Pagination</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main class="page">
    <section class="pagination-demo" aria-labelledby="pagination-title">

      <div class="grid-overlay" aria-hidden="true"></div>

      <div class="content">
        <p class="eyebrow">
          <span class="status-dot"></span>
          DATA NAVIGATION
        </p>

        <h1 id="pagination-title">
          3D <span>Pagination</span>
        </h1>

        <p class="description">
          Navigate through data with a futuristic cyberpunk
          interface powered entirely by HTML and CSS.
        </p>

        <nav
          class="pagination"
          aria-label="Pagination navigation"
        >
          <a
            class="page-btn arrow disabled"
            href="#"
            aria-label="Previous page"
            aria-disabled="true"
          >
            <span aria-hidden="true">‹</span>
          </a>

          <a
            class="page-btn active"
            href="#page-1"
            aria-current="page"
          >
            01
          </a>

          <a class="page-btn" href="#page-2">02</a>
          <a class="page-btn" href="#page-3">03</a>
          <a class="page-btn" href="#page-4">04</a>
          <a class="page-btn" href="#page-5">05</a>

          <span class="dots" aria-hidden="true">
            •••
          </span>

          <a class="page-btn" href="#page-12">12</a>

          <a
            class="page-btn arrow"
            href="#page-2"
            aria-label="Next page"
          >
            <span aria-hidden="true">›</span>
          </a>
        </nav>

        <div class="pagination-info">
          <span>PAGE</span>
          <strong>01</strong>
          <span>/</span>
          <span>12</span>
        </div>
      </div>

      <div
        class="floating-panel panel-left"
        aria-hidden="true"
      >
        <span class="panel-label">SYSTEM</span>
        <strong>ONLINE</strong>
        <i></i>
      </div>

      <div
        class="floating-panel panel-right"
        aria-hidden="true"
      >
        <span class="panel-label">SECTOR</span>
        <strong>07 // NEO</strong>
        <i></i>
      </div>

      <div
        class="corner corner-top-left"
        aria-hidden="true"
      ></div>

      <div
        class="corner corner-top-right"
        aria-hidden="true"
      ></div>

      <div
        class="corner corner-bottom-left"
        aria-hidden="true"
      ></div>

      <div
        class="corner corner-bottom-right"
        aria-hidden="true"
      ></div>

      <div class="scanline" aria-hidden="true"></div>

    </section>
  </main>
</body>
</html>
