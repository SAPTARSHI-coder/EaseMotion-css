<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="CSS-only cinematic letterbox animation demo"
  >
  <title>Cinematic Letter Box</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="cinema" aria-label="Cinematic letterbox demonstration">

    <section class="cinema-scene" tabindex="0">
      <div class="scene-content">
        <span class="scene-label">EASEMOTION CSS</span>
        <h1>Cinematic<br>Letter Box</h1>
        <p>Pure CSS cinematic framing effect</p>
      </div>

      <div class="letterbox letterbox-top" aria-hidden="true"></div>
      <div class="letterbox letterbox-bottom" aria-hidden="true"></div>
    </section>

    <p class="instruction">
      Hover or focus the scene to activate the cinematic effect.
    </p>

  </main>

</body>
</html>
