<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Arcade Pixel Accordion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="arcade-container">

    <h1>RETRO ARCADE MENU</h1>

    <details class="pixel-accordion">
        <summary>START GAME</summary>
        <div class="content">
            Launch a new adventure and challenge your skills.
        </div>
    </details>

    <details class="pixel-accordion">
        <summary>HIGH SCORES</summary>
        <div class="content">
            View top player rankings from the arcade leaderboard.
        </div>
    </details>

    <details class="pixel-accordion">
        <summary>SETTINGS</summary>
        <div class="content">
            Configure controls, audio, and display preferences.
        </div>
    </details>

</div>

</body>
</html>
