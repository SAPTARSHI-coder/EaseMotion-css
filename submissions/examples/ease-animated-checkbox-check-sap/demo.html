<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animated Checkbox Check</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <h1>Animated Checkbox Check</h1>

    <div class="check-list">
      <label class="check-option">
        <input type="checkbox" checked>
        <span class="check-box">
          <svg viewBox="0 0 24 24" class="check-icon"><polyline points="4,13 9,18 20,6"></polyline></svg>
        </span>
        <span>Email notifications</span>
      </label>

      <label class="check-option">
        <input type="checkbox">
        <span class="check-box">
          <svg viewBox="0 0 24 24" class="check-icon"><polyline points="4,13 9,18 20,6"></polyline></svg>
        </span>
        <span>SMS alerts</span>
      </label>

      <label class="check-option">
        <input type="checkbox">
        <span class="check-box">
          <svg viewBox="0 0 24 24" class="check-icon"><polyline points="4,13 9,18 20,6"></polyline></svg>
        </span>
        <span>Weekly digest</span>
      </label>
    </div>
  </main>
</body>
</html>
