<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Progress Bar | EaseMotion CSS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="progress-card" tabindex="0" aria-label="Neon Progress Bar Showcase">
    <h1 class="progress-title">Neon Progress</h1>
    <p class="progress-subtitle">CSS-only glowing progress bar component</p>

    <div class="progress-container" role="progressbar" aria-valuenow="75" aria-valuemin="0" aria-valuemax="100">
        <div class="progress-bar"></div>
    </div>

    <div class="progress-meta">
        <span>Loading assets</span>
        <span>75%</span>
    </div>
</main>

</body>
</html>
