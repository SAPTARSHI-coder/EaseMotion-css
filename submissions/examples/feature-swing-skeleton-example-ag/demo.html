<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Swing Skeleton Example</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="demo-container-ag">
    <div class="skeleton-card-ag" aria-label="Loading content" aria-busy="true">
      <div class="skeleton-avatar-ag"></div>
      <div class="skeleton-lines-ag">
        <div class="skeleton-line-ag skeleton-line--title-ag"></div>
        <div class="skeleton-line-ag skeleton-line--subtitle-ag"></div>
        <div class="skeleton-line-ag skeleton-line--body-ag"></div>
      </div>
    </div>
  </div>
</body>
</html>
