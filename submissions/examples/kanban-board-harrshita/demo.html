<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kanban Board | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="demo-header">
    <h1>Kanban Board Layout</h1>
    <p>Agile task management columns with priority tags and hover card lifts.</p>
  </header>

  <main class="demo-main">
    <section class="demo-section">
      <div class="ease-kanban-board">
        <div class="ease-kanban-column">
          <h3 class="ease-kanban-title">To Do (2)</h3>
          <div class="ease-kanban-card">
            <span class="ease-tag ease-tag-high">High</span>
            <h4>Setup CI/CD Pipeline</h4>
            <p>Configure GitHub Actions automated deployment.</p>
          </div>
        </div>
        <div class="ease-kanban-column">
          <h3 class="ease-kanban-title">In Progress (1)</h3>
          <div class="ease-kanban-card">
            <span class="ease-tag ease-tag-medium">Medium</span>
            <h4>React Component Suite</h4>
            <p>Build 30 wrapper components.</p>
          </div>
        </div>
      </div>
    </section>
  </main>
  <footer class="demo-footer"><p>EaseMotion CSS Project</p></footer>
</body>
</html>
