<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
Magnetic Floating Action Navigation
</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<main class="container">


<section class="hero">

<h1>
Magnetic Navigation
</h1>

<p>
High Contrast Accessibility Edition
</p>


<nav class="floating-nav" aria-label="Main Navigation">


<button class="nav-item active">
<span>🏠</span>
Home
</button>


<button class="nav-item">
<span>🔍</span>
Search
</button>


<button class="nav-item">
<span>⭐</span>
Favorites
</button>


<button class="nav-item">
<span>⚙️</span>
Settings
</button>


<div class="indicator"></div>


</nav>


</section>


</main>



<script src="script.js"></script>

</body>

</html>
