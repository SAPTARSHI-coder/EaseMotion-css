<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Woodcut Baren Press — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Woodcut Baren Press demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Woodcut Baren Press</h1>
      <p class="lede">Woodcut baren circular press strokes</p>
    </header>

    <section class="ease-woodcut-baren-press" data-demo="woodcut-baren-press" aria-live="polite">
      <div class="ease-woodcut-baren-press__housing">
        <div class="ease-woodcut-baren-press__bezel">
          <div class="ease-woodcut-baren-press__face">
            <div class="ease-woodcut-baren-press__readout">
              <span class="ease-woodcut-baren-press__label">Woodcut Baren Press</span>
              <span class="ease-woodcut-baren-press__value">LIVE</span>
            </div>
            <div class="ease-woodcut-baren-press__motion" aria-hidden="true">
              <span class="ease-woodcut-baren-press__a"></span>
              <span class="ease-woodcut-baren-press__b"></span>
              <span class="ease-woodcut-baren-press__c"></span>
              <span class="ease-woodcut-baren-press__d"></span>
            </div>
            <div class="ease-woodcut-baren-press__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-woodcut-baren-press__controls">
          <button type="button" class="ease-woodcut-baren-press__btn primary">Engage</button>
          <button type="button" class="ease-woodcut-baren-press__btn">Reset</button>
          <label class="ease-woodcut-baren-press__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-woodcut-baren-press__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
