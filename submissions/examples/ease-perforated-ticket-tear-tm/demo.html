<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ease-perforated-ticket — Tear Demo</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { min-height: 100vh; background: #e8e4dc; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2.5rem; font-family: 'Courier New', monospace; color: #2a2a3a; padding: 2rem; }
    h1 { font-size: 1.3rem; font-weight: 400; letter-spacing: 0.1em; text-transform: uppercase; }
    .demo-card { display: flex; flex-direction: column; align-items: center; gap: 0.75rem; }
    .demo-card span { font-size: 0.8rem; color: #7a6a5a; }
    .ticket-wrap { position: relative; display: flex; }
    .ticket-perf { width: var(--ticket-perf-diameter); height: 100%; background: #e8e4dc; border-radius: 50%; position: relative; z-index: 2; box-shadow: 0 0 0 5px var(--ticket-bg), 0 0 0 7px var(--ticket-border); }
    .ticket-full { width: var(--ticket-width); height: var(--ticket-height); background: var(--ticket-bg); border: 2px solid var(--ticket-border); border-radius: var(--ticket-radius); display: flex; overflow: hidden; position: relative; }
    .ticket-main { flex: 1; padding: 12px 16px; display: flex; flex-direction: column; gap: 6px; border-right: 2px dashed rgba(58,58,74,0.3); animation: ticket-tear-reveal var(--ticket-tear-duration) var(--ticket-tear-ease) forwards; }
    .ticket-stub { width: var(--ticket-stub-width); padding: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; animation: ticket-stub-slide-in var(--ticket-tear-duration) var(--ticket-tear-ease) 0.4s both; }
    .ticket-title { font-size: 0.65rem; font-weight: bold; text-transform: uppercase; letter-spacing: 0.1em; }
    .ticket-price { font-size: 1.2rem; font-weight: bold; }
    .ticket-date { font-size: 0.6rem; color: #666; }
    .ticket-admit { font-size: 0.5rem; text-transform: uppercase; letter-spacing: 0.05em; color: #888; }
    .ticket-barcode { display: flex; gap: 2px; align-items: flex-end; height: 30px; }
    .bar { background: #2a2a3a; width: 3px; border-radius: 1px; }
  </style>
</head>
<body>
  <h1>ease-perforated-ticket</h1>
  <div class="demo-card">
    <div class="ticket-wrap">
      <div class="ticket-full">
        <div class="ticket-main">
          <span class="ticket-title">Summer Music Festival 2026</span>
          <span class="ticket-price">$89.00</span>
          <span class="ticket-date">Aug 15, 2026 - Gates Open 4PM</span>
          <div class="ticket-barcode">
            <div class="bar" style="height:20px"></div><div class="bar" style="height:28px"></div>
            <div class="bar" style="height:14px"></div><div class="bar" style="height:24px"></div>
            <div class="bar" style="height:18px"></div><div class="bar" style="height:30px"></div>
            <div class="bar" style="height:10px"></div><div class="bar" style="height:22px"></div>
            <div class="bar" style="height:26px"></div><div class="bar" style="height:16px"></div>
          </div>
        </div>
        <div class="ticket-perf"></div>
        <div class="ticket-stub">
          <span class="ticket-admit">Admit One</span>
          <span class="ticket-title" style="font-size:0.5rem">GA</span>
        </div>
      </div>
    </div>
    <span>Tear Reveal</span>
  </div>
</body>
</html>
