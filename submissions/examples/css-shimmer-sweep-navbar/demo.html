<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Shimmer-Sweep Navbar</title>
  <link rel="stylesheet" href="../../../easemotion.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="shimmer-navbar">
    <div class="navbar-container">
      <a href="#" class="logo">SaaS<span>App</span></a>
      
      <!-- Hamburger menu for mobile without JS -->
      <input type="checkbox" id="menu-toggle" class="menu-toggle">
      <label for="menu-toggle" class="hamburger" aria-label="Toggle Navigation">
        <span></span>
        <span></span>
        <span></span>
      </label>

      <ul class="nav-links">
        <li><a href="#" class="nav-link">Features</a></li>
        <li><a href="#" class="nav-link">Pricing</a></li>
        <li><a href="#" class="nav-link">Testimonials</a></li>
        <li><a href="#" class="nav-link">Docs</a></li>
        <li><a href="#" class="btn shimmer-btn">Get Started</a></li>
      </ul>
    </div>
  </nav>

  <main style="padding: 4rem 2rem; text-align: center; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
    <h1 style="font-size: 3rem; margin-bottom: 1rem;">Welcome to SaaSApp</h1>
    <p style="font-size: 1.25rem; color: #6b7280; max-width: 600px; margin: 0 auto;">
      Experience the shimmer-sweep navbar above. It features a periodic glass shine, smooth underline animations, and a CSS-only mobile menu.
    </p>
  </main>
</body>
</html>
