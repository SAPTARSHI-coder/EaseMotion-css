<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Meteor Shower Loader</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="layout-container">
        
        <header class="section-header">
            <h1 class="title">Pure CSS Meteor Shower Loader</h1>
            <p class="subtitle">A mesmerizing full-screen loading animation featuring glowing meteors streaking diagonally across the night sky, built entirely with CSS keyframes.</p>
        </header>

        <div class="demo-area">
            
            <div class="loader-container" aria-label="Loading content, meteor shower animation playing">
                
                <div class="loading-text">Loading Universe...</div>
                
                <!-- 
                  [TECHNIQUE] The Meteor Shower
                  Multiple meteor elements are placed randomly using CSS.
                  Each has a different animation duration and delay to create 
                  an organic, non-uniform shower effect.
                -->
                <div class="meteor-shower" aria-hidden="true">
                    <!-- Meteor 1 -->
                    <div class="meteor m-1"></div>
                    <!-- Meteor 2 -->
                    <div class="meteor m-2"></div>
                    <!-- Meteor 3 -->
                    <div class="meteor m-3"></div>
                    <!-- Meteor 4 -->
                    <div class="meteor m-4"></div>
                    <!-- Meteor 5 -->
                    <div class="meteor m-5"></div>
                    <!-- Meteor 6 -->
                    <div class="meteor m-6"></div>
                </div>
                
            </div>
            
        </div>
        
    </div>

</body>
</html>
