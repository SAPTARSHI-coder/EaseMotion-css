<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Pastel Pagination</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="pastel-pagination">
        <a href="#" class="pp-btn prev">Prev</a>
        <div class="pp-numbers">
            <a href="#" class="pp-num">1</a>
            <a href="#" class="pp-num active">2</a>
            <a href="#" class="pp-num">3</a>
            <a href="#" class="pp-num">4</a>
        </div>
        <a href="#" class="pp-btn next">Next</a>
    </div>
</body>
</html>
