<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 3D Effect: Neumorphic</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="layout-container">
        
        <header class="section-header">
            <h1 class="title">Pure CSS 3D: Neumorphic Soft Shadow</h1>
            <p class="subtitle">A hardware-accelerated, JavaScript-free 3D animation utilizing `transform-style: preserve-3d`. Features dynamic, shifting box-shadows to simulate a fixed light source on a rotating object.</p>
        </header>

        <div class="demo-area">
            
            <!-- 
              [TECHNIQUE] The 3D Scene
              The wrapper establishes the perspective, allowing child elements
              to be transformed in 3D space.
            -->
            <div class="scene-3d">
                
                <!-- 
                  The primary rotating object. 
                  It uses preserve-3d to ensure its children maintain their 3D positions relative to it.
                -->
                <div class="object-3d">
                    
                    <!-- 
                      The Neumorphic Plate
                      As this element rotates, a CSS @keyframes animation simultaneously 
                      animates its box-shadow properties to keep the "light source" consistent.
                    -->
                    <div class="neu-plate">
                        
                        <!-- Inner extruded element -->
                        <div class="neu-core">
                            <div class="icon-neu">
                                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                                    <circle cx="12" cy="12" r="10"></circle>
                                    <path d="M12 16v-4"></path>
                                    <path d="M12 8h.01"></path>
                                </svg>
                            </div>
                        </div>
                        
                    </div>
                    
                </div>
                
            </div>
            
        </div>
        
    </div>

</body>
</html>
