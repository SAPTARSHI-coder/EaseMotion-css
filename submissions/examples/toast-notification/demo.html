<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toast Notification Component Demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f1f5f9;
      gap: 1rem;
    }
    .btn {
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      color: white;
      cursor: pointer;
      width: 200px;
    }
    .btn-success { background: #10b981; }
    .btn-error { background: #ef4444; }
    .btn-info { background: #3b82f6; }
  </style>
</head>
<body>

  <button class="btn btn-success" onclick="showToast('success')">Show Success Toast</button>
  <button class="btn btn-error" onclick="showToast('error')">Show Error Toast</button>
  <button class="btn btn-info" onclick="showToast('info')">Show Info Toast</button>

  <div class="toast-container-ag" id="toast-container">
    <!-- Toasts will be injected here by JS -->
  </div>

  <script>
    const contentMap = {
      success: { icon: '✓', title: 'Payment Successful', msg: 'Your order #1234 has been processed.' },
      error: { icon: '!', title: 'Connection Error', msg: 'Failed to save your changes to the server.' },
      info: { icon: 'i', title: 'Update Available', msg: 'A new version of the app is ready.' }
    };

    function showToast(type) {
      const container = document.getElementById('toast-container');
      const data = contentMap[type];

      const toast = document.createElement('div');
      // Notice we are adding the 'toast-slide-in-ag' entrance animation class here
      toast.className = `toast-ag toast-${type}-ag toast-slide-in-ag`;
      
      toast.innerHTML = `
        <div class="toast-icon-ag">${data.icon}</div>
        <div class="toast-content-ag">
          <h4 class="toast-title-ag">${data.title}</h4>
          <p class="toast-message-ag">${data.msg}</p>
        </div>
      `;

      container.appendChild(toast);

      // Auto-remove after 4 seconds
      setTimeout(() => {
        // Here we could add a fade-out class, but we'll just remove it for this demo
        toast.remove();
      }, 4000);
    }
  </script>
</body>
</html>
