<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Animated Night City</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="layout-container">
        
        <header class="section-header">
            <h1 class="title">Animated Night City</h1>
            <p class="subtitle">A pure CSS skyline illustration using <code>box-shadow</code> to generate complex pixel-art style buildings and animated, flickering window lights.</p>
        </header>

        <div class="demo-area">
            
            <!-- 
              [TECHNIQUE] The Canvas
              We use a single container for the city. 
              The skyline itself is generated using pseudo-elements and box-shadows.
            -->
            <div class="cityscape-container" aria-label="An animated silhouette of a city skyline at night with twinkling windows">
                
                <!-- The glowing moon in the background -->
                <div class="moon"></div>
                
                <!-- 
                  Building Elements
                  Instead of hundreds of divs, we use a few building blocks.
                  The complex window patterns are created inside style.css using repeating linear gradients.
                -->
                <div class="skyline">
                    <div class="building b1"></div>
                    <div class="building b2"></div>
                    <div class="building b3"></div>
                    <div class="building b4"></div>
                    <div class="building b5"></div>
                    <div class="building b6"></div>
                    <div class="building b7"></div>
                </div>
                
            </div>
            
        </div>
        
    </div>

</body>
</html>
