<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Hover: Spinner Variation - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="em-demo-container">
        <!-- Pure CSS Hover Spinner Component Showcase -->
        <header class="em-hover-card" role="region" aria-label="Hover Spinner Showcase" tabindex="0">
            <div class="em-hover-header-bar">
                <span class="em-card-badge">HOVER EFFECTS</span>
                <span class="em-brand-logo">SpinnerMotion</span>
            </div>
            <h1 class="em-card-title">Hover Spinner Component</h1>
            <p class="em-card-desc">A smooth, accessible, and performant pure CSS hover spinner featuring interactive rotation triggers and frosted glassmorphism card styling.</p>
            <div class="em-hover-wrapper">
                <div class="em-hover-spinner" aria-label="Loading animation">
                    <div class="em-spinner-circle"></div>
                    <span class="em-spinner-text">HOVER SPINNER</span>
                </div>
            </div>
        </header>
    </div>
</body>
</html>
