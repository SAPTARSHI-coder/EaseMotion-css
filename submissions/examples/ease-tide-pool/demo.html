<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tide Pool · Water Recedes & Returns</title>
    <meta name="description" content="Interactive tide pool simulation with water receding and returning, animated sea creatures, and soothing ocean atmosphere.">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1 class="title">🌊 TIDE POOL</h1>
        
        <div class="canvas-wrapper">
            <canvas id="tideCanvas" width="600" height="450"></canvas>
            <div class="glow-overlay"></div>
        </div>

        <div class="controls">
            <button class="toggle-btn" id="toggleBtn">⏸️ PAUSE</button>
            <button class="reset-btn" id="resetBtn">⟳ RESET</button>
            <div class="speed-control">
                <label>Speed</label>
                <input type="range" id="speedSlider" min="1" max="10" value="5">
                <span id="speedLabel">5</span>
            </div>
        </div>

        <div class="info">
            <span>🌊 TIDE POOL</span>
            <small>water recedes · returns · marine life</small>
        </div>
        <div class="hint">
            <span>🌊 watch the tide ebb and flow with sea creatures</span>
        </div>
    </div>

    <script>
        (function() {
            const canvas = document.getElementById('tideCanvas');
            const ctx = canvas.getContext('2d');
            const W = 600, H = 450;
            
            const toggleBtn = document.getElementById('toggleBtn');
            const resetBtn = document.getElementById('resetBtn');
            const speedSlider = document.getElementById('speedSlider');
            const speedLabel = document.getElementById('speedLabel');

            let isAnimating = true;
            let speed = 5;
            let time = 0;

            // ---- Tide Pool Class ----
            class TidePool {
                constructor() {
                    this.waterLevel = 0.5; // 0-1
                    this.waterTarget = 0.5;
                    this.waterSpeed = 0.002 + Math.random() * 0.001;
                    
                    // Sea creatures
                    this.creatures = [];
                    for (let i = 0; i < 8; i++) {
                        this.creatures.push({
                            x: Math.random() * W,
                            y: Math.random() * H * 0.6 + H * 0.3,
                            size: 3 + Math.random() * 5,
                            speed: 0.3 + Math.random() * 0.5,
                            angle: Math.random() * Math.PI * 2,
                            phase: Math.random() * Math.PI * 2,
                            color: `hsl(${200 + Math.random() * 40}, 60%, ${50 + Math.random() * 30}%)`
                        });
                    }
                    
                    // Anemones
                    this.anemones = [];
                    for (let i = 0; i < 6; i++) {
                        this.anemones.push({
                            x: 40 + Math.random() * (W - 80),
                            y: H - 30 - Math.random() * 40,
                            size: 8 + Math.random() * 10,
                            color: `hsl(${340 + Math.random() * 40}, 70%, ${50 + Math.random() * 30}%)`,
                            phase: Math.random() * Math.PI * 2
                        });
                    }
                    
                    // Rocks
                    this.rocks = [];
                    for (let i = 0; i < 10; i++) {
                        this.rocks.push({
                            x: 30 + Math.random() * (W - 60),
                            y: H - 20 - Math.random() * 30,
                            size: 10 + Math.random() * 25,
                            shape: Math.random() * 0.5 + 0.5
                        });
                    }
                }

                update() {
                    const dt = speed / 5;
                    time += 0.01 * dt;
                    
                    // Tide cycle (sine wave)
                    this.waterLevel = 0.3 + Math.sin(time * 0.02) * 0.3 + 0.2;
                    
                    // Update creatures
                    for (let c of this.creatures) {
                        c.angle += c.speed * 0.01 * dt;
                        c.x += Math.cos(c.angle + c.phase) * c.speed * 0.2 * dt;
                        c.y += Math.sin(c.angle * 0.7 + c.phase) * c.speed * 0.1 * dt;
                        
                        // Keep in bounds
                        if (c.x < 10) c.x = 10;
                        if (c.x > W - 10) c.x = W - 10;
                        if (c.y < H * 0.2) c.y = H * 0.2;
                        if (c.y > H - 20) c.y = H - 20;
                    }
                }

                draw(ctx) {
                    const waterY = H - (this.waterLevel * H * 0.5 + 50);
                    
                    // ---- Sky/Background ----
                    const skyGrad = ctx.createLinearGradient(0, 0, 0, H);
                    skyGrad.addColorStop(0, '#0a1628');
                    skyGrad.addColorStop(0.3, '#0d2137');
                    skyGrad.addColorStop(0.5, '#1a3a5a');
                    skyGrad.addColorStop(0.7, '#2a4a6a');
                    skyGrad.addColorStop(1, '#1a2a3a');
                    ctx.fillStyle = skyGrad;
                    ctx.fillRect(0, 0, W, H);
                    
                    // ---- Rocks ----
                    for (let r of this.rocks) {
                        ctx.save();
                        ctx.shadowColor = 'rgba(0,0,0,0.3)';
                        ctx.shadowBlur = 10;
                        ctx.fillStyle = `hsl(30, 20%, ${25 + Math.random() * 5}%)`;
                        ctx.beginPath();
                        ctx.ellipse(r.x, r.y, r.size * r.shape, r.size * 0.6, 0, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = `hsl(30, 15%, ${30 + Math.random() * 5}%)`;
                        ctx.beginPath();
                        ctx.ellipse(r.x - r.size * 0.2, r.y - r.size * 0.2, r.size * 0.6 * r.shape, r.size * 0.3, 0, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.restore();
                    }
                    
                    // ---- Anemones ----
                    for (let a of this.anemones) {
                        const pulse = 0.7 + Math.sin(time * 0.03 + a.phase) * 0.3;
                        ctx.save();
                        ctx.translate(a.x, a.y);
                        
                        // Base
                        ctx.fillStyle = a.color;
                        ctx.shadowColor = a.color;
                        ctx.shadowBlur = 15;
                        ctx.beginPath();
                        ctx.ellipse(0, 0, a.size * 0.5, a.size * 0.3, 0, 0, Math.PI * 2);
                        ctx.fill();
                        
                        // Tentacles
                        for (let i = 0; i < 12; i++) {
                            const angle = (i / 12) * Math.PI * 2 + time * 0.01;
                            const len = a.size * (0.4 + Math.sin(time * 0.04 + i + a.phase) * 0.2) * pulse;
                            const x = Math.cos(angle) * a.size * 0.3;
                            const y = Math.sin(angle) * a.size * 0.2;
                            ctx.strokeStyle = a.color;
                            ctx.lineWidth = 2 + Math.sin(time * 0.03 + i * 1.5) * 0.5;
                            ctx.shadowBlur = 10;
                            ctx.beginPath();
                            ctx.moveTo(x, y);
                            ctx.quadraticCurveTo(
                                Math.cos(angle + 0.3) * len * 0.7,
                                Math.sin(angle + 0.3) * len * 0.5 - len * 0.3,
                                Math.cos(angle) * len,
                                Math.sin(angle) * len * 0.8 - len * 0.2
                            );
                            ctx.stroke();
                        }
                        ctx.restore();
                    }
                    
                    // ---- Water ----
                    const waterGrad = ctx.createLinearGradient(0, waterY, 0, H);
                    waterGrad.addColorStop(0, `rgba(30, 120, 180, ${0.4 + this.waterLevel * 0.3})`);
                    waterGrad.addColorStop(0.3, `rgba(20, 100, 160, ${0.5 + this.waterLevel * 0.3})`);
                    waterGrad.addColorStop(0.7, `rgba(10, 70, 120, ${0.6 + this.waterLevel * 0.3})`);
                    waterGrad.addColorStop(1, `rgba(5, 40, 80, ${0.7 + this.waterLevel * 0.3})`);
                    ctx.fillStyle = waterGrad;
                    ctx.shadowBlur = 0;
                    ctx.beginPath();
                    ctx.rect(0, waterY, W, H - waterY);
                    ctx.fill();
                    
                    // ---- Water surface waves ----
                    ctx.save();
                    ctx.globalAlpha = 0.3 + this.waterLevel * 0.2;
                    ctx.strokeStyle = 'rgba(150, 220, 255, 0.3)';
                    ctx.lineWidth = 2;
                    ctx.shadowColor = 'rgba(150, 220, 255, 0.1)';
                    ctx.shadowBlur = 10;
                    ctx.beginPath();
                    for (let x = 0; x <= W; x += 2) {
                        const y = waterY + Math.sin(x * 0.03 + time * 0.04) * 3 +
                                 Math.sin(x * 0.05 + time * 0.03 + 1) * 2;
                        if (x === 0) ctx.moveTo(x, y);
                        else ctx.lineTo(x, y);
                    }
                    ctx.stroke();
                    ctx.restore();
                    
                    // ---- Sea creatures (in water) ----
                    for (let c of this.creatures) {
                        if (c.y > waterY) {
                            ctx.save();
                            ctx.fillStyle = c.color;
                            ctx.shadowColor = c.color;
                            ctx.shadowBlur = 10;
                            ctx.globalAlpha = 0.6 + Math.sin(time * 0.02 + c.phase) * 0.2;
                            
                            // Body
                            ctx.beginPath();
                            ctx.ellipse(c.x, c.y, c.size, c.size * 0.5, c.angle * 0.2, 0, Math.PI * 2);
                            ctx.fill();
                            
                            // Tail
                            ctx.beginPath();
                            const tailX = c.x - Math.cos(c.angle * 0.2) * c.size * 0.8;
                            const tailY = c.y - Math.sin(c.angle * 0.2) * c.size * 0.4;
                            ctx.moveTo(c.x - c.size * 0.6, c.y);
                            ctx.quadraticCurveTo(
                                tailX - c.size * 0.3,
                                tailY - c.size * 0.4,
                                tailX,
                                tailY
                            );
                            ctx.quadraticCurveTo(
                                tailX - c.size * 0.3,
                                tailY + c.size * 0.4,
                                c.x - c.size * 0.6,
                                c.y
                            );
                            ctx.fill();
                            
                            // Eye
                            ctx.shadowBlur = 0;
                            ctx.fillStyle = 'rgba(255,255,255,0.6)';
                            ctx.beginPath();
                            ctx.arc(c.x + c.size * 0.3, c.y - c.size * 0.1, c.size * 0.2, 0, Math.PI * 2);
                            ctx.fill();
                            ctx.fillStyle = 'rgba(0,0,0,0.5)';
                            ctx.beginPath();
                            ctx.arc(c.x + c.size * 0.4, c.y - c.size * 0.1, c.size * 0.1, 0, Math.PI * 2);
                            ctx.fill();
                            
                            ctx.restore();
                        }
                    }
                    
                    // ---- Water reflections ----
                    for (let i = 0; i < 20; i++) {
                        const x = (i * 137 + 20) % W;
                        const y = waterY + 20 + (i * 73 + time * 0.02 * 10) % (H - waterY - 30);
                        const size = 1 + Math.sin(time * 0.02 + i * 2) * 0.5 + 0.5;
                        ctx.fillStyle = `rgba(200, 240, 255, ${0.03 + Math.sin(time * 0.01 + i) * 0.02})`;
                        ctx.beginPath();
                        ctx.arc(x, y, size, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    
                    // ---- Shore/beach ----
                    const shoreY = waterY + 5;
                    ctx.fillStyle = `rgba(139, 119, 90, ${0.1 + (1 - this.waterLevel) * 0.1})`;
                    ctx.fillRect(0, shoreY, W, 10);
                    
                    // ---- Water edge foam ----
                    ctx.save();
                    ctx.globalAlpha = 0.2 + this.waterLevel * 0.2;
                    for (let i = 0; i < 30; i++) {
                        const x = (i * 47 + 10) % W;
                        const y = waterY + Math.sin(x * 0.04 + time * 0.05 + i) * 2;
                        ctx.fillStyle = `rgba(255, 255, 255, ${0.1 + Math.random() * 0.1})`;
                        ctx.beginPath();
                        ctx.arc(x, y, 2 + Math.random() * 3, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    ctx.restore();
                }
            }

            // ---- Create Tide Pool ----
            let tidePool;

            function createTidePool() {
                tidePool = new TidePool();
            }

            // ---- Animation Loop ----
            function animate() {
                if (!isAnimating) {
                    requestAnimationFrame(animate);
                    return;
                }
                
                tidePool.update();
                tidePool.draw(ctx);
                
                requestAnimationFrame(animate);
            }

            // ---- Toggle Animation ----
            function toggleAnimation() {
                isAnimating = !isAnimating;
                toggleBtn.textContent = isAnimating ? '⏸️ PAUSE' : '▶️ PLAY';
            }

            // ---- Reset ----
            function resetTidePool() {
                createTidePool();
                time = 0;
            }

            // ---- Speed Control ----
            speedSlider.addEventListener('input', function() {
                speed = parseInt(this.value);
                speedLabel.textContent = speed;
            });

            // ---- Event Listeners ----
            toggleBtn.addEventListener('click', toggleAnimation);
            resetBtn.addEventListener('click', resetTidePool);

            // ---- Keyboard Shortcuts ----
            document.addEventListener('keydown', function(e) {
                if (e.key === ' ' || e.key === 'Space') {
                    e.preventDefault();
                    toggleAnimation();
                }
                if (e.key === 'r' || e.key === 'R') {
                    resetTidePool();
                }
            });

            // ---- Initialize ----
            createTidePool();
            animate();

            console.log('🌊 Tide Pool · Press Space to pause · R to reset');
        })();
    </script>
</body>
</html>
