<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Origami Fold Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="desk">
    <div class="paper" id="paper" aria-hidden="true">
      <div class="half half-left"></div>
      <div class="half half-right"></div>
    </div>
    <button class="fold" id="fold" type="button">Fold Paper</button>
    <p class="hint">A square paper folds in half along a crease like origami.</p>
  </main>
  <script>
    const paper = document.getElementById("paper");
    const fold = document.getElementById("fold");
    function toggleFold() {
      paper.classList.toggle("folded");
      fold.textContent = paper.classList.contains("folded") ? "Unfold" : "Fold Paper";
    }
    fold.addEventListener("click", toggleFold);
  </script>
</body>
</html>
