<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parallax Hero | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="px-wrapper">
    <section class="px-hero">
      <div class="px-hero-bg"></div>
      <div class="px-hero-content">
        <h1 class="px-heading">Parallax Hero Section</h1>
        <p class="px-sub">Pure CSS animated hero with gradient background and smooth transitions.</p>
        <a href="#" class="px-btn" onclick="return false;">Get Started</a>
      </div>
    </section>
    <section class="px-section">
      <div class="px-grid">
        <div class="px-card">
          <h3 style="margin:0 0 0.5rem;">Feature One</h3>
          <p style="color:var(--tm-px-muted); margin:0;">Pure CSS parallax effect using transforms.</p>
        </div>
        <div class="px-card">
          <h3 style="margin:0 0 0.5rem;">Feature Two</h3>
          <p style="color:var(--tm-px-muted); margin:0;">Responsive layout adapts to any screen size.</p>
        </div>
        <div class="px-card">
          <h3 style="margin:0 0 0.5rem;">Feature Three</h3>
          <p style="color:var(--tm-px-muted); margin:0;">Dark and light mode support built in.</p>
        </div>
      </div>
    </section>
  </div>
</body>
</html>
