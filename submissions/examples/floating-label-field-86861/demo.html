<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Floating Label Field #86861 Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="showcase-wrapper">
    <form class="form-card" id="demoForm" onsubmit="event.preventDefault();">
      <div class="form-header">
        <span class="form-title">Account Registration</span>
        <span class="form-badge">CSS Field</span>
      </div>

      <div class="floating-field-group">
        <input 
          type="text" 
          id="fullName" 
          class="floating-input" 
          placeholder="Full Name" 
          autocomplete="off" 
          required
        >
        <label for="fullName" class="floating-label">Full Name</label>
      </div>

      <div class="floating-field-group">
        <input 
          type="email" 
          id="userEmail" 
          class="floating-input" 
          placeholder="Email Address" 
          autocomplete="off" 
          required
        >
        <label for="userEmail" class="floating-label">Email Address</label>
      </div>

      <button type="submit" class="btn-submit">Submit Form</button>
    </form>
  </div>

</body>
</html>
