<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Morphing Gradient Badge</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">

        <h1>Morphing Gradient Badge</h1>

        <p class="description">
            A responsive CSS-only badge with animated gradient and morphing effects.
        </p>

        <div class="badge-wrapper">
            <span class="morphing-badge">
                ✦ Featured
            </span>
        </div>

        <div class="badge-wrapper">
            <span class="morphing-badge">
                🚀 New
            </span>
        </div>

        <div class="badge-wrapper">
            <span class="morphing-badge">
                ✨ Popular
            </span>
        </div>

    </main>

</body>
</html>
