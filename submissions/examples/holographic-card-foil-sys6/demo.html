<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Holographic Parallax Credit Card with Interactive Foil Shimmer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../easemotion.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>Holographic Foil Credit Card</h1>
      <p>Hover over the card to reveal dynamic rainbow foil reflection.</p>
    </header>

    <main class="stage">
      <div class="holo-card" id="holoCard">
        <div class="card-chip"></div>
        <div class="card-number">•••• •••• •••• 4242</div>
        <div class="card-holder">EASEMOTION PREMIUM</div>
      </div>
    </main>
  </div>
</body>
</html>
