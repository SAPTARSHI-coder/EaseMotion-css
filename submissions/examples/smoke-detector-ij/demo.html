<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-smoke-detector</title>
</head>
<body>
<main class="smd-card">
  <header class="smd-head">
    <h1 class="smd-title">Detector 2</h1>
    <span class="smd-zone">Kitchen</span>
  </header>
  <section class="smd-device" aria-label="smoke detector">
    <span class="smd-led"></span>
    <span class="smd-grill smd-grill-1"></span>
    <span class="smd-grill smd-grill-2"></span>
    <span class="smd-grill smd-grill-3"></span>
    <span class="smd-button">TEST</span>
  </section>
  <section class="smd-read">
    <span class="smd-label">Air</span>
    <strong class="smd-level">Clear</strong>
  </section>
  <footer class="smd-foot">
    <span class="smd-batt">Batt 9V</span>
    <span class="smd-hush">Hush</span>
  </footer>
</main>
</body>
</html>
