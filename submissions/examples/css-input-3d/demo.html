<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Input: 3D Variation - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="em-demo-container">
        <!-- Pure CSS 3D Input Field Component Showcase -->
        <header class="em-input-card" role="region" aria-label="3D Input Field Showcase" tabindex="0">
            <div class="em-input-header-bar">
                <span class="em-card-badge">INPUT COMPONENTS</span>
                <span class="em-brand-logo">InputMotion</span>
            </div>
            <h1 class="em-card-title">3D Input Field</h1>
            <p class="em-card-desc">A smooth, accessible, and performant pure CSS 3D input field featuring extruded shadow depth, interactive focus ring states, and frosted glassmorphism.</p>
            <div class="em-input-wrapper">
                <div class="em-3d-input-group">
                    <label for="em-3d-text-input" class="em-input-label">ENTER DETAILS</label>
                    <input type="text" id="em-3d-text-input" class="em-3d-input" placeholder="Type something in 3D..." value="EaseMotion 3D Input">
                </div>
            </div>
        </header>
    </div>
</body>
</html>
