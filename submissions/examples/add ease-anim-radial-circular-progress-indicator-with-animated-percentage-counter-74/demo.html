<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyberpunk Radial Progress</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
</head>
<body>
    <div class="scanlines"></div>
    
    <div class="container">
        <div class="cyber-header">
            <h2>SYSTEM OVERRIDE</h2>
            <p>UPLOADING CONSTRUCT DATA...</p>
        </div>

        <div class="progress-wrapper cyber-glitch-hover">
            <!-- SVG for the radial progress -->
            <svg class="progress-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                <!-- Background track -->
                <circle class="progress-track" cx="100" cy="100" r="85"></circle>
                <!-- Animated progress line -->
                <circle class="progress-fill" cx="100" cy="100" r="85" data-target="87"></circle>
            </svg>
            
            <!-- Percentage Counter in the center -->
            <div class="progress-content">
                <span class="counter">0</span><span class="percent">%</span>
                <span class="status-text">SYNCING</span>
            </div>
        </div>

        <button class="cyber-btn" onclick="resetProgress()">INITIALIZE_REBOOT()</button>
    </div>

    <script>
        const circle = document.querySelector('.progress-fill');
        const counter = document.querySelector('.counter');
        const radius = circle.r.baseVal.value;
        const circumference = radius * 2 * Math.PI;

        // Set initial SVG stroke properties
        circle.style.strokeDasharray = `${circumference} ${circumference}`;
        circle.style.strokeDashoffset = circumference;

        function animateProgress() {
            const targetPercent = parseInt(circle.getAttribute('data-target'));
            const duration = 2500; // ms
            const startTime = performance.now();
            
            circle.style.strokeDashoffset = circumference; // reset
            counter.innerText = '0';

            function update(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);
                
                // Ease out expo for cyberpunk feel
                const easeOutExpo = progress === 1 ? 1 : 1 - Math.pow(2, -10 * progress);
                
                const currentPercent = Math.floor(easeOutExpo * targetPercent);
                counter.innerText = currentPercent;

                const offset = circumference - (currentPercent / 100) * circumference;
                circle.style.strokeDashoffset = offset;

                if (progress < 1) {
                    requestAnimationFrame(update);
                }
            }
            
            requestAnimationFrame(update);
        }

        function resetProgress() {
            // Glitch effect on reset
            const wrapper = document.querySelector('.progress-wrapper');
            wrapper.classList.add('glitch-active');
            setTimeout(() => wrapper.classList.remove('glitch-active'), 300);
            
            // Randomize target
            const newTarget = Math.floor(Math.random() * 60) + 40; // 40 to 99
            circle.setAttribute('data-target', newTarget);
            animateProgress();
        }

        // Run on load
        setTimeout(animateProgress, 500);
    </script>
</body>
</html>
