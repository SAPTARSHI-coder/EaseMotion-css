<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Emoji Reaction Bar</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <div class="reaction-bar-container">
    
    <!-- Static standalone reaction bar -->
    <div class="reaction-bar" role="toolbar" aria-label="Reaction bar">
      <button class="reaction-btn" aria-label="Like">👍</button>
      <button class="reaction-btn" aria-label="Love">❤️</button>
      <button class="reaction-btn" aria-label="Haha">😂</button>
      <button class="reaction-btn" aria-label="Wow">😮</button>
      <button class="reaction-btn" aria-label="Sad">😢</button>
      <button class="reaction-btn" aria-label="Angry">😡</button>
    </div>

    <!-- Interactive hover-reveal version -->
    <div style="margin-top: 80px;">
      <div class="hover-reveal-container">
        <button class="reaction-trigger">Hover to React</button>
        <div class="reaction-bar" role="toolbar" aria-label="Reaction bar">
          <button class="reaction-btn" aria-label="Like">👍</button>
          <button class="reaction-btn" aria-label="Love">❤️</button>
          <button class="reaction-btn" aria-label="Haha">😂</button>
          <button class="reaction-btn" aria-label="Wow">😮</button>
          <button class="reaction-btn" aria-label="Sad">😢</button>
          <button class="reaction-btn" aria-label="Angry">😡</button>
        </div>
      </div>
    </div>

  </div>

</body>
</html>
