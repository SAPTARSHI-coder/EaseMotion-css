<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ease-heatmap-visualization-grid — EaseMotion CSS Demo</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>

    <p class="demo-page-title">EaseMotion CSS — ease-heatmap-visualization-grid</p>

    <!--
      ══════════════════════════════════════════════════════
      COMPONENT: heatmap-grid-wrapper
      Swap .heatmap-theme-purple or .heatmap-theme-green
      onto .heatmap-grid-wrapper to change the color scale.
      ══════════════════════════════════════════════════════
    -->
    <div class="heatmap-grid-wrapper" id="heatmap-root">

      <!-- Header -->
      <div class="heatmap-grid-header">
        <div>
          <div class="heatmap-grid-title">Weekly Server Load</div>
          <div class="heatmap-grid-subtitle">Avg requests / hour · Last 8 weeks</div>
        </div>
        <!-- Theme switcher (pure CSS class swap via JS below) -->
        <div class="heatmap-theme-toggle" role="group" aria-label="Color theme">
          <button class="theme-btn active" data-theme=""        aria-pressed="true">Thermal</button>
          <button class="theme-btn"        data-theme="purple"  aria-pressed="false">Purple</button>
          <button class="theme-btn"        data-theme="green"   aria-pressed="false">Green</button>
        </div>
      </div>

      <!-- Axis layout -->
      <div class="heatmap-axis-layout">

        <!-- Y-axis labels (rows = hours) -->
        <div class="heatmap-y-axis" aria-hidden="true">
          <div class="heatmap-y-label">00:00</div>
          <div class="heatmap-y-label">04:00</div>
          <div class="heatmap-y-label">08:00</div>
          <div class="heatmap-y-label">12:00</div>
          <div class="heatmap-y-label">16:00</div>
          <div class="heatmap-y-label">20:00</div>
        </div>

        <!-- X-axis + cell rows -->
        <div class="heatmap-main">

          <!-- X-axis labels (columns = weeks) -->
          <div class="heatmap-x-axis" aria-hidden="true">
            <div class="heatmap-x-label">W1</div>
            <div class="heatmap-x-label">W2</div>
            <div class="heatmap-x-label">W3</div>
            <div class="heatmap-x-label">W4</div>
            <div class="heatmap-x-label">W5</div>
            <div class="heatmap-x-label">W6</div>
            <div class="heatmap-x-label">W7</div>
            <div class="heatmap-x-label">W8</div>
          </div>

          <!--
            Data rows: 6 time-bands × 8 weeks = 48 cells.
            Each cell gets:
              • .hg-lvl-{0-6}   — intensity level
              • .hg-d-{n}        — stagger delay (column × 6ms)
              • data-tip="…"     — tooltip text
          -->

          <!-- Row 1: 00:00 — quiet overnight -->
          <div class="heatmap-row" role="row" aria-label="00:00">
            <div class="hg-cell hg-lvl-0 hg-d-0"  data-tip="W1 · 00:00 · 0 req/s"   role="gridcell" tabindex="0" aria-label="Week 1, midnight, no load"></div>
            <div class="hg-cell hg-lvl-1 hg-d-6"  data-tip="W2 · 00:00 · 120 req/s"  role="gridcell" tabindex="0"></div>
            <div class="hg-cell hg-lvl-0 hg-d-12" data-tip="W3 · 00:00 · 0 req/s"   role="gridcell" tabindex="0"></div>
            <div class="hg-cell hg-lvl-1 hg-d-18" data-tip="W4 · 00:00 · 80 req/s"  role="gridcell" tabindex="0"></div>
            <div class="hg-cell hg-lvl-0 hg-d-24" data-tip="W5 · 00:00 · 0 req/s"   role="gridcell" tabindex="0"></div>
            <div class="hg-cell hg-lvl-2 hg-d-30" data-tip="W6 · 00:00 · 340 req/s" role="gridcell" tabindex="0"></div>
            <div class="hg-cell hg-lvl-1 hg-d-36" data-tip="W7 · 00:00 · 95 req/s"  role="gridcell" tabindex="0"></div>
            <div class="hg-cell hg-lvl-0 hg-d-42" data-tip="W8 · 00:00 · 0 req/s"   role="gridcell" tabindex="0"></div>
          </div>

          <!-- Row 2: 04:00 — low traffic -->
          <div class="heatmap-row" role="row" aria-label="04:00">
            <div class="hg-cell hg-lvl-1 hg-d-1"  data-tip="W1 · 04:00 · 110 req/s"  role="gridcell" tabindex="0"></div>
            <div class="hg-cell hg-lvl-2 hg-d-7"  data-tip="W2 · 04:00 · 420 req/s"  role="gridcell" tabindex="0"></div>
            <div class="hg-cell hg-lvl-1 hg-d-13" data-tip="W3 · 04:00 · 155 req/s"  role="gridcell" tabindex="0"></div>
            <div class="hg-cell hg-lvl-3 hg-d-19" data-tip="W4 · 04:00 · 680 req/s"  role="gridcell" tabindex="0"></div>
            <div class="hg-cell hg-lvl-2 hg-d-25" data-tip="W5 · 04:00 · 390 req/s"  role="gridcell" tabindex="0"></div>
            <div class="hg-cell hg-lvl-1 hg-d-31" data-tip="W6 · 04:00 · 200 req/s"  role="gridcell" tabindex="0"></div>
            <div class="hg-cell hg-lvl-0 hg-d-37" data-tip="W7 · 04:00 · 10 req/s"   role="gridcell" tabindex="0"></div>
            <div class="hg-cell hg-lvl-2 hg-d-43" data-tip="W8 · 04:00 · 510 req/s"  role="gridcell" tabindex="0"></div>
          </div>

          <!-- Row 3: 08:00 — morning ramp -->
          <div class="heatmap-row" role="row" aria-label="08:00">
            <div class="hg-cell hg-lvl-3 hg-d-2"  data-tip="W1 · 08:00 · 720 req/s"  role="gridcell" tabindex="0"></div>
            <div class="hg-cell hg-lvl-4 hg-d-8"  data-tip="W2 · 08:00 · 1.1k req/s" role="gridcell" tabindex="0"></div>
            <div class="hg-cell hg-lvl-3 hg-d-14" data-tip="W3 · 08:00 · 890 req/s"  role="gridcell" tabindex="0"></div>
            <div class="hg-cell hg-lvl-5 hg-d-20" data-tip="W4 · 08:00 · 1.8k req/s" role="gridcell" tabindex="0"></div>
            <div class="hg-cell hg-lvl-4 hg-d-26" data-tip="W5 · 08:00 · 1.3k req/s" role="gridcell" tabindex="0"></div>
            <div class="hg-cell hg-lvl-3 hg-d-32" data-tip="W6 · 08:00 · 950 req/s"  role="gridcell" tabindex="0"></div>
            <div class="hg-cell hg-lvl-4 hg-d-38" data-tip="W7 · 08:00 · 1.2k req/s" role="gridcell" tabindex="0"></div>
            <div class="hg-cell hg-lvl-6 hg-d-44" data-tip="W8 · 08:00 · 2.4k req/s" role="gridcell" tabindex="0"></div>
          </div>

          <!-- Row 4: 12:00 — peak midday -->
          <div class="heatmap-row" role="row" aria-label="12:00">
            <div class="hg-cell hg-lvl-5 hg-d-3"  data-tip="W1 · 12:00 · 1.7k req/s" role="gridcell" tabindex="0"></div>
            <div class="hg-cell hg-lvl-6 hg-d-9"  data-tip="W2 · 12:00 · 2.6k req/s" role="gridcell" tabindex="0"></div>
            <div class="hg-cell hg-lvl-5 hg-d-15" data-tip="W3 · 12:00 · 1.9k req/s" role="gridcell" tabindex="0"></div>
            <div class="hg-cell hg-lvl-6 hg-d-21" data-tip="W4 · 12:00 · 2.8k req/s" role="gridcell" tabindex="0"></div>
            <div class="hg-cell hg-lvl-5 hg-d-27" data-tip="W5 · 12:00 · 2.1k req/s" role="gridcell" tabindex="0"></div>
            <div class="hg-cell hg-lvl-4 hg-d-33" data-tip="W6 · 12:00 · 1.4k req/s" role="gridcell" tabindex="0"></div>
            <div class="hg-cell hg-lvl-6 hg-d-39" data-tip="W7 · 12:00 · 2.5k req/s" role="gridcell" tabindex="0"></div>
            <div class="hg-cell hg-lvl-5 hg-d-45" data-tip="W8 · 12:00 · 2.0k req/s" role="gridcell" tabindex="0"></div>
          </div>

          <!-- Row 5: 16:00 — afternoon -->
          <div class="heatmap-row" role="row" aria-label="16:00">
            <div class="hg-cell hg-lvl-4 hg-d-4"  data-tip="W1 · 16:00 · 1.2k req/s" role="gridcell" tabindex="0"></div>
            <div class="hg-cell hg-lvl-3 hg-d-10" data-tip="W2 · 16:00 · 850 req/s"  role="gridcell" tabindex="0"></div>
            <div class="hg-cell hg-lvl-4 hg-d-16" data-tip="W3 · 16:00 · 1.1k req/s" role="gridcell" tabindex="0"></div>
            <div class="hg-cell hg-lvl-5 hg-d-22" data-tip="W4 · 16:00 · 1.6k req/s" role="gridcell" tabindex="0"></div>
            <div class="hg-cell hg-lvl-3 hg-d-28" data-tip="W5 · 16:00 · 740 req/s"  role="gridcell" tabindex="0"></div>
            <div class="hg-cell hg-lvl-4 hg-d-34" data-tip="W6 · 16:00 · 1.3k req/s" role="gridcell" tabindex="0"></div>
            <div class="hg-cell hg-lvl-5 hg-d-40" data-tip="W7 · 16:00 · 1.7k req/s" role="gridcell" tabindex="0"></div>
            <div class="hg-cell hg-lvl-4 hg-d-46" data-tip="W8 · 16:00 · 1.4k req/s" role="gridcell" tabindex="0"></div>
          </div>

          <!-- Row 6: 20:00 — evening wind-down -->
          <div class="heatmap-row" role="row" aria-label="20:00">
            <div class="hg-cell hg-lvl-2 hg-d-5"  data-tip="W1 · 20:00 · 430 req/s"  role="gridcell" tabindex="0"></div>
            <div class="hg-cell hg-lvl-3 hg-d-11" data-tip="W2 · 20:00 · 760 req/s"  role="gridcell" tabindex="0"></div>
            <div class="hg-cell hg-lvl-2 hg-d-17" data-tip="W3 · 20:00 · 510 req/s"  role="gridcell" tabindex="0"></div>
            <div class="hg-cell hg-lvl-2 hg-d-23" data-tip="W4 · 20:00 · 480 req/s"  role="gridcell" tabindex="0"></div>
            <div class="hg-cell hg-lvl-3 hg-d-29" data-tip="W5 · 20:00 · 820 req/s"  role="gridcell" tabindex="0"></div>
            <div class="hg-cell hg-lvl-2 hg-d-35" data-tip="W6 · 20:00 · 390 req/s"  role="gridcell" tabindex="0"></div>
            <div class="hg-cell hg-lvl-1 hg-d-41" data-tip="W7 · 20:00 · 180 req/s"  role="gridcell" tabindex="0"></div>
            <div class="hg-cell hg-lvl-3 hg-d-47" data-tip="W8 · 20:00 · 700 req/s"  role="gridcell" tabindex="0"></div>
          </div>

        </div><!-- /.heatmap-main -->
      </div><!-- /.heatmap-axis-layout -->

      <!-- Legend -->
      <div class="heatmap-legend" aria-label="Color intensity scale">
        <span class="heatmap-legend-label">Less</span>
        <div class="heatmap-legend-scale" aria-hidden="true">
          <div class="hg-legend-swatch hg-swatch-0"></div>
          <div class="hg-legend-swatch hg-swatch-1"></div>
          <div class="hg-legend-swatch hg-swatch-2"></div>
          <div class="hg-legend-swatch hg-swatch-3"></div>
          <div class="hg-legend-swatch hg-swatch-4"></div>
          <div class="hg-legend-swatch hg-swatch-5"></div>
          <div class="hg-legend-swatch hg-swatch-6"></div>
        </div>
        <span class="heatmap-legend-text">More</span>
      </div>

    </div><!-- /.heatmap-grid-wrapper -->

    <p class="demo-page-sub">
      Hover any cell for its value · click a theme to switch the color scale
    </p>

    <!--
      Theme switcher — pure JS class swap, no framework needed.
      This is demo scaffolding; not part of the CSS component itself.
    -->
    <script>
      const root = document.getElementById('heatmap-root');
      const btns = document.querySelectorAll('.theme-btn');

      btns.forEach(btn => {
        btn.addEventListener('click', () => {
          // Remove all theme classes
          root.classList.remove('heatmap-theme-purple', 'heatmap-theme-green');

          const theme = btn.dataset.theme;
          if (theme) root.classList.add(`heatmap-theme-${theme}`);

          // Update aria-pressed
          btns.forEach(b => b.setAttribute('aria-pressed', 'false'));
          btns.forEach(b => b.classList.remove('active'));
          btn.setAttribute('aria-pressed', 'true');
          btn.classList.add('active');
        });
      });
    </script>

  </body>
</html>
