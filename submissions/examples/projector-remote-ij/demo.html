<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-projector-remote</title>
</head>
<body>
<main class="ptr-remote">
  <header class="ptr-top">
    <h1 class="ptr-brand">ViewMax</h1>
    <span class="ptr-pair">Paired</span>
  </header>
  <section class="ptr-ir" aria-label="infrared emitter">
    <span class="ptr-lens"></span>
  </section>
  <section class="ptr-inputs" aria-label="input keys">
    <button class="ptr-input">HDMI1</button>
    <button class="ptr-input">HDMI2</button>
    <button class="ptr-input">VGA</button>
  </section>
  <section class="ptr-power" aria-label="power key">
    <button class="ptr-pbtn">Power</button>
  </section>
  <footer class="ptr-foot">
    <span class="ptr-up">Vol +</span>
    <span class="ptr-down">Vol -</span>
  </footer>
</main>
</body>
</html>
