<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="CSS Soap Bubble Background">
    <title>CSS Soap Bubble Background</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="bubble-demo">

        <section class="bubble-content" aria-labelledby="bubble-title">
            <p class="eyebrow">EaseMotion CSS</p>

            <h1 id="bubble-title">
                Soap Bubble Background
            </h1>

            <p>
                A lightweight animated background featuring
                floating iridescent soap bubbles created entirely
                with HTML and CSS.
            </p>
        </section>

        <div class="bubble-background" aria-hidden="true">

            <span class="bubble bubble--1"></span>
            <span class="bubble bubble--2"></span>
            <span class="bubble bubble--3"></span>
            <span class="bubble bubble--4"></span>
            <span class="bubble bubble--5"></span>
            <span class="bubble bubble--6"></span>
            <span class="bubble bubble--7"></span>
            <span class="bubble bubble--8"></span>

        </div>

    </main>

</body>
</html>
