<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sextant Index Mirror — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Sextant Index Mirror demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Sextant Index Mirror</h1>
      <p class="lede">Sextant index mirror bringing horizon and star together</p>
    </header>

    <section class="ease-sextant-index-mirror" data-demo="sextant-index-mirror" aria-live="polite">
      <div class="ease-sextant-index-mirror__housing">
        <div class="ease-sextant-index-mirror__bezel">
          <div class="ease-sextant-index-mirror__face">
            <div class="ease-sextant-index-mirror__readout">
              <span class="ease-sextant-index-mirror__label">Sextant Index Mirror</span>
              <span class="ease-sextant-index-mirror__value">LIVE</span>
            </div>
            <div class="ease-sextant-index-mirror__motion" aria-hidden="true">
              <span class="ease-sextant-index-mirror__a"></span>
              <span class="ease-sextant-index-mirror__b"></span>
              <span class="ease-sextant-index-mirror__c"></span>
              <span class="ease-sextant-index-mirror__d"></span>
            </div>
            <div class="ease-sextant-index-mirror__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-sextant-index-mirror__controls">
          <button type="button" class="ease-sextant-index-mirror__btn primary">Engage</button>
          <button type="button" class="ease-sextant-index-mirror__btn">Reset</button>
          <label class="ease-sextant-index-mirror__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-sextant-index-mirror__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
