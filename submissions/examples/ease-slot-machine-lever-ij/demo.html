<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.3">
<title>Slot Machine Lever</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="slots">
  <header class="slots-head">
    <h1 class="slots-title">JACKPOT</h1>
    <p class="slots-credit">3 CREDITS</p>
  </header>
  <section class="slots-glass" aria-label="Slot machine reels">
    <div class="reel reel-one"><span>7</span><span>BAR</span><span>J</span></div>
    <div class="reel reel-two"><span>BAR</span><span>J</span><span>7</span></div>
    <div class="reel reel-three"><span>J</span><span>7</span><span>BAR</span></div>
  </section>
  <section class="slots-console" aria-label="Slot controls">
    <span class="coin-slot"></span>
    <button class="lever" type="button"><span class="lever-grip"></span></button>
  </section>
  <footer class="slots-foot">
    <span class="slots-payout">$0</span>
    <span class="slots-spin">SPIN</span>
  </footer>
</main>
</body>
</html>
