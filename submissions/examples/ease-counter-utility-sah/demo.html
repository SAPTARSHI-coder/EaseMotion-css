<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Count-Up Utility - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="stats-dashboard">
    <header>
      <h1>CSS Animated Counter (<code>ease-counter</code>)</h1>
      <p>Pure-CSS number incrementation powered by Houdini <code>@property</code> & counter tokens.</p>
    </header>
    <div class="grid-stats">
      <div class="stat-card">
        <span class="label">GitHub Stars</span>
        <div class="counter-val count-stars"></div>
        <span class="trend">+24% this week</span>
      </div>
      <div class="stat-card">
        <span class="label">Total Contributions</span>
        <div class="counter-val count-contribs"></div>
        <span class="trend">GSSoC 2026 Active</span>
      </div>
      <div class="stat-card">
        <span class="label">Animation Speed (FPS)</span>
        <div class="counter-val count-fps"></div>
        <span class="trend">Zero Reflow GPU</span>
      </div>
    </div>
  </div>
</body>
</html>
