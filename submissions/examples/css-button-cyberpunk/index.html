<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Button: Cyberpunk Styling Variation - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="em-demo-container">
        <!-- Pure CSS Cyberpunk Button Component Showcase -->
        <header class="em-button-card" role="region" aria-label="Cyberpunk Button Showcase" tabindex="0">
            <div class="em-button-header-bar">
                <span class="em-card-badge">BUTTON COMPONENTS</span>
                <span class="em-brand-logo">CyberButton</span>
            </div>
            <h1 class="em-card-title">Responsive Button - Cyberpunk</h1>
            <p class="em-card-desc">A fully responsive, highly performant pure CSS button featuring neon cyberpunk gradients, glitch border styling, and frosted glassmorphism.</p>
            <div class="em-button-wrapper">
                <button class="em-cyberpunk-button" aria-label="Interactive Cyberpunk Button">
                    <span class="em-btn-glitch-text">INITIALIZE SYSTEM</span>
                </button>
            </div>
        </header>
    </div>
</body>
</html>
