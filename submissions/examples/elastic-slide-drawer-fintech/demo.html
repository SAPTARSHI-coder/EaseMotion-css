<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Elastic-Slide Drawer — Fintech Dashboard</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-shell">
      <button
        class="drawer-toggle"
        id="openDrawer"
        aria-label="Open navigation drawer"
      >
        <span></span><span></span><span></span>
      </button>

      <aside class="drawer" id="drawer" aria-hidden="true">
        <div class="drawer__overlay" id="drawerOverlay"></div>
        <div class="drawer__panel">
          <div class="drawer__header">
            <h2 class="drawer__title">Menu</h2>
            <button
              class="drawer__close"
              id="closeDrawer"
              aria-label="Close drawer"
            >
              &times;
            </button>
          </div>
          <nav class="drawer__nav">
            <a href="#" class="drawer__link drawer__link--active">
              <svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                <polyline points="9 22 9 12 15 12 15 22" />
              </svg>
              Dashboard
            </a>
            <a href="#" class="drawer__link">
              <svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <line x1="12" y1="1" x2="12" y2="23" />
                <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6" />
              </svg>
              Transactions
            </a>
            <a href="#" class="drawer__link">
              <svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <rect x="2" y="7" width="20" height="14" rx="2" ry="2" />
                <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16" />
              </svg>
              Accounts
            </a>
            <a href="#" class="drawer__link">
              <svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <polyline points="23 6 13.5 15.5 8.5 10.5 1 18" />
                <polyline points="17 6 23 6 23 12" />
              </svg>
              Analytics
            </a>
            <a href="#" class="drawer__link">
              <svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <circle cx="12" cy="12" r="3" />
                <path
                  d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"
                />
              </svg>
              Settings
            </a>
          </nav>
          <div class="drawer__footer">
            <div class="drawer__user">
              <div class="drawer__avatar">AK</div>
              <div class="drawer__user-info">
                <span class="drawer__user-name">Anmol Kumar</span>
                <span class="drawer__user-role">Premium</span>
              </div>
            </div>
          </div>
        </div>
      </aside>

      <main class="main-content">
        <h1 class="main-content__title">Dashboard</h1>
        <p class="main-content__hint">
          Click the hamburger icon to open the drawer
        </p>
        <div class="metric-grid">
          <div class="metric-card">
            <span class="metric-card__label">Revenue</span>
            <span class="metric-card__value">$48,290</span>
          </div>
          <div class="metric-card">
            <span class="metric-card__label">Users</span>
            <span class="metric-card__value">12,847</span>
          </div>
          <div class="metric-card">
            <span class="metric-card__label">Growth</span>
            <span class="metric-card__value">+24.3%</span>
          </div>
        </div>
      </main>
    </div>

    <script>
      var drawer = document.getElementById("drawer");
      var overlay = document.getElementById("drawerOverlay");

      document
        .getElementById("openDrawer")
        .addEventListener("click", function () {
          drawer.classList.add("drawer--open");
          drawer.setAttribute("aria-hidden", "false");
        });

      document
        .getElementById("closeDrawer")
        .addEventListener("click", function () {
          drawer.classList.remove("drawer--open");
          drawer.setAttribute("aria-hidden", "true");
        });

      overlay.addEventListener("click", function () {
        drawer.classList.remove("drawer--open");
        drawer.setAttribute("aria-hidden", "true");
      });
    </script>
  </body>
</html>
