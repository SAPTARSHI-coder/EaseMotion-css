<!-- submissions/examples/retro-game-life-bar/demo.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retro Game Life Bar | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="demo-container">
    <h1 class="demo-title">PLAYER 1 STATS</h1>

    <div class="ease-retro-hud">
      
      <!-- Full Health Block Bar -->
      <div class="ease-hud-row">
        <span class="ease-hud-label">HP</span>
        <div class="ease-retro-bar" role="progressbar" aria-valuenow="70" aria-valuemin="0" aria-valuemax="100" aria-label="Player Health Bar">
          <div class="ease-bar-segment"></div>
          <div class="ease-bar-segment"></div>
          <div class="ease-bar-segment"></div>
          <div class="ease-bar-segment"></div>
          <div class="ease-bar-segment"></div>
          <div class="ease-bar-segment"></div>
          <div class="ease-bar-segment"></div>
          <div class="ease-bar-segment spent"></div>
          <div class="ease-bar-segment spent"></div>
          <div class="ease-bar-segment spent"></div>
        </div>
      </div>

      <!-- Critical Health Danger Warning Bar -->
      <div class="ease-hud-row">
        <span class="ease-hud-label">CRIT</span>
        <div class="ease-retro-bar" data-status="danger" role="progressbar" aria-valuenow="20" aria-valuemin="0" aria-valuemax="100" aria-label="Critical Health Warning">
          <div class="ease-bar-segment"></div>
          <div class="ease-bar-segment"></div>
          <div class="ease-bar-segment spent"></div>
          <div class="ease-bar-segment spent"></div>
          <div class="ease-bar-segment spent"></div>
          <div class="ease-bar-segment spent"></div>
          <div class="ease-bar-segment spent"></div>
          <div class="ease-bar-segment spent"></div>
          <div class="ease-bar-segment spent"></div>
          <div class="ease-bar-segment spent"></div>
        </div>
      </div>

      <!-- Pixel Hearts Variant -->
      <div class="ease-hud-row">
        <span class="ease-hud-label">LIFE</span>
        <div class="ease-retro-hearts" role="status" aria-label="Player Lives Remaining: 2 of 3">
          <span class="ease-pixel-heart pulsing" aria-hidden="true">♥</span>
          <span class="ease-pixel-heart pulsing" aria-hidden="true">♥</span>
          <span class="ease-pixel-heart spent" aria-hidden="true">♥</span>
        </div>
      </div>

    </div>
  </main>

</body>
</html>
