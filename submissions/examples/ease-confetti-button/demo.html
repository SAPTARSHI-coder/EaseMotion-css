<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Confetti Button - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="ease-confetti-wrapper">
    <input type="checkbox" id="confetti-hack" class="ease-confetti-trigger" aria-hidden="true">
    <label for="confetti-hack" class="ease-confetti-btn" role="button" tabindex="0">
      Celebrate!
      <!-- Particles mapped with trajectory math -->
      <span class="ease-confetti-particle" style="--tx: -80px; --ty: -120px; --c: #ef4444;"></span>
      <span class="ease-confetti-particle" style="--tx: 80px; --ty: -130px; --c: #10b981;"></span>
      <span class="ease-confetti-particle" style="--tx: -120px; --ty: -60px; --c: #f59e0b;"></span>
      <span class="ease-confetti-particle" style="--tx: 120px; --ty: -40px; --c: #8b5cf6;"></span>
      <span class="ease-confetti-particle" style="--tx: -40px; --ty: -150px; --c: #06b6d4;"></span>
      <span class="ease-confetti-particle" style="--tx: 40px; --ty: -160px; --c: #f43f5e;"></span>
      <span class="ease-confetti-particle" style="--tx: -150px; --ty: 10px; --c: #3b82f6;"></span>
      <span class="ease-confetti-particle" style="--tx: 150px; --ty: 20px; --c: #eab308;"></span>
    </label>
  </div>
  <p style="position: absolute; bottom: 2rem; color: #64748b; font-family: system-ui; font-size: 0.875rem;">Click button to trigger Pure CSS Confetti (Checkbox Hack). Click again to reset.</p>
</body>
</html>
