<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neumorphic Hero: Material Design</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Main Hero Section -->
    <section class="hero-section">
        
        <!-- Left Content Column -->
        <div class="hero-content">
            
            <!-- Neumorphic Pill Tag -->
            <div class="neu-tag">
                <span class="pulse-dot"></span>
                <span>Material v3.0 Released</span>
            </div>
            
            <h1 class="hero-title">Design with <span class="text-gradient">Soft UI</span></h1>
            <p class="hero-description">Experience the perfect blend of Neumorphism's tactile depth and Material Design's bold, purposeful color palette. Build interfaces that users can almost feel.</p>
            
            <div class="hero-actions">
                <!-- Primary Action (Material Colored + Neumorphic Pressed state) -->
                <button class="neu-btn primary">
                    Get Started
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                </button>
                
                <!-- Secondary Action (Classic Neumorphic) -->
                <button class="neu-btn secondary">
                    View Documentation
                </button>
            </div>
            
        </div>
        
        <!-- Right Visual Column -->
        <div class="hero-visual">
            <!-- Large Neumorphic Card holding an abstract graphic -->
            <div class="neu-card">
                <div class="card-inner">
                    <img src="https://images.unsplash.com/photo-1550751827-4bd374c3f58b?q=80&w=2070&auto=format&fit=crop" alt="Abstract 3D Shapes" class="hero-image">
                </div>
                
                <!-- Floating Neumorphic Elements -->
                <div class="float-element float-1">
                    <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
                </div>
                <div class="float-element float-2">
                    <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                </div>
            </div>
        </div>
        
    </section>

</body>
</html>
