<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Glow on Scroll Nav - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="em-scroll-page">
        <div class="em-card" role="region" aria-label="Glow on Scroll Nav Showcase" tabindex="0">
            <span class="em-card-badge">SCROLL ANIMATIONS</span>
            <h1 class="em-card-title">Glow on Scroll Nav</h1>
            <p class="em-card-desc">A sticky navigation bar that dynamically gains a vibrant neon glow and drop-shadow purely based on the scroll position using modern CSS.</p>
            
            <div class="em-mock-browser" role="region" aria-label="Scrollable demo container" tabindex="0">
                <nav class="em-scroll-nav" role="navigation" aria-label="Main mock navigation">
                    <span class="em-nav-brand">EaseMotion</span>
                    <div class="em-nav-links">
                        <span class="em-nav-item">Home</span>
                        <span class="em-nav-item">Docs</span>
                    </div>
                </nav>

                <div class="em-scroll-content">
                    <p class="em-scroll-hint">Scroll down this container to activate the navbar glow...</p>
                    <div class="em-spacer"></div>
                    <div class="em-spacer"></div>
                    <p class="em-scroll-hint">You have reached the bottom.</p>
                </div>
            </div>

            <a href="#" class="em-card-btn" role="button">View Source</a>
        </div>
    </div>
</body>
</html>
