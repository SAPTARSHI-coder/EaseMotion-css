<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Elastic-Slide Popover</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<section class="hero">

    <h1>Gaming Hub Popover</h1>

    <p>
        Hover over the player card to reveal an Elastic-Slide Popover built entirely with HTML and CSS.
    </p>

    <div class="popover-wrapper">

        <button class="trigger">
            🎮 View Player
        </button>

        <div class="popover">

            <div class="avatar">
                ⚔️
            </div>

            <h2>Phantom Slayer</h2>

            <p>
                Level 99 • Mythic League<br>
                Guild: Night Hunters<br>
                MVP Streak: 27 Wins
            </p>

            <a href="#" class="action-btn">
                View Profile
            </a>

        </div>

    </div>

</section>

</body>
</html>
