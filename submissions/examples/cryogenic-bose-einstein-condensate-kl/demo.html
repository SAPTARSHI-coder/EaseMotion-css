<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cryogenic Bose-Einstein Condensate - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #020617; color: #ffffff;">

    <div class="ease-card ease-card-glass bec-container">
        <div class="bec-header">
            <h2>Bose-Einstein BEC</h2>
            <span class="ease-badge ease-badge-info">Absolute Zero</span>
        </div>
        
        <div class="bec-screen ease-center">
            <div class="superfluid-vortex vortex-1"></div>
            <div class="superfluid-vortex vortex-2"></div>
            <div class="phase-transition-ring"></div>
            <div class="condensate-core ease-center"></div>
        </div>

        <div class="bec-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Temp: 1nK</span>
            <button class="ease-btn ease-btn-primary ease-btn-sm ease-hover-grow">Cool Laser</button>
        </div>
    </div>

</body>
</html>
