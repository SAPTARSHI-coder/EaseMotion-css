<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animated Tooltip Collection - Issue #87415</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="ease-tip-stage" aria-labelledby="stage-title">
    <div>
      <h1 id="stage-title" class="ease-tip-title">Animated Tooltip Gallery</h1>
      <p class="ease-tip-desc">Explore pure CSS tooltips supporting top, bottom, left, and right positions with fade, scale, and slide animations.</p>
    </div>

    <div class="ease-tip-grid">
      <!-- Top Fade Tooltip -->
      <div class="ease-tooltip-container">
        <button type="button" class="ease-tip-btn">Top Position (Fade)</button>
        <div class="ease-tooltip pos-top anim-fade" role="tooltip">Informational top tip</div>
      </div>

      <!-- Bottom Scale Tooltip -->
      <div class="ease-tooltip-container">
        <button type="button" class="ease-tip-btn">Bottom Position (Scale)</button>
        <div class="ease-tooltip pos-bottom anim-scale" role="tooltip">Dynamic scale popup</div>
      </div>

      <!-- Left Slide Tooltip -->
      <div class="ease-tooltip-container">
        <button type="button" class="ease-tip-btn">Left Position (Slide)</button>
        <div class="ease-tooltip pos-left anim-slide" role="tooltip">Sliding left hint</div>
      </div>

      <!-- Right Scale Tooltip -->
      <div class="ease-tooltip-container">
        <button type="button" class="ease-tip-btn">Right Position (Scale)</button>
        <div class="ease-tooltip pos-right anim-scale" role="tooltip">Right side details</div>
      </div>
    </div>
  </main>
</body>
</html>
