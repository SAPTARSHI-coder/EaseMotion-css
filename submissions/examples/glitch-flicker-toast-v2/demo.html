<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CSS Glitch-Flicker Toast for fintech dashboard layouts">
  <title>Glitch-Flicker Toast</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="dashboard">

```
<header class="header">
  <div>
    <span class="label">FINTECH DASHBOARD</span>
    <h1>Transaction Overview</h1>
  </div>

  <div class="status">
    <span class="status-dot"></span>
    Account Active
  </div>
</header>

<section class="cards">

  <article class="card">
    <span>Available Balance</span>
    <strong>$54,820.00</strong>
    <small>+8.4% this month</small>
  </article>

  <article class="card">
    <span>Monthly Revenue</span>
    <strong>$21,460.00</strong>
    <small>+12.2% this month</small>
  </article>

  <article class="card">
    <span>Pending Transactions</span>
    <strong>08</strong>
    <small>3 transactions today</small>
  </article>

</section>

<aside class="toast" role="status" aria-live="polite">

  <div class="toast-icon" aria-hidden="true">
    !
  </div>

  <div class="toast-content">
    <strong>New Transaction</strong>
    <p>A payment of $840.00 was received.</p>
  </div>

  <button class="toast-close" type="button" aria-label="Close notification">
    ×
  </button>

</aside>
```

  </main>

</body>
</html>
