<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vaporwave Grid Pulse Horizon Animation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="demo-container">
        <header>
            <h1>EaseMotion Core Proposal</h1>
            <p>Vaporwave Grid Pulse Horizon DSL Motion Preset</p>
        </header>

        <section class="demo-grid">
            <div class="card full-width">
                <h2>Infinite 3D Horizon</h2>
                <!-- 
                    The container provides the perspective.
                    The inner element applies the DSL class which handles the 3D translation.
                -->
                <div class="horizon-container">
                    <div class="grid-plane ease-anim-vaporwave-grid-pulse-horizon"></div>
                    <div class="sun"></div>
                </div>
            </div>
        </section>

        <section class="controls">
            <p><strong>Note:</strong> If you have "Prefers Reduced Motion" enabled in your OS settings, this animation will gracefully degrade, completely disabling the continuous 3D spatial movement to prevent vestibular discomfort.</p>
        </section>
    </main>

</body>
</html>
