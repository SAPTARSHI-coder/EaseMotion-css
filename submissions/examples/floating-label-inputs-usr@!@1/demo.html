<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Floating Label Form Inputs - EaseMotion Submission</title>
  
  <!-- EaseMotion CSS Official CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="container ease-fade-in">
    <div class="form-wrapper ease-slide-up">
      <h1>Create Account</h1>
      <p>Join thousands of users today</p>
      
      <form class="floating-form" onsubmit="handleSubmit(event)">
        
        <!-- Text Input with Floating Label -->
        <div class="input-group ease-slide-up ease-delay-100">
          <input type="text" id="fullName" class="floating-input" required>
          <label for="fullName" class="floating-label">Full Name</label>
          <span class="input-icon">👤</span>
        </div>

        <!-- Email Input with Floating Label -->
        <div class="input-group ease-slide-up ease-delay-200">
          <input type="email" id="email" class="floating-input" required>
          <label for="email" class="floating-label">Email Address</label>
          <span class="input-icon">📧</span>
        </div>

        <!-- Password Input with Floating Label -->
        <div class="input-group ease-slide-up ease-delay-300">
          <input type="password" id="password" class="floating-input" required>
          <label for="password" class="floating-label">Password</label>
          <span class="input-icon">🔒</span>
        </div>

        <!-- Phone Input with Floating Label -->
        <div class="input-group ease-slide-up ease-delay-400">
          <input type="tel" id="phone" class="floating-input">
          <label for="phone" class="floating-label">Phone Number (Optional)</label>
          <span class="input-icon">📱</span>
        </div>

        <!-- Textarea with Floating Label -->
        <div class="input-group textarea-group ease-slide-up ease-delay-500">
          <textarea id="bio" class="floating-input floating-textarea" rows="3"></textarea>
          <label for="bio" class="floating-label">Bio (Optional)</label>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="submit-btn ease-hover-lift ease-slide-up ease-delay-600">
          <span>Create Account</span>
          <span class="btn-arrow">→</span>
        </button>

      </form>

      <p class="form-footer ease-fade-in ease-delay-700">
        Already have an account? <a href="#">Sign in</a>
      </p>
    </div>
  </div>

  <!-- Minimal JS for form handling -->
  <script>
    function handleSubmit(event) {
      event.preventDefault();
      
      // Get form values
      const fullName = document.getElementById('fullName').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      
      // Show success message (in real app, you'd send to server)
      alert(`Account created successfully!\n\nName: ${fullName}\nEmail: ${email}`);
      
      // Reset form
      event.target.reset();
    }
  </script>

</body>
</html>
