<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Pure CSS color wheel loader with rotating segment highlights."
  >
  <title>CSS Color Wheel Loader</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="demo">
    <section
      class="loader-card"
      aria-labelledby="loader-title"
      aria-describedby="loader-description"
    >
      <div
        class="color-wheel"
        role="status"
        aria-label="Loading"
      >
        <span class="wheel-segment segment-1"></span>
        <span class="wheel-segment segment-2"></span>
        <span class="wheel-segment segment-3"></span>
        <span class="wheel-segment segment-4"></span>
        <span class="wheel-segment segment-5"></span>
        <span class="wheel-segment segment-6"></span>
        <span class="wheel-segment segment-7"></span>
        <span class="wheel-segment segment-8"></span>

        <span class="wheel-center" aria-hidden="true">
          <span class="wheel-dot"></span>
        </span>
      </div>

      <h1 id="loader-title">Color Wheel Loader</h1>

      <p id="loader-description">
        A colorful CSS-only loading animation with rotating segment highlights.
      </p>

      <span class="loading-label" aria-hidden="true">
        LOADING
      </span>
    </section>
  </main>

</body>
</html>
