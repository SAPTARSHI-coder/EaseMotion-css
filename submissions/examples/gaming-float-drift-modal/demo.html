<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Float-Drift Modal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="scene">

    <span class="particle p1"></span>
    <span class="particle p2"></span>
    <span class="particle p3"></span>
    <span class="particle p4"></span>

    <input type="checkbox" id="modal-toggle">

    <label for="modal-toggle" class="open-btn">
        Launch Gaming Modal
    </label>

    <div class="overlay">

        <div class="modal">

            <label for="modal-toggle" class="close-btn">&times;</label>

            <span class="badge">Gaming Hub</span>

            <h1>Float-Drift Modal</h1>

            <p>
                Experience immersive gaming announcements with a floating
                glassmorphism modal featuring smooth drift animations,
                glowing neon accents, and responsive CSS-only interactions.
            </p>

            <div class="features">

                <div class="feature">
                    🎮 Live Events
                </div>

                <div class="feature">
                    🚀 New Updates
                </div>

                <div class="feature">
                    🏆 Rewards
                </div>

            </div>

            <a href="#" class="cta">
                Explore Now
            </a>

        </div>

    </div>

</div>

</body>
</html>
