<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Retro Form</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="page">
    <section class="retro-form" aria-labelledby="form-title">
      <header class="form-header">
        <span class="pixel-star" aria-hidden="true">★</span>
        <div>
          <p class="eyebrow">PLAYER 01</p>
          <h1 id="form-title">SEND A MESSAGE</h1>
        </div>
      </header>

      <form>
        <div class="field">
          <label for="name">NAME</label>
          <input
            id="name"
            name="name"
            type="text"
            placeholder="ENTER NAME"
            autocomplete="name"
            required
          >
        </div>

        <div class="field">
          <label for="email">EMAIL</label>
          <input
            id="email"
            name="email"
            type="email"
            placeholder="ENTER EMAIL"
            autocomplete="email"
            required
          >
        </div>

        <div class="field">
          <label for="message">MESSAGE</label>
          <textarea
            id="message"
            name="message"
            rows="5"
            placeholder="TYPE YOUR MESSAGE..."
            required
          ></textarea>
        </div>

        <button type="submit" class="submit-button">
          <span aria-hidden="true">▶</span>
          SEND MESSAGE
        </button>
      </form>

      <footer class="form-footer">
        <span>INSERT COIN</span>
        <span>READY!</span>
      </footer>
    </section>
  </main>
</body>
</html>
