<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Mask Wipe #87552 Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="showcase-wrapper">
    <div class="mask-wipe-card" id="maskCard">
      <div class="base-layer">
        <div class="prompt-icon">🔍</div>
        <h3>Hover or Click to Reveal</h3>
        <p>Dynamic CSS Circular Mask Wipe Transition</p>
      </div>

      <img 
        src="https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=1000&q=80" 
        alt="Cyberpunk Neon Cityscape" 
        class="wipe-layer"
      >

      <div class="overlay-tag">Neo Tokyo Grid</div>
    </div>

    <div class="controls">
      <button class="btn-toggle" id="toggleBtn">Toggle Mask Reveal</button>
    </div>
  </div>

  <script>
    const card = document.getElementById('maskCard');
    const toggleBtn = document.getElementById('toggleBtn');

    toggleBtn.addEventListener('click', () => {
      card.classList.toggle('revealed');
    });

    card.addEventListener('click', () => {
      card.classList.toggle('revealed');
    });
  </script>
</body>
</html>
