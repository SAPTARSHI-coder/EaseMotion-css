<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Battleship Radar Sweep Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="radar" aria-label="radar display">
    <div class="rings" aria-hidden="true">
      <span class="ring r1"></span>
      <span class="ring r2"></span>
      <span class="ring r3"></span>
    </div>
    <div class="sweep" aria-hidden="true"></div>
    <span class="blip b1" aria-hidden="true"></span>
    <span class="blip b2" aria-hidden="true"></span>
    <span class="blip b3" aria-hidden="true"></span>
    <div class="cross" aria-hidden="true"></div>
    <p class="status">SCANNING</p>
  </main>
</body>
</html>
