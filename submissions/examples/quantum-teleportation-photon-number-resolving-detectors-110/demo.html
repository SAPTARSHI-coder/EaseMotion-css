<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css"></head><body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030712; color: #ffffff;">

    <div class="ease-card ease-card-glass pnrd-container">

            <h2>PNR Detectors</h2>
            <span class="ease-badge ease-badge-success">Quantum Optics</span>
        </div>

        <div class="pnrd-footer ease-flex ease-justify-between ease-items-center">
