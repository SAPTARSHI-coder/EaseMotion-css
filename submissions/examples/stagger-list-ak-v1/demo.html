<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stagger List — EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <p class="label">Vertical Fade &amp; Slide Up</p>
  <ul class="ease-stagger-list">
    <li class="ease-stagger-list__item" style="--i: 1">
      <span class="ease-stagger-list__icon">⚡</span>
      <span>Fast Performance</span>
    </li>
    <li class="ease-stagger-list__item" style="--i: 2">
      <span class="ease-stagger-list__icon">🎨</span>
      <span>Modern Design Tokens</span>
    </li>
    <li class="ease-stagger-list__item" style="--i: 3">
      <span class="ease-stagger-list__icon">📦</span>
      <span>Zero External Dependencies</span>
    </li>
    <li class="ease-stagger-list__item" style="--i: 4">
      <span class="ease-stagger-list__icon">♿</span>
      <span>Accessibility First</span>
    </li>
  </ul>

  <p class="label">Slide In From Left</p>
  <ul class="ease-stagger-list ease-stagger-list--slide-left">
    <li class="ease-stagger-list__item" style="--i: 1">
      <span class="ease-stagger-list__icon">1️⃣</span> Step One: Pick a Component
    </li>
    <li class="ease-stagger-list__item" style="--i: 2">
      <span class="ease-stagger-list__icon">2️⃣</span> Step Two: Copy CSS
    </li>
    <li class="ease-stagger-list__item" style="--i: 3">
      <span class="ease-stagger-list__icon">3️⃣</span> Step Three: Enjoy Smooth Motion
    </li>
  </ul>

</body>
</html>
