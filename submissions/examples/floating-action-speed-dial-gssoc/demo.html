<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Floating Action Speed Dial Demo</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="demo-viewport">
    <div class="card-preview">
      <h2 class="card-heading">Interactive Speed Dial</h2>
      <p class="card-subtext">Hover or focus the floating action button below to expand quick actions.</p>
    </div>

    <!-- Speed Dial Container -->
    <div class="speed-dial-container">
      <div class="speed-dial-menu" role="menu">
        <div class="speed-dial-item item-4">
          <span class="speed-dial-label">Delete</span>
          <button type="button" class="speed-dial-action action-delete" aria-label="Delete">🗑</button>
        </div>

        <div class="speed-dial-item item-3">
          <span class="speed-dial-label">Share</span>
          <button type="button" class="speed-dial-action action-share" aria-label="Share">🔗</button>
        </div>

        <div class="speed-dial-item item-2">
          <span class="speed-dial-label">Bookmark</span>
          <button type="button" class="speed-dial-action action-bookmark" aria-label="Bookmark">🔖</button>
        </div>

        <div class="speed-dial-item item-1">
          <span class="speed-dial-label">Edit</span>
          <button type="button" class="speed-dial-action action-edit" aria-label="Edit">✏️</button>
        </div>
      </div>

      <button type="button" class="speed-dial-fab" aria-label="Toggle Quick Actions">
        <span class="fab-icon">+</span>
      </button>
    </div>
  </main>
</body>
</html>
