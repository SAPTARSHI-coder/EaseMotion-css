<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Rain Fill Progress | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <article class="demo-card">
      <header class="card-header">
        <h1 class="card-title">Cloud Storage Backup</h1>
        <p class="card-subtitle">Syncing media assets into primary reservoir</p>
      </header>

      <!-- Accessible Rain Fill Progress Bar -->
      <div 
        class="rain-fill-container" 
        role="progressbar" 
        aria-valuenow="65" 
        aria-valuemin="0" 
        aria-valuemax="100" 
        aria-label="Cloud storage backup fill progress (65% complete)"
      >
        <div class="rain-chamber" aria-hidden="true">
          <span class="drop"></span>
          <span class="drop"></span>
          <span class="drop"></span>
          <span class="drop"></span>
          <span class="drop"></span>
          <span class="drop"></span>
        </div>

        <div class="water-fill" aria-hidden="true"></div>
        <span class="progress-text">65%</span>
      </div>

      <footer class="card-footer">
        <span class="badge">Rain Reservoir Mode</span>
        <span>13.0 GB / 20.0 GB</span>
      </footer>
    </article>
  </main>
</body>
</html>
