<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Morph-Glow Popover | EaseMotion Showcase</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="showcase-container">
    <div class="popover-wrapper">
      <button class="trigger-btn" aria-haspopup="true" aria-expanded="false">
        Show SaaS Features
      </button>
      <div class="popover" role="dialog" aria-label="SaaS Features">
        <div class="popover-content">
          <div class="popover-header">
            <h3>Pro Features</h3>
          </div>
          <div class="popover-body">
            <ul>
              <li><span class="icon">✨</span> AI-powered Insights</li>
              <li><span class="icon">📈</span> Advanced Analytics</li>
              <li><span class="icon">🔒</span> Enterprise Security</li>
            </ul>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
