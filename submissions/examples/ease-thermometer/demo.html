<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thermometer – Rises/Falls with Temperature Indicator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <h1>🌡️ Thermometer</h1>
    <p class="subtitle">Rises and falls with temperature indicator</p>

    <div class="thermometer-container">
      <!-- Thermometer -->
      <div class="thermometer" id="thermometer">
        <div class="thermometer-body">
          <div class="tube">
            <div class="mercury" id="mercury">
              <div class="mercury-bulb"></div>
            </div>
            <div class="scale-labels">
              <span class="scale-label">100°</span>
              <span class="scale-label">80°</span>
              <span class="scale-label">60°</span>
              <span class="scale-label">40°</span>
              <span class="scale-label">20°</span>
              <span class="scale-label">0°</span>
            </div>
            <div class="scale-marks">
              <span class="mark"></span>
              <span class="mark"></span>
              <span class="mark"></span>
              <span class="mark"></span>
              <span class="mark"></span>
              <span class="mark"></span>
            </div>
          </div>
        </div>
        <div class="thermometer-base"></div>
      </div>

      <!-- Temperature Display -->
      <div class="temp-display">
        <span class="temp-value" id="tempValue">25°</span>
        <span class="temp-unit">C</span>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <button class="ctrl-btn hot" id="hotBtn">🔥 Heat Up</button>
      <button class="ctrl-btn cold" id="coldBtn">❄️ Cool Down</button>
      <button class="ctrl-btn preset" id="presetBtn">🎯 Preset</button>
      <button class="ctrl-btn random" id="randomBtn">🎲 Random</button>
    </div>

    <!-- Slider -->
    <div class="slider-container">
      <span class="slider-label">Temperature</span>
      <input type="range" id="tempSlider" min="-20" max="100" value="25" />
      <span class="slider-value" id="sliderValue">25°C</span>
    </div>

    <!-- Status & Color Indicator -->
    <div class="status" id="status">🌡️ Adjust the temperature with buttons or slider</div>
    
    <div class="indicators">
      <div class="color-indicator" id="colorIndicator">
        <span class="indicator-label">Color</span>
        <div class="color-bar" id="colorBar"></div>
      </div>
      <div class="temp-indicator">
        <span class="indicator-label">State</span>
        <span class="state-label" id="stateLabel">Normal</span>
      </div>
    </div>

    <!-- Keyboard shortcuts -->
    <div class="shortcuts">
      <kbd>↑</kbd> Increase · <kbd>↓</kbd> Decrease · <kbd>H</kbd> Heat · <kbd>C</kbd> Cool · <kbd>R</kbd> Random
    </div>
  </div>

  <script>
    (function() {
      "use strict";

      // DOM elements
      const mercury = document.getElementById('mercury');
      const tempValue = document.getElementById('tempValue');
      const tempSlider = document.getElementById('tempSlider');
      const sliderValue = document.getElementById('sliderValue');
      const status = document.getElementById('status');
      const colorBar = document.getElementById('colorBar');
      const stateLabel = document.getElementById('stateLabel');
      const hotBtn = document.getElementById('hotBtn');
      const coldBtn = document.getElementById('coldBtn');
      const presetBtn = document.getElementById('presetBtn');
      const randomBtn = document.getElementById('randomBtn');

      // State
      let temperature = 25; // -20 to 100
      let targetTemp = 25;
      let isAnimating = false;
      let animationId = null;

      // Constants
      const MIN_TEMP = -20;
      const MAX_TEMP = 100;

      // ----- Update thermometer -----
      function updateThermometer(instant = false) {
        // Clamp temperature
        const clamped = Math.max(MIN_TEMP, Math.min(MAX_TEMP, temperature));
        temperature = clamped;

        // Calculate mercury height (0°C = 40%, 100°C = 90%)
        const percent = 40 + (clamped / 100) * 50;
        mercury.style.height = Math.max(0, Math.min(90, percent)) + '%';

        // Update display
        tempValue.textContent = Math.round(clamped) + '°';
        tempSlider.value = clamped;
        sliderValue.textContent = Math.round(clamped) + '°C';

        // Update color based on temperature
        updateColor(clamped);

        // Update state label
        updateState(clamped);

        // Update status
        if (clamped >= 80) {
          status.textContent = '🔥 Very hot! ' + Math.round(clamped) + '°C';
        } else if (clamped >= 50) {
          status.textContent = '🌤️ Warm: ' + Math.round(clamped) + '°C';
        } else if (clamped >= 20) {
          status.textContent = '🌡️ Normal: ' + Math.round(clamped) + '°C';
        } else if (clamped >= 0) {
          status.textContent = '❄️ Cool: ' + Math.round(clamped) + '°C';
        } else {
          status.textContent = '🥶 Freezing! ' + Math.round(clamped) + '°C';
        }
      }

      // ----- Update color based on temperature -----
      function updateColor(temp) {
        const clamped = Math.max(MIN_TEMP, Math.min(MAX_TEMP, temp));
        // Map temperature to hue: -20°C = blue (210°), 100°C = red (0°)
        const normalized = (clamped - MIN_TEMP) / (MAX_TEMP - MIN_TEMP);
        const hue = 210 - normalized * 210; // 210 (blue) to 0 (red)
        const saturation = 80 + normalized * 20;
        const lightness = 40 + normalized * 30;
        const color = `hsl(${hue}, ${saturation}%, ${lightness}%)`;

        mercury.style.background = `linear-gradient(180deg, ${color}, ${color}dd)`;
        colorBar.style.background = `linear-gradient(90deg, hsl(210, 80%, 40%), ${color})`;
        colorBar.style.boxShadow = `0 0 20px ${color}66`;
      }

      // ----- Update state label -----
      function updateState(temp) {
        const clamped = Math.round(temp);
        if (clamped >= 80) stateLabel.textContent = '🔥 Extreme Heat';
        else if (clamped >= 50) stateLabel.textContent = '☀️ Hot';
        else if (clamped >= 30) stateLabel.textContent = '🌤️ Warm';
        else if (clamped >= 15) stateLabel.textContent = '🌡️ Normal';
        else if (clamped >= 0) stateLabel.textContent = '❄️ Cool';
        else if (clamped >= -10) stateLabel.textContent = '🥶 Cold';
        else stateLabel.textContent = '🧊 Freezing!';
      }

      // ----- Animate to target temperature -----
      function animateToTemp(target, duration = 800) {
        if (isAnimating) {
          cancelAnimationFrame(animationId);
          isAnimating = false;
        }

        target = Math.max(MIN_TEMP, Math.min(MAX_TEMP, target));
        targetTemp = target;

        const startTemp = temperature;
        const startTime = performance.now();

        isAnimating = true;

        function step(time) {
          const elapsed = time - startTime;
          const progress = Math.min(elapsed / duration, 1);

          // EaseOutCubic for smooth deceleration
          const eased = 1 - Math.pow(1 - progress, 3);
          const current = startTemp + (target - startTemp) * eased;

          temperature = current;
          updateThermometer(true);

          if (progress < 1) {
            animationId = requestAnimationFrame(step);
          } else {
            temperature = target;
            updateThermometer(true);
            isAnimating = false;
            animationId = null;
          }
        }

        animationId = requestAnimationFrame(step);
      }

      // ----- Set temperature (with optional animation) -----
      function setTemperature(value, instant = false) {
        const clamped = Math.max(MIN_TEMP, Math.min(MAX_TEMP, value));
        if (instant) {
          temperature = clamped;
          updateThermometer(true);
        } else {
          animateToTemp(clamped);
        }
      }

      // ----- Heat up -----
      function heatUp() {
        const increment = temperature < 50 ? 15 : 8;
        const target = Math.min(MAX_TEMP, temperature + increment);
        setTemperature(target);
        status.textContent = '🔥 Heating up to ' + Math.round(target) + '°C';
      }

      // ----- Cool down -----
      function coolDown() {
        const decrement = temperature > 0 ? 15 : 8;
        const target = Math.max(MIN_TEMP, temperature - decrement);
        setTemperature(target);
        status.textContent = '❄️ Cooling down to ' + Math.round(target) + '°C';
      }

      // ----- Preset temperatures -----
      const presets = [-10, 0, 10, 20, 25, 30, 37, 40, 50, 70, 90];
      let presetIndex = 0;

      function applyPreset() {
        const temp = presets[presetIndex % presets.length];
        setTemperature(temp);
        status.textContent = `🎯 Preset ${presetIndex + 1}: ${temp}°C`;
        presetIndex = (presetIndex + 1) % presets.length;
      }

      // ----- Random temperature -----
      function randomTemp() {
        const temp = Math.round(MIN_TEMP + Math.random() * (MAX_TEMP - MIN_TEMP));
        setTemperature(temp);
        status.textContent = `🎲 Random: ${temp}°C`;
      }

      // ----- Event Listeners -----
      hotBtn.addEventListener('click', heatUp);
      coldBtn.addEventListener('click', coolDown);
      presetBtn.addEventListener('click', applyPreset);
      randomBtn.addEventListener('click', randomTemp);

      tempSlider.addEventListener('input', (e) => {
        const value = parseFloat(e.target.value);
        if (isAnimating) {
          cancelAnimationFrame(animationId);
          isAnimating = false;
        }
        temperature = value;
        updateThermometer(true);
        status.textContent = `🎚️ Set to ${Math.round(value)}°C`;
      });

      // Keyboard shortcuts
      document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowUp') {
          e.preventDefault();
          heatUp();
        }
        if (e.key === 'ArrowDown') {
          e.preventDefault();
          coolDown();
        }
        if (e.key === 'h' || e.key === 'H') {
          e.preventDefault();
          heatUp();
        }
        if (e.key === 'c' || e.key === 'C') {
          e.preventDefault();
          coolDown();
        }
        if (e.key === 'r' || e.key === 'R') {
          e.preventDefault();
          randomTemp();
        }
        if (e.key === 'p' || e.key === 'P') {
          e.preventDefault();
          applyPreset();
        }
        if (e.key === '0') {
          e.preventDefault();
          setTemperature(0);
          status.textContent = '❄️ Set to 0°C (Freezing)';
        }
        if (e.key === '2') {
          e.preventDefault();
          setTemperature(25);
          status.textContent = '🌡️ Set to 25°C (Room Temperature)';
        }
        if (e.key === '4') {
          e.preventDefault();
          setTemperature(40);
          status.textContent = '🌤️ Set to 40°C (Hot)';
        }
        if (e.key === '8') {
          e.preventDefault();
          setTemperature(80);
          status.textContent = '🔥 Set to 80°C (Very Hot)';
        }
      });

      // Click on thermometer to toggle preset
      document.querySelector('.thermometer-body').addEventListener('click', applyPreset);

      // ----- Init -----
      function init() {
        setTemperature(25, true);
        status.textContent = '🌡️ Use buttons, slider, or keyboard (↑↓, H, C, R)';
        tempValue.style.transition = 'color 0.3s ease';
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }

    })();
  </script>
</body>
</html>
