<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Responsive Glassmorphism Modal</title><link rel="stylesheet" href="style.css" /></head>
<body><main class="glass-demo" aria-labelledby="modal-title"><section class="glass-panel"><p class="eyebrow">Glassmorphism component</p><h1 id="modal-title">Responsive Modal</h1><p class="summary">A frosted modal surface with adaptive actions, animated glow, and accessible native dialog structure.</p><dialog class="modal" open><form method="dialog"><button class="close" aria-label="Close modal">x</button><span class="status">live preview</span><h2>Confirm workspace sync</h2><p>Glass layers keep the critical action visible while the background recedes with soft blur and depth.</p><div class="actions"><button value="cancel">Cancel</button><button class="primary" value="sync">Sync now</button></div></form></dialog></section></main></body>
</html>
