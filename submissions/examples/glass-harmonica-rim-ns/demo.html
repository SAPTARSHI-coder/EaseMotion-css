<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glass Harmonica Rim — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Glass Harmonica Rim demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Glass Harmonica Rim</h1>
      <p class="lede">Glass harmonica rim singing under wet fingers</p>
    </header>

    <section class="ease-glass-harmonica-rim" data-demo="glass-harmonica-rim" aria-live="polite">
      <div class="ease-glass-harmonica-rim__housing">
        <div class="ease-glass-harmonica-rim__bezel">
          <div class="ease-glass-harmonica-rim__face">
            <div class="ease-glass-harmonica-rim__readout">
              <span class="ease-glass-harmonica-rim__label">Glass Harmonica Rim</span>
              <span class="ease-glass-harmonica-rim__value">LIVE</span>
            </div>
            <div class="ease-glass-harmonica-rim__motion" aria-hidden="true">
              <span class="ease-glass-harmonica-rim__a"></span>
              <span class="ease-glass-harmonica-rim__b"></span>
              <span class="ease-glass-harmonica-rim__c"></span>
              <span class="ease-glass-harmonica-rim__d"></span>
            </div>
            <div class="ease-glass-harmonica-rim__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-glass-harmonica-rim__controls">
          <button type="button" class="ease-glass-harmonica-rim__btn primary">Bow</button>
          <button type="button" class="ease-glass-harmonica-rim__btn">Mute</button>
          <label class="ease-glass-harmonica-rim__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-glass-harmonica-rim__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
