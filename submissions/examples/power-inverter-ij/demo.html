<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-power-inverter</title>
</head>
<body>
<main class="pin-card">
  <header class="pin-head">
    <h1 class="pin-title">PureSine 3000</h1>
    <span class="pin-model">MODEL B</span>
  </header>
  <section class="pin-lcd" aria-label="inverter display">
    <strong class="pin-volt">118.2V</strong>
    <span class="pin-watt">812 W</span>
    <span class="pin-freq">60.0 Hz</span>
  </section>
  <section class="pin-vent" aria-label="cooling fan">
    <span class="pin-blade"></span>
    <span class="pin-blade pin-blade-2"></span>
    <span class="pin-blade pin-blade-3"></span>
  </section>
  <section class="pin-wave" aria-label="sine wave graph">
    <span class="pin-wave-bar pin-wave-b1"></span>
    <span class="pin-wave-bar pin-wave-b2"></span>
    <span class="pin-wave-bar pin-wave-b3"></span>
    <span class="pin-wave-bar pin-wave-b4"></span>
    <span class="pin-wave-bar pin-wave-b5"></span>
  </section>
  <section class="pin-term" aria-label="terminals">
    <span class="pin-post pin-post-in">DC IN</span>
    <span class="pin-post pin-post-out">AC OUT</span>
  </section>
  <footer class="pin-foot">
    <span class="pin-lamp pin-lamp-ok">ON</span>
    <span class="pin-lamp pin-lamp-warn">OVR</span>
    <span class="pin-mode">Grid</span>
  </footer>
</main>
</body>
</html>
