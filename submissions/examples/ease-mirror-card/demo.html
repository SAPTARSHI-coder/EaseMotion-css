<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mirror Card · Light Beam Reflection</title>

    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <div class="card">
        <h2>🔦 Mirror Card</h2>
        <p class="sub">reflects light beam that moves with mouse</p>

        <!-- === MIRROR CARD === -->
        <div class="mirror-container" id="mirrorContainer">
            <div class="mirror-card" id="mirrorCard">
                <div class="mirror-content">
                    <i class="fas fa-lightbulb"></i>
                    <h3>Mirror</h3>
                    <p>Move your mouse to reflect light</p>
                    <span class="mirror-reflect">✦ Reflect ✦</span>
                </div>
                <div class="mirror-beam" id="mirrorBeam"></div>
                <div class="mirror-glow" id="mirrorGlow"></div>
            </div>
        </div>

        <p style="margin-top: 2rem; font-size: 0.85rem; color: #64748b;">
            Move your mouse · watch the light beam reflect
        </p>
    </div>

    <!-- Embedded JavaScript -->
    <script>
        (function() {
            'use strict';

            const container = document.getElementById('mirrorContainer');
            const card = document.getElementById('mirrorCard');
            const beam = document.getElementById('mirrorBeam');
            const glow = document.getElementById('mirrorGlow');

            let isHovering = false;
            let mouseX = 0;
            let mouseY = 0;

            // --- Mouse move ---
            container.addEventListener('mousemove', function(e) {
                const rect = card.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;

                // Calculate percentage position
                const percentX = (x / rect.width) * 100;
                const percentY = (y / rect.height) * 100;

                // Clamp values
                const clampedX = Math.max(5, Math.min(95, percentX));
                const clampedY = Math.max(5, Math.min(95, percentY));

                // Update beam position
                beam.style.left = clampedX + '%';
                beam.style.top = clampedY + '%';

                // Update glow position
                glow.style.left = clampedX + '%';
                glow.style.top = clampedY + '%';

                // Calculate angle from center
                const centerX = 50;
                const centerY = 50;
                const dx = clampedX - centerX;
                const dy = clampedY - centerY;
                const angle = Math.atan2(dy, dx) * (180 / Math.PI);

                // Rotate beam to point away from center
                beam.style.transform = `translate(-50%, -50%) rotate(${angle + 90}deg)`;

                // Update gradient direction for glow
                glow.style.background = `radial-gradient(circle at ${clampedX}% ${clampedY}%, rgba(255, 255, 255, 0.3), transparent 60%)`;

                // Update beam gradient
                const gradientAngle = angle + 45;
                beam.style.background = `linear-gradient(${gradientAngle}deg, 
                    rgba(255, 255, 255, 0.8), 
                    rgba(255, 255, 200, 0.4), 
                    transparent 70%)`;

                mouseX = clampedX;
                mouseY = clampedY;
            });

            // --- Mouse enter/leave ---
            container.addEventListener('mouseenter', function() {
                isHovering = true;
                card.classList.add('active');
                console.log('🔦 Mirror activated');
            });

            container.addEventListener('mouseleave', function() {
                isHovering = false;
                card.classList.remove('active');
                // Reset beam
                beam.style.opacity = '0';
                glow.style.opacity = '0';
                console.log('🔦 Mirror deactivated');
            });

            // --- Click feedback ---
            container.addEventListener('click', function() {
                card.classList.add('click-pulse');
                setTimeout(() => {
                    card.classList.remove('click-pulse');
                }, 300);
                console.log('🔦 Mirror card clicked!');
            });

            // --- Keyboard accessibility ---
            container.setAttribute('tabindex', '0');
            container.setAttribute('role', 'button');
            container.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    this.click();
                }
            });

            console.log('🔦 Mirror card initialized!');

        })();
    </script>

</body>
</html>
