<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parallax Depth Grid - High Contrast</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <div class="header-content">
            <h1>Creative Vision.</h1>
            <p>High-contrast, accessible parallax grid layout.</p>
        </div>
    </header>

    <main class="grid-container">
        <!-- Cards with different parallax speeds -->
        <article class="parallax-card" data-speed="0.2">
            <div class="card-inner border-cyan">
                <div class="card-image-wrapper">
                    <img src="https://images.unsplash.com/photo-1550745165-9bc0b252726f?q=80&w=2000&auto=format&fit=crop" alt="Retro computer console with neon lighting">
                </div>
                <div class="card-content">
                    <span class="tag tag-cyan">Technology</span>
                    <h2>Cyber Interface</h2>
                    <a href="#" class="btn btn-cyan" aria-label="Read more about Cyber Interface">Explore</a>
                </div>
            </div>
        </article>

        <article class="parallax-card" data-speed="0.5">
            <div class="card-inner border-yellow">
                <div class="card-image-wrapper">
                    <img src="https://images.unsplash.com/photo-1518770660439-4636190af475?q=80&w=2000&auto=format&fit=crop" alt="Abstract high-tech circuit board">
                </div>
                <div class="card-content">
                    <span class="tag tag-yellow">Hardware</span>
                    <h2>Circuit Pulse</h2>
                    <a href="#" class="btn btn-yellow" aria-label="Read more about Circuit Pulse">Explore</a>
                </div>
            </div>
        </article>

        <article class="parallax-card" data-speed="0.3">
            <div class="card-inner border-pink">
                <div class="card-image-wrapper">
                    <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2000&auto=format&fit=crop" alt="Abstract liquid rendering">
                </div>
                <div class="card-content">
                    <span class="tag tag-pink">Design</span>
                    <h2>Fluid Dynamics</h2>
                    <a href="#" class="btn btn-pink" aria-label="Read more about Fluid Dynamics">Explore</a>
                </div>
            </div>
        </article>

        <article class="parallax-card" data-speed="0.6">
            <div class="card-inner border-cyan">
                <div class="card-image-wrapper">
                    <img src="https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?q=80&w=2000&auto=format&fit=crop" alt="Matrix digital code rain">
                </div>
                <div class="card-content">
                    <span class="tag tag-cyan">Development</span>
                    <h2>Code Matrix</h2>
                    <a href="#" class="btn btn-cyan" aria-label="Read more about Code Matrix">Explore</a>
                </div>
            </div>
        </article>
    </main>

    <script>
        // Simple performant parallax scroll using requestAnimationFrame
        const cards = document.querySelectorAll('.parallax-card');
        let scrollY = window.scrollY;
        let ticking = false;

        function updateParallax() {
            cards.forEach(card => {
                const speed = parseFloat(card.getAttribute('data-speed'));
                // Calculate position relative to viewport center
                const rect = card.getBoundingClientRect();
                const cardCenter = rect.top + rect.height / 2;
                const windowCenter = window.innerHeight / 2;
                const distance = cardCenter - windowCenter;
                
                const yPos = distance * speed * -0.15;
                card.style.setProperty('--parallax-y', `${yPos}px`);
            });
            ticking = false;
        }

        window.addEventListener('scroll', () => {
            scrollY = window.scrollY;
            if (!ticking) {
                window.requestAnimationFrame(updateParallax);
                ticking = true;
            }
        });

        // Initial setup
        updateParallax();
    </script>
</body>
</html>
