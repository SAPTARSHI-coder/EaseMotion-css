<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Neumorphic Hero</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <section class="hero-section">
        <div class="hero-content">
            <h1 class="hero-title">Design the <span class="highlight">Future</span></h1>
            <p class="hero-subtitle">Experience the next generation of user interfaces with incredibly soft, interactive neumorphic elements.</p>
            
            <div class="hero-buttons">
                <button class="btn btn-primary">Get Started</button>
                <button class="btn btn-secondary">Learn More</button>
            </div>
        </div>

        <div class="hero-graphics">
            <div class="neumorphic-circle circle-1"></div>
            <div class="neumorphic-circle circle-2">
                <div class="inner-circle"></div>
            </div>
            <div class="neumorphic-card">
                <div class="card-line"></div>
                <div class="card-line short"></div>
                <div class="neumorphic-toggle">
                    <div class="toggle-thumb"></div>
                </div>
            </div>
        </div>
    </section>

</body>
</html>
