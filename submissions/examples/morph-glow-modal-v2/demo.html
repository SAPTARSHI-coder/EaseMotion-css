<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Morph Glow Modal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<input type="checkbox" id="modal-toggle">

<label for="modal-toggle" class="open-btn">
    Open Modal
</label>

<div class="overlay">
    <div class="modal">
        <label for="modal-toggle" class="close-btn">&times;</label>

        <h2>Morph Glow Modal</h2>

        <p>
            A pure HTML and CSS modal with a glowing morph animation,
            responsive layout, and accessibility support.
        </p>

        <label for="modal-toggle" class="action-btn">
            Close
        </label>
    </div>
</div>

</body>
</html>
