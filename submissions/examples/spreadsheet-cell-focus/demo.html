<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spreadsheet Cell Focus &mdash; EaseMotion CSS Demo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="page-head">
    <p class="kicker">EaseMotion CSS &middot; Productivity</p>
    <h1>Spreadsheet Cell Focus</h1>
    <p class="sub">Every cell waits to be the star of the sheet.</p>
  </header>
  <main class="stage">
    <div class="sc2-grid">
      <div class="sc2-cell sc2-head">Q1</div>
      <div class="sc2-cell sc2-head">Q2</div>
      <div class="sc2-cell sc2-head">Q3</div>
      <div class="sc2-cell sc2-head">Q4</div>
      <div class="sc2-cell">1,240</div>
      <div class="sc2-cell">1,480</div>
      <div class="sc2-cell">1,610</div>
      <div class="sc2-cell">1,875</div>
      <div class="sc2-cell">320</div>
      <div class="sc2-cell">410</div>
      <div class="sc2-cell">380</div>
      <div class="sc2-cell">455</div>
      <div class="sc2-cell">96</div>
      <div class="sc2-cell">104</div>
      <div class="sc2-cell">112</div>
      <div class="sc2-cell">128</div>
    </div>
  </main>
  <p class="stage-caption">Hover a cell to pop it out of the grid.</p>
  <footer class="page-foot">
    <span>Pure CSS &middot; zero dependencies</span>
    <span>Focus cell</span>
  </footer>
</body>
</html>
