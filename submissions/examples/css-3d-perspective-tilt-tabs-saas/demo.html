<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS 3D Perspective Tilt Tabs - SaaS Layout</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<main class="saas-layout">


<header class="hero">

    <h1>
        CSS 3D Perspective Tilt Tabs
    </h1>

    <p>
        A pure CSS animated tab component with smooth
        3D perspective tilt interactions for modern SaaS layouts.
    </p>

</header>





<section class="tabs" aria-label="SaaS Dashboard Tabs">


<button class="tab active">

    <span class="icon">
        📊
    </span>

    Analytics

</button>



<button class="tab">

    <span class="icon">
        ⚙️
    </span>

    Settings

</button>



<button class="tab">

    <span class="icon">
        🚀
    </span>

    Growth

</button>



<button class="tab">

    <span class="icon">
        👥
    </span>

    Team

</button>



</section>





<section class="dashboard-card">


<h2>
    Modern SaaS Dashboard
</h2>


<p>
    Experience interactive 3D tilt motion created
    completely with HTML and CSS.
</p>


</section>



</main>


</body>

</html>
