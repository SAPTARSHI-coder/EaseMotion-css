<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animated Typing Indicator.</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <h1>Animated Typing Indicator</h1>

    <div class="chat-thread">
      <div class="bubble bubble-them">Hey, are you free later?</div>
      <div class="bubble bubble-me">Yeah, what's up?</div>
      <div class="typing-bubble" role="status" aria-live="polite">
        <span class="t-dot" aria-hidden="true"></span>
        <span class="t-dot" aria-hidden="true"></span>
        <span class="t-dot" aria-hidden="true"></span>
        <span class="sr-only">Alex is typing</span>
      </div>
    </div>
  </main>
</body>
</html>
