<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Burette Titrate Drip — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Burette Titrate Drip demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Burette Titrate Drip</h1>
      <p class="lede">Burette titration dripping toward endpoint color</p>
    </header>

    <section class="ease-burette-titrate-drip" data-demo="burette-titrate-drip" aria-live="polite">
      <div class="ease-burette-titrate-drip__housing">
        <div class="ease-burette-titrate-drip__bezel">
          <div class="ease-burette-titrate-drip__face">
            <div class="ease-burette-titrate-drip__readout">
              <span class="ease-burette-titrate-drip__label">Burette Titrate Drip</span>
              <span class="ease-burette-titrate-drip__value">LIVE</span>
            </div>
            <div class="ease-burette-titrate-drip__motion" aria-hidden="true">
              <span class="ease-burette-titrate-drip__a"></span>
              <span class="ease-burette-titrate-drip__b"></span>
              <span class="ease-burette-titrate-drip__c"></span>
              <span class="ease-burette-titrate-drip__d"></span>
            </div>
            <div class="ease-burette-titrate-drip__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-burette-titrate-drip__controls">
          <button type="button" class="ease-burette-titrate-drip__btn primary">Engage</button>
          <button type="button" class="ease-burette-titrate-drip__btn">Reset</button>
          <label class="ease-burette-titrate-drip__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-burette-titrate-drip__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
