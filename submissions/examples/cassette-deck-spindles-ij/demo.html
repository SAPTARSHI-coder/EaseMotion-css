<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-cassette-deck-spindles demo</title>
</head>
<body>
<div class="cd-app">
  <span class="cd-title">CASSETTE DECK</span>
  <div class="cd-cassette">
    <span class="cd-window"></span>
    <span class="cd-spindle cd-spindle-1"></span>
    <span class="cd-spindle cd-spindle-2"></span>
    <span class="cd-reel cd-reel-1"></span>
    <span class="cd-reel cd-reel-2"></span>
    <span class="cd-label">MIX</span>
  </div>
  <div class="cd-deck">
    <span class="cd-vu cd-vu-1"></span>
    <span class="cd-vu cd-vu-2"></span>
    <span class="cd-btn cd-btn-1">PLAY</span>
    <span class="cd-btn cd-btn-2">STOP</span>
    <span class="cd-rewind">REW</span>
  </div>
</div>
</body>
</html>
