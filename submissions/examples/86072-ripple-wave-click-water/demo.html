<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ripple Wave Click Water</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="demo-container">
    <h1>Ripple Wave Click Water</h1>
    <p class="subtitle">
      A smooth water-like ripple expansion animation.
    </p>

    <div class="ripple-stage">
      <span class="ripple-source ease-anim-ripple-wave-click-water"></span>
    </div>

    <p class="hint">Ripple Wave Click Water</p>
  </main>
</body>
