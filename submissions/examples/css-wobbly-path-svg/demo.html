<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
        name="description"
        content="CSS animated wobbly SVG path demonstration"
    >
    <title>CSS Wobbly Path SVG</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="demo-container">
        <section class="demo-card" aria-labelledby="demo-title">

            <header class="demo-header">
                <span class="badge">EaseMotion CSS</span>
                <h1 id="demo-title">Wobbly Path SVG</h1>
                <p>
                    A smooth organic SVG path animated entirely with CSS.
                </p>
            </header>

            <div class="animation-area">
                <svg
                    class="wobbly-svg"
                    viewBox="0 0 600 300"
                    role="img"
                    aria-labelledby="svg-title svg-description"
                >
                    <title id="svg-title">Animated wobbly path</title>
                    <desc id="svg-description">
                        A colorful organic SVG path that continuously
                        moves and morphs using CSS animation.
                    </desc>

                    <path
                        class="wobbly-path"
                        d="M50 150
                           C100 80, 150 220, 200 150
                           C250 80, 300 220, 350 150
                           C400 80, 450 220, 500 150
                           C530 120, 560 130, 580 150"
                    />
                </svg>
            </div>

            <div class="info">
                <span>Pure CSS</span>
                <span>SVG</span>
                <span>No JavaScript</span>
            </div>

        </section>
    </main>

</body>
</html>
