<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Static Shock – Static Electricity Crackles Around Element</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <h1>⚡ Static Shock</h1>
    <p class="subtitle">Static electricity crackles around the element</p>

    <div class="static-container">
      <div class="static-stage" id="staticStage">
        <canvas id="canvas"></canvas>
        
        <!-- Center element -->
        <div class="center-element" id="centerElement">
          <div class="element-content">
            <span class="element-icon">⚡</span>
            <span class="element-label">Static</span>
          </div>
        </div>

        <!-- Info overlay -->
        <div class="info-overlay">
          <span class="static-status" id="staticStatus">⚡ Crackling</span>
          <span class="spark-count" id="sparkCount">✦ 0 sparks</span>
        </div>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <button class="ctrl-btn toggle" id="toggleBtn">💡 Toggle</button>
      <button class="ctrl-btn reset" id="resetBtn">↺ Reset</button>
      <button class="ctrl-btn shock" id="shockBtn">💥 Shock</button>
    </div>

    <!-- Sliders -->
    <div class="slider-container">
      <span class="slider-label">Intensity</span>
      <input type="range" id="intensitySlider" min="0" max="100" value="70" />
      <span class="slider-value" id="intensityValue">70%</span>
    </div>

    <div class="slider-container">
      <span class="slider-label">Spark Count</span>
      <input type="range" id="countSlider" min="10" max="60" value="30" step="5" />
      <span class="slider-value" id="countValue">30</span>
    </div>

    <div class="slider-container">
      <span class="slider-label">Spark Speed</span>
      <input type="range" id="speedSlider" min="1" max="10" value="5" />
      <span class="slider-value" id="speedValue">5×</span>
    </div>

    <!-- Status -->
    <div class="status" id="status">⚡ Static electricity crackling around the element</div>

    <!-- Keyboard shortcuts -->
    <div class="shortcuts">
      <kbd>T</kbd> Toggle · <kbd>R</kbd> Reset · <kbd>S</kbd> Shock
    </div>
  </div>

  <script>
    (function() {
      "use strict";

      // DOM elements
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      const staticStatus = document.getElementById('staticStatus');
      const sparkCount = document.getElementById('sparkCount');
      const toggleBtn = document.getElementById('toggleBtn');
      const resetBtn = document.getElementById('resetBtn');
      const shockBtn = document.getElementById('shockBtn');
      const status = document.getElementById('status');
      const intensitySlider = document.getElementById('intensitySlider');
      const intensityValue = document.getElementById('intensityValue');
      const countSlider = document.getElementById('countSlider');
      const countValue = document.getElementById('countValue');
      const speedSlider = document.getElementById('speedSlider');
      const speedValue = document.getElementById('speedValue');

      // State
      let sparks = [];
      let isActive = true;
      let isPaused = false;
      let animationId = null;
      let time = 0;
      let shockParticles = [];
      let isShocking = false;

      // ----- Canvas setup -----
      function setupCanvas() {
        const rect = canvas.parentElement.getBoundingClientRect();
        const size = Math.min(rect.width - 40, 600);
        canvas.width = size;
        canvas.height = size;
        canvas.style.width = size + 'px';
        canvas.style.height = size + 'px';
      }

      // ----- Spark class -----
      class Spark {
        constructor() {
          const w = canvas.width;
          const h = canvas.height;
          const cx = w / 2;
          const cy = h / 2;
          const radius = Math.min(w, h) * 0.35;
          
          this.angle = Math.random() * Math.PI * 2;
          this.radius = radius * (0.2 + Math.random() * 0.8);
          this.size = 1 + Math.random() * 3;
          this.speed = 0.5 + Math.random() * 1.5;
          this.phase = Math.random() * Math.PI * 2;
          this.life = 0.5 + Math.random() * 0.5;
          this.maxLife = this.life;
          this.opacity = 0.3 + Math.random() * 0.5;
          this.hue = 180 + Math.random() * 40;
          this.saturation = 80 + Math.random() * 20;
          this.lightness = 60 + Math.random() * 30;
          this.glowSize = this.size * 3;
          this.trail = [];
          this.trailLength = 3 + Math.floor(Math.random() * 5);
          this.wobble = 0;
          this.wobbleSpeed = 0.02 + Math.random() * 0.04;
          this.wobbleAmount = 0.2 + Math.random() * 0.8;
          this.alive = true;
          this.isShock = false;
          this.shockStrength = 1;
        }

        update(speedMult, intensity) {
          const w = canvas.width;
          const h = canvas.height;
          const cx = w / 2;
          const cy = h / 2;

          // Life decay
          this.life -= 0.003 * speedMult;
          if (this.life <= 0) {
            this.alive = false;
            return;
          }

          // Move with organic wobble
          this.wobble += this.wobbleSpeed;
          this.angle += this.speed * 0.01 * speedMult * intensity;
          this.radius += Math.sin(this.wobble + this.phase) * this.wobbleAmount * 0.1 * speedMult;

          // Keep within bounds
          const maxR = Math.min(w, h) * 0.4;
          if (this.radius < 10) this.radius = 10;
          if (this.radius > maxR) this.radius = maxR;

          // Calculate position
          this.x = cx + Math.cos(this.angle) * this.radius;
          this.y = cy + Math.sin(this.angle) * this.radius * 0.8;

          // Add some random jitter for static effect
          this.x += (Math.random() - 0.5) * 2 * intensity;
          this.y += (Math.random() - 0.5) * 2 * intensity;

          // Update trail
          this.trail.push({ x: this.x, y: this.y });
          if (this.trail.length > this.trailLength) {
            this.trail.shift();
          }

          // Opacity based on life
          this.opacity = (this.life / this.maxLife) * (0.3 + 0.5 * intensity);
        }

        draw(ctx, sizeMult) {
          if (this.opacity < 0.01) return;

          const size = this.size * sizeMult * (0.5 + 0.5 * (this.life / this.maxLife));
          const alpha = this.opacity;

          // Draw trail
          if (this.trail.length > 1) {
            for (let i = 0; i < this.trail.length - 1; i++) {
              const t = i / this.trail.length;
              const trailAlpha = alpha * t * 0.2;
              const trailSize = size * t * 0.3;
              ctx.fillStyle = `hsla(${this.hue + 20}, 100%, 80%, ${trailAlpha})`;
              ctx.beginPath();
              ctx.arc(this.trail[i].x, this.trail[i].y, trailSize, 0, Math.PI * 2);
              ctx.fill();
            }
          }

          // Glow
          const glowSize = size * 4;
          const gradient = ctx.createRadialGradient(
            this.x, this.y, 0,
            this.x, this.y, glowSize
          );
          gradient.addColorStop(0, `hsla(${this.hue + 20}, 100%, 90%, ${alpha * 0.15})`);
          gradient.addColorStop(0.5, `hsla(${this.hue + 10}, 100%, 70%, ${alpha * 0.08})`);
          gradient.addColorStop(1, `hsla(${this.hue}, 100%, 50%, 0)`);
          ctx.fillStyle = gradient;
          ctx.beginPath();
          ctx.arc(this.x, this.y, glowSize, 0, Math.PI * 2);
          ctx.fill();

          // Spark core
          ctx.shadowColor = `hsla(${this.hue + 20}, 100%, 70%, ${alpha * 0.2})`;
          ctx.shadowBlur = 10;
          ctx.fillStyle = `hsla(${this.hue + 30}, 100%, 95%, ${alpha * 0.9})`;
          ctx.beginPath();
          ctx.arc(this.x, this.y, size, 0, Math.PI * 2);
          ctx.fill();
          ctx.shadowBlur = 0;

          // Zigzag line (static discharge)
          if (size > 2 && Math.random() > 0.7) {
            ctx.strokeStyle = `hsla(${this.hue + 40}, 100%, 90%, ${alpha * 0.2})`;
            ctx.lineWidth = 0.5;
            ctx.beginPath();
            const zigzagLength = size * 3;
            const segments = 3 + Math.floor(Math.random() * 3);
            for (let i = 0; i <= segments; i++) {
              const t = i / segments;
              const angle = this.angle + (i / segments) * 0.5 + (Math.random() - 0.5) * 0.3;
              const r = this.radius + t * zigzagLength;
              const x = canvas.width / 2 + Math.cos(angle) * r;
              const y = canvas.height / 2 + Math.sin(angle) * r * 0.8;
              if (i === 0) ctx.moveTo(x, y);
              else ctx.lineTo(x, y);
            }
            ctx.stroke();
          }
        }
      }

      // ----- Shock particle class -----
      class ShockParticle {
        constructor(x, y, angle) {
          const speed = 2 + Math.random() * 5;
          this.x = x;
          this.y = y;
          this.vx = Math.cos(angle) * speed;
          this.vy = Math.sin(angle) * speed - 1;
          this.size = 1 + Math.random() * 4;
          this.life = 1;
          this.decay = 0.02 + Math.random() * 0.03;
          this.hue = 200 + Math.random() * 40;
          this.saturation = 80 + Math.random() * 20;
          this.lightness = 60 + Math.random() * 30;
          this.gravity = 0.05;
          this.friction = 0.99;
        }

        update() {
          this.vx *= this.friction;
          this.vy *= this.friction;
          this.vy += this.gravity;
          this.x += this.vx;
          this.y += this.vy;
          this.life -= this.decay;
          this.size *= 0.998;
          return this.life > 0 && this.size > 0.1;
        }

        draw(ctx) {
          const alpha = this.life * 0.8;
          const size = this.size * this.life;

          // Glow
          const gradient = ctx.createRadialGradient(
            this.x, this.y, 0,
            this.x, this.y, size * 5
          );
          gradient.addColorStop(0, `hsla(${this.hue + 20}, 100%, 90%, ${alpha * 0.3})`);
          gradient.addColorStop(1, `hsla(${this.hue}, 100%, 60%, 0)`);
          ctx.fillStyle = gradient;
          ctx.beginPath();
          ctx.arc(this.x, this.y, size * 5, 0, Math.PI * 2);
          ctx.fill();

          // Core
          ctx.fillStyle = `hsla(${this.hue + 30}, 100%, 95%, ${alpha * 0.9})`;
          ctx.beginPath();
          ctx.arc(this.x, this.y, size, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // ----- Generate sparks -----
      function generateSparks(count) {
        sparks = [];
        for (let i = 0; i < count; i++) {
          sparks.push(new Spark());
        }
        sparkCount.textContent = `✦ ${sparks.length} sparks`;
        countValue.textContent = sparks.length;
      }

      // ----- Shock burst -----
      function shockBurst() {
        if (!isActive) return;
        
        const w = canvas.width;
        const h = canvas.height;
        const cx = w / 2;
        const cy = h / 2;
        const count = 30 + Math.floor(Math.random() * 40);
        
        isShocking = true;
        for (let i = 0; i < count; i++) {
          const angle = Math.random() * Math.PI * 2;
          shockParticles.push(new ShockParticle(cx, cy, angle));
        }
        
        // Add some sparks to the main system
        for (let i = 0; i < 10; i++) {
          const spark = new Spark();
          spark.radius = 10 + Math.random() * 20;
          spark.life = 0.5 + Math.random() * 0.5;
          spark.size = 2 + Math.random() * 4;
          sparks.push(spark);
        }
        
        sparkCount.textContent = `✦ ${sparks.length} sparks`;
        status.textContent = '💥 Static shock!';
        staticStatus.textContent = '⚡ Shocking!';
        
        setTimeout(() => {
          isShocking = false;
          staticStatus.textContent = '⚡ Crackling';
          status.textContent = '⚡ Static electricity crackling around the element';
        }, 1500);
      }

      // ----- Toggle -----
      function toggleStatic() {
        isActive = !isActive;
        toggleBtn.textContent = isActive ? '💡 Toggle' : '💡 Off';
        status.textContent = isActive ? '⚡ Static activated' : '🌑 Static deactivated';
        staticStatus.textContent = isActive ? '⚡ Crackling' : '🌑 Inactive';
        if (!isActive) {
          sparks = [];
          shockParticles = [];
          sparkCount.textContent = '✦ 0 sparks';
        } else {
          generateSparks(parseInt(countSlider.value));
        }
      }

      // ----- Reset -----
      function resetStatic() {
        isActive = true;
        toggleBtn.textContent = '💡 Toggle';
        intensitySlider.value = 70;
        intensityValue.textContent = '70%';
        countSlider.value = 30;
        countValue.textContent = '30';
        speedSlider.value = 5;
        speedValue.textContent = '5×';
        sparks = [];
        shockParticles = [];
        isShocking = false;
        generateSparks(30);
        status.textContent = '↺ Reset';
        staticStatus.textContent = '⚡ Crackling';
        setTimeout(() => {
          status.textContent = '⚡ Static electricity crackling around the element';
        }, 500);
      }

      // ----- Draw background -----
      function drawBackground() {
        const w = canvas.width;
        const h = canvas.height;
        const cx = w / 2;
        const cy = h / 2;

        // Dark background
        const bgGradient = ctx.createRadialGradient(cx, cy, 0, cx, cy, w * 0.7);
        bgGradient.addColorStop(0, '#0a0a1a');
        bgGradient.addColorStop(0.5, '#060612');
        bgGradient.addColorStop(1, '#020208');
        ctx.fillStyle = bgGradient;
        ctx.fillRect(0, 0, w, h);

        // Subtle electric field lines
        if (isActive) {
          const intensity = parseInt(intensitySlider.value) / 100;
          for (let i = 0; i < 8; i++) {
            const angle = (i / 8) * Math.PI * 2 + time * 0.01;
            const radius = Math.min(w, h) * 0.3 * (0.5 + 0.5 * intensity);
            const x = cx + Math.cos(angle) * radius;
            const y = cy + Math.sin(angle) * radius * 0.8;
            const alpha = 0.02 + intensity * 0.03 * (0.5 + 0.5 * Math.sin(time * 0.2 + i));
            ctx.strokeStyle = `rgba(100, 200, 255, ${alpha})`;
            ctx.lineWidth = 0.5;
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.lineTo(x, y);
            ctx.stroke();
          }
        }
      }

      // ----- Draw -----
      function draw() {
        const w = canvas.width;
        const h = canvas.height;

        drawBackground();

        // Update sparks
        if (isActive && !isPaused) {
          const intensity = parseInt(intensitySlider.value) / 100;
          const speedMult = parseInt(speedSlider.value) / 5;
          
          // Respawn dead sparks
          sparks = sparks.filter(s => s.alive);
          const targetCount = parseInt(countSlider.value);
          while (sparks.length < targetCount) {
            const spark = new Spark();
            spark.life = 0.5 + Math.random() * 0.5;
            sparks.push(spark);
          }
          
          sparks.forEach(s => s.update(speedMult, intensity));
          
          // Update shock particles
          shockParticles = shockParticles.filter(p => p.update());
        }

        // Draw sparks
        const sizeMult = 1;
        const sortedSparks = [...sparks].sort((a, b) => a.size - b.size);
        sortedSparks.forEach(s => s.draw(ctx, sizeMult));

        // Draw shock particles
        shockParticles.forEach(p => p.draw(ctx));

        // Update count
        sparkCount.textContent = `✦ ${sparks.length + shockParticles.length} sparks`;
        if (sparks.length === 0 && shockParticles.length === 0 && isActive) {
          staticStatus.textContent = '⚡ Crackling';
        }
      }

      // ----- Animation loop -----
      function animate() {
        time += 0.016;
        draw();
        animationId = requestAnimationFrame(animate);
      }

      // ----- Start animation -----
      function startAnimation() {
        if (animationId) {
          cancelAnimationFrame(animationId);
        }
        animate();
      }

      // ----- Event Listeners -----
      toggleBtn.addEventListener('click', toggleStatic);
      resetBtn.addEventListener('click', resetStatic);
      shockBtn.addEventListener('click', shockBurst);

      intensitySlider.addEventListener('input', (e) => {
        intensityValue.textContent = e.target.value + '%';
      });

      countSlider.addEventListener('input', (e) => {
        const val = parseInt(e.target.value);
        countValue.textContent = val;
        if (isActive) {
          generateSparks(val);
        }
      });

      speedSlider.addEventListener('input', (e) => {
        speedValue.textContent = e.target.value + '×';
      });

      // Click canvas to shock
      canvas.addEventListener('click', shockBurst);

      // Keyboard shortcuts
      document.addEventListener('keydown', (e) => {
        if (e.key === 't' || e.key === 'T') {
          e.preventDefault();
          toggleStatic();
        }
        if (e.key === 'r' || e.key === 'R') {
          e.preventDefault();
          resetStatic();
        }
        if (e.key === 's' || e.key === 'S') {
          e.preventDefault();
          shockBurst();
        }
        if (e.key === ' ' || e.key === 'Space') {
          e.preventDefault();
          toggleStatic();
        }
      });

      // ----- Resize handler -----
      let resizeTimeout;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(() => {
          setupCanvas();
          if (isActive) {
            generateSparks(parseInt(countSlider.value));
          }
        }, 200);
      });

      // ----- Init -----
      function init() {
        setupCanvas();
        generateSparks(30);
        startAnimation();
        status.textContent = '⚡ Static electricity crackling around the element!';
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }

    })();
  </script>
</body>
</html>
