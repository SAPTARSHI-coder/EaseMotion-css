<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cyberpunk Text Glitch Demo - EaseMotion CSS</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background-color: #0a0a0f;
        color: #ffffff;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        text-align: center;
        overflow-x: hidden;
      }

      .container {
        max-width: 800px;
        width: 100%;
      }

      h1.ease-glitch {
        font-size: clamp(2.5rem, 8vw, 5rem);
        font-weight: 900;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        margin-bottom: 1.5rem;
      }

      p.subtitle {
        color: #8892b0;
        font-size: 1.1rem;
        margin-top: 1rem;
        letter-spacing: 0.05em;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1 class="ease-glitch" data-text="CYBERPUNK GLITCH">CYBERPUNK GLITCH</h1>
      <p class="subtitle">
        Pure CSS Cyberpunk Text Glitch Effect | EaseMotion CSS
      </p>
    </div>
  </body>
</html>
