<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EaseMotion | Morph-Glow Progress Bar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<section class="em-progress-showcase">

    <header class="hero">
        <h1>Morph-Glow Progress Bars</h1>
        <p>Beautiful animated progress indicators for modern SaaS dashboards and analytics.</p>
    </header>

    <div class="progress-wrapper">

        <div class="progress-card">

            <div class="progress-head">
                <span>Customer Growth</span>
                <span>94%</span>
            </div>

            <div class="em-progress morph-blue">
                <div class="em-fill" style="--progress:94%;"></div>
            </div>

        </div>

        <div class="progress-card">

            <div class="progress-head">
                <span>Cloud Storage</span>
                <span>78%</span>
            </div>

            <div class="em-progress morph-cyan">
                <div class="em-fill" style="--progress:78%;"></div>
            </div>

        </div>

        <div class="progress-card">

            <div class="progress-head">
                <span>API Requests</span>
                <span>66%</span>
            </div>

            <div class="em-progress morph-purple">
                <div class="em-fill" style="--progress:66%;"></div>
            </div>

        </div>

        <div class="progress-card">

            <div class="progress-head">
                <span>Revenue Target</span>
                <span>89%</span>
            </div>

            <div class="em-progress morph-pink">
                <div class="em-fill" style="--progress:89%;"></div>
            </div>

        </div>

        <div class="progress-card">

            <div class="progress-head">
                <span>Server Uptime</span>
                <span>99%</span>
            </div>

            <div class="em-progress morph-green">
                <div class="em-fill" style="--progress:99%;"></div>
            </div>

        </div>

        <div class="progress-card">

            <div class="progress-head">
                <span>User Engagement</span>
                <span>84%</span>
            </div>

            <div class="em-progress morph-orange">
                <div class="em-fill" style="--progress:84%;"></div>
            </div>

        </div>

    </div>

</section>

</body>
</html>
