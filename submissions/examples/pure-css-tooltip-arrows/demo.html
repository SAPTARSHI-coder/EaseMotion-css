<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pure CSS Tooltip Demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f9f9f9;
      color: #333;
    }
    
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 40px;
      padding: 40px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
    }
    
    .demo-btn {
      padding: 12px 24px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      transition: background-color 0.2s;
    }
    
    .demo-btn:hover {
      background-color: #0056b3;
    }
    
    .demo-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    
    h2 {
      grid-column: 1 / -1;
      text-align: center;
      margin-top: 0;
      margin-bottom: 20px;
      color: #111;
    }
  </style>
</head>
<body>

  <div class="grid">
    <h2>Pure CSS Tooltips (Zero JS)</h2>
    
    <div class="demo-container">
      <span>Top (Default)</span>
      <!-- Default is top -->
      <button class="demo-btn ease-tooltip ease-tooltip-top" data-tooltip="This is a top tooltip">Hover Me</button>
    </div>
    
    <div class="demo-container">
      <span>Bottom</span>
      <button class="demo-btn ease-tooltip ease-tooltip-bottom" data-tooltip="This is a bottom tooltip">Hover Me</button>
    </div>
    
    <div class="demo-container">
      <span>Left</span>
      <button class="demo-btn ease-tooltip ease-tooltip-left" data-tooltip="This is a left tooltip">Hover Me</button>
    </div>
    
    <div class="demo-container">
      <span>Right</span>
      <button class="demo-btn ease-tooltip ease-tooltip-right" data-tooltip="This is a right tooltip">Hover Me</button>
    </div>
  </div>

</body>
</html>
