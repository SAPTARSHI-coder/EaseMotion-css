<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EaseMotion CSS - Bounce Pulse Gaming Hero</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<section class="hero">

    <div class="hero-content">

        <span class="hero-tag">
            🎮 Next Generation Gaming
        </span>

        <h1 class="hero-title">
            Level Up Your Gaming Experience
        </h1>

        <p class="hero-description">
            Discover the latest games, tournaments, exclusive rewards,
            and an immersive gaming community built for champions.
        </p>

        <div class="hero-buttons">
            <a href="#" class="btn btn-primary">Play Now</a>
            <a href="#" class="btn btn-secondary">Explore Games</a>
        </div>

    </div>

    <div class="hero-image">

        <div class="gaming-card bounce">
            <img
                src="https://images.unsplash.com/photo-1542751110-97427bbecf20?w=700"
                alt="Gaming Setup">
        </div>

        <div class="floating-badge pulse">
            🔥 LIVE
        </div>

        <div class="floating-circle circle-1"></div>
        <div class="floating-circle circle-2"></div>
        <div class="floating-circle circle-3"></div>

    </div>

</section>

</body>
</html>
