<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Heliochronometer Shadow — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Heliochronometer Shadow demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Heliochronometer Shadow</h1>
      <p class="lede">Precision sundial gnomon shadow tracking solar noon</p>
    </header>

    <section class="ease-heliochronometer-shadow" data-demo="heliochronometer-shadow" aria-live="polite">
      <div class="ease-heliochronometer-shadow__housing">
        <div class="ease-heliochronometer-shadow__bezel">
          <div class="ease-heliochronometer-shadow__face">
            <div class="ease-heliochronometer-shadow__readout">
              <span class="ease-heliochronometer-shadow__label">Heliochronometer Shadow</span>
              <span class="ease-heliochronometer-shadow__value">LIVE</span>
            </div>
            <div class="ease-heliochronometer-shadow__motion" aria-hidden="true">
              <span class="ease-heliochronometer-shadow__a"></span>
              <span class="ease-heliochronometer-shadow__b"></span>
              <span class="ease-heliochronometer-shadow__c"></span>
              <span class="ease-heliochronometer-shadow__d"></span>
            </div>
            <div class="ease-heliochronometer-shadow__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-heliochronometer-shadow__controls">
          <button type="button" class="ease-heliochronometer-shadow__btn primary">Engage</button>
          <button type="button" class="ease-heliochronometer-shadow__btn">Reset</button>
          <label class="ease-heliochronometer-shadow__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-heliochronometer-shadow__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
