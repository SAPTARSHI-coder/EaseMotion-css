<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Float-Drift Progress Bar - Glassmorphism UI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <!-- Background Ambient Orbs for Glassmorphism Effect -->
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>
    <div class="bg-orb orb-3"></div>

    <div class="layout-container">
        
        <header class="section-header">
            <h1 class="title">System Initialization</h1>
            <p class="subtitle">A glassmorphic progress bar featuring smooth float-drift ambient animations.</p>
        </header>

        <div class="dashboard-area">
            
            <div class="glass-card">
                <div class="card-header">
                    <div class="header-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
                    </div>
                    <div class="header-text">
                        <h2>Deploying Environment</h2>
                        <span class="status-text">Allocating resources...</span>
                    </div>
                    <div class="percentage-badge">68%</div>
                </div>

                <!-- Pure CSS Progress Bar Structure -->
                <div class="progress-container">
                    
                    <!-- The Background Track -->
                    <div class="progress-track">
                        
                        <!-- The Fill Element (Width controls progress) -->
                        <!-- In a real app, the inline width would be updated via JS/Backend. -->
                        <!-- Here we use an inline style to demonstrate a static 68% fill. -->
                        <div class="progress-fill" style="width: 68%;">
                            
                            <!-- The Float-Drift Particles/Highlights -->
                            <div class="drift-particle p1"></div>
                            <div class="drift-particle p2"></div>
                            <div class="drift-particle p3"></div>
                            
                            <!-- A subtle glowing overlay on the fill itself -->
                            <div class="fill-glow"></div>
                        </div>
                        
                    </div>
                </div>
                
                <div class="card-footer">
                    <div class="step">
                        <div class="step-indicator completed"></div>
                        <span>Provisioning Storage</span>
                    </div>
                    <div class="step">
                        <div class="step-indicator active"></div>
                        <span>Configuring Network</span>
                    </div>
                    <div class="step">
                        <div class="step-indicator pending"></div>
                        <span>Starting Services</span>
                    </div>
                </div>

            </div>

        </div>
        
    </div>

</body>
</html>
