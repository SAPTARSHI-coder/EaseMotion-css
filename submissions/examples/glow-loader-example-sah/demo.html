<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glow Loader Example - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="loader-card">
    <h1>Glow Loader Example (<code>#54669</code>)</h1>
    <p class="desc">Spinning circular indicators radiating intense multi-color neon drop-shadow light cycles.</p>
    
    <div class="loaders-grid">
      <div class="loader-unit">
        <div class="ease-loader-glow cyan"></div>
        <span>Cyan Neon</span>
      </div>
      <div class="loader-unit">
        <div class="ease-loader-glow purple"></div>
        <span>Purple Plasma</span>
      </div>
      <div class="loader-unit">
        <div class="ease-loader-glow emerald"></div>
        <span>Emerald Laser</span>
      </div>
    </div>
  </div>
</body>
</html>
