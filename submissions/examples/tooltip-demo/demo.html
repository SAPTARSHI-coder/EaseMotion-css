<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EaseMotion — Tooltip Demo</title>
  <link rel="stylesheet" href="../../core/variables.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="demo-container">
    <h1>Tooltip Component Demo</h1>
    <p>Hover over the elements to see tooltips.</p>

    <div class="tooltip-grid">
      <div class="tooltip-wrapper">
        <button class="demo-btn">Top Tooltip</button>
        <span class="tooltip tooltip-top">Tooltip on top</span>
      </div>
      <div class="tooltip-wrapper">
        <button class="demo-btn">Bottom Tooltip</button>
        <span class="tooltip tooltip-bottom">Tooltip on bottom</span>
      </div>
      <div class="tooltip-wrapper">
        <button class="demo-btn">Left Tooltip</button>
        <span class="tooltip tooltip-left">Tooltip on left</span>
      </div>
      <div class="tooltip-wrapper">
        <button class="demo-btn">Right Tooltip</button>
        <span class="tooltip tooltip-right">Tooltip on right</span>
      </div>
      <div class="tooltip-wrapper">
        <button class="demo-btn">Glass Tooltip</button>
        <span class="tooltip tooltip-top tooltip-glass">Glassmorphism tooltip</span>
      </div>
      <div class="tooltip-wrapper">
        <button class="demo-btn">Dark Tooltip</button>
        <span class="tooltip tooltip-top tooltip-dark">Dark styled tooltip</span>
      </div>
    </div>
  </div>
</body>
</html>
