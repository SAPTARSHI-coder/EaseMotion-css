<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Minimalist Outline CSS Card component"
  >
  <title>Minimalist Outline Card</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="demo">
    <article class="outline-card">
      <div class="outline-card__header">
        <span class="outline-card__number" aria-hidden="true">
          01
        </span>

        <span class="outline-card__label">
          Featured
        </span>
      </div>

      <div class="outline-card__icon" aria-hidden="true">
        <svg
          viewBox="0 0 24 24"
          width="28"
          height="28"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M12 3v18"></path>
          <path d="M3 12h18"></path>
          <path d="m5.5 5.5 13 13"></path>
          <path d="m18.5 5.5-13 13"></path>
        </svg>
      </div>

      <div class="outline-card__body">
        <p class="outline-card__eyebrow">
          Pure CSS Component
        </p>

        <h1 class="outline-card__title">
          Minimalist
          <span>Outline</span>
        </h1>

        <p class="outline-card__description">
          A refined card component built with clean borders,
          subtle motion, and carefully layered interaction states.
        </p>
      </div>

      <div class="outline-card__footer">
        <span class="outline-card__status">
          <span
            class="outline-card__status-dot"
            aria-hidden="true"
          ></span>
          Ready to use
        </span>

        <a
          class="outline-card__link"
          href="#explore"
          aria-label="Explore Minimalist Outline component"
        >
          <span>Explore</span>
          <span aria-hidden="true">↗</span>
        </a>
      </div>
    </article>
  </main>
</body>
</html>
