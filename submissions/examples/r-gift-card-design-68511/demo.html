<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Elegant digital gift card built with pure CSS."
  >
  <title>CSS Gift Card Design</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">
    <section class="demo" aria-labelledby="page-title">
      <span class="eyebrow">Pure CSS Component</span>

      <h1 id="page-title">Digital Gift Card</h1>

      <p class="intro">
        A polished gift card with balance, code, and interactive styling.
      </p>

      <article class="gift-card">
        <div class="card-glow" aria-hidden="true"></div>
        <div class="card-shine" aria-hidden="true"></div>

        <div class="card-top">
          <span class="brand">LUMI</span>
          <span class="gift-icon" aria-hidden="true">✦</span>
        </div>

        <div class="card-content">
          <span class="label">Gift Balance</span>
          <strong class="balance">$250.00</strong>
        </div>

        <div class="card-bottom">
          <div>
            <span class="label">Gift Code</span>
            <strong class="code">LUMI-8K4P-29XZ</strong>
          </div>

          <span class="validity">VALID</span>
        </div>
      </article>

      <button class="redeem-button" type="button">
        Redeem Gift Card
      </button>

      <p class="hint">Hover the card to reveal the shine</p>
    </section>
  </main>

</body>
</html>
