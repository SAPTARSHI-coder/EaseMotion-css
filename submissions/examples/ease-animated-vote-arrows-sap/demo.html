<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ease-animated-vote-arrows-sap demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { height: 100vh; margin: 0; display: flex; align-items: center; justify-content: center; background: #f4f4f5; }
  </style>
</head>
<body>
  <div class="vote-arrows-sap" id="vote">
    <button class="vote-btn up" id="upBtn" aria-label="Upvote">
      <svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
    </button>
    <span class="vote-count" id="count">42</span>
    <button class="vote-btn down" id="downBtn" aria-label="Downvote">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12l7 7 7-7"/></svg>
    </button>
  </div>
  <script>
    const upBtn = document.getElementById('upBtn');
    const downBtn = document.getElementById('downBtn');
    const count = document.getElementById('count');
    let value = 42;
    let state = 0;

    function render() {
      count.textContent = value;
      count.style.animation = 'none';
      void count.offsetWidth;
      count.style.animation = '';
      upBtn.classList.toggle('active', state === 1);
      downBtn.classList.toggle('active', state === -1);
    }

    upBtn.addEventListener('click', () => {
      value += state === 1 ? -1 : state === -1 ? 2 : 1;
      state = state === 1 ? 0 : 1;
      render();
    });

    downBtn.addEventListener('click', () => {
      value += state === -1 ? 1 : state === 1 ? -2 : -1;
      state = state === -1 ? 0 : -1;
      render();
    });
  </script>
</body>
</html>
