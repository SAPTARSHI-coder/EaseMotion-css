<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neural Synaptic Resonance Matrix Demo</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <div class="resonance-matrix-wrapper">
    <div class="matrix-container">
      
      <!-- Left side: Interactive Canvas Area -->
      <section class="matrix-canvas-area" aria-label="Neural Matrix Canvas">
        
        <!-- Radar Radar Sweep -->
        <div class="hud-signal-radar" aria-hidden="true"></div>

        <!-- Telemetry Data Overlay -->
        <div class="hud-telemetry-layer">
          <div>SYS_STATUS: ACTIVE</div>
          <div>RESONANCE_FREQ: <span id="telemetry-freq">24.50</span> Hz</div>
          <div>AXONAL_IMPULSES: <span id="telemetry-impulses">12</span>/sec</div>
          <div>INTEGRITY: 98.42%</div>
        </div>

        <!-- Resonance Boundary Rings -->
        <div class="resonance-ring-outer" id="outer-ring"></div>
        <div class="resonance-ring-mid" id="mid-ring"></div>
        <div class="resonance-ring-inner" id="inner-ring"></div>

        <!-- Bio-electric Nucleus -->
        <div class="matrix-core-nucleus" id="matrix-nucleus"></div>

        <!-- Synaptic Nodes -->
        <div class="synaptic-node node-1" data-id="1" title="Node Alpha"></div>
        <div class="synaptic-node node-2" data-id="2" title="Node Beta"></div>
        <div class="synaptic-node node-3" data-id="3" title="Node Gamma"></div>
        <div class="synaptic-node node-4" data-id="4" title="Node Delta"></div>
        <div class="synaptic-node node-5" data-id="5" title="Node Epsilon"></div>
        <div class="synaptic-node node-6" data-id="6" title="Node Zeta"></div>

        <!-- Dynamic axonal connection paths built via JS -->
        <div id="axonal-ray-container"></div>
      </section>

      <!-- Right side: Telemetry Control Panel -->
      <aside class="control-panel-column">
        
        <!-- System Status Cards -->
        <div class="matrix-card">
          <h3>System Telemetry</h3>
          <div class="status-grid">
            <div class="status-stat">
              <div class="label">Voltage</div>
              <div class="value" id="status-voltage">320 mV</div>
            </div>
            <div class="status-stat">
              <div class="label">Temp</div>
              <div class="value">37.2 °C</div>
            </div>
            <div class="status-stat">
              <div class="label">Sync Rate</div>
              <div class="value" id="status-sync">92%</div>
            </div>
            <div class="status-stat">
              <div class="label">Efficiency</div>
              <div class="value">99.1%</div>
            </div>
          </div>
        </div>

        <!-- Telemetry Parameter Sliders -->
        <div class="matrix-card">
          <h3>Oscillation Controls</h3>
          <div class="telemetry-sliders-list">
            
            <div class="slider-field">
              <label for="freq-control">
                <span>Resonance Freq</span>
                <span id="freq-val">25 Hz</span>
              </label>
              <input type="range" id="freq-control" min="5" max="100" value="25">
            </div>

            <div class="slider-field">
              <label for="impulse-control">
                <span>Impulse Speed</span>
                <span id="speed-val">4.0s</span>
              </label>
              <input type="range" id="impulse-control" min="10" max="80" value="40">
            </div>

            <div class="slider-field">
              <label for="voltage-control">
                <span>Core Potential</span>
                <span id="voltage-val">320 mV</span>
              </label>
              <input type="range" id="voltage-control" min="100" max="600" value="320">
            </div>

          </div>
        </div>

        <!-- Potential Trigger Control -->
        <div class="matrix-card">
          <h3>Stimulation Hub</h3>
          <button class="action-potential-trigger-btn" id="trigger-action-potential-btn">
            Trigger Action Potential
          </button>
        </div>

      </aside>

    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const rayContainer = document.getElementById('axonal-ray-container');
      const nodes = document.querySelectorAll('.synaptic-node');
      const nucleus = document.getElementById('matrix-nucleus');

      // Sliders & Telemetry Values
      const freqControl = document.getElementById('freq-control');
      const impulseControl = document.getElementById('impulse-control');
      const voltageControl = document.getElementById('voltage-control');

      const freqVal = document.getElementById('freq-val');
      const speedVal = document.getElementById('speed-val');
      const voltageVal = document.getElementById('voltage-val');

      const telFreq = document.getElementById('telemetry-freq');
      const telImp = document.getElementById('telemetry-impulses');
      const statusVoltage = document.getElementById('status-voltage');
      const statusSync = document.getElementById('status-sync');

      const triggerBtn = document.getElementById('trigger-action-potential-btn');

      // Draw Axonal rays from core nucleus to outer nodes
      function drawAxons() {
        rayContainer.innerHTML = '';
        const canvasRect = document.querySelector('.matrix-canvas-area').getBoundingClientRect();
        const coreX = canvasRect.width / 2;
        const coreY = canvasRect.height / 2;

        nodes.forEach(node => {
          const nodeX = node.offsetLeft + 7;
          const nodeY = node.offsetTop + 7;

          const dx = nodeX - coreX;
          const dy = nodeY - coreY;
          const dist = Math.sqrt(dx * dx + dy * dy);
          const angle = Math.atan2(dy, dx) * (180 / Math.PI);

          // Create the connection ray line
          const ray = document.createElement('div');
          ray.className = 'axonal-ray';
          ray.style.width = dist + 'px';
          ray.style.left = coreX + 'px';
          ray.style.top = coreY + 'px';
          ray.style.transform = `rotate(${angle}deg)`;
          rayContainer.appendChild(ray);

          // Create the animated impulse runner along this axon
          const runner = document.createElement('div');
          runner.className = 'impulse-runner';
          runner.style.left = coreX + 'px';
          runner.style.top = coreY + 'px';
          
          // Custom runner animation
          const speedSec = parseFloat(impulseControl.value) / 10;
          runner.style.animationDuration = speedSec + 's';
          
          // Generate unique animation path
          const animName = `axon-path-${node.dataset.id}`;
          const styleSheet = document.styleSheets[0];
          
          // Remove old keyframes rule if exists
          for (let i = 0; i < styleSheet.cssRules.length; i++) {
            if (styleSheet.cssRules[i].name === animName) {
              styleSheet.deleteRule(i);
              break;
            }
          }

          styleSheet.insertRule(`
            @keyframes ${animName} {
              0% { left: ${coreX}px; top: ${coreY}px; opacity: 1; transform: scale(1); }
              100% { left: ${nodeX}px; top: ${nodeY}px; opacity: 0; transform: scale(0.5); }
            }
          `, styleSheet.cssRules.length);

          runner.style.animationName = animName;
          rayContainer.appendChild(runner);
        });
      }

      // Redraw axons on resize
      window.addEventListener('resize', drawAxons);
      setTimeout(drawAxons, 200);

      // Event Listeners for Sliders
      freqControl.addEventListener('input', (e) => {
        const val = e.target.value;
        freqVal.textContent = val + ' Hz';
        telFreq.textContent = val + '.00';
        
        // Adjust ring rotation speeds
        const rotSec = 600 / val;
        document.getElementById('outer-ring').style.animationDuration = rotSec + 's';
        document.getElementById('inner-ring').style.animationDuration = (rotSec / 2) + 's';
      });

      impulseControl.addEventListener('input', (e) => {
        const val = e.target.value / 10;
        speedVal.textContent = val.toFixed(1) + 's';
        telImp.textContent = Math.round(15 / val);
        drawAxons();
      });

      voltageControl.addEventListener('input', (e) => {
        const val = e.target.value;
        voltageVal.textContent = val + ' mV';
        statusVoltage.textContent = val + ' mV';
        statusSync.textContent = Math.round(val / 6 * 1.5) + '%';
        
        // Scale nucleus glow
        nucleus.style.boxShadow = `0 0 ${val / 10}px #10b981, 0 0 ${val / 5}px #10b981`;
      });

      // Simulation Action Potential Burst
      triggerBtn.addEventListener('click', () => {
        nucleus.style.transform = 'scale(1.4)';
        nucleus.style.filter = 'brightness(2) saturate(1.5)';
        
        const runners = document.querySelectorAll('.impulse-runner');
        runners.forEach(r => {
          // Restart animation quickly
          r.style.animation = 'none';
          r.offsetHeight; // trigger reflow
          r.style.animation = null;
        });

        setTimeout(() => {
          nucleus.style.transform = '';
          nucleus.style.filter = '';
        }, 500);
      });
    });
  </script>
</body>
</html>
