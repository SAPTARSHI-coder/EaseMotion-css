<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ease-scroll-horizontal-timeline-sap demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { height: 100vh; margin: 0; display: flex; align-items: center; justify-content: center; background: #f4f4f5; }
  </style>
</head>
<body>
  <div class="h-timeline-sap" id="timeline">
    <div class="h-item"><div class="h-year">2021</div><div class="h-title">Company Founded</div></div>
    <div class="h-item"><div class="h-year">2022</div><div class="h-title">Seed Funding</div></div>
    <div class="h-item"><div class="h-year">2023</div><div class="h-title">100K Users</div></div>
    <div class="h-item"><div class="h-year">2024</div><div class="h-title">Series A</div></div>
  </div>
  <script>
    const timeline = document.getElementById('timeline');
    const items = [...document.querySelectorAll('.h-item')];
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => entry.target.classList.toggle('in-view', entry.isIntersecting));
    }, { root: timeline, threshold: 0.6 });
    items.forEach(item => observer.observe(item));
  </script>
</body>
</html>
