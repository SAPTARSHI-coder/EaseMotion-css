<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Elastic Morph Animation | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="morph-container">
    <header class="morph-header">
      <h1>Elastic Morph Animation</h1>
      <p>Fluid, organic shape-shifting powered purely by CSS keyframes and cubic-bezier elasticity.</p>
    </header>

    <div class="morph-stage">
      <div 
        class="morph-shape" 
        tabindex="0" 
        role="img" 
        aria-label="An elastically morphing organic shape shifting between organic forms">
      </div>
    </div>

    <p class="morph-info">💡 Hover or focus element to pause animation state</p>
  </main>
</body>
</html>
