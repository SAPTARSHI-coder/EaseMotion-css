<!-- submissions/examples/environment-badge/demo.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Environment Badge | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="demo-container">
    
    <!-- Dev Badge -->
    <div class="ease-env-badge" data-env="dev" role="status" aria-label="Environment: Development">
      Development
    </div>

    <!-- Staging Badge -->
    <div class="ease-env-badge" data-env="staging" role="status" aria-label="Environment: Staging">
      Staging
    </div>

    <!-- Production Badge -->
    <div class="ease-env-badge" data-env="production" role="status" aria-label="Environment: Production">
      Production
    </div>

  </main>

</body>
</html>
