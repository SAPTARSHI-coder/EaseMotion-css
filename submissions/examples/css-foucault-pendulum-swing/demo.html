<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
        name="description"
        content="Pure CSS Foucault Pendulum Swing background animation"
    >
    <title>Foucault Pendulum Swing</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="pendulum-scene">
        <div class="pendulum-content">
            <p class="eyebrow">CSS Background Animation</p>

            <h1>Foucault Pendulum</h1>

            <p class="description">
                A smooth pendulum-inspired background animation created
                entirely with HTML and Vanilla CSS.
            </p>
        </div>

        <div class="pendulum" aria-hidden="true">
            <div class="pendulum-frame">
                <span class="frame-bar frame-left"></span>
                <span class="frame-bar frame-right"></span>
                <span class="frame-bar frame-top"></span>
            </div>

            <div class="pendulum-string">
                <div class="pendulum-bob"></div>
            </div>

            <div class="pendulum-shadow"></div>
        </div>
    </main>
</body>
</html>
