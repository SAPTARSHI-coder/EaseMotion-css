<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Glowing Sliding Tabs — EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <p class="label">Pure CSS Sliding Glowing Tab Indicator</p>

  <div class="ease-glow-tabs">
    <input type="radio" name="tabs-ak" id="tab1-ak" checked />
    <label for="tab1-ak" class="ease-glow-tab-label">Overview</label>

    <input type="radio" name="tabs-ak" id="tab2-ak" />
    <label for="tab2-ak" class="ease-glow-tab-label">Analytics</label>

    <input type="radio" name="tabs-ak" id="tab3-ak" />
    <label for="tab3-ak" class="ease-glow-tab-label">Settings</label>

    <!-- Sliding Pill Glider -->
    <span class="ease-glow-tabs-glider"></span>
  </div>

</body>
</html>
