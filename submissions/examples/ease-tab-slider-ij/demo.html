<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tab Slider - EaseMotion Submission</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="stage">
    <h1 class="page-title">Plans &amp; Pricing</h1>

    <nav class="tabs" id="tabs" aria-label="Billing period">
      <span class="tab-indicator" id="tabIndicator"></span>
      <button class="tab active" data-panel="monthly">Monthly</button>
      <button class="tab" data-panel="yearly">Yearly</button>
      <button class="tab" data-panel="lifetime">Lifetime</button>
    </nav>

    <section class="panel" id="monthly">
      <h2>Monthly billing</h2>
      <p>Pay as you go. Cancel any time with no strings attached.</p>
      <p class="price">$12<span>/mo</span></p>
    </section>
    <section class="panel" id="yearly">
      <h2>Yearly billing</h2>
      <p>Two months free, billed once per year.</p>
      <p class="price">$10<span>/mo</span></p>
    </section>
    <section class="panel" id="lifetime">
      <h2>Lifetime deal</h2>
      <p>One payment, forever. Includes every future feature.</p>
      <p class="price">$199<span>once</span></p>
    </section>
  </main>

  <script>
    const tabs = document.getElementById('tabs');
    const indicator = document.getElementById('tabIndicator');
    const panels = document.querySelectorAll('.panel');
    const activeTab = tabs.querySelector('.tab.active');

    function moveIndicator(tab) {
      indicator.style.width = tab.offsetWidth + 'px';
      indicator.style.transform = 'translateX(' + tab.offsetLeft + 'px)';
    }

    moveIndicator(activeTab);

    tabs.addEventListener('click', e => {
      const tab = e.target.closest('.tab');
      if (!tab || tab.classList.contains('active')) return;

      tabs.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      moveIndicator(tab);

      panels.forEach(panel => {
        panel.classList.remove('visible');
        panel.classList.add('hidden');
      });
      const target = document.getElementById(tab.dataset.panel);
      target.classList.remove('hidden');
      target.classList.add('visible');
    });

    window.addEventListener('resize', () => {
      const active = tabs.querySelector('.tab.active');
      if (active) moveIndicator(active);
    });
  </script>
</body>
</html>
