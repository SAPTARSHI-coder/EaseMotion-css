<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animated CSS Progress Stepper</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="page">
    <section class="stepper-card">

      <span class="badge">PURE CSS COMPONENT</span>

      <h1>Project Setup</h1>

      <p class="subtitle">
        Track your workflow with a modern animated progress stepper.
      </p>

      <div class="stepper">

        <div class="progress-track">
          <div class="progress-fill"></div>
        </div>

        <div class="step active">
          <div class="step-circle">✓</div>
          <span>Account</span>
        </div>

        <div class="step active">
          <div class="step-circle">✓</div>
          <span>Profile</span>
        </div>

        <div class="step current">
          <div class="step-circle">3</div>
          <span>Settings</span>
        </div>

        <div class="step">
          <div class="step-circle">4</div>
          <span>Complete</span>
        </div>

      </div>

      <div class="status">
        <span class="status-dot"></span>
        Step 3 of 4 — Configure your settings
      </div>

    </section>
  </main>

</body>

</html>
