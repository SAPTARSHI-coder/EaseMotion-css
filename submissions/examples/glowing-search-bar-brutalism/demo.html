<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />
  <meta
    name="description"
    content="Glowing Search Bar Input with Brutalism styling"
  />
  <title>Glowing Search Bar — Brutalism</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main class="page">
    <section class="search-demo" aria-labelledby="search-title">

      <div class="demo-header">
        <span class="eyebrow">BRUTAL SEARCH</span>
        <h1 id="search-title">Find something.</h1>
        <p>
          A bold, glowing search input built with pure CSS.
        </p>
      </div>

      <form class="search-bar" role="search">
        <label class="sr-only" for="search-input">
          Search
        </label>

        <span class="search-icon" aria-hidden="true">
          <svg
            viewBox="0 0 24 24"
            role="img"
            focusable="false"
          >
            <circle cx="11" cy="11" r="6.5"></circle>
            <path d="M16 16L21 21"></path>
          </svg>
        </span>

        <input
          id="search-input"
          type="search"
          name="q"
          placeholder="Search anything..."
          autocomplete="off"
          spellcheck="false"
        />

        <button
          class="clear-button"
          type="reset"
          aria-label="Clear search"
        >
          ×
        </button>

        <button
          class="search-button"
          type="submit"
          aria-label="Submit search"
        >
          SEARCH
        </button>
      </form>

      <div class="search-meta">
        <span>STATUS: READY</span>
        <span>PURE CSS</span>
        <span>NO JS</span>
      </div>

      <div class="hint">
        <kbd>/</kbd>
        <span>Focus search</span>
      </div>

    </section>
  </main>
</body>
</html>
