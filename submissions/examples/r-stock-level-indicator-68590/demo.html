<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CSS stock level indicator with urgency colors.">
  <title>CSS Stock Level Indicator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="stock-card" aria-labelledby="stock-title">

    <div class="stock-top">
      <div>
        <span class="eyebrow">Inventory status</span>
        <h1 id="stock-title">Classic Sneakers</h1>
      </div>

      <span class="status">Low stock</span>
    </div>

    <div class="stock-info">
      <strong>12</strong>
      <span>pairs remaining</span>
    </div>

    <div
      class="stock-bar"
      role="progressbar"
      aria-valuemin="0"
      aria-valuemax="100"
      aria-valuenow="24"
      aria-label="24 percent stock remaining"
    >
      <span class="stock-fill"></span>
    </div>

    <div class="stock-labels">
      <span>0</span>
      <span>50</span>
      <span>100</span>
    </div>

    <p class="warning">
      Only a few left — order soon before they sell out.
    </p>

  </main>

</body>
</html>
