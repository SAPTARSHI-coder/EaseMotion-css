<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-lighthouse-beam-rotate demo</title>
</head>
<body>
<div class="lh-app">
  <div class="lh-sky">
    <span class="lh-star lh-star-1"></span>
    <span class="lh-star lh-star-2"></span>
    <span class="lh-star lh-star-3"></span>
    <span class="lh-moon"></span>
    <div class="lh-tower">
      <div class="lh-lantern">
        <span class="lh-bulb"></span>
        <span class="lh-beam"></span>
      </div>
      <div class="lh-gallery"></div>
      <div class="lh-band lh-band-1"></div>
      <div class="lh-band lh-band-2"></div>
      <div class="lh-band lh-band-3"></div>
      <div class="lh-band lh-band-4"></div>
      <div class="lh-door"></div>
    </div>
  </div>
  <div class="lh-rock"></div>
  <div class="lh-sea">
    <span class="lh-wave lh-wave-1"></span>
    <span class="lh-wave lh-wave-2"></span>
  </div>
  <div class="lh-mast"></div>
</div>
</body>
</html>
