<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EaseMotion — Color Palette Picker</title>
  <link rel="stylesheet" href="../../core/variables.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="demo-container">
    <h1>Color Palette Picker</h1>
    <p>Generate harmonious color palettes from a base color.</p>

    <div class="palette-card">
      <div class="ease-field">
        <label class="ease-field-label">Base Color</label>
        <input type="color" class="color-input" id="baseColor" value="#6366f1">
      </div>
      <div class="palette-grid" id="palette"></div>
      <div class="color-values" id="colorValues"></div>
    </div>
  </div>
  <script>
    function hexToHSL(hex) {
      let r = parseInt(hex.slice(1,3), 16)/255;
      let g = parseInt(hex.slice(3,5), 16)/255;
      let b = parseInt(hex.slice(5,7), 16)/255;
      const max = Math.max(r,g,b), min = Math.min(r,g,b);
      let h, s, l = (max+min)/2;
      if (max === min) { h = s = 0; }
      else {
        const d = max - min;
        s = l > 0.5 ? d/(2-max-min) : d/(max+min);
        switch(max) {
          case r: h = ((g-b)/d + (g<b?6:0))/6; break;
          case g: h = ((b-r)/d + 2)/6; break;
          case b: h = ((r-g)/d + 4)/6; break;
        }
      }
      return [Math.round(h*360), Math.round(s*100), Math.round(l*100)];
    }
    function hslToHex(h,s,l) {
      s /= 100; l /= 100;
      const a = s * Math.min(l, 1-l);
      const f = n => { const k = (n+h/30)%12; return l - a * Math.max(Math.min(k-3, 9-k, 1), -1); };
      return '#' + [f(0),f(8),f(4)].map(x => Math.round(x*255).toString(16).padStart(2,'0')).join('');
    }
    function generatePalette() {
      const hex = document.getElementById('baseColor').value;
      const [h,s,l] = hexToHSL(hex);
      const grid = document.getElementById('palette');
      const vals = document.getElementById('colorValues');
      grid.innerHTML = ''; vals.innerHTML = '';
      const variations = [
        [h, s, Math.min(l+30, 95)],
        [h, Math.min(s+10, 100), Math.min(l+15, 85)],
        [h, s, l],
        [h, Math.max(s-10, 0), Math.max(l-15, 15)],
        [h, s, Math.max(l-30, 5)]
      ];
      variations.forEach(([ch,cs,cl]) => {
        const hexVal = hslToHex(ch,cs,cl);
        const swatch = document.createElement('div');
        swatch.className = 'swatch';
        swatch.style.background = hexVal;
        swatch.title = hexVal;
        grid.appendChild(swatch);
        const tag = document.createElement('span');
        tag.className = 'color-tag';
        tag.textContent = hexVal;
        vals.appendChild(tag);
      });
    }
    document.getElementById('baseColor').addEventListener('input', generatePalette);
    generatePalette();
  </script>
</body>
</html>
