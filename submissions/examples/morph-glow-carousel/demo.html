<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Morph-Glow Carousel | EaseMotion CSS</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="container">

    <h1>🎮 Morph-Glow Gaming Carousel</h1>
    <p>Pure CSS animated carousel with glowing morph effects.</p>

    <div class="carousel">

        <div class="card active">
            <h2>⚔️ Cyber Arena</h2>
            <p>Experience futuristic battles and challenges.</p>
        </div>

        <div class="card">
            <h2>🚀 Space Quest</h2>
            <p>Explore galaxies and unknown worlds.</p>
        </div>

        <div class="card">
            <h2>🏆 Battle League</h2>
            <p>Compete with players worldwide.</p>
        </div>

    </div>

</main>

</body>
</html>
