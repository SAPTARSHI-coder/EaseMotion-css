<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Shimmer-Sweep Popover - Cyberpunk Neon Layouts</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="cyberpunk-container">
    <div class="popover-wrapper">
      <button class="cyber-btn" aria-haspopup="dialog" aria-expanded="false">
        DECRYPT LOGS
      </button>
      
      <div class="shimmer-popover" role="dialog" aria-label="Decrypted Logs">
        <div class="shimmer-effect"></div>
        <div class="popover-content">
          <h3 class="neon-title">CLASSIFIED ARCHIVE</h3>
          <p class="neon-text">Logs decrypted. Subject is mobile and untraceable. Proceed with caution.</p>
          <ul class="neon-list">
            <li><strong>Clearance:</strong> Level 5</li>
            <li><strong>Encryption:</strong> Quantum</li>
            <li><strong>Status:</strong> Active</li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
