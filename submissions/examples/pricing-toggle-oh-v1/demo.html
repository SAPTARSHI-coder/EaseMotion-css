<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pricing Toggle</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1 class="ease-fade-in">Our Pricing</h1>
    <div class="pricing-toggle ease-fade-in ease-delay-100">
      <span>Monthly</span>
      <button class="ease-pricing-toggle" onclick="this.classList.toggle('active')"></button>
      <span>Yearly</span>
    </div>
  </div>
</body>
</html>
