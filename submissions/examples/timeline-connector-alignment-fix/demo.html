<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timeline Connector Alignment Fix</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="timeline">

  <div class="timeline-item">
    <div class="marker"></div>
    <div class="content">
      <h3>Project Started</h3>
      <p>Initial planning and requirement gathering.</p>
    </div>
  </div>

  <div class="timeline-item">
    <div class="marker"></div>
    <div class="content">
      <h3>Development</h3>
      <p>
        The development phase contains more content than the first item,
        demonstrating that the connector line stays perfectly aligned even
        when timeline cards have different heights.
      </p>
    </div>
  </div>

  <div class="timeline-item">
    <div class="marker"></div>
    <div class="content">
      <h3>Deployment</h3>
      <p>Application successfully deployed.</p>
    </div>
  </div>

</div>

</body>
</html>
