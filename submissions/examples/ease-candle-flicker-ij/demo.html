<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Candle Flicker Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="table">
    <div class="candle" id="candle">
      <div class="wax"></div>
      <div class="wick"></div>
      <div class="glow" id="glow" aria-hidden="true"></div>
      <div class="flame" id="flame" aria-hidden="true"></div>
    </div>
    <button class="relight" id="relight" type="button">Relight</button>
    <p class="hint">The flame sways and shivers like a real candle in a draft.</p>
  </main>
  <script>
    const flame = document.getElementById("flame");
    const glow = document.getElementById("glow");
    const relight = document.getElementById("relight");
    function relightFlame() {
      flame.classList.remove("lit");
      glow.classList.remove("lit");
      void flame.offsetWidth;
      void glow.offsetWidth;
      flame.classList.add("lit");
      glow.classList.add("lit");
    }
    relight.addEventListener("click", relightFlame);
    relightFlame();
  </script>
</body>
</html>
