<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Shimmer-Sweep Badge - Minimalist Tech</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="layout-container">
        
        <header class="section-header">
            <h1 class="title">System Badges</h1>
            <p class="subtitle">A minimalist tech badge component featuring an infinite, angled shimmer-sweep animation.</p>
        </header>

        <div class="dashboard-area">
            
            <div class="card">
                
                <div class="badge-row">
                    
                    <!-- Badge 1: Default/Neutral -->
                    <div class="badge shimmer-sweep color-default">
                        <span class="badge-dot"></span>
                        <span class="badge-text">v2.4.1 Beta</span>
                    </div>
                    
                    <!-- Badge 2: Success -->
                    <div class="badge shimmer-sweep color-success">
                        <span class="badge-dot"></span>
                        <span class="badge-text">System Operational</span>
                    </div>
                    
                    <!-- Badge 3: Warning -->
                    <div class="badge shimmer-sweep color-warning">
                        <span class="badge-dot"></span>
                        <span class="badge-text">High Latency</span>
                    </div>
                    
                    <!-- Badge 4: Special/Premium (Dark Theme) -->
                    <div class="badge shimmer-sweep badge-premium">
                        <svg class="badge-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
                        </svg>
                        <span class="badge-text">Enterprise Tier</span>
                    </div>
                    
                </div>
                
            </div>
            
        </div>
    </div>

</body>
</html>
