<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Animated Circuit Board</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <div class="circuit-container" aria-label="Animated circuit board with traveling data pulses">
    
    <svg class="circuit-board" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
      
      <!-- Base Traces (Background lines) -->
      <g class="traces">
        <path class="trace" d="M 50,250 L 50,150 L 100,100 L 250,100" />
        <path class="trace" d="M 100,250 L 100,180 L 150,130 L 250,130" />
        <path class="trace" d="M 350,250 L 350,180 L 300,130 L 250,130" />
        <path class="trace" d="M 300,50 L 300,100 L 250,150 L 150,150" />
        <path class="trace" d="M 50,50 L 100,50 L 150,100 L 200,100 L 200,150" />
      </g>

      <!-- Central CPU / Core -->
      <rect x="220" y="80" width="60" height="60" rx="8" class="trace node-pulse" />
      <text x="250" y="115" fill="#0ea5e9" font-size="12" font-family="monospace" text-anchor="middle" font-weight="bold">CORE</text>

      <!-- Traveling Pulses -->
      <g class="pulses">
        <path class="pulse pulse-1" pathLength="100" d="M 50,250 L 50,150 L 100,100 L 250,100" />
        <path class="pulse pulse-2" pathLength="100" d="M 100,250 L 100,180 L 150,130 L 250,130" />
        <path class="pulse pulse-3" pathLength="100" d="M 350,250 L 350,180 L 300,130 L 250,130" />
        <path class="pulse pulse-4" pathLength="100" d="M 300,50 L 300,100 L 250,150 L 150,150" />
        <path class="pulse pulse-5" pathLength="100" d="M 50,50 L 100,50 L 150,100 L 200,100 L 200,150" />
      </g>

      <!-- Nodes (Endpoints) -->
      <g class="nodes">
        <!-- Bottom nodes -->
        <circle cx="50" cy="250" r="6" class="node" />
        <circle cx="100" cy="250" r="6" class="node" />
        <circle cx="350" cy="250" r="6" class="node" />
        
        <!-- Top nodes -->
        <circle cx="300" cy="50" r="6" class="node" />
        <circle cx="50" cy="50" r="6" class="node" />
        
        <!-- Internal nodes -->
        <circle cx="150" cy="150" r="4" class="node" />
        <circle cx="200" cy="150" r="4" class="node" />
      </g>
      
    </svg>

  </div>

</body>
</html>
