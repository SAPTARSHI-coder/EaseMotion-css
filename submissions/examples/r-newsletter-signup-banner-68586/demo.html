<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Responsive CSS newsletter signup banner.">
  <title>CSS Newsletter Signup Banner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="newsletter" aria-labelledby="newsletter-title">

    <div class="copy">
      <span class="eyebrow">Stay updated</span>

      <h1 id="newsletter-title">
        Get the latest design drops.
      </h1>

      <p>
        One useful email. Fresh components, animation ideas,
        and frontend inspiration.
      </p>
    </div>

    <form class="signup" action="#" method="post">
      <label for="email">Email address</label>

      <div class="input-row">
        <input
          id="email"
          name="email"
          type="email"
          autocomplete="email"
          placeholder="you@example.com"
          required
        >

        <button type="submit">Subscribe</button>
      </div>
    </form>

  </main>

</body>
</html>
