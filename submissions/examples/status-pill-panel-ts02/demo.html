<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Status Pill Panel</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<main class="status-demo"><section class="status-panel"><header><p>System state</p><h1>Readable status pills for dense dashboards.</h1></header><div class="pill-list"><span class="status-pill success">Healthy</span><span class="status-pill warning">Delayed</span><span class="status-pill danger">Action needed</span><span class="status-pill neutral">Paused</span></div><div class="queue-card"><strong>Import queue</strong><p>14 jobs completed, 2 waiting for review.</p></div></section></main>
</body>
</html>
