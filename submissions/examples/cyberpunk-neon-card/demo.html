<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark light">
  <title>Cyberpunk Neon Card</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="page">
    <section class="cyber-card" aria-labelledby="card-title">

      <div class="card-glow" aria-hidden="true"></div>
      <div class="scan-line" aria-hidden="true"></div>

      <header class="card-header">
        <span class="status">
          <span class="status-dot" aria-hidden="true"></span>
          SYSTEM ONLINE
        </span>
        <span class="card-id">#2077</span>
      </header>

      <div class="card-content">
        <div class="icon-wrap" aria-hidden="true">
          <span class="cyber-icon">✦</span>
        </div>

        <p class="eyebrow">CYBER // INTERFACE</p>

        <h1 id="card-title">Neon Protocol</h1>

        <p class="description">
          A futuristic card interface powered entirely by HTML and CSS,
          featuring neon borders, glowing accents and smooth motion.
        </p>

        <div class="card-stats">
          <div class="stat">
            <span class="stat-label">STATUS</span>
            <strong>ACTIVE</strong>
          </div>

          <div class="stat">
            <span class="stat-label">POWER</span>
            <strong>98%</strong>
          </div>

          <div class="stat">
            <span class="stat-label">MODE</span>
            <strong>NEON</strong>
          </div>
        </div>

        <a class="cyber-button" href="#activate">
          <span>INITIALIZE</span>
          <span class="button-arrow" aria-hidden="true">→</span>
        </a>
      </div>

      <span class="corner corner-top-left" aria-hidden="true"></span>
      <span class="corner corner-top-right" aria-hidden="true"></span>
      <span class="corner corner-bottom-left" aria-hidden="true"></span>
      <span class="corner corner-bottom-right" aria-hidden="true"></span>

    </section>
  </main>
</body>
</html>
