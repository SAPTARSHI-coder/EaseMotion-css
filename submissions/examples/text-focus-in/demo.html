<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Text Focus In Demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background-color: #0f172a;
      color: #f8fafc;
    }
    h1 {
      font-size: 4rem;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    .replay-btn {
      margin-top: 3rem;
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
      background: #3b82f6;
      color: white;
      cursor: pointer;
      transition: background 0.3s ease;
    }
    .replay-btn:hover {
      background: #2563eb;
    }
  </style>
</head>
<body>

  <h1 id="demo-text" class="text-focus-in-ag">Cinematic Reveal</h1>

  <button class="replay-btn" onclick="replay()">Replay Animation</button>

  <script>
    function replay() {
      const el = document.getElementById('demo-text');
      el.classList.remove('text-focus-in-ag');
      void el.offsetWidth; // trigger reflow
      el.classList.add('text-focus-in-ag');
    }
  </script>
</body>
</html>
