<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
Bento Grid Interactive Dashboard
</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<main class="dashboard">


<header>

<h1>
Dashboard
</h1>

<p>
Minimal Bento Grid Layout
</p>

</header>



<section class="grid">


<div class="box profile">

<h2>
Welcome Back 👋
</h2>

<p>
Track your projects and analytics easily.
</p>

</div>



<div class="box stats">

<h3>
Revenue
</h3>

<strong>
$24.8K
</strong>

<span>
+12.5%
</span>

</div>



<div class="box activity">

<h3>
Activity
</h3>

<div class="bars">

<i></i>
<i></i>
<i></i>
<i></i>

</div>

</div>



<div class="box projects">

<h3>
Projects
</h3>

<ul>

<li>
Website Redesign
</li>

<li>
Mobile Application
</li>

<li>
AI Dashboard
</li>

</ul>

</div>



<div class="box progress">

<h3>
Progress
</h3>

<div class="circle">
85%
</div>

</div>



</section>



<button id="animate">
Animate Cards
</button>


</main>



<script src="script.js"></script>


</body>

</html>
