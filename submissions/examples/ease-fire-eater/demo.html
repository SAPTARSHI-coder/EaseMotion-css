<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fire Eater · Flames on Stage</title>
    <meta name="description" content="Interactive fire eater performance with flames, sparks, and theatrical fire effects.">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1 class="title">🔥 FIRE EATER</h1>
        
        <div class="canvas-wrapper">
            <canvas id="fireCanvas" width="600" height="500"></canvas>
            <div class="glow-overlay"></div>
        </div>

        <div class="controls">
            <div class="button-group">
                <button class="breathe-btn" id="breatheBtn">🔥 BREATHE</button>
                <button class="reset-btn" id="resetBtn">⟳ RESET</button>
                <button class="toggle-btn" id="toggleBtn">⏸️ PAUSE</button>
            </div>
            <div class="speed-control">
                <label>Intensity</label>
                <input type="range" id="intensitySlider" min="1" max="10" value="5">
                <span id="intensityLabel">5</span>
                <label>Flames</label>
                <input type="range" id="flamesSlider" min="20" max="80" value="50">
                <span id="flamesLabel">50</span>
            </div>
        </div>

        <div class="info">
            <span>🔥 FIRE EATER</span>
            <small>flames · sparks · performance</small>
        </div>
        <div class="hint">
            <span>🔥 click to breathe flames onto the stage</span>
        </div>
    </div>

    <script>
        (function() {
            const canvas = document.getElementById('fireCanvas');
            const ctx = canvas.getContext('2d');
            const W = 600, H = 500;
            
            const breatheBtn = document.getElementById('breatheBtn');
            const resetBtn = document.getElementById('resetBtn');
            const toggleBtn = document.getElementById('toggleBtn');
            const intensitySlider = document.getElementById('intensitySlider');
            const intensityLabel = document.getElementById('intensityLabel');
            const flamesSlider = document.getElementById('flamesSlider');
            const flamesLabel = document.getElementById('flamesLabel');

            let isAnimating = true;
            let time = 0;
            let flames = [];
            let sparks = [];
            let embers = [];
            let isBreathing = false;
            let breathTimer = 0;
            let totalBreaths = 0;

            // ---- Flame Particle ----
            class FlameParticle {
                constructor(x, y, intensity) {
                    this.x = x || W / 2;
                    this.y = y || H - 80;
                    this.size = 5 + Math.random() * 15 * (intensity / 5);
                    this.maxSize = this.size * (1.5 + Math.random() * 1);
                    
                    const angle = -Math.PI / 2 + (Math.random() - 0.5) * 1.2;
                    const speed = 1 + Math.random() * 4 * (intensity / 5);
                    this.vx = Math.cos(angle) * speed * (0.5 + Math.random() * 0.5);
                    this.vy = Math.sin(angle) * speed * (0.5 + Math.random() * 0.5) - 1;
                    
                    this.life = 1;
                    this.decay = 0.005 + Math.random() * 0.015;
                    this.gravity = -0.02 - Math.random() * 0.03;
                    
                    // Color (fire gradient)
                    const hue = 20 + Math.random() * 30;
                    this.color = `hsl(${hue}, 100%, ${50 + Math.random() * 30}%)`;
                    this.glowColor = `hsl(${hue + 10}, 100%, ${60 + Math.random() * 20}%)`;
                    this.alpha = 0.5 + Math.random() * 0.5;
                    
                    this.wobble = 0.02 + Math.random() * 0.04;
                    this.phase = Math.random() * Math.PI * 2;
                    this.turbulence = 0.02 + Math.random() * 0.03;
                }

                update() {
                    this.vx += Math.sin(this.phase) * this.turbulence;
                    this.vy += this.gravity;
                    this.x += this.vx;
                    this.y += this.vy;
                    this.phase += this.wobble;
                    this.size += 0.05;
                    this.life -= this.decay;
                    this.alpha = this.life * 0.8;
                }

                draw(ctx) {
                    if (this.life <= 0 || this.alpha < 0.01) return;
                    
                    const size = this.size * (0.3 + this.life * 0.7);
                    const alpha = this.alpha * (0.3 + this.life * 0.7);
                    
                    ctx.save();
                    ctx.globalAlpha = alpha;
                    
                    // Outer glow
                    const grad = ctx.createRadialGradient(
                        this.x, this.y, 0,
                        this.x, this.y, size * 1.2
                    );
                    grad.addColorStop(0, this.glowColor);
                    grad.addColorStop(0.5, this.color);
                    grad.addColorStop(1, 'rgba(255, 100, 0, 0)');
                    
                    ctx.shadowColor = this.glowColor;
                    ctx.shadowBlur = 20 * this.life;
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, size * 1.2, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // Core
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = `rgba(255, 255, 200, ${alpha * 0.3})`;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, size * 0.3, 0, Math.PI * 2);
                    ctx.fill();
                    
                    ctx.restore();
                }

                isAlive() {
                    return this.life > 0 && this.alpha > 0.01 && 
                           this.x > -50 && this.x < W + 50 &&
                           this.y > -50 && this.y < H + 50;
                }
            }

            // ---- Spark Class ----
            class Spark {
                constructor(x, y) {
                    this.x = x || W / 2 + (Math.random() - 0.5) * 40;
                    this.y = y || H - 80 - Math.random() * 20;
                    this.size = 1 + Math.random() * 3;
                    
                    const angle = -Math.PI / 2 + (Math.random() - 0.5) * 1.5;
                    const speed = 2 + Math.random() * 5;
                    this.vx = Math.cos(angle) * speed;
                    this.vy = Math.sin(angle) * speed - 2;
                    
                    this.life = 1;
                    this.decay = 0.02 + Math.random() * 0.03;
                    this.gravity = 0.05 + Math.random() * 0.05;
                    this.color = `hsl(${30 + Math.random() * 30}, 100%, ${80 + Math.random() * 20}%)`;
                }

                update() {
                    this.vx *= 0.99;
                    this.vy += this.gravity;
                    this.x += this.vx;
                    this.y += this.vy;
                    this.life -= this.decay;
                    this.size *= 0.98;
                }

                draw(ctx) {
                    if (this.life <= 0) return;
                    ctx.save();
                    ctx.globalAlpha = this.life;
                    ctx.fillStyle = this.color;
                    ctx.shadowColor = this.color;
                    ctx.shadowBlur = 10 * this.life;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size * this.life, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
            }

            // ---- Ember Class ----
            class Ember {
                constructor(x, y) {
                    this.x = x || W / 2 + (Math.random() - 0.5) * 80;
                    this.y = y || H - 50 - Math.random() * 30;
                    this.size = 2 + Math.random() * 4;
                    this.vx = (Math.random() - 0.5) * 0.5;
                    this.vy = -0.5 - Math.random() * 1;
                    this.life = 1;
                    this.decay = 0.005 + Math.random() * 0.01;
                    this.color = `hsl(${20 + Math.random() * 20}, 100%, ${50 + Math.random() * 30}%)`;
                    this.flicker = Math.random() * 0.05;
                    this.phase = Math.random() * Math.PI * 2;
                }

                update() {
                    this.vx += Math.sin(this.phase) * this.flicker;
                    this.vy -= 0.002;
                    this.x += this.vx;
                    this.y += this.vy;
                    this.life -= this.decay;
                    this.size *= 0.995;
                    this.phase += 0.02;
                }

                draw(ctx) {
                    if (this.life <= 0) return;
                    ctx.save();
                    ctx.globalAlpha = this.life * 0.5;
                    ctx.fillStyle = this.color;
                    ctx.shadowColor = this.color;
                    ctx.shadowBlur = 8 * this.life;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size * this.life, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
            }

            // ---- Breathe Fire ----
            function breatheFire() {
                if (isBreathing) return;
                isBreathing = true;
                breathTimer = 0;
                totalBreaths++;
                
                const intensity = parseInt(intensitySlider.value);
                const flameCount = parseInt(flamesSlider.value);
                const cx = W / 2;
                const cy = H - 80;
                
                // Create flames
                for (let i = 0; i < flameCount; i++) {
                    const p = new FlameParticle(cx, cy, intensity);
                    flames.push(p);
                }
                
                // Create sparks
                const sparkCount = 15 + Math.floor(Math.random() * 20) * (intensity / 5);
                for (let i = 0; i < sparkCount; i++) {
                    sparks.push(new Spark(cx, cy));
                }
                
                // Create embers
                const emberCount = 10 + Math.floor(Math.random() * 15) * (intensity / 5);
                for (let i = 0; i < emberCount; i++) {
                    embers.push(new Ember(cx, cy));
                }
                
                // Play sound
                playFireSound(intensity);
                
                // Auto-stop after breath
                setTimeout(() => {
                    isBreathing = false;
                }, 500 + intensity * 50);
            }

            // ---- Play Fire Sound ----
            function playFireSound(intensity) {
                try {
                    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    const now = audioCtx.currentTime;
                    
                    // Flame roar (noise)
                    const bufferSize = audioCtx.sampleRate * 0.3;
                    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                    const data = buffer.getChannelData(0);
                    for (let i = 0; i < bufferSize; i++) {
                        const env = Math.exp(-i / (bufferSize * 0.3));
                        data[i] = (Math.random() * 2 - 1) * env * 0.6;
                    }
                    const noise = audioCtx.createBufferSource();
                    noise.buffer = buffer;
                    const gainNoise = audioCtx.createGain();
                    gainNoise.gain.setValueAtTime(0.15 * (intensity / 5), now);
                    gainNoise.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                    noise.connect(gainNoise);
                    gainNoise.connect(audioCtx.destination);
                    noise.start(now);
                    noise.stop(now + 0.3);
                    
                    // Low rumble
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(60 + intensity * 10, now);
                    osc.frequency.exponentialRampToValueAtTime(30, now + 0.2);
                    gain.gain.setValueAtTime(0.08 * (intensity / 5), now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 0.2);
                    
                    // Crackle (short bursts)
                    for (let i = 0; i < 8; i++) {
                        const crackle = audioCtx.createBufferSource();
                        const size = audioCtx.sampleRate * (0.005 + Math.random() * 0.01);
                        const buf = audioCtx.createBuffer(1, size, audioCtx.sampleRate);
                        const d = buf.getChannelData(0);
                        for (let j = 0; j < size; j++) {
                            d[j] = (Math.random() * 2 - 1) * Math.exp(-j / (size * 0.3));
                        }
                        crackle.buffer = buf;
                        const g = audioCtx.createGain();
                        g.gain.setValueAtTime(0.03 * (intensity / 5), now + i * 0.04);
                        g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.04 + 0.02);
                        crackle.connect(g);
                        g.connect(audioCtx.destination);
                        crackle.start(now + i * 0.04);
                        crackle.stop(now + i * 0.04 + 0.02);
                    }
                } catch (e) {}
            }

            // ---- Clear ----
            function clearFire() {
                flames = [];
                sparks = [];
                embers = [];
                isBreathing = false;
            }

            // ---- Reset ----
            function resetFire() {
                flames = [];
                sparks = [];
                embers = [];
                isBreathing = false;
                totalBreaths = 0;
                time = 0;
            }

            // ---- Render ----
            function render() {
                // Background
                const grad = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, W);
                grad.addColorStop(0, '#0d1a2a');
                grad.addColorStop(0.3, '#0a1520');
                grad.addColorStop(0.6, '#080e18');
                grad.addColorStop(0.8, '#060a12');
                grad.addColorStop(1, '#040608');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, W, H);
                
                // Stage
                ctx.fillStyle = 'rgba(20, 30, 40, 0.3)';
                ctx.fillRect(0, H - 60, W, 60);
                ctx.strokeStyle = 'rgba(100, 200, 255, 0.03)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(0, H - 60);
                ctx.lineTo(W, H - 60);
                ctx.stroke();
                
                // Draw embers (behind)
                embers = embers.filter(e => e.life > 0);
                for (let e of embers) {
                    e.update();
                    e.draw(ctx);
                }
                
                // Draw flames
                flames = flames.filter(f => f.isAlive());
                for (let f of flames) {
                    f.update();
                    f.draw(ctx);
                }
                
                // Draw sparks (on top)
                sparks = sparks.filter(s => s.life > 0);
                for (let s of sparks) {
                    s.update();
                    s.draw(ctx);
                }
                
                // Fire performer silhouette
                ctx.save();
                ctx.shadowBlur = 0;
                ctx.fillStyle = 'rgba(10, 15, 25, 0.5)';
                ctx.beginPath();
                ctx.arc(W/2, H - 80, 30, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = 'rgba(200, 180, 150, 0.05)';
                ctx.font = '20px monospace';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('🔥', W/2, H - 80);
                ctx.restore();
                
                // Status info
                ctx.save();
                ctx.shadowBlur = 0;
                ctx.fillStyle = 'rgba(200, 220, 240, 0.15)';
                ctx.font = '13px monospace';
                ctx.textAlign = 'right';
                ctx.textBaseline = 'bottom';
                ctx.fillText(`Flames: ${flames.length}`, W - 20, H - 10);
                
                ctx.textAlign = 'left';
                ctx.fillText(`Breaths: ${totalBreaths}`, 20, H - 10);
                ctx.restore();
            }

            // ---- Animation Loop ----
            function animate() {
                if (!isAnimating) {
                    requestAnimationFrame(animate);
                    return;
                }
                
                time += 0.01;
                
                render();
                
                requestAnimationFrame(animate);
            }

            // ---- Toggle Animation ----
            function toggleAnimation() {
                isAnimating = !isAnimating;
                toggleBtn.textContent = isAnimating ? '⏸️ PAUSE' : '▶️ PLAY';
            }

            // ---- Update Labels ----
            intensitySlider.addEventListener('input', function() {
                intensityLabel.textContent = this.value;
            });
            flamesSlider.addEventListener('input', function() {
                flamesLabel.textContent = this.value;
            });

            // ---- Event Listeners ----
            breatheBtn.addEventListener('click', breatheFire);
            resetBtn.addEventListener('click', resetFire);
            toggleBtn.addEventListener('click', toggleAnimation);

            // ---- Keyboard Shortcuts ----
            document.addEventListener('keydown', function(e) {
                if (e.key === ' ' || e.key === 'Space') {
                    e.preventDefault();
                    breatheFire();
                }
                if (e.key === 'r' || e.key === 'R') {
                    resetFire();
                }
                if (e.key === 'p' || e.key === 'P') {
                    toggleAnimation();
                }
            });

            // ---- Click on canvas to breathe ----
            canvas.addEventListener('click', function(e) {
                breatheFire();
            });

            // ---- Initialize ----
            render();
            animate();

            console.log('🔥 Fire Eater · Click Breathe or press Space to breathe flames!');
        })();
    </script>
</body>
</html>
