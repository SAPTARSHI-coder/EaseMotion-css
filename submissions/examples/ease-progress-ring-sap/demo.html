<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ease-progress-ring-sap demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 20px;
      align-items: center;
      justify-content: center;
      background: #f4f4f5;
      font-family: system-ui, sans-serif;
    }
    button {
      padding: 10px 18px;
      border-radius: 8px;
      border: none;
      background: #111;
      color: #fff;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="progress-ring-sap">
    <svg viewBox="0 0 140 140">
      <circle class="ring-bg" cx="70" cy="70" r="60"/>
      <circle class="ring-fill" id="ringFill" cx="70" cy="70" r="60"/>
    </svg>
    <div class="ring-label" id="ringLabel">0%</div>
  </div>

  <button id="randomBtn">Set Random Progress</button>

  <script>
    const ringFill = document.getElementById('ringFill');
    const ringLabel = document.getElementById('ringLabel');
    const radius = 60;
    const circumference = 2 * Math.PI * radius;

    ringFill.style.strokeDasharray = circumference;
    ringFill.style.strokeDashoffset = circumference;

    function setProgress(pct) {
      const offset = circumference - (pct / 100) * circumference;
      ringFill.style.strokeDashoffset = offset;
      ringLabel.textContent = pct + '%';
    }

    document.getElementById('randomBtn').addEventListener('click', () => {
      setProgress(Math.floor(Math.random() * 100));
    });

    setProgress(68);
  </script>

</body>
</html>
