<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ease-infinity-figure8 — Loader Demo</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { min-height: 100vh; background: var(--infinity-bg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3rem; font-family: system-ui, sans-serif; color: #e0e0ff; padding: 2rem; }
    h1 { font-size: 1.4rem; font-weight: 400; letter-spacing: 0.05em; }
    .demo-row { display: flex; gap: 3rem; align-items: center; flex-wrap: wrap; justify-content: center; }
    .demo-card { display: flex; flex-direction: column; align-items: center; gap: 0.75rem; }
    .demo-card span { font-size: 0.8rem; color: #8888cc; }
    .infinity-loader { width: var(--infinity-size); height: var(--infinity-size); position: relative; animation: infinity-path var(--infinity-duration) var(--infinity-ease) infinite, infinity-glow var(--infinity-duration) ease-in-out infinite; }
    .infinity-spinner { width: var(--infinity-size); height: var(--infinity-size); animation: infinity-spin var(--infinity-variant-spin) linear infinite; }
    .infinity-particle-path { width: var(--infinity-size-lg); height: var(--infinity-size-lg); animation: infinity-glow var(--infinity-duration) ease-in-out infinite; }
    .infinity-particle { offset-path: path('M80,40 C120,10 120,70 80,40 C40,10 40,70 80,40'); animation: infinity-particle 2s linear infinite; }
    .infinity-pulse { animation: infinity-pulse-scale var(--infinity-variant-pulse) ease-in-out infinite; }
    .infinity-dual { animation: infinity-dual-shift var(--infinity-variant-dual) ease-in-out infinite; }
    .infinity-ring { animation: infinity-pulse-ring var(--infinity-variant-pulse) ease-out infinite; }
    @media (prefers-color-scheme: light) { body { background: var(--infinity-bg); color: #1a1a3e; } }
  </style>
</head>
<body>
  <h1>ease-infinity-figure8 Loader</h1>
  <div class="demo-row">
    <div class="demo-card">
      <div class="infinity-loader">
        <svg class="infinity-spin" viewBox="0 0 160 80" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M80,40 C120,10 120,70 80,40 C40,10 40,70 80,40" stroke="var(--infinity-stroke)" stroke-width="4" stroke-linecap="round"/>
          <circle cx="80" cy="40" r="6" fill="var(--infinity-stroke-alt)"/>
        </svg>
      </div>
      <span>Path Animation</span>
    </div>
    <div class="demo-card">
      <div class="infinity-spinner infinity-pulse">
        <svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M60,15 C90,15 105,45 60,60 C15,45 30,15 60,15 C90,15 105,45 60,60" stroke="var(--infinity-stroke-alt)" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
          <path d="M60,15 C90,15 105,45 60,60 C15,45 30,15 60,15 C90,15 105,45 60,60" stroke="var(--infinity-stroke)" stroke-width="4" stroke-linecap="round"/>
        </svg>
      </div>
      <span>Pulse Spinner</span>
    </div>
    <div class="demo-card">
      <div class="infinity-particle-path infinity-dual">
        <svg viewBox="0 0 160 80" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M80,40 C120,10 120,70 80,40 C40,10 40,70 80,40" stroke="var(--infinity-stroke)" stroke-width="3" opacity="0.3"/>
          <circle class="infinity-particle" cx="0" cy="0" r="5" fill="var(--infinity-stroke-alt)"/>
        </svg>
      </div>
      <span>Particle Trace</span>
    </div>
    <div class="demo-card">
      <div class="infinity-pulse">
        <svg viewBox="0 0 120 120" width="120" height="120" fill="none">
          <circle cx="60" cy="60" r="40" stroke="var(--infinity-stroke)" stroke-width="3" opacity="0.2"/>
          <circle class="infinity-ring" cx="60" cy="60" r="40" stroke="var(--infinity-stroke-alt)" stroke-width="3" fill="none"/>
          <circle cx="60" cy="60" r="12" fill="var(--infinity-stroke)"/>
        </svg>
      </div>
      <span>Ripple Rings</span>
    </div>
  </div>
</body>
</html>
