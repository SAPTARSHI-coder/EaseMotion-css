
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Glassmorphism Tab Bar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <section class="demo">
            <h1>Dynamic Tab Bar</h1>
            <p>Glassmorphism tabs with a smooth active indicator.</p>

            <nav class="tab-bar" aria-label="Main navigation">
                <a href="#home" class="tab active">
                    <span class="icon">⌂</span>
                    <span>Home</span>
                </a>

                <a href="#explore" class="tab">
                    <span class="icon">⌕</span>
                    <span>Explore</span>
                </a>

                <a href="#projects" class="tab">
                    <span class="icon">▣</span>
                    <span>Projects</span>
                </a>

                <a href="#profile" class="tab">
                    <span class="icon">●</span>
                    <span>Profile</span>
                </a>
            </nav>
        </section>
    </main>

</body>
</html>
