<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Accessible Theme Switcher Pill · EaseMotion</title>
  <meta name="description" content="A polished theme switcher with smooth SVG icon morphing transitions and proper ARIA accessibility." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Demo Content -->
  <main class="demo-page">
    <div class="demo-header">
      <h1 class="demo-title">Theme Switcher</h1>
      <p class="demo-subtitle">Seamlessly toggle between Light and Dark modes with fluid SVG morphing.</p>
    </div>

    <!-- =========================================================
         THEME SWITCHER PILL
    ========================================================== -->
    <div class="theme-switcher-wrapper">
      <button 
        type="button" 
        class="theme-toggle" 
        id="theme-toggle" 
        role="switch" 
        aria-checked="false" 
        aria-label="Toggle Dark Theme"
      >
        <span class="theme-toggle__sr-only">Toggle Dark Theme</span>
        
        <!-- Track Background -->
        <span class="theme-toggle__track" aria-hidden="true">
          <!-- The Thumb Indicator -->
          <span class="theme-toggle__thumb">
            
            <!-- SVG Icon Morph (Sun -> Moon) -->
            <svg class="theme-toggle__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <!-- Sun Center / Moon Masked Circle -->
              <mask id="moon-mask">
                <rect x="0" y="0" width="100%" height="100%" fill="white" />
                <circle cx="24" cy="10" r="6" fill="black" class="moon-mask-circle" />
              </mask>
              <circle cx="12" cy="12" r="5" fill="currentColor" mask="url(#moon-mask)" class="sun-core" />
              
              <!-- Sun Rays -->
              <g class="sun-rays" stroke="currentColor">
                <line x1="12" y1="1" x2="12" y2="3" />
                <line x1="12" y1="21" x2="12" y2="23" />
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
                <line x1="1" y1="12" x2="3" y2="12" />
                <line x1="21" y1="12" x2="23" y2="12" />
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
              </g>
            </svg>

          </span>
        </span>
      </button>
      
      <span class="theme-label" aria-hidden="true" id="theme-label-text">Light Mode</span>
    </div>

  </main>

  <script src="script.js"></script>
</body>
</html>
