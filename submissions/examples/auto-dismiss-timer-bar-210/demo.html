<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
        name="description"
        content="Cyberpunk floating notification toast with auto-dismiss timer."
    >
    <title>Cyberpunk Floating Toast</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="page">
        <section class="hero">
            <span class="badge">SYSTEM ONLINE</span>

            <h1>Cyberpunk Toast</h1>

            <p>
                Floating notification with an auto-dismiss timer,
                neon effects and pause-on-hover interaction.
            </p>

            <button class="launch-btn" id="showToast">
                <span>Launch Notification</span>
                <span class="arrow">→</span>
            </button>
        </section>
    </main>

    <aside
        class="toast"
        id="toast"
        role="status"
        aria-live="polite"
        aria-hidden="true"
    >
        <div class="scan-line"></div>

        <div class="toast-icon">
            !
        </div>

        <div class="toast-content">
            <span class="toast-label">SYSTEM ALERT</span>

            <h2>Mission Updated</h2>

            <p>
                Your cyber operation has been synchronized successfully.
            </p>
        </div>

        <button
            class="close-btn"
            id="closeToast"
            type="button"
            aria-label="Close notification"
        >
            ×
        </button>

        <div class="timer-track">
            <div class="timer-bar" id="timerBar"></div>
        </div>
    </aside>

    <script>
        const toast = document.getElementById("toast");
        const showToast = document.getElementById("showToast");
        const closeToast = document.getElementById("closeToast");
        const timerBar = document.getElementById("timerBar");

        const duration = 6000;

        let startTime;
        let remaining = duration;
        let timerId;
        let paused = false;

        function openToast() {
            toast.classList.add("show");
            toast.setAttribute("aria-hidden", "false");

            remaining = duration;
            timerBar.style.transition = "none";
            timerBar.style.width = "100%";

            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    timerBar.style.transition =
                        `width ${duration}ms linear`;

                    timerBar.style.width = "0%";
                });
            });

            startTimer();
        }

        function closeNotification() {
            toast.classList.remove("show");
            toast.setAttribute("aria-hidden", "true");

            clearTimeout(timerId);
        }

        function startTimer() {
            clearTimeout(timerId);

            startTime = Date.now();

            timerId = setTimeout(() => {
                closeNotification();
            }, remaining);
        }

        function pauseTimer() {
            if (!toast.classList.contains("show") || paused) {
                return;
            }

            paused = true;

            const elapsed = Date.now() - startTime;
            remaining = Math.max(remaining - elapsed, 0);

            clearTimeout(timerId);

            const computedWidth =
                getComputedStyle(timerBar).width;

            const trackWidth =
                timerBar.parentElement.offsetWidth;

            const percentage =
                (parseFloat(computedWidth) / trackWidth) * 100;

            timerBar.style.transition = "none";
            timerBar.style.width = `${percentage}%`;
        }

        function resumeTimer() {
            if (!paused || remaining <= 0) {
                return;
            }

            paused = false;

            timerBar.style.transition =
                `width ${remaining}ms linear`;

            timerBar.style.width = "0%";

            startTimer();
        }

        showToast.addEventListener("click", () => {
            paused = false;
            openToast();
        });

        closeToast.addEventListener("click", closeNotification);

        toast.addEventListener("mouseenter", pauseTimer);
        toast.addEventListener("mouseleave", resumeTimer);

        toast.addEventListener("focusin", pauseTimer);
        toast.addEventListener("focusout", resumeTimer);
    </script>

</body>
</html>
