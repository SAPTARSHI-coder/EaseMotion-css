<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ink Trail Cursor · Fading Ink Trail</title>

    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <!-- === INK TRAIL CURSOR === -->
    <canvas id="inkCanvas"></canvas>

    <!-- === CONTENT === -->
    <div class="card">
        <h2>🖊️ Ink Trail Cursor</h2>
        <p class="sub">leaves an ink trail that fades</p>

        <div class="cursor-demo-area">
            <p>Move your mouse around</p>
            <div class="interactive-hint">
                <i class="fas fa-mouse-pointer"></i>
                <span>Watch the ink flow</span>
            </div>
            <div class="demo-buttons">
                <button class="demo-btn">Hover me</button>
                <button class="demo-btn">Click me</button>
                <button class="demo-btn">Ink!</button>
            </div>
        </div>

        <p style="margin-top: 1.5rem; font-size: 0.85rem; color: #64748b;">
            Move your mouse · watch the elegant ink trail fade
        </p>
    </div>

    <!-- Embedded JavaScript -->
    <script>
        (function() {
            'use strict';

            const canvas = document.getElementById('inkCanvas');
            const ctx = canvas.getContext('2d');

            let isDrawing = false;
            let lastX = 0;
            let lastY = 0;
            let mouseX = 0;
            let mouseY = 0;
            let points = [];
            let isVisible = false;

            // --- Resize canvas ---
            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            // --- Draw ink trail ---
            function drawInk() {
                // Clear canvas with fade
                ctx.fillStyle = 'rgba(10, 14, 26, 0.08)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Draw stored points
                for (let i = 0; i < points.length; i++) {
                    const p = points[i];
                    const alpha = p.life;
                    const size = p.size * p.life;

                    ctx.beginPath();
                    ctx.arc(p.x, p.y, size, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(20, 30, 50, ${alpha * 0.8})`;
                    ctx.fill();

                    // Ink glow
                    ctx.shadowColor = `rgba(40, 60, 100, ${alpha * 0.15})`;
                    ctx.shadowBlur = 20;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, size * 0.5, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(50, 80, 120, ${alpha * 0.3})`;
                    ctx.fill();
                    ctx.shadowBlur = 0;

                    // Update life
                    p.life -= 0.003;
                    p.size *= 0.998;
                }

                // Remove dead points
                points = points.filter(p => p.life > 0);

                // Draw current cursor dot
                if (isVisible) {
                    ctx.beginPath();
                    ctx.arc(mouseX, mouseY, 3, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(40, 60, 100, 0.9)';
                    ctx.fill();
                    ctx.shadowColor = 'rgba(40, 60, 100, 0.3)';
                    ctx.shadowBlur = 15;
                    ctx.beginPath();
                    ctx.arc(mouseX, mouseY, 6, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(40, 60, 100, 0.2)';
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }

                requestAnimationFrame(drawInk);
            }

            // --- Add point to trail ---
            function addPoint(x, y) {
                points.push({
                    x: x,
                    y: y,
                    life: 1,
                    size: 3 + Math.random() * 5
                });
            }

            // --- Mouse move ---
            document.addEventListener('mousemove', function(e) {
                mouseX = e.clientX;
                mouseY = e.clientY;
                isVisible = true;

                // Add trail points
                for (let i = 0; i < 3; i++) {
                    const offsetX = (Math.random() - 0.5) * 6;
                    const offsetY = (Math.random() - 0.5) * 6;
                    addPoint(mouseX + offsetX, mouseY + offsetY);
                }

                // Draw connecting line between points
                if (lastX !== 0 && lastY !== 0) {
                    const dist = Math.sqrt((mouseX - lastX) ** 2 + (mouseY - lastY) ** 2);
                    if (dist < 50) {
                        for (let i = 0; i < Math.floor(dist / 2); i++) {
                            const t = i / dist;
                            const x = lastX + (mouseX - lastX) * t;
                            const y = lastY + (mouseY - lastY) * t;
                            addPoint(x + (Math.random() - 0.5) * 4, y + (Math.random() - 0.5) * 4);
                        }
                    }
                }

                lastX = mouseX;
                lastY = mouseY;
            });

            // --- Touch support ---
            document.addEventListener('touchmove', function(e) {
                e.preventDefault();
                const touch = e.touches[0];
                mouseX = touch.clientX;
                mouseY = touch.clientY;
                isVisible = true;

                for (let i = 0; i < 3; i++) {
                    const offsetX = (Math.random() - 0.5) * 6;
                    const offsetY = (Math.random() - 0.5) * 6;
                    addPoint(mouseX + offsetX, mouseY + offsetY);
                }

                if (lastX !== 0 && lastY !== 0) {
                    const dist = Math.sqrt((mouseX - lastX) ** 2 + (mouseY - lastY) ** 2);
                    if (dist < 50) {
                        for (let i = 0; i < Math.floor(dist / 2); i++) {
                            const t = i / dist;
                            const x = lastX + (mouseX - lastX) * t;
                            const y = lastY + (mouseY - lastY) * t;
                            addPoint(x + (Math.random() - 0.5) * 4, y + (Math.random() - 0.5) * 4);
                        }
                    }
                }

                lastX = mouseX;
                lastY = mouseY;
            }, { passive: false });

            document.addEventListener('touchstart', function(e) {
                const touch = e.touches[0];
                mouseX = touch.clientX;
                mouseY = touch.clientY;
                isVisible = true;
                lastX = mouseX;
                lastY = mouseY;
            });

            // --- Mouse leave ---
            document.addEventListener('mouseleave', function() {
                isVisible = false;
                lastX = 0;
                lastY = 0;
            });

            // --- Mouse enter ---
            document.addEventListener('mouseenter', function() {
                isVisible = true;
            });

            // --- Click burst ---
            document.addEventListener('click', function(e) {
                const x = e.clientX;
                const y = e.clientY;

                for (let i = 0; i < 30; i++) {
                    const angle = Math.random() * 2 * Math.PI;
                    const dist = 20 + Math.random() * 60;
                    const px = x + Math.cos(angle) * dist;
                    const py = y + Math.sin(angle) * dist;
                    for (let j = 0; j < 3; j++) {
                        addPoint(px + (Math.random() - 0.5) * 10, py + (Math.random() - 0.5) * 10);
                    }
                }
                console.log('🖊️ Ink burst!');
            });

            // --- Hover effects ---
            const interactiveElements = document.querySelectorAll('a, button, .demo-btn, .interactive-hint');
            interactiveElements.forEach(el => {
                el.addEventListener('mouseenter', function() {
                    const rect = this.getBoundingClientRect();
                    const cx = rect.left + rect.width / 2;
                    const cy = rect.top + rect.height / 2;

                    for (let i = 0; i < 20; i++) {
                        const angle = Math.random() * 2 * Math.PI;
                        const dist = 15 + Math.random() * 40;
                        const px = cx + Math.cos(angle) * dist;
                        const py = cy + Math.sin(angle) * dist;
                        for (let j = 0; j < 2; j++) {
                            addPoint(px + (Math.random() - 0.5) * 8, py + (Math.random() - 0.5) * 8);
                        }
                    }
                });
            });

            // --- Start drawing ---
            drawInk();

            console.log('🖊️ Ink trail cursor initialized!');

        })();
    </script>

</body>
</html>
