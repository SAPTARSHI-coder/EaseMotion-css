<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Elastic-Slide Progress Bar - Minimalist Tech</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="layout-container">
        <header class="section-header">
            <h1 class="title">System Quotas</h1>
            <p class="subtitle">A minimalist tech progress bar featuring a bouncy elastic-slide filling animation.</p>
        </header>

        <div class="dashboard-area">
            
            <div class="card">
                <div class="card-header">
                    <h2>Storage Volume</h2>
                    <!-- Checkbox controls the animation state -->
                    <input type="checkbox" id="trigger-anim-1" class="trigger-checkbox">
                    <label for="trigger-anim-1" class="btn-trigger">Load Data</label>
                    
                    <div class="progress-section">
                        <div class="progress-info">
                            <span class="progress-label">SSD Cluster Alpha</span>
                            <span class="progress-value">72%</span>
                        </div>
                        
                        <div class="progress-track">
                            <div class="progress-fill elastic-slide" style="--target-width: 72%;"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card mt-4">
                <div class="card-header">
                    <h2>Compute Nodes</h2>
                    <input type="checkbox" id="trigger-anim-2" class="trigger-checkbox">
                    <label for="trigger-anim-2" class="btn-trigger">Load Data</label>
                    
                    <div class="progress-section">
                        <div class="progress-info">
                            <span class="progress-label">Active GPU Instances</span>
                            <span class="progress-value">95%</span>
                        </div>
                        
                        <div class="progress-track">
                            <div class="progress-fill elastic-slide color-purple" style="--target-width: 95%;"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card mt-4">
                <div class="card-header">
                    <h2>API Requests</h2>
                    <input type="checkbox" id="trigger-anim-3" class="trigger-checkbox">
                    <label for="trigger-anim-3" class="btn-trigger">Load Data</label>
                    
                    <div class="progress-section">
                        <div class="progress-info">
                            <span class="progress-label">Monthly Rate Limit</span>
                            <span class="progress-value">38%</span>
                        </div>
                        
                        <div class="progress-track">
                            <div class="progress-fill elastic-slide color-pink" style="--target-width: 38%;"></div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
