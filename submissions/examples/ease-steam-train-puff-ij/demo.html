<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-steam-train-puff demo</title>
</head>
<body>
<div class="st-app">
  <div class="st-sky">
    <span class="st-smoke st-smoke-1"></span>
    <span class="st-smoke st-smoke-2"></span>
    <span class="st-smoke st-smoke-3"></span>
  </div>
  <div class="st-train">
    <div class="st-chimney"></div>
    <div class="st-boiler">
      <div class="st-light"></div>
      <div class="st-band st-band-1"></div>
      <div class="st-band st-band-2"></div>
    </div>
    <div class="st-cab">
      <div class="st-window"></div>
      <div class="st-roof"></div>
    </div>
    <div class="st-wheel st-wheel-1"></div>
    <div class="st-wheel st-wheel-2"></div>
    <div class="st-wheel st-wheel-3"></div>
  </div>
  <div class="st-track">
    <div class="st-rail"></div>
    <div class="st-tie st-tie-1"></div>
    <div class="st-tie st-tie-2"></div>
  </div>
</div>
</body>
</html>
