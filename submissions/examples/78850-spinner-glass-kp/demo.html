<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Responsive Spinner Glassmorphism</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="glass-demo" aria-labelledby="spinner-title">
    <section class="glass-panel">
      <p class="eyebrow">Glassmorphism component</p>
      <h1 id="spinner-title">Responsive Spinner</h1>
      <p class="summary">A frosted loading indicator with rotating glass arcs, orbital particles, and adaptive status text.</p>
      <div class="spinner-card" role="status" aria-live="polite">
        <span class="spinner"><i></i><i></i><b></b><b></b><b></b></span>
        <strong>Syncing workspace</strong>
        <small>Preparing assets across regions</small>
      </div>
    </section>
  </main>
</body>
</html>
