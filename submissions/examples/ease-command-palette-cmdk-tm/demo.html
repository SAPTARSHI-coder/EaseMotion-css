<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Command Palette</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <p style="text-align:center;color:#64748b;font-size:0.875rem;margin-bottom:1rem;">
    Press <kbd style="background:#1a1d27;border:1px solid rgba(255,255,255,0.1);padding:2px 8px;border-radius:4px;">Ctrl+K</kbd> to open the command palette
  </p>

  <div class="cp-backdrop open">
    <div class="cp-palette">
      <div class="cp-search-wrap">
        <svg class="cp-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input class="cp-search" type="text" placeholder="Type a command or search..." autofocus>
        <div class="cp-kbd">
          <kbd>Esc</kbd>
        </div>
      </div>
      <div class="cp-results">
        <div class="cp-group-label">Navigation</div>
        <div class="cp-item selected">
          <div class="cp-item-icon">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
          </div>
          <div class="cp-item-content">
            <div class="cp-item-title">Go to Home</div>
            <div class="cp-item-desc">Navigate to the homepage</div>
          </div>
          <div class="cp-item-shortcut"><kbd>G</kbd><kbd>H</kbd></div>
        </div>
        <div class="cp-item">
          <div class="cp-item-icon">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
          </div>
          <div class="cp-item-content">
            <div class="cp-item-title">Go to Docs</div>
            <div class="cp-item-desc">Open documentation</div>
          </div>
          <div class="cp-item-shortcut"><kbd>G</kbd><kbd>D</kbd></div>
        </div>
        <div class="cp-group-label">Actions</div>
        <div class="cp-item">
          <div class="cp-item-icon">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
          </div>
          <div class="cp-item-content">
            <div class="cp-item-title">Copy Code</div>
            <div class="cp-item-desc">Copy code from any block</div>
          </div>
          <div class="cp-item-shortcut"><kbd>C</kbd></div>
        </div>
        <div class="cp-item">
          <div class="cp-item-icon">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M4.93 4.93a10 10 0 0 0 0 14.14"/></svg>
          </div>
          <div class="cp-item-content">
            <div class="cp-item-title">Toggle Theme</div>
            <div class="cp-item-desc">Switch between light and dark mode</div>
          </div>
          <div class="cp-item-shortcut"><kbd>T</kbd></div>
        </div>
      </div>
      <div class="cp-footer">
        <span><kbd>↑↓</kbd> Navigate</span>
        <span><kbd>↵</kbd> Select</span>
        <span>12 commands</span>
      </div>
    </div>
  </div>

</body>
</html>
