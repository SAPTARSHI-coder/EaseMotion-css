<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
        name="description"
        content="CSS-only animated gift box with shake and reveal effects"
    >
    <title>CSS Animated Gift Box</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="page">

    <header class="hero">
        <span class="eyebrow">EASEMOTION CSS</span>

        <h1>Animated Gift Box</h1>

        <p>
            A playful gift box animation created entirely with
            HTML and CSS. Hover or focus the gift to shake it
            and reveal the hidden message.
        </p>
    </header>

    <section class="gift-section" aria-labelledby="gift-title">

        <h2 id="gift-title">Your Gift</h2>

        <div class="gift-wrapper">

            <div
                class="gift"
                tabindex="0"
                role="button"
                aria-label="Animated gift box. Hover or focus to open the gift."
            >

                <div class="gift-lid">

                    <span class="lid-ribbon"></span>

                    <span class="lid-bow left"></span>
                    <span class="lid-bow right"></span>

                </div>

                <div class="gift-box">

                    <span class="box-ribbon"></span>

                    <div class="gift-content">
                        <span class="gift-icon" aria-hidden="true">
                            ★
                        </span>

                        <strong>Surprise!</strong>

                        <span>
                            You found a gift!
                        </span>
                    </div>

                </div>

            </div>

        </div>

        <p class="hint">
            Hover or focus the gift box to open it
        </p>

    </section>

</main>

<footer>
    <p>Built with pure HTML &amp; CSS · EaseMotion CSS</p>
</footer>

</body>
</html>
