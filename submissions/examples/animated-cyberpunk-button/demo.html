<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Cyberpunk Button</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="demo-wrapper">
        <header class="demo-header">
            <h1 class="cyber-title">Cyberpunk UI</h1>
            <p>A pure CSS, JavaScript-free animated button with classic cut-corners and dynamic drop-shadow neon glows.</p>
        </header>

        <section class="demo-grid">
            <div class="demo-cell">
                <button type="button" class="ease-btn-cyberpunk theme-cyan">
                    <span>Initialize</span>
                </button>
            </div>
            
            <div class="demo-cell">
                <button type="button" class="ease-btn-cyberpunk theme-magenta">
                    <span>Override</span>
                </button>
            </div>
            
            <div class="demo-cell">
                <button type="button" class="ease-btn-cyberpunk theme-yellow">
                    <span>Warning</span>
                </button>
            </div>
        </section>
    </main>
</body>
</html>
