<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="CSS Product Color Variant Selector - EaseMotion CSS"
  >
  <title>CSS Product Color Variant Selector</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="product-demo">
    <section class="product-card" aria-labelledby="product-title">

      <div class="product-visual">
        <div class="product-image">
          <div class="product-device" aria-hidden="true"></div>
        </div>
      </div>

      <div class="product-info">
        <p class="product-category">EaseMotion Collection</p>

        <h1 id="product-title">Aurora Headphones</h1>

        <p class="product-description">
          Premium wireless headphones with a comfortable design,
          immersive sound, and multiple color options.
        </p>

        <p class="product-price">$129.00</p>

        <fieldset class="color-selector">
          <legend>Choose a color</legend>

          <div class="color-options">

            <label class="color-option color-option--midnight">
              <input
                type="radio"
                name="product-color"
                value="midnight"
                checked
              >
              <span class="color-dot" aria-hidden="true"></span>
              <span class="sr-only">Midnight Black</span>
            </label>

            <label class="color-option color-option--snow">
              <input
                type="radio"
                name="product-color"
                value="snow"
              >
              <span class="color-dot" aria-hidden="true"></span>
              <span class="sr-only">Snow White</span>
            </label>

            <label class="color-option color-option--coral">
              <input
                type="radio"
                name="product-color"
                value="coral"
              >
              <span class="color-dot" aria-hidden="true"></span>
              <span class="sr-only">Coral</span>
            </label>

            <label class="color-option color-option--ocean">
              <input
                type="radio"
                name="product-color"
                value="ocean"
              >
              <span class="color-dot" aria-hidden="true"></span>
              <span class="sr-only">Ocean Blue</span>
            </label>

            <label class="color-option color-option--mint">
              <input
                type="radio"
                name="product-color"
                value="mint"
              >
              <span class="color-dot" aria-hidden="true"></span>
              <span class="sr-only">Mint Green</span>
            </label>

          </div>
        </fieldset>

        <button class="product-button" type="button">
          Add to Cart
        </button>
      </div>

    </section>
  </main>
</body>
</html>
