<!DOCTYPE html>
<html lang="en">
<head>

<link rel="stylesheet" href="./style.css">
<title>Gradient Wave Hero Demo</title>
</head>
<body>
<main class="gwh-container" role="main" aria-label="Gradient Wave Hero Visualizer">

        <span class="gwh-badge">V2.0 RELEASE</span>

      </div>
    </div>
  </div>
