<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ease Infinite Hexagonal Grid — Demo</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      align-items: stretch;
      justify-content: center;
      padding: 30px;
      box-sizing: border-box;
      background: #05070d;
      font-family: system-ui, sans-serif;
    }
    .demo-panel {
      width: 320px;
      height: 320px;
      border-radius: 18px;
      border: 1px solid #1e293b;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .demo-caption {
      position: relative;
      z-index: 1;
      color: #f5f7fa;
      font-size: 0.85rem;
      font-weight: 600;
      background: rgba(10, 15, 26, 0.6);
      padding: 8px 16px;
      border-radius: 999px;
      backdrop-filter: blur(6px);
    }
  </style>
</head>
<body>

  <div class="demo-panel">
    <div class="ease-hex-grid" style="position:absolute; inset:0; border-radius:18px;"></div>
    <span class="demo-caption">Default — drifting</span>
  </div>

  <div class="demo-panel">
    <div class="ease-hex-grid is-static" style="position:absolute; inset:0; border-radius:18px;"></div>
    <span class="demo-caption">Static variant</span>
  </div>

  <div class="demo-panel">
    <div class="ease-hex-grid has-glow" style="position:absolute; inset:0; border-radius:18px;"></div>
    <span class="demo-caption">With pulsing glow</span>
  </div>

</body>
</html>
