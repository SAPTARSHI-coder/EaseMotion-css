<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>Diamond Facet Edge Hover</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section class="showcase" aria-labelledby="title">
      <span class="eyebrow">CSS HOVER EFFECT</span>

      <h1 id="title">Diamond Facet Edge</h1>

      <p class="description">
        A lightweight geometric hover effect inspired by the sharp
        reflective facets of a diamond.
      </p>

      <div class="demo-grid">
        <a class="facet-card facet-blue" href="#">
          <span class="facet-glow"></span>
          <span class="facet-edge edge-top"></span>
          <span class="facet-edge edge-right"></span>
          <span class="facet-edge edge-bottom"></span>
          <span class="facet-edge edge-left"></span>

          <span class="card-content">
            <span class="card-icon">◇</span>
            <strong>Explore</strong>
            <small>Diamond Facet</small>
          </span>
        </a>

        <a class="facet-card facet-purple" href="#">
          <span class="facet-glow"></span>
          <span class="facet-edge edge-top"></span>
          <span class="facet-edge edge-right"></span>
          <span class="facet-edge edge-bottom"></span>
          <span class="facet-edge edge-left"></span>

          <span class="card-content">
            <span class="card-icon">◆</span>
            <strong>Discover</strong>
            <small>Sharp Geometry</small>
          </span>
        </a>

        <a class="facet-card facet-cyan" href="#">
          <span class="facet-glow"></span>
          <span class="facet-edge edge-top"></span>
          <span class="facet-edge edge-right"></span>
          <span class="facet-edge edge-bottom"></span>
          <span class="facet-edge edge-left"></span>

          <span class="card-content">
            <span class="card-icon">✦</span>
            <strong>Reveal</strong>
            <small>Reflective Edge</small>
          </span>
        </a>
      </div>
    </section>
  </main>
</body>
</html>
