<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ease File Drop Zone Demo</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
  <style>
    /* Demo Page Container Styling */
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #1e1e2f 0%, #0f0f16 100%);
      color: #ffffff;
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
      text-align: center;
      background: linear-gradient(135deg, #ffffff 0%, #a5b4fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p.description {
      color: rgba(255, 255, 255, 0.6);
      font-size: 1rem;
      margin-bottom: 2rem;
      text-align: center;
      max-width: 500px;
    }

    /* File List Preview Area */
    .file-list {
      margin-top: 1.5rem;
      width: 100%;
      max-height: 120px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .file-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      font-size: 0.85rem;
      border: 1px solid rgba(255, 255, 255, 0.08);
      animation: slideIn 0.3s ease forwards;
    }

    .file-item-name {
      font-weight: 500;
      color: rgba(255, 255, 255, 0.9);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 250px;
    }

    .file-item-size {
      color: rgba(255, 255, 255, 0.4);
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <h1>File Drop Zone</h1>
  <p class="description">A smooth drag-and-drop area with micro-animations and scale responses when dragging files.</p>

  <div class="drop-zone-container">
    <label class="drop-zone" id="dropZone">
      <input type="file" id="fileInput" multiple>
      
      <!-- Upload Icon (SVG) -->
      <svg class="drop-zone-icon" xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
        <polyline points="17 8 12 3 7 8"></polyline>
        <line x1="12" y1="3" x2="12" y2="15"></line>
      </svg>
      
      <span class="drop-zone-text">Drop files here or click to upload</span>
      <span class="drop-zone-subtext">Supports images, documents, and videos</span>
    </label>

    <!-- File list preview -->
    <div class="file-list" id="fileList"></div>
  </div>

  <script>
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const fileList = document.getElementById('fileList');

    // Prevent default drag behaviors
    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
      dropZone.addEventListener(eventName, preventDefaults, false);
      document.body.addEventListener(eventName, preventDefaults, false);
    });

    function preventDefaults(e) {
      e.preventDefault();
      e.stopPropagation();
    }

    // Highlight drop zone when item is dragged over it
    ['dragenter', 'dragover'].forEach(eventName => {
      dropZone.addEventListener(eventName, highlight, false);
    });

    ['dragleave', 'drop'].forEach(eventName => {
      dropZone.addEventListener(eventName, unhighlight, false);
    });

    function highlight() {
      dropZone.classList.add('drag-over');
    }

    function unhighlight() {
      dropZone.classList.remove('drag-over');
    }

    // Handle dropped files
    dropZone.addEventListener('drop', handleDrop, false);

    function handleDrop(e) {
      const dt = e.dataTransfer;
      const files = dt.files;
      handleFiles(files);
    }

    // Handle files selected via file input
    fileInput.addEventListener('change', function() {
      handleFiles(this.files);
    });

    function formatBytes(bytes, decimals = 2) {
      if (bytes === 0) return '0 Bytes';
      const k = 1024;
      const dm = decimals < 0 ? 0 : decimals;
      const sizes = ['Bytes', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(dm)) + ' ' + sizes[i];
    }

    function handleFiles(files) {
      if (files.length > 0) {
        dropZone.classList.add('file-selected');
        // Update subtext
        dropZone.querySelector('.drop-zone-subtext').innerText = `${files.length} file(s) selected`;
        
        // Populate file preview list
        fileList.innerHTML = '';
        Array.from(files).forEach(file => {
          const item = document.createElement('div');
          item.className = 'file-item';
          
          const nameSpan = document.createElement('span');
          nameSpan.className = 'file-item-name';
          nameSpan.textContent = file.name;
          
          const sizeSpan = document.createElement('span');
          sizeSpan.className = 'file-item-size';
          sizeSpan.textContent = formatBytes(file.size);
          
          item.appendChild(nameSpan);
          item.appendChild(sizeSpan);
          fileList.appendChild(item);
        });
      }
    }
  </script>
</body>
</html>
