<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Playhead Progress — Edge Cases</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="player">
    <div class="music-icon" aria-hidden="true">♫</div>

    <h1>Playhead Progress</h1>
    <p class="subtitle">Edge Case Demonstration</p>

    <section class="display">
      <span class="status" id="status">Ready</span>

      <h2 id="timeDisplay">0:00</h2>
      <p id="percentage">0%</p>

      <div
        class="progress-track"
        role="progressbar"
        aria-label="Audio playback progress"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="0"
        id="progressBar"
      >
        <span id="progressFill"></span>
      </div>

      <div class="duration">
        <span>0:00</span>
        <span id="durationDisplay">3:00</span>
      </div>
    </section>

    <label for="playhead">Playhead position</label>

    <input
      id="playhead"
      type="range"
      min="0"
      max="180"
      value="0"
      step="1"
      aria-label="Audio playhead position"
    />

    <div class="buttons">
      <button type="button" id="previous">−15s</button>
      <button type="button" id="next">+15s</button>
      <button type="button" id="reset">Reset</button>
    </div>

    <p class="note" id="note" aria-live="polite">
      Progress is safely clamped between 0% and 100%.
    </p>
  </main>

  <script>
    const playhead = document.querySelector("#playhead");
    const progressFill = document.querySelector("#progressFill");
    const progressBar = document.querySelector("#progressBar");
    const timeDisplay = document.querySelector("#timeDisplay");
    const percentage = document.querySelector("#percentage");
    const status = document.querySelector("#status");
    const next = document.querySelector("#next");
    const previous = document.querySelector("#previous");
    const reset = document.querySelector("#reset");

    const duration = 180;

    function calculateProgress(currentTime, totalDuration) {
      if (
        !Number.isFinite(currentTime) ||
        !Number.isFinite(totalDuration) ||
        totalDuration <= 0
      ) {
        return 0;
      }

      const progress = (currentTime / totalDuration) * 100;

      return Math.min(100, Math.max(0, progress));
    }

    function formatTime(seconds) {
      const safeSeconds = Math.max(0, Math.floor(seconds));
      const minutes = Math.floor(safeSeconds / 60);
      const remaining = safeSeconds % 60;

      return `${minutes}:${String(remaining).padStart(2, "0")}`;
    }

    function render() {
      const currentTime = Number(playhead.value);
      const progress = calculateProgress(currentTime, duration);

      progressFill.style.width = `${progress}%`;
      progressBar.setAttribute("aria-valuenow", String(progress));

      timeDisplay.textContent = formatTime(currentTime);
      percentage.textContent = `${Math.round(progress)}%`;

      if (progress === 0) {
        status.textContent = "Start";
      } else if (progress === 100) {
        status.textContent = "Complete";
      } else {
        status.textContent = "Playing";
      }
    }

    playhead.addEventListener("input", render);

    next.addEventListener("click", () => {
      playhead.value = String(
        Math.min(duration, Number(playhead.value) + 15)
      );
      render();
    });

    previous.addEventListener("click", () => {
      playhead.value = String(
        Math.max(0, Number(playhead.value) - 15)
      );
      render();
    });

    reset.addEventListener("click", () => {
      playhead.value = "0";
      render();
    });

    render();
  </script>
</body>
</html>
