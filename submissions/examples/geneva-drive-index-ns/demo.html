<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Geneva Drive Index — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Geneva Drive Index demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Geneva Drive Index</h1>
      <p class="lede">Geneva drive indexing a wheel in discrete steps</p>
    </header>

    <section class="ease-geneva-drive-index" data-demo="geneva-drive-index" aria-live="polite">
      <div class="ease-geneva-drive-index__housing">
        <div class="ease-geneva-drive-index__bezel">
          <div class="ease-geneva-drive-index__face">
            <div class="ease-geneva-drive-index__readout">
              <span class="ease-geneva-drive-index__label">Geneva Drive Index</span>
              <span class="ease-geneva-drive-index__value">LIVE</span>
            </div>
            <div class="ease-geneva-drive-index__motion" aria-hidden="true">
              <span class="ease-geneva-drive-index__a"></span>
              <span class="ease-geneva-drive-index__b"></span>
              <span class="ease-geneva-drive-index__c"></span>
              <span class="ease-geneva-drive-index__d"></span>
            </div>
            <div class="ease-geneva-drive-index__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-geneva-drive-index__controls">
          <button type="button" class="ease-geneva-drive-index__btn primary">Engage</button>
          <button type="button" class="ease-geneva-drive-index__btn">Reset</button>
          <label class="ease-geneva-drive-index__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-geneva-drive-index__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
