<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-rocket-launch-countdown demo</title>
</head>
<body>
<div class="rk-app">
  <span class="rk-title">LAUNCH CONTROL</span>
  <div class="rk-count">T-10</div>
  <div class="rk-pad">
    <span class="rk-smoke rk-smoke-1"></span>
    <span class="rk-smoke rk-smoke-2"></span>
    <span class="rk-smoke rk-smoke-3"></span>
    <div class="rk-rocket">
      <span class="rk-body"></span>
      <span class="rk-window"></span>
      <span class="rk-fin rk-fin-l"></span>
      <span class="rk-fin rk-fin-r"></span>
      <span class="rk-flame"></span>
    </div>
  </div>
</div>
</body>
</html>
