<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Particle Collider - EaseMotion CSS</title>
    <!-- Include EaseMotion Core Stylesheet -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #060913; color: #ffffff;">

    <div class="ease-card ease-card-glass collider-container">
        <div class="collider-header">
            <h2>Quantum Collider</h2>
            <span class="ease-badge ease-badge-primary">High Energy</span>
        </div>
        
        <div class="collider-screen ease-center">
            <div class="collider-ring ring-1">
                <div class="particle p-1"></div>
            </div>
            <div class="collider-ring ring-2">
                <div class="particle p-2"></div>
            </div>
            <div class="collider-nucleus ease-center"></div>
        </div>

        <div class="collider-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Beam: Stable</span>
            <button class="ease-btn ease-btn-primary ease-btn-sm ease-hover-grow">Inject Beam</button>
        </div>
    </div>

</body>
</html>
