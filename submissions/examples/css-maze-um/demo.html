<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Grid Maze - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Toggle Solution Input (Placed before target containers for CSS sibling matching) -->
  <input type="checkbox" id="solution-toggle" class="toggle-input">

  <div class="maze-cabinet">
    
    <header class="cabinet-header">
      <h1 class="title">CYBER LABYRINTH</h1>
      <p class="subtitle">8x8 CSS Grid Maze</p>
    </header>

    <!-- Controls -->
    <label for="solution-toggle" class="controls-container">
      <span class="toggle-label">Reveal Solution Path</span>
      <div class="toggle-switch"></div>
    </label>

    <!-- The 8x8 Grid Maze -->
    <div class="maze-grid" role="region" aria-label="8 by 8 Maze Grid">
      
      <!-- Row 1 -->
      <div class="cell start sol-path sp-1 w-top w-left w-right" tabindex="0" aria-label="Cell Row 1 Column 1, Start"></div>
      <div class="cell w-top w-bottom w-left" tabindex="0" aria-label="Cell Row 1 Column 2"></div>
      <div class="cell sol-path sp-7 w-top w-bottom w-right" tabindex="0" aria-label="Cell Row 1 Column 3"></div>
      <div class="cell sol-path sp-8 w-top w-bottom w-left" tabindex="0" aria-label="Cell Row 1 Column 4"></div>
      <div class="cell sol-path sp-9 w-top w-right w-left" tabindex="0" aria-label="Cell Row 1 Column 5"></div>
      <div class="cell w-top w-bottom w-left" tabindex="0" aria-label="Cell Row 1 Column 6"></div>
      <div class="cell w-top w-right" tabindex="0" aria-label="Cell Row 1 Column 7"></div>
      <div class="cell w-top w-left w-right" tabindex="0" aria-label="Cell Row 1 Column 8"></div>

      <!-- Row 2 -->
      <div class="cell sol-path sp-2 w-left w-right" tabindex="0" aria-label="Cell Row 2 Column 1"></div>
      <div class="cell w-top w-bottom w-left w-right" tabindex="0" aria-label="Cell Row 2 Column 2"></div>
      <div class="cell sol-path sp-6 w-left w-right" tabindex="0" aria-label="Cell Row 2 Column 3"></div>
      <div class="cell w-top w-left w-right" tabindex="0" aria-label="Cell Row 2 Column 4"></div>
      <div class="cell sol-path sp-10 w-left w-right" tabindex="0" aria-label="Cell Row 2 Column 5"></div>
      <div class="cell w-top w-bottom w-left" tabindex="0" aria-label="Cell Row 2 Column 6"></div>
      <div class="cell w-bottom w-right" tabindex="0" aria-label="Cell Row 2 Column 7"></div>
      <div class="cell w-left w-right" tabindex="0" aria-label="Cell Row 2 Column 8"></div>

      <!-- Row 3 -->
      <div class="cell sol-path sp-3 w-left w-bottom" tabindex="0" aria-label="Cell Row 3 Column 1"></div>
      <div class="cell sol-path sp-4 w-top w-bottom" tabindex="0" aria-label="Cell Row 3 Column 2"></div>
      <div class="cell sol-path sp-5 w-bottom w-right" tabindex="0" aria-label="Cell Row 3 Column 3"></div>
      <div class="cell w-bottom w-left" tabindex="0" aria-label="Cell Row 3 Column 4"></div>
      <div class="cell sol-path sp-11 w-right w-left" tabindex="0" aria-label="Cell Row 3 Column 5"></div>
      <div class="cell w-top w-bottom w-left w-right" tabindex="0" aria-label="Cell Row 3 Column 6"></div>
      <div class="cell w-top w-bottom w-left" tabindex="0" aria-label="Cell Row 3 Column 7"></div>
      <div class="cell w-bottom w-right" tabindex="0" aria-label="Cell Row 3 Column 8"></div>

      <!-- Row 4 -->
      <div class="cell w-top w-bottom w-left" tabindex="0" aria-label="Cell Row 4 Column 1"></div>
      <div class="cell w-top w-bottom w-right" tabindex="0" aria-label="Cell Row 4 Column 2"></div>
      <div class="cell w-top w-left" tabindex="0" aria-label="Cell Row 4 Column 3"></div>
      <div class="cell w-top w-bottom w-right" tabindex="0" aria-label="Cell Row 4 Column 4"></div>
      <div class="cell sol-path sp-12 w-bottom w-left" tabindex="0" aria-label="Cell Row 4 Column 5"></div>
      <div class="cell sol-path sp-13 w-top w-bottom w-right" tabindex="0" aria-label="Cell Row 4 Column 6"></div>
      <div class="cell w-top w-bottom w-left" tabindex="0" aria-label="Cell Row 4 Column 7"></div>
      <div class="cell w-top w-right" tabindex="0" aria-label="Cell Row 4 Column 8"></div>

      <!-- Row 5 -->
      <div class="cell w-top w-right w-left" tabindex="0" aria-label="Cell Row 5 Column 1"></div>
      <div class="cell w-top w-bottom w-left" tabindex="0" aria-label="Cell Row 5 Column 2"></div>
      <div class="cell w-bottom w-right" tabindex="0" aria-label="Cell Row 5 Column 3"></div>
      <div class="cell w-top w-left w-right" tabindex="0" aria-label="Cell Row 5 Column 4"></div>
      <div class="cell w-top w-bottom w-left" tabindex="0" aria-label="Cell Row 5 Column 5"></div>
      <div class="cell sol-path sp-14 w-top w-bottom" tabindex="0" aria-label="Cell Row 5 Column 6"></div>
      <div class="cell w-top w-bottom w-right" tabindex="0" aria-label="Cell Row 5 Column 7"></div>
      <div class="cell w-bottom w-left w-right" tabindex="0" aria-label="Cell Row 5 Column 8"></div>

      <!-- Row 6 -->
      <div class="cell w-bottom w-left w-right" tabindex="0" aria-label="Cell Row 6 Column 1"></div>
      <div class="cell w-top w-right" tabindex="0" aria-label="Cell Row 6 Column 2"></div>
      <div class="cell w-top w-bottom w-left" tabindex="0" aria-label="Cell Row 6 Column 3"></div>
      <div class="cell w-bottom w-right" tabindex="0" aria-label="Cell Row 6 Column 4"></div>
      <div class="cell w-top w-bottom w-left w-right" tabindex="0" aria-label="Cell Row 6 Column 5"></div>
      <div class="cell sol-path sp-15 w-top w-right" tabindex="0" aria-label="Cell Row 6 Column 6"></div>
      <div class="cell sol-path sp-16 w-top w-left w-bottom" tabindex="0" aria-label="Cell Row 6 Column 7"></div>
      <div class="cell w-top w-right" tabindex="0" aria-label="Cell Row 6 Column 8"></div>

      <!-- Row 7 -->
      <div class="cell w-top w-left" tabindex="0" aria-label="Cell Row 7 Column 1"></div>
      <div class="cell w-bottom w-right" tabindex="0" aria-label="Cell Row 7 Column 2"></div>
      <div class="cell w-top w-bottom w-left" tabindex="0" aria-label="Cell Row 7 Column 3"></div>
      <div class="cell w-top w-right" tabindex="0" aria-label="Cell Row 7 Column 4"></div>
      <div class="cell w-top w-bottom w-left" tabindex="0" aria-label="Cell Row 7 Column 5"></div>
      <div class="cell w-bottom w-right" tabindex="0" aria-label="Cell Row 7 Column 6"></div>
      <div class="cell sol-path sp-17 w-top w-bottom w-left w-right" tabindex="0" aria-label="Cell Row 7 Column 7"></div>
      <div class="cell w-bottom w-right" tabindex="0" aria-label="Cell Row 7 Column 8"></div>

      <!-- Row 8 -->
      <div class="cell w-bottom w-left w-right" tabindex="0" aria-label="Cell Row 8 Column 1"></div>
      <div class="cell w-top w-bottom w-left" tabindex="0" aria-label="Cell Row 8 Column 2"></div>
      <div class="cell w-top w-bottom w-right" tabindex="0" aria-label="Cell Row 8 Column 3"></div>
      <div class="cell w-top w-bottom w-left" tabindex="0" aria-label="Cell Row 8 Column 4"></div>
      <div class="cell w-top w-bottom w-right" tabindex="0" aria-label="Cell Row 8 Column 5"></div>
      <div class="cell w-top w-bottom w-left" tabindex="0" aria-label="Cell Row 8 Column 6"></div>
      <div class="cell w-top w-bottom w-right" tabindex="0" aria-label="Cell Row 8 Column 7"></div>
      <div class="cell end sol-path sp-18 w-top w-bottom w-left w-right" tabindex="0" aria-label="Cell Row 8 Column 8, End"></div>

    </div>

  </div>

</body>
</html>
