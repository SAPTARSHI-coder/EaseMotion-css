<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Product Rating Summary | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="rating-demo-container">
    
    <!-- Product Rating Summary Card -->
    <article class="ease-rating-card" aria-label="Customer Reviews and Rating Summary">
      
      <h2 class="ease-rating-header">Customer Reviews</h2>

      <!-- Overall Rating Overview -->
      <div class="ease-rating-overview">
        <div class="ease-rating-score-box">
          <span class="ease-rating-score" aria-label="4.8 out of 5 stars">4.8</span>
          <span class="ease-rating-max">out of 5.0</span>
        </div>

        <div class="ease-rating-meta">
          <div class="ease-stars-display" aria-hidden="true">
            <svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
            <svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
            <svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
            <svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
            <svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
          </div>
          <p class="ease-rating-count">Based on 1,284 global ratings</p>
        </div>
      </div>

      <!-- Star Distribution Breakdown Bars -->
      <div class="ease-rating-bars" role="region" aria-label="Rating distribution breakdown">
        
        <!-- 5 Star -->
        <div class="ease-bar-row">
          <div class="ease-bar-label">
            <span>5</span>
            <svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
          </div>
          <div class="ease-bar-track" role="progressbar" aria-valuenow="78" aria-valuemin="0" aria-valuemax="100" aria-label="78 percent 5-star reviews">
            <div class="ease-bar-fill"></div>
          </div>
          <span class="ease-bar-percentage">78%</span>
        </div>

        <!-- 4 Star -->
        <div class="ease-bar-row">
          <div class="ease-bar-label">
            <span>4</span>
            <svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
          </div>
          <div class="ease-bar-track" role="progressbar" aria-valuenow="15" aria-valuemin="0" aria-valuemax="100" aria-label="15 percent 4-star reviews">
            <div class="ease-bar-fill"></div>
          </div>
          <span class="ease-bar-percentage">15%</span>
        </div>

        <!-- 3 Star -->
        <div class="ease-bar-row">
          <div class="ease-bar-label">
            <span>3</span>
            <svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
          </div>
          <div class="ease-bar-track" role="progressbar" aria-valuenow="5" aria-valuemin="0" aria-valuemax="100" aria-label="5 percent 3-star reviews">
            <div class="ease-bar-fill"></div>
          </div>
          <span class="ease-bar-percentage">5%</span>
        </div>

        <!-- 2 Star -->
        <div class="ease-bar-row">
          <div class="ease-bar-label">
            <span>2</span>
            <svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
          </div>
          <div class="ease-bar-track" role="progressbar" aria-valuenow="1" aria-valuemin="0" aria-valuemax="100" aria-label="1 percent 2-star reviews">
            <div class="ease-bar-fill"></div>
          </div>
          <span class="ease-bar-percentage">1%</span>
        </div>

        <!-- 1 Star -->
        <div class="ease-bar-row">
          <div class="ease-bar-label">
            <span>1</span>
            <svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
          </div>
          <div class="ease-bar-track" role="progressbar" aria-valuenow="1" aria-valuemin="0" aria-valuemax="100" aria-label="1 percent 1-star reviews">
            <div class="ease-bar-fill"></div>
          </div>
          <span class="ease-bar-percentage">1%</span>
        </div>

      </div>

    </article>

  </main>

</body>
</html>
