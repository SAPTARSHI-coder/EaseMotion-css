<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Retro Nixie Tube Clock</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="container">
  <h1>Retro Nixie Tube Clock</h1>

  <div class="clock">

    <div class="tube">
      <div class="glass"></div>
      <span>1</span>
      <div class="mesh"></div>
    </div>

    <div class="tube">
      <div class="glass"></div>
      <span>2</span>
      <div class="mesh"></div>
    </div>

    <div class="colon"></div>

    <div class="tube">
      <div class="glass"></div>
      <span>4</span>
      <div class="mesh"></div>
    </div>

    <div class="tube">
      <div class="glass"></div>
      <span>8</span>
      <div class="mesh"></div>
    </div>

  </div>

  <p class="caption">
    Pure HTML & CSS • Vintage Nixie Tube Display
  </p>
</div>

</body>
</html>
