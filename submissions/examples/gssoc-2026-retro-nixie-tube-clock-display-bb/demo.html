<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retro Nixie Tube Clock Display - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="nixie-container">
    <header class="nixie-header">
      <span class="badge">GSSoC 2026 Component</span>
      <h1>Retro Nixie Tube Clock Display</h1>
      <p>Vintage steampunk warm-orange neon gas discharge tube clock component with wire mesh grid overlay and glass reflection.</p>
    </header>

    <div class="nixie-card" tabindex="0">
      <div class="clock-housing">
        <!-- Hours -->
        <div class="nixie-tube">
          <div class="mesh-overlay"></div>
          <span class="digit glow-orange">1</span>
        </div>
        <div class="nixie-tube">
          <div class="mesh-overlay"></div>
          <span class="digit glow-orange">0</span>
        </div>

        <div class="tube-colon">:</div>

        <!-- Minutes -->
        <div class="nixie-tube">
          <div class="mesh-overlay"></div>
          <span class="digit glow-orange">4</span>
        </div>
        <div class="nixie-tube">
          <div class="mesh-overlay"></div>
          <span class="digit glow-orange">2</span>
        </div>

        <div class="tube-colon">:</div>

        <!-- Seconds -->
        <div class="nixie-tube">
          <div class="mesh-overlay"></div>
          <span class="digit glow-orange pulse-digit">5</span>
        </div>
        <div class="nixie-tube">
          <div class="mesh-overlay"></div>
          <span class="digit glow-orange pulse-digit">8</span>
        </div>
      </div>

      <div class="housing-base">
        <span class="brand-plate">NIXIE-CHRONO V2.6</span>
      </div>
    </div>
  </div>
</body>
</html>
