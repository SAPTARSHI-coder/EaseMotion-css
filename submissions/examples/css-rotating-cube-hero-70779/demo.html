<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Rotating Cube Hero</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="hero-container" role="region" aria-label="Interactive 3D Hero">
    <div class="scene">
      <div class="cube">
        <div class="cube-face cube-face--front">
          <h2>Welcome</h2>
          <p>Discover modern CSS.</p>
        </div>
        <div class="cube-face cube-face--back">
          <h2>Innovation</h2>
          <p>Pushing the web forward.</p>
        </div>
        <div class="cube-face cube-face--right">
          <h2>Performance</h2>
          <p>Zero JavaScript required.</p>
        </div>
        <div class="cube-face cube-face--left">
          <h2>Design</h2>
          <p>Beautiful interfaces.</p>
        </div>
        <div class="cube-face cube-face--top">
          <h2>Future</h2>
          <p>The next generation.</p>
        </div>
        <div class="cube-face cube-face--bottom">
          <h2>Code</h2>
          <p>Clean and maintainable.</p>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
