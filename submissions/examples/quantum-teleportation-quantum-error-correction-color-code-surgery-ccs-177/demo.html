<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Code Surgery CCS - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css"></head><body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030712; color: #ffffff;">

    <div class="ease-card ease-card-glass ccs-container">
        <div class="ccs-header">
            <h2>Color Code Surgery</h2>
            <span class="ease-badge ease-badge-success">Fault-Tolerant Quantum</span>
        </div>
        
        <div class="ccs-screen ease-center">
            <div class="ccs-flux flux-ccs-a"></div>
            <div class="ccs-flux flux-ccs-b"></div>
            <div class="ccs-boundary-ring"></div>
            <div class="ccs-core ease-center"></div>
        </div>

        <div class="ccs-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Triangular Lattice Transversals &amp; Color Patch Splitting</span>
            <button class="ease-btn ease-btn-success ease-btn-sm ease-hover-grow">Run Color Surgery</button>
        </div>
    </div></body></html>
