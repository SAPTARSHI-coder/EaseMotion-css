<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>Holographic Flicker Rating</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section class="rating-card" aria-labelledby="rating-title">
      <p class="eyebrow">Rating &amp; Feedback</p>
      <h1 id="rating-title">Holographic Flicker Rating</h1>
      <p class="description">
        A pure CSS rating component with a colorful holographic flicker effect.
      </p>

      <div class="rating" role="radiogroup" aria-label="Rate your experience">
        <input type="radio" id="star-5" name="rating" value="5">
        <label for="star-5" title="5 stars" aria-label="5 stars">★</label>

        <input type="radio" id="star-4" name="rating" value="4">
        <label for="star-4" title="4 stars" aria-label="4 stars">★</label>

        <input type="radio" id="star-3" name="rating" value="3">
        <label for="star-3" title="3 stars" aria-label="3 stars">★</label>

        <input type="radio" id="star-2" name="rating" value="2">
        <label for="star-2" title="2 stars" aria-label="2 stars">★</label>

        <input type="radio" id="star-1" name="rating" value="1">
        <label for="star-1" title="1 star" aria-label="1 star">★</label>
      </div>

      <p class="hint">Choose a rating from 1 to 5</p>
    </section>
  </main>
</body>
</html>
