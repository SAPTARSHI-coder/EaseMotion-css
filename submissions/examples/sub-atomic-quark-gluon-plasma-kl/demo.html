<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sub-Atomic Quark-Gluon Plasma - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #05010a; color: #ffffff;">

    <div class="ease-card ease-card-glass qgp-container">
        <div class="qgp-header">
            <h2>Quark-Gluon Plasma</h2>
            <span class="ease-badge ease-badge-danger">Deconfined</span>
        </div>
        
        <div class="qgp-screen ease-center">
            <div class="gluon-field field-1"></div>
            <div class="gluon-field field-2"></div>
            <div class="color-charge-ring"></div>
            <div class="quark-cluster-core ease-center"></div>
        </div>

        <div class="qgp-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Density: 10^15 g/cm³</span>
            <button class="ease-btn ease-btn-primary ease-btn-sm ease-hover-grow">Thermalize</button>
        </div>
    </div>

</body>
</html>
