<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Kaleidoscope Background</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 
      [TECHNIQUE] The Kaleidoscope Background
      Instead of calculating complex SVG polygons or trying to clip exact 60-degree segments,
      we layer multiple squares on top of each other. Each square contains the exact same 
      highly complex repeating gradient. 
      By rotating the squares at different angles (0, 45, 90) and animating their spins 
      at different speeds and directions, while using `mix-blend-mode: difference`, 
      we mathematically generate a perfect, infinitely shifting kaleidoscope pattern.
    -->
    <div class="kaleidoscope-container" aria-hidden="true">
        <div class="k-layer layer-1"></div>
        <div class="k-layer layer-2"></div>
        <div class="k-layer layer-3"></div>
        <div class="k-layer layer-4"></div>
    </div>

    <!-- Foreground Content -->
    <main class="content-overlay">
        <h1 class="hero-title">Kaleidoscope</h1>
        <p class="hero-subtitle">A purely CSS-animated optical illusion utilizing repeating gradients and blend modes.</p>
    </main>

</body>
</html>
