<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Pure CSS morphing menu button with hamburger, close and back states."
    >

    <title>CSS Morphing Menu Button</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="demo-page">

        <section class="demo-card" aria-labelledby="demo-title">

            <header class="demo-header">
                <p class="eyebrow">EaseMotion CSS</p>

                <h1 id="demo-title">
                    Morphing Menu Button
                </h1>

                <p class="description">
                    A pure CSS menu control that smoothly transforms
                    between hamburger, close and back visual states.
                </p>
            </header>

            <!-- CSS-only state controls -->
            <div class="state-controls" aria-label="Menu button states">

                <input
                    type="radio"
                    name="menu-state"
                    id="state-menu"
                    checked
                >

                <label for="state-menu">
                    Menu
                </label>

                <input
                    type="radio"
                    name="menu-state"
                    id="state-close"
                >

                <label for="state-close">
                    Close
                </label>

                <input
                    type="radio"
                    name="menu-state"
                    id="state-back"
                >

                <label for="state-back">
                    Back
                </label>

            </div>

            <!-- Morphing control -->
            <div class="preview">

                <div class="morph-wrapper">

                    <div class="menu-state menu-state--menu">
                        <span class="sr-only">Menu</span>

                        <span class="bar bar-top"></span>
                        <span class="bar bar-middle"></span>
                        <span class="bar bar-bottom"></span>
                    </div>

                    <div class="menu-state menu-state--close">
                        <span class="sr-only">Close</span>

                        <span class="bar bar-top"></span>
                        <span class="bar bar-middle"></span>
                        <span class="bar bar-bottom"></span>
                    </div>

                    <div class="menu-state menu-state--back">
                        <span class="sr-only">Back</span>

                        <span class="bar bar-top"></span>
                        <span class="bar bar-middle"></span>
                        <span class="bar bar-bottom"></span>
                    </div>

                </div>

            </div>

            <footer class="demo-footer">
                <span>Pure HTML &amp; CSS</span>
                <span aria-hidden="true">•</span>
                <span>No JavaScript</span>
                <span aria-hidden="true">•</span>
                <span>Responsive</span>
            </footer>

        </section>

    </main>

</body>
</html>
