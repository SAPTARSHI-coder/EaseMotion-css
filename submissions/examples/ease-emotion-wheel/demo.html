<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Emotion Wheel · Emoji Orbit Selector</title>

    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <div class="card">
        <h2>😊 Emotion Wheel</h2>
        <p class="sub">emojis orbit and select on click</p>

        <!-- === EMOTION WHEEL === -->
        <div class="wheel-container" id="wheelContainer">
            <div class="emotion-wheel" id="emotionWheel">
                <!-- Center -->
                <button class="wheel-center" id="wheelCenter" aria-label="Toggle emotion wheel">
                    <span class="center-emoji" id="centerEmoji">😊</span>
                    <span class="center-label">Mood</span>
                </button>

                <!-- Emotion items -->
                <div class="emotion-item" data-emotion="happy" data-angle="0">
                    <button class="emotion-btn" data-tooltip="Happy">
                        <span class="emoji">😊</span>
                    </button>
                </div>
                <div class="emotion-item" data-emotion="excited" data-angle="45">
                    <button class="emotion-btn" data-tooltip="Excited">
                        <span class="emoji">🤩</span>
                    </button>
                </div>
                <div class="emotion-item" data-emotion="love" data-angle="90">
                    <button class="emotion-btn" data-tooltip="Love">
                        <span class="emoji">❤️</span>
                    </button>
                </div>
                <div class="emotion-item" data-emotion="calm" data-angle="135">
                    <button class="emotion-btn" data-tooltip="Calm">
                        <span class="emoji">😌</span>
                    </button>
                </div>
                <div class="emotion-item" data-emotion="sad" data-angle="180">
                    <button class="emotion-btn" data-tooltip="Sad">
                        <span class="emoji">😢</span>
                    </button>
                </div>
                <div class="emotion-item" data-emotion="angry" data-angle="225">
                    <button class="emotion-btn" data-tooltip="Angry">
                        <span class="emoji">😡</span>
                    </button>
                </div>
                <div class="emotion-item" data-emotion="surprised" data-angle="270">
                    <button class="emotion-btn" data-tooltip="Surprised">
                        <span class="emoji">😮</span>
                    </button>
                </div>
                <div class="emotion-item" data-emotion="tired" data-angle="315">
                    <button class="emotion-btn" data-tooltip="Tired">
                        <span class="emoji">😴</span>
                    </button>
                </div>
            </div>

            <!-- Selected emotion display -->
            <div class="selected-display" id="selectedDisplay">
                <span class="selected-emoji" id="selectedEmoji">😊</span>
                <span class="selected-name" id="selectedName">Happy</span>
            </div>
        </div>

        <p style="margin-top: 2rem; font-size: 0.85rem; color: #64748b;">
            Click center to open · select an emotion
        </p>
    </div>

    <!-- Embedded JavaScript -->
    <script>
        (function() {
            'use strict';

            const container = document.getElementById('wheelContainer');
            const wheel = document.getElementById('emotionWheel');
            const center = document.getElementById('wheelCenter');
            const centerEmoji = document.getElementById('centerEmoji');
            const selectedEmoji = document.getElementById('selectedEmoji');
            const selectedName = document.getElementById('selectedName');
            const emotionItems = document.querySelectorAll('.emotion-item');
            const emotionBtns = document.querySelectorAll('.emotion-btn');

            let isOpen = false;
            let selectedEmotion = 'happy';
            let currentAngle = 0;
            let isDragging = false;
            let startAngle = 0;
            let dragAngle = 0;

            const emotions = {
                happy: { emoji: '😊', name: 'Happy' },
                excited: { emoji: '🤩', name: 'Excited' },
                love: { emoji: '❤️', name: 'Love' },
                calm: { emoji: '😌', name: 'Calm' },
                sad: { emoji: '😢', name: 'Sad' },
                angry: { emoji: '😡', name: 'Angry' },
                surprised: { emoji: '😮', name: 'Surprised' },
                tired: { emoji: '😴', name: 'Tired' }
            };

            // --- Toggle wheel ---
            function toggleWheel() {
                isOpen = !isOpen;
                container.classList.toggle('is-open', isOpen);
                center.classList.toggle('is-active', isOpen);

                if (isOpen) {
                    center.querySelector('.center-label').textContent = 'Close';
                } else {
                    center.querySelector('.center-label').textContent = 'Mood';
                }

                console.log(`😊 Emotion wheel ${isOpen ? 'opened' : 'closed'}`);
            }

            // --- Select emotion ---
            function selectEmotion(emotionKey) {
                selectedEmotion = emotionKey;
                const emotion = emotions[emotionKey];
                if (emotion) {
                    centerEmoji.textContent = emotion.emoji;
                    selectedEmoji.textContent = emotion.emoji;
                    selectedName.textContent = emotion.name;

                    // Update active state
                    emotionItems.forEach(item => {
                        item.classList.toggle('active', item.dataset.emotion === emotionKey);
                    });

                    console.log(`😊 Emotion selected: ${emotion.name}`);
                }

                // Close wheel after selection
                if (isOpen) {
                    setTimeout(() => {
                        toggleWheel();
                    }, 400);
                }
            }

            // --- Get emotion from angle ---
            function getEmotionFromAngle(angle) {
                const normalized = ((angle % 360) + 360) % 360;
                const items = document.querySelectorAll('.emotion-item');
                let closest = items[0];
                let minDiff = 360;

                items.forEach(item => {
                    const itemAngle = parseFloat(item.dataset.angle);
                    let diff = Math.abs(normalized - itemAngle);
                    if (diff > 180) diff = 360 - diff;
                    if (diff < minDiff) {
                        minDiff = diff;
                        closest = item;
                    }
                });

                return closest.dataset.emotion;
            }

            // --- Update wheel rotation ---
            function updateWheelRotation(angle) {
                wheel.style.transform = `rotate(${angle}deg)`;
                // Counter-rotate items so they stay upright
                emotionItems.forEach(item => {
                    item.style.transform = `rotate(${-angle}deg)`;
                });
            }

            // --- Event Listeners ---

            // Center button
            center.addEventListener('click', function(e) {
                e.stopPropagation();
                toggleWheel();
                this.classList.add('click-pulse');
                setTimeout(() => {
                    this.classList.remove('click-pulse');
                }, 300);
            });

            // Emotion buttons
            emotionBtns.forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const item = this.closest('.emotion-item');
                    const emotion = item.dataset.emotion;
                    selectEmotion(emotion);
                    this.classList.add('clicked');
                    setTimeout(() => {
                        this.classList.remove('clicked');
                    }, 300);
                });

                // Keyboard accessibility
                btn.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        this.click();
                    }
                    if (e.key === 'Escape') {
                        if (isOpen) toggleWheel();
                    }
                });
            });

            // --- Drag to rotate ---
            wheel.addEventListener('mousedown', function(e) {
                if (!isOpen) return;
                isDragging = true;
                const rect = this.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;
                startAngle = Math.atan2(e.clientY - centerY, e.clientX - centerX) * (180 / Math.PI);
                this.style.cursor = 'grabbing';
            });

            document.addEventListener('mousemove', function(e) {
                if (!isDragging || !isOpen) return;
                const rect = wheel.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;
                const currentAngle = Math.atan2(e.clientY - centerY, e.clientX - centerX) * (180 / Math.PI);
                let diff = currentAngle - startAngle;
                dragAngle += diff;
                startAngle = currentAngle;
                currentAngle = dragAngle;
                updateWheelRotation(currentAngle);
            });

            document.addEventListener('mouseup', function() {
                if (isDragging) {
                    isDragging = false;
                    wheel.style.cursor = 'grab';
                    // Snap to nearest emotion
                    const emotion = getEmotionFromAngle(dragAngle);
                    // Align emotion to top
                    const targetAngle = -parseFloat(document.querySelector(`.emotion-item[data-emotion="${emotion}"]`).dataset.angle);
                    dragAngle = targetAngle;
                    updateWheelRotation(dragAngle);
                }
            });

            // --- Touch support ---
            let touchStartAngle = 0;
            let touchDragAngle = 0;

            wheel.addEventListener('touchstart', function(e) {
                if (!isOpen) return;
                const touch = e.touches[0];
                const rect = this.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;
                touchStartAngle = Math.atan2(touch.clientY - centerY, touch.clientX - centerX) * (180 / Math.PI);
                touchDragAngle = dragAngle;
            }, { passive: true });

            document.addEventListener('touchmove', function(e) {
                if (!isOpen) return;
                const touch = e.touches[0];
                const rect = wheel.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;
                const currentAngle = Math.atan2(touch.clientY - centerY, touch.clientX - centerX) * (180 / Math.PI);
                let diff = currentAngle - touchStartAngle;
                dragAngle = touchDragAngle + diff;
                updateWheelRotation(dragAngle);
            }, { passive: true });

            document.addEventListener('touchend', function() {
                if (isOpen) {
                    const emotion = getEmotionFromAngle(dragAngle);
                    const targetAngle = -parseFloat(document.querySelector(`.emotion-item[data-emotion="${emotion}"]`).dataset.angle);
                    dragAngle = targetAngle;
                    updateWheelRotation(dragAngle);
                }
            });

            // --- Click outside to close ---
            document.addEventListener('click', function(e) {
                if (isOpen && !container.contains(e.target)) {
                    toggleWheel();
                }
            });

            // --- Keyboard shortcuts ---
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && isOpen) {
                    toggleWheel();
                    center.focus();
                }
                // Number keys 1-8 to select emotions
                const num = parseInt(e.key);
                if (num >= 1 && num <= 8 && isOpen) {
                    const items = document.querySelectorAll('.emotion-item');
                    if (items[num - 1]) {
                        const emotion = items[num - 1].dataset.emotion;
                        selectEmotion(emotion);
                    }
                }
            });

            // --- Auto-open on load for demo ---
            setTimeout(() => {
                toggleWheel();
                setTimeout(() => {
                    toggleWheel();
                }, 3000);
            }, 500);

            // --- Initial selection ---
            selectEmotion('happy');

            console.log('😊 Emotion wheel initialized!');

        })();
    </script>

</body>
</html>
