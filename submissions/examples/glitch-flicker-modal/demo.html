<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Glitch-Flicker Modal — SaaS Showcase</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="showcase">
    <a href="#glitch-modal" class="trigger-btn">ACCESS CRITICAL NODE</a>

    <div id="glitch-modal" class="modal-overlay">
      <div class="modal-card">
        <div class="header-glitch">[ WARNING ] PROTOCOL OVERRIDE</div>
        <h2>System Override Request</h2>
        <p>You are requesting elevated access to root cloud infrastructure. Proceed with caution.</p>
        <div class="actions">
          <a href="#" class="btn-abort">ABORT</a>
          <a href="#" class="btn-proceed">AUTHENTICATE</a>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
