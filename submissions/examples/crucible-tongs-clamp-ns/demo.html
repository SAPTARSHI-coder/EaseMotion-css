<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crucible Tongs Clamp — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Crucible Tongs Clamp demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Crucible Tongs Clamp</h1>
      <p class="lede">Crucible tongs clamping then lifting a hot vessel</p>
    </header>

    <section class="ease-crucible-tongs-clamp" data-demo="crucible-tongs-clamp" aria-live="polite">
      <div class="ease-crucible-tongs-clamp__housing">
        <div class="ease-crucible-tongs-clamp__bezel">
          <div class="ease-crucible-tongs-clamp__face">
            <div class="ease-crucible-tongs-clamp__readout">
              <span class="ease-crucible-tongs-clamp__label">Crucible Tongs Clamp</span>
              <span class="ease-crucible-tongs-clamp__value">LIVE</span>
            </div>
            <div class="ease-crucible-tongs-clamp__motion" aria-hidden="true">
              <span class="ease-crucible-tongs-clamp__a"></span>
              <span class="ease-crucible-tongs-clamp__b"></span>
              <span class="ease-crucible-tongs-clamp__c"></span>
              <span class="ease-crucible-tongs-clamp__d"></span>
            </div>
            <div class="ease-crucible-tongs-clamp__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-crucible-tongs-clamp__controls">
          <button type="button" class="ease-crucible-tongs-clamp__btn primary">Engage</button>
          <button type="button" class="ease-crucible-tongs-clamp__btn">Reset</button>
          <label class="ease-crucible-tongs-clamp__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-crucible-tongs-clamp__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
