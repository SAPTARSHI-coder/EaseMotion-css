<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EaseMotion - CSS Slot Machine Reels</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <input type="checkbox" id="spin-hack" class="ease-slot-trigger" aria-hidden="true">

  <div class="ease-slot-machine">
    <div class="ease-reel-window" role="img" aria-label="Slot machine reels">
      <!-- Reel 1 -->
      <div class="ease-reel">
        <div class="ease-strip ease-strip-1">
          <!-- Duplicate symbols to create a long strip -->
          <div class="ease-symbol">🍒</div><div class="ease-symbol">🍋</div><div class="ease-symbol">🍉</div><div class="ease-symbol">💎</div><div class="ease-symbol">7️⃣</div><div class="ease-symbol">🔔</div>
          <div class="ease-symbol">🍒</div><div class="ease-symbol">🍋</div><div class="ease-symbol">🍉</div><div class="ease-symbol">💎</div><div class="ease-symbol">7️⃣</div><div class="ease-symbol">🔔</div>
          <div class="ease-symbol">🍒</div><div class="ease-symbol">🍋</div><div class="ease-symbol">🍉</div><div class="ease-symbol">💎</div><div class="ease-symbol">7️⃣</div><div class="ease-symbol">🔔</div>
        </div>
      </div>
      <!-- Reel 2 -->
      <div class="ease-reel">
        <div class="ease-strip ease-strip-2">
          <div class="ease-symbol">💎</div><div class="ease-symbol">7️⃣</div><div class="ease-symbol">🔔</div><div class="ease-symbol">🍒</div><div class="ease-symbol">🍋</div><div class="ease-symbol">🍉</div>
          <div class="ease-symbol">💎</div><div class="ease-symbol">7️⃣</div><div class="ease-symbol">🔔</div><div class="ease-symbol">🍒</div><div class="ease-symbol">🍋</div><div class="ease-symbol">🍉</div>
          <div class="ease-symbol">💎</div><div class="ease-symbol">7️⃣</div><div class="ease-symbol">🔔</div><div class="ease-symbol">🍒</div><div class="ease-symbol">🍋</div><div class="ease-symbol">🍉</div>
          <div class="ease-symbol">💎</div><div class="ease-symbol">7️⃣</div><div class="ease-symbol">🔔</div><div class="ease-symbol">🍒</div><div class="ease-symbol">🍋</div><div class="ease-symbol">🍉</div>
        </div>
      </div>
      <!-- Reel 3 -->
      <div class="ease-reel">
        <div class="ease-strip ease-strip-3">
          <div class="ease-symbol">🍉</div><div class="ease-symbol">💎</div><div class="ease-symbol">7️⃣</div><div class="ease-symbol">🔔</div><div class="ease-symbol">🍒</div><div class="ease-symbol">🍋</div>
          <div class="ease-symbol">🍉</div><div class="ease-symbol">💎</div><div class="ease-symbol">7️⃣</div><div class="ease-symbol">🔔</div><div class="ease-symbol">🍒</div><div class="ease-symbol">🍋</div>
          <div class="ease-symbol">🍉</div><div class="ease-symbol">💎</div><div class="ease-symbol">7️⃣</div><div class="ease-symbol">🔔</div><div class="ease-symbol">🍒</div><div class="ease-symbol">🍋</div>
          <div class="ease-symbol">🍉</div><div class="ease-symbol">💎</div><div class="ease-symbol">7️⃣</div><div class="ease-symbol">🔔</div><div class="ease-symbol">🍒</div><div class="ease-symbol">🍋</div>
          <div class="ease-symbol">🍉</div><div class="ease-symbol">💎</div><div class="ease-symbol">7️⃣</div><div class="ease-symbol">🔔</div><div class="ease-symbol">🍒</div><div class="ease-symbol">🍋</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Button Trigger -->
  <label for="spin-hack" class="ease-spin-btn" role="button" tabindex="0">Spin</label>

  <p style="color: #64748b; font-family: system-ui; font-size: 0.875rem; margin-top: 2rem;">Pure CSS state management. No JS intervals.</p>

</body>
</html>
