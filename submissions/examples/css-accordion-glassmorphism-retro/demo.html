<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Glass Accordion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="retro-bg">
        <div class="glass-accordion">
            <input type="radio" name="g-acc" id="g1" checked>
            <label for="g1">Vintage Glass</label>
            <div class="g-content"><p>A unique mix of 80s gradients and modern frosted glass.</p></div>
            
            <input type="radio" name="g-acc" id="g2">
            <label for="g2">No JavaScript</label>
            <div class="g-content"><p>Pure CSS implementation via radio buttons.</p></div>
        </div>
    </div>
</body>
</html>
