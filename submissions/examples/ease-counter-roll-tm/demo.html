<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ease-counter-roll Demo</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body { display: flex; flex-direction: column; align-items: center; gap: 40px; padding: 60px 20px; background: #0a0a1a; }
    h1 { font-size: 1.4rem; color: #f8fafc; }
    .demo-section { display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .demo-label { font-size: 0.8rem; color: rgba(248,250,252,0.45); }
    .row { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
  </style>
</head>
<body>
  <h1>ease-counter-roll Component</h1>

  <div class="demo-section">
    <span class="demo-label">Primary color counter</span>
    <div class="counter-display theme-primary" id="counter1">0000</div>
  </div>

  <div class="demo-section">
    <span class="demo-label">Success color, pill style</span>
    <div class="counter-display theme-success pill glow" id="counter2">0</div>
  </div>

  <div class="demo-section">
    <span class="demo-label">Size variants</span>
    <div class="row">
      <div class="counter-display size-sm theme-cyan">123</div>
      <div class="counter-display size-md theme-warning">456</div>
      <div class="counter-display size-lg theme-rose">789</div>
      <div class="counter-display size-xl theme-primary">999</div>
    </div>
  </div>

  <div class="demo-section">
    <span class="demo-label">Auto-increment demo</span>
    <div class="counter-display theme-success" id="auto-counter">0</div>
    <button onclick="startCounter()" style="padding:8px 20px;cursor:pointer;border:none;border-radius:6px;background:#22c55e;color:#fff;">Start</button>
  </div>

  <div class="component-label">ease-counter-roll | Issue #64945</div>

  <script>
    function startCounter() {
      var el = document.getElementById('auto-counter');
      var count = 0;
      var interval = setInterval(function() {
        count++;
        el.textContent = count;
        el.classList.add('roll-up');
        setTimeout(function() { el.classList.remove('roll-up'); }, 600);
        if (count >= 100) clearInterval(interval);
      }, 100);
    }
  </script>
</body>
</html>
