<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Glowing Stepper Nav - Neumorphism</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="container">

    <section class="stepper-card">

      <h1>Project Progress</h1>

      <div class="stepper">

        <div class="progress"></div>

        <div class="step completed">
          <div class="circle">✓</div>
          <span>Start</span>
        </div>

        <div class="step completed">
          <div class="circle">2</div>
          <span>Design</span>
        </div>

        <div class="step active" aria-current="step">
          <div class="circle">3</div>
          <span>Develop</span>
        </div>

        <div class="step">
          <div class="circle">4</div>
          <span>Launch</span>
        </div>

      </div>

      <section class="content">
        <h2>Development in Progress</h2>

        <p>
          This neumorphic stepper demonstrates a soft floating interface with
          glowing active states, responsive layout, and accessibility-friendly
          markup using only HTML and CSS.
        </p>

        <button type="button">Continue</button>
      </section>

    </section>

  </main>

</body>
</html>
