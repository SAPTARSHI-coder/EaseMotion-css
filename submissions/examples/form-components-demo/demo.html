<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EaseMotion — Form Components Demo</title>
  <link rel="stylesheet" href="../../core/variables.css">
  <link rel="stylesheet" href="../../components/forms.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="demo-container">
    <h1>Form Components Demo</h1>
    <p>Interactive form elements with EaseMotion CSS.</p>

    <div class="demo-grid">
      <div class="demo-section">
        <h3>Checkbox</h3>
        <label class="ease-toggle">
          <input type="checkbox">
          <span class="ease-toggle-track"><span class="ease-toggle-thumb"></span></span>
          Enable notifications
        </label>
        <label class="ease-toggle">
          <input type="checkbox" checked>
          <span class="ease-toggle-track"><span class="ease-toggle-thumb"></span></span>
          Dark mode
        </label>
      </div>

      <div class="demo-section">
        <h3>Radio Group</h3>
        <div class="ease-radio-group">
          <label class="ease-radio-item"><input type="radio" name="plan" checked><span class="ease-radio-indicator"></span> Free</label>
          <label class="ease-radio-item"><input type="radio" name="plan"><span class="ease-radio-indicator"></span> Pro</label>
          <label class="ease-radio-item"><input type="radio" name="plan"><span class="ease-radio-indicator"></span> Enterprise</label>
        </div>
      </div>

      <div class="demo-section">
        <h3>Input</h3>
        <div class="ease-field">
          <label class="ease-field-label">Email</label>
          <input type="email" class="ease-input" placeholder="you@example.com">
        </div>
        <div class="ease-field">
          <label class="ease-field-label">Password</label>
          <input type="password" class="ease-input" placeholder="Enter password">
        </div>
      </div>

      <div class="demo-section">
        <h3>Select</h3>
        <div class="ease-field">
          <label class="ease-field-label">Country</label>
          <select class="ease-select">
            <option>United States</option>
            <option>India</option>
            <option>Germany</option>
          </select>
        </div>
        <div class="ease-field">
          <label class="ease-field-label">Textarea</label>
          <textarea class="ease-textarea" rows="3" placeholder="Your message..."></textarea>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
