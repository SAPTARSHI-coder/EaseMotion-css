<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toric Code TC - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css"></head><body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030712; color: #ffffff;">

    <div class="ease-card ease-card-glass tc-container">
        <div class="tc-header">
            <h2>Toric Code</h2>
            <span class="ease-badge ease-badge-secondary">Quantum Error Correction</span>
        </div>
        
        <div class="tc-screen ease-center">
            <div class="tc-flux flux-tc-a"></div>
            <div class="tc-flux flux-tc-b"></div>
            <div class="tc-boundary-ring"></div>
            <div class="tc-core ease-center"></div>
        </div>

        <div class="tc-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Anyonic Excitations &amp; Periodic Boundary Lattice</span>
            <button class="ease-btn ease-btn-secondary ease-btn-sm ease-hover-grow">Run Toric Code</button>
        </div>
    </div></body></html>
