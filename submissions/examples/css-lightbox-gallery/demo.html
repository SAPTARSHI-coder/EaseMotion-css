<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS-Only Interactive Lightbox Image Gallery</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>CSS-Only Lightbox Gallery</h1>
        <p>Click on an image to view it in full screen, built entirely without JavaScript.</p>
    </header>

    <main class="gallery-grid">
        <a href="#img1" class="thumbnail" aria-label="View Landscape 1">
            <img src="https://picsum.photos/id/1015/600/400" alt="Landscape 1">
        </a>
        <a href="#img2" class="thumbnail" aria-label="View Landscape 2">
            <img src="https://picsum.photos/id/1016/600/400" alt="Landscape 2">
        </a>
        <a href="#img3" class="thumbnail" aria-label="View Landscape 3">
            <img src="https://picsum.photos/id/1018/600/400" alt="Landscape 3">
        </a>
        <a href="#img4" class="thumbnail" aria-label="View Landscape 4">
            <img src="https://picsum.photos/id/1019/600/400" alt="Landscape 4">
        </a>
        <a href="#img5" class="thumbnail" aria-label="View Landscape 5">
            <img src="https://picsum.photos/id/1021/600/400" alt="Landscape 5">
        </a>
        <a href="#img6" class="thumbnail" aria-label="View Landscape 6">
            <img src="https://picsum.photos/id/1022/600/400" alt="Landscape 6">
        </a>
    </main>

    <!-- Lightbox Overlays -->
    <div id="img1" class="lightbox">
        <a href="#" class="lightbox-overlay" aria-label="Close Lightbox"></a>
        <a href="#" class="close-btn" aria-label="Close">&times;</a>
        <img src="https://picsum.photos/id/1015/1200/800" alt="Landscape 1 Fullscreen">
    </div>

    <div id="img2" class="lightbox">
        <a href="#" class="lightbox-overlay" aria-label="Close Lightbox"></a>
        <a href="#" class="close-btn" aria-label="Close">&times;</a>
        <img src="https://picsum.photos/id/1016/1200/800" alt="Landscape 2 Fullscreen">
    </div>

    <div id="img3" class="lightbox">
        <a href="#" class="lightbox-overlay" aria-label="Close Lightbox"></a>
        <a href="#" class="close-btn" aria-label="Close">&times;</a>
        <img src="https://picsum.photos/id/1018/1200/800" alt="Landscape 3 Fullscreen">
    </div>

    <div id="img4" class="lightbox">
        <a href="#" class="lightbox-overlay" aria-label="Close Lightbox"></a>
        <a href="#" class="close-btn" aria-label="Close">&times;</a>
        <img src="https://picsum.photos/id/1019/1200/800" alt="Landscape 4 Fullscreen">
    </div>

    <div id="img5" class="lightbox">
        <a href="#" class="lightbox-overlay" aria-label="Close Lightbox"></a>
        <a href="#" class="close-btn" aria-label="Close">&times;</a>
        <img src="https://picsum.photos/id/1021/1200/800" alt="Landscape 5 Fullscreen">
    </div>

    <div id="img6" class="lightbox">
        <a href="#" class="lightbox-overlay" aria-label="Close Lightbox"></a>
        <a href="#" class="close-btn" aria-label="Close">&times;</a>
        <img src="https://picsum.photos/id/1022/1200/800" alt="Landscape 6 Fullscreen">
    </div>

</body>
</html>
