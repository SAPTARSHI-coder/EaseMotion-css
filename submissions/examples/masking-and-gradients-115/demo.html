<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Glassmorphic shimmering metallic foil text effect using CSS masking and gradients."
  >

  <title>Glassmorphic Metallic Foil</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="page">

    <section class="showcase" aria-labelledby="title">

      <div class="glass-panel">

        <div class="status">
          <span class="status-dot"></span>
          LIVE VISUAL EFFECT
        </div>

        <p class="label">
          GLASSMORPHIC TYPOGRAPHY
        </p>

        <h1 id="title" class="foil-text">
          LUXE
        </h1>

        <div class="divider"></div>

        <p class="description">
          A shimmering metallic foil effect wrapped inside
          a translucent glassmorphic interface.
        </p>

        <div class="action-row">

          <button
            class="action-button primary"
            id="replayButton"
            type="button"
          >
            Replay Shine
          </button>

          <button
            class="action-button"
            id="pauseButton"
            type="button"
            aria-pressed="false"
          >
            Pause
          </button>

        </div>

        <div class="tech-tags">
          <span>CSS MASK</span>
          <span>GRADIENT</span>
          <span>GLASS</span>
          <span>NO LIBRARIES</span>
        </div>

      </div>

    </section>

  </main>

  <script>
    const foilText =
      document.querySelector(".foil-text");

    const replayButton =
      document.getElementById("replayButton");

    const pauseButton =
      document.getElementById("pauseButton");

    replayButton.addEventListener("click", () => {
      foilText.classList.remove("replay");

      void foilText.offsetWidth;

      foilText.classList.add("replay");
    });

    pauseButton.addEventListener("click", () => {
      const paused =
        foilText.classList.toggle("paused");

      pauseButton.textContent =
        paused ? "Resume" : "Pause";

      pauseButton.setAttribute(
        "aria-pressed",
        String(paused)
      );
    });
  </script>

</body>
</html>
