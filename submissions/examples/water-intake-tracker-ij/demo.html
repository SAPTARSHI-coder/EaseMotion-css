<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-water-intake-tracker</title>
</head>
<body>
<main class="wit-card">
  <h1 class="wit-title">Daily Water Intake</h1>
  <div class="wit-glass">
    <span class="wit-fill"></span>
    <span class="wit-bubbles"></span>
    <span class="wit-mark wit-mark-25"></span>
    <span class="wit-mark wit-mark-50"></span>
    <span class="wit-mark wit-mark-75"></span>
  </div>
  <p class="wit-total">1.4 <span class="wit-unit">L</span> / 2.0 L</p>
  <div class="wit-levels">
    <span class="wit-level wit-level-1"></span>
    <span class="wit-level wit-level-2"></span>
    <span class="wit-level wit-level-3"></span>
    <span class="wit-level wit-level-4"></span>
    <span class="wit-level wit-level-5"></span>
    <span class="wit-level wit-level-6"></span>
    <span class="wit-level wit-level-7"></span>
    <span class="wit-level wit-level-8"></span>
  </div>
  <span class="wit-goal">Goal: 8 glasses</span>
</main>
</body>
</html>
