<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Scale-Hover Progress Bar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<section class="container">

    <div class="hero">
        <span class="tag">Creative Portfolio</span>

        <h1>My Professional Skills</h1>

        <p>
            Elegant animated progress bars using a modern
            Scale-Hover interaction built entirely with
            HTML5 and CSS3.
        </p>
    </div>

    <div class="card">

        <div class="skill">
            <div class="info">
                <span>UI / UX Design</span>
                <span>95%</span>
            </div>

            <div class="progress">
                <div class="fill fill1"></div>
            </div>
        </div>

        <div class="skill">
            <div class="info">
                <span>Frontend Development</span>
                <span>90%</span>
            </div>

            <div class="progress">
                <div class="fill fill2"></div>
            </div>
        </div>

        <div class="skill">
            <div class="info">
                <span>React.js</span>
                <span>85%</span>
            </div>

            <div class="progress">
                <div class="fill fill3"></div>
            </div>
        </div>

        <div class="skill">
            <div class="info">
                <span>UI Animation</span>
                <span>80%</span>
            </div>

            <div class="progress">
                <div class="fill fill4"></div>
            </div>
        </div>

        <div class="skill">
            <div class="info">
                <span>Brand Identity</span>
                <span>75%</span>
            </div>

            <div class="progress">
                <div class="fill fill5"></div>
            </div>
        </div>

    </div>

</section>

</body>
</html>
