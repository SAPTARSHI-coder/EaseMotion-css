<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 3D Effect: Laser Ray Trace</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="layout-container">
        
        <header class="section-header">
            <h1 class="title">Pure CSS 3D: Laser Ray Trace</h1>
            <p class="subtitle">A hardware-accelerated, JavaScript-free 3D animation utilizing `transform-style: preserve-3d`. Features linear-gradients and mask compositing to simulate a laser beam tracing the edges of a 3D cube.</p>
        </header>

        <div class="demo-area">
            
            <!-- 
              [TECHNIQUE] The 3D Scene
              The wrapper establishes the depth perspective.
            -->
            <div class="scene-3d">
                
                <!-- 
                  The primary rotating object. 
                  It uses preserve-3d to render the faces of the cube in 3D space.
                -->
                <div class="cube-assembly">
                    
                    <!-- 
                      The 6 faces of the cube.
                      Each face contains a '.laser-trace' element that handles the animation.
                    -->
                    <div class="cube-face face-front">
                        <div class="laser-trace"></div>
                    </div>
                    
                    <div class="cube-face face-back">
                        <div class="laser-trace"></div>
                    </div>
                    
                    <div class="cube-face face-left">
                        <div class="laser-trace"></div>
                    </div>
                    
                    <div class="cube-face face-right">
                        <div class="laser-trace"></div>
                    </div>
                    
                    <div class="cube-face face-top">
                        <div class="laser-trace"></div>
                    </div>
                    
                    <div class="cube-face face-bottom">
                        <div class="laser-trace"></div>
                    </div>
                    
                    <!-- Inner Core to ground the visual weight -->
                    <div class="cube-core">
                        <div class="icon-laser">
                            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="2"></circle>
                                <path d="M22 12h-4"></path>
                                <path d="M6 12H2"></path>
                                <path d="M12 6V2"></path>
                                <path d="M12 22v-4"></path>
                                <path d="m20 4-3 3"></path>
                                <path d="m7 17-3 3"></path>
                                <path d="m4 4 3 3"></path>
                                <path d="m17 17 3 3"></path>
                            </svg>
                        </div>
                    </div>
                    
                </div>
                
            </div>
            
        </div>
        
    </div>

</body>
</html>
