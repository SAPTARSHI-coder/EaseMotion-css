<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment Method Card &mdash; EaseMotion CSS Demo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="page-head">
    <p class="kicker">EaseMotion CSS &middot; E-commerce</p>
    <h1>Payment Method Card</h1>
    <p class="sub">Choose how to pay &mdash; the selected card glows and confirms instantly.</p>
  </header>
  <main class="stage">
    <div class="pm-list">
      <label class="pm-card">
        <input type="radio" name="pay" checked />
        <span class="pm-radio"></span>
        <span class="pm-icon">&#127974;</span>
        <span class="pm-meta"><span class="pm-name">Card</span><br /><span class="pm-desc">Visa, Mastercard, Amex</span></span>
        <span class="pm-check">&#10003;</span>
      </label>
      <label class="pm-card">
        <input type="radio" name="pay" />
        <span class="pm-radio"></span>
        <span class="pm-icon">&#128176;</span>
        <span class="pm-meta"><span class="pm-name">PayPal</span><br /><span class="pm-desc">Link your account</span></span>
        <span class="pm-check">&#10003;</span>
      </label>
      <label class="pm-card">
        <input type="radio" name="pay" />
        <span class="pm-radio"></span>
        <span class="pm-icon">&#128179;</span>
        <span class="pm-meta"><span class="pm-name">UPI</span><br /><span class="pm-desc">Instant bank transfer</span></span>
        <span class="pm-check">&#10003;</span>
      </label>
    </div>
  </main>
  <p class="stage-caption">Click a card to select it &mdash; the checkmark pops in with a spring.</p>
  <footer class="page-foot">
    <span>Pure CSS &middot; zero dependencies</span>
    <span>Radio selection</span>
  </footer>
</body>
</html>
