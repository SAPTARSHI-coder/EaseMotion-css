<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floating Tab Bar with Pastel Styling - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="em-demo-container">
        <!-- Pure CSS Floating Tab Bar with Pastel Styling Component Showcase -->
        <header class="em-tab-doc-card" role="region" aria-label="Floating Tab Bar Pastel Showcase" tabindex="0">
            <div class="em-tab-header-bar">
                <span class="em-card-badge">COMPONENT #91047</span>
                <span class="em-brand-logo">PastelMotion</span>
            </div>
            <h1 class="em-card-title">Floating Tab Bar</h1>
            <p class="em-card-desc">Fully responsive floating navigation bar featuring soft pastel styling, smooth hover transitions, and keyboard accessibility.</p>
            <div class="em-tab-wrapper">
                <nav class="ease-floating-tab-bar" aria-label="Floating Navigation Menu" tabindex="0">
                    <button class="em-tab-item active" aria-label="Home Tab">
                        <span class="em-tab-icon">🏠</span>
                        <span class="em-tab-label">Home</span>
                    </button>
                    <button class="em-tab-item" aria-label="Explore Tab">
                        <span class="em-tab-icon">✨</span>
                        <span class="em-tab-label">Explore</span>
                    </button>
                    <button class="em-tab-item" aria-label="Notifications Tab">
                        <span class="em-tab-icon">🔔</span>
                        <span class="em-tab-label">Alerts</span>
                    </button>
                    <button class="em-tab-item" aria-label="Profile Tab">
                        <span class="em-tab-icon">👤</span>
                        <span class="em-tab-label">Profile</span>
                    </button>
                </nav>
            </div>
        </header>
    </div>
</body>
</html>
