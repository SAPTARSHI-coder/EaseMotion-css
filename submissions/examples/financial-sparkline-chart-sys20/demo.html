<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Financial Stock Chart Sparkline with Animated SVG Path Drawing</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../easemotion.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>Financial Sparkline Chart</h1>
      <p>SVG stroke dashoffset line drawing keyframes and gradient fill.</p>
    </header>

    <main class="chart-card">
      <div class="chart-header">
        <span class="stock-title">NASDAQ: EASE</span>
        <span class="stock-value">$342.50 (+12.4%)</span>
      </div>

      <div class="svg-container">
        <svg viewBox="0 0 300 100" class="sparkline-svg">
          <path d="M 0,80 Q 50,20 100,50 T 200,30 T 300,10" class="sparkline-path"/>
        </svg>
      </div>
    </main>
  </div>
</body>
</html>
