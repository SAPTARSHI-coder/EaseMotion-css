<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Interactive Tooltip Menu - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      min-height: 100vh;
      padding: 3rem 2rem;
      color: #f8fafc;
    }
    
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    
    h1 {
      text-align: center;
      margin-bottom: 3rem;
      font-size: 2.5rem;
      background: linear-gradient(135deg, #06b6d4, #3b82f6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    .demo-section {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 16px;
      padding: 2rem;
      margin-bottom: 2rem;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    h2 {
      font-size: 1.1rem;
      color: #94a3b8;
      margin-bottom: 1.5rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    
    .demo-row {
      display: flex;
      flex-wrap: wrap;
      gap: 2rem;
      align-items: flex-start;
      justify-content: center;
      padding: 2rem;
    }
    
    .card {
      background: rgba(0, 0, 0, 0.2);
      border-radius: 12px;
      padding: 2rem;
      min-width: 200px;
      text-align: center;
    }
    
    .card h3 {
      font-size: 0.9rem;
      color: #64748b;
      margin-bottom: 1rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    
    .icon-demo {
      display: flex;
      justify-content: center;
      padding: 3rem;
    }
    
    .position-demo {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 3rem;
      padding: 3rem;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 12px;
      min-height: 250px;
    }
    
    .color-demos {
      display: flex;
      flex-wrap: wrap;
      gap: 1.5rem;
      justify-content: center;
    }
    
    footer {
      text-align: center;
      padding: 2rem;
      color: #64748b;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>CSS Interactive Tooltip Menu</h1>
    
    <!-- Basic Demo -->
    <section class="demo-section">
      <h2>Basic Tooltip Menu</h2>
      <div class="demo-row">
        <div class="tooltip-menu">
          <button class="tooltip-trigger">More Actions</button>
          <div class="tooltip-content">
            <button>📝 Edit</button>
            <button>📋 Duplicate</button>
            <button>📤 Share</button>
            <button>🗑️ Delete</button>
          </div>
        </div>
      </div>
    </section>
    
    <!-- Position Demos -->
    <section class="demo-section">
      <h2>Position Variants</h2>
      <div class="position-demo">
        <div class="tooltip-menu tooltip-menu--left">
          <button class="tooltip-trigger">← Left</button>
          <div class="tooltip-content">
            <button>Action 1</button>
            <button>Action 2</button>
          </div>
        </div>
        
        <div class="tooltip-menu tooltip-menu--top">
          <button class="tooltip-trigger">↑ Top</button>
          <div class="tooltip-content">
            <button>Action 1</button>
            <button>Action 2</button>
          </div>
        </div>
        
        <div class="tooltip-menu tooltip-menu--bottom">
          <button class="tooltip-trigger">↓ Bottom</button>
          <div class="tooltip-content">
            <button>Action 1</button>
            <button>Action 2</button>
          </div>
        </div>
        
        <div class="tooltip-menu tooltip-menu--right">
          <button class="tooltip-trigger">Right →</button>
          <div class="tooltip-content">
            <button>Action 1</button>
            <button>Action 2</button>
          </div>
        </div>
      </div>
    </section>
    
    <!-- Icon Tooltip -->
    <section class="demo-section">
      <h2>Icon Tooltips</h2>
      <div class="icon-demo">
        <div class="tooltip-menu tooltip-menu--icon tooltip-menu--info">
          <span class="tooltip-trigger" tabindex="0">ℹ</span>
          <div class="tooltip-content">
            This is an informational tooltip with helpful details.
          </div>
        </div>
      </div>
    </section>
    
    <!-- Color Variants -->
    <section class="demo-section">
      <h2>Color Variants</h2>
      <div class="color-demos">
        <div class="card">
          <h3>Default</h3>
          <div class="tooltip-menu">
            <button class="tooltip-trigger">Actions</button>
            <div class="tooltip-content">
              <button>Edit</button>
              <button>Delete</button>
            </div>
          </div>
        </div>
        
        <div class="card">
          <h3>Info</h3>
          <div class="tooltip-menu tooltip-menu--info">
            <button class="tooltip-trigger">Info</button>
            <div class="tooltip-content">
              <button>Details</button>
              <button>Help</button>
            </div>
          </div>
        </div>
        
        <div class="card">
          <h3>Success</h3>
          <div class="tooltip-menu tooltip-menu--success">
            <button class="tooltip-trigger">Success</button>
            <div class="tooltip-content">
              <button>View</button>
              <button>Export</button>
            </div>
          </div>
        </div>
        
        <div class="card">
          <h3>Danger</h3>
          <div class="tooltip-menu tooltip-menu--danger">
            <button class="tooltip-trigger">Danger</button>
            <div class="tooltip-content">
              <button>Remove</button>
              <button>Block</button>
            </div>
          </div>
        </div>
      </div>
    </section>
    
    <!-- Animation Variants -->
    <section class="demo-section">
      <h2>Animation Variants</h2>
      <div class="demo-row">
        <div class="tooltip-menu tooltip-menu--animate">
          <button class="tooltip-trigger">Pop Animation</button>
          <div class="tooltip-content">
            <button>Action 1</button>
            <button>Action 2</button>
          </div>
        </div>
        
        <div class="tooltip-menu tooltip-menu--slide">
          <button class="tooltip-trigger">Slide Animation</button>
          <div class="tooltip-content">
            <button>Action 1</button>
            <button>Action 2</button>
          </div>
        </div>
        
        <div class="tooltip-menu tooltip-menu--fade">
          <button class="tooltip-trigger">Fade Animation</button>
          <div class="tooltip-content">
            <button>Action 1</button>
            <button>Action 2</button>
          </div>
        </div>
      </div>
    </section>
    
    <footer>
      <p>CSS Interactive Tooltip Menu - Pure CSS Animation</p>
      <p style="margin-top: 0.5rem; opacity: 0.7;">Part of EaseMotion CSS Collection</p>
    </footer>
  </div>
</body>
</html>
