<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EaseMotion — Command Palette</title>
  <link rel="stylesheet" href="../../core/variables.css">
  <link rel="stylesheet" href="../../components/command-palette.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="demo-container">
    <h1>Command Palette</h1>
    <p>Press <span class="ease-kbd">Ctrl</span> + <span class="ease-kbd">K</span> to open</p>
    <button class="demo-btn" onclick="document.getElementById('palette').classList.add('open')">Open Palette</button>
  </div>

  <div id="palette" class="palette-overlay" onclick="if(event.target===this)this.classList.remove('open')">
    <div class="palette">
      <div class="palette-header">
        <input type="text" class="palette-input" placeholder="Type a command..." autofocus>
        <span class="ease-kbd">Esc</span>
      </div>
      <div class="palette-results">
        <div class="palette-group">Navigation</div>
        <div class="palette-item">Go to Dashboard</div>
        <div class="palette-item">Go to Settings</div>
        <div class="palette-item">Go to Profile</div>
        <div class="palette-group">Actions</div>
        <div class="palette-item">Create New Project</div>
        <div class="palette-item">Invite Team Member</div>
        <div class="palette-item">Export Data</div>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('keydown', e => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
        e.preventDefault();
        document.getElementById('palette').classList.toggle('open');
      }
      if (e.key === 'Escape') {
        document.getElementById('palette').classList.remove('open');
      }
    });
  </script>
</body>
</html>
