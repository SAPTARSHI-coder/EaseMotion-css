<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ease-loading-text-fade-cycle-sap demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="text-fade-cycle-sap">
    <span class="active">Loading assets...</span>
    <span>Preparing your dashboard...</span>
    <span>Almost there...</span>
  </div>

  <script>
    const spans = document.querySelectorAll('.text-fade-cycle-sap span');
    let i = 0;
    setInterval(() => {
      spans[i].classList.remove('active');
      i = (i + 1) % spans.length;
      spans[i].classList.add('active');
    }, 2000);
  </script>
</body>
</html>
