<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Time Freeze · freezes all surrounding elements</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <div class="time-container">
      <div class="time-display" id="timeDisplay">
        <!-- Time Particles -->
        <div class="time-particles" id="timeParticles"></div>
        
        <!-- Floating Elements -->
        <div class="floating-elements">
          <div class="float-element leaf" style="--delay: 0s; --duration: 4s;">🍃</div>
          <div class="float-element star" style="--delay: 1s; --duration: 5s;">⭐</div>
          <div class="float-element bubble" style="--delay: 2s; --duration: 3.5s;">🫧</div>
          <div class="float-element sparkle" style="--delay: 0.5s; --duration: 4.5s;">✨</div>
          <div class="float-element cloud" style="--delay: 1.5s; --duration: 6s;">☁️</div>
          <div class="float-element moon" style="--delay: 2.5s; --duration: 5.5s;">🌙</div>
        </div>

        <!-- Time Freeze Center -->
        <div class="time-center" id="timeCenter">
          <div class="time-icon" id="timeIcon">⏳</div>
          <div class="time-label" id="timeLabel">Time Flowing</div>
        </div>

        <!-- Freeze Ring -->
        <div class="freeze-ring" id="freezeRing">
          <div class="ring-segment"></div>
          <div class="ring-segment"></div>
          <div class="ring-segment"></div>
          <div class="ring-segment"></div>
          <div class="ring-segment"></div>
          <div class="ring-segment"></div>
          <div class="ring-segment"></div>
          <div class="ring-segment"></div>
        </div>

        <!-- Ice Crystal Effects -->
        <div class="ice-crystals" id="iceCrystals"></div>

        <!-- Freeze Indicator -->
        <div class="freeze-indicator">
          <div class="freeze-bar">
            <div class="freeze-fill" id="freezeFill"></div>
          </div>
          <span class="freeze-value" id="freezeValue">Flow: 100%</span>
        </div>
      </div>
      
      <div class="time-status">
        <span id="timeStatus">⏳ Click to freeze time</span>
      </div>
    </div>

    <div class="controls">
      <button class="btn btn-freeze" id="freezeBtn">❄️ Freeze Time</button>
      <button class="btn btn-unfreeze" id="unfreezeBtn">⏳ Unfreeze</button>
      <button class="btn btn-reset" id="resetBtn">⟳ Reset</button>
    </div>
    <div class="footer-note">
      <span>❄️ freeze time · ice crystals · frozen particles</span>
    </div>
  </div>

  <script>
    (function() {
      "use strict";

      // DOM refs
      const timeDisplay = document.getElementById('timeDisplay');
      const timeCenter = document.getElementById('timeCenter');
      const timeIcon = document.getElementById('timeIcon');
      const timeLabel = document.getElementById('timeLabel');
      const freezeFill = document.getElementById('freezeFill');
      const freezeValue = document.getElementById('freezeValue');
      const timeStatus = document.getElementById('timeStatus');
      const timeParticles = document.getElementById('timeParticles');
      const iceCrystals = document.getElementById('iceCrystals');
      const freezeRing = document.getElementById('freezeRing');
      const floatingElements = document.querySelectorAll('.float-element');
      const freezeBtn = document.getElementById('freezeBtn');
      const unfreezeBtn = document.getElementById('unfreezeBtn');
      const resetBtn = document.getElementById('resetBtn');

      // State
      let freeze = 0; // 0 to 1 (0 = flowing, 1 = frozen)
      let targetFreeze = 0;
      let isAnimating = false;
      let animationId = null;
      let isFrozen = false;
      let particleInterval = null;

      // Update time freeze
      function updateFreeze() {
        // Smooth interpolation
        freeze += (targetFreeze - freeze) * 0.04;
        
        // Clamp
        freeze = Math.max(0, Math.min(1, freeze));
        
        const percent = Math.round((1 - freeze) * 100);
        
        // Update indicator
        freezeFill.style.width = (1 - freeze) * 100 + '%';
        freezeValue.textContent = `Flow: ${percent}%`;

        // Update center
        const scale = 1 - freeze * 0.2;
        const rotation = freeze * 360;
        timeCenter.style.transform = `scale(${scale}) rotate(${rotation}deg)`;
        
        // Update icon
        if (freeze > 0.8) {
          timeIcon.textContent = '❄️';
          timeLabel.textContent = 'Time Frozen';
          timeLabel.style.color = '#93c5fd';
        } else if (freeze > 0.4) {
          timeIcon.textContent = '⏳';
          timeLabel.textContent = 'Freezing...';
          timeLabel.style.color = '#818cf8';
        } else if (freeze > 0.05) {
          timeIcon.textContent = '⏳';
          timeLabel.textContent = 'Slowing...';
          timeLabel.style.color = '#94a3b8';
        } else {
          timeIcon.textContent = '⏳';
          timeLabel.textContent = 'Time Flowing';
          timeLabel.style.color = '#4ade80';
        }

        // Update floating elements
        floatingElements.forEach((el, index) => {
          const delay = parseFloat(el.style.getPropertyValue('--delay')) || 0;
          const duration = parseFloat(el.style.getPropertyValue('--duration')) || 4;
          const elementFreeze = Math.max(0, Math.min(1, (freeze - delay * 0.05) / (1 - delay * 0.05)));
          el.style.opacity = 1 - elementFreeze * 0.8;
          el.style.transform = `scale(${1 - elementFreeze * 0.3})`;
          el.style.filter = `blur(${elementFreeze * 2}px)`;
          el.style.animationPlayState = elementFreeze > 0.5 ? 'paused' : 'running';
        });

        // Update freeze ring
        const ringRotation = freeze * 360;
        freezeRing.style.transform = `rotate(${ringRotation}deg)`;
        freezeRing.style.opacity = 0.1 + freeze * 0.6;
        
        // Update ring segments
        const segments = document.querySelectorAll('.ring-segment');
        segments.forEach((segment, index) => {
          const delay = index * 0.05;
          const segmentFreeze = Math.max(0, Math.min(1, (freeze - delay) / (1 - delay)));
          segment.style.opacity = segmentFreeze;
          segment.style.transform = `scale(${0.5 + segmentFreeze * 0.5})`;
        });

        // Update particles
        if (freeze > 0.3 && Math.random() < freeze * 0.2) {
          createTimeParticle();
        }

        // Update ice crystals
        if (freeze > 0.5 && Math.random() < (freeze - 0.5) * 0.3) {
          createIceCrystal();
        }

        // Update display glow
        const glowIntensity = 0.1 + freeze * 0.4;
        const color = freeze > 0.5 ? '167, 139, 250' : '99, 102, 241';
        timeDisplay.style.boxShadow = `inset 0 0 60px rgba(0,0,0,0.5), 0 0 ${40 + freeze * 60}px rgba(${color}, ${glowIntensity})`;
        timeDisplay.style.borderColor = freeze > 0.5 ? '#93c5fd' : '#2d3748';

        // Update status
        if (freeze > 0.9) {
          timeStatus.textContent = '❄️ Time is frozen!';
          timeStatus.style.color = '#93c5fd';
          freezeBtn.textContent = '❄️ Frozen';
          freezeBtn.style.background = 'linear-gradient(135deg, #93c5fd, #60a5fa)';
          freezeBtn.style.borderColor = '#93c5fd';
        } else if (freeze > 0.4) {
          timeStatus.textContent = '❄️ Freezing time...';
          timeStatus.style.color = '#818cf8';
          freezeBtn.textContent = '❄️ Freezing...';
        } else if (freeze > 0.05) {
          timeStatus.textContent = '⏳ Slowing time...';
          timeStatus.style.color = '#94a3b8';
        } else {
          timeStatus.textContent = '⏳ Click to freeze time';
          timeStatus.style.color = '#94a3b8';
          freezeBtn.textContent = '❄️ Freeze Time';
          freezeBtn.style.background = 'linear-gradient(135deg, #6366f1, #4f46e5)';
          freezeBtn.style.borderColor = '#818cf8';
        }
      }

      // Create time particle
      function createTimeParticle() {
        const particle = document.createElement('div');
        particle.className = 'time-particle';
        
        const size = Math.random() * 6 + 2;
        particle.style.width = size + 'px';
        particle.style.height = size + 'px';
        particle.style.left = Math.random() * 100 + '%';
        particle.style.top = Math.random() * 100 + '%';
        
        const colors = ['#818cf8', '#a78bfa', '#93c5fd', '#c4b5fd', '#fbbf24'];
        particle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        particle.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
        
        const angle = Math.random() * Math.PI * 2;
        const distance = 30 + Math.random() * 80;
        particle.style.setProperty('--tx', Math.cos(angle) * distance + 'px');
        particle.style.setProperty('--ty', Math.sin(angle) * distance + 'px');
        
        particle.style.animationDuration = (Math.random() * 1.5 + 1) + 's';
        
        timeParticles.appendChild(particle);
        
        setTimeout(() => {
          particle.remove();
        }, 2500);
      }

      // Create ice crystal
      function createIceCrystal() {
        const crystal = document.createElement('div');
        crystal.className = 'ice-crystal';
        
        const size = Math.random() * 20 + 10;
        crystal.style.width = size + 'px';
        crystal.style.height = size + 'px';
        crystal.style.left = Math.random() * 100 + '%';
        crystal.style.top = Math.random() * 100 + '%';
        
        const rotation = Math.random() * 360;
        crystal.style.transform = `rotate(${rotation}deg)`;
        
        const colors = ['rgba(147, 197, 253, 0.3)', 'rgba(191, 219, 254, 0.2)', 'rgba(219, 234, 254, 0.15)'];
        crystal.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        
        crystal.style.animationDuration = (Math.random() * 2 + 2) + 's';
        
        iceCrystals.appendChild(crystal);
        
        setTimeout(() => {
          crystal.remove();
        }, 3000);
      }

      // Animation loop
      function animate() {
        if (isAnimating) {
          updateFreeze();
          animationId = requestAnimationFrame(animate);
        }
      }

      // Start animation
      function startAnimation() {
        if (!isAnimating) {
          isAnimating = true;
          animate();
        }
      }

      // Stop animation
      function stopAnimation() {
        if (isAnimating) {
          isAnimating = false;
          if (animationId) {
            cancelAnimationFrame(animationId);
            animationId = null;
          }
          updateFreeze();
        }
      }

      // Freeze time
      function freezeTime() {
        targetFreeze = 1;
        startAnimation();
        isFrozen = true;
        // Create burst of particles
        for (let i = 0; i < 10; i++) {
          setTimeout(() => {
            createTimeParticle();
          }, i * 100);
        }
      }

      // Unfreeze time
      function unfreezeTime() {
        targetFreeze = 0;
        startAnimation();
        isFrozen = false;
        // Clear ice crystals
        iceCrystals.innerHTML = '';
        timeStatus.textContent = '⏳ Time flowing again';
        timeStatus.style.color = '#4ade80';
        setTimeout(() => {
          if (!isFrozen) {
            timeStatus.textContent = '⏳ Click to freeze time';
            timeStatus.style.color = '#94a3b8';
          }
        }, 1500);
      }

      // Reset
      function resetTime() {
        targetFreeze = 0;
        freeze = 0;
        isFrozen = false;
        stopAnimation();
        updateFreeze();
        iceCrystals.innerHTML = '';
        timeParticles.innerHTML = '';
        freezeBtn.textContent = '❄️ Freeze Time';
        freezeBtn.style.background = 'linear-gradient(135deg, #6366f1, #4f46e5)';
        freezeBtn.style.borderColor = '#818cf8';
        timeStatus.textContent = '🔄 Reset complete';
        timeStatus.style.color = '#94a3b8';
        setTimeout(() => {
          timeStatus.textContent = '⏳ Click to freeze time';
        }, 1000);
      }

      // Toggle freeze
      function toggleFreeze() {
        if (freeze > 0.5) {
          unfreezeTime();
        } else {
          freezeTime();
        }
      }

      // Event listeners
      if (freezeBtn) {
        freezeBtn.addEventListener('click', function(e) {
          e.preventDefault();
          if (freeze > 0.8) {
            unfreezeTime();
          } else {
            freezeTime();
          }
        });
      }

      if (unfreezeBtn) {
        unfreezeBtn.addEventListener('click', function(e) {
          e.preventDefault();
          unfreezeTime();
        });
      }

      if (resetBtn) {
        resetBtn.addEventListener('click', function(e) {
          e.preventDefault();
          resetTime();
        });
      }

      // Click on display to toggle
      timeDisplay.addEventListener('click', function(e) {
        if (e.target === this || e.target.closest('.time-center')) {
          toggleFreeze();
        }
      });

      // Keyboard shortcuts
      document.addEventListener('keydown', function(e) {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

        const key = e.key;
        if (key === ' ' || key === 'Space') {
          e.preventDefault();
          toggleFreeze();
        } else if (key === 'f' || key === 'F') {
          e.preventDefault();
          freezeTime();
        } else if (key === 'u' || key === 'U') {
          e.preventDefault();
          unfreezeTime();
        } else if (key === 'r' || key === 'R') {
          e.preventDefault();
          resetTime();
        }
      });

      // Initialize
      updateFreeze();
      // Create initial particles
      for (let i = 0; i < 5; i++) {
        setTimeout(() => createTimeParticle(), i * 300);
      }
      console.log('❄️ Time Freeze ready · shortcuts: [Space] Toggle, [F] Freeze, [U] Unfreeze, [R] Reset');
    })();
  </script>
</body>
</html>
