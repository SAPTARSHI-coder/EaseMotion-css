<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    name="description"
    content="CSS-only animated multi-step progress indicator"
  />
  <title>Animated Progress Steps</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main class="demo-container">
    <section class="progress-card" aria-labelledby="progress-title">
      <h1 id="progress-title">Animated Progress Steps</h1>

      <ol class="progress-steps" aria-label="Progress">
        <li class="step completed">
          <span class="step-number" aria-hidden="true">1</span>
          <span class="step-label">Account</span>
        </li>

        <li class="step completed">
          <span class="step-number" aria-hidden="true">2</span>
          <span class="step-label">Profile</span>
        </li>

        <li class="step active" aria-current="step">
          <span class="step-number" aria-hidden="true">3</span>
          <span class="step-label">Details</span>
        </li>

        <li class="step">
          <span class="step-number" aria-hidden="true">4</span>
          <span class="step-label">Review</span>
        </li>
      </ol>
    </section>
  </main>
</body>
</html>
