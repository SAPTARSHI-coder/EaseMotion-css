<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ease Adaptive Card - CSS light-dark() Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="ease-theme-wrapper">
    <input type="checkbox" id="theme-override" hidden>
    <label for="theme-override" class="ease-toggle-btn">Toggle Dark Mode</label>

    <div class="ease-adaptive-card">
      <span class="ease-adaptive-tag">CSS light-dark()</span>
      <h2 class="ease-adaptive-title">Adaptive Card Component</h2>
      <p class="ease-adaptive-text">
        This card dynamically shifts its color scheme between light and dark themes using CSS native <code>light-dark()</code> syntax and zero JavaScript.
      </p>
    </div>
  </div>
</body>
</html>
