<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS-only Animated Progress Bar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="apb-section">

    <h2 style="font-size:1.25rem;margin-bottom:1rem;">Striped Bars</h2>

    <div class="apb-group">
      <div class="apb-label">
        <span>Primary</span><span>65%</span>
      </div>
      <div class="apb-track">
        <div class="apb-fill striped primary" style="width:65%"></div>
      </div>
    </div>

    <div class="apb-group">
      <div class="apb-label">
        <span>Success</span><span>80%</span>
      </div>
      <div class="apb-track">
        <div class="apb-fill striped success" style="width:80%"></div>
      </div>
    </div>

    <div class="apb-group">
      <div class="apb-label">
        <span>Warning</span><span>55%</span>
      </div>
      <div class="apb-track">
        <div class="apb-fill striped warning" style="width:55%"></div>
      </div>
    </div>

    <h2 style="font-size:1.25rem;margin:1.5rem 0 1rem;">Pulse Bars</h2>

    <div class="apb-group">
      <div class="apb-label">
        <span>Danger</span><span>92%</span>
      </div>
      <div class="apb-track">
        <div class="apb-fill pulse danger" style="width:92%"></div>
      </div>
    </div>

    <div class="apb-group">
      <div class="apb-label">
        <span>Info</span><span>40%</span>
      </div>
      <div class="apb-track">
        <div class="apb-fill pulse info" style="width:40%"></div>
      </div>
    </div>

    <h2 style="font-size:1.25rem;margin:1.5rem 0 1rem;">Glow + Gradient</h2>

    <div class="apb-group">
      <div class="apb-label">
        <span>Gradient</span><span>75%</span>
      </div>
      <div class="apb-track">
        <div class="apb-fill glow gradient-primary" style="width:75%"></div>
      </div>
    </div>

    <h2 style="font-size:1.25rem;margin:1.5rem 0 1rem;">Thickness Variants</h2>

    <div class="apb-group">
      <div class="apb-label"><span>Thin (4px)</span><span>60%</span></div>
      <div class="apb-track thin">
        <div class="apb-fill striped primary" style="width:60%"></div>
      </div>
    </div>

    <div class="apb-group">
      <div class="apb-label"><span>Thick (16px)</span><span>70%</span></div>
      <div class="apb-track thick">
        <div class="apb-fill striped success" style="width:70%"></div>
      </div>
    </div>

    <div class="apb-group">
      <div class="apb-label"><span>X-Thick Rounded</span><span>85%</span></div>
      <div class="apb-track xthick round">
        <div class="apb-fill glow gradient-primary" style="width:85%"></div>
      </div>
    </div>

    <h2 style="font-size:1.25rem;margin:1.5rem 0 1rem;">Multi-Segment</h2>

    <div class="apb-group">
      <div class="apb-label"><span>5 Segments</span></div>
      <div class="apb-segments">
        <div class="apb-segment"><div class="apb-segment-fill" style="width:90%;background:#6366f1;"></div></div>
        <div class="apb-segment"><div class="apb-segment-fill" style="width:75%;background:#10b981;"></div></div>
        <div class="apb-segment"><div class="apb-segment-fill" style="width:60%;background:#f59e0b;"></div></div>
        <div class="apb-segment"><div class="apb-segment-fill" style="width:45%;background:#ef4444;"></div></div>
        <div class="apb-segment"><div class="apb-segment-fill" style="width:30%;background:#0ea5e9;"></div></div>
      </div>
    </div>

  </div>

</body>
</html>
