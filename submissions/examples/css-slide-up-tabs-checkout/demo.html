<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Slide-Up Tabs - E-Commerce Checkout Layout</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="checkout-container">
    <header class="checkout-header">
      <h1>Complete Your Order</h1>
      <p>Select a step below to review and finalize your checkout details.</p>
    </header>

    <div class="tabs-wrapper">
      <!-- Hidden Radio Controllers -->
      <input type="radio" id="tab-shipping" name="checkout-tabs" checked>
      <input type="radio" id="tab-payment" name="checkout-tabs">
      <input type="radio" id="tab-review" name="checkout-tabs">

      <!-- Tab Navigation Headers -->
      <nav class="tab-list" aria-label="Checkout Steps">
        <label for="tab-shipping" class="tab-label">
          <span class="step-num">1</span>
          <span class="step-title">Shipping</span>
        </label>
        <label for="tab-payment" class="tab-label">
          <span class="step-num">2</span>
          <span class="step-title">Payment</span>
        </label>
        <label for="tab-review" class="tab-label">
          <span class="step-num">3</span>
          <span class="step-title">Review</span>
        </label>
      </nav>

      <!-- Slide-Up Content Panels -->
      <section class="tab-panels">
        <!-- Panel 1: Shipping -->
        <article class="tab-panel panel-shipping">
          <h2>Shipping Address</h2>
          <form class="checkout-form" onsubmit="return false;">
            <div class="form-group">
              <label for="fullname">Full Name</label>
              <input type="text" id="fullname" placeholder="John Doe" required>
            </div>
            <div class="form-group">
              <label for="address">Street Address</label>
              <input type="text" id="address" placeholder="123 Commerce St" required>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label for="city">City</label>
                <input type="text" id="city" placeholder="New York" required>
              </div>
              <div class="form-group">
                <label for="zip">ZIP Code</label>
                <input type="text" id="zip" placeholder="10001" required>
              </div>
            </div>
            <label for="tab-payment" class="btn btn-primary">Proceed to Payment &rarr;</label>
          </form>
        </article>

        <!-- Panel 2: Payment -->
        <article class="tab-panel panel-payment">
          <h2>Payment Options</h2>
          <form class="checkout-form" onsubmit="return false;">
            <div class="form-group">
              <label for="cardnum">Card Number</label>
              <input type="text" id="cardnum" placeholder="4532 •••• •••• 8892" required>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label for="expiry">Expiry Date</label>
                <input type="text" id="expiry" placeholder="MM/YY" required>
              </div>
              <div class="form-group">
                <label for="cvv">CVV</label>
                <input type="text" id="cvv" placeholder="123" required>
              </div>
            </div>
            <div class="btn-group">
              <label for="tab-shipping" class="btn btn-secondary">&larr; Back</label>
              <label for="tab-review" class="btn btn-primary">Review Order &rarr;</label>
            </div>
          </form>
        </article>

        <!-- Panel 3: Review -->
        <article class="tab-panel panel-review">
          <h2>Order Summary</h2>
          <div class="order-summary">
            <div class="summary-item">
              <span>Wireless Headphones</span>
              <span>$149.99</span>
            </div>
            <div class="summary-item">
              <span>Shipping Fee</span>
              <span>$5.00</span>
            </div>
            <div class="summary-item total">
              <span>Total Amount</span>
              <span>$154.99</span>
            </div>
          </div>
          <div class="btn-group">
            <label for="tab-payment" class="btn btn-secondary">&larr; Back</label>
            <button type="submit" class="btn btn-success">Place Order ($154.99)</button>
          </div>
        </article>
      </section>
    </div>
  </main>
</body>
</html>
