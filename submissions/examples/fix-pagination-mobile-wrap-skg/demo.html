<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fix: Pagination Mobile Wrap — Issue #55887</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ─── BEFORE: wrapping bug ──────────────────────────────── -->
  <div class="demo-card">
    <h2>Before — buttons wrap (bug)</h2>
    <span class="label-broken">❌ Broken</span>
    <nav aria-label="Broken pagination" class="pagination-broken">
      <button disabled>Previous</button>
      <button class="active">1</button>
      <button>2</button>
      <button>3</button>
      <button>4</button>
      <button>5</button>
      <button>6</button>
      <button>7</button>
      <button>Next</button>
    </nav>
  </div>

  <!-- ─── AFTER: fixed with nowrap + scroll ─────────────────── -->
  <div class="demo-card">
    <h2>After — single row, scrolls on overflow (fixed)</h2>
    <span class="label-fixed">✅ Fixed</span>
    <nav aria-label="Fixed pagination" class="pagination-fixed">
      <button disabled>Previous</button>
      <button class="active">1</button>
      <button>2</button>
      <button>3</button>
      <button>4</button>
      <button>5</button>
      <button>6</button>
      <button>7</button>
      <button>Next</button>
    </nav>
  </div>

  <!-- ─── Small variant ─────────────────────────────────────── -->
  <div class="demo-card">
    <h2>Small variant</h2>
    <nav aria-label="Small pagination" class="pagination-fixed sm">
      <button>«</button>
      <button>1</button>
      <button>2</button>
      <button class="active">3</button>
      <button>4</button>
      <button>5</button>
      <button>6</button>
      <button>7</button>
      <button>8</button>
      <button>9</button>
      <button>10</button>
      <button>»</button>
    </nav>
  </div>

  <!-- ─── Large variant ─────────────────────────────────────── -->
  <div class="demo-card">
    <h2>Large variant</h2>
    <nav aria-label="Large pagination" class="pagination-fixed lg">
      <button>← Prev</button>
      <button>1</button>
      <button>2</button>
      <button class="active">3</button>
      <button>4</button>
      <button>5</button>
      <button>Next →</button>
    </nav>
  </div>

  <p class="resize-hint">
    ↔ Resize your browser window to see the scroll behaviour on small screens.
  </p>

</body>
</html>
