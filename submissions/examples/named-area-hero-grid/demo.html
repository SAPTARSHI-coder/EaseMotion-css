<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Named Area Hero Grid</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <main class="hero" aria-label="Hero Grid Section">

    <header class="header">
      <h1>Creative Hero Layout</h1>
      <p>
        CSS Grid named areas create flexible and responsive hero designs.
      </p>
      <button class="cta">
        Explore Now
      </button>
    </header>


    <section class="visual" aria-label="Hero Image">
      <div class="image-card">
        Hero Image
      </div>
    </section>


    <aside class="stats" aria-label="Statistics">
      <div class="box">
        <h2>120+</h2>
        <p>Projects</p>
      </div>

      <div class="box">
        <h2>50+</h2>
        <p>Clients</p>
      </div>
    </aside>


    <footer class="footer">
      Built with CSS Grid Named Areas
    </footer>

  </main>

</body>
</html>
