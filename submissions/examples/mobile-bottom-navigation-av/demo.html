<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Mobile Bottom Navigation • EaseMotion CSS</title>

    <link rel="stylesheet" href="../../easemotion.css" />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="phone">
      <div class="screen">
        <div class="hero">
          <span class="badge"> MOBILE UI </span>

          <h1>Bottom Navigation</h1>

          <p>
            A colorful floating bottom navigation inspired by modern mobile
            applications.
          </p>
        </div>

        <nav class="bottom-nav">
          <button class="nav-item active">
            <span class="icon">🏠</span>
            <span>Home</span>
          </button>

          <button class="nav-item">
            <span class="icon">🔍</span>
            <span>Search</span>
          </button>

          <button class="nav-item">
            <span class="icon">❤️</span>
            <span>Likes</span>
          </button>

          <button class="nav-item">
            <span class="icon">👤</span>
            <span>Profile</span>
          </button>
        </nav>
      </div>
    </div>
  </body>
</html>
