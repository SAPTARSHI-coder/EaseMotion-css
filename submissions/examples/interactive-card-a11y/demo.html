<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accessible Interactive Card Demo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <main class="demo-container">
        <h1>Interactive Cards</h1>
        <p>This demo illustrates how to make entirely clickable cards accessible when forced to use non-semantic elements like <code>&lt;div&gt;</code> or <code>&lt;article&gt;</code> instead of a native button.</p>
        
        <div class="cards-grid">
            
            <!-- 
                CRITICAL ACCESSIBILITY: The ARIA Button Pattern
                If you use a <div> as a button, you MUST provide:
                1. role="button" (so screen readers announce it as a button)
                2. tabindex="0" (so it can be focused with the Tab key)
                3. JavaScript handlers for Enter AND Space keys (which native buttons have by default)
            -->
            <article 
                class="interactive-card" 
                role="button" 
                tabindex="0" 
                id="custom-card-btn"
                aria-labelledby="card1-title"
                aria-describedby="card1-desc"
            >
                <div class="card-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="2">
                        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
                    </svg>
                </div>
                <div class="card-content">
                    <h2 id="card1-title" class="card-title">Favorite Item</h2>
                    <p id="card1-desc" class="card-desc">Click or press Enter/Space to add this item to your favorites.</p>
                </div>
            </article>

        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const customCard = document.getElementById('custom-card-btn');

            // Action to perform when activated
            function triggerCardAction() {
                customCard.classList.toggle('is-activated');
                
                // Example of providing feedback
                const isActivated = customCard.classList.contains('is-activated');
                if(isActivated) {
                    customCard.setAttribute('aria-pressed', 'true');
                } else {
                    customCard.setAttribute('aria-pressed', 'false');
                }
            }

            // Mouse/Touch Activation
            customCard.addEventListener('click', triggerCardAction);

            // CRITICAL ACCESSIBILITY: Keyboard Activation
            // Native <button> elements automatically trigger 'click' events when Enter or Space is pressed.
            // Elements with role="button" DO NOT. You must write this logic manually.
            customCard.addEventListener('keydown', (event) => {
                // Check if the pressed key is Enter or Space
                if (event.key === 'Enter' || event.key === ' ') {
                    // Prevent default behavior (Space normally scrolls the page down)
                    event.preventDefault(); 
                    triggerCardAction();
                }
            });
        });
    </script>
</body>
</html>
