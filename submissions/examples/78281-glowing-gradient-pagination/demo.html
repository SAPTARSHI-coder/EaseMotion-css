<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Responsive glowing pagination with gradient styling"
  >
  <title>Glowing Gradient Pagination</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section class="pagination-demo" aria-labelledby="pagination-title">
      <div class="intro">
        <span class="eyebrow">EASEMOTION CSS</span>
        <h1 id="pagination-title">Glowing Pagination</h1>
        <p>
          A responsive pagination component featuring gradient accents,
          subtle glow effects, smooth hover transitions, and accessible
          keyboard focus states.
        </p>
      </div>

      <nav class="pagination" aria-label="Pagination">
        <a
          class="page-control"
          href="#"
          aria-label="Previous page"
        >
          <span aria-hidden="true">‹</span>
        </a>

        <a
          class="page-number active"
          href="#page-1"
          aria-current="page"
        >
          1
        </a>

        <a class="page-number" href="#page-2">2</a>
        <a class="page-number" href="#page-3">3</a>

        <span class="dots" aria-hidden="true">•••</span>

        <a class="page-number" href="#page-8">8</a>
        <a class="page-number" href="#page-9">9</a>
        <a class="page-number" href="#page-10">10</a>

        <a
          class="page-control"
          href="#"
          aria-label="Next page"
        >
          <span aria-hidden="true">›</span>
        </a>
      </nav>

      <div class="status">
        <span>Showing</span>
        <strong>1–10</strong>
        <span>of</span>
        <strong>100</strong>
        <span>results</span>
      </div>
    </section>
  </main>
</body>
</html>
