<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />
  <meta
    name="description"
    content="Animated Audio Player Widget with Claymorphism styling"
  />
  <title>Animated Audio Player</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main class="page">
    <section
      class="audio-player"
      aria-label="Audio player"
    >
      <div class="player-header">
        <span class="eyebrow">NOW PLAYING</span>
        <button
          class="icon-button"
          type="button"
          aria-label="More audio options"
        >
          <span aria-hidden="true">•••</span>
        </button>
      </div>

      <div class="album-art" aria-hidden="true">
        <div class="album-orb"></div>
        <div class="album-ring"></div>
      </div>

      <div class="track-info">
        <h1>Midnight Dreams</h1>
        <p>Ambient Waves</p>
      </div>

      <div class="waveform" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
      </div>

      <div class="progress-area">
        <div
          class="progress-track"
          role="progressbar"
          aria-label="Audio progress"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="42"
        >
          <div class="progress-fill"></div>
          <div class="progress-thumb"></div>
        </div>

        <div class="time">
          <span>01:42</span>
          <span>04:08</span>
        </div>
      </div>

      <div class="controls">
        <button
          class="control-button"
          type="button"
          aria-label="Previous track"
        >
          <span aria-hidden="true">|◀</span>
        </button>

        <button
          class="play-button"
          type="button"
          aria-label="Play audio"
        >
          <span aria-hidden="true">▶</span>
        </button>

        <button
          class="control-button"
          type="button"
          aria-label="Next track"
        >
          <span aria-hidden="true">▶|</span>
        </button>
      </div>

      <div class="player-footer">
        <span>♫ High quality audio</span>
        <span>2:26 remaining</span>
      </div>
    </section>
  </main>
</body>
</html>
