<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fountain Pen Nib Flex — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Fountain Pen Nib Flex demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Fountain Pen Nib Flex</h1>
      <p class="lede">Fountain pen nib flexing as ink feeds the line</p>
    </header>

    <section class="ease-fountain-pen-nib-flex" data-demo="fountain-pen-nib-flex" aria-live="polite">
      <div class="ease-fountain-pen-nib-flex__housing">
        <div class="ease-fountain-pen-nib-flex__bezel">
          <div class="ease-fountain-pen-nib-flex__face">
            <div class="ease-fountain-pen-nib-flex__readout">
              <span class="ease-fountain-pen-nib-flex__label">Fountain Pen Nib Flex</span>
              <span class="ease-fountain-pen-nib-flex__value">LIVE</span>
            </div>
            <div class="ease-fountain-pen-nib-flex__motion" aria-hidden="true">
              <span class="ease-fountain-pen-nib-flex__a"></span>
              <span class="ease-fountain-pen-nib-flex__b"></span>
              <span class="ease-fountain-pen-nib-flex__c"></span>
              <span class="ease-fountain-pen-nib-flex__d"></span>
            </div>
            <div class="ease-fountain-pen-nib-flex__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-fountain-pen-nib-flex__controls">
          <button type="button" class="ease-fountain-pen-nib-flex__btn primary">Engage</button>
          <button type="button" class="ease-fountain-pen-nib-flex__btn">Reset</button>
          <label class="ease-fountain-pen-nib-flex__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-fountain-pen-nib-flex__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
