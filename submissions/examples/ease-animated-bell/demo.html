<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notification Bell Demo - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="ease-bell">
    <button class="ease-bell__icon ease-bell__icon--ringing" aria-label="Notifications" aria-expanded="false" onclick="toggleBell(this)">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
      <span class="ease-bell__badge ease-bell__badge--pulse">3</span>
    </button>
    <div class="ease-bell__dropdown" id="bell-dropdown">
      <div class="ease-bell__item ease-bell__item--unread"><strong>New Feature</strong><br>Check out the new CSS animations!</div>
      <div class="ease-bell__item ease-bell__item--unread"><strong>Pull Request Merged</strong><br>Your component was added.</div>
      <div class="ease-bell__item"><strong>System Update</strong><br>Scheduled maintenance at midnight.</div>
    </div>
  </div>

  <script>
    function toggleBell(btn) {
      const dropdown = document.getElementById('bell-dropdown');
      const isExpanded = btn.getAttribute('aria-expanded') === 'true';
      btn.setAttribute('aria-expanded', !isExpanded);
      dropdown.classList.toggle('ease-bell__dropdown--open');
      btn.classList.remove('ease-bell__icon--ringing');
    }
  </script>

</body>
</html>
