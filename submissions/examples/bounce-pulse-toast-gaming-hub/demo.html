<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CSS Bounce-Pulse Toast for Gaming Hub layouts">
  <title>Bounce Pulse Toast - Gaming Hub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="gaming-hub">
    <header class="hero">
      <p class="eyebrow">EASEMOTION CSS</p>
      <h1>Gaming Hub</h1>
      <p class="subtitle">
        A lightweight CSS-only bounce-pulse notification toast.
      </p>
    </header>

    <section class="game-panel" aria-labelledby="status-title">
      <div class="panel-header">
        <span class="status-dot" aria-hidden="true"></span>
        <h2 id="status-title">Game Status</h2>
      </div>

      <p>Player session is active and ready.</p>

      <div class="stats">
        <div class="stat">
          <span class="stat-value">24</span>
          <span class="stat-label">Players</span>
        </div>

        <div class="stat">
          <span class="stat-value">08</span>
          <span class="stat-label">Matches</span>
        </div>

        <div class="stat">
          <span class="stat-value">12</span>
          <span class="stat-label">Wins</span>
        </div>
      </div>
    </section>

    <aside class="toast" role="status" aria-live="polite">
      <span class="toast-icon" aria-hidden="true">✓</span>

      <div class="toast-content">
        <strong>Match Found!</strong>
        <span>Your gaming session is ready to start.</span>
      </div>

      <span class="toast-pulse" aria-hidden="true"></span>
    </aside>
  </main>

</body>
</html>
