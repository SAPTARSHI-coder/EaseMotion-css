<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Solar Flare Radial Particles - EaseMotion CSS</title>
  <!-- Import EaseMotion CSS -->
  <link rel="stylesheet" href="../../../easemotion.css">
  <!-- Component Specific Styles -->
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="minimalist-bg">

  <div class="demo-container">
    
    <div class="header-section">
      <h1 class="ease-text-3xl">Solar Flare Radial Particles</h1>
      <p class="ease-color-muted">A hardware-accelerated, pure CSS particle explosion simulating a glowing solar core and radiant flares. Powered entirely by CSS transforms and layered animations.</p>
    </div>

    <!-- The Particle System Component -->
    <div class="space-viewport" aria-label="Animated solar flare particle effect" role="img">
      
      <div class="solar-system">
        
        <!-- Layer 1: Clockwise Flares -->
        <div class="flare-engine rotate-cw">
          <!-- 12 Tracks mapped radially -->
          <div class="track tr-1"><div class="particle p-1"></div><div class="particle p-2"></div></div>
          <div class="track tr-2"><div class="particle p-1"></div><div class="particle p-2"></div></div>
          <div class="track tr-3"><div class="particle p-1"></div><div class="particle p-2"></div></div>
          <div class="track tr-4"><div class="particle p-1"></div><div class="particle p-2"></div></div>
          <div class="track tr-5"><div class="particle p-1"></div><div class="particle p-2"></div></div>
          <div class="track tr-6"><div class="particle p-1"></div><div class="particle p-2"></div></div>
          <div class="track tr-7"><div class="particle p-1"></div><div class="particle p-2"></div></div>
          <div class="track tr-8"><div class="particle p-1"></div><div class="particle p-2"></div></div>
          <div class="track tr-9"><div class="particle p-1"></div><div class="particle p-2"></div></div>
          <div class="track tr-10"><div class="particle p-1"></div><div class="particle p-2"></div></div>
          <div class="track tr-11"><div class="particle p-1"></div><div class="particle p-2"></div></div>
          <div class="track tr-12"><div class="particle p-1"></div><div class="particle p-2"></div></div>
        </div>

        <!-- Layer 2: Counter-Clockwise Flares (Density) -->
        <div class="flare-engine rotate-ccw">
          <div class="track tr-1"><div class="particle p-3"></div></div>
          <div class="track tr-3"><div class="particle p-3"></div></div>
          <div class="track tr-5"><div class="particle p-3"></div></div>
          <div class="track tr-7"><div class="particle p-3"></div></div>
          <div class="track tr-9"><div class="particle p-3"></div></div>
          <div class="track tr-11"><div class="particle p-3"></div></div>
        </div>

        <!-- The Sun Core -->
        <div class="solar-core"></div>
        
      </div>
      
    </div>

  </div>

</body>
</html>
