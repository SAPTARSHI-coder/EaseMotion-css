<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ease-elastic-tabs-sap demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f4f4f5;
    }
  </style>
</head>
<body>

  <div class="elastic-tabs-sap" id="tabs">
    <div class="tab-indicator" id="indicator"></div>
    <button class="tab-btn active">Overview</button>
    <button class="tab-btn">Features</button>
    <button class="tab-btn">Pricing</button>
    <button class="tab-btn">FAQ</button>
  </div>

  <script>
    const wrap = document.getElementById('tabs');
    const indicator = document.getElementById('indicator');
    const buttons = [...wrap.querySelectorAll('.tab-btn')];

    function moveIndicator(btn) {
      indicator.style.width = btn.offsetWidth + 'px';
      indicator.style.transform = `translateX(${btn.offsetLeft - 6}px)`;
    }

    buttons.forEach(btn => {
      btn.addEventListener('click', () => {
        buttons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        moveIndicator(btn);
      });
    });

    moveIndicator(buttons[0]);
  </script>

</body>
</html>
