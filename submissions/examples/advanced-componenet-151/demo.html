<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pure CSS Advanced Interactive Toggle Card - Iteration 151</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="em-wrapper-151">
    <div class="em-card-151">
      <input type="checkbox" id="em-toggle-151" class="em-checkbox-151" aria-label="Toggle card mode">
      
      <div class="em-card-inner-151">
        <!-- Front View -->
        <div class="em-card-face-151 em-face-front-151">
          <span class="em-badge-151">Iteration 151</span>
          <h3 class="em-title-151">Interactive Mode</h3>
          <p class="em-text-151">Pure CSS animated toggle card built using CSS design tokens and smooth state management.</p>
          <label for="em-toggle-151" class="em-btn-151" role="button">Switch View</label>
        </div>

        <!-- Back View -->
        <div class="em-card-face-151 em-face-back-151">
          <span class="em-badge-151 em-badge-alt-151">Expanded State</span>
          <h3 class="em-title-151">Advanced Performance</h3>
          <p class="em-text-151">Zero JS runtime, hardware-accelerated 3D transform transitions, and full accessibility support.</p>
          <label for="em-toggle-151" class="em-btn-151 em-btn-alt-151" role="button">Go Back</label>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
