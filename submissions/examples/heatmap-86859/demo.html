<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Activity Heatmap</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="panel">
      <header class="panel__header">
        <div>
          <p class="eyebrow">Team activity</p>
          <h1>1,284 contributions</h1>
        </div>
        <span class="period">Last 12 weeks</span>
      </header>

      <section class="chart" aria-label="Contribution activity heatmap">
        <div class="weekdays" aria-hidden="true">
          <span>Mon</span><span>Wed</span><span>Fri</span>
        </div>
        <div class="heatmap">
          <button class="cell level-1" aria-label="1 contribution"></button>
          <button class="cell level-3" aria-label="8 contributions"></button>
          <button class="cell level-2" aria-label="4 contributions"></button>
          <button class="cell level-4" aria-label="14 contributions"></button>
          <button class="cell level-1" aria-label="2 contributions"></button>
          <button class="cell level-2" aria-label="5 contributions"></button>
          <button class="cell level-0" aria-label="No contributions"></button>
          <button class="cell level-3" aria-label="9 contributions"></button>
          <button class="cell level-4" aria-label="16 contributions"></button>
          <button class="cell level-2" aria-label="6 contributions"></button>
          <button class="cell level-1" aria-label="2 contributions"></button>
          <button class="cell level-3" aria-label="10 contributions"></button>
          <button class="cell level-0" aria-label="No contributions"></button>
          <button class="cell level-2" aria-label="5 contributions"></button>
          <button class="cell level-4" aria-label="18 contributions"></button>
          <button class="cell level-3" aria-label="11 contributions"></button>
          <button class="cell level-1" aria-label="3 contributions"></button>
          <button class="cell level-0" aria-label="No contributions"></button>
          <button class="cell level-2" aria-label="7 contributions"></button>
          <button class="cell level-3" aria-label="9 contributions"></button>
          <button class="cell level-1" aria-label="2 contributions"></button>
          <button class="cell level-4" aria-label="15 contributions"></button>
          <button class="cell level-2" aria-label="5 contributions"></button>
          <button class="cell level-0" aria-label="No contributions"></button>
          <button class="cell level-3" aria-label="12 contributions"></button>
          <button class="cell level-1" aria-label="3 contributions"></button>
          <button class="cell level-2" aria-label="6 contributions"></button>
          <button class="cell level-4" aria-label="19 contributions"></button>
          <button class="cell level-3" aria-label="10 contributions"></button>
          <button class="cell level-1" aria-label="1 contribution"></button>
          <button class="cell level-0" aria-label="No contributions"></button>
          <button class="cell level-2" aria-label="5 contributions"></button>
          <button class="cell level-3" aria-label="8 contributions"></button>
          <button class="cell level-4" aria-label="17 contributions"></button>
          <button class="cell level-2" aria-label="6 contributions"></button>
          <button class="cell level-1" aria-label="2 contributions"></button>
          <button class="cell level-3" aria-label="11 contributions"></button>
          <button class="cell level-0" aria-label="No contributions"></button>
          <button class="cell level-1" aria-label="3 contributions"></button>
          <button class="cell level-4" aria-label="20 contributions"></button>
          <button class="cell level-2" aria-label="7 contributions"></button>
          <button class="cell level-3" aria-label="9 contributions"></button>
        </div>
      </section>

      <footer class="legend">
        <span>Less</span>
        <i class="level-0"></i><i class="level-1"></i><i class="level-2"></i>
        <i class="level-3"></i><i class="level-4"></i>
        <span>More</span>
      </footer>
    </main>
  </body>
</html>
