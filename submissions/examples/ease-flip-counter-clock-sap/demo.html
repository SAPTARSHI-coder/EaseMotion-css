<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ease-flip-counter-clock-sap demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f172a;
    }
  </style>
</head>
<body>

  <div class="flip-clock-sap" id="clock">
    <div class="flip-unit">
      <div class="flip-digits" data-unit="hours"></div>
      <span class="flip-label">Hours</span>
    </div>
    <div class="flip-unit">
      <div class="flip-digits" data-unit="minutes"></div>
      <span class="flip-label">Minutes</span>
    </div>
    <div class="flip-unit">
      <div class="flip-digits" data-unit="seconds"></div>
      <span class="flip-label">Seconds</span>
    </div>
  </div>

  <script>
    const units = {
      hours: document.querySelector('[data-unit="hours"]'),
      minutes: document.querySelector('[data-unit="minutes"]'),
      seconds: document.querySelector('[data-unit="seconds"]')
    };
    const lastValues = { hours: '', minutes: '', seconds: '' };

    function renderDigit(container, char, changed) {
      container.innerHTML = `<div class="flip-card"><div class="flip-face${changed ? ' top' : ''}">${char}</div></div>`;
    }

    function updateClock() {
      const now = new Date();
      const parts = {
        hours: String(now.getHours()).padStart(2, '0'),
        minutes: String(now.getMinutes()).padStart(2, '0'),
        seconds: String(now.getSeconds()).padStart(2, '0')
      };

      Object.keys(parts).forEach(key => {
        if (parts[key] !== lastValues[key]) {
          units[key].innerHTML = '';
          [...parts[key]].forEach(ch => {
            const wrap = document.createElement('div');
            wrap.className = 'flip-card';
            wrap.innerHTML = `<div class="flip-face top">${ch}</div>`;
            units[key].appendChild(wrap);
          });
          lastValues[key] = parts[key];
        }
      });
    }

    updateClock();
    setInterval(updateClock, 1000);
  </script>

</body>
</html>
