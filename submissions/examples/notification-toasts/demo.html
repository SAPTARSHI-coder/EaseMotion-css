<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notification Toasts - EaseMotion CSS</title>
    
    <!-- Google Fonts (Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    
    <!-- EaseMotion CSS CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    
    <!-- Local Custom Styles -->
    <link rel="stylesheet" href="style.css" />
</head>
<body class="ease-center">

    <!-- Demo Container with Staggered Entrance -->
    <div class="demo-container ease-fade-in">
        <h1 class="ease-slide-up ease-delay-100">Notification Toasts</h1>
        <p class="ease-slide-up ease-delay-200">Click the buttons below to trigger animated toast notifications.</p>
        
        <div class="button-group ease-slide-up ease-delay-300">
            <button class="ease-btn ease-btn-primary ease-hover-lift" onclick="showToast('success')">
                ✅ Success Toast
            </button>
            <button class="ease-btn ease-btn-warning ease-hover-lift" onclick="showToast('warning')">
                ⚠️ Warning Toast
            </button>
            <button class="ease-btn ease-btn-danger ease-hover-lift" onclick="showToast('error')">
                ❌ Error Toast
            </button>
        </div>
    </div>

    <!-- Toast Container (Fixed Position) -->
    <div id="toast-container" class="toast-container"></div>

    <script>
        function showToast(type) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            const messages = {
                success: { title: 'Success!', text: 'Your action was completed successfully.', icon: '✅' },
                warning: { title: 'Warning!', text: 'Please check your input and try again.', icon: '⚠️' },
                error: { title: 'Error!', text: 'Something went wrong. Please contact support.', icon: '❌' }
            };
            
            const data = messages[type];
            
            // Applying EaseMotion classes for entrance and hover interaction
            toast.className = `toast toast-${type} ease-slide-in-right ease-duration-fast ease-hover-lift`;
            toast.innerHTML = `
                <span class="toast-icon">${data.icon}</span>
                <div class="toast-content">
                    <strong>${data.title}</strong>
                    <p>${data.text}</p>
                </div>
                <button class="toast-close" onclick="this.parentElement.remove()" aria-label="Close notification">×</button>
            `;
            
            container.appendChild(toast);
            
            // Auto-remove after 4 seconds with a smooth fade/slide-out transition
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(100%)';
                toast.style.transition = 'all 0.3s ease-in-out';
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }
    </script>
</body>
</html>
