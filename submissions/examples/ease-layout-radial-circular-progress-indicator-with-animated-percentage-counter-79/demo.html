<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Accessible Progress Indicator</title>

<link rel="stylesheet" href="style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

</head>

<body>

<section class="wrapper">

<div class="card">

<div
class="progress"
role="progressbar"
aria-valuemin="0"
aria-valuemax="100"
aria-valuenow="82">

<div class="inner">

<h2>82%</h2>

<p>Completed</p>

</div>

</div>

<h3>

Accessibility Score

</h3>

<p>

High-contrast radial progress indicator designed for readable dashboards and analytics interfaces.

</p>

</div>

</section>

</body>

</html>
