<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scroll-Driven Kinetic Typography - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="ease-scroll-wrapper">
    <div class="ease-sticky-container">
      <!-- Top Track (Moves Left) -->
      <div class="ease-marquee-track ease-track-left">
        <div class="ease-marquee-text ease-text-outline">Kinetic Typography</div>
        <div class="ease-marquee-text ease-text-filled">Kinetic Typography</div>
        <div class="ease-marquee-text ease-text-outline">Kinetic Typography</div>
        <div class="ease-marquee-text ease-text-filled">Kinetic Typography</div>
      </div>
      <!-- Middle Track (Moves Right & Warps) -->
      <div class="ease-marquee-track ease-track-right ease-warp-text">
        <div class="ease-marquee-text ease-text-gradient">Zero JavaScript</div>
        <div class="ease-marquee-text ease-text-gradient">Zero JavaScript</div>
        <div class="ease-marquee-text ease-text-gradient">Zero JavaScript</div>
        <div class="ease-marquee-text ease-text-gradient">Zero JavaScript</div>
      </div>
      <!-- Bottom Track (Moves Left) -->
      <div class="ease-marquee-track ease-track-left">
        <div class="ease-marquee-text ease-text-filled">Scroll Driven</div>
        <div class="ease-marquee-text ease-text-outline">Scroll Driven</div>
        <div class="ease-marquee-text ease-text-filled">Scroll Driven</div>
        <div class="ease-marquee-text ease-text-outline">Scroll Driven</div>
      </div>
      <div class="ease-scroll-indicator">Scroll to Animate</div>
    </div>
  </main>
</body>
</html>
