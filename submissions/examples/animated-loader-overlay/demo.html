<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>Animated Loader Overlay</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="demo-content">
    <span class="demo-label">EaseMotion CSS</span>
    <h1>Animated Loader Overlay</h1>
    <p>
      A full-page loading overlay created using pure CSS.
    </p>
  </main>

  <!--
    The overlay is CSS-only.
    The animation automatically fades the loader out after loading.
  -->
  <div
    class="loader-overlay"
    role="status"
    aria-label="Loading"
  >
    <div class="loader" aria-hidden="true"></div>
    <p class="loader-text">Loading...</p>
  </div>

</body>
</html>
