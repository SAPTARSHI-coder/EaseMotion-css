<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Light Beam Cursor · Illuminates Dark Areas</title>

    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <!-- === LIGHT BEAM CURSOR === -->
    <canvas id="lightCanvas"></canvas>

    <!-- === CONTENT === -->
    <div class="card">
        <h2>🔦 Light Beam Cursor</h2>
        <p class="sub">emits beam that illuminates dark areas</p>

        <div class="cursor-demo-area">
            <p>Move your mouse around</p>
            <div class="interactive-hint">
                <i class="fas fa-mouse-pointer"></i>
                <span>Watch the light reveal</span>
            </div>
            <div class="demo-buttons">
                <button class="demo-btn">Hover me</button>
                <button class="demo-btn">Click me</button>
                <button class="demo-btn">Light!</button>
            </div>
        </div>

        <p style="margin-top: 1.5rem; font-size: 0.85rem; color: #64748b;">
            Move your mouse · watch the light beam illuminate the darkness
        </p>
    </div>

    <!-- Embedded JavaScript -->
    <script>
        (function() {
            'use strict';

            const canvas = document.getElementById('lightCanvas');
            const ctx = canvas.getContext('2d');

            let mouseX = 0;
            let mouseY = 0;
            let isVisible = false;
            let particles = [];

            // --- Resize canvas ---
            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            // --- Create light particle ---
            function createLightParticle(x, y) {
                const angle = Math.random() * 2 * Math.PI;
                const speed = 0.5 + Math.random() * 1.5;
                const size = 2 + Math.random() * 4;
                const life = 0.6 + Math.random() * 0.4;
                const hue = 40 + Math.random() * 20;

                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed - 0.5,
                    size: size,
                    life: life,
                    maxLife: life,
                    hue: hue,
                });
            }

            // --- Update and draw light ---
            function render() {
                // Clear canvas (dark overlay)
                ctx.fillStyle = 'rgba(10, 14, 26, 0.95)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Draw content through light beam
                if (isVisible) {
                    // Main light beam (large circle)
                    const gradient = ctx.createRadialGradient(mouseX, mouseY, 0, mouseX, mouseY, 180);
                    gradient.addColorStop(0, 'rgba(255, 255, 240, 0.15)');
                    gradient.addColorStop(0.3, 'rgba(255, 255, 220, 0.08)');
                    gradient.addColorStop(0.6, 'rgba(200, 220, 255, 0.04)');
                    gradient.addColorStop(1, 'rgba(255, 255, 255, 0)');
                    ctx.fillStyle = gradient;
                    ctx.beginPath();
                    ctx.arc(mouseX, mouseY, 180, 0, Math.PI * 2);
                    ctx.fill();

                    // Inner glow
                    const innerGlow = ctx.createRadialGradient(mouseX, mouseY, 0, mouseX, mouseY, 60);
                    innerGlow.addColorStop(0, 'rgba(255, 255, 240, 0.3)');
                    innerGlow.addColorStop(0.5, 'rgba(255, 255, 220, 0.15)');
                    innerGlow.addColorStop(1, 'rgba(255, 255, 255, 0)');
                    ctx.fillStyle = innerGlow;
                    ctx.beginPath();
                    ctx.arc(mouseX, mouseY, 60, 0, Math.PI * 2);
                    ctx.fill();

                    // Light particles
                    for (let i = 0; i < 2; i++) {
                        createLightParticle(
                            mouseX + (Math.random() - 0.5) * 20,
                            mouseY + (Math.random() - 0.5) * 20
                        );
                    }

                    // Update and draw particles
                    for (let i = particles.length - 1; i >= 0; i--) {
                        const p = particles[i];
                        p.x += p.vx;
                        p.y += p.vy;
                        p.life -= 0.005;

                        if (p.life <= 0) {
                            particles.splice(i, 1);
                            continue;
                        }

                        const alpha = p.life / p.maxLife;
                        const size = p.size * (0.5 + alpha * 0.5);

                        ctx.beginPath();
                        ctx.arc(p.x, p.y, size, 0, Math.PI * 2);
                        ctx.fillStyle = `hsla(${p.hue}, 100%, 70%, ${alpha * 0.3})`;
                        ctx.fill();

                        // Particle glow
                        ctx.shadowColor = `hsla(${p.hue}, 100%, 60%, ${alpha * 0.15})`;
                        ctx.shadowBlur = 15;
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, size * 0.5, 0, Math.PI * 2);
                        ctx.fillStyle = `hsla(${p.hue}, 100%, 80%, ${alpha * 0.15})`;
                        ctx.fill();
                        ctx.shadowBlur = 0;
                    }

                    // Light beam rays
                    for (let i = 0; i < 8; i++) {
                        const angle = (i / 8) * Math.PI * 2 + Date.now() * 0.0002;
                        const distance = 60 + Math.sin(Date.now() * 0.002 + i) * 20;
                        const x = mouseX + Math.cos(angle) * distance;
                        const y = mouseY + Math.sin(angle) * distance;
                        const rayGrad = ctx.createRadialGradient(x, y, 0, x, y, 30);
                        rayGrad.addColorStop(0, `rgba(255, 255, 220, ${0.03 + Math.sin(Date.now() * 0.003 + i) * 0.01})`);
                        rayGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');
                        ctx.fillStyle = rayGrad;
                        ctx.beginPath();
                        ctx.arc(x, y, 30, 0, Math.PI * 2);
                        ctx.fill();
                    }

                    // Cursor glow
                    const cursorGlow = ctx.createRadialGradient(mouseX, mouseY, 0, mouseX, mouseY, 15);
                    cursorGlow.addColorStop(0, 'rgba(255, 255, 240, 0.4)');
                    cursorGlow.addColorStop(1, 'rgba(255, 255, 255, 0)');
                    ctx.fillStyle = cursorGlow;
                    ctx.beginPath();
                    ctx.arc(mouseX, mouseY, 15, 0, Math.PI * 2);
                    ctx.fill();
                }

                requestAnimationFrame(render);
            }

            // --- Mouse move ---
            document.addEventListener('mousemove', function(e) {
                mouseX = e.clientX;
                mouseY = e.clientY;
                isVisible = true;
            });

            // --- Touch support ---
            document.addEventListener('touchmove', function(e) {
                e.preventDefault();
                const touch = e.touches[0];
                mouseX = touch.clientX;
                mouseY = touch.clientY;
                isVisible = true;
            }, { passive: false });

            document.addEventListener('touchstart', function(e) {
                const touch = e.touches[0];
                mouseX = touch.clientX;
                mouseY = touch.clientY;
                isVisible = true;
            });

            // --- Mouse leave ---
            document.addEventListener('mouseleave', function() {
                isVisible = false;
            });

            // --- Mouse enter ---
            document.addEventListener('mouseenter', function() {
                isVisible = true;
            });

            // --- Click burst ---
            document.addEventListener('click', function(e) {
                const x = e.clientX;
                const y = e.clientY;

                for (let i = 0; i < 30; i++) {
                    const angle = Math.random() * 2 * Math.PI;
                    const dist = 30 + Math.random() * 80;
                    const px = x + Math.cos(angle) * dist;
                    const py = y + Math.sin(angle) * dist;
                    for (let j = 0; j < 2; j++) {
                        createLightParticle(px + (Math.random() - 0.5) * 10, py + (Math.random() - 0.5) * 10);
                    }
                }
                console.log('🔦 Light burst!');
            });

            // --- Hover effects ---
            const interactiveElements = document.querySelectorAll('a, button, .demo-btn, .interactive-hint');
            interactiveElements.forEach(el => {
                el.addEventListener('mouseenter', function() {
                    const rect = this.getBoundingClientRect();
                    const cx = rect.left + rect.width / 2;
                    const cy = rect.top + rect.height / 2;

                    for (let i = 0; i < 15; i++) {
                        const angle = Math.random() * 2 * Math.PI;
                        const dist = 15 + Math.random() * 40;
                        const px = cx + Math.cos(angle) * dist;
                        const py = cy + Math.sin(angle) * dist;
                        createLightParticle(px + (Math.random() - 0.5) * 8, py + (Math.random() - 0.5) * 8);
                    }
                });
            });

            // --- Start render ---
            render();

            console.log('🔦 Light beam cursor initialized!');

        })();
    </script>

</body>
</html>
