<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Walk Simulation - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css"></head><body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030712; color: #ffffff;">

    <div class="ease-card ease-card-glass qwalk-container">
        <div class="qwalk-header">
            <h2>Quantum Walk</h2>
            <span class="ease-badge ease-badge-success">Walking</span>
        </div>
        
        <div class="qwalk-screen ease-center">
            <div class="qwalk-flux flux-qwalk-a"></div>
            <div class="qwalk-flux flux-qwalk-b"></div>
            <div class="qwalk-boundary-ring"></div>
            <div class="qwalk-core ease-center"></div>
        </div>

        <div class="qwalk-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Coin Operator &amp; Shift Dispersal</span>
            <button class="ease-btn ease-btn-success ease-btn-sm ease-hover-grow">Run Quantum Walk</button>
        </div>
    </div></body></html>
