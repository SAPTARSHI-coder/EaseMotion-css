<!-- EaseMotion component: subway-line-map -->
<!DOCTYPE html>
<html lang="en" data-sub="line">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=0.9">
<title>Ease Subway Line Map</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="subway-map">
  <header class="metro-head">
    <span class="metro-line">LINE 6</span>
    <span class="metro-next">NEXT: RIVERSIDE</span>
  </header>
  <div class="metro-board">
    <span class="metro-route"></span>
    <span class="metro-train"></span>
    <span class="metro-station st-1"></span>
    <span class="metro-station st-2"></span>
    <span class="metro-station st-3"></span>
    <span class="metro-station st-4"></span>
    <span class="metro-station st-5"></span>
    <span class="metro-station st-6"></span>
  </div>
  <footer class="metro-foot">
    <span class="metro-platform">PLATFORM 3</span>
    <span class="metro-gap">2 STOPS</span>
  </footer>
</main>
</body>
</html>
