<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ease-animated-progress-steps-sap demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { height: 100vh; margin: 0; display: flex; flex-direction: column; gap: 20px; align-items: center; justify-content: center; background: #f4f4f5; font-family: system-ui, sans-serif; }
    button { padding: 8px 16px; border-radius: 8px; border: none; background: #111; color: #fff; cursor: pointer; }
  </style>
</head>
<body>
  <div class="progress-steps-sap" id="steps">
    <div class="ps-step done"><div class="ps-circle">✓</div><span class="ps-label">Cart</span></div>
    <div class="ps-line filled"></div>
    <div class="ps-step done"><div class="ps-circle">✓</div><span class="ps-label">Shipping</span></div>
    <div class="ps-line"></div>
    <div class="ps-step"><div class="ps-circle">3</div><span class="ps-label">Payment</span></div>
    <div class="ps-line"></div>
    <div class="ps-step"><div class="ps-circle">4</div><span class="ps-label">Confirm</span></div>
  </div>
  <button id="nextBtn">Next Step</button>
  <script>
    const steps = [...document.querySelectorAll('.ps-step')];
    const lines = [...document.querySelectorAll('.ps-line')];
    document.getElementById('nextBtn').addEventListener('click', () => {
      const idx = steps.findIndex(s => !s.classList.contains('done'));
      if (idx === -1) return;
      steps[idx].classList.add('done');
      steps[idx].querySelector('.ps-circle').textContent = '✓';
      if (lines[idx - 1]) lines[idx - 1].classList.add('filled');
    });
  </script>
</body>
</html>
