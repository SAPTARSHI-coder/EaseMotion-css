<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.6">
<title>Accordion Squeeze Box</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="squeezebox">
  <header class="squeeze-head">
    <h1 class="squeeze-name">BERLIN BOX</h1>
    <p class="squeeze-tune">WALTZ</p>
  </header>
  <section class="squeeze-body" aria-label="Accordion with bellows">
    <div class="right-board">
      <div class="key-row">
        <button class="key key-1" type="button">1</button>
        <button class="key key-2" type="button">2</button>
        <button class="key key-3" type="button">3</button>
        <button class="key key-4" type="button">4</button>
        <button class="key key-5" type="button">5</button>
      </div>
      <span class="grille"></span>
    </div>
    <div class="bellows">
      <span class="fold fold-a"></span>
      <span class="fold fold-b"></span>
      <span class="fold fold-c"></span>
      <span class="fold fold-d"></span>
      <span class="fold fold-e"></span>
    </div>
    <div class="left-board">
      <span class="bass bass-1"></span>
      <span class="bass bass-2"></span>
      <span class="bass bass-3"></span>
      <span class="bass bass-4"></span>
    </div>
  </section>
  <footer class="squeeze-foot">
    <span class="squeeze-strap">STRAP</span>
    <span class="squeeze-note">C MAJ</span>
  </footer>
</main>
</body>
</html>
