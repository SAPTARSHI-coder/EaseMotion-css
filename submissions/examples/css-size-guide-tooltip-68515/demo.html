<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Size Guide Tooltip</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="product-card">
    <h2>Classic Cotton T-Shirt</h2>
    <p class="subtitle">Choose your size</p>

    <div class="size-selector">
      <button>XS</button>
      <button>S</button>
      <button class="active">M</button>
      <button>L</button>
      <button>XL</button>

      <div class="tooltip-wrapper">
        <button
          class="size-guide-trigger"
          aria-label="Open size guide"
        >
          Size Guide
        </button>

        <div class="size-tooltip">
          <h3>Size Chart</h3>

          <table>
            <thead>
              <tr>
                <th>Size</th>
                <th>Chest</th>
                <th>Waist</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>XS</td>
                <td>34"</td>
                <td>28"</td>
              </tr>
              <tr>
                <td>S</td>
                <td>36"</td>
                <td>30"</td>
              </tr>
              <tr>
                <td>M</td>
                <td>38"</td>
                <td>32"</td>
              </tr>
              <tr>
                <td>L</td>
                <td>42"</td>
                <td>36"</td>
              </tr>
              <tr>
                <td>XL</td>
                <td>46"</td>
                <td>40"</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
