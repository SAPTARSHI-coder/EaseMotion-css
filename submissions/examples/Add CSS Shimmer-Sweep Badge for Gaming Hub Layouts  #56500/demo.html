<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Shimmer-Sweep Badge - Gaming Hub Showcase</title>
  <link rel="stylesheet" href="../../../easemotion.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="gaming-layout" role="main">
    <article class="gaming-card" tabindex="0" aria-labelledby="server-name">
      
      <header class="card-header">
        <h1 id="server-name" class="server-title">APEX // CHRONICLE</h1>
        <!-- Primary Shimmer-Sweep Badge -->
        <span class="ease-badge-shimmer-sweep badge-gold" role="status" tabindex="0" aria-label="Status: Legendary Loot Event Active">
          <span class="badge-dot" aria-hidden="true"></span>
          LEGENDARY EVENT
        </span>
      </header>

      <div class="card-body">
        <div class="status-row">
          <span class="status-label">Tournament Server</span>
          <span class="ease-badge-shimmer-sweep badge-cyan delay-1" tabindex="0">
            NEO-TOKYO 01
          </span>
        </div>

        <div class="status-row">
          <span class="status-label">Competitive Tier</span>
          <span class="ease-badge-shimmer-sweep badge-purple delay-2" tabindex="0">
            GRANDMASTER
          </span>
        </div>

        <div class="status-row">
          <span class="status-label">Live Broadcast</span>
          <span class="ease-badge-shimmer-sweep badge-crimson" tabindex="0">
            <span class="badge-dot" aria-hidden="true"></span>
            STREAM LIVE
          </span>
        </div>
      </div>

      <footer class="card-footer">
        <button class="btn-cyber">Enter Arena ➔</button>
      </footer>

    </article>
  </main>
</body>
</html>
