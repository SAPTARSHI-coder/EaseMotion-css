<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <meta
        name="description"
        content="Solar Flare Radial pure CSS toggle component"
    >
    <title>Solar Flare Radial Toggle</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="page">
        <div class="solar solar-one" aria-hidden="true"></div>
        <div class="solar solar-two" aria-hidden="true"></div>

        <section
            class="toggle-card"
            aria-labelledby="toggle-title"
        >
            <div class="sun" aria-hidden="true">
                <span class="sun-core"></span>
                <span class="ray ray-1"></span>
                <span class="ray ray-2"></span>
                <span class="ray ray-3"></span>
                <span class="ray ray-4"></span>
                <span class="ray ray-5"></span>
                <span class="ray ray-6"></span>
                <span class="ray ray-7"></span>
                <span class="ray ray-8"></span>
            </div>

            <p class="eyebrow">SOLAR CONTROL</p>

            <h1 id="toggle-title">
                Solar Flare
                <span>Radial</span>
            </h1>

            <p class="description">
                Activate the solar field and watch the radial flare
                expand around the control.
            </p>

            <div class="control-area">
                <input
                    class="toggle-input"
                    type="checkbox"
                    id="solar-toggle"
                    aria-label="Activate solar flare"
                >

                <label
                    class="toggle"
                    for="solar-toggle"
                >
                    <span class="toggle-track">
                        <span class="flare flare-1"></span>
                        <span class="flare flare-2"></span>
                        <span class="flare flare-3"></span>
                        <span class="toggle-thumb">
                            <span class="thumb-glow"></span>
                        </span>
                    </span>

                    <span class="toggle-text">
                        <span class="off-text">Solar field offline</span>
                        <span class="on-text">Solar field active</span>
                    </span>
                </label>
            </div>

            <div class="status">
                <span class="status-dot"></span>
                <span>PURE CSS SYSTEM</span>
            </div>
        </section>
    </main>
</body>
</html>
