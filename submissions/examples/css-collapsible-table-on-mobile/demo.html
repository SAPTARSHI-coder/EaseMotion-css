<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Collapsible Table on Mobile - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="em-table-page">
        <div class="em-card" role="region" aria-label="Collapsible Table Showcase" tabindex="0">
            <span class="em-card-badge">RESPONSIVE UI</span>
            <h1 class="em-card-title">Collapsible Table</h1>
            <p class="em-card-desc">A data table that gracefully collapses into individual card layouts on mobile viewports using pure CSS media queries.</p>
            
            <!-- Table Container -->
            <div class="em-table-container">
                <table class="em-responsive-table" role="table" aria-label="User submissions data table">
                    <thead>
                        <tr role="row">
                            <th scope="col">Component</th>
                            <th scope="col">Category</th>
                            <th scope="col">Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr role="row">
                            <td data-label="Component">Origami Card</td>
                            <td data-label="Category">3D Effects</td>
                            <td data-label="Status"><span class="em-status em-success">Active</span></td>
                        </tr>
                        <tr role="row">
                            <td data-label="Component">Custom Highlight</td>
                            <td data-label="Category">Typography</td>
                            <td data-label="Status"><span class="em-status em-success">Active</span></td>
                        </tr>
                        <tr role="row">
                            <td data-label="Component">Conversation Form</td>
                            <td data-label="Category">Forms</td>
                            <td data-label="Status"><span class="em-status em-pending">Pending</span></td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <a href="#" class="em-card-btn" role="button">View All Entries</a>
        </div>
    </div>
</body>
</html>
