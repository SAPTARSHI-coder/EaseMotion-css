<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Glowing search bar input with dark mode styling." />
    <title>Glowing Search Bar | EaseMotion</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <main class="page-shell">
        <section class="search-showcase" aria-labelledby="search-title">
            <div class="showcase-copy">
                <span class="eyebrow">EaseMotion / Input</span>
                <h1 id="search-title">Find what you need.</h1>
                <p>
                    A responsive search input with a subtle neon glow, smooth focus transitions, and dark-mode styling.
                </p>
            </div>

            <form class="search-form" role="search">
                <label class="sr-only" for="site-search">Search</label>

                <div class="search-field">
                    <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="11" cy="11" r="6.5"></circle>
            <path d="m16 16 5 5"></path>
          </svg>

                    <input id="site-search" name="search" type="search" placeholder="Search anything..." autocomplete="off" />

                    <kbd class="shortcut" aria-hidden="true">⌘ K</kbd>

                    <button class="search-button" type="submit" aria-label="Submit search">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 12h13"></path>
              <path d="m13 6 6 6-6 6"></path>
            </svg>
          </button>
                </div>
            </form>

            <div class="search-meta" aria-hidden="true">
                <span class="status-dot"></span>
                <span>Search is ready</span>
                <span class="meta-divider"></span>
                <span>Press Enter to search</span>
            </div>
        </section>
    </main>
</body>

</html>
