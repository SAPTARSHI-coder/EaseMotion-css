<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Float Drift Toast</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="toast-container">

    <div class="toast success">
        <div class="icon">✓</div>
        <div class="content">
            <h3>Mission Completed</h3>
            <p>You earned 250 XP successfully.</p>
        </div>
    </div>

    <div class="toast warning">
        <div class="icon">!</div>
        <div class="content">
            <h3>Connection Warning</h3>
            <p>Network latency is slightly higher.</p>
        </div>
    </div>

    <div class="toast info">
        <div class="icon">★</div>
        <div class="content">
            <h3>Daily Reward</h3>
            <p>Your bonus crate is now available.</p>
        </div>
    </div>

</div>

</body>
</html>
