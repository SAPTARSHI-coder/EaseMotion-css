<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Breathing Animation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="layout-container">
        
        <header class="section-header">
            <h1 class="title">Ambient Breathing Animation</h1>
            <p class="subtitle">A pure CSS slow, rhythmic pulsing animation using smooth transform scaling and opacity easing to simulate a calm breathing effect for ambient UI elements.</p>
        </header>

        <div class="demo-area">
            
            <div class="breathing-stage">
                
                <!-- 
                  [TECHNIQUE] The Breathing Core
                  We separate the animated background element (.breathing-aura) 
                  from the static content (.breathing-content) to ensure text 
                  remains sharp and readable during the scaling animation.
                -->
                
                <div class="breathing-element">
                    <div class="breathing-aura" aria-hidden="true"></div>
                    
                    <div class="breathing-content">
                        <svg viewBox="0 0 24 24" width="32" height="32" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
                        </svg>
                        <span>Processing</span>
                    </div>
                </div>
                
            </div>
            
            <p class="instruction-text">Notice the slow, asymmetric easing curve (inhale/exhale) and dual animation of scale and opacity.</p>
            
        </div>
        
    </div>

</body>
</html>
