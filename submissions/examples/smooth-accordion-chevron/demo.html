<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smooth Accordion Chevron Demo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #fafafa;">

    <div style="text-align: center;">
        <h2 style="color: #222; margin-bottom: 40px;">Smooth Accordion Chevron Layout</h2>
        
        <!-- Interactive Accordion Container Mockup -->
        <div class="accordion-header" style="display: flex; justify-content: space-between; align-items: center; width: 260px; padding: 14px 20px; background: #ffffff; border: 1px solid #e0e0e0; border-radius: 8px; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.05); font-weight: bold; color: #333; margin: 0 auto;">
            Expand Section 
            <!-- Dropdown indicator asset -->
            <span class="chevron" style="transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); color: #007bff;">▼</span>
        </div>
    </div>

</body>
</html>
