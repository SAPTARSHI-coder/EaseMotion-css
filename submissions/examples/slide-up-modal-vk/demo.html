<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slide-Up Modal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<section class="hero">

    <h1>Slide-Up Modal</h1>

    <p>
        A lightweight modal component built with pure HTML and CSS that
        smoothly slides into view.
    </p>

    <a href="#modal" class="open-btn">Open Modal</a>

</section>

<div id="modal" class="modal-overlay">

    <div class="modal">

        <h2>Welcome!</h2>

        <p>
            This modal enters with a smooth slide-up animation using only
            HTML and CSS.
        </p>

        <div class="modal-actions">
            <a href="#" class="btn secondary">Cancel</a>
            <a href="#" class="btn primary">Continue</a>
        </div>

    </div>

</div>

</body>
</html>
