<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive Before/After Image Comparison Slider · EaseMotion</title>
  <meta name="description" content="An interactive split-screen before/after image comparison component with a draggable divider handle and keyboard support." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="demo-page">
    <header class="demo-header">
      <h1 class="demo-title">Before / After</h1>
      <p class="demo-subtitle">Drag the handle — or use <kbd>←</kbd> / <kbd>→</kbd> arrow keys — to compare.</p>
    </header>

    <!-- =========================================================
         BEFORE / AFTER SLIDER COMPONENT
    ========================================================== -->
    <div class="comparison-wrapper">
      <div
        class="comparison"
        id="comparison"
        style="--split: 50%"
        role="img"
        aria-label="Before and after image comparison. Use arrow keys to adjust."
      >

        <!-- AFTER image (bottom layer, always fully visible) -->
        <div class="comparison__after" aria-hidden="true">
          <img
            src="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=900&q=80"
            alt="After: Enhanced landscape photo"
            draggable="false"
          />
          <span class="comparison__label comparison__label--after">After</span>
        </div>

        <!-- BEFORE image (top layer, clipped by --split) -->
        <div class="comparison__before" aria-hidden="true">
          <img
            src="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=900&q=80&sat=-100&bri=-20"
            alt="Before: Original landscape photo"
            draggable="false"
          />
          <span class="comparison__label comparison__label--before">Before</span>
        </div>

        <!-- Divider Handle -->
        <div class="comparison__divider" aria-hidden="true">
          <div class="comparison__handle">
            <!-- Left Arrow -->
            <svg class="handle-arrow handle-arrow--left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
            <!-- Right Arrow -->
            <svg class="handle-arrow handle-arrow--right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
          </div>
        </div>

        <!-- Transparent range input overlay — the real interactive element -->
        <input
          type="range"
          class="comparison__range"
          id="comparison-range"
          min="0"
          max="100"
          value="50"
          step="1"
          aria-label="Image comparison slider"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="50"
        />
      </div>
    </div>

  </main>

  <script src="script.js"></script>
</body>
</html>
