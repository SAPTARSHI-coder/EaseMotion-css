<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stacked Notification Cards</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Stacked Notification Cards</h1>
      <p>Hover over the stack to reveal all notifications.</p>
      <div class="notification-stack">
        <div class="card">
          <span class="icon">🎉</span>
          <div>
            <h3>New Follower</h3>
            <p>Alex started following you.</p>
          </div>
        </div>
        <div class="card">
          <span class="icon">📩</span>
          <div>
            <h3>New Message</h3>
            <p>You received a new message.</p>
          </div>
        </div>
        <div class="card">
          <span class="icon">✅</span>
          <div>
            <h3>Task Completed</h3>
            <p>Your deployment finished successfully.</p>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
