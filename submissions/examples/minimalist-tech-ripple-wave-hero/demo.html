<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Ripple-Wave Hero Section - Minimalist Tech</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 
       A checkbox hack to toggle the ripple animation for the demo.
       In a real application, this could run infinitely or be triggered by intersection observers.
    -->
    <input type="checkbox" id="animation-toggle" class="animation-input" checked>
    
    <div class="layout-container">
        
        <!-- Controls outside the hero for easy access in demo -->
        <div class="demo-controls">
            <label for="animation-toggle" class="btn-toggle">
                <svg class="icon-play" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                <svg class="icon-pause" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
                <span>Toggle Background Ripple</span>
            </label>
        </div>

        <section class="hero-section">
            
            <!-- The Ripple-Wave Background System -->
            <div class="ripple-background">
                <!-- Multiple rings for the wave effect -->
                <div class="ripple-ring ring-1"></div>
                <div class="ripple-ring ring-2"></div>
                <div class="ripple-ring ring-3"></div>
            </div>
            
            <!-- Hero Content -->
            <div class="hero-content">
                <div class="badge">
                    <span class="badge-dot"></span>
                    v2.0 Now Available
                </div>
                
                <h1 class="hero-title">
                    Deploy globally in <br/>
                    <span class="highlight">milliseconds.</span>
                </h1>
                
                <p class="hero-subtitle">
                    The ultra-low latency edge platform designed for modern, data-intensive web applications. Built on Rust, scaled on demand.
                </p>
                
                <div class="hero-actions">
                    <a href="#" class="btn btn-primary">Start Building Free</a>
                    <a href="#" class="btn btn-secondary">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                        Read Documentation
                    </a>
                </div>
            </div>
            
        </section>

    </div>

</body>
</html>
