<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Floating dropdown showcase for EaseMotion CSS issue #78580."
    />
    <title>Floating Dropdown | EaseMotion CSS</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="page">
      <section class="panel" aria-labelledby="page-title">
        <p class="eyebrow">EaseMotion CSS · Issue #78580</p>

        <h1 id="page-title">Choose a destination</h1>

        <p class="intro">
          A native select control presented inside a layered floating surface.
        </p>

        <div class="field">
          <label for="route">Category</label>
          <select id="route" name="route">
            <option value="design">Design</option>
            <option value="development">Development</option>
            <option value="marketing">Marketing</option>
            <option value="strategy">Strategy</option>
            <option value="research">Research</option>
          </select>
        </div>

        <div class="preview" aria-live="polite">
          <span class="preview-label">Example selection</span>
          <strong>Design</strong>
          <p>Use the native dropdown to explore each category.</p>
        </div>
      </section>
    </main>
  </body>
</html>
