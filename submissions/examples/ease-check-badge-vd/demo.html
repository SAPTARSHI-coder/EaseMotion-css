<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ease Check Badge</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="badge-group">

    <span class="check-badge verified">
        <span class="check-icon">✓</span>
        Verified
    </span>

    <span class="check-badge trusted">
        <span class="check-icon">✓</span>
        Trusted
    </span>

    <span class="check-badge complete">
        <span class="check-icon">✓</span>
        Complete
    </span>

</div>

</body>
</html>
