<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Fade-In Toast - Minimalist Tech</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="layout-container">
        
        <header class="section-header">
            <h1 class="title">System Notifications</h1>
            <p class="subtitle">A minimalist tech layout featuring non-intrusive toast notifications with a smooth, pure fade-in entrance.</p>
        </header>

        <div class="dashboard-area">
            
            <div class="card">
                
                <div class="controls">
                    <p class="instruction-text">Trigger a system notification to observe the fade entrance.</p>
                    
                    <!-- 
                       Pure CSS State Management for Demo
                       We use a checkbox to toggle the toast visibility.
                    -->
                    <input type="checkbox" id="toast-trigger" class="toast-input">
                    
                    <label for="toast-trigger" class="btn-trigger">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 17H2a3 3 0 0 0 3-3V9a7 7 0 0 1 14 0v5a3 3 0 0 0 3 3zm-8.27 4a2 2 0 0 1-3.46 0"></path></svg>
                        Test Notification
                    </label>
                    
                    <!-- The Toast Notification Container -->
                    <div class="toast-container fade-in-group">
                        
                        <div class="toast-notification">
                            <div class="toast-icon">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
                            </div>
                            <div class="toast-content">
                                <span class="toast-title">Deployment Successful</span>
                                <span class="toast-desc">Container image v2.4.1 has been rolled out to production nodes.</span>
                            </div>
                            
                            <!-- 
                               Dismiss button also linked to the same checkbox.
                               Clicking it unchecks the box, hiding the toast.
                            -->
                            <label for="toast-trigger" class="btn-dismiss" aria-label="Dismiss notification">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                            </label>
                            
                            <!-- Optional Progress Bar (Decorative for Demo) -->
                            <div class="toast-progress"></div>
                        </div>
                        
                    </div>
                </div>
                
            </div>
            
        </div>
    </div>

</body>
</html>
