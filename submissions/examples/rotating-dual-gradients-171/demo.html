<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Floating Aura Avatar Profile Ring with rotating dual gradients."
  >

  <title>Floating Aura Avatar | EaseMotion CSS</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="page">
    <section class="profile-card" aria-labelledby="profile-name">

      <div class="aura-wrapper">
        <div class="aura-ring aura-ring-one"></div>
        <div class="aura-ring aura-ring-two"></div>

        <div class="avatar-container">
          <div class="avatar">
            <span class="avatar-icon" aria-hidden="true">✦</span>
          </div>

          <span
            class="status-dot"
            aria-label="Online"
            title="Online"
          ></span>
        </div>
      </div>

      <div class="profile-content">
        <p class="profile-label">CREATIVE DEVELOPER</p>

        <h1 id="profile-name">Alex Morgan</h1>

        <p class="profile-description">
          Building elegant digital experiences with modern web technologies.
        </p>

        <div class="profile-stats">
          <div class="stat">
            <strong>48</strong>
            <span>Projects</span>
          </div>

          <div class="divider"></div>

          <div class="stat">
            <strong>12K</strong>
            <span>Followers</span>
          </div>

          <div class="divider"></div>

          <div class="stat">
            <strong>96%</strong>
            <span>Success</span>
          </div>
        </div>

        <button class="profile-button" type="button" id="connectButton">
          <span>Connect</span>
          <span class="button-arrow" aria-hidden="true">→</span>
        </button>
      </div>

    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
