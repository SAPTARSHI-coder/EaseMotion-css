<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stained Glass – Light Passing Through Pattern</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <h1>🪟 Stained Glass</h1>
    <p class="subtitle">Creates stained glass pattern with light passing through</p>

    <div class="stained-container">
      <div class="stained-glass" id="stainedGlass">
        <div class="glass-canvas" id="glassCanvas"></div>
        <div class="light-overlay" id="lightOverlay"></div>
        <div class="glass-glow" id="glassGlow"></div>
      </div>

      <!-- Info overlay -->
      <div class="info-overlay">
        <span class="glass-status" id="glassStatus">🪟 Illuminated</span>
        <span class="panel-count" id="panelCount">✦ 0 panels</span>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <button class="ctrl-btn generate" id="generateBtn">🔄 Generate</button>
      <button class="ctrl-btn toggle" id="toggleBtn">💡 Toggle Light</button>
      <button class="ctrl-btn reset" id="resetBtn">↺ Reset</button>
      <button class="ctrl-btn save" id="saveBtn">💾 Save</button>
    </div>

    <!-- Sliders -->
    <div class="slider-container">
      <span class="slider-label">Panel Count</span>
      <input type="range" id="panelSlider" min="6" max="30" value="12" step="2" />
      <span class="slider-value" id="panelValue">12</span>
    </div>

    <div class="slider-container">
      <span class="slider-label">Light Intensity</span>
      <input type="range" id="intensitySlider" min="0" max="100" value="70" />
      <span class="slider-value" id="intensityValue">70%</span>
    </div>

    <div class="slider-container">
      <span class="slider-label">Color Vibrancy</span>
      <input type="range" id="vibrancySlider" min="0" max="100" value="80" />
      <span class="slider-value" id="vibrancyValue">80%</span>
    </div>

    <!-- Status -->
    <div class="status" id="status">🪟 Stained glass illuminated — light passing through</div>

    <!-- Keyboard shortcuts -->
    <div class="shortcuts">
      <kbd>G</kbd> Generate · <kbd>T</kbd> Toggle Light · <kbd>R</kbd> Reset
    </div>
  </div>

  <script>
    (function() {
      "use strict";

      // DOM elements
      const glassCanvas = document.getElementById('glassCanvas');
      const lightOverlay = document.getElementById('lightOverlay');
      const glassGlow = document.getElementById('glassGlow');
      const glassStatus = document.getElementById('glassStatus');
      const panelCount = document.getElementById('panelCount');
      const generateBtn = document.getElementById('generateBtn');
      const toggleBtn = document.getElementById('toggleBtn');
      const resetBtn = document.getElementById('resetBtn');
      const saveBtn = document.getElementById('saveBtn');
      const status = document.getElementById('status');
      const panelSlider = document.getElementById('panelSlider');
      const panelValue = document.getElementById('panelValue');
      const intensitySlider = document.getElementById('intensitySlider');
      const intensityValue = document.getElementById('intensityValue');
      const vibrancySlider = document.getElementById('vibrancySlider');
      const vibrancyValue = document.getElementById('vibrancyValue');

      // State
      let isLightOn = true;
      let panels = [];
      let animationId = null;
      let time = 0;

      // Color palette for stained glass
      const COLORS = [
        '#ff6b6b', '#ff4757', '#ff6348', '#ff9f43', '#feca57',
        '#ffd93d', '#ff6b81', '#e056a0', '#a29bfe', '#6c5ce7',
        '#00cec9', '#00b894', '#55efc4', '#81ecec', '#74b9ff',
        '#0984e3', '#fd79a8', '#e17055', '#fdcb6e', '#d63031',
        '#2ecc71', '#3498db', '#9b59b6', '#1abc9c', '#f1c40f',
        '#e67e22', '#e74c3c', '#2ecc71', '#3498db', '#9b59b6'
      ];

      // ----- Generate stained glass pattern -----
      function generatePattern() {
        const panelCountVal = parseInt(panelSlider.value);
        const vibrancy = parseInt(vibrancySlider.value) / 100;
        
        // Clear canvas
        glassCanvas.innerHTML = '';
        panels = [];

        // Generate random panels with Voronoi-like distribution
        const w = glassCanvas.clientWidth || 500;
        const h = glassCanvas.clientHeight || 400;
        const centerX = w / 2;
        const centerY = h / 2;
        const radius = Math.min(w, h) * 0.45;

        // Generate seed points
        const seeds = [];
        const numSeeds = panelCountVal;
        
        // Start with center seed
        seeds.push({ x: centerX, y: centerY, color: COLORS[0] });
        
        // Add random seeds
        for (let i = 1; i < numSeeds; i++) {
          const angle = Math.random() * Math.PI * 2;
          const r = radius * (0.3 + Math.random() * 0.7);
          const x = centerX + Math.cos(angle) * r;
          const y = centerY + Math.sin(angle) * r;
          const color = COLORS[Math.floor(Math.random() * COLORS.length)];
          seeds.push({ x, y, color });
        }

        // Create panels (simplified Voronoi-like regions)
        const panelCountActual = seeds.length;
        const cells = [];
        
        for (let i = 0; i < seeds.length; i++) {
          const cell = document.createElement('div');
          cell.className = 'glass-panel';
          const seed = seeds[i];
          
          // Calculate polygon points (simplified)
          const points = generatePolygonPoints(seed, seeds, w, h, radius);
          
          // Create polygon shape
          const polygon = points.map(p => `${p.x}px ${p.y}px`).join(', ');
          cell.style.clipPath = `polygon(${polygon})`;
          cell.style.background = seed.color;
          
          // Add glass texture
          const hue = getHueFromColor(seed.color);
          const sat = 60 + Math.random() * 40;
          const light = 50 + Math.random() * 30;
          cell.style.background = `radial-gradient(circle at ${30 + Math.random() * 40}% ${20 + Math.random() * 60}%, 
            hsla(${hue + 10}, ${sat}%, ${light + 10}%, 0.6),
            hsla(${hue - 10}, ${sat - 10}%, ${light - 10}%, 0.8)
          )`;
          
          // Add glass reflection
          const reflection = document.createElement('div');
          reflection.className = 'glass-reflection';
          reflection.style.background = `radial-gradient(circle at 30% 30%, 
            rgba(255,255,255,${0.1 + Math.random() * 0.2}), 
            transparent 70%
          )`;
          cell.appendChild(reflection);
          
          // Add lead line border
          cell.style.border = `${1 + Math.random() * 2}px solid rgba(80, 70, 60, ${0.3 + Math.random() * 0.3})`;
          
          glassCanvas.appendChild(cell);
          cells.push(cell);
        }

        panels = cells;
        panelCount.textContent = `✦ ${panels.length} panels`;
        status.textContent = `🔄 Generated ${panels.length} stained glass panels`;
      }

      // ----- Generate polygon points for a cell -----
      function generatePolygonPoints(seed, allSeeds, w, h, radius) {
        const centerX = w / 2;
        const centerY = h / 2;
        const numPoints = 5 + Math.floor(Math.random() * 5);
        const points = [];
        
        for (let i = 0; i < numPoints; i++) {
          const angle = (i / numPoints) * Math.PI * 2 + (Math.random() - 0.5) * 0.5;
          const r = radius * (0.4 + Math.random() * 0.5);
          let x = seed.x + Math.cos(angle) * r;
          let y = seed.y + Math.sin(angle) * r;
          
          // Clamp to canvas bounds
          x = Math.max(10, Math.min(w - 10, x));
          y = Math.max(10, Math.min(h - 10, y));
          
          points.push({ x, y });
        }
        return points;
      }

      // ----- Get hue from color -----
      function getHueFromColor(color) {
        // Simple color to hue mapping
        const hex = color.replace('#', '');
        const r = parseInt(hex.substring(0, 2), 16);
        const g = parseInt(hex.substring(2, 4), 16);
        const b = parseInt(hex.substring(4, 6), 16);
        const max = Math.max(r, g, b);
        const min = Math.min(r, g, b);
        let hue = 0;
        if (max !== min) {
          const d = max - min;
          if (max === r) hue = ((g - b) / d) % 6;
          else if (max === g) hue = (b - r) / d + 2;
          else hue = (r - g) / d + 4;
          hue *= 60;
        }
        return hue;
      }

      // ----- Update light effect -----
      function updateLight() {
        const intensity = parseInt(intensitySlider.value) / 100;
        const vibrancy = parseInt(vibrancySlider.value) / 100;

        // Update light overlay
        if (isLightOn) {
          lightOverlay.style.opacity = 0;
          glassGlow.style.opacity = intensity * 0.5;
          glassGlow.style.transform = `scale(${1 + intensity * 0.3})`;
          glassStatus.textContent = '🪟 Illuminated';
          status.textContent = '🪟 Stained glass illuminated — light passing through';
        } else {
          lightOverlay.style.opacity = 0.85;
          glassGlow.style.opacity = 0;
          glassStatus.textContent = '🌑 Darkened';
          status.textContent = '🌑 Stained glass darkened — light off';
        }

        // Update panel vibrancy
        panels.forEach((panel, i) => {
          const currentOpacity = isLightOn ? 0.6 + vibrancy * 0.3 : 0.2 + vibrancy * 0.1;
          panel.style.opacity = currentOpacity;
          
          // Subtle animation
          if (isLightOn) {
            const pulse = 1 + 0.02 * Math.sin(time + i * 0.5);
            panel.style.transform = `scale(${pulse})`;
          }
        });
      }

      // ----- Animation loop -----
      function animate() {
        time += 0.016;
        updateLight();
        animationId = requestAnimationFrame(animate);
      }

      // ----- Start animation -----
      function startAnimation() {
        if (animationId) {
          cancelAnimationFrame(animationId);
        }
        animate();
      }

      // ----- Toggle light -----
      function toggleLight() {
        isLightOn = !isLightOn;
        toggleBtn.textContent = isLightOn ? '💡 Toggle Light' : '💡 Light Off';
        updateLight();
      }

      // ----- Reset -----
      function resetStained() {
        isLightOn = true;
        toggleBtn.textContent = '💡 Toggle Light';
        panelSlider.value = 12;
        panelValue.textContent = '12';
        intensitySlider.value = 70;
        intensityValue.textContent = '70%';
        vibrancySlider.value = 80;
        vibrancyValue.textContent = '80%';
        generatePattern();
        updateLight();
        status.textContent = '↺ Reset to default stained glass pattern';
        setTimeout(() => {
          status.textContent = '🪟 Stained glass illuminated — light passing through';
        }, 500);
      }

      // ----- Save as image -----
      function saveImage() {
        // Create a temporary canvas to render the stained glass
        const container = document.querySelector('.stained-glass');
        const rect = container.getBoundingClientRect();
        
        // Use html2canvas approach - simpler: just notify
        status.textContent = '💾 Right-click on the stained glass and select "Save Image As"';
        setTimeout(() => {
          status.textContent = '🪟 Stained glass illuminated — light passing through';
        }, 3000);
      }

      // ----- Event Listeners -----
      generateBtn.addEventListener('click', () => {
        generatePattern();
        updateLight();
      });

      toggleBtn.addEventListener('click', toggleLight);
      resetBtn.addEventListener('click', resetStained);
      saveBtn.addEventListener('click', saveImage);

      panelSlider.addEventListener('input', (e) => {
        panelValue.textContent = e.target.value;
        generatePattern();
        updateLight();
      });

      intensitySlider.addEventListener('input', (e) => {
        intensityValue.textContent = e.target.value + '%';
        updateLight();
      });

      vibrancySlider.addEventListener('input', (e) => {
        vibrancyValue.textContent = e.target.value + '%';
        updateLight();
      });

      // Click on stained glass to toggle light
      document.querySelector('.stained-glass').addEventListener('click', toggleLight);

      // Keyboard shortcuts
      document.addEventListener('keydown', (e) => {
        if (e.key === 'g' || e.key === 'G') {
          e.preventDefault();
          generateBtn.click();
        }
        if (e.key === 't' || e.key === 'T') {
          e.preventDefault();
          toggleLight();
        }
        if (e.key === 'r' || e.key === 'R') {
          e.preventDefault();
          resetBtn.click();
        }
      });

      // ----- Resize handler -----
      let resizeTimeout;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(() => {
          generatePattern();
          updateLight();
        }, 300);
      });

      // ----- Init -----
      function init() {
        
        generatePattern();
        updateLight();
        startAnimation();
        status.textContent = '🪟 Stained glass illuminated — light passing through';
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }

    })();
  </script>
</body>
</html>
