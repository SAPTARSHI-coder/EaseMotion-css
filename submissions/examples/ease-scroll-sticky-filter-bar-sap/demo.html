<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scroll Sticky Filter Bar</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="content">
    <section class="hero"><h1>Scroll Sticky Filter Bar</h1><p>Scroll down — the filter bar sticks to the top and compacts as it does.</p></section>

    <div class="filter-bar" id="filterBar" role="toolbar" aria-label="Product filters">
      <button class="filter-chip is-active">All</button>
      <button class="filter-chip">Shoes</button>
      <button class="filter-chip">Apparel</button>
      <button class="filter-chip">Accessories</button>
    </div>

    <section class="grid">
      <div class="product-card">Item 1</div>
      <div class="product-card">Item 2</div>
      <div class="product-card">Item 3</div>
      <div class="product-card">Item 4</div>
      <div class="product-card">Item 5</div>
      <div class="product-card">Item 6</div>
    </section>
  </main>

  <script>
    const bar = document.getElementById('filterBar');
    function onScroll() {
      bar.classList.toggle('is-compact', bar.getBoundingClientRect().top <= 0);
    }
    document.addEventListener('scroll', onScroll, { passive: true });
    onScroll();

    document.querySelectorAll('.filter-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        document.querySelector('.filter-chip.is-active')?.classList.remove('is-active');
        chip.classList.add('is-active');
      });
    });
  </script>
</body>
</html>
