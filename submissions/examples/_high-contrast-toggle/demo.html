<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS High Contrast Toggle</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- High Contrast Container & Pure CSS Toggle -->
  <div class="demo-wrapper">
    <!-- Checkbox Switch -->
    <input 
      type="checkbox" 
      id="contrast-switch" 
      class="contrast-checkbox" 
      role="switch" 
      aria-label="Toggle High Contrast Mode" 
    />
    
    <label for="contrast-switch" class="contrast-toggle-label">
      <span class="toggle-track">
        <span class="toggle-thumb"></span>
      </span>
      <span class="toggle-text">High Contrast Mode</span>
    </label>

    <!-- Content Preview to Show Contrast Shift -->
    <section class="preview-card" aria-live="polite">
      <h2>Accessibility Card</h2>
      <p>Toggle high contrast mode to switch between standard and high-visibility color profiles.</p>
      <button type="button" class="action-btn">Action Button</button>
    </section>
  </div>
</body>
</html>
