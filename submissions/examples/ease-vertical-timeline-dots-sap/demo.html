<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ease-vertical-timeline-dots-sap demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { height: 100vh; margin: 0; display: flex; align-items: center; justify-content: center; background: #f4f4f5; }
  </style>
</head>
<body>
  <div class="timeline-dots-sap">
    <div class="dot-item active">
      <div class="dot-marker"></div>
      <div class="dot-title">Order Placed</div>
      <div class="dot-desc">Jan 12, 10:24 AM</div>
    </div>
    <div class="dot-item active">
      <div class="dot-marker"></div>
      <div class="dot-title">Shipped</div>
      <div class="dot-desc">Jan 13, 2:15 PM</div>
    </div>
    <div class="dot-item">
      <div class="dot-marker"></div>
      <div class="dot-title">Out for Delivery</div>
      <div class="dot-desc">Pending</div>
    </div>
    <div class="dot-item">
      <div class="dot-marker"></div>
      <div class="dot-title">Delivered</div>
      <div class="dot-desc">Pending</div>
    </div>
  </div>
</body>
</html>
