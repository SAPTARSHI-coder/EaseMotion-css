<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ruling Engine Groove — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Ruling Engine Groove demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Ruling Engine Groove</h1>
      <p class="lede">Ruling engine diamond cutting fine diffraction grooves</p>
    </header>

    <section class="ease-ruling-engine-groove" data-demo="ruling-engine-groove" aria-live="polite">
      <div class="ease-ruling-engine-groove__housing">
        <div class="ease-ruling-engine-groove__bezel">
          <div class="ease-ruling-engine-groove__face">
            <div class="ease-ruling-engine-groove__readout">
              <span class="ease-ruling-engine-groove__label">Ruling Engine Groove</span>
              <span class="ease-ruling-engine-groove__value">LIVE</span>
            </div>
            <div class="ease-ruling-engine-groove__motion" aria-hidden="true">
              <span class="ease-ruling-engine-groove__a"></span>
              <span class="ease-ruling-engine-groove__b"></span>
              <span class="ease-ruling-engine-groove__c"></span>
              <span class="ease-ruling-engine-groove__d"></span>
            </div>
            <div class="ease-ruling-engine-groove__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-ruling-engine-groove__controls">
          <button type="button" class="ease-ruling-engine-groove__btn primary">Engage</button>
          <button type="button" class="ease-ruling-engine-groove__btn">Reset</button>
          <label class="ease-ruling-engine-groove__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-ruling-engine-groove__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
