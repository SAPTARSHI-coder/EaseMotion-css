<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neutron Star Merger Gravitational Waves - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030712; color: #ffffff;">

    <div class="ease-card ease-card-glass merger-container">
        <div class="merger-header">
            <h2>Binary Merger</h2>
            <span class="ease-badge ease-badge-warning">Inspiraling</span>
        </div>
        
        <div class="merger-screen ease-center">
            <div class="gravitational-ripple ripple-1"></div>
            <div class="gravitational-ripple ripple-2"></div>
            <div class="chirp-signal-ring"></div>
            <div class="binary-core-pair ease-center"></div>
        </div>

        <div class="merger-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Frequency: 1200 Hz</span>
            <button class="ease-btn ease-btn-primary ease-btn-sm ease-hover-grow">Detect Chirp</button>
        </div>
    </div>

</body>
</html>
