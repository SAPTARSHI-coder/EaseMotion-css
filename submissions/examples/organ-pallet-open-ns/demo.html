<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Organ Pallet Open — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Organ Pallet Open demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Organ Pallet Open</h1>
      <p class="lede">Organ pallet opening wind to the pipe</p>
    </header>

    <section class="ease-organ-pallet-open" data-demo="organ-pallet-open" aria-live="polite">
      <div class="ease-organ-pallet-open__housing">
        <div class="ease-organ-pallet-open__bezel">
          <div class="ease-organ-pallet-open__face">
            <div class="ease-organ-pallet-open__readout">
              <span class="ease-organ-pallet-open__label">Organ Pallet Open</span>
              <span class="ease-organ-pallet-open__value">LIVE</span>
            </div>
            <div class="ease-organ-pallet-open__motion" aria-hidden="true">
              <span class="ease-organ-pallet-open__a"></span>
              <span class="ease-organ-pallet-open__b"></span>
              <span class="ease-organ-pallet-open__c"></span>
              <span class="ease-organ-pallet-open__d"></span>
            </div>
            <div class="ease-organ-pallet-open__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-organ-pallet-open__controls">
          <button type="button" class="ease-organ-pallet-open__btn primary">Open</button>
          <button type="button" class="ease-organ-pallet-open__btn">Close</button>
          <label class="ease-organ-pallet-open__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-organ-pallet-open__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
