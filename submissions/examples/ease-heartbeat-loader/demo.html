<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Heartbeat Loader · EKG Pulse</title>

    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <div class="card">
        <h2>💓 Heartbeat Loader</h2>
        <p class="sub">pulses like an EKG heartbeat</p>

        <!-- === HEARTBEAT LOADER === -->
        <div class="heartbeat-container" id="heartbeatContainer">
            <div class="heartbeat-loader">
                <!-- Heart icon -->
                <div class="heart-icon">
                    <i class="fas fa-heart"></i>
                </div>

                <!-- EKG line -->
                <div class="ekg-line">
                    <svg viewBox="0 0 200 60" class="ekg-svg">
                        <polyline points="0,30 20,30 25,10 35,50 45,10 55,30 75,30 80,25 90,40 100,15 110,35 130,30 135,20 145,45 155,20 165,30 185,30 195,30 200,30" class="ekg-path" />
                    </svg>
                    <div class="ekg-dot"></div>
                </div>

                <!-- Pulse rings -->
                <div class="pulse-ring pr-1"></div>
                <div class="pulse-ring pr-2"></div>
                <div class="pulse-ring pr-3"></div>

                <!-- BPM label -->
                <div class="bpm-label">
                    <span class="bpm-number" id="bpmNumber">72</span>
                    <span class="bpm-unit">BPM</span>
                </div>
            </div>
        </div>

        <p style="margin-top: 2rem; font-size: 0.85rem; color: #64748b;">
            Beating heart · EKG loading animation
        </p>
    </div>

    <!-- Embedded JavaScript -->
    <script>
        (function() {
            'use strict';

            const container = document.getElementById('heartbeatContainer');
            const bpmNumber = document.getElementById('bpmNumber');

            // Simulate BPM variation
            function updateBPM() {
                const baseBPM = 72;
                const variation = Math.floor(Math.random() * 10) - 5;
                const bpm = baseBPM + variation;
                bpmNumber.textContent = bpm;
            }

            // Update BPM every 2-3 seconds
            setInterval(updateBPM, 2000 + Math.random() * 1000);

            // Click to restart animation
            container.addEventListener('click', function() {
                const loader = this.querySelector('.heartbeat-loader');
                const heart = this.querySelector('.heart-icon i');
                const ekgDot = this.querySelector('.ekg-dot');
                const pulseRings = this.querySelectorAll('.pulse-ring');

                loader.style.animation = 'none';
                void loader.offsetWidth;
                loader.style.animation = '';

                heart.style.animation = 'none';
                void heart.offsetWidth;
                heart.style.animation = '';

                ekgDot.style.animation = 'none';
                void ekgDot.offsetWidth;
                ekgDot.style.animation = '';

                pulseRings.forEach(ring => {
                    ring.style.animation = 'none';
                    void ring.offsetWidth;
                    ring.style.animation = '';
                });

                this.classList.add('click-pulse');
                setTimeout(() => {
                    this.classList.remove('click-pulse');
                }, 300);

                console.log('💓 Heartbeat loader restarted!');
            });

            // Keyboard accessibility
            container.setAttribute('tabindex', '0');
            container.setAttribute('role', 'button');
            container.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    this.click();
                }
            });

            console.log('💓 Heartbeat loader initialized!');

        })();
    </script>

</body>
</html>
