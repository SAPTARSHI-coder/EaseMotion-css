<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Pure CSS retro cassette tape card with animated reels."
  >

  <title>CSS Cassette Tape Card</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="demo">
    <header class="hero">
      <p class="eyebrow">EaseMotion CSS</p>

      <h1>Cassette Tape Card</h1>

      <p class="description">
        A nostalgic cassette tape card recreated entirely with HTML and
        CSS, featuring spinning reels and a subtle retro animation.
      </p>
    </header>

    <section class="cassette-stage" aria-label="Cassette tape demo">

      <article class="cassette-card" aria-label="Retro cassette tape">
        <div class="cassette-label">
          <span class="label-small">SIDE A</span>

          <h2>MEMORY<br>LANE</h2>

          <span class="label-line"></span>

          <p>90 MIN · MIX TAPE</p>
        </div>

        <div class="cassette-window" aria-hidden="true">
          <div class="tape-window"></div>

          <div class="reel reel-left">
            <span></span>
          </div>

          <div class="reel reel-right">
            <span></span>
          </div>

          <div class="tape-line"></div>
        </div>

        <div class="cassette-details" aria-hidden="true">
          <span></span>
          <span></span>
          <span></span>
        </div>

        <div class="screw screw-one" aria-hidden="true"></div>
        <div class="screw screw-two" aria-hidden="true"></div>
        <div class="screw screw-three" aria-hidden="true"></div>
        <div class="screw screw-four" aria-hidden="true"></div>
      </article>

    </section>

    <p class="instruction">
      The reels continuously rotate using a CSS animation.
    </p>
  </main>
</body>
</html>
