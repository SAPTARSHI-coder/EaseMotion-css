<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Music Note – Notes Float Upward When Clicked</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <h1>🎵 Music Note</h1>
    <p class="subtitle">Musical notes float upward when clicked</p>

    <div class="music-container">
      <div class="music-stage" id="musicStage">
        <canvas id="canvas"></canvas>
        
        <!-- Info overlay -->
        <div class="info-overlay">
          <span class="music-status" id="musicStatus">🎵 Ready</span>
          <span class="note-count" id="noteCount">✦ 0 notes</span>
        </div>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <button class="ctrl-btn note" id="noteBtn">🎵 Note</button>
      <button class="ctrl-btn clear" id="clearBtn">🗑️ Clear</button>
      <button class="ctrl-btn toggle" id="toggleBtn">⏸ Pause</button>
      <button class="ctrl-btn reset" id="resetBtn">↺ Reset</button>
    </div>

    <!-- Sliders -->
    <div class="slider-container">
      <span class="slider-label">Float Speed</span>
      <input type="range" id="speedSlider" min="1" max="10" value="5" />
      <span class="slider-value" id="speedValue">5×</span>
    </div>

    <div class="slider-container">
      <span class="slider-label">Note Size</span>
      <input type="range" id="sizeSlider" min="50" max="150" value="100" />
      <span class="slider-value" id="sizeValue">100%</span>
    </div>

    <div class="slider-container">
      <span class="slider-label">Note Count</span>
      <input type="range" id="countSlider" min="1" max="10" value="3" />
      <span class="slider-value" id="countValue">3</span>
    </div>

    <div class="slider-container">
      <span class="slider-label">Color</span>
      <input type="range" id="colorSlider" min="0" max="360" value="0" />
      <span class="slider-value" id="colorValue">0°</span>
    </div>

    <!-- Status -->
    <div class="status" id="status">🎵 Click the canvas or press Note to create floating music notes</div>

    <!-- Keyboard shortcuts -->
    <div class="shortcuts">
      <kbd>N</kbd> Note · <kbd>C</kbd> Clear · <kbd>Space</kbd> Pause · <kbd>R</kbd> Reset
    </div>
  </div>

  <script>
    (function() {
      "use strict";

      // DOM elements
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      const musicStatus = document.getElementById('musicStatus');
      const noteCount = document.getElementById('noteCount');
      const noteBtn = document.getElementById('noteBtn');
      const clearBtn = document.getElementById('clearBtn');
      const toggleBtn = document.getElementById('toggleBtn');
      const resetBtn = document.getElementById('resetBtn');
      const status = document.getElementById('status');
      const speedSlider = document.getElementById('speedSlider');
      const speedValue = document.getElementById('speedValue');
      const sizeSlider = document.getElementById('sizeSlider');
      const sizeValue = document.getElementById('sizeValue');
      const countSlider = document.getElementById('countSlider');
      const countValue = document.getElementById('countValue');
      const colorSlider = document.getElementById('colorSlider');
      const colorValue = document.getElementById('colorValue');

      // State
      let notes = [];
      let isPaused = false;
      let animationId = null;
      let time = 0;
      let noteCountVal = 0;

      // Note symbols
      const NOTE_SYMBOLS = ['♩', '♪', '♫', '♬', '𝄞', '𝄢', '𝄡', '𝄣', '♪♫', '♩♪'];
      const NOTE_NAMES = ['C', 'D', 'E', 'F', 'G', 'A', 'B'];

      // ----- Canvas setup -----
      function setupCanvas() {
        const rect = canvas.parentElement.getBoundingClientRect();
        const size = Math.min(rect.width - 40, 600);
        canvas.width = size;
        canvas.height = size;
        canvas.style.width = size + 'px';
        canvas.style.height = size + 'px';
      }

      // ----- Music note class -----
      class MusicNote {
        constructor(x, y) {
          this.x = x;
          this.y = y;
          this.startY = y;
          this.symbol = NOTE_SYMBOLS[Math.floor(Math.random() * NOTE_SYMBOLS.length)];
          this.name = NOTE_NAMES[Math.floor(Math.random() * NOTE_NAMES.length)];
          this.size = (20 + Math.random() * 30) * (parseInt(sizeSlider.value) / 100);
          this.speed = 0.3 + Math.random() * 0.7 * (parseInt(speedSlider.value) / 5);
          this.phase = Math.random() * Math.PI * 2;
          this.wobbleSpeed = 0.01 + Math.random() * 0.02;
          this.wobbleAmount = 10 + Math.random() * 20;
          this.rotation = Math.random() * Math.PI * 2;
          this.rotationSpeed = (Math.random() - 0.5) * 0.02;
          this.hue = parseInt(colorSlider.value) + (Math.random() - 0.5) * 30;
          this.saturation = 80 + Math.random() * 20;
          this.lightness = 60 + Math.random() * 30;
          this.opacity = 0.8 + Math.random() * 0.2;
          this.alive = true;
          this.trail = [];
          this.trailLength = 5 + Math.floor(Math.random() * 10);
          this.glowSize = this.size * 3;
          this.pulse = 0;
          this.pulseSpeed = 0.02 + Math.random() * 0.03;
          this.shadow = 0.1 + Math.random() * 0.2;
          this.floating = true;
          this.life = 1;
          this.decay = 0.002 + Math.random() * 0.003;
        }

        update(speedMult) {
          // Float upward with wobble
          this.y -= this.speed * speedMult;
          this.x += Math.sin(this.phase + time * this.wobbleSpeed) * this.wobbleAmount * 0.02 * speedMult;
          
          // Rotation
          this.rotation += this.rotationSpeed * speedMult;
          
          // Pulse
          this.pulse += this.pulseSpeed * speedMult;
          
          // Fade
          this.life -= this.decay * speedMult;
          this.opacity *= 0.9995;

          // Trail
          this.trail.push({ x: this.x, y: this.y });
          if (this.trail.length > this.trailLength) {
            this.trail.shift();
          }

          // Check if off screen
          if (this.y < -50 || this.life < 0.01) {
            this.alive = false;
          }
        }

        draw(ctx) {
          const alpha = this.opacity * this.life;
          const size = this.size * (0.8 + 0.2 * (0.5 + 0.5 * Math.sin(this.pulse)));
          const glow = this.glowSize * (0.8 + 0.2 * (0.5 + 0.5 * Math.sin(this.pulse * 1.3)));

          if (alpha < 0.01) return;

          // Draw trail
          if (this.trail.length > 1) {
            for (let i = 0; i < this.trail.length - 1; i++) {
              const t = i / this.trail.length;
              const trailAlpha = alpha * t * 0.15;
              const trailSize = size * t * 0.2;
              ctx.fillStyle = `hsla(${this.hue + 10}, 100%, 80%, ${trailAlpha})`;
              ctx.beginPath();
              ctx.arc(this.trail[i].x, this.trail[i].y, trailSize, 0, Math.PI * 2);
              ctx.fill();
            }
          }

          // Glow
          const gradient = ctx.createRadialGradient(
            this.x, this.y, 0,
            this.x, this.y, glow
          );
          gradient.addColorStop(0, `hsla(${this.hue + 20}, 100%, 90%, ${alpha * 0.15})`);
          gradient.addColorStop(0.5, `hsla(${this.hue + 10}, 100%, 70%, ${alpha * 0.08})`);
          gradient.addColorStop(1, `hsla(${this.hue}, 100%, 50%, 0)`);
          ctx.fillStyle = gradient;
          ctx.beginPath();
          ctx.arc(this.x, this.y, glow, 0, Math.PI * 2);
          ctx.fill();

          // Shadow
          ctx.shadowColor = `hsla(${this.hue + 20}, 100%, 60%, ${alpha * this.shadow * 0.3})`;
          ctx.shadowBlur = 20;

          // Note body
          ctx.save();
          ctx.translate(this.x, this.y);
          ctx.rotate(this.rotation);
          ctx.globalAlpha = alpha;

          // Note symbol with gradient
          const grad = ctx.createLinearGradient(-size/2, -size/2, size/2, size/2);
          const lightness = 60 + 30 * (0.5 + 0.5 * Math.sin(this.pulse * 0.7));
          grad.addColorStop(0, `hsla(${this.hue + 20}, 100%, ${lightness + 20}%, 0.9)`);
          grad.addColorStop(0.5, `hsla(${this.hue + 10}, 100%, ${lightness}%, 0.8)`);
          grad.addColorStop(1, `hsla(${this.hue - 10}, 100%, ${lightness - 20}%, 0.6)`);

          ctx.fillStyle = grad;
          ctx.font = `${size}px "Segoe UI", "Arial Unicode MS", sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(this.symbol, 0, 0);

          // Sparkle
          if (this.life > 0.5) {
            ctx.shadowBlur = 0;
            const sparkleSize = size * 0.08 * (0.5 + 0.5 * Math.sin(this.pulse * 2));
            ctx.fillStyle = `rgba(255, 255, 255, ${alpha * 0.15 * (0.5 + 0.5 * Math.sin(this.pulse * 1.5))})`;
            ctx.beginPath();
            ctx.arc(-size * 0.2, -size * 0.3, sparkleSize, 0, Math.PI * 2);
            ctx.fill();
          }

          ctx.restore();
          ctx.shadowBlur = 0;
        }
      }

      // ----- Create notes -----
      function createNotes(x, y) {
        const count = parseInt(countSlider.value);
        const cx = x || canvas.width / 2;
        const cy = y || canvas.height * 0.6;

        for (let i = 0; i < count; i++) {
          const spread = 30 + Math.random() * 40;
          const noteX = cx + (Math.random() - 0.5) * spread;
          const noteY = cy + (Math.random() - 0.5) * spread * 0.5;
          const note = new MusicNote(noteX, noteY);
          note.size = (15 + Math.random() * 25) * (parseInt(sizeSlider.value) / 100);
          note.speed = 0.3 + Math.random() * 0.7 * (parseInt(speedSlider.value) / 5);
          notes.push(note);
        }

        noteCountVal += count;
        noteCount.textContent = `✦ ${notes.length} notes`;
        musicStatus.textContent = '🎵 Playing!';
        status.textContent = `🎵 ${count} notes floating!`;
        setTimeout(() => {
          if (notes.length > 0) {
            musicStatus.textContent = '🎵 Active';
          } else {
            musicStatus.textContent = '🎵 Ready';
          }
        }, 1000);
      }

      // ----- Random notes -----
      function randomNotes() {
        const w = canvas.width;
        const h = canvas.height;
        const cx = w / 2;
        const cy = h * 0.6;
        createNotes(cx, cy);
      }

      // ----- Clear notes -----
      function clearNotes() {
        notes = [];
        noteCount.textContent = '✦ 0 notes';
        musicStatus.textContent = '🎵 Ready';
        status.textContent = '🗑️ Notes cleared';
        setTimeout(() => {
          status.textContent = '🎵 Click the canvas or press Note to create floating music notes';
        }, 1000);
      }

      // ----- Toggle pause -----
      function togglePause() {
        isPaused = !isPaused;
        toggleBtn.textContent = isPaused ? '▶ Play' : '⏸ Pause';
        status.textContent = isPaused ? '⏸ Paused' : '▶ Resumed';
        musicStatus.textContent = isPaused ? '⏸ Paused' : '🎵 Ready';
      }

      // ----- Reset -----
      function resetMusic() {
        notes = [];
        isPaused = false;
        toggleBtn.textContent = '⏸ Pause';
        musicStatus.textContent = '🎵 Ready';
        noteCount.textContent = '✦ 0 notes';
        noteCountVal = 0;
        speedSlider.value = 5;
        speedValue.textContent = '5×';
        sizeSlider.value = 100;
        sizeValue.textContent = '100%';
        countSlider.value = 3;
        countValue.textContent = '3';
        colorSlider.value = 0;
        colorValue.textContent = '0°';
        status.textContent = '↺ Reset';
        setTimeout(() => {
          status.textContent = '🎵 Click the canvas or press Note to create floating music notes';
        }, 500);
      }

      // ----- Draw background -----
      function drawBackground() {
        const w = canvas.width;
        const h = canvas.height;
        const cx = w / 2;
        const cy = h / 2;

        // Dark background with subtle gradient
        const bgGradient = ctx.createRadialGradient(cx, cy * 0.6, 0, cx, cy * 0.6, w * 0.7);
        bgGradient.addColorStop(0, '#0a0a1a');
        bgGradient.addColorStop(0.5, '#060612');
        bgGradient.addColorStop(1, '#020208');
        ctx.fillStyle = bgGradient;
        ctx.fillRect(0, 0, w, h);

        // Subtle staff lines (music lines)
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
        ctx.lineWidth = 0.5;
        const staffY = h * 0.7;
        const staffSpacing = 15;
        for (let i = 0; i < 5; i++) {
          const y = staffY + i * staffSpacing;
          ctx.beginPath();
          ctx.moveTo(20, y);
          ctx.lineTo(w - 20, y);
          ctx.stroke();
        }

        // Subtle glow spots
        for (let i = 0; i < 5; i++) {
          const seed = i * 137.508;
          const x = (seed * 0.618) % w;
          const y = (seed * 0.381) % h;
          const size = 20 + (seed % 40);
          const alpha = 0.01 + (seed % 100) / 100 * 0.02;
          const gradient = ctx.createRadialGradient(x, y, 0, x, y, size);
          gradient.addColorStop(0, `rgba(255, 200, 255, ${alpha})`);
          gradient.addColorStop(1, `rgba(255, 200, 255, 0)`);
          ctx.fillStyle = gradient;
          ctx.beginPath();
          ctx.arc(x, y, size, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // ----- Draw -----
      function draw() {
        drawBackground();

        // Update notes
        if (!isPaused) {
          const speedMult = parseInt(speedSlider.value) / 5;
          notes = notes.filter(n => n.alive);
          notes.forEach(n => n.update(speedMult));
        }

        // Draw notes (sorted by size for depth)
        const sortedNotes = [...notes].sort((a, b) => a.size - b.size);
        sortedNotes.forEach(n => n.draw(ctx));

        // Update count
        noteCount.textContent = `✦ ${notes.length} notes`;
        if (notes.length === 0 && !isPaused) {
          musicStatus.textContent = '🎵 Ready';
        }
      }

      // ----- Animation loop -----
      function animate() {
        time += 0.016;
        draw();
        animationId = requestAnimationFrame(animate);
      }

      // ----- Start animation -----
      function startAnimation() {
        if (animationId) {
          cancelAnimationFrame(animationId);
        }
        animate();
      }

      // ----- Event Listeners -----
      // Mouse clicks
      canvas.addEventListener('click', (e) => {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        const x = (e.clientX - rect.left) * scaleX;
        const y = (e.clientY - rect.top) * scaleY;
        createNotes(x, y);
      });

      // Touch support
      canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        const touch = e.touches[0];
        const x = (touch.clientX - rect.left) * scaleX;
        const y = (touch.clientY - rect.top) * scaleY;
        createNotes(x, y);
      });

      // Buttons
      noteBtn.addEventListener('click', randomNotes);
      clearBtn.addEventListener('click', clearNotes);
      toggleBtn.addEventListener('click', togglePause);
      resetBtn.addEventListener('click', resetMusic);

      // Sliders
      speedSlider.addEventListener('input', (e) => {
        speedValue.textContent = e.target.value + '×';
      });

      sizeSlider.addEventListener('input', (e) => {
        sizeValue.textContent = e.target.value + '%';
      });

      countSlider.addEventListener('input', (e) => {
        countValue.textContent = e.target.value;
      });

      colorSlider.addEventListener('input', (e) => {
        colorValue.textContent = e.target.value + '°';
      });

      // Keyboard shortcuts
      document.addEventListener('keydown', (e) => {
        if (e.key === 'n' || e.key === 'N') {
          e.preventDefault();
          randomNotes();
        }
        if (e.key === 'c' || e.key === 'C') {
          e.preventDefault();
          clearNotes();
        }
        if (e.key === ' ' || e.key === 'Space') {
          e.preventDefault();
          togglePause();
        }
        if (e.key === 'r' || e.key === 'R') {
          e.preventDefault();
          resetMusic();
        }
      });

      // ----- Resize handler -----
      let resizeTimeout;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(() => {
          setupCanvas();
        }, 200);
      });

      // ----- Init -----
      function init() {
        setupCanvas();
        startAnimation();
        status.textContent = '🎵 Click the canvas or press Note to create floating music notes!';
        // Create initial notes
        setTimeout(() => {
          const w = canvas.width;
          const h = canvas.height;
          const cx = w / 2;
          const cy = h * 0.6;
          createNotes(cx - 60, cy);
          setTimeout(() => createNotes(cx + 60, cy), 400);
          setTimeout(() => createNotes(cx, cy - 60), 800);
        }, 500);
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }

    })();
  </script>
</body>
</html>
