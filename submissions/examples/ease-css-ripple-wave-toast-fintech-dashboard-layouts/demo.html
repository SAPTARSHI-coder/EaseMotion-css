<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
Ripple-Wave Toast - Fintech Dashboard
</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<main class="container">


<section class="hero">

<span class="badge">
FINTECH ALERTS
</span>


<h1>
Ripple-Wave
<span>Toast Notifications</span>
</h1>


<p>
Modern fintech dashboard notifications
with smooth CSS ripple animations.
</p>

</section>



<section class="dashboard">


<div class="toast success">

<div class="ripple"></div>


<div class="icon">
✓
</div>


<div class="content">

<h3>
Payment Successful
</h3>

<p>
Your transaction has been completed.
</p>

</div>


</div>





<div class="toast warning">

<div class="ripple"></div>


<div class="icon">
!
</div>


<div class="content">

<h3>
Security Alert
</h3>

<p>
New login detected on your account.
</p>

</div>


</div>





<div class="toast info">

<div class="ripple"></div>


<div class="icon">
$
</div>


<div class="content">

<h3>
Balance Updated
</h3>

<p>
Your wallet balance has changed.
</p>

</div>


</div>



</section>


</main>


</body>

</html>
