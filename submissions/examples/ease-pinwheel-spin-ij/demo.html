<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pinwheel Spin Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="yard">
    <div class="pinwheel" id="pinwheel" aria-hidden="true">
      <div class="blade blade-1"></div>
      <div class="blade blade-2"></div>
      <div class="blade blade-3"></div>
      <div class="blade blade-4"></div>
      <div class="hub"></div>
    </div>
    <button class="blow" id="blow" type="button">Blow</button>
    <p class="hint">A paper pinwheel spins and catches in the breeze.</p>
  </main>
  <script>
    const pinwheel = document.getElementById("pinwheel");
    const blow = document.getElementById("blow");
    function spin() {
      pinwheel.classList.remove("spinning");
      void pinwheel.offsetWidth;
      pinwheel.classList.add("spinning");
    }
    blow.addEventListener("click", spin);
    spin();
  </script>
</body>
</html>
