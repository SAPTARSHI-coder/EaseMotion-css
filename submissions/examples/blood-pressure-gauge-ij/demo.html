<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-blood-pressure-gauge</title>
</head>
<body>
<main class="bpg-card">
  <h1 class="bpg-title">Blood Pressure Monitor</h1>
  <div class="bpg-gauge">
    <div class="bpg-gauge-arc"></div>
    <div class="bpg-needle"></div>
    <div class="bpg-pivot"></div>
  </div>
  <div class="bpg-read">
    <p class="bpg-top">118 <small>/ 76</small></p>
    <p class="bpg-sub">mmHg - resting</p>
  </div>
  <div class="bpg-pulse">
    <span class="bpg-beat bpg-beat-1"></span>
    <span class="bpg-beat bpg-beat-2"></span>
    <span class="bpg-beat bpg-beat-3"></span>
    <span class="bpg-beat bpg-beat-4"></span>
    <span class="bpg-beat bpg-beat-5"></span>
  </div>
  <p class="bpg-note">Pulse 62 bpm</p>
</main>
</body>
</html>
