
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Vue 3 + EaseMotion CSS Demo</title>
<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<link rel="stylesheet" href="style.css">
<style>
  body { font-family: system-ui, sans-serif; background: #0f172a; color: #f1f5f9; display: flex; align-items: center; justify-content: center; height: 100vh; }
  .ease-card { background: #1e293b; padding: 24px; border-radius: 12px; width: 260px; text-align: center; }
  .ease-btn { padding: 8px 16px; border-radius: 6px; border: none; background: #2563eb; color: #fff; cursor: pointer; margin-top: 12px; }
</style>
</head>
<body>
  <div id="app"></div>

  <script>
    const { createApp, ref } = Vue;
    createApp({
      setup() {
        const isVisible = ref(true);
        return { isVisible };
      },
      template: `
        <div class="ease-card">
          <h3>Vue + EaseMotion</h3>
          <transition name="ease-fade">
            <p v-if="isVisible" class="ease-slide-up">I'm shown via v-if + Vue Transition</p>
          </transition>
          <button class="ease-btn" @click="isVisible = !isVisible">Toggle</button>
        </div>
      `
    }).mount('#app');
  </script>
</body>
</html>
