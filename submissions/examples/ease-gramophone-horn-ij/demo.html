<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-gramophone-horn demo</title>
</head>
<body>
<div class="gp-unit">
  <div class="gp-head">
    <span class="gp-brand">VICTROLA</span>
    <span class="gp-badge">78 RPM</span>
  </div>
  <div class="gp-stage">
    <div class="gp-horn">
      <div class="gp-flare"></div>
      <div class="gp-tube"></div>
    </div>
    <div class="gp-turntable">
      <div class="gp-record"></div>
      <div class="gp-arm"></div>
      <div class="gp-needle"></div>
    </div>
    <div class="gp-crank"></div>
  </div>
  <div class="gp-label">SPRING WOUND</div>
</div>
</body>
</html>
