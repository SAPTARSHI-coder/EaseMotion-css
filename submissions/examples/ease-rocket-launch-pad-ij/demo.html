<!-- EaseMotion component: rocket-launch-pad -->
<!DOCTYPE html>
<html lang="en" data-rocket="pad">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ease Rocket Launch Pad</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="launch-pad">
  <header class="pad-head">
    <span class="pad-label">LAUNCH SITE 39</span>
    <span class="pad-count">T-MINUS 00:10</span>
  </header>
  <div class="gantry">
    <span class="gantry-beam"></span>
    <span class="rocket-body">
      <span class="rocket-nose"></span>
      <span class="rocket-window"></span>
    </span>
    <span class="rocket-fins"></span>
  </div>
  <div class="pad-base">
    <span class="flame-core"></span>
    <span class="flame-outer"></span>
  </div>
  <div class="smoke-bank">
    <span class="smoke-puff puff-1"></span>
    <span class="smoke-puff puff-2"></span>
    <span class="smoke-puff puff-3"></span>
  </div>
  <footer class="pad-foot">
    <span class="pad-status">GO FOR LAUNCH</span>
  </footer>
</main>
</body>
</html>
