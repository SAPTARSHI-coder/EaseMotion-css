<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flowing Gradient Text Demo</title>
  <link rel="stylesheet" href="../../../easemotion.css">
  <link rel="stylesheet" href="./style.css">
  <style>
    body {
      background-color: #0f172a; /* Slate 900 for high contrast */
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 2rem;
      text-align: center;
    }
    
    .demo-container {
      max-width: 800px;
    }

    /* Base typography styles for the demo */
    h1 {
      font-size: 4rem;
      font-weight: 800;
      letter-spacing: -0.05em;
      margin-bottom: 1rem;
      line-height: 1.2;
    }
    
    h2 {
      font-size: 2.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-top: 3rem;
      margin-bottom: 0.5rem;
    }

    p {
      color: #94a3b8;
      font-size: 1.25rem;
      max-width: 600px;
      margin: 0 auto;
    }
  </style>
</head>
<body>

  <div class="demo-container">
    
    <!-- Sunset Gradient Variant -->
    <h1 class="ease-text-gradient ease-text-gradient-sunset">
      Build beautiful motion.
    </h1>
    <p>A flowing sunset gradient perfect for hero sections.</p>

    <!-- Ocean Gradient Variant -->
    <h2 class="ease-text-gradient ease-text-gradient-ocean">
      Zero JavaScript Required
    </h2>
    <p>A deep oceanic gradient that breathes life into standard typography.</p>
    
    <!-- Cyberpunk Gradient Variant -->
    <h2 class="ease-text-gradient ease-text-gradient-cyber">
      Future-Proof Design
    </h2>
    <p>High contrast, neon cyberpunk flow.</p>

  </div>

</body>
</html>
