<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Stats Dashboard Card - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="em-stats-page">
        <div class="em-stats-card" tabindex="0" role="region" aria-label="Monthly Revenue Statistics Card: 48,250 dollars, up 12.5 percent">
            <header class="em-card-top">
                <div class="em-card-meta">
                    <span class="em-card-label">TOTAL REVENUE</span>
                    <h2 class="em-card-number">$48,250</h2>
                </div>
                <div class="em-card-icon" aria-hidden="true">
                    <span>📈</span>
                </div>
            </header>

            <div class="em-card-middle">
                <div class="em-trend-badge em-trend-positive">
                    <span class="em-trend-arrow">↑</span>
                    <span class="em-trend-value">+12.5%</span>
                </div>
                <span class="em-trend-period">vs last month</span>
            </div>

            <div class="em-sparkline-container" aria-hidden="true">
                <svg class="em-sparkline" viewBox="0 0 200 50" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M 0 40 Q 30 25, 60 30 T 120 15 T 180 5 T 200 2" stroke="var(--em-accent)" stroke-width="3" stroke-linecap="round"/>
                </svg>
            </div>
        </div>
    </div>
</body>
</html>
