<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Pure CSS kinetic typography animation"
  >
  <title>CSS Kinetic Typography</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="kinetic-page">
    <section class="kinetic-card" aria-labelledby="kinetic-title">
      <span class="eyebrow">EaseMotion CSS</span>

      <h1 id="kinetic-title" class="kinetic-title">
        <span class="word word-one">MOVE</span>
        <span class="word word-two">CREATE</span>
        <span class="word word-three">INSPIRE</span>
      </h1>

      <p class="description">
        Rhythmic word movement and transformation created entirely
        with CSS keyframe animations.
      </p>

      <div class="controls" aria-label="Animation information">
        <span>PURE CSS</span>
        <span>KEYFRAMES</span>
        <span>RESPONSIVE</span>
      </div>
    </section>
  </main>
</body>
</html>
