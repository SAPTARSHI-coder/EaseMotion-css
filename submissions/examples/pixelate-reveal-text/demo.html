<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Pixelate Reveal Text</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="pixelate-container" aria-label="Pixelate reveal text animation">

    <section class="pixel-panel">

      <p class="label">EASEMOTION CSS</p>

      <h1 class="pixel-text">
        NORTHERN FUTURE
      </h1>

      <p class="description">
        Text starts pixelated and smoothly sharpens into focus.
      </p>

      <button class="reveal-btn">
        REVEAL TEXT
      </button>

    </section>

  </main>

</body>
</html>
