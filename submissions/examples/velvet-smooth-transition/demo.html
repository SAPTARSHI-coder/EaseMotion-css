<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Velvet Smooth Transition</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="media-demo">
    <section class="media-card">
      <div class="media-art" aria-hidden="true">
        <span class="play-icon">▶</span>
      </div>

      <div class="media-content">
        <p class="media-label">NOW PLAYING</p>
        <h1>Velvet Smooth Transition</h1>
        <p class="media-description">
          A soft, smooth CSS transition effect for audio and media interfaces.
        </p>

        <div class="media-controls">
          <button class="media-button" type="button" aria-label="Previous">
            ◀
          </button>

          <button class="media-button media-button--play" type="button" aria-label="Play">
            ▶
          </button>

          <button class="media-button" type="button" aria-label="Next">
            ▶
          </button>
        </div>

        <div class="progress-track" aria-label="Media progress">
          <span class="progress-value"></span>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
