<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glassmorphism Pagination</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="page">
        <section class="pagination-card">
            <span class="eyebrow">Navigation</span>
            <h1>Glassmorphism Pagination</h1>
            <p>Pastel pagination with a soft glass effect.</p>

            <nav class="pagination" aria-label="Pagination">
                <a href="#" class="page-btn arrow" aria-label="Previous page">
                    &lsaquo;
                </a>

                <a href="#" class="page-btn active" aria-current="page">1</a>
                <a href="#" class="page-btn">2</a>
                <a href="#" class="page-btn">3</a>
                <span class="dots">...</span>
                <a href="#" class="page-btn">8</a>

                <a href="#" class="page-btn arrow" aria-label="Next page">
                    &rsaquo;
                </a>
            </nav>
        </section>
    </main>

</body>
</html>
