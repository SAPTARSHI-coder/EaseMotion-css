<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CSS favorite star toggle button.">
  <title>CSS Toggle Favorite Star</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">
    <section class="favorite-card" aria-labelledby="favorite-title">
      <span class="category">Saved item</span>

      <h1 id="favorite-title">Favorite this design</h1>

      <p>
        Toggle the star to mark this item as a favorite.
      </p>

      <label class="favorite-control">
        <input
          class="favorite-input"
          type="checkbox"
          aria-label="Add design to favorites"
        >

        <span class="star" aria-hidden="true">★</span>
      </label>
    </section>
  </main>

</body>
</html>
