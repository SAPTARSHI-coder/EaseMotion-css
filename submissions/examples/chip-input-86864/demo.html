<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chip Input #86864 Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="showcase-wrapper">
    <div class="chip-card">
      <div class="card-header">
        <span class="card-title">Technology Tags</span>
        <span class="card-badge">Pill Input</span>
      </div>

      <div class="chip-input-container" id="chipContainer">
        <div class="chip-item">
          <span>JavaScript</span>
          <button type="button" class="chip-remove-btn" aria-label="Remove JavaScript">×</button>
        </div>
        <div class="chip-item">
          <span>CSS3</span>
          <button type="button" class="chip-remove-btn" aria-label="Remove CSS3">×</button>
        </div>
        <input 
          type="text" 
          id="chipInput" 
          class="chip-text-input" 
          placeholder="Type tag & press Enter..." 
          autocomplete="off"
        >
      </div>

      <div class="card-footer">
        <span>Press <strong>Enter</strong> or comma to add tag</span>
        <span id="chipCount">2 tags added</span>
      </div>
    </div>
  </div>

  <script>
    const container = document.getElementById('chipContainer');
    const input = document.getElementById('chipInput');
    const chipCount = document.getElementById('chipCount');

    function updateCount() {
      const count = container.querySelectorAll('.chip-item').length;
      chipCount.textContent = `${count} tag${count === 1 ? '' : 's'} added`;
    }

    function createChip(text) {
      const trimmed = text.trim().replace(/^,+|,+$/g, '');
      if (!trimmed) return;

      const existing = Array.from(container.querySelectorAll('.chip-item span'))
        .some(span => span.textContent.toLowerCase() === trimmed.toLowerCase());
      if (existing) return;

      const chip = document.createElement('div');
      chip.className = 'chip-item';
      chip.innerHTML = `
        <span>${trimmed}</span>
        <button type="button" class="chip-remove-btn" aria-label="Remove ${trimmed}">×</button>
      `;

      chip.querySelector('.chip-remove-btn').addEventListener('click', () => removeChip(chip));
      container.insertBefore(chip, input);
      input.value = '';
      updateCount();
    }

    function removeChip(chip) {
      chip.classList.add('removing');
      setTimeout(() => {
        chip.remove();
        updateCount();
      }, 180);
    }

    container.addEventListener('click', () => input.focus());
    input.addEventListener('focus', () => container.classList.add('focused'));
    input.addEventListener('blur', () => container.classList.remove('focused'));

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ',') {
        e.preventDefault();
        createChip(input.value);
      } else if (e.key === 'Backspace' && input.value === '') {
        const chips = container.querySelectorAll('.chip-item');
        if (chips.length > 0) {
          removeChip(chips[chips.length - 1]);
        }
      }
    });

    container.querySelectorAll('.chip-remove-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        removeChip(btn.closest('.chip-item'));
      });
    });
  </script>
</body>
</html>
