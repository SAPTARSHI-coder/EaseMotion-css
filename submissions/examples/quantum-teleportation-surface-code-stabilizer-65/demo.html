<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quantum Teleportation Surface Code Stabilizer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="quantum-surface-container">
    <div class="teleportation-core">
      <div class="flux-ring"></div>
      <div class="flux-ring outer"></div>
      <div class="stabilizer-grid">
        <div class="qubit-node active"></div>
        <div class="qubit-node inactive"></div>
        <div class="qubit-node error"></div>
        <div class="qubit-node active"></div>
      </div>
      <div class="teleport-beam"></div>
    </div>
    <div class="telemetry-panel">
      <div class="status-indicator">Sys: Online</div>
      <div class="flux-gauge"></div>
    </div>
  </div>
</body>
</html>
