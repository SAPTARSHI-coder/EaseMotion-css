<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Bounce-Pulse Tabs - EaseMotion</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Mock E-Commerce Checkout Layout -->
  <main class="checkout-layout">
    
    <div class="checkout-header">
      <h1>Secure Checkout</h1>
      <p>Complete your details below to finalize your order.</p>
    </div>

    <div class="checkout-panel">
      <!-- Hidden Radios for Tab State -->
      <input type="radio" name="checkout-tabs" id="tab-1" class="tab-radio" checked>
      <input type="radio" name="checkout-tabs" id="tab-2" class="tab-radio">
      <input type="radio" name="checkout-tabs" id="tab-3" class="tab-radio">

      <!-- Tabs Navigation (The Pill Container) -->
      <nav class="tabs-header" aria-label="Checkout Steps">
        
        <!-- The Bouncing Background Pill Indicator -->
        <div class="bouncing-pill"></div>
        
        <!-- Tab 1: Shipping -->
        <label for="tab-1" class="tab-label" aria-label="Shipping Step">
          <div class="tab-icon-wrapper">
            <span class="tab-icon">1</span>
            <div class="pulse-ring"></div>
          </div>
          <span class="tab-text">Shipping</span>
        </label>
        
        <!-- Tab 2: Payment -->
        <label for="tab-2" class="tab-label" aria-label="Payment Step">
          <div class="tab-icon-wrapper">
            <span class="tab-icon">2</span>
            <div class="pulse-ring"></div>
          </div>
          <span class="tab-text">Payment</span>
        </label>
        
        <!-- Tab 3: Review -->
        <label for="tab-3" class="tab-label" aria-label="Review Step">
          <div class="tab-icon-wrapper">
            <span class="tab-icon">3</span>
            <div class="pulse-ring"></div>
          </div>
          <span class="tab-text">Review</span>
        </label>

      </nav>

      <!-- Tabs Content Sections -->
      <div class="tabs-content">
        
        <!-- Panel 1: Shipping Form -->
        <section class="tab-panel panel-1">
          <h2>Shipping Address</h2>
          <div class="mock-form">
            <div class="mock-row">
              <div class="mock-input-group">
                <label>First Name</label>
                <input type="text" class="real-input" placeholder="Jane">
              </div>
              <div class="mock-input-group">
                <label>Last Name</label>
                <input type="text" class="real-input" placeholder="Doe">
              </div>
            </div>
            <div class="mock-input-group">
              <label>Street Address</label>
              <input type="text" class="real-input" placeholder="123 Checkout Blvd">
            </div>
            <!-- Label acts as 'Next' button to advance to Tab 2 -->
            <label for="tab-2" class="next-btn">Continue to Payment</label>
          </div>
        </section>

        <!-- Panel 2: Payment Form -->
        <section class="tab-panel panel-2">
          <h2>Payment Method</h2>
          <div class="mock-form">
            <div class="mock-input-group">
              <label>Card Number</label>
              <input type="text" class="real-input" placeholder="0000 0000 0000 0000">
            </div>
            <div class="mock-row">
              <div class="mock-input-group">
                <label>Expiry Date</label>
                <input type="text" class="real-input" placeholder="MM/YY">
              </div>
              <div class="mock-input-group">
                <label>CVC</label>
                <input type="password" class="real-input" placeholder="123">
              </div>
            </div>
            <!-- Label acts as 'Next' button to advance to Tab 3 -->
            <label for="tab-3" class="next-btn">Review Order</label>
          </div>
        </section>

        <!-- Panel 3: Order Review -->
        <section class="tab-panel panel-3">
          <h2>Order Summary</h2>
          <div class="summary-box">
            <div class="summary-row">
              <span>Subtotal</span>
              <span>$140.00</span>
            </div>
            <div class="summary-row">
              <span>Taxes</span>
              <span>$12.50</span>
            </div>
            <hr class="divider">
            <div class="summary-row total">
              <span>Total</span>
              <span>$152.50</span>
            </div>
          </div>
          <button class="next-btn confirm-btn" onclick="alert('Order Placed Successfully!')">Place Order</button>
        </section>

      </div>
    </div>
  </main>

</body>
</html>
