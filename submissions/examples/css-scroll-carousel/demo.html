<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pure CSS Scroll-Snapping Carousel</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="ease-carousel">
    <div class="ease-carousel-container">
        <!-- Item 1 -->
        <div class="ease-carousel-item">
            <img src="https://images.unsplash.com/photo-1506744626753-1fa44df31c78?auto=format&fit=crop&q=80&w=1200" alt="Beautiful landscape">
            <div class="item-content">
                <h3>Mountain Peaks</h3>
                <p>Explore the majestic heights of nature.</p>
            </div>
        </div>
        <!-- Item 2 -->
        <div class="ease-carousel-item">
            <img src="https://images.unsplash.com/photo-1469474968028-56623f02e42e?auto=format&fit=crop&q=80&w=1200" alt="Nature view">
            <div class="item-content">
                <h3>Serene Valleys</h3>
                <p>Discover tranquility in the green heartlands.</p>
            </div>
        </div>
        <!-- Item 3 -->
        <div class="ease-carousel-item">
            <img src="https://images.unsplash.com/photo-1470071131384-001b85755b36?auto=format&fit=crop&q=80&w=1200" alt="Mountain scenery">
            <div class="item-content">
                <h3>Misty Mornings</h3>
                <p>Wake up to the gentle touch of dawn.</p>
            </div>
        </div>
        <!-- Item 4 -->
        <div class="ease-carousel-item">
            <img src="https://images.unsplash.com/photo-1472214103451-9374bd1c798e?auto=format&fit=crop&q=80&w=1200" alt="Scenic outdoors">
            <div class="item-content">
                <h3>Hidden Trails</h3>
                <p>Journey through the unknown wilderness.</p>
            </div>
        </div>
        <!-- Item 5 -->
        <div class="ease-carousel-item">
            <img src="https://images.unsplash.com/photo-1447752875215-b2761acb3c5d?auto=format&fit=crop&q=80&w=1200" alt="Forest path">
            <div class="item-content">
                <h3>Enchanted Forests</h3>
                <p>Lose yourself in the woods.</p>
            </div>
        </div>
    </div>
</div>

</body>
</html>
