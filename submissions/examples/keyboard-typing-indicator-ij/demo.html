<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-keyboard-typing-indicator demo</title>
</head>
<body>
<div class="kti-box">
  <div class="kti-keys">
    <span class="kti-key">Q</span>
    <span class="kti-key">W</span>
    <span class="kti-key">E</span>
    <span class="kti-key">R</span>
    <span class="kti-key">T</span>
    <span class="kti-key">Y</span>
    <span class="kti-key">U</span>
    <span class="kti-key">I</span>
    <span class="kti-key">O</span>
    <span class="kti-key">P</span>
  </div>
  <div class="kti-chat">
    <span class="kti-dot"></span>
    <span class="kti-dot"></span>
    <span class="kti-dot"></span>
  </div>
  <b class="kti-status">typing...</b>
</div>
</body>
</html>
