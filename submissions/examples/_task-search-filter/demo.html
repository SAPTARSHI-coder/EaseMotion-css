<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task Search and Filter Component</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <header class="header">
      <h1>Task Dashboard</h1>
      <p>Search, filter, and organize your tasks easily.</p>
    </header>

    <!-- Task Search & Filter UI Component -->
    <section class="task-controls" aria-label="Task search and filters">
      <div class="search-wrapper">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input 
          type="text" 
          id="taskSearch" 
          class="search-input" 
          placeholder="Search tasks by title..." 
          aria-label="Search tasks by title"
        />
        <button id="clearSearch" class="clear-btn" type="button" aria-label="Clear search" hidden>&times;</button>
      </div>

      <div class="filter-group" role="tablist" aria-label="Filter tasks">
        <button type="button" role="tab" class="filter-btn active" data-filter="all" aria-selected="true">
          All <span class="badge" id="countAll">0</span>
        </button>
        <button type="button" role="tab" class="filter-btn" data-filter="pending" aria-selected="false">
          Pending <span class="badge" id="countPending">0</span>
        </button>
        <button type="button" role="tab" class="filter-btn" data-filter="completed" aria-selected="false">
          Completed <span class="badge" id="countCompleted">0</span>
        </button>
      </div>
    </section>

    <!-- Task List Demo Section -->
    <section class="tasks-container" aria-live="polite">
      <ul id="taskList" class="task-list">
        <!-- Sample tasks for demo rendering -->
        <li class="task-card" data-status="pending">
          <div class="task-info">
            <span class="status-indicator pending"></span>
            <h3>Design search bar & filter chips</h3>
          </div>
          <span class="status-pill pending">Pending</span>
        </li>
        <li class="task-card" data-status="completed">
          <div class="task-info">
            <span class="status-indicator completed"></span>
            <h3>Setup project repository</h3>
          </div>
          <span class="status-pill completed">Completed</span>
        </li>
        <li class="task-card" data-status="pending">
          <div class="task-info">
            <span class="status-indicator pending"></span>
            <h3>Optimize mobile layout responsiveness</h3>
          </div>
          <span class="status-pill pending">Pending</span>
        </li>
        <li class="task-card" data-status="completed">
          <div class="task-info">
            <span class="status-indicator completed"></span>
            <h3>Implement keyboard accessibility</h3>
          </div>
          <span class="status-pill completed">Completed</span>
        </li>
      </ul>
      <p id="emptyState" class="empty-state" hidden>No matching tasks found.</p>
    </section>
  </main>

  <script>
    const searchInput = document.getElementById('taskSearch');
    const clearBtn = document.getElementById('clearSearch');
    const filterButtons = document.querySelectorAll('.filter-btn');
    const taskCards = document.querySelectorAll('.task-card');
    const emptyState = document.getElementById('emptyState');

    let currentFilter = 'all';
    let searchQuery = '';

    function updateCounts() {
      const total = taskCards.length;
      let pending = 0;
      let completed = 0;

      taskCards.forEach(card => {
        if (card.dataset.status === 'pending') pending++;
        if (card.dataset.status === 'completed') completed++;
      });

      document.getElementById('countAll').textContent = total;
      document.getElementById('countPending').textContent = pending;
      document.getElementById('countCompleted').textContent = completed;
    }

    function applyFilters() {
      let visibleCount = 0;

      taskCards.forEach(card => {
        const title = card.querySelector('h3').textContent.toLowerCase();
        const status = card.dataset.status;

        const matchesSearch = title.includes(searchQuery.toLowerCase());
        const matchesFilter = currentFilter === 'all' || status === currentFilter;

        if (matchesSearch && matchesFilter) {
          card.classList.remove('hidden');
          visibleCount++;
        } else {
          card.classList.add('hidden');
        }
      });

      emptyState.hidden = visibleCount > 0;
    }

    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      clearBtn.hidden = searchQuery.length === 0;
      applyFilters();
    });

    clearBtn.addEventListener('click', () => {
      searchInput.value = '';
      searchQuery = '';
      clearBtn.hidden = true;
      searchInput.focus();
      applyFilters();
    });

    filterButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        filterButtons.forEach(b => {
          b.classList.remove('active');
          b.setAttribute('aria-selected', 'false');
        });
        btn.classList.add('active');
        btn.setAttribute('aria-selected', 'true');
        currentFilter = btn.dataset.filter;
        applyFilters();
      });
    });

    updateCounts();
  </script>
</body>
</html>
