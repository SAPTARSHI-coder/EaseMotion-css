<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Alert Toast — EaseMotion CSS</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="alerttoast-page-tm" data-palette="forest">
  <h1 class="alerttoast-h-tm">Alert Toast</h1>
  <p class="alerttoast-lede-tm">A self-contained demo with three variants of the effect.</p>
  <section class="alerttoast-row-tm">
    <article class="alerttoast-1-wrap-tm">
      <div class="alerttoast-1-tm"></div>
      <span class="alerttoast-lbl-tm">Example One</span>
    </article>
    <article class="alerttoast-2-wrap-tm">
      <div class="alerttoast-2-tm"></div>
      <span class="alerttoast-lbl-tm">Example Two</span>
    </article>
    <article class="alerttoast-3-wrap-tm">
      <div class="alerttoast-3-tm"></div>
      <span class="alerttoast-lbl-tm">Example Three</span>
    </article>
  </section>
</main>
</body>
</html>
