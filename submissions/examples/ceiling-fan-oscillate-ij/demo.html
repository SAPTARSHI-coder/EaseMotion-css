<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-ceiling-fan-oscillate demo</title>
</head>
<body>
<div class="cf-app">
  <span class="cf-title">CEILING FAN</span>
  <span class="cf-rod"></span>
  <div class="cf-housing">
    <div class="cf-blades">
      <span class="cf-blade cf-blade-1"></span>
      <span class="cf-blade cf-blade-2"></span>
      <span class="cf-blade cf-blade-3"></span>
      <span class="cf-blade cf-blade-4"></span>
    </div>
    <span class="cf-light"></span>
    <span class="cf-chain"></span>
  </div>
  <div class="cf-wall">
    <span class="cf-switch"></span>
    <span class="cf-speed cf-speed-1"></span>
    <span class="cf-speed cf-speed-2"></span>
    <span class="cf-speed cf-speed-3"></span>
  </div>
</div>
</body>
</html>
