<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Bubble Wrap Button</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="page">
    <section class="demo" aria-labelledby="title">
      <p class="eyebrow">CSS INTERACTION</p>
      <h1 id="title">Bubble Wrap Button</h1>

      <p class="description">
        Press the button to create a playful bubble-pop effect.
      </p>

      <div class="bubble-button">
        <button type="button" aria-label="Pop bubble wrap">
          POP IT!
        </button>

        <span class="bubble bubble-1" aria-hidden="true"></span>
        <span class="bubble bubble-2" aria-hidden="true"></span>
        <span class="bubble bubble-3" aria-hidden="true"></span>
        <span class="bubble bubble-4" aria-hidden="true"></span>
        <span class="bubble bubble-5" aria-hidden="true"></span>
        <span class="bubble bubble-6" aria-hidden="true"></span>
        <span class="bubble bubble-7" aria-hidden="true"></span>
        <span class="bubble bubble-8" aria-hidden="true"></span>
      </div>
    </section>
  </main>
</body>
</html>
