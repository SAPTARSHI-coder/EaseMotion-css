<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SCSS Table Layout Fixed — Showcase & Usage</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="ease-container">
    <div class="ease-card">
      <div class="ease-table-wrapper">
        <table class="ease-table">
          <thead>
            <tr>
              <th style="width: 25%;">Project Name</th>
              <th style="width: 45%;">Description Summary</th>
              <th style="width: 30%;">Status</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>EaseMotion Core</td>
              <td>Deterministic table layout helper mixin implementation for responsive data tables.</td>
              <td>Active Production</td>
            </tr>
            <tr>
              <td>Zinger Suite</td>
              <td>Industrial network monitoring observability dashboard and metric thresholds.</td>
              <td>Deployed Live</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</body>
</html>
