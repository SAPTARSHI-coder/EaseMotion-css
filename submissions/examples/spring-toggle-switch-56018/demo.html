<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spring-Animated Toggle Switch Demo</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            margin: 0;
            height: 100vh;
            background-color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .demo-panel {
            background: white;
            padding: 30px 40px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            gap: 20px;
        }
        
        .demo-panel span {
            font-size: 1.1rem;
            color: #334155;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="demo-panel">
        <span>Dark Mode</span>
        
        <!-- The Accessible Toggle Structure -->
        <label class="ease-toggle-container">
            <input type="checkbox" class="ease-toggle-input">
            <div class="ease-toggle-switch"></div>
        </label>
        
    </div>
</body>
</html>
