<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Accessible CSS PIN Entry Keypad">
  <title>CSS PIN Entry Keypad</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="page">
    <section class="pin-card" aria-labelledby="pin-title">
      <h1 id="pin-title">Enter PIN</h1>
      <p class="subtitle">Enter your 4-digit PIN</p>

      <div class="pin-display" aria-label="PIN entry">
        <span class="pin-dot"></span>
        <span class="pin-dot"></span>
        <span class="pin-dot"></span>
        <span class="pin-dot"></span>
      </div>

      <div class="keypad" role="group" aria-label="PIN keypad">
        <button type="button" aria-label="Number 1">1</button>
        <button type="button" aria-label="Number 2">2</button>
        <button type="button" aria-label="Number 3">3</button>

        <button type="button" aria-label="Number 4">4</button>
        <button type="button" aria-label="Number 5">5</button>
        <button type="button" aria-label="Number 6">6</button>

        <button type="button" aria-label="Number 7">7</button>
        <button type="button" aria-label="Number 8">8</button>
        <button type="button" aria-label="Number 9">9</button>

        <button type="button" class="action" aria-label="Clear PIN">
          C
        </button>
        <button type="button" aria-label="Number 0">0</button>
        <button type="button" class="action" aria-label="Delete last digit">
          ←
        </button>
      </div>

      <button type="button" class="submit-button">
        Continue
      </button>
    </section>
  </main>
</body>
</html>
