<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Step Progress Tracker — EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <p class="label">Pure CSS Wizard Step Progress Tracker</p>

  <div class="ease-step-progress-v6">
    <div class="ease-step-progress-bar-v6"></div>

    <div class="ease-step-item-v6 ease-step-item-v6--completed">
      <div class="ease-step-circle-v6">✓</div>
      <span class="ease-step-label-v6">Account</span>
    </div>

    <div class="ease-step-item-v6 ease-step-item-v6--active">
      <div class="ease-step-circle-v6">2</div>
      <span class="ease-step-label-v6">Billing</span>
    </div>

    <div class="ease-step-item-v6">
      <div class="ease-step-circle-v6">3</div>
      <span class="ease-step-label-v6">Confirm</span>
    </div>
  </div>

</body>
</html>
