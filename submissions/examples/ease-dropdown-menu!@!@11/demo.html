<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animated Button Collection - EaseMotion Submission</title>
  
  <!-- EaseMotion CSS Official CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="container ease-fade-in">
    <h1 class="ease-slide-up">Animated Button Collection</h1>
    <p class="ease-slide-up ease-delay-100">Hover over each button to see the animations</p>
    
    <!-- Primary Buttons -->
    <section class="button-section ease-slide-up ease-delay-200">
      <h2>Primary Buttons</h2>
      <div class="button-grid">
        <button class="btn btn-primary ease-hover-scale">Scale Effect</button>
        <button class="btn btn-primary ease-hover-lift">Lift Effect</button>
        <button class="btn btn-primary ease-hover-grow">Grow Effect</button>
        <button class="btn btn-primary ease-pulse">Pulse Effect</button>
      </div>
    </section>

    <!-- Secondary Buttons -->
    <section class="button-section ease-slide-up ease-delay-300">
      <h2>Secondary Buttons</h2>
      <div class="button-grid">
        <button class="btn btn-secondary ease-hover-scale">Scale Effect</button>
        <button class="btn btn-secondary ease-hover-lift">Lift Effect</button>
        <button class="btn btn-secondary ease-hover-grow">Grow Effect</button>
        <button class="btn btn-secondary ease-pulse">Pulse Effect</button>
      </div>
    </section>

    <!-- Outline Buttons -->
    <section class="button-section ease-slide-up ease-delay-400">
      <h2>Outline Buttons</h2>
      <div class="button-grid">
        <button class="btn btn-outline ease-hover-scale">Scale Effect</button>
        <button class="btn btn-outline ease-hover-lift">Lift Effect</button>
        <button class="btn btn-outline ease-hover-grow">Grow Effect</button>
        <button class="btn btn-outline ease-pulse">Pulse Effect</button>
      </div>
    </section>

    <!-- Gradient Buttons -->
    <section class="button-section ease-slide-up ease-delay-500">
      <h2>Gradient Buttons</h2>
      <div class="button-grid">
        <button class="btn btn-gradient-1 ease-hover-scale">Gradient 1</button>
        <button class="btn btn-gradient-2 ease-hover-lift">Gradient 2</button>
        <button class="btn btn-gradient-3 ease-hover-grow">Gradient 3</button>
        <button class="btn btn-gradient-4 ease-pulse">Gradient 4</button>
      </div>
    </section>

    <!-- Icon Buttons -->
    <section class="button-section ease-slide-up ease-delay-600">
      <h2>Icon Buttons</h2>
      <div class="button-grid">
        <button class="btn btn-icon ease-hover-scale">
          <span class="icon">🚀</span>
          <span>Launch</span>
        </button>
        <button class="btn btn-icon ease-hover-lift">
          <span class="icon">⭐</span>
          <span>Favorite</span>
        </button>
        <button class="btn btn-icon ease-hover-grow">
          <span class="icon">💾</span>
          <span>Save</span>
        </button>
        <button class="btn btn-icon ease-pulse">
          <span class="icon">🔔</span>
          <span>Notify</span>
        </button>
      </div>
    </section>

  </div>

</body>
</html>
