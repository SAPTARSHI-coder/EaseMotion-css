<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bloom Filter Membership</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="advanced-shell" aria-labelledby="advanced-title">
    <section class="advanced-panel">
      <p class="eyebrow">probabilistic lookup</p>
      <h1 id="advanced-title">Bloom Filter Membership</h1>
      <p class="summary">A CSS-only visualization of hash probes lighting up a bitset, showing probable membership and false-positive risk in motion.</p>
      <div class="stage" role="img" aria-label="Animated Bloom Filter Membership visualization">
        <div class="halo halo-one"></div>
        <div class="halo halo-two"></div>
        <article class="tile tile-a"><strong>01</strong><span>hash probes</span></article>
        <article class="tile tile-b"><strong>02</strong><span>bits aligned</span></article>
        <article class="tile tile-c"><strong>03</strong><span>maybe present</span></article>
        <div class="lane lane-ab"><i></i></div>
        <div class="lane lane-bc"><i></i></div>
        <div class="lane lane-ca"><i></i></div>
        <div class="resolution">maybe present</div>
      </div>
      <div class="status-grid" aria-label="Bloom Filter Membership status">
        <span>hash probes</span>
        <span>bits aligned</span>
        <span>maybe present</span>
      </div>
    </section>
  </main>
</body>
</html>
