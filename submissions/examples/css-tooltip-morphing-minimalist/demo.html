<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Morphing Tooltip</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="morph-tt-container">
        <button class="morph-target">Hover Me</button>
        <div class="morph-tooltip">
            <span class="morph-text">Detailed context information displayed here.</span>
        </div>
    </div>
</body>
</html>
