<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="CSS running pace display with animated shoe icon"
  >
  <title>CSS Running Pace Display</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section class="pace-card" aria-labelledby="pace-title">
      <div class="card-top">
        <span class="status-dot" aria-hidden="true"></span>
        <span>RUNNING SESSION</span>
      </div>

      <div class="shoe" aria-hidden="true">
        <span class="shoe-upper"></span>
        <span class="shoe-lace lace-one"></span>
        <span class="shoe-lace lace-two"></span>
        <span class="shoe-sole"></span>
      </div>

      <div class="pace-content">
        <p class="eyebrow">Current Pace</p>

        <h1 id="pace-title">
          <span class="pace-value">5:24</span>
          <span class="pace-unit">/km</span>
        </h1>

        <p class="pace-description">
          Keep moving. Your current pace is looking strong.
        </p>
      </div>

      <div class="stats" aria-label="Running statistics">
        <div class="stat">
          <span class="stat-label">Distance</span>
          <strong>6.8 km</strong>
        </div>

        <div class="stat">
          <span class="stat-label">Time</span>
          <strong>36:43</strong>
        </div>

        <div class="stat">
          <span class="stat-label">Calories</span>
          <strong>412 kcal</strong>
        </div>
      </div>

      <div class="pace-bar" aria-hidden="true">
        <span></span>
      </div>
    </section>
  </main>
</body>
</html>
