<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Helicopter Rotor Wash — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Helicopter Rotor Wash demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Helicopter Rotor Wash</h1>
      <p class="lede">Helicopter main rotor spinning with downwash rings</p>
    </header>

    <section class="ease-helicopter-rotor-wash" data-demo="helicopter-rotor-wash" aria-live="polite">
      <div class="ease-helicopter-rotor-wash__housing">
        <div class="ease-helicopter-rotor-wash__bezel">
          <div class="ease-helicopter-rotor-wash__face">
            <div class="ease-helicopter-rotor-wash__readout">
              <span class="ease-helicopter-rotor-wash__label">Helicopter Rotor Wash</span>
              <span class="ease-helicopter-rotor-wash__value">LIVE</span>
            </div>
            <div class="ease-helicopter-rotor-wash__motion" aria-hidden="true">
              <span class="ease-helicopter-rotor-wash__a"></span>
              <span class="ease-helicopter-rotor-wash__b"></span>
              <span class="ease-helicopter-rotor-wash__c"></span>
              <span class="ease-helicopter-rotor-wash__d"></span>
            </div>
            <div class="ease-helicopter-rotor-wash__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-helicopter-rotor-wash__controls">
          <button type="button" class="ease-helicopter-rotor-wash__btn primary">Engage</button>
          <button type="button" class="ease-helicopter-rotor-wash__btn">Reset</button>
          <label class="ease-helicopter-rotor-wash__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-helicopter-rotor-wash__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
