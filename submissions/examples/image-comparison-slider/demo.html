<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Comparison Slider</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">

        <header>
            <p class="tag">EaseMotion CSS</p>
            <h1>Image Comparison Slider</h1>
            <p>
                Compare two images using a smooth CSS-based reveal effect.
            </p>
        </header>

        <section class="comparison" aria-label="Image comparison">

            <div class="image image-before">
                <img
                    src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=1200&q=80"
                    alt="Mountain landscape before comparison">
                <span class="label">Before</span>
            </div>

            <div class="image image-after">
                <img
                    src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1200&q=80"
                    alt="Mountain landscape after comparison">
                <span class="label">After</span>
            </div>

            <div class="divider" aria-hidden="true">
                <span>↔</span>
            </div>

        </section>

        <p class="hint">
            Hover over the comparison area to reveal the image.
        </p>

    </main>

</body>
</html>
