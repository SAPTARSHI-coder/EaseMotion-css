<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-world-clock-display</title>
</head>
<body>
<main class="wcl-card">
  <h1 class="wcl-title">World Clock</h1>
  <div class="wcl-rows">
    <div class="wcl-row">
      <span class="wcl-city">New York</span>
      <span class="wcl-time">09:42</span>
      <span class="wcl-zone">EDT</span>
    </div>
    <div class="wcl-row">
      <span class="wcl-city">London</span>
      <span class="wcl-time">14:42</span>
      <span class="wcl-zone">BST</span>
    </div>
    <div class="wcl-row">
      <span class="wcl-city">Tokyo</span>
      <span class="wcl-time">22:42</span>
      <span class="wcl-zone">JST</span>
    </div>
    <div class="wcl-row">
      <span class="wcl-city">Sydney</span>
      <span class="wcl-time">23:42</span>
      <span class="wcl-zone">AEST</span>
    </div>
    <div class="wcl-row">
      <span class="wcl-city">Delhi</span>
      <span class="wcl-time">19:12</span>
      <span class="wcl-zone">IST</span>
    </div>
  </div>
  <div class="wcl-hands">
    <span class="wcl-hand wcl-hand-hour"></span>
    <span class="wcl-hand wcl-hand-minute"></span>
  </div>
</main>
</body>
</html>
