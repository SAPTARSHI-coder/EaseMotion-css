<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dynamic Gradient Glow Search Bar Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="search-container">
    <div class="gradient-glow-wrapper">
      <div class="gradient-border-box"></div>
      <div class="search-inner">
        <svg class="search-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path fill="currentColor" d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
        </svg>
        <input type="text" class="gradient-search-input" placeholder="Search documentation, components..." aria-label="Search" />
        <span class="search-shortcut">⌘K</span>
      </div>
    </div>
  </div>
</body>
</html>
