<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="CSS shopping cart icon with animated item count badge"
  >

  <title>CSS Shopping Cart Badge</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="demo">
    <h1>Shopping Cart Badge</h1>

    <p>
      A CSS-only shopping cart with an animated item-count badge.
    </p>

    <div class="cart-wrapper">
      <button
        class="cart-button"
        type="button"
        aria-label="Shopping cart with 3 items"
      >
        <span class="cart-icon" aria-hidden="true">
          🛒
        </span>

        <span
          class="cart-badge"
          aria-hidden="true"
        >
          3
        </span>
      </button>
    </div>

    <p class="hint">
      The badge gently pops to indicate a cart update.
    </p>
  </main>

</body>
</html>
