<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimalist Floating Timeline</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="mt-timeline">
        <div class="mt-node">
            <span class="mt-date">Oct 12</span>
            <div class="mt-content">
                <h4>v2.0 Released</h4>
                <p>Major architectural overhaul and UI refresh.</p>
            </div>
        </div>
        <div class="mt-node">
            <span class="mt-date">Oct 05</span>
            <div class="mt-content">
                <h4>Beta Testing</h4>
                <p>Closed beta opened to top 100 users.</p>
            </div>
        </div>
        <div class="mt-node">
            <span class="mt-date">Sep 28</span>
            <div class="mt-content">
                <h4>Alpha Build</h4>
                <p>Internal dogfooding commenced.</p>
            </div>
        </div>
    </div>
</body>
</html>
