<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Animated 3D Button</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="btn3d-wrapper">

    <button class="btn3d">
      <svg class="btn3d-icon" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      Default Button
    </button>

    <button class="btn3d success">
      <svg class="btn3d-icon" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>
      Success
    </button>

    <button class="btn3d danger">
      <svg class="btn3d-icon" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
      Danger
    </button>

    <button class="btn3d warning">
      <svg class="btn3d-icon" viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
      Warning
    </button>

    <button class="btn3d pulse">
      <svg class="btn3d-icon" viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
      Pulse Effect
    </button>

    <button class="btn3d lg">Large Button</button>
    <button class="btn3d sm">Small</button>

  </div>

  <script>
    // Mouse-tracking tilt effect
    document.querySelectorAll('.btn3d.tilt').forEach(btn => {
      btn.addEventListener('mousemove', e => {
        const r = btn.getBoundingClientRect();
        const x = ((e.clientX - r.left) / r.width - 0.5) * 20;
        const y = -((e.clientY - r.top) / r.height - 0.5) * 20;
        btn.style.setProperty('--tilt-x', y + 'deg');
        btn.style.setProperty('--tilt-y', x + 'deg');
      });
      btn.addEventListener('mouseleave', () => {
        btn.style.setProperty('--tilt-x', '0deg');
        btn.style.setProperty('--tilt-y', '0deg');
      });
    });
  </script>
</body>
</html>
