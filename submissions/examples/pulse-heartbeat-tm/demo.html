<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pulse heartbeat — EaseMotion CSS</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="hb-page-tm">
  <h1>Heartbeat pulse</h1>
  <p class="hb-lede-tm">Two soft thumps, then a quiet rest. Three colour presets.</p>

  <section class="hb-row-tm">
    <div class="hb-card-tm">
      <span class="hb-dot-tm" aria-label="live"></span>
      <span>Recording</span>
    </div>
    <div class="hb-card-tm">
      <span class="hb-dot-tm hb-dot-ok-tm" aria-label="online"></span>
      <span>Online</span>
    </div>
    <div class="hb-card-tm">
      <span class="hb-dot-tm hb-dot-warn-tm" aria-label="attention"></span>
      <span>Attention</span>
    </div>
  </section>

  <section class="hb-row-tm">
    <div class="hb-card-tm">
      <span class="hb-dot-tm hb-dot-lg-tm" aria-label="live"></span>
      <span>Large</span>
    </div>
    <div class="hb-card-tm">
      <span class="hb-dot-tm hb-dot-sm-tm" aria-label="live"></span>
      <span>Small</span>
    </div>
  </section>
</main>
</body>
</html>
