<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Root Signal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="garden-page">
  <section class="garden-card">

    <header>
      <span>ORGANIC MOTION</span>
      <h1>Root Signal</h1>
      <p>Plant a signal and watch it grow.</p>
    </header>

    <div class="garden" id="garden">
      <div class="moon"></div>
      <div class="ground"></div>
    </div>

    <footer>
      <div>
        <span>Plants</span>
        <strong id="plantCount">0</strong>
      </div>

      <button id="plantBtn">Plant</button>
      <button id="clearBtn">Clear</button>
    </footer>

  </section>
</main>

<script>
const garden = document.getElementById("garden");
const count = document.getElementById("plantCount");

let plants = [];

function plant(x) {
  const element = document.createElement("div");

  element.className = "plant";

  const height = 80 + Math.random() * 100;
  const hue = 100 + Math.random() * 80;

  element.style.left = `${x}%`;
  element.style.setProperty("--height", `${height}px`);
  element.style.setProperty("--hue", `${hue}`);

  garden.appendChild(element);
  plants.push(element);

  count.textContent = plants.length;
}

garden.addEventListener("pointerdown", e => {
  const rect = garden.getBoundingClientRect();
  const x = ((e.clientX - rect.left) / rect.width) * 100;

  if (e.target === garden) {
    plant(Math.max(5, Math.min(95, x)));
  }
});

document.getElementById("plantBtn").addEventListener("click", () => {
  plant(45 + Math.random() * 10);
});

document.getElementById("clearBtn").addEventListener("click", () => {
  plants.forEach(p => p.remove());
  plants = [];
  count.textContent = "0";
});

document.addEventListener("keydown", e => {
  if (e.code === "Space") {
    e.preventDefault();
    plant(45 + Math.random() * 10);
  }

  if (e.key.toLowerCase() === "r") {
    plants.forEach(p => p.remove());
    plants = [];
    count.textContent = "0";
  }
});
</script>

</body>
</html>
