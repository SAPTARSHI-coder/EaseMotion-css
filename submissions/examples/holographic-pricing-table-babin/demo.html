<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Holographic Iridescent Pricing Table</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="pricing-grid">
    <div class="pricing-card">
      <div class="card-tier">STARTER</div>
      <div class="card-price">$19<span>/mo</span></div>
      <ul class="features-list">
        <li>✔ 5 Active Projects</li>
        <li>✔ 10GB Cloud Storage</li>
        <li>✔ Community Support</li>
      </ul>
      <button class="pricing-btn">Select Plan</button>
    </div>

    <div class="pricing-card featured">
      <div class="badge">MOST POPULAR</div>
      <div class="card-tier">PRO DEVELOPER</div>
      <div class="card-price">$49<span>/mo</span></div>
      <ul class="features-list">
        <li>✔ Unlimited Projects</li>
        <li>✔ 500GB NVMe Storage</li>
        <li>✔ Priority API Access</li>
        <li>✔ 24/7 Dedicated Support</li>
      </ul>
      <button class="pricing-btn featured-btn">Upgrade Now</button>
    </div>
  </div>
</body>
</html>
