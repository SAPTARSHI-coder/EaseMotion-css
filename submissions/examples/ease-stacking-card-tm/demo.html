<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Stacking Card Hover Effect</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="stack-container">

    <div class="stack-card">
      <div class="stack-card-header">
        <div class="stack-card-thumb"></div>
        <div class="stack-card-meta">
          <h3 class="stack-card-title">Premium Plan</h3>
          <span class="stack-card-tag">Most Popular</span>
        </div>
      </div>
      <div class="stack-card-body">
        <div class="stack-card-line"></div>
        <div class="stack-card-line"></div>
        <div class="stack-card-line"></div>
      </div>
      <div class="stack-card-footer">
        <span class="stack-card-price">$29/mo</span>
        <button class="stack-card-btn">Get Started</button>
      </div>
    </div>

    <div class="stack-card spring theme-magenta">
      <div class="stack-card-header">
        <div class="stack-card-thumb"></div>
        <div class="stack-card-meta">
          <h3 class="stack-card-title">Pro Plan</h3>
          <span class="stack-card-tag">For Teams</span>
        </div>
      </div>
      <div class="stack-card-body">
        <div class="stack-card-line"></div>
        <div class="stack-card-line"></div>
        <div class="stack-card-line"></div>
      </div>
      <div class="stack-card-footer">
        <span class="stack-card-price">$49/mo</span>
        <button class="stack-card-btn">Get Started</button>
      </div>
    </div>

    <div class="stack-card lift theme-emerald">
      <div class="stack-card-header">
        <div class="stack-card-thumb"></div>
        <div class="stack-card-meta">
          <h3 class="stack-card-title">Enterprise</h3>
          <span class="stack-card-tag">Custom</span>
        </div>
      </div>
      <div class="stack-card-body">
        <div class="stack-card-line"></div>
        <div class="stack-card-line"></div>
        <div class="stack-card-line"></div>
      </div>
      <div class="stack-card-footer">
        <span class="stack-card-price">Custom</span>
        <button class="stack-card-btn">Contact</button>
      </div>
    </div>

  </div>
</body>
</html>
