<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Cyberpunk Neon glassmorphism UI built with pure HTML and CSS"
  >
  <title>Cyberpunk Neon Glass</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="demo-container">
    <section class="glass-card" aria-labelledby="title">

      <div class="scan-line" aria-hidden="true"></div>

      <div class="neon-orb orb-one" aria-hidden="true"></div>
      <div class="neon-orb orb-two" aria-hidden="true"></div>

      <div class="card-content">
        <span class="status">
          <span class="status-dot"></span>
          SYSTEM ONLINE
        </span>

        <p class="eyebrow">CYBER // 2077</p>

        <h1 id="title">
          Neon
          <span>Interface</span>
        </h1>

        <p class="description">
          A futuristic glassmorphism interface combining translucent
          surfaces, neon accents, and smooth CSS interactions.
        </p>

        <div class="card-actions">
          <button class="neon-button" type="button">
            Initialize
          </button>

          <button class="ghost-button" type="button">
            Explore
          </button>
        </div>
      </div>

      <div class="corner corner-top-left" aria-hidden="true"></div>
      <div class="corner corner-top-right" aria-hidden="true"></div>
      <div class="corner corner-bottom-left" aria-hidden="true"></div>
      <div class="corner corner-bottom-right" aria-hidden="true"></div>

    </section>
  </main>
</body>
</html>
