<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>3D Flip Progress Bar | EaseMotion CSS</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<main class="container">


    <section class="hero">

        <span class="badge">
            EaseMotion CSS
        </span>


        <h1>
            3D-Flip Progress Bar
        </h1>


        <p>
            A futuristic CSS-only progress bar
            with 3D flip animation effects.
        </p>

    </section>



    <section class="progress-wrapper">


        <div class="progress-card">


            <h2>
                Web Development
            </h2>


            <div class="progress-bar">


                <div class="progress-fill">

                    <span>
                        85%
                    </span>

                </div>


            </div>


        </div>





        <div class="progress-card">


            <h2>
                UI/UX Design
            </h2>


            <div class="progress-bar">


                <div class="progress-fill design">

                    <span>
                        70%
                    </span>

                </div>


            </div>


        </div>





        <div class="progress-card">


            <h2>
                Artificial Intelligence
            </h2>


            <div class="progress-bar">


                <div class="progress-fill ai">

                    <span>
                        90%
                    </span>

                </div>


            </div>


        </div>



    </section>


</main>



</body>

</html>
