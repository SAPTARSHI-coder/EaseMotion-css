<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pure CSS Cat</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="container">

    <div class="cat-wrapper" aria-label="Cute cat made using CSS">

        <div class="cat">

            <div class="ear ear-left"></div>
            <div class="ear ear-right"></div>

            <div class="head">

                <div class="eye eye-left"></div>
                <div class="eye eye-right"></div>

                <div class="nose"></div>

                <div class="mouth"></div>

                <div class="whisker w1"></div>
                <div class="whisker w2"></div>
                <div class="whisker w3"></div>
                <div class="whisker w4"></div>

            </div>


            <div class="body"></div>

            <div class="tail"></div>

        </div>


        <h1>Pure CSS Cat</h1>

        <p>
            A cute animated cat created completely
            using HTML and CSS shapes.
        </p>

    </div>

</main>

</body>
</html>
