<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
        name="description"
        content="Neumorphic glitch text reveal effect with keyframe distortion animations"
    >
    <title>Glitch Text Reveal - Neumorphic</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="page">
        <section class="glitch-card" aria-labelledby="title">

            <span class="eyebrow">EASEMOTION • ADVANCED EFFECT</span>

            <h1 id="title" class="glitch" data-text="GLITCH">
                GLITCH
            </h1>

            <p class="subtitle">
                Hover over the text to activate the distortion effect.
            </p>

            <div class="demo-area">
                <div
                    class="glitch-text"
                    data-text="CREATE"
                    tabindex="0"
                    aria-label="Create"
                >
                    CREATE
                </div>

                <span class="status">
                    <span class="status-dot"></span>
                    HOVER TO DISTORT
                </span>
            </div>

        </section>
    </main>

</body>
</html>
