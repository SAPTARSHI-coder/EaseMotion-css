<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Progress Steps - EaseMotion Submission</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="stage">
    <h1 class="page-title">Checkout</h1>

    <div class="stepper" id="stepper">
      <div class="step active" data-step="1">
        <span class="step-num">1</span>
        <span class="step-name">Cart</span>
      </div>
      <span class="step-line"></span>
      <div class="step" data-step="2">
        <span class="step-num">2</span>
        <span class="step-name">Details</span>
      </div>
      <span class="step-line"></span>
      <div class="step" data-step="3">
        <span class="step-num">3</span>
        <span class="step-name">Payment</span>
      </div>
      <span class="step-line"></span>
      <div class="step" data-step="4">
        <span class="step-num">4</span>
        <span class="step-name">Done</span>
      </div>
    </div>

    <div class="stepper-panels">
      <section class="s-panel visible" data-panel="1">
        <h2>Your cart</h2>
        <p>Two animation packs and a starter license in your cart.</p>
      </section>
      <section class="s-panel" data-panel="2">
        <h2>Details</h2>
        <p>Billing email and a promo code field live on this step.</p>
      </section>
      <section class="s-panel" data-panel="3">
        <h2>Payment</h2>
        <p>Card details are entered here, safely encrypted.</p>
      </section>
      <section class="s-panel" data-panel="4">
        <h2>Done!</h2>
        <p>Your license key is on its way to your inbox.</p>
      </section>
    </div>

    <div class="controls">
      <button class="ctrl-btn" id="prevBtn">Back</button>
      <button class="ctrl-btn primary" id="nextBtn">Next</button>
    </div>
  </main>

  <script>
    const steps = document.querySelectorAll('.step');
    const panels = document.querySelectorAll('.s-panel');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    let current = 1;

    function goTo(target) {
      current = target;
      document.getElementById('stepper').setAttribute('data-active', String(current));
      steps.forEach((step, i) => {
        step.classList.toggle('active', i + 1 === current);
        step.classList.toggle('done', i + 1 < current);
      });
      panels.forEach(panel => {
        panel.classList.toggle('visible', panel.dataset.panel === String(current));
      });
      prevBtn.disabled = current === 1;
      nextBtn.textContent = current === 4 ? 'Finish' : 'Next';
    }

    prevBtn.addEventListener('click', () => goTo(Math.max(1, current - 1)));
    nextBtn.addEventListener('click', () => goTo(Math.min(4, current + 1)));

    goTo(1);
  </script>
</body>
</html>
