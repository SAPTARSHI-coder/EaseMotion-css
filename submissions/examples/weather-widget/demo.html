<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Animated responsive CSS weather widget"
  >

  <title>CSS Weather Widget</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="weather-page">

    <section
      class="weather-widget"
      aria-label="Current weather information"
    >

      <!-- Animated atmosphere -->
      <div class="atmosphere" aria-hidden="true">
        <span class="cloud cloud-one"></span>
        <span class="cloud cloud-two"></span>

        <span class="rain rain-one"></span>
        <span class="rain rain-two"></span>
        <span class="rain rain-three"></span>
        <span class="rain rain-four"></span>
        <span class="rain rain-five"></span>
      </div>


      <!-- Header -->
      <header class="weather-header">

        <div>
          <span class="location-label">CURRENT WEATHER</span>

          <h1>Hyderabad</h1>

          <p>Saturday, August 8</p>
        </div>

        <button
          class="location-button"
          type="button"
          aria-label="Change location"
        >
          <span aria-hidden="true">⌖</span>
        </button>

      </header>


      <!-- Main weather -->
      <div class="weather-main">

        <div
          class="weather-icon"
          role="img"
          aria-label="Partly cloudy weather"
        >
          <span class="sun"></span>
          <span class="weather-cloud"></span>
        </div>

        <div class="temperature">
          <span class="temperature-value">28</span>
          <span class="temperature-unit">°C</span>
        </div>

        <div class="weather-status">
          <strong>Partly Cloudy</strong>
          <span>Feels like 30°C</span>
        </div>

      </div>


      <!-- Weather stats -->
      <div class="weather-stats">

        <div class="stat">
          <span class="stat-icon" aria-hidden="true">💧</span>

          <div>
            <span class="stat-label">Humidity</span>
            <strong>68%</strong>
          </div>
        </div>


        <div class="stat">
          <span class="stat-icon" aria-hidden="true">≋</span>

          <div>
            <span class="stat-label">Wind</span>
            <strong>14 km/h</strong>
          </div>
        </div>


        <div class="stat">
          <span class="stat-icon" aria-hidden="true">◉</span>

          <div>
            <span class="stat-label">Pressure</span>
            <strong>1012 hPa</strong>
          </div>
        </div>

      </div>


      <!-- Forecast -->
      <section class="forecast" aria-label="Five day forecast">

        <h2>5-Day Forecast</h2>

        <div class="forecast-list">

          <article class="forecast-day">
            <span>Sun</span>

            <div class="mini-icon sunny">
              <i></i>
            </div>

            <strong>30°</strong>
            <small>22°</small>
          </article>


          <article class="forecast-day">
            <span>Mon</span>

            <div class="mini-icon cloudy">
              <i></i>
            </div>

            <strong>29°</strong>
            <small>21°</small>
          </article>


          <article class="forecast-day active">
            <span>Tue</span>

            <div class="mini-icon rainy">
              <i></i>
            </div>

            <strong>27°</strong>
            <small>20°</small>
          </article>


          <article class="forecast-day">
            <span>Wed</span>

            <div class="mini-icon cloudy">
              <i></i>
            </div>

            <strong>28°</strong>
            <small>21°</small>
          </article>


          <article class="forecast-day">
            <span>Thu</span>

            <div class="mini-icon sunny">
              <i></i>
            </div>

            <strong>31°</strong>
            <small>23°</small>
          </article>

        </div>

      </section>

    </section>

  </main>

</body>
</html>
