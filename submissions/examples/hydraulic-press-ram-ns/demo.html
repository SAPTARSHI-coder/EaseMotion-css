<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hydraulic Press Ram — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Hydraulic Press Ram demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Hydraulic Press Ram</h1>
      <p class="lede">Hydraulic press ram descending onto a workpiece</p>
    </header>

    <section class="ease-hydraulic-press-ram" data-demo="hydraulic-press-ram" aria-live="polite">
      <div class="ease-hydraulic-press-ram__housing">
        <div class="ease-hydraulic-press-ram__bezel">
          <div class="ease-hydraulic-press-ram__face">
            <div class="ease-hydraulic-press-ram__readout">
              <span class="ease-hydraulic-press-ram__label">Hydraulic Press Ram</span>
              <span class="ease-hydraulic-press-ram__value">LIVE</span>
            </div>
            <div class="ease-hydraulic-press-ram__motion" aria-hidden="true">
              <span class="ease-hydraulic-press-ram__a"></span>
              <span class="ease-hydraulic-press-ram__b"></span>
              <span class="ease-hydraulic-press-ram__c"></span>
              <span class="ease-hydraulic-press-ram__d"></span>
            </div>
            <div class="ease-hydraulic-press-ram__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-hydraulic-press-ram__controls">
          <button type="button" class="ease-hydraulic-press-ram__btn primary">Engage</button>
          <button type="button" class="ease-hydraulic-press-ram__btn">Reset</button>
          <label class="ease-hydraulic-press-ram__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-hydraulic-press-ram__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
