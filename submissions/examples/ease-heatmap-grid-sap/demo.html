<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ease-heatmap-grid-sap demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f4f4f5;
    }
  </style>
</head>
<body>

  <div class="heatmap-grid-sap" id="heatmap"></div>

  <script>
    const grid = document.getElementById('heatmap');
    const totalCells = 140;

    for (let i = 0; i < totalCells; i++) {
      const cell = document.createElement('div');
      cell.className = 'heat-cell';
      const level = Math.floor(Math.random() * 5);
      if (level > 0) cell.dataset.level = level;
      cell.style.animationDelay = `${(i % 20) * 0.02}s`;
      cell.title = level > 0 ? `${level * 2} contributions` : 'No contributions';
      grid.appendChild(cell);
    }
  </script>

</body>
</html>
