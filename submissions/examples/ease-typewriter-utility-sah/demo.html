<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Typewriter Utility - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="terminal-card">
    <div class="terminal-header">
      <div class="dots"><span class="red"></span><span class="yellow"></span><span class="green"></span></div>
      <span class="title">bash — easemotion@gssoc: ~</span>
    </div>
    <div class="terminal-body">
      <p class="prompt">$ easemotion --init-animation-engine</p>
      <div class="typewriter-container">
        <h1 class="ease-typewriter">Build Dynamic UI Transitions Without JavaScript.</h1>
      </div>
    </div>
  </div>
</body>
</html>
