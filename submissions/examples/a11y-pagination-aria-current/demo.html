<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accessible Pagination with ARIA Current</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <h1>Accessible Pagination Component</h1>
        <p>Use the Tab key to navigate. Screen readers will correctly announce the active page via the <code>aria-current="page"</code> attribute.</p>
        
        <!-- Pagination wrapper with <nav> for landmark semantics -->
        <nav aria-label="Pagination Navigation" class="pagination-container">
            
            <ul class="pagination-list">
                
                <!-- Previous Button -->
                <li>
                    <a href="#" class="pagination-link pagination-prev" aria-label="Go to previous page">
                        <svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20">
                            <path fill="currentColor" d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>
                        </svg>
                        <span class="sr-only">Previous</span>
                    </a>
                </li>
                
                <!-- Page Links -->
                <li>
                    <a href="#" class="pagination-link" aria-label="Go to page 1">1</a>
                </li>
                <li>
                    <!-- The active page utilizes aria-current="page" -->
                    <a href="#" class="pagination-link active" aria-label="Current page, page 2" aria-current="page">2</a>
                </li>
                <li>
                    <a href="#" class="pagination-link" aria-label="Go to page 3">3</a>
                </li>
                <li>
                    <span class="pagination-ellipsis" aria-hidden="true">&hellip;</span>
                    <span class="sr-only">Skipped pages</span>
                </li>
                <li>
                    <a href="#" class="pagination-link" aria-label="Go to page 10">10</a>
                </li>

                <!-- Next Button -->
                <li>
                    <a href="#" class="pagination-link pagination-next" aria-label="Go to next page">
                        <span class="sr-only">Next</span>
                        <svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20">
                            <path fill="currentColor" d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/>
                        </svg>
                    </a>
                </li>
                
            </ul>
            
        </nav>

        <!-- Live region for announcing page changes when simulating JS clicks -->
        <div aria-live="polite" class="sr-only" id="announcer"></div>

    </main>

    <script>
        // Simple JS for demonstration of state changes
        document.querySelectorAll('.pagination-link:not(.pagination-prev):not(.pagination-next)').forEach(link => {
            link.addEventListener('click', function(e) {
                e.preventDefault();
                
                // Remove active state from all
                document.querySelectorAll('.pagination-link').forEach(l => {
                    l.classList.remove('active');
                    l.removeAttribute('aria-current');
                    if(l.innerText) {
                        l.setAttribute('aria-label', `Go to page ${l.innerText}`);
                    }
                });

                // Set active state on clicked link
                this.classList.add('active');
                this.setAttribute('aria-current', 'page');
                this.setAttribute('aria-label', `Current page, page ${this.innerText}`);
                
                // Announce to screen reader
                const announcer = document.getElementById('announcer');
                announcer.innerText = `Navigated to page ${this.innerText}.`;
            });
        });
    </script>
</body>
</html>
