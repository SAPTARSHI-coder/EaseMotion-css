<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Cube Carousel with Perspective Face Switching</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../easemotion.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>3D Cube Carousel</h1>
      <p>Rotate spatial 3D cube faces using navigation controls.</p>
    </header>

    <main class="scene">
      <div class="cube" id="cube">
        <div class="cube-face face-front">Front</div>
        <div class="cube-face face-back">Back</div>
        <div class="cube-face face-right">Right</div>
        <div class="cube-face face-left">Left</div>
      </div>
    </main>

    <div class="controls">
      <button class="btn" onclick="showFace('front')">Front</button>
      <button class="btn" onclick="showFace('right')">Right</button>
      <button class="btn" onclick="showFace('back')">Back</button>
      <button class="btn" onclick="showFace('left')">Left</button>
    </div>
  </div>

  <script>
    function showFace(face) {
      const cube = document.getElementById('cube');
      cube.className = 'cube show-' + face;
    }
  </script>
</body>
</html>
