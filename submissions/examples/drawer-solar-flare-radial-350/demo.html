<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solar Flare Radial Drawer Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Open Button -->
  <label for="drawer-toggle" class="drawer-open-btn">
    Open Solar Flare Drawer
  </label>

  <!-- The Toggle Checkbox (Hidden) -->
  <input type="checkbox" id="drawer-toggle" class="drawer-toggle">

  <!-- The Overlay -->
  <label for="drawer-toggle" class="drawer-overlay" aria-label="Close drawer"></label>

  <!-- The Drawer -->
  <aside class="drawer">
    <div class="drawer-content">
      <div class="drawer-header">
        <h2 class="drawer-title">Solar Flare</h2>
        <label for="drawer-toggle" class="drawer-close-btn" aria-label="Close">
          &times;
        </label>
      </div>
      <nav class="drawer-nav">
        <a href="#" class="drawer-nav-item">Dashboard</a>
        <a href="#" class="drawer-nav-item">Astronomy</a>
        <a href="#" class="drawer-nav-item">Plasma Physics</a>
        <a href="#" class="drawer-nav-item">Settings</a>
      </nav>
    </div>
  </aside>

</body>
</html>
