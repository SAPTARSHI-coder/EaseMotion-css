<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="CSS-only animated blooming spring tree"
  >

  <title>CSS Pure Tree</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="page">

    <header class="intro">
      <p class="eyebrow">EaseMotion CSS</p>

      <h1>CSS Pure Tree</h1>

      <p>
        A spring tree that blooms using only HTML and CSS.
      </p>
    </header>

    <section
      class="tree-section"
      aria-labelledby="tree-title"
    >

      <h2 id="tree-title" class="sr-only">
        Animated blooming spring tree
      </h2>

      <div
        class="scene"
        tabindex="0"
        role="img"
        aria-label="A blooming spring tree with green leaves and flowers"
      >

        <div class="sun" aria-hidden="true"></div>

        <div class="ground" aria-hidden="true"></div>

        <div class="tree" aria-hidden="true">

          <div class="trunk"></div>

          <div class="branch branch-left"></div>
          <div class="branch branch-right"></div>

          <div class="branch branch-left-small"></div>
          <div class="branch branch-right-small"></div>

          <div class="leaves">

            <span class="leaf leaf-1"></span>
            <span class="leaf leaf-2"></span>
            <span class="leaf leaf-3"></span>
            <span class="leaf leaf-4"></span>
            <span class="leaf leaf-5"></span>
            <span class="leaf leaf-6"></span>
            <span class="leaf leaf-7"></span>
            <span class="leaf leaf-8"></span>
            <span class="leaf leaf-9"></span>
            <span class="leaf leaf-10"></span>
            <span class="leaf leaf-11"></span>
            <span class="leaf leaf-12"></span>
            <span class="leaf leaf-13"></span>
            <span class="leaf leaf-14"></span>
            <span class="leaf leaf-15"></span>
            <span class="leaf leaf-16"></span>

          </div>

          <div class="flowers">

            <span class="flower flower-1">
              <i></i><i></i><i></i><i></i><i></i>
            </span>

            <span class="flower flower-2">
              <i></i><i></i><i></i><i></i><i></i>
            </span>

            <span class="flower flower-3">
              <i></i><i></i><i></i><i></i><i></i>
            </span>

            <span class="flower flower-4">
              <i></i><i></i><i></i><i></i><i></i>
            </span>

            <span class="flower flower-5">
              <i></i><i></i><i></i><i></i><i></i>
            </span>

            <span class="flower flower-6">
              <i></i><i></i><i></i><i></i><i></i>
            </span>

          </div>

        </div>

        <div class="falling-leaves" aria-hidden="true">
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
        </div>

      </div>

      <p class="hint">
        Hover or focus the tree to pause the animation.
      </p>

    </section>

  </main>

</body>
</html>
