<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Float-Drift Stepper</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="container">

    <header class="page-header">
        <h1>Float-Drift Stepper</h1>
        <p>Pure HTML & CSS • Minimalist Tech Layout</p>
    </header>

    <section
        class="stepper"
        aria-label="Project Progress">

        <article class="step completed">

            <div class="step-circle">
                ✓
            </div>

            <h2>Planning</h2>

            <p>
                Project requirements finalized.
            </p>

        </article>

        <article class="step completed">

            <div class="step-circle">
                ✓
            </div>

            <h2>Design</h2>

            <p>
                UI and component structure completed.
            </p>

        </article>

        <article class="step active">

            <div class="step-circle">
                3
            </div>

            <h2>Development</h2>

            <p>
                Components are currently being implemented.
            </p>

        </article>

        <article class="step">

            <div class="step-circle">
                4
            </div>

            <h2>Testing</h2>

            <p>
                Validate responsiveness and accessibility.
            </p>

        </article>

    </section>

</main>

</body>
</html>
