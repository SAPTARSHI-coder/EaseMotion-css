<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Vertical Timeline v2 - EaseMotion</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <ol class="vtl" aria-label="Vertical timeline v2">
      <li class="vtl-item">
        <span class="vtl-node" aria-hidden="true"></span
        ><time class="vtl-date">2026-01</time>
        <h3 class="vtl-h">Outline</h3>
        <p class="vtl-p">Plan arc beats and chapter order.</p>
      </li>
      <li class="vtl-item">
        <span class="vtl-node" aria-hidden="true"></span
        ><time class="vtl-date">2026-03</time>
        <h3 class="vtl-h">Draft</h3>
        <p class="vtl-p">Write scenes by importance.</p>
      </li>
    </ol>
  </body>
</html>
