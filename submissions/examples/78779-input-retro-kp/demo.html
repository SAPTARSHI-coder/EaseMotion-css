<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hover Input Field - Retro</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="retro-demo" aria-labelledby="retro-title">
    <section class="retro-card">
      <p class="eyebrow">Terminal profile</p>
      <h1 id="retro-title">Hover Input Field</h1>
      <form class="retro-form">
        <label for="retro-handle">Operator handle</label>
        <div class="input-wrap">
          <input id="retro-handle" type="text" placeholder="KUNAL_9090" autocomplete="username" />
          <span class="scanline" aria-hidden="true"></span>
        </div>
        <small>Hover or focus to activate the retro signal frame.</small>
      </form>
    </section>
  </main>
</body>
</html>
