<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add to Cart Button &mdash; EaseMotion CSS Demo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="page-head">
    <p class="kicker">EaseMotion CSS &middot; E-commerce</p>
    <h1>Add to Cart Button</h1>
    <p class="sub">One satisfying interaction that confirms the item is in your cart.</p>
  </header>
  <main class="stage">
    <button class="ac-btn">
      <span class="cart-icon">&#128722;</span> Add to Cart
      <span class="check"><i>&#10003;</i></span>
    </button>
  </main>
  <p class="stage-caption">Hover to morph the button into an added confirmation.</p>
  <footer class="page-foot">
    <span>Pure CSS &middot; zero dependencies</span>
    <span>Morphing button state</span>
  </footer>
</body>
</html>
