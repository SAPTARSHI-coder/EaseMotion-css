<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Bounce In from Top | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="bounce-demo-container">
    <header class="bounce-demo-header">
      <h1>CSS Bounce In from Top</h1>
      <p>Pure CSS spring-damped entrance motion on page load.</p>
    </header>

    <article class="ease-bounce-in-top" role="region" aria-label="Bounce In Top Notification Card">
      <div class="ease-bounce-in-top__badge">
        <span aria-hidden="true">✓</span> Live Demo
      </div>
      <h2 class="ease-bounce-in-top__title">Notification Alert</h2>
      <p class="ease-bounce-in-top__description">
        This card uses pure CSS keyframe physics to bounce down from above the viewport with zero JavaScript dependencies.
      </p>
      <button type="button" class="ease-bounce-in-top__action">Acknowledge</button>
    </article>

    <p class="bounce-demo-hint">💡 Refresh the page to re-trigger the bounce entrance animation.</p>
  </main>
</body>
</html>
