<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CSS Spotlight Hover Card">
  <title>CSS Spotlight Hover Card</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="page">
    <h1>Spotlight Hover Card</h1>

    <article class="spotlight-card" tabindex="0" aria-label="Spotlight hover card">
      <div class="card-content">
        <span class="card-icon" aria-hidden="true">✦</span>
        <h2>CSS Spotlight</h2>
        <p>
          Move your pointer across the card to reveal the animated spotlight.
        </p>
        <a href="#" class="card-link">Explore →</a>
      </div>
    </article>
  </main>
</body>
</html>
