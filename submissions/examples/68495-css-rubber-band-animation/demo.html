<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CSS Rubber Band Animation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <header class="hero">
      <p class="eyebrow">EaseMotion · #68495</p>
      <h1>Stretch. Snap. Repeat.</h1>
      <p>Hover or focus any sample to see a CSS-only rubber-band motion that stretches, compresses, and settles into place.</p>
    </header>

    <section class="stage" aria-labelledby="stage-title">
      <div class="stage-head">
        <div><p class="eyebrow">Elastic motion</p><h2 id="stage-title">Three snap profiles</h2></div>
        <span class="hint">Hover or tab</span>
      </div>
      <div class="samples">
        <button class="sample gentle" type="button"><span>01</span><strong>Gentle</strong><small>Low stretch · soft settle</small></button>
        <button class="sample lively" type="button"><span>02</span><strong>Lively</strong><small>Balanced elastic response</small></button>
        <button class="sample bold" type="button"><span>03</span><strong>Bold</strong><small>Wide stretch · strong snap</small></button>
      </div>
    </section>

    <footer>Native controls · CSS keyframes · Responsive · Reduced motion</footer>
  </main>
</body>
</html>
