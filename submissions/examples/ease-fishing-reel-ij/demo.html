<!-- EaseMotion component: fishing-reel -->
<!DOCTYPE html>
<html lang="en" data-reel="cast">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Ease Fishing Reel</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="fishing-reel">
  <header class="reel-head">
    <span class="reel-brand">TIDE MASTER</span>
    <span class="reel-type">BAITCASTER</span>
  </header>
  <div class="reel-face">
    <span class="reel-spool"></span>
    <span class="reel-line"></span>
    <span class="reel-bail"></span>
    <span class="reel-hub"></span>
  </div>
  <div class="reel-side">
    <span class="reel-crank"></span>
    <span class="reel-knob"></span>
  </div>
  <div class="reel-rod">
    <span class="rod-guide guide-1"></span>
    <span class="rod-guide guide-2"></span>
    <span class="rod-tip"></span>
    <span class="rod-line-whip"></span>
  </div>
  <footer class="reel-foot">
    <span class="reel-ratio">5.2:1</span>
    <span class="reel-drag">DRAG 8kg</span>
  </footer>
</main>
</body>
</html>
