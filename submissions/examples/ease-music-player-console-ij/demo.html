<!-- EaseMotion component: music-player-console -->
<!doctype html>
<html lang="en" data-app="audio">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Ease Music Player Console</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="player-shell">
  <div class="album-art">
    <div class="art-burst"></div>
    <div class="art-disc"><span class="disc-hole"></span></div>
    <span class="playing-badge">Now Playing</span>
  </div>
  <div class="track-info">
    <h2 class="track-title">Neon Horizon</h2>
    <p class="artist-name">Vesper Lane</p>
  </div>
  <div class="transport">
    <button class="control-btn" type="button" aria-label="previous track">prev</button>
    <button id="playToggle" class="play-btn" type="button" aria-label="play or pause">
      <span id="playGlyph" class="play-glyph">play</span>
    </button>
    <button class="control-btn" type="button" aria-label="next track">next</button>
  </div>
  <div class="seek-row">
    <span class="time-tag">1:24</span>
    <div class="seek-bar"><span class="seek-fill"></span></div>
    <span class="time-tag">3:48</span>
  </div>
  <div id="eqBars" class="eq-bars" aria-hidden="true">
    <i class="eq-bar eq-1"></i>
    <i class="eq-bar eq-2"></i>
    <i class="eq-bar eq-3"></i>
    <i class="eq-bar eq-4"></i>
    <i class="eq-bar eq-5"></i>
    <i class="eq-bar eq-6"></i>
  </div>
</div>
<script>
const eq=document.getElementById('eqBars');
const glyph=document.getElementById('playGlyph');
document.getElementById('playToggle').addEventListener('click',()=>{
  eq.classList.toggle('paused');
  glyph.textContent=eq.classList.contains('paused')?'pause':'play';
});
</script>
</body>
</html>
