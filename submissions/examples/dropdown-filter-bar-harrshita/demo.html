<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dropdown Filter Bar | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="demo-header">
    <h1>Dropdown Filter Bar</h1>
    <p>Filter bar with interactive pill controls and active selection counters.</p>
  </header>

  <main class="demo-main">
    <section class="demo-section">
      <div class="ease-filter-bar">
        <div class="ease-filter-pill">
          <button class="ease-filter-btn">Category &#9662;</button>
        </div>
        <div class="ease-filter-pill">
          <button class="ease-filter-btn">Status &#9662;</button>
        </div>
        <div class="ease-filter-pill ease-filter-active">
          <button class="ease-filter-btn">Price Range (1) &#9662;</button>
        </div>
      </div>
    </section>
  </main>
  <footer class="demo-footer"><p>EaseMotion CSS Project</p></footer>
</body>
</html>
