<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smoothly Follow – Cursor Magic</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <div class="controls">
      <label>Speed <input type="range" id="speed" min="1" max="20" value="8" /></label>
      <label>Size <input type="range" id="size" min="30" max="120" value="60" /></label>
      <label>Trail <input type="range" id="trail" min="0" max="30" value="15" /></label>
      <label>Hue <input type="range" id="hue" min="0" max="360" value="220" /></label>
      <button id="pauseBtn">⏸️ Pause</button>
      <button id="resetBtn">🔄 Reset</button>
      <button id="trailBtn">✨ Trail: ON</button>
    </div>
    <canvas id="canvas"></canvas>
  </div>
  <script src="script.js"></script>
</body>
</html>
