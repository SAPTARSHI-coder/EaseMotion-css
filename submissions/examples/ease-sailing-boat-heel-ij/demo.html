<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-sailing-boat-heel demo</title>
</head>
<body>
<div class="sb-app">
  <div class="sb-head">
    <span class="sb-name">WINDWARD</span>
    <span class="sb-badge">UNDER WAY</span>
  </div>
  <div class="sb-stage">
    <span class="sb-wave sb-wave-1"></span>
    <span class="sb-wave sb-wave-2"></span>
    <span class="sb-wave sb-wave-3"></span>
    <div class="sb-boat">
      <span class="sb-mast"></span>
      <span class="sb-boom"></span>
      <span class="sb-sail"></span>
      <span class="sb-jib"></span>
      <span class="sb-hull"></span>
      <span class="sb-line"></span>
      <span class="sb-pennant"></span>
    </div>
    <span class="sb-tag">COURSE 40 DEG</span>
  </div>
  <div class="sb-foot">WIND 14 KN</div>
</div>
</body>
</html>
