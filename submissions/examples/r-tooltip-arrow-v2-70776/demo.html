<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Accessible CSS tooltip with arrow and delayed appearance animation."
  >
  <title>CSS Tooltip With Arrow v2</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">
    <section class="demo" aria-labelledby="title">
      <span class="eyebrow">EaseMotion CSS</span>

      <h1 id="title">Tooltip With Arrow v2</h1>

      <p class="intro">
        Hover or focus the buttons to reveal delayed animated tooltips.
      </p>

      <div class="tooltip-grid">

        <div class="tooltip-wrapper">
          <button
            class="tooltip-trigger"
            type="button"
            aria-describedby="tooltip-info"
          >
            Info
          </button>

          <span
            class="tooltip tooltip-top"
            id="tooltip-info"
            role="tooltip"
          >
            Helpful information
          </span>
        </div>

        <div class="tooltip-wrapper">
          <button
            class="tooltip-trigger accent"
            type="button"
            aria-describedby="tooltip-save"
          >
            Save
          </button>

          <span
            class="tooltip tooltip-bottom"
            id="tooltip-save"
            role="tooltip"
          >
            Save your changes
          </span>
        </div>

        <div class="tooltip-wrapper">
          <button
            class="tooltip-trigger green"
            type="button"
            aria-describedby="tooltip-success"
          >
            Success
          </button>

          <span
            class="tooltip tooltip-top"
            id="tooltip-success"
            role="tooltip"
          >
            Everything looks good
          </span>
        </div>

      </div>
    </section>
  </main>

</body>
</html>
