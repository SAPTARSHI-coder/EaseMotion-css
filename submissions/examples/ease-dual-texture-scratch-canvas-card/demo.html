<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ease Multi-Layer Dual Texture Canvas Scratch Card</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="scratch-body">
  <div class="s-card-wrap">
    <div class="s-prize">🎉 REWARD: #EASE2026</div>
    <canvas id="sCanvas" width="280" height="160"></canvas>
  </div>

  <script>
    const cvs = document.getElementById('sCanvas');
    const ctx = cvs.getContext('2d');
    ctx.fillStyle = '#94a3b8';
    ctx.fillRect(0, 0, 280, 160);
    ctx.fillStyle = '#475569';
    ctx.font = '16px Inter';
    ctx.fillText('Scratch Here to Reveal', 50, 85);
    let isScratching = false;
    cvs.addEventListener('mousedown', () => isScratching = true);
    window.addEventListener('mouseup', () => isScratching = false);
    cvs.addEventListener('mousemove', (e) => {
      if (!isScratching) return;
      const rect = cvs.getBoundingClientRect();
      ctx.globalCompositeOperation = 'destination-out';
      ctx.beginPath();
      ctx.arc(e.clientX - rect.left, e.clientY - rect.top, 18, 0, Math.PI * 2);
      ctx.fill();
    });
  </script>
</body>
</html>
