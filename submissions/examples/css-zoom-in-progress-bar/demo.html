<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zoom-In Progress Bar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="demo">
        <section class="progress-card">
            <p class="eyebrow">EASEMOTION CSS</p>

            <h1>System Progress</h1>

            <p class="description">
                A minimalist progress indicator with a smooth zoom-in
                animation for modern technology interfaces.
            </p>

            <div class="progress-wrapper">
                <div class="progress-header">
                    <span>Uploading</span>
                    <span>68%</span>
                </div>

                <div
                    class="progress-bar"
                    role="progressbar"
                    aria-label="Upload progress"
                    aria-valuemin="0"
                    aria-valuemax="100"
                    aria-valuenow="68"
                >
                    <div class="progress-fill"></div>
                </div>

                <div class="progress-status">
                    <span class="status-dot"></span>
                    Processing upload...
                </div>
            </div>
        </section>
    </main>

</body>
</html>
