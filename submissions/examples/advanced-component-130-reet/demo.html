<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EaseMotion - Image Accordion Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="ease-accordion-container">
        <div class="ease-accordion-item">
            <div class="ease-accordion-content">
                <h3 class="ease-accordion-title">Serenity</h3>
                <p class="ease-accordion-desc">Experience the calm of the mountains and the silence of the dawn.</p>
            </div>
        </div>
        <div class="ease-accordion-item">
            <div class="ease-accordion-content">
                <h3 class="ease-accordion-title">Wilderness</h3>
                <p class="ease-accordion-desc">Explore the deep forests and ancient trails of the unknown.</p>
            </div>
        </div>
        <div class="ease-accordion-item">
            <div class="ease-accordion-content">
                <h3 class="ease-accordion-title">Oceanic</h3>
                <p class="ease-accordion-desc">Dive into the deep blue and discover the hidden marine life.</p>
            </div>
        </div>
        <div class="ease-accordion-item">
            <div class="ease-accordion-content">
                <h3 class="ease-accordion-title">Horizons</h3>
                <p class="ease-accordion-desc">Look beyond the sunset and imagine what lies over the edge.</p>
            </div>
        </div>
    </div>
</body>
</html>
