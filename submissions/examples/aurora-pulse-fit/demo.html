<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aurora Pulse Fit</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="aurora-container">
    <div class="aurora-layer aurora-one"></div>
    <div class="aurora-layer aurora-two"></div>
    <div class="aurora-layer aurora-three"></div>

    <section class="pulse-card">
      <div class="pulse-ring"></div>
      <div class="pulse-core">
        <span class="pulse-icon">✦</span>
      </div>

      <h1>Aurora Pulse</h1>
      <p>Animated breathing light inspired by northern auroras.</p>

      <label for="intensity">Pulse Intensity</label>
      <input
        id="intensity"
        class="intensity-slider"
        type="range"
        min="0.5"
        max="2"
        step="0.1"
        value="1"
      >

      <span class="intensity-value" id="intensityValue">1.0×</span>
    </section>
  </main>

  <script>
    const slider = document.getElementById("intensity");
    const value = document.getElementById("intensityValue");

    slider.addEventListener("input", () => {
      const intensity = Number(slider.value);

      document.documentElement.style.setProperty(
        "--pulse-duration",
        `${2.5 / intensity}s`
      );

      value.textContent = `${intensity.toFixed(1)}×`;
    });
  </script>

</body>
</html>
