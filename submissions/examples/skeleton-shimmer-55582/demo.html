<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skeleton Loading Shimmer Demo</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        .card {
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            width: 300px;
        }
        .header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }
        .content {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <div class="ease-skeleton ease-skeleton-circle"></div>
            <div style="flex: 1;">
                <div class="ease-skeleton ease-skeleton-text" style="width: 70%;"></div>
                <div class="ease-skeleton ease-skeleton-text" style="width: 40%;"></div>
            </div>
        </div>
        <div class="content">
            <div class="ease-skeleton ease-skeleton-img"></div>
            <div class="ease-skeleton ease-skeleton-text" style="width: 100%; margin-top: 10px;"></div>
            <div class="ease-skeleton ease-skeleton-text" style="width: 90%;"></div>
            <div class="ease-skeleton ease-skeleton-text" style="width: 80%;"></div>
        </div>
    </div>
</body>
</html>
