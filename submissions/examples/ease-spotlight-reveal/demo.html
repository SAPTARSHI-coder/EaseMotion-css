<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Hover Spotlight Reveal - EaseMotion</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="ease-reveal-wrapper" id="spotlight-area">
    <div class="ease-reveal-content">
      <h1 class="ease-reveal-text">EaseMotion<br>Revealed</h1>
    </div>
  </div>

  <p style="position: absolute; bottom: 2rem; color: #475569; font-family: system-ui; font-size: 0.875rem; z-index: 20;">Move your cursor to reveal. Rendering powered by CSS mask-image.</p>

  <script>
    const area = document.getElementById('spotlight-area');
    area.addEventListener('mousemove', e => {
      area.style.setProperty('--x', e.clientX + 'px');
      area.style.setProperty('--y', e.clientY + 'px');
    });
  </script>
</body>
</html>
