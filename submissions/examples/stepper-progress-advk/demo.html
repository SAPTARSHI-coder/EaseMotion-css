<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Stepper Progress</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<main class="stp-wrap">
  <h1 class="stp-h1">Checkout Progress</h1>
  <p class="stp-lede">A multi-step progress bar where the connecting line between two steps fills only once both its endpoints are complete, driven purely by nth-child position math.</p>

  <ol class="stp-list" style="--stp-total: 4">
    <li class="stp-step stp-done"><span class="stp-dot">1</span><span class="stp-label">Cart</span></li>
    <li class="stp-step stp-done"><span class="stp-dot">2</span><span class="stp-label">Shipping</span></li>
    <li class="stp-step stp-current"><span class="stp-dot">3</span><span class="stp-label">Payment</span></li>
    <li class="stp-step"><span class="stp-dot">4</span><span class="stp-label">Confirm</span></li>
  </ol>
</main>
</body>
</html>
