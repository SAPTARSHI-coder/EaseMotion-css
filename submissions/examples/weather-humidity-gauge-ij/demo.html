<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-weather-humidity-gauge demo</title>
</head>
<body>
<div class="whg-panel">
  <div class="whg-gauge">
    <b class="whg-needle"></b>
    <span class="whg-mark">DRY</span>
    <span class="whg-mark">WET</span>
    <b class="whg-value">62%</b>
  </div>
  <div class="whg-info">
    <span class="whg-cond">HUMID</span>
    <span class="whg-dew">Dew 18°C</span>
  </div>
</div>
</body>
</html>
