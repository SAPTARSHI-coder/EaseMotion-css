<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Approximate Optimization QAOA - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css"></head><body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030712; color: #ffffff;">

    <div class="ease-card ease-card-glass qaao-container">
        <div class="qaao-header">
            <h2>QAOA Optimization</h2>
            <span class="ease-badge ease-badge-success">Solving</span>
        </div>
        
        <div class="qaao-screen ease-center">
            <div class="qaao-flux flux-qaao-a"></div>
            <div class="qaao-flux flux-qaao-b"></div>
            <div class="qaao-boundary-ring"></div>
            <div class="qaao-core ease-center"></div>
        </div>

        <div class="qaao-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Cost Hamiltonians &amp; Mixer Rotations</span>
            <button class="ease-btn ease-btn-success ease-btn-sm ease-hover-grow">Run QAOA Solver</button>
        </div>
    </div></body></html>
