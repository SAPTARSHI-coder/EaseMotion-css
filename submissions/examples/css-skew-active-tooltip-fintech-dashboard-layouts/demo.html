<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Skew Active Tooltip - Fintech Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<section class="dashboard">

    <h1>Fintech Dashboard</h1>
    <p class="subtitle">
        Hover over analytics cards to view skew-active tooltips
    </p>


    <div class="grid">

        <div class="card">
            <div class="icon">💳</div>
            <h2>Payments</h2>

            <div class="tooltip">
                Real-time transaction monitoring
            </div>
        </div>


        <div class="card">
            <div class="icon">📈</div>
            <h2>Revenue</h2>

            <div class="tooltip">
                Track financial growth metrics
            </div>
        </div>


        <div class="card">
            <div class="icon">🔐</div>
            <h2>Security</h2>

            <div class="tooltip">
                Advanced fraud protection
            </div>
        </div>


        <div class="card">
            <div class="icon">⚡</div>
            <h2>Analytics</h2>

            <div class="tooltip">
                AI powered dashboard insights
            </div>
        </div>

    </div>

</section>


</body>
</html>
