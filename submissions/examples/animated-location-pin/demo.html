<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CSS-only animated location pin" />
    <title>CSS Animated Location Pin</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="demo">
      <section class="location-demo" aria-labelledby="demo-title">
        <h1 id="demo-title">Animated Location Pin 📍</h1>

        <p class="description">
          A CSS file for animated location pin with a drop and bounce animation.
        </p>

        <button class="location-pin" type="button" aria-label="View location">
          <span class="pin-marker" aria-hidden="true">
            <span class="pin-dot"></span>
          </span>

          <span class="pin-shadow" aria-hidden="true"></span>
        </button>
      </section>
    </main>
  </body>
</html>
