<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 3D Effect: Solar Flare Radial - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="em-solar-page">
        <!-- Background Solar Flare Radial Animation Layer -->
        <div class="em-solar-bg" aria-hidden="true">
            <span class="em-solar-ray" style="--r:0deg; --d:0s;"></span>
            <span class="em-solar-ray" style="--r:60deg; --d:0.5s;"></span>
            <span class="em-solar-ray" style="--r:120deg; --d:1s;"></span>
            <span class="em-solar-ray" style="--r:180deg; --d:1.5s;"></span>
            <span class="em-solar-ray" style="--r:240deg; --d:2s;"></span>
            <span class="em-solar-ray" style="--r:300deg; --d:2.5s;"></span>
        </div>

        <div class="em-card" role="region" aria-label="Solar Flare Radial 3D Showcase" tabindex="0">
            <span class="em-card-badge">3D ANIMATIONS</span>
            <h1 class="em-card-title">Solar Flare Radial</h1>
            <p class="em-card-desc">A smooth, hardware-accelerated pure CSS 3D animation featuring dynamic solar flare radial styling and dark mode compatibility.</p>
            <a href="#" class="em-card-btn" role="button">Explore Effects</a>
        </div>
    </div>
</body>
</html>
