<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Rotate-Fade Tabs - Minimalist Tech</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="layout-container">
        
        <header class="section-header">
            <h1 class="title">Data Analytics</h1>
            <p class="subtitle">Click a tab to trigger the pure CSS rotate-fade panel transition.</p>
        </header>

        <div class="dashboard-area">
            
            <!-- Pure CSS Tabs Structure -->
            <div class="tabs-container">
                
                <!-- Radio Inputs for State Management -->
                <input type="radio" id="tab-overview" name="analytics-tabs" class="tab-input" checked>
                <input type="radio" id="tab-audience" name="analytics-tabs" class="tab-input">
                <input type="radio" id="tab-acquisition" name="analytics-tabs" class="tab-input">
                
                <!-- Tab Headers (Navigation) -->
                <div class="tab-headers">
                    
                    <label for="tab-overview" class="tab-label">
                        <svg class="tab-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>
                        Overview
                    </label>
                    
                    <label for="tab-audience" class="tab-label">
                        <svg class="tab-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                        Audience
                    </label>
                    
                    <label for="tab-acquisition" class="tab-label">
                        <svg class="tab-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 16 16 12 12 8"></polyline><line x1="8" y1="12" x2="16" y2="12"></line></svg>
                        Acquisition
                    </label>
                    
                </div>
                
                <!-- Tab Content Panels (The Rotate-Fade Target) -->
                <div class="tab-content-wrapper">
                    
                    <!-- Panel 1: Overview -->
                    <div class="tab-panel" id="panel-overview">
                        <div class="panel-header">
                            <h2>Key Metrics</h2>
                            <select class="date-select"><option>Last 30 Days</option></select>
                        </div>
                        
                        <div class="metrics-grid">
                            <div class="metric-card">
                                <span class="metric-title">Total Users</span>
                                <span class="metric-value">24,592</span>
                                <span class="metric-trend positive">+12.5%</span>
                            </div>
                            <div class="metric-card">
                                <span class="metric-title">Sessions</span>
                                <span class="metric-value">41,201</span>
                                <span class="metric-trend positive">+8.2%</span>
                            </div>
                            <div class="metric-card">
                                <span class="metric-title">Bounce Rate</span>
                                <span class="metric-value">42.8%</span>
                                <span class="metric-trend negative">+1.4%</span>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Panel 2: Audience -->
                    <div class="tab-panel" id="panel-audience">
                        <div class="panel-header">
                            <h2>Demographics</h2>
                            <button class="btn btn-outline btn-sm">Export Report</button>
                        </div>
                        
                        <div class="mock-chart">
                            <div class="chart-bars">
                                <div class="bar-group">
                                    <div class="bar" style="height: 60%;"></div>
                                    <span class="bar-label">18-24</span>
                                </div>
                                <div class="bar-group">
                                    <div class="bar" style="height: 100%;"></div>
                                    <span class="bar-label">25-34</span>
                                </div>
                                <div class="bar-group">
                                    <div class="bar" style="height: 45%;"></div>
                                    <span class="bar-label">35-44</span>
                                </div>
                                <div class="bar-group">
                                    <div class="bar" style="height: 20%;"></div>
                                    <span class="bar-label">45+</span>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Panel 3: Acquisition -->
                    <div class="tab-panel" id="panel-acquisition">
                        <div class="panel-header">
                            <h2>Traffic Channels</h2>
                            <button class="btn btn-outline btn-sm">Manage Campaigns</button>
                        </div>
                        
                        <div class="list-container">
                            <div class="list-item">
                                <div class="channel-info">
                                    <div class="channel-dot" style="background: #3b82f6;"></div>
                                    <strong>Organic Search</strong>
                                </div>
                                <span class="channel-value">54.2%</span>
                            </div>
                            <div class="list-item">
                                <div class="channel-info">
                                    <div class="channel-dot" style="background: #10b981;"></div>
                                    <strong>Direct</strong>
                                </div>
                                <span class="channel-value">28.5%</span>
                            </div>
                            <div class="list-item">
                                <div class="channel-info">
                                    <div class="channel-dot" style="background: #f59e0b;"></div>
                                    <strong>Referral</strong>
                                </div>
                                <span class="channel-value">17.3%</span>
                            </div>
                        </div>
                    </div>
                    
                </div>
                
            </div>

        </div>
        
    </div>

</body>
</html>
