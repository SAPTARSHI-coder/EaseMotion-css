<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Circular Radial Menu - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="em-radial-page">
        <div class="em-radial-wrapper" role="region" aria-label="Circular Radial Menu">
            <input type="checkbox" id="radialToggle" class="em-radial-checkbox" aria-label="Toggle radial menu">
            
            <div class="em-radial-menu">
                <a href="#" class="em-radial-item em-item-one" aria-label="Home">🏠</a>
                <a href="#" class="em-radial-item em-item-two" aria-label="Search">🔍</a>
                <a href="#" class="em-radial-item em-item-three" aria-label="Notifications">🔔</a>
                <a href="#" class="em-radial-item em-item-four" aria-label="Settings">⚙️</a>
            </div>

            <label for="radialToggle" class="em-radial-center-btn" role="button" aria-expanded="false">
                <span class="em-hamburger-icon"></span>
            </label>
        </div>
    </div>
</body>
</html>
