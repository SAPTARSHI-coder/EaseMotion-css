<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CSS animated sidebar toggle with overlay.">
  <title>CSS Animated Sidebar Toggle</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <input
    class="sidebar-toggle"
    type="checkbox"
    id="sidebar-toggle"
  >

  <div class="app">

    <header class="topbar">
      <label
        class="toggle-button"
        for="sidebar-toggle"
        aria-label="Toggle navigation sidebar"
      >
        <span></span>
        <span></span>
        <span></span>
      </label>

      <strong>EaseMotion</strong>
    </header>

    <aside class="sidebar" aria-label="Sidebar navigation">
      <div class="sidebar-title">Navigation</div>

      <nav>
        <a href="#home">Home</a>
        <a href="#projects">Projects</a>
        <a href="#components">Components</a>
        <a href="#settings">Settings</a>
      </nav>
    </aside>

    <label
      class="overlay"
      for="sidebar-toggle"
      aria-label="Close navigation sidebar"
    ></label>

    <main class="main" id="home">
      <span class="eyebrow">CSS interaction</span>

      <h1>Animated Sidebar Toggle</h1>

      <p>
        Use the menu button to reveal a sliding sidebar with a
        smooth overlay transition, implemented without JavaScript.
      </p>
    </main>

  </div>

</body>
</html>
