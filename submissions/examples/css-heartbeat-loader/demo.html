<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="CSS-only heartbeat EKG loading animation."
  >

  <title>CSS Heartbeat Loader</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="loader-page">
    <section
      class="loader-card"
      aria-labelledby="loader-title"
      aria-busy="true"
    >
      <h1 id="loader-title">Loading</h1>

      <div
        class="heartbeat-loader"
        role="status"
        aria-label="Loading"
      >
        <span class="heartbeat-line" aria-hidden="true"></span>
      </div>

      <p class="loader-text">Please wait...</p>
    </section>
  </main>
</body>
</html>
