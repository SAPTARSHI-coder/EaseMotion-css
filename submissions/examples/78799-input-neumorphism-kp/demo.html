<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Parallax Input Field - Neumorphism</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="input-demo" aria-labelledby="input-title">
    <section class="input-stage">
      <p class="eyebrow">Secure profile</p>
      <h1 id="input-title">Parallax Input Field</h1>
      <p class="summary">A tactile neumorphic email field with floating parallax layers for refined form surfaces.</p>
      <form class="neo-form">
        <label for="workspace-email">Workspace email</label>
        <div class="input-shell">
          <span class="orb orb-one" aria-hidden="true"></span>
          <span class="orb orb-two" aria-hidden="true"></span>
          <input id="workspace-email" type="email" placeholder="kunal@example.com" autocomplete="email" />
        </div>
        <small>We will verify the domain before opening your workspace.</small>
      </form>
    </section>
  </main>
</body>
</html>
