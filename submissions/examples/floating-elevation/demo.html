<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Floating Elevation glassmorphism CSS component">
  <title>Floating Elevation Glass</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="demo">
    <section class="floating-card" aria-labelledby="floating-title">

      <div class="ambient ambient-one" aria-hidden="true"></div>
      <div class="ambient ambient-two" aria-hidden="true"></div>

      <div class="elevation-shadow" aria-hidden="true"></div>

      <div class="floating-content">
        <span class="floating-badge">
          GLASSMORPHISM
        </span>

        <div class="floating-icon" aria-hidden="true">
          ↑
        </div>

        <h1 id="floating-title">
          Floating Elevation
        </h1>

        <p>
          A layered glass interface with soft depth, translucent
          surfaces, and smooth elevation transitions created entirely
          with CSS.
        </p>

        <div class="stats">
          <div class="stat">
            <strong>24px</strong>
            <span>Elevation</span>
          </div>

          <div class="stat">
            <strong>18px</strong>
            <span>Blur</span>
          </div>

          <div class="stat">
            <strong>CSS</strong>
            <span>Powered</span>
          </div>
        </div>

        <button class="floating-button" type="button">
          Experience Depth
          <span aria-hidden="true">↗</span>
        </button>
      </div>

      <div class="edge-highlight" aria-hidden="true"></div>
    </section>
  </main>
</body>
</html>
