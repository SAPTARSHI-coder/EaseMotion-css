<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Loader with Retro Styling - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="em-demo-container">
        <!-- Pure CSS Retro Dynamic Loader Component Showcase -->
        <header class="em-loader-card" role="region" aria-label="Dynamic Loader Showcase" tabindex="0">
            <div class="em-loader-header-bar">
                <span class="em-card-badge">COMPONENT CONTRIBUTION</span>
                <span class="em-brand-logo">RetroMotion</span>
            </div>
            <h1 class="em-card-title">Retro Loader</h1>
            <p class="em-card-desc">A fully responsive, pure CSS dynamic loader featuring 80s arcade amber glows, pixel-smooth keyframe animations, and frosted glassmorphism.</p>
            <div class="em-loader-wrapper">
                <div class="em-retro-loader" aria-label="Loading animation">
                    <div class="em-retro-bar"></div>
                    <div class="em-retro-bar"></div>
                    <div class="em-retro-bar"></div>
                </div>
            </div>
        </header>
    </div>
</body>
</html>
