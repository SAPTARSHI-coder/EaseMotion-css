<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Timezone Overlap Planner KP</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="demo-shell">
      <section class="planner-card" aria-labelledby="planner-title">
        <header class="planner-card__header">
          <div>
            <span class="planner-card__eyebrow">Team availability</span>
            <h1 id="planner-title">Find a shared meeting window</h1>
          </div>
          <span class="planner-card__date">Tuesday, Jul 28</span>
        </header>

        <p class="planner-card__intro">
          Compare local working hours across three time zones.
        </p>

        <div class="time-scale" aria-hidden="true">
          <span>08:00</span>
          <span>10:00</span>
          <span>12:00</span>
          <span>14:00</span>
          <span>16:00</span>
          <span>18:00</span>
        </div>

        <div class="schedule" aria-label="Team availability timeline">
          <article class="person-row" tabindex="0">
            <div class="person">
              <span class="person__avatar person__avatar--green">AK</span>
              <span>
                <strong>Aarav</strong>
                <small>Bengaluru, IST</small>
              </span>
            </div>
            <div
              class="timeline"
              aria-label="Aarav is available from 9 AM to 5 PM"
            >
              <span class="availability availability--aarav"></span>
              <span class="overlap-window" aria-hidden="true"></span>
            </div>
          </article>

          <article class="person-row" tabindex="0">
            <div class="person">
              <span class="person__avatar person__avatar--blue">LM</span>
              <span>
                <strong>Lena</strong>
                <small>Berlin, CEST</small>
              </span>
            </div>
            <div
              class="timeline"
              aria-label="Lena is available from 10 AM to 6 PM"
            >
              <span class="availability availability--lena"></span>
              <span class="overlap-window" aria-hidden="true"></span>
            </div>
          </article>

          <article class="person-row" tabindex="0">
            <div class="person">
              <span class="person__avatar person__avatar--coral">MJ</span>
              <span>
                <strong>Maya</strong>
                <small>New York, EDT</small>
              </span>
            </div>
            <div
              class="timeline"
              aria-label="Maya is available from 8 AM to 3 PM"
            >
              <span class="availability availability--maya"></span>
              <span class="overlap-window" aria-hidden="true"></span>
            </div>
          </article>
        </div>

        <footer class="overlap-summary">
          <span class="overlap-summary__mark" aria-hidden="true"></span>
          <span class="overlap-summary__copy">
            <strong>Best overlap: 1 hour 30 minutes</strong>
            <small>14:30 IST / 11:00 CEST / 05:00 EDT</small>
          </span>
          <button type="button">Choose window</button>
        </footer>
      </section>
    </main>
  </body>
</html>
