<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ease-scroll-nav-progress-dots-sap demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; }
    section { height: 100vh; display: flex; align-items: center; justify-content: center; font-size: 24px; color: #fff; }
    section:nth-child(1) { background: #2563eb; }
    section:nth-child(2) { background: #7c3aed; }
    section:nth-child(3) { background: #ec4899; }
  </style>
</head>
<body>
  <div class="nav-dots-sap" id="dots">
    <div class="nav-dot active" data-target="s1"></div>
    <div class="nav-dot" data-target="s2"></div>
    <div class="nav-dot" data-target="s3"></div>
  </div>
  <section id="s1">Section One</section>
  <section id="s2">Section Two</section>
  <section id="s3">Section Three</section>
  <script>
    const dots = [...document.querySelectorAll('.nav-dot')];
    dots.forEach(dot => {
      dot.addEventListener('click', () => {
        document.getElementById(dot.dataset.target).scrollIntoView({ behavior: 'smooth' });
      });
    });
    const sections = [...document.querySelectorAll('section')];
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          const idx = sections.indexOf(entry.target);
          dots.forEach((d, i) => d.classList.toggle('active', i === idx));
        }
      });
    }, { threshold: 0.6 });
    sections.forEach(s => observer.observe(s));
  </script>
</body>
</html>
