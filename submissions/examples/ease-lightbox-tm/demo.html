<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ease-lightbox — CSS-only Interactive Lightbox Gallery</title>
  <link rel="stylesheet" href="style.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0f0f1a; min-height: 100vh; font-family: system-ui, sans-serif; padding: 40px 20px; }
    h1 { color: #e0e0e0; font-size: 28px; text-align: center; margin-bottom: 8px; }
    .subtitle { color: #667eea; font-size: 14px; text-align: center; margin-bottom: 40px; }
    .lightbox-modal-1, .lightbox-modal-2, .lightbox-modal-3 {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.92);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .lightbox-modal-1:target, .lightbox-modal-2:target, .lightbox-modal-3:target {
      opacity: 1;
      pointer-events: all;
    }
    .lightbox-modal__image-wrap { max-width: 90vw; max-height: 75vh; }
    .lightbox-modal__image { max-width: 100%; max-height: 75vh; object-fit: contain; border-radius: 8px; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
    .lightbox-modal__close, .lightbox-modal__prev, .lightbox-modal__next {
      position: absolute; width: 44px; height: 44px; background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.15); border-radius: 50%;
      color: white; font-size: 20px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      text-decoration: none; transition: background 0.3s;
    }
    .lightbox-modal__close:hover, .lightbox-modal__prev:hover, .lightbox-modal__next:hover { background: rgba(255,255,255,0.2); }
    .lightbox-modal__close { top: 20px; right: 20px; }
    .lightbox-modal__prev { left: 16px; top: 50%; transform: translateY(-50%); }
    .lightbox-modal__next { right: 16px; top: 50%; transform: translateY(-50%); }
    .lightbox-modal__caption { margin-top: 16px; color: #c8c8d8; font-size: 14px; text-align: center; }
    .lightbox-modal__thumbs { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; justify-content: center; }
    .lightbox-modal__thumb { width: 56px; height: 42px; object-fit: cover; border-radius: 4px; border: 2px solid transparent; opacity: 0.6; }
    .lightbox-modal__thumb:hover, .lightbox-modal__thumb--active { opacity: 1; border-color: #667eea; }
  </style>
</head>
<body>

<h1>CSS-only Lightbox Gallery</h1>
<p class="subtitle">Interactive Lightbox Gallery — Issue #63668</p>

<div class="lightbox-gallery">
  <!-- Image 1 -->
  <div class="lightbox-thumb">
    <img src="https://picsum.photos/seed/lb1/600/450" alt="Mountain landscape" width="200" height="150">
    <div class="lightbox-thumb__overlay">
      <span class="lightbox-thumb__label">Mountain Landscape</span>
    </div>
    <a href="#lightbox-1" class="lightbox-trigger" aria-label="View Mountain Landscape"></a>
  </div>

  <!-- Image 2 -->
  <div class="lightbox-thumb">
    <img src="https://picsum.photos/seed/lb2/600/450" alt="Ocean sunset" width="200" height="150">
    <div class="lightbox-thumb__overlay">
      <span class="lightbox-thumb__label">Ocean Sunset</span>
    </div>
    <a href="#lightbox-2" class="lightbox-trigger" aria-label="View Ocean Sunset"></a>
  </div>

  <!-- Image 3 -->
  <div class="lightbox-thumb">
    <img src="https://picsum.photos/seed/lb3/600/450" alt="City skyline" width="200" height="150">
    <div class="lightbox-thumb__overlay">
      <span class="lightbox-thumb__label">City Skyline</span>
    </div>
    <a href="#lightbox-3" class="lightbox-trigger" aria-label="View City Skyline"></a>
  </div>

  <!-- Image 4 -->
  <div class="lightbox-thumb">
    <img src="https://picsum.photos/seed/lb4/600/450" alt="Forest path" width="200" height="150">
    <div class="lightbox-thumb__overlay">
      <span class="lightbox-thumb__label">Forest Path</span>
    </div>
    <a href="#lightbox-4" class="lightbox-trigger" aria-label="View Forest Path"></a>
  </div>
</div>

<!-- Lightbox Modal 1 -->
<div id="lightbox-1" class="lightbox-modal-1">
  <a href="#" class="lightbox-modal__close" aria-label="Close">&#215;</a>
  <a href="#lightbox-3" class="lightbox-modal__prev" aria-label="Previous">&#8249;</a>
  <a href="#lightbox-2" class="lightbox-modal__next" aria-label="Next">&#8250;</a>
  <div class="lightbox-modal__image-wrap">
    <img src="https://picsum.photos/seed/lb1/1200/900" alt="Mountain landscape" class="lightbox-modal__image">
  </div>
  <div class="lightbox-modal__caption">Mountain landscape at golden hour</div>
  <div class="lightbox-modal__thumbs">
    <img src="https://picsum.photos/seed/lb1/56/42" class="lightbox-modal__thumb lightbox-modal__thumb--active" alt="">
    <img src="https://picsum.photos/seed/lb2/56/42" class="lightbox-modal__thumb" alt="">
    <img src="https://picsum.photos/seed/lb3/56/42" class="lightbox-modal__thumb" alt="">
    <img src="https://picsum.photos/seed/lb4/56/42" class="lightbox-modal__thumb" alt="">
  </div>
</div>

<!-- Lightbox Modal 2 -->
<div id="lightbox-2" class="lightbox-modal-2">
  <a href="#" class="lightbox-modal__close" aria-label="Close">&#215;</a>
  <a href="#lightbox-1" class="lightbox-modal__prev" aria-label="Previous">&#8249;</a>
  <a href="#lightbox-3" class="lightbox-modal__next" aria-label="Next">&#8250;</a>
  <div class="lightbox-modal__image-wrap">
    <img src="https://picsum.photos/seed/lb2/1200/900" alt="Ocean sunset" class="lightbox-modal__image">
  </div>
  <div class="lightbox-modal__caption">Ocean sunset with vibrant colors</div>
  <div class="lightbox-modal__thumbs">
    <img src="https://picsum.photos/seed/lb1/56/42" class="lightbox-modal__thumb" alt="">
    <img src="https://picsum.photos/seed/lb2/56/42" class="lightbox-modal__thumb lightbox-modal__thumb--active" alt="">
    <img src="https://picsum.photos/seed/lb3/56/42" class="lightbox-modal__thumb" alt="">
    <img src="https://picsum.photos/seed/lb4/56/42" class="lightbox-modal__thumb" alt="">
  </div>
</div>

<!-- Lightbox Modal 3 -->
<div id="lightbox-3" class="lightbox-modal-3">
  <a href="#" class="lightbox-modal__close" aria-label="Close">&#215;</a>
  <a href="#lightbox-2" class="lightbox-modal__prev" aria-label="Previous">&#8249;</a>
  <a href="#lightbox-4" class="lightbox-modal__next" aria-label="Next">&#8250;</a>
  <div class="lightbox-modal__image-wrap">
    <img src="https://picsum.photos/seed/lb3/1200/900" alt="City skyline" class="lightbox-modal__image">
  </div>
  <div class="lightbox-modal__caption">City skyline at night with lights</div>
  <div class="lightbox-modal__thumbs">
    <img src="https://picsum.photos/seed/lb1/56/42" class="lightbox-modal__thumb" alt="">
    <img src="https://picsum.photos/seed/lb2/56/42" class="lightbox-modal__thumb" alt="">
    <img src="https://picsum.photos/seed/lb3/56/42" class="lightbox-modal__thumb lightbox-modal__thumb--active" alt="">
    <img src="https://picsum.photos/seed/lb4/56/42" class="lightbox-modal__thumb" alt="">
  </div>
</div>

<!-- Lightbox Modal 4 -->
<div id="lightbox-4" class="lightbox-modal-3">
  <a href="#" class="lightbox-modal__close" aria-label="Close">&#215;</a>
  <a href="#lightbox-3" class="lightbox-modal__prev" aria-label="Previous">&#8249;</a>
  <div class="lightbox-modal__image-wrap">
    <img src="https://picsum.photos/seed/lb4/1200/900" alt="Forest path" class="lightbox-modal__image">
  </div>
  <div class="lightbox-modal__caption">Serene forest path in autumn</div>
  <div class="lightbox-modal__thumbs">
    <img src="https://picsum.photos/seed/lb1/56/42" class="lightbox-modal__thumb" alt="">
    <img src="https://picsum.photos/seed/lb2/56/42" class="lightbox-modal__thumb" alt="">
    <img src="https://picsum.photos/seed/lb3/56/42" class="lightbox-modal__thumb" alt="">
    <img src="https://picsum.photos/seed/lb4/56/42" class="lightbox-modal__thumb lightbox-modal__thumb--active" alt="">
  </div>
</div>

</body>
</html>
