<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Neon City Background Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="ease-city-wrapper" role="img" aria-label="Cyberpunk neon city skyline with water reflection">
    <div class="ease-city-sky" aria-hidden="true"></div>
    <div class="ease-neon-glow" aria-hidden="true"></div>
    <div class="ease-skyline" aria-hidden="true"></div>
    <div class="ease-neon-traffic" aria-hidden="true"></div>
    <div class="ease-water-reflection" aria-hidden="true"></div>
  </div>
  <p style="position: absolute; bottom: 2rem; color: #64748b; font-family: system-ui; font-size: 0.875rem;">Skyline rendered via CSS clip-path math. Zero image files used.</p>
</body>
</html>
