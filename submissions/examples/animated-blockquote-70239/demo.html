<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Blockquote</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <section class="demo" aria-labelledby="demo-title">
            <h1 id="demo-title">CSS Animated Blockquote</h1>
            <p>A beautifully animated blockquote with revealing borders and flying quotation marks.</p>

            <figure class="ease-animated-blockquote-wrapper">
                <blockquote class="ease-animated-blockquote">
                    <p>Design is not just what it looks like and feels like. Design is how it works.</p>
                </blockquote>
                <figcaption class="ease-blockquote-attribution">
                    &mdash; Steve Jobs
                </figcaption>
            </figure>
        </section>
    </main>
</body>
</html>
