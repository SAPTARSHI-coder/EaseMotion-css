<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Sticky Section Header</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">

    <section class="section">
      <h2 class="sticky-header">Frontend</h2>
      <div class="item">HTML Basics</div>
      <div class="item">CSS Layouts</div>
      <div class="item">Flexbox Guide</div>
      <div class="item">Grid Systems</div>
      <div class="item">Responsive Design</div>
      <div class="item">Accessibility</div>
    </section>

    <section class="section">
      <h2 class="sticky-header">Backend</h2>
      <div class="item">Node.js</div>
      <div class="item">Express.js</div>
      <div class="item">REST APIs</div>
      <div class="item">Authentication</div>
      <div class="item">Database Design</div>
      <div class="item">Deployment</div>
    </section>

    <section class="section">
      <h2 class="sticky-header">DevOps</h2>
      <div class="item">Docker</div>
      <div class="item">Kubernetes</div>
      <div class="item">CI/CD Pipelines</div>
      <div class="item">Monitoring</div>
      <div class="item">Cloud Services</div>
      <div class="item">Infrastructure as Code</div>
    </section>

  </div>

</body>
</html>
