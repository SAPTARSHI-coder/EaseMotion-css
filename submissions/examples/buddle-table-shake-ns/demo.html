<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buddle Table Shake — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Buddle Table Shake demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Buddle Table Shake</h1>
      <p class="lede">Buddle table shaking fines downslope</p>
    </header>

    <section class="ease-buddle-table-shake" data-demo="buddle-table-shake" aria-live="polite">
      <div class="ease-buddle-table-shake__housing">
        <div class="ease-buddle-table-shake__bezel">
          <div class="ease-buddle-table-shake__face">
            <div class="ease-buddle-table-shake__readout">
              <span class="ease-buddle-table-shake__label">Buddle Table Shake</span>
              <span class="ease-buddle-table-shake__value">LIVE</span>
            </div>
            <div class="ease-buddle-table-shake__motion" aria-hidden="true">
              <span class="ease-buddle-table-shake__a"></span>
              <span class="ease-buddle-table-shake__b"></span>
              <span class="ease-buddle-table-shake__c"></span>
              <span class="ease-buddle-table-shake__d"></span>
            </div>
            <div class="ease-buddle-table-shake__meters">
              <i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-buddle-table-shake__controls">
          <button type="button" class="ease-buddle-table-shake__btn primary">Shake</button>
          <button type="button" class="ease-buddle-table-shake__btn">Stop</button>
          <label class="ease-buddle-table-shake__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-buddle-table-shake__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
