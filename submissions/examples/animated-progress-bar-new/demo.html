
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ease-progress Demo</title>
<link rel="stylesheet" href="style.css">
<style>
  body { font-family: system-ui, sans-serif; background: #0f172a; color: #f1f5f9; padding: 60px; }
  .demo-block { max-width: 400px; margin-bottom: 30px; }
  .demo-block p { margin-bottom: 8px; }
</style>
</head>
<body>
  <h1>ease-progress</h1>

  <div class="demo-block">
    <p>65% Complete</p>
    <div class="progress">
      <div class="progress-bar" style="--progress: 65%"></div>
    </div>
  </div>

  <div class="demo-block">
    <p>90% (Striped / Active Upload)</p>
    <div class="progress">
      <div class="progress-bar striped" style="--progress: 90%"></div>
    </div>
  </div>

  <div class="demo-block">
    <p>30% (Warning)</p>
    <div class="progress">
      <div class="progress-bar warning" style="--progress: 30%"></div>
    </div>
  </div>
</body>
</html>
