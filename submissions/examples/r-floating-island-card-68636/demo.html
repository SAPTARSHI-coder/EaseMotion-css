<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CSS Floating Island Card">
  <title>Floating Island Card</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">
    <section class="floating-card" aria-labelledby="card-title">
      <div class="card-glow" aria-hidden="true"></div>

      <div class="card-icon" aria-hidden="true">
        ✦
      </div>

      <div class="card-content">
        <span class="card-label">FEATURED</span>
        <h1 id="card-title">Floating Island</h1>
        <p>
          A lightweight CSS card with layered shadows, subtle motion,
          and a smooth floating effect.
        </p>

        <a href="#" class="card-action" aria-label="Explore Floating Island">
          Explore
          <span aria-hidden="true">→</span>
        </a>
      </div>
    </section>
  </main>

</body>
</html>
