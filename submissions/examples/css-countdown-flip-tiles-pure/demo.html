<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Countdown Flip Tiles</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="layout-container">
        
        <header class="section-header">
            <h1 class="title">Countdown Flip Tiles</h1>
            <p class="subtitle">A pure CSS mechanical flip-card countdown animation using 3D transforms and keyframes.</p>
        </header>

        <div class="demo-area">
            
            <div class="flip-clock" role="timer" aria-label="Countdown Timer">
                
                <!-- Hours -->
                <div class="flip-unit">
                    <div class="flip-card">
                        <div class="top">09</div>
                        <div class="bottom">08</div>
                        <div class="flip-top">09</div>
                        <div class="flip-bottom">08</div>
                    </div>
                    <span class="label">Hours</span>
                </div>
                
                <!-- Minutes -->
                <div class="flip-unit">
                    <div class="flip-card anim-minutes">
                        <div class="top">45</div>
                        <div class="bottom">44</div>
                        <div class="flip-top">45</div>
                        <div class="flip-bottom">44</div>
                    </div>
                    <span class="label">Minutes</span>
                </div>
                
                <!-- Seconds -->
                <div class="flip-unit">
                    <div class="flip-card anim-seconds">
                        <div class="top">12</div>
                        <div class="bottom">11</div>
                        <!-- The flipping plates -->
                        <div class="flip-top">12</div>
                        <div class="flip-bottom">11</div>
                    </div>
                    <span class="label">Seconds</span>
                </div>
                
            </div>
            
        </div>
        
    </div>

</body>
</html>
