<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRT Monitor Scanlines | EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="monitor">
        <div class="screen">
            <div class="content">
                <h1>SYSTEM BOOT</h1>
                <p>LOADING KERNEL...</p>
                <p>MEMORY CHECK: OK</p>
                <p class="blink">_</p>
            </div>
            <div class="scanlines"></div>
            <div class="glare"></div>
        </div>
    </div>
</body>
</html>
