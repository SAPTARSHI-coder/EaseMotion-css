<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Magnet Toggle – Attract / Repel with Animation</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <h1>🧲 Magnet Toggle</h1>
    <p class="subtitle">Click the switch — attract or repel with fluid animation</p>

    <div class="magnet-container">
      <!-- Main Magnet -->
      <div class="magnet" id="magnet">
        <div class="magnet-body">
          <div class="pole north" id="northPole">
            <span class="pole-label">N</span>
            <div class="pole-glow"></div>
          </div>
          <div class="magnet-center">
            <div class="magnet-divider"></div>
            <div class="toggle-switch" id="toggleSwitch">
              <div class="switch-track">
                <div class="switch-thumb" id="switchThumb"></div>
              </div>
            </div>
          </div>
          <div class="pole south" id="southPole">
            <span class="pole-label">S</span>
            <div class="pole-glow"></div>
          </div>
        </div>
        <div class="magnet-shadow"></div>
      </div>

      <!-- Particles / Objects -->
      <div class="particles-container" id="particlesContainer">
        <div class="particle" id="particle1" style="--delay: 0s">⏺</div>
        <div class="particle" id="particle2" style="--delay: 0.2s">⏺</div>
        <div class="particle" id="particle3" style="--delay: 0.4s">⏺</div>
        <div class="particle" id="particle4" style="--delay: 0.6s">⏺</div>
        <div class="particle" id="particle5" style="--delay: 0.8s">⏺</div>
        <div class="particle" id="particle6" style="--delay: 1.0s">⏺</div>
        <div class="particle" id="particle7" style="--delay: 1.2s">⏺</div>
        <div class="particle" id="particle8" style="--delay: 1.4s">⏺</div>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <button class="ctrl-btn attract" id="attractBtn">🧲 Attract</button>
      <button class="ctrl-btn repel" id="repelBtn">💨 Repel</button>
      <button class="ctrl-btn toggle" id="toggleBtn">🔄 Toggle</button>
      <button class="ctrl-btn random" id="randomBtn">🎲 Random Burst</button>
    </div>

    <!-- Status -->
    <div class="status" id="status">🧲 Click Attract or Repel to see the magic</div>

    <!-- Force Meter -->
    <div class="force-meter">
      <span class="force-label">Force</span>
      <div class="force-bar-bg">
        <div class="force-bar" id="forceBar" style="width: 50%"></div>
      </div>
      <span class="force-value" id="forceValue">50%</span>
    </div>

    <!-- Keyboard shortcuts -->
    <div class="shortcuts">
      <kbd>A</kbd> Attract · <kbd>R</kbd> Repel · <kbd>T</kbd> Toggle · <kbd>Space</kbd> Random
    </div>
  </div>

  <script>
    (function() {
      "use strict";

      // DOM elements
      const magnet = document.getElementById('magnet');
      const toggleSwitch = document.getElementById('toggleSwitch');
      const switchThumb = document.getElementById('switchThumb');
      const northPole = document.getElementById('northPole');
      const southPole = document.getElementById('southPole');
      const particlesContainer = document.getElementById('particlesContainer');
      const particles = document.querySelectorAll('.particle');
      const status = document.getElementById('status');
      const forceBar = document.getElementById('forceBar');
      const forceValue = document.getElementById('forceValue');
      const attractBtn = document.getElementById('attractBtn');
      const repelBtn = document.getElementById('repelBtn');
      const toggleBtn = document.getElementById('toggleBtn');
      const randomBtn = document.getElementById('randomBtn');

      // State
      let mode = 'neutral'; // 'attract' | 'repel' | 'neutral'
      let isAnimating = false;
      let animationId = null;
      let force = 50; // 0-100
      let particlePositions = [];
      let targetPositions = [];
      let burstActive = false;
      let burstTimer = null;

      // Constants
      const PARTICLE_COUNT = particles.length;
      const ATTRACT_DISTANCE = 60;
      const REPEL_DISTANCE = 120;

      // ----- Init particle positions -----
      function initParticles() {
        particlePositions = [];
        targetPositions = [];
        const containerRect = particlesContainer.getBoundingClientRect();
        const cx = containerRect.width / 2;
        const cy = containerRect.height / 2;

        particles.forEach((p, i) => {
          const angle = (i / PARTICLE_COUNT) * Math.PI * 2;
          const radius = 80 + Math.random() * 30;
          const x = cx + Math.cos(angle) * radius;
          const y = cy + Math.sin(angle) * radius;
          p.style.left = x + 'px';
          p.style.top = y + 'px';
          p.style.transform = 'translate(-50%, -50%) scale(1)';
          particlePositions[i] = { x, y };
          targetPositions[i] = { x, y };
          p.style.opacity = '0.8';
          p.style.transition = 'none';
        });
      }

      // ----- Update particle positions with animation -----
      function updateParticles(instant = false) {
        const containerRect = particlesContainer.getBoundingClientRect();
        const cx = containerRect.width / 2;
        const cy = containerRect.height / 2;

        particles.forEach((p, i) => {
          const angle = (i / PARTICLE_COUNT) * Math.PI * 2 + (mode === 'repel' ? Math.PI / PARTICLE_COUNT : 0);
          
          let targetX, targetY;

          if (mode === 'attract') {
            // Attract: particles move toward center with orbiting
            const orbitRadius = 30 + (force / 100) * 40;
            const orbitAngle = angle + Date.now() * 0.001 * (0.5 + force / 200);
            targetX = cx + Math.cos(orbitAngle) * orbitRadius;
            targetY = cy + Math.sin(orbitAngle) * orbitRadius;
            // Scale based on force
            const scale = 0.8 + (force / 100) * 0.6;
            p.style.transform = `translate(-50%, -50%) scale(${scale})`;
            p.style.opacity = 0.6 + (force / 100) * 0.4;
          } else if (mode === 'repel') {
            // Repel: particles push outward with rotation
            const repelRadius = 100 + (force / 100) * 80;
            const repelAngle = angle + Date.now() * 0.0005 * (1 + force / 100);
            targetX = cx + Math.cos(repelAngle) * repelRadius;
            targetY = cy + Math.sin(repelAngle) * repelRadius;
            // Scale based on distance
            const scale = 1.2 - (force / 100) * 0.5;
            p.style.transform = `translate(-50%, -50%) scale(${Math.max(0.6, scale)})`;
            p.style.opacity = 0.3 + (1 - force / 100) * 0.5;
          } else {
            // Neutral: spread out evenly
            const neutralRadius = 80;
            const neutralAngle = angle + Date.now() * 0.0002;
            targetX = cx + Math.cos(neutralAngle) * neutralRadius;
            targetY = cy + Math.sin(neutralAngle) * neutralRadius;
            p.style.transform = 'translate(-50%, -50%) scale(1)';
            p.style.opacity = '0.8';
          }

          // Apply with smooth transition
          if (instant) {
            p.style.left = targetX + 'px';
            p.style.top = targetY + 'px';
          } else {
            // Smooth interpolation
            const currentX = parseFloat(p.style.left) || targetX;
            const currentY = parseFloat(p.style.top) || targetY;
            const lerpFactor = 0.08 + (force / 100) * 0.04;
            const newX = currentX + (targetX - currentX) * lerpFactor;
            const newY = currentY + (targetY - currentY) * lerpFactor;
            p.style.left = newX + 'px';
            p.style.top = newY + 'px';
          }
        });
      }

      // ----- Animation loop -----
      function animateParticles() {
        if (!isAnimating) return;
        updateParticles(false);
        animationId = requestAnimationFrame(animateParticles);
      }

      function startAnimation() {
        if (isAnimating) return;
        isAnimating = true;
        animateParticles();
      }

      function stopAnimation() {
        isAnimating = false;
        if (animationId) {
          cancelAnimationFrame(animationId);
          animationId = null;
        }
      }

      // ----- Set mode -----
      function setMode(newMode, instant = false) {
        mode = newMode;
        
        // Update magnet appearance
        magnet.className = 'magnet';
        if (mode === 'attract') {
          magnet.classList.add('attract-mode');
          northPole.classList.add('active');
          southPole.classList.add('active');
          toggleSwitch.classList.add('attract');
          switchThumb.style.transform = 'translateX(20px)';
          status.textContent = '🧲 Attracting! Particles are drawn to the magnet.';
        } else if (mode === 'repel') {
          magnet.classList.add('repel-mode');
          northPole.classList.add('active');
          southPole.classList.add('active');
          toggleSwitch.classList.add('repel');
          switchThumb.style.transform = 'translateX(-20px)';
          status.textContent = '💨 Repelling! Particles are pushed away.';
        } else {
          magnet.classList.remove('attract-mode', 'repel-mode');
          northPole.classList.remove('active');
          southPole.classList.remove('active');
          toggleSwitch.classList.remove('attract', 'repel');
          switchThumb.style.transform = 'translateX(0px)';
          status.textContent = '🌀 Neutral — click Attract or Repel to start.';
        }

        // Update particles
        if (instant) {
          updateParticles(true);
        }
        startAnimation();
      }

      // ----- Update force -----
      function setForce(value) {
        force = Math.max(0, Math.min(100, value));
        forceBar.style.width = force + '%';
        forceValue.textContent = Math.round(force) + '%';
        
        // Update force bar color
        if (mode === 'attract') {
          forceBar.style.background = `linear-gradient(90deg, #ff6b6b, #ffd93d, #6bcb77)`;
        } else if (mode === 'repel') {
          forceBar.style.background = `linear-gradient(90deg, #4d96ff, #6bcb77, #ffd93d)`;
        } else {
          forceBar.style.background = 'linear-gradient(90deg, #6b7a9f, #8a9bc7)';
        }
      }

      // ----- Toggle between attract and repel -----
      function toggleMode() {
        if (mode === 'attract') {
          setMode('repel');
        } else if (mode === 'repel') {
          setMode('attract');
        } else {
          setMode('attract');
        }
      }

      // ----- Random burst -----
      function randomBurst() {
        if (burstActive) {
          clearTimeout(burstTimer);
          burstActive = false;
        }

        const newMode = Math.random() > 0.5 ? 'attract' : 'repel';
        const newForce = 20 + Math.random() * 80;
        
        // Flash effect
        particles.forEach(p => {
          p.style.transition = 'transform 0.1s ease, opacity 0.1s ease';
        });

        // Set mode with burst
        setMode(newMode);
        setForce(newForce);
        
        // Randomize particle positions briefly
        const containerRect = particlesContainer.getBoundingClientRect();
        const cx = containerRect.width / 2;
        const cy = containerRect.height / 2;
        
        particles.forEach((p, i) => {
          const angle = Math.random() * Math.PI * 2;
          const radius = 20 + Math.random() * 120;
          const x = cx + Math.cos(angle) * radius;
          const y = cy + Math.sin(angle) * radius;
          p.style.left = x + 'px';
          p.style.top = y + 'px';
          p.style.transform = `translate(-50%, -50%) scale(${0.5 + Math.random() * 1})`;
          p.style.opacity = 0.3 + Math.random() * 0.7;
        });

        burstActive = true;
        status.textContent = `🎲 Random burst! ${newMode === 'attract' ? 'Attracting' : 'Repelling'} at ${Math.round(newForce)}% force`;

        // Reset to normal after burst
        burstTimer = setTimeout(() => {
          burstActive = false;
          setMode(mode, true);
          setForce(force);
          status.textContent = `🔄 Back to ${mode === 'attract' ? 'attract' : 'repel'} mode`;
          particles.forEach(p => {
            p.style.transition = 'all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1)';
          });
        }, 800);
      }

      // ----- Event Listeners -----
      attractBtn.addEventListener('click', () => {
        if (burstActive) {
          clearTimeout(burstTimer);
          burstActive = false;
        }
        setMode('attract');
        setForce(Math.min(100, force + 10));
      });

      repelBtn.addEventListener('click', () => {
        if (burstActive) {
          clearTimeout(burstTimer);
          burstActive = false;
        }
        setMode('repel');
        setForce(Math.min(100, force + 10));
      });

      toggleBtn.addEventListener('click', toggleMode);

      randomBtn.addEventListener('click', randomBurst);

      // Keyboard shortcuts
      document.addEventListener('keydown', (e) => {
        if (e.key === 'a' || e.key === 'A') {
          e.preventDefault();
          attractBtn.click();
        }
        if (e.key === 'r' || e.key === 'R') {
          e.preventDefault();
          repelBtn.click();
        }
        if (e.key === 't' || e.key === 'T') {
          e.preventDefault();
          toggleBtn.click();
        }
        if (e.key === ' ' || e.key === 'Space') {
          e.preventDefault();
          randomBtn.click();
        }
        if (e.key === 'ArrowUp') {
          e.preventDefault();
          setForce(Math.min(100, force + 5));
        }
        if (e.key === 'ArrowDown') {
          e.preventDefault();
          setForce(Math.max(0, force - 5));
        }
      });

      // Click on magnet to toggle
      document.querySelector('.magnet-body').addEventListener('click', toggleMode);

      // ----- Resize handler -----
      let resizeTimeout;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(() => {
          initParticles();
          if (mode !== 'neutral') {
            setMode(mode, true);
          }
        }, 200);
      });

      // ----- Init -----
      function init() {
        setForce(50);
        setMode('neutral', true);
        initParticles();
        status.textContent = '🧲 Click Attract, Repel, or Toggle to interact!';
        
        // Add transition for particles after init
        setTimeout(() => {
          particles.forEach(p => {
            p.style.transition = 'left 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), top 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), transform 0.3s ease, opacity 0.3s ease';
          });
        }, 100);
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }

    })();
  </script>
</body>
</html>
