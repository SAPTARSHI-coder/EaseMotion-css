<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark light">
  <title>Particle Burst Toast</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">
    <section class="demo-area" aria-label="Particle burst toast demo">

      <article class="toast" role="status" aria-live="polite">

        <div class="particles" aria-hidden="true">
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
        </div>

        <div class="toast-icon" aria-hidden="true">
          ✓
        </div>

        <div class="toast-content">
          <span class="toast-label">SUCCESS</span>
          <h1>Action Completed</h1>
          <p>Your changes were successfully applied.</p>
        </div>

        <button
          class="toast-close"
          type="button"
          aria-label="Close notification"
        >
          <span aria-hidden="true">×</span>
        </button>

      </article>

    </section>
  </main>

</body>
</html>
