<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Micro-interactions: Morphing Shape</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header class="header">
            <h1>Morphing Shape</h1>
            <p>Pure CSS hardware-accelerated shape shifting micro-interactions.</p>
        </header>

        <main class="grid">
            
            <!-- Morphing Button -->
            <section class="demo-section">
                <div class="demo-content">
                    <h2>Squircle Morph</h2>
                    <p>Hover to fluidly morph from a pill to a circle.</p>
                    
                    <div class="component-box">
                        <button class="btn btn-morph">
                            <span class="icon">+</span>
                            <span class="text">Add Item</span>
                        </button>
                    </div>
                </div>
            </section>

            <!-- Organic Blob -->
            <section class="demo-section">
                <div class="demo-content">
                    <h2>Organic Blob</h2>
                    <p>Infinite morphing using complex border-radius manipulation.</p>
                    
                    <div class="component-box">
                        <div class="blob-container">
                            <div class="blob shape-1"></div>
                            <div class="blob shape-2"></div>
                            <div class="blob-content">
                                <span>Fluid</span>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Hamburger to X Toggle -->
            <section class="demo-section">
                <div class="demo-content">
                    <h2>Menu Morph Toggle</h2>
                    <p>Click to morph the hamburger lines into an X.</p>
                    
                    <div class="component-box">
                        <label class="menu-toggle">
                            <input type="checkbox">
                            <div class="burger">
                                <span></span>
                                <span></span>
                                <span></span>
                            </div>
                        </label>
                    </div>
                </div>
            </section>
            
        </main>
    </div>

</body>
</html>
