<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Pure CSS underwater bubble field animation"
  >

  <title>Underwater Bubble Field</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="ocean" aria-label="Underwater bubble animation">

    <div class="ocean__glow" aria-hidden="true"></div>

    <section class="ocean__content">
      <p class="eyebrow">Pure CSS Animation</p>

      <h1>Underwater Bubble Field</h1>

      <p class="description">
        A layered underwater atmosphere with depth-based bubbles,
        floating particles and gentle wave motion.
      </p>
    </section>

    <div class="bubble-field" aria-hidden="true">

      <!-- Back layer -->
      <div class="bubble bubble--back bubble--1"></div>
      <div class="bubble bubble--back bubble--2"></div>
      <div class="bubble bubble--back bubble--3"></div>
      <div class="bubble bubble--back bubble--4"></div>

      <!-- Middle layer -->
      <div class="bubble bubble--middle bubble--5"></div>
      <div class="bubble bubble--middle bubble--6"></div>
      <div class="bubble bubble--middle bubble--7"></div>
      <div class="bubble bubble--middle bubble--8"></div>

      <!-- Front layer -->
      <div class="bubble bubble--front bubble--9"></div>
      <div class="bubble bubble--front bubble--10"></div>
      <div class="bubble bubble--front bubble--11"></div>
      <div class="bubble bubble--front bubble--12"></div>

    </div>

    <div class="sea-floor" aria-hidden="true">
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
    </div>

  </main>

</body>
</html>
