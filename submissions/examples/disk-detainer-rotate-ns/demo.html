<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Disk Detainer Rotate — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Disk Detainer Rotate demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Disk Detainer Rotate</h1>
      <p class="lede">Disk detainer rotating a true gate</p>
    </header>

    <section class="ease-disk-detainer-rotate" data-demo="disk-detainer-rotate" aria-live="polite">
      <div class="ease-disk-detainer-rotate__housing">
        <div class="ease-disk-detainer-rotate__bezel">
          <div class="ease-disk-detainer-rotate__face">
            <div class="ease-disk-detainer-rotate__readout">
              <span class="ease-disk-detainer-rotate__label">Disk Detainer Rotate</span>
              <span class="ease-disk-detainer-rotate__value">LIVE</span>
            </div>
            <div class="ease-disk-detainer-rotate__motion" aria-hidden="true">
              <span class="ease-disk-detainer-rotate__a"></span>
              <span class="ease-disk-detainer-rotate__b"></span>
              <span class="ease-disk-detainer-rotate__c"></span>
              <span class="ease-disk-detainer-rotate__d"></span>
            </div>
            <div class="ease-disk-detainer-rotate__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-disk-detainer-rotate__controls">
          <button type="button" class="ease-disk-detainer-rotate__btn primary">Rotate</button>
          <button type="button" class="ease-disk-detainer-rotate__btn">Home</button>
          <label class="ease-disk-detainer-rotate__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-disk-detainer-rotate__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
