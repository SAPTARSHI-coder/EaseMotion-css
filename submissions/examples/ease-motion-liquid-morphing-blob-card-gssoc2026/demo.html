<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liquid Morphing Blob Card | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <div class="blob-card">
      <div class="blob-background"></div>
      <div class="blob-background secondary"></div>
      <div class="card-content">
        <div class="card-badge">GSSoC 2026</div>
        <h2 class="card-title">Fluid Motion & Organic Blobs</h2>
        <p class="card-description">
          Experience dynamic CSS keyframe-based liquid border morphing paired with multi-layer organic gradient rotations and glassmorphism reflection effects.
        </p>
        <div class="card-actions">
          <button class="btn btn-primary">Explore Feature</button>
          <button class="btn btn-secondary">Documentation</button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
