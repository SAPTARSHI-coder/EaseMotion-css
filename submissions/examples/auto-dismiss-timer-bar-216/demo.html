<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Compact mobile-first floating notification toast with auto-dismiss timer">
  <title>Floating Notification Toast</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">
    <section class="demo-card">
      <span class="eyebrow">EaseMotion Component</span>

      <h1>Floating Notification Toast</h1>

      <p class="description">
        A compact mobile-first notification with smooth entrance,
        auto-dismiss timer and progress indicator.
      </p>

      <button class="show-button" id="showToast">
        Show Notification
      </button>
    </section>
  </main>

  <aside
    class="toast"
    id="toast"
    role="status"
    aria-live="polite"
    aria-hidden="true"
  >
    <div class="toast-icon" aria-hidden="true">✓</div>

    <div class="toast-content">
      <strong>Changes saved</strong>
      <span>Your profile has been updated successfully.</span>
    </div>

    <button
      class="close-button"
      id="closeToast"
      aria-label="Close notification"
    >
      ×
    </button>

    <div class="timer">
      <span id="timerBar"></span>
    </div>
  </aside>

  <script>
    const toast = document.getElementById("toast");
    const showToast = document.getElementById("showToast");
    const closeToast = document.getElementById("closeToast");
    const timerBar = document.getElementById("timerBar");

    const duration = 5000;
    let timeoutId;

    function openToast() {
      clearTimeout(timeoutId);

      toast.classList.remove("hide");
      toast.classList.add("show");
      toast.setAttribute("aria-hidden", "false");

      timerBar.classList.remove("run");

      requestAnimationFrame(() => {
        timerBar.classList.add("run");
      });

      timeoutId = setTimeout(closeNotification, duration);
    }

    function closeNotification() {
      clearTimeout(timeoutId);

      toast.classList.remove("show");
      toast.classList.add("hide");
      toast.setAttribute("aria-hidden", "true");
    }

    showToast.addEventListener("click", openToast);
    closeToast.addEventListener("click", closeNotification);

    toast.addEventListener("mouseenter", () => {
      clearTimeout(timeoutId);
      timerBar.style.animationPlayState = "paused";
    });

    toast.addEventListener("mouseleave", () => {
      timerBar.style.animationPlayState = "running";
      timeoutId = setTimeout(closeNotification, 1500);
    });
  </script>

</body>
</html>
