<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Entanglement Witness - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030712; color: #ffffff;">

    <div class="ease-card ease-card-glass witness-container">
        <div class="witness-header">
            <h2>Entanglement Witness</h2>
            <span class="ease-badge ease-badge-success">Verified</span>
        </div>
        
        <div class="witness-screen ease-center">
            <div class="inequality-flux flux-1"></div>
            <div class="inequality-flux flux-2"></div>
            <div class="witness-boundary-ring"></div>
            <div class="density-matrix-core ease-center"></div>
        </div>

        <div class="witness-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Expectation: Tr(Wρ) &lt; 0</span>
            <button class="ease-btn ease-btn-primary ease-btn-sm ease-hover-grow">Compute Witness</button>
        </div>
    </div>

</body>
</html>
