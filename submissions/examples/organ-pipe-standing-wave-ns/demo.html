<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Organ Pipe Standing Wave — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Organ Pipe Standing Wave demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Organ Pipe Standing Wave</h1>
      <p class="lede">Organ pipe standing wave nodes shimmering in air column</p>
    </header>

    <section class="ease-organ-pipe-standing-wave" data-demo="organ-pipe-standing-wave" aria-live="polite">
      <div class="ease-organ-pipe-standing-wave__housing">
        <div class="ease-organ-pipe-standing-wave__bezel">
          <div class="ease-organ-pipe-standing-wave__face">
            <div class="ease-organ-pipe-standing-wave__readout">
              <span class="ease-organ-pipe-standing-wave__label">Organ Pipe Standing Wave</span>
              <span class="ease-organ-pipe-standing-wave__value">LIVE</span>
            </div>
            <div class="ease-organ-pipe-standing-wave__motion" aria-hidden="true">
              <span class="ease-organ-pipe-standing-wave__a"></span>
              <span class="ease-organ-pipe-standing-wave__b"></span>
              <span class="ease-organ-pipe-standing-wave__c"></span>
              <span class="ease-organ-pipe-standing-wave__d"></span>
            </div>
            <div class="ease-organ-pipe-standing-wave__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-organ-pipe-standing-wave__controls">
          <button type="button" class="ease-organ-pipe-standing-wave__btn primary">Engage</button>
          <button type="button" class="ease-organ-pipe-standing-wave__btn">Reset</button>
          <label class="ease-organ-pipe-standing-wave__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-organ-pipe-standing-wave__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
