<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-progress-stepper-dots demo</title>
</head>
<body>
<div class="psd-card">
  <span class="psd-title">CHECKOUT</span>
  <div class="psd-steps">
    <span class="psd-dot psd-done">1</span>
    <span class="psd-line psd-l1"></span>
    <span class="psd-dot psd-done">2</span>
    <span class="psd-line psd-l2"></span>
    <span class="psd-dot psd-active">3</span>
    <span class="psd-line psd-l3"></span>
    <span class="psd-dot">4</span>
    <span class="psd-line psd-l4"></span>
    <span class="psd-dot">5</span>
  </div>
  <span class="psd-caption">STEP 3 OF 5 - PAYMENT</span>
  <div class="psd-controls">
    <span class="psd-btn">BACK</span>
    <span class="psd-btn psd-next">NEXT</span>
  </div>
</div>
</body>
</html>
