<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="CSS API Key Display with show, hide and copy functionality"
  >
  <title>CSS API Key Display</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="demo-page">
    <section
      class="api-card"
      aria-labelledby="api-title"
    >
      <div class="api-header">
        <div>
          <p class="eyebrow">Developer Settings</p>
          <h1 id="api-title">API Key</h1>
        </div>

        <span class="status-badge">Active</span>
      </div>

      <p class="api-description">
        Use this API key to authenticate requests from your application.
        Keep your key private and never expose it publicly.
      </p>

      <div class="api-key-group">
        <label for="api-key">Your API key</label>

        <div class="api-key-row">
          <input
            id="api-key"
            class="api-key-input"
            type="password"
            value="demo_api_key_example_123456789"
            readonly
            aria-describedby="api-help"
          >

          <button
            type="button"
            class="icon-button toggle-button"
            id="toggle-key"
            aria-label="Show API key"
            aria-pressed="false"
          >
            <span class="eye-icon" aria-hidden="true"></span>
          </button>

          <button
            type="button"
            class="copy-button"
            id="copy-key"
            aria-label="Copy API key"
          >
            Copy
          </button>
        </div>

        <p id="api-help" class="api-help">
          Click the eye button to show or hide the key.
        </p>

        <p
          id="copy-status"
          class="copy-status"
          role="status"
          aria-live="polite"
        ></p>
      </div>
    </section>
  </main>

  <script>
    const apiKey = document.getElementById("api-key");
    const toggleButton = document.getElementById("toggle-key");
    const copyButton = document.getElementById("copy-key");
    const copyStatus = document.getElementById("copy-status");

    toggleButton.addEventListener("click", () => {
      const isHidden = apiKey.type === "password";

      apiKey.type = isHidden ? "text" : "password";

      toggleButton.setAttribute(
        "aria-label",
        isHidden ? "Hide API key" : "Show API key"
      );

      toggleButton.setAttribute(
        "aria-pressed",
        String(isHidden)
      );
    });

    copyButton.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(apiKey.value);

        copyStatus.textContent = "API key copied to clipboard.";

        copyButton.textContent = "Copied";

        setTimeout(() => {
          copyButton.textContent = "Copy";
          copyStatus.textContent = "";
        }, 1800);
      } catch {
        copyStatus.textContent =
          "Copy failed. Please copy the API key manually.";
      }
    });
  </script>

</body>
</html>
