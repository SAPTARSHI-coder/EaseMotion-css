<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Magnetic Glow CSS Button">
    <title>Magnetic Glow Button</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="page">
        <section class="demo-card" aria-labelledby="title">
            <p class="eyebrow">EaseMotion CSS</p>

            <h1 id="title">Magnetic Glow Button</h1>

            <p class="description">
                A smooth CSS-only button with a soft magnetic glow and
                lift effect on hover.
            </p>

            <div class="button-group">
                <button class="magnetic-glow-btn" type="button">
                    <span>Get Started</span>
                </button>

                <button class="magnetic-glow-btn secondary" type="button">
                    <span>Explore More</span>
                </button>
            </div>
        </section>
    </main>

</body>
</html>
