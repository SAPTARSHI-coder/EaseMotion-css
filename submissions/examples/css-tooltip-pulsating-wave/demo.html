<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Tooltip - Pulsating Wave</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>Pulsating Wave Tooltip</h1>
    <p>Hover or focus the buttons to reveal the animated tooltip.</p>

    <div class="grid">

        <div class="tooltip top">
            <button>Top</button>
            <span class="tooltip-text">Tooltip Above</span>
        </div>

        <div class="tooltip bottom">
            <button>Bottom</button>
            <span class="tooltip-text">Tooltip Below</span>
        </div>

        <div class="tooltip left">
            <button>Left</button>
            <span class="tooltip-text">Tooltip Left</span>
        </div>

        <div class="tooltip right">
            <button>Right</button>
            <span class="tooltip-text">Tooltip Right</span>
        </div>

        <div class="tooltip top">
            <button>Delete</button>
            <span class="tooltip-text danger">
                Permanently remove item
            </span>
        </div>

        <div class="tooltip bottom">
            <button>Download</button>
            <span class="tooltip-text success">
                Download started
            </span>
        </div>

    </div>

</div>

</body>
</html>
