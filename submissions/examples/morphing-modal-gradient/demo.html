<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Morphing Modal - Gradient</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="page">
        <section class="hero">
            <span class="badge">CSS COMPONENT</span>

            <h1>Morphing Gradient Modal</h1>

            <p>
                A responsive CSS-only modal with a smooth morphing
                gradient effect and modern glassmorphism styling.
            </p>

            <button class="open-btn">
                Open Modal
            </button>
        </section>
    </main>


    <!-- Modal -->
    <div class="modal-overlay">

        <div class="modal">

            <button class="close-btn" aria-label="Close modal">
                &times;
            </button>

            <div class="gradient-orb orb-one"></div>
            <div class="gradient-orb orb-two"></div>

            <div class="modal-content">

                <div class="icon">
                    ✨
                </div>

                <h2>Welcome!</h2>

                <p>
                    Experience a smooth morphing modal powered
                    entirely by HTML and CSS.
                </p>

                <div class="actions">
                    <button class="primary-btn">
                        Get Started
                    </button>

                    <button class="secondary-btn">
                        Maybe Later
                    </button>
                </div>

            </div>

        </div>

    </div>

</body>
</html>
