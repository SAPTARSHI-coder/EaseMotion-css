<!-- submissions/examples/morphing-modal-gradient/demo.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Morphing Modal with Gradient | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="demo-container">
    
    <!-- Morphing Modal Wrapper -->
    <div class="ease-modal-wrapper">
      
      <!-- The State Manager Checkbox -->
      <input type="checkbox" id="morph-modal" class="ease-modal-toggle" aria-hidden="true">
      
      <!-- The Trigger Button (Linked to Checkbox) -->
      <label for="morph-modal" class="ease-modal-btn" tabindex="0" role="button">
        Launch Modal
      </label>
      
      <!-- The Modal Overlay & Content -->
      <div class="ease-modal-overlay">
        <div class="ease-modal-content" role="dialog" aria-labelledby="modal-title" aria-modal="true">
          
          <h2 id="modal-title" class="ease-modal-title">Gradient Morph Complete</h2>
          <p class="ease-modal-body">
            This modal was triggered entirely without JavaScript. It uses the CSS checkbox hack to manage state and hardware-accelerated transitions to morph from a compact circle into an expanded card.
          </p>
          
          <!-- The Close Button (Also Linked to Checkbox) -->
          <label for="morph-modal" class="ease-modal-close" tabindex="0" role="button">
            Dismiss
          </label>
          
        </div>
      </div>
      
    </div>

  </main>

</body>
</html>
