<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-fireworks-launch-burst demo</title>
</head>
<body>
<div class="fw-app">
  <div class="fw-head">
    <span class="fw-name">FOURTH NIGHT</span>
    <span class="fw-badge">LIVE</span>
  </div>
  <div class="fw-stage">
    <div class="fw-sky">
      <span class="fw-star fw-star-1"></span>
      <span class="fw-star fw-star-2"></span>
      <span class="fw-star fw-star-3"></span>
      <span class="fw-rocket fw-r1"></span>
      <span class="fw-rocket fw-r2"></span>
      <span class="fw-rocket fw-r3"></span>
      <span class="fw-burst fw-burst-red"></span>
      <span class="fw-burst fw-burst-gold"></span>
      <span class="fw-burst fw-burst-blue"></span>
      <div class="fw-tubes">
        <span class="fw-tube fw-t1"></span>
        <span class="fw-tube fw-t2"></span>
        <span class="fw-tube fw-t3"></span>
      </div>
    </div>
    <div class="fw-city">
      <span class="fw-build fw-build-1"></span>
      <span class="fw-build fw-build-2"></span>
      <span class="fw-build fw-build-3"></span>
    </div>
  </div>
  <div class="fw-foot">SHOW 9 PM</div>
</div>
</body>
</html>
