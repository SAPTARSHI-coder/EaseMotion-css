<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brick Kiln Fire — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Brick Kiln Fire demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Brick Kiln Fire</h1>
      <p class="lede">Brick kiln firebox pulsing heat through stacked bricks</p>
    </header>

    <section class="ease-brick-kiln-fire" data-demo="brick-kiln-fire" aria-live="polite">
      <div class="ease-brick-kiln-fire__housing">
        <div class="ease-brick-kiln-fire__bezel">
          <div class="ease-brick-kiln-fire__face">
            <div class="ease-brick-kiln-fire__readout">
              <span class="ease-brick-kiln-fire__label">Brick Kiln Fire</span>
              <span class="ease-brick-kiln-fire__value">LIVE</span>
            </div>
            <div class="ease-brick-kiln-fire__motion" aria-hidden="true">
              <span class="ease-brick-kiln-fire__a"></span>
              <span class="ease-brick-kiln-fire__b"></span>
              <span class="ease-brick-kiln-fire__c"></span>
              <span class="ease-brick-kiln-fire__d"></span>
            </div>
            <div class="ease-brick-kiln-fire__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-brick-kiln-fire__controls">
          <button type="button" class="ease-brick-kiln-fire__btn primary">Engage</button>
          <button type="button" class="ease-brick-kiln-fire__btn">Reset</button>
          <label class="ease-brick-kiln-fire__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-brick-kiln-fire__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
