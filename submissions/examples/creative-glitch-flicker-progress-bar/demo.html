<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Glitch-Flicker Progress Bar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<section class="portfolio">

    <header class="hero">

        <span class="badge">Creative Portfolio</span>

        <h1>CSS Glitch-Flicker Progress Bars</h1>

        <p>
            Display your professional skills using futuristic
            glitch-flicker progress bars built entirely with HTML5
            and CSS3.
        </p>

    </header>

    <div class="skills">

        <article class="skill-card">

            <div class="skill-info">
                <span>UI / UX Design</span>
                <span>92%</span>
            </div>

            <div class="progress">
                <div class="fill design"></div>
            </div>

        </article>

        <article class="skill-card">

            <div class="skill-info">
                <span>Frontend Development</span>
                <span>88%</span>
            </div>

            <div class="progress">
                <div class="fill frontend"></div>
            </div>

        </article>

        <article class="skill-card">

            <div class="skill-info">
                <span>Motion Design</span>
                <span>76%</span>
            </div>

            <div class="progress">
                <div class="fill motion"></div>
            </div>

        </article>

        <article class="skill-card">

            <div class="skill-info">
                <span>Brand Identity</span>
                <span>84%</span>
            </div>

            <div class="progress">
                <div class="fill branding"></div>
            </div>

        </article>

    </div>

</section>

</body>
</html>
