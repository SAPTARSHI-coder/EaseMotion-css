<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Dark Mode Badge V2</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="container">
        
        <!-- Animated Dark Mode Badges V2 -->
        
        <!-- Variant 1: Neon Pulse -->
        <div class="badge-wrapper">
            <span class="badge badge-neon">
                <span class="badge-dot pulse-dot"></span>
                System Online
            </span>
        </div>

        <!-- Variant 2: Border Sweep -->
        <div class="badge-wrapper">
            <span class="badge badge-sweep">
                <span class="sweep-border"></span>
                <span>Pro Access</span>
                <svg viewBox="0 0 24 24" class="badge-icon"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"/></svg>
            </span>
        </div>

        <!-- Variant 3: Glitch Hover -->
        <div class="badge-wrapper">
            <span class="badge badge-glitch" data-text="BETA V2.4">
                BETA V2.4
            </span>
        </div>

    </div>

</body>
</html>
