<!-- EaseMotion component: escalator-steps -->
<!DOCTYPE html>
<html lang="en" data-esc="steps">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.3">
<title>Ease Escalator Steps</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="escalator">
  <header class="esc-head">
    <span class="esc-station">CENTRAL</span>
    <span class="esc-dir">UP</span>
  </header>
  <div class="esc-bank">
    <span class="esc-rail"></span>
    <span class="esc-step step-1"></span>
    <span class="esc-step step-2"></span>
    <span class="esc-step step-3"></span>
    <span class="esc-step step-4"></span>
    <span class="esc-step step-5"></span>
    <span class="esc-step step-6"></span>
    <span class="esc-step step-7"></span>
    <span class="esc-step step-8"></span>
  </div>
  <footer class="esc-foot">
    <span class="esc-count">32 STEPS</span>
    <span class="esc-safe">SAFETY OK</span>
  </footer>
</main>
</body>
</html>
