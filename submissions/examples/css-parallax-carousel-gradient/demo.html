<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Parallax Carousel Gradient - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="em-carousel-page">
        <!-- Pure CSS Parallax Carousel -->
        <div class="em-carousel" role="region" aria-label="Parallax Carousel Showcase" tabindex="0">
            
            <div class="em-carousel-slide em-slide-1">
                <div class="em-slide-content">
                    <h2 class="em-slide-title">Nebula Drift</h2>
                    <p class="em-slide-desc">Experience fluid parallax motion with deep space gradient aesthetics.</p>
                </div>
            </div>

            <div class="em-carousel-slide em-slide-2">
                <div class="em-slide-content">
                    <h2 class="em-slide-title">Cyber Grid</h2>
                    <p class="em-slide-desc">High-speed motion with vibrant neon gradients and sharp focus.</p>
                </div>
            </div>

            <div class="em-carousel-slide em-slide-3">
                <div class="em-slide-content">
                    <h2 class="em-slide-title">Data Flow</h2>
                    <p class="em-slide-desc">Seamless horizontal transitions featuring modern smooth-scroll mechanics.</p>
                </div>
            </div>

        </div>
    </div>
</body>
</html>
