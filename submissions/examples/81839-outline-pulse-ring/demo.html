<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outline Pulse Ring Demo</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #121212;
            color: #ffffff;
            font-family: system-ui, sans-serif;
        }
        .btn {
            padding: 1rem 2rem;
            font-size: 1.25rem;
            background-color: #3b82f6;
            color: white;
            border: none;
            border-radius: 9999px;
            cursor: pointer;
            z-index: 1;
        }
        .pulse-wrapper {
            position: relative;
            display: inline-block;
            border-radius: 9999px;
            color: #3b82f6; /* color is used for currentColor of the ring */
        }
    </style>
</head>
<body>
    <div class="pulse-wrapper ease-anim-outline-pulse-ring">
        <button class="btn">Pulse Button</button>
    </div>
</body>
</html>
