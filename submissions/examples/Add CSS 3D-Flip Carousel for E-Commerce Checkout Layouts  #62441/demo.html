<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS 3D-Flip Carousel - EaseMotion</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Mock E-Commerce Checkout Wrapper -->
  <main class="checkout-layout">
    
    <div class="checkout-panel">
      <header class="panel-header">
        <h1>Payment Method</h1>
        <p>Select a saved card to complete your purchase securely.</p>
      </header>

      <!-- The Core 3D Carousel Wrapper -->
      <div class="carousel-wrapper">
        
        <!-- Hidden Radio Inputs for State -->
        <input type="radio" name="carousel" id="item-1" checked class="carousel-radio">
        <input type="radio" name="carousel" id="item-2" class="carousel-radio">
        <input type="radio" name="carousel" id="item-3" class="carousel-radio">

        <!-- The 3D Scene -->
        <div class="carousel-3d-scene">
          
          <!-- Card 1: Visa -->
          <label class="carousel-item item-1" for="item-1" aria-label="Select Visa ending in 4242">
            <div class="card visa-card">
              <div class="card-top">
                <div class="card-chip"></div>
                <div class="card-brand">VISA</div>
              </div>
              <div class="card-number">•••• •••• •••• 4242</div>
              <div class="card-bottom">
                <div class="card-holder">John Doe</div>
                <div class="card-expiry">12/26</div>
              </div>
            </div>
          </label>

          <!-- Card 2: Mastercard -->
          <label class="carousel-item item-2" for="item-2" aria-label="Select Mastercard ending in 8899">
            <div class="card master-card">
              <div class="card-top">
                <div class="card-chip"></div>
                <div class="card-brand">
                  <!-- CSS Mock Mastercard Logo -->
                  <div class="mc-logo"></div>
                </div>
              </div>
              <div class="card-number">•••• •••• •••• 8899</div>
              <div class="card-bottom">
                <div class="card-holder">John Doe</div>
                <div class="card-expiry">08/28</div>
              </div>
            </div>
          </label>

          <!-- Card 3: Amex -->
          <label class="carousel-item item-3" for="item-3" aria-label="Select Amex ending in 1001">
            <div class="card amex-card">
              <div class="card-top">
                <div class="card-chip"></div>
                <div class="card-brand">AMEX</div>
              </div>
              <div class="card-number">•••• •••••• •1001</div>
              <div class="card-bottom">
                <div class="card-holder">John Doe</div>
                <div class="card-expiry">04/27</div>
              </div>
            </div>
          </label>

        </div>

        <!-- Dynamic Context Text -->
        <div class="selected-card-info">
          <div class="info-text info-1">Paying with <strong>Visa</strong> ending in 4242</div>
          <div class="info-text info-2">Paying with <strong>Mastercard</strong> ending in 8899</div>
          <div class="info-text info-3">Paying with <strong>Amex</strong> ending in 1001</div>
        </div>

        <!-- Carousel Pagination Dots -->
        <div class="carousel-indicators">
          <label for="item-1" aria-label="Go to card 1"></label>
          <label for="item-2" aria-label="Go to card 2"></label>
          <label for="item-3" aria-label="Go to card 3"></label>
        </div>

      </div>

      <!-- Action Footer -->
      <div class="panel-footer">
        <div class="total-row">
          <span>Order Total</span>
          <strong>$299.00</strong>
        </div>
        <button class="pay-btn">Confirm & Pay</button>
      </div>

    </div>
  </main>

</body>
</html>
