<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Skew-Active Drawer - EaseMotion</title>
  <link rel="stylesheet" href="style.css">
  <!-- Modern, kinetic font -->
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Hidden Checkbox for Pure CSS State -->
  <input type="checkbox" id="drawer-toggle" class="drawer-state" aria-hidden="true">

  <!-- Main Background App -->
  <div class="app-layout">
    
    <header class="app-header">
      <div class="logo">KINETIC.</div>
      
      <!-- Label acts as Cart Toggle Button -->
      <label for="drawer-toggle" class="cart-btn" aria-label="Open Cart">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle>
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
        </svg>
        <span class="badge">3</span>
      </label>
    </header>

    <main class="store-hero">
      <div class="hero-content">
        <h1>Kinetic Skew Dynamics</h1>
        <p>A demonstration of physics-based CSS momentum and braking. Open the cart to see the Skew-Active stagger in action.</p>
        <label for="drawer-toggle" class="hero-btn">View Cart Dynamics</label>
      </div>
    </main>
    
  </div>

  <!-- Drawer Backdrop Overlay -->
  <label for="drawer-toggle" class="drawer-backdrop" aria-label="Close Cart"></label>

  <!-- The Skew-Active Drawer -->
  <aside class="drawer">
    <div class="drawer-inner">
      
      <!-- Stagger Item 1: Header -->
      <header class="drawer-header skew-item header-stagger">
        <h2>Shopping Cart</h2>
        <label for="drawer-toggle" class="close-btn" aria-label="Close">&times;</label>
      </header>

      <div class="drawer-items">
        <!-- Stagger Item 2 -->
        <div class="cart-item skew-item item-stagger-1">
          <div class="item-img img-1"></div>
          <div class="item-details">
            <h4>Geometric Vase</h4>
            <p>$45.00</p>
          </div>
          <div class="item-qty">1</div>
        </div>
        
        <!-- Stagger Item 3 -->
        <div class="cart-item skew-item item-stagger-2">
          <div class="item-img img-2"></div>
          <div class="item-details">
            <h4>Abstract Canvas</h4>
            <p>$120.00</p>
          </div>
          <div class="item-qty">1</div>
        </div>
        
        <!-- Stagger Item 4 -->
        <div class="cart-item skew-item item-stagger-3">
          <div class="item-img img-3"></div>
          <div class="item-details">
            <h4>Minimal Desk Lamp</h4>
            <p>$89.00</p>
          </div>
          <div class="item-qty">1</div>
        </div>
      </div>

      <!-- Stagger Item 5: Footer -->
      <div class="drawer-footer skew-item footer-stagger">
        <div class="total-row">
          <span>Total</span>
          <strong>$254.00</strong>
        </div>
        <button class="checkout-btn" onclick="alert('Proceeding to Gateway!')">Secure Checkout</button>
      </div>

    </div>
  </aside>

</body>
</html>
