<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neumorphic Audio Synthesizer - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="audio-container">
    <div class="audio-player-card">
      <div class="player-header">
        <h2>Neumorphic Audio Equalizer</h2>
        <p>Tactile soft-shadow control deck</p>
      </div>

      <div class="wave-visualizer">
        <div class="bar bar-1"></div>
        <div class="bar bar-2"></div>
        <div class="bar bar-3"></div>
        <div class="bar bar-4"></div>
        <div class="bar bar-5"></div>
      </div>

      <div class="knob-row">
        <div class="knob-wrapper">
          <div class="knob knob-bass">
            <div class="knob-indicator"></div>
          </div>
          <span>BASS</span>
        </div>

        <div class="knob-wrapper">
          <div class="knob knob-treble">
            <div class="knob-indicator"></div>
          </div>
          <span>TREBLE</span>
        </div>
      </div>

      <div class="controls-row">
        <button class="neu-btn">⏮</button>
        <button class="neu-btn play-btn">▶</button>
        <button class="neu-btn">⏭</button>
      </div>
    </div>
  </div>
</body>
</html>
