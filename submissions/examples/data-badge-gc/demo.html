<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Data Badge</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <div class="badge small">
        <span class="number" data-target="42">0</span><span class="suffix">K</span>
        <p>Users</p>
    </div>

    <div class="badge medium">
        <span class="number" data-target="98">0</span><span class="suffix">%</span>
        <p>Success</p>
    </div>

    <div class="badge large">
        <span class="number" data-target="1.2">0</span><span class="suffix">M</span>
        <p>Downloads</p>
    </div>

</div>

<script>
const numbers = document.querySelectorAll(".number");

numbers.forEach(number => {

    const target = parseFloat(number.dataset.target);

    let current = 0;

    const step = target / 80;

    const update = () => {

        current += step;

        if(current >= target){
            current = target;
        }

        if(target % 1 !== 0){
            number.textContent = current.toFixed(1);
        }else{
            number.textContent = Math.floor(current);
        }

        if(current < target){
            requestAnimationFrame(update);
        }

    };

    update();

});
</script>

</body>
</html>
