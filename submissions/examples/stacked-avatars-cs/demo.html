<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EaseMotion — Stacked Avatars</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="demo-shell">
        <section class="avatar-card">
            <span class="eyebrow">EaseMotion CSS</span>

            <h1>Meet the team</h1>

            <p class="intro">
                Hover over the avatar stack to reveal everyone.
            </p>

            <div class="avatar-stack" aria-label="Team members">
                <div class="avatar avatar-1">
                    <span class="avatar-initials">AS</span>
                    <span class="sr-only">Aarav Shah</span>
                </div>

                <div class="avatar avatar-2">
                    <span class="avatar-initials">MK</span>
                    <span class="sr-only">Maya Kapoor</span>
                </div>

                <div class="avatar avatar-3">
                    <span class="avatar-initials">RN</span>
                    <span class="sr-only">Rohan Nair</span>
                </div>

                <div class="avatar avatar-4">
                    <span class="avatar-initials">PS</span>
                    <span class="sr-only">Priya Singh</span>
                </div>

                <div class="avatar avatar-5">
                    <span class="avatar-initials">VK</span>
                    <span class="sr-only">Vikram Kumar</span>
                </div>

                <div class="avatar avatar-more" aria-hidden="true">
                    <span>+4</span>
                </div>
            </div>

            <p class="hint">Hover or focus the stack</p>
        </section>
    </main>
</body>

</html>
