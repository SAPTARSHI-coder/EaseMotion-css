<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-fitness-tracker-steps demo</title>
</head>
<body>
<div class="fts-watch">
  <span class="fts-band fts-top"></span>
  <div class="fts-face">
    <span class="fts-date">MON 12</span>
    <b class="fts-count">10,284</b>
    <div class="fts-rings">
      <span class="fts-ring fts-ring-a"></span>
      <span class="fts-ring fts-ring-b"></span>
      <span class="fts-ring fts-ring-c"></span>
    </div>
    <div class="fts-goal">
      <span class="fts-lbl">STEPS</span>
      <span class="fts-val">Goal 12,000</span>
    </div>
  </div>
  <span class="fts-band fts-bottom"></span>
</div>
</body>
</html>
