<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glassmorphism UI Jello-Hover Tabs | EaseMotion CSS</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="ease-center ease-fade-in" style="min-height: 100vh; background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%); font-family: 'Inter', sans-serif; padding: 2rem;">

  <div class="tabs-container">
    <header class="tabs-header ease-slide-up">
      <h1 class="ease-fade-in">Glassmorphism UI</h1>
      <p class="ease-slide-up ease-delay-100">Pure CSS interactive tabs featuring a smooth jello-hover transition with frosted glass effects.</p>
    </header>

    <!-- Tabs Wrapper -->
    <div class="ease-tabs-glass-ak ease-slide-up ease-delay-200">
      <div class="tabs-list" role="tablist">
        <button role="tab" aria-selected="true" class="tab-btn active">Frosted Panels</button>
        <button role="tab" aria-selected="false" class="tab-btn">Blur Layers</button>
        <button role="tab" aria-selected="false" class="tab-btn">Gradients</button>
      </div>
      <div class="tabs-panels">
        <div role="tabpanel" class="tab-panel active">
          <h3>Frosted Glass Aesthetics</h3>
          <p>Immersive translucency paired with zero-JS spring micro-interactions for modern layouts.</p>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
