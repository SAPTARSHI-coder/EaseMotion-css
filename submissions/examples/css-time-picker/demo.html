<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CSS Time Picker</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<main class="container">

<h1>CSS Time Picker</h1>


<div class="time-picker" role="group" aria-label="Time picker">


<div class="column">

<h2>Hour</h2>

<div class="scroll">

<span>10</span>
<span class="active">11</span>
<span>12</span>
<span>01</span>
<span>02</span>

</div>

</div>



<div class="separator">
:
</div>



<div class="column">

<h2>Minute</h2>

<div class="scroll">

<span>15</span>
<span class="active">30</span>
<span>45</span>
<span>00</span>
<span>10</span>

</div>

</div>


</div>


<button class="confirm">
Confirm Time
</button>


</main>


</body>

</html>
