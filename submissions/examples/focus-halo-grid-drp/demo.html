<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Focus Halo Grid</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="shell" aria-labelledby="title">
    <section class="card">
      <p class="eyebrow">focus</p>
      <h1 id="title">Focus Halo Grid</h1>
      <p class="summary">A CSS-only grid with a shifting halo, keyed focus tiles, and a layered scan line.</p>
      <div class="stage" role="img" aria-label="Animated Focus Halo Grid">
        <div class="grid">
          <div class="halo"></div>
          <div class="cell">Alpha</div>
          <div class="cell active">Beta</div>
          <div class="cell">Gamma</div>
          <div class="cell">Delta</div>
        </div>
        <article class="tile"><strong>01</strong><span>Shifting halo</span></article>
        <article class="tile"><strong>02</strong><span>Keyed focus tile</span></article>
        <article class="tile"><strong>03</strong><span>Layered scan line</span></article>
        <article class="tile"><strong>04</strong><span>Reduced-motion friendly</span></article>
      </div>
      <div class="tags" aria-label="Focus Halo Grid features">
        <span>Shifting halo</span>
        <span>Keyed focus tile</span>
        <span>Layered scan line</span>
        <span>Reduced-motion friendly</span>
      </div>
    </section>
  </main>
</body>
</html>
