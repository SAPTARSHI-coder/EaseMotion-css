<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS CSS Variable Theming System - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="em-theme-page">
        <!-- Hidden radio inputs controlling multi-theme state via CSS sibling selectors -->
        <input type="radio" name="em-theme" id="theme-indigo" class="em-sr-only" checked>
        <input type="radio" name="em-theme" id="theme-emerald" class="em-sr-only">
        <input type="radio" name="em-theme" id="theme-amber" class="em-sr-only">

        <div class="em-card" role="region" aria-label="CSS Variable Theming System Showcase">
            <span class="em-card-badge">MULTI-THEME SYSTEM</span>
            <h1 class="em-card-title">CSS Variable Theming</h1>
            <p class="em-card-desc">Dynamic multi-theme switching powered entirely by CSS custom properties and radio inputs without JavaScript.</p>
            
            <!-- Theme Selection Switcher Group -->
            <div class="em-theme-switcher" role="radiogroup" aria-label="Select Theme">
                <label for="theme-indigo" class="em-theme-btn em-btn-indigo" tabindex="0">Indigo</label>
                <label for="theme-emerald" class="em-theme-btn em-btn-emerald" tabindex="0">Emerald</label>
                <label for="theme-amber" class="em-theme-btn em-btn-amber" tabindex="0">Amber</label>
            </div>

            <div class="em-card-footer">
                <span class="em-footer-tag">Pure CSS Theming</span>
            </div>
        </div>
    </div>
</body>
</html>
