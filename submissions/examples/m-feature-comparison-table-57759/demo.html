<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feature Comparison Table</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<section class="comparison">

    <div class="heading">
        <h1>Feature Comparison</h1>
        <p>Compare pricing plans and choose the best option.</p>
    </div>

    <div class="table-wrapper">

        <table>

            <thead>

                <tr>
                    <th>Features</th>
                    <th>Starter</th>
                    <th class="popular">
                        Pro

                    </th>
                    <th>Enterprise</th>
                </tr>

            </thead>

            <tbody>

                <tr>
                    <td>Projects</td>
                    <td>5</td>
                    <td>Unlimited</td>
                    <td>Unlimited</td>
                </tr>

                <tr>
                    <td>Storage</td>
                    <td>10 GB</td>
                    <td>100 GB</td>
                    <td>1 TB</td>
                </tr>

                <tr>
                    <td>Analytics</td>
                    <td>✓</td>
                    <td>✓</td>
                    <td>✓</td>
                </tr>

                <tr>
                    <td>Priority Support</td>
                    <td>—</td>
                    <td>✓</td>
                    <td>✓</td>
                </tr>

                <tr>
                    <td>Custom Branding</td>
                    <td>—</td>
                    <td>✓</td>
                    <td>✓</td>
                </tr>

                <tr>
                    <td>Dedicated Manager</td>
                    <td>—</td>
                    <td>—</td>
                    <td>✓</td>
                </tr>

            </tbody>

        </table>

    </div>

</section>

</body>
</html>
