<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Responsive glowing badge with glassmorphism styling using pure HTML and CSS."
    >

    <title>Glowing Glassmorphism Badge</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="page">

        <section class="demo-card" aria-labelledby="badge-title">

            <p class="eyebrow">STATUS COMPONENT</p>

            <h1 id="badge-title">Glowing Glass Badge</h1>

            <p class="description">
                A modern glassmorphism badge with a subtle animated glow.
            </p>

            <div class="badge-container">

                <span
                    class="glow-badge"
                    role="status"
                    aria-label="System online"
                >
                    <span class="badge-indicator" aria-hidden="true"></span>
                    <span class="badge-text">System Online</span>
                </span>

            </div>

        </section>

    </main>

</body>
</html>
