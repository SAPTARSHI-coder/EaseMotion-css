<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Scroll-triggered Counter - EaseMotion</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="stc" aria-label="Scroll-triggered counter">
      <span class="stc-num" data-target="1284" aria-hidden="true">1284</span>
      <span class="stc-label">Total Revisions</span>
      <p class="stc-note">
        Counter animates when the section enters view (scroll-driven demo).
      </p>
    </div>
  </body>
</html>
