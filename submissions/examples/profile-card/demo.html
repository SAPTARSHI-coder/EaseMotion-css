<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile Card</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="demo-shell">
      <section class="profile-card" aria-labelledby="prc-name">
        <div class="profile-card__avatar-ring">
          <span class="profile-card__avatar" aria-hidden="true">AK</span>
        </div>
        <h1 id="prc-name">Ava Kapoor</h1>
        <p class="profile-card__role">Frontend Engineer</p>
        <p class="profile-card__bio">
          Building calm, accessible interfaces with a love for CSS and design
          systems.
        </p>
        <ul class="profile-card__skills" aria-label="Skills">
          <li>React</li>
          <li>TypeScript</li>
          <li>CSS</li>
          <li>a11y</li>
        </ul>
        <div class="profile-card__actions">
          <button type="button" class="profile-card__cta">Follow</button>
          <button type="button" class="profile-card__ghost">Message</button>
        </div>
      </section>
    </main>
  </body>
</html>
