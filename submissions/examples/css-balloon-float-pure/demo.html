<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Balloon Float</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="layout-container">
        
        <header class="section-header">
            <h1 class="title">Pure CSS Floating Balloon</h1>
            <p class="subtitle">A realistic balloon shape crafted using advanced CSS border-radius manipulation, featuring continuous swaying and floating keyframe animations.</p>
        </header>

        <div class="demo-area">
            
            <div class="sky-container" aria-label="A sky background with a floating red balloon">
                
                <!-- 
                  [TECHNIQUE] The Balloon Group
                  We separate the animations: the entire group floats slowly up and down,
                  while the balloon body itself sways side to side.
                -->
                <div class="balloon-group">
                    
                    <div class="balloon">
                        <!-- The shine effect -->
                        <div class="balloon-shine"></div>
                        <!-- The tied knot at the bottom -->
                        <div class="balloon-knot"></div>
                    </div>
                    
                    <!-- The dangling string -->
                    <div class="balloon-string"></div>
                    
                </div>
                
            </div>
            
        </div>
        
    </div>

</body>
</html>
