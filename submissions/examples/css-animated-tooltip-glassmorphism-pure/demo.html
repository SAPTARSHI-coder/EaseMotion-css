<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Tooltip: Glassmorphism</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- A vibrant background to showcase the glassmorphism blur effect -->
    <div class="background-showcase">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        
        <header class="header">
            <h1 class="title">Glass Tooltip</h1>
            <p>Hover over the button to see the animated glassmorphism effect.</p>
        </header>

        <main class="content-area">
            
            <!-- The Tooltip Wrapper -->
            <div class="glass-tooltip-wrapper" tabindex="0">
                
                <!-- The Trigger Button -->
                <button class="trigger-btn">Hover Me</button>
                
                <!-- The Tooltip Content -->
                <div class="glass-tooltip" role="tooltip">
                    <strong>Information</strong>
                    <p>This is a pure CSS animated tooltip featuring a beautiful frosted glass aesthetic.</p>
                </div>
                
            </div>
            
        </main>
    </div>

</body>
</html>
