<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Pure CSS Skew-Active Progress Bar for Minimalist Tech layouts"
  >
  <title>Skew-Active Progress Bar</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="showcase">
    <header class="hero">
      <p class="eyebrow">EASEMOTION CSS</p>
      <h1>Skew-Active Progress</h1>
      <p class="subtitle">
        A minimalist technology progress component featuring a dynamic
        skewed active indicator and smooth CSS motion.
      </p>
    </header>

    <section class="progress-panel" aria-label="Project progress">
      <div class="progress-heading">
        <div>
          <span class="label">PROJECT STATUS</span>
          <h2>System Deployment</h2>
        </div>

        <strong>72%</strong>
      </div>

      <div
        class="progress-track"
        role="progressbar"
        aria-valuenow="72"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-label="System deployment: 72 percent"
      >
        <span class="progress-fill">
          <span class="skew-highlight"></span>
        </span>
      </div>

      <div class="progress-meta">
        <span>IN PROGRESS</span>
        <span>72 / 100</span>
      </div>
    </section>

    <section class="metrics" aria-label="System metrics">
      <article class="metric">
        <div class="metric-header">
          <span>FRONTEND</span>
          <strong>88%</strong>
        </div>

        <div
          class="progress-track small"
          role="progressbar"
          aria-valuenow="88"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-label="Frontend: 88 percent"
        >
          <span class="progress-fill fill-88">
            <span class="skew-highlight"></span>
          </span>
        </div>
      </article>

      <article class="metric">
        <div class="metric-header">
          <span>BACKEND</span>
          <strong>67%</strong>
        </div>

        <div
          class="progress-track small"
          role="progressbar"
          aria-valuenow="67"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-label="Backend: 67 percent"
        >
          <span class="progress-fill fill-67">
            <span class="skew-highlight"></span>
          </span>
        </div>
      </article>

      <article class="metric">
        <div class="metric-header">
          <span>DATABASE</span>
          <strong>81%</strong>
        </div>

        <div
          class="progress-track small"
          role="progressbar"
          aria-valuenow="81"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-label="Database: 81 percent"
        >
          <span class="progress-fill fill-81">
            <span class="skew-highlight"></span>
          </span>
        </div>
      </article>
    </section>
  </main>
</body>
</html>
