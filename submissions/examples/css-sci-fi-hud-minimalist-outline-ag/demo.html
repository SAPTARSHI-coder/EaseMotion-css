<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Sci-Fi HUD: Minimalist Outline</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <main class="hud-outline-container" role="region" aria-label="System Analysis">
    
    <!-- Decorative Accents -->
    <div class="accent-line-top" aria-hidden="true"></div>
    <div class="accent-corner" aria-hidden="true"></div>

    <header class="hud-header">
      <div>
        <h2 class="hud-title">Orbital Trajectory</h2>
        <div class="hud-value-large">28.04<span style="font-size:1.2rem; color:var(--text-dim)">k/s</span></div>
      </div>
      <div class="hud-status-badge" aria-live="polite">Tracking</div>
    </header>

    <!-- Scanning Graph -->
    <div class="hud-graph" aria-hidden="true">
      <div class="graph-bar"></div>
      <div class="graph-bar"></div>
      <div class="graph-bar"></div>
      <div class="graph-bar"></div>
      <div class="graph-bar"></div>
      <div class="graph-bar"></div>
      <div class="graph-bar"></div>
      <div class="graph-bar"></div>
    </div>

    <!-- Data List -->
    <div class="hud-data-list">
      <div class="data-item">
        <span class="data-item-label">Altitude</span>
        <span class="data-item-value">408 KM</span>
      </div>
      <div class="data-item">
        <span class="data-item-label">Inclination</span>
        <span class="data-item-value">51.64 DEG</span>
      </div>
      <div class="data-item alert">
        <span class="data-item-label">Heat Shield</span>
        <span class="data-item-value" aria-live="assertive">WARNING</span>
      </div>
    </div>

  </main>

</body>
</html>
