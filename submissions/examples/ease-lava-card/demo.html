<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lava Card · Glowing Lava Cracks</title>

    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <div class="card">
        <h2>🌋 Lava Card</h2>
        <p class="sub">glowing lava cracks spread across surface</p>

        <!-- === LAVA CARD === -->
        <div class="lava-container" id="lavaContainer">
            <div class="lava-card">
                <div class="lava-content">
                    <i class="fas fa-fire"></i>
                    <h3>Eruption</h3>
                    <p>Hover to see lava spread</p>
                    <span class="lava-temp">🔥 1200°C</span>
                </div>
                <div class="lava-cracks">
                    <div class="crack crack-1"></div>
                    <div class="crack crack-2"></div>
                    <div class="crack crack-3"></div>
                    <div class="crack crack-4"></div>
                    <div class="crack crack-5"></div>
                    <div class="crack crack-6"></div>
                    <div class="crack crack-7"></div>
                    <div class="crack crack-8"></div>
                    <div class="crack crack-9"></div>
                    <div class="crack crack-10"></div>
                    <div class="crack crack-11"></div>
                    <div class="crack crack-12"></div>
                    <div class="crack crack-13"></div>
                    <div class="crack crack-14"></div>
                    <div class="crack crack-15"></div>
                </div>
                <div class="lava-glow"></div>
            </div>
        </div>

        <p style="margin-top: 2rem; font-size: 0.85rem; color: #64748b;">
            Hover · watch the lava cracks spread and glow
        </p>
    </div>

    <!-- Embedded JavaScript -->
    <script>
        (function() {
            'use strict';

            const container = document.getElementById('lavaContainer');

            // Click feedback
            container.addEventListener('click', function() {
                const card = this.querySelector('.lava-card');
                card.classList.add('click-pulse');
                setTimeout(() => {
                    card.classList.remove('click-pulse');
                }, 300);
                console.log('🌋 Lava card erupted!');
            });

            // Keyboard accessibility
            container.setAttribute('tabindex', '0');
            container.setAttribute('role', 'button');
            container.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    this.click();
                }
            });

            // Reset animation on hover
            container.addEventListener('mouseenter', function() {
                const cracks = this.querySelectorAll('.crack');
                cracks.forEach(c => {
                    c.style.animation = 'none';
                    void c.offsetWidth;
                    c.style.animation = '';
                });
                const glow = this.querySelector('.lava-glow');
                glow.style.animation = 'none';
                void glow.offsetWidth;
                glow.style.animation = '';
            });

            console.log('🌋 Lava card initialized!');

        })();
    </script>

</body>
</html>
