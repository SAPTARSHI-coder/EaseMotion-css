<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hover Modal</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="page">
      <button class="trigger" type="button" aria-describedby="preview">Hover for preview</button>
      <section class="modal" id="preview" aria-label="Preview dialog">
        <p class="eyebrow">EaseMotion CSS · Issue #78650</p>
        <h1>Project preview</h1>
        <p>This dark-mode panel reveals itself through a smooth hover and focus interaction.</p>
        <div class="actions">
          <a href="#details">View details</a>
          <button type="button">Close</button>
        </div>
      </section>
    </main>
  </body>
</html>
