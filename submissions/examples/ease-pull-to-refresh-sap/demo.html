<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ease-pull-to-refresh-sap demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f4f4f5;
    }
  </style>
</head>
<body>

  <div class="pull-refresh-sap" id="scrollArea">
    <div class="refresh-indicator" id="indicator">
      <div class="spinner" id="spinner"></div>
    </div>
    <div id="listBody"></div>
  </div>

  <script>
    const area = document.getElementById('scrollArea');
    const indicator = document.getElementById('indicator');
    const spinner = document.getElementById('spinner');
    const listBody = document.getElementById('listBody');

    function renderItems(count) {
      listBody.innerHTML = '';
      for (let i = 1; i <= count; i++) {
        const div = document.createElement('div');
        div.className = 'list-item';
        div.textContent = `Item ${i}`;
        listBody.appendChild(div);
      }
    }
    renderItems(15);

    let startY = 0;
    let pulling = false;
    const threshold = 70;

    area.addEventListener('touchstart', (e) => {
      if (area.scrollTop === 0) {
        startY = e.touches[0].clientY;
        pulling = true;
      }
    }, { passive: true });

    area.addEventListener('touchmove', (e) => {
      if (!pulling) return;
      const dist = e.touches[0].clientY - startY;
      if (dist > 0) {
        indicator.classList.add('pulling');
        const rot = Math.min(dist * 3, 360);
        spinner.style.setProperty('--rot', rot + 'deg');
      }
    }, { passive: true });

    area.addEventListener('touchend', (e) => {
      if (!pulling) return;
      pulling = false;
      const dist = e.changedTouches[0].clientY - startY;
      indicator.classList.remove('pulling');

      if (dist > threshold) {
        indicator.classList.add('refreshing');
        setTimeout(() => {
          indicator.classList.remove('refreshing');
          renderItems(15);
        }, 1200);
      }
    });
  </script>

</body>
</html>
