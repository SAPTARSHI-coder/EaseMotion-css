<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Responsive 3D neon pagination component built with HTML and CSS."
  >

  <title>3D Neon Pagination | EaseMotion CSS</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="page">
    <div class="background-grid" aria-hidden="true"></div>

    <section class="demo-card">
      <span class="eyebrow">EaseMotion CSS</span>

      <h1>3D Neon Pagination</h1>

      <p class="description">
        A responsive pagination component with layered 3D depth,
        glowing neon accents, and interactive page controls.
      </p>

      <nav
        class="pagination"
        aria-label="Pagination navigation"
      >
        <a
          class="pagination__control pagination__control--disabled"
          href="#"
          aria-label="Previous page"
          aria-disabled="true"
        >
          <span aria-hidden="true">‹</span>
          <span>PREV</span>
        </a>

        <div class="pagination__pages">
          <a class="pagination__page" href="#page-1">1</a>

          <a
            class="pagination__page pagination__page--active"
            href="#page-2"
            aria-current="page"
          >
            2
          </a>

          <a class="pagination__page" href="#page-3">3</a>

          <a class="pagination__page" href="#page-4">4</a>

          <span class="pagination__ellipsis" aria-hidden="true">
            ...
          </span>

          <a class="pagination__page" href="#page-12">12</a>
        </div>

        <a
          class="pagination__control"
          href="#page-3"
          aria-label="Next page"
        >
          <span>NEXT</span>
          <span aria-hidden="true">›</span>
        </a>
      </nav>

      <div class="pagination__status">
        <span class="status-dot"></span>
        PAGE 02 / 12
      </div>
    </section>
  </main>
</body>
</html>
