<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="A dependency-free animated skill bar component built with HTML and CSS."
  >

  <title>Skill Bar</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="demo">
    <section class="skill-card" aria-labelledby="skill-title">
      <header class="skill-header">
        <p class="eyebrow">PROGRESS / SKILLS</p>

        <h1 id="skill-title">Skill Bar</h1>

        <p class="intro">
          Stacked skill bars with animated fills that expand on hover.
        </p>
      </header>

      <div class="skills" aria-label="Skills and proficiency levels">
        <div class="skill" style="--level: 92%;">
          <div class="skill__top">
            <span class="skill__name">HTML</span>
            <span class="skill__percent">92%</span>
          </div>

          <div
            class="skill__track"
            role="progressbar"
            aria-label="HTML skill level"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="92"
          >
            <span class="skill__fill"></span>
          </div>
        </div>

        <div class="skill" style="--level: 86%;">
          <div class="skill__top">
            <span class="skill__name">CSS</span>
            <span class="skill__percent">86%</span>
          </div>

          <div
            class="skill__track"
            role="progressbar"
            aria-label="CSS skill level"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="86"
          >
            <span class="skill__fill"></span>
          </div>
        </div>

        <div class="skill" style="--level: 78%;">
          <div class="skill__top">
            <span class="skill__name">JavaScript</span>
            <span class="skill__percent">78%</span>
          </div>

          <div
            class="skill__track"
            role="progressbar"
            aria-label="JavaScript skill level"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="78"
          >
            <span class="skill__fill"></span>
          </div>
        </div>

        <div class="skill" style="--level: 68%;">
          <div class="skill__top">
            <span class="skill__name">Accessibility</span>
            <span class="skill__percent">68%</span>
          </div>

          <div
            class="skill__track"
            role="progressbar"
            aria-label="Accessibility skill level"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="68"
          >
            <span class="skill__fill"></span>
          </div>
        </div>
      </div>

      <footer class="skill-footer">
        <span>HOVER TO EXPAND</span>
        <span>PURE HTML + CSS</span>
      </footer>
    </section>
  </main>
</body>
</html>
