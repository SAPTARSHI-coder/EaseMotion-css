<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="./style.css">
<title>cassette-tape-m7k demo</title>
</head>
<body>
<div class="cst-deck">
  <span class="cst-title">AUDIO CASSETTE</span>
  <div class="cst-body">
    <div class="cst-window">
      <div class="cst-spool cst-spool-left">
        <div class="cst-spoke"></div>
      </div>
      <div class="cst-tape"></div>
      <div class="cst-spool cst-spool-right">
        <div class="cst-spoke"></div>
      </div>
    </div>
    <div class="cst-label">
      <span class="cst-side">SIDE A</span>
    </div>
  </div>
  <span class="cst-status">PLAYING</span>
</div>
</body>
</html>
