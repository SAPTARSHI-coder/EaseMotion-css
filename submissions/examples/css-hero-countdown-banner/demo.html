<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>CSS Hero Countdown Banner</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main>
    <section class="countdown-hero" aria-labelledby="countdown-title">

      <div class="hero-glow hero-glow-one" aria-hidden="true"></div>
      <div class="hero-glow hero-glow-two" aria-hidden="true"></div>

      <div class="countdown-content">

        <p class="countdown-label">✦ COMING SOON ✦</p>

        <h1 id="countdown-title">
          The Next Big Thing<br>
          Is Almost Here
        </h1>

        <p class="countdown-description">
          Get ready for an exciting new experience.
          The countdown has officially begun.
        </p>

        <div
          class="countdown"
          aria-label="Countdown timer showing 12 days, 8 hours, 42 minutes and 19 seconds"
        >

          <div class="countdown-unit">
            <span class="countdown-value">12</span>
            <span class="countdown-name">Days</span>
          </div>

          <span class="countdown-separator" aria-hidden="true">:</span>

          <div class="countdown-unit">
            <span class="countdown-value">08</span>
            <span class="countdown-name">Hours</span>
          </div>

          <span class="countdown-separator" aria-hidden="true">:</span>

          <div class="countdown-unit">
            <span class="countdown-value">42</span>
            <span class="countdown-name">Minutes</span>
          </div>

          <span class="countdown-separator" aria-hidden="true">:</span>

          <div class="countdown-unit">
            <span class="countdown-value">19</span>
            <span class="countdown-name">Seconds</span>
          </div>

        </div>

        <div class="hero-actions">
          <a class="hero-button" href="#details">
            Learn More
            <span aria-hidden="true">→</span>
          </a>
        </div>

      </div>
    </section>

    <section class="details" id="details">
      <p>CSS-only hero countdown banner demonstration.</p>
    </section>
  </main>

</body>
</html>
