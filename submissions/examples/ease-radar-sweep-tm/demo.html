<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Radar Sweep Animation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section class="radar-section">

    <div style="text-align:center">
      <div class="radar green">
        <div class="radar-sweep"></div>
        <div class="radar-ring radar-ring-1"></div>
        <div class="radar-ring radar-ring-2"></div>
        <div class="radar-ring radar-ring-3"></div>
        <div class="radar-cross"></div>
        <div class="radar-cross radar-cross-v"></div>
        <div class="radar-blip radar-dot-1"></div>
        <div class="radar-blip radar-dot-2"></div>
        <div class="radar-blip radar-dot-3"></div>
        <div class="radar-blip radar-dot-4"></div>
      </div>
      <p class="radar-label">Green radar (4s cycle)</p>
    </div>

    <div style="text-align:center">
      <div class="radar blue">
        <div class="radar-sweep"></div>
        <div class="radar-ring radar-ring-1"></div>
        <div class="radar-ring radar-ring-2"></div>
        <div class="radar-ring radar-ring-3"></div>
        <div class="radar-cross"></div>
        <div class="radar-cross radar-cross-v"></div>
        <div class="radar-blip radar-dot-1"></div>
        <div class="radar-blip radar-dot-2"></div>
        <div class="radar-blip radar-dot-3"></div>
        <div class="radar-blip radar-dot-4"></div>
      </div>
      <p class="radar-label">Blue radar variant</p>
    </div>

    <div style="text-align:center">
      <div class="radar purple fast">
        <div class="radar-sweep"></div>
        <div class="radar-ring radar-ring-1"></div>
        <div class="radar-ring radar-ring-2"></div>
        <div class="radar-ring radar-ring-3"></div>
        <div class="radar-cross"></div>
        <div class="radar-cross radar-cross-v"></div>
        <div class="radar-blip radar-dot-1"></div>
        <div class="radar-blip radar-dot-2"></div>
        <div class="radar-blip radar-dot-3"></div>
        <div class="radar-blip radar-dot-4"></div>
      </div>
      <p class="radar-label">Purple fast (2s cycle)</p>
    </div>

  </section>
</body>
</html>
