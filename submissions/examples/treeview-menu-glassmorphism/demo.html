<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EaseMotion - Glassmorphism Glowing Treeview</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Decorative Background Elements for Glass Effect -->
  <div class="em-bg-shape em-bg-shape-1"></div>
  <div class="em-bg-shape em-bg-shape-2"></div>

  <main class="em-container">
    <nav class="em-glass-panel" aria-label="Media Library">
      <h2 class="em-glass-title">Media Library</h2>
      
      <!-- Pure CSS Glassmorphism Treeview -->
      <ul class="em-treeview">
        
        <!-- Node 1 -->
        <li class="em-treeview-node">
          <input type="checkbox" id="glass-images" class="em-treeview-toggle" aria-hidden="true" />
          <label for="glass-images" class="em-treeview-label" tabindex="0" role="button" aria-expanded="false">
            <span class="em-treeview-icon"></span>
            <span class="em-treeview-text">Images</span>
          </label>
          <div class="em-treeview-sub-container">
            <ul class="em-treeview-sub">
              <li class="em-treeview-leaf">
                <a href="#" class="em-treeview-link">
                  <span class="em-treeview-text">backgrounds.zip</span>
                </a>
              </li>
              <li class="em-treeview-leaf">
                <a href="#" class="em-treeview-link">
                  <span class="em-treeview-text">profile_pic.png</span>
                </a>
              </li>
            </ul>
          </div>
        </li>

        <!-- Node 2 -->
        <li class="em-treeview-node">
          <input type="checkbox" id="glass-projects" class="em-treeview-toggle" aria-hidden="true" />
          <label for="glass-projects" class="em-treeview-label" tabindex="0" role="button" aria-expanded="false">
            <span class="em-treeview-icon"></span>
            <span class="em-treeview-text">Projects</span>
          </label>
          <div class="em-treeview-sub-container">
            <ul class="em-treeview-sub">
              <li class="em-treeview-leaf">
                <a href="#" class="em-treeview-link">
                  <span class="em-treeview-text">Concept_Art.psd</span>
                </a>
              </li>
              
              <!-- Nested Node -->
              <li class="em-treeview-node">
                <input type="checkbox" id="glass-video" class="em-treeview-toggle" aria-hidden="true" />
                <label for="glass-video" class="em-treeview-label" tabindex="0" role="button" aria-expanded="false">
                  <span class="em-treeview-icon"></span>
                  <span class="em-treeview-text">Video Assets</span>
                </label>
                <div class="em-treeview-sub-container">
                  <ul class="em-treeview-sub">
                    <li class="em-treeview-leaf">
                      <a href="#" class="em-treeview-link">
                        <span class="em-treeview-text">intro_sequence.mp4</span>
                      </a>
                    </li>
                    <li class="em-treeview-leaf">
                      <a href="#" class="em-treeview-link">
                        <span class="em-treeview-text">b-roll_01.mov</span>
                      </a>
                    </li>
                  </ul>
                </div>
              </li>
              
            </ul>
          </div>
        </li>
        
        <!-- Leaf (Direct link at root level) -->
        <li class="em-treeview-leaf">
          <a href="#" class="em-treeview-link em-treeview-label-root">
            <span class="em-treeview-icon-empty"></span>
            <span class="em-treeview-text">readme.md</span>
          </a>
        </li>
        
      </ul>
    </nav>
  </main>
</body>
</html>
