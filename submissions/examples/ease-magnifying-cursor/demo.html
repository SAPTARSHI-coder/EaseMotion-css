<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Magnifying Cursor · Magnify Content</title>

    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <!-- === MAGNIFYING CURSOR === -->
    <div class="magnifier" id="magnifier">
        <div class="magnifier-lens" id="magnifierLens">
            <canvas id="magnifierCanvas"></canvas>
        </div>
    </div>

    <!-- === CONTENT === -->
    <div class="card">
        <h2>🔍 Magnifying Cursor</h2>
        <p class="sub">magnifies content beneath it</p>

        <div class="magnifier-demo-area">
            <p>Move your mouse around</p>
            <div class="interactive-hint">
                <i class="fas fa-mouse-pointer"></i>
                <span>Watch the magnification</span>
            </div>
            <div class="demo-grid">
                <div class="grid-item" style="background: #4facfe;">🔵</div>
                <div class="grid-item" style="background: #43e97b;">🟢</div>
                <div class="grid-item" style="background: #fa709a;">🩷</div>
                <div class="grid-item" style="background: #a18cd1;">🟣</div>
                <div class="grid-item" style="background: #fbc2eb;">🌸</div>
                <div class="grid-item" style="background: #fee140;">⭐</div>
                <div class="grid-item" style="background: #4facfe;">🔵</div>
                <div class="grid-item" style="background: #43e97b;">🟢</div>
                <div class="grid-item" style="background: #fa709a;">🩷</div>
            </div>
            <div class="demo-text">
                <p>🔍 Hover over the grid to magnify</p>
                <p class="small">The magnifier follows your cursor</p>
            </div>
        </div>

        <p style="margin-top: 1.5rem; font-size: 0.85rem; color: #64748b;">
            Move your mouse · watch the content magnify beneath
        </p>
    </div>

    <!-- Embedded JavaScript -->
    <script>
        (function() {
            'use strict';

            const magnifier = document.getElementById('magnifier');
            const lens = document.getElementById('magnifierLens');
            const canvas = document.getElementById('magnifierCanvas');
            const ctx = canvas.getContext('2d');

            const magnifierSize = 120;
            const magnifyFactor = 2.5;
            let mouseX = 0;
            let mouseY = 0;
            let isVisible = false;

            // --- Setup canvas ---
            canvas.width = magnifierSize;
            canvas.height = magnifierSize;
            lens.style.width = magnifierSize + 'px';
            lens.style.height = magnifierSize + 'px';

            // --- Magnify function ---
            function magnify(x, y) {
                const scale = magnifyFactor;
                const size = magnifierSize;

                // Calculate source region
                const srcX = x - size / (2 * scale);
                const srcY = y - size / (2 * scale);
                const srcSize = size / scale;

                // Clear canvas
                ctx.clearRect(0, 0, size, size);

                // Draw magnified content
                ctx.save();
                ctx.beginPath();
                ctx.arc(size / 2, size / 2, size / 2, 0, Math.PI * 2);
                ctx.clip();

                // Draw the magnified portion
                ctx.drawImage(
                    document.documentElement,
                    srcX, srcY, srcSize, srcSize,
                    0, 0, size, size
                );

                // Add a subtle glow effect
                const gradient = ctx.createRadialGradient(
                    size / 2, size / 2, size * 0.2,
                    size / 2, size / 2, size / 2
                );
                gradient.addColorStop(0, 'rgba(255,255,255,0)');
                gradient.addColorStop(0.7, 'rgba(255,255,255,0)');
                gradient.addColorStop(1, 'rgba(255,255,255,0.05)');
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, size, size);

                ctx.restore();

                // Draw border ring
                ctx.beginPath();
                ctx.arc(size / 2, size / 2, size / 2 - 1, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(255,255,255,0.15)';
                ctx.lineWidth = 2;
                ctx.stroke();

                // Draw crosshair
                ctx.beginPath();
                ctx.moveTo(size / 2 - 12, size / 2);
                ctx.lineTo(size / 2 + 12, size / 2);
                ctx.moveTo(size / 2, size / 2 - 12);
                ctx.lineTo(size / 2, size / 2 + 12);
                ctx.strokeStyle = 'rgba(255,255,255,0.2)';
                ctx.lineWidth = 1;
                ctx.stroke();

                // Draw outer glow ring
                ctx.beginPath();
                ctx.arc(size / 2, size / 2, size / 2 + 4, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(79, 172, 254, 0.08)';
                ctx.lineWidth = 8;
                ctx.stroke();
            }

            // --- Update magnifier position ---
            function updateMagnifier(x, y) {
                mouseX = x;
                mouseY = y;

                const halfSize = magnifierSize / 2;
                const offsetX = 20;
                const offsetY = 20;

                // Position the magnifier
                let posX = x + offsetX;
                let posY = y + offsetY;

                // Keep within viewport
                if (posX + magnifierSize > window.innerWidth) {
                    posX = x - magnifierSize - offsetX;
                }
                if (posY + magnifierSize > window.innerHeight) {
                    posY = y - magnifierSize - offsetY;
                }

                lens.style.left = posX + 'px';
                lens.style.top = posY + 'px';

                // Magnify
                magnify(x, y);
            }

            // --- Mouse move ---
            document.addEventListener('mousemove', function(e) {
                isVisible = true;
                magnifier.style.display = 'block';
                updateMagnifier(e.clientX, e.clientY);
            });

            // --- Touch support ---
            document.addEventListener('touchmove', function(e) {
                e.preventDefault();
                const touch = e.touches[0];
                isVisible = true;
                magnifier.style.display = 'block';
                updateMagnifier(touch.clientX, touch.clientY);
            }, { passive: false });

            document.addEventListener('touchstart', function(e) {
                const touch = e.touches[0];
                isVisible = true;
                magnifier.style.display = 'block';
                updateMagnifier(touch.clientX, touch.clientY);
            });

            // --- Mouse leave ---
            document.addEventListener('mouseleave', function() {
                isVisible = false;
                magnifier.style.display = 'none';
            });

            // --- Mouse enter ---
            document.addEventListener('mouseenter', function() {
                isVisible = true;
                magnifier.style.display = 'block';
            });

            // --- Click feedback ---
            document.addEventListener('click', function(e) {
                // Flash effect on click
                lens.classList.add('click-flash');
                setTimeout(() => {
                    lens.classList.remove('click-flash');
                }, 200);
                console.log('🔍 Magnified click!');
            });

            // --- Resize ---
            window.addEventListener('resize', function() {
                if (isVisible) {
                    updateMagnifier(mouseX, mouseY);
                }
            });

            console.log('🔍 Magnifying cursor initialized!');

        })();
    </script>

</body>
</html>
