<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Badge Focus Visible</title>
<link rel="stylesheet" href="style.css">

<style>
body{
    font-family:Arial,sans-serif;
    padding:40px;
    background:#f5f7fb;
}

.demo{
    display:flex;
    gap:1rem;
}

.ease-badge{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    height:20px;
    padding:0 .6rem;
    border:none;
    border-radius:9999px;
    background:#6c63ff;
    color:#fff;
    cursor:pointer;
}

.ease-badge-success{
    background:#22c55e;
}

.ease-badge-danger{
    background:#ef4444;
}
</style>
</head>

<body>

<h2>Badge Focus Demo</h2>

<div class="demo">
<button class="ease-badge">Default</button>
<button class="ease-badge ease-badge-success">Success</button>
<button class="ease-badge ease-badge-danger">Danger</button>
</div>

</body>
</html>
