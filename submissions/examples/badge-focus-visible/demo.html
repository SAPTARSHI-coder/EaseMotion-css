<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Badge Focus Visible Demo</title>

  <link rel="stylesheet" href="style.css">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      padding: 40px;
    }

    .demo {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      align-items: center;
    }

    .ease-badge,
    .em-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 0.5rem;
      height: 20px;
      min-width: 20px;
      border-radius: 9999px;
      border: none;
      background: #6c63ff;
      color: #fff;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
    }

    .ease-badge-danger {
      background: #ef4444;
    }

    .ease-badge-success {
      background: #22c55e;
    }
  </style>
</head>
<body>

<h2>Badge Focus Visible Demo</h2>

<p>Press <strong>Tab</strong> to focus each badge.</p>

<div class="demo">
  <button class="ease-badge">Default</button>
  <button class="ease-badge ease-badge-success">Success</button>
  <button class="ease-badge ease-badge-danger">Danger</button>
</div>

</body>
</html>
