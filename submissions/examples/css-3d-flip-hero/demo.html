<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CSS 3D Flip Hero animation demo">
  <title>CSS 3D Flip Hero</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="hero">
    <div class="hero__content">
      <p class="hero__eyebrow">Pure CSS Animation</p>

      <h1 class="hero__title">
        Experience the <span>3D Flip Hero</span>
      </h1>

      <p class="hero__description">
        A responsive hero section that smoothly flips into view
        using CSS 3D transforms and animations.
      </p>

      <div class="hero__actions">
        <a href="#explore" class="hero__button">Explore</a>
        <a href="#learn" class="hero__link">Learn More →</a>
      </div>
    </div>

    <div class="hero__visual" aria-hidden="true">
      <div class="hero-card">
        <div class="hero-card__front">
          <span class="hero-card__badge">CSS</span>
          <h2>3D Motion</h2>
          <p>Flip into the future.</p>
        </div>

        <div class="hero-card__back">
          <span class="hero-card__icon">✦</span>
          <h2>Pure CSS</h2>
          <p>No JavaScript required.</p>
        </div>
      </div>
    </div>
  </main>

</body>
</html>
