<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animated Button - EaseMotion CSS Submission</title>
  
  <!-- EaseMotion CSS (Official CDN) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css">
  
  <!-- Local Button Component Styles -->
  <link rel="stylesheet" href="style.css">
  
  <style>
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: var(--ease-color-bg, #f8fafc);
      color: var(--ease-color-text, #0f172a);
      margin: 0;
      padding: 2rem;
      gap: 3rem;
    }
    .demo-container {
      width: 100%;
      max-width: 900px;
    }
    .demo-section {
      margin-bottom: 3rem;
    }
    .demo-title {
      font-size: 1.125rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
      color: var(--ease-color-text, #0f172a);
    }
    .demo-card {
      background-color: var(--ease-color-surface, #ffffff);
      border-radius: var(--ease-radius-lg, 12px);
      padding: 2rem;
      box-shadow: var(--ease-shadow-md, 0 4px 6px -1px rgba(0, 0, 0, 0.1));
      border: 1px solid var(--ease-color-border, #e2e8f0);
    }
    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: center;
      margin-bottom: 1.5rem;
    }
    .button-row:last-child {
      margin-bottom: 0;
    }
  </style>
</head>
<body>

  <div class="ease-center ease-fade-in" style="text-align: center;">
    <h1 class="ease-slide-up">Animated Button Component</h1>
    <p class="ease-slide-up ease-delay-100" style="color: var(--ease-color-text-muted, #64748b); max-width: 500px;">
      Zero JavaScript. Pure CSS buttons with ripple effects, loading states, and smooth hover animations.
    </p>
  </div>

  <!-- Solid Buttons -->
  <div class="demo-container demo-section ease-fade-in ease-delay-200">
    <h2 class="demo-title">Solid Buttons (Click for Ripple Effect)</h2>
    <div class="demo-card">
      <div class="button-row">
        <button class="ease-btn-xyz ease-btn-xyz-primary">Primary</button>
        <button class="ease-btn-xyz ease-btn-xyz-secondary">Secondary</button>
        <button class="ease-btn-xyz ease-btn-xyz-success">Success</button>
        <button class="ease-btn-xyz ease-btn-xyz-error">Error</button>
        <button class="ease-btn-xyz ease-btn-xyz-warning">Warning</button>
      </div>
    </div>
  </div>

  <!-- Outline Buttons -->
  <div class="demo-container demo-section ease-fade-in ease-delay-300">
    <h2 class="demo-title">Outline Buttons</h2>
    <div class="demo-card">
      <div class="button-row">
        <button class="ease-btn-xyz ease-btn-xyz-outline ease-btn-xyz-primary">Primary</button>
        <button class="ease-btn-xyz ease-btn-xyz-outline ease-btn-xyz-secondary">Secondary</button>
        <button class="ease-btn-xyz ease-btn-xyz-outline ease-btn-xyz-success">Success</button>
        <button class="ease-btn-xyz ease-btn-xyz-outline ease-btn-xyz-error">Error</button>
        <button class="ease-btn-xyz ease-btn-xyz-outline ease-btn-xyz-warning">Warning</button>
      </div>
    </div>
  </div>

  <!-- Ghost Buttons -->
  <div class="demo-container demo-section ease-fade-in ease-delay-400">
    <h2 class="demo-title">Ghost Buttons</h2>
    <div class="demo-card">
      <div class="button-row">
        <button class="ease-btn-xyz ease-btn-xyz-ghost ease-btn-xyz-primary">Primary</button>
        <button class="ease-btn-xyz ease-btn-xyz-ghost ease-btn-xyz-secondary">Secondary</button>
        <button class="ease-btn-xyz ease-btn-xyz-ghost ease-btn-xyz-success">Success</button>
        <button class="ease-btn-xyz ease-btn-xyz-ghost ease-btn-xyz-error">Error</button>
        <button class="ease-btn-xyz ease-btn-xyz-ghost ease-btn-xyz-warning">Warning</button>
      </div>
    </div>
  </div>

  <!-- Size Variants -->
  <div class="demo-container demo-section ease-fade-in ease-delay-500">
    <h2 class="demo-title">Size Variants</h2>
    <div class="demo-card">
      <div class="button-row">
        <button class="ease-btn-xyz ease-btn-xyz-sm ease-btn-xyz-primary">Small</button>
        <button class="ease-btn-xyz ease-btn-xyz-primary">Default</button>
        <button class="ease-btn-xyz ease-btn-xyz-lg ease-btn-xyz-primary">Large</button>
      </div>
    </div>
  </div>

  <!-- With Icons -->
  <div class="demo-container demo-section ease-fade-in ease-delay-600">
    <h2 class="demo-title">With Icons</h2>
    <div class="demo-card">
      <div class="button-row">
        <button class="ease-btn-xyz ease-btn-xyz-primary">
          <span class="ease-btn-xyz-icon">👍</span>
          <span>Like</span>
        </button>
        <button class="ease-btn-xyz ease-btn-xyz-success">
          <span class="ease-btn-xyz-icon">✓</span>
          <span>Approve</span>
        </button>
        <button class="ease-btn-xyz ease-btn-xyz-error">
          <span>Reject</span>
          <span class="ease-btn-xyz-icon">✕</span>
        </button>
        <button class="ease-btn-xyz ease-btn-xyz-outline ease-btn-xyz-primary">
          <span class="ease-btn-xyz-icon">🔍</span>
          <span>Search</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Loading States -->
  <div class="demo-container demo-section ease-fade-in ease-delay-700">
    <h2 class="demo-title">Loading States</h2>
    <div class="demo-card">
      <div class="button-row">
        <button class="ease-btn-xyz ease-btn-xyz-primary ease-btn-xyz-loading">
          <span class="ease-btn-xyz-spinner"></span>
          <span>Loading...</span>
        </button>
        <button class="ease-btn-xyz ease-btn-xyz-success ease-btn-xyz-loading">
          <span class="ease-btn-xyz-spinner"></span>
          <span>Processing...</span>
        </button>
        <button class="ease-btn-xyz ease-btn-xyz-outline ease-btn-xyz-primary ease-btn-xyz-loading">
          <span class="ease-btn-xyz-spinner"></span>
          <span>Saving...</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Icon Only Buttons -->
  <div class="demo-container demo-section ease-fade-in ease-delay-800">
    <h2 class="demo-title">Icon Only Buttons</h2>
    <div class="demo-card">
      <div class="button-row">
        <button class="ease-btn-xyz ease-btn-xyz-icon-only ease-btn-xyz-primary" aria-label="Like">
          👍
        </button>
        <button class="ease-btn-xyz ease-btn-xyz-icon-only ease-btn-xyz-success" aria-label="Approve">
          ✓
        </button>
        <button class="ease-btn-xyz ease-btn-xyz-icon-only ease-btn-xyz-error" aria-label="Delete">
          🗑️
        </button>
        <button class="ease-btn-xyz ease-btn-xyz-icon-only ease-btn-xyz-outline ease-btn-xyz-primary" aria-label="Settings">
          ⚙️
        </button>
      </div>
    </div>
  </div>

  <!-- Disabled State -->
  <div class="demo-container demo-section ease-fade-in ease-delay-900">
    <h2 class="demo-title">Disabled State</h2>
    <div class="demo-card">
      <div class="button-row">
        <button class="ease-btn-xyz ease-btn-xyz-primary" disabled>Disabled</button>
        <button class="ease-btn-xyz ease-btn-xyz-outline ease-btn-xyz-primary" disabled>Disabled</button>
        <button class="ease-btn-xyz ease-btn-xyz-ghost ease-btn-xyz-primary" disabled>Disabled</button>
      </div>
    </div>
  </div>

</body>
</html>
