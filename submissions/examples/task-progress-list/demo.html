<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task Progress List &mdash; EaseMotion CSS Demo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="page-head">
    <p class="kicker">EaseMotion CSS &middot; Productivity</p>
    <h1>Task Progress List</h1>
    <p class="sub">Tick tasks off and watch them cross themselves out.</p>
  </header>
  <main class="stage">
    <div class="tp-list">
      <div class="tp-item"><span class="tp-box"></span><span class="tp-label">Write the plan</span></div>
      <div class="tp-item"><span class="tp-box"></span><span class="tp-label">Build the demo</span></div>
      <div class="tp-item"><span class="tp-box"></span><span class="tp-label">Test the motion</span></div>
      <div class="tp-item"><span class="tp-box"></span><span class="tp-label">Ship it</span></div>
    </div>
  </main>
  <p class="stage-caption">Hover a task to check it off with a sweep.</p>
  <footer class="page-foot">
    <span>Pure CSS &middot; zero dependencies</span>
    <span>Strike-through sweep</span>
  </footer>
</body>
</html>
