<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fusee Chain Cone — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Fusee Chain Cone demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Fusee Chain Cone</h1>
      <p class="lede">Fusee chain climbing a cone to equalize spring torque</p>
    </header>

    <section class="ease-fusee-chain-cone" data-demo="fusee-chain-cone" aria-live="polite">
      <div class="ease-fusee-chain-cone__housing">
        <div class="ease-fusee-chain-cone__bezel">
          <div class="ease-fusee-chain-cone__face">
            <div class="ease-fusee-chain-cone__readout">
              <span class="ease-fusee-chain-cone__label">Fusee Chain Cone</span>
              <span class="ease-fusee-chain-cone__value">LIVE</span>
            </div>
            <div class="ease-fusee-chain-cone__motion" aria-hidden="true">
              <span class="ease-fusee-chain-cone__a"></span>
              <span class="ease-fusee-chain-cone__b"></span>
              <span class="ease-fusee-chain-cone__c"></span>
              <span class="ease-fusee-chain-cone__d"></span>
            </div>
            <div class="ease-fusee-chain-cone__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-fusee-chain-cone__controls">
          <button type="button" class="ease-fusee-chain-cone__btn primary">Engage</button>
          <button type="button" class="ease-fusee-chain-cone__btn">Reset</button>
          <label class="ease-fusee-chain-cone__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-fusee-chain-cone__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
