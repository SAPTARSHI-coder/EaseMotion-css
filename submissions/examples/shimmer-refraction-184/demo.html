<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
        name="description"
        content="Tilted holographic badge with dynamic shimmer refraction"
    >
    <title>Holographic Badge</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="page">
        <section class="demo" aria-labelledby="title">
            <p class="eyebrow">EaseMotion • Advanced Effect</p>

            <h1 id="title">Holographic Badge</h1>

            <div class="badge-wrap">
                <div class="badge" tabindex="0" aria-label="Premium holographic badge">
                    <div class="badge-shine"></div>

                    <div class="badge-content">
                        <span class="badge-icon">✦</span>
                        <span class="badge-label">PREMIUM</span>
                        <span class="badge-subtitle">LIMITED EDITION</span>
                    </div>
                </div>
            </div>

            <p class="hint">
                Hover or focus the badge to reveal the dynamic shimmer.
            </p>
        </section>
    </main>

</body>
</html>
