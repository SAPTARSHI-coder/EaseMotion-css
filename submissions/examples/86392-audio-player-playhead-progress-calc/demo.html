<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Audio Player - Playhead Progress</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="player">
    <div class="icon" aria-hidden="true">♫</div>

    <h1>Audio Player</h1>
    <p class="track">Playhead Progress Demo</p>

    <div class="progress-container">
      <div
        class="progress-bar"
        id="progressBar"
        role="progressbar"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="0"
        aria-label="Audio playback progress"
      >
        <span id="progressFill"></span>
      </div>
    </div>

    <div class="time-row">
      <span id="currentTime">0:00</span>
      <span id="duration">3:00</span>
    </div>

    <input
      id="playhead"
      type="range"
      min="0"
      max="180"
      value="0"
      step="1"
      aria-label="Audio playhead"
    />

    <button id="playButton" type="button">
      Play
    </button>

    <p id="percentage" aria-live="polite">0%</p>
  </main>

  <script>
    const playhead = document.querySelector("#playhead");
    const progressFill = document.querySelector("#progressFill");
    const progressBar = document.querySelector("#progressBar");
    const currentTime = document.querySelector("#currentTime");
    const percentage = document.querySelector("#percentage");
    const playButton = document.querySelector("#playButton");

    const duration = 180;

    function calculateProgress(time, totalDuration) {
      if (
        !Number.isFinite(time) ||
        !Number.isFinite(totalDuration) ||
        totalDuration <= 0
      ) {
        return 0;
      }

      const progress = (time / totalDuration) * 100;

      return Math.min(100, Math.max(0, progress));
    }

    function formatTime(seconds) {
      const minutes = Math.floor(seconds / 60);
      const remainingSeconds = Math.floor(seconds % 60);

      return `${minutes}:${String(remainingSeconds).padStart(2, "0")}`;
    }

    function updateProgress() {
      const time = Number(playhead.value);
      const progress = calculateProgress(time, duration);

      progressFill.style.width = `${progress}%`;
      progressBar.setAttribute("aria-valuenow", String(progress));
      currentTime.textContent = formatTime(time);
      percentage.textContent = `${Math.round(progress)}%`;
    }

    playhead.addEventListener("input", updateProgress);

    playButton.addEventListener("click", () => {
      playhead.value =
        Number(playhead.value) >= duration
          ? "0"
          : String(Number(playhead.value) + 15);

      updateProgress();
    });

    updateProgress();
  </script>
</body>
</html>
