<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Glowing Modal Dialog — EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <p class="label">Pure CSS Animated Glowing Pop-In Modal</p>

  <!-- Checkbox State Trigger -->
  <input type="checkbox" id="modal-ak" class="ease-modal-checkbox" />
  <label for="modal-ak" class="ease-modal-trigger">Open Modal Dialog</label>

  <!-- Modal Overlay -->
  <div class="ease-modal-overlay">
    <div class="ease-modal-dialog">
      <h3 class="ease-modal-title">✨ EaseMotion Modal</h3>
      <p class="ease-modal-desc">
        Pure CSS pop-in spring modal with glassmorphism backdrop blur and neon glow container border.
      </p>
      <div>
        <label for="modal-ak" class="ease-modal-close">Close Modal</label>
      </div>
    </div>
  </div>

</body>
</html>
