<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Billing Toggle — EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <p class="label">Pure CSS Monthly / Yearly Billing Toggle</p>

  <div class="ease-billing-toggle-wrapper">
    <span class="ease-billing-option ease-billing-monthly">Monthly</span>

    <label class="ease-billing-switch">
      <input type="checkbox" id="billing-check-ak" checked />
      <span class="ease-billing-slider"></span>
    </label>

    <span class="ease-billing-option ease-billing-yearly">
      Yearly <span class="ease-discount-badge">Save 20%</span>
    </span>
  </div>

</body>
</html>
