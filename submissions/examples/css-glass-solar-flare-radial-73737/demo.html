<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Solar Flare Radial Glass UI</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="scene">

    <div class="solar-glow"></div>

    <section
      class="glass-card"
      aria-label="Solar Flare Glassmorphism Card"
    >
      <span class="badge">Solar Flare</span>

      <h1>Glass Interface</h1>

      <p>
        A futuristic glassmorphism card illuminated by radial solar flare
        effects and warm ambient glow.
      </p>

      <button class="action-btn">
        Explore
      </button>
    </section>

  </main>

</body>
</html>
