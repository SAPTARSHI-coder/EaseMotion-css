<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Annealing Adiabatic Optimization - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030712; color: #ffffff;">

    <div class="ease-card ease-card-glass annealing-container">
        <div class="annealing-header">
            <h2>Adiabatic Annealing</h2>
            <span class="ease-badge ease-badge-warning">Minimizing</span>
        </div>
        
        <div class="annealing-screen ease-center">
            <div class="energy-landscape-flux flux-1"></div>
            <div class="energy-landscape-flux flux-2"></div>
            <div class="hamiltonian-path-ring"></div>
            <div class="ground-state-core ease-center"></div>
        </div>

        <div class="annealing-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Energy: -42.8 eV</span>
            <button class="ease-btn ease-btn-primary ease-btn-sm ease-hover-grow">Run Anneal Cycle</button>
        </div>
    </div>

</body>
</html>
