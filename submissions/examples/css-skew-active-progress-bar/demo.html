<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Skew-Active Progress Bar</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<main class="dashboard">


<header class="hero">

    <h1>
        CSS Skew-Active Progress Bar
    </h1>

    <p>
        A pure CSS animated progress bar with skew-active
        motion effects for responsive dashboard layouts.
    </p>

</header>




<section class="progress-container">


<div class="progress-item">

    <div class="progress-label">

        <span>
            UI Design
        </span>

        <span>
            85%
        </span>

    </div>


    <div class="progress-track">

        <div class="progress-fill design">

        </div>

    </div>

</div>





<div class="progress-item">

    <div class="progress-label">

        <span>
            Development
        </span>

        <span>
            90%
        </span>

    </div>


    <div class="progress-track">

        <div class="progress-fill development">

        </div>

    </div>

</div>





<div class="progress-item">

    <div class="progress-label">

        <span>
            Testing
        </span>

        <span>
            75%
        </span>

    </div>


    <div class="progress-track">

        <div class="progress-fill testing">

        </div>

    </div>

</div>




</section>



<section class="info-card">


<h2>
    Dashboard Progress Overview
</h2>


<p>
    Skew-Active Progress Bar creates dynamic motion
    using only CSS transforms and transitions.
</p>


</section>



</main>


</body>

</html>
