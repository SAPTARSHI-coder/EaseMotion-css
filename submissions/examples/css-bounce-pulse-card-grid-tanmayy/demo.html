<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Bounce-Pulse Card Grid - EaseMotion CSS</title>
  <!-- Import EaseMotion CSS -->
  <link rel="stylesheet" href="../../../easemotion.css">
  <!-- Component Specific Styles -->
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body class="checkout-bg">

  <div class="demo-container">
    
    <div class="checkout-panel ease-glass-card">
      <div class="checkout-header">
        <h2 class="ease-text-2xl">Select Shipping Method</h2>
        <p class="ease-text-sm ease-color-muted">Choose when you want your order to arrive.</p>
      </div>

      <!-- Bounce-Pulse Card Grid (Pure CSS Radio Group) -->
      <div class="card-grid bounce-pulse-grid">
        
        <!-- Card 1 -->
        <label class="grid-card-label" tabindex="0">
          <input type="radio" name="shipping_method" class="card-radio" value="standard" checked>
          <div class="card-content">
            <div class="card-header">
              <div class="card-icon">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="3" width="15" height="13"></rect><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"></polygon><circle cx="5.5" cy="18.5" r="2.5"></circle><circle cx="18.5" cy="18.5" r="2.5"></circle></svg>
              </div>
              <span class="card-price">Free</span>
            </div>
            <div class="card-text">
              <h3 class="card-title">Standard Delivery</h3>
              <p class="card-desc">3-5 Business Days</p>
            </div>
            <div class="card-indicator">
              <svg class="check-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
            </div>
          </div>
        </label>

        <!-- Card 2 -->
        <label class="grid-card-label" tabindex="0">
          <input type="radio" name="shipping_method" class="card-radio" value="express">
          <div class="card-content">
            <div class="card-header">
              <div class="card-icon">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="M12 5l7 7-7 7"></path></svg>
              </div>
              <span class="card-price">$4.99</span>
            </div>
            <div class="card-text">
              <h3 class="card-title">Express Shipping</h3>
              <p class="card-desc">2 Business Days</p>
            </div>
            <div class="card-indicator">
              <svg class="check-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
            </div>
          </div>
        </label>

        <!-- Card 3 -->
        <label class="grid-card-label" tabindex="0">
          <input type="radio" name="shipping_method" class="card-radio" value="nextday">
          <div class="card-content">
            <div class="card-header">
              <div class="card-icon">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
              </div>
              <span class="card-price">$9.99</span>
            </div>
            <div class="card-text">
              <h3 class="card-title">Next Day Air</h3>
              <p class="card-desc">Arrives Tomorrow</p>
            </div>
            <div class="card-indicator">
              <svg class="check-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
            </div>
          </div>
        </label>

        <!-- Card 4 -->
        <label class="grid-card-label" tabindex="0">
          <input type="radio" name="shipping_method" class="card-radio" value="sameday">
          <div class="card-content">
            <div class="card-header">
              <div class="card-icon">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"></path></svg>
              </div>
              <span class="card-price">$14.99</span>
            </div>
            <div class="card-text">
              <h3 class="card-title">Same Day Delivery</h3>
              <p class="card-desc">Delivered by 8 PM</p>
            </div>
            <div class="card-indicator">
              <svg class="check-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
            </div>
          </div>
        </label>

      </div>

      <div class="checkout-footer">
        <button class="continue-btn ease-squish-button">Continue to Payment</button>
      </div>
    </div>

  </div>

</body>
</html>
