<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CSS Slide-Up Hero Section for SaaS layouts">
  <title>Slide-Up SaaS Hero</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main>
    <section class="saas-hero">
      <div class="hero-content">
        <span class="hero-badge">Built for modern teams</span>

        <h1>
          Build faster.
          <span>Grow smarter.</span>
        </h1>

        <p class="hero-description">
          A simple SaaS platform that helps teams manage projects,
          collaborate efficiently, and turn ideas into results.
        </p>

        <div class="hero-actions">
          <a href="#" class="hero-button primary">Start Free Trial</a>
          <a href="#" class="hero-button secondary">View Demo</a>
        </div>

        <div class="hero-meta">
          <span>✓ No credit card required</span>
          <span>✓ Free 14-day trial</span>
        </div>
      </div>

      <div class="hero-preview" aria-label="Product dashboard preview">
        <div class="dashboard-window">
          <div class="window-header">
            <span></span>
            <span></span>
            <span></span>
          </div>

          <div class="dashboard-content">
            <div class="dashboard-sidebar"></div>

            <div class="dashboard-main">
              <div class="dashboard-title"></div>

              <div class="dashboard-cards">
                <div class="dashboard-card"></div>
                <div class="dashboard-card"></div>
                <div class="dashboard-card"></div>
              </div>

              <div class="dashboard-chart">
                <div class="chart-line"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

</body>
</html>
