<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ease-3d-flip-toast — Demo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <header class="page__intro">
      <h1>ease-3d-flip-toast</h1>
      <p>Toast notifications that flip into view in 3D and flip out after a hold.</p>
    </header>

    <section class="demo" aria-label="Toast demo">
      <p class="demo__note">Reload to replay the 3D flip entrance. Each toast auto-dismisses after the loop.</p>

      <div class="toaststack" role="region" aria-label="Notifications" aria-live="polite">
        <div class="toast toast--info" role="status">
          <span class="toast__icon" aria-hidden="true">ⓘ</span>
          <span class="toast__msg">Invite sent to 3 members.</span>
        </div>
        <div class="toast toast--success" role="status">
          <span class="toast__icon" aria-hidden="true">✓</span>
          <span class="toast__msg">Build passed in 42s.</span>
        </div>
        <div class="toast toast--warn" role="status">
          <span class="toast__icon" aria-hidden="true">!</span>
          <span class="toast__msg">API rate limit nearing.</span>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
