<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-vending-machine-selection</title>
</head>
<body>
<main class="vms-unit">
  <header class="vms-screen">
    <span class="vms-line">Insert coins</span>
    <strong class="vms-credit">0.00</strong>
  </header>
  <section class="vms-grid" aria-label="product grid">
    <div class="vms-item"><span class="vms-item-name">Cola</span><span class="vms-price">1.50</span><button class="vms-btn">A1</button></div>
    <div class="vms-item"><span class="vms-item-name">Chips</span><span class="vms-price">1.25</span><button class="vms-btn">A2</button></div>
    <div class="vms-item"><span class="vms-item-name">Water</span><span class="vms-price">1.00</span><button class="vms-btn">B1</button></div>
    <div class="vms-item"><span class="vms-item-name">Candy</span><span class="vms-price">0.75</span><button class="vms-btn">B2</button></div>
    <div class="vms-item"><span class="vms-item-name">Juice</span><span class="vms-price">2.00</span><button class="vms-btn">C1</button></div>
    <div class="vms-item"><span class="vms-item-name">Pretzel</span><span class="vms-price">1.50</span><button class="vms-btn">C2</button></div>
  </section>
  <section class="vms-controls" aria-label="coin slot and cancel">
    <span class="vms-slot"></span>
    <button class="vms-cancel">Cancel</button>
  </section>
  <footer class="vms-tray">
    <span class="vms-out"></span>
  </footer>
</main>
</body>
</html>
