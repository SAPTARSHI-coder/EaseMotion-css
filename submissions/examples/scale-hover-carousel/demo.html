<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scale-Hover Carousel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<section class="carousel-container">
    <h1>🎮 Gaming Hub Carousel</h1>

    <div class="carousel">
        <div class="card">
            <img src="https://picsum.photos/300/200?1" alt="Game 1">
            <h3>Cyber Arena</h3>
        </div>

        <div class="card">
            <img src="https://picsum.photos/300/200?2" alt="Game 2">
            <h3>Galaxy Wars</h3>
        </div>

        <div class="card">
            <img src="https://picsum.photos/300/200?3" alt="Game 3">
            <h3>Battle Quest</h3>
        </div>
    </div>

</section>

</body>
</html>
