<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-pixel-art-canvas</title>
</head>
<body>
<main class="pac-app">
  <header class="pac-top">
    <h1 class="pac-name">Pixel Studio</h1>
    <span class="pac-save">Saved</span>
  </header>
  <section class="pac-canvas" aria-label="pixel grid">
    <span class="pac-pixel pac-p1"></span>
    <span class="pac-pixel pac-p2"></span>
    <span class="pac-pixel pac-p3"></span>
    <span class="pac-pixel pac-p4"></span>
    <span class="pac-pixel pac-p5"></span>
    <span class="pac-pixel pac-p6"></span>
    <span class="pac-pixel pac-p7"></span>
    <span class="pac-pixel pac-p8"></span>
    <span class="pac-pixel pac-p9"></span>
    <span class="pac-pixel pac-p10"></span>
    <span class="pac-pixel pac-p11"></span>
    <span class="pac-pixel pac-p12"></span>
    <span class="pac-pixel pac-p13"></span>
    <span class="pac-pixel pac-p14"></span>
    <span class="pac-pixel pac-p15"></span>
    <span class="pac-pixel pac-p16"></span>
  </section>
  <section class="pac-palette" aria-label="color palette">
    <button class="pac-swatch pac-c1"></button>
    <button class="pac-swatch pac-c2"></button>
    <button class="pac-swatch pac-c3"></button>
    <button class="pac-swatch pac-c4"></button>
    <button class="pac-swatch pac-c5"></button>
  </section>
  <footer class="pac-foot">
    <span class="pac-brush">Brush 2</span>
    <button class="pac-undo">Undo</button>
    <button class="pac-clear">Clear</button>
  </footer>
</main>
</body>
</html>
