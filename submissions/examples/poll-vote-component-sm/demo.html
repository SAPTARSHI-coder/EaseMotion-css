<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Accessible animated CSS poll vote component with responsive vote bars."
  >

  <title>CSS Poll Vote Component</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="page">

    <section class="poll" aria-labelledby="poll-title">

      <header class="poll-header">
        <span class="poll-label">COMMUNITY POLL</span>

        <h1 id="poll-title">
          Which frontend technology do you enjoy most?
        </h1>

        <p>
          Select an option to preview the animated vote result.
        </p>
      </header>

      <form class="poll-form">

        <!-- Option 1 -->
        <label class="poll-option">

          <input
            type="radio"
            name="frontend"
            value="react"
          >

          <span class="option-content">

            <span class="option-top">
              <span class="option-name">
                React
              </span>

              <span class="option-result">
                42%
              </span>
            </span>

            <span class="vote-track">
              <span class="vote-bar react-bar"></span>
            </span>

            <span class="option-bottom">
              <span>420 votes</span>
              <span>Most popular</span>
            </span>

          </span>

        </label>


        <!-- Option 2 -->
        <label class="poll-option">

          <input
            type="radio"
            name="frontend"
            value="vue"
          >

          <span class="option-content">

            <span class="option-top">
              <span class="option-name">
                Vue
              </span>

              <span class="option-result">
                28%
              </span>
            </span>

            <span class="vote-track">
              <span class="vote-bar vue-bar"></span>
            </span>

            <span class="option-bottom">
              <span>280 votes</span>
              <span>Popular choice</span>
            </span>

          </span>

        </label>


        <!-- Option 3 -->
        <label class="poll-option">

          <input
            type="radio"
            name="frontend"
            value="angular"
          >

          <span class="option-content">

            <span class="option-top">
              <span class="option-name">
                Angular
              </span>

              <span class="option-result">
                18%
              </span>
            </span>

            <span class="vote-track">
              <span class="vote-bar angular-bar"></span>
            </span>

            <span class="option-bottom">
              <span>180 votes</span>
              <span>Growing</span>
            </span>

          </span>

        </label>


        <!-- Option 4 -->
        <label class="poll-option">

          <input
            type="radio"
            name="frontend"
            value="svelte"
          >

          <span class="option-content">

            <span class="option-top">
              <span class="option-name">
                Svelte
              </span>

              <span class="option-result">
                12%
              </span>
            </span>

            <span class="vote-track">
              <span class="vote-bar svelte-bar"></span>
            </span>

            <span class="option-bottom">
              <span>120 votes</span>
              <span>Emerging</span>
            </span>

          </span>

        </label>

      </form>

      <footer class="poll-footer">
        <span>1,000 total votes</span>
        <span aria-hidden="true">•</span>
        <span>Poll closes in 2 days</span>
      </footer>

    </section>

  </main>

</body>
</html>
