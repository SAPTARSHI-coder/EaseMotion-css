<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="CSS Gradient Avatar Ring demonstration for EaseMotion CSS"
    >

    <title>CSS Gradient Avatar Ring</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="demo-container">

        <section class="demo-card">

            <p class="eyebrow">EaseMotion CSS</p>

            <h1>Gradient Avatar Ring</h1>

            <p class="description">
                An animated gradient ring around a user avatar,
                created entirely with CSS.
            </p>

            <div class="avatar-container">

                <div
                    class="avatar-ring"
                    role="img"
                    aria-label="User avatar with animated gradient ring"
                >
                    <div class="avatar">
                        <span class="avatar-initial">S</span>
                    </div>
                </div>

            </div>

            <div class="info-box">
                <h2>Pure CSS Animation</h2>

                <p>
                    The colorful ring continuously rotates around the
                    avatar without using JavaScript or external libraries.
                </p>
            </div>

        </section>

    </main>

</body>
</html>
