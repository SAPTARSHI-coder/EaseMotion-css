<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="CSS-only Foucault knife-edge motion demonstration."
  >
  <title>Foucault Knife Edge | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="demo">
    <section
      class="ease-foucault-knife-edge"
      aria-labelledby="foucault-title"
    >
      <div class="intro">
        <p class="eyebrow">EaseMotion CSS</p>
        <h1 id="foucault-title">Foucault Knife Edge</h1>
        <p>
          A CSS-only interpretation of a knife-edge sweeping across
          a mirror figure.
        </p>
      </div>

      <div class="ease-foucault-knife-edge__housing">
        <div class="ease-foucault-knife-edge__bezel">
          <div class="ease-foucault-knife-edge__face">

            <div
              class="ease-foucault-knife-edge__mirror"
              aria-hidden="true"
            >
              <div class="mirror-surface"></div>

              <div class="ease-foucault-knife-edge__motion">
                <span class="ease-foucault-knife-edge__a"></span>
                <span class="ease-foucault-knife-edge__b"></span>
                <span class="ease-foucault-knife-edge__c"></span>
                <span class="ease-foucault-knife-edge__d"></span>
              </div>
            </div>

            <div class="knife-edge" aria-hidden="true">
              <span></span>
            </div>

            <div class="measurement-markings" aria-hidden="true">
              <i></i>
              <i></i>
              <i></i>
              <i></i>
              <i></i>
            </div>

          </div>
        </div>
      </div>

      <p class="caption">
        Animated knife-edge shadow sweep
      </p>
    </section>
  </main>
</body>
</html>
