<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Animated Accordion Demo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page">
    <div class="accordion">
      <div class="accordion-item">
        <input type="checkbox" id="acc-1" class="accordion-toggle" checked />
        <label for="acc-1" class="accordion-title">
          What is EaseMotion CSS?
          <span class="accordion-icon">▼</span>
        </label>
        <div class="accordion-content">
          <div class="accordion-content-inner">
            A lightweight, curated CSS animation framework built around
            simple, composable utility classes.
          </div>
        </div>
      </div>

      <div class="accordion-item">
        <input type="checkbox" id="acc-2" class="accordion-toggle" />
        <label for="acc-2" class="accordion-title">
          Does it need JavaScript?
          <span class="accordion-icon">▼</span>
        </label>
        <div class="accordion-content">
          <div class="accordion-content-inner">
            No — this accordion is built purely with CSS grid-template-rows
            transitions, no JS required.
          </div>
        </div>
      </div>

      <div class="accordion-item">
        <input type="checkbox" id="acc-3" class="accordion-toggle" />
        <label for="acc-3" class="accordion-title">
          Is it accessible?
          <span class="accordion-icon">▼</span>
        </label>
        <div class="accordion-content">
          <div class="accordion-content-inner">
            Yes — it uses native checkbox/label semantics and respects
            prefers-reduced-motion.
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
