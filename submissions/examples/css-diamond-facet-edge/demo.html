<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Pure CSS Diamond Facet Edge background animation"
  >

  <title>CSS Diamond Facet Edge</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="diamond-scene">

    <div class="facet facet-one" aria-hidden="true"></div>
    <div class="facet facet-two" aria-hidden="true"></div>
    <div class="facet facet-three" aria-hidden="true"></div>
    <div class="facet facet-four" aria-hidden="true"></div>
    <div class="facet facet-five" aria-hidden="true"></div>
    <div class="facet facet-six" aria-hidden="true"></div>

    <div class="edge-line edge-one" aria-hidden="true"></div>
    <div class="edge-line edge-two" aria-hidden="true"></div>
    <div class="edge-line edge-three" aria-hidden="true"></div>

    <section class="diamond-content">
      <span class="eyebrow">CSS Background Animation</span>

      <h1>Diamond Facet</h1>

      <p>
        A geometric background effect inspired by the reflective
        edges and shifting facets of a cut diamond.
      </p>

      <div class="status">
        <span class="status-dot"></span>
        Pure CSS · No JavaScript
      </div>
    </section>

  </main>
</body>
</html>
