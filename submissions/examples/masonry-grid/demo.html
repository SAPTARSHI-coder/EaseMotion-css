<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Masonry Grid &mdash; EaseMotion CSS Demo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="page-head">
    <p class="kicker">EaseMotion CSS &middot; Media &amp; Gallery</p>
    <h1>Masonry Grid</h1>
    <p class="sub">Tiles of every height stack together like a scrapbook wall.</p>
  </header>
  <main class="stage">
    <div class="mg-grid">
      <div class="mg-item a">01</div>
      <div class="mg-item b">02</div>
      <div class="mg-item c">03</div>
      <div class="mg-item d">04</div>
      <div class="mg-item e">05</div>
      <div class="mg-item f">06</div>
    </div>
  </main>
  <p class="stage-caption">CSS columns handle the flow &mdash; no JavaScript needed.</p>
  <footer class="page-foot">
    <span>Pure CSS &middot; zero dependencies</span>
    <span>Multi-column masonry</span>
  </footer>
</body>
</html>
