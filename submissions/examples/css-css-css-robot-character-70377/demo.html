<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS CSS Robot Character - EaseMotion</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div
      class="rbc"
      aria-label="CSS robot character"
      role="img"
      aria-label="Robot character"
    >
      <div class="rbc-head" aria-hidden="true">
        <span class="rbc-antenna"></span>
        <div class="rbc-eyes"><span></span><span></span></div>
      </div>
      <div class="rbc-body" aria-hidden="true">
        <span class="rbc-light"></span>
      </div>
    </div>
  </body>
</html>
