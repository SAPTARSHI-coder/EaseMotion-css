<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parallax Breadcrumb - SaaS Modern</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="ease-breadcrumb-wrapper">
    <nav class="ease-breadcrumb-nav" aria-label="Breadcrumb">
      <ol class="ease-breadcrumb-list">
        <li class="ease-breadcrumb-item">
          <a href="#" class="ease-breadcrumb-link">Dashboard</a>
          <span class="ease-breadcrumb-separator" aria-hidden="true">/</span>
        </li>
        <li class="ease-breadcrumb-item">
          <a href="#" class="ease-breadcrumb-link">Projects</a>
          <span class="ease-breadcrumb-separator" aria-hidden="true">/</span>
        </li>
        <li class="ease-breadcrumb-item">
          <a href="#" class="ease-breadcrumb-link">EaseMotion</a>
          <span class="ease-breadcrumb-separator" aria-hidden="true">/</span>
        </li>
        <li class="ease-breadcrumb-item">
          <a href="#" class="ease-breadcrumb-link" aria-current="page">Settings</a>
        </li>
      </ol>
    </nav>
  </div>
  <p style="position: absolute; bottom: 2rem; color: #64748b; font-size: 0.875rem; text-transform: uppercase; letter-spacing: 1px;">Hover over the navigation to engage 3D depth</p>
</body>
</html>
