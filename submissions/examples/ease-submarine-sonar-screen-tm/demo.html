<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Submarine Sonar Screen | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="sswrap">
    <div class="sspanel">
      <div class="ssrings"></div>
      <div class="ssrings"></div>
      <div class="ssrings"></div>
      <div class="sscross sscross-h"></div>
      <div class="sscross sscross-v"></div>
      <div class="sssweep"></div>
      <div class="ssblip"></div>
      <div class="ssblip"></div>
      <div class="ssblip"></div>
    </div>
    <div class="ssinfo">
      <div>DEPTH<span>320m</span></div>
      <div>HEADING<span>NE 045</span></div>
      <div>SPEED<span>8.2 kn</span></div>
      <div>CONTACTS<span>3</span></div>
    </div>
  </div>
</body>
</html>
