<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ease-text-scramble Demo</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body { display: flex; flex-direction: column; align-items: center; gap: 40px; padding: 60px 20px; background: #0a0a1a; }
    h1 { font-size: 1.4rem; color: #f8fafc; }
    .demo-section { display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .demo-label { font-size: 0.8rem; color: rgba(248,250,252,0.45); }
    .row { display: flex; gap: 24px; flex-wrap: wrap; justify-content: center; }
    button { padding: 8px 20px; border: none; border-radius: 6px; background: #a855f7; color: #fff; cursor: pointer; margin-top: 8px; }
  </style>
</head>
<body>
  <h1>ease-text-scramble Component</h1>

  <div class="demo-section">
    <span class="demo-label">Primary color, normal speed</span>
    <div class="scramble-text theme-primary" id="scramble1">PYTHON</div>
    <button onclick="runScramble('scramble1', 'PYTHON')">Scramble</button>
  </div>

  <div class="demo-section">
    <span class="demo-label">Fire theme, large size</span>
    <div class="scramble-text theme-fire size-lg glow-complete" id="scramble2">LOADING</div>
    <button onclick="runScramble('scramble2', 'LOADING')">Scramble</button>
  </div>

  <div class="demo-section">
    <span class="demo-label">Color themes</span>
    <div class="row">
      <div class="scramble-text theme-cyan" id="sc3">CYAN</div>
      <div class="scramble-text theme-green" id="sc4">GREEN</div>
      <div class="scramble-text theme-rose" id="sc5">ROSE</div>
    </div>
    <button onclick="['sc3','sc4','sc5'].forEach(function(id){runScramble(id,document.getElementById(id).textContent)})">Scramble All</button>
  </div>

  <div class="demo-section">
    <span class="demo-label">Underline reveal variant</span>
    <div class="scramble-text underline-reveal theme-cyan size-lg" id="scramble6">REVEALED</div>
    <button onclick="runScramble('scramble6', 'REVEALED')">Scramble</button>
  </div>

  <div class="component-label">ease-text-scramble | Issue #64936</div>

  <script>
    function runScramble(elId, finalText) {
      var el = document.getElementById(elId);
      var chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$';
      var duration = 1200;
      var start = Date.now();
      var interval = setInterval(function() {
        var elapsed = Date.now() - start;
        var progress = Math.min(elapsed / duration, 1);
        var result = '';
        for (var i = 0; i < finalText.length; i++) {
          if (finalText[i] === ' ') { result += ' '; continue; }
          if (progress > (i + 1) / finalText.length) {
            result += finalText[i];
          } else {
            result += chars[Math.floor(Math.random() * chars.length)];
          }
        }
        el.textContent = result;
        if (progress >= 1) {
          clearInterval(interval);
          el.textContent = finalText;
          el.classList.add('complete');
          setTimeout(function() { el.classList.remove('complete'); }, 300);
        }
      }, 50);
    }
  </script>
</body>
</html>
