<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Float Drift Tooltip</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<section class="catalog">

    <div class="product">
        <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500" alt="Shoes">

        <button class="info-btn">
            ⓘ
            <span class="tooltip">
                Lightweight running shoes with breathable mesh and premium comfort.
            </span>
        </button>
    </div>

    <div class="product">
        <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500" alt="Watch">

        <button class="info-btn">
            ⓘ
            <span class="tooltip">
                Smartwatch featuring health tracking and AMOLED display.
            </span>
        </button>
    </div>

    <div class="product">
        <img src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=500" alt="Phone">

        <button class="info-btn">
            ⓘ
            <span class="tooltip">
                Latest flagship smartphone with AI camera system.
            </span>
        </button>
    </div>

</section>

</body>
</html>
