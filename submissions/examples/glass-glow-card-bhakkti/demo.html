<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Glass Glow Card Demo</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="demo-shell">
      <div class="glass-card-shell">
        <div class="ease-glass-glow-card-glow" aria-hidden="true"></div>
        <div class="ease-glass-glow-card">
          <div class="ease-glass-glow-card-border" aria-hidden="true"></div>
          <div class="ease-glass-glow-card-content">
            <p class="eyebrow">Premium UI</p>
            <h1>Glassmorphic Glow Card</h1>
            <p>
              A frosted card with a rotating gradient halo, subtle neon glow,
              and a polished hover interaction for modern dashboards.
            </p>
            <div class="pill-row">
              <span>Pure CSS</span>
              <span>Customizable</span>
              <span>Accessible</span>
            </div>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
