<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>High Contrast Glitch Text Reveal</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="grid-layout">
        <header class="header">
            <span class="a11y-badge">Accessibility First</span>
        </header>

        <main class="glitch-card" aria-labelledby="glitch-title">
            <div class="card-inner">
                <div class="glitch-wrapper">
                    <!-- Aria-hidden on the pseudo-element data attribute to prevent screen readers reading it 3 times -->
                    <h1 id="glitch-title" class="glitch-text" data-text="SYSTEM SECURE">SYSTEM SECURE</h1>
                </div>
                
                <p class="description">
                    High contrast design with prefers-reduced-motion support.
                </p>

                <button class="btn-trigger" aria-label="Trigger glitch animation" onclick="triggerGlitch()">
                    RUN DIAGNOSTIC
                </button>
            </div>
        </main>
    </div>

    <script>
        function triggerGlitch() {
            const textEl = document.querySelector('.glitch-text');
            
            // Check for reduced motion preference
            const mediaQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
            if (mediaQuery && mediaQuery.matches) {
                // Flash border instead for reduced motion
                const card = document.querySelector('.card-inner');
                card.style.borderColor = '#FFFF00';
                setTimeout(() => card.style.borderColor = '#FFFFFF', 500);
                return;
            }

            textEl.classList.remove('glitch-active');
            void textEl.offsetWidth; // Trigger reflow
            textEl.classList.add('glitch-active');
        }

        // Trigger on load if motion is allowed
        window.addEventListener('DOMContentLoaded', () => {
            const mediaQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
            if (!mediaQuery || !mediaQuery.matches) {
                setTimeout(triggerGlitch, 500);
            }
        });
    </script>
</body>
</html>
