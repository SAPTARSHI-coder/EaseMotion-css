<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Pure CSS minimalist outline background animation."
  >
  <title>Minimalist Outline Background</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="outline-background">
    <div class="outline-shapes" aria-hidden="true">
      <span class="outline-shape shape-one"></span>
      <span class="outline-shape shape-two"></span>
      <span class="outline-shape shape-three"></span>
      <span class="outline-shape shape-four"></span>
      <span class="outline-shape shape-five"></span>
      <span class="outline-shape shape-six"></span>

      <span class="outline-line line-one"></span>
      <span class="outline-line line-two"></span>
      <span class="outline-line line-three"></span>
    </div>

    <section class="content">
      <span class="label">PURE CSS BACKGROUND</span>

      <h1>Minimalist Outline</h1>

      <p>
        A lightweight animated background built with subtle
        geometric outlines and smooth CSS motion.
      </p>

      <a class="content-link" href="#demo">
        Explore
      </a>
    </section>
  </main>
</body>
</html>
