<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CSS Shimmer-Sweep Progress Bar">
  <title>Shimmer-Sweep Progress Bar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section class="progress-card" aria-labelledby="title">
      <span class="eyebrow">EASEMOTION CSS</span>

      <h1 id="title">System Progress</h1>

      <p class="intro">
        A lightweight shimmer-sweep progress component designed for
        glassmorphism interfaces.
      </p>

      <div class="progress-list">
        <div class="progress-item">
          <div class="progress-header">
            <span>Interface Design</span>
            <strong>88%</strong>
          </div>

          <div
            class="progress-track"
            role="progressbar"
            aria-label="Interface Design"
            aria-valuenow="88"
            aria-valuemin="0"
            aria-valuemax="100"
          >
            
          </div>
        </div>

        <div class="progress-item">
          <div class="progress-header">
            <span>Development</span>
            <strong>74%</strong>
          </div>

          <div
            class="progress-track"
            role="progressbar"
            aria-label="Development"
            aria-valuenow="74"
            aria-valuemin="0"
            aria-valuemax="100"
          >
            
          </div>
        </div>

        <div class="progress-item">
          <div class="progress-header">
            <span>Optimization</span>
            <strong>61%</strong>
          </div>

          <div
            class="progress-track"
            role="progressbar"
            aria-label="Optimization"
            aria-valuenow="61"
            aria-valuemin="0"
            aria-valuemax="100"
          >
           
          </div>
        </div>
      </div>

      <div class="status">
        <span class="status-dot" aria-hidden="true"></span>
        Processing smoothly
      </div>
    </section>
  </main>
</body>
</html>
