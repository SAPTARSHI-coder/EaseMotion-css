<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Masonry Column Calculation Resize Demo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="container">
  <h1>Masonry Layout</h1>

  <label for="widthRange">
    Container Width:
    <span id="widthValue">900px</span>
  </label>

  <input
    id="widthRange"
    type="range"
    min="250"
    max="1200"
    value="900"
    step="10"
  />

  <div class="stats">
    <span>Columns:</span>
    <strong id="columnCount">4</strong>
  </div>

  <div class="masonry" id="grid">
    <div class="card tall">1</div>
    <div class="card">2</div>
    <div class="card">3</div>
    <div class="card tall">4</div>
    <div class="card">5</div>
    <div class="card">6</div>
    <div class="card tall">7</div>
    <div class="card">8</div>
  </div>
</div>

<script>
const slider = document.getElementById("widthRange");
const widthValue = document.getElementById("widthValue");
const columnCount = document.getElementById("columnCount");
const grid = document.getElementById("grid");

function calculateColumns(width) {
  if (!Number.isFinite(width) || width <= 0) return 1;

  if (width < 500) return 1;
  if (width < 700) return 2;
  if (width < 900) return 3;
  return 4;
}

function update(width) {
  const cols = calculateColumns(width);

  widthValue.textContent = `${width}px`;
  columnCount.textContent = cols;

  grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
}

slider.addEventListener("input", (e) => {
  update(Number(e.target.value));
});

update(900);
</script>

</body>
</html>
