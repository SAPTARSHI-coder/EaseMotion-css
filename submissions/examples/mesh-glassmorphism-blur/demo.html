<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>Glassmorphism Blur Mesh Gradient</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">
    <section class="glass-mesh" aria-labelledby="mesh-title">

      <div class="mesh-blob blob-one"></div>
      <div class="mesh-blob blob-two"></div>
      <div class="mesh-blob blob-three"></div>
      <div class="mesh-blob blob-four"></div>

      <div class="glass-card">
        <span class="eyebrow">CSS MESH GRADIENT</span>

        <h1 id="mesh-title">
          Glassmorphism<br>
          Blur
        </h1>

        <p>
          A smooth glass surface layered over a colorful
          CSS mesh gradient using only HTML and Vanilla CSS.
        </p>

        <div class="actions">
          <button class="glass-button" type="button">
            Explore Effect
          </button>

          <span class="status">Pure CSS</span>
        </div>
      </div>

    </section>

    <section class="info-card">
      <h2>Glassmorphism Mesh</h2>
      <p>
        Hover over the glass panel to reveal a subtle 3D
        movement and smooth depth transition.
      </p>
    </section>
  </main>

</body>
</html>
