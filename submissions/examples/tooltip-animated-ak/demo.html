<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Animated Tooltip — EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <p class="label">Pure CSS Animated Spring Tooltips</p>
  <div class="demo-row">
    <!-- Top Tooltip -->
    <div class="ease-tooltip-target" data-tooltip="Top Tooltip Content ✨" tabindex="0">
      Hover Top
    </div>

    <!-- Bottom Tooltip -->
    <div class="ease-tooltip-target ease-tooltip-target--bottom" data-tooltip="Bottom Tooltip Content 🚀" tabindex="0">
      Hover Bottom
    </div>
  </div>

</body>
</html>
