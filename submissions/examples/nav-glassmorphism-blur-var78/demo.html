<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EaseMotion CSS - Glassmorphism Blur Navigation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-container">
        <!-- Background decorative elements for glassmorphism effect to be visible -->
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>

        <!-- Navigation component -->
        <nav class="nav-glass-blur-var78">
            <div class="nav-logo">GlassNav</div>
            <ul class="nav-links">
                <li><a href="#" class="nav-link active">Home</a></li>
                <li><a href="#" class="nav-link">About</a></li>
                <li><a href="#" class="nav-link">Services</a></li>
                <li><a href="#" class="nav-link">Portfolio</a></li>
                <li><a href="#" class="nav-link">Contact</a></li>
            </ul>
            <div class="nav-actions">
                <button class="nav-btn">Sign In</button>
            </div>
        </nav>

        <main class="content">
            <h1>Glassmorphism Navigation</h1>
            <p>Scroll down or hover over the navigation to see the blur and smooth transitions in effect.</p>
        </main>
    </div>
</body>
</html>
