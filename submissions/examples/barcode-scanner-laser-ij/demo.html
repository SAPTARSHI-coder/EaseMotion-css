<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-barcode-scanner-laser demo</title>
</head>
<body>
<div class="bc-app">
  <span class="bc-title">SCAN DESK</span>
  <div class="bc-window">
    <div class="bc-barcode">
      <span class="bc-thick"></span>
      <span class="bc-thin"></span>
      <span class="bc-tiny"></span>
      <span class="bc-thick"></span>
      <span class="bc-thin"></span>
      <span class="bc-tiny"></span>
      <span class="bc-thick"></span>
      <span class="bc-thin"></span>
      <span class="bc-tiny"></span>
      <span class="bc-thin"></span>
      <span class="bc-thick"></span>
      <span class="bc-tiny"></span>
      <span class="bc-thin"></span>
      <span class="bc-thick"></span>
      <span class="bc-tiny"></span>
    </div>
    <span class="bc-laser"></span>
  </div>
  <span class="bc-code">4 90123 45678 9</span>
  <span class="bc-beep">BEEP</span>
  <span class="bc-label">HAND SCANNER</span>
</div>
</body>
</html>
