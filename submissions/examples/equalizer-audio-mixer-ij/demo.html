<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-equalizer-audio-mixer demo</title>
</head>
<body>
<div class="eam-mixer">
  <div class="eam-strip">
    <span class="eam-tag">CH 1</span>
    <div class="eam-fader"><em class="eam-fill"></em></div>
    <span class="eam-led"></span>
    <button class="eam-mute">M</button>
  </div>
  <div class="eam-strip">
    <span class="eam-tag">CH 2</span>
    <div class="eam-fader"><em class="eam-fill"></em></div>
    <span class="eam-led"></span>
    <button class="eam-mute">M</button>
  </div>
  <div class="eam-strip">
    <span class="eam-tag">MAIN</span>
    <div class="eam-fader"><em class="eam-fill"></em></div>
    <span class="eam-led"></span>
    <button class="eam-mute">M</button>
  </div>
  <div class="eam-master"><b class="eam-read">-12 dB</b></div>
</div>
</body>
</html>
