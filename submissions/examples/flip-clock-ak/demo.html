<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flip Clock Counter — EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <p class="label">Pure CSS 3D Flip Clock (Hover to Flip Digit)</p>
  <div class="demo-row">
    <!-- Hours -->
    <div class="ease-flip-digit">
      <div class="ease-flip-card-fold">1</div>
    </div>
    <div class="ease-flip-digit">
      <div class="ease-flip-card-fold">2</div>
    </div>

    <span class="ease-flip-colon">:</span>

    <!-- Minutes -->
    <div class="ease-flip-digit">
      <div class="ease-flip-card-fold">4</div>
    </div>
    <div class="ease-flip-digit">
      <div class="ease-flip-card-fold">5</div>
    </div>
  </div>

</body>
</html>
