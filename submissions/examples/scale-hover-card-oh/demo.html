<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scale-Hover Card Grid</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="card-grid">
    <div class="ease-scale-hover-card card">
      <h3>Scale Card</h3>
      <p>Hover to scale</p>
    </div>
    <div class="ease-scale-hover-card card">
      <h3>Interactive</h3>
      <p>Grow on hover</p>
    </div>
    <div class="ease-scale-hover-card card">
      <h3>Neon Style</h3>
      <p>Cyberpunk glow</p>
    </div>
  </div>
</body>
</html>
