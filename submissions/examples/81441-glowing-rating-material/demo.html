<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Glowing rating component with Material Design styling using pure CSS."
  >

  <title>Glowing Rating — Material Design</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="page">

    <section
      class="rating-section"
      aria-labelledby="rating-title"
    >

      <header class="rating-heading">
        <span class="rating-heading__eyebrow">
          MATERIAL RATING
        </span>

        <h1 id="rating-title">
          Customer experience
        </h1>

        <p>
          A glowing Material-inspired rating component
          built entirely with CSS.
        </p>
      </header>

      <article class="rating-card">

        <div class="rating-card__top">

          <div class="rating-card__icon" aria-hidden="true">
            ★
          </div>

          <div>
            <p class="rating-card__label">
              Overall rating
            </p>

            <p class="rating-card__score">
              <span>4.8</span>
              <small>/ 5</small>
            </p>
          </div>

        </div>

        <div
          class="rating-stars"
          role="img"
          aria-label="Rated 4.8 out of 5 stars"
        >
          <span class="rating-star rating-star--active">★</span>
          <span class="rating-star rating-star--active">★</span>
          <span class="rating-star rating-star--active">★</span>
          <span class="rating-star rating-star--active">★</span>
          <span class="rating-star rating-star--partial">★</span>
        </div>

        <div class="rating-card__progress">

          <div class="rating-progress">
            <span class="rating-progress__label">5</span>

            <span class="rating-progress__track">
              <span
                class="rating-progress__fill"
                style="--rating-width: 92%"
              ></span>
            </span>

            <span class="rating-progress__count">
              92%
            </span>
          </div>

          <div class="rating-progress">
            <span class="rating-progress__label">4</span>

            <span class="rating-progress__track">
              <span
                class="rating-progress__fill"
                style="--rating-width: 74%"
              ></span>
            </span>

            <span class="rating-progress__count">
              74%
            </span>
          </div>

          <div class="rating-progress">
            <span class="rating-progress__label">3</span>

            <span class="rating-progress__track">
              <span
                class="rating-progress__fill"
                style="--rating-width: 42%"
              ></span>
            </span>

            <span class="rating-progress__count">
              42%
            </span>
          </div>

        </div>

        <p class="rating-card__footer">
          Based on <strong>1,248 reviews</strong>
        </p>

      </article>

    </section>

  </main>

</body>
</html>
