<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EaseMotion CSS — Floating Action Button Speed Dial Showcase</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="fab-demo-wrapper">
    <header class="fab-header">
      <span class="badge">UI Component Showcase</span>
      <h1>Floating Action Button Speed Dial</h1>
      <p>Interactive FAB component featuring expanding action items, staggered spring transitions, and accessible focus visibility.</p>
    </header>

    <!-- FAB Speed Dial Component -->
    <div class="ease-fab-container">
      <div class="fab-speed-dial">
        <button class="fab-item" aria-label="New Document" title="New Document">
          <span class="item-icon">📄</span>
        </button>
        <button class="fab-item" aria-label="Upload Image" title="Upload Image">
          <span class="item-icon">📷</span>
        </button>
        <button class="fab-item" aria-label="Send Message" title="Send Message">
          <span class="item-icon">💬</span>
        </button>
      </div>

      <button class="ease-fab-main" aria-label="Toggle Quick Actions">
        <span class="main-icon">&plus;</span>
      </button>
    </div>

    <footer class="fab-footer">
      <p>EaseMotion CSS Component &bull; Submitted by @Ishita-Katiyar-06</p>
    </footer>
  </div>
</body>
</html>
