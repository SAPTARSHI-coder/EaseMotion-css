<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modal Backdrop Zoom</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="modal-stage" aria-label="Modal backdrop zoom animation demo">
      <section class="backdrop">
        <article class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
          <p class="eyebrow">Confirm action</p>
          <h1 id="modal-title">Publish changes?</h1>
          <p>The preview branch is ready and checks have completed.</p>
          <button type="button">Publish now</button>
        </article>
      </section>
    </main>
  </body>
</html>
