<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beacon Morse Flash — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Beacon Morse Flash demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Beacon Morse Flash</h1>
      <p class="lede">Coastal signal beacon flashing a Morse code pattern</p>
    </header>

    <section class="ease-beacon-morse-flash" data-demo="beacon-morse-flash" aria-live="polite">
      <div class="ease-beacon-morse-flash__housing">
        <div class="ease-beacon-morse-flash__bezel">
          <div class="ease-beacon-morse-flash__face">
            <div class="ease-beacon-morse-flash__readout">
              <span class="ease-beacon-morse-flash__label">Beacon Morse Flash</span>
              <span class="ease-beacon-morse-flash__value">LIVE</span>
            </div>
            <div class="ease-beacon-morse-flash__motion" aria-hidden="true">
              <span class="ease-beacon-morse-flash__a"></span>
              <span class="ease-beacon-morse-flash__b"></span>
              <span class="ease-beacon-morse-flash__c"></span>
              <span class="ease-beacon-morse-flash__d"></span>
            </div>
            <div class="ease-beacon-morse-flash__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-beacon-morse-flash__controls">
          <button type="button" class="ease-beacon-morse-flash__btn primary">Engage</button>
          <button type="button" class="ease-beacon-morse-flash__btn">Reset</button>
          <label class="ease-beacon-morse-flash__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-beacon-morse-flash__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
