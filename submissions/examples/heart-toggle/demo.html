<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Heart Toggle — EaseMotion CSS</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="page">
        <section class="demo" aria-labelledby="demo-title">
            <div class="intro">
                <p class="eyebrow">EaseMotion CSS · Toggle</p>
                <h1 id="demo-title">Heart Toggle</h1>
                <p>A playful like button with a red heart fill and a tiny pulse burst when activated.</p>
            </div>

            <div class="showcase">
                <div class="heart-card">
                    <span class="card-label">Tap to like</span>

                    <label class="heart-toggle">
                        <input type="checkbox" aria-label="Like this item">

                        <span class="heart-button">
                            <span class="heart" aria-hidden="true">♥</span>
                            <span class="pulse pulse-one" aria-hidden="true"></span>
                            <span class="pulse pulse-two" aria-hidden="true"></span>
                            <span class="pulse pulse-three" aria-hidden="true"></span>
                        </span>
                    </label>

                    <span class="status" aria-hidden="true">Loved</span>
                </div>
            </div>
        </section>
    </main>
</body>

</html>
