<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Travel Insurance Card | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <article class="insurance-card" aria-label="Global Travel Insurance Plan Summary">
      <div class="card-header">
        <div>
          <span class="badge" aria-label="Active Protection Status">
            ● Active Plan
          </span>
          <h1 class="plan-title">Global Explorer</h1>
          <p class="plan-subtitle">Comprehensive Worldwide Coverage</p>
        </div>
        <div class="price-container">
          <span class="price">$49</span>
          <span class="price-period">/ trip</span>
        </div>
      </div>

      <ul class="coverage-list" aria-label="Included Coverages">
        <li class="coverage-item">
          <div class="icon-wrapper" aria-hidden="true">
            <svg class="icon" viewBox="0 0 24 24">
              <path d="M22 12A10 10 0 1 1 12 2a10 10 0 0 1 10 10z"></path>
              <path d="M12 6v6l4 2"></path>
            </svg>
          </div>
          <span class="coverage-text">Flight Delays</span>
        </li>
        <li class="coverage-item">
          <div class="icon-wrapper" aria-hidden="true">
            <svg class="icon" viewBox="0 0 24 24">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
            </svg>
          </div>
          <span class="coverage-text">Medical Expense</span>
        </li>
        <li class="coverage-item">
          <div class="icon-wrapper" aria-hidden="true">
            <svg class="icon" viewBox="0 0 24 24">
              <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
              <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
            </svg>
          </div>
          <span class="coverage-text">Lost Baggage</span>
        </li>
        <li class="coverage-item">
          <div class="icon-wrapper" aria-hidden="true">
            <svg class="icon" viewBox="0 0 24 24">
              <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
            </svg>
          </div>
          <span class="coverage-text">24/7 Support</span>
        </li>
      </ul>

      <a href="#select-plan" class="cta-button" role="button">Select Coverage</a>
    </article>
  </main>
</body>
</html>
