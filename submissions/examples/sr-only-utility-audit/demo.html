<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Screen Reader Visually Hidden sr-only Utility Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Focusable Skip Link using .sr-only-focusable -->
  <a href="#main-content" class="sr-only sr-only-focusable skip-link-demo">
    Skip to main content
  </a>

  <main id="main-content" tabindex="-1">
    <h1>Accessible Utility Test Harness</h1>
    <p>
      This demo tests the <code>.sr-only</code> class with Screen Readers (NVDA, VoiceOver, JAWS) 
      and automated audits (axe-core).
    </p>

    <div class="demo-group">
      <!-- Test Case 1: Icon-only button with sr-only label -->
      <div>
        <button type="button" class="icon-button" id="search-button">
          <svg class="icon-svg" focusable="false" aria-hidden="true" viewBox="0 0 24 24">
            <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
          </svg>
          <span class="sr-only">Search database</span>
        </button>
      </div>

      <!-- Test Case 2: Dynamic Status Live Region -->
      <div 
        id="status-announcer" 
        class="sr-only" 
        role="status" 
        aria-live="polite" 
        aria-atomic="true"
      ></div>
    </div>
  </main>

  <script>
    // Demo script to verify dynamic screen reader announcements
    document.addEventListener('DOMContentLoaded', () => {
      const btn = document.getElementById('search-button');
      const announcer = document.getElementById('status-announcer');

      btn.addEventListener('click', () => {
        announcer.textContent = '';
        setTimeout(() => {
          announcer.textContent = 'Search executed successfully. 0 items found.';
        }, 50);
      });
    });
  </script>
</body>
</html>
