<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Parallax toggle with Cyberpunk styling."
  >

  <title>Parallax Toggle — Cyberpunk</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="page">

    <section class="demo">

      <span class="eyebrow">EASEMOTION // 79664</span>

      <h1>Parallax Toggle</h1>

      <p class="intro">
        A CSS-only cyberpunk toggle with layered parallax depth,
        neon states, and responsive interaction.
      </p>

      <div class="cyber-card">

        <div class="cyber-card__header">
          <div>
            <span class="system-label">SYSTEM CONTROL</span>
            <h2>Neural Interface</h2>
          </div>

          <span class="status">
            ONLINE
          </span>
        </div>

        <div class="toggle-stage">

          <input
            class="toggle__input"
            type="checkbox"
            id="cyber-toggle"
            checked
          >

          <label
            class="toggle"
            for="cyber-toggle"
          >
            <span class="toggle__track">

              <span class="toggle__grid"></span>

              <span class="toggle__glow"></span>

              <span class="toggle__thumb">

                <span class="thumb__core"></span>
                <span class="thumb__line"></span>

              </span>

            </span>

            <span class="toggle__state toggle__state--off">
              OFFLINE
            </span>

            <span class="toggle__state toggle__state--on">
              ACTIVE
            </span>

          </label>

        </div>

        <div class="cyber-card__footer">

          <span class="footer__hint">
            Toggle system power
          </span>

          <span class="footer__code">
            SYS_01
          </span>

        </div>

      </div>

      <p class="demo__note">
        Move over the toggle to see the layered depth effect.
      </p>

    </section>

  </main>

</body>
</html>
