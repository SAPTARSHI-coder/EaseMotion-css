<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Skeleton Loader</title>
    <link rel="stylesheet" href="../../../easemotion.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page">
        <h1>Animated Skeleton Loader</h1>
        <p>Loading placeholders with shimmer and pulse effects</p>
        <div class="skeleton-card" aria-busy="true" role="status">
            <div class="skeleton-header">
                <div class="skeleton avatar shimmer"></div>
                <div class="text-group">
                    <div class="skeleton title wave"></div>
                    <div class="skeleton subtitle wave"></div>
                </div>
            </div>
            <div class="skeleton image wave"></div>
            <div class="skeleton line long wave"></div>
            <div class="skeleton line short wave"></div>
            <div class="skeleton line medium wave"></div>
            <div class="skeleton button wave"></div>
        </div>
        
        <h2>Pulse Variant</h2>

        <div class="skeleton-card">
            <div class="skeleton-header">
                <div class="skeleton avatar pulse"></div>
                <div class="text-group">
                    <div class="skeleton title pulse"></div>
                    <div class="skeleton subtitle pulse"></div>
                </div>
            </div>
            <div class="skeleton image pulse"></div>
            <div class="skeleton line long pulse"></div>
            <div class="skeleton line short pulse"></div>
            <div class="skeleton line medium pulse"></div>
            <div class="skeleton button pulse"></div>
        </div>
    </div>
</body>
</html>
