<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glassmorphic Frost Fade - Play Category</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="ease-frost-stage">
    <!-- Glassmorphic Card Component -->
    <div class="glass-frost-fade" id="frost-card" aria-labelledby="card-title">
      <h3 id="card-title">Secure Portal</h3>
      <p>Please log in to continue to your encrypted workspace and access system diagnostics.</p>
      <button type="button" class="ease-btn-frost">Authenticate Session</button>
    </div>

    <button type="button" class="ease-btn-replay" id="replay-btn">Replay Entrance Animation</button>
  </main>

  <script>
    const card = document.getElementById('frost-card');
    const replayBtn = document.getElementById('replay-btn');

    replayBtn.addEventListener('click', () => {
      card.classList.remove('is-animating');
      void card.offsetWidth; // Trigger DOM reflow
      card.classList.add('is-animating');
    });
  </script>
</body>
</html>
