<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Pure CSS sci-fi HUD with a bouncing spring animation."
  >
  <title>Bouncing Spring Sci-Fi HUD</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="hud-demo">
    <section class="hud-panel" aria-labelledby="hud-title">

      <div class="hud-grid" aria-hidden="true"></div>

      <div class="hud-ring ring-one" aria-hidden="true"></div>
      <div class="hud-ring ring-two" aria-hidden="true"></div>
      <div class="hud-ring ring-three" aria-hidden="true"></div>

      <div class="hud-content">

        <div class="hud-status">
          <span class="status-dot" aria-hidden="true"></span>
          SYSTEM ONLINE
        </div>

        <p class="hud-code">NX-07 / SPRING CORE</p>

        <h1 id="hud-title">
          Bouncing
          <span>Spring</span>
        </h1>

        <p class="hud-description">
          A cyberpunk HUD interface powered entirely by HTML and vanilla CSS,
          featuring a smooth spring-inspired bounce animation.
        </p>

        <div class="hud-readout" aria-label="System status">
          <div class="readout-item">
            <span class="readout-label">POWER</span>
            <strong>98%</strong>
          </div>

          <div class="readout-item">
            <span class="readout-label">CORE</span>
            <strong>ACTIVE</strong>
          </div>

          <div class="readout-item">
            <span class="readout-label">SYNC</span>
            <strong>READY</strong>
          </div>
        </div>

        <button class="hud-button" type="button">
          <span>INITIALIZE</span>
          <span class="button-arrow" aria-hidden="true">→</span>
        </button>

      </div>

      <div class="hud-corner corner-top-left" aria-hidden="true"></div>
      <div class="hud-corner corner-top-right" aria-hidden="true"></div>
      <div class="hud-corner corner-bottom-left" aria-hidden="true"></div>
      <div class="hud-corner corner-bottom-right" aria-hidden="true"></div>

    </section>
  </main>
</body>
</html>
