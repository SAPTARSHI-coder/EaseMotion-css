<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Image Stack Hover &mdash; EaseMotion CSS Demo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="page-head">
    <p class="kicker">EaseMotion CSS &middot; Media &amp; Gallery</p>
    <h1>Image Stack Hover</h1>
    <p class="sub">Four photos piled neatly on top of each other, waiting to fan out.</p>
  </header>
  <main class="stage">
    <div class="is-stack">
      <div class="is-card s1"></div>
      <div class="is-card s2"></div>
      <div class="is-card s3"></div>
      <div class="is-card s4"></div>
    </div>
  </main>
  <p class="stage-caption">Hover the pile to shuffle the deck into a fan.</p>
  <footer class="page-foot">
    <span>Pure CSS &middot; zero dependencies</span>
    <span>Transform fan-out</span>
  </footer>
</body>
</html>
