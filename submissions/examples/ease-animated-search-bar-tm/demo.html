<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Animated Search Bar | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="asb-root">
    <div class="asb-card">
      <label class="asb-label">Search</label>
      <div class="asb-wrap">
        <input type="text" class="asb-input" placeholder="Type to search...">
        <span class="asb-icon">&#128269;</span>
        <div class="asb-line"></div>
      </div>
    </div>
    <p class="asb-sub">Focus the input to see the animated underline grow</p>
  </div>
</body>
</html>
