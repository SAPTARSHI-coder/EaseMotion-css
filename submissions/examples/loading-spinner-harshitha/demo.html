<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loading Spinner - EaseMotion (harshitha)</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="page">
      <h1 class="title">Loading Spinner (Pure CSS)</h1>

      <section class="demo" aria-label="Spinner demos">
        <article class="demo-card">
          <div class="label">Default spinner</div>
          <div class="spinner-wrap">
            <div
              class="ease-loading-spinner-harshitha"
              role="status"
              aria-label="Loading"
            ></div>
          </div>
          <div class="note">Infinite rotation with a fading tail.</div>
        </article>

        <article class="demo-card">
          <div class="label">Custom size + color</div>
          <div class="spinner-wrap">
            <div
              class="ease-loading-spinner-harshitha"
              role="status"
              aria-label="Loading"
              style="--ease-spinner-size: 3rem; --ease-spinner-color: #4f46e5"
            ></div>
          </div>
          <div class="note">Use CSS variables: --ease-spinner-size and --ease-spinner-color.</div>
        </article>

        <article class="demo-card">
          <div class="label">Reduced motion friendly</div>
          <div class="spinner-wrap">
            <div
              class="ease-loading-spinner-harshitha"
              role="status"
              aria-label="Loading"
              style="--ease-spinner-size: 2.25rem; --ease-spinner-color: #0ea5e9"
            ></div>
          </div>
          <div class="note">Respects prefers-reduced-motion.</div>
        </article>
      </section>
    </main>
  </body>
</html>
