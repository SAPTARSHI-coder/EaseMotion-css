<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EaseMotion - Loading Spinner (Demo)</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div style="font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; padding: 2rem;">
      <h1 style="margin: 0 0 0.5rem; font-size: 1.6rem;">Loading Spinner</h1>
      <p style="margin: 0 0 1.25rem; opacity: 0.8;">Pure CSS spinner component.</p>

      <div style="display: grid; gap: 1rem; justify-items: start;">
        <div>
          <span style="display: inline-flex; align-items: center; gap: 0.75rem;">
            <span class="ease-loading-spinner-harshitha" aria-label="Loading" role="status"></span>
            <span>Default</span>
          </span>
        </div>

        <div>
          <button type="button" style="border: 1px solid rgba(0,0,0,0.12); background: #fff; padding: 0.6rem 0.9rem; border-radius: 10px; cursor: pointer;">
            <span style="display: inline-flex; align-items: center; gap: 0.6rem;">
              <span class="ease-loading-spinner-harshitha" style="--ease-spinner-size: 1.3rem;" aria-label="Loading" role="status"></span>
              Submitting
            </span>
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
