<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loading Spinner - CSS (Pure)</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="page">
      <h1 class="title">CSS Animated Loading Spinner</h1>

      <section class="demo" aria-label="Spinner demos">
        <div class="demo-card">
          <div class="label">Default</div>
          <div class="spinner-wrap">
            <div
              class="ease-loading-spinner-harshitha"
              role="status"
              aria-live="polite"
              aria-label="Loading"
            ></div>
          </div>
        </div>

        <div class="demo-card">
          <div class="label">Custom size + color</div>
          <div class="spinner-wrap">
            <div
              class="ease-loading-spinner-harshitha"
              style="--size: 3.25rem; --color: #4f46e5;"
              role="status"
              aria-live="polite"
              aria-label="Loading"
            ></div>
          </div>
        </div>

        <div class="demo-card">
          <div class="label">Small + accent</div>
          <div class="spinner-wrap">
            <div
              class="ease-loading-spinner-harshitha"
              style="--size: 1.4rem; --color: #0ea5e9;"
              role="status"
              aria-live="polite"
              aria-label="Loading"
            ></div>
          </div>
        </div>
      </section>

      <p class="note">
        This spinner uses <strong>only HTML and CSS</strong> (no JavaScript).
      </p>
    </main>
  </body>
</html>
