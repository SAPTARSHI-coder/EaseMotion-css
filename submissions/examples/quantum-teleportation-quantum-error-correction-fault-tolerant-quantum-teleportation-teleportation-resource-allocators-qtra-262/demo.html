<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teleportation Resource Allocators QTRA - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css"></head><body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030712; color: #ffffff;">

    <div class="ease-card ease-card-glass qtra-container">
        <div class="qtra-header">
            <h2>Teleportation Resource Allocator</h2>
            <span class="ease-badge ease-badge-primary">Fault-Tolerant Quantum</span>
        </div>
        
        <div class="qtra-screen ease-center">
            <div class="qtra-flux flux-qtra-a"></div>
            <div class="qtra-flux flux-qtra-b"></div>
            <div class="qtra-boundary-ring"></div>
            <div class="qtra-core ease-center"></div>
        </div>

        <div class="qtra-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Qubit Bandwidth &amp; Dynamic Load Balancing</span>
            <button class="ease-btn ease-btn-primary ease-btn-sm ease-hover-grow">Run Resource Allocator</button>
        </div>
    </div></body></html>
