<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Mesh Gradient: Velvet Smooth</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Full Screen Velvet Background Element -->
    <div class="velvet-bg-mesh">
        <div class="mesh-orb m1"></div>
        <div class="mesh-orb m2"></div>
        <div class="mesh-orb m3"></div>
        <div class="mesh-orb m4"></div>
    </div>

    <div class="container">
        <header class="header">
            <h1 class="velvet-text">Velvet Smooth Transitions</h1>
            <p>Hardware-accelerated CSS mesh gradients with deep, rich blending.</p>
        </header>

        <main class="grid">
            
            <!-- Floating Mesh Card -->
            <section class="demo-section">
                <div class="demo-content">
                    <h2>Interactive Mesh Card</h2>
                    <p>Hover to accelerate and shift the internal mesh gradient.</p>
                    
                    <div class="component-box dark-box">
                        <div class="mesh-card">
                            <div class="card-mesh-bg"></div>
                            <div class="card-content">
                                <h3>Deep Velvet</h3>
                                <p>Responsive blur blending.</p>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Gradient Button -->
            <section class="demo-section">
                <div class="demo-content">
                    <h2>Velvet Button</h2>
                    <p>A button with a continuously flowing gradient fill.</p>
                    
                    <div class="component-box dark-box">
                        <button class="btn btn-velvet">
                            <span>Experience</span>
                        </button>
                    </div>
                </div>
            </section>
            
        </main>
    </div>

</body>
</html>
