<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ease Kinetic Variable Font Typography</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght,slnt@8..144,100..1000,-10..0&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="ease-kinetic-body">
  <h1 class="ease-kinetic-text" id="kineticText">KINETIC TYPE</h1>

  <script>
    const text = document.getElementById('kineticText');
    document.addEventListener('mousemove', (e) => {
      const weight = Math.min(1000, Math.max(100, (e.clientX / window.innerWidth) * 1000));
      const slant = ((e.clientY / window.innerHeight) * -10).toFixed(1);
      text.style.fontVariationSettings = `'wght' ${weight}, 'slnt' ${slant}`;
    });
  </script>
</body>
</html>
