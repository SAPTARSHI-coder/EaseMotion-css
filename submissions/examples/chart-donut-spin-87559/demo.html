<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chart Donut Spin #87559 Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="donut-card">
    <div class="chart-header">
      <span class="chart-title">Resource Allocation</span>
      <span class="chart-badge">Live Metrics</span>
    </div>

    <div class="chart-stage">
      <svg class="donut-svg" viewBox="0 0 100 100" id="donutSvg">
        <circle class="donut-track" cx="50" cy="50" r="40"></circle>
        <circle class="donut-segment seg-1" data-label="Core Compute" data-val="48%" cx="50" cy="50" r="40"></circle>
        <circle class="donut-segment seg-2" data-label="Database" data-val="28%" cx="50" cy="50" r="40"></circle>
        <circle class="donut-segment seg-3" data-label="Storage" data-val="24%" cx="50" cy="50" r="40"></circle>
      </svg>

      <div class="center-readout">
        <span class="readout-value" id="readoutValue">100%</span>
        <span class="readout-label" id="readoutLabel">Capacity</span>
      </div>
    </div>

    <div class="legend-list">
      <div class="legend-item"><span class="legend-dot" style="background: var(--seg-blue)"></span>Compute (48%)</div>
      <div class="legend-item"><span class="legend-dot" style="background: var(--seg-purple)"></span>Database (28%)</div>
      <div class="legend-item"><span class="legend-dot" style="background: var(--seg-emerald)"></span>Storage (24%)</div>
    </div>

    <button class="btn-replay" id="replayBtn">Replay Animation</button>
  </div>

  <script>
    const svg = document.getElementById('donutSvg');
    const replayBtn = document.getElementById('replayBtn');
    const readoutVal = document.getElementById('readoutValue');
    const readoutLbl = document.getElementById('readoutLabel');
    const segments = document.querySelectorAll('.donut-segment');

    segments.forEach(seg => {
      seg.addEventListener('mouseenter', () => {
        readoutVal.textContent = seg.dataset.val;
        readoutLbl.textContent = seg.dataset.label;
      });
      seg.addEventListener('mouseleave', () => {
        readoutVal.textContent = '100%';
        readoutLbl.textContent = 'Capacity';
      });
    });

    replayBtn.addEventListener('click', () => {
      segments.forEach(seg => {
        seg.style.animation = 'none';
        seg.offsetHeight; /* Trigger reflow */
        seg.style.animation = '';
      });
    });
  </script>
</body>
</html>
