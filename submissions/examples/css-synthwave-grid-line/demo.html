<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Pure CSS animated synthwave grid line background"
  >
  <title>CSS Synthwave Grid Line</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="synthwave-scene" aria-label="Animated synthwave grid background">
    <div class="sun" aria-hidden="true">
      <span></span>
    </div>

    <div class="horizon-glow" aria-hidden="true"></div>

    <div class="grid-floor" aria-hidden="true">
      <div class="grid-lines horizontal"></div>
      <div class="grid-lines vertical"></div>
    </div>

    <section class="content">
      <p class="eyebrow">CSS Background Animation</p>
      <h1>Synthwave Grid</h1>
      <p>
        A retro-futuristic perspective grid animated entirely with
        HTML and vanilla CSS.
      </p>
    </section>
  </main>
</body>
</html>
