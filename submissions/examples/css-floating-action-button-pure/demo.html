<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Floating Action Button</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="layout-container">
        
        <header class="section-header">
            <h1 class="title">Floating Action Button</h1>
            <p class="subtitle">A pure CSS implementation of a Material Design FAB featuring a checkbox-driven expandable menu and an active ripple effect.</p>
        </header>

        <div class="demo-area">
            
            <!-- 
              [TECHNIQUE] The Checkbox Hack
              This hidden checkbox controls the state (open/closed) of the entire FAB menu.
            -->
            <input type="checkbox" id="fab-toggle" class="fab-checkbox" aria-label="Toggle floating action button menu">
            
            <div class="fab-container">
                
                <!-- The Expandable Menu Items -->
                <div class="fab-menu">
                    <button class="fab-item" aria-label="Create new document" data-tooltip="Document">
                        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                            <polyline points="14 2 14 8 20 8"></polyline>
                        </svg>
                    </button>
                    <button class="fab-item" aria-label="Add photo" data-tooltip="Photo">
                        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none">
                            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                            <circle cx="8.5" cy="8.5" r="1.5"></circle>
                            <polyline points="21 15 16 10 5 21"></polyline>
                        </svg>
                    </button>
                    <button class="fab-item" aria-label="Share" data-tooltip="Share">
                        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none">
                            <circle cx="18" cy="5" r="3"></circle>
                            <circle cx="6" cy="12" r="3"></circle>
                            <circle cx="18" cy="19" r="3"></circle>
                            <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
                            <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
                        </svg>
                    </button>
                </div>
                
                <!-- 
                  The Main FAB Trigger 
                  Tied to the checkbox via the "for" attribute.
                -->
                <label for="fab-toggle" class="fab-main">
                    <div class="fab-icon">
                        <!-- Plus icon that rotates into an X -->
                        <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                    </div>
                </label>
                
            </div>
            
        </div>
        
    </div>

</body>
</html>
