<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Responsive CSS property listing card with price, beds, area and location details."
  >
  <title>CSS Property Listing Card</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">
    <section class="property-card" aria-label="Property listing">

      <div class="property-image">
        <div class="image-content">
          <span class="property-tag">FOR SALE</span>
          <span class="property-icon" aria-hidden="true">⌂</span>
        </div>
      </div>

      <div class="property-content">
        <div class="property-top">
          <div>
            <p class="property-type">Modern Residence</p>
            <h1>Skyline Garden Villa</h1>
          </div>

          <button class="favorite" type="button" aria-label="Add property to favorites">
            ♡
          </button>
        </div>

        <p class="location">
          <span aria-hidden="true">●</span>
          Sector 62, Noida, India
        </p>

        <div class="property-details">
          <div class="detail">
            <span class="detail-icon" aria-hidden="true">🛏</span>
            <span>
              <strong>4</strong>
              <small>Beds</small>
            </span>
          </div>

          <div class="detail">
            <span class="detail-icon" aria-hidden="true">▣</span>
            <span>
              <strong>3</strong>
              <small>Baths</small>
            </span>
          </div>

          <div class="detail">
            <span class="detail-icon" aria-hidden="true">↔</span>
            <span>
              <strong>2,450</strong>
              <small>sq ft</small>
            </span>
          </div>
        </div>

        <div class="property-footer">
          <div class="price">
            <span>Starting from</span>
            <strong>₹1.85 Cr</strong>
          </div>

          <a href="#" class="view-button" aria-label="View Skyline Garden Villa details">
            View Property
            <span aria-hidden="true">→</span>
          </a>
        </div>
      </div>

    </section>
  </main>

</body>
</html>
