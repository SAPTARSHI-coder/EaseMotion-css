<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Zoom-In Popover - Cyberpunk Neon Layouts</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="cyberpunk-container">
    <div class="popover-wrapper">
      <!-- Checkbox for Popover Toggle -->
      <input type="checkbox" id="zoom-toggle" class="popover-toggle-input">
      
      <!-- Trigger Button -->
      <label for="zoom-toggle" class="cyber-btn" aria-haspopup="dialog" aria-expanded="false">
        INITIATE UPLINK
      </label>
      
      <!-- Popover Content -->
      <div class="zoom-popover" role="dialog" aria-label="Uplink Interface">
        <div class="popover-content">
          <div class="neon-ring"></div>
          <h3 class="neon-title">UPLINK CONNECTED</h3>
          <p class="neon-text">Biometric scan complete. Welcome back, user.</p>
          
          <div class="cyber-grid">
            <div class="grid-cell">VITALITY: <span>99%</span></div>
            <div class="grid-cell">ENERGY: <span>MAX</span></div>
            <div class="grid-cell">SHIELD: <span>ON</span></div>
            <div class="grid-cell">NETWORK: <span>SECURE</span></div>
          </div>
          
          <label for="zoom-toggle" class="close-btn" aria-label="Close popover">TERMINATE</label>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
