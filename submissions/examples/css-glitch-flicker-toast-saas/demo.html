<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Glitch-Flicker Toast — SaaS Showcase</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="ease-container">
    <p class="ease-eyebrow">System Alerts</p>
    <h1 class="ease-heading">Security Incident</h1>
    <p class="ease-subtitle">Toggle or hover the notification to trigger the cyber-glitch flicker effect.</p>

    <div class="ease-toast-wrapper">
      <input type="checkbox" id="ease-saas-glitch-toggle" class="ease-toast-input" checked />

      <label for="ease-saas-glitch-toggle" class="ease-trigger-btn">
        Toggle Alert Toast
      </label>

      <div class="ease-toast" data-text="Unauthorized Access Detected">
        <div class="ease-toast-badge">
          <span class="ease-badge-icon">⚠</span>
        </div>

        <div class="ease-toast-content">
          <p class="ease-toast-title" data-text="Unauthorized Access">Unauthorized Access</p>
          <p class="ease-toast-message">Suspicious IP address blocked from US-East gateway.</p>
        </div>

        <label for="ease-saas-glitch-toggle" class="ease-toast-close" title="Dismiss Alert">✕</label>
      </div>
    </div>
  </main>
</body>
</html>
