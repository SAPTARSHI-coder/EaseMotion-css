<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Origami Paper Fold text animation using pure HTML and CSS."
    >

    <title>Origami Paper Fold Text</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="demo">

        <section class="origami-card" aria-labelledby="origami-title">

            <span class="demo-label">CSS TEXT ANIMATION</span>

            <h1 id="origami-title" class="origami-text">
                <span class="word" aria-label="Origami">
                    <span class="letter" aria-hidden="true">O</span>
                    <span class="letter" aria-hidden="true">r</span>
                    <span class="letter" aria-hidden="true">i</span>
                    <span class="letter" aria-hidden="true">g</span>
                    <span class="letter" aria-hidden="true">a</span>
                    <span class="letter" aria-hidden="true">m</span>
                    <span class="letter" aria-hidden="true">i</span>
                </span>
            </h1>

            <p class="description">
                A paper-inspired folding text effect created entirely with CSS.
            </p>

        </section>

    </main>

</body>
</html>
