<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ease-animated-counter-badge-sap demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { height: 100vh; margin: 0; display: flex; flex-direction: column; gap: 16px; align-items: center; justify-content: center; background: #f4f4f5; }
    button { padding: 8px 16px; border-radius: 8px; border: none; background: #111; color: #fff; cursor: pointer; }
  </style>
</head>
<body>
  <div class="counter-badge-sap">
    <svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/></svg>
    <span class="cb-count" id="count">3</span>
  </div>
  <button id="addBtn">Add Notification</button>
  <script>
    const count = document.getElementById('count');
    document.getElementById('addBtn').addEventListener('click', () => {
      count.textContent = +count.textContent + 1;
      count.classList.remove('bump');
      void count.offsetWidth;
      count.classList.add('bump');
    });
  </script>
</body>
</html>
