<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Water Ripple – Ripples Spread Across Glass Surface</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <h1>💧 Water Ripple</h1>
    <p class="subtitle">Ripples spread across the glass surface</p>

    <div class="ripple-container">
      <div class="ripple-stage" id="rippleStage">
        <canvas id="canvas"></canvas>
        
        <!-- Info overlay -->
        <div class="info-overlay">
          <span class="ripple-status" id="rippleStatus">💧 Calm</span>
          <span class="ripple-count" id="rippleCount">✦ 0 ripples</span>
        </div>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <button class="ctrl-btn drop" id="dropBtn">💧 Drop</button>
      <button class="ctrl-btn clear" id="clearBtn">🗑️ Clear</button>
      <button class="ctrl-btn toggle" id="toggleBtn">⏸ Pause</button>
      <button class="ctrl-btn reset" id="resetBtn">↺ Reset</button>
    </div>

    <!-- Sliders -->
    <div class="slider-container">
      <span class="slider-label">Ripple Speed</span>
      <input type="range" id="speedSlider" min="1" max="10" value="5" />
      <span class="slider-value" id="speedValue">5×</span>
    </div>

    <div class="slider-container">
      <span class="slider-label">Ripple Size</span>
      <input type="range" id="sizeSlider" min="20" max="100" value="60" />
      <span class="slider-value" id="sizeValue">60%</span>
    </div>

    <div class="slider-container">
      <span class="slider-label">Wave Height</span>
      <input type="range" id="heightSlider" min="0" max="100" value="50" />
      <span class="slider-value" id="heightValue">50%</span>
    </div>

    <div class="slider-container">
      <span class="slider-label">Ripple Decay</span>
      <input type="range" id="decaySlider" min="0" max="100" value="30" />
      <span class="slider-value" id="decayValue">30%</span>
    </div>

    <!-- Status -->
    <div class="status" id="status">💧 Click Drop or tap the water to create ripples</div>

    <!-- Keyboard shortcuts -->
    <div class="shortcuts">
      <kbd>Click</kbd> Drop · <kbd>D</kbd> Drop · <kbd>C</kbd> Clear · <kbd>Space</kbd> Pause
    </div>
  </div>

  <script>
    (function() {
      "use strict";

      // DOM elements
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      const rippleStatus = document.getElementById('rippleStatus');
      const rippleCount = document.getElementById('rippleCount');
      const dropBtn = document.getElementById('dropBtn');
      const clearBtn = document.getElementById('clearBtn');
      const toggleBtn = document.getElementById('toggleBtn');
      const resetBtn = document.getElementById('resetBtn');
      const status = document.getElementById('status');
      const speedSlider = document.getElementById('speedSlider');
      const speedValue = document.getElementById('speedValue');
      const sizeSlider = document.getElementById('sizeSlider');
      const sizeValue = document.getElementById('sizeValue');
      const heightSlider = document.getElementById('heightSlider');
      const heightValue = document.getElementById('heightValue');
      const decaySlider = document.getElementById('decaySlider');
      const decayValue = document.getElementById('decayValue');

      // State
      let ripples = [];
      let isPaused = false;
      let animationId = null;
      let time = 0;

      // ----- Canvas setup -----
      function setupCanvas() {
        const rect = canvas.parentElement.getBoundingClientRect();
        const size = Math.min(rect.width - 40, 600);
        canvas.width = size;
        canvas.height = size;
        canvas.style.width = size + 'px';
        canvas.style.height = size + 'px';
      }

      // ----- Ripple class -----
      class Ripple {
        constructor(x, y) {
          this.x = x;
          this.y = y;
          this.radius = 5;
          this.maxRadius = Math.min(canvas.width, canvas.height) * 0.45 * (parseInt(sizeSlider.value) / 100);
          this.speed = 0.5 + parseInt(speedSlider.value) * 0.15;
          this.height = parseInt(heightSlider.value) / 100;
          this.decay = parseInt(decaySlider.value) / 100;
          this.opacity = 1;
          this.alive = true;
          this.waveCount = 3 + Math.floor(this.height * 3);
          this.wobble = 0;
          this.wobbleSpeed = 0.02 + Math.random() * 0.03;
          this.wobbleAmount = 1 + Math.random() * 2;
          this.phase = Math.random() * Math.PI * 2;
        }

        update() {
          this.radius += this.speed;
          this.wobble += this.wobbleSpeed;
          
          // Decay
          this.opacity *= (1 - this.decay * 0.005);
          
          if (this.radius > this.maxRadius || this.opacity < 0.01) {
            this.alive = false;
          }
        }

        draw(ctx) {
          const wobbleOffset = Math.sin(this.wobble) * this.wobbleAmount;
          const waveHeight = this.height * 20 * (1 - this.radius / this.maxRadius * 0.5);
          
          // Draw multiple wave rings
          for (let i = 0; i < this.waveCount; i++) {
            const waveRadius = this.radius - i * 4;
            if (waveRadius < 2) continue;
            
            const waveOpacity = this.opacity * (1 - i / this.waveCount * 0.3);
            const waveWidth = 1 + (1 - i / this.waveCount) * 2;
            
            // Ripple ring with wave effect
            ctx.save();
            
            // Glow
            ctx.shadowColor = `rgba(100, 200, 255, ${waveOpacity * 0.1})`;
            ctx.shadowBlur = 15;
            
            ctx.strokeStyle = `rgba(100, 200, 255, ${waveOpacity * 0.4})`;
            ctx.lineWidth = waveWidth;
            ctx.beginPath();
            
            // Draw wavy circle
            const segments = 60;
            for (let j = 0; j <= segments; j++) {
              const angle = (j / segments) * Math.PI * 2;
              const waveOffset = Math.sin(angle * 3 + time * 0.5 + this.phase + i * 0.5) * waveHeight * 0.3;
              const r = waveRadius + waveOffset + wobbleOffset * 0.2;
              const x = this.x + Math.cos(angle) * r;
              const y = this.y + Math.sin(angle) * r;
              if (j === 0) ctx.moveTo(x, y);
              else ctx.lineTo(x, y);
            }
            ctx.closePath();
            ctx.stroke();
            
            // Inner glow ring
            ctx.shadowBlur = 0;
            ctx.strokeStyle = `rgba(200, 240, 255, ${waveOpacity * 0.1})`;
            ctx.lineWidth = waveWidth * 0.3;
            ctx.beginPath();
            const innerR = waveRadius * 0.8;
            for (let j = 0; j <= segments; j++) {
              const angle = (j / segments) * Math.PI * 2;
              const waveOffset = Math.sin(angle * 4 + time * 0.7 + this.phase + i * 0.7) * waveHeight * 0.2;
              const r = innerR + waveOffset + wobbleOffset * 0.1;
              const x = this.x + Math.cos(angle) * r;
              const y = this.y + Math.sin(angle) * r;
              if (j === 0) ctx.moveTo(x, y);
              else ctx.lineTo(x, y);
            }
            ctx.closePath();
            ctx.stroke();
            
            ctx.restore();
          }

          // Center glow
          if (this.radius < this.maxRadius * 0.2) {
            const centerGlow = ctx.createRadialGradient(
              this.x, this.y, 0,
              this.x, this.y, this.radius * 0.5
            );
            centerGlow.addColorStop(0, `rgba(200, 240, 255, ${this.opacity * 0.2})`);
            centerGlow.addColorStop(1, `rgba(200, 240, 255, 0)`);
            ctx.fillStyle = centerGlow;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius * 0.5, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      }

      // ----- Create ripple -----
      function createRipple(x, y) {
        const ripple = new Ripple(x, y);
        ripples.push(ripple);
        if (ripples.length > 50) {
          ripples.shift();
        }
        rippleCount.textContent = `✦ ${ripples.length} ripples`;
        status.textContent = `💧 Ripple at (${Math.round(x)}, ${Math.round(y)})`;
        rippleStatus.textContent = '💧 Rippling';
        setTimeout(() => {
          if (ripples.length === 0) {
            rippleStatus.textContent = '💧 Calm';
          }
        }, 2000);
      }

      // ----- Random drop -----
      function randomDrop() {
        const w = canvas.width;
        const h = canvas.height;
        const padding = 40;
        const x = padding + Math.random() * (w - padding * 2);
        const y = padding + Math.random() * (h - padding * 2);
        createRipple(x, y);
      }

      // ----- Clear ripples -----
      function clearRipples() {
        ripples = [];
        rippleCount.textContent = '✦ 0 ripples';
        rippleStatus.textContent = '💧 Calm';
        status.textContent = '🗑️ Ripples cleared';
        setTimeout(() => {
          status.textContent = '💧 Click Drop or tap the water to create ripples';
        }, 1000);
      }

      // ----- Toggle pause -----
      function togglePause() {
        isPaused = !isPaused;
        toggleBtn.textContent = isPaused ? '▶ Play' : '⏸ Pause';
        status.textContent = isPaused ? '⏸ Paused' : '▶ Resumed';
        rippleStatus.textContent = isPaused ? '⏸ Paused' : '💧 Calm';
      }

      // ----- Reset -----
      function resetRipples() {
        ripples = [];
        isPaused = false;
        toggleBtn.textContent = '⏸ Pause';
        rippleStatus.textContent = '💧 Calm';
        rippleCount.textContent = '✦ 0 ripples';
        speedSlider.value = 5;
        speedValue.textContent = '5×';
        sizeSlider.value = 60;
        sizeValue.textContent = '60%';
        heightSlider.value = 50;
        heightValue.textContent = '50%';
        decaySlider.value = 30;
        decayValue.textContent = '30%';
        status.textContent = '↺ Reset';
        setTimeout(() => {
          status.textContent = '💧 Click Drop or tap the water to create ripples';
        }, 500);
      }

      // ----- Draw water background -----
      function drawWater() {
        const w = canvas.width;
        const h = canvas.height;
        const cx = w / 2;
        const cy = h / 2;

        // Water gradient
        const waterGradient = ctx.createRadialGradient(cx, cy, 0, cx, cy, w * 0.8);
        waterGradient.addColorStop(0, '#0a2a4a');
        waterGradient.addColorStop(0.3, '#0a1f3a');
        waterGradient.addColorStop(0.7, '#06152a');
        waterGradient.addColorStop(1, '#030a18');
        ctx.fillStyle = waterGradient;
        ctx.fillRect(0, 0, w, h);

        // Water surface texture (subtle caustics)
        for (let i = 0; i < 40; i++) {
          const seed = i * 137.508;
          const x = (seed * 0.618) % w;
          const y = (seed * 0.381) % h;
          const size = 15 + (seed % 35);
          const alpha = 0.01 + (seed % 100) / 100 * 0.03;
          const offset = Math.sin(x * 0.01 + y * 0.02 + time * 0.3) * 8;
          
          ctx.fillStyle = `rgba(100, 200, 255, ${alpha})`;
          ctx.beginPath();
          ctx.ellipse(x + offset, y + offset * 0.5, size, size * 0.2, x * 0.01, 0, Math.PI * 2);
          ctx.fill();
        }

        // Ambient ripples
        for (let i = 0; i < 10; i++) {
          const seed = i * 73.189;
          const x = (seed * 0.718) % w;
          const y = (seed * 0.482) % h;
          const radius = 30 + (seed % 50);
          const alpha = 0.01 + (seed % 100) / 100 * 0.02;
          const phase = time * 0.2 + seed;
          
          ctx.strokeStyle = `rgba(100, 200, 255, ${alpha})`;
          ctx.lineWidth = 0.5;
          ctx.beginPath();
          ctx.arc(x + Math.sin(phase) * 15, y + Math.cos(phase * 0.7) * 15, radius + Math.sin(phase * 0.5) * 8, 0, Math.PI * 2);
          ctx.stroke();
        }

        // Draw ripples
        if (!isPaused) {
          ripples = ripples.filter(r => r.alive);
          ripples.forEach(r => r.update());
        }
        ripples.forEach(r => r.draw(ctx));

        // Update count
        rippleCount.textContent = `✦ ${ripples.length} ripples`;
        if (ripples.length === 0 && !isPaused) {
          rippleStatus.textContent = '💧 Calm';
        }
      }

      // ----- Animation loop -----
      function animate() {
        time += 0.016;
        drawWater();
        animationId = requestAnimationFrame(animate);
      }

      // ----- Start animation -----
      function startAnimation() {
        if (animationId) {
          cancelAnimationFrame(animationId);
        }
        animate();
      }

      // ----- Event Listeners -----
      // Mouse clicks
      canvas.addEventListener('click', (e) => {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        const x = (e.clientX - rect.left) * scaleX;
        const y = (e.clientY - rect.top) * scaleY;
        createRipple(x, y);
      });

      // Touch support
      canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        const touch = e.touches[0];
        const x = (touch.clientX - rect.left) * scaleX;
        const y = (touch.clientY - rect.top) * scaleY;
        createRipple(x, y);
      });

      // Buttons
      dropBtn.addEventListener('click', randomDrop);
      clearBtn.addEventListener('click', clearRipples);
      toggleBtn.addEventListener('click', togglePause);
      resetBtn.addEventListener('click', resetRipples);

      // Sliders
      speedSlider.addEventListener('input', (e) => {
        speedValue.textContent = e.target.value + '×';
        // Update existing ripples' speed
        ripples.forEach(r => {
          r.speed = 0.5 + parseInt(e.target.value) * 0.15;
        });
      });

      sizeSlider.addEventListener('input', (e) => {
        sizeValue.textContent = e.target.value + '%';
      });

      heightSlider.addEventListener('input', (e) => {
        heightValue.textContent = e.target.value + '%';
        ripples.forEach(r => {
          r.height = parseInt(e.target.value) / 100;
          r.waveCount = 3 + Math.floor(r.height * 3);
        });
      });

      decaySlider.addEventListener('input', (e) => {
        decayValue.textContent = e.target.value + '%';
        ripples.forEach(r => {
          r.decay = parseInt(e.target.value) / 100;
        });
      });

      // Keyboard shortcuts
      document.addEventListener('keydown', (e) => {
        if (e.key === 'd' || e.key === 'D') {
          e.preventDefault();
          randomDrop();
        }
        if (e.key === 'c' || e.key === 'C') {
          e.preventDefault();
          clearRipples();
        }
        if (e.key === ' ' || e.key === 'Space') {
          e.preventDefault();
          togglePause();
        }
        if (e.key === 'r' || e.key === 'R') {
          e.preventDefault();
          resetRipples();
        }
      });

      // ----- Resize handler -----
      let resizeTimeout;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(() => {
          setupCanvas();
        }, 200);
      });

      // ----- Init -----
      function init() {
        setupCanvas();
        startAnimation();
        status.textContent = '💧 Click Drop or tap the water to create ripples!';
        // Create initial ripples
        setTimeout(() => {
          const w = canvas.width;
          const h = canvas.height;
          const cx = w / 2;
          const cy = h / 2;
          createRipple(cx - 60, cy);
          setTimeout(() => createRipple(cx + 60, cy), 400);
          setTimeout(() => createRipple(cx, cy - 60), 800);
          setTimeout(() => createRipple(cx, cy + 60), 1200);
        }, 500);
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }

    })();
  </script>
</body>
</html>
