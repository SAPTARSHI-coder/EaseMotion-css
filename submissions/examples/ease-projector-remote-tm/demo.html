<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Projector Remote | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="prwrap">
    <div class="prremote">
      <div class="prscreen">HDMI 1 / 1080p</div>
      <button class="prpower" type="button" aria-label="Power"></button>
      <div class="prpad">
        <button class="prbtn" type="button">1</button>
        <button class="prbtn" type="button">2</button>
        <button class="prbtn" type="button">3</button>
        <button class="prbtn" type="button">4</button>
        <button class="prbtn" type="button">5</button>
        <button class="prbtn" type="button">6</button>
        <button class="prbtn" type="button">7</button>
        <button class="prbtn" type="button">8</button>
        <button class="prbtn prbtn-accent" type="button">M</button>
      </div>
      <div class="prnav">
        <button class="prnav-btn" type="button">&#8592;</button>
        <button class="prnav-btn" type="button">&#8593;</button>
        <button class="prnav-btn" type="button">&#8594;</button>
        <button class="prnav-btn" type="button">&#9776;</button>
        <button class="prnav-btn prnav-center" type="button">OK</button>
        <button class="prnav-btn" type="button">&#128465;</button>
        <button class="prnav-btn" type="button">&#8634;</button>
        <button class="prnav-btn" type="button">&#8595;</button>
        <button class="prnav-btn" type="button">&#8635;</button>
      </div>
    </div>
  </div>
</body>
</html>
