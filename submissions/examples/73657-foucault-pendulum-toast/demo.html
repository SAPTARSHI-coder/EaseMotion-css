<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark light">
  <title>Foucault Pendulum Toast</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="demo">
    <section class="toast" role="status" aria-live="polite">
      <div class="pendulum" aria-hidden="true">
        <span class="pendulum-string"></span>
        <span class="pendulum-bob"></span>
      </div>

      <div class="toast-content">
        <div class="toast-icon" aria-hidden="true">✓</div>

        <div class="toast-copy">
          <p class="toast-label">SYSTEM UPDATE</p>
          <h1>Motion detected</h1>
          <p class="toast-message">
            The pendulum is swinging smoothly.
          </p>
        </div>

        <button class="toast-close" type="button" aria-label="Dismiss notification">
          ×
        </button>
      </div>
    </section>
  </main>

</body>
</html>
