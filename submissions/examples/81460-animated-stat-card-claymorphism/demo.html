<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Animated stat card with soft claymorphism styling built using pure CSS."
  >

  <title>Animated Stat Card — Claymorphism</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="page">

    <section
      class="stats-section"
      aria-labelledby="stats-title"
    >

      <header class="stats-heading">
        <span class="stats-heading__eyebrow">
          PERFORMANCE OVERVIEW
        </span>

        <h1 id="stats-title">
          Team analytics
        </h1>

        <p>
          A soft claymorphic stat card with subtle CSS motion.
        </p>
      </header>

      <div class="stats-grid">

        <!-- Stat Card -->
        <article class="stat-card">

          <span
            class="stat-card__blob stat-card__blob--one"
            aria-hidden="true"
          ></span>

          <span
            class="stat-card__blob stat-card__blob--two"
            aria-hidden="true"
          ></span>

          <div class="stat-card__header">

            <div
              class="stat-card__icon"
              aria-hidden="true"
            >
              ↗
            </div>

            <span class="stat-card__badge">
              +18.6%
            </span>

          </div>

          <div class="stat-card__content">

            <p class="stat-card__label">
              Monthly Revenue
            </p>

            <p
              class="stat-card__value"
              aria-label="Eighty four thousand two hundred forty dollars"
            >
              <span class="stat-card__currency">$</span>84.2K
            </p>

            <p class="stat-card__comparison">
              <span class="stat-card__trend">
                ↑
              </span>

              18.6% from last month
            </p>

          </div>

          <div
            class="stat-card__sparkline"
            aria-hidden="true"
          >
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
          </div>

        </article>

      </div>

    </section>

  </main>

</body>
</html>
