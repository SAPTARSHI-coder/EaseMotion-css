<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Glossy iOS-style CSS icon buttons with gradient and shine effects."
  >
  <title>CSS Glossy Icon Button</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">
    <section class="demo" aria-labelledby="title">

      <span class="eyebrow">Pure CSS Component</span>
      <h1 id="title">Glossy Icon Buttons</h1>
      <p class="intro">
        iOS-inspired buttons with gradients, reflections, and smooth interactions.
      </p>

      <div class="button-grid">

        <button class="glossy-button blue" type="button" aria-label="Home">
          <span class="shine" aria-hidden="true"></span>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 10.8 12 3l9 7.8v8.2a2 2 0 0 1-2 2h-5v-6H10v6H5a2 2 0 0 1-2-2z"/>
          </svg>
        </button>

        <button class="glossy-button purple" type="button" aria-label="Heart">
          <span class="shine" aria-hidden="true"></span>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20.8 8.7c0 5.2-8.8 11.1-8.8 11.1S3.2 13.9 3.2 8.7A4.7 4.7 0 0 1 12 6.2a4.7 4.7 0 0 1 8.8 2.5z"/>
          </svg>
        </button>

        <button class="glossy-button green" type="button" aria-label="Check">
          <span class="shine" aria-hidden="true"></span>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m5 12 4.2 4.2L19 6.5"/>
          </svg>
        </button>

        <button class="glossy-button orange" type="button" aria-label="Star">
          <span class="shine" aria-hidden="true"></span>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-2.9-5.6 2.9 1.1-6.2L3 9.6l6.2-.9z"/>
          </svg>
        </button>

      </div>

      <p class="hint">Hover or focus a button</p>

    </section>
  </main>

</body>
</html>
