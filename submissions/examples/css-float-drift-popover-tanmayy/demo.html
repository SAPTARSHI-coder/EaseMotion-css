<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Float-Drift Popover - EaseMotion CSS</title>
  <!-- Import EaseMotion CSS -->
  <link rel="stylesheet" href="../../../easemotion.css">
  <!-- Component Specific Styles -->
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body class="checkout-bg">

  <div class="demo-container">
    
    <div class="checkout-panel ease-glass-card">
      <div class="checkout-header">
        <h2 class="ease-text-xl">Payment Details</h2>
      </div>

      <div class="checkout-form">
        <!-- Mock form fields to set the scene -->
        <div class="form-group">
          <label>Card Number</label>
          <div class="mock-input">**** **** **** 4242</div>
        </div>
        
        <div class="form-row">
          <div class="form-group">
            <label>Expiry Date</label>
            <div class="mock-input">12/26</div>
          </div>
          
          <div class="form-group">
            <label class="label-with-popover">
              Security Code
              
              <!-- Float-Drift Popover Component -->
              <div class="popover-wrapper" tabindex="0">
                <button class="info-icon" aria-label="What is this?" type="button">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
                </button>
                
                <!-- The Popover Content -->
                <div class="float-drift-popover popover-top">
                  <div class="popover-header">Where to find it</div>
                  <div class="popover-body">
                    <p>The CVV is the 3-digit number located on the back of your card, usually near the signature panel.</p>
                  </div>
                  <div class="popover-arrow"></div>
                </div>
              </div>

            </label>
            <div class="mock-input">***</div>
          </div>
        </div>
      </div>
      
      <div class="checkout-footer">
        <div class="total-row">
          <span>Total</span>
          
          <!-- Another Popover Example for Order Summary -->
          <div class="popover-wrapper" tabindex="0">
            <span class="total-price popover-trigger">$142.50</span>
            
            <div class="float-drift-popover popover-left">
              <div class="popover-header">Order Summary</div>
              <div class="popover-body">
                <div class="summary-line">
                  <span>Subtotal</span>
                  <span>$129.00</span>
                </div>
                <div class="summary-line">
                  <span>Shipping</span>
                  <span>$5.00</span>
                </div>
                <div class="summary-line">
                  <span>Tax</span>
                  <span>$8.50</span>
                </div>
              </div>
              <div class="popover-arrow"></div>
            </div>
          </div>
          
        </div>
        
        <button class="pay-btn ease-squish-button">Pay Now</button>
      </div>
    </div>

  </div>

</body>
</html>
