<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animated Image Reveal Effect Gallery - Issue #87414</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="ease-reveal-stage" id="reveal-stage" aria-labelledby="stage-title">
    <div class="ease-reveal-header">
      <h1 id="stage-title" class="ease-reveal-title">Image Reveal Effects</h1>
      <p class="ease-reveal-desc">CSS-only image reveal animations featuring horizontal, vertical, diagonal, and clip-path techniques.</p>
    </div>

    <div class="ease-reveal-grid">
      <!-- Card 1: Horizontal Slide -->
      <div class="ease-reveal-card">
        <div class="ease-reveal-media reveal-horizontal">
          <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=500&auto=format&fit=crop&q=60" alt="Abstract 3D Shape">
        </div>
        <div class="ease-reveal-caption">Horizontal Slide</div>
      </div>

      <!-- Card 2: Vertical Slide -->
      <div class="ease-reveal-card">
        <div class="ease-reveal-media reveal-vertical">
          <img src="https://images.unsplash.com/photo-1634017839464-5c339ebe3cb4?w=500&auto=format&fit=crop&q=60" alt="Neon Gradient">
        </div>
        <div class="ease-reveal-caption">Vertical Slide</div>
      </div>

      <!-- Card 3: Diagonal Slice -->
      <div class="ease-reveal-card">
        <div class="ease-reveal-media reveal-diagonal">
          <img src="https://images.unsplash.com/photo-1620641788421-7a1c342ea42e?w=500&auto=format&fit=crop&q=60" alt="Cyberpunk Aesthetic">
        </div>
        <div class="ease-reveal-caption">Diagonal Slice</div>
      </div>

      <!-- Card 4: Clip-Path Circle Zoom -->
      <div class="ease-reveal-card">
        <div class="ease-reveal-media reveal-clip-circle">
          <img src="https://images.unsplash.com/photo-1633167606207-d840b5070fc2?w=500&auto=format&fit=crop&q=60" alt="Minimalist Geometry">
        </div>
        <div class="ease-reveal-caption">Clip-Path Circle</div>
      </div>
    </div>

    <button type="button" class="ease-btn-reveal" id="replay-btn">Replay Reveal Animations</button>
  </main>

  <script>
    const stage = document.getElementById('reveal-stage');
    const replayBtn = document.getElementById('replay-btn');

    replayBtn.addEventListener('click', () => {
      stage.classList.add('is-animating');
      void stage.offsetWidth; // Trigger DOM reflow
      stage.classList.remove('is-animating');
    });
  </script>
</body>
</html>
