<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Loader: Retro Arcade Pixel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="layout-container">
        
        <header class="section-header">
            <h1 class="title">Pure CSS Loader: Retro Arcade Pixel</h1>
            <p class="subtitle">An 8-bit inspired loading bar utilizing CSS stepped keyframes and box-shadow pixel art to simulate a classic arcade "Insert Coin" experience.</p>
        </header>

        <div class="demo-area">
            
            <div class="loader-container" aria-label="Loading content, retro arcade pixel animation playing">
                
                <!-- 
                  [TECHNIQUE] Retro Arcade Pixel
                  The track is a chunky block, and the fill is an animated block.
                -->
                <div class="pixel-track" aria-hidden="true">
                    
                    <!-- The 8-bit filling block -->
                    <div class="pixel-fill"></div>
                    
                    <!-- The blinking cursor/character -->
                    <div class="pixel-cursor"></div>
                    
                </div>
                
                <div class="loading-text">INSERT COIN<span class="blink">_</span></div>
                
            </div>
            
        </div>
        
    </div>

</body>
</html>
