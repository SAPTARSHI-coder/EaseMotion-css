<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Bounce-Pulse Badge - Gaming Hub Showcase</title>
  <link rel="stylesheet" href="../../../easemotion.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="gaming-layout" role="main">
    <article class="gaming-card" tabindex="0" aria-labelledby="server-name">
      
      <header class="card-header">
        <h1 id="server-name" class="server-title">CYBERNEXUS // 2099</h1>
        <!-- Primary Bounce-Pulse Badge -->
        <span class="ease-badge-bounce-pulse badge-emerald" role="status">
          <span class="badge-dot" aria-hidden="true"></span>
          LIVE 240 FPS
        </span>
      </header>

      <div class="card-body">
        <div class="status-row">
          <span class="status-label">Tournament Status</span>
          <!-- Secondary Bounce-Pulse Badge with delay -->
          <span class="ease-badge-bounce-pulse badge-cyan delay-1">
            OPEN LOBBY
          </span>
        </div>

        <div class="status-row">
          <span class="status-label">Rank Requirement</span>
          <span class="ease-badge-bounce-pulse badge-purple">
            MYTHIC TIER
          </span>
        </div>

        <div class="status-row">
          <span class="status-label">Active Players</span>
          <span style="font-family: monospace; font-weight: 700; color: #fff;">14,280 / 15,000</span>
        </div>
      </div>

      <footer class="card-footer">
        <button class="btn-cyber">Join Match ➔</button>
      </footer>

    </article>
  </main>
</body>
</html>
