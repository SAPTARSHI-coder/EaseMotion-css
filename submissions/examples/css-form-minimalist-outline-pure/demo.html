<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Form: Minimalist Outline</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div class="form-wrapper">
            <header class="header">
                <h1 class="title">Get in touch</h1>
                <p>Pure CSS minimalist outline form with smooth label transitions.</p>
            </header>

            <form class="minimal-form" action="#" method="POST">
                
                <!-- Input Group: Name -->
                <div class="input-group">
                    <input type="text" id="fname" name="fname" class="outline-input" placeholder=" " required>
                    <label for="fname" class="outline-label">Full Name</label>
                    <div class="outline-border"></div>
                </div>

                <!-- Input Group: Email -->
                <div class="input-group">
                    <input type="email" id="email" name="email" class="outline-input" placeholder=" " required>
                    <label for="email" class="outline-label">Email Address</label>
                    <div class="outline-border"></div>
                </div>

                <!-- Input Group: Message (Textarea) -->
                <div class="input-group">
                    <textarea id="message" name="message" class="outline-input outline-textarea" placeholder=" " required></textarea>
                    <label for="message" class="outline-label">Your Message</label>
                    <div class="outline-border"></div>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="submit-btn">Send Message</button>
                
            </form>
        </div>
    </div>

</body>
</html>
