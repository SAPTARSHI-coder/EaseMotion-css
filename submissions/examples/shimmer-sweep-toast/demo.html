<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
        name="description"
        content="CSS Shimmer-Sweep Toast for fintech dashboard layouts"
    >
    <title>Shimmer-Sweep Toast</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="demo-page">
        <section class="toast-demo" aria-label="Shimmer sweep toast example">

            <div class="toast" role="status">
                <div class="toast-icon" aria-hidden="true">
                    ✓
                </div>

                <div class="toast-content">
                    <span class="toast-label">Payment Successful</span>
                    <strong>$3,280.00</strong>
                    <p>Your transaction was completed securely.</p>
                </div>

                <button
                    class="toast-close"
                    type="button"
                    aria-label="Close notification"
                >
                    ×
                </button>
            </div>

            <p class="hint">
                A CSS-only toast with a subtle shimmer sweep.
            </p>

        </section>
    </main>

</body>
</html>
