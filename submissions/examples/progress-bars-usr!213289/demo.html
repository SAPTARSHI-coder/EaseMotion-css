<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animated Progress Bars - EaseMotion Submission</title>
  
  <!-- EaseMotion CSS Official CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="container ease-fade-in">
    <h1 class="ease-slide-up">My Skills</h1>
    <p class="ease-slide-up ease-delay-100">Animated progress bars using EaseMotion CSS</p>
    
    <div class="progress-container ease-slide-up ease-delay-200">
      
      <!-- HTML/CSS -->
      <div class="progress-item">
        <div class="progress-label">
          <span>HTML & CSS</span>
          <span class="progress-value">95%</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill ease-progress-fill" data-width="95"></div>
        </div>
      </div>

      <!-- JavaScript -->
      <div class="progress-item">
        <div class="progress-label">
          <span>JavaScript</span>
          <span class="progress-value">85%</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill ease-progress-fill" data-width="85"></div>
        </div>
      </div>

      <!-- React -->
      <div class="progress-item">
        <div class="progress-label">
          <span>React</span>
          <span class="progress-value">75%</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill ease-progress-fill" data-width="75"></div>
        </div>
      </div>

      <!-- Node.js -->
      <div class="progress-item">
        <div class="progress-label">
          <span>Node.js</span>
          <span class="progress-value">70%</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill ease-progress-fill" data-width="70"></div>
        </div>
      </div>

    </div>
  </div>

  <!-- Minimal JS to trigger animation on scroll -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const progressBars = document.querySelectorAll('.ease-progress-fill');
      
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            const width = entry.target.getAttribute('data-width');
            entry.target.style.width = width + '%';
          }
        });
      }, { threshold: 0.5 });

      progressBars.forEach(bar => observer.observe(bar));
    });
  </script>

</body>
</html>
