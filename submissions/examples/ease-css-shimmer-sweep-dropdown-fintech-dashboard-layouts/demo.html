<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shimmer Sweep Dropdown - Fintech Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="dashboard">

    <section class="hero">
        <span class="badge">
            FINTECH ANALYTICS
        </span>

        <h1>
            Shimmer-Sweep
            <span>Dropdown System</span>
        </h1>

        <p>
            A futuristic CSS-only dropdown component
            designed for modern financial dashboards.
        </p>
    </section>


    <section class="dropdown-card">

        <input type="checkbox" id="dropdown">


        <label class="dropdown-toggle" for="dropdown">

            <div>
                <h3>
                    Account Overview
                </h3>

                <small>
                    View financial insights
                </small>
            </div>

            <span class="arrow">
                ↓
            </span>

        </label>



        <div class="menu">


            <article>

                <div>
                    <h4>
                        Total Balance
                    </h4>

                    <p>
                        Current account value
                    </p>
                </div>

                <strong>
                    $128,540
                </strong>

            </article>



            <article>

                <div>
                    <h4>
                        Monthly Growth
                    </h4>

                    <p>
                        Revenue performance
                    </p>
                </div>

                <strong>
                    +24.8%
                </strong>

            </article>



            <article>

                <div>
                    <h4>
                        Transactions
                    </h4>

                    <p>
                        Completed payments
                    </p>
                </div>

                <strong>
                    8,420
                </strong>

            </article>


        </div>


    </section>


</main>


</body>
</html>
