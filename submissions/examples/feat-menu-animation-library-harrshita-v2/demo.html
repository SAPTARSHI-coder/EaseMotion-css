<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animation Library - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
        font-family: system-ui, sans-serif;
        padding: 2rem;
        max-width: 800px;
        margin: 0 auto;
        background: #020617;
        color: #f1f5f9;
        line-height: 1.5;
    }
    .demo-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 1.5rem;
        margin-block-start: 2rem;
    }
    .anim-card {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 10px;
        padding: 1.5rem;
        text-align: center;
    }
    .anim-card h3 { margin: 0 0 0.5rem; font-size: 0.875rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.08em; }
    .anim-target {
        width: 60px;
        height: 60px;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        border-radius: 12px;
        margin: 1rem auto 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.5rem;
    }
    .instructions {
        background: #1e293b;
        padding: 1.25rem 1.5rem;
        border-inline-start: 4px solid #3b82f6;
        border-radius: 0 8px 8px 0;
        color: #93c5fd;
        margin-block-end: 2rem;
        font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>ease-menu Animation Library</h1>

    <div class="instructions">
        All animations use only <code>transform</code> and <code>opacity</code> to stay on the GPU compositor thread. They automatically disable when the user has <strong>prefers-reduced-motion: reduce</strong> enabled.
    </div>

    <div class="ease-menu-anim-harrshita-v2">
      <div class="demo-grid">

        <div class="anim-card">
          <h3>Fade Up</h3>
          <div class="anim-target anim-fade-up">✨</div>
        </div>

        <div class="anim-card">
          <h3>Scale In</h3>
          <div class="anim-target anim-scale-in delay-1">🎯</div>
        </div>

        <div class="anim-card">
          <h3>Pulse</h3>
          <div class="anim-target anim-pulse">💓</div>
        </div>

        <div class="anim-card">
          <h3>Spin</h3>
          <div class="anim-target"><span class="anim-spin">⚙️</span></div>
        </div>

        <div class="anim-card">
          <h3>Shimmer</h3>
          <div class="anim-target anim-shimmer"></div>
        </div>

        <div class="anim-card">
          <h3>Stagger</h3>
          <div class="anim-target anim-fade-up delay-3">🚀</div>
        </div>

      </div>
    </div>
  </main>
</body>
</html>
