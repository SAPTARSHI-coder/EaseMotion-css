<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Butter Churn Dasher — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Butter Churn Dasher demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Butter Churn Dasher</h1>
      <p class="lede">Butter churn dasher plunging through cream</p>
    </header>

    <section class="ease-butter-churn-dasher" data-demo="butter-churn-dasher" aria-live="polite">
      <div class="ease-butter-churn-dasher__housing">
        <div class="ease-butter-churn-dasher__bezel">
          <div class="ease-butter-churn-dasher__face">
            <div class="ease-butter-churn-dasher__readout">
              <span class="ease-butter-churn-dasher__label">Butter Churn Dasher</span>
              <span class="ease-butter-churn-dasher__value">LIVE</span>
            </div>
            <div class="ease-butter-churn-dasher__motion" aria-hidden="true">
              <span class="ease-butter-churn-dasher__a"></span>
              <span class="ease-butter-churn-dasher__b"></span>
              <span class="ease-butter-churn-dasher__c"></span>
              <span class="ease-butter-churn-dasher__d"></span>
            </div>
            <div class="ease-butter-churn-dasher__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-butter-churn-dasher__controls">
          <button type="button" class="ease-butter-churn-dasher__btn primary">Engage</button>
          <button type="button" class="ease-butter-churn-dasher__btn">Reset</button>
          <label class="ease-butter-churn-dasher__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-butter-churn-dasher__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
