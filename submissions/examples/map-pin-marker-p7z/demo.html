<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="./style.css">
<title>CSS Map Pin Marker Demo</title>
</head>
<body>
<div class="mpm-container" role="region" aria-label="Interactive Map Location Demo">
  <div class="mpm-marker" tabindex="0" role="button" aria-label="Location Marker: Central Station">
    <div class="mpm-pin">
      <div class="mpm-pin-inner"></div>
    </div>
    <div class="mpm-pulse"></div>
    <div class="mpm-shadow"></div>
  </div>
</div>
</body>
</html>
