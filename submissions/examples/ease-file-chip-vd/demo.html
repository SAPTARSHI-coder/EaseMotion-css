<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ease File Chip</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="file-list">

    <div class="file-chip">
        <div class="file-icon">📄</div>

        <div class="file-info">
            <span class="filename">project-report</span>
            <span class="extension">PDF</span>
        </div>
    </div>

    <div class="file-chip">
        <div class="file-icon">📄</div>

        <div class="file-info">
            <span class="filename">design-system</span>
            <span class="extension">CSS</span>
        </div>
    </div>

</div>

</body>
</html>
