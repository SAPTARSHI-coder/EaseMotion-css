<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Starfield Background - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Starfield Background Layers -->
    <div class="em-starfield" aria-hidden="true">
        <div class="em-stars-sm"></div>
        <div class="em-stars-md"></div>
        <div class="em-stars-lg"></div>
    </div>

    <div class="em-starfield-page">
        <div class="em-card" tabindex="0" role="region" aria-label="Starfield Background Showcase">
            <span class="em-card-badge">IMMERSIVE COSMOS</span>
            <h1 class="em-card-title">CSS Starfield Background</h1>
            <p class="em-card-desc">Twinkling multi-layered starfield animation crafted entirely with pure CSS box-shadows and keyframe opacity pulses.</p>
            <a href="#" class="em-card-btn" role="button">Explore Galaxy</a>
        </div>
    </div>
</body>
</html>
