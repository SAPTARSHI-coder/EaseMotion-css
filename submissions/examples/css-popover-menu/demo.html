<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Popover Menu - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="em-popover-page">
        <div class="em-card" role="region" aria-label="HTML Popover Menu Showcase">
            <span class="em-card-badge">HTML POPOVER API</span>
            <h1 class="em-card-title">CSS Popover Menu</h1>
            <p class="em-card-desc">Native HTML popover attribute styled seamlessly with CSS transitions and modern backdrop layers.</p>
            
            <!-- Popover Trigger Button -->
            <button class="em-popover-btn" popovertarget="em-user-popover" aria-expanded="false">
                Open Menu ▾
            </button>

            <!-- Native HTML Popover Element -->
            <div id="em-user-popover" popover class="em-popover-menu">
                <div class="em-popover-header">
                    <span class="em-popover-user">John Stewartsson</span>
                    <span class="em-popover-email">john@easemotion.dev</span>
                </div>
                <div class="em-popover-divider"></div>
                <ul class="em-popover-list" role="menu">
                    <li role="none"><a href="#" role="menuitem" class="em-popover-item">Profile Settings</a></li>
                    <li role="none"><a href="#" role="menuitem" class="em-popover-item">Workspace Dashboard</a></li>
                    <li role="none"><a href="#" role="menuitem" class="em-popover-item">Billing & Plan</a></li>
                </ul>
                <div class="em-popover-divider"></div>
                <button class="em-popover-item em-logout" popovertarget="em-user-popover" popovertargetaction="hide">
                    Sign Out
                </button>
            </div>
        </div>
    </div>
</body>
</html>
