<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Parallax Relic</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <main class="page">

    <header class="intro">
      <span class="eyebrow">ARCHIVE OBJECT // 07</span>

      <h1>
        Parallax <span>Relic</span>
      </h1>

      <p>
        A layered artifact that reveals its depth as you move around it.
      </p>
    </header>


    <section
      class="relic-stage"
      id="relic"
      aria-label="Interactive futuristic relic"
    >

      <div class="corner corner-tl"></div>
      <div class="corner corner-tr"></div>
      <div class="corner corner-bl"></div>
      <div class="corner corner-br"></div>


      <div class="relic"
           data-depth="0.25">

        <div class="relic-frame"></div>


        <div class="relic-background"
             data-depth="0.4">

          <div class="grid-lines"></div>

          <div class="noise"></div>

        </div>


        <div class="particles"
             data-depth="0.8">

          <span style="--x: 18%; --y: 24%;"></span>
          <span style="--x: 74%; --y: 18%;"></span>
          <span style="--x: 84%; --y: 61%;"></span>
          <span style="--x: 23%; --y: 72%;"></span>
          <span style="--x: 52%; --y: 15%;"></span>
          <span style="--x: 68%; --y: 83%;"></span>
          <span style="--x: 38%; --y: 88%;"></span>
          <span style="--x: 11%; --y: 49%;"></span>

        </div>


        <div class="symbols"
             data-depth="1.2">

          <span class="symbol symbol-a">◇</span>
          <span class="symbol symbol-b">⌁</span>
          <span class="symbol symbol-c">+</span>
          <span class="symbol symbol-d">◈</span>
          <span class="symbol symbol-e">△</span>

        </div>


        <div class="artifact"
             data-depth="1.8">

          <div class="artifact-ring ring-one"></div>
          <div class="artifact-ring ring-two"></div>
          <div class="artifact-ring ring-three"></div>

          <div class="artifact-body">

            <div class="artifact-mark top-mark"></div>
            <div class="artifact-mark left-mark"></div>
            <div class="artifact-mark right-mark"></div>
            <div class="artifact-mark bottom-mark"></div>

            <div class="core"
                 data-depth="2.8">

              <div class="core-inner"></div>

            </div>

          </div>

        </div>


        <div class="scan-line"></div>


        <div class="light"
             data-depth="3">
        </div>

      </div>


      <div class="metadata">

        <span>OBJECT</span>
        <strong>PR-07</strong>

        <span>DEPTH</span>
        <strong>∞</strong>

      </div>


      <div class="instruction">
        <span class="instruction-dot"></span>
        Move around the relic
      </div>

    </section>

  </main>


  <script>
    const stage = document.getElementById("relic");

    const layers = stage.querySelectorAll("[data-depth]");

    let targetX = 0;
    let targetY = 0;

    let currentX = 0;
    let currentY = 0;

    let active = false;


    function handlePointer(event) {

      const rect = stage.getBoundingClientRect();

      const x =
        (event.clientX - rect.left) / rect.width;

      const y =
        (event.clientY - rect.top) / rect.height;

      targetX = (x - 0.5) * 2;
      targetY = (y - 0.5) * 2;

      active = true;
    }


    stage.addEventListener(
      "pointermove",
      handlePointer
    );


    stage.addEventListener(
      "pointerenter",
      () => {
        active = true;
      }
    );


    stage.addEventListener(
      "pointerleave",
      () => {
        active = false;
      }
    );


    function animate() {

      if (!active) {
        targetX *= 0.96;
        targetY *= 0.96;
      }

      currentX +=
        (targetX - currentX) * 0.08;

      currentY +=
        (targetY - currentY) * 0.08;


      layers.forEach(layer => {

        const depth =
          parseFloat(
            layer.dataset.depth
          );

        const moveX =
          currentX * depth * 16;

        const moveY =
          currentY * depth * 16;

        layer.style.setProperty(
          "--move-x",
          `${moveX}px`
        );

        layer.style.setProperty(
          "--move-y",
          `${moveY}px`
        );

      });


      stage.style.setProperty(
        "--light-x",
        `${50 + currentX * 35}%`
      );

      stage.style.setProperty(
        "--light-y",
        `${50 + currentY * 35}%`
      );


      stage.style.setProperty(
        "--tilt-x",
        `${currentY * -4}deg`
      );

      stage.style.setProperty(
        "--tilt-y",
        `${currentX * 4}deg`
      );


      requestAnimationFrame(animate);
    }


    animate();
  </script>

</body>
</html>
