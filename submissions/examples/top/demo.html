<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SaaS Modern Announce Top Bar - Theming & Accessibility Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Announcement Bar (Default / Light Theme) -->
  <aside class="announce-bar" aria-label="Announcement">
    <div class="announce-bar__container">
      <span class="announce-bar__badge">New Feature</span>
      <p class="announce-bar__message">
        We just launched our new API key dashboard. 
        <a href="#learn-more" class="announce-bar__link">Explore updates <span aria-hidden="true">&rarr;</span></a>
      </p>
      <button type="button" class="announce-bar__close" aria-label="Dismiss announcement">
        <span aria-hidden="true">&times;</span>
      </button>
    </div>
  </aside>

  <!-- Announcement Bar (Dark Theme Modifier) -->
  <aside class="announce-bar announce-bar--dark" aria-label="Announcement">
    <div class="announce-bar__container">
      <span class="announce-bar__badge">Maintenance</span>
      <p class="announce-bar__message">
        Scheduled maintenance will occur on Sunday at 02:00 UTC.
      </p>
      <button type="button" class="announce-bar__close" aria-label="Dismiss announcement">
        <span aria-hidden="true">&times;</span>
      </button>
    </div>
  </aside>

  <!-- Announcement Bar (Custom Inline Property Overrides) -->
  <aside class="announce-bar" style="--bar-bg: #4f46e5; --bar-text: #ffffff; --badge-bg: #312e81; --badge-text: #e0e7ff;" aria-label="Announcement">
    <div class="announce-bar__container">
      <span class="announce-bar__badge">Custom Brand</span>
      <p class="announce-bar__message">
        Custom brand theming applied using local CSS variables.
      </p>
      <button type="button" class="announce-bar__close" aria-label="Dismiss announcement">
        <span aria-hidden="true">&times;</span>
      </button>
    </div>
  </aside>

</body>
</html>
