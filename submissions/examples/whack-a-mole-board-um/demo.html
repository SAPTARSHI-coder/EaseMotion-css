<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Whack-a-Mole Game - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <form class="game-cabinet" role="application" aria-label="Pure CSS Whack-a-Mole Game">
    <header class="cabinet-header">
      <h1 class="cabinet-title">WHACK-A-MOLE</h1>
      <p class="cabinet-subtitle">Pure CSS Arcade Edition</p>
    </header>

    <div class="scoreboard-container" aria-live="polite">
      <div class="score-display">SCORE: </div>
      <div class="timer-display">PURE CSS</div>
    </div>

    <!-- The 3x3 Grid of Holes -->
    <div class="mole-board">
      
      <!-- Hole 1 -->
      <div class="hole-wrapper">
        <input type="checkbox" id="mole-1" class="mole-input" aria-label="Mole 1">
        <label for="mole-1" class="mole-label">
          <div class="mole-character">
            <div class="mole-snout"></div>
            <div class="mole-whiskers"></div>
          </div>
        </label>
        <span class="hit-spark" aria-hidden="true">HIT!</span>
      </div>

      <!-- Hole 2 -->
      <div class="hole-wrapper">
        <input type="checkbox" id="mole-2" class="mole-input" aria-label="Mole 2">
        <label for="mole-2" class="mole-label">
          <div class="mole-character">
            <div class="mole-snout"></div>
            <div class="mole-whiskers"></div>
          </div>
        </label>
        <span class="hit-spark" aria-hidden="true">HIT!</span>
      </div>

      <!-- Hole 3 -->
      <div class="hole-wrapper">
        <input type="checkbox" id="mole-3" class="mole-input" aria-label="Mole 3">
        <label for="mole-3" class="mole-label">
          <div class="mole-character">
            <div class="mole-snout"></div>
            <div class="mole-whiskers"></div>
          </div>
        </label>
        <span class="hit-spark" aria-hidden="true">HIT!</span>
      </div>

      <!-- Hole 4 -->
      <div class="hole-wrapper">
        <input type="checkbox" id="mole-4" class="mole-input" aria-label="Mole 4">
        <label for="mole-4" class="mole-label">
          <div class="mole-character">
            <div class="mole-snout"></div>
            <div class="mole-whiskers"></div>
          </div>
        </label>
        <span class="hit-spark" aria-hidden="true">HIT!</span>
      </div>

      <!-- Hole 5 -->
      <div class="hole-wrapper">
        <input type="checkbox" id="mole-5" class="mole-input" aria-label="Mole 5">
        <label for="mole-5" class="mole-label">
          <div class="mole-character">
            <div class="mole-snout"></div>
            <div class="mole-whiskers"></div>
          </div>
        </label>
        <span class="hit-spark" aria-hidden="true">HIT!</span>
      </div>

      <!-- Hole 6 -->
      <div class="hole-wrapper">
        <input type="checkbox" id="mole-6" class="mole-input" aria-label="Mole 6">
        <label for="mole-6" class="mole-label">
          <div class="mole-character">
            <div class="mole-snout"></div>
            <div class="mole-whiskers"></div>
          </div>
        </label>
        <span class="hit-spark" aria-hidden="true">HIT!</span>
      </div>

      <!-- Hole 7 -->
      <div class="hole-wrapper">
        <input type="checkbox" id="mole-7" class="mole-input" aria-label="Mole 7">
        <label for="mole-7" class="mole-label">
          <div class="mole-character">
            <div class="mole-snout"></div>
            <div class="mole-whiskers"></div>
          </div>
        </label>
        <span class="hit-spark" aria-hidden="true">HIT!</span>
      </div>

      <!-- Hole 8 -->
      <div class="hole-wrapper">
        <input type="checkbox" id="mole-8" class="mole-input" aria-label="Mole 8">
        <label for="mole-8" class="mole-label">
          <div class="mole-character">
            <div class="mole-snout"></div>
            <div class="mole-whiskers"></div>
          </div>
        </label>
        <span class="hit-spark" aria-hidden="true">HIT!</span>
      </div>

      <!-- Hole 9 -->
      <div class="hole-wrapper">
        <input type="checkbox" id="mole-9" class="mole-input" aria-label="Mole 9">
        <label for="mole-9" class="mole-label">
          <div class="mole-character">
            <div class="mole-snout"></div>
            <div class="mole-whiskers"></div>
          </div>
        </label>
        <span class="hit-spark" aria-hidden="true">HIT!</span>
      </div>

    </div>

    <div class="control-panel">
      <button type="reset" class="reset-btn">PLAY AGAIN</button>
    </div>
  </form>
</body>
</html>
