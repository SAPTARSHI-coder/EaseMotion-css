<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ease Dynamic Speedometer Gauge Meter</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="ease-gauge-body">
  <div class="ease-gauge-wrapper">
    <svg class="ease-gauge" viewBox="0 0 100 50">
      <path class="gauge-bg" d="M 10 50 A 40 40 0 0 1 90 50" fill="none" stroke="#1e293b" stroke-width="8"/>
      <path class="gauge-fill" id="gaugeFill" d="M 10 50 A 40 40 0 0 1 90 50" fill="none" stroke="#3b82f6" stroke-width="8" stroke-dasharray="126" stroke-dashoffset="126"/>
    </svg>
    <div class="gauge-val" id="gaugeText">0%</div>
    <input type="range" id="gaugeInput" min="0" max="100" value="65" />
  </div>

  <script>
    const input = document.getElementById('gaugeInput');
    const fill = document.getElementById('gaugeFill');
    const text = document.getElementById('gaugeText');

    function updateGauge(val) {
      const offset = 126 - (val / 100) * 126;
      fill.style.strokeDashoffset = offset;
      text.textContent = `${val}%`;
    }

    input.addEventListener('input', (e) => updateGauge(e.target.value));
    updateGauge(65);
  </script>
</body>
</html>
