<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animated Progress Bar Collection - Issue #87418</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="ease-progress-stage" id="progress-stage" aria-labelledby="stage-title">
    <div class="ease-progress-header">
      <h1 id="stage-title" class="ease-progress-title">Progress Indicators</h1>
      <p class="ease-progress-desc">Collection of 5 CSS-only animated progress bars for dashboards and loading states.</p>
    </div>

    <div class="ease-progress-list">
      <!-- Style 1: Basic Solid -->
      <div class="ease-progress-group">
        <div class="ease-progress-label-row"><span>1. Basic Solid Progress</span><span>75%</span></div>
        <div class="ease-progress-bar" role="progressbar" aria-valuenow="75" aria-valuemin="0" aria-valuemax="100">
          <div class="ease-progress-fill solid" style="width: 75%;"></div>
        </div>
      </div>

      <!-- Style 2: Gradient Flow -->
      <div class="ease-progress-group">
        <div class="ease-progress-label-row"><span>2. Animated Gradient Flow</span><span>90%</span></div>
        <div class="ease-progress-bar" role="progressbar" aria-valuenow="90" aria-valuemin="0" aria-valuemax="100">
          <div class="ease-progress-fill gradient" style="width: 90%;"></div>
        </div>
      </div>

      <!-- Style 3: Striped Animated -->
      <div class="ease-progress-group">
        <div class="ease-progress-label-row"><span>3. Striped Animated Stripes</span><span>60%</span></div>
        <div class="ease-progress-bar" role="progressbar" aria-valuenow="60" aria-valuemin="0" aria-valuemax="100">
          <div class="ease-progress-fill striped" style="width: 60%;"></div>
        </div>
      </div>

      <!-- Style 4: Segmented Blocks -->
      <div class="ease-progress-group">
        <div class="ease-progress-label-row"><span>4. Segmented Block Matrix</span><span>80%</span></div>
        <div class="ease-progress-segmented" role="progressbar" aria-valuenow="80" aria-valuemin="0" aria-valuemax="100">
          <div class="ease-progress-segment active"></div>
          <div class="ease-progress-segment active"></div>
          <div class="ease-progress-segment active"></div>
          <div class="ease-progress-segment active"></div>
          <div class="ease-progress-segment"></div>
        </div>
      </div>

      <!-- Style 5: Circular Ring -->
      <div class="ease-progress-group" style="align-items: center;">
        <div class="ease-progress-label-row" style="width: 100%;"><span>5. Circular Conic Ring</span><span>75%</span></div>
        <div class="ease-progress-circular-wrapper">
          <div class="ease-progress-circle" role="progressbar" aria-valuenow="75" aria-valuemin="0" aria-valuemax="100"></div>
        </div>
      </div>
    </div>

    <button type="button" class="ease-btn-prog" id="replay-btn">Replay Animations</button>
  </main>

  <script>
    const stage = document.getElementById('progress-stage');
    const replayBtn = document.getElementById('replay-btn');

    replayBtn.addEventListener('click', () => {
      stage.classList.add('is-animating');
      void stage.offsetWidth; // Trigger DOM reflow
      stage.classList.remove('is-animating');
    });
  </script>
</body>
</html>
