<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Skew-Active Toast - Minimalist Tech</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="layout-container">
        
        <header class="section-header">
            <h1 class="title">System Events</h1>
            <p class="subtitle">A minimalist tech toast component featuring an aggressive, diagonal skew-active entrance animation.</p>
        </header>

        <div class="dashboard-area">
            
            <div class="card">
                
                <!-- 
                   Pure CSS State Management for Toast Demo
                   We use a checkbox to toggle the state to replay the entrance animation.
                -->
                <div class="controls">
                    <input type="checkbox" id="replay-toggle" class="replay-input" checked>
                    <label for="replay-toggle" class="btn-replay">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"></polyline><polyline points="23 20 23 14 17 14"></polyline><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"></path></svg>
                        Trigger Toasts
                    </label>
                    
                    <div class="toast-container skew-active-group">
                        
                        <!-- Toast 1: Authentication -->
                        <div class="toast toast-emerald delay-1">
                            <div class="toast-icon-wrapper">
                                <svg class="toast-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                            </div>
                            <div class="toast-content">
                                <span class="toast-title">Access Granted</span>
                                <span class="toast-desc">Successfully authenticated via SSH key. Session token generated.</span>
                            </div>
                            <button class="toast-close" aria-label="Close notification">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                            </button>
                        </div>
                        
                        <!-- Toast 2: Storage Warning -->
                        <div class="toast toast-orange delay-2">
                            <div class="toast-icon-wrapper">
                                <svg class="toast-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="5" rx="9" ry="3"></ellipse><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path></svg>
                            </div>
                            <div class="toast-content">
                                <span class="toast-title">Storage Limit Reached</span>
                                <span class="toast-desc">Volume /dev/sda1 has exceeded 90% capacity.</span>
                            </div>
                            <div class="toast-actions">
                                <button class="action-btn">Free Space</button>
                            </div>
                        </div>

                    </div>
                </div>
                
            </div>
            
        </div>
    </div>

</body>
</html>
