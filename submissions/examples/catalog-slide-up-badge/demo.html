<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Slide-Up Badge - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="em-catalog-layout">
        <div class="em-product-card" tabindex="0">
            <div class="em-card-image-wrapper">
                <div class="em-product-image-placeholder">
                    <span class="em-placeholder-text">PRODUCT_NODE // 01</span>
                </div>
                <div class="em-slide-up-badge">NEW ARRIVAL</div>
            </div>
            <div class="em-card-content">
                <span class="em-product-category">HARDWARE MODULE</span>
                <h3 class="em-product-title">Neural Compute Unit X1</h3>
                <div class="em-product-footer">
                    <span class="em-product-price">$299.00</span>
                    <a href="#" class="em-product-btn">View Details</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
