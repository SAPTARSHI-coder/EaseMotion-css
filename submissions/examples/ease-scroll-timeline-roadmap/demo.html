<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ease Scroll Timeline Progress Roadmap</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="ease-roadmap-container">
    <h1>Product Roadmap Timeline</h1>
    <div class="ease-timeline">
      <div class="ease-timeline-line" id="lineFill"></div>
      <div class="ease-step">
        <div class="ease-step-dot">1</div>
        <div class="ease-step-card">
          <h3>Phase 1: Foundation</h3>
          <p>Core framework setup and design tokens release.</p>
        </div>
      </div>
      <div class="ease-step">
        <div class="ease-step-dot">2</div>
        <div class="ease-step-card">
          <h3>Phase 2: Motion Engine</h3>
          <p>Dynamic em="" attribute DSL and runtime mutation observer.</p>
        </div>
      </div>
      <div class="ease-step">
        <div class="ease-step-dot">3</div>
        <div class="ease-step-card">
          <h3>Phase 3: React Library</h3>
          <p>Declarative JSX wrapper components and hooks release.</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    window.addEventListener('scroll', () => {
      const line = document.getElementById('lineFill');
      const totalHeight = document.body.scrollHeight - window.innerHeight;
      const progress = (window.scrollY / totalHeight) * 100;
      line.style.height = `${Math.min(100, Math.max(0, progress))}%`;
    });
  </script>
</body>
</html>
