<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-alarm-clock-rings demo</title>
</head>
<body>
<div class="al-app">
  <div class="al-clock">
    <div class="al-bell al-bell-1"></div>
    <div class="al-bell al-bell-2"></div>
    <div class="al-hammer al-hammer-1"></div>
    <div class="al-hammer al-hammer-2"></div>
    <div class="al-face">
      <span class="al-mark al-mark-1"></span>
      <span class="al-mark al-mark-2"></span>
      <span class="al-mark al-mark-3"></span>
      <span class="al-mark al-mark-4"></span>
      <div class="al-hour"></div>
      <div class="al-minute"></div>
      <div class="al-hub"></div>
      <div class="al-digit">7:30</div>
    </div>
    <div class="al-foot al-foot-1"></div>
    <div class="al-foot al-foot-2"></div>
  </div>
</div>
</body>
</html>
