<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ease Color Picker Demo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body style="padding: 40px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #fafafa; color: #111;">
  <h2>Ease Color Picker Component</h2>

  <h3>Default (Medium)</h3>
  <div class="ease-color-picker" role="radiogroup" aria-label="Default color picker">
    <button type="button" class="ease-color-option" style="--ease-color: #ef4444;" aria-label="Red"></button>
    <button type="button" class="ease-color-option is-selected" style="--ease-color: #3b82f6;" aria-label="Blue"></button>
    <button type="button" class="ease-color-option" style="--ease-color: #10b981;" aria-label="Green"></button>
    <button type="button" class="ease-color-option" style="--ease-color: #f59e0b;" aria-label="Amber"></button>
    <button type="button" class="ease-color-option" style="--ease-color: #8b5cf6;" aria-label="Purple"></button>
  </div>

  <h3>Small</h3>
  <div class="ease-color-picker ease-color-picker-sm" role="radiogroup" aria-label="Small color picker">
    <button type="button" class="ease-color-option is-selected" style="--ease-color: #ef4444;"></button>
    <button type="button" class="ease-color-option" style="--ease-color: #3b82f6;"></button>
    <button type="button" class="ease-color-option" style="--ease-color: #10b981;"></button>
    <button type="button" class="ease-color-option" style="--ease-color: #f59e0b;"></button>
  </div>

  <h3>Large</h3>
  <div class="ease-color-picker ease-color-picker-lg" role="radiogroup" aria-label="Large color picker">
    <button type="button" class="ease-color-option" style="--ease-color: #ef4444;"></button>
    <button type="button" class="ease-color-option" style="--ease-color: #3b82f6;"></button>
    <button type="button" class="ease-color-option is-selected" style="--ease-color: #10b981;"></button>
  </div>

  <script>
    document.querySelectorAll('.ease-color-picker').forEach(picker => {
      picker.addEventListener('click', e => {
        const btn = e.target.closest('.ease-color-option');
        if (!btn) return;
        picker.querySelectorAll('.ease-color-option').forEach(el => el.classList.remove('is-selected'));
        btn.classList.add('is-selected');
      });
    });
  </script>
</body>
</html>
