<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="CSS animated form submit button with success check animation"
  >
  <title>CSS Animated Form Submit</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">
    <section class="form-card" aria-labelledby="form-title">
      <div class="header">
        <span class="eyebrow">EaseMotion CSS</span>
        <h1 id="form-title">Send a Message</h1>
        <p>
          A pure CSS submit interaction that transforms into
          a success check.
        </p>
      </div>

      <form class="contact-form">
        <div class="field">
          <label for="name">Name</label>
          <input
            id="name"
            name="name"
            type="text"
            placeholder="Your name"
            autocomplete="name"
            required
          >
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input
            id="email"
            name="email"
            type="email"
            placeholder="you@example.com"
            autocomplete="email"
            required
          >
        </div>

        <div class="field">
          <label for="message">Message</label>
          <textarea
            id="message"
            name="message"
            rows="4"
            placeholder="Write your message..."
            required
          ></textarea>
        </div>

        <div class="submit-area">
          <input
            class="submit-toggle"
            type="checkbox"
            id="submit-state"
            aria-label="Show submitted state"
          >

          <label class="submit-button" for="submit-state">
            <span class="submit-content">
              <span class="send-icon" aria-hidden="true">↑</span>
              <span class="submit-text">Submit Form</span>
            </span>

            <span class="success-content" aria-hidden="true">
              <span class="check-icon"></span>
              <span>Submitted</span>
            </span>
          </label>

          <p class="demo-note">
            Tap the button to preview the success animation.
          </p>
        </div>
      </form>
    </section>
  </main>

</body>
</html>
