<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Pure CSS Pac-Man chomping animation">
  <title>CSS Pac-Man Chomping</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="demo">
    <h1>CSS Pac-Man Chomping</h1>
    <p class="description">
      A pure CSS Pac-Man animation chomping across a row of dots.
    </p>

    <section class="game" aria-label="Pac-Man animation">
      <div class="pacman" aria-hidden="true">
        <span class="eye"></span>
      </div>

      <div class="dots" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
      </div>
    </section>

    <p class="status">
      Pure CSS • No JavaScript
    </p>
  </main>
</body>
</html>
