<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Responsive CSS playlist queue item with drag handle, title and duration."
  >
  <title>CSS Playlist Queue Item</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">
    <section class="playlist" aria-labelledby="playlist-title">

      <div class="playlist-header">
        <div>
          <span class="eyebrow">Music Queue</span>
          <h1 id="playlist-title">Up Next</h1>
        </div>

        <span class="track-count">5 tracks</span>
      </div>

      <ul class="queue" aria-label="Playlist queue">

        <li class="queue-item active">
          <button
            class="drag-handle"
            type="button"
            aria-label="Reorder Neon Dreams"
          >
            <span></span>
            <span></span>
            <span></span>
          </button>

          <div class="cover cover-purple" aria-hidden="true">
            ♪
          </div>

          <div class="track-info">
            <strong>Neon Dreams</strong>
            <span>Midnight Avenue</span>
          </div>

          <span class="playing" aria-label="Currently playing">
            <i></i>
            <i></i>
            <i></i>
          </span>

          <time datetime="PT3M42S">3:42</time>
        </li>

        <li class="queue-item">
          <button
            class="drag-handle"
            type="button"
            aria-label="Reorder Ocean Drive"
          >
            <span></span>
            <span></span>
            <span></span>
          </button>

          <div class="cover cover-blue" aria-hidden="true">
            ◉
          </div>

          <div class="track-info">
            <strong>Ocean Drive</strong>
            <span>Coastal Lights</span>
          </div>

          <time datetime="PT4M18S">4:18</time>
        </li>

        <li class="queue-item">
          <button
            class="drag-handle"
            type="button"
            aria-label="Reorder Golden Hour"
          >
            <span></span>
            <span></span>
            <span></span>
          </button>

          <div class="cover cover-orange" aria-hidden="true">
            ✦
          </div>

          <div class="track-info">
            <strong>Golden Hour</strong>
            <span>Velvet Echo</span>
          </div>

          <time datetime="PT3M56S">3:56</time>
        </li>

        <li class="queue-item">
          <button
            class="drag-handle"
            type="button"
            aria-label="Reorder Afterglow"
          >
            <span></span>
            <span></span>
            <span></span>
          </button>

          <div class="cover cover-pink" aria-hidden="true">
            ♫
          </div>

          <div class="track-info">
            <strong>Afterglow</strong>
            <span>Static Hearts</span>
          </div>

          <time datetime="PT4M05S">4:05</time>
        </li>

        <li class="queue-item">
          <button
            class="drag-handle"
            type="button"
            aria-label="Reorder Last Light"
          >
            <span></span>
            <span></span>
            <span></span>
          </button>

          <div class="cover cover-green" aria-hidden="true">
            ♬
          </div>

          <div class="track-info">
            <strong>Last Light</strong>
            <span>Paper Satellites</span>
          </div>

          <time datetime="PT3M29S">3:29</time>
        </li>

      </ul>

    </section>
  </main>

</body>
</html>
