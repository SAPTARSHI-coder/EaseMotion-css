<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Glowing Accordion — EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <p class="label">Pure CSS Animated Glowing Accordion</p>

  <div class="ease-accordion-v7">
    <input type="checkbox" id="gacc1-v7" class="ease-accordion-checkbox-v7" checked />
    <div class="ease-accordion-item-v7">
      <label for="gacc1-v7" class="ease-accordion-header-v7">
        <span>Neon Accordion Item</span>
        <span class="ease-accordion-icon-v7">▼</span>
      </label>
      <div class="ease-accordion-drawer-v7">
        <div class="ease-accordion-body-v7">
          Smooth CSS Grid height drawer opening with ambient active border neon glow box-shadow.
        </div>
      </div>
    </div>
  </div>

</body>
</html>
