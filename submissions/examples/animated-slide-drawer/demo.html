

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EaseMotion - Drawer Slide</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <button
    class="drawer-trigger"
    onclick="document.querySelector('.drawer').classList.toggle('is-open')"
  >
    Toggle Drawer
  </button>

  <aside class="drawer">
    <h2>Navigation</h2>
    <p>Home</p>
    <p>Projects</p>
    <p>Settings</p>
  </aside>

</body>
</html>
