<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Media Visualizer: Gradient Shimmer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="layout-container">
        
        <header class="section-header">
            <h1 class="title shimmer-text">Gradient Shimmer Visualizer</h1>
            <p class="subtitle">A hardware-accelerated, JavaScript-free audio and media UI element. Features rich, flowing gradients that continuously shimmer across the typography, album art, and visualizer bars.</p>
        </header>

        <div class="demo-area">
            
            <div class="shimmer-media-card">
                
                <div class="card-header">
                    
                    <!-- 
                      [TECHNIQUE] Shimmering Album Art Mask
                      A continuous background-position animation creates
                      the illusion of light shimmering over the disc.
                    -->
                    <div class="album-art-container">
                        <div class="shimmer-disc"></div>
                        <div class="inner-cutout"></div>
                    </div>
                    
                    <div class="track-info">
                        <!-- 
                          [TECHNIQUE] Shimmer Text
                          Uses -webkit-background-clip: text to apply the moving gradient to typography.
                        -->
                        <h3 class="track-title shimmer-text">Iridescent Waves</h3>
                        <p class="track-artist">EaseMotion Prism</p>
                    </div>
                </div>
                
                <!-- 
                  [TECHNIQUE] The Shimmering Visualizer Array
                  These bars scale to simulate audio, but they also have
                  a continuous gradient shimmer flowing through them.
                -->
                <div class="visualizer-container">
                    <div class="shimmer-bar bar-1"></div>
                    <div class="shimmer-bar bar-2"></div>
                    <div class="shimmer-bar bar-3"></div>
                    <div class="shimmer-bar bar-4"></div>
                    <div class="shimmer-bar bar-5"></div>
                    <div class="shimmer-bar bar-6"></div>
                    <div class="shimmer-bar bar-7"></div>
                    <div class="shimmer-bar bar-8"></div>
                </div>
                
                <div class="media-controls">
                    <button class="control-btn" aria-label="Previous">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="19 20 9 12 19 4 19 20"></polygon><line x1="5" y1="19" x2="5" y2="5"></line></svg>
                    </button>
                    
                    <!-- Checkbox hack for play/pause toggle -->
                    <input type="checkbox" id="play-pause" class="play-toggle" checked aria-label="Play/Pause">
                    <label for="play-pause" class="control-btn play-btn">
                        <div class="play-btn-bg"></div>
                        <svg class="icon-play" width="28" height="28" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                        <svg class="icon-pause" width="28" height="28" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
                    </label>
                    
                    <button class="control-btn" aria-label="Next">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 4 15 12 5 20 5 4"></polygon><line x1="19" y1="5" x2="19" y2="19"></line></svg>
                    </button>
                </div>
                
            </div>
            
        </div>
        
    </div>

</body>
</html>
