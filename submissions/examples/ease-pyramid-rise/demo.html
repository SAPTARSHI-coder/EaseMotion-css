<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pyramid Rise · rises from flat surface</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <div class="pyramid-container">
      <div class="pyramid-display" id="pyramidDisplay">
        <!-- 3D Pyramid Scene -->
        <div class="pyramid-scene">
          <div class="pyramid" id="pyramid">
            <!-- Base -->
            <div class="pyramid-base"></div>
            <!-- Front Face -->
            <div class="pyramid-face face-front">
              <span class="face-icon">🏛️</span>
            </div>
            <!-- Back Face -->
            <div class="pyramid-face face-back">
              <span class="face-icon">✨</span>
            </div>
            <!-- Left Face -->
            <div class="pyramid-face face-left">
              <span class="face-icon">🌅</span>
            </div>
            <!-- Right Face -->
            <div class="pyramid-face face-right">
              <span class="face-icon">🌟</span>
            </div>
          </div>
        </div>

        <!-- Rise Indicator -->
        <div class="rise-indicator">
          <div class="rise-bar">
            <div class="rise-fill" id="riseFill"></div>
          </div>
          <span class="rise-value" id="riseValue">Rise: 0%</span>
        </div>
      </div>
      
      <div class="pyramid-status">
        <span id="pyramidStatus">🔺 Click to raise the pyramid</span>
      </div>
    </div>

    <div class="controls">
      <button class="btn btn-rise" id="riseBtn">🔺 Rise!</button>
      <button class="btn btn-lower" id="lowerBtn">🔻 Lower</button>
      <button class="btn btn-reset" id="resetBtn">⟳ Reset</button>
    </div>
    <div class="footer-note">
      <span>🔺 3D pyramid rises from flat · 4 faces · golden ratio</span>
    </div>
  </div>

  <script>
    (function() {
      "use strict";

      // DOM refs
      const pyramid = document.getElementById('pyramid');
      const riseFill = document.getElementById('riseFill');
      const riseValue = document.getElementById('riseValue');
      const pyramidStatus = document.getElementById('pyramidStatus');
      const riseBtn = document.getElementById('riseBtn');
      const lowerBtn = document.getElementById('lowerBtn');
      const resetBtn = document.getElementById('resetBtn');

      // State
      let rise = 0; // 0 to 1
      let targetRise = 0;
      let isAnimating = false;
      let animationId = null;

      // Update pyramid
      function updatePyramid() {
        // Smooth interpolation
        rise += (targetRise - rise) * 0.08;
        
        // Clamp
        rise = Math.max(0, Math.min(1, rise));
        
        // Calculate height (0 to 200px)
        const height = rise * 180;
        const scale = 1 + rise * 0.3;
        const translateY = -rise * 60;
        
        // Apply transform
        pyramid.style.transform = `scale(${scale}) translateY(${translateY}px)`;
        
        // Update face opacity and height
        const faces = document.querySelectorAll('.pyramid-face');
        faces.forEach((face, index) => {
          const delay = index * 0.05;
          const faceRise = Math.max(0, Math.min(1, (rise - delay) / (1 - delay)));
          face.style.opacity = faceRise;
          face.style.transform = `scaleY(${0.1 + faceRise * 0.9})`;
        });
        
        // Update base opacity
        const base = document.querySelector('.pyramid-base');
        base.style.opacity = 0.3 + rise * 0.7;
        base.style.transform = `scale(${1 + rise * 0.1})`;
        
        // Update indicator
        const percent = Math.round(rise * 100);
        riseFill.style.width = percent + '%';
        riseValue.textContent = `Rise: ${percent}%`;
        
        // Update status
        if (rise > 0.9) {
          pyramidStatus.textContent = '🔺 Pyramid fully raised!';
          pyramidStatus.style.color = '#fbbf24';
        } else if (rise > 0.4) {
          pyramidStatus.textContent = '🔺 Rising...';
          pyramidStatus.style.color = '#818cf8';
        } else if (rise > 0.05) {
          pyramidStatus.textContent = '🔺 Emerging...';
          pyramidStatus.style.color = '#94a3b8';
        } else {
          pyramidStatus.textContent = '🔺 Click to raise the pyramid';
          pyramidStatus.style.color = '#94a3b8';
        }

        // Update glow
        const glowIntensity = 0.1 + rise * 0.4;
        document.querySelector('.pyramid-scene').style.boxShadow = 
          `0 0 ${40 + rise * 60}px rgba(99, 102, 241, ${glowIntensity})`;
      }

      // Animation loop
      function animate() {
        if (isAnimating) {
          updatePyramid();
          animationId = requestAnimationFrame(animate);
        }
      }

      // Start animation
      function startAnimation() {
        if (!isAnimating) {
          isAnimating = true;
          animate();
        }
      }

      // Stop animation
      function stopAnimation() {
        if (isAnimating) {
          isAnimating = false;
          if (animationId) {
            cancelAnimationFrame(animationId);
            animationId = null;
          }
          // Final update
          updatePyramid();
        }
      }

      // Rise pyramid
      function risePyramid() {
        targetRise = 1;
        startAnimation();
        riseBtn.textContent = '🔺 Rising...';
        riseBtn.style.background = 'linear-gradient(135deg, #fbbf24, #f59e0b)';
        riseBtn.style.borderColor = '#fcd34d';
      }

      // Lower pyramid
      function lowerPyramid() {
        targetRise = 0;
        startAnimation();
        riseBtn.textContent = '🔺 Rise!';
        riseBtn.style.background = 'linear-gradient(135deg, #6366f1, #4f46e5)';
        riseBtn.style.borderColor = '#818cf8';
      }

      // Reset pyramid
      function resetPyramid() {
        targetRise = 0;
        rise = 0;
        stopAnimation();
        updatePyramid();
        riseBtn.textContent = '🔺 Rise!';
        riseBtn.style.background = 'linear-gradient(135deg, #6366f1, #4f46e5)';
        riseBtn.style.borderColor = '#818cf8';
        pyramidStatus.textContent = '🔄 Reset complete';
        pyramidStatus.style.color = '#94a3b8';
        setTimeout(() => {
          pyramidStatus.textContent = '🔺 Click to raise the pyramid';
        }, 1000);
      }

      // Toggle rise
      function toggleRise() {
        if (rise > 0.5) {
          lowerPyramid();
        } else {
          risePyramid();
        }
      }

      // Event listeners
      if (riseBtn) {
        riseBtn.addEventListener('click', function(e) {
          e.preventDefault();
          if (rise > 0.8) {
            lowerPyramid();
          } else {
            risePyramid();
          }
        });
      }

      if (lowerBtn) {
        lowerBtn.addEventListener('click', function(e) {
          e.preventDefault();
          lowerPyramid();
        });
      }

      if (resetBtn) {
        resetBtn.addEventListener('click', function(e) {
          e.preventDefault();
          resetPyramid();
        });
      }

      // Click on display to toggle
      const pyramidDisplay = document.getElementById('pyramidDisplay');
      pyramidDisplay.addEventListener('click', function(e) {
        if (e.target === this || e.target.closest('.pyramid-scene')) {
          toggleRise();
        }
      });

      // Keyboard shortcuts
      document.addEventListener('keydown', function(e) {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

        const key = e.key;
        if (key === ' ' || key === 'Space') {
          e.preventDefault();
          toggleRise();
        } else if (key === 'r' || key === 'R') {
          e.preventDefault();
          risePyramid();
        } else if (key === 'l' || key === 'L') {
          e.preventDefault();
          lowerPyramid();
        } else if (key === 'x' || key === 'X') {
          e.preventDefault();
          resetPyramid();
        }
      });

      // Initialize
      updatePyramid();
      console.log('🔺 Pyramid Rise ready · shortcuts: [Space] Toggle, [R] Rise, [L] Lower, [X] Reset');
    })();
  </script>
</body>
</html>
