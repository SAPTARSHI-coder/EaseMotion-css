<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Loader: Subtle Elevate</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="layout-container">
        
        <header class="section-header">
            <h1 class="title">Pure CSS Loader: Subtle Elevate</h1>
            <p class="subtitle">A premium, minimalist loading animation featuring gentle Y-axis lifts and expanding, diffused shadows to simulate subtle physical elevation.</p>
        </header>

        <div class="demo-area">
            
            <div class="loader-container" aria-label="Loading content, subtle elevation animation playing">
                
                <!-- 
                  [TECHNIQUE] Subtle Elevate
                  A series of dots that slightly lift up along the Y-axis.
                  Their drop shadow expands softly to create depth.
                -->
                <div class="elevate-wrapper" aria-hidden="true">
                    
                    <div class="elevate-dot dot-1"></div>
                    <div class="elevate-dot dot-2"></div>
                    <div class="elevate-dot dot-3"></div>
                    
                </div>
                
            </div>
            
        </div>
        
    </div>

</body>
</html>
