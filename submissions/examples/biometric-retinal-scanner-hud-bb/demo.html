<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Biometric Retinal Scanner HUD Component - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="hud-container">
    <div class="hud-header">
      <span class="hud-status-dot"></span>
      <span class="hud-title">SYSTEM SECURE // RETINAL VERIFICATION V4.2</span>
    </div>
    
    <div class="retina-scanner-card">
      <div class="scanner-ring outer-ring"></div>
      <div class="scanner-ring middle-ring"></div>
      <div class="scanner-ring inner-ring"></div>
      
      <div class="laser-beam"></div>
      
      <div class="eye-target">
        <div class="retina-pupil"></div>
        <div class="retina-grid"></div>
      </div>
      
      <div class="hud-corner top-left"></div>
      <div class="hud-corner top-right"></div>
      <div class="hud-corner bottom-left"></div>
      <div class="hud-corner bottom-right"></div>
    </div>
    
    <div class="hud-telemetry">
      <div class="telemetry-item">
        <span class="label">SCAN DENSITY</span>
        <span class="value">99.84%</span>
      </div>
      <div class="telemetry-bar"><div class="fill-bar"></div></div>
      <div class="telemetry-item">
        <span class="label">BIOMETRIC MATCH</span>
        <span class="value match-ok">VERIFIED</span>
      </div>
    </div>
  </div>
</body>
</html>
