<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Solar Flare Radial Bento Card built with pure HTML and CSS"
  >
  <title>Solar Flare Radial Bento</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="page">
    <section class="bento" aria-label="Solar Flare Bento Cards">

      <article class="card card-main">
        <div class="flare flare-large"></div>

        <div class="card-content">
          <span class="label">SOLAR SYSTEM</span>

          <h1>
            SOLAR
            <span>FLARE</span>
          </h1>

          <p>
            A radiant bento interface inspired by solar energy,
            radial light and futuristic space systems.
          </p>

          <div class="orbit">
            <div class="planet"></div>
          </div>
        </div>
      </article>

      <article class="card card-energy">
        <div class="flare flare-small"></div>

        <div class="card-content">
          <span class="label">ENERGY</span>
          <strong>98%</strong>

          <div class="energy-bar">
            <span></span>
          </div>

          <p>Solar output</p>
        </div>
      </article>

      <article class="card card-temperature">
        <div class="card-content">
          <span class="label">CORE TEMP</span>
          <strong>5,778K</strong>

          <div class="temperature">
            <span></span>
          </div>
        </div>
      </article>

      <article class="card card-status">
        <div class="card-content">
          <span class="label">STATUS</span>

          <div class="status">
            <span class="status-dot"></span>
            STABLE
          </div>

          <p>
            Continuous solar activity detected.
          </p>
        </div>
      </article>

      <article class="card card-radiation">
        <div class="flare flare-medium"></div>

        <div class="card-content">
          <span class="label">RADIATION</span>

          <strong>LOW</strong>

          <div class="pulse-ring"></div>
        </div>
      </article>

    </section>
  </main>

</body>
</html>
