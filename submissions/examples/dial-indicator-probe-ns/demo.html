<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dial Indicator Probe — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Dial Indicator Probe demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Dial Indicator Probe</h1>
      <p class="lede">Machinist dial indicator needle twitching on contact</p>
    </header>

    <section class="ease-dial-indicator-probe" data-demo="dial-indicator-probe" aria-live="polite">
      <div class="ease-dial-indicator-probe__housing">
        <div class="ease-dial-indicator-probe__bezel">
          <div class="ease-dial-indicator-probe__face">
            <div class="ease-dial-indicator-probe__readout">
              <span class="ease-dial-indicator-probe__label">Dial Indicator Probe</span>
              <span class="ease-dial-indicator-probe__value">LIVE</span>
            </div>
            <div class="ease-dial-indicator-probe__motion" aria-hidden="true">
              <span class="ease-dial-indicator-probe__a"></span>
              <span class="ease-dial-indicator-probe__b"></span>
              <span class="ease-dial-indicator-probe__c"></span>
              <span class="ease-dial-indicator-probe__d"></span>
            </div>
            <div class="ease-dial-indicator-probe__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-dial-indicator-probe__controls">
          <button type="button" class="ease-dial-indicator-probe__btn primary">Engage</button>
          <button type="button" class="ease-dial-indicator-probe__btn">Reset</button>
          <label class="ease-dial-indicator-probe__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-dial-indicator-probe__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
