<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Neon Flicker Text - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Neon Sign Board wrapper -->
  <main class="sign-board" role="region" aria-label="Neon Sign Board displaying GLOW">
    
    <h1 class="neon-title">
      <!-- Mapped characters with distinct glow and flicker animations -->
      <span class="neon-pink-glow">G</span>
      <span class="neon-pink-glow flicker-fast">L</span>
      <span class="neon-cyan-glow">O</span>
      <span class="neon-cyan-glow flicker-slow">W</span>
    </h1>

    <p class="sign-subtext">Electric Hum Sign</p>

  </main>

</body>
</html>
