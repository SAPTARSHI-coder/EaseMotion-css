<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="High-contrast accessible ripple wave button built with pure CSS.">
  <title>Ripple Wave Button - High Contrast</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="page">
    <section class="demo-card" aria-labelledby="title">
      <p class="eyebrow">EaseMotion • Accessibility Edition</p>

      <h1 id="title">Ripple Wave Button</h1>

      <p class="description">
        A high-contrast interactive button with a layered ripple effect,
        keyboard accessibility, and reduced-motion support.
      </p>

      <div class="button-stage">
        <button class="ripple-button" type="button">
          <span class="button-glow" aria-hidden="true"></span>
          <span class="ripple ripple-one" aria-hidden="true"></span>
          <span class="ripple ripple-two" aria-hidden="true"></span>
          <span class="button-text">Activate</span>
        </button>
      </div>

      <p class="hint">
        Hover, focus, or activate the button to see the ripple effect.
      </p>
    </section>
  </main>
</body>
</html>
