<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Pure CSS shooting star loader animation"
  >
  <title>CSS Shooting Star Loader</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="demo-page">
    <section
      class="loader-card"
      aria-label="Loading content"
      aria-live="polite"
    >
      <div class="loader">
        <span class="star star-one" aria-hidden="true"></span>
        <span class="star star-two" aria-hidden="true"></span>
        <span class="star star-three" aria-hidden="true"></span>
        <span class="star star-four" aria-hidden="true"></span>
        <span class="star star-five" aria-hidden="true"></span>

        <div class="loader-message">
          <span class="loader-spinner" aria-hidden="true"></span>
          <span>Loading content...</span>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
