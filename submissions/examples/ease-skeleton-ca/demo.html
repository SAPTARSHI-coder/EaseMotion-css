<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Skeleton Screen Loader — EaseMotion Suite Showcase</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="ease-container">
    <div class="ease-card">
      <!-- Avatar & Text Block Loading Profile -->
      <div class="ease-skeleton-profile">
        <div class="ease-skeleton ease-skeleton--avatar"></div>
        <div class="ease-skeleton-profile-info">
          <div class="ease-skeleton ease-skeleton--text"></div>
          <div class="ease-skeleton ease-skeleton--text short"></div>
        </div>
      </div>

      <!-- Card Skeleton Loader -->
      <div class="ease-skeleton ease-skeleton--card"></div>

      <!-- Additional Text Lines -->
      <div>
        <div class="ease-skeleton ease-skeleton--text"></div>
        <div class="ease-skeleton ease-skeleton--text"></div>
        <div class="ease-skeleton ease-skeleton--text short"></div>
      </div>
    </div>
  </main>
</body>
</html>
