<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EaseMotion - Holographic Sheen Demo</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #0f172a;
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
        }

        /* Demo Card Styling */
        .demo-card {
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            color: white;
            padding: 4rem 6rem;
            border-radius: 16px;
            font-size: 1.5rem;
            font-weight: bold;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.1);
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .demo-card:hover {
            transform: translateY(-5px) translateZ(0);
        }

        /* Customizing the utility class via variables for this specific instance */
        .custom-sheen {
            --ease-sheen-duration: 3s;
            --ease-sheen-beam-color: rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body>

    <!-- Apply the core utility class to trigger the animation -->
    <div class="demo-card ease-anim-holographic-sheen-beam custom-sheen">
        Holographic Element
    </div>

</body>
</html>
