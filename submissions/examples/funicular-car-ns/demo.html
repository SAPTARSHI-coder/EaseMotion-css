<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Funicular Car — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Funicular Car demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Funicular Car</h1>
      <p class="lede">Funicular cars ascending and descending a hillside track</p>
    </header>

    <section class="ease-funicular-car" data-demo="funicular-car" aria-live="polite">
      <div class="ease-funicular-car__housing">
        <div class="ease-funicular-car__bezel">
          <div class="ease-funicular-car__face">
            <div class="ease-funicular-car__readout">
              <span class="ease-funicular-car__label">Funicular Car</span>
              <span class="ease-funicular-car__value">TRACK</span>
            </div>
            <div class="ease-funicular-car__motion" aria-hidden="true">
              <span class="ease-funicular-car__track"></span>
              <span class="ease-funicular-car__car up"></span>
              <span class="ease-funicular-car__car down"></span>
              <span class="ease-funicular-car__cable"></span>
              <span class="ease-funicular-car__hill"></span>
            </div>
            <div class="ease-funicular-car__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-funicular-car__controls">
          <button type="button" class="ease-funicular-car__btn primary">Engage</button>
          <button type="button" class="ease-funicular-car__btn">Reset</button>
          <label class="ease-funicular-car__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-funicular-car__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
