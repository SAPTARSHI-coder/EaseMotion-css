<!-- submissions/examples/cyberpunk-3d-tooltip/demo.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Cyberpunk Tooltip | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="demo-container">
    
    <!-- Cyberpunk 3D Tooltip Wrapper -->
    <div class="ease-cyber-wrapper">
      
      <button class="ease-cyber-trigger" aria-describedby="cyber-tooltip">
        Initialize
      </button>

      <!-- The Tooltip Content -->
      <div id="cyber-tooltip" class="ease-cyber-tooltip" role="tooltip">
        Data link established. Secure connection routed through proxy network.
      </div>

    </div>

  </main>

</body>
</html>
