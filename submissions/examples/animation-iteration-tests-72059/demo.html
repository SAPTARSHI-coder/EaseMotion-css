<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animation Iteration Configuration Test</title>

  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css"
  >

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="demo">
    <h1 class="ease-fade-in">Animation Iteration Test</h1>

    <p>
      The examples below verify that looping animations respect
      <code>--ease-animation-iterations</code>.
    </p>

    <section class="test-group">
      <h2>Default</h2>
      <div class="demo-box ease-bounce">Default</div>
    </section>

    <section class="test-group">
      <h2>Custom: 3 iterations</h2>
      <div class="demo-box iterations-3 ease-pulse">3 Times</div>
    </section>

    <section class="test-group">
      <h2>Custom: 5 iterations</h2>
      <div class="demo-box iterations-5 ease-rotate">5 Times</div>
    </section>

    <section class="test-group">
      <h2>Custom: 2 iterations</h2>
      <div class="demo-box iterations-2 ease-ping">2 Times</div>
    </section>
  </main>
</body>
</html>
