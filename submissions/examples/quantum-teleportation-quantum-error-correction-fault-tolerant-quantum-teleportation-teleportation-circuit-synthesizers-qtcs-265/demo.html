<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teleportation Circuit Synthesizers QTCS - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css"></head><body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030712; color: #ffffff;">

    <div class="ease-card ease-card-glass qtcs-container">
        <div class="qtcs-header">
            <h2>Teleportation Circuit Synthesizer</h2>
            <span class="ease-badge ease-badge-secondary">Fault-Tolerant Quantum</span>
        </div>
        
        <div class="qtcs-screen ease-center">
            <div class="qtcs-flux flux-qtcs-a"></div>
            <div class="qtcs-flux flux-qtcs-b"></div>
            <div class="qtcs-boundary-ring"></div>
            <div class="qtcs-core ease-center"></div>
        </div>

        <div class="qtcs-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Gate Sequence Compilation &amp; Optimization Hub</span>
            <button class="ease-btn ease-btn-secondary ease-btn-sm ease-hover-grow">Run Circuit Synthesizer</button>
        </div>
    </div></body></html>
