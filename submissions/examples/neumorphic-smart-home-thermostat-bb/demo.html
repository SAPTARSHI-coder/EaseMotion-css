<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neumorphic Smart Home Thermostat Dial - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="thermostat-card">
    <div class="card-title">SMART THERMOSTAT</div>
    
    <div class="dial-outer">
      <div class="dial-inner">
        <div class="temp-display">
          <span class="degrees">22°</span>
          <span class="mode-text">HEATING</span>
        </div>
        <div class="indicator-dot"></div>
      </div>
    </div>
    
    <div class="thermostat-controls">
      <button class="neu-btn active">AUTO</button>
      <button class="neu-btn">ECO</button>
      <button class="neu-btn">BOOST</button>
    </div>
  </div>
</body>
</html>
