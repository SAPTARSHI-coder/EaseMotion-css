<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Morph Glow Tooltip</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<section class="container">

  <h1>Morph Glow Tooltip</h1>
  <p>Hover on the icons to explore</p>

  <div class="tooltip-wrapper">

    <button class="icon">
      ?
      <span class="tooltip">
        Learn more about features
      </span>
    </button>


    <button class="icon">
      !
      <span class="tooltip">
        Important notification
      </span>
    </button>


    <button class="icon">
      ✓
      <span class="tooltip">
        Task completed successfully
      </span>
    </button>

  </div>

</section>

</body>
</html>
