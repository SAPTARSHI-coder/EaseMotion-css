<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Backpressure Queue Sentinel</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="sentinel-shell" aria-labelledby="sentinel-title">
    <section class="sentinel-panel">
      <p class="eyebrow">Adaptive traffic control</p>
      <h1 id="sentinel-title">Backpressure Queue Sentinel</h1>
      <p class="summary">Queue lanes slow incoming work, protect workers, and shed overload before latency turns into an outage.</p>
      <div class="queue-stage" role="img" aria-label="Animated queue backpressure dashboard">
        <div class="ingress"><span>Ingress</span><i></i><i></i><i></i></div>
        <div class="queue-lanes">
          <div class="lane lane-hot"><b></b><b></b><b></b><b></b><b></b></div>
          <div class="lane lane-steady"><b></b><b></b><b></b><b></b></div>
          <div class="lane lane-drain"><b></b><b></b><b></b></div>
        </div>
        <div class="worker-grid"><span></span><span></span><span></span><span></span></div>
        <div class="pressure-ring"></div>
      </div>
      <div class="status-strip">
        <span>depth 78%</span><span>shed 4%</span><span>p95 stable</span>
      </div>
    </section>
  </main>
</body>
</html>
