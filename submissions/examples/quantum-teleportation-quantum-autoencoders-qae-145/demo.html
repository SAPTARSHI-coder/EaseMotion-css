<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Autoencoders QAE - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css"></head><body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030712; color: #ffffff;">

    <div class="ease-card ease-card-glass qae-container">
        <div class="qae-header">
            <h2>Quantum Autoencoder (QAE)</h2>
            <span class="ease-badge ease-badge-secondary">Quantum Machine Learning</span>
        </div>
        
        <div class="qae-screen ease-center">
            <div class="qae-flux flux-qae-a"></div>
            <div class="qae-flux flux-qae-b"></div>
            <div class="qae-boundary-ring"></div>
            <div class="qae-core ease-center"></div>
        </div>

        <div class="qae-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Compressing States &amp; Fidelity Maximization</span>
            <button class="ease-btn ease-btn-secondary ease-btn-sm ease-hover-grow">Run QAE Compression</button>
        </div>
    </div></body></html>
