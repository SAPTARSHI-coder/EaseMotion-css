<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EaseMotion CSS — Multistep Progress Stepper</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="demo-header">
    <h1>🚀 Checkout — Progress Stepper Demo</h1>
    <button class="theme-toggle" id="themeToggle" type="button" aria-pressed="false">
      🌙 Dark mode
    </button>
  </header>

  <main class="demo-wrap">
    <div class="demo-card">

      <nav class="ease-stepper" id="stepper" aria-label="Checkout progress">
        <div class="ease-stepper__item ease-stepper__item--active" data-step="1">
          <div class="ease-stepper__connector">
            <div class="ease-stepper__connector-fill"></div>
          </div>
          <div class="ease-stepper__circle" aria-current="step">
            <span class="ease-stepper__number">1</span>
            <span class="ease-stepper__check" aria-hidden="true">✓</span>
          </div>
          <span class="ease-stepper__label">Cart</span>
        </div>

        <div class="ease-stepper__item" data-step="2">
          <div class="ease-stepper__connector">
            <div class="ease-stepper__connector-fill"></div>
          </div>
          <div class="ease-stepper__circle">
            <span class="ease-stepper__number">2</span>
            <span class="ease-stepper__check" aria-hidden="true">✓</span>
          </div>
          <span class="ease-stepper__label">Shipping</span>
        </div>

        <div class="ease-stepper__item" data-step="3">
          <div class="ease-stepper__connector">
            <div class="ease-stepper__connector-fill"></div>
          </div>
          <div class="ease-stepper__circle">
            <span class="ease-stepper__number">3</span>
            <span class="ease-stepper__check" aria-hidden="true">✓</span>
          </div>
          <span class="ease-stepper__label">Payment</span>
        </div>

        <div class="ease-stepper__item" data-step="4">
          <div class="ease-stepper__connector">
            <div class="ease-stepper__connector-fill"></div>
          </div>
          <div class="ease-stepper__circle">
            <span class="ease-stepper__number">4</span>
            <span class="ease-stepper__check" aria-hidden="true">✓</span>
          </div>
          <span class="ease-stepper__label">Review</span>
        </div>

        <div class="ease-stepper__item" data-step="5">
          <div class="ease-stepper__connector">
            <div class="ease-stepper__connector-fill"></div>
          </div>
          <div class="ease-stepper__circle">
            <span class="ease-stepper__number">5</span>
            <span class="ease-stepper__check" aria-hidden="true">✓</span>
          </div>
          <span class="ease-stepper__label">Done</span>
        </div>
      </nav>

      <div class="demo-controls">
        <button type="button" id="backBtn" disabled>← Back</button>
        <button type="button" id="nextBtn" class="primary">Next →</button>
      </div>

    </div>
  </main>

  <script>
    // --------------------------------------------------------------------
    // Demo wiring only. The .ease-stepper component itself is pure CSS;
    // this script just toggles state classes on click to move the step.
    // --------------------------------------------------------------------
    const items = Array.from(document.querySelectorAll(".ease-stepper__item"));
    const backBtn = document.getElementById("backBtn");
    const nextBtn = document.getElementById("nextBtn");
    let current = 1;
    const total = items.length;

    function render() {
      items.forEach((item, index) => {
        const step = index + 1;
        item.classList.remove("ease-stepper__item--active", "ease-stepper__item--completed");
        const circle = item.querySelector(".ease-stepper__circle");
        circle.removeAttribute("aria-current");

        if (step < current) {
          item.classList.add("ease-stepper__item--completed");
        } else if (step === current) {
          item.classList.add("ease-stepper__item--active");
          circle.setAttribute("aria-current", "step");
        }
      });

      backBtn.disabled = current === 1;
      nextBtn.textContent = current === total ? "Restart" : "Next →";
    }

    backBtn.addEventListener("click", () => {
      if (current > 1) {
        current -= 1;
        render();
      }
    });

    nextBtn.addEventListener("click", () => {
      if (current === total) {
        current = 1;
      } else {
        current += 1;
      }
      render();
    });

    // Dark mode toggle
    const themeToggle = document.getElementById("themeToggle");
    themeToggle.addEventListener("click", () => {
      const isDark = document.documentElement.getAttribute("data-theme") === "dark";
      const next = isDark ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      themeToggle.setAttribute("aria-pressed", String(!isDark));
      themeToggle.textContent = next === "dark" ? "☀️ Light mode" : "🌙 Dark mode";
    });

    render();
  </script>

</body>
</html>
