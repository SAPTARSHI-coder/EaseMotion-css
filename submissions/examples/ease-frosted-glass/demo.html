<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Frosted Glass – Becomes Transparent on Interaction</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <h1>🪟 Frosted Glass</h1>
    <p class="subtitle">Becomes transparent on interaction</p>

    <div class="glass-container">
      <div class="glass-scene">
        <!-- Background pattern behind glass -->
        <div class="bg-pattern">
          <div class="bg-content">
            <div class="bg-text">✦</div>
            <div class="bg-text large">GLASS</div>
            <div class="bg-text small">Hover to see through</div>
            <div class="bg-grid"></div>
          </div>
        </div>
        
        <!-- Frosted glass overlay -->
        <div class="glass-overlay" id="glassOverlay">
          <div class="glass-surface" id="glassSurface"></div>
          <div class="glass-frost" id="glassFrost">
            <div class="frost-pattern"></div>
          </div>
          <div class="glass-shine"></div>
          <div class="glass-condensation" id="glassCondensation"></div>
          <div class="glass-label">
            <span class="label-icon">🪟</span>
            <span class="label-text">Frosted</span>
          </div>
        </div>
        
        <!-- Info overlay -->
        <div class="info-overlay">
          <span class="glass-status" id="glassStatus">❄️ Frosted</span>
          <span class="glass-clarity" id="glassClarity">Clarity: 0%</span>
        </div>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <button class="ctrl-btn clear" id="clearBtn">🔍 Clear</button>
      <button class="ctrl-btn frost" id="frostBtn">❄️ Frost</button>
      <button class="ctrl-btn toggle" id="toggleBtn">🔄 Toggle</button>
      <button class="ctrl-btn reset" id="resetBtn">↺ Reset</button>
    </div>

    <!-- Sliders -->
    <div class="slider-container">
      <span class="slider-label">Clarity</span>
      <input type="range" id="claritySlider" min="0" max="100" value="0" />
      <span class="slider-value" id="clarityValue">0%</span>
    </div>

    <div class="slider-container">
      <span class="slider-label">Frost Intensity</span>
      <input type="range" id="frostSlider" min="0" max="100" value="80" />
      <span class="slider-value" id="frostValue">80%</span>
    </div>

    <div class="slider-container">
      <span class="slider-label">Glare</span>
      <input type="range" id="glareSlider" min="0" max="100" value="30" />
      <span class="slider-value" id="glareValue">30%</span>
    </div>

    <!-- Status -->
    <div class="status" id="status">🪟 Hover over the glass to see through it</div>

    <!-- Keyboard shortcuts -->
    <div class="shortcuts">
      <kbd>Hover</kbd> Clear · <kbd>C</kbd> Clear · <kbd>F</kbd> Frost · <kbd>T</kbd> Toggle
    </div>
  </div>

  <script>
    (function() {
      "use strict";

      // DOM elements
      const glassOverlay = document.getElementById('glassOverlay');
      const glassSurface = document.getElementById('glassSurface');
      const glassFrost = document.getElementById('glassFrost');
      const glassCondensation = document.getElementById('glassCondensation');
      const glassStatus = document.getElementById('glassStatus');
      const glassClarity = document.getElementById('glassClarity');
      const clearBtn = document.getElementById('clearBtn');
      const frostBtn = document.getElementById('frostBtn');
      const toggleBtn = document.getElementById('toggleBtn');
      const resetBtn = document.getElementById('resetBtn');
      const status = document.getElementById('status');
      const claritySlider = document.getElementById('claritySlider');
      const clarityValue = document.getElementById('clarityValue');
      const frostSlider = document.getElementById('frostSlider');
      const frostValue = document.getElementById('frostValue');
      const glareSlider = document.getElementById('glareSlider');
      const glareValue = document.getElementById('glareValue');

      // State
      let clarity = 0; // 0 = frosted, 100 = clear
      let targetClarity = 0;
      let isHovering = false;
      let isClear = false;
      let animationId = null;
      let time = 0;
      let condensationDrops = [];

      // ----- Create condensation drops -----
      function createCondensation() {
        const container = glassCondensation;
        container.innerHTML = '';
        condensationDrops = [];
        
        const count = 30 + Math.floor(Math.random() * 40);
        for (let i = 0; i < count; i++) {
          const drop = document.createElement('div');
          drop.className = 'condensation-drop';
          const x = Math.random() * 100;
          const y = Math.random() * 100;
          const size = 2 + Math.random() * 6;
          const opacity = 0.1 + Math.random() * 0.3;
          const blur = 1 + Math.random() * 3;
          
          drop.style.left = x + '%';
          drop.style.top = y + '%';
          drop.style.width = size + 'px';
          drop.style.height = size + 'px';
          drop.style.opacity = opacity;
          drop.style.filter = `blur(${blur}px)`;
          drop.style.animationDelay = (Math.random() * 3) + 's';
          drop.style.animationDuration = (3 + Math.random() * 4) + 's';
          
          container.appendChild(drop);
          condensationDrops.push({ x, y, size, opacity, blur, element: drop });
        }
      }

      // ----- Update glass effect -----
      function updateGlass() {
        const clarityVal = clarity / 100;
        const frostIntensity = parseInt(frostSlider.value) / 100;
        const glareIntensity = parseInt(glareSlider.value) / 100;

        // Update glass surface transparency
        const opacity = 0.6 + 0.3 * (1 - clarityVal);
        glassSurface.style.opacity = opacity;
        glassSurface.style.backdropFilter = `blur(${4 + (1 - clarityVal) * 16}px)`;

        // Update frost pattern opacity
        glassFrost.style.opacity = (1 - clarityVal) * frostIntensity;

        // Update condensation
        const condOpacity = (1 - clarityVal) * 0.6;
        glassCondensation.style.opacity = condOpacity;

        // Update glass shine
        const shine = document.querySelector('.glass-shine');
        if (shine) {
          shine.style.opacity = 0.1 + glareIntensity * 0.2;
        }

        // Update glass label
        const label = document.querySelector('.glass-label');
        if (label) {
          label.style.opacity = 0.4 + 0.6 * (1 - clarityVal);
        }

        // Update status
        const statusText = clarityVal < 0.2 ? '❄️ Frosted' :
                          clarityVal < 0.5 ? '🧊 Partially Clear' :
                          clarityVal < 0.8 ? '🔍 Clearing' : '✨ Clear';
        glassStatus.textContent = statusText;
        glassClarity.textContent = `Clarity: ${Math.round(clarity)}%`;
        clarityValue.textContent = Math.round(clarity) + '%';

        // Update cursor
        glassOverlay.style.cursor = 'pointer';
      }

      // ----- Animation loop -----
      function animate() {
        time += 0.016;

        // Smooth interpolation for clarity
        const diff = targetClarity - clarity;
        if (Math.abs(diff) > 0.1) {
          const speed = isHovering ? 4 : 2;
          clarity += diff * 0.04 * speed;
        } else {
          clarity = targetClarity;
        }

        // Clamp
        clarity = Math.max(0, Math.min(100, clarity));

        updateGlass();
        animationId = requestAnimationFrame(animate);
      }

      // ----- Start animation -----
      function startAnimation() {
        if (animationId) {
          cancelAnimationFrame(animationId);
        }
        animate();
      }

      // ----- Set clarity -----
      function setClarity(value) {
        targetClarity = Math.max(0, Math.min(100, value));
        claritySlider.value = targetClarity;
        clarityValue.textContent = Math.round(targetClarity) + '%';
        if (targetClarity > 50) {
          isClear = true;
          status.textContent = '✨ Glass is becoming clear';
        } else {
          isClear = false;
          status.textContent = '❄️ Glass is frosting over';
        }
      }

      // ----- Clear glass -----
      function clearGlass() {
        setClarity(100);
        status.textContent = '🔍 Glass cleared!';
        setTimeout(() => {
          if (!isHovering) {
            status.textContent = '🪟 Hover over the glass to see through it';
          }
        }, 1500);
      }

      // ----- Frost glass -----
      function frostGlass() {
        setClarity(0);
        status.textContent = '❄️ Glass frosted!';
        setTimeout(() => {
          if (!isHovering) {
            status.textContent = '🪟 Hover over the glass to see through it';
          }
        }, 1500);
      }

      // ----- Toggle -----
      function toggleGlass() {
        if (clarity > 50) {
          frostGlass();
        } else {
          clearGlass();
        }
      }

      // ----- Reset -----
      function resetGlass() {
        setClarity(0);
        frostSlider.value = 80;
        frostValue.textContent = '80%';
        glareSlider.value = 30;
        glareValue.textContent = '30%';
        isClear = false;
        status.textContent = '↺ Reset';
        setTimeout(() => {
          status.textContent = '🪟 Hover over the glass to see through it';
        }, 500);
      }

      // ----- Event Listeners -----
      // Hover effects
      glassOverlay.addEventListener('mouseenter', () => {
        isHovering = true;
        setClarity(100);
        status.textContent = '🔍 Looking through the glass...';
      });

      glassOverlay.addEventListener('mouseleave', () => {
        isHovering = false;
        setClarity(0);
        status.textContent = '❄️ Glass frosting over...';
        setTimeout(() => {
          if (!isHovering) {
            status.textContent = '🪟 Hover over the glass to see through it';
          }
        }, 1000);
      });

      // Click to toggle
      glassOverlay.addEventListener('click', toggleGlass);

      // Buttons
      clearBtn.addEventListener('click', clearGlass);
      frostBtn.addEventListener('click', frostGlass);
      toggleBtn.addEventListener('click', toggleGlass);
      resetBtn.addEventListener('click', resetGlass);

      // Sliders
      claritySlider.addEventListener('input', (e) => {
        const val = parseFloat(e.target.value);
        setClarity(val);
      });

      frostSlider.addEventListener('input', (e) => {
        frostValue.textContent = e.target.value + '%';
        updateGlass();
      });

      glareSlider.addEventListener('input', (e) => {
        glareValue.textContent = e.target.value + '%';
        updateGlass();
      });

      // Keyboard shortcuts
      document.addEventListener('keydown', (e) => {
        if (e.key === 'c' || e.key === 'C') {
          e.preventDefault();
          clearGlass();
        }
        if (e.key === 'f' || e.key === 'F') {
          e.preventDefault();
          frostGlass();
        }
        if (e.key === 't' || e.key === 'T') {
          e.preventDefault();
          toggleGlass();
        }
        if (e.key === 'r' || e.key === 'R') {
          e.preventDefault();
          resetGlass();
        }
        if (e.key === ' ' || e.key === 'Space') {
          e.preventDefault();
          toggleGlass();
        }
      });

      // ----- Resize handler -----
      let resizeTimeout;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(() => {
          createCondensation();
        }, 300);
      });

      // ----- Init -----
      function init() {
        createCondensation();
        setClarity(0);
        startAnimation();
        status.textContent = '🪟 Hover over the glass to see through it!';
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }

    })();
  </script>
</body>
</html>
