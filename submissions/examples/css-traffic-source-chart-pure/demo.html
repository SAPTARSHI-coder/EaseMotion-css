<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Traffic Source Chart</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header class="header">
            <h1 class="title">Traffic Sources</h1>
            <p>Pure CSS horizontal bar chart with load animations.</p>
        </header>

        <main class="content-area">
            
            <div class="chart-card" role="region" aria-label="Traffic Sources Bar Chart">
                
                <!-- Chart Header -->
                <div class="chart-header">
                    <h2>Acquisition Overview</h2>
                    <span class="date-range">Last 30 Days</span>
                </div>

                <!-- 
                  Chart Data Rows 
                  The --percent variable dictates the bar width and is picked up by the CSS.
                -->
                <ul class="bar-chart">
                    
                    <li class="chart-row" style="--percent: 45%;">
                        <div class="row-label">
                            <span class="source-name">Organic Search</span>
                            <span class="source-value">45%</span>
                        </div>
                        <div class="bar-track">
                            <!-- Theme class dictates color -->
                            <div class="bar-fill color-primary"></div>
                        </div>
                    </li>

                    <li class="chart-row" style="--percent: 28%;">
                        <div class="row-label">
                            <span class="source-name">Direct</span>
                            <span class="source-value">28%</span>
                        </div>
                        <div class="bar-track">
                            <div class="bar-fill color-secondary"></div>
                        </div>
                    </li>

                    <li class="chart-row" style="--percent: 15%;">
                        <div class="row-label">
                            <span class="source-name">Social Media</span>
                            <span class="source-value">15%</span>
                        </div>
                        <div class="bar-track">
                            <div class="bar-fill color-tertiary"></div>
                        </div>
                    </li>

                    <li class="chart-row" style="--percent: 8%;">
                        <div class="row-label">
                            <span class="source-name">Referral</span>
                            <span class="source-value">8%</span>
                        </div>
                        <div class="bar-track">
                            <div class="bar-fill color-quaternary"></div>
                        </div>
                    </li>

                    <li class="chart-row" style="--percent: 4%;">
                        <div class="row-label">
                            <span class="source-name">Email</span>
                            <span class="source-value">4%</span>
                        </div>
                        <div class="bar-track">
                            <div class="bar-fill color-quinary"></div>
                        </div>
                    </li>

                </ul>
                
                <!-- Chart Footer / Legend Area -->
                <div class="chart-footer">
                    <div class="total-metric">
                        <span class="metric-label">Total Visits</span>
                        <span class="metric-value">124,592</span>
                    </div>
                </div>

            </div>
            
        </main>
    </div>

</body>
</html>
