<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toast Stack - EaseMotion Submission</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="stage">
    <h1 class="page-title">Notifications</h1>
    <div class="toast-zone" id="toastZone" aria-live="polite"></div>
    <div class="controls">
      <button class="push-btn" id="pushInfo">Info</button>
      <button class="push-btn success" id="pushSuccess">Success</button>
      <button class="push-btn warn" id="pushWarn">Warning</button>
      <button class="clear-btn" id="clearBtn">Clear All</button>
    </div>
    <p class="hint">Toasts spring in from the right, show a draining progress bar, and slide out.</p>
  </main>

  <script>
    const zone = document.getElementById('toastZone');
    const icons = { info: 'ℹ️', success: '✅', warn: '⚠️' };
    const messages = {
      info: ['New update available', 'Your profile was viewed', 'Meeting starts in 10 minutes'],
      success: ['Changes saved successfully', 'Payment received', 'Deploy finished in 41s'],
      warn: ['Storage almost full', 'Rate limit approaching', 'SSL certificate expiring soon']
    };

    function push(kind) {
      const toast = document.createElement('div');
      toast.className = 'toast toast-' + kind;
      const text = messages[kind][Math.floor(Math.random() * messages[kind].length)];
      toast.innerHTML =
        '<span class="toast-icon">' + icons[kind] + '</span>' +
        '<span class="toast-text">' + text + '</span>' +
        '<button class="toast-close" aria-label="Dismiss">×</button>' +
        '<span class="toast-bar"></span>';

      zone.appendChild(toast);
      requestAnimationFrame(() => toast.classList.add('in'));

      toast.querySelector('.toast-close').addEventListener('click', () => dismiss(toast));

      const life = setTimeout(() => dismiss(toast), 4500);
      toast.dataset.life = life;

      while (zone.children.length > 4) {
        zone.removeChild(zone.firstChild);
      }
    }

    function dismiss(toast) {
      clearTimeout(Number(toast.dataset.life));
      toast.classList.remove('in');
      toast.classList.add('out');
      toast.addEventListener('animationend', () => toast.remove(), { once: true });
    }

    document.getElementById('pushInfo').addEventListener('click', () => push('info'));
    document.getElementById('pushSuccess').addEventListener('click', () => push('success'));
    document.getElementById('pushWarn').addEventListener('click', () => push('warn'));
    document.getElementById('clearBtn').addEventListener('click', () => {
      [...zone.children].forEach(dismiss);
    });
  </script>
</body>
</html>
