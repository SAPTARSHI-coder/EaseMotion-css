<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Sci-Fi HUD: Origami Paper Fold</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <!-- The 3D Perspective Container -->
  <div class="hud-perspective">
    <button class="origami-hud" aria-label="Expand Data Core">
      
      <!-- The Central Data Core -->
      <div class="hud-core">
        <h2 class="core-title">Sync Rate</h2>
        <div class="core-value">98.4%</div>
      </div>

      <!-- The 4 Folding Flaps -->
      <div class="fold-flap flap-top" aria-hidden="true"></div>
      <div class="fold-flap flap-bottom" aria-hidden="true"></div>
      <div class="fold-flap flap-left" aria-hidden="true"></div>
      <div class="fold-flap flap-right" aria-hidden="true"></div>

    </button>
  </div>

</body>
</html>
