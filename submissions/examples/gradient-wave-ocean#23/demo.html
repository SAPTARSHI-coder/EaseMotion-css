<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradient Wave Ocean | EaseMotion CSS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="ocean-scene">
        <!-- Sky Gradient Background -->
        <div class="sky"></div>

        <!-- Sun/Moon Glow -->
        <div class="celestial-glow"></div>

        <!-- Wave Layers (Back to Front) -->
        <div class="wave-layer wave-1">
            <div class="wave wave-shape-1"></div>
            <div class="wave wave-shape-2"></div>
        </div>

        <div class="wave-layer wave-2">
            <div class="wave wave-shape-3"></div>
            <div class="wave wave-shape-4"></div>
        </div>

        <div class="wave-layer wave-3">
            <div class="wave wave-shape-5"></div>
            <div class="wave wave-shape-6"></div>
        </div>

        <div class="wave-layer wave-4">
            <div class="wave wave-shape-7"></div>
            <div class="wave wave-shape-8"></div>
        </div>

        <!-- Floating Bubbles -->
        <div class="bubbles">
            <span class="bubble b1"></span>
            <span class="bubble b2"></span>
            <span class="bubble b3"></span>
            <span class="bubble b4"></span>
            <span class="bubble b5"></span>
            <span class="bubble b6"></span>
            <span class="bubble b7"></span>
            <span class="bubble b8"></span>
        </div>

        <!-- Floating Particles (Sparkles) -->
        <div class="sparkles">
            <span class="sparkle sp1"></span>
            <span class="sparkle sp2"></span>
            <span class="sparkle sp3"></span>
            <span class="sparkle sp4"></span>
            <span class="sparkle sp5"></span>
            <span class="sparkle sp6"></span>
        </div>

        <!-- Horizon Glow Line -->
        <div class="horizon-glow"></div>
    </div>
</body>
</html>
