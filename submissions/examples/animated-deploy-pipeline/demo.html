<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CSS Animated Deploy Pipeline</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<h1>CI/CD Deploy Pipeline</h1>

<div class="pipeline" aria-label="Deployment pipeline">

<div class="step">
<div class="circle">✓</div>
<h3>Build</h3>
<p>Source compiled</p>
</div>


<div class="line"></div>


<div class="step">
<div class="circle">✓</div>
<h3>Test</h3>
<p>Tests running</p>
</div>


<div class="line"></div>


<div class="step active">
<div class="circle">⚙</div>
<h3>Deploy</h3>
<p>Deploying...</p>
</div>


<div class="line"></div>


<div class="step">
<div class="circle">🚀</div>
<h3>Release</h3>
<p>Production ready</p>
</div>

</div>

</div>

</body>
</html>
