<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EaseMotion CSS - Float-Drift Carousel for Fintech Dashboard</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="fd-carousel">
      <header class="fd-carousel__header">
        <div class="fd-carousel__header-left">
          <h2 class="fd-carousel__title">Portfolio Overview</h2>
          <p class="fd-carousel__subtitle">Real-time financial metrics</p>
        </div>
        <nav class="fd-carousel__controls" aria-label="Carousel controls">
          <button
            class="fd-carousel__btn fd-carousel__btn--prev"
            aria-label="Previous slides"
          >
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <polyline points="15 18 9 12 15 6" />
            </svg>
          </button>
          <span class="fd-carousel__counter" aria-live="polite">
            <span class="fd-carousel__counter-current">1</span>
            /
            <span class="fd-carousel__counter-total">6</span>
          </span>
          <button
            class="fd-carousel__btn fd-carousel__btn--next"
            aria-label="Next slides"
          >
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <polyline points="9 18 15 12 9 6" />
            </svg>
          </button>
        </nav>
      </header>

      <section class="fd-carousel__track" aria-label="Financial metrics">
        <!-- Card 1: Total Assets -->
        <article class="fd-carousel__card fd-carousel__card--float">
          <div class="fd-card">
            <div class="fd-card__header">
              <span class="fd-card__icon fd-card__icon--blue">
                <svg
                  width="20"
                  height="20"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <rect x="2" y="7" width="20" height="14" rx="2" ry="2" />
                  <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16" />
                </svg>
              </span>
              <span class="fd-card__badge fd-card__badge--up">+5.2%</span>
            </div>
            <h3 class="fd-card__label">Total Assets</h3>
            <p class="fd-card__value">$2.4M</p>
            <div class="fd-card__sparkline" aria-hidden="true">
              <svg viewBox="0 0 100 30" preserveAspectRatio="none">
                <polyline
                  points="0,25 15,20 30,22 45,15 60,18 75,10 100,5"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                />
              </svg>
            </div>
          </div>
        </article>

        <!-- Card 2: Monthly Revenue -->
        <article class="fd-carousel__card fd-carousel__card--drift">
          <div class="fd-card">
            <div class="fd-card__header">
              <span class="fd-card__icon fd-card__icon--green">
                <svg
                  width="20"
                  height="20"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <line x1="12" y1="1" x2="12" y2="23" />
                  <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6" />
                </svg>
              </span>
              <span class="fd-card__badge fd-card__badge--up">+12.8%</span>
            </div>
            <h3 class="fd-card__label">Monthly Revenue</h3>
            <p class="fd-card__value">$184,592</p>
            <div class="fd-card__sparkline" aria-hidden="true">
              <svg viewBox="0 0 100 30" preserveAspectRatio="none">
                <polyline
                  points="0,28 15,24 30,20 45,22 60,15 75,8 100,3"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                />
              </svg>
            </div>
          </div>
        </article>

        <!-- Card 3: Active Investors -->
        <article class="fd-carousel__card fd-carousel__card--float">
          <div class="fd-card">
            <div class="fd-card__header">
              <span class="fd-card__icon fd-card__icon--purple">
                <svg
                  width="20"
                  height="20"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
                  <circle cx="9" cy="7" r="4" />
                  <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
                  <path d="M16 3.13a4 4 0 0 1 0 7.75" />
                </svg>
              </span>
              <span class="fd-card__badge fd-card__badge--up">+3.1%</span>
            </div>
            <h3 class="fd-card__label">Active Investors</h3>
            <p class="fd-card__value">12,847</p>
            <div class="fd-card__sparkline" aria-hidden="true">
              <svg viewBox="0 0 100 30" preserveAspectRatio="none">
                <polyline
                  points="0,22 15,18 30,20 45,14 60,12 75,8 100,6"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                />
              </svg>
            </div>
          </div>
        </article>

        <!-- Card 4: ROI -->
        <article class="fd-carousel__card fd-carousel__card--drift">
          <div class="fd-card">
            <div class="fd-card__header">
              <span class="fd-card__icon fd-card__icon--amber">
                <svg
                  width="20"
                  height="20"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <polyline points="23 6 13.5 15.5 8.5 10.5 1 18" />
                  <polyline points="17 6 23 6 23 12" />
                </svg>
              </span>
              <span class="fd-card__badge fd-card__badge--down">-1.4%</span>
            </div>
            <h3 class="fd-card__label">Return on Investment</h3>
            <p class="fd-card__value">18.7%</p>
            <div class="fd-card__sparkline" aria-hidden="true">
              <svg viewBox="0 0 100 30" preserveAspectRatio="none">
                <polyline
                  points="0,8 15,12 30,10 45,15 60,18 75,14 100,16"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                />
              </svg>
            </div>
          </div>
        </article>

        <!-- Card 5: Transactions -->
        <article class="fd-carousel__card fd-carousel__card--float">
          <div class="fd-card">
            <div class="fd-card__header">
              <span class="fd-card__icon fd-card__icon--cyan">
                <svg
                  width="20"
                  height="20"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <rect x="1" y="4" width="22" height="16" rx="2" ry="2" />
                  <line x1="1" y1="10" x2="23" y2="10" />
                </svg>
              </span>
              <span class="fd-card__badge fd-card__badge--up">+22.3%</span>
            </div>
            <h3 class="fd-card__label">Transactions</h3>
            <p class="fd-card__value">847K</p>
            <div class="fd-card__sparkline" aria-hidden="true">
              <svg viewBox="0 0 100 30" preserveAspectRatio="none">
                <polyline
                  points="0,26 15,20 30,24 45,16 60,12 75,6 100,2"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                />
              </svg>
            </div>
          </div>
        </article>

        <!-- Card 6: Risk Score -->
        <article class="fd-carousel__card fd-carousel__card--drift">
          <div class="fd-card">
            <div class="fd-card__header">
              <span class="fd-card__icon fd-card__icon--red">
                <svg
                  width="20"
                  height="20"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path
                    d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"
                  />
                  <line x1="12" y1="9" x2="12" y2="13" />
                  <line x1="12" y1="17" x2="12.01" y2="17" />
                </svg>
              </span>
              <span class="fd-card__badge fd-card__badge--down">-0.8%</span>
            </div>
            <h3 class="fd-card__label">Risk Score</h3>
            <p class="fd-card__value">Low</p>
            <div class="fd-card__sparkline" aria-hidden="true">
              <svg viewBox="0 0 100 30" preserveAspectRatio="none">
                <polyline
                  points="0,12 15,10 30,14 45,12 60,16 75,18 100,20"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                />
              </svg>
            </div>
          </div>
        </article>
      </section>

      <div
        class="fd-carousel__dots"
        role="tablist"
        aria-label="Slide navigation"
      >
        <button
          class="fd-carousel__dot fd-carousel__dot--active"
          role="tab"
          aria-selected="true"
          aria-label="Go to slide 1"
        ></button>
        <button
          class="fd-carousel__dot"
          role="tab"
          aria-selected="false"
          aria-label="Go to slide 2"
        ></button>
        <button
          class="fd-carousel__dot"
          role="tab"
          aria-selected="false"
          aria-label="Go to slide 3"
        ></button>
      </div>

      <div
        class="fd-carousel__track-bar"
        role="progressbar"
        aria-label="Scroll progress"
      >
        <div class="fd-carousel__track-bar-fill"></div>
      </div>
    </main>
  </body>
</html>
