<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Cinematic Crop Hero | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="hero-wrapper" aria-label="Cinematic Crop Hero Feature Demo">
    <header class="hero-header">
      <h1>CSS Cinematic Crop Hero</h1>
      <p>Hero banner featuring automatic widescreen letterbox cropping and content reveal keyframe animations.</p>
    </header>

    <section class="cinematic-hero" role="region" aria-label="Cinematic Showcase Hero">
      <div class="hero-bg" role="img" aria-label="Dramatic mountain landscape background image"></div>

      <div class="hero-content">
        <span class="hero-tag">Cinematic Experience</span>
        <h2 class="hero-title">A New Horizon Awaits</h2>
        <p class="hero-subtitle">Immerse your users with instant CSS-only wide-aspect crop transitions on load.</p>
        <a href="#explore" class="hero-btn">
          <span>Explore Feature</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </a>
      </div>
    </section>
  </main>
</body>
</html>
