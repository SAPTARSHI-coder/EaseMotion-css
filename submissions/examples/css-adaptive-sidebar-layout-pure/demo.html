<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Adaptive Sidebar Layout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 
      [TECHNIQUE] The Adaptive Layout Wrapper
      This container handles the macro-layout of the application.
      On desktop, it uses CSS Grid/Flexbox to place the sidebar on the left.
      On mobile (using media queries), it collapses the sidebar into a sticky 
      bottom navigation bar.
    -->
    <div class="app-layout">
        
        <!-- The Adaptive Navigation Bar -->
        <nav class="adaptive-nav" aria-label="Main Navigation">
            <div class="nav-brand">
                <div class="brand-logo"></div>
                <span class="brand-text">EaseMotion</span>
            </div>
            
            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="#" class="nav-link active" aria-current="page">
                        <!-- Simplified SVG Icons for demo purposes -->
                        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                            <polyline points="9 22 9 12 15 12 15 22"></polyline>
                        </svg>
                        <span class="nav-text">Home</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link">
                        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"></circle>
                            <line x1="12" y1="16" x2="12" y2="12"></line>
                            <line x1="12" y1="8" x2="12.01" y2="8"></line>
                        </svg>
                        <span class="nav-text">Explore</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link">
                        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                        </svg>
                        <span class="nav-text">Messages</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link">
                        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                        <span class="nav-text">Profile</span>
                    </a>
                </li>
            </ul>
        </nav>
        
        <!-- The Main Application Content -->
        <main class="main-content">
            <header class="content-header">
                <h1 class="page-title">Dashboard</h1>
                <p class="page-subtitle">Resize your browser window to see the sidebar adapt into a mobile bottom navigation bar.</p>
            </header>
            
            <div class="content-grid">
                <!-- Placeholder content cards to demonstrate scrolling behavior -->
                <div class="card"></div>
                <div class="card"></div>
                <div class="card"></div>
                <div class="card"></div>
                <div class="card"></div>
                <div class="card"></div>
            </div>
        </main>
        
    </div>

</body>
</html>
