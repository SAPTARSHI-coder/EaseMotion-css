<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Neon Text — EaseMotion CSS</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="neontext-page-tm" data-palette="amber">
  <h1 class="neontext-h-tm">Neon Text</h1>
  <p class="neontext-lede-tm">A self-contained demo with three variants of the effect.</p>
  <section class="neontext-row-tm">
    <article class="neontext-1-wrap-tm">
      <div class="neontext-1-tm"></div>
      <span class="neontext-lbl-tm">Example One</span>
    </article>
    <article class="neontext-2-wrap-tm">
      <div class="neontext-2-tm"></div>
      <span class="neontext-lbl-tm">Example Two</span>
    </article>
    <article class="neontext-3-wrap-tm">
      <div class="neontext-3-tm"></div>
      <span class="neontext-lbl-tm">Example Three</span>
    </article>
  </section>
</main>
</body>
</html>
