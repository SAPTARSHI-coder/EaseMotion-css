<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animated Star Rating</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <h1>Animated Star Rating</h1>

    <fieldset class="star-rating" id="starRating">
      <legend>Rate your experience</legend>
      <input type="radio" id="star5" name="rating" value="5">
      <label for="star5" class="star-label" aria-label="5 stars">★</label>
      <input type="radio" id="star4" name="rating" value="4">
      <label for="star4" class="star-label" aria-label="4 stars">★</label>
      <input type="radio" id="star3" name="rating" value="3" checked>
      <label for="star3" class="star-label" aria-label="3 stars">★</label>
      <input type="radio" id="star2" name="rating" value="2">
      <label for="star2" class="star-label" aria-label="2 stars">★</label>
      <input type="radio" id="star1" name="rating" value="1">
      <label for="star1" class="star-label" aria-label="1 star">★</label>
    </fieldset>
  </main>
</body>
</html>
