<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Mode Border Glow-Up Demo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #0b0f19; margin: 0;">

    <div style="text-align: center;">
        <h2 style="color: #ffffff; margin-bottom: 10px;">Dark Mode Border Glow-Up</h2>
        <p style="color: #64748b; margin-bottom: 30px;">Hover over the card interface to experience the smooth border accent tint.</p>
        
        <!-- Interactive Card Layout -->
        <div class="ease-dark-card ease-border-glow" style="width: 280px; padding: 24px; background: #111827; border: 1px solid #1f2937; border-radius: 12px; color: #ffffff; transition: border-color 0.3s ease; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3); text-align: left; margin: 0 auto; cursor: pointer;">
            <div style="width: 40px; height: 40px; background: #312e81; border-radius: 8px; margin-bottom: 16px; display: flex; justify-content: center; align-items: center; color: #6366f1; font-weight: bold;">⚡</div>
            <h4 style="margin: 0 0 8px 0; font-size: 18px;">Interface Token</h4>
            <p style="margin: 0; color: #9ca3af; font-size: 14px; line-height: 1.5;">This item utilizes high-performance linear transitions to dynamically glow.</p>
        </div>
    </div>

</body>
</html>
