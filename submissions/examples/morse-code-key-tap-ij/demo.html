<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-morse-code-key-tap demo</title>
</head>
<body>
<div class="mc-app">
  <span class="mc-title">MORSE KEY</span>
  <div class="mc-base">
    <span class="mc-key">
      <span class="mc-knob"></span>
      <span class="mc-arm"></span>
    </span>
    <span class="mc-pivot"></span>
    <span class="mc-contact"></span>
    <span class="mc-spring"></span>
  </div>
  <span class="mc-lamp"></span>
  <div class="mc-msg">
    <span class="mc-dot"></span>
    <span class="mc-dash"></span>
    <span class="mc-dot"></span>
    <span class="mc-space"></span>
    <span class="mc-dash"></span>
    <span class="mc-dot"></span>
    <span class="mc-cursor"></span>
  </div>
  <div class="mc-buzzer"><span class="mc-coil"></span></div>
</div>
</body>
</html>
