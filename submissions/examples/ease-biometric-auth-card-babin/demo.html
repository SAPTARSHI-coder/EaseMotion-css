<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EaseMotion CSS - Biometric Auth Interface</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="auth-wrapper">
    <div class="auth-card ease-card-glow">
      <div class="card-header">
        <div class="security-shield ease-shield-pulse">
          <svg class="shield-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          </svg>
        </div>
        <h1 class="auth-title">Biometric Authentication</h1>
        <p class="auth-subtitle">Touch fingerprint scanner or hold camera for face identity verification</p>
      </div>

      <div class="scanner-zone">
        <div class="fingerprint-container ease-scan-ripple">
          <div class="laser-beam ease-laser-sweep"></div>
          <svg class="fingerprint-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M12 11c0-1.1-.9-2-2-2s-2 .9-2 2c0 1.95 1.25 3.65 3.01 4.25"/>
            <path d="M12 7c-2.21 0-4 1.79-4 4 0 2.8 1.75 5.2 4.25 6.1"/>
            <path d="M12 3c-4.42 0-8 3.58-8 8 0 4.14 2.85 7.6 6.75 8.6"/>
            <path d="M15 11c0-1.66-1.34-3-3-3"/>
            <path d="M17 11c0-2.76-2.24-5-5-5"/>
            <path d="M19 11c0-3.87-3.13-7-7-7"/>
          </svg>
        </div>
        <span class="scan-status ease-text-pulse">Scanning Biometric Credentials...</span>
      </div>

      <form class="passcode-form" onsubmit="event.preventDefault()">
        <label for="pin-input" class="form-label">Or enter 6-digit Security PIN</label>
        <div class="pin-grid">
          <input type="password" class="pin-box ease-input-focus" maxlength="1" aria-label="Digit 1" autofocus>
          <input type="password" class="pin-box ease-input-focus" maxlength="1" aria-label="Digit 2">
          <input type="password" class="pin-box ease-input-focus" maxlength="1" aria-label="Digit 3">
          <input type="password" class="pin-box ease-input-focus" maxlength="1" aria-label="Digit 4">
          <input type="password" class="pin-box ease-input-focus" maxlength="1" aria-label="Digit 5">
          <input type="password" class="pin-box ease-input-focus" maxlength="1" aria-label="Digit 6">
        </div>
        <button type="submit" class="auth-btn ease-btn-bounce">Verify Identity</button>
      </form>
    </div>
  </main>
</body>
</html>
