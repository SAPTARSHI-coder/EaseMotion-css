<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CSS-Only Data-Attribute Tooltips</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #fff;
    }

    .container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 3rem;
      background: rgba(255, 255, 255, 0.1);
      padding: 4rem;
      border-radius: 20px;
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .btn {
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: white;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 600;
      transition: background 0.3s;
      outline: none;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    h1 {
      text-align: center;
      margin-bottom: 2rem;
      font-size: 2rem;
      text-shadow: 0 2px 4px rgba(0,0,0,0.2);
    }

    .demo-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
  </style>
</head>
<body>

  <div class="demo-wrapper">
    <h1>CSS-Only Micro-animation Tooltips</h1>
    <div class="container">
      
      <!-- Top Tooltip (Default) -->
      <button class="btn ease-tooltip" data-tooltip="This is a top tooltip!">
        Hover me (Top)
      </button>

      <!-- Bottom Tooltip -->
      <button class="btn ease-tooltip" data-position="bottom" data-tooltip="Action required below">
        Hover me (Bottom)
      </button>

      <!-- Left Tooltip -->
      <button class="btn ease-tooltip" data-position="left" data-tooltip="Information on the left side">
        Hover me (Left)
      </button>

      <!-- Right Tooltip -->
      <button class="btn ease-tooltip" data-position="right" data-tooltip="Proceed to the right">
        Hover me (Right)
      </button>

    </div>
  </div>

</body>
</html>
