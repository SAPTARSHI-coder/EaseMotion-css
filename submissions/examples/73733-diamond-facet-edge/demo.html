<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Pure CSS Diamond Facet Edge glassmorphism component"
  >

  <title>Diamond Facet Edge Glass</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="page">

    <div class="ambient ambient-one"></div>
    <div class="ambient ambient-two"></div>
    <div class="ambient ambient-three"></div>

    <section class="diamond-card">

      <div class="facet facet-top"></div>
      <div class="facet facet-right"></div>
      <div class="facet facet-bottom"></div>
      <div class="facet facet-left"></div>

      <div class="inner-glow"></div>

      <div class="card-content">

        <div class="badge">
          <span class="badge-dot"></span>
          FACET GLASS
        </div>

        <h1>
          Diamond
          <span>Facet Edge</span>
        </h1>

        <p>
          A crystalline glassmorphism interface built with layered
          CSS facets, translucent surfaces and subtle light movement.
        </p>

        <div class="feature-row">

          <div class="feature">
            <strong>01</strong>
            <span>Crystal Edge</span>
          </div>

          <div class="feature">
            <strong>02</strong>
            <span>Glass Depth</span>
          </div>

          <div class="feature">
            <strong>03</strong>
            <span>Soft Glow</span>
          </div>

        </div>

        <button class="glass-button" type="button">
          Explore Facets
          <span aria-hidden="true">→</span>
        </button>

      </div>

    </section>

  </main>

</body>
</html>
