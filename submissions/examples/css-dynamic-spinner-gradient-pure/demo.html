<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Spinner: Gradient</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        
        <header class="header">
            <h1 class="title">Dynamic Gradient Spinner</h1>
            <p>A pure CSS loading indicator using conic gradients and mask compositing for a seamless fluid effect.</p>
        </header>

        <main class="content-area">
            
            <!-- The Gradient Spinner -->
            <div class="gradient-spinner-wrapper" aria-busy="true" aria-label="Loading content">
                <div class="gradient-spinner"></div>
                <!-- Optional inner content / logo space -->
                <div class="spinner-inner">
                    <span class="loading-text">Wait</span>
                </div>
            </div>
            
            <div class="loader-status">Processing Data...</div>
            
        </main>
    </div>

</body>
</html>
