<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Parallax Progress Bar with Neon Styling — Showcase</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="ease-container">
    <p class="ease-eyebrow">Cyberpunk Analytics</p>
    <h1 class="ease-heading">Neon Parallax Progress Bar</h1>
    <p class="ease-subtitle">Pure CSS multi-layered progress bar featuring spatial parallax depth shifts, animated striped glows, and neon status readouts.</p>

    <div class="ease-card" role="region" aria-label="System download progress status">
      <!-- Status Header -->
      <div class="ease-progress-header">
        <div class="ease-status-group">
          <span class="ease-neon-dot" aria-hidden="true"></span>
          <span class="ease-status-text">DOWNLOADING ASSETS</span>
        </div>
        <span class="ease-progress-percent">78%</span>
      </div>

      <!-- Parallax Progress Bar Container -->
      <div 
        class="ease-progress-track" 
        role="progressbar" 
        aria-valuenow="78" 
        aria-valuemin="0" 
        aria-valuemax="100" 
        aria-label="Assets download completion progress"
        tabindex="0"
      >
        <!-- Background Track Glow Layer -->
        <div class="ease-plx-glow" aria-hidden="true"></div>

        <!-- Foreground Filled Progress Bar Layer -->
        <div class="ease-progress-fill" style="--ease-progress-val: 78%;">
          <div class="ease-plx-stripes" aria-hidden="true"></div>
          <div class="ease-plx-head" aria-hidden="true"></div>
        </div>
      </div>

      <!-- Footer Info Readout -->
      <div class="ease-card-footer">
        <span class="ease-footer-spec">Layered Spatial Sheen</span>
        <span class="ease-footer-val">3.4 MB/s — 1.2 GB / 1.5 GB</span>
      </div>
    </div>
  </main>
</body>
</html>
