<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.35">
<title>Scuba Dive Gauge</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="dive-console">
  <header class="dive-head">
    <h1 class="dive-brand">REEF PRO</h1>
    <p class="dive-depth">DEPTH 14m</p>
  </header>
  <section class="dive-panel" aria-label="Scuba gauge console">
    <div class="dive-tank">
      <span class="tank-body"></span>
      <span class="tank-valve"></span>
    </div>
    <div class="gauge-dial">
      <span class="gauge-num num-min">0</span>
      <span class="gauge-num num-max">300</span>
      <span class="gauge-ticks"></span>
      <span class="gauge-needle"></span>
      <span class="gauge-hub"></span>
    </div>
    <div class="depth-window"><span class="depth-read">14</span></div>
    <span class="reg-hose"></span>
    <span class="bubble bubble-1"></span>
    <span class="bubble bubble-2"></span>
    <span class="bubble bubble-3"></span>
  </section>
  <footer class="dive-foot">
    <span class="dive-psi">3000 PSI</span>
    <span class="dive-air">AIR</span>
  </footer>
</main>
</body>
</html>
