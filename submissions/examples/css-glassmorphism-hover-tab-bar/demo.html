<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hover Tab Bar with Glassmorphism Styling | EaseMotion CSS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="glass-tab-container" aria-label="Glassmorphism Navigation Tabs">
        <ul class="glass-tab-list" role="tablist">
            <li class="glass-tab-item" role="presentation">
                <a href="#overview" class="glass-tab-link active" role="tab" aria-selected="true">Overview</a>
            </li>
            <li class="glass-tab-item" role="presentation">
                <a href="#analytics" class="glass-tab-link" role="tab" aria-selected="false">Analytics</a>
            </li>
            <li class="glass-tab-item" role="presentation">
                <a href="#integrations" class="glass-tab-link" role="tab" aria-selected="false">Integrations</a>
            </li>
            <li class="glass-tab-item" role="presentation">
                <a href="#settings" class="glass-tab-link" role="tab" aria-selected="false">Settings</a>
            </li>
        </ul>
    </nav>
</body>
</html>
