<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="CSS animated password show and hide component"
    >

    <title>CSS Animated Password Show</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="page">

        <section class="password-card">

            <!-- Header -->

            <div class="eyebrow">
                ✦ EASEMOTION CSS ✦
            </div>

            <h1>
                Animated Password
                <span>Show</span>
            </h1>

            <p class="intro">
                A smooth password visibility toggle created entirely
                with HTML and CSS.
            </p>


            <!-- Login Form -->

            <form class="login-demo">


                <!-- Username -->

                <div class="field-group">

                    <label for="username">
                        Username or Email
                    </label>

                    <div class="input-wrapper">

                        <span class="field-icon" aria-hidden="true">
                            ✉
                        </span>

                        <input
                            type="text"
                            id="username"
                            name="username"
                            placeholder="you@example.com"
                            autocomplete="username"
                            required
                        >

                    </div>

                </div>


                <!-- Password -->

                <div class="field-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="input-wrapper password-wrapper">


                        <!-- CSS-only toggle -->

                        <input
                            type="checkbox"
                            id="password-toggle"
                            class="password-toggle"
                            aria-label="Toggle password visibility"
                        >


                        <!-- Password input -->

                        <input
                            type="password"
                            id="password"
                            name="password"
                            value="SecurePass123"
                            class="password-input"
                            autocomplete="current-password"
                            readonly
                            required
                        >


                        <!-- Visible password text -->

                        <span
                            class="password-text"
                            aria-hidden="true"
                        >
                            SecurePass123
                        </span>


                        <!-- Eye button -->

                        <label
                            for="password-toggle"
                            class="eye-button"
                            aria-label="Show or hide password"
                        >

                            <!-- Closed eye -->

                            <span
                                class="eye eye-closed"
                                aria-hidden="true"
                            >

                                <span class="closed-lash lash-1"></span>
                                <span class="closed-lash lash-2"></span>
                                <span class="closed-lash lash-3"></span>
                                <span class="closed-lash lash-4"></span>

                                <span class="closed-eye-line"></span>

                            </span>


                            <!-- Open eye -->

                            <span
                                class="eye eye-open"
                                aria-hidden="true"
                            >

                                <span class="eye-outline"></span>

                                <span class="eye-pupil"></span>

                                <span class="open-lash open-lash-1"></span>
                                <span class="open-lash open-lash-2"></span>
                                <span class="open-lash open-lash-3"></span>
                                <span class="open-lash open-lash-4"></span>

                            </span>

                        </label>

                    </div>


                    <p class="password-hint">
                        Click the eye icon to show or hide the password.
                    </p>

                </div>


                <!-- Login Button -->

                <button
                    type="submit"
                    class="login-button"
                >
                    Login
                </button>

            </form>


            <!-- Status -->

            <div class="status-message">

                <span
                    class="status-dot"
                    aria-hidden="true"
                ></span>

                CSS-only password interaction

            </div>

        </section>

    </main>

</body>
</html>
