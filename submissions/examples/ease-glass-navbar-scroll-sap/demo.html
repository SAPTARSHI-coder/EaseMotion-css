<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ease-glass-navbar-scroll-sap demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: linear-gradient(180deg, #667eea, #764ba2 40%, #f4f4f5 40%); }
    .content { max-width: 640px; margin: 0 auto; padding: 40px 24px 300px; line-height: 1.7; color: #333; }
  </style>
</head>
<body>
  <header class="glass-navbar-sap" id="navbar">
    <div class="logo">Brand</div>
    <nav><a href="#">Home</a><a href="#">Docs</a><a href="#">Pricing</a></nav>
  </header>
  <div class="content">
    <h1>Scroll to see the glass effect</h1>
    <p>The navbar gains a frosted-glass background and blur as you scroll past the top.</p>
    <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt.</p>
  </div>
  <script>
    const navbar = document.getElementById('navbar');
    window.addEventListener('scroll', () => {
      navbar.classList.toggle('scrolled', window.scrollY > 40);
    }, { passive: true });
  </script>
</body>
</html>
