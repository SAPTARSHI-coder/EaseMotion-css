<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CSS animated breathing ring loader.">
  <title>CSS Breath Ring Loader</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="breath-loader" aria-label="Breathing loader">

    <div class="ring" aria-hidden="true">
      <div class="ring-inner">
        <span>Inhale</span>
      </div>
    </div>

    <h1>Take a breath</h1>

    <p>
      Follow the expanding and contracting ring while content
      loads.
    </p>

    <div class="loader-dots" aria-hidden="true">
      <span></span>
      <span></span>
      <span></span>
    </div>

  </main>

</body>
</html>
