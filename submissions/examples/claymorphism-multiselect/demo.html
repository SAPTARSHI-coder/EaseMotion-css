<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claymorphism Multi-Select Dropdown - EaseMotion</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="container">
    <div class="clay-card">
      <h2 class="form-title">Filter Technologies</h2>
      <p class="form-subtitle">Select multiple options from the claymorphic menu</p>

      <!-- Multi-Select Component Container -->
      <div class="multiselect-container">
        
        <!-- Native Hidden Checkbox for Open/Close State -->
        <input 
          type="checkbox" 
          id="multiselect-toggle" 
          class="multiselect-toggle" 
          aria-label="Toggle technology selection dropdown"
        />

        <!-- Clickable Trigger Bar -->
        <label for="multiselect-toggle" class="clay-trigger" role="button" tabindex="0">
          <span class="trigger-placeholder">Choose Tech Stack...</span>
          <div class="trigger-badges">
            <span class="clay-badge badge-react">React</span>
            <span class="clay-badge badge-css">CSS3</span>
            <span class="clay-badge badge-node">Node.js</span>
          </div>
          <svg class="chevron-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 9l6 6 6-6"/>
          </svg>
        </label>

        <!-- Dropdown Menu -->
        <div class="clay-dropdown-menu" role="group" aria-label="Technology options">
          <div class="dropdown-scroll-area">

            <!-- Option Item 1 -->
            <div class="option-item">
              <input type="checkbox" id="opt-react" class="option-checkbox" checked />
              <label for="opt-react" class="clay-option">
                <span class="clay-checkbox-box">
                  <svg class="check-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12"></polyline>
                  </svg>
                </span>
                <span class="option-label">React</span>
              </label>
            </div>

            <!-- Option Item 2 -->
            <div class="option-item">
              <input type="checkbox" id="opt-css" class="option-checkbox" checked />
              <label for="opt-css" class="clay-option">
                <span class="clay-checkbox-box">
                  <svg class="check-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12"></polyline>
                  </svg>
                </span>
                <span class="option-label">CSS3 / EaseMotion</span>
              </label>
            </div>

            <!-- Option Item 3 -->
            <div class="option-item">
              <input type="checkbox" id="opt-node" class="option-checkbox" checked />
              <label for="opt-node" class="clay-option">
                <span class="clay-checkbox-box">
                  <svg class="check-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12"></polyline>
                  </svg>
                </span>
                <span class="option-label">Node.js</span>
              </label>
            </div>

            <!-- Option Item 4 -->
            <div class="option-item">
              <input type="checkbox" id="opt-ts" class="option-checkbox" />
              <label for="opt-ts" class="clay-option">
                <span class="clay-checkbox-box">
                  <svg class="check-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12"></polyline>
                  </svg>
                </span>
                <span class="option-label">TypeScript</span>
              </label>
            </div>

            <!-- Option Item 5 -->
            <div class="option-item">
              <input type="checkbox" id="opt-graphql" class="option-checkbox" />
              <label for="opt-graphql" class="clay-option">
                <span class="clay-checkbox-box">
                  <svg class="check-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12"></polyline>
                  </svg>
                </span>
                <span class="option-label">GraphQL</span>
              </label>
            </div>

          </div>
        </div>

      </div>
    </div>
  </main>

  <script>
    // Progressive enhancement: Allow Space/Enter keys to toggle dropdown via keyboard focus
    document.querySelector('.clay-trigger').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        document.getElementById('multiselect-toggle').click();
      }
    });
  </script>
</body>
</html>
