<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Glowing Line Graph</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="chart-card">
      <header>
        <div>
          <p class="eyebrow">Revenue trend</p>
          <h1>$128,460</h1>
        </div>
        <span class="change">&#8593; 18.6%</span>
      </header>

      <figure class="chart">
        <svg
          viewBox="0 0 720 320"
          role="img"
          aria-labelledby="chart-title chart-description"
        >
          <title id="chart-title">Revenue over the last seven months</title>
          <desc id="chart-description">
            Revenue increased from 42 thousand to 128 thousand dollars.
          </desc>
          <defs>
            <linearGradient id="area-fill" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#55e6bd" stop-opacity="0.35" />
              <stop offset="1" stop-color="#55e6bd" stop-opacity="0" />
            </linearGradient>
          </defs>
          <g class="grid" aria-hidden="true">
            <path d="M42 52H690 M42 118H690 M42 184H690 M42 250H690" />
            <path
              d="M42 32V272 M150 32V272 M258 32V272 M366 32V272 M474 32V272 M582 32V272 M690 32V272"
            />
          </g>
          <path
            class="area"
            d="M42 238 C90 222 112 230 150 202 S226 176 258 190 S332 148 366 158 S436 104 474 126 S548 74 582 88 S650 48 690 56 L690 272 L42 272 Z"
          />
          <path
            class="line line--glow"
            d="M42 238 C90 222 112 230 150 202 S226 176 258 190 S332 148 366 158 S436 104 474 126 S548 74 582 88 S650 48 690 56"
          />
          <path
            class="line"
            d="M42 238 C90 222 112 230 150 202 S226 176 258 190 S332 148 366 158 S436 104 474 126 S548 74 582 88 S650 48 690 56"
          />
          <g class="endpoint" aria-hidden="true">
            <circle class="pulse" cx="690" cy="56" r="12" />
            <circle cx="690" cy="56" r="6" />
          </g>
        </svg>
        <figcaption>
          <span>Feb</span><span>Mar</span><span>Apr</span><span>May</span
          ><span>Jun</span><span>Jul</span><span>Aug</span>
        </figcaption>
      </figure>

      <footer><span>Monthly target</span><strong>94% achieved</strong></footer>
    </main>
  </body>
</html>
