<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS NFT Preview Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="layout-container">
        
        <header class="section-header">
            <h1 class="title">NFT Preview Card</h1>
            <p class="subtitle">A pure CSS NFT card featuring a glassmorphism hover effect, creator avatar overlay, and semantic layout for bids and countdowns.</p>
        </header>

        <div class="demo-area">
            
            <!-- 
              [TECHNIQUE] NFT Card
              The card uses a classic image-top, content-bottom layout.
              We use a CSS focus-within and hover pseudo-class to reveal a 
              "Place Bid" glassmorphism overlay over the image.
            -->
            <div class="nft-card" tabindex="0">
                
                <!-- Image Container with Hover Overlay -->
                <div class="nft-image-wrapper">
                    <!-- Placeholder SVG for NFT Art -->
                    <svg class="nft-image" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
                            </linearGradient>
                        </defs>
                        <rect width="400" height="400" fill="url(#grad1)"/>
                        <circle cx="200" cy="200" r="100" fill="rgba(255,255,255,0.2)"/>
                        <circle cx="150" cy="150" r="40" fill="rgba(255,255,255,0.4)"/>
                    </svg>
                    
                    <!-- Glassmorphism Overlay (Hidden by default) -->
                    <div class="nft-overlay">
                        <button class="btn-bid" aria-label="Place a bid on Equilibrium #3429">
                            <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
                            Place Bid
                        </button>
                    </div>
                </div>
                
                <!-- Main Content -->
                <div class="nft-content">
                    
                    <h2 class="nft-title"><a href="#">Equilibrium #3429</a></h2>
                    <p class="nft-description">Our Equilibrium collection promotes balance and calm.</p>
                    
                    <div class="nft-metrics">
                        <div class="metric-eth">
                            <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><path d="M12 2L3 11l9 4 9-4-9-9z"></path><path d="M12 22l-9-7 9-4 9 4-9 7z"></path></svg>
                            <span>0.041 ETH</span>
                        </div>
                        <div class="metric-time">
                            <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                            <span>3 days left</span>
                        </div>
                    </div>
                    
                    <hr class="nft-divider">
                    
                    <!-- Creator Info -->
                    <div class="nft-creator">
                        <img class="creator-avatar" src="https://i.pravatar.cc/150?img=33" alt="Creator Jules Wyvern" width="32" height="32">
                        <p class="creator-name">Creation of <a href="#">Jules Wyvern</a></p>
                    </div>
                    
                </div>
                
            </div>
            
        </div>
        
    </div>

</body>
</html>
