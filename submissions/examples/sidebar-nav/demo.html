<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sidebar Nav</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="demo-shell">
      <section class="demo-card" aria-labelledby="sn-title">
        <p class="eyebrow">Navigation</p>
        <h1 id="sn-title">Sidebar nav</h1>
        <p class="demo-copy">
          A vertical sidebar with sectioned links and a sliding active
          indicator.
        </p>
      </section>
      <aside class="sidebar-nav" aria-label="Primary">
        <div class="sidebar-nav__brand">
          <span class="sidebar-nav__logo" aria-hidden="true">EM</span>
          <span class="sidebar-nav__brand-name">EaseMotion</span>
        </div>
        <nav class="sidebar-nav__list">
          <p class="sidebar-nav__heading">Workspace</p>
          <a class="sidebar-nav__link is-active" href="#" aria-current="page">
            <span class="sidebar-nav__icon" aria-hidden="true">&#9632;</span>
            <span class="sidebar-nav__label">Dashboard</span>
          </a>
          <a class="sidebar-nav__link" href="#">
            <span class="sidebar-nav__icon" aria-hidden="true">&#9634;</span>
            <span class="sidebar-nav__label">Projects</span>
          </a>
          <a class="sidebar-nav__link" href="#">
            <span class="sidebar-nav__icon" aria-hidden="true">&#9675;</span>
            <span class="sidebar-nav__label">Tasks</span>
          </a>
          <p class="sidebar-nav__heading">Account</p>
          <a class="sidebar-nav__link" href="#">
            <span class="sidebar-nav__icon" aria-hidden="true">&#9733;</span>
            <span class="sidebar-nav__label">Settings</span>
          </a>
          <a class="sidebar-nav__link" href="#">
            <span class="sidebar-nav__icon" aria-hidden="true">&#9656;</span>
            <span class="sidebar-nav__label">Sign out</span>
          </a>
        </nav>
      </aside>
    </main>
  </body>
</html>
