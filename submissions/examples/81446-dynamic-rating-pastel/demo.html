<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Dynamic pastel rating component built with pure CSS."
  >

  <title>Dynamic Rating — Pastel</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="page">

    <section
      class="rating-section"
      aria-labelledby="rating-title"
    >

      <div class="rating-heading">
        <span class="rating-heading__eyebrow">
          COMMUNITY FEEDBACK
        </span>

        <h1 id="rating-title">
          Rate your experience
        </h1>

        <p>
          Share your experience using the interactive rating
          control below.
        </p>
      </div>

      <div class="rating-card">

        <div class="rating-summary">

          <div class="rating-score">
            <strong>4.8</strong>
            <span>out of 5</span>
          </div>

          <div class="rating-stars rating-stars--summary">
            <span aria-hidden="true">★</span>
            <span aria-hidden="true">★</span>
            <span aria-hidden="true">★</span>
            <span aria-hidden="true">★</span>
            <span aria-hidden="true">★</span>
          </div>

          <p>
            Based on 248 reviews
          </p>

        </div>

        <div
          class="rating-widget"
          aria-label="Rate this experience"
        >

          <fieldset class="rating-input">

            <legend>
              Choose a rating from 1 to 5 stars
            </legend>

            <div class="rating-input__stars">

              <input
                id="rating-5"
                name="rating"
                type="radio"
                value="5"
              >
              <label
                for="rating-5"
                title="5 stars"
              >
                <span aria-hidden="true">★</span>
                <span class="sr-only">5 stars</span>
              </label>

              <input
                id="rating-4"
                name="rating"
                type="radio"
                value="4"
              >
              <label
                for="rating-4"
                title="4 stars"
              >
                <span aria-hidden="true">★</span>
                <span class="sr-only">4 stars</span>
              </label>

              <input
                id="rating-3"
                name="rating"
                type="radio"
                value="3"
              >
              <label
                for="rating-3"
                title="3 stars"
              >
                <span aria-hidden="true">★</span>
                <span class="sr-only">3 stars</span>
              </label>

              <input
                id="rating-2"
                name="rating"
                type="radio"
                value="2"
              >
              <label
                for="rating-2"
                title="2 stars"
              >
                <span aria-hidden="true">★</span>
                <span class="sr-only">2 stars</span>
              </label>

              <input
                id="rating-1"
                name="rating"
                type="radio"
                value="1"
              >
              <label
                for="rating-1"
                title="1 star"
              >
                <span aria-hidden="true">★</span>
                <span class="sr-only">1 star</span>
              </label>

            </div>

          </fieldset>

          <div class="rating-message" aria-live="polite">
            <span class="rating-message__dot"></span>
            Select a star rating
          </div>

        </div>

      </div>

    </section>

  </main>

</body>
</html>
