<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Flip Clock · Flips Like Old Clock Digits</title>

    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <div class="card">
        <h2>🕐 3D Flip Clock</h2>
        <p class="sub">flips like old clock digits</p>

        <!-- === 3D FLIP CLOCK === -->
        <div class="clock-container">
            <div class="clock-wrapper">
                <!-- Hours -->
                <div class="flip-unit">
                    <div class="flip-card" data-digit="0">
                        <div class="flip-card-top">
                            <span class="digit-top">0</span>
                        </div>
                        <div class="flip-card-bottom">
                            <span class="digit-bottom">0</span>
                        </div>
                    </div>
                    <div class="flip-card" data-digit="0">
                        <div class="flip-card-top">
                            <span class="digit-top">0</span>
                        </div>
                        <div class="flip-card-bottom">
                            <span class="digit-bottom">0</span>
                        </div>
                    </div>
                </div>

                <span class="clock-separator">:</span>

                <!-- Minutes -->
                <div class="flip-unit">
                    <div class="flip-card" data-digit="0">
                        <div class="flip-card-top">
                            <span class="digit-top">0</span>
                        </div>
                        <div class="flip-card-bottom">
                            <span class="digit-bottom">0</span>
                        </div>
                    </div>
                    <div class="flip-card" data-digit="0">
                        <div class="flip-card-top">
                            <span class="digit-top">0</span>
                        </div>
                        <div class="flip-card-bottom">
                            <span class="digit-bottom">0</span>
                        </div>
                    </div>
                </div>

                <span class="clock-separator">:</span>

                <!-- Seconds -->
                <div class="flip-unit">
                    <div class="flip-card" data-digit="0">
                        <div class="flip-card-top">
                            <span class="digit-top">0</span>
                        </div>
                        <div class="flip-card-bottom">
                            <span class="digit-bottom">0</span>
                        </div>
                    </div>
                    <div class="flip-card" data-digit="0">
                        <div class="flip-card-top">
                            <span class="digit-top">0</span>
                        </div>
                        <div class="flip-card-bottom">
                            <span class="digit-bottom">0</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <p style="margin-top: 2rem; font-size: 0.85rem; color: #64748b;">
            Real-time clock · digits flip like vintage clock
        </p>
    </div>

    <!-- Embedded JavaScript -->
    <script>
        (function() {
            'use strict';

            const flipCards = document.querySelectorAll('.flip-card');

            // --- Get current time ---
            function getTimeDigits() {
                const now = new Date();
                const hours = String(now.getHours()).padStart(2, '0');
                const minutes = String(now.getMinutes()).padStart(2, '0');
                const seconds = String(now.getSeconds()).padStart(2, '0');

                return [...hours, ...minutes, ...seconds];
            }

            // --- Update a flip card ---
            function updateFlipCard(card, newDigit) {
                const currentDigit = card.getAttribute('data-digit');

                if (currentDigit === newDigit) return;

                const top = card.querySelector('.digit-top');
                const bottom = card.querySelector('.digit-bottom');

                // Set the new digit on top (will be flipped down)
                top.textContent = newDigit;
                bottom.textContent = newDigit;

                // Reset animation
                card.classList.remove('flipping');
                void card.offsetWidth;

                // Trigger flip
                card.classList.add('flipping');

                // Update data attribute
                card.setAttribute('data-digit', newDigit);
            }

            // --- Update clock ---
            function updateClock() {
                const digits = getTimeDigits();

                flipCards.forEach((card, index) => {
                    const newDigit = digits[index];
                    updateFlipCard(card, newDigit);
                });
            }

            // --- Initial setup ---
            function initClock() {
                const digits = getTimeDigits();
                flipCards.forEach((card, index) => {
                    const digit = digits[index];
                    card.setAttribute('data-digit', digit);
                    const top = card.querySelector('.digit-top');
                    const bottom = card.querySelector('.digit-bottom');
                    top.textContent = digit;
                    bottom.textContent = digit;
                });
            }

            // --- Start clock ---
            initClock();

            // Update every second
            setInterval(updateClock, 1000);

            // Also update on visibility change (tab switch)
            document.addEventListener('visibilitychange', function() {
                if (!document.hidden) {
                    updateClock();
                }
            });

            // --- Click to flip (demo) ---
            document.querySelector('.clock-wrapper').addEventListener('click', function(e) {
                if (e.target.closest('.flip-card')) {
                    const card = e.target.closest('.flip-card');
                    const current = parseInt(card.getAttribute('data-digit'));
                    const next = (current + 1) % 10;
                    updateFlipCard(card, String(next));
                    console.log(`🕐 Flip: ${current} → ${next}`);
                }
            });

            console.log('🕐 3D Flip clock initialized!');

        })();
    </script>

</body>
</html>
