<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parallax Spinner with Retro Styling | EaseMotion CSS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="spinner-card" role="region" aria-label="Loading indicator container">
        <div class="spinner-viewport" aria-hidden="true">
            <div class="spinner-ring-outer"></div>
            <div class="spinner-ring-mid"></div>
            <div class="spinner-core"></div>
        </div>
        <p class="spinner-label">Initializing Module...</p>
    </div>
</body>
</html>
