<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animated Color Picker Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="color-picker-wrapper">
    <div class="picker-container">
      
      <!-- Color Preview Showcase -->
      <div class="color-preview-showcase" id="color-preview"></div>

      <!-- Color Value Info Badge -->
      <div class="color-value-badge" id="color-value">#6366f1</div>

      <!-- Color Picker Component matching Issue Snippet -->
      <label class="color-picker">
        <span>Choose color</span>
        <div class="color-picker-input-wrapper">
          <input type="color" id="picker-input" value="#6366f1">
        </div>
      </label>

    </div>
  </div>

  <script>
    const picker = document.getElementById('picker-input');
    const preview = document.getElementById('color-preview');
    const valueBadge = document.getElementById('color-value');

    function updateColor(value) {
      preview.style.backgroundColor = value;
      valueBadge.textContent = value.toUpperCase();
      
      // Update shadows dynamically to match selected color glow
      preview.style.boxShadow = `0 10px 25px rgba(0, 0, 0, 0.3), 0 0 15px ${value}50`;
    }

    // Initialize
    updateColor(picker.value);

    // Bind change/input events
    picker.addEventListener('input', (e) => {
      updateColor(e.target.value);
    });

    picker.addEventListener('change', (e) => {
      updateColor(e.target.value);
    });
  </script>
</body>
</html>
