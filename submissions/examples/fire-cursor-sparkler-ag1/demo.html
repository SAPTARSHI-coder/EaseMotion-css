<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fire Cursor Spark Trail</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="fire-cursor-stage">
    <div class="status-pill">Fire Cursor preview - move your mouse and see sparks</div>
    <h1>Fire Cursor - Spark Trail</h1>
    <p>Move the pointer across the card area and observe sparks trailing behind the cursor.</p>
    <p class="hint">In motion-reduced mode this animation pauses and the trail is disabled for sensitivity.</p>
    <section class="spark-area" aria-label="Interactive demo area"></section>
  </main>

  <div id="spark-layer" aria-hidden="true"></div>

  <script>
    (function () {
      const layer = document.getElementById('spark-layer');
      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      let active = false;

      const palettes = [
        ['#ff4b2e', '#ff8c42'],
        ['#ff9500', '#ffd166'],
        ['#ff2f2f', '#ff7b6d'],
        ['#ffae00', '#ffda6b']
      ];

      function makeSpark(x, y, sizeBoost = 1, burst = false) {
        if (reduceMotion.matches) {
          return;
        }

        const spark = document.createElement('span');
        const [from, to] = palettes[Math.floor(Math.random() * palettes.length)];
        const size = (2.5 + Math.random() * 5) * sizeBoost;
        const angle = Math.random() * Math.PI * 2;
        const speed = 40 + Math.random() * 100;
        const travelX = Math.cos(angle) * speed;
        const travelY = Math.sin(angle) * speed;

        spark.className = 'spark';
        spark.style.left = `${x}px`;
        spark.style.top = `${y}px`;
        spark.style.width = `${size}px`;
        spark.style.height = `${size}px`;
        spark.style.setProperty('--dx', `${travelX * (burst ? 1.4 : 1)}px`);
        spark.style.setProperty('--dy', `${travelY * (burst ? 1.3 : 1)}px`);
        spark.style.setProperty('--start-color', from);
        spark.style.setProperty('--end-color', to);

        layer.appendChild(spark);
        active = true;

        spark.addEventListener('animationend', () => {
          spark.remove();
          active = !!layer.childElementCount;
        });

        window.setTimeout(() => {
          if (layer.contains(spark)) {
            spark.remove();
            active = !!layer.childElementCount;
          }
        }, 1200);
      }

      document.addEventListener('mousemove', (event) => {
        const count = 2;
        for (let i = 0; i < count; i += 1) {
          makeSpark(event.clientX, event.clientY, 0.7, false);
        }
      });

      document.addEventListener('click', (event) => {
        for (let i = 0; i < 22; i += 1) {
          makeSpark(event.clientX, event.clientY, 1.15, true);
        }
      });

      reduceMotion.addEventListener('change', () => {
        if (reduceMotion.matches) {
          layer.innerHTML = '';
          active = false;
        }
      });
    })();
  </script>
</body>
</html>
