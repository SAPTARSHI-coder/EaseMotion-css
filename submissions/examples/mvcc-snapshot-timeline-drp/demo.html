<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MVCC Snapshot Timeline</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="motion-shell mvcc_snapshot_timeline_drp" aria-labelledby="motion-title">
    <section class="motion-panel">
      <p class="eyebrow">consistent reads</p>
      <h1 id="motion-title">MVCC Snapshot Timeline</h1>
      <p class="summary">A layered CSS animation that shows snapshot readers, committed versions, and garbage collection windows moving across an MVCC timeline.</p>
      <div class="stage" role="img" aria-label="Animated MVCC Snapshot Timeline visualization">
        <div class="orbit orbit-one"></div>
        <div class="orbit orbit-two"></div>
        <article class="node node-a"><strong>A</strong><span>snapshot pinned</span></article>
        <article class="node node-b"><strong>B</strong><span>versions visible</span></article>
        <article class="node node-c"><strong>C</strong><span>vacuum deferred</span></article>
        <div class="beam beam-ab"><i></i></div>
        <div class="beam beam-bc"><i></i></div>
        <div class="beam beam-ca"><i></i></div>
        <div class="decision">vacuum deferred</div>
      </div>
      <div class="status-grid" aria-label="MVCC Snapshot Timeline status">
        <span>snapshot pinned</span>
        <span>versions visible</span>
        <span>vacuum deferred</span>
      </div>
    </section>
  </main>
</body>
</html>
