<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loading Bar Shell &mdash; EaseMotion CSS Demo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="page-head">
    <p class="kicker">EaseMotion CSS &middot; Dev Tools</p>
    <h1>Loading Bar Shell</h1>
    <p class="sub">Your build is chugging along &mdash; the stripes say so.</p>
  </header>
  <main class="stage">
    <div class="lb-track">
      <span class="lb-percent"></span>
      <div class="lb-fill"></div>
    </div>
  </main>
  <p class="stage-caption">Running stripes keep the bar alive while it fills.</p>
  <footer class="page-foot">
    <span>Pure CSS &middot; zero dependencies</span>
    <span>Striped progress</span>
  </footer>
</body>
</html>
