<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 3D Effect: Floating Elevation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="layout-container">
        
        <header class="section-header">
            <h1 class="title">Pure CSS 3D: Floating Elevation</h1>
            <p class="subtitle">A hardware-accelerated, JavaScript-free 3D animation utilizing `transform-style: preserve-3d`. Features synchronized shadow animations that realistically respond to the object's Z-axis elevation.</p>
        </header>

        <div class="demo-area">
            
            <!-- 
              [TECHNIQUE] The 3D Scene
              The wrapper establishes the isometric perspective.
            -->
            <div class="scene-3d">
                
                <!-- 
                  The primary rotating container. 
                -->
                <div class="object-3d">
                    
                    <!-- 
                      Layer 1: The Drop Shadow
                      As the card translates UP on the Z-axis, the shadow must 
                      translate DOWN (or stay at Z=0) while simultaneously 
                      increasing its blur and decreasing its opacity.
                    -->
                    <div class="elevation-shadow" aria-hidden="true"></div>
                    
                    <!-- 
                      Layer 2: The Floating Card
                      Moves along the Z-axis.
                    -->
                    <div class="elevation-card">
                        <div class="card-content">
                            <div class="icon-float">
                                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                                    <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
                                    <polyline points="2 17 12 22 22 17"></polyline>
                                    <polyline points="2 12 12 17 22 12"></polyline>
                                </svg>
                            </div>
                            <h3>Levitation</h3>
                            <p>Z-Axis Displacement</p>
                        </div>
                    </div>
                    
                </div>
                
            </div>
            
        </div>
        
    </div>

</body>
</html>
