<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Layered Glow Card</title>

    <link rel="stylesheet" href="style.css">
</head>


<body>

    <main class="container">

        <article class="glow-card" tabindex="0" aria-label="Layered glow card">

            <div class="layer layer-one"></div>
            <div class="layer layer-two"></div>
            <div class="layer layer-three"></div>


            <div class="content">

                <h1>
                    Layered Glow Card
                </h1>

                <p>
                    Multiple glowing layers separate smoothly on hover.
                </p>

                <button>
                    Explore
                </button>

            </div>


        </article>


    </main>


</body>

</html>
