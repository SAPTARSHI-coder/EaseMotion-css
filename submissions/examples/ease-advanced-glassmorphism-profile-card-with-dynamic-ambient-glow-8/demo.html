<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Glassmorphism Profile Card</title>

<link rel="stylesheet" href="style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

<div class="bg-orb orb-left"></div>
<div class="bg-orb orb-right"></div>

<main class="glass-wrapper">

<section class="profile-card">

<div class="shine"></div>

<img
class="avatar"
src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=500"
alt="Profile">

<div class="profile-content">

<h2>
Sophia Morgan
</h2>

<span class="role">
Creative Product Designer
</span>

<p>
Designing beautiful digital experiences with accessibility,
motion design and modern interfaces.
</p>

<div class="profile-stats">

<div>
<strong>248</strong>
<span>Projects</span>
</div>

<div>
<strong>18K</strong>
<span>Followers</span>
</div>

<div>
<strong>4.9</strong>
<span>Rating</span>
</div>

</div>

<div class="actions">

<button class="follow-btn">
Follow
</button>

<button class="contact-btn">
Message
</button>

</div>

</div>

</section>

</main>

</body>
</html>
