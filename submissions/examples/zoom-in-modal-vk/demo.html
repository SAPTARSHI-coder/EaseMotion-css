<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zoom-In Modal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<section class="hero">
    <h1>Zoom-In Modal</h1>
    <p>
        A lightweight, responsive modal built with pure HTML and CSS that
        opens using a smooth zoom-in animation.
    </p>

    <a href="#modal" class="open-btn">Open Modal</a>
</section>

<div id="modal" class="modal-overlay">

    <div class="modal">

        <h2>Welcome!</h2>

        <p>
            This modal demonstrates a smooth zoom-in animation using only
            HTML and CSS with no JavaScript required.
        </p>

        <div class="modal-actions">
            <a href="#" class="btn secondary">Cancel</a>
            <a href="#" class="btn primary">Continue</a>
        </div>

    </div>

</div>

</body>
</html>
