<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Galaxy Loader · Spiral Galaxy Rotation</title>

    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <div class="card">
        <h2>🌌 Galaxy Loader</h2>
        <p class="sub">spiral galaxy rotates slowly</p>

        <!-- === GALAXY LOADER === -->
        <div class="galaxy-container" id="galaxyContainer">
            <div class="galaxy-loader">
                <!-- Galaxy center -->
                <div class="galaxy-core"></div>

                <!-- Spiral arms -->
                <div class="arm arm-1">
                    <div class="star s1"></div>
                    <div class="star s2"></div>
                    <div class="star s3"></div>
                    <div class="star s4"></div>
                    <div class="star s5"></div>
                    <div class="star s6"></div>
                    <div class="star s7"></div>
                    <div class="star s8"></div>
                    <div class="star s9"></div>
                    <div class="star s10"></div>
                    <div class="star s11"></div>
                    <div class="star s12"></div>
                </div>

                <div class="arm arm-2">
                    <div class="star s1"></div>
                    <div class="star s2"></div>
                    <div class="star s3"></div>
                    <div class="star s4"></div>
                    <div class="star s5"></div>
                    <div class="star s6"></div>
                    <div class="star s7"></div>
                    <div class="star s8"></div>
                    <div class="star s9"></div>
                    <div class="star s10"></div>
                    <div class="star s11"></div>
                    <div class="star s12"></div>
                </div>

                <div class="arm arm-3">
                    <div class="star s1"></div>
                    <div class="star s2"></div>
                    <div class="star s3"></div>
                    <div class="star s4"></div>
                    <div class="star s5"></div>
                    <div class="star s6"></div>
                    <div class="star s7"></div>
                    <div class="star s8"></div>
                    <div class="star s9"></div>
                    <div class="star s10"></div>
                    <div class="star s11"></div>
                    <div class="star s12"></div>
                </div>

                <!-- Galaxy glow -->
                <div class="galaxy-glow"></div>
            </div>
        </div>

        <p style="margin-top: 2rem; font-size: 0.85rem; color: #64748b;">
            Spiral galaxy rotating · cosmic loading animation
        </p>
    </div>

    <!-- Embedded JavaScript -->
    <script>
        (function() {
            'use strict';

            const container = document.getElementById('galaxyContainer');

            // Click to restart animation
            container.addEventListener('click', function() {
                const loader = this.querySelector('.galaxy-loader');
                const arms = this.querySelectorAll('.arm');
                const core = this.querySelector('.galaxy-core');
                const glow = this.querySelector('.galaxy-glow');

                loader.style.animation = 'none';
                void loader.offsetWidth;
                loader.style.animation = '';

                arms.forEach(arm => {
                    arm.style.animation = 'none';
                    void arm.offsetWidth;
                    arm.style.animation = '';
                });

                core.style.animation = 'none';
                void core.offsetWidth;
                core.style.animation = '';

                glow.style.animation = 'none';
                void glow.offsetWidth;
                glow.style.animation = '';

                this.classList.add('click-pulse');
                setTimeout(() => {
                    this.classList.remove('click-pulse');
                }, 300);

                console.log('🌌 Galaxy loader restarted!');
            });

            // Keyboard accessibility
            container.setAttribute('tabindex', '0');
            container.setAttribute('role', 'button');
            container.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    this.click();
                }
            });

            console.log('🌌 Galaxy loader initialized!');

        })();
    </script>

</body>
</html>
