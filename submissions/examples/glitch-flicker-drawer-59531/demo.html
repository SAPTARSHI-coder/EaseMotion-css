<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Glitch-Flicker Drawer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="showcase-container">
    <header class="showcase-header">
      <h1>Glitch-Flicker Drawer</h1>
      <p>A pure CSS cyberpunk-inspired drawer for modern SaaS applications.</p>
    </header>

    <main class="showcase-main">
      <input type="checkbox" id="drawer-toggle" class="drawer-toggle" aria-label="Toggle Drawer">
      
      <label for="drawer-toggle" class="drawer-trigger" aria-controls="drawer" aria-expanded="false">
        <span class="glitch-text" data-text="Open System">Open System</span>
      </label>

      <aside class="glitch-drawer" id="drawer" role="dialog" aria-labelledby="drawer-title" aria-modal="true">
        <div class="drawer-header">
          <h2 id="drawer-title" class="glitch-text" data-text="System Controls">System Controls</h2>
          <label for="drawer-toggle" class="drawer-close" aria-label="Close Drawer">&times;</label>
        </div>
        <div class="drawer-content">
          <ul class="glitch-menu">
            <li><a href="#" class="glitch-link" data-text="Dashboard">Dashboard</a></li>
            <li><a href="#" class="glitch-link" data-text="Analytics">Analytics</a></li>
            <li><a href="#" class="glitch-link" data-text="Settings">Settings</a></li>
            <li><a href="#" class="glitch-link" data-text="Security">Security</a></li>
          </ul>
        </div>
      </aside>

      <!-- Overlay for the background -->
      <div class="drawer-overlay"></div>
    </main>
  </div>
</body>
</html>
