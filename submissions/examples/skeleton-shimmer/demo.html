<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skeleton Shimmer Demo - Issue #60198</title>
  <link rel="stylesheet" href="./style.css">
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      padding: 2rem;
      background-color: #f8fafc;
    }
    .card {
      width: 320px;
      padding: 1.5rem;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    .skeleton-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      margin-bottom: 1rem;
    }
    .skeleton-line {
      height: 14px;
      border-radius: 4px;
      margin-bottom: 0.75rem;
    }
    .skeleton-line.short {
      width: 60%;
    }
  </style>
</head>
<body>
  <h2>Skeleton Shimmer Animation Utility Demo (#60198)</h2>
  <div class="card">
    <div class="skeleton-avatar em-skeleton-shimmer"></div>
    <div class="skeleton-line em-skeleton-shimmer"></div>
    <div class="skeleton-line short em-skeleton-shimmer"></div>
  </div>
</body>
</html>
