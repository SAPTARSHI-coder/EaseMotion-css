<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skeleton Shimmer</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="demo-shell">
      <section class="demo-card" aria-labelledby="ss-title">
        <p class="eyebrow">Feedback</p>
        <h1 id="ss-title">Skeleton shimmer</h1>
        <p class="demo-copy">
          Shimmering placeholder blocks that sweep with a light gradient
          while content loads.
        </p>
        <div class="skeleton-shimmer" role="status" aria-busy="true" aria-live="polite">
          <span class="skeleton-shimmer__avatar"></span>
          <div class="skeleton-shimmer__lines">
            <span class="skeleton-shimmer__line skeleton-shimmer__line--title"></span>
            <span class="skeleton-shimmer__line skeleton-shimmer__line--mid"></span>
            <span class="skeleton-shimmer__line skeleton-shimmer__line--short"></span>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
