<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Responsive neumorphic minimalist CSS spinner."
  >

  <title>Neumorphic Spinner - Minimalist</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="spinner-page">

    <section class="spinner-demo" aria-labelledby="spinner-title">

      <div class="intro">
        <span class="eyebrow">CSS COMPONENT / 01</span>

        <h1 id="spinner-title">
          Neumorphic Spinner
        </h1>

        <p>
          A lightweight loading indicator built with pure CSS,
          soft neumorphic shadows and minimalist motion.
        </p>
      </div>

      <div
        class="spinner-stage"
        role="status"
        aria-label="Loading"
      >

        <div class="spinner">
          <span class="spinner-dot"></span>
        </div>

        <span class="loading-text">
          Loading
        </span>

        <span class="loading-dots" aria-hidden="true">
          <span></span>
          <span></span>
          <span></span>
        </span>

      </div>

      <div class="component-info">

        <div class="info-item">
          <strong>100%</strong>
          <span>CSS</span>
        </div>

        <div class="info-item">
          <strong>0</strong>
          <span>Dependencies</span>
        </div>

        <div class="info-item">
          <strong>∞</strong>
          <span>Scalable</span>
        </div>

      </div>

    </section>

  </main>

</body>
</html>
