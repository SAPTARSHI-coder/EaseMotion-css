<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Scrollable Tab Overflow - EaseMotion CSS</title>
  <!-- Import EaseMotion CSS -->
  <link rel="stylesheet" href="../../../easemotion.css">
  <!-- Component Specific Styles -->
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body class="minimalist-bg">

  <div class="demo-container">
    
    <div class="header-section">
      <h1 class="ease-text-3xl">Scrollable Tab Overflow</h1>
      <p class="ease-color-muted">Pure CSS horizontal scrolling tabs with snap alignment and invisible scrollbars. Try scrolling or swiping horizontally below.</p>
    </div>

    <!-- The Scrollable Tab Component -->
    <div class="tabs-wrapper">
      <nav class="scrollable-tabs" aria-label="Category Navigation">
        
        <input type="radio" name="tabs" id="tab-1" class="tab-radio" checked>
        <label for="tab-1" class="tab-item">Overview</label>
        
        <input type="radio" name="tabs" id="tab-2" class="tab-radio">
        <label for="tab-2" class="tab-item">Repositories</label>
        
        <input type="radio" name="tabs" id="tab-3" class="tab-radio">
        <label for="tab-3" class="tab-item">Projects</label>
        
        <input type="radio" name="tabs" id="tab-4" class="tab-radio">
        <label for="tab-4" class="tab-item">Packages</label>
        
        <input type="radio" name="tabs" id="tab-5" class="tab-radio">
        <label for="tab-5" class="tab-item">Stars</label>
        
        <input type="radio" name="tabs" id="tab-6" class="tab-radio">
        <label for="tab-6" class="tab-item">Sponsorships</label>
        
        <input type="radio" name="tabs" id="tab-7" class="tab-radio">
        <label for="tab-7" class="tab-item">Followers</label>
        
        <input type="radio" name="tabs" id="tab-8" class="tab-radio">
        <label for="tab-8" class="tab-item">Following</label>
        
        <input type="radio" name="tabs" id="tab-9" class="tab-radio">
        <label for="tab-9" class="tab-item">Settings</label>
        
        <!-- Active Indicator Line (Optional, animated purely via CSS flex tracking) -->
        <div class="tab-indicator"></div>
        
      </nav>
    </div>

    <div class="content-display ease-glass-card">
      <p>Select a tab above. Notice how the scroll naturally snaps to align items perfectly within the viewport on mobile devices.</p>
    </div>

  </div>

</body>
</html>
