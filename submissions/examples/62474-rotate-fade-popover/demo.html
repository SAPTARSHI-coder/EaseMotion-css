<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rotate Fade Popover</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<section class="checkout">

  <h1>Checkout</h1>
  <p class="subtitle">Complete your purchase securely</p>

  <div class="popover">

    <div class="icon">
      ✓
    </div>

    <div class="details">
      <h2>Payment Successful</h2>
      <p>Your order has been confirmed successfully.</p>
    </div>

    <button>
      View Order
    </button>

  </div>


  <div class="cart-card">

    <h3>Order Summary</h3>

    <div class="item">
      <span>Premium Package</span>
      <strong>$49</strong>
    </div>

    <div class="item">
      <span>Delivery</span>
      <strong>$5</strong>
    </div>

    <hr>

    <div class="total">
      <span>Total</span>
      <strong>$54</strong>
    </div>

  </div>

</section>

</body>
</html>
