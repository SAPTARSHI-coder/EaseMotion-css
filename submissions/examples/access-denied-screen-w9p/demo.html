<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="./style.css">
<title>CSS Access Denied Screen Demo</title>
</head>
<body>
<main class="ads-container" role="main" aria-labelledby="ads-title">
  <div class="ads-card">
    <div class="ads-lock-wrapper" aria-hidden="true">
      <div class="ads-shackle"></div>
      <div class="ads-body">
        <div class="ads-keyhole"></div>
      </div>
    </div>
    <span class="ads-code">ERROR 403</span>
    <h1 id="ads-title" class="ads-title">Access Denied</h1>
    <p class="ads-message">
      You don't have permission to view this resource. Please verify your credentials or contact the administrator.
    </p>
    <a href="#home" class="ads-btn" role="button" tabindex="0">Return to Safety</a>
  </div>
</main>
</body>
</html>
