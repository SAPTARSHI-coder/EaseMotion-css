<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-coffee-steam-cup demo</title>
</head>
<body>
<div class="cf-app">
  <span class="cf-title">BREW STATION</span>
  <div class="cf-saucer">
    <div class="cf-cup">
      <span class="cf-body"></span>
      <span class="cf-handle"></span>
      <span class="cf-foam"></span>
      <span class="cf-steam cf-steam-1"></span>
      <span class="cf-steam cf-steam-2"></span>
      <span class="cf-steam cf-steam-3"></span>
    </div>
  </div>
  <span class="cf-temp">85C FRESH</span>
</div>
</body>
</html>
