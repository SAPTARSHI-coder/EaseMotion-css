<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Animated Progress Bar Demo</title>
<link rel="stylesheet" href="style.css">
<style>
  body { font-family: sans-serif; max-width: 500px; margin: 3rem auto; }
  .demo-block { margin-bottom: 2rem; }
</style>
</head>
<body>
  <h2>Animated Progress Bar with Percentage Counter</h2>

  <div class="demo-block">
    <p>Default (75%)</p>
    <div class="ease-progress ease-progress-counter">
      <div class="ease-progress-bar" style="--ease-progress-value:75; width:75%;">
        <span class="ease-progress-label ease-progress-value"></span>
      </div>
    </div>
  </div>

  <div class="demo-block">
    <p>Large + Success (90%)</p>
    <div class="ease-progress ease-progress-lg ease-progress-counter ease-progress-success">
      <div class="ease-progress-bar" style="--ease-progress-value:90; width:90%;">
        <span class="ease-progress-label ease-progress-value"></span>
      </div>
    </div>
  </div>

  <div class="demo-block">
    <p>Danger (40%)</p>
    <div class="ease-progress ease-progress-counter ease-progress-danger">
      <div class="ease-progress-bar" style="--ease-progress-value:40; width:40%;">
        <span class="ease-progress-label ease-progress-value"></span>
      </div>
    </div>
  </div>

</body>
</html>
