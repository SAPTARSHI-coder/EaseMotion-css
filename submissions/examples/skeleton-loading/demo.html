<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skeleton Loading Demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f8fafc;
    }
    
    /* Demo Layout Card */
    .profile-card {
      background: white;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      width: 320px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }
    
    .profile-header {
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    
    .profile-info {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      flex: 1;
    }
    
    .content-lines {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
  </style>
</head>
<body>

  <div class="profile-card">
    
    <!-- Header Section -->
    <div class="profile-header">
      <div class="skeleton-ag skeleton-circle-ag" style="width: 60px; height: 60px;"></div>
      <div class="profile-info">
        <div class="skeleton-ag" style="width: 70%; height: 20px;"></div>
        <div class="skeleton-ag" style="width: 40%; height: 16px;"></div>
      </div>
    </div>
    
    <!-- Body Content Section -->
    <div class="content-lines">
      <div class="skeleton-ag" style="width: 100%; height: 16px;"></div>
      <div class="skeleton-ag" style="width: 100%; height: 16px;"></div>
      <div class="skeleton-ag" style="width: 80%; height: 16px;"></div>
    </div>
    
    <!-- Footer/Button Section -->
    <div class="skeleton-ag skeleton-rounded-ag" style="width: 100%; height: 40px; margin-top: 1rem;"></div>
    
  </div>

</body>
</html>
