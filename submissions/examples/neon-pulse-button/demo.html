<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Neon Pulse Button - a glowing animated CSS button." />
    <title>Neon Pulse Button | EaseMotion</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <main class="page">
        <section class="showcase" aria-labelledby="title">
            <p class="eyebrow">EaseMotion / CSS Animation</p>

            <h1 id="title">Neon Pulse Button</h1>

            <p class="description">
                Hover or focus the button to activate its soft neon pulse and intensified glow.
            </p>

            <div class="button-stage">
                <button class="neon-button" type="button">
          <span class="button-glow" aria-hidden="true"></span>
          <span class="button-content">
            <span>Launch</span>
            <span class="arrow" aria-hidden="true">↗</span>
          </span>
        </button>
            </div>

            <p class="hint">Hover or focus the button</p>
        </section>
    </main>
</body>

</html>
