<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-oven-temperature-probe demo</title>
</head>
<body>
<div class="otp-oven">
  <div class="otp-door">
    <span class="otp-glass"></span>
    <span class="otp-handle"></span>
  </div>
  <div class="otp-display">
    <b class="otp-temp">375°F</b>
    <span class="otp-state">PREHEATING</span>
  </div>
  <div class="otp-probe">
    <span class="otp-wire"></span>
    <i class="otp-tip"></i>
  </div>
</div>
</body>
</html>
