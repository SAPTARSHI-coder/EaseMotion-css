<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Perspective Grid Background - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
    }
    
    /* Section Styles */
    section {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }
    
    h2 {
      font-size: 2rem;
      color: white;
      margin-bottom: 2rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    
    .controls {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 2rem;
    }
    
    .variant-btn {
      padding: 0.75rem 1.5rem;
      background: rgba(255, 255, 255, 0.1);
      border: 2px solid var(--grid-color);
      color: white;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      transition: all 0.3s ease;
      font-size: 0.875rem;
    }
    
    .variant-btn:hover {
      background: var(--grid-color);
      color: var(--grid-bg);
    }
    
    .variant-btn.active {
      background: var(--grid-color);
      color: var(--grid-bg);
    }
    
    /* Demo Cards */
    .demo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 2rem;
      width: 100%;
      max-width: 1200px;
      padding: 2rem;
    }
    
    .demo-card {
      position: relative;
      height: 300px;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    
    .demo-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
    }
    
    .demo-card .grid-bg {
      height: 100%;
    }
    
    .demo-label {
      position: absolute;
      bottom: 1rem;
      left: 1rem;
      color: white;
      font-size: 0.875rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      z-index: 5;
    }
  </style>
</head>
<body>
  <!-- Basic Grid Background -->
  <section>
    <div class="grid-page">
      <div class="grid-bg"></div>
      <div class="grid-stars"></div>
      <div class="grid-sun"></div>
      <div class="grid-horizon"></div>
      <div class="grid-content">
        <h1 class="grid-title">Synthwave</h1>
        <p class="grid-subtitle">Retro Future</p>
      </div>
    </div>
    
    <div class="controls">
      <button class="variant-btn active" onclick="showVariant('basic')">Basic Grid</button>
      <button class="variant-btn" onclick="showVariant('gradient')">Gradient Grid</button>
      <button class="variant-btn" onclick="showVariant('glow')">Glow Effect</button>
    </div>
  </section>
  
  <!-- Grid Variants Showcase -->
  <section>
    <h2>Grid Variants</h2>
    <div class="demo-grid">
      <div class="demo-card" id="demo-basic">
        <div class="grid-bg">
          <div class="grid-stars"></div>
          <div class="grid-sun"></div>
          <div class="grid-horizon"></div>
        </div>
        <span class="demo-label">Basic</span>
      </div>
      
      <div class="demo-card" id="demo-gradient">
        <div class="grid-bg grid-bg--gradient">
          <div class="grid-stars"></div>
          <div class="grid-sun"></div>
          <div class="grid-horizon"></div>
        </div>
        <span class="demo-label">Gradient</span>
      </div>
      
      <div class="demo-card" id="demo-glow">
        <div class="grid-bg grid-bg--glow">
          <div class="grid-stars"></div>
          <div class="grid-sun"></div>
          <div class="grid-horizon"></div>
        </div>
        <span class="demo-label">Glow</span>
      </div>
    </div>
  </section>
  
  <!-- Footer -->
  <footer style="background: #01012b; padding: 2rem; text-align: center; color: #05d9e8;">
    <p>CSS Perspective Grid Background - Pure CSS Animation</p>
    <p style="margin-top: 0.5rem; font-size: 0.875rem; opacity: 0.7;">Part of EaseMotion CSS Collection</p>
  </footer>
  
  <script>
    function showVariant(variant) {
      // Update button states
      document.querySelectorAll('.variant-btn').forEach(btn => {
        btn.classList.remove('active');
      });
      event.target.classList.add('active');
      
      // Scroll to variant
      const demoMap = {
        'basic': 'demo-basic',
        'gradient': 'demo-gradient',
        'glow': 'demo-glow'
      };
      
      const element = document.getElementById(demoMap[variant]);
      if (element) {
        element.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    }
  </script>
</body>
</html>
