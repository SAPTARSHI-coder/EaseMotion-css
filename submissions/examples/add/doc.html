<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimalist Floating Action Button (FAB) Accessibility & Documentation Guide</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Minimalist Floating Action Button (FAB)</h1>
    <p>Accessibility, Styling Guidelines, and Keyboard Navigation setup.</p>
  </header>

  <main>
    <section>
      <h2>Standard Markup Example</h2>
      <p>Use a native <code>&lt;button&gt;</code> element to ensure built-in keyboard accessibility and screen reader support.</p>
      
      <!-- Minimalist FAB Element -->
      <button 
        type="button" 
        class="fab" 
        aria-label="Create new document" 
        aria-haspopup="false">
        <svg class="fab__icon" aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
      </button>
    </section>

    <section>
      <h2>Extended FAB Example (With Visible Label)</h2>
      
      <!-- Extended FAB Element -->
      <button 
        type="button" 
        class="fab fab--extended" 
        aria-label="Compose new email">
        <svg class="fab__icon" aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        <span class="fab__label">Compose</span>
      </button>
    </section>
  </main>
</body>
</html>
