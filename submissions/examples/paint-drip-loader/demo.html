<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Pure CSS paint drip loader animation"
  >

  <title>CSS Paint Drip Loader</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="demo">
    <section class="loader-card" aria-labelledby="loader-title">

      <div class="loader-content">
        <p class="eyebrow">CSS Animation</p>

        <h1 id="loader-title">Paint Drip Loader</h1>

        <p class="description">
          A colorful paint drip animation created entirely with
          HTML and vanilla CSS.
        </p>

        <div
          class="paint-loader"
          role="status"
          aria-label="Loading"
          aria-live="polite"
        >
          <span class="paint-bar"></span>

          <span class="drip drip-one"></span>
          <span class="drip drip-two"></span>
          <span class="drip drip-three"></span>
          <span class="drip drip-four"></span>
        </div>

        <span class="loading-text" aria-hidden="true">
          Loading...
        </span>
      </div>

    </section>
  </main>

</body>
</html>
