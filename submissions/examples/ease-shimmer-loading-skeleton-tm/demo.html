<!DOCTYPE html>
<html lang="en">
<head>

      </div>
      <div class="shimmer-line"></div>
      <div class="shimmer-line"></div>
      <div class="shimmer-line w-80"></div>
    </div>
    <div class="shimmer-card">
      <div class="shimmer-header">
        <div class="shimmer-line avatar"></div>

          <div class="shimmer-line w-70" style="height:12px;"></div>
          <div class="shimmer-line w-50" style="height:10px; margin-top:6px;"></div>
        </div>
      </div>
      <div class="shimmer-line"></div>
      <div class="shimmer-line"></div>
      <div class="shimmer-line w-60"></div>
