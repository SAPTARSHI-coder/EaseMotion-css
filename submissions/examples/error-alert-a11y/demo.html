<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accessible Error Alert Demo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <main class="demo-container">
        <h1>Critical Error Alerts</h1>
        <p>This demo illustrates how to properly announce critical errors to screen reader users using <code>role="alert"</code>. Unlike polite status updates, alerts instantly interrupt whatever the screen reader is currently saying.</p>
        
        <form class="demo-form" id="demo-form">
            <!-- 
                CRITICAL ACCESSIBILITY: The Live Region Container
                The container must exist in the HTML on page load.
                role="alert" acts as an aria-live="assertive" region.
                Any text injected inside this div will instantly interrupt the screen reader.
            -->
            <div id="error-container" class="error-container" role="alert" aria-atomic="true">
                <!-- Errors injected here -->
            </div>

            <div class="form-group">
                <label for="username" class="form-label">Username (required)</label>
                <input type="text" id="username" class="form-input" aria-describedby="error-container">
            </div>

            <button type="submit" class="submit-btn" id="submit-btn">
                Create Account
            </button>
        </form>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('demo-form');
            const usernameInput = document.getElementById('username');
            const errorContainer = document.getElementById('error-container');

            form.addEventListener('submit', (e) => {
                e.preventDefault();

                const username = usernameInput.value.trim();

                if (username === '') {
                    // Trigger the alert by injecting text into the live region
                    showError('Error: Username is a required field.');
                    
                    // Visually indicate the error on the input
                    usernameInput.setAttribute('aria-invalid', 'true');
                    usernameInput.classList.add('is-invalid');
                    
                    // Return focus to the input so the user can fix it
                    usernameInput.focus();
                } else {
                    // Clear the error
                    clearError();
                    usernameInput.removeAttribute('aria-invalid');
                    usernameInput.classList.remove('is-invalid');
                    
                    alert('Account created successfully!');
                }
            });

            function showError(message) {
                // By replacing the innerHTML, the screen reader detects a DOM mutation
                // inside the role="alert" container and instantly announces it.
                errorContainer.innerHTML = `
                    <div class="alert-box">
                        <svg class="alert-icon" aria-hidden="true" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"></circle>
                            <line x1="12" y1="8" x2="12" y2="12"></line>
                            <line x1="12" y1="16" x2="12.01" y2="16"></line>
                        </svg>
                        <span>${message}</span>
                    </div>
                `;
            }

            function clearError() {
                errorContainer.innerHTML = '';
            }
        });
    </script>
</body>
</html>
