<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Isometric Grid - EaseMotion</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="ease-iso-scene">
    <div class="ease-iso-grid">
      <div class="ease-iso-block">1</div>
      <div class="ease-iso-block">2</div>
      <div class="ease-iso-block">3</div>
      <div class="ease-iso-block">4</div>
      <div class="ease-iso-block">5</div>
      <div class="ease-iso-block">6</div>
      <div class="ease-iso-block">7</div>
      <div class="ease-iso-block">8</div>
      <div class="ease-iso-block">9</div>
    </div>
  </div>
  <p style="position: absolute; bottom: 2rem; color: #64748b; font-size: 0.875rem; text-transform: uppercase; letter-spacing: 2px;">Hover to extrude blocks along the Z-axis</p>
</body>
</html>
