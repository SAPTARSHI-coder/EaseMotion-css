<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Pure CSS animated bookmark toggle button."
  >
  <title>CSS Bookmark Toggle Button</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">
    <section class="demo" aria-labelledby="title">
      <span class="eyebrow">Pure CSS Component</span>

      <h1 id="title">Bookmark Toggle</h1>

      <p class="intro">
        Click the bookmark to save or remove an item.
      </p>

      <div class="bookmark-card">
        <div class="content">
          <span class="category">ARTICLE</span>
          <h2>Designing Better Interfaces</h2>
          <p>
            A simple example of a reusable bookmark interaction
            created without JavaScript.
          </p>
        </div>

        <label class="bookmark-toggle">
          <input
            type="checkbox"
            aria-label="Bookmark this article"
          >

          <span class="bookmark-button" aria-hidden="true">
            <svg
              class="bookmark-icon"
              viewBox="0 0 24 24"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M6 4.75C6 3.784 6.784 3 7.75 3h8.5C17.216 3 18 3.784 18 4.75V21l-6-3.75L6 21V4.75Z"
              />
            </svg>
          </span>
        </label>
      </div>

      <p class="hint">
        Select the bookmark icon to toggle its state
      </p>
    </section>
  </main>

</body>
</html>
