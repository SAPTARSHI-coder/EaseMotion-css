<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taxi Meter Fare Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="ease-taxi-meter-fare-sabya">
    <!-- The main physical box of the meter -->
    <div class="meter-housing">
      
      <!-- Top section with the label and glowing lamp -->
      <div class="meter-header">
        <span class="taxi-label">TAXI FARE</span>
        <div class="hired-lamp">HIRED</div>
      </div>
      
      <!-- The digital screen showing the money -->
      <div class="fare-display">
        <span class="currency">$</span>
        
        <!-- The window that hides the extra numbers -->
        <div class="digit-window">
          
          <!-- The long strip of numbers that will slide up -->
          <div class="rolling-digits">
            <span>12.50</span>
            <span>13.00</span>
            <span>13.50</span>
            <span>14.00</span>
            <span>14.50</span>
          </div>
          
        </div>
      </div>
      
    </div>
  </div>
</body>
</html>
