<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Text Truncate Utility</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <h2>Text Truncate Utility</h2>

  <div class="card">
    <h3 class="text-truncate">
      This is an extremely long card title that will automatically truncate with an ellipsis instead of overflowing its container.
    </h3>

    <p>
      The utility keeps layouts clean by preventing long text from breaking UI components.
    </p>
  </div>

  <div class="card">
    <button class="btn text-truncate">
      Download the Complete EaseMotion CSS Documentation Package
    </button>
  </div>

</div>

</body>
</html>
