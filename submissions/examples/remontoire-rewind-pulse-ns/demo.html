<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Remontoire Rewind Pulse — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Remontoire Rewind Pulse demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Remontoire Rewind Pulse</h1>
      <p class="lede">Remontoire delivering a sharp rewind pulse to the train</p>
    </header>

    <section class="ease-remontoire-rewind-pulse" data-demo="remontoire-rewind-pulse" aria-live="polite">
      <div class="ease-remontoire-rewind-pulse__housing">
        <div class="ease-remontoire-rewind-pulse__bezel">
          <div class="ease-remontoire-rewind-pulse__face">
            <div class="ease-remontoire-rewind-pulse__readout">
              <span class="ease-remontoire-rewind-pulse__label">Remontoire Rewind Pulse</span>
              <span class="ease-remontoire-rewind-pulse__value">LIVE</span>
            </div>
            <div class="ease-remontoire-rewind-pulse__motion" aria-hidden="true">
              <span class="ease-remontoire-rewind-pulse__a"></span>
              <span class="ease-remontoire-rewind-pulse__b"></span>
              <span class="ease-remontoire-rewind-pulse__c"></span>
              <span class="ease-remontoire-rewind-pulse__d"></span>
            </div>
            <div class="ease-remontoire-rewind-pulse__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-remontoire-rewind-pulse__controls">
          <button type="button" class="ease-remontoire-rewind-pulse__btn primary">Engage</button>
          <button type="button" class="ease-remontoire-rewind-pulse__btn">Reset</button>
          <label class="ease-remontoire-rewind-pulse__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-remontoire-rewind-pulse__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
