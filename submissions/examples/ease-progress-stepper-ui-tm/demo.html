<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Progress Stepper | EaseMotion CSS</title><link rel="stylesheet" href="style.css"></head>
<body><div class="ps-root">
<h2 class="ps-title">Checkout Progress</h2>
<input type="radio" name="ps" class="ps-radio" id="ps1" checked>
<input type="radio" name="ps" class="ps-radio" id="ps2">
<div class="ps-track">
<div class="ps-step ps-done"><div class="ps-circle">1</div><span class="ps-label">Cart</span></div>
<div class="ps-step ps-active"><div class="ps-circle">2</div><span class="ps-label">Shipping</span></div>
<div class="ps-step"><div class="ps-circle">3</div><span class="ps-label">Payment</span></div>
<div class="ps-step"><div class="ps-circle">4</div><span class="ps-label">Done</span></div>
</div>
<p class="ps-sub">Step 2 of 4 — pure CSS stepper using radio inputs.</p>
</div></body></html>
