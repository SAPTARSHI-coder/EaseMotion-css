<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ease-3d-carousel-bh</title>
  <link rel="stylesheet" href="style.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #f1f5f9; padding: 2rem; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    h1 { color: #6366f1; margin-bottom: 0.5rem; text-align: center; }
    p { color: #94a3b8; margin-bottom: 2rem; text-align: center; }
  </style>
</head>
<body>
  <h1>ease-3d-carousel-bh</h1>
  <p>Hover over the carousel to see the depth parallax effect</p>
  
  <div class="ease-3d-carousel">
    <div class="ease-3d-carousel-item">Slide 1</div>
    <div class="ease-3d-carousel-item">Slide 2</div>
    <div class="ease-3d-carousel-item">Slide 3</div>
    <div class="ease-3d-carousel-item">Slide 4</div>
    <div class="ease-3d-carousel-item">Slide 5</div>
    <div class="ease-3d-carousel-item">Slide 6</div>
  </div>
</body>
</html>
