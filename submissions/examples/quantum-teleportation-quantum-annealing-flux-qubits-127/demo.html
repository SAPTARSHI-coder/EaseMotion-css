<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Annealing Flux Qubits - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css"></head><body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030712; color: #ffffff;">

    <div class="ease-card ease-card-glass anneal-container">
        <div class="anneal-header">
            <h2>Quantum Annealing Flux Qubits</h2>
            <span class="ease-badge ease-badge-secondary">Adiabatic QC</span>
        </div>
        
        <div class="anneal-screen ease-center">
            <div class="anneal-flux flux-anneal-a"></div>
            <div class="anneal-flux flux-anneal-b"></div>
            <div class="anneal-boundary-ring"></div>
            <div class="anneal-core ease-center"></div>
        </div>

        <div class="anneal-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Transverse Field &amp; Ground State Optimization</span>
            <button class="ease-btn ease-btn-secondary ease-btn-sm ease-hover-grow">Run Quantum Anneal</button>
        </div>
    </div></body></html>
