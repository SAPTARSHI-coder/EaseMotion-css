
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Magnetic Button Pull — Demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="demo-wrap">
    <h1>Magnetic Button Pull</h1>
    <p class="sub">Move your cursor near the button — it pulls toward you.</p>

    <div class="card">
      <button class="btn magnetic" data-magnetic>Hover near me</button>
    </div>
  </main>

  <script>
    document.querySelectorAll('[data-magnetic]').forEach(btn => {
      btn.addEventListener('mousemove', (e) => {
        const r = btn.getBoundingClientRect();
        const x = (e.clientX - r.left - r.width / 2) * 0.3;
        const y = (e.clientY - r.top - r.height / 2) * 0.3;
        btn.style.setProperty('--x', `${x}px`);
        btn.style.setProperty('--y', `${y}px`);
      });
      btn.addEventListener('mouseleave', () => {
        btn.style.setProperty('--x', '0px');
        btn.style.setProperty('--y', '0px');
      });
    });
  </script>
</body>
</html>
