<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EaseMotion CSS - Modal Demo</title>

    <!-- Update this path to the actual EaseMotion CSS file -->
    <link rel="stylesheet" href="../../dist/easemotion.css">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="page">

        <section class="hero">
            <span class="eyebrow">EaseMotion CSS</span>

            <h1>Responsive Modal Demo</h1>

            <p>
                A simple modal component demonstrating interactive
                UI behavior and smooth transitions.
            </p>

            <button
                id="openModal"
                class="open-button"
                type="button">
                Open Modal
            </button>
        </section>

    </main>


    <div
        id="modal"
        class="modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modalTitle"
        aria-hidden="true">

        <div class="modal-content">

            <button
                id="closeModal"
                class="close-button"
                type="button"
                aria-label="Close modal">
                &times;
            </button>

            <h2 id="modalTitle">
                Welcome to EaseMotion CSS
            </h2>

            <p>
                This modal demonstrates how a small interactive
                component can be combined with CSS animations
                and responsive design.
            </p>

            <button
                id="modalAction"
                class="action-button"
                type="button">
                Continue
            </button>

        </div>

    </div>


    <script>

        const modal = document.getElementById("modal");
        const openButton = document.getElementById("openModal");
        const closeButton = document.getElementById("closeModal");
        const actionButton = document.getElementById("modalAction");

        let previousActiveElement = null;


        function openModal() {

            previousActiveElement = document.activeElement;

            modal.classList.add("is-open");

            modal.setAttribute("aria-hidden", "false");

            document.body.classList.add("modal-open");

            closeButton.focus();
        }


        function closeModal() {

            modal.classList.remove("is-open");

            modal.setAttribute("aria-hidden", "true");

            document.body.classList.remove("modal-open");

            if (previousActiveElement) {
                previousActiveElement.focus();
            }
        }


        openButton.addEventListener("click", openModal);

        closeButton.addEventListener("click", closeModal);

        actionButton.addEventListener("click", closeModal);


        modal.addEventListener("click", (event) => {

            if (event.target === modal) {
                closeModal();
            }

        });


        document.addEventListener("keydown", (event) => {

            if (
                event.key === "Escape" &&
                modal.classList.contains("is-open")
            ) {
                closeModal();
            }

        });

    </script>

</body>

</html>
