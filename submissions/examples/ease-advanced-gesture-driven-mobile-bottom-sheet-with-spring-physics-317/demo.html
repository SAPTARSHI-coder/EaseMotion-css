<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gesture Bottom Sheet</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="mobile-frame">
    <div class="app-content">
      <h1>Music Player</h1>
      <p>Discover new tracks, artists, and playlists tailored just for you.</p>
      <button class="trigger-btn" id="openBtn">Now Playing</button>
    </div>

    <!-- Overlay -->
    <div class="overlay" id="overlay"></div>

    <!-- Bottom Sheet -->
    <div class="bottom-sheet transitioning" id="bottomSheet">
      <div class="sheet-handle-container" id="sheetHandle">
        <div class="sheet-handle"></div>
      </div>
      <div class="sheet-content">
        <h2>Now Playing</h2>
        <p>Advanced spring physics bottom sheet with gesture tracking.</p>
        <p>Drag the handle down to close, or flick it. The spring animation naturally settles it back into place.</p>
        <div style="height: 400px; background: #333; border-radius: 12px; margin-top: 20px;"></div>
      </div>
    </div>
  </div>

  <script>
    const sheet = document.getElementById('bottomSheet');
    const handle = document.getElementById('sheetHandle');
    const openBtn = document.getElementById('openBtn');
    const overlay = document.getElementById('overlay');

    let startY = 0;
    let currentY = 0;
    let isDragging = false;

    // Helper to open sheet
    function openSheet() {
      sheet.classList.add('transitioning');
      sheet.style.transform = 'translateY(0%)';
      overlay.classList.add('active');
    }

    // Helper to close sheet
    function closeSheet() {
      sheet.classList.add('transitioning');
      sheet.style.transform = 'translateY(100%)';
      overlay.classList.remove('active');
    }

    openBtn.addEventListener('click', openSheet);
    overlay.addEventListener('click', closeSheet);

    function onDragStart(e) {
      isDragging = true;
      startY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
      sheet.classList.remove('transitioning'); // Remove spring transition for 1:1 dragging
      
      // Get current transform Y
      const style = window.getComputedStyle(sheet);
      const matrix = new WebKitCSSMatrix(style.transform);
      currentY = matrix.m42;
    }

    function onDragMove(e) {
      if (!isDragging) return;
      const y = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
      const deltaY = y - startY;
      let newY = currentY + deltaY;

      // Prevent dragging above the maximum open state
      if (newY < 0) {
        // Add resistance/rubber-band effect when pulled too high
        newY = newY * 0.2;
      }
      
      sheet.style.transform = `translateY(${newY}px)`;
    }

    function onDragEnd(e) {
      if (!isDragging) return;
      isDragging = false;
      
      sheet.classList.add('transitioning');
      
      // Get current Y transform to determine snap point
      const style = window.getComputedStyle(sheet);
      const matrix = new WebKitCSSMatrix(style.transform);
      const finalY = matrix.m42;
      
      // Snap logic
      if (finalY > 150) { // If dragged down past a threshold
        closeSheet();
      } else {
        openSheet();
      }
    }

    // Touch events
    handle.addEventListener('touchstart', onDragStart, { passive: false });
    window.addEventListener('touchmove', onDragMove, { passive: false });
    window.addEventListener('touchend', onDragEnd);

    // Mouse events
    handle.addEventListener('mousedown', onDragStart);
    window.addEventListener('mousemove', onDragMove);
    window.addEventListener('mouseup', onDragEnd);
  </script>
</body>
</html>
