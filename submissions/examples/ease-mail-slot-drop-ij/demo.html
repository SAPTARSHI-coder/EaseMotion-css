<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.8">
<title>Mail Slot Drop</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="doorway">
  <header class="mail-head">
    <h1 class="mail-title">HOUSE 14</h1>
    <p class="mail-count">MAIL 5</p>
  </header>
  <section class="mail-door" aria-label="Front door with mail slot">
    <div class="door-panel">
      <span class="door-frame"></span>
      <span class="door-knob"></span>
      <span class="mail-flap"></span>
      <span class="mail-slot"></span>
    </div>
    <div class="mail-drop">
      <span class="letter letter-a"></span>
      <span class="letter letter-b"></span>
      <span class="letter letter-c"></span>
    </div>
  </section>
  <footer class="mail-foot">
    <span class="mail-daily">DAILY 2</span>
    <span class="mail-stamp">STAMP 0.55</span>
  </footer>
</main>
</body>
</html>
