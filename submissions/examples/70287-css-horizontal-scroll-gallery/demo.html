<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Horizontal Scroll Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<main>
    <section class="hero">
        <h1>Horizontal Scroll Gallery</h1>
        <p>Pure CSS sticky scrolling experience</p>
    </section>


    <section class="gallery-section" aria-label="Image gallery">

        <div class="gallery-wrapper">

            <article class="card">
                <div class="image">01</div>
                <h2>Mountain</h2>
                <p>Explore peaceful landscapes.</p>
            </article>


            <article class="card">
                <div class="image">02</div>
                <h2>Ocean</h2>
                <p>Discover deep blue oceans.</p>
            </article>


            <article class="card">
                <div class="image">03</div>
                <h2>Forest</h2>
                <p>Walk through green forests.</p>
            </article>


            <article class="card">
                <div class="image">04</div>
                <h2>Desert</h2>
                <p>Experience endless deserts.</p>
            </article>


            <article class="card">
                <div class="image">05</div>
                <h2>Space</h2>
                <p>Travel beyond Earth.</p>
            </article>

        </div>

    </section>


    <section class="footer">
        <h2>End of Gallery</h2>
    </section>

</main>

</body>
</html>
