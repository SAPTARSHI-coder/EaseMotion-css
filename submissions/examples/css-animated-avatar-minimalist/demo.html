<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Avatar | Minimalist Styling</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="avatar-card" aria-label="Animated Minimalist Avatar Showcase">
    <div class="avatar-container" role="img" aria-label="Alex Morgan's profile avatar with active online status">
        <div class="avatar-ring" aria-hidden="true"></div>
        <img 
            src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=250" 
            alt="Alex Morgan" 
            class="avatar-img"
        >
        <span class="status-badge" title="Online" aria-label="Online status"></span>
    </div>

    <h1 class="user-name">Alex Morgan</h1>
    <p class="user-role">Product Designer & Developer</p>
    <p class="card-desc">Minimalist profile avatar featuring continuous ambient halo pulsing, rotating ring accents, and spring hover dynamics.</p>
</main>

</body>
</html>
