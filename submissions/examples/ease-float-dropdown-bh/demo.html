<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ease-float-dropdown-bh</title>
  <link rel="stylesheet" href="style.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #f1f5f9; padding: 2rem; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    h1 { color: #14b8a6; margin-bottom: 0.5rem; }
    p { color: #94a3b8; margin-bottom: 2rem; }
  </style>
</head>
<body>
  <h1>ease-float-dropdown-bh</h1>
  <p>Click the button to see float-drift animation</p>
  
  <div class="ease-float-dropdown" id="dropdown">
    <button class="ease-dropdown-trigger" onclick="toggleDropdown()">Menu</button>
    <div class="ease-dropdown-menu">
      <div class="ease-dropdown-item">🎮 Games</div>
      <div class="ease-dropdown-item">🏆 Tournaments</div>
      <div class="ease-dropdown-item">👥 Community</div>
      <div class="ease-dropdown-item">📊 Leaderboards</div>
    </div>
  </div>
  
  <script>
    function toggleDropdown() {
      document.getElementById('dropdown').classList.toggle('open');
    }
    
    document.addEventListener('click', function(e) {
      const dropdown = document.getElementById('dropdown');
      if (!dropdown.contains(e.target)) {
        dropdown.classList.remove('open');
      }
    });
  </script>
</body>
</html>
