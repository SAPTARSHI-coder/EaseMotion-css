<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Animated pagination showcase for EaseMotion CSS issue #78683." />
    <title>Animated Pagination</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="page">
      <section class="showcase" aria-labelledby="title">
        <p class="eyebrow">EaseMotion CSS · Issue #78683</p>
        <h1 id="title">Animated Pagination</h1>
        <p class="intro">
          A responsive pagination control with animated hover, focus, and
          current-page states.
        </p>

        <nav aria-label="Pagination">
          <ul class="pagination">
            <li><a href="#previous" aria-label="Previous page">‹</a></li>
            <li><a href="#one">1</a></li>
            <li><a class="active" href="#two" aria-current="page">2</a></li>
            <li><a href="#three">3</a></li>
            <li><a href="#four">4</a></li>
            <li><a href="#five">5</a></li>
            <li><a href="#next" aria-label="Next page">›</a></li>
          </ul>
        </nav>

        <p class="hint">The highlighted control represents the current page.</p>
      </section>
    </main>
  </body>
</html>
