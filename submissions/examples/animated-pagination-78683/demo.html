<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Animated Pagination</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="page">
      <h1>Animated Pagination</h1>

      <nav aria-label="Pagination">
        <ul class="pagination">
          <li><a href="#previous" aria-label="Previous page">‹</a></li>
          <li><a href="#one">1</a></li>
          <li><a class="active" href="#two" aria-current="page">2</a></li>
          <li><a href="#three">3</a></li>
          <li><a href="#four">4</a></li>
          <li><a href="#next" aria-label="Next page">›</a></li>
        </ul>
      </nav>
    </main>
  </body>
</html>
