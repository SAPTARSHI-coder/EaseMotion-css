<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zero-Point Energy Vacuum Fluctuation - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #022c22; color: #ffffff;">

    <div class="ease-card ease-card-glass zero-point-container">
        <div class="zero-point-header">
            <h2>Vacuum Field</h2>
            <span class="ease-badge ease-badge-success">Fluctuating</span>
        </div>
        
        <div class="zero-point-screen ease-center">
            <div class="casimir-flux flux-1"></div>
            <div class="casimir-flux flux-2"></div>
            <div class="virtual-particle-ring"></div>
            <div class="zero-point-core ease-center"></div>
        </div>

        <div class="zero-point-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Density: 1.05 × 10⁹³ g/cm³</span>
            <button class="ease-btn ease-btn-primary ease-btn-sm ease-hover-grow">Harvest Vacuum</button>
        </div>
    </div>

</body>
</html>
