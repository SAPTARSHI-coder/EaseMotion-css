<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ripple-Wave Card Grid | EaseMotion CSS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="checkout-layout">
        <header class="checkout-header">
            <h1>Select Payment Method</h1>
            <p>Choose your preferred way to pay</p>
        </header>
        
        <div class="ripple-wave-card-grid">
            <!-- Card 1 -->
            <label class="ripple-card">
                <input type="radio" name="payment" value="credit-card" checked>
                <div class="card-content">
                    <div class="icon-wrapper">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect><line x1="1" y1="10" x2="23" y2="10"></line></svg>
                    </div>
                    <div class="card-text">
                        <h3>Credit Card</h3>
                        <p>Visa, MasterCard, Amex</p>
                    </div>
                    <div class="check-indicator">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                    </div>
                </div>
                <div class="ripple-effect"></div>
            </label>

            <!-- Card 2 -->
            <label class="ripple-card">
                <input type="radio" name="payment" value="paypal">
                <div class="card-content">
                    <div class="icon-wrapper">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 11.5V14m0-2.5h2.5a2.5 2.5 0 1 0 0-5H7v7.5z"></path><path d="M10.5 11.5H13a2.5 2.5 0 1 0 0-5h-2.5v7.5z"></path><path d="M13 14h-2.5"></path></svg>
                    </div>
                    <div class="card-text">
                        <h3>PayPal</h3>
                        <p>Fast and secure</p>
                    </div>
                    <div class="check-indicator">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                    </div>
                </div>
                <div class="ripple-effect"></div>
            </label>

            <!-- Card 3 -->
            <label class="ripple-card">
                <input type="radio" name="payment" value="apple-pay">
                <div class="card-content">
                    <div class="icon-wrapper">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2C6.477 2 2 6.477 2 12s4.477 10 10 10 10-4.477 10-10S17.523 2 12 2z"></path><path d="M12 8v8M8 12h8"></path></svg>
                    </div>
                    <div class="card-text">
                        <h3>Apple Pay</h3>
                        <p>Quick checkout</p>
                    </div>
                    <div class="check-indicator">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                    </div>
                </div>
                <div class="ripple-effect"></div>
            </label>

            <!-- Card 4 -->
            <label class="ripple-card">
                <input type="radio" name="payment" value="google-pay">
                <div class="card-content">
                    <div class="icon-wrapper">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12A10 10 0 1 1 12 2v10h10z"></path></svg>
                    </div>
                    <div class="card-text">
                        <h3>Google Pay</h3>
                        <p>One tap to pay</p>
                    </div>
                    <div class="check-indicator">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                    </div>
                </div>
                <div class="ripple-effect"></div>
            </label>
        </div>
        
        <button class="checkout-btn">Continue to Review</button>
    </main>
</body>
</html>
