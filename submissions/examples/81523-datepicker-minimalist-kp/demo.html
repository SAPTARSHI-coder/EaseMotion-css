<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Floating Datepicker - Minimalist</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="minimal-demo" aria-labelledby="date-title">
    <section class="minimal-shell">
      <div class="intro">
        <p class="eyebrow">Quiet scheduling</p>
        <h1 id="date-title">Floating Datepicker</h1>
        <p>Minimal calendar UI with soft elevation, clear focus targets, and calm motion.</p>
      </div>
      <div class="calendar" role="group" aria-label="Floating datepicker preview">
        <header>
          <button aria-label="Previous month">Prev</button>
          <strong>August 2026</strong>
          <button aria-label="Next month">Next</button>
        </header>
        <div class="week"><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span></div>
        <div class="grid">
          <span>27</span><span>28</span><span>29</span><span>30</span><span>31</span>
          <button>1</button><button>2</button><button>3</button><button>4</button><button>5</button>
          <button>6</button><button>7</button><button class="today">8</button><button>9</button><button>10</button>
          <button>11</button><button>12</button><button>13</button><button>14</button><button>15</button>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
