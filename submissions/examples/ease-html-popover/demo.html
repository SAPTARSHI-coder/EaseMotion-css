<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ease HTML Popover Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <button class="ease-btn" popovertarget="ease-modal">Open Native Modal</button>

  <div id="ease-modal" class="ease-popover" popover>
    <h2 style="margin-top: 0; margin-bottom: 0.75rem; font-size: 1.25rem;">Native Popover Title</h2>
    <p style="margin: 0; color: #94a3b8; line-height: 1.5;">
      This popover is rendered in the top-layer using the HTML Popover API with zero JavaScript. Smooth entry and exit transitions are powered by CSS <code>@starting-style</code> and <code>allow-discrete</code>.
    </p>
    <button class="ease-btn" popovertarget="ease-modal" popovertargetaction="hide" style="margin-top: 1.5rem; background: #ef4444;">Close Modal</button>
  </div>
</body>
</html>
