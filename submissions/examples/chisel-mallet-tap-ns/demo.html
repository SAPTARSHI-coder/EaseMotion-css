<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chisel Mallet Tap — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Chisel Mallet Tap demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Chisel Mallet Tap</h1>
      <p class="lede">Wood chisel advancing with each mallet tap</p>
    </header>

    <section class="ease-chisel-mallet-tap" data-demo="chisel-mallet-tap" aria-live="polite">
      <div class="ease-chisel-mallet-tap__housing">
        <div class="ease-chisel-mallet-tap__bezel">
          <div class="ease-chisel-mallet-tap__face">
            <div class="ease-chisel-mallet-tap__readout">
              <span class="ease-chisel-mallet-tap__label">Chisel Mallet Tap</span>
              <span class="ease-chisel-mallet-tap__value">LIVE</span>
            </div>
            <div class="ease-chisel-mallet-tap__motion" aria-hidden="true">
              <span class="ease-chisel-mallet-tap__a"></span>
              <span class="ease-chisel-mallet-tap__b"></span>
              <span class="ease-chisel-mallet-tap__c"></span>
              <span class="ease-chisel-mallet-tap__d"></span>
            </div>
            <div class="ease-chisel-mallet-tap__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-chisel-mallet-tap__controls">
          <button type="button" class="ease-chisel-mallet-tap__btn primary">Engage</button>
          <button type="button" class="ease-chisel-mallet-tap__btn">Reset</button>
          <label class="ease-chisel-mallet-tap__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-chisel-mallet-tap__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
