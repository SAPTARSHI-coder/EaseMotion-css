<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EaseMotion CSS - Floating Label Input</title>
  <link rel="stylesheet" href="../../core/easemotion.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header class="ease-fade-in">
      <h1>Floating Label Input</h1>
      <p class="subtitle">Material Design style floating labels with pure CSS</p>
    </header>

    <main class="ease-slide-up">
      <!-- Basic Form -->
      <section class="demo-section">
        <h2>Contact Form</h2>
        <form class="floating-form">
          <div class="ease-input-container">
            <input type="text" class="ease-input-field" placeholder=" " id="fullname" required>
            <label class="ease-input-label" for="fullname">Full Name</label>
          </div>
          
          <div class="ease-input-container">
            <input type="email" class="ease-input-field" placeholder=" " id="email" required>
            <label class="ease-input-label" for="email">Email Address</label>
          </div>
          
          <div class="ease-input-container">
            <input type="tel" class="ease-input-field" placeholder=" " id="phone">
            <label class="ease-input-label" for="phone">Phone Number</label>
          </div>
          
          <div class="ease-input-container">
            <input type="password" class="ease-input-field" placeholder=" " id="password" required>
            <label class="ease-input-label" for="password">Password</label>
          </div>
          
          <button type="submit" class="submit-btn">Submit</button>
        </form>
      </section>

      <!-- Color Variants -->
      <section class="demo-section">
        <h2>Color Variants</h2>
        <div class="variants-row">
          <div class="ease-input-container ease-input-primary">
            <input type="text" class="ease-input-field" placeholder=" " id="primary">
            <label class="ease-input-label" for="primary">Primary</label>
          </div>
          
          <div class="ease-input-container ease-input-success">
            <input type="text" class="ease-input-field" placeholder=" " id="success">
            <label class="ease-input-label" for="success">Success</label>
          </div>
          
          <div class="ease-input-container ease-input-error">
            <input type="text" class="ease-input-field" placeholder=" " id="error">
            <label class="ease-input-label" for="error">Error</label>
          </div>
        </div>
      </section>

      <!-- Pre-filled State Demo -->
      <section class="demo-section">
        <h2>Pre-filled State</h2>
        <div class="ease-input-container">
          <input type="text" class="ease-input-field" placeholder=" " id="prefilled" value="John Doe">
          <label class="ease-input-label" for="prefilled">Full Name</label>
        </div>
      </section>
    </main>

    <footer class="ease-fade-in">
      <p>Uses :focus and :not(:placeholder-shown) for pure CSS animation</p>
    </footer>
  </div>
</body>
</html>
