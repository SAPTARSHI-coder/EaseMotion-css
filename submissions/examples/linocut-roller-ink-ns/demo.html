<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Linocut Roller Ink — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Linocut Roller Ink demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Linocut Roller Ink</h1>
      <p class="lede">Linocut ink roller charging the block</p>
    </header>

    <section class="ease-linocut-roller-ink" data-demo="linocut-roller-ink" aria-live="polite">
      <div class="ease-linocut-roller-ink__housing">
        <div class="ease-linocut-roller-ink__bezel">
          <div class="ease-linocut-roller-ink__face">
            <div class="ease-linocut-roller-ink__readout">
              <span class="ease-linocut-roller-ink__label">Linocut Roller Ink</span>
              <span class="ease-linocut-roller-ink__value">LIVE</span>
            </div>
            <div class="ease-linocut-roller-ink__motion" aria-hidden="true">
              <span class="ease-linocut-roller-ink__a"></span>
              <span class="ease-linocut-roller-ink__b"></span>
              <span class="ease-linocut-roller-ink__c"></span>
              <span class="ease-linocut-roller-ink__d"></span>
            </div>
            <div class="ease-linocut-roller-ink__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-linocut-roller-ink__controls">
          <button type="button" class="ease-linocut-roller-ink__btn primary">Engage</button>
          <button type="button" class="ease-linocut-roller-ink__btn">Reset</button>
          <label class="ease-linocut-roller-ink__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-linocut-roller-ink__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
