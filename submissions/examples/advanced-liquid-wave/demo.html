<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Liquid wave audio visualizer component"
  >
  <title>Liquid Wave Audio Visualizer</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="visualizer-container">

    <section class="visualizer-card" aria-label="Audio visualizer">

      <div class="header">
        <div>
          <span class="status">
            <span class="status-dot"></span>
            NOW PLAYING
          </span>

          <h1>Liquid Waves</h1>
          <p>Ambient Audio Experience</p>
        </div>

        <div class="time">
          <span id="current-time">00:00</span>
          <span>/ 03:42</span>
        </div>
      </div>

      <div class="waveform" id="waveform" aria-hidden="true">
        <span style="--height: 30%"></span>
        <span style="--height: 55%"></span>
        <span style="--height: 40%"></span>
        <span style="--height: 75%"></span>
        <span style="--height: 48%"></span>
        <span style="--height: 85%"></span>
        <span style="--height: 62%"></span>
        <span style="--height: 92%"></span>
        <span style="--height: 45%"></span>
        <span style="--height: 72%"></span>
        <span style="--height: 58%"></span>
        <span style="--height: 88%"></span>
        <span style="--height: 35%"></span>
        <span style="--height: 65%"></span>
        <span style="--height: 95%"></span>
        <span style="--height: 52%"></span>
        <span style="--height: 78%"></span>
        <span style="--height: 42%"></span>
        <span style="--height: 90%"></span>
        <span style="--height: 55%"></span>
        <span style="--height: 70%"></span>
        <span style="--height: 38%"></span>
        <span style="--height: 82%"></span>
        <span style="--height: 50%"></span>
        <span style="--height: 68%"></span>
        <span style="--height: 43%"></span>
        <span style="--height: 86%"></span>
        <span style="--height: 58%"></span>
        <span style="--height: 76%"></span>
        <span style="--height: 46%"></span>
        <span style="--height: 90%"></span>
        <span style="--height: 52%"></span>
        <span style="--height: 72%"></span>
        <span style="--height: 40%"></span>
        <span style="--height: 82%"></span>
        <span style="--height: 60%"></span>
        <span style="--height: 94%"></span>
        <span style="--height: 48%"></span>
        <span style="--height: 74%"></span>
      </div>

      <div class="progress">
        <span id="progress-bar"></span>
      </div>

      <div class="controls">

        <button class="control-button" aria-label="Previous">
          &#9664;&#9664;
        </button>

        <button
          class="play-button"
          id="play-button"
          aria-label="Play audio visualizer"
          aria-pressed="false"
        >
          <span id="play-icon">&#9654;</span>
        </button>

        <button class="control-button" aria-label="Next">
          &#9654;&#9654;
        </button>

      </div>

    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
