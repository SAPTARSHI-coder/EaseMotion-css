<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prism Split – Content Splits into Rainbow Colors</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <h1>🌈 Prism Split</h1>
    <p class="subtitle">Content splits into rainbow colors on interaction</p>

    <div class="prism-container">
      <div class="prism-stage" id="prismStage">
        <div class="prism-content" id="prismContent">
          <div class="content-wrapper">
            <div class="prism-icon">✦</div>
            <h2 class="prism-title">Prism</h2>
            <p class="prism-text">Hover or click to split into rainbow</p>
            <div class="prism-decoration"></div>
          </div>
        </div>
        
        <!-- Rainbow split layers -->
        <div class="rainbow-layers" id="rainbowLayers">
          <div class="layer layer-1" style="--hue: 0deg; --delay: 0s">
            <span class="layer-char">P</span>
          </div>
          <div class="layer layer-2" style="--hue: 30deg; --delay: 0.05s">
            <span class="layer-char">r</span>
          </div>
          <div class="layer layer-3" style="--hue: 60deg; --delay: 0.1s">
            <span class="layer-char">i</span>
          </div>
          <div class="layer layer-4" style="--hue: 90deg; --delay: 0.15s">
            <span class="layer-char">s</span>
          </div>
          <div class="layer layer-5" style="--hue: 120deg; --delay: 0.2s">
            <span class="layer-char">m</span>
          </div>
          <div class="layer layer-6" style="--hue: 150deg; --delay: 0.25s">
            <span class="layer-char">✦</span>
          </div>
          <div class="layer layer-7" style="--hue: 180deg; --delay: 0.3s">
            <span class="layer-char">S</span>
          </div>
          <div class="layer layer-8" style="--hue: 210deg; --delay: 0.35s">
            <span class="layer-char">p</span>
          </div>
          <div class="layer layer-9" style="--hue: 240deg; --delay: 0.4s">
            <span class="layer-char">l</span>
          </div>
          <div class="layer layer-10" style="--hue: 270deg; --delay: 0.45s">
            <span class="layer-char">i</span>
          </div>
          <div class="layer layer-11" style="--hue: 300deg; --delay: 0.5s">
            <span class="layer-char">t</span>
          </div>
        </div>
        
        <!-- Info overlay -->
        <div class="info-overlay">
          <span class="prism-status" id="prismStatus">🌈 Intact</span>
          <span class="split-status" id="splitStatus">Split: 0%</span>
        </div>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <button class="ctrl-btn split" id="splitBtn">🌈 Split</button>
      <button class="ctrl-btn merge" id="mergeBtn">🔆 Merge</button>
      <button class="ctrl-btn toggle" id="toggleBtn">🔄 Toggle</button>
      <button class="ctrl-btn reset" id="resetBtn">↺ Reset</button>
    </div>

    <!-- Sliders -->
    <div class="slider-container">
      <span class="slider-label">Split Amount</span>
      <input type="range" id="splitSlider" min="0" max="100" value="0" />
      <span class="slider-value" id="splitValue">0%</span>
    </div>

    <div class="slider-container">
      <span class="slider-label">Spread</span>
      <input type="range" id="spreadSlider" min="20" max="100" value="60" />
      <span class="slider-value" id="spreadValue">60%</span>
    </div>

    <div class="slider-container">
      <span class="slider-label">Speed</span>
      <input type="range" id="speedSlider" min="1" max="10" value="5" />
      <span class="slider-value" id="speedValue">5×</span>
    </div>

    <!-- Status -->
    <div class="status" id="status">🌈 Hover or click the content to split into rainbow</div>

    <!-- Keyboard shortcuts -->
    <div class="shortcuts">
      <kbd>Hover</kbd> Split · <kbd>S</kbd> Split · <kbd>M</kbd> Merge · <kbd>T</kbd> Toggle
    </div>
  </div>

  <script>
    (function() {
      "use strict";

      // DOM elements
      const prismContent = document.getElementById('prismContent');
      const rainbowLayers = document.getElementById('rainbowLayers');
      const prismStatus = document.getElementById('prismStatus');
      const splitStatus = document.getElementById('splitStatus');
      const splitBtn = document.getElementById('splitBtn');
      const mergeBtn = document.getElementById('mergeBtn');
      const toggleBtn = document.getElementById('toggleBtn');
      const resetBtn = document.getElementById('resetBtn');
      const status = document.getElementById('status');
      const splitSlider = document.getElementById('splitSlider');
      const splitValue = document.getElementById('splitValue');
      const spreadSlider = document.getElementById('spreadSlider');
      const spreadValue = document.getElementById('spreadValue');
      const speedSlider = document.getElementById('speedSlider');
      const speedValue = document.getElementById('speedValue');

      // State
      let splitAmount = 0; // 0 = intact, 100 = fully split
      let targetSplit = 0;
      let isHovering = false;
      let isSplit = false;
      let animationId = null;
      let time = 0;

      // ----- Update prism split -----
      function updatePrism() {
        const split = splitAmount / 100;
        const spread = parseInt(spreadSlider.value) / 100;
        const speed = parseInt(speedSlider.value) / 5;

        // Update rainbow layers
        const layers = rainbowLayers.querySelectorAll('.layer');
        const totalLayers = layers.length;
        
        layers.forEach((layer, i) => {
          const progress = i / totalLayers;
          const offset = (i / totalLayers - 0.5) * 2;
          const spreadAmount = spread * 200 * split;
          
          // Position each layer based on split amount
          const x = offset * spreadAmount;
          const y = Math.sin(offset * 2 + time * 0.5) * 5 * split;
          const rot = offset * 10 * split;
          const scale = 1 - split * 0.1 * (0.5 + 0.5 * Math.abs(offset));
          const opacity = 0.3 + 0.7 * split * (0.5 + 0.5 * (1 - Math.abs(offset)));
          
          layer.style.transform = `translate(${x}px, ${y}px) rotate(${rot}deg) scale(${scale})`;
          layer.style.opacity = opacity;
          layer.style.transition = `all ${0.1 / speed}s ease`;
          
          // Color shifting
          const hue = parseInt(layer.style.getPropertyValue('--hue')) + split * 20;
          layer.style.setProperty('--hue', hue + 'deg');
          layer.style.color = `hsl(${hue}, 100%, 60%)`;
        });

        // Update prism content opacity
        prismContent.style.opacity = 1 - split * 0.8;
        prismContent.style.transform = `scale(${1 - split * 0.1})`;
        prismContent.style.filter = `blur(${split * 4}px)`;

        // Update status
        splitStatus.textContent = `Split: ${Math.round(splitAmount)}%`;
        splitValue.textContent = Math.round(splitAmount) + '%';

        if (splitAmount < 10) {
          prismStatus.textContent = '🌈 Intact';
          if (!isHovering) {
            status.textContent = '🌈 Hover or click the content to split into rainbow';
          }
        } else if (splitAmount < 50) {
          prismStatus.textContent = '🌈 Splitting...';
          status.textContent = '🌈 Content splitting into rainbow colors!';
        } else if (splitAmount < 90) {
          prismStatus.textContent = '🌈 Rainbow Split';
          status.textContent = '🌈 Rainbow split in progress...';
        } else {
          prismStatus.textContent = '🌈 Fully Split';
          status.textContent = '🌈 Content fully split into rainbow spectrum!';
        }

        // Update split state
        isSplit = splitAmount > 50;
      }

      // ----- Animation loop -----
      function animate() {
        time += 0.016;

        // Smooth interpolation for split amount
        const diff = targetSplit - splitAmount;
        if (Math.abs(diff) > 0.1) {
          const speed = parseInt(speedSlider.value) / 5;
          splitAmount += diff * 0.04 * speed;
        } else {
          splitAmount = targetSplit;
        }

        splitAmount = Math.max(0, Math.min(100, splitAmount));
        updatePrism();
        animationId = requestAnimationFrame(animate);
      }

      // ----- Start animation -----
      function startAnimation() {
        if (animationId) {
          cancelAnimationFrame(animationId);
        }
        animate();
      }

      // ----- Set split amount -----
      function setSplit(value) {
        targetSplit = Math.max(0, Math.min(100, value));
        splitSlider.value = targetSplit;
        splitValue.textContent = Math.round(targetSplit) + '%';
      }

      // ----- Split content -----
      function splitContent() {
        setSplit(100);
        status.textContent = '🌈 Splitting content into rainbow!';
        prismStatus.textContent = '🌈 Splitting...';
        setTimeout(() => {
          if (targetSplit >= 100) {
            prismStatus.textContent = '🌈 Fully Split';
          }
        }, 500);
      }

      // ----- Merge content -----
      function mergeContent() {
        setSplit(0);
        status.textContent = '🔆 Merging rainbow back together...';
        prismStatus.textContent = '🌈 Merging...';
        setTimeout(() => {
          if (targetSplit <= 0) {
            prismStatus.textContent = '🌈 Intact';
            status.textContent = '🌈 Hover or click the content to split into rainbow';
          }
        }, 500);
      }

      // ----- Toggle -----
      function toggleSplit() {
        if (splitAmount > 50) {
          mergeContent();
        } else {
          splitContent();
        }
      }

      // ----- Reset -----
      function resetPrism() {
        setSplit(0);
        spreadSlider.value = 60;
        spreadValue.textContent = '60%';
        speedSlider.value = 5;
        speedValue.textContent = '5×';
        prismStatus.textContent = '🌈 Intact';
        status.textContent = '↺ Reset';
        setTimeout(() => {
          status.textContent = '🌈 Hover or click the content to split into rainbow';
        }, 500);
      }

      // ----- Event Listeners -----
      // Hover effects
      prismContent.addEventListener('mouseenter', () => {
        isHovering = true;
        splitContent();
      });

      prismContent.addEventListener('mouseleave', () => {
        isHovering = false;
        mergeContent();
      });

      // Click to toggle
      prismContent.addEventListener('click', toggleSplit);

      // Touch support
      prismContent.addEventListener('touchstart', (e) => {
        e.preventDefault();
        toggleSplit();
      });

      // Buttons
      splitBtn.addEventListener('click', splitContent);
      mergeBtn.addEventListener('click', mergeContent);
      toggleBtn.addEventListener('click', toggleSplit);
      resetBtn.addEventListener('click', resetPrism);

      // Sliders
      splitSlider.addEventListener('input', (e) => {
        const val = parseFloat(e.target.value);
        setSplit(val);
        status.textContent = `🌈 Split: ${Math.round(val)}%`;
      });

      spreadSlider.addEventListener('input', (e) => {
        spreadValue.textContent = e.target.value + '%';
        updatePrism();
      });

      speedSlider.addEventListener('input', (e) => {
        speedValue.textContent = e.target.value + '×';
      });

      // Keyboard shortcuts
      document.addEventListener('keydown', (e) => {
        if (e.key === 's' || e.key === 'S') {
          e.preventDefault();
          splitContent();
        }
        if (e.key === 'm' || e.key === 'M') {
          e.preventDefault();
          mergeContent();
        }
        if (e.key === 't' || e.key === 'T') {
          e.preventDefault();
          toggleSplit();
        }
        if (e.key === 'r' || e.key === 'R') {
          e.preventDefault();
          resetPrism();
        }
        if (e.key === ' ' || e.key === 'Space') {
          e.preventDefault();
          toggleSplit();
        }
      });

      // ----- Resize handler -----
      let resizeTimeout;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(() => {
          // Just reflow
        }, 200);
      });

      // ----- Init -----
      function init() {
        setSplit(0);
        startAnimation();
        status.textContent = '🌈 Hover or click the content to split into rainbow!';
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }

    })();
  </script>
</body>
</html>
