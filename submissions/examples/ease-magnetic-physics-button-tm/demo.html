<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Magnetic Physics Button | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="mpbwrap">
    <div class="mpbzone" id="zone">
      <span class="mpbhint">Move cursor near button</span>
      <button class="mpbbtn" type="button" id="magnet">HOVER ME</button>
    </div>
  </div>
  <script>
    const zone = document.getElementById('zone');
    const btn = document.getElementById('magnet');
    const rect = () => btn.getBoundingClientRect();
    zone.addEventListener('mousemove', (e) => {
      const r = rect();
      const cx = r.left + r.width / 2;
      const cy = r.top + r.height / 2;
      const dx = e.clientX - cx;
      const dy = e.clientY - cy;
      const distance = Math.sqrt(dx*dx + dy*dy);
      const range = 200;
      if (distance < range) {
        const force = (range - distance) / range * 0.3;
        btn.style.transform = `translate(${dx * force}px, ${dy * force}px)`;
      } else {
        btn.style.transform = 'translate(0, 0)';
      }
    });
    zone.addEventListener('mouseleave', () => {
      btn.style.transform = 'translate(0, 0)';
    });
  </script>
</body>
</html>
