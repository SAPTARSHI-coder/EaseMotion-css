<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CSS Rain Drop Animation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <header class="hero">
      <p class="eyebrow">EaseMotion CSS · #68532</p>
      <h1>Rain drop animation</h1>
      <p>Layered CSS raindrops fall across a calm scene and trigger visual ripple rings when they reach the ground.</p>
    </header>
    <section class="scene" aria-label="Animated rain scene">
      <div class="cloud cloud-a"></div>
      <div class="cloud cloud-b"></div>
      <div class="rain" aria-hidden="true">
        <i class="drop d1"></i><i class="drop d2"></i><i class="drop d3"></i><i class="drop d4"></i><i class="drop d5"></i>
        <i class="drop d6"></i><i class="drop d7"></i><i class="drop d8"></i><i class="drop d9"></i><i class="drop d10"></i>
        <i class="drop d11"></i><i class="drop d12"></i><i class="drop d13"></i><i class="drop d14"></i><i class="drop d15"></i>
      </div>
      <div class="ground" aria-hidden="true"><span class="ripple r1"></span><span class="ripple r2"></span><span class="ripple r3"></span></div>
      <p class="status"><span></span> Light rain · CSS animation</p>
    </section>
  </main>
</body>
</html>
