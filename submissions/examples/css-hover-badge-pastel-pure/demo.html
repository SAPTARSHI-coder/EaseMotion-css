<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pastel Hover Badges</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="badges-container">
        <!-- Pastel Pink Badge -->
        <a href="#" class="pastel-badge badge-pink">
            <span class="badge-icon">💖</span>
            <span class="badge-text">Favorites</span>
            <span class="badge-count">12</span>
        </a>

        <!-- Pastel Mint Badge -->
        <a href="#" class="pastel-badge badge-mint">
            <span class="badge-icon">🍃</span>
            <span class="badge-text">Eco Friendly</span>
        </a>

        <!-- Pastel Blue Badge -->
        <a href="#" class="pastel-badge badge-blue">
            <span class="badge-icon">☁️</span>
            <span class="badge-text">Cloud Sync</span>
            <span class="badge-status"></span>
        </a>

        <!-- Pastel Yellow Badge -->
        <a href="#" class="pastel-badge badge-yellow">
            <span class="badge-icon">✨</span>
            <span class="badge-text">Premium</span>
        </a>
    </div>

</body>
</html>
