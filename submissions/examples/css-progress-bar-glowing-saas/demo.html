<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glowing SaaS Progress Bar</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

    <main class="dashboard-widget">
        
        <div class="widget-header">
            <h2 class="widget-title">Monthly Quota</h2>
            <span class="widget-percentage" id="progress-text">75%</span>
        </div>
        
        <p class="widget-subtitle">Storage utilized this billing cycle</p>

        <!-- Progress Bar Component -->
        <div class="progress-container" role="progressbar" aria-valuenow="75" aria-valuemin="0" aria-valuemax="100" aria-label="Storage quota usage">
            <div class="progress-track">
                <!-- The glowing fill -->
                <div class="progress-fill" style="width: 75%;">
                    <!-- Internal shine animation -->
                    <div class="progress-shine"></div>
                </div>
            </div>
            <!-- Dynamic Glow Layer (Placed behind the track using absolute positioning) -->
            <div class="progress-glow" style="width: 75%;"></div>
        </div>

        <div class="widget-footer">
            <span>750 GB</span>
            <span>1,000 GB</span>
        </div>

    </main>

</body>
</html>
