<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Elastic-Slide Progress Bar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<section class="container">

    <div class="hero">

        <span class="tag">Creative Portfolio</span>

        <h1>Professional Skills Overview</h1>

        <p>
            Showcase portfolio skills using modern Elastic-Slide progress bars
            featuring smooth CSS animations, glassmorphism styling, and
            responsive layouts.
        </p>

    </div>

    <div class="progress-wrapper">

        <div class="skill">

            <div class="label">
                <span>UI / UX Design</span>
                <span>95%</span>
            </div>

            <div class="progress">
                <div class="fill html"></div>
            </div>

        </div>

        <div class="skill">

            <div class="label">
                <span>Frontend Development</span>
                <span>90%</span>
            </div>

            <div class="progress">
                <div class="fill css"></div>
            </div>

        </div>

        <div class="skill">

            <div class="label">
                <span>Motion Design</span>
                <span>85%</span>
            </div>

            <div class="progress">
                <div class="fill js"></div>
            </div>

        </div>

        <div class="skill">

            <div class="label">
                <span>Brand Identity</span>
                <span>80%</span>
            </div>

            <div class="progress">
                <div class="fill react"></div>
            </div>

        </div>

    </div>

</section>

</body>
</html>
