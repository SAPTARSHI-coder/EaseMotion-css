<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hermetic Seal Clamp — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Hermetic Seal Clamp demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Hermetic Seal Clamp</h1>
      <p class="lede">Lab hermetic clamp sealing a vacuum flange</p>
    </header>

    <section class="ease-hermetic-seal-clamp" data-demo="hermetic-seal-clamp" aria-live="polite">
      <div class="ease-hermetic-seal-clamp__housing">
        <div class="ease-hermetic-seal-clamp__bezel">
          <div class="ease-hermetic-seal-clamp__face">
            <div class="ease-hermetic-seal-clamp__readout">
              <span class="ease-hermetic-seal-clamp__label">Hermetic Seal Clamp</span>
              <span class="ease-hermetic-seal-clamp__value">LIVE</span>
            </div>
            <div class="ease-hermetic-seal-clamp__motion" aria-hidden="true">
              <span class="ease-hermetic-seal-clamp__a"></span>
              <span class="ease-hermetic-seal-clamp__b"></span>
              <span class="ease-hermetic-seal-clamp__c"></span>
              <span class="ease-hermetic-seal-clamp__d"></span>
            </div>
            <div class="ease-hermetic-seal-clamp__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-hermetic-seal-clamp__controls">
          <button type="button" class="ease-hermetic-seal-clamp__btn primary">Engage</button>
          <button type="button" class="ease-hermetic-seal-clamp__btn">Reset</button>
          <label class="ease-hermetic-seal-clamp__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-hermetic-seal-clamp__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
