<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="CSS-only animated hermetic seal clamp for a laboratory vacuum flange"
  >
  <title>Ease Hermetic Seal Clamp</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="showcase">
    <p class="eyebrow">EASEMOTION CSS</p>
    <h1>Hermetic Seal Clamp</h1>
    <p class="intro">
      A CSS-only laboratory control showing a vacuum flange being mechanically
      clamped and sealed.
    </p>

    <section
      class="ease-hermetic-seal-clamp"
      aria-label="Laboratory hermetic seal clamp"
    >
      <div class="equipment-housing">

        <header class="housing-header">
          <div>
            <span class="lab-name">VACUUM LAB</span>
            <span class="equipment-name">FLANGE SEALING UNIT</span>
          </div>

          <div class="status">
            <span class="status-light"></span>
            <span>SEAL READY</span>
          </div>
        </header>

        <div class="work-area">

          <div class="pressure-gauge">
            <span class="gauge-label">VACUUM</span>

            <div class="gauge">
              <div class="gauge-scale">
                <span>-1.0</span>
                <span>-0.5</span>
                <span>0</span>
              </div>

              <div class="gauge-needle"></div>
              <div class="gauge-center"></div>
            </div>

            <span class="gauge-unit">BAR</span>
          </div>

          <div class="flange-system">

            <div class="clamp-arm clamp-left">
              <span class="arm-bolt"></span>
            </div>

            <div class="clamp-arm clamp-right">
              <span class="arm-bolt"></span>
            </div>

            <div class="flange">
              <span class="bolt bolt-1"></span>
              <span class="bolt bolt-2"></span>
              <span class="bolt bolt-3"></span>
              <span class="bolt bolt-4"></span>
              <span class="bolt bolt-5"></span>
              <span class="bolt bolt-6"></span>

              <div class="seal-ring">
                <span class="seal-label">VACUUM FLANGE</span>
                <strong>SEALED</strong>
              </div>
            </div>

            <div class="vacuum-port">
              <span></span>
            </div>

          </div>

          <div class="control-panel">

            <div class="indicator">
              <span class="indicator-light active"></span>
              <span>PRESSURE</span>
            </div>

            <div class="control-dial">
              <span class="dial-mark top"></span>
              <span class="dial-mark right"></span>
              <span class="dial-mark bottom"></span>
              <span class="dial-mark left"></span>
              <span class="dial-pointer"></span>
              <span class="dial-center"></span>
            </div>

            <div class="indicator locked">
              <span class="indicator-light"></span>
              <span>LOCKED</span>
            </div>

          </div>
        </div>

        <footer class="housing-footer">
          <span>HERMETIC CLAMP CONTROL</span>
          <span>UNIT HC-07</span>
        </footer>

      </div>
    </section>

    <p class="hint">CSS animation • No JavaScript</p>
  </main>
</body>
</html>
