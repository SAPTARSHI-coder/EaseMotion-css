<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fitness Workout Card | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="fitwrap">
    <div class="fitcard">
      <div class="fithead">
        <h2 class="fittitle">Morning Run</h2>
        <span class="fitbadge">Active</span>
      </div>
      <div class="fitring">
        <svg class="fitsvg" viewBox="0 0 200 200">
          <defs>
            <linearGradient id="fitgradient" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#22c55e"/>
              <stop offset="100%" stop-color="#06b6d4"/>
            </linearGradient>
          </defs>
          <circle class="fitbg" cx="100" cy="100" r="90"/>
          <circle class="fitprogress" cx="100" cy="100" r="90"/>
        </svg>
        <div class="fitpct">
          <span class="fitnum">70%</span>
          <span class="fitpctlabel">Complete</span>
        </div>
      </div>
      <div class="fitstats">
        <div>
          <span class="fitstat-val">4.2</span>
          <span class="fitstat-label">km</span>
        </div>
        <div>
          <span class="fitstat-val">28</span>
          <span class="fitstat-label">min</span>
        </div>
        <div>
          <span class="fitstat-val">320</span>
          <span class="fitstat-label">kcal</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
