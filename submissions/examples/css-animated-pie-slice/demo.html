<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Animated Pie Slice — Showcase</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="ease-container">
    <p class="ease-eyebrow">Data Analytics</p>
    <h1 class="ease-heading">Animated Pie Slice</h1>
    <p class="ease-subtitle">Pure CSS single pie slice animating its fill angle from 0% to target value on page load.</p>

    <div class="ease-pie-card">
      <div 
        class="ease-pie-wrapper" 
        role="progressbar" 
        aria-valuenow="65" 
        aria-valuemin="0" 
        aria-valuemax="100" 
        aria-label="Market share slice completion"
      >
        <div class="ease-pie-chart"></div>
        <div class="ease-pie-center-badge">
          <span class="ease-pie-value">65%</span>
          <span class="ease-pie-label">Share</span>
        </div>
      </div>

      <div class="ease-pie-info">
        <p class="ease-info-title">Organic Conversion</p>
        <p class="ease-info-sub">65% of total traffic attributed to direct search</p>
      </div>
    </div>
  </main>
</body>
</html>
