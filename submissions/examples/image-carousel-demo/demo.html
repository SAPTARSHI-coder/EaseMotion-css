<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EaseMotion — Image Carousel</title>
  <link rel="stylesheet" href="../../core/variables.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="demo-container">
    <h1>Image Carousel</h1>
    <p>Swipeable image carousel with dot indicators.</p>

    <div class="carousel-card">
      <div class="carousel-track" id="track">
        <div class="slide" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
          <span>Slide 1</span>
        </div>
        <div class="slide" style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);">
          <span>Slide 2</span>
        </div>
        <div class="slide" style="background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);">
          <span>Slide 3</span>
        </div>
        <div class="slide" style="background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);">
          <span>Slide 4</span>
        </div>
      </div>
      <button class="carousel-btn prev" onclick="moveSlide(-1)">‹</button>
      <button class="carousel-btn next" onclick="moveSlide(1)">›</button>
      <div class="dots" id="dots"></div>
    </div>
  </div>
  <script>
    let current = 0;
    const total = 4;
    const track = document.getElementById('track');
    const dotsContainer = document.getElementById('dots');

    for (let i = 0; i < total; i++) {
      const dot = document.createElement('span');
      dot.className = 'dot' + (i === 0 ? ' active' : '');
      dot.onclick = () => goToSlide(i);
      dotsContainer.appendChild(dot);
    }

    function goToSlide(n) {
      current = n;
      track.style.transform = `translateX(-${current * 100}%)`;
      document.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('active', i === current));
    }

    function moveSlide(dir) {
      goToSlide((current + dir + total) % total);
    }

    setInterval(() => moveSlide(1), 4000);
  </script>
</body>
</html>
