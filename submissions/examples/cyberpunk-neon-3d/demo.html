<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Cyberpunk Neon 3D CSS animation component"
  >
  <title>Cyberpunk Neon 3D</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="demo-container">
    <section class="cyber-card" aria-labelledby="cyber-title">
      <div class="cyber-grid" aria-hidden="true"></div>

      <div class="card-content">
        <span class="status">SYSTEM ONLINE</span>

        <h1 id="cyber-title">CYBER<br>CORE</h1>

        <p>
          A futuristic 3D neon interface built entirely
          with HTML and vanilla CSS.
        </p>

        <button type="button" class="cyber-button">
          ACCESS
        </button>
      </div>

      <div class="scan-line" aria-hidden="true"></div>
    </section>
  </main>
</body>
</html>
