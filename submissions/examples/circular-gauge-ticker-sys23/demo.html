<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Infinite Circular Progress Gauge with Dynamic Counter Ticker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../easemotion.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>Circular Progress Gauge</h1>
      <p>Animated SVG stroke sweep and numeric counter ticker.</p>
    </header>

    <main class="gauge-card">
      <div class="gauge-container">
        <svg class="gauge-svg" viewBox="0 0 100 100">
          <circle class="gauge-bg" cx="50" cy="50" r="45"></circle>
          <circle class="gauge-progress" cx="50" cy="50" r="45" id="gaugeCircle"></circle>
        </svg>
        <div class="gauge-value" id="gaugeValue">85%</div>
      </div>
    </main>
  </div>
</body>
</html>
