<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Floating Loader - SaaS Modern</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="loader-demo">
    <section class="loader-card" aria-label="Loading content">
      <div class="floating-loader" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
      </div>

      <div class="loader-content">
        <h1>Loading</h1>
        <p>Please wait while we prepare your workspace.</p>
      </div>

      <div class="progress-track" aria-hidden="true">
        <div class="progress-bar"></div>
      </div>
    </section>
  </main>

</body>
</html>
