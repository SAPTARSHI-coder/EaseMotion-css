<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Waffle Iron Press — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Waffle Iron Press demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Waffle Iron Press</h1>
      <p class="lede">Waffle iron lid pressing closed with grid imprint reveal</p>
    </header>

    <section class="ease-waffle-iron-press" data-demo="waffle-iron-press" aria-live="polite">
      <div class="ease-waffle-iron-press__housing">
        <div class="ease-waffle-iron-press__bezel">
          <div class="ease-waffle-iron-press__face">
            <div class="ease-waffle-iron-press__readout">
              <span class="ease-waffle-iron-press__label">Waffle Iron Press</span>
              <span class="ease-waffle-iron-press__value" id="val-waffle-iron-press">READY</span>
            </div>
            <div class="ease-waffle-iron-press__motion" aria-hidden="true">
              <span class="ease-waffle-iron-press__arm"></span>
              <span class="ease-waffle-iron-press__core"></span>
              <span class="ease-waffle-iron-press__trail"></span>
              <span class="ease-waffle-iron-press__mark m1"></span>
              <span class="ease-waffle-iron-press__mark m2"></span>
              <span class="ease-waffle-iron-press__mark m3"></span>
            </div>
            <div class="ease-waffle-iron-press__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-waffle-iron-press__controls">
          <button type="button" class="ease-waffle-iron-press__btn primary">Engage</button>
          <button type="button" class="ease-waffle-iron-press__btn">Reset</button>
          <label class="ease-waffle-iron-press__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-waffle-iron-press__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
