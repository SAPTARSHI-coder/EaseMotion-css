<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ramen Steam Bowl — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Ramen Steam Bowl demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Ramen Steam Bowl</h1>
      <p class="lede">Ramen bowl with rising steam wisps and chopstick settle</p>
    </header>

    <section class="ease-ramen-steam-bowl" data-demo="ramen-steam-bowl" aria-live="polite">
      <div class="ease-ramen-steam-bowl__housing">
        <div class="ease-ramen-steam-bowl__bezel">
          <div class="ease-ramen-steam-bowl__face">
            <div class="ease-ramen-steam-bowl__readout">
              <span class="ease-ramen-steam-bowl__label">Ramen Steam Bowl</span>
              <span class="ease-ramen-steam-bowl__value" id="val-ramen-steam-bowl">READY</span>
            </div>
            <div class="ease-ramen-steam-bowl__motion" aria-hidden="true">
              <span class="ease-ramen-steam-bowl__arm"></span>
              <span class="ease-ramen-steam-bowl__core"></span>
              <span class="ease-ramen-steam-bowl__trail"></span>
              <span class="ease-ramen-steam-bowl__mark m1"></span>
              <span class="ease-ramen-steam-bowl__mark m2"></span>
              <span class="ease-ramen-steam-bowl__mark m3"></span>
            </div>
            <div class="ease-ramen-steam-bowl__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-ramen-steam-bowl__controls">
          <button type="button" class="ease-ramen-steam-bowl__btn primary">Engage</button>
          <button type="button" class="ease-ramen-steam-bowl__btn">Reset</button>
          <label class="ease-ramen-steam-bowl__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-ramen-steam-bowl__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
