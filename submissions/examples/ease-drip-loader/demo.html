<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Drip Loader · Drops Fill Container</title>

    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <div class="card">
        <h2>💧 Drip Loader</h2>
        <p class="sub">drops fall and fill a container</p>

        <!-- === DRIP LOADER === -->
        <div class="drip-container" id="dripContainer">
            <div class="drip-loader">
                <!-- Container -->
                <div class="drip-container-box">
                    <div class="drip-fill" id="dripFill"></div>
                    <div class="drip-wave"></div>
                </div>

                <!-- Drops -->
                <div class="drip-drop drop-1"></div>
                <div class="drip-drop drop-2"></div>
                <div class="drip-drop drop-3"></div>
                <div class="drip-drop drop-4"></div>
                <div class="drip-drop drop-5"></div>
                <div class="drip-drop drop-6"></div>
                <div class="drip-drop drop-7"></div>
                <div class="drip-drop drop-8"></div>

                <!-- Splash particles -->
                <div class="drip-splash splash-1"></div>
                <div class="drip-splash splash-2"></div>
                <div class="drip-splash splash-3"></div>
                <div class="drip-splash splash-4"></div>
                <div class="drip-splash splash-5"></div>
                <div class="drip-splash splash-6"></div>

                <!-- Percentage label -->
                <div class="drip-label" id="dripLabel">0%</div>
            </div>
        </div>

        <p style="margin-top: 2rem; font-size: 0.85rem; color: #64748b;">
            Drops filling container · liquid loading animation
        </p>
    </div>

    <!-- Embedded JavaScript -->
    <script>
        (function() {
            'use strict';

            const container = document.getElementById('dripContainer');
            const fill = document.getElementById('dripFill');
            const label = document.getElementById('dripLabel');
            const drops = document.querySelectorAll('.drip-drop');
            const splashes = document.querySelectorAll('.drip-splash');

            let progress = 0;
            let isAnimating = false;

            // --- Update fill ---
            function updateFill(value) {
                const clampedValue = Math.min(Math.max(value, 0), 100);
                fill.style.height = clampedValue + '%';
                label.textContent = Math.round(clampedValue) + '%';

                // Update wave position
                const wave = document.querySelector('.drip-wave');
                if (wave) {
                    wave.style.top = (100 - clampedValue) + '%';
                }

                // Update fill color based on progress
                if (clampedValue < 30) {
                    fill.style.background = 'linear-gradient(180deg, #4facfe, #0066ff)';
                } else if (clampedValue < 70) {
                    fill.style.background = 'linear-gradient(180deg, #43e97b, #10b981)';
                } else {
                    fill.style.background = 'linear-gradient(180deg, #fa709a, #f43f5e)';
                }

                progress = clampedValue;
            }

            // --- Create drop ---
            function createDrop() {
                const drop = document.createElement('div');
                drop.className = 'drip-drop';
                const x = 15 + Math.random() * 70;
                const size = 6 + Math.random() * 8;
                const delay = Math.random() * 1.5;
                drop.style.left = x + '%';
                drop.style.width = size + 'px';
                drop.style.height = size + 'px';
                drop.style.animationDelay = delay + 's';
                drop.style.setProperty('--drop-delay', delay + 's');
                document.querySelector('.drip-loader').appendChild(drop);

                setTimeout(() => {
                    drop.remove();
                }, 3000 + delay * 1000);
            }

            // --- Add splash effect ---
            function createSplash(x, y) {
                const splash = document.createElement('div');
                splash.className = 'drip-splash';
                const size = 4 + Math.random() * 6;
                const angle = Math.random() * 2 * Math.PI;
                const distance = 20 + Math.random() * 30;
                const vx = Math.cos(angle) * distance;
                const vy = Math.sin(angle) * distance - 10;
                splash.style.width = size + 'px';
                splash.style.height = size + 'px';
                splash.style.left = x + '%';
                splash.style.top = y + '%';
                splash.style.setProperty('--splash-x', vx + 'px');
                splash.style.setProperty('--splash-y', vy + 'px');
                document.querySelector('.drip-loader').appendChild(splash);

                setTimeout(() => {
                    splash.remove();
                }, 800);
            }

            // --- Animate loading ---
            function animateLoading() {
                if (isAnimating) return;
                isAnimating = true;

                let currentProgress = 0;
                const targetProgress = 100;
                const duration = 4000;
                const startTime = performance.now();

                function animate(time) {
                    const elapsed = time - startTime;
                    const t = Math.min(elapsed / duration, 1);
                    // Ease in-out cubic
                    const eased = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
                    currentProgress = eased * targetProgress;

                    updateFill(currentProgress);

                    // Create drops periodically
                    if (currentProgress < 90 && Math.random() < 0.3) {
                        createDrop();
                    }

                    // Create splashes at bottom
                    if (currentProgress > 5 && Math.random() < 0.1) {
                        const x = 20 + Math.random() * 60;
                        const y = 95 - Math.random() * 10;
                        createSplash(x, y);
                    }

                    if (t < 1) {
                        requestAnimationFrame(animate);
                    } else {
                        updateFill(100);
                        isAnimating = false;
                        // Show completion
                        console.log('💧 Drip loader complete!');
                    }
                }

                requestAnimationFrame(animate);
            }

            // --- Reset ---
            function resetLoader() {
                if (isAnimating) return;
                updateFill(0);
                // Remove all drops and splashes
                document.querySelectorAll('.drip-drop, .drip-splash').forEach(el => {
                    if (!el.classList.contains('drop-1') && !el.classList.contains('splash-1')) {
                        el.remove();
                    }
                });
                // Reset initial drops
                document.querySelectorAll('.drop-1, .drop-2, .drop-3, .drop-4, .drop-5, .drop-6, .drop-7, .drop-8').forEach(el => {
                    el.style.animation = 'none';
                    void el.offsetWidth;
                    el.style.animation = '';
                });
                console.log('💧 Drip loader reset');
            }

            // --- Event Listeners ---

            // Click to restart
            container.addEventListener('click', function() {
                resetLoader();
                setTimeout(() => {
                    animateLoading();
                }, 300);
                this.classList.add('click-pulse');
                setTimeout(() => {
                    this.classList.remove('click-pulse');
                }, 300);
            });

            // Keyboard accessibility
            container.setAttribute('tabindex', '0');
            container.setAttribute('role', 'button');
            container.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    this.click();
                }
            });

            // --- Auto-start on load ---
            setTimeout(() => {
                animateLoading();
            }, 500);

            console.log('💧 Drip loader initialized!');

        })();
    </script>

</body>
</html>
