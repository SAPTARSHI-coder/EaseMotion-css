<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        Ripple-Wave Tabs SaaS Showcase
    </title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<main class="container">


    <section class="hero">

        <span class="badge">
            SAAS COMPONENT
        </span>


        <h1>
            Ripple-Wave Tabs
        </h1>


        <p>
            Animated CSS tabs with smooth ripple wave interactions.
        </p>

    </section>




    <section class="tabs-container">


        <div class="tabs">


            <div class="tab active">

                <span class="ripple"></span>

                Dashboard

            </div>



            <div class="tab">

                <span class="ripple"></span>

                Analytics

            </div>



            <div class="tab">

                <span class="ripple"></span>

                Reports

            </div>



            <div class="tab">

                <span class="ripple"></span>

                Settings

            </div>


        </div>



        <article class="content-card">


            <h2>
                SaaS Dashboard
            </h2>


            <p>
                Manage your products, insights and
                business workflows with a modern interface.
            </p>


        </article>


    </section>


</main>


</body>

</html>
