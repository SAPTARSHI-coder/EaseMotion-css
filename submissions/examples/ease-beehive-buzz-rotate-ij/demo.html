<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-beehive-buzz-rotate demo</title>
</head>
<body>
<div class="bh-app">
  <div class="bh-sky">
    <div class="bh-sun"></div>
    <div class="bh-branch"></div>
  </div>
  <div class="bh-rope"></div>
  <div class="bh-hive">
    <div class="bh-comb bh-comb-1"></div>
    <div class="bh-comb bh-comb-2"></div>
    <div class="bh-comb bh-comb-3"></div>
    <div class="bh-comb bh-comb-4"></div>
    <div class="bh-comb bh-comb-5"></div>
  </div>
  <div class="bh-drip"></div>
  <span class="bh-bee bh-bee-1">
    <span class="bh-wing"></span>
  </span>
  <span class="bh-bee bh-bee-2">
    <span class="bh-wing"></span>
  </span>
  <span class="bh-bee bh-bee-3">
    <span class="bh-wing"></span>
  </span>
</div>
</body>
</html>
