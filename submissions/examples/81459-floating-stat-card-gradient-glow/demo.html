<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Floating stat card with animated gradient glow styling built with pure CSS."
  >

  <title>Floating Stat Card — Gradient Glow</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="page">

    <section
      class="stats-section"
      aria-labelledby="stats-title"
    >

      <header class="stats-heading">
        <span class="stats-heading__eyebrow">
          PERFORMANCE OVERVIEW
        </span>

        <h1 id="stats-title">
          Product analytics
        </h1>

        <p>
          A floating stat card with a soft animated gradient glow.
        </p>
      </header>

      <div class="stat-card">

        <div class="stat-card__glow" aria-hidden="true"></div>

        <div class="stat-card__top">

          <div class="stat-card__icon" aria-hidden="true">
            ↗
          </div>

          <span class="stat-card__badge">
            +12.8%
          </span>

        </div>

        <div class="stat-card__content">

          <span class="stat-card__label">
            Monthly Revenue
          </span>

          <strong class="stat-card__value">
            $84,290
          </strong>

          <p class="stat-card__description">
            Compared with $74,720 last month
          </p>

        </div>

        <div
          class="stat-card__progress"
          aria-label="Revenue progress: 84 percent"
        >
          <span
            class="stat-card__progress-fill"
            style="--progress: 84%;"
          ></span>
        </div>

        <div class="stat-card__footer">

          <span>
            Target
          </span>

          <strong>
            $100K
          </strong>

        </div>

      </div>

    </section>

  </main>

</body>
</html>
