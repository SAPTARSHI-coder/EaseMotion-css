<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glassmorphism Toggle with Minimalist Styling | EaseMotion CSS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="toggle-card">
        <label class="toggle-wrapper" for="glassToggle">
            <span class="toggle-label">Frosted Mode</span>
            <input type="checkbox" id="glassToggle" class="toggle-input" checked aria-label="Toggle frosted glass mode">
            <div class="toggle-container" aria-hidden="true">
                <div class="toggle-thumb"></div>
            </div>
        </label>
    </div>
</body>
</html>
