<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS BMI Indicator Scale - EaseMotion CSS</title>
  <!-- Import EaseMotion CSS -->
  <link rel="stylesheet" href="../../../easemotion.css">
  <!-- Component Specific Styles -->
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="minimalist-bg">

  <div class="demo-container">
    
    <div class="header-section">
      <h1 class="ease-text-3xl">BMI Indicator Scale</h1>
      <p class="ease-color-muted">Pure CSS health indicator bars. Positioning is handled entirely via CSS custom properties.</p>
    </div>

    <!-- Demo 1: Normal Weight -->
    <div class="bmi-card ease-glass-card">
      <div class="bmi-header">
        <div>
          <h2 class="bmi-title">Current BMI</h2>
          <p class="bmi-status status-normal">Normal Weight</p>
        </div>
        <div class="bmi-value-display">22.5</div>
      </div>
      
      <!-- The Scale Component (Pointer at 40%) -->
      <div class="bmi-scale" style="--pointer-position: 40%;" aria-label="BMI scale indicating Normal Weight at 22.5" role="meter" aria-valuemin="15" aria-valuemax="40" aria-valuenow="22.5">
        <div class="bmi-zones">
          <div class="bmi-zone zone-underweight">Under</div>
          <div class="bmi-zone zone-normal">Normal</div>
          <div class="bmi-zone zone-overweight">Over</div>
          <div class="bmi-zone zone-obese">Obese</div>
        </div>
        <!-- Animated Pointer -->
        <div class="bmi-pointer"></div>
      </div>
    </div>

    <!-- Demo 2: Overweight -->
    <div class="bmi-card ease-glass-card">
      <div class="bmi-header">
        <div>
          <h2 class="bmi-title">Current BMI</h2>
          <p class="bmi-status status-overweight">Overweight</p>
        </div>
        <div class="bmi-value-display">27.8</div>
      </div>
      
      <!-- The Scale Component (Pointer at 72%) -->
      <div class="bmi-scale" style="--pointer-position: 72%;" aria-label="BMI scale indicating Overweight at 27.8" role="meter" aria-valuemin="15" aria-valuemax="40" aria-valuenow="27.8">
        <div class="bmi-zones">
          <div class="bmi-zone zone-underweight">Under</div>
          <div class="bmi-zone zone-normal">Normal</div>
          <div class="bmi-zone zone-overweight">Over</div>
          <div class="bmi-zone zone-obese">Obese</div>
        </div>
        <!-- Animated Pointer -->
        <div class="bmi-pointer"></div>
      </div>
    </div>

  </div>

</body>
</html>
