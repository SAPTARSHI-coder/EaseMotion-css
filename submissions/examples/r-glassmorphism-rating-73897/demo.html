<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
        name="description"
        content="Glassmorphism blur CSS rating component"
    >
    <title>Glassmorphism Blur Rating</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="page">
        <div class="orb orb-one" aria-hidden="true"></div>
        <div class="orb orb-two" aria-hidden="true"></div>

        <section class="rating-card" aria-labelledby="rating-title">
            <div class="icon" aria-hidden="true">★</div>

            <p class="eyebrow">Rating &amp; Feedback</p>

            <h1 id="rating-title">Rate your experience</h1>

            <p class="description">
                Your feedback helps us create a better experience.
            </p>

            <fieldset class="rating">
                <legend class="sr-only">
                    Select a rating from one to five stars
                </legend>

                <input
                    type="radio"
                    id="star-5"
                    name="rating"
                    value="5"
                >
                <label for="star-5" title="5 out of 5 stars">
                    <span aria-hidden="true">★</span>
                    <span class="sr-only">5 stars</span>
                </label>

                <input
                    type="radio"
                    id="star-4"
                    name="rating"
                    value="4"
                >
                <label for="star-4" title="4 out of 5 stars">
                    <span aria-hidden="true">★</span>
                    <span class="sr-only">4 stars</span>
                </label>

                <input
                    type="radio"
                    id="star-3"
                    name="rating"
                    value="3"
                >
                <label for="star-3" title="3 out of 5 stars">
                    <span aria-hidden="true">★</span>
                    <span class="sr-only">3 stars</span>
                </label>

                <input
                    type="radio"
                    id="star-2"
                    name="rating"
                    value="2"
                >
                <label for="star-2" title="2 out of 5 stars">
                    <span aria-hidden="true">★</span>
                    <span class="sr-only">2 stars</span>
                </label>

                <input
                    type="radio"
                    id="star-1"
                    name="rating"
                    value="1"
                >
                <label for="star-1" title="1 out of 5 stars">
                    <span aria-hidden="true">★</span>
                    <span class="sr-only">1 star</span>
                </label>
            </fieldset>

            <p class="hint">
                Select a star rating to share your feedback.
            </p>
        </section>
    </main>
</body>
</html>
