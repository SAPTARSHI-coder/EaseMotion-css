<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zoom-In Stepper</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<section class="stepper-section">

    <h1>Project Workflow</h1>
    <p>Zoom-In Stepper for Responsive Dashboard Layouts</p>

    <div class="stepper">

        <div class="step active">
            <div class="step-circle">1</div>
            <h3>Planning</h3>
            <p>Gather requirements and define project scope.</p>
        </div>

        <div class="connector"></div>

        <div class="step">
            <div class="step-circle">2</div>
            <h3>Design</h3>
            <p>Create wireframes and UI layouts.</p>
        </div>

        <div class="connector"></div>

        <div class="step">
            <div class="step-circle">3</div>
            <h3>Development</h3>
            <p>Build features using HTML and CSS.</p>
        </div>

        <div class="connector"></div>

        <div class="step">
            <div class="step-circle">4</div>
            <h3>Launch</h3>
            <p>Deploy the project and monitor performance.</p>
        </div>

    </div>

</section>

</body>
</html>
