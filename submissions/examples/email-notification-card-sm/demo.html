<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Accessible CSS email notification card with sender avatar and message preview."
  >

  <title>Email Notification Card</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="page">
    <section class="notification-wrapper" aria-labelledby="notification-title">

      <h1 id="notification-title">Email Notifications</h1>

      <article
        class="email-card"
        tabindex="0"
        aria-label="Unread email from Sarah Johnson"
      >

        <!-- Unread indicator -->
        <span
          class="unread-dot"
          aria-label="Unread email"
        ></span>

        <!-- Avatar -->
        <div class="avatar" aria-hidden="true">
          SJ
        </div>

        <!-- Email content -->
        <div class="email-content">

          <div class="email-header">

            <div>
              <h2>Sarah Johnson</h2>
              <p class="email-address">
                sarah@example.com
              </p>
            </div>

            <time datetime="2026-08-11T10:30">
              10:30 AM
            </time>

          </div>

          <h3>Project Update – Final Review</h3>

          <p class="preview">
            Hi! I've completed the final changes for the project.
            Please review the attached document and let me know
            if everything looks good.
          </p>

          <!-- Footer -->
          <div class="email-footer">

            <span class="attachment">
              <span aria-hidden="true">📎</span>
              project-review.pdf
            </span>

            <button
              class="action-button"
              type="button"
              aria-label="Open email from Sarah Johnson"
            >
              Open
            </button>

          </div>

        </div>

      </article>

    </section>
  </main>

</body>
</html>
