<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tooltip Fade Arrow</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <h1>Tooltip Fade Arrow</h1>

    <div class="tooltip-wrap">
      <button class="info-btn" aria-describedby="tip1">
        Save
      </button>
      <span class="tooltip" id="tip1" role="tooltip">Saves your current progress</span>
    </div>
  </main>
</body>
</html>
