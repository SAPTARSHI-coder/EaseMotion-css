<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-gas-station-fuel-pump</title>
</head>
<body>
<main class="gfp-pump">
  <header class="gfp-head">
    <h1 class="gfp-title">Fuel Pump</h1>
    <span class="gfp-brand">PWR</span>
  </header>
  <section class="gfp-screen" aria-label="pump display">
    <div class="gfp-screen-row">
      <span class="gfp-screen-label">Price</span>
      <span class="gfp-price">$4.59</span>
    </div>
    <div class="gfp-screen-row">
      <span class="gfp-screen-label">Liters</span>
      <span class="gfp-liters">12.6</span>
    </div>
    <div class="gfp-screen-row">
      <span class="gfp-screen-label">Amount</span>
      <span class="gfp-amount">$57.83</span>
    </div>
  </section>
  <section class="gfp-grades">
    <span class="gfp-grade gfp-grade-sel">Regular</span>
    <span class="gfp-grade">Plus</span>
    <span class="gfp-grade">Premium</span>
  </section>
  <div class="gfp-hose">
    <span class="gfp-nozzle">Nozzle</span>
  </div>
  <footer class="gfp-foot">
    <span class="gfp-msg">Insert card</span>
    <span class="gfp-pay">Pay</span>
  </footer>
</main>
</body>
</html>
