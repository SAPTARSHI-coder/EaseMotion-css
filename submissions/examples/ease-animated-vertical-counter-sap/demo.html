<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animated Vertical Counter</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <h1>Animated Vertical Counter</h1>

    <div class="counter" id="counter" role="status" aria-live="polite" aria-label="Counter value">
      <div class="digit-col" data-digit="0"></div>
      <div class="digit-col" data-digit="0"></div>
      <div class="digit-col" data-digit="0"></div>
    </div>

    <div class="controls">
      <button id="decBtn" aria-label="Decrease">−</button>
      <button id="incBtn" aria-label="Increase">+</button>
    </div>
  </main>

  <script>
    const cols = Array.from(document.querySelectorAll('.digit-col'));
    let value = 0;

    cols.forEach(col => {
      for (let i = 0; i <= 9; i++) {
        const span = document.createElement('span');
        span.textContent = i;
        col.appendChild(span);
      }
    });

    function render() {
      const str = String(Math.max(value, 0)).padStart(3, '0');
      str.split('').forEach((digit, i) => {
        cols[i].style.transform = `translateY(-${digit * 10}%)`;
      });
      document.getElementById('counter').setAttribute('aria-label', `Counter value: ${Math.max(value, 0)}`);
    }

    document.getElementById('incBtn').addEventListener('click', () => { value++; render(); });
    document.getElementById('decBtn').addEventListener('click', () => { value = Math.max(0, value - 1); render(); });

    render();
  </script>
</body>
</html>
