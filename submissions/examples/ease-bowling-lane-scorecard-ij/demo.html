<!-- EaseMotion component: bowling-lane-scorecard -->
<!DOCTYPE html>
<html lang="en" data-bowl="lane">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, viewport-fit=cover, user-scalable=yes">
<title>Ease Bowling Lane Scorecard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="bowl-lane">
  <div class="frame-strip">
    <div class="frame"><span class="frame-num">1</span><span class="frame-mark">X</span></div>
    <div class="frame"><span class="frame-num">2</span><span class="frame-mark">9/</span></div>
    <div class="frame"><span class="frame-num">3</span><span class="frame-mark">7</span></div>
    <div class="frame"><span class="frame-num">4</span><span class="frame-mark">X</span></div>
    <div class="frame"><span class="frame-num">5</span><span class="frame-mark">8</span></div>
    <div class="frame"><span class="frame-num">6</span><span class="frame-mark">X</span></div>
    <div class="frame"><span class="frame-num">7</span><span class="frame-mark">9</span></div>
    <div class="frame"><span class="frame-num">8</span><span class="frame-mark">--</span></div>
    <div class="frame"><span class="frame-num">9</span><span class="frame-mark">--</span></div>
    <div class="frame"><span class="frame-num">10</span><span class="frame-mark">--</span></div>
  </div>
  <div class="lane-strip">
    <div class="pin-rack">
      <i class="pin pin-r1 p1"></i><i class="pin pin-r1 p2"></i><i class="pin pin-r1 p3"></i><i class="pin pin-r1 p4"></i>
      <i class="pin pin-r2 p5"></i><i class="pin pin-r2 p6"></i><i class="pin pin-r2 p7"></i>
      <i class="pin pin-r3 p8"></i><i class="pin pin-r3 p9"></i>
      <i class="pin pin-r4 p10"></i>
    </div>
    <div class="lane-ball"></div>
  </div>
</main>
</body>
</html>
