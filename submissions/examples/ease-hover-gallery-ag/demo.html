<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hover-Reveal Image Gallery</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body style="margin:0; display:flex; align-items:center; justify-content:center; height:100vh; background:#12121c;">

  <div class="hover-gallery">
    <div class="hover-gallery-item">
      <img src="https://picsum.photos/id/1015/600/400" alt="Mountain river" />
      <div class="hover-gallery-caption">Mountain River</div>
    </div>
    <div class="hover-gallery-item">
      <img src="https://picsum.photos/id/1018/600/400" alt="Forest valley" />
      <div class="hover-gallery-caption">Forest Valley</div>
    </div>
    <div class="hover-gallery-item">
      <img src="https://picsum.photos/id/1025/600/400" alt="Dog portrait" />
      <div class="hover-gallery-caption">Dog Portrait</div>
    </div>
    <div class="hover-gallery-item">
      <img src="https://picsum.photos/id/1035/600/400" alt="Foggy road" />
      <div class="hover-gallery-caption">Foggy Road</div>
    </div>
  </div>

</body>
</html>
