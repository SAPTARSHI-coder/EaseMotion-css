<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 3D-Flip Modal - Cyberpunk</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="cyberpunk-layout">
        
        <h1 class="neon-text">SYSTEM.OVERRIDE</h1>
        
        <!-- The Checkbox Hack for Pure CSS Modal -->
        <input type="checkbox" id="modal-toggle" class="modal-toggle">
        
        <label for="modal-toggle" class="btn cyberpunk-btn">INITIATE SEQUENCE</label>
        
        <!-- The Modal Container -->
        <div class="modal-overlay">
            
            <div class="modal-wrapper">
                <div class="modal-content">
                    
                    <!-- Back Face (Hidden initially, shown on flip) -->
                    <div class="modal-face modal-back">
                        <div class="modal-header header-alert">
                            <h2><span class="blink">!</span> CRITICAL ALERT</h2>
                            <label for="modal-toggle" class="close-btn">&times;</label>
                        </div>
                        
                        <div class="modal-body">
                            <p class="alert-text">Unauthorized access detected in Sector 7G. Initiating lockdown protocol.</p>
                            <div class="status-bar">
                                <div class="progress"></div>
                            </div>
                        </div>
                        
                        <div class="modal-footer">
                            <label for="modal-toggle" class="btn outline-btn">CANCEL</label>
                            <button class="btn cyberpunk-btn-alert">LOCKDOWN</button>
                        </div>
                    </div>

                </div>
            </div>
            
        </div>
        
    </div>
</body>
</html>
