<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Bounce-Pulse Navbar - Minimalist Tech</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <nav class="bounce-navbar">
        <div class="nav-brand">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path><path d="M2 12h20"></path></svg>
            <span>GlobalNet</span>
        </div>
        
        <!-- Mobile Menu Toggle (Checkbox Hack) -->
        <input type="checkbox" id="mobile-menu-toggle" class="mobile-toggle">
        <label for="mobile-menu-toggle" class="mobile-menu-btn">
            <span></span>
            <span></span>
            <span></span>
        </label>
        
        <ul class="nav-links">
            <li class="nav-item">
                <a href="#" class="nav-link">Products</a>
                <div class="bounce-indicator"></div>
            </li>
            <li class="nav-item">
                <a href="#" class="nav-link active">Documentation</a>
                <div class="bounce-indicator"></div>
            </li>
            <li class="nav-item">
                <a href="#" class="nav-link">Community</a>
                <div class="bounce-indicator"></div>
            </li>
            <li class="nav-item">
                <a href="#" class="nav-link">Support</a>
                <div class="bounce-indicator"></div>
            </li>
        </ul>
        
        <div class="nav-actions">
            <div class="pulse-wrapper">
                <a href="#" class="btn btn-primary pulse-btn">Deploy Now</a>
            </div>
        </div>
    </nav>
    
    <!-- Decorative background -->
    <div class="page-content">
        <h1>Global Network Edge</h1>
        <p>Hover over the navigation links to see the bounce indicator. The primary button pulses gently to draw attention.</p>
    </div>

</body>
</html>
