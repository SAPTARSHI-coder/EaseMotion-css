<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parallax Carousel</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Parallax Carousel Demo</h1>
  <div class="carousel" role="region" aria-label="Minimalist parallax carousel">
    <div class="carousel-track">
      <div class="carousel-item" style="background-image:url('https://picsum.photos/id/1015/800/400');">Slide 1</div>
      <div class="carousel-item" style="background-image:url('https://picsum.photos/id/1016/800/400');">Slide 2</div>
      <div class="carousel-item" style="background-image:url('https://picsum.photos/id/1018/800/400');">Slide 3</div>
    </div>
  </div>
</body>
</html>
