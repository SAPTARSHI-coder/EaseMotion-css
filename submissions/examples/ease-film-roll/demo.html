<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinematic Film Roll Scrubber</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Cinematic Film Roll Scrubber</h1>
        <p>Scroll horizontally to see the 3D film roll effect. (CSS Scroll-Driven Animations)</p>
        
        <div class="ease-film-roll-container">
            <div class="ease-film-roll-track">
                <div class="ease-film-card"><img src="https://picsum.photos/id/10/400/600" alt="Scenery 1"></div>
                <div class="ease-film-card"><img src="https://picsum.photos/id/11/400/600" alt="Scenery 2"></div>
                <div class="ease-film-card"><img src="https://picsum.photos/id/12/400/600" alt="Scenery 3"></div>
                <div class="ease-film-card"><img src="https://picsum.photos/id/13/400/600" alt="Scenery 4"></div>
                <div class="ease-film-card"><img src="https://picsum.photos/id/14/400/600" alt="Scenery 5"></div>
                <div class="ease-film-card"><img src="https://picsum.photos/id/15/400/600" alt="Scenery 6"></div>
                <div class="ease-film-card"><img src="https://picsum.photos/id/16/400/600" alt="Scenery 7"></div>
                <div class="ease-film-card"><img src="https://picsum.photos/id/17/400/600" alt="Scenery 8"></div>
                <div class="ease-film-card"><img src="https://picsum.photos/id/18/400/600" alt="Scenery 9"></div>
                <div class="ease-film-card"><img src="https://picsum.photos/id/19/400/600" alt="Scenery 10"></div>
            </div>
        </div>
    </div>
</body>
</html>
