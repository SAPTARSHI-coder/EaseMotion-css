<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ease Cinematic Film Roll</title>
    <link rel="stylesheet" href="../../../easemotion.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="demo-container">
        
        <header class="header">
            <h1>Cinematic Film Roll</h1>
            <p>100% CSS. Powered by `animation-timeline: view()`.</p>
        </header>

        <!-- 
          The horizontal scrolling container!
        -->
        <div class="film-roll-container">
            
            <div class="film-frame">
                <img src="https://images.unsplash.com/photo-1536440136628-849c177e76a1?auto=format&fit=crop&w=800&q=80" alt="Cinematic Film Reel">
            </div>
            <div class="film-frame">
                <img src="https://images.unsplash.com/photo-1485846234645-a62644f84728?auto=format&fit=crop&w=800&q=80" alt="Movie Theater">
            </div>
            <div class="film-frame">
                <img src="https://images.unsplash.com/photo-1585647347384-2593bc35786b?auto=format&fit=crop&w=800&q=80" alt="Camera Lens">
            </div>
            <div class="film-frame">
                <img src="https://images.unsplash.com/photo-1478720568477-152d9b164e26?auto=format&fit=crop&w=800&q=80" alt="Film Strip">
            </div>
            <div class="film-frame">
                <img src="https://images.unsplash.com/photo-1604928141064-207cea6f5722?auto=format&fit=crop&w=800&q=80" alt="Director Chair">
            </div>
            <div class="film-frame">
                <img src="https://images.unsplash.com/photo-1542204165-65bf26472b9b?auto=format&fit=crop&w=800&q=80" alt="Camera">
            </div>
            <div class="film-frame">
                <img src="https://images.unsplash.com/photo-1517604931442-7e0c8ed2963c?auto=format&fit=crop&w=800&q=80" alt="Clapperboard">
            </div>
            
        </div>

        <div class="instruction">
            <p>Scroll horizontally (Shift + Scroll) &rarr;</p>
        </div>
        
    </main>

</body>
</html>
