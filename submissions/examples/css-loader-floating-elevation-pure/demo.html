<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Loader: Floating Elevation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="layout-container">
        
        <header class="section-header">
            <h1 class="title">Pure CSS Loader: Floating Elevation</h1>
            <p class="subtitle">A minimalist loader utilizing synchronized Y-axis translations and dynamic drop-shadow scaling to create a convincing illusion of physical elevation.</p>
        </header>

        <div class="demo-area">
            
            <div class="loader-container" aria-label="Loading content, floating elevation animation playing">
                
                <!-- 
                  [TECHNIQUE] Floating Elevation
                  Three geometric shapes hover up and down.
                  The illusion of height is sold by the dynamic shadows underneath them.
                -->
                <div class="float-wrapper" aria-hidden="true">
                    
                    <div class="float-group group-1">
                        <div class="float-shape"></div>
                        <div class="float-shadow"></div>
                    </div>
                    
                    <div class="float-group group-2">
                        <div class="float-shape"></div>
                        <div class="float-shadow"></div>
                    </div>
                    
                    <div class="float-group group-3">
                        <div class="float-shape"></div>
                        <div class="float-shadow"></div>
                    </div>
                    
                </div>
                
                <div class="loading-text">Elevating...</div>
                
            </div>
            
        </div>
        
    </div>

</body>
</html>
