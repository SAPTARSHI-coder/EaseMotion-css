<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-quiz-progress-bar demo</title>
</head>
<body>
<div class="qp-app">
  <span class="qp-title">QUICK QUIZ</span>
  <div class="qp-card">
    <span class="qp-qnum">Q3 OF 5</span>
    <span class="qp-question">Which planet is red?</span>
    <div class="qp-options">
      <span class="qp-opt">Venus</span>
      <span class="qp-opt qp-right">Mars</span>
      <span class="qp-opt">Jupiter</span>
    </div>
  </div>
  <div class="qp-track">
    <span class="qp-progress"></span>
  </div>
  <span class="qp-score">2 CORRECT</span>
</div>
</body>
</html>
