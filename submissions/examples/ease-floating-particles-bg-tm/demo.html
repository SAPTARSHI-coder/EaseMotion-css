<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Floating Particles | EaseMotion CSS</title><link rel="stylesheet" href="style.css"></head>
<body><div class="fp-root">
<div class="fp-particles">
<div class="fp-p" style="left:5%;animation-duration:8s;animation-delay:0s;background:var(--fp-accent)"></div>
<div class="fp-p" style="left:15%;animation-duration:10s;animation-delay:1s;background:var(--fp-accent2)"></div>
<div class="fp-p" style="left:25%;animation-duration:7s;animation-delay:2s;background:var(--fp-accent3)"></div>
<div class="fp-p" style="left:35%;animation-duration:9s;animation-delay:0.5s;background:var(--fp-accent)"></div>
<div class="fp-p" style="left:45%;animation-duration:11s;animation-delay:3s;background:var(--fp-accent2)"></div>
<div class="fp-p" style="left:55%;animation-duration:8.5s;animation-delay:1.5s;background:var(--fp-accent3)"></div>
<div class="fp-p" style="left:65%;animation-duration:9.5s;animation-delay:4s;background:var(--fp-accent)"></div>
<div class="fp-p" style="left:75%;animation-duration:7.5s;animation-delay:2.5s;background:var(--fp-accent2)"></div>
<div class="fp-p" style="left:85%;animation-duration:10.5s;animation-delay:0.8s;background:var(--fp-accent3)"></div>
<div class="fp-p" style="left:95%;animation-duration:8s;animation-delay:3.5s;background:var(--fp-accent)"></div>
</div>
<div class="fp-card">
<h2 class="fp-title">Floating Particles</h2>
<p class="fp-body">Watch the particles float upward. Pure CSS animation with staggered delays and varying speeds creates a dynamic background effect.</p>
</div>
<p class="fp-label2">Pure CSS particles — no canvas, no JS</p>
</div></body></html>
