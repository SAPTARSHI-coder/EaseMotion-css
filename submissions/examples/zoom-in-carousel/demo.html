<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Zoom-In Carousel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="checkout-layout">
        <h2 class="section-title">Delivery Options</h2>
        
        <div class="carousel-container">
            <input type="radio" name="delivery" id="del1" class="carousel-input" checked>
            <input type="radio" name="delivery" id="del2" class="carousel-input">
            <input type="radio" name="delivery" id="del3" class="carousel-input">
            
            <div class="carousel-cards">
                <label for="del1" class="carousel-card card-item-1">
                    <div class="card-icon">🚀</div>
                    <div class="card-info">
                        <div class="card-title">Express Delivery</div>
                        <div class="card-desc">Delivered in 1-2 days</div>
                    </div>
                    <div class="card-price">+$15.00</div>
                </label>
                
                <label for="del2" class="carousel-card card-item-2">
                    <div class="card-icon">🚚</div>
                    <div class="card-info">
                        <div class="card-title">Standard Shipping</div>
                        <div class="card-desc">Delivered in 3-5 days</div>
                    </div>
                    <div class="card-price">Free</div>
                </label>
                
                <label for="del3" class="carousel-card card-item-3">
                    <div class="card-icon">🏬</div>
                    <div class="card-info">
                        <div class="card-title">Store Pickup</div>
                        <div class="card-desc">Available today</div>
                    </div>
                    <div class="card-price">Free</div>
                </label>
            </div>
            
            <div class="carousel-indicators">
                <label for="del1" class="indicator"></label>
                <label for="del2" class="indicator"></label>
                <label for="del3" class="indicator"></label>
            </div>
        </div>
        
        <button class="checkout-btn">Review Order</button>
    </div>
</body>
</html>
