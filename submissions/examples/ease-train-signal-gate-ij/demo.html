<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-train-signal-gate demo</title>
</head>
<body>
<div class="tr-app">
  <div class="tr-post"></div>
  <div class="tr-arm">
    <div class="tr-stripe tr-stripe-1"></div>
    <div class="tr-stripe tr-stripe-2"></div>
    <div class="tr-stripe tr-stripe-3"></div>
    <div class="tr-lamp tr-lamp-1"></div>
    <div class="tr-lamp tr-lamp-2"></div>
    <div class="tr-weight"></div>
  </div>
  <div class="tr-sign">CROSSING</div>
  <div class="tr-track">
    <span class="tr-tie tr-tie-1"></span>
    <span class="tr-tie tr-tie-2"></span>
    <span class="tr-tie tr-tie-3"></span>
    <span class="tr-rail tr-rail-1"></span>
    <span class="tr-rail tr-rail-2"></span>
  </div>
</div>

</html>
