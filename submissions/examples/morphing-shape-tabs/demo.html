<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Morphing Shape Tabs</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>Morphing Shape Tabs</h1>

    <input type="radio" id="tab1" name="tabs" checked>
    <input type="radio" id="tab2" name="tabs">
    <input type="radio" id="tab3" name="tabs">
    <input type="radio" id="tab4" name="tabs">

    <div class="tabs">
        <label for="tab1">Overview</label>
        <label for="tab2">Analytics</label>
        <label for="tab3">Settings</label>
        <label for="tab4">Profile</label>
    </div>

    <div class="content">

        <section class="panel p1">
            <h2>Overview</h2>
            <p>Animated morphing tabs built entirely with HTML and CSS.</p>
        </section>

        <section class="panel p2">
            <h2>Analytics</h2>
            <p>Border radius smoothly transforms between different shapes.</p>
        </section>

        <section class="panel p3">
            <h2>Settings</h2>
            <p>Responsive, accessible and hardware accelerated.</p>
        </section>

        <section class="panel p4">
            <h2>Profile</h2>
            <p>Perfect for modern dashboard interfaces.</p>
        </section>

    </div>

</div>

</body>
</html>
