<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-stopwatch-lap-timer demo</title>
</head>
<body>
<div class="swt-card">
  <span class="swt-title">STOPWATCH</span>
  <div class="swt-face">
    <span class="swt-min">00</span>
    <span class="swt-colon">:</span>
    <span class="swt-sec">12</span>
    <span class="swt-dot">.</span>
    <span class="swt-ms">44</span>
  </div>
  <div class="swt-controls">
    <span class="swt-btn">LAP</span>
    <span class="swt-btn swt-start">START</span>
  </div>
  <div class="swt-laps">
    <span class="swt-lap">LAP 1 &nbsp; 00:12.44</span>
    <span class="swt-lap">LAP 2 &nbsp; 00:25.08</span>
    <span class="swt-lap">LAP 3 &nbsp; 00:38.91</span>
  </div>
</div>
</body>
</html>
