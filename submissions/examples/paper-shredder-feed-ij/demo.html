<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-paper-shredder-feed demo</title>
</head>
<body>
<div class="ps-app">
  <span class="ps-title">SHRED</span>
  <div class="ps-shredder">
    <div class="ps-feed"><span class="ps-sheet"></span></div>
    <span class="ps-blade-row"><span class="ps-blade ps-blade-1"></span><span class="ps-blade ps-blade-2"></span><span class="ps-blade ps-blade-3"></span><span class="ps-blade ps-blade-4"></span><span class="ps-blade ps-blade-5"></span></span>
  </div>
  <div class="ps-bin">
    <span class="ps-strip ps-strip-1"></span>
    <span class="ps-strip ps-strip-2"></span>
    <span class="ps-strip ps-strip-3"></span>
    <span class="ps-strip ps-strip-4"></span>
  </div>
  <span class="ps-doc">CONFIDENTIAL</span>
</div>
</body>
</html>
