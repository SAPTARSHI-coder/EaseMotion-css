<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Notification Toast — Slide + Bounce</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="ease-container">
    <p class="ease-eyebrow">Notifications</p>
    <h1 class="ease-heading">Recent Activity</h1>
    <p class="ease-subtitle">Toasts slide in from the edge with a bouncy settle. Pure CSS.</p>

    <div class="ease-toast-stack">
      <div class="ease-toast ease-toast-success">
        <span class="ease-toast-icon">✓</span>
        <div class="ease-toast-body">
          <p class="ease-toast-title">Changes saved</p>
          <p class="ease-toast-message">Your profile was updated successfully.</p>
        </div>
      </div>

      <div class="ease-toast ease-toast-info">
        <span class="ease-toast-icon">i</span>
        <div class="ease-toast-body">
          <p class="ease-toast-title">New comment</p>
          <p class="ease-toast-message">Someone replied on your latest post.</p>
        </div>
      </div>

      <div class="ease-toast ease-toast-alert">
        <span class="ease-toast-icon">!</span>
        <div class="ease-toast-body">
          <p class="ease-toast-title">Storage almost full</p>
          <p class="ease-toast-message">You're at 92% of your plan limit.</p>
        </div>
      </div>
    </div>
  </main>

</body>
</html>
