<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ice Card · Frost Forms and Melts</title>

    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <div class="card">
        <h2>❄️ Ice Card</h2>
        <p class="sub">frost forms and melts on hover</p>

        <!-- === ICE CARD === -->
        <div class="ice-container" id="iceContainer">
            <div class="ice-card">
                <div class="ice-content">
                    <i class="fas fa-snowflake"></i>
                    <h3>Frozen</h3>
                    <p>Hover to see frost form</p>
                    <span class="ice-temp">-12°C</span>
                </div>
                <div class="ice-frost">
                    <div class="frost-crystal c1"></div>
                    <div class="frost-crystal c2"></div>
                    <div class="frost-crystal c3"></div>
                    <div class="frost-crystal c4"></div>
                    <div class="frost-crystal c5"></div>
                    <div class="frost-crystal c6"></div>
                    <div class="frost-crystal c7"></div>
                    <div class="frost-crystal c8"></div>
                    <div class="frost-crystal c9"></div>
                    <div class="frost-crystal c10"></div>
                    <div class="frost-crystal c11"></div>
                    <div class="frost-crystal c12"></div>
                    <div class="frost-crystal c13"></div>
                    <div class="frost-crystal c14"></div>
                    <div class="frost-crystal c15"></div>
                </div>
                <div class="ice-melt"></div>
            </div>
        </div>

        <p style="margin-top: 2rem; font-size: 0.85rem; color: #64748b;">
            Hover · watch frost form and melt like ice
        </p>
    </div>

    <!-- Embedded JavaScript -->
    <script>
        (function() {
            'use strict';

            const container = document.getElementById('iceContainer');

            // Click feedback
            container.addEventListener('click', function() {
                const card = this.querySelector('.ice-card');
                card.classList.add('click-pulse');
                setTimeout(() => {
                    card.classList.remove('click-pulse');
                }, 300);
                console.log('❄️ Ice card clicked!');
            });

            // Keyboard accessibility
            container.setAttribute('tabindex', '0');
            container.setAttribute('role', 'button');
            container.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    this.click();
                }
            });

            // Reset animation on hover
            container.addEventListener('mouseenter', function() {
                const crystals = this.querySelectorAll('.frost-crystal');
                crystals.forEach(c => {
                    c.style.animation = 'none';
                    void c.offsetWidth;
                    c.style.animation = '';
                });
                const melt = this.querySelector('.ice-melt');
                melt.style.animation = 'none';
                void melt.offsetWidth;
                melt.style.animation = '';
            });

            console.log('❄️ Ice card initialized!');

        })();
    </script>

</body>
</html>
