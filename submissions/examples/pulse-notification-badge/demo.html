<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Pulse Badge Demo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #fdfdfd;">

    <div style="text-align: center;">
        <h2 style="color: #222; margin-bottom: 30px;">Animated Pulse Notification Badge</h2>
        
        <!-- Interactive profile avatar mockup container -->
        <div style="position: relative; width: 60px; height: 60px; background: #007bff; border-radius: 50%; margin: 0 auto; display: flex; justify-content: center; align-items: center; color: white; font-weight: bold; font-size: 20px;">
            User
            <!-- The pulse utility point element -->
            <span class="pulse-badge" style="position: absolute; top: 2px; right: 2px; width: 14px; height: 14px; background: #dc3545; border-radius: 50%;"></span>
        </div>
    </div>

</body>
</html>
