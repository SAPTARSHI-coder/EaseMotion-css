<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tower Build · builds upward like tower blocks</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <div class="tower-container">
      <div class="tower-display" id="towerDisplay">
        <!-- Tower Container -->
        <div class="tower-scene" id="towerScene">
          <!-- Blocks will be added here dynamically -->
          <div class="tower-blocks" id="towerBlocks"></div>
          
          <!-- Ground -->
          <div class="tower-ground"></div>
          
          <!-- Level Indicator -->
          <div class="level-indicator">
            <span class="level-label">Level</span>
            <span class="level-value" id="levelValue">0</span>
          </div>
        </div>

        <!-- Build Indicator -->
        <div class="build-indicator">
          <div class="build-bar">
            <div class="build-fill" id="buildFill"></div>
          </div>
          <span class="build-value" id="buildValue">Height: 0%</span>
        </div>
      </div>
      
      <div class="tower-status">
        <span id="towerStatus">🏗️ Click to build the tower</span>
      </div>
    </div>

    <div class="controls">
      <button class="btn btn-build" id="buildBtn">🏗️ Build Block</button>
      <button class="btn btn-mode" id="modeBtn">🎨 Toggle Style</button>
      <button class="btn btn-reset" id="resetBtn">⟳ Demolish</button>
    </div>
    <div class="footer-note">
      <span>🏗️ stack blocks upward · 5 styles · smooth build animation</span>
    </div>
  </div>

  <script>
    (function() {
      "use strict";

      // DOM refs
      const towerBlocks = document.getElementById('towerBlocks');
      const towerScene = document.getElementById('towerScene');
      const levelValue = document.getElementById('levelValue');
      const buildFill = document.getElementById('buildFill');
      const buildValue = document.getElementById('buildValue');
      const towerStatus = document.getElementById('towerStatus');
      const buildBtn = document.getElementById('buildBtn');
      const modeBtn = document.getElementById('modeBtn');
      const resetBtn = document.getElementById('resetBtn');

      // State
      let blockCount = 0;
      let maxBlocks = 20;
      let styleIndex = 0;
      let isBuilding = false;
      let animationId = null;

      // Styles
      const styles = [
        {
          name: 'Neon',
          colors: ['#6366f1', '#818cf8', '#a78bfa', '#c4b5fd', '#ddd6fe', '#4f46e5'],
          glow: 'rgba(99, 102, 241, 0.3)',
          accent: '#818cf8'
        },
        {
          name: 'Sunset',
          colors: ['#f472b6', '#ec4899', '#f9a8d4', '#fbcfe8', '#fcd34d', '#db2777'],
          glow: 'rgba(236, 72, 153, 0.3)',
          accent: '#f472b6'
        },
        {
          name: 'Ocean',
          colors: ['#0ea5e9', '#38bdf8', '#7dd3fc', '#bae6fd', '#e0f2fe', '#0284c7'],
          glow: 'rgba(14, 165, 233, 0.3)',
          accent: '#38bdf8'
        },
        {
          name: 'Forest',
          colors: ['#22c55e', '#4ade80', '#86efac', '#bbf7d0', '#dcfce7', '#16a34a'],
          glow: 'rgba(34, 197, 94, 0.3)',
          accent: '#4ade80'
        },
        {
          name: 'Fire',
          colors: ['#ef4444', '#f97316', '#fb923c', '#fca5a5', '#fcd34d', '#dc2626'],
          glow: 'rgba(239, 68, 68, 0.3)',
          accent: '#f97316'
        }
      ];

      // Build a block
      function buildBlock() {
        if (isBuilding || blockCount >= maxBlocks) {
          if (blockCount >= maxBlocks) {
            towerStatus.textContent = '🏗️ Tower complete! 🎉';
            towerStatus.style.color = '#fbbf24';
          }
          return;
        }

        isBuilding = true;
        blockCount++;
        
        const style = styles[styleIndex];
        const colorIndex = (blockCount - 1) % style.colors.length;
        const color = style.colors[colorIndex];

        // Create block element
        const block = document.createElement('div');
        block.className = 'tower-block';
        block.style.background = `linear-gradient(135deg, ${color}, ${style.colors[(colorIndex + 1) % style.colors.length]})`;
        block.style.boxShadow = `0 0 30px ${style.glow}, inset 0 0 20px rgba(255,255,255,0.1)`;
        block.style.borderColor = style.accent;
        block.style.height = '0px';
        block.style.opacity = '0';
        
        // Random width variation for organic look
        const widthVariation = 0.85 + Math.random() * 0.3;
        block.style.width = (80 * widthVariation) + '%';
        
        // Random offset for organic look
        const offset = (Math.random() - 0.5) * 10;
        block.style.marginLeft = offset + '%';
        
        // Add block number
        const blockNum = document.createElement('span');
        blockNum.className = 'block-number';
        blockNum.textContent = blockCount;
        block.appendChild(blockNum);

        // Add to tower
        towerBlocks.appendChild(block);

        // Trigger build animation
        requestAnimationFrame(() => {
          block.style.height = '40px';
          block.style.opacity = '1';
          block.style.transform = 'scale(1)';
        });

        // Update level
        levelValue.textContent = blockCount;

        // Update indicator
        const percent = Math.min((blockCount / maxBlocks) * 100, 100);
        buildFill.style.width = percent + '%';
        buildValue.textContent = `Height: ${Math.round(percent)}%`;

        // Update status
        towerStatus.textContent = `🏗️ Building level ${blockCount}...`;
        towerStatus.style.color = style.accent;

        // Update button
        if (blockCount >= maxBlocks) {
          buildBtn.textContent = '🏗️ Complete!';
          buildBtn.style.background = 'linear-gradient(135deg, #fbbf24, #f59e0b)';
          buildBtn.style.borderColor = '#fcd34d';
          towerStatus.textContent = '🎉 Tower complete!';
          towerStatus.style.color = '#fbbf24';
        }

        // Reset building state after animation
        setTimeout(() => {
          isBuilding = false;
          if (blockCount < maxBlocks) {
            towerStatus.textContent = '🏗️ Click to build the tower';
            towerStatus.style.color = '#94a3b8';
          }
        }, 400);

        // Scroll to show new block
        towerScene.scrollTop = towerScene.scrollHeight;
      }

      // Build multiple blocks
      function buildMultiple(count) {
        let built = 0;
        const interval = setInterval(() => {
          if (built >= count || blockCount >= maxBlocks) {
            clearInterval(interval);
            return;
          }
          buildBlock();
          built++;
        }, 300);
      }

      // Toggle style
      function toggleStyle() {
        styleIndex = (styleIndex + 1) % styles.length;
        const style = styles[styleIndex];
        
        modeBtn.textContent = `🎨 ${style.name}`;
        
        // Update existing blocks
        const blocks = towerBlocks.querySelectorAll('.tower-block');
        blocks.forEach((block, index) => {
          const colorIndex = index % style.colors.length;
          const color = style.colors[colorIndex];
          block.style.background = `linear-gradient(135deg, ${color}, ${style.colors[(colorIndex + 1) % style.colors.length]})`;
          block.style.boxShadow = `0 0 30px ${style.glow}, inset 0 0 20px rgba(255,255,255,0.1)`;
          block.style.borderColor = style.accent;
        });

        towerStatus.textContent = `🎨 Style: ${style.name}`;
        towerStatus.style.color = style.accent;
        setTimeout(() => {
          if (blockCount < maxBlocks) {
            towerStatus.textContent = '🏗️ Click to build the tower';
            towerStatus.style.color = '#94a3b8';
          }
        }, 1500);
      }

      // Demolish tower
      function demolishTower() {
        if (isBuilding) return;
        
        const blocks = towerBlocks.querySelectorAll('.tower-block');
        let demolished = 0;
        
        // Reverse order for demolition
        const blocksArray = Array.from(blocks);
        
        blocksArray.forEach((block, index) => {
          setTimeout(() => {
            block.style.height = '0px';
            block.style.opacity = '0';
            block.style.transform = 'scale(0.8)';
            
            setTimeout(() => {
              block.remove();
              demolished++;
              
              if (demolished === blocksArray.length) {
                blockCount = 0;
                levelValue.textContent = '0';
                buildFill.style.width = '0%';
                buildValue.textContent = 'Height: 0%';
                buildBtn.textContent = '🏗️ Build Block';
                buildBtn.style.background = 'linear-gradient(135deg, #6366f1, #4f46e5)';
                buildBtn.style.borderColor = '#818cf8';
                towerStatus.textContent = '💥 Tower demolished!';
                towerStatus.style.color = '#94a3b8';
                setTimeout(() => {
                  towerStatus.textContent = '🏗️ Click to build the tower';
                }, 1000);
              }
            }, 300);
          }, index * 80);
        });
      }

      // Reset tower
      function resetTower() {
        if (isBuilding) return;
        demolishTower();
      }

      // Event listeners
      if (buildBtn) {
        buildBtn.addEventListener('click', function(e) {
          e.preventDefault();
          buildBlock();
        });
      }

      if (modeBtn) {
        modeBtn.addEventListener('click', function(e) {
          e.preventDefault();
          toggleStyle();
        });
      }

      if (resetBtn) {
        resetBtn.addEventListener('click', function(e) {
          e.preventDefault();
          resetTower();
        });
      }

      // Click on display to build
      towerScene.addEventListener('click', function(e) {
        if (e.target === towerScene || e.target === towerBlocks || e.target.classList.contains('tower-ground')) {
          buildBlock();
        }
      });

      // Keyboard shortcuts
      document.addEventListener('keydown', function(e) {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

        const key = e.key;
        if (key === ' ' || key === 'Space') {
          e.preventDefault();
          buildBlock();
        } else if (key === 'b' || key === 'B') {
          e.preventDefault();
          buildMultiple(3);
        } else if (key === 's' || key === 'S') {
          e.preventDefault();
          toggleStyle();
        } else if (key === 'r' || key === 'R') {
          e.preventDefault();
          resetTower();
        }
      });

      // Initialize
      const initialStyle = styles[0];
      modeBtn.textContent = `🎨 ${initialStyle.name}`;
      levelValue.textContent = '0';
      buildFill.style.width = '0%';
      buildValue.textContent = 'Height: 0%';
      
      console.log('🏗️ Tower Build ready · shortcuts: [Space] Build, [B] Build 3, [S] Style, [R] Demolish');
    })();
  </script>
</body>
</html>
