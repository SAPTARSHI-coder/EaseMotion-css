<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clinometer Bubble Tilt — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Clinometer Bubble Tilt demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Clinometer Bubble Tilt</h1>
      <p class="lede">Clinometer vial bubble seeking level as the frame tilts</p>
    </header>

    <section class="ease-clinometer-bubble-tilt" data-demo="clinometer-bubble-tilt" aria-live="polite">
      <div class="ease-clinometer-bubble-tilt__housing">
        <div class="ease-clinometer-bubble-tilt__bezel">
          <div class="ease-clinometer-bubble-tilt__face">
            <div class="ease-clinometer-bubble-tilt__readout">
              <span class="ease-clinometer-bubble-tilt__label">Clinometer Bubble Tilt</span>
              <span class="ease-clinometer-bubble-tilt__value">LIVE</span>
            </div>
            <div class="ease-clinometer-bubble-tilt__motion" aria-hidden="true">
              <span class="ease-clinometer-bubble-tilt__a"></span>
              <span class="ease-clinometer-bubble-tilt__b"></span>
              <span class="ease-clinometer-bubble-tilt__c"></span>
              <span class="ease-clinometer-bubble-tilt__d"></span>
            </div>
            <div class="ease-clinometer-bubble-tilt__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-clinometer-bubble-tilt__controls">
          <button type="button" class="ease-clinometer-bubble-tilt__btn primary">Engage</button>
          <button type="button" class="ease-clinometer-bubble-tilt__btn">Reset</button>
          <label class="ease-clinometer-bubble-tilt__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-clinometer-bubble-tilt__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
