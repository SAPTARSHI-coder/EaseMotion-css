<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cyberpunk Matrix Overlay</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="matrix-rain">
    <span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span>
</div>

<section class="hero">

    <div class="cyber-card">

        <span class="tag">
            Cyberpunk Theme
        </span>

        <h1>Cybernetic Matrix</h1>

        <p>
            Immerse yourself in a futuristic digital environment featuring
            animated matrix rain, neon lighting, glowing borders, and
            cyber-inspired interface elements.
        </p>

        <div class="status-grid">

            <div class="status-box">
                <h2>ONLINE</h2>
                <span>Neural Core</span>
            </div>

            <div class="status-box">
                <h2>99.8%</h2>
                <span>System Health</span>
            </div>

            <div class="status-box">
                <h2>2048</h2>
                <span>Encrypted Nodes</span>
            </div>

            <div class="status-box">
                <h2>AI</h2>
                <span>Active Network</span>
            </div>

        </div>

        <div class="buttons">

            <button class="primary-btn">
                Initialize
            </button>

            <button class="outline-btn">
                Learn More
            </button>

        </div>

    </div>

</section>

</body>
</html>
