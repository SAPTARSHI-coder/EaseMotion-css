<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glassmorphism Switch Component</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="switch-container">
        <h2>Toggle Switch</h2>
        <label class="ease-switch">
            <input type="checkbox" class="ease-switch-input" checked>
            <span class="ease-switch-slider ease-switch-slide"></span>
        </label>
    </div>

</body>
</html>
