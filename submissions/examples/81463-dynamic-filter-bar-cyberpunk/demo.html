<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Dynamic Cyberpunk filter bar built with pure CSS."
  >

  <title>Dynamic Filter Bar — Cyberpunk</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="cyber-page">

    <header class="cyber-header">
      <div>
        <p class="cyber-kicker">SYSTEM // FILTER CONTROL</p>
        <h1>Neon Archive</h1>
      </div>

      <span class="cyber-status">
        <span class="cyber-status__dot" aria-hidden="true"></span>
        SYSTEM ONLINE
      </span>
    </header>

    <section
      class="cyber-filter"
      aria-labelledby="filter-title"
    >

      <div class="cyber-filter__top">

        <div>
          <p class="cyber-filter__eyebrow">
            DATA MATRIX
          </p>

          <h2 id="filter-title">
            Filter Results
          </h2>
        </div>

        <span class="cyber-count">
          128 RESULTS
        </span>

      </div>

      <div class="cyber-filter__controls">

        <label class="cyber-search">
          <span class="cyber-search__icon" aria-hidden="true">
            &gt;_
          </span>

          <span class="cyber-visually-hidden">
            Search results
          </span>

          <input
            type="search"
            placeholder="Search database..."
            aria-label="Search database"
          >
        </label>

        <div
          class="cyber-filter-group"
          aria-label="Category filters"
        >

          <span class="cyber-filter-label">
            TYPE:
          </span>

          <button
            class="cyber-chip cyber-chip--active"
            type="button"
          >
            ALL
          </button>

          <button
            class="cyber-chip"
            type="button"
          >
            UI
          </button>

          <button
            class="cyber-chip"
            type="button"
          >
            MOTION
          </button>

          <button
            class="cyber-chip"
            type="button"
          >
            EFFECTS
          </button>

        </div>

        <label class="cyber-select">
          <span class="cyber-visually-hidden">
            Sort results
          </span>

          <select aria-label="Sort results">
            <option>Latest</option>
            <option>Popular</option>
            <option>Trending</option>
          </select>
        </label>

        <button
          class="cyber-reset"
          type="button"
        >
          RESET
        </button>

      </div>

      <div class="cyber-filter__bottom">

        <div class="cyber-active">
          <span class="cyber-active__indicator"></span>

          <span>
            FILTERS ACTIVE:
          </span>

          <strong>04</strong>
        </div>

        <div class="cyber-signal" aria-hidden="true">
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
        </div>

      </div>

    </section>

    <section
      class="cyber-results"
      aria-label="Filtered results preview"
    >

      <article class="cyber-result-card">
        <span>01</span>
        <strong>Neon Interface</strong>
        <small>UI / ACTIVE</small>
      </article>

      <article class="cyber-result-card">
        <span>02</span>
        <strong>Pulse Motion</strong>
        <small>MOTION / ACTIVE</small>
      </article>

      <article class="cyber-result-card">
        <span>03</span>
        <strong>Grid Distortion</strong>
        <small>EFFECTS / ACTIVE</small>
      </article>

    </section>

    <footer class="cyber-footer">
      EaseMotion CSS · Issue #81463 · ZERO JAVASCRIPT
    </footer>

  </main>

</body>
</html>
