<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ease 3D Tilt Card</title>
    <link rel="stylesheet" href="../../../easemotion.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="ease-tilt-wrapper">
        
        <!-- The 3x3 invisible grid that tracks the mouse hover -->
        <div class="ease-tilt-grid-cell tilt-top-left"></div>
        <div class="ease-tilt-grid-cell tilt-top-center"></div>
        <div class="ease-tilt-grid-cell tilt-top-right"></div>
        
        <div class="ease-tilt-grid-cell tilt-mid-left"></div>
        <div class="ease-tilt-grid-cell tilt-mid-center"></div>
        <div class="ease-tilt-grid-cell tilt-mid-right"></div>
        
        <div class="ease-tilt-grid-cell tilt-bot-left"></div>
        <div class="ease-tilt-grid-cell tilt-bot-center"></div>
        <div class="ease-tilt-grid-cell tilt-bot-right"></div>
        
        <!-- The actual card that gets tilted via CSS sibling selectors (~) -->
        <div class="ease-tilt-card">
            <div class="ease-tilt-card-inner">
                <h2>Hover Me</h2>
                <p>Pure CSS 3D parallax tracking without a single line of JavaScript.</p>
            </div>
        </div>

    </div>
</body>
</html>
