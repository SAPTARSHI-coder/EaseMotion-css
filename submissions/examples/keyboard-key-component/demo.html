<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CSS Keyboard Key Component with press animation">
  <title>Keyboard Key Component</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="demo">
    <h1>Keyboard Key Component</h1>
    <p>Realistic keyboard key with a CSS press animation.</p>

    <div class="keyboard-demo">
      <button class="key" type="button" aria-label="Press Enter key">
        Enter
      </button>

      <button class="key key-space" type="button" aria-label="Press Space key">
        Space
      </button>

      <button class="key" type="button" aria-label="Press Escape key">
        Esc
      </button>
    </div>
  </main>

</body>
</html>
