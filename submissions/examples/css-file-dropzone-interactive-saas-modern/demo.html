<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaaS Modern Interactive Dropzone</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
    <div class="sm-dropzone-wrapper">
        <input type="file" id="sm-file" class="sm-input" multiple>
        <label for="sm-file" class="sm-label">
            <div class="sm-icon-container">
                <i class="ph ph-upload-simple sm-icon"></i>
            </div>
            <div class="sm-content">
                <span class="sm-title">Click to upload</span>
                <span class="sm-or">or drag and drop</span>
            </div>
            <p class="sm-hint">SVG, PNG, JPG or GIF (max. 800x400px)</p>
        </label>
    </div>
</body>
</html>
