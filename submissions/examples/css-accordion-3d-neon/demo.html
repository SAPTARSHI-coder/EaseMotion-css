<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Neon Accordion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="neon-accordion">
        <div class="n-item">
            <input type="checkbox" id="n1">
            <label for="n1" class="n-head">System Core</label>
            <div class="n-body"><p>Main reactor online. 100% capacity.</p></div>
        </div>
        <div class="n-item">
            <input type="checkbox" id="n2">
            <label for="n2" class="n-head">Network</label>
            <div class="n-body"><p>Encrypted tunneling established.</p></div>
        </div>
    </div>
</body>
</html>
