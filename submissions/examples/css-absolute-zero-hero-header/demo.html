<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Absolute Zero Hero Header</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="hero">

        <div class="hero-glow hero-glow-one"></div>
        <div class="hero-glow hero-glow-two"></div>

        <nav class="hero-nav">
            <a href="#" class="logo">ZERO</a>

            <div class="nav-links">
                <a href="#explore">Explore</a>
                <a href="#technology">Technology</a>
                <a href="#contact">Contact</a>
            </div>
        </nav>

        <section class="hero-content">

            <p class="hero-eyebrow">
                NEXT GENERATION MOTION
            </p>

            <h1 class="hero-title">
                ABSOLUTE
                <span>ZERO</span>
            </h1>

            <p class="hero-description">
                Push your interface beyond ordinary design with fluid
                typography, layered glass surfaces, and expressive motion.
            </p>

            <div class="hero-actions">
                <a href="#explore" class="hero-button hero-button-primary">
                    Explore
                </a>

                <a href="#technology" class="hero-button hero-button-secondary">
                    Discover
                </a>
            </div>

        </section>

        <div class="hero-orbit hero-orbit-one"></div>
        <div class="hero-orbit hero-orbit-two"></div>

        <div class="hero-status">
            <span class="status-dot"></span>
            SYSTEM ONLINE
        </div>

    </main>

</body>
</html>
