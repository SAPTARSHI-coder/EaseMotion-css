<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Pure CSS Absolute Zero Hero Header with fluid typography masking, glassmorphism layers, and floating keyframes.">
    <title>Absolute Zero Hero Header</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="hero">
        <div class="hero-background" aria-hidden="true"></div>
        
        <div class="hero-content">
            <div class="glass-badge">
                New Generation UI
            </div>
            
            <h1 class="fluid-title">
                Absolute Zero
            </h1>
            
            <p class="hero-description">
                Experience the ultimate visually stunning hero section integrating fluid typography masking, glassmorphism layers, and a hyper-smooth aesthetic presentation.
            </p>
            
            <div class="glass-panel">
                <button class="btn btn-primary">Get Started</button>
                <button class="btn btn-secondary">Documentation</button>
            </div>
        </div>
    </main>
</body>
</html>
