<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ease Flip Card Demo</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      display: flex;
      gap: 2rem;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: #f3f4f6;
      font-family: system-ui, sans-serif;
    }
  </style>
</head>
<body>

  <!-- Example 1: Pricing Card -->
  <div class="ease-flip-card" tabindex="0">
    <div class="ease-flip-card-inner">
      <div class="ease-flip-card-front">
        <h2>Pro Plan</h2>
      </div>
      <div class="ease-flip-card-back">
        <p>$29/mo — Unlimited projects, priority support, and more.</p>
      </div>
    </div>
  </div>

  <!-- Example 2: Flashcard -->
  <div class="ease-flip-card" tabindex="0">
    <div class="ease-flip-card-inner">
      <div class="ease-flip-card-front">
        <h2>What is CSS?</h2>
      </div>
      <div class="ease-flip-card-back">
        <p>Cascading Style Sheets — used to style HTML elements.</p>
      </div>
    </div>
  </div>

</body>
</html>
