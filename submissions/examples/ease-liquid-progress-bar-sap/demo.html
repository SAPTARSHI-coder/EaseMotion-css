<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Liquid Progress Bar</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <h1>Liquid Progress Bar</h1>

    <div class="liquid-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="65" aria-label="Upload progress">
      <div class="liquid-fill" style="--value: 65%;">
        <svg class="wave" viewBox="0 0 400 20" preserveAspectRatio="none">
          <path d="M0,10 C50,20 150,0 200,10 C250,20 350,0 400,10 L400,20 L0,20 Z"></path>
        </svg>
      </div>
      <span class="liquid-label">65%</span>
    </div>

    <div class="controls">
      <button class="btn" data-val="20">20%</button>
      <button class="btn" data-val="45">45%</button>
      <button class="btn" data-val="65">65%</button>
      <button class="btn" data-val="90">90%</button>
      <button class="btn" data-val="100">100%</button>
    </div>
  </main>

  <script>
    const fill = document.querySelector('.liquid-fill');
    const bar = document.querySelector('.liquid-bar');
    const label = document.querySelector('.liquid-label');
    document.querySelectorAll('.btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const val = btn.dataset.val;
        fill.style.setProperty('--value', val + '%');
        bar.setAttribute('aria-valuenow', val);
        label.textContent = val + '%';
      });
    });
  </script>
</body>
</html>
