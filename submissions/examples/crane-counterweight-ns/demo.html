<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crane Counterweight — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Crane Counterweight demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Crane Counterweight</h1>
      <p class="lede">Tower crane counterweight sliding as the jib slews</p>
    </header>

    <section class="ease-crane-counterweight" data-demo="crane-counterweight" aria-live="polite">
      <div class="ease-crane-counterweight__housing">
        <div class="ease-crane-counterweight__bezel">
          <div class="ease-crane-counterweight__face">
            <div class="ease-crane-counterweight__readout">
              <span class="ease-crane-counterweight__label">Crane Counterweight</span>
              <span class="ease-crane-counterweight__value">LIVE</span>
            </div>
            <div class="ease-crane-counterweight__motion" aria-hidden="true">
              <span class="ease-crane-counterweight__a"></span>
              <span class="ease-crane-counterweight__b"></span>
              <span class="ease-crane-counterweight__c"></span>
              <span class="ease-crane-counterweight__d"></span>
            </div>
            <div class="ease-crane-counterweight__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-crane-counterweight__controls">
          <button type="button" class="ease-crane-counterweight__btn primary">Engage</button>
          <button type="button" class="ease-crane-counterweight__btn">Reset</button>
          <label class="ease-crane-counterweight__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-crane-counterweight__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
