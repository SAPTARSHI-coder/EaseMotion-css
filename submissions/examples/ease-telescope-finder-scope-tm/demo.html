<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Telescope Finder Scope | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="tswrap">
    <div class="tsview">
      <span class="tslabel">TRACKING</span>
      <div class="tsstars"></div>
      <div class="tsline tsline-v"></div>
      <div class="tsline tsline-h"></div>
      <div class="tscross"></div>
    </div>
    <div class="tsdata">
      <div>RA<span>05h 35m</span></div>
      <div>DEC<span>-05° 23'</span></div>
      <div>Mag<span>+1.7</span></div>
    </div>
  </div>
</body>
</html>
