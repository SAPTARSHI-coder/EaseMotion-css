<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Responsive floating retro toggle using pure HTML and CSS"
  >

  <title>Floating Retro Toggle</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="page">
    <section class="toggle-section" aria-labelledby="toggle-title">

      <span class="eyebrow">EASEMOTION CSS</span>

      <h1 id="toggle-title">Floating Retro Toggle</h1>

      <p class="description">
        A playful retro-inspired toggle with chunky borders,
        floating shadows and pure CSS interaction.
      </p>

      <div class="toggle-demo">

        <div class="toggle-item">
          <input
            class="retro-toggle__input"
            type="checkbox"
            id="toggle-one"
          >

          <label class="retro-toggle" for="toggle-one">
            <span class="retro-toggle__track">
              <span class="retro-toggle__thumb"></span>
            </span>

            <span class="retro-toggle__content">
              <strong>Arcade Mode</strong>
              <small>Activate retro visuals</small>
            </span>
          </label>
        </div>

        <div class="toggle-item">
          <input
            class="retro-toggle__input"
            type="checkbox"
            id="toggle-two"
            checked
          >

          <label class="retro-toggle" for="toggle-two">
            <span class="retro-toggle__track">
              <span class="retro-toggle__thumb"></span>
            </span>

            <span class="retro-toggle__content">
              <strong>Power Boost</strong>
              <small>Enhanced interface mode</small>
            </span>
          </label>
        </div>

        <div class="toggle-item">
          <input
            class="retro-toggle__input"
            type="checkbox"
            id="toggle-three"
          >

          <label class="retro-toggle" for="toggle-three">
            <span class="retro-toggle__track">
              <span class="retro-toggle__thumb"></span>
            </span>

            <span class="retro-toggle__content">
              <strong>Sound FX</strong>
              <small>Enable interface sounds</small>
            </span>
          </label>
        </div>

      </div>

      <p class="hint">
        Click any toggle to switch it on or off.
      </p>

    </section>
  </main>
</body>
</html>
