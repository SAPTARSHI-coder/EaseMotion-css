<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Parallax Depth Card | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="demo-header">
    <h1>3D Parallax Depth Card</h1>
    <p>Multi-layered card with perspective depth shift on hover.</p>
  </header>

  <main class="demo-main">
    <section class="demo-section">
      <div class="ease-parallax-card">
        <div class="ease-parallax-layer ease-layer-bg"></div>
        <div class="ease-parallax-layer ease-layer-content">
          <span class="ease-card-badge">Featured</span>
          <h2>Explore the Cosmos</h2>
          <p>Interactive 3D depth effect powered by CSS transforms.</p>
        </div>
      </div>
    </section>
  </main>
  <footer class="demo-footer"><p>EaseMotion CSS Project</p></footer>
</body>
</html>
