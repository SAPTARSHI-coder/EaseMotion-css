<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-bread-maker-panel</title>
</head>
<body>
<main class="bmp-panel">
  <header class="bmp-top">
    <h1 class="bmp-model">BakePro 2000</h1>
    <span class="bmp-stage">Baking</span>
  </header>
  <section class="bmp-progs" aria-label="bread programs">
    <button class="bmp-prog">Basic</button>
    <button class="bmp-prog">French</button>
    <button class="bmp-prog">Whole</button>
    <button class="bmp-prog">Sweet</button>
  </section>
  <section class="bmp-clock" aria-label="remaining time">
    <strong class="bmp-count">1:24:08</strong>
  </section>
  <footer class="bmp-foot">
    <span class="bmp-light">Knead</span>
    <span class="bmp-light">Rise</span>
    <span class="bmp-light">Bake</span>
    <span class="bmp-light">Done</span>
  </footer>
</main>
</body>
</html>
