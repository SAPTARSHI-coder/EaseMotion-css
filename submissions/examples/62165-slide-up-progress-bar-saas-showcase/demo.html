<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Slide-Up Progress Bar</title>

<link rel="stylesheet" href="style.css">

</head>

<body>


<section class="progress-section">


<div class="container">


<span class="tag">
SAAS PERFORMANCE TRACKER
</span>


<h1>
Project Completion Status
</h1>


<p class="subtitle">
A pure CSS Slide-Up Progress Bar for modern SaaS showcase layouts.
</p>



<div class="progress-card">



<div class="progress-item">

<div class="heading">

<h2>
Cloud Deployment
</h2>

<span>
85%
</span>

</div>


<div class="progress-track">

<div class="progress-fill one">

<div class="badge">
85%
</div>

</div>

</div>

</div>




<div class="progress-item">

<div class="heading">

<h2>
AI Integration
</h2>

<span>
70%
</span>

</div>


<div class="progress-track">

<div class="progress-fill two">

<div class="badge">
70%
</div>

</div>

</div>

</div>




<div class="progress-item">

<div class="heading">

<h2>
Data Processing
</h2>

<span>
92%
</span>

</div>


<div class="progress-track">

<div class="progress-fill three">

<div class="badge">
92%
</div>

</div>

</div>

</div>




<div class="summary">

<div class="pulse"></div>

<div>

<h3>
Ready For Launch
</h3>

<p>
Your SaaS platform performance is improving continuously.
</p>

</div>

</div>



</div>


</div>


</section>


</body>

</html>
