<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Upload Dropzone</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="wrap" aria-labelledby="title">
      <section class="intro">
        <p class="eyebrow">EaseMotion input component</p>
        <h1 id="title">Upload Dropzone</h1>
        <p>
          A dashed file drop area that brightens on hover or focus while the
          upload icon bounces into place.
        </p>
      </section>

      <label class="dropzone" for="asset-upload">
        <input id="asset-upload" type="file" aria-describedby="upload-help" />
        <span class="upload-icon" aria-hidden="true">
          <span class="arrow"></span>
          <span class="tray"></span>
        </span>
        <span class="drop-title">Drop files here</span>
        <span id="upload-help" class="drop-copy">
          SVG, PNG, or CSS bundles up to 25 MB
        </span>
      </label>
    </main>
  </body>
</html>
