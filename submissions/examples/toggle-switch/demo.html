<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toggle Switch Demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #f5f5f5;
    }
  </style>
</head>
<body>

  <div class="toggle-switch-container">
    <span class="toggle-label-text" aria-hidden="true">Off</span>
    <label class="toggle-switch" aria-label="Toggle power">
      <input type="checkbox" aria-checked="false" onchange="this.setAttribute('aria-checked', this.checked)">
      <span class="toggle-slider"></span>
    </label>
    <span class="toggle-label-text" aria-hidden="true">On</span>
  </div>

</body>
</html>
