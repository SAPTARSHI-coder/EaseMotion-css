<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Hover-triggered Expanding Grid Cards</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="expanding-grid">
        <div class="grid-card" style="background-image: url('https://images.unsplash.com/photo-1518770660439-4636190af475?ixlib=rb-1.2.1&auto=format&fit=crop&w=800&q=80')">
            <div class="card-content">
                <h3>Technology</h3>
                <p>Explore the future.</p>
            </div>
        </div>
        <div class="grid-card" style="background-image: url('https://images.unsplash.com/photo-1478760329108-5c3ed9d495a0?ixlib=rb-1.2.1&auto=format&fit=crop&w=800&q=80')">
            <div class="card-content">
                <h3>Design</h3>
                <p>Create with passion.</p>
            </div>
        </div>
        <div class="grid-card" style="background-image: url('https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?ixlib=rb-1.2.1&auto=format&fit=crop&w=800&q=80')">
            <div class="card-content">
                <h3>Innovation</h3>
                <p>Think different.</p>
            </div>
        </div>
        <div class="grid-card" style="background-image: url('https://images.unsplash.com/photo-1550751827-4bd374c3f58b?ixlib=rb-1.2.1&auto=format&fit=crop&w=800&q=80')">
            <div class="card-content">
                <h3>Security</h3>
                <p>Stay safe online.</p>
            </div>
        </div>
    </div>
</body>
</html>
