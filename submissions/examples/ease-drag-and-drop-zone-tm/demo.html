<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Drag and Drop Zone | EaseMotion CSS</title><link rel="stylesheet" href="style.css"></head>
<body><div class="dz-root">
<div class="dz-zone" id="dz-zone">
<span class="dz-icon">&#128194;</span>
<h3 class="dz-title">Drop files here</h3>
<p class="dz-sub">or click to browse</p>
<p class="dz-formats">Supports: JPG, PNG, PDF, DOC (max 10MB)</p>
</div>
<div class="dz-file"><span class="dz-icon" style="font-size:1.5rem;">&#128196;</span><span class="dz-filename">project-design.pdf</span><span class="dz-filesize">2.4 MB</span></div>
</div>
<script>
const zone=document.getElementById('dz-zone');
zone.addEventListener('dragover',e=>{e.preventDefault();zone.classList.add('drag-over')});
zone.addEventListener('dragleave',()=>zone.classList.remove('drag-over'));
zone.addEventListener('drop',e=>{e.preventDefault();zone.classList.remove('drag-over')});
</script>
</body></html>
