<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Icon Slide Animation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card">

    <div class="icon-box">
      <div class="icon">➜</div>
    </div>

    <h1>Icon Slide</h1>

    <p>
      Hover over the card and watch the icon slide forward.
    </p>

    <button>
      <span>Get Started</span>
      <span class="button-icon">→</span>
    </button>

  </div>

</body>
</html>
