<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bento Grid Card Spotlight | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="bento-container">
    <div class="bento-card hero-card">
      <div class="spotlight"></div>
      <span class="tag">FEATURED</span>
      <h2>Interactive Analytics Engine</h2>
      <p>Real-time telemetry telemetry tracking with sub-millisecond query performance.</p>
    </div>
    <div class="bento-card stat-card-1">
      <div class="spotlight"></div>
      <span class="stat-number">99.99%</span>
      <span class="stat-label">System Uptime</span>
    </div>
    <div class="bento-card stat-card-2">
      <div class="spotlight"></div>
      <span class="stat-number">10M+</span>
      <span class="stat-label">Active Requests</span>
    </div>
    <div class="bento-card wide-card">
      <div class="spotlight"></div>
      <h2>Seamless Integration Ecosystem</h2>
      <p>Connect your existing database workflows using pure CSS keyframe modules.</p>
    </div>
  </div>
</body>
</html>
