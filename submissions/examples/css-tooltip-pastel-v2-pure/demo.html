<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Pastel Tooltip V2</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="container">
        <div class="tooltip-grid">
            
            <!-- Top Tooltip -->
            <div class="tooltip-wrapper">
                <button class="pastel-btn btn-mint">Hover Me (Top)</button>
                <div class="pastel-tooltip tip-top">
                    <span class="tip-title">Mint Fresh!</span>
                    <p>This is a top-positioned pastel tooltip with a smooth spring animation.</p>
                </div>
            </div>

            <!-- Right Tooltip -->
            <div class="tooltip-wrapper">
                <button class="pastel-btn btn-peach">Hover Me (Right)</button>
                <div class="pastel-tooltip tip-right">
                    <span class="tip-title">Peachy Keen!</span>
                    <p>Tooltips can appear on any side using pure CSS positioning.</p>
                </div>
            </div>

            <!-- Bottom Tooltip -->
            <div class="tooltip-wrapper">
                <button class="pastel-btn btn-lilac">Hover Me (Bottom)</button>
                <div class="pastel-tooltip tip-bottom">
                    <span class="tip-title">Lovely Lilac!</span>
                    <p>Notice the soft shadows and rounded borders.</p>
                </div>
            </div>

            <!-- Left Tooltip -->
            <div class="tooltip-wrapper">
                <button class="pastel-btn btn-butter">Hover Me (Left)</button>
                <div class="pastel-tooltip tip-left">
                    <span class="tip-title">Butter Smooth!</span>
                    <p>Works perfectly on all sides.</p>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
