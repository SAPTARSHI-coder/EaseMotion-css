<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DNA Helix Loader — Tay</title>
<link rel="stylesheet" href="style.css">
<style>
  body {
    min-height: 100vh;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4rem;
    background: #0b0d12;
    font-family: system-ui, sans-serif;
  }
  .label-tay {
    color: #9ca3af;
    font-size: 0.85rem;
    text-align: center;
    margin-top: 0.75rem;
  }
  .col-tay { display: flex; flex-direction: column; align-items: center; }
</style>
</head>
<body>

  <div class="col-tay">
    <div class="dna-loader-tay" data-nodes="10" role="status" aria-label="Loading">
      <div class="dna-strand-tay dna-strand-a-tay"></div>
      <div class="dna-strand-tay dna-strand-b-tay"></div>
    </div>
    <div class="label-tay">Default</div>
  </div>

  <div class="col-tay">
    <div class="dna-loader-tay" data-nodes="14"
         style="--dna-color-a-tay:#f472b6; --dna-color-b-tay:#facc15; --dna-speed-tay:1.2s;"
         role="status" aria-label="Loading">
      <div class="dna-strand-tay dna-strand-a-tay"></div>
      <div class="dna-strand-tay dna-strand-b-tay"></div>
    </div>
    <div class="label-tay">Custom colors & speed</div>
  </div>

  <script>
    // Generates the node elements for each strand and assigns their
    // fixed helix position (--node-top-tay, --node-angle-tay) plus
    // pulse stagger index (--i). This is the only JS the loader needs.
    function buildDnaLoaderTay(loader) {
      const count = parseInt(loader.dataset.nodes, 10) || 10;
      const height = loader.offsetHeight || 140;
      const angleStep = 360 / count;

      loader.querySelectorAll(".dna-strand-tay").forEach((strand) => {
        for (let i = 0; i < count; i++) {
          const node = document.createElement("div");
          node.className = "dna-node-tay";
          node.style.setProperty("--node-top-tay", `${(i / (count - 1)) * height}px`);
          node.style.setProperty("--node-angle-tay", `${i * angleStep}deg`);
          node.style.setProperty("--i", i);
          strand.appendChild(node);
        }
      });
    }

    document.querySelectorAll(".dna-loader-tay").forEach(buildDnaLoaderTay);
  </script>

</body>
</html>
