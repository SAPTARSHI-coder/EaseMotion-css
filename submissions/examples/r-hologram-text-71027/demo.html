<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <meta
    name="description"
    content="CSS hologram text with animated scanlines and interference effects"
  >
  <title>CSS Hologram Text</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">
    <section class="hologram-section" aria-labelledby="title">

      <p class="eyebrow">EaseMotion CSS</p>

      <h1 id="title" class="hologram" data-text="HOLOGRAM">
        HOLOGRAM
      </h1>

      <p class="subtitle">
        A CSS-only holographic text effect with scanlines,
        RGB interference, and futuristic glow.
      </p>

      <div class="demo-card">
        <span class="status">
          <span class="status-dot" aria-hidden="true"></span>
          SIGNAL ACTIVE
        </span>

        <p class="demo-label">TRANSMISSION</p>

        <h2 class="hologram hologram-small" data-text="EASEMOTION">
          EASEMOTION
        </h2>

        <p class="description">
          Scanline distortion and chromatic offsets create a
          futuristic holographic appearance using CSS only.
        </p>
      </div>

    </section>
  </main>

</body>
</html>
