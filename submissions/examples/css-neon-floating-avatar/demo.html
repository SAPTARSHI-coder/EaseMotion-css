<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floating Avatar with Neon Styling | EaseMotion CSS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="avatar-card" role="region" aria-label="Cyberpunk User Profile">
        <div class="avatar-wrapper">
            <div class="avatar-glow-ring"></div>
            <div class="avatar-img-container" role="img" aria-label="Zeta Prime profile initials">ZP</div>
            <div class="status-badge" aria-label="Online status active"></div>
        </div>
        <div class="avatar-info">
            <h3 class="avatar-name">Zeta Prime</h3>
            <p class="avatar-role">Cyber Security Lead</p>
        </div>
    </div>
</body>
</html>
