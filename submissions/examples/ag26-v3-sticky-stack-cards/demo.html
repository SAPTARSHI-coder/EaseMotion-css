<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sticky Stacking Cards</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="scroll-container">
        <h1>Scroll Down</h1>
        
        <div class="card c1"><h2>Card 1</h2></div>
        <div class="card c2"><h2>Card 2</h2></div>
        <div class="card c3"><h2>Card 3</h2></div>
        <div class="card c4"><h2>Card 4</h2></div>
        
        <div class="footer">End of Cards</div>
    </div>
</body>
</html>
