<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Premium Aurora Landing Page</title>
  <link rel="stylesheet" href="style.css" />
  <meta name="description"
    content="Stunning full-screen CSS‑only aurora landing page with layered gradients and premium hero.">
</head>

<body>
  <!-- Multiple layered aurora backgrounds for depth -->
  <div class="aurora aurora1"></div>
  <div class="aurora aurora2"></div>
  <div class="aurora aurora3"></div>

  <!-- Hero section with premium typography -->
  <section class="hero">
    <h1>Experience the Aurora</h1>
    <p>Immerse yourself in a premium, purely CSS animated background.</p>
    <a href="#" class="btn primary">Discover More</a>
  </section>
  <!-- Interactive Parallax Script -->
  <script>
    document.addEventListener("mousemove", (e) => {
      const x = e.clientX / window.innerWidth - 0.5;
      const y = e.clientY / window.innerHeight - 0.5;

      const auroras = document.querySelectorAll(".aurora");
      auroras.forEach((aurora, index) => {
        const speed = (index + 1) * 30;
        aurora.style.transform = `translate(${x * speed}px, ${y * speed}px)`;
      });

      const hero = document.querySelector(".hero");
      hero.style.transform = `translate(${x * -15}px, ${y * -15}px)`;
    });
  </script>
</body>

</html>
