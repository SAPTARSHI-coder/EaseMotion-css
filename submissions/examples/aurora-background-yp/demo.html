<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Premium Aurora Landing Page</title>
  <link rel="stylesheet" href="style.css" />
  <meta name="description"
    content="Stunning full-screen CSS‑only aurora landing page with layered gradients and premium hero.">
</head>

<body>
  <!-- Background canvas & stars -->
  <div class="aurora-bg"></div>
  <div class="stars"></div>

  <!-- Full-screen animated aurora light layers -->
  <div class="aurora-wrapper">
    <div class="aurora aurora1"></div>
    <div class="aurora aurora2"></div>
    <div class="aurora aurora3"></div>
    <div class="aurora aurora-cursor"></div>
  </div>

  <!-- Hero section with premium typography -->
  <div class="hero-container">
    <section class="hero">
      <h1 class="premium-title">Experience the Aurora</h1>
      <p class="premium-subtitle">Immerse yourself in a beautifully animated, interactive night sky.</p>
      <a href="#" class="btn primary">Discover More</a>
    </section>
  </div>

  <!-- Interactive Parallax & Cursor Following Script -->
  <script>
    const auroras = document.querySelectorAll(".aurora:not(.aurora-cursor)");
    const auroraCursor = document.querySelector(".aurora-cursor");
    const hero = document.querySelector(".hero");

    let mouseX = window.innerWidth / 2;
    let mouseY = window.innerHeight / 2;
    let targetX = mouseX;
    let targetY = mouseY;

    let normX = 0, normY = 0;
    let targetNormX = 0, targetNormY = 0;

    let scrollYOffset = 0;
    let targetScroll = 0;

    document.addEventListener("mousemove", (e) => {
      targetX = e.clientX;
      targetY = e.clientY;
      targetNormX = (e.clientX / window.innerWidth) - 0.5;
      targetNormY = (e.clientY / window.innerHeight) - 0.5;
    });

    window.addEventListener("wheel", (e) => {
      targetScroll += e.deltaY * 0.4;
      targetScroll = Math.max(-300, Math.min(targetScroll, 500));
    });

    function animate() {
      // Fluid lerping for silky smooth 60fps responsiveness
      mouseX += (targetX - mouseX) * 0.12;
      mouseY += (targetY - mouseY) * 0.12;
      normX += (targetNormX - normX) * 0.08;
      normY += (targetNormY - normY) * 0.08;
      scrollYOffset += (targetScroll - scrollYOffset) * 0.08;

      // 1. Move cursor-following aurora light directly under mouse
      if (auroraCursor) {
        auroraCursor.style.transform = `translate3d(${mouseX}px, ${mouseY - scrollYOffset * 0.5}px, 0)`;
      }

      // 2. High-displacement responsive movement for background aurora layers
      auroras.forEach((aurora, index) => {
        const factor = (index + 1) * 90; // Large 90px - 270px responsive range
        const scrollFactor = (index + 1) * 0.5;
        aurora.style.transform = `translate3d(${normX * factor}px, ${normY * factor - scrollYOffset * scrollFactor}px, 0)`;
      });

      // 3. Hero card parallax tilt
      if (hero) {
        hero.style.transform = `translate3d(${normX * -25}px, ${normY * -25}px, 0)`;
      }

      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
