<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Premium Aurora Landing Page</title>
  <link rel="stylesheet" href="style.css" />
  <meta name="description"
    content="Stunning full-screen CSS‑only aurora landing page with layered gradients and premium hero.">
</head>

<body>
  <!-- Deep starry night background -->
  <div class="aurora-bg"></div>
  <div class="stars"></div>

  <!-- Multiple layered aurora backgrounds for depth -->
  <div class="aurora aurora1"></div>
  <div class="aurora aurora2"></div>
  <div class="aurora aurora3"></div>

  <!-- Hero section with premium typography -->
  <div style="min-height: 100vh; display: flex; flex-direction: column; justify-content: center;">
    <section class="hero">
      <h1>Experience the Aurora</h1>
      <p>Immerse yourself in a premium, purely CSS animated background.</p>
      <a href="#" class="btn primary">Discover More</a>
    </section>
  </div>

  <!-- Extra space to allow scrolling -->
  <div style="min-height: 100vh; display: flex; justify-content: center; align-items: center; color: rgba(255,255,255,0.5);">
    <p>Keep scrolling to see the aurora light shift...</p>
  </div>

  <!-- Interactive Parallax Script -->
  <script>
    const auroras = document.querySelectorAll(".aurora");
    const hero = document.querySelector(".hero");

    // Mouse movement parallax
    document.addEventListener("mousemove", (e) => {
      const x = e.clientX / window.innerWidth - 0.5;
      const y = e.clientY / window.innerHeight - 0.5;
      
      auroras.forEach((aurora, index) => {
        const speed = (index + 1) * 30;
        // Keep the transform simple, scroll will handle Y offset via another mechanism if needed, 
        // or we combine them. Let's combine them in a requestAnimationFrame if we want it perfect,
        // but for now we'll just set it.
        aurora.style.transform = `translate(${x * speed}px, ${y * speed}px)`;
      });
      hero.style.transform = `translate(${x * -15}px, ${y * -15}px)`;
    });

    // Scroll parallax to make the green aurora light shift up when you scroll down
    window.addEventListener("scroll", () => {
      const scrollY = window.scrollY;
      auroras.forEach((aurora, index) => {
        // Move aurora up as we scroll down to make it more visible or shift it
        const speed = (index + 1) * 0.2;
        aurora.style.marginTop = `-${scrollY * speed}px`;
      });
    });
  </script>
</body>
</html>
