<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Premium Aurora Landing Page</title>
  <link rel="stylesheet" href="style.css" />
  <meta name="description"
    content="Stunning full-screen CSS‑only aurora landing page with layered gradients and premium hero.">
</head>

<body>
  <!-- Deep starry night background -->
  <div class="aurora-bg"></div>
  <div class="stars"></div>

  <!-- Multiple layered aurora backgrounds for depth -->
  <div class="aurora aurora1"></div>
  <div class="aurora aurora2"></div>
  <div class="aurora aurora3"></div>

  <!-- Hero section with premium typography -->
  <div class="hero-container">
    <section class="hero">
      <h1 class="premium-title">Experience the Aurora</h1>
      <p class="premium-subtitle">Immerse yourself in a beautifully animated, interactive night sky.</p>
      <a href="#" class="btn primary">Discover More</a>
    </section>
  </div>

  <!-- Interactive Parallax Script -->
  <script>
    const auroras = document.querySelectorAll(".aurora");
    const hero = document.querySelector(".hero");

    let mouseX = 0, mouseY = 0;
    let scrollYOffset = 0;

    function updateParallax() {
      auroras.forEach((aurora, index) => {
        const speed = (index + 1) * 25;
        const scrollSpeed = (index + 1) * 0.4;
        aurora.style.transform = `translate3d(${mouseX * speed}px, ${mouseY * speed - scrollYOffset * scrollSpeed}px, 0)`;
      });
      if (hero) {
        hero.style.transform = `translate3d(${mouseX * -12}px, ${mouseY * -12}px, 0)`;
      }
    }

    document.addEventListener("mousemove", (e) => {
      mouseX = e.clientX / window.innerWidth - 0.5;
      mouseY = e.clientY / window.innerHeight - 0.5;
      updateParallax();
    });

    window.addEventListener("wheel", (e) => {
      scrollYOffset += e.deltaY * 0.4;
      scrollYOffset = Math.max(-300, Math.min(scrollYOffset, 500));
      updateParallax();
    });
  </script>
</body>
</html>
