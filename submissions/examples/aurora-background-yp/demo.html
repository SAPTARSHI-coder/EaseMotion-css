<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Premium Aurora Landing Page</title>
  <link rel="stylesheet" href="style.css" />
  <meta name="description"
    content="Stunning full-screen CSS‑only aurora landing page with layered gradients and premium hero.">
</head>

<body>
  <!-- Deep starry night background -->
  <div class="aurora-bg"></div>
  <div class="stars"></div>

  <!-- Multiple layered aurora backgrounds for depth -->
  <div class="aurora aurora1"></div>
  <div class="aurora aurora2"></div>
  <div class="aurora aurora3"></div>

  <!-- Hero section with premium typography -->
  <div class="hero-container">
    <section class="hero">
      <h1 class="premium-title">Experience the Aurora</h1>
      <p class="premium-subtitle">Immerse yourself in a beautifully animated, interactive night sky.</p>
      <a href="#" class="btn primary">Discover More</a>
    </section>
  </div>

  <!-- Interactive Parallax Script -->
  <script>
    const auroras = document.querySelectorAll(".aurora");
    const hero = document.querySelector(".hero");

    // Mouse movement parallax
    document.addEventListener("mousemove", (e) => {
      const x = e.clientX / window.innerWidth - 0.5;
      const y = e.clientY / window.innerHeight - 0.5;
      
      auroras.forEach((aurora, index) => {
        const speed = (index + 1) * 30;
        aurora.style.transform = `translate(${x * speed}px, ${y * speed}px)`;
      });
      hero.style.transform = `translate(${x * -15}px, ${y * -15}px)`;
    });

    // Scroll wheel parallax without page scrolling
    let scrollOffset = 0;
    window.addEventListener("wheel", (e) => {
      scrollOffset += e.deltaY * 0.5;
      // Clamp the offset to keep the aurora within a natural range
      scrollOffset = Math.max(-200, Math.min(scrollOffset, 500));
      
      auroras.forEach((aurora, index) => {
        const speed = (index + 1) * 0.5;
        aurora.style.marginTop = `-${scrollOffset * speed}px`;
      });
    });
  </script>
</body>
</html>
