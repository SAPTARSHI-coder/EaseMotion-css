<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tracking In Expand Demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background-color: #18181b;
      color: #fafafa;
    }
    h1 {
      font-size: 3.5rem;
      text-transform: uppercase;
      font-weight: 300;
      margin: 0;
      /* default spacing is handled by the browser, animation ends at 'normal' */
    }
    .replay-btn {
      margin-top: 4rem;
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 8px;
      background: transparent;
      color: white;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .replay-btn:hover {
      background: rgba(255,255,255,0.1);
      border-color: rgba(255,255,255,0.5);
    }
  </style>
</head>
<body>

  <h1 id="demo-text" class="tracking-in-expand-ag">Elegance</h1>

  <button class="replay-btn" onclick="replay()">Replay Animation</button>

  <script>
    function replay() {
      const el = document.getElementById('demo-text');
      el.classList.remove('tracking-in-expand-ag');
      void el.offsetWidth; // trigger reflow
      el.classList.add('tracking-in-expand-ag');
    }
  </script>
</body>
</html>
