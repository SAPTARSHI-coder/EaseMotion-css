<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Pastel Treeview</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="ap-tree-wrap">
        <ul class="ap-tree">
            <li class="ap-node">
                <input type="checkbox" id="ap-n1" class="ap-toggle">
                <label for="ap-n1" class="ap-label ap-pink">Design Assets</label>
                <ul class="ap-subtree">
                    <li class="ap-leaf">Logo_V2.svg</li>
                    <li class="ap-leaf">Brand_Guidelines.pdf</li>
                </ul>
            </li>
            <li class="ap-node">
                <input type="checkbox" id="ap-n2" class="ap-toggle">
                <label for="ap-n2" class="ap-label ap-purple">Source Code</label>
                <ul class="ap-subtree">
                    <li class="ap-node">
                        <input type="checkbox" id="ap-n2-1" class="ap-toggle">
                        <label for="ap-n2-1" class="ap-label ap-green">Components</label>
                        <ul class="ap-subtree">
                            <li class="ap-leaf">Button.js</li>
                            <li class="ap-leaf">Card.js</li>
                        </ul>
                    </li>
                    <li class="ap-leaf">App.js</li>
                </ul>
            </li>
        </ul>
    </div>
</body>
</html>
