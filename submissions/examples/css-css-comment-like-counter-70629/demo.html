<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Comment Like Counter - EaseMotion</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <article class="clc-comment" aria-label="Comment like counter">
      <header class="clc-head">
        <span class="clc-avatar" aria-hidden="true">A</span
        ><span class="clc-author">Ada Lovelace</span
        ><span class="clc-time">2h</span>
      </header>
      <p class="clc-body">
        The analyzers now split the story into scenes and score importance
        before revisions.
      </p>
      <div class="clc-actions">
        <button type="button" class="clc-like" aria-pressed="false">
          <span class="clc-heart" aria-hidden="true">&#9825;</span
          ><span class="clc-count">12</span>
        </button>
      </div>
    </article>
  </body>
</html>
