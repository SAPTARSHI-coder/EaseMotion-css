<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skew-Active Tabs - Fintech Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="dashboard">

    <h1>Fintech Dashboard</h1>

    <p class="subtitle">
        Skew-Active Tabs for financial analytics
    </p>

    <div class="tabs">

        <button class="tab active">
            Overview
        </button>

        <button class="tab">
            Investments
        </button>

        <button class="tab">
            Reports
        </button>

        <button class="tab">
            Settings
        </button>

    </div>

    <div class="content-card">

        <div class="metric">

            <h2>Net Worth</h2>

            <span class="value">$245,780</span>

            <p>Updated from all linked accounts</p>

        </div>

        <div class="stats">

            <div class="stat-box">
                <h3>Monthly Gain</h3>
                <span>+12.8%</span>
            </div>

            <div class="stat-box">
                <h3>Investments</h3>
                <span>38</span>
            </div>

            <div class="stat-box">
                <h3>Risk Score</h3>
                <span>Low</span>
            </div>

        </div>

    </div>

</div>

</body>
</html>
