<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Herb Garden · aromatic herbs release particles</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <div class="herb-container">
      <div class="herb-display" id="herbDisplay">
        <!-- Canvas for herb garden -->
        <canvas id="herbCanvas"></canvas>
        
        <!-- Herb Info -->
        <div class="herb-info">
          <span class="info-label">🌿 Aroma</span>
          <span class="info-value" id="aromaLevel">0%</span>
        </div>

        <!-- Herb Controls -->
        <div class="herb-controls">
          <div class="control-group">
            <label class="control-label">🌱 Herb</label>
            <div class="herb-options">
              <button class="herb-btn active" data-herb="lavender" title="Lavender">💜</button>
              <button class="herb-btn" data-herb="rosemary" title="Rosemary">🌿</button>
              <button class="herb-btn" data-herb="mint" title="Mint">🍃</button>
              <button class="herb-btn" data-herb="basil" title="Basil">🌱</button>
              <button class="herb-btn" data-herb="thyme" title="Thyme">🌸</button>
            </div>
          </div>
          <div class="control-group">
            <label class="control-label">💨 Intensity</label>
            <input type="range" class="control-slider" id="intensitySlider" min="0" max="100" value="50">
            <span class="control-value" id="intensityValue">50%</span>
          </div>
        </div>

        <!-- Herb Text -->
        <div class="herb-text">
          <span class="text-label">🌿 Herb Garden</span>
          <span class="text-message" id="herbMessage">Click the herbs to release their aroma</span>
        </div>
      </div>
      
      <div class="herb-status">
        <span id="herbStatus">🌿 Click an herb to release its aromatic particles</span>
      </div>
    </div>

    <div class="controls">
      <button class="btn btn-release" id="releaseBtn">🌿 Release Aroma</button>
      <button class="btn btn-reset" id="resetBtn">⟳ Clear</button>
    </div>
    <div class="footer-note">
      <span>🌿 aromatic herbs · 5 herbs · particle effects</span>
    </div>
  </div>

  <script>
    (function() {
      "use strict";

      // DOM refs
      const canvas = document.getElementById('herbCanvas');
      const ctx = canvas.getContext('2d');
      const display = document.getElementById('herbDisplay');
      const aromaLevel = document.getElementById('aromaLevel');
      const herbStatus = document.getElementById('herbStatus');
      const herbMessage = document.getElementById('herbMessage');
      const releaseBtn = document.getElementById('releaseBtn');
      const resetBtn = document.getElementById('resetBtn');
      const intensitySlider = document.getElementById('intensitySlider');
      const intensityValue = document.getElementById('intensityValue');
      const herbBtns = document.querySelectorAll('.herb-btn');

      // State
      let particles = [];
      let herbs = [];
      let animationId = null;
      let time = 0;
      let currentHerb = 'lavender';
      let totalAroma = 0;

      // Herb configurations
      const herbData = {
        lavender: {
          name: 'Lavender',
          icon: '💜',
          color: '#a78bfa',
          light: '#c4b5fd',
          dark: '#7c3aed',
          particleColor: '#a78bfa',
          particleGlow: 'rgba(167, 139, 250, 0.3)',
          description: 'Calming lavender aroma'
        },
        rosemary: {
          name: 'Rosemary',
          icon: '🌿',
          color: '#22c55e',
          light: '#4ade80',
          dark: '#16a34a',
          particleColor: '#22c55e',
          particleGlow: 'rgba(34, 197, 94, 0.3)',
          description: 'Invigorating rosemary scent'
        },
        mint: {
          name: 'Mint',
          icon: '🍃',
          color: '#34d399',
          light: '#6ee7b7',
          dark: '#059669',
          particleColor: '#34d399',
          particleGlow: 'rgba(52, 211, 153, 0.3)',
          description: 'Refreshing mint aroma'
        },
        basil: {
          name: 'Basil',
          icon: '🌱',
          color: '#4ade80',
          light: '#86efac',
          dark: '#22c55e',
          particleColor: '#4ade80',
          particleGlow: 'rgba(74, 222, 128, 0.3)',
          description: 'Sweet basil fragrance'
        },
        thyme: {
          name: 'Thyme',
          icon: '🌸',
          color: '#f472b6',
          light: '#f9a8d4',
          dark: '#ec4899',
          particleColor: '#f472b6',
          particleGlow: 'rgba(244, 114, 182, 0.3)',
          description: 'Earthy thyme scent'
        }
      };

      // Particle class
      class AromaParticle {
        constructor(x, y, herb) {
          const data = herbData[herb];
          this.x = x || Math.random() * canvas.width;
          this.y = y || Math.random() * canvas.height;
          this.herb = herb || currentHerb;
          this.color = data.particleColor;
          this.size = 2 + Math.random() * 4;
          this.speed = 0.2 + Math.random() * 0.6;
          this.angle = Math.random() * Math.PI * 2;
          this.phase = Math.random() * Math.PI * 2;
          this.wobble = 0.3 + Math.random() * 0.7;
          this.life = 0.5 + Math.random() * 0.5;
          this.maxLife = this.life;
          this.opacity = 0.3 + Math.random() * 0.4;
          this.glow = 0.3 + Math.random() * 0.4;
          this.shape = Math.random() > 0.5 ? 'circle' : 'star';
          this.rotation = Math.random() * Math.PI * 2;
          this.rotationSpeed = (Math.random() - 0.5) * 0.02;
        }

        update(intensity, time) {
          const intensityFactor = intensity / 100;
          this.phase += 0.02 + intensityFactor * 0.01;
          
          const moveX = Math.cos(this.angle) * this.speed * (0.3 + intensityFactor * 0.3);
          const moveY = Math.sin(this.angle) * this.speed * (0.2 + intensityFactor * 0.2);
          
          this.x += moveX + Math.sin(this.phase) * this.wobble * 0.15;
          this.y += moveY + Math.cos(this.phase * 0.7) * this.wobble * 0.15;
          
          this.rotation += this.rotationSpeed;
          this.life -= 0.003 * (1 + intensityFactor * 0.5);
          
          // Wrap around
          if (this.x < -20) this.x = canvas.width + 20;
          if (this.x > canvas.width + 20) this.x = -20;
          if (this.y < -20) this.y = canvas.height + 20;
          if (this.y > canvas.height + 20) this.y = -20;
          
          return this.life > 0;
        }

        draw(ctx) {
          const alpha = (this.life / this.maxLife) * this.opacity;
          const size = this.size * (0.5 + (this.life / this.maxLife) * 0.5);
          
          ctx.save();
          ctx.globalAlpha = alpha;
          ctx.translate(this.x, this.y);
          ctx.rotate(this.rotation);
          
          // Glow
          const glowSize = size * 4 * this.glow;
          const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, glowSize);
          grad.addColorStop(0, this.color + '66');
          grad.addColorStop(0.3, this.color + '33');
          grad.addColorStop(1, 'rgba(0,0,0,0)');
          ctx.fillStyle = grad;
          ctx.shadowColor = this.color;
          ctx.shadowBlur = 15 * this.glow;
          ctx.beginPath();
          ctx.arc(0, 0, glowSize, 0, Math.PI * 2);
          ctx.fill();
          
          // Particle body
          ctx.shadowBlur = 5 * this.glow;
          ctx.fillStyle = this.color;
          
          if (this.shape === 'star') {
            // Star shape
            const points = 5;
            const outerRadius = size;
            const innerRadius = size * 0.4;
            ctx.beginPath();
            for (let i = 0; i < points * 2; i++) {
              const radius = i % 2 === 0 ? outerRadius : innerRadius;
              const angle = (i / (points * 2)) * Math.PI * 2 - Math.PI / 2;
              const px = Math.cos(angle) * radius;
              const py = Math.sin(angle) * radius;
              if (i === 0) ctx.moveTo(px, py);
              else ctx.lineTo(px, py);
            }
            ctx.closePath();
            ctx.fill();
          } else {
            // Circle
            ctx.beginPath();
            ctx.arc(0, 0, size, 0, Math.PI * 2);
            ctx.fill();
          }
          
          // Highlight
          ctx.shadowBlur = 0;
          ctx.globalAlpha = alpha * 0.2;
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(-size * 0.15, -size * 0.15, size * 0.3, 0, Math.PI * 2);
          ctx.fill();
          
          ctx.restore();
        }
      }

      // Herb plant class
      class HerbPlant {
        constructor(x, y, type) {
          this.x = x;
          this.y = y;
          this.type = type || currentHerb;
          this.size = 20 + Math.random() * 15;
          this.phase = Math.random() * Math.PI * 2;
          this.speed = 0.5 + Math.random() * 0.5;
          this.leaves = [];
          this.glowIntensity = 0;
          
          // Generate leaves
          const numLeaves = 3 + Math.floor(Math.random() * 4);
          for (let i = 0; i < numLeaves; i++) {
            this.leaves.push({
              angle: (i / numLeaves) * Math.PI * 2 + (Math.random() - 0.5) * 0.5,
              size: 0.5 + Math.random() * 0.5,
              phase: Math.random() * Math.PI * 2,
              side: Math.random() > 0.5 ? 1 : -1
            });
          }
        }

        draw(ctx, time, isActive) {
          const data = herbData[this.type];
          const alpha = isActive ? 1 : 0.7;
          
          ctx.save();
          ctx.globalAlpha = alpha;
          ctx.translate(this.x, this.y);
          
          // Glow when active
          if (isActive) {
            this.glowIntensity += (0.3 - this.glowIntensity) * 0.05;
          } else {
            this.glowIntensity += (0 - this.glowIntensity) * 0.05;
          }
          
          if (this.glowIntensity > 0.01) {
            const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, this.size * 2);
            grad.addColorStop(0, data.particleGlow);
            grad.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = grad;
            ctx.globalAlpha = this.glowIntensity * 0.5;
            ctx.beginPath();
            ctx.arc(0, 0, this.size * 2, 0, Math.PI * 2);
            ctx.fill();
          }
          
          ctx.globalAlpha = alpha;
          
          // Stem
          ctx.shadowColor = 'rgba(0,0,0,0.05)';
          ctx.shadowBlur = 3;
          ctx.strokeStyle = '#2d5a3a';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(0, this.size * 0.3);
          ctx.quadraticCurveTo(-2, 0, 0, -this.size * 0.7);
          ctx.stroke();
          
          // Leaves
          this.leaves.forEach(leaf => {
            const sway = Math.sin(time * this.speed + leaf.phase) * 0.1;
            const angle = leaf.angle + sway;
            const size = this.size * leaf.size * 0.4;
            
            ctx.save();
            ctx.rotate(angle);
            ctx.translate(0, -this.size * 0.4);
            
            // Leaf shape
            const grad2 = ctx.createRadialGradient(
              -size * 0.1, -size * 0.1, 0,
              0, 0, size
            );
            grad2.addColorStop(0, data.light);
            grad2.addColorStop(0.5, data.color);
            grad2.addColorStop(1, data.dark);
            ctx.fillStyle = grad2;
            ctx.shadowBlur = 2;
            
            ctx.beginPath();
            ctx.moveTo(0, -size);
            ctx.quadraticCurveTo(size * 0.6, -size * 0.5, size * 0.4, 0);
            ctx.quadraticCurveTo(size * 0.2, size * 0.3, 0, size * 0.2);
            ctx.quadraticCurveTo(-size * 0.2, size * 0.3, -size * 0.4, 0);
            ctx.quadraticCurveTo(-size * 0.6, -size * 0.5, 0, -size);
            ctx.closePath();
            ctx.fill();
            
            ctx.restore();
          });
          
          // Herb icon
          ctx.shadowBlur = 0;
          ctx.font = `${this.size * 0.8}px sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillStyle = data.icon;
          ctx.fillText(data.icon, 0, -this.size * 0.4);
          
          ctx.restore();
        }

        contains(x, y) {
          const dx = x - this.x;
          const dy = y - this.y;
          return dx * dx + dy * dy < (this.size * 1.2) * (this.size * 1.2);
        }
      }

      // Generate herbs
      function generateHerbs() {
        const w = canvas.width;
        const h = canvas.height;
        const types = ['lavender', 'rosemary', 'mint', 'basil', 'thyme'];
        const positions = [
          { x: w * 0.15, y: h * 0.75 },
          { x: w * 0.35, y: h * 0.8 },
          { x: w * 0.55, y: h * 0.7 },
          { x: w * 0.75, y: h * 0.78 },
          { x: w * 0.9, y: h * 0.72 }
        ];
        
        herbs = [];
        for (let i = 0; i < types.length; i++) {
          const herb = new HerbPlant(positions[i].x, positions[i].y, types[i]);
          herb.size = 18 + Math.random() * 12;
          herbs.push(herb);
        }
      }

      // Release aroma particles
      function releaseAroma(herbType) {
        const data = herbData[herbType];
        const intensity = parseInt(intensitySlider.value) / 100;
        const count = Math.floor(10 + intensity * 20);
        const w = canvas.width;
        const h = canvas.height;
        
        // Find herb plant
        const herb = herbs.find(h => h.type === herbType);
        if (!herb) return;
        
        for (let i = 0; i < count; i++) {
          const angle = Math.random() * Math.PI * 2;
          const dist = 10 + Math.random() * 30;
          const x = herb.x + Math.cos(angle) * dist;
          const y = herb.y + Math.sin(angle) * dist - 10;
          const particle = new AromaParticle(x, y, herbType);
          particle.speed = 0.3 + Math.random() * 0.8 * (1 + intensity);
          particle.life = 0.5 + Math.random() * 0.8;
          particle.maxLife = particle.life;
          particles.push(particle);
        }
        
        totalAroma += count;
        const percent = Math.min(100, Math.round((particles.length / 50) * 100));
        aromaLevel.textContent = percent + '%';
        aromaLevel.style.color = data.color;
        
        herbStatus.textContent = `🌿 ${data.name} aroma released! ✨`;
        herbStatus.style.color = data.color;
        herbMessage.textContent = data.description;
        herbMessage.style.color = data.color;
        
        setTimeout(() => {
          herbStatus.textContent = '🌿 Click an herb to release its aromatic particles';
          herbStatus.style.color = '#94a3b8';
          herbMessage.textContent = 'Click the herbs to release their aroma';
          herbMessage.style.color = '#94a3b8';
        }, 2000);
      }

      // Draw background
      function drawBackground() {
        const w = canvas.width;
        const h = canvas.height;
        
        // Soil gradient
        const grad = ctx.createLinearGradient(0, h * 0.7, 0, h);
        grad.addColorStop(0, 'rgba(30, 20, 15, 0.2)');
        grad.addColorStop(0.5, 'rgba(20, 15, 10, 0.3)');
        grad.addColorStop(1, 'rgba(10, 8, 5, 0.4)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, h * 0.7, w, h * 0.3);
        
        // Soil texture
        for (let i = 0; i < 50; i++) {
          const x = Math.random() * w;
          const y = h * 0.72 + Math.random() * h * 0.25;
          const size = 1 + Math.random() * 3;
          const alpha = 0.03 + Math.random() * 0.05;
          ctx.fillStyle = `rgba(40, 30, 20, ${alpha})`;
          ctx.fillRect(x, y, size, size * 0.5);
        }
        
        // Sky gradient
        const grad2 = ctx.createRadialGradient(w/2, h/2, 0, w/2, h/2, w * 0.7);
        grad2.addColorStop(0, 'rgba(10, 15, 25, 0.3)');
        grad2.addColorStop(0.5, 'rgba(15, 20, 30, 0.4)');
        grad2.addColorStop(1, 'rgba(5, 10, 20, 0.6)');
        ctx.fillStyle = grad2;
        ctx.fillRect(0, 0, w, h * 0.7);
        
        // Sunlight
        for (let i = 0; i < 2; i++) {
          const x = w * (0.2 + i * 0.6);
          const y = h * 0.1 + i * 20;
          const size = 30 + i * 20;
          const grad3 = ctx.createRadialGradient(x, y, 0, x, y, size);
          grad3.addColorStop(0, 'rgba(255,255,200,0.02)');
          grad3.addColorStop(1, 'rgba(255,255,200,0)');
          ctx.fillStyle = grad3;
          ctx.beginPath();
          ctx.arc(x, y, size, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // Resize canvas
      function resizeCanvas() {
        const rect = display.getBoundingClientRect();
        canvas.width = rect.width;
        canvas.height = rect.height;
        canvas.style.width = rect.width + 'px';
        canvas.style.height = rect.height + 'px';
        generateHerbs();
      }

      // Animation loop
      function animate() {
        const intensity = parseInt(intensitySlider.value);
        time += 0.02;
        
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawBackground();
        
        // Draw herbs
        herbs.forEach(herb => {
          const isActive = herb.type === currentHerb;
          herb.draw(ctx, time, isActive);
        });
        
        // Update and draw particles
        particles = particles.filter(p => {
          const alive = p.update(intensity, time);
          if (alive) p.draw(ctx);
          return alive;
        });
        
        // Update aroma level
        const percent = Math.min(100, Math.round((particles.length / 50) * 100));
        aromaLevel.textContent = percent + '%';
        
        // Auto-release if intensity is high
        if (intensity > 70 && Math.random() > 0.98) {
          const randomHerb = herbs[Math.floor(Math.random() * herbs.length)];
          releaseAroma(randomHerb.type);
        }
        
        animationId = requestAnimationFrame(animate);
      }

      // Set herb
      function setHerb(herb) {
        currentHerb = herb;
        herbBtns.forEach(btn => {
          btn.classList.toggle('active', btn.dataset.herb === herb);
        });
        const data = herbData[herb];
        herbStatus.textContent = `🌿 ${data.name} selected`;
        herbStatus.style.color = data.color;
        setTimeout(() => {
          herbStatus.textContent = '🌿 Click an herb to release its aromatic particles';
          herbStatus.style.color = '#94a3b8';
        }, 1500);
      }

      // Clear particles
      function clearParticles() {
        particles = [];
        totalAroma = 0;
        aromaLevel.textContent = '0%';
        aromaLevel.style.color = '#94a3b8';
        herbStatus.textContent = '🧹 Particles cleared';
        herbStatus.style.color = '#94a3b8';
        herbMessage.textContent = 'Click the herbs to release their aroma';
        herbMessage.style.color = '#94a3b8';
        setTimeout(() => {
          herbStatus.textContent = '🌿 Click an herb to release its aromatic particles';
          herbStatus.style.color = '#94a3b8';
        }, 1000);
      }

      // Event listeners
      display.addEventListener('click', function(e) {
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        
        // Check if clicked on an herb
        for (const herb of herbs) {
          if (herb.contains(x, y)) {
            setHerb(herb.type);
            releaseAroma(herb.type);
            break;
          }
        }
      });

      if (releaseBtn) {
        releaseBtn.addEventListener('click', function(e) {
          e.preventDefault();
          releaseAroma(currentHerb);
        });
      }

      if (resetBtn) {
        resetBtn.addEventListener('click', function(e) {
          e.preventDefault();
          clearParticles();
        });
      }

      herbBtns.forEach(btn => {
        btn.addEventListener('click', function() {
          setHerb(this.dataset.herb);
          releaseAroma(this.dataset.herb);
        });
      });

      intensitySlider.addEventListener('input', function() {
        intensityValue.textContent = this.value + '%';
      });

      // Keyboard shortcuts
      document.addEventListener('keydown', function(e) {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

        const key = e.key;
        if (key === ' ' || key === 'Space') {
          e.preventDefault();
          releaseAroma(currentHerb);
        } else if (key === 'r' || key === 'R') {
          e.preventDefault();
          releaseAroma(currentHerb);
        } else if (key === 'c' || key === 'C') {
          e.preventDefault();
          clearParticles();
        }
      });

      // Resize
      window.addEventListener('resize', resizeCanvas);

      // Initialize
      resizeCanvas();
      animate();
      
      console.log('🌿 Herb Garden ready · shortcuts: [Space/R] Release, [C] Clear');
    })();
  </script>
</body>
</html>
