<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Auto-Masonry Image Gallery with Scale-Hover Zoom</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../easemotion.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>Auto-Masonry Gallery</h1>
      <p>Fluid column masonry positioning with scale-hover zoom interactions.</p>
    </header>

    <main class="masonry-grid">
      <div class="masonry-item tall"><h3>Item 1</h3></div>
      <div class="masonry-item short"><h3>Item 2</h3></div>
      <div class="masonry-item medium"><h3>Item 3</h3></div>
      <div class="masonry-item tall"><h3>Item 4</h3></div>
      <div class="masonry-item short"><h3>Item 5</h3></div>
    </main>
  </div>
</body>
</html>
