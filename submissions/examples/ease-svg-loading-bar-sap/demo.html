<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SVG Loading Bar</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <h1>SVG Loading Bar</h1>

    <svg class="svg-loader" width="240" height="12" viewBox="0 0 240 12" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100">
      <rect x="0" y="0" width="240" height="12" rx="6" class="track"></rect>
      <rect x="0" y="0" width="240" height="12" rx="6" class="indeterminate-fill"></rect>
    </svg>

    <p class="hint">Indeterminate loading indicator, pure SVG + CSS.</p>
  </main>
</body>
</html>
