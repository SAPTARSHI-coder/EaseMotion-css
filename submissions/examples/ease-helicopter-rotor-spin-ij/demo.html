<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-helicopter-rotor-spin demo</title>
</head>
<body>
<div class="he-app">
  <div class="he-sky">
    <span class="he-cloud he-cloud-1"></span>
    <span class="he-cloud he-cloud-2"></span>
  </div>
  <div class="he-heli">
    <div class="he-cockpit">
      <div class="he-window"></div>
    </div>
    <div class="he-body"></div>
    <div class="he-tail"></div>
    <div class="he-fin"></div>
    <div class="he-rotor">
      <div class="he-blade he-blade-1"></div>
      <div class="he-blade he-blade-2"></div>
    </div>
    <div class="he-tailrotor"></div>
    <div class="he-skid he-skid-1"></div>
    <div class="he-skid he-skid-2"></div>
  </div>
</div>
</body>
</html>
