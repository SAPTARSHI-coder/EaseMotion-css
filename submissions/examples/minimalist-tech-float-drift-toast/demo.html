<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Float-Drift Toast - Minimalist Tech</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="layout-container">
        
        <header class="section-header">
            <h1 class="title">Sync Status</h1>
            <p class="subtitle">A minimalist tech layout featuring a continuous float-drift animation for active processes.</p>
        </header>

        <div class="dashboard-area">
            
            <div class="card">
                
                <div class="controls">
                    <p class="instruction-text">Initiate the sync process to observe the floating toast.</p>
                    
                    <!-- 
                       Pure CSS State Management for Demo
                       We use a checkbox to toggle the toast visibility.
                    -->
                    <input type="checkbox" id="toast-trigger" class="toast-input">
                    
                    <label for="toast-trigger" class="btn-trigger">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>
                        Start Synchronization
                    </label>
                    
                    <!-- The Toast Notification Container -->
                    <div class="toast-wrapper">
                        
                        <!-- 
                          The actual animated toast element.
                          The Float-Drift animation makes it bob gently.
                        -->
                        <div class="toast-notification float-drift-anim">
                            <div class="toast-icon pulse-anim">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.92-10.27l-5.42 5.42"></path></svg>
                            </div>
                            <div class="toast-content">
                                <span class="toast-title">Syncing Databases</span>
                                <span class="toast-desc">Replicating primary cluster to regional nodes...</span>
                            </div>
                            
                            <!-- 
                               Dismiss button linked to the same checkbox.
                            -->
                            <label for="toast-trigger" class="btn-dismiss" aria-label="Stop sync">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="9" y1="9" x2="15" y2="15"></line><line x1="15" y1="9" x2="9" y2="15"></line></svg>
                            </label>
                            
                            <!-- Indeterminate loading bar -->
                            <div class="toast-progress indeterminate-anim"></div>
                        </div>
                        
                    </div>
                </div>
                
            </div>
            
        </div>
    </div>

</body>
</html>
