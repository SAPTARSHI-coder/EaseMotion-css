<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drag-and-Drop Kanban Board Card Swipe with Physics Spring</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../easemotion.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>Kanban Spring Drag Board</h1>
      <p>Drag cards between columns with physics spring collision feedback.</p>
    </header>

    <main class="kanban-board">
      <div class="kanban-column" ondragover="allowDrop(event)" ondrop="dropCard(event)">
        <h3>In Progress</h3>
        <div class="kanban-card" draggable="true" ondragstart="dragCard(event)" id="card1">Design Spring Mechanics</div>
        <div class="kanban-card" draggable="true" ondragstart="dragCard(event)" id="card2">Refactor AST Parser</div>
      </div>
      <div class="kanban-column" ondragover="allowDrop(event)" ondrop="dropCard(event)">
        <h3>Completed</h3>
      </div>
    </main>
  </div>

  <script>
    function dragCard(e) {
      e.dataTransfer.setData("text", e.target.id);
    }
    function allowDrop(e) {
      e.preventDefault();
    }
    function dropCard(e) {
      e.preventDefault();
      const data = e.dataTransfer.getData("text");
      const card = document.getElementById(data);
      if (e.target.classList.contains('kanban-column')) {
        e.target.appendChild(card);
      }
    }
  </script>
</body>
</html>
