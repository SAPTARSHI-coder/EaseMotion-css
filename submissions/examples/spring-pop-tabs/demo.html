<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spring Pop Tabs</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="wrapper">

    <h1>Spring Pop Tabs</h1>

    <input type="radio" id="home" name="tabs" checked>
    <input type="radio" id="stats" name="tabs">
    <input type="radio" id="files" name="tabs">
    <input type="radio" id="user" name="tabs">

    <nav class="tabs">
        <label for="home">Home</label>
        <label for="stats">Analytics</label>
        <label for="files">Projects</label>
        <label for="user">Profile</label>
    </nav>

    <section class="content">

        <article class="panel p1">
            <h2>Home</h2>
            <p>Animated spring tabs with elastic motion built using pure HTML and CSS.</p>
        </article>

        <article class="panel p2">
            <h2>Analytics</h2>
            <p>Fast GPU-accelerated transitions with responsive layouts.</p>
        </article>

        <article class="panel p3">
            <h2>Projects</h2>
            <p>Modern pill navigation with lively interactions.</p>
        </article>

        <article class="panel p4">
            <h2>Profile</h2>
            <p>No JavaScript required.</p>
        </article>

    </section>

</div>

</body>
</html>
