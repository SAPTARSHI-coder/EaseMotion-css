<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tuning Fork Hum — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Tuning Fork Hum demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Tuning Fork Hum</h1>
      <p class="lede">Tuning fork tines humming with visible vibration nodes</p>
    </header>

    <section class="ease-tuning-fork-hum" data-demo="tuning-fork-hum" aria-live="polite">
      <div class="ease-tuning-fork-hum__housing">
        <div class="ease-tuning-fork-hum__bezel">
          <div class="ease-tuning-fork-hum__face">
            <div class="ease-tuning-fork-hum__readout">
              <span class="ease-tuning-fork-hum__label">Tuning Fork Hum</span>
              <span class="ease-tuning-fork-hum__value">LIVE</span>
            </div>
            <div class="ease-tuning-fork-hum__motion" aria-hidden="true">
              <span class="ease-tuning-fork-hum__a"></span>
              <span class="ease-tuning-fork-hum__b"></span>
              <span class="ease-tuning-fork-hum__c"></span>
              <span class="ease-tuning-fork-hum__d"></span>
            </div>
            <div class="ease-tuning-fork-hum__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-tuning-fork-hum__controls">
          <button type="button" class="ease-tuning-fork-hum__btn primary">Engage</button>
          <button type="button" class="ease-tuning-fork-hum__btn">Reset</button>
          <label class="ease-tuning-fork-hum__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-tuning-fork-hum__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
