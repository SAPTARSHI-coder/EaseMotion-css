<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Dependency Graph - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Dashboard Cabinet -->
  <main class="graph-card" role="region" aria-label="System Dependency Graph">
    
    <header class="graph-header">
      <h1 class="title">Service Dependency Map</h1>
      <p class="subtitle">Interactive node graph with flowing CSS connection lines. Hover or focus nodes to inspect flow paths.</p>
    </header>

    <!-- Node Layout (Flow flows Left to Right) -->
    <div class="graph-board">

      <!-- Column 1: Client -->
      <div class="col-1">
        <div class="node node-client" tabindex="0" role="button" aria-label="Client Web Application node">
          <div class="node-title">Client Web</div>
          <div class="node-tech">React SPA</div>
        </div>
      </div>

      <!-- Column 2: Gateway -->
      <div class="col-2">
        <div class="node node-gw" tabindex="0" role="button" aria-label="API Gateway node">
          <div class="node-title">API Gateway</div>
          <div class="node-tech">Nginx Proxy</div>
        </div>
      </div>

      <!-- Column 3: Downstream microservices (Stacked vertically) -->
      <div class="col-3">
        <div class="node node-auth" tabindex="0" role="button" aria-label="Auth Service node">
          <div class="node-title">Auth API</div>
          <div class="node-tech">Node / JWT</div>
        </div>
        <div class="node node-pay" tabindex="0" role="button" aria-label="Payment API node">
          <div class="node-title">Payment API</div>
          <div class="node-tech">Go Service</div>
        </div>
      </div>

      <!-- Column 4: Storage -->
      <div class="col-4">
        <div class="node node-db" tabindex="0" role="button" aria-label="Main Database node">
          <div class="node-title">Database</div>
          <div class="node-tech">PostgreSQL</div>
        </div>
      </div>

      <!-- Connecting Edges (Lines styled via absolute offsets and skewing/rotation) -->
      <div class="edges-container" aria-hidden="true">
        <!-- Client -> Gateway -->
        <div class="edge e-client-gw"></div>
        <!-- Gateway -> Auth API -->
        <div class="edge e-gw-auth"></div>
        <!-- Gateway -> Payment API -->
        <div class="edge e-gw-pay"></div>
        <!-- Auth API -> DB -->
        <div class="edge e-auth-db"></div>
        <!-- Payment API -> DB -->
        <div class="edge e-pay-db"></div>
      </div>

    </div>

  </main>

</body>
</html>
