<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Polaroid Gallery &mdash; EaseMotion CSS Demo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="page-head">
    <p class="kicker">EaseMotion CSS &middot; Media &amp; Gallery</p>
    <h1>Polaroid Gallery</h1>
    <p class="sub">Snap a few memories and spread them out &mdash; hover over the stack to straighten them up.</p>
  </header>
  <main class="stage">
    <div class="pg-stack">
      <div class="polaroid p1"><div class="shot shot-a"></div><p>Sunset trail</p></div>
      <div class="polaroid p2"><div class="shot shot-b"></div><p>Ocean day</p></div>
      <div class="polaroid p3"><div class="shot shot-c"></div><p>Golden hour</p></div>
    </div>
  </main>
  <p class="stage-caption">Hover anywhere on the stack to fan the frames into view.</p>
  <footer class="page-foot">
    <span>Pure CSS &middot; zero dependencies</span>
    <span>3D transform flair</span>
  </footer>
</body>
</html>
