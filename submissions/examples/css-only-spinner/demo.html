<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS-only Spinner with Neumorphism Styling - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="em-demo-container">
        <!-- Pure CSS Neumorphic Spinner Component Showcase -->
        <header class="em-spinner-card" role="region" aria-label="CSS-only Spinner Showcase" tabindex="0">
            <div class="em-spinner-header-bar">
                <span class="em-card-badge">COMPONENT CONTRIBUTION</span>
                <span class="em-brand-logo">NeumoMotion</span>
            </div>
            <h1 class="em-card-title">Neumorphic Spinner</h1>
            <p class="em-card-desc">A fully responsive, pure CSS spinner component featuring soft dual-shadow neumorphic depth, smooth rotations, and frosted glassmorphism.</p>
            <div class="em-spinner-wrapper">
                <div class="em-neumo-spinner" aria-label="Loading animation"></div>
            </div>
        </header>
    </div>
</body>
</html>
