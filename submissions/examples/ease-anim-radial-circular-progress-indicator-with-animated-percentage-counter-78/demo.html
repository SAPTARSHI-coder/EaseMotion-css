<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Radial Circular Progress Indicator</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

</head>

<body>

<section class="hero">

<div class="progress-card">

<span class="badge">
Vibrant Gradient Version
</span>

<h1>
Radial Progress
<span>Indicator</span>
</h1>

<div class="progress-wrapper">

<div class="progress-circle">

<svg width="220" height="220">

<circle
class="track"
cx="110"
cy="110"
r="90">
</circle>

<circle
class="progress"
id="progressCircle"
cx="110"
cy="110"
r="90">
</circle>

</svg>

<div class="percentage">

<h2 id="counter">
0%
</h2>

<p>
Completed
</p>

</div>

</div>

</div>

<p class="description">
Animated circular progress indicator with vibrant gradient
stroke, glowing effects and smooth percentage counter animation.
</p>

<button id="startBtn">
Start Animation
</button>

</div>

</section>

<script src="script.js"></script>

</body>
</html>
