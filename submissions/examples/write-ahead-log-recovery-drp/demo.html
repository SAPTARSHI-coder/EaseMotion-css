<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Write-Ahead Log Recovery</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="advanced-shell" aria-labelledby="advanced-title">
    <section class="advanced-panel">
      <p class="eyebrow">crash recovery</p>
      <h1 id="advanced-title">Write-Ahead Log Recovery</h1>
      <p class="summary">A pure CSS recovery sequence where log records flush before data pages, then redo and undo phases rebuild a safe database state.</p>
      <div class="stage" role="img" aria-label="Animated Write-Ahead Log Recovery visualization">
        <div class="halo halo-one"></div>
        <div class="halo halo-two"></div>
        <article class="tile tile-a"><strong>01</strong><span>log flushed</span></article>
        <article class="tile tile-b"><strong>02</strong><span>redo scan</span></article>
        <article class="tile tile-c"><strong>03</strong><span>undo complete</span></article>
        <div class="lane lane-ab"><i></i></div>
        <div class="lane lane-bc"><i></i></div>
        <div class="lane lane-ca"><i></i></div>
        <div class="resolution">undo complete</div>
      </div>
      <div class="status-grid" aria-label="Write-Ahead Log Recovery status">
        <span>log flushed</span>
        <span>redo scan</span>
        <span>undo complete</span>
      </div>
    </section>
  </main>
</body>
</html>
