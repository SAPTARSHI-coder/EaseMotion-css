<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Browser Mockup Frame - EaseMotion CSS</title>
  <!-- Import EaseMotion CSS -->
  <link rel="stylesheet" href="../../../easemotion.css">
  <!-- Component Specific Styles -->
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body class="minimalist-bg">

  <div class="demo-container">
    
    <div class="header-section">
      <h1 class="ease-text-3xl">Browser Mockup Frame</h1>
      <p class="ease-color-muted">A fully responsive, macOS-inspired browser window. Features interactive hover states on window controls and an automated hardware-accelerated scrolling simulation for presenting web designs.</p>
    </div>

    <!-- The Component Viewport -->
    <div class="mockup-viewport" aria-label="Browser mockup showcase" role="region">
      
      <!-- The Browser Frame -->
      <div class="browser-mockup">
        
        <!-- The Header / URL Bar -->
        <div class="browser-header">
          
          <!-- OS Window Controls -->
          <div class="browser-controls" aria-label="Window controls">
            <span class="control close" title="Close">
              <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="3" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"></line><line x1="6" y1="18" x2="18" y2="6"></line></svg>
            </span>
            <span class="control minimize" title="Minimize">
              <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="3" stroke-linecap="round"><line x1="4" y1="12" x2="20" y2="12"></line></svg>
            </span>
            <span class="control maximize" title="Maximize">
              <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="3"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg>
            </span>
          </div>
          
          <!-- URL Navigation Box -->
          <div class="browser-url">
            <svg class="lock-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            <span class="url-text">easemotion.dev / components</span>
          </div>
          
          <!-- Browser Actions Box (balances the layout) -->
          <div class="browser-actions">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
          </div>
          
        </div>
        
        <!-- The Content Area with Automated Scroll Simulation -->
        <div class="browser-content" aria-hidden="true">
          <div class="scroll-wrapper">
            
            <!-- Fake Webpage Skeleton -->
            <div class="fake-page">
              
              <div class="fake-nav">
                <div class="fake-logo"></div>
                <div class="fake-links">
                  <div class="fake-link"></div>
                  <div class="fake-link"></div>
                  <div class="fake-link hidden-mobile"></div>
                </div>
              </div>
              
              <div class="fake-hero">
                <div class="fake-h1"></div>
                <div class="fake-p"></div>
                <div class="fake-p short"></div>
                <div class="fake-btn"></div>
              </div>
              
              <div class="fake-grid">
                <div class="fake-card">
                  <div class="fake-img"></div>
                  <div class="fake-line"></div>
                </div>
                <div class="fake-card">
                  <div class="fake-img"></div>
                  <div class="fake-line"></div>
                </div>
                <div class="fake-card">
                  <div class="fake-img"></div>
                  <div class="fake-line"></div>
                </div>
              </div>
              
              <!-- Extra content to force scrolling -->
              <div class="fake-section">
                <div class="fake-h2"></div>
                <div class="fake-p"></div>
                <div class="fake-p"></div>
                <div class="fake-p short"></div>
              </div>
              
            </div>
            
          </div>
        </div>
        
      </div>

    </div>

  </div>

</body>
</html>
