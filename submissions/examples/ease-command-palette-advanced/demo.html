<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ease Interactive Command Palette</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="ease-cmd-body">
  <div class="ease-cmd-trigger-area">
    <h1>Command Palette Overlay</h1>
    <p>Press <kbd>Cmd</kbd> + <kbd>K</kbd> or <kbd>Ctrl</kbd> + <kbd>K</kbd> to open</p>
    <button id="openCmdBtn" class="ease-cmd-btn">Open Command Palette (Ctrl+K)</button>
  </div>

  <div class="ease-cmd-backdrop" id="cmdBackdrop">
    <div class="ease-cmd-modal">
      <div class="ease-cmd-header">
        <input type="text" id="cmdInput" placeholder="Type a command or search..." autofocus />
      </div>
      <div class="ease-cmd-list" id="cmdList">
        <div class="ease-cmd-item active"><span>🚀 Go to Dashboard</span><kbd>↵</kbd></div>
        <div class="ease-cmd-item"><span>🎨 Switch Theme</span><kbd>Ctrl+T</kbd></div>
        <div class="ease-cmd-item"><span>⚙️ Open Settings</span><kbd>Ctrl+,</kbd></div>
        <div class="ease-cmd-item"><span>📖 View Documentation</span><kbd>F1</kbd></div>
      </div>
    </div>
  </div>

  <script>
    const backdrop = document.getElementById('cmdBackdrop');
    const input = document.getElementById('cmdInput');
    const btn = document.getElementById('openCmdBtn');
    const items = document.querySelectorAll('.ease-cmd-item');

    function toggleCmd(show) {
      backdrop.classList.toggle('open', show);
      if (show) input.focus();
    }

    btn.addEventListener('click', () => toggleCmd(true));
    backdrop.addEventListener('click', (e) => {
      if (e.target === backdrop) toggleCmd(false);
    });

    document.addEventListener('keydown', (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
        e.preventDefault();
        toggleCmd(!backdrop.classList.contains('open'));
      }
      if (e.key === 'Escape') toggleCmd(false);
    });

    input.addEventListener('input', (e) => {
      const val = e.target.value.toLowerCase();
      items.forEach(item => {
        const text = item.textContent.toLowerCase();
        item.style.display = text.includes(val) ? 'flex' : 'none';
      });
    });
  </script>
</body>
</html>
