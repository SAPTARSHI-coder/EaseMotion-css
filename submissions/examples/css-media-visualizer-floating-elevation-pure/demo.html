<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Media Visualizer: Floating Elevation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="layout-container">
        
        <header class="section-header">
            <h1 class="title">Floating Elevation Visualizer</h1>
            <p class="subtitle">A hardware-accelerated, JavaScript-free audio and media UI element. Features a breathable floating aesthetic achieved through synchronized CSS `box-shadow` and `transform` animations.</p>
        </header>

        <div class="demo-area">
            
            <!-- 
              [TECHNIQUE] The Floating Card
              The main container itself floats, casting a dynamic shadow
              that grows and shrinks as the card breathes.
            -->
            <div class="floating-media-card">
                
                <div class="card-header">
                    <div class="album-art-container">
                        <!-- Floating album art, desynchronized from the main card -->
                        <div class="floating-album-art">
                            <div class="art-gradient"></div>
                        </div>
                    </div>
                    <div class="track-info">
                        <h3 class="track-title">Levitation</h3>
                        <p class="track-artist">EaseMotion Gravity</p>
                    </div>
                </div>
                
                <!-- 
                  [TECHNIQUE] The Pure CSS Audio Visualizer
                  These blocks hover above the card surface.
                  They share a floating animation but with staggered delays.
                -->
                <div class="visualizer-container">
                    <div class="float-block block-1"></div>
                    <div class="float-block block-2"></div>
                    <div class="float-block block-3"></div>
                    <div class="float-block block-4"></div>
                    <div class="float-block block-5"></div>
                    <div class="float-block block-6"></div>
                    <div class="float-block block-7"></div>
                    <div class="float-block block-8"></div>
                </div>
                
                <div class="media-controls">
                    <button class="control-btn" aria-label="Previous">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="19 20 9 12 19 4 19 20"></polygon><line x1="5" y1="19" x2="5" y2="5"></line></svg>
                    </button>
                    
                    <!-- Checkbox hack for play/pause toggle -->
                    <input type="checkbox" id="play-pause" class="play-toggle" checked aria-label="Play/Pause">
                    <label for="play-pause" class="control-btn play-btn floating-btn">
                        <svg class="icon-play" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                        <svg class="icon-pause" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
                    </label>
                    
                    <button class="control-btn" aria-label="Next">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 4 15 12 5 20 5 4"></polygon><line x1="19" y1="5" x2="19" y2="19"></line></svg>
                    </button>
                </div>
                
            </div>
            
        </div>
        
    </div>

</body>
</html>
