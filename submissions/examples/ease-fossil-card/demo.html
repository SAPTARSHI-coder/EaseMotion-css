<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fossil Card · Fossil Excavation Effect</title>

    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <div class="card">
        <h2>🦴 Fossil Card</h2>
        <p class="sub">reveals hidden texture like fossil excavation</p>

        <!-- === FOSSIL CARD === -->
        <div class="fossil-container" id="fossilContainer">
            <div class="fossil-card">
                <div class="fossil-surface">
                    <div class="fossil-content">
                        <i class="fas fa-bone"></i>
                        <h3>Ancient Discovery</h3>
                        <p>Hover to excavate the fossil</p>
                        <span class="fossil-date">~ 65M years ago</span>
                    </div>
                    <!-- Fossil texture overlay -->
                    <div class="fossil-texture">
                        <div class="fossil-skeleton">
                            <div class="bone bone-1"></div>
                            <div class="bone bone-2"></div>
                            <div class="bone bone-3"></div>
                            <div class="bone bone-4"></div>
                            <div class="bone bone-5"></div>
                            <div class="bone bone-6"></div>
                            <div class="bone bone-7"></div>
                            <div class="bone bone-8"></div>
                        </div>
                        <div class="fossil-particles p1"></div>
                        <div class="fossil-particles p2"></div>
                        <div class="fossil-particles p3"></div>
                        <div class="fossil-particles p4"></div>
                        <div class="fossil-particles p5"></div>
                        <div class="fossil-particles p6"></div>
                    </div>
                </div>
            </div>
        </div>

        <p style="margin-top: 2rem; font-size: 0.85rem; color: #64748b;">
            Hover · excavate the hidden fossil texture
        </p>
    </div>

    <!-- Embedded JavaScript -->
    <script>
        (function() {
            'use strict';

            const container = document.getElementById('fossilContainer');

            // Click feedback
            container.addEventListener('click', function() {
                const card = this.querySelector('.fossil-card');
                card.classList.add('click-pulse');
                setTimeout(() => {
                    card.classList.remove('click-pulse');
                }, 300);
                console.log('🦴 Fossil excavated!');
            });

            // Keyboard accessibility
            container.setAttribute('tabindex', '0');
            container.setAttribute('role', 'button');
            container.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    this.click();
                }
            });

            // Reset animation on hover
            container.addEventListener('mouseenter', function() {
                const particles = this.querySelectorAll('.fossil-particles');
                particles.forEach(p => {
                    p.style.animation = 'none';
                    void p.offsetWidth;
                    p.style.animation = '';
                });
                const bones = this.querySelectorAll('.bone');
                bones.forEach(b => {
                    b.style.animation = 'none';
                    void b.offsetWidth;
                    b.style.animation = '';
                });
            });

            console.log('🦴 Fossil card initialized!');

        })();
    </script>

</body>
</html>
