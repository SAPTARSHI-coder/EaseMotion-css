<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notification Alert Badges — EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <p class="label">Pure CSS Pulsing Notification Badges</p>
  <div class="demo-row">
    <!-- Ping Dot -->
    <div class="ease-notification-icon">
      🔔
      <span class="ease-notification-dot"></span>
    </div>

    <!-- Count Badge -->
    <div class="ease-notification-icon">
      💬
      <span class="ease-notification-count">5</span>
    </div>
  </div>

</body>
</html>
