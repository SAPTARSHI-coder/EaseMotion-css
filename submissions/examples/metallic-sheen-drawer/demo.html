<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Metallic Sheen CSS Drawer">
  <title>Metallic Sheen Drawer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="demo">
    <section class="drawer-stage" aria-labelledby="drawer-title">
      <aside class="drawer" aria-label="Application navigation">

        <header class="drawer-header">
          <div>
            <span class="eyebrow">Navigation</span>
            <h1 id="drawer-title">Metallic</h1>
          </div>

          <button class="close-button" type="button" aria-label="Close drawer">
            <span aria-hidden="true">&times;</span>
          </button>
        </header>

        <nav class="drawer-nav" aria-label="Main navigation">
          <a class="drawer-item active" href="#">
            <span class="icon" aria-hidden="true">◆</span>
            <span>Dashboard</span>
          </a>

          <a class="drawer-item" href="#">
            <span class="icon" aria-hidden="true">◇</span>
            <span>Projects</span>
          </a>

          <a class="drawer-item" href="#">
            <span class="icon" aria-hidden="true">◌</span>
            <span>Messages</span>
          </a>

          <a class="drawer-item" href="#">
            <span class="icon" aria-hidden="true">⚙</span>
            <span>Settings</span>
          </a>
        </nav>

        <footer class="drawer-footer">
          <div class="status">
            <span class="status-dot" aria-hidden="true"></span>
            <div>
              <strong>System Ready</strong>
              <small>All services operational</small>
            </div>
          </div>
        </footer>

      </aside>

      <div class="background-content" aria-hidden="true">
        <span>METALLIC SHEEN</span>
      </div>
    </section>
  </main>

</body>
</html>
