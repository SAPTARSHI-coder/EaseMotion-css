<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Step Progress Tracker — EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <p class="label">Pure CSS Wizard Step Progress Tracker</p>

  <div class="ease-step-progress-v5">
    <div class="ease-step-progress-bar-v5"></div>

    <div class="ease-step-item-v5 ease-step-item-v5--completed">
      <div class="ease-step-circle-v5">✓</div>
      <span class="ease-step-label-v5">Account</span>
    </div>

    <div class="ease-step-item-v5 ease-step-item-v5--active">
      <div class="ease-step-circle-v5">2</div>
      <span class="ease-step-label-v5">Billing</span>
    </div>

    <div class="ease-step-item-v5">
      <div class="ease-step-circle-v5">3</div>
      <span class="ease-step-label-v5">Confirm</span>
    </div>
  </div>

</body>
</html>
