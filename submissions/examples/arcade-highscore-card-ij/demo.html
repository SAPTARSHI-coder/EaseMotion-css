<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-arcade-highscore-card demo</title>
</head>
<body>
<div class="ah-app">
  <span class="ah-title">HIGH SCORES</span>
  <div class="ah-table">
    <div class="ah-row ah-top">
      <span class="ah-rank">1</span>
      <span class="ah-name">NOVA</span>
      <span class="ah-score">48200</span>
    </div>
    <div class="ah-row">
      <span class="ah-rank">2</span>
      <span class="ah-name">R2D2</span>
      <span class="ah-score">39150</span>
    </div>
    <div class="ah-row">
      <span class="ah-rank">3</span>
      <span class="ah-name">PIXEL</span>
      <span class="ah-score">28470</span>
    </div>
  </div>
  <span class="ah-star">&#9733;</span>
  <span class="ah-coin">INSERT COIN</span>
</div>
</body>
</html>
