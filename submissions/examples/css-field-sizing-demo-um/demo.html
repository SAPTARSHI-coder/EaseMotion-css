<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS field-sizing Demo - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Form Card -->
  <main class="form-card" role="region" aria-label="Feedback and Messaging Form">
    
    <header class="form-header">
      <h1 class="title">Field Sizer</h1>
      <p class="subtitle">Demonstrating native auto-sizing inputs. Type into the fields below to see them expand dynamically without JavaScript.</p>
    </header>

    <form action="#">

      <!-- Horizontal expansion input -->
      <div class="form-group">
        <label for="name" class="field-label">Username</label>
        <div>
          <input type="text" id="name" class="form-input auto-size-input" 
                 placeholder="Type here..." required aria-required="true">
        </div>
      </div>

      <!-- Vertical expansion textarea -->
      <div class="form-group">
        <label for="message" class="field-label">Message Details</label>
        <textarea id="message" class="form-input auto-size-textarea" 
                  placeholder="Enter your message details. The box expands vertically as you type more lines..." required aria-required="true"></textarea>
      </div>

      <button type="submit" class="btn-submit">Send Message</button>

    </form>

  </main>

</body>
</html>
