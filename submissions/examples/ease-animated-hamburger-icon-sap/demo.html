<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animated Hamburger Icon</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <h1>Animated Hamburger Icon</h1>

    <button
      class="hamburger"
      id="hamburgerBtn"
      aria-expanded="false"
      aria-controls="mobileMenu"
      aria-label="Open menu"
    >
      <span class="bar bar-1"></span>
      <span class="bar bar-2"></span>
      <span class="bar bar-3"></span>
    </button>

    <nav class="mobile-menu" id="mobileMenu" hidden aria-label="Mobile">
      <a href="#">Home</a>
      <a href="#">Products</a>
      <a href="#">About</a>
      <a href="#">Contact</a>
    </nav>
  </main>

  <script>
    const btn = document.getElementById('hamburgerBtn');
    const menu = document.getElementById('mobileMenu');

    btn.addEventListener('click', () => {
      const isOpen = btn.getAttribute('aria-expanded') === 'true';
      btn.setAttribute('aria-expanded', String(!isOpen));
      btn.setAttribute('aria-label', isOpen ? 'Open menu' : 'Close menu');
      btn.classList.toggle('is-open', !isOpen);
      if (!isOpen) {
        menu.hidden = false;
        requestAnimationFrame(() => menu.classList.add('is-open'));
      } else {
        menu.classList.remove('is-open');
        menu.addEventListener('transitionend', function h() {
          menu.hidden = true;
          menu.removeEventListener('transitionend', h);
        });
      }
    });
  </script>
</body>
</html>
