<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ease Animated Accordion Tree View — EaseMotion CSS</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../easemotion.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="ease-tree-body">
  <div class="ease-tree-wrapper">
    <header class="ease-tree-header">
      <h2>Animated Accordion Tree View</h2>
      <p>Nestable file tree with smooth auto-height Grid expansion (0fr → 1fr)</p>
    </header>

    <div class="ease-tree-container">
      <!-- Root Node 1 -->
      <div class="ease-tree-node open">
        <div class="ease-tree-toggle">
          <span class="ease-arrow">▶</span>
          <span class="ease-icon">📁</span>
          <span class="ease-label">src</span>
        </div>
        <div class="ease-tree-content">
          <div class="ease-tree-children">
            
            <!-- Child Folder 1 -->
            <div class="ease-tree-node open">
              <div class="ease-tree-toggle">
                <span class="ease-arrow">▶</span>
                <span class="ease-icon">📁</span>
                <span class="ease-label">components</span>
              </div>
              <div class="ease-tree-content">
                <div class="ease-tree-children">
                  <div class="ease-tree-file"><span class="ease-icon">📄</span> Button.jsx</div>
                  <div class="ease-tree-file"><span class="ease-icon">📄</span> Card.jsx</div>
                  <div class="ease-tree-file"><span class="ease-icon">📄</span> Navbar.jsx</div>
                </div>
              </div>
            </div>

            <!-- Child Folder 2 -->
            <div class="ease-tree-node">
              <div class="ease-tree-toggle">
                <span class="ease-arrow">▶</span>
                <span class="ease-icon">📁</span>
                <span class="ease-label">styles</span>
              </div>
              <div class="ease-tree-content">
                <div class="ease-tree-children">
                  <div class="ease-tree-file"><span class="ease-icon">🎨</span> main.css</div>
                  <div class="ease-tree-file"><span class="ease-icon">🎨</span> theme.css</div>
                </div>
              </div>
            </div>

            <div class="ease-tree-file"><span class="ease-icon">⚛️</span> App.jsx</div>
            <div class="ease-tree-file"><span class="ease-icon">🚀</span> main.jsx</div>

          </div>
        </div>
      </div>

      <!-- Root Node 2 -->
      <div class="ease-tree-node">
        <div class="ease-tree-toggle">
          <span class="ease-arrow">▶</span>
          <span class="ease-icon">⚙️</span>
          <span class="ease-label">config</span>
        </div>
        <div class="ease-tree-content">
          <div class="ease-tree-children">
            <div class="ease-tree-file"><span class="ease-icon">⚙️</span> vite.config.js</div>
            <div class="ease-tree-file"><span class="ease-icon">📋</span> package.json</div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const toggles = document.querySelectorAll('.ease-tree-toggle');

      toggles.forEach(toggle => {
        toggle.addEventListener('click', (e) => {
          e.stopPropagation();
          const node = toggle.parentElement;
          node.classList.toggle('open');
        });
      });
    });
  </script>
</body>
</html>
