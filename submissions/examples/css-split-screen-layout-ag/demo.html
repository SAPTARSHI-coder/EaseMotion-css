<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Split Screen Layout</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <main class="split-layout">
    
    <a href="#" class="split-panel left" aria-label="Explore Designer Section">
      <!-- Decorative background -->
      <div class="panel-bg" style="background-image: radial-gradient(circle, #fff 10%, transparent 11%), radial-gradient(circle, #fff 10%, transparent 11%); background-size: 20px 20px; background-position: 0 0, 10px 10px;"></div>
      
      <div class="panel-content">
        <h2 class="panel-title">Designer</h2>
        <p class="panel-desc">Crafting beautiful and intuitive digital experiences.</p>
      </div>
    </a>
    
    <a href="#" class="split-panel right" aria-label="Explore Developer Section">
      <!-- Decorative background -->
      <div class="panel-bg" style="background-image: linear-gradient(45deg, #fff 25%, transparent 25%, transparent 75%, #fff 75%, #fff), linear-gradient(45deg, #fff 25%, transparent 25%, transparent 75%, #fff 75%, #fff); background-size: 20px 20px; background-position: 0 0, 10px 10px;"></div>
      
      <div class="panel-content">
        <h2 class="panel-title">Developer</h2>
        <p class="panel-desc">Building robust, scalable, and performant web architecture.</p>
      </div>
    </a>

  </main>

</body>
</html>
