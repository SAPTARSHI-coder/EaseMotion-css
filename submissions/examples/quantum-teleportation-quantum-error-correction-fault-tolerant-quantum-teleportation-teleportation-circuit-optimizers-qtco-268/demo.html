<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teleportation Circuit Optimizers QTCO - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css"></head><body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030712; color: #ffffff;">

    <div class="ease-card ease-card-glass qtco-container">
        <div class="qtco-header">
            <h2>Teleportation Circuit Optimizer</h2>
            <span class="ease-badge ease-badge-secondary">Fault-Tolerant Quantum</span>
        </div>
        
        <div class="qtco-screen ease-center">
            <div class="qtco-flux flux-qtco-a"></div>
            <div class="qtco-flux flux-qtco-b"></div>
            <div class="qtco-boundary-ring"></div>
            <div class="qtco-core ease-center"></div>
        </div>

        <div class="qtco-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Gate Reduction &amp; Depth Minimization Hub</span>
            <button class="ease-btn ease-btn-secondary ease-btn-sm ease-hover-grow">Run Circuit Optimizer</button>
        </div>
    </div></body></html>
