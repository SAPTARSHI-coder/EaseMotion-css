<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hamburger Menu Button - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="demo-card">
    <div class="demo-title">Hamburger to X Morph</div>
    
    <!-- State controller without JS dependency -->
    <input type="checkbox" id="menu-toggle" class="hamburger-toggle">
    
    <label for="menu-toggle" class="hamburger-button" aria-label="Toggle navigation menu">
      <div class="hamburger-icon">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </label>
  </div>

</body>
</html>
