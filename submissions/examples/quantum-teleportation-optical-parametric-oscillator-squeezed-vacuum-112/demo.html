<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Optical Parametric Oscillator Squeezed Vacuum - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css"></head><body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030712; color: #ffffff;">

    <div class="ease-card ease-card-glass opo-container">
        <div class="opo-header">
            <h2>OPO Squeezed Vacuum</h2>
            <span class="ease-badge ease-badge-secondary">Continuous Variable QC</span>
        </div>
        
        <div class="opo-screen ease-center">
            <div class="opo-flux flux-opo-a"></div>
            <div class="opo-flux flux-opo-b"></div>
            <div class="opo-boundary-ring"></div>
            <div class="opo-core ease-center"></div>
        </div>

        <div class="opo-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Nonlinear Crystal Cavity &amp; Quadrature Squeezing</span>
            <button class="ease-btn ease-btn-secondary ease-btn-sm ease-hover-grow">Run OPO Squeezing</button>
        </div>
    </div></body></html>
