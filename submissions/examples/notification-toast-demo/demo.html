<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EaseMotion CSS - Toast Notifications</title>

    <!-- Update this path according to the repository -->
    <link rel="stylesheet" href="../../dist/easemotion.css">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <h1>Notification Toasts</h1>

        <p class="intro">
            Click a button to preview different notification types.
        </p>

        <section class="buttons">

            <button class="btn success"
                    onclick="showToast('success')">
                Success
            </button>

            <button class="btn error"
                    onclick="showToast('error')">
                Error
            </button>

            <button class="btn warning"
                    onclick="showToast('warning')">
                Warning
            </button>

            <button class="btn info"
                    onclick="showToast('info')">
                Information
            </button>

        </section>

    </main>


    <div
        id="toast-container"
        class="toast-container"
        aria-live="polite"
        aria-atomic="true">
    </div>


    <script>

        const messages = {

            success: {
                title: "Success",
                message: "Your changes were saved successfully."
            },

            error: {
                title: "Error",
                message: "Something went wrong. Please try again."
            },

            warning: {
                title: "Warning",
                message: "Please review your changes before continuing."
            },

            info: {
                title: "Information",
                message: "A new update is available."
            }

        };


        function showToast(type) {

            const container =
                document.getElementById("toast-container");

            const data = messages[type];

            const toast = document.createElement("div");

            toast.className = `toast ${type}`;

            toast.innerHTML = `
                <div class="toast-content">
                    <strong>${data.title}</strong>
                    <p>${data.message}</p>
                </div>

                <button
                    class="close"
                    aria-label="Close notification">
                    ×
                </button>
            `;

            container.appendChild(toast);

            const closeButton =
                toast.querySelector(".close");

            closeButton.addEventListener("click", () => {
                removeToast(toast);
            });

            setTimeout(() => {
                removeToast(toast);
            }, 4000);
        }


        function removeToast(toast) {

            if (!toast.isConnected) {
                return;
            }

            toast.classList.add("toast-exit");

            toast.addEventListener(
                "animationend",
                () => toast.remove(),
                { once: true }
            );
        }

    </script>

</body>

</html>
