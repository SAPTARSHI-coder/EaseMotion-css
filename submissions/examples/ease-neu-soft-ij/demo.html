<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Add Neumorphic Soft-UI Utility for Web Layouts" />
  <title>Add Neumorphic Soft-UI Utility for Web Layouts | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="page-header">
    <h1>Add Neumorphic Soft-UI Utility for Web Layouts</h1>
    <p>A pure CSS component for the EaseMotion library.</p>
  </header>

  <main>

    <div class="neu-grid">
      <div class="neu-card">
        <div class="neu-icon">+</div>
        <span class="neu-label">Add Item</span>
      </div>
      <div class="neu-card neu-card--inset">
        <div class="neu-icon">-</div>
        <span class="neu-label">Remove</span>
      </div>
      <div class="neu-card">
        <div class="neu-icon">&hearts;</div>
        <span class="neu-label">Like</span>
      </div>
    </div>

    <div class="neu-divider"></div>

    <button type="button" class="neu-btn">Press Me</button>

  </main>
</body>
</html>
