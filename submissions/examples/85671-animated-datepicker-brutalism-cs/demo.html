<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Animated brutalist datepicker calendar built with HTML and CSS.">
    <title>Animated Brutalist Datepicker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="page">
        <section class="datepicker" aria-labelledby="datepicker-title">
            <header class="datepicker__header">
                <div>
                    <p class="eyebrow">EaseMotion / Calendar</p>
                    <h1 id="datepicker-title">Pick a date</h1>
                </div>

                <div class="month-switcher" aria-label="Month navigation">
                    <button class="nav-button" type="button" aria-label="Previous month">
                        &larr;
                    </button>
                    <span class="month-label">October 2026</span>
                    <button class="nav-button" type="button" aria-label="Next month">
                        &rarr;
                    </button>
                </div>
            </header>

            <div class="calendar" aria-label="October 2026">
                <div class="weekdays" aria-hidden="true">
                    <span>Sun</span>
                    <span>Mon</span>
                    <span>Tue</span>
                    <span>Wed</span>
                    <span>Thu</span>
                    <span>Fri</span>
                    <span>Sat</span>
                </div>

                <div class="days">
                    <button class="day day--muted" type="button" aria-label="September 27">
                        27
                    </button>
                    <button class="day day--muted" type="button" aria-label="September 28">
                        28
                    </button>
                    <button class="day day--muted" type="button" aria-label="September 29">
                        29
                    </button>
                    <button class="day day--muted" type="button" aria-label="September 30">
                        30
                    </button>

                    <button class="day" type="button">1</button>
                    <button class="day" type="button">2</button>
                    <button class="day" type="button">3</button>
                    <button class="day" type="button">4</button>
                    <button class="day" type="button">5</button>
                    <button class="day" type="button">6</button>
                    <button class="day" type="button">7</button>
                    <button class="day" type="button">8</button>
                    <button class="day" type="button">9</button>
                    <button class="day" type="button">10</button>
                    <button class="day" type="button">11</button>
                    <button class="day" type="button">12</button>
                    <button class="day" type="button">13</button>
                    <button class="day" type="button">14</button>
                    <button class="day" type="button">15</button>
                    <button class="day" type="button">16</button>
                    <button class="day" type="button">17</button>
                    <button class="day day--today" type="button" aria-current="date">18</button>
                    <button class="day" type="button">19</button>
                    <button class="day" type="button">20</button>
                    <button class="day" type="button">21</button>
                    <button class="day" type="button">22</button>
                    <button class="day" type="button">23</button>
                    <button class="day" type="button">24</button>
                    <button class="day" type="button">25</button>
                    <button class="day" type="button">26</button>
                    <button class="day" type="button">27</button>
                    <button class="day" type="button">28</button>
                    <button class="day" type="button">29</button>
                    <button class="day" type="button">30</button>
                    <button class="day" type="button">31</button>

                    <button class="day day--muted" type="button" aria-label="November 1">
                        1
                    </button>
                    <button class="day day--muted" type="button" aria-label="November 2">
                        2
                    </button>
                    <button class="day day--muted" type="button" aria-label="November 3">
                        3
                    </button>
                    <button class="day day--muted" type="button" aria-label="November 4">
                        4
                    </button>
                </div>
            </div>

            <footer class="datepicker__footer">
                <span class="selection-label">Selected</span>
                <strong>October 18, 2026</strong>
            </footer>
        </section>
    </main>
</body>

</html>
