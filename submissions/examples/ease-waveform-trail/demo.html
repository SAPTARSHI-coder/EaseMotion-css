<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Waveform Trail – Cursor Leaves Audio Waveform Trail</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <h1>〰️ Waveform Trail</h1>
    <p class="subtitle">Cursor leaves an audio waveform trail</p>

    <div class="waveform-container">
      <div class="waveform-stage" id="waveformStage">
        <canvas id="canvas"></canvas>
        
        <!-- Info overlay -->
        <div class="info-overlay">
          <span class="waveform-status" id="waveformStatus">〰️ Active</span>
          <span class="point-count" id="pointCount">✦ 0 points</span>
        </div>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <button class="ctrl-btn clear" id="clearBtn">🗑️ Clear</button>
      <button class="ctrl-btn toggle" id="toggleBtn">⏸ Pause</button>
      <button class="ctrl-btn reset" id="resetBtn">↺ Reset</button>
      <button class="ctrl-btn mode" id="modeBtn">🔄 Wave</button>
    </div>

    <!-- Sliders -->
    <div class="slider-container">
      <span class="slider-label">Trail Length</span>
      <input type="range" id="lengthSlider" min="20" max="200" value="80" step="5" />
      <span class="slider-value" id="lengthValue">80</span>
    </div>

    <div class="slider-container">
      <span class="slider-label">Wave Amplitude</span>
      <input type="range" id="amplitudeSlider" min="5" max="60" value="25" />
      <span class="slider-value" id="amplitudeValue">25px</span>
    </div>

    <div class="slider-container">
      <span class="slider-label">Wave Frequency</span>
      <input type="range" id="frequencySlider" min="1" max="10" value="4" />
      <span class="slider-value" id="frequencyValue">4×</span>
    </div>

    <div class="slider-container">
      <span class="slider-label">Trail Width</span>
      <input type="range" id="widthSlider" min="1" max="10" value="4" />
      <span class="slider-value" id="widthValue">4px</span>
    </div>

    <!-- Status -->
    <div class="status" id="status">〰️ Move your cursor to leave a waveform trail</div>

    <!-- Keyboard shortcuts -->
    <div class="shortcuts">
      <kbd>Mouse</kbd> Draw trail · <kbd>C</kbd> Clear · <kbd>Space</kbd> Pause · <kbd>R</kbd> Reset
    </div>
  </div>

  <script>
    (function() {
      "use strict";

      // DOM elements
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      const waveformStatus = document.getElementById('waveformStatus');
      const pointCount = document.getElementById('pointCount');
      const clearBtn = document.getElementById('clearBtn');
      const toggleBtn = document.getElementById('toggleBtn');
      const resetBtn = document.getElementById('resetBtn');
      const modeBtn = document.getElementById('modeBtn');
      const status = document.getElementById('status');
      const lengthSlider = document.getElementById('lengthSlider');
      const lengthValue = document.getElementById('lengthValue');
      const amplitudeSlider = document.getElementById('amplitudeSlider');
      const amplitudeValue = document.getElementById('amplitudeValue');
      const frequencySlider = document.getElementById('frequencySlider');
      const frequencyValue = document.getElementById('frequencyValue');
      const widthSlider = document.getElementById('widthSlider');
      const widthValue = document.getElementById('widthValue');

      // State
      let points = [];
      let isPaused = false;
      let animationId = null;
      let time = 0;
      let trailMode = 'wave'; // 'wave', 'line', 'spectrum'
      let mouseX = -100;
      let mouseY = -100;
      let isMouseOnCanvas = false;

      // ----- Canvas setup -----
      function setupCanvas() {
        const rect = canvas.parentElement.getBoundingClientRect();
        const size = Math.min(rect.width - 40, 600);
        canvas.width = size;
        canvas.height = size;
        canvas.style.width = size + 'px';
        canvas.style.height = size + 'px';
      }

      // ----- Add point -----
      function addPoint(x, y) {
        const maxPoints = parseInt(lengthSlider.value);
        points.push({ x, y, time: time });
        if (points.length > maxPoints) {
          points.shift();
        }
        pointCount.textContent = `✦ ${points.length} points`;
      }

      // ----- Draw waveform trail -----
      function drawWaveformTrail() {
        const w = canvas.width;
        const h = canvas.height;
        const amplitude = parseInt(amplitudeSlider.value);
        const frequency = parseInt(frequencySlider.value) / 2;
        const trailWidth = parseInt(widthSlider.value);
        const maxPoints = parseInt(lengthSlider.value);

        // Clear with fade effect
        ctx.clearRect(0, 0, w, h);

        // Background with subtle gradient
        const bgGradient = ctx.createRadialGradient(w/2, h/2, 0, w/2, h/2, w * 0.7);
        bgGradient.addColorStop(0, '#0a0a1a');
        bgGradient.addColorStop(0.5, '#060612');
        bgGradient.addColorStop(1, '#020208');
        ctx.fillStyle = bgGradient;
        ctx.fillRect(0, 0, w, h);

        if (points.length < 2) {
          // Draw instruction
          ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';
          ctx.font = '18px sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('〰️ Move your cursor here', w/2, h/2);
          return;
        }

        // Generate waveform points
        const wavePoints = [];
        const step = Math.max(1, Math.floor(points.length / 60));

        for (let i = 0; i < points.length - 1; i += step) {
          const p = points[i];
          const progress = i / points.length;
          const angle = progress * Math.PI * 2 * frequency + time;
          const waveOffset = Math.sin(angle) * amplitude * (1 - progress * 0.3);
          
          // Normal direction (perpendicular to movement)
          const nextIdx = Math.min(i + step, points.length - 1);
          const dx = points[nextIdx].x - p.x;
          const dy = points[nextIdx].y - p.y;
          const dist = Math.sqrt(dx * dx + dy * dy) || 1;
          const nx = -dy / dist;
          const ny = dx / dist;
          
          wavePoints.push({
            x: p.x + nx * waveOffset,
            y: p.y + ny * waveOffset,
            progress: progress,
            waveOffset: waveOffset
          });
        }

        // Draw waveform trail
        if (wavePoints.length > 1) {
          // Glow layer
          for (let i = 0; i < wavePoints.length - 1; i++) {
            const p = wavePoints[i];
            const progress = p.progress;
            const alpha = 0.05 + 0.3 * (1 - progress) * (0.5 + 0.5 * Math.sin(time + i * 0.1));
            const size = trailWidth * (0.5 + 0.5 * (1 - progress));
            
            // Glow
            const glowGrad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, size * 6);
            const hue = 220 + progress * 80 + Math.sin(time + i * 0.1) * 10;
            glowGrad.addColorStop(0, `hsla(${hue}, 100%, 70%, ${alpha * 0.2})`);
            glowGrad.addColorStop(1, `hsla(${hue}, 100%, 50%, 0)`);
            ctx.fillStyle = glowGrad;
            ctx.beginPath();
            ctx.arc(p.x, p.y, size * 6, 0, Math.PI * 2);
            ctx.fill();
          }

          // Draw waveform line
          ctx.beginPath();
          for (let i = 0; i < wavePoints.length; i++) {
            const p = wavePoints[i];
            const progress = p.progress;
            const alpha = 0.3 + 0.6 * (1 - progress);
            const size = trailWidth * (0.3 + 0.7 * (1 - progress));
            
            if (i === 0) {
              ctx.moveTo(p.x, p.y);
            } else {
              ctx.lineTo(p.x, p.y);
            }
            
            // Color shift along the trail
            const hue = 220 + progress * 80 + Math.sin(time + i * 0.05) * 10;
            ctx.strokeStyle = `hsla(${hue}, 100%, 70%, ${alpha})`;
            ctx.lineWidth = size;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.shadowColor = `hsla(${hue}, 100%, 60%, ${alpha * 0.2})`;
            ctx.shadowBlur = 15;
          }
          ctx.stroke();
          ctx.shadowBlur = 0;

          // Spectrum mode - draw vertical bars
          if (trailMode === 'spectrum') {
            for (let i = 0; i < wavePoints.length; i += 2) {
              const p = wavePoints[i];
              const progress = p.progress;
              const alpha = 0.2 + 0.5 * (1 - progress);
              const height = Math.abs(p.waveOffset) * 0.5 + 5;
              const hue = 220 + progress * 80 + Math.sin(time + i * 0.1) * 10;
              
              ctx.fillStyle = `hsla(${hue + 20}, 100%, 70%, ${alpha * 0.5})`;
              ctx.shadowColor = `hsla(${hue}, 100%, 60%, ${alpha * 0.1})`;
              ctx.shadowBlur = 8;
              ctx.fillRect(p.x - 2, p.y - height, 4, height * 2);
              ctx.shadowBlur = 0;
            }
          }

          // Draw waveform dots
          if (trailMode === 'dots') {
            for (let i = 0; i < wavePoints.length; i += 3) {
              const p = wavePoints[i];
              const progress = p.progress;
              const alpha = 0.2 + 0.6 * (1 - progress);
              const size = trailWidth * (0.3 + 0.7 * (1 - progress)) * 0.6;
              const hue = 220 + progress * 80 + Math.sin(time + i * 0.1) * 10;
              
              ctx.fillStyle = `hsla(${hue + 20}, 100%, 85%, ${alpha * 0.8})`;
              ctx.shadowColor = `hsla(${hue}, 100%, 60%, ${alpha * 0.2})`;
              ctx.shadowBlur = 12;
              ctx.beginPath();
              ctx.arc(p.x, p.y, size * 0.5, 0, Math.PI * 2);
              ctx.fill();
              ctx.shadowBlur = 0;
            }
          }
        }

        // Draw cursor indicator
        if (points.length > 0) {
          const last = points[points.length - 1];
          const size = trailWidth * 1.2;
          const hue = 240 + Math.sin(time * 2) * 10;
          
          // Cursor glow
          const cursorGlow = ctx.createRadialGradient(last.x, last.y, 0, last.x, last.y, size * 5);
          cursorGlow.addColorStop(0, `hsla(${hue}, 100%, 80%, 0.15)`);
          cursorGlow.addColorStop(1, `hsla(${hue}, 100%, 60%, 0)`);
          ctx.fillStyle = cursorGlow;
          ctx.beginPath();
          ctx.arc(last.x, last.y, size * 5, 0, Math.PI * 2);
          ctx.fill();

          // Cursor dot
          ctx.fillStyle = `hsla(${hue + 20}, 100%, 90%, 0.7)`;
          ctx.shadowColor = `hsla(${hue}, 100%, 70%, 0.2)`;
          ctx.shadowBlur = 15;
          ctx.beginPath();
          ctx.arc(last.x, last.y, size * 0.4, 0, Math.PI * 2);
          ctx.fill();
          ctx.shadowBlur = 0;
        }

        // Update status
        waveformStatus.textContent = isPaused ? '⏸ Paused' : '〰️ Active';
        if (points.length > 0) {
          pointCount.textContent = `✦ ${points.length} points`;
        }
      }

      // ----- Animation loop -----
      function animate() {
        time += 0.016;

        if (!isPaused) {
          // Add current mouse position if on canvas
          if (isMouseOnCanvas && mouseX >= 0 && mouseY >= 0) {
            addPoint(mouseX, mouseY);
          }
        }

        drawWaveformTrail();
        animationId = requestAnimationFrame(animate);
      }

      // ----- Start animation -----
      function startAnimation() {
        if (animationId) {
          cancelAnimationFrame(animationId);
        }
        animate();
      }

      // ----- Clear trail -----
      function clearTrail() {
        points = [];
        pointCount.textContent = '✦ 0 points';
        status.textContent = '🗑️ Trail cleared';
        setTimeout(() => {
          status.textContent = '〰️ Move your cursor to leave a waveform trail';
        }, 1500);
      }

      // ----- Toggle pause -----
      function togglePause() {
        isPaused = !isPaused;
        toggleBtn.textContent = isPaused ? '▶ Play' : '⏸ Pause';
        status.textContent = isPaused ? '⏸ Paused' : '▶ Resumed';
        waveformStatus.textContent = isPaused ? '⏸ Paused' : '〰️ Active';
      }

      // ----- Reset -----
      function resetWaveform() {
        points = [];
        isPaused = false;
        toggleBtn.textContent = '⏸ Pause';
        time = 0;
        pointCount.textContent = '✦ 0 points';
        waveformStatus.textContent = '〰️ Active';
        status.textContent = '↺ Reset';
        // Reset sliders
        lengthSlider.value = 80;
        lengthValue.textContent = '80';
        amplitudeSlider.value = 25;
        amplitudeValue.textContent = '25px';
        frequencySlider.value = 4;
        frequencyValue.textContent = '4×';
        widthSlider.value = 4;
        widthValue.textContent = '4px';
        setTimeout(() => {
          status.textContent = '〰️ Move your cursor to leave a waveform trail';
        }, 1000);
      }

      // ----- Toggle trail mode -----
      function toggleMode() {
        const modes = ['wave', 'spectrum', 'dots'];
        const currentIndex = modes.indexOf(trailMode);
        const nextIndex = (currentIndex + 1) % modes.length;
        trailMode = modes[nextIndex];
        const modeNames = { wave: '🌊 Wave', spectrum: '📊 Spectrum', dots: '✦ Dots' };
        modeBtn.textContent = modeNames[trailMode];
        status.textContent = `🔄 Trail mode: ${modeNames[trailMode]}`;
        setTimeout(() => {
          status.textContent = '〰️ Move your cursor to leave a waveform trail';
        }, 1500);
      }

      // ----- Event Listeners -----
      // Mouse tracking
      canvas.addEventListener('mousemove', (e) => {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        mouseX = (e.clientX - rect.left) * scaleX;
        mouseY = (e.clientY - rect.top) * scaleY;
        isMouseOnCanvas = true;
      });

      canvas.addEventListener('mouseenter', () => {
        isMouseOnCanvas = true;
        status.textContent = '〰️ Waveform trail active!';
      });

      canvas.addEventListener('mouseleave', () => {
        isMouseOnCanvas = false;
        status.textContent = '〰️ Move cursor back to continue';
      });

      // Touch support
      canvas.addEventListener('touchmove', (e) => {
        e.preventDefault();
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        const touch = e.touches[0];
        mouseX = (touch.clientX - rect.left) * scaleX;
        mouseY = (touch.clientY - rect.top) * scaleY;
        isMouseOnCanvas = true;
      });

      canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        const touch = e.touches[0];
        mouseX = (touch.clientX - rect.left) * scaleX;
        mouseY = (touch.clientY - rect.top) * scaleY;
        isMouseOnCanvas = true;
      });

      canvas.addEventListener('touchend', () => {
        isMouseOnCanvas = false;
      });

      // Buttons
      clearBtn.addEventListener('click', clearTrail);
      toggleBtn.addEventListener('click', togglePause);
      resetBtn.addEventListener('click', resetWaveform);
      modeBtn.addEventListener('click', toggleMode);

      // Sliders
      lengthSlider.addEventListener('input', (e) => {
        const val = parseInt(e.target.value);
        lengthValue.textContent = val;
        // Trim points if needed
        if (points.length > val) {
          points = points.slice(-val);
          pointCount.textContent = `✦ ${points.length} points`;
        }
      });

      amplitudeSlider.addEventListener('input', (e) => {
        amplitudeValue.textContent = e.target.value + 'px';
      });

      frequencySlider.addEventListener('input', (e) => {
        frequencyValue.textContent = e.target.value + '×';
      });

      widthSlider.addEventListener('input', (e) => {
        widthValue.textContent = e.target.value + 'px';
      });

      // Keyboard shortcuts
      document.addEventListener('keydown', (e) => {
        if (e.key === 'c' || e.key === 'C') {
          e.preventDefault();
          clearTrail();
        }
        if (e.key === ' ' || e.key === 'Space') {
          e.preventDefault();
          togglePause();
        }
        if (e.key === 'r' || e.key === 'R') {
          e.preventDefault();
          resetWaveform();
        }
        if (e.key === 'm' || e.key === 'M') {
          e.preventDefault();
          toggleMode();
        }
      });

      // ----- Resize handler -----
      let resizeTimeout;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(() => {
          setupCanvas();
        }, 200);
      });

      // ----- Init -----
      function init() {
        setupCanvas();
        startAnimation();
        status.textContent = '〰️ Move your cursor to leave a waveform trail!';
        modeBtn.textContent = '🌊 Wave';
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }

    })();
  </script>
</body>
</html>
