<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />
  <meta
    name="description"
    content="Interactive File Dropzone with Glassmorphism styling"
  />
  <title>Interactive File Dropzone - Glassmorphism</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main class="page">
    <section class="dropzone-wrapper" aria-labelledby="dropzone-title">
      <div class="glass-card">
        <div class="dropzone-header">
          <span class="eyebrow">FILE UPLOAD</span>
          <h1 id="dropzone-title">Interactive File Dropzone</h1>
          <p>
            Upload your files using the glassmorphism dropzone.
            Drag and drop or browse from your device.
          </p>
        </div>

        <label class="dropzone" for="file-input">
          <input
            id="file-input"
            class="file-input"
            type="file"
            multiple
            aria-describedby="file-help"
          />

          <span class="upload-icon" aria-hidden="true">
            <svg
              viewBox="0 0 24 24"
              role="presentation"
              focusable="false"
            >
              <path
                d="M12 16V4m0 0L7 9m5-5 5 5M5 15v3a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-3"
              />
            </svg>
          </span>

          <span class="dropzone-title">
            Drop your files here
          </span>

          <span class="dropzone-subtitle">
            or click to browse
          </span>

          <span class="browse-button">
            Choose Files
          </span>

          <span id="file-help" class="file-help">
            PNG, JPG, PDF, DOCX up to 10MB
          </span>
        </label>

        <div class="upload-status" aria-live="polite">
          <span class="status-dot" aria-hidden="true"></span>
          <span>Secure upload area</span>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
