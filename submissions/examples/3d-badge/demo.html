<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Badge with Gradient Styling - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="em-demo-container">
        <!-- Pure CSS 3D Badge Component Showcase -->
        <header class="em-badge-card" role="region" aria-label="3D Badge Showcase" tabindex="0">
            <div class="em-badge-header-bar">
                <span class="em-card-badge">COMPONENT CONTRIBUTION</span>
                <span class="em-brand-logo">GradientMotion</span>
            </div>
            <h1 class="em-card-title">3D Gradient Badge</h1>
            <p class="em-card-desc">A fully responsive, pure CSS 3D badge component featuring multi-stop gradients, depth shadow elevation, and frosted glassmorphism.</p>
            <div class="em-badge-wrapper">
                <div class="em-3d-badge">
                    <span class="em-badge-text">PRO EDITION</span>
                </div>
            </div>
        </header>
    </div>
</body>
</html>
