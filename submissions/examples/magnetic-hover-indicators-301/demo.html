<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Liquid Glass Navigation</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="demo">

    <div class="ambient ambient-one"></div>
    <div class="ambient ambient-two"></div>
    <div class="ambient ambient-three"></div>


    <section class="hero">

      <span class="eyebrow">
        EASEMOTION
      </span>

      <h1>
        Liquid Glass
        <span>Navigation</span>
      </h1>

      <p>
        Move your pointer across the navigation items
        to experience the magnetic hover indicator.
      </p>

    </section>


    <nav
      class="glass-nav"
      id="glassNav"
      aria-label="Main navigation"
    >

      <div
        class="magnetic-indicator"
        id="magneticIndicator"
        aria-hidden="true"
      ></div>


      <a
        href="#home"
        class="nav-item active"
        data-label="Home"
      >
        <span class="nav-icon">⌂</span>
        <span class="nav-text">Home</span>
      </a>


      <a
        href="#explore"
        class="nav-item"
        data-label="Explore"
      >
        <span class="nav-icon">◈</span>
        <span class="nav-text">Explore</span>
      </a>


      <a
        href="#projects"
        class="nav-item"
        data-label="Projects"
      >
        <span class="nav-icon">✦</span>
        <span class="nav-text">Projects</span>
      </a>


      <a
        href="#about"
        class="nav-item"
        data-label="About"
      >
        <span class="nav-icon">○</span>
        <span class="nav-text">About</span>
      </a>


      <a
        href="#contact"
        class="nav-item"
        data-label="Contact"
      >
        <span class="nav-icon">↗</span>
        <span class="nav-text">Contact</span>
      </a>

    </nav>


    <div class="status">
      <span class="status-dot"></span>
      <span id="statusText">
        Hover over navigation
      </span>
    </div>

  </main>


  <script>

    const navigation =
      document.getElementById("glassNav");

    const indicator =
      document.getElementById("magneticIndicator");

    const navItems =
      document.querySelectorAll(".nav-item");

    const statusText =
      document.getElementById("statusText");


    let activeItem =
      document.querySelector(".nav-item.active");


    function moveIndicator(item) {

      if (!item) {
        return;
      }


      const navRect =
        navigation.getBoundingClientRect();

      const itemRect =
        item.getBoundingClientRect();


      const left =
        itemRect.left -
        navRect.left;


      const top =
        itemRect.top -
        navRect.top;


      indicator.style.width =
        `${itemRect.width}px`;


      indicator.style.height =
        `${itemRect.height}px`;


      indicator.style.transform =
        `translate3d(${left}px, ${top}px, 0)`;


      indicator.classList.add("visible");

    }


    function activateItem(item) {

      navItems.forEach((navItem) => {

        navItem.classList.remove("active");

      });


      item.classList.add("active");

      activeItem = item;

      moveIndicator(item);

      statusText.textContent =
        `${item.dataset.label} selected`;

    }


    navItems.forEach((item) => {


      item.addEventListener(
        "pointerenter",
        () => {

          moveIndicator(item);

          item.classList.add("hovered");

          statusText.textContent =
            `${item.dataset.label}`;

        }
      );


      item.addEventListener(
        "pointerleave",
        () => {

          item.classList.remove("hovered");

        }
      );


      item.addEventListener(
        "click",
        (event) => {

          event.preventDefault();

          activateItem(item);

        }
      );


      /*
       * Magnetic movement.
       *
       * The navigation content moves slightly
       * toward the pointer while hovering.
       */

      item.addEventListener(
        "pointermove",
        (event) => {

          const rect =
            item.getBoundingClientRect();


          const relativeX =
            event.clientX -
            (rect.left + rect.width / 2);


          const relativeY =
            event.clientY -
            (rect.top + rect.height / 2);


          const strength = 0.18;


          item.style.transform =
            `translate(
              ${relativeX * strength}px,
              ${relativeY * strength}px
            )`;

        }
      );


      item.addEventListener(
        "pointerleave",
        () => {

          item.style.transform =
            "translate(0, 0)";

        }
      );

    });


    /*
     * Hide indicator when pointer leaves
     * the entire navigation.
     */

    navigation.addEventListener(
      "pointerleave",
      () => {

        indicator.classList.remove(
          "visible"
        );

        statusText.textContent =
          "Hover over navigation";

      }
    );


    navigation.addEventListener(
      "pointerenter",
      () => {

        indicator.classList.add(
          "visible"
        );

      }
    );


    /*
     * Position indicator initially.
     */

    window.addEventListener(
      "load",
      () => {

        moveIndicator(activeItem);

      }
    );


    /*
     * Keep indicator aligned after resizing.
     */

    window.addEventListener(
      "resize",
      () => {

        moveIndicator(activeItem);

      }
    );

  </script>

</body>
</html>
