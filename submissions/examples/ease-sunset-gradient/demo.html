<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sunset Gradient · sky shifts through sunset colors</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <div class="sunset-container">
      <div class="sunset-display" id="sunsetDisplay">
        <!-- Canvas for sunset gradient -->
        <canvas id="sunsetCanvas"></canvas>
        
        <!-- Sunset Info -->
        <div class="sunset-info">
          <span class="info-label">🌅 Time</span>
          <span class="info-value" id="timeDisplay">Sunset</span>
        </div>

        <!-- Sunset Controls -->
        <div class="sunset-controls">
          <div class="control-group">
            <label class="control-label">🌅 Progress</label>
            <input type="range" class="control-slider" id="progressSlider" min="0" max="100" value="50">
            <span class="control-value" id="progressValue">50%</span>
          </div>
          <div class="control-group">
            <label class="control-label">🎨 Palette</label>
            <div class="palette-options">
              <button class="palette-btn active" data-palette="sunset" title="Sunset">🌅</button>
              <button class="palette-btn" data-palette="aurora" title="Aurora">🌌</button>
              <button class="palette-btn" data-palette="fire" title="Fire">🔥</button>
              <button class="palette-btn" data-palette="ocean" title="Ocean">🌊</button>
            </div>
          </div>
        </div>

        <!-- Sunset Text -->
        <div class="sunset-text">
          <span class="text-label">🌅 Sunset</span>
          <span class="text-message" id="sunsetMessage">Watch the sky shift through sunset colors</span>
        </div>
      </div>
      
      <div class="sunset-status">
        <span id="sunsetStatus">🌅 The sky shifts through sunset colors</span>
      </div>
    </div>

    <div class="controls">
      <button class="btn btn-animate" id="animateBtn">▶ Auto</button>
      <button class="btn btn-reset" id="resetBtn">⟳ Reset</button>
    </div>
    <div class="footer-note">
      <span>🌅 sunset gradient · 4 palettes · time of day</span>
    </div>
  </div>

  <script>
    (function() {
      "use strict";

      // DOM refs
      const canvas = document.getElementById('sunsetCanvas');
      const ctx = canvas.getContext('2d');
      const display = document.getElementById('sunsetDisplay');
      const timeDisplay = document.getElementById('timeDisplay');
      const sunsetStatus = document.getElementById('sunsetStatus');
      const sunsetMessage = document.getElementById('sunsetMessage');
      const animateBtn = document.getElementById('animateBtn');
      const resetBtn = document.getElementById('resetBtn');
      const progressSlider = document.getElementById('progressSlider');
      const progressValue = document.getElementById('progressValue');
      const paletteBtns = document.querySelectorAll('.palette-btn');

      // State
      let progress = 50;
      let targetProgress = 50;
      let currentPalette = 'sunset';
      let isAnimating = false;
      let animationId = null;
      let time = 0;

      // Color palettes
      const palettes = {
        sunset: {
          name: 'Sunset',
          colors: [
            ['#0a0a2a', '#1a0a2a', '#2a0a3a'],
            ['#4a1a4a', '#6a2a4a', '#8a3a4a'],
            ['#aa4a4a', '#ca5a4a', '#ea6a4a'],
            ['#f97a4a', '#f98a3a', '#f99a2a'],
            ['#f9aa1a', '#f9ba0a', '#f9ca0a']
          ],
          times: ['Night', 'Dusk', 'Sunset', 'Golden Hour', 'Day']
        },
        aurora: {
          name: 'Aurora',
          colors: [
            ['#0a0a2a', '#0a0a3a', '#0a1a4a'],
            ['#0a2a5a', '#0a3a6a', '#0a4a7a'],
            ['#2a5a7a', '#4a6a8a', '#6a7a9a'],
            ['#8a9aaa', '#aababa', '#cadaaa'],
            ['#eafaaa', '#fafaaa', '#fafaaa']
          ],
          times: ['Night', 'Dawn', 'Morning', 'Day', 'Bright']
        },
        fire: {
          name: 'Fire',
          colors: [
            ['#0a0a0a', '#1a0a0a', '#2a0a0a'],
            ['#3a0a0a', '#4a0a0a', '#5a0a0a'],
            ['#7a1a0a', '#9a2a0a', '#ba3a0a'],
            ['#da4a0a', '#ea5a0a', '#f97a1a'],
            ['#f99a2a', '#f9ba3a', '#f9da4a']
          ],
          times: ['Dark', 'Ember', 'Flame', 'Blaze', 'Inferno']
        },
        ocean: {
          name: 'Ocean',
          colors: [
            ['#0a0a2a', '#0a0a3a', '#0a1a4a'],
            ['#0a2a5a', '#0a3a6a', '#0a4a7a'],
            ['#1a5a8a', '#2a6a9a', '#3a7aaa'],
            ['#5a8aba', '#7a9aca', '#9aaada'],
            ['#babad', '#dadaea', '#fafafa']
          ],
          times: ['Deep', 'Twilight', 'Blue', 'Cyan', 'Light']
        }
      };

      // Get color at progress
      function getColorAtProgress(progress, palette) {
        const paletteData = palettes[palette];
        const colors = paletteData.colors;
        const totalStops = colors.length - 1;
        const pos = (progress / 100) * totalStops;
        const index = Math.floor(pos);
        const frac = pos - index;
        
        if (index >= totalStops) return colors[totalStops];
        if (index < 0) return colors[0];
        
        const c1 = colors[index];
        const c2 = colors[index + 1];
        
        // Interpolate each color in the row
        return c1.map((col, i) => {
          const c2Val = c2[i] || col;
          return interpolateColor(col, c2Val, frac);
        });
      }

      // Interpolate two hex colors
      function interpolateColor(hex1, hex2, t) {
        const r1 = parseInt(hex1.slice(1,3), 16);
        const g1 = parseInt(hex1.slice(3,5), 16);
        const b1 = parseInt(hex1.slice(5,7), 16);
        const r2 = parseInt(hex2.slice(1,3), 16);
        const g2 = parseInt(hex2.slice(3,5), 16);
        const b2 = parseInt(hex2.slice(5,7), 16);
        
        const r = Math.round(r1 + (r2 - r1) * t);
        const g = Math.round(g1 + (g2 - g1) * t);
        const b = Math.round(b1 + (b2 - b1) * t);
        
        return `#${r.toString(16).padStart(2, '0')}${g.toString(16).padStart(2, '0')}${b.toString(16).padStart(2, '0')}`;
      }

      // Get time name
      function getTimeName(progress, palette) {
        const paletteData = palettes[palette];
        const times = paletteData.times;
        const totalStops = times.length - 1;
        const pos = (progress / 100) * totalStops;
        const index = Math.round(pos);
        return times[Math.min(index, totalStops)];
      }

      // Draw sunset
      function drawSunset(progress, palette) {
        const w = canvas.width;
        const h = canvas.height;
        const paletteData = palettes[palette];
        
        // Get colors at different heights
        const colors = [];
        const steps = 50;
        for (let i = 0; i <= steps; i++) {
          const p = (i / steps) * 100;
          const colorRow = getColorAtProgress(p, palette);
          // Use the middle color of the row (index 2 or interpolated)
          const rowColors = getColorAtProgress(p, palette);
          // For gradient, we need a single color per row
          const midColor = getColorAtProgress(p, palette);
          colors.push(midColor);
        }
        
        // Draw gradient
        for (let i = 0; i < steps; i++) {
          const y1 = (i / steps) * h;
          const y2 = ((i + 1) / steps) * h;
          const color = colors[i];
          
          const grad = ctx.createLinearGradient(0, y1, 0, y2);
          const nextColor = colors[Math.min(i + 1, steps - 1)];
          grad.addColorStop(0, color);
          grad.addColorStop(1, nextColor);
          
          ctx.fillStyle = grad;
          ctx.fillRect(0, y1, w, y2 - y1 + 1);
        }
        
        // Sun
        const sunY = h * (0.3 + (progress / 100) * 0.4);
        const sunX = w * (0.1 + (progress / 100) * 0.8);
        const sunRadius = Math.min(w, h) * 0.06;
        
        // Sun glow
        ctx.save();
        const sunGrad = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, sunRadius * 4);
        const sunColor = getColorAtProgress(Math.min(progress + 10, 100), palette);
        sunGrad.addColorStop(0, 'rgba(255, 200, 100, 0.6)');
        sunGrad.addColorStop(0.2, 'rgba(255, 150, 50, 0.3)');
        sunGrad.addColorStop(0.5, 'rgba(255, 100, 0, 0.1)');
        sunGrad.addColorStop(1, 'rgba(255, 50, 0, 0)');
        ctx.fillStyle = sunGrad;
        ctx.beginPath();
        ctx.arc(sunX, sunY, sunRadius * 4, 0, Math.PI * 2);
        ctx.fill();
        
        // Sun core
        const coreGrad = ctx.createRadialGradient(sunX - sunRadius * 0.2, sunY - sunRadius * 0.2, 0, sunX, sunY, sunRadius);
        coreGrad.addColorStop(0, '#fff8e8');
        coreGrad.addColorStop(0.3, '#fde68a');
        coreGrad.addColorStop(0.7, '#fbbf24');
        coreGrad.addColorStop(1, '#f59e0b');
        ctx.fillStyle = coreGrad;
        ctx.shadowColor = '#fbbf24';
        ctx.shadowBlur = 30;
        ctx.beginPath();
        ctx.arc(sunX, sunY, sunRadius, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.restore();
        
        // Clouds
        drawClouds(w, h, progress, palette);
        
        // Update time display
        const timeName = getTimeName(progress, palette);
        timeDisplay.textContent = timeName;
        timeDisplay.style.color = getColorAtProgress(progress, palette);
        
        // Update status
        if (progress > 80) {
          sunsetStatus.textContent = '☀️ The sun shines brightly!';
          sunsetStatus.style.color = '#fbbf24';
        } else if (progress > 50) {
          sunsetStatus.textContent = '🌅 The sun is setting in golden light';
          sunsetStatus.style.color = '#f59e0b';
        } else if (progress > 20) {
          sunsetStatus.textContent = '🌆 The sky shifts through twilight colors';
          sunsetStatus.style.color = '#818cf8';
        } else {
          sunsetStatus.textContent = '🌙 The night sky stretches above';
          sunsetStatus.style.color = '#94a3b8';
        }
      }

      // Draw clouds
      function drawClouds(w, h, progress, palette) {
        const cloudData = [
          { x: 0.15, y: 0.15, size: 0.08 },
          { x: 0.35, y: 0.12, size: 0.1 },
          { x: 0.55, y: 0.18, size: 0.07 },
          { x: 0.75, y: 0.10, size: 0.09 },
          { x: 0.90, y: 0.16, size: 0.06 }
        ];
        
        const sunY = h * (0.3 + (progress / 100) * 0.4);
        const sunX = w * (0.1 + (progress / 100) * 0.8);
        
        cloudData.forEach(cloud => {
          const cx = cloud.x * w;
          const cy = cloud.y * h + (1 - progress / 100) * 20;
          const size = cloud.size * Math.min(w, h);
          
          // Only show clouds during certain times
          if (progress > 10 && progress < 85) {
            ctx.save();
            const alpha = 0.15 + (1 - Math.abs(progress - 50) / 50) * 0.2;
            ctx.globalAlpha = alpha;
            
            const cloudGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, size);
            const cloudColor = getColorAtProgress(progress, palette);
            cloudGrad.addColorStop(0, 'rgba(255,255,255,0.3)');
            cloudGrad.addColorStop(0.5, 'rgba(255,255,255,0.1)');
            cloudGrad.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = cloudGrad;
            
            for (let i = 0; i < 5; i++) {
              const ox = (Math.random() - 0.5) * size * 0.6;
              const oy = (Math.random() - 0.5) * size * 0.3;
              ctx.beginPath();
              ctx.arc(cx + ox, cy + oy, size * (0.2 + Math.random() * 0.3), 0, Math.PI * 2);
              ctx.fill();
            }
            
            ctx.restore();
          }
        });
      }

      // Resize canvas
      function resizeCanvas() {
        const rect = display.getBoundingClientRect();
        canvas.width = rect.width;
        canvas.height = rect.height;
        canvas.style.width = rect.width + 'px';
        canvas.style.height = rect.height + 'px';
        drawSunset(progress, currentPalette);
      }

      // Set progress
      function setProgress(value) {
        progress = Math.max(0, Math.min(100, parseInt(value)));
        progressSlider.value = progress;
        progressValue.textContent = progress + '%';
        drawSunset(progress, currentPalette);
      }

      // Set palette
      function setPalette(palette) {
        currentPalette = palette;
        paletteBtns.forEach(btn => {
          btn.classList.toggle('active', btn.dataset.palette === palette);
        });
        const paletteData = palettes[palette];
        sunsetStatus.textContent = `🎨 Palette: ${paletteData.name}`;
        sunsetStatus.style.color = '#a78bfa';
        drawSunset(progress, currentPalette);
        setTimeout(() => {
          sunsetStatus.textContent = '🌅 The sky shifts through sunset colors';
          sunsetStatus.style.color = '#94a3b8';
        }, 1500);
      }

      // Toggle animation
      function toggleAnimation() {
        if (isAnimating) {
          isAnimating = false;
          if (animationId) {
            cancelAnimationFrame(animationId);
            animationId = null;
          }
          animateBtn.textContent = '▶ Auto';
          animateBtn.style.background = 'linear-gradient(135deg, #6366f1, #4f46e5)';
          animateBtn.style.borderColor = '#818cf8';
        } else {
          isAnimating = true;
          animateBtn.textContent = '⏹ Stop';
          animateBtn.style.background = 'linear-gradient(135deg, #ef4444, #dc2626)';
          animateBtn.style.borderColor = '#f87171';
          let direction = 1;
          
          function step() {
            if (!isAnimating) return;
            let newProgress = progress + direction * 0.5;
            if (newProgress >= 100) {
              newProgress = 100;
              direction = -1;
            } else if (newProgress <= 0) {
              newProgress = 0;
              direction = 1;
            }
            setProgress(newProgress);
            animationId = requestAnimationFrame(step);
          }
          
          step();
        }
      }

      // Reset
      function resetSunset() {
        if (isAnimating) {
          toggleAnimation();
        }
        setProgress(50);
        sunsetStatus.textContent = '🔄 Reset complete';
        sunsetStatus.style.color = '#94a3b8';
        sunsetMessage.textContent = 'Watch the sky shift through sunset colors';
        sunsetMessage.style.color = '#94a3b8';
        setTimeout(() => {
          sunsetStatus.textContent = '🌅 The sky shifts through sunset colors';
          sunsetStatus.style.color = '#94a3b8';
        }, 1000);
      }

      // Event listeners
      progressSlider.addEventListener('input', function() {
        if (isAnimating) toggleAnimation();
        setProgress(this.value);
      });

      paletteBtns.forEach(btn => {
        btn.addEventListener('click', function() {
          setPalette(this.dataset.palette);
        });
      });

      if (animateBtn) {
        animateBtn.addEventListener('click', function(e) {
          e.preventDefault();
          toggleAnimation();
        });
      }

      if (resetBtn) {
        resetBtn.addEventListener('click', function(e) {
          e.preventDefault();
          resetSunset();
        });
      }

      // Keyboard shortcuts
      document.addEventListener('keydown', function(e) {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

        const key = e.key;
        if (key === ' ' || key === 'Space') {
          e.preventDefault();
          toggleAnimation();
        } else if (key === 'r' || key === 'R') {
          e.preventDefault();
          resetSunset();
        }
      });

      // Resize
      window.addEventListener('resize', resizeCanvas);

      // Initialize
      resizeCanvas();
      setProgress(50);
      
      console.log('🌅 Sunset Gradient ready · shortcuts: [Space] Auto, [R] Reset');
    })();
  </script>
</body>
</html>
