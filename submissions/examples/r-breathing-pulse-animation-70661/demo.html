<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <meta
    name="description"
    content="CSS breathing pulse animation for focused interface elements."
  >
  <title>CSS Breathing Pulse Animation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="demo">
    <section class="demo-card" aria-labelledby="page-title">

      <span class="eyebrow">EASEMOTION CSS</span>

      <h1 id="page-title">Breathing Pulse</h1>

      <p class="description">
        A calm, continuous pulse effect that gently expands and contracts
        around a focus element using pure CSS.
      </p>

      <div class="pulse-stage">

        <div class="pulse-wrapper">
          <span class="pulse-ring ring-one" aria-hidden="true"></span>
          <span class="pulse-ring ring-two" aria-hidden="true"></span>

          <button
            class="pulse-button"
            type="button"
            aria-label="Breathing pulse demo"
          >
            <span class="pulse-icon" aria-hidden="true">✦</span>
            <span>Focus</span>
          </button>
        </div>

      </div>

      <p class="hint">
        The pulse runs continuously using CSS keyframes.
      </p>

    </section>
  </main>

</body>
</html>
