<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notification Toast — EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <p class="label">Pure CSS Notification Toast Banner</p>

  <div class="ease-toast-v7">
    <span class="ease-toast-icon-v7">🔔</span>
    <div class="ease-toast-content-v7">
      <span class="ease-toast-title-v7">Notification</span>
      <span class="ease-toast-desc-v7">Component copied to clipboard.</span>
    </div>
    <div class="ease-toast-timer-v7"></div>
  </div>

</body>
</html>
