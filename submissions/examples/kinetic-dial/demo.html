<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <meta
    name="description"
    content="Kinetic Dial interactive measurement component"
  />

  <title>Kinetic Dial</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <main class="page">

    <section class="dial-card">

      <!-- Header -->

      <header class="card-header">

        <div class="header-copy">

          <span class="eyebrow">
            LIVE TELEMETRY
          </span>

          <h1>
            Kinetic Dial
          </h1>

          <p>
            A mechanical-inspired circular control
            for displaying continuous measurements.
          </p>

        </div>

        <div class="connection-status">

          <span class="connection-dot"></span>

          <span>
            CONNECTED
          </span>

        </div>

      </header>


      <!-- Main Dial -->

      <div class="dial-stage">

        <div
          class="kinetic-dial"
          id="kineticDial"
          aria-label="System load"
        >

          <!-- Decorative outer rings -->

          <div class="outer-ring outer-ring-one"></div>

          <div class="outer-ring outer-ring-two"></div>


          <!-- Tick marks -->

          <div
            class="ticks"
            aria-hidden="true"
          >

            <span class="tick tick-1"></span>
            <span class="tick tick-2"></span>
            <span class="tick tick-3"></span>
            <span class="tick tick-4"></span>
            <span class="tick tick-5"></span>
            <span class="tick tick-6"></span>
            <span class="tick tick-7"></span>
            <span class="tick tick-8"></span>
            <span class="tick tick-9"></span>
            <span class="tick tick-10"></span>
            <span class="tick tick-11"></span>
            <span class="tick tick-12"></span>
            <span class="tick tick-13"></span>
            <span class="tick tick-14"></span>
            <span class="tick tick-15"></span>
            <span class="tick tick-16"></span>
            <span class="tick tick-17"></span>
            <span class="tick tick-18"></span>
            <span class="tick tick-19"></span>
            <span class="tick tick-20"></span>
            <span class="tick tick-21"></span>
            <span class="tick tick-22"></span>
            <span class="tick tick-23"></span>
            <span class="tick tick-24"></span>

          </div>


          <!-- Active Arc -->

          <div
            class="dial-progress"
            id="dialProgress"
          ></div>


          <!-- Inner face -->

          <div class="dial-face">

            <div class="face-grid"></div>

            <div class="dial-value">

              <span
                id="dialValue"
                aria-live="polite"
              >
                72
              </span>

              <small>
                %
              </small>

            </div>

            <div class="dial-label">
              SYSTEM LOAD
            </div>

            <div
              class="dial-status"
              id="dialStatus"
            >
              HIGH
            </div>

            <!-- Needle -->

            <div
              class="needle"
              id="needle"
              aria-hidden="true"
            >

              <div class="needle-line"></div>

              <div class="needle-tip"></div>

            </div>

            <div class="needle-center"></div>

          </div>


          <!-- Measurement labels -->

          <span class="dial-min">
            0
          </span>

          <span class="dial-max">
            100
          </span>

        </div>

      </div>


      <!-- Controls -->

      <div class="control-panel">

        <div class="control-heading">

          <div>
            <span class="control-label">
              ADJUST LOAD
            </span>

            <span class="control-description">
              Drag to change the system load
            </span>
          </div>

          <span
            class="control-current"
            id="controlCurrent"
          >
            72%
          </span>

        </div>


        <input
          id="dialSlider"
          class="dial-slider"
          type="range"
          min="0"
          max="100"
          value="72"
          step="1"
          aria-label="System load percentage"
        />


        <div class="range-labels">

          <span>
            LOW
          </span>

          <span>
            MAXIMUM
          </span>

        </div>

      </div>


      <!-- Telemetry -->

      <div class="telemetry">

        <div class="telemetry-item">

          <span class="telemetry-label">
            CURRENT
          </span>

          <strong id="telemetryCurrent">
            72%
          </strong>

        </div>


        <div class="telemetry-divider"></div>


        <div class="telemetry-item">

          <span class="telemetry-label">
            STATE
          </span>

          <strong id="telemetryState">
            HIGH
          </strong>

        </div>


        <div class="telemetry-divider"></div>


        <div class="telemetry-item">

          <span class="telemetry-label">
            RANGE
          </span>

          <strong>
            0–100
          </strong>

        </div>

      </div>

    </section>

  </main>


  <script>

    const slider =
      document.getElementById("dialSlider");

    const dial =
      document.getElementById("kineticDial");

    const progress =
      document.getElementById("dialProgress");

    const needle =
      document.getElementById("needle");

    const value =
      document.getElementById("dialValue");

    const current =
      document.getElementById("controlCurrent");

    const status =
      document.getElementById("dialStatus");

    const telemetryCurrent =
      document.getElementById("telemetryCurrent");

    const telemetryState =
      document.getElementById("telemetryState");


    function getState(number) {

      if (number >= 90) {
        return "CRITICAL";
      }

      if (number >= 70) {
        return "HIGH";
      }

      if (number >= 40) {
        return "ELEVATED";
      }

      return "NORMAL";
    }


    function updateDial(number) {

      const percentage =
        Number(number);

      const state =
        getState(percentage);


      /*
        The dial travels through a 270° arc.

        -135° = minimum
        +135° = maximum
      */

      const rotation =
        -135 + (percentage * 2.7);


      dial.style.setProperty(
        "--value",
        percentage
      );


      dial.style.setProperty(
        "--rotation",
        `${rotation}deg`
      );


      progress.style.setProperty(
        "--progress",
        `${percentage * 2.7}deg`
      );


      needle.style.transform =
        `translate(-50%, -100%) rotate(${rotation}deg)`;


      value.textContent =
        percentage;


      current.textContent =
        `${percentage}%`;


      telemetryCurrent.textContent =
        `${percentage}%`;


      status.textContent =
        state;


      telemetryState.textContent =
        state;


      dial.dataset.state =
        state.toLowerCase();

    }


    slider.addEventListener(
      "input",
      event => {

        updateDial(
          event.target.value
        );

      }
    );


    updateDial(
      slider.value
    );

  </script>

</body>

</html>
