<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ease Spotlight Text</title>
    <link rel="stylesheet" href="../../../easemotion.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="ease-spotlight-wrapper">
        
        <!-- The 3x3 invisible grid that tracks the mouse hover -->
        <div class="ease-spotlight-grid-cell spot-top-left"></div>
        <div class="ease-spotlight-grid-cell spot-top-center"></div>
        <div class="ease-spotlight-grid-cell spot-top-right"></div>
        
        <div class="ease-spotlight-grid-cell spot-mid-left"></div>
        <div class="ease-spotlight-grid-cell spot-mid-center"></div>
        <div class="ease-spotlight-grid-cell spot-mid-right"></div>
        
        <div class="ease-spotlight-grid-cell spot-bot-left"></div>
        <div class="ease-spotlight-grid-cell spot-bot-center"></div>
        <div class="ease-spotlight-grid-cell spot-bot-right"></div>
        
        <!-- The text that gets revealed by the gradient spotlight -->
        <div class="ease-spotlight-text-container">
            <h1 class="ease-spotlight-text">
                Pure CSS Spotlight Reveal
            </h1>
            <p class="ease-spotlight-subtext">
                Hover around this box to illuminate the hidden text underneath using a radial gradient and CSS sibling selectors. No JavaScript required.
            </p>
        </div>

    </div>
</body>
</html>
