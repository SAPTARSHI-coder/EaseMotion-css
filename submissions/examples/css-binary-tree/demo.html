<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <meta
    name="description"
    content="CSS-only animated binary tree diagram"
  >
  <title>CSS Binary Tree Diagram</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="page">

    <header class="intro">
      <p class="eyebrow">EaseMotion CSS</p>

      <h1>CSS Binary Tree</h1>

      <p>
        An animated binary tree data structure created
        using only HTML and CSS.
      </p>
    </header>

    <section
      class="tree-section"
      aria-labelledby="tree-title"
    >

      <h2 id="tree-title" class="sr-only">
        Binary tree data structure
      </h2>

      <div
        class="tree"
        role="tree"
        aria-label="Binary tree with seven nodes"
        tabindex="0"
      >

        <!-- Connections -->
        <div class="line line-root-left"></div>
        <div class="line line-root-right"></div>

        <div class="line line-left-left"></div>
        <div class="line line-left-right"></div>

        <div class="line line-right-left"></div>
        <div class="line line-right-right"></div>

        <!-- Root -->
        <div
          class="node node-root"
          role="treeitem"
          aria-label="Root node 50"
          tabindex="0"
        >
          50
        </div>

        <!-- Level 2 -->
        <div
          class="node node-30"
          role="treeitem"
          aria-label="Node 30"
          tabindex="0"
        >
          30
        </div>

        <div
          class="node node-70"
          role="treeitem"
          aria-label="Node 70"
          tabindex="0"
        >
          70
        </div>

        <!-- Level 3 -->
        <div
          class="node node-20"
          role="treeitem"
          aria-label="Node 20"
          tabindex="0"
        >
          20
        </div>

        <div
          class="node node-40"
          role="treeitem"
          aria-label="Node 40"
          tabindex="0"
        >
          40
        </div>

        <div
          class="node node-60"
          role="treeitem"
          aria-label="Node 60"
          tabindex="0"
        >
          60
        </div>

        <div
          class="node node-80"
          role="treeitem"
          aria-label="Node 80"
          tabindex="0"
        >
          80
        </div>

      </div>

      <p class="hint">
        Hover or focus a node to highlight it.
      </p>

    </section>

  </main>

</body>
</html>
