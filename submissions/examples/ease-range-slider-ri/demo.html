<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animated Range Slider Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="range-slider-wrapper">
    <div class="slider-container">
      
      <!-- Range Slider Component matching Issue Snippet -->
      <label class="range" id="volume-range-label">
        <span data-value="60%">Volume</span>
        <input type="range" id="volume-slider" min="0" max="100" value="60">
      </label>

      <!-- Micro-interaction Helper ticks -->
      <div class="slider-ticks">
        <span onclick="setSliderValue(0)">Min</span>
        <span onclick="setSliderValue(25)">25%</span>
        <span onclick="setSliderValue(50)">50%</span>
        <span onclick="setSliderValue(75)">75%</span>
        <span onclick="setSliderValue(100)">Max</span>
      </div>

    </div>
  </div>

  <script>
    const slider = document.getElementById('volume-slider');
    const labelSpan = document.querySelector('#volume-range-label span');

    function updateSliderFill(value) {
      // Calculates percentage and sets gradients for CSS background fill
      const percentage = (value - slider.min) / (slider.max - slider.min) * 100;
      slider.style.backgroundSize = `${percentage}% 100%`;
      labelSpan.setAttribute('data-value', `${Math.round(value)}%`);
    }

    // Initialize layout on load
    updateSliderFill(slider.value);

    // Bind change/input events
    slider.addEventListener('input', (e) => {
      updateSliderFill(e.target.value);
    });

    // Tick selection helper
    function setSliderValue(val) {
      slider.value = val;
      updateSliderFill(val);
    }
  </script>
</body>
</html>
