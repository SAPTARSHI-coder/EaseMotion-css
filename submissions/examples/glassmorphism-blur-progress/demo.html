<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Glassmorphism Blur Progress Bar built using pure HTML and CSS."
    >

    <title>Glassmorphism Blur Progress</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="progress-demo">

        <section class="progress-card" aria-labelledby="progress-title">

            <div class="progress-header">
                <div>
                    <span class="eyebrow">CSS PROGRESS</span>
                    <h1 id="progress-title">Glassmorphism Blur</h1>
                </div>

                <span class="progress-value" aria-label="Progress: 72 percent">
                    72%
                </span>
            </div>

            <div
                class="progress-track"
                role="progressbar"
                aria-valuenow="72"
                aria-valuemin="0"
                aria-valuemax="100"
                aria-label="Glassmorphism progress"
            >
                <div class="progress-fill">
                    <span class="glass-highlight"></span>
                    <span class="progress-glow"></span>
                </div>
            </div>

            <div class="progress-meta">
                <span>Processing</span>
                <span>72 / 100</span>
            </div>

        </section>

    </main>

</body>
</html>
