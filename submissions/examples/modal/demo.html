<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>High Contrast Accessible Modal Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main id="main-content">
    <h1>Accessible Modal Backdrop Demo</h1>
    <p>This demo showcases a WCAG 2.1 AA compliant modal dialog with full high-contrast (forced-colors) mode support.</p>
    <button id="open-modal-btn" type="button" aria-haspopup="dialog">Open Settings</button>
  </main>

  <div id="modal-backdrop" class="modal-backdrop hidden" aria-hidden="true"></div>

  <div id="modal-dialog" 
       class="modal-dialog hidden" 
       role="dialog" 
       aria-modal="true" 
       aria-labelledby="modal-title" 
       aria-describedby="modal-desc"
       tabindex="-1">
    
    <div class="modal-header">
      <h2 id="modal-title">Account Settings</h2>
      <button id="close-modal-btn" type="button" class="close-btn" aria-label="Close dialog">&times;</button>
    </div>

    <div id="modal-desc" class="modal-body">
      <p>Manage your account preferences and accessibility settings below.</p>
      <label for="username">Username</label>
      <input type="text" id="username" name="username" value="johndoe">
    </div>

    <div class="modal-footer">
      <button type="button" id="save-btn" class="btn-primary">Save Changes</button>
      <button type="button" id="cancel-btn" class="btn-secondary">Cancel</button>
    </div>
  </div>

  <script>
    const openBtn = document.getElementById('open-modal-btn');
    const closeBtn = document.getElementById('close-modal-btn');
    const cancelBtn = document.getElementById('cancel-btn');
    const backdrop = document.getElementById('modal-backdrop');
    const dialog = document.getElementById('modal-dialog');
    const mainContent = document.getElementById('main-content');
    
    let previousActiveElement;

    function getFocusableElements() {
      return Array.from(dialog.querySelectorAll(
        'button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])'
      ));
    }

    function openModal() {
      previousActiveElement = document.activeElement;
      
      backdrop.classList.remove('hidden');
      dialog.classList.remove('hidden');
      backdrop.setAttribute('aria-hidden', 'false');
      mainContent.setAttribute('aria-hidden', 'true');

      const focusable = getFocusableElements();
      if (focusable.length) {
        focusable[0].focus();
      } else {
        dialog.focus();
      }

      document.addEventListener('keydown', handleKeyDown);
    }

    function closeModal() {
      backdrop.classList.add('hidden');
      dialog.classList.add('hidden');
      backdrop.setAttribute('aria-hidden', 'true');
      mainContent.removeAttribute('aria-hidden');

      document.removeEventListener('keydown', handleKeyDown);

      if (previousActiveElement) {
        previousActiveElement.focus();
      }
    }

    function handleKeyDown(e) {
      if (e.key === 'Escape') {
        closeModal();
        return;
      }

      if (e.key === 'Tab') {
        const focusable = getFocusableElements();
        if (focusable.length === 0) return;

        const firstEl = focusable[0];
        const lastEl = focusable[focusable.length - 1];

        if (e.shiftKey && document.activeElement === firstEl) {
          e.preventDefault();
          lastEl.focus();
        } else if (!e.shiftKey && document.activeElement === lastEl) {
          e.preventDefault();
          firstEl.focus();
        }
      }
    }

    openBtn.addEventListener('click', openModal);
    closeBtn.addEventListener('click', closeModal);
    cancelBtn.addEventListener('click', closeModal);
    backdrop.addEventListener('click', closeModal);
  </script>
</body>
</html>
