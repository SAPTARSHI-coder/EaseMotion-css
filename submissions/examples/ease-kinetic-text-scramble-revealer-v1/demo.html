<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ease Cyberpunk Text Scramble Revealer</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="scramble-body">
  <div class="scramble-card" id="card">
    <h1 id="text">HOVER TO DECRYPT</h1>
  </div>

  <script>
    const el = document.getElementById('text');
    const target = 'SYSTEM ONLINE 2026';
    const chars = '!@#$%^&*()_+-=[]{}|;:,.<>?';

    el.addEventListener('mouseenter', () => {
      let iter = 0;
      const interval = setInterval(() => {
        el.innerText = target.split('').map((char, index) => {
          if (index < iter) return target[index];
          return chars[Math.floor(Math.random() * chars.length)];
        }).join('');
        if (iter >= target.length) clearInterval(interval);
        iter += 1/3;
      }, 30);
    });
  </script>
</body>
</html>
