<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyberpunk Stepper</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="cp-stepper">
        <input type="radio" name="cp-step" id="cp-s1" checked>
        <input type="radio" name="cp-step" id="cp-s2">
        <input type="radio" name="cp-step" id="cp-s3">
        <input type="radio" name="cp-step" id="cp-s4">

        <div class="cp-track">
            <div class="cp-bar"></div>
        </div>

        <div class="cp-nodes">
            <label for="cp-s1" class="cp-node" data-text="01">INIT</label>
            <label for="cp-s2" class="cp-node" data-text="02">LINK</label>
            <label for="cp-s3" class="cp-node" data-text="03">SYNC</label>
            <label for="cp-s4" class="cp-node" data-text="04">EXEC</label>
        </div>
    </div>
</body>
</html>
