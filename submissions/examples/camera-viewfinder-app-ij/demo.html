<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-camera-viewfinder-app demo</title>
</head>
<body>
<div class="cvf-camera">
  <div class="cvf-screen">
    <span class="cvf-corner"></span>
    <span class="cvf-corner"></span>
    <span class="cvf-corner"></span>
    <span class="cvf-corner"></span>
    <b class="cvf-cross"></b>
    <b class="cvf-focus"></b>
    <span class="cvf-rec">● REC</span>
    <span class="cvf-zoom">2.4x</span>
  </div>
  <div class="cvf-bar">
    <button class="cvf-shutter">SHUTTER</button>
    <span class="cvf-mode">VIDEO</span>
  </div>
</div>
</body>
</html>
