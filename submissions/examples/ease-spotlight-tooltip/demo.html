<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ease Interactive Tooltip with Cursor Spotlight</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="ease-spotlight-body">
  <div class="ease-spotlight-card" id="spotlightCard">
    <div class="ease-spotlight-beam" id="beam"></div>
    <div class="ease-tooltip-pop">Spotlight Target</div>
    <h3>Hover over card for spotlight</h3>
  </div>

  <script>
    const card = document.getElementById('spotlightCard');
    const beam = document.getElementById('beam');

    card.addEventListener('mousemove', (e) => {
      const rect = card.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      beam.style.background = `radial-gradient(circle at ${x}px ${y}px, rgba(59, 130, 246, 0.3) 0%, transparent 70%)`;
    });
  </script>
</body>
</html>
