<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 3D-Flip Progress Bar - Minimalist Tech</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="layout-container">
        <header class="section-header">
            <h1 class="title">System Diagnostics</h1>
            <p class="subtitle">A minimalist tech progress bar featuring a continuous 3D-flip segment animation.</p>
        </header>

        <div class="dashboard-area">
            
            <div class="card">
                <div class="card-header">
                    <h2>Neural Net Training</h2>
                    <!-- Checkbox controls the animation state -->
                    <input type="checkbox" id="trigger-anim-1" class="trigger-checkbox">
                    <label for="trigger-anim-1" class="btn-trigger">Start Epoch</label>
                    
                    <div class="progress-section">
                        <div class="progress-info">
                            <span class="progress-label">Processing dataset batches</span>
                            <span class="progress-value">85%</span>
                        </div>
                        
                        <div class="progress-track">
                            <div class="progress-fill" style="--target-width: 85%;">
                                <!-- The 3D flipping overlay -->
                                <div class="flip-overlay">
                                    <div class="flip-segment"></div>
                                    <div class="flip-segment"></div>
                                    <div class="flip-segment"></div>
                                    <div class="flip-segment"></div>
                                    <div class="flip-segment"></div>
                                    <div class="flip-segment"></div>
                                    <div class="flip-segment"></div>
                                    <div class="flip-segment"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card mt-4">
                <div class="card-header">
                    <h2>Data Encryption</h2>
                    <input type="checkbox" id="trigger-anim-2" class="trigger-checkbox">
                    <label for="trigger-anim-2" class="btn-trigger">Encrypt</label>
                    
                    <div class="progress-section">
                        <div class="progress-info">
                            <span class="progress-label">Applying AES-256 cipher</span>
                            <span class="progress-value">100%</span>
                        </div>
                        
                        <div class="progress-track">
                            <div class="progress-fill color-purple" style="--target-width: 100%;">
                                <div class="flip-overlay">
                                    <div class="flip-segment"></div>
                                    <div class="flip-segment"></div>
                                    <div class="flip-segment"></div>
                                    <div class="flip-segment"></div>
                                    <div class="flip-segment"></div>
                                    <div class="flip-segment"></div>
                                    <div class="flip-segment"></div>
                                    <div class="flip-segment"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card mt-4">
                <div class="card-header">
                    <h2>Image Rendering</h2>
                    <input type="checkbox" id="trigger-anim-3" class="trigger-checkbox">
                    <label for="trigger-anim-3" class="btn-trigger">Render</label>
                    
                    <div class="progress-section">
                        <div class="progress-info">
                            <span class="progress-label">Calculating raytracing paths</span>
                            <span class="progress-value">42%</span>
                        </div>
                        
                        <div class="progress-track">
                            <div class="progress-fill color-pink" style="--target-width: 42%;">
                                <div class="flip-overlay">
                                    <div class="flip-segment"></div>
                                    <div class="flip-segment"></div>
                                    <div class="flip-segment"></div>
                                    <div class="flip-segment"></div>
                                    <div class="flip-segment"></div>
                                    <div class="flip-segment"></div>
                                    <div class="flip-segment"></div>
                                    <div class="flip-segment"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
