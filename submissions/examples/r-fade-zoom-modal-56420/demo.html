<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Fade-Zoom Modal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<input type="checkbox" id="modal-toggle" hidden>

<section class="hero">

    <h1>Gaming Hub</h1>

    <p>
        Explore a modern Fade-Zoom Modal built entirely with HTML and CSS.
    </p>

    <label for="modal-toggle" class="open-btn">
        Open Reward
    </label>

</section>

<div class="overlay">

    <div class="modal">

        <label for="modal-toggle" class="close-btn">&times;</label>

        <div class="icon">🎯</div>

        <h2>Mission Complete!</h2>

        <p>
            Congratulations! You have completed the challenge and earned an exclusive gaming reward.
        </p>

        <label for="modal-toggle" class="action-btn">
            Continue
        </label>

    </div>

</div>

</body>
</html>
