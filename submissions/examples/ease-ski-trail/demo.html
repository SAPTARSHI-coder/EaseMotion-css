<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ski Trail · carve trails in snow</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <div class="skitrail-container">
      <div class="skitrail-display" id="skitrailDisplay">
        <!-- Canvas for ski trail -->
        <canvas id="skitrailCanvas"></canvas>
        
        <!-- Ski Trail Info -->
        <div class="skitrail-info">
          <span class="info-label">⛷️ Trails</span>
          <span class="info-value" id="trailCount">0</span>
        </div>

        <!-- Ski Trail Controls -->
        <div class="skitrail-controls">
          <div class="control-group">
            <label class="control-label">⛷️ Width</label>
            <input type="range" class="control-slider" id="widthSlider" min="1" max="10" value="5">
            <span class="control-value" id="widthValue">5</span>
          </div>
          <div class="control-group">
            <label class="control-label">🎨 Scene</label>
            <div class="scene-options">
              <button class="scene-btn active" data-scene="day" title="Day">☀️</button>
              <button class="scene-btn" data-scene="twilight" title="Twilight">🌆</button>
              <button class="scene-btn" data-scene="night" title="Night">🌙</button>
              <button class="scene-btn" data-scene="sunset" title="Sunset">🌅</button>
            </div>
          </div>
        </div>

        <!-- Ski Trail Text -->
        <div class="skitrail-text">
          <span class="text-label">⛷️ Ski Trail</span>
          <span class="text-message" id="skitrailMessage">Carve trails through the snow</span>
        </div>
      </div>
      
      <div class="skitrail-status">
        <span id="skitrailStatus">⛷️ Click and drag to carve ski trails</span>
      </div>
    </div>

    <div class="controls">
      <button class="btn btn-reset" id="resetBtn">⟳ Clear</button>
    </div>
    <div class="footer-note">
      <span>⛷️ ski trails · 4 scenes · width control</span>
    </div>
  </div>

  <script>
    (function() {
      "use strict";

      // DOM refs
      const canvas = document.getElementById('skitrailCanvas');
      const ctx = canvas.getContext('2d');
      const display = document.getElementById('skitrailDisplay');
      const trailCount = document.getElementById('trailCount');
      const skitrailStatus = document.getElementById('skitrailStatus');
      const skitrailMessage = document.getElementById('skitrailMessage');
      const resetBtn = document.getElementById('resetBtn');
      const widthSlider = document.getElementById('widthSlider');
      const widthValue = document.getElementById('widthValue');
      const sceneBtns = document.querySelectorAll('.scene-btn');

      // State
      let trails = [];
      let snowflakes = [];
      let isDrawing = false;
      let currentWidth = 5;
      let currentScene = 'day';
      let lastX = 0;
      let lastY = 0;
      let animationId = null;
      let time = 0;
      let trailCountNum = 0;

      // Scene configurations
      const scenes = {
        day: { name: 'Day', sky: ['#87CEEB', '#B0D4E8', '#E8F4F8'], snow: '#f0f4f8', shadow: '#d4e0e8', accent: '#e8f0f8' },
        twilight: { name: 'Twilight', sky: ['#2d1b4e', '#4a2a6a', '#7a4a8a'], snow: '#b8c8d8', shadow: '#8a9aaa', accent: '#c8d8e8' },
        night: { name: 'Night', sky: ['#0a0a1a', '#1a1a3a', '#2a2a4a'], snow: '#8a9aaa', shadow: '#5a6a7a', accent: '#aabaca' },
        sunset: { name: 'Sunset', sky: ['#4a1a2a', '#7a3a4a', '#aa5a6a'], snow: '#d4c8c8', shadow: '#a89898', accent: '#e8d8d8' }
      };

      // Snowflake class for background
      class Snowflake {
        constructor() {
          this.x = Math.random() * canvas.width;
          this.y = Math.random() * canvas.height;
          this.size = 0.5 + Math.random() * 1.5;
          this.speed = 0.05 + Math.random() * 0.1;
          this.opacity = 0.05 + Math.random() * 0.1;
          this.wobble = 0.5 + Math.random() * 0.5;
          this.phase = Math.random() * Math.PI * 2;
        }

        update() {
          this.y += this.speed;
          this.phase += 0.01;
          this.x += Math.sin(this.phase) * this.wobble * 0.05;
          if (this.y > canvas.height) {
            this.y = -5;
            this.x = Math.random() * canvas.width;
          }
        }

        draw(ctx) {
          ctx.save();
          ctx.globalAlpha = this.opacity;
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      }

      // Trail class
      class SkiTrail {
        constructor(x, y, width, scene) {
          this.points = [{ x, y }];
          this.width = width;
          this.scene = scene;
          this.color = scenes[scene].shadow;
          this.brightness = 0.6 + Math.random() * 0.2;
          this.snowSpray = [];
        }

        addPoint(x, y) {
          this.points.push({ x, y });
          if (this.points.length > 100) {
            this.points.shift();
          }
          
          // Create snow spray particles
          if (this.points.length % 2 === 0) {
            for (let i = 0; i < 2; i++) {
              const angle = (Math.random() - 0.5) * 1.5;
              const speed = 0.5 + Math.random() * 1;
              this.snowSpray.push({
                x: x,
                y: y,
                vx: Math.sin(angle) * speed,
                vy: -Math.random() * 1 - 0.5,
                size: 1 + Math.random() * 3,
                life: 1,
                decay: 0.01 + Math.random() * 0.02
              });
            }
          }
        }

        updateSpray() {
          this.snowSpray = this.snowSpray.filter(s => {
            s.x += s.vx;
            s.y += s.vy;
            s.vy += 0.02;
            s.life -= s.decay;
            return s.life > 0;
          });
        }

        draw(ctx) {
          if (this.points.length < 2) return;
          
          const sceneData = scenes[this.scene];
          
          // Draw trail
          ctx.save();
          
          // Trail shadow
          ctx.shadowColor = 'rgba(0,0,0,0.05)';
          ctx.shadowBlur = 5;
          
          // Trail glow
          ctx.shadowColor = sceneData.accent;
          ctx.shadowBlur = 3;
          
          // Draw trail with varying width
          const width = this.width * 1.5;
          const halfWidth = width / 2;
          
          ctx.beginPath();
          ctx.moveTo(this.points[0].x, this.points[0].y);
          
          for (let i = 1; i < this.points.length; i++) {
            const p = this.points[i];
            const prev = this.points[i - 1];
            const t = i / this.points.length;
            
            // Trail color with depth
            const alpha = 0.3 + t * 0.3;
            const w = width * (0.5 + t * 0.5);
            
            ctx.strokeStyle = sceneData.shadow;
            ctx.globalAlpha = alpha * this.brightness;
            ctx.lineWidth = w;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            
            ctx.beginPath();
            ctx.moveTo(prev.x, prev.y);
            ctx.lineTo(p.x, p.y);
            ctx.stroke();
          }
          
          // Trail edge highlight
          ctx.shadowBlur = 0;
          ctx.globalAlpha = 0.1;
          ctx.strokeStyle = sceneData.snow;
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(this.points[0].x, this.points[0].y);
          for (let i = 1; i < this.points.length; i++) {
            const p = this.points[i];
            const prev = this.points[i - 1];
            ctx.lineTo(p.x, p.y);
          }
          ctx.stroke();
          
          ctx.restore();
          
          // Draw snow spray
          this.snowSpray.forEach(s => {
            ctx.save();
            ctx.globalAlpha = s.life * 0.4;
            ctx.fillStyle = sceneData.snow;
            ctx.shadowColor = sceneData.snow;
            ctx.shadowBlur = 3;
            ctx.beginPath();
            ctx.arc(s.x, s.y, s.size * s.life, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          });
        }
      }

      // Generate background snowflakes
      function generateSnowflakes() {
        snowflakes = [];
        for (let i = 0; i < 30; i++) {
          snowflakes.push(new Snowflake());
        }
      }

      // Draw background
      function drawBackground(scene) {
        const w = canvas.width;
        const h = canvas.height;
        const sceneData = scenes[scene];
        
        // Sky gradient
        const grad = ctx.createLinearGradient(0, 0, 0, h);
        grad.addColorStop(0, sceneData.sky[0]);
        grad.addColorStop(0.5, sceneData.sky[1]);
        grad.addColorStop(1, sceneData.sky[2]);
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, w, h);
        
        // Snow ground
        const groundY = h * 0.65;
        const grad2 = ctx.createLinearGradient(0, groundY, 0, h);
        grad2.addColorStop(0, sceneData.snow);
        grad2.addColorStop(0.5, sceneData.snow + '88');
        grad2.addColorStop(1, sceneData.shadow + '66');
        ctx.fillStyle = grad2;
        ctx.beginPath();
        ctx.moveTo(0, groundY);
        for (let i = 0; i <= w; i += 10) {
          const y = groundY + Math.sin(i * 0.02 + 1) * 3 + Math.sin(i * 0.015 + 0.5) * 2;
          ctx.lineTo(i, y);
        }
        ctx.lineTo(w, h);
        ctx.lineTo(0, h);
        ctx.closePath();
        ctx.fill();
        
        // Snow texture
        for (let i = 0; i < 20; i++) {
          const x = Math.random() * w;
          const y = groundY + Math.random() * (h - groundY);
          const size = 1 + Math.random() * 3;
          const alpha = 0.03 + Math.random() * 0.05;
          ctx.fillStyle = `rgba(255,255,255,${alpha})`;
          ctx.beginPath();
          ctx.arc(x, y, size, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // Start drawing
      function startDrawing(e) {
        e.preventDefault();
        isDrawing = true;
        const coords = getCoords(e);
        lastX = coords.x;
        lastY = coords.y;
        
        const trail = new SkiTrail(lastX, lastY, currentWidth, currentScene);
        trails.push(trail);
        trailCountNum++;
        trailCount.textContent = trailCountNum;
        
        skitrailStatus.textContent = '⛷️ Carving trail...';
        skitrailStatus.style.color = '#fbbf24';
        skitrailMessage.textContent = '⛷️ Carving through the snow!';
        skitrailMessage.style.color = '#fbbf24';
      }

      // Draw
      function draw(e) {
        e.preventDefault();
        if (!isDrawing) return;
        
        const coords = getCoords(e);
        const x = coords.x;
        const y = coords.y;
        
        if (trails.length > 0) {
          const currentTrail = trails[trails.length - 1];
          currentTrail.addPoint(x, y);
        }
        
        lastX = x;
        lastY = y;
      }

      // Stop drawing
      function stopDrawing(e) {
        if (isDrawing) {
          isDrawing = false;
          skitrailStatus.textContent = '⛷️ Trail complete!';
          skitrailStatus.style.color = '#4ade80';
          skitrailMessage.textContent = 'Carve trails through the snow';
          skitrailMessage.style.color = '#94a3b8';
          setTimeout(() => {
            skitrailStatus.textContent = '⛷️ Click and drag to carve ski trails';
            skitrailStatus.style.color = '#94a3b8';
          }, 1500);
        }
      }

      // Get canvas coordinates
      function getCoords(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return {
          x: (clientX - rect.left) * (canvas.width / rect.width),
          y: (clientY - rect.top) * (canvas.height / rect.height)
        };
      }

      // Resize canvas
      function resizeCanvas() {
        const rect = display.getBoundingClientRect();
        canvas.width = rect.width;
        canvas.height = rect.height;
        canvas.style.width = rect.width + 'px';
        canvas.style.height = rect.height + 'px';
        generateSnowflakes();
      }

      // Animation loop
      function animate() {
        const scene = currentScene;
        time += 0.02;
        
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawBackground(scene);
        
        // Update and draw snowflakes
        snowflakes.forEach(flake => {
          flake.update();
          flake.draw(ctx);
        });
        
        // Update and draw trails
        trails.forEach(trail => {
          trail.updateSpray();
          trail.draw(ctx);
        });
        
        // Update trail count
        trailCount.textContent = trailCountNum;
        
        animationId = requestAnimationFrame(animate);
      }

      // Set scene
      function setScene(scene) {
        currentScene = scene;
        sceneBtns.forEach(btn => {
          btn.classList.toggle('active', btn.dataset.scene === scene);
        });
        const sceneData = scenes[scene];
        skitrailStatus.textContent = `🎨 Scene: ${sceneData.name}`;
        skitrailStatus.style.color = sceneData.sky[1];
        setTimeout(() => {
          skitrailStatus.textContent = '⛷️ Click and drag to carve ski trails';
          skitrailStatus.style.color = '#94a3b8';
        }, 1500);
      }

      // Reset
      function resetSkiTrail() {
        trails = [];
        trailCountNum = 0;
        trailCount.textContent = '0';
        skitrailStatus.textContent = '🔄 Reset complete';
        skitrailStatus.style.color = '#94a3b8';
        skitrailMessage.textContent = 'Carve trails through the snow';
        skitrailMessage.style.color = '#94a3b8';
        setTimeout(() => {
          skitrailStatus.textContent = '⛷️ Click and drag to carve ski trails';
          skitrailStatus.style.color = '#94a3b8';
        }, 1000);
      }

      // Event listeners
      canvas.addEventListener('mousedown', startDrawing);
      canvas.addEventListener('mousemove', draw);
      canvas.addEventListener('mouseup', stopDrawing);
      canvas.addEventListener('mouseleave', stopDrawing);

      canvas.addEventListener('touchstart', startDrawing, { passive: false });
      canvas.addEventListener('touchmove', draw, { passive: false });
      canvas.addEventListener('touchend', stopDrawing, { passive: false });

      widthSlider.addEventListener('input', function() {
        widthValue.textContent = this.value;
        currentWidth = parseInt(this.value);
      });

      sceneBtns.forEach(btn => {
        btn.addEventListener('click', function() {
          setScene(this.dataset.scene);
        });
      });

      if (resetBtn) {
        resetBtn.addEventListener('click', function(e) {
          e.preventDefault();
          resetSkiTrail();
        });
      }

      // Keyboard shortcuts
      document.addEventListener('keydown', function(e) {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

        const key = e.key;
        if (key === 'c' || key === 'C') {
          e.preventDefault();
          resetSkiTrail();
        }
      });

      // Resize
      window.addEventListener('resize', resizeCanvas);

      // Initialize
      resizeCanvas();
      animate();
      
      console.log('⛷️ Ski Trail ready · shortcuts: [C] Clear');
    })();
  </script>
</body>
</html>
