<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS API Documentation Block</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="api-doc-block">
    <div class="api-doc-header">
      <span class="api-method api-method-get">GET</span>
      <span class="api-endpoint">/api/v1/users</span>
    </div>
    <div class="api-doc-description">
      Retrieves a list of all users in the system.
    </div>
    <h3 class="api-doc-subtitle">Parameters</h3>
    <div class="api-table-wrapper">
      <table class="api-doc-table">
        <thead>
          <tr>
            <th>Name</th>
            <th>Type</th>
            <th>Required</th>
            <th>Description</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td><code>limit</code></td>
            <td>integer</td>
            <td><span class="api-badge api-badge-optional">Optional</span></td>
            <td>Number of results to return per page. Default is 20.</td>
          </tr>
          <tr>
            <td><code>role</code></td>
            <td>string</td>
            <td><span class="api-badge api-badge-required">Required</span></td>
            <td>Filter users by role (e.g., admin, editor, viewer).</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</body>
</html>
