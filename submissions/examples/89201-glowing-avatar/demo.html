<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glowing Pulse Avatar Component</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="avatar-container">
        <h2>Live Status Avatar Component</h2>
        <div class="avatar-group">
            <div class="ease-avatar ease-avatar-pulse">
                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150" alt="User Profile">
                <span class="status-indicator"></span>
            </div>
        </div>
    </div>

</body>
</html>
