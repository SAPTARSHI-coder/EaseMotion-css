<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>Glassmorphism FPS Benchmark</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="benchmark">
        <div class="orb orb-one"></div>
        <div class="orb orb-two"></div>

        <section class="glass-grid">
            <article class="glass-card">
                <span class="card-number">01</span>
                <h1>Glassmorphism</h1>
                <p>
                    Frosted glass surfaces using
                    backdrop-filter blur.
                </p>
            </article>

            <article class="glass-card">
                <span class="card-number">02</span>
                <h2>FPS Benchmark</h2>
                <p>
                    Animated elements provide a
                    repeatable rendering workload.
                </p>
            </article>

            <article class="glass-card">
                <span class="card-number">03</span>
                <h2>Performance</h2>
                <p>
                    requestAnimationFrame measures
                    the rendering frame rate.
                </p>
            </article>

            <article class="glass-card">
                <span class="card-number">04</span>
                <h2>CI Ready</h2>
                <p>
                    Performance thresholds can be
                    validated automatically.
                </p>
            </article>
        </section>
    </main>

    <script>
        /*
         * Expose the benchmark page state so test.js
         * can verify that the animation workload is active.
         */
        window.benchmarkReady = true;
    </script>
</body>
</html>
