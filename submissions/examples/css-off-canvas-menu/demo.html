<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Off-canvas Menu - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Hidden checkbox toggle for pure CSS state management -->
    <input type="checkbox" id="em-menu-toggle" class="em-menu-checkbox" aria-hidden="true">

    <div class="em-offcanvas-page">
        <!-- Top Navbar Header -->
        <header class="em-navbar">
            <div class="em-nav-brand">EaseMotion</div>
            <label for="em-menu-toggle" class="em-menu-trigger" aria-label="Toggle navigation menu" role="button" tabindex="0">
                <span class="em-hamburger-bar"></span>
                <span class="em-hamburger-bar"></span>
                <span class="em-hamburger-bar"></span>
            </label>
        </header>

        <!-- Main Content Area -->
        <main class="em-content">
            <div class="em-card" role="region" aria-label="Off-canvas Menu Showcase" tabindex="0">
                <span class="em-card-badge">NAVIGATION</span>
                <h1 class="em-card-title">Off-canvas Menu</h1>
                <p class="em-card-desc">A smooth, responsive, and accessible pure CSS slide-in menu component for mobile navigation without external JavaScript libraries.</p>
                <label for="em-menu-toggle" class="em-card-btn" role="button">Open Navigation</label>
            </div>
        </main>
    </div>

    <!-- Off-canvas Slide-in Sidebar -->
    <aside class="em-offcanvas-sidebar" aria-label="Sidebar Navigation">
        <div class="em-sidebar-header">
            <span class="em-sidebar-title">Menu Navigation</span>
            <label for="em-menu-toggle" class="em-sidebar-close" aria-label="Close menu" role="button" tabindex="0">&times;</label>
        </div>
        <nav class="em-sidebar-nav" role="navigation">
            <a href="#" class="em-nav-link">Home Dashboard</a>
            <a href="#" class="em-nav-link">Components Library</a>
            <a href="#" class="em-nav-link">Animations & FX</a>
            <a href="#" class="em-nav-link">Documentation</a>
            <a href="#" class="em-nav-link">Settings & Profile</a>
        </nav>
    </aside>

    <!-- Backdrop Overlay -->
    <label for="em-menu-toggle" class="em-backdrop" aria-hidden="true"></label>
</body>
</html>
