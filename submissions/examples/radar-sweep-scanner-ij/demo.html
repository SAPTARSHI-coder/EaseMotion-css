<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radar Sweep Scanner - EaseMotion CSS</title>
    <!-- Include EaseMotion Core Stylesheet -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #0b0f19; color: #ffffff;">

    <div class="ease-card ease-card-glass radar-container">
        <div class="radar-header">
            <h2>Radar Sweep Scanner</h2>
            <span class="ease-badge ease-badge-success">Live Tracking</span>
        </div>
        
        <div class="radar-screen ease-center">
            <div class="radar-grid"></div>
            <div class="radar-sweep"></div>
            <div class="radar-blip blip-1"></div>
            <div class="radar-blip blip-2"></div>
        </div>

        <div class="radar-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Status: Scanning...</span>
            <button class="ease-btn ease-btn-primary ease-btn-sm ease-hover-grow">Toggle Mode</button>
        </div>
    </div>

</body>
</html>
