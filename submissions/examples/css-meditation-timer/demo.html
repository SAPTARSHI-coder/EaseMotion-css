<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Meditation Timer - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="em-meditation-page">
        <div class="em-card" role="region" aria-label="Meditation Timer Showcase" tabindex="0">
            <span class="em-card-badge">MINDFULNESS UI</span>
            <h1 class="em-card-title">Meditation Timer</h1>
            <p class="em-card-desc">A guided breathing and meditation timer featuring a smooth expanding and contracting breathing animation ring using pure CSS.</p>
            
            <!-- Meditation Timer Container -->
            <div class="em-timer-container" role="region" aria-label="Guided breathing visualization">
                <div class="em-breathing-circle" role="timer" aria-label="Inhale and exhale breathing guide">
                    <div class="em-inner-pulse"></div>
                    <span class="em-breath-text">Breathe</span>
                </div>
            </div>

            <a href="#" class="em-card-btn" role="button">Start Session</a>
        </div>
    </div>
</body>
</html>
