<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Split Flap Flip Animation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="flip-board">
        <div class="flap">
            <div class="top-half">8</div>
            <div class="bottom-half">8</div>
            <div class="flip-half">
                <div class="front">8</div>
                <div class="back">9</div>
            </div>
        </div>
    </div>
</body>
</html>
