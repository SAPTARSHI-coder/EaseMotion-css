<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Neumorphic magnetic floating action navigation bar">
    <title>Magnetic Floating Navigation</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="page">
        <section class="hero">
            <span class="eyebrow">EASEMOTION • ADVANCED UI</span>

            <h1>
                Magnetic Floating
                <span>Navigation</span>
            </h1>

            <p>
                A neumorphic floating navigation bar with smooth magnetic
                interactions and fluid hover indicators.
            </p>

            <div class="status">
                <span class="status-dot"></span>
                Interactive Experience
            </div>
        </section>

        <nav class="floating-nav" aria-label="Main navigation">

            <div class="nav-indicator"></div>

            <a href="#home" class="nav-item active" aria-label="Home">
                <span class="icon">⌂</span>
                <span class="label">Home</span>
            </a>

            <a href="#explore" class="nav-item" aria-label="Explore">
                <span class="icon">✦</span>
                <span class="label">Explore</span>
            </a>

            <a href="#projects" class="nav-item" aria-label="Projects">
                <span class="icon">▣</span>
                <span class="label">Projects</span>
            </a>

            <a href="#messages" class="nav-item" aria-label="Messages">
                <span class="icon">◌</span>
                <span class="label">Messages</span>
            </a>

            <a href="#profile" class="nav-item" aria-label="Profile">
                <span class="icon">●</span>
                <span class="label">Profile</span>
            </a>

        </nav>
    </main>

    <script>
        const nav = document.querySelector(".floating-nav");
        const items = document.querySelectorAll(".nav-item");
        const indicator = document.querySelector(".nav-indicator");

        function moveIndicator(item) {
            const navRect = nav.getBoundingClientRect();
            const itemRect = item.getBoundingClientRect();

            const x =
                itemRect.left -
                navRect.left +
                itemRect.width / 2 -
                indicator.offsetWidth / 2;

            indicator.style.transform = `translateX(${x}px)`;
        }

        items.forEach(item => {

            item.addEventListener("mouseenter", () => {
                moveIndicator(item);

                items.forEach(navItem =>
                    navItem.classList.remove("hovered")
                );

                item.classList.add("hovered");
            });

            item.addEventListener("click", () => {

                items.forEach(navItem =>
                    navItem.classList.remove("active")
                );

                item.classList.add("active");
                moveIndicator(item);
            });

            item.addEventListener("mousemove", event => {

                const rect = item.getBoundingClientRect();

                const x =
                    (event.clientX - rect.left - rect.width / 2) * 0.18;

                const y =
                    (event.clientY - rect.top - rect.height / 2) * 0.18;

                item.style.transform =
                    `translate(${x}px, ${y}px) translateY(-7px)`;
            });

            item.addEventListener("mouseleave", () => {
                item.style.transform = "";
                item.classList.remove("hovered");
            });
        });

        const activeItem = document.querySelector(".nav-item.active");

        window.addEventListener("load", () => {
            moveIndicator(activeItem);
        });

        window.addEventListener("resize", () => {
            const current =
                document.querySelector(".nav-item.active");

            moveIndicator(current);
        });
    </script>

</body>
</html>
