<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 3D Effect: Quantum Energy Shield</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="layout-container">
        
        <header class="section-header">
            <h1 class="title">Pure CSS 3D: Quantum Shield</h1>
            <p class="subtitle">A hardware-accelerated, JavaScript-free 3D animation utilizing `transform-style: preserve-3d`. Features nested, multi-axis rotating rings to simulate a volumetric quantum energy field.</p>
        </header>

        <div class="demo-area">
            
            <!-- 
              [TECHNIQUE] The 3D Scene
              The wrapper establishes the depth perspective.
            -->
            <div class="scene-3d">
                
                <!-- 
                  The primary gyroscope container. 
                  It uses preserve-3d so all the rings exist in the same 3D space.
                -->
                <div class="quantum-shield">
                    
                    <!-- 
                      [TECHNIQUE] Multi-Axis Nested Rotation
                      We use 3 distinct rings. 
                      Each ring rotates on a different primary axis (X, Y, or Z).
                      By nesting them (or wrapping them in a tumbling parent), 
                      we create a complex spherical volume from flat 2D circles.
                    -->
                    
                    <!-- Outer Ring (Rotates on Z/Y) -->
                    <div class="shield-ring ring-1"></div>
                    
                    <!-- Middle Ring (Rotates on X/Z) -->
                    <div class="shield-ring ring-2"></div>
                    
                    <!-- Inner Ring (Rotates on Y/X) -->
                    <div class="shield-ring ring-3"></div>
                    
                    <!-- The Energy Core -->
                    <div class="quantum-core">
                        <!-- Pulsing inner aura -->
                        <div class="core-aura"></div>
                        
                        <div class="icon-quantum">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="3"></circle>
                                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                            </svg>
                        </div>
                    </div>
                    
                </div>
                
            </div>
            
        </div>
        
    </div>

</body>
</html>
