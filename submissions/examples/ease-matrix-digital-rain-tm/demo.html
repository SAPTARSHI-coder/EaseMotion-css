<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Matrix Digital Rain | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="mtrstage" id="stage">
    <h1 class="mtrtitle">FOLLOW THE WHITE RABBIT</h1>
  </div>
  <script>
    const stage = document.getElementById('stage');
    const cols = 50;
    const chars = '01アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホ';
    for (let i = 0; i < cols; i++) {
      const col = document.createElement('div');
      col.className = 'mtrcol';
      col.style.animationDuration = (3 + Math.random() * 4) + 's';
      col.style.animationDelay = (Math.random() * 5) + 's';
      for (let j = 0; j < 20; j++) {
        const ch = document.createElement('span');
        ch.className = 'mtrchar';
        if (j === 0) ch.classList.add('head');
        else if (j < 3) ch.classList.add('fade1');
        else if (j < 6) ch.classList.add('fade2');
        else ch.classList.add('fade3');
        ch.textContent = chars[Math.floor(Math.random() * chars.length)];
        col.appendChild(ch);
      }
      stage.appendChild(col);
    }
  </script>
</body>
</html>
