<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glassmorphism Kbd - Responsive</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="kbd-page">
    <section class="kbd-card" aria-labelledby="title">
      <h1 id="title">Keyboard Shortcuts</h1>

      <div class="shortcut-list">
        <div class="shortcut">
          <span>Save</span>
          <span class="keys">
            <kbd>Ctrl</kbd><kbd>S</kbd>
          </span>
        </div>

        <div class="shortcut">
          <span>Copy</span>
          <span class="keys">
            <kbd>Ctrl</kbd><kbd>C</kbd>
          </span>
        </div>

        <div class="shortcut">
          <span>Paste</span>
          <span class="keys">
            <kbd>Ctrl</kbd><kbd>V</kbd>
          </span>
        </div>

        <div class="shortcut">
          <span>Search</span>
          <span class="keys">
            <kbd>Ctrl</kbd><kbd>K</kbd>
          </span>
        </div>
      </div>
    </section>
  </main>

</body>
</html>
