<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Spinning Compass Loader - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="em-compass-page">
        <div class="em-card" role="region" aria-label="Spinning Compass Loader Showcase" tabindex="0">
            <span class="em-card-badge">LOADING INDICATORS</span>
            <h1 class="em-card-title">Compass Loader</h1>
            <p class="em-card-desc">An elegant compass rose loading indicator with dual-ring rotation and needle pulsing, crafted entirely with pure CSS.</p>
            
            <!-- Compass Loader Container -->
            <div class="em-loader-container" role="status" aria-label="Loading content, please wait">
                <div class="em-compass-rose">
                    <div class="em-compass-ring"></div>
                    <div class="em-compass-needle"></div>
                    <div class="em-compass-center"></div>
                </div>
                <span class="em-loader-text">Navigating...</span>
            </div>

            <a href="#" class="em-card-btn" role="button">Restart Indicator</a>
        </div>
    </div>
</body>
</html>
