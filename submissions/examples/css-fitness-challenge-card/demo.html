<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Fitness Challenge Card</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="page">
    <section class="challenge-card" aria-labelledby="challenge-title">
      <header class="challenge-header">
        <div>
          <p class="eyebrow">30 Day Challenge</p>
          <h1 id="challenge-title">Fitness Challenge</h1>
          <p class="subtitle">Build consistency, one day at a time.</p>
        </div>

        <div class="progress" aria-label="Challenge progress">
          <strong>12 / 30</strong>
          <span>Days complete</span>
        </div>
      </header>

      <div class="progress-bar" aria-hidden="true">
        <span></span>
      </div>

      <div class="day-grid" aria-label="30 day fitness challenge">
        <button class="day completed" type="button" aria-label="Day 1, completed">
          <span>1</span>
          <small>✓</small>
        </button>

        <button class="day completed" type="button" aria-label="Day 2, completed">
          <span>2</span>
          <small>✓</small>
        </button>

        <button class="day completed" type="button" aria-label="Day 3, completed">
          <span>3</span>
          <small>✓</small>
        </button>

        <button class="day completed" type="button" aria-label="Day 4, completed">
          <span>4</span>
          <small>✓</small>
        </button>

        <button class="day completed" type="button" aria-label="Day 5, completed">
          <span>5</span>
          <small>✓</small>
        </button>

        <button class="day completed" type="button" aria-label="Day 6, completed">
          <span>6</span>
          <small>✓</small>
        </button>

        <button class="day completed" type="button" aria-label="Day 7, completed">
          <span>7</span>
          <small>✓</small>
        </button>

        <button class="day completed" type="button" aria-label="Day 8, completed">
          <span>8</span>
          <small>✓</small>
        </button>

        <button class="day completed" type="button" aria-label="Day 9, completed">
          <span>9</span>
          <small>✓</small>
        </button>

        <button class="day completed" type="button" aria-label="Day 10, completed">
          <span>10</span>
          <small>✓</small>
        </button>

        <button class="day completed" type="button" aria-label="Day 11, completed">
          <span>11</span>
          <small>✓</small>
        </button>

        <button class="day current" type="button" aria-label="Day 12, current day">
          <span>12</span>
          <small>Today</small>
        </button>

        <button class="day" type="button" aria-label="Day 13, upcoming">
          <span>13</span>
        </button>

        <button class="day" type="button" aria-label="Day 14, upcoming">
          <span>14</span>
        </button>

        <button class="day" type="button" aria-label="Day 15, upcoming">
          <span>15</span>
        </button>

        <button class="day" type="button" aria-label="Day 16, upcoming">
          <span>16</span>
        </button>

        <button class="day" type="button" aria-label="Day 17, upcoming">
          <span>17</span>
        </button>

        <button class="day" type="button" aria-label="Day 18, upcoming">
          <span>18</span>
        </button>

        <button class="day" type="button" aria-label="Day 19, upcoming">
          <span>19</span>
        </button>

        <button class="day" type="button" aria-label="Day 20, upcoming">
          <span>20</span>
        </button>

        <button class="day" type="button" aria-label="Day 21, upcoming">
          <span>21</span>
        </button>

        <button class="day" type="button" aria-label="Day 22, upcoming">
          <span>22</span>
        </button>

        <button class="day" type="button" aria-label="Day 23, upcoming">
          <span>23</span>
        </button>

        <button class="day" type="button" aria-label="Day 24, upcoming">
          <span>24</span>
        </button>

        <button class="day" type="button" aria-label="Day 25, upcoming">
          <span>25</span>
        </button>

        <button class="day" type="button" aria-label="Day 26, upcoming">
          <span>26</span>
        </button>

        <button class="day" type="button" aria-label="Day 27, upcoming">
          <span>27</span>
        </button>

        <button class="day" type="button" aria-label="Day 28, upcoming">
          <span>28</span>
        </button>

        <button class="day" type="button" aria-label="Day 29, upcoming">
          <span>29</span>
        </button>

        <button class="day" type="button" aria-label="Day 30, upcoming">
          <span>30</span>
        </button>
      </div>

      <footer class="challenge-footer">
        <span><i class="legend completed-dot"></i> Completed</span>
        <span><i class="legend current-dot"></i> Current</span>
        <span><i class="legend upcoming-dot"></i> Upcoming</span>
      </footer>
    </section>
  </main>
</body>
</html>
