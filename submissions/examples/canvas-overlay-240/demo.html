<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cybernetic Matrix Digital Rain</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <canvas id="matrix"></canvas>

  <main class="content">
    <div class="badge">SYSTEM ONLINE</div>

    <h1>CYBER<br><span>MATRIX</span></h1>

    <p>
      A futuristic digital rain background powered by
      HTML Canvas and vanilla JavaScript.
    </p>

    <button id="toggleRain">Pause Rain</button>
  </main>

  <script>
    const canvas = document.getElementById("matrix");
    const ctx = canvas.getContext("2d");
    const toggleButton = document.getElementById("toggleRain");

    let animationId;
    let running = true;
    let columns = [];
    let fontSize = 16;

    const characters =
      "01アイウエオカキクケコサシスセソABCDEFGHIJKLMNOPQRSTUVWXYZ";

    function setup() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const columnCount = Math.floor(canvas.width / fontSize);

      columns = Array.from(
        { length: columnCount },
        () => Math.random() * canvas.height / fontSize
      );
    }

    function draw() {
      if (!running) return;

      ctx.fillStyle = "rgba(2, 8, 12, 0.08)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.font = `${fontSize}px monospace`;

      columns.forEach((y, index) => {
        const char =
          characters[Math.floor(Math.random() * characters.length)];

        const x = index * fontSize;

        const brightness = Math.random();

        if (brightness > 0.92) {
          ctx.fillStyle = "#ffffff";
        } else {
          ctx.fillStyle = "#00ff88";
        }

        ctx.fillText(char, x, y * fontSize);

        if (y * fontSize > canvas.height && Math.random() > 0.975) {
          columns[index] = 0;
        } else {
          columns[index]++;
        }
      });

      animationId = requestAnimationFrame(draw);
    }

    toggleButton.addEventListener("click", () => {
      running = !running;

      if (running) {
        toggleButton.textContent = "Pause Rain";
        draw();
      } else {
        cancelAnimationFrame(animationId);
        toggleButton.textContent = "Resume Rain";
      }
    });

    window.addEventListener("resize", setup);

    setup();
    draw();
  </script>

</body>
</html>
