<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-telescope-finder-scope</title>
</head>
<body>
<main class="tfs-scope">
  <header class="tfs-top">
    <h1 class="tfs-model">StarView</h1>
    <span class="tfs-mag">Mag 40x</span>
  </header>
  <section class="tfs-eye" aria-label="finder view">
    <span class="tfs-ring"></span>
    <span class="tfs-crossv"></span>
    <span class="tfs-crossh"></span>
    <span class="tfs-star tfs-s1"></span>
    <span class="tfs-star tfs-s2"></span>
    <span class="tfs-star tfs-s3"></span>
    <span class="tfs-star tfs-s4"></span>
  </section>
  <footer class="tfs-foot">
    <span class="tfs-target">Andromeda</span>
    <span class="tfs-ra">RA 00:42</span>
  </footer>
</main>
</body>
</html>
