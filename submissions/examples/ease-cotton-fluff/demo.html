<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cotton Fluff · cotton-like fluff drifts away</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <div class="cotton-container">
      <div class="cotton-display" id="cottonDisplay">
        <!-- Canvas for cotton fluff -->
        <canvas id="cottonCanvas"></canvas>
        
        <!-- Cotton Info -->
        <div class="cotton-info">
          <span class="info-label">☁️ Fluffs</span>
          <span class="info-value" id="fluffCount">0</span>
        </div>

        <!-- Cotton Controls -->
        <div class="cotton-controls">
          <div class="control-group">
            <label class="control-label">🌬️ Wind</label>
            <input type="range" class="control-slider" id="windSlider" min="0" max="100" value="50">
            <span class="control-value" id="windValue">50%</span>
          </div>
          <div class="control-group">
            <label class="control-label">🎨 Color</label>
            <div class="color-options">
              <button class="color-btn active" data-color="white" title="White">⚪</button>
              <button class="color-btn" data-color="pink" title="Pink">💗</button>
              <button class="color-btn" data-color="blue" title="Blue">💙</button>
              <button class="color-btn" data-color="purple" title="Purple">💜</button>
              <button class="color-btn" data-color="gold" title="Gold">💛</button>
            </div>
          </div>
        </div>

        <!-- Cotton Text -->
        <div class="cotton-text">
          <span class="text-label">☁️ Cotton Fluff</span>
          <span class="text-message" id="cottonMessage">Click to release cotton fluff</span>
        </div>
      </div>
      
      <div class="cotton-status">
        <span id="cottonStatus">☁️ Click to release cotton-like fluff</span>
      </div>
    </div>

    <div class="controls">
      <button class="btn btn-puff" id="puffBtn">☁️ Puff</button>
      <button class="btn btn-reset" id="resetBtn">⟳ Clear</button>
    </div>
    <div class="footer-note">
      <span>☁️ cotton fluff · 5 colors · wind control</span>
    </div>
  </div>

  <script>
    (function() {
      "use strict";

      // DOM refs
      const canvas = document.getElementById('cottonCanvas');
      const ctx = canvas.getContext('2d');
      const display = document.getElementById('cottonDisplay');
      const fluffCount = document.getElementById('fluffCount');
      const cottonStatus = document.getElementById('cottonStatus');
      const cottonMessage = document.getElementById('cottonMessage');
      const puffBtn = document.getElementById('puffBtn');
      const resetBtn = document.getElementById('resetBtn');
      const windSlider = document.getElementById('windSlider');
      const windValue = document.getElementById('windValue');
      const colorBtns = document.querySelectorAll('.color-btn');

      // State
      let fluffs = [];
      let animationId = null;
      let time = 0;
      let currentColor = 'white';

      // Color configurations
      const colorConfigs = {
        white: { main: '#f0f0f0', glow: 'rgba(255,255,255,0.15)', dark: '#d4d4d4' },
        pink: { main: '#f472b6', glow: 'rgba(244,114,182,0.15)', dark: '#ec4899' },
        blue: { main: '#60a5fa', glow: 'rgba(96,165,250,0.15)', dark: '#3b82f6' },
        purple: { main: '#a78bfa', glow: 'rgba(167,139,250,0.15)', dark: '#8b5cf6' },
        gold: { main: '#fbbf24', glow: 'rgba(251,191,36,0.15)', dark: '#f59e0b' }
      };

      // Fluff particle class
      class Fluff {
        constructor(x, y) {
          this.x = x || canvas.width / 2 + (Math.random() - 0.5) * 80;
          this.y = y || canvas.height / 2 + (Math.random() - 0.5) * 60;
          this.size = 3 + Math.random() * 6;
          this.speed = 0.3 + Math.random() * 0.8;
          this.angle = Math.random() * Math.PI * 2;
          this.phase = Math.random() * Math.PI * 2;
          this.wobble = 0.3 + Math.random() * 0.7;
          this.life = 0.8 + Math.random() * 0.5;
          this.maxLife = this.life;
          this.color = currentColor;
          this.points = [];
          this.opacity = 0.6 + Math.random() * 0.4;
          this.rotation = Math.random() * Math.PI * 2;
          this.rotationSpeed = (Math.random() - 0.5) * 0.01;
          this.floating = true;
          this.fuzz = 5 + Math.floor(Math.random() * 8);
          
          // Generate fluff points
          for (let i = 0; i < this.fuzz; i++) {
            const angle = Math.random() * Math.PI * 2;
            const dist = this.size * (0.3 + Math.random() * 0.7);
            this.points.push({
              x: Math.cos(angle) * dist,
              y: Math.sin(angle) * dist,
              size: 1 + Math.random() * 3
            });
          }
        }

        update(wind, time) {
          const windForce = wind / 100;
          
          // Drift with wind
          this.angle += (Math.random() - 0.5) * 0.05;
          this.phase += 0.01 + windForce * 0.01;
          
          const moveX = Math.cos(this.angle) * this.speed * 0.3 + windForce * 0.5;
          const moveY = Math.sin(this.angle) * this.speed * 0.2 + Math.sin(this.phase) * 0.2;
          
          this.x += moveX;
          this.y += moveY + windForce * 0.1;
          
          // Wobble
          this.x += Math.sin(this.phase) * this.wobble * 0.1;
          this.y += Math.cos(this.phase * 0.7) * this.wobble * 0.1;
          
          // Rotation
          this.rotation += this.rotationSpeed;
          
          // Life decay
          this.life -= 0.001 - windForce * 0.0005;
          
          // Wrap around
          if (this.x < -50) this.x = canvas.width + 50;
          if (this.x > canvas.width + 50) this.x = -50;
          if (this.y < -50) this.y = canvas.height + 50;
          if (this.y > canvas.height + 50) this.y = -50;
          
          return this.life > 0;
        }

        draw(ctx) {
          const colorData = colorConfigs[this.color];
          const alpha = (this.life / this.maxLife) * this.opacity;
          const size = this.size * (0.5 + (this.life / this.maxLife) * 0.5);
          
          ctx.save();
          ctx.globalAlpha = alpha;
          ctx.translate(this.x, this.y);
          ctx.rotate(this.rotation);
          
          // Glow
          ctx.shadowColor = colorData.main;
          ctx.shadowBlur = 15 * (this.life / this.maxLife);
          
          // Main fluff body
          const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, size * 1.2);
          grad.addColorStop(0, colorData.main);
          grad.addColorStop(0.3, colorData.main);
          grad.addColorStop(0.7, colorData.glow);
          grad.addColorStop(1, 'rgba(0,0,0,0)');
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(0, 0, size * 1.2, 0, Math.PI * 2);
          ctx.fill();
          
          // Fuzz points
          ctx.shadowBlur = 5 * (this.life / this.maxLife);
          this.points.forEach(p => {
            const pSize = p.size * (0.3 + (this.life / this.maxLife) * 0.5);
            ctx.fillStyle = colorData.main;
            ctx.globalAlpha = alpha * 0.6;
            ctx.beginPath();
            ctx.arc(p.x, p.y, pSize, 0, Math.PI * 2);
            ctx.fill();
            
            // Smaller fuzz
            ctx.globalAlpha = alpha * 0.3;
            ctx.fillStyle = colorData.dark;
            ctx.beginPath();
            ctx.arc(p.x + (Math.random() - 0.5) * 2, p.y + (Math.random() - 0.5) * 2, pSize * 0.5, 0, Math.PI * 2);
            ctx.fill();
          });
          
          // Center core
          ctx.shadowBlur = 0;
          ctx.globalAlpha = alpha * 0.4;
          ctx.fillStyle = colorData.dark;
          ctx.beginPath();
          ctx.arc(0, 0, size * 0.2, 0, Math.PI * 2);
          ctx.fill();
          
          ctx.restore();
        }
      }

      // Generate fluffs
      function generateFluffs(count = 5) {
        const w = canvas.width;
        const h = canvas.height;
        for (let i = 0; i < count; i++) {
          const x = w / 2 + (Math.random() - 0.5) * 100;
          const y = h / 2 + (Math.random() - 0.5) * 80;
          const fluff = new Fluff(x, y);
          fluff.life = 0.5 + Math.random() * 0.5;
          fluff.maxLife = fluff.life;
          fluff.color = currentColor;
          fluffs.push(fluff);
        }
        fluffCount.textContent = fluffs.length;
      }

      // Release fluff burst
      function releaseFluff() {
        const count = 15 + Math.floor(Math.random() * 20);
        const w = canvas.width;
        const h = canvas.height;
        const cx = w / 2;
        const cy = h / 2;
        
        for (let i = 0; i < count; i++) {
          const angle = Math.random() * Math.PI * 2;
          const dist = 20 + Math.random() * 40;
          const x = cx + Math.cos(angle) * dist;
          const y = cy + Math.sin(angle) * dist;
          const fluff = new Fluff(x, y);
          fluff.angle = angle + (Math.random() - 0.5) * 0.5;
          fluff.speed = 0.5 + Math.random() * 1.5;
          fluff.life = 0.5 + Math.random() * 0.5;
          fluff.maxLife = fluff.life;
          fluff.color = currentColor;
          fluffs.push(fluff);
        }
        
        fluffCount.textContent = fluffs.length;
        
        cottonStatus.textContent = '☁️ Fluff released! ✨';
        cottonStatus.style.color = '#fbbf24';
        cottonMessage.textContent = '☁️ Cotton fluff drifting away';
        cottonMessage.style.color = '#fbbf24';
        
        setTimeout(() => {
          cottonStatus.textContent = '☁️ Click to release cotton-like fluff';
          cottonStatus.style.color = '#94a3b8';
          cottonMessage.textContent = 'Click to release cotton fluff';
          cottonMessage.style.color = '#94a3b8';
        }, 2000);
      }

      // Draw background
      function drawBackground() {
        const w = canvas.width;
        const h = canvas.height;
        
        // Soft gradient
        const grad = ctx.createRadialGradient(w/2, h/2, 0, w/2, h/2, w * 0.7);
        grad.addColorStop(0, 'rgba(10, 15, 25, 0.3)');
        grad.addColorStop(0.5, 'rgba(15, 20, 30, 0.4)');
        grad.addColorStop(1, 'rgba(5, 10, 20, 0.6)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, w, h);
        
        // Ambient light spots
        for (let i = 0; i < 3; i++) {
          const x = Math.random() * w;
          const y = Math.random() * h * 0.4;
          const size = 40 + Math.random() * 80;
          const grad2 = ctx.createRadialGradient(x, y, 0, x, y, size);
          grad2.addColorStop(0, 'rgba(255,255,255,0.02)');
          grad2.addColorStop(1, 'rgba(255,255,255,0)');
          ctx.fillStyle = grad2;
          ctx.beginPath();
          ctx.arc(x, y, size, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // Resize canvas
      function resizeCanvas() {
        const rect = display.getBoundingClientRect();
        canvas.width = rect.width;
        canvas.height = rect.height;
        canvas.style.width = rect.width + 'px';
        canvas.style.height = rect.height + 'px';
      }

      // Animation loop
      function animate() {
        const wind = parseInt(windSlider.value);
        time += 0.02;
        
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawBackground();
        
        // Update and draw fluffs
        fluffs = fluffs.filter(fluff => {
          const alive = fluff.update(wind, time);
          if (alive) fluff.draw(ctx);
          return alive;
        });
        
        // Update fluff count
        fluffCount.textContent = fluffs.length;
        
        // Update status based on wind
        if (wind > 70) {
          cottonStatus.textContent = '☁️ Fluff drifting in strong wind!';
          cottonStatus.style.color = '#fbbf24';
        } else if (wind > 30) {
          cottonStatus.textContent = '☁️ Cotton fluff floating gently';
          cottonStatus.style.color = '#818cf8';
        } else {
          cottonStatus.textContent = '☁️ Cotton-like fluff drifts peacefully';
          cottonStatus.style.color = '#94a3b8';
        }
        
        // Auto-regenerate if too few fluffs
        if (fluffs.length < 3 && Math.random() > 0.99) {
          generateFluffs(1);
        }
        
        animationId = requestAnimationFrame(animate);
      }

      // Set color
      function setColor(color) {
        currentColor = color;
        colorBtns.forEach(btn => {
          btn.classList.toggle('active', btn.dataset.color === color);
        });
        const colorData = colorConfigs[color];
        cottonStatus.textContent = `🎨 Color: ${colorData.label}`;
        cottonStatus.style.color = colorData.main;
        setTimeout(() => {
          cottonStatus.textContent = '☁️ Click to release cotton-like fluff';
          cottonStatus.style.color = '#94a3b8';
        }, 1500);
      }

      // Clear all fluffs
      function clearFluffs() {
        fluffs = [];
        fluffCount.textContent = '0';
        cottonStatus.textContent = '🧹 Fluffs cleared';
        cottonStatus.style.color = '#94a3b8';
        cottonMessage.textContent = 'Click to release cotton fluff';
        cottonMessage.style.color = '#94a3b8';
        setTimeout(() => {
          cottonStatus.textContent = '☁️ Click to release cotton-like fluff';
          cottonStatus.style.color = '#94a3b8';
        }, 1000);
        // Generate a few new ones
        setTimeout(() => {
          generateFluffs(3);
        }, 500);
      }

      // Event listeners
      display.addEventListener('click', function(e) {
        if (e.target === this || e.target === canvas) {
          releaseFluff();
        }
      });

      if (puffBtn) {
        puffBtn.addEventListener('click', function(e) {
          e.preventDefault();
          releaseFluff();
        });
      }

      if (resetBtn) {
        resetBtn.addEventListener('click', function(e) {
          e.preventDefault();
          clearFluffs();
        });
      }

      windSlider.addEventListener('input', function() {
        windValue.textContent = this.value + '%';
      });

      colorBtns.forEach(btn => {
        btn.addEventListener('click', function() {
          setColor(this.dataset.color);
        });
      });

      // Keyboard shortcuts
      document.addEventListener('keydown', function(e) {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

        const key = e.key;
        if (key === ' ' || key === 'Space') {
          e.preventDefault();
          releaseFluff();
        } else if (key === 'p' || key === 'P') {
          e.preventDefault();
          releaseFluff();
        } else if (key === 'c' || key === 'C') {
          e.preventDefault();
          clearFluffs();
        }
      });

      // Resize
      window.addEventListener('resize', resizeCanvas);

      // Initialize
      resizeCanvas();
      generateFluffs(8);
      animate();
      
      console.log('☁️ Cotton Fluff ready · shortcuts: [Space/P] Puff, [C] Clear');
    })();
  </script>
</body>
</html>
