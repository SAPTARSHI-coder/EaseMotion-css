<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Bounce-Pulse Tooltip</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<section class="tooltip-section">

<h1>Gaming Hub Tooltips</h1>

<div class="tooltip-grid">

<div class="tooltip-item">
<button class="tooltip-btn">🎮 Battle Pass</button>
<span class="tooltip">Unlock premium missions, seasonal rewards, and exclusive content.</span>
</div>

<div class="tooltip-item">
<button class="tooltip-btn">⚔️ Epic Weapon</button>
<span class="tooltip">Boost attack power and unlock special combat abilities.</span>
</div>

<div class="tooltip-item">
<button class="tooltip-btn">🛡️ Guardian Shield</button>
<span class="tooltip">Provides temporary protection against heavy enemy attacks.</span>
</div>

<div class="tooltip-item">
<button class="tooltip-btn">💎 Treasure</button>
<span class="tooltip">Collect rare gems to unlock legendary cosmetic items.</span>
</div>

</div>

</section>

</body>
</html>
