<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-fitness-heart-rate-monitor demo</title>
</head>
<body>
<div class="hm-app">
  <span class="hm-model">PULSE PRO</span>
