<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FAB Radial Menu</title>
<link rel="stylesheet" href="style.css">
</head>
<body style="background:#111; height:100vh; display:flex; align-items:flex-end; justify-content:flex-end; padding:60px;">
  <div class="fab-menu">
    <input type="checkbox" class="fab-menu__toggle" id="fabToggle">
    <label for="fabToggle" class="fab-menu__button">+</label>
    <a href="#" class="fab-menu__item">✉</a>
    <a href="#" class="fab-menu__item">📷</a>
    <a href="#" class="fab-menu__item">🔗</a>
    <a href="#" class="fab-menu__item">⚙</a>
  </div>
</body>
</html>
