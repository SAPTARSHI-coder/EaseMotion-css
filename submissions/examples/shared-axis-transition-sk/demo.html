<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shared-Axis Page Transition</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      margin: 0; min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 1rem; padding: 24px;
      background: linear-gradient(160deg, #f8fafc, #eef2ff 55%, #f8fafc);
      color: #111827; font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      
    }
    h1 { margin: 0; font-size: 1.25rem; text-align: center; }
    .note { margin: 0; max-width: 420px; text-align: center; color: #4b5563; font-size: 0.92rem; line-height: 1.45; }
  </style>
</head>
<body>
  <h1>Shared-Axis Page Transition</h1>
  
  <div class="axis-demo">
<input type="radio" name="page" id="p1" checked /><input type="radio" name="page" id="p2" />
<section class="page page--a">Page A</section><section class="page page--b">Page B</section>
</div>
<div class="nav"><label for="p1">Axis X · A</label><label for="p2">Axis X · B</label></div>
  
</body>
</html>
