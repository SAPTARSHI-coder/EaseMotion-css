<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Float-Drift Popover</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <div class="popover">

        <button class="trigger">
            Open Popover
        </button>

        <div class="popover-content">
            <h3>Workspace</h3>
            <p>
                Invite teammates, manage permissions, and organize your
                SaaS workspace with a lightweight floating popover.
            </p>

            <button class="action">
                Continue
            </button>
        </div>

    </div>

</div>

</body>
</html>
