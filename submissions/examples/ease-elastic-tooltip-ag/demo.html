<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elastic Tooltip</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="tooltip-wrapper">
            <button class="hover-btn">Hover Me</button>
            <div class="tooltip">
                <span class="tooltip-text">Hello! I'm an elastic tooltip.</span>
                <!-- The small triangle pointer -->
                <div class="tooltip-arrow"></div>
            </div>
        </div>
    </div>
</body>
</html>
