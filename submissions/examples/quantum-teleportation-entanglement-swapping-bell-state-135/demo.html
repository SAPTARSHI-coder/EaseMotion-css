<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entanglement Swapping Bell State - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css"></head><body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030712; color: #ffffff;">

    <div class="ease-card ease-card-glass bell-container">
        <div class="bell-header">
            <h2>Entanglement Swapping</h2>
            <span class="ease-badge ease-badge-success">Quantum Repeater QC</span>
        </div>
        
        <div class="bell-screen ease-center">
            <div class="bell-flux flux-bell-a"></div>
            <div class="bell-flux flux-bell-b"></div>
            <div class="bell-boundary-ring"></div>
            <div class="bell-core ease-center"></div>
        </div>

        <div class="bell-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Bell-State Measurement &amp; Remote Entanglement</span>
            <button class="ease-btn ease-btn-success ease-btn-sm ease-hover-grow">Run Swapping Gate</button>
        </div>
    </div></body></html>
