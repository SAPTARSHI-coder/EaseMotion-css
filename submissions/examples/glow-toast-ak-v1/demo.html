<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notification Toast Banner — EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <p class="label">Pure CSS Animated Notification Toast Banners</p>

  <!-- Default Toast -->
  <div class="ease-toast">
    <span class="ease-toast__icon">🔔</span>
    <div class="ease-toast__content">
      <span class="ease-toast__title">Notification</span>
      <span class="ease-toast__desc">Component copied to clipboard.</span>
    </div>
    <div class="ease-toast__timer"></div>
  </div>

  <!-- Success Toast -->
  <div class="ease-toast ease-toast--success">
    <span class="ease-toast__icon">✅</span>
    <div class="ease-toast__content">
      <span class="ease-toast__title">Success</span>
      <span class="ease-toast__desc">Pull request submitted cleanly!</span>
    </div>
    <div class="ease-toast__timer"></div>
  </div>

</body>
</html>
