<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Interactive Holographic Glass Card</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!--
    Interactive Holographic Glass Card
    -----------------------------------
    The component itself starts here.
  -->

  <article
    class="holo-card"
    tabindex="0"
    aria-label="Interactive holographic profile card"
  >

    <div class="holo-card__glow"></div>
    <div class="holo-card__shine"></div>
    <div class="holo-card__noise"></div>

    <div class="holo-card__content">

      <div class="holo-card__top">
        <span class="holo-card__badge">
          AVAILABLE
        </span>

        <span class="holo-card__index">
          01
        </span>
      </div>

      <div class="holo-card__icon">
        ✦
      </div>

      <div class="holo-card__text">
        <p class="holo-card__eyebrow">
          DIGITAL EXPERIENCE
        </p>

        <h1 class="holo-card__title">
          Holographic
          <span>Glass</span>
        </h1>

        <p class="holo-card__description">
          An interactive glassmorphism card with
          pointer-driven 3D parallax and holographic lighting.
        </p>
      </div>

      <div class="holo-card__footer">

        <div class="holo-card__meta">
          <span>PARALLAX</span>
          <strong>3D</strong>
        </div>

        <button
          class="holo-card__button"
          type="button"
          aria-label="Explore holographic card"
        >
          <span>EXPLORE</span>
          <span aria-hidden="true">↗</span>
        </button>

      </div>

    </div>

  </article>


  <script>
    const card = document.querySelector(".holo-card");

    let frame = null;

    function updateCard(clientX, clientY) {
      const rect = card.getBoundingClientRect();

      const x = clientX - rect.left;
      const y = clientY - rect.top;

      const percentX = x / rect.width;
      const percentY = y / rect.height;

      const rotateY = (percentX - 0.5) * 20;
      const rotateX = (0.5 - percentY) * 20;

      card.style.setProperty("--pointer-x", `${percentX * 100}%`);
      card.style.setProperty("--pointer-y", `${percentY * 100}%`);

      card.style.setProperty("--rotate-x", `${rotateX}deg`);
      card.style.setProperty("--rotate-y", `${rotateY}deg`);
    }

    card.addEventListener("pointermove", (event) => {

      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        return;
      }

      if (frame) {
        cancelAnimationFrame(frame);
      }

      frame = requestAnimationFrame(() => {
        updateCard(event.clientX, event.clientY);
      });
    });

    card.addEventListener("pointerleave", () => {

      if (frame) {
        cancelAnimationFrame(frame);
      }

      card.style.setProperty("--rotate-x", "0deg");
      card.style.setProperty("--rotate-y", "0deg");

      card.style.setProperty("--pointer-x", "50%");
      card.style.setProperty("--pointer-y", "50%");
    });


    /*
     * Keyboard / focus interaction
     * Keeps the component usable without a pointer.
     */
    card.addEventListener("focus", () => {
      card.classList.add("is-focused");
    });

    card.addEventListener("blur", () => {
      card.classList.remove("is-focused");
    });
  </script>

</body>
</html>
