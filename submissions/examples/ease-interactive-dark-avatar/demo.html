<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Dark Mode Avatar - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="ease-avatar-wrapper">
    <div class="ease-avatar-tooltip">
      <p class="ease-tooltip-name">Viidhii19</p>
      <p class="ease-tooltip-role">Core Architect</p>
    </div>
    <div class="ease-avatar-core">
      <div class="ease-avatar-ring"></div>
      <img src="https://i.pravatar.cc/150?img=11" alt="User Avatar" class="ease-avatar-img">
      <div class="ease-status-dot"></div>
    </div>
  </div>

  <p style="position: absolute; bottom: 2rem; color: #64748b; font-size: 0.875rem; text-transform: uppercase; letter-spacing: 1px;">Hover to initialize interaction</p>

</body>
</html>
