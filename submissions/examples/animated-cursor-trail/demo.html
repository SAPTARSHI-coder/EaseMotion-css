<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EaseMotion CSS - Cursor Trail</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">
    <h1>Move Your Cursor</h1>
    <p>Watch the glowing cursor trail follow your mouse smoothly.</p>
</div>

<div class="ease-cursor-trail"></div>

<script>

const trail = document.querySelector(".ease-cursor-trail");

let mouseX = window.innerWidth / 2;
let mouseY = window.innerHeight / 2;

let currentX = mouseX;
let currentY = mouseY;

window.addEventListener("mousemove",(e)=>{

    mouseX=e.clientX;
    mouseY=e.clientY;

});

function animateTrail(){

    currentX += (mouseX-currentX)*0.15;
    currentY += (mouseY-currentY)*0.15;

    trail.style.transform=`translate(${currentX}px,${currentY}px)`;

    requestAnimationFrame(animateTrail);

}

animateTrail();

</script>

</body>
</html>
