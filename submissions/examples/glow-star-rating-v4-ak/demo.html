<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive Star Rating — EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <p class="label">Pure CSS Interactive Star Rating</p>

  <div class="ease-rating-stars-v4">
    <input type="radio" name="star-v4-ak" id="star5-v4-ak" />
    <label for="star5-v4-ak" class="ease-rating-star-label-v4">★</label>

    <input type="radio" name="star-v4-ak" id="star4-v4-ak" checked />
    <label for="star4-v4-ak" class="ease-rating-star-label-v4">★</label>

    <input type="radio" name="star-v4-ak" id="star3-v4-ak" />
    <label for="star3-v4-ak" class="ease-rating-star-label-v4">★</label>

    <input type="radio" name="star-v4-ak" id="star2-v4-ak" />
    <label for="star2-v4-ak" class="ease-rating-star-label-v4">★</label>

    <input type="radio" name="star-v4-ak" id="star1-v4-ak" />
    <label for="star1-v4-ak" class="ease-rating-star-label-v4">★</label>
  </div>

</body>
</html>
