<!-- EaseMotion component: conveyor-belt-packages -->
<!DOCTYPE html>
<html lang="en" data-conv="belt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.2">
<title>Ease Conveyor Belt Packages</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="sorter-rig">
  <header class="sorter-head">
    <span class="sorter-zone">DOCK 2</span>
    <span class="sorter-speed">FAST</span>
  </header>
  <div class="sorter-frame">
    <span class="belt-track">
      <span class="belt-roller roller-1"></span>
      <span class="belt-roller roller-2"></span>
      <span class="belt-roller roller-3"></span>
      <span class="belt-roller roller-4"></span>
      <span class="belt-package pkg-1"></span>
      <span class="belt-package pkg-2"></span>
      <span class="belt-package pkg-3"></span>
    </span>
  </div>
  <footer class="sorter-foot">
    <span class="sorter-count">SORTED 128</span>
    <span class="sorter-status">RUNNING</span>
  </footer>
</main>
</body>
</html>
