<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Character Counter #86863 Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="showcase-wrapper">
    <div class="counter-card" id="counterCard">
      <div class="card-header">
        <span class="card-title">Feedback Note</span>
        <span class="card-badge">Live Counter</span>
      </div>

      <div class="counter-textarea-group">
        <textarea 
          id="textInput" 
          class="counter-textarea" 
          maxlength="120" 
          placeholder="Share your thoughts (maximum 120 characters)..."
        ></textarea>
      </div>

      <div class="counter-footer">
        <span class="helper-msg" id="helperMsg">Characters remaining</span>
        <div class="counter-status">
          <svg class="progress-ring" viewBox="0 0 24 24">
            <circle class="ring-track" cx="12" cy="12" r="10"></circle>
            <circle class="ring-indicator" id="ringIndicator" cx="12" cy="12" r="10"></circle>
          </svg>
          <span class="counter-text" id="counterDisplay" aria-live="polite">0 / 120</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    const textarea = document.getElementById('textInput');
    const card = document.getElementById('counterCard');
    const counterDisplay = document.getElementById('counterDisplay');
    const ring = document.getElementById('ringIndicator');
    const helper = document.getElementById('helperMsg');

    const MAX_LENGTH = 120;
    const CIRCUMFERENCE = 2 * Math.PI * 10; // ~62.83

    textarea.addEventListener('input', () => {
      const len = textarea.value.length;
      const remaining = MAX_LENGTH - len;
      const progress = Math.min(len / MAX_LENGTH, 1);

      counterDisplay.textContent = `${len} / ${MAX_LENGTH}`;
      ring.style.strokeDashoffset = CIRCUMFERENCE * (1 - progress);

      card.classList.remove('warn', 'limit');

      if (len >= MAX_LENGTH) {
        card.classList.add('limit');
        helper.textContent = 'Maximum limit reached!';
        textarea.classList.add('shake-field');
        setTimeout(() => textarea.classList.remove('shake-field'), 400);
      } else if (len >= MAX_LENGTH * 0.8) {
        card.classList.add('warn');
        helper.textContent = `${remaining} characters remaining`;
      } else {
        helper.textContent = `${remaining} characters remaining`;
      }
    });
  </script>
</body>
</html>
