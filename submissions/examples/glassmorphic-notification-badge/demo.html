<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Glassmorphic Notification Badge — Demo</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Feature CSS being submitted -->
  <link rel="stylesheet" href="style.css" />

  <style>
    body {
      background-color: #0d0d16;
      color: #e2e8f0;
      font-family: 'Inter', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 48px;
      min-height: 100vh;
      margin: 0;
    }
    .demo-row {
      display: flex;
      align-items: center;
      gap: 48px;
    }
    .icon-box {
      position: relative;
      width: 52px;
      height: 52px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
    }
  </style>
</head>
<body>

  <div class="demo-row">
    <div class="icon-box">
      🔔
      <span class="ease-badge-notify ease-badge-pulse">3</span>
    </div>

    <div class="icon-box">
      💬
      <span class="ease-badge-notify ease-badge-notify-success ease-badge-pulse">12</span>
    </div>

    <div class="icon-box">
      ⚠️
      <span class="ease-badge-notify ease-badge-notify-danger ease-badge-pulse">5</span>
    </div>
  </div>

  <div class="demo-row">
    <button class="ease-btn ease-btn-outline" style="position:relative; border-color:rgba(255,255,255,0.25); color:#fff;">
      Inbox
      <span class="ease-badge-notify ease-badge-notify-success">99+</span>
    </button>
  </div>

</body>
</html>
