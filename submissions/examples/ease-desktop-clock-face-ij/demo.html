<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.3">
<title>Desktop Clock Face</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="desk-clock">
  <header class="clock-head">
    <h1 class="clock-make">CHRONOMETER</h1>
    <p class="clock-chime">CHIME 12</p>
  </header>
  <section class="clock-face" aria-label="Analog clock face">
    <div class="face-dial">
      <span class="num num-12">12</span>
      <span class="num num-3">3</span>
      <span class="num num-6">6</span>
      <span class="num num-9">9</span>
      <span class="hand hand-hour"></span>
      <span class="hand hand-minute"></span>
      <span class="hand hand-second"></span>
      <span class="face-hub"></span>
    </div>
  </section>
  <section class="clock-cradle" aria-label="Pendulum cradle">
    <span class="pendulum-rod"></span>
    <span class="pendulum-bob"></span>
  </section>
  <footer class="clock-foot">
    <span class="clock-beat">BEAT 3/4</span>
    <span class="clock-wind">WIND 8</span>
  </footer>
</main>
</body>
</html>
