<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Responsive 3D Neumorphism Tooltip built with pure HTML and CSS">
  <title>3D Neumorphism Tooltip</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="demo">
    <h1>3D Neumorphism Tooltip</h1>
    <p class="intro">
      Hover or focus the elements below to reveal the tooltip.
    </p>

    <section class="tooltip-demo" aria-label="Tooltip examples">

      <button
        class="tooltip-trigger"
        type="button"
        aria-describedby="tooltip-1"
      >
        <span class="icon" aria-hidden="true">?</span>
        <span class="tooltip" id="tooltip-1" role="tooltip">
          Learn more about this feature
        </span>
      </button>

      <button
        class="tooltip-trigger"
        type="button"
        aria-describedby="tooltip-2"
      >
        <span class="icon" aria-hidden="true">i</span>
        <span class="tooltip" id="tooltip-2" role="tooltip">
          Additional information
        </span>
      </button>

      <button
        class="tooltip-trigger"
        type="button"
        aria-describedby="tooltip-3"
      >
        <span class="icon" aria-hidden="true">!</span>
        <span class="tooltip" id="tooltip-3" role="tooltip">
          Important notification
        </span>
      </button>

    </section>
  </main>

</body>
</html>
