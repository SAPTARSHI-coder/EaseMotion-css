<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Toggle Switch - ease-toggle-hd</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      body { font-family: Inter, system-ui, sans-serif; padding: 3rem; display: grid; gap: 1.5rem; }
    </style>
  </head>
  <body>
    <h1>Pure CSS Toggle Switch</h1>

    <label class="ease-toggle-hd">
      <input class="ease-toggle-hd__input" type="checkbox" />
      <span class="ease-toggle-hd__track"><span class="ease-toggle-hd__thumb"></span></span>
      Default (off)
    </label>

    <label class="ease-toggle-hd">
      <input class="ease-toggle-hd__input" type="checkbox" checked />
      <span class="ease-toggle-hd__track"><span class="ease-toggle-hd__thumb"></span></span>
      Checked (on)
    </label>

    <label class="ease-toggle-hd">
      <input class="ease-toggle-hd__input" type="checkbox" disabled />
      <span class="ease-toggle-hd__track"><span class="ease-toggle-hd__thumb"></span></span>
      Disabled
    </label>
  </body>
</html>
