<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RGB Split · channels separate and merge</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <div class="rgb-container">
      <div class="rgb-display" id="rgbDisplay">
        <!-- Canvas for RGB split -->
        <canvas id="rgbCanvas"></canvas>
        
        <!-- RGB Info -->
        <div class="rgb-info">
          <span class="info-label">🌈 Channels</span>
          <span class="info-value" id="channelStatus">Merged</span>
        </div>

        <!-- RGB Controls -->
        <div class="rgb-controls">
          <div class="control-group">
            <label class="control-label">🔀 Split</label>
            <input type="range" class="control-slider" id="splitSlider" min="0" max="100" value="0">
            <span class="control-value" id="splitValue">0%</span>
          </div>
          <div class="control-group">
            <label class="control-label">🌀 Angle</label>
            <input type="range" class="control-slider" id="angleSlider" min="0" max="360" value="45">
            <span class="control-value" id="angleValue">45°</span>
          </div>
        </div>

        <!-- RGB Text -->
        <div class="rgb-text">
          <span class="text-label">🌈 RGB Split</span>
          <span class="text-message" id="rgbMessage">Drag to separate the RGB channels</span>
        </div>
      </div>
      
      <div class="rgb-status">
        <span id="rgbStatus">🌈 Drag the slider to split RGB channels</span>
      </div>
    </div>

    <div class="controls">
      <button class="btn btn-reset" id="resetBtn">⟳ Reset</button>
    </div>
    <div class="footer-note">
      <span>🌈 RGB split · 3 channels · interactive separation</span>
    </div>
  </div>

  <script>
    (function() {
      "use strict";

      // DOM refs
      const canvas = document.getElementById('rgbCanvas');
      const ctx = canvas.getContext('2d');
      const display = document.getElementById('rgbDisplay');
      const channelStatus = document.getElementById('channelStatus');
      const rgbStatus = document.getElementById('rgbStatus');
      const rgbMessage = document.getElementById('rgbMessage');
      const resetBtn = document.getElementById('resetBtn');
      const splitSlider = document.getElementById('splitSlider');
      const splitValue = document.getElementById('splitValue');
      const angleSlider = document.getElementById('angleSlider');
      const angleValue = document.getElementById('angleValue');

      // State
      let splitAmount = 0;
      let angle = 45;
      let animationId = null;
      let particles = [];
      let time = 0;

      // Particle class for RGB particles
      class RGBParticle {
        constructor() {
          this.x = Math.random();
          this.y = Math.random();
          this.size = 2 + Math.random() * 4;
          this.speed = 0.1 + Math.random() * 0.2;
          this.phase = Math.random() * Math.PI * 2;
          this.life = 0.5 + Math.random() * 0.5;
          this.channel = Math.floor(Math.random() * 3);
        }

        update() {
          this.phase += 0.01;
          this.x += Math.sin(this.phase) * 0.001;
          this.y += Math.cos(this.phase * 0.7) * 0.001;
          this.life -= 0.001;
          if (this.life <= 0) {
            this.x = Math.random();
            this.y = Math.random();
            this.life = 0.5 + Math.random() * 0.5;
          }
        }
      }

      // Generate particles
      function generateParticles() {
        particles = [];
        for (let i = 0; i < 100; i++) {
          particles.push(new RGBParticle());
        }
      }

      // Draw RGB split effect
      function drawRGB(progress, angle) {
        const w = canvas.width;
        const h = canvas.height;
        const cx = w / 2;
        const cy = h / 2;
        const maxOffset = Math.min(w, h) * 0.15 * progress;
        const rad = angle * Math.PI / 180;
        
        // Clear
        ctx.clearRect(0, 0, w, h);
        
        // Background
        const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, w * 0.6);
        grad.addColorStop(0, 'rgba(10, 10, 20, 0.3)');
        grad.addColorStop(0.5, 'rgba(15, 15, 25, 0.4)');
        grad.addColorStop(1, 'rgba(0, 0, 5, 0.6)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, w, h);
        
        // Calculate channel offsets
        const offsetX = Math.cos(rad) * maxOffset;
        const offsetY = Math.sin(rad) * maxOffset;
        
        // Red channel (R)
        drawChannel(ctx, 'red', offsetX, offsetY, w, h);
        // Green channel (G)
        drawChannel(ctx, 'green', 0, 0, w, h);
        // Blue channel (B)
        drawChannel(ctx, 'blue', -offsetX, -offsetY, w, h);
        
        // Draw particles overlay
        drawParticles(progress);
        
        // Update status
        const percent = Math.round(progress * 100);
        if (progress > 0.8) {
          channelStatus.textContent = 'Split!';
          channelStatus.style.color = '#fbbf24';
          rgbStatus.textContent = '🌈 RGB channels fully separated!';
          rgbStatus.style.color = '#fbbf24';
        } else if (progress > 0.3) {
          channelStatus.textContent = 'Splitting...';
          channelStatus.style.color = '#818cf8';
          rgbStatus.textContent = '🌈 Channels separating...';
          rgbStatus.style.color = '#818cf8';
        } else if (progress > 0.05) {
          channelStatus.textContent = 'Merging...';
          channelStatus.style.color = '#94a3b8';
          rgbStatus.textContent = '🌈 Channels merging...';
          rgbStatus.style.color = '#94a3b8';
        } else {
          channelStatus.textContent = 'Merged';
          channelStatus.style.color = '#e2e8f0';
          rgbStatus.textContent = '🌈 Drag the slider to split RGB channels';
          rgbStatus.style.color = '#94a3b8';
        }
      }

      // Draw individual color channel
      function drawChannel(ctx, color, offsetX, offsetY, w, h) {
        const cx = w / 2 + offsetX;
        const cy = h / 2 + offsetY;
        const size = Math.min(w, h) * 0.25;
        
        // Channel glow
        const grad = ctx.createRadialGradient(cx - size * 0.2, cy - size * 0.2, 0, cx, cy, size);
        
        const colors = {
          red: ['#ff0000', '#ff3333', '#ff6666'],
          green: ['#00ff00', '#33ff33', '#66ff66'],
          blue: ['#0000ff', '#3333ff', '#6666ff']
        };
        
        const c = colors[color];
        grad.addColorStop(0, c[0]);
        grad.addColorStop(0.4, c[1]);
        grad.addColorStop(0.8, c[2]);
        grad.addColorStop(1, 'rgba(0,0,0,0)');
        
        ctx.save();
        ctx.shadowColor = c[0];
        ctx.shadowBlur = 30;
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(cx, cy, size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
        
        // Draw channel label
        ctx.save();
        ctx.fillStyle = '#ffffff';
        ctx.font = '14px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.globalAlpha = 0.5;
        ctx.fillText(color.toUpperCase(), cx, cy + size * 0.6);
        ctx.restore();
        
        // Draw channel ring
        ctx.save();
        ctx.strokeStyle = c[0];
        ctx.globalAlpha = 0.2;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(cx, cy, size * 0.8, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }

      // Draw particles
      function drawParticles(progress) {
        const w = canvas.width;
        const h = canvas.height;
        const cx = w / 2;
        const cy = h / 2;
        
        particles.forEach(p => {
          p.update();
          const x = p.x * w;
          const y = p.y * h;
          const dist = Math.sqrt(Math.pow(x - cx, 2) + Math.pow(y - cy, 2));
          const maxDist = Math.min(w, h) * 0.4;
          const intensity = Math.min(1, dist / maxDist) * progress;
          
          const colors = ['#ff3333', '#33ff33', '#3333ff'];
          const color = colors[p.channel];
          
          ctx.save();
          ctx.globalAlpha = 0.1 + intensity * 0.3;
          ctx.fillStyle = color;
          ctx.shadowColor = color;
          ctx.shadowBlur = 5 * intensity;
          ctx.beginPath();
          ctx.arc(x, y, p.size * (0.5 + intensity * 0.5), 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        });
      }

      // Resize canvas
      function resizeCanvas() {
        const rect = display.getBoundingClientRect();
        canvas.width = rect.width;
        canvas.height = rect.height;
        canvas.style.width = rect.width + 'px';
        canvas.style.height = rect.height + 'px';
      }

      // Animation loop
      function animate() {
        time += 0.02;
        const progress = splitSlider.value / 100;
        const angle = parseInt(angleSlider.value);
        
        drawRGB(progress, angle);
        
        animationId = requestAnimationFrame(animate);
      }

      // Reset
      function resetRGB() {
        splitSlider.value = 0;
        splitValue.textContent = '0%';
        splitAmount = 0;
        angleSlider.value = 45;
        angleValue.textContent = '45°';
        channelStatus.textContent = 'Merged';
        channelStatus.style.color = '#e2e8f0';
        rgbStatus.textContent = '🔄 Reset complete';
        rgbStatus.style.color = '#94a3b8';
        rgbMessage.textContent = 'Drag to separate the RGB channels';
        rgbMessage.style.color = '#94a3b8';
        setTimeout(() => {
          rgbStatus.textContent = '🌈 Drag the slider to split RGB channels';
          rgbStatus.style.color = '#94a3b8';
        }, 1000);
      }

      // Event listeners
      splitSlider.addEventListener('input', function() {
        splitValue.textContent = this.value + '%';
      });

      angleSlider.addEventListener('input', function() {
        angleValue.textContent = this.value + '°';
      });

      if (resetBtn) {
        resetBtn.addEventListener('click', function(e) {
          e.preventDefault();
          resetRGB();
        });
      }

      // Keyboard shortcuts
      document.addEventListener('keydown', function(e) {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

        const key = e.key;
        if (key === 'r' || key === 'R') {
          e.preventDefault();
          resetRGB();
        }
      });

      // Resize
      window.addEventListener('resize', resizeCanvas);

      // Initialize
      resizeCanvas();
      generateParticles();
      animate();
      
      console.log('🌈 RGB Split ready · shortcuts: [R] Reset');
    })();
  </script>
</body>
</html>
