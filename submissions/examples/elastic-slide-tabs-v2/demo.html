<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elastic Slide Tabs</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="tabs">

    <input type="radio" id="home" name="tab" checked>
    <input type="radio" id="games" name="tab">
    <input type="radio" id="profile" name="tab">

    <nav class="tab-nav">
        <label for="home">Home</label>
        <label for="games">Games</label>
        <label for="profile">Profile</label>

        <span class="indicator"></span>
    </nav>

    <div class="tab-content">
        <section>Home Content</section>
        <section>Games Content</section>
        <section>Profile Content</section>
    </div>

</div>

</body>
</html>
