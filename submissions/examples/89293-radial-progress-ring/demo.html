<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radial Progress Ring Component</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="progress-container">
        <div class="ease-progress-ring">
            <svg class="ease-progress-svg" viewBox="0 0 120 120">
                <circle class="ease-progress-track" cx="60" cy="60" r="50"></circle>
                <circle class="ease-progress-fill" cx="60" cy="60" r="50"></circle>
            </svg>
            <div class="ease-progress-value">75%</div>
        </div>
    </div>

</body>
</html>
