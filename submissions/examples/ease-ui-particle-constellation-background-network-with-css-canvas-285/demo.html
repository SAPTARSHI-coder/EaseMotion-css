<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Particle Constellation Network - Minimalist Clean</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Particle Canvas Background -->
  <canvas id="particle-canvas"></canvas>


  <!-- Forefront Content Placeholder -->
  <main class="content-placeholder" style="position: relative; z-index: 2; display: flex; justify-content: center; align-items: center; min-height: 100vh; pointer-events: none;">
    <!-- Content Placeholder -->
  </main>

  <!-- Particle Logic -->
  <script>
    const canvas = document.getElementById('particle-canvas');
    const ctx = canvas.getContext('2d');

    let particles = [];
    const maxParticles = 100;
    const connectionDistance = 120;
    const mouseDistance = 150;

    let mouse = {
      x: null,
      y: null
    };

    window.addEventListener('mousemove', (e) => {
      mouse.x = e.x;
      mouse.y = e.y;
    });

    window.addEventListener('mouseleave', () => {
      mouse.x = null;
      mouse.y = null;
    });

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    window.addEventListener('resize', resize);
    resize();

    class Particle {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 2 + 1;
        this.speedX = (Math.random() * 1) - 0.5;
        this.speedY = (Math.random() * 1) - 0.5;
        // Minimalist light grey
        this.color = 'rgba(148, 163, 184, 0.6)';
      }

      update() {
        this.x += this.speedX;
        this.y += this.speedY;

        // Bounce off edges
        if (this.x > canvas.width || this.x < 0) this.speedX *= -1;
        if (this.y > canvas.height || this.y < 0) this.speedY *= -1;
      }

      draw() {
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function init() {
      particles = [];
      for (let i = 0; i < maxParticles; i++) {
        particles.push(new Particle());
      }
    }

    function connect() {
      for (let a = 0; a < particles.length; a++) {
        for (let b = a; b < particles.length; b++) {
          let distance = ((particles[a].x - particles[b].x) * (particles[a].x - particles[b].x))
            + ((particles[a].y - particles[b].y) * (particles[a].y - particles[b].y));
          
          if (distance < (connectionDistance * connectionDistance)) {
            let opacityValue = 1 - (distance / (connectionDistance * connectionDistance));
            // Minimalist light blue line color
            ctx.strokeStyle = `rgba(99, 102, 241, ${opacityValue * 0.2})`;
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(particles[a].x, particles[a].y);
            ctx.lineTo(particles[b].x, particles[b].y);
            ctx.stroke();
          }
        }

        // Connect to mouse
        if (mouse.x != null && mouse.y != null) {
          let mouseDist = ((particles[a].x - mouse.x) * (particles[a].x - mouse.x))
            + ((particles[a].y - mouse.y) * (particles[a].y - mouse.y));
          
          if (mouseDist < (mouseDistance * mouseDistance)) {
            let mouseOpacity = 1 - (mouseDist / (mouseDistance * mouseDistance));
            // slightly stronger blue when interacting with mouse
            ctx.strokeStyle = `rgba(99, 102, 241, ${mouseOpacity * 0.4})`;
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(particles[a].x, particles[a].y);
            ctx.lineTo(mouse.x, mouse.y);
            ctx.stroke();
          }
        }
      }
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = 0; i < particles.length; i++) {
        particles[i].update();
        particles[i].draw();
      }
      connect();
      requestAnimationFrame(animate);
    }

    init();
    animate();
  </script>
</body>
</html>
