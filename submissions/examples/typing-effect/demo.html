<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Typing Text Effect Demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body, html {
      margin: 0;
      padding: 0;
      font-family: 'Courier New', Courier, monospace;
      background: #1e1e1e;
      color: #00ff00;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Override variables for the terminal look */
    :root {
      --ease-typing-cursor-color: #00ff00;
    }

    .demo-container {
      max-width: 90vw;
      padding: 2rem;
      background: #000;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    
    h1 {
      font-size: 2rem;
      font-weight: normal;
      margin: 0;
    }

    p {
      margin-top: 1rem;
      font-size: 1.2rem;
      opacity: 0.8;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #eee;
    }
  </style>
</head>
<body>

  <div class="demo-container">
    <!-- Using inline style to customize steps based on exact character count -->
    <h1 class="ease-typing" style="--ease-typing-steps: 32; --ease-typing-duration: 3s;">
      Initializing system protocols...
    </h1>
    <p>This retro typing effect is achieved purely through CSS `@keyframes` and `steps()`.</p>
  </div>

</body>
</html>
