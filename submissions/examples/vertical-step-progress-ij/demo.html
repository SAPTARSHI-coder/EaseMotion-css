<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-vertical-step-progress demo</title>
</head>
<body>
<div class="vp-app">
  <span class="vp-title">CHECKOUT PROGRESS</span>
  <div class="vp-rail"></div>
  <div class="vp-step vp-step-1">
    <span class="vp-dot">1</span>
    <span class="vp-label">CART</span>
  </div>
  <div class="vp-step vp-step-2">
    <span class="vp-dot">2</span>
    <span class="vp-label">ADDRESS</span>
  </div>
  <div class="vp-step vp-step-3">
    <span class="vp-dot">3</span>
    <span class="vp-label">PAYMENT</span>
  </div>
  <div class="vp-step vp-step-4">
    <span class="vp-dot">4</span>
    <span class="vp-label">DONE</span>
  </div>
  <span class="vp-status">STEP 2 OF 4</span>
</div>
</body>
</html>
