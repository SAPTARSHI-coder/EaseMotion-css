<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gyro Horizon Level — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Gyro Horizon Level demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Gyro Horizon Level</h1>
      <p class="lede">Artificial horizon gyro cage precessing back to level</p>
    </header>

    <section class="ease-gyro-horizon-level" data-demo="gyro-horizon-level" aria-live="polite">
      <div class="ease-gyro-horizon-level__housing">
        <div class="ease-gyro-horizon-level__bezel">
          <div class="ease-gyro-horizon-level__face">
            <div class="ease-gyro-horizon-level__readout">
              <span class="ease-gyro-horizon-level__label">Gyro Horizon Level</span>
              <span class="ease-gyro-horizon-level__value">LIVE</span>
            </div>
            <div class="ease-gyro-horizon-level__motion" aria-hidden="true">
              <span class="ease-gyro-horizon-level__a"></span>
              <span class="ease-gyro-horizon-level__b"></span>
              <span class="ease-gyro-horizon-level__c"></span>
              <span class="ease-gyro-horizon-level__d"></span>
            </div>
            <div class="ease-gyro-horizon-level__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-gyro-horizon-level__controls">
          <button type="button" class="ease-gyro-horizon-level__btn primary">Engage</button>
          <button type="button" class="ease-gyro-horizon-level__btn">Reset</button>
          <label class="ease-gyro-horizon-level__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-gyro-horizon-level__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
