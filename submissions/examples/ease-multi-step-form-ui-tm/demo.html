<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Multi-Step Form | EaseMotion CSS</title><link rel="stylesheet" href="style.css"></head>
<body><div class="mf-root">
<form class="mf-form">
<div class="mf-steps">
<div class="mf-step done"></div>
<div class="mf-step done"></div>
<div class="mf-step"></div>
</div>
<input type="radio" name="mf" class="mf-radio" id="mf1" checked>
<input type="radio" name="mf" class="mf-radio" id="mf2">
<input type="radio" name="mf" class="mf-radio" id="mf3">
<div class="mf-panel">
<label class="mf-label" for="mf1">Step 1: Personal Info</label>
<input type="text" class="mf-input" placeholder="Full Name" value="Jane Doe">
<input type="email" class="mf-input" placeholder="Email Address">
<button class="mf-btn" type="button" onclick="document.getElementById('mf2').click()">Next</button>
</div>
<div class="mf-panel">
<label class="mf-label" for="mf2">Step 2: Contact Details</label>
<input type="tel" class="mf-input" placeholder="Phone Number">
<input type="text" class="mf-input" placeholder="Address">
<button class="mf-btn" type="button" onclick="document.getElementById('mf1').click()">Back</button>
<button class="mf-btn" type="button" onclick="document.getElementById('mf3').click()">Next</button>
</div>
<div class="mf-panel">
<label class="mf-label" for="mf3">Step 3: Confirm</label>
<p class="mf-sub">Review your details and submit.</p>
<button class="mf-btn" type="button" onclick="document.getElementById('mf2').click()">Back</button>
<button class="mf-btn" type="button">Submit</button>
</div>
</form>
</div></body></html>
