<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Morphing Breadcrumb</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="page">
        <section class="showcase">
            <span class="eyebrow">Navigation Component</span>

            <h1>Morphing Breadcrumb</h1>
            <p class="description">
                A responsive breadcrumb with a soft glassmorphism interface
                and smooth morphing interactions.
            </p>

            <nav class="breadcrumb" aria-label="Breadcrumb">
                <a href="#" class="breadcrumb-item">
                    <span class="icon" aria-hidden="true">⌂</span>
                    <span class="label">Home</span>
                </a>

                <span class="separator" aria-hidden="true">/</span>

                <a href="#" class="breadcrumb-item">
                    <span class="icon" aria-hidden="true">◈</span>
                    <span class="label">Projects</span>
                </a>

                <span class="separator" aria-hidden="true">/</span>

                <a href="#" class="breadcrumb-item">
                    <span class="icon" aria-hidden="true">✦</span>
                    <span class="label">Components</span>
                </a>

                <span class="separator" aria-hidden="true">/</span>

                <span class="breadcrumb-item current" aria-current="page">
                    <span class="icon" aria-hidden="true">●</span>
                    <span class="label">Breadcrumb</span>
                </span>
            </nav>
        </section>
    </main>

</body>
</html>
