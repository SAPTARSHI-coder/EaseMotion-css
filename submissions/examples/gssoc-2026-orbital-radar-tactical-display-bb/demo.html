<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orbital Radar Tactical Display - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="radar-container">
    <header class="radar-header">
      <span class="badge">GSSoC 2026 Showcase</span>
      <h1>Orbital Radar Tactical Display</h1>
      <p>360-degree rotating sonar sweep radar display with pulsing target blips, distance grid rings, and tactical telemetry readout.</p>
    </header>

    <div class="radar-card" tabindex="0">
      <div class="radar-viewport">
        <div class="grid-ring ring-1"></div>
        <div class="grid-ring ring-2"></div>
        <div class="grid-ring ring-3"></div>
        <div class="axis-line axis-h"></div>
        <div class="axis-line axis-v"></div>

        <div class="radar-sweep"></div>

        <!-- Target Blips -->
        <div class="target-blip blip-1">
          <span class="blip-ping"></span>
          <span class="blip-label">OBJ-774</span>
        </div>
        <div class="target-blip blip-2">
          <span class="blip-ping"></span>
          <span class="blip-label">SAT-902</span>
        </div>
        <div class="target-blip blip-3">
          <span class="blip-ping"></span>
          <span class="blip-label">DRONE-X</span>
        </div>
      </div>

      <div class="radar-telemetry">
        <div class="tel-item">
          <span class="tel-lbl">RANGE:</span>
          <span class="tel-val">420 KM</span>
        </div>
        <div class="tel-item">
          <span class="tel-lbl">SWEEP FREQ:</span>
          <span class="tel-val">60 RPM</span>
        </div>
        <div class="tel-item">
          <span class="tel-lbl">TARGETS:</span>
          <span class="tel-val">3 ACTIVE</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
