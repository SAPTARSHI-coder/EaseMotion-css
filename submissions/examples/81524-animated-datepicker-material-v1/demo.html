<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Animated Material Design datepicker built with pure HTML and CSS."
  >

  <title>Animated Material Datepicker</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="material-page">
    <section
      class="material-datepicker"
      aria-labelledby="datepicker-title"
    >
      <!-- Header -->
      <header class="datepicker-header">
        <div class="header-content">
          <span class="header-eyebrow">
            MATERIAL DATEPICKER
          </span>

          <h1 id="datepicker-title">
            Pick a date
          </h1>

          <p>
            Select a date for your upcoming event.
          </p>
        </div>

        <div
          class="header-calendar"
          aria-hidden="true"
        >
          <span class="calendar-ring"></span>
          <span class="calendar-ring"></span>

          <div class="calendar-grid">
            <i></i>
            <i></i>
            <i></i>
            <i></i>
            <i></i>
            <i></i>
          </div>
        </div>
      </header>

      <!-- Date form -->
      <form class="datepicker-content">
        <div class="material-field">
          <input
            id="material-date"
            name="material-date"
            type="date"
            required
            aria-describedby="date-help"
          >

          <label for="material-date">
            Select date
          </label>

          <span class="field-line"></span>
        </div>

        <p
          id="date-help"
          class="date-help"
        >
          Your selected date will be used for scheduling.
        </p>

        <!-- Static calendar preview -->
        <div
          class="calendar-preview"
          aria-label="Calendar preview"
        >
          <div class="calendar-toolbar">
            <button
              type="button"
              class="month-button"
              aria-label="Previous month"
            >
              ‹
            </button>

            <div class="month-heading">
              <strong>August</strong>
              <span>2026</span>
            </div>

            <button
              type="button"
              class="month-button"
              aria-label="Next month"
            >
              ›
            </button>
          </div>

          <div class="weekday-row">
            <span>Sun</span>
            <span>Mon</span>
            <span>Tue</span>
            <span>Wed</span>
            <span>Thu</span>
            <span>Fri</span>
            <span>Sat</span>
          </div>

          <div class="calendar-days">
            <span class="muted-day">26</span>
            <span class="muted-day">27</span>
            <span class="muted-day">28</span>
            <span class="muted-day">29</span>
            <span class="muted-day">30</span>
            <span class="muted-day">31</span>

            <button type="button">1</button>
            <button type="button">2</button>
            <button type="button">3</button>
            <button type="button">4</button>
            <button type="button">5</button>
            <button type="button">6</button>
            <button type="button">7</button>
            <button type="button">8</button>
            <button type="button">9</button>
            <button type="button">10</button>
            <button type="button">11</button>
            <button type="button">12</button>
            <button type="button">13</button>
            <button
              type="button"
              class="selected-day"
              aria-current="date"
            >
              14
            </button>
            <button type="button">15</button>
            <button type="button">16</button>
            <button type="button">17</button>
            <button type="button">18</button>
            <button type="button">19</button>
            <button type="button">20</button>
            <button type="button">21</button>
            <button type="button">22</button>
            <button type="button">23</button>
            <button type="button">24</button>
            <button type="button">25</button>
            <button type="button">26</button>
            <button type="button">27</button>
            <button type="button">28</button>
            <button type="button">29</button>
            <button type="button">30</button>
            <button type="button">31</button>
            <span class="muted-day">1</span>
            <span class="muted-day">2</span>
            <span class="muted-day">3</span>
            <span class="muted-day">4</span>
            <span class="muted-day">5</span>
          </div>
        </div>

        <!-- Footer -->
        <div class="datepicker-footer">
          <span class="today-indicator">
            <span></span>
            Today: August 14, 2026
          </span>

          <button
            type="submit"
            class="confirm-button"
          >
            Confirm date
          </button>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
