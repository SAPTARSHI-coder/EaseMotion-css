<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Sticky Comparison Bar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="layout-container">
        
        <header class="section-header">
            <h1 class="title">Sticky Comparison Bar</h1>
            <p class="subtitle">A pure CSS floating comparison bar that reveals itself when checkboxes are selected using the <code>:has()</code> pseudo-class, featuring sticky positioning and dynamic states.</p>
        </header>

        <div class="demo-area">
            
            <!-- 
              [TECHNIQUE] The :has() State Controller
              The parent container '.product-grid' will monitor the checked state of 
              the hidden checkboxes to trigger the sticky bar visibility at the bottom.
            -->
            <form class="product-container" onsubmit="event.preventDefault();">
                
                <div class="product-grid">
                    
                    <!-- Product 1 -->
                    <label class="product-card" for="compare-1">
                        <input type="checkbox" id="compare-1" class="compare-checkbox sr-only">
                        <div class="card-image bg-blue"></div>
                        <div class="card-content">
                            <h3>Quantum Pro</h3>
                            <p>$1,299</p>
                        </div>
                        <div class="card-overlay">
                            <span class="btn-select">Select to Compare</span>
                        </div>
                    </label>
                    
                    <!-- Product 2 -->
                    <label class="product-card" for="compare-2">
                        <input type="checkbox" id="compare-2" class="compare-checkbox sr-only">
                        <div class="card-image bg-purple"></div>
                        <div class="card-content">
                            <h3>Quantum Max</h3>
                            <p>$1,599</p>
                        </div>
                        <div class="card-overlay">
                            <span class="btn-select">Select to Compare</span>
                        </div>
                    </label>
                    
                    <!-- Product 3 -->
                    <label class="product-card" for="compare-3">
                        <input type="checkbox" id="compare-3" class="compare-checkbox sr-only">
                        <div class="card-image bg-green"></div>
                        <div class="card-content">
                            <h3>Quantum Lite</h3>
                            <p>$899</p>
                        </div>
                        <div class="card-overlay">
                            <span class="btn-select">Select to Compare</span>
                        </div>
                    </label>
                    
                    <!-- Product 4 -->
                    <label class="product-card" for="compare-4">
                        <input type="checkbox" id="compare-4" class="compare-checkbox sr-only">
                        <div class="card-image bg-orange"></div>
                        <div class="card-content">
                            <h3>Quantum Air</h3>
                            <p>$1,099</p>
                        </div>
                        <div class="card-overlay">
                            <span class="btn-select">Select to Compare</span>
                        </div>
                    </label>

                </div>
                
                <!-- 
                  The Sticky Bar
                  Hidden by default, slides up when any checkbox above is checked.
                -->
                <div class="sticky-comparison-bar">
                    <div class="bar-content">
                        
                        <div class="compare-status">
                            <div class="status-icon">
                                <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="9" y1="3" x2="9" y2="21"></line></svg>
                            </div>
                            <div class="status-text">
                                <strong>Comparison Mode</strong>
                                <span>Select products to compare</span>
                            </div>
                        </div>
                        
                        <div class="compare-actions">
                            <button type="reset" class="btn-clear">Clear All</button>
                            <!-- 
                              The Compare button pulses when exactly 2 or more are selected. 
                              (Logic handled in CSS via counting checked pseudo-classes)
                            -->
                            <button type="submit" class="btn-compare">Compare Now</button>
                        </div>
                        
                    </div>
                </div>
                
            </form>
            
        </div>
        
    </div>

</body>
</html>
