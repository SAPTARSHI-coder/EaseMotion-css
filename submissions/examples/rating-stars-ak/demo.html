<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive Star Rating — EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <p class="label">Pure CSS Interactive Star Rating (Hover &amp; Select)</p>

  <div class="ease-rating-stars">
    <input type="radio" name="star-ak" id="star5-ak" />
    <label for="star5-ak" class="ease-rating-star-label">★</label>

    <input type="radio" name="star-ak" id="star4-ak" checked />
    <label for="star4-ak" class="ease-rating-star-label">★</label>

    <input type="radio" name="star-ak" id="star3-ak" />
    <label for="star3-ak" class="ease-rating-star-label">★</label>

    <input type="radio" name="star-ak" id="star2-ak" />
    <label for="star2-ak" class="ease-rating-star-label">★</label>

    <input type="radio" name="star-ak" id="star1-ak" />
    <label for="star1-ak" class="ease-rating-star-label">★</label>
  </div>

</body>
</html>
