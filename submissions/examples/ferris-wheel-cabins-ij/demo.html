<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-ferris-wheel-cabins demo</title>
</head>
<body>
<div class="fwc-park">
  <span class="fwc-title">SKY WHEEL</span>
  <div class="fwc-wheel">
    <span class="fwc-hub"></span>
    <span class="fwc-spoke fw-sp1"></span>
    <span class="fwc-spoke fw-sp2"></span>
    <span class="fwc-spoke fw-sp3"></span>
    <span class="fwc-spoke fw-sp4"></span>
    <span class="fwc-spoke fw-sp5"></span>
    <span class="fwc-spoke fw-sp6"></span>
    <span class="fwc-rim"></span>
  </div>
  <div class="fwc-ring">
    <span class="fwc-cabin fw-c1"></span>
    <span class="fwc-cabin fw-c2"></span>
    <span class="fwc-cabin fw-c3"></span>
    <span class="fwc-cabin fw-c4"></span>
    <span class="fwc-cabin fw-c5"></span>
    <span class="fwc-cabin fw-c6"></span>
  </div>
  <span class="fwc-base">GATE</span>
</div>
</body>
</html>
