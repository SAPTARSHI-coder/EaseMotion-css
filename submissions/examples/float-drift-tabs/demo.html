<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Float Drift Tabs</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="tabs-container">

    <input type="radio" name="tab" id="tab1" checked>
    <input type="radio" name="tab" id="tab2">
    <input type="radio" name="tab" id="tab3">

    <div class="tab-buttons">
        <label for="tab1">About</label>
        <label for="tab2">Projects</label>
        <label for="tab3">Contact</label>
    </div>

    <div class="tab-content">
        <div class="content content1">
            <h2>About</h2>
            <p>Creative portfolio showcasing modern UI built with pure HTML and CSS.</p>
        </div>

        <div class="content content2">
            <h2>Projects</h2>
            <p>Explore interactive portfolio projects featuring elegant CSS animations.</p>
        </div>

        <div class="content content3">
            <h2>Contact</h2>
            <p>Reach out for collaborations, freelance work, or creative partnerships.</p>
        </div>
    </div>

</div>

</body>
</html>
