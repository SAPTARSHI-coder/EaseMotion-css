<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Origami Folding Navigation Drawer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../easemotion.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>3D Origami Folding Drawer</h1>
      <p>Unfold navigation panels using 3D perspective hinges.</p>
      <button class="btn" onclick="toggleDrawer()">Toggle Drawer</button>
    </header>

    <div class="drawer-container" id="drawerContainer">
      <div class="origami-panel panel-1">
        <h3>Panel 1</h3>
        <p>Dashboard</p>
      </div>
      <div class="origami-panel panel-2">
        <h3>Panel 2</h3>
        <p>Settings</p>
      </div>
      <div class="origami-panel panel-3">
        <h3>Panel 3</h3>
        <p>Profile</p>
      </div>
    </div>
  </div>

  <script>
    function toggleDrawer() {
      document.getElementById('drawerContainer').classList.toggle('open');
    }
  </script>
</body>
</html>
