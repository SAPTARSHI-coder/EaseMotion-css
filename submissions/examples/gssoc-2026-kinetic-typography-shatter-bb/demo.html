<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kinetic Typography Shatter & Reassemble | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;900&display=swap" rel="stylesheet">
</head>
<body>
  <main class="container">
    <header class="header">
      <span class="badge">Kinetic Motion</span>
      <h1 class="title">Kinetic Shatter</h1>
      <p class="subtitle">Hover over or click the typography block to trigger 3D fragment shatter and spring reassembly physics.</p>
    </header>

    <section class="stage" id="kineticStage">
      <div class="shatter-card">
        <div class="glow-backdrop"></div>
        <div class="shatter-text-wrapper" id="shatterWrapper" tabindex="0" role="button" aria-label="Interactive Kinetic Typography Shatter Text">
          <span class="char-shard" style="--tx: -40px; --ty: -50px; --rz: -25deg; --delay: 0.02s;">E</span>
          <span class="char-shard" style="--tx: -20px; --ty: 40px; --rz: 15deg; --delay: 0.05s;">A</span>
          <span class="char-shard" style="--tx: 30px; --ty: -35px; --rz: -18deg; --delay: 0.08s;">S</span>
          <span class="char-shard" style="--tx: -35px; --ty: 30px; --rz: 22deg; --delay: 0.11s;">E</span>
          <span class="char-shard accent-shard" style="--tx: 45px; --ty: -45px; --rz: -30deg; --delay: 0.14s;">M</span>
          <span class="char-shard accent-shard" style="--tx: -25px; --ty: 50px; --rz: 20deg; --delay: 0.17s;">O</span>
          <span class="char-shard accent-shard" style="--tx: 35px; --ty: -30px; --rz: -15deg; --delay: 0.20s;">T</span>
          <span class="char-shard accent-shard" style="--tx: -45px; --ty: -25px; --rz: 28deg; --delay: 0.23s;">I</span>
          <span class="char-shard accent-shard" style="--tx: 20px; --ty: 45px; --rz: -22deg; --delay: 0.26s;">O</span>
          <span class="char-shard accent-shard" style="--tx: -30px; --ty: -40px; --rz: 18deg; --delay: 0.29s;">N</span>
        </div>
        <div class="card-footer">
          <span class="status-indicator"><span class="dot"></span> CSS 3D Particle Physics</span>
          <button class="trigger-btn" id="toggleTrigger" onclick="document.getElementById('shatterWrapper').classList.toggle('is-shattered')">Trigger Shatter</button>
        </div>
      </div>
    </section>

    <footer class="info-footer">
      <p>Built for EaseMotion CSS Library • High Performance 60FPS GPU Acceleration</p>
    </footer>
  </main>
</body>
</html>
