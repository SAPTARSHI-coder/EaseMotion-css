<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pomodoro Ring - EaseMotion Submission</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="stage">
    <div class="pomodoro" id="pomodoro">
      <div class="ring-wrap">
        <svg class="ring" viewBox="0 0 200 200" aria-hidden="true">
          <circle class="ring-track" cx="100" cy="100" r="86"></circle>
          <circle class="ring-progress" id="ringProgress" cx="100" cy="100" r="86"></circle>
        </svg>
        <div class="ring-center">
          <span class="time" id="timeText">25:00</span>
          <span class="mode" id="modeText">Focus</span>
        </div>
      </div>
      <div class="status-row">
        <span class="status-pill"><span class="status-dot"></span> Session 2 / 4</span>
      </div>
      <div class="controls">
        <button class="btn start" id="startBtn">Start</button>
        <button class="btn pause" id="pauseBtn">Pause</button>
        <button class="btn reset" id="resetBtn">Reset</button>
      </div>
      <p class="hint" id="hint">A 25-minute focus cycle with an animated progress ring.</p>
    </div>
  </main>

  <script>
    const pomodoro = document.getElementById('pomodoro');
    const ring = document.getElementById('ringProgress');
    const timeText = document.getElementById('timeText');
    const modeText = document.getElementById('modeText');

    const FOCUS = 25 * 60;
    const BREAK = 5 * 60;
    const CIRC = 2 * Math.PI * 86;

    ring.style.strokeDasharray = CIRC;
    ring.style.strokeDashoffset = 0;

    let total = FOCUS;
    let remaining = FOCUS;
    let timer = null;

    function render() {
      const m = String(Math.floor(remaining / 60)).padStart(2, '0');
      const s = String(remaining % 60).padStart(2, '0');
      timeText.textContent = m + ':' + s;
      ring.style.strokeDashoffset = CIRC * (1 - remaining / total);
    }

    function stop() {
      clearInterval(timer);
      timer = null;
      pomodoro.classList.remove('running');
    }

    document.getElementById('startBtn').addEventListener('click', () => {
      if (timer) return;
      pomodoro.classList.add('running');
      timer = setInterval(() => {
        remaining -= 1;
        if (remaining <= 0) {
          const wasFocus = total === FOCUS;
          total = wasFocus ? BREAK : FOCUS;
          remaining = total;
          modeText.textContent = wasFocus ? 'Break' : 'Focus';
          pomodoro.classList.remove('running');
          pomodoro.classList.add('mode-break', 'finished');
          void pomodoro.offsetWidth;
          pomodoro.classList.remove('finished');
          stop();
          render();
          return;
        }
        render();
      }, 1000);
    });

    document.getElementById('pauseBtn').addEventListener('click', stop);

    document.getElementById('resetBtn').addEventListener('click', () => {
      stop();
      total = FOCUS;
      remaining = FOCUS;
      modeText.textContent = 'Focus';
      render();
    });

    render();
  </script>
</body>
</html>
