<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ease Image Accordion</title>
    <link rel="stylesheet" href="../../../easemotion.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="ease-accordion-container">
        <!-- Panel 1 -->
        <div class="ease-accordion-panel" style="background-image: url('https://images.unsplash.com/photo-1506744626753-1fa44df31c78?ixlib=rb-1.2.1&auto=format&fit=crop&w=1350&q=80');">
            <div class="panel-content">
                <h3>Nature</h3>
                <p>Explore the great outdoors.</p>
            </div>
        </div>
        
        <!-- Panel 2 -->
        <div class="ease-accordion-panel" style="background-image: url('https://images.unsplash.com/photo-1518837695005-2083093ee35b?ixlib=rb-1.2.1&auto=format&fit=crop&w=1350&q=80');">
            <div class="panel-content">
                <h3>Ocean</h3>
                <p>Dive deep into the unknown.</p>
            </div>
        </div>
        
        <!-- Panel 3 -->
        <div class="ease-accordion-panel" style="background-image: url('https://images.unsplash.com/photo-1449844908441-8829872d2607?ixlib=rb-1.2.1&auto=format&fit=crop&w=1350&q=80');">
            <div class="panel-content">
                <h3>City</h3>
                <p>The concrete jungle.</p>
            </div>
        </div>
        
        <!-- Panel 4 -->
        <div class="ease-accordion-panel" style="background-image: url('https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?ixlib=rb-1.2.1&auto=format&fit=crop&w=1350&q=80');">
            <div class="panel-content">
                <h3>Mountains</h3>
                <p>Reach for the peaks.</p>
            </div>
        </div>
        
        <!-- Panel 5 -->
        <div class="ease-accordion-panel" style="background-image: url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?ixlib=rb-1.2.1&auto=format&fit=crop&w=1350&q=80');">
            <div class="panel-content">
                <h3>Beach</h3>
                <p>Relax by the shore.</p>
            </div>
        </div>
    </div>
</body>
</html>
