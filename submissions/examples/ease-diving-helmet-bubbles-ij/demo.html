<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diving Helmet Bubbles Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="undersea" aria-label="diver scene">
    <div class="helmet" aria-hidden="true">
      <span class="dome"></span>
      <span class="collar"></span>
      <span class="window"></span>
      <span class="window-glow"></span>
    </div>
    <span class="bubble bub1" aria-hidden="true"></span>
    <span class="bubble bub2" aria-hidden="true"></span>
    <span class="bubble bub3" aria-hidden="true"></span>
    <span class="bubble bub4" aria-hidden="true"></span>
    <span class="surface" aria-hidden="true"></span>
    <p class="tag">AIR OK</p>
  </main>
</body>
</html>
