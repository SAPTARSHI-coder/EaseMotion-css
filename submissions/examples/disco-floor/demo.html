<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Disco Floor &mdash; EaseMotion CSS Demo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="page-head">
    <p class="kicker">EaseMotion CSS &middot; Fun &amp; Visuals</p>
    <h1>Disco Floor</h1>
    <p class="sub">A tilted dance floor where every tile takes its turn to blaze.</p>
  </header>
  <main class="stage">
    <div class="df-floor">
      <div class="df-tile df-t1"></div><div class="df-tile df-t2"></div><div class="df-tile df-t3"></div><div class="df-tile df-t4"></div>
      <div class="df-tile df-t5"></div><div class="df-tile df-t6"></div><div class="df-tile df-t7"></div><div class="df-tile df-t8"></div>
      <div class="df-tile df-t1"></div><div class="df-tile df-t2"></div><div class="df-tile df-t3"></div><div class="df-tile df-t4"></div>
      <div class="df-tile df-t5"></div><div class="df-tile df-t6"></div><div class="df-tile df-t7"></div><div class="df-tile df-t8"></div>
    </div>
  </main>
  <p class="stage-caption">Sixteen tiles, eight colors, one strobe sequence.</p>
  <footer class="page-foot">
    <span>Pure CSS &middot; zero dependencies</span>
    <span>Strobing tiles</span>
  </footer>
</body>
</html>
