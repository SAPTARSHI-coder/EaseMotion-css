<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Flipping Pricing Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card-container">
        <div class="pricing-card">
            <div class="card-front">
                <h2>Pro Plan</h2>
                <div class="price">$29<span>/mo</span></div>
                <p>Perfect for professionals.</p>
                <div class="flip-hint">Hover to see features &#8594;</div>
            </div>
            <div class="card-back">
                <h3>Features</h3>
                <ul>
                    <li>Unlimited Projects</li>
                    <li>24/7 Support</li>
                    <li>Advanced Analytics</li>
                    <li>Custom Domain</li>
                </ul>
                <a href="#" class="buy-btn">Choose Plan</a>
            </div>
        </div>
    </div>
</body>
</html>
