<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Slide-Up Toast — SaaS Showcase</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="ease-container">
    <p class="ease-eyebrow">Security Alert</p>
    <h1 class="ease-heading">Session Notice</h1>
    <p class="ease-subtitle">Toggle or hover the notification to trigger the smooth slide-up reveal entrance.</p>

    <div class="ease-toast-wrapper">
      <input type="checkbox" id="ease-saas-slide-toggle" class="ease-toast-input" checked />

      <label for="ease-saas-slide-toggle" class="ease-trigger-btn">
        Toggle Security Toast
      </label>

      <div class="ease-toast">
        <div class="ease-toast-icon">🛡️</div>

        <div class="ease-toast-content">
          <p class="ease-toast-title">New Device Login</p>
          <p class="ease-toast-message">Sign-in detected from macOS in San Francisco, US.</p>
        </div>

        <label for="ease-saas-slide-toggle" class="ease-toast-close" title="Dismiss Alert">✕</label>
      </div>
    </div>
  </main>
</body>
</html>
