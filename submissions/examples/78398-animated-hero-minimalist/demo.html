<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />
  <meta
    name="description"
    content="Responsive animated minimalist hero section built with HTML and CSS."
  />
  <title>Animated Minimalist Hero</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main class="page">
    <section class="hero" aria-labelledby="hero-title">
      <div class="hero__grid" aria-hidden="true"></div>
      <div class="hero__orb hero__orb--one" aria-hidden="true"></div>
      <div class="hero__orb hero__orb--two" aria-hidden="true"></div>

      <div class="hero__content">
        <p class="hero__eyebrow">
          Design / Technology / Motion
        </p>

        <h1 id="hero-title" class="hero__title">
          Build something
          <span>remarkable.</span>
        </h1>

        <p class="hero__description">
          A clean animated hero section designed around
          whitespace, subtle motion, and focused typography.
        </p>

        <div class="hero__actions">
          <a class="hero__button hero__button--primary" href="#explore">
            Explore Work
            <span aria-hidden="true">↗</span>
          </a>

          <a class="hero__button hero__button--secondary" href="#about">
            Learn More
          </a>
        </div>

        <div class="hero__meta" aria-label="Project information">
          <div class="hero__meta-item">
            <span class="hero__meta-number">01</span>
            <span class="hero__meta-label">Creative</span>
          </div>

          <div class="hero__meta-divider" aria-hidden="true"></div>

          <div class="hero__meta-item">
            <span class="hero__meta-number">02</span>
            <span class="hero__meta-label">Precise</span>
          </div>

          <div class="hero__meta-divider" aria-hidden="true"></div>

          <div class="hero__meta-item">
            <span class="hero__meta-number">03</span>
            <span class="hero__meta-label">Minimal</span>
          </div>
        </div>
      </div>

      <div class="hero__visual" aria-hidden="true">
        <div class="hero__visual-frame">
          <div class="hero__visual-ring hero__visual-ring--outer"></div>
          <div class="hero__visual-ring hero__visual-ring--middle"></div>
          <div class="hero__visual-ring hero__visual-ring--inner"></div>

          <div class="hero__visual-core">
            <span></span>
          </div>

          <div class="hero__visual-line hero__visual-line--one"></div>
          <div class="hero__visual-line hero__visual-line--two"></div>
          <div class="hero__visual-line hero__visual-line--three"></div>
        </div>

        <span class="hero__visual-label hero__visual-label--top">
          SYSTEM 01
        </span>

        <span class="hero__visual-label hero__visual-label--bottom">
          MOTION / 2026
        </span>
      </div>

      <div class="hero__scroll">
        <span class="hero__scroll-line"></span>
        <span>Scroll to explore</span>
      </div>
    </section>
  </main>
</body>
</html>
