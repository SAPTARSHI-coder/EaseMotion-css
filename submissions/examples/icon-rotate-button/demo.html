<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Icon Rotate Button</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="demo-shell">
      <section class="demo-card" aria-labelledby="irb-title">
        <p class="eyebrow">Button feedback</p>
        <h1 id="irb-title">Icon rotate</h1>
        <p class="demo-copy">
          A circle icon button whose arrow spins 90 degrees and darts forward
          on hover.
        </p>
        <button class="icon-rotate-button" type="button" aria-label="Next">
          <svg class="icon-rotate-button__icon" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false">
            <path d="M5 12h12M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
      </section>
    </main>
  </body>
</html>
