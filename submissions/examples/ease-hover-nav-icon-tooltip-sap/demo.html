<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hover Nav Icon Tooltip</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <h1>Hover Nav Icon Tooltip</h1>

    <nav class="icon-nav" aria-label="Primary">
      <div class="nav-item-wrap">
        <a href="#" class="nav-icon-link" aria-describedby="tip-home">🏠</a>
        <span class="icon-tip" id="tip-home" role="tooltip">Home</span>
      </div>
      <div class="nav-item-wrap">
        <a href="#" class="nav-icon-link" aria-describedby="tip-search">🔍</a>
        <span class="icon-tip" id="tip-search" role="tooltip">Search</span>
      </div>
      <div class="nav-item-wrap">
        <a href="#" class="nav-icon-link" aria-describedby="tip-settings">⚙️</a>
        <span class="icon-tip" id="tip-settings" role="tooltip">Settings</span>
      </div>
    </nav>
  </main>
</body>
</html>
