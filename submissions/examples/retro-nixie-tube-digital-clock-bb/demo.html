<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retro Nixie Tube Digital Clock - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="nixie-clock-container">
    <div class="nixie-header">CHRONO_NIXIE // MODEL-1974</div>
    
    <div class="nixie-display">
      <div class="nixie-tube">
        <span class="filament-glow">1</span>
        <div class="wire-grid"></div>
      </div>
      <div class="nixie-tube">
        <span class="filament-glow">2</span>
        <div class="wire-grid"></div>
      </div>
      
      <div class="nixie-colon">:</div>
      
      <div class="nixie-tube">
        <span class="filament-glow">4</span>
        <div class="wire-grid"></div>
      </div>
      <div class="nixie-tube">
        <span class="filament-glow">5</span>
        <div class="wire-grid"></div>
      </div>
    </div>
    
    <div class="nixie-base">
      <div class="screw left"></div>
      <span class="brand-plate">VACUUM STATE</span>
      <div class="screw right"></div>
    </div>
  </div>
</body>
</html>
