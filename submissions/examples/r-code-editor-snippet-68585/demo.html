<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CSS styled code editor snippet.">
  <title>CSS Code Editor Snippet</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="editor" aria-label="Code editor snippet">

    <header class="editor-header">
      <div class="dots" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
      </div>

      <span class="filename">app.js</span>
    </header>

    <div class="code" role="region" aria-label="Code example">
      <div class="line">
        <span class="number">1</span>
        <code><span class="keyword">const</span> greet = <span class="function">name</span> =&gt; {</code>
      </div>

      <div class="line">
        <span class="number">2</span>
        <code>&nbsp;&nbsp;<span class="keyword">return</span> <span class="string">`Hello, ${name}!`</span>;</code>
      </div>

      <div class="line">
        <span class="number">3</span>
        <code>};</code>
      </div>

      <div class="line">
        <span class="number">4</span>
        <code>&nbsp;</code>
      </div>

      <div class="line">
        <span class="number">5</span>
        <code><span class="function">console</span>.log(greet(<span class="string">"EaseMotion"</span>));</code>
      </div>
    </div>

  </main>

</body>
</html>
