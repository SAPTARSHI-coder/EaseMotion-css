<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Animated Progress Steps - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="steps-page">

    <header class="steps-header">
      <span class="section-pill">Checkout</span>
      <h1>Complete Your Setup</h1>
      <p>Track the progress of your onboarding steps with smooth animation.</p>
    </header>

    <section class="steps-wrapper" aria-label="Progress steps">

      <ol class="progress-steps" style="--progress: 42%;">

        <!-- Completed Step -->
        <li class="step completed">
          <span class="step-indicator">✓</span>
          <span class="step-content">
            <span class="step-label">Account</span>
            <span class="step-desc">Create your account</span>
          </span>
        </li>

        <!-- Active Step -->
        <li class="step active" aria-current="step">
          <span class="step-indicator">2</span>
          <span class="step-content">
            <span class="step-label">Profile</span>
            <span class="step-desc">Complete profile details</span>
          </span>
        </li>

        <!-- Upcoming Step -->
        <li class="step">
          <span class="step-indicator">3</span>
          <span class="step-content">
            <span class="step-label">Payment</span>
            <span class="step-desc">Add payment method</span>
          </span>
        </li>

        <!-- Upcoming Step -->
        <li class="step">
          <span class="step-indicator">4</span>
          <span class="step-content">
            <span class="step-label">Finish</span>
            <span class="step-desc">Review and submit</span>
          </span>
        </li>

      </ol>

    </section>

  </main>

</body>
</html>
