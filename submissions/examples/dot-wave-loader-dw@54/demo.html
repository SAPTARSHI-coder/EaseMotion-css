<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dot Wave Loader - EaseMotion CSS</title>

  <link rel="stylesheet" href="style.css" />

  <!-- Optional: main EaseMotion CSS -->
  <link rel="stylesheet" href="../../easemotion.css" />
</head>
<body>
  <main class="demo-container">
    <h1>Dot Wave Loader</h1>
    <p class="subtitle">Pure CSS loading animation</p>

    <!-- Default loader -->
    <div
      class="ease-dot-wave-dw"
      role="status"
      aria-label="Loading"
    >
      <span></span>
      <span></span>
      <span></span>
    </div>

    <!-- Custom colored loader -->
    <div
      class="ease-dot-wave-dw"
      role="status"
      aria-label="Loading"
      style="
        --dot-color-dw: #ff4ecd;
        --dot-size-dw: 14px;
        --dot-speed-dw: 0.8s;
      "
    >
      <span></span>
      <span></span>
      <span></span>
    </div>

    <!-- Custom green loader -->
    <div
      class="ease-dot-wave-dw"
      role="status"
      aria-label="Loading"
      style="
        --dot-color-dw: #4ade80;
        --dot-size-dw: 10px;
        --dot-speed-dw: 1.2s;
      "
    >
      <span></span>
      <span></span>
      <span></span>
    </div>

    <p class="hint">
      Easy to customize using CSS variables.
    </p>
  </main>
</body>
</html>
