<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Loader: Foucault Pendulum</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="layout-container">
        
        <header class="section-header">
            <h1 class="title">Pure CSS Loader: Foucault Pendulum</h1>
            <p class="subtitle">A classic physics-inspired loader utilizing 3D transform origins and sweeping cubic-bezier arcs to simulate gravity and precession.</p>
        </header>

        <div class="demo-area">
            
            <div class="loader-container" aria-label="Loading content, pendulum swinging animation playing">
                
                <!-- 
                  [TECHNIQUE] Foucault Pendulum
                  A pendulum is constructed with a string line and a bottom weight (bob).
                  By setting the transform-origin to the very top center, applying
                  a swinging keyframe simulates gravity. Rotating the entire assembly
                  slowly in 3D space simulates the Foucault precession effect.
                -->
                <div class="pendulum-wrapper" aria-hidden="true">
                    
                    <div class="pendulum-system">
                        <div class="string"></div>
                        <div class="bob"></div>
                    </div>
                    
                    <!-- Ground shadow that tracks the pendulum bob -->
                    <div class="ground-shadow"></div>
                    
                </div>
                
                <div class="loading-text">Measuring Rotation...</div>
                
            </div>
            
        </div>
        
    </div>

</body>
</html>
