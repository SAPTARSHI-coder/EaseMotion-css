<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS HTTP Method Badge</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <section class="showcase">
            <header>
                <p class="eyebrow">EaseMotion CSS</p>
                <h1>HTTP Method Badges</h1>
                <p>Reusable, accessible CSS badges for common HTTP request methods with subtle interaction effects.</p>
            </header>

            <!-- Interactive Example (Links) -->
            <div class="method-grid">
                <a href="#" class="method-badge method-get" aria-label="GET request method">GET</a>
                <a href="#" class="method-badge method-post" aria-label="POST request method">POST</a>
                <a href="#" class="method-badge method-put" aria-label="PUT request method">PUT</a>
                <a href="#" class="method-badge method-delete" aria-label="DELETE request method">DELETE</a>
            </div>
            
            <!-- Non-interactive Example (Documentation Layout) -->
            <div class="usage-section">
                <h2>API Documentation Example</h2>
                
                <div class="api-endpoint">
                    <span class="method-badge method-get">GET</span>
                    <code class="endpoint-url">/api/v1/users</code>
                </div>
                
                <div class="api-endpoint">
                    <span class="method-badge method-post">POST</span>
                    <code class="endpoint-url">/api/v1/users</code>
                </div>
                
                <div class="api-endpoint">
                    <span class="method-badge method-put">PUT</span>
                    <code class="endpoint-url">/api/v1/users/123</code>
                </div>
                
                <div class="api-endpoint">
                    <span class="method-badge method-delete">DELETE</span>
                    <code class="endpoint-url">/api/v1/users/123</code>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
