<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nitrogen Vacancy Center Spin Qubits - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css"></head><body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030712; color: #ffffff;">

    <div class="ease-card ease-card-glass nv-container">
        <div class="nv-header">
            <h2>NV Center Spin Qubits</h2>
            <span class="ease-badge ease-badge-primary">Diamond Solid-State</span>
        </div>
        
        <div class="nv-screen ease-center">
            <div class="nv-flux flux-nv-a"></div>
            <div class="nv-flux flux-nv-b"></div>
            <div class="nv-boundary-ring"></div>
            <div class="nv-core ease-center"></div>
        </div>

        <div class="nv-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">ODMR, Green Laser Excitation &amp; Carbon-13 Nuclear Memory</span>
            <button class="ease-btn ease-btn-primary ease-btn-sm ease-hover-grow">Run NV Center Spin</button>
        </div>
    </div></body></html>
