<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-progress-steps-wizard demo</title>
</head>
<body>
<div class="psw-wizard">
  <div class="psw-track">
    <span class="psw-step"><b class="psw-num">1</b><em class="psw-cap">DETAILS</em></span>
    <span class="psw-step"><b class="psw-num">2</b><em class="psw-cap">PAYMENT</em></span>
    <span class="psw-step"><b class="psw-num">3</b><em class="psw-cap">REVIEW</em></span>
    <span class="psw-step"><b class="psw-num">4</b><em class="psw-cap">DONE</em></span>
  </div>
  <div class="psw-bar"><em class="psw-fill"></em></div>
  <div class="psw-read">
    <span class="psw-label">COMPLETION</span>
    <b class="psw-pct">48%</b>
  </div>
</div>
</body>
</html>
