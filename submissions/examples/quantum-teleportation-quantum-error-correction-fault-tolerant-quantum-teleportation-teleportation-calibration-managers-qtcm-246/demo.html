<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teleportation Calibration Managers QTCM - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css"></head><body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030712; color: #ffffff;">

    <div class="ease-card ease-card-glass qtcm-container">
        <div class="qtcm-header">
            <h2>Teleportation Calibration Manager</h2>
            <span class="ease-badge ease-badge-secondary">Fault-Tolerant Quantum</span>
        </div>
        
        <div class="qtcm-screen ease-center">
            <div class="qtcm-flux flux-qtcm-a"></div>
            <div class="qtcm-flux flux-qtcm-b"></div>
            <div class="qtcm-boundary-ring"></div>
            <div class="qtcm-core ease-center"></div>
        </div>

        <div class="qtcm-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Automated Gate Tuning &amp; Phase Drift Compensation</span>
            <button class="ease-btn ease-btn-secondary ease-btn-sm ease-hover-grow">Run Calibration Manager</button>
        </div>
    </div></body></html>
