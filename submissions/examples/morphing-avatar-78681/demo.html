<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Morphing avatar showcase for EaseMotion CSS issue #78681." />
    <title>Morphing Avatar</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="page">
      <article class="profile" aria-labelledby="title">
        <p class="eyebrow">EaseMotion CSS · Issue #78681</p>

        <div class="avatar" tabindex="0" role="img" aria-label="Profile avatar with initials EM">EM</div>

        <h1 id="title">Morphing Avatar</h1>
        <p class="description">
          Hover or focus the avatar to see a smooth transition from a rounded
          square into a circle.
        </p>

        <div class="profile-meta" aria-label="Profile details">
          <span>CSS motion</span>
          <span>Responsive</span>
        </div>

        <a class="profile-link" href="#profile">View profile</a>
      </article>
    </main>
  </body>
</html>
