<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Burndown Chart</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

<div class="container">

  <h1> Sprint Burndown Chart </h1>

  <div class="chart" role="img" aria-label="Sprint burndown chart showing ideal and actual progress">

    <div class="y-axis">
      <span>100</span>
      <span>75</span>
      <span>50</span>
      <span>25</span>
      <span>0</span>
    </div>


    <div class="graph">

      <div class="ideal-line"></div>

      <div class="actual-line"></div>


      <div class="point p1"></div>
      <div class="point p2"></div>
      <div class="point p3"></div>
      <div class="point p4"></div>
      <div class="point p5"></div>


    </div>

  </div>


  <div class="legend">

    <div>
      <span class="ideal"></span>
      Ideal Progress
    </div>

    <div>
      <span class="actual"></span>
      Actual Progress
    </div>

  </div>


</div>

</body>
</html>
