<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wave Text Animation | GSSoC '26</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="background-glow"></div>

  <main class="container">
    <header class="hero">
      <span class="badge">CSS Motion Component</span>
      
      <!-- Primary Animated Heading -->
      <h1 class="wave-text" aria-label="Wave Text Animation">
        <span style="--i:1">W</span>
        <span style="--i:2">a</span>
        <span style="--i:3">v</span>
        <span style="--i:4">e</span>
        <span style="--i:5" class="space">&nbsp;</span>
        <span style="--i:6">T</span>
        <span style="--i:7">e</span>
        <span style="--i:8">x</span>
        <span style="--i:9">t</span>
        <span style="--i:10" class="space">&nbsp;</span>
        <span style="--i:11">E</span>
        <span style="--i:12">f</span>
        <span style="--i:13">f</span>
        <span style="--i:14">e</span>
        <span style="--i:15">c</span>
        <span style="--i:16">t</span>
      </h1>

      <p class="subtitle">
        A lightweight, pure CSS text animation leveraging custom properties for smooth sine wave propagation.
      </p>
    </header>

    <section class="card">
      <div class="card-header">
        <h2>Interactive Preview</h2>
        <p>Hover over or tap the characters to accelerate the wave sequence!</p>
      </div>

      <!-- Secondary Interactive Demo -->
      <div class="wave-text wave-interactive" aria-label="Smooth Motion Wave">
        <span style="--i:1">S</span>
        <span style="--i:2">m</span>
        <span style="--i:3">o</span>
        <span style="--i:4">o</span>
        <span style="--i:5">t</span>
        <span style="--i:6">h</span>
        <span style="--i:7" class="space">&nbsp;</span>
        <span style="--i:8">M</span>
        <span style="--i:9">o</span>
        <span style="--i:10">t</span>
        <span style="--i:11">i</span>
        <span style="--i:12">o</span>
        <span style="--i:13">n</span>
      </div>
    </section>
  </main>
</body>
</html>
