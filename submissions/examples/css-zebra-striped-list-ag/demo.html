<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Zebra Striped List</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <!-- Using semantic ul/li structure, with anchor tags for interactivity -->
  <ul class="zebra-list" aria-label="Team Members">
    
    <li>
      <a href="#" class="zebra-item">
        <div class="item-avatar">AD</div>
        <div class="item-content">
          <span class="item-title">Alex Developer</span>
          <span class="item-subtitle">Frontend Engineer</span>
        </div>
        <div class="item-action" aria-hidden="true">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" width="20" height="20"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
        </div>
      </a>
    </li>

    <li>
      <a href="#" class="zebra-item">
        <div class="item-avatar" style="background-color: #ec4899;">SJ</div>
        <div class="item-content">
          <span class="item-title">Sarah Jones</span>
          <span class="item-subtitle">Product Designer</span>
        </div>
        <div class="item-action" aria-hidden="true">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" width="20" height="20"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
        </div>
      </a>
    </li>

    <li>
      <a href="#" class="zebra-item">
        <div class="item-avatar" style="background-color: #10b981;">MK</div>
        <div class="item-content">
          <span class="item-title">Michael King</span>
          <span class="item-subtitle">Backend Developer</span>
        </div>
        <div class="item-action" aria-hidden="true">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" width="20" height="20"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
        </div>
      </a>
    </li>

    <li>
      <a href="#" class="zebra-item">
        <div class="item-avatar" style="background-color: #f59e0b;">EL</div>

          <span class="item-title">Emma Lewis</span>

        </div>
      </a>
    </li>

  </ul>

</body>
</html>
