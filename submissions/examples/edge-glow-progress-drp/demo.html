<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Edge Glow Progress</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="shell" aria-labelledby="title">
    <section class="card">
      <p class="eyebrow">progress</p>
      <h1 id="title">Edge Glow Progress</h1>
      <p class="summary">A CSS-only progress track with a bright edge glow and a layered fill sweep.</p>
      <div class="stage" role="img" aria-label="Animated Edge Glow Progress">
        <div class="track">
          <div class="fill"></div>
          <div class="spark"></div>
        </div>
        <article class="tile"><strong>01</strong><span>Glowing fill edge</span></article>
        <article class="tile"><strong>02</strong><span>Layered sweep motion</span></article>
        <article class="tile"><strong>03</strong><span>Compact meter layout</span></article>
        <article class="tile"><strong>04</strong><span>Reduced-motion friendly</span></article>
      </div>
      <div class="tags" aria-label="Edge Glow Progress features">
        <span>Glowing fill edge</span>
        <span>Layered sweep motion</span>
        <span>Compact meter layout</span>
        <span>Reduced-motion friendly</span>
      </div>
    </section>
  </main>
</body>
</html>
