<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Scale-Hover Drawer for SaaS Showcase</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts for modern typography -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="showcase-container">
        <header class="showcase-header">
            <h1>Scale-Hover Drawer</h1>
            <p>Interactive drawer effect for SaaS layouts using pure CSS</p>
        </header>

        <div class="saas-dashboard">
            <div class="dashboard-sidebar">
                <nav class="drawer-nav">
                    <!-- Drawer items -->
                    <a href="#" class="drawer-item" tabindex="0" aria-label="Dashboard">
                        <div class="item-icon">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                        </div>
                        <span class="item-text">Dashboard</span>
                    </a>
                    
                    <a href="#" class="drawer-item" tabindex="0" aria-label="Analytics">
                        <div class="item-icon">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.21 15.89A10 10 0 1 1 8 2.83"></path><path d="M22 12A10 10 0 0 0 12 2v10z"></path></svg>
                        </div>
                        <span class="item-text">Analytics</span>
                    </a>

                    <a href="#" class="drawer-item" tabindex="0" aria-label="Projects">
                        <div class="item-icon">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
                        </div>
                        <span class="item-text">Projects</span>
                    </a>

                    <a href="#" class="drawer-item" tabindex="0" aria-label="Settings">
                        <div class="item-icon">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                        </div>
                        <span class="item-text">Settings</span>
                    </a>
                </nav>
            </div>
            
            <main class="dashboard-content">
                <div class="content-header">
                    <h2>Overview</h2>
                </div>
                <div class="content-grid">
                    <div class="content-card">
                        <div class="card-inner">
                            <h3>Revenue</h3>
                            <p class="stat">$12,450</p>
                            <span class="trend positive">+14.5%</span>
                        </div>
                    </div>
                    <div class="content-card">
                        <div class="card-inner">
                            <h3>Active Users</h3>
                            <p class="stat">1,204</p>
                            <span class="trend positive">+2.1%</span>
                        </div>
                    </div>
                    <div class="content-card full-width">
                        <div class="card-inner">
                            <h3>Recent Activity</h3>
                            <div class="activity-list">
                                <div class="activity-item">User signed up</div>
                                <div class="activity-item">Subscription upgraded</div>
                                <div class="activity-item">New project created</div>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>
</body>
</html>
