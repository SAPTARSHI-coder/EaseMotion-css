<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nebula Ripple</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">

    <section class="nebula-card">

      <div class="nebula-header">
        <div>
          <span class="eyebrow">✦ COSMIC INTERACTION</span>
          <h1>Nebula Ripple</h1>
          <p>
            Touch the cosmic surface and create ripples through the stars.
          </p>
        </div>

        <div class="counter">
          <span>RIPPLES</span>
          <strong id="rippleCount">0</strong>
        </div>
      </div>

      <div class="nebula-display" id="nebulaDisplay">
        <canvas id="nebulaCanvas"></canvas>

        <div class="center-glow"></div>

        <div class="hint" id="hint">
          Click anywhere to disturb the nebula
        </div>
      </div>

      <div class="controls">

        <div class="control">
          <div class="control-top">
            <label for="intensity">Ripple Intensity</label>
            <span id="intensityValue">70%</span>
          </div>

          <input
            id="intensity"
            type="range"
            min="0"
            max="100"
            value="70"
          >
        </div>

        <div class="control">
          <div class="control-top">
            <label for="speed">Ripple Speed</label>
            <span id="speedValue">60%</span>
          </div>

          <input
            id="speed"
            type="range"
            min="0"
            max="100"
            value="60"
          >
        </div>

        <button class="reset-btn" id="resetBtn">
          ↻ Reset
        </button>

      </div>

      <div class="status" id="status">
        <span class="status-dot"></span>
        <span>Cosmic surface is stable</span>
      </div>

    </section>

  </main>

  <script>
    const display = document.getElementById("nebulaDisplay");
    const canvas = document.getElementById("nebulaCanvas");
    const ctx = canvas.getContext("2d");

    const rippleCount = document.getElementById("rippleCount");
    const intensity = document.getElementById("intensity");
    const speed = document.getElementById("speed");

    const intensityValue = document.getElementById("intensityValue");
    const speedValue = document.getElementById("speedValue");

    const resetBtn = document.getElementById("resetBtn");
    const status = document.getElementById("status");

    let width = 0;
    let height = 0;

    let stars = [];
    let ripples = [];
    let frame = 0;
    let totalRipples = 0;

    function resizeCanvas() {
      const rect = display.getBoundingClientRect();

      width = rect.width;
      height = rect.height;

      const dpr = window.devicePixelRatio || 1;

      canvas.width = width * dpr;
      canvas.height = height * dpr;

      canvas.style.width = width + "px";
      canvas.style.height = height + "px";

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      createStars();
    }

    function createStars() {
      stars = [];

      const count = 60;

      for (let i = 0; i < count; i++) {
        stars.push({
          x: Math.random() * width,
          y: Math.random() * height,
          size: Math.random() * 1.8 + 0.4,
          alpha: Math.random() * 0.7 + 0.2,
          phase: Math.random() * Math.PI * 2,
          orbit: Math.random() * 0.3 + 0.1,
          baseX: Math.random() * width,
          baseY: Math.random() * height,
          velocityX: 0,
          velocityY: 0
        });
      }
    }

    function createRipple(x, y) {
      ripples.push({
        x,
        y,
        radius: 0,
        opacity: 1,
        phase: 0,
        maxRadius: 100 + Number(intensity.value) * 2.2
      });

      totalRipples++;
      rippleCount.textContent = totalRipples;

      status.innerHTML =
        '<span class="status-dot active"></span>' +
        '<span>Nebula disturbance detected</span>';

      setTimeout(() => {
        if (ripples.length === 0) {
          status.innerHTML =
            '<span class="status-dot"></span>' +
            '<span>Cosmic surface is stable</span>';
        }
      }, 500);
    }

    function updateStars() {
      const speedFactor = 0.0015;

      for (const star of stars) {

        star.phase += star.orbit * speedFactor;

        star.x += Math.sin(star.phase) * 0.08;
        star.y += Math.cos(star.phase) * 0.05;

        for (const ripple of ripples) {

          const dx = star.x - ripple.x;
          const dy = star.y - ripple.y;

          const distance = Math.sqrt(dx * dx + dy * dy);
          const difference = Math.abs(distance - ripple.radius);

          if (difference < 28) {

            const force =
              (1 - difference / 28) *
              0.8 *
              (Number(intensity.value) / 100);

            if (distance > 0) {
              star.velocityX += (dx / distance) * force;
              star.velocityY += (dy / distance) * force;
            }
          }
        }

        star.x += star.velocityX;
        star.y += star.velocityY;

        star.velocityX *= 0.94;
        star.velocityY *= 0.94;

        if (star.x < -10) star.x = width + 10;
        if (star.x > width + 10) star.x = -10;

        if (star.y < -10) star.y = height + 10;
        if (star.y > height + 10) star.y = -10;
      }
    }

    function drawBackground() {

      const gradient = ctx.createRadialGradient(
        width * 0.5,
        height * 0.45,
        10,
        width * 0.5,
        height * 0.5,
        Math.max(width, height)
      );

      gradient.addColorStop(0, "#17245f");
      gradient.addColorStop(0.45, "#0b1235");
      gradient.addColorStop(1, "#030513");

      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, width, height);

      const nebula = ctx.createRadialGradient(
        width * 0.25,
        height * 0.3,
        0,
        width * 0.25,
        height * 0.3,
        width * 0.7
      );

      nebula.addColorStop(0, "rgba(125, 90, 255, 0.24)");
      nebula.addColorStop(0.45, "rgba(35, 160, 255, 0.08)");
      nebula.addColorStop(1, "rgba(0,0,0,0)");

      ctx.fillStyle = nebula;
      ctx.fillRect(0, 0, width, height);
    }

    function drawStars() {

      for (const star of stars) {

        const pulse =
          0.75 +
          Math.sin(frame * 0.025 + star.phase) * 0.25;

        ctx.beginPath();

        ctx.arc(
          star.x,
          star.y,
          star.size,
          0,
          Math.PI * 2
        );

        ctx.fillStyle =
          `rgba(220,235,255,${star.alpha * pulse})`;

        ctx.fill();
      }
    }

    function drawOrbits() {

      const cx = width / 2;
      const cy = height / 2;

      for (let i = 0; i < 3; i++) {

        const radius = 55 + i * 45;

        ctx.beginPath();

        ctx.ellipse(
          cx,
          cy,
          radius,
          radius * 0.38,
          i * 0.5,
          0,
          Math.PI * 2
        );

        ctx.strokeStyle = "rgba(150,180,255,0.08)";
        ctx.lineWidth = 1;

        ctx.stroke();
      }

      for (let i = 0; i < 9; i++) {

        const angle =
          frame * (0.002 + i * 0.00015) +
          i * Math.PI * 2 / 9;

        const radius = 70 + (i % 3) * 45;

        const x =
          cx +
          Math.cos(angle) * radius;

        const y =
          cy +
          Math.sin(angle) * radius * 0.38;

        ctx.beginPath();

        ctx.arc(x, y, 2, 0, Math.PI * 2);

        ctx.fillStyle = "rgba(180,215,255,0.8)";
        ctx.fill();
      }
    }

    function drawRipples() {

      const rippleSpeed =
        0.7 +
        Number(speed.value) / 100 * 2;

      for (let i = ripples.length - 1; i >= 0; i--) {

        const ripple = ripples[i];

        ripple.radius += rippleSpeed;
        ripple.phase += 0.05;

        ripple.opacity =
          Math.max(
            0,
            1 - ripple.radius / ripple.maxRadius
          );

        if (ripple.opacity <= 0) {
          ripples.splice(i, 1);
          continue;
        }

        const gradient = ctx.createRadialGradient(
          ripple.x,
          ripple.y,
          Math.max(0, ripple.radius - 20),
          ripple.x,
          ripple.y,
          ripple.radius + 20
        );

        gradient.addColorStop(
          0,
          "rgba(130,190,255,0)"
        );

        gradient.addColorStop(
          0.5,
          `rgba(110,210,255,${ripple.opacity * 0.35})`
        );

        gradient.addColorStop(
          0.8,
          `rgba(170,120,255,${ripple.opacity * 0.8})`
        );

        gradient.addColorStop(
          1,
          "rgba(130,190,255,0)"
        );

        ctx.beginPath();

        ctx.arc(
          ripple.x,
          ripple.y,
          ripple.radius,
          0,
          Math.PI * 2
        );

        ctx.strokeStyle = gradient;
        ctx.lineWidth = 7;

        ctx.shadowBlur = 20;
        ctx.shadowColor = "rgba(120,180,255,0.8)";

        ctx.stroke();

        ctx.shadowBlur = 0;

        ctx.beginPath();

        ctx.arc(
          ripple.x,
          ripple.y,
          ripple.radius * 0.94,
          0,
          Math.PI * 2
        );

        ctx.strokeStyle =
          `rgba(220,240,255,${ripple.opacity * 0.35})`;

        ctx.lineWidth = 1;

        ctx.stroke();
      }
    }

    function animate() {

      frame++;

      ctx.clearRect(0, 0, width, height);

      drawBackground();

      updateStars();

      drawStars();
      drawOrbits();
      drawRipples();

      requestAnimationFrame(animate);
    }

    display.addEventListener("pointerdown", (event) => {

      const rect = display.getBoundingClientRect();

      const x = event.clientX - rect.left;
      const y = event.clientY - rect.top;

      createRipple(x, y);

      const hint = document.getElementById("hint");

      hint.style.opacity = "0";

    });

    document.addEventListener("keydown", (event) => {

      if (event.code === "Space") {

        event.preventDefault();

        createRipple(
          width / 2,
          height / 2
        );
      }

      if (event.key.toLowerCase() === "r") {
        reset();
      }
    });

    intensity.addEventListener("input", () => {
      intensityValue.textContent =
        intensity.value + "%";
    });

    speed.addEventListener("input", () => {
      speedValue.textContent =
        speed.value + "%";
    });

    function reset() {

      ripples = [];
      totalRipples = 0;

      rippleCount.textContent = "0";

      status.innerHTML =
        '<span class="status-dot"></span>' +
        '<span>Cosmic surface is stable</span>';

      document.getElementById("hint").style.opacity = "1";
    }

    resetBtn.addEventListener("click", reset);

    window.addEventListener("resize", resizeCanvas);

    resizeCanvas();
    animate();
  </script>

</body>
</html>
