<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        Rotate-Fade Tooltip | EaseMotion CSS
    </title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<main class="container">


    <section class="hero">

        <span class="badge">
            EaseMotion CSS
        </span>


        <h1>
            Rotate-Fade Tooltip
        </h1>


        <p>
            A lightweight CSS-only tooltip
            featuring rotate entrance,
            fade animation and accessible
            responsive layouts.
        </p>

    </section>





    <section class="tooltip-grid">



        <div class="tooltip-card">


            <button class="tooltip-trigger"
                    aria-describedby="tooltip-one">

                🎨 Design

            </button>


            <div class="tooltip"
                 id="tooltip-one"
                 role="tooltip">

                Create beautiful interfaces
                with modern design patterns.

            </div>


        </div>





        <div class="tooltip-card">


            <button class="tooltip-trigger"
                    aria-describedby="tooltip-two">

                💻 Development

            </button>


            <div class="tooltip"
                 id="tooltip-two"
                 role="tooltip">

                Build responsive and scalable
                web experiences.

            </div>


        </div>





        <div class="tooltip-card">


            <button class="tooltip-trigger"
                    aria-describedby="tooltip-three">

                🚀 Launch

            </button>


            <div class="tooltip"
                 id="tooltip-three"
                 role="tooltip">

                Deliver polished products
                to users worldwide.

            </div>


        </div>



    </section>


</main>


</body>

</html>
