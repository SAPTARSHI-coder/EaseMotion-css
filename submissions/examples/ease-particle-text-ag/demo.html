<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ease-particle-text</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="showcase">
    <h1 class="showcase-title">ease-particle-text</h1>
    <p class="showcase-subtitle">Particle-inspired text effect using a repeating radial-gradient pattern and animated background movement</p>

    <section class="demo-grid">

      <div class="demo-block">
        <h2 class="demo-label">Default</h2>
        <div class="demo-stage">
          <h1 class="particle-text">EASEMOTION</h1>
        </div>
      </div>

      <div class="demo-block">
        <h2 class="demo-label">Large Heading</h2>
        <div class="demo-stage">
          <h1 class="particle-text particle-text-lg">HELLO</h1>
        </div>
      </div>

      <div class="demo-block">
        <h2 class="demo-label">Cool Palette</h2>
        <div class="demo-stage">
          <h1 class="particle-text particle-text-cool">FROSTED</h1>
        </div>
      </div>

      <div class="demo-block">
        <h2 class="demo-label">On Dark Background</h2>
        <div class="demo-stage demo-stage-dark">
          <h1 class="particle-text">GLOWING</h1>
        </div>
      </div>

    </section>
  </main>

</body>
</html>
