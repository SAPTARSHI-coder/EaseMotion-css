<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.25">
<title>Vinyl Record Player</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="turntable">
  <header class="tt-head">
    <h1 class="tt-model">STEREO DECK</h1>
    <p class="tt-track">TRACK 3</p>
  </header>
  <section class="tt-top" aria-label="Turntable platter and tonearm">
    <div class="tt-platter">
      <div class="record-vinyl">
        <span class="record-label">33</span>
      </div>
    </div>
    <div class="tt-tonearm">
      <span class="arm-base"></span>
      <span class="arm-shoulder"></span>
      <span class="arm-wand"></span>
      <span class="arm-head"></span>
      <span class="arm-needle"></span>
    </div>
    <span class="tt-spindle"></span>
  </section>
  <section class="tt-console" aria-label="Turntable controls">
    <span class="tt-knob knob-power"></span>
    <span class="tt-knob knob-volume"></span>
    <span class="tt-light"></span>
    <div class="tt-speaker"><span class="speaker-cone"></span></div>
  </section>
  <footer class="tt-foot">
    <span class="tt-rpm">33RPM</span>
    <span class="tt-cue">CUE</span>
  </footer>
</main>
</body>
</html>
