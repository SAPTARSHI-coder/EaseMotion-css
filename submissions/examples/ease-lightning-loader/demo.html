<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lightning Loader · Crackling Bolts</title>

    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <div class="card">
        <h2>⚡ Lightning Loader</h2>
        <p class="sub">bolts of lightning crackle</p>

        <!-- === LIGHTNING LOADER === -->
        <div class="lightning-container" id="lightningContainer">
            <div class="lightning-loader">
                <!-- Lightning bolts -->
                <svg class="lightning-svg" viewBox="0 0 200 200">
                    <polyline points="100,10 85,80 105,80 75,160 115,100 95,100 120,30" class="bolt bolt-1" />
                    <polyline points="150,20 140,70 155,70 135,130 160,90 145,90 160,40" class="bolt bolt-2" />
                    <polyline points="50,20 60,70 45,70 65,130 40,90 55,90 40,40" class="bolt bolt-3" />
                    <polyline points="120,5 110,50 125,50 105,100 130,70 115,70 135,25" class="bolt bolt-4" />
                    <polyline points="80,5 90,50 75,50 95,100 70,70 85,70 65,25" class="bolt bolt-5" />
                </svg>

                <!-- Glow effects -->
                <div class="lightning-glow glow-1"></div>
                <div class="lightning-glow glow-2"></div>

                <!-- Spark particles -->
                <div class="spark s1"></div>
                <div class="spark s2"></div>
                <div class="spark s3"></div>
                <div class="spark s4"></div>
                <div class="spark s5"></div>
                <div class="spark s6"></div>
                <div class="spark s7"></div>
                <div class="spark s8"></div>
                <div class="spark s9"></div>
                <div class="spark s10"></div>
                <div class="spark s11"></div>
                <div class="spark s12"></div>

                <!-- Label -->
                <div class="lightning-label">⚡</div>
            </div>
        </div>

        <p style="margin-top: 2rem; font-size: 0.85rem; color: #64748b;">
            Crackling lightning · electric loading animation
        </p>
    </div>

    <!-- Embedded JavaScript -->
    <script>
        (function() {
            'use strict';

            const container = document.getElementById('lightningContainer');
            const bolts = document.querySelectorAll('.bolt');
            const sparks = document.querySelectorAll('.spark');
            const glows = document.querySelectorAll('.lightning-glow');

            // Random flash effect
            function randomFlash() {
                // Randomly intensify a bolt
                const bolt = bolts[Math.floor(Math.random() * bolts.length)];
                bolt.style.opacity = '1';
                bolt.style.filter = 'brightness(2) drop-shadow(0 0 20px rgba(255, 200, 50, 0.5))';
                setTimeout(() => {
                    bolt.style.opacity = '0.7';
                    bolt.style.filter = 'none';
                }, 150);

                // Random spark
                const spark = sparks[Math.floor(Math.random() * sparks.length)];
                spark.style.opacity = '1';
                spark.style.transform = 'scale(2)';
                setTimeout(() => {
                    spark.style.opacity = '0';
                    spark.style.transform = 'scale(0)';
                }, 300);

                // Random glow flash
                const glow = glows[Math.floor(Math.random() * glows.length)];
                glow.style.opacity = '0.8';
                setTimeout(() => {
                    glow.style.opacity = '0';
                }, 200);
            }

            // Flash interval
            let flashInterval = setInterval(randomFlash, 300 + Math.random() * 400);

            // Click to restart
            container.addEventListener('click', function() {
                clearInterval(flashInterval);

                const loader = this.querySelector('.lightning-loader');
                const bolts = this.querySelectorAll('.bolt');
                const sparks = this.querySelectorAll('.spark');
                const glows = this.querySelectorAll('.lightning-glow');

                loader.style.animation = 'none';
                void loader.offsetWidth;
                loader.style.animation = '';

                bolts.forEach(b => {
                    b.style.animation = 'none';
                    void b.offsetWidth;
                    b.style.animation = '';
                    b.style.opacity = '0.7';
                    b.style.filter = 'none';
                });

                sparks.forEach(s => {
                    s.style.animation = 'none';
                    void s.offsetWidth;
                    s.style.animation = '';
                    s.style.opacity = '0';
                    s.style.transform = 'scale(0)';
                });

                glows.forEach(g => {
                    g.style.animation = 'none';
                    void g.offsetWidth;
                    g.style.animation = '';
                    g.style.opacity = '0';
                });

                this.classList.add('click-pulse');
                setTimeout(() => {
                    this.classList.remove('click-pulse');
                }, 300);

                flashInterval = setInterval(randomFlash, 300 + Math.random() * 400);

                console.log('⚡ Lightning loader restarted!');
            });

            // Keyboard accessibility
            container.setAttribute('tabindex', '0');
            container.setAttribute('role', 'button');
            container.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    this.click();
                }
            });

            console.log('⚡ Lightning loader initialized!');

        })();
    </script>

</body>
</html>
