<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ease-loading-bar-segmented-sap demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { height: 100vh; margin: 0; display: flex; align-items: center; justify-content: center; background: #f4f4f5; }
  </style>
</head>
<body>
  <div class="segment-bar-sap" id="bar">
    <div class="segment"><span></span></div>
    <div class="segment"><span></span></div>
    <div class="segment"><span></span></div>
    <div class="segment"><span></span></div>
  </div>
  <script>
    const segments = [...document.querySelectorAll('.segment span')];
    let i = 0;
    function fill() {
      if (i >= segments.length) return;
      segments[i].style.width = '100%';
      i++;
      setTimeout(fill, 600);
    }
    fill();
  </script>
</body>
</html>
