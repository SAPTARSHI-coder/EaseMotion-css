<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Glowing File Dropzone — EaseMotion CSS</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="demo">
      <h1>Glowing File Dropzone</h1>
      <p>
        A dark-mode file picker surface with a glowing focus and hover state.
      </p>

      <label class="dropzone" for="file-input">
        <input id="file-input" type="file" />
        <span class="dropzone-content">
          <span class="dropzone-icon" aria-hidden="true">↑</span>
          <strong>Choose a file</strong>
          <span>Click here to browse your device</span>
        </span>
      </label>
    </main>
  </body>
</html>
