<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Button with Minimalist Styling - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="em-demo-container">
        <!-- Pure CSS Dynamic Minimalist Button Component Showcase -->
        <header class="em-button-card" role="region" aria-label="Minimalist Dynamic Button Showcase" tabindex="0">
            <div class="em-card-header-bar">
                <span class="em-card-badge">COMPONENT FEATURE</span>
                <span class="em-brand-logo">MinimalMotion</span>
            </div>
            <h1 class="em-card-title">Dynamic Minimalist Button</h1>
            <p class="em-card-desc">A fully responsive, hardware-accelerated pure CSS button featuring clean minimalist styling, subtle lift physics, and frosted glassmorphism.</p>
            <div class="em-button-wrapper">
                <button class="ease-dynamic-minimal-btn" aria-label="Interactive Minimalist Button" tabindex="0">
                    <span class="em-btn-label">Explore Component</span>
                </button>
            </div>
        </header>
    </div>
</body>
</html>
