<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photonic Cluster States Fusion Gates - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css"></head><body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030712; color: #ffffff;">

    <div class="ease-card ease-card-glass photonic-container">
        <div class="photonic-header">
            <h2>Photonic Cluster States</h2>
            <span class="ease-badge ease-badge-secondary">Optical QC</span>
        </div>
        
        <div class="photonic-screen ease-center">
            <div class="photonic-flux flux-photonic-a"></div>
            <div class="photonic-flux flux-photonic-b"></div>
            <div class="photonic-boundary-ring"></div>
            <div class="photonic-core ease-center"></div>
        </div>

        <div class="photonic-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Linear Optics &amp; Type-II Fusion Gates</span>
            <button class="ease-btn ease-btn-secondary ease-btn-sm ease-hover-grow">Run Fusion Gate</button>
        </div>
    </div></body></html>
