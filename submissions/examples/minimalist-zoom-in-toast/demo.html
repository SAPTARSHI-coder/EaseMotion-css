<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Zoom-In Toast - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="mt-layout">
        <main class="mt-main">
            <h1 class="mt-title">NOTIFICATION SYSTEM</h1>
            <p class="mt-desc">Trigger the floating toast notification to test the zoom-in entrance transition.</p>
            
            <div class="mt-toast-wrapper">
                <input type="checkbox" id="mt-toast-toggle" class="mt-hidden-toggle" checked>
                
                <div class="mt-toast">
                    <div class="mt-toast-icon">✓</div>
                    <div class="mt-toast-content">
                        <h4 class="mt-toast-title">DEPLOYMENT SUCCESS</h4>
                        <p class="mt-toast-text">Bundle compiled and pushed to CDN edge nodes.</p>
                    </div>
                    <label for="mt-toast-toggle" class="mt-toast-close" tabindex="0">×</label>
                </div>

                <label for="mt-toast-toggle" class="mt-btn" tabindex="0">
                    TRIGGER TOAST
                </label>
            </div>
        </main>
    </div>
</body>
</html>
