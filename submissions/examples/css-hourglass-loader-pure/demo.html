<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Hourglass Loader</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="layout-container">
        
        <header class="section-header">
            <h1 class="title">Hourglass Loader</h1>
            <p class="subtitle">A classic, pure CSS hourglass animation complete with dropping sand particles, synchronized emptying/filling chambers, and a 180-degree flip mechanism.</p>
        </header>

        <div class="demo-area">
            
            <!-- 
              [TECHNIQUE] Hourglass Architecture
              The hourglass is built using a container that rotates periodically.
              Inside are two chambers (top and bottom) that use CSS polygon clipping or borders
              to form the glass shape. The sand is simulated with absolute positioned divs whose
              height and transform properties are animated in sync.
            -->
            <div class="hourglass" role="progressbar" aria-label="Loading" aria-busy="true">
                <!-- Top Chamber (empties) -->
                <div class="chamber top">
                    <div class="sand top-sand"></div>
                </div>
                <!-- Middle neck (where sand drops) -->
                <div class="neck">
                    <div class="sand-stream"></div>
                </div>
                <!-- Bottom Chamber (fills) -->
                <div class="chamber bottom">
                    <div class="sand bottom-sand"></div>
                </div>
            </div>
            
        </div>
        
    </div>

</body>
</html>
