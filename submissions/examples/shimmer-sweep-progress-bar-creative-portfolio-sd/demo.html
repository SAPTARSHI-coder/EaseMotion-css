<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shimmer Sweep Progress Bar</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        margin: 0;
        background: #f8fafc;
        font-family: system-ui, sans-serif;
      }
      .demo {
        width: min(500px, 90%);
        text-align: center;
      }
      .demo h1 {
        font-size: 1.25rem;
        font-weight: 600;
        color: #1f2937;
        margin: 0 0 0.5rem;
      }
      .demo p {
        font-size: 0.875rem;
        color: #64748b;
        margin: 0 0 1.5rem;
      }
    </style>
  </head>
  <body>
    <div class="demo">
      <h1>Shimmer Sweep Progress Bar</h1>
      <p>Pure CSS progress bar with a smooth shimmer sweep animation</p>
      <div
        class="shimmer-sweep-progress-bar"
        role="progressbar"
        aria-valuenow="70"
        aria-valuemin="0"
        aria-valuemax="100"
        style="--progress-width: 70%"
      ></div>
    </div>
  </body>
</html>
