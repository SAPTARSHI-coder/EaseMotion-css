<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Glass Morph – Glass Morphs Between Opaque and Clear</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <h1>🪟 Glass Morph</h1>
    <p class="subtitle">Glass morphs between opaque and clear</p>

    <div class="glass-container">
      <div class="glass-stage" id="glassStage">
        <!-- Background content -->
        <div class="bg-content">
          <div class="bg-pattern">
            <div class="bg-grid"></div>
            <div class="bg-shapes">
              <div class="shape shape-1"></div>
              <div class="shape shape-2"></div>
              <div class="shape shape-3"></div>
            </div>
            <div class="bg-text">
              <span class="text-large">GLASS</span>
              <span class="text-small">morph between opaque & clear</span>
            </div>
          </div>
        </div>

        <!-- Glass overlay -->
        <div class="glass-overlay" id="glassOverlay">
          <div class="glass-surface" id="glassSurface"></div>
          <div class="glass-reflection" id="glassReflection"></div>
          <div class="glass-distortion" id="glassDistortion"></div>
          <div class="glass-shine" id="glassShine"></div>
          <div class="glass-label" id="glassLabel">
            <span class="label-icon">🪟</span>
            <span class="label-text" id="labelText">Opaque</span>
          </div>
        </div>

        <!-- Info overlay -->
        <div class="info-overlay">
          <span class="glass-status" id="glassStatus">🪟 Opaque</span>
          <span class="glass-clarity" id="glassClarity">Clarity: 0%</span>
        </div>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <button class="ctrl-btn clear" id="clearBtn">🔍 Clear</button>
      <button class="ctrl-btn opaque" id="opaqueBtn">🪟 Opaque</button>
      <button class="ctrl-btn toggle" id="toggleBtn">🔄 Toggle</button>
      <button class="ctrl-btn reset" id="resetBtn">↺ Reset</button>
    </div>

    <!-- Sliders -->
    <div class="slider-container">
      <span class="slider-label">Clarity</span>
      <input type="range" id="claritySlider" min="0" max="100" value="0" />
      <span class="slider-value" id="clarityValue">0%</span>
    </div>

    <div class="slider-container">
      <span class="slider-label">Blur Intensity</span>
      <input type="range" id="blurSlider" min="0" max="100" value="50" />
      <span class="slider-value" id="blurValue">50%</span>
    </div>

    <div class="slider-container">
      <span class="slider-label">Glass Tint</span>
      <input type="range" id="tintSlider" min="0" max="100" value="30" />
      <span class="slider-value" id="tintValue">30%</span>
    </div>

    <!-- Status -->
    <div class="status" id="status">🪟 Glass is opaque — click Clear to make it transparent</div>

    <!-- Keyboard shortcuts -->
    <div class="shortcuts">
      <kbd>C</kbd> Clear · <kbd>O</kbd> Opaque · <kbd>T</kbd> Toggle · <kbd>R</kbd> Reset
    </div>
  </div>

  <script>
    (function() {
      "use strict";

      // DOM elements
      const glassOverlay = document.getElementById('glassOverlay');
      const glassSurface = document.getElementById('glassSurface');
      const glassReflection = document.getElementById('glassReflection');
      const glassDistortion = document.getElementById('glassDistortion');
      const glassShine = document.getElementById('glassShine');
      const glassLabel = document.getElementById('glassLabel');
      const labelText = document.getElementById('labelText');
      const glassStatus = document.getElementById('glassStatus');
      const glassClarity = document.getElementById('glassClarity');
      const clearBtn = document.getElementById('clearBtn');
      const opaqueBtn = document.getElementById('opaqueBtn');
      const toggleBtn = document.getElementById('toggleBtn');
      const resetBtn = document.getElementById('resetBtn');
      const status = document.getElementById('status');
      const claritySlider = document.getElementById('claritySlider');
      const clarityValue = document.getElementById('clarityValue');
      const blurSlider = document.getElementById('blurSlider');
      const blurValue = document.getElementById('blurValue');
      const tintSlider = document.getElementById('tintSlider');
      const tintValue = document.getElementById('tintValue');

      // State
      let clarity = 0; // 0 = opaque, 100 = clear
      let targetClarity = 0;
      let isClear = false;
      let animationId = null;
      let time = 0;
      let glassParticles = [];

      // ----- Update glass effect -----
      function updateGlass() {
        const clarityVal = clarity / 100;
        const blurIntensity = parseInt(blurSlider.value) / 100;
        const tintIntensity = parseInt(tintSlider.value) / 100;

        // Update glass surface opacity and blur
        const opacity = 0.2 + 0.6 * (1 - clarityVal);
        const blur = 2 + blurIntensity * 18 * (1 - clarityVal);
        
        glassSurface.style.opacity = opacity;
        glassSurface.style.backdropFilter = `blur(${blur}px)`;
        glassSurface.style.background = `rgba(200, 220, 255, ${0.05 + clarityVal * 0.05})`;

        // Update glass tint
        const tintOpacity = tintIntensity * (1 - clarityVal * 0.8);
        glassSurface.style.background = `rgba(200, 220, 255, ${0.05 + clarityVal * 0.05})`;
        glassOverlay.style.borderColor = `rgba(255, 255, 255, ${0.05 + clarityVal * 0.05})`;

        // Update reflection
        const reflectionOpacity = 0.05 + 0.15 * (1 - clarityVal);
        glassReflection.style.opacity = reflectionOpacity;
        glassReflection.style.transform = `translateY(${clarityVal * 20}px)`;

        // Update distortion (subtle morphing effect)
        const distortionScale = 1 + (1 - clarityVal) * 0.02;
        glassDistortion.style.transform = `scale(${distortionScale}) rotate(${(1 - clarityVal) * 0.5}deg)`;
        glassDistortion.style.opacity = 0.1 + 0.3 * (1 - clarityVal);

        // Update shine
        const shineOpacity = 0.05 + 0.15 * (1 - clarityVal);
        glassShine.style.opacity = shineOpacity;
        glassShine.style.background = `linear-gradient(135deg, 
          rgba(255, 255, 255, ${0.05 + 0.1 * (1 - clarityVal)}) 0%, 
          transparent 40%, 
          transparent 60%, 
          rgba(255, 255, 255, ${0.02 + 0.05 * (1 - clarityVal)}) 100%
        )`;

        // Update label
        const labelOpacity = 0.4 + 0.6 * (1 - clarityVal);
        glassLabel.style.opacity = labelOpacity;
        labelText.textContent = clarityVal < 0.3 ? 'Opaque' : 
                                clarityVal < 0.7 ? 'Morphing' : 'Clear';

        // Update status
        const statusText = clarityVal < 0.2 ? '🪟 Opaque' :
                          clarityVal < 0.5 ? '🪟 Morphing...' :
                          clarityVal < 0.8 ? '🪟 Clearing...' : '🔍 Clear';
        glassStatus.textContent = statusText;
        glassClarity.textContent = `Clarity: ${Math.round(clarity)}%`;
        clarityValue.textContent = Math.round(clarity) + '%';

        // Update cursor
        glassOverlay.style.cursor = 'pointer';

        // Update status message
        if (clarityVal < 0.1) {
          status.textContent = '🪟 Glass is opaque — click Clear to make it transparent';
        } else if (clarityVal < 0.4) {
          status.textContent = '🪟 Glass is morphing... becoming clearer';
        } else if (clarityVal < 0.7) {
          status.textContent = '🪟 Glass is becoming transparent...';
        } else if (clarityVal < 0.95) {
          status.textContent = '🔍 Glass is almost clear!';
        } else {
          status.textContent = '🔍 Glass is completely clear!';
        }
      }

      // ----- Animation loop -----
      function animate() {
        time += 0.016;

        // Smooth interpolation for clarity
        const diff = targetClarity - clarity;
        if (Math.abs(diff) > 0.1) {
          const speed = 3;
          clarity += diff * 0.04 * speed;
        } else {
          clarity = targetClarity;
        }

        // Clamp
        clarity = Math.max(0, Math.min(100, clarity));

        updateGlass();
        animationId = requestAnimationFrame(animate);
      }

      // ----- Start animation -----
      function startAnimation() {
        if (animationId) {
          cancelAnimationFrame(animationId);
        }
        animate();
      }

      // ----- Set clarity -----
      function setClarity(value) {
        targetClarity = Math.max(0, Math.min(100, value));
        claritySlider.value = targetClarity;
        clarityValue.textContent = Math.round(targetClarity) + '%';
        isClear = targetClarity > 80;
      }

      // ----- Clear glass -----
      function clearGlass() {
        setClarity(100);
        status.textContent = '🔍 Glass cleared!';
        setTimeout(() => {
          if (clarity > 80) {
            status.textContent = '🔍 Glass is completely clear!';
          }
        }, 500);
      }

      // ----- Opaque glass -----
      function opaqueGlass() {
        setClarity(0);
        status.textContent = '🪟 Glass is opaque!';
        setTimeout(() => {
          if (clarity < 10) {
            status.textContent = '🪟 Glass is opaque — click Clear to make it transparent';
          }
        }, 500);
      }

      // ----- Toggle -----
      function toggleGlass() {
        if (clarity > 50) {
          opaqueGlass();
        } else {
          clearGlass();
        }
      }

      // ----- Reset -----
      function resetGlass() {
        setClarity(0);
        blurSlider.value = 50;
        blurValue.textContent = '50%';
        tintSlider.value = 30;
        tintValue.textContent = '30%';
        status.textContent = '↺ Reset';
        setTimeout(() => {
          status.textContent = '🪟 Glass is opaque — click Clear to make it transparent';
        }, 500);
      }

      // ----- Event Listeners -----
      // Click to toggle
      glassOverlay.addEventListener('click', toggleGlass);

      // Buttons
      clearBtn.addEventListener('click', clearGlass);
      opaqueBtn.addEventListener('click', opaqueGlass);
      toggleBtn.addEventListener('click', toggleGlass);
      resetBtn.addEventListener('click', resetGlass);

      // Sliders
      claritySlider.addEventListener('input', (e) => {
        const val = parseFloat(e.target.value);
        setClarity(val);
        if (val > 50) {
          status.textContent = `🔍 Clarity: ${Math.round(val)}%`;
        } else {
          status.textContent = `🪟 Clarity: ${Math.round(val)}%`;
        }
      });

      blurSlider.addEventListener('input', (e) => {
        blurValue.textContent = e.target.value + '%';
        updateGlass();
      });

      tintSlider.addEventListener('input', (e) => {
        tintValue.textContent = e.target.value + '%';
        updateGlass();
      });

      // Keyboard shortcuts
      document.addEventListener('keydown', (e) => {
        if (e.key === 'c' || e.key === 'C') {
          e.preventDefault();
          clearGlass();
        }
        if (e.key === 'o' || e.key === 'O') {
          e.preventDefault();
          opaqueGlass();
        }
        if (e.key === 't' || e.key === 'T') {
          e.preventDefault();
          toggleGlass();
        }
        if (e.key === 'r' || e.key === 'R') {
          e.preventDefault();
          resetGlass();
        }
        if (e.key === ' ' || e.key === 'Space') {
          e.preventDefault();
          toggleGlass();
        }
      });

      // ----- Resize handler -----
      let resizeTimeout;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(() => {
          // Just reflow
        }, 200);
      });

      // ----- Init -----
      function init() {
        setClarity(0);
        startAnimation();
        status.textContent = '🪟 Glass is opaque — click Clear to make it transparent';
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }

    })();
  </script>
</body>
</html>
