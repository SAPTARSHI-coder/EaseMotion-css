<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zoom-In Progress Bars</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="dashboard">

    <h1>Project Progress</h1>

    <div class="progress-card">

        <div class="progress-item">
            <div class="progress-header">
                <span>HTML & CSS</span>
                <span>90%</span>
            </div>

            <div class="progress-track">
                <div class="progress-fill html"></div>
            </div>
        </div>

        <div class="progress-item">
            <div class="progress-header">
                <span>JavaScript</span>
                <span>75%</span>
            </div>

            <div class="progress-track">
                <div class="progress-fill js"></div>
            </div>
        </div>

        <div class="progress-item">
            <div class="progress-header">
                <span>React</span>
                <span>60%</span>
            </div>

            <div class="progress-track">
                <div class="progress-fill react"></div>
            </div>
        </div>

        <div class="progress-item">
            <div class="progress-header">
                <span>UI Design</span>
                <span>95%</span>
            </div>

            <div class="progress-track">
                <div class="progress-fill ui"></div>
            </div>
        </div>

    </div>

</div>

</body>
</html>
