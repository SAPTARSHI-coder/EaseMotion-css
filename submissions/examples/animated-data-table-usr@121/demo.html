<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animated Image Gallery - EaseMotion CSS Submission</title>
  
  <!-- EaseMotion CSS (Official CDN) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css">
  
  <!-- Local Gallery Component Styles -->
  <link rel="stylesheet" href="style.css">
  
  <style>
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: var(--ease-color-bg, #f8fafc);
      color: var(--ease-color-text, #0f172a);
      margin: 0;
      padding: 2rem;
      gap: 3rem;
    }
    .demo-container {
      width: 100%;
      max-width: 1200px;
    }
    .demo-section {
      margin-bottom: 4rem;
    }
    .demo-title {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
      color: var(--ease-color-text, #0f172a);
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="ease-center ease-fade-in" style="text-align: center;">
    <h1 class="ease-slide-up">Animated Image Gallery</h1>
    <p class="ease-slide-up ease-delay-100" style="color: var(--ease-color-text-muted, #64748b); max-width: 500px;">
      Zero JavaScript. Pure CSS image gallery with lightbox, zoom effects, and smooth transitions.
    </p>
  </div>

  <!-- Grid Gallery with Lightbox -->
  <div class="demo-container demo-section ease-fade-in ease-delay-200">
    <h2 class="demo-title">Grid Gallery with Lightbox</h2>
    <div class="ease-gallery-xyz">
      <!-- Image 1 -->
      <input type="radio" name="gallery" id="img-1" class="ease-gallery-xyz-trigger">
      <label for="img-1" class="ease-gallery-xyz-item">
        <img src="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=400&h=400&fit=crop" alt="Mountain">
        <div class="ease-gallery-xyz-overlay">
          <span class="ease-gallery-xyz-icon">🔍</span>
          <span class="ease-gallery-xyz-caption">Mountain View</span>
        </div>
      </label>

      <!-- Image 2 -->
      <input type="radio" name="gallery" id="img-2" class="ease-gallery-xyz-trigger">
      <label for="img-2" class="ease-gallery-xyz-item">
        <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=400&h=400&fit=crop" alt="Beach">
        <div class="ease-gallery-xyz-overlay">
          <span class="ease-gallery-xyz-icon">🔍</span>
          <span class="ease-gallery-xyz-caption">Beach Sunset</span>
        </div>
      </label>

      <!-- Image 3 -->
      <input type="radio" name="gallery" id="img-3" class="ease-gallery-xyz-trigger">
      <label for="img-3" class="ease-gallery-xyz-item">
        <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=400&h=400&fit=crop" alt="Forest">
        <div class="ease-gallery-xyz-overlay">
          <span class="ease-gallery-xyz-icon">🔍</span>
          <span class="ease-gallery-xyz-caption">Forest Path</span>
        </div>
      </label>

      <!-- Image 4 -->
      <input type="radio" name="gallery" id="img-4" class="ease-gallery-xyz-trigger">
      <label for="img-4" class="ease-gallery-xyz-item">
        <img src="https://images.unsplash.com/photo-1469474968028-56623f02e42e?w=400&h=400&fit=crop" alt="Valley">
        <div class="ease-gallery-xyz-overlay">
          <span class="ease-gallery-xyz-icon">🔍</span>
          <span class="ease-gallery-xyz-caption">Green Valley</span>
        </div>
      </label>

      <!-- Image 5 -->
      <input type="radio" name="gallery" id="img-5" class="ease-gallery-xyz-trigger">
      <label for="img-5" class="ease-gallery-xyz-item">
        <img src="https://images.unsplash.com/photo-1472214103451-9374bd1c798e?w=400&h=400&fit=crop" alt="Meadow">
        <div class="ease-gallery-xyz-overlay">
          <span class="ease-gallery-xyz-icon">🔍</span>
          <span class="ease-gallery-xyz-caption">Flower Meadow</span>
        </div>
      </label>

      <!-- Image 6 -->
      <input type="radio" name="gallery" id="img-6" class="ease-gallery-xyz-trigger">
      <label for="img-6" class="ease-gallery-xyz-item">
        <img src="https://images.unsplash.com/photo-1493246507139-91e8fad9978e?w=400&h=400&fit=crop" alt="Lake">
        <div class="ease-gallery-xyz-overlay">
          <span class="ease-gallery-xyz-icon">🔍</span>
          <span class="ease-gallery-xyz-caption">Mountain Lake</span>
        </div>
      </label>

      <!-- Lightbox Modal -->
      <div class="ease-gallery-xyz-lightbox">
        <label for="close-lightbox" class="ease-gallery-xyz-close">×</label>
        
        <div class="ease-gallery-xyz-lightbox-content">
          <div class="ease-gallery-xyz-lightbox-image" id="lightbox-1">
            <img src="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=1200&h=800&fit=crop" alt="Mountain">
          </div>
          <div class="ease-gallery-xyz-lightbox-image" id="lightbox-2">
            <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=1200&h=800&fit=crop" alt="Beach">
          </div>
          <div class="ease-gallery-xyz-lightbox-image" id="lightbox-3">
            <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=1200&h=800&fit=crop" alt="Forest">
          </div>
          <div class="ease-gallery-xyz-lightbox-image" id="lightbox-4">
            <img src="https://images.unsplash.com/photo-1469474968028-56623f02e42e?w=1200&h=800&fit=crop" alt="Valley">
          </div>
          <div class="ease-gallery-xyz-lightbox-image" id="lightbox-5">
            <img src="https://images.unsplash.com/photo-1472214103451-9374bd1c798e?w=1200&h=800&fit=crop" alt="Meadow">
          </div>
          <div class="ease-gallery-xyz-lightbox-image" id="lightbox-6">
            <img src="https://images.unsplash.com/photo-1493246507139-91e8fad9978e?w=1200&h=800&fit=crop" alt="Lake">
          </div>
        </div>

        <label for="img-1" class="ease-gallery-xyz-nav ease-gallery-xyz-prev">‹</label>
        <label for="img-2" class="ease-gallery-xyz-nav ease-gallery-xyz-next">›</label>
      </div>

      <input type="radio" name="gallery" id="close-lightbox" class="ease-gallery-xyz-close-trigger">
    </div>
  </div>

  <!-- Masonry Gallery -->
  <div class="demo-container demo-section ease-fade-in ease-delay-300">
    <h2 class="demo-title">Masonry Gallery</h2>
    <div class="ease-gallery-xyz ease-gallery-xyz-masonry">
      <div class="ease-gallery-xyz-item ease-gallery-xyz-tall">
        <img src="https://images.unsplash.com/photo-1519681393784-d120267933ba?w=400&h=600&fit=crop" alt="Stars">
        <div class="ease-gallery-xyz-overlay">
          <span class="ease-gallery-xyz-caption">Starry Night</span>
        </div>
      </div>
      <div class="ease-gallery-xyz-item">
        <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=400&h=400&fit=crop" alt="Landscape">
        <div class="ease-gallery-xyz-overlay">
          <span class="ease-gallery-xyz-caption">Rolling Hills</span>
        </div>
      </div>
      <div class="ease-gallery-xyz-item ease-gallery-xyz-wide">
        <img src="https://images.unsplash.com/photo-1418065460487-3e41a6c84dc5?w=600&h=400&fit=crop" alt="Desert">
        <div class="ease-gallery-xyz-overlay">
          <span class="ease-gallery-xyz-caption">Desert Dunes</span>
        </div>
      </div>
      <div class="ease-gallery-xyz-item">
        <img src="https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?w=400&h=400&fit=crop" alt="Fog">
        <div class="ease-gallery-xyz-overlay">
          <span class="ease-gallery-xyz-caption">Misty Morning</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Horizontal Scroll Gallery -->
  <div class="demo-container demo-section ease-fade-in ease-delay-400">
    <h2 class="demo-title">Horizontal Scroll Gallery</h2>
    <div class="ease-gallery-xyz ease-gallery-xyz-horizontal">
      <div class="ease-gallery-xyz-item">
        <img src="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=300&h=300&fit=crop" alt="1">
      </div>
      <div class="ease-gallery-xyz-item">
        <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=300&h=300&fit=crop" alt="2">
      </div>
      <div class="ease-gallery-xyz-item">
        <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=300&h=300&fit=crop" alt="3">
      </div>
      <div class="ease-gallery-xyz-item">
        <img src="https://images.unsplash.com/photo-1469474968028-56623f02e42e?w=300&h=300&fit=crop" alt="4">
      </div>
      <div class="ease-gallery-xyz-item">
        <img src="https://images.unsplash.com/photo-1472214103451-9374bd1c798e?w=300&h=300&fit=crop" alt="5">
      </div>
    </div>
  </div>

</body>
</html>
