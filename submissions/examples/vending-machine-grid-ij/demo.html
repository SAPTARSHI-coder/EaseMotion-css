<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-vending-machine-grid demo</title>
</head>
<body>
<div class="vm-app">
  <span class="vm-title">SNACK DEPOT</span>
  <div class="vm-body">
    <div class="vm-slot">
      <span class="vm-item vm-chips"></span>
      <span class="vm-price">$1.25</span>
    </div>
    <div class="vm-slot">
      <span class="vm-item vm-candy"></span>
      <span class="vm-price">$1.00</span>
    </div>
    <div class="vm-slot">
      <span class="vm-item vm-cola"></span>
      <span class="vm-price">$1.50</span>
    </div>
    <div class="vm-slot">
      <span class="vm-item vm-gum"></span>
      <span class="vm-price">$0.75</span>
    </div>
  </div>
  <div class="vm-coil">
    <span class="vm-spiral"></span>
  </div>
  <span class="vm-sold">SOLD OUT</span>
  <span class="vm-coins">INSERT 5</span>
</div>
</body>
</html>
