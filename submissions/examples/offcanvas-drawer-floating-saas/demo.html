<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EaseMotion - Floating Offcanvas Drawer (SaaS Modern)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="em-container">
    <header class="em-hero">
      <h1 class="em-title">SaaS Workspace</h1>
      <p class="em-subtitle">Modern, floating offcanvas architecture. Zero JavaScript.</p>
      
      <!-- Pure CSS Toggle State (Hidden) -->
      <input type="checkbox" id="saas-drawer-toggle" class="em-drawer-toggle" aria-hidden="true" />
      
      <!-- Trigger Button -->
      <label for="saas-drawer-toggle" class="em-btn em-btn-primary" role="button" tabindex="0" aria-label="Open sidebar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 8px;">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
        Open Menu
      </label>

      <!-- Click-away Overlay -->
      <label for="saas-drawer-toggle" class="em-drawer-overlay" aria-label="Close menu"></label>

      <!-- Floating Offcanvas Drawer -->
      <aside class="em-drawer" aria-labelledby="drawer-title">
        <div class="em-drawer-header">
          <div class="em-drawer-brand">
            <div class="em-brand-logo"></div>
            <h2 id="drawer-title" class="em-drawer-title">Acme Corp</h2>
          </div>
          <label for="saas-drawer-toggle" class="em-drawer-close" aria-label="Close menu" tabindex="0" role="button">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </label>
        </div>
        
        <nav class="em-drawer-content">
          <div class="em-nav-group">
            <span class="em-nav-label">Overview</span>
            <ul class="em-nav-list">
              <li><a href="#" class="em-nav-link em-nav-link-active">Dashboard</a></li>
              <li><a href="#" class="em-nav-link">Analytics</a></li>
              <li><a href="#" class="em-nav-link">Customers</a></li>
            </ul>
          </div>

          <div class="em-nav-group">
            <span class="em-nav-label">Workspace</span>
            <ul class="em-nav-list">
              <li><a href="#" class="em-nav-link">Settings</a></li>
              <li><a href="#" class="em-nav-link">Team Members</a></li>
              <li><a href="#" class="em-nav-link">Billing</a></li>
            </ul>
          </div>
        </nav>
        
        <div class="em-drawer-footer">
          <div class="em-user-profile">
            <div class="em-user-avatar">JD</div>
            <div class="em-user-info">
              <span class="em-user-name">Jane Doe</span>
              <span class="em-user-email">jane@acmecorp.com</span>
            </div>
          </div>
        </div>
      </aside>
    </header>
  </main>
</body>
</html>
