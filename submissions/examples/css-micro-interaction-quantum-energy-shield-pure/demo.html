<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Micro-interactions: Quantum Energy Shield</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header class="header">
            <h1>Quantum Energy Shield</h1>
            <p>Hardware-accelerated CSS force fields and energy micro-interactions.</p>
        </header>

        <main class="grid">
            
            <!-- Force Field Button -->
            <section class="demo-section">
                <div class="demo-content">
                    <h2>Deflector Button</h2>
                    <p>Hover to project a multi-layered energy shield.</p>
                    
                    <div class="component-box dark-box">
                        <button class="btn btn-shield">
                            <span class="btn-text">ENGAGE SHIELD</span>
                            <!-- Shield Layers -->
                            <div class="shield-layer s-outer"></div>
                            <div class="shield-layer s-middle"></div>
                            <div class="shield-layer s-inner"></div>
                        </button>
                    </div>
                </div>
            </section>

            <!-- Quantum Core Loader -->
            <section class="demo-section">
                <div class="demo-content">
                    <h2>Quantum Core Loader</h2>
                    <p>An infinite stabilized energy containment field.</p>
                    
                    <div class="component-box dark-box">
                        <div class="quantum-loader">
                            <div class="q-ring r-x"></div>
                            <div class="q-ring r-y"></div>
                            <div class="q-ring r-z"></div>
                            <div class="q-core"></div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Avatar Force Field -->
            <section class="demo-section">
                <div class="demo-content">
                    <h2>Aura Avatar</h2>
                    <p>Hover to trigger a particle energy field.</p>
                    
                    <div class="component-box dark-box">
                        <div class="avatar-container">
                            <img src="https://i.pravatar.cc/150?img=33" alt="Avatar" class="avatar-img">
                            <div class="aura-field"></div>
                            <!-- Particle dots for energy effect -->
                            <div class="particles">
                                <span class="p1"></span><span class="p2"></span><span class="p3"></span><span class="p4"></span>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
            
        </main>
    </div>

</body>
</html>
