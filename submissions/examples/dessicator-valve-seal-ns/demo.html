<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dessicator Valve Seal — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Dessicator Valve Seal demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Dessicator Valve Seal</h1>
      <p class="lede">Desiccator valve sealing after vacuum pull-down</p>
    </header>

    <section class="ease-dessicator-valve-seal" data-demo="dessicator-valve-seal" aria-live="polite">
      <div class="ease-dessicator-valve-seal__housing">
        <div class="ease-dessicator-valve-seal__bezel">
          <div class="ease-dessicator-valve-seal__face">
            <div class="ease-dessicator-valve-seal__readout">
              <span class="ease-dessicator-valve-seal__label">Dessicator Valve Seal</span>
              <span class="ease-dessicator-valve-seal__value">LIVE</span>
            </div>
            <div class="ease-dessicator-valve-seal__motion" aria-hidden="true">
              <span class="ease-dessicator-valve-seal__a"></span>
              <span class="ease-dessicator-valve-seal__b"></span>
              <span class="ease-dessicator-valve-seal__c"></span>
              <span class="ease-dessicator-valve-seal__d"></span>
            </div>
            <div class="ease-dessicator-valve-seal__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-dessicator-valve-seal__controls">
          <button type="button" class="ease-dessicator-valve-seal__btn primary">Engage</button>
          <button type="button" class="ease-dessicator-valve-seal__btn">Reset</button>
          <label class="ease-dessicator-valve-seal__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-dessicator-valve-seal__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
