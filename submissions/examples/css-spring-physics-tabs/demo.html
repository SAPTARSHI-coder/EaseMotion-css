<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Spring Physics Tabs</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<main class="access-layout">


<header class="hero">

    <h1>
        CSS Spring Physics Tabs
    </h1>

    </p>

</header>




<section class="tabs" aria-label="Accessible Navigation Tabs">


<button class="tab active">

    <span class="icon">
        🏠
    </span>

    Dashboard

</button>



<button class="tab">

    <span class="icon">
        📚
    </span>

    Learning

</button>



<button class="tab">

    <span class="icon">
        🚀
    </span>

    Projects

</button>



<button class="tab">

    <span class="icon">
        👤
    </span>

    Profile

</button>



</section>





<section class="content">


<h2>
    Spring Physics Interaction
</h2>


<p>
    Experience smooth elastic movement created completely
    with CSS transitions and transforms.
</p>


</section>



</main>


</body>

</html>
