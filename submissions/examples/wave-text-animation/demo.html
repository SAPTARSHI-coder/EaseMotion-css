<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A dependency-free wave text animation using CSS.">
  <title>Wave Text Animation</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="demo">
    <section class="wave-container" aria-labelledby="wave-title">
      <h1 id="wave-title" class="wave-text" aria-label="Wave Text">
        <span aria-hidden="true">W</span>
        <span aria-hidden="true">a</span>
        <span aria-hidden="true">v</span>
        <span aria-hidden="true">e</span>
        <span aria-hidden="true">&nbsp;</span>
        <span aria-hidden="true">T</span>
        <span aria-hidden="true">e</span>
        <span aria-hidden="true">x</span>
        <span aria-hidden="true">t</span>
      </h1>

      <p class="description">
        Each letter moves gently like a sea wave.
      </p>

      <button type="button" class="toggle-button" id="toggle-animation" aria-pressed="false">
        Pause Animation
      </button>
    </section>
  </main>

  <script>
    const button = document.getElementById("toggle-animation");
    const waveText = document.querySelector(".wave-text");

    button.addEventListener("click", () => {
      const isPaused = waveText.classList.toggle("is-paused");

      button.textContent = isPaused
        ? "Play Animation"
        : "Pause Animation";

      button.setAttribute("aria-pressed", String(isPaused));
    });
  </script>
</body>

</html>
