<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pricing Toggle Grid | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="demo-header">
    <h1>Pricing Toggle Grid</h1>
    <p>Monthly and Yearly plan comparison cards with interactive toggle.</p>
  </header>

  <main class="demo-main">
    <section class="demo-section">
      <div class="ease-pricing-grid">
        <div class="ease-price-card">
          <h3>Starter</h3>
          <div class="ease-price-amount">$19<span>/mo</span></div>
          <button class="ease-price-btn">Get Started</button>
        </div>
        <div class="ease-price-card ease-price-popular">
          <span class="ease-price-badge">Most Popular</span>
          <h3>Pro Plan</h3>
          <div class="ease-price-amount">$49<span>/mo</span></div>
          <button class="ease-price-btn ease-btn-primary">Upgrade Pro</button>
        </div>
      </div>
    </section>
  </main>
  <footer class="demo-footer"><p>EaseMotion CSS Project</p></footer>
</body>
</html>
