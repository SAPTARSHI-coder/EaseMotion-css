<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <title>Holographic Sheen Beam</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="demo">
    <section class="intro">
      <span class="label">EaseMotion Core</span>

      <h1>Holographic Sheen Beam</h1>

      <p>
        A smooth holographic light beam that sweeps across an element
        using compositor-friendly transforms and opacity.
      </p>
    </section>

    <section class="demo-stage">
      <article class="holo-card ease-anim-holographic-sheen-beam">
        <div class="holo-card__shine" aria-hidden="true"></div>

        <div class="holo-card__content">
          <span class="holo-card__badge">EASEMOTION</span>

          <h2>Holographic</h2>

          <p>
            Sheen Beam
          </p>

          <span class="holo-card__icon">✦</span>
        </div>
      </article>
    </section>

    <p class="hint">
      CSS-only · Transform + opacity · Reduced-motion aware
    </p>
  </main>
</body>
</html>
