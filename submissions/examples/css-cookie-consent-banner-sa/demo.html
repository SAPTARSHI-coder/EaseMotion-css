<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>[FEATURE] CSS Cookie Consent Banner</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<main>
  <p style="font-family:system-ui;padding:2rem">Main page content…</p>
  <div class="em-css-cookie-consent-banner" role="dialog" aria-label="cookie consent">
    <span>🍪 We use cookies to improve your experience. By continuing you accept our cookie policy.</span>
    <button onclick="this.parentElement.style.display='none'">Accept</button>
  </div>
</main>
</body>
</html>
