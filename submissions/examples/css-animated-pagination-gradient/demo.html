<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Pagination | Gradient Styling</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="pagination-card" aria-label="Animated Gradient Pagination Showcase">
    <h1 class="card-title">Gradient Pagination</h1>
    <p class="card-desc">Fluid multi-color gradient hover states with spring scale motion and glow active indicators.</p>

    <nav class="pagination-nav" aria-label="Page navigation">
        <ul class="pagination-list">
            <li>
                <a href="#" class="page-link page-action" aria-label="Previous Page">
                    &laquo; Prev
                </a>
            </li>
            <li>
                <a href="#" class="page-link" aria-label="Page 1">1</a>
            </li>
            <li>
                <a href="#" class="page-link active" aria-label="Page 2" aria-current="page">2</a>
            </li>
            <li>
                <a href="#" class="page-link" aria-label="Page 3">3</a>
            </li>
            <li>
                <span class="page-ellipsis" aria-hidden="true">&hellip;</span>
            </li>
            <li>
                <a href="#" class="page-link" aria-label="Page 12">12</a>
            </li>
            <li>
                <a href="#" class="page-link page-action" aria-label="Next Page">
                    Next &raquo;
                </a>
            </li>
        </ul>
    </nav>
</main>

</body>
</html>
