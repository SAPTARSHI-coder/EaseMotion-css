<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Animated Input Group | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="input-demo-container">
    <header class="input-demo-header">
      <h1>Animated Input Group</h1>
      <p>Input groups with prepended and appended addons featuring smooth CSS focus transitions.</p>
    </header>

    <form class="input-demo-form" onsubmit="return false;">
      
      <!-- Input Group 1: Prepend Icon & Append Domain -->
      <div class="input-demo-field">
        <label for="web-domain" class="input-demo-label">Custom Domain Slug</label>
        <div class="ease-input-group">
          <span class="ease-input-group__addon ease-input-group__addon--prepend" id="addon-https">
            <svg class="ease-input-group__icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
            </svg>
          </span>
          <input 
            type="text" 
            id="web-domain" 
            class="ease-input-group__control" 
            placeholder="my-portfolio" 
            aria-describedby="addon-https addon-tld"
            autocomplete="off"
          >
          <span class="ease-input-group__addon ease-input-group__addon--append" id="addon-tld">
            .easemotion.dev
          </span>
        </div>
      </div>

      <!-- Input Group 2: Prepend Currency & Append Submit Button -->
      <div class="input-demo-field">
        <label for="budget-amount" class="input-demo-label">Monthly Budget</label>
        <div class="ease-input-group">
          <span class="ease-input-group__addon ease-input-group__addon--prepend" id="addon-currency">
            $
          </span>
          <input 
            type="number" 
            id="budget-amount" 
            class="ease-input-group__control" 
            placeholder="500" 
            aria-describedby="addon-currency"
          >
          <button type="submit" class="ease-input-group__btn" aria-label="Save Budget">
            Save
          </button>
        </div>
      </div>

    </form>
  </main>

</body>
</html>
