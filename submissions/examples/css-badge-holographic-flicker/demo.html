<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Badge: Holographic Flicker Variation - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="em-demo-container">
        <!-- Pure CSS Holographic Flicker Badge Component Showcase -->
        <header class="em-badge-card" role="region" aria-label="Holographic Flicker Badge Showcase" tabindex="0">
            <div class="em-badge-header-bar">
                <span class="em-card-badge">BADGES & CHIPS</span>
                <span class="em-brand-logo">HoloMotion</span>
            </div>
            <h1 class="em-card-title">Holographic Flicker Badge</h1>
            <p class="em-card-desc">A smooth, accessible, and performant pure CSS badge featuring iridescent holographic gradients, flicker keyframe animations, and frosted glassmorphism.</p>
            <div class="em-badge-wrapper">
                <div class="em-holographic-badge" aria-label="Holographic status indicator">
                    <span class="em-badge-text">CYBERPUNK V2</span>
                </div>
            </div>
        </header>
    </div>
</body>
</html>
