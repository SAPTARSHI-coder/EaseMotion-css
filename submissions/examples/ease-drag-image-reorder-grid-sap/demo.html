<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ease-drag-image-reorder-grid-sap demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { height: 100vh; margin: 0; display: flex; align-items: center; justify-content: center; background: #f4f4f5; }
  </style>
</head>
<body>
  <div class="reorder-grid-sap" id="grid">
    <div class="grid-tile" draggable="true" style="background-image:url(https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=200)"></div>
    <div class="grid-tile" draggable="true" style="background-image:url(https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=200)"></div>
    <div class="grid-tile" draggable="true" style="background-image:url(https://images.unsplash.com/photo-1519681393784-d120267933ba?w=200)"></div>
    <div class="grid-tile" draggable="true" style="background-image:url(https://images.unsplash.com/photo-1449824913935-59a10b8d2000?w=200)"></div>
    <div class="grid-tile" draggable="true" style="background-image:url(https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=200)"></div>
    <div class="grid-tile" draggable="true" style="background-image:url(https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=200)"></div>
  </div>
  <script>
    const grid = document.getElementById('grid');
    let dragged = null;
    grid.querySelectorAll('.grid-tile').forEach(tile => {
      tile.addEventListener('dragstart', () => { dragged = tile; tile.classList.add('dragging'); });
      tile.addEventListener('dragend', () => tile.classList.remove('dragging'));
      tile.addEventListener('dragover', (e) => { e.preventDefault(); tile.classList.add('drag-over'); });
      tile.addEventListener('dragleave', () => tile.classList.remove('drag-over'));
      tile.addEventListener('drop', (e) => {
        e.preventDefault();
        tile.classList.remove('drag-over');
        if (dragged && dragged !== tile) {
          const placeholder = document.createElement('div');
          dragged.replaceWith(placeholder);
          tile.replaceWith(dragged);
          placeholder.replaceWith(tile);
        }
      });
    });
  </script>
</body>
</html>
