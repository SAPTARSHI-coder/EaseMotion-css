<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradient Glow Carousel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="gg-carousel">
        <input type="radio" name="gg-slide" id="gg1" checked>
        <input type="radio" name="gg-slide" id="gg2">
        <input type="radio" name="gg-slide" id="gg3">
        
        <div class="gg-window">
            <div class="gg-track">
                <div class="gg-slide s1">
                    <h2>VIBRANT</h2>
                    <p>Slide 1</p>
                </div>
                <div class="gg-slide s2">
                    <h2>ENERGY</h2>
                    <p>Slide 2</p>
                </div>
                <div class="gg-slide s3">
                    <h2>MOTION</h2>
                    <p>Slide 3</p>
                </div>
            </div>
        </div>
        
        <div class="gg-dots">
            <label for="gg1"></label>
            <label for="gg2"></label>
            <label for="gg3"></label>
        </div>
    </div>
</body>
</html>
