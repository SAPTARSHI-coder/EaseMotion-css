<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Rotating Cube Navigation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="page">
        <section class="hero">
            <p class="tag">INTERACTIVE NAVIGATION</p>

            <h1>Explore in 3D</h1>

            <p class="description">
                A compact 3D rotating cube navigation menu built
                with pure HTML, CSS and JavaScript.
            </p>

            <div class="cube-wrapper">
                <div class="cube" id="cube">

                    <a href="#home" class="face front">HOME</a>
                    <a href="#about" class="face back">ABOUT</a>
                    <a href="#projects" class="face right">PROJECTS</a>
                    <a href="#contact" class="face left">CONTACT</a>
                    <a href="#services" class="face top">SERVICES</a>
                    <a href="#menu" class="face bottom">MENU</a>

                </div>
            </div>

            <button id="rotateBtn" class="rotate-btn">
                Rotate Cube
            </button>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
