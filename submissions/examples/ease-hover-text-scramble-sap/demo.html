<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ease-hover-text-scramble-sap demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { height: 100vh; margin: 0; display: flex; align-items: center; justify-content: center; background: #fafafa; }
  </style>
</head>
<body>
  <span class="text-scramble-sap" id="scrambleEl" data-text="DECODE ME">DECODE ME</span>
  <script>
    const CHARS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ!@#$%';
    const el = document.getElementById('scrambleEl');
    const finalText = el.dataset.text;
    let frame = 0, frameId = null;
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    function scramble() {
      if (reduceMotion) return;
      const queue = [...finalText].map((ch, i) => ({
        to: ch,
        start: Math.floor(i * 2),
        end: Math.floor(i * 2) + 10
      }));
      frame = 0;
      cancelAnimationFrame(frameId);

      function update() {
        let output = '';
        let done = 0;
        queue.forEach(({ to, start, end }) => {
          if (frame >= end) { done++; output += to; }
          else if (frame >= start) {
            output += `<span class="scr-char active">${CHARS[Math.floor(Math.random() * CHARS.length)]}</span>`;
          } else {
            output += to;
          }
        });
        el.innerHTML = output;
        if (done < queue.length) {
          frame++;
          frameId = requestAnimationFrame(update);
        }
      }
      update();
    }

    el.addEventListener('mouseenter', scramble);
  </script>
</body>
</html>
