<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calorimeter Stir — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Calorimeter Stir demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Calorimeter Stir</h1>
      <p class="lede">Calorimeter stirrer mixing a thermal sample bath</p>
    </header>

    <section class="ease-calorimeter-stir" data-demo="calorimeter-stir" aria-live="polite">
      <div class="ease-calorimeter-stir__housing">
        <div class="ease-calorimeter-stir__bezel">
          <div class="ease-calorimeter-stir__face">
            <div class="ease-calorimeter-stir__readout">
              <span class="ease-calorimeter-stir__label">Calorimeter Stir</span>
              <span class="ease-calorimeter-stir__value">LIVE</span>
            </div>
            <div class="ease-calorimeter-stir__motion" aria-hidden="true">
              <span class="ease-calorimeter-stir__a"></span>
              <span class="ease-calorimeter-stir__b"></span>
              <span class="ease-calorimeter-stir__c"></span>
              <span class="ease-calorimeter-stir__d"></span>
            </div>
            <div class="ease-calorimeter-stir__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-calorimeter-stir__controls">
          <button type="button" class="ease-calorimeter-stir__btn primary">Engage</button>
          <button type="button" class="ease-calorimeter-stir__btn">Reset</button>
          <label class="ease-calorimeter-stir__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-calorimeter-stir__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
