<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vector Clock Causality</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="motion-shell vector_clock_causality_drp" aria-labelledby="motion-title">
    <section class="motion-panel">
      <p class="eyebrow">causal ordering</p>
      <h1 id="motion-title">Vector Clock Causality</h1>
      <p class="summary">Independent nodes exchange vector timestamps and animate happens-before relationships without JavaScript.</p>
      <div class="stage" role="img" aria-label="Animated Vector Clock Causality visualization">
        <div class="orbit orbit-one"></div>
        <div class="orbit orbit-two"></div>
        <article class="node node-a"><strong>A</strong><span>local tick</span></article>
        <article class="node node-b"><strong>B</strong><span>message merge</span></article>
        <article class="node node-c"><strong>C</strong><span>causal order</span></article>
        <div class="beam beam-ab"><i></i></div>
        <div class="beam beam-bc"><i></i></div>
        <div class="beam beam-ca"><i></i></div>
        <div class="decision">causal order</div>
      </div>
      <div class="status-grid" aria-label="Vector Clock Causality status">
        <span>local tick</span>
        <span>message merge</span>
        <span>causal order</span>
      </div>
    </section>
  </main>
</body>
</html>
