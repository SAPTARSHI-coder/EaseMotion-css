<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Loader: Velvet Smooth Transition</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="layout-container">
        
        <header class="section-header">
            <h1 class="title">Pure CSS Loader: Velvet Smooth</h1>
            <p class="subtitle">A luxurious, ultra-soft loading animation relying on heavily blurred, slow-spinning gradients and custom cubic-bezier easing to simulate flowing liquid velvet.</p>
        </header>

        <div class="demo-area">
            
            <div class="loader-container" aria-label="Loading content, velvet smooth transition animation playing">
                
                <!-- 
                  [TECHNIQUE] Velvet Smooth Transition
                  Heavily blurred, oversized circular gradients rotate slowly inside 
                  a masked container. The extreme blur combined with deep, rich colors 
                  creates a continuous, seamless, velvet-like color transition.
                -->
                <div class="velvet-wrapper" aria-hidden="true">
                    
                    <div class="velvet-orb orb-1"></div>
                    <div class="velvet-orb orb-2"></div>
                    <div class="velvet-orb orb-3"></div>
                    
                </div>
                
                <div class="loading-text">Polishing Experience</div>
                
            </div>
            
        </div>
        
    </div>

</body>
</html>
