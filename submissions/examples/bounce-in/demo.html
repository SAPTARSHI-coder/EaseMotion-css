<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bounce In Demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f8fafc;
      overflow: hidden;
    }
    .demo-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
    }
    .box {
      width: 140px;
      height: 140px;
      background: #f59e0b;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      text-align: center;
      box-shadow: 0 10px 15px -3px rgba(245, 158, 11, 0.3);
    }
    .replay-btn {
      margin-top: 3rem;
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
      background: #334155;
      color: white;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="demo-grid" id="grid">
    <div class="box bounce-in-top-ag">Top</div>
    <div class="box bounce-in-bottom-ag">Bottom</div>
    <div class="box bounce-in-left-ag">Left</div>
    <div class="box bounce-in-right-ag">Right</div>
  </div>

  <button class="replay-btn" onclick="replay()">Replay Animations</button>

  <script>
    function replay() {
      const grid = document.getElementById('grid');
      const clone = grid.cloneNode(true);
      grid.parentNode.replaceChild(clone, grid);
    }
  </script>
</body>
</html>
