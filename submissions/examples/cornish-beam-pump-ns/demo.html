<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cornish Beam Pump — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Cornish Beam Pump demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Cornish Beam Pump</h1>
      <p class="lede">Cornish beam pump nodding on the outdoor stroke</p>
    </header>

    <section class="ease-cornish-beam-pump" data-demo="cornish-beam-pump" aria-live="polite">
      <div class="ease-cornish-beam-pump__housing">
        <div class="ease-cornish-beam-pump__bezel">
          <div class="ease-cornish-beam-pump__face">
            <div class="ease-cornish-beam-pump__readout">
              <span class="ease-cornish-beam-pump__label">Cornish Beam Pump</span>
              <span class="ease-cornish-beam-pump__value">LIVE</span>
            </div>
            <div class="ease-cornish-beam-pump__motion" aria-hidden="true">
              <span class="ease-cornish-beam-pump__a"></span>
              <span class="ease-cornish-beam-pump__b"></span>
              <span class="ease-cornish-beam-pump__c"></span>
              <span class="ease-cornish-beam-pump__d"></span>
            </div>
            <div class="ease-cornish-beam-pump__meters">
              <i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-cornish-beam-pump__controls">
          <button type="button" class="ease-cornish-beam-pump__btn primary">Stroke</button>
          <button type="button" class="ease-cornish-beam-pump__btn">Idle</button>
          <label class="ease-cornish-beam-pump__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-cornish-beam-pump__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
