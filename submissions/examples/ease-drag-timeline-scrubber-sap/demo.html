<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ease-drag-timeline-scrubber-sap demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { height: 100vh; margin: 0; display: flex; align-items: center; justify-content: center; background: #f4f4f5; }
  </style>
</head>
<body>
  <div class="timeline-scrub-sap">
    <div class="scrub-track" id="track">
      <div class="scrub-fill" id="fill"></div>
      <div class="scrub-thumb" id="thumb"></div>
    </div>
    <div class="scrub-markers">
      <span>Jan</span><span>Mar</span><span>Jun</span><span>Sep</span><span>Dec</span>
    </div>
  </div>
  <script>
    const track = document.getElementById('track');
    const fill = document.getElementById('fill');
    const thumb = document.getElementById('thumb');
    let dragging = false;

    function setPct(x) {
      const rect = track.getBoundingClientRect();
      let pct = ((x - rect.left) / rect.width) * 100;
      pct = Math.max(0, Math.min(100, pct));
      fill.style.width = pct + '%';
      thumb.style.left = pct + '%';
    }

    track.addEventListener('mousedown', (e) => { dragging = true; setPct(e.clientX); });
    window.addEventListener('mousemove', (e) => { if (dragging) setPct(e.clientX); });
    window.addEventListener('mouseup', () => dragging = false);
  </script>
</body>
</html>
