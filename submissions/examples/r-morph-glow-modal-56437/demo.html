<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Morph-Glow Modal</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<input type="checkbox" id="modal-toggle" hidden>

<div class="page">

<h1>Gaming Hub</h1>

<p>
Launch a futuristic Morph-Glow Modal built using pure HTML and CSS.
</p>

<label for="modal-toggle" class="open-btn">
Open Reward Chest
</label>

</div>

<div class="overlay">

<div class="modal">

<label for="modal-toggle" class="close-btn">&times;</label>

<div class="icon">🎮</div>

<h2>Legendary Reward</h2>

<p>
Congratulations! You have unlocked an exclusive gaming reward with a glowing morph animation.
</p>

<label for="modal-toggle" class="action-btn">
Claim Reward
</label>

</div>

</div>

</body>
</html>
