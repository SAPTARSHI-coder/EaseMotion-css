<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accessible Toast Alert Demo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <main class="demo-container">
        <h1>Toast Notification System</h1>
        <p>This demo illustrates how to create fully accessible toast notifications with proper ARIA live regions and explicitly labeled close buttons.</p>
        
        <button type="button" class="btn" id="trigger-toast-btn">
            Trigger Success Toast
        </button>
    </main>

    <!-- 
        CRITICAL ACCESSIBILITY: Toast Container 
        The container must exist in the DOM on page load with aria-live and role="status" or role="alert".
        Screen readers monitor this container and will announce anything injected into it.
    -->
    <div 
        class="toast-container" 
        id="toast-container" 
        role="status" 
        aria-live="polite" 
        aria-atomic="true"
    >
        <!-- Toasts will be injected here via JavaScript -->
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const btn = document.getElementById('trigger-toast-btn');
            const container = document.getElementById('toast-container');
            let toastCount = 0;

            btn.addEventListener('click', () => {
                toastCount++;
                createToast(`Item ${toastCount} saved successfully.`);
            });

            function createToast(message) {
                const toast = document.createElement('div');
                toast.className = 'toast';
                
                // Content
                const content = document.createElement('div');
                content.className = 'toast-content';
                content.textContent = message;
                
                // CRITICAL ACCESSIBILITY: Close Button ARIA Label
                // Icon-only buttons MUST have an aria-label, otherwise a screen reader will just read "Button"
                const closeBtn = document.createElement('button');
                closeBtn.type = 'button';
                closeBtn.className = 'toast-close';
                closeBtn.setAttribute('aria-label', 'Close notification'); // <--- CRITICAL FIX
                
                // Decorative SVG hidden from screen readers
                closeBtn.innerHTML = `
                    <svg aria-hidden="true" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                `;

                closeBtn.addEventListener('click', () => {
                    toast.classList.add('is-hiding');
                    setTimeout(() => toast.remove(), 300);
                });

                toast.appendChild(content);
                toast.appendChild(closeBtn);
                
                // Prepend so newest is at the top
                container.prepend(toast);

                // Auto-dismiss after 5 seconds
                // (In a truly accessible system, ensure users can pause this timer on hover/focus)
                setTimeout(() => {
                    if (document.body.contains(toast)) {
                        toast.classList.add('is-hiding');
                        setTimeout(() => toast.remove(), 300);
                    }
                }, 5000);
            }
        });
    </script>
</body>
</html>
