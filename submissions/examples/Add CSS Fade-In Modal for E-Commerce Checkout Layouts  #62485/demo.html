<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Fade-In Modal - EaseMotion</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Pure CSS State Checkbox -->
  <input type="checkbox" id="modal-toggle" class="modal-state" aria-hidden="true">

  <!-- Main Application / Mock E-commerce Cart -->
  <div class="app-layout">
    
    <main class="cart-container">
      
      <div class="cart-header">
        <h2>Your Shopping Cart</h2>
        <span class="item-count">2 Items</span>
      </div>
      
      <div class="cart-items">
        <div class="cart-item">
          <div class="item-img img-1"></div>
          <div class="item-details">
            <h4>Wireless Noise-Cancelling Headphones</h4>
            <p>Matte Black</p>
          </div>
          <div class="item-price">$299.00</div>
        </div>
        
        <div class="cart-item">
          <div class="item-img img-2"></div>
          <div class="item-details">
            <h4>Aluminium Laptop Stand</h4>
            <p>Silver</p>
          </div>
          <div class="item-price">$45.00</div>
        </div>
      </div>

      <div class="cart-footer">
        <div class="total-row">
          <span>Subtotal</span>
          <strong>$344.00</strong>
        </div>
        
        <!-- Label acts as Modal Trigger Button -->
        <label for="modal-toggle" class="checkout-trigger" aria-label="Proceed to Checkout">Proceed to Checkout</label>
      </div>
      
    </main>
    
  </div>

  <!-- Soft Dimming Backdrop Overlay (Acts as Close Button) -->
  <label for="modal-toggle" class="modal-backdrop" aria-label="Close Modal"></label>

  <!-- The Fade-In Modal Container -->
  <div class="modal" role="dialog" aria-modal="true">
    
    <div class="modal-header">
      <h3>Checkout Options</h3>
      <label for="modal-toggle" class="close-btn" aria-label="Close Modal">&times;</label>
    </div>
    
    <div class="modal-body">
      <p class="subtitle">How would you like to proceed with your order?</p>
      
      <div class="auth-options">
        
        <!-- Demo actions that would typically route the user -->
        <button class="btn btn-primary" onclick="alert('Routing to Guest Checkout flow...')">
          Continue as Guest
        </button>
        
        <div class="divider">
          <span>or</span>
        </div>
        
        <button class="btn btn-outline" onclick="alert('Routing to Authentication flow...')">
          Sign In to Account
        </button>
        
      </div>
      
      <p class="helper-text">
        Signing in allows you to use saved payment methods and track your order history.
      </p>
    </div>
    
  </div>

</body>
</html>
