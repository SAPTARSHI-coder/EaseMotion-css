<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Glass Tooltip</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Cyberpunk grid background to emphasize the glass effect -->
    <div class="grid-bg"></div>
    <div class="glow-orb"></div>

    <div class="tooltip-container">
        Hover over me
        <div class="neon-glass-tooltip">
            <h4 class="tooltip-title">System Status</h4>
            <p class="tooltip-text">All primary neon subroutines are functioning within optimal parameters.</p>
        </div>
    </div>

</body>
</html>
