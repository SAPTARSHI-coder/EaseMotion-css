<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Solar Flare Radial CSS progress indicator built with pure HTML and vanilla CSS."
  >

  <title>Solar Flare Radial Progress</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="page">
    <section class="progress-card" aria-labelledby="progress-title">

      <div class="progress-header">
        <span class="eyebrow">CSS PROGRESS</span>
        <h1 id="progress-title">Solar Flare</h1>
        <p>Radial progress indicator with a glowing solar flare effect.</p>
      </div>

      <div
        class="radial-progress"
        role="progressbar"
        aria-valuenow="72"
        aria-valuemin="0"
        aria-valuemax="100"
        style="--progress: 72%;"
      >
        <div class="radial-progress__core">
          <strong>72%</strong>
          <span>Complete</span>
        </div>
      </div>

      <div class="progress-status">
        <span class="status-dot" aria-hidden="true"></span>
        <span>Processing in progress</span>
      </div>

    </section>
  </main>
</body>
</html>
