<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glass Blower Punty — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Glass Blower Punty demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Glass Blower Punty</h1>
      <p class="lede">Glassblower punty rotating a glowing gather</p>
    </header>

    <section class="ease-glass-blower-punty" data-demo="glass-blower-punty" aria-live="polite">
      <div class="ease-glass-blower-punty__housing">
        <div class="ease-glass-blower-punty__bezel">
          <div class="ease-glass-blower-punty__face">
            <div class="ease-glass-blower-punty__readout">
              <span class="ease-glass-blower-punty__label">Glass Blower Punty</span>
              <span class="ease-glass-blower-punty__value">LIVE</span>
            </div>
            <div class="ease-glass-blower-punty__motion" aria-hidden="true">
              <span class="ease-glass-blower-punty__a"></span>
              <span class="ease-glass-blower-punty__b"></span>
              <span class="ease-glass-blower-punty__c"></span>
              <span class="ease-glass-blower-punty__d"></span>
            </div>
            <div class="ease-glass-blower-punty__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-glass-blower-punty__controls">
          <button type="button" class="ease-glass-blower-punty__btn primary">Engage</button>
          <button type="button" class="ease-glass-blower-punty__btn">Reset</button>
          <label class="ease-glass-blower-punty__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-glass-blower-punty__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
