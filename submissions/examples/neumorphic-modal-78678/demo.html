<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Neumorphic modal showcase for EaseMotion CSS issue #78678." />
    <title>Neumorphic Modal</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="backdrop">
      <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" aria-describedby="modal-copy">
        <header class="modal-header">
          <p class="eyebrow">EaseMotion CSS · Issue #78678</p>
          <span class="modal-mark" aria-hidden="true">!</span>
        </header>

        <div class="modal-content">
          <h1 id="modal-title">Ready to continue?</h1>
          <p id="modal-copy">
            This modal demonstrates a soft neumorphic surface with clear actions,
            accessible structure, and responsive spacing.
          </p>
        </div>

        <div class="actions">
          <button type="button" class="button secondary">Cancel</button>
          <button type="button" class="button primary">Continue</button>
        </div>
      </section>
    </main>
  </body>
</html>
