<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neumorphic Modal</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="backdrop">
      <section class="modal" role="dialog" aria-labelledby="modal-title" aria-describedby="modal-copy">
        <p class="eyebrow">EaseMotion CSS · Issue #78678</p>
        <h1 id="modal-title">Ready to continue?</h1>
        <p id="modal-copy">
          This modal demonstrates a soft neumorphic surface with clear actions
          and responsive spacing.
        </p>
        <div class="actions">
          <button type="button" class="button secondary">Cancel</button>
          <button type="button" class="button primary">Continue</button>
        </div>
      </section>
    </main>
  </body>
</html>
