<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fortune Wheel Spin Component - Play Category</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="ease-wheel-stage" aria-labelledby="stage-title">
    <div style="text-align: center;">
      <h1 id="stage-title" class="ease-wheel-title">Lucky Prize Wheel</h1>
      <p class="ease-wheel-desc">Spin the wheel to test your fortune and win exclusive rewards.</p>
    </div>

    <!-- Fortune Wheel Component -->
    <div class="ease-wheel-container">
      <div class="ease-wheel-pointer" id="wheel-pointer" aria-hidden="true"></div>
      <div class="ease-fortune-wheel" id="fortune-wheel" role="img" aria-label="Fortune Prize Wheel"></div>
    </div>

    <button type="button" class="ease-btn-spin" id="spin-btn">Spin the Wheel</button>
  </main>

  <script>
    const wheel = document.getElementById('fortune-wheel');
    const pointer = document.getElementById('wheel-pointer');
    const spinBtn = document.getElementById('spin-btn');
    let currentRotation = 0;

    spinBtn.addEventListener('click', () => {
      spinBtn.disabled = true;
      // Generate random extra spins (3 to 6 full turns) plus random segment offset
      const randomSpins = Math.floor(Math.random() * 4) + 3;
      const randomDegree = Math.floor(Math.random() * 360);
      currentRotation += (randomSpins * 360) + randomDegree;

      wheel.style.transform = `rotate(${currentRotation}deg)`;

      setTimeout(() => {
        pointer.classList.add('is-clicking');
        setTimeout(() => pointer.classList.remove('is-clicking'), 300);
        spinBtn.disabled = false;
      }, 4000);
    });
  </script>
</body>
</html>
