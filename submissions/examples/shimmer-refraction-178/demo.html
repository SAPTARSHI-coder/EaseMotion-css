<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Tilted Holographic Badge with Dynamic Shimmer Refraction - Cyberpunk Theme">
  <title>Tilted Holographic Badge</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="page">
    <section class="showcase" aria-label="Holographic badge showcase">

      <div class="badge-wrapper">
        <div class="holo-badge">
          <div class="badge-glow"></div>
          <div class="shimmer"></div>

          <div class="badge-content">
            <span class="badge-icon">✦</span>

            <div class="badge-text">
              <span class="badge-label">SYSTEM STATUS</span>
              <strong>CYBER // 178</strong>
            </div>

            <span class="badge-dot"></span>
          </div>

          <div class="scanline"></div>
        </div>
      </div>

      <div class="instructions">
        <span>HOVER TO REFRACT</span>
        <span>◆</span>
        <span>HOLOGRAPHIC INTERFACE</span>
      </div>

    </section>
  </main>
</body>
</html>
