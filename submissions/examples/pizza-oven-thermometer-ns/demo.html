<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pizza Oven Thermometer — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Pizza Oven Thermometer demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Pizza Oven Thermometer</h1>
      <p class="lede">Pizza oven door thermometer needle sweeping into the bake zone</p>
    </header>

    <section class="ease-pizza-oven-thermometer" data-demo="pizza-oven-thermometer" aria-live="polite">
      <div class="ease-pizza-oven-thermometer__housing">
        <div class="ease-pizza-oven-thermometer__bezel">
          <div class="ease-pizza-oven-thermometer__face">
            <div class="ease-pizza-oven-thermometer__readout">
              <span class="ease-pizza-oven-thermometer__label">Pizza Oven Thermometer</span>
              <span class="ease-pizza-oven-thermometer__value" id="val-pizza-oven-thermometer">READY</span>
            </div>
            <div class="ease-pizza-oven-thermometer__motion" aria-hidden="true">
              <span class="ease-pizza-oven-thermometer__arm"></span>
              <span class="ease-pizza-oven-thermometer__core"></span>
              <span class="ease-pizza-oven-thermometer__trail"></span>
              <span class="ease-pizza-oven-thermometer__mark m1"></span>
              <span class="ease-pizza-oven-thermometer__mark m2"></span>
              <span class="ease-pizza-oven-thermometer__mark m3"></span>
            </div>
            <div class="ease-pizza-oven-thermometer__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-pizza-oven-thermometer__controls">
          <button type="button" class="ease-pizza-oven-thermometer__btn primary">Engage</button>
          <button type="button" class="ease-pizza-oven-thermometer__btn">Reset</button>
          <label class="ease-pizza-oven-thermometer__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-pizza-oven-thermometer__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
