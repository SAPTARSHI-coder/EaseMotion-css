<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-laptop-battery-bar demo</title>
</head>
<body>
<div class="lbb-app">
  <span class="lbb-title">LAPTOP</span>
  <div class="lbb-lid">
    <div class="lbb-bar">
      <span class="lbb-batt">
        <span class="lbb-wedge"></span>
        <span class="lbb-tip"></span>
      </span>
      <span class="lbb-wifi">
        <span class="lbb-dot"></span>
        <span class="lbb-dot"></span>
        <span class="lbb-dot"></span>
      </span>
      <span class="lbb-clock">14:32</span>
    </div>
  </div>
  <div class="lbb-base"></div>
  <span class="lbb-note">86% REMAINING</span>
</div>
</body>
</html>
