<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ease 3D Flip Book Page Transition</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="ease-book-body">
  <div class="ease-book-stage">
    <div class="ease-book" id="book">
      <div class="ease-page ease-page-front">
        <h2>Cover Page</h2>
        <p>Click anywhere to flip the page</p>
      </div>
      <div class="ease-page ease-page-back">
        <h2>Inner Page</h2>
        <p>3D Y-axis flip with realistic drop shadows</p>
      </div>
    </div>
  </div>

  <script>
    const book = document.getElementById('book');
    book.addEventListener('click', () => {
      book.classList.toggle('flipped');
    });
  </script>
</body>
</html>
