<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Snow Fall Effect</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="layout-container">
        
        <header class="section-header">
            <h1 class="title">Snow Fall Effect</h1>
            <p class="subtitle">A pure CSS seasonal animation using multiple layered backgrounds and CSS animations to create a continuous, randomized parallax snowfall effect.</p>
        </header>

        <div class="demo-area">
            
            <!-- 
              [TECHNIQUE] Multi-layered Parallax Snow
              We use 3 distinct layers of snow, each animating at different 
              speeds and directions to create a sense of depth and realism.
            -->
            <div class="snow-scene" aria-label="Winter landscape with falling snow">
                
                <!-- Background Environment -->
                <div class="scenery">
                    <div class="moon"></div>
                    <div class="mountain mt-bg"></div>
                    <div class="mountain mt-fg"></div>
                    
                    <!-- Holiday Text (Optional Flair) -->
                    <div class="greeting">
                        <h2>Winter Wonderland</h2>
                        <p>CSS-Only Animation</p>
                    </div>
                </div>
                
                <!-- 
                  The Snow Layers 
                  Foreground is fast/large, middle is medium, background is slow/small.
                -->
                <div class="snow-layer snow-bg"></div>
                <div class="snow-layer snow-mid"></div>
                <div class="snow-layer snow-fg"></div>
                
            </div>
            
        </div>
        
    </div>

</body>
</html>
