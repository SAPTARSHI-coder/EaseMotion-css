<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-vending-machine-dispenser demo</title>
</head>
<body>
<div class="vmd-machine">
  <div class="vmd-glass">
    <div class="vmd-row">
      <b class="vmd-item">CHIPS</b>
      <span class="vmd-price">$1.25</span>
    </div>
    <div class="vmd-row">
      <b class="vmd-item">SODA</b>
      <span class="vmd-price">$2.00</span>
    </div>
    <div class="vmd-row">
      <b class="vmd-item">CANDY</b>
      <span class="vmd-price">$1.50</span>
    </div>
    <div class="vmd-coil"></div>
  </div>
  <div class="vmd-pad">
    <button class="vmd-key">A1</button>
    <button class="vmd-key">B2</button>
    <button class="vmd-key">C3</button>
  </div>
  <div class="vmd-slot">VEND</div>
  <span class="vmd-coin">COIN</span>
</div>
</body>
</html>
