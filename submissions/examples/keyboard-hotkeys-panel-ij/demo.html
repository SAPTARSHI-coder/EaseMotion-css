<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-keyboard-hotkeys-panel</title>
</head>
<body>
<main class="khp-deck">
  <header class="khp-top">
    <h1 class="khp-title">Shortcut Deck</h1>
    <span class="khp-profile">Pro</span>
  </header>
  <section class="khp-mods" aria-label="modifier keys">
    <span class="khp-mod">Ctrl</span>
    <span class="khp-mod">Shift</span>
    <span class="khp-mod">Alt</span>
    <span class="khp-mod">Win</span>
  </section>
  <section class="khp-keys" aria-label="hotkey keys">
    <span class="khp-key">1</span>
    <span class="khp-key">2</span>
    <span class="khp-key">3</span>
    <span class="khp-key">4</span>
    <span class="khp-key">5</span>
    <span class="khp-key">6</span>
    <span class="khp-key">7</span>
    <span class="khp-key">8</span>
    <span class="khp-key">9</span>
    <span class="khp-key">0</span>
  </section>
  <footer class="khp-foot">
    <span class="khp-led"></span>
    <span class="khp-led"></span>
    <span class="khp-led"></span>
    <span class="khp-hint">Num lock off</span>
  </footer>
</main>
</body>
</html>
