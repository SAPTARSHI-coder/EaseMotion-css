<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="EaseMotion CSS Showcase: Bounce-Pulse Navbar for Gaming Hub Layouts" />
  <title>Bounce-Pulse Navbar | EaseMotion CSS</title>
  
  <!-- Core EaseMotion CSS -->
  <link rel="stylesheet" href="../../../easemotion.css" />
  
  <!-- Showcase Specific Styles -->
  <link rel="stylesheet" href="style.css" />
  
  <!-- Premium Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
</head>
<body class="dashboard-body">

  <header class="esports-header ease-slide-down">
    <div class="header-container">
      
      <!-- Logo Area -->
      <a href="#" class="brand-logo ease-fade-in ease-delay-100" aria-label="Nexus Pro Dashboard Home">
        <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <polygon points="12 2 22 8.5 22 15.5 12 22 2 15.5 2 8.5 12 2"></polygon>
          <polyline points="12 22 12 12 22 8.5"></polyline>
          <polyline points="2 8.5 12 12"></polyline>
        </svg>
        <span class="brand-text">NEXUS<span class="highlight">PRO</span></span>
      </a>

      <!-- Primary Navigation with Bounce-Pulse -->
      <nav class="main-nav" aria-label="Main Navigation">
        <ul class="nav-list" role="menubar">
          <li role="none" class="ease-slide-down ease-delay-200">
            <a href="#" class="nav-link" role="menuitem">Overview</a>
          </li>
          
          <li role="none" class="ease-slide-down ease-delay-300">
            <!-- Active Item featuring Bounce-Pulse Interaction -->
            <a href="#" class="nav-link active bounce-pulse" role="menuitem" aria-current="page" aria-label="Tournaments (Active)">
              <span class="nav-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path>
                  <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path>
                  <path d="M4 22h16"></path>
                  <path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"></path>
                  <path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"></path>
                  <path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"></path>
                </svg>
              </span>
              Tournaments
              <span class="active-indicator" aria-hidden="true"></span>
            </a>
          </li>
          
          <li role="none" class="ease-slide-down ease-delay-400">
            <a href="#" class="nav-link" role="menuitem">Leaderboard</a>
          </li>
          
          <li role="none" class="ease-slide-down ease-delay-500">
            <a href="#" class="nav-link" role="menuitem">Armory</a>
          </li>
        </ul>
      </nav>

      <!-- User Profile & Actions -->
      <div class="user-actions ease-fade-in ease-delay-600">
        <button class="btn-icon" aria-label="View Notifications (1 Unread)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
          </svg>
          <span class="badge-dot" aria-hidden="true"></span>
        </button>
        
        <button class="user-profile" aria-haspopup="menu" aria-label="User Menu for ViperX">
          <img src="https://images.unsplash.com/photo-1566492031773-4f4e44671857?auto=format&fit=crop&w=100&h=100&q=80" alt="" class="avatar" aria-hidden="true" />
          <div class="user-info">
            <span class="user-name">ViperX</span>
            <span class="user-rank">Elite</span>
          </div>
        </button>
      </div>
      
    </div>
  </header>
  
  <!-- Page Content -->
  <main class="dashboard-content ease-fade-in ease-delay-600">
    <section class="hero-banner">
      <h1>Welcome back, <span class="highlight">ViperX</span></h1>
      <p>Your next tournament starts in 2 hours. Gear up and prepare for battle.</p>
    </section>
  </main>

</body>
</html>
