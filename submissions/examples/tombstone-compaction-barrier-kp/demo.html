<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tombstone Compaction Barrier</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="compact-shell" aria-labelledby="compact-title">
    <section class="compact-board">
      <p class="eyebrow">Storage reclamation</p>
      <h1 id="compact-title">Tombstone Compaction Barrier</h1>
      <p class="summary">Delete markers wait behind a visibility barrier until lagging replicas are safe, then compaction sweeps reclaimed space.</p>
      <div class="compact-stage" role="img" aria-label="Animated tombstone compaction barrier visualization">
        <div class="log-lane"><span></span><span class="dead"></span><span></span><span class="dead"></span><span></span></div>
        <div class="barrier"><i></i><i></i><i></i><strong>barrier</strong></div>
        <div class="replicas"><b></b><b></b><b></b></div>
        <div class="sweep"><em></em><em></em><em></em></div>
      </div>
      <div class="stats"><span>lag 12ms</span><span>markers 8</span><span>reclaim safe</span></div>
    </section>
  </main>
</body>
</html>
