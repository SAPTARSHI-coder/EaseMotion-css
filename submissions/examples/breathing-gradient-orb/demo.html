<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="A large CSS-only gradient orb with a slow breathing animation."
  >
  <title>CSS Breathing Gradient Orb</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="demo">
    <section
      class="orb-scene"
      aria-labelledby="orb-title"
    >
      <div class="orb-content">
        <p class="eyebrow">EaseMotion CSS</p>

        <h1 id="orb-title">
          Breathing<br>
          Gradient Orb
        </h1>

        <p class="description">
          A slow, ambient CSS animation designed to add depth and motion
          to backgrounds.
        </p>
      </div>

      <div
        class="gradient-orb"
        aria-hidden="true"
      >
        <span class="orb-glow"></span>
        <span class="orb-core"></span>
        <span class="orb-highlight"></span>
      </div>
    </section>
  </main>
</body>
</html>
