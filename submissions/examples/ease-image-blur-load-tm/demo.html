<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Image Blur Load | EaseMotion CSS</title><link rel="stylesheet" href="style.css"></head>
<body><div class="ibl-root">
<div class="ibl-card"><div class="ibl-img-wrap">
<img src="https://picsum.photos/seed/ocean/600/400" class="ibl-img-small" onload="this.classList.add('loaded')" alt="Ocean">
<img src="https://picsum.photos/seed/ocean/600/400" class="ibl-img" onload="this.classList.add('loaded')" alt="Ocean">
</div><div class="ibl-body"><h3 class="ibl-title">Ocean View</h3><p class="ibl-desc">Click to see full image with blur-to-clear effect</p></div></div>
<div class="ibl-card"><div class="ibl-img-wrap">
<img src="https://picsum.photos/seed/mountain/600/400" class="ibl-img-small" onload="this.classList.add('loaded')" alt="Mountain">
<img src="https://picsum.photos/seed/mountain/600/400" class="ibl-img" onload="this.classList.add('loaded')" alt="Mountain">
</div><div class="ibl-body"><h3 class="ibl-title">Mountain Peak</h3><p class="ibl-desc">Progressive image loading with blur reveal</p></div></div>
<div class="ibl-card"><div class="ibl-img-wrap">
<img src="https://picsum.photos/seed/forest/600/400" class="ibl-img-small" onload="this.classList.add('loaded')" alt="Forest">
<img src="https://picsum.photos/seed/forest/600/400" class="ibl-img" onload="this.classList.add('loaded')" alt="Forest">
</div><div class="ibl-body"><h3 class="ibl-title">Forest Path</h3><p class="ibl-desc">Smooth transition from blurred to sharp</p></div></div>
</div></body></html>
