<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ease Bento Box</title>
    <link rel="stylesheet" href="../../../easemotion.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="ease-bento-container">
        
        <!-- Large Hero Cell -->
        <div class="ease-bento-cell cell-hero ease-hover-lift">
            <div class="cell-content">
                <h2>Creative Powerhouse</h2>
                <div class="cell-hidden-reveal ease-fade-in">
                    <p>Unlock endless possibilities with our grid-based component layout system designed for modern apps.</p>
                </div>
            </div>
        </div>

        <!-- Medium Cell 1 -->
        <div class="ease-bento-cell cell-medium-1 ease-hover-lift">
            <div class="cell-content">
                <h3>Analytics</h3>
                <div class="cell-hidden-reveal ease-fade-in">
                    <p>Real-time data visualization at your fingertips.</p>
                </div>
            </div>
        </div>

        <!-- Medium Cell 2 -->
        <div class="ease-bento-cell cell-medium-2 ease-hover-lift">
            <div class="cell-content">
                <h3>Security</h3>
                <div class="cell-hidden-reveal ease-fade-in">
                    <p>Enterprise-grade encryption standard.</p>
                </div>
            </div>
        </div>

        <!-- Small Cell 1 -->
        <div class="ease-bento-cell cell-small-1 ease-hover-lift">
            <div class="cell-content">
                <h4>Fast</h4>
            </div>
        </div>

        <!-- Small Cell 2 -->
        <div class="ease-bento-cell cell-small-2 ease-hover-lift">
            <div class="cell-content">
                <h4>Scalable</h4>
            </div>
        </div>

    </div>
</body>
</html>
