<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Velvet Smooth Transition Card</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Demo container styling */
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f5f5f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    
    @media (prefers-color-scheme: dark) {
      body {
        background-color: #121212;
      }
    }
  </style>
</head>
<body>
  
  <div class="velvet-card">
    <h3 class="velvet-card-title">Velvet Smooth</h3>
    <p class="velvet-card-content">
      Experience the luxurious and velvety smooth transitions in this card component. 
      Hardware accelerated and fully responsive.
    </p>
    <button class="velvet-card-btn">Explore</button>
  </div>

</body>
</html>
