<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Pure CSS Morphing Shape Toast notification component."
  >
  <title>Morphing Shape Toast</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">
    <section class="demo-section">
      <p class="eyebrow">EaseMotion CSS</p>

      <h1>Morphing Shape Toast</h1>

      <p class="description">
        A smooth notification component featuring a continuously morphing
        geometric shape using pure HTML and CSS.
      </p>

      <div class="toast-stage">
        <article class="morph-toast" role="status" aria-live="polite">
          <div class="toast-icon" aria-hidden="true">
            <span>✓</span>
          </div>

          <div class="toast-content">
            <p class="toast-title">Changes saved</p>
            <p class="toast-message">
              Your profile has been updated successfully.
            </p>
          </div>

          <button
            class="toast-close"
            type="button"
            aria-label="Close notification"
          >
            <span aria-hidden="true">&times;</span>
          </button>
        </article>
      </div>
    </section>
  </main>

</body>
</html>
