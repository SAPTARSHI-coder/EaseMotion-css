<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Custom Animated CSS-Only Dropdown</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  
  <div class="demo-wrapper">
    <h1>CSS-Only Animated Dropdown</h1>
    <p>A beautifully animated custom dropdown managed entirely through CSS <code>:focus-within</code> state.</p>
    
    <div class="ease-dropdown-container" tabindex="0">
      <div class="ease-dropdown-button">
        <span class="ease-dropdown-title">Select Category</span>
        <svg class="chevron" viewBox="0 0 24 24" width="20" height="20">
          <path d="M7 10l5 5 5-5" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      
      <ul class="ease-dropdown-list">
        <li class="ease-dropdown-option">
          <input type="radio" id="opt1" name="dropdown-group" class="ease-radio-input" />
          <label for="opt1" class="ease-radio-label">
            <span class="icon">🎨</span> UI/UX Design
          </label>
        </li>
        <li class="ease-dropdown-option">
          <input type="radio" id="opt2" name="dropdown-group" class="ease-radio-input" />
          <label for="opt2" class="ease-radio-label">
            <span class="icon">💻</span> Web Development
          </label>
        </li>
        <li class="ease-dropdown-option">
          <input type="radio" id="opt3" name="dropdown-group" class="ease-radio-input" />
          <label for="opt3" class="ease-radio-label">
            <span class="icon">✨</span> Animations
          </label>
        </li>
        <li class="ease-dropdown-option">
          <input type="radio" id="opt4" name="dropdown-group" class="ease-radio-input" />
          <label for="opt4" class="ease-radio-label">
            <span class="icon">🚀</span> Performance
          </label>
        </li>
      </ul>
    </div>
  </div>

</body>
</html>
