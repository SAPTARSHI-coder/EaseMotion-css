<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Responsive CSS bundle deal card showing combined products and savings."
  >
  <title>CSS Bundle Deal Card</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">
    <article class="bundle-card" aria-labelledby="bundle-title">

      <div class="bundle-badge">Bundle & Save</div>

      <div class="product-stack" aria-label="Included products">
        <div class="product product-one">
          <span class="product-icon" aria-hidden="true">◈</span>
          <span>Starter Kit</span>
        </div>

        <div class="product product-two">
          <span class="product-icon" aria-hidden="true">◆</span>
          <span>Pro Tools</span>
        </div>

        <div class="product product-three">
          <span class="product-icon" aria-hidden="true">✦</span>
          <span>Bonus Pack</span>
        </div>
      </div>

      <div class="bundle-content">
        <span class="eyebrow">Limited Bundle</span>

        <h1 id="bundle-title">Complete Creator Bundle</h1>

        <p>
          Get everything you need in one package and save more
          compared with buying each item separately.
        </p>

        <div class="pricing">
          <span class="old-price">$149</span>
          <span class="current-price">$99</span>
          <span class="save-badge">Save 34%</span>
        </div>

        <div class="bundle-meta">
          <span>3 products included</span>
          <span>•</span>
          <span>Instant access</span>
        </div>

        <button class="bundle-button" type="button">
          Get the Bundle
          <span aria-hidden="true">→</span>
        </button>
      </div>

    </article>
  </main>

</body>
</html>
