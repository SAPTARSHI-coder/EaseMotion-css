<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive 3D Flip Card Profile Demo</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            margin: 0;
            height: 100vh;
            background-color: #f1f5f9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>
    <div class="ease-flip-card">
        <div class="ease-flip-card-inner">
            <!-- Front of the Card -->
            <div class="ease-flip-card-front">
                <img src="https://ui-avatars.com/api/?name=John+Doe&background=random&size=128" alt="Profile Picture">
                <h2>John Doe</h2>
                <p>Frontend Developer</p>
            </div>
            
            <!-- Back of the Card -->
            <div class="ease-flip-card-back">
                <h3>About Me</h3>
                <p>Passionate UI/UX developer focused on creating smooth, interactive, and highly performant web experiences.</p>
                <button style="margin-top: 15px; padding: 8px 16px; background: white; color: #6366f1; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">Contact</button>
            </div>
        </div>
    </div>
</body>
</html>
