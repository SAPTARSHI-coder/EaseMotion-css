<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shard Rebalancing Rings</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="advanced-shell" aria-labelledby="advanced-title">
    <section class="advanced-panel">
      <p class="eyebrow">cluster migration</p>
      <h1 id="advanced-title">Shard Rebalancing Rings</h1>
      <p class="summary">A CSS animation that moves hot partitions across shard rings while replicas catch up and load stabilizes.</p>
      <div class="stage" role="img" aria-label="Animated Shard Rebalancing Rings visualization">
        <div class="halo halo-one"></div>
        <div class="halo halo-two"></div>
        <article class="tile tile-a"><strong>01</strong><span>hot shard found</span></article>
        <article class="tile tile-b"><strong>02</strong><span>replicas synced</span></article>
        <article class="tile tile-c"><strong>03</strong><span>load balanced</span></article>
        <div class="lane lane-ab"><i></i></div>
        <div class="lane lane-bc"><i></i></div>
        <div class="lane lane-ca"><i></i></div>
        <div class="resolution">load balanced</div>
      </div>
      <div class="status-grid" aria-label="Shard Rebalancing Rings status">
        <span>hot shard found</span>
        <span>replicas synced</span>
        <span>load balanced</span>
      </div>
    </section>
  </main>
</body>
</html>
