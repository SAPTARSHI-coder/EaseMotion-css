<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Toast Notifications</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Container to align notifications at the bottom right -->
    <div class="toast-container">
        
        <!-- Success Toast -->
        <div class="toast toast-success">
            <span class="toast-icon">✓</span>
            <div class="toast-message">Changes saved successfully!</div>
        </div>

        <!-- Error Toast -->
        <div class="toast toast-error">
            <span class="toast-icon">✕</span>
            <div class="toast-message">Failed to save changes. Please try again.</div>
        </div>

        <!-- Warning Toast -->
        <div class="toast toast-warning">
            <span class="toast-icon">⚠</span>
            <div class="toast-message">Your session is about to expire.</div>
        </div>

        <!-- Info Toast -->
        <div class="toast toast-info">
            <span class="toast-icon">ℹ</span>
            <div class="toast-message">A new software update is available.</div>
        </div>

    </div>
</body>
</html>
