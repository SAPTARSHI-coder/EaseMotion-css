<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-loading-skeleton-card demo</title>
</head>
<body>
<div class="lsc-card">
  <div class="lsc-thumb"></div>
  <div class="lsc-row">
    <span class="lsc-avatar"></span>
    <div class="lsc-cols">
      <i class="lsc-line lsc-long"></i>
      <i class="lsc-line lsc-mid"></i>
      <i class="lsc-line lsc-short"></i>
    </div>
  </div>
  <div class="lsc-actions">
    <button class="lsc-primary">LOADING</button>
    <button class="lsc-ghost">...</button>
  </div>
</div>
</body>
</html>
