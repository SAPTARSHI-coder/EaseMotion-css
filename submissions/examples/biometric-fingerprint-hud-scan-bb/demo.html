<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Biometric Fingerprint HUD Scanner - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="hud-container">
    <div class="hud-header">
      <div class="status-indicator">
        <span class="pulse-dot"></span>
        <span class="status-text">SECURE SYSTEM ONLINE</span>
      </div>
      <h1 class="hud-title">BIOMETRIC AUTHENTICATION</h1>
      <p class="hud-subtitle">GSSoC 2026 Advanced Motion Showcase</p>
    </div>

    <div class="scanner-card">
      <div class="card-glow"></div>
      
      <!-- Target reticle framing -->
      <div class="reticle reticle-tl"></div>
      <div class="reticle reticle-tr"></div>
      <div class="reticle reticle-bl"></div>
      <div class="reticle reticle-br"></div>

      <!-- Main Scanner Interface -->
      <div class="scanner-viewport">
        <!-- Concentric HUD Rings -->
        <div class="hud-ring outer-ring"></div>
        <div class="hud-ring middle-ring"></div>
        <div class="hud-ring inner-ring"></div>
        
        <!-- Rotating Radar Sweep Line -->
        <div class="radar-sweep"></div>

        <!-- Biometric Fingerprint Core SVG -->
        <div class="fingerprint-wrapper">
          <svg class="fingerprint-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M 50 15 C 30 15 15 30 15 50 C 15 65 25 80 35 85" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" class="ridge ridge-1" />
            <path d="M 50 23 C 35 23 23 35 23 50 C 23 68 32 78 42 82" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" class="ridge ridge-2" />
            <path d="M 50 31 C 40 31 31 40 31 50 C 31 62 38 72 50 72" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" class="ridge ridge-3" />
            <path d="M 50 39 C 44 39 39 44 39 50 C 39 58 45 64 50 64 C 55 64 61 58 61 50 C 61 40 70 31 80 31" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" class="ridge ridge-4" />
            <path d="M 65 85 C 75 80 85 65 85 50 C 85 30 70 15 50 15" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" class="ridge ridge-5" />
            <path d="M 58 78 C 68 74 77 65 77 50 C 77 35 65 23 50 23" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" class="ridge ridge-6" />
            <path d="M 50 50 M 50 45 C 47 45 45 47 45 50 C 45 53 47 55 50 55 C 53 55 55 53 55 50" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" class="ridge ridge-center" />
          </svg>
          <!-- Horizontal Laser Beam Scanner -->
          <div class="laser-beam"></div>
        </div>

        <!-- Scanning Particles Overlay -->
        <div class="scan-grid-overlay"></div>
      </div>

      <!-- Telemetry Data Readout Panel -->
      <div class="telemetry-panel">
        <div class="telemetry-item">
          <span class="telemetry-label">MATCH CONFIDENCE</span>
          <span class="telemetry-value text-cyan">99.84%</span>
        </div>
        <div class="telemetry-item">
          <span class="telemetry-label">ENCRYPTION</span>
          <span class="telemetry-value text-green">AES-256-GCM</span>
        </div>
        <div class="telemetry-item">
          <span class="telemetry-label">MINUTIAE POINTS</span>
          <span class="telemetry-value text-purple">128 DETECTED</span>
        </div>
      </div>

      <div class="scan-status-message">
        <span class="scanning-text">HOLD FINGER ON SCANNER TO VERIFY...</span>
      </div>
    </div>
  </div>
</body>
</html>
