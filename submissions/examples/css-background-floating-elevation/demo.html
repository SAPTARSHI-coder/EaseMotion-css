<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Background: Floating Elevation - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="em-float-page">
        <!-- Background Floating Elevation Animation Layer -->
        <div class="em-float-bg" aria-hidden="true">
            <span class="em-float-shape em-shape-1" style="--d:0s;"></span>
            <span class="em-float-shape em-shape-2" style="--d:1.5s;"></span>
            <span class="em-float-shape em-shape-3" style="--d:3s;"></span>
        </div>

        <div class="em-card" role="region" aria-label="Floating Elevation Background Showcase" tabindex="0">
            <span class="em-card-badge">BACKGROUND ANIMATIONS</span>
            <h1 class="em-card-title">Floating Elevation</h1>
            <p class="em-card-desc">A smooth, hardware-accelerated pure CSS background animation featuring dynamic floating elevation cards and dark mode compatibility.</p>
            <a href="#" class="em-card-btn" role="button">Explore Effects</a>
        </div>
    </div>
</body>
</html>
