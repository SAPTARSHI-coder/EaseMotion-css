<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aqueduct Water Arch — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Aqueduct Water Arch demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Aqueduct Water Arch</h1>
      <p class="lede">Roman aqueduct arches carrying a flowing water channel</p>
    </header>

    <section class="ease-aqueduct-water-arch" data-demo="aqueduct-water-arch" aria-live="polite">
      <div class="ease-aqueduct-water-arch__housing">
        <div class="ease-aqueduct-water-arch__bezel">
          <div class="ease-aqueduct-water-arch__face">
            <div class="ease-aqueduct-water-arch__readout">
              <span class="ease-aqueduct-water-arch__label">Aqueduct Water Arch</span>
              <span class="ease-aqueduct-water-arch__value">LIVE</span>
            </div>
            <div class="ease-aqueduct-water-arch__motion" aria-hidden="true">
              <span class="ease-aqueduct-water-arch__a"></span>
              <span class="ease-aqueduct-water-arch__b"></span>
              <span class="ease-aqueduct-water-arch__c"></span>
              <span class="ease-aqueduct-water-arch__d"></span>
            </div>
            <div class="ease-aqueduct-water-arch__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-aqueduct-water-arch__controls">
          <button type="button" class="ease-aqueduct-water-arch__btn primary">Engage</button>
          <button type="button" class="ease-aqueduct-water-arch__btn">Reset</button>
          <label class="ease-aqueduct-water-arch__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-aqueduct-water-arch__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
