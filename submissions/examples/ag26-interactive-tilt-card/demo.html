<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Tilt Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="tilt-container">
        <!-- A 3x3 grid of hidden hover areas -->
        <div class="tilt-zone top-left"></div>
        <div class="tilt-zone top-mid"></div>
        <div class="tilt-zone top-right"></div>
        
        <div class="tilt-zone mid-left"></div>
        <div class="tilt-zone mid-mid"></div>
        <div class="tilt-zone mid-right"></div>
        
        <div class="tilt-zone bot-left"></div>
        <div class="tilt-zone bot-mid"></div>
        <div class="tilt-zone bot-right"></div>
        
        <!-- The actual card -->
        <div class="tilt-card">
            <h3>Hover Around</h3>
            <p>I will tilt towards your mouse purely using CSS grid zones!</p>
        </div>
    </div>
</body>
</html>
