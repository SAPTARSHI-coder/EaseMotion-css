<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rotate-Fade Modal - Product Catalog</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>Premium Product Collection</h1>
    <p>Click below to preview our featured product.</p>

    <label for="modal-toggle" class="open-btn">
        View Product
    </label>
</div>

<input type="checkbox" id="modal-toggle">

<div class="overlay">

    <div class="modal">

        <label for="modal-toggle" class="close-btn">&times;</label>

        <div class="product-image">
            <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=600" alt="Product">
        </div>

        <div class="product-content">
            <h2>Smart Runner Shoes</h2>

            <p>
                Lightweight premium sneakers designed with breathable
                mesh, superior comfort and elegant modern styling.
            </p>

            <div class="price">
                ₹4,999
            </div>

            <button>Add to Cart</button>

        </div>

    </div>

</div>

</body>
</html>
