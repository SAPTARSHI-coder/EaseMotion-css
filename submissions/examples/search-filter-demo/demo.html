<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EaseMotion — Search with Filters</title>
  <link rel="stylesheet" href="../../core/variables.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="demo-container">
    <h1>Search with Filters</h1>
    <p>Searchable list with tag-based filtering.</p>

    <div class="search-card">
      <div class="ease-field">
        <input type="text" class="ease-input" id="searchInput" placeholder="Search items..." oninput="filterItems()">
      </div>
      <div class="filter-tags" id="tags">
        <button class="tag active" onclick="toggleTag(this, 'all')">All</button>
        <button class="tag" onclick="toggleTag(this, 'design')">Design</button>
        <button class="tag" onclick="toggleTag(this, 'code')">Code</button>
        <button class="tag" onclick="toggleTag(this, 'docs')">Docs</button>
      </div>
      <ul class="item-list" id="itemList">
        <li data-category="design">UI Component Library</li>
        <li data-category="code">API Integration</li>
        <li data-category="docs">Getting Started Guide</li>
        <li data-category="design">Color Palette Generator</li>
        <li data-category="code">Authentication Module</li>
        <li data-category="docs">API Reference</li>
        <li data-category="design">Icon Set</li>
        <li data-category="code">Database Schema</li>
      </ul>
      <p class="empty-state" id="emptyState" style="display:none">No items match your search.</p>
    </div>
  </div>
  <script>
    let activeFilter = 'all';
    function toggleTag(btn, category) {
      document.querySelectorAll('.tag').forEach(t => t.classList.remove('active'));
      btn.classList.add('active');
      activeFilter = category;
      filterItems();
    }
    function filterItems() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const items = document.querySelectorAll('#itemList li');
      let visible = 0;
      items.forEach(item => {
        const matchSearch = item.textContent.toLowerCase().includes(query);
        const matchFilter = activeFilter === 'all' || item.dataset.category === activeFilter;
        const show = matchSearch && matchFilter;
        item.style.display = show ? '' : 'none';
        if (show) visible++;
      });
      document.getElementById('emptyState').style.display = visible === 0 ? '' : 'none';
    }
  </script>
</body>
</html>
