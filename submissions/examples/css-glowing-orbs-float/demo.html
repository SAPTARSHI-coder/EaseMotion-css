<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="CSS-only glowing orbs floating background animation"
  >
  <title>CSS Glowing Orbs Float</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="orb-scene" aria-label="Glowing floating orbs animation">
    <div class="orb orb-1" aria-hidden="true"></div>
    <div class="orb orb-2" aria-hidden="true"></div>
    <div class="orb orb-3" aria-hidden="true"></div>
    <div class="orb orb-4" aria-hidden="true"></div>
    <div class="orb orb-5" aria-hidden="true"></div>
    <div class="orb orb-6" aria-hidden="true"></div>

    <section class="content">
      <p class="eyebrow">Pure CSS Animation</p>
      <h1>Glowing Orbs</h1>
      <p>
        Multiple luminous orbs slowly float through the background
        using CSS animations only.
      </p>
    </section>
  </main>
</body>
</html>
