<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="CSS-only galaxy warp background animation"

      <span class="star star-12"></span>
      <span class="star star-13"></span>
      <span class="star star-14"></span>
      <span class="star star-15"></span>
      <span class="star star-16"></span>
      <span class="star star-17"></span>
      <span class="star star-18"></span>
      <span class="star star-19"></span>
      <span class="star star-20"></span>
    </div>

    <section class="hero-content">
      <p class="eyebrow">CSS Animation</p>
      <h1>Galaxy Warp</h1>
      <p>
        Travel through a CSS-only hyperspace effect where stars

</html>
