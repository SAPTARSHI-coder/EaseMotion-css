<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Northern Lights – Wavy Aurora Effect</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <h1>🌌 Northern Lights</h1>
    <p class="subtitle">Wavy aurora effect dancing across the canvas</p>

    <div class="aurora-container">
      <canvas id="canvas"></canvas>
      
      <!-- Overlay info -->
      <div class="info-overlay">
        <span class="aurora-status" id="auroraStatus">🌌 Dancing</span>
        <span class="intensity-label" id="intensityLabel">Intensity: 50%</span>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <button class="ctrl-btn toggle" id="toggleBtn">⏸ Pause</button>
      <button class="ctrl-btn color" id="colorBtn">🎨 Colors</button>
      <button class="ctrl-btn wave" id="waveBtn">🌊 Wave</button>
      <button class="ctrl-btn reset" id="resetBtn">↺ Reset</button>
    </div>

    <!-- Sliders -->
    <div class="slider-container">
      <span class="slider-label">Intensity</span>
      <input type="range" id="intensitySlider" min="10" max="100" value="50" />
      <span class="slider-value" id="intensityValue">50%</span>
    </div>

    <div class="slider-container">
      <span class="slider-label">Speed</span>
      <input type="range" id="speedSlider" min="1" max="10" value="5" />
      <span class="slider-value" id="speedValue">5×</span>
    </div>

    <div class="slider-container">
      <span class="slider-label">Wavelength</span>
      <input type="range" id="waveSlider" min="1" max="10" value="5" />
      <span class="slider-value" id="waveValue">5×</span>
    </div>

    <div class="slider-container">
      <span class="slider-label">Layers</span>
      <input type="range" id="layersSlider" min="2" max="8" value="4" />
      <span class="slider-value" id="layersValue">4</span>
    </div>

    <!-- Status -->
    <div class="status" id="status">🌌 Northern lights dancing across the sky</div>

    <!-- Keyboard shortcuts -->
    <div class="shortcuts">
      <kbd>Space</kbd> Pause · <kbd>C</kbd> Colors · <kbd>W</kbd> Wave · <kbd>R</kbd> Reset
    </div>
  </div>

  <script>
    (function() {
      "use strict";

      // DOM elements
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      const auroraStatus = document.getElementById('auroraStatus');
      const intensityLabel = document.getElementById('intensityLabel');
      const toggleBtn = document.getElementById('toggleBtn');
      const colorBtn = document.getElementById('colorBtn');
      const waveBtn = document.getElementById('waveBtn');
      const resetBtn = document.getElementById('resetBtn');
      const status = document.getElementById('status');
      const intensitySlider = document.getElementById('intensitySlider');
      const intensityValue = document.getElementById('intensityValue');
      const speedSlider = document.getElementById('speedSlider');
      const speedValue = document.getElementById('speedValue');
      const waveSlider = document.getElementById('waveSlider');
      const waveValue = document.getElementById('waveValue');
      const layersSlider = document.getElementById('layersSlider');
      const layersValue = document.getElementById('layersValue');

      // State
      let isPaused = false;
      let animationId = null;
      let time = 0;
      let colorScheme = 0;
      let wavePhase = 0;
      let stars = [];

      // Color schemes
      const COLOR_SCHEMES = [
        { name: 'Classic Green', colors: ['#00ff87', '#60efff', '#00b4d8', '#0077b6', '#90e0ef'] },
        { name: 'Aurora Borealis', colors: ['#00ff87', '#60efff', '#00b4d8', '#7209b7', '#f72585'] },
        { name: 'Pink Dream', colors: ['#ff6b9d', '#f72585', '#b5179e', '#7209b7', '#3a0ca3'] },
        { name: 'Electric Blue', colors: ['#4cc9f0', '#4361ee', '#3f37c9', '#7209b7', '#00b4d8'] },
        { name: 'Sunset Aurora', colors: ['#f72585', '#ff6b6b', '#fca311', '#ffd60a', '#00b4d8'] },
        { name: 'Mystic Purple', colors: ['#b5179e', '#7209b7', '#560bad', '#3a0ca3', '#480ca8'] },
        { name: 'Arctic Ice', colors: ['#00ff87', '#60efff', '#caf0f8', '#ade8f4', '#90e0ef'] },
        { name: 'Fire & Ice', colors: ['#ff6b6b', '#fca311', '#ffd60a', '#4cc9f0', '#4361ee'] }
      ];

      // ----- Canvas setup -----
      function setupCanvas() {
        const rect = canvas.parentElement.getBoundingClientRect();
        const size = Math.min(rect.width - 40, 600);
        canvas.width = size;
        canvas.height = size;
        canvas.style.width = size + 'px';
        canvas.style.height = size + 'px';
        generateStars();
      }

      // ----- Generate stars -----
      function generateStars() {
        stars = [];
        const count = 50 + Math.floor(Math.random() * 50);
        for (let i = 0; i < count; i++) {
          stars.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            size: 0.5 + Math.random() * 1.5,
            twinkle: Math.random() * Math.PI * 2,
            speed: 0.02 + Math.random() * 0.03
          });
        }
      }

      // ----- Draw aurora -----
      function drawAurora() {
        const w = canvas.width;
        const h = canvas.height;
        const intensity = parseInt(intensitySlider.value) / 100;
        const speed = parseInt(speedSlider.value) / 5;
        const wavelength = parseInt(waveSlider.value) / 5;
        const layers = parseInt(layersSlider.value);
        const colors = COLOR_SCHEMES[colorScheme].colors;

        // Clear with dark background
        ctx.clearRect(0, 0, w, h);

        // Deep space background
        const bgGradient = ctx.createLinearGradient(0, 0, 0, h);
        bgGradient.addColorStop(0, '#050510');
        bgGradient.addColorStop(0.3, '#080818');
        bgGradient.addColorStop(0.7, '#0a0a1a');
        bgGradient.addColorStop(1, '#0a0a1a');
        ctx.fillStyle = bgGradient;
        ctx.fillRect(0, 0, w, h);

        // Draw stars
        stars.forEach(star => {
          const twinkle = 0.5 + 0.5 * Math.sin(time * star.speed + star.twinkle);
          const alpha = 0.2 + 0.8 * twinkle;
          ctx.fillStyle = `rgba(255, 255, 255, ${alpha * 0.6})`;
          ctx.beginPath();
          ctx.arc(star.x, star.y, star.size * twinkle, 0, Math.PI * 2);
          ctx.fill();
        });

        // Draw aurora layers
        for (let layer = 0; layer < layers; layer++) {
          const layerOffset = layer / layers;
          const yBase = h * (0.2 + layerOffset * 0.5);
          const height = h * (0.15 + layerOffset * 0.25) * intensity;
          const width = w * (0.7 + layerOffset * 0.3);
          const alpha = (0.15 + layerOffset * 0.15) * intensity;
          const color = colors[layer % colors.length];

          // Create aurora wave path
          ctx.beginPath();
          
          const segments = 80;
          const phase = time * speed * (0.5 + layerOffset * 0.5) + wavePhase;
          const waveAmp = height * (0.3 + layerOffset * 0.3) * wavelength;

          // Top edge
          for (let i = 0; i <= segments; i++) {
            const t = i / segments;
            const x = (w - width) / 2 + t * width;
            
            // Multiple wave frequencies for realistic aurora
            const wave1 = Math.sin(t * 8 * wavelength + phase * 0.5) * waveAmp * 0.5;
            const wave2 = Math.sin(t * 5 * wavelength + phase * 0.3 + 1.2) * waveAmp * 0.3;
            const wave3 = Math.sin(t * 12 * wavelength + phase * 0.7 + 0.8) * waveAmp * 0.2;
            const wave4 = Math.sin(t * 3 * wavelength + phase * 0.2 + 2.1) * waveAmp * 0.4;
            
            const y = yBase + wave1 + wave2 + wave3 + wave4;
            
            if (i === 0) {
              ctx.moveTo(x, y);
            } else {
              ctx.lineTo(x, y);
            }
          }

          // Bottom edge (follow top with offset)
          const bottomOffset = height * (0.5 + layerOffset * 0.3);
          for (let i = segments; i >= 0; i--) {
            const t = i / segments;
            const x = (w - width) / 2 + t * width;
            
            const wave1 = Math.sin(t * 8 * wavelength + phase * 0.5 + 0.5) * waveAmp * 0.4;
            const wave2 = Math.sin(t * 5 * wavelength + phase * 0.3 + 1.7) * waveAmp * 0.2;
            const wave3 = Math.sin(t * 12 * wavelength + phase * 0.7 + 1.3) * waveAmp * 0.15;
            
            const y = yBase + bottomOffset + wave1 + wave2 + wave3;
            
            ctx.lineTo(x, y);
          }

          ctx.closePath();

          // Fill with gradient
          const grad = ctx.createLinearGradient(0, yBase - height, 0, yBase + height + bottomOffset);
          const gradColor = color;
          const opacity = alpha;
          
          // Extract RGB from hex
          const hex = gradColor.replace('#', '');
          const r = parseInt(hex.substring(0, 2), 16);
          const g = parseInt(hex.substring(2, 4), 16);
          const b = parseInt(hex.substring(4, 6), 16);
          
          grad.addColorStop(0, `rgba(${r}, ${g}, ${b}, ${opacity * 0.1})`);
          grad.addColorStop(0.3, `rgba(${r}, ${g}, ${b}, ${opacity * 0.6})`);
          grad.addColorStop(0.5, `rgba(${r}, ${g}, ${b}, ${opacity * 0.9})`);
          grad.addColorStop(0.7, `rgba(${r}, ${g}, ${b}, ${opacity * 0.6})`);
          grad.addColorStop(1, `rgba(${r}, ${g}, ${b}, ${opacity * 0.1})`);
          
          ctx.fillStyle = grad;
          ctx.fill();

          // Glow effect
          const glowGrad = ctx.createRadialGradient(w/2, yBase, 0, w/2, yBase, width * 0.5);
          glowGrad.addColorStop(0, `rgba(${r}, ${g}, ${b}, ${opacity * 0.05})`);
          glowGrad.addColorStop(1, `rgba(${r}, ${g}, ${b}, 0)`);
          ctx.fillStyle = glowGrad;
          ctx.fillRect(0, 0, w, h);

          // Vertical light rays (aurora streaks)
          if (layer % 2 === 0 && intensity > 0.3) {
            const streakCount = 5 + Math.floor(intensity * 10);
            for (let i = 0; i < streakCount; i++) {
              const t = (i + layer * 0.5) / streakCount;
              const x = (w - width) * 0.3 + t * width * 0.7;
              const streakHeight = height * (0.3 + Math.random() * 0.5);
              const streakAlpha = (0.05 + Math.random() * 0.1) * intensity;
              
              const grad2 = ctx.createLinearGradient(0, yBase - streakHeight, 0, yBase + streakHeight);
              grad2.addColorStop(0, `rgba(${r}, ${g}, ${b}, 0)`);
              grad2.addColorStop(0.5, `rgba(${r}, ${g}, ${b}, ${streakAlpha})`);
              grad2.addColorStop(1, `rgba(${r}, ${g}, ${b}, 0)`);
              
              ctx.fillStyle = grad2;
              ctx.fillRect(x - 2, yBase - streakHeight, 4, streakHeight * 2);
            }
          }
        }

        // Horizon glow
        const horizonGrad = ctx.createRadialGradient(w/2, h, 0, w/2, h, h * 0.4);
        const colors2 = COLOR_SCHEMES[colorScheme].colors;
        const col = colors2[0];
        const hex2 = col.replace('#', '');
        const r2 = parseInt(hex2.substring(0, 2), 16);
        const g2 = parseInt(hex2.substring(2, 4), 16);
        const b2 = parseInt(hex2.substring(4, 6), 16);
        horizonGrad.addColorStop(0, `rgba(${r2}, ${g2}, ${b2}, ${0.03 * intensity})`);
        horizonGrad.addColorStop(1, `rgba(${r2}, ${g2}, ${b2}, 0)`);
        ctx.fillStyle = horizonGrad;
        ctx.fillRect(0, 0, w, h);

        // Update status
        intensityLabel.textContent = `Intensity: ${Math.round(intensity * 100)}%`;
      }

      // ----- Animation loop -----
      function animate() {
        time += 0.016;

        if (!isPaused) {
          wavePhase += 0.005 * parseInt(speedSlider.value) / 5;
        }

        drawAurora();
        animationId = requestAnimationFrame(animate);
      }

      // ----- Start animation -----
      function startAnimation() {
        if (animationId) {
          cancelAnimationFrame(animationId);
        }
        animate();
      }

      // ----- Toggle pause -----
      function togglePause() {
        isPaused = !isPaused;
        toggleBtn.textContent = isPaused ? '▶ Play' : '⏸ Pause';
        auroraStatus.textContent = isPaused ? '⏸ Paused' : '🌌 Dancing';
        status.textContent = isPaused ? '⏸ Aurora paused' : '🌌 Northern lights dancing across the sky';
      }

      // ----- Cycle colors -----
      function cycleColors() {
        colorScheme = (colorScheme + 1) % COLOR_SCHEMES.length;
        const scheme = COLOR_SCHEMES[colorScheme];
        status.textContent = `🎨 Colors: ${scheme.name}`;
        auroraStatus.textContent = `🎨 ${scheme.name}`;
        setTimeout(() => {
          auroraStatus.textContent = '🌌 Dancing';
        }, 1500);
      }

      // ----- Wave effect toggle -----
      function toggleWave() {
        wavePhase += 0.5;
        status.textContent = '🌊 Wave pulse!';
        setTimeout(() => {
          status.textContent = '🌌 Northern lights dancing across the sky';
        }, 1000);
      }

      // ----- Reset -----
      function resetAurora() {
        intensitySlider.value = 50;
        speedSlider.value = 5;
        waveSlider.value = 5;
        layersSlider.value = 4;
        intensityValue.textContent = '50%';
        speedValue.textContent = '5×';
        waveValue.textContent = '5×';
        layersValue.textContent = '4';
        colorScheme = 0;
        wavePhase = 0;
        isPaused = false;
        toggleBtn.textContent = '⏸ Pause';
        auroraStatus.textContent = '🌌 Dancing';
        status.textContent = '↺ Aurora reset';
        generateStars();
      }

      // ----- Event Listeners -----
      toggleBtn.addEventListener('click', togglePause);
      colorBtn.addEventListener('click', cycleColors);
      waveBtn.addEventListener('click', toggleWave);
      resetBtn.addEventListener('click', resetAurora);

      intensitySlider.addEventListener('input', (e) => {
        intensityValue.textContent = e.target.value + '%';
      });

      speedSlider.addEventListener('input', (e) => {
        speedValue.textContent = e.target.value + '×';
      });

      waveSlider.addEventListener('input', (e) => {
        waveValue.textContent = e.target.value + '×';
      });

      layersSlider.addEventListener('input', (e) => {
        layersValue.textContent = e.target.value;
      });

      // Keyboard shortcuts
      document.addEventListener('keydown', (e) => {
        if (e.key === ' ' || e.key === 'Space') {
          e.preventDefault();
          togglePause();
        }
        if (e.key === 'c' || e.key === 'C') {
          e.preventDefault();
          cycleColors();
        }
        if (e.key === 'w' || e.key === 'W') {
          e.preventDefault();
          toggleWave();
        }
        if (e.key === 'r' || e.key === 'R') {
          e.preventDefault();
          resetAurora();
        }
      });

      // Click on canvas to wave
      canvas.addEventListener('click', toggleWave);

      // ----- Resize handler -----
      let resizeTimeout;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(() => {
          setupCanvas();
        }, 200);
      });

      // ----- Init -----
      function init() {
        setupCanvas();
        startAnimation();
        status.textContent = '🌌 Northern lights dancing across the sky — click to wave!';
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }

    })();
  </script>
</body>
</html>
