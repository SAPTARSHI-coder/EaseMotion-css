<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Holographic 3D Credit Card Component - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="holo-card-container">
    <div class="holo-card">
      <div class="shimmer-glare"></div>
      
      <div class="card-chip"></div>
      
      <div class="card-brand">NEO_PAY</div>
      
      <div class="card-number">4532 •••• •••• 8890</div>
      
      <div class="card-details">
        <div class="detail-group">
          <span class="label">CARD HOLDER</span>
          <span class="value">ALEX R. VANCE</span>
        </div>
        <div class="detail-group">
          <span class="label">EXPIRES</span>
          <span class="value">08/29</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
