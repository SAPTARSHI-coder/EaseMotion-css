<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teleportation Latency Monitors QTLM - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css"></head><body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030712; color: #ffffff;">

    <div class="ease-card ease-card-glass qtlm-container">
        <div class="qtlm-header">
            <h2>Teleportation Latency Monitor</h2>
            <span class="ease-badge ease-badge-success">Fault-Tolerant Quantum</span>
        </div>
        
        <div class="qtlm-screen ease-center">
            <div class="qtlm-flux flux-qtlm-a"></div>
            <div class="qtlm-flux flux-qtlm-b"></div>
            <div class="qtlm-boundary-ring"></div>
            <div class="qtlm-core ease-center"></div>
        </div>

        <div class="qtlm-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Real-time Propagation Timing &amp; Classical Feedforward Delay</span>
            <button class="ease-btn ease-btn-success ease-btn-sm ease-hover-grow">Run Latency Monitor</button>
        </div>
    </div></body></html>
