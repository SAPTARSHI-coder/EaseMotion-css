<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slide-Up Modal</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<input type="checkbox" id="modal-toggle" hidden>

<section class="hero">

<h1>Product Catalog</h1>

<p>
CSS Slide-Up Modal built using pure HTML & CSS.
</p>

<label for="modal-toggle" class="open-btn">
Quick View Product
</label>

</section>

<div class="overlay">

<div class="modal">

<label for="modal-toggle" class="close-btn">
✕
</label>

<div class="product-image">

📱

</div>

<h2>Smartphone Ultra</h2>

<p class="price">

₹59,999

</p>

<p class="description">

Experience flagship performance with AI camera, AMOLED display,
5G connectivity and all-day battery life.

</p>

<div class="features">

<span>AI Camera</span>

<span>AMOLED</span>

<span>5G</span>

<span>5000mAh</span>

</div>

<div class="actions">

<button class="secondary-btn">
Wishlist
</button>

<button class="primary-btn">
Buy Now
</button>

</div>

</div>

<label for="modal-toggle" class="backdrop"></label>

</div>

</body>

</html>
