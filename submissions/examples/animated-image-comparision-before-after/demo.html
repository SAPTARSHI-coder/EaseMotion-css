<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EaseMotion CSS - Compare Slider</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="compare-container">

    <img
        src="before.jpg"
        class="before"
        alt="Before Image"
    >

    <div class="after-wrapper">

        <img
            src="after.jpg"
            class="after"
            alt="After Image"
        >

    </div>

    <input
        type="range"
        min="0"
        max="100"
        value="50"
        class="slider"
    >

</div>

<script>

const slider=document.querySelector(".slider");

const after=document.querySelector(".after-wrapper");

slider.addEventListener("input",()=>{

    after.style.width=slider.value+"%";

});

</script>

</body>
</html>
