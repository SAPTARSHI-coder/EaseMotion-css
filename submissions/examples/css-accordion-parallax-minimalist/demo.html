<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parallax Accordion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="px-accordion">
        <div class="px-item">
            <input type="radio" name="px-acc" id="px1" checked>
            <label class="px-title" for="px1">Motion Design</label>
            <div class="px-content">
                <p>Pure CSS parallax effects driven by staggered transform translations.</p>
            </div>
        </div>
        <div class="px-item">
            <input type="radio" name="px-acc" id="px2">
            <label class="px-title" for="px2">Clean Aesthetics</label>
            <div class="px-content">
                <p>Stripped down monochrome styling focusing entirely on typography and movement.</p>
            </div>
        </div>
    </div>
</body>
</html>
