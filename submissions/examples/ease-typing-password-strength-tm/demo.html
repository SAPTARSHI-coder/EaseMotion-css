<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Password Strength | EaseMotion CSS</title><link rel="stylesheet" href="style.css"></head>
<body><div class="psm-root">
<div class="psm-card">
<div class="psm-field"><label class="psm-label">Password</label><input type="password" class="psm-input" id="pwd" placeholder="Enter password" oninput="updateStrength(this.value)"></div>
<div class="psm-strength"><div class="psm-bar"><div class="psm-fill" id="fill"></div></div><div class="psm-bar"><div class="psm-fill" id="fill2"></div></div><div class="psm-bar"><div class="psm-fill" id="fill3"></div></div></div>
<p class="psm-text w0" id="msg">Enter a password to check strength</p>
</div></div>
<script>
function updateStrength(v){
  const f=document.getElementById('fill'),f2=document.getElementById('fill2'),f3=document.getElementById('fill3'),m=document.getElementById('msg');
  const cls=['w0','w1','w2','w3'];
  [f,f2,f3].forEach(x=>cls.forEach(c=>x.classList.remove(c)));
  m.className='psm-text '+cls[0];
  if(v.length===0){m.textContent='Enter a password to check strength';return}
  let s=0;
  if(v.length>=8)s++;
  if(/[A-Z]/.test(v))s++;
  if(/[0-9]/.test(v))s++;
  if(/[^A-Za-z0-9]/.test(v))s++;
  const labels=['Too short','Weak','Medium','Strong'];
  const n=Math.max(1,s);
  m.textContent=labels[n-1];
  m.className='psm-text w'+n;
  if(n>=1)f.classList.add('w1');
  if(n>=2)f2.classList.add('w2');
  if(n>=3)f3.classList.add('w3');
}
</script>
</body></html>
