<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gimbal Gyro Stabilize — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Gimbal Gyro Stabilize demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Gimbal Gyro Stabilize</h1>
      <p class="lede">Three-axis gimbal keeping a platform level</p>
    </header>

    <section class="ease-gimbal-gyro-stabilize" data-demo="gimbal-gyro-stabilize" aria-live="polite">
      <div class="ease-gimbal-gyro-stabilize__housing">
        <div class="ease-gimbal-gyro-stabilize__bezel">
          <div class="ease-gimbal-gyro-stabilize__face">
            <div class="ease-gimbal-gyro-stabilize__readout">
              <span class="ease-gimbal-gyro-stabilize__label">Gimbal Gyro Stabilize</span>
              <span class="ease-gimbal-gyro-stabilize__value">LIVE</span>
            </div>
            <div class="ease-gimbal-gyro-stabilize__motion" aria-hidden="true">
              <span class="ease-gimbal-gyro-stabilize__a"></span>
              <span class="ease-gimbal-gyro-stabilize__b"></span>
              <span class="ease-gimbal-gyro-stabilize__c"></span>
              <span class="ease-gimbal-gyro-stabilize__d"></span>
            </div>
            <div class="ease-gimbal-gyro-stabilize__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-gimbal-gyro-stabilize__controls">
          <button type="button" class="ease-gimbal-gyro-stabilize__btn primary">Engage</button>
          <button type="button" class="ease-gimbal-gyro-stabilize__btn">Reset</button>
          <label class="ease-gimbal-gyro-stabilize__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-gimbal-gyro-stabilize__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
