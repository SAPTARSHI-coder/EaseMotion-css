<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gimbal Gyro Stabilize</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<section class="gyro-wrapper">

    <div class="control-panel">

        <h1>GYRO STABILIZER</h1>
        <p class="status">ACTIVE • 3 AXIS CONTROL</p>

        <div class="gimbal">

            <div class="axis outer">
                <div class="axis middle">
                    <div class="axis inner">

                        <div class="platform">
                            <span>LEVEL</span>
                        </div>

                    </div>
                </div>
            </div>

        </div>


        <div class="meters">
            <div>
                <span>ROLL</span>
                <b>0.02°</b>
            </div>

            <div>
                <span>PITCH</span>
                <b>0.01°</b>
            </div>

            <div>
                <span>YAW</span>
                <b>0.00°</b>
            </div>
        </div>

    </div>

</section>

</body>
</html>
