<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Reinforcement Learning QRL - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css"></head><body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030712; color: #ffffff;">

    <div class="ease-card ease-card-glass qrl-container">
        <div class="qrl-header">
            <h2>Quantum Reinforcement Learning</h2>
            <span class="ease-badge ease-badge-secondary">Quantum Machine Learning</span>
        </div>
        
        <div class="qrl-screen ease-center">
            <div class="qrl-flux flux-qrl-a"></div>
            <div class="qrl-flux flux-qrl-b"></div>
            <div class="qrl-boundary-ring"></div>
            <div class="qrl-core ease-center"></div>
        </div>

        <div class="qrl-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Agent Policy Circuits &amp; Reward Optimization</span>
            <button class="ease-btn ease-btn-secondary ease-btn-sm ease-hover-grow">Run QRL Episode</button>
        </div>
    </div></body></html>
