<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <meta
        name="description"
        content="Retro glowing toggle switch built with HTML and CSS."
    >
    <title>Glowing Toggle - Retro</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="page">
        <section class="toggle-card" aria-labelledby="toggle-title">
            <div class="card-header">
                <span class="status-dot" aria-hidden="true"></span>
                <span class="eyebrow">RETRO CONTROL</span>
            </div>

            <h1 id="toggle-title">Glowing Toggle</h1>

            <p class="description">
                A responsive neon toggle inspired by classic arcade interfaces.
            </p>

            <div class="toggle-stage">
                <label class="retro-toggle">
                    <input
                        type="checkbox"
                        id="retro-toggle"
                        aria-label="Toggle neon power"
                    >

                    <span class="toggle-track" aria-hidden="true">
                        <span class="toggle-grid"></span>
                        <span class="toggle-thumb"></span>
                    </span>
                </label>
            </div>

            <div class="state" aria-live="polite">
                <span class="state-label">SYSTEM STATUS</span>
                <span class="state-value">
                    <span class="state-off">OFFLINE</span>
                    <span class="state-on">ONLINE</span>
                </span>
            </div>

            <p class="hint">
                CLICK OR PRESS SPACE
            </p>
        </section>
    </main>
</body>
</html>
