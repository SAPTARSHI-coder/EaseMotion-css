<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Musical Keyboard - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="em-piano-page">
        <div class="em-card" role="region" aria-label="Musical Keyboard Showcase" tabindex="0">
            <span class="em-card-badge">INTERACTIVE UI</span>
            <h1 class="em-card-title">Musical Keyboard</h1>
            <p class="em-card-desc">An interactive piano keyboard component featuring realistic tactile key-press depressions and hover animations using pure CSS.</p>
            
            <!-- Keyboard Container -->
            <div class="em-keyboard-container" role="region" aria-label="Virtual piano keyboard">
                <div class="em-piano-keys">
                    <div class="em-key em-white" tabindex="0" role="button" aria-label="Piano key C"></div>
                    <div class="em-key em-black em-sharp-1" tabindex="0" role="button" aria-label="Piano key C sharp"></div>
                    <div class="em-key em-white" tabindex="0" role="button" aria-label="Piano key D"></div>
                    <div class="em-key em-black em-sharp-2" tabindex="0" role="button" aria-label="Piano key D sharp"></div>
                    <div class="em-key em-white" tabindex="0" role="button" aria-label="Piano key E"></div>
                    <div class="em-key em-white" tabindex="0" role="button" aria-label="Piano key F"></div>
                    <div class="em-key em-black em-sharp-3" tabindex="0" role="button" aria-label="Piano key F sharp"></div>
                    <div class="em-key em-white" tabindex="0" role="button" aria-label="Piano key G"></div>
                </div>
            </div>

            <a href="#" class="em-card-btn" role="button">Play Melody</a>
        </div>
    </div>
</body>
</html>
