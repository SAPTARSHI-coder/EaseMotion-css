<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Heartbeat Loader</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="demo-shell">
      <section class="demo-card" aria-labelledby="hbl-title">
        <p class="eyebrow">Loader</p>
        <h1 id="hbl-title">Heartbeat</h1>
        <p class="demo-copy">
          A pulsing heart with an animated ECG line, for health and wellness
          apps.
        </p>
        <div class="heartbeat-loader" role="status" aria-label="Loading">
          <span class="heartbeat-loader__heart" aria-hidden="true"></span>
          <svg class="heartbeat-loader__ecg" viewBox="0 0 240 60" preserveAspectRatio="none" aria-hidden="true" focusable="false">
            <polyline class="heartbeat-loader__ecg-line" points="0,30 60,30 80,30 95,8 110,52 125,18 140,30 240,30" />
          </svg>
          <span class="heartbeat-loader__label">Pulse</span>
        </div>
      </section>
    </main>
  </body>
</html>
