<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Pulsating Wave Rating</title>
  <link rel="stylesheet" href="style.css">
</head>

      <span class="eyebrow">Rating &amp; Feedback</span>

      <h1 id="rating-title">Pulsating Wave Rating</h1>

      <p class="description">
        Rate your experience with a smooth CSS-only pulsating wave effect.
      </p>

        role="radiogroup"
        aria-label="Rate your experience from one to five stars"

        <label for="rating-5" aria-label="5 stars">★</label>

        <label for="rating-4" aria-label="4 stars">★</label>
