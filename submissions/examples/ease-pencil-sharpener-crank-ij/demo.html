<!-- EaseMotion component: pencil-sharpener-crank -->
<!DOCTYPE html>
<html lang="en" data-pencil="crank">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.7">
<title>Ease Pencil Sharpener Crank</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="sharp-rig">
  <header class="sharp-head">
    <span class="sharp-brand">SWIFT</span>
    <span class="sharp-grit">FINE</span>
  </header>
  <div class="sharp-body">
    <span class="sharp-pencil">
      <span class="pencil-wood"></span>
      <span class="pencil-point"></span>
    </span>
    <span class="sharp-slot"></span>
    <span class="crank-wheel"></span>
    <span class="crank-handle"></span>
  </div>
  <div class="sharp-bin">
    <span class="shaving sh-1"></span>
    <span class="shaving sh-2"></span>
    <span class="shaving sh-3"></span>
    <span class="shaving sh-4"></span>
  </div>
  <footer class="sharp-foot">
    <span class="sharp-point">POINT OK</span>
    <span class="sharp-fill">BIN 60%</span>
  </footer>
</main>
</body>
</html>
