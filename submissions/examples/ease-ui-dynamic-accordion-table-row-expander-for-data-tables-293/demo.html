<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Accordion Table</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="table-box">

<table>

<thead>
<tr>
<th>Project</th>
<th>Status</th>
<th></th>
</tr>
</thead>

<tbody>

<tr class="main">
<td>EaseMotion CSS</td>
<td>Completed</td>
<td><button class="toggle">+</button></td>
</tr>

<tr class="details">
<td colspan="3">
Modern responsive CSS component library with reusable animations.
</td>
</tr>

<tr class="main">
<td>Portfolio UI</td>
<td>In Progress</td>
<td><button class="toggle">+</button></td>
</tr>

<tr class="details">
<td colspan="3">
Interactive portfolio showcasing animated layouts and components.
</td>
</tr>

<tr class="main">
<td>Dashboard</td>
<td>Planning</td>
<td><button class="toggle">+</button></td>
</tr>

<tr class="details">
<td colspan="3">
Upcoming analytics dashboard with charts and widgets.
</td>
</tr>

</tbody>

</table>

</div>

<script src="script.js"></script>

</body>
</html>
