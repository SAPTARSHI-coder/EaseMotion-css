<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EaseMotion CSS — Interactive Star Rating Showcase</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="star-demo-wrapper">
    <header class="star-header">
      <span class="badge">UI Component Showcase</span>
      <h1>Interactive Star Rating</h1>
      <p>Pure CSS star rating component with pop scale hover effects, keyboard accessibility, and zero JavaScript.</p>
    </header>

    <main class="star-card">
      <h2>Rate Your Experience</h2>
      <p class="star-subtitle">Hover or click to select your rating score</p>

      <div class="ease-star-rating">
        <input type="radio" id="star5" name="rating" value="5">
        <label for="star5" title="5 Stars">&starf;</label>

        <input type="radio" id="star4" name="rating" value="4">
        <label for="star4" title="4 Stars">&starf;</label>

        <input type="radio" id="star3" name="rating" value="3">
        <label for="star3" title="3 Stars">&starf;</label>

        <input type="radio" id="star2" name="rating" value="2">
        <label for="star2" title="2 Stars">&starf;</label>

        <input type="radio" id="star1" name="rating" value="1">
        <label for="star1" title="1 Star">&starf;</label>
      </div>
    </main>

    <footer class="star-footer">
      <p>EaseMotion CSS Component &bull; Submitted by @Ishita-Katiyar-06</p>
    </footer>
  </div>
</body>
</html>
