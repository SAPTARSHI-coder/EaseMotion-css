<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Press Screw — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Book Press Screw demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Book Press Screw</h1>
      <p class="lede">Antique book press screw descending onto stacked pages</p>
    </header>

    <section class="ease-book-press-screw" data-demo="book-press-screw" aria-live="polite">
      <div class="ease-book-press-screw__housing">
        <div class="ease-book-press-screw__bezel">
          <div class="ease-book-press-screw__face">
            <div class="ease-book-press-screw__readout">
              <span class="ease-book-press-screw__label">Book Press Screw</span>
              <span class="ease-book-press-screw__value">LIVE</span>
            </div>
            <div class="ease-book-press-screw__motion" aria-hidden="true">
              <span class="ease-book-press-screw__a"></span>
              <span class="ease-book-press-screw__b"></span>
              <span class="ease-book-press-screw__c"></span>
              <span class="ease-book-press-screw__d"></span>
            </div>
            <div class="ease-book-press-screw__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-book-press-screw__controls">
          <button type="button" class="ease-book-press-screw__btn primary">Engage</button>
          <button type="button" class="ease-book-press-screw__btn">Reset</button>
          <label class="ease-book-press-screw__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-book-press-screw__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
