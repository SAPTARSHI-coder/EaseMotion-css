<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Off-Canvas Sidebar Component</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Pure CSS Toggle Checkbox -->
    <input type="checkbox" id="sidebar-toggle" class="ease-sidebar-toggle">
    <label for="sidebar-toggle" class="demo-btn">Open Sidebar</label>

    <!-- Sidebar Wrapper & Backdrop -->
    <div class="ease-sidebar-wrapper">
        <label for="sidebar-toggle" class="ease-sidebar-backdrop"></label>
        
        <aside class="ease-sidebar-panel">
            <div class="ease-sidebar-header">
                <h3>Navigation</h3>
                <label for="sidebar-toggle" class="ease-sidebar-close">&times;</label>
            </div>
            
            <ul class="ease-sidebar-menu">
                <li><a href="#">Dashboard</a></li>
                <li><a href="#">Projects</a></li>
                <li><a href="#">Settings</a></li>
                <li><a href="#">Help & Support</a></li>
            </ul>
        </aside>
    </div>

</body>
</html>
