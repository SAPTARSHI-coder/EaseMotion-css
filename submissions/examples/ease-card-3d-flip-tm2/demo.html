<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card 3D Flip | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="flip3d-root">
    <div class="flip3d-card" tabindex="0">
      <div class="flip3d-face flip3d-front">
        <h2 style="margin:0; font-size:1.5rem; font-weight:700;">Front Side</h2>
        <p style="margin:0.5rem 0 0; opacity:0.8;">Hover to flip</p>
      </div>
      <div class="flip3d-face flip3d-back">
        <h3 style="margin:0 0 0.5rem;">Back Side</h3>
        <p style="margin:0; opacity:0.8;">Pure CSS 3D flip</p>
      </div>
    </div>
    <div class="flip3d-card" tabindex="0">
      <div class="flip3d-face flip3d-front" style="background:linear-gradient(135deg,#10b981,#059669);">
        <h2 style="margin:0; font-size:1.5rem; font-weight:700;">Card Two</h2>
        <p style="margin:0.5rem 0 0; opacity:0.8;">Interactive demo</p>
      </div>
      <div class="flip3d-face flip3d-back">
        <h3 style="margin:0 0 0.5rem;">Details</h3>
        <p style="margin:0; opacity:0.8;">No JS required</p>
      </div>
    </div>
  </div>
</body>
</html>
