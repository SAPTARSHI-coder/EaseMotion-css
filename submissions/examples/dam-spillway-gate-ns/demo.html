<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dam Spillway Gate — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Dam Spillway Gate demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Dam Spillway Gate</h1>
      <p class="lede">Dam spillway radial gate lifting to release water</p>
    </header>

    <section class="ease-dam-spillway-gate" data-demo="dam-spillway-gate" aria-live="polite">
      <div class="ease-dam-spillway-gate__housing">
        <div class="ease-dam-spillway-gate__bezel">
          <div class="ease-dam-spillway-gate__face">
            <div class="ease-dam-spillway-gate__readout">
              <span class="ease-dam-spillway-gate__label">Dam Spillway Gate</span>
              <span class="ease-dam-spillway-gate__value">LIVE</span>
            </div>
            <div class="ease-dam-spillway-gate__motion" aria-hidden="true">
              <span class="ease-dam-spillway-gate__a"></span>
              <span class="ease-dam-spillway-gate__b"></span>
              <span class="ease-dam-spillway-gate__c"></span>
              <span class="ease-dam-spillway-gate__d"></span>
            </div>
            <div class="ease-dam-spillway-gate__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-dam-spillway-gate__controls">
          <button type="button" class="ease-dam-spillway-gate__btn primary">Engage</button>
          <button type="button" class="ease-dam-spillway-gate__btn">Reset</button>
          <label class="ease-dam-spillway-gate__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-dam-spillway-gate__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
