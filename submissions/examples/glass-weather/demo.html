<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Glassmorphism Weather Widget — Demo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="weather-card">
    <div class="weather-header">
      <p class="weather-location">San Francisco</p>
      <p class="weather-date">Friday, Aug 14</p>
    </div>

    <div class="weather-main">
      <span class="weather-icon">⛅</span>
      <span class="weather-temp">68°</span>
    </div>

    <p class="weather-desc">Partly Cloudy</p>

    <div class="weather-stats">
      <div class="weather-stat">
        <p class="weather-stat-label">Humidity</p>
        <p class="weather-stat-value">62%</p>
      </div>
      <div class="weather-stat">
        <p class="weather-stat-label">Wind</p>
        <p class="weather-stat-value">8 mph</p>
      </div>
      <div class="weather-stat">
        <p class="weather-stat-label">UV Index</p>
        <p class="weather-stat-value">4</p>
      </div>
    </div>
  </div>

</body>
</html>
