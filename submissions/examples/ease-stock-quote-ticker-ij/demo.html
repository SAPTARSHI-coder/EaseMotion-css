<!-- EaseMotion component: stock-quote-ticker -->
<!DOCTYPE html>
<html lang="en" data-market="nyse">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
<title>Ease Stock Quote Ticker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="market-board">
  <section class="quote-header">
    <div class="symbol-block">
      <h2 class="symbol-name">ACME Corp</h2>
      <span class="symbol-tag">ACME</span>
    </div>
    <div class="quote-figure">
      <span class="quote-price">128.45</span>
      <span class="quote-change up-change">+2.18 (1.73%)</span>
    </div>
  </section>
  <div class="spark-chart" role="img" aria-label="intraday price sparkline">
    <i class="spark-bar spark-1"></i>
    <i class="spark-bar spark-2"></i>
    <i class="spark-bar spark-3"></i>
    <i class="spark-bar spark-4"></i>
    <i class="spark-bar spark-5"></i>
    <i class="spark-bar spark-6"></i>
    <i class="spark-bar spark-7"></i>
    <i class="spark-bar spark-8"></i>
    <i class="spark-bar spark-9"></i>
    <i class="spark-bar spark-10"></i>
    <i class="spark-bar spark-11"></i>
    <i class="spark-bar spark-12"></i>
  </div>
  <dl class="quote-metrics">
    <div class="metric"><dt>Open</dt><dd>126.30</dd></div>
    <div class="metric"><dt>High</dt><dd>129.04</dd></div>
    <div class="metric"><dt>Low</dt><dd>125.87</dd></div>
    <div class="metric"><dt>Vol</dt><dd>2.4M</dd></div>
  </dl>
  <div class="tape-row" aria-hidden="true">
    <div class="tape-track">
      <span class="tape-quote">NVDA 174.20 <b>+1.2%</b></span>
      <span class="tape-quote">TSLA 311.02 <b>+0.8%</b></span>
      <span class="tape-quote">AAPL 226.10 <b>-0.4%</b></span>
      <span class="tape-quote">MSFT 428.90 <b>+0.3%</b></span>
      <span class="tape-quote">NVDA 174.20 <b>+1.2%</b></span>
      <span class="tape-quote">TSLA 311.02 <b>+0.8%</b></span>
      <span class="tape-quote">AAPL 226.10 <b>-0.4%</b></span>
      <span class="tape-quote">MSFT 428.90 <b>+0.3%</b></span>
    </div>
  </div>
</main>
</body>
</html>
