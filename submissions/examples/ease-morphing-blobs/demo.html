<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ease Morphing Blobs</title>
    <link rel="stylesheet" href="../../../easemotion.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="ease-blob-hero-container">
        <!-- Background Blobs -->
        <div class="ease-blob ease-blob-1"></div>
        <div class="ease-blob ease-blob-2"></div>
        
        <!-- Glassmorphism Overlay to smooth out blobs (optional but recommended) -->
        <div class="ease-blob-glass-overlay"></div>
        
        <!-- Foreground Content -->
        <div class="ease-blob-hero-content">
            <h1 class="ease-blob-title">Fluid Motion</h1>
            <p class="ease-blob-subtitle">Create depth and organic movement using pure CSS.</p>
            <button class="ease-blob-btn ease-hover-lift">Get Started</button>
        </div>
    </div>
</body>
</html>
