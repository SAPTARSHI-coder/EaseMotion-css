<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multi-Filter Toolbar</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<section class="toolbar-demo">

    <h1>Interactive Multi-Filter Toolbar</h1>
    <p>Responsive admin toolbar built using pure HTML and CSS.</p>

    <div class="toolbar">

        <div class="search-box">
            <input type="text" placeholder="Search users, roles...">
        </div>

        <button class="filter-btn">
            Filter ▼
        </button>

        <div class="filters">

            <span class="pill">
                Status: Active
                <span class="remove">×</span>
            </span>

            <span class="pill">
                Role: Admin
                <span class="remove">×</span>
            </span>

            <span class="pill">
                Region: India
                <span class="remove">×</span>
            </span>

        </div>

        <span class="badge">
            248 Results
        </span>

        <div class="view-toggle">

            <button class="active">▦ Grid</button>
            <button>☰ List</button>

        </div>

    </div>

</section>

</body>
</html>
