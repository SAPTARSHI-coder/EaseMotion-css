<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Glitch-Flicker Modal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<input type="checkbox" id="modal-toggle" hidden>

<section class="hero">

    <h1>Gaming Hub</h1>

    <p>
        Unlock a futuristic Glitch-Flicker Modal built using pure HTML and CSS.
    </p>

    <label for="modal-toggle" class="open-btn">
        Launch Console
    </label>

</section>

<div class="overlay">

    <div class="modal">

        <label for="modal-toggle" class="close-btn">&times;</label>

        <div class="icon">⚡</div>

        <h2 class="glitch" data-text="SYSTEM ONLINE">
            SYSTEM ONLINE
        </h2>

        <p>
            Security protocols initialized. Your legendary gaming rewards are ready for collection.
        </p>

        <label for="modal-toggle" class="action-btn">
            Continue
        </label>

    </div>

</div>

</body>
</html>
