<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-projector-lens-zoom demo</title>
</head>
<body>
<div class="pj-app">
  <div class="pj-head">
    <span class="pj-name">PALACE CINEMA</span>
    <span class="pj-badge">FEATURE</span>
  </div>
  <div class="pj-stage">
    <div class="pj-unit">
      <div class="pj-case"></div>
      <div class="pj-lens">
        <span class="pj-glass"></span>
        <span class="pj-glint"></span>
      </div>
      <span class="pj-reel pj-reel-1"></span>
      <span class="pj-reel pj-reel-2"></span>
      <span class="pj-leg pj-leg-1"></span>
      <span class="pj-leg pj-leg-2"></span>
    </div>
    <div class="pj-beam"></div>
    <div class="pj-wall">
      <div class="pj-frame"></div>
      <span class="pj-figure"></span>
    </div>
  </div>
  <div class="pj-foot">REEL 2 OF 3</div>
</div>
</body>
</html>
