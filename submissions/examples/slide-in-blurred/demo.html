<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slide-in Blurred Demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f3f4f6;
    }
    .demo-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
    }
    .box {
      width: 150px;
      height: 150px;
      background: #6366f1;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="demo-grid">
    <div class="box slide-in-blurred-top-ag">Top</div>
    <div class="box slide-in-blurred-bottom-ag">Bottom</div>
    <div class="box slide-in-blurred-left-ag">Left</div>
    <div class="box slide-in-blurred-right-ag">Right</div>
  </div>
</body>
</html>
