<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-star-rating-bounce demo</title>
</head>
<body>
<div class="srb-card">
  <span class="srb-title">RATING</span>
  <div class="srb-stars">
    <span class="srb-star srb-lit srb-s1"></span>
    <span class="srb-star srb-lit srb-s2"></span>

    <span class="srb-star srb-s4"></span>

  <span class="srb-caption">TAP TO RATE</span>
</div>

</html>
