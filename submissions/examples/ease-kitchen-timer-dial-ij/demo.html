<!-- EaseMotion component: kitchen-timer-dial -->
<!DOCTYPE html>
<html lang="en" data-timer="kitchen">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.5">
<title>Ease Kitchen Timer Dial</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="kitchen-timer">
  <div class="timer-bell">
    <span class="bell-dome"></span>
    <span class="bell-knob"></span>
  </div>
  <div class="timer-body">
    <span class="tick-mark mk5"></span>
    <span class="tick-mark mk10"></span>
    <span class="tick-mark mk15"></span>
    <span class="tick-mark mk20"></span>
    <span class="tick-mark mk25"></span>
    <span class="tick-mark mk30"></span>
    <div class="minute-dial">
      <span class="dial-digit d1">2</span>
      <span class="dial-digit d2">4</span>
      <span class="dial-digit d3">6</span>
      <span class="dial-digit d4">8</span>
      <span class="dial-digit d5">10</span>
      <span class="dial-digit d6">12</span>
    </div>
    <span class="count-read">08:30</span>
  </div>
  <div class="timer-foot">
    <span class="timer-note">SET 1-60 MIN</span>
  </div>
</main>
</body>
</html>
