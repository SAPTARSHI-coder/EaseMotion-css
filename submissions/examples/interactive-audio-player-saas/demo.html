<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Audio Player Component</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="preview-container">
    <div class="audio-player">
      <!-- Hidden Checkboxes for Pure CSS Interactivity -->
      <input type="checkbox" id="play-toggle" class="state-toggle" aria-label="Play or Pause Audio">
      <input type="checkbox" id="mute-toggle" class="state-toggle" aria-label="Mute or Unmute Audio">
      <input type="checkbox" id="like-toggle" class="state-toggle" aria-label="Like Track">

      <!-- Album / Track Header -->
      <div class="track-card">
        <div class="art-wrapper">
          <div class="album-art"></div>
          <div class="equalizer-overlay">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
          </div>
        </div>
        <div class="track-details">
          <span class="badge">Podcast Episode</span>
          <h2 class="track-title">Building Scalable SaaS Interfaces</h2>
          <p class="track-artist">Design Systems Weekly • Ep. 42</p>
        </div>
      </div>

      <!-- Scrubber & Progress Bar -->
      <div class="progress-section">
        <div class="time-display">
          <span class="time-current">01:24</span>
          <span class="time-total">04:15</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill"></div>
          <div class="progress-thumb"></div>
        </div>
      </div>

      <!-- Player Controls -->
      <div class="controls-wrapper">
        <label for="like-toggle" class="btn btn-icon btn-like" title="Favorite">
          <svg class="icon icon-heart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
          </svg>
        </label>

        <div class="playback-controls">
          <button class="btn btn-icon" aria-label="Rewind 10 Seconds">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M11 19l-9-7 9-7v14zM22 19l-9-7 9-7v14z"></path>
            </svg>
          </button>

          <label for="play-toggle" class="btn btn-primary btn-play" title="Play/Pause">
            <svg class="icon icon-play" viewBox="0 0 24 24" fill="currentColor">
              <polygon points="5 3 19 12 5 21 5 3"></polygon>
            </svg>
            <svg class="icon icon-pause" viewBox="0 0 24 24" fill="currentColor">
              <rect x="6" y="4" width="4" height="16"></rect>
              <rect x="14" y="4" width="4" height="16"></rect>
            </svg>
          </label>

          <button class="btn btn-icon" aria-label="Fast Forward 10 Seconds">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M13 19l9-7-9-7v14zM2 19l9-7-9-7v14z"></path>
            </svg>
          </button>
        </div>

        <label for="mute-toggle" class="btn btn-icon btn-mute" title="Mute/Unmute">
          <svg class="icon icon-volume" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
          </svg>
          <svg class="icon icon-muted" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="1" y1="1" x2="23" y2="23"></line>
            <path d="M9 9l3 3M11 5L6 9H2v6h4l5 4V5z"></path>
          </svg>
        </label>
      </div>
    </div>
  </main>
</body>
</html>
