<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accessible Form Labels Demo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <main class="demo-container">
        <h1>Account Setup</h1>
        <p>This demo illustrates strict WCAG compliance for form label associations. Every input must have a programmatically associated label using the <code>for</code> attribute and the input's <code>id</code>. This expands the click target and provides the accessible name to screen readers.</p>
        
        <form class="demo-form" action="#" method="POST">
            
            <!-- 
                CRITICAL ACCESSIBILITY: Explicit Label Association 
                The `for` attribute on the label must EXACTLY match the `id` of the input.
                This is vastly superior to placeholder text, which disappears on typing.
            -->
            <div class="form-group">
                <label for="firstName" class="form-label">First Name (required)</label>
                <!-- Using aria-required instead of native required for custom validation flexibility, though native required is fine too -->
                <input type="text" id="firstName" name="firstName" class="form-input" aria-required="true" autocomplete="given-name">
            </div>

            <div class="form-group">
                <label for="lastName" class="form-label">Last Name (required)</label>
                <input type="text" id="lastName" name="lastName" class="form-input" aria-required="true" autocomplete="family-name">
            </div>

            <!-- 
                CRITICAL ACCESSIBILITY: Checkbox/Radio Association
                For checkboxes, the label association is crucial because it allows users 
                to click the text to toggle the checkbox, vastly increasing the hit area.
            -->
            <div class="form-group-inline">
                <input type="checkbox" id="marketingOptIn" name="marketingOptIn" class="form-checkbox">
                <label for="marketingOptIn" class="form-label-inline">I want to receive marketing emails and special offers</label>
            </div>

            <!-- 
                CRITICAL ACCESSIBILITY: Select Dropdowns
                Select elements also require explicit label association.
            -->
            <div class="form-group">
                <label for="countrySelect" class="form-label">Country of Residence</label>
                <select id="countrySelect" name="country" class="form-select">
                    <option value="">Select a country...</option>
                    <option value="us">United States</option>
                    <option value="ca">Canada</option>
                    <option value="uk">United Kingdom</option>
                </select>
            </div>

            <button type="submit" class="submit-btn">Complete Setup</button>
        </form>
    </main>

</body>
</html>
