<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dynamic Gradient Spinner</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="gradient-demo" aria-labelledby="spinner-title">
    <section class="gradient-panel">
      <p class="eyebrow">Gradient component</p>
      <h1 id="spinner-title">Dynamic Spinner</h1>
      <p class="summary">A layered loading indicator with rotating conic arcs, orbit beads, and a breathing status core.</p>
      <div class="spinner-card" role="status" aria-live="polite">
        <span class="dynamic-spinner"><i></i><i></i><em></em><b></b><b></b><b></b></span>
        <strong>Building preview</strong>
        <small>Optimizing styles and syncing assets</small>
      </div>
    </section>
  </main>
</body>
</html>
