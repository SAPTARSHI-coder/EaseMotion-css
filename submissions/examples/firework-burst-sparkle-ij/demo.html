<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-firework-burst-sparkle demo</title>
</head>
<body>
<div class="fw-app">
  <span class="fw-label">NEW YEAR</span>
  <div class="fw-star fw-star-1"></div>
  <div class="fw-star fw-star-2"></div>
  <div class="fw-star fw-star-3"></div>
  <div class="fw-city">
    <div class="fw-building fw-building-1"></div>
    <div class="fw-building fw-building-2"></div>
    <div class="fw-building fw-building-3"></div>
    <div class="fw-building fw-building-4"></div>
  </div>
  <div class="fw-burst fw-burst-1">
    <div class="fw-spark fw-spark-1"></div>
    <div class="fw-spark fw-spark-2"></div>
    <div class="fw-spark fw-spark-3"></div>
    <div class="fw-spark fw-spark-4"></div>
    <div class="fw-spark fw-spark-5"></div>
    <div class="fw-spark fw-spark-6"></div>
    <div class="fw-spark fw-spark-7"></div>
    <div class="fw-spark fw-spark-8"></div>
  </div>
  <div class="fw-burst fw-burst-2">
    <div class="fw-spark fw-spark-1"></div>
    <div class="fw-spark fw-spark-2"></div>
    <div class="fw-spark fw-spark-3"></div>
    <div class="fw-spark fw-spark-4"></div>
    <div class="fw-spark fw-spark-5"></div>
    <div class="fw-spark fw-spark-6"></div>
  </div>
  <div class="fw-burst fw-burst-3">
    <div class="fw-spark fw-spark-1"></div>
    <div class="fw-spark fw-spark-2"></div>
    <div class="fw-spark fw-spark-3"></div>
    <div class="fw-spark fw-spark-4"></div>
    <div class="fw-spark fw-spark-5"></div>
  </div>
  <div class="fw-rocket fw-rocket-1"></div>
  <div class="fw-rocket fw-rocket-2"></div>
</div>
</body>
</html>
