<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ease Elastic Spring Bottom Sheet Drawer</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="drawer-body">
  <button id="openDrawer">Open Bottom Sheet</button>
  <div class="drawer-overlay" id="overlay"></div>
  <div class="drawer-sheet" id="sheet">
    <div class="drawer-handle"></div>
    <h3>Elastic Spring Sheet</h3>
    <p>Mobile-native bottom sheet drawer with spring physics</p>
  </div>

  <script>
    const btn = document.getElementById('openDrawer');
    const sheet = document.getElementById('sheet');
    const overlay = document.getElementById('overlay');

    btn.addEventListener('click', () => {
      sheet.classList.add('open');
      overlay.classList.add('open');
    });

    overlay.addEventListener('click', () => {
      sheet.classList.remove('open');
      overlay.classList.remove('open');
    });
  </script>
</body>
</html>
