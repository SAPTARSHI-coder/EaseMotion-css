<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ease Accordion Demo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="demo-container">
        <h1>Accordion Component Demo</h1>
        
        <div class="ease-accordion">
            <button class="ease-accordion-header" aria-expanded="false">
                <span>What is the ease-accordion component?</span>
                <svg class="ease-accordion-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
            </button>
            <div class="ease-accordion-panel">
                <div class="ease-accordion-content">
                    It is a lightweight, accessible, and smoothly animated collapsible container designed for FAQs and structured content disclosure.
                </div>
            </div>
        </div>

        <div class="ease-accordion">
            <button class="ease-accordion-header" aria-expanded="false">
                <span>How do I customize the transition speeds?</span>
                <svg class="ease-accordion-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
            </button>
            <div class="ease-accordion-panel">
                <div class="ease-accordion-content">
                    You can easily adjust the duration and easing curve directly via CSS variables or within the transition properties in style.css.
                </div>
            </div>
        </div>
    </main>

    <script>
        document.querySelectorAll('.ease-accordion-header').forEach(button => {
            button.addEventListener('click', () => {
                const accordion = button.closest('.ease-accordion');
                const isExpanded = button.getAttribute('aria-expanded') === 'true';
                
                button.setAttribute('aria-expanded', !isExpanded);
                accordion.classList.toggle('is-open', !isExpanded);
            });
        });
    </script>
</body>
</html>
