<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>File Upload Progress Showcase | EaseMotion CSS</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="ease-center ease-fade-in" style="min-height: 100vh; background: #090d16; font-family: 'Inter', sans-serif; padding: 2rem;">

  <div class="upload-container">
    <header class="upload-header ease-slide-up">
      <h1 class="ease-fade-in">File Upload Progress</h1>
      <p class="ease-slide-up ease-delay-100">Pure CSS file upload progress bar animations with zero JavaScript overhead.</p>
    </header>

    <!-- Upload Progress Showcase Wrapper -->
    <div class="upload-card ease-slide-up ease-delay-200">
      <div class="upload-info">
        <span class="file-name">design-system-v2.zip</span>
        <span class="upload-percent">78%</span>
      </div>
      <div class="ease-upload-progress-ak">
        <div class="progress-bar-fill"></div>
      </div>
      <div class="upload-footer">
        <span class="upload-status">Uploading... 4.2 MB / 5.4 MB</span>
        <span class="upload-time">12s remaining</span>
      </div>
    </div>
  </div>

</body>
</html>
