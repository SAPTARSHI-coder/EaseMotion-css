<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Currency Converter Widget</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="layout-container">
        
        <header class="section-header">
            <h1 class="title">Currency Converter Widget</h1>
            <p class="subtitle">A pure CSS interactive widget featuring a smooth exchange rate animation and clean input grouping, built without JavaScript.</p>
        </header>

        <div class="demo-area">
            
            <!-- 
              [TECHNIQUE] CSS Converter Widget
              We use CSS focus-within on the wrapper to trigger animations
              on the exchange icon, giving interactive feedback when typing.
            -->
            <div class="converter-card" aria-label="Currency Converter">
                
                <div class="card-header">
                    <h2>Convert Currency</h2>
                    <p>Live exchange rates</p>
                </div>
                
                <form class="converter-form" onsubmit="event.preventDefault();">
                    
                    <!-- From Currency -->
                    <div class="input-group">
                        <label for="amount-from" class="sr-only">Amount to convert</label>
                        <div class="currency-input-wrapper">
                            <span class="currency-symbol">$</span>
                            <!-- Using step="0.01" for currency -->
                            <input type="number" id="amount-from" class="currency-input" placeholder="100.00" value="100.00" step="0.01" min="0">
                            <div class="currency-selector">
                                <span class="flag-icon">🇺🇸</span>
                                <span class="currency-code">USD</span>
                                <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><polyline points="6 9 12 15 18 9"></polyline></svg>
                            </div>
                        </div>
                    </div>
                    
                    <!-- 
                      Animated Exchange Rate Icon
                      Spins when the form receives focus.
                    -->
                    <div class="exchange-divider">
                        <hr class="divider-line">
                        <div class="exchange-icon-wrapper">
                            <svg class="exchange-icon" viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none">
                                <polyline points="16 3 21 3 21 8"></polyline>
                                <line x1="4" y1="14" x2="21" y2="3"></line>
                                <polyline points="8 21 3 21 3 16"></polyline>
                                <line x1="20" y1="10" x2="3" y2="21"></line>
                            </svg>
                        </div>
                        <hr class="divider-line">
                    </div>
                    
                    <!-- To Currency (Simulated output) -->
                    <div class="input-group">
                        <label for="amount-to" class="sr-only">Converted amount</label>
                        <div class="currency-input-wrapper is-output">
                            <span class="currency-symbol">€</span>
                            <!-- readonly simulates output in pure CSS demo -->
                            <input type="text" id="amount-to" class="currency-input" value="92.45" readonly tabindex="-1">
                            <div class="currency-selector">
                                <span class="flag-icon">🇪🇺</span>
                                <span class="currency-code">EUR</span>
                                <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><polyline points="6 9 12 15 18 9"></polyline></svg>
                            </div>
                        </div>
                    </div>
                    
                    <div class="rate-info">
                        <span class="rate-pulse"></span>
                        <p>1 USD = 0.9245 EUR</p>
                    </div>
                    
                    <button type="button" class="btn-convert">View Detailed Chart</button>
                    
                </form>
                
            </div>
            
        </div>
        
    </div>

</body>
</html>
