<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accessible Interactive Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <h1>Accessible Interactive Card</h1>
        <p>Use the Tab key to focus the card. Press Enter or Space to activate it.</p>
        
        <!-- Interactive Card with Role Button -->
        <div 
            class="interactive-card" 
            role="button" 
            tabindex="0" 
            aria-labelledby="card-title" 
            aria-describedby="card-desc"
            id="interactive-card"
        >
            <div class="card-image" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="48" height="48">
                    <path fill="currentColor" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14.5v-9l6 4.5-6 4.5z"/>
                </svg>
            </div>
            <div class="card-content">
                <h2 id="card-title" class="card-title">Getting Started Guide</h2>
                <p id="card-desc" class="card-desc">Learn the basics of accessibility and start building better web experiences today.</p>
            </div>
        </div>

        <!-- Live region for announcing interactions -->
        <div aria-live="polite" class="sr-only" id="announcer"></div>

    </main>

    <script>
        const card = document.getElementById('interactive-card');
        const announcer = document.getElementById('announcer');

        function triggerCardAction() {
            // Visual feedback
            card.classList.add('activated');
            setTimeout(() => card.classList.remove('activated'), 200);
            
            // Announce to screen readers
            announcer.innerText = "Getting Started Guide activated. Loading content...";
        }

        // Handle Mouse Click
        card.addEventListener('click', triggerCardAction);

        // Handle Keyboard (Enter and Space keys)
        card.addEventListener('keydown', function(event) {
            // Space (32) or Enter (13)
            if (event.key === 'Enter' || event.key === ' ' || event.keyCode === 13 || event.keyCode === 32) {
                // Prevent default scrolling behavior for Space key
                if(event.key === ' ') {
                    event.preventDefault();
                }
                triggerCardAction();
            }
        });
    </script>
</body>
</html>
