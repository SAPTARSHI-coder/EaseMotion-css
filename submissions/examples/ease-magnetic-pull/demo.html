<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Magnetic Pull – Pulls Nearby Elements Toward It</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <h1>🧲 Magnetic Pull</h1>
    <p class="subtitle">Pulls nearby elements toward it</p>

    <div class="magnetic-container">
      <div class="magnetic-stage" id="magneticStage">
        <canvas id="canvas"></canvas>
        
        <!-- Magnetic center -->
        <div class="magnet-center" id="magnetCenter">
          <div class="magnet-pulse"></div>
          <div class="magnet-core">
            <span class="magnet-icon">🧲</span>
          </div>
          <div class="magnet-ring" id="magnetRing"></div>
        </div>

        <!-- Info overlay -->
        <div class="info-overlay">
          <span class="magnetic-status" id="magneticStatus">🧲 Active</span>
          <span class="particle-count" id="particleCount">✦ 0 particles</span>
        </div>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <button class="ctrl-btn toggle" id="toggleBtn">⏸ Pause</button>
      <button class="ctrl-btn reset" id="resetBtn">↺ Reset</button>
      <button class="ctrl-btn burst" id="burstBtn">💥 Burst</button>
    </div>

    <!-- Sliders -->
    <div class="slider-container">
      <span class="slider-label">Magnetic Strength</span>
      <input type="range" id="strengthSlider" min="0" max="100" value="60" />
      <span class="slider-value" id="strengthValue">60%</span>
    </div>

    <div class="slider-container">
      <span class="slider-label">Magnetic Range</span>
      <input type="range" id="rangeSlider" min="50" max="300" value="150" step="10" />
      <span class="slider-value" id="rangeValue">150px</span>
    </div>

    <div class="slider-container">
      <span class="slider-label">Particle Count</span>
      <input type="range" id="countSlider" min="10" max="60" value="30" step="5" />
      <span class="slider-value" id="countValue">30</span>
    </div>

    <div class="slider-container">
      <span class="slider-label">Color</span>
      <input type="range" id="colorSlider" min="0" max="360" value="220" />
      <span class="slider-value" id="colorValue">220°</span>
    </div>

    <!-- Status -->
    <div class="status" id="status">🧲 Particles being pulled toward the magnet</div>

    <!-- Keyboard shortcuts -->
    <div class="shortcuts">
      <kbd>Space</kbd> Pause · <kbd>R</kbd> Reset · <kbd>B</kbd> Burst
    </div>
  </div>

  <script>
    (function() {
      "use strict";

      // DOM elements
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      const magneticStatus = document.getElementById('magneticStatus');
      const particleCount = document.getElementById('particleCount');
      const toggleBtn = document.getElementById('toggleBtn');
      const resetBtn = document.getElementById('resetBtn');
      const burstBtn = document.getElementById('burstBtn');
      const status = document.getElementById('status');
      const strengthSlider = document.getElementById('strengthSlider');
      const strengthValue = document.getElementById('strengthValue');
      const rangeSlider = document.getElementById('rangeSlider');
      const rangeValue = document.getElementById('rangeValue');
      const countSlider = document.getElementById('countSlider');
      const countValue = document.getElementById('countValue');
      const colorSlider = document.getElementById('colorSlider');
      const colorValue = document.getElementById('colorValue');

      // State
      let particles = [];
      let isPaused = false;
      let animationId = null;
      let time = 0;
      let isBursting = false;
      let burstTimer = null;

      // ----- Canvas setup -----
      function setupCanvas() {
        const rect = canvas.parentElement.getBoundingClientRect();
        const size = Math.min(rect.width - 40, 600);
        canvas.width = size;
        canvas.height = size;
        canvas.style.width = size + 'px';
        canvas.style.height = size + 'px';
      }

      // ----- Particle class -----
      class Particle {
        constructor() {
          const w = canvas.width;
          const h = canvas.height;
          const cx = w / 2;
          const cy = h / 2;
          const range = parseInt(rangeSlider.value);
          
          this.x = cx + (Math.random() - 0.5) * (w - 60);
          this.y = cy + (Math.random() - 0.5) * (h - 60);
          this.size = 2 + Math.random() * 5;
          this.speed = 0.5 + Math.random() * 1.5;
          this.mass = 0.5 + Math.random() * 0.5;
          this.vx = (Math.random() - 0.5) * 0.5;
          this.vy = (Math.random() - 0.5) * 0.5;
          this.hue = parseInt(colorSlider.value) + (Math.random() - 0.5) * 30;
          this.saturation = 80 + Math.random() * 20;
          this.lightness = 50 + Math.random() * 30;
          this.opacity = 0.3 + Math.random() * 0.5;
          this.alive = true;
          this.trail = [];
          this.trailLength = 5 + Math.floor(Math.random() * 8);
          this.phase = Math.random() * Math.PI * 2;
          this.wobble = 0;
          this.wobbleSpeed = 0.02 + Math.random() * 0.03;
          this.wobbleAmount = 0.2 + Math.random() * 0.5;
          this.isAttracted = false;
          this.attractionStrength = 0;
        }

        update(cx, cy, strength, range) {
          const dx = cx - this.x;
          const dy = cy - this.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          const strengthFactor = strength / 100;

          // Magnetic pull
          if (dist < range && strengthFactor > 0) {
            const force = (1 - dist / range) * strengthFactor * 0.05 * this.mass;
            const angle = Math.atan2(dy, dx);
            this.vx += Math.cos(angle) * force;
            this.vy += Math.sin(angle) * force;
            this.attractionStrength = force * 100;
            this.isAttracted = true;
          } else {
            this.isAttracted = false;
            this.attractionStrength = 0;
          }

          // Random wander
          this.vx += (Math.random() - 0.5) * 0.02;
          this.vy += (Math.random() - 0.5) * 0.02;

          // Damping
          this.vx *= 0.98;
          this.vy *= 0.98;

          // Limit speed
          const maxSpeed = 3;
          const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
          if (speed > maxSpeed) {
            this.vx = (this.vx / speed) * maxSpeed;
            this.vy = (this.vy / speed) * maxSpeed;
          }

          // Wobble
          this.wobble += this.wobbleSpeed;
          this.x += this.vx + Math.sin(this.wobble + this.phase) * this.wobbleAmount * 0.02;
          this.y += this.vy + Math.cos(this.wobble * 0.7 + this.phase) * this.wobbleAmount * 0.02;

          // Trail
          this.trail.push({ x: this.x, y: this.y });
          if (this.trail.length > this.trailLength) {
            this.trail.shift();
          }

          // Keep within bounds with soft boundary
          const padding = 10;
          if (this.x < padding) { this.x = padding; this.vx = Math.abs(this.vx) * 0.5; }
          if (this.x > canvas.width - padding) { this.x = canvas.width - padding; this.vx = -Math.abs(this.vx) * 0.5; }
          if (this.y < padding) { this.y = padding; this.vy = Math.abs(this.vy) * 0.5; }
          if (this.y > canvas.height - padding) { this.y = canvas.height - padding; this.vy = -Math.abs(this.vy) * 0.5; }

          // Size pulse based on attraction
          this.pulse = 1 + this.attractionStrength * 0.05;
        }

        draw(ctx) {
          const alpha = this.opacity * (0.5 + 0.5 * (this.isAttracted ? 1 : 0.5));
          const size = this.size * this.pulse;

          // Trail
          if (this.trail.length > 1) {
            for (let i = 0; i < this.trail.length - 1; i++) {
              const t = i / this.trail.length;
              const trailAlpha = alpha * t * 0.15;
              const trailSize = size * t * 0.2;
              ctx.fillStyle = `hsla(${this.hue + 20}, 100%, 80%, ${trailAlpha})`;
              ctx.beginPath();
              ctx.arc(this.trail[i].x, this.trail[i].y, trailSize, 0, Math.PI * 2);
              ctx.fill();
            }
          }

          // Glow
          const glowSize = size * (3 + this.attractionStrength * 0.02);
          const gradient = ctx.createRadialGradient(
            this.x, this.y, 0,
            this.x, this.y, glowSize
          );
          const glowAlpha = alpha * 0.15 * (0.5 + 0.5 * (this.isAttracted ? 1 : 0.3));
          gradient.addColorStop(0, `hsla(${this.hue + 20}, 100%, 90%, ${glowAlpha})`);
          gradient.addColorStop(0.5, `hsla(${this.hue + 10}, 100%, 70%, ${glowAlpha * 0.5})`);
          gradient.addColorStop(1, `hsla(${this.hue}, 100%, 50%, 0)`);
          ctx.fillStyle = gradient;
          ctx.beginPath();
          ctx.arc(this.x, this.y, glowSize, 0, Math.PI * 2);
          ctx.fill();

          // Core
          const coreGrad = ctx.createRadialGradient(
            this.x - size * 0.2, this.y - size * 0.2, 0,
            this.x, this.y, size
          );
          coreGrad.addColorStop(0, `hsla(45, 100%, 95%, ${alpha * 0.9})`);
          coreGrad.addColorStop(0.3, `hsla(${this.hue + 20}, 100%, 85%, ${alpha * 0.8})`);
          coreGrad.addColorStop(0.7, `hsla(${this.hue}, 100%, 70%, ${alpha * 0.6})`);
          coreGrad.addColorStop(1, `hsla(${this.hue - 10}, 100%, 50%, ${alpha * 0.3})`);

          ctx.shadowColor = `hsla(${this.hue}, 100%, 60%, ${alpha * 0.1 * (0.5 + 0.5 * this.isAttracted)})`;
          ctx.shadowBlur = 10;
          ctx.fillStyle = coreGrad;
          ctx.beginPath();
          ctx.arc(this.x, this.y, size, 0, Math.PI * 2);
          ctx.fill();
          ctx.shadowBlur = 0;

          // Highlight
          if (this.isAttracted) {
            ctx.fillStyle = `rgba(255, 255, 255, ${alpha * 0.1 * this.pulse})`;
            ctx.beginPath();
            ctx.arc(this.x - size * 0.15, this.y - size * 0.2, size * 0.15, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      }

      // ----- Generate particles -----
      function generateParticles(count) {
        particles = [];
        for (let i = 0; i < count; i++) {
          particles.push(new Particle());
        }
        particleCount.textContent = `✦ ${particles.length} particles`;
        countValue.textContent = particles.length;
      }

      // ----- Burst particles -----
      function burstParticles() {
        if (isBursting) return;
        
        const w = canvas.width;
        const h = canvas.height;
        const cx = w / 2;
        const cy = h / 2;
        const count = 20 + Math.floor(Math.random() * 30);
        
        isBursting = true;
        for (let i = 0; i < count; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 2 + Math.random() * 4;
          const p = new Particle();
          p.x = cx + (Math.random() - 0.5) * 20;
          p.y = cy + (Math.random() - 0.5) * 20;
          p.vx = Math.cos(angle) * speed;
          p.vy = Math.sin(angle) * speed;
          p.size = 2 + Math.random() * 4;
          p.hue = parseInt(colorSlider.value) + (Math.random() - 0.5) * 30;
          particles.push(p);
        }
        
        particleCount.textContent = `✦ ${particles.length} particles`;
        status.textContent = `💥 Burst! ${count} particles!`;
        magneticStatus.textContent = '💥 Bursting!';
        
        if (burstTimer) clearTimeout(burstTimer);
        burstTimer = setTimeout(() => {
          isBursting = false;
          magneticStatus.textContent = '🧲 Active';
          status.textContent = '🧲 Particles being pulled toward the magnet';
        }, 1500);
      }

      // ----- Draw background -----
      function drawBackground() {
        const w = canvas.width;
        const h = canvas.height;
        const cx = w / 2;
        const cy = h / 2;
        const range = parseInt(rangeSlider.value);
        const hue = parseInt(colorSlider.value);

        // Dark background
        const bgGradient = ctx.createRadialGradient(cx, cy, 0, cx, cy, w * 0.7);
        bgGradient.addColorStop(0, '#0a0a1a');
        bgGradient.addColorStop(0.5, '#060612');
        bgGradient.addColorStop(1, '#020208');
        ctx.fillStyle = bgGradient;
        ctx.fillRect(0, 0, w, h);

        // Magnetic field visualization
        const fieldAlpha = 0.02 + parseInt(strengthSlider.value) / 100 * 0.03;
        const fieldGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, range);
        fieldGrad.addColorStop(0, `hsla(${hue + 20}, 100%, 80%, ${fieldAlpha * 0.5})`);
        fieldGrad.addColorStop(0.5, `hsla(${hue + 10}, 100%, 60%, ${fieldAlpha})`);
        fieldGrad.addColorStop(1, `hsla(${hue}, 100%, 40%, 0)`);
        ctx.fillStyle = fieldGrad;
        ctx.beginPath();
        ctx.arc(cx, cy, range, 0, Math.PI * 2);
        ctx.fill();

        // Field lines (subtle)
        const numLines = 8;
        for (let i = 0; i < numLines; i++) {
          const angle = (i / numLines) * Math.PI * 2 + time * 0.02;
          const alpha = 0.01 + parseInt(strengthSlider.value) / 100 * 0.02;
          ctx.strokeStyle = `hsla(${hue + 20}, 100%, 70%, ${alpha})`;
          ctx.lineWidth = 0.5;
          ctx.setLineDash([3, 6]);
          ctx.lineDashOffset = -time * 10;
          ctx.beginPath();
          ctx.moveTo(cx + Math.cos(angle) * 10, cy + Math.sin(angle) * 10);
          const r = range * (0.3 + 0.7 * (0.5 + 0.5 * Math.sin(angle * 2 + time)));
          ctx.lineTo(cx + Math.cos(angle) * r, cy + Math.sin(angle) * r);
          ctx.stroke();
          ctx.setLineDash([]);
        }

        // Range ring
        ctx.strokeStyle = `hsla(${hue + 20}, 100%, 70%, ${0.05 + parseInt(strengthSlider.value) / 100 * 0.05})`;
        ctx.lineWidth = 1;
        ctx.setLineDash([4, 8]);
        ctx.lineDashOffset = -time * 15;
        ctx.beginPath();
        ctx.arc(cx, cy, range, 0, Math.PI * 2);
        ctx.stroke();
        ctx.setLineDash([]);
      }

      // ----- Draw -----
      function draw() {
        const w = canvas.width;
        const h = canvas.height;
        const cx = w / 2;
        const cy = h / 2;
        const strength = parseInt(strengthSlider.value);
        const range = parseInt(rangeSlider.value);

        drawBackground();

        // Update particles
        if (!isPaused) {
          particles.forEach(p => p.update(cx, cy, strength, range));
        }

        // Draw particles (sorted by size for depth)
        const sortedParticles = [...particles].sort((a, b) => a.size - b.size);
        sortedParticles.forEach(p => p.draw(ctx));

        // Update status
        particleCount.textContent = `✦ ${particles.length} particles`;
        if (!isPaused) {
          magneticStatus.textContent = '🧲 Active';
        }
      }

      // ----- Animation loop -----
      function animate() {
        time += 0.016;
        draw();
        animationId = requestAnimationFrame(animate);
      }

      // ----- Start animation -----
      function startAnimation() {
        if (animationId) {
          cancelAnimationFrame(animationId);
        }
        animate();
      }

      // ----- Toggle pause -----
      function togglePause() {
        isPaused = !isPaused;
        toggleBtn.textContent = isPaused ? '▶ Play' : '⏸ Pause';
        status.textContent = isPaused ? '⏸ Paused' : '▶ Resumed';
        magneticStatus.textContent = isPaused ? '⏸ Paused' : '🧲 Active';
      }

      // ----- Reset -----
      function resetMagnetic() {
        isPaused = false;
        isBursting = false;
        toggleBtn.textContent = '⏸ Pause';
        magneticStatus.textContent = '🧲 Active';
        strengthSlider.value = 60;
        strengthValue.textContent = '60%';
        rangeSlider.value = 150;
        rangeValue.textContent = '150px';
        countSlider.value = 30;
        countValue.textContent = '30';
        colorSlider.value = 220;
        colorValue.textContent = '220°';
        const count = parseInt(countSlider.value);
        generateParticles(count);
        status.textContent = '↺ Reset';
        setTimeout(() => {
          status.textContent = '🧲 Particles being pulled toward the magnet';
        }, 500);
      }

      // ----- Event Listeners -----
      toggleBtn.addEventListener('click', togglePause);
      resetBtn.addEventListener('click', resetMagnetic);
      burstBtn.addEventListener('click', burstParticles);

      strengthSlider.addEventListener('input', (e) => {
        strengthValue.textContent = e.target.value + '%';
      });

      rangeSlider.addEventListener('input', (e) => {
        rangeValue.textContent = e.target.value + 'px';
      });

      countSlider.addEventListener('input', (e) => {
        const val = parseInt(e.target.value);
        countValue.textContent = val;
        generateParticles(val);
        status.textContent = `✦ Particle count: ${val}`;
        setTimeout(() => {
          status.textContent = '🧲 Particles being pulled toward the magnet';
        }, 1000);
      });

      colorSlider.addEventListener('input', (e) => {
        colorValue.textContent = e.target.value + '°';
        particles.forEach(p => {
          p.hue = parseInt(e.target.value) + (Math.random() - 0.5) * 30;
        });
      });

      // Keyboard shortcuts
      document.addEventListener('keydown', (e) => {
        if (e.key === ' ' || e.key === 'Space') {
          e.preventDefault();
          togglePause();
        }
        if (e.key === 'r' || e.key === 'R') {
          e.preventDefault();
          resetMagnetic();
        }
        if (e.key === 'b' || e.key === 'B') {
          e.preventDefault();
          burstParticles();
        }
      });

      // Click canvas to burst
      canvas.addEventListener('click', burstParticles);

      // ----- Resize handler -----
      let resizeTimeout;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(() => {
          setupCanvas();
          const count = parseInt(countSlider.value);
          generateParticles(count);
        }, 200);
      });

      // ----- Init -----
      function init() {
        setupCanvas();
        const count = parseInt(countSlider.value);
        generateParticles(count);
        startAnimation();
        status.textContent = '🧲 Particles being pulled toward the magnet!';
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }

    })();
  </script>
</body>
</html>
