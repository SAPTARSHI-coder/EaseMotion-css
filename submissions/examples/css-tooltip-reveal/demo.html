<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Tooltip Reveal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="demo">
        <section class="tooltip-showcase">
            <p class="eyebrow">EaseMotion CSS</p>
            <h1>CSS Tooltip Reveal</h1>
            <p class="intro">
                Hover or focus on a button to reveal a smooth,
                CSS-only contextual tooltip.
            </p>
            <div class="tooltip-grid">
                <button
                    class="tooltip tooltip-top"
                    data-tooltip="Save your changes"
                    type="button"
                >
                    <span class="icon">↓</span>
                    Save
                </button>
                <button
                    class="tooltip tooltip-right"
                    data-tooltip="Share this content"
                    type="button"
                >
                    <span class="icon">↗</span> Share</button>
                <button
                    class="tooltip tooltip-bottom"
                    data-tooltip="Download this file"
                    type="button"
                ><span class="icon">↓</span>   Download</button>
                <button
                    class="tooltip tooltip-left"
                    data-tooltip="Delete this item"type="button"> <span class="icon">×</span>Delete</button>
            </div>
            <p class="hint">
                Hover or use <kbd>Tab</kbd> to explore the tooltips.
            </p>
        </section>
    </main>
</body>
</html>
