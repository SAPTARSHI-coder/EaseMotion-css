<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Achievement Badge Unlock</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="layout-container">
        
        <header class="section-header">
            <h1 class="title">Achievement Badge Unlock</h1>
            <p class="subtitle">A pure CSS interactive component that animates an achievement badge unlock sequence with an expanding starburst fanfare and a sweeping metallic shine.</p>
        </header>

        <div class="demo-area">
            
            <div class="unlock-container" tabindex="0" aria-label="Achievement Unlocked: Master Developer">
                
                <!-- 
                  [TECHNIQUE] The Starburst Fanfare
                  This sits behind the badge. It starts small (scale 0) and hidden.
                  On hover/focus, it scales up and rotates continuously.
                -->
                <div class="fanfare-burst"></div>
                
                <!-- 
                  The main badge container
                  Bounces in on hover.
                -->
                <div class="badge-card">
                    
                    <!-- The metallic shine sweep layer -->
                    <div class="badge-shine"></div>
                    
                    <div class="badge-icon">
                        <svg viewBox="0 0 24 24" width="48" height="48" stroke="currentColor" stroke-width="2" fill="none"><path d="M12 15l-3.5 2 1-4-3-2.5 4-.5L12 6l1.5 4 4 .5-3 2.5 1 4-3.5-2z"></path><path d="M5 21v-3l-2-2v-4"></path><path d="M19 21v-3l2-2v-4"></path></svg>
                    </div>
                    
                    <div class="badge-content">
                        <span class="badge-label">Achievement Unlocked</span>
                        <h2 class="badge-title">Master Developer</h2>
                        <p class="badge-desc">You've successfully completed the 100 Days of Code challenge!</p>
                    </div>
                    
                </div>
                
                <p class="instruction">Hover to unlock</p>
                
            </div>
            
        </div>
        
    </div>

</body>
</html>
