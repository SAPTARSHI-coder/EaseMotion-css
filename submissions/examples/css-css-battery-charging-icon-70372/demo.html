<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Battery Charging Icon - EaseMotion</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div
      class="bci"
      aria-label="Battery charging icon"
      role="img"
      aria-label="Battery charging"
    >
      <span class="bci-body" aria-hidden="true"
        ><span class="bci-fill"></span
        ><span class="bci-bolt">&#9889;</span></span
      >
      <span class="bci-cap" aria-hidden="true"></span>
    </div>
  </body>
</html>
