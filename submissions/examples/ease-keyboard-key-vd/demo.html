<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ease Keyboard Key</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="wrapper">

    <div class="shortcut">
        <kbd>Ctrl</kbd>
        <span>+</span>
        <kbd>K</kbd>
    </div>

    <div class="shortcut">
        <kbd>Shift</kbd>
        <span>+</span>
        <kbd>Alt</kbd>
        <span>+</span>
        <kbd>P</kbd>
    </div>

    <div class="shortcut">
        <kbd>⌘</kbd>
        <span>+</span>
        <kbd>S</kbd>
    </div>

</div>

</body>
</html>
