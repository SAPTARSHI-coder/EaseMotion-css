<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laterna Magica Slide — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Laterna Magica Slide demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Laterna Magica Slide</h1>
      <p class="lede">Laterna magica painted slide advancing through lamp</p>
    </header>

    <section class="ease-laterna-magica-slide" data-demo="laterna-magica-slide" aria-live="polite">
      <div class="ease-laterna-magica-slide__housing">
        <div class="ease-laterna-magica-slide__bezel">
          <div class="ease-laterna-magica-slide__face">
            <div class="ease-laterna-magica-slide__readout">
              <span class="ease-laterna-magica-slide__label">Laterna Magica Slide</span>
              <span class="ease-laterna-magica-slide__value">LIVE</span>
            </div>
            <div class="ease-laterna-magica-slide__motion" aria-hidden="true">
              <span class="ease-laterna-magica-slide__a"></span>
              <span class="ease-laterna-magica-slide__b"></span>
              <span class="ease-laterna-magica-slide__c"></span>
              <span class="ease-laterna-magica-slide__d"></span>
            </div>
            <div class="ease-laterna-magica-slide__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-laterna-magica-slide__controls">
          <button type="button" class="ease-laterna-magica-slide__btn primary">Engage</button>
          <button type="button" class="ease-laterna-magica-slide__btn">Reset</button>
          <label class="ease-laterna-magica-slide__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-laterna-magica-slide__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
