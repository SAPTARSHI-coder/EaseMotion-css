<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="style.css" />
  <title>EaseMotion Reduced Motion Demo</title>
</head>
<body>
  <main class="container">
    <h1>EaseMotion Reduced Motion Demo</h1>

    <section class="example">
      <h2>Animated Loading Button</h2>
      <button class="ease-btn ease-btn-loading" aria-live="polite" aria-busy="true">
        Loading...
      </button>
      <p class="note">This button uses a continuous pulse animation.</p>
    </section>

    <section class="example">
      <h2>Bouncy Card</h2>
      <div class="ease-card ease-bounce" role="region" aria-label="Bouncy card example">
        Bouncy card
      </div>
      <p class="note">This card uses a bounce keyframe animation.</p>
    </section>

    <section class="example">
      <h2>Staggered List</h2>
      <ul class="ease-list" aria-hidden="false">
        <li class="ease-item">Item 1</li>
        <li class="ease-item">Item 2</li>
        <li class="ease-item">Item 3</li>
      </ul>
      <p class="note">Staggered entrance is simplified under reduced motion.</p>
    </section>
  </main>
</body>
</html>
