<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hula Hoop · Hula Hoop Spins Around</title>
    <meta name="description" content="Interactive hula hoop with realistic spinning physics, rotation, and hip motion.">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1 class="title">🔄 HULA HOOP</h1>
        
        <div class="canvas-wrapper">
            <canvas id="hoopCanvas" width="600" height="500"></canvas>
            <div class="glow-overlay"></div>
        </div>

        <div class="controls">
            <div class="button-group">
                <button class="spin-btn" id="spinBtn">🔄 SPIN</button>
                <button class="stop-btn" id="stopBtn">⏹️ STOP</button>
                <button class="reset-btn" id="resetBtn">⟳ RESET</button>
                <button class="toggle-btn" id="toggleBtn">⏸️ PAUSE</button>
            </div>
            <div class="speed-control">
                <label>Speed</label>
                <input type="range" id="speedSlider" min="1" max="10" value="5">
                <span id="speedLabel">5</span>
                <label>Size</label>
                <input type="range" id="sizeSlider" min="3" max="10" value="6">
                <span id="sizeLabel">6</span>
            </div>
        </div>

        <div class="info">
            <span>🔄 HULA HOOP</span>
            <small>spin · rotate · hip</small>
        </div>
        <div class="hint">
            <span>🔄 click to spin the hula hoop around</span>
        </div>
    </div>

    <script>
        (function() {
            const canvas = document.getElementById('hoopCanvas');
            const ctx = canvas.getContext('2d');
            const W = 600, H = 500;
            
            const spinBtn = document.getElementById('spinBtn');
            const stopBtn = document.getElementById('stopBtn');
            const resetBtn = document.getElementById('resetBtn');
            const toggleBtn = document.getElementById('toggleBtn');
            const speedSlider = document.getElementById('speedSlider');
            const speedLabel = document.getElementById('speedLabel');
            const sizeSlider = document.getElementById('sizeSlider');
            const sizeLabel = document.getElementById('sizeLabel');

            let isAnimating = true;
            let speed = 5;
            let size = 6;
            let time = 0;
            let isSpinning = false;
            let hoopAngle = 0;
            let spinVelocity = 0;
            let spinCount = 0;

            // ---- Character Pose ----
            let hipAngle = 0;
            let hipTarget = 0;

            // ---- Spin Hoop ----
            function spinHoop() {
                if (isSpinning) return;
                isSpinning = true;
                spinVelocity = 0.5 + speed * 0.15;
                spinCount++;
            }

            // ---- Stop Hoop ----
            function stopHoop() {
                isSpinning = false;
                spinVelocity = 0;
            }

            // ---- Reset ----
            function resetHoop() {
                isSpinning = false;
                spinVelocity = 0;
                hoopAngle = 0;
                spinCount = 0;
                hipAngle = 0;
                hipTarget = 0;
            }

            // ---- Update Physics ----
            function updatePhysics() {
                const dt = 0.02 * (speed / 5);
                
                if (isSpinning) {
                    // Spin with slight deceleration
                    spinVelocity *= 0.999;
                    hoopAngle += spinVelocity * dt * 2;
                    
                    // Hip motion
                    hipTarget = Math.sin(hoopAngle * 0.5) * 0.15;
                    hipAngle += (hipTarget - hipAngle) * 0.05 * dt;
                    
                    // Stop if too slow
                    if (spinVelocity < 0.01) {
                        isSpinning = false;
                        spinVelocity = 0;
                    }
                }
            }

            // ---- Draw Character ----
            function drawCharacter(ctx, x, y, size) {
                const s = size * 1.2;
                const hip = hipAngle * 0.3;
                
                ctx.save();
                ctx.translate(x, y + s * 0.1);
                
                // Shadow
                ctx.shadowColor = 'rgba(0,0,0,0.1)';
                ctx.shadowBlur = 10;
                ctx.shadowOffsetX = 2;
                ctx.shadowOffsetY = 4;
                
                // Body
                const bodyGrad = ctx.createRadialGradient(
                    -s * 0.05, -s * 0.3, 0,
                    0, 0, s * 0.5
                );
                bodyGrad.addColorStop(0, '#e8e0d5');
                bodyGrad.addColorStop(0.4, '#d4c8b8');
                bodyGrad.addColorStop(0.8, '#b8a898');
                bodyGrad.addColorStop(1, '#9a8a7a');
                ctx.fillStyle = bodyGrad;
                ctx.shadowColor = 'rgba(100, 200, 255, 0.05)';
                ctx.shadowBlur = 10;
                ctx.beginPath();
                ctx.ellipse(0, -s * 0.1, s * 0.3, s * 0.45, 0, 0, Math.PI * 2);
                ctx.fill();
                
                // Head
                ctx.shadowBlur = 5;
                ctx.fillStyle = '#e8e0d5';
                ctx.beginPath();
                ctx.arc(0, -s * 0.5, s * 0.2, 0, Math.PI * 2);
                ctx.fill();
                
                // Hair
                ctx.fillStyle = 'rgba(60, 50, 40, 0.3)';
                ctx.beginPath();
                ctx.arc(0, -s * 0.6, s * 0.14, 0, Math.PI * 2);
                ctx.fill();
                
                // Eyes
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#1a1a2e';
                ctx.beginPath();
                ctx.arc(-s * 0.06, -s * 0.5, s * 0.025, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(s * 0.06, -s * 0.5, s * 0.025, 0, Math.PI * 2);
                ctx.fill();
                
                // Smile
                ctx.strokeStyle = 'rgba(60, 50, 40, 0.3)';
                ctx.lineWidth = 0.8;
                ctx.beginPath();
                ctx.arc(0, -s * 0.43, s * 0.05, 0.1, Math.PI - 0.1);
                ctx.stroke();
                
                // Arms (out to sides for hula)
                ctx.shadowBlur = 2;
                ctx.strokeStyle = '#d4c8b8';
                ctx.lineWidth = 3;
                const armSway = Math.sin(hoopAngle * 0.7) * 5;
                for (let side = -1; side <= 1; side += 2) {
                    ctx.beginPath();
                    ctx.moveTo(side * s * 0.25, -s * 0.15 + hip * s * 0.2);
                    ctx.quadraticCurveTo(
                        side * s * 0.55 + armSway * side * 0.02,
                        -s * 0.1 + hip * s * 0.1,
                        side * s * 0.45 + armSway * side * 0.03,
                        -s * 0.3 + hip * s * 0.1
                    );
                    ctx.stroke();
                }
                
                // Legs
                ctx.shadowBlur = 2;
                ctx.strokeStyle = '#c4b8a8';
                ctx.lineWidth = 3;
                for (let side = -1; side <= 1; side += 2) {
                    const legOffset = hip * s * 0.2 * side;
                    ctx.beginPath();
                    ctx.moveTo(side * s * 0.08, s * 0.35 + legOffset * 0.3);
                    ctx.quadraticCurveTo(
                        side * s * 0.12,
                        s * 0.5 + legOffset * 0.5,
                        side * s * 0.08,
                        s * 0.7 + legOffset * 0.3
                    );
                    ctx.stroke();
                }
                
                ctx.restore();
            }

            // ---- Draw Hoop ----
            function drawHoop(ctx, x, y, radius) {
                const angle = hoopAngle;
                const tilt = 0.15 + Math.sin(angle * 0.5) * 0.05;
                
                ctx.save();
                ctx.translate(x, y);
                
                // Glow
                const glowIntensity = isSpinning ? 0.3 : 0.05;
                ctx.shadowColor = `rgba(100, 200, 255, ${glowIntensity * 0.2})`;
                ctx.shadowBlur = 30 * glowIntensity;
                
                // Hoop body
                const grad = ctx.createRadialGradient(
                    -radius * 0.2, -radius * 0.2, 0,
                    0, 0, radius
                );
                grad.addColorStop(0, '#e8e0d5');
                grad.addColorStop(0.3, '#d4c8b8');
                grad.addColorStop(0.6, '#b8a898');
                grad.addColorStop(0.8, '#9a8a7a');
                grad.addColorStop(1, '#7a6a5a');
                
                ctx.fillStyle = grad;
                ctx.shadowColor = `rgba(100, 200, 255, ${glowIntensity * 0.1})`;
                ctx.shadowBlur = 20 * glowIntensity;
                
                // Draw 3D hoop with tilt
                const segments = 24;
                const rot = angle * 0.5;
                ctx.beginPath();
                for (let i = 0; i <= segments; i++) {
                    const t = (i / segments) * Math.PI * 2;
                    const r = radius;
                    const xPos = Math.cos(t) * r;
                    const yPos = Math.sin(t) * r * (1 - tilt * 0.3);
                    const zOffset = Math.sin(t + rot) * tilt * 10;
                    if (i === 0) ctx.moveTo(xPos, yPos + zOffset);
                    else ctx.lineTo(xPos, yPos + zOffset);
                }
                ctx.closePath();
                ctx.fill();
                
                // Hoop edge highlight
                ctx.shadowBlur = 0;
                ctx.strokeStyle = 'rgba(200, 220, 240, 0.15)';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                for (let i = 0; i <= segments; i++) {
                    const t = (i / segments) * Math.PI * 2;
                    const r = radius * 0.95;
                    const xPos = Math.cos(t) * r;
                    const yPos = Math.sin(t) * r * (1 - tilt * 0.3);
                    const zOffset = Math.sin(t + rot) * tilt * 8;
                    if (i === 0) ctx.moveTo(xPos, yPos + zOffset);
                    else ctx.lineTo(xPos, yPos + zOffset);
                }
                ctx.closePath();
                ctx.stroke();
                
                // Inner glow ring
                ctx.shadowBlur = 0;
                ctx.strokeStyle = `rgba(100, 200, 255, ${glowIntensity * 0.05})`;
                ctx.lineWidth = 2;
                ctx.beginPath();
                for (let i = 0; i <= segments; i++) {
                    const t = (i / segments) * Math.PI * 2;
                    const r = radius * 0.85;
                    const xPos = Math.cos(t) * r;
                    const yPos = Math.sin(t) * r * (1 - tilt * 0.3);
                    const zOffset = Math.sin(t + rot) * tilt * 6;
                    if (i === 0) ctx.moveTo(xPos, yPos + zOffset);
                    else ctx.lineTo(xPos, yPos + zOffset);
                }
                ctx.closePath();
                ctx.stroke();
                
                ctx.restore();
            }

            // ---- Render ----
            function render() {
                // Background
                const grad = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, W);
                grad.addColorStop(0, '#0d1a2a');
                grad.addColorStop(0.3, '#0a1520');
                grad.addColorStop(0.6, '#080e18');
                grad.addColorStop(0.8, '#060a12');
                grad.addColorStop(1, '#040608');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, W, H);
                
                // Grid
                ctx.strokeStyle = 'rgba(255,255,255,0.02)';
                ctx.lineWidth = 0.5;
                for (let i = 0; i < 20; i++) {
                    ctx.beginPath();
                    ctx.moveTo(i * 30, 0);
                    ctx.lineTo(i * 30, H);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(0, i * 30);
                    ctx.lineTo(W, i * 30);
                    ctx.stroke();
                }
                
                // Ground
                ctx.fillStyle = 'rgba(100, 200, 255, 0.02)';
                ctx.fillRect(0, H - 30, W, 30);
                ctx.strokeStyle = 'rgba(100, 200, 255, 0.05)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(0, H - 30);
                ctx.lineTo(W, H - 30);
                ctx.stroke();
                
                // Character
                const charX = W / 2;
                const charY = H - 100;
                const charSize = 30 + size * 3;
                drawCharacter(ctx, charX, charY, charSize);
                
                // Hoop (around character)
                const hoopRadius = 65 + size * 4;
                drawHoop(ctx, charX, charY - 10, hoopRadius);
                
                // Status info
                ctx.save();
                ctx.fillStyle = 'rgba(200, 220, 240, 0.2)';
                ctx.font = '13px monospace';
                ctx.textAlign = 'right';
                ctx.textBaseline = 'bottom';
                ctx.fillText(`Spins: ${spinCount}`, W - 20, H - 10);
                
                ctx.textAlign = 'left';
                const status = isSpinning ? '🔄 SPINNING' : '⏸️ STOPPED';
                ctx.fillText(status, 20, H - 10);
                
                if (isSpinning) {
                    const rpm = (spinVelocity * 60).toFixed(0);
                    ctx.fillText(`RPM: ${rpm}`, 20, H - 30);
                }
                ctx.restore();
            }

            // ---- Animation Loop ----
            function animate() {
                if (!isAnimating) {
                    requestAnimationFrame(animate);
                    return;
                }
                
                time += 0.01;
                
                updatePhysics();
                render();
                
                requestAnimationFrame(animate);
            }

            // ---- Toggle Animation ----
            function toggleAnimation() {
                isAnimating = !isAnimating;
                toggleBtn.textContent = isAnimating ? '⏸️ PAUSE' : '▶️ PLAY';
            }

            // ---- Update Labels ----
            speedSlider.addEventListener('input', function() {
                speedLabel.textContent = this.value;
                if (isSpinning) {
                    spinVelocity = 0.5 + speed * 0.15;
                }
            });
            sizeSlider.addEventListener('input', function() {
                size = parseInt(this.value);
                sizeLabel.textContent = size;
            });

            // ---- Event Listeners ----
            spinBtn.addEventListener('click', spinHoop);
            stopBtn.addEventListener('click', stopHoop);
            resetBtn.addEventListener('click', resetHoop);
            toggleBtn.addEventListener('click', toggleAnimation);

            // ---- Keyboard Shortcuts ----
            document.addEventListener('keydown', function(e) {
                if (e.key === ' ' || e.key === 'Space') {
                    e.preventDefault();
                    if (!isSpinning) {
                        spinHoop();
                    }
                }
                if (e.key === 's' || e.key === 'S') {
                    stopHoop();
                }
                if (e.key === 'r' || e.key === 'R') {
                    resetHoop();
                }
                if (e.key === 'p' || e.key === 'P') {
                    toggleAnimation();
                }
            });

            // ---- Initialize ----
            render();
            animate();

            console.log('🔄 Hula Hoop · Click Spin or press Space to start the hula hoop!');
        })();
    </script>
</body>
</html>
