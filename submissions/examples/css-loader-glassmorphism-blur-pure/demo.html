<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Loader: Glassmorphism Blur</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="layout-container">
        
        <header class="section-header">
            <h1 class="title">Pure CSS Loader: Glassmorphism Blur</h1>
            <p class="subtitle">A premium, frosted-glass loading animation utilizing backdrop-filter blurs and vibrant, moving background meshes.</p>
        </header>

        <div class="demo-area">
            
            <div class="loader-container" aria-label="Loading content, glassmorphism animation playing">
                
                <!-- 
                  [TECHNIQUE] Vibrant Mesh Background 
                  Glassmorphism only looks good if there is something colorful behind it to blur.
                  We use drifting blurred blobs to create a dynamic backdrop.
                -->
                <div class="mesh-bg" aria-hidden="true">
                    <div class="mesh-blob blob-1"></div>
                    <div class="mesh-blob blob-2"></div>
                    <div class="mesh-blob blob-3"></div>
                </div>
                
                <!-- 
                  [TECHNIQUE] The Frosted Glass Card
                  The primary container uses backdrop-filter: blur() 
                  to create the frosted glass effect.
                -->
                <div class="glass-card">
                    
                    <div class="spinner">
                        <div class="spinner-ring"></div>
                        <div class="spinner-dot"></div>
                    </div>
                    
                    <div class="loading-text">Loading...</div>
                    
                </div>
                
            </div>
            
        </div>
        
    </div>

</body>
</html>
