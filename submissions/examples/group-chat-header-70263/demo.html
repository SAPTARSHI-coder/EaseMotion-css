<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Group Chat Header</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <section class="demo" aria-labelledby="demo-title">
            <h1 id="demo-title" class="sr-only">CSS Group Chat Header</h1>

            <div class="ease-chat-header-container">
                <header class="ease-group-chat-header">
                    <button class="ease-back-btn" aria-label="Go back">
                        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
                            <path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>

                    <div class="ease-group-info" tabindex="0" role="button" aria-label="View group info: Project Phoenix, 4 members online">
                        <div class="ease-avatar-group" aria-hidden="true">
                            <img src="https://ui-avatars.com/api/?name=Alice&background=4fd1c5&color=fff&size=40" alt="" class="ease-avatar">
                            <img src="https://ui-avatars.com/api/?name=Bob&background=3182ce&color=fff&size=40" alt="" class="ease-avatar">
                            <img src="https://ui-avatars.com/api/?name=Charlie&background=e53e3e&color=fff&size=40" alt="" class="ease-avatar">
                            <div class="ease-avatar-more">+2</div>
                        </div>
                        <div class="ease-group-text">
                            <h2 class="ease-group-name">Project Phoenix</h2>
                            <span class="ease-group-status">
                                <span class="ease-status-dot"></span> 4 online
                            </span>
                        </div>
                    </div>

                    <div class="ease-header-actions">
                        <button class="ease-action-btn" aria-label="Start video call">
                            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                                <path d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14v-4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                <rect x="3" y="6" width="12" height="12" rx="2" ry="2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </button>
                        <button class="ease-action-btn" aria-label="More options">
                            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                                <circle cx="12" cy="5" r="1.5" fill="currentColor"/>
                                <circle cx="12" cy="12" r="1.5" fill="currentColor"/>
                                <circle cx="12" cy="19" r="1.5" fill="currentColor"/>
                            </svg>
                        </button>
                    </div>
                </header>
            </div>
        </section>
    </main>
</body>
</html>
