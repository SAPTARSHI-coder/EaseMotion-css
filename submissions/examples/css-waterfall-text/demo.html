<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Accessible CSS-only waterfall text animation where letters fall sequentially."
  >

  <title>CSS Waterfall Text</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="page">
    <section class="waterfall-demo" aria-labelledby="waterfall-title">

      <p class="eyebrow">CSS Animation</p>

      <h1 id="waterfall-title" class="waterfall-text" aria-label="Waterfall">
        <span aria-hidden="true">
          <span style="--i: 0">W</span>
          <span style="--i: 1">a</span>
          <span style="--i: 2">t</span>
          <span style="--i: 3">e</span>
          <span style="--i: 4">r</span>
          <span style="--i: 5">f</span>
          <span style="--i: 6">a</span>
          <span style="--i: 7">l</span>
          <span style="--i: 8">l</span>
        </span>
      </h1>

      <p class="description">
        A pure CSS animation where each letter falls into place sequentially.
      </p>

      <div class="demo-controls" aria-hidden="true">
        <span class="status-dot"></span>
        <span>CSS animation • No JavaScript</span>
      </div>

    </section>
  </main>
</body>
</html>
