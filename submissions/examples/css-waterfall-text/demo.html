<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Waterfall Text - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="em-waterfall-page">
        <div class="em-card" role="region" aria-label="Waterfall Text Showcase" tabindex="0">
            <span class="em-card-badge">TYPOGRAPHY ANIMATIONS</span>
            <h1 class="em-card-title">Waterfall Text</h1>
            <p class="em-card-desc">An engaging typography animation where individual letters cascade downwards like a waterfall using pure CSS staggered keyframes.</p>
            
            <!-- Waterfall Text Container -->
            <div class="em-waterfall-container" role="region" aria-label="Animated waterfall text">
                <h2 class="em-waterfall-text">
                    <span style="--i:1;">F</span><span style="--i:2;">A</span><span style="--i:3;">L</span><span style="--i:4;">L</span><span style="--i:5;">I</span><span style="--i:6;">N</span><span style="--i:7;">G</span>
                    <span class="em-space"></span>
                    <span style="--i:8;">W</span><span style="--i:9;">A</span><span style="--i:10;">T</span><span style="--i:11;">E</span><span style="--i:12;">R</span>
                </h2>
            </div>

            <a href="#" class="em-card-btn" role="button">Replay Waterfall</a>
        </div>
    </div>
</body>
</html>
