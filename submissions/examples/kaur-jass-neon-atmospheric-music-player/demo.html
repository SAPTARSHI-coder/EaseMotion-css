<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neon Atmospheric Music Player | GSSoC '26</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Ambient Neon Background Glows -->
  <div class="ambient-background" aria-hidden="true">
    <div class="neon-orb orb-cyan"></div>
    <div class="neon-orb orb-magenta"></div>
  </div>

  <main class="player-container">
    <!-- Header -->
    <header class="player-header">
      <span class="badge">Neon Component v40.5</span>
      <h1 class="title">Atmospheric Player</h1>
      <p class="subtitle">Immersive cybernetic soundscapes & audio visualizer</p>
    </header>

    <!-- Neon Player Card -->
    <section class="neon-card">
      <!-- Album Art & Holographic Ring -->
      <div class="album-art-wrapper">
        <div class="neon-ring" id="neon-ring"></div>
        <div class="album-art">
          <div class="vinyl-disc" id="vinyl-disc"></div>
          <span class="album-icon">🎵</span>
        </div>
      </div>

      <!-- Track Information -->
      <div class="track-info">
        <h2 class="track-title" id="track-title">Cyber City Lights</h2>
        <p class="artist-name" id="artist-name">Neon Synthwave</p>
      </div>

      <!-- Dynamic Audio Visualizer Equalizer -->
      <div class="visualizer" id="visualizer">
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
      </div>

      <!-- Progress Scrub Bar -->
      <div class="progress-section">
        <input 
          type="range" 
          id="progress-bar" 
          class="neon-range" 
          value="0" 
          min="0" 
          max="100" 
          aria-label="Track progress bar"
        />
        <div class="time-stamps">
          <span id="current-time">0:00</span>
          <span id="duration-time">3:45</span>
        </div>
      </div>

      <!-- Playback Controls -->
      <div class="controls">
        <button type="button" id="prev-btn" class="ctrl-btn" aria-label="Previous Track">⏮</button>
        <button type="button" id="play-btn" class="ctrl-btn play-btn" aria-label="Play or Pause">
          <span id="play-icon">▶</span>
        </button>
        <button type="button" id="next-btn" class="ctrl-btn" aria-label="Next Track">⏭</button>
      </div>

      <!-- Volume & Mode Controls -->
      <div class="secondary-controls">
        <span class="volume-icon">🔊</span>
        <input 
          type="range" 
          id="volume-bar" 
          class="neon-range volume-range" 
          value="80" 
          min="0" 
          max="100" 
          aria-label="Volume slider"
        />
      </div>
    </section>
  </main>

  <script>
    // Track Playlist Data
    const playlist = [
      { title: "Cyber City Lights", artist: "Neon Synthwave", duration: 225 },
      { title: "Midnight Atmospheric Flow", artist: "Aura Soundscapes", duration: 198 },
      { title: "Quantum Horizon v4", artist: "GSSoC Cyberlabs", duration: 242 }
    ];

    let currentTrackIndex = 0;
    let isPlaying = false;
    let currentSeconds = 0;
    let timerInterval = null;

    // DOM Elements
    const trackTitle = document.getElementById('track-title');
    const artistName = document.getElementById('artist-name');
    const playBtn = document.getElementById('play-btn');
    const playIcon = document.getElementById('play-icon');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const progressBar = document.getElementById('progress-bar');
    const currentTimeEl = document.getElementById('current-time');
    const durationTimeEl = document.getElementById('duration-time');
    const vinylDisc = document.getElementById('vinyl-disc');
    const visualizerBars = document.querySelectorAll('.visualizer .bar');

    // Format Seconds to MM:SS
    function formatTime(sec) {
      const mins = Math.floor(sec / 60);
      const secs = Math.floor(sec % 60);
      return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    // Load Track Data
    function loadTrack(index) {
      const track = playlist[index];
      trackTitle.textContent = track.title;
      artistName.textContent = track.artist;
      durationTimeEl.textContent = formatTime(track.duration);
      currentSeconds = 0;
      progressBar.value = 0;
      currentTimeEl.textContent = "0:00";
    }

    // Toggle Play/Pause State
    function togglePlay() {
      isPlaying = !isPlaying;

      if (isPlaying) {
        playIcon.textContent = "❚❚";
        vinylDisc.classList.add('spinning');
        visualizerBars.forEach(bar => bar.classList.add('animating'));
        
        timerInterval = setInterval(() => {
          const track = playlist[currentTrackIndex];
          if (currentSeconds < track.duration) {
            currentSeconds++;
            const pct = (currentSeconds / track.duration) * 100;
            progressBar.value = pct;
            currentTimeEl.textContent = formatTime(currentSeconds);
          } else {
            nextTrack();
          }
        }, 1000);

      } else {
        playIcon.textContent = "▶";
        vinylDisc.classList.remove('spinning');
        visualizerBars.forEach(bar => bar.classList.remove('animating'));
        clearInterval(timerInterval);
      }
    }

    // Skip to Next Track
    function nextTrack() {
      clearInterval(timerInterval);
      currentTrackIndex = (currentTrackIndex + 1) % playlist.length;
      loadTrack(currentTrackIndex);
      if (isPlaying) {
        isPlaying = false;
        togglePlay();
      }
    }

    // Previous Track
    function prevTrack() {
      clearInterval(timerInterval);
      currentTrackIndex = (currentTrackIndex - 1 + playlist.length) % playlist.length;
      loadTrack(currentTrackIndex);
      if (isPlaying) {
        isPlaying = false;
        togglePlay();
      }
    }

    // Scrub Bar Progress Input
    progressBar.addEventListener('input', (e) => {
      const track = playlist[currentTrackIndex];
      const pct = e.target.value;
      currentSeconds = Math.floor((pct / 100) * track.duration);
      currentTimeEl.textContent = formatTime(currentSeconds);
    });

    // Event Listeners
    playBtn.addEventListener('click', togglePlay);
    nextBtn.addEventListener('click', nextTrack);
    prevBtn.addEventListener('click', prevTrack);

    // Initial Setup
    loadTrack(currentTrackIndex);
  </script>
</body>
</html>
