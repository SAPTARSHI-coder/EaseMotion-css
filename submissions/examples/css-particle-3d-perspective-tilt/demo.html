<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Pure CSS 3D perspective tilt particle effect"
  >
  <title>3D Perspective Tilt Particle Effect</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="scene" aria-label="3D perspective particle animation">
    <div class="particle-field" aria-hidden="true">
      <span class="particle particle-1"></span>
      <span class="particle particle-2"></span>
      <span class="particle particle-3"></span>
      <span class="particle particle-4"></span>
      <span class="particle particle-5"></span>
      <span class="particle particle-6"></span>
      <span class="particle particle-7"></span>
      <span class="particle particle-8"></span>
      <span class="particle particle-9"></span>
      <span class="particle particle-10"></span>
    </div>

    <section class="content">
      <span class="label">CSS Particle Effect</span>
      <h1>3D Perspective Tilt</h1>
      <p>
        Floating particles arranged in a layered 3D space with smooth
        perspective and tilt animations.
      </p>
    </section>
  </main>
</body>
</html>
