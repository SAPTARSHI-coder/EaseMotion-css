<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ease Fluid Tab Content Crossfade Container</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="tab-crossfade-body">
  <div class="tab-card">
    <div class="tab-header">
      <button class="t-btn active" onclick="switchTab(0)">Tab 1</button>
      <button class="t-btn" onclick="switchTab(1)">Tab 2</button>
    </div>
    <div class="tab-panel active" id="p0">Content Panel 1 - Overview</div>
    <div class="tab-panel" id="p1">Content Panel 2 - Settings</div>
  </div>

  <script>
    function switchTab(idx) {
      document.querySelectorAll('.t-btn').forEach((b, i) => b.classList.toggle('active', i===idx));
      document.querySelectorAll('.tab-panel').forEach((p, i) => p.classList.toggle('active', i===idx));
    }
  </script>
</body>
</html>
