<body>

<div class="ease-fluid-tab-content-crossfade">

    <div class="tablist" role="tablist">

        <button
            class="tab active"
            role="tab"
            id="tab-overview"
            aria-selected="true"
            aria-controls="panel-overview">
            Overview
        </button>

        <button
            class="tab"
            role="tab"
            id="tab-features"
            aria-selected="false"
            aria-controls="panel-features">
            Features
        </button>

        <button
            class="tab"
            role="tab"
            id="tab-pricing"
            aria-selected="false"
            aria-controls="panel-pricing">
            Pricing
        </button>

        <span class="tab-indicator"></span>

    </div>

    <div class="tab-content">

        <section
            id="panel-overview"
            class="panel active"
            role="tabpanel"
            aria-labelledby="tab-overview">

            <h2>Overview</h2>

            <p>
                This component demonstrates smooth height transitions
                and animated tab switching.
            </p>

        </section>

        <section
            id="panel-features"
            class="panel"
            role="tabpanel"
            aria-labelledby="tab-features">

            <h2>Features</h2>

            <ul>
                <li>Fluid height animation</li>
                <li>Crossfade effect</li>
                <li>Sliding content</li>
                <li>Keyboard navigation</li>
                <li>Accessible ARIA tabs</li>
            </ul>

        </section>

        <section
            id="panel-pricing"
            class="panel"
            role="tabpanel"
            aria-labelledby="tab-pricing">

            <h2>Pricing</h2>

            <p>Free for personal and educational use.</p>

            <p>MIT License.</p>

        </section>

    </div>

</div>

<script src="script.js"></script>

</body>
