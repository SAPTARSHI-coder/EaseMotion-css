<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cursor Proximity Card</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <article class="proximity-card">

            <div class="icon">
                ✨
            </div>

            <h2>Cursor Proximity Card</h2>

            <p>
                Watch the card softly react as your cursor approaches,
                creating a premium interactive experience.
            </p>

            <button type="button">
                Learn More →
            </button>

        </article>

    </main>

    <script>
        const card = document.querySelector(".proximity-card");

        document.addEventListener("mousemove", (event) => {

            const rect = card.getBoundingClientRect();

            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            const dx = event.clientX - centerX;
            const dy = event.clientY - centerY;

            const distance = Math.sqrt(dx * dx + dy * dy);

            const maxDistance = 250;

            const glow = Math.max(0, 1 - distance / maxDistance);

            card.style.setProperty("--mouse-x", `${event.clientX - rect.left}px`);
            card.style.setProperty("--mouse-y", `${event.clientY - rect.top}px`);
            card.style.setProperty("--glow-opacity", glow * 0.45);

        });
    </script>

</body>

</html>
