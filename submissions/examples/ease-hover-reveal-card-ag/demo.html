<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hover Reveal Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <div class="card-image">
            <img src="https://images.unsplash.com/photo-1518791841217-8f162f1e1131?ixlib=rb-1.2.1&auto=format&fit=crop&w=800&q=80" alt="Cute Cat">
        </div>
        <div class="card-content">
            <h3 class="card-title">Feline Friend</h3>
            <p class="card-description">Cats are small, carnivorous mammals, known for their agility, sharp claws, and playful nature. They make excellent companions.</p>
            <a href="#" class="card-btn">Learn More</a>
        </div>
    </div>
</body>
</html>
