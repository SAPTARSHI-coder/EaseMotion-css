<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Pure CSS morphing tab indicator with animated pill"
  >
  <title>CSS Morphing Tab Indicator</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="demo">
    <section class="component" aria-labelledby="tabs-title">
      <h1 id="tabs-title">Morphing Tab Indicator</h1>

      <div class="tabs-wrapper">
        <div class="tabs" role="tablist" aria-label="Content sections">

          <input
            type="radio"
            name="tabs"
            id="tab-home"
            checked
          >
          <label for="tab-home" role="tab">Home</label>

          <input
            type="radio"
            name="tabs"
            id="tab-profile"
          >
          <label for="tab-profile" role="tab">Profile</label>

          <input
            type="radio"
            name="tabs"
            id="tab-settings"
          >
          <label for="tab-settings" role="tab">Settings</label>

          <span class="tab-indicator" aria-hidden="true"></span>
        </div>
      </div>

      <div class="tab-content">
        <div class="content home-content">
          <h2>Home</h2>
          <p>Welcome to the home section.</p>
        </div>

        <div class="content profile-content">
          <h2>Profile</h2>
          <p>View your profile information here.</p>
        </div>

        <div class="content settings-content">
          <h2>Settings</h2>
          <p>Manage your preferences and settings.</p>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
