<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ease Fountain Pen Nib Flex</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

<div class="ease-fountain-pen-nib-flex">

  <div class="pen-housing">

    <div class="label">
      FOUNTAIN PEN
      <span>INK FLEX SYSTEM</span>
    </div>

    <div class="nib-area">

      <div class="nib">
        <div class="split-line"></div>
      </div>

      <div class="ink-drop"></div>

    </div>

    <div class="paper">
      <div class="ink-line"></div>
    </div>

    <div class="status">
      <span></span>
      INK FLOW ACTIVE
    </div>

  </div>

</div>

</body>
</html>
