<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>skew-active-feature-grid demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body style="padding: 3rem; background:#fafafa;">

  <div class="grid-skew">
    <div class="grid-skew__card">
      <span class="grid-skew__icon">🚀</span>
      <h3 class="grid-skew__title">Fast Shipping</h3>
      <p class="grid-skew__text">Orders processed and dispatched within 24 hours.</p>
    </div>
    <div class="grid-skew__card">
      <span class="grid-skew__icon">🔒</span>
      <h3 class="grid-skew__title">Secure Checkout</h3>
      <p class="grid-skew__text">Encrypted payments with buyer protection built in.</p>
    </div>
    <div class="grid-skew__card">
      <span class="grid-skew__icon">↩️</span>
      <h3 class="grid-skew__title">Easy Returns</h3>
      <p class="grid-skew__text">30-day hassle-free return window on every order.</p>
    </div>
  </div>

</body>
</html>
