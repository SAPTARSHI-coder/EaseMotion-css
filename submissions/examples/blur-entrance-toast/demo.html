<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CSS Blur-Entrance Toast for Gaming Hub layouts">
  <title>Blur-Entrance Toast</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="demo">
    <section class="toast-demo" aria-label="Blur-Entrance Toast demonstration">
      <div class="toast" role="status">
        <div class="toast__icon" aria-hidden="true">
          ✓
        </div>

        <div class="toast__content">
          <span class="toast__label">GAME CENTER</span>
          <h1 class="toast__title">LEVEL UNLOCKED</h1>
          <p class="toast__message">
            New rewards and challenges are now available.
          </p>
        </div>

        <button class="toast__close" type="button" aria-label="Close notification">
          ×
        </button>
      </div>
    </section>
  </main>

</body>
</html>
