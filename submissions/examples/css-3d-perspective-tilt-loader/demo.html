<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <meta
    name="description"
    content="Accessible pure CSS 3D Perspective Tilt Loader"
  />

  <title>3D Perspective Tilt Loader</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main class="demo">
    <section
      class="loader-card"
      aria-labelledby="loader-title"
    >
      <div class="loader-wrapper">
        <div
          class="tilt-loader"
          role="status"
          aria-label="Loading"
        >
          <span class="tilt-loader__face"></span>
          <span class="tilt-loader__face"></span>
          <span class="tilt-loader__face"></span>
        </div>
      </div>

      <div class="loader-content">
        <p class="eyebrow">EaseMotion CSS</p>

        <h1 id="loader-title">
          3D Perspective Tilt
        </h1>

        <p class="description">
          A lightweight loader created entirely with
          HTML and vanilla CSS.
        </p>

        <div
          class="status"
          role="status"
          aria-live="polite"
        >
          <span class="status-dot" aria-hidden="true"></span>
          Loading...
        </div>
      </div>
    </section>
  </main>
</body>
</html>
