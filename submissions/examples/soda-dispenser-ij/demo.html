<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-soda-dispenser</title>
</head>
<body>
<main class="sds-card">
  <header class="sds-head">
    <h1 class="sds-title">Soda Fountain</h1>
    <span class="sds-brand">FIZZ</span>
  </header>
  <section class="sds-pour" aria-label="dispenser">
    <span class="sds-nozzle"></span>
    <span class="sds-cup">
      <span class="sds-liquid"></span>
      <span class="sds-bubble sds-bubble-1"></span>
      <span class="sds-bubble sds-bubble-2"></span>
      <span class="sds-bubble sds-bubble-3"></span>
    </span>
  </section>
  <section class="sds-flavors">
    <span class="sds-flavor sds-flavor-cola">Cola</span>
    <span class="sds-flavor sds-flavor-orange">Orange</span>
    <span class="sds-flavor sds-flavor-lemon">Lemon</span>
    <span class="sds-flavor sds-flavor-sel">Berry</span>
  </section>
  <footer class="sds-foot">
    <span class="sds-msg">Select flavor</span>
    <span class="sds-ice">Ice +</span>
  </footer>
</main>
</body>
</html>
