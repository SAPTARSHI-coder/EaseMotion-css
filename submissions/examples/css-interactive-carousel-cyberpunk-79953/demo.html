<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyberpunk Interactive Carousel</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="carousel-container">
  <h1>Cyberpunk Carousel</h1>

  <div class="carousel">
    <div class="card active">
      <h2>Neon City</h2>
      <p>Bright futuristic skyline illuminated by holographic lights.</p>
    </div>

    <div class="card">
      <h2>Cyber Grid</h2>
      <p>Digital highways connecting intelligent systems.</p>
    </div>

    <div class="card">
      <h2>Quantum Core</h2>
      <p>Energy-driven infrastructure powering tomorrow.</p>
    </div>
  </div>

  <div class="controls">
    <button>◀</button>
    <button>▶</button>
  </div>
</div>

</body>
</html>
