<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EaseMotion — Modal Demo</title>
  <link rel="stylesheet" href="../../core/variables.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="demo-container">
    <h1>Modal Component Demo</h1>
    <p>Click the buttons to open different modal styles.</p>
    <button class="demo-btn" onclick="openModal('basic')">Basic Modal</button>
    <button class="demo-btn" onclick="openModal('glass')">Glass Modal</button>
    <button class="demo-btn" onclick="openModal('alert')">Alert Modal</button>
  </div>

  <div id="modal-overlay" class="modal-overlay" onclick="closeModal(event)">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h2 id="modal-title">Modal Title</h2>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>
      <div class="modal-body" id="modal-body">
        <p>Modal content goes here.</p>
      </div>
      <div class="modal-footer">
        <button class="demo-btn secondary" onclick="closeModal()">Cancel</button>
        <button class="demo-btn" onclick="closeModal()">Confirm</button>
      </div>
    </div>
  </div>

  <script>
    function openModal(type) {
      const overlay = document.getElementById('modal-overlay');
      const title = document.getElementById('modal-title');
      const body = document.getElementById('modal-body');
      const modal = overlay.querySelector('.modal');

      modal.className = 'modal';
      if (type === 'glass') modal.classList.add('modal-glass');
      if (type === 'alert') modal.classList.add('modal-alert');

      title.textContent = type === 'alert' ? 'Warning' : 'Modal Title';
      body.innerHTML = type === 'alert'
        ? '<p>This action cannot be undone. Are you sure?</p>'
        : '<p>This is a modal dialog with EaseMotion CSS styling.</p>';

      overlay.classList.add('active');
    }
    function closeModal(e) {
      if (!e || e.target === document.getElementById('modal-overlay')) {
        document.getElementById('modal-overlay').classList.remove('active');
      }
    }
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
  </script>
</body>
</html>
