<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Status Dashboard Matrix</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<section class="status-dashboard">

    <div class="status-header">
        <span class="status-badge">
            <span class="pulse"></span>
            All Systems Operational
        </span>

        <p>99.98% uptime over the last 90 days</p>
    </div>

    <div class="status-card">

        <div class="service">
            <div class="left">
                <span class="dot operational"></span>
                <span>API</span>
            </div>
            <span class="state">Operational</span>
        </div>

        <div class="service">
            <div class="left">
                <span class="dot operational"></span>
                <span>Database</span>
            </div>
            <span class="state">Operational</span>
        </div>

        <div class="service">
            <div class="left">
                <span class="dot degraded"></span>
                <span>CDN</span>
            </div>
            <span class="state warning">Degraded</span>
        </div>

        <div class="service">
            <div class="left">
                <span class="dot operational"></span>
                <span>Webhooks</span>
            </div>
            <span class="state">Operational</span>
        </div>

    </div>

    <h2>90-Day Uptime</h2>

    <div class="uptime-grid">

        <span class="bar good" data-tooltip="99.99%"></span>
        <span class="bar good" data-tooltip="100%"></span>
        <span class="bar good" data-tooltip="99.95%"></span>
        <span class="bar good" data-tooltip="100%"></span>
        <span class="bar warning" data-tooltip="98.8%"></span>
        <span class="bar good" data-tooltip="99.98%"></span>
        <span class="bar good" data-tooltip="100%"></span>
        <span class="bar good" data-tooltip="99.99%"></span>
        <span class="bar good" data-tooltip="100%"></span>
        <span class="bar good" data-tooltip="99.97%"></span>
        <span class="bar good" data-tooltip="100%"></span>
        <span class="bar good" data-tooltip="99.99%"></span>
        <span class="bar good" data-tooltip="100%"></span>
        <span class="bar good" data-tooltip="99.95%"></span>
        <span class="bar good" data-tooltip="99.99%"></span>

    </div>

</section>

</body>
</html>
