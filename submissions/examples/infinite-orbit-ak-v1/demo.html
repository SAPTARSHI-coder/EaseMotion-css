<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orbiting Satellites — EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <p class="label">Pure CSS Orbiting Satellites (Hover to Pause)</p>
  
  <div class="ease-orbit-system">
    <!-- Center Core -->
    <div class="ease-orbit-core">⚛️</div>

    <!-- Orbit Ring + Satellites -->
    <div class="ease-orbit-ring">
      <div class="ease-orbit-item"><span>🚀</span></div>
      <div class="ease-orbit-item"><span>🎨</span></div>
      <div class="ease-orbit-item"><span>⚡</span></div>
      <div class="ease-orbit-item"><span>🔮</span></div>
    </div>
  </div>

</body>
</html>
