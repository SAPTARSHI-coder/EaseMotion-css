<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-bike-computer-dash</title>
</head>
<body>
<main class="bcd-unit">
  <header class="bcd-top">
    <h1 class="bcd-model">RideOS</h1>
    <span class="bcd-gps">GPS on</span>
  </header>
  <section class="bcd-speed" aria-label="current speed">
    <strong class="bcd-value">24.6</strong>
    <span class="bcd-kph">km/h</span>
  </section>
  <section class="bcd-ring" aria-label="cadence ring">
    <span class="bcd-arc"></span>
  </section>
  <section class="bcd-stats" aria-label="ride stats">
    <span class="bcd-cad">Cad 88</span>
    <span class="bcd-hr">HR 142</span>
    <span class="bcd-dist">Dist 12.4</span>
  </section>
  <footer class="bcd-foot">
    <span class="bcd-avg">Avg 21.2</span>
    <span class="bcd-time">01:02:11</span>
  </footer>
</main>
</body>
</html>
