<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Folio Page Turner — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Folio Page Turner demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Folio Page Turner</h1>
      <p class="lede">Rare-book folio page lifting and settling</p>
    </header>

    <section class="ease-folio-page-turner" data-demo="folio-page-turner" aria-live="polite">
      <div class="ease-folio-page-turner__housing">
        <div class="ease-folio-page-turner__bezel">
          <div class="ease-folio-page-turner__face">
            <div class="ease-folio-page-turner__readout">
              <span class="ease-folio-page-turner__label">Folio Page Turner</span>
              <span class="ease-folio-page-turner__value">LIVE</span>
            </div>
            <div class="ease-folio-page-turner__motion" aria-hidden="true">
              <span class="ease-folio-page-turner__a"></span>
              <span class="ease-folio-page-turner__b"></span>
              <span class="ease-folio-page-turner__c"></span>
              <span class="ease-folio-page-turner__d"></span>
            </div>
            <div class="ease-folio-page-turner__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-folio-page-turner__controls">
          <button type="button" class="ease-folio-page-turner__btn primary">Engage</button>
          <button type="button" class="ease-folio-page-turner__btn">Reset</button>
          <label class="ease-folio-page-turner__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-folio-page-turner__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
