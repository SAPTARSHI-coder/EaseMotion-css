<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Blur-Entrance Progress Bar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="product-card">
        <div class="image-placeholder"></div>
        <div class="card-content">
            <h3 class="product-title">Minimalist Backpack</h3>
            <p class="product-desc">Available in Black and Grey.</p>
            
            <div class="progress-wrapper">
                <div class="progress-bar">
                    <div class="progress-fill"></div>
                </div>
                <div class="progress-stats">
                    <span class="stock-text">Low Stock</span>
                    <span class="stock-percent">90% Sold</span>
                </div>
            </div>
            
            <button class="buy-btn">Add to Cart</button>
        </div>
    </div>
</body>
</html>
