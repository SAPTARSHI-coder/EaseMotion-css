<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CSS Skew-Active Tooltip with minimalist tech styling. Pure CSS tooltips that skew into view on hover with clean light UI.">
  <title>Skew-Active Tooltip – Minimalist Tech Layouts</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="sat-page">
    <header class="sat-header">
      <span class="sat-header__label">Minimalist Tech</span>
      <h1 class="sat-header__title">Skew-Active Tooltips</h1>
      <p class="sat-header__sub">Tooltips that skew and slide into view when you hover.</p>
    </header>

    <section class="sat-showcase" aria-label="Tooltip Showcase">
      <div class="sat-group">
        <h2 class="sat-group__title">Top Tooltips</h2>
        <div class="sat-group__items">
          <button class="sat-item" aria-label="Show tooltip for Git">
            <span class="sat-item__text">Git</span>
            <span class="sat-tip sat-tip--top">Distributed version control system</span>
          </button>
          <button class="sat-item" aria-label="Show tooltip for Docker">
            <span class="sat-item__text">Docker</span>
            <span class="sat-tip sat-tip--top">Container runtime and toolkit</span>
          </button>
          <button class="sat-item" aria-label="Show tooltip for Kubernetes">
            <span class="sat-item__text">K8s</span>
            <span class="sat-tip sat-tip--top">Container orchestration platform</span>
          </button>
        </div>
      </div>

      <div class="sat-group">
        <h2 class="sat-group__title">Bottom Tooltips</h2>
        <div class="sat-group__items">
          <button class="sat-item sat-item--dark" aria-label="Show tooltip for npm">
            <span class="sat-item__text">npm</span>
            <span class="sat-tip sat-tip--bottom">Node package manager registry</span>
          </button>
          <button class="sat-item sat-item--dark" aria-label="Show tooltip for Terraform">
            <span class="sat-item__text">Terraform</span>
            <span class="sat-tip sat-tip--bottom">Infrastructure as code tool</span>
          </button>
          <button class="sat-item sat-item--dark" aria-label="Show tooltip for Ansible">
            <span class="sat-item__text">Ansible</span>
            <span class="sat-tip sat-tip--bottom">Agentless automation engine</span>
          </button>
        </div>
      </div>

      <div class="sat-group">
        <h2 class="sat-group__title">Side Tooltips</h2>
        <div class="sat-group__items">
          <button class="sat-item sat-item--outline" aria-label="Show tooltip for PostgreSQL">
            <span class="sat-item__text">Postgres</span>
            <span class="sat-tip sat-tip--left">Advanced open-source SQL database</span>
          </button>
          <button class="sat-item sat-item--outline" aria-label="Show tooltip for Redis">
            <span class="sat-item__text">Redis</span>
            <span class="sat-tip sat-tip--right">In-memory data structure store</span>
          </button>
        </div>
      </div>
    </section>

    <div class="sat-bg" aria-hidden="true"></div>
  </main>

</body>
</html>
