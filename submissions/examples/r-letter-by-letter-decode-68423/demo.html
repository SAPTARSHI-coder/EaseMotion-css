<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Pure CSS letter-by-letter decode animation">
  <title>Letter-by-letter Decode</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="demo">
    <section class="decode-card" aria-labelledby="decode-title">
      <span class="eyebrow">EaseMotion CSS</span>

      <h1 id="decode-title" class="decode" aria-label="Decode the future">
        <span class="word" aria-hidden="true">
          <span class="letter" style="--i: 0" data-char="D">X</span>
          <span class="letter" style="--i: 1" data-char="e">7</span>
          <span class="letter" style="--i: 2" data-char="c">#</span>
          <span class="letter" style="--i: 3" data-char="o">@</span>
          <span class="letter" style="--i: 4" data-char="d">4</span>
          <span class="letter" style="--i: 5" data-char="e">%</span>
        </span>

        <span class="space" aria-hidden="true"></span>

        <span class="word" aria-hidden="true">
          <span class="letter" style="--i: 6" data-char="t">9</span>
          <span class="letter" style="--i: 7" data-char="h">!</span>
          <span class="letter" style="--i: 8" data-char="e">#</span>
        </span>

        <span class="space" aria-hidden="true"></span>

        <span class="word" aria-hidden="true">
          <span class="letter" style="--i: 9" data-char="f">%</span>
          <span class="letter" style="--i: 10" data-char="u">2</span>
          <span class="letter" style="--i: 11" data-char="t">+</span>
          <span class="letter" style="--i: 12" data-char="u">8</span>
          <span class="letter" style="--i: 13" data-char="r">?</span>
          <span class="letter" style="--i: 14" data-char="e">6</span>
        </span>
      </h1>

      <p class="description">
        A lightweight text reveal created entirely with HTML and CSS.
      </p>

      <div class="status" aria-hidden="true">
        <span class="status-dot"></span>
        Decoding...
      </div>
    </section>
  </main>

</body>
</html>
