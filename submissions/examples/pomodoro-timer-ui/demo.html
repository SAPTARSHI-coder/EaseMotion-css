<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pomodoro Timer &mdash; EaseMotion CSS Demo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="page-head">
    <p class="kicker">EaseMotion CSS &middot; Productivity</p>
    <h1>Pomodoro Timer</h1>
    <p class="sub">Twenty-five minutes of pure focus &mdash; the ring is always counting.</p>
  </header>
  <main class="stage">
    <div class="pt-timer">
      <div class="pt-inner">25:00<small>focus</small></div>
    </div>
  </main>
  <p class="stage-caption">The red arc sweeps away as time flows.</p>
  <footer class="page-foot">
    <span>Pure CSS &middot; zero dependencies</span>
    <span>Focus ring</span>
  </footer>
</body>
</html>
