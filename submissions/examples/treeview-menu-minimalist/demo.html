<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EaseMotion - Minimalist Treeview Menu</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="em-container">
    <nav class="em-menu-wrapper" aria-label="Documentation structure">
      <h2 class="em-menu-title">Documentation</h2>
      
      <!-- Pure CSS Minimalist Treeview -->
      <ul class="em-treeview">
        
        <!-- Node 1 -->
        <li class="em-treeview-node">
          <input type="checkbox" id="doc-getting-started" class="em-treeview-toggle" aria-hidden="true" />
          <label for="doc-getting-started" class="em-treeview-label" tabindex="0" role="button" aria-expanded="false">
            <span class="em-treeview-icon"></span>
            Getting Started
          </label>
          <div class="em-treeview-sub-container">
            <ul class="em-treeview-sub">
              <li class="em-treeview-leaf">
                <a href="#" class="em-treeview-link">Installation</a>
              </li>
              <li class="em-treeview-leaf">
                <a href="#" class="em-treeview-link">Quick Start</a>
              </li>
            </ul>
          </div>
        </li>

        <!-- Node 2 -->
        <li class="em-treeview-node">
          <input type="checkbox" id="doc-components" class="em-treeview-toggle" aria-hidden="true" />
          <label for="doc-components" class="em-treeview-label" tabindex="0" role="button" aria-expanded="false">
            <span class="em-treeview-icon"></span>
            Components
          </label>
          <div class="em-treeview-sub-container">
            <ul class="em-treeview-sub">
              <li class="em-treeview-leaf">
                <a href="#" class="em-treeview-link">Buttons</a>
              </li>
              
              <!-- Nested Node -->
              <li class="em-treeview-node">
                <input type="checkbox" id="doc-comp-forms" class="em-treeview-toggle" aria-hidden="true" />
                <label for="doc-comp-forms" class="em-treeview-label" tabindex="0" role="button" aria-expanded="false">
                  <span class="em-treeview-icon"></span>
                  Forms
                </label>
                <div class="em-treeview-sub-container">
                  <ul class="em-treeview-sub">
                    <li class="em-treeview-leaf">
                      <a href="#" class="em-treeview-link">Input Fields</a>
                    </li>
                    <li class="em-treeview-leaf">
                      <a href="#" class="em-treeview-link">Checkboxes</a>
                    </li>
                  </ul>
                </div>
              </li>
              
            </ul>
          </div>
        </li>
        
        <!-- Leaf (Direct link at root level) -->
        <li class="em-treeview-leaf">
          <a href="#" class="em-treeview-link em-treeview-label-root">
            <span class="em-treeview-icon-empty"></span>
            Changelog
          </a>
        </li>
        
      </ul>
    </nav>
  </main>
</body>
</html>
