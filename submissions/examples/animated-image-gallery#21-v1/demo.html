<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Animated Image Gallery - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="gallery-page">

    <header class="gallery-header">
      <span class="section-pill">Gallery</span>
      <h1>Animated Image Gallery</h1>
      <p>
        A modern responsive gallery component built with pure HTML and CSS.
        Hover over the cards to see the zoom and caption animation.
      </p>
    </header>

    <section class="gallery-grid">

      <!-- Gallery Item 1 -->
      <figure class="gallery-item tall">
        <div class="gallery-thumb thumb-1"></div>

        <figcaption class="gallery-caption">
          <h2>Aurora</h2>
          <p>Gradient visual</p>
        </figcaption>
      </figure>

      <!-- Gallery Item 2 -->
      <figure class="gallery-item">
        <div class="gallery-thumb thumb-2"></div>

        <figcaption class="gallery-caption">
          <h2>Neon City</h2>
          <p>Dark theme</p>
        </figcaption>
      </figure>

      <!-- Gallery Item 3 -->
      <figure class="gallery-item">
        <div class="gallery-thumb thumb-3"></div>

        <figcaption class="gallery-caption">
          <h2>Ocean</h2>
          <p>Calm blue tone</p>
        </figcaption>
      </figure>

      <!-- Gallery Item 4 -->
      <figure class="gallery-item wide">
        <div class="gallery-thumb thumb-4"></div>

        <figcaption class="gallery-caption">
          <h2>Sunset</h2>
          <p>Wide gradient layout</p>
        </figcaption>
      </figure>

      <!-- Gallery Item 5 -->
      <figure class="gallery-item">
        <div class="gallery-thumb thumb-5"></div>

        <figcaption class="gallery-caption">
          <h2>Forest</h2>
          <p>Green gradient</p>
        </figcaption>
      </figure>

      <!-- Gallery Item 6 -->
      <figure class="gallery-item">
        <div class="gallery-thumb thumb-6"></div>

        <figcaption class="gallery-caption">
          <h2>Candy</h2>
          <p>Soft pink style</p>
        </figcaption>
      </figure>

    </section>

  </main>

</body>
</html>
