<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Compression Ratio Audit</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="card">
    <h1>CSS Compression Ratio Audit</h1>

    <table>
        <thead>
            <tr>
                <th>Metric</th>
                <th>Result</th>
                <th>Status</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>Original CSS</td>
                <td>84.2 KB</td>
                <td>✓</td>
            </tr>

            <tr>
                <td>Minified CSS</td>
                <td>23.9 KB</td>
                <td>✓</td>
            </tr>

            <tr>
                <td>Compression Ratio</td>
                <td>71.6%</td>
                <td class="good">PASS</td>
            </tr>

            <tr>
                <td>Performance Budget</td>
                <td>&lt;30 KB</td>
                <td class="good">PASS</td>
            </tr>
        </tbody>
    </table>

    <div class="progress">
        <div class="fill"></div>
    </div>

    <p class="note">
        Example benchmark dashboard demonstrating a CSS compression audit.
    </p>
</div>

</body>
</html>
