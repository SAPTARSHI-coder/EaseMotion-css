<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ease-phosphor-amber — CRT Theme</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: var(--crt-bg); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; font-family: var(--crt-font-family); }
    .crt-screen { width: 480px; max-width: 100%; background: var(--crt-bg); border: 3px solid #3a2800; border-radius: 8px; padding: 1.5rem; position: relative; overflow: hidden; animation: crt-power-on 0.8s ease-out both; }
    .crt-screen::before { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,var(--crt-scanline-opacity)) 2px, rgba(0,0,0,var(--crt-scanline-opacity)) 4px); pointer-events: none; z-index: 10; }
    .crt-screen::after { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.3) 100%); pointer-events: none; z-index: 11; }
    .crt-scan-line { position: absolute; top: 0; left: 0; right: 0; height: 4px; background: linear-gradient(180deg, transparent, rgba(255,176,0,0.06), transparent); animation: crt-scan 8s linear infinite; pointer-events: none; z-index: 12; }
    .crt-prompt { color: var(--crt-fg); font-size: var(--crt-font-size); line-height: 1.6; text-shadow: 0 0 var(--crt-glow-spread) var(--crt-glow-color); }
    .crt-cmd { color: var(--crt-fg-bright); }
    .crt-output { color: var(--crt-fg-dim); }
    .crt-cursor { display: inline-block; width: 8px; height: 1.1em; background: var(--crt-fg); vertical-align: text-bottom; animation: crt-cursor-blink 1s step-end infinite; box-shadow: 0 0 var(--crt-glow-spread) var(--crt-glow-color); }
    .crt-boot-line { display: inline-block; overflow: hidden; white-space: nowrap; border-right: 2px solid var(--crt-fg); animation: crt-boot-line 0.8s steps(30) 0.3s forwards; width: 0; color: var(--crt-fg); }
    .crt-flicker { animation: crt-flicker var(--crt-flicker-duration) ease-in-out infinite; }
    .crt-label { font-size: 0.7rem; color: var(--crt-fg-dim); margin-bottom: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; }
  </style>
</head>
<body>
  <div class="crt-screen crt-flicker">
    <div class="crt-scan-line"></div>
    <div class="crt-label">Phosphor Amber CRT Terminal v2.1</div>
    <div class="crt-prompt">
      <span class="crt-output">$ boot sequence initiated...</span><br/>
      <span class="crt-output">$ loading kernel modules...</span><br/>
      <span class="crt-output">$ mount /dev/root</span><br/>
      <span class="crt-output">$ starting network services...</span><br/>
      <span class="crt-output">$ </span><span class="crt-boot-line">SYSTEM READY_</span><br/><br/>
      <span class="crt-output">user@phosphor:~$ </span><span class="crt-cmd">ls -la</span><br/>
      <span class="crt-output">total 4096</span><br/>
      <span class="crt-output">drwxr-xr-x  amber-theme/</span><br/>
      <span class="crt-output">-rw-r--r--  glow.css</span><br/>
      <span class="crt-output">-rw-r--r--  scanlines.css</span><br/>
      <span class="crt-output">-rw-r--r--  flicker.css</span><br/>
      <span class="crt-output">user@phosphor:~$ </span><span class="crt-cursor"></span>
    </div>
  </div>
</body>
</html>
