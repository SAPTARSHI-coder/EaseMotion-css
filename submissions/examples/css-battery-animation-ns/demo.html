<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Battery Animation | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="battery-demo-container">
    
    <!-- Battery Animation Component -->
    <article class="ease-battery-card" aria-label="Device Power Status">
      
      <header class="ease-battery-header">
        <h2>Power State</h2>
        <p>Continuous draining and charging fluid sequence</p>
      </header>

      <!-- Accessible Battery Viewport -->
      <div class="ease-battery-wrapper" role="progressbar" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100" aria-label="Battery charge level: cycling">
        <div class="ease-battery-liquid"></div>
      </div>

      <div class="ease-battery-meta">
        <span class="ease-battery-percentage">⚡ Active</span>
        <span class="ease-battery-status">Fluid Charge Cycle</span>
      </div>

    </article>

  </main>

</body>
</html>
