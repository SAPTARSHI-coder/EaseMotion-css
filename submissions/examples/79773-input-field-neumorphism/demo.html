<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <meta
    name="description"
    content="CSS-only input field with neumorphism styling."
  />

  <title>Neumorphic Input Field</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <main class="page">

    <section class="demo">

      <span class="eyebrow">EASEMOTION CSS</span>

      <h1>Neumorphic Input Field</h1>

      <p class="intro">
        A clean CSS-only input field with soft depth,
        tactile focus feedback, and responsive styling.
      </p>

      <div class="input-card">

        <div class="input-card__header">

          <span class="input-card__eyebrow">
            USER PROFILE
          </span>

          <span class="input-card__badge">
            CSS ONLY
          </span>

        </div>

        <form class="input-form">

          <div class="field">

            <label
              class="field__label"
              for="name"
            >
              Full Name
            </label>

            <div class="field__control">

              <span class="field__icon" aria-hidden="true">
                A
              </span>

              <input
                id="name"
                name="name"
                type="text"
                placeholder="Enter your full name"
                autocomplete="name"
              />

            </div>

            <small class="field__hint">
              Use your preferred display name.
            </small>

          </div>

          <div class="field">

            <label
              class="field__label"
              for="email"
            >
              Email Address
            </label>

            <div class="field__control">

              <span class="field__icon" aria-hidden="true">
                @
              </span>

              <input
                id="email"
                name="email"
                type="email"
                placeholder="you@example.com"
                autocomplete="email"
              />

            </div>

            <small class="field__hint">
              We will never share your email.
            </small>

          </div>

          <div class="field">

            <label
              class="field__label"
              for="message"
            >
              Message
            </label>

            <div class="field__control field__control--textarea">

              <span class="field__icon" aria-hidden="true">
                ✦
              </span>

              <textarea
                id="message"
                name="message"
                rows="4"
                placeholder="Write something..."
              ></textarea>

            </div>

          </div>

          <button
            class="submit-button"
            type="submit"
          >
            Save Details
          </button>

        </form>

      </div>

      <p class="demo__note">
        Click an input to see the inset neumorphic focus state.
      </p>

    </section>

  </main>

</body>
</html>
