<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-elevator-button-panel demo</title>
</head>
<body>
<div class="ebp-panel">
  <div class="ebp-display"><b class="ebp-floor">3</b><span class="ebp-arrow ebp-up">▲</span><span class="ebp-arrow ebp-down">▼</span></div>
  <div class="ebp-keys">
    <button class="ebp-btn">G</button>
    <button class="ebp-btn">1</button>
    <button class="ebp-btn">2</button>
    <button class="ebp-btn">3</button>
    <button class="ebp-btn">4</button>
    <button class="ebp-btn">5</button>
  </div>
  <div class="ebp-door"><span class="ebp-open">OPEN</span><span class="ebp-close">CLOSE</span></div>
</div>
</body>
</html>
