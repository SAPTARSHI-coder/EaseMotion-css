<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EaseMotion CSS — Retro Radio Station Tuner</title>
<link rel="stylesheet" href="style.css">
<style>
  body {
    background: #1c1c1c;
    margin: 0;
    padding: 2rem 1rem;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  h1 {
    text-align: center;
    font-size: 1.4rem;
    color: #f4ead9;
  }
  p.ease-intro {
    text-align: center;
    max-width: 480px;
    margin: 0.5rem auto 1.5rem;
    color: #a89f92;
    font-size: 0.95rem;
  }
</style>
</head>
<body>

  <h1>Retro Radio Station Tuner</h1>
  <p class="ease-intro">
    A CSS-only tuner dial. Click a preset or Tab to the station group and
    use the Arrow keys to change stations — the needle and readout update
    with no JavaScript.
  </p>

  <div class="ease-tuner">
    <div class="ease-tuner-brand">EaseMotion&nbsp;·&nbsp;FM&nbsp;Tuner</div>

    <fieldset style="border:0; margin:0; padding:0;">
      <legend class="ease-tuner-brand" style="margin-bottom:0.75rem;">
        Select a station
      </legend>

      <input class="ease-tuner-input" type="radio" name="ease-tuner-station"
             id="ease-tuner-88" checked>
      <input class="ease-tuner-input" type="radio" name="ease-tuner-station"
             id="ease-tuner-94">
      <input class="ease-tuner-input" type="radio" name="ease-tuner-station"
             id="ease-tuner-101">
      <input class="ease-tuner-input" type="radio" name="ease-tuner-station"
             id="ease-tuner-107">
      <input class="ease-tuner-input" type="radio" name="ease-tuner-station"
             id="ease-tuner-108">

      <div class="ease-tuner-face">
        <div class="ease-tuner-scale" aria-hidden="true">
          <span class="ease-tuner-tick ease-tuner-tick--major"></span>
          <span class="ease-tuner-tick"></span>
          <span class="ease-tuner-tick"></span>
          <span class="ease-tuner-tick ease-tuner-tick--major"></span>
          <span class="ease-tuner-tick"></span>
          <span class="ease-tuner-tick"></span>
          <span class="ease-tuner-tick ease-tuner-tick--major"></span>
          <span class="ease-tuner-tick"></span>
          <span class="ease-tuner-tick"></span>
          <span class="ease-tuner-tick ease-tuner-tick--major"></span>
          <span class="ease-tuner-needle"></span>
        </div>

        <div class="ease-tuner-display" role="status" aria-live="polite">
          <span class="ease-tuner-freq"></span>
          <span class="ease-tuner-station-name"></span>
        </div>
      </div>

      <div class="ease-tuner-presets">
        <label class="ease-tuner-preset-label" for="ease-tuner-88">88.0</label>
        <label class="ease-tuner-preset-label" for="ease-tuner-94">94.3</label>
        <label class="ease-tuner-preset-label" for="ease-tuner-101">101.5</label>
        <label class="ease-tuner-preset-label" for="ease-tuner-107">107.1</label>
        <label class="ease-tuner-preset-label" for="ease-tuner-108">108.0</label>
      </div>
    </fieldset>
  </div>

</body>
</html>
