<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="CSS wobble on click animation component."
  >
  <title>CSS Wobble on Click</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">
    <section class="demo" aria-labelledby="title">
      <span class="eyebrow">EaseMotion CSS</span>

      <h1 id="title">Wobble on Click</h1>

      <p class="intro">
        Press or focus the buttons to trigger a playful CSS wobble animation.
      </p>

      <div class="button-grid">

        <button class="wobble-button blue" type="button">
          Click Me
        </button>

        <button class="wobble-button purple" type="button">
          Try Again
        </button>

        <button class="wobble-button green" type="button">
          Activate
        </button>

      </div>

      <p class="hint">
        Works with mouse, keyboard, and touch interactions.
      </p>
    </section>
  </main>

</body>
</html>
