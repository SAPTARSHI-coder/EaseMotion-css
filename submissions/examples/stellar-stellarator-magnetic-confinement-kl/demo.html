<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stellarator Magnetic Confinement - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #040208; color: #ffffff;">

    <div class="ease-card ease-card-glass stellarator-container">
        <div class="stellarator-header">
            <h2>Stellarator Coil</h2>
            <span class="ease-badge ease-badge-info">Confined</span>
        </div>
        
        <div class="stellarator-screen ease-center">
            <div class="toroidal-flux flux-1"></div>
            <div class="toroidal-flux flux-2"></div>
            <div class="helical-winding-ring"></div>
            <div class="plasma-core ease-center"></div>
        </div>

        <div class="stellarator-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Temp: 1.2 × 10⁸ K</span>
            <button class="ease-btn ease-btn-primary ease-btn-sm ease-hover-grow">Inject Fuel</button>
        </div>
    </div>

</body>
</html>
