<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Accessible CSS split date input component"
  >
  <title>CSS Split Date Input</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section class="date-card" aria-labelledby="date-title">
      <div class="calendar-icon" aria-hidden="true">
        <span></span>
      </div>

      <div class="content">
        <p class="eyebrow">Date of birth</p>

        <h1 id="date-title">When were you born?</h1>

        <p class="description">
          Enter your date using the three fields below.
        </p>

        <form class="date-form">
          <div class="date-fields">
            <div class="field">
              <label for="day">Day</label>
              <input
                id="day"
                name="day"
                type="text"
                inputmode="numeric"
                autocomplete="bday-day"
                maxlength="2"
                placeholder="DD"
                aria-label="Day"
              >
            </div>

            <span class="separator" aria-hidden="true">/</span>

            <div class="field">
              <label for="month">Month</label>
              <input
                id="month"
                name="month"
                type="text"
                inputmode="numeric"
                autocomplete="bday-month"
                maxlength="2"
                placeholder="MM"
                aria-label="Month"
              >
            </div>

            <span class="separator" aria-hidden="true">/</span>

            <div class="field year-field">
              <label for="year">Year</label>
              <input
                id="year"
                name="year"
                type="text"
                inputmode="numeric"
                autocomplete="bday-year"
                maxlength="4"
                placeholder="YYYY"
                aria-label="Year"
              >
            </div>
          </div>

          <p class="hint">
            Example: 15 / 08 / 2002
          </p>

          <button type="submit">
            Continue
            <span aria-hidden="true">→</span>
          </button>
        </form>
      </div>
    </section>
  </main>
</body>
</html>
