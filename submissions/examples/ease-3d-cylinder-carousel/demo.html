<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ease Infinite 3D Carousel Cylinder</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="ease-cylinder-body">
  <div class="ease-stage">
    <div class="ease-ring" id="ring">
      <div class="ease-panel" style="--i:0">Card 1</div>
      <div class="ease-panel" style="--i:1">Card 2</div>
      <div class="ease-panel" style="--i:2">Card 3</div>
      <div class="ease-panel" style="--i:3">Card 4</div>
      <div class="ease-panel" style="--i:4">Card 5</div>
      <div class="ease-panel" style="--i:5">Card 6</div>
    </div>
  </div>

  <script>
    const ring = document.getElementById('ring');
    let deg = 0;
    setInterval(() => {
      deg += 1;
      ring.style.transform = `rotateY(${deg}deg)`;
    }, 30);
  </script>
</body>
</html>
