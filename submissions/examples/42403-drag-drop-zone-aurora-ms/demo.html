<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aurora Drag Drop Zone</title>
  <link rel="stylesheet" href="../../../easemotion.min.css">
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body style="margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; background: #020617; font-family: 'Outfit', sans-serif; color: #fff;">

  <div style="text-align: center; margin-bottom: 2rem;">
    <h1 style="margin: 0 0 0.5rem 0; font-weight: 600; font-size: 2rem; letter-spacing: -0.02em;">Upload Assets</h1>
    <p style="margin: 0; color: #94a3b8; font-weight: 300;">Drag and drop files to the aurora zone</p>
  </div>

  <div class="ease-aurora-dropzone">
    <!-- Aurora background blobs -->
    <div class="ease-aurora-blob ease-aurora-blob-1"></div>
    <div class="ease-aurora-blob ease-aurora-blob-2"></div>
    <div class="ease-aurora-blob ease-aurora-blob-3"></div>
    
    <!-- Glass content area overlay -->
    <div class="ease-aurora-content">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="ease-aurora-icon"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
      <h3 style="margin: 1rem 0 0.25rem 0; font-size: 1.25rem;">Drop files here</h3>
      <p style="margin: 0; font-size: 0.875rem; color: #cbd5e1;">or click to browse from your computer</p>
      <span class="ease-aurora-btn">Select Files</span>
    </div>
    
    <!-- Hidden file input covering the whole area -->
    <input type="file" class="ease-aurora-input" multiple>
  </div>

</body>
</html>
