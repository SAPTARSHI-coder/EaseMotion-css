
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Infinite Seamless Logo Carousel with Pause on Hover"
  >
  <title>Infinite Logo Carousel</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="page">
    <section class="logo-section" aria-labelledby="logo-title">
      <div class="section-header">
        <span class="eyebrow">TRUSTED TECHNOLOGY</span>
        <h1 id="logo-title">Built for the <span>Future</span></h1>
        <p>
          A seamless infinite logo carousel designed with
          high-contrast accessibility in mind.
        </p>
      </div>

      <div class="carousel" aria-label="Technology partners">
        <div class="carousel-track">

          <div class="logo-card">
            <span class="logo-symbol">◈</span>
            <span>ORBIT</span>
          </div>

          <div class="logo-card">
            <span class="logo-symbol">✦</span>
            <span>NEXUS</span>
          </div>

          <div class="logo-card">
            <span class="logo-symbol">⬢</span>
            <span>VERTEX</span>
          </div>

          <div class="logo-card">
            <span class="logo-symbol">◉</span>
            <span>PULSE</span>
          </div>

          <div class="logo-card">
            <span class="logo-symbol">◆</span>
            <span>QUANTUM</span>
          </div>

          <div class="logo-card">
            <span class="logo-symbol">△</span>
            <span>APEX</span>
          </div>

          <!-- Duplicate set for seamless animation -->

          <div class="logo-card" aria-hidden="true">
            <span class="logo-symbol">◈</span>
            <span>ORBIT</span>
          </div>

          <div class="logo-card" aria-hidden="true">
            <span class="logo-symbol">✦</span>
            <span>NEXUS</span>
          </div>

          <div class="logo-card" aria-hidden="true">
            <span class="logo-symbol">⬢</span>
            <span>VERTEX</span>
          </div>

          <div class="logo-card" aria-hidden="true">
            <span class="logo-symbol">◉</span>
            <span>PULSE</span>
          </div>

          <div class="logo-card" aria-hidden="true">
            <span class="logo-symbol">◆</span>
            <span>QUANTUM</span>
          </div>

          <div class="logo-card" aria-hidden="true">
            <span class="logo-symbol">△</span>
            <span>APEX</span>
          </div>

        </div>
      </div>

      <p class="interaction-hint">
        <span>●</span>
        Hover over the carousel to pause
      </p>
    </section>
  </main>
</body>
</html>
