<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Accessible CSS segmented control with sliding selection indicator">
  <title>CSS Segmented Control</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="page">
    <section class="demo-card" aria-labelledby="title">
      <p class="eyebrow">EaseMotion CSS</p>
      <h1 id="title">Segmented Control</h1>
      <p class="description">
        A responsive iOS-style segmented control built with HTML and CSS.
      </p>

      <div class="segmented-control" role="group" aria-label="View options">
        <input type="radio" name="view" id="day" checked>
        <label for="day">Day</label>

        <input type="radio" name="view" id="week">
        <label for="week">Week</label>

        <input type="radio" name="view" id="month">
        <label for="month">Month</label>
      </div>

      <p class="hint">
        Use <kbd>Tab</kbd> to focus the control and
        <kbd>Arrow Keys</kbd> to change the selection.
      </p>
    </section>
  </main>
</body>
</html>
