<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accessible Zoom-In Carousel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>Accessible Zoom-In Carousel</h1>
    <p class="subtitle">
        Hover over a card to see the smooth zoom effect.
    </p>

    <div class="carousel">

        <article class="card" tabindex="0">
            <img src="https://picsum.photos/400/250?random=1" alt="Mountain landscape">
            <h2>Mountains</h2>
            <p>Peaceful natural scenery with smooth zoom interaction.</p>
        </article>

        <article class="card" tabindex="0">
            <img src="https://picsum.photos/400/250?random=2" alt="Ocean">
            <h2>Ocean</h2>
            <p>Responsive CSS-only carousel card with accessibility.</p>
        </article>

        <article class="card" tabindex="0">
            <img src="https://picsum.photos/400/250?random=3" alt="Forest">
            <h2>Forest</h2>
            <p>Designed for modern responsive web layouts.</p>
        </article>

    </div>
</div>

</body>
</html>
