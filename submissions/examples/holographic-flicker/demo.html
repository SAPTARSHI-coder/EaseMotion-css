<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Pure CSS Holographic Flicker micro-interaction."
  >
  <title>Holographic Flicker</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="page">
    <section class="demo" aria-labelledby="demo-title">
      <p class="eyebrow">EaseMotion CSS</p>

      <h1 id="demo-title">Holographic Flicker</h1>

      <p class="description">
        A futuristic micro-interaction combining holographic color separation,
        subtle scanlines, and an irregular flicker effect.
      </p>

      <button class="holo-card" type="button">
        <span class="holo-noise" aria-hidden="true"></span>
        <span class="holo-scanlines" aria-hidden="true"></span>

        <span class="holo-content">
          <span class="holo-icon" aria-hidden="true">✦</span>

          <span class="holo-copy">
            <span class="holo-label">HOLOGRAPHIC</span>
            <strong>System Online</strong>
            <small>Hover or focus to activate</small>
          </span>

          <span class="holo-status">
            <span class="status-dot" aria-hidden="true"></span>
            ACTIVE
          </span>
        </span>
      </button>

      <p class="hint">
        Move your pointer over the card or focus it with the keyboard.
      </p>
    </section>
  </main>
</body>
</html>
