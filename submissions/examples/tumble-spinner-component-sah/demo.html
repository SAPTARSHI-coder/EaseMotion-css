<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tumble Spinner Component - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="gallery">
    <h1>Tumble Spinner Component (<code>#54698</code>)</h1>
    <p class="subtitle">Multi-axis orbital geometry engineered for next-gen asynchronous status screens.</p>
    
    <div class="spinners-row">
      <div class="spinner-box">
        <div class="ease-spinner-tumble cyan"></div>
        <span>Default Speed</span>
      </div>
      <div class="spinner-box">
        <div class="ease-spinner-tumble purple fast"></div>
        <span>Turbo Mode</span>
      </div>
      <div class="spinner-box">
        <div class="ease-spinner-tumble emerald slow"></div>
        <span>Idle Relaxed</span>
      </div>
    </div>
  </div>
</body>
</html>
