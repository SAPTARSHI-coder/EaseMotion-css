<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Slide-Up Stepper | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <main class="container">
    <section class="stepper-card">
      <h1>Launch Your SaaS Product</h1>
      <p class="subtitle">
        Follow these simple steps to get started.
      </p>

      <div class="stepper">

        <div class="step active">
          <div class="number">01</div>
          <div class="content">
            <h2>Create Account</h2>
            <p>Register and configure your workspace.</p>
          </div>
        </div>

        <div class="line"></div>

        <div class="step">
          <div class="number">02</div>
          <div class="content">
            <h2>Customize Setup</h2>
            <p>Personalize your SaaS dashboard.</p>
          </div>
        </div>

        <div class="line"></div>

        <div class="step">
          <div class="number">03</div>
          <div class="content">
            <h2>Go Live</h2>
            <p>Deploy your product and start growing.</p>
          </div>
        </div>

      </div>

    </section>
  </main>

</body>
</html>
