<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS 3D Glass Credit Card Form - EaseMotion CSS</title>
  <!-- Import EaseMotion CSS -->
  <link rel="stylesheet" href="../../../easemotion.css">
  <!-- Component Specific Styles -->
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body class="minimalist-bg">

  <div class="demo-container">
    
    <div class="header-section">
      <h1 class="ease-text-3xl">3D Glass Credit Card</h1>
      <p class="ease-color-muted">A zero-JavaScript interactive checkout experience. Utilizing modern CSS <code>:has()</code> pseudo-classes to trigger native hardware-accelerated 3D transforms when focusing specific form fields.</p>
    </div>

    <!-- The Component Viewport -->
    <div class="checkout-viewport" aria-label="Interactive checkout form" role="region">
      
      <!-- Ambient Background to highlight glassmorphism -->
      <div class="ambient-bg">
        <div class="glow-orb orb-1"></div>
        <div class="glow-orb orb-2"></div>
      </div>

      <div class="checkout-wrapper">
        
        <!-- The 3D Card Visualization -->
        <div class="card-scene" aria-hidden="true">
          <div class="card-inner">
            
            <!-- Card Front -->
            <div class="card-face card-front">
              <div class="card-chip">
                <svg viewBox="0 0 40 30" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="1.5"><path d="M5 0v30M35 0v30M0 10h40M0 20h40M15 0v30M25 0v30" stroke-dasharray="4 2"/></svg>
              </div>
              <div class="card-logo">
                <svg viewBox="0 0 32 20" fill="none"><circle cx="10" cy="10" r="10" fill="#EB001B" opacity="0.8"/><circle cx="22" cy="10" r="10" fill="#F79E1B" opacity="0.8"/></svg>
              </div>
              <div class="card-number">•••• •••• •••• ••••</div>
              <div class="card-meta">
                <div class="card-holder">
                  <span class="meta-label">Card Holder</span>
                  <span class="meta-value">JOHN DOE</span>
                </div>
                <div class="card-exp">
                  <span class="meta-label">Expires</span>
                  <span class="meta-value">MM/YY</span>
                </div>
              </div>
            </div>
            
            <!-- Card Back -->
            <div class="card-face card-back">
              <div class="mag-stripe"></div>
              <div class="cvv-stripe">
                <span class="cvv-label">CVV</span>
                <div class="cvv-box">•••</div>
              </div>
              <div class="card-signature">
                <span class="sig-line"></span>
              </div>
            </div>
            
          </div>
        </div>

        <!-- The Checkout Form -->
        <form class="checkout-form" onsubmit="event.preventDefault();">
          <h2 class="form-title">Payment Details</h2>
          
          <div class="input-group">
            <label for="cc-number">Card Number</label>
            <input type="text" id="cc-number" placeholder="0000 0000 0000 0000" inputmode="numeric" required>
          </div>
          
          <div class="input-group">
            <label for="cc-name">Cardholder Name</label>
            <input type="text" id="cc-name" placeholder="John Doe" required>
          </div>
          
          <div class="input-row">
            <div class="input-group">
              <label for="cc-exp">Expiration Date</label>
              <input type="text" id="cc-exp" placeholder="MM/YY" required>
            </div>
            
            <div class="input-group">
              <label for="cc-cvv">Security Code (CVV)</label>
              <!-- Focusing this input triggers the 3D card flip via CSS :has() -->
              <input type="text" id="cc-cvv" placeholder="123" inputmode="numeric" maxlength="4" required>
            </div>
          </div>
          
          <button type="submit" class="submit-btn">Pay Securely</button>
        </form>
        
      </div>
      
    </div>

  </div>

</body>
</html>
