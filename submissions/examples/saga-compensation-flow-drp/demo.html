<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Saga Compensation Flow</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="advanced-shell" aria-labelledby="advanced-title">
    <section class="advanced-panel">
      <p class="eyebrow">distributed rollback</p>
      <h1 id="advanced-title">Saga Compensation Flow</h1>
      <p class="summary">A pure CSS workflow that animates saga steps, failure detection, and reverse compensation messages across service boundaries.</p>
      <div class="stage" role="img" aria-label="Animated Saga Compensation Flow visualization">
        <div class="halo halo-one"></div>
        <div class="halo halo-two"></div>
        <article class="tile tile-a"><strong>01</strong><span>step committed</span></article>
        <article class="tile tile-b"><strong>02</strong><span>failure raised</span></article>
        <article class="tile tile-c"><strong>03</strong><span>compensation run</span></article>
        <div class="lane lane-ab"><i></i></div>
        <div class="lane lane-bc"><i></i></div>
        <div class="lane lane-ca"><i></i></div>
        <div class="resolution">compensation run</div>
      </div>
      <div class="status-grid" aria-label="Saga Compensation Flow status">
        <span>step committed</span>
        <span>failure raised</span>
        <span>compensation run</span>
      </div>
    </section>
  </main>
</body>
</html>
