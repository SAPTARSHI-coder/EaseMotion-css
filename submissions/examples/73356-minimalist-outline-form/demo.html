<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>Minimalist Outline Form</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">
    <section class="form-container" aria-labelledby="form-title">

      <header class="form-header">
        <span class="form-label">GET IN TOUCH</span>
        <h1 id="form-title">Let's Talk</h1>
        <p>
          A clean and minimal form designed with subtle outline interactions.
        </p>
      </header>

      <form class="outline-form" action="#" method="post">

        <div class="field">
          <label for="name">Name</label>
          <input
            id="name"
            name="name"
            type="text"
            placeholder="Your name"
            autocomplete="name"
            required
          >
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input
            id="email"
            name="email"
            type="email"
            placeholder="you@example.com"
            autocomplete="email"
            required
          >
        </div>

        <div class="field">
          <label for="topic">Topic</label>
          <select id="topic" name="topic" required>
            <option value="" selected disabled>Choose a topic</option>
            <option value="general">General inquiry</option>
            <option value="feedback">Feedback</option>
            <option value="support">Support</option>
            <option value="collaboration">Collaboration</option>
          </select>
        </div>

        <div class="field">
          <label for="message">Message</label>
          <textarea
            id="message"
            name="message"
            rows="5"
            placeholder="Tell us what you have in mind..."
            required
          ></textarea>
        </div>

        <label class="consent">
          <input type="checkbox" name="consent" required>
          <span class="checkmark" aria-hidden="true"></span>
          <span>I agree to be contacted regarding my message.</span>
        </label>

        <button type="submit" class="submit-button">
          <span>Send Message</span>
          <span class="button-arrow" aria-hidden="true">↗</span>
        </button>

      </form>

    </section>
  </main>

</body>
</html>
