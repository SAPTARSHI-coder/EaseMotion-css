<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Neon Light Tubes</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="neon-container">
        <h1 class="neon-title">Neon Light Tubes</h1>
        <div class="tube-grid">
            <div class="tube tube-red"></div>
            <div class="tube tube-blue"></div>
            <div class="tube tube-green"></div>
            <div class="tube tube-purple"></div>
            <div class="tube tube-yellow"></div>
        </div>
        <p class="caption">Glowing tubes with CSS animations</p>
    </div>
</body>

</html>
