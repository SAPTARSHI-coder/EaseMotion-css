<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Certificate Badge</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <!-- The wrapper acts as the interactive element -->
  <div class="badge-wrapper" tabindex="0" aria-label="Official Course Completion Certificate">
    
    <!-- The physical badge seal -->
    <div class="badge-body">
      <div class="badge-inner">
        <!-- Verified Shield/Trophy Icon -->
        <svg class="badge-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z"></path>
        </svg>
        <span class="badge-text">Certified<br>Pro</span>
      </div>
    </div>
    
    <!-- Red ribbon tails -->
    <div class="ribbons">
      <div class="ribbon left" aria-hidden="true"></div>
      <div class="ribbon right" aria-hidden="true"></div>
    </div>

  </div>

</body>
</html>
