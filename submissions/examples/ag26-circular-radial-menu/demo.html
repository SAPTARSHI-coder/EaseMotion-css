<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radial Menu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="radial-menu">
        <input type="checkbox" id="menu-toggle" class="menu-checkbox">
        <label for="menu-toggle" class="menu-fab">☰</label>
        
        <div class="menu-item i-1">★</div>
        <div class="menu-item i-2">♥</div>
        <div class="menu-item i-3">⚙</div>
        <div class="menu-item i-4">✉</div>
    </div>
</body>
</html>
