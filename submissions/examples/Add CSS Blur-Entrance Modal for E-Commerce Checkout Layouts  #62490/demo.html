<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Blur-Entrance Modal - EaseMotion</title>
  <link rel="stylesheet" href="style.css">
  <!-- Use a modern, premium font -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Hidden Checkbox to manage Modal State -->
  <input type="checkbox" id="modal-toggle" class="modal-checkbox" aria-hidden="true">

  <!-- E-Commerce Checkout Background App -->
  <div class="app-layout">
    <header class="app-header">
      <div class="logo">LuxeCart</div>
      <div class="user-avatar"></div>
    </header>

    <main class="checkout-main">
      <div class="checkout-grid">
        <!-- Main Form Area -->
        <section class="checkout-section">
          <h1>Payment Information</h1>
          <p class="subtitle">Choose a payment method to complete your secure checkout.</p>
          
          <div class="payment-methods-list">
            <div class="payment-card">
              <div class="card-icon visa">VISA</div>
              <div class="card-details">
                <strong>Visa ending in 4242</strong>
                <span>Expires 12/28</span>
              </div>
              <div class="card-radio active"></div>
            </div>
            
            <!-- This label triggers the Modal -->
            <label for="modal-toggle" class="add-new-btn">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
              </svg>
              Add New Payment Method
            </label>
          </div>
        </section>

        <!-- Order Summary Area -->
        <aside class="order-summary">
          <h2>Order Summary</h2>
          <div class="summary-item">
            <span>Subtotal</span>
            <span>$349.00</span>
          </div>
          <div class="summary-item">
            <span>Shipping</span>
            <span>$15.00</span>
          </div>
          <hr class="divider">
          <div class="summary-item total">
            <span>Total</span>
            <span>$364.00</span>
          </div>
          <button class="pay-btn disabled" disabled>Confirm Payment</button>
        </aside>
      </div>
    </main>
  </div>

  <!-- Modal Backdrop (Also acts as a close button) -->
  <label for="modal-toggle" class="modal-backdrop" aria-label="Close Modal"></label>

  <!-- The Blur-Entrance Modal -->
  <div class="modal">
    <div class="modal-header">
      <h2>Add New Card</h2>
      <label for="modal-toggle" class="close-btn" aria-label="Close Modal">&times;</label>
    </div>
    
    <div class="modal-body">
      <!-- Pure CSS Card Preview -->
      <div class="credit-card-preview">
        <div class="card-chip"></div>
        <div class="card-number">•••• •••• •••• ••••</div>
        <div class="card-footer">
          <div class="card-name">JOHN DOE</div>
          <div class="card-expiry">MM/YY</div>
        </div>
      </div>

      <!-- Mock Form Elements -->
      <div class="form-group">
        <label>Card Number</label>
        <input type="text" placeholder="0000 0000 0000 0000" class="modal-input">
      </div>
      
      <div class="form-row">
        <div class="form-group">
          <label>Expiry Date</label>
          <input type="text" placeholder="MM/YY" class="modal-input">
        </div>
        <div class="form-group">
          <label>CVC</label>
          <input type="password" placeholder="123" class="modal-input">
        </div>
      </div>
      
      <div class="form-group">
        <label>Cardholder Name</label>
        <input type="text" placeholder="Name on card" class="modal-input">
      </div>
    </div>
    
    <div class="modal-footer">
      <label for="modal-toggle" class="btn-cancel">Cancel</label>
      <label for="modal-toggle" class="btn-save">Save & Use</label>
    </div>
  </div>

</body>
</html>
