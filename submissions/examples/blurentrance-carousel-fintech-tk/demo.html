<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blur Entrance Carousel</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <h1>Fintech Dashboard</h1>
  <p class="subtitle">
    Blur-Entrance Carousel for Financial Analytics
  </p>

  <div class="carousel">

    <div class="card card-1">
      <div class="icon">📈</div>
      <h2>Market Overview</h2>
      <div class="value">+12.8%</div>
      <p>Weekly Performance</p>
    </div>

    <div class="card card-2">
      <div class="icon">💰</div>
      <h2>Revenue</h2>
      <div class="value">$82,450</div>
      <p>Monthly Earnings</p>
    </div>

    <div class="card card-3">
      <div class="icon">📊</div>
      <h2>Investments</h2>
      <div class="value">24 Assets</div>
      <p>Active Portfolio</p>
    </div>

  </div>

</div>

</body>
</html>
