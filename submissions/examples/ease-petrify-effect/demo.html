<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Petrify Effect · turns to stone gradually</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <div class="petrify-container">
      <div class="petrify-display" id="petrifyDisplay">
        <!-- Subject -->
        <div class="subject" id="subject">
          <div class="subject-icon" id="subjectIcon">🧝</div>
          <div class="subject-name" id="subjectName">Elven Warrior</div>
          <div class="subject-status" id="subjectStatus">Living</div>
        </div>

        <!-- Stone Cracks Overlay -->
        <svg class="cracks-overlay" id="cracksOverlay" viewBox="0 0 300 300">
          <path class="crack crack-1" d="M150,50 L140,100 L160,120 L130,160 L150,200 L140,250" stroke="#94a3b8" stroke-width="2" fill="none"/>
          <path class="crack crack-2" d="M50,150 L100,140 L120,160 L160,130 L200,160 L250,140" stroke="#94a3b8" stroke-width="2" fill="none"/>
          <path class="crack crack-3" d="M100,50 L110,80 L90,120 L120,150 L100,180" stroke="#94a3b8" stroke-width="2" fill="none"/>
          <path class="crack crack-4" d="M200,50 L180,90 L210,130 L190,170 L220,200" stroke="#94a3b8" stroke-width="2" fill="none"/>
          <path class="crack crack-5" d="M50,250 L100,230 L130,250 L180,220 L250,250" stroke="#94a3b8" stroke-width="2" fill="none"/>
          <path class="crack crack-6" d="M150,250 L170,220 L150,200" stroke="#94a3b8" stroke-width="2" fill="none"/>
          <path class="crack crack-7" d="M250,80 L220,100 L240,140 L210,170" stroke="#94a3b8" stroke-width="2" fill="none"/>
          <path class="crack crack-8" d="M80,80 L100,100 L90,130" stroke="#94a3b8" stroke-width="2" fill="none"/>
        </svg>

        <!-- Stone Particles -->
        <div class="stone-particles" id="stoneParticles"></div>

        <!-- Petrify Indicator -->
        <div class="petrify-indicator">
          <div class="petrify-bar">
            <div class="petrify-fill" id="petrifyFill"></div>
          </div>
          <span class="petrify-value" id="petrifyValue">Petrified: 0%</span>
        </div>
      </div>
      
      <div class="petrify-status">
        <span id="petrifyStatus">🪨 Click to petrify</span>
      </div>
    </div>

    <div class="controls">
      <button class="btn btn-petrify" id="petrifyBtn">🪨 Petrify</button>
      <button class="btn btn-reverse" id="reverseBtn">✨ Reverse</button>
      <button class="btn btn-reset" id="resetBtn">⟳ Reset</button>
    </div>
    <div class="footer-note">
      <span>🪨 gradual petrification · stone cracks · particle effects</span>
    </div>
  </div>

  <script>
    (function() {
      "use strict";

      // DOM refs
      const subject = document.getElementById('subject');
      const subjectIcon = document.getElementById('subjectIcon');
      const subjectName = document.getElementById('subjectName');
      const subjectStatus = document.getElementById('subjectStatus');
      const petrifyFill = document.getElementById('petrifyFill');
      const petrifyValue = document.getElementById('petrifyValue');
      const petrifyStatus = document.getElementById('petrifyStatus');
      const cracksOverlay = document.getElementById('cracksOverlay');
      const stoneParticles = document.getElementById('stoneParticles');
      const petrifyBtn = document.getElementById('petrifyBtn');
      const reverseBtn = document.getElementById('reverseBtn');
      const resetBtn = document.getElementById('resetBtn');

      // State
      let petrify = 0; // 0 to 1
      let targetPetrify = 0;
      let isAnimating = false;
      let animationId = null;

      // Colors for petrification stages
      const stoneColors = {
        skin: ['#fbbf24', '#b8860b', '#8B7355', '#6B5B3A', '#4A3F2E', '#3D3526'],
        icon: ['#fbbf24', '#c49b3b', '#a07828', '#7a5c1e', '#5a4415', '#3d2e0e']
      };

      // Update petrify
      function updatePetrify() {
        // Smooth interpolation
        petrify += (targetPetrify - petrify) * 0.04;
        
        // Clamp
        petrify = Math.max(0, Math.min(1, petrify));
        
        const percent = Math.round(petrify * 100);
        
        // Update indicator
        petrifyFill.style.width = percent + '%';
        petrifyValue.textContent = `Petrified: ${percent}%`;

        // Update subject
        const skinIndex = Math.floor(petrify * (stoneColors.skin.length - 1));
        const skinColor = stoneColors.skin[skinIndex] || stoneColors.skin[stoneColors.skin.length - 1];
        const iconColor = stoneColors.icon[skinIndex] || stoneColors.icon[stoneColors.icon.length - 1];
        
        subject.style.background = `radial-gradient(ellipse at center, ${skinColor}, ${stoneColors.skin[Math.min(skinIndex + 1, stoneColors.skin.length - 1)]})`;
        subjectIcon.style.color = iconColor;
        
        // Update subject icon based on petrification
        if (petrify > 0.8) {
          subjectIcon.textContent = '🗿';
          subjectStatus.textContent = 'Petrified';
          subjectStatus.style.color = '#94a3b8';
        } else if (petrify > 0.4) {
          subjectIcon.textContent = '🧝';
          subjectStatus.textContent = 'Petrifying...';
          subjectStatus.style.color = '#a78bfa';
        } else if (petrify > 0.05) {
          subjectIcon.textContent = '🧝';
          subjectStatus.textContent = 'Turning to stone...';
          subjectStatus.style.color = '#818cf8';
        } else {
          subjectIcon.textContent = '🧝';
          subjectStatus.textContent = 'Living';
          subjectStatus.style.color = '#4ade80';
        }

        // Update cracks
        const cracks = document.querySelectorAll('.crack');
        cracks.forEach((crack, index) => {
          const delay = index * 0.05;
          const crackOpacity = Math.max(0, Math.min(1, (petrify - delay) / (1 - delay)));
          crack.style.opacity = crackOpacity;
          crack.style.strokeWidth = 1 + crackOpacity * 2;
        });

        // Update stone particles
        if (petrify > 0.3 && Math.random() < petrify * 0.3) {
          createStoneParticle();
        }

        // Update subject transform
        const scale = 1 - petrify * 0.05;
        const rotate = petrify * 2;
        subject.style.transform = `scale(${scale}) rotate(${rotate}deg)`;

        // Update glow
        const glowIntensity = 0.1 + (1 - petrify) * 0.3;
        subject.style.boxShadow = `0 0 ${30 + (1 - petrify) * 40}px rgba(251, 191, 36, ${glowIntensity})`;

        // Update status
        if (petrify > 0.9) {
          petrifyStatus.textContent = '🗿 Fully petrified!';
          petrifyStatus.style.color = '#94a3b8';
          petrifyBtn.textContent = '🪨 Petrified';
        } else if (petrify > 0.4) {
          petrifyStatus.textContent = '🪨 Petrifying...';
          petrifyStatus.style.color = '#a78bfa';
        } else if (petrify > 0.05) {
          petrifyStatus.textContent = '🪨 Turning to stone...';
          petrifyStatus.style.color = '#818cf8';
        } else {
          petrifyStatus.textContent = '🪨 Click to petrify';
          petrifyStatus.style.color = '#94a3b8';
        }
      }

      // Create stone particle
      function createStoneParticle() {
        const particle = document.createElement('div');
        particle.className = 'stone-particle';
        
        const size = Math.random() * 6 + 2;
        particle.style.width = size + 'px';
        particle.style.height = size + 'px';
        
        const rect = document.getElementById('petrifyDisplay').getBoundingClientRect();
        const x = Math.random() * 100;
        const y = Math.random() * 100;
        particle.style.left = x + '%';
        particle.style.top = y + '%';
        
        const colors = ['#94a3b8', '#64748b', '#475569', '#334155'];
        particle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        particle.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
        
        const angle = Math.random() * Math.PI * 2;
        const distance = 20 + Math.random() * 50;
        particle.style.setProperty('--tx', Math.cos(angle) * distance + 'px');
        particle.style.setProperty('--ty', Math.sin(angle) * distance + 'px');
        
        particle.style.animationDuration = (Math.random() * 1 + 1) + 's';
        
        stoneParticles.appendChild(particle);
        
        setTimeout(() => {
          particle.remove();
        }, 2000);
      }

      // Animation loop
      function animate() {
        if (isAnimating) {
          updatePetrify();
          animationId = requestAnimationFrame(animate);
        }
      }

      // Start animation
      function startAnimation() {
        if (!isAnimating) {
          isAnimating = true;
          animate();
        }
      }

      // Stop animation
      function stopAnimation() {
        if (isAnimating) {
          isAnimating = false;
          if (animationId) {
            cancelAnimationFrame(animationId);
            animationId = null;
          }
          updatePetrify();
        }
      }

      // Petrify
      function petrifySubject() {
        targetPetrify = 1;
        startAnimation();
        petrifyBtn.textContent = '🪨 Petrifying...';
        petrifyBtn.style.background = 'linear-gradient(135deg, #94a3b8, #64748b)';
        petrifyBtn.style.borderColor = '#94a3b8';
      }

      // Reverse
      function reversePetrify() {
        targetPetrify = 0;
        startAnimation();
        petrifyBtn.textContent = '🪨 Petrify';
        petrifyBtn.style.background = 'linear-gradient(135deg, #6366f1, #4f46e5)';
        petrifyBtn.style.borderColor = '#818cf8';
        subjectIcon.textContent = '🧝';
      }

      // Reset
      function resetPetrify() {
        targetPetrify = 0;
        petrify = 0;
        stopAnimation();
        updatePetrify();
        petrifyBtn.textContent = '🪨 Petrify';
        petrifyBtn.style.background = 'linear-gradient(135deg, #6366f1, #4f46e5)';
        petrifyBtn.style.borderColor = '#818cf8';
        subjectIcon.textContent = '🧝';
        stoneParticles.innerHTML = '';
        petrifyStatus.textContent = '🔄 Reset complete';
        petrifyStatus.style.color = '#94a3b8';
        setTimeout(() => {
          petrifyStatus.textContent = '🪨 Click to petrify';
        }, 1000);
      }

      // Toggle petrify
      function togglePetrify() {
        if (petrify > 0.5) {
          reversePetrify();
        } else {
          petrifySubject();
        }
      }

      // Event listeners
      if (petrifyBtn) {
        petrifyBtn.addEventListener('click', function(e) {
          e.preventDefault();
          if (petrify > 0.8) {
            reversePetrify();
          } else {
            petrifySubject();
          }
        });
      }

      if (reverseBtn) {
        reverseBtn.addEventListener('click', function(e) {
          e.preventDefault();
          reversePetrify();
        });
      }

      if (resetBtn) {
        resetBtn.addEventListener('click', function(e) {
          e.preventDefault();
          resetPetrify();
        });
      }

      // Click on display to toggle
      const petrifyDisplay = document.getElementById('petrifyDisplay');
      petrifyDisplay.addEventListener('click', function(e) {
        if (e.target === this || e.target.closest('.subject')) {
          togglePetrify();
        }
      });

      // Keyboard shortcuts
      document.addEventListener('keydown', function(e) {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

        const key = e.key;
        if (key === ' ' || key === 'Space') {
          e.preventDefault();
          togglePetrify();
        } else if (key === 'p' || key === 'P') {
          e.preventDefault();
          petrifySubject();
        } else if (key === 'r' || key === 'R') {
          e.preventDefault();
          reversePetrify();
        } else if (key === 'x' || key === 'X') {
          e.preventDefault();
          resetPetrify();
        }
      });

      // Initialize
      updatePetrify();
      console.log('🪨 Petrify Effect ready · shortcuts: [Space] Toggle, [P] Petrify, [R] Reverse, [X] Reset');
    })();
  </script>
</body>
</html>
