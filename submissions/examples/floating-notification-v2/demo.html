<!-- submissions/examples/floating-notification-v2/demo.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Floating Notification v2 | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="demo-container">
    <div class="demo-instruction">
      Notification will slide in from the bottom right.
    </div>
    
    <!-- Floating Notification v2 Component -->
    <div class="ease-toast-v2" role="status" aria-live="polite" tabindex="0">
      
      <!-- Avatar with Online Indicator -->
      <div class="ease-toast-avatar">
        <!-- Using a free placeholder avatar service for the demo -->
        <img src="https://i.pravatar.cc/150?img=47" alt="Sarah Connor">
      </div>
      
      <!-- Message Content -->
      <div class="ease-toast-content">
        <span class="ease-toast-title">Sarah Connor</span>
        <span class="ease-toast-desc">Hey! The design files for the new landing page are ready for review.</span>
      </div>

    </div>

  </main>

</body>
</html>
