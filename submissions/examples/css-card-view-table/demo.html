<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CSS Card View Table</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="container">


<h1>Employee Table</h1>


<table>

<thead>

<tr>
<th>Name</th>
<th>Role</th>
<th>Experience</th>
<th>Status</th>
</tr>

</thead>


<tbody>


<tr>

<td data-label="Name">Avinash Kumar</td>
<td data-label="Role">Frontend Developer</td>
<td data-label="Experience">2 Years</td>
<td data-label="Status">Active</td>

</tr>


<tr>

<td data-label="Name">Rahul Sharma</td>
<td data-label="Role">UI Designer</td>
<td data-label="Experience">1 Year</td>
<td data-label="Status">Pending</td>

</tr>


<tr>

<td data-label="Name">Priya Singh</td>
<td data-label="Role">Backend Developer</td>
<td data-label="Experience">3 Years</td>
<td data-label="Status">Completed</td>

</tr>


</tbody>


</table>


</div>


</body>

</html>
