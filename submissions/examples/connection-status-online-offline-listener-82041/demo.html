<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connection Status Listener</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section class="status-card">
      <div class="status-icon" id="statusIcon">●</div>

      <div class="content">
        <p class="label">Network Status</p>
        <h1 id="statusText">Checking connection...</h1>
        <p id="statusDescription">
          Checking whether your device is online.
        </p>
      </div>
    </section>

    <div class="event-log">
      <h2>Connection Events</h2>
      <p id="eventMessage">Waiting for connection changes...</p>
    </div>
  </main>

  <script>
    const statusText = document.getElementById("statusText");
    const statusDescription = document.getElementById("statusDescription");
    const statusIcon = document.getElementById("statusIcon");
    const eventMessage = document.getElementById("eventMessage");

    function updateStatus(online, eventName = "initial") {
      if (online) {
        statusText.textContent = "Online";
        statusDescription.textContent =
          "Your device is currently connected to the internet.";
        statusIcon.classList.add("online");
        statusIcon.classList.remove("offline");
      } else {
        statusText.textContent = "Offline";
        statusDescription.textContent =
          "Your device appears to be disconnected.";
        statusIcon.classList.add("offline");
        statusIcon.classList.remove("online");
      }

      if (eventName !== "initial") {
        eventMessage.textContent =
          `${eventName === "online" ? "Connection restored" : "Connection lost"} — ${new Date().toLocaleTimeString()}`;
      }
    }

    window.addEventListener("online", () => {
      updateStatus(true, "online");
    });

    window.addEventListener("offline", () => {
      updateStatus(false, "offline");
    });

    updateStatus(navigator.onLine);
  </script>
</body>
</html>
