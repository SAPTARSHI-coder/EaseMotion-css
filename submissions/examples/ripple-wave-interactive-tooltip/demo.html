<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        Ripple-Wave Interactive Tooltip | EaseMotion CSS
    </title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<main class="container">


<section class="hero">

    <span class="badge">
        EaseMotion CSS
    </span>


    <h1>
        CSS Ripple-Wave Tooltip
    </h1>


    <p>
        A pure CSS tooltip component with
        ripple-wave animation, smooth hover
        interactions and accessible responsive
        design.
    </p>

</section>




<section class="tooltip-grid" aria-label="Ripple Wave Tooltips">


    <div class="tooltip-wrapper">

        <button class="tooltip-btn">

            Hover Me

            <span class="tooltip">
                Creative animation effect
            </span>

        </button>

    </div>





    <div class="tooltip-wrapper">

        <button class="tooltip-btn">

            Explore

            <span class="tooltip">
                Lightweight CSS component
            </span>

        </button>

    </div>





    <div class="tooltip-wrapper">

        <button class="tooltip-btn">

            Learn More

            <span class="tooltip">
                Accessible UI interaction
            </span>

        </button>

    </div>




</section>


</main>


</body>

</html>
