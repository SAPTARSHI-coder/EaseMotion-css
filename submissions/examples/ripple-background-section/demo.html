<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="CSS-only ripple background section with animated circles"
  >
  <title>Ripple Background Section</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="ripple-section">
    <div class="ripple-container" aria-hidden="true">
      <span class="ripple ripple-1"></span>
      <span class="ripple ripple-2"></span>
      <span class="ripple ripple-3"></span>
      <span class="ripple ripple-4"></span>
    </div>

    <div class="content">
      <p class="eyebrow">CSS Animation</p>
      <h1>Ripple Background</h1>
      <p>
        A lightweight ripple effect created entirely with HTML and CSS.
      </p>
      <a href="#learn-more" class="button">Explore</a>
    </div>
  </main>

  <section id="learn-more" class="info">
    <h2>Pure CSS Motion</h2>
    <p>
      The ripple animation requires no JavaScript or external libraries.
    </p>
  </section>
</body>
</html>
