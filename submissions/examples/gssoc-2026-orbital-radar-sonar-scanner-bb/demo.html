<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orbital Radar Sonar Scanner - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="radar-wrapper">
    <header class="radar-header">
      <span class="badge">GSSoC 2026 Component</span>
      <h1>Orbital Radar Sonar Scanner</h1>
      <p>Continuous conical gradient sweep HUD display with target blip pulse trails and coordinate crosshairs.</p>
    </header>

    <div class="radar-display" tabindex="0">
      <!-- Rings -->
      <div class="ring ring-1"></div>
      <div class="ring ring-2"></div>
      <div class="ring ring-3"></div>
      
      <!-- Axis Crosshairs -->
      <div class="axis axis-x"></div>
      <div class="axis axis-y"></div>

      <!-- Rotating Sweep Line -->
      <div class="sweep-arm"></div>

      <!-- Target Blips -->
      <div class="blip blip-1">
        <span class="blip-label">SAT-01</span>
      </div>
      <div class="blip blip-2">
        <span class="blip-label">NODE-X</span>
      </div>
      <div class="blip blip-3">
        <span class="blip-label">TARGET-4</span>
      </div>

      <div class="radar-footer">
        <span class="coord">LAT: 34.0522° N</span>
        <span class="coord">LONG: 118.2437° W</span>
        <span class="status">SCANNING...</span>
      </div>
    </div>
  </div>
</body>
</html>
