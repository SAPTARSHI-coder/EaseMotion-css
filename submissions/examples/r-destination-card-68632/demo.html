<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Responsive CSS destination card with image overlay, location and CTA."
  >

  <title>CSS Destination Card</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">
    <section class="destination-section" aria-labelledby="destination-title">

      <header class="section-header">
        <span class="eyebrow">Travel inspiration</span>
        <h1 id="destination-title">Find your next escape</h1>
        <p>
          Discover beautiful destinations designed with
          a responsive CSS-only card.
        </p>
      </header>

      <article class="destination-card">

        <img
          class="destination-image"
          src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=1200&q=85"
          alt="Mountain landscape beside a turquoise lake"
        >

        <div class="image-overlay"></div>

        <div class="location-pin" aria-hidden="true">
          <span>●</span>
        </div>

        <div class="destination-content">

          <div class="destination-meta">
            <span class="destination-tag">Featured</span>
            <span class="destination-rating">★ 4.9</span>
          </div>

          <div class="destination-info">
            <span class="country">South Island</span>

            <h2>Queenstown</h2>

            <p>
              Mountains, crystal-clear lakes and unforgettable
              outdoor adventures.
            </p>

            <a class="destination-cta" href="#explore">
              Explore destination
              <span aria-hidden="true">→</span>
            </a>
          </div>

        </div>

      </article>

    </section>
  </main>

</body>
</html>
