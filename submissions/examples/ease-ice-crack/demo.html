<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ice Crack – Ice Cracks Spread from Interaction Point</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <h1>🧊 Ice Crack</h1>
    <p class="subtitle">Ice cracks spread from your interaction</p>

    <div class="ice-container">
      <div class="ice-stage" id="iceStage">
        <canvas id="canvas"></canvas>
        
        <!-- Info overlay -->
        <div class="info-overlay">
          <span class="ice-status" id="iceStatus">🧊 Solid</span>
          <span class="crack-count" id="crackCount">✦ 0 cracks</span>
        </div>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <button class="ctrl-btn crack" id="crackBtn">💥 Crack</button>
      <button class="ctrl-btn clear" id="clearBtn">🗑️ Clear</button>
      <button class="ctrl-btn toggle" id="toggleBtn">⏸ Pause</button>
      <button class="ctrl-btn reset" id="resetBtn">↺ Reset</button>
    </div>

    <!-- Sliders -->
    <div class="slider-container">
      <span class="slider-label">Crack Speed</span>
      <input type="range" id="speedSlider" min="1" max="10" value="5" />
      <span class="slider-value" id="speedValue">5×</span>
    </div>

    <div class="slider-container">
      <span class="slider-label">Crack Length</span>
      <input type="range" id="lengthSlider" min="20" max="100" value="60" />
      <span class="slider-value" id="lengthValue">60%</span>
    </div>

    <div class="slider-container">
      <span class="slider-label">Branching</span>
      <input type="range" id="branchSlider" min="0" max="100" value="50" />
      <span class="slider-value" id="branchValue">50%</span>
    </div>

    <div class="slider-container">
      <span class="slider-label">Ice Color</span>
      <input type="range" id="colorSlider" min="0" max="360" value="200" />
      <span class="slider-value" id="colorValue">200°</span>
    </div>

    <!-- Status -->
    <div class="status" id="status">🧊 Click Crack or tap the ice to create cracks</div>

    <!-- Keyboard shortcuts -->
    <div class="shortcuts">
      <kbd>Click</kbd> Crack · <kbd>C</kbd> Crack · <kbd>Space</kbd> Pause · <kbd>R</kbd> Reset
    </div>
  </div>

  <script>
    (function() {
      "use strict";

      // DOM elements
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      const iceStatus = document.getElementById('iceStatus');
      const crackCount = document.getElementById('crackCount');
      const crackBtn = document.getElementById('crackBtn');
      const clearBtn = document.getElementById('clearBtn');
      const toggleBtn = document.getElementById('toggleBtn');
      const resetBtn = document.getElementById('resetBtn');
      const status = document.getElementById('status');
      const speedSlider = document.getElementById('speedSlider');
      const speedValue = document.getElementById('speedValue');
      const lengthSlider = document.getElementById('lengthSlider');
      const lengthValue = document.getElementById('lengthValue');
      const branchSlider = document.getElementById('branchSlider');
      const branchValue = document.getElementById('branchValue');
      const colorSlider = document.getElementById('colorSlider');
      const colorValue = document.getElementById('colorValue');

      // State
      let cracks = [];
      let isPaused = false;
      let animationId = null;
      let time = 0;

      // ----- Canvas setup -----
      function setupCanvas() {
        const rect = canvas.parentElement.getBoundingClientRect();
        const size = Math.min(rect.width - 40, 600);
        canvas.width = size;
        canvas.height = size;
        canvas.style.width = size + 'px';
        canvas.style.height = size + 'px';
      }

      // ----- Crack class -----
      class Crack {
        constructor(x, y, angle, length, depth = 0) {
          this.x = x;
          this.y = y;
          this.angle = angle;
          this.length = length;
          this.depth = depth;
          this.growth = 0;
          this.speed = 0.5 + Math.random() * 1.5;
          this.width = 0.5 + (1 - depth * 0.3) * 1.5;
          this.opacity = 1;
          this.alive = true;
          this.children = [];
          this.hasBranched = false;
          this.branchChance = parseInt(branchSlider.value) / 100;
          this.maxDepth = 3 + Math.floor(Math.random() * 2);
          this.hue = 200 + Math.random() * 20;
          this.lightness = 60 + Math.random() * 30;
          this.segments = [];
          
          // Generate crack segments
          const numSegments = 3 + Math.floor(Math.random() * 5);
          let currentX = x;
          let currentY = y;
          let currentAngle = angle;
          let remainingLength = length;
          
          for (let i = 0; i < numSegments; i++) {
            const segLength = remainingLength / (numSegments - i) * (0.5 + Math.random() * 0.8);
            const angleChange = (Math.random() - 0.5) * 0.8 * (1 + depth * 0.5);
            currentAngle += angleChange;
            const endX = currentX + Math.cos(currentAngle) * segLength;
            const endY = currentY + Math.sin(currentAngle) * segLength;
            
            this.segments.push({
              x1: currentX,
              y1: currentY,
              x2: endX,
              y2: endY,
              angle: currentAngle,
              length: segLength
            });
            
            currentX = endX;
            currentY = endY;
            remainingLength -= segLength;
          }
          
          this.endX = currentX;
          this.endY = currentY;
        }

        update(speedMult) {
          if (!this.alive) return;
          
          this.growth += this.speed * 0.02 * speedMult;
          
          if (this.growth >= 1) {
            this.growth = 1;
            this.alive = false;
            
            // Branching
            if (!this.hasBranched && this.depth < this.maxDepth && Math.random() < this.branchChance) {
              this.hasBranched = true;
              const numBranches = 1 + Math.floor(Math.random() * 2);
              for (let i = 0; i < numBranches; i++) {
                const branchAngle = this.angle + (Math.random() - 0.5) * 1.5;
                const branchLength = this.length * (0.3 + Math.random() * 0.5);
                const branch = new Crack(
                  this.endX,
                  this.endY,
                  branchAngle,
                  branchLength,
                  this.depth + 1
                );
                branch.speed = this.speed * (0.5 + Math.random() * 0.5);
                branch.branchChance = this.branchChance * 0.7;
                branch.maxDepth = this.maxDepth;
                branch.hue = this.hue + (Math.random() - 0.5) * 10;
                branch.lightness = this.lightness + (Math.random() - 0.5) * 10;
                this.children.push(branch);
              }
            }
          }
        }

        draw(ctx, progress) {
          if (this.growth === 0) return;
          
          const drawProgress = this.growth;
          const totalSegments = this.segments.length;
          const segmentsToDraw = Math.floor(totalSegments * drawProgress);
          
          for (let i = 0; i < Math.min(segmentsToDraw, totalSegments); i++) {
            const seg = this.segments[i];
            const segmentProgress = Math.min(1, (drawProgress * totalSegments - i));
            const x2 = seg.x1 + (seg.x2 - seg.x1) * segmentProgress;
            const y2 = seg.y1 + (seg.y2 - seg.y1) * segmentProgress;
            
            const alpha = this.opacity * (0.5 + 0.5 * (1 - this.depth / this.maxDepth));
            const width = this.width * (1 - this.depth * 0.15);
            
            // Glow
            const glowGrad = ctx.createRadialGradient(
              (seg.x1 + x2) / 2, (seg.y1 + y2) / 2, 0,
              (seg.x1 + x2) / 2, (seg.y1 + y2) / 2, width * 6
            );
            glowGrad.addColorStop(0, `hsla(${this.hue}, 80%, 80%, ${alpha * 0.05})`);
            glowGrad.addColorStop(1, `hsla(${this.hue}, 80%, 60%, 0)`);
            ctx.fillStyle = glowGrad;
            ctx.beginPath();
            ctx.arc((seg.x1 + x2) / 2, (seg.y1 + y2) / 2, width * 6, 0, Math.PI * 2);
            ctx.fill();
            
            // Crack line
            ctx.shadowColor = `hsla(${this.hue}, 80%, 70%, ${alpha * 0.1})`;
            ctx.shadowBlur = 5;
            ctx.strokeStyle = `hsla(${this.hue}, 70%, ${this.lightness}%, ${alpha * 0.9})`;
            ctx.lineWidth = width;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(seg.x1, seg.y1);
            ctx.lineTo(x2, y2);
            ctx.stroke();
            ctx.shadowBlur = 0;
          }
          
          // Draw children
          this.children.forEach(child => child.draw(ctx, progress));
        }

        isComplete() {
          return this.growth >= 1 && this.children.every(child => child.isComplete());
        }
      }

      // ----- Create crack -----
      function createCrack(x, y) {
        const w = canvas.width;
        const h = canvas.height;
        const length = parseInt(lengthSlider.value) / 100 * Math.min(w, h) * 0.3;
        const angle = Math.random() * Math.PI * 2;
        const hue = parseInt(colorSlider.value);
        
        const crack = new Crack(x, y, angle, length, 0);
        crack.hue = hue + (Math.random() - 0.5) * 20;
        crack.branchChance = parseInt(branchSlider.value) / 100;
        cracks.push(crack);
        
        crackCount.textContent = `✦ ${cracks.length} cracks`;
        status.textContent = `💥 Crack at (${Math.round(x)}, ${Math.round(y)})`;
        iceStatus.textContent = '🧊 Cracking...';
        
        setTimeout(() => {
          if (cracks.length > 0) {
            iceStatus.textContent = '🧊 Cracked';
          }
        }, 1000);
      }

      // ----- Random crack -----
      function randomCrack() {
        const w = canvas.width;
        const h = canvas.height;
        const padding = 40;
        const x = padding + Math.random() * (w - padding * 2);
        const y = padding + Math.random() * (h - padding * 2);
        createCrack(x, y);
      }

      // ----- Clear cracks -----
      function clearCracks() {
        cracks = [];
        crackCount.textContent = '✦ 0 cracks';
        iceStatus.textContent = '🧊 Solid';
        status.textContent = '🗑️ Cracks cleared';
        setTimeout(() => {
          status.textContent = '🧊 Click Crack or tap the ice to create cracks';
        }, 1000);
      }

      // ----- Toggle pause -----
      function togglePause() {
        isPaused = !isPaused;
        toggleBtn.textContent = isPaused ? '▶ Play' : '⏸ Pause';
        status.textContent = isPaused ? '⏸ Paused' : '▶ Resumed';
        iceStatus.textContent = isPaused ? '⏸ Paused' : '🧊 Cracking';
      }

      // ----- Reset -----
      function resetIce() {
        cracks = [];
        isPaused = false;
        toggleBtn.textContent = '⏸ Pause';
        iceStatus.textContent = '🧊 Solid';
        crackCount.textContent = '✦ 0 cracks';
        speedSlider.value = 5;
        speedValue.textContent = '5×';
        lengthSlider.value = 60;
        lengthValue.textContent = '60%';
        branchSlider.value = 50;
        branchValue.textContent = '50%';
        colorSlider.value = 200;
        colorValue.textContent = '200°';
        status.textContent = '↺ Reset';
        setTimeout(() => {
          status.textContent = '🧊 Click Crack or tap the ice to create cracks';
        }, 500);
      }

      // ----- Draw ice background -----
      function drawIce() {
        const w = canvas.width;
        const h = canvas.height;
        const cx = w / 2;
        const cy = h / 2;
        const hue = parseInt(colorSlider.value);

        // Clear
        ctx.clearRect(0, 0, w, h);

        // Ice background
        const bgGradient = ctx.createRadialGradient(cx, cy, 0, cx, cy, w * 0.8);
        bgGradient.addColorStop(0, `hsl(${hue}, 40%, 15%)`);
        bgGradient.addColorStop(0.5, `hsl(${hue + 10}, 30%, 10%)`);
        bgGradient.addColorStop(1, `hsl(${hue + 20}, 20%, 5%)`);
        ctx.fillStyle = bgGradient;
        ctx.fillRect(0, 0, w, h);

        // Ice texture (subtle)
        for (let i = 0; i < 30; i++) {
          const seed = i * 137.508;
          const x = (seed * 0.618) % w;
          const y = (seed * 0.381) % h;
          const size = 10 + (seed % 40);
          const alpha = 0.01 + (seed % 100) / 100 * 0.03;
          const offset = Math.sin(x * 0.01 + y * 0.02 + time * 0.1) * 5;
          
          ctx.fillStyle = `hsla(${hue + 20}, 40%, 80%, ${alpha})`;
          ctx.beginPath();
          ctx.ellipse(x + offset, y + offset * 0.5, size, size * 0.3, x * 0.01, 0, Math.PI * 2);
          ctx.fill();
        }

        // Ice reflections
        for (let i = 0; i < 8; i++) {
          const seed = i * 73.189;
          const x = (seed * 0.718) % w;
          const y = (seed * 0.482) % h;
          const radius = 20 + (seed % 50);
          const alpha = 0.01 + (seed % 100) / 100 * 0.02;
          const phase = time * 0.1 + seed;
          
          ctx.strokeStyle = `hsla(${hue + 30}, 50%, 80%, ${alpha})`;
          ctx.lineWidth = 0.5;
          ctx.beginPath();
          ctx.arc(x + Math.sin(phase) * 10, y + Math.cos(phase * 0.7) * 10, radius + Math.sin(phase * 0.5) * 5, 0, Math.PI * 2);
          ctx.stroke();
        }

        // Draw cracks
        if (!isPaused) {
          const speedMult = parseInt(speedSlider.value) / 5;
          cracks.forEach(c => c.update(speedMult));
        }
        cracks.forEach(c => c.draw(ctx, time));

        // Remove completed cracks (optional)
        // cracks = cracks.filter(c => !c.isComplete() || c.children.length > 0);

        // Update count
        crackCount.textContent = `✦ ${cracks.length} cracks`;
        if (cracks.length === 0 && !isPaused) {
          iceStatus.textContent = '🧊 Solid';
        }
      }

      // ----- Animation loop -----
      function animate() {
        time += 0.016;
        drawIce();
        animationId = requestAnimationFrame(animate);
      }

      // ----- Start animation -----
      function startAnimation() {
        if (animationId) {
          cancelAnimationFrame(animationId);
        }
        animate();
      }

      // ----- Event Listeners -----
      // Mouse clicks
      canvas.addEventListener('click', (e) => {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        const x = (e.clientX - rect.left) * scaleX;
        const y = (e.clientY - rect.top) * scaleY;
        createCrack(x, y);
      });

      // Touch support
      canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        const touch = e.touches[0];
        const x = (touch.clientX - rect.left) * scaleX;
        const y = (touch.clientY - rect.top) * scaleY;
        createCrack(x, y);
      });

      // Buttons
      crackBtn.addEventListener('click', randomCrack);
      clearBtn.addEventListener('click', clearCracks);
      toggleBtn.addEventListener('click', togglePause);
      resetBtn.addEventListener('click', resetIce);

      // Sliders
      speedSlider.addEventListener('input', (e) => {
        speedValue.textContent = e.target.value + '×';
      });

      lengthSlider.addEventListener('input', (e) => {
        lengthValue.textContent = e.target.value + '%';
      });

      branchSlider.addEventListener('input', (e) => {
        branchValue.textContent = e.target.value + '%';
        // Update existing cracks' branch chance
        cracks.forEach(c => {
          c.branchChance = parseInt(e.target.value) / 100;
        });
      });

      colorSlider.addEventListener('input', (e) => {
        colorValue.textContent = e.target.value + '°';
      });

      // Keyboard shortcuts
      document.addEventListener('keydown', (e) => {
        if (e.key === 'c' || e.key === 'C') {
          e.preventDefault();
          randomCrack();
        }
        if (e.key === ' ' || e.key === 'Space') {
          e.preventDefault();
          togglePause();
        }
        if (e.key === 'r' || e.key === 'R') {
          e.preventDefault();
          resetIce();
        }
        if (e.key === 'x' || e.key === 'X') {
          e.preventDefault();
          clearCracks();
        }
      });

      // ----- Resize handler -----
      let resizeTimeout;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(() => {
          setupCanvas();
        }, 200);
      });

      // ----- Init -----
      function init() {
        setupCanvas();
        startAnimation();
        status.textContent = '🧊 Click Crack or tap the ice to create cracks!';
        // Create initial crack
        setTimeout(() => {
          const w = canvas.width;
          const h = canvas.height;
          randomCrack();
        }, 500);
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }

    })();
  </script>
</body>
</html>
