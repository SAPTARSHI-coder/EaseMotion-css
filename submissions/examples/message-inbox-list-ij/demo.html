<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-message-inbox-list demo</title>
</head>
<body>
<div class="mil-inbox">
  <div class="mil-row mil-new">
    <span class="mil-avatar mil-a1">RK</span>
    <span class="mil-copy">
      <span class="mil-sender">Riya Kapoor</span>
      <span class="mil-snippet">Meeting moved to 3 PM tomorrow</span>
    </span>
    <span class="mil-dot"></span>
  </div>
  <div class="mil-row">
    <span class="mil-avatar mil-a2">TJ</span>
    <span class="mil-copy">
      <span class="mil-sender">Team Leads</span>
      <span class="mil-snippet">Deploy green, no regressions found</span>
    </span>
    <span class="mil-dot"></span>
  </div>
  <div class="mil-row">
    <span class="mil-avatar mil-a3">PN</span>
    <span class="mil-copy">
      <span class="mil-sender">Priya Nair</span>
      <span class="mil-snippet">Can you review the mockups?</span>
    </span>
  </div>
  <div class="mil-row">
    <span class="mil-avatar mil-a4">VD</span>
    <span class="mil-copy">
      <span class="mil-sender">Dev Ops</span>
      <span class="mil-snippet">Nightly build passed on all nodes</span>
    </span>
  </div>
</div>
</body>
</html>
