<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-lighthouse-beam-rotate demo</title>
</head>
<body>
<div class="lh-app">
  <div class="lh-sky">
    <span class="lh-star lh-star-1"></span>
    <span class="lh-star lh-star-2"></span>
    <span class="lh-star lh-star-3"></span>
    <span class="lh-moon"></span>
  </div>
  <div class="lh-sea">
    <span class="lh-wave lh-wave-1"></span>
    <span class="lh-wave lh-wave-2"></span>
    <span class="lh-wave lh-wave-3"></span>
  </div>
  <div class="lh-rock"></div>
  <div class="lh-tower">
    <span class="lh-lantern">
      <span class="lh-beam lh-beam-l"></span>
      <span class="lh-beam lh-beam-r"></span>
      <span class="lh-bulb"></span>
    </span>
  </div>
</div>
</body>
</html>
