<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Animated Wave Footer - EaseMotion</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <footer class="awf" aria-label="Animated wave footer">
      <div class="awf-wave" aria-hidden="true">
        <svg
          viewBox="0 0 1440 120"
          preserveAspectRatio="none"
          width="100%"
          height="80"
        >
          <path
            d="M0,60 C240,100 480,20 720,60 C960,100 1200,20 1440,60 L1440,120 L0,120 Z"
            fill="rgba(99,102,241,.25)"
          />
          <path
            d="M0,70 C240,110 480,30 720,70 C960,110 1200,30 1440,70 L1440,120 L0,120 Z"
            fill="rgba(99,102,241,.5)"
            class="awf-path2"
          />
        </svg>
      </div>
      <div class="awf-body">
        <span class="awf-brand">EaseMotion</span
        ><span class="awf-copy">&copy; 2026</span>
      </div>
    </footer>
  </body>
</html>
