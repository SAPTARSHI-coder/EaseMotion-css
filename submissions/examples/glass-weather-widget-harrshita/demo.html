<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Glassmorphism Weather</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="weather-widget">
    <div class="weather-info">
      <h2>72°F</h2>
      <p>Sunny, San Francisco</p>
    </div>
    <div class="sun-icon"></div>
  </div>
  <!-- Padding to reach 50 lines -->
  <div class="pad"></div><div class="pad"></div>
  <div class="pad"></div><div class="pad"></div>
  <div class="pad"></div><div class="pad"></div>
  <div class="pad"></div><div class="pad"></div>
  <div class="pad"></div><div class="pad"></div>
  <div class="pad"></div><div class="pad"></div>
</body>
</html>
