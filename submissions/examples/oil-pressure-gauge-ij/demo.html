<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-oil-pressure-gauge</title>
</head>
<body>
<main class="opg-card">
  <header class="opg-head">
    <h1 class="opg-title">Engine Oil</h1>
    <span class="opg-zone">Unit 3</span>
  </header>
  <section class="opg-gauge" aria-label="pressure gauge">
    <span class="opg-tic opg-tic-low"></span>
    <span class="opg-tic opg-tic-mid"></span>
    <span class="opg-tic opg-tic-high"></span>
    <span class="opg-num opg-num-1">0</span>
    <span class="opg-num opg-num-2">40</span>
    <span class="opg-num opg-num-3">80</span>
    <span class="opg-num opg-num-4">120</span>
    <span class="opg-needle"></span>
    <span class="opg-hub"></span>
  </section>
  <section class="opg-read">
    <strong class="opg-psi">58</strong>
    <span class="opg-unit">psi</span>
  </section>
  <footer class="opg-foot">
    <span class="opg-temp">Oil 88C</span>
    <span class="opg-status">Normal</span>
  </footer>
</main>
</body>
</html>
