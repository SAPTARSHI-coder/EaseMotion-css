<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Water Crane Swing — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Water Crane Swing demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Water Crane Swing</h1>
      <p class="lede">Water crane swinging over the tender</p>
    </header>

    <section class="ease-water-crane-swing" data-demo="water-crane-swing" aria-live="polite">
      <div class="ease-water-crane-swing__housing">
        <div class="ease-water-crane-swing__bezel">
          <div class="ease-water-crane-swing__face">
            <div class="ease-water-crane-swing__readout">
              <span class="ease-water-crane-swing__label">Water Crane Swing</span>
              <span class="ease-water-crane-swing__value">LIVE</span>
            </div>
            <div class="ease-water-crane-swing__motion" aria-hidden="true">
              <span class="ease-water-crane-swing__a"></span>
              <span class="ease-water-crane-swing__b"></span>
              <span class="ease-water-crane-swing__c"></span>
              <span class="ease-water-crane-swing__d"></span>
            </div>
            <div class="ease-water-crane-swing__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-water-crane-swing__controls">
          <button type="button" class="ease-water-crane-swing__btn primary">Swing</button>
          <button type="button" class="ease-water-crane-swing__btn">Stow</button>
          <label class="ease-water-crane-swing__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-water-crane-swing__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
