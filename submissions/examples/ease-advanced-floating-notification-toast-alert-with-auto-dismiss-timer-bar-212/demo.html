<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
Floating Neumorphic Toast Notification
</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<main class="container">


<section class="panel">


<h1>
Neumorphic Toast Alert
</h1>

<p>
Auto dismiss notification with timer animation
</p>


<button id="showToast">
Show Notification
</button>


</section>



<div class="toast" id="toast">


<div class="icon">
✓
</div>


<div class="content">

<h3>
Success!
</h3>

<p>
Your action completed successfully.
</p>


<div class="timer"></div>


</div>


<button id="closeToast">
×
</button>


</div>



</main>


<script src="script.js"></script>


</body>

</html>
