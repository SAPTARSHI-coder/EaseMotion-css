<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Whistle Valve Blast — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Whistle Valve Blast demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Whistle Valve Blast</h1>
      <p class="lede">Whistle valve dumping a steam blast</p>
    </header>

    <section class="ease-whistle-valve-blast" data-demo="whistle-valve-blast" aria-live="polite">
      <div class="ease-whistle-valve-blast__housing">
        <div class="ease-whistle-valve-blast__bezel">
          <div class="ease-whistle-valve-blast__face">
            <div class="ease-whistle-valve-blast__readout">
              <span class="ease-whistle-valve-blast__label">Whistle Valve Blast</span>
              <span class="ease-whistle-valve-blast__value">LIVE</span>
            </div>
            <div class="ease-whistle-valve-blast__motion" aria-hidden="true">
              <span class="ease-whistle-valve-blast__a"></span>
              <span class="ease-whistle-valve-blast__b"></span>
              <span class="ease-whistle-valve-blast__c"></span>
              <span class="ease-whistle-valve-blast__d"></span>
            </div>
            <div class="ease-whistle-valve-blast__meters">
              <i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-whistle-valve-blast__controls">
          <button type="button" class="ease-whistle-valve-blast__btn primary">Blast</button>
          <button type="button" class="ease-whistle-valve-blast__btn">Close</button>
          <label class="ease-whistle-valve-blast__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-whistle-valve-blast__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
