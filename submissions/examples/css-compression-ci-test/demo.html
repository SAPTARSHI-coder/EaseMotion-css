<!DOCTYPE html>
<html lang="en">
<head>

<title>Compression Ratio CI Integration Test</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

<h1>Compression Ratio CI Validation</h1>

<div class="status success">
    ✔ CI Check Passed
</div>

<div class="cards">

<div class="card">
<h2>Original CSS</h2>
<p>81.4 KB</p>
</div>

<div class="card">
<h2>Minified CSS</h2>
<p>23.6 KB</p>
</div>

<div class="card">
<h2>Compression Ratio</h2>
<p>71%</p>
</div>

<div class="card">
<h2>Budget</h2>
<p>&lt; 30 KB ✔</p>
</div>

</div>

<h3>Pipeline</h3>

<div class="pipeline">

<div class="step active">
Source
</div>

<div class="arrow">→</div>

<div class="step active">
Minify
</div>

<div class="arrow">→</div>

<div class="step active">
Audit
</div>

<div class="arrow">→</div>

<div class="step success">
PASS
</div>

</div>

</div>
