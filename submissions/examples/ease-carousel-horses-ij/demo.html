<!-- EaseMotion component: carousel-horses -->
<!DOCTYPE html>
<html lang="en" data-car="merry">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
<title>Ease Carousel Horses</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="merry-round">
  <div class="car-canopy">
    <span class="canopy-peak"></span>
    <span class="canopy-rim"></span>
  </div>
  <div class="center-pole">
    <span class="pole-glint"></span>
  </div>
  <div class="car-platform">
    <i class="carousel-horse ch-1"></i>
    <i class="carousel-horse ch-2"></i>
    <i class="carousel-horse ch-3"></i>
    <i class="carousel-horse ch-4"></i>
  </div>
  <div class="carousel-base">
    <span class="round-tag">MERRY-GO-ROUND</span>
  </div>
</main>
</body>
</html>
