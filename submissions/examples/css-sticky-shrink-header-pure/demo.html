<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Sticky Shrink Header</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 
      [TECHNIQUE] The Sticky Header
      This header is sticky and uses CSS scroll-driven animations 
      to dynamically shrink its padding, logo, and gain a shadow when scrolled.
    -->
    <header class="shrink-header">
        <div class="header-content">
            <div class="logo">EaseMotion</div>
            <nav class="nav-links">
                <a href="#">Home</a>
                <a href="#">Components</a>
                <a href="#">Docs</a>
            </nav>
            <a href="#" class="cta-button">Get Started</a>
        </div>
    </header>

    <main class="layout-container">
        <section class="hero-section">
            <h1 class="title">Sticky Shrink Header</h1>
            <p class="subtitle">A pure CSS implementation of a sticky header that dynamically shrinks and styles itself based on the page scroll position, using modern <code>animation-timeline: scroll()</code>.</p>
        </section>

        <!-- Dummy content to force a scrollbar -->
        <div class="scroll-content">
            <p>Scroll down to see the header react dynamically.</p>
            <div class="skeleton-block"></div>
            <div class="skeleton-block"></div>
            <div class="skeleton-block"></div>
            <div class="skeleton-block"></div>
            <div class="skeleton-block"></div>
            <div class="skeleton-block"></div>
            <div class="skeleton-block"></div>
            <div class="skeleton-block"></div>
            <p>End of page.</p>
        </div>
    </main>

</body>
</html>
