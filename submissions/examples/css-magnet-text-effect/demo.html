<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Magnet Text Effect - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="em-magnet-page">
        <div class="em-card" role="region" aria-label="Magnet Text Effect Showcase" tabindex="0">
            <span class="em-card-badge">HOVER EFFECTS</span>
            <h1 class="em-card-title">Magnet Text Effect</h1>
            <p class="em-card-desc">Interactive typography where characters magnetically disperse and react upon hover using pure CSS transitions.</p>
            
            <!-- Magnet Text Container -->
            <div class="em-magnet-container" aria-label="Interactive magnet text">
                <span class="em-magnet-word">
                    <span class="em-char" style="--i: 1;">M</span>
                    <span class="em-char" style="--i: 2;">A</span>
                    <span class="em-char" style="--i: 3;">G</span>
                    <span class="em-char" style="--i: 4;">N</span>
                    <span class="em-char" style="--i: 5;">E</span>
                    <span class="em-char" style="--i: 6;">T</span>
                    <span class="em-char space" style="--i: 7;">&nbsp;</span>
                    <span class="em-char" style="--i: 8;">T</span>
                    <span class="em-char" style="--i: 9;">E</span>
                    <span class="em-char" style="--i: 10;">X</span>
                    <span class="em-char" style="--i: 11;">T</span>
                </span>
            </div>

            <a href="#" class="em-card-btn" role="button">Explore More</a>
        </div>
    </div>
</body>
</html>
