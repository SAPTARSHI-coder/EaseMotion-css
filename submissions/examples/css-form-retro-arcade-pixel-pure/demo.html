<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Form: Retro Arcade Pixel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="arcade-cabinet">
        <header class="header">
            <h1 class="title">PLAYER 1 LOGIN</h1>
            <div class="score-row">
                <span class="score">SCORE: 000000</span>
                <span class="hi-score">HI-SCORE: 999999</span>
            </div>
        </header>

        <main class="content-area">
            
            <form class="pixel-form" action="#" method="POST">
                
                <div class="input-group">
                    <label for="username" class="pixel-label">> ENTER INITIALS</label>
                    <!-- Pixelated border container -->
                    <div class="pixel-input-wrapper">
                        <input type="text" id="username" name="username" class="pixel-input" placeholder="_ _ _" maxlength="3" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="password" class="pixel-label">> SECRET CODE</label>
                    <div class="pixel-input-wrapper">
                        <input type="password" id="password" name="password" class="pixel-input" placeholder="****" required>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="pixel-btn">
                        <span class="btn-text">PRESS START</span>
                    </button>
                </div>
                
            </form>

            <div class="insert-coin blink">INSERT COIN TO CONTINUE</div>
            
        </main>
    </div>

</body>
</html>
