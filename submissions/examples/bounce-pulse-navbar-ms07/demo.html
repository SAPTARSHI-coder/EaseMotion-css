<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EaseMotion — Bounce-Pulse Navbar</title>

<!-- EaseMotion CDN -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/easemotion-css@latest/dist/easemotion.min.css" />

<!-- Component styles -->
<link rel="stylesheet" href="style.css" />
</head>
<body>

<nav class="ease-bp-nav">
  <div class="ease-bp-nav__inner">

    <a href="#" class="ease-bp-nav__logo">
      <span class="ease-bp-nav__logo-dot" aria-hidden="true"></span>
      Portfolyo
    </a>

    <!-- Mobile toggle (checkbox hack, zero JS) -->
    <input type="checkbox" id="ease-bp-menu-toggle" class="ease-bp-nav__toggle" />
    <label for="ease-bp-menu-toggle" class="ease-bp-nav__burger" aria-label="Toggle navigation menu">
      <span></span>
      <span></span>
      <span></span>
    </label>

    <ul class="ease-bp-nav__links">
      <li><a href="#" class="ease-bp-nav__link ease-bp-nav__link--active">Home</a></li>
      <li><a href="#" class="ease-bp-nav__link">Work</a></li>
      <li><a href="#" class="ease-bp-nav__link">About</a></li>
      <li><a href="#" class="ease-bp-nav__link">Blog</a></li>
      <li><a href="#" class="ease-bp-nav__link">Contact</a></li>
    </ul>

  </div>
</nav>

<main class="ease-bp-content">
  <h1>Scroll and resize the viewport</h1>
  <p>
    Hover the nav links to see the bounce-in underline and icon bounce.
    Shrink the window below 720px to reveal the pure-CSS mobile menu toggle.
  </p>
</main>

</body>
</html>
