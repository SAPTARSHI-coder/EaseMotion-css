<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    name="description"
    content="Responsive morphing breadcrumb with a neumorphic visual style."
  />
  <title>Neumorphic Morphing Breadcrumb</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <section class="demo" aria-labelledby="breadcrumb-title">
      <div class="intro">
        <span class="intro__eyebrow">EaseMotion Component</span>
        <h1 id="breadcrumb-title">Morphing Breadcrumb</h1>
        <p>
          A responsive breadcrumb that smoothly expands its active item
          using pure HTML and CSS.
        </p>
      </div>

      <nav class="breadcrumb" aria-label="Breadcrumb">
        <a class="breadcrumb__item" href="#">
          <span class="breadcrumb__icon" aria-hidden="true">⌂</span>
          <span class="breadcrumb__label">Home</span>
        </a>

        <span class="breadcrumb__separator" aria-hidden="true">›</span>

        <a class="breadcrumb__item" href="#">
          <span class="breadcrumb__icon" aria-hidden="true">◆</span>
          <span class="breadcrumb__label">Workspace</span>
        </a>

        <span class="breadcrumb__separator" aria-hidden="true">›</span>

        <a class="breadcrumb__item" href="#">
          <span class="breadcrumb__icon" aria-hidden="true">▣</span>
          <span class="breadcrumb__label">Projects</span>
        </a>

        <span class="breadcrumb__separator" aria-hidden="true">›</span>

        <span
          class="breadcrumb__item breadcrumb__item--active"
          aria-current="page"
        >
          <span class="breadcrumb__icon" aria-hidden="true">●</span>
          <span class="breadcrumb__label">Analytics</span>
        </span>
      </nav>

      <section class="preview-card" aria-label="Current location">
        <div class="preview-card__icon" aria-hidden="true">✦</div>

        <div>
          <span class="preview-card__eyebrow">Current location</span>
          <h2>Analytics</h2>
          <p>
            Hover over the breadcrumb items to see the soft morphing
            interaction.
          </p>
        </div>
      </section>
    </section>
  </main>
</body>
</html>
