<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animated File Upload Dropzone - EaseMotion CSS</title>
  
  <!-- EaseMotion CSS via CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
  
  <!-- Custom Styles -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header ease-fade-in-down">
      <h1>Upload Files</h1>
      <p>Drag and drop your files here, or click to browse.</p>
    </header>

    <!-- Upload Card -->
    <div class="upload-card ease-fade-in-up ease-delay-100">
      
      <!-- Dropzone Area -->
      <div class="dropzone" id="dropzone">
        <input type="file" id="file-input" multiple hidden>
        
        <div class="dropzone-content">
          <div class="upload-icon-wrapper">
            <span class="upload-icon ease-pulse">☁️</span>
          </div>
          <h3 class="dropzone-title">Drag & Drop files here</h3>
          <p class="dropzone-text">or <span class="browse-link">click to browse</span></p>
          <p class="dropzone-hint">Supports JPG, PNG, PDF up to 10MB</p>
        </div>
      </div>

      <!-- Uploaded Files List -->
      <div class="files-list" id="files-list">
        <!-- Files will be injected here by JavaScript -->
      </div>

    </div>
  </div>

  <!-- JavaScript for Upload Simulation -->
  <script>
    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('file-input');
    const filesList = document.getElementById('files-list');

    // Click to browse
    dropzone.addEventListener('click', () => fileInput.click());

    // Drag and Drop visual feedback
    ['dragenter', 'dragover'].forEach(eventName => {
      dropzone.addEventListener(eventName, (e) => {
        e.preventDefault();
        dropzone.classList.add('drag-over');
      });
    });

    ['dragleave', 'drop'].forEach(eventName => {
      dropzone.addEventListener(eventName, (e) => {
        e.preventDefault();
        dropzone.classList.remove('drag-over');
      });
    });

    // Handle file selection
    fileInput.addEventListener('change', handleFiles);
    dropzone.addEventListener('drop', (e) => {
      handleFiles({ target: { files: e.dataTransfer.files } });
    });

    function handleFiles(e) {
      const files = e.target.files;
      for (let i = 0; i < files.length; i++) {
        simulateUpload(files[i]);
      }
    }

    // Simulate upload process
    function simulateUpload(file) {
      const fileId = `file-${Date.now()}-${Math.random()}`;
      const fileSize = (file.size / 1024).toFixed(1) + ' KB';
      
      // Create file item element
      const fileItem = document.createElement('div');
      fileItem.className = 'file-item ease-fade-in-up';
      fileItem.id = fileId;
      fileItem.innerHTML = `
        <div class="file-icon">📄</div>
        <div class="file-info">
          <div class="file-name">${file.name}</div>
          <div class="file-meta">
            <span class="file-size">${fileSize}</span>
            <span class="file-status uploading">Uploading...</span>
          </div>
          <div class="progress-bar">
            <div class="progress-fill"></div>
          </div>
        </div>
        <div class="file-actions">
          <span class="success-check ease-bounce-in" style="display: none;">✓</span>
          <button class="remove-btn ease-hover-grow" aria-label="Remove file">×</button>
        </div>
      `;
      
      filesList.prepend(fileItem);
      
      // Animate progress bar
      const progressFill = fileItem.querySelector('.progress-fill');
      const statusText = fileItem.querySelector('.file-status');
      const successCheck = fileItem.querySelector('.success-check');
      const removeBtn = fileItem.querySelector('.remove-btn');
      
      let progress = 0;
      const interval = setInterval(() => {
        progress += Math.random() * 15;
        if (progress >= 100) {
          progress = 100;
          clearInterval(interval);
          
          // Show success state
          progressFill.style.width = '100%';
          progressFill.classList.add('success');
          statusText.textContent = 'Completed';
          statusText.classList.remove('uploading');
          statusText.classList.add('completed');
          successCheck.style.display = 'flex';
          removeBtn.style.display = 'none';
        } else {
          progressFill.style.width = `${progress}%`;
        }
      }, 200);

      // Remove button
      removeBtn.addEventListener('click', () => {
        fileItem.classList.add('ease-fade-out');
        setTimeout(() => fileItem.remove(), 300);
      });
    }

    // Auto-trigger demo files on load
    window.addEventListener('load', () => {
      setTimeout(() => {
        const mockFiles = [
          { name: 'Project_Proposal.pdf', size: 245000 },
          { name: 'Dashboard_Mockup.png', size: 1200000 }
        ];
        mockFiles.forEach(file => simulateUpload(file));
      }, 1000);
    });
  </script>
</body>
</html>
