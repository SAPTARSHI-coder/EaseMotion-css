<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Music Player - EaseMotion CSS</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- EaseMotion CSS CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css">

    <!-- Custom Styles -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Animated Background Orbs -->
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>
    <div class="bg-orb orb-3"></div>

    <main class="player-page ease-center ease-fade-in">

        <!-- Header -->
        <header class="player-header ease-slide-up ease-delay-100">
            <span class="header-chip">🎵 Now Playing</span>
        </header>

        <!-- Music Player Card -->
        <div class="player-card ease-card ease-slide-up ease-delay-200 ease-hover-lift">

            <!-- Album Art with Spinning Disc -->
            <div class="album-section">
                <div class="disc-container">
                    <div class="vinyl-disc ease-rotate">
                        <div class="disc-groove groove-1"></div>
                        <div class="disc-groove groove-2"></div>
                        <div class="disc-groove groove-3"></div>
                        <div class="album-cover">
                            <img src="https://picsum.photos/seed/album/300/300" alt="Album Art" class="album-img">
                        </div>
                    </div>
                    <div class="disc-glow"></div>
                </div>

                <!-- Sound Wave Bars -->
                <div class="sound-waves ease-fade-in ease-delay-400">
                    <span class="wave-bar"></span>
                    <span class="wave-bar"></span>
                    <span class="wave-bar"></span>
                    <span class="wave-bar"></span>
                    <span class="wave-bar"></span>
                </div>
            </div>

            <!-- Song Info -->
            <div class="song-info ease-slide-up ease-delay-300">
                <h2 class="song-title">Midnight Dreams</h2>
                <p class="song-artist">Aurora Nights</p>
                <span class="song-album">Neon Horizons • 2026</span>
            </div>

            <!-- Progress Bar -->
            <div class="progress-section ease-slide-up ease-delay-400">
                <div class="progress-track">
                    <div class="progress-fill">
                        <div class="progress-thumb"></div>
                    </div>
                </div>
                <div class="time-labels">
                    <span class="time-current">2:45</span>
                    <span class="time-total">4:12</span>
                </div>
            </div>

            <!-- Controls -->
            <div class="controls ease-slide-up ease-delay-500">
                <button class="ctrl-btn ctrl-secondary ease-hover-grow" aria-label="Shuffle">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/>
                    </svg>
                </button>

                <button class="ctrl-btn ctrl-main ease-hover-grow" aria-label="Previous">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M19 20L9 12l10-8v16zM5 19V5h2v14H5z"/>
                    </svg>
                </button>

                <button class="ctrl-btn ctrl-play ease-hover-grow ease-pulse" aria-label="Play/Pause">
                    <svg viewBox="0 0 24 24" fill="currentColor" class="icon-play">
                        <path d="M8 5v14l11-7L8 5z"/>
                    </svg>
                </button>

                <button class="ctrl-btn ctrl-main ease-hover-grow" aria-label="Next">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M5 4l10 8-10 8V4zm12 1v14h2V5h-2z"/>
                    </svg>
                </button>

                <button class="ctrl-btn ctrl-secondary ease-hover-grow" aria-label="Repeat">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M17 1l4 4-4 4M3 11V9a4 4 0 014-4h14M7 23l-4-4 4-4M21 13v2a4 4 0 01-4 4H3"/>
                    </svg>
                </button>
            </div>

            <!-- Volume Control -->
            <div class="volume-section ease-slide-up ease-delay-600">
                <svg class="volume-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M11 5L6 9H2v6h4l5 4V5zM15.54 8.46a5 5 0 010 7.07M19.07 4.93a10 10 0 010 14.14"/>
                </svg>
                <div class="volume-track">
                    <div class="volume-fill"></div>
                </div>
            </div>

        </div>

        <!-- Up Next / Playlist Preview -->
        <div class="playlist-preview ease-slide-up ease-delay-700">
            <h3 class="playlist-title">Up Next</h3>

            <div class="playlist-item ease-hover-lift">
                <img src="https://picsum.photos/seed/song2/80/80" alt="Song 2" class="playlist-thumb">
                <div class="playlist-meta">
                    <span class="playlist-song">Electric Sunset</span>
                    <span class="playlist-artist">Neon Pulse</span>
                </div>
                <span class="playlist-duration">3:28</span>
            </div>

            <div class="playlist-item ease-hover-lift">
                <img src="https://picsum.photos/seed/song3/80/80" alt="Song 3" class="playlist-thumb">
                <div class="playlist-meta">
                    <span class="playlist-song">Starlight Avenue</span>
                    <span class="playlist-artist">Luna Wave</span>
                </div>
                <span class="playlist-duration">4:05</span>
            </div>

            <div class="playlist-item ease-hover-lift">
                <img src="https://picsum.photos/seed/song4/80/80" alt="Song 4" class="playlist-thumb">
                <div class="playlist-meta">
                    <span class="playlist-song">Crystal Rain</span>
                    <span class="playlist-artist">Echo Drift</span>
                </div>
                <span class="playlist-duration">2:56</span>
            </div>
        </div>

    </main>

</body>
</html>
