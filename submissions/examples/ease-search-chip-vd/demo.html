<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ease Search Chip</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="search-area">

    <div class="search-chip" id="chip">
        <span class="chip-label">JavaScript</span>
        <button class="remove-btn" aria-label="Remove JavaScript filter">
            ×
        </button>
    </div>

    <div class="search-chip" id="chipTwo">
        <span class="chip-label">Frontend</span>
        <button class="remove-btn" aria-label="Remove Frontend filter">
            ×
        </button>
    </div>

</div>

<script>
    document.querySelectorAll(".search-chip").forEach((chip) => {
        const removeButton = chip.querySelector(".remove-btn");

        removeButton.addEventListener("click", () => {
            chip.classList.add("remove");

            setTimeout(() => {
                chip.remove();
            }, 250);
        });
    });
</script>

</body>
</html>
