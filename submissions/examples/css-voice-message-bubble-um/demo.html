<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Voice Message Bubble - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Chat container frame -->
  <div class="chat-container">
    
    <header class="chat-header">
      <h1 class="title">Voice Message</h1>
      <p class="subtitle">Pure CSS voice message UI. Click the play button below to animate the audio waveform.</p>
    </header>

    <!-- Play Checkbox Trigger -->
    <input type="checkbox" id="play-trigger" class="play-trigger">

    <!-- Voice Message Bubble -->
    <main>
      <div class="voice-bubble">
        
        <!-- Play / Pause trigger button label -->
        <label for="play-trigger" class="play-btn" role="button" aria-label="Play voice message" tabindex="0"
               onkeydown="if(event.key === ' ' || event.key === 'Enter') document.getElementById('play-trigger').click()">
          
          <!-- Play SVG Icon -->
          <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M8 5v14l11-7z"/>
          </svg>

          <!-- Pause SVG Icon -->
          <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
          </svg>

        </label>

        <!-- Staggered Waveform bars -->
        <div class="waveform-container" aria-hidden="true">
          <div class="wave-bar wb-1"></div>
          <div class="wave-bar wb-2"></div>
          <div class="wave-bar wb-3"></div>
          <div class="wave-bar wb-4"></div>
          <div class="wave-bar wb-5"></div>
          <div class="wave-bar wb-6"></div>
          <div class="wave-bar wb-7"></div>
          <div class="wave-bar wb-8"></div>
          <div class="wave-bar wb-9"></div>
          <div class="wave-bar wb-10"></div>
          <div class="wave-bar wb-11"></div>
          <div class="wave-bar wb-12"></div>
          <div class="wave-bar wb-13"></div>
          <div class="wave-bar wb-14"></div>
        </div>

      </div>

      <!-- Bubble Metadata -->
      <div class="bubble-meta">
        <span>0:14</span>
        <span>10:24 AM</span>
      </div>
    </main>

  </div>

</body>
</html>
