<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Vintage Postcard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="postcard" aria-label="Vintage postcard component">
    <div class="message">
        <h2>Greetings!</h2>
        <p>
            Wishing you wonderful adventures and unforgettable memories.
            Sending warm wishes from a beautiful destination.
        </p>
    </div>

    <div class="divider"></div>

    <div class="address-section">
        <div class="stamp">✉</div>

        <div class="address-lines">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
        </div>
    </div>
</div>

</body>
</html>
