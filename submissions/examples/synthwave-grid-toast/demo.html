<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark light">
  <title>Synthwave Grid Line Toast</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">
    <section class="toast-demo" aria-label="Synthwave toast notification">

      <div class="toast" role="status">
        <div class="toast-icon" aria-hidden="true">
          <span>✦</span>
        </div>

        <div class="toast-content">
          <p class="toast-label">SYSTEM UPDATE</p>
          <h1>Transmission Complete</h1>
          <p class="toast-message">
            Your synthwave experience is ready to launch.
          </p>
        </div>

        <button class="toast-close" type="button" aria-label="Close notification">
          ×
        </button>
      </div>

      <div class="demo-grid" aria-hidden="true"></div>

    </section>
  </main>

</body>
</html>
