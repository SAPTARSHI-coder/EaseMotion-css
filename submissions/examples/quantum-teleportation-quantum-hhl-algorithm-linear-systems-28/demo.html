
<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum HHL Algorithm for Linear Systems - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css"></head><body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030712; color: #ffffff;">

    <div class="ease-card ease-card-glass hhl-container">
        <div class="hhl-header">
            <h2>HHL Linear Solver</h2>
            <span class="ease-badge ease-badge-primary">Solving</span>
        </div>
        
        <div class="hhl-screen ease-center">
            <div class="hhl-flux flux-hhl-a"></div>
            <div class="hhl-flux flux-hhl-b"></div>
            <div class="hhl-boundary-ring"></div>
            <div class="hhl-core ease-center"></div>
        </div>

        <div class="hhl-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Ax = b Solver via QPE &amp; Rotation</span>
            <button class="ease-btn ease-btn-primary ease-btn-sm ease-hover-grow">Run HHL Solver</button>
        </div>
    </div></body></html>
