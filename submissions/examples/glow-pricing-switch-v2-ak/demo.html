<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pricing Switcher — EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <p class="label">Pure CSS Pricing Plan Glider</p>

  <div class="ease-pricing-switch-container-ak">
    <input type="radio" name="pr-plan-ak" id="pr-m-ak" checked />
    <label for="pr-m-ak" class="ease-pricing-label-ak">Monthly</label>

    <input type="radio" name="pr-plan-ak" id="pr-y-ak" />
    <label for="pr-y-ak" class="ease-pricing-label-ak">Yearly</label>

    <span class="ease-pricing-glider-ak"></span>
  </div>

</body>
</html>
