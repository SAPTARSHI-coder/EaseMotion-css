<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glassmorphism Card & Button Component</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- Glassmorphism Card -->
        <div class="glass-card">
            <div class="card-badge">Featured</div>
            <h2 class="card-title">EaseMotion UI</h2>
            <p class="card-description">
                Experience smooth, responsive, and modern glassmorphism UI components designed for high performance.
            </p>
            <div class="button-group">
                <button class="ease-btn ease-btn-primary">Get Started</button>
                <button class="ease-btn ease-btn-outline">Learn More</button>
            </div>
        </div>
    </div>

</body>
</html>
