<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Book Cover Reveal Demo</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            margin: 0;
            height: 100vh;
            background-color: #f1f5f9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>
    <div class="ease-book-container">
        <div class="ease-book">
            <!-- The inside content (pages) -->
            <div class="ease-book-page">
                <h3>Chapter 1</h3>
                <p>An unexpected journey begins in the depths of CSS 3D transforms. Turn the page to discover more.</p>
            </div>
            
            <!-- The front cover -->
            <div class="ease-book-cover">
                EaseMotion Book
            </div>
        </div>
    </div>
</body>
</html>
