<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fluxgate Needle Hunt — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Fluxgate Needle Hunt demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Fluxgate Needle Hunt</h1>
      <p class="lede">Fluxgate magnetometer sensing coil hunt with a hunting null needle</p>
    </header>

    <section class="ease-fluxgate-needle-hunt" data-demo="fluxgate-needle-hunt" aria-live="polite">
      <div class="ease-fluxgate-needle-hunt__housing">
        <div class="ease-fluxgate-needle-hunt__bezel">
          <div class="ease-fluxgate-needle-hunt__face">
            <div class="ease-fluxgate-needle-hunt__readout">
              <span class="ease-fluxgate-needle-hunt__label">Fluxgate Needle Hunt</span>
              <span class="ease-fluxgate-needle-hunt__value">LIVE</span>
            </div>
            <div class="ease-fluxgate-needle-hunt__motion" aria-hidden="true">
              <span class="ease-fluxgate-needle-hunt__a"></span>
              <span class="ease-fluxgate-needle-hunt__b"></span>
              <span class="ease-fluxgate-needle-hunt__c"></span>
              <span class="ease-fluxgate-needle-hunt__d"></span>
            </div>
            <div class="ease-fluxgate-needle-hunt__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-fluxgate-needle-hunt__controls">
          <button type="button" class="ease-fluxgate-needle-hunt__btn primary">Engage</button>
          <button type="button" class="ease-fluxgate-needle-hunt__btn">Reset</button>
          <label class="ease-fluxgate-needle-hunt__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-fluxgate-needle-hunt__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
