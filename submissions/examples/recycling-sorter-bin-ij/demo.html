<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-recycling-sorter-bin demo</title>
</head>
<body>
<div class="rc-app">
  <span class="rc-title">SORT CENTER</span>
  <span class="rc-chute"></span>
  <div class="rc-bins">
    <div class="rc-bin rc-plastic">
      <span class="rc-lid"></span>
      <span class="rc-tag">PLASTIC</span>
    </div>
    <div class="rc-bin rc-paper">
      <span class="rc-lid"></span>
      <span class="rc-tag">PAPER</span>
    </div>
    <div class="rc-bin rc-metal">
      <span class="rc-lid"></span>
      <span class="rc-tag">METAL</span>
    </div>
  </div>
  <span class="rc-count">128 ITEMS</span>
</div>
</body>
</html>
