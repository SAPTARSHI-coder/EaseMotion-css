<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Neumorphic radial circular progress indicator">
    <title>Radial Progress Indicator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="page">
    <section class="progress-panel">
        <p class="eyebrow">EASEMOTION COMPONENT</p>

        <h1>Project Progress</h1>

        <p class="description">
            A neumorphic radial progress indicator with a smooth animated
            percentage counter.
        </p>

        <div class="progress-wrapper">
            <div class="progress-ring">
                <svg viewBox="0 0 220 220" aria-hidden="true">
                    <circle
                        class="ring-bg"
                        cx="110"
                        cy="110"
                        r="88">
                    </circle>

                    <circle
                        class="ring-progress"
                        cx="110"
                        cy="110"
                        r="88">
                    </circle>
                </svg>

                <div class="percentage">
                    <strong id="counter">0</strong>
                    <span>%</span>
                    <small>COMPLETE</small>
                </div>
            </div>
        </div>

        <div class="stats">
            <div class="stat">
                <strong>24</strong>
                <span>Tasks</span>
            </div>

            <div class="divider"></div>

            <div class="stat">
                <strong>18</strong>
                <span>Completed</span>
            </div>

            <div class="divider"></div>

            <div class="stat">
                <strong>06</strong>
                <span>Remaining</span>
            </div>
        </div>

        <button id="restart" type="button">
            Replay Animation
        </button>
    </section>
</main>

<script>
    const counter = document.getElementById("counter");
    const progressRing = document.querySelector(".ring-progress");
    const restartButton = document.getElementById("restart");

    const target = 78;
    const radius = 88;
    const circumference = 2 * Math.PI * radius;

    progressRing.style.strokeDasharray = circumference;
    progressRing.style.strokeDashoffset = circumference;

    function animateProgress() {
        let current = 0;

        counter.textContent = "0";
        progressRing.style.strokeDashoffset = circumference;

        const duration = 1800;
        const start = performance.now();

        function update(time) {
            const elapsed = time - start;
            const progress = Math.min(elapsed / duration, 1);

            current = Math.round(progress * target);

            counter.textContent = current;

            const offset =
                circumference - (current / 100) * circumference;

            progressRing.style.strokeDashoffset = offset;

            if (progress < 1) {
                requestAnimationFrame(update);
            }
        }

        requestAnimationFrame(update);
    }

    restartButton.addEventListener("click", animateProgress);

    animateProgress();
</script>

</body>
</html>
