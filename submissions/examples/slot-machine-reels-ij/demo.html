<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-slot-machine-reels demo</title>
</head>
<body>
<div class="slt-machine">
  <div class="slt-window">
    <div class="slt-reel"><b>7</b><b>BAR</b><b>CHERRY</b><b>7</b><b>LUCKY</b></div>
    <div class="slt-reel"><b>BAR</b><b>CHERRY</b><b>7</b><b>LUCKY</b><b>BAR</b></div>
    <div class="slt-reel"><b>CHERRY</b><b>7</b><b>BAR</b><b>CHERRY</b><b>7</b></div>
  </div>
  <div class="slt-line"></div>
  <div class="slt-panel">
    <span class="slt-payout">CREDIT 120</span>
    <b class="slt-spin">SPIN</b>
  </div>
</div>
</body>
</html>
