<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Modal: Dark Mode</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header class="header">
            <h1 class="title">Dark Mode Modal</h1>
            <p>Pure CSS dynamic modal using the <code>:target</code> pseudo-class.</p>
        </header>

        <main class="content-area">
            
            <!-- Trigger button to open the modal -->
            <a href="#dynamic-modal" class="btn btn-primary">Open Settings</a>
            
        </main>
    </div>

    <!-- 
      The Modal Container 
      Its ID matches the href of the trigger button.
    -->
    <div id="dynamic-modal" class="modal-overlay">
        
        <!-- Clicking the overlay closes the modal -->
        <a href="#" class="modal-close-overlay" tabindex="-1" aria-label="Close modal"></a>
        
        <!-- The Modal Content Box -->
        <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="modal-title">
            
            <div class="modal-header">
                <h2 id="modal-title" class="modal-title">System Settings</h2>
                <!-- Close Button -->
                <a href="#" class="btn-close" aria-label="Close modal">
                    <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </a>
            </div>
            
            <div class="modal-body">
                <p>Welcome to the control panel. This dynamic modal was rendered entirely without JavaScript.</p>
                
                <div class="setting-group">
                    <label class="setting-label">Notifications</label>
                    <div class="fake-toggle active"></div>
                </div>
                
                <div class="setting-group">
                    <label class="setting-label">Data Sync</label>
                    <div class="fake-toggle"></div>
                </div>
            </div>
            
            <div class="modal-footer">
                <a href="#" class="btn btn-secondary">Cancel</a>
                <a href="#" class="btn btn-primary">Save Changes</a>
            </div>
            
        </div>
    </div>

</body>
</html>
