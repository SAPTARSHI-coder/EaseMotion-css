<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Skew Active Hero Section | EaseMotion CSS</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<section class="hero">

    <div class="hero-content">

        <p class="tag">NEXT GENERATION TECHNOLOGY</p>

        <h1>
            Build Faster With
            <span>Modern CSS Motion</span>
        </h1>

        <p class="description">
            A minimalist tech hero section featuring skew-active animation,
            glassmorphism styling and smooth CSS transitions.
        </p>

        <div class="buttons">
            <button>Get Started</button>
            <button class="secondary">Explore</button>
        </div>

    </div>


    <div class="hero-card">

        <div class="glow"></div>

        <h2>AI Platform</h2>

        <p>
            Powerful tools for modern developers.
        </p>

        <div class="stats">

            <div>
                <strong>99%</strong>
                <span>Speed</span>
            </div>

            <div>
                <strong>24/7</strong>
                <span>Support</span>
            </div>

        </div>

    </div>


</section>


</body>
</html>
