<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Shimmer-Sweep Toast - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="toast-container">
        <!-- Toast 1: Success -->
        <div class="toast success" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
            </div>
            <div class="toast-content">
                <div class="toast-title">Added to Cart</div>
                <div class="toast-message">The product was successfully added to your cart.</div>
            </div>
            <button class="toast-close" aria-label="Close toast">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
            <div class="toast-progress"></div>
        </div>

        <!-- Toast 2: Info -->
        <div class="toast info" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
            </div>
            <div class="toast-content">
                <div class="toast-title">Flash Sale</div>
                <div class="toast-message">New products added to the flash sale category!</div>
            </div>
            <button class="toast-close" aria-label="Close toast">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
            <div class="toast-progress"></div>
        </div>

        <!-- Toast 3: Warning -->
        <div class="toast warning" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
            </div>
            <div class="toast-content">
                <div class="toast-title">Low Stock</div>
                <div class="toast-message">Only 2 items left in stock for this product.</div>
            </div>
            <button class="toast-close" aria-label="Close toast">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
            <div class="toast-progress"></div>
        </div>
    </div>
</body>
</html>
