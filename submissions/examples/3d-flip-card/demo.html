<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS-Only 3D Flip Card</title>
  <link rel="stylesheet" href="../../../easemotion.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body style="background-color: #f8fafc; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh;">

  <!-- 3D Flip Card Component -->
  <div class="flip-card-container">
    <div class="ease-flip-card">
      
      <!-- Front of Card -->
      <div class="ease-flip-card-front">
        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 1rem;">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
        </svg>
        <h3>Interactive 3D Card</h3>
        <p>Hover over me to flip!</p>
      </div>

      <!-- Back of Card -->
      <div class="ease-flip-card-back">
        <h4>EaseMotion Framework</h4>
        <p>This 3D flip animation uses zero JavaScript. It is powered entirely by CSS `perspective` and `transform-style: preserve-3d`.</p>
        <button class="ease-btn ease-btn-primary" style="margin-top: 1.5rem;">Learn More</button>
      </div>

    </div>
  </div>

</body>
</html>
