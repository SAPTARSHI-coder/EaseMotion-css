<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Rain Matrix - EaseMotion CSS</title>
    <!-- Include EaseMotion Core Stylesheet -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #020804; color: #ffffff;">

    <div class="ease-card ease-card-glass matrix-container">
        <div class="matrix-header">
            <h2>Digital Rain</h2>
            <span class="ease-badge ease-badge-success">Decrypted</span>
        </div>
        
        <div class="matrix-screen ease-center">
            <div class="matrix-column col-1">01010110<br>10101001<br>11001100</div>
            <div class="matrix-column col-2">11001010<br>01011010<br>10100101</div>
            <div class="matrix-column col-3">00110011<br>11001100<br>01010101</div>
            <div class="matrix-core ease-center"></div>
        </div>

        <div class="matrix-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Stream: Active</span>
            <button class="ease-btn ease-btn-primary ease-btn-sm ease-hover-grow">Inject</button>
        </div>
    </div>

</body>
</html>
