<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EaseMotion Ripple-Wave Popover - Gaming Hub</title>
    <!-- Include EaseMotion CSS -->
    <link rel="stylesheet" href="../../../ease-motion.css" onerror="this.onerror=null;this.href='https://cdn.jsdelivr.net/gh/ritikj17/EaseMotion-css@main/ease-motion.css';">
    <link rel="stylesheet" href="style.css">
    <!-- Premium Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="theme-dark">
    <!-- Immersive Background Elements -->
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>
    <div class="bg-grid"></div>

    <main class="dashboard-container ease-fade-in">
        <div class="comm-panel-wrapper ease-slide-up ease-delay-100">
            <div class="panel-header">
                <h2>Nexus Command</h2>
                <p>Manage your active gaming sessions and team comms.</p>
            </div>
            
            <div class="panel-card">
                <!-- Ripple-Wave Popover Component -->
                <div class="popover-wrapper" tabindex="-1">
                    <!-- The Interactive Trigger -->
                    <button class="voice-trigger ease-scale-up ease-delay-200" aria-haspopup="dialog" aria-expanded="false" id="voice-trigger">
                        <span class="live-pulse"></span>
                        <svg class="mic-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                            <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                            <line x1="12" y1="19" x2="12" y2="23"></line>
                            <line x1="8" y1="23" x2="16" y2="23"></line>
                        </svg>
                        <span class="trigger-text">Squad Alpha Comms</span>
                        <span class="badge">Live</span>
                        <svg class="chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="6 9 12 15 18 9"></polyline>
                        </svg>
                    </button>
                    
                    <!-- The Popover Content -->
                    <div class="popover-content ripple-wave-popover" role="dialog" aria-labelledby="voice-trigger">
                        <!-- Animated background wave rings -->
                        <div class="popover-wave-rings"></div>
                        
                        <div class="popover-inner">
                            <div class="popover-header">
                                <div class="header-info">
                                    <h4>Squad Alpha</h4>
                                    <span class="status-text">
                                        <span class="live-dot"></span> In Game - Valorant
                                    </span>
                                </div>
                                <div class="audio-bars" aria-label="Audio level indicator">
                                    <div class="bar"></div>
                                    <div class="bar"></div>
                                    <div class="bar"></div>
                                    <div class="bar"></div>
                                </div>
                            </div>
                            
                            <div class="voice-users">
                                <!-- Speaking User -->
                                <div class="user-row speaking" tabindex="0" aria-label="AlexHunter, Speaking">
                                    <div class="avatar-container">
                                        <img src="https://i.pravatar.cc/150?img=11" alt="Alex's Avatar" class="avatar">
                                        <div class="user-ripple"></div>
                                        <div class="user-ripple delay"></div>
                                    </div>
                                    <div class="user-info">
                                        <span class="username">AlexHunter</span>
                                        <span class="user-activity">Ranked Match</span>
                                    </div>
                                    <div class="user-action" aria-label="Microphone Active">
                                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                                            <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                                            <line x1="12" y1="19" x2="12" y2="23"></line>
                                            <line x1="8" y1="23" x2="16" y2="23"></line>
                                        </svg>
                                    </div>
                                </div>
                                
                                <!-- Muted User -->
                                <div class="user-row" tabindex="0" aria-label="Sarah_X, Muted">
                                    <div class="avatar-container muted">
                                        <img src="https://i.pravatar.cc/150?img=32" alt="Sarah's Avatar" class="avatar">
                                        <div class="status-badge">
                                            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                                                <line x1="1" y1="1" x2="23" y2="23"></line>
                                                <path d="M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V4a3 3 0 0 0-5.94-.6"></path>
                                                <path d="M17 16.95A7 7 0 0 1 5 12v-2m14 0v2a7 7 0 0 1-.11 1.23"></path>
                                            </svg>
                                        </div>
                                    </div>
                                    <div class="user-info">
                                        <span class="username">Sarah_X</span>
                                        <span class="user-activity">AFK - Lobby</span>
                                    </div>
                                    <div class="user-action danger" aria-label="Microphone Muted">
                                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                            <line x1="1" y1="1" x2="23" y2="23"></line>
                                            <path d="M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V4a3 3 0 0 0-5.94-.6"></path>
                                            <path d="M17 16.95A7 7 0 0 1 5 12v-2m14 0v2a7 7 0 0 1-.11 1.23"></path>
                                        </svg>
                                    </div>
                                </div>
                                
                                <!-- Normal User -->
                                <div class="user-row" tabindex="0" aria-label="ZeroCool, Listening">
                                    <div class="avatar-container">
                                        <img src="https://i.pravatar.cc/150?img=53" alt="Zero's Avatar" class="avatar">
                                    </div>
                                    <div class="user-info">
                                        <span class="username">ZeroCool</span>
                                        <span class="user-activity">Listening</span>
                                    </div>
                                    <div class="user-action" aria-label="Microphone Inactive">
                                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                                            <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                                            <line x1="12" y1="19" x2="12" y2="23"></line>
                                            <line x1="8" y1="23" x2="16" y2="23"></line>
                                        </svg>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="popover-footer">
                                <button class="control-btn" aria-label="Toggle Mute">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                                        <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                                        <line x1="12" y1="19" x2="12" y2="23"></line>
                                        <line x1="8" y1="23" x2="16" y2="23"></line>
                                    </svg>
                                </button>
                                <button class="control-btn" aria-label="Toggle Deafen">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M3 18v-6a9 9 0 0 1 18 0v6"></path>
                                        <path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"></path>
                                    </svg>
                                </button>
                                <button class="control-btn btn-danger" aria-label="Disconnect Voice">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path>
                                        <line x1="12" y1="2" x2="12" y2="12"></line>
                                    </svg>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- Secondary Decorative Stats (To demonstrate visual hierarchy) -->
                <div class="dashboard-metrics ease-fade-in ease-delay-300">
                     <div class="metric-card">
                         <span class="metric-label">Ping</span>
                         <span class="metric-value">12<small>ms</small></span>
                     </div>
                     <div class="metric-card">
                         <span class="metric-label">Packet Loss</span>
                         <span class="metric-value">0<small>%</small></span>
                     </div>
                     <div class="metric-card">
                         <span class="metric-label">Server</span>
                         <span class="metric-value" style="font-size: 1.25rem;">US East</span>
                     </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
