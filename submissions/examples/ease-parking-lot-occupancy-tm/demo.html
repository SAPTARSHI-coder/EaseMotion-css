<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Parking Lot Occupancy | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="plowrap">
    <div class="ploheader">
      <h2>Lot B</h2>
      <div class="plostats">
        <div class="plostat"><span class="plostat-val">28</span><span class="plostat-label">Free</span></div>
        <div class="plostat"><span class="plostat-val">8</span><span class="plostat-label">Taken</span></div>
      </div>
    </div>
    <div class="plolot">
      <div class="plospot plospot-taken">A1</div>
      <div class="plospot plospot-free">A2</div>
      <div class="plospot plospot-free">A3</div>
      <div class="plospot plospot-eco">A4</div>
      <div class="plospot plospot-taken">A5</div>
      <div class="plospot plospot-free">A6</div>
      <div class="plospot plospot-free">B1</div>
      <div class="plospot plospot-taken">B2</div>
      <div class="plospot plospot-free">B3</div>
      <div class="plospot plospot-free">B4</div>
      <div class="plospot plospot-eco">B5</div>
      <div class="plospot plospot-taken">B6</div>
      <div class="plospot plospot-free">C1</div>
      <div class="plospot plospot-free">C2</div>
      <div class="plospot plospot-taken">C3</div>
      <div class="plospot plospot-free">C4</div>
      <div class="plospot plospot-free">C5</div>
      <div class="plospot plospot-taken">C6</div>
    </div>
    <div class="ploenter">
      <span>Gate 2 &middot; West entrance</span>
      <span class="ploenter-status">Open</span>
    </div>
  </div>
</body>
</html>
