<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Retro Arcade Pixel Neumorphic CSS UI">
  <title>Retro Arcade Pixel Neumorphic</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="arcade">
    <section class="arcade-panel" aria-labelledby="arcade-title">

      <div class="scanlines" aria-hidden="true"></div>

      <header class="arcade-header">
        <span class="status-light" aria-hidden="true"></span>
        <p class="eyebrow">CSS NEUMORPHIC EFFECT</p>
        <h1 id="arcade-title">PIXEL ARCADE</h1>
        <p class="subtitle">RETRO SOFT-SHADOW INTERFACE</p>
      </header>

      <div class="score-board" aria-label="Game statistics">
        <div class="score-card">
          <span class="score-label">SCORE</span>
          <strong>008420</strong>
        </div>

        <div class="score-card">
          <span class="score-label">LEVEL</span>
          <strong>07</strong>
        </div>

        <div class="score-card">
          <span class="score-label">LIVES</span>
          <strong>03</strong>
        </div>
      </div>

      <div class="game-display">
        <div class="pixel-orb" aria-hidden="true">
          <span></span>
        </div>

        <div class="display-content">
          <p class="display-label">READY PLAYER</p>
          <p class="display-number">01</p>
          <p class="display-message">INSERT YOUR SKILL</p>
        </div>
      </div>

      <div class="controls">
        <button class="arcade-button primary" type="button">
          START GAME
        </button>

        <button class="arcade-button" type="button">
          OPTIONS
        </button>

        <button class="arcade-button" type="button">
          HIGH SCORES
        </button>
      </div>

      <div class="arcade-grid" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
      </div>

      <footer class="arcade-footer">
        <span>PURE CSS</span>
        <span>•</span>
        <span>NO JAVASCRIPT</span>
        <span>•</span>
        <span>PRESS START</span>
      </footer>

    </section>
  </main>
</body>
</html>
