<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2">
<title>Vending Soda Dispenser</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="soda-vendor">
  <header class="vendor-head">
    <h1 class="vendor-name">FRESHFIZZ</h1>
    <p class="vendor-temp">ICE COLD</p>
  </header>
  <section class="vendor-window" aria-label="Soda cans on display">
    <span class="can can-a">COLA</span>
    <span class="can can-b">LEM</span>
    <span class="can can-c">BER</span>
    <span class="can can-d">LIME</span>
    <span class="can can-e">ORA</span>
    <span class="can can-f">GRA</span>
  </section>
  <section class="vendor-controls" aria-label="Coin slot and selection buttons">
    <div class="coin-slot"><span class="coin-flap"></span></div>
    <div class="select-row">
      <button class="sel sel-a" type="button">A1</button>
      <button class="sel sel-b" type="button">A2</button>
      <button class="sel sel-c" type="button">A3</button>
    </div>
  </section>
  <section class="dispenser" aria-label="Pickup tray">
    <span class="can-drop">BERRY</span>
  </section>
  <footer class="vendor-foot">
    <span class="vendor-price">$1.50</span>
    <span class="vendor-stock">IN STOCK</span>
  </footer>
</main>
</body>
</html>
