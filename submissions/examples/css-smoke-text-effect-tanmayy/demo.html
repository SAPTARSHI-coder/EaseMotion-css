<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Smoke Text Effect - EaseMotion CSS</title>
  <!-- Import EaseMotion CSS -->
  <link rel="stylesheet" href="../../../easemotion.css">
  <!-- Component Specific Styles -->
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Oswald:wght@700&display=swap" rel="stylesheet">
</head>
<body class="minimalist-bg">

  <div class="demo-container">
    
    <div class="header-section">
      <h1 class="ease-text-3xl">Smoke Text Effect</h1>
      <p class="ease-color-muted">Hover over or tap the words below to watch them dissipate into smoke. Powered entirely by CSS filters and transforms.</p>
    </div>

    <!-- The Smoke Effect Container -->
    <div class="smoke-card ease-glass-card">
      
      <!-- Word 1 -->
      <h2 class="smoke-word" aria-label="HOVER">
        <span>H</span><span>O</span><span>V</span><span>E</span><span>R</span>
      </h2>
      
      <!-- Word 2 -->
      <h2 class="smoke-word" aria-label="SMOKE">
        <span>S</span><span>M</span><span>O</span><span>K</span><span>E</span>
      </h2>
      
      <!-- Word 3 -->
      <h2 class="smoke-word" aria-label="EFFECT">
        <span>E</span><span>F</span><span>F</span><span>E</span><span>C</span><span>T</span>
      </h2>

    </div>
    
    <p class="footer-note">Note: Focus states are also supported for keyboard navigation.</p>

  </div>

</body>
</html>
