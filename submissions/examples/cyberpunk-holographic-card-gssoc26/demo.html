<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyberpunk Holographic Card - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="cyber-container">
    <div class="cyber-card" data-corner="NX-90">
      <div class="scanlines"></div>
      <div class="cyber-card-header">
        <span class="cyber-tag">SYSTEM ONLINE</span>
        <span class="cyber-id">ID: #8809-CYBER</span>
      </div>
      
      <div class="cyber-card-body">
        <h2 class="glitch-text" data-text="NEURAL MATRIX">NEURAL MATRIX</h2>
        <p class="cyber-desc">High-frequency cybernetic node processing real-time CSS motion vectors.</p>
        
        <div class="cyber-stats">
          <div class="stat-box">
            <span class="stat-label">BANDWIDTH</span>
            <span class="stat-value">12.4 TB/s</span>
          </div>
          <div class="stat-box">
            <span class="stat-label">LATENCY</span>
            <span class="stat-value">0.14 ms</span>
          </div>
        </div>
      </div>

      <div class="cyber-card-footer">
        <button class="cyber-btn">INITIALIZE</button>
      </div>
    </div>
  </div>
</body>
</html>
