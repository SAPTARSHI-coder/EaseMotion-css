<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Responsive neumorphic dynamic datepicker built with pure HTML and CSS."
  >

  <title>Neumorphic Dynamic Datepicker</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="page">
    <section
      class="datepicker"
      aria-labelledby="datepicker-title"
    >

      <header class="datepicker-header">
        <div>
          <span class="eyebrow">EaseMotion CSS</span>

          <h1 id="datepicker-title">
            Select a date
          </h1>
        </div>

        <button
          class="calendar-toggle"
          type="button"
          aria-label="Calendar options"
        >
          <span aria-hidden="true">▦</span>
        </button>
      </header>

      <div class="selected-date">
        <span class="selected-label">Selected date</span>

        <strong>
          Monday, August 17
        </strong>
      </div>

      <div class="calendar">

        <div class="calendar-toolbar">

          <button
            class="nav-button"
            type="button"
            aria-label="Previous month"
          >
            ‹
          </button>

          <h2>August 2026</h2>

          <button
            class="nav-button"
            type="button"
            aria-label="Next month"
          >
            ›
          </button>

        </div>

        <div class="weekdays" aria-hidden="true">
          <span>Sun</span>
          <span>Mon</span>
          <span>Tue</span>
          <span>Wed</span>
          <span>Thu</span>
          <span>Fri</span>
          <span>Sat</span>
        </div>

        <div
          class="days"
          role="grid"
          aria-label="August 2026"
        >

          <button class="day muted" type="button" tabindex="-1">
            26
          </button>

          <button class="day muted" type="button" tabindex="-1">
            27
          </button>

          <button class="day muted" type="button" tabindex="-1">
            28
          </button>

          <button class="day muted" type="button" tabindex="-1">
            29
          </button>

          <button class="day muted" type="button" tabindex="-1">
            30
          </button>

          <button class="day muted" type="button" tabindex="-1">
            31
          </button>

          <button class="day" type="button">
            1
          </button>

          <button class="day" type="button">
            2
          </button>

          <button class="day" type="button">
            3
          </button>

          <button class="day" type="button">
            4
          </button>

          <button class="day" type="button">
            5
          </button>

          <button class="day" type="button">
            6
          </button>

          <button class="day" type="button">
            7
          </button>

          <button class="day" type="button">
            8
          </button>

          <button class="day" type="button">
            9
          </button>

          <button class="day" type="button">
            10
          </button>

          <button class="day" type="button">
            11
          </button>

          <button class="day" type="button">
            12
          </button>

          <button class="day" type="button">
            13
          </button>

          <button class="day" type="button">
            14
          </button>

          <button class="day" type="button">
            15
          </button>

          <button class="day" type="button">
            16
          </button>

          <button
            class="day today selected"
            type="button"
            aria-current="date"
            aria-label="August 17, selected"
          >
            17
          </button>

          <button class="day" type="button">
            18
          </button>

          <button class="day" type="button">
            19
          </button>

          <button class="day" type="button">
            20
          </button>

          <button class="day" type="button">
            21
          </button>

          <button class="day" type="button">
            22
          </button>

          <button class="day" type="button">
            23
          </button>

          <button class="day" type="button">
            24
          </button>

          <button class="day" type="button">
            25
          </button>

          <button class="day" type="button">
            26
          </button>

          <button class="day" type="button">
            27
          </button>

          <button class="day" type="button">
            28
          </button>

          <button class="day" type="button">
            29
          </button>

          <button class="day" type="button">
            30
          </button>

          <button class="day" type="button">
            31
          </button>

          <button class="day muted" type="button" tabindex="-1">
            1
          </button>

          <button class="day muted" type="button" tabindex="-1">
            2
          </button>

          <button class="day muted" type="button" tabindex="-1">
            3
          </button>

          <button class="day muted" type="button" tabindex="-1">
            4
          </button>

          <button class="day muted" type="button" tabindex="-1">
            5
          </button>

        </div>

      </div>

      <footer class="datepicker-footer">

        <button
          class="secondary-button"
          type="button"
        >
          Cancel
        </button>

        <button
          class="primary-button"
          type="button"
        >
          Confirm date
        </button>

      </footer>

    </section>
  </main>

</body>
</html>
