<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ease-radial-menu-sap demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f4f4f5;
    }
  </style>
</head>
<body>

  <div class="radial-menu-sap" id="radial">
    <button class="radial-trigger" id="trigger" aria-label="Toggle menu">+</button>
    <a href="#" class="radial-item">🏠</a>
    <a href="#" class="radial-item">⭐</a>
    <a href="#" class="radial-item">❤️</a>
    <a href="#" class="radial-item">⚙️</a>
  </div>

  <script>
    const wrap = document.getElementById('radial');
    const trigger = document.getElementById('trigger');
    trigger.addEventListener('click', () => wrap.classList.toggle('open'));
  </script>

</body>
</html>
