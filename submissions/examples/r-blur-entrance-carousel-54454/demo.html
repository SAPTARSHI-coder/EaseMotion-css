<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Blur-Entrance Carousel</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<section class="carousel">

    <h1>Creative Portfolio Showcase</h1>

    <div class="carousel-track">

        <article class="card">
            <img src="https://picsum.photos/400/280?11" alt="Brand Identity">
            <div class="card-content">
                <h2>Brand Identity</h2>
                <p>Create memorable branding systems with clean visual language.</p>
            </div>
        </article>

        <article class="card active">
            <img src="https://picsum.photos/400/280?12" alt="UI Design">
            <div class="card-content">
                <h2>UI / UX Design</h2>
                <p>Design beautiful interfaces with accessibility and responsiveness.</p>
            </div>
        </article>

        <article class="card">
            <img src="https://picsum.photos/400/280?13" alt="Development">
            <div class="card-content">
                <h2>Development</h2>
                <p>Transform concepts into responsive and engaging web experiences.</p>
            </div>
        </article>

    </div>

</section>

</body>
</html>
