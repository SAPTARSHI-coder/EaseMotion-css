<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ease-glitch-text Demo</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body { display: flex; flex-direction: column; align-items: center; gap: 48px; padding: 60px 20px; background: #0a0a1a; }
    h1 { font-size: 1.4rem; color: #f8fafc; }
    .demo-section { display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .demo-label { font-size: 0.8rem; color: rgba(248,250,252,0.45); }
    .row { display: flex; gap: 32px; flex-wrap: wrap; justify-content: center; }
  </style>
</head>
<body>
  <h1>ease-glitch-text Component</h1>

  <div class="demo-section">
    <span class="demo-label">Default glitch text</span>
    <div class="glitch-text" data-text="GLITCH">GLITCH</div>
  </div>

  <div class="demo-section">
    <span class="demo-label">Scanlines variant</span>
    <div class="glitch-text scanlines" data-text="SCANLINE">SCANLINE</div>
  </div>

  <div class="demo-section">
    <span class="demo-label">RGB split variant</span>
    <div class="glitch-text rgb-split" data-text="RGB SHIFT">RGB SHIFT</div>
  </div>

  <div class="demo-section">
    <span class="demo-label">Hover trigger variant</span>
    <div class="glitch-text hover-trigger" data-text="HOVER ME">HOVER ME</div>
  </div>

  <div class="demo-section">
    <span class="demo-label">Color themes</span>
    <div class="row">
      <div class="glitch-text theme-cyan" data-text="CYAN">CYAN</div>
      <div class="glitch-text theme-green" data-text="GREEN">GREEN</div>
      <div class="glitch-text theme-fire" data-text="FIRE">FIRE</div>
    </div>
  </div>

  <div class="demo-section">
    <span class="demo-label">Size variants</span>
    <div class="row">
      <div class="glitch-text size-sm" data-text="SMALL">SMALL</div>
      <div class="glitch-text size-md" data-text="MEDIUM">MEDIUM</div>
      <div class="glitch-text size-lg" data-text="LARGE">LARGE</div>
    </div>
  </div>

  <div class="component-label">ease-glitch-text | Issue #64941</div>
</body>
</html>
