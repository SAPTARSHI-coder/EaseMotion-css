<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Loader: Solar Flare Radial</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="layout-container">
        
        <header class="section-header">
            <h1 class="title">Pure CSS Loader: Solar Flare</h1>
            <p class="subtitle">An energetic, glowing loader utilizing staggered radial gradients, extreme blurring, and infinite scale animations to simulate coronal mass ejections.</p>
        </header>

        <div class="demo-area">
            
            <div class="loader-container" aria-label="Loading content, solar flare animation playing">
                
                <!-- 
                  [TECHNIQUE] Solar Flare Radial
                  A solid central core represents a star.
                  Multiple absolute-positioned rings behind it scale outward
                  and fade to 0 opacity, simulating continuous radial flares.
                -->
                <div class="solar-wrapper" aria-hidden="true">
                    
                    <!-- The expanding flares/coronal ejections -->
                    <div class="flare flare-1"></div>
                    <div class="flare flare-2"></div>
                    <div class="flare flare-3"></div>
                    
                    <!-- The solid glowing center -->
                    <div class="solar-core"></div>
                    
                </div>
                
                <div class="loading-text">Igniting...</div>
                
            </div>
            
        </div>
        
    </div>

</body>
</html>
