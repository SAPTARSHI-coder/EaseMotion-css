<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Responsive gradient hover tab bar built with pure HTML and CSS."
  >
  <title>Gradient Hover Tab Bar</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="demo-page">

    <section class="demo-card" aria-labelledby="demo-title">

      <div class="heading">
        <span class="eyebrow">EASEMOTION CSS</span>
        <h1 id="demo-title">Gradient Hover Tab Bar</h1>
        <p>
          A smooth, responsive navigation tab bar with animated
          gradient hover effects using only HTML and CSS.
        </p>
      </div>

      <nav class="tab-bar" aria-label="Main navigation">
        <a href="#home" class="tab active">
          <span class="tab-icon" aria-hidden="true">⌂</span>
          <span>Home</span>
        </a>

        <a href="#explore" class="tab">
          <span class="tab-icon" aria-hidden="true">✦</span>
          <span>Explore</span>
        </a>

        <a href="#projects" class="tab">
          <span class="tab-icon" aria-hidden="true">▣</span>
          <span>Projects</span>
        </a>

        <a href="#about" class="tab">
          <span class="tab-icon" aria-hidden="true">●</span>
          <span>About</span>
        </a>

        <a href="#contact" class="tab">
          <span class="tab-icon" aria-hidden="true">✉</span>
          <span>Contact</span>
        </a>
      </nav>

      <div class="hint">
        <span aria-hidden="true">✦</span>
        Hover over a tab to see the gradient animation
      </div>

    </section>

  </main>
</body>
</html>
