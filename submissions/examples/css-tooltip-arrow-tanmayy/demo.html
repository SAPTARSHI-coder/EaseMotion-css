<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Tooltip Arrow - EaseMotion CSS</title>
  <!-- Import EaseMotion CSS -->
  <link rel="stylesheet" href="../../../easemotion.css">
  <!-- Component Specific Styles -->
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body class="minimalist-bg">

  <div class="demo-container">
    
    <div class="header-section">
      <h1 class="ease-text-3xl">CSS Tooltip Arrow</h1>
      <p class="ease-color-muted">Pure CSS, JavaScript-free tooltips with perfectly aligned directional arrows. Hover or focus the buttons below to see them in action.</p>
    </div>

    <!-- Tooltip Grid Display -->
    <div class="tooltip-grid">
      
      <!-- Top Tooltip -->
      <div class="tooltip-demo-cell">
        <button class="demo-btn tooltip tooltip-top" data-tooltip="This tooltip appears above!" aria-label="Show top tooltip">
          Top Tooltip
        </button>
      </div>

      <!-- Right Tooltip -->
      <div class="tooltip-demo-cell">
        <button class="demo-btn tooltip tooltip-right" data-tooltip="This tooltip appears on the right!" aria-label="Show right tooltip">
          Right Tooltip
        </button>
      </div>

      <!-- Left Tooltip -->
      <div class="tooltip-demo-cell">
        <button class="demo-btn tooltip tooltip-left" data-tooltip="This tooltip appears on the left!" aria-label="Show left tooltip">
          Left Tooltip
        </button>
      </div>

      <!-- Bottom Tooltip -->
      <div class="tooltip-demo-cell">
        <button class="demo-btn tooltip tooltip-bottom" data-tooltip="This tooltip appears below!" aria-label="Show bottom tooltip">
          Bottom Tooltip
        </button>
      </div>

    </div>
    
    <div class="footer-note">
      <p>Works flawlessly with keyboard navigation (try pressing Tab).</p>
    </div>

  </div>

</body>
</html>
