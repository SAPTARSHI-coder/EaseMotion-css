<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floating Toast Notification Component</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="ease-toast ease-toast-slide-in">
        <div class="ease-toast-content">
            <span class="ease-toast-icon">✅</span>
            <div class="ease-toast-message">
                <h4>Changes Saved</h4>
                <p>Your profile settings have been updated.</p>
            </div>
        </div>
        <div class="ease-toast-progress ease-toast-drain"></div>
    </div>

</body>
</html>
