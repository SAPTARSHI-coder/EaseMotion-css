<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DNA Loader · Helix Spin & Replicate</title>

    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <div class="card">
        <h2>🧬 DNA Loader</h2>
        <p class="sub">DNA helix spins and replicates</p>

        <!-- === DNA LOADER === -->
        <div class="dna-container" id="dnaContainer">
            <div class="dna-helix">
                <!-- Strand 1 -->
                <div class="dna-strand strand-1">
                    <div class="dna-base base-1"></div>
                    <div class="dna-base base-2"></div>
                    <div class="dna-base base-3"></div>
                    <div class="dna-base base-4"></div>
                    <div class="dna-base base-5"></div>
                    <div class="dna-base base-6"></div>
                    <div class="dna-base base-7"></div>
                    <div class="dna-base base-8"></div>
                    <div class="dna-base base-9"></div>
                    <div class="dna-base base-10"></div>
                    <div class="dna-base base-11"></div>
                    <div class="dna-base base-12"></div>
                </div>

                <!-- Strand 2 -->
                <div class="dna-strand strand-2">
                    <div class="dna-base base-1"></div>
                    <div class="dna-base base-2"></div>
                    <div class="dna-base base-3"></div>
                    <div class="dna-base base-4"></div>
                    <div class="dna-base base-5"></div>
                    <div class="dna-base base-6"></div>
                    <div class="dna-base base-7"></div>
                    <div class="dna-base base-8"></div>
                    <div class="dna-base base-9"></div>
                    <div class="dna-base base-10"></div>
                    <div class="dna-base base-11"></div>
                    <div class="dna-base base-12"></div>
                </div>

                <!-- Rungs (connections) -->
                <div class="dna-rung rung-1"></div>
                <div class="dna-rung rung-2"></div>
                <div class="dna-rung rung-3"></div>
                <div class="dna-rung rung-4"></div>
                <div class="dna-rung rung-5"></div>
                <div class="dna-rung rung-6"></div>
                <div class="dna-rung rung-7"></div>
                <div class="dna-rung rung-8"></div>
                <div class="dna-rung rung-9"></div>
                <div class="dna-rung rung-10"></div>
                <div class="dna-rung rung-11"></div>
                <div class="dna-rung rung-12"></div>

                <!-- Replication particles -->
                <div class="dna-particle p1"></div>
                <div class="dna-particle p2"></div>
                <div class="dna-particle p3"></div>
                <div class="dna-particle p4"></div>
                <div class="dna-particle p5"></div>
                <div class="dna-particle p6"></div>
                <div class="dna-particle p7"></div>
                <div class="dna-particle p8"></div>
            </div>
        </div>

        <p style="margin-top: 2rem; font-size: 0.85rem; color: #64748b;">
            DNA helix spinning · replicating animation
        </p>
    </div>

    <!-- Embedded JavaScript -->
    <script>
        (function() {
            'use strict';

            const container = document.getElementById('dnaContainer');

            // Click to restart animation
            container.addEventListener('click', function() {
                const helix = this.querySelector('.dna-helix');
                const particles = this.querySelectorAll('.dna-particle');
                const bases = this.querySelectorAll('.dna-base');

                helix.style.animation = 'none';
                void helix.offsetWidth;
                helix.style.animation = '';

                particles.forEach(p => {
                    p.style.animation = 'none';
                    void p.offsetWidth;
                    p.style.animation = '';
                });

                bases.forEach(b => {
                    b.style.animation = 'none';
                    void b.offsetWidth;
                    b.style.animation = '';
                });

                this.classList.add('click-pulse');
                setTimeout(() => {
                    this.classList.remove('click-pulse');
                }, 300);

                console.log('🧬 DNA loader restarted!');
            });

            // Keyboard accessibility
            container.setAttribute('tabindex', '0');
            container.setAttribute('role', 'button');
            container.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    this.click();
                }
            });

            console.log('🧬 DNA loader initialized!');

        })();
    </script>

</body>
</html>
