<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Aurora Glow CSS rating component"
    >

    <title>Aurora Glow Rating</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="page">
        <div class="aurora aurora-one" aria-hidden="true"></div>
        <div class="aurora aurora-two" aria-hidden="true"></div>
        <div class="aurora aurora-three" aria-hidden="true"></div>

        <section
            class="rating-card"
            aria-labelledby="rating-title"
        >
            <div class="orb" aria-hidden="true">
                <span>✦</span>
            </div>

            <p class="eyebrow">AURORA // FEEDBACK</p>

            <h1 id="rating-title">
                Rate your <span>experience</span>
            </h1>

            <p class="description">
                Choose a rating and let your feedback glow.
            </p>

            <fieldset class="rating">
                <legend class="sr-only">
                    Select a rating from one to five stars
                </legend>

                <input
                    type="radio"
                    id="rating-5"
                    name="rating"
                    value="5"
                >
                <label for="rating-5" title="5 out of 5 stars">
                    <span aria-hidden="true">★</span>
                    <span class="sr-only">5 stars</span>
                </label>

                <input
                    type="radio"
                    id="rating-4"
                    name="rating"
                    value="4"
                >
                <label for="rating-4" title="4 out of 5 stars">
                    <span aria-hidden="true">★</span>
                    <span class="sr-only">4 stars</span>
                </label>

                <input
                    type="radio"
                    id="rating-3"
                    name="rating"
                    value="3"
                >
                <label for="rating-3" title="3 out of 5 stars">
                    <span aria-hidden="true">★</span>
                    <span class="sr-only">3 stars</span>
                </label>

                <input
                    type="radio"
                    id="rating-2"
                    name="rating"
                    value="2"
                >
                <label for="rating-2" title="2 out of 5 stars">
                    <span aria-hidden="true">★</span>
                    <span class="sr-only">2 stars</span>
                </label>

                <input
                    type="radio"
                    id="rating-1"
                    name="rating"
                    value="1"
                >
                <label for="rating-1" title="1 out of 5 stars">
                    <span aria-hidden="true">★</span>
                    <span class="sr-only">1 star</span>
                </label>
            </fieldset>

            <div class="status" aria-hidden="true">
                <span class="status-dot"></span>
                <span>AURORA SIGNAL ACTIVE</span>
            </div>

            <p class="hint">
                Select a star to submit your visual rating.
            </p>
        </section>
    </main>
</body>
</html>
