<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CSS Shimmer-Sweep Progress Bar for Gaming Hub layouts">
  <title>Shimmer-Sweep Progress Bar</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="showcase">
    <section class="game-card" aria-labelledby="title">

      <div class="card-header">
        <div>
          <p class="eyebrow">GAMING HUB</p>
          <h1 id="title">Mission Progress</h1>
        </div>

        <span class="status">IN PROGRESS</span>
      </div>

      <div class="progress-section">
        <div class="progress-info">
          <span>Level Completion</span>
          <strong>75%</strong>
        </div>

        <div
          class="progress-track"
          role="progressbar"
          aria-label="Mission progress"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="75"
        >
          <div class="progress-fill"></div>
        </div>

        <div class="progress-meta">
          <span>750 / 1000 XP</span>
          <span>250 XP remaining</span>
        </div>
      </div>

      <div class="stats">
        <div class="stat">
          <span class="stat-label">CURRENT LEVEL</span>
          <strong>24</strong>
        </div>

        <div class="stat">
          <span class="stat-label">NEXT REWARD</span>
          <strong>+500 XP</strong>
        </div>

        <div class="stat">
          <span class="stat-label">COMPLETION</span>
          <strong>75%</strong>
        </div>
      </div>

      <button class="action-button" type="button">
        Continue Mission
      </button>

    </section>
  </main>

</body>
</html>
