<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cannon Pinion Drive — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Cannon Pinion Drive demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Cannon Pinion Drive</h1>
      <p class="lede">Cannon pinion driving minute hand motion from the center</p>
    </header>

    <section class="ease-cannon-pinion-drive" data-demo="cannon-pinion-drive" aria-live="polite">
      <div class="ease-cannon-pinion-drive__housing">
        <div class="ease-cannon-pinion-drive__bezel">
          <div class="ease-cannon-pinion-drive__face">
            <div class="ease-cannon-pinion-drive__readout">
              <span class="ease-cannon-pinion-drive__label">Cannon Pinion Drive</span>
              <span class="ease-cannon-pinion-drive__value">LIVE</span>
            </div>
            <div class="ease-cannon-pinion-drive__motion" aria-hidden="true">
              <span class="ease-cannon-pinion-drive__a"></span>
              <span class="ease-cannon-pinion-drive__b"></span>
              <span class="ease-cannon-pinion-drive__c"></span>
              <span class="ease-cannon-pinion-drive__d"></span>
            </div>
            <div class="ease-cannon-pinion-drive__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-cannon-pinion-drive__controls">
          <button type="button" class="ease-cannon-pinion-drive__btn primary">Engage</button>
          <button type="button" class="ease-cannon-pinion-drive__btn">Reset</button>
          <label class="ease-cannon-pinion-drive__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-cannon-pinion-drive__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
