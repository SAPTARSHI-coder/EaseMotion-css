<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Parallax input field showcase for EaseMotion CSS issue #78679." />
    <title>Parallax Input Field</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="page">
      <form class="field-card" action="#" method="get">
        <p class="eyebrow">EaseMotion CSS · Issue #78679</p>
        <h1>Parallax Input Field</h1>
        <p class="description">
          Focus the field to reveal a subtle lift and layered depth response.
        </p>

        <div class="field-group">
          <label for="email">Email address</label>
          <div class="field">
            <span class="icon" aria-hidden="true">@</span>
            <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" />
          </div>
          <p class="helper">We use this address for account communication.</p>
        </div>

        <button type="submit">Continue</button>
      </form>
    </main>
  </body>
</html>
