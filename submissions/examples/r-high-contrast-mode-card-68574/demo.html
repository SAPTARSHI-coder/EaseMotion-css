<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Accessible CSS high contrast mode card."
  >
  <title>CSS High Contrast Mode Card</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">
    <article class="contrast-card" aria-labelledby="card-title">

      <div class="card-icon" aria-hidden="true">
        ◐
      </div>

      <div class="card-content">
        <span class="eyebrow">Accessibility</span>

        <h1 id="card-title">High Contrast Mode</h1>

        <p>
          This card uses strong colors, visible borders, and clear
          focus states to remain readable across different contrast
          preferences.
        </p>

        <div class="features" aria-label="Accessibility features">
          <span>Strong Contrast</span>
          <span>Visible Focus</span>
          <span>Clear States</span>
        </div>

        <button type="button" class="action">
          Explore Settings
          <span aria-hidden="true">→</span>
        </button>
      </div>

    </article>
  </main>

</body>
</html>
