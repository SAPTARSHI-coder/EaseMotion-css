<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 3D Image Cube</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="layout-container">
        
        <header class="section-header">
            <h1 class="title">3D Image Cube</h1>
            <p class="subtitle">A hardware-accelerated, infinitely rotating 3D cube built entirely with CSS transforms.</p>
        </header>

        <div class="demo-area">
            
            <!-- 
               [TECHNIQUE 1] Perspective Scene:
               The outer container establishes the 3D rendering context (the "camera" distance).
            -->
            <div class="scene">
                <!-- 
                   [TECHNIQUE 2] Preserve 3D:
                   The inner cube container preserves the 3D space for its children,
                   and holds the continuous rotation keyframe animation.
                -->
                <div class="cube">
                    <!-- The 6 faces of the cube -->
                    <div class="cube-face cube-front">
                        <img src="https://picsum.photos/seed/front/400/400" alt="Front Face" loading="lazy">
                    </div>
                    <div class="cube-face cube-back">
                        <img src="https://picsum.photos/seed/back/400/400" alt="Back Face" loading="lazy">
                    </div>
                    <div class="cube-face cube-right">
                        <img src="https://picsum.photos/seed/right/400/400" alt="Right Face" loading="lazy">
                    </div>
                    <div class="cube-face cube-left">
                        <img src="https://picsum.photos/seed/left/400/400" alt="Left Face" loading="lazy">
                    </div>
                    <div class="cube-face cube-top">
                        <img src="https://picsum.photos/seed/top/400/400" alt="Top Face" loading="lazy">
                    </div>
                    <div class="cube-face cube-bottom">
                        <img src="https://picsum.photos/seed/bottom/400/400" alt="Bottom Face" loading="lazy">
                    </div>
                </div>
            </div>
            
        </div>
    </div>

</body>
</html>
