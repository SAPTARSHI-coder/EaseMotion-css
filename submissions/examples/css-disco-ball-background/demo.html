<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Disco Ball Background - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="em-disco-page">
        <!-- Floating Light Reflection Sparkles -->
        <div class="em-sparkle em-s1" aria-hidden="true"></div>
        <div class="em-sparkle em-s2" aria-hidden="true"></div>
        <div class="em-sparkle em-s3" aria-hidden="true"></div>
        <div class="em-sparkle em-s4" aria-hidden="true"></div>

        <div class="em-card" role="region" aria-label="Disco Ball Background Showcase" tabindex="0">
            <span class="em-card-badge">ATMOSPHERIC EFFECTS</span>
            <h1 class="em-card-title">Disco Ball Background</h1>
            <p class="em-card-desc">An immersive atmospheric backdrop featuring bouncing disco ball light reflections and shimmering refractions using pure CSS keyframes.</p>
            <a href="#" class="em-card-btn" role="button">Join the Party</a>

    </div>

</html>
