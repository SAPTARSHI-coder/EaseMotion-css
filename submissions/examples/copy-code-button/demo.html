<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Copy Code Button Demo</title>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
  />

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="container">
    <h1>Installation</h1>

    <!-- Code Block 1 -->
    <div class="code-block">
      <button class="copy-btn" aria-label="Copy Code">
        <i class="fa-regular fa-copy"></i>
      </button>

      <pre><code>npm install easemotion-css</code></pre>
    </div>

    <!-- Code Block 2 -->
    <div class="code-block">
      <button class="copy-btn" aria-label="Copy Code">
        <i class="fa-regular fa-copy"></i>
      </button>

<pre><code>&lt;link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/easemotion-css/easemotion.min.css"&gt;
</code></pre>
    </div>

    <!-- Code Block 3 -->
    <div class="code-block">
      <button class="copy-btn" aria-label="Copy Code">
        <i class="fa-regular fa-copy"></i>
      </button>

      <pre><code>@import "easemotion-css/easemotion.min.css";</code></pre>
    </div>
  </div>

  <script>
    // Select all copy buttons
    const copyButtons = document.querySelectorAll(".copy-btn");

    copyButtons.forEach((button) => {
      button.addEventListener("click", async () => {
        const code = button.parentElement.querySelector("code").innerText;

        try {
          // Copy text to clipboard
          await navigator.clipboard.writeText(code);

          // Success state
          button.classList.add("success");
          button.innerHTML = '<i class="fa-solid fa-check"></i>';

          // Restore after 1.5 seconds
          setTimeout(() => {
            button.classList.remove("success");
            button.innerHTML = '<i class="fa-regular fa-copy"></i>';
          }, 1500);

        } catch (error) {
          console.error("Failed to copy:", error);
        }
      });
    });
  </script>

</body>
</html>
