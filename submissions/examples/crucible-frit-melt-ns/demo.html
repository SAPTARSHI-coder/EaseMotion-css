<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crucible Frit Melt — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Crucible Frit Melt demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Crucible Frit Melt</h1>
      <p class="lede">Crucible frit collapsing into a clear melt</p>
    </header>

    <section class="ease-crucible-frit-melt" data-demo="crucible-frit-melt" aria-live="polite">
      <div class="ease-crucible-frit-melt__housing">
        <div class="ease-crucible-frit-melt__bezel">
          <div class="ease-crucible-frit-melt__face">
            <div class="ease-crucible-frit-melt__readout">
              <span class="ease-crucible-frit-melt__label">Crucible Frit Melt</span>
              <span class="ease-crucible-frit-melt__value">LIVE</span>
            </div>
            <div class="ease-crucible-frit-melt__motion" aria-hidden="true">
              <span class="ease-crucible-frit-melt__a"></span>
              <span class="ease-crucible-frit-melt__b"></span>
              <span class="ease-crucible-frit-melt__c"></span>
              <span class="ease-crucible-frit-melt__d"></span>
            </div>
            <div class="ease-crucible-frit-melt__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-crucible-frit-melt__controls">
          <button type="button" class="ease-crucible-frit-melt__btn primary">Fire</button>
          <button type="button" class="ease-crucible-frit-melt__btn">Idle</button>
          <label class="ease-crucible-frit-melt__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-crucible-frit-melt__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
