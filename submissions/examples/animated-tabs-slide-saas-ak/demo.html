<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SaaS Showcase Slide-Right Tabs | EaseMotion CSS</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="ease-center ease-fade-in" style="min-height: 100vh; background: #0b0f19; font-family: 'Inter', sans-serif; padding: 2rem;">

  <div class="tabs-container">
    <header class="tabs-header ease-slide-up">
      <h1 class="ease-fade-in">SaaS Showcase Features</h1>
      <p class="ease-slide-up ease-delay-100">Pure CSS interactive tabs featuring a smooth slide-right interaction transition for modern SaaS platforms.</p>
    </header>

    <!-- Tabs Wrapper -->
    <div class="ease-tabs-slide-saas-ak ease-slide-up ease-delay-200">
      <div class="tabs-list" role="tablist">
        <button role="tab" aria-selected="true" class="tab-btn active">Growth</button>
        <button role="tab" aria-selected="false" class="tab-btn">Scale</button>
        <button role="tab" aria-selected="false" class="tab-btn">Enterprise</button>
      </div>
      <div class="tabs-panels">
        <div role="tabpanel" class="tab-panel active">
          <h3>Growth Suite Features</h3>
          <p>Accelerate your business metrics with high-performance slide transitions and zero JavaScript bloat.</p>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
