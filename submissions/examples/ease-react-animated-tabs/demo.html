<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EaseAnimatedTabs - Smooth Layout Shift React Component</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef, useEffect, useLayoutEffect, useCallback } = React;

    const tabs = [
      { id: 't1', label: 'Overview', content: 'EaseMotion provides GPU-accelerated micro-interactions.' },
      { id: 't2', label: 'Architecture', content: 'Built without heavy JavaScript physics engines. We pipe DOM measurements into CSS Custom Properties.' },
      { id: 't3', label: 'Accessibility', content: 'Fully ARIA compliant. Try using the left, right, home, and end keys to navigate this component.' }
    ];

    function EaseAnimatedTabs() {
      const [activeTab, setActiveTab] = useState(0);
      const [indicatorStyle, setIndicatorStyle] = useState({
        '--indicator-left': '0px',
        '--indicator-width': '0px'
      });

      const tabRefs = useRef([]);
      const containerRef = useRef(null);

      const updateIndicator = useCallback(() => {
        const currentTab = tabRefs.current[activeTab];
        const container = containerRef.current;

        if (currentTab && container) {
          const tabRect = currentTab.getBoundingClientRect();
          const containerRect = container.getBoundingClientRect();
          const left = tabRect.left - containerRect.left + container.scrollLeft;
          const width = tabRect.width;

          setIndicatorStyle({
            '--indicator-left': `${left}px`,
            '--indicator-width': `${width}px`
          });
        }
      }, [activeTab]);

      const useIsomorphicLayoutEffect = typeof window !== 'undefined' ? useLayoutEffect : useEffect;

      useIsomorphicLayoutEffect(() => {
        updateIndicator();
        window.addEventListener('resize', updateIndicator);
        return () => window.removeEventListener('resize', updateIndicator);
      }, [updateIndicator]);

      const handleKeyDown = (e) => {
        let newIndex = activeTab;

        if (e.key === 'ArrowRight') {
          newIndex = (activeTab + 1) % tabs.length;
        } else if (e.key === 'ArrowLeft') {
          newIndex = (activeTab - 1 + tabs.length) % tabs.length;
        } else if (e.key === 'Home') {
          newIndex = 0;
        } else if (e.key === 'End') {
          newIndex = tabs.length - 1;
        } else {
          return;
        }

        e.preventDefault();
        setActiveTab(newIndex);
        if (tabRefs.current[newIndex]) {
          tabRefs.current[newIndex].focus();
        }
      };

      return (
        <div className="ease-tabs-container">
          <div
            className="ease-tab-list"
            role="tablist"
            aria-label="EaseMotion Features"
            ref={containerRef}
            style={indicatorStyle}
            onKeyDown={handleKeyDown}
          >
            <div className="ease-tab-indicator" aria-hidden="true" />
            {tabs.map((tab, index) => (
              <button
                key={tab.id}
                id={`tab-${tab.id}`}
                ref={(el) => (tabRefs.current[index] = el)}
                className="ease-tab"
                role="tab"
                aria-selected={activeTab === index}
                aria-controls={`panel-${tab.id}`}
                tabIndex={activeTab === index ? 0 : -1}
                onClick={() => setActiveTab(index)}
              >
                {tab.label}
              </button>
            ))}
          </div>
          <div
            key={tabs[activeTab].id}
            id={`panel-${tabs[activeTab].id}`}
            className="ease-tab-panel"
            role="tabpanel"
            aria-labelledby={`tab-${tabs[activeTab].id}`}
          >
            {tabs[activeTab].content}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<EaseAnimatedTabs />);
  </script>
</body>
</html>
