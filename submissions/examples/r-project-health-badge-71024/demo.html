<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <meta
    name="description"
    content="CSS project health badge with a red amber green status indicator"
  >
  <title>CSS Project Health Badge</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">
    <section class="health-demo" aria-labelledby="title">

      <p class="eyebrow">EaseMotion CSS</p>

      <h1 id="title">Project Health Badge</h1>

      <p class="intro">
        A compact project health indicator using a
        red, amber, and green status system.
      </p>

      <div class="badge-grid">

        <article
          class="health-card healthy"
          aria-label="Project health: healthy"
        >
          <div class="health-icon" aria-hidden="true">
            <span></span>
          </div>

          <div class="health-content">
            <span class="status-label">PROJECT HEALTH</span>
            <h2>Healthy</h2>
            <p>All systems are operating normally.</p>
          </div>

          <span class="health-dot" aria-hidden="true"></span>
        </article>

        <article
          class="health-card warning"
          aria-label="Project health: attention needed"
        >
          <div class="health-icon" aria-hidden="true">
            <span></span>
          </div>

          <div class="health-content">
            <span class="status-label">PROJECT HEALTH</span>
            <h2>Attention</h2>
            <p>Some areas need monitoring.</p>
          </div>

          <span class="health-dot" aria-hidden="true"></span>
        </article>

        <article
          class="health-card critical"
          aria-label="Project health: critical"
        >
          <div class="health-icon" aria-hidden="true">
            <span></span>
          </div>

          <div class="health-content">
            <span class="status-label">PROJECT HEALTH</span>
            <h2>Critical</h2>
            <p>Immediate attention is recommended.</p>
          </div>

          <span class="health-dot" aria-hidden="true"></span>
        </article>

      </div>

    </section>
  </main>

</body>
</html>
