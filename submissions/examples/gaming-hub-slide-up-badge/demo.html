<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Competitive multiplayer match dashboard featuring the EaseMotion Slide-Up badge">
    <title>Gaming Hub Slide-Up Badge | EaseMotion CSS</title>
    <!-- Standard EaseMotion library include -->
    <link rel="stylesheet" href="../../../easemotion.css">
    <!-- Component Specific Styles -->
    <link rel="stylesheet" href="style.css">
    <!-- Premium Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-layout">
        <!-- Sidebar Navigation -->
        <nav class="sidebar ease-fade-in ease-slide-right" aria-label="Main Navigation">
            <div class="brand">
                <div class="logo-box"></div>
                <span class="brand-text">NEXUS</span>
            </div>
            <ul class="nav-links">
                <li>
                    <a href="#" class="nav-item active" aria-current="page">
                        <span class="icon overview-icon"></span> Overview
                    </a>
                </li>
                <li>
                    <a href="#" class="nav-item">
                        <span class="icon tournament-icon"></span> Tournaments
                    </a>
                </li>
                <li>
                    <a href="#" class="nav-item">
                        <span class="icon leader-icon"></span> Leaderboard
                    </a>
                </li>
                <li>
                    <a href="#" class="nav-item">
                        <span class="icon armory-icon"></span> Armory
                    </a>
                </li>
            </ul>
        </nav>

        <!-- Main Workspace -->
        <main class="main-content" id="main-view" tabindex="-1">
            <!-- Topbar -->
            <header class="topbar ease-fade-in ease-slide-down ease-delay-100">
                <div class="search-container">
                    <input type="search" placeholder="Search matches, players..." aria-label="Search content">
                </div>
                <div class="user-actions">
                    <button class="action-btn notifications-btn" aria-label="Notifications"></button>
                    <button class="profile-btn" aria-label="User Profile">
                        <div class="avatar-circle">
                            <span>UX</span>
                        </div>
                    </button>
                </div>
            </header>

            <!-- Dashboard Content -->
            <div class="dashboard-scroll-area">
                <div class="dashboard-container">
                    
                    <!-- Featured Match Section -->
                    <section class="live-match-card glass-panel ease-fade-in ease-zoom-in ease-delay-200" aria-label="Featured Live Match">
                        <div class="hero-bg-overlay"></div>
                        
                        <!-- Header with Badges (Focus of Showcase) -->
                        <div class="match-header">
                            <div class="badge-wrapper">
                                <div class="status-badge live-badge ease-fade-in ease-slide-up ease-delay-400">
                                    <span class="pulse-dot" aria-hidden="true"></span>
                                    <span>LIVE NOW</span>
                                </div>
                            </div>
                            <div class="badge-wrapper">
                                <div class="status-badge tier-badge ease-fade-in ease-slide-up ease-delay-500">
                                    S-TIER
                                </div>
                            </div>
                            <div class="badge-wrapper">
                                <div class="status-badge region-badge ease-fade-in ease-slide-up ease-delay-600">
                                    GLOBAL
                                </div>
                            </div>
                        </div>

                        <!-- Match Context -->
                        <div class="match-context">
                            <h1 class="tournament-name ease-fade-in ease-slide-up ease-delay-700">
                                NEXUS WORLD CHAMPIONSHIP '26
                            </h1>
                            <p class="match-stage ease-fade-in ease-slide-up ease-delay-800">
                                GRAND FINALS • BEST OF 5
                            </p>
                        </div>

                        <!-- Scoreboard -->
                        <div class="scoreboard ease-fade-in ease-slide-up ease-delay-900">
                            <!-- Team 1 -->
                            <div class="team team-home">
                                <div class="team-emblem sentinels"></div>
                                <div class="team-info">
                                    <h2 class="team-name">SENTINELS</h2>
                                    <span class="team-seed">Seed #1 NA</span>
                                </div>
                            </div>
                            
                            <!-- Score -->
                            <div class="score-display">
                                <span class="score-val" aria-label="Sentinels Score">12</span>
                                <span class="score-divider" aria-hidden="true">-</span>
                                <span class="score-val" aria-label="Fnatic Score">11</span>
                            </div>

                            <!-- Team 2 -->
                            <div class="team team-away">
                                <div class="team-info text-right">
                                    <h2 class="team-name">FNATIC</h2>
                                    <span class="team-seed">Seed #1 EMEA</span>
                                </div>
                                <div class="team-emblem fnatic"></div>
                            </div>
                        </div>
                    </section>

                    <!-- Match Statistics -->
                    <section class="stats-grid" aria-label="Live Match Statistics">
                        <article class="stat-box glass-panel ease-fade-in ease-slide-up ease-delay-800">
                            <div class="badge-wrapper">
                                <div class="stat-badge ease-fade-in ease-slide-up ease-delay-1000">Map 4</div>
                            </div>
                            <div class="stat-body">
                                <span class="stat-title">CURRENT MAP</span>
                                <strong class="stat-value text-gradient">LOTUS</strong>
                            </div>
                        </article>
                        
                        <article class="stat-box glass-panel ease-fade-in ease-slide-up ease-delay-900">
                            <div class="badge-wrapper">
                                <div class="stat-badge viewer-badge ease-fade-in ease-slide-up ease-delay-1100">Peak</div>
                            </div>
                            <div class="stat-body">
                                <span class="stat-title">VIEWERS</span>
                                <strong class="stat-value">1.42M</strong>
                            </div>
                        </article>

                        <article class="stat-box glass-panel highlight-box ease-fade-in ease-slide-up ease-delay-1000">
                            <div class="badge-wrapper">
                                <div class="stat-badge alert-badge ease-fade-in ease-slide-up ease-delay-1200">Match Point</div>
                            </div>
                            <div class="stat-body">
                                <span class="stat-title">ROUND</span>
                                <strong class="stat-value alert-text">24</strong>
                            </div>
                        </article>
                    </section>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
