<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-vending-machine-dispense demo</title>
</head>
<body>
<div class="vm-app">
  <span class="vm-title">SNACKS</span>
  <div class="vm-glass">
    <div class="vm-shelf vm-shelf-1">
      <span class="vm-can vm-can-a"></span>
      <span class="vm-can vm-can-b"></span>
      <span class="vm-can vm-can-c"></span>
    </div>
    <div class="vm-shelf vm-shelf-2">
      <span class="vm-bag vm-bag-a"></span>
      <span class="vm-bag vm-bag-b"></span>
      <span class="vm-bag vm-bag-c"></span>
    </div>
    <div class="vm-shelf vm-shelf-3">
      <span class="vm-chip vm-chip-a"></span>
      <span class="vm-chip vm-chip-b"></span>
      <span class="vm-chip vm-chip-c"></span>
    </div>
    <span class="vm-drop vm-drop-can"></span>
    <span class="vm-drop vm-drop-bag"></span>
  </div>
  <div class="vm-panel">
    <button class="vm-btn vm-btn-1">A1</button>
    <button class="vm-btn vm-btn-2">A2</button>
    <button class="vm-btn vm-btn-3">A3</button>
    <button class="vm-btn vm-btn-4">B1</button>
    <button class="vm-btn vm-btn-5">B2</button>
    <button class="vm-btn vm-btn-6">B3</button>
  </div>
  <div class="vm-tray"><span class="vm-flap"></span></div>
</div>
</body>
</html>
