<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Shimmer-Sweep Drawer - EaseMotion Showcase</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Pure CSS Toggle -->
    <input type="checkbox" id="drawer-toggle" class="drawer-toggle-input">

    <div class="dashboard-layout">
        <!-- Main Dashboard Content -->
        <main class="dashboard-content">
            <header class="dashboard-header">
                <h1>Investment Portfolio</h1>
                <p>Track and analyze your assets.</p>
            </header>

            <div class="asset-grid">
                <!-- Asset Card -->
                <div class="asset-card">
                    <div class="asset-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
                        </svg>
                    </div>
                    <div class="asset-details">
                        <h3>USD Coin</h3>
                        <p>Stablecoin</p>
                    </div>
                    <div class="asset-value">
                        <p>$12,450.00</p>
                        <label for="drawer-toggle" class="btn btn-primary">Trade / View</label>
                    </div>
                </div>
                
                <!-- Asset Card -->
                <div class="asset-card">
                    <div class="asset-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polygon points="12 2 2 22 12 17 22 22 12 2"></polygon>
                        </svg>
                    </div>
                    <div class="asset-details">
                        <h3>Ethereum</h3>
                        <p>Crypto</p>
                    </div>
                    <div class="asset-value">
                        <p>$4,120.50</p>
                        <label for="drawer-toggle" class="btn btn-primary">Trade / View</label>
                    </div>
                </div>
            </div>
        </main>

        <!-- Drawer Overlay -->
        <label for="drawer-toggle" class="drawer-overlay" aria-label="Close Drawer"></label>

        <!-- Shimmer-Sweep Drawer Panel -->
        <aside class="drawer-panel">
            <div class="drawer-shimmer-effect"></div>
            
            <div class="drawer-header">
                <h2>Asset Details</h2>
                <label for="drawer-toggle" class="close-btn" aria-label="Close">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </label>
            </div>
            
            <div class="drawer-body">
                <div class="drawer-hero">
                    <div class="hero-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
                        </svg>
                    </div>
                    <h1>USD Coin</h1>
                    <p class="asset-symbol">USDC</p>
                </div>
                
                <div class="stats-grid">
                    <div class="stat-box">
                        <span class="stat-label">Balance</span>
                        <span class="stat-value">12,450.00</span>
                    </div>
                    <div class="stat-box">
                        <span class="stat-label">Value (USD)</span>
                        <span class="stat-value">$12,450.00</span>
                    </div>
                    <div class="stat-box">
                        <span class="stat-label">APY</span>
                        <span class="stat-value text-green">5.25%</span>
                    </div>
                    <div class="stat-box">
                        <span class="stat-label">24h Change</span>
                        <span class="stat-value">0.00%</span>
                    </div>
                </div>
                
                <div class="drawer-actions">
                    <button class="btn btn-solid">Buy USDC</button>
                    <button class="btn btn-outline">Sell</button>
                    <button class="btn btn-outline">Exchange</button>
                </div>
            </div>
        </aside>
    </div>
</body>
</html>
