<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Slide-Up Modal - EaseMotion</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="ios-stack">

  <!-- Pure CSS State Checkbox -->
  <input type="checkbox" id="modal-toggle" class="modal-state" aria-hidden="true">

  <!-- Main Background Application -->
  <div class="app-layout">
    <main class="checkout-container">
      
      <header class="header">
        <h1>Checkout</h1>
        <p>Complete your purchase securely.</p>
      </header>

      <section class="checkout-section">
        <h2>Shipping Address</h2>
        <div class="info-card">
          <div class="info-details">
            <strong>Jane Doe</strong>
            <span>123 Design Avenue, NY 10001</span>
          </div>
        </div>
      </section>

      <section class="checkout-section">
        <h2>Payment Method</h2>
        <div class="info-card">
          <div class="info-details horizontal">
            <div class="icon">💳</div>
            <strong>Visa ending in 4242</strong>
          </div>
          <!-- Label acts as Modal Trigger Button -->
          <label for="modal-toggle" class="change-btn" aria-label="Change Payment Method">Change</label>
        </div>
      </section>

      <div class="spacer"></div>

      <div class="total-row">
        <span>Total</span>
        <strong>$125.00</strong>
      </div>
      <button class="pay-btn" onclick="alert('Payment Processing!')">Pay Now</button>

    </main>
  </div>

  <!-- Dimming Backdrop Overlay (Acts as Close Button) -->
  <label for="modal-toggle" class="modal-backdrop" aria-label="Close Modal"></label>

  <!-- The Slide-Up Bottom Sheet Modal -->
  <div class="modal" role="dialog" aria-modal="true">
    
    <!-- Drag Handle Pill -->
    <div class="drag-indicator"></div>
    
    <div class="modal-header">
      <h3>Payment Method</h3>
      <label for="modal-toggle" class="close-btn" aria-label="Close Modal">Done</label>
    </div>
    
    <div class="modal-body">
      
      <!-- Option 1 -->
      <label class="payment-option">
        <input type="radio" name="payment" checked>
        <div class="option-content">
          <div class="option-icon bg-blue">💳</div>
          <div class="option-details">
            <strong>Visa ending in 4242</strong>
            <span>Expires 12/26</span>
          </div>
          <div class="radio-circle"></div>
        </div>
      </label>

      <!-- Option 2 -->
      <label class="payment-option">
        <input type="radio" name="payment">
        <div class="option-content">
          <div class="option-icon bg-black"></div>
          <div class="option-details">
            <strong>Apple Pay</strong>
          </div>
          <div class="radio-circle"></div>
        </div>
      </label>

      <!-- Option 3 -->
      <label class="payment-option">
        <input type="radio" name="payment">
        <div class="option-content">
          <div class="option-icon bg-green">💸</div>
          <div class="option-details">
            <strong>Store Credit</strong>
            <span>$45.00 available</span>
          </div>
          <div class="radio-circle"></div>
        </div>
      </label>

      <button class="add-new-btn">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        Add New Payment Method
      </button>

    </div>
  </div>

</body>
</html>
