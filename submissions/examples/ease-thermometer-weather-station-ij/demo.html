<!-- EaseMotion component: thermometer-weather-station -->
<!DOCTYPE html>
<html lang="en" data-weather="station">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ease Thermometer Weather Station</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="weather-station">
  <header class="ws-head">
    <span class="ws-title">THERMO STATION</span>
    <span class="ws-temp">22&deg;C</span>
  </header>
  <div class="ws-body">
    <div class="thermo">
      <span class="thermo-scale"><span class="scale-mark">40</span><span class="scale-mark">30</span><span class="scale-mark">20</span><span class="scale-mark">10</span><span class="scale-mark">0</span></span>
      <span class="thermo-tube"><span class="mercury"></span></span>
      <span class="thermo-bulb"></span>
    </div>
    <div class="anemometer">
      <span class="anemo-mast"></span>
      <span class="anemo-cups">
        <span class="anemo-cup ac-1"></span>
        <span class="anemo-cup ac-2"></span>
      </span>
    </div>
  </div>
  <footer class="ws-foot">
    <span class="ws-hum">HUM 58%</span>
    <span class="ws-wind">WIND 12 km/h</span>
  </footer>
</main>
</body>
</html>
