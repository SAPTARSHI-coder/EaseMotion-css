<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-atm-withdrawal-screen demo</title>
</head>
<body>
<div class="at-app">
  <span class="at-title">ATM 24</span>
  <div class="at-screen">
    <span class="at-prompt">ENTER AMOUNT</span>
    <span class="at-amount">$200</span>
  </div>
  <div class="at-keypad">
    <span class="at-key">1</span>
    <span class="at-key">2</span>
    <span class="at-key">3</span>
    <span class="at-key">4</span>
    <span class="at-key">5</span>
    <span class="at-key">6</span>
    <span class="at-key">7</span>
    <span class="at-key">8</span>
    <span class="at-key">9</span>
    <span class="at-key at-zero">0</span>
    <span class="at-key">C</span>
    <span class="at-key at-ok">OK</span>
  </div>
  <div class="at-slot"></div>
  <span class="at-tray">CASH TRAY</span>
</div>
</body>
</html>
