<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Fade-In Dropdown</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="container">

    <h1>CSS Fade-In Dropdown</h1>

    <p class="subtitle">
        A minimalist dropdown built using only HTML and CSS.
    </p>

    <div class="dropdown">

        <button
            class="dropdown-toggle"
            aria-haspopup="true"
            aria-expanded="false">

            Resources

            <span class="arrow">▾</span>

        </button>

        <ul class="dropdown-menu">

            <li>
                <a href="#">Documentation</a>
            </li>

            <li>
                <a href="#">Components</a>
            </li>

            <li>
                <a href="#">Templates</a>
            </li>

            <li>
                <a href="#">Examples</a>
            </li>

            <li>
                <a href="#">GitHub</a>
            </li>

        </ul>

    </div>

</main>

</body>
</html>
