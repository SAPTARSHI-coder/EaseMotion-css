<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stacked Card Deck Animation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="ease-card-deck">
        <div class="ease-deck-card">
            <div class="card-icon">🚀</div>
            <div class="card-title">Launch</div>
            <div class="card-desc">Start your journey</div>
        </div>
        <div class="ease-deck-card">
            <div class="card-icon">🎨</div>
            <div class="card-title">Design</div>
            <div class="card-desc">Create beauty</div>
        </div>
        <div class="ease-deck-card">
            <div class="card-icon">💻</div>
            <div class="card-title">Code</div>
            <div class="card-desc">Build the future</div>
        </div>
        <div class="ease-deck-card">
            <div class="card-icon">📈</div>
            <div class="card-title">Grow</div>
            <div class="card-desc">Scale your app</div>
        </div>
        <div class="ease-deck-card">
            <div class="card-icon">🌟</div>
            <div class="card-title">Inspire</div>
            <div class="card-desc">Share your vision</div>
        </div>
    </div>
</body>
</html>
