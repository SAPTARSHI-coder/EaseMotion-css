<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Gradient Tab Bar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="wrapper">

    <h1>Dynamic Gradient Tab Bar</h1>

    <div class="tab-bar" role="tablist">

        <input type="radio" name="tabs" id="home" checked>
        <label for="home" role="tab">Home</label>

        <input type="radio" name="tabs" id="explore">
        <label for="explore" role="tab">Explore</label>

        <input type="radio" name="tabs" id="gallery">
        <label for="gallery" role="tab">Gallery</label>

        <input type="radio" name="tabs" id="profile">
        <label for="profile" role="tab">Profile</label>

        <span class="indicator"></span>

    </div>

</div>

</body>
</html>
