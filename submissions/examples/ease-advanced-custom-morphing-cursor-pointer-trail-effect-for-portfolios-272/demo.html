<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Morphing Cursor & Trail - Mobile First</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Custom Cursor Elements -->
  <div class="cursor-dot" id="cursor-dot"></div>
  <div class="cursor-outline" id="cursor-outline"></div>
  
  <!-- Trail Container (Canvas for performance) -->
  <canvas id="trail-canvas"></canvas>

  <main class="portfolio-container">
    <nav class="nav-bar">
      <div class="logo hover-target">EASE.</div>
      <div class="menu hover-target">MENU</div>
    </nav>
    
    <header class="hero">
      <p class="tagline">Mobile-First Interaction</p>
      <h1 class="title">Fluid <span class="hover-target highlight">Morphing</span> Cursor</h1>
      <p class="subtitle">Experience a dynamic pointer trail that responds beautifully to both mouse movements and touch gestures on mobile devices.</p>
      
      <div class="cta-wrapper">
        <a href="#" class="btn btn-primary hover-target">View Projects</a>
        <a href="#" class="btn btn-secondary hover-target">Let's Talk</a>
      </div>
    </header>
  </main>

  <script>
    // Elements
    const dot = document.getElementById('cursor-dot');
    const outline = document.getElementById('cursor-outline');
    const hoverTargets = document.querySelectorAll('.hover-target');
    const canvas = document.getElementById('trail-canvas');
    const ctx = canvas.getContext('2d');

    // State
    let mouse = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
    let outlinePos = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
    let isHovering = false;
    let isTouching = false;
    
    // Trail state
    const trail = [];
    const maxTrailLength = 15; // Compact edition uses shorter trail for mobile performance

    // Canvas resize
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Event Listeners for Mouse
    window.addEventListener('mousemove', (e) => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
      isTouching = false;
      addTrailPoint(mouse.x, mouse.y);
    });

    // Event Listeners for Touch (Mobile First)
    window.addEventListener('touchmove', (e) => {
      mouse.x = e.touches[0].clientX;
      mouse.y = e.touches[0].clientY;
      isTouching = true;
      addTrailPoint(mouse.x, mouse.y);
      
      // Update DOM elements instantly for touch
      dot.style.transform = `translate(${mouse.x}px, ${mouse.y}px)`;
      dot.style.opacity = '1';
      outline.style.opacity = '1';
    }, { passive: true });

    window.addEventListener('touchend', () => {
      // Fade out cursor on touch end
      dot.style.opacity = '0';
      outline.style.opacity = '0';
    });

    // Morphing on hover
    hoverTargets.forEach(target => {
      target.addEventListener('mouseenter', () => {
        isHovering = true;
        outline.classList.add('morph-active');
        dot.style.opacity = '0'; // Hide dot when morphing
      });
      target.addEventListener('mouseleave', () => {
        isHovering = false;
        outline.classList.remove('morph-active');
        if (!isTouching) dot.style.opacity = '1';
      });
    });

    function addTrailPoint(x, y) {
      trail.push({ x, y, alpha: 1 });
      if (trail.length > maxTrailLength) {
        trail.shift();
      }
    }

    // Animation Loop
    function animate() {
      // 1. Smoothly animate the outline (follower)
      // Use faster interpolation for "compact" feel
      outlinePos.x += (mouse.x - outlinePos.x) * 0.25;
      outlinePos.y += (mouse.y - outlinePos.y) * 0.25;
      
      outline.style.transform = `translate(${outlinePos.x}px, ${outlinePos.y}px)`;
      
      if (!isTouching) {
        dot.style.transform = `translate(${mouse.x}px, ${mouse.y}px)`;
      }

      // 2. Draw canvas trail
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      if (trail.length > 1) {
        ctx.beginPath();
        for (let i = 0; i < trail.length; i++) {
          const point = trail[i];
          
          if (i === 0) {
            ctx.moveTo(point.x, point.y);
          } else {
            ctx.lineTo(point.x, point.y);
          }
          
          // Fade out older points
          point.alpha -= 0.05;
        }
        
        // Compact elegant trail styling
        ctx.strokeStyle = `rgba(255, 60, 100, ${Math.max(0, trail[trail.length - 1].alpha * 0.6)})`;
        ctx.lineWidth = isHovering ? 0 : 3; // Hide trail when hovering over elements
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.stroke();
      }

      // Remove dead points
      while(trail.length > 0 && trail[0].alpha <= 0) {
        trail.shift();
      }

      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
