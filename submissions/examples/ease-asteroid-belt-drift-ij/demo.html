<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asteroid Belt Drift Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="space">
    <div class="field" id="field" aria-hidden="true"></div>
    <div class="star-haze" aria-hidden="true"></div>
    <p class="hint">Thousands of rocky specks drift slowly past on different parallax layers.</p>
  </main>
  <script>
    const field = document.getElementById("field");
    for (let i = 0; i < 40; i++) {
      const rock = document.createElement("span");
      rock.className = "rock";
      const layer = Math.random();
      rock.style.setProperty("--scale", (0.4 + layer * 1.4).toFixed(2));
      rock.style.setProperty("--dur", (9 + layer * 22).toFixed(1) + "s");
      rock.style.setProperty("--top", Math.floor(Math.random() * 100) + "%");
      rock.style.setProperty("--delay", (-Math.random() * 30).toFixed(1) + "s");
      field.appendChild(rock);
    }
  </script>
</body>
</html>
