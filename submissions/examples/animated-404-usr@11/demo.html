<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | EaseMotion Submission</title>
  
  <!-- EaseMotion CSS Official CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="error-page">
    
    <!-- Floating Background Elements -->
    <div class="floating-elements">
      <div class="floating-element element-1">🚀</div>
      <div class="floating-element element-2">⭐</div>
      <div class="floating-element element-3">🎈</div>
      <div class="floating-element element-4">💫</div>
      <div class="floating-element element-5">🌟</div>
      <div class="floating-element element-6">✨</div>
    </div>

    <!-- Main Error Content -->
    <div class="error-container ease-fade-in">
      
      <!-- Animated 404 Number -->
      <div class="error-number ease-scale-in">
        <span class="number">4</span>
        <span class="number number-middle">
          <div class="astronaut">👨‍🚀</div>
        </span>
        <span class="number">4</span>
      </div>

      <!-- Error Message -->
      <div class="error-message ease-slide-up ease-delay-200">
        <h1>Oops! Page Not Found</h1>
        <p class="error-description">
          Looks like you've ventured into unknown space. The page you're looking for has drifted away into the cosmic void.
        </p>
      </div>

      <!-- Search Box -->
      <div class="search-box ease-slide-up ease-delay-300">
        <input 
          type="text" 
          class="search-input" 
          placeholder="Search for what you need..."
          id="searchInput"
        >
        <button class="search-btn ease-hover-scale">
          <span>🔍</span>
        </button>
      </div>

      <!-- Action Buttons -->
      <div class="error-actions ease-slide-up ease-delay-400">
        <button class="action-btn action-btn-primary ease-hover-lift" onclick="goHome()">
          <span class="btn-icon">🏠</span>
          <span>Back to Home</span>
        </button>
        <button class="action-btn action-btn-secondary ease-hover-lift" onclick="goBack()">
          <span class="btn-icon">←</span>
          <span>Go Back</span>
        </button>
      </div>

      <!-- Helpful Links -->
      <div class="helpful-links ease-fade-in ease-delay-500">
        <p>Or try these popular pages:</p>
        <div class="links-grid">
          <a href="#" class="helpful-link ease-hover-scale">
            <span class="link-icon">📊</span>
            <span>Dashboard</span>
          </a>
          <a href="#" class="helpful-link ease-hover-scale">
            <span class="link-icon">📁</span>
            <span>Projects</span>
          </a>
          <a href="#" class="helpful-link ease-hover-scale">
            <span class="link-icon">⚙️</span>
            <span>Settings</span>
          </a>
          <a href="#" class="helpful-link ease-hover-scale">
            <span class="link-icon">📞</span>
            <span>Contact</span>
          </a>
        </div>
      </div>

      <!-- Error Code -->
      <div class="error-code ease-fade-in ease-delay-600">
        <p>Error Code: 404 | Page Not Found</p>
      </div>

    </div>

  </div>

  <!-- JavaScript for Interactivity -->
  <script>
    // Search functionality
    const searchInput = document.getElementById('searchInput');
    const searchBtn = document.querySelector('.search-btn');

    searchBtn.addEventListener('click', () => {
      const query = searchInput.value.trim();
      if (query) {
        alert(`Searching for: "${query}"\n\n(In a real app, this would search your site)`);
      }
    });

    searchInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        searchBtn.click();
      }
    });

    // Navigation functions
    function goHome() {
      alert('Navigating to Home page\n\n(In a real app, this would redirect to /)');
      // window.location.href = '/';
    }

    function goBack() {
      if (window.history.length > 1) {
        window.history.back();
      } else {
        goHome();
      }
    }

    // Parallax effect on mouse move
    const floatingElements = document.querySelectorAll('.floating-element');
    
    document.addEventListener('mousemove', (e) => {
      const mouseX = e.clientX / window.innerWidth;
      const mouseY = e.clientY / window.innerHeight;

      floatingElements.forEach((element, index) => {
        const speed = (index + 1) * 20;
        const x = (mouseX - 0.5) * speed;
        const y = (mouseY - 0.5) * speed;
        
        element.style.transform = `translate(${x}px, ${y}px)`;
      });
    });

    // Add random rotation to floating elements
    floatingElements.forEach(element => {
      const rotation = Math.random() * 360;
      element.style.setProperty('--rotation', `${rotation}deg`);
    });
  </script>

</body>
</html>
