<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ken Burns Pan Zoom Effect - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="em-container">
    <header class="em-header">
      <h1 class="em-title">Ken Burns Pan Zoom</h1>
      <p class="em-subtitle">Cinematic image panning and zooming transitions using pure CSS.</p>
    </header>
    <main class="em-grid">
      <section class="em-card em-card--wide">
        <div class="em-viewer">
          <div class="em-image em-image--kenburns"></div>
        </div>
        <h2 class="em-card__title mt-1">Cinematic Pan-Zoom View</h2>
        <p class="em-card__body">Watch the background image scale and shift slowly over time to create a motion effect.</p>
        <button class="em-btn em-btn--primary">Pause Effect</button>
      </section>
    </main>
  </div>
</body>
</html>
