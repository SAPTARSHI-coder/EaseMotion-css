<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Perspective Coverflow Carousel - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="carousel-container">
    <header class="carousel-header">
      <h2>3D Coverflow Perspective Showcase</h2>
      <p>CSS 3D perspective rotation matrix with responsive depth layers.</p>
    </header>

    <div class="perspective-stage">
      <div class="coverflow-card card-left">
        <div class="card-media">🎨</div>
        <h3>UI Design Systems</h3>
        <p>Tokenized components</p>
      </div>

      <div class="coverflow-card card-center">
        <div class="card-media">⚡</div>
        <h3>GPU Acceleration</h3>
        <p>60 FPS CSS rendering</p>
        <span class="active-badge">Active View</span>
      </div>

      <div class="coverflow-card card-right">
        <div class="card-media">🌐</div>
        <h3>Global Deployment</h3>
        <p>Edge asset distribution</p>
      </div>
    </div>
  </div>
</body>
</html>
