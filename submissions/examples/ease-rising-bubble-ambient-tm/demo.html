<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ease-bubble-rise — Ambient Demo</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { min-height: 100vh; background: var(--bubble-bg); display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; font-family: system-ui, sans-serif; color: #e0f0ff; position: relative; }
    h1 { font-size: 1.4rem; font-weight: 400; position: relative; z-index: 10; }
    .bubble-field { position: fixed; inset: 0; overflow: hidden; pointer-events: none; }
    .bubble { position: absolute; border-radius: 50%; background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.8), var(--bubble-color) 60%); bottom: -40px; box-shadow: inset -3px -3px 8px rgba(255,255,255,0.2), 0 0 12px var(--bubble-glow); animation: bubble-rise-1 var(--d, 6s) var(--bubble-rise-ease) infinite var(--delay, 0s); }
    .bubble:nth-child(1)  { left: 5%;  width: 12px; height: 12px; --d: 7s;  --delay: 0s; }
    .bubble:nth-child(2)  { left: 15%; width: 20px; height: 20px; --d: 9s;  --delay: 1s; }
    .bubble:nth-child(3)  { left: 25%; width: 8px;  height: 8px;  --d: 5s;  --delay: 0.5s; }
    .bubble:nth-child(4)  { left: 35%; width: 16px; height: 16px; --d: 8s;  --delay: 2s; }
    .bubble:nth-child(5)  { left: 45%; width: 24px; height: 24px; --d: 11s; --delay: 0.3s; }
    .bubble:nth-child(6)  { left: 55%; width: 10px; height: 10px; --d: 6s;  --delay: 1.5s; }
    .bubble:nth-child(7)  { left: 65%; width: 18px; height: 18px; --d: 9s;  --delay: 0.8s; }
    .bubble:nth-child(8)  { left: 75%; width: 14px; height: 14px; --d: 7s;  --delay: 3s; }
    .bubble:nth-child(9)  { left: 85%; width: 22px; height: 22px; --d: 10s; --delay: 0.2s; }
    .bubble:nth-child(10) { left: 92%; width: 8px;  height: 8px;  --d: 5s;  --delay: 2.5s; }
    .bubble:nth-child(11) { left: 10%; width: 28px; height: 28px; --d: 12s; --delay: 4s; }
    .bubble:nth-child(12) { left: 50%; width: 6px;  height: 6px;  --d: 4s;  --delay: 3.5s; }
    .demo-section { position: relative; z-index: 10; display: flex; flex-direction: column; align-items: center; gap: 1.5rem; }
    .demo-card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 1.5rem 2rem; display: flex; align-items: center; gap: 1rem; }
    .wobble-demo .bubble { animation: bubble-rise-2 8s ease-in-out infinite; }
  </style>
</head>
<body>
  <div class="bubble-field">
    <div class="bubble"></div><div class="bubble"></div><div class="bubble"></div><div class="bubble"></div>
    <div class="bubble"></div><div class="bubble"></div><div class="bubble"></div><div class="bubble"></div>
    <div class="bubble"></div><div class="bubble"></div><div class="bubble"></div><div class="bubble"></div>
  </div>
  <div class="demo-section">
    <h1>ease-bubble-rise Ambient Field</h1>
    <div class="demo-card">
      <div class="bubble" style="position:relative;bottom:auto;left:auto;width:20px;height:20px;animation:bubble-rise-1 6s ease-out infinite 0.5s !important;"></div>
      <div class="bubble" style="position:relative;bottom:auto;left:auto;width:16px;height:16px;animation:bubble-rise-1 8s ease-out infinite 1.2s !important;"></div>
      <div class="bubble" style="position:relative;bottom:auto;left:auto;width:24px;height:24px;animation:bubble-rise-1 7s ease-out infinite 0.1s !important;"></div>
      <span style="font-size:0.85rem;color:#88bbdd;">Rising bubbles ambient demo</span>
    </div>
  </div>
</body>
</html>
