<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Letter/Memo Template - EaseMotion</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <article class="lmt" aria-label="Business letter template">
      <header class="lmt-head">
        <span class="lmt-letterhead">Aurora Press</span
        ><span class="lmt-date">August 10, 2026</span>
      </header>
      <p class="lmt-from">From: Editorial Director</p>
      <p class="lmt-to">To: Production Team</p>
      <h1 class="lmt-subject">RE: Manuscript Review Schedule</h1>
      <p class="lmt-body">
        Dear Team, please complete the scene-by-scene review by Friday. Submit
        revisions through the planner.
      </p>
      <p class="lmt-sign">Sincerely,<br />The Editor</p>
    </article>
  </body>
</html>
