<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Flip Toggle — EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <p class="label">Pure CSS 3D Flipping Card Toggle Switches</p>
  <div class="demo-row">
    <!-- Default Purple -->
    <label class="ease-flip-toggle">
      <input type="checkbox" />
      <span class="ease-flip-toggle-inner">
        <span class="ease-flip-toggle-front">OFF</span>
        <span class="ease-flip-toggle-back">ON</span>
      </span>
    </label>

    <!-- Emerald Variant (Checked) -->
    <label class="ease-flip-toggle ease-flip-toggle--emerald">
      <input type="checkbox" checked />
      <span class="ease-flip-toggle-inner">
        <span class="ease-flip-toggle-front">OFF</span>
        <span class="ease-flip-toggle-back">ON</span>
      </span>
    </label>
  </div>

</body>
</html>
