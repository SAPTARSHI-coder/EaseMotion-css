<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ease Grain Elevator Bucket</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="grain-system">

    <h1>GRAIN ELEVATOR CONTROL</h1>
    <p class="status">BUCKET SYSTEM ACTIVE • LIFTING GRAIN</p>


    <div class="machine">

        <span class="label">CEREAL TRANSPORT UNIT</span>


        <div class="tower">

            <div class="belt">

                <div class="bucket bucket-one">
                    🌾
                </div>

                <div class="bucket bucket-two">
                    🌾
                </div>

                <div class="bucket bucket-three">
                    🌾
                </div>

            </div>

        </div>


        <div class="panel">

            <div>
                <small>SPEED</small>
                <b>80 RPM</b>
            </div>

            <div>
                <small>LOAD</small>
                <b>75%</b>
            </div>

            <div>
                <small>STATUS</small>
                <b>RUN</b>
            </div>

        </div>


    </div>

</div>


</body>
</html>
