<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />
  <meta
    name="description"
    content="Pure CSS subtle elevate particle effect."
  />
  <title>Subtle Elevate Particle Effect</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="particle-demo">
    <section class="particle-card" aria-labelledby="particle-title">
      <div class="particle-field" aria-hidden="true">
        <span class="particle particle-1"></span>
        <span class="particle particle-2"></span>
        <span class="particle particle-3"></span>
        <span class="particle particle-4"></span>
        <span class="particle particle-5"></span>
        <span class="particle particle-6"></span>
        <span class="particle particle-7"></span>
        <span class="particle particle-8"></span>
        <span class="particle particle-9"></span>
        <span class="particle particle-10"></span>
        <span class="particle particle-11"></span>
        <span class="particle particle-12"></span>
      </div>

      <div class="card-content">
        <span class="eyebrow">PURE CSS EFFECT</span>

        <h1 id="particle-title">
          Subtle Elevate
        </h1>

        <p>
          A lightweight particle animation with gentle
          floating motion and a soft elevation effect.
        </p>

        <button class="elevate-button" type="button">
          Explore Effect
        </button>
      </div>
    </section>
  </main>
</body>
</html>
