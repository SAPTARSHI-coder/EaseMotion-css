<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animated Checkout Stepper Demo</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="demo-container">
    <div class="stepper-wrapper">
      <div class="stepper-header">
        <h2 class="stepper-title">Order Progress</h2>
        <p class="stepper-subtitle">Track your checkout status in real-time</p>
      </div>

      <div class="checkout-stepper">
        <div class="stepper-progress-track">
          <div class="stepper-progress-bar"></div>
        </div>

        <ol class="stepper-list">
          <li class="step-item step-completed">
            <div class="step-node">
              <span class="step-icon">✓</span>
              <span class="step-pulse"></span>
            </div>
            <div class="step-content">
              <span class="step-label">Cart</span>
              <span class="step-desc">Items verified</span>
            </div>
          </li>

          <li class="step-item step-active">
            <div class="step-node">
              <span class="step-number">2</span>
              <span class="step-pulse"></span>
            </div>
            <div class="step-content">
              <span class="step-label">Shipping</span>
              <span class="step-desc">Address details</span>
            </div>
          </li>

          <li class="step-item step-upcoming">
            <div class="step-node">
              <span class="step-number">3</span>
              <span class="step-pulse"></span>
            </div>
            <div class="step-content">
              <span class="step-label">Payment</span>
              <span class="step-desc">Method selection</span>
            </div>
          </li>

          <li class="step-item step-upcoming">
            <div class="step-node">
              <span class="step-number">4</span>
              <span class="step-pulse"></span>
            </div>
            <div class="step-content">
              <span class="step-label">Complete</span>
              <span class="step-desc">Order placed</span>
            </div>
          </li>
        </ol>
      </div>
    </div>
  </main>
</body>
</html>
