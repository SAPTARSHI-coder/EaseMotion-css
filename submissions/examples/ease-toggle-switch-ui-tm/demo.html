<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Toggle Switch | EaseMotion CSS</title><link rel="stylesheet" href="style.css"></head>
<body><div class="tsw-root">
<div class="tsw-card">
<div class="tsw-row">
<div><p class="tsw-label">Dark Mode</p><p class="tsw-sub">Use system preference</p></div>
<label class="tsw-switch"><input type="checkbox" class="tsw-input" id="sw1" checked><div class="tsw-track"><div class="tsw-thumb"></div></div></label>
</div>
<div class="tsw-row">
<div><p class="tsw-label">Notifications</p><p class="tsw-sub">Push notifications</p></div>
<label class="tsw-switch"><input type="checkbox" class="tsw-input" id="sw2" checked><div class="tsw-track"><div class="tsw-thumb"></div></div></label>
</div>
<div class="tsw-row">
<div><p class="tsw-label">Auto-save</p><p class="tsw-sub">Save changes automatically</p></div>
<label class="tsw-switch"><input type="checkbox" class="tsw-input" id="sw3"><div class="tsw-track"><div class="tsw-thumb"></div></div></label>
</div>
<div class="tsw-row">
<div><p class="tsw-label">Analytics</p><p class="tsw-sub">Help us improve</p></div>
<label class="tsw-switch"><input type="checkbox" class="tsw-input" id="sw4"><div class="tsw-track"><div class="tsw-thumb"></div></div></label>
</div>
</div>
<p class="tsw-note">Pure CSS toggle switches using checkbox inputs. No JavaScript required.</p>
</div></body></html>
