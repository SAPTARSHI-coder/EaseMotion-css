<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Animated Skeleton Loader - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="skeleton-page">

    <header class="skeleton-header">
      <span class="section-pill">Loading State</span>
      <h1>Animated Skeleton Loader</h1>
      <p>
        A modern skeleton loading UI built with pure HTML and CSS.
        Useful for cards, dashboards, feeds, and content loading states.
      </p>
    </header>

    <section class="skeleton-grid">

      <!-- Skeleton Card 1 -->
      <article class="skeleton-card">
        <div class="skeleton skeleton-image"></div>

        <div class="skeleton-body">
          <div class="skeleton skeleton-title"></div>
          <div class="skeleton skeleton-text"></div>
          <div class="skeleton skeleton-text short"></div>

          <div class="skeleton-footer">
            <div class="skeleton skeleton-avatar"></div>

            <div class="skeleton-meta">
              <div class="skeleton skeleton-meta-line"></div>
              <div class="skeleton skeleton-meta-line small"></div>
            </div>
          </div>

          <div class="skeleton skeleton-button"></div>
        </div>
      </article>

      <!-- Skeleton Card 2 -->
      <article class="skeleton-card">
        <div class="skeleton skeleton-image"></div>

        <div class="skeleton-body">
          <div class="skeleton skeleton-title"></div>
          <div class="skeleton skeleton-text"></div>
          <div class="skeleton skeleton-text short"></div>

          <div class="skeleton-footer">
            <div class="skeleton skeleton-avatar"></div>

            <div class="skeleton-meta">
              <div class="skeleton skeleton-meta-line"></div>
              <div class="skeleton skeleton-meta-line small"></div>
            </div>
          </div>

          <div class="skeleton skeleton-button"></div>
        </div>
      </article>

      <!-- Skeleton Card 3 -->
      <article class="skeleton-card">
        <div class="skeleton skeleton-image"></div>

        <div class="skeleton-body">
          <div class="skeleton skeleton-title"></div>
          <div class="skeleton skeleton-text"></div>
          <div class="skeleton skeleton-text short"></div>

          <div class="skeleton-footer">
            <div class="skeleton skeleton-avatar"></div>

            <div class="skeleton-meta">
              <div class="skeleton skeleton-meta-line"></div>
              <div class="skeleton skeleton-meta-line small"></div>
            </div>
          </div>

          <div class="skeleton skeleton-button"></div>
        </div>
      </article>

    </section>

  </main>

</body>
</html>
