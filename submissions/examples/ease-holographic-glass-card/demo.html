<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS 3D Holographic Glassmorphism Card - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="ease-perspective-wrapper">
    <div class="ease-holo-card">
      <div class="ease-holo-sheen"></div>
      <div class="ease-card-content">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <div class="ease-card-chip"></div>
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.8)" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
          </svg>
        </div>
        <div class="ease-card-number">4000 1234 5678 9010</div>
        <div class="ease-card-footer">
          <div>
            <div style="font-size: 0.5rem; opacity: 0.7;">Cardholder</div>
            <div>J. Doe</div>
          </div>
          <div>
            <div style="font-size: 0.5rem; opacity: 0.7;">Expires</div>
            <div>12/28</div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <p style="position: absolute; bottom: 2rem; color: #64748b; font-size: 0.875rem; text-transform: uppercase; letter-spacing: 2px;">Hover to reveal iridescent sheen</p>
</body>
</html>
