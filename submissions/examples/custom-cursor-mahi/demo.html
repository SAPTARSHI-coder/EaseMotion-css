<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Custom Cursor Showcase - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-cursor="default">

  <div class="ease-cursor-container">
    <div class="ease-cursor-selector" id="cursorSelector">
      <button class="cursor-btn active" data-style="default">Default</button>
      <button class="cursor-btn" data-style="glow">Glow</button>
      <button class="cursor-btn" data-style="trail">Trail</button>
      <button class="cursor-btn" data-style="target">Target</button>
      <button class="cursor-btn" data-style="orbit">Orbit</button>
    </div>

    <div class="content-box">
      <h1>Interactive Custom Cursor</h1>
      <p>Move your mouse around and click the style buttons above to experience fluid custom cursor animations.</p>
      <div class="status-badge">
        <span class="status-dot"></span>
        <span id="statusText">Active: Default</span>
      </div>
    </div>
  </div>

  <!-- Custom Cursor Elements -->
  <div class="custom-cursor-dot" id="cursorDot"></div>
  <div class="custom-cursor-ring" id="cursorRing"></div>
  <div class="target-cursor" id="targetCursor"></div>
  
  <!-- Trail Particles -->
  <div class="trail-particle" style="opacity: 1;"></div>
  <div class="trail-particle" style="opacity: 0.8; width: 13px; height: 13px;"></div>
  <div class="trail-particle" style="opacity: 0.6; width: 10px; height: 10px;"></div>
  <div class="trail-particle" style="opacity: 0.4; width: 7px; height: 7px;"></div>
  <div class="trail-particle" style="opacity: 0.2; width: 5px; height: 5px;"></div>

  <!-- Orbit Satellites -->
  <div class="orbit-satellite"></div>
  <div class="orbit-satellite" style="animation-delay: -0.6s;"></div>

  <script>
    const dot = document.getElementById('cursorDot');
    const ring = document.getElementById('cursorRing');
    const target = document.getElementById('targetCursor');
    const trails = document.querySelectorAll('.trail-particle');
    const orbits = document.querySelectorAll('.orbit-satellite');
    const buttons = document.querySelectorAll('.cursor-btn');
    const statusText = document.getElementById('statusText');

    window.addEventListener('mousemove', (e) => {
      const mouseX = e.clientX;
      const mouseY = e.clientY;

      dot.style.transform = `translate(${mouseX}px, ${mouseY}px) translate(-50%, -50%)`;
      if (ring) {
        ring.style.transform = `translate(${mouseX}px, ${mouseY}px) translate(-50%, -50%)`;
      }

      if (target) {
        target.style.transform = `translate(${mouseX}px, ${mouseY}px) translate(-50%, -50%)`;
      }

      trails.forEach((trail, index) => {
        setTimeout(() => {
          trail.style.transform = `translate(${mouseX}px, ${mouseY}px) translate(-50%, -50%)`;
        }, index * 40);
      });

      orbits.forEach(orbit => {
        orbit.style.left = `${mouseX}px`;
        orbit.style.top = `${mouseY}px`;
      });
    });

    buttons.forEach(btn => {
      btn.addEventListener('click', (e) => {
        buttons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        
        const style = btn.getAttribute('data-style');
        document.body.setAttribute('data-cursor', style);
        statusText.textContent = `Active: ${btn.textContent}`;
      });
    });
  </script>
</body>
</html>
