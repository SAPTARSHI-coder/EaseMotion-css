<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ease Gyrocompass Precess</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

<main class="demo">

  <h1>Gyrocompass Precess</h1>
  <p>Navigation rotor stabilizing toward true north</p>

  <section class="ease-gyrocompass-precess">

    <div class="console">
      <span>MARINE NAV SYSTEM</span>
      <small>TRUE NORTH LOCKED</small>
    </div>


    <div class="gyro-housing">

      <div class="north-marker">
        N
      </div>


      <div class="outer-ring">

        <div class="gyro-rotor">

          <div class="axis"></div>

          <div class="rotor-core">
            +
          </div>

        </div>

      </div>


      <div class="indicator"></div>

    </div>


    <div class="readings">

      <div>
        <span>HEADING</span>
        <strong>000°</strong>
      </div>

      <div>
        <span>STABILITY</span>
        <strong>99%</strong>
      </div>

    </div>


  </section>

</main>

</body>
</html>
