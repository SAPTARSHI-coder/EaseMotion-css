<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Morphing Shape Hero</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 
      [TECHNIQUE] The Hero Section
      A responsive, modern hero layout utilizing CSS Grid.
    -->
    <header class="hero-section">
        
        <div class="hero-container">
            
            <div class="hero-content">
                <span class="hero-badge">New Release v2.0</span>
                <h1 class="hero-title">Experience fluid<br>web design.</h1>
                <p class="hero-subtitle">Engage your audience with pure CSS organic animations. No JavaScript required, fully responsive, and highly performant.</p>
                
                <div class="hero-cta">
                    <button class="btn btn-primary">Get Started</button>
                    <button class="btn btn-secondary">View Documentation</button>
                </div>
            </div>
            
            <!-- 
              [TECHNIQUE] The Morphing Blob Visual
              The right side of the hero contains a large, organic morphing shape.
              It uses the 8-value border-radius trick to smoothly animate.
            -->
            <div class="hero-visual" aria-hidden="true">
                <div class="morphing-blob"></div>
                <!-- Optional floating element to show depth -->
                <div class="floating-orb"></div>
            </div>
            
        </div>
        
    </header>

</body>
</html>
