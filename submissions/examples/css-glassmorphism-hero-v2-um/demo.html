<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Glassmorphism Hero v2 - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Background Ambient Glow Spheres (Refracts through glass panels) -->
  <div class="ambient-bg" aria-hidden="true">
    <div class="glow-sphere sphere-1"></div>
    <div class="glow-sphere sphere-2"></div>
  </div>

  <!-- Hero Section (Banner Role) -->
  <header class="hero-banner" role="banner">
    
    <!-- Left Column Content -->
    <div class="hero-content">
      <span class="hero-tag">Design Trend v2</span>
      <h1 class="hero-title">Refractive glass layouts built <span>Natively</span>.</h1>
      <p class="hero-desc">Optimize page paint loops and reduce CPU overhead by building frosted glass interfaces using native backdrop-filters and shadow depth layers.</p>
      
      <div class="hero-cta">
        <button type="button" class="cta-btn cta-primary">Explore Components</button>
        <button type="button" class="cta-btn cta-secondary">View Demos</button>
      </div>
    </div>

    <!-- Right Column Stacked Glass Panels -->
    <div class="hero-visual-stage" aria-hidden="true">
      
      <!-- Panel 1: Top Analytics Card -->
      <div class="glass-panel p-analytics" tabindex="0" role="button" aria-label="System Analytics Panel">
        <div class="panel-title">System Load</div>
        <div class="panel-line" style="width: 80%; background-color: var(--secondary-glow);"></div>
        <div class="panel-line" style="width: 50%;"></div>
        <div class="panel-line" style="width: 30%; margin-bottom: 0;"></div>
      </div>

      <!-- Panel 2: Center Activity Feed -->
      <div class="glass-panel p-feed" tabindex="0" role="button" aria-label="User Feed Panel">
        <div class="panel-title">Activity</div>
        <div class="avatar-row">
          <div class="panel-avatar"></div>
          <div class="panel-line" style="width: 60%; margin-bottom: 0; height: 5px;"></div>
        </div>
        <div class="avatar-row" style="margin-top: 10px;">
          <div class="panel-avatar" style="background-color: var(--primary-glow);"></div>
          <div class="panel-line" style="width: 45%; margin-bottom: 0; height: 5px;"></div>
        </div>
      </div>

      <!-- Panel 3: Bottom Performance Chart -->
      <div class="glass-panel p-chart" tabindex="0" role="button" aria-label="Core Performance Chart">
        <div class="panel-title">Data Ingestion</div>
        <div class="chart-bars">
          <div class="c-bar cb-1"></div>
          <div class="c-bar cb-2"></div>
          <div class="c-bar cb-3"></div>
          <div class="c-bar cb-4"></div>
        </div>
      </div>

    </div>

  </header>

</body>
</html>
