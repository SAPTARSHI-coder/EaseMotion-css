<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wobble-Focus Animated Tabs Showcase | EaseMotion CSS</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="ease-center ease-fade-in" style="min-height: 100vh; background: #090d16; font-family: 'Inter', sans-serif; padding: 2rem;">

  <div class="tabs-container">
    <header class="tabs-header ease-slide-up">
      <h1 class="ease-fade-in">Minimalist Tech Tabs</h1>
      <p class="ease-slide-up ease-delay-100">Pure CSS interactive tabs featuring a smooth wobble-focus transition.</p>
    </header>

    <!-- Tabs Wrapper -->
    <div class="ease-tabs-wobble-ak ease-slide-up ease-delay-200">
      <div class="tabs-list" role="tablist">
        <button role="tab" aria-selected="true" class="tab-btn active">Overview</button>
        <button role="tab" aria-selected="false" class="tab-btn">Specifications</button>
        <button role="tab" aria-selected="false" class="tab-btn">Performance</button>
      </div>
      <div class="tabs-panels">
        <div role="tabpanel" class="tab-panel active">
          <h3>Architecture Overview</h3>
          <p>Built with zero JavaScript overhead, utilizing CSS custom properties and state management for high performance.</p>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
