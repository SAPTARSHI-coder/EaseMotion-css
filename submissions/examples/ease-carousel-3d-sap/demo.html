<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ease-carousel-3d-sap demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f4f4f5;
    }
  </style>
</head>
<body>

  <div class="carousel-3d-sap">
    <div class="carousel-track" id="track">
      <div class="carousel-slide">Slide 1</div>
      <div class="carousel-slide">Slide 2</div>
      <div class="carousel-slide">Slide 3</div>
      <div class="carousel-slide">Slide 4</div>
    </div>
    <div class="carousel-nav">
      <button class="carousel-btn" id="prevBtn" aria-label="Previous slide">&#8592;</button>
      <button class="carousel-btn" id="nextBtn" aria-label="Next slide">&#8594;</button>
    </div>
  </div>

  <script>
    const track = document.getElementById('track');
    let index = 0;
    const total = 4;

    function update() {
      track.style.transform = `rotateY(${-index * 90}deg)`;
    }

    document.getElementById('nextBtn').addEventListener('click', () => {
      index = (index + 1) % total;
      update();
    });

    document.getElementById('prevBtn').addEventListener('click', () => {
      index = (index - 1 + total) % total;
      update();
    });
  </script>

</body>
</html>
