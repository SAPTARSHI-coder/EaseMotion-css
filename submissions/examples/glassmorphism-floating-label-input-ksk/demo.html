<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Floating Label Input - Glassmorphism Styling - EaseMotion CSS</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="glass-input-container">
      <header class="glass-header">
        <h1 class="glass-title">Glassmorphism Input</h1>
        <p class="glass-subtitle">
          Issue #81508 / #80961 — Pure CSS Floating Label
        </p>
      </header>

      <div class="glass-field">
        <input
          type="text"
          id="username"
          class="glass-input"
          placeholder=" "
          autocomplete="off"
        />
        <label for="username" class="glass-label">Username / Email</label>
      </div>

      <div class="glass-field">
        <input
          type="password"
          id="password"
          class="glass-input"
          placeholder=" "
          autocomplete="off"
        />
        <label for="password" class="glass-label">Password</label>
      </div>
    </main>
  </body>
</html>
