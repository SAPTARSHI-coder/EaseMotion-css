<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-stock-ticker-board demo</title>
</head>
<body>
<div class="st-app">
  <span class="st-title">MARKET BOARD</span>
  <div class="st-tape">
    <div class="st-track">
      <span class="st-item">AAPL <span class="st-up">+1.24</span></span>
      <span class="st-item">TSLA <span class="st-down">-0.85</span></span>
      <span class="st-item">GOOG <span class="st-up">+0.42</span></span>
      <span class="st-item">MSFT <span class="st-up">+2.10</span></span>
      <span class="st-item">AMZN <span class="st-down">-1.03</span></span>
    </div>
  </div>
  <div class="st-row">
    <span class="st-name">NASDAQ</span>
    <span class="st-val">17452</span>
  </div>
  <span class="st-status">LIVE FEED</span>
</div>
</body>
</html>
