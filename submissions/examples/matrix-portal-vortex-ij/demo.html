<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrix Portal Vortex - EaseMotion CSS</title>
    <!-- Include EaseMotion Core Stylesheet -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #04090f; color: #ffffff;">

    <div class="ease-card ease-card-glass portal-container">
        <div class="portal-header">
            <h2>Portal Vortex</h2>
            <span class="ease-badge ease-badge-success">Stable</span>
        </div>
        
        <div class="portal-screen ease-center">
            <div class="portal-ring ring-outer"></div>
            <div class="portal-ring ring-inner"></div>
            <div class="portal-core ease-center"></div>
        </div>

        <div class="portal-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Gateway: Open</span>
            <button class="ease-btn ease-btn-primary ease-btn-sm ease-hover-grow">Recalibrate</button>
        </div>
    </div>

</body>
</html>
