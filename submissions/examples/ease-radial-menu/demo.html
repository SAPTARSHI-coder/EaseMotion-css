<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ease Radial Menu Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="ease-radial-wrapper">
    <div class="ease-radial-center">Menu</div>
    <div class="ease-radial-item" style="--angle: 0deg;">1</div>
    <div class="ease-radial-item" style="--angle: 60deg;">2</div>
    <div class="ease-radial-item" style="--angle: 120deg;">3</div>
    <div class="ease-radial-item" style="--angle: 180deg;">4</div>
    <div class="ease-radial-item" style="--angle: 240deg;">5</div>
    <div class="ease-radial-item" style="--angle: 300deg;">6</div>
  </div>
</body>
</html>
