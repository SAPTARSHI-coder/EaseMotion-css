<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ease Icon Chip</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="chip-group">

    <div class="icon-chip">
        <span class="chip-icon">★</span>
        <span>Featured</span>
    </div>

    <div class="icon-chip">
        <span class="chip-icon">✓</span>
        <span>Verified</span>
    </div>

    <div class="icon-chip">
        <span class="chip-icon">⚡</span>
        <span>Popular</span>
    </div>

</div>

</body>
</html>
