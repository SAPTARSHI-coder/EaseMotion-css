<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Neumorphic Pulsating Wave - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <main class="demo-wrapper">
    <header class="demo-header">
      <span class="demo-badge">Neumorphism Effect</span>
      <h1>Pulsating Wave</h1>
      <p>Interactive Neumorphic UI featuring pure CSS concentric radar wave propagation, glowing core depth, and pulse mode triggers.</p>
    </header>

    <section class="neumorphic-card" aria-label="Pulsating Wave Showcase">
      <!-- Pure CSS State Radio Controls -->
      <input type="radio" name="pulse-mode" id="pulse-off" class="pulse-radio">
      <input type="radio" name="pulse-mode" id="pulse-smooth" class="pulse-radio" checked>
      <input type="radio" name="pulse-mode" id="pulse-intense" class="pulse-radio">

      <!-- Pulsating Radar Visualizer Stage -->
      <div class="pulse-stage">
        <!-- Concentric Pulsating Waves -->
        <div class="wave-emitter">
          <div class="wave-ring wave-1"></div>
          <div class="wave-ring wave-2"></div>
          <div class="wave-ring wave-3"></div>

          <!-- Central Neumorphic Core Button -->
          <div class="pulse-core">
            <div class="core-glow-dot"></div>
            <svg class="pulse-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 2v20M2 12h20M12 6a6 6 0 1 0 0 12 6 6 0 0 0 0-12z"/>
            </svg>
          </div>
        </div>

        <div class="pulse-status">
          <span class="status-label label-off">PULSE PAUSED</span>
          <span class="status-label label-smooth">SMOOTH WAVE PULSE</span>
          <span class="status-label label-intense">INTENSE RADAR PULSE</span>
        </div>
      </div>

      <!-- Pulse Mode Controls -->
      <div class="controls-panel" aria-label="Select Pulse Mode">
        <span class="controls-title">Pulse Wave Mode</span>
        <div class="btn-group">
          <label for="pulse-off" class="neumorphic-btn btn-off" tabindex="0" title="Pause Pulse">Off</label>
          <label for="pulse-smooth" class="neumorphic-btn btn-smooth" tabindex="0" title="Smooth Wave Pulse">Smooth</label>
          <label for="pulse-intense" class="neumorphic-btn btn-intense" tabindex="0" title="Intense Radar Wave">Intense</label>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
