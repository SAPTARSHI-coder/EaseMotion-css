<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="CSS Float-Drift Dropdown for fintech dashboard layouts"
  >

  <title>Float-Drift Dropdown | EaseMotion CSS</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="dashboard">
    <header class="dashboard__header">
      <div>
        <p class="eyebrow">Fintech Dashboard</p>
        <h1>Portfolio Overview</h1>
      </div>

      <div class="dropdown">
        <button
          class="dropdown__trigger"
          type="button"
          aria-label="Open portfolio actions"
        >
          <span class="dropdown__icon" aria-hidden="true">⋮</span>
        </button>

        <div class="dropdown__menu" role="menu">
          <a href="#" role="menuitem">
            <span aria-hidden="true">↗</span>
            View details
          </a>

          <a href="#" role="menuitem">
            <span aria-hidden="true">↓</span>
            Download report
          </a>

          <a href="#" role="menuitem">
            <span aria-hidden="true">⚙</span>
            Settings
          </a>
        </div>
      </div>
    </header>

    <section class="stats" aria-label="Portfolio statistics">
      <article class="stat-card">
        <span class="stat-card__label">Total Balance</span>
        <strong class="stat-card__value">$84,620.40</strong>
        <span class="stat-card__change">+8.42%</span>
      </article>

      <article class="stat-card">
        <span class="stat-card__label">Investments</span>
        <strong class="stat-card__value">$52,840.15</strong>
        <span class="stat-card__change">+12.18%</span>
      </article>

      <article class="stat-card">
        <span class="stat-card__label">Available Cash</span>
        <strong class="stat-card__value">$31,780.25</strong>
        <span class="stat-card__change">+3.64%</span>
      </article>
    </section>

    <section class="portfolio-card">
      <div class="portfolio-card__header">
        <div>
          <p class="eyebrow">Performance</p>
          <h2>Portfolio Growth</h2>
        </div>

        <span class="portfolio-card__period">2026</span>
      </div>

      <div class="chart" aria-label="Portfolio growth chart">
        <div class="chart__line"></div>

        <div class="chart__labels">
          <span>Jan</span>
          <span>Mar</span>
          <span>May</span>
          <span>Jul</span>
          <span>Sep</span>
          <span>Nov</span>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
