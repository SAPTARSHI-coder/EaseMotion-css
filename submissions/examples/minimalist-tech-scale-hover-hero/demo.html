<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Scale-Hover Hero Section - Minimalist Tech</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="layout-container">
        
        <!-- The Hero Section -->
        <section class="hero-section">
            
            <div class="hero-content">
                <div class="badge scale-hover-item">Infrastructure as Data</div>
                
                <h1 class="hero-title">
                    <span class="scale-hover-item inline-block">Deploy</span>
                    <span class="scale-hover-item inline-block">Faster.</span><br>
                    <span class="scale-hover-item inline-block highlight">Scale</span>
                    <span class="scale-hover-item inline-block highlight">Infinitely.</span>
                </h1>
                
                <p class="hero-subtitle scale-hover-item">
                    A declarative approach to managing cloud resources. Hover over any element in this section to experience the tactile, responsive interface.
                </p>
                
                <div class="hero-actions">
                    <button class="btn btn-primary scale-hover-item">Start Free Trial</button>
                    <button class="btn btn-secondary scale-hover-item">Book Demo</button>
                </div>
            </div>

            <!-- Abstract minimal tech visual representation -->
            <div class="hero-visual">
                <div class="node-cluster">
                    
                    <!-- Center Node -->
                    <div class="node core-node scale-hover-item">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="2" y="2" width="20" height="8" rx="2" ry="2"></rect>
                            <rect x="2" y="14" width="20" height="8" rx="2" ry="2"></rect>
                            <line x1="6" y1="6" x2="6.01" y2="6"></line>
                            <line x1="6" y1="18" x2="6.01" y2="18"></line>
                        </svg>
                    </div>
                    
                    <!-- Satellite Nodes -->
                    <div class="node sat-node sat-1 scale-hover-item">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path></svg>
                    </div>
                    
                    <div class="node sat-node sat-2 scale-hover-item">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="5" rx="9" ry="3"></ellipse><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path></svg>
                    </div>
                    
                    <div class="node sat-node sat-3 scale-hover-item">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
                    </div>
                    
                    <!-- Connecting Lines (Decorative) -->
                    <svg class="connections" width="100%" height="100%">
                        <line x1="50%" y1="50%" x2="50%" y2="15%" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4" />
                        <line x1="50%" y1="50%" x2="20%" y2="75%" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4" />
                        <line x1="50%" y1="50%" x2="80%" y2="75%" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4" />
                    </svg>

                </div>
            </div>

        </section>

    </div>

</body>
</html>
