<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="CSS animated calorie burn badge with flame animation"
  >
  <title>CSS Calorie Burn Badge</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section class="demo" aria-labelledby="title">
      <p class="eyebrow">EaseMotion CSS</p>

      <h1 id="title">Calorie Burn Badge</h1>

      <p class="intro">
        A lightweight CSS-only fitness badge with an animated flame
        indicator and calorie progress.
      </p>

      <article class="calorie-card">
        <div class="badge-icon" aria-hidden="true">
          <span class="flame">
            <span class="flame-inner"></span>
          </span>
        </div>

        <div class="badge-content">
          <span class="label">Active calories</span>

          <div class="calorie-value">
            <strong>486</strong>
            <span>kcal</span>
          </div>

          <div class="goal">
            <div class="goal-header">
              <span>Daily goal</span>
              <strong>72%</strong>
            </div>

            <div
              class="progress"
              role="progressbar"
              aria-label="Calorie goal progress"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuenow="72"
            >
              <span></span>
            </div>
          </div>
        </div>

        <div class="trend" aria-label="Calories are increasing">
          <span aria-hidden="true">↗</span>
          <small>+12%</small>
        </div>
      </article>

      <div class="stats" aria-label="Activity statistics">
        <div class="stat">
          <span class="stat-icon" aria-hidden="true">◷</span>
          <div>
            <strong>58 min</strong>
            <span>Active time</span>
          </div>
        </div>

        <div class="stat">
          <span class="stat-icon" aria-hidden="true">⚡</span>
          <div>
            <strong>8,420</strong>
            <span>Steps</span>
          </div>
        </div>

        <div class="stat">
          <span class="stat-icon" aria-hidden="true">●</span>
          <div>
            <strong>6.2 km</strong>
            <span>Distance</span>
          </div>
        </div>
      </div>

      <p class="hint">
        <span aria-hidden="true">✦</span>
        Keep moving to reach your daily goal.
      </p>
    </section>
  </main>
</body>
</html>
