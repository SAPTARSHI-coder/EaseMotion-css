<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ease Radial Circular Floating Action Menu</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="ease-fab-body">
  <div class="ease-fab-container" id="fabContainer">
    <button class="ease-fab-trigger" id="fabTrigger">＋</button>
    <div class="ease-fab-item item-1">⭐</div>
    <div class="ease-fab-item item-2">❤️</div>
    <div class="ease-fab-item item-3">🚀</div>
  </div>

  <script>
    const container = document.getElementById('fabContainer');
    const trigger = document.getElementById('fabTrigger');
    trigger.addEventListener('click', () => {
      container.classList.toggle('active');
    });
  </script>
</body>
</html>
