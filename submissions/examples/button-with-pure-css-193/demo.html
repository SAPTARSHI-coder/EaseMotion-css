<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Dark mode ripple wave button created with pure CSS."
    >

    <title>Ripple Wave Button - Dark Mode</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="page">
        <section class="demo-card" aria-labelledby="title">

            <p class="eyebrow">EaseMotion UI</p>

            <h1 id="title">Ripple Wave Button</h1>

            <p class="description">
                A modern dark-mode ripple click effect built entirely
                with HTML and CSS.
            </p>

            <div class="button-area">
                <button class="ripple-button" type="button">
                    <span>Explore More</span>
                </button>
            </div>

            <p class="hint">
                Hover over the button to preview the ripple effect.
            </p>

        </section>
    </main>

</body>
</html>
