<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CSS Shimmer-Sweep Drawer for E-Commerce Checkout Layouts">
  <title>Shimmer-Sweep Drawer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="checkout-page">
    <header class="checkout-header">
      <span class="brand">EaseShop</span>
      <span class="checkout-label">Secure Checkout</span>
    </header>

    <section class="checkout-content">
      <div class="checkout-summary">
        <p class="eyebrow">ORDER SUMMARY</p>
        <h1>Your Cart</h1>

        <article class="product-card">
          <div class="product-image" aria-hidden="true">⌚</div>
          <div class="product-info">
            <h2>Classic Smart Watch</h2>
            <p>Premium edition · Quantity 1</p>
            <strong>$129.00</strong>
          </div>
        </article>

        <div class="price-row">
          <span>Subtotal</span>
          <span>$129.00</span>
        </div>

        <div class="price-row">
          <span>Shipping</span>
          <span>Free</span>
        </div>

        <div class="price-row total">
          <span>Total</span>
          <span>$129.00</span>
        </div>
      </div>

      <aside class="checkout-drawer">
        <div class="drawer-shimmer" aria-hidden="true"></div>

        <div class="drawer-content">
          <span class="drawer-icon" aria-hidden="true">✓</span>

          <p class="eyebrow">PAYMENT DETAILS</p>
          <h2>Complete your purchase</h2>
          <p class="drawer-description">
            Your payment information is securely processed.
          </p>

          <form class="payment-form">
            <label for="card-number">Card number</label>
            <input
              id="card-number"
              type="text"
              inputmode="numeric"
              placeholder="1234 5678 9012 3456"
              autocomplete="cc-number"
            >

            <div class="form-row">
              <div>
                <label for="expiry">Expiry</label>
                <input
                  id="expiry"
                  type="text"
                  placeholder="MM/YY"
                  autocomplete="cc-exp"
                >
              </div>

              <div>
                <label for="cvv">CVV</label>
                <input
                  id="cvv"
                  type="password"
                  placeholder="•••"
                  autocomplete="cc-csc"
                >
              </div>
            </div>

            <button type="button" class="pay-button">
              Pay $129.00
            </button>
          </form>
        </div>
      </aside>
    </section>
  </main>
</body>
</html>
