<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download Arrow Bounce</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <section class="demo" aria-labelledby="demo-title">
            <h1 id="demo-title">Download Arrow Bounce</h1>
            <p>
                A lightweight CSS-only animation for download indicators.
            </p>

            <div class="ease-download-animation" role="img" aria-label="Animated download arrow">
                <span class="ease-download-arrow" aria-hidden="true">
                    <span class="ease-arrow-shaft"></span>
                    <span class="ease-arrow-head"></span>
                </span>
                <span class="ease-download-tray" aria-hidden="true"></span>
            </div>
        </section>
    </main>
</body>
</html>
