<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cyberpunk Liquid Fill Button</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<section class="hero">

<div class="card">

<span class="badge">
Cyberpunk Theme
</span>

<h1>
Fluid Liquid Fill Button
</h1>

<p>
A futuristic cyberpunk button with animated liquid waves, glowing neon borders,
overflow water effects and smooth hover interactions built entirely with HTML
and CSS.
</p>

<button class="liquid-btn">

<span class="label">
Launch System
</span>

<div class="liquid">

<span class="wave wave1"></span>

<span class="wave wave2"></span>

<span class="wave wave3"></span>

</div>

</button>

<div class="info">

<div class="chip">
Neon Glow
</div>

<div class="chip">
Overflow Waves
</div>

<div class="chip">
CSS Only
</div>

</div>

</div>

</section>

</body>
</html>
