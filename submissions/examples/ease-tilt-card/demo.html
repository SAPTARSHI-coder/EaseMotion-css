<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pure CSS Tilt Card - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="ease-tilt-wrapper">
    <!-- Invisible Tracking Grid -->
    <div class="ease-tilt-trackers" aria-hidden="true">
      <div class="ease-tracker"></div><div class="ease-tracker"></div><div class="ease-tracker"></div>
      <div class="ease-tracker"></div><div class="ease-tracker"></div><div class="ease-tracker"></div>
      <div class="ease-tracker"></div><div class="ease-tracker"></div><div class="ease-tracker"></div>
    </div>
    <!-- Visual Card -->
    <div class="ease-tilt-card">
      <div class="ease-tilt-content">
        <h2>Pure CSS Tilt</h2>
        <p>3D Parallax effect driven entirely by CSS relational selectors and a 9-zone tracking grid. Zero JavaScript.</p>
      </div>
    </div>
  </div>
  <p style="position: absolute; bottom: 2rem; color: #475569; font-family: system-ui; font-size: 0.875rem; z-index: 20;">Hover to interact.</p>
</body>
</html>
