<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fence Post Driver — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Fence Post Driver demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Fence Post Driver</h1>
      <p class="lede">Fence post driver slamming a post into ground</p>
    </header>

    <section class="ease-fence-post-driver" data-demo="fence-post-driver" aria-live="polite">
      <div class="ease-fence-post-driver__housing">
        <div class="ease-fence-post-driver__bezel">
          <div class="ease-fence-post-driver__face">
            <div class="ease-fence-post-driver__readout">
              <span class="ease-fence-post-driver__label">Fence Post Driver</span>
              <span class="ease-fence-post-driver__value">LIVE</span>
            </div>
            <div class="ease-fence-post-driver__motion" aria-hidden="true">
              <span class="ease-fence-post-driver__a"></span>
              <span class="ease-fence-post-driver__b"></span>
              <span class="ease-fence-post-driver__c"></span>
              <span class="ease-fence-post-driver__d"></span>
            </div>
            <div class="ease-fence-post-driver__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-fence-post-driver__controls">
          <button type="button" class="ease-fence-post-driver__btn primary">Engage</button>
          <button type="button" class="ease-fence-post-driver__btn">Reset</button>
          <label class="ease-fence-post-driver__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-fence-post-driver__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
