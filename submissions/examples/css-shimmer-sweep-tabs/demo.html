<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Shimmer-Sweep Tabs</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<main class="dashboard">


<header class="hero">

    <h1>
        CSS Shimmer-Sweep Tabs
    </h1>

    <p>
        A pure CSS animated tab component with smooth shimmer
        sweep effects for responsive dashboard layouts.
    </p>

</header>




<section class="tabs" aria-label="Dashboard Tabs">


<button class="tab active">

    <span class="icon">
        📊
    </span>

    Overview

</button>



<button class="tab">

    <span class="icon">
        📈
    </span>

    Analytics

</button>



<button class="tab">

    <span class="icon">
        ⚙️
    </span>

    Settings

</button>



<button class="tab">

    <span class="icon">
        👥
    </span>

    Users

</button>



</section>




<section class="content-card">


<h2>
    Dashboard Content
</h2>


<p>
    Shimmer-Sweep Tabs provide a modern interface pattern
    using only HTML and CSS animations.
</p>


</section>



</main>


</body>

</html>
