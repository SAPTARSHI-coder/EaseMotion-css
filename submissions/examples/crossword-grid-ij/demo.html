<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-crossword-grid</title>
</head>
<body>
<main class="cwg-card">
  <header class="cwg-head">
    <h1 class="cwg-title">Crossword</h1>
    <span class="cwg-puzzle">Daily #217</span>
  </header>
  <section class="cwg-grid" aria-label="crossword grid">
    <span class="cwg-cell cwg-cell-black"></span>
    <span class="cwg-cell cwg-cell-num">1</span>
    <span class="cwg-cell cwg-cell-filled">A</span>
    <span class="cwg-cell cwg-cell-filled">C</span>
    <span class="cwg-cell cwg-cell-active">R</span>
    <span class="cwg-cell cwg-cell-filled">O</span>
    <span class="cwg-cell cwg-cell-filled">S</span>
    <span class="cwg-cell cwg-cell-filled">S</span>
    <span class="cwg-cell cwg-cell-black"></span>
    <span class="cwg-cell cwg-cell-filled">W</span>
    <span class="cwg-cell cwg-cell-filled">I</span>
    <span class="cwg-cell cwg-cell-filled">N</span>
    <span class="cwg-cell cwg-cell-filled">E</span>
    <span class="cwg-cell cwg-cell-filled">A</span>
    <span class="cwg-cell cwg-cell-filled">R</span>
    <span class="cwg-cell cwg-cell-filled">T</span>
    <span class="cwg-cell cwg-cell-filled">H</span>
    <span class="cwg-cell cwg-cell-black"></span>
    <span class="cwg-cell cwg-cell-filled">C</span>
    <span class="cwg-cell cwg-cell-black"></span>
    <span class="cwg-cell cwg-cell-filled">O</span>
    <span class="cwg-cell cwg-cell-filled">D</span>
    <span class="cwg-cell cwg-cell-filled">E</span>
    <span class="cwg-cell cwg-cell-filled">S</span>
    <span class="cwg-cell cwg-cell-black"></span>
    <span class="cwg-cell cwg-cell-filled">N</span>
    <span class="cwg-cell cwg-cell-filled">O</span>
    <span class="cwg-cell cwg-cell-filled">W</span>
    <span class="cwg-cell cwg-cell-filled">S</span>
    <span class="cwg-cell cwg-cell-filled">T</span>
  </section>
  <aside class="cwg-clues">
    <div class="cwg-clue-col">
      <h2 class="cwg-clue-title">Across</h2>
      <p class="cwg-clue-item">1. Film genre</p>
      <p class="cwg-clue-item">5. Celestial body</p>
    </div>
    <div class="cwg-clue-col">
      <h2 class="cwg-clue-title">Down</h2>
      <p class="cwg-clue-item">1. Bodily organ</p>
      <p class="cwg-clue-item">4. Jewelry</p>
    </div>
  </aside>
  <footer class="cwg-foot">
    <span class="cwg-timer">02:14</span>
    <span class="cwg-check">Check</span>
  </footer>
</main>
</body>
</html>
