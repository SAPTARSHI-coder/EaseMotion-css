<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desert Dunes · Sand Shifts Like Dunes</title>
    <meta name="description" content="Interactive desert dunes with shifting sand, flowing patterns, and atmospheric desert effects.">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1 class="title">🏜️ DESERT DUNES</h1>
        
        <div class="canvas-wrapper">
            <canvas id="dunesCanvas" width="600" height="500"></canvas>
            <div class="glow-overlay"></div>
        </div>

        <div class="controls">
            <div class="button-group">
                <button class="shift-btn" id="shiftBtn">🌊 SHIFT</button>
                <button class="reset-btn" id="resetBtn">⟳ RESET</button>
                <button class="toggle-btn" id="toggleBtn">⏸️ PAUSE</button>
            </div>
            <div class="speed-control">
                <label>Speed</label>
                <input type="range" id="speedSlider" min="1" max="10" value="5">
                <span id="speedLabel">5</span>
                <label>Dunes</label>
                <input type="range" id="dunesSlider" min="3" max="8" value="5">
                <span id="dunesLabel">5</span>
            </div>
        </div>

        <div class="info">
            <span>🏜️ DESERT DUNES</span>
            <small>sand · shift · flow</small>
        </div>
        <div class="hint">
            <span>🌊 click to watch the sand shift like dunes</span>
        </div>
    </div>

    <script>
        (function() {
            const canvas = document.getElementById('dunesCanvas');
            const ctx = canvas.getContext('2d');
            const W = 600, H = 500;
            
            const shiftBtn = document.getElementById('shiftBtn');
            const resetBtn = document.getElementById('resetBtn');
            const toggleBtn = document.getElementById('toggleBtn');
            const speedSlider = document.getElementById('speedSlider');
            const speedLabel = document.getElementById('speedLabel');
            const dunesSlider = document.getElementById('dunesSlider');
            const dunesLabel = document.getElementById('dunesLabel');

            let isAnimating = true;
            let speed = 5;
            let numDunes = 5;
            let time = 0;
            let shiftProgress = 0;
            let isShifting = false;
            let isShifted = false;

            // ---- Dune Particles ----
            let particles = [];
            const NUM_PARTICLES = 2000;

            // ---- Particle Class ----
            class Particle {
                constructor(x, y) {
                    this.x = x || Math.random() * W;
                    this.y = y || Math.random() * H;
                    this.ox = this.x;
                    this.oy = this.y;
                    this.size = 1 + Math.random() * 2;
                    this.speed = 0.2 + Math.random() * 0.4;
                    this.phase = Math.random() * Math.PI * 2;
                    this.amp = 20 + Math.random() * 40;
                    this.duneIndex = Math.floor(Math.random() * numDunes);
                    this.shiftX = 0;
                    this.shiftY = 0;
                }

                update(dt) {
                    this.phase += this.speed * dt;
                    
                    // Dune wave motion
                    const wave = Math.sin(this.phase + this.x * 0.005) * this.amp;
                    const wave2 = Math.cos(this.phase * 0.7 + this.x * 0.003) * this.amp * 0.5;
                    
                    // Apply shift
                    const shift = Math.sin(shiftProgress * Math.PI) * 30;
                    this.shiftX = Math.sin(this.phase * 0.5 + shiftProgress) * shift * 0.3;
                    this.shiftY = Math.cos(this.phase * 0.7 + shiftProgress * 1.2) * shift * 0.2;
                    
                    // Combine motion
                    const targetX = this.ox + wave * 0.3 + wave2 * 0.2 + this.shiftX;
                    const targetY = this.oy + wave * 0.5 + wave2 * 0.3 + this.shiftY;
                    
                    this.x += (targetX - this.x) * 0.02;
                    this.y += (targetY - this.y) * 0.02;
                    
                    // Wrap around
                    if (this.x < 0) this.x = W;
                    if (this.x > W) this.x = 0;
                    if (this.y < 0) this.y = H;
                    if (this.y > H) this.y = 0;
                }

                draw(ctx) {
                    const depth = (this.y / H);
                    const light = 30 + depth * 40;
                    const alpha = 0.3 + depth * 0.4;
                    const size = this.size * (0.5 + depth * 0.5);
                    
                    ctx.save();
                    ctx.globalAlpha = alpha;
                    ctx.fillStyle = `hsl(40, ${30 + depth * 20}%, ${light}%)`;
                    ctx.shadowColor = 'rgba(200, 180, 150, 0.02)';
                    ctx.shadowBlur = 3;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
            }

            // ---- Create Particles ----
            function createParticles() {
                particles = [];
                for (let i = 0; i < NUM_PARTICLES; i++) {
                    const p = new Particle();
                    p.duneIndex = Math.floor(Math.random() * numDunes);
                    particles.push(p);
                }
            }

            // ---- Draw Dune Lines ----
            function drawDuneLines(ctx) {
                ctx.save();
                ctx.globalAlpha = 0.05;
                ctx.strokeStyle = 'rgba(200, 180, 150, 0.1)';
                ctx.lineWidth = 1;
                
                for (let d = 0; d < numDunes; d++) {
                    const offset = d * (H / numDunes);
                    ctx.beginPath();
                    for (let x = 0; x <= W; x += 2) {
                        const y = offset + Math.sin(x * 0.02 + time * 0.01 + d * 1.5) * 30 +
                                  Math.sin(x * 0.01 + time * 0.008 + d * 2) * 20 +
                                  Math.sin(shiftProgress * Math.PI + d) * 15;
                        if (x === 0) ctx.moveTo(x, y);
                        else ctx.lineTo(x, y);
                    }
                    ctx.stroke();
                }
                ctx.restore();
            }

            // ---- Draw Sun ----
            function drawSun(ctx) {
                const x = W - 80;
                const y = 70;
                const radius = 40;
                
                const grad = ctx.createRadialGradient(x, y, 0, x, y, radius * 2);
                grad.addColorStop(0, 'rgba(255, 220, 150, 0.15)');
                grad.addColorStop(0.5, 'rgba(255, 200, 100, 0.05)');
                grad.addColorStop(1, 'rgba(255, 200, 100, 0)');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(x, y, radius * 2, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.save();
                ctx.shadowColor = 'rgba(255, 200, 100, 0.05)';
                ctx.shadowBlur = 30;
                ctx.fillStyle = '#f5d6a8';
                ctx.beginPath();
                ctx.arc(x, y, radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            // ---- Render ----
            function render() {
                // Sky gradient
                const skyGrad = ctx.createLinearGradient(0, 0, 0, H);
                skyGrad.addColorStop(0, '#2a1a0a');
                skyGrad.addColorStop(0.2, '#3a2a1a');
                skyGrad.addColorStop(0.5, '#4a3a2a');
                skyGrad.addColorStop(0.7, '#5a4a3a');
                skyGrad.addColorStop(1, '#3a2a1a');
                ctx.fillStyle = skyGrad;
                ctx.fillRect(0, 0, W, H);
                
                // Sun
                drawSun(ctx);
                
                // Dune lines
                drawDuneLines(ctx);
                
                // Draw particles
                for (let p of particles) {
                    p.draw(ctx);
                }
                
                // Status info
                ctx.save();
                ctx.shadowBlur = 0;
                ctx.fillStyle = 'rgba(200, 180, 150, 0.15)';
                ctx.font = '13px monospace';
                ctx.textAlign = 'right';
                ctx.textBaseline = 'bottom';
                ctx.fillText(`Particles: ${particles.length}`, W - 20, H - 10);
                
                ctx.textAlign = 'left';
                const status = isShifted ? '🌊 SHIFTED' : 
                              isShifting ? '🔄 SHIFTING...' : 
                              '🏜️ READY';
                ctx.fillText(status, 20, H - 10);
                ctx.restore();
            }

            // ---- Shift Dunes ----
            function shiftDunes() {
                if (isShifting) return;
                isShifting = true;
                isShifted = false;
                shiftProgress = 0;
            }

            // ---- Reset ----
            function resetDunes() {
                isShifting = false;
                isShifted = false;
                shiftProgress = 0;
                createParticles();
                time = 0;
            }

            // ---- Animation Loop ----
            function animate() {
                if (!isAnimating) {
                    requestAnimationFrame(animate);
                    return;
                }
                
                time += 0.01 * (speed / 5);
                
                if (isShifting && shiftProgress < 1) {
                    shiftProgress += 0.003 * (speed / 5);
                    if (shiftProgress > 1) {
                        shiftProgress = 1;
                        isShifting = false;
                        isShifted = true;
                    }
                }
                
                // Update particles
                for (let p of particles) {
                    p.update(0.02 * (speed / 5));
                }
                
                render();
                
                requestAnimationFrame(animate);
            }

            // ---- Toggle Animation ----
            function toggleAnimation() {
                isAnimating = !isAnimating;
                toggleBtn.textContent = isAnimating ? '⏸️ PAUSE' : '▶️ PLAY';
            }

            // ---- Update Labels ----
            speedSlider.addEventListener('input', function() {
                speedLabel.textContent = this.value;
            });
            dunesSlider.addEventListener('input', function() {
                numDunes = parseInt(this.value);
                dunesLabel.textContent = numDunes;
                createParticles();
            });

            // ---- Event Listeners ----
            shiftBtn.addEventListener('click', shiftDunes);
            resetBtn.addEventListener('click', resetDunes);
            toggleBtn.addEventListener('click', toggleAnimation);

            // ---- Keyboard Shortcuts ----
            document.addEventListener('keydown', function(e) {
                if (e.key === ' ' || e.key === 'Space') {
                    e.preventDefault();
                    shiftDunes();
                }
                if (e.key === 'r' || e.key === 'R') {
                    resetDunes();
                }
                if (e.key === 'p' || e.key === 'P') {
                    toggleAnimation();
                }
            });

            // ---- Initialize ----
            createParticles();
            render();
            animate();

            console.log('🏜️ Desert Dunes · Click Shift or press Space to watch the sand shift!');
        })();
    </script>
</body>
</html>
