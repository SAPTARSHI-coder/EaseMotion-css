<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animated Hero Section - SaaS Modern | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
</head>
<body>
  <div class="ease-hero-wrapper">
    <div class="ease-hero-bg"></div>
    <div class="ease-hero-grid"></div>
    
    <div class="ease-hero-content">
      <div class="ease-hero-badge ease-stagger ease-delay-1"><span>NEW</span> EaseMotion CSS v2.0 is live</div>
      <h1 class="ease-hero-title ease-stagger ease-delay-2">Build faster with GPU-accelerated motion</h1>
      <p class="ease-hero-subtitle ease-stagger ease-delay-3">Stop wrestling with bloated JavaScript physics engines. Engineer breathtaking, hardware-accelerated user interfaces natively in CSS.</p>
      <div class="ease-hero-actions ease-stagger ease-delay-4">
        <a href="#" class="ease-btn ease-btn-primary">Start Building</a>
        <a href="#" class="ease-btn ease-btn-secondary">Read Documentation</a>
      </div>
    </div>
    
    <div class="ease-hero-dashboard ease-stagger ease-delay-4">
      <div class="ease-dash-header">
        <div class="ease-dash-dot"></div><div class="ease-dash-dot"></div><div class="ease-dash-dot"></div>
      </div>
      <div style="padding: 2rem; display: flex; gap: 2rem; height: 100%;">
        <div style="flex: 1; background: rgba(255,255,255,0.02); border-radius: 12px; border: 1px dashed rgba(255,255,255,0.05);"></div>
        <div style="flex: 2; background: rgba(255,255,255,0.02); border-radius: 12px; border: 1px dashed rgba(255,255,255,0.05);"></div>
      </div>
    </div>
  </div>
</body>
</html>
