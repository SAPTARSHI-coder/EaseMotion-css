<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Root Network</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="app">

  <section class="card">

    <header>
      <span>UNDERGROUND SYSTEM</span>
      <h1>Root Network</h1>
      <p>Watch a hidden ecosystem grow beneath the surface.</p>
    </header>

    <div class="world" id="world">

      <div class="tree">
        <div class="trunk"></div>
        <div class="crown"></div>
      </div>

      <svg id="roots" viewBox="0 0 900 500">
        <g id="rootPaths"></g>
        <g id="nodes"></g>
      </svg>

      <div class="soil"></div>

    </div>

    <div class="controls">
      <button id="grow">🌱 Grow Roots</button>
      <button id="reset">Reset</button>

      <div class="progress">
        <span>Network Growth</span>
        <strong id="progress">0%</strong>
      </div>
    </div>

  </section>

</main>

<script>
const rootPaths = document.getElementById("rootPaths");
const nodes = document.getElementById("nodes");
const progress = document.getElementById("progress");

let growth = 0;

const roots = [
  "M450 390 Q360 410 250 450",
  "M450 390 Q540 410 650 450",
  "M450 395 Q420 430 380 480",
  "M450 395 Q480 430 530 480",
  "M360 420 Q310 430 270 470",
  "M540 420 Q590 430 630 470",
  "M300 440 Q240 450 190 475",
  "M600 440 Q660 450 710 475"
];

function growRoots() {
  growth += 20;

  if (growth > 100) {
    growth = 100;
  }

  progress.textContent = `${growth}%`;

  rootPaths.innerHTML = "";
  nodes.innerHTML = "";

  roots.forEach((pathData, index) => {
    if (index < Math.ceil(roots.length * growth / 100)) {
      const path = document.createElementNS(
        "http://www.w3.org/2000/svg",
        "path"
      );

      path.setAttribute("d", pathData);
      path.classList.add("root");

      rootPaths.appendChild(path);

      setTimeout(() => {
        const parts = pathData.match(/\d+(\.\d+)?/g);

        if (parts && parts.length >= 2) {
          const x = parts[parts.length - 2];
          const y = parts[parts.length - 1];

          const node = document.createElementNS(
            "http://www.w3.org/2000/svg",
            "circle"
          );

          node.setAttribute("cx", x);
          node.setAttribute("cy", y);
          node.setAttribute("r", "5");
          node.classList.add("node");

          nodes.appendChild(node);
        }
      }, 700);
    }
  });
}

function reset() {
  growth = 0;
  progress.textContent = "0%";
  rootPaths.innerHTML = "";
  nodes.innerHTML = "";
}

document.getElementById("grow").addEventListener("click", growRoots);
document.getElementById("reset").addEventListener("click", reset);

document.addEventListener("keydown", event => {
  if (event.code === "Space") {
    event.preventDefault();
    growRoots();
  }

  if (event.key.toLowerCase() === "r") {
    reset();
  }
});
</script>

</body>
</html>
