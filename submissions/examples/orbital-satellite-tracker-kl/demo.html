<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orbital Satellite Tracker - EaseMotion CSS</title>
    <!-- Include EaseMotion Core Stylesheet -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #020617; color: #ffffff;">

    <div class="ease-card ease-card-glass tracker-container">
        <div class="tracker-header">
            <h2>Satellite Tracker</h2>
            <span class="ease-badge ease-badge-success">Tracking</span>
        </div>
        
        <div class="tracker-screen ease-center">
            <div class="orbital-ring orbit-1">
                <div class="satellite-blip"></div>
            </div>
            <div class="orbital-ring orbit-2"></div>
            <div class="tracker-core ease-center"></div>
        </div>

        <div class="tracker-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Altitude: 450 km</span>
            <button class="ease-btn ease-btn-primary ease-btn-sm ease-hover-grow">Re-lock</button>
        </div>
    </div>

</body>
</html>
