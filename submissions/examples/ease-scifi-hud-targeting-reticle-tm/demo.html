<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sci-Fi HUD Reticle | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="hudstage">
    <div class="hudview">
      <div class="hudgrid"></div>
      <span class="hudtext hudtext-tl">SCAN 0.42</span>
      <span class="hudtext hudtext-tr">RANGE 320m</span>
      <span class="hudtext hudtext-bl">LOCK ACQUIRED</span>
      <span class="hudtext hudtext-br">SYS 87%</span>
      <div class="hudbracket hudbracket-tl"></div>
      <div class="hudbracket hudbracket-tr"></div>
      <div class="hudbracket hudbracket-bl"></div>
      <div class="hudbracket hudbracket-br"></div>
      <div class="hudtarget-dot"></div>
      <span class="hudcross">+</span>
    </div>
    <p class="hudstatus">Target locked</p>
  </div>
</body>
</html>
