<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Blur-Entrance Progress Bar - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="mt-layout">
        <div class="mt-card">
            <header class="mt-header">
                <span class="mt-badge">SYSTEM INITIALIZATION</span>
                <h1 class="mt-title">NEURAL BUFFER SYNC</h1>
            </header>

            <div class="mt-progress-container">
                <div class="mt-progress-info">
                    <span class="mt-label">COMPILATION_PROGRESS</span>
                    <span class="mt-percentage">88%</span>
                </div>

                <div class="mt-progress-track">
                    <div class="mt-progress-fill">
                        <div class="mt-progress-glow"></div>
                    </div>
                </div>
            </div>

            <div class="mt-footer">
                <span class="mt-status-text">STATUS: SECURE PIPELINE ACTIVE</span>
            </div>
        </div>
    </div>
</body>
</html>
