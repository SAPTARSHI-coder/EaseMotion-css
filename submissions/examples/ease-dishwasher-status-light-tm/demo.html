<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dishwasher Status Light | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="dwstage">
    <div class="dwunit">
      <div class="dwbulb">
        <span class="dwbulb-dot lit"></span>
        <span class="dwbulb-label">Wash</span>
      </div>
      <div class="dwbulb">
        <span class="dwbulb-dot lit"></span>
        <span class="dwbulb-label">Rinse</span>
      </div>
      <div class="dwbulb">
        <span class="dwbulb-dot warn"></span>
        <span class="dwbulb-label">Dry</span>
      </div>
      <div class="dwbulb">
        <span class="dwbulb-dot"></span>
        <span class="dwbulb-label">Cool</span>
      </div>
      <div class="dwbulb">
        <span class="dwbulb-dot"></span>
        <span class="dwbulb-label">Done</span>
      </div>
    </div>
    <div class="dwstatus">
      <h2 class="dwstatus-phase">Drying</h2>
      <p class="dwstatus-time">00:18:42 remaining</p>
    </div>
  </div>
</body>
</html>
