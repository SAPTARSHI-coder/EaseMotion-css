<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ease-scroll-parallax-text-sap demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #f4f4f5; }
    .spacer { height: 60vh; display: flex; align-items: center; justify-content: center; color: #94a3b8; }
    .page { max-width: 640px; margin: 0 auto; padding-bottom: 300px; }
  </style>
</head>
<body>
  <div class="spacer">Scroll down</div>
  <div class="page">
    <div class="parallax-text-sap" id="section">
      <h2 id="heading">MOVES WITH YOU</h2>
    </div>
  </div>
  <script>
    const section = document.getElementById('section');
    const heading = document.getElementById('heading');
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    function update() {
      if (reduceMotion) return;
      const rect = section.getBoundingClientRect();
      const offset = (rect.top - window.innerHeight / 2) * 0.15;
      heading.style.transform = `translateY(${offset}px)`;
    }
    window.addEventListener('scroll', update, { passive: true });
    update();
  </script>
</body>
</html>
