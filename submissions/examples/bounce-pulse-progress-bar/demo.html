<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        Bounce-Pulse Progress Bar | EaseMotion CSS
    </title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<main class="container">


<section class="hero">

    <span class="badge">
        EaseMotion CSS
    </span>


    <h1>
        CSS Bounce-Pulse Progress Bar
    </h1>


    <p>
        A lightweight CSS-only progress bar
        featuring bounce and pulse animation
        effects for modern responsive dashboards.
    </p>

</section>




<section class="dashboard" aria-label="Progress Dashboard">


    <article class="progress-card">

        <h2>
            Frontend Development
        </h2>


        <div class="progress-track">

            <div class="progress-fill first">

                <span>
                    85%
                </span>

            </div>

        </div>


    </article>





    <article class="progress-card">

        <h2>
            UI/UX Design
        </h2>


        <div class="progress-track">

            <div class="progress-fill second">

                <span>
                    70%
                </span>

            </div>

        </div>


    </article>





    <article class="progress-card">

        <h2>
            Backend Development
        </h2>


        <div class="progress-track">

            <div class="progress-fill third">

                <span>
                    90%
                </span>

            </div>

        </div>


    </article>



</section>


</main>


</body>

</html>nxt
