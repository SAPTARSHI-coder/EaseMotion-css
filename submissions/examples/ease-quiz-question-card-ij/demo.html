<!-- EaseMotion component: quiz-question-card -->
<!DOCTYPE html>
<html lang="en" data-quiz="geography">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1">
<title>Ease Quiz Question Card</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<article class="quiz-card">
  <header class="quiz-topline">
    <span class="quiz-category">GEOGRAPHY</span>
    <span class="question-count">3 / 10</span>
  </header>
  <div class="quiz-progress"><span class="quiz-progress-fill"></span></div>
  <h2 class="quiz-question">Which river is the longest in the world?</h2>
  <ul class="option-list">
    <li class="option-row"><span class="option-key">A</span>Nile</li>
    <li class="option-row"><span class="option-key">B</span>Amazon</li>
    <li class="option-row"><span class="option-key">C</span>Yangtze</li>
    <li class="option-row"><span class="option-key">D</span>Mississippi</li>
  </ul>
  <div class="quiz-footer">
    <span id="scoreChip" class="score-chip">Score 24 pts</span>
    <button class="next-question" type="button">Next</button>
  </div>
</article>
<script>
const rows=document.querySelectorAll('.option-row');
rows.forEach(row=>row.addEventListener('click',()=>{
  if(row.classList.contains('chosen'))return;
  row.classList.add('chosen');
  row.querySelector('.option-key').textContent='ok';
  document.getElementById('scoreChip').textContent='Score 28 pts';
}));
</script>
</body>
</html>
