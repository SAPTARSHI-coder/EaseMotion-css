<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glassmorphic Command Palette Modal - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="cmd-backdrop">
    <div class="cmd-palette" role="dialog" aria-modal="true" aria-label="Command Palette">
      <div class="cmd-header">
        <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" class="cmd-input" placeholder="Type a command or search documentation..." autofocus />
        <span class="cmd-shortcut">ESC</span>
      </div>

      <div class="cmd-body">
        <div class="cmd-group">
          <div class="cmd-group-title">QUICK ACTIONS</div>
          <div class="cmd-item active" tabindex="0">
            <span class="cmd-item-icon">⚡</span>
            <span class="cmd-item-label">Create New Feature Branch</span>
            <span class="cmd-item-kbd">⌘N</span>
          </div>
          <div class="cmd-item" tabindex="0">
            <span class="cmd-item-icon">🔍</span>
            <span class="cmd-item-label">Search Repository Issues</span>
            <span class="cmd-item-kbd">⌘F</span>
          </div>
        </div>

        <div class="cmd-group">
          <div class="cmd-group-title">DOCUMENTATION</div>
          <div class="cmd-item" tabindex="0">
            <span class="cmd-item-icon">📚</span>
            <span class="cmd-item-label">CSS Hardware Acceleration Guide</span>
            <span class="cmd-item-kbd">↵</span>
          </div>
          <div class="cmd-item" tabindex="0">
            <span class="cmd-item-icon">🎨</span>
            <span class="cmd-item-label">Glassmorphism Design System</span>
            <span class="cmd-item-kbd">↵</span>
          </div>
        </div>
      </div>

      <div class="cmd-footer">
        <span>Navigation: <kbd>↑</kbd> <kbd>↓</kbd></span>
        <span>Select: <kbd>↵</kbd></span>
        <span>Close: <kbd>ESC</kbd></span>
      </div>
    </div>
  </div>
</body>
</html>
