<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Toggle Knob Spring &mdash; EaseMotion CSS Demo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="page-head">
    <p class="kicker">EaseMotion CSS &middot; Productivity</p>
    <h1>Toggle Knob Spring</h1>
    <p class="sub">A preference toggle that snaps with a satisfying spring.</p>
  </header>
  <main class="stage">
    <div class="tk-row">
      <span class="tk-switch"><span class="tk-knob"></span></span>
      <span class="tk-label">Auto-save drafts</span>
    </div>
  </main>
  <p class="stage-caption">Hover to send the knob across and the label tilts along.</p>
  <footer class="page-foot">
    <span>Pure CSS &middot; zero dependencies</span>
    <span>Springy knob</span>
  </footer>
</body>
</html>
