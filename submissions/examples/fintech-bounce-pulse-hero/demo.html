<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fintech Dashboard - Bounce-Pulse Hero</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <section class="fintech-hero">
    <div class="hero-content">
      <span class="hero-badge">New</span>
      <h1 class="hero-title">Grow your wealth, effortlessly</h1>
      <p class="hero-subtitle">Track investments, automate savings, and get real-time insights — all in one dashboard.</p>
      <button class="hero-cta">Get Started</button>
    </div>

    <div class="hero-visual">
      <div class="pulse-ring"></div>
      <div class="pulse-ring pulse-ring-delay"></div>
      <div class="hero-card">
        <p class="card-label">Portfolio Value</p>
        <h2 class="card-value">$48,920.15</h2>
        <p class="card-change">+3.2% this week</p>
      </div>
    </div>
  </section>

</body>
</html>
