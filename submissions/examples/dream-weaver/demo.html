<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>Dream Weaver</title>

<link
rel="stylesheet"
href="style.css"
>

</head>

<body>

<main class="dream-shell">

<header class="topbar">

<div>

<span class="eyebrow">
DREAM NETWORK
</span>

<h1>
Dream Weaver
</h1>

</div>

<div class="network-status">

<span class="pulse"></span>

<span>
ACTIVE CONSTELLATION
</span>

</div>

</header>


<div class="layout">

<section class="sky">

<svg
class="connections"
viewBox="0 0 1000 600"
preserveAspectRatio="none"
>

<line x1="150" y1="130" x2="320" y2="210"/>
<line x1="320" y1="210" x2="520" y2="130"/>
<line x1="520" y1="130" x2="710" y2="280"/>
<line x1="320" y1="210" x2="450" y2="420"/>
<line x1="450" y1="420" x2="720" y2="460"/>

</svg>


<button
class="star"
style="--x:15%;--y:22%;"
data-title="Launch IntervAI"
data-category="Goal"
data-energy="94"
data-time="2 weeks ago"
data-description="Create a real-time AI mock interview platform."
>
✦
</button>


<button
class="star"
style="--x:32%;--y:35%;"
data-title="Open Source Journey"
data-category="Growth"
data-energy="88"
data-time="1 month ago"
data-description="Become a top contributor across multiple repositories."
>
✦
</button>


<button
class="star"
style="--x:52%;--y:22%;"
data-title="IronGate"
data-category="Project"
data-energy="97"
data-time="Current"
data-description="Real-time fraud detection and escalation platform."
>
✦
</button>


<button
class="star"
style="--x:72%;--y:47%;"
data-title="Research Paper"
data-category="Research"
data-energy="71"
data-time="3 weeks ago"
data-description="Publish practical AI research work."
>
✦
</button>


<button
class="star"
style="--x:45%;--y:70%;"
data-title="ML Systems"
data-category="Learning"
data-energy="82"
data-time="5 days ago"
data-description="Learn production ML infrastructure."
>
✦
</button>


<button
class="star"
style="--x:74%;--y:78%;"
data-title="AI Startup"
data-category="Vision"
data-energy="90"
data-time="Future"
data-description="Build a long-term AI company."
>
✦
</button>

</section>


<aside class="inspector">

<div class="panel-title">

<span>
SELECTED FRAGMENT
</span>

<h2 id="title">
IronGate
</h2>

</div>


<div class="detail-grid">

<div>

<span>
CATEGORY
</span>

<strong id="category">
Project
</strong>

</div>

<div>

<span>
ENERGY
</span>

<strong id="energy">
97
</strong>

</div>

<div>

<span>
CREATED
</span>

<strong id="created">
Current
</strong>

</div>

</div>


<div class="description">

<p id="description">
Real-time fraud detection and escalation platform.
</p>

</div>


<div class="activity">

<div class="meter-top">

<span>
CONSTELLATION ENERGY
</span>

<span>
84%
</span>

</div>

<div class="meter">

<div class="fill"></div>

</div>

</div>


<div class="actions">

<button
id="focusBtn"
class="action secondary"
>
Focus Path
</button>

<button
id="generateBtn"
class="action primary"
>
Generate Connection
</button>

</div>

</aside>

</div>


<div
id="toast"
class="toast"
>
Connection generated.
</div>

</main>


<script>

const stars =
document.querySelectorAll(".star");

const title =
document.querySelector("#title");

const category =
document.querySelector("#category");

const energy =
document.querySelector("#energy");

const created =
document.querySelector("#created");

const description =
document.querySelector("#description");

const toast =
document.querySelector("#toast");

const focusBtn =
document.querySelector("#focusBtn");

const generateBtn =
document.querySelector("#generateBtn");


stars.forEach(
star => {

star.addEventListener(
"click",
() => {

stars.forEach(
s =>
s.classList.remove(
"active"
)
);

star.classList.add(
"active"
);

title.textContent =
star.dataset.title;

category.textContent =
star.dataset.category;

energy.textContent =
star.dataset.energy;

created.textContent =
star.dataset.time;

description.textContent =
star.dataset.description;

}
);

}
);


focusBtn.addEventListener(
"click",
() => {

document.body.classList.toggle(
"focus-mode"
);

showToast(
"Constellation path focused."
);

}
);


generateBtn.addEventListener(
"click",
() => {

showToast(
"New dream connection generated."
);

}
);


function showToast(
message
) {

toast.textContent =
message;

toast.classList.add(
"show"
);

setTimeout(
() => {

toast.classList.remove(
"show"
);

},
2200
);

}

</script>

</body>

</html>
