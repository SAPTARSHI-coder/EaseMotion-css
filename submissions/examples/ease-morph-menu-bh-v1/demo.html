<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ease-morph-menu-bh</title>
  <link rel="stylesheet" href="style.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #f1f5f9; padding: 2rem; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    h1 { color: #6366f1; margin-bottom: 0.5rem; }
    p { color: #94a3b8; margin-bottom: 2rem; }
    .ease-morph-menu { width: 80px; height: 80px; }
  </style>
</head>
<body>
  <h1>ease-morph-menu-bh</h1>
  <p>Click the button to see elastic morphing animation</p>
  
  <button class="ease-morph-menu" onclick="this.classList.toggle('active')">
    <svg viewBox="0 0 50 50">
      <line x1="10" y1="15" x2="40" y2="15" />
      <line x1="10" y1="25" x2="40" y2="25" />
      <line x1="10" y1="35" x2="40" y2="35" />
    </svg>
  </button>
</body>
</html>
