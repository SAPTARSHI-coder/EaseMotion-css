<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Nested Accordion</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="accordion">

  <details open>
    <summary>Frontend Development</summary>

    <div class="content">

      <details>
        <summary>HTML</summary>
        <div class="content">
          Semantic tags, forms, accessibility and SEO.
        </div>
      </details>

      <details>
        <summary>CSS</summary>
        <div class="content">
          Flexbox, Grid, Animations and Responsive Design.
        </div>
      </details>

      <details>
        <summary>JavaScript</summary>

        <div class="content nested">

          <details>
            <summary>Basics</summary>
            <div class="content">
              Variables, functions and loops.
            </div>
          </details>

          <details>
            <summary>Advanced</summary>
            <div class="content">
              Closures, promises and async/await.
            </div>
          </details>

        </div>
      </details>

    </div>
  </details>

  <details>
    <summary>Backend Development</summary>
    <div class="content">
      Node.js, Express and Databases.
    </div>
  </details>

</div>

</body>
</html>
