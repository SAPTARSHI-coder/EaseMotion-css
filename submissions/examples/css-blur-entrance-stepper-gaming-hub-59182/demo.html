<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blur Entrance Stepper</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<section class="stepper-section">

    <h1>Gaming Progress</h1>

    <p class="subtitle">
        Complete each stage to unlock the next adventure.
    </p>

    <div class="stepper">

        <div class="step active">
            <div class="circle">1</div>
            <h3>Create Profile</h3>
            <p>Register your gaming account.</p>
        </div>

        <div class="line"></div>

        <div class="step active">
            <div class="circle">2</div>
            <h3>Select Hero</h3>
            <p>Choose your favorite character.</p>
        </div>

        <div class="line"></div>

        <div class="step">
            <div class="circle">3</div>
            <h3>Join Match</h3>
            <p>Enter the multiplayer arena.</p>
        </div>

        <div class="line"></div>

        <div class="step">
            <div class="circle">4</div>
            <h3>Claim Rewards</h3>
            <p>Unlock exclusive achievements.</p>
        </div>

    </div>

</section>

</body>
</html>
