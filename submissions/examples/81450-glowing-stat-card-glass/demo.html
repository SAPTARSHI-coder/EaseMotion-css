<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Glowing stat card with glassmorphism styling built using pure CSS."
  >

  <title>Glowing Stat Card — Glassmorphism</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="glass-page">

    <header class="glass-header">
      <span class="glass-header__eyebrow">
        ANALYTICS DASHBOARD
      </span>

      <h1>Live performance metrics</h1>

      <p>
        A glowing glassmorphism stat card with responsive
        layouts and subtle CSS-powered interactions.
      </p>
    </header>

    <section
      class="glass-stats"
      aria-label="Analytics statistics"
    >

      <article class="glass-stat-card glass-stat-card--violet">

        <div class="glass-stat-card__glow"></div>

        <div class="glass-stat-card__top">
          <span class="glass-stat-card__label">
            ACTIVE USERS
          </span>

          <span
            class="glass-stat-card__icon"
            aria-hidden="true"
          >
            ↗
          </span>
        </div>

        <div class="glass-stat-card__value">
          24.8K
        </div>

        <div class="glass-stat-card__meta">
          <span class="glass-stat-card__change">
            +14.6%
          </span>

          <span class="glass-stat-card__period">
            vs last month
          </span>
        </div>

        <div
          class="glass-stat-card__progress"
          aria-hidden="true"
        >
          <span></span>
        </div>

      </article>


      <article class="glass-stat-card glass-stat-card--cyan">

        <div class="glass-stat-card__glow"></div>

        <div class="glass-stat-card__top">
          <span class="glass-stat-card__label">
            CONVERSION
          </span>

          <span
            class="glass-stat-card__icon"
            aria-hidden="true"
          >
            %
          </span>
        </div>

        <div class="glass-stat-card__value">
          72.4%
        </div>

        <div class="glass-stat-card__meta">
          <span class="glass-stat-card__change">
            +9.8%
          </span>

          <span class="glass-stat-card__period">
            vs last month
          </span>
        </div>

        <div
          class="glass-stat-card__progress"
          aria-hidden="true"
        >
          <span></span>
        </div>

      </article>


      <article class="glass-stat-card glass-stat-card--pink">

        <div class="glass-stat-card__glow"></div>

        <div class="glass-stat-card__top">
          <span class="glass-stat-card__label">
            REVENUE
          </span>

          <span
            class="glass-stat-card__icon"
            aria-hidden="true"
          >
            $
          </span>
        </div>

        <div class="glass-stat-card__value">
          $86.4K
        </div>

        <div class="glass-stat-card__meta">
          <span class="glass-stat-card__change">
            +21.4%
          </span>

          <span class="glass-stat-card__period">
            vs last month
          </span>
        </div>

        <div
          class="glass-stat-card__progress"
          aria-hidden="true"
        >
          <span></span>
        </div>

      </article>

    </section>

  </main>

</body>
</html>
