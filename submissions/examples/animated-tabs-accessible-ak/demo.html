<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accessible Web Jello-Hover Tabs | EaseMotion CSS</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="ease-center ease-fade-in" style="min-height: 100vh; background: #f8fafc; font-family: 'Inter', sans-serif; padding: 2rem;">

  <div class="tabs-container">
    <header class="tabs-header ease-slide-up">
      <h1 class="ease-fade-in">Accessible Web Tabs</h1>
      <p class="ease-slide-up ease-delay-100">Pure CSS interactive tabs featuring a smooth jello-hover transition with high contrast and accessibility standards.</p>
    </header>

    <!-- Tabs Wrapper -->
    <div class="ease-tabs-accessible-ak ease-slide-up ease-delay-200">
      <div class="tabs-list" role="tablist">
        <button role="tab" aria-selected="true" class="tab-btn active">Navigation</button>
        <button role="tab" aria-selected="false" class="tab-btn">Landmarks</button>
        <button role="tab" aria-selected="false" class="tab-btn">Keyboard Guide</button>
      </div>
      <div class="tabs-panels">
        <div role="tabpanel" class="tab-panel active">
          <h3>High Contrast & Focus Rings</h3>
          <p>Designed with strict WCAG compliance, clear focus indicators, and zero JavaScript overhead.</p>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
