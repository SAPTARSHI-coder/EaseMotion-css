<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Campfire – Campfire Flickers and Crackles</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <h1>🔥 Campfire</h1>
    <p class="subtitle">Campfire flickers and crackles with warmth</p>

    <div class="campfire-container">
      <div class="campfire-stage" id="campfireStage">
        <canvas id="canvas"></canvas>
        
        <!-- Info overlay -->
        <div class="info-overlay">
          <span class="fire-status" id="fireStatus">🔥 Burning</span>
          <span class="flame-count" id="flameCount">✦ 0 flames</span>
        </div>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <button class="ctrl-btn add" id="addBtn">🪵 Add Log</button>
      <button class="ctrl-btn clear" id="clearBtn">💨 Extinguish</button>
      <button class="ctrl-btn toggle" id="toggleBtn">⏸ Pause</button>
      <button class="ctrl-btn reset" id="resetBtn">↺ Reset</button>
    </div>

    <!-- Sliders -->
    <div class="slider-container">
      <span class="slider-label">Flame Intensity</span>
      <input type="range" id="intensitySlider" min="0" max="100" value="70" />
      <span class="slider-value" id="intensityValue">70%</span>
    </div>

    <div class="slider-container">
      <span class="slider-label">Wind Effect</span>
      <input type="range" id="windSlider" min="0" max="100" value="40" />
      <span class="slider-value" id="windValue">40%</span>
    </div>

    <div class="slider-container">
      <span class="slider-label">Flame Height</span>
      <input type="range" id="heightSlider" min="50" max="150" value="100" />
      <span class="slider-value" id="heightValue">100%</span>
    </div>

    <!-- Status -->
    <div class="status" id="status">🔥 Campfire crackling and flickering warmly</div>

    <!-- Keyboard shortcuts -->
    <div class="shortcuts">
      <kbd>L</kbd> Add Log · <kbd>E</kbd> Extinguish · <kbd>Space</kbd> Pause · <kbd>R</kbd> Reset
    </div>
  </div>

  <script>
    (function() {
      "use strict";

      // DOM elements
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      const fireStatus = document.getElementById('fireStatus');
      const flameCount = document.getElementById('flameCount');
      const addBtn = document.getElementById('addBtn');
      const clearBtn = document.getElementById('clearBtn');
      const toggleBtn = document.getElementById('toggleBtn');
      const resetBtn = document.getElementById('resetBtn');
      const status = document.getElementById('status');
      const intensitySlider = document.getElementById('intensitySlider');
      const intensityValue = document.getElementById('intensityValue');
      const windSlider = document.getElementById('windSlider');
      const windValue = document.getElementById('windValue');
      const heightSlider = document.getElementById('heightSlider');
      const heightValue = document.getElementById('heightValue');

      // State
      let flames = [];
      let embers = [];
      let logs = [];
      let isPaused = false;
      let animationId = null;
      let time = 0;
      let isBurning = true;

      // ----- Canvas setup -----
      function setupCanvas() {
        const rect = canvas.parentElement.getBoundingClientRect();
        const size = Math.min(rect.width - 40, 600);
        canvas.width = size;
        canvas.height = size;
        canvas.style.width = size + 'px';
        canvas.style.height = size + 'px';
      }

      // ----- Flame class -----
      class Flame {
        constructor(x, y, size) {
          this.x = x;
          this.y = y;
          this.baseX = x;
          this.baseY = y;
          this.size = size;
          this.height = size * (0.5 + Math.random() * 0.5);
          this.width = size * (0.3 + Math.random() * 0.3);
          this.speed = 0.5 + Math.random() * 1.5;
          this.phase = Math.random() * Math.PI * 2;
          this.life = 0.5 + Math.random() * 0.5;
          this.opacity = 0.3 + Math.random() * 0.5;
          this.hue = 30 + Math.random() * 20; // 30-50 (orange-red)
          this.saturation = 80 + Math.random() * 20;
          this.lightness = 50 + Math.random() * 30;
          this.alive = true;
          this.glowSize = this.size * 3;
          this.wobbleAmount = 0.5 + Math.random() * 1.5;
          this.trail = [];
          this.trailLength = 5 + Math.floor(Math.random() * 8);
        }

        update(wind, intensity, heightMult) {
          const windEffect = wind / 100 * 2;
          const intensityEffect = intensity / 100;
          const heightEffect = heightMult / 100;

          // Flicker
          this.life -= 0.001 * (1 + intensityEffect * 0.5);
          if (this.life < 0) {
            this.alive = false;
            return;
          }

          // Movement with wind and flicker
          const flicker = Math.sin(time * this.speed * 2 + this.phase) * 2;
          const flicker2 = Math.cos(time * this.speed * 1.3 + this.phase * 1.7) * 1.5;
          
          this.x += (Math.sin(time * 0.5 + this.phase) * this.wobbleAmount * 0.1 + windEffect * 0.3) * intensityEffect;
          this.y -= (0.2 + 0.3 * intensityEffect + Math.sin(time * this.speed + this.phase) * 0.1) * heightEffect;
          
          // Width variation
          this.width = this.size * (0.3 + 0.3 * intensityEffect) * (0.5 + 0.5 * Math.sin(time * this.speed * 0.7 + this.phase));

          // Height variation
          this.height = this.size * (0.5 + 0.5 * intensityEffect) * (0.7 + 0.3 * Math.sin(time * this.speed * 0.5 + this.phase * 0.5));

          // Color variation
          this.hue = 30 + Math.sin(time * 0.5 + this.phase) * 15;
          this.lightness = 50 + Math.sin(time * this.speed + this.phase) * 20;

          // Trail
          this.trail.push({ x: this.x, y: this.y });
          if (this.trail.length > this.trailLength) {
            this.trail.shift();
          }

          // Opacity fade
          this.opacity *= 0.9995;
        }

        draw(ctx) {
          if (this.opacity < 0.01) return;

          const alpha = this.opacity * this.life;
          const size = this.size * this.life;

          // Trail
          if (this.trail.length > 1) {
            for (let i = 0; i < this.trail.length - 1; i++) {
              const t = i / this.trail.length;
              const trailAlpha = alpha * t * 0.15;
              const trailSize = size * t * 0.2;
              ctx.fillStyle = `hsla(${this.hue + 10}, 100%, 70%, ${trailAlpha})`;
              ctx.beginPath();
              ctx.arc(this.trail[i].x, this.trail[i].y, trailSize, 0, Math.PI * 2);
              ctx.fill();
            }
          }

          // Glow
          const glowSize = size * 4;
          const gradient = ctx.createRadialGradient(
            this.x, this.y, 0,
            this.x, this.y, glowSize
          );
          gradient.addColorStop(0, `hsla(${this.hue + 20}, 100%, 80%, ${alpha * 0.2})`);
          gradient.addColorStop(0.5, `hsla(${this.hue + 10}, 100%, 60%, ${alpha * 0.1})`);
          gradient.addColorStop(1, `hsla(${this.hue}, 100%, 40%, 0)`);
          ctx.fillStyle = gradient;
          ctx.beginPath();
          ctx.arc(this.x, this.y, glowSize, 0, Math.PI * 2);
          ctx.fill();

          // Flame body
          ctx.save();
          ctx.translate(this.x, this.y);
          ctx.rotate(Math.sin(time * 0.2 + this.phase) * 0.05);

          const grad = ctx.createRadialGradient(
            -this.width * 0.2, -this.height * 0.3, 0,
            0, 0, this.width
          );
          grad.addColorStop(0, `hsla(${this.hue + 20}, 100%, 90%, ${alpha * 0.9})`);
          grad.addColorStop(0.3, `hsla(${this.hue + 10}, 100%, 75%, ${alpha * 0.8})`);
          grad.addColorStop(0.6, `hsla(${this.hue}, 100%, 60%, ${alpha * 0.6})`);
          grad.addColorStop(1, `hsla(${this.hue - 10}, 100%, 40%, ${alpha * 0.3})`);

          ctx.shadowColor = `hsla(${this.hue}, 100%, 60%, ${alpha * 0.2})`;
          ctx.shadowBlur = 20;

          ctx.fillStyle = grad;
          
          // Flame shape (teardrop)
          ctx.beginPath();
          ctx.moveTo(0, -this.height);
          ctx.quadraticCurveTo(this.width * 0.5, -this.height * 0.6, this.width * 0.6, -this.height * 0.1);
          ctx.quadraticCurveTo(this.width * 0.5, this.height * 0.1, this.width * 0.3, this.height * 0.3);
          ctx.quadraticCurveTo(0, this.height * 0.5, -this.width * 0.3, this.height * 0.3);
          ctx.quadraticCurveTo(-this.width * 0.5, this.height * 0.1, -this.width * 0.6, -this.height * 0.1);
          ctx.quadraticCurveTo(-this.width * 0.5, -this.height * 0.6, 0, -this.height);
          ctx.closePath();
          ctx.fill();

          ctx.shadowBlur = 0;

          // Inner glow
          const innerGrad = ctx.createRadialGradient(
            -this.width * 0.1, -this.height * 0.2, 0,
            0, -this.height * 0.1, this.width * 0.4
          );
          innerGrad.addColorStop(0, `hsla(45, 100%, 95%, ${alpha * 0.3})`);
          innerGrad.addColorStop(1, `hsla(45, 100%, 80%, 0)`);
          ctx.fillStyle = innerGrad;
          ctx.beginPath();
          ctx.ellipse(0, -this.height * 0.2, this.width * 0.3, this.height * 0.3, 0, 0, Math.PI * 2);
          ctx.fill();

          ctx.restore();
        }

        isAlive() {
          return this.alive && this.life > 0.01 && this.opacity > 0.01;
        }
      }

      // ----- Ember class -----
      class Ember {
        constructor(x, y) {
          this.x = x + (Math.random() - 0.5) * 20;
          this.y = y;
          this.size = 1 + Math.random() * 3;
          this.speedX = (Math.random() - 0.5) * 2;
          this.speedY = -(0.5 + Math.random() * 1.5);
          this.life = 1;
          this.decay = 0.005 + Math.random() * 0.015;
          this.hue = 30 + Math.random() * 30;
          this.opacity = 0.5 + Math.random() * 0.5;
          this.glowSize = this.size * 3;
        }

        update(wind) {
          const windEffect = wind / 100 * 2;
          this.x += this.speedX + windEffect * 0.3;
          this.y += this.speedY;
          this.speedX *= 0.99;
          this.speedY -= 0.02;
          this.life -= this.decay;
          this.size *= 0.998;
          return this.life > 0 && this.size > 0.1;
        }

        draw(ctx) {
          const alpha = this.life * this.opacity;
          const size = this.size * this.life;

          // Glow
          const gradient = ctx.createRadialGradient(
            this.x, this.y, 0,
            this.x, this.y, this.glowSize * this.life
          );
          gradient.addColorStop(0, `hsla(${this.hue + 20}, 100%, 90%, ${alpha * 0.5})`);
          gradient.addColorStop(1, `hsla(${this.hue + 20}, 100%, 60%, 0)`);
          ctx.fillStyle = gradient;
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.glowSize * this.life, 0, Math.PI * 2);
          ctx.fill();

          // Core
          ctx.fillStyle = `hsla(${this.hue + 30}, 100%, 95%, ${alpha * 0.9})`;
          ctx.beginPath();
          ctx.arc(this.x, this.y, size, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // ----- Log class -----
      class Log {
        constructor(x, y, angle, length) {
          this.x = x;
          this.y = y;
          this.angle = angle;
          this.length = length;
          this.width = 4 + Math.random() * 4;
          this.color = `hsl(${20 + Math.random() * 15}, 30%, ${20 + Math.random() * 15}%)`;
          this.burning = true;
          this.glow = 0;
        }

        draw(ctx) {
          ctx.save();
          ctx.translate(this.x, this.y);
          ctx.rotate(this.angle);

          // Log body
          const grad = ctx.createLinearGradient(-this.length/2, -this.width/2, this.length/2, this.width/2);
          grad.addColorStop(0, this.color);
          grad.addColorStop(0.3, this.lightenColor(this.color, 20));
          grad.addColorStop(0.7, this.color);
          grad.addColorStop(1, this.darkenColor(this.color, 20));
          
          ctx.fillStyle = grad;
          ctx.shadowColor = 'rgba(0,0,0,0.2)';
          ctx.shadowBlur = 5;
          
          ctx.beginPath();
          ctx.roundRect(-this.length/2, -this.width/2, this.length, this.width, 2);
          ctx.fill();

          ctx.shadowBlur = 0;

          // Wood grain
          ctx.strokeStyle = this.darkenColor(this.color, 30) + '44';
          ctx.lineWidth = 0.5;
          for (let i = 0; i < 3; i++) {
            const y = -this.width/2 + this.width * (0.2 + i * 0.3);
            ctx.beginPath();
            ctx.moveTo(-this.length/2 + 3, y);
            ctx.lineTo(this.length/2 - 3, y + (Math.random() - 0.5) * 2);
            ctx.stroke();
          }

          // Glow from burning
          if (this.burning) {
            const glowGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, this.length * 0.5);
            glowGrad.addColorStop(0, `rgba(255, 150, 50, ${0.05 + 0.1 * Math.sin(time * 2 + this.x)})`);
            glowGrad.addColorStop(1, `rgba(255, 150, 50, 0)`);
            ctx.fillStyle = glowGrad;
            ctx.beginPath();
            ctx.arc(0, 0, this.length * 0.5, 0, Math.PI * 2);
            ctx.fill();
          }

          ctx.restore();
        }

        lightenColor(color, percent) {
          const num = parseInt(color.replace('#', ''), 16);
          const amt = Math.round(2.55 * percent);
          const R = Math.min(255, (num >> 16) + amt);
          const G = Math.min(255, ((num >> 8) & 0x00FF) + amt);
          const B = Math.min(255, (num & 0x0000FF) + amt);
          return '#' + (0x1000000 + R * 0x10000 + G * 0x100 + B).toString(16).slice(1);
        }

        darkenColor(color, percent) {
          const num = parseInt(color.replace('#', ''), 16);
          const amt = Math.round(2.55 * percent);
          const R = Math.max(0, (num >> 16) - amt);
          const G = Math.max(0, ((num >> 8) & 0x00FF) - amt);
          const B = Math.max(0, (num & 0x0000FF) - amt);
          return '#' + (0x1000000 + R * 0x10000 + G * 0x100 + B).toString(16).slice(1);
        }
      }

      // ----- Generate fire -----
      function generateFire() {
        const w = canvas.width;
        const h = canvas.height;
        const cx = w / 2;
        const cy = h * 0.75;
        const intensity = parseInt(intensitySlider.value) / 100;
        const heightMult = parseInt(heightSlider.value) / 100;

        // Generate logs
        logs = [];
        const logCount = 3 + Math.floor(Math.random() * 3);
        for (let i = 0; i < logCount; i++) {
          const angle = (i / logCount) * Math.PI * 2 + (Math.random() - 0.5) * 0.3;
          const length = 30 + Math.random() * 40;
          const radius = 20 + Math.random() * 10;
          const x = cx + Math.cos(angle) * radius;
          const y = cy + Math.sin(angle) * radius * 0.3;
          const log = new Log(x, y, angle, length);
          logs.push(log);
        }

        // Generate flames
        flames = [];
        const flameCountVal = Math.floor(20 + intensity * 40);
        for (let i = 0; i < flameCountVal; i++) {
          const angle = (Math.random() - 0.5) * 0.8;
          const radius = Math.random() * 30;
          const x = cx + Math.cos(angle) * radius;
          const y = cy + Math.sin(angle) * radius - 5;
          const size = 10 + Math.random() * 25 * heightMult;
          const flame = new Flame(x, y, size);
          flame.opacity = 0.3 + Math.random() * 0.5;
          flame.life = 0.3 + Math.random() * 0.7;
          flames.push(flame);
        }

        // Generate embers
        embers = [];
        for (let i = 0; i < 20; i++) {
          const x = cx + (Math.random() - 0.5) * 40;
          const y = cy + (Math.random() - 0.5) * 20;
          embers.push(new Ember(x, y));
        }

        flameCount.textContent = `✦ ${flames.length} flames`;
      }

      // ----- Add log -----
      function addLog() {
        const w = canvas.width;
        const h = canvas.height;
        const cx = w / 2;
        const cy = h * 0.75;
        
        const angle = Math.random() * Math.PI * 2;
        const length = 25 + Math.random() * 35;
        const radius = 15 + Math.random() * 20;
        const x = cx + Math.cos(angle) * radius;
        const y = cy + Math.sin(angle) * radius * 0.3;
        const log = new Log(x, y, angle, length);
        logs.push(log);
        
        // Add burst of flames
        for (let i = 0; i < 5; i++) {
          const angle2 = (Math.random() - 0.5) * 0.6;
          const radius2 = Math.random() * 20;
          const fx = cx + Math.cos(angle2) * radius2;
          const fy = cy + Math.sin(angle2) * radius2 - 5;
          const size = 12 + Math.random() * 20;
          const flame = new Flame(fx, fy, size);
          flame.life = 0.5 + Math.random() * 0.5;
          flame.opacity = 0.5 + Math.random() * 0.5;
          flames.push(flame);
        }
        
        flameCount.textContent = `✦ ${flames.length} flames`;
        status.textContent = '🪵 Added log to the fire!';
        setTimeout(() => {
          status.textContent = '🔥 Campfire crackling and flickering warmly';
        }, 1500);
      }

      // ----- Extinguish -----
      function extinguish() {
        isBurning = false;
        flames = [];
        embers = [];
        flameCount.textContent = '✦ 0 flames';
        fireStatus.textContent = '💨 Extinguished';
        status.textContent = '💨 Campfire extinguished';
        clearBtn.textContent = '🔥 Relight';
        setTimeout(() => {
          if (!isBurning) {
            status.textContent = '💨 Click Relight to start the fire again';
          }
        }, 1000);
      }

      // ----- Relight -----
      function relight() {
        isBurning = true;
        clearBtn.textContent = '💨 Extinguish';
        generateFire();
        fireStatus.textContent = '🔥 Burning';
        status.textContent = '🔥 Campfire relit!';
        setTimeout(() => {
          status.textContent = '🔥 Campfire crackling and flickering warmly';
        }, 1000);
      }

      // ----- Toggle extinguish/relight -----
      function toggleFire() {
        if (isBurning) {
          extinguish();
        } else {
          relight();
        }
      }

      // ----- Toggle pause -----
      function togglePause() {
        isPaused = !isPaused;
        toggleBtn.textContent = isPaused ? '▶ Play' : '⏸ Pause';
        status.textContent = isPaused ? '⏸ Paused' : '▶ Resumed';
        fireStatus.textContent = isPaused ? '⏸ Paused' : (isBurning ? '🔥 Burning' : '💨 Extinguished');
      }

      // ----- Reset -----
      function resetFire() {
        isPaused = false;
        isBurning = true;
        toggleBtn.textContent = '⏸ Pause';
        clearBtn.textContent = '💨 Extinguish';
        intensitySlider.value = 70;
        intensityValue.textContent = '70%';
        windSlider.value = 40;
        windValue.textContent = '40%';
        heightSlider.value = 100;
        heightValue.textContent = '100%';
        generateFire();
        fireStatus.textContent = '🔥 Burning';
        status.textContent = '↺ Reset';
        setTimeout(() => {
          status.textContent = '🔥 Campfire crackling and flickering warmly';
        }, 500);
      }

      // ----- Draw background -----
      function drawBackground() {
        const w = canvas.width;
        const h = canvas.height;
        const cx = w / 2;
        const cy = h * 0.75;

        // Night sky
        const bgGradient = ctx.createRadialGradient(cx, cy * 0.5, 0, cx, cy * 0.5, w * 0.8);
        bgGradient.addColorStop(0, '#0a0a1a');
        bgGradient.addColorStop(0.3, '#080812');
        bgGradient.addColorStop(0.7, '#05050a');
        bgGradient.addColorStop(1, '#020204');
        ctx.fillStyle = bgGradient;
        ctx.fillRect(0, 0, w, h);

        // Stars
        for (let i = 0; i < 30; i++) {
          const seed = i * 137.508;
          const x = (seed * 0.618) % w;
          const y = (seed * 0.381) % (h * 0.6);
          const size = 0.5 + (seed % 3) * 0.5;
          const alpha = 0.1 + (seed % 100) / 100 * 0.3;
          const twinkle = 0.5 + 0.5 * Math.sin(time * 0.5 + seed);
          ctx.fillStyle = `rgba(255, 255, 255, ${alpha * twinkle})`;
          ctx.beginPath();
          ctx.arc(x, y, size * twinkle, 0, Math.PI * 2);
          ctx.fill();
        }

        // Ground
        const groundGrad = ctx.createLinearGradient(0, cy, 0, h);
        groundGrad.addColorStop(0, 'rgba(20, 15, 10, 0)');
        groundGrad.addColorStop(0.3, 'rgba(20, 15, 10, 0.3)');
        groundGrad.addColorStop(1, 'rgba(10, 8, 5, 0.6)');
        ctx.fillStyle = groundGrad;
        ctx.fillRect(0, cy, w, h - cy);

        // Fire glow on ground
        if (isBurning) {
          const intensity = parseInt(intensitySlider.value) / 100;
          const groundGlow = ctx.createRadialGradient(cx, cy + 10, 0, cx, cy + 10, 80 * intensity);
          groundGlow.addColorStop(0, `rgba(255, 150, 50, ${0.1 * intensity})`);
          groundGlow.addColorStop(0.5, `rgba(255, 100, 30, ${0.05 * intensity})`);
          groundGlow.addColorStop(1, `rgba(255, 50, 10, 0)`);
          ctx.fillStyle = groundGlow;
          ctx.beginPath();
          ctx.arc(cx, cy + 10, 80 * intensity, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // ----- Draw -----
      function draw() {
        const w = canvas.width;
        const h = canvas.height;
        const cx = w / 2;
        const cy = h * 0.75;
        const intensity = parseInt(intensitySlider.value) / 100;
        const wind = parseInt(windSlider.value);
        const heightMult = parseInt(heightSlider.value) / 100;

        drawBackground();

        // Draw logs
        logs.forEach(log => log.draw(ctx));

        // Update and draw flames
        if (!isPaused && isBurning) {
          // Spawn new flames
          if (flames.length < 60) {
            const angle = (Math.random() - 0.5) * 0.6;
            const radius = Math.random() * 25;
            const x = cx + Math.cos(angle) * radius;
            const y = cy + Math.sin(angle) * radius - 5;
            const size = 8 + Math.random() * 20 * heightMult;
            const flame = new Flame(x, y, size);
            flame.life = 0.3 + Math.random() * 0.7;
            flame.opacity = 0.3 + Math.random() * 0.5;
            flames.push(flame);
          }

          // Spawn embers
          if (Math.random() < 0.1 * intensity) {
            const x = cx + (Math.random() - 0.5) * 30;
            const y = cy - 10;
            embers.push(new Ember(x, y));
          }

          // Update
          flames = flames.filter(f => f.isAlive());
          flames.forEach(f => f.update(wind, intensity, heightMult));
          embers = embers.filter(e => e.update(wind));
        }

        // Draw flames (sorted by size for depth)
        const sortedFlames = [...flames].sort((a, b) => a.size - b.size);
        sortedFlames.forEach(f => f.draw(ctx));

        // Draw embers
        embers.forEach(e => e.draw(ctx));

        // Update status
        flameCount.textContent = `✦ ${flames.length} flames`;
        if (isBurning && flames.length > 0) {
          fireStatus.textContent = '🔥 Burning';
        }
      }

      // ----- Animation loop -----
      function animate() {
        time += 0.016;
        draw();
        animationId = requestAnimationFrame(animate);
      }

      // ----- Start animation -----
      function startAnimation() {
        if (animationId) {
          cancelAnimationFrame(animationId);
        }
        animate();
      }

      // ----- Event Listeners -----
      addBtn.addEventListener('click', addLog);
      clearBtn.addEventListener('click', toggleFire);
      toggleBtn.addEventListener('click', togglePause);
      resetBtn.addEventListener('click', resetFire);

      intensitySlider.addEventListener('input', (e) => {
        intensityValue.textContent = e.target.value + '%';
        if (isBurning) {
          generateFire();
        }
      });

      windSlider.addEventListener('input', (e) => {
        windValue.textContent = e.target.value + '%';
      });

      heightSlider.addEventListener('input', (e) => {
        heightValue.textContent = e.target.value + '%';
        if (isBurning) {
          generateFire();
        }
      });

      // Keyboard shortcuts
      document.addEventListener('keydown', (e) => {
        if (e.key === 'l' || e.key === 'L') {
          e.preventDefault();
          addLog();
        }
        if (e.key === 'e' || e.key === 'E') {
          e.preventDefault();
          toggleFire();
        }
        if (e.key === ' ' || e.key === 'Space') {
          e.preventDefault();
          togglePause();
        }
        if (e.key === 'r' || e.key === 'R') {
          e.preventDefault();
          resetFire();
        }
      });

      // Click canvas to add log
      canvas.addEventListener('click', addLog);

      // ----- Resize handler -----
      let resizeTimeout;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(() => {
          setupCanvas();
          if (isBurning) {
            generateFire();
          }
        }, 200);
      });

      // ----- Init -----
      function init() {
        setupCanvas();
        generateFire();
        startAnimation();
        status.textContent = '🔥 Campfire crackling and flickering warmly!';
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }

    })();
  </script>
</body>
</html>
