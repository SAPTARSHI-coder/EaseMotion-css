<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <meta
    name="description"
    content="Accessible CSS-only meeting time slot picker"
  >
  <title>CSS Meeting Time Slots</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="scheduler" aria-labelledby="scheduler-title">

    <header class="scheduler__header">
      <div>
        <span class="scheduler__eyebrow">SCHEDULE A MEETING</span>
        <h1 id="scheduler-title">Choose a time</h1>
        <p>
          Select a date and an available time slot that works for you.
        </p>
      </div>

      <div class="timezone" aria-label="Current timezone">
        <span aria-hidden="true">◷</span>
        <span>IST · UTC+5:30</span>
      </div>
    </header>

    <!-- Date selection -->
    <section class="date-picker" aria-labelledby="date-heading">

      <div class="section-heading">
        <h2 id="date-heading">Select a date</h2>
        <span>August 2026</span>
      </div>

      <div class="dates" role="radiogroup" aria-label="Available dates">

        <div class="date-option">
          <input
            type="radio"
            name="date"
            id="date-10"
            checked
          >
          <label for="date-10">
            <span class="date-option__day">MON</span>
            <strong>10</strong>
            <span class="date-option__month">AUG</span>
          </label>
        </div>

        <div class="date-option">
          <input type="radio" name="date" id="date-11">
          <label for="date-11">
            <span class="date-option__day">TUE</span>
            <strong>11</strong>
            <span class="date-option__month">AUG</span>
          </label>
        </div>

        <div class="date-option">
          <input type="radio" name="date" id="date-12">
          <label for="date-12">
            <span class="date-option__day">WED</span>
            <strong>12</strong>
            <span class="date-option__month">AUG</span>
          </label>
        </div>

        <div class="date-option">
          <input type="radio" name="date" id="date-13">
          <label for="date-13">
            <span class="date-option__day">THU</span>
            <strong>13</strong>
            <span class="date-option__month">AUG</span>
          </label>
        </div>

        <div class="date-option">
          <input type="radio" name="date" id="date-14">
          <label for="date-14">
            <span class="date-option__day">FRI</span>
            <strong>14</strong>
            <span class="date-option__month">AUG</span>
          </label>
        </div>

      </div>
    </section>

    <!-- Time slots -->
    <section class="time-picker" aria-labelledby="time-heading">

      <div class="section-heading">
        <h2 id="time-heading">Available time slots</h2>
        <span>30 min meeting</span>
      </div>

      <!-- Morning -->
      <fieldset class="slot-group">
        <legend>
          <span aria-hidden="true">☀</span>
          Morning
        </legend>

        <div class="slot-grid">

          <div class="slot">
            <input
              type="radio"
              name="time"
              id="time-0900"
            >
            <label for="time-0900">
              <span>09:00 AM</span>
              <small>Available</small>
            </label>
          </div>

          <div class="slot">
            <input
              type="radio"
              name="time"
              id="time-0930"
            >
            <label for="time-0930">
              <span>09:30 AM</span>
              <small>Available</small>
            </label>
          </div>

          <div class="slot slot--disabled">
            <input
              type="radio"
              name="time"
              id="time-1000"
              disabled
            >
            <label for="time-1000">
              <span>10:00 AM</span>
              <small>Booked</small>
            </label>
          </div>

          <div class="slot">
            <input
              type="radio"
              name="time"
              id="time-1030"
            >
            <label for="time-1030">
              <span>10:30 AM</span>
              <small>Available</small>
            </label>
          </div>

          <div class="slot">
            <input
              type="radio"
              name="time"
              id="time-1100"
            >
            <label for="time-1100">
              <span>11:00 AM</span>
              <small>Available</small>
            </label>
          </div>

        </div>
      </fieldset>

      <!-- Afternoon -->
      <fieldset class="slot-group">
        <legend>
          <span aria-hidden="true">◐</span>
          Afternoon
        </legend>

        <div class="slot-grid">

          <div class="slot">
            <input
              type="radio"
              name="time"
              id="time-1200"
            >
            <label for="time-1200">
              <span>12:00 PM</span>
              <small>Available</small>
            </label>
          </div>

          <div class="slot">
            <input
              type="radio"
              name="time"
              id="time-1230"
            >
            <label for="time-1230">
              <span>12:30 PM</span>
              <small>Available</small>
            </label>
          </div>

          <div class="slot slot--disabled">
            <input
              type="radio"
              name="time"
              id="time-0100"
              disabled
            >
            <label for="time-0100">
              <span>01:00 PM</span>
              <small>Booked</small>
            </label>
          </div>

          <div class="slot">
            <input
              type="radio"
              name="time"
              id="time-0130"
            >
            <label for="time-0130">
              <span>01:30 PM</span>
              <small>Available</small>
            </label>
          </div>

          <div class="slot">
            <input
              type="radio"
              name="time"
              id="time-0200"
            >
            <label for="time-0200">
              <span>02:00 PM</span>
              <small>Available</small>
            </label>
          </div>

          <div class="slot">
            <input
              type="radio"
              name="time"
              id="time-0230"
            >
            <label for="time-0230">
              <span>02:30 PM</span>
              <small>Available</small>
            </label>
          </div>

        </div>
      </fieldset>

      <!-- Evening -->
      <fieldset class="slot-group">
        <legend>
          <span aria-hidden="true">☾</span>
          Evening
        </legend>

        <div class="slot-grid">

          <div class="slot">
            <input
              type="radio"
              name="time"
              id="time-0500"
            >
            <label for="time-0500">
              <span>05:00 PM</span>
              <small>Available</small>
            </label>
          </div>

          <div class="slot">
            <input
              type="radio"
              name="time"
              id="time-0530"
            >
            <label for="time-0530">
              <span>05:30 PM</span>
              <small>Available</small>
            </label>
          </div>

          <div class="slot">
            <input
              type="radio"
              name="time"
              id="time-0600"
            >
            <label for="time-0600">
              <span>06:00 PM</span>
              <small>Available</small>
            </label>
          </div>

          <div class="slot slot--disabled">
            <input
              type="radio"
              name="time"
              id="time-0630"
              disabled
            >
            <label for="time-0630">
              <span>06:30 PM</span>
              <small>Booked</small>
            </label>
          </div>

        </div>
      </fieldset>

    </section>

    <!-- Summary -->
    <aside class="booking-summary" aria-label="Booking summary">

      <div class="summary-icon" aria-hidden="true">✓</div>

      <div class="summary-content">
        <span class="summary-label">SELECTED SLOT</span>
        <strong>Monday, August 10 · 09:00 AM</strong>
        <small>30 minutes · IST (UTC+5:30)</small>
      </div>

      <button type="button" class="confirm-button">
        Confirm time
        <span aria-hidden="true">→</span>
      </button>

    </aside>

  </main>

</body>
</html>
