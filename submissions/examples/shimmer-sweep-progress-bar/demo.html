<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        Shimmer-Sweep Progress Bar | EaseMotion CSS
    </title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<main class="container">


<section class="hero">

    <span class="badge">
        EaseMotion CSS
    </span>


    <h1>
        CSS Shimmer-Sweep Progress Bar
    </h1>


    <p>
        A pure CSS animated progress bar
        featuring smooth shimmer sweep effects
        for responsive dashboard layouts.
    </p>

</section>




<section class="dashboard" aria-label="Progress Dashboard">


    <article class="progress-card">


        <h2>
            UI Development
        </h2>


        <div class="progress-track">


            <div class="progress-fill first">

                <span>
                    85%
                </span>

            </div>


        </div>


    </article>





    <article class="progress-card">


        <h2>
            Backend Systems
        </h2>


        <div class="progress-track">


            <div class="progress-fill second">

                <span>
                    70%
                </span>

            </div>


        </div>


    </article>





    <article class="progress-card">


        <h2>
            Machine Learning
        </h2>


        <div class="progress-track">


            <div class="progress-fill third">

                <span>
                    92%
                </span>

            </div>


        </div>


    </article>



</section>


</main>


</body>

</html>
