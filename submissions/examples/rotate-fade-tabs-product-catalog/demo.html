<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rotate Fade Tabs - Product Catalog</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="catalog">
        <section class="header">
            <h1>Product Catalog</h1>
            <p>Explore categories with smooth rotate-fade tab animations</p>
        </section>

        <section class="tabs-container">

            <input type="radio" name="tab" id="tab1" checked>
            <input type="radio" name="tab" id="tab2">
            <input type="radio" name="tab" id="tab3">

            <nav class="tabs">
                <label for="tab1">Electronics</label>
                <label for="tab2">Fashion</label>
                <label for="tab3">Accessories</label>
            </nav>


            <div class="content">

                <article class="tab-content electronics">
                    <div class="product-card">
                        <span>01</span>
                        <h2>Smart Laptop</h2>
                        <p>
                            High performance laptop designed for modern creators.
                        </p>
                        <button>View Product</button>
                    </div>
                </article>


                <article class="tab-content fashion">
                    <div class="product-card">
                        <span>02</span>
                        <h2>Premium Jacket</h2>
                        <p>
                            Stylish and comfortable fashion collection.
                        </p>
                        <button>View Product</button>
                    </div>
                </article>


                <article class="tab-content accessories">
                    <div class="product-card">
                        <span>03</span>
                        <h2>Smart Watch</h2>
                        <p>
                            Track your lifestyle with advanced accessories.
                        </p>
                        <button>View Product</button>
                    </div>
                </article>

            </div>

        </section>

    </main>

</body>
</html>
