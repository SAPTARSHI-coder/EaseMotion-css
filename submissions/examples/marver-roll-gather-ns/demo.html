<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marver Roll Gather — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Marver Roll Gather demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Marver Roll Gather</h1>
      <p class="lede">Marver roll shaping a gather against the steel plate</p>
    </header>

    <section class="ease-marver-roll-gather" data-demo="marver-roll-gather" aria-live="polite">
      <div class="ease-marver-roll-gather__housing">
        <div class="ease-marver-roll-gather__bezel">
          <div class="ease-marver-roll-gather__face">
            <div class="ease-marver-roll-gather__readout">
              <span class="ease-marver-roll-gather__label">Marver Roll Gather</span>
              <span class="ease-marver-roll-gather__value">LIVE</span>
            </div>
            <div class="ease-marver-roll-gather__motion" aria-hidden="true">
              <span class="ease-marver-roll-gather__a"></span>
              <span class="ease-marver-roll-gather__b"></span>
              <span class="ease-marver-roll-gather__c"></span>
              <span class="ease-marver-roll-gather__d"></span>
            </div>
            <div class="ease-marver-roll-gather__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-marver-roll-gather__controls">
          <button type="button" class="ease-marver-roll-gather__btn primary">Roll</button>
          <button type="button" class="ease-marver-roll-gather__btn">Lift</button>
          <label class="ease-marver-roll-gather__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-marver-roll-gather__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
