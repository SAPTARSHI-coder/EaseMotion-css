<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Neumorphic particle burst action button">
    <title>Particle Burst Action Button</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="page">
        <section class="hero">
            <span class="eyebrow">EASEMOTION COMPONENT</span>

            <h1>Particle Burst CTA</h1>

            <p class="description">
                A neumorphic call-to-action button with an interactive
                particle burst effect.
            </p>

            <div class="cta-wrapper">
                <button class="burst-button" id="burstButton" type="button">
                    <span class="button-icon" aria-hidden="true">✦</span>
                    <span>Get Started</span>
                </button>

                <div
                    class="particle-container"
                    id="particleContainer"
                    aria-hidden="true"
                ></div>
            </div>

            <p class="hint">Click the button to trigger the burst</p>
        </section>
    </main>

    <script>
        const button = document.getElementById("burstButton");
        const container = document.getElementById("particleContainer");

        button.addEventListener("click", () => {
            createBurst();

            button.classList.remove("clicked");

            void button.offsetWidth;

            button.classList.add("clicked");
        });

        function createBurst() {
            const particleCount = 28;

            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement("span");

                particle.className = "particle";

                const angle = (360 / particleCount) * i;
                const distance = 75 + Math.random() * 55;

                const x = Math.cos(angle * Math.PI / 180) * distance;
                const y = Math.sin(angle * Math.PI / 180) * distance;

                particle.style.setProperty("--x", `${x}px`);
                particle.style.setProperty("--y", `${y}px`);
                particle.style.setProperty(
                    "--delay",
                    `${Math.random() * 80}ms`
                );

                container.appendChild(particle);

                particle.addEventListener("animationend", () => {
                    particle.remove();
                });
            }
        }
    </script>

</body>
</html>
