<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Audio Player Showcase</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body class="audio-showcase-container">
  <main class="audio-player-card">
    <div class="audio-cover-wrapper">
      <div class="audio-cover-art" aria-label="Cover Art Spinning Indicator"></div>
    </div>
    <div class="audio-track-info">
      <h2 class="audio-track-title">Cybernetic Echoes</h2>
      <p class="audio-track-artist">Neon Horizon</p>
    </div>
    <div class="audio-progress-area">
      <div class="audio-progress-bar" role="slider" aria-valuenow="65" aria-valuemin="0" aria-valuemax="100">
        <div class="audio-progress-fill"></div>
      </div>
    </div>
    <div class="audio-controls-row">
      <button class="audio-btn" aria-label="Previous Track">
        &laquo;
      </button>
      <button class="audio-btn audio-btn-play" aria-label="Play Track">
        &#9658;
      </button>
      <button class="audio-btn" aria-label="Next Track">
        &raquo;
      </button>
    </div>
  </main>
</body>
</html>
