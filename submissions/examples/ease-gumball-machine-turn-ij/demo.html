<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-gumball-machine-turn demo</title>
</head>
<body>
<div class="gb-app">
  <div class="gb-machine">
    <div class="gb-cap"></div>
    <div class="gb-globe">
      <span class="gb-ball gb-ball-1"></span>
      <span class="gb-ball gb-ball-2"></span>
      <span class="gb-ball gb-ball-3"></span>
      <span class="gb-ball gb-ball-4"></span>
    </div>
    <div class="gb-crank">
      <div class="gb-knob"></div>
    </div>
    <div class="gb-collar"></div>
    <div class="gb-pedestal"></div>
    <div class="gb-slot"></div>
    <div class="gb-chute">
      <span class="gb-drop"></span>
    </div>
    <div class="gb-foot"></div>
  </div>
</div>
</body>
</html>
