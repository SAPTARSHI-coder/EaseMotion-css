<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glassmorphism Avatar Stack Group Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Glassmorphism Avatar Stack Group</h1>
    <p>An accessible, keyboard-navigable overlapping avatar stack with glassmorphism design effects.</p>

    <h2>Basic Stack</h2>
    <div 
      class="avatar-stack" 
      role="group" 
      aria-label="Project contributors"
      data-avatar-stack
    >
      <ul class="avatar-stack__list" role="list">
        <li class="avatar-stack__item">
          <a href="#profile-alex" class="avatar-stack__link" aria-label="Alex Morgan, Lead Designer">
            <img class="avatar-stack__img" src="https://i.pravatar.cc/150?img=1" alt="" width="48" height="48">
            <span class="avatar-stack__tooltip" role="tooltip">Alex Morgan (Lead Designer)</span>
          </a>
        </li>
        <li class="avatar-stack__item">
          <a href="#profile-sam" class="avatar-stack__link" aria-label="Sam Taylor, Frontend Developer">
            <img class="avatar-stack__img" src="https://i.pravatar.cc/150?img=2" alt="" width="48" height="48">
            <span class="avatar-stack__tooltip" role="tooltip">Sam Taylor (Frontend)</span>
          </a>
        </li>
        <li class="avatar-stack__item">
          <a href="#profile-jordan" class="avatar-stack__link" aria-label="Jordan Lee, Product Manager">
            <img class="avatar-stack__img" src="https://i.pravatar.cc/150?img=3" alt="" width="48" height="48">
            <span class="avatar-stack__tooltip" role="tooltip">Jordan Lee (PM)</span>
          </a>
        </li>
        <li class="avatar-stack__item">
          <button type="button" class="avatar-stack__link avatar-stack__overflow" aria-label="View 5 more contributors">
            <span class="avatar-stack__overflow-text">+5</span>
            <span class="avatar-stack__tooltip" role="tooltip">View 5 more contributors</span>
          </button>
        </li>
      </ul>
    </div>

    <h2>Large Stack Variant (Modifier Class)</h2>
    <div 
      class="avatar-stack avatar-stack--lg" 
      role="group" 
      aria-label="Active team members"
      data-avatar-stack
    >
      <ul class="avatar-stack__list" role="list">
        <li class="avatar-stack__item">
          <a href="#profile-dev1" class="avatar-stack__link" aria-label="Dev One">
            <img class="avatar-stack__img" src="https://i.pravatar.cc/150?img=4" alt="" width="60" height="60">
            <span class="avatar-stack__tooltip" role="tooltip">Dev One</span>
          </a>
        </li>
        <li class="avatar-stack__item">
          <a href="#profile-dev2" class="avatar-stack__link" aria-label="Dev Two">
            <img class="avatar-stack__img" src="https://i.pravatar.cc/150?img=5" alt="" width="60" height="60">
            <span class="avatar-stack__tooltip" role="tooltip">Dev Two</span>
          </a>
        </li>
      </ul>
    </div>
  </main>

  <script>
    // Keyboard navigation script for roaming tabindex / focus management
    document.querySelectorAll('[data-avatar-stack]').forEach(stack => {
      const links = Array.from(stack.querySelectorAll('.avatar-stack__link'));

      links.forEach((link, index) => {
        link.addEventListener('keydown', (e) => {
          let targetIndex = null;

          if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
            e.preventDefault();
            targetIndex = (index + 1) % links.length;
          } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
            e.preventDefault();
            targetIndex = (index - 1 + links.length) % links.length;
          } else if (e.key === 'Home') {
            e.preventDefault();
            targetIndex = 0;
          } else if (e.key === 'End') {
            e.preventDefault();
            targetIndex = links.length - 1;
          }

          if (targetIndex !== null) {
            links[targetIndex].focus();
          }
        });
      });
    });
  </script>
</body>
</html>
