<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Step Wizard Progress | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="demo-header">
    <h1>Step Wizard Progress</h1>
    <p>Animated multi-step progress indicator with active step pulse rings.</p>
  </header>

  <main class="demo-main">
    <section class="demo-section">
      <div class="ease-wizard-bar">
        <div class="ease-wizard-step ease-wizard-complete">
          <div class="ease-wizard-node">&#10003;</div>
          <span class="ease-wizard-label">Account</span>
        </div>
        <div class="ease-wizard-line ease-line-filled"></div>
        <div class="ease-wizard-step ease-wizard-active">
          <div class="ease-wizard-node">2</div>
          <span class="ease-wizard-label">Profile</span>
        </div>
        <div class="ease-wizard-line"></div>
        <div class="ease-wizard-step">
          <div class="ease-wizard-node">3</div>
          <span class="ease-wizard-label">Billing</span>
        </div>
        <div class="ease-wizard-line"></div>
        <div class="ease-wizard-step">
          <div class="ease-wizard-node">4</div>
          <span class="ease-wizard-label">Review</span>
        </div>
      </div>
    </section>
  </main>

  <footer class="demo-footer"><p>EaseMotion CSS Project</p></footer>
</body>
</html>
