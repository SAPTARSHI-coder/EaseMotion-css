<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Volumetric Glass Sidebar | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="vgswrap">
    <div class="vgsbg"></div>
    <nav class="vgssidebar">
      <div class="vgshead">Main</div>
      <a class="vgsitem active"><span class="vgsitem-icon">D</span>Dashboard</a>
      <a class="vgsitem"><span class="vgsitem-icon green">P</span>Projects <span class="vgsitem-badge">3</span></a>
      <a class="vgsitem"><span class="vgsitem-icon pink">T</span>Tasks</a>
      <a class="vgsitem"><span class="vgsitem-icon amber">R</span>Reports</a>
      <div class="vgshead">Settings</div>
      <a class="vgsitem"><span class="vgsitem-icon">A</span>Account</a>
      <a class="vgsitem"><span class="vgsitem-icon green">B</span>Billing</a>
    </nav>
  </div>
</body>
</html>
