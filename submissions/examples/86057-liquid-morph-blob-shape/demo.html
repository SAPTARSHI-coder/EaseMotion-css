<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liquid Morph Blob Shape</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="demo">
    <h1>Liquid Morph Blob Shape</h1>

    <p class="description">
      A fluid blob animation that continuously morphs between organic shapes.
    </p>

    <section class="blob-stage">
      <div class="blob-wrapper">
        <div
          class="liquid-blob ease-anim-liquid-morph-blob-shape"
          aria-label="Animated liquid morph blob"
        >
          <div class="blob-content">
            <span class="blob-icon">✦</span>
            <h2>Liquid</h2>
            <p>Morphing Shape</p>
          </div>
        </div>
      </div>
    </section>

    <p class="hint">
      Powered by CSS border-radius and compositor-friendly transforms.
    </p>
  </main>
</body>
</html>
