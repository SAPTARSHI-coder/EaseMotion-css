<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="CSS-only SVG stroke drawing animation"
  >

  <title>SVG Stroke Drawing Animation</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="page">

    <section
      class="animation-card"
      aria-labelledby="animation-title"
    >

      <header class="content">

        <p class="eyebrow">
          EaseMotion CSS
        </p>

        <h1 id="animation-title">
          SVG Stroke Drawing
        </h1>

        <p class="description">
          A CSS-only SVG illustration that progressively draws
          itself using stroke animations.
        </p>

      </header>


      <div class="illustration-wrapper">

        <svg
          class="landscape"
          viewBox="0 0 800 500"
          role="img"
          aria-labelledby="svg-title svg-description"
        >

          <title id="svg-title">
            Animated mountain landscape
          </title>

          <desc id="svg-description">
            A mountain landscape with a sun, mountains, trees,
            plants and foreground details progressively drawn
            using CSS stroke animations.
          </desc>


          <!-- =========================
               SUN
          ========================== -->

          <circle
            class="draw-path sun"
            pathLength="1"
            cx="640"
            cy="115"
            r="52"
          />


          <!-- =========================
               SUN RAYS
          ========================== -->

          <g class="sun-rays">

            <path
              class="draw-path ray ray-1"
              pathLength="1"
              d="M640 45V18"
            />

            <path
              class="draw-path ray ray-2"
              pathLength="1"
              d="M640 185V212"
            />

            <path
              class="draw-path ray ray-3"
              pathLength="1"
              d="M570 115H543"
            />

            <path
              class="draw-path ray ray-4"
              pathLength="1"
              d="M710 115H737"
            />

            <path
              class="draw-path ray ray-5"
              pathLength="1"
              d="M590 65L571 46"
            />

            <path
              class="draw-path ray ray-6"
              pathLength="1"
              d="M690 165L709 184"
            />

            <path
              class="draw-path ray ray-7"
              pathLength="1"
              d="M690 65L709 46"
            />

            <path
              class="draw-path ray ray-8"
              pathLength="1"
              d="M590 165L571 184"
            />

          </g>


          <!-- =========================
               BACK MOUNTAIN
          ========================== -->

          <path
            class="draw-path mountain back-mountain"
            pathLength="1"
            d="M70 385
               L220 205
               L310 305
               L390 215
               L530 385"
          />


          <!-- =========================
               FRONT MOUNTAIN
          ========================== -->

          <path
            class="draw-path mountain front-mountain"
            pathLength="1"
            d="M185 385
               L350 165
               L520 385"
          />


          <!-- =========================
               SNOW CAP
          ========================== -->

          <path
            class="draw-path snow"
            pathLength="1"
            d="M310 220
               L350 165
               L392 220
               L368 207
               L350 232
               L333 207"
          />


          <!-- =========================
               MOUNTAIN RIDGE
          ========================== -->

          <path
            class="draw-path ridge"
            pathLength="1"
            d="M70 385
               L145 330
               L190 350
               L250 300
               L310 345
               L365 305
               L425 350
               L475 315
               L530 385"
          />


          <!-- =========================
               GROUND
          ========================== -->

          <path
            class="draw-path ground"
            pathLength="1"
            d="M55 385H745"
          />


          <!-- =========================
               LEFT TREE
          ========================== -->

          <g class="tree left-tree">

            <path
              class="draw-path tree-trunk"
              pathLength="1"
              d="M120 385V320"
            />

            <path
              class="draw-path tree-crown"
              pathLength="1"
              d="M120 255
                 L82 320
                 H102
                 L72 350
                 H105
                 L80 375
                 H160
                 L135 350
                 H168
                 L138 320
                 H158
                 L120 255Z"
            />

          </g>


          <!-- =========================
               RIGHT TREE
          ========================== -->

          <g class="tree right-tree">

            <path
              class="draw-path tree-trunk"
              pathLength="1"
              d="M665 385V315"
            />

            <path
              class="draw-path tree-crown"
              pathLength="1"
              d="M665 250
                 L625 315
                 H646
                 L615 345
                 H650
                 L625 375
                 H705
                 L680 345
                 H715
                 L684 315
                 H705
                 L665 250Z"
            />

          </g>


          <!-- =========================
               FOREGROUND PLANTS
          ========================== -->

          <path
            class="draw-path plant plant-one"
            pathLength="1"
            d="M240 385
               C235 365 230 355 218 345
               M240 385
               C244 365 251 355 263 348"
          />

          <path
            class="draw-path plant plant-two"
            pathLength="1"
            d="M565 385
               C560 365 553 355 542 347
               M565 385
               C570 365 578 355 589 349"
          />


          <!-- =========================
               FOREGROUND
          ========================== -->

          <path
            class="draw-path foreground"
            pathLength="1"
            d="M55 405
               C180 385 260 425 390 405
               C520 385 610 425 745 400"
          />

        </svg>

      </div>

    </section>

  </main>

</body>
</html>
