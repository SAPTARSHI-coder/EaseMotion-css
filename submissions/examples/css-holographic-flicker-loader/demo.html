<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Accessible CSS-only holographic flicker loader."
  >

  <title>Holographic Flicker Loader</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="page">
    <section class="loader-card" aria-label="Loading content">

      <div
        class="holo-loader"
        role="status"
        aria-label="Loading"
      >
        <div class="holo-core">
          <span class="holo-shine"></span>
          <span class="holo-glow"></span>
        </div>

        <span class="scan-line"></span>
      </div>

      <p class="loader-label" aria-hidden="true">
        Loading...
      </p>

    </section>
  </main>
</body>
</html>
