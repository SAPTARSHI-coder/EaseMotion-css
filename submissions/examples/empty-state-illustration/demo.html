<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="CSS Empty State Illustration component demo"
  >
  <title>CSS Empty State Illustration</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="demo-container">
    <section
      class="empty-state"
      aria-labelledby="empty-state-title"
      aria-describedby="empty-state-description"
    >
      <div class="empty-state__illustration" aria-hidden="true">
        <div class="empty-state__circle">
          <span class="empty-state__icon">⌕</span>
        </div>
      </div>

      <h1 id="empty-state-title" class="empty-state__title">
        Nothing here yet
      </h1>

      <p id="empty-state-description" class="empty-state__description">
        We couldn't find anything to display right now.
        Try adding a new item to get started.
      </p>

      <a class="empty-state__button" href="#add-item">
        Add New Item
      </a>
    </section>
  </main>

</body>
</html>
