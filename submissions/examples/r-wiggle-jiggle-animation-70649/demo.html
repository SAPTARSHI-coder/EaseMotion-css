<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Pure CSS wiggle jiggle animation demonstration"
  >
  <title>CSS Wiggle Jiggle Animation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section class="demo" aria-labelledby="title">
      <div class="badge">EaseMotion CSS</div>

      <h1 id="title">Wiggle &amp; Jiggle</h1>

      <p class="intro">
        A playful CSS-only animation that gives interface elements
        a gentle continuous wiggle and jiggle.
      </p>

      <div class="showcase">
        <article class="wiggle-card" tabindex="0">
          <div class="icon" aria-hidden="true">✦</div>

          <div class="content">
            <span class="label">Playful Motion</span>
            <h2>Keep things moving</h2>
            <p>
              Hover or focus this card to see the playful wiggle effect.
            </p>
          </div>

          <span class="arrow" aria-hidden="true">→</span>
        </article>

        <button class="wiggle-button" type="button">
          <span aria-hidden="true">✦</span>
          Wiggle Me
        </button>
      </div>

      <p class="hint">
        Hover or use keyboard focus to interact
      </p>
    </section>
  </main>
</body>
</html>
