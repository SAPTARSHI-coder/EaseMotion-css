<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        CSS 3D Flip Modal - Gaming Hub Layouts
    </title>

    <link rel="stylesheet" href="style.css">
</head>


<body>


<main class="gaming-hub">


    <header class="hero">

        <h1>
            CSS 3D Flip Modal
        </h1>

        <p>
            Pure CSS animated modal with a smooth
            3D flip interaction for gaming interfaces.
        </p>

    </header>




    <section class="modal-container">


        <input 
        type="checkbox" 
        id="modal-toggle"
        class="modal-toggle">


        <label 
        for="modal-toggle"
        class="open-button">
            Open Game Modal
        </label>




        <div class="modal-overlay">


            <div class="modal-box"
            role="dialog"
            aria-label="Gaming modal">


                <div class="modal-front">


                    <div class="game-icon">
                        🎮
                    </div>


                    <h2>
                        Battle Arena
                    </h2>


                    <p>
                        Enter the gaming universe
                        and explore new challenges.
                    </p>


                    <label 
                    for="modal-toggle"
                    class="action-btn">
                        Continue
                    </label>


                </div>




                <div class="modal-back">


                    <h2>
                        Ready Player?
                    </h2>


                    <p>
                        Your adventure begins now.
                        Prepare for the next mission.
                    </p>


                    <label 
                    for="modal-toggle"
                    class="close-btn">
                        Close
                    </label>


                </div>


            </div>


        </div>


    </section>


</main>


</body>

</html>
