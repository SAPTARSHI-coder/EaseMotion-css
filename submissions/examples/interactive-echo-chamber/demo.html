<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Interactive Echo Chamber with visual ripples and reflected echoes."
  >

  <title>Echo Chamber</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="page">
    <header class="page-header">
      <p class="eyebrow">EaseMotion CSS</p>

      <h1>Echo Chamber</h1>

      <p>
        Create soundless visual echoes with clicks, pointer interactions,
        and the spacebar.
      </p>
    </header>

    <section class="controls" aria-label="Echo controls">
      <div class="counter">
        <span class="counter-label">Active echoes</span>
        <strong id="echo-count" aria-live="polite">0</strong>
      </div>

      <label class="strength-control" for="echo-strength">
        <span>Echo strength</span>

        <input
          id="echo-strength"
          type="range"
          min="0.5"
          max="2"
          step="0.1"
          value="1"
          aria-label="Echo strength"
        >

        <output id="strength-value" for="echo-strength">
          1.0×
        </output>
      </label>

      <button
        class="clear-button"
        id="clear-echoes"
        type="button"
      >
        Clear echoes
      </button>
    </section>

    <section
      class="echo-chamber"
      id="echo-chamber"
      tabindex="0"
      aria-label="Interactive echo chamber. Click or press Space to create an echo."
    >
      <div class="chamber-grid" aria-hidden="true"></div>

      <div class="chamber-center" aria-hidden="true">
        <span class="center-icon">◉</span>
        <span>CREATE ECHO</span>
      </div>

      <div
        class="echo-layer"
        id="echo-layer"
        aria-hidden="true"
      ></div>

      <span class="instruction">
        Click anywhere · Press Space
      </span>
    </section>

    <p class="status" id="interaction-status" aria-live="polite">
      The chamber is waiting for an interaction.
    </p>
  </main>

  <script src="script.js"></script>
</body>
</html>
