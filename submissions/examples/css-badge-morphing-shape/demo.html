<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Badge: Morphing Shape Variation - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="em-demo-container">
        <!-- Pure CSS Morphing Shape Badge Component Showcase -->
        <header class="em-badge-card" role="region" aria-label="Morphing Shape Badge Showcase" tabindex="0">
            <div class="em-badge-header-bar">
                <span class="em-card-badge">BADGES & CHIPS</span>
                <span class="em-brand-logo">MorphMotion</span>
            </div>
            <h1 class="em-card-title">Morphing Shape Badge</h1>
            <p class="em-card-desc">A smooth, accessible, and performant pure CSS badge featuring continuous border-radius morphing keyframes and frosted glassmorphism styling.</p>
            <div class="em-badge-wrapper">
                <div class="em-morphing-badge" aria-label="Status indicator">
                    <span class="em-badge-text">STATUS: ACTIVE</span>
                </div>
            </div>
        </header>
    </div>
</body>
</html>
