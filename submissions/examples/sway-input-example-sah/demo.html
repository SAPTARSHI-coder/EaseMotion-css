<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sway Input Example - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="form-card">
    <h1>Sway Input Example (<code>#54667</code>)</h1>
    <p class="desc">Focus the input field to trigger a smooth pendulum swaying border animation and indicator bounce.</p>
    
    <div class="field">
      <label for="branch">Git Target Branch Name</label>
      <div class="ease-input-sway">
        <span class="icon">🌿</span>
        <input type="text" id="branch" placeholder="feat-54667-sway-input" />
      </div>
    </div>

    <div class="field" style="margin-top: 1.5rem;">
      <label for="commit">Commit Message Prefix</label>
      <div class="ease-input-sway">
        <span class="icon">⚡</span>
        <input type="text" id="commit" placeholder="feat: implement reactive sway input..." />
      </div>
    </div>
  </div>
</body>
</html>
