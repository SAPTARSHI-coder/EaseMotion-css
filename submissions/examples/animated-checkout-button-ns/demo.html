<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Animated Checkout Button | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="checkout-demo-container">
    <header class="checkout-demo-header">
      <h1>Animated Checkout Button</h1>
      <p>Interactive order confirmation button with animated cart transition driven purely by CSS.</p>
    </header>

    <div class="ease-checkout-wrapper">
      <!-- State Management Checkbox -->
      <input type="checkbox" id="checkout-toggle" class="ease-checkout__toggle" aria-label="Confirm Order">

      <!-- Interactive Button Label -->
      <label for="checkout-toggle" class="ease-checkout__btn" role="button" tabindex="0" aria-pressed="false" aria-label="Complete Checkout">
        
        <!-- Flying Cart Animation Graphic -->
        <span class="ease-checkout__cart-wrapper" aria-hidden="true">
          <svg class="ease-checkout__icon" viewBox="0 0 24 24">
            <path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/>
          </svg>
        </span>

        <!-- Initial State Label -->
        <span class="ease-checkout__text-default">
          <svg class="ease-checkout__icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M17 18c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm6 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/>
          </svg>
          Complete Order
        </span>

        <!-- Order Confirmed State Label -->
        <span class="ease-checkout__text-success">
          <svg class="ease-checkout__icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
          </svg>
          Order Confirmed!
        </span>

      </label>
    </div>
  </main>

</body>
</html>
