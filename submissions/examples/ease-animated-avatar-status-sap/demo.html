<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animated Avatar Status</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <h1>Animated Avatar Status</h1>

    <div class="avatar-row">
      <div class="avatar" role="img" aria-label="Alex, online">
        <span class="avatar-initials">AL</span>
        <span class="status-dot status-online"></span>
      </div>

      <div class="avatar" role="img" aria-label="Sam, away">
        <span class="avatar-initials">SM</span>
        <span class="status-dot status-away"></span>
      </div>

      <div class="avatar" role="img" aria-label="Jordan, offline">
        <span class="avatar-initials">JD</span>
        <span class="status-dot status-offline"></span>
      </div>
    </div>
  </main>
</body>
</html>
