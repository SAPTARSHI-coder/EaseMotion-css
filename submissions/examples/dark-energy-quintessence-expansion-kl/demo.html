<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Energy Quintessence Expansion - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #020408; color: #ffffff;">

    <div class="ease-card ease-card-glass quintessence-container">
        <div class="quintessence-header">
            <h2>Quintessence Field</h2>
            <span class="ease-badge ease-badge-info">Accelerating</span>
        </div>
        
        <div class="quintessence-screen ease-center">
            <div class="negative-pressure-flow flow-1"></div>
            <div class="negative-pressure-flow flow-2"></div>
            <div class="hubble-horizon-ring"></div>
            <div class="scalar-field-core ease-center"></div>
        </div>

        <div class="quintessence-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Equation of State: w = -1.04</span>
            <button class="ease-btn ease-btn-primary ease-btn-sm ease-hover-grow"> Measure Expansion</button>
        </div>
    </div>

</body>
</html>
