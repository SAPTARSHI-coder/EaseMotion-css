<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skew Active Progress Bar</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<section class="wrapper">

    <h1>Project Progress</h1>
    <p>SaaS Showcase Progress Component</p>

    <div class="progress-card">

        <div class="progress-header">
            <span>Development</span>
            <span>75%</span>
        </div>

        <div class="progress-track">
            <div class="progress-fill"></div>
        </div>

        <div class="steps">
            <div class="step active">
                <span>01</span>
                Planning
            </div>

            <div class="step active">
                <span>02</span>
                Design
            </div>

            <div class="step active">
                <span>03</span>
                Development
            </div>

            <div class="step">
                <span>04</span>
                Launch
            </div>
        </div>

    </div>

</section>

</body>
</html>
