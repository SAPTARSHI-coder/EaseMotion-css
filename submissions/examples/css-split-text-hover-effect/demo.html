<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Split-text Hover Effect - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="em-split-page">
        <div class="em-card" role="region" aria-label="Split-text Hover Effect Showcase">
            <span class="em-card-badge">TYPOGRAPHY HOVER</span>
            <h1 class="em-card-title">Split-Text Hover</h1>
            <p class="em-card-desc">Interactive split-text hover effect where halves slide apart to reveal background highlights, crafted entirely with pure CSS.</p>
            
            <!-- Split Text Container -->
            <div class="em-split-container" tabindex="0" role="button" aria-label="Split text hover target: EASEMOTION">
                <div class="em-split-text" data-text="EASEMOTION">
                    <span class="em-half em-top">EASEMOTION</span>
                    <span class="em-half em-bottom">EASEMOTION</span>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
