<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Sci-Fi HUD: Diamond Facet Edge</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <!-- The drop-shadow must be applied to a wrapper or the element itself. We'll apply it directly to the element. -->
  <button class="diamond-hud" aria-label="Engage Target Lock">
    
    <div class="facet-inner">
      <!-- Animated Targeting Brackets -->
      <div class="target-bracket bracket-tl" aria-hidden="true"></div>
      <div class="target-bracket bracket-tr" aria-hidden="true"></div>
      <div class="target-bracket bracket-bl" aria-hidden="true"></div>
      <div class="target-bracket bracket-br" aria-hidden="true"></div>

      <h2 class="hud-title">Target Lock</h2>
      <div class="hud-value">104<span class="hud-unit">.8</span></div>
    </div>

  </button>

</body>
</html>
