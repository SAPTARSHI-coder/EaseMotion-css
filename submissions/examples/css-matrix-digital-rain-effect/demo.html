<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrix Digital Rain</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="matrix">
        <span style="--delay: 1s; --duration: 3s; --offset: 10%">011001</span>
        <span style="--delay: 2s; --duration: 2.5s; --offset: 30%">101011</span>
        <span style="--delay: 0.5s; --duration: 4s; --offset: 50%">001100</span>
        <span style="--delay: 3s; --duration: 3.2s; --offset: 70%">110011</span>
        <span style="--delay: 1.5s; --duration: 2.8s; --offset: 90%">010101</span>
        <span style="--delay: 0.2s; --duration: 3.5s; --offset: 20%">100100</span>
        <span style="--delay: 2.5s; --duration: 3.1s; --offset: 40%">111000</span>
        <span style="--delay: 1.2s; --duration: 2.9s; --offset: 60%">000111</span>
        <span style="--delay: 3.5s; --duration: 3.8s; --offset: 80%">101101</span>
        <span style="--delay: 0.8s; --duration: 2.7s; --offset: 15%">011100</span>
    </div>
</body>
</html>
