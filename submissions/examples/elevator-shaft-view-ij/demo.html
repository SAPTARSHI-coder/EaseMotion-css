<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-elevator-shaft-view</title>
</head>
<body>
<main class="esv-card">
  <header class="esv-head">
    <h1 class="esv-title">Lift A</h1>
    <span class="esv-tag">Express</span>
  </header>
  <section class="esv-shaft" aria-label="elevator shaft">
    <span class="esv-rail esv-rail-l"></span>
    <span class="esv-rail esv-rail-r"></span>
    <span class="esv-car">
      <span class="esv-car-lamp"></span>
    </span>
    <span class="esv-floor esv-floor-1">1</span>
    <span class="esv-floor esv-floor-2">2</span>
    <span class="esv-floor esv-floor-3">3</span>
    <span class="esv-floor esv-floor-4">4</span>
    <span class="esv-floor esv-floor-5">5</span>
  </section>
  <section class="esv-panel" aria-label="call buttons">
    <span class="esv-btn esv-btn-up">UP</span>
    <span class="esv-btn esv-btn-down">DN</span>
    <strong class="esv-display">3</strong>
  </section>
  <footer class="esv-foot">
    <span class="esv-stat">Moving</span>
    <span class="esv-cap">Cap 8</span>
  </footer>
</main>
</body>
</html>
