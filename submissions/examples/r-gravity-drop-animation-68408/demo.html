<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Pure CSS gravity drop animation with a natural bounce landing effect."
  >
  <title>CSS Gravity Drop Animation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="gravity-page">
    <section class="gravity-demo" aria-labelledby="gravity-title">
      <span class="eyebrow">EaseMotion CSS</span>

      <h1 id="gravity-title">Gravity Drop</h1>

      <p class="intro">
        Elements drop into place with a natural gravity-inspired bounce.
      </p>

      <div class="gravity-stage" aria-label="Gravity drop animation showcase">
        <div class="drop-card drop-card--one">
          <span class="drop-icon" aria-hidden="true">✦</span>
          <h2>Explore</h2>
          <p>Drop into new ideas.</p>
        </div>

        <div class="drop-card drop-card--two">
          <span class="drop-icon" aria-hidden="true">◆</span>
          <h2>Create</h2>
          <p>Build something useful.</p>
        </div>

        <div class="drop-card drop-card--three">
          <span class="drop-icon" aria-hidden="true">●</span>
          <h2>Connect</h2>
          <p>Share your experience.</p>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
