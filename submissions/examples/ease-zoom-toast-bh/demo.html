<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ease-zoom-toast-bh</title>
  <link rel="stylesheet" href="style.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #f1f5f9; padding: 2rem; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1rem; }
    h1 { color: #f43f5e; margin-bottom: 1rem; }
  </style>
</head>
<body>
  <h1>ease-zoom-toast-bh</h1>
  
  <div class="ease-zoom-toast">
    <span class="ease-zoom-toast-icon">⚠️</span>
    <div class="ease-zoom-toast-content">
      <div class="ease-zoom-toast-title">Warning</div>
      <div class="ease-zoom-toast-message">Session expires soon</div>
    </div>
  </div>
  
  <div class="ease-zoom-toast">
    <span class="ease-zoom-toast-icon">❌</span>
    <div class="ease-zoom-toast-content">
      <div class="ease-zoom-toast-title">Error</div>
      <div class="ease-zoom-toast-message">Connection failed</div>
    </div>
  </div>
  
  <div class="ease-zoom-toast">
    <span class="ease-zoom-toast-icon">💀</span>
    <div class="ease-zoom-toast-content">
      <div class="ease-zoom-toast-title">Game Over</div>
      <div class="ease-zoom-toast-message">Better luck next time</div>
    </div>
  </div>
</body>
</html>
