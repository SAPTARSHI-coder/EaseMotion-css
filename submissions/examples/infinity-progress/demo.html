<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="A dependency-free Infinity Progress loading indicator built with HTML and CSS."
  >

  <title>Infinity Progress</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="demo">
    <section class="progress-card" aria-labelledby="title">
      <div class="heading">
        <p class="eyebrow">PROGRESS / INDETERMINATE</p>

        <h1 id="title">Infinity Progress</h1>

        <p class="description">
          An endless loading bar that sweeps and shrinks across an indeterminate track.
        </p>
      </div>

      <div class="progress-demo">
        <div
          class="progress-track"
          role="progressbar"
          aria-label="Loading"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuetext="Loading"
        >
          <span class="progress-runner"></span>
          <span class="progress-glow"></span>
        </div>

        <div class="progress-meta" aria-hidden="true">
          <span>PROCESSING</span>
          <span class="status">
            <i></i>
            ACTIVE
          </span>
        </div>
      </div>

      <div class="preview-controls" aria-label="Demo information">
        <span>PURE CSS</span>
        <span>INDETERMINATE</span>
        <span>NO JAVASCRIPT</span>
      </div>
    </section>
  </main>
</body>
</html>
