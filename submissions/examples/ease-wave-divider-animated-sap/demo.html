<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ease-wave-divider-animated-sap demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { height: 100vh; margin: 0; display: flex; align-items: center; justify-content: center; background: #f4f4f5; }
  </style>
</head>
<body>
  <div class="wave-divider-sap">
    <svg class="wave-back" viewBox="0 0 800 60" preserveAspectRatio="none">
      <path d="M0,30 C200,60 400,0 600,30 C700,45 750,20 800,30 L800,60 L0,60 Z" fill="#2563eb"/>
    </svg>
    <svg class="wave-front" viewBox="0 0 800 60" preserveAspectRatio="none">
      <path d="M0,30 C150,0 350,60 550,20 C650,0 750,40 800,20 L800,60 L0,60 Z" fill="#7c3aed"/>
    </svg>
  </div>
</body>
</html>
