<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ease-animated-slider-vertical-sap demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { height: 100vh; margin: 0; display: flex; align-items: center; justify-content: center; background: #f4f4f5; }
  </style>
</head>
<body>
  <div class="vslider-sap">
    <div class="vslide-track" id="track">
      <div class="vslide">Slide 1</div>
      <div class="vslide">Slide 2</div>
      <div class="vslide">Slide 3</div>
    </div>
    <div class="vslide-dots" id="dots">
      <span class="vdot active"></span>
      <span class="vdot"></span>
      <span class="vdot"></span>
    </div>
  </div>
  <script>
    const track = document.getElementById('track');
    const dots = [...document.querySelectorAll('.vdot')];
    dots.forEach((dot, i) => {
      dot.addEventListener('click', () => {
        track.style.transform = `translateY(-${i * 280}px)`;
        dots.forEach((d, di) => d.classList.toggle('active', di === i));
      });
    });
  </script>
</body>
</html>
