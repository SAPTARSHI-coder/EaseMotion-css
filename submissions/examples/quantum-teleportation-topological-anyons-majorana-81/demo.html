<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Topological Anyons Majorana - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css"></head><body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030712; color: #ffffff;">

    <div class="ease-card ease-card-glass majorana-container">
        <div class="majorana-header">
            <h2>Majorana Anyons</h2>
            <span class="ease-badge ease-badge-secondary">Braiding</span>
        </div>
        
        <div class="majorana-screen ease-center">
            <div class="majorana-flux flux-majorana-a"></div>
            <div class="majorana-flux flux-majorana-b"></div>
            <div class="majorana-boundary-ring"></div>
            <div class="majorana-core ease-center"></div>
        </div>

        <div class="majorana-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Non-Abelian Statistics &amp; Nanowires</span>
            <button class="ease-btn ease-btn-secondary ease-btn-sm ease-hover-grow">Run Majorana Braiding</button>
        </div>
    </div></body></html>
