<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Safari Banding Fix</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- The GPU-Accelerated Background -->
  <div class="ease-gradient-bg"></div>

  <!-- The Glassmorphic Content -->
  <div class="ease-glass-overlay">
    <h2>Safari Banding Fix</h2>
    <p>By isolating the background gradient onto its own hardware-accelerated CoreAnimation layer using <code>translate3d(0,0,0)</code>, we prevent WebKit's rendering engine from destructively downsampling the buffer when calculating the foreground <code>backdrop-filter: hue-rotate()</code>.</p>
  </div>
</body>
</html>
