
<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silicon Spin Qubits MOS Quantum Dots - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css"></head><body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030712; color: #ffffff;">

    <div class="ease-card ease-card-glass si-container">
        <div class="si-header">
            <h2>Silicon MOS Quantum Dots</h2>
            <span class="ease-badge ease-badge-success">CMOS Spin Qubits</span>
        </div>
        
        <div class="si-screen ease-center">
            <div class="si-flux flux-si-a"></div>
            <div class="si-flux flux-si-b"></div>
            <div class="si-boundary-ring"></div>
            <div class="si-core ease-center"></div>
        </div>

        <div class="si-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Microwave Gates &amp; Pauli Spin Blockade</span>
            <button class="ease-btn ease-btn-success ease-btn-sm ease-hover-grow">Run Silicon Spin Gate</button>
        </div>
    </div></body></html>
