<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Slider Captcha Puzzle</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      margin: 0; min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 1rem; padding: 24px;
      background: linear-gradient(160deg, #f8fafc, #eef2ff 55%, #f8fafc);
      color: #111827; font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    }
    h1 { margin: 0; font-size: 1.25rem; text-align: center; }
    .note { margin: 0; max-width: 420px; text-align: center; color: #4b5563; font-size: 0.92rem; line-height: 1.45; }
  </style>
</head>
<body>
  <h1>Slider Captcha Puzzle</h1>
  <p class="note">Demo only — not real anti-bot.</p>
  <div class="captcha" id="captcha"><div class="captcha__stage"><div class="captcha__slot" aria-hidden="true"></div><div class="captcha__piece" id="piece" aria-hidden="true"></div></div>
<input type="range" min="0" max="100" value="0" aria-label="Slide to fit the piece" id="slider"/></div>
  <script>
var root=document.getElementById('captcha'),piece=document.getElementById('piece'),slider=document.getElementById('slider');
function sync(){var v=+slider.value;var x=v*2.2;piece.style.setProperty('--x',x+'px');root.classList.remove('is-success','is-fail');if(v>=68&&v<=76){root.classList.add('is-success');}else if(v>85){root.classList.add('is-fail');}}
slider.addEventListener('input',sync);
</script>
</body>
</html>
