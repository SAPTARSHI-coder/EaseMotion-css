<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ease CSS Infinite Columns</title>
    <link rel="stylesheet" href="../../../easemotion.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="demo-container">
        
        <!-- The foreground content overlay -->
        <div class="hero-content">
            <h1>Creative Studio</h1>
            <p>Infinite CSS scrolling columns. Zero JavaScript parallax.</p>
            <button class="cta-button">View Portfolio</button>
        </div>

        <!-- The background infinite scrolling grid -->
        <div class="infinite-grid-wrapper">
            
            <!-- Column 1: Scrolls Up -->
            <div class="scrolling-column column-up fast-scroll">
                <div class="column-track">
                    <!-- Block 1 -->
                    <div class="column-content">
                        <div class="placeholder-img color-1"></div>
                        <div class="placeholder-img color-2"></div>
                        <div class="placeholder-img color-3"></div>
                        <div class="placeholder-img color-4"></div>
                    </div>
                    <!-- Block 2 (Exact Duplicate for the seamless loop) -->
                    <div class="column-content" aria-hidden="true">
                        <div class="placeholder-img color-1"></div>
                        <div class="placeholder-img color-2"></div>
                        <div class="placeholder-img color-3"></div>
                        <div class="placeholder-img color-4"></div>
                    </div>
                </div>
            </div>

            <!-- Column 2: Scrolls Down -->
            <div class="scrolling-column column-down slow-scroll">
                <div class="column-track">
                    <div class="column-content">
                        <div class="placeholder-img color-3"></div>
                        <div class="placeholder-img color-1"></div>
                        <div class="placeholder-img color-4"></div>
                        <div class="placeholder-img color-2"></div>
                    </div>
                    <div class="column-content" aria-hidden="true">
                        <div class="placeholder-img color-3"></div>
                        <div class="placeholder-img color-1"></div>
                        <div class="placeholder-img color-4"></div>
                        <div class="placeholder-img color-2"></div>
                    </div>
                </div>
            </div>

            <!-- Column 3: Scrolls Up -->
            <div class="scrolling-column column-up med-scroll">
                <div class="column-track">
                    <div class="column-content">
                        <div class="placeholder-img color-2"></div>
                        <div class="placeholder-img color-4"></div>
                        <div class="placeholder-img color-1"></div>
                        <div class="placeholder-img color-3"></div>
                    </div>
                    <div class="column-content" aria-hidden="true">
                        <div class="placeholder-img color-2"></div>
                        <div class="placeholder-img color-4"></div>
                        <div class="placeholder-img color-1"></div>
                        <div class="placeholder-img color-3"></div>
                    </div>
                </div>
            </div>

        </div>
        
    </main>

</body>
</html>
