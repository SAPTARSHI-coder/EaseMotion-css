<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Infinite Auto-Scrolling Masonry Columns</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <section class="hero">
    <div class="hero-overlay">
      <h1>Build Without Limits</h1>
      <p>A purely CSS-driven infinite scroll hero, no JS parallax required.</p>
    </div>

    <div class="scroll-columns">

      <!-- Column 1: scrolls UP -->
      <div class="column scroll-up">
        <div class="column-track">
          <img src="https://picsum.photos/seed/c1a/300/400" alt="">
          <img src="https://picsum.photos/seed/c1b/300/400" alt="">
          <img src="https://picsum.photos/seed/c1c/300/400" alt="">
          <img src="https://picsum.photos/seed/c1d/300/400" alt="">
          <!-- duplicate set for seamless loop -->
          <img src="https://picsum.photos/seed/c1a/300/400" alt="">
          <img src="https://picsum.photos/seed/c1b/300/400" alt="">
          <img src="https://picsum.photos/seed/c1c/300/400" alt="">
          <img src="https://picsum.photos/seed/c1d/300/400" alt="">
        </div>
      </div>

      <!-- Column 2: scrolls DOWN -->
      <div class="column scroll-down">
        <div class="column-track">
          <img src="https://picsum.photos/seed/c2a/300/400" alt="">
          <img src="https://picsum.photos/seed/c2b/300/400" alt="">
          <img src="https://picsum.photos/seed/c2c/300/400" alt="">
          <img src="https://picsum.photos/seed/c2d/300/400" alt="">
          <img src="https://picsum.photos/seed/c2a/300/400" alt="">
          <img src="https://picsum.photos/seed/c2b/300/400" alt="">
          <img src="https://picsum.photos/seed/c2c/300/400" alt="">
          <img src="https://picsum.photos/seed/c2d/300/400" alt="">
        </div>
      </div>

      <!-- Column 3: scrolls UP -->
      <div class="column scroll-up column-slow">
        <div class="column-track">
          <img src="https://picsum.photos/seed/c3a/300/400" alt="">
          <img src="https://picsum.photos/seed/c3b/300/400" alt="">
          <img src="https://picsum.photos/seed/c3c/300/400" alt="">
          <img src="https://picsum.photos/seed/c3d/300/400" alt="">
          <img src="https://picsum.photos/seed/c3a/300/400" alt="">
          <img src="https://picsum.photos/seed/c3b/300/400" alt="">
          <img src="https://picsum.photos/seed/c3c/300/400" alt="">
          <img src="https://picsum.photos/seed/c3d/300/400" alt="">
        </div>
      </div>

      <!-- Column 4: scrolls DOWN -->
      <div class="column scroll-down">
        <div class="column-track">
          <img src="https://picsum.photos/seed/c4a/300/400" alt="">
          <img src="https://picsum.photos/seed/c4b/300/400" alt="">
          <img src="https://picsum.photos/seed/c4c/300/400" alt="">
          <img src="https://picsum.photos/seed/c4d/300/400" alt="">
          <img src="https://picsum.photos/seed/c4a/300/400" alt="">
          <img src="https://picsum.photos/seed/c4b/300/400" alt="">
          <img src="https://picsum.photos/seed/c4c/300/400" alt="">
          <img src="https://picsum.photos/seed/c4d/300/400" alt="">
        </div>
      </div>

      <!-- Column 5: scrolls UP -->
      <div class="column scroll-up">
        <div class="column-track">
          <img src="https://picsum.photos/seed/c5a/300/400" alt="">
          <img src="https://picsum.photos/seed/c5b/300/400" alt="">
          <img src="https://picsum.photos/seed/c5c/300/400" alt="">
          <img src="https://picsum.photos/seed/c5d/300/400" alt="">
          <img src="https://picsum.photos/seed/c5a/300/400" alt="">
          <img src="https://picsum.photos/seed/c5b/300/400" alt="">
          <img src="https://picsum.photos/seed/c5c/300/400" alt="">
          <img src="https://picsum.photos/seed/c5d/300/400" alt="">
        </div>
      </div>

    </div>
  </section>

</body>
</html>
