<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Holographic Text</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="layout-container">
        
        <header class="section-header">
            <h1 class="title">Holographic Text</h1>
            <p class="subtitle">A pure CSS typography effect featuring a shifting, iridescent rainbow gradient masked perfectly to the text shape.</p>
        </header>

        <div class="demo-area">
            
            <div class="holo-card">
                
                <!-- 
                  [TECHNIQUE] Background Clip Text
                  We apply an animated background gradient to the text element,
                  and then use -webkit-background-clip: text; and color: transparent;
                  to mask the gradient to the shape of the letters.
                -->
                <h2 class="holo-text" data-text="HOLOGRAPHIC">HOLOGRAPHIC</h2>
                
                <p class="desc-text">Pure CSS Iridescent Typography</p>
                
            </div>
            
        </div>
        
    </div>

</body>
</html>
