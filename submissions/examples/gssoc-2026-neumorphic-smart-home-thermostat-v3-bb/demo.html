<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neumorphic Smart Home Thermostat - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="thermostat-card">
    <div class="dial-container">
      <div class="dial-outer">
        <div class="dial-inner">
          <span class="temp-readout">23.5°C</span>
          <span class="temp-mode">HEATING MODE</span>
        </div>
      </div>
    </div>
    <div class="controls flex">
      <button class="neu-btn active">AUTO</button>
      <button class="neu-btn">ECO</button>
      <button class="neu-btn">BOOST</button>
    </div>
  </div>
</body>
</html>
