<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>neumorphic soft shadow hover effect</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="neu-wrapper">
<header class="neu-header">
<h1>neumorphic soft shadow</h1>
<p>hardware-accelerated, dark-mode compatible neumorphic depth interaction built with zero javascript dependencies.</p>
</header>
<section class="neu-grid" aria-label="Interactive Controls">
<button type="button" class="neu-card" tabindex="0">
<div class="neu-icon">&#9889;</div>
<h3>smooth state transition</h3>
<p>transforms effortlessly between raised convex surface and inset extruded states on hover or press.</p>
</button>
<button type="button" class="neu-card" tabindex="0">
<div class="neu-icon">&#128737;</div>
<h3>dark-mode native</h3>
<p>utilizes custom css variables and dynamic opacity channels for seamless dark theme contrast.</p>
</button>
<button type="button" class="neu-card" tabindex="0">
<div class="neu-icon">&#128736;</div>
<h3>hardware accelerated</h3>
<p>leverages composite-only property transitions (`transform`, `box-shadow`) for steady 60fps renders.</p>
</button>
</section>
</main>
</body>
</html>
