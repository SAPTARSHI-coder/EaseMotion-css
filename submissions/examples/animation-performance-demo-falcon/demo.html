<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Animation Performance Comparison</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="frame">
      <h1>Animation Performance Comparison</h1>
      <p>
        Compare three ways to move a box: <strong>transform</strong>,
        <strong>left</strong> and <strong>margin-left</strong>.
      </p>

      <section class="track">
        <h2>transform: translateX()</h2>
        <div class="bars">
          <div class="bar bar--transform"></div>
        </div>
      </section>

      <section class="track">
        <h2>left</h2>
        <div class="bars">
          <div class="bar bar--left"></div>
        </div>
      </section>

      <section class="track">
        <h2>margin-left</h2>
        <div class="bars">
          <div class="bar bar--margin"></div>
        </div>
      </section>
    </main>
  </body>
</html>
