<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rattleback Spin Reverse — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Rattleback Spin Reverse demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Rattleback Spin Reverse</h1>
      <p class="lede">Asymmetric rattleback spinning then self-reversing direction</p>
    </header>

    <section class="ease-rattleback-spin-reverse" data-demo="rattleback-spin-reverse" aria-live="polite">
      <div class="ease-rattleback-spin-reverse__housing">
        <div class="ease-rattleback-spin-reverse__bezel">
          <div class="ease-rattleback-spin-reverse__face">
            <div class="ease-rattleback-spin-reverse__readout">
              <span class="ease-rattleback-spin-reverse__label">Rattleback Spin Reverse</span>
              <span class="ease-rattleback-spin-reverse__value">LIVE</span>
            </div>
            <div class="ease-rattleback-spin-reverse__motion" aria-hidden="true">
              <span class="ease-rattleback-spin-reverse__a"></span>
              <span class="ease-rattleback-spin-reverse__b"></span>
              <span class="ease-rattleback-spin-reverse__c"></span>
              <span class="ease-rattleback-spin-reverse__d"></span>
            </div>
            <div class="ease-rattleback-spin-reverse__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-rattleback-spin-reverse__controls">
          <button type="button" class="ease-rattleback-spin-reverse__btn primary">Engage</button>
          <button type="button" class="ease-rattleback-spin-reverse__btn">Reset</button>
          <label class="ease-rattleback-spin-reverse__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-rattleback-spin-reverse__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
