<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="CSS Polaroid card that pops forward and rotates on hover."
  >
  <title>CSS Polaroid Hover Pop</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">
    <section class="gallery" aria-labelledby="gallery-title">

      <div class="intro">
        <span>Pure CSS Gallery</span>
        <h1 id="gallery-title">Polaroid Hover Pop</h1>
        <p>Hover or focus the photo to bring it forward.</p>
      </div>

      <a
        class="polaroid"
        href="#photo"
        aria-label="View Sunset Escape photo"
      >
        <div class="photo">
          <div class="sun" aria-hidden="true"></div>
          <div class="mountain mountain-back" aria-hidden="true"></div>
          <div class="mountain mountain-front" aria-hidden="true"></div>
        </div>

        <div class="caption">
          <strong>Sunset Escape</strong>
          <span>Summer memories</span>
        </div>
      </a>

    </section>
  </main>

</body>
</html>
