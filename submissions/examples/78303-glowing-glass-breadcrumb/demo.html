<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Responsive glowing glassmorphism breadcrumb component"
  >
  <title>Glowing Glass Breadcrumb</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="page">
    <section class="showcase" aria-labelledby="page-title">

      <span class="eyebrow">EASEMOTION CSS</span>

      <h1 id="page-title">Glowing Glass Breadcrumb</h1>

      <p class="intro">
        A responsive breadcrumb component combining glassmorphism,
        subtle neon glow, and smooth interactive states.
      </p>

      <nav class="breadcrumb-shell" aria-label="Breadcrumb">
        <ol class="breadcrumb">

          <li class="breadcrumb__item">
            <a class="breadcrumb__link" href="#">
              <span class="breadcrumb__icon" aria-hidden="true">⌂</span>
              <span>Home</span>
            </a>
          </li>

          <li class="breadcrumb__separator" aria-hidden="true">/</li>

          <li class="breadcrumb__item">
            <a class="breadcrumb__link" href="#">
              <span class="breadcrumb__icon" aria-hidden="true">◈</span>
              <span>Projects</span>
            </a>
          </li>

          <li class="breadcrumb__separator" aria-hidden="true">/</li>

          <li class="breadcrumb__item">
            <a class="breadcrumb__link" href="#">
              <span class="breadcrumb__icon" aria-hidden="true">✦</span>
              <span>Components</span>
            </a>
          </li>

          <li class="breadcrumb__separator" aria-hidden="true">/</li>

          <li class="breadcrumb__item breadcrumb__item--current">
            <span
              class="breadcrumb__current"
              aria-current="page"
            >
              Breadcrumb
            </span>
          </li>

        </ol>
      </nav>

      <div class="status-card">
        <span class="status-card__orb" aria-hidden="true"></span>

        <div class="status-card__content">
          <span class="status-card__label">CURRENT LOCATION</span>
          <strong>Components / Breadcrumb</strong>
        </div>

        <span class="status-card__indicator" aria-hidden="true"></span>
      </div>

    </section>
  </main>
</body>
</html>
