<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expanding FAB Menu - EaseMotion CSS</title>
  <link rel="stylesheet" href="../../../easemotion.css">
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #f9fafb; /* Light theme for the demo to contrast with FAB */
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      margin: 0;
      color: #111827;
    }
    
    .demo-content {
      text-align: center;
      max-width: 600px;
      padding: 2rem;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 1rem;
      letter-spacing: -0.025em;
      color: #111827;
    }

    p {
      font-size: 1.125rem;
      line-height: 1.75;
      color: #4b5563;
      margin-bottom: 2rem;
    }
    
    .tooltip {
      position: absolute;
      right: 100%;
      margin-right: 0.75rem;
      background: #1f2937;
      color: white;
      padding: 0.375rem 0.75rem;
      border-radius: 0.375rem;
      font-size: 0.875rem;
      font-weight: 500;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transform: translateX(10px);
      transition: all 0.2s ease;
    }
    
    .ease-fab-item:hover .tooltip,
    .ease-fab-item:focus-visible .tooltip {
      opacity: 1;
      transform: translateX(0);
    }
    
    svg {
      width: 1.5rem;
      height: 1.5rem;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
  </style>
</head>
<body>

  <div class="demo-content">
    <h1>Expanding FAB Menu</h1>
    <p>Hover over or focus on the Floating Action Button in the bottom right corner to reveal secondary actions. Built entirely with CSS.</p>
  </div>

  <div class="ease-fab-container">
    <div class="ease-fab-menu">
      <button class="ease-fab-item" aria-label="Share">
        <span class="tooltip">Share</span>
        <svg viewBox="0 0 24 24"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path><polyline points="16 6 12 2 8 6"></polyline><line x1="12" y1="2" x2="12" y2="15"></line></svg>
      </button>
      <button class="ease-fab-item" aria-label="Edit">
        <span class="tooltip">Edit</span>
        <svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
      </button>
      <button class="ease-fab-item" aria-label="Delete">
        <span class="tooltip">Delete</span>
        <svg viewBox="0 0 24 24" style="stroke: #ef4444;"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
      </button>
    </div>
    
    <button class="ease-fab-main" aria-label="Menu" aria-haspopup="menu">
      <svg class="ease-fab-icon-open" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      <svg class="ease-fab-icon-close" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
    </button>
  </div>

</body>
</html>
