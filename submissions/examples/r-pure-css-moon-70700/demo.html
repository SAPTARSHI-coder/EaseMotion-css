<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Pure CSS animated moon with surface craters and glow.">
  <title>Pure CSS Moon</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="scene">
    <section class="moon-showcase" aria-labelledby="moon-title">
      <div class="stars" aria-hidden="true">
        <span class="star star-1"></span>
        <span class="star star-2"></span>
        <span class="star star-3"></span>
        <span class="star star-4"></span>
        <span class="star star-5"></span>
        <span class="star star-6"></span>
        <span class="star star-7"></span>
        <span class="star star-8"></span>
        <span class="star star-9"></span>
        <span class="star star-10"></span>
      </div>

      <div class="moon" role="img" aria-label="A glowing full moon with visible surface craters">
        <span class="crater crater-1"></span>
        <span class="crater crater-2"></span>
        <span class="crater crater-3"></span>
        <span class="crater crater-4"></span>
        <span class="crater crater-5"></span>
        <span class="crater crater-6"></span>
        <span class="crater crater-7"></span>
        <span class="crater crater-8"></span>
        <span class="moon-highlight"></span>
      </div>

      <div class="horizon" aria-hidden="true"></div>

      <div class="content">
        <p class="eyebrow">PURE CSS ANIMATION</p>
        <h1 id="moon-title">Moonlight</h1>
        <p class="description">
          A glowing lunar scene created entirely with HTML and CSS.
        </p>
      </div>
    </section>
  </main>
</body>
</html>
