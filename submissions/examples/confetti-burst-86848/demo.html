<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Confetti Burst</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="celebration">
      <input class="celebration__toggle" type="checkbox" id="celebrate" />
      <section class="success-card" aria-live="polite">
        <div class="success-card__icon" aria-hidden="true">&#10003;</div>
        <p class="eyebrow">Milestone reached</p>
        <h1>Launch complete</h1>
        <p class="message">Your project is live and ready for the world.</p>
        <label class="celebrate-button" for="celebrate"
          ><span class="start">Celebrate</span
          ><span class="reset">Reset burst</span></label
        >
      </section>

      <div class="confetti" aria-hidden="true">
        <i
          style="--x: -180px; --y: -135px; --r: 420deg; --d: 0ms; --c: #55e6bd"
        ></i>
        <i
          style="
            --x: -135px;
            --y: -190px;
            --r: -360deg;
            --d: 45ms;
            --c: #f7c953;
          "
        ></i>
        <i
          style="--x: -82px; --y: -215px; --r: 520deg; --d: 90ms; --c: #ff718d"
        ></i>
        <i
          style="--x: -28px; --y: -230px; --r: -460deg; --d: 20ms; --c: #7c8cff"
        ></i>
        <i
          style="--x: 36px; --y: -225px; --r: 390deg; --d: 70ms; --c: #55e6bd"
        ></i>
        <i
          style="--x: 92px; --y: -205px; --r: -540deg; --d: 110ms; --c: #f7c953"
        ></i>
        <i
          style="--x: 145px; --y: -165px; --r: 440deg; --d: 35ms; --c: #ff718d"
        ></i>
        <i
          style="--x: 190px; --y: -118px; --r: -380deg; --d: 80ms; --c: #7c8cff"
        ></i>
        <i
          style="--x: -205px; --y: -65px; --r: 570deg; --d: 125ms; --c: #f7c953"
        ></i>
        <i
          style="
            --x: -155px;
            --y: -95px;
            --r: -420deg;
            --d: 150ms;
            --c: #7c8cff;
          "
        ></i>
        <i
          style="--x: 158px; --y: -82px; --r: 480deg; --d: 140ms; --c: #55e6bd"
        ></i>
        <i
          style="--x: 215px; --y: -45px; --r: -510deg; --d: 105ms; --c: #ff718d"
        ></i>
        <i
          style="
            --x: -112px;
            --y: -155px;
            --r: 360deg;
            --d: 180ms;
            --c: #55e6bd;
          "
        ></i>
        <i
          style="
            --x: -55px;
            --y: -175px;
            --r: -490deg;
            --d: 155ms;
            --c: #ff718d;
          "
        ></i>
        <i
          style="--x: 65px; --y: -170px; --r: 530deg; --d: 195ms; --c: #f7c953"
        ></i>
        <i
          style="
            --x: 122px;
            --y: -145px;
            --r: -400deg;
            --d: 165ms;
            --c: #7c8cff;
          "
        ></i>
      </div>
    </main>
  </body>
</html>
