<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Ripple-Wave Tabs - EaseMotion CSS</title>
  <!-- Import EaseMotion CSS -->
  <link rel="stylesheet" href="../../../easemotion.css">
  <!-- Component Specific Styles -->
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="checkout-bg">

  <div class="demo-container">
    
    <div class="checkout-panel ease-glass-card">
      <div class="checkout-header">
        <h2 class="ease-text-xl">Payment Method</h2>
        <p class="ease-color-muted">All transactions are secure and encrypted.</p>
      </div>

      <!-- Ripple-Wave Tabs Component -->
      <div class="tabs-container">
        
        <!-- Hidden Radio Inputs for Tab State -->
        <input type="radio" name="payment_tab" id="tab-card" class="tab-radio" checked>
        <input type="radio" name="payment_tab" id="tab-paypal" class="tab-radio">
        <input type="radio" name="payment_tab" id="tab-apple" class="tab-radio">

        <!-- Tab Headers -->
        <div class="tab-headers">
          
          <label for="tab-card" class="tab-label" tabindex="0">
            <span class="tab-icon">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect><line x1="1" y1="10" x2="23" y2="10"></line></svg>
            </span>
            Credit Card
            <div class="ripple-wave"></div>
          </label>
          
          <label for="tab-paypal" class="tab-label" tabindex="0">
            <span class="tab-icon">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.144 21.154l3.111-19.646h9.123c3.084 0 5.483 1.259 5.483 4.887 0 4.148-2.613 7.82-7.551 7.82h-3.693l-1.396 8.814h-5.077z"></path></svg>
            </span>
            PayPal
            <div class="ripple-wave"></div>
          </label>
          
          <label for="tab-apple" class="tab-label" tabindex="0">
            <span class="tab-icon">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.69l5.66 4.2c.11.08.18.21.18.35v6.52c0 2.21-1.35 4.2-3.35 5.1l-2.49 1.12-2.49-1.12C7.35 17.96 6 15.97 6 13.76V7.24c0-.14.07-.27.18-.35L11.84 2.7c.05-.03.11-.03.16 0z"></path></svg>
            </span>
            Apple Pay
            <div class="ripple-wave"></div>
          </label>
          
          <!-- Animated Active Indicator Underline -->
          <div class="tab-indicator"></div>
        </div>

        <!-- Tab Contents -->
        <div class="tab-contents-wrapper">
          
          <!-- Content 1: Credit Card -->
          <div class="tab-content content-card">
            <div class="mock-form">
              <div class="form-group">
                <label>Card Number</label>
                <div class="mock-input placeholder">0000 0000 0000 0000</div>
              </div>
              <div class="form-row">
                <div class="form-group">
                  <label>Expiry Date</label>
                  <div class="mock-input placeholder">MM/YY</div>
                </div>
                <div class="form-group">
                  <label>CVV</label>
                  <div class="mock-input placeholder">123</div>
                </div>
              </div>
            </div>
            <button class="pay-btn ease-squish-button">Pay $89.00 with Card</button>
          </div>
          
          <!-- Content 2: PayPal -->
          <div class="tab-content content-paypal">
            <div class="paypal-container">
              <div class="paypal-logo">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#00457C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.144 21.154l3.111-19.646h9.123c3.084 0 5.483 1.259 5.483 4.887 0 4.148-2.613 7.82-7.551 7.82h-3.693l-1.396 8.814h-5.077z"></path></svg>
              </div>
              <p>You will be redirected to PayPal to complete your purchase securely.</p>
              <button class="pay-btn paypal-btn ease-squish-button">Continue to PayPal</button>
            </div>
          </div>
          
          <!-- Content 3: Apple Pay -->
          <div class="tab-content content-apple">
            <div class="apple-container">
              <button class="apple-pay-btn ease-squish-button">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M16.5 12c0-2.66 2.16-3.95 2.26-4.01-1.24-1.81-3.17-2.07-3.86-2.1-1.64-.17-3.21.97-4.05.97-.85 0-2.13-.94-3.5-.91-1.78.02-3.42 1.04-4.34 2.63-1.88 3.25-.48 8.08 1.34 10.7 .9 1.3 1.95 2.76 3.36 2.7 1.37-.06 1.88-.89 3.52-.89 1.63 0 2.11.89 3.54.86 1.45-.03 2.37-1.33 3.26-2.64 1.03-1.5 1.45-2.97 1.48-3.05-.03-.02-2.85-1.1-2.86-4.3M14.93 4.22c.75-.91 1.26-2.17 1.13-3.43-1.09.04-2.42.72-3.2 1.63-.69.81-1.29 2.11-1.13 3.34 1.22.09 2.45-.63 3.2-1.54"/></svg>
                Pay
              </button>
            </div>
          </div>
          
        </div>
        
      </div>
    </div>

  </div>

</body>
</html>
