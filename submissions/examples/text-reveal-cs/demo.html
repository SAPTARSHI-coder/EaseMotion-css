<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="EaseMotion CSS text reveal animation example." />
    <title>Text Reveal | EaseMotion</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <main class="demo-page">
        <section class="hero" aria-labelledby="hero-title">
            <span class="eyebrow">EaseMotion / Typography</span>

            <h1 id="hero-title">
                <span class="em-text-reveal-wrapper">
          <span class="em-text-reveal-up">Build something remarkable.</span>
                </span>
            </h1>

            <p class="hero-description">
                A simple masked text reveal that slides typography upward into view.
            </p>

            <div class="examples">
                <div class="example">
                    <span class="example-label">01 / Heading</span>

                    <span class="em-text-reveal-wrapper">
            <span class="em-text-reveal-up">
              Motion starts with a single line.
            </span>
                    </span>
                </div>

                <div class="example">
                    <span class="example-label">02 / Statement</span>

                    <span class="em-text-reveal-wrapper">
            <span class="em-text-reveal-up em-text-reveal-delay">
              Reveal content with a clean vertical motion.
            </span>
                    </span>
                </div>
            </div>
        </section>
    </main>
</body>

</html>
