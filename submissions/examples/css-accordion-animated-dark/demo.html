<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Dark Accordion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dark-accordion">
        <div class="a-item">
            <input type="radio" name="dark-acc" id="da1" checked>
            <label for="da1">Encryption Protocols</label>
            <div class="a-content"><p>AES-256 implementation standard.</p></div>
        </div>
        <div class="a-item">
            <input type="radio" name="dark-acc" id="da2">
            <label for="da2">Access Logs</label>
            <div class="a-content"><p>No unauthorized access detected.</p></div>
        </div>
    </div>
</body>
</html>
