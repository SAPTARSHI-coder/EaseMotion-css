<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <meta
    name="description"
    content="Animated cyberpunk rating component built with pure HTML and CSS."
  />

  <title>Animated Rating — Cyberpunk</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <main class="page">

    <section
      class="rating-panel"
      aria-labelledby="rating-title"
    >

      <div class="rating-panel__scanline" aria-hidden="true"></div>

      <header class="rating-header">

        <div class="rating-header__status">
          <span class="status-dot" aria-hidden="true"></span>
          SYSTEM ONLINE
        </div>

        <span class="rating-header__eyebrow">
          FEEDBACK // PROTOCOL 01
        </span>

        <h1 id="rating-title">
          Rate your experience
        </h1>

        <p class="rating-header__description">
          Select a rating to transmit your feedback.
        </p>

      </header>

      <div
        class="rating"
        role="radiogroup"
        aria-label="Rate your experience from one to five stars"
      >

        <input
          type="radio"
          id="rating-5"
          name="rating"
          value="5"
        />
        <label for="rating-5" aria-label="5 stars">
          <span aria-hidden="true">★</span>
        </label>

        <input
          type="radio"
          id="rating-4"
          name="rating"
          value="4"
        />
        <label for="rating-4" aria-label="4 stars">
          <span aria-hidden="true">★</span>
        </label>

        <input
          type="radio"
          id="rating-3"
          name="rating"
          value="3"
        />
        <label for="rating-3" aria-label="3 stars">
          <span aria-hidden="true">★</span>
        </label>

        <input
          type="radio"
          id="rating-2"
          name="rating"
          value="2"
        />
        <label for="rating-2" aria-label="2 stars">
          <span aria-hidden="true">★</span>
        </label>

        <input
          type="radio"
          id="rating-1"
          name="rating"
          value="1"
        />
        <label for="rating-1" aria-label="1 star">
          <span aria-hidden="true">★</span>
        </label>

      </div>

      <div class="rating-footer">

        <span class="rating-footer__hint">
          SELECT RATING
        </span>

        <span
          class="rating-footer__value"
          aria-hidden="true"
        >
          01 — 05
        </span>

      </div>

      <div
        class="rating-panel__corner rating-panel__corner--top"
        aria-hidden="true"
      ></div>

      <div
        class="rating-panel__corner rating-panel__corner--bottom"
        aria-hidden="true"
      ></div>

    </section>

  </main>

</body>
</html>
