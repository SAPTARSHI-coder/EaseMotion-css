<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Slide-Up Modal — Gaming Hub</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="ease-container">
    <p class="ease-eyebrow">Game Details</p>
    <h1 class="ease-heading">Ember Rush</h1>
    <p class="ease-subtitle">Pure CSS modal that slides up over a dimmed backdrop. No JavaScript.</p>

    <label for="ease-modal-toggle" class="ease-modal-open-btn">View Details</label>
  </main>

  <input type="checkbox" id="ease-modal-toggle" class="ease-modal-input" />

  <div class="ease-modal-overlay">
    <label for="ease-modal-toggle" class="ease-modal-backdrop" aria-label="Close"></label>

    <div class="ease-modal" role="dialog" aria-modal="true" aria-labelledby="ease-modal-title">
      <label for="ease-modal-toggle" class="ease-modal-close" aria-label="Close">&times;</label>
      <h2 id="ease-modal-title">Ember Rush</h2>
      <p class="ease-modal-meta">Action &middot; 2-4 Players &middot; Cross-platform</p>
      <p>A fast-paced arena shooter with destructible terrain and a rotating weapon roster. Ranked seasons run every six weeks.</p>
      <label for="ease-modal-toggle" class="ease-modal-confirm-btn">Close</label>
    </div>
  </div>

</body>
</html>
