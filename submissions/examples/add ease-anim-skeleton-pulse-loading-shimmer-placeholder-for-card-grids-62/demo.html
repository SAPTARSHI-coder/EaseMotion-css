<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skeleton Loading Grid - Vibrant Gradient</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <h1>Loading <span class="gradient-text">Experiences</span></h1>
        <p>Vibrant glassmorphic skeleton placeholders</p>
    </header>

    <main class="card-grid">
        <!-- Skeleton Card 1 -->
        <article class="skeleton-card">
            <div class="skeleton-image skeleton-shimmer"></div>
            <div class="skeleton-content">
                <div class="skeleton-header">
                    <div class="skeleton-avatar skeleton-shimmer"></div>
                    <div class="skeleton-text-group">
                        <div class="skeleton-title skeleton-shimmer"></div>
                        <div class="skeleton-subtitle skeleton-shimmer"></div>
                    </div>
                </div>
                <div class="skeleton-body">
                    <div class="skeleton-line skeleton-shimmer"></div>
                    <div class="skeleton-line skeleton-shimmer" style="width: 80%;"></div>
                    <div class="skeleton-line skeleton-shimmer" style="width: 60%;"></div>
                </div>
            </div>
        </article>

        <!-- Skeleton Card 2 -->
        <article class="skeleton-card">
            <div class="skeleton-image skeleton-shimmer"></div>
            <div class="skeleton-content">
                <div class="skeleton-header">
                    <div class="skeleton-avatar skeleton-shimmer"></div>
                    <div class="skeleton-text-group">
                        <div class="skeleton-title skeleton-shimmer"></div>
                        <div class="skeleton-subtitle skeleton-shimmer"></div>
                    </div>
                </div>
                <div class="skeleton-body">
                    <div class="skeleton-line skeleton-shimmer"></div>
                    <div class="skeleton-line skeleton-shimmer" style="width: 90%;"></div>
                    <div class="skeleton-line skeleton-shimmer" style="width: 40%;"></div>
                </div>
            </div>
        </article>

        <!-- Skeleton Card 3 -->
        <article class="skeleton-card">
            <div class="skeleton-image skeleton-shimmer"></div>
            <div class="skeleton-content">
                <div class="skeleton-header">
                    <div class="skeleton-avatar skeleton-shimmer"></div>
                    <div class="skeleton-text-group">
                        <div class="skeleton-title skeleton-shimmer"></div>
                        <div class="skeleton-subtitle skeleton-shimmer"></div>
                    </div>
                </div>
                <div class="skeleton-body">
                    <div class="skeleton-line skeleton-shimmer"></div>
                    <div class="skeleton-line skeleton-shimmer" style="width: 75%;"></div>
                    <div class="skeleton-line skeleton-shimmer" style="width: 50%;"></div>
                </div>
            </div>
        </article>
    </main>

    <div class="controls">
        <button class="btn-toggle" onclick="toggleSimulatedLoad()">Simulate Loaded State</button>
    </div>

    <script>
        function toggleSimulatedLoad() {
            const cards = document.querySelectorAll('.skeleton-card');
            cards.forEach(card => {
                if (card.classList.contains('loaded-state')) {
                    card.classList.remove('loaded-state');
                } else {
                    card.classList.add('loaded-state');
                }
            });
        }
    </script>
</body>
</html>
