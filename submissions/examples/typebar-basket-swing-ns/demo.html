<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Typebar Basket Swing — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Typebar Basket Swing demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Typebar Basket Swing</h1>
      <p class="lede">Typebar swinging up to the platen</p>
    </header>

    <section class="ease-typebar-basket-swing" data-demo="typebar-basket-swing" aria-live="polite">
      <div class="ease-typebar-basket-swing__housing">
        <div class="ease-typebar-basket-swing__bezel">
          <div class="ease-typebar-basket-swing__face">
            <div class="ease-typebar-basket-swing__readout">
              <span class="ease-typebar-basket-swing__label">Typebar Basket Swing</span>
              <span class="ease-typebar-basket-swing__value">LIVE</span>
            </div>
            <div class="ease-typebar-basket-swing__motion" aria-hidden="true">
              <span class="ease-typebar-basket-swing__a"></span>
              <span class="ease-typebar-basket-swing__b"></span>
              <span class="ease-typebar-basket-swing__c"></span>
              <span class="ease-typebar-basket-swing__d"></span>
            </div>
            <div class="ease-typebar-basket-swing__meters">
              <i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-typebar-basket-swing__controls">
          <button type="button" class="ease-typebar-basket-swing__btn primary">Strike</button>
          <button type="button" class="ease-typebar-basket-swing__btn">Rest</button>
          <label class="ease-typebar-basket-swing__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-typebar-basket-swing__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
