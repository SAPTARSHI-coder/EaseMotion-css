<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Animated Loader - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="loaders-page">

    <header class="loaders-header">
      <span class="section-pill">Loading UI</span>
      <h1>Animated Loaders</h1>
      <p>
        Modern loading spinners built with pure HTML and CSS.
        Useful for buttons, pages, dashboards, and loading states.
      </p>
    </header>

    <section class="loaders-grid">

      <!-- Spinner Loader -->
      <article class="loader-card">
        <div
          class="loader spinner"
          role="status"
          aria-label="Loading"
        ></div>
        <span class="loader-name">Spinner</span>
      </article>

      <!-- Dots Loader -->
      <article class="loader-card">
        <div
          class="loader dots"
          role="status"
          aria-label="Loading"
        >
          <span></span>
          <span></span>
          <span></span>
        </div>
        <span class="loader-name">Dots</span>
      </article>

      <!-- Bars Loader -->
      <article class="loader-card">
        <div
          class="loader bars"
          role="status"
          aria-label="Loading"
        >
          <span></span>
          <span></span>
          <span></span>
          <span></span>
        </div>
        <span class="loader-name">Bars</span>
      </article>

      <!-- Pulse Loader -->
      <article class="loader-card">
        <div
          class="loader pulse"
          role="status"
          aria-label="Loading"
        ></div>
        <span class="loader-name">Pulse</span>
      </article>

    </section>

  </main>

</body>
</html>
