<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smooth Hover Lift Demo</title>
  <link rel="stylesheet" href="../../../easemotion.css">
  <link rel="stylesheet" href="./style.css">
  <style>
    body {
      background-color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 2rem;
    }
    
    .demo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 2rem;
      width: 100%;
      max-width: 900px;
    }

    /* Base Card Styling for the demo */
    .demo-card {
      background: white;
      border-radius: 12px;
      padding: 2rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); /* Base shadow */
      cursor: pointer;
    }
    
    .demo-card h3 {
      margin-top: 0;
      color: #0f172a;
    }
    
    .demo-card p {
      color: #64748b;
      margin-bottom: 0;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <h2 style="color: #1e293b; margin-bottom: 3rem; text-align: center;">Smooth 3D Hover Lift Utility</h2>

  <div class="demo-grid">
    
    <!-- Standard Card with Lift Effect -->
    <div class="demo-card ease-hover-lift">
      <h3>Basic Card</h3>
      <p>Hover over me to see the smooth, tactile lift effect. Notice how the shadow softens and expands.</p>
    </div>

    <!-- Image Card with Lift Effect -->
    <div class="demo-card ease-hover-lift" style="padding: 0; overflow: hidden;">
      <img src="https://images.unsplash.com/photo-1557683316-973673baf926?auto=format&fit=crop&w=800&q=80" alt="Gradient Background" style="width: 100%; height: 150px; object-fit: cover; display: block;">
      <div style="padding: 1.5rem;">
        <h3>Media Card</h3>
        <p>This utility pairs perfectly with complex layouts, bringing a premium feel to your UI elements.</p>
      </div>
    </div>
    
    <!-- Interactive Button Demo -->
    <div class="demo-card ease-hover-lift" style="display: flex; align-items: center; justify-content: center; background: #3b82f6;">
      <h3 style="color: white; margin: 0;">Interactive Call To Action</h3>
    </div>

  </div>

</body>
</html>
