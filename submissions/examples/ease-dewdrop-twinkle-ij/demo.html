<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dewdrop Twinkle Demo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="stage">
    <header class="stage-header">
      <h1>Dewdrop Twinkle</h1>
      <p>Plain CSS animation demo with a pause toggle.</p>
    </header>
    <section class="scene" aria-label="Dewdrop Twinkle animation">
      <div class="star s1" role="presentation"></div><div class="star s2" role="presentation"></div><div class="star s3" role="presentation"></div><div class="star s4" role="presentation"></div><div class="star s5" role="presentation"></div>
    </section>
    <button class="toggle" type="button">Pause</button>
  </main>
  <script>
    (function () {
      var toggle = document.querySelector(".toggle");
      var scene = document.querySelector(".scene");
      toggle.addEventListener("click", function () {
        var paused = scene.classList.toggle("paused");
        toggle.textContent = paused ? "Play" : "Pause";
      });
    })();
  </script>
</body>
</html>
