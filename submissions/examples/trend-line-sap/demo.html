<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trend Line</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="trend-demo">
    <header class="trend-demo__header">
      <p class="trend-demo__eyebrow">EaseMotion CSS</p>
      <h1>Trend Line</h1>
      <p>
        Compact animated trend visualizations for analytics cards,
        dashboards, and financial interfaces.
      </p>
    </header>

    <section class="trend-grid" aria-label="Trend line examples">

      <!-- Positive trend -->
      <article class="trend-card">
        <div class="trend-card__top">
          <div>
            <span class="trend-card__label">Revenue</span>
            <strong class="trend-card__value">$48.2K</strong>
          </div>
          <span class="trend-card__change trend-card__change--positive">
            +18.4%
          </span>
        </div>

        <svg
          class="trend-line trend-line--positive"
          viewBox="0 0 320 100"
          preserveAspectRatio="none"
          role="img"
          aria-label="Revenue increased over time"
        >
          <defs>
            <linearGradient id="positive-fill" x1="0" x2="0" y1="0" y2="1">
              <stop offset="0%" stop-color="currentColor" stop-opacity=".22"/>
              <stop offset="100%" stop-color="currentColor" stop-opacity="0"/>
            </linearGradient>
          </defs>

          <path
            class="trend-line__area"
            d="M0 82 C25 75 35 62 60 67 S95 50 120 57 S155 34 180 42 S215 25 240 34 S280 15 320 8 V100 H0 Z"
          />

          <path
            class="trend-line__path"
            pathLength="1"
            d="M0 82 C25 75 35 62 60 67 S95 50 120 57 S155 34 180 42 S215 25 240 34 S280 15 320 8"
          />

          <circle
            class="trend-line__point"
            cx="320"
            cy="8"
            r="4"
          />
        </svg>
      </article>

      <!-- Negative trend -->
      <article class="trend-card">
        <div class="trend-card__top">
          <div>
            <span class="trend-card__label">Expenses</span>
            <strong class="trend-card__value">$12.8K</strong>
          </div>
          <span class="trend-card__change trend-card__change--negative">
            -8.2%
          </span>
        </div>

        <svg
          class="trend-line trend-line--negative"
          viewBox="0 0 320 100"
          preserveAspectRatio="none"
          role="img"
          aria-label="Expenses decreased over time"
        >
          <defs>
            <linearGradient id="negative-fill" x1="0" x2="0" y1="0" y2="1">
              <stop offset="0%" stop-color="currentColor" stop-opacity=".18"/>
              <stop offset="100%" stop-color="currentColor" stop-opacity="0"/>
            </linearGradient>
          </defs>

          <path
            class="trend-line__area"
            d="M0 18 C30 22 40 38 70 32 S105 42 130 50 S165 38 190 58 S220 55 245 70 S285 66 320 88 V100 H0 Z"
          />

          <path
            class="trend-line__path"
            pathLength="1"
            d="M0 18 C30 22 40 38 70 32 S105 42 130 50 S165 38 190 58 S220 55 245 70 S285 66 320 88"
          />

          <circle
            class="trend-line__point"
            cx="320"
            cy="88"
            r="4"
          />
        </svg>
      </article>

      <!-- Neutral trend -->
      <article class="trend-card">
        <div class="trend-card__top">
          <div>
            <span class="trend-card__label">Visitors</span>
            <strong class="trend-card__value">8,492</strong>
          </div>
          <span class="trend-card__change trend-card__change--neutral">
            +0.6%
          </span>
        </div>

        <svg
          class="trend-line trend-line--neutral"
          viewBox="0 0 320 100"
          preserveAspectRatio="none"
          role="img"
          aria-label="Visitors remained relatively stable"
        >
          <path
            class="trend-line__path"
            pathLength="1"
            d="M0 56 C30 52 45 58 70 50 S105 55 130 47 S165 52 190 45 S220 50 245 44 S285 48 320 42"
          />

          <circle
            class="trend-line__point"
            cx="320"
            cy="42"
            r="4"
          />
        </svg>
      </article>

    </section>

    <section class="trend-sizes" aria-label="Trend line sizes">
      <article class="trend-size">
        <span>Small</span>

        <svg
          class="trend-line trend-line--small trend-line--positive"
          viewBox="0 0 320 80"
          preserveAspectRatio="none"
          aria-hidden="true"
        >
          <path
            class="trend-line__path"
            pathLength="1"
            d="M0 64 C35 60 50 45 78 51 S120 40 145 45 S185 20 215 31 S270 14 320 8"
          />
        </svg>
      </article>

      <article class="trend-size">
        <span>Medium</span>

        <svg
          class="trend-line trend-line--medium trend-line--positive"
          viewBox="0 0 320 100"
          preserveAspectRatio="none"
          aria-hidden="true"
        >
          <path
            class="trend-line__path"
            pathLength="1"
            d="M0 78 C35 68 50 52 78 60 S120 44 145 50 S185 28 215 36 S270 18 320 8"
          />
        </svg>
      </article>

      <article class="trend-size">
        <span>Large</span>

        <svg
          class="trend-line trend-line--large trend-line--positive"
          viewBox="0 0 320 130"
          preserveAspectRatio="none"
          aria-hidden="true"
        >
          <path
            class="trend-line__path"
            pathLength="1"
            d="M0 105 C35 94 50 72 78 80 S120 60 145 68 S185 38 215 48 S270 25 320 10"
          />
        </svg>
      </article>
    </section>
  </main>
</body>
</html>
