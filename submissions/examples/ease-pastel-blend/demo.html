<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pastel Blend · Soft Pastel Colors Blend</title>
    <meta name="description" content="Interactive pastel color blending with soft, dreamy transitions and gentle particle effects.">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1 class="title">🌈 PASTEL BLEND</h1>
        
        <div class="canvas-wrapper">
            <canvas id="pastelCanvas" width="600" height="450"></canvas>
            <div class="glow-overlay"></div>
        </div>

        <div class="controls">
            <div class="color-controls">
                <label>Color 1</label>
                <input type="color" id="color1Picker" value="#ffb3c6">
                <label>Color 2</label>
                <input type="color" id="color2Picker" value="#b8d4e3">
                <label>Color 3</label>
                <input type="color" id="color3Picker" value="#d4c4e8">
            </div>
            <div class="button-group">
                <button class="toggle-btn" id="toggleBtn">⏸️ PAUSE</button>
                <button class="reset-btn" id="resetBtn">⟳ RESET</button>
            </div>
            <div class="speed-control">
                <label>Speed</label>
                <input type="range" id="speedSlider" min="1" max="10" value="5">
                <span id="speedLabel">5</span>
            </div>
        </div>

        <div class="info">
            <span>🌈 PASTEL BLEND</span>
            <small>soft · dreamy · flowing</small>
        </div>
        <div class="hint">
            <span>🎨 pastel colors blend in a gentle, flowing dance</span>
        </div>
    </div>

    <script>
        (function() {
            const canvas = document.getElementById('pastelCanvas');
            const ctx = canvas.getContext('2d');
            const W = 600, H = 450;
            
            const color1Picker = document.getElementById('color1Picker');
            const color2Picker = document.getElementById('color2Picker');
            const color3Picker = document.getElementById('color3Picker');
            const toggleBtn = document.getElementById('toggleBtn');
            const resetBtn = document.getElementById('resetBtn');
            const speedSlider = document.getElementById('speedSlider');
            const speedLabel = document.getElementById('speedLabel');

            let isAnimating = true;
            let speed = 5;
            let time = 0;

            // ---- Color Particles ----
            let particles = [];
            const NUM_PARTICLES = 80;

            // ---- Particle Class ----
            class Particle {
                constructor() {
                    this.x = Math.random() * W;
                    this.y = Math.random() * H;
                    this.size = 20 + Math.random() * 60;
                    this.baseSize = this.size;
                    
                    // Movement
                    this.vx = (Math.random() - 0.5) * 0.3;
                    this.vy = (Math.random() - 0.5) * 0.3;
                    this.phase = Math.random() * Math.PI * 2;
                    this.phaseSpeed = 0.005 + Math.random() * 0.015;
                    this.wobbleX = (Math.random() - 0.5) * 0.5;
                    this.wobbleY = (Math.random() - 0.5) * 0.5;
                    
                    // Color blend
                    this.colorOffset = Math.random();
                    this.colorSpeed = 0.002 + Math.random() * 0.005;
                    this.blendFactor = Math.random();
                    
                    // Opacity
                    this.opacity = 0.15 + Math.random() * 0.35;
                    this.opacityPhase = Math.random() * Math.PI * 2;
                    this.opacitySpeed = 0.005 + Math.random() * 0.01;
                }

                update(colors) {
                    const dt = speed / 5;
                    this.phase += this.phaseSpeed * dt;
                    this.colorOffset += this.colorSpeed * dt;
                    this.opacityPhase += this.opacitySpeed * dt;
                    
                    // Gentle movement
                    this.x += this.vx * dt + Math.sin(this.phase + this.wobbleX * 2) * 0.1;
                    this.y += this.vy * dt + Math.cos(this.phase * 0.7 + this.wobbleY * 2) * 0.1;
                    
                    // Pulsing size
                    this.size = this.baseSize * (0.8 + Math.sin(this.phase * 0.5) * 0.2);
                    
                    // Opacity pulse
                    this.opacity = (0.15 + Math.sin(this.opacityPhase) * 0.1 + 0.15);
                    
                    // Wrap around edges
                    if (this.x < -this.size) this.x = W + this.size;
                    if (this.x > W + this.size) this.x = -this.size;
                    if (this.y < -this.size) this.y = H + this.size;
                    if (this.y > H + this.size) this.y = -this.size;
                }

                draw(ctx, colors) {
                    // Blend colors based on position and time
                    const blendX = (this.x / W) * 0.6 + 0.2;
                    const blendY = (this.y / H) * 0.6 + 0.2;
                    const t = (blendX + blendY) * 0.5 + this.colorOffset * 0.3;
                    
                    // Smooth color interpolation
                    const c1 = colors[0];
                    const c2 = colors[1];
                    const c3 = colors[2];
                    
                    // Parse colors
                    const rgb1 = this.hexToRgb(c1);
                    const rgb2 = this.hexToRgb(c2);
                    const rgb3 = this.hexToRgb(c3);
                    
                    // Interpolate
                    const t1 = Math.sin(t * Math.PI * 2) * 0.5 + 0.5;
                    const t2 = Math.cos(t * Math.PI * 1.3) * 0.5 + 0.5;
                    const t3 = Math.sin(t * Math.PI * 0.7 + 1) * 0.5 + 0.5;
                    const sum = t1 + t2 + t3;
                    
                    const r = (rgb1.r * t1 + rgb2.r * t2 + rgb3.r * t3) / sum;
                    const g = (rgb1.g * t1 + rgb2.g * t2 + rgb3.g * t3) / sum;
                    const b = (rgb1.b * t1 + rgb2.b * t2 + rgb3.b * t3) / sum;
                    
                    // Create soft pastel glow
                    const grad = ctx.createRadialGradient(
                        this.x, this.y, 0,
                        this.x, this.y, this.size * 1.5
                    );
                    const alpha = this.opacity * 0.7;
                    grad.addColorStop(0, `rgba(${r}, ${g}, ${b}, ${alpha})`);
                    grad.addColorStop(0.4, `rgba(${r}, ${g}, ${b}, ${alpha * 0.6})`);
                    grad.addColorStop(0.7, `rgba(${r}, ${g}, ${b}, ${alpha * 0.3})`);
                    grad.addColorStop(1, `rgba(${r}, ${g}, ${b}, 0)`);
                    
                    ctx.fillStyle = grad;
                    ctx.shadowColor = 'rgba(0,0,0,0)';
                    ctx.shadowBlur = 0;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size * 1.5, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // Soft core glow
                    const coreGrad = ctx.createRadialGradient(
                        this.x - this.size * 0.1,
                        this.y - this.size * 0.1,
                        0,
                        this.x, this.y, this.size * 0.6
                    );
                    coreGrad.addColorStop(0, `rgba(${Math.min(255, r + 30)}, ${Math.min(255, g + 30)}, ${Math.min(255, b + 30)}, ${alpha * 0.3})`);
                    coreGrad.addColorStop(1, `rgba(${r}, ${g}, ${b}, 0)`);
                    ctx.fillStyle = coreGrad;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size * 0.6, 0, Math.PI * 2);
                    ctx.fill();
                }

                hexToRgb(hex) {
                    const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
                    return result ? {
                        r: parseInt(result[1], 16),
                        g: parseInt(result[2], 16),
                        b: parseInt(result[3], 16)
                    } : { r: 255, g: 200, b: 200 };
                }
            }

            // ---- Create Particles ----
            function createParticles() {
                particles = [];
                for (let i = 0; i < NUM_PARTICLES; i++) {
                    particles.push(new Particle());
                }
            }

            // ---- Get colors ----
            function getColors() {
                return [
                    color1Picker.value || '#ffb3c6',
                    color2Picker.value || '#b8d4e3',
                    color3Picker.value || '#d4c4e8'
                ];
            }

            // ---- Draw Background ----
            function drawBackground(colors) {
                // Soft gradient background
                const grad = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, W);
                const c1 = colors[0];
                const c2 = colors[1];
                const c3 = colors[2];
                const rgb1 = hexToRgb(c1);
                const rgb2 = hexToRgb(c2);
                const rgb3 = hexToRgb(c3);
                
                const r = (rgb1.r + rgb2.r + rgb3.r) / 3;
                const g = (rgb1.g + rgb2.g + rgb3.g) / 3;
                const b = (rgb1.b + rgb2.b + rgb3.b) / 3;
                
                grad.addColorStop(0, `rgba(${Math.min(255, r + 20)}, ${Math.min(255, g + 20)}, ${Math.min(255, b + 20)}, 0.3)`);
                grad.addColorStop(0.5, `rgba(${r * 0.5 + 20}, ${g * 0.5 + 20}, ${b * 0.5 + 20}, 0.15)`);
                grad.addColorStop(1, `rgba(10, 10, 20, 0.9)`);
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, W, H);
            }

            // ---- Helper: hex to RGB ----
            function hexToRgb(hex) {
                const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
                return result ? {
                    r: parseInt(result[1], 16),
                    g: parseInt(result[2], 16),
                    b: parseInt(result[3], 16)
                } : { r: 255, g: 200, b: 200 };
            }

            // ---- Animation Loop ----
            function animate() {
                if (!isAnimating) {
                    requestAnimationFrame(animate);
                    return;
                }
                
                time += 0.01 * (speed / 5);
                const colors = getColors();
                
                // Draw background
                drawBackground(colors);
                
                // Update and draw particles
                for (let p of particles) {
                    p.update(colors);
                    p.draw(ctx, colors);
                }
                
                // Ambient sparkles
                for (let i = 0; i < 12; i++) {
                    const x = (i * 197 + 40 + Math.sin(time * 0.02 + i * 2) * 30) % W;
                    const y = (i * 131 + time * (0.01 + i * 0.005) * 2) % H;
                    const size = 1 + Math.sin(time * 0.03 + i * 2.5) * 0.5 + 0.5;
                    const alpha = 0.03 + Math.sin(time * 0.02 + i * 1.5) * 0.02;
                    const hue = (i * 30 + time * 10) % 360;
                    ctx.fillStyle = `hsla(${hue}, 70%, 80%, ${alpha})`;
                    ctx.shadowColor = `hsla(${hue}, 100%, 80%, ${alpha * 0.3})`;
                    ctx.shadowBlur = 8;
                    ctx.beginPath();
                    ctx.arc(x, y, size, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.shadowBlur = 0;
                
                requestAnimationFrame(animate);
            }

            // ---- Toggle Animation ----
            function toggleAnimation() {
                isAnimating = !isAnimating;
                toggleBtn.textContent = isAnimating ? '⏸️ PAUSE' : '▶️ PLAY';
            }

            // ---- Reset ----
            function resetParticles() {
                createParticles();
                time = 0;
            }

            // ---- Speed Control ----
            speedSlider.addEventListener('input', function() {
                speed = parseInt(this.value);
                speedLabel.textContent = speed;
            });

            // ---- Color Change ----
            color1Picker.addEventListener('input', resetParticles);
            color2Picker.addEventListener('input', resetParticles);
            color3Picker.addEventListener('input', resetParticles);

            // ---- Event Listeners ----
            toggleBtn.addEventListener('click', toggleAnimation);
            resetBtn.addEventListener('click', resetParticles);

            // ---- Keyboard Shortcuts ----
            document.addEventListener('keydown', function(e) {
                if (e.key === ' ' || e.key === 'Space') {
                    e.preventDefault();
                    toggleAnimation();
                }
                if (e.key === 'r' || e.key === 'R') {
                    resetParticles();
                }
            });

            // ---- Initialize ----
            createParticles();
            animate();

            console.log('🌈 Pastel Blend · Colors blend in a soft, dreamy dance');
        })();
    </script>
</body>
</html>
