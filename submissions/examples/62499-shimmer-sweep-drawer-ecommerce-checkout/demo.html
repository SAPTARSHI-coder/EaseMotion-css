<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shimmer Sweep Drawer</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="layout">

<section class="hero">

<h1>Checkout Drawer</h1>

<p>
A modern Shimmer-Sweep Drawer built using pure HTML & CSS for
E-Commerce Checkout Layouts.
</p>

<button class="shop-btn">
Continue Shopping
</button>

</section>

<aside class="drawer">

<div class="shimmer"></div>

<div class="drawer-header">

<h2>Your Cart</h2>

<button class="close-btn">&times;</button>

</div>

<div class="product">

<div class="icon">📱</div>

<div>

<h4>Smartphone</h4>

<p>$699</p>

</div>

</div>

<div class="product">

<div class="icon">🎧</div>

<div>

<h4>Wireless Headphones</h4>

<p>$149</p>

</div>

</div>

<div class="coupon">

<input
type="text"
placeholder="Coupon Code">

<button>
Apply
</button>

</div>

<div class="summary">

<div>

<span>Subtotal</span>

<strong>$848</strong>

</div>

<div>

<span>Shipping</span>

<strong>Free</strong>

</div>

<div class="total">

<span>Total</span>

<strong>$848</strong>

</div>

</div>

<div class="secure">

🔒 Secure Checkout

</div>

<button class="checkout-btn">

Proceed to Payment

</button>

</aside>

</div>

</body>
</html>
