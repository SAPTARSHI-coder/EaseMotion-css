<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floating Footer: Cyberpunk</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Dummy content to show the footer floating over the page -->
    <div class="dummy-content">
        <header class="header">
            <h1 class="cyber-title">SYSTEM PROTOCOL 7G</h1>
            <p>Scroll down to see the persistent cyberpunk footer.</p>
        </header>
        <div class="tall-box"></div>
        <div class="tall-box"></div>
    </div>

    <!-- The Cyberpunk Floating Footer -->
    <footer class="cyber-floating-footer">
        
        <div class="footer-container">
            
            <!-- Left Side: System Status -->
            <div class="footer-status">
                <span class="status-indicator"></span>
                <span class="status-text" data-text="UPLINK ACTIVE">UPLINK ACTIVE</span>
            </div>
            
            <!-- Center: Navigation/Actions -->
            <nav class="footer-nav">
                <a href="#" class="cyber-btn" data-text="[ TERMINAL ]">[ TERMINAL ]</a>
                <a href="#" class="cyber-btn" data-text="[ DATABANK ]">[ DATABANK ]</a>
                <a href="#" class="cyber-btn" data-text="[ SECURE ]">[ SECURE ]</a>
            </nav>
            
            <!-- Right Side: Cyber Motif / Version -->
            <div class="footer-version">
                v2.0.77 // OVERRIDE
            </div>
            
        </div>
        
    </footer>

</body>
</html>
