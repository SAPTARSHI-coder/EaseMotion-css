<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Drawer: Aurora Glow</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 
      [TECHNIQUE] The Pure CSS Checkbox Hack 
      Manages the open/close state of the entire drawer system without JavaScript.
    -->
    <input type="checkbox" id="drawer-toggle" class="drawer-checkbox" aria-hidden="true">

    <div class="layout-container">
        
        <header class="section-header">
            <h1 class="title">Pure CSS Drawer: Aurora Glow</h1>
            <p class="subtitle">A hardware-accelerated, JavaScript-free sidebar. Features a vibrant, animated gradient aurora that blooms behind a heavily frosted glass drawer panel.</p>
            
            <label for="drawer-toggle" class="open-btn">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                Open Drawer
            </label>
        </header>

    </div>

    <!-- 
      [TECHNIQUE] The Overlay
      Dims the rest of the page when the drawer is open.
      Clicking it closes the drawer (since it's a label for the checkbox).
    -->
    <label for="drawer-toggle" class="drawer-overlay" aria-label="Close drawer"></label>

    <!-- 
      [TECHNIQUE] The Aurora Glow Drawer System
    -->
    <aside class="drawer-panel" role="dialog" aria-modal="true">
        
        <!-- 
          The Aurora Glow Engine
          A separate div that sits behind the glass content.
          It contains the animated, vibrant multi-stop gradient.
        -->
        <div class="aurora-engine"></div>
        
        <!-- 
          The Glassmorphism Content Wrapper
          This layer applies the heavy `backdrop-filter: blur()` to physically
          diffuse the harsh lines of the aurora engine behind it.
        -->
        <div class="drawer-content-glass">
            
            <div class="drawer-header">
                <h2>Navigation</h2>
                <label for="drawer-toggle" class="close-btn" aria-label="Close drawer">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </label>
            </div>
            
            <nav class="drawer-nav">
                <a href="#" class="nav-item">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                    Dashboard
                </a>
                <a href="#" class="nav-item">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
                    Projects
                </a>
                <a href="#" class="nav-item">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                    Settings
                </a>
            </nav>
            
            <div class="drawer-footer">
                <button class="sign-out-btn">Sign Out</button>
            </div>
            
        </div>
        
    </aside>

</body>
</html>
