<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dodge Reaction – Moves Away from Cursor Like Dodging</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <h1>🏃 Dodge Reaction</h1>
    <p class="subtitle">Moves away from cursor like dodging</p>

    <div class="dodge-container">
      <div class="dodge-stage" id="dodgeStage">
        <canvas id="canvas"></canvas>
        
        <!-- Dodging character -->
        <div class="dodge-character" id="dodgeCharacter">
          <div class="character-inner">
            <span class="character-icon">😱</span>
            <span class="character-label">Dodge!</span>
          </div>
          <div class="character-trail" id="characterTrail"></div>
        </div>

        <!-- Info overlay -->
        <div class="info-overlay">
          <span class="dodge-status" id="dodgeStatus">🏃 Ready</span>
          <span class="dodge-count" id="dodgeCount">✦ 0 dodges</span>
        </div>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <button class="ctrl-btn toggle" id="toggleBtn">⏸ Pause</button>
      <button class="ctrl-btn reset" id="resetBtn">↺ Reset</button>
      <button class="ctrl-btn mode" id="modeBtn">🎯 Mode</button>
    </div>

    <!-- Sliders -->
    <div class="slider-container">
      <span class="slider-label">Dodge Speed</span>
      <input type="range" id="speedSlider" min="1" max="20" value="8" />
      <span class="slider-value" id="speedValue">8×</span>
    </div>

    <div class="slider-container">
      <span class="slider-label">Dodge Distance</span>
      <input type="range" id="distanceSlider" min="20" max="150" value="70" />
      <span class="slider-value" id="distanceValue">70px</span>
    </div>

    <div class="slider-container">
      <span class="slider-label">Dodge Zone</span>
      <input type="range" id="zoneSlider" min="30" max="200" value="100" />
      <span class="slider-value" id="zoneValue">100px</span>
    </div>

    <div class="slider-container">
      <span class="slider-label">Character Size</span>
      <input type="range" id="sizeSlider" min="30" max="80" value="50" />
      <span class="slider-value" id="sizeValue">50px</span>
    </div>

    <!-- Status -->
    <div class="status" id="status">🏃 Move your cursor near the character to make it dodge!</div>

    <!-- Keyboard shortcuts -->
    <div class="shortcuts">
      <kbd>Mouse</kbd> Dodge · <kbd>Space</kbd> Pause · <kbd>R</kbd> Reset · <kbd>M</kbd> Mode
    </div>
  </div>

  <script>
    (function() {
      "use strict";

      // DOM elements
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      const dodgeCharacter = document.getElementById('dodgeCharacter');
      const characterTrail = document.getElementById('characterTrail');
      const dodgeStatus = document.getElementById('dodgeStatus');
      const dodgeCount = document.getElementById('dodgeCount');
      const toggleBtn = document.getElementById('toggleBtn');
      const resetBtn = document.getElementById('resetBtn');
      const modeBtn = document.getElementById('modeBtn');
      const status = document.getElementById('status');
      const speedSlider = document.getElementById('speedSlider');
      const speedValue = document.getElementById('speedValue');
      const distanceSlider = document.getElementById('distanceSlider');
      const distanceValue = document.getElementById('distanceValue');
      const zoneSlider = document.getElementById('zoneSlider');
      const zoneValue = document.getElementById('zoneValue');
      const sizeSlider = document.getElementById('sizeSlider');
      const sizeValue = document.getElementById('sizeValue');

      // State
      let posX = 0;
      let posY = 0;
      let targetX = 0;
      let targetY = 0;
      let isPaused = false;
      let animationId = null;
      let time = 0;
      let dodgeCountVal = 0;
      let isDodging = false;
      let dodgeMode = 'flee'; // 'flee', 'jitter', 'circle'
      let trailPositions = [];
      let particles = [];
      let mouseX = 0;
      let mouseY = 0;
      let isMouseOnCanvas = false;

      // ----- Canvas setup -----
      function setupCanvas() {
        const rect = canvas.parentElement.getBoundingClientRect();
        const size = Math.min(rect.width - 40, 600);
        canvas.width = size;
        canvas.height = size;
        canvas.style.width = size + 'px';
        canvas.style.height = size + 'px';
        // Center character
        const cx = size / 2;
        const cy = size / 2;
        const charSize = parseInt(sizeSlider.value);
        posX = cx - charSize / 2;
        posY = cy - charSize / 2;
        targetX = posX;
        targetY = posY;
        updateCharacterPosition();
      }

      // ----- Particle class -----
      class Particle {
        constructor(x, y) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 0.5 + Math.random() * 2;
          this.x = x;
          this.y = y;
          this.vx = Math.cos(angle) * speed;
          this.vy = Math.sin(angle) * speed;
          this.size = 1 + Math.random() * 3;
          this.life = 1;
          this.decay = 0.01 + Math.random() * 0.02;
          this.hue = 30 + Math.random() * 40;
          this.saturation = 80 + Math.random() * 20;
          this.lightness = 60 + Math.random() * 30;
          this.opacity = 0.5 + Math.random() * 0.5;
          this.gravity = 0.02;
          this.friction = 0.99;
        }

        update() {
          this.vx *= this.friction;
          this.vy *= this.friction;
          this.vy += this.gravity;
          this.x += this.vx;
          this.y += this.vy;
          this.life -= this.decay;
          this.size *= 0.999;
          return this.life > 0 && this.size > 0.1;
        }

        draw(ctx) {
          const alpha = this.life * this.opacity;
          const size = this.size * this.life;

          // Glow
          const gradient = ctx.createRadialGradient(
            this.x, this.y, 0,
            this.x, this.y, size * 3
          );
          gradient.addColorStop(0, `hsla(${this.hue + 20}, 100%, 90%, ${alpha * 0.2})`);
          gradient.addColorStop(1, `hsla(${this.hue}, 100%, 60%, 0)`);
          ctx.fillStyle = gradient;
          ctx.beginPath();
          ctx.arc(this.x, this.y, size * 3, 0, Math.PI * 2);
          ctx.fill();

          // Core
          ctx.fillStyle = `hsla(${this.hue + 30}, 100%, 95%, ${alpha * 0.9})`;
          ctx.beginPath();
          ctx.arc(this.x, this.y, size, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // ----- Create dodge particles -----
      function createDodgeParticles(x, y) {
        const count = 10 + Math.floor(Math.random() * 15);
        for (let i = 0; i < count; i++) {
          particles.push(new Particle(x, y));
        }
      }

      // ----- Update character position -----
      function updateCharacterPosition() {
        const size = parseInt(sizeSlider.value);
        dodgeCharacter.style.width = size + 'px';
        dodgeCharacter.style.height = size + 'px';
        dodgeCharacter.style.left = posX + 'px';
        dodgeCharacter.style.top = posY + 'px';
      }

      // ----- Dodge logic -----
      function updateDodge() {
        const speed = parseInt(speedSlider.value) / 10;
        const distance = parseInt(distanceSlider.value);
        const zone = parseInt(zoneSlider.value);
        const size = parseInt(sizeSlider.value);
        const cx = posX + size / 2;
        const cy = posY + size / 2;

        // Mouse position relative to character center
        const dx = mouseX - cx;
        const dy = mouseY - cy;
        const dist = Math.sqrt(dx * dx + dy * dy);

        // Check if mouse is in dodge zone
        const inZone = dist < zone && dist > 5;

        if (inZone && !isPaused) {
          // Dodge!
          if (!isDodging) {
            isDodging = true;
            dodgeCountVal++;
            dodgeCount.textContent = `✦ ${dodgeCountVal} dodges`;
            dodgeStatus.textContent = '🏃 Dodging!';
            status.textContent = '🏃 Dodged!';
            createDodgeParticles(cx, cy);
            if (navigator.vibrate) {
              navigator.vibrate(10);
            }
          }

          // Calculate dodge direction (away from mouse)
          const angle = Math.atan2(dy, dx);
          let targetDX = -Math.cos(angle) * distance;
          let targetDY = -Math.sin(angle) * distance;

          // Different dodge modes
          switch(dodgeMode) {
            case 'flee':
              // Flee directly away
              break;
            case 'jitter':
              // Flee with random jitter
              targetDX += (Math.random() - 0.5) * 30;
              targetDY += (Math.random() - 0.5) * 30;
              break;
            case 'circle':
              // Dodge in a circular pattern
              const perpAngle = angle + Math.PI / 2 * (Math.random() > 0.5 ? 1 : -1);
              targetDX = Math.cos(perpAngle) * distance * 0.7;
              targetDY = Math.sin(perpAngle) * distance * 0.7;
              break;
          }

          // Calculate target position
          const newX = posX + targetDX;
          const newY = posY + targetDY;

          // Keep within bounds
          const padding = 10;
          const w = canvas.width;
          const h = canvas.height;
          targetX = Math.max(padding, Math.min(w - size - padding, newX));
          targetY = Math.max(padding, Math.min(h - size - padding, newY));

          // Smoothly move toward target
          const moveSpeed = speed * 0.1;
          posX += (targetX - posX) * moveSpeed;
          posY += (targetY - posY) * moveSpeed;

          // Trail
          trailPositions.push({ x: posX + size/2, y: posY + size/2 });
          if (trailPositions.length > 20) {
            trailPositions.shift();
          }

          // Update character rotation (lean into dodge)
          const rotation = Math.atan2(targetDY, targetDX) * 0.2;
          dodgeCharacter.style.transform = `rotate(${rotation}rad)`;

        } else {
          // Not in dodge zone
          if (isDodging) {
            isDodging = false;
            dodgeStatus.textContent = '🏃 Ready';
            status.textContent = '🏃 Move your cursor near to dodge!';
            dodgeCharacter.style.transform = 'rotate(0rad)';
          }

          // Return to center slowly
          const w = canvas.width;
          const h = canvas.height;
          const centerX = (w - size) / 2;
          const centerY = (h - size) / 2;
          const returnSpeed = 0.02;
          posX += (centerX - posX) * returnSpeed;
          posY += (centerY - posY) * returnSpeed;

          // If very close to center, snap
          if (Math.abs(posX - centerX) < 0.5 && Math.abs(posY - centerY) < 0.5) {
            posX = centerX;
            posY = centerY;
          }

          // Shrink trail
          if (trailPositions.length > 0) {
            trailPositions.shift();
          }
        }

        updateCharacterPosition();
      }

      // ----- Draw trail -----
      function drawTrail() {
        if (trailPositions.length < 2) return;

        for (let i = 0; i < trailPositions.length - 1; i++) {
          const t = i / trailPositions.length;
          const alpha = 0.1 * (1 - t);
          const size = 3 * (1 - t);
          const p = trailPositions[i];
          const hue = 220 + t * 40;

          ctx.fillStyle = `hsla(${hue}, 100%, 70%, ${alpha})`;
          ctx.beginPath();
          ctx.arc(p.x, p.y, size, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // ----- Draw -----
      function draw() {
        const w = canvas.width;
        const h = canvas.height;

        // Clear
        ctx.clearRect(0, 0, w, h);

        // Background
        const bgGradient = ctx.createRadialGradient(w/2, h/2, 0, w/2, h/2, w * 0.7);
        bgGradient.addColorStop(0, '#0a0a1a');
        bgGradient.addColorStop(0.5, '#060612');
        bgGradient.addColorStop(1, '#020208');
        ctx.fillStyle = bgGradient;
        ctx.fillRect(0, 0, w, h);

        // Draw dodge zone (subtle ring)
        const zone = parseInt(zoneSlider.value);
        const cx = posX + parseInt(sizeSlider.value) / 2;
        const cy = posY + parseInt(sizeSlider.value) / 2;
        
        if (isMouseOnCanvas) {
          const dist = Math.sqrt(
            Math.pow(mouseX - cx, 2) + 
            Math.pow(mouseY - cy, 2)
          );
          const inZone = dist < zone && dist > 5;
          const alpha = inZone ? 0.08 : 0.03;
          ctx.strokeStyle = `rgba(100, 200, 255, ${alpha})`;
          ctx.lineWidth = 1;
          ctx.setLineDash([5, 10]);
          ctx.lineDashOffset = -time * 20;
          ctx.beginPath();
          ctx.arc(cx, cy, zone, 0, Math.PI * 2);
          ctx.stroke();
          ctx.setLineDash([]);
        }

        // Draw trail
        drawTrail();

        // Draw particles
        particles = particles.filter(p => p.update());
        particles.forEach(p => p.draw(ctx));

        // Update character
        updateDodge();

        // Update status
        dodgeCount.textContent = `✦ ${dodgeCountVal} dodges`;
      }

      // ----- Animation loop -----
      function animate() {
        time += 0.016;
        draw();
        animationId = requestAnimationFrame(animate);
      }

      // ----- Start animation -----
      function startAnimation() {
        if (animationId) {
          cancelAnimationFrame(animationId);
        }
        animate();
      }

      // ----- Toggle pause -----
      function togglePause() {
        isPaused = !isPaused;
        toggleBtn.textContent = isPaused ? '▶ Play' : '⏸ Pause';
        status.textContent = isPaused ? '⏸ Paused' : '▶ Resumed';
        dodgeStatus.textContent = isPaused ? '⏸ Paused' : '🏃 Ready';
      }

      // ----- Reset -----
      function resetDodge() {
        isPaused = false;
        isDodging = false;
        toggleBtn.textContent = '⏸ Pause';
        dodgeStatus.textContent = '🏃 Ready';
        const w = canvas.width;
        const h = canvas.height;
        const size = parseInt(sizeSlider.value);
        posX = (w - size) / 2;
        posY = (h - size) / 2;
        targetX = posX;
        targetY = posY;
        trailPositions = [];
        particles = [];
        dodgeCountVal = 0;
        dodgeCount.textContent = '✦ 0 dodges';
        dodgeCharacter.style.transform = 'rotate(0rad)';
        speedSlider.value = 8;
        speedValue.textContent = '8×';
        distanceSlider.value = 70;
        distanceValue.textContent = '70px';
        zoneSlider.value = 100;
        zoneValue.textContent = '100px';
        sizeSlider.value = 50;
        sizeValue.textContent = '50px';
        updateCharacterPosition();
        status.textContent = '↺ Reset';
        setTimeout(() => {
          status.textContent = '🏃 Move your cursor near the character to make it dodge!';
        }, 500);
      }

      // ----- Toggle dodge mode -----
      function toggleMode() {
        const modes = ['flee', 'jitter', 'circle'];
        const currentIndex = modes.indexOf(dodgeMode);
        const nextIndex = (currentIndex + 1) % modes.length;
        dodgeMode = modes[nextIndex];
        const modeNames = { flee: '🏃 Flee', jitter: '🎯 Jitter', circle: '🌀 Circle' };
        modeBtn.textContent = modeNames[dodgeMode];
        status.textContent = `🎯 Mode: ${modeNames[dodgeMode]}`;
        setTimeout(() => {
          if (!isPaused) {
            status.textContent = '🏃 Move your cursor near the character to make it dodge!';
          }
        }, 1500);
      }

      // ----- Event Listeners -----
      // Mouse tracking
      canvas.addEventListener('mousemove', (e) => {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        mouseX = (e.clientX - rect.left) * scaleX;
        mouseY = (e.clientY - rect.top) * scaleY;
        isMouseOnCanvas = true;
      });

      canvas.addEventListener('mouseenter', () => {
        isMouseOnCanvas = true;
      });

      canvas.addEventListener('mouseleave', () => {
        isMouseOnCanvas = false;
      });

      // Touch support
      canvas.addEventListener('touchmove', (e) => {
        e.preventDefault();
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        const touch = e.touches[0];
        mouseX = (touch.clientX - rect.left) * scaleX;
        mouseY = (touch.clientY - rect.top) * scaleY;
        isMouseOnCanvas = true;
      });

      canvas.addEventListener('touchstart', (e) => {
        const touch = e.touches[0];
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        mouseX = (touch.clientX - rect.left) * scaleX;
        mouseY = (touch.clientY - rect.top) * scaleY;
        isMouseOnCanvas = true;
      });

      canvas.addEventListener('touchend', () => {
        isMouseOnCanvas = false;
      });

      // Buttons
      toggleBtn.addEventListener('click', togglePause);
      resetBtn.addEventListener('click', resetDodge);
      modeBtn.addEventListener('click', toggleMode);

      // Sliders
      speedSlider.addEventListener('input', (e) => {
        speedValue.textContent = e.target.value + '×';
      });

      distanceSlider.addEventListener('input', (e) => {
        distanceValue.textContent = e.target.value + 'px';
      });

      zoneSlider.addEventListener('input', (e) => {
        zoneValue.textContent = e.target.value + 'px';
      });

      sizeSlider.addEventListener('input', (e) => {
        const val = parseInt(e.target.value);
        sizeValue.textContent = val + 'px';
        const w = canvas.width;
        const h = canvas.height;
        const cx = posX + 25; // old size / 2
        const cy = posY + 25;
        posX = cx - val / 2;
        posY = cy - val / 2;
        posX = Math.max(0, Math.min(w - val, posX));
        posY = Math.max(0, Math.min(h - val, posY));
        updateCharacterPosition();
      });

      // Keyboard shortcuts
      document.addEventListener('keydown', (e) => {
        if (e.key === ' ' || e.key === 'Space') {
          e.preventDefault();
          togglePause();
        }
        if (e.key === 'r' || e.key === 'R') {
          e.preventDefault();
          resetDodge();
        }
        if (e.key === 'm' || e.key === 'M') {
          e.preventDefault();
          toggleMode();
        }
      });

      // ----- Resize handler -----
      let resizeTimeout;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(() => {
          const w = canvas.width;
          const h = canvas.height;
          const size = parseInt(sizeSlider.value);
          posX = Math.max(0, Math.min(w - size, posX));
          posY = Math.max(0, Math.min(h - size, posY));
          setupCanvas();
        }, 200);
      });

      // ----- Init -----
      function init() {
        setupCanvas();
        startAnimation();
        status.textContent = '🏃 Move your cursor near the character to make it dodge!';
        modeBtn.textContent = '🏃 Flee';
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }

    })();
  </script>
</body>
</html>
