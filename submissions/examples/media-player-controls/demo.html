<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="CSS Media Player Controls demo">
    <title>CSS Media Player Controls</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="demo-container">
        <h1>CSS Media Player Controls</h1>
        <p class="subtitle">
            Responsive and accessible audio player controls.
        </p>

        <section class="media-player" aria-label="Audio player">

            <div class="track-info">
                <div class="album-art" aria-hidden="true">♪</div>

                <div>
                    <h2>EaseMotion Demo</h2>
                    <p>CSS Media Player</p>
                </div>
            </div>

            <audio
                id="audio"
                controls
                preload="metadata"
                aria-label="EaseMotion demo audio"
            >
                <source
                    src="https://www.w3schools.com/html/horse.ogg"
                    type="audio/ogg"
                >
                <source
                    src="https://www.w3schools.com/html/horse.mp3"
                    type="audio/mpeg"
                >
                Your browser does not support the audio element.
            </audio>

            <div class="player-actions">
                <button
                    type="button"
                    class="control-button"
                    aria-label="Previous track"
                    title="Previous track"
                >
                    ⏮
                </button>

                <button
                    type="button"
                    class="control-button play-button"
                    aria-label="Play or pause"
                    title="Play or pause"
                >
                    ▶
                </button>

                <button
                    type="button"
                    class="control-button"
                    aria-label="Next track"
                    title="Next track"
                >
                    ⏭
                </button>
            </div>

            <label class="volume-control">
                <span>Volume</span>
                <input
                    type="range"
                    min="0"
                    max="100"
                    value="70"
                    aria-label="Volume"
                >
            </label>

        </section>
    </main>

</body>
</html>
