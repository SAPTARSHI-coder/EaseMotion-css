<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-audio-equalizer-bars</title>
</head>
<body>
<main class="aeq-panel">
  <header class="aeq-top">
    <h1 class="aeq-title">Equalizer</h1>
    <span class="aeq-track">Neon Pulse</span>
  </header>
  <section class="aeq-band aeq-bass" aria-label="bass band">
    <span class="aeq-bar aeq-bar-1"></span>
    <span class="aeq-bar aeq-bar-2"></span>
    <span class="aeq-bar aeq-bar-3"></span>
    <span class="aeq-bar aeq-bar-4"></span>
    <span class="aeq-bar aeq-bar-5"></span>
    <span class="aeq-bar aeq-bar-6"></span>
    <span class="aeq-bar aeq-bar-7"></span>
    <span class="aeq-bar aeq-bar-8"></span>
  </section>
  <section class="aeq-band aeq-mid" aria-label="mid band">
    <span class="aeq-bar aeq-mid-1"></span>
    <span class="aeq-bar aeq-mid-2"></span>
    <span class="aeq-bar aeq-mid-3"></span>
    <span class="aeq-bar aeq-mid-4"></span>
    <span class="aeq-bar aeq-mid-5"></span>
    <span class="aeq-bar aeq-mid-6"></span>
  </section>
  <section class="aeq-band aeq-treble" aria-label="treble band">
    <span class="aeq-bar aeq-tre-1"></span>
    <span class="aeq-bar aeq-tre-2"></span>
    <span class="aeq-bar aeq-tre-3"></span>
    <span class="aeq-bar aeq-tre-4"></span>
    <span class="aeq-bar aeq-tre-5"></span>
  </section>
  <section class="aeq-labels" aria-label="band labels">
    <span>Bass</span>
    <span>Mid</span>
    <span>Treble</span>
  </section>
  <footer class="aeq-foot">
    <span class="aeq-peak">Peak -2 dB</span>
    <span class="aeq-time">00:42</span>
  </footer>
</main>
</body>
</html>
