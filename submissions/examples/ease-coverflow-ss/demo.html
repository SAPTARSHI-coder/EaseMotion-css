<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pure CSS 3D Coverflow Carousel - EaseMotion</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="ease-coverflow-scene">
    <div class="ease-coverflow" role="region" aria-label="3D Coverflow Media Gallery">
      <div class="ease-coverflow-card" tabindex="0" aria-label="Slide 1: Velocity">
        <span class="ease-card-tag">Motion 01</span>
        <h2 class="ease-card-title">Velocity</h2>
      </div>
      <div class="ease-coverflow-card" tabindex="0" aria-label="Slide 2: Horizon">
        <span class="ease-card-tag">Motion 02</span>
        <h2 class="ease-card-title">Horizon</h2>
      </div>
      <div class="ease-coverflow-card" tabindex="0" aria-label="Slide 3: Quantum">
        <span class="ease-card-tag">Motion 03</span>
        <h2 class="ease-card-title">Quantum</h2>
      </div>
      <div class="ease-coverflow-card" tabindex="0" aria-label="Slide 4: Nebula">
        <span class="ease-card-tag">Motion 04</span>
        <h2 class="ease-card-title">Nebula</h2>
      </div>
      <div class="ease-coverflow-card" tabindex="0" aria-label="Slide 5: Eclipse">
        <span class="ease-card-tag">Motion 05</span>
        <h2 class="ease-card-title">Eclipse</h2>
      </div>
    </div>
  </main>
  <p style="position: absolute; bottom: 2rem; color: #64748b; font-size: 0.875rem; text-transform: uppercase; letter-spacing: 2px;">Hover cards to cycle perspective purely in CSS</p>
</body>
</html>
