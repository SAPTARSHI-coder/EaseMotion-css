<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Testimonial Card — EaseMotion CSS</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="page">
        <section class="demo" aria-labelledby="demo-title">
            <div class="intro">
                <p class="eyebrow">EaseMotion CSS · Card</p>

                <h1 id="demo-title">Testimonial Card</h1>

                <p>
                    A polished review card with a floating quote, star rating, and compact author chip.
                </p>
            </div>

            <article class="testimonial">
                <span class="quote-mark" aria-hidden="true">“</span>

                <div class="rating" aria-label="5 out of 5 stars">
                    <span aria-hidden="true">★</span>
                    <span aria-hidden="true">★</span>
                    <span aria-hidden="true">★</span>
                    <span aria-hidden="true">★</span>
                    <span aria-hidden="true">★</span>
                </div>

                <blockquote>
                    <p>
                        “EaseMotion gave our interface the polish it needed. Every interaction feels intentional without becoming distracting.”
                    </p>
                </blockquote>

                <footer class="author">
                    <div class="avatar" aria-hidden="true">AR</div>

                    <div class="author-info">
                        <strong>Alex Rivera</strong>
                        <span>Product Designer</span>
                    </div>

                    <span class="verified" aria-label="Verified testimonial">
                        ✓
                    </span>
                </footer>
            </article>
        </section>
    </main>
</body>

</html>
