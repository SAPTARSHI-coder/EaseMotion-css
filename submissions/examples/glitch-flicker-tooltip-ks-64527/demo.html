<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glitch-Flicker Tooltip</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <section class="showcase" aria-labelledby="page-title">
            <header>
                <p class="eyebrow">CSS INTERFACE EFFECT</p>
                <h1 id="page-title">Glitch-Flicker Tooltip</h1>
                <p class="intro">
                    Accessible, lightweight tooltips built purely with semantic HTML and CSS. Featuring a subtle glitch-flicker reveal.
                </p>
            </header>

            <div class="tooltip-showcase">
                <!-- Tooltip 1: Top -->
                <div class="tooltip tooltip-top">
                    <button class="tooltip-trigger" type="button" aria-describedby="tooltip-core">
                        Core
                    </button>
                    <span class="tooltip-content" id="tooltip-core" role="tooltip" data-text="Core interface active">
                        Core interface active
                    </span>
                </div>

                <!-- Tooltip 2: Bottom -->
                <div class="tooltip tooltip-bottom">
                    <button class="tooltip-trigger" type="button" aria-describedby="tooltip-signal">
                        Signal
                    </button>
                    <span class="tooltip-content" id="tooltip-signal" role="tooltip" data-text="Signal processing stable">
                        Signal processing stable
                    </span>
                </div>

                <!-- Tooltip 3: Right -->
                <div class="tooltip tooltip-right">
                    <button class="tooltip-trigger" type="button" aria-describedby="tooltip-network">
                        Network
                    </button>
                    <span class="tooltip-content" id="tooltip-network" role="tooltip" data-text="Network mesh connected">
                        Network mesh connected
                    </span>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
