<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Document Typewriter Demo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="stage">
    <header class="stage-header">
      <h1>Document Typewriter</h1>
      <p>Plain CSS animation demo with a pause toggle.</p>
    </header>
    <section class="scene" aria-label="Document Typewriter animation">
      <p class="typewriter"></p>
    </section>
    <button class="toggle" type="button">Pause</button>
  </main>
  <script>
    (function () {
      var toggle = document.querySelector(".toggle");
      var scene = document.querySelector(".scene");
      toggle.addEventListener("click", function () {
        var paused = scene.classList.toggle("paused");
        toggle.textContent = paused ? "Play" : "Pause";
      });
    var typeEl = document.querySelector(".typewriter");
    var typeText = "Document Typewriter";
    var typeIndex = 0;
    function typeTick() {
      typeEl.textContent = typeText.slice(0, typeIndex);
      typeIndex += 1;
      if (typeIndex <= typeText.length) {
        window.setTimeout(typeTick, 90);
      }
    }
    typeTick();
    })();
  </script>
</body>
</html>
