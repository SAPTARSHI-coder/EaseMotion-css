<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Multi-Step Animated Progress Stepper</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

</head>

<body>

<section class="hero">

<div class="stepper-card">

<span class="badge">
Vibrant Gradient Version
</span>

<h1>
Progress Stepper
<span>Wizard</span>
</h1>

<p class="subtitle">
Animated multi-step wizard with vibrant gradients, smooth transitions
and responsive progress tracking.
</p>

<div class="progress-container">

<div class="progress-bar">
<div class="progress-fill" id="progressFill"></div>
</div>

<div class="steps">

<div class="step active">
<span>1</span>
<p>Account</p>
</div>

<div class="step">
<span>2</span>
<p>Profile</p>
</div>

<div class="step">
<span>3</span>
<p>Payment</p>
</div>

<div class="step">
<span>4</span>
<p>Finish</p>
</div>

</div>

</div>

<div class="controls">

<button id="prevBtn">
Previous
</button>

<button id="nextBtn">
Next
</button>

</div>

</div>

</section>

<script src="script.js"></script>

</body>
</html>
