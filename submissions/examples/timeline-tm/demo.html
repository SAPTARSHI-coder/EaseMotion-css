<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Timeline — EaseMotion CSS</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="timeline-page-tm" data-palette="cool">
  <h1 class="timeline-h-tm">Timeline</h1>
  <p class="timeline-lede-tm">A self-contained demo with three variants of the effect.</p>
  <section class="timeline-row-tm">
    <article class="timeline-1-wrap-tm">
      <div class="timeline-1-tm"></div>
      <span class="timeline-lbl-tm">Example One</span>
    </article>
    <article class="timeline-2-wrap-tm">
      <div class="timeline-2-tm"></div>
      <span class="timeline-lbl-tm">Example Two</span>
    </article>
    <article class="timeline-3-wrap-tm">
      <div class="timeline-3-tm"></div>
      <span class="timeline-lbl-tm">Example Three</span>
    </article>
  </section>
</main>
</body>
</html>
