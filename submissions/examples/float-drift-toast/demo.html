<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CSS Float-Drift Toast for fintech dashboard layouts">
  <title>Float-Drift Toast</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="dashboard">

```
<header class="header">
  <div>
    <span class="label">FINTECH DASHBOARD</span>
    <h1>Transaction Center</h1>
  </div>

  <div class="account">
    <span class="account-dot"></span>
    Account Active
  </div>
</header>

<section class="dashboard-content">

  <article class="balance-card">
    <span>Current Balance</span>
    <strong>$64,820.00</strong>
    <small>Available for transfer</small>
  </article>

  <article class="balance-card">
    <span>Monthly Spending</span>
    <strong>$8,420.00</strong>
    <small>12% lower than last month</small>
  </article>

  <article class="balance-card">
    <span>Investments</span>
    <strong>$92,640.00</strong>
    <small>Portfolio is growing</small>
  </article>

</section>

<aside class="toast" role="status" aria-live="polite">
  <div class="toast-icon">✓</div>

  <div class="toast-content">
    <strong>Payment Successful</strong>
    <p>Your payment of $1,250.00 was completed successfully.</p>
  </div>

  <button class="close" type="button" aria-label="Close notification">
    ×
  </button>
</aside>
```

  </main>

</body>
</html>
