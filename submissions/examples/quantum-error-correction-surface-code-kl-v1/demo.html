<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Error Correction Surface Code - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030712; color: #ffffff;">

    <div class="ease-card ease-card-glass surface-container">
        <div class="surface-header">
            <h2>Surface Code Matrix</h2>
            <span class="ease-badge ease-badge-success">Stabilized</span>
        </div>
        
        <div class="surface-screen ease-center">
            <div class="syndrome-lattice lattice-1"></div>
            <div class="syndrome-lattice lattice-2"></div>
            <div class="logical-qubit-boundary"></div>
            <div class="stabilizer-core ease-center"></div>
        </div>

        <div class="surface-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Syndrome: X-Z Check OK</span>
            <button class="ease-btn ease-btn-primary ease-btn-sm ease-hover-grow">Run Syndrome Cycle</button>
        </div>
    </div>

</body>
</html>
