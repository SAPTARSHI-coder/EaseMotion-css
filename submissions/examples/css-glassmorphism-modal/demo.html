<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Modal with Glassmorphism Styling | EaseMotion CSS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="glass-modal">
            <div class="modal-header">
                <h2 id="modalTitle" class="modal-title">Glassmorphism Overlay</h2>
                <button class="modal-close" aria-label="Close modal">&times;</button>
            </div>
            <div class="modal-body">
                <p>A fully responsive modal dialog component built with frosted glass effects, smooth scaling entry animations, and flexible layout grids.</p>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary">Cancel</button>
                <button class="btn btn-primary">Confirm</button>
            </div>
        </div>
    </div>
</body>
</html>
