<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Swipe Confirm Input</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="ease-swipe-wrapper" id="swipe-btn">
    <div class="ease-swipe-track"></div>
    <div class="ease-swipe-text">Slide to confirm</div>
    <div class="ease-swipe-success-text">Confirmed ✓</div>
    <div class="ease-swipe-thumb">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
    </div>
    <input type="range" min="0" max="100" value="0" class="ease-swipe-input" id="swipe-input" aria-label="Swipe to confirm">
  </div>

  <p style="position: absolute; bottom: 2rem; color: #475569; font-family: system-ui; font-size: 0.875rem;">Uses a hidden native range input for bulletproof touch/keyboard accessibility.</p>

  <script>
    const wrapper = document.getElementById('swipe-btn');
    const input = document.getElementById('swipe-input');

    input.addEventListener('input', (e) => {
      wrapper.classList.remove('ease-snap-back');
      wrapper.style.setProperty('--swipe-val', e.target.value);
    });

    input.addEventListener('change', (e) => {
      if (e.target.value >= 99) {
        wrapper.classList.add('is-confirmed');
      } else {
        wrapper.classList.add('ease-snap-back');
        input.value = 0;
        wrapper.style.setProperty('--swipe-val', 0);
      }
    });
  </script>
</body>
</html>
