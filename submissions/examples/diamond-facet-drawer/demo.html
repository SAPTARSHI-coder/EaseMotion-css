<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Pure CSS Diamond Facet Edge drawer component."
  >

  <title>Diamond Facet Edge Drawer</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="page">
    <section class="demo" aria-labelledby="title">
      <p class="eyebrow">EaseMotion CSS</p>

      <h1 id="title">Diamond Facet Edge</h1>

      <p class="intro">
        A geometric CSS drawer featuring a faceted diamond edge,
        smooth transitions, and layered depth.
      </p>

      <!-- Native checkbox controls the drawer without JavaScript -->
      <input
        class="drawer-toggle"
        type="checkbox"
        id="drawer-toggle"
        aria-label="Toggle navigation drawer"
      >

      <label class="open-button" for="drawer-toggle">
        <span class="menu-icon" aria-hidden="true">
          <span></span>
          <span></span>
          <span></span>
        </span>

        <span>Open Drawer</span>
      </label>

      <!-- Backdrop -->
      <label
        class="drawer-backdrop"
        for="drawer-toggle"
        aria-label="Close drawer"
      ></label>

      <!-- Drawer -->
      <aside class="drawer" aria-label="Navigation drawer">

        <!-- Diamond facet edge -->
        <div class="facet-edge" aria-hidden="true">
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
        </div>

        <div class="drawer-content">

          <header class="drawer-header">
            <div class="brand">
              <span class="brand-icon" aria-hidden="true">◇</span>

              <div>
                <strong>Facet</strong>
                <small>Navigation</small>
              </div>
            </div>

            <label
              class="close-button"
              for="drawer-toggle"
              aria-label="Close drawer"
            >
              <span aria-hidden="true"></span>
              <span aria-hidden="true"></span>
            </label>
          </header>

          <div class="divider"></div>

          <nav class="navigation" aria-label="Main navigation">

            <a href="#home" class="nav-item active">
              <span class="nav-icon" aria-hidden="true">⌂</span>

              <span class="nav-text">
                <strong>Home</strong>
                <small>Overview</small>
              </span>
            </a>

            <a href="#explore" class="nav-item">
              <span class="nav-icon" aria-hidden="true">✧</span>

              <span class="nav-text">
                <strong>Explore</strong>
                <small>Discover more</small>
              </span>
            </a>

            <a href="#projects" class="nav-item">
              <span class="nav-icon" aria-hidden="true">◇</span>

              <span class="nav-text">
                <strong>Projects</strong>
                <small>Your workspace</small>
              </span>
            </a>

            <a href="#settings" class="nav-item">
              <span class="nav-icon" aria-hidden="true">⚙</span>

              <span class="nav-text">
                <strong>Settings</strong>
                <small>Preferences</small>
              </span>
            </a>

          </nav>

          <footer class="drawer-footer">
            <div class="status">
              <span class="status-indicator" aria-hidden="true"></span>

              <div>
                <strong>System Ready</strong>
                <small>All systems operational</small>
              </div>
            </div>
          </footer>

        </div>
      </aside>
    </section>
  </main>
</body>
</html>
