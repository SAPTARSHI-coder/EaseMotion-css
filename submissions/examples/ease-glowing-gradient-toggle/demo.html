<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glowing Gradient Toggle (V2) Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <label class="ease-toggle-wrapper">
    <input type="checkbox" class="ease-toggle-input" role="switch" aria-checked="false">
    <div class="ease-toggle-track">
      <div class="ease-toggle-knob"></div>
    </div>
    <span class="ease-toggle-text">Enable Hardware Acceleration</span>
  </label>
  <p style="position: absolute; bottom: 2rem; color: #64748b; font-size: 0.875rem; text-transform: uppercase; letter-spacing: 1px;">Pure CSS :checked state</p>
</body>
</html>
