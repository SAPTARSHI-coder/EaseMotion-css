<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fade-In Badge</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<section class="catalog">

    <div class="card">
        <span class="badge new">NEW</span>

        <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500" alt="Product">

        <div class="content">
            <h2>Running Shoes</h2>
            <p>Lightweight sports footwear with breathable comfort.</p>
            <button>View Product</button>
        </div>
    </div>

    <div class="card">
        <span class="badge sale">SALE</span>

        <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500" alt="Product">

        <div class="content">
            <h2>Smart Watch</h2>
            <p>Track fitness, health and daily productivity.</p>
            <button>Buy Now</button>
        </div>
    </div>

    <div class="card">
        <span class="badge hot">HOT</span>

        <img src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=500" alt="Product">

        <div class="content">
            <h2>Premium Phone</h2>
            <p>Fast performance with stunning display.</p>
            <button>Explore</button>
        </div>
    </div>

</section>

</body>
</html>
