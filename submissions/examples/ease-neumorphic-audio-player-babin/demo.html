<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EaseMotion CSS - Neumorphic Audio Player</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="player-wrapper">
    <div class="player-card ease-neu-card">
      <div class="album-art ease-disc-spin">
        <div class="vinyl-groove"></div>
        <div class="album-center"></div>
      </div>

      <div class="track-details">
        <h1 class="track-title">Cybernetic Echoes</h1>
        <p class="track-artist">Synthwave Oscillators</p>
      </div>

      <div class="equalizer-bars">
        <span class="eq-bar ease-eq-bounce" style="--delay: 0.1s"></span>
        <span class="eq-bar ease-eq-bounce" style="--delay: 0.3s"></span>
        <span class="eq-bar ease-eq-bounce" style="--delay: 0.2s"></span>
        <span class="eq-bar ease-eq-bounce" style="--delay: 0.5s"></span>
        <span class="eq-bar ease-eq-bounce" style="--delay: 0.4s"></span>
      </div>

      <div class="scrubber-container">
        <div class="time-stamp">01:42</div>
        <div class="progress-bar-bg ease-neu-inset">
          <div class="progress-fill ease-progress-glow" style="width: 58%"></div>
        </div>
        <div class="time-stamp">03:45</div>
      </div>

      <div class="controls-row">
        <button class="control-btn ease-neu-btn" aria-label="Previous Track">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>
        <button class="control-btn btn-play ease-neu-btn ease-pulse-glow" aria-label="Play or Pause">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button class="control-btn ease-neu-btn" aria-label="Next Track">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>
      </div>
    </div>
  </main>
</body>
</html>
