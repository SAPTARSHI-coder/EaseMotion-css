<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Verified Business Card | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <article class="business-card" aria-label="Verified Business Information for Apex Technologies">
      <div class="card-header">
        <div class="company-logo" aria-hidden="true">
          A
        </div>
        <div class="company-meta">
          <div class="company-name-row">
            <h1 class="company-name">Apex Labs</h1>
            <span class="verified-badge" title="Verified Business Entity" aria-label="Verified Business">
              <svg class="verified-icon" viewBox="0 0 24 24">
                <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
              </svg>
            </span>
          </div>
          <span class="industry-label">Cloud Infrastructure & Security</span>
        </div>
      </div>

      <div class="trust-indicators" aria-label="Business Trust Metrics">
        <div class="trust-item">
          <span class="trust-val">99.9%</span>
          <span class="trust-label">Uptime</span>
        </div>
        <div class="trust-item">
          <span class="trust-val">ISO-27001</span>
          <span class="trust-label">Certified</span>
        </div>
        <div class="trust-item">
          <span class="trust-val">4.9 ★</span>
          <span class="trust-label">Rating</span>
        </div>
      </div>

      <ul class="contact-details" aria-label="Contact Information">
        <li class="contact-item">
          <svg class="contact-icon" viewBox="0 0 24 24">
            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
            <circle cx="12" cy="10" r="3"></circle>
          </svg>
          <span>San Francisco, CA (HQ)</span>
        </li>
        <li class="contact-item">
          <svg class="contact-icon" viewBox="0 0 24 24">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
            <polyline points="22,6 12,13 2,6"></polyline>
          </svg>
          <span>contact@apexlabs.io</span>
        </li>
      </ul>

      <div class="card-actions">
        <a href="#contact" class="btn btn-primary" role="button">Contact Sales</a>
        <a href="#verify" class="btn btn-secondary" role="button">Verify Audit</a>
      </div>
    </article>
  </main>
</body>
</html>
