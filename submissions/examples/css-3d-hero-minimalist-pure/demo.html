<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Hero: Minimalist</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Main Hero Section wrapper establishing the 3D perspective scene -->
    <section class="hero-scene">
        
        <!-- The 3D container that rotates in space -->
        <div class="hero-3d-wrapper">
            
            <!-- Left Side: Typography -->
            <div class="hero-content">
                <h1 class="hero-title">Space &amp; Form</h1>
                <p class="hero-subtitle">Exploring dimensional layouts through minimalist principles and pure CSS perspective.</p>
                <div class="hero-actions">
                    <a href="#" class="btn btn-primary">Discover More</a>
                    <a href="#" class="btn btn-secondary">View Gallery</a>
                </div>
            </div>
            
            <!-- Right Side: 3D Geometric Composition -->
            <div class="hero-visuals">
                
                <!-- Floating geometric planes -->
                <div class="plane plane-1"></div>
                <div class="plane plane-2">
                    <!-- Inner wireframe for architectural feel -->
                    <div class="wireframe"></div>
                </div>
                <div class="plane plane-3"></div>
                
            </div>
            
        </div>
        
    </section>

</body>
</html>
