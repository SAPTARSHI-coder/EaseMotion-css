<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rotate Fade Toast</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="wrapper">

        <h1>Rotate-Fade Toast</h1>
        <p>Minimalist Tech Layout Component</p>

        <div class="toast">

            <div class="status">
                ✓
            </div>

            <div class="message">
                <h2>Update Completed</h2>
                <p>Your system has been upgraded successfully.</p>
            </div>

            <span class="close">×</span>

        </div>

    </main>

</body>
</html>
