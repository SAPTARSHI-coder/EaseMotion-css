<!DOCTYPE html><html lang="en"><head>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css"></head><body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030712; color: #ffffff;">

    <div class="ease-card ease-card-glass qtsi-container">

            <h2>Teleportation Safety Interlock</h2>
            <span class="ease-badge ease-badge-warning">Fault-Tolerant Quantum</span>
        </div>
        
        <div class="qtsi-screen ease-center">

            <div class="qtsi-flux flux-qtsi-b"></div>
            <div class="qtsi-boundary-ring"></div>
            <div class="qtsi-core ease-center"></div>
        </div>

        <div class="qtsi-footer ease-flex ease-justify-between ease-items-center">
