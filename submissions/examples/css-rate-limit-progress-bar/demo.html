<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Rate Limit Progress Bar | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <article class="demo-card">
      <header class="card-header">
        <div>
          <h1 class="card-title">API Quota Status</h1>
          <p class="card-subtitle">REST Endpoint /v2/telemetry</p>
        </div>
        <span class="status-badge">Normal</span>
      </header>

      <!-- Rate Limit Metrics Info -->
      <div class="rate-metrics">
        <span class="metric-label">Remaining Requests</span>
        <span class="metric-value highlight">7,500 / 10,000</span>
      </div>

      <!-- Accessible Rate Limit Progress Bar -->
      <div 
        class="rate-track-container" 
        role="progressbar" 
        aria-valuenow="75" 
        aria-valuemin="0" 
        aria-valuemax="100" 
        aria-label="API rate limit quota remaining: 75 percent"
      >
        <div class="rate-fill-bar" aria-hidden="true"></div>
      </div>

      <footer class="card-footer">
        <div class="reset-timer">
          <span class="timer-dot" aria-hidden="true"></span>
          <span>Resets in 24m 12s</span>
        </div>
        <span>Tier: Developer Pro</span>
      </footer>
    </article>
  </main>
</body>
</html>
