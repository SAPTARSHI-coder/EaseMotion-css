<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Zoom-In Badge - Minimalist Tech</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="layout-container">
        
        <header class="section-header">
            <h1 class="title">System Status</h1>
            <p class="subtitle">A minimalist tech layout featuring highly visible badges with a dynamic zoom-in entrance animation.</p>
        </header>

        <div class="dashboard-area">
            
            <div class="card">
                
                <!-- 
                   Pure CSS State Management for Demo
                   We use a checkbox to toggle the state to replay the entrance animation.
                -->
                <div class="controls">
                    <input type="checkbox" id="replay-toggle" class="replay-input" checked>
                    <label for="replay-toggle" class="btn-replay">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"></polyline><polyline points="23 20 23 14 17 14"></polyline><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"></path></svg>
                        Replay Animation
                    </label>
                    
                    <div class="content-row zoom-in-group">
                        
                        <div class="service-item">
                            <div class="service-info">
                                <h3 class="service-name">Primary Database Cluster</h3>
                                <p class="service-region">us-east-1</p>
                            </div>
                            <!-- Success Badge -->
                            <div class="tech-badge badge-success delay-1">
                                <span class="badge-dot"></span>
                                Operational
                            </div>
                        </div>
                        
                        <div class="service-item">
                            <div class="service-info">
                                <h3 class="service-name">Authentication Gateway</h3>
                                <p class="service-region">eu-west-2</p>
                            </div>
                            <!-- Warning Badge -->
                            <div class="tech-badge badge-warning delay-2">
                                <span class="badge-dot"></span>
                                Degraded
                            </div>
                        </div>
                        
                        <div class="service-item">
                            <div class="service-info">
                                <h3 class="service-name">Background Worker Queue</h3>
                                <p class="service-region">ap-south-1</p>
                            </div>
                            <!-- Error Badge -->
                            <div class="tech-badge badge-error delay-3">
                                <span class="badge-dot"></span>
                                Outage
                            </div>
                        </div>
                        
                        <div class="service-item">
                            <div class="service-info">
                                <h3 class="service-name">Analytics Pipeline</h3>
                                <p class="service-region">global</p>
                            </div>
                            <!-- Neutral Badge -->
                            <div class="tech-badge badge-neutral delay-4">
                                <span class="badge-dot"></span>
                                Maintenance
                            </div>
                        </div>

                    </div>
                </div>
                
            </div>
            
        </div>
    </div>

</body>
</html>
