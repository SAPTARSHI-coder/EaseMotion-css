<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Shors Factorization - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css"></head><body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030712; color: #ffffff;">

    <div class="ease-card ease-card-glass shor-container">
        <div class="shor-header">
            <h2>Shor's Factorization</h2>
            <span class="ease-badge ease-badge-success">Factoring</span>
        </div>
        
        <div class="shor-screen ease-center">
            <div class="shor-flux flux-shor-a"></div>
            <div class="shor-flux flux-shor-b"></div>
            <div class="shor-boundary-ring"></div>
            <div class="shor-core ease-center"></div>
        </div>

        <div class="shor-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Periodicity: f(x) = a^x mod N</span>
            <button class="ease-btn ease-btn-success ease-btn-sm ease-hover-grow">Execute Shor Factorization</button>
        </div>
    </div></body></html>
