<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SaaS Modern Announce Top Bar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header
    class="announce-bar"
    role="banner"
    aria-label="Announcement"
  >
    <div class="announce-content">

      <span class="announce-badge" aria-hidden="true">
        NEW
      </span>

      <p class="announce-message">
        <strong>EaseMotion Pro</strong>
        is now available with advanced animation utilities.
      </p>

      <a
        class="announce-link"
        href="#learn-more"
      >
        Learn more
        <span aria-hidden="true">→</span>
      </a>

      <button
        class="announce-close"
        type="button"
        aria-label="Dismiss announcement"
      >
        <span aria-hidden="true">×</span>
      </button>

    </div>
  </header>

  <main class="demo-page" id="learn-more">

    <section class="hero">
      <p class="eyebrow">SAAS COMPONENT</p>

      <h1>
        Modern Announcement Top Bar
      </h1>

      <p>
        A lightweight announcement bar designed for SaaS products,
        product updates and promotional messages.
      </p>

      <button class="primary-button" type="button">
        Get Started
      </button>
    </section>

  </main>

</body>
</html>
