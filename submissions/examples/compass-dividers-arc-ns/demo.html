<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compass Dividers Arc — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Compass Dividers Arc demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Compass Dividers Arc</h1>
      <p class="lede">Drafting dividers swinging arcs on drafting paper</p>
    </header>

    <section class="ease-compass-dividers-arc" data-demo="compass-dividers-arc" aria-live="polite">
      <div class="ease-compass-dividers-arc__housing">
        <div class="ease-compass-dividers-arc__bezel">
          <div class="ease-compass-dividers-arc__face">
            <div class="ease-compass-dividers-arc__readout">
              <span class="ease-compass-dividers-arc__label">Compass Dividers Arc</span>
              <span class="ease-compass-dividers-arc__value">LIVE</span>
            </div>
            <div class="ease-compass-dividers-arc__motion" aria-hidden="true">
              <span class="ease-compass-dividers-arc__a"></span>
              <span class="ease-compass-dividers-arc__b"></span>
              <span class="ease-compass-dividers-arc__c"></span>
              <span class="ease-compass-dividers-arc__d"></span>
            </div>
            <div class="ease-compass-dividers-arc__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-compass-dividers-arc__controls">
          <button type="button" class="ease-compass-dividers-arc__btn primary">Engage</button>
          <button type="button" class="ease-compass-dividers-arc__btn">Reset</button>
          <label class="ease-compass-dividers-arc__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-compass-dividers-arc__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
