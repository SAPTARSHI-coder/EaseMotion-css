<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Floating Elevation CSS Toast Notification"
  >
  <title>Floating Elevation Toast</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section
      class="toast"
      role="status"
      aria-live="polite"
      aria-atomic="true"
    >
      <div class="toast-icon" aria-hidden="true">
        ✓
      </div>

      <div class="toast-content">
        <span class="toast-label">SUCCESS</span>
        <h1>Changes Saved</h1>
        <p>Your latest changes have been saved successfully.</p>
      </div>

      <button
        class="toast-close"
        type="button"
        aria-label="Close notification"
      >
        ×
      </button>
    </section>
  </main>
</body>
</html>
