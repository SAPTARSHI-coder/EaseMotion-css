<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Loader - Diamond Facet Edge</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="demo-container">

    <h1>Diamond Facet Edge Loader</h1>

    <div
      class="diamond-loader"
      role="status"
      aria-label="Loading content">
      <span class="facet facet-1"></span>
      <span class="facet facet-2"></span>
      <span class="facet facet-3"></span>
      <span class="facet facet-4"></span>
    </div>

    <p>Loading resources...</p>

  </main>

</body>
</html>
