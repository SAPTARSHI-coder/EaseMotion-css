<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Collapsible Table on Mobile - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Layout Container -->
  <div class="table-container">
    
    <header class="table-header">
      <h1 class="title">Collapsible Table</h1>
      <p class="subtitle">Responsive tabular data display. Shrink the screen size below 680px to watch the table collapse into card format.</p>
    </header>

    <!-- Semantic Table -->
    <table class="responsive-table" role="table" aria-label="Recent Invoices">
      <thead>
        <tr role="row">
          <th scope="col" role="columnheader">Invoice</th>
          <th scope="col" role="columnheader">Client</th>
          <th scope="col" role="columnheader">Amount</th>
          <th scope="col" role="columnheader">Status</th>
        </tr>
      </thead>
      <tbody>
        <tr role="row">
          <td data-label="Invoice" role="cell">#INV-9281</td>
          <td data-label="Client" role="cell">Stark Industries</td>
          <td data-label="Amount" role="cell">$12,450.00</td>
          <td data-label="Status" role="cell"><span class="badge badge-paid">Paid</span></td>
        </tr>
        <tr role="row">
          <td data-label="Invoice" role="cell">#INV-9282</td>
          <td data-label="Client" role="cell">Wayne Enterprises</td>
          <td data-label="Amount" role="cell">$8,900.00</td>
          <td data-label="Status" role="cell"><span class="badge badge-pending">Pending</span></td>
        </tr>
        <tr role="row">
          <td data-label="Invoice" role="cell">#INV-9283</td>
          <td data-label="Client" role="cell">Oscorp Tech</td>
          <td data-label="Amount" role="cell">$4,230.00</td>
          <td data-label="Status" role="cell"><span class="badge badge-paid">Paid</span></td>
        </tr>
      </tbody>
    </table>

  </div>

</body>
</html>
