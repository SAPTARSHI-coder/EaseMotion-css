<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Gravity Well Button - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="em-gravity-page">
        <div class="em-card" role="region" aria-label="Gravity Well Button Showcase" tabindex="0">
            <span class="em-card-badge">INTERACTIVE PHYSICS</span>
            <h1 class="em-card-title">Gravity Well Button</h1>
            <p class="em-card-desc">An interactive call-to-action layout where surrounding orbital particles get gravitationally pulled toward the button on hover.</p>
            
            <!-- Gravity Well Container -->
            <div class="em-gravity-container" aria-label="Interactive gravity well effect">
                <div class="em-orbit-particle em-p1" aria-hidden="true"></div>
                <div class="em-orbit-particle em-p2" aria-hidden="true"></div>
                <div class="em-orbit-particle em-p3" aria-hidden="true"></div>
                <div class="em-orbit-particle em-p4" aria-hidden="true"></div>
                
                <a href="#" class="em-gravity-btn" role="button">Engage Gravity</a>
            </div>

            <a href="#" class="em-card-link" role="button">Documentation</a>
        </div>
    </div>
</body>
</html>
