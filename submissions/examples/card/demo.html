<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Cyberpunk Stat Metric Card</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="page">
    <section class="stats-grid" aria-label="Statistics">

      <article class="stat-card">
        <div class="stat-card__header">
          <span class="stat-card__label">Revenue</span>
          <span class="stat-card__icon" aria-hidden="true">↗</span>
        </div>

        <p class="stat-card__value">$48.2K</p>

        <div class="stat-card__footer">
          <span class="stat-card__change stat-card__change--positive">
            +12.5%
          </span>
          <span class="stat-card__period">vs last month</span>
        </div>
      </article>

      <article class="stat-card">
        <div class="stat-card__header">
          <span class="stat-card__label">Users</span>
          <span class="stat-card__icon" aria-hidden="true">◎</span>
        </div>

        <p class="stat-card__value">24,892</p>

        <div class="stat-card__footer">
          <span class="stat-card__change stat-card__change--positive">
            +8.2%
          </span>
          <span class="stat-card__period">vs last month</span>
        </div>
      </article>

      <article class="stat-card">
        <div class="stat-card__header">
          <span class="stat-card__label">Conversion</span>
          <span class="stat-card__icon" aria-hidden="true">%</span>
        </div>

        <p class="stat-card__value">7.84%</p>

        <div class="stat-card__footer">
          <span class="stat-card__change stat-card__change--negative">
            -1.4%
          </span>
          <span class="stat-card__period">vs last month</span>
        </div>
      </article>

      <article class="stat-card">
        <div class="stat-card__header">
          <span class="stat-card__label">Performance</span>
          <span class="stat-card__icon" aria-hidden="true">⚡</span>
        </div>

        <p class="stat-card__value">98.6%</p>

        <div class="stat-card__footer">
          <span class="stat-card__change stat-card__change--positive">
            +4.7%
          </span>
          <span class="stat-card__period">vs last month</span>
        </div>
      </article>

    </section>
  </main>

</body>
</html>
