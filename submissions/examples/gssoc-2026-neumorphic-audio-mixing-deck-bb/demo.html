<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neumorphic Audio Mixing Deck - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="neu-container">
    <header class="neu-header">
      <span class="badge">GSSoC 2026 Component</span>
      <h1>Neumorphic Audio Mixing Deck</h1>
      <p>Tactile soft-UI neumorphic mixing console deck with extruded volume dials, depressed push buttons, and LED meters.</p>
    </header>

    <div class="neu-card" tabindex="0">
      <div class="deck-top">
        <h3 class="console-title">STUDIO CONSOLE PRO</h3>
        <span class="power-indicator"></span>
      </div>

      <div class="controls-grid">
        <!-- Knob 1 -->
        <div class="knob-unit">
          <div class="neu-knob">
            <span class="knob-pointer"></span>
          </div>
          <span class="unit-label">GAIN</span>
        </div>

        <!-- Knob 2 -->
        <div class="knob-unit">
          <div class="neu-knob knob-active">
            <span class="knob-pointer"></span>
          </div>
          <span class="unit-label">BASS</span>
        </div>

        <!-- Knob 3 -->
        <div class="knob-unit">
          <div class="neu-knob">
            <span class="knob-pointer"></span>
          </div>
          <span class="unit-label">TREBLE</span>
        </div>
      </div>

      <div class="buttons-row">
        <button class="neu-btn pressed" aria-label="Mute">MUTE</button>
        <button class="neu-btn" aria-label="Solo">SOLO</button>
        <button class="neu-btn" aria-label="EQ Pass">EQ PASS</button>
      </div>

      <div class="led-vumeter">
        <span class="led green"></span>
        <span class="led green"></span>
        <span class="led green"></span>
        <span class="led yellow"></span>
        <span class="led red"></span>
      </div>
    </div>
  </div>
</body>
</html>
