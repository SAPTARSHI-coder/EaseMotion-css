<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Skeleton Loading Shimmer — Demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="demo-wrap">
    <h1>Skeleton Loading Shimmer</h1>
    <p class="sub">Toggle between loading and loaded state to see the shimmer sweep.</p>

    <button id="toggleBtn" class="toggle-btn">Toggle Loading State</button>

    <section class="card">
      <div id="loadingBlock">
        <div class="skeleton skeleton-avatar"></div>
        <div class="skeleton skeleton-text" style="width: 70%;"></div>
        <div class="skeleton skeleton-text" style="width: 90%;"></div>
        <div class="skeleton skeleton-text" style="width: 50%;"></div>
      </div>

      <div id="loadedBlock" style="display:none;">
        <img class="avatar-real" src="https://i.pravatar.cc/48" alt="User avatar">
        <h3>Saptarshi Sadhu</h3>
        <p>Maintainer of EaseMotion CSS — animation-first, human-readable, zero dependencies.</p>
      </div>
    </section>
  </main>

  <script>
    const btn = document.getElementById('toggleBtn');
    const loading = document.getElementById('loadingBlock');
    const loaded = document.getElementById('loadedBlock');
    let isLoading = true;

    btn.addEventListener('click', () => {
      isLoading = !isLoading;
      loading.style.display = isLoading ? 'block' : 'none';
      loaded.style.display = isLoading ? 'none' : 'block';
      btn.textContent = isLoading ? 'Show Loaded State' : 'Show Loading State';
    });
  </script>

</body>
</html>
