<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EaseMotion CSS - Toggle Switch Demo</title>
  <!-- Link to the main EaseMotion CSS (adjust path if needed) -->
  <link rel="stylesheet" href="../../easemotion.min.css" />
  <link rel="stylesheet" href="style.css" />
  <style>
    /* Fallback basic styles if easemotion.min.css is not loaded locally */
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      gap: 2rem;
    }
    h1 { margin-bottom: 0.5rem; }
    .demo-group {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      background: #ffffff;
      padding: 2rem;
      border-radius: 1rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }
    .demo-label {
      font-size: 0.875rem;
      font-weight: 600;
      color: #64748b;
      margin-bottom: 0.5rem;
      display: block;
    }
  </style>
</head>
<body>

  <div class="ease-fade-in ease-slide-up" style="text-align: center;">
    <h1>Animated Toggle Switch</h1>
    <p style="color: #64748b;">Accessible, spring-animated, and theming-ready.</p>
  </div>

  <div class="demo-group">
    <!-- Default Toggle -->
    <div>
      <span class="demo-label">Default State</span>
      <label class="ease-toggle">
        <input type="checkbox" class="ease-toggle__input" aria-checked="false" />
        <span class="ease-toggle__track">
          <span class="ease-toggle__knob"></span>
        </span>
        <span class="ease-toggle__label">Enable notifications</span>
      </label>
    </div>

    <!-- Checked Toggle -->
    <div>
      <span class="demo-label">Checked State</span>
      <label class="ease-toggle">
        <input type="checkbox" class="ease-toggle__input" checked aria-checked="true" />
        <span class="ease-toggle__track">
          <span class="ease-toggle__knob"></span>
        </span>
        <span class="ease-toggle__label">Dark mode enabled</span>
      </label>
    </div>

    <!-- Disabled Toggle -->
    <div>
      <span class="demo-label">Disabled State</span>
      <label class="ease-toggle">
        <input type="checkbox" class="ease-toggle__input" disabled aria-checked="false" />
        <span class="ease-toggle__track">
          <span class="ease-toggle__knob"></span>
        </span>
        <span class="ease-toggle__label">Premium feature (locked)</span>
      </label>
    </div>
  </div>

  <script>
    // Simple script to toggle aria-checked for accessibility demo purposes
    document.querySelectorAll('.ease-toggle__input').forEach(input => {
      input.addEventListener('change', (e) => {
        e.target.setAttribute('aria-checked', e.target.checked);
      });
    });
  </script>
</body>
</html>
