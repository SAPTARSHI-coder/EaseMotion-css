<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cyberpunk Hover Badge - EaseMotion CSS</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="cyber-badge-container">
      <header class="cyber-header">
        <h1 class="cyber-title">Cyberpunk Hover Badges</h1>
        <p class="cyber-subtitle">
          Issue #79882 / #74305 — High-Tech Neon Hover Micro-Interactions
        </p>
      </header>

      <div class="cyber-badge-wrapper">
        <div class="cyber-badge">
          <span class="cyber-badge-dot"></span>
          <span>SYS.ONLINE // v2.4</span>
        </div>

        <div class="cyber-badge cyber-badge-pink">
          <span class="cyber-badge-dot"></span>
          <span>FIREWALL // ACTIVE</span>
        </div>

        <div class="cyber-badge cyber-badge-yellow">
          <span class="cyber-badge-dot"></span>
          <span>NEURAL LINK // READY</span>
        </div>
      </div>
    </main>
  </body>
</html>
