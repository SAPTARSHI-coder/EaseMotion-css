<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
        name="description"
        content="Responsive CSS mobile app bottom navigation demo"
    >
    <title>CSS Mobile App Bottom Nav</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="app-demo">
        <section class="demo-content" aria-labelledby="demo-title">
            <p class="eyebrow">EaseMotion CSS</p>

            <h1 id="demo-title">Mobile App Bottom Navigation</h1>

            <p>
                A responsive mobile-style bottom navigation built entirely
                with HTML and CSS.
            </p>

            <div class="preview-card">
                <span class="preview-icon" aria-hidden="true">⌂</span>
                <h2>Home</h2>
                <p>
                    The active navigation item is highlighted using a smooth
                    CSS transition.
                </p>
            </div>
        </section>

        <nav class="bottom-nav" aria-label="Main navigation">
            <a
                class="nav-item active"
                href="#home"
                aria-current="page"
            >
                <span class="nav-icon" aria-hidden="true">⌂</span>
                <span class="nav-label">Home</span>
            </a>

            <a class="nav-item" href="#search">
                <span class="nav-icon" aria-hidden="true">⌕</span>
                <span class="nav-label">Search</span>
            </a>

            <a class="nav-item" href="#favorites">
                <span class="nav-icon" aria-hidden="true">♡</span>
                <span class="nav-label">Saved</span>
            </a>

            <a class="nav-item" href="#profile">
                <span class="nav-icon" aria-hidden="true">◯</span>
                <span class="nav-label">Profile</span>
            </a>
        </nav>
    </main>

</body>
</html>
