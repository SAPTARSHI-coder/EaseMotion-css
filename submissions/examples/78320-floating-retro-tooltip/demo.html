<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />
  <meta
    name="description"
    content="CSS-only floating tooltip with a retro-inspired design."
  />
  <title>Floating Retro Tooltip</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <section class="tooltip-demo" aria-labelledby="demo-title">
      <div class="scanlines" aria-hidden="true"></div>

      <p class="eyebrow">CSS COMPONENT / 78320</p>

      <h1 id="demo-title">Floating Retro Tooltip</h1>

      <p class="intro">
        A responsive CSS-only tooltip with a vintage arcade-inspired
        floating effect.
      </p>

      <div class="tooltip-stage">
        <div class="tooltip-wrap">
          <button
            class="retro-button"
            type="button"
            aria-describedby="retro-tooltip"
          >
            Hover Me
          </button>

          <div
            id="retro-tooltip"
            class="retro-tooltip"
            role="tooltip"
          >
            <span class="tooltip-label">SYSTEM MESSAGE</span>
            <span class="tooltip-text">
              Retro vibes activated.
            </span>
          </div>
        </div>
      </div>

      <div class="feature-row">
        <span>CSS ONLY</span>
        <span>RESPONSIVE</span>
        <span>NO JS</span>
      </div>
    </section>
  </main>
</body>
</html>
