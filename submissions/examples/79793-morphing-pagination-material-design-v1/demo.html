<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Morphing Pagination with Material Design styling">
    <title>Morphing Pagination - Material Design</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="page">
        <section class="showcase">
            <span class="eyebrow">EaseMotion CSS</span>

            <h1>Morphing Pagination</h1>

            <p class="intro">
                A responsive pagination component inspired by Material Design,
                featuring smooth morphing transitions and tactile interactions.
            </p>

            <div class="pagination-card">
                <div class="content">
                    <span class="content-label">Page navigation</span>
                    <h2>Material Collection</h2>
                    <p>
                        Browse through the available collection using the
                        interactive pagination below.
                    </p>
                </div>

                <nav class="pagination" aria-label="Pagination">
                    <button class="page-control" aria-label="Previous page">
                        <span aria-hidden="true">‹</span>
                    </button>

                    <button class="page-number active" aria-current="page">1</button>
                    <button class="page-number">2</button>
                    <button class="page-number">3</button>
                    <button class="page-number">4</button>

                    <span class="dots" aria-hidden="true">•••</span>

                    <button class="page-number">8</button>

                    <button class="page-control" aria-label="Next page">
                        <span aria-hidden="true">›</span>
                    </button>
                </nav>
            </div>
        </section>
    </main>

</body>
</html>
