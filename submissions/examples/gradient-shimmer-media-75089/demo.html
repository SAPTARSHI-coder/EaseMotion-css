<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Gradient Shimmer audio and media UI built with pure HTML and CSS"
  >
  <title>Gradient Shimmer Media Player</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section class="media-card" aria-label="Gradient Shimmer media player">

      <div class="shimmer-layer" aria-hidden="true"></div>

      <div class="media-header">
        <span class="badge">NOW PLAYING</span>
        <button class="more-button" type="button" aria-label="More options">
          •••
        </button>
      </div>

      <div class="album-art" aria-hidden="true">
        <div class="art-glow"></div>
        <div class="art-ring"></div>
        <div class="art-core"></div>
      </div>

      <div class="track-info">
        <p class="artist">EaseMotion Audio</p>
        <h1>Gradient Shimmer</h1>
        <p class="subtitle">Ambient Motion Experience</p>
      </div>

      <div class="visualizer" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
      </div>

      <div class="progress">
        <span>1:24</span>

        <div class="progress-track">
          <div class="progress-value"></div>
        </div>

        <span>3:48</span>
      </div>

      <div class="controls">
        <button class="control" type="button" aria-label="Previous track">
          ◀◀
        </button>

        <button
          class="play-button"
          type="button"
          aria-label="Play or pause"
          aria-pressed="false"
        >
          ▶
        </button>

        <button class="control" type="button" aria-label="Next track">
          ▶▶
        </button>
      </div>

      <div class="volume">
        <span aria-hidden="true">−</span>

        <label class="sr-only" for="volume">
          Volume
        </label>

        <input
          id="volume"
          type="range"
          min="0"
          max="100"
          value="70"
        >

        <span aria-hidden="true">+</span>
      </div>

    </section>
  </main>
</body>
</html>
