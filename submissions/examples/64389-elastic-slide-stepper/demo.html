<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Elastic Slide Stepper | EaseMotion CSS</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="container">

    <section class="card">

        <h1>Elastic Slide Stepper</h1>

        <p class="subtitle">
            Glassmorphism UI stepper with smooth elastic slide animation.
        </p>


        <div class="stepper">

            <div class="step active">
                <span>1</span>
                <p>Planning</p>
            </div>

            <div class="line"></div>

            <div class="step active">
                <span>2</span>
                <p>Design</p>
            </div>

            <div class="line"></div>

            <div class="step">
                <span>3</span>
                <p>Development</p>
            </div>

            <div class="line"></div>

            <div class="step">
                <span>4</span>
                <p>Launch</p>
            </div>

        </div>


        <div class="progress">
            <div class="progress-bar"></div>
        </div>


    </section>

</main>


</body>
</html>
