<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neural Network Sync - EaseMotion CSS</title>
    <!-- Include EaseMotion Core Stylesheet -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030712; color: #ffffff;">

    <div class="ease-card ease-card-glass neural-container">
        <div class="neural-header">
            <h2>Neural Sync</h2>
            <span class="ease-badge ease-badge-primary">Training</span>
        </div>
        
        <div class="neural-screen ease-center">
            <div class="neural-link link-1"></div>
            <div class="neural-link link-2"></div>
            <div class="neural-node n-1"></div>
            <div class="neural-node n-2"></div>
            <div class="neural-node n-3"></div>
            <div class="neural-node n-4"></div>
        </div>

        <div class="neural-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Accuracy: 99.4%</span>
            <button class="ease-btn ease-btn-primary ease-btn-sm ease-hover-grow">Sync</button>
        </div>
    </div>

</body>
</html>
