<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pulse Button Component - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="gallery">
    <h1>Pulse Button Component (<code>#54703</code>)</h1>
    <p class="desc">Concentric outward breathing waveform rings engineered to highlight primary conversion actions.</p>
    
    <div class="buttons-grid">
      <div class="btn-box">
        <button class="ease-btn-pulse primary">🚀 Launch Studio</button>
      </div>
      <div class="btn-box">
        <button class="ease-btn-pulse success">✨ Confirm Merge</button>
      </div>
      <div class="btn-box">
        <button class="ease-btn-pulse danger">🔥 Live Stream</button>
      </div>
    </div>
  </div>
</body>
</html>
