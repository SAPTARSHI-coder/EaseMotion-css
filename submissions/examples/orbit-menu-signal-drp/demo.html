<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orbit Menu Signal</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="shell" aria-labelledby="title">
    <section class="card">
      <p class="eyebrow">menu</p>
      <h1 id="title">Orbit Menu Signal</h1>
      <p class="summary">A CSS-only orbit menu with radiating items, a signal glow center, and layered motion.</p>
      <div class="stage" role="img" aria-label="Animated Orbit Menu Signal">
        <div class="orbit">
          <div class="center"></div>
          <div class="item item-a">Home</div>
          <div class="item item-b">Docs</div>
          <div class="item item-c">Stats</div>
          <div class="item item-d">More</div>
        </div>
        <article class="tile"><strong>01</strong><span>Radiating menu items</span></article>
        <article class="tile"><strong>02</strong><span>Signal glow center</span></article>
        <article class="tile"><strong>03</strong><span>Layered motion</span></article>
        <article class="tile"><strong>04</strong><span>Reduced-motion friendly</span></article>
      </div>
      <div class="tags" aria-label="Orbit Menu Signal features">
        <span>Radiating menu items</span>
        <span>Signal glow center</span>
        <span>Layered motion</span>
        <span>Reduced-motion friendly</span>
      </div>
    </section>
  </main>
</body>
</html>
