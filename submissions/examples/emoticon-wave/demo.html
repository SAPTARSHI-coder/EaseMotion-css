<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emoticon Wave &mdash; EaseMotion CSS Demo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="page-head">
    <p class="kicker">EaseMotion CSS &middot; Fun &amp; Visuals</p>
    <h1>Emoticon Wave</h1>
    <p class="sub">A cheerful mob of emoji that never stops jumping.</p>
  </header>
  <main class="stage">
    <div class="ew-row">
      <span class="ew-emo">&#128512;</span>
      <span class="ew-emo">&#128513;</span>
      <span class="ew-emo">&#129321;</span>
      <span class="ew-emo">&#128525;</span>
      <span class="ew-emo">&#129303;</span>
      <span class="ew-emo">&#128516;</span>
    </div>
  </main>
  <p class="stage-caption">Hover any emoji to pause it and give it a squish.</p>
  <footer class="page-foot">
    <span>Pure CSS &middot; zero dependencies</span>
    <span>Jumping emoji</span>
  </footer>
</body>
</html>
