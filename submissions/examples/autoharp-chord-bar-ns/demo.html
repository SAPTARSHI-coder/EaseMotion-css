<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Autoharp Chord Bar — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Autoharp Chord Bar demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Autoharp Chord Bar</h1>
      <p class="lede">Autoharp chord bar damping the unselected strings</p>
    </header>

    <section class="ease-autoharp-chord-bar" data-demo="autoharp-chord-bar" aria-live="polite">
      <div class="ease-autoharp-chord-bar__housing">
        <div class="ease-autoharp-chord-bar__bezel">
          <div class="ease-autoharp-chord-bar__face">
            <div class="ease-autoharp-chord-bar__readout">
              <span class="ease-autoharp-chord-bar__label">Autoharp Chord Bar</span>
              <span class="ease-autoharp-chord-bar__value">LIVE</span>
            </div>
            <div class="ease-autoharp-chord-bar__motion" aria-hidden="true">
              <span class="ease-autoharp-chord-bar__a"></span>
              <span class="ease-autoharp-chord-bar__b"></span>
              <span class="ease-autoharp-chord-bar__c"></span>
              <span class="ease-autoharp-chord-bar__d"></span>
            </div>
            <div class="ease-autoharp-chord-bar__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-autoharp-chord-bar__controls">
          <button type="button" class="ease-autoharp-chord-bar__btn primary">Bar</button>
          <button type="button" class="ease-autoharp-chord-bar__btn">Lift</button>
          <label class="ease-autoharp-chord-bar__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-autoharp-chord-bar__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
