<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-step-counter-dial demo</title>
</head>
<body>
<div class="scd-band">
  <span class="scd-loop scd-loop-left"></span>
  <div class="scd-face">
    <span class="scd-time">8:45 AM</span>
    <b class="scd-steps">8,452</b>
    <div class="scd-goal"><em class="scd-fill"></em></div>
    <span class="scd-caption">Goal 10,000 steps</span>
    <div class="scd-ring">
      <span class="scd-arrow"></span>
    </div>
  </div>
  <span class="scd-loop scd-loop-right"></span>
</div>
</body>
</html>
