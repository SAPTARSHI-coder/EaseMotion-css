<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Harmonic Oscillator — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Harmonic Oscillator demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Harmonic Oscillator</h1>
      <p class="lede">Mass-spring harmonic oscillator bobbing sinusoidally</p>
    </header>

    <section class="ease-harmonic-oscillator" data-demo="harmonic-oscillator" aria-live="polite">
      <div class="ease-harmonic-oscillator__housing">
        <div class="ease-harmonic-oscillator__bezel">
          <div class="ease-harmonic-oscillator__face">
            <div class="ease-harmonic-oscillator__readout">
              <span class="ease-harmonic-oscillator__label">Harmonic Oscillator</span>
              <span class="ease-harmonic-oscillator__value">LIVE</span>
            </div>
            <div class="ease-harmonic-oscillator__motion" aria-hidden="true">
              <span class="ease-harmonic-oscillator__a"></span>
              <span class="ease-harmonic-oscillator__b"></span>
              <span class="ease-harmonic-oscillator__c"></span>
              <span class="ease-harmonic-oscillator__d"></span>
            </div>
            <div class="ease-harmonic-oscillator__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-harmonic-oscillator__controls">
          <button type="button" class="ease-harmonic-oscillator__btn primary">Engage</button>
          <button type="button" class="ease-harmonic-oscillator__btn">Reset</button>
          <label class="ease-harmonic-oscillator__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-harmonic-oscillator__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
