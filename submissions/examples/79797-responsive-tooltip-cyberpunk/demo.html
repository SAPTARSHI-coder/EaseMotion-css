<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyberpunk Responsive Tooltip</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="demo-page">
    <section class="tooltip-card">
      <span class="eyebrow">CYBER INTERFACE</span>

      <h1>Responsive Cyberpunk Tooltip</h1>

      <p class="intro">
        Hover or focus the interactive elements to reveal futuristic
        neon tooltips with responsive positioning.
      </p>

      <div class="tooltip-demo">
        <button
          class="cyber-trigger"
          type="button"
          aria-describedby="cyber-tooltip"
        >
          <span class="trigger-dot" aria-hidden="true"></span>
          Hover Me
        </button>

        <div
          class="cyber-tooltip"
          id="cyber-tooltip"
          role="tooltip"
        >
          <span class="tooltip-label">SYSTEM MESSAGE</span>
          <span class="tooltip-text">
            Neural interface connection established.
          </span>
        </div>
      </div>

      <div class="feature-grid">
        <button class="feature-item" type="button">
          <span class="feature-icon">01</span>
          <span>
            <strong>Fast</strong>
            <small>Instant feedback</small>
          </span>

          <span class="mini-tooltip">
            Optimized interaction feedback.
          </span>
        </button>

        <button class="feature-item" type="button">
          <span class="feature-icon">02</span>
          <span>
            <strong>Adaptive</strong>
            <small>Responsive layout</small>
          </span>

          <span class="mini-tooltip">
            Adapts smoothly across screen sizes.
          </span>
        </button>

        <button class="feature-item" type="button">
          <span class="feature-icon">03</span>
          <span>
            <strong>Neon</strong>
            <small>Cyberpunk visual</small>
          </span>

          <span class="mini-tooltip">
            Glowing accents create the cyberpunk aesthetic.
          </span>
        </button>
      </div>
    </section>
  </main>
</body>
</html>
