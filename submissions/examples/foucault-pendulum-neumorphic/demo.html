<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Foucault Pendulum inspired neumorphic CSS component."
  >
  <title>Foucault Pendulum Neumorphic</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="page">
    <section
      class="pendulum-card"
      aria-labelledby="pendulum-title"
    >
      <div class="card-header">
        <span class="eyebrow">NEUMORPHIC MOTION</span>
        <h1 id="pendulum-title">Foucault Pendulum</h1>
        <p>
          A pure CSS pendulum interaction inspired by the elegant motion
          of a Foucault pendulum.
        </p>
      </div>

      <div
        class="pendulum-stage"
        role="img"
        aria-label="Animated Foucault pendulum"
      >
        <div class="ceiling">
          <span class="mount"></span>
        </div>

        <div class="pendulum">
          <div class="cable"></div>
          <div class="bob">
            <span class="bob-highlight"></span>
          </div>
        </div>

        <div class="pendulum-base">
          <div class="base-ring"></div>
          <div class="base-center"></div>
        </div>
      </div>

      <div class="card-footer">
        <div class="status">
          <span class="status-dot"></span>
          <span>CSS Motion Active</span>
        </div>

        <div class="motion-info">
          <span>Pure CSS</span>
          <span aria-hidden="true">•</span>
          <span>No JavaScript</span>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
