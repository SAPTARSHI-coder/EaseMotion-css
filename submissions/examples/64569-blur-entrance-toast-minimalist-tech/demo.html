<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blur Entrance Toast</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <h1>Blur Entrance Toast</h1>
        <p>Minimalist Tech Layout Animation</p>

        <div class="toast">
            <div class="icon">✓</div>

            <div class="content">
                <h2>Deployment Successful</h2>
                <span>Your project is now live.</span>
            </div>

            <button aria-label="close">×</button>
        </div>
    </main>

</body>
</html>
