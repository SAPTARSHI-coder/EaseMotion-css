<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-traffic-light-controller</title>
</head>
<body>
<main class="tlc-card">
  <header class="tlc-head">
    <h1 class="tlc-title">Signal</h1>
    <span class="tlc-id">N-12</span>
  </header>
  <section class="tlc-lamp" aria-label="signal lamps">
    <span class="tlc-light tlc-light-red"></span>
    <span class="tlc-light tlc-light-yellow"></span>
    <span class="tlc-light tlc-light-green"></span>
  </section>
  <div class="tlc-count">
    <span class="tlc-count-label">Next</span>
    <strong class="tlc-count-num">9</strong>
    <span class="tlc-count-unit">s</span>
  </div>
  <section class="tlc-ped">
    <span class="tlc-ped-icon">PED</span>
    <span class="tlc-ped-state">Wait</span>
  </section>
  <footer class="tlc-foot">
    <span class="tlc-msg">Sensor live</span>
    <span class="tlc-cycle">Cycle 60s</span>
  </footer>
</main>
</body>
</html>
