<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Trigonometric Functions Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="ease-trig-wrapper" role="img" aria-label="Animated orbital system using CSS trigonometry">
    <div class="ease-trig-core">Core</div>
    <div class="ease-node ease-node-1">1</div>
    <div class="ease-node ease-node-2">2</div>
    <div class="ease-node ease-node-3">3</div>
  </div>
  <p style="position: absolute; bottom: 2rem; color: #64748b; font-family: system-ui; font-size: 0.875rem; text-align: center;">Elements orbit using native <code>sin()</code> and <code>cos()</code> functions calculating X/Y vectors in real-time.<br>Zero nested rotating DOM wrappers.</p>
</body>
</html>
