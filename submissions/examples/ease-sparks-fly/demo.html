<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sparks Fly – Sparks Fly from Interaction Point</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <h1>✨ Sparks Fly</h1>
    <p class="subtitle">Sparks fly from your interaction point</p>

    <div class="sparks-container">
      <div class="sparks-stage" id="sparksStage">
        <canvas id="canvas"></canvas>
        
        <!-- Info overlay -->
        <div class="info-overlay">
          <span class="sparks-status" id="sparksStatus">✨ Idle</span>
          <span class="spark-count" id="sparkCount">✦ 0 sparks</span>
        </div>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <button class="ctrl-btn spark" id="sparkBtn">💥 Spark</button>
      <button class="ctrl-btn clear" id="clearBtn">🗑️ Clear</button>
      <button class="ctrl-btn toggle" id="toggleBtn">⏸ Pause</button>
      <button class="ctrl-btn reset" id="resetBtn">↺ Reset</button>
    </div>

    <!-- Sliders -->
    <div class="slider-container">
      <span class="slider-label">Spark Count</span>
      <input type="range" id="countSlider" min="10" max="100" value="40" step="5" />
      <span class="slider-value" id="countValue">40</span>
    </div>

    <div class="slider-container">
      <span class="slider-label">Spark Force</span>
      <input type="range" id="forceSlider" min="1" max="10" value="5" />
      <span class="slider-value" id="forceValue">5×</span>
    </div>

    <div class="slider-container">
      <span class="slider-label">Spark Life</span>
      <input type="range" id="lifeSlider" min="0" max="100" value="50" />
      <span class="slider-value" id="lifeValue">50%</span>
    </div>

    <div class="slider-container">
      <span class="slider-label">Spark Size</span>
      <input type="range" id="sizeSlider" min="1" max="8" value="4" step="0.5" />
      <span class="slider-value" id="sizeValue">4px</span>
    </div>

    <!-- Status -->
    <div class="status" id="status">✨ Click Spark or tap the canvas to create sparks</div>

    <!-- Keyboard shortcuts -->
    <div class="shortcuts">
      <kbd>Click</kbd> Spark · <kbd>S</kbd> Spark · <kbd>C</kbd> Clear · <kbd>Space</kbd> Pause
    </div>
  </div>

  <script>
    (function() {
      "use strict";

      // DOM elements
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      const sparksStatus = document.getElementById('sparksStatus');
      const sparkCount = document.getElementById('sparkCount');
      const sparkBtn = document.getElementById('sparkBtn');
      const clearBtn = document.getElementById('clearBtn');
      const toggleBtn = document.getElementById('toggleBtn');
      const resetBtn = document.getElementById('resetBtn');
      const status = document.getElementById('status');
      const countSlider = document.getElementById('countSlider');
      const countValue = document.getElementById('countValue');
      const forceSlider = document.getElementById('forceSlider');
      const forceValue = document.getElementById('forceValue');
      const lifeSlider = document.getElementById('lifeSlider');
      const lifeValue = document.getElementById('lifeValue');
      const sizeSlider = document.getElementById('sizeSlider');
      const sizeValue = document.getElementById('sizeValue');

      // State
      let sparks = [];
      let isPaused = false;
      let animationId = null;
      let time = 0;

      // Spark colors (warm colors)
      const SPARK_COLORS = [
        '#ff6b35', '#ff8c42', '#ffa94d', '#ffd93d', '#fecb6e',
        '#ff6b6b', '#ff4757', '#ff6348', '#ff9f43', '#feca57',
        '#ffd93d', '#ff6b81', '#e056a0', '#ff7675', '#fd79a8'
      ];

      // ----- Canvas setup -----
      function setupCanvas() {
        const rect = canvas.parentElement.getBoundingClientRect();
        const size = Math.min(rect.width - 40, 600);
        canvas.width = size;
        canvas.height = size;
        canvas.style.width = size + 'px';
        canvas.style.height = size + 'px';
      }

      // ----- Spark class -----
      class Spark {
        constructor(x, y, angle, force, life, size) {
          const speed = force * (0.5 + Math.random() * 0.5);
          this.x = x;
          this.y = y;
          this.vx = Math.cos(angle) * speed;
          this.vy = Math.sin(angle) * speed;
          this.size = size * (0.5 + Math.random() * 0.5);
          this.originalSize = this.size;
          this.life = life * (0.3 + Math.random() * 0.7);
          this.maxLife = this.life;
          this.color = SPARK_COLORS[Math.floor(Math.random() * SPARK_COLORS.length)];
          this.opacity = 0.6 + Math.random() * 0.4;
          this.gravity = 0.02 + Math.random() * 0.03;
          this.friction = 0.98 + Math.random() * 0.015;
          this.rotation = Math.random() * Math.PI * 2;
          this.rotationSpeed = (Math.random() - 0.5) * 0.03;
          this.trail = [];
          this.trailLength = 3 + Math.floor(Math.random() * 5);
          this.alive = true;
          this.wobble = 0;
          this.wobbleSpeed = 0.02 + Math.random() * 0.03;
          this.wobbleAmount = 0.2 + Math.random() * 0.5;
          this.hue = 30 + Math.random() * 30;
          this.lightness = 50 + Math.random() * 30;
        }

        update() {
          // Physics
          this.vy += this.gravity;
          this.vx *= this.friction;
          this.vy *= this.friction;
          
          // Wobble
          this.wobble += this.wobbleSpeed;
          this.vx += Math.sin(this.wobble) * this.wobbleAmount * 0.02;
          this.vy += Math.cos(this.wobble) * this.wobbleAmount * 0.02;

          // Update position
          this.x += this.vx;
          this.y += this.vy;

          // Rotation
          this.rotation += this.rotationSpeed;

          // Life decay
          this.life -= 0.005;
          this.size *= 0.9995;

          // Trail
          this.trail.push({ x: this.x, y: this.y });
          if (this.trail.length > this.trailLength) {
            this.trail.shift();
          }

          // Fade based on life
          this.opacity = Math.min(1, this.life / this.maxLife * 2) * (0.3 + 0.7 * (this.life / this.maxLife));

          // Check if alive
          if (this.life <= 0 || this.size < 0.1) {
            this.alive = false;
          }
        }

        draw(ctx, sizeMult) {
          const size = this.size * sizeMult;
          const alpha = this.opacity * (0.5 + 0.5 * (this.life / this.maxLife));

          // Draw trail
          if (this.trail.length > 1) {
            for (let i = 0; i < this.trail.length - 1; i++) {
              const t = i / this.trail.length;
              const trailAlpha = alpha * t * 0.15;
              const trailSize = size * t * 0.3;
              ctx.fillStyle = this.color + Math.round(trailAlpha * 255).toString(16).padStart(2, '0');
              ctx.beginPath();
              ctx.arc(this.trail[i].x, this.trail[i].y, trailSize, 0, Math.PI * 2);
              ctx.fill();
            }
          }

          // Glow
          const glowSize = size * 4;
          const gradient = ctx.createRadialGradient(
            this.x, this.y, 0,
            this.x, this.y, glowSize
          );
          const glowAlpha = alpha * 0.15;
          gradient.addColorStop(0, this.color + Math.round(glowAlpha * 255).toString(16).padStart(2, '0'));
          gradient.addColorStop(0.5, this.color + Math.round(glowAlpha * 128).toString(16).padStart(2, '0'));
          gradient.addColorStop(1, this.color + '00');
          ctx.fillStyle = gradient;
          ctx.beginPath();
          ctx.arc(this.x, this.y, glowSize, 0, Math.PI * 2);
          ctx.fill();

          // Spark body
          ctx.save();
          ctx.translate(this.x, this.y);
          ctx.rotate(this.rotation);
          ctx.globalAlpha = alpha;

          // Shadow/glow
          ctx.shadowColor = this.color + Math.round(alpha * 128).toString(16).padStart(2, '0');
          ctx.shadowBlur = 10;

          // Core with gradient
          const grad = ctx.createRadialGradient(
            -size * 0.2, -size * 0.2, 0,
            0, 0, size
          );
          const lightness = 60 + 30 * (this.life / this.maxLife);
          grad.addColorStop(0, `hsl(45, 100%, 95%)`);
          grad.addColorStop(0.3, `hsl(${this.hue + 20}, 100%, ${lightness + 20}%)`);
          grad.addColorStop(0.7, `hsl(${this.hue}, 100%, ${lightness}%)`);
          grad.addColorStop(1, `hsl(${this.hue - 10}, 100%, ${lightness - 20}%)`);

          ctx.fillStyle = grad;

          // Irregular spark shape (slightly star-like)
          const segments = 6 + Math.floor(Math.random() * 4);
          ctx.beginPath();
          for (let i = 0; i <= segments; i++) {
            const angle = (i / segments) * Math.PI * 2;
            const bump = 1 + 0.15 * Math.sin(angle * 2 + time * 0.3 + this.rotation);
            const r = size * bump;
            const x = Math.cos(angle) * r;
            const y = Math.sin(angle) * r;
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          }
          ctx.closePath();
          ctx.fill();

          ctx.shadowBlur = 0;

          // Highlight
          if (this.life > this.maxLife * 0.5) {
            ctx.fillStyle = `rgba(255, 255, 255, ${alpha * 0.15})`;
            ctx.beginPath();
            ctx.arc(-size * 0.15, -size * 0.2, size * 0.15, 0, Math.PI * 2);
            ctx.fill();
          }

          ctx.restore();
        }
      }

      // ----- Create sparks -----
      function createSparks(x, y) {
        const count = parseInt(countSlider.value);
        const force = parseInt(forceSlider.value);
        const life = parseInt(lifeSlider.value) / 100;
        const size = parseInt(sizeSlider.value);
        const cx = x || canvas.width / 2;
        const cy = y || canvas.height / 2;

        for (let i = 0; i < count; i++) {
          const angle = Math.random() * Math.PI * 2;
          const spark = new Spark(cx, cy, angle, force, life, size);
          // Add some randomness to initial position
          spark.x += (Math.random() - 0.5) * 5;
          spark.y += (Math.random() - 0.5) * 5;
          sparks.push(spark);
        }

        // Limit sparks
        if (sparks.length > 500) {
          sparks = sparks.slice(-400);
        }

        sparkCount.textContent = `✦ ${sparks.length} sparks`;
        sparksStatus.textContent = '✨ Flying';
        status.textContent = `💥 ${count} sparks flying!`;
        setTimeout(() => {
          if (sparks.length > 0) {
            sparksStatus.textContent = '✨ Flying';
          } else {
            sparksStatus.textContent = '✨ Idle';
          }
        }, 2000);
      }

      // ----- Random sparks -----
      function randomSparks() {
        const w = canvas.width;
        const h = canvas.height;
        const padding = 40;
        const x = padding + Math.random() * (w - padding * 2);
        const y = padding + Math.random() * (h - padding * 2);
        createSparks(x, y);
      }

      // ----- Clear sparks -----
      function clearSparks() {
        sparks = [];
        sparkCount.textContent = '✦ 0 sparks';
        sparksStatus.textContent = '✨ Idle';
        status.textContent = '🗑️ Sparks cleared';
        setTimeout(() => {
          status.textContent = '✨ Click Spark or tap the canvas to create sparks';
        }, 1000);
      }

      // ----- Toggle pause -----
      function togglePause() {
        isPaused = !isPaused;
        toggleBtn.textContent = isPaused ? '▶ Play' : '⏸ Pause';
        status.textContent = isPaused ? '⏸ Paused' : '▶ Resumed';
        sparksStatus.textContent = isPaused ? '⏸ Paused' : '✨ Flying';
      }

      // ----- Reset -----
      function resetSparks() {
        sparks = [];
        isPaused = false;
        toggleBtn.textContent = '⏸ Pause';
        sparksStatus.textContent = '✨ Idle';
        sparkCount.textContent = '✦ 0 sparks';
        countSlider.value = 40;
        countValue.textContent = '40';
        forceSlider.value = 5;
        forceValue.textContent = '5×';
        lifeSlider.value = 50;
        lifeValue.textContent = '50%';
        sizeSlider.value = 4;
        sizeValue.textContent = '4px';
        status.textContent = '↺ Reset';
        setTimeout(() => {
          status.textContent = '✨ Click Spark or tap the canvas to create sparks';
        }, 500);
      }

      // ----- Draw background -----
      function drawBackground() {
        const w = canvas.width;
        const h = canvas.height;
        const cx = w / 2;
        const cy = h / 2;

        // Dark background
        const bgGradient = ctx.createRadialGradient(cx, cy, 0, cx, cy, w * 0.8);
        bgGradient.addColorStop(0, '#0a0a1a');
        bgGradient.addColorStop(0.5, '#060612');
        bgGradient.addColorStop(1, '#020208');
        ctx.fillStyle = bgGradient;
        ctx.fillRect(0, 0, w, h);
      }

      // ----- Draw -----
      function draw() {
        const w = canvas.width;
        const h = canvas.height;

        drawBackground();

        // Update sparks
        if (!isPaused) {
          sparks = sparks.filter(s => s.alive);
          sparks.forEach(s => s.update());
        }

        // Draw sparks (sorted by size for depth)
        const sizeMult = parseInt(sizeSlider.value) / 4;
        const sortedSparks = [...sparks].sort((a, b) => a.size - b.size);
        sortedSparks.forEach(s => s.draw(ctx, sizeMult));

        // Update count
        sparkCount.textContent = `✦ ${sparks.length} sparks`;
        if (sparks.length === 0 && !isPaused) {
          sparksStatus.textContent = '✨ Idle';
        }
      }

      // ----- Animation loop -----
      function animate() {
        time += 0.016;
        draw();
        animationId = requestAnimationFrame(animate);
      }

      // ----- Start animation -----
      function startAnimation() {
        if (animationId) {
          cancelAnimationFrame(animationId);
        }
        animate();
      }

      // ----- Event Listeners -----
      // Mouse clicks
      canvas.addEventListener('click', (e) => {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        const x = (e.clientX - rect.left) * scaleX;
        const y = (e.clientY - rect.top) * scaleY;
        createSparks(x, y);
      });

      // Touch support
      canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        const touch = e.touches[0];
        const x = (touch.clientX - rect.left) * scaleX;
        const y = (touch.clientY - rect.top) * scaleY;
        createSparks(x, y);
      });

      // Buttons
      sparkBtn.addEventListener('click', randomSparks);
      clearBtn.addEventListener('click', clearSparks);
      toggleBtn.addEventListener('click', togglePause);
      resetBtn.addEventListener('click', resetSparks);

      // Sliders
      countSlider.addEventListener('input', (e) => {
        countValue.textContent = e.target.value;
      });

      forceSlider.addEventListener('input', (e) => {
        forceValue.textContent = e.target.value + '×';
      });

      lifeSlider.addEventListener('input', (e) => {
        lifeValue.textContent = e.target.value + '%';
      });

      sizeSlider.addEventListener('input', (e) => {
        sizeValue.textContent = e.target.value + 'px';
      });

      // Keyboard shortcuts
      document.addEventListener('keydown', (e) => {
        if (e.key === 's' || e.key === 'S') {
          e.preventDefault();
          randomSparks();
        }
        if (e.key === 'c' || e.key === 'C') {
          e.preventDefault();
          clearSparks();
        }
        if (e.key === ' ' || e.key === 'Space') {
          e.preventDefault();
          togglePause();
        }
        if (e.key === 'r' || e.key === 'R') {
          e.preventDefault();
          resetSparks();
        }
      });

      // ----- Resize handler -----
      let resizeTimeout;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(() => {
          setupCanvas();
        }, 200);
      });

      // ----- Init -----
      function init() {
        setupCanvas();
        startAnimation();
        status.textContent = '✨ Click Spark or tap the canvas to create sparks!';
        // Create initial sparks
        setTimeout(() => {
          const w = canvas.width;
          const h = canvas.height;
          const cx = w / 2;
          const cy = h / 2;
          createSparks(cx, cy);
        }, 300);
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }

    })();
  </script>
</body>
</html>
