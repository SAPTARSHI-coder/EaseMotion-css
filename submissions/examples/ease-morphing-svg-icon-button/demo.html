<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ease Morphing SVG Icon Action Button</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="morph-icon-body">
  <button class="morph-btn" id="mIconBtn">
    <span class="icon">▶</span>
    <span>Play</span>
  </button>

  <script>
    const btn = document.getElementById('mIconBtn');
    btn.addEventListener('click', () => {
      const isPlay = btn.children[0].textContent === '▶';
      btn.children[0].textContent = isPlay ? '⏸' : '▶';
      btn.children[1].textContent = isPlay ? 'Pause' : 'Play';
    });
  </script>
</body>
</html>
