<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EaseMotion - Brutalist Offcanvas Drawer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="em-container">
    <header class="em-header">
      <h1 class="em-title">BRUTALIST UI</h1>
      <p class="em-subtitle">No JS. All attitude. Pure CSS.</p>
      
      <!-- Pure CSS Toggle Hack (No JS Required) -->
      <input type="checkbox" id="brutal-drawer-toggle" class="em-drawer-toggle" aria-hidden="true" />
      
      <!-- Trigger Button -->
      <label for="brutal-drawer-toggle" class="em-btn em-btn-brutal" role="button" tabindex="0" aria-label="Open menu">
        OPEN MENU
      </label>

      <!-- Click-away Overlay -->
      <label for="brutal-drawer-toggle" class="em-drawer-overlay" aria-label="Close drawer"></label>

      <!-- Offcanvas Drawer Component -->
      <aside class="em-drawer" aria-labelledby="drawer-title">
        <div class="em-drawer-header">
          <h2 id="drawer-title" class="em-drawer-title">MENU</h2>
          <label for="brutal-drawer-toggle" class="em-drawer-close" aria-label="Close menu" tabindex="0" role="button">
            [ X ]
          </label>
        </div>
        
        <nav class="em-drawer-content">
          <ul class="em-nav-list">
            <li><a href="#" class="em-nav-link">HOME <span class="em-arrow">-></span></a></li>
            <li><a href="#" class="em-nav-link">ABOUT <span class="em-arrow">-></span></a></li>
            <li><a href="#" class="em-nav-link">WORK <span class="em-arrow">-></span></a></li>
            <li><a href="#" class="em-nav-link em-nav-link-alert">DESTROY <span class="em-arrow">-></span></a></li>
          </ul>
        </nav>
      </aside>
    </header>
  </main>
</body>
</html>
