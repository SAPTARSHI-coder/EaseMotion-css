<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Datepicker with Material Design Styling | EaseMotion CSS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="datepicker-wrapper" tabindex="0">
        <button class="datepicker-trigger" aria-haspopup="dialog" aria-expanded="false" aria-label="Select Date">
            <span>📅 August 14, 2026</span>
        </button>

        <div class="datepicker-card" role="dialog" aria-label="Material Design Calendar">
            <div class="datepicker-header">
                <span class="month-title">August 2026</span>
                <div>
                    <button class="nav-btn" aria-label="Previous Month">‹</button>
                    <button class="nav-btn" aria-label="Next Month">›</button>
                </div>
            </div>

            <div class="calendar-grid">
                <div class="day-header">S</div>
                <div class="day-header">M</div>
                <div class="day-header">T</div>
                <div class="day-header">W</div>
                <div class="day-header">T</div>
                <div class="day-header">F</div>
                <div class="day-header">S</div>

                <div class="day-cell muted">26</div>
                <div class="day-cell muted">27</div>
                <div class="day-cell muted">28</div>
                <div class="day-cell muted">29</div>
                <div class="day-cell muted">30</div>
                <div class="day-cell muted">31</div>
                <div class="day-cell">1</div>

                <div class="day-cell">2</div>
                <div class="day-cell">3</div>
                <div class="day-cell">4</div>
                <div class="day-cell">5</div>
                <div class="day-cell">6</div>
                <div class="day-cell">7</div>
                <div class="day-cell">8</div>

                <div class="day-cell">9</div>
                <div class="day-cell">10</div>
                <div class="day-cell">11</div>
                <div class="day-cell">12</div>
                <div class="day-cell">13</div>
                <div class="day-cell selected">14</div>
                <div class="day-cell">15</div>

                <div class="day-cell">16</div>
                <div class="day-cell">17</div>
                <div class="day-cell">18</div>
                <div class="day-cell">19</div>
                <div class="day-cell">20</div>
                <div class="day-cell">21</div>
                <div class="day-cell">22</div>

                <div class="day-cell">23</div>
                <div class="day-cell">24</div>
                <div class="day-cell">25</div>
                <div class="day-cell">26</div>
                <div class="day-cell">27</div>
                <div class="day-cell">28</div>
                <div class="day-cell">29</div>

                <div class="day-cell">30</div>
                <div class="day-cell">31</div>
                <div class="day-cell muted">1</div>
                <div class="day-cell muted">2</div>
                <div class="day-cell muted">3</div>
                <div class="day-cell muted">4</div>
                <div class="day-cell muted">5</div>
            </div>
        </div>
    </div>
</body>
</html>
