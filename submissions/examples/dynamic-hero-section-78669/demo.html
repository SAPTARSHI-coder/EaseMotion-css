<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dynamic Hero Section</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="hero">
      <section class="hero-content" aria-labelledby="title">
        <p class="eyebrow">EaseMotion CSS · Issue #78669</p>
        <h1 id="title">Build interfaces that move with purpose.</h1>
        <p class="description">
          A responsive hero section with layered lighting, focused typography,
          meaningful actions, and a subtle entrance animation.
        </p>

        <div class="actions" aria-label="Hero actions">
          <a class="button button-primary" href="#start">Get Started</a>
          <a class="button button-secondary" href="#learn">Learn More</a>
        </div>

        <div class="hero-meta" aria-label="Component highlights">
          <span>Responsive</span>
          <span>CSS motion</span>
          <span>Accessible</span>
        </div>
      </section>
    </main>
  </body>
</html>
