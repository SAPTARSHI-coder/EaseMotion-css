<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Segmented Tab Bar Indicator Position</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="container">

    <h1>Segmented Tab Bar</h1>

    <p class="subtitle">
      Interactive segmented tab bar with a smooth sliding indicator.
      This demo represents the UI whose indicator positioning logic is
      covered by the accompanying Vitest specification.
    </p>

    <div class="tab-group">

      <div class="indicator"></div>

      <button class="tab active">Home</button>

      <button class="tab">Explore</button>

      <button class="tab">Projects</button>

      <button class="tab">Settings</button>

    </div>

    <div class="preview-card">

      <h2>Selected Tab</h2>

      <p>
        Home
      </p>

    </div>

  </main>

  <script>
    const tabs = document.querySelectorAll(".tab");
    const indicator = document.querySelector(".indicator");

    function updateIndicator(tab) {
      indicator.style.width = `${tab.offsetWidth}px`;
      indicator.style.transform = `translateX(${tab.offsetLeft}px)`;

      tabs.forEach(item => item.classList.remove("active"));
      tab.classList.add("active");

      document.querySelector(".preview-card p").textContent = tab.textContent;
    }

    updateIndicator(tabs[0]);

    tabs.forEach(tab => {
      tab.addEventListener("click", () => updateIndicator(tab));
    });
  </script>

</body>
</html>
