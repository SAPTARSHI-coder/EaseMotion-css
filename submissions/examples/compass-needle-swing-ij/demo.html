<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-compass-needle-swing demo</title>
</head>
<body>
<div class="cm-app">
  <span class="cm-title">COMPASS</span>
  <div class="cm-face">
    <span class="cm-cardinal cm-n">N</span>
    <span class="cm-cardinal cm-e">E</span>
    <span class="cm-cardinal cm-s">S</span>
    <span class="cm-cardinal cm-w">W</span>
    <div class="cm-dial">
      <span class="cm-tick cm-tick-1"></span>
      <span class="cm-tick cm-tick-2"></span>
      <span class="cm-tick cm-tick-3"></span>
      <span class="cm-tick cm-tick-4"></span>
      <span class="cm-tick cm-tick-5"></span>
      <span class="cm-tick cm-tick-6"></span>
      <span class="cm-tick cm-tick-7"></span>
      <span class="cm-tick cm-tick-8"></span>
    </div>
    <div class="cm-needle">
      <span class="cm-half cm-half-n"></span>
      <span class="cm-half cm-half-s"></span>
      <span class="cm-pin"></span>
    </div>
    <span class="cm-index"></span>
  </div>
  <span class="cm-bearing">040&deg;</span>
</div>
</body>
</html>
