<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimalist Floating Action Button Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main style="padding: 2rem; max-width: 600px; margin: 0 auto;">
    <h1>Floating Action Button Accessibility Demo</h1>
    <p>Use <kbd>Tab</kbd> to focus on the FABs below. Press <kbd>Enter</kbd> or <kbd>Space</kbd> to trigger actions.</p>
  </main>

  <!-- Default Primary FAB -->
  <button type="button" class="fab" aria-label="Create new item">
    <svg class="fab__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
    </svg>
  </button>

  <!-- Secondary Modifier FAB -->
  <button type="button" class="fab fab--secondary" aria-label="Contact support" style="bottom: 5.5rem;">
    <svg class="fab__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/>
    </svg>
  </button>

</body>
</html>
