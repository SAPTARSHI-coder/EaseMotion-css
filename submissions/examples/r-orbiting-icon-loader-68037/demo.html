<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orbiting Icon Loader</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="loader-demo">
    <div class="orbit-loader" role="status" aria-label="Loading">
      <span class="orbit-loader__core" aria-hidden="true">✦</span>

      <span class="orbit orbit--one" aria-hidden="true">
        <span class="orbit__icon">✦</span>
      </span>

      <span class="orbit orbit--two" aria-hidden="true">
        <span class="orbit__icon">●</span>
      </span>

      <span class="orbit orbit--three" aria-hidden="true">
        <span class="orbit__icon">◆</span>
      </span>
    </div>

    <p class="loader-label">Loading...</p>
  </main>

</body>
</html>
