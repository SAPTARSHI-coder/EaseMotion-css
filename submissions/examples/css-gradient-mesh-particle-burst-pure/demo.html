<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Mesh Gradient: Particle Burst</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Background Mesh Gradient -->
    <div class="particle-mesh-bg"></div>

    <div class="container">
        <header class="header">
            <h1 class="burst-text" data-text="Particle Burst">Particle Burst</h1>
            <p>Hardware-accelerated CSS mesh gradients exploding with vivid particle physics.</p>
        </header>

        <main class="grid">
            
            <!-- Interactive Burst Card -->
            <section class="demo-section">
                <div class="demo-content">
                    <h2>Supernova Card</h2>
                    <p>Hover to trigger a violent mesh expansion and particle ejection.</p>
                    
                    <div class="component-box dark-box">
                        <div class="burst-card">
                            <div class="mesh-core"></div>
                            <div class="particle-emitter"></div>
                            <div class="card-content">
                                <h3>SUPERNOVA</h3>
                                <p>Energy reading: Critical</p>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Pulsing Starburst Button -->
            <section class="demo-section">
                <div class="demo-content">
                    <h2>Starburst Button</h2>
                    <p>Continuous radial gradient pulsing with micro-particle shadows.</p>
                    
                    <div class="component-box dark-box">
                        <button class="btn btn-burst">
                            <span class="btn-bg"></span>
                            <span class="btn-text">IGNITE</span>
                            <span class="btn-particles"></span>
                        </button>
                    </div>
                </div>
            </section>
            
        </main>
    </div>

</body>
</html>
