<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Focus Ring Visibility on Gradient Backgrounds Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Screen Reader Live Region for State Announcements -->
  <div 
    id="a11y-announcer" 
    class="sr-only" 
    role="status" 
    aria-live="polite" 
    aria-atomic="true"
  ></div>

  <main id="main-content" tabindex="-1">
    <h1>Gradient Focus Ring Audit</h1>
    <p>
      Tab through the interactive controls below to inspect the WCAG 2.1 AA dual-layer 
      focus ring pattern designed to guarantee contrast over shifting multi-colored gradients.
    </p>

    <div class="demo-grid">
      <!-- Section 1: Standard Controls on Dark Mesh Gradient -->
      <div class="demo-group">
        <button type="button" class="accessible-btn" id="btn-primary">
          <span>⚡ Execute Core Action</span>
        </button>
      </div>

      <!-- Section 2: Controls Embedded Directly on Vivid Multi-Hue Gradient -->
      <div class="gradient-card">
        <span style="font-weight: 700; color: #ffffff; text-shadow: 0 1px 3px rgba(0,0,0,0.5);">
          Vivid Gradient Panel
        </span>
        <button type="button" class="accessible-btn accessible-btn-secondary" id="btn-secondary">
          <span>Inspect Contrast</span>
        </button>
      </div>

      <!-- Section 3: Interactive Link Component -->
      <div>
        <a href="#executed" class="accessible-btn" id="link-action">
          <span>Explore Component Specs &rarr;</span>
        </a>
      </div>
    </div>
  </main>

  <script>
    // Accessibility State Announcement Manager for Screen Readers
    document.addEventListener('DOMContentLoaded', () => {
      const announcer = document.getElementById('a11y-announcer');
      const buttons = document.querySelectorAll('.accessible-btn');

      buttons.forEach((btn) => {
        btn.addEventListener('click', (e) => {
          if (btn.tagName === 'A') {
            e.preventDefault();
          }
          const label = btn.innerText.trim();
          
          // Trigger live region announcement for screen readers
          announcer.textContent = '';
          setTimeout(() => {
            announcer.textContent = `Action triggered: ${label}`;
          }, 50);
        });
      });
    });
  </script>
</body>
</html>
