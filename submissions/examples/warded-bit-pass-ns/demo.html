<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Warded Bit Pass — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Warded Bit Pass demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Warded Bit Pass</h1>
      <p class="lede">Warded bit passing the obstruction</p>
    </header>

    <section class="ease-warded-bit-pass" data-demo="warded-bit-pass" aria-live="polite">
      <div class="ease-warded-bit-pass__housing">
        <div class="ease-warded-bit-pass__bezel">
          <div class="ease-warded-bit-pass__face">
            <div class="ease-warded-bit-pass__readout">
              <span class="ease-warded-bit-pass__label">Warded Bit Pass</span>
              <span class="ease-warded-bit-pass__value">LIVE</span>
            </div>
            <div class="ease-warded-bit-pass__motion" aria-hidden="true">
              <span class="ease-warded-bit-pass__a"></span>
              <span class="ease-warded-bit-pass__b"></span>
              <span class="ease-warded-bit-pass__c"></span>
              <span class="ease-warded-bit-pass__d"></span>
            </div>
            <div class="ease-warded-bit-pass__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-warded-bit-pass__controls">
          <button type="button" class="ease-warded-bit-pass__btn primary">Pass</button>
          <button type="button" class="ease-warded-bit-pass__btn">Stop</button>
          <label class="ease-warded-bit-pass__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-warded-bit-pass__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
