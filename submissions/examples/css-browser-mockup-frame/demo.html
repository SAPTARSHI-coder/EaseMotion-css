<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Browser Mockup Frame</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="showcase">
    <h1>CSS Browser Mockup Frame</h1>
    <p>A pure CSS responsive browser window frame for showcasing website screenshots and UI previews.</p>

    <!-- Browser Mockup Component -->
    <div class="browser-mockup" role="region" aria-label="Browser Window Preview">
      
      <!-- Top Chrome / Header -->
      <div class="browser-header">
        <div class="browser-controls" aria-hidden="true">
          <span class="dot close"></span>
          <span class="dot minimize"></span>
          <span class="dot maximize"></span>
        </div>
        
        <div class="browser-address-bar">
          <svg class="lock-icon" viewBox="0 0 24 24" width="12" height="12" fill="currentColor" aria-hidden="true">
            <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
          </svg>
          <span class="url-text">https://easemotion-css.dev/preview</span>
        </div>
      </div>

      <!-- Browser Viewport / Content Area -->
      <div class="browser-body">
        <div class="content-placeholder">
          <h2>Your Web Page Here</h2>
          <p>Drop your images, frames, or interactive HTML content inside <code>.browser-body</code>.</p>
        </div>
      </div>

    </div>
  </main>

</body>
</html>
