<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memory Reef</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="reef-app">

    <section class="reef-display" id="reefDisplay">

      <canvas id="reefCanvas"></canvas>

      <div class="reef-header">
        <div>
          <span class="eyebrow">UNDERWATER ECOSYSTEM</span>
          <h1>Memory Reef</h1>
          <p>Click anywhere to grow the reef.</p>
        </div>

        <div class="reef-counter">
          <span>🪸 Colonies</span>
          <strong id="reefCount">0</strong>
        </div>
      </div>

      <div class="reef-message">
        <span class="message-icon">🌊</span>
        <span id="reefMessage">The reef is waiting to grow...</span>
      </div>

      <div class="reef-controls">

        <button
          class="reef-button grow-button"
          id="growButton">
          🪸 Grow Coral
        </button>

        <button
          class="reef-button reset-button"
          id="resetButton">
          ↻ Reset Reef
        </button>

      </div>

      <div class="reef-hint">
        SPACE · Grow Coral &nbsp;&nbsp; R · Reset
      </div>

    </section>

  </main>

  <script>
    const canvas = document.getElementById("reefCanvas");
    const ctx = canvas.getContext("2d");

    const reefDisplay = document.getElementById("reefDisplay");
    const reefCount = document.getElementById("reefCount");
    const reefMessage = document.getElementById("reefMessage");
    const growButton = document.getElementById("growButton");
    const resetButton = document.getElementById("resetButton");

    let width = 0;
    let height = 0;

    const corals = [];
    const bubbles = [];
    const particles = [];
    const fish = [];

    const coralColors = [
      "#ff719c",
      "#ff9f68",
      "#d889ff",
      "#65e6d0",
      "#ffcf70"
    ];

    const coralTypes = [
      "branch",
      "fan",
      "tube",
      "bloom"
    ];

    let mouse = {
      x: -1000,
      y: -1000
    };

    function resizeCanvas() {
      const rect = reefDisplay.getBoundingClientRect();

      width = rect.width;
      height = rect.height;

      const dpr = window.devicePixelRatio || 1;

      canvas.width = width * dpr;
      canvas.height = height * dpr;

      canvas.style.width = width + "px";
      canvas.style.height = height + "px";

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function random(min, max) {
      return Math.random() * (max - min) + min;
    }

    function createParticles() {
      particles.length = 0;

      for (let i = 0; i < 65; i++) {
        particles.push({
          x: random(0, width),
          y: random(0, height),
          size: random(0.5, 2),
          speed: random(0.08, 0.25),
          phase: random(0, Math.PI * 2)
        });
      }
    }

    function createFish() {
      fish.length = 0;

      for (let i = 0; i < 8; i++) {
        fish.push({
          x: random(-width, width),
          y: random(height * 0.15, height * 0.65),
          speed: random(0.2, 0.55),
          size: random(0.5, 1.2),
          phase: random(0, Math.PI * 2)
        });
      }
    }

    function createCoral(x, y) {
      const coral = {
        x,
        y,
        type: coralTypes[
          Math.floor(Math.random() * coralTypes.length)
        ],
        color: coralColors[
          Math.floor(Math.random() * coralColors.length)
        ],
        progress: 0,
        target: 1,
        pulse: random(0, Math.PI * 2),
        scale: random(0.75, 1.15),
        seed: random(0, 100)
      };

      corals.push(coral);

      for (let i = 0; i < Math.floor(random(4, 9)); i++) {
        bubbles.push({
          x: x + random(-15, 15),
          y: y,
          size: random(2, 6),
          speed: random(0.4, 1),
          wobble: random(0.4, 0.8),
          phase: random(0, Math.PI * 2),
          life: 1
        });
      }

      reefCount.textContent = corals.length;

      reefMessage.textContent =
        corals.length === 1
          ? "A new coral colony has begun growing."
          : "The reef is becoming more alive...";
    }

    function drawBackground(time) {
      const gradient = ctx.createLinearGradient(
        0,
        0,
        0,
        height
      );

      gradient.addColorStop(0, "#071f3a");
      gradient.addColorStop(0.5, "#083b55");
      gradient.addColorStop(1, "#041824");

      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, width, height);

      drawCaustics(time);

      ctx.fillStyle = "rgba(2, 14, 20, 0.65)";
      ctx.fillRect(0, height * 0.86, width, height * 0.14);
    }

    function drawCaustics(time) {
      ctx.save();

      ctx.globalAlpha = 0.08;

      for (let i = 0; i < 9; i++) {
        const x =
          ((i * 170 + time * 0.025) % (width + 200)) - 100;

        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x + 90, height * 0.65);
        ctx.lineTo(x + 135, height * 0.65);
        ctx.lineTo(x + 35, 0);
        ctx.closePath();

        ctx.fillStyle = "#a7f3e5";
        ctx.fill();
      }

      ctx.restore();
    }

    function drawParticles(time) {
      particles.forEach(particle => {
        particle.y -= particle.speed;

        if (particle.y < 0) {
          particle.y = height;
        }

        const wobble =
          Math.sin(time * 0.001 + particle.phase) * 3;

        ctx.beginPath();

        ctx.arc(
          particle.x + wobble,
          particle.y,
          particle.size,
          0,
          Math.PI * 2
        );

        ctx.fillStyle = "rgba(190, 240, 235, 0.45)";
        ctx.fill();
      });
    }

    function drawFish(time) {
      fish.forEach(f => {
        f.x += f.speed;

        if (f.x > width + 50) {
          f.x = -50;
          f.y = random(height * 0.15, height * 0.65);
        }

        const bob =
          Math.sin(time * 0.001 + f.phase) * 5;

        ctx.save();

        ctx.translate(f.x, f.y + bob);
        ctx.scale(f.size, f.size);

        ctx.fillStyle = "rgba(150, 205, 210, 0.2)";

        ctx.beginPath();
        ctx.ellipse(0, 0, 14, 7, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(-12, 0);
        ctx.lineTo(-21, -7);
        ctx.lineTo(-21, 7);
        ctx.closePath();
        ctx.fill();

        ctx.restore();
      });
    }

    function drawBranch(x, y, length, angle, color, depth) {
      if (depth <= 0) return;

      ctx.save();

      ctx.translate(x, y);
      ctx.rotate(angle);

      ctx.lineWidth = Math.max(1.5, depth * 1.5);
      ctx.strokeStyle = color;
      ctx.lineCap = "round";

      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(
        length * 0.5,
        -5,
        length,
        0
      );
      ctx.stroke();

      ctx.restore();

      drawBranch(
        x + Math.cos(angle) * length,
        y + Math.sin(angle) * length,
        length * 0.68,
        angle - 0.35,
        color,
        depth - 1
      );

      drawBranch(
        x + Math.cos(angle) * length,
        y + Math.sin(angle) * length,
        length * 0.65,
        angle + 0.4,
        color,
        depth - 1
      );
    }

    function drawCoral(coral, time) {
      coral.progress +=
        (coral.target - coral.progress) * 0.025;

      const progress = coral.progress;

      const pulse =
        1 + Math.sin(time * 0.0015 + coral.pulse) * 0.035;

      ctx.save();

      ctx.translate(coral.x, coral.y);
      ctx.scale(
        coral.scale * progress * pulse,
        coral.scale * progress * pulse
      );

      ctx.shadowBlur = 12;
      ctx.shadowColor = coral.color;

      if (coral.type === "branch") {
        drawBranch(
          0,
          0,
          35,
          -Math.PI / 2,
          coral.color,
          4
        );
      }

      if (coral.type === "fan") {
        for (let i = -3; i <= 3; i++) {
          drawBranch(
            0,
            0,
            38,
            -Math.PI / 2 + i * 0.2,
            coral.color,
            3
          );
        }
      }

      if (coral.type === "tube") {
        for (let i = -2; i <= 2; i++) {
          const tubeHeight = 28 + Math.abs(i) * 8;

          ctx.fillStyle = coral.color;

          ctx.beginPath();
          ctx.roundRect(
            i * 9 - 4,
            -tubeHeight,
            8,
            tubeHeight,
            4
          );

          ctx.fill();
        }
      }

      if (coral.type === "bloom") {
        for (let i = 0; i < 8; i++) {
          const angle = i * Math.PI / 4;

          ctx.save();

          ctx.rotate(angle);

          ctx.fillStyle = coral.color;

          ctx.beginPath();
          ctx.ellipse(
            0,
            -17,
            7,
            17,
            0,
            0,
            Math.PI * 2
          );

          ctx.fill();

          ctx.restore();
        }

        ctx.beginPath();
        ctx.arc(0, 0, 8, 0, Math.PI * 2);

        ctx.fillStyle = "#ffe9a8";
        ctx.fill();
      }

      ctx.restore();
    }

    function drawBubbles(time) {
      for (let i = bubbles.length - 1; i >= 0; i--) {
        const bubble = bubbles[i];

        bubble.y -= bubble.speed;

        bubble.x +=
          Math.sin(time * 0.002 + bubble.phase) *
          bubble.wobble;

        bubble.life -= 0.004;

        ctx.beginPath();

        ctx.arc(
          bubble.x,
          bubble.y,
          bubble.size,
          0,
          Math.PI * 2
        );

        ctx.strokeStyle =
          `rgba(210,250,245,${bubble.life})`;

        ctx.lineWidth = 1;

        ctx.stroke();

        if (bubble.life <= 0) {
          bubbles.splice(i, 1);
        }
      }
    }

    function draw(time) {
      drawBackground(time);
      drawParticles(time);
      drawFish(time);

      corals.forEach(coral => {
        drawCoral(coral, time);
      });

      drawBubbles(time);

      requestAnimationFrame(draw);
    }

    function pointerPosition(event) {
      const rect = canvas.getBoundingClientRect();

      return {
        x: event.clientX - rect.left,
        y: event.clientY - rect.top
      };
    }

    canvas.addEventListener("click", event => {
      const position = pointerPosition(event);

      createCoral(
        position.x,
        Math.min(position.y, height * 0.86)
      );
    });

    canvas.addEventListener("mousemove", event => {
      const position = pointerPosition(event);

      mouse.x = position.x;
      mouse.y = position.y;
    });

    growButton.addEventListener("click", () => {
      createCoral(
        random(width * 0.2, width * 0.8),
        random(height * 0.55, height * 0.8)
      );
    });

    resetButton.addEventListener("click", () => {
      corals.length = 0;
      bubbles.length = 0;

      reefCount.textContent = "0";
      reefMessage.textContent =
        "The reef is waiting to grow...";
    });

    document.addEventListener("keydown", event => {
      if (event.code === "Space") {
        event.preventDefault();

        createCoral(
          random(width * 0.15, width * 0.85),
          random(height * 0.55, height * 0.8)
        );
      }

      if (event.key.toLowerCase() === "r") {
        corals.length = 0;
        bubbles.length = 0;

        reefCount.textContent = "0";
        reefMessage.textContent =
          "The reef is waiting to grow...";
      }
    });

    window.addEventListener("resize", () => {
      resizeCanvas();
      createParticles();
      createFish();
    });

    resizeCanvas();
    createParticles();
    createFish();

    requestAnimationFrame(draw);
  </script>

</body>
</html>
