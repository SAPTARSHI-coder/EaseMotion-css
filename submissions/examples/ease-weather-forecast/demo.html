<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Forecast · Weather Changes on Interaction</title>
    <meta name="description" content="Interactive weather forecast with dynamic weather changes, atmospheric effects, and real-time transitions.">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1 class="title">🌤️ WEATHER FORECAST</h1>
        
        <div class="canvas-wrapper">
            <canvas id="weatherCanvas" width="600" height="500"></canvas>
            <div class="glow-overlay"></div>
        </div>

        <div class="controls">
            <div class="button-group">
                <button class="change-btn" id="changeBtn">🌤️ CHANGE</button>
                <button class="reset-btn" id="resetBtn">⟳ RESET</button>
                <button class="toggle-btn" id="toggleBtn">⏸️ PAUSE</button>
            </div>
            <div class="speed-control">
                <label>Speed</label>
                <input type="range" id="speedSlider" min="1" max="10" value="5">
                <span id="speedLabel">5</span>
                <label>Particles</label>
                <input type="range" id="particlesSlider" min="50" max="400" value="200">
                <span id="particlesLabel">200</span>
            </div>
        </div>

        <div class="info">
            <span>🌤️ WEATHER FORECAST</span>
            <small>sun · rain · snow · wind</small>
        </div>
        <div class="hint">
            <span>🌤️ click to change the weather</span>
        </div>
    </div>

    <script>
        (function() {
            const canvas = document.getElementById('weatherCanvas');
            const ctx = canvas.getContext('2d');
            const W = 600, H = 500;
            
            const changeBtn = document.getElementById('changeBtn');
            const resetBtn = document.getElementById('resetBtn');
            const toggleBtn = document.getElementById('toggleBtn');
            const speedSlider = document.getElementById('speedSlider');
            const speedLabel = document.getElementById('speedLabel');
            const particlesSlider = document.getElementById('particlesSlider');
            const particlesLabel = document.getElementById('particlesLabel');

            let isAnimating = true;
            let speed = 5;
            let maxParticles = 200;
            let time = 0;
            let weatherIndex = 0;
            let transitionProgress = 0;
            let isTransitioning = false;

            // ---- Weather Types ----
            const weatherTypes = [
                { name: 'Sunny', icon: '☀️', color: '#ffd700' },
                { name: 'Rainy', icon: '🌧️', color: '#4a90d9' },
                { name: 'Snowy', icon: '❄️', color: '#c8d8e8' },
                { name: 'Windy', icon: '💨', color: '#88aacc' },
                { name: 'Stormy', icon: '⛈️', color: '#4a5a6a' },
                { name: 'Cloudy', icon: '☁️', color: '#8a9aaa' },
                { name: 'Foggy', icon: '🌫️', color: '#aabbcc' }
            ];

            // ---- Particles ----
            let particles = [];

            // ---- Particle Class ----
            class Particle {
                constructor(x, y) {
                    this.x = x || Math.random() * W;
                    this.y = y || Math.random() * H;
                    this.size = 2 + Math.random() * 4;
                    this.speed = 1 + Math.random() * 3;
                    this.angle = Math.random() * Math.PI * 2;
                    this.life = 1;
                    this.type = 'rain';
                }

                update(weather) {
                    const dt = 0.02 * (speed / 5);
                    
                    switch(weather) {
                        case 'rain':
                            this.x += Math.cos(this.angle) * this.speed * 0.5 * dt;
                            this.y += this.speed * 2 * dt;
                            break;
                        case 'snow':
                            this.x += Math.sin(this.angle + time * 0.01) * this.speed * 0.3 * dt;
                            this.y += this.speed * 0.5 * dt;
                            break;
                        case 'windy':
                            this.x += this.speed * 2 * dt;
                            this.y += Math.sin(this.angle + time * 0.02) * this.speed * 0.2 * dt;
                            break;
                        case 'stormy':
                            this.x += Math.cos(this.angle) * this.speed * 0.8 * dt;
                            this.y += this.speed * 2.5 * dt;
                            this.x += Math.sin(time * 0.1 + this.angle) * 0.5;
                            break;
                        default:
                            this.x += Math.sin(time * 0.01 + this.angle) * 0.2 * dt;
                            this.y += Math.cos(time * 0.01 + this.angle) * 0.2 * dt;
                    }
                    
                    // Wrap around
                    if (this.x < -20) this.x = W + 20;
                    if (this.x > W + 20) this.x = -20;
                    if (this.y < -20) this.y = H + 20;
                    if (this.y > H + 20) this.y = -20;
                }

                draw(ctx, weather) {
                    const alpha = this.life * 0.5;
                    ctx.save();
                    ctx.globalAlpha = alpha;
                    
                    switch(weather) {
                        case 'rain':
                            ctx.strokeStyle = 'rgba(100, 180, 255, 0.3)';
                            ctx.lineWidth = 1;
                            ctx.beginPath();
                            ctx.moveTo(this.x, this.y);
                            ctx.lineTo(this.x - 3, this.y + 8);
                            ctx.stroke();
                            break;
                        case 'snow':
                            ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
                            ctx.shadowColor = 'rgba(200, 220, 255, 0.1)';
                            ctx.shadowBlur = 10;
                            ctx.beginPath();
                            ctx.arc(this.x, this.y, this.size * 0.5, 0, Math.PI * 2);
                            ctx.fill();
                            break;
                        case 'windy':
                            ctx.strokeStyle = 'rgba(200, 220, 240, 0.15)';
                            ctx.lineWidth = 1;
                            ctx.beginPath();
                            ctx.moveTo(this.x, this.y);
                            ctx.lineTo(this.x + 10, this.y);
                            ctx.stroke();
                            break;
                        case 'stormy':
                            ctx.fillStyle = 'rgba(100, 150, 200, 0.2)';
                            ctx.beginPath();
                            ctx.arc(this.x, this.y, this.size * 0.3, 0, Math.PI * 2);
                            ctx.fill();
                            break;
                        default:
                            ctx.fillStyle = 'rgba(255, 255, 200, 0.05)';
                            ctx.beginPath();
                            ctx.arc(this.x, this.y, this.size * 0.3, 0, Math.PI * 2);
                            ctx.fill();
                    }
                    
                    ctx.restore();
                }
            }

            // ---- Create Particles ----
            function createParticles(count) {
                particles = [];
                for (let i = 0; i < count; i++) {
                    particles.push(new Particle());
                }
            }

            // ---- Draw Sun ----
            function drawSun(ctx, x, y, radius) {
                const grad = ctx.createRadialGradient(x, y, 0, x, y, radius * 2);
                grad.addColorStop(0, 'rgba(255, 220, 100, 0.3)');
                grad.addColorStop(0.3, 'rgba(255, 200, 80, 0.2)');
                grad.addColorStop(0.7, 'rgba(255, 180, 60, 0.1)');
                grad.addColorStop(1, 'rgba(255, 180, 60, 0)');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(x, y, radius * 2, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.save();
                ctx.shadowColor = 'rgba(255, 200, 100, 0.1)';
                ctx.shadowBlur = 30;
                ctx.fillStyle = '#ffd700';
                ctx.beginPath();
                ctx.arc(x, y, radius, 0, Math.PI * 2);
                ctx.fill();
                
                // Rays
                for (let i = 0; i < 12; i++) {
                    const angle = (i / 12) * Math.PI * 2 + time * 0.005;
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = 'rgba(255, 200, 100, 0.05)';
                    ctx.beginPath();
                    ctx.ellipse(
                        x + Math.cos(angle) * radius * 1.3,
                        y + Math.sin(angle) * radius * 1.3,
                        radius * 0.3,
                        radius * 0.05,
                        angle,
                        0,
                        Math.PI * 2
                    );
                    ctx.fill();
                }
                ctx.restore();
            }

            // ---- Draw Cloud ----
            function drawCloud(ctx, x, y, size) {
                ctx.save();
                ctx.shadowColor = 'rgba(200, 200, 220, 0.05)';
                ctx.shadowBlur = 20;
                ctx.fillStyle = 'rgba(200, 210, 220, 0.15)';
                for (let i = 0; i < 5; i++) {
                    const angle = (i / 5) * Math.PI * 2;
                    const r = size * (0.4 + Math.sin(i * 1.5) * 0.2);
                    const cx = x + Math.cos(angle) * r * 0.6;
                    const cy = y + Math.sin(angle) * r * 0.3;
                    ctx.beginPath();
                    ctx.arc(cx, cy, r * 0.4, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            }

            // ---- Draw Landscape ----
            function drawLandscape() {
                // Ground
                const grad = ctx.createLinearGradient(0, H - 60, 0, H);
                grad.addColorStop(0, 'rgba(20, 40, 60, 0)');
                grad.addColorStop(0.3, 'rgba(20, 40, 60, 0.1)');
                grad.addColorStop(0.7, 'rgba(20, 40, 60, 0.2)');
                grad.addColorStop(1, 'rgba(20, 40, 60, 0.3)');
                ctx.fillStyle = grad;
                ctx.fillRect(0, H - 60, W, 60);
                
                // Mountains
                ctx.fillStyle = 'rgba(30, 50, 70, 0.05)';
                for (let i = 0; i < 3; i++) {
                    const x = i * 250 + 50;
                    const h = 60 + Math.sin(i * 1.5) * 30;
                    ctx.beginPath();
                    ctx.moveTo(x - 80, H - 60);
                    ctx.quadraticCurveTo(x, H - 60 - h, x + 80, H - 60);
                    ctx.fill();
                }
            }

            // ---- Render ----
            function render() {
                // Sky gradient
                const weather = weatherTypes[weatherIndex];
                const skyGrad = ctx.createLinearGradient(0, 0, 0, H);
                const skyColors = {
                    'Sunny': ['#1a3a5a', '#2a5a7a', '#3a7a5a'],
                    'Rainy': ['#0a1a2a', '#1a2a3a', '#1a2a3a'],
                    'Snowy': ['#2a3a4a', '#3a4a5a', '#4a5a6a'],
                    'Windy': ['#0d1a2a', '#1a2a3a', '#1a2a3a'],
                    'Stormy': ['#050a12', '#0a1520', '#0a1520'],
                    'Cloudy': ['#0d1a2a', '#1a2a3a', '#1a2a3a'],
                    'Foggy': ['#1a2a3a', '#2a3a4a', '#3a4a5a']
                };
                const colors = skyColors[weather.name] || ['#0d1a2a', '#0a1520', '#080e18'];
                skyGrad.addColorStop(0, colors[0]);
                skyGrad.addColorStop(0.5, colors[1]);
                skyGrad.addColorStop(1, colors[2]);
                ctx.fillStyle = skyGrad;
                ctx.fillRect(0, 0, W, H);
                
                // Landscape
                drawLandscape();
                
                // Weather effects
                switch(weather.name) {
                    case 'Sunny':
                        drawSun(ctx, 80, 80, 40);
                        // Light rays
                        for (let i = 0; i < 5; i++) {
                            const x = i * 150 + 50;
                            const grad2 = ctx.createLinearGradient(x, 0, x + 10, H);
                            grad2.addColorStop(0, 'rgba(255, 200, 100, 0.01)');
                            grad2.addColorStop(1, 'rgba(255, 200, 100, 0)');
                            ctx.fillStyle = grad2;
                            ctx.fillRect(x, 0, 10, H);
                        }
                        break;
                    case 'Rainy':
                        drawCloud(ctx, 150, 60, 60);
                        drawCloud(ctx, 400, 80, 50);
                        break;
                    case 'Snowy':
                        drawCloud(ctx, 200, 50, 70);
                        drawCloud(ctx, 450, 70, 50);
                        break;
                    case 'Cloudy':
                        drawCloud(ctx, 100, 60, 80);
                        drawCloud(ctx, 350, 70, 60);
                        drawCloud(ctx, 500, 50, 50);
                        break;
                    case 'Stormy':
                        drawCloud(ctx, 150, 50, 80);
                        drawCloud(ctx, 400, 60, 70);
                        // Lightning flash
                        if (Math.random() < 0.01) {
                            ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
                            ctx.fillRect(0, 0, W, H);
                        }
                        break;
                    case 'Foggy':
                        for (let i = 0; i < 8; i++) {
                            const x = i * 80 + Math.sin(time * 0.005 + i) * 30;
                            const y = 100 + i * 40 + Math.sin(time * 0.01 + i * 1.5) * 20;
                            const grad2 = ctx.createRadialGradient(x, y, 0, x, y, 80);
                            grad2.addColorStop(0, 'rgba(200, 210, 220, 0.04)');
                            grad2.addColorStop(0.5, 'rgba(200, 210, 220, 0.02)');
                            grad2.addColorStop(1, 'rgba(200, 210, 220, 0)');
                            ctx.fillStyle = grad2;
                            ctx.beginPath();
                            ctx.arc(x, y, 80, 0, Math.PI * 2);
                            ctx.fill();
                        }
                        break;
                }
                
                // Draw particles
                for (let p of particles) {
                    p.draw(ctx, weather.name.toLowerCase());
                }
                
                // Weather info
                ctx.save();
                ctx.shadowBlur = 0;
                ctx.fillStyle = 'rgba(200, 220, 240, 0.15)';
                ctx.font = '16px monospace';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'top';
                ctx.fillText(`${weather.icon} ${weather.name}`, W/2, 20);
                ctx.font = '13px monospace';
                ctx.fillText(`Particles: ${particles.length}`, W/2, 45);
                ctx.restore();
            }

            // ---- Change Weather ----
            function changeWeather() {
                weatherIndex = (weatherIndex + 1) % weatherTypes.length;
                const weather = weatherTypes[weatherIndex];
                createParticles(maxParticles);
                // Adjust particle types
                for (let p of particles) {
                    p.type = weather.name.toLowerCase();
                }
            }

            // ---- Reset ----
            function resetWeather() {
                weatherIndex = 0;
                createParticles(maxParticles);
                for (let p of particles) {
                    p.type = weatherTypes[0].name.toLowerCase();
                }
                time = 0;
            }

            // ---- Animation Loop ----
            function animate() {
                if (!isAnimating) {
                    requestAnimationFrame(animate);
                    return;
                }
                
                time += 0.01;
                const weather = weatherTypes[weatherIndex].name.toLowerCase();
                
                // Update particles
                for (let p of particles) {
                    p.update(weather);
                }
                
                render();
                
                requestAnimationFrame(animate);
            }

            // ---- Toggle Animation ----
            function toggleAnimation() {
                isAnimating = !isAnimating;
                toggleBtn.textContent = isAnimating ? '⏸️ PAUSE' : '▶️ PLAY';
            }

            // ---- Update Labels ----
            speedSlider.addEventListener('input', function() {
                speedLabel.textContent = this.value;
            });
            particlesSlider.addEventListener('input', function() {
                maxParticles = parseInt(this.value);
                particlesLabel.textContent = maxParticles;
                createParticles(maxParticles);
            });

            // ---- Event Listeners ----
            changeBtn.addEventListener('click', changeWeather);
            resetBtn.addEventListener('click', resetWeather);
            toggleBtn.addEventListener('click', toggleAnimation);

            // ---- Keyboard Shortcuts ----
            document.addEventListener('keydown', function(e) {
                if (e.key === ' ' || e.key === 'Space') {
                    e.preventDefault();
                    changeWeather();
                }
                if (e.key === 'r' || e.key === 'R') {
                    resetWeather();
                }
                if (e.key === 'p' || e.key === 'P') {
                    toggleAnimation();
                }
            });

            // ---- Click on canvas to change ----
            canvas.addEventListener('click', function(e) {
                changeWeather();
            });

            // ---- Initialize ----
            createParticles(maxParticles);
            render();
            animate();

            console.log('🌤️ Weather Forecast · Click Change or press Space to change the weather!');
        })();
    </script>
</body>
</html>
