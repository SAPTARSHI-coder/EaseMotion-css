<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ease-animated-toggle-list-filter-sap demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { height: 100vh; margin: 0; display: flex; align-items: center; justify-content: center; background: #f4f4f5; }
  </style>
</head>
<body>
  <div class="toggle-filter-sap">
    <div class="filter-pills" id="pills">
      <button class="filter-pill active" data-cat="all">All</button>
      <button class="filter-pill" data-cat="fruit">Fruit</button>
      <button class="filter-pill" data-cat="veg">Vegetable</button>
    </div>
    <div class="filter-list" id="list">
      <div class="filter-row" data-cat="fruit"><span>🍎 Apple</span></div>
      <div class="filter-row" data-cat="veg"><span>🥦 Broccoli</span></div>
      <div class="filter-row" data-cat="fruit"><span>🍌 Banana</span></div>
      <div class="filter-row" data-cat="veg"><span>🥕 Carrot</span></div>
    </div>
  </div>
  <script>
    const pills = document.querySelectorAll('.filter-pill');
    const rows = document.querySelectorAll('.filter-row');

    pills.forEach(pill => {
      pill.addEventListener('click', () => {
        pills.forEach(p => p.classList.remove('active'));
        pill.classList.add('active');
        const cat = pill.dataset.cat;
        rows.forEach(row => {
          const match = cat === 'all' || row.dataset.cat === cat;
          row.classList.toggle('hidden', !match);
        });
      });
    });
  </script>
</body>
</html>
