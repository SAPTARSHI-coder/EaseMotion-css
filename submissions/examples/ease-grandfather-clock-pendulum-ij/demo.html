<!-- EaseMotion component: grandfather-clock-pendulum -->
<!DOCTYPE html>
<html lang="en" data-clock="grand">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
<title>Ease Grandfather Clock Pendulum</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="grand-clock">
  <header class="grand-head">
    <span class="grand-make">HALLMARK</span>
    <span class="grand-chime">CHIME</span>
  </header>
  <div class="grand-case">
    <span class="grand-face">
      <span class="face-hand hand-hour"></span>
      <span class="face-hand hand-minute"></span>
      <span class="face-center"></span>
      <span class="face-mark"></span>
    </span>
    <span class="grand-pendulum">
      <span class="pend-rod"></span>
      <span class="pend-bob"></span>
    </span>
  </div>
  <footer class="grand-foot">
    <span class="grand-strike">STRIKES 3</span>
    <span class="grand-wind">WOUND</span>
  </footer>
</main>
</body>
</html>
