<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-speedometer-gauge-needle demo</title>
</head>
<body>
<div class="sp-app">
  <span class="sp-brand">VELOCITY GT</span>
  <div class="sp-gauge">
    <span class="sp-tick sp-tick-a"></span>
    <span class="sp-tick sp-tick-b"></span>
    <span class="sp-tick sp-tick-c"></span>
    <span class="sp-tick sp-tick-d"></span>
    <span class="sp-tick sp-tick-e"></span>
    <span class="sp-tick sp-tick-f"></span>
    <span class="sp-tick sp-tick-g"></span>
    <span class="sp-num sp-num-a">0</span>
    <span class="sp-num sp-num-b">20</span>
    <span class="sp-num sp-num-c">40</span>
    <span class="sp-num sp-num-d">60</span>
    <span class="sp-num sp-num-e">80</span>
    <span class="sp-num sp-num-f">100</span>
    <span class="sp-num sp-num-g">120</span>
    <div class="sp-needle"><span class="sp-hand"></span></div>
    <span class="sp-hub"></span>
  </div>
  <span class="sp-readout">64</span>
  <span class="sp-unit">MPH</span>
  <span class="sp-caption">CURRENT SPEED</span>
</div>
</body>
</html>
