<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fault Tolerant Teleportation Gates FNTG - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css"></head><body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030712; color: #ffffff;">

    <div class="ease-card ease-card-glass fntg-container">
        <div class="fntg-header">
            <h2>Teleportation Gates</h2>
            <span class="ease-badge ease-badge-secondary">Fault-Tolerant Quantum</span>
        </div>
        
        <div class="fntg-screen ease-center">
            <div class="fntg-flux flux-fntg-a"></div>
            <div class="fntg-flux flux-fntg-b"></div>
            <div class="fntg-boundary-ring"></div>
            <div class="fntg-core ease-center"></div>
        </div>

        <div class="fntg-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Gate Teleportation &amp; Non-Local Clifford Injection</span>
            <button class="ease-btn ease-btn-secondary ease-btn-sm ease-hover-grow">Run Teleportation Gates</button>
        </div>
    </div></body></html>
