<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bounce-In Entrance Utilities</title>
<link rel="stylesheet" href="style.css">
<style>
  body {
    font-family: sans-serif;
    background: #111;
    color: #fff;
    display: flex;
    flex-wrap: wrap;
    gap: 24px;
    padding: 40px;
  }
  .box {
    width: 120px;
    height: 120px;
    background: #4f46e5;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    text-align: center;
  }
</style>
</head>
<body>
  <div class="box bounce-in-top">bounce-in-top</div>
  <div class="box bounce-in-bottom">bounce-in-bottom</div>
  <div class="box bounce-in-left">bounce-in-left</div>
  <div class="box bounce-in-right">bounce-in-right</div>
</body>
</html>
