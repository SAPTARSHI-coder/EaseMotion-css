<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aeolipile Steam Spin — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Aeolipile Steam Spin demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Aeolipile Steam Spin</h1>
      <p class="lede">Aeolipile Hero steam reaction spin</p>
    </header>

    <section class="ease-aeolipile-steam-spin" data-demo="aeolipile-steam-spin" aria-live="polite">
      <div class="ease-aeolipile-steam-spin__housing">
        <div class="ease-aeolipile-steam-spin__bezel">
          <div class="ease-aeolipile-steam-spin__face">
            <div class="ease-aeolipile-steam-spin__readout">
              <span class="ease-aeolipile-steam-spin__label">Aeolipile Steam Spin</span>
              <span class="ease-aeolipile-steam-spin__value">LIVE</span>
            </div>
            <div class="ease-aeolipile-steam-spin__motion" aria-hidden="true">
              <span class="ease-aeolipile-steam-spin__a"></span>
              <span class="ease-aeolipile-steam-spin__b"></span>
              <span class="ease-aeolipile-steam-spin__c"></span>
              <span class="ease-aeolipile-steam-spin__d"></span>
            </div>
            <div class="ease-aeolipile-steam-spin__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-aeolipile-steam-spin__controls">
          <button type="button" class="ease-aeolipile-steam-spin__btn primary">Engage</button>
          <button type="button" class="ease-aeolipile-steam-spin__btn">Reset</button>
          <label class="ease-aeolipile-steam-spin__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-aeolipile-steam-spin__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
