<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Portfolio Growth Chart</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="portfolio-card">
    <header class="chart-header">
      <div>
        <p class="eyebrow">Investment Portfolio</p>
        <h1 id="portfolio-title">$24,860.00</h1>
        <p class="growth">+$8,420.00 <span>+51.2%</span></p>
      </div>
      <div class="period">6 Months</div>
    </header>

    <section
      class="chart-wrapper"
      aria-labelledby="portfolio-title"
      aria-describedby="chart-description"
    >
      <p id="chart-description" class="sr-only">
        Portfolio value increases steadily from January through June.
      </p>

      <svg
        class="growth-chart"
        viewBox="0 0 800 400"
        role="img"
        aria-label="Portfolio growth line chart"
      >
        <defs>
          <linearGradient id="areaFill" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" />
            <stop offset="100%" />
          </linearGradient>

          <clipPath id="chartClip">
            <rect x="0" y="0" width="800" height="400" />
          </clipPath>
        </defs>

        <g class="grid-lines" aria-hidden="true">
          <line x1="60" y1="70" x2="760" y2="70" />
          <line x1="60" y1="140" x2="760" y2="140" />
          <line x1="60" y1="210" x2="760" y2="210" />
          <line x1="60" y1="280" x2="760" y2="280" />
          <line x1="60" y1="350" x2="760" y2="350" />
        </g>

        <path
          class="area"
          d="M60 315
             L200 280
             L340 245
             L480 205
             L620 145
             L760 85
             L760 350
             L60 350 Z"
          clip-path="url(#chartClip)"
        />

        <path
          class="growth-line"
          d="M60 315
             L200 280
             L340 245
             L480 205
             L620 145
             L760 85"
        />

        <g class="points" aria-hidden="true">
          <circle cx="60" cy="315" r="6" />
          <circle cx="200" cy="280" r="6" />
          <circle cx="340" cy="245" r="6" />
          <circle cx="480" cy="205" r="6" />
          <circle cx="620" cy="145" r="6" />
          <circle cx="760" cy="85" r="6" />
        </g>

        <g class="labels" aria-hidden="true">
          <text x="60" y="380">Jan</text>
          <text x="200" y="380">Feb</text>
          <text x="340" y="380">Mar</text>
          <text x="480" y="380">Apr</text>
          <text x="620" y="380">May</text>
          <text x="760" y="380">Jun</text>
        </g>
      </svg>
    </section>
  </main>
</body>
</html>
