<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Slide-Up Modal - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="cp-layout">
        <main class="cp-main">
            <h1 class="cp-title">SYSTEM_CORE</h1>
            <p class="cp-desc">Initialize terminal uplink to access classified data.</p>
            
            <input type="checkbox" id="cp-modal-toggle" class="cp-hidden-toggle">
            <label for="cp-modal-toggle" class="cp-btn cp-trigger" tabindex="0">
                ESTABLISH LINK
            </label>

            <div class="cp-modal-wrapper">
                <label for="cp-modal-toggle" class="cp-overlay" tabindex="-1"></label>
                
                <div class="cp-modal">
                    <div class="cp-modal-header">
                        <h2>DATA_UPLINK_ESTABLISHED</h2>
                        <label for="cp-modal-toggle" class="cp-close-btn" tabindex="0">X</label>
                    </div>
                    
                    <div class="cp-modal-body">
                        <p class="cp-neon-text">WARNING: Unauthorized access detected.</p>
                        <div class="cp-scanline"></div>
                        <p>Extracting encrypted files from Sector 4. Proceeding will trace your origin node. Do not disconnect during the transfer protocol.</p>
                    </div>
                    
                    <div class="cp-modal-footer">
                        <label for="cp-modal-toggle" class="cp-btn cp-btn-outline" tabindex="0">DISCONNECT</label>
                        <button class="cp-btn cp-btn-solid">DECRYPT FILES</button>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
