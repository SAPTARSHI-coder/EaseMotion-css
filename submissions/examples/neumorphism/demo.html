<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neumorphic UI Utilities Demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body, html {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      /* Background must match the base neu bg color for the illusion to work */
      background: var(--ease-neu-bg, #e0e5ec);
      color: #4a5568;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .container {
      display: flex;
      flex-wrap: wrap;
      gap: 3rem;
      justify-content: center;
      max-width: 800px;
      padding: 2rem;
    }

    .demo-box {
      width: 150px;
      height: 150px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      text-align: center;
      font-size: 1.1rem;
    }

    button.demo-box {
      cursor: pointer;
      color: inherit;
      font-size: 1rem;
      font-weight: 600;
    }
    
    h1 {
      margin-bottom: 2rem;
      font-weight: 300;
    }
  </style>
</head>
<body>

  <h1>Neumorphic Components</h1>

  <div class="container">
    <!-- Static Extruded Element -->
    <div class="demo-box ease-neu-extruded">
      Extruded Box
    </div>

    <!-- Static Pressed Element -->
    <div class="demo-box ease-neu-pressed">
      Pressed Box
    </div>

    <!-- Interactive Extruded Button -->
    <button class="demo-box ease-neu-extruded">
      Click Me!
    </button>
  </div>

</body>
</html>
