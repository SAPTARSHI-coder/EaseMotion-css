<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-hydration-tracker-water demo</title>
</head>
<body>
<div class="htw-card">
  <div class="htw-glass">
    <span class="htw-cap"></span>
    <div class="htw-body"><em class="htw-wave"></em><b class="htw-level">1.8L</b></div>
  </div>
  <div class="htw-meta">
    <b class="htw-cups">6</b>
    <span class="htw-caption">of 8 cups</span>
  </div>
  <div class="htw-goal"><em class="htw-fill"></em></div>
  <button class="htw-add">ADD CUP</button>
</div>
</body>
</html>
