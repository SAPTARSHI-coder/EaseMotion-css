<!-- EaseMotion component: wind-turbine -->
<!DOCTYPE html>
<html lang="en" data-wind="turb">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.5">
<title>Ease Wind Turbine</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="wind-farm">
  <header class="wind-head">
    <span class="wind-zone">RIDGE 4</span>
    <span class="wind-speed">14 KTS</span>
  </header>
  <div class="wind-stage">
    <span class="wind-pole">
      <span class="turbine-nacelle">
        <span class="turbine-rotor">
          <span class="blade blade-a"></span>
          <span class="blade blade-b"></span>
          <span class="blade blade-c"></span>
        </span>
      </span>
    </span>
    <span class="wind-meter">
      <span class="meter-label">POWER</span>
      <span class="meter-track"><span class="meter-fill"></span></span>
      <span class="meter-pct">74%</span>
    </span>
  </div>
  <footer class="wind-foot">
    <span class="wind-rpm">RPM 22</span>
    <span class="wind-output">2.4 MW</span>
  </footer>
</main>
</body>
</html>
