<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mood Sentiment Emoji Slider</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      margin: 0; min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 1rem; padding: 24px;
      background: linear-gradient(160deg, #f8fafc, #eef2ff 55%, #f8fafc);
      color: #111827; font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    }
    h1 { margin: 0; font-size: 1.25rem; text-align: center; }
    .note { margin: 0; max-width: 420px; text-align: center; color: #4b5563; font-size: 0.92rem; line-height: 1.45; }
  </style>
</head>
<body>
  <h1>Mood Sentiment Emoji Slider</h1>
  
  <label class="mood" id="mood"><span class="mood__face" id="face" aria-hidden="true">😐</span>
<input type="range" min="0" max="100" value="50" aria-label="Mood"/></label>
  <script>
var root=document.getElementById('mood'),face=document.getElementById('face'),input=root.querySelector('input');
var faces=['😠','😕','😐','🙂','😄'];
function sync(){var v=+input.value;root.style.setProperty('--mood',v);face.textContent=faces[Math.min(4,Math.floor(v/25))];}
input.addEventListener('input',sync);sync();
</script>
</body>
</html>
