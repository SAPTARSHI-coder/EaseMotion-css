<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ease-emoji-picker-sap demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f4f4f5;
    }
  </style>
</head>
<body>

  <div class="emoji-picker-sap" id="picker">
    <button class="emoji-trigger" id="trigger" aria-label="Open emoji picker">🙂</button>
    <div class="emoji-panel" id="panel">
      <button class="emoji-btn">😀</button>
      <button class="emoji-btn">😂</button>
      <button class="emoji-btn">😍</button>
      <button class="emoji-btn">🔥</button>
      <button class="emoji-btn">🎉</button>
      <button class="emoji-btn">👍</button>
      <button class="emoji-btn">😎</button>
      <button class="emoji-btn">🤔</button>
      <button class="emoji-btn">😢</button>
      <button class="emoji-btn">🙌</button>
      <button class="emoji-btn">❤️</button>
      <button class="emoji-btn">✨</button>
    </div>
  </div>

  <script>
    const picker = document.getElementById('picker');
    const trigger = document.getElementById('trigger');
    const panel = document.getElementById('panel');

    trigger.addEventListener('click', () => {
      panel.classList.toggle('open');
    });

    panel.querySelectorAll('.emoji-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        trigger.textContent = btn.textContent;
        panel.classList.remove('open');
      });
    });

    document.addEventListener('click', (e) => {
      if (!picker.contains(e.target)) {
        panel.classList.remove('open');
      }
    });
  </script>

</body>
</html>
