<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animated Checkbox Collection</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>Animated Checkboxes</h1>

    <label class="checkbox-item">
      <input type="checkbox">
      <span class="checkmark"></span>
      <span>Default Checkbox</span>
    </label>

    <label class="checkbox-item">
      <input type="checkbox" checked>
      <span class="checkmark"></span>
      <span>Checked Checkbox</span>
    </label>

    <label class="checkbox-item">
      <input type="checkbox">
      <span class="checkmark circle"></span>
      <span>Circle Checkbox</span>
    </label>

    <label class="checkbox-item">
      <input type="checkbox">
      <span class="checkmark fill"></span>
      <span>Fill Checkbox</span>
    </label>
  </div>

</body>
</html>
