<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EaseMotion — Skeleton Loading</title>
  <link rel="stylesheet" href="../../core/variables.css">
  <link rel="stylesheet" href="../../components/skeleton.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="demo-container">
    <h1>Skeleton Loading States</h1>
    <p>Placeholder shapes that animate while content loads.</p>

    <div class="skeleton-card">
      <div class="ease-skeleton ease-skeleton-circle" style="width:48px;height:48px"></div>
      <div class="skeleton-lines">
        <div class="ease-skeleton ease-skeleton-text" style="width:60%"></div>
        <div class="ease-skeleton ease-skeleton-text" style="width:80%"></div>
        <div class="ease-skeleton ease-skeleton-text" style="width:45%"></div>
      </div>
    </div>

    <div class="skeleton-card">
      <div class="ease-skeleton ease-skeleton-rect" style="width:100%;height:160px;border-radius:8px"></div>
      <div class="skeleton-lines">
        <div class="ease-skeleton ease-skeleton-text" style="width:70%"></div>
        <div class="ease-skeleton ease-skeleton-text" style="width:50%"></div>
      </div>
    </div>

    <div class="skeleton-card">
      <div class="skeleton-grid">
        <div class="ease-skeleton ease-skeleton-rect" style="height:80px"></div>
        <div class="ease-skeleton ease-skeleton-rect" style="height:80px"></div>
        <div class="ease-skeleton ease-skeleton-rect" style="height:80px"></div>
      </div>
    </div>
  </div>
</body>
</html>
