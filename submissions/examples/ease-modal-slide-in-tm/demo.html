<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Modal Slide In | EaseMotion CSS</title><link rel="stylesheet" href="style.css"></head>
<body><div class="mm-root">
<button class="mm-btn-demo" type="button" onclick="document.getElementById('mm1').classList.add('open')">Open Modal</button>
</div>
<div class="mm-overlay" id="mm1" onclick="if(event.target===this)this.classList.remove('open')">
<div class="mm-card">
<div class="mm-header"><h2 class="mm-title">Confirm Action</h2><button class="mm-close" type="button" onclick="this.closest('.mm-overlay').classList.remove('open')">&times;</button></div>
<p class="mm-body">Are you sure you want to proceed? This action cannot be undone and will affect all users in your organization.</p>
<div class="mm-actions">
<button class="mm-btn mm-btn-ghost" type="button" onclick="this.closest('.mm-overlay').classList.remove('open')">Cancel</button>
<button class="mm-btn mm-btn-primary" type="button" onclick="this.closest('.mm-overlay').classList.remove('open')">Confirm</button>
</div>
</div>
</div>
</body></html>
