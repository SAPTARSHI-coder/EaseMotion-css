<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D-Flip Drawer Showcase</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="em-container">
        <!-- Main Content Area -->
        <main class="em-content" id="mainContent">
            <header class="em-header">
                <button class="em-menu-btn" onclick="toggleDrawer()" aria-label="Toggle Menu">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="3" y1="12" x2="21" y2="12"></line>
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <line x1="3" y1="18" x2="21" y2="18"></line>
                    </svg>
                </button>
                <div class="em-logo">SaaS Metrics</div>
                <div class="em-avatar"></div>
            </header>
            
            <div class="em-dashboard">
                <h1>Overview</h1>
                <p>Welcome back! Here's your performance for the last 30 days.</p>
                <div class="em-grid">
                    <div class="em-card">
                        <h3>Total Revenue</h3>
                        <p class="em-stat">$12,450</p>
                    </div>
                    <div class="em-card">
                        <h3>Active Users</h3>
                        <p class="em-stat">3,210</p>
                    </div>
                    <div class="em-card">
                        <h3>New Signups</h3>
                        <p class="em-stat">450</p>
                    </div>
                </div>
                
                <div class="em-chart-placeholder">
                    <span>Chart Area</span>
                </div>
            </div>
        </main>

        <!-- 3D-Flip Drawer -->
        <aside class="em-drawer" id="drawer">
            <div class="em-drawer-header">
                <h2>Navigation</h2>
                <button class="em-close-btn" onclick="toggleDrawer()" aria-label="Close Menu">×</button>
            </div>
            <nav class="em-nav">
                <a href="#" class="em-nav-item active">Dashboard</a>
                <a href="#" class="em-nav-item">Analytics</a>
                <a href="#" class="em-nav-item">Team</a>
                <a href="#" class="em-nav-item">Integrations</a>
                <a href="#" class="em-nav-item">Settings</a>
            </nav>
            <div class="em-drawer-footer">
                <a href="#" class="em-nav-item">Log Out</a>
            </div>
        </aside>
    </div>

    <script>
        function toggleDrawer() {
            document.getElementById('drawer').classList.toggle('active');
            document.getElementById('mainContent').classList.toggle('drawer-open');
        }
    </script>
</body>
</html>
