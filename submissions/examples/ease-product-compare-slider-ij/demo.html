<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>ease-product-compare-slider</title><link rel="stylesheet" href="style.css"></head>
<body><div class="container"><h1>product compare slider</h1><p class="subtitle">Click to toggle the animation</p><div class="demo-box"><div class="anim-target" id="target"></div></div><button class="trigger" id="trigger">Toggle Animation</button><p class="status" id="status">Ready</p></div>
<script>var t=document.getElementById('target');var b=document.getElementById('trigger');var s=document.getElementById('status');var a=false;b.addEventListener('click',function(){a=!a;t.classList.toggle('active',a);t.style.setProperty('--state',a?'1':'0');s.textContent=a?'Animating':'Ready';});</script>
</body></html>
