<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      Custom Datepicker Calendar with Gradient Glow Styling
      (ease-datepicker-glow)
    </title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="demo-container">
      <header class="demo-header">
        <div class="header-badge">DATEPICKER CALENDAR UTILITY</div>
        <h1 class="demo-title">GRADIENT GLOW DATEPICKER</h1>
        <p class="demo-subtitle">
          Pure HTML + Vanilla CSS Calendar Component with Ambient Gradient Glow
          Styling
        </p>
      </header>

      <!-- Main Datepicker Calendar Showcase Card -->
      <section class="datepicker-showcase-card">
        <div class="ease-datepicker-glow">
          <!-- Ambient Gradient Glow Aura Backdrop -->
          <div class="datepicker-glow-halo" aria-hidden="true"></div>

          <!-- Inner Datepicker Card Surface -->
          <div class="datepicker-card-surface">
            <!-- Calendar Month Header & Navigation -->
            <header class="datepicker-header">
              <div class="month-title-group">
                <h2 class="month-heading" id="calendar-month-label">
                  August 2026
                </h2>
              </div>
              <div
                class="month-nav-group"
                role="toolbar"
                aria-label="Calendar Month Navigation"
              >
                <button
                  type="button"
                  class="month-nav-btn prev-month-btn"
                  aria-label="Previous Month"
                >
                  <svg
                    viewBox="0 0 24 24"
                    width="18"
                    height="18"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2.5"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                  >
                    <polyline points="15 18 9 12 15 6" />
                  </svg>
                </button>
                <button
                  type="button"
                  class="month-nav-btn next-month-btn"
                  aria-label="Next Month"
                >
                  <svg
                    viewBox="0 0 24 24"
                    width="18"
                    height="18"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2.5"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                  >
                    <polyline points="9 18 15 12 9 6" />
                  </svg>
                </button>
              </div>
            </header>

            <!-- Weekday Row Headers -->
            <div class="weekday-grid" aria-hidden="true">
              <span class="weekday-cell">Su</span>
              <span class="weekday-cell">Mo</span>
              <span class="weekday-cell">Tu</span>
              <span class="weekday-cell">We</span>
              <span class="weekday-cell">Th</span>
              <span class="weekday-cell">Fr</span>
              <span class="weekday-cell">Sa</span>
            </div>

            <!-- 7-Column Date Grid -->
            <div
              class="date-grid"
              role="grid"
              aria-labelledby="calendar-month-label"
            >
              <!-- Row 1 (July adjacent dates & August start) -->
              <button
                type="button"
                class="date-cell is-adjacent"
                aria-label="July 26, 2026"
              >
                26
              </button>
              <button
                type="button"
                class="date-cell is-adjacent"
                aria-label="July 27, 2026"
              >
                27
              </button>
              <button
                type="button"
                class="date-cell is-adjacent"
                aria-label="July 28, 2026"
              >
                28
              </button>
              <button
                type="button"
                class="date-cell is-adjacent"
                aria-label="July 29, 2026"
              >
                29
              </button>
              <button
                type="button"
                class="date-cell is-adjacent"
                aria-label="July 30, 2026"
              >
                30
              </button>
              <button
                type="button"
                class="date-cell is-adjacent"
                aria-label="July 31, 2026"
              >
                31
              </button>
              <button
                type="button"
                class="date-cell"
                aria-label="August 1, 2026"
              >
                1
              </button>

              <!-- Row 2 -->
              <button
                type="button"
                class="date-cell"
                aria-label="August 2, 2026"
              >
                2
              </button>
              <button
                type="button"
                class="date-cell"
                aria-label="August 3, 2026"
              >
                3
              </button>
              <button
                type="button"
                class="date-cell"
                aria-label="August 4, 2026"
              >
                4
              </button>
              <button
                type="button"
                class="date-cell"
                aria-label="August 5, 2026"
              >
                5
              </button>
              <button
                type="button"
                class="date-cell"
                aria-label="August 6, 2026"
              >
                6
              </button>
              <button
                type="button"
                class="date-cell"
                aria-label="August 7, 2026"
              >
                7
              </button>
              <button
                type="button"
                class="date-cell"
                aria-label="August 8, 2026"
              >
                8
              </button>

              <!-- Row 3 -->
              <button
                type="button"
                class="date-cell"
                aria-label="August 9, 2026"
              >
                9
              </button>
              <button
                type="button"
                class="date-cell"
                aria-label="August 10, 2026"
              >
                10
              </button>
              <button
                type="button"
                class="date-cell"
                aria-label="August 11, 2026"
              >
                11
              </button>
              <button
                type="button"
                class="date-cell"
                aria-label="August 12, 2026"
              >
                12
              </button>
              <button
                type="button"
                class="date-cell"
                aria-label="August 13, 2026"
              >
                13
              </button>
              <button
                type="button"
                class="date-cell is-today"
                aria-label="August 14, 2026, Today"
              >
                14
              </button>
              <button
                type="button"
                class="date-cell"
                aria-label="August 15, 2026"
              >
                15
              </button>

              <!-- Row 4 -->
              <button
                type="button"
                class="date-cell"
                aria-label="August 16, 2026"
              >
                16
              </button>
              <button
                type="button"
                class="date-cell"
                aria-label="August 17, 2026"
              >
                17
              </button>
              <button
                type="button"
                class="date-cell is-selected"
                aria-label="August 18, 2026, Selected"
              >
                18
              </button>
              <button
                type="button"
                class="date-cell"
                aria-label="August 19, 2026"
              >
                19
              </button>
              <button
                type="button"
                class="date-cell"
                aria-label="August 20, 2026"
              >
                20
              </button>
              <button
                type="button"
                class="date-cell"
                aria-label="August 21, 2026"
              >
                21
              </button>
              <button
                type="button"
                class="date-cell"
                aria-label="August 22, 2026"
              >
                22
              </button>

              <!-- Row 5 -->
              <button
                type="button"
                class="date-cell"
                aria-label="August 23, 2026"
              >
                23
              </button>
              <button
                type="button"
                class="date-cell"
                aria-label="August 24, 2026"
              >
                24
              </button>
              <button
                type="button"
                class="date-cell"
                aria-label="August 25, 2026"
              >
                25
              </button>
              <button
                type="button"
                class="date-cell"
                aria-label="August 26, 2026"
              >
                26
              </button>
              <button
                type="button"
                class="date-cell is-disabled"
                aria-label="August 27, 2026, Unavailable"
                disabled
              >
                27
              </button>
              <button
                type="button"
                class="date-cell is-disabled"
                aria-label="August 28, 2026, Unavailable"
                disabled
              >
                28
              </button>
              <button
                type="button"
                class="date-cell"
                aria-label="August 29, 2026"
              >
                29
              </button>

              <!-- Row 6 (August end & September adjacent dates) -->
              <button
                type="button"
                class="date-cell"
                aria-label="August 30, 2026"
              >
                30
              </button>
              <button
                type="button"
                class="date-cell"
                aria-label="August 31, 2026"
              >
                31
              </button>
              <button
                type="button"
                class="date-cell is-adjacent"
                aria-label="September 1, 2026"
              >
                1
              </button>
              <button
                type="button"
                class="date-cell is-adjacent"
                aria-label="September 2, 2026"
              >
                2
              </button>
              <button
                type="button"
                class="date-cell is-adjacent"
                aria-label="September 3, 2026"
              >
                3
              </button>
              <button
                type="button"
                class="date-cell is-adjacent"
                aria-label="September 4, 2026"
              >
                4
              </button>
              <button
                type="button"
                class="date-cell is-adjacent"
                aria-label="September 5, 2026"
              >
                5
              </button>
            </div>
          </div>
        </div>
      </section>

      <!-- Demo Keyboard Instructions Footer -->
      <footer class="demo-footer">
        <div class="keyboard-instruction">
          <span class="type-key">TAB</span> Focus date cells &bull;
          <span class="type-key">GRADIENT GLOW</span> Pink/Purple aura &bull;
          <span class="type-key">REDUCED MOTION</span> Static glow backdrop
        </div>
      </footer>
    </main>
  </body>
</html>
