<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cybernetic Tachyon Particle Collider - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #040208; color: #ffffff;">

    <div class="ease-card ease-card-glass collider-container">
        <div class="collider-header">
            <h2>Tachyon Collider</h2>
            <span class="ease-badge ease-badge-danger">Sub-Light</span>
        </div>
        
        <div class="collider-screen ease-center">
            <div class="acceleration-ring ring-1"></div>
            <div class="acceleration-ring ring-2"></div>
            <div class="magnetic-confinement-ring"></div>
            <div class="tachyon-core ease-center"></div>
        </div>

        <div class="collider-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Velocity: 0.99c</span>
            <button class="ease-btn ease-btn-primary ease-btn-sm ease-hover-grow">Accelerate</button>
        </div>
    </div>

</body>
</html>
