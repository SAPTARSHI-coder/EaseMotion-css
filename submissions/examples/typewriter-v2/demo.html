<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <meta
    name="description"
    content="Accessible pure CSS multi-line typewriter animation with delete and retype effects."
  >
  <title>CSS Typewriter v2</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="demo-shell">
    <section
      class="typewriter"
      aria-label="Animated introduction"
    >
      <p class="typewriter__eyebrow">
        PURE CSS MOTION
      </p>

      <h1 class="typewriter__title">
        <span class="sr-only">
          Build interfaces that feel alive.
        </span>

        <span
          class="typewriter__animation"
          aria-hidden="true"
        >
          <span class="typewriter__line typewriter__line--one">
            Build interfaces.
          </span>

          <span class="typewriter__line typewriter__line--two">
            Create better experiences.
          </span>

          <span class="typewriter__line typewriter__line--three">
            Make motion meaningful.
          </span>
        </span>
      </h1>

      <p class="typewriter__description">
        A lightweight multi-line typewriter effect built entirely
        with semantic HTML and vanilla CSS.
      </p>
    </section>
  </main>
</body>
</html>
