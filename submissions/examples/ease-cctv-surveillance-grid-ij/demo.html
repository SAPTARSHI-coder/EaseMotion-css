<!-- EaseMotion component: cctv-surveillance-grid -->
<!DOCTYPE html>
<html lang="en" data-cctv="grid">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.4">
<title>Ease CCTV Surveillance Grid</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="cctv-wall">
  <header class="cctv-head">
    <span class="cctv-title">CAMERA WALL</span>
    <span class="cctv-rec">REC</span>
  </header>
  <div class="cctv-grid">
    <div class="camera-feed feed-a">
      <span class="feed-scene">Lobby 2F</span>
      <span class="feed-scan"></span>
      <span class="feed-time">19:42:18</span>
    </div>
    <div class="camera-feed feed-b">
      <span class="feed-scene">Parking B1</span>
      <span class="feed-scan"></span>
      <span class="feed-time">19:42:18</span>
    </div>
    <div class="camera-feed feed-c">
      <span class="feed-scene">Gate West</span>
      <span class="feed-scan"></span>
      <span class="feed-time">19:42:18</span>
    </div>
    <div class="camera-feed feed-d">
      <span class="feed-scene">Roof East</span>
      <span class="feed-scan"></span>
      <span class="feed-time">19:42:18</span>
    </div>
  </div>
  <footer class="cctv-foot">
    <span class="cctv-cams">4 CHANNELS</span>
    <span class="cctv-status">RECORDING</span>
  </footer>
</main>
</body>
</html>
