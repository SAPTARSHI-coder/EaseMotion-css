<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interstellar Dyson Sphere Solar Collector - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #050502; color: #ffffff;">

    <div class="ease-card ease-card-glass dyson-container">
        <div class="dyson-header">
            <h2>Dyson Collector</h2>
            <span class="ease-badge ease-badge-warning">Harvesting</span>
        </div>
        
        <div class="dyson-screen ease-center">
            <div class="orbital-swarm swarm-1"></div>
            <div class="orbital-swarm swarm-2"></div>
            <div class="energy-collection-ring"></div>
            <div class="stellar-furnace-core ease-center"></div>
        </div>

        <div class="dyson-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Output: 3.8 × 10²⁶W</span>
            <button class="ease-btn ease-btn-primary ease-btn-sm ease-hover-grow">Optimize Array</button>
        </div>
    </div>

</body>
</html>
