<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Circuit Breaker Half Open</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="breaker-shell" aria-labelledby="breaker-title">
    <section class="breaker-board">
      <p class="eyebrow">Resilience recovery</p>
      <h1 id="breaker-title">Circuit Breaker Half Open</h1>
      <p class="summary">A guarded probe lane tests downstream health before allowing normal traffic back through the breaker.</p>
      <div class="breaker-stage" role="img" aria-label="Animated half open circuit breaker recovery flow">
        <div class="traffic-source"><span></span><span></span><span></span><span></span></div>
        <div class="breaker-gate"><b></b><i></i><em>half-open</em></div>
        <div class="probe-window"><span></span><span></span><span></span></div>
        <div class="service-core"><i></i><i></i><i></i><strong>ready</strong></div>
      </div>
      <div class="meter-row"><span>probe 3/5</span><span>error 0.8%</span><span>restore slow</span></div>
    </section>
  </main>
</body>
</html>
