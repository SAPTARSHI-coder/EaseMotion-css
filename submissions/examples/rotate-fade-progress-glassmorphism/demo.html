<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CSS rotate-fade progress bar for glassmorphism UI layouts">
  <title>Rotate-Fade Progress Bar — Glassmorphism</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="rfp-scene">
    <div class="rfp-card">
      <h2 class="rfp-card__title">Upload Progress</h2>
      <p class="rfp-card__sub">Your files are being uploaded to the cloud.</p>

      <div class="rfp-track">
        <div class="rfp-fill" style="--rfp-w: 72%"></div>
        <span class="rfp-label">72%</span>
      </div>

      <div class="rfp-details">
        <span class="rfp-details__item">12 of 16 files</span>
        <span class="rfp-details__item">~2 min left</span>
      </div>
    </div>

    <div class="rfp-card">
      <h2 class="rfp-card__title">Storage Used</h2>
      <p class="rfp-card__sub">You're almost at your plan limit.</p>

      <div class="rfp-track">
        <div class="rfp-fill rfp-fill--warn" style="--rfp-w: 89%"></div>
        <span class="rfp-label">89%</span>
      </div>

      <div class="rfp-details">
        <span class="rfp-details__item">44.5 GB of 50 GB</span>
        <span class="rfp-details__item">Upgrade plan</span>
      </div>
    </div>

    <div class="rfp-card">
      <h2 class="rfp-card__title">Build Status</h2>
      <p class="rfp-card__sub">Pipeline is running your tests.</p>

      <div class="rfp-track">
        <div class="rfp-fill rfp-fill--ok" style="--rfp-w: 100%"></div>
        <span class="rfp-label">Done</span>
      </div>

      <div class="rfp-details">
        <span class="rfp-details__item">All 24 tests passed</span>
        <span class="rfp-details__item">Deploy preview ready</span>
      </div>
    </div>
  </div>

</body>
</html>
