<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accessibility: High Contrast Mode forced-colors for Buttons - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="em-demo-container">
        <!-- Accessible High Contrast Buttons Component Showcase -->
        <header class="em-button-card" role="region" aria-label="High Contrast Buttons Accessibility Showcase" tabindex="0">
            <div class="em-button-header-bar">
                <span class="em-card-badge">ACCESSIBILITY (A11Y)</span>
                <span class="em-brand-logo">A11yMotion</span>
            </div>
            <h1 class="em-card-title">High Contrast Buttons</h1>
            <p class="em-card-desc">WCAG 2.1 AA compliant button components featuring Windows High Contrast / Forced Colors mode compatibility, full keyboard focus support, and screen reader announcements.</p>
            
            <!-- Live Region for Screen Reader Announcements -->
            <div id="button-live-region" class="em-sr-only" aria-live="polite" aria-atomic="true">
                High contrast button activated. State changed successfully.
            </div>

            <div class="em-button-wrapper">
                <button class="em-hc-button" aria-label="High Contrast Action Button">
                    <span class="em-btn-text">ACCESSIBLE ACTION</span>
                </button>
            </div>
        </header>
    </div>
</body>
</html>
