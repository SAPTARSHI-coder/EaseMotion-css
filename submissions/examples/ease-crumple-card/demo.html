<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crumple Card – Crumples Like Paper</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <h1>📄 Crumple Card</h1>
    <p class="subtitle">Crumples like paper with realistic physics</p>

    <div class="crumple-container">
      <div class="crumple-card" id="crumpleCard">
        <div class="card-face" id="cardFace">
          <div class="card-content">
            <div class="card-pattern">
              <div class="pattern-lines"></div>
              <div class="pattern-text">
                <span class="big-icon">📄</span>
                <span class="title-text">Crumple</span>
                <span class="sub-text">click to crumple</span>
              </div>
            </div>
          </div>
        </div>
        <div class="crumple-overlay" id="crumpleOverlay">
          <div class="crumple-folds" id="crumpleFolds"></div>
          <div class="crumple-shadows" id="crumpleShadows"></div>
        </div>
      </div>
      
      <!-- Info overlay -->
      <div class="info-overlay">
        <span class="crumple-status" id="crumpleStatus">📄 Smooth</span>
        <span class="crumple-level" id="crumpleLevel">0% crumpled</span>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <button class="ctrl-btn crumple" id="crumpleBtn">💥 Crumple</button>
      <button class="ctrl-btn smooth" id="smoothBtn">✨ Smooth</button>
      <button class="ctrl-btn toggle" id="toggleBtn">🔄 Toggle</button>
      <button class="ctrl-btn reset" id="resetBtn">↺ Reset</button>
    </div>

    <!-- Sliders -->
    <div class="slider-container">
      <span class="slider-label">Crumple Level</span>
      <input type="range" id="crumpleSlider" min="0" max="100" value="0" />
      <span class="slider-value" id="crumpleValue">0%</span>
    </div>

    <div class="slider-container">
      <span class="slider-label">Speed</span>
      <input type="range" id="speedSlider" min="1" max="10" value="5" />
      <span class="slider-value" id="speedValue">5×</span>
    </div>

    <!-- Status -->
    <div class="status" id="status">📄 Card is smooth — click Crumple to crumple it!</div>

    <!-- Keyboard shortcuts -->
    <div class="shortcuts">
      <kbd>C</kbd> Crumple · <kbd>S</kbd> Smooth · <kbd>T</kbd> Toggle · <kbd>R</kbd> Reset
    </div>
  </div>

  <script>
    (function() {
      "use strict";

      // DOM elements
      const crumpleCard = document.getElementById('crumpleCard');
      const cardFace = document.getElementById('cardFace');
      const crumpleOverlay = document.getElementById('crumpleOverlay');
      const crumpleFolds = document.getElementById('crumpleFolds');
      const crumpleShadows = document.getElementById('crumpleShadows');
      const crumpleStatus = document.getElementById('crumpleStatus');
      const crumpleLevel = document.getElementById('crumpleLevel');
      const crumpleBtn = document.getElementById('crumpleBtn');
      const smoothBtn = document.getElementById('smoothBtn');
      const toggleBtn = document.getElementById('toggleBtn');
      const resetBtn = document.getElementById('resetBtn');
      const status = document.getElementById('status');
      const crumpleSlider = document.getElementById('crumpleSlider');
      const crumpleValue = document.getElementById('crumpleValue');
      const speedSlider = document.getElementById('speedSlider');
      const speedValue = document.getElementById('speedValue');

      // State
      let crumpleAmount = 0; // 0-100
      let targetCrumple = 0;
      let isCrumpled = false;
      let animationId = null;
      let time = 0;

      // ----- Create fold elements -----
      function createFolds() {
        crumpleFolds.innerHTML = '';
        crumpleShadows.innerHTML = '';
        
        const numFolds = 30 + Math.floor(Math.random() * 20);
        for (let i = 0; i < numFolds; i++) {
          const fold = document.createElement('div');
          fold.className = 'fold';
          const x = Math.random() * 100;
          const y = Math.random() * 100;
          const w = 10 + Math.random() * 40;
          const h = 10 + Math.random() * 40;
          const angle = Math.random() * 360;
          const opacity = 0.1 + Math.random() * 0.3;
          
          fold.style.left = x + '%';
          fold.style.top = y + '%';
          fold.style.width = w + '%';
          fold.style.height = h + '%';
          fold.style.transform = `rotate(${angle}deg)`;
          fold.style.opacity = opacity;
          fold.style.background = `linear-gradient(${angle + 90}deg, 
            rgba(0,0,0,${0.1 + Math.random() * 0.2}), 
            rgba(255,255,255,${0.05 + Math.random() * 0.15}))`;
          fold.style.borderRadius = 2 + Math.random() * 8 + 'px';
          fold.style.boxShadow = `inset 0 0 ${5 + Math.random() * 15}px rgba(0,0,0,${0.05 + Math.random() * 0.1})`;
          crumpleFolds.appendChild(fold);
        }

        // Create shadow creases
        const numShadows = 15 + Math.floor(Math.random() * 15);
        for (let i = 0; i < numShadows; i++) {
          const shadow = document.createElement('div');
          shadow.className = 'shadow-crease';
          const x = Math.random() * 100;
          const y = Math.random() * 100;
          const w = 5 + Math.random() * 30;
          const h = 5 + Math.random() * 30;
          const angle = Math.random() * 360;
          
          shadow.style.left = x + '%';
          shadow.style.top = y + '%';
          shadow.style.width = w + '%';
          shadow.style.height = h + '%';
          shadow.style.transform = `rotate(${angle}deg)`;
          shadow.style.background = `linear-gradient(${angle}deg, 
            rgba(0,0,0,${0.05 + Math.random() * 0.15}), 
            transparent 50%, 
            rgba(255,255,255,${0.03 + Math.random() * 0.05}))`;
          shadow.style.borderRadius = 2 + Math.random() * 5 + 'px';
          shadow.style.opacity = 0.3 + Math.random() * 0.5;
          crumpleShadows.appendChild(shadow);
        }
      }

      // ----- Update crumple effect -----
      function updateCrumple() {
        const progress = crumpleAmount / 100;
        const speed = parseInt(speedSlider.value) / 5;

        // Apply crumple transformation to card
        const scaleX = 1 - progress * 0.15;
        const scaleY = 1 - progress * 0.12;
        const rotateZ = (progress * 3) * (Math.random() > 0.5 ? 1 : -1);
        const rotateX = progress * 2 * (Math.random() > 0.5 ? 1 : -1);
        const rotateY = progress * 2 * (Math.random() > 0.5 ? 1 : -1);
        const skewX = progress * 1.5 * (Math.random() > 0.5 ? 1 : -1);
        const skewY = progress * 1.5 * (Math.random() > 0.5 ? 1 : -1);
        
        cardFace.style.transform = `
          scale(${scaleX}, ${scaleY})
          rotate(${rotateZ}deg)
          rotateX(${rotateX}deg)
          rotateY(${rotateY}deg)
          skew(${skewX}deg, ${skewY}deg)
        `;

        // Apply distortion to folds
        const folds = crumpleFolds.querySelectorAll('.fold');
        const shadows = crumpleShadows.querySelectorAll('.shadow-crease');
        
        folds.forEach((fold, i) => {
          const baseOpacity = 0.05 + (i % 10) * 0.03;
          const opacity = baseOpacity + progress * 0.4;
          fold.style.opacity = Math.min(opacity, 0.5);
          fold.style.transform = `rotate(${parseFloat(fold.style.transform.replace('rotate(', '').replace('deg)', '')) + progress * 0.5}deg)`;
        });

        shadows.forEach((shadow, i) => {
          const baseOpacity = 0.2 + (i % 7) * 0.05;
          const opacity = baseOpacity + progress * 0.3;
          shadow.style.opacity = Math.min(opacity, 0.7);
        });

        // Update card rotation
        crumpleCard.style.transform = `
          perspective(800px)
          rotateX(${progress * 2}deg)
          rotateY(${progress * 3}deg)
        `;

        // Update status
        const statusText = progress === 0 ? '📄 Smooth' :
                          progress < 0.3 ? '📄 Slightly crumpled' :
                          progress < 0.6 ? '📄 Crumpling...' :
                          progress < 0.9 ? '📄 Very crumpled' : '💥 Fully crumpled!';
        crumpleStatus.textContent = statusText;
        crumpleLevel.textContent = Math.round(crumpleAmount) + '% crumpled';
        crumpleValue.textContent = Math.round(crumpleAmount) + '%';

        // Update crumple overlay visibility
        crumpleOverlay.style.opacity = progress * 0.8 + 0.1;
        crumpleOverlay.style.pointerEvents = 'none';

        // Toggle isCrumpled state
        isCrumpled = progress > 0.5;
      }

      // ----- Animation loop -----
      function animate() {
        time += 0.016;

        // Smoothly interpolate crumple amount
        const diff = targetCrumple - crumpleAmount;
        if (Math.abs(diff) > 0.1) {
          const speed = parseInt(speedSlider.value) / 5;
          crumpleAmount += diff * 0.06 * speed;
        } else {
          crumpleAmount = targetCrumple;
        }

        updateCrumple();
        animationId = requestAnimationFrame(animate);
      }

      // ----- Start animation -----
      function startAnimation() {
        if (animationId) {
          cancelAnimationFrame(animationId);
        }
        animate();
      }

      // ----- Set crumple level -----
      function setCrumple(value) {
        const clamped = Math.max(0, Math.min(100, value));
        targetCrumple = clamped;
        crumpleSlider.value = clamped;
        crumpleValue.textContent = Math.round(clamped) + '%';
        
        if (clamped === 0) {
          status.textContent = '📄 Card smoothed out!';
        } else if (clamped < 30) {
          status.textContent = '📄 Starting to crumple...';
        } else if (clamped < 60) {
          status.textContent = '📄 Crumpling more...';
        } else if (clamped < 90) {
          status.textContent = '📄 Almost fully crumpled!';
        } else {
          status.textContent = '💥 Card is fully crumpled!';
        }
      }

      // ----- Crumple -----
      function crumple() {
        const target = Math.min(100, targetCrumple + 25);
        setCrumple(target);
        status.textContent = '💥 Crumpling the card...';
        createFolds(); // Regenerate folds for variety
      }

      // ----- Smooth -----
      function smooth() {
        const target = Math.max(0, targetCrumple - 25);
        setCrumple(target);
        status.textContent = '✨ Smoothing the card...';
      }

      // ----- Toggle -----
      function toggleCrumple() {
        const target = targetCrumple < 50 ? 100 : 0;
        setCrumple(target);
        status.textContent = target === 0 ? '✨ Uncrumpling...' : '💥 Crumpling...';
        if (target === 100) {
          createFolds(); // Regenerate folds for variety
        }
      }

      // ----- Reset -----
      function resetCrumple() {
        setCrumple(0);
        status.textContent = '↺ Card reset to smooth';
        crumpleStatus.textContent = '📄 Smooth';
        crumpleLevel.textContent = '0% crumpled';
        // Reset card transform
        cardFace.style.transform = 'scale(1, 1) rotate(0deg) rotateX(0deg) rotateY(0deg) skew(0deg, 0deg)';
        crumpleCard.style.transform = 'perspective(800px) rotateX(0deg) rotateY(0deg)';
        crumpleOverlay.style.opacity = '0';
      }

      // ----- Event Listeners -----
      crumpleBtn.addEventListener('click', crumple);
      smoothBtn.addEventListener('click', smooth);
      toggleBtn.addEventListener('click', toggleCrumple);
      resetBtn.addEventListener('click', resetCrumple);

      crumpleSlider.addEventListener('input', (e) => {
        const val = parseFloat(e.target.value);
        setCrumple(val);
      });

      speedSlider.addEventListener('input', (e) => {
        speedValue.textContent = e.target.value + '×';
      });

      // Click on card to toggle
      crumpleCard.addEventListener('click', (e) => {
        // Don't trigger if clicking overlay elements
        if (e.target.closest('.crumple-overlay')) return;
        toggleCrumple();
      });

      // Double-click to reset
      crumpleCard.addEventListener('dblclick', resetCrumple);

      // Keyboard shortcuts
      document.addEventListener('keydown', (e) => {
        if (e.key === 'c' || e.key === 'C') {
          e.preventDefault();
          crumple();
        }
        if (e.key === 's' || e.key === 'S') {
          e.preventDefault();
          smooth();
        }
        if (e.key === 't' || e.key === 'T') {
          e.preventDefault();
          toggleCrumple();
        }
        if (e.key === 'r' || e.key === 'R') {
          e.preventDefault();
          resetCrumple();
        }
        if (e.key === ' ' || e.key === 'Space') {
          e.preventDefault();
          toggleCrumple();
        }
      });

      // ----- Resize handler -----
      let resizeTimeout;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(() => {
          // Regenerate folds on resize for fresh pattern
          if (crumpleAmount > 10) {
            createFolds();
          }
        }, 300);
      });

      // ----- Init -----
      function init() {
        createFolds();
        setCrumple(0);
        startAnimation();
        status.textContent = '📄 Card is smooth — click Crumple or the card to crumple it!';
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }

    })();
  </script>
</body>
</html>
