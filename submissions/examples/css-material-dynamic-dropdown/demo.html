<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Dropdown with Material Design Styling | EaseMotion CSS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dropdown-card" role="region" aria-label="Dropdown component container">
        <div class="dropdown-wrapper">
            <!-- Hidden Checkbox for Zero-JavaScript Toggle State -->
            <input type="checkbox" id="dropdownToggle" class="dropdown-checkbox">
            
            <label for="dropdownToggle" class="dropdown-trigger" role="button" aria-haspopup="true" aria-expanded="false">
                <span>Select Workspace Module</span>
                <span class="dropdown-arrow" aria-hidden="true">&#9662;</span>
            </label>

            <ul class="dropdown-menu" role="menu">
                <li class="dropdown-item" role="menuitem">Analytics Dashboard</li>
                <li class="dropdown-item" role="menuitem">Security & Access</li>
                <li class="dropdown-item" role="menuitem">Deployment Nodes</li>
                <li class="dropdown-item" role="menuitem">Workspace Settings</li>
            </ul>
        </div>
    </div>
</body>
</html>
