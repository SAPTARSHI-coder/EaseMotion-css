<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Contributors Wall</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="gcw-container">
    <div class="gcw-header">
      <h1>Contributors</h1>
      <p>12 amazing people have contributed to this project</p>
    </div>

    <div class="gcw-grid">
      <div class="gcw-card" tabindex="0">
        <div class="gcw-avatar">
          <img src="https://avatars.githubusercontent.com/u/1?s=48" alt="Contributor" loading="lazy">
          <span class="gcw-online"></span>
        </div>
        <span class="gcw-name">saptarshi</span>
      </div>
      <div class="gcw-card" tabindex="0">
        <div class="gcw-avatar" style="background:linear-gradient(135deg,#10b981,#34d399)">
          <img src="https://avatars.githubusercontent.com/u/2?s=48" alt="Contributor" loading="lazy">
        </div>
        <span class="gcw-name">alexdev</span>
      </div>
      <div class="gcw-card" tabindex="0">
        <div class="gcw-avatar" style="background:linear-gradient(135deg,#f59e0b,#fbbf24)">
          <img src="https://avatars.githubusercontent.com/u/3?s=48" alt="Contributor" loading="lazy">
        </div>
        <span class="gcw-name">jamie.design</span>
      </div>
      <div class="gcw-card" tabindex="0">
        <div class="gcw-avatar" style="background:linear-gradient(135deg,#ef4444,#f87171)">
          <img src="https://avatars.githubusercontent.com/u/4?s=48" alt="Contributor" loading="lazy">
        </div>
        <span class="gcw-name">priya.code</span>
      </div>
      <div class="gcw-card" tabindex="0">
        <div class="gcw-avatar" style="background:linear-gradient(135deg,#8b5cf6,#a78bfa)">
          <img src="https://avatars.githubusercontent.com/u/5?s=48" alt="Contributor" loading="lazy">
        </div>
        <span class="gcw-name">devmarco</span>
      </div>
      <div class="gcw-card" tabindex="0">
        <div class="gcw-avatar" style="background:linear-gradient(135deg,#0ea5e9,#38bdf8)">
          <img src="https://avatars.githubusercontent.com/u/6?s=48" alt="Contributor" loading="lazy">
        </div>
        <span class="gcw-name">taylor.ui</span>
      </div>
      <div class="gcw-card" tabindex="0">
        <div class="gcw-avatar" style="background:linear-gradient(135deg,#ec4899,#f472b6)">
          <img src="https://avatars.githubusercontent.com/u/7?s=48" alt="Contributor" loading="lazy">
        </div>
        <span class="gcw-name">mia.ops</span>
      </div>
      <div class="gcw-card" tabindex="0">
        <div class="gcw-avatar" style="background:linear-gradient(135deg,#14b8a6,#2dd4bf)">
          <img src="https://avatars.githubusercontent.com/u/8?s=48" alt="Contributor" loading="lazy">
        </div>
        <span class="gcw-name">chris.dev</span>
      </div>
    </div>
  </div>

</body>
</html>
