<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-airport-gate-board</title>
</head>
<body>
<main class="agb-card">
  <header class="agb-head">
    <h1 class="agb-title">DEPARTURES</h1>
    <span class="agb-clock">14:32</span>
  </header>
  <section class="agb-col-head" aria-label="column headings">
    <span class="agb-h agb-h-flight">FLT</span>
    <span class="agb-h">AIRLINE</span>
    <span class="agb-h">DEST</span>
    <span class="agb-h">GATE</span>
    <span class="agb-h">STATUS</span>
    <span class="agb-h">TIME</span>
  </section>
  <section class="agb-rows" aria-label="flight rows">
    <span class="agb-row">
      <span class="agb-c">BA 118</span>
      <span class="agb-c">British</span>
      <span class="agb-c">LHR</span>
      <span class="agb-c">B42</span>
      <span class="agb-c agb-st">Boarding</span>
      <span class="agb-c">13:50</span>
    </span>
    <span class="agb-row">
      <span class="agb-c">AF 220</span>
      <span class="agb-c">Air Fr</span>
      <span class="agb-c">CDG</span>
      <span class="agb-c">C11</span>
      <span class="agb-c agb-st agb-st-warn">Delayed</span>
      <span class="agb-c">14:05</span>
    </span>
    <span class="agb-row">
      <span class="agb-c">LH 305</span>
      <span class="agb-c">Lufth</span>
      <span class="agb-c">FRA</span>
      <span class="agb-c">A07</span>
      <span class="agb-c agb-st">On time</span>
      <span class="agb-c">14:20</span>
    </span>
    <span class="agb-row">
      <span class="agb-c">UA 992</span>
      <span class="agb-c">United</span>
      <span class="agb-c">ORD</span>
      <span class="agb-c">D05</span>
      <span class="agb-c agb-st agb-st-warn">Gate</span>
      <span class="agb-c">14:40</span>
    </span>
  </section>
  <footer class="agb-foot">
    <span class="agb-note">Check screens</span>
    <span class="agb-cnt">4 flights</span>
  </footer>
</main>
</body>
</html>
