<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Water Organ Hydraulis — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Water Organ Hydraulis demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Water Organ Hydraulis</h1>
      <p class="lede">Hydraulis water organ pipe sounding</p>
    </header>

    <section class="ease-water-organ-hydraulis" data-demo="water-organ-hydraulis" aria-live="polite">
      <div class="ease-water-organ-hydraulis__housing">
        <div class="ease-water-organ-hydraulis__bezel">
          <div class="ease-water-organ-hydraulis__face">
            <div class="ease-water-organ-hydraulis__readout">
              <span class="ease-water-organ-hydraulis__label">Water Organ Hydraulis</span>
              <span class="ease-water-organ-hydraulis__value">LIVE</span>
            </div>
            <div class="ease-water-organ-hydraulis__motion" aria-hidden="true">
              <span class="ease-water-organ-hydraulis__a"></span>
              <span class="ease-water-organ-hydraulis__b"></span>
              <span class="ease-water-organ-hydraulis__c"></span>
              <span class="ease-water-organ-hydraulis__d"></span>
            </div>
            <div class="ease-water-organ-hydraulis__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-water-organ-hydraulis__controls">
          <button type="button" class="ease-water-organ-hydraulis__btn primary">Engage</button>
          <button type="button" class="ease-water-organ-hydraulis__btn">Reset</button>
          <label class="ease-water-organ-hydraulis__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-water-organ-hydraulis__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
