<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Typing Text Effect</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="terminal">
        <div class="terminal-header">
            <span class="btn btn-close"></span>
            <span class="btn btn-minimize"></span>
            <span class="btn btn-expand"></span>
        </div>
        <div class="terminal-body">
            <!-- The length of this text is 31 characters. This is important for the steps() function in CSS. -->
            <p class="typing-text">Welcome to the pure CSS matrix.</p>
        </div>
    </div>
</body>
</html>
