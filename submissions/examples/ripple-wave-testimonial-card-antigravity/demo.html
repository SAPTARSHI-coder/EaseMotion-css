<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ripple Wave Testimonial Card</title>
  <link rel="stylesheet" href="../../../easemotion.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="ease-ripple-container">
    <div class="ease-ripple-wave"></div>
    <div class="testimonial-card">
      <div class="quote">❝</div>
      <p class="message">
        EaseMotion's CSS variables and keyframes made building this glassmorphism
        ripple effect incredibly straightforward and robust.
      </p>
      <div class="profile">
        <img src="https://via.placeholder.com/80" alt="User">
        <div>
          <h3>John Doe</h3>
          <span>Creative Developer</span>
        </div>
      </div>
      <div class="rating">★★★★★</div>
    </div>
  </div>
</body>
</html>
