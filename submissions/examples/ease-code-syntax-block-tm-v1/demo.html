<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Code Syntax Block | EaseMotion CSS</title><link rel="stylesheet" href="style.css"></head>
<body><div class="csb-root">
<div class="csb-block">
<div class="csb-head"><span class="csb-lang">javascript</span><div class="csb-dots"><span class="csb-dot"></span><span class="csb-dot"></span><span class="csb-dot"></span></div></div>
<div class="csb-code"><pre class="csb-pre"><span class="csb-kw">const</span> <span class="csb-fn">greet</span> = (<span class="csb-tag">name</span>) => {
  <span class="csb-kw">return</span> <span class="csb-str">`Hello, ${name}!`</span>;
};

<span class="csb-cmt">// Call the function</span>
<span class="csb-kw">const</span> message = <span class="csb-fn">greet</span>(<span class="csb-str">'World'</span>);
console.<span class="csb-fn">log</span>(message);</pre></div>
</div>
<div class="csb-block">
<div class="csb-head"><span class="csb-lang">html</span><div class="csb-dots"><span class="csb-dot"></span><span class="csb-dot"></span><span class="csb-dot"></span></div></div>
<div class="csb-code"><pre class="csb-pre"><span class="csb-tag">&lt;div</span> <span class="csb-attr">class</span>=<span class="csb-str">"card"</span><span class="csb-tag">&gt;</span>
  <span class="csb-tag">&lt;h2&gt;</span>Title<span class="csb-tag">&lt;/h2&gt;</span>
  <span class="csb-tag">&lt;p&gt;</span>Content here.<span class="csb-tag">&lt;/p&gt;</span>
<span class="csb-tag">&lt;/div&gt;</span></pre></div>
</div>
<p class="csb-sub">Pure CSS syntax-highlighted code blocks with a terminal-style header</p>
</div></body></html>
