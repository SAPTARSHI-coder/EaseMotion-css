<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="CSS Hyper Speed Warp Drive animation"
    >

    <title>CSS Hyper Speed Warp Drive</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="warp-demo">

        <section class="warp-interface" aria-label="Hyper speed warp drive">

            <div class="stars stars-one" aria-hidden="true"></div>
            <div class="stars stars-two" aria-hidden="true"></div>
            <div class="stars stars-three" aria-hidden="true"></div>

            <div class="warp-core" aria-hidden="true">
                <div class="core-glow"></div>
            </div>

            <div class="warp-content">
                <span class="status">
                    WARP DRIVE ONLINE
                </span>

                <h1>Hyper Speed</h1>

                <p>
                    Accelerating through the digital frontier.
                </p>

                <div class="speed-indicator">
                    <span class="speed-dot"></span>
                    <span>MAXIMUM VELOCITY</span>
                </div>
            </div>

        </section>

    </main>

</body>
</html>
