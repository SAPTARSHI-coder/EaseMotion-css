<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Sci-Fi HUD: Retro Arcade Pixel</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <main class="pixel-hud" role="region" aria-label="Arcade Status Dashboard">
    
    <header class="hud-header">
      <h2 class="hud-title">PLAYER_1</h2>
      <div class="hud-score">SC: 09420</div>
    </header>

    <div class="hud-content">
      
      <!-- Energy Bar -->
      <div class="pixel-bar-container">
        <span class="pixel-label">ENG</span>
        <div class="pixel-track" aria-label="Energy 80%" role="meter" aria-valuenow="80" aria-valuemin="0" aria-valuemax="100">
          <div class="pixel-block" aria-hidden="true"></div>
          <div class="pixel-block" aria-hidden="true"></div>
          <div class="pixel-block" aria-hidden="true"></div>
          <div class="pixel-block" aria-hidden="true"></div>
          <div class="pixel-block" aria-hidden="true"></div>
          <div class="pixel-block" aria-hidden="true"></div>
          <div class="pixel-block" aria-hidden="true"></div>
          <div class="pixel-block" aria-hidden="true"></div>
          <div class="pixel-block empty" aria-hidden="true"></div>
          <div class="pixel-block empty" aria-hidden="true"></div>
        </div>
      </div>

      <!-- Shield Bar -->
      <div class="pixel-bar-container">
        <span class="pixel-label">SHD</span>
        <div class="pixel-track" aria-label="Shield 20% Critical" role="meter" aria-valuenow="20" aria-valuemin="0" aria-valuemax="100">
          <div class="pixel-block danger" aria-hidden="true"></div>
          <div class="pixel-block danger" aria-hidden="true"></div>
          <div class="pixel-block empty" aria-hidden="true"></div>
          <div class="pixel-block empty" aria-hidden="true"></div>
          <div class="pixel-block empty" aria-hidden="true"></div>
          <div class="pixel-block empty" aria-hidden="true"></div>
          <div class="pixel-block empty" aria-hidden="true"></div>
          <div class="pixel-block empty" aria-hidden="true"></div>
          <div class="pixel-block empty" aria-hidden="true"></div>
          <div class="pixel-block empty" aria-hidden="true"></div>
        </div>
      </div>

      <!-- Terminal Output -->
      <div class="terminal-text" aria-live="polite">
        > SYSTEM BOOT SEQ...<br>
        > WEAPONS: ONLINE<br>
        > SHIELDS: CRITICAL<br>
        > AWAITING CMD
      </div>

    </div>

  </main>

</body>
</html>
