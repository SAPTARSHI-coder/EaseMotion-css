<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stacking Notification Toasts - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="toast-container">
    <div class="toast toast-success" style="--toast-index: 1;">
      <div class="toast-icon">✓</div>
      <div class="toast-content">
        <div class="toast-title">Success</div>
        <div class="toast-message">Your changes have been saved successfully.</div>
      </div>
      <div class="toast-close">&times;</div>
    </div>
    <div class="toast toast-error" style="--toast-index: 2;">
      <div class="toast-icon">!</div>
      <div class="toast-content">
        <div class="toast-title">Error</div>
        <div class="toast-message">Failed to connect to the server.</div>
      </div>
      <div class="toast-close">&times;</div>
    </div>
    <div class="toast toast-info" style="--toast-index: 3;">
      <div class="toast-icon">i</div>
      <div class="toast-content">
        <div class="toast-title">New Update</div>
        <div class="toast-message">EaseMotion CSS v1.2 is now available.</div>
      </div>
      <div class="toast-close">&times;</div>
    </div>
  </div>
</body>
</html>
