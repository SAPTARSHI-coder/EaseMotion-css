<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CSS Layered Overlay Stack</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<main class="wrapper">

<h1>Layered Overlay Stack</h1>

<div class="stack">

<div class="overlay overlay-one">
    <h2>Modal Layer 1</h2>
    <p>Background overlay</p>
</div>

<div class="overlay overlay-two">
    <h2>Modal Layer 2</h2>
    <p>Middle depth layer</p>
</div>

<div class="overlay overlay-three">
    <h2>Modal Layer 3</h2>
    <p>Active modal</p>
</div>

</div>

</main>

</body>
</html>
