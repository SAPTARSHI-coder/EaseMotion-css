<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Particle Burst Toggle #73881 Demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #030712;
      margin: 0;
    }
  </style>
</head>
<body>

  <label class="particle-toggle-wrapper">
    <input type="checkbox" class="particle-toggle-input">
    <span class="particle-toggle-track">
      <span class="particle-toggle-thumb">
        <span class="particle-toggle-burst"></span>
      </span>
    </span>
    <span class="particle-toggle-label">Particle Burst</span>
  </label>

</body>
</html>
