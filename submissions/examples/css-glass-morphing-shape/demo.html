<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Accessible CSS glassmorphism card with a smooth morphing shape animation."
  >

  <title>Glass Morphing Shape</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="page">
    <section
      class="glass-card"
      aria-labelledby="glass-title"
      tabindex="0"
    >

      <div class="glass-card__glow" aria-hidden="true"></div>

      <div class="glass-card__content">
        <span class="glass-card__badge">
          CSS UI
        </span>

        <h1 id="glass-title">
          Morphing Glass
        </h1>

        <p>
          A smooth glassmorphism component with an animated
          organic shape, subtle depth, and responsive design.
        </p>

        <a
          class="glass-card__button"
          href="#details"
          aria-label="Explore morphing glass component"
        >
          Explore
          <span aria-hidden="true">→</span>
        </a>
      </div>

      <div class="glass-card__shape" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
      </div>

    </section>

    <section id="details" class="details">
      <h2>Pure CSS Glass Effect</h2>
      <p>
        This component uses CSS backdrop filtering, gradients,
        transforms, pseudo-elements and keyframe animation.
      </p>
    </section>
  </main>

</body>
</html>
