<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Infinite Spin Ring | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <article class="demo-card">
      <header class="card-header">
        <h1 class="card-title">Quantum Core Sync</h1>
        <p class="card-subtitle">Multi-tier concentric ring status indicator</p>
      </header>

      <!-- Accessible Infinite Spin Ring Loader Container -->
      <div 
        class="spin-ring-stage" 
        role="progressbar" 
        aria-label="Quantum core synchronization in progress" 
        aria-busy="true"
      >
        <div class="spin-ring spin-ring-outer" aria-hidden="true"></div>
        <div class="spin-ring spin-ring-mid" aria-hidden="true"></div>
        <div class="spin-ring spin-ring-inner" aria-hidden="true"></div>
        <div class="spin-core" aria-hidden="true"></div>
      </div>

      <footer class="card-footer">
        <span class="status-badge">
          <span class="status-dot" aria-hidden="true"></span>
          Active State
        </span>
        <span>3 Orbital Speed Tiers</span>
      </footer>
    </article>
  </main>
</body>
</html>
