<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pure CSS Coffee Cup</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header class="header">
            <h1 class="title">Morning Brew</h1>
            <p>A steaming cup of coffee rendered entirely with CSS shapes and animations.</p>
        </header>

        <main class="content-area">
            
            <!-- Accessible wrapper for the visual element -->
            <div class="coffee-widget" role="img" aria-label="A steaming cup of hot coffee on a saucer">
                
                <!-- The animated steam rising from the cup -->
                <div class="steam-container">
                    <span class="steam s1"></span>
                    <span class="steam s2"></span>
                    <span class="steam s3"></span>
                    <span class="steam s4"></span>
                    <span class="steam s5"></span>
                </div>

                <!-- The main cup structure -->
                <div class="cup">
                    
                    <!-- The dark inside of the cup containing the liquid -->
                    <div class="cup-inner">
                        <div class="coffee-liquid">
                            <!-- Small reflection/foam on the coffee -->
                            <div class="coffee-foam"></div>
                        </div>
                    </div>
                    
                    <!-- The cup handle -->
                    <div class="cup-handle"></div>
                </div>

                <!-- The saucer underneath the cup -->
                <div class="saucer"></div>
                
                <!-- Shadow cast by the cup and saucer -->
                <div class="shadow"></div>
                
            </div>
            
        </main>
    </div>

</body>
</html>
