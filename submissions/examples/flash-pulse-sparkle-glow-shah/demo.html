<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flash Pulse Sparkle Glow</title>
  <link rel="stylesheet" href="./style.css">
  <style>
    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background-color: #0f172a;
      font-family: system-ui, -apple-system, sans-serif;
    }
    
    .demo-container {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 50px;
    }

    .demo-star {
      width: 60px;
      height: 60px;
      background: #fbbf24;
      clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
      display: flex;
      justify-content: center;
      align-items: center;
    }
  </style>
</head>
<body>

  <div class="demo-container">
    <!-- Using the utility class -->
    <div class="demo-star ease-anim-flash-pulse-sparkle-glow"></div>
  </div>

</body>
</html>
