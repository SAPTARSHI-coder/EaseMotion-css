<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.1">
<title>Arcade Claw Machine</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="claw-arcade">
  <header class="claw-head">
    <h1 class="claw-title">CLAW ZONE</h1>
    <p class="claw-credit">1 TOKEN</p>
  </header>
  <section class="claw-booth" aria-label="Claw crane machine">
    <div class="claw-arm">
      <span class="claw-hook hook-a"></span>
      <span class="claw-hook hook-b"></span>
      <span class="claw-magnet"></span>
    </div>
    <div class="prize-bin">
      <span class="prize prize-a">BEAR</span>
      <span class="prize prize-b">BUNNY</span>
      <span class="prize prize-c">PENGUIN</span>
    </div>
    <div class="glass-front"></div>
  </section>
  <section class="claw-console" aria-label="Claw controls">
    <span class="joystick"></span>
    <button class="claw-button" type="button">DROP</button>
  </section>
  <footer class="claw-foot">
    <span class="claw-score">TICKETS 120</span>
    <span class="claw-wins">WINS 3</span>
  </footer>
</main>
</body>
</html>
