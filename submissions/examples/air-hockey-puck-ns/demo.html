<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Air Hockey Puck — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Air Hockey Puck demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Air Hockey Puck</h1>
      <p class="lede">Air-hockey puck ricocheting across a glowing table</p>
    </header>

    <section class="ease-air-hockey-puck" data-demo="air-hockey-puck" aria-live="polite">
      <div class="ease-air-hockey-puck__housing">
        <div class="ease-air-hockey-puck__bezel">
          <div class="ease-air-hockey-puck__face">
            <div class="ease-air-hockey-puck__readout">
              <span class="ease-air-hockey-puck__label">Air Hockey Puck</span>
              <span class="ease-air-hockey-puck__value">LIVE</span>
            </div>
            <div class="ease-air-hockey-puck__motion" aria-hidden="true">
              <span class="ease-air-hockey-puck__a"></span>
              <span class="ease-air-hockey-puck__b"></span>
              <span class="ease-air-hockey-puck__c"></span>
              <span class="ease-air-hockey-puck__d"></span>
            </div>
            <div class="ease-air-hockey-puck__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-air-hockey-puck__controls">
          <button type="button" class="ease-air-hockey-puck__btn primary">Engage</button>
          <button type="button" class="ease-air-hockey-puck__btn">Reset</button>
          <label class="ease-air-hockey-puck__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-air-hockey-puck__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
