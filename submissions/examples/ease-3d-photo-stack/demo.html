<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ease Interactive 3D Perspective Photo Gallery Stack — EaseMotion CSS</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../easemotion.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="ease-stack-body">
  <div class="ease-stack-wrapper">
    <header class="ease-stack-header">
      <h2>3D Perspective Photo Stack</h2>
      <p>Hover or click the stack deck to fan out photos interactively into a gallery</p>
    </header>

    <div class="ease-stack-stage">
      <div class="ease-photo-deck" id="photoDeck">
        <div class="ease-photo-card card-1">
          <div class="photo-placeholder p1">🌊</div>
          <div class="photo-caption">Ocean Horizon</div>
        </div>
        <div class="ease-photo-card card-2">
          <div class="photo-placeholder p2">⛰️</div>
          <div class="photo-caption">Mountain Peak</div>
        </div>
        <div class="ease-photo-card card-3">
          <div class="photo-placeholder p3">🌌</div>
          <div class="photo-caption">Cosmic Nebula</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const deck = document.getElementById('photoDeck');

      deck.addEventListener('click', () => {
        deck.classList.toggle('expanded');
      });
    });
  </script>
</body>
</html>
