<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-stock-market-ticker demo</title>
</head>
<body>
<div class="smt-board">
  <div class="smt-tape">
    <span class="smt-quote"><b>NVDA</b><i class="smt-up">&#9650;</i><em>128.40</em></span>
    <span class="smt-quote"><b>AAPL</b><i class="smt-down">&#9660;</i><em>231.10</em></span>
    <span class="smt-quote"><b>TSLA</b><i class="smt-up">&#9650;</i><em>244.75</em></span>
    <span class="smt-quote"><b>MSFT</b><i class="smt-up">&#9650;</i><em>414.90</em></span>
    <span class="smt-quote"><b>AMZN</b><i class="smt-down">&#9660;</i><em>182.05</em></span>
  </div>
  <div class="smt-panel">
    <span class="smt-row"><b class="smt-tick">NVDA</b><em class="smt-val">128.40</em><i class="smt-change">+2.11%</i></span>
    <span class="smt-row"><b class="smt-tick">AAPL</b><em class="smt-val">231.10</em><i class="smt-change">-0.84%</i></span>
    <span class="smt-row"><b class="smt-tick">TSLA</b><em class="smt-val">244.75</em><i class="smt-change">+1.02%</i></span>
  </div>
</div>
</body>
</html>
