<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neumorphic Smart Home Thermostat Dial | EaseMotion CSS Showcase</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <main class="thermostat-wrapper">
    <header class="header">
      <span class="badge">GSSoC 2026 Innovation</span>
      <h1 class="title">Neumorphic Smart Thermostat</h1>
      <p class="subtitle">Soft UI neumorphic climate control widget with inset dual-drop shadows, glowing temperature arc ring, and tactile tactile buttons.</p>
    </header>

    <div class="thermostat-card">
      <div class="outer-dial">
        <div class="inner-dial">
          <div class="arc-ring"></div>
          <div class="temp-readout">
            <span class="mode-tag">HEATING</span>
            <div class="degree-val">72<span class="unit">°F</span></div>
            <span class="target-val">TARGET 75°F</span>
          </div>
        </div>
      </div>

      <div class="thermostat-controls">
        <button class="neu-btn btn-minus" aria-label="Decrease Temperature">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        </button>
        <div class="status-pill">LIVING ROOM</div>
        <button class="neu-btn btn-plus" aria-label="Increase Temperature">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        </button>
      </div>
    </div>
  </main>
</body>
</html>
