<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Award Ribbon Card</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">
    <article class="award-card">
      <div class="ribbon" aria-label="First place award">
        <span>1st</span>
      </div>

      <div class="medal" aria-hidden="true">★</div>

      <p class="eyebrow">Achievement Unlocked</p>
      <h1>Outstanding Performer</h1>
      <p class="description">
        Awarded for exceptional performance, dedication, and outstanding results.
      </p>

      <div class="winner">
        <span class="winner-label">WINNER</span>
        <span class="winner-name">Excellence Award</span>
      </div>
    </article>
  </main>

</body>
</html>
