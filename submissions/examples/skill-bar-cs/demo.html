<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Skill Bar — EaseMotion CSS</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="page">
        <section class="demo" aria-labelledby="demo-title">
            <div class="intro">
                <p class="eyebrow">EaseMotion CSS · Progress</p>

                <h1 id="demo-title">Skill Bar</h1>

                <p>
                    Stacked skill bars with animated fills, labels, percentages,
                    and a subtle glow on hover.
                </p>
            </div>

            <div class="skills" aria-label="Skill proficiency">
                <article class="skill">
                    <div class="skill-header">
                        <span class="skill-name">HTML &amp; CSS</span>
                        <span class="skill-percent">95%</span>
                    </div>

                    <div class="skill-track" role="progressbar" aria-label="HTML and CSS" aria-valuenow="95"
                        aria-valuemin="0" aria-valuemax="100">
                        <span class="skill-fill fill-html"></span>
                    </div>
                </article>

                <article class="skill">
                    <div class="skill-header">
                        <span class="skill-name">JavaScript</span>
                        <span class="skill-percent">88%</span>
                    </div>

                    <div class="skill-track" role="progressbar" aria-label="JavaScript" aria-valuenow="88"
                        aria-valuemin="0" aria-valuemax="100">
                        <span class="skill-fill fill-js"></span>
                    </div>
                </article>

                <article class="skill">
                    <div class="skill-header">
                        <span class="skill-name">UI / UX Design</span>
                        <span class="skill-percent">82%</span>
                    </div>

                    <div class="skill-track" role="progressbar" aria-label="UI and UX Design" aria-valuenow="82"
                        aria-valuemin="0" aria-valuemax="100">
                        <span class="skill-fill fill-design"></span>
                    </div>
                </article>

                <article class="skill">
                    <div class="skill-header">
                        <span class="skill-name">React</span>
                        <span class="skill-percent">76%</span>
                    </div>

                    <div class="skill-track" role="progressbar" aria-label="React" aria-valuenow="76" aria-valuemin="0"
                        aria-valuemax="100">
                        <span class="skill-fill fill-react"></span>
                    </div>
                </article>

                <article class="skill">
                    <div class="skill-header">
                        <span class="skill-name">Accessibility</span>
                        <span class="skill-percent">91%</span>
                    </div>

                    <div class="skill-track" role="progressbar" aria-label="Accessibility" aria-valuenow="91"
                        aria-valuemin="0" aria-valuemax="100">
                        <span class="skill-fill fill-a11y"></span>
                    </div>
                </article>
            </div>

            <p class="demo-note">
                Hover over a skill bar to expand its fill.
            </p>
        </section>
    </main>
</body>

</html>
