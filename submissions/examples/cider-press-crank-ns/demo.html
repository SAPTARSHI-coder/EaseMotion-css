<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cider Press Crank — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Cider Press Crank demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Cider Press Crank</h1>
      <p class="lede">Cider press crank squeezing juice from apple pulp</p>
    </header>

    <section class="ease-cider-press-crank" data-demo="cider-press-crank" aria-live="polite">
      <div class="ease-cider-press-crank__housing">
        <div class="ease-cider-press-crank__bezel">
          <div class="ease-cider-press-crank__face">
            <div class="ease-cider-press-crank__readout">
              <span class="ease-cider-press-crank__label">Cider Press Crank</span>
              <span class="ease-cider-press-crank__value">LIVE</span>
            </div>
            <div class="ease-cider-press-crank__motion" aria-hidden="true">
              <span class="ease-cider-press-crank__a"></span>
              <span class="ease-cider-press-crank__b"></span>
              <span class="ease-cider-press-crank__c"></span>
              <span class="ease-cider-press-crank__d"></span>
            </div>
            <div class="ease-cider-press-crank__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-cider-press-crank__controls">
          <button type="button" class="ease-cider-press-crank__btn primary">Engage</button>
          <button type="button" class="ease-cider-press-crank__btn">Reset</button>
          <label class="ease-cider-press-crank__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-cider-press-crank__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
