<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ease-card-stack-bh</title>
  <link rel="stylesheet" href="style.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #f1f5f9; padding: 2rem; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    h1 { color: #6366f1; margin-bottom: 0.5rem; }
    p { color: #94a3b8; margin-bottom: 2rem; }
  </style>
</head>
<body>
  <h1>ease-card-stack-bh</h1>
  <p>Hover over the card stack to see spring animation</p>
  
  <div class="ease-card-stack">
    <div class="ease-card-stack-item">Card 1</div>
    <div class="ease-card-stack-item">Card 2</div>
    <div class="ease-card-stack-item">Card 3</div>
  </div>
</body>
</html>
