<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CSS Sci-Fi HUD Holographic Flicker effect">
  <title>Holographic Flicker - Sci-Fi HUD</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="hud">
    <section class="holo-panel" aria-label="Holographic status panel">
      <div class="scanline"></div>

      <div class="hud-corner top-left"></div>
      <div class="hud-corner top-right"></div>
      <div class="hud-corner bottom-left"></div>
      <div class="hud-corner bottom-right"></div>

      <p class="hud-label">SYSTEM // HOLO-07</p>

      <h1 class="holographic-text" data-text="HOLOGRAPHIC">
        HOLOGRAPHIC
      </h1>

      <p class="hud-subtitle">FLICKER INTERFACE</p>

      <div class="status">
        <span class="status-dot"></span>
        SIGNAL ACTIVE
      </div>

      <div class="hud-lines">
        <span></span>
        <span></span>
        <span></span>
      </div>

      <p class="hud-footer">PURE CSS // ONLINE</p>
    </section>
  </main>
</body>
</html>
