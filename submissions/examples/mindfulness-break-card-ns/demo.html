<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Mindfulness Break Card | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="mindfulness-demo-container">
    <header class="mindfulness-demo-header">
      <h1>Mindfulness Break Reminder</h1>
      <p>Interactive wellness card with a synchronized pure CSS breathing animation guide.</p>
    </header>

    <!-- Mindfulness Card Component -->
    <article class="ease-mindfulness-card" aria-label="Mindfulness Break Reminder">
      
      <!-- Breathing Visualizer -->
      <div class="ease-breathing-container" aria-hidden="true">
        <div class="ease-breathing-circle"></div>
        <div class="ease-breathing-ring"></div>
        <div class="ease-breathing-core">
          <svg class="ease-breathing-icon" viewBox="0 0 24 24">
            <path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L4.35 19.4c-.39.39-.39 1.02 0 1.41.39.39 1.02.39 1.41 0l1.9-1.9C9.22 19.57 10.57 20 12 20c4.97 0 9-4.03 9-9s-4.03-9-9-9zm0 15c-3.31 0-6-2.69-6-6s2.69-6 6-6 6 2.69 6 6-2.69 6-6 6z"/>
          </svg>
        </div>
      </div>

      <!-- Live Breathing Indicator Text -->
      <div class="ease-breathing-text" aria-live="polite" aria-label="Breathing Guide"></div>

      <!-- Content -->
      <h2 class="ease-mindfulness-card__title">Time for a Mindful Break</h2>
      <p class="ease-mindfulness-card__desc">
        You've been working continuously. Step back, relax your shoulders, and follow the visual rhythm to reset your focus.
      </p>

      <!-- Actions -->
      <div class="ease-mindfulness-card__actions">
        <button type="button" class="ease-mindfulness-btn ease-mindfulness-btn--secondary">Snooze 10m</button>
        <button type="button" class="ease-mindfulness-btn ease-mindfulness-btn--primary">Complete Break</button>
      </div>

    </article>
  </main>

</body>
</html>
