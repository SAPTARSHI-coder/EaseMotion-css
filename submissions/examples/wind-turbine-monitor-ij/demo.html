<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-wind-turbine-monitor</title>
</head>
<body>
<main class="wtm-card">
  <header class="wtm-head">
    <h1 class="wtm-title">Turbine 7</h1>
    <span class="wtm-on">Online</span>
  </header>
  <section class="wtm-field" aria-label="turbine">
    <span class="wtm-tower"></span>
    <span class="wtm-nacelle"></span>
    <span class="wtm-hub"></span>
    <span class="wtm-blade wtm-blade-a"></span>
    <span class="wtm-blade wtm-blade-b"></span>
    <span class="wtm-blade wtm-blade-c"></span>
  </section>
  <section class="wtm-read">
    <span class="wtm-label">RPM</span>
    <strong class="wtm-rpm">18</strong>
    <span class="wtm-wind">12 m/s</span>
  </section>
  <footer class="wtm-foot">
    <span class="wtm-power">412 kW</span>
    <span class="wtm-pitch">Pitch 6deg</span>
  </footer>
</main>
</body>
</html>
