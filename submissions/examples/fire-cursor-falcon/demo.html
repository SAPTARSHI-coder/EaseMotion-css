<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fire Cursor</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="stage">
      <h1>Fire Cursor</h1>
      <p>
        Move your mouse across the canvas to spray warm sparks. Click for a larger
        burst.
      </p>
      <button class="spark-button">Try burst</button>
    </div>

    <div id="spark-root" aria-hidden="true"></div>

    <script>
      const root = document.getElementById("spark-root");
      const button = document.querySelector(".spark-button");
      let lastEmit = 0;

      const palette = ["#ff8a3d", "#ff3d3d", "#ffd24a", "#ffb347", "#f97316"];

      function randomBetween(min, max) {
        return Math.random() * (max - min) + min;
      }

      function emitSpark(x, y) {
        const s = document.createElement("span");
        const size = Math.round(randomBetween(2, 8));
        const angle = randomBetween(0, Math.PI * 2);
        const speed = randomBetween(2.2, 6.5);
        const drift = randomBetween(2.5, 7);
        const life = randomBetween(560, 900);
        const duration = life.toFixed(0);

        s.className = "spark";
        s.style.left = `${x}px`;
        s.style.top = `${y}px`;
        s.style.width = `${size}px`;
        s.style.height = `${size}px`;
        s.style.background = palette[Math.floor(Math.random() * palette.length)];
        s.style.setProperty("--dx", `${Math.cos(angle) * speed}px`);
        s.style.setProperty("--dy", `${Math.sin(angle) * speed}px`);
        s.style.setProperty("--fall", `${drift}px`);
        s.style.setProperty("--lifetime", `${duration}ms`);

        root.appendChild(s);
        setTimeout(() => s.remove(), life);
      }

      function burst(x, y, count) {
        for (let i = 0; i < count; i += 1) {
          emitSpark(x, y);
        }
      }

      window.addEventListener("mousemove", (event) => {
        const now = performance.now();
        if (now - lastEmit < 25) return;
        lastEmit = now;
        emitSpark(event.clientX, event.clientY);
      });

      window.addEventListener("click", (event) => {
        burst(event.clientX, event.clientY, 50);
      });

      button.addEventListener("mouseenter", (event) => {
        const rect = button.getBoundingClientRect();
        burst(rect.left + rect.width * 0.5, rect.top + rect.height * 0.5, 25);
      });
    </script>
  </body>
</html>
