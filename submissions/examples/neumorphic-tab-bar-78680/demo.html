<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neumorphic Tab Bar</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="page">
      <div class="tab-bar" role="tablist" aria-label="Sections">
        <button class="tab active" type="button" role="tab" aria-selected="true">Home</button>
        <button class="tab" type="button" role="tab" aria-selected="false">Explore</button>
        <button class="tab" type="button" role="tab" aria-selected="false">Profile</button>
      </div>
    </main>
  </body>
</html>
