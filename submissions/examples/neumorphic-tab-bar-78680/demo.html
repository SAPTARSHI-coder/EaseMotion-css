<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Neumorphic tab bar showcase for EaseMotion CSS issue #78680." />
    <title>Neumorphic Tab Bar</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="page">
      <section class="showcase" aria-labelledby="title">
        <p class="eyebrow">EaseMotion CSS · Issue #78680</p>
        <h1 id="title">Neumorphic Tab Bar</h1>
        <p class="description">
          A soft tab control with raised and pressed states for compact
          navigation interfaces.
        </p>

        <div class="tab-bar" role="tablist" aria-label="Sections">
          <button class="tab active" type="button" role="tab" aria-selected="true" aria-controls="panel-home" id="tab-home">Home</button>
          <button class="tab" type="button" role="tab" aria-selected="false" aria-controls="panel-explore" id="tab-explore">Explore</button>
          <button class="tab" type="button" role="tab" aria-selected="false" aria-controls="panel-profile" id="tab-profile">Profile</button>
        </div>

        <div class="panel" role="tabpanel" id="panel-home" aria-labelledby="tab-home">
          <strong>Home</strong>
          <span>Selected tab state</span>
        </div>
      </section>
    </main>
  </body>
</html>
