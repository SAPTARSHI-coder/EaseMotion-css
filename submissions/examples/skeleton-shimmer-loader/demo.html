<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Skeleton Shimmer Loader - EaseMotion CSS Submission</title>
  
  <!-- 1. Load Official EaseMotion CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
  
  <!-- 2. Load Submission Styles -->
  <link rel="stylesheet" href="style.css" />
  
  <style>
    body {
      background-color: #f1f5f9;
      color: #0f172a;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .dark-mode {
      background-color: #0f172a;
      color: #f8fafc;
    }
  </style>
</head>
<body class="ease-center" style="min-height: 100vh; padding: 2rem;">
  
  <div class="ease-flex ease-flex-col ease-gap-8" style="max-width: 400px; width: 100%;">
    
    <!-- Light Mode Skeleton Card -->
    <div class="ease-skeleton-card">
      <div class="ease-flex ease-items-center ease-gap-4">
        <div class="ease-skeleton-avatar"></div>
        <div class="ease-flex-1">
          <div class="ease-skeleton-line ease-skeleton-line-title"></div>
          <div class="ease-skeleton-line" style="width: 60%;"></div>
        </div>
      </div>
      <div class="ease-skeleton-line" style="margin-top: 0.5rem;"></div>
      <div class="ease-skeleton-line" style="width: 80%;"></div>
      <div class="ease-flex ease-gap-3" style="margin-top: 1.5rem;">
        <div class="ease-skeleton-button"></div>
        <div class="ease-skeleton-button"></div>
      </div>
    </div>

    <!-- Dark Mode Skeleton Card -->
    <div class="ease-skeleton-card dark-mode">
      <div class="ease-flex ease-items-center ease-gap-4">
        <div class="ease-skeleton-avatar"></div>
        <div class="ease-flex-1">
          <div class="ease-skeleton-line ease-skeleton-line-title"></div>
          <div class="ease-skeleton-line" style="width: 60%;"></div>
        </div>
      </div>
      <div class="ease-skeleton-line" style="margin-top: 0.5rem;"></div>
      <div class="ease-skeleton-line" style="width: 80%;"></div>
      <div class="ease-flex ease-gap-3" style="margin-top: 1.5rem;">
        <div class="ease-skeleton-button"></div>
        <div class="ease-skeleton-button"></div>
      </div>
    </div>

  </div>

</body>
</html>
