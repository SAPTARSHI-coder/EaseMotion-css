<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS TV Static Noise - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="em-tv-page" role="region" aria-label="Television Static Noise Animation">
        <div class="em-tv-container" aria-hidden="true">
            <div class="em-static-noise"></div>
            <div class="em-scanlines"></div>
        </div>

        <div class="em-tv-card" tabindex="0">
            <span class="em-tv-badge">ANALOGUE EFFECT</span>
            <h1 class="em-tv-title">TV Static Noise</h1>
            <p class="em-tv-subtitle">Pure CSS television static texture and scanline animation.</p>
        </div>
    </div>
</body>
</html>
