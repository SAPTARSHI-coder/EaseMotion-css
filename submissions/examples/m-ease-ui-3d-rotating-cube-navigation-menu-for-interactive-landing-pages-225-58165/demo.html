<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Rotating Cube Navigation</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<section class="hero">

    <div class="content">

        <span class="badge">
            Dark Mode Variant
        </span>

        <h1>
            3D Cube Navigation
        </h1>

        <p>
            A futuristic rotating cube navigation menu built with pure HTML and CSS.
            Hover over the cube to explore interactive navigation faces.
        </p>

        <div class="scene">

            <div class="cube">

                <div class="face front">
                    <span>Home</span>
                </div>

                <div class="face back">
                    <span>About</span>
                </div>

                <div class="face right">
                    <span>Projects</span>
                </div>

                <div class="face left">
                    <span>Skills</span>
                </div>

                <div class="face top">
                    <span>Blog</span>
                </div>

                <div class="face bottom">
                    <span>Contact</span>
                </div>

            </div>

        </div>

        <div class="menu">

            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Projects</a>
            <a href="#">Contact</a>

        </div>

    </div>

</section>

</body>
</html>
