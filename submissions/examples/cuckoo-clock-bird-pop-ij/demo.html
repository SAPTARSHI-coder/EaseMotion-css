<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-cuckoo-clock-bird-pop demo</title>
</head>
<body>
<div class="cc-app">
  <span class="cc-label">CUCKOO</span>
  <div class="cc-roof"></div>
  <div class="cc-gable">
    <span class="cc-window"></span>
    <div class="cc-doors"><span class="cc-door cc-door-l"></span><span class="cc-door cc-door-r"></span></div>
  </div>
  <span class="cc-bird"></span>
  <span class="cc-bubble">CUCKOO!</span>
  <div class="cc-body">
    <div class="cc-face"><span class="cc-hand cc-hour"></span><span class="cc-hand cc-min"></span><span class="cc-peg"></span></div>
  </div>
  <div class="cc-pendulum"><span class="cc-rod"></span><span class="cc-bob"></span></div>
  <span class="cc-weights"></span>
</div>
</body>
</html>
