<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="CSS-only responsive range slider with animated thumb and value tooltip."
  >
  <title>CSS Range Slider</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="demo-page">
    <section class="slider-card" aria-labelledby="slider-title">
      <p class="eyebrow">EaseMotion CSS</p>

      <h1 id="slider-title">CSS Range Slider</h1>

      <p class="description">
        A responsive range slider with a custom animated thumb,
        progress track, and value tooltip.
      </p>

      <div class="range-wrapper">
        <output class="range-value" id="range-value">
          60
        </output>

        <input
          class="range-slider"
          id="range-slider"
          type="range"
          min="0"
          max="100"
          value="60"
          aria-label="Select a value from 0 to 100"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="60"
        >

        <div class="range-labels" aria-hidden="true">
          <span>0</span>
          <span>100</span>
        </div>
      </div>

      <p class="helper-text">
        Use the slider or keyboard arrow keys to change the value.
      </p>
    </section>
  </main>

  <script>
    const slider = document.querySelector("#range-slider");
    const value = document.querySelector("#range-value");

    function updateSlider() {
      const min = Number(slider.min);
      const max = Number(slider.max);
      const current = Number(slider.value);
      const percentage = ((current - min) / (max - min)) * 100;

      slider.style.setProperty("--slider-progress", `${percentage}%`);

      value.textContent = current;
      value.style.setProperty("--value-position", `${percentage}%`);

      slider.setAttribute("aria-valuenow", current);
    }

    slider.addEventListener("input", updateSlider);

    updateSlider();
  </script>
</body>
</html>
