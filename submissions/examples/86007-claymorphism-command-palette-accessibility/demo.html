<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claymorphism Command Palette - Accessibility</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">
    <section
      class="palette"
      aria-labelledby="palette-title"
      aria-describedby="palette-description"
    >

      <header class="palette-header">
        <div>
          <p class="eyebrow">ACCESSIBLE COMMANDS</p>
          <h1 id="palette-title">Command Palette</h1>
          <p id="palette-description" class="sr-only">
            Use Tab to navigate commands and Enter or Space to activate
            the selected command.
          </p>
        </div>

        <kbd class="shortcut" aria-label="Control K">
          Ctrl K
        </kbd>
      </header>

      <div class="search-box">
        <label for="command-search">Search commands</label>

        <div class="search-input">
          <span aria-hidden="true">⌕</span>

          <input
            id="command-search"
            type="search"
            placeholder="Search commands..."
            autocomplete="off"
            aria-controls="command-list"
          >
        </div>
      </div>

      <div
        id="command-list"
        class="command-list"
        aria-label="Available commands"
      >

        <button class="command" type="button">
          <span class="command-icon" aria-hidden="true">+</span>

          <span class="command-content">
            <strong>Create Project</strong>
            <small>Start a new project</small>
          </span>

          <kbd aria-label="Command N">⌘ N</kbd>
        </button>

        <button class="command" type="button">
          <span class="command-icon" aria-hidden="true">↗</span>

          <span class="command-content">
            <strong>Open Dashboard</strong>
            <small>View your project overview</small>
          </span>

          <kbd aria-label="Command D">⌘ D</kbd>
        </button>

        <button class="command" type="button">
          <span class="command-icon" aria-hidden="true">⚙</span>

          <span class="command-content">
            <strong>Settings</strong>
            <small>Manage application preferences</small>
          </span>

          <kbd aria-label="Command comma">⌘ ,</kbd>
        </button>

        <button class="command" type="button">
          <span class="command-icon" aria-hidden="true">?</span>

          <span class="command-content">
            <strong>Help Center</strong>
            <small>Browse documentation and support</small>
          </span>

          <kbd aria-label="Question mark">?</kbd>
        </button>

      </div>

      <footer class="palette-footer" aria-label="Keyboard instructions">
        <span><kbd>Tab</kbd> Navigate</span>
        <span><kbd>Enter</kbd> Select</span>
        <span><kbd>Esc</kbd> Close</span>
      </footer>

    </section>
  </main>

</body>
</html>
