<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Layered Range Gauge</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="shell" aria-labelledby="title">
    <section class="card">
      <p class="eyebrow">metrics</p>
      <h1 id="title">Layered Range Gauge</h1>
      <p class="summary">A CSS-only gauge with stacked arcs, a bright pointer, and a calibrated sweep.</p>
      <div class="stage" role="img" aria-label="Animated Layered Range Gauge">
        <div class="gauge">
          <div class="arc arc-a"></div>
          <div class="arc arc-b"></div>
          <div class="arc arc-c"></div>
          <div class="pointer"></div>
          <div class="core"></div>
        </div>
        <article class="tile"><strong>01</strong><span>Stacked arc bands</span></article>
        <article class="tile"><strong>02</strong><span>Bright pointer sweep</span></article>
        <article class="tile"><strong>03</strong><span>Calibrated depth</span></article>
        <article class="tile"><strong>04</strong><span>Reduced-motion friendly</span></article>
      </div>
      <div class="tags" aria-label="Layered Range Gauge features">
        <span>Stacked arc bands</span>
        <span>Bright pointer sweep</span>
        <span>Calibrated depth</span>
        <span>Reduced-motion friendly</span>
      </div>
    </section>
  </main>
</body>
</html>
