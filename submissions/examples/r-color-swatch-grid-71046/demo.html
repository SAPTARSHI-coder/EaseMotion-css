<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Accessible color swatch grid with one-click HEX copying"
  >
  <title>CSS Color Swatch Grid</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">
    <section class="swatch-section" aria-labelledby="page-title">

      <header class="section-header">
        <p class="eyebrow">EaseMotion CSS</p>

        <h1 id="page-title">Color Swatch Grid</h1>

        <p class="description">
          Explore a responsive color palette and click any swatch
          to copy its HEX value.
        </p>
      </header>

      <div class="palette" aria-label="Color palette">

        <button
          class="swatch coral"
          type="button"
          data-color="#FF6B6B"
          aria-label="Copy coral color HEX #FF6B6B"
        >
          <span class="color-preview" aria-hidden="true"></span>
          <span class="swatch-info">
            <span class="color-name">Coral</span>
            <span class="hex-value">#FF6B6B</span>
          </span>
          <span class="copy-icon" aria-hidden="true">⧉</span>
        </button>

        <button
          class="swatch amber"
          type="button"
          data-color="#F59E0B"
          aria-label="Copy amber color HEX #F59E0B"
        >
          <span class="color-preview" aria-hidden="true"></span>
          <span class="swatch-info">
            <span class="color-name">Amber</span>
            <span class="hex-value">#F59E0B</span>
          </span>
          <span class="copy-icon" aria-hidden="true">⧉</span>
        </button>

        <button
          class="swatch lime"
          type="button"
          data-color="#84CC16"
          aria-label="Copy lime color HEX #84CC16"
        >
          <span class="color-preview" aria-hidden="true"></span>
          <span class="swatch-info">
            <span class="color-name">Lime</span>
            <span class="hex-value">#84CC16</span>
          </span>
          <span class="copy-icon" aria-hidden="true">⧉</span>
        </button>

        <button
          class="swatch emerald"
          type="button"
          data-color="#10B981"
          aria-label="Copy emerald color HEX #10B981"
        >
          <span class="color-preview" aria-hidden="true"></span>
          <span class="swatch-info">
            <span class="color-name">Emerald</span>
            <span class="hex-value">#10B981</span>
          </span>
          <span class="copy-icon" aria-hidden="true">⧉</span>
        </button>

        <button
          class="swatch cyan"
          type="button"
          data-color="#06B6D4"
          aria-label="Copy cyan color HEX #06B6D4"
        >
          <span class="color-preview" aria-hidden="true"></span>
          <span class="swatch-info">
            <span class="color-name">Cyan</span>
            <span class="hex-value">#06B6D4</span>
          </span>
          <span class="copy-icon" aria-hidden="true">⧉</span>
        </button>

        <button
          class="swatch blue"
          type="button"
          data-color="#3B82F6"
          aria-label="Copy blue color HEX #3B82F6"
        >
          <span class="color-preview" aria-hidden="true"></span>
          <span class="swatch-info">
            <span class="color-name">Blue</span>
            <span class="hex-value">#3B82F6</span>
          </span>
          <span class="copy-icon" aria-hidden="true">⧉</span>
        </button>

        <button
          class="swatch violet"
          type="button"
          data-color="#8B5CF6"
          aria-label="Copy violet color HEX #8B5CF6"
        >
          <span class="color-preview" aria-hidden="true"></span>
          <span class="swatch-info">
            <span class="color-name">Violet</span>
            <span class="hex-value">#8B5CF6</span>
          </span>
          <span class="copy-icon" aria-hidden="true">⧉</span>
        </button>

        <button
          class="swatch pink"
          type="button"
          data-color="#EC4899"
          aria-label="Copy pink color HEX #EC4899"
        >
          <span class="color-preview" aria-hidden="true"></span>
          <span class="swatch-info">
            <span class="color-name">Pink</span>
            <span class="hex-value">#EC4899</span>
          </span>
          <span class="copy-icon" aria-hidden="true">⧉</span>
        </button>

      </div>

      <p
        class="copy-status"
        id="copy-status"
        role="status"
        aria-live="polite"
      ></p>

    </section>
  </main>

  <script>
    const swatches = document.querySelectorAll(".swatch");
    const status = document.getElementById("copy-status");

    swatches.forEach((swatch) => {
      swatch.addEventListener("click", async () => {
        const color = swatch.dataset.color;

        try {
          await navigator.clipboard.writeText(color);

          status.textContent = `${color} copied to clipboard.`;

          swatch.classList.add("copied");

          setTimeout(() => {
            swatch.classList.remove("copied");
          }, 900);
        } catch (error) {
          status.textContent =
            `Unable to copy ${color}. Please copy it manually.`;
        }
      });
    });
  </script>

</body>
</html>
