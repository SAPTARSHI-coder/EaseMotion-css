<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Glassmorphism Blur Sci-Fi HUD">
  <title>Glassmorphism Blur - Sci-Fi HUD</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="hud">
    <section class="hud-panel" aria-label="Sci-Fi HUD status panel">

      <div class="hud-glow"></div>
      <div class="scanline"></div>

      <div class="corner top-left"></div>
      <div class="corner top-right"></div>
      <div class="corner bottom-left"></div>
      <div class="corner bottom-right"></div>

      <div class="hud-header">
        <span>NEURAL // HUD-703</span>
        <span class="signal">● ONLINE</span>
      </div>

      <div class="hud-content">
        <p class="eyebrow">SYSTEM INTERFACE</p>

        <h1>GLASS<br><span>CORE</span></h1>

        <p class="description">
          Transparent glass layers combined with neon illumination
          create a futuristic sci-fi interface.
        </p>

        <div class="status-grid">
          <div class="status-card">
            <span>CORE</span>
            <strong>98%</strong>
          </div>

          <div class="status-card">
            <span>SIGNAL</span>
            <strong>ACTIVE</strong>
          </div>

          <div class="status-card">
            <span>MODE</span>
            <strong>STABLE</strong>
          </div>
        </div>
      </div>

      <div class="hud-footer">
        <span>GLASSMORPHIC SYSTEM</span>
        <span>PURE CSS</span>
      </div>

    </section>
  </main>

</body>
</html>
