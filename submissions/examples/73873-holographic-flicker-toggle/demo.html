<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Holographic Flicker Toggle #73873 Demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #030308;
      margin: 0;
    }
  </style>
</head>
<body>

  <label class="holo-toggle-wrapper">
    <input type="checkbox" class="holo-toggle-input">
    <span class="holo-toggle-track">
      <span class="holo-toggle-thumb"></span>
    </span>
    <span class="holo-toggle-label">Holographic</span>
  </label>

</body>
</html>
