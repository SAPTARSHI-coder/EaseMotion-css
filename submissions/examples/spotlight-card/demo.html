<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spotlight Card</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="demo-shell">
      <section class="spotlight-card" aria-labelledby="slc-title">
        <div class="spotlight-card__glow" aria-hidden="true"></div>
        <div class="spotlight-card__content">
          <p class="spotlight-card__eyebrow">Interactive</p>
          <h1 id="slc-title">Spotlight card</h1>
          <p class="spotlight-card__copy">
            A dark card whose gradient glow follows the pointer via CSS custom
            properties. Hover to reveal the light.
          </p>
          <button type="button" class="spotlight-card__btn">Explore</button>
        </div>
      </section>
    </main>
  </body>
</html>
