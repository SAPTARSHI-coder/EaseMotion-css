<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Responsive 3D glassmorphism button built with pure HTML and CSS.">
    <title>3D Glassmorphism Button</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="demo">
        <section class="demo-card" aria-labelledby="demo-title">
            <p class="eyebrow">EaseMotion CSS</p>

            <h1 id="demo-title">3D Glassmorphism Button</h1>

            <p class="description">
                A responsive glass-style button with depth, lighting, and a tactile
                3D press effect using only HTML and CSS.
            </p>

            <div class="button-stage">
                <a class="glass-button" href="#demo">
                    <span class="button-label">Explore Motion</span>
                    <span class="button-arrow" aria-hidden="true">→</span>
                </a>
            </div>
        </section>
    </main>
</body>

</html>
