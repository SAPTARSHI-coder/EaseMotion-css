<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neumorphic Soft Shadow Mesh</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">
    <section class="mesh-card" aria-label="Neumorphic soft shadow gradient">
      <div class="mesh-orb orb-one"></div>
      <div class="mesh-orb orb-two"></div>
      <div class="mesh-orb orb-three"></div>

      <div class="content">
        <span class="badge">CSS MESH</span>
        <h1>Neumorphic<br>Soft Shadow</h1>
        <p>
          A soft 3D mesh gradient created entirely with
          HTML and vanilla CSS.
        </p>

        <button class="demo-button">Explore Effect</button>
      </div>
    </section>

    <section class="info">
      <h2>Neumorphic Mesh Gradient</h2>
      <p>
        Hover over the card and button to see the smooth
        depth and shadow transitions.
      </p>
    </section>
  </main>

</body>
</html>
