<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ease-magnetic-nav-link-sap demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f4f4f5;
    }
  </style>
</head>
<body>

  <nav class="magnetic-nav-sap">
    <a href="#" class="mag-link"><span>Home</span></a>
    <a href="#" class="mag-link"><span>Work</span></a>
    <a href="#" class="mag-link"><span>About</span></a>
    <a href="#" class="mag-link"><span>Contact</span></a>
  </nav>

  <script>
    const links = document.querySelectorAll('.mag-link');
    const strength = 0.35;

    links.forEach(link => {
      link.addEventListener('mousemove', (e) => {
        const rect = link.getBoundingClientRect();
        const x = e.clientX - rect.left - rect.width / 2;
        const y = e.clientY - rect.top - rect.height / 2;
        link.style.transform = `translate(${x * strength}px, ${y * strength}px)`;
        link.querySelector('span').style.transform = `translate(${x * strength * 0.4}px, ${y * strength * 0.4}px)`;
      });

      link.addEventListener('mouseleave', () => {
        link.style.transform = 'translate(0, 0)';
        link.querySelector('span').style.transform = 'translate(0, 0)';
      });
    });
  </script>

</body>
</html>
