<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Phoenix Flame – Flame Rises and Reforms Like Phoenix</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <h1>🔥 Phoenix Flame</h1>
    <p class="subtitle">Flame rises and reforms like a phoenix</p>

    <div class="phoenix-container">
      <div class="phoenix-stage" id="phoenixStage">
        <canvas id="canvas"></canvas>
        
        <!-- Info overlay -->
        <div class="info-overlay">
          <span class="phoenix-status" id="phoenixStatus">🔥 Rising</span>
          <span class="particle-count" id="particleCount">✦ 0 particles</span>
        </div>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <button class="ctrl-btn rise" id="riseBtn">🔥 Rise</button>
      <button class="ctrl-btn reform" id="reformBtn">🔄 Reform</button>
      <button class="ctrl-btn toggle" id="toggleBtn">⏸ Pause</button>
      <button class="ctrl-btn reset" id="resetBtn">↺ Reset</button>
    </div>

    <!-- Sliders -->
    <div class="slider-container">
      <span class="slider-label">Flame Intensity</span>
      <input type="range" id="intensitySlider" min="0" max="100" value="70" />
      <span class="slider-value" id="intensityValue">70%</span>
    </div>

    <div class="slider-container">
      <span class="slider-label">Rise Speed</span>
      <input type="range" id="speedSlider" min="1" max="10" value="5" />
      <span class="slider-value" id="speedValue">5×</span>
    </div>

    <div class="slider-container">
      <span class="slider-label">Particle Count</span>
      <input type="range" id="countSlider" min="50" max="300" value="150" step="10" />
      <span class="slider-value" id="countValue">150</span>
    </div>

    <div class="slider-container">
      <span class="slider-label">Flame Color</span>
      <input type="range" id="colorSlider" min="0" max="360" value="30" />
      <span class="slider-value" id="colorValue">30°</span>
    </div>

    <!-- Status -->
    <div class="status" id="status">🔥 Phoenix flame rising and reforming</div>

    <!-- Keyboard shortcuts -->
    <div class="shortcuts">
      <kbd>R</kbd> Rise · <kbd>F</kbd> Reform · <kbd>Space</kbd> Pause · <kbd>X</kbd> Reset
    </div>
  </div>

  <script>
    (function() {
      "use strict";

      // DOM elements
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      const phoenixStatus = document.getElementById('phoenixStatus');
      const particleCount = document.getElementById('particleCount');
      const riseBtn = document.getElementById('riseBtn');
      const reformBtn = document.getElementById('reformBtn');
      const toggleBtn = document.getElementById('toggleBtn');
      const resetBtn = document.getElementById('resetBtn');
      const status = document.getElementById('status');
      const intensitySlider = document.getElementById('intensitySlider');
      const intensityValue = document.getElementById('intensityValue');
      const speedSlider = document.getElementById('speedSlider');
      const speedValue = document.getElementById('speedValue');
      const countSlider = document.getElementById('countSlider');
      const countValue = document.getElementById('countValue');
      const colorSlider = document.getElementById('colorSlider');
      const colorValue = document.getElementById('colorValue');

      // State
      let particles = [];
      let isPaused = false;
      let animationId = null;
      let time = 0;
      let phase = 'rising'; // 'rising', 'reforming', 'idle'
      let riseProgress = 0;
      let targetRise = 0;
      let phoenixShape = [];

      // ----- Canvas setup -----
      function setupCanvas() {
        const rect = canvas.parentElement.getBoundingClientRect();
        const size = Math.min(rect.width - 40, 600);
        canvas.width = size;
        canvas.height = size;
        canvas.style.width = size + 'px';
        canvas.style.height = size + 'px';
      }

      // ----- Generate phoenix shape -----
      function generatePhoenixShape() {
        const w = canvas.width;
        const h = canvas.height;
        const cx = w / 2;
        const cy = h * 0.45;
        const scale = Math.min(w, h) * 0.04;
        
        phoenixShape = [];
        
        // Phoenix body points (bird shape)
        const bodyPoints = [
          // Head and crest
          { x: 0, y: -22 * scale },
          { x: 3, y: -20 * scale },
          { x: 4, y: -16 * scale },
          { x: 7, y: -14 * scale },
          { x: 8, y: -10 * scale },
          { x: 6, y: -6 * scale },
          // Upper body
          { x: 10, y: -4 * scale },
          { x: 12, y: 0 },
          { x: 14, y: 4 * scale },
          { x: 16, y: 8 * scale },
          { x: 18, y: 12 * scale },
          { x: 20, y: 16 * scale },
          { x: 22, y: 20 * scale },
          { x: 24, y: 24 * scale },
          // Wing tips
          { x: 30, y: 28 * scale },
          { x: 36, y: 30 * scale },
          { x: 40, y: 28 * scale },
          { x: 38, y: 24 * scale },
          { x: 34, y: 20 * scale },
          // Lower body
          { x: 28, y: 18 * scale },
          { x: 24, y: 22 * scale },
          { x: 20, y: 28 * scale },
          { x: 16, y: 34 * scale },
          { x: 12, y: 38 * scale },
          { x: 8, y: 40 * scale },
          { x: 4, y: 38 * scale },
          { x: 0, y: 36 * scale },
          // Tail feathers
          { x: -4, y: 38 * scale },
          { x: -8, y: 42 * scale },
          { x: -12, y: 44 * scale },
          { x: -16, y: 42 * scale },
          { x: -14, y: 38 * scale },
          { x: -10, y: 34 * scale },
          { x: -6, y: 30 * scale },
          // Lower left body
          { x: -4, y: 28 * scale },
          { x: -8, y: 22 * scale },
          { x: -12, y: 18 * scale },
          { x: -16, y: 16 * scale },
          { x: -18, y: 12 * scale },
          { x: -16, y: 8 * scale },
          { x: -12, y: 4 * scale },
          { x: -8, y: 0 },
          // Upper body left
          { x: -6, y: -4 * scale },
          { x: -8, y: -8 * scale },
          { x: -6, y: -12 * scale },
          { x: -4, y: -16 * scale },
          { x: -3, y: -20 * scale },
          { x: 0, y: -22 * scale },
        ];
        
        // Convert to absolute positions
        bodyPoints.forEach(p => {
          phoenixShape.push({
            x: cx + p.x,
            y: cy + p.y
          });
        });
      }

      // ----- Particle class -----
      class Particle {
        constructor() {
          this.reset();
        }

        reset() {
          const w = canvas.width;
          const h = canvas.height;
          const cx = w / 2;
          const cy = h * 0.45;
          
          // Start from random position on phoenix shape
          const shapeIndex = Math.floor(Math.random() * phoenixShape.length);
          const shapePoint = phoenixShape[shapeIndex];
          
          this.targetX = shapePoint.x + (Math.random() - 0.5) * 10;
          this.targetY = shapePoint.y + (Math.random() - 0.5) * 10;
          
          // Start position (scattered)
          const angle = Math.random() * Math.PI * 2;
          const radius = 50 + Math.random() * 150;
          this.x = cx + Math.cos(angle) * radius;
          this.y = cy + Math.sin(angle) * radius;
          
          this.size = 2 + Math.random() * 5;
          this.speed = 0.02 + Math.random() * 0.03;
          this.phase = Math.random() * Math.PI * 2;
          this.hue = parseInt(colorSlider.value) + (Math.random() - 0.5) * 30;
          this.saturation = 80 + Math.random() * 20;
          this.lightness = 50 + Math.random() * 30;
          this.opacity = 0.3 + Math.random() * 0.5;
          this.life = 1;
          this.trail = [];
          this.trailLength = 5 + Math.floor(Math.random() * 10);
          this.wobble = 0;
          this.wobbleSpeed = 0.02 + Math.random() * 0.03;
          this.wobbleAmount = 2 + Math.random() * 4;
          this.riseOffset = Math.random() * 100;
          this.isRising = false;
          this.reformProgress = 0;
        }

        updateRising(speedMult, intensity) {
          // Rise upward with wobble
          this.wobble += this.wobbleSpeed;
          const wobbleX = Math.sin(this.wobble + this.phase) * this.wobbleAmount;
          
          // Move upward
          this.y -= (0.3 + 0.7 * intensity) * speedMult * 0.5;
          this.x += Math.sin(this.wobble * 0.5 + this.phase) * 0.2 * speedMult;
          
          // Fade out at top
          const fadeStart = canvas.height * 0.2;
          if (this.y < fadeStart) {
            this.opacity *= 0.995;
          }
          
          // Reset if off screen
          if (this.y < -50 || this.opacity < 0.01) {
            this.reset();
            this.y = canvas.height * 0.8 + Math.random() * 100;
            this.x = canvas.width / 2 + (Math.random() - 0.5) * 200;
            this.opacity = 0.3 + Math.random() * 0.5;
            this.life = 1;
          }
        }

        updateReforming(speedMult, intensity) {
          // Move toward target position
          const dx = this.targetX - this.x;
          const dy = this.targetY - this.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          
          if (dist > 0.5) {
            const moveSpeed = this.speed * speedMult * (0.5 + 0.5 * intensity);
            this.x += (dx / dist) * moveSpeed * 0.5;
            this.y += (dy / dist) * moveSpeed * 0.5;
          } else {
            this.x = this.targetX;
            this.y = this.targetY;
          }
          
          // Wobble
          this.wobble += this.wobbleSpeed;
          this.x += Math.sin(this.wobble + this.phase) * 0.3 * speedMult;
          this.y += Math.cos(this.wobble * 0.7 + this.phase) * 0.3 * speedMult;
          
          // Opacity increases as particle approaches target
          const distProgress = 1 - Math.min(1, dist / 200);
          this.opacity = 0.2 + 0.8 * distProgress;
          
          // Size variation
          this.size = this.originalSize * (0.5 + 0.5 * distProgress);
          
          // Life
          this.life = 0.5 + 0.5 * distProgress;
        }

        update(speedMult, intensity, phase) {
          this.wobble += this.wobbleSpeed;
          
          if (phase === 'rising') {
            this.updateRising(speedMult, intensity);
          } else if (phase === 'reforming') {
            this.updateReforming(speedMult, intensity);
          } else {
            // Idle - float gently
            this.x += Math.sin(this.wobble + this.phase) * 0.1;
            this.y += Math.cos(this.wobble * 0.7 + this.phase) * 0.1;
          }

          // Update trail
          this.trail.push({ x: this.x, y: this.y });
          if (this.trail.length > this.trailLength) {
            this.trail.shift();
          }
        }

        draw(ctx, intensity) {
          const alpha = this.opacity * this.life * intensity;
          const size = this.size * (0.5 + 0.5 * intensity);
          const hue = this.hue + Math.sin(time * 0.5 + this.phase) * 10;

          // Trail
          if (this.trail.length > 1) {
            for (let i = 0; i < this.trail.length - 1; i++) {
              const t = i / this.trail.length;
              const trailAlpha = alpha * t * 0.15;
              const trailSize = size * t * 0.3;
              ctx.fillStyle = `hsla(${hue + 20}, 100%, 80%, ${trailAlpha})`;
              ctx.beginPath();
              ctx.arc(this.trail[i].x, this.trail[i].y, trailSize, 0, Math.PI * 2);
              ctx.fill();
            }
          }

          // Glow
          const glowSize = size * 5;
          const gradient = ctx.createRadialGradient(
            this.x, this.y, 0,
            this.x, this.y, glowSize
          );
          gradient.addColorStop(0, `hsla(${hue + 20}, 100%, 90%, ${alpha * 0.15})`);
          gradient.addColorStop(0.5, `hsla(${hue + 10}, 100%, 70%, ${alpha * 0.08})`);
          gradient.addColorStop(1, `hsla(${hue}, 100%, 50%, 0)`);
          ctx.fillStyle = gradient;
          ctx.beginPath();
          ctx.arc(this.x, this.y, glowSize, 0, Math.PI * 2);
          ctx.fill();

          // Core
          const coreGrad = ctx.createRadialGradient(
            this.x - size * 0.2, this.y - size * 0.2, 0,
            this.x, this.y, size
          );
          coreGrad.addColorStop(0, `hsla(45, 100%, 95%, ${alpha * 0.9})`);
          coreGrad.addColorStop(0.3, `hsla(${hue + 20}, 100%, 85%, ${alpha * 0.8})`);
          coreGrad.addColorStop(0.7, `hsla(${hue}, 100%, 70%, ${alpha * 0.6})`);
          coreGrad.addColorStop(1, `hsla(${hue - 10}, 100%, 50%, ${alpha * 0.3})`);
          
          ctx.shadowColor = `hsla(${hue}, 100%, 60%, ${alpha * 0.1})`;
          ctx.shadowBlur = 15;
          ctx.fillStyle = coreGrad;
          ctx.beginPath();
          ctx.arc(this.x, this.y, size, 0, Math.PI * 2);
          ctx.fill();
          ctx.shadowBlur = 0;

          // Sparkle
          if (this.life > 0.8 && Math.random() > 0.9) {
            ctx.fillStyle = `rgba(255, 255, 255, ${alpha * 0.15})`;
            ctx.beginPath();
            ctx.arc(this.x - size * 0.15, this.y - size * 0.2, size * 0.1, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      }

      // ----- Generate particles -----
      function generateParticles(count) {
        particles = [];
        const w = canvas.width;
        const h = canvas.height;
        const cx = w / 2;
        const cy = h * 0.45;
        
        for (let i = 0; i < count; i++) {
          const p = new Particle();
          // Scatter initial positions
          const angle = Math.random() * Math.PI * 2;
          const radius = 50 + Math.random() * 150;
          p.x = cx + Math.cos(angle) * radius;
          p.y = cy + Math.sin(angle) * radius;
          p.originalSize = p.size;
          particles.push(p);
        }
        particleCount.textContent = `✦ ${particles.length} particles`;
        countValue.textContent = particles.length;
      }

      // ----- Rise -----
      function rise() {
        phase = 'rising';
        phoenixStatus.textContent = '🔥 Rising';
        status.textContent = '🔥 Phoenix flame rising!';
        // Reset particles to bottom
        const w = canvas.width;
        const h = canvas.height;
        const cx = w / 2;
        particles.forEach(p => {
          p.y = h * 0.8 + Math.random() * 100;
          p.x = cx + (Math.random() - 0.5) * 200;
          p.opacity = 0.3 + Math.random() * 0.5;
          p.life = 1;
          p.trail = [];
        });
        setTimeout(() => {
          if (phase === 'rising') {
            status.textContent = '🔥 Phoenix flame ascending!';
          }
        }, 1000);
      }

      // ----- Reform -----
      function reform() {
        phase = 'reforming';
        phoenixStatus.textContent = '🔄 Reforming';
        status.textContent = '🔄 Phoenix flame reforming!';
        // Set targets for each particle
        const shapeCopy = [...phoenixShape];
        particles.forEach((p, i) => {
          const idx = i % shapeCopy.length;
          const point = shapeCopy[idx];
          p.targetX = point.x + (Math.random() - 0.5) * 8;
          p.targetY = point.y + (Math.random() - 0.5) * 8;
          p.originalSize = p.size;
        });
        setTimeout(() => {
          if (phase === 'reforming') {
            status.textContent = '🔄 Phoenix flame taking shape!';
          }
        }, 1500);
      }

      // ----- Toggle pause -----
      function togglePause() {
        isPaused = !isPaused;
        toggleBtn.textContent = isPaused ? '▶ Play' : '⏸ Pause';
        status.textContent = isPaused ? '⏸ Paused' : '▶ Resumed';
        phoenixStatus.textContent = isPaused ? '⏸ Paused' : 
          (phase === 'rising' ? '🔥 Rising' : phase === 'reforming' ? '🔄 Reforming' : '✨ Idle');
      }

      // ----- Reset -----
      function resetPhoenix() {
        isPaused = false;
        toggleBtn.textContent = '⏸ Pause';
        phase = 'idle';
        phoenixStatus.textContent = '✨ Idle';
        intensitySlider.value = 70;
        intensityValue.textContent = '70%';
        speedSlider.value = 5;
        speedValue.textContent = '5×';
        countSlider.value = 150;
        countValue.textContent = '150';
        colorSlider.value = 30;
        colorValue.textContent = '30°';
        generateParticles(150);
        status.textContent = '↺ Reset';
        setTimeout(() => {
          status.textContent = '🔥 Phoenix flame rising and reforming';
        }, 500);
      }

      // ----- Draw background -----
      function drawBackground() {
        const w = canvas.width;
        const h = canvas.height;
        const cx = w / 2;
        const cy = h * 0.45;

        // Dark background with warm glow
        const bgGradient = ctx.createRadialGradient(cx, cy, 0, cx, cy, w * 0.7);
        bgGradient.addColorStop(0, '#0a0a1a');
        bgGradient.addColorStop(0.3, '#080812');
        bgGradient.addColorStop(0.7, '#05050a');
        bgGradient.addColorStop(1, '#020204');
        ctx.fillStyle = bgGradient;
        ctx.fillRect(0, 0, w, h);
      }

      // ----- Draw -----
      function draw() {
        const w = canvas.width;
        const h = canvas.height;

        drawBackground();

        // Update particles
        if (!isPaused) {
          const intensity = parseInt(intensitySlider.value) / 100;
          const speedMult = parseInt(speedSlider.value) / 5;
          const hue = parseInt(colorSlider.value);
          
          // Update particle colors
          particles.forEach(p => {
            p.hue = hue + (Math.random() - 0.5) * 20;
          });
          
          particles.forEach(p => p.update(speedMult, intensity, phase));
        }

        // Draw particles (sorted by size for depth)
        const sortedParticles = [...particles].sort((a, b) => a.size - b.size);
        const intensity = parseInt(intensitySlider.value) / 100;
        sortedParticles.forEach(p => p.draw(ctx, intensity));

        // Update count
        particleCount.textContent = `✦ ${particles.length} particles`;
      }

      // ----- Animation loop -----
      function animate() {
        time += 0.016;
        draw();
        animationId = requestAnimationFrame(animate);
      }

      // ----- Start animation -----
      function startAnimation() {
        if (animationId) {
          cancelAnimationFrame(animationId);
        }
        animate();
      }

      // ----- Event Listeners -----
      riseBtn.addEventListener('click', rise);
      reformBtn.addEventListener('click', reform);
      toggleBtn.addEventListener('click', togglePause);
      resetBtn.addEventListener('click', resetPhoenix);

      intensitySlider.addEventListener('input', (e) => {
        intensityValue.textContent = e.target.value + '%';
      });

      speedSlider.addEventListener('input', (e) => {
        speedValue.textContent = e.target.value + '×';
      });

      countSlider.addEventListener('input', (e) => {
        const val = parseInt(e.target.value);
        countValue.textContent = val;
        generateParticles(val);
        status.textContent = `✦ Particle count: ${val}`;
        setTimeout(() => {
          status.textContent = '🔥 Phoenix flame rising and reforming';
        }, 1000);
      });

      colorSlider.addEventListener('input', (e) => {
        colorValue.textContent = e.target.value + '°';
        particles.forEach(p => {
          p.hue = parseInt(e.target.value) + (Math.random() - 0.5) * 20;
        });
      });

      // Keyboard shortcuts
      document.addEventListener('keydown', (e) => {
        if (e.key === 'r' || e.key === 'R') {
          e.preventDefault();
          rise();
        }
        if (e.key === 'f' || e.key === 'F') {
          e.preventDefault();
          reform();
        }
        if (e.key === ' ' || e.key === 'Space') {
          e.preventDefault();
          togglePause();
        }
        if (e.key === 'x' || e.key === 'X') {
          e.preventDefault();
          resetPhoenix();
        }
      });

      // Click canvas to rise
      canvas.addEventListener('click', rise);

      // ----- Resize handler -----
      let resizeTimeout;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(() => {
          setupCanvas();
          generatePhoenixShape();
          const count = parseInt(countSlider.value);
          generateParticles(count);
        }, 200);
      });

      // ----- Init -----
      function init() {
        setupCanvas();
        generatePhoenixShape();
        const count = parseInt(countSlider.value);
        generateParticles(count);
        startAnimation();
        status.textContent = '🔥 Phoenix flame rising and reforming!';
        // Auto-rise after a moment
        setTimeout(() => {
          rise();
        }, 500);
        setTimeout(() => {
          reform();
        }, 3000);
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }

    })();
  </script>
</body>
</html>
