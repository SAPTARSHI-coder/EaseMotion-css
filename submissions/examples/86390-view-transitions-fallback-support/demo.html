<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>View Transitions Fallback Support</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <h1>View Transitions</h1>

    <p class="subtitle">
      This demo uses the View Transitions API when available and falls back to
      a normal DOM update when it is not supported.
    </p>

    <section class="card" id="content">
      <span class="status-badge" id="statusBadge">State A</span>
      <h2 id="title">Welcome</h2>
      <p id="message">
        Click the button to transition between content states.
      </p>
    </section>

    <button id="transitionButton" type="button">
      Change Content
    </button>

    <p class="support-status" id="supportStatus" aria-live="polite"></p>
  </main>

  <script>
    const content = document.querySelector("#content");
    const title = document.querySelector("#title");
    const message = document.querySelector("#message");
    const statusBadge = document.querySelector("#statusBadge");
    const button = document.querySelector("#transitionButton");
    const supportStatus = document.querySelector("#supportStatus");

    let alternateState = false;

    function updateContent() {
      alternateState = !alternateState;

      if (alternateState) {
        statusBadge.textContent = "State B";
        title.textContent = "Transition Complete";
        message.textContent =
          "The content was updated using the supported transition path.";
      } else {
        statusBadge.textContent = "State A";
        title.textContent = "Welcome";
        message.textContent =
          "Click the button to transition between content states.";
      }
    }

    function runTransition(callback) {
      if (
        typeof document.startViewTransition === "function"
      ) {
        return document.startViewTransition(callback);
      }

      callback();
      return null;
    }

    function updateSupportStatus() {
      supportStatus.textContent =
        typeof document.startViewTransition === "function"
          ? "View Transitions API supported."
          : "View Transitions API unavailable — using fallback.";
    }

    button.addEventListener("click", () => {
      runTransition(updateContent);
    });

    updateSupportStatus();
  </script>
</body>
</html>
