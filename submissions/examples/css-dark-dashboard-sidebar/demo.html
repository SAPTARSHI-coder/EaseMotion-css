<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dark Dashboard Sidebar</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="dashboard">

    <aside class="sidebar" aria-label="Dashboard navigation">

        <div class="logo">
            <span>⚡</span>
            <h2>DarkUI</h2>
        </div>


        <nav>
            <a href="#" class="active">
                🏠 Dashboard
            </a>

            <a href="#">
                📊 Analytics
            </a>

            <a href="#">
                📁 Projects
            </a>

            <a href="#">
                ⚙ Settings
            </a>

            <a href="#">
                💬 Messages
            </a>
        </nav>


        <div class="profile">

            <div class="avatar">
                AK
            </div>

            <div>
                <h3>Avinash</h3>
                <p>Developer</p>
            </div>

        </div>


    </aside>



    <main class="content">

        <h1>Dashboard</h1>

        <div class="cards">

            <div class="card">
                <h3>Projects</h3>
                <p>24 Active</p>
            </div>


            <div class="card">
                <h3>Users</h3>
                <p>1200+</p>
            </div>


            <div class="card">
                <h3>Revenue</h3>
                <p>$45K</p>
            </div>

        </div>

    </main>


</div>


</body>
</html>
