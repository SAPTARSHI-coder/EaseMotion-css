<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Feature Announcement Banner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="layout-container">
        
        <header class="section-header">
            <h1 class="title">Feature Announcement Banner</h1>
            <p class="subtitle">A pure CSS dismissible alert banner using hidden checkboxes, featuring entrance animations and a gradient background.</p>
        </header>

        <div class="demo-area">
            
            <!-- 
              [TECHNIQUE] The Dismissable Hack
              We use a hidden checkbox to control the visibility of the banner.
              When the 'X' label is clicked, the checkbox is checked, and CSS
              hides the adjacent banner element.
            -->
            <div class="banner-wrapper">
                <input type="checkbox" id="dismiss-banner" class="dismiss-checkbox sr-only" aria-hidden="true">
                
                <div class="announcement-banner" role="alert" aria-live="polite">
                    <div class="banner-content">
                        <div class="banner-badge">New</div>
                        <p class="banner-text">
                            <strong>Introducing Dark Mode!</strong> Experience our platform in a whole new light. 
                            <a href="#" class="banner-link">Learn more <span aria-hidden="true">→</span></a>
                        </p>
                    </div>
                    
                    <label for="dismiss-banner" class="btn-dismiss" aria-label="Dismiss announcement" role="button" tabindex="0">
                        <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                    </label>
                </div>
            </div>
            
            <!-- A button just to reset the demo state without JS -->
            <label for="dismiss-banner" class="btn-reset">Toggle Banner</label>
            
        </div>
        
    </div>

</body>
</html>
