<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ease-scroll-sticky-toc-sap demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #f4f4f5; display: flex; justify-content: center; gap: 40px; padding: 40px 20px; }
    article { max-width: 420px; }
    section { height: 60vh; padding-top: 20px; }
    h2 { color: #111; }
    p { color: #444; line-height: 1.7; }
  </style>
</head>
<body>
  <nav class="sticky-toc-sap" id="toc">
    <h5>On this page</h5>
    <a href="#s1" data-target="s1" class="active">Introduction</a>
    <a href="#s2" data-target="s2">Getting Started</a>
    <a href="#s3" data-target="s3">Advanced Usage</a>
  </nav>
  <article>
    <section id="s1"><h2>Introduction</h2><p>Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p></section>
    <section id="s2"><h2>Getting Started</h2><p>Ut enim ad minim veniam, quis nostrud exercitation.</p></section>
    <section id="s3"><h2>Advanced Usage</h2><p>Duis aute irure dolor in reprehenderit in voluptate.</p></section>
  </article>
  <script>
    const links = [...document.querySelectorAll('.sticky-toc-sap a')];
    const sections = [...document.querySelectorAll('section')];
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          links.forEach(l => l.classList.toggle('active', l.dataset.target === entry.target.id));
        }
      });
    }, { threshold: 0.5 });
    sections.forEach(s => observer.observe(s));
  </script>
</body>
</html>
