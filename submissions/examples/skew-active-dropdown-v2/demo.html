<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CSS Skew-Active Dropdown for fintech dashboard layouts">
  <title>Skew-Active Dropdown</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="dashboard">

```
<header class="header">
  <div>
    <span class="label">FINTECH DASHBOARD</span>
    <h1>Account Overview</h1>
  </div>

  <div class="dropdown">
    <button class="dropdown-button" type="button">
      Dashboard Menu
      <span class="arrow">⌄</span>
    </button>

    <nav class="dropdown-menu" aria-label="Dashboard navigation">
      <a href="#">Overview</a>
      <a href="#">Transactions</a>
      <a href="#">Payments</a>
      <a href="#">Reports</a>
      <a href="#">Settings</a>
    </nav>
  </div>
</header>

<section class="cards">

  <article class="card">
    <span>Available Balance</span>
    <strong>$52,840.00</strong>
    <small>+8.4% this month</small>
  </article>

  <article class="card">
    <span>Monthly Revenue</span>
    <strong>$18,420.00</strong>
    <small>+12.6% this month</small>
  </article>

  <article class="card">
    <span>Total Investments</span>
    <strong>$94,680.00</strong>
    <small>+6.8% this month</small>
  </article>

</section>
```

  </main>

</body>
</html>
