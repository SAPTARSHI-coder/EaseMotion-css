<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stepper Next Previous Validation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="demo">
    <h1>Stepper Validation</h1>

    <div class="stepper" aria-label="Progress steps">
      <div class="step active" data-step="1">
        <span>1</span>
        <strong>Account</strong>
      </div>

      <div class="line"></div>

      <div class="step" data-step="2">
        <span>2</span>
        <strong>Details</strong>
      </div>

      <div class="line"></div>

      <div class="step" data-step="3">
        <span>3</span>
        <strong>Confirm</strong>
      </div>
    </div>

    <section class="step-content">
      <h2 id="step-title">Account</h2>
      <p id="step-description">
        Enter your account information to continue.
      </p>
    </section>

    <div class="actions">
      <button id="previous" type="button" disabled>
        Previous
      </button>

      <button id="next" type="button">
        Next
      </button>
    </div>

    <p id="status" role="status">Step 1 of 3</p>
  </main>

  <script>
    const steps = [
      {
        title: "Account",
        description: "Enter your account information to continue."
      },
      {
        title: "Details",
        description: "Provide the required personal details."
      },
      {
        title: "Confirm",
        description: "Review your information before completing."
      }
    ];

    let currentStep = 0;

    const stepElements = document.querySelectorAll(".step");
    const title = document.querySelector("#step-title");
    const description = document.querySelector("#step-description");
    const previousButton = document.querySelector("#previous");
    const nextButton = document.querySelector("#next");
    const status = document.querySelector("#status");

    function updateStepper() {
      stepElements.forEach((step, index) => {
        step.classList.toggle("active", index === currentStep);
        step.classList.toggle("completed", index < currentStep);
      });

      title.textContent = steps[currentStep].title;
      description.textContent = steps[currentStep].description;

      previousButton.disabled = currentStep === 0;
      nextButton.disabled = currentStep === steps.length - 1;

      status.textContent = `Step ${currentStep + 1} of ${steps.length}`;
    }

    function nextStep() {
      if (
        !Number.isInteger(currentStep) ||
        currentStep < 0 ||
        currentStep >= steps.length - 1
      ) {
        return false;
      }

      currentStep += 1;
      updateStepper();
      return true;
    }

    function previousStep() {
      if (
        !Number.isInteger(currentStep) ||
        currentStep <= 0 ||
        currentStep >= steps.length
      ) {
        return false;
      }

      currentStep -= 1;
      updateStepper();
      return true;
    }

    nextButton.addEventListener("click", nextStep);
    previousButton.addEventListener("click", previousStep);

    updateStepper();
  </script>

</body>
</html>
