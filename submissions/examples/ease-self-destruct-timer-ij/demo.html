<!-- EaseMotion component: self-destruct-timer -->
<!DOCTYPE html>
<html lang="en" data-destruct="timer">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.1">
<title>Ease Self Destruct Timer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="destruct-console">
  <header class="destruct-head">
    <span class="destruct-title">DESTRUCT</span>
    <span class="destruct-arm">ARMED</span>
  </header>
  <div class="destruct-readout">
    <span class="destruct-dial"></span>
    <span class="destruct-display">
      <span class="destruct-digit d-1">1</span>
      <span class="destruct-digit d-2">0</span>
      <span class="destruct-digit d-3">9</span>
      <span class="destruct-digit d-4">5</span>
    </span>
  </div>
  <div class="destruct-core">
    <span class="core-canister"></span>
    <span class="core-glow"></span>
  </div>
  <footer class="destruct-foot">
    <span class="destruct-warn">WARNING</span>
    <span class="destruct-status">COUNTING</span>
  </footer>
</main>
</body>
</html>
