<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Empty State Search</title>
<link rel="stylesheet" href="style.css" />
<script>
  function esSearch(query) {
    var results = document.getElementById('es-results');
    var empty = document.getElementById('es-empty');
    var items = results.querySelectorAll('.es-item');
    var visible = 0;
    items.forEach(function (item) {
      var match = !query || item.textContent.toLowerCase().indexOf(query.toLowerCase()) > -1;
      item.hidden = !match;
      if (match) visible++;
    });
    empty.hidden = visible !== 0;
    var term = document.getElementById('es-empty-term');
    if (term) term.textContent = query;
  }
</script>
</head>
<body>
<main class="es-wrap">
  <h1 class="es-h1">Search Results</h1>
  <p class="es-lede">The empty state names the exact query that produced it, so "No results" always reads as "No results for 'xyz'" rather than a dead end with no next step.</p>

  <input
    class="es-input"
    type="search"
    placeholder="Search fruits..."
    oninput="esSearch(this.value)"
    aria-label="Search results"
  />

  <ul class="es-results" id="es-results">
    <li class="es-item">Apple</li>
    <li class="es-item">Banana</li>
    <li class="es-item">Cherry</li>
    <li class="es-item">Date</li>
  </ul>

  <div class="es-empty" id="es-empty" hidden>
    <p class="es-empty-title">No results for "<span id="es-empty-term"></span>"</p>
    <p class="es-empty-hint">Try a different spelling or a shorter term.</p>
  </div>
</main>
</body>
</html>
