<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scale Hover Modal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<input type="checkbox" id="modal-toggle" hidden>

<label for="modal-toggle" class="open-btn">
    Open Modal
</label>

<div class="overlay">
    <div class="modal">
        <label for="modal-toggle" class="close-btn">&times;</label>

        <h2>Scale Hover Modal</h2>

        <p>
            A responsive modal built using only HTML and CSS. Hover over the
            modal to see a smooth scale effect.
        </p>

        <button class="action-btn">Continue</button>
    </div>
</div>

</body>
</html>
