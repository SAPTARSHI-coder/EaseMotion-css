<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slide-Up Popover</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<section class="popover-section">
    <h1>Slide-Up Popover</h1>
    <p>Accessible popover component built with pure HTML and CSS.</p>

    <div class="popover-container">

        <button class="popover-button">
            Hover Me

            <span class="popover">
                <strong>Quick Tip</strong>
                <span>
                    This popover smoothly slides upward into view using only HTML and CSS.
                </span>
            </span>

        </button>

    </div>

</section>

</body>
</html>
