<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CSS DNA Loading Helix v2</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<main class="loader-container" aria-label="DNA loading animation">

<h1>DNA Loading Helix</h1>

<div class="dna">

<div class="strand left"></div>
<div class="strand right"></div>

<span class="pair p1"></span>
<span class="pair p2"></span>
<span class="pair p3"></span>
<span class="pair p4"></span>
<span class="pair p5"></span>
<span class="pair p6"></span>

</div>

<p>Loading...</p>

</main>

</body>
</html>
