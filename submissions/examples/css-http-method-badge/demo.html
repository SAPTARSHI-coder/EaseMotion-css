<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS HTTP Method Badge - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="em-badge-page">
        <div class="em-card" role="region" aria-label="HTTP Method Badge Showcase" tabindex="0">
            <span class="em-card-badge">API DOCUMENTATION UI</span>
            <h1 class="em-card-title">HTTP Method Badges</h1>
            <p class="em-card-desc">Color-coded HTTP method badges (GET, POST, PUT, DELETE) tailored for API documentation and developer dashboards using pure CSS.</p>
            
            <!-- Badge Container -->
            <div class="em-badge-container" role="list" aria-label="HTTP Method badges list">
                <span class="em-method-badge em-get" role="listitem">GET</span>
                <span class="em-method-badge em-post" role="listitem">POST</span>
                <span class="em-method-badge em-put" role="listitem">PUT</span>
                <span class="em-method-badge em-delete" role="listitem">DELETE</span>
            </div>

            <a href="#" class="em-card-btn" role="button">Explore API Docs</a>
        </div>
    </div>
</body>
</html>
