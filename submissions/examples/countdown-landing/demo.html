<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Countdown Landing &mdash; EaseMotion CSS Demo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="page-head">
    <p class="kicker">EaseMotion CSS &middot; Hero &amp; Landing</p>
    <h1>Countdown Landing</h1>
    <p class="sub">Flip cards count down to the big launch.</p>
  </header>
  <main class="stage">
    <div class="cd-row">
      <div class="cd-unit"><div class="cd-card">23</div><div class="cd-label">Days</div></div>
      <div class="cd-colon">:</div>
      <div class="cd-unit"><div class="cd-card">14</div><div class="cd-label">Hours</div></div>
      <div class="cd-colon">:</div>
      <div class="cd-unit"><div class="cd-card">56</div><div class="cd-label">Mins</div></div>
      <div class="cd-colon">:</div>
      <div class="cd-unit"><div class="cd-card">08</div><div class="cd-label">Secs</div></div>
    </div>
  </main>
  <p class="stage-caption">Scoreboard-style cards tick in perfect sync.</p>
  <footer class="page-foot">
    <span>Pure CSS &middot; zero dependencies</span>
    <span>Flip countdown</span>
  </footer>
</body>
</html>
