<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slide-Up Card Grid</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<section class="grid">

    <article class="card">
        <h2>Modern UI</h2>
        <p>Elegant slide-up animation using pure CSS.</p>
    </article>

    <article class="card">
        <h2>Responsive</h2>
        <p>Adapts perfectly across desktop, tablet and mobile.</p>
    </article>

    <article class="card">
        <h2>Accessibility</h2>
        <p>Supports prefers-reduced-motion.</p>
    </article>

    <article class="card">
        <h2>Performance</h2>
        <p>No JavaScript. Lightweight and fast.</p>
    </article>

</section>

</body>
</html>
