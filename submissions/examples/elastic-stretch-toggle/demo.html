<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Elastic Stretch Toggle</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="toggle-container">
    <input type="checkbox" id="stretch-toggle" class="toggle-input">
    <label for="stretch-toggle" class="toggle-label">
      <span class="toggle-handle"></span>
    </label>
  </div>
</body>
</html>
