<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Warp · dimensional transition</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <div class="portal-container">
      <div class="portal-wrapper">
        <!-- Portal Rings -->
        <div class="portal" id="portal">
          <div class="portal-ring ring-1"></div>
          <div class="portal-ring ring-2"></div>
          <div class="portal-ring ring-3"></div>
          <div class="portal-ring ring-4"></div>
          <div class="portal-core" id="portalCore">
            <div class="portal-vortex"></div>
          </div>
          <div class="portal-particles" id="portalParticles"></div>
        </div>
      </div>
      
      <div class="portal-status">
        <span id="portalStatus">🌌 Dimension: Normal</span>
      </div>
    </div>

    <div class="controls">
      <button class="btn btn-dimension" id="dimension1Btn">🌍 Normal</button>
      <button class="btn btn-dimension" id="dimension2Btn">🔥 Fire</button>
      <button class="btn btn-dimension" id="dimension3Btn">❄️ Ice</button>
      <button class="btn btn-dimension" id="dimension4Btn">⚡ Arcane</button>
      <button class="btn btn-reset" id="resetBtn">⟳ Reset</button>
    </div>
    <div class="footer-note">
      <span>🌀 click dimensions to warp · each has unique colors & particles</span>
    </div>
  </div>

  <script>
    (function() {
      "use strict";

      // DOM refs
      const portal = document.getElementById('portal');
      const portalCore = document.getElementById('portalCore');
      const portalParticles = document.getElementById('portalParticles');
      const portalStatus = document.getElementById('portalStatus');
      const resetBtn = document.getElementById('resetBtn');

      // Dimension configurations
      const dimensions = {
        normal: {
          name: 'Normal',
          icon: '🌌',
          ringColors: ['#6366f1', '#818cf8', '#a5b4fc', '#c7d2fe'],
          coreColor: 'radial-gradient(circle, #818cf8, #4f46e5)',
          particleColor: '#818cf8',
          glowColor: 'rgba(99, 102, 241, 0.3)',
          status: '🌌 Dimension: Normal'
        },
        fire: {
          name: 'Fire',
          icon: '🔥',
          ringColors: ['#ef4444', '#f97316', '#fb923c', '#fca5a5'],
          coreColor: 'radial-gradient(circle, #fb923c, #dc2626)',
          particleColor: '#f97316',
          glowColor: 'rgba(239, 68, 68, 0.4)',
          status: '🔥 Dimension: Fire'
        },
        ice: {
          name: 'Ice',
          icon: '❄️',
          ringColors: ['#60a5fa', '#93c5fd', '#bae6fd', '#dbeafe'],
          coreColor: 'radial-gradient(circle, #93c5fd, #3b82f6)',
          particleColor: '#93c5fd',
          glowColor: 'rgba(96, 165, 250, 0.3)',
          status: '❄️ Dimension: Ice'
        },
        arcane: {
          name: 'Arcane',
          icon: '⚡',
          ringColors: ['#8b5cf6', '#a78bfa', '#c4b5fd', '#ddd6fe'],
          coreColor: 'radial-gradient(circle, #a78bfa, #7c3aed)',
          particleColor: '#a78bfa',
          glowColor: 'rgba(139, 92, 246, 0.4)',
          status: '⚡ Dimension: Arcane'
        }
      };

      let currentDimension = 'normal';
      let isWarping = false;

      function createParticles(color, count = 40) {
        portalParticles.innerHTML = '';
        for (let i = 0; i < count; i++) {
          const particle = document.createElement('div');
          particle.className = 'particle';
          
          const size = Math.random() * 6 + 2;
          particle.style.width = size + 'px';
          particle.style.height = size + 'px';
          particle.style.backgroundColor = color;
          
          // Random position within portal
          const angle = Math.random() * Math.PI * 2;
          const distance = Math.random() * 70 + 10;
          const x = Math.cos(angle) * distance;
          const y = Math.sin(angle) * distance;
          
          particle.style.setProperty('--px', x + 'px');
          particle.style.setProperty('--py', y + 'px');
          
          // Random animation delay and duration
          particle.style.animationDelay = (Math.random() * 2) + 's';
          particle.style.animationDuration = (Math.random() * 2 + 2) + 's';
          
          // Random shape
          if (Math.random() > 0.5) {
            particle.style.clipPath = 'polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%)';
          } else {
            particle.style.borderRadius = '50%';
          }
          
          portalParticles.appendChild(particle);
        }
      }

      function warpToDimension(dimensionKey) {
        if (isWarping || dimensionKey === currentDimension) return;
        isWarping = true;
        
        const dim = dimensions[dimensionKey];
        if (!dim) return;
        
        // Trigger warp animation
        portal.classList.add('warping');
        
        // Update rings
        const rings = portal.querySelectorAll('.portal-ring');
        rings.forEach((ring, index) => {
          ring.style.borderColor = dim.ringColors[index % dim.ringColors.length];
          ring.style.boxShadow = `0 0 30px ${dim.ringColors[index % dim.ringColors.length]}44, inset 0 0 30px ${dim.ringColors[index % dim.ringColors.length]}22`;
        });
        
        // Update core
        portalCore.style.background = dim.coreColor;
        portalCore.style.boxShadow = `0 0 60px ${dim.glowColor}, inset 0 0 40px ${dim.glowColor}`;
        
        // Update particles
        createParticles(dim.particleColor, 40);
        
        // Update status
        portalStatus.textContent = dim.status;
        portalStatus.style.color = dim.ringColors[0];
        
        // Update portal glow
        portal.style.boxShadow = `0 0 80px ${dim.glowColor}, 0 0 150px ${dim.glowColor}`;
        
        currentDimension = dimensionKey;
        
        // Remove warp animation after transition
        setTimeout(() => {
          portal.classList.remove('warping');
          isWarping = false;
        }, 800);
      }

      function resetPortal() {
        if (isWarping) return;
        warpToDimension('normal');
      }

      // Event listeners for dimension buttons
      document.querySelectorAll('.btn-dimension').forEach(btn => {
        btn.addEventListener('click', function(e) {
          e.preventDefault();
          const dimension = this.dataset.dimension;
          if (dimension) {
            warpToDimension(dimension);
          }
        });
      });

      // Button data attributes
      document.getElementById('dimension1Btn').dataset.dimension = 'normal';
      document.getElementById('dimension2Btn').dataset.dimension = 'fire';
      document.getElementById('dimension3Btn').dataset.dimension = 'ice';
      document.getElementById('dimension4Btn').dataset.dimension = 'arcane';

      if (resetBtn) {
        resetBtn.addEventListener('click', function(e) {
          e.preventDefault();
          resetPortal();
        });
      }

      // Keyboard shortcuts
      document.addEventListener('keydown', function(e) {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

        const key = e.key;
        if (key === '1') {
          e.preventDefault();
          warpToDimension('normal');
        } else if (key === '2') {
          e.preventDefault();
          warpToDimension('fire');
        } else if (key === '3') {
          e.preventDefault();
          warpToDimension('ice');
        } else if (key === '4') {
          e.preventDefault();
          warpToDimension('arcane');
        } else if (key === 'r' || key === 'R') {
          e.preventDefault();
          resetPortal();
        }
      });

      // Initialize with normal dimension
      createParticles('#818cf8', 40);
      portalStatus.textContent = dimensions.normal.status;
      portalStatus.style.color = '#818cf8';
      portal.style.boxShadow = '0 0 80px rgba(99, 102, 241, 0.3), 0 0 150px rgba(99, 102, 241, 0.15)';
      
      console.log('🌀 Portal Warp ready · shortcuts: [1]Normal [2]Fire [3]Ice [4]Arcane [R]Reset');
    })();
  </script>
</body>
</html>
