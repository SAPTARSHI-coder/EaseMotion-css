<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Glitch-Flicker Drawer — Gaming Hub</title>
<link rel="stylesheet" href="style.css">
<style>
  body {
    font-family: sans-serif;
    background: #111;
    color: #fff;
    margin: 0;
    padding: 40px;
  }
  /* Checkbox hack: pure CSS toggle, no JS required */
  #drawer-toggle {
    display: none;
  }
  #drawer-toggle:checked ~ .glitch-drawer {
    transform: translateX(0);
    animation: drawerGlitchIn 0.5s steps(6) both;
  }
  #drawer-toggle:checked ~ .drawer-overlay {
    opacity: 1;
    pointer-events: auto;
  }
  .drawer-close {
    position: absolute;
    top: 16px;
    right: 16px;
    background: none;
    border: none;
    color: #fff;
    font-size: 18px;
    cursor: pointer;
  }
</style>
</head>
<body>
  <h1>Gaming Hub</h1>

  <input type="checkbox" id="drawer-toggle">
  <label for="drawer-toggle" class="drawer-trigger">☰ Open Menu</label>

  <label for="drawer-toggle" class="drawer-overlay"></label>

  <div class="glitch-drawer">
    <label for="drawer-toggle" class="drawer-close">✕</label>
    <h2>MENU</h2>
    <nav>
      <a href="#">Library</a>
      <a href="#">Store</a>
      <a href="#">Community</a>
      <a href="#">Settings</a>
    </nav>
  </div>
</body>
</html>
