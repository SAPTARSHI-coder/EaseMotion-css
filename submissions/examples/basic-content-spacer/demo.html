<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Basic Content Spacer #75281 Demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 24px;
      background-color: #0f172a;
      color: #f8fafc;
    }
    .card {
      background-color: #1e293b;
      padding: 16px 20px;
      border-radius: 8px;
      border: 1px solid #334155;
    }
  </style>
</head>
<body>

  <div class="card">
    <h3 style="margin: 0;">Section One</h3>
    <p style="margin: 4px 0 0 0; color: #94a3b8;">First content group details go here.</p>
  </div>

  <div class="basic-content-spacer"></div>

  <div class="card">
    <h3 style="margin: 0;">Section Two</h3>
    <p style="margin: 4px 0 0 0; color: #94a3b8;">Second content group details go here.</p>
  </div>

</body>
</html>
