<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CSS-only slot machine reels animation">
  <title>CSS Slot Machine Reels</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="demo">
    <section class="slot-machine" aria-label="CSS slot machine demonstration">
      <div class="slot-header">
        <span class="slot-light" aria-hidden="true"></span>
        <h1>Lucky Reels</h1>
        <span class="slot-light" aria-hidden="true"></span>
      </div>

      <div class="reels" aria-label="Three animated slot machine reels">
        <div class="reel-window">
          <div class="reel reel-one" aria-hidden="true">
            <span>🍒</span>
            <span>🍋</span>
            <span>🔔</span>
            <span>⭐</span>
            <span>7️⃣</span>
            <span>🍒</span>
          </div>
        </div>

        <div class="reel-window">
          <div class="reel reel-two" aria-hidden="true">
            <span>🍋</span>
            <span>⭐</span>
            <span>🍒</span>
            <span>7️⃣</span>
            <span>🔔</span>
            <span>🍋</span>
          </div>
        </div>

        <div class="reel-window">
          <div class="reel reel-three" aria-hidden="true">
            <span>🔔</span>
            <span>🍒</span>
            <span>7️⃣</span>
            <span>🍋</span>
            <span>⭐</span>
            <span>🔔</span>
          </div>
        </div>
      </div>

      <div class="slot-divider" aria-hidden="true"></div>

      <p class="slot-status">
        <span class="status-dot" aria-hidden="true"></span>
        CSS-only spinning reels
      </p>
    </section>

    <p class="demo-note">
      Three reels spin and stop at different times using CSS animations only.
    </p>
  </main>
</body>
</html>
