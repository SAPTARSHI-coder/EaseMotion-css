<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Slot Machine Reels - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="em-slot-page">
        <div class="em-card" role="region" aria-label="Slot Machine Reels Showcase" tabindex="0">
            <span class="em-card-badge">GAMIFICATION UI</span>
            <h1 class="em-card-title">Slot Machine Reels</h1>
            <p class="em-card-desc">Three spinning slot machine reels featuring continuous vertical scrolling keyframe animations and stop states using pure CSS.</p>
            
            <!-- Slot Machine Container -->
            <div class="em-slot-machine" role="img" aria-label="Slot machine reels container">
                <div class="em-slot-reel">
                    <div class="em-reel-strip">
                        <span>🍒</span>
                        <span>🍋</span>
                        <span>⭐</span>
                        <span>💎</span>
                        <span>7️⃣</span>
                    </div>
                </div>
                <div class="em-slot-reel">
                    <div class="em-reel-strip em-delay-1">
                        <span>🍋</span>
                        <span>⭐</span>
                        <span>💎</span>
                        <span>7️⃣</span>
                        <span>🍒</span>
                    </div>
                </div>
                <div class="em-slot-reel">
                    <div class="em-reel-strip em-delay-2">
                        <span>⭐</span>
                        <span>💎</span>
                        <span>7️⃣</span>
                        <span>🍒</span>
                        <span>🍋</span>
                    </div>
                </div>
            </div>

            <a href="#" class="em-card-btn" role="button">Spin Again</a>
        </div>
    </div>
</body>
</html>
