<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solar Flare</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="solar-app">

    <section class="solar-card">

      <header class="solar-header">
        <div>
          <span class="eyebrow">☀️ COSMIC ENERGY</span>
          <h1>Solar Flare</h1>
          <p>Control the energy of a living miniature star.</p>
        </div>

        <div class="energy-display">
          <span>ENERGY</span>
          <strong id="energyValue">20%</strong>
        </div>
      </header>

      <div class="solar-display" id="solarDisplay">
        <canvas id="solarCanvas"></canvas>

        <div class="solar-overlay">
          <div class="status" id="status">
            ☀️ Solar activity is calm
          </div>

          <div class="flare-counter">
            <span>FLARES</span>
            <strong id="flareCount">0</strong>
          </div>
        </div>
      </div>

      <section class="controls">

        <div class="control-group">
          <label for="energySlider">
            <span>Solar Intensity</span>
            <strong id="sliderValue">20%</strong>
          </label>

          <input
            id="energySlider"
            type="range"
            min="0"
            max="100"
            value="20"
          >
        </div>

        <div class="control-group">
          <span class="control-title">Activity Mode</span>

          <div class="mode-buttons">
            <button class="mode active" data-level="20">
              ☀️ Calm
            </button>

            <button class="mode" data-level="50">
              🔥 Active
            </button>

            <button class="mode" data-level="75">
              💥 Storm
            </button>

            <button class="mode" data-level="100">
              🌋 Superflare
            </button>
          </div>
        </div>

        <div class="action-row">
          <button class="action primary" id="flareBtn">
            ☀️ Trigger Flare
          </button>

          <button class="action secondary" id="resetBtn">
            ↻ Reset
          </button>
        </div>

        <p class="hint">
          Click the sun or press Space to trigger a flare.
        </p>

      </section>

    </section>

  </main>

  <script>
    const canvas = document.getElementById("solarCanvas");
    const ctx = canvas.getContext("2d");

    const display = document.getElementById("solarDisplay");
    const slider = document.getElementById("energySlider");

    const energyValue = document.getElementById("energyValue");
    const sliderValue = document.getElementById("sliderValue");

    const flareCount = document.getElementById("flareCount");
    const status = document.getElementById("status");

    const flareButton = document.getElementById("flareBtn");
    const resetButton = document.getElementById("resetBtn");

    let width = 0;
    let height = 0;

    let energy = 20;
    let targetEnergy = 20;
    let flares = 0;

    let pulse = 0;
    let flarePower = 0;

    const stars = [];
    const particles = [];
    const rings = [];
    const arcs = [];

    function resize() {
      const rect = display.getBoundingClientRect();

      width = canvas.width = rect.width * devicePixelRatio;
      height = canvas.height = rect.height * devicePixelRatio;

      canvas.style.width = rect.width + "px";
      canvas.style.height = rect.height + "px";

      ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);

      createStars();
    }

    function createStars() {
      stars.length = 0;

      const count = Math.max(45, Math.floor(width / 18));

      for (let i = 0; i < count; i++) {
        stars.push({
          x: Math.random() * (width / devicePixelRatio),
          y: Math.random() * (height / devicePixelRatio),
          size: Math.random() * 1.5 + 0.4,
          phase: Math.random() * Math.PI * 2,
          speed: Math.random() * 0.02 + 0.005
        });
      }
    }

    function createArc() {
      arcs.push({
        angle: Math.random() * Math.PI * 2,
        length: Math.random() * 0.8 + 0.4,
        width: Math.random() * 2 + 1,
        phase: Math.random() * Math.PI * 2,
        life: 1
      });
    }

    function triggerFlare() {
      flares++;

      flareCount.textContent = flares;

      flarePower = 1;

      const centerX = width / devicePixelRatio / 2;
      const centerY = height / devicePixelRatio / 2;

      const amount = 18 + Math.floor(energy * 0.35);

      for (let i = 0; i < amount; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 0.8 + Math.random() * 2.2 + energy / 80;

        particles.push({
          x: centerX,
          y: centerY,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          size: Math.random() * 2 + 0.8,
          life: 1
        });
      }

      rings.push({
        radius: 45,
        alpha: 0.9,
        speed: 2 + energy / 40
      });

      for (let i = 0; i < 4; i++) {
        createArc();
      }

      status.textContent = "🔥 Solar flare detected";
    }

    function reset() {
      particles.length = 0;
      rings.length = 0;
      arcs.length = 0;

      flares = 0;
      flarePower = 0;

      flareCount.textContent = "0";

      targetEnergy = 20;
      slider.value = 20;

      updateEnergy();

      status.textContent = "☀️ Solar activity is calm";
    }

    function updateEnergy() {
      energyValue.textContent = Math.round(energy) + "%";
      sliderValue.textContent = Math.round(energy) + "%";
    }

    slider.addEventListener("input", () => {
      targetEnergy = Number(slider.value);
      document.querySelectorAll(".mode").forEach(btn => {
        btn.classList.remove("active");
      });
    });

    document.querySelectorAll(".mode").forEach(button => {
      button.addEventListener("click", () => {
        targetEnergy = Number(button.dataset.level);
        slider.value = targetEnergy;

        document.querySelectorAll(".mode").forEach(btn => {
          btn.classList.remove("active");
        });

        button.classList.add("active");
      });
    });

    flareButton.addEventListener("click", triggerFlare);
    resetButton.addEventListener("click", reset);

    display.addEventListener("click", (event) => {
      if (event.target === canvas) {
        triggerFlare();
      }
    });

    window.addEventListener("keydown", (event) => {
      if (event.code === "Space") {
        event.preventDefault();
        triggerFlare();
      }

      if (event.code === "ArrowUp") {
        targetEnergy = Math.min(100, targetEnergy + 5);
        slider.value = targetEnergy;
      }

      if (event.code === "ArrowDown") {
        targetEnergy = Math.max(0, targetEnergy - 5);
        slider.value = targetEnergy;
      }

      if (event.key.toLowerCase() === "r") {
        reset();
      }
    });

    function drawStars(time) {
      for (const star of stars) {
        const opacity =
          0.3 +
          Math.sin(time * star.speed + star.phase) * 0.3;

        ctx.globalAlpha = Math.max(0.05, opacity);
        ctx.fillStyle = "#ffffff";

        ctx.beginPath();
        ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.globalAlpha = 1;
    }

    function drawSun(cx, cy) {
      const intensity = energy / 100;

      const baseRadius = 58 + intensity * 8;
      const glow = 25 + intensity * 55 + flarePower * 40;

      const outer = ctx.createRadialGradient(
        cx,
        cy,
        baseRadius * 0.5,
        cx,
        cy,
        baseRadius + glow
      );

      outer.addColorStop(0, "rgba(255, 210, 70, 0.65)");
      outer.addColorStop(0.45, "rgba(255, 130, 30, 0.25)");
      outer.addColorStop(1, "rgba(255, 70, 20, 0)");

      ctx.fillStyle = outer;

      ctx.beginPath();
      ctx.arc(cx, cy, baseRadius + glow, 0, Math.PI * 2);
      ctx.fill();

      const sun = ctx.createRadialGradient(
        cx - 15,
        cy - 15,
        5,
        cx,
        cy,
        baseRadius
      );

      sun.addColorStop(0, "#fff9c4");
      sun.addColorStop(0.35, "#ffd54a");
      sun.addColorStop(0.75, "#ff9f1c");
      sun.addColorStop(1, "#f04424");

      ctx.fillStyle = sun;

      ctx.beginPath();
      ctx.arc(cx, cy, baseRadius, 0, Math.PI * 2);
      ctx.fill();

      const spots = 5 + Math.floor(intensity * 10);

      for (let i = 0; i < spots; i++) {
        const angle = i * 2.4 + pulse * 0.1;
        const distance = Math.random() * baseRadius * 0.55;

        const x = cx + Math.cos(angle) * distance;
        const y = cy + Math.sin(angle) * distance;

        ctx.fillStyle = "rgba(210, 65, 20, 0.18)";

        ctx.beginPath();
        ctx.arc(
          x,
          y,
          2 + Math.random() * 3,
          0,
          Math.PI * 2
        );

        ctx.fill();
      }
    }

    function drawArcs(cx, cy) {
      for (let i = arcs.length - 1; i >= 0; i--) {
        const arc = arcs[i];

        arc.phase += 0.03;
        arc.life -= 0.006;

        if (arc.life <= 0) {
          arcs.splice(i, 1);
          continue;
        }

        const radius = 65 + Math.sin(arc.phase) * 8;

        ctx.save();

        ctx.translate(cx, cy);
        ctx.rotate(arc.angle);

        ctx.strokeStyle =
          `rgba(255, ${120 + energy}, 40, ${arc.life})`;

        ctx.lineWidth = arc.width;

        ctx.shadowBlur = 12;
        ctx.shadowColor = "#ff8c32";

        ctx.beginPath();

        ctx.arc(
          0,
          0,
          radius,
          -arc.length,
          arc.length
        );

        ctx.stroke();

        ctx.restore();
      }
    }

    function drawParticles() {
      for (let i = particles.length - 1; i >= 0; i--) {
        const particle = particles[i];

        particle.x += particle.vx;
        particle.y += particle.vy;

        particle.vx *= 0.995;
        particle.vy *= 0.995;

        particle.life -= 0.012;

        if (particle.life <= 0) {
          particles.splice(i, 1);
          continue;
        }

        ctx.globalAlpha = particle.life;

        ctx.fillStyle = "#ffd166";

        ctx.shadowBlur = 10;
        ctx.shadowColor = "#ff7b00";

        ctx.beginPath();

        ctx.arc(
          particle.x,
          particle.y,
          particle.size,
          0,
          Math.PI * 2
        );

        ctx.fill();

        ctx.shadowBlur = 0;
      }

      ctx.globalAlpha = 1;
    }

    function drawRings(cx, cy) {
      for (let i = rings.length - 1; i >= 0; i--) {
        const ring = rings[i];

        ring.radius += ring.speed;
        ring.alpha -= 0.012;

        if (ring.alpha <= 0) {
          rings.splice(i, 1);
          continue;
        }

        ctx.strokeStyle =
          `rgba(255, 180, 50, ${ring.alpha})`;

        ctx.lineWidth = 2;

        ctx.beginPath();

        ctx.arc(
          cx,
          cy,
          ring.radius,
          0,
          Math.PI * 2
        );

        ctx.stroke();
      }
    }

    function animate(time) {
      const viewWidth = width / devicePixelRatio;
      const viewHeight = height / devicePixelRatio;

      ctx.clearRect(0, 0, viewWidth, viewHeight);

      energy += (targetEnergy - energy) * 0.05;

      flarePower *= 0.965;

      pulse += 0.03;

      updateEnergy();

      ctx.fillStyle = "#03050d";
      ctx.fillRect(0, 0, viewWidth, viewHeight);

      drawStars(time);

      const cx = viewWidth / 2;
      const cy = viewHeight / 2;

      drawRings(cx, cy);
      drawSun(cx, cy);
      drawArcs(cx, cy);
      drawParticles();

      if (
        energy > 80 &&
        Math.random() < 0.02
      ) {
        createArc();
      }

      if (
        energy > 50 &&
        Math.random() < 0.008
      ) {
        rings.push({
          radius: 60,
          alpha: 0.3,
          speed: 1 + energy / 70
        });
      }

      requestAnimationFrame(animate);
    }

    window.addEventListener("resize", resize);

    resize();
    requestAnimationFrame(animate);
  </script>

</body>
</html>
