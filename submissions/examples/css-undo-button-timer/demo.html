<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="CSS undo button with circular countdown timer"
  >
  <title>CSS Undo Button with Timer</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="demo">
    <section
      class="undo-toast"
      aria-label="Undo notification"
    >
      <div class="undo-content">
        <div class="undo-icon" aria-hidden="true">
          ✓
        </div>

        <div class="undo-message">
          <strong>Item deleted</strong>
          <span>You can undo this action.</span>
        </div>

        <button
          class="undo-button"
          type="button"
          aria-label="Undo deletion"
        >
          <span class="timer" aria-hidden="true"></span>
          <span class="undo-label">Undo</span>
        </button>
      </div>
    </section>

    <p class="hint">
      The circular indicator represents a 5-second CSS countdown.
    </p>
  </main>
</body>
</html>
