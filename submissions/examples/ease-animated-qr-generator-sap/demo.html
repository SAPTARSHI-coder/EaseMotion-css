<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ease-animated-qr-generator-sap demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { height: 100vh; margin: 0; display: flex; align-items: center; justify-content: center; background: #f4f4f5; }
  </style>
</head>
<body>
  <div class="qr-gen-sap">
    <div class="qr-grid" id="qrGrid"></div>
    <span style="font-size:12px;color:#64748b;">Simulated QR pattern</span>
  </div>
  <script>
    const grid = document.getElementById('qrGrid');
    const total = 144;
    for (let i = 0; i < total; i++) {
      const cell = document.createElement('div');
      const on = Math.random() > 0.45;
      cell.className = 'qr-cell' + (on ? '' : ' off');
      if (on) cell.style.animationDelay = `${Math.random() * 0.5}s`;
      grid.appendChild(cell);
    }
  </script>
</body>
</html>
