<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Database Schema Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="schema-container">
        <article class="schema-card" aria-label="Users database schema">

            <header class="schema-header">
                <div>
                    <span class="schema-label">DATABASE TABLE</span>
                    <h1>users</h1>
                </div>

                <span class="table-icon" aria-hidden="true">▦</span>
            </header>

            <div class="schema-table">

                <div class="schema-row schema-row-header">
                    <span>Column</span>
                    <span>Type</span>
                    <span>Key</span>
                </div>

                <div class="schema-row">
                    <span class="column-name">id</span>
                    <span class="column-type">INT</span>
                    <span class="column-key primary">PK</span>
                </div>

                <div class="schema-row">
                    <span class="column-name">username</span>
                    <span class="column-type">VARCHAR(50)</span>
                    <span class="column-key unique">UQ</span>
                </div>

                <div class="schema-row">
                    <span class="column-name">email</span>
                    <span class="column-type">VARCHAR(100)</span>
                    <span class="column-key unique">UQ</span>
                </div>

                <div class="schema-row">
                    <span class="column-name">created_at</span>
                    <span class="column-type">TIMESTAMP</span>
                    <span class="column-key">—</span>
                </div>

                <div class="schema-row">
                    <span class="column-name">is_active</span>
                    <span class="column-type">BOOLEAN</span>
                    <span class="column-key">—</span>
                </div>

            </div>

            <footer class="schema-footer">
                <span><strong>5</strong> columns</span>
                <span class="status">● Active</span>
            </footer>

        </article>
    </main>

</body>
</html>
