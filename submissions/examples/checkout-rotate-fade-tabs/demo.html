<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Rotate-Fade Tabs</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="checkout-layout">
        <h2 class="section-title">Shipping Details</h2>
        
        <div class="tabs-container">
            <input type="radio" name="tabs" id="tab1" class="tab-input" checked>
            <input type="radio" name="tabs" id="tab2" class="tab-input">
            <input type="radio" name="tabs" id="tab3" class="tab-input">
            
            <div class="tab-nav">
                <label for="tab1" class="tab-label">Address</label>
                <label for="tab2" class="tab-label">Options</label>
                <label for="tab3" class="tab-label">Summary</label>
                <div class="active-indicator"></div>
            </div>
            
            <div class="tab-content-wrapper">
                <div class="tab-content content-1">
                    <h3>Delivery Address</h3>
                    <p>Enter your exact location for precise delivery tracking. Save for future purchases.</p>
                </div>
                
                <div class="tab-content content-2">
                    <h3>Shipping Options</h3>
                    <p>Choose between standard, expedited, or same-day delivery services.</p>
                </div>
                
                <div class="tab-content content-3">
                    <h3>Order Summary</h3>
                    <p>Review your selected items and shipping preferences before payment.</p>
                </div>
            </div>
        </div>
        
        <button class="checkout-btn">Continue</button>
    </div>
</body>
</html>
