<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Scale-Hover Badge - Gaming Hub Showcase</title>
  <link rel="stylesheet" href="../../../easemotion.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="gaming-layout" role="main">
    <article class="gaming-card" tabindex="0" aria-labelledby="server-name">
      
      <header class="card-header">
        <h1 id="server-name" class="server-title">VALKYRIE // PROTOCOL</h1>
        <!-- Primary Scale-Hover Badge -->
        <span class="ease-badge-scale-hover badge-purple" role="status" tabindex="0" aria-label="Status: Mythic Season 5 Active">
          <span class="badge-dot" aria-hidden="true"></span>
          MYTHIC SEASON 5
        </span>
      </header>

      <div class="card-body">
        <div class="status-row">
          <span class="status-label">Tournament Region</span>
          <span class="ease-badge-scale-hover badge-cyan delay-1" tabindex="0">
            GLOBAL NA/EU
          </span>
        </div>

        <div class="status-row">
          <span class="status-label">XP Boost Multiplier</span>
          <span class="ease-badge-scale-hover badge-gold delay-2" tabindex="0">
            4X VIP BOOST
          </span>
        </div>

        <div class="status-row">
          <span class="status-label">Server Latency</span>
          <span class="ease-badge-scale-hover badge-crimson" tabindex="0">
            <span class="badge-dot" aria-hidden="true"></span>
            9MS LIVE OPS
          </span>
        </div>
      </div>

      <footer class="card-footer">
        <button class="btn-cyber">Deploy Squad ➔</button>
      </footer>

    </article>
  </main>
</body>
</html>
