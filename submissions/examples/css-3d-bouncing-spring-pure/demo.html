<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 3D Effect: Bouncing Spring</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="layout-container">
        
        <header class="section-header">
            <h1 class="title">Pure CSS 3D: Bouncing Spring</h1>
            <p class="subtitle">A hardware-accelerated, JavaScript-free 3D animation utilizing `transform-style: preserve-3d`. Features elastic `cubic-bezier` timing functions and staggered animation delays to simulate spring compression physics.</p>
        </header>

        <div class="demo-area">
            
            <!-- 
              [TECHNIQUE] The 3D Scene
              The wrapper establishes the perspective, allowing child elements
              to be transformed in 3D space.
            -->
            <div class="scene-3d">
                
                <!-- 
                  The primary rotating object. 
                  It uses preserve-3d to ensure the coils maintain their 3D positions.
                -->
                <div class="spring-assembly">
                    
                    <!-- 
                      The Spring Coils
                      Stacked div elements that animate on the Z-axis.
                      Each coil has a specific animation delay to compress and expand 
                      in sequence, creating the elastic bounce effect.
                    -->
                    <div class="spring-coil coil-1"></div>
                    <div class="spring-coil coil-2"></div>
                    <div class="spring-coil coil-3"></div>
                    <div class="spring-coil coil-4"></div>
                    <div class="spring-coil coil-5"></div>
                    <div class="spring-coil coil-6"></div>
                    <div class="spring-coil coil-7"></div>
                    <div class="spring-coil coil-8"></div>
                    
                    <!-- The Object bouncing on the spring -->
                    <div class="spring-payload">
                        <div class="icon-bounce">
                            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="10"></circle>
                                <path d="M12 16v-4"></path>
                                <path d="M12 8h.01"></path>
                            </svg>
                        </div>
                    </div>
                    
                </div>
                
            </div>
            
        </div>
        
    </div>

</body>
</html>
