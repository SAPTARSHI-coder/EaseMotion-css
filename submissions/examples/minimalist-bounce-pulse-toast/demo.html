<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Bounce-Pulse Toast</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="container">

    <h1>Bounce-Pulse Toast</h1>

    <p class="subtitle">
        A lightweight toast notification built entirely with HTML and CSS.
    </p>

    <div
        class="toast success"
        role="status"
        aria-live="polite">

        <div class="toast-icon">
            ✓
        </div>

        <div class="toast-content">

            <h2>Success!</h2>

            <p>
                Your project has been deployed successfully.
            </p>

        </div>

    </div>

    <div
        class="toast info"
        role="status"
        aria-live="polite">

        <div class="toast-icon">
            ℹ
        </div>

        <div class="toast-content">

            <h2>Information</h2>

            <p>
                New updates are available for your workspace.
            </p>

        </div>

    </div>

</main>

</body>
</html>
