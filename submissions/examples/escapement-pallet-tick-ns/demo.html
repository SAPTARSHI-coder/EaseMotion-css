<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Escapement Pallet Tick — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Escapement Pallet Tick demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Escapement Pallet Tick</h1>
      <p class="lede">Escapement pallets locking and releasing an escape wheel</p>
    </header>

    <section class="ease-escapement-pallet-tick" data-demo="escapement-pallet-tick" aria-live="polite">
      <div class="ease-escapement-pallet-tick__housing">
        <div class="ease-escapement-pallet-tick__bezel">
          <div class="ease-escapement-pallet-tick__face">
            <div class="ease-escapement-pallet-tick__readout">
              <span class="ease-escapement-pallet-tick__label">Escapement Pallet Tick</span>
              <span class="ease-escapement-pallet-tick__value">LIVE</span>
            </div>
            <div class="ease-escapement-pallet-tick__motion" aria-hidden="true">
              <span class="ease-escapement-pallet-tick__a"></span>
              <span class="ease-escapement-pallet-tick__b"></span>
              <span class="ease-escapement-pallet-tick__c"></span>
              <span class="ease-escapement-pallet-tick__d"></span>
            </div>
            <div class="ease-escapement-pallet-tick__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-escapement-pallet-tick__controls">
          <button type="button" class="ease-escapement-pallet-tick__btn primary">Engage</button>
          <button type="button" class="ease-escapement-pallet-tick__btn">Reset</button>
          <label class="ease-escapement-pallet-tick__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-escapement-pallet-tick__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
