<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyberpunk Masonry Gallery</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="gallery-header">
  <h1>Cyberpunk Gallery</h1>
  <p>Neon Masonry Photo Collection</p>
</header>

<main class="gallery" aria-label="Cyberpunk photo gallery">
  <figure class="gallery-item">
    <img src="https://picsum.photos/600/800?random=31" alt="Cyberpunk city architecture">
    <figcaption>Neon District</figcaption>
  </figure>

  <figure class="gallery-item">
    <img src="https://picsum.photos/600/600?random=32" alt="Futuristic city lights">
    <figcaption>Future City</figcaption>
  </figure>

  <figure class="gallery-item">
    <img src="https://picsum.photos/600/900?random=33" alt="Night skyline">
    <figcaption>Night Grid</figcaption>
  </figure>

  <figure class="gallery-item">
    <img src="https://picsum.photos/600/700?random=34" alt="Neon technology scene">
    <figcaption>Digital Core</figcaption>
  </figure>

  <figure class="gallery-item">
    <img src="https://picsum.photos/600/500?random=35" alt="Futuristic street">
    <figcaption>Neon Street</figcaption>
  </figure>

  <figure class="gallery-item">
    <img src="https://picsum.photos/600/850?random=36" alt="Cyberpunk skyline">
    <figcaption>Skyline 2077</figcaption>
  </figure>
</main>

</body>
</html>
