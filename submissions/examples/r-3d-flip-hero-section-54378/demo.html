<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS 3D-Flip Hero Section</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<section class="hero">

    <div class="hero-content">

        <span class="badge">Creative Portfolio</span>

        <h1>Create Stunning Web Experiences</h1>

        <p>
            Build responsive, accessible interfaces with modern HTML and CSS
            animations designed for creative portfolios.
        </p>

        <div class="actions">
            <a href="#" class="btn primary">Get Started</a>
            <a href="#" class="btn secondary">Explore</a>
        </div>

    </div>

    <div class="hero-visual">

        <div class="flip-card">

            <div class="flip-inner">

                <div class="flip-front">
                    <h2>Front Side</h2>
                    <p>Hover to reveal the project.</p>
                </div>

                <div class="flip-back">
                    <h2>Creative Design</h2>
                    <p>Interactive 3D flip animation using only CSS.</p>
                </div>

            </div>

        </div>

    </div>

</section>

</body>
</html>
