<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Drone Flight HUD | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="dhstage">
    <div class="dhscreen">
      <div class="dhtopbar">
        <span>FLIGHT MODE: GPS</span>
        <span>SAT: 12</span>
        <span>REC</span>
      </div>
      <div class="dhgrid">
        <div class="dhcell">
          <div class="dhcell-label">Altitude</div>
          <span class="dhcell-val">120</span>
          <span class="dhcell-unit">meters</span>
        </div>
        <div class="dhcell">
          <div class="dhcell-label">Speed</div>
          <span class="dhcell-val">32</span>
          <span class="dhcell-unit">km/h</span>
        </div>
        <div class="dhcell">
          <div class="dhcell-label">Battery</div>
          <span class="dhcell-val">78%</span>
          <span class="dhcell-unit">22 min left</span>
        </div>
        <div class="dhcell">
          <div class="dhcell-label">Signal</div>
          <span class="dhcell-val">-58</span>
          <span class="dhcell-unit">dBm</span>
        </div>
      </div>
      <div class="dhcompass">
        <span class="dhcompass-n">N</span>
        <div class="dhcompass-needle"></div>
        <div class="dhcompass-center"></div>
      </div>
    </div>
  </div>
</body>
</html>
