<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Morph Glow Navbar - Fintech Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="navbar">

    <div class="logo">
        <span class="logo-icon">◈</span>
        <span>FinFlow</span>
    </div>

    <nav>
        <ul class="nav-links">

            <li>
                <a href="#" class="active">Dashboard</a>
            </li>

            <li>
                <a href="#">Analytics</a>
            </li>

            <li>
                <a href="#">Transactions</a>
            </li>

            <li>
                <a href="#">Portfolio</a>
            </li>

            <li>
                <a href="#">Settings</a>
            </li>

        </ul>
    </nav>

    <button class="profile-btn">
        VA
    </button>

</header>

<main class="hero">

    <h1>Fintech Dashboard</h1>

    <p>
        Hover over the navigation items to see the morph-glow animation.
        The active tab maintains a glowing state while hovered links smoothly
        morph into place using pure CSS.
    </p>

</main>

</body>
</html>
