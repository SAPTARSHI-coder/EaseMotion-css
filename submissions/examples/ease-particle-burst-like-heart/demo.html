<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ease Micro-Particle Heart Like Button</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="heart-body">
  <button class="heart-btn" id="hBtn">
    <span class="heart-icon">♥</span>
    <span id="hCount">124</span>
  </button>

  <script>
    const b = document.getElementById('hBtn');
    const c = document.getElementById('hCount');
    b.addEventListener('click', () => {
      b.classList.toggle('active');
      c.textContent = b.classList.contains('active') ? 125 : 124;
    });
  </script>
</body>
</html>
