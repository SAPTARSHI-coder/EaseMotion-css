<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Particle Snowfall Background Demo</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: white;
    }
    .content-box {
      background: rgba(255, 255, 255, 0.1);
      padding: 2rem 3rem;
      border-radius: 12px;
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      text-align: center;
    }
  </style>
</head>
<body>
  <!-- Ambient background element -->
  <div class="particles-bg-ag"></div>

  <!-- Foreground content to show it operates in the background -->
  <div class="content-box">
    <h1>Particle Snowfall Background</h1>
    <p>A pure CSS ambient background loop utilizing box-shadows.</p>
  </div>
</body>
</html>
