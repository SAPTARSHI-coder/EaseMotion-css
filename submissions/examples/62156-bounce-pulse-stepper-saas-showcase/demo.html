<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bounce-Pulse Stepper</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<section class="stepper-section">

    <h1>Bounce-Pulse SaaS Stepper</h1>
    <p class="subtitle">Simple onboarding workflow with animated milestones.</p>

    <div class="stepper">

        <div class="line"></div>

        <div class="step active">
            <div class="circle">1</div>
            <h3>Create Account</h3>
            <p>Register and verify email.</p>
        </div>

        <div class="step">
            <div class="circle">2</div>
            <h3>Workspace</h3>
            <p>Customize your dashboard.</p>
        </div>

        <div class="step">
            <div class="circle">3</div>
            <h3>Invite Team</h3>
            <p>Add collaborators instantly.</p>
        </div>

        <div class="step">
            <div class="circle">4</div>
            <h3>Launch</h3>
            <p>Start managing projects.</p>
        </div>

    </div>

</section>

</body>
</html>
