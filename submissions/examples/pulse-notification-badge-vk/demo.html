<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Pulse Notification Badge Demo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <h1>Animated Pulse Notification Badge</h1>
        <p class="description">
            A compact notification badge featuring an infinite CSS pulse animation,
            perfect for navigation bars, profile avatars, and messaging icons.
        </p>

        <div class="demo-card">
            <div class="notification-wrapper">
                <div class="avatar">
                    🔔
                </div>
                <span class="pulse-badge"></span>
            </div>
        </div>
    </main>

</body>
</html>
