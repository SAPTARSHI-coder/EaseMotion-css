<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marble Card · Marble Texture Swirls</title>

    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <div class="card">
        <h2>🌊 Marble Card</h2>
        <p class="sub">marble texture swirls dynamically on hover</p>

        <!-- === MARBLE CARD === -->
        <div class="marble-container" id="marbleContainer">
            <div class="marble-card">
                <div class="marble-content">
                    <i class="fas fa-gem"></i>
                    <h3>Marble</h3>
                    <p>Hover to see the marble swirl</p>
                    <span class="marble-luxury">✦ Luxury</span>
                </div>
                <div class="marble-vein v1"></div>
                <div class="marble-vein v2"></div>
                <div class="marble-vein v3"></div>
                <div class="marble-vein v4"></div>
                <div class="marble-vein v5"></div>
                <div class="marble-vein v6"></div>
                <div class="marble-shine"></div>
            </div>
        </div>

        <p style="margin-top: 2rem; font-size: 0.85rem; color: #64748b;">
            Hover · watch the marble veins swirl and flow
        </p>
    </div>

    <!-- Embedded JavaScript -->
    <script>
        (function() {
            'use strict';

            const container = document.getElementById('marbleContainer');

            // Click feedback
            container.addEventListener('click', function() {
                const card = this.querySelector('.marble-card');
                card.classList.add('click-pulse');
                setTimeout(() => {
                    card.classList.remove('click-pulse');
                }, 300);
                console.log('🌊 Marble card clicked!');
            });

            // Keyboard accessibility
            container.setAttribute('tabindex', '0');
            container.setAttribute('role', 'button');
            container.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    this.click();
                }
            });

            // Reset animation on hover
            container.addEventListener('mouseenter', function() {
                const veins = this.querySelectorAll('.marble-vein');
                veins.forEach(v => {
                    v.style.animation = 'none';
                    void v.offsetWidth;
                    v.style.animation = '';
                });
                const shine = this.querySelector('.marble-shine');
                shine.style.animation = 'none';
                void shine.offsetWidth;
                shine.style.animation = '';
            });

            console.log('🌊 Marble card initialized!');

        })();
    </script>

</body>
</html>
