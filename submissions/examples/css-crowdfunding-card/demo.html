<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Crowdfunding Card</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="crowdfunding-card">
    <div class="badge">Featured Project</div>

    <h2>Smart Eco Bottle</h2>

    <p class="description">
      A reusable smart bottle that tracks hydration and helps reduce plastic waste.
    </p>

    <div class="progress-section">
      <div class="progress-label">
        <span>$7,500 Raised</span>
        <span>75%</span>
      </div>

      <div class="progress-bar">
        <div class="progress-fill"></div>
      </div>
    </div>

    <div class="stats">
      <div>
        <h3>150</h3>
        <p>Backers</p>
      </div>

      <div>
        <h3>10</h3>
        <p>Days Left</p>
      </div>

      <div>
        <h3>$10K</h3>
        <p>Goal</p>
      </div>
    </div>

    <button class="support-btn">
      Support Project
    </button>
  </div>

</body>
</html>
