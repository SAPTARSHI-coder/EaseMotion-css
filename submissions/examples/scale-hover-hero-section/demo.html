<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CSS Scale-Hover Hero Section for Gaming Hub layouts">
  <title>Scale-Hover Gaming Hero</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main>
    <section class="hero" aria-labelledby="hero-title">
      <div class="hero-content">
        <p class="hero-label">NEXT-GEN GAMING HUB</p>

        <h1 id="hero-title">
          Level Up Your
          <span>Gaming Experience</span>
        </h1>

        <p class="hero-description">
          Discover competitive challenges, track your progress,
          and connect with a community built for gamers.
        </p>

        <div class="hero-actions">
          <a class="hero-button primary" href="#explore">
            Explore Games
          </a>

          <a class="hero-button secondary" href="#learn">
            Learn More
          </a>
        </div>
      </div>

      <div class="hero-visual" aria-hidden="true">
        <div class="visual-card">
          <div class="visual-grid"></div>

          <div class="game-symbol">✦</div>

          <div class="status status-one">
            <strong>2.4K</strong>
            <span>Players Online</span>
          </div>

          <div class="status status-two">
            <strong>98%</strong>
            <span>Match Rating</span>
          </div>
        </div>
      </div>
    </section>
  </main>

</body>
</html>
