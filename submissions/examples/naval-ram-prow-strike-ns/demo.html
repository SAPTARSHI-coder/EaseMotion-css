<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Naval Ram Prow Strike — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Naval Ram Prow Strike demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Naval Ram Prow Strike</h1>
      <p class="lede">Trireme naval ram prow strike</p>
    </header>

    <section class="ease-naval-ram-prow-strike" data-demo="naval-ram-prow-strike" aria-live="polite">
      <div class="ease-naval-ram-prow-strike__housing">
        <div class="ease-naval-ram-prow-strike__bezel">
          <div class="ease-naval-ram-prow-strike__face">
            <div class="ease-naval-ram-prow-strike__readout">
              <span class="ease-naval-ram-prow-strike__label">Naval Ram Prow Strike</span>
              <span class="ease-naval-ram-prow-strike__value">LIVE</span>
            </div>
            <div class="ease-naval-ram-prow-strike__motion" aria-hidden="true">
              <span class="ease-naval-ram-prow-strike__a"></span>
              <span class="ease-naval-ram-prow-strike__b"></span>
              <span class="ease-naval-ram-prow-strike__c"></span>
              <span class="ease-naval-ram-prow-strike__d"></span>
            </div>
            <div class="ease-naval-ram-prow-strike__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-naval-ram-prow-strike__controls">
          <button type="button" class="ease-naval-ram-prow-strike__btn primary">Engage</button>
          <button type="button" class="ease-naval-ram-prow-strike__btn">Reset</button>
          <label class="ease-naval-ram-prow-strike__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-naval-ram-prow-strike__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
