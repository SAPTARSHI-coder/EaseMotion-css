<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Datepicker: Glassmorphism Styling - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="em-demo-container">
        <!-- Pure CSS Interactive Datepicker Component Showcase -->
        <header class="em-datepicker-card" role="region" aria-label="Glassmorphism Datepicker Showcase" tabindex="0">
            <div class="em-datepicker-header-bar">
                <span class="em-card-badge">COMPONENT VARIANT</span>
                <span class="em-brand-logo">GlassDatePicker</span>
            </div>
            <h1 class="em-card-title">Interactive Datepicker</h1>
            <p class="em-card-desc">A fully responsive, zero-JS pure CSS calendar datepicker featuring frosted glassmorphism styling, smooth state transitions, and accessible focus states.</p>
            <div class="em-datepicker-wrapper">
                <div class="em-glass-datepicker" role="dialog" aria-label="Calendar Datepicker">
                    <div class="em-calendar-header">
                        <span class="em-month-label">August 2026</span>
                        <span class="em-year-label">2026</span>
                    </div>
                    <div class="em-calendar-grid">
                        <span class="em-weekday">Mo</span><span class="em-weekday">Tu</span><span class="em-weekday">We</span><span class="em-weekday">Thu</span><span class="em-weekday">Fr</span><span class="em-weekday">Sa</span><span class="em-weekday">Su</span>
                        <button class="em-day muted" tabindex="-1">27</button>
                        <button class="em-day muted" tabindex="-1">28</button>
                        <button class="em-day muted" tabindex="-1">29</button>
                        <button class="em-day muted" tabindex="-1">30</button>
                        <button class="em-day muted" tabindex="-1">31</button>
                        <button class="em-day" tabindex="0">1</button>
                        <button class="em-day" tabindex="0">2</button>
                        <button class="em-day" tabindex="0">3</button>
                        <button class="em-day" tabindex="0">4</button>
                        <button class="em-day" tabindex="0">5</button>
                        <button class="em-day" tabindex="0">6</button>
                        <button class="em-day" tabindex="0">7</button>
                        <button class="em-day" tabindex="0">8</button>
                        <button class="em-day" tabindex="0">9</button>
                        <button class="em-day" tabindex="0">10</button>
                        <button class="em-day" tabindex="0">11</button>
                        <button class="em-day" tabindex="0">12</button>
                        <button class="em-day" tabindex="0">13</button>
                        <button class="em-day selected" tabindex="0" aria-current="date">14</button>
                        <button class="em-day" tabindex="0">15</button>
                        <button class="em-day" tabindex="0">16</button>
                        <button class="em-day" tabindex="0">17</button>
                        <button class="em-day" tabindex="0">18</button>
                        <button class="em-day" tabindex="0">19</button>
                        <button class="em-day" tabindex="0">20</button>
                        <button class="em-day" tabindex="0">21</button>
                        <button class="em-day" tabindex="0">22</button>
                        <button class="em-day" tabindex="0">23</button>
                        <button class="em-day" tabindex="0">24</button>
                        <button class="em-day" tabindex="0">25</button>
                        <button class="em-day" tabindex="0">26</button>
                        <button class="em-day" tabindex="0">27</button>
                        <button class="em-day" tabindex="0">28</button>
                        <button class="em-day" tabindex="0">29</button>
                        <button class="em-day" tabindex="0">30</button>
                        <button class="em-day" tabindex="0">31</button>
                    </div>
                </div>
            </div>
        </header>
    </div>
</body>
</html>
