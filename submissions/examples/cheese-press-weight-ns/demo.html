<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cheese Press Weight — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Cheese Press Weight demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Cheese Press Weight</h1>
      <p class="lede">Cheese press screw applying weight to a curd mold</p>
    </header>

    <section class="ease-cheese-press-weight" data-demo="cheese-press-weight" aria-live="polite">
      <div class="ease-cheese-press-weight__housing">
        <div class="ease-cheese-press-weight__bezel">
          <div class="ease-cheese-press-weight__face">
            <div class="ease-cheese-press-weight__readout">
              <span class="ease-cheese-press-weight__label">Cheese Press Weight</span>
              <span class="ease-cheese-press-weight__value">LIVE</span>
            </div>
            <div class="ease-cheese-press-weight__motion" aria-hidden="true">
              <span class="ease-cheese-press-weight__a"></span>
              <span class="ease-cheese-press-weight__b"></span>
              <span class="ease-cheese-press-weight__c"></span>
              <span class="ease-cheese-press-weight__d"></span>
            </div>
            <div class="ease-cheese-press-weight__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-cheese-press-weight__controls">
          <button type="button" class="ease-cheese-press-weight__btn primary">Engage</button>
          <button type="button" class="ease-cheese-press-weight__btn">Reset</button>
          <label class="ease-cheese-press-weight__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-cheese-press-weight__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
