<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Equalizer Bar – Audio Bars React to Interaction</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrapper">
    <h1>🎛️ Equalizer Bar</h1>
    <p class="subtitle">Hover, click, or drag — watch the bars react</p>

    <div class="equalizer-container" id="equalizer">
      <!-- Bars will be injected by JS -->
    </div>

    <div class="controls">
      <button id="randomBtn" class="ctrl-btn">✨ Randomize</button>
      <button id="resetBtn" class="ctrl-btn">↺ Reset</button>
      <button id="waveBtn" class="ctrl-btn">〰️ Wave</button>
    </div>

    <div class="status" id="status">💡 Hover over the bars or click to trigger a wave</div>
  </div>

  <script>
    (function() {
      "use strict";

      const container = document.getElementById('equalizer');
      const status = document.getElementById('status');
      const randomBtn = document.getElementById('randomBtn');
      const resetBtn = document.getElementById('resetBtn');
      const waveBtn = document.getElementById('waveBtn');

      const NUM_BARS = 24;
      let bars = [];
      let animationFrame = null;
      let isWaveActive = false;
      let wavePhase = 0;

      // ----- helper: random height (20% – 100%) -----
      function randomHeight() {
        return 20 + Math.random() * 80;
      }

      // ----- build bars -----
      function buildBars(initialHeights = null) {
        container.innerHTML = '';
        bars = [];
        for (let i = 0; i < NUM_BARS; i++) {
          const bar = document.createElement('div');
          bar.className = 'bar';
          const h = initialHeights ? initialHeights[i] : randomHeight();
          bar.style.height = h + '%';
          bar.dataset.index = i;
          bar.dataset.baseHeight = h;
          container.appendChild(bar);
          bars.push(bar);
        }
        // reset wave state
        isWaveActive = false;
        if (animationFrame) {
          cancelAnimationFrame(animationFrame);
          animationFrame = null;
        }
        status.textContent = '💡 Hover over the bars or click to trigger a wave';
      }

      // ----- animate a bar (with smooth spring-like feel) -----
      function animateBar(bar, targetHeight, duration = 300) {
        const startHeight = parseFloat(bar.style.height) || 50;
        const startTime = performance.now();

        function update(time) {
          const elapsed = time - startTime;
          const progress = Math.min(elapsed / duration, 1);
          // easeOutCubic: 1 - (1-t)^3
          const eased = 1 - Math.pow(1 - progress, 3);
          const currentHeight = startHeight + (targetHeight - startHeight) * eased;
          bar.style.height = currentHeight + '%';
          if (progress < 1) {
            requestAnimationFrame(update);
          } else {
            bar.style.height = targetHeight + '%';
          }
        }
        requestAnimationFrame(update);
      }

      // ----- animate all bars to random heights -----
      function randomizeAll() {
        if (isWaveActive) {
          isWaveActive = false;
          if (animationFrame) {
            cancelAnimationFrame(animationFrame);
            animationFrame = null;
          }
        }
        bars.forEach((bar) => {
          const target = randomHeight();
          bar.dataset.baseHeight = target;
          animateBar(bar, target, 400);
        });
        status.textContent = '🎲 Randomized!';
      }

      // ----- reset to uniform height (50%) -----
      function resetAll() {
        if (isWaveActive) {
          isWaveActive = false;
          if (animationFrame) {
            cancelAnimationFrame(animationFrame);
            animationFrame = null;
          }
        }
        bars.forEach((bar) => {
          const target = 50;
          bar.dataset.baseHeight = target;
          animateBar(bar, target, 350);
        });
        status.textContent = '↺ Reset to center';
      }

      // ----- wave effect (continuous) -----
      function startWave() {
        if (isWaveActive) {
          // if already active, restart phase
          wavePhase = 0;
          return;
        }
        isWaveActive = true;
        wavePhase = 0;
        status.textContent = '〰️ Wave mode active — move your mouse over the bars!';

        // set base heights to current if not already set, or use stored
        bars.forEach((bar) => {
          const current = parseFloat(bar.style.height) || 50;
          bar.dataset.baseHeight = current;
        });

        if (animationFrame) cancelAnimationFrame(animationFrame);

        function waveLoop(timestamp) {
          if (!isWaveActive) return;
          // phase moves slowly
          wavePhase += 0.035;

          bars.forEach((bar, index) => {
            const base = parseFloat(bar.dataset.baseHeight) || 50;
            // sin wave with index offset
            const offset = Math.sin(wavePhase + index * 0.45) * 22;
            let target = Math.min(100, Math.max(8, base + offset));
            // smooth it with a small lerp to avoid jitter
            const current = parseFloat(bar.style.height) || 50;
            const smoothed = current + (target - current) * 0.25;
            bar.style.height = Math.min(100, Math.max(8, smoothed)) + '%';
          });

          animationFrame = requestAnimationFrame(waveLoop);
        }
        animationFrame = requestAnimationFrame(waveLoop);
      }

      // ----- handle click on bar: pop effect -----
      function handleBarClick(e) {
        const bar = e.currentTarget;
        // if wave is active, we still allow a click-pop, but we disable wave
        if (isWaveActive) {
          isWaveActive = false;
          if (animationFrame) {
            cancelAnimationFrame(animationFrame);
            animationFrame = null;
          }
          // store current heights as base
          bars.forEach((b) => {
            const h = parseFloat(b.style.height) || 50;
            b.dataset.baseHeight = h;
          });
        }
        // pop up then back
        const current = parseFloat(bar.style.height) || 50;
        const popTarget = Math.min(100, current + 30);
        animateBar(bar, popTarget, 150);
        setTimeout(() => {
          const base = parseFloat(bar.dataset.baseHeight) || 50;
          animateBar(bar, base, 300);
        }, 180);
        status.textContent = `👆 Bar ${bar.dataset.index + 1} popped!`;
      }

      // ----- handle hover: bar reacts with a gentle bump -----
      function handleBarHover(e) {
        const bar = e.currentTarget;
        if (isWaveActive) {
          // in wave mode, hover adds extra boost
          const current = parseFloat(bar.style.height) || 50;
          const boost = Math.min(100, current + 18);
          bar.style.height = boost + '%';
          // after a short time, let wave take over again
          setTimeout(() => {
            if (isWaveActive) {
              // re-sync to wave: we set base to current and wave will adjust
              const h = parseFloat(bar.style.height) || 50;
              bar.dataset.baseHeight = h;
            }
          }, 200);
          status.textContent = `🖱️ Hover boost on bar ${bar.dataset.index + 1}`;
          return;
        }
        // normal mode: gentle bump
        const current = parseFloat(bar.style.height) || 50;
        const bump = Math.min(100, current + 15);
        animateBar(bar, bump, 120);
        status.textContent = `🖱️ Hovering over bar ${bar.dataset.index + 1}`;
      }

      function handleBarLeave(e) {
        const bar = e.currentTarget;
        if (isWaveActive) {
          // if wave is active, we don't reset, wave will handle
          return;
        }
        const base = parseFloat(bar.dataset.baseHeight) || 50;
        animateBar(bar, base, 200);
        status.textContent = '💡 Hover over the bars or click to trigger a wave';
      }

      // ----- attach events to bars -----
      function attachEvents() {
        bars.forEach((bar) => {
          bar.addEventListener('click', handleBarClick);
          bar.addEventListener('mouseenter', handleBarHover);
          bar.addEventListener('mouseleave', handleBarLeave);
        });
      }

      // ----- init -----
      function init() {
        buildBars();
        attachEvents();

        // control buttons
        randomBtn.addEventListener('click', () => {
          if (isWaveActive) {
            isWaveActive = false;
            if (animationFrame) {
              cancelAnimationFrame(animationFrame);
              animationFrame = null;
            }
          }
          randomizeAll();
        });

        resetBtn.addEventListener('click', () => {
          if (isWaveActive) {
            isWaveActive = false;
            if (animationFrame) {
              cancelAnimationFrame(animationFrame);
              animationFrame = null;
            }
          }
          resetAll();
        });

        waveBtn.addEventListener('click', () => {
          startWave();
        });
      }

      // if DOM already loaded, init, otherwise wait
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }

    })();
  </script>
</body>
</html>
