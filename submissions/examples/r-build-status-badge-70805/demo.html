<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="CSS animated build status badges showing passing, failing, and pending states."
  >
  <title>CSS Build Status Badge</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">
    <section class="demo-card" aria-labelledby="page-title">
      <div class="intro">
        <span class="eyebrow">EaseMotion CSS</span>
        <h1 id="page-title">Build Status</h1>
        <p>
          Pure CSS status badges for CI and deployment interfaces.
        </p>
      </div>

      <div class="status-list" aria-label="Build status examples">

        <article class="status-row">
          <div class="status-icon status-success" aria-hidden="true">
            <span></span>
          </div>

          <div class="status-info">
            <h2>Production Build</h2>
            <p>All checks completed successfully</p>
          </div>

          <span
            class="status-badge badge-success"
            role="status"
            aria-label="Build status: passing"
          >
            <span class="dot"></span>
            Passing
          </span>
        </article>

        <article class="status-row">
          <div class="status-icon status-failed" aria-hidden="true">
            <span></span>
          </div>

          <div class="status-info">
            <h2>Test Pipeline</h2>
            <p>One or more checks require attention</p>
          </div>

          <span
            class="status-badge badge-failed"
            role="status"
            aria-label="Build status: failing"
          >
            <span class="dot"></span>
            Failing
          </span>
        </article>

        <article class="status-row">
          <div class="status-icon status-pending" aria-hidden="true">
            <span></span>
          </div>

          <div class="status-info">
            <h2>Deployment</h2>
            <p>Build is waiting for available resources</p>
          </div>

          <span
            class="status-badge badge-pending"
            role="status"
            aria-label="Build status: pending"
          >
            <span class="dot"></span>
            Pending
          </span>
        </article>

      </div>

      <div class="legend" aria-label="Status legend">
        <span>
          <i class="legend-dot success"></i>
          Passing
        </span>

        <span>
          <i class="legend-dot failed"></i>
          Failing
        </span>

        <span>
          <i class="legend-dot pending"></i>
          Pending
        </span>
      </div>
    </section>
  </main>

</body>
</html>
