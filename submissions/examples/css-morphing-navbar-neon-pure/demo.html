<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Morphing Navbar: Neon</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Dummy page content -->
    <div class="page-content">
        <h1 class="page-title">NEON GRID</h1>
        <p>Click the neon hamburger menu to trigger the morphing navigation.</p>
    </div>

    <!-- The Morphing Navbar -->
    <nav class="neon-navbar">
        
        <!-- Branding -->
        <div class="nav-brand">
            <span class="brand-text">CYBER_SYS</span>
        </div>
        
        <!-- The Checkbox Hack Trigger -->
        <input type="checkbox" id="nav-toggle" class="nav-toggle-input">
        
        <!-- The Hamburger Icon that morphs into an X -->
        <label for="nav-toggle" class="nav-toggle-label" aria-label="Toggle Navigation">
            <span class="hamburger-line top-line"></span>
            <span class="hamburger-line mid-line"></span>
            <span class="hamburger-line bot-line"></span>
        </label>
        
        <!-- The Navigation Menu -->
        <ul class="nav-menu">
            <li class="nav-item"><a href="#" class="nav-link" style="--i: 1;">[ HOME ]</a></li>
            <li class="nav-item"><a href="#" class="nav-link" style="--i: 2;">[ DATABANKS ]</a></li>
            <li class="nav-item"><a href="#" class="nav-link" style="--i: 3;">[ UPLINK ]</a></li>
            <li class="nav-item"><a href="#" class="nav-link" style="--i: 4;">[ SYSTEM ]</a></li>
        </ul>
        
    </nav>

</body>
</html>
