<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Shimmer-Sweep Dropdown</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>Account Settings</h1>
            <p>Minimalist tech interface</p>
        </header>
        
        <div class="dropdown-wrapper">
            <button class="dropdown-btn">
                <span>Manage Profile</span>
                <svg class="chevron" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M6 9l6 6 6-6"/>
                </svg>
            </button>
            
            <ul class="dropdown-menu">
                <li class="dropdown-item shimmer-sweep">
                    <a href="#">
                        <span class="icon">👤</span> My Account
                    </a>
                </li>
                <li class="dropdown-item shimmer-sweep">
                    <a href="#">
                        <span class="icon">⚙️</span> Preferences
                    </a>
                </li>
                <li class="dropdown-item shimmer-sweep">
                    <a href="#">
                        <span class="icon">🛡️</span> Security
                    </a>
                </li>
                <li class="dropdown-divider"></li>
                <li class="dropdown-item shimmer-sweep logout">
                    <a href="#">
                        <span class="icon">🚪</span> Sign Out
                    </a>
                </li>
            </ul>
        </div>
    </div>
</body>
</html>
