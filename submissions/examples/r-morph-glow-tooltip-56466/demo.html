<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Morph-Glow Tooltip</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<section class="tooltip-section">

<h1>Gaming Hub Tooltips</h1>

<div class="tooltip-grid">

<div class="tooltip-item">
<button class="tooltip-btn">🗡️ Legendary Sword</button>
<span class="tooltip">Deals massive critical damage with a glowing enchanted blade.</span>
</div>

<div class="tooltip-item">
<button class="tooltip-btn">🛡️ Guardian Shield</button>
<span class="tooltip">Blocks incoming attacks and grants temporary immunity.</span>
</div>

<div class="tooltip-item">
<button class="tooltip-btn">💎 Epic Crystal</button>
<span class="tooltip">Collect crystals to unlock exclusive premium rewards.</span>
</div>

<div class="tooltip-item">
<button class="tooltip-btn">⚡ Ultimate Skill</button>
<span class="tooltip">Recharge faster and unleash devastating combo attacks.</span>
</div>

</div>

</section>

</body>
</html>
