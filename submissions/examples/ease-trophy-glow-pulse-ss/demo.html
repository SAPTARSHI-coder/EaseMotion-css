<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trophy Glow Pulse Component - Play Category</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="ease-trophy-stage" aria-labelledby="stage-title">
    <div style="text-align: center;">
      <h1 id="stage-title" class="ease-trophy-title">Victory Achieved!</h1>
      <p class="ease-trophy-desc">You successfully claimed the grand prize and unlocked Tier 1 rewards.</p>
    </div>

    <!-- Trophy Component -->
    <div class="ease-trophy-container" id="trophy-box" role="img" aria-label="Golden Trophy with Glow Pulse">
      <span class="ease-trophy-icon" aria-hidden="true">🏆</span>
    </div>

    <button type="button" class="ease-btn-celebrate" id="replay-btn">Celebrate Again</button>
  </main>

  <script>
    const box = document.getElementById('trophy-box');
    const replayBtn = document.getElementById('replay-btn');

    replayBtn.addEventListener('click', () => {
      box.classList.remove('is-animating');
      void box.offsetWidth; // Trigger DOM reflow
      box.classList.add('is-animating');
    });
  </script>
</body>
</html>
