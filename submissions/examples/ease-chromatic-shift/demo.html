<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chromatic Shift – Colors Cycle Through Spectrum on Hover</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <h1>🌈 Chromatic Shift</h1>
    <p class="subtitle">Colors cycle through the spectrum on hover</p>

    <div class="chromatic-container">
      <div class="chromatic-card" id="chromaticCard">
        <div class="card-content">
          <div class="icon-container">
            <span class="main-icon">🌈</span>
          </div>
          <h2 class="card-title">Chromatic</h2>
          <p class="card-subtitle">Hover to shift colors</p>
          <div class="card-hint">✨ Hover me</div>
        </div>
        <div class="chromatic-overlay" id="chromaticOverlay"></div>
        <div class="chromatic-glow" id="chromaticGlow"></div>
      </div>
      
      <!-- Info overlay -->
      <div class="info-overlay">
        <span class="chromatic-status" id="chromaticStatus">🌈 Idle</span>
        <span class="hue-display" id="hueDisplay">Hue: 0°</span>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <button class="ctrl-btn play" id="playBtn">▶ Auto</button>
      <button class="ctrl-btn pause" id="pauseBtn">⏸ Pause</button>
      <button class="ctrl-btn reset" id="resetBtn">↺ Reset</button>
      <button class="ctrl-btn speed" id="speedBtn">⚡ Speed</button>
    </div>

    <!-- Sliders -->
    <div class="slider-container">
      <span class="slider-label">Shift Speed</span>
      <input type="range" id="speedSlider" min="1" max="20" value="5" />
      <span class="slider-value" id="speedValue">5×</span>
    </div>

    <div class="slider-container">
      <span class="slider-label">Saturation</span>
      <input type="range" id="saturationSlider" min="0" max="100" value="80" />
      <span class="slider-value" id="saturationValue">80%</span>
    </div>

    <div class="slider-container">
      <span class="slider-label">Lightness</span>
      <input type="range" id="lightnessSlider" min="20" max="80" value="50" />
      <span class="slider-value" id="lightnessValue">50%</span>
    </div>

    <!-- Status -->
    <div class="status" id="status">🌈 Hover over the card to see chromatic shift</div>

    <!-- Keyboard shortcuts -->
    <div class="shortcuts">
      <kbd>Hover</kbd> Shift colors · <kbd>Space</kbd> Toggle auto · <kbd>R</kbd> Reset
    </div>
  </div>

  <script>
    (function() {
      "use strict";

      // DOM elements
      const chromaticCard = document.getElementById('chromaticCard');
      const chromaticOverlay = document.getElementById('chromaticOverlay');
      const chromaticGlow = document.getElementById('chromaticGlow');
      const chromaticStatus = document.getElementById('chromaticStatus');
      const hueDisplay = document.getElementById('hueDisplay');
      const playBtn = document.getElementById('playBtn');
      const pauseBtn = document.getElementById('pauseBtn');
      const resetBtn = document.getElementById('resetBtn');
      const speedBtn = document.getElementById('speedBtn');
      const status = document.getElementById('status');
      const speedSlider = document.getElementById('speedSlider');
      const speedValue = document.getElementById('speedValue');
      const saturationSlider = document.getElementById('saturationSlider');
      const saturationValue = document.getElementById('saturationValue');
      const lightnessSlider = document.getElementById('lightnessSlider');
      const lightnessValue = document.getElementById('lightnessValue');

      // State
      let hue = 0;
      let targetHue = 0;
      let isHovering = false;
      let isAuto = false;
      let isPaused = false;
      let animationId = null;
      let time = 0;
      let speedMultiplier = 1;

      // ----- Update chromatic effect -----
      function updateChromatic() {
        const saturation = parseInt(saturationSlider.value);
        const lightness = parseInt(lightnessSlider.value);
        const speed = parseInt(speedSlider.value) / 5;

        // Smooth hue interpolation
        const diff = targetHue - hue;
        if (Math.abs(diff) > 0.1) {
          hue += diff * 0.05 * speed;
        } else {
          hue = targetHue;
        }

        // Normalize hue
        if (hue >= 360) hue -= 360;
        if (hue < 0) hue += 360;

        // Apply chromatic shift to card
        const hue1 = hue;
        const hue2 = (hue + 30) % 360;
        const hue3 = (hue + 60) % 360;
        const hue4 = (hue + 120) % 360;
        const hue5 = (hue + 240) % 360;

        // Main card gradient
        const gradient = `linear-gradient(135deg, 
          hsl(${hue1}, ${saturation}%, ${lightness + 15}%), 
          hsl(${hue2}, ${saturation + 10}%, ${lightness}%), 
          hsl(${hue3}, ${saturation}%, ${lightness - 10}%), 
          hsl(${hue4}, ${saturation - 10}%, ${lightness + 5}%), 
          hsl(${hue5}, ${saturation + 5}%, ${lightness - 5}%)
        )`;
        chromaticCard.style.background = gradient;

        // Overlay with subtle pattern
        const overlayGradient = `linear-gradient(135deg, 
          rgba(255,255,255,0.05) 0%, 
          rgba(255,255,255,0) 50%, 
          rgba(255,255,255,0.05) 100%
        )`;
        chromaticOverlay.style.background = overlayGradient;

        // Glow effect
        const glowColor = `hsla(${hue}, 100%, 70%, 0.15)`;
        chromaticGlow.style.background = `radial-gradient(circle at 50% 50%, ${glowColor}, transparent 70%)`;
        chromaticGlow.style.boxShadow = `0 0 60px ${glowColor}`;

        // Update display
        hueDisplay.textContent = `Hue: ${Math.round(hue)}°`;
        
        // Update status based on state
        if (isHovering) {
          chromaticStatus.textContent = '🌈 Shifting';
          status.textContent = `🌈 Chromatic shift active — ${Math.round(hue)}°`;
        } else if (isAuto) {
          chromaticStatus.textContent = '🔄 Auto';
          status.textContent = `🔄 Auto-cycling — ${Math.round(hue)}°`;
        } else {
          chromaticStatus.textContent = '🌈 Idle';
          status.textContent = '🌈 Hover over the card to see chromatic shift';
        }
      }

      // ----- Animation loop -----
      function animate() {
        time += 0.016;

        if (!isPaused) {
          if (isAuto) {
            // Auto-rotate hue
            const speed = parseInt(speedSlider.value) / 5;
            targetHue = (targetHue + 0.3 * speed) % 360;
          }
          updateChromatic();
        }

        animationId = requestAnimationFrame(animate);
      }

      // ----- Start animation -----
      function startAnimation() {
        if (animationId) {
          cancelAnimationFrame(animationId);
        }
        animate();
      }

      // ----- Set target hue -----
      function setHue(value) {
        targetHue = ((value % 360) + 360) % 360;
      }

      // ----- Toggle auto -----
      function toggleAuto() {
        isAuto = !isAuto;
        playBtn.textContent = isAuto ? '⏹ Stop' : '▶ Auto';
        playBtn.classList.toggle('active', isAuto);
        if (isAuto) {
          status.textContent = '🔄 Auto-cycling enabled';
          chromaticStatus.textContent = '🔄 Auto';
        } else {
          chromaticStatus.textContent = '🌈 Idle';
          // If not hovering, reset to idle
          if (!isHovering) {
            setHue(0);
          }
        }
      }

      // ----- Toggle pause -----
      function togglePause() {
        isPaused = !isPaused;
        pauseBtn.textContent = isPaused ? '▶ Resume' : '⏸ Pause';
        status.textContent = isPaused ? '⏸ Paused' : '▶ Resumed';
        chromaticStatus.textContent = isPaused ? '⏸ Paused' : (isAuto ? '🔄 Auto' : '🌈 Idle');
      }

      // ----- Reset -----
      function resetChromatic() {
        hue = 0;
        targetHue = 0;
        isAuto = false;
        isPaused = false;
        isHovering = false;
        playBtn.textContent = '▶ Auto';
        playBtn.classList.remove('active');
        pauseBtn.textContent = '⏸ Pause';
        speedSlider.value = 5;
        speedValue.textContent = '5×';
        saturationSlider.value = 80;
        saturationValue.textContent = '80%';
        lightnessSlider.value = 50;
        lightnessValue.textContent = '50%';
        chromaticStatus.textContent = '🌈 Idle';
        status.textContent = '↺ Reset';
        updateChromatic();
        setTimeout(() => {
          status.textContent = '🌈 Hover over the card to see chromatic shift';
        }, 500);
      }

      // ----- Toggle speed -----
      function toggleSpeed() {
        const speeds = [1, 2, 3, 5, 10];
        const current = parseInt(speedSlider.value);
        let nextIndex = speeds.indexOf(current) + 1;
        if (nextIndex >= speeds.length) nextIndex = 0;
        const newSpeed = speeds[nextIndex];
        speedSlider.value = newSpeed;
        speedValue.textContent = newSpeed + '×';
        status.textContent = `⚡ Speed: ${newSpeed}×`;
      }

      // ----- Event Listeners -----
      // Hover effects
      chromaticCard.addEventListener('mouseenter', () => {
        isHovering = true;
        if (!isAuto && !isPaused) {
          chromaticStatus.textContent = '🌈 Shifting';
          status.textContent = '🌈 Chromatic shift active';
        }
        // Start shifting from current position
        if (!isAuto) {
          const randomHue = Math.random() * 360;
          setHue(randomHue);
        }
      });

      chromaticCard.addEventListener('mouseleave', () => {
        isHovering = false;
        if (!isAuto) {
          chromaticStatus.textContent = '🌈 Idle';
          status.textContent = '🌈 Hover over the card to see chromatic shift';
          // Gradually return to 0
          setHue(0);
        }
      });

      // Buttons
      playBtn.addEventListener('click', toggleAuto);
      pauseBtn.addEventListener('click', togglePause);
      resetBtn.addEventListener('click', resetChromatic);
      speedBtn.addEventListener('click', toggleSpeed);

      // Sliders
      speedSlider.addEventListener('input', (e) => {
        speedValue.textContent = e.target.value + '×';
      });

      saturationSlider.addEventListener('input', (e) => {
        saturationValue.textContent = e.target.value + '%';
        updateChromatic();
      });

      lightnessSlider.addEventListener('input', (e) => {
        lightnessValue.textContent = e.target.value + '%';
        updateChromatic();
      });

      // Keyboard shortcuts
      document.addEventListener('keydown', (e) => {
        if (e.key === ' ' || e.key === 'Space') {
          e.preventDefault();
          toggleAuto();
        }
        if (e.key === 'p' || e.key === 'P') {
          e.preventDefault();
          togglePause();
        }
        if (e.key === 'r' || e.key === 'R') {
          e.preventDefault();
          resetChromatic();
        }
      });

      // ----- Resize handler -----
      let resizeTimeout;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(() => {
          // Just reflow
        }, 200);
      });

      // ----- Init -----
      function init() {
        setHue(0);
        updateChromatic();
        startAnimation();
        status.textContent = '🌈 Hover over the card to see chromatic shift!';
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }

    })();
  </script>
</body>
</html>
