<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compare Table Hover Highlight</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <h1>Pricing Comparison</h1>

  <div class="table-wrapper">
    <table>
      <thead>
        <tr>
          <th>Features</th>
          <th class="col">Basic</th>
          <th class="col">Pro</th>
          <th class="col">Enterprise</th>
        </tr>
      </thead>

      <tbody>
        <tr>
          <td>Users</td>
          <td class="col">5</td>
          <td class="col">25</td>
          <td class="col">Unlimited</td>
        </tr>

        <tr>
          <td>Storage</td>
          <td class="col">10 GB</td>
          <td class="col">100 GB</td>
          <td class="col">1 TB</td>
        </tr>

        <tr>
          <td>Support</td>
          <td class="col">Email</td>
          <td class="col">Priority</td>
          <td class="col">24/7</td>
        </tr>

        <tr>
          <td>Analytics</td>
          <td class="col">❌</td>
          <td class="col">✅</td>
          <td class="col">✅</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

</body>
</html>
