<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bounce-Pulse Progress Bars | EaseMotion CSS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="background-grid"></div>

<section class="hero">

    <h1 class="title">Bounce-Pulse Progress Bars</h1>

    <p class="subtitle">
        Modern SaaS showcase progress indicators built using pure HTML & CSS with smooth bounce animations.
    </p>

    <div class="progress-wrapper">

        <div class="progress-card">

            <div class="progress-header">
                <span>Cloud Storage</span>
                <span>92%</span>
            </div>

            <div class="progress-bar">
                <div class="progress-fill fill92">
                    <span class="pulse-dot"></span>
                </div>
            </div>

        </div>

        <div class="progress-card">

            <div class="progress-header">
                <span>AI Training</span>
                <span>78%</span>
            </div>

            <div class="progress-bar">
                <div class="progress-fill fill78">
                    <span class="pulse-dot"></span>
                </div>
            </div>

        </div>

        <div class="progress-card">

            <div class="progress-header">
                <span>Security Scan</span>
                <span>64%</span>
            </div>

            <div class="progress-bar">
                <div class="progress-fill fill64">
                    <span class="pulse-dot"></span>
                </div>
            </div>

        </div>

        <div class="progress-card">

            <div class="progress-header">
                <span>Analytics</span>
                <span>49%</span>
            </div>

            <div class="progress-bar">
                <div class="progress-fill fill49">
                    <span class="pulse-dot"></span>
                </div>
            </div>

        </div>

        <div class="progress-card">

            <div class="progress-header">
                <span>Deployment</span>
                <span>100%</span>
            </div>

            <div class="progress-bar">
                <div class="progress-fill fill100">
                    <span class="pulse-dot"></span>
                </div>
            </div>

        </div>

    </div>

</section>

</body>
</html>
