<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Biometric DNA Double Helix Loader | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
  <main class="dna-container">
    <header class="dna-header">
      <span class="dna-badge">GENOMIC SYNTHESIS</span>
      <h1 class="dna-title">DNA HELIX LOADER</h1>
      <p class="dna-subtitle">3D Rotational Double Helix with Sine-Wave Node Scaling and Depth Modulation</p>
    </header>

    <section class="helix-stage">
      <div class="dna-card">
        <!-- 3D DNA Helix Structure -->
        <div class="helix-wrapper">
          <div class="strand strand-left">
            <span class="node" style="--i: 0;"></span>
            <span class="node" style="--i: 1;"></span>
            <span class="node" style="--i: 2;"></span>
            <span class="node" style="--i: 3;"></span>
            <span class="node" style="--i: 4;"></span>
            <span class="node" style="--i: 5;"></span>
            <span class="node" style="--i: 6;"></span>
            <span class="node" style="--i: 7;"></span>
            <span class="node" style="--i: 8;"></span>
            <span class="node" style="--i: 9;"></span>
          </div>

          <div class="helix-connectors">
            <span class="base-pair" style="--i: 0;"></span>
            <span class="base-pair" style="--i: 1;"></span>
            <span class="base-pair" style="--i: 2;"></span>
            <span class="base-pair" style="--i: 3;"></span>
            <span class="base-pair" style="--i: 4;"></span>
            <span class="base-pair" style="--i: 5;"></span>
            <span class="base-pair" style="--i: 6;"></span>
            <span class="base-pair" style="--i: 7;"></span>
            <span class="base-pair" style="--i: 8;"></span>
            <span class="base-pair" style="--i: 9;"></span>
          </div>

          <div class="strand strand-right">
            <span class="node" style="--i: 0;"></span>
            <span class="node" style="--i: 1;"></span>
            <span class="node" style="--i: 2;"></span>
            <span class="node" style="--i: 3;"></span>
            <span class="node" style="--i: 4;"></span>
            <span class="node" style="--i: 5;"></span>
            <span class="node" style="--i: 6;"></span>
            <span class="node" style="--i: 7;"></span>
            <span class="node" style="--i: 8;"></span>
            <span class="node" style="--i: 9;"></span>
          </div>
        </div>

        <div class="dna-telemetry">
          <div class="tel-item"><span class="label">GENOME ID:</span> <span class="val">#HG-9021</span></div>
          <div class="tel-item"><span class="label">ALIGNMENT:</span> <span class="val">99.8%</span></div>
        </div>
      </div>
    </section>

    <footer class="dna-footer">
      <p>Built for EaseMotion CSS Library • 60FPS Pure CSS Keyframe Engine</p>
    </footer>
  </main>
</body>
</html>
