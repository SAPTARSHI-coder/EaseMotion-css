<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EaseMotion — Skeleton Loading</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="demo-shell">
        <header class="demo-header">
            <span class="eyebrow">EaseMotion CSS</span>
            <h1>Skeleton Loading</h1>
            <p>
                Lightweight shimmer placeholders for interfaces while content is loading.
            </p>
        </header>

        <section class="preview-card" aria-label="Skeleton loading preview">
            <div class="profile-skeleton">
                <div class="em-skeleton em-skeleton-avatar" aria-hidden="true"></div>

                <div class="profile-copy">
                    <div class="em-skeleton em-skeleton-title" aria-hidden="true"></div>
                    <div class="em-skeleton em-skeleton-text" aria-hidden="true"></div>
                    <div class="em-skeleton em-skeleton-text em-skeleton-text-short" aria-hidden="true"></div>
                </div>
            </div>

            <div class="em-skeleton em-skeleton-banner" aria-hidden="true"></div>

            <div class="content-lines" aria-hidden="true">
                <div class="em-skeleton em-skeleton-line"></div>
                <div class="em-skeleton em-skeleton-line"></div>
                <div class="em-skeleton em-skeleton-line em-skeleton-line-short"></div>
            </div>
        </section>

        <section class="preview-card compact" aria-label="Pulse skeleton preview">
            <div class="section-label">Pulse variant</div>

            <div class="pulse-grid" aria-hidden="true">
                <div class="pulse-item">
                    <div class="em-skeleton-pulse em-skeleton-pulse-image"></div>
                    <div class="em-skeleton-pulse em-skeleton-pulse-line"></div>
                    <div class="em-skeleton-pulse em-skeleton-pulse-line short"></div>
                </div>

                <div class="pulse-item">
                    <div class="em-skeleton-pulse em-skeleton-pulse-image"></div>
                    <div class="em-skeleton-pulse em-skeleton-pulse-line"></div>
                    <div class="em-skeleton-pulse em-skeleton-pulse-line short"></div>
                </div>

                <div class="pulse-item">
                    <div class="em-skeleton-pulse em-skeleton-pulse-image"></div>
                    <div class="em-skeleton-pulse em-skeleton-pulse-line"></div>
                    <div class="em-skeleton-pulse em-skeleton-pulse-line short"></div>
                </div>
            </div>
        </section>
    </main>
</body>

</html>
