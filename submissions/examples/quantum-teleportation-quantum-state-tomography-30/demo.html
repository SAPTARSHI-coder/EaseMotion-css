<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum State Tomography - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css"></head><body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030712; color: #ffffff;">

    <div class="ease-card ease-card-glass qtom-container">
        <div class="qtom-header">
            <h2>State Tomography</h2>
            <span class="ease-badge ease-badge-secondary">Reconstructing</span>
        </div>
        
        <div class="qtom-screen ease-center">
            <div class="qtom-flux flux-qtom-a"></div>
            <div class="qtom-flux flux-qtom-b"></div>
            <div class="qtom-boundary-ring"></div>
            <div class="qtom-core ease-center"></div>
        </div>

        <div class="qtom-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Density Matrix &rho; Reconstruction</span>
            <button class="ease-btn ease-btn-secondary ease-btn-sm ease-hover-grow">Reconstruct State</button>
        </div>
    </div></body></html>
