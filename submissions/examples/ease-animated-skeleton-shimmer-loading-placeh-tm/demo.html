<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animated Skeleton Shimmer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="skel-container">

    <h2 style="font-size:1.125rem;margin-bottom:0.5rem;">Shimmer Skeletons</h2>

    <div class="skel-text-group">
      <span class="skel lg"></span>
      <span class="skel md"></span>
      <span class="skel sm"></span>
    </div>

    <h2 style="font-size:1.125rem;margin:1.5rem 0 0.5rem;">Pulse Skeletons</h2>

    <div class="skel-text-group">
      <span class="skel-pulse lg"></span>
      <span class="skel-pulse md"></span>
      <span class="skel-pulse sm"></span>
    </div>

    <h2 style="font-size:1.125rem;margin:1.5rem 0 0.5rem;">Wave Skeletons</h2>

    <div class="skel-wave-wrap">
      <span class="skel-wave lg"></span>
    </div>

    <h2 style="font-size:1.125rem;margin:1.5rem 0 0.5rem;">Card Skeleton</h2>

    <div class="skel-card">
      <div class="skel-card-header">
        <div class="skel-avatar"></div>
        <div style="flex:1">
          <span class="skel lg" style="width:140px;display:block;margin-bottom:6px;"></span>
          <span class="skel sm" style="width:90px;display:block;"></span>
        </div>
      </div>
      <div class="skel-card-body">
        <span class="skel md"></span>
        <span class="skel sm" style="width:75%;"></span>
        <span class="skel sm" style="width:60%;"></span>
      </div>
      <div class="skel-card-footer">
        <span class="skel sm round" style="width:32px;height:32px;"></span>
        <span class="skel sm round" style="width:32px;height:32px;"></span>
        <span class="skel sm round" style="width:32px;height:32px;"></span>
      </div>
    </div>

    <h2 style="font-size:1.125rem;margin:1.5rem 0 0.5rem;">Image Skeleton</h2>

    <div class="skel-image"></div>

    <h2 style="font-size:1.125rem;margin:1.5rem 0 0.5rem;">Button Skeletons</h2>

    <div style="display:flex;gap:0.75rem;flex-wrap:wrap;align-items:center;">
      <div class="skel-btn sm"></div>
      <div class="skel-btn md"></div>
      <div class="skel-btn lg"></div>
    </div>

    <h2 style="font-size:1.125rem;margin:1.5rem 0 0.5rem;">Color Variants</h2>

    <div style="display:flex;flex-direction:column;gap:0.5rem;">
      <span class="skel md dark"></span>
      <span class="skel md light"></span>
      <span class="skel md purple"></span>
    </div>

  </div>

</body>
</html>
