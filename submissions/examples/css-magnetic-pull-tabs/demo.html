<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Magnetic Pull Tabs</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="catalog">

        <header class="hero">

            <h1>
                Magnetic Pull Tabs
            </h1>

            <p>
                A pure CSS animated tab component for modern product catalog layouts.
            </p>

        </header>


        <section class="tabs" aria-label="Product Categories">

            <button class="tab active">
                <span class="icon">🛒</span>
                Electronics
            </button>


            <button class="tab">
                <span class="icon">👕</span>
                Fashion
            </button>


            <button class="tab">
                <span class="icon">🏠</span>
                Home
            </button>


            <button class="tab">
                <span class="icon">🎮</span>
                Gaming
            </button>


            <button class="tab">
                <span class="icon">📱</span>
                Accessories
            </button>

        </section>



        <section class="products">

            <article class="product-card">

                <div class="product-image">
                    💻
                </div>

                <h2>
                    Smart Laptop
                </h2>

                <p>
                    Powerful performance with modern design.
                </p>

                <span>
                    $999
                </span>

            </article>



            <article class="product-card">

                <div class="product-image">
                    🎧
                </div>

                <h2>
                    Wireless Headphones
                </h2>

                <p>
                    Premium sound experience.
                </p>

                <span>
                    $199
                </span>

            </article>



            <article class="product-card">

                <div class="product-image">
                    ⌚
                </div>

                <h2>
                    Smart Watch
                </h2>

                <p>
                    Track your daily activities.
                </p>

                <span>
                    $299
                </span>

            </article>


        </section>


    </main>


</body>

</html>
