<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Pure CSS cyberpunk neon particle effect"
  >
  <title>CSS Cyberpunk Neon Particle</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="cyber-scene" aria-label="Cyberpunk neon particle animation">

    <div class="scanlines" aria-hidden="true"></div>

    <div class="particles" aria-hidden="true">
      <span class="particle particle-1"></span>
      <span class="particle particle-2"></span>
      <span class="particle particle-3"></span>
      <span class="particle particle-4"></span>
      <span class="particle particle-5"></span>
      <span class="particle particle-6"></span>
      <span class="particle particle-7"></span>
      <span class="particle particle-8"></span>
      <span class="particle particle-9"></span>
      <span class="particle particle-10"></span>
      <span class="particle particle-11"></span>
      <span class="particle particle-12"></span>
    </div>

    <div class="neon-ring ring-one" aria-hidden="true"></div>
    <div class="neon-ring ring-two" aria-hidden="true"></div>

    <section class="content">
      <p class="eyebrow">Pure CSS Particle Effect</p>

      <h1>
        Cyberpunk
        <span>Neon</span>
      </h1>

      <p class="description">
        A futuristic neon particle environment created entirely with
        HTML and vanilla CSS.
      </p>

      <div class="status">
        <span class="status-dot"></span>
        SYSTEM ONLINE
      </div>
    </section>

  </main>
</body>
</html>
