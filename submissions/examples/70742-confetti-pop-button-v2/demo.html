<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Confetti Pop Button v2</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <main class="container">
    <h1>CSS Confetti Pop Button v2</h1>

    <div class="button-wrapper">
      <button class="confetti-btn" aria-label="Celebrate button">
        Celebrate 🎉
      </button>

      <span class="confetti shape-1"></span>
      <span class="confetti shape-2"></span>
      <span class="confetti shape-3"></span>
      <span class="confetti shape-4"></span>
      <span class="confetti shape-5"></span>
      <span class="confetti shape-6"></span>
      <span class="confetti shape-7"></span>
      <span class="confetti shape-8"></span>
    </div>

  </main>

</body>
</html>
