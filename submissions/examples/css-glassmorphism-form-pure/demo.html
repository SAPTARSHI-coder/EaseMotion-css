<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Glassmorphism Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 
      [TECHNIQUE] The Colorful Background 
      Glassmorphism requires a visually rich background behind it 
      so the backdrop-filter blur is actually visible. 
    -->
    <div class="glass-bg">
        <div class="bg-shape shape-1"></div>
        <div class="bg-shape shape-2"></div>
        
        <div class="layout-container">
            
            <header class="section-header glass-header">
                <h1 class="title">Pure CSS Glassmorphism Form</h1>
                <p class="subtitle">A stunning frosted glass aesthetic using CSS <code>backdrop-filter</code>, translucent backgrounds, and crisp inner shadow edge lighting.</p>
            </header>

            <div class="demo-area">
                
                <!-- 
                  [TECHNIQUE] The Glass Container 
                  This applies the main blur and white/light borders.
                -->
                <div class="glass-form-container">
                    
                    <form class="glass-form" action="#" method="POST" aria-label="Login Form">
                        <h2>Welcome Back</h2>
                        <p class="form-desc">Sign in to your account</p>
                        
                        <div class="form-group">
                            <label for="email">Email</label>
                            <!-- The Inputs are also frosted glass! -->
                            <input type="email" id="email" name="email" class="glass-input" placeholder="jane@example.com" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="password">Password</label>
                            <input type="password" id="password" name="password" class="glass-input" placeholder="••••••••" required>
                        </div>
                        
                        <div class="form-group options">
                            <label class="glass-checkbox-label">
                                <input type="checkbox" name="remember" class="glass-checkbox">
                                <span>Remember me</span>
                            </label>
                            <a href="#" class="glass-link">Forgot password?</a>
                        </div>
                        
                        <button type="submit" class="glass-btn">
                            Sign In
                        </button>
                        
                    </form>
                    
                </div>
                
            </div>
            
        </div>
    </div>

</body>
</html>
