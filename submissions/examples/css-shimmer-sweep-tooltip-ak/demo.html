<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Shimmer-Sweep Tooltip</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<section class="gaming-hub">

    <header class="hero">

        <h1>Gaming Hub Tooltips</h1>

        <p>
            Hover over each action to reveal animated gaming-themed tooltips with a shimmer sweep effect.
        </p>

    </header>

    <div class="tooltip-grid">

        <div class="tooltip top">

            <button class="action-btn">🎮 Play</button>

            <span class="tooltip-box">
                Launch your favorite game instantly.
            </span>

        </div>

        <div class="tooltip right">

            <button class="action-btn">🏆 Tournaments</button>

            <span class="tooltip-box">
                View upcoming esports competitions.
            </span>

        </div>

        <div class="tooltip bottom">

            <button class="action-btn">🎁 Rewards</button>

            <span class="tooltip-box">
                Claim exclusive seasonal rewards.
            </span>

        </div>

        <div class="tooltip left">

            <button class="action-btn">⚡ Missions</button>

            <span class="tooltip-box">
                Complete challenges to earn bonus XP.
            </span>

        </div>

    </div>

</section>

</body>

</html>
