<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leyden Jar Spark — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Leyden Jar Spark demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Leyden Jar Spark</h1>
      <p class="lede">Leyden jar charging then discharging a bright spark</p>
    </header>

    <section class="ease-leyden-jar-spark" data-demo="leyden-jar-spark" aria-live="polite">
      <div class="ease-leyden-jar-spark__housing">
        <div class="ease-leyden-jar-spark__bezel">
          <div class="ease-leyden-jar-spark__face">
            <div class="ease-leyden-jar-spark__readout">
              <span class="ease-leyden-jar-spark__label">Leyden Jar Spark</span>
              <span class="ease-leyden-jar-spark__value">LIVE</span>
            </div>
            <div class="ease-leyden-jar-spark__motion" aria-hidden="true">
              <span class="ease-leyden-jar-spark__a"></span>
              <span class="ease-leyden-jar-spark__b"></span>
              <span class="ease-leyden-jar-spark__c"></span>
              <span class="ease-leyden-jar-spark__d"></span>
            </div>
            <div class="ease-leyden-jar-spark__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-leyden-jar-spark__controls">
          <button type="button" class="ease-leyden-jar-spark__btn primary">Engage</button>
          <button type="button" class="ease-leyden-jar-spark__btn">Reset</button>
          <label class="ease-leyden-jar-spark__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-leyden-jar-spark__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
