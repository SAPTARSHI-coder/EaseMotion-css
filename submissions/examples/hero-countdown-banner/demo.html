<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CSS hero countdown banner with animated timer digits">
  <title>Hero Countdown Banner — EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <section class="hcb-banner" role="banner">
    <div class="hcb-banner__inner">
      <p class="hcb-banner__tag">Limited Time Offer</p>
      <h1 class="hcb-banner__title">Launch week ends soon</h1>
      <p class="hcb-banner__sub">Don't miss 50% off all annual plans.</p>

      <div class="hcb-timer" aria-label="Countdown timer">
        <div class="hcb-timer__block">
          <span class="hcb-timer__num">02</span>
          <span class="hcb-timer__lbl">Days</span>
        </div>
        <span class="hcb-timer__sep">:</span>
        <div class="hcb-timer__block">
          <span class="hcb-timer__num">14</span>
          <span class="hcb-timer__lbl">Hours</span>
        </div>
        <span class="hcb-timer__sep">:</span>
        <div class="hcb-timer__block">
          <span class="hcb-timer__num">37</span>
          <span class="hcb-timer__lbl">Min</span>
        </div>
        <span class="hcb-timer__sep">:</span>
        <div class="hcb-timer__block">
          <span class="hcb-timer__num">52</span>
          <span class="hcb-timer__lbl">Sec</span>
        </div>
      </div>

      <button class="hcb-banner__btn">Claim Offer</button>
    </div>
  </section>

</body>
</html>
