<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Airbrush Fade · Smooth Gradient Airbrush</title>
    <meta name="description" content="Interactive airbrush tool with smooth gradient fade effects, adjustable opacity, and soft spray particles.">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1 class="title">🎨 AIRBRUSH FADE</h1>
        
        <div class="canvas-wrapper">
            <canvas id="airbrushCanvas" width="600" height="450"></canvas>
            <div class="glow-overlay"></div>
        </div>

        <div class="controls">
            <div class="color-controls">
                <label>Color</label>
                <input type="color" id="colorPicker" value="#ff6b6b">
                <label>Size</label>
                <input type="range" id="sizeSlider" min="5" max="80" value="40">
                <span id="sizeLabel">40</span>
                <label>Opacity</label>
                <input type="range" id="opacitySlider" min="1" max="10" value="5">
                <span id="opacityLabel">5</span>
            </div>
            <div class="button-group">
                <button class="clear-btn" id="clearBtn">🗑️ CLEAR</button>
                <button class="toggle-btn" id="toggleBtn">⏸️ PAUSE</button>
                <button class="reset-btn" id="resetBtn">⟳ RESET</button>
            </div>
            <div class="speed-control">
                <label>Speed</label>
                <input type="range" id="speedSlider" min="1" max="10" value="5">
                <span id="speedLabel">5</span>
            </div>
        </div>

        <div class="info">
            <span>🎨 AIRBRUSH FADE</span>
            <small>smooth · gradient · soft</small>
        </div>
        <div class="hint">
            <span>💨 drag to spray with smooth airbrush fade</span>
        </div>
    </div>

    <script>
        (function() {
            const canvas = document.getElementById('airbrushCanvas');
            const ctx = canvas.getContext('2d');
            const W = 600, H = 450;
            
            const colorPicker = document.getElementById('colorPicker');
            const sizeSlider = document.getElementById('sizeSlider');
            const sizeLabel = document.getElementById('sizeLabel');
            const opacitySlider = document.getElementById('opacitySlider');
            const opacityLabel = document.getElementById('opacityLabel');
            const clearBtn = document.getElementById('clearBtn');
            const toggleBtn = document.getElementById('toggleBtn');
            const resetBtn = document.getElementById('resetBtn');
            const speedSlider = document.getElementById('speedSlider');
            const speedLabel = document.getElementById('speedLabel');

            let isAnimating = true;
            let speed = 5;
            let time = 0;
            let isSpraying = false;
            let currentColor = '#ff6b6b';
            let brushSize = 40;
            let opacity = 5;

            // ---- Airbrush Particles ----
            let particles = [];

            // ---- Airbrush Particle Class ----
            class AirbrushParticle {
                constructor(x, y, color, size, opacity) {
                    const angle = Math.random() * Math.PI * 2;
                    const radius = Math.random() * size;
                    const dist = Math.pow(Math.random(), 0.5) * radius;
                    
                    this.x = x + Math.cos(angle) * dist;
                    this.y = y + Math.sin(angle) * dist;
                    this.size = 1 + Math.random() * 4;
                    this.color = color;
                    this.maxOpacity = (opacity / 10) * (0.3 + Math.random() * 0.4);
                    this.opacity = this.maxOpacity;
                    this.life = 0.5 + Math.random() * 0.5;
                    this.decay = 0.002 + Math.random() * 0.004;
                    
                    // Gentle drift
                    this.vx = (Math.random() - 0.5) * 0.2;
                    this.vy = (Math.random() - 0.5) * 0.2 - 0.1;
                    
                    // Fade in
                    this.fadeIn = 0;
                    this.fadeInSpeed = 0.05 + Math.random() * 0.05;
                }

                update() {
                    this.x += this.vx;
                    this.y += this.vy;
                    this.vx *= 0.99;
                    this.vy *= 0.99;
                    
                    // Fade in then fade out
                    this.fadeIn = Math.min(1, this.fadeIn + this.fadeInSpeed);
                    const lifeFactor = Math.min(1, this.life / 0.3);
                    this.opacity = this.maxOpacity * this.fadeIn * lifeFactor;
                    
                    this.life -= this.decay;
                    if (this.life < 0) this.life = 0;
                }

                draw(ctx) {
                    if (this.life <= 0 || this.opacity <= 0) return;
                    
                    ctx.save();
                    ctx.globalAlpha = this.opacity;
                    
                    // Soft glow
                    const grad = ctx.createRadialGradient(
                        this.x, this.y, 0,
                        this.x, this.y, this.size * 2
                    );
                    grad.addColorStop(0, this.color);
                    grad.addColorStop(0.5, this.color);
                    grad.addColorStop(1, 'rgba(0,0,0,0)');
                    ctx.fillStyle = grad;
                    ctx.shadowColor = 'rgba(0,0,0,0)';
                    ctx.shadowBlur = 0;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size * 2, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // Core
                    ctx.globalAlpha = this.opacity * 0.5;
                    ctx.fillStyle = this.color;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size * 0.3, 0, Math.PI * 2);
                    ctx.fill();
                    
                    ctx.restore();
                }
            }

            // ---- Spray function ----
            function spray(x, y) {
                const numParticles = 8 + Math.floor(Math.random() * 5);
                const color = currentColor;
                const size = brushSize;
                const opac = opacity;
                
                for (let i = 0; i < numParticles; i++) {
                    particles.push(new AirbrushParticle(x, y, color, size, opac));
                }
            }

            // ---- Render ----
            function render() {
                // Clear canvas with slight fade for smooth blending
                ctx.fillStyle = 'rgba(245, 240, 235, 0.02)';
                ctx.fillRect(0, 0, W, H);
            }

            // ---- Animation Loop ----
            function animate() {
                if (!isAnimating) {
                    requestAnimationFrame(animate);
                    return;
                }
                
                time += 0.01 * (speed / 5);
                
                // Update particles
                particles = particles.filter(p => p.life > 0);
                for (let p of particles) {
                    p.update();
                }
                
                render();
                
                // Draw particles
                for (let p of particles) {
                    p.draw(ctx);
                }
                
                // Limit particles
                if (particles.length > 3000) {
                    particles.splice(0, particles.length - 3000);
                }
                
                requestAnimationFrame(animate);
            }

            // ---- Mouse/Touch handlers ----
            function getPos(e) {
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;
                
                let clientX, clientY;
                if (e.touches) {
                    clientX = e.touches[0].clientX;
                    clientY = e.touches[0].clientY;
                    e.preventDefault();
                } else {
                    clientX = e.clientX;
                    clientY = e.clientY;
                }
                
                return {
                    x: Math.min(W - 5, Math.max(5, (clientX - rect.left) * scaleX)),
                    y: Math.min(H - 5, Math.max(5, (clientY - rect.top) * scaleY))
                };
            }

            function onPointerDown(e) {
                e.preventDefault();
                isSpraying = true;
                const pos = getPos(e);
                spray(pos.x, pos.y);
            }

            function onPointerMove(e) {
                e.preventDefault();
                const pos = getPos(e);
                if (isSpraying) {
                    spray(pos.x, pos.y);
                }
            }

            function onPointerUp(e) {
                e.preventDefault();
                isSpraying = false;
            }

            // ---- Clear ----
            function clearCanvas() {
                particles = [];
                ctx.fillStyle = '#f5f0eb';
                ctx.fillRect(0, 0, W, H);
            }

            // ---- Reset ----
            function resetCanvas() {
                clearCanvas();
                time = 0;
            }

            // ---- Toggle Animation ----
            function toggleAnimation() {
                isAnimating = !isAnimating;
                toggleBtn.textContent = isAnimating ? '⏸️ PAUSE' : '▶️ PLAY';
            }

            // ---- Speed Control ----
            speedSlider.addEventListener('input', function() {
                speed = parseInt(this.value);
                speedLabel.textContent = speed;
            });

            // ---- Color Control ----
            colorPicker.addEventListener('input', function() {
                currentColor = this.value;
            });

            // ---- Size Control ----
            sizeSlider.addEventListener('input', function() {
                brushSize = parseInt(this.value);
                sizeLabel.textContent = brushSize;
            });

            // ---- Opacity Control ----
            opacitySlider.addEventListener('input', function() {
                opacity = parseInt(this.value);
                opacityLabel.textContent = opacity;
            });

            // ---- Event Listeners ----
            canvas.addEventListener('mousedown', onPointerDown);
            canvas.addEventListener('mousemove', onPointerMove);
            canvas.addEventListener('mouseup', onPointerUp);
            canvas.addEventListener('mouseleave', onPointerUp);
            
            canvas.addEventListener('touchstart', onPointerDown, { passive: false });
            canvas.addEventListener('touchmove', onPointerMove, { passive: false });
            canvas.addEventListener('touchend', onPointerUp, { passive: false });
            
            clearBtn.addEventListener('click', clearCanvas);
            toggleBtn.addEventListener('click', toggleAnimation);
            resetBtn.addEventListener('click', resetCanvas);

            // ---- Keyboard Shortcuts ----
            document.addEventListener('keydown', function(e) {
                if (e.key === 'c' || e.key === 'C') {
                    clearCanvas();
                }
                if (e.key === 'r' || e.key === 'R') {
                    resetCanvas();
                }
                if (e.key === ' ') {
                    e.preventDefault();
                    toggleAnimation();
                }
            });

            // ---- Initialize ----
            ctx.fillStyle = '#f5f0eb';
            ctx.fillRect(0, 0, W, H);
            animate();

            console.log('🎨 Airbrush Fade · Drag to spray with smooth airbrush fade!');
        })();
    </script>
</body>
</html>
