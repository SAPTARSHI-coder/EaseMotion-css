<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spark Cursor · Sparks in All Directions</title>

    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <!-- === SPARK CURSOR === -->
    <div class="spark-container" id="sparkContainer"></div>

    <!-- === CONTENT === -->
    <div class="card">
        <h2>✨ Spark Cursor</h2>
        <p class="sub">emits sparks in all directions</p>

        <div class="cursor-demo-area">
            <p>Move your mouse around</p>
            <div class="interactive-hint">
                <i class="fas fa-mouse-pointer"></i>
                <span>Watch the sparks fly</span>
            </div>
            <div class="demo-buttons">
                <button class="demo-btn">Hover me</button>
                <button class="demo-btn">Click me</button>
                <button class="demo-btn">Sparks!</button>
            </div>
        </div>

        <p style="margin-top: 1.5rem; font-size: 0.85rem; color: #64748b;">
            Move your mouse · watch sparks fly in all directions
        </p>
    </div>

    <!-- Embedded JavaScript -->
    <script>
        (function() {
            'use strict';

            const container = document.getElementById('sparkContainer');
            let mouseX = 0;
            let mouseY = 0;
            let isVisible = false;

            // --- Spark colors ---
            const sparkColors = [
                '#ff6b35', '#ff4500', '#ff8c00', '#ffd700',
                '#ff6348', '#ff4757', '#ffa502', '#f9ca24',
                '#4facfe', '#43e97b', '#fa709a', '#a18cd1',
                '#fbc2eb', '#fee140', '#00f2fe', '#ff6b6b'
            ];

            // --- Create a spark ---
            function createSpark(x, y) {
                const spark = document.createElement('div');
                spark.className = 'spark-particle';

                // Random size
                const size = 2 + Math.random() * 5;
                spark.style.width = size + 'px';
                spark.style.height = size + 'px';

                // Random color
                const color = sparkColors[Math.floor(Math.random() * sparkColors.length)];
                spark.style.background = `radial-gradient(circle at 30% 30%, ${color}, transparent)`;

                // Random direction (360°)
                const angle = Math.random() * 2 * Math.PI;
                const speed = 30 + Math.random() * 80;
                const vx = Math.cos(angle) * speed;
                const vy = Math.sin(angle) * speed - 10;

                spark.style.left = (x + (Math.random() - 0.5) * 6) + 'px';
                spark.style.top = (y + (Math.random() - 0.5) * 6) + 'px';
                spark.style.setProperty('--vx', vx + 'px');
                spark.style.setProperty('--vy', vy + 'px');

                // Random glow
                const glow = 10 + Math.random() * 30;
                spark.style.setProperty('--glow', glow + 'px');

                // Random rotation
                const rotation = (Math.random() - 0.5) * 360;
                spark.style.setProperty('--rotation', rotation + 'deg');

                // Random duration
                const duration = 0.6 + Math.random() * 0.8;
                spark.style.setProperty('--duration', duration + 's');

                container.appendChild(spark);

                // Remove spark after animation
                setTimeout(() => {
                    if (spark.parentNode) {
                        spark.remove();
                    }
                }, (duration + 0.5) * 1000);
            }

            // --- Create spark burst ---
            function createSparkBurst(x, y, count = 40) {
                for (let i = 0; i < count; i++) {
                    setTimeout(() => {
                        const spark = document.createElement('div');
                        spark.className = 'spark-particle';

                        const size = 2 + Math.random() * 6;
                        spark.style.width = size + 'px';
                        spark.style.height = size + 'px';

                        const color = sparkColors[Math.floor(Math.random() * sparkColors.length)];
                        spark.style.background = `radial-gradient(circle at 30% 30%, ${color}, transparent)`;

                        const angle = Math.random() * 2 * Math.PI;
                        const speed = 40 + Math.random() * 120;
                        const vx = Math.cos(angle) * speed;
                        const vy = Math.sin(angle) * speed - 20;

                        spark.style.left = (x + (Math.random() - 0.5) * 15) + 'px';
                        spark.style.top = (y + (Math.random() - 0.5) * 15) + 'px';
                        spark.style.setProperty('--vx', vx + 'px');
                        spark.style.setProperty('--vy', vy + 'px');

                        const glow = 10 + Math.random() * 40;
                        spark.style.setProperty('--glow', glow + 'px');

                        const rotation = (Math.random() - 0.5) * 360;
                        spark.style.setProperty('--rotation', rotation + 'deg');

                        const duration = 0.6 + Math.random() * 1;
                        spark.style.setProperty('--duration', duration + 's');

                        container.appendChild(spark);

                        setTimeout(() => {
                            if (spark.parentNode) {
                                spark.remove();
                            }
                        }, (duration + 0.5) * 1000);
                    }, i * 15);
                }
            }

            // --- Spark trail loop ---
            let sparkInterval = null;

            function startSparks() {
                if (sparkInterval) return;
                sparkInterval = setInterval(() => {
                    if (isVisible) {
                        for (let i = 0; i < 3; i++) {
                            createSpark(mouseX + (Math.random() - 0.5) * 10, mouseY + (Math.random() - 0.5) * 10);
                        }
                    }
                }, 30);
            }

            function stopSparks() {
                if (sparkInterval) {
                    clearInterval(sparkInterval);
                    sparkInterval = null;
                }
            }

            // --- Mouse move ---
            document.addEventListener('mousemove', function(e) {
                mouseX = e.clientX;
                mouseY = e.clientY;
                isVisible = true;
                container.style.display = 'block';
            });

            // --- Touch support ---
            document.addEventListener('touchmove', function(e) {
                e.preventDefault();
                const touch = e.touches[0];
                mouseX = touch.clientX;
                mouseY = touch.clientY;
                isVisible = true;
                container.style.display = 'block';
            }, { passive: false });

            document.addEventListener('touchstart', function(e) {
                const touch = e.touches[0];
                mouseX = touch.clientX;
                mouseY = touch.clientY;
                isVisible = true;
                container.style.display = 'block';
            });

            // --- Mouse leave ---
            document.addEventListener('mouseleave', function() {
                isVisible = false;
                container.style.display = 'none';
            });

            // --- Mouse enter ---
            document.addEventListener('mouseenter', function() {
                isVisible = true;
                container.style.display = 'block';
            });

            // --- Click burst ---
            document.addEventListener('click', function(e) {
                createSparkBurst(e.clientX, e.clientY, 50);
                console.log('✨ Spark burst!');
            });

            // --- Hover effects ---
            const interactiveElements = document.querySelectorAll('a, button, .demo-btn, .interactive-hint');
            interactiveElements.forEach(el => {
                el.addEventListener('mouseenter', function() {
                    const rect = this.getBoundingClientRect();
                    const cx = rect.left + rect.width / 2;
                    const cy = rect.top + rect.height / 2;
                    createSparkBurst(cx, cy, 25);
                });
            });

            // --- Start sparks ---
            startSparks();

            console.log('✨ Spark cursor initialized!');

        })();
    </script>

</body>
</html>
