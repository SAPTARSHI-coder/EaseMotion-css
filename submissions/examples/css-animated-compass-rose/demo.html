<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Pure CSS animated compass rose component"
  >
  <title>CSS Animated Compass Rose</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="compass-page">
    <section
      class="compass-card"
      aria-labelledby="compass-title"
    >
      <header class="compass-header">
        <span class="compass-badge">EaseMotion CSS</span>
        <h1 id="compass-title">Animated Compass Rose</h1>
        <p>
          A lightweight compass animation built entirely with HTML and CSS.
        </p>
      </header>

      <div
        class="compass"
        role="img"
        aria-label="Animated compass showing north, east, south and west directions"
      >
        <div class="compass__ring">
          <span class="direction direction--north">N</span>
          <span class="direction direction--east">E</span>
          <span class="direction direction--south">S</span>
          <span class="direction direction--west">W</span>

          <span class="tick tick--1"></span>
          <span class="tick tick--2"></span>
          <span class="tick tick--3"></span>
          <span class="tick tick--4"></span>
          <span class="tick tick--5"></span>
          <span class="tick tick--6"></span>
          <span class="tick tick--7"></span>
          <span class="tick tick--8"></span>

          <div class="compass__needle" aria-hidden="true">
            <span class="needle needle--north"></span>
            <span class="needle needle--south"></span>
            <span class="needle__center"></span>
          </div>
        </div>
      </div>

      <p class="compass-status">
        <span aria-hidden="true">●</span>
        Direction indicator active
      </p>
    </section>
  </main>
</body>
</html>
