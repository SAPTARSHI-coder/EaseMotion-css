<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout Accordion | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="demo-header">
    <h1>Animated Checkout Accordion</h1>
    <p>E-commerce checkout step accordion with input focus glow indicators.</p>
  </header>

  <main class="demo-main">
    <section class="demo-section">
      <div class="ease-checkout-group">
        <div class="ease-checkout-step ease-chk-active">
          <div class="ease-chk-header">
            <span class="ease-chk-badge">1</span>
            <h3>Shipping Address</h3>
          </div>
          <div class="ease-chk-body">
            <input type="text" class="ease-chk-input" placeholder="Street Address" />
          </div>
        </div>
      </div>
    </section>
  </main>
  <footer class="demo-footer"><p>EaseMotion CSS Project</p></footer>
</body>
</html>
