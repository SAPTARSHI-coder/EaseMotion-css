<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="CSS-only color gradient select component"
  >
  <title>CSS Color Gradient Select</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="demo-page">
    <section class="demo-card" aria-labelledby="page-title">

      <span class="eyebrow">EaseMotion CSS</span>

      <h1 id="page-title">Color Gradient Select</h1>

      <p class="intro">
        Choose a gradient using a responsive CSS-only custom select.
      </p>

      <form class="gradient-form">

        <fieldset class="gradient-select">

          <legend>Choose a gradient</legend>

          <input
            type="radio"
            name="gradient"
            id="gradient-sunset"
            checked
          >

          <label
            for="gradient-sunset"
            class="gradient-option gradient-sunset"
          >
            <span class="gradient-preview" aria-hidden="true"></span>
            <span>
              <strong>Sunset</strong>
              <small>Coral → Purple</small>
            </span>
          </label>

          <input
            type="radio"
            name="gradient"
            id="gradient-ocean"
          >

          <label
            for="gradient-ocean"
            class="gradient-option gradient-ocean"
          >
            <span class="gradient-preview" aria-hidden="true"></span>
            <span>
              <strong>Ocean</strong>
              <small>Blue → Cyan</small>
            </span>
          </label>

          <input
            type="radio"
            name="gradient"
            id="gradient-forest"
          >

          <label
            for="gradient-forest"
            class="gradient-option gradient-forest"
          >
            <span class="gradient-preview" aria-hidden="true"></span>
            <span>
              <strong>Forest</strong>
              <small>Green → Teal</small>
            </span>
          </label>

          <input
            type="radio"
            name="gradient"
            id="gradient-candy"
          >

          <label
            for="gradient-candy"
            class="gradient-option gradient-candy"
          >
            <span class="gradient-preview" aria-hidden="true"></span>
            <span>
              <strong>Candy</strong>
              <small>Pink → Yellow</small>
            </span>
          </label>

          <input
            type="radio"
            name="gradient"
            id="gradient-night"
          >

          <label
            for="gradient-night"
            class="gradient-option gradient-night"
          >
            <span class="gradient-preview" aria-hidden="true"></span>
            <span>
              <strong>Night</strong>
              <small>Indigo → Violet</small>
            </span>
          </label>

        </fieldset>

        <button type="button" class="apply-button">
          Apply Gradient
        </button>

      </form>

      <p class="helper-text">
        Use Tab and the arrow keys to navigate the available choices.
      </p>

    </section>
  </main>
</body>
</html>
