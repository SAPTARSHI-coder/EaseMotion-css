<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Progress: Aurora Glow</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="layout-container">
        
        <header class="section-header">
            <h1 class="title">Pure CSS Progress: Aurora Glow</h1>
            <p class="subtitle">A hardware-accelerated, JavaScript-free progress bar. Features a vibrant, multi-colored animated fill with an intense, dynamically scaling ambient light spill.</p>
        </header>

        <div class="demo-area">
            
            <div class="progress-demo-card">
                
                <div class="progress-header">
                    <h3>System Calibration</h3>
                    <span class="percentage">78%</span>
                </div>
                
                <!-- 
                  [TECHNIQUE] The Aurora Glow Progress Bar
                  The container provides the track. 
                -->
                <div class="progress-track" role="progressbar" aria-valuenow="78" aria-valuemin="0" aria-valuemax="100">
                    
                    <!-- 
                      [TECHNIQUE] The Aurora Fill
                      This element contains both the visible colored bar AND 
                      the blurred pseudo-element that creates the ambient glow.
                      Its width represents the progress.
                    -->
                    <div class="progress-fill" style="width: 78%;"></div>
                    
                </div>
                
                <p class="status-text">Aligning optical sensors...</p>
                
                <!-- Buttons just to demonstrate CSS width changes via simple inline JS for the demo -->
                <div class="demo-controls">
                    <button class="demo-btn" onclick="document.querySelector('.progress-fill').style.width = '25%'; document.querySelector('.percentage').innerText = '25%';">25%</button>
                    <button class="demo-btn" onclick="document.querySelector('.progress-fill').style.width = '78%'; document.querySelector('.percentage').innerText = '78%';">78%</button>
                    <button class="demo-btn" onclick="document.querySelector('.progress-fill').style.width = '100%'; document.querySelector('.percentage').innerText = '100%';">100%</button>
                </div>
                
            </div>
            
        </div>
        
    </div>

</body>
</html>
