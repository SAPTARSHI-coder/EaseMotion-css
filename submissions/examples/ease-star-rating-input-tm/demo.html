<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Star Rating Input | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="star-container">
    <div class="star-card">
      <label class="star-label">Rate this component</label>
      <div class="star-row" role="radiogroup" aria-label="Star rating">
        <span class="star" role="radio" aria-label="1 star">&#9733;</span>
        <span class="star" role="radio" aria-label="2 stars">&#9733;</span>
        <span class="star" role="radio" aria-label="3 stars">&#9733;</span>
        <span class="star" role="radio" aria-label="4 stars">&#9733;</span>
        <span class="star" role="radio" aria-label="5 stars">&#9733;</span>
      </div>
    </div>
    <div class="star-card">
      <label class="star-label">Average rating</label>
      <div class="star-row star-display" aria-label="4.2 out of 5 stars">
        <span class="star">&#9733;</span>
        <span class="star">&#9733;</span>
        <span class="star">&#9733;</span>
        <span class="star">&#9733;</span>
        <span class="star" style="color:var(--tm-star-empty);">&#9733;</span>
      </div>
    </div>
  </div>
</body>
</html>
