<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neural Net Decoders NND - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css"></head><body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030712; color: #ffffff;">

    <div class="ease-card ease-card-glass nnd-container">
        <div class="nnd-header">
            <h2>Neural-Net Decoders</h2>
            <span class="ease-badge ease-badge-success">Quantum Error Correction</span>
        </div>
        
        <div class="nnd-screen ease-center">
            <div class="nnd-flux flux-nnd-a"></div>
            <div class="nnd-flux flux-nnd-b"></div>
            <div class="nnd-boundary-ring"></div>
            <div class="nnd-core ease-center"></div>
        </div>

        <div class="nnd-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Machine Learning Syndromes &amp; Real-Time Inference</span>
            <button class="ease-btn ease-btn-success ease-btn-sm ease-hover-grow">Run Neural Decoder</button>
        </div>
    </div></body></html>
