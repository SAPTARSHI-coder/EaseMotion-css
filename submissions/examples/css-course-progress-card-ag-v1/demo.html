<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Course Progress Card</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <!-- Course Card Link Wrapper -->
  <a href="#" class="course-card" aria-label="Course: Advanced UI Design Principles. 75% complete.">
    
    <div class="card-header">
      <div class="course-icon" aria-hidden="true">
        <!-- Pen/Design Icon -->
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path>
        </svg>
      </div>

      <!-- Pure CSS Circular Progress -->
      <div class="progress-ring-wrapper" aria-hidden="true">
        <svg class="progress-ring" width="56" height="56">
          <circle class="progress-ring-bg" cx="28" cy="28" r="24"></circle>
          <!-- Using inline CSS variable to set progress dynamically -->
          <circle class="progress-ring-fill" cx="28" cy="28" r="24" style="--progress: 75;"></circle>
        </svg>
        <span class="progress-text">75%</span>
      </div>
    </div>

    <h3 class="card-title">Advanced UI Design Principles</h3>
    
    <div class="card-meta">
      <div class="meta-item">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
        </svg>
        <span>12 Lessons left</span>
      </div>
      <div class="meta-item">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
        </svg>
        <span>2h 15m</span>
      </div>
    </div>

    <!-- The CTA relies on the anchor tag for navigation and focus -->
    <span class="cta-btn">Continue Course</span>

  </a>

</body>
</html>
