<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-radar-sweep-screen demo</title>
</head>
<body>
<div class="rd-app">
  <span class="rd-title">SEARCH RADAR</span>
  <div class="rd-scope">
    <span class="rd-ring rd-ring-1"></span>
    <span class="rd-ring rd-ring-2"></span>
    <span class="rd-ring rd-ring-3"></span>
    <span class="rd-cross rd-cross-h"></span>
    <span class="rd-cross rd-cross-v"></span>
    <div class="rd-sweep"><span class="rd-blade"></span></div>
    <span class="rd-blip rd-blip-1"></span>
    <span class="rd-blip rd-blip-2"></span>
  </div>
  <span class="rd-range">RNG 10 NM</span>
</div>
</body>
</html>
