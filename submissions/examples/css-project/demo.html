```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Hologram Button</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="page">

        <section class="intro">
            <span class="eyebrow">HOLOGRAPHIC INTERFACE / 01</span>

            <h1>Enter the Future.</h1>

            <p>
                A futuristic hologram button built entirely with CSS,
                featuring animated scan lines, glowing borders, and
                subtle digital distortion.
            </p>
        </section>

        <section class="hologram-stage">

            <div class="holo-grid"></div>

            <div class="button-wrapper">

                <button class="hologram-button">
                    <span class="button-glitch"></span>
                    <span class="scan-lines"></span>

                    <span class="button-content">
                        <span class="button-icon">✦</span>
                        <span class="button-text">INITIALIZE</span>
                        <span class="button-arrow">↗</span>
                    </span>
                </button>

                <span class="holo-shadow"></span>

            </div>

        </section>

    </main>

</body>

</html>
