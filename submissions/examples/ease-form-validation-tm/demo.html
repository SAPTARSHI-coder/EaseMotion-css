<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Form Validation with :has()</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="fv-container">
    <h2 class="fv-title">Create Account</h2>
    <form class="fv-form" novalidate>

      <div class="fv-group email">
        <label class="fv-label" for="fv-email">Email address</label>
        <input class="fv-input" type="email" id="fv-email"
               placeholder="you@example.com" required>
        <span class="fv-status fv-status-valid">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>
          Looks good!
        </span>
        <span class="fv-status fv-status-invalid">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          Enter a valid email address
        </span>
      </div>

      <div class="fv-group">
        <label class="fv-label" for="fv-user">Username</label>
        <input class="fv-input" type="text" id="fv-user"
               placeholder="yourname" required minlength="3">
        <p class="fv-hint">At least 3 characters</p>
        <span class="fv-status fv-status-valid">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>
          Username available!
        </span>
        <span class="fv-status fv-status-invalid">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          At least 3 characters required
        </span>
      </div>

      <div class="fv-group">
        <label class="fv-label" for="fv-pw">Password</label>
        <input class="fv-input" type="password" id="fv-pw"
               placeholder="Min 8 characters" required minlength="8">
        <div class="fv-password-strength">
          <div class="fv-strength-bar"></div>
          <div class="fv-strength-bar"></div>
          <div class="fv-strength-bar"></div>
        </div>
        <p class="fv-hint">Minimum 8 characters</p>
        <span class="fv-error-text">Password must be at least 8 characters</span>
      </div>

      <button class="fv-btn" type="submit">Create Account</button>
    </form>
  </div>
</body>
</html>
