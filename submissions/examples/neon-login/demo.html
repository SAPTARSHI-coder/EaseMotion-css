<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neon Glow Login Form — Demo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <form class="neon-form">
    <p class="neon-title">Welcome Back</p>

    <label class="neon-field">
      <span class="neon-label">Email</span>
      <input class="neon-input" type="email" placeholder="you@example.com" autocomplete="off" />
    </label>

    <label class="neon-field">
      <span class="neon-label">Password</span>
      <input class="neon-input" type="password" placeholder="••••••••" autocomplete="off" />
    </label>

    <button class="neon-btn" type="button">Sign In</button>
  </form>

</body>
</html>
