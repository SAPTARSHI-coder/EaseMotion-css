<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Morph Glow Dropdown</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <h1>Morph Glow Dropdown</h1>
        <p>CSS Animated Product Catalog Dropdown</p>


        <div class="dropdown">

            <button class="dropdown-btn">
                Select Product
                <span>⌄</span>
            </button>


            <div class="dropdown-menu">

                <div class="product">
                    <h3>Cyber Laptop</h3>
                    <p>High performance gaming laptop</p>
                </div>


                <div class="product">
                    <h3>Smart Watch</h3>
                    <p>Modern wearable technology</p>
                </div>


                <div class="product">
                    <h3>Wireless Headphones</h3>
                    <p>Premium audio experience</p>
                </div>

            </div>

        </div>


    </main>

</body>

</html>
