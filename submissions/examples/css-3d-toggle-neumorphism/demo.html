<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Toggle | Neumorphism Styling</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="toggle-card" tabindex="0" aria-label="3D Neumorphic Toggle Switch Showcase">
    <h1 class="toggle-title">3D Neumorphic Toggle</h1>
    <p class="toggle-subtitle">Tactile soft-extrusion toggle switch with tactile shadow depth</p>

    <div class="switch-container">
        <span class="toggle-label" id="switch-off-label">OFF</span>
        <label class="toggle-switch">
            <input type="checkbox" aria-labelledby="switch-off-label switch-on-label" role="switch" aria-checked="false">
            <span class="slider"></span>
        </label>
        <span class="toggle-label" id="switch-on-label">ON</span>
    </div>
</main>

</body>
</html>
