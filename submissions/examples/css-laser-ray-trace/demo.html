<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Pure CSS 3D laser ray trace animation">
  <title>CSS 3D Laser Ray Trace</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="scene">
    <section class="laser-card" aria-label="CSS 3D Laser Ray Trace">
      <div class="grid"></div>

      <div class="laser laser-one"></div>
      <div class="laser laser-two"></div>
      <div class="laser laser-three"></div>

      <div class="core" aria-hidden="true"></div>

      <div class="content">
        <span class="badge">PURE CSS 3D</span>
        <h1>Laser Ray Trace</h1>
        <p>
          A smooth perspective-based laser animation created entirely
          with HTML and vanilla CSS.
        </p>
      </div>
    </section>
  </main>
</body>
</html>
