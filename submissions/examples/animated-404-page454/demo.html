<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Animated 404 Page - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="error-page">

    <div class="error-background">
      <span class="orb orb-1"></span>
      <span class="orb orb-2"></span>
      <span class="orb orb-3"></span>
    </div>

    <section class="error-card">

      <div class="error-badge">Error</div>

      <h1 class="error-code">404</h1>

      <h2>Page not found</h2>

      <p>
        The page you are looking for does not exist, has been moved,
        or is temporarily unavailable.
      </p>

      <div class="error-actions">
        <a href="#" class="error-btn primary">Go Back Home</a>
        <a href="#" class="error-btn ghost">Report Issue</a>
      </div>

    </section>

  </main>

</body>
</html>
