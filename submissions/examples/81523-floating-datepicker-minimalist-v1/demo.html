<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Minimalist floating datepicker built with pure HTML and CSS."
  >

  <title>Floating Minimalist Datepicker</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="page">
    <section
      class="datepicker-card"
      aria-labelledby="datepicker-title"
    >
      <div class="intro">
        <span class="eyebrow">EaseMotion CSS</span>

        <h1 id="datepicker-title">
          Choose a date
        </h1>

        <p>
          A clean floating date field using the browser's
          native date picker with no JavaScript dependencies.
        </p>
      </div>

      <form class="date-form">
        <div class="date-field">
          <input
            class="date-input"
            type="date"
            id="event-date"
            name="event-date"
            required
            aria-describedby="date-help"
          >

          <label
            class="date-label"
            for="event-date"
          >
            Event date
          </label>

          <span
            class="date-line"
            aria-hidden="true"
          ></span>
        </div>

        <p id="date-help" class="date-help">
          Select a date from the calendar.
        </p>

        <div class="date-preview" aria-live="polite">
          <span class="preview-dot" aria-hidden="true"></span>

          <span>
            Native calendar controls · Responsive · CSS only
          </span>
        </div>

        <button
          class="date-button"
          type="submit"
        >
          Continue
          <span aria-hidden="true">→</span>
        </button>
      </form>
    </section>
  </main>
</body>
</html>
