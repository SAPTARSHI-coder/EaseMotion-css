<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyberpunk Dropzone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="cp-dz-container">
        <input type="file" id="cp-dz-file" class="cp-dz-input" multiple>
        <label for="cp-dz-file" class="cp-dz-label">
            <div class="cp-dz-grid"></div>
            <div class="cp-dz-content">
                <span class="cp-dz-sys">> SYS_UPLOAD</span>
                <span class="cp-dz-desc">Drop payload or click to initialize</span>
            </div>
            <div class="cp-dz-status">[WAITING...]</div>
        </label>
    </div>
</body>
</html>
