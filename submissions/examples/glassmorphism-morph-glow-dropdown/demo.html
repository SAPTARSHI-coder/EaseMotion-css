<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Morph-Glow Dropdown - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="em-glass-container">
        <div class="em-dropdown-wrapper">
            <input type="checkbox" id="em-toggle" class="em-hidden-toggle">
            
            <label for="em-toggle" class="em-morph-btn" tabindex="0">
                <span class="em-btn-text">Settings</span>
                <div class="em-glow-layer"></div>
                <div class="em-chevron"></div>
            </label>

            <div class="em-glass-menu">
                <a href="#" class="em-menu-item">Account Profile</a>
                <a href="#" class="em-menu-item">Privacy & Security</a>
                <a href="#" class="em-menu-item">Notifications</a>
                <div class="em-divider"></div>
                <a href="#" class="em-menu-item em-danger">Delete Workspace</a>
            </div>
        </div>
    </div>
</body>
</html>
