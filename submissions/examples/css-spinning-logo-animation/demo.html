<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Spinning Logo Animation - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="em-logo-page">
        <div class="em-card" role="region" aria-label="Spinning Logo Animation Showcase" tabindex="0">
            <span class="em-card-badge">SVG ANIMATIONS</span>
            <h1 class="em-card-title">Spinning Logo</h1>
            <p class="em-card-desc">SVG/CSS logo that spins and assembles dynamically on page load using pure CSS keyframes.</p>
            
            <!-- Animated SVG Spinning Logo Container -->
            <div class="em-logo-container" role="img" aria-label="Assembling spinning logo animation">
                <svg class="em-spinning-svg" viewBox="0 0 100 100" width="120" height="120">
                    <circle class="em-logo-ring" cx="50" cy="50" r="40" fill="none" stroke-width="8"></circle>
                    <path class="em-logo-core" d="M50 20 L75 70 L25 70 Z" fill="none" stroke-width="6"></path>
                    <circle class="em-logo-dot" cx="50" cy="50" r="8"></circle>
                </svg>
            </div>

            <a href="#" class="em-card-btn" role="button">Replay Animation</a>
        </div>
    </div>
</body>
</html>
