<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accessible Pagination Demo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <main class="demo-container">
        <h1>Product Results</h1>
        <p>Showing 11-20 of 145 products.</p>
        
        <!-- 
            CRITICAL ACCESSIBILITY: Semantic Navigation 
            Wrap pagination in a <nav> element and provide a clear aria-label
            so screen readers can distinguish it from primary site navigation.
        -->
        <nav aria-label="Pagination" class="pagination-nav">
            <ul class="pagination-list">
                
                <!-- Previous Button -->
                <li>
                    <a href="#" class="pagination-link" aria-label="Go to previous page">
                        <!-- Visual icon hidden from screen readers -->
                        <svg aria-hidden="true" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="15 18 9 12 15 6"></polyline>
                        </svg>
                    </a>
                </li>
                
                <!-- Page 1 -->
                <li>
                    <a href="#" class="pagination-link" aria-label="Go to page 1">1</a>
                </li>
                
                <!-- 
                    CRITICAL ACCESSIBILITY: Current Page 
                    Use aria-current="page" to programmatically identify the active item.
                    We also use this attribute as our CSS selector to enforce semantic styling.
                -->
                <li>
                    <a href="#" class="pagination-link" aria-label="Current page, page 2" aria-current="page">2</a>
                </li>
                
                <!-- Page 3 -->
                <li>
                    <a href="#" class="pagination-link" aria-label="Go to page 3">3</a>
                </li>
                
                <!-- Ellipsis (non-interactive) -->
                <li>
                    <span class="pagination-ellipsis" aria-hidden="true">&hellip;</span>
                    <span class="sr-only">More pages available</span>
                </li>
                
                <!-- Last Page -->
                <li>
                    <a href="#" class="pagination-link" aria-label="Go to page 15">15</a>
                </li>
                
                <!-- Next Button -->
                <li>
                    <a href="#" class="pagination-link" aria-label="Go to next page">
                        <svg aria-hidden="true" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="9 18 15 12 9 6"></polyline>
                        </svg>
                    </a>
                </li>
                
            </ul>
        </nav>
    </main>

</body>
</html>
