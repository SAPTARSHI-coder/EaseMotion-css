<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Password Visibility Toggle | EaseMotion CSS</title><link rel="stylesheet" href="style.css"></head>
<body><div class="pv-root">
<div class="pv-field">
<input type="password" class="pv-input" id="pwd1" placeholder="Enter password" autocomplete="current-password">
<button class="pv-toggle" type="button" onclick="var i=document.getElementById('pwd1');i.type=i.type==='password'?'text':'password'" aria-label="Toggle">&#128065;</button>
</div>
<div class="pv-field">
<input type="password" class="pv-input" id="pwd2" placeholder="Confirm password" autocomplete="new-password">
<button class="pv-toggle" type="button" onclick="var i=document.getElementById('pwd2');i.type=i.type==='password'?'text':'password'" aria-label="Toggle">&#128065;</button>
</div>
<p class="pv-label">Click the eye icon to show/hide password</p>
</div></body></html>
