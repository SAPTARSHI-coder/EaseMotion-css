<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-bird-feeder-cam</title>
</head>
<body>
<main class="bfc-cam">
  <header class="bfc-top">
    <h1 class="bfc-title">Feeder Cam</h1>
    <span class="bfc-rec">REC</span>
  </header>
  <section class="bfc-frame" aria-label="camera view">
    <div class="bfc-scene">
      <span class="bfc-bird"></span>
      <div class="bfc-feeder">
        <span class="bfc-seed"></span>
        <span class="bfc-seed"></span>
        <span class="bfc-seed"></span>
        <span class="bfc-seed"></span>
      </div>
      <span class="bfc-branch"></span>
    </div>
    <span class="bfc-stamp">CAM 02</span>
  </section>
  <footer class="bfc-foot">
    <span class="bfc-clock">2026-08-11 14:32</span>
    <span class="bfc-live">LIVE</span>
  </footer>
</main>
</body>
</html>
