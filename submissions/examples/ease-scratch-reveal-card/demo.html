<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ease Scratch-to-Reveal Card — EaseMotion CSS</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../easemotion.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="ease-scratch-body">
  <div class="ease-scratch-container">
    <header class="ease-scratch-header">
      <h2>Scratch-to-Reveal Card</h2>
      <p>Drag or scratch the surface coating to unlock your reward</p>
    </header>

    <div class="ease-scratch-card" id="scratchCard">
      <!-- Underlying Reward Content -->
      <div class="ease-scratch-reward">
        <span class="reward-badge">🎉 VICTORY UNLOCKED</span>
        <div class="reward-code">EASE-PRO-2026</div>
        <p class="reward-desc">Enjoy 50% off EaseMotion Pro Membership!</p>
      </div>

      <!-- Scratch Canvas Surface Mask -->
      <canvas class="ease-scratch-canvas" id="scratchCanvas"></canvas>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const card = document.getElementById('scratchCard');
      const canvas = document.getElementById('scratchCanvas');
      const ctx = canvas.getContext('2d');

      let isScratching = false;

      function initCanvas() {
        const rect = card.getBoundingClientRect();
        canvas.width = rect.width;
        canvas.height = rect.height;

        // Draw scratch coating pattern
        ctx.fillStyle = '#334155';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Add metallic text label on coating
        ctx.fillStyle = '#94a3b8';
        ctx.font = 'bold 16px Inter, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('✨ Scratch Here to Reveal', canvas.width / 2, canvas.height / 2);
      }

      function scratch(x, y) {
        ctx.globalCompositeOperation = 'destination-out';
        ctx.beginPath();
        ctx.arc(x, y, 24, 0, Math.PI * 2);
        ctx.fill();
      }

      function getPos(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return {
          x: clientX - rect.left,
          y: clientY - rect.top
        };
      }

      canvas.addEventListener('mousedown', (e) => { isScratching = true; const pos = getPos(e); scratch(pos.x, pos.y); });
      canvas.addEventListener('mousemove', (e) => { if (isScratching) { const pos = getPos(e); scratch(pos.x, pos.y); } });
      window.addEventListener('mouseup', () => { isScratching = false; });

      canvas.addEventListener('touchstart', (e) => { isScratching = true; const pos = getPos(e); scratch(pos.x, pos.y); });
      canvas.addEventListener('touchmove', (e) => { if (isScratching) { const pos = getPos(e); scratch(pos.x, pos.y); } });
      window.addEventListener('touchend', () => { isScratching = false; });

      initCanvas();
    });
  </script>
</body>
</html>
