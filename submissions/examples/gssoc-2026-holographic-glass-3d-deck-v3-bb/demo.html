<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Holographic Glass 3D Deck - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="deck-container">
    <div class="card-deck">
      <div class="glass-card card-top">
        <div class="card-chip"></div>
        <div class="card-details">
          <span class="card-type">HOLO PLATINUM</span>
          <span class="card-number">•••• •••• •••• 9082</span>
        </div>
      </div>
      <div class="glass-card card-mid">
        <div class="card-details">
          <span class="card-type">NEBULA GOLD</span>
        </div>
      </div>
      <div class="glass-card card-bot">
        <div class="card-details">
          <span class="card-type">CYBER CORE</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
