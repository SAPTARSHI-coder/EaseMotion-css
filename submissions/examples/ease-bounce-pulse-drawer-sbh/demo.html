<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ease-bounce-pulse-drawer — Demo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <header class="page__intro">
      <h1>ease-bounce-pulse-drawer</h1>
      <p>A drawer that bounces in on open and pulses softly while open.</p>
    </header>

    <section class="stage" aria-label="Drawer demo">
      <input type="checkbox" id="bpd-toggle" class="drawer-toggle" aria-hidden="true" />
      <label for="bpd-toggle" class="opener" tabindex="0">Filters</label>

      <label for="bpd-toggle" class="scrim" aria-hidden="true"></label>

      <aside class="drawer" role="region" aria-label="Filters">
        <div class="drawer__head">
          <h2 class="drawer__title">Filters</h2>
          <label for="bpd-toggle" class="drawer__close" tabindex="0" aria-label="Close drawer">&times;</label>
        </div>
        <div class="drawer__body">
          <fieldset class="filter-group">
            <legend>Category</legend>
            <label><input type="radio" name="cat" checked /> All</label>
            <label><input type="radio" name="cat" /> Lighting</label>
            <label><input type="radio" name="cat" /> Audio</label>
          </fieldset>
          <fieldset class="filter-group">
            <legend>Price</legend>
            <label><input type="checkbox" checked /> Under $50</label>
            <label><input type="checkbox" /> $50–$150</label>
          </fieldset>
        </div>
        <div class="drawer__actions">
          <label for="bpd-toggle" class="drawer__btn drawer__btn--ghost" tabindex="0">Reset</label>
          <label for="bpd-toggle" class="drawer__btn drawer__btn--primary" tabindex="0">Apply</label>
        </div>
      </aside>
    </section>
  </main>
</body>
</html>
