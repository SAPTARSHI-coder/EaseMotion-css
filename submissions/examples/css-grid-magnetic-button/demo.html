<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Magnetic Button</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="magnetic-area">
        <!-- 3x3 invisible grid for hover tracking -->
        <div class="grid top-left"></div>
        <div class="grid top-center"></div>
        <div class="grid top-right"></div>
        <div class="grid middle-left"></div>
        <div class="grid middle-center"></div>
        <div class="grid middle-right"></div>
        <div class="grid bottom-left"></div>
        <div class="grid bottom-center"></div>
        <div class="grid bottom-right"></div>
        
        <button class="mag-btn">Hover Me</button>
    </div>
</body>
</html>
