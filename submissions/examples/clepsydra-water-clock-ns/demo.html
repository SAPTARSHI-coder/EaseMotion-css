<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clepsydra Water Clock — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Clepsydra Water Clock demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Clepsydra Water Clock</h1>
      <p class="lede">Ancient water clock dripping into a rising float chamber</p>
    </header>

    <section class="ease-clepsydra-water-clock" data-demo="clepsydra-water-clock" aria-live="polite">
      <div class="ease-clepsydra-water-clock__housing">
        <div class="ease-clepsydra-water-clock__bezel">
          <div class="ease-clepsydra-water-clock__face">
            <div class="ease-clepsydra-water-clock__readout">
              <span class="ease-clepsydra-water-clock__label">Clepsydra Water Clock</span>
              <span class="ease-clepsydra-water-clock__value">LIVE</span>
            </div>
            <div class="ease-clepsydra-water-clock__motion" aria-hidden="true">
              <span class="ease-clepsydra-water-clock__a"></span>
              <span class="ease-clepsydra-water-clock__b"></span>
              <span class="ease-clepsydra-water-clock__c"></span>
              <span class="ease-clepsydra-water-clock__d"></span>
            </div>
            <div class="ease-clepsydra-water-clock__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-clepsydra-water-clock__controls">
          <button type="button" class="ease-clepsydra-water-clock__btn primary">Engage</button>
          <button type="button" class="ease-clepsydra-water-clock__btn">Reset</button>
          <label class="ease-clepsydra-water-clock__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-clepsydra-water-clock__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
