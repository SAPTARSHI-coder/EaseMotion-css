<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Specificity Calculator Safety Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>CSS Specificity Calculator</h1>
    
    <div class="calculator-card">
      <label for="selector-input">Enter CSS Selector:</label>
      <input type="text" id="selector-input" placeholder="e.g., #header .nav > li a:hover" value="#header .nav > li a:hover">
      
      <div id="result-display" class="result-display">
        <strong>Specificity Score:</strong> <span id="score-output">[0, 1, 2, 2]</span>
      </div>
    </div>
  </main>

  <script type="module">
    import { calculateSpecificity } from './specificity.js';

    const input = document.getElementById('selector-input');
    const output = document.getElementById('score-output');

    function update() {
      try {
        const score = calculateSpecificity(input.value);
        output.textContent = `[${score.join(', ')}]`;
        output.classList.remove('error');
      } catch (err) {
        output.textContent = `Error: ${err.message}`;
        output.classList.add('error');
      }
    }

    input.addEventListener('input', update);
    update();
  </script>
</body>
</html>
