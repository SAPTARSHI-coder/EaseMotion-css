<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Profile Stats Row - EaseMotion CSS</title>
  <!-- Import EaseMotion CSS -->
  <link rel="stylesheet" href="../../../easemotion.css">
  <!-- Component Specific Styles -->
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="minimalist-bg">

  <div class="demo-container">
    
    <!-- Profile Card Context -->
    <div class="profile-card ease-glass-card">
      <div class="profile-header">
        <div class="profile-avatar">
          <img src="https://i.pravatar.cc/150?img=32" alt="User Profile Picture" />
        </div>
        <div class="profile-info">
          <h2 class="profile-name">Jane Developer</h2>
          <p class="profile-handle">@jane_codes</p>
        </div>
        <button class="follow-btn ease-squish-button">Follow</button>
      </div>

      <p class="profile-bio">
        Building modern, accessible web interfaces. Open source contributor. Coffee enthusiast. ☕
      </p>

      <!-- Profile Stats Row Component -->
      <div class="profile-stats-row">
        
        <a href="#" class="stat-item" aria-label="142 Posts">
          <span class="stat-value">142</span>
          <span class="stat-label">Posts</span>
        </a>
        
        <div class="stat-divider" aria-hidden="true"></div>
        
        <a href="#" class="stat-item" aria-label="12.8K Followers">
          <span class="stat-value">12.8K</span>
          <span class="stat-label">Followers</span>
        </a>
        
        <div class="stat-divider" aria-hidden="true"></div>
        
        <a href="#" class="stat-item" aria-label="845 Following">
          <span class="stat-value">845</span>
          <span class="stat-label">Following</span>
        </a>

      </div>
    </div>

  </div>

</body>
</html>
