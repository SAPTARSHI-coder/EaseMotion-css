<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Concertina Bellows Fold — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Concertina Bellows Fold demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Concertina Bellows Fold</h1>
      <p class="lede">Concertina bellows folding a pulse of air</p>
    </header>

    <section class="ease-concertina-bellows-fold" data-demo="concertina-bellows-fold" aria-live="polite">
      <div class="ease-concertina-bellows-fold__housing">
        <div class="ease-concertina-bellows-fold__bezel">
          <div class="ease-concertina-bellows-fold__face">
            <div class="ease-concertina-bellows-fold__readout">
              <span class="ease-concertina-bellows-fold__label">Concertina Bellows Fold</span>
              <span class="ease-concertina-bellows-fold__value">LIVE</span>
            </div>
            <div class="ease-concertina-bellows-fold__motion" aria-hidden="true">
              <span class="ease-concertina-bellows-fold__a"></span>
              <span class="ease-concertina-bellows-fold__b"></span>
              <span class="ease-concertina-bellows-fold__c"></span>
              <span class="ease-concertina-bellows-fold__d"></span>
            </div>
            <div class="ease-concertina-bellows-fold__meters">
              <i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-concertina-bellows-fold__controls">
          <button type="button" class="ease-concertina-bellows-fold__btn primary">Pump</button>
          <button type="button" class="ease-concertina-bellows-fold__btn">Hold</button>
          <label class="ease-concertina-bellows-fold__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-concertina-bellows-fold__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
