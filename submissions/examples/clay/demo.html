<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claymorphism Notification Alert Badge Demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background-color: #e0e5ec;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      margin: 0;
    }
    h1 {
      color: #4a5568;
      font-family: system-ui, sans-serif;
      font-size: 1.5rem;
      margin-bottom: 0;
    }
    .demo-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 1.5rem;
      justify-content: center;
    }
  </style>
</head>
<body>

  <h1>Interactive Claymorphism Badges</h1>

  <div class="demo-grid">
    <!-- Default Info Badge -->
    <div class="clay-badge-container">
      <div class="clay-badge">
        <span class="clay-badge__dot"></span>
        Notifications
      </div>
    </div>

    <!-- Success Variant -->
    <div class="clay-badge-container">
      <div class="clay-badge clay-badge--success">
        <span class="clay-badge__dot"></span>
        System Online
      </div>
    </div>

    <!-- Warning Variant -->
    <div class="clay-badge-container">
      <div class="clay-badge clay-badge--warning">
        <span class="clay-badge__dot"></span>
        Disk Space Low
      </div>
    </div>

    <!-- Danger Pulse Variant -->
    <div class="clay-badge-container">
      <div class="clay-badge clay-badge--danger clay-badge--pulse">
        <span class="clay-badge__dot"></span>
        3 Alerts
      </div>
    </div>
  </div>

</body>
</html>
