<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Bounce-Pulse Dropdown - Minimalist Tech</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="layout-container">
        
        <header class="section-header">
            <h1 class="title">Create Menu</h1>
            <p class="subtitle">A minimalist tech dropdown featuring a physical bounce entrance and an ambient pulsing notification dot.</p>
        </header>

        <div class="dashboard-area">
            
            <div class="card">
                
                <!-- 
                   Pure CSS State Management for Dropdown 
                   We use a checkbox to toggle the state of the dropdown menu.
                -->
                <div class="dropdown-wrapper">
                    <input type="checkbox" id="dropdown-toggle" class="dropdown-input">
                    
                    <label for="dropdown-toggle" class="btn btn-trigger">
                        <svg class="plus-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                        <span>New Resource</span>
                        <!-- Pulsing notification dot -->
                        <span class="notification-dot"></span>
                    </label>

                    <!-- The Dropdown Menu -->
                    <div class="dropdown-menu bounce-pulse">
                        <div class="menu-content">
                            
                            <a href="#" class="menu-item list-item">
                                <div class="item-icon color-blue">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="8" rx="2" ry="2"></rect><rect x="2" y="14" width="20" height="8" rx="2" ry="2"></rect></svg>
                                </div>
                                <div class="item-text">
                                    <span class="main">Database Cluster</span>
                                    <span class="sub">PostgreSQL, MySQL, Redis</span>
                                </div>
                            </a>
                            
                            <a href="#" class="menu-item list-item">
                                <div class="item-icon color-emerald">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
                                </div>
                                <div class="item-text">
                                    <span class="main">Serverless Function</span>
                                    <span class="sub">Node.js, Python, Go</span>
                                </div>
                            </a>
                            
                            <a href="#" class="menu-item list-item">
                                <div class="item-icon color-purple">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
                                </div>
                                <div class="item-text">
                                    <span class="main">Storage Bucket</span>
                                    <span class="sub">S3-compatible object storage</span>
                                </div>
                            </a>
                            
                            <div class="menu-divider list-item"></div>

                            <a href="#" class="menu-item list-item">
                                <div class="item-icon color-gray">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                                </div>
                                <div class="item-text">
                                    <span class="main">Import from Template</span>
                                </div>
                            </a>

                        </div>
                    </div> <!-- End Dropdown Menu -->
                </div> <!-- End Dropdown Wrapper -->
                
            </div>
            
        </div>
    </div>

</body>
</html>
