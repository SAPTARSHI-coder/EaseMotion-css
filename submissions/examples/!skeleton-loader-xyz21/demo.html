<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skeleton Loader - EaseMotion CSS Submission</title>
  
  <!-- EaseMotion CSS (Official CDN) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css">
  
  <!-- Local Skeleton Component Styles -->
  <link rel="stylesheet" href="style.css">
  
  <style>
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: var(--ease-color-bg, #f8fafc);
      color: var(--ease-color-text, #0f172a);
      margin: 0;
      padding: 2rem;
    }
    .demo-card {
      background-color: var(--ease-color-surface, #ffffff);
      border-radius: var(--ease-radius-lg, 12px);
      padding: 1.5rem;
      width: 100%;
      max-width: 400px;
      box-shadow: var(--ease-shadow-lg, 0 10px 15px -3px rgba(0, 0, 0, 0.1));
      border: 1px solid var(--ease-color-border, #e2e8f0);
    }
    .header-row {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .text-row {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>

  <div class="ease-center ease-fade-in" style="margin-bottom: 2rem; text-align: center;">
    <h1 class="ease-slide-up">Animated Skeleton Loader</h1>
    <p class="ease-slide-up ease-delay-100" style="color: var(--ease-color-text-muted, #64748b); max-width: 500px;">
      Zero JavaScript. Pure CSS shimmer animation using EaseMotion design tokens.
    </p>
  </div>
  
  <!-- Skeleton Loading State Demo -->
  <div class="demo-card ease-fade-in ease-delay-200">
    <div class="header-row">
      <!-- Circle Skeleton (Avatar) -->
      <div class="ease-skeleton-xyz ease-skeleton-xyz-circle" style="width: 48px; height: 48px;"></div>
      <div style="flex: 1;">
        <!-- Text Skeleton (Title) -->
        <div class="ease-skeleton-xyz" style="width: 60%; height: 20px; margin-bottom: 8px;"></div>
        <!-- Text Skeleton (Subtitle) -->
        <div class="ease-skeleton-xyz" style="width: 40%; height: 16px;"></div>
      </div>
    </div>

    <div class="text-row">
      <!-- Text Skeleton (Paragraph Lines) -->
      <div class="ease-skeleton-xyz" style="width: 100%; height: 16px;"></div>
      <div class="ease-skeleton-xyz" style="width: 90%; height: 16px;"></div>
      <div class="ease-skeleton-xyz" style="width: 70%; height: 16px;"></div>
    </div>

    <!-- Button Skeleton -->
    <div class="ease-skeleton-xyz" style="width: 120px; height: 40px; border-radius: var(--ease-radius-md, 8px); margin-top: 1rem;"></div recent>
  </div>

</body>
</html>
