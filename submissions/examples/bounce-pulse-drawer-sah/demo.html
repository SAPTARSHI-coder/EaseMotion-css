<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bounce-Pulse Portfolio Drawer - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="shell">
    <header class="head">
      <h1>Bounce-Pulse Drawer (<code>#54516</code>)</h1>
      <button class="pulse-trigger" onclick="document.getElementById('drawer-pulse').classList.add('open')">☰ Open Kinetic Pulse Drawer</button>
    </header>
    <p class="hint">Deploy the side navigation panel to observe rhythmic pulsing indicator nodes and energetic bounce transitions.</p>
    
    <div id="drawer-pulse" class="ease-drawer-host">
      <div class="backdrop" onclick="document.getElementById('drawer-pulse').classList.remove('open')"></div>
      <aside class="ease-drawer-pulse">
        <div class="drawer-head">
          <div class="title-row">
            <span class="pulse-ring"></span>
            <h3>⚡ Kinetic UI Studio</h3>
          </div>
          <button class="close-x" onclick="document.getElementById('drawer-pulse').classList.remove('open')">×</button>
        </div>
        
        <nav class="pulse-nav">
          <a href="#" class="pulse-link active"><span>🏠 System Dashboard</span><span class="dot pulse"></span></a>
          <a href="#" class="pulse-link"><span>🎨 WebGL Exhibitions</span><span class="dot"></span></a>
          <a href="#" class="pulse-link"><span>🚀 54 Merged PRs CI</span><span class="dot"></span></a>
          <a href="#" class="pulse-link"><span>⚙️ Houdini Keyframes</span><span class="dot"></span></a>
        </nav>
      </aside>
    </div>
  </div>
</body>
</html>
