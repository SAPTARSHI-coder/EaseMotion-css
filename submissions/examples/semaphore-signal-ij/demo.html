<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-semaphore-signal</title>
</head>
<body>
<main class="sms-card">
  <header class="sms-head">
    <h1 class="sms-title">Signal 4</h1>
    <span class="sms-track">Line B</span>
  </header>
  <section class="sms-post" aria-label="semaphore">
    <span class="sms-arm"></span>
    <span class="sms-arm-end"></span>
    <span class="sms-lamp"></span>
    <span class="sms-pole"></span>
    <span class="sms-base"></span>
  </section>
  <section class="sms-read">
    <span class="sms-label">State</span>
    <strong class="sms-state">Clear</strong>
  </section>
  <footer class="sms-foot">
    <span class="sms-dir">Eastbound</span>
    <span class="sms-next">Next 900 m</span>
  </footer>
</main>
</body>
</html>
