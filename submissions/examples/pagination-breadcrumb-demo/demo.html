<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EaseMotion — Pagination & Breadcrumb</title>
  <link rel="stylesheet" href="../../core/variables.css">
  <link rel="stylesheet" href="../../components/pagination.css">
  <link rel="stylesheet" href="../../components/breadcrumb.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="demo-container">
    <h1>Pagination & Breadcrumb</h1>

    <section class="demo-section">
      <h3>Breadcrumb</h3>
      <nav class="ease-breadcrumb">
        <a href="#" class="ease-breadcrumb-item">Home</a>
        <span class="ease-breadcrumb-sep">/</span>
        <a href="#" class="ease-breadcrumb-item">Products</a>
        <span class="ease-breadcrumb-sep">/</span>
        <span class="ease-breadcrumb-item ease-breadcrumb-active">Shoes</span>
      </nav>
    </section>

    <section class="demo-section">
      <h3>Pagination</h3>
      <nav class="ease-pagination">
        <button class="ease-pagination-btn" disabled>&laquo;</button>
        <button class="ease-pagination-btn ease-pagination-active">1</button>
        <button class="ease-pagination-btn">2</button>
        <button class="ease-pagination-btn">3</button>
        <button class="ease-pagination-btn">4</button>
        <button class="ease-pagination-btn">&raquo;</button>
      </nav>
    </section>

    <section class="demo-section">
      <h3>Compact Pagination</h3>
      <nav class="ease-pagination ease-pagination-compact">
        <button class="ease-pagination-btn">&lsaquo;</button>
        <span class="ease-pagination-info">Page 3 of 10</span>
        <button class="ease-pagination-btn">&rsaquo;</button>
      </nav>
    </section>
  </div>
</body>
</html>
