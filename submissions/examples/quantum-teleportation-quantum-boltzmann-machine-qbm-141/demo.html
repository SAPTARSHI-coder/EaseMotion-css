<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Boltzmann Machine QBM - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css"></head><body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030712; color: #ffffff;">

    <div class="ease-card ease-card-glass qbm-container">
        <div class="qbm-header">
            <h2>Quantum Boltzmann Machine</h2>
            <span class="ease-badge ease-badge-success">Quantum Machine Learning</span>
        </div>
        
        <div class="qbm-screen ease-center">
            <div class="qbm-flux flux-qbm-a"></div>
            <div class="qbm-flux flux-qbm-b"></div>
            <div class="qbm-boundary-ring"></div>
            <div class="qbm-core ease-center"></div>
        </div>

        <div class="qbm-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Thermal States &amp; Visible-Hidden Weights</span>
            <button class="ease-btn ease-btn-success ease-btn-sm ease-hover-grow">Run QBM Sampling</button>
        </div>
    </div></body></html>
