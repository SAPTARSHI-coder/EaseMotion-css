<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Morph-Glow Popover - EaseMotion CSS</title>
  <!-- Import EaseMotion CSS -->
  <link rel="stylesheet" href="../../../easemotion.css">
  <!-- Component Specific Styles -->
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body class="secure-checkout-bg">

  <div class="demo-container">
    
    <div class="checkout-panel ease-glass-card">
      <div class="checkout-header">
        <h2 class="ease-text-xl">Secure Checkout</h2>
        <div class="security-badge">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
          256-bit Encrypted
        </div>
      </div>

      <div class="checkout-body">
        
        <div class="premium-upsell">
          <div class="upsell-text">
            <h3>EaseMotion Premium Protection</h3>
            <p>Add comprehensive shipping insurance for just $2.99.</p>
          </div>
          
          <!-- Morph-Glow Popover Component -->
          <div class="popover-wrapper" tabindex="0">
            <button class="info-btn" aria-label="Learn about Premium Protection" type="button">
              Learn More
            </button>
            
            <!-- The Popover Content -->
            <div class="morph-glow-popover popover-left">
              
              <!-- The organic morphing glow background -->
              <div class="morph-glow-aura"></div>
              
              <!-- The actual popover card sitting above the glow -->
              <div class="popover-content-card">
                <div class="popover-header">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
                  Coverage Details
                </div>
                <div class="popover-body">
                  <ul>
                    <li>Protects against theft, damage, and loss.</li>
                    <li>Instant resolution and re-shipping.</li>
                    <li>No deductible required.</li>
                  </ul>
                </div>
              </div>
              <div class="popover-arrow"></div>
            </div>
            
          </div>
        </div>

        <div class="mock-form">
          <div class="form-group">
            <label>Cardholder Name</label>
            <div class="mock-input">Jane Doe</div>
          </div>
          <div class="form-group">
            <label>Card Number</label>
            <div class="mock-input">
              <svg width="24" height="16" viewBox="0 0 24 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1" y="2" width="22" height="12" rx="2" ry="2"></rect><line x1="1" y1="6" x2="23" y2="6"></line></svg>
              **** **** **** 4242
            </div>
          </div>
        </div>
        
      </div>
      
      <div class="checkout-footer">
        <button class="pay-btn ease-squish-button">Place Order • $145.49</button>
      </div>
    </div>

  </div>

</body>
</html>
