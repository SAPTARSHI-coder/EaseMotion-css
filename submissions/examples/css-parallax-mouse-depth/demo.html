<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="CSS-only parallax mouse depth effect"
  >

  <title>CSS Parallax Mouse Depth</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="parallax-demo">

    <section
      class="depth-scene"
      aria-labelledby="parallax-title"
    >

      <div class="depth-card">

        <div class="depth-glow" aria-hidden="true"></div>

        <div class="depth-layer depth-back" aria-hidden="true">
          <span class="shape shape-one"></span>
          <span class="shape shape-two"></span>
          <span class="shape shape-three"></span>
        </div>

        <div class="depth-layer depth-middle" aria-hidden="true">
          <div class="orbit orbit-one"></div>
          <div class="orbit orbit-two"></div>
        </div>

        <div class="depth-content">
          <p class="eyebrow">CSS MOTION</p>

          <h1 id="parallax-title">
            Parallax Mouse Depth
          </h1>

          <p class="description">
            Move your pointer over the card to explore
            the layered depth effect.
          </p>

          <a
            class="depth-button"
            href="#details"
            aria-label="Explore the parallax effect"
          >
            Explore Effect
            <span aria-hidden="true">→</span>
          </a>
        </div>

        <div class="depth-layer depth-front" aria-hidden="true">
          <div class="floating-dot dot-one"></div>
          <div class="floating-dot dot-two"></div>
          <div class="floating-dot dot-three"></div>
        </div>

      </div>

    </section>

    <section id="details" class="details">
      <h2>CSS-only depth</h2>
      <p>
        This demo uses CSS perspective, transforms, transitions,
        and hover states to create a layered parallax experience.
      </p>
    </section>

  </main>

</body>
</html>
