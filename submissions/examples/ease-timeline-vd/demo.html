<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ease Timeline</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="timeline">

    <div class="timeline-item">
        <div class="timeline-marker"></div>
        <div class="timeline-content">
            <span class="timeline-date">Today</span>
            <h3>Project Started</h3>
            <p>The project workspace was created and the initial setup was completed.</p>
        </div>
    </div>

    <div class="timeline-item">
        <div class="timeline-marker"></div>
        <div class="timeline-content">
            <span class="timeline-date">Yesterday</span>
            <h3>Design Completed</h3>
            <p>The main interface design was reviewed and finalized.</p>
        </div>
    </div>

    <div class="timeline-item">
        <div class="timeline-marker"></div>
        <div class="timeline-content">
            <span class="timeline-date">2 Days Ago</span>
            <h3>Planning Started</h3>
            <p>Requirements were collected and the project roadmap was prepared.</p>
        </div>
    </div>

</div>

</body>
</html>
