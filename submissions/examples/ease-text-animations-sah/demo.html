<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Text Animation Utilities - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="text-gallery">
    <div class="anim-section">
      <span class="label"><code>ease-text-blur-in</code></span>
      <h1 class="ease-text-blur-in">Materialize From The Mist</h1>
    </div>
    <div class="anim-section">
      <span class="label"><code>ease-text-clip-reveal</code></span>
      <h1 class="ease-text-clip-reveal">Precision Clip Reveal</h1>
    </div>
    <div class="anim-section">
      <span class="label"><code>ease-text-split-fade</code></span>
      <h1 class="ease-text-split-fade">Dynamic Motion Typography</h1>
    </div>
  </div>
</body>
</html>
