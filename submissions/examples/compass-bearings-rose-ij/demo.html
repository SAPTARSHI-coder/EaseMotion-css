<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-compass-bearings-rose demo</title>
</head>
<body>
<div class="cp-app">
  <span class="cp-model">NORDIC 460</span>
  <div class="cp-dial">
    <span class="cp-tick cp-tick-1"></span>
    <span class="cp-tick cp-tick-2"></span>
    <span class="cp-tick cp-tick-3"></span>
    <span class="cp-tick cp-tick-4"></span>
    <span class="cp-tick cp-tick-5"></span>
    <span class="cp-tick cp-tick-6"></span>
    <span class="cp-tick cp-tick-7"></span>
    <span class="cp-tick cp-tick-8"></span>
    <span class="cp-cardinal cp-n">N</span>
    <span class="cp-cardinal cp-e">E</span>
    <span class="cp-cardinal cp-s">S</span>
    <span class="cp-cardinal cp-w">W</span>
    <span class="cp-cardinal cp-inter cp-ne">NE</span>
    <span class="cp-cardinal cp-inter cp-se">SE</span>
    <span class="cp-cardinal cp-inter cp-sw">SW</span>
    <span class="cp-cardinal cp-inter cp-nw">NW</span>
    <div class="cp-needle">
      <span class="cp-north"></span>
      <span class="cp-south"></span>
    </div>
    <span class="cp-hub"></span>
  </div>
  <span class="cp-readout">012&#176;</span>
  <span class="cp-caption">HEADING</span>
</div>
</body>
</html>
