<!-- submissions/examples/parallax-minimalist-avatar/demo.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parallax Minimalist Avatar | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="demo-container">
    
    <!-- Parallax Avatar Wrapper -->
    <div class="ease-parallax-wrapper" tabindex="0" role="img" aria-label="Interactive Parallax User Avatar">
      
      <div class="ease-parallax-avatar">
        <!-- Using a free placeholder avatar for the demo -->
        <img src="https://i.pravatar.cc/300?img=47" alt="User Profile" class="ease-avatar-image">
        
        <!-- Parallax Badge Element -->
        <div class="ease-avatar-badge">Pro</div>
      </div>
      
    </div>

    <p class="demo-hint">Hover or tab to the avatar to trigger the 3D parallax depth effect.</p>

  </main>

</body>
</html>
