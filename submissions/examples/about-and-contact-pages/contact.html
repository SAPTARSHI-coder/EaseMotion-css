<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Contact Us — EaseMotion CSS</title>

  <link rel="stylesheet" href="../core/variables.css">
  <link rel="stylesheet" href="../core/base.css">
  <link rel="stylesheet" href="../core/animations.css">
  <link rel="stylesheet" href="../core/utilities.css">
  <link rel="stylesheet" href="../components/navbar.css">

  <link rel="stylesheet" href="pages.css">
</head>

<body>

  <nav class="demo-nav">
    <div class="ease-container demo-nav-inner">

      <a href="demo.html" class="demo-logo">
        <img
          src="../docs/assets/logo.svg"
          alt="EaseMotion CSS"
          class="demo-logo-img"
        >
      </a>

      <ul class="demo-nav-links">
        <li><a href="demo.html#buttons">Buttons</a></li>
        <li><a href="demo.html#cards">Cards</a></li>
        <li><a href="demo.html#animations">Animations</a></li>
        <li><a href="demo.html#layout">Layout</a></li>
        <li><a href="../docs/index.html">Docs</a></li>
        <li><a href="about.html">About Us</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>

    </div>
  </nav>


  <main class="page-main">

    <div class="page-container">

      <section class="page-hero ease-slide-up">

        <div class="page-label">
          Get in Touch
        </div>

        <h1 class="page-title">
          Contact Us
        </h1>

        <p class="page-subtitle">
          Have a question, suggestion, or idea for EaseMotion?
          We'd love to hear from you.
        </p>

      </section>


      <form class="contact-form ease-slide-up">

        <label for="name">Name</label>

        <input
          type="text"
          id="name"
          name="name"
          placeholder="Enter your name"
          required
        >


        <label for="email">Email</label>

        <input
          type="email"
          id="email"
          name="email"
          placeholder="Enter your email"
          required
        >


        <label for="message">Message</label>

        <textarea
          id="message"
          name="message"
          placeholder="Write your message..."
          required
        ></textarea>


        <button
          type="submit"
          class="ease-btn ease-btn-primary ease-btn-lg ease-hover-grow"
        >
          Send Message
        </button>

      </form>

    </div>

  </main>

</body>
</html>
