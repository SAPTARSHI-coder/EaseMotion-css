<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum LDPC Codes QLDPC - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css"></head><body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030712; color: #ffffff;">

    <div class="ease-card ease-card-glass qldpc-container">
        <div class="qldpc-header">
            <h2>Quantum LDPC Codes</h2>
            <span class="ease-badge ease-badge-success">Quantum Error Correction</span>
        </div>
        
        <div class="qldpc-screen ease-center">
            <div class="qldpc-flux flux-qldpc-a"></div>
            <div class="qldpc-flux flux-qldpc-b"></div>
            <div class="qldpc-boundary-ring"></div>
            <div class="qldpc-core ease-center"></div>
        </div>

        <div class="qldpc-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Sparse Parity Checks &amp; High-Rate Fault Tolerance</span>
            <button class="ease-btn ease-btn-success ease-btn-sm ease-hover-grow">Run QLDPC Codes</button>
        </div>
    </div></body></html>
