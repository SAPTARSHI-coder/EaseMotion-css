<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ripple Wave Progress Bar</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<section class="progress-section">

<h1>Mission Progress</h1>

<p class="subtitle">
Complete challenges to unlock exclusive gaming rewards.
</p>

<div class="progress-card">

<div class="progress-info">
<span>XP Progress</span>
<span>78%</span>
</div>

<div class="progress-bar">

<div class="progress-fill">

<span class="wave wave1"></span>
<span class="wave wave2"></span>
<span class="wave wave3"></span>

</div>

</div>

<p class="status">
Level 18 • 2 Missions Remaining
</p>

</div>

</section>

</body>
</html>
