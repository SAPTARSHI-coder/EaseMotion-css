<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Card with Gradient Shine</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div
    class="gradient-shine-card"
    tabindex="0"
    role="article"
    aria-label="Gradient shine card demo"
  >
    <h2>Gradient Shine Card</h2>
    <p>
      Hover over this card to see a smooth diagonal shine sweep across
      the surface. The effect is built entirely with CSS using a
      pseudo-element and gradient animation.
    </p>
  </div>

</body>
</html>
