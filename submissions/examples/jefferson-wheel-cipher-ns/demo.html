<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jefferson Wheel Cipher — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Jefferson Wheel Cipher demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Jefferson Wheel Cipher</h1>
      <p class="lede">Jefferson wheel cipher aligning a offset row</p>
    </header>

    <section class="ease-jefferson-wheel-cipher" data-demo="jefferson-wheel-cipher" aria-live="polite">
      <div class="ease-jefferson-wheel-cipher__housing">
        <div class="ease-jefferson-wheel-cipher__bezel">
          <div class="ease-jefferson-wheel-cipher__face">
            <div class="ease-jefferson-wheel-cipher__readout">
              <span class="ease-jefferson-wheel-cipher__label">Jefferson Wheel Cipher</span>
              <span class="ease-jefferson-wheel-cipher__value">LIVE</span>
            </div>
            <div class="ease-jefferson-wheel-cipher__motion" aria-hidden="true">
              <span class="ease-jefferson-wheel-cipher__a"></span>
              <span class="ease-jefferson-wheel-cipher__b"></span>
              <span class="ease-jefferson-wheel-cipher__c"></span>
              <span class="ease-jefferson-wheel-cipher__d"></span>
            </div>
            <div class="ease-jefferson-wheel-cipher__meters">
              <i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-jefferson-wheel-cipher__controls">
          <button type="button" class="ease-jefferson-wheel-cipher__btn primary">Align</button>
          <button type="button" class="ease-jefferson-wheel-cipher__btn">Scramble</button>
          <label class="ease-jefferson-wheel-cipher__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-jefferson-wheel-cipher__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
