<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memory Card Grid Component - Play Category</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="ease-mem-stage" aria-labelledby="stage-title">
    <div class="ease-mem-header">
      <h1 id="stage-title" class="ease-mem-title">Memory Grid Shuffle</h1>
      <p class="ease-mem-desc">A 3x3 grid of memory cards performing a staggered wave reveal.</p>
    </div>

    <!-- Memory Card Grid Component -->
    <div class="ease-mem-grid" id="mem-grid" role="region" aria-label="Memory Card Grid Animation">
      <!-- Row 1 -->
      <div class="ease-mem-card" style="--col: 1; --row: 1;"><div class="ease-mem-inner"><div class="ease-face ease-face-back">?</div><div class="ease-face ease-face-front">★</div></div></div>
      <div class="ease-mem-card" style="--col: 2; --row: 1;"><div class="ease-mem-inner"><div class="ease-face ease-face-back">?</div><div class="ease-face ease-face-front">◆</div></div></div>
      <div class="ease-mem-card" style="--col: 3; --row: 1;"><div class="ease-mem-inner"><div class="ease-face ease-face-back">?</div><div class="ease-face ease-face-front">●</div></div></div>
      <!-- Row 2 -->
      <div class="ease-mem-card" style="--col: 1; --row: 2;"><div class="ease-mem-inner"><div class="ease-face ease-face-back">?</div><div class="ease-face ease-face-front">▲</div></div></div>
      <div class="ease-mem-card" style="--col: 2; --row: 2;"><div class="ease-mem-inner"><div class="ease-face ease-face-back">?</div><div class="ease-face ease-face-front">★</div></div></div>
      <div class="ease-mem-card" style="--col: 3; --row: 2;"><div class="ease-mem-inner"><div class="ease-face ease-face-back">?</div><div class="ease-face ease-face-front">■</div></div></div>
      <!-- Row 3 -->
      <div class="ease-mem-card" style="--col: 1; --row: 3;"><div class="ease-mem-inner"><div class="ease-face ease-face-back">?</div><div class="ease-face ease-face-front">●</div></div></div>
      <div class="ease-mem-card" style="--col: 2; --row: 3;"><div class="ease-mem-inner"><div class="ease-face ease-face-back">?</div><div class="ease-face ease-face-front">▲</div></div></div>
      <div class="ease-mem-card" style="--col: 3; --row: 3;"><div class="ease-mem-inner"><div class="ease-face ease-face-back">?</div><div class="ease-face ease-face-front">◆</div></div></div>
    </div>

    <button type="button" class="ease-btn-mem" id="replay-btn">Replay Wave Reveal</button>
  </main>

  <script>
    const grid = document.getElementById('mem-grid');
    const replayBtn = document.getElementById('replay-btn');

    replayBtn.addEventListener('click', () => {
      grid.classList.add('is-animating');
      void grid.offsetWidth; // Trigger DOM reflow
      grid.classList.remove('is-animating');
    });
  </script>
</body>
</html>
