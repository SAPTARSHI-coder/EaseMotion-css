<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Folding Ticket</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="ticket-container">
        <div class="ticket top">
            <div class="content">
                <h2>ADMIT ONE</h2>
                <p>VIP PASS</p>
            </div>
        </div>
        <div class="ticket bottom">
            <div class="content">
                <p>ROW: 12 SEAT: 4A</p>
                <div class="barcode">|| | ||| | || ||| ||</div>
            </div>
        </div>
    </div>
</body>
</html>
