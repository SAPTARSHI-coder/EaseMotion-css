<!DOCTYPE html>

</head>
<body>

        <label for="menu-toggle" class="menu-button">
            <span class="icon"></span>
        </label>
        <ul class="circular-menu">
            <li class="menu-item"><a href="#" title="Home">🏠</a></li>
            <li class="menu-item"><a href="#" title="Search">🔍</a></li>
            <li class="menu-item"><a href="#" title="Favorites">❤️</a></li>
            <li class="menu-item"><a href="#" title="Profile">👤</a></li>
        </ul>
    </div>
</body>
</html>
