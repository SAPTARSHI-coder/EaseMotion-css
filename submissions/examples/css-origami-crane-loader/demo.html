<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Origami Crane Loader</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="loader-demo">
    <div
      class="crane-loader"
      role="status"
      aria-label="Loading"
    >
      <span class="crane" aria-hidden="true">
        <span class="wing wing-left"></span>
        <span class="wing wing-right"></span>
        <span class="body"></span>
        <span class="neck"></span>
        <span class="head"></span>
        <span class="beak"></span>
        <span class="tail tail-left"></span>
        <span class="tail tail-right"></span>
      </span>

      <span class="loading-text">Loading...</span>
    </div>
  </main>
</body>
</html>
