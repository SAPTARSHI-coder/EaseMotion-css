<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lighthouse Beam Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="shore" aria-label="lighthouse at night">
    <div class="lighthouse" aria-hidden="true">
      <span class="tower"></span>
      <span class="lantern" id="lantern"></span>
      <span class="roof"></span>
      <span class="beam" aria-hidden="true"></span>
      <span class="stripe stripe1"></span>
      <span class="stripe stripe2"></span>
    </div>
    <div class="sea" aria-hidden="true"></div>
    <div class="boat" aria-hidden="true"></div>
    <button class="lamp-btn" id="lampBtn" type="button">Toggle Lamp</button>
    <p class="caption">The beam sweeps the bay while a boat rocks below.</p>
  </main>
  <script>
    const lantern = document.getElementById("lantern");
    const btn = document.getElementById("lampBtn");
    btn.addEventListener("click", () => {
      lantern.classList.toggle("lit");
      btn.textContent = lantern.classList.contains("lit") ? "Douse Lamp" : "Toggle Lamp";
    });
  </script>
</body>
</html>
