<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Stamp Collection Card - EaseMotion CSS</title>
  <!-- Import EaseMotion CSS -->
  <link rel="stylesheet" href="../../../easemotion.css">
  <!-- Component Specific Styles -->
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,400&family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body class="minimalist-bg">

  <div class="demo-container">
    
    <div class="header-section">
      <h1 class="ease-text-3xl">Stamp Collection Card</h1>
      <p class="ease-color-muted">A vintage postage stamp created entirely with CSS gradients and drop-shadows. No SVG masks or images used for the perforated edges.</p>
    </div>

    <!-- The Stamp Component Wrapper (handles the drop shadow) -->
    <div class="stamp-wrapper">
      
      <!-- The Stamp Card (handles the perforated background) -->
      <article class="stamp-card" aria-label="Vintage 32 cent postage stamp featuring a landscape">
        
        <!-- The Inner Stamp Design -->
        <div class="stamp-inner">
          <div class="stamp-image">
            <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=400&q=80" alt="Vintage mountain landscape">
            
            <!-- CSS Postmark Overlay -->
            <div class="postmark">
              <div class="postmark-circle">NEW YORK<br>OCT 24<br>1932</div>
              <div class="postmark-lines"></div>
            </div>
          </div>
          
          <div class="stamp-footer">
            <span class="stamp-country">USA</span>
            <span class="stamp-value">32&cent;</span>
          </div>
        </div>

      </article>

    </div>

  </div>

</body>
</html>
