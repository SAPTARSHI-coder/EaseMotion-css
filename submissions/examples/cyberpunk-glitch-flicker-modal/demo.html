<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Glitch-Flicker Modal - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="cp-layout">
        <input type="checkbox" id="cp-modal-toggle" class="cp-hidden-toggle">
        
        <main class="cp-main-content">
            <h1 class="cp-header">N30N_C0R3 // TERMINAL</h1>
            <p>Access the mainframe to override local subsystems.</p>
            <label for="cp-modal-toggle" class="cp-btn cp-trigger-btn" tabindex="0">
                INITIATE BREACH
                <span class="cp-btn-decor"></span>
            </label>
        </main>

        <div class="cp-modal-container">
            <label for="cp-modal-toggle" class="cp-modal-backdrop"></label>
            
            <div class="cp-modal-box">
                <div class="cp-modal-border"></div>
                <div class="cp-modal-inner">
                    <div class="cp-modal-header">
                        <h2 class="cp-glitch-text" data-text="SYSTEM WARNING">SYSTEM WARNING</h2>
                    </div>
                    
                    <div class="cp-modal-body">
                        <p class="cp-flicker-text">UNAUTHORIZED ACCESS DETECTED IN SECTOR 7G. PROTOCOLS OVERRIDDEN.</p>
                        <div class="cp-data-bars">
                            <div class="cp-bar"></div>
                            <div class="cp-bar"></div>
                            <div class="cp-bar"></div>
                        </div>
                        <p>Proceeding will permanently alter network topology. Do you wish to continue?</p>
                    </div>

                    <div class="cp-modal-footer">
                        <label for="cp-modal-toggle" class="cp-btn cp-btn-cancel" tabindex="0">ABORT</label>
                        <button class="cp-btn cp-btn-danger">EXECUTE</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
