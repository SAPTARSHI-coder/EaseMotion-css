<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Fade-In Progress Bar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<section class="container">

    <div class="hero">

        <span class="tag">Creative Portfolio</span>

        <h1>Creative Skills Progress</h1>

        <p>
            Elegant Fade-In progress bars built with pure HTML5 and CSS3,
            featuring glassmorphism styling, smooth animations, and fully
            responsive layouts.
        </p>

    </div>

    <div class="progress-card">

        <div class="progress-item">

            <div class="label">
                <span>UI / UX Design</span>
                <span>95%</span>
            </div>

            <div class="progress">
                <div class="fill ui"></div>
            </div>

        </div>

        <div class="progress-item">

            <div class="label">
                <span>Frontend Development</span>
                <span>90%</span>
            </div>

            <div class="progress">
                <div class="fill frontend"></div>
            </div>

        </div>

        <div class="progress-item">

            <div class="label">
                <span>React</span>
                <span>85%</span>
            </div>

            <div class="progress">
                <div class="fill react"></div>
            </div>

        </div>

        <div class="progress-item">

            <div class="label">
                <span>Creative Branding</span>
                <span>80%</span>
            </div>

            <div class="progress">
                <div class="fill branding"></div>
            </div>

        </div>

    </div>

</section>

</body>
</html>
