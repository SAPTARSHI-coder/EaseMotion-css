<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CSS sortable column table with column indicators and active state">
  <title>Sortable Column Table — EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="sct-nav">
    <span class="sct-nav__brand">EaseMotion</span>
    <span class="sct-nav__gap"></span>
    <span class="sct-nav__item">Components</span>
  </nav>

  <header class="sct-header">
    <h1 class="sct-header__title">Sortable Column Table</h1>
    <p class="sct-header__sub">Table headers with CSS sort indicators. Hover to see the active state.</p>
  </header>

  <main class="sct-wrap">
    <table class="sct-table" aria-label="Team members">
      <thead>
        <tr>
          <th class="sct-th sct-th--active" aria-sort="ascending">
            <span class="sct-th__text">Name</span>
            <span class="sct-th__arrow"></span>
          </th>
          <th class="sct-th">
            <span class="sct-th__text">Role</span>
            <span class="sct-th__arrow"></span>
          </th>
          <th class="sct-th">
            <span class="sct-th__text">Status</span>
            <span class="sct-th__arrow"></span>
          </th>
          <th class="sct-th sct-th--num">
            <span class="sct-th__text">Commits</span>
            <span class="sct-th__arrow"></span>
          </th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td class="sct-td">Anika Patel</td>
          <td class="sct-td">Frontend</td>
          <td class="sct-td"><span class="sct-pill sct-pill--green">Active</span></td>
          <td class="sct-td sct-td--num">142</td>
        </tr>
        <tr>
          <td class="sct-td">Marco Rossi</td>
          <td class="sct-td">Backend</td>
          <td class="sct-td"><span class="sct-pill sct-pill--green">Active</span></td>
          <td class="sct-td sct-td--num">98</td>
        </tr>
        <tr>
          <td class="sct-td">Yuki Tanaka</td>
          <td class="sct-td">DevOps</td>
          <td class="sct-td"><span class="sct-pill sct-pill--amber">Away</span></td>
          <td class="sct-td sct-td--num">67</td>
        </tr>
        <tr>
          <td class="sct-td">Lena Kowalski</td>
          <td class="sct-td">Design</td>
          <td class="sct-td"><span class="sct-pill sct-pill--green">Active</span></td>
          <td class="sct-td sct-td--num">53</td>
        </tr>
        <tr>
          <td class="sct-td">Omar Hassan</td>
          <td class="sct-td">Frontend</td>
          <td class="sct-td"><span class="sct-pill sct-pill--red">Offline</span></td>
          <td class="sct-td sct-td--num">31</td>
        </tr>
      </tbody>
    </table>
  </main>

</body>
</html>
