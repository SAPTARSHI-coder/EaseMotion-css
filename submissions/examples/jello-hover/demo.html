<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jello Hover Effects Demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background-color: #fce7f3;
      gap: 2rem;
    }
    .demo-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4rem;
    }
    .box {
      width: 160px;
      height: 160px;
      background: #ec4899;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      font-size: 1.1rem;
      text-align: center;
      box-shadow: 0 10px 25px rgba(236, 72, 153, 0.4);
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="demo-grid">
    <div class="box jello-horizontal-ag">Hover Me<br>(Horizontal)</div>
    <div class="box jello-vertical-ag" style="background: #8b5cf6; box-shadow: 0 10px 25px rgba(139, 92, 246, 0.4);">Hover Me<br>(Vertical)</div>
  </div>

  <p style="color: #831843; margin-top: 2rem;">Hover over the boxes to see the elastic jello effect.</p>

</body>
</html>
