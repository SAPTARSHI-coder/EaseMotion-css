<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-bingo-card-grid</title>
</head>
<body>
<main class="bcg-card">
  <header class="bcg-head">
    <h1 class="bcg-title">Bingo</h1>
    <span class="bcg-round">Round 12</span>
  </header>
  <section class="bcg-letters">
    <span class="bcg-letter">B</span>
    <span class="bcg-letter">I</span>
    <span class="bcg-letter">N</span>
    <span class="bcg-letter">G</span>
    <span class="bcg-letter">O</span>
  </section>
  <section class="bcg-grid" aria-label="bingo card">
    <span class="bcg-cell">3</span>
    <span class="bcg-cell">17</span>
    <span class="bcg-cell">32</span>
    <span class="bcg-cell">49</span>
    <span class="bcg-cell">62</span>
    <span class="bcg-cell">9</span>
    <span class="bcg-cell">24</span>
    <span class="bcg-cell">40</span>
    <span class="bcg-cell bcg-cell-free">FREE</span>
    <span class="bcg-cell">68</span>
    <span class="bcg-cell">12</span>
    <span class="bcg-cell">29</span>
    <span class="bcg-cell">44</span>
    <span class="bcg-cell">57</span>
    <span class="bcg-cell">72</span>
    <span class="bcg-cell bcg-cell-mark">5</span>
    <span class="bcg-cell">21</span>
    <span class="bcg-cell">38</span>
    <span class="bcg-cell">52</span>
    <span class="bcg-cell">64</span>
    <span class="bcg-cell">7</span>
    <span class="bcg-cell">26</span>
    <span class="bcg-cell">41</span>
    <span class="bcg-cell">59</span>
    <span class="bcg-cell">74</span>
  </section>
  <div class="bcg-call">
    <span class="bcg-call-label">Last call</span>
    <strong class="bcg-call-num">B-5</strong>
  </div>
  <footer class="bcg-foot">
    <span class="bcg-pattern">Diagonal near</span>
  </footer>
</main>
</body>
</html>
