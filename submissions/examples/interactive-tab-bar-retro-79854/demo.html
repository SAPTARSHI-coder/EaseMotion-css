<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Retro Tab Bar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>Retro Tab Bar</h1>

    <div class="tab-bar">

        <input type="radio" name="tabs" id="home" checked>
        <label for="home">Home</label>

        <input type="radio" name="tabs" id="games">
        <label for="games">Games</label>

        <input type="radio" name="tabs" id="arcade">
        <label for="arcade">Arcade</label>

        <input type="radio" name="tabs" id="profile">
        <label for="profile">Profile</label>

    </div>

</div>

</body>
</html>
