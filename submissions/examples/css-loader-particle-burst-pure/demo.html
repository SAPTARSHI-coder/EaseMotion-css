<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Loader: Particle Burst</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="layout-container">
        
        <header class="section-header">
            <h1 class="title">Pure CSS Loader: Particle Burst</h1>
            <p class="subtitle">A dynamic explosion of colorful particles simulating a localized big bang, utilizing precise CSS transform translations and staggered delays.</p>
        </header>

        <div class="demo-area">
            
            <div class="loader-container" aria-label="Loading content, particle burst animation playing">
                
                <!-- 
                  [TECHNIQUE] Particle Burst
                  The center hub absorbs energy and then explodes 
                  outward into multiple smaller particle divs.
                -->
                <div class="burst-wrapper" aria-hidden="true">
                    
                    <div class="center-core"></div>
                    
                    <!-- 
                       We define 8 particles to shoot out in 8 directions:
                       N, NE, E, SE, S, SW, W, NW 
                    -->
                    <div class="particle p-n"></div>
                    <div class="particle p-ne"></div>
                    <div class="particle p-e"></div>
                    <div class="particle p-se"></div>
                    <div class="particle p-s"></div>
                    <div class="particle p-sw"></div>
                    <div class="particle p-w"></div>
                    <div class="particle p-nw"></div>
                    
                </div>
                
                <div class="loading-text">Generating...</div>
                
            </div>
            
        </div>
        
    </div>

</body>
</html>
