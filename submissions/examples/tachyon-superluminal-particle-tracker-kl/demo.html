<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tachyon Superluminal Particle Tracker - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #180208; color: #ffffff;">

    <div class="ease-card ease-card-glass tachyon-container">
        <div class="tachyon-header">
            <h2>Tachyon Tracker</h2>
            <span class="ease-badge ease-badge-danger">Superluminal</span>
        </div>
        
        <div class="tachyon-screen ease-center">
            <div class="cherenkov-wake wake-1"></div>
            <div class="cherenkov-wake wake-2"></div>
            <div class="mass-shell-ring"></div>
            <div class="imaginary-mass-core ease-center"></div>
        </div>

        <div class="tachyon-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Velocity: 3.42 c</span>
            <button class="ease-btn ease-btn-primary ease-btn-sm ease-hover-grow">Detect Tachyon</button>
        </div>
    </div>

</body>
</html>
