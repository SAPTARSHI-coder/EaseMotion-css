<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Sci-Fi HUD: Metallic Sheen</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <main class="metallic-hud-container" role="region" aria-label="Armored Core Dashboard">
    
    <!-- Metallic Rivets -->
    <div class="rivet rivet-tl" aria-hidden="true"></div>
    <div class="rivet rivet-tr" aria-hidden="true"></div>
    <div class="rivet rivet-bl" aria-hidden="true"></div>
    <div class="rivet rivet-br" aria-hidden="true"></div>

    <!-- Inset Digital Screen -->
    <div class="hud-screen">
      <h2 class="screen-title">Reactor Status</h2>
      
      <div class="screen-data">
        <span>Coolant Pressure</span>
        <span class="data-value">1200 PSI</span>
      </div>
      <div class="screen-data">
        <span>Core Temperature</span>
        <span class="data-value danger" aria-live="assertive">4500 K</span>
      </div>
      <div class="screen-data">
        <span>Containment Field</span>
        <span class="data-value">NOMINAL</span>
      </div>

      <!-- Radar Animation -->
      <div class="radar-container" aria-hidden="true">
        <div class="radar-sweep"></div>
        <div class="radar-target"></div>
      </div>
    </div>

  </main>

</body>
</html>
