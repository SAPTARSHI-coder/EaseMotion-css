<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Pure CSS camera shutter animation with accessible keyboard interaction."
  >

  <title>CSS Camera Shutter</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="page">

    <section class="demo-card" aria-labelledby="demo-title">

      <header class="demo-header">
        <span class="eyebrow">EaseMotion CSS</span>
        <h1 id="demo-title">Camera Shutter</h1>
        <p>
          A cinematic camera shutter animation built entirely with CSS.
        </p>
      </header>

      <div class="camera-stage">

        <div class="camera" aria-hidden="true">

          <div class="camera-top">
            <span class="camera-hump"></span>
          </div>

          <div class="camera-body">

            <div class="viewfinder">
              <span></span>
            </div>

            <div class="lens">

              <div class="lens-ring">
                <div class="lens-glass">
                  <div class="lens-reflection"></div>
                </div>
              </div>

            </div>

            <div class="camera-light"></div>

          </div>

        </div>

        <input
          type="checkbox"
          id="shutter-toggle"
          class="shutter-toggle"
        >

        <label
          for="shutter-toggle"
          class="shutter-button"
          aria-label="Capture photo"
        >
          <span class="button-icon" aria-hidden="true"></span>
          <span>Capture</span>
        </label>

        <p class="interaction-hint">
          Press <kbd>Enter</kbd> or <kbd>Space</kbd> after focusing the button.
        </p>

      </div>

      <div
        class="status"
        role="status"
        aria-live="polite"
      >
        <span class="status-dot" aria-hidden="true"></span>
        <span class="status-text">
          Ready to capture
        </span>
      </div>

    </section>

  </main>

</body>
</html>
