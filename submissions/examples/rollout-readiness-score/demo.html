<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rollout Readiness Score</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="scoreboard">
    <section class="summary">
      <p>Release Control</p>
      <h1>Rollout Readiness Score</h1>
      <span>Ready score: 84%</span>
    </section>

    <section class="checks" aria-label="Rollout readiness checks">
      <article>
        <strong>Smoke coverage</strong>
        <span class="good">96%</span>
        <p>Critical journeys passed on the current release candidate.</p>
      </article>
      <article>
        <strong>Rollback plan</strong>
        <span class="warn">Review</span>
        <p>Owner confirmation is pending for one regional service.</p>
      </article>
      <article>
        <strong>Traffic guard</strong>
        <span class="good">Armed</span>
        <p>Canary limits and pause rules are ready for rollout.</p>
      </article>
    </section>
  </main>
</body>
</html>
