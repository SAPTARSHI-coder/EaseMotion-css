<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Pinball Machine - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Reset Form Wrapper for CSS Counter Scorekeeping -->
  <form class="pinball-cabinet" role="application" aria-label="Pure CSS Pinball Machine">
    
    <!-- Manual Trigger Targets for Extra Clicking Fun (increases score via CSS Counter) -->
    <input type="checkbox" id="t-1" class="target-input">
    <input type="checkbox" id="t-2" class="target-input">
    <input type="checkbox" id="t-3" class="target-input">

    <header class="cabinet-header">
      <h1 class="title">NEON DRIFT</h1>
    </header>

    <!-- Scoreboard -->
    <div class="scoreboard" aria-live="polite">
      <div class="score-display">SCORE: </div>
      <button type="reset" class="trigger-btn" style="padding: 2px 10px; font-size: 0.65rem;">RESET</button>
    </div>

    <!-- Active triggers placed as siblings above playfield for CSS selectors to map -->
    <button type="button" id="left-trigger" class="trigger-input" style="display:none;"></button>
    <button type="button" id="right-trigger" class="trigger-input" style="display:none;"></button>

    <!-- Pinball Playfield -->
    <div class="playfield">
      
      <!-- Outer Curve Arch -->
      <div class="playfield-arch"></div>

      <!-- Plunger Launcher Lane -->
      <div class="plunger-lane"></div>

      <!-- Interactive Bumpers (Clicking them increments score) -->
      <label for="t-1" class="bumper b-left" role="button" aria-label="Target Bumper Left"></label>
      <label for="t-2" class="bumper b-mid" role="button" aria-label="Target Bumper Middle"></label>
      <label for="t-3" class="bumper b-right" role="button" aria-label="Target Bumper Right"></label>

      <!-- The Ball -->
      <div class="pinball" aria-hidden="true"></div>

      <!-- Flippers -->
      <div class="flipper-area">
        <div class="flipper left" aria-hidden="true"></div>
        <div class="flipper right" aria-hidden="true"></div>
      </div>

    </div>

    <!-- Keyboard & Mouse Control Panel -->
    <div class="btn-panel">
      <!-- Pressing/Holding these buttons rotates the corresponding flippers upward -->
      <button type="button" class="trigger-btn" 
              onmousedown="document.getElementById('left-trigger').dispatchEvent(new Event('mousedown'))"
              onmouseup="document.getElementById('left-trigger').dispatchEvent(new Event('mouseup'))"
              onkeydown="if(event.key === ' ' || event.key === 'Enter') document.getElementById('left-trigger').click()"
              aria-label="Hold to flip Left Flipper">FLIP LEFT</button>

      <button type="button" class="trigger-btn" 
              onmousedown="document.getElementById('right-trigger').dispatchEvent(new Event('mousedown'))"
              onmouseup="document.getElementById('right-trigger').dispatchEvent(new Event('mouseup'))"
              onkeydown="if(event.key === ' ' || event.key === 'Enter') document.getElementById('right-trigger').click()"
              aria-label="Hold to flip Right Flipper">FLIP RIGHT</button>
    </div>

  </form>

</body>
</html>
