<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contract Animation - Safari Stutter Reproduction</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Contract Animation - Safari Stutter</h1>
        <p>This demo reproduces the stuttering effect of the contract animation on Safari and demonstrates potential fixes using CSS hardware acceleration.</p>
        
        <div class="demo-grid">
            <div class="demo-box">
                <h2>Default (Stutters on Safari)</h2>
                <div class="box contract-default">Contract Default</div>
            </div>
            
            <div class="demo-box">
                <h2>Optimized (Smooth on Safari)</h2>
                <div class="box contract-optimized">Contract Optimized</div>
            </div>
        </div>

        <div class="controls">
            <button id="replay-btn">Replay Animations</button>
        </div>
    </div>

    <script>
        document.getElementById('replay-btn').addEventListener('click', () => {
            const boxes = document.querySelectorAll('.box');
            boxes.forEach(box => {
                box.style.animation = 'none';
                box.offsetHeight; /* trigger reflow */
                box.style.animation = null; 
            });
        });
    </script>
</body>
</html>
