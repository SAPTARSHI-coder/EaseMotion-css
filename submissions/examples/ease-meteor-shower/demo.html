<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meteor Shower · meteors streak across the sky</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <div class="meteor-container">
      <div class="meteor-display" id="meteorDisplay">
        <!-- Canvas for meteor shower -->
        <canvas id="meteorCanvas"></canvas>
        
        <!-- Meteor Info -->
        <div class="meteor-info">
          <span class="info-label">☄️ Meteors</span>
          <span class="info-value" id="meteorCount">0</span>
        </div>

        <!-- Meteor Controls -->
        <div class="meteor-controls">
          <div class="control-group">
            <label class="control-label">💫 Intensity</label>
            <input type="range" class="control-slider" id="intensitySlider" min="0" max="100" value="50">
            <span class="control-value" id="intensityValue">50%</span>
          </div>
          <div class="control-group">
            <label class="control-label">🎨 Color</label>
            <div class="color-options">
              <button class="color-btn active" data-color="white" title="White">⚪</button>
              <button class="color-btn" data-color="blue" title="Blue">🔵</button>
              <button class="color-btn" data-color="gold" title="Gold">💛</button>
              <button class="color-btn" data-color="green" title="Green">💚</button>
              <button class="color-btn" data-color="pink" title="Pink">💗</button>
            </div>
          </div>
        </div>

        <!-- Meteor Text -->
        <div class="meteor-text">
          <span class="text-label">☄️ Meteor Shower</span>
          <span class="text-message" id="meteorMessage">Meteors streak across the night sky</span>
        </div>
      </div>
      
      <div class="meteor-status">
        <span id="meteorStatus">☄️ Watch meteors streak across the sky</span>
      </div>
    </div>

    <div class="controls">
      <button class="btn btn-reset" id="resetBtn">⟳ Reset</button>
    </div>
    <div class="footer-note">
      <span>☄️ meteor shower · 5 colors · intensity control</span>
    </div>
  </div>

  <script>
    (function() {
      "use strict";

      // DOM refs
      const canvas = document.getElementById('meteorCanvas');
      const ctx = canvas.getContext('2d');
      const display = document.getElementById('meteorDisplay');
      const meteorCount = document.getElementById('meteorCount');
      const meteorStatus = document.getElementById('meteorStatus');
      const meteorMessage = document.getElementById('meteorMessage');
      const resetBtn = document.getElementById('resetBtn');
      const intensitySlider = document.getElementById('intensitySlider');
      const intensityValue = document.getElementById('intensityValue');
      const colorBtns = document.querySelectorAll('.color-btn');

      // State
      let meteors = [];
      let stars = [];
      let animationId = null;
      let time = 0;
      let totalMeteors = 0;
      let currentColor = 'white';
      let spawnTimer = 0;

      // Color configurations
      const colors = {
        white: { main: '#f0f0f0', trail: 'rgba(255,255,255,0.3)', glow: 'rgba(255,255,255,0.1)' },
        blue: { main: '#60a5fa', trail: 'rgba(96,165,250,0.3)', glow: 'rgba(96,165,250,0.1)' },
        gold: { main: '#fbbf24', trail: 'rgba(251,191,36,0.3)', glow: 'rgba(251,191,36,0.1)' },
        green: { main: '#34d399', trail: 'rgba(52,211,153,0.3)', glow: 'rgba(52,211,153,0.1)' },
        pink: { main: '#f472b6', trail: 'rgba(244,114,182,0.3)', glow: 'rgba(244,114,182,0.1)' }
      };

      // Meteor class
      class Meteor {
        constructor() {
          const w = canvas.width;
          const h = canvas.height;
          this.x = Math.random() * w;
          this.y = -20 - Math.random() * 50;
          this.speed = 2 + Math.random() * 4;
          this.angle = 0.5 + Math.random() * 0.5;
          this.length = 30 + Math.random() * 80;
          this.trail = [];
          this.maxTrail = 20 + Math.floor(Math.random() * 20);
          this.size = 1 + Math.random() * 2;
          this.life = 1;
          this.decay = 0.002 + Math.random() * 0.003;
          this.color = currentColor;
          this.brightness = 0.5 + Math.random() * 0.5;
          this.wobble = 0.1 + Math.random() * 0.2;
          this.phase = Math.random() * Math.PI * 2;
          this.sparkle = 0.3 + Math.random() * 0.4;
        }

        update() {
          const colorData = colors[this.color];
          this.x += Math.cos(this.angle) * this.speed;
          this.y += Math.sin(this.angle) * this.speed;
          this.life -= this.decay;
          this.phase += 0.02;
          
          // Wobble
          this.x += Math.sin(this.phase) * this.wobble;
          
          // Trail
          this.trail.push({ x: this.x, y: this.y, life: 1 });
          if (this.trail.length > this.maxTrail) {
            this.trail.shift();
          }
          this.trail.forEach(t => t.life -= 0.04);
          
          return this.life > 0 && this.y < canvas.height + 50;
        }

        draw(ctx) {
          const colorData = colors[this.color];
          
          // Glow
          ctx.save();
          const glowSize = this.length * 0.5 * this.brightness;
          const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, glowSize);
          grad.addColorStop(0, colorData.glow);
          grad.addColorStop(0.5, colorData.glow);
          grad.addColorStop(1, 'rgba(0,0,0,0)');
          ctx.fillStyle = grad;
          ctx.globalAlpha = this.life * 0.5;
          ctx.beginPath();
          ctx.arc(this.x, this.y, glowSize, 0, Math.PI * 2);
          ctx.fill();
          
          // Trail
          this.trail.forEach((t, i) => {
            if (t.life > 0.01) {
              const alpha = t.life * this.life * 0.3 * this.brightness;
              const size = this.size * (0.1 + t.life * 0.9);
              ctx.globalAlpha = alpha;
              ctx.fillStyle = colorData.main;
              ctx.shadowColor = colorData.main;
              ctx.shadowBlur = 5 * t.life;
              ctx.beginPath();
              ctx.arc(t.x, t.y, size, 0, Math.PI * 2);
              ctx.fill();
            }
          });
          
          // Meteor head
          ctx.shadowColor = colorData.main;
          ctx.shadowBlur = 20;
          ctx.globalAlpha = this.life * this.brightness * 0.9;
          ctx.fillStyle = colorData.main;
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size * 2, 0, Math.PI * 2);
          ctx.fill();
          
          // Head glow
          ctx.shadowBlur = 40;
          ctx.globalAlpha = this.life * this.brightness * 0.3;
          ctx.fillStyle = colorData.main;
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size * 5, 0, Math.PI * 2);
          ctx.fill();
          
          // Sparkle
          ctx.shadowBlur = 0;
          ctx.globalAlpha = this.life * this.sparkle * 0.3;
          ctx.fillStyle = '#ffffff';
          const sp = this.size * 0.5;
          ctx.beginPath();
          ctx.moveTo(this.x - sp, this.y);
          ctx.lineTo(this.x, this.y - sp);
          ctx.lineTo(this.x + sp, this.y);
          ctx.lineTo(this.x, this.y + sp);
          ctx.closePath();
          ctx.fill();
          
          ctx.restore();
        }
      }

      // Generate background stars
      function generateStars() {
        stars = [];
        for (let i = 0; i < 100; i++) {
          stars.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            size: 0.5 + Math.random() * 1.5,
            brightness: 0.1 + Math.random() * 0.3,
            twinkleSpeed: 0.01 + Math.random() * 0.02,
            phase: Math.random() * Math.PI * 2
          });
        }
      }

      // Draw background
      function drawBackground(time) {
        const w = canvas.width;
        const h = canvas.height;
        
        // Night sky
        const grad = ctx.createRadialGradient(w/2, h/2, 0, w/2, h/2, w * 0.7);
        grad.addColorStop(0, 'rgba(5, 10, 25, 0.4)');
        grad.addColorStop(0.5, 'rgba(10, 15, 30, 0.5)');
        grad.addColorStop(1, 'rgba(0, 0, 10, 0.7)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, w, h);
        
        // Stars
        stars.forEach(star => {
          star.phase += star.twinkleSpeed;
          const alpha = star.brightness * (0.5 + Math.sin(star.phase) * 0.5);
          ctx.save();
          ctx.globalAlpha = alpha;
          ctx.fillStyle = '#ffffff';
          ctx.shadowColor = '#ffffff';
          ctx.shadowBlur = 1;
          ctx.beginPath();
          ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        });
      }

      // Spawn meteor
      function spawnMeteor() {
        const intensity = parseInt(intensitySlider.value) / 100;
        if (Math.random() < intensity * 0.5) {
          const meteor = new Meteor();
          meteors.push(meteor);
          totalMeteors++;
          meteorCount.textContent = totalMeteors;
        }
      }

      // Animation loop
      function animate() {
        time += 0.02;
        
        // Clear and draw background
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawBackground(time);
        
        // Spawn meteors
        spawnTimer += 0.01;
        if (spawnTimer > 0.5) {
          spawnTimer = 0;
          spawnMeteor();
        }
        
        // Update and draw meteors
        meteors = meteors.filter(m => {
          const alive = m.update();
          if (alive) m.draw(ctx);
          return alive;
        });
        
        // Update status
        const intensity = parseInt(intensitySlider.value);
        if (intensity > 70) {
          meteorStatus.textContent = '☄️ Meteor shower raining down! ✨';
          meteorStatus.style.color = '#fbbf24';
        } else if (intensity > 30) {
          meteorStatus.textContent = '☄️ Meteors streaking across the sky';
          meteorStatus.style.color = '#818cf8';
        } else {
          meteorStatus.textContent = '☄️ Watch meteors streak across the sky';
          meteorStatus.style.color = '#94a3b8';
        }
        
        animationId = requestAnimationFrame(animate);
      }

      // Set color
      function setColor(color) {
        currentColor = color;
        colorBtns.forEach(btn => {
          btn.classList.toggle('active', btn.dataset.color === color);
        });
        const colorNames = {
          white: 'White',
          blue: 'Blue',
          gold: 'Gold',
          green: 'Green',
          pink: 'Pink'
        };
        meteorStatus.textContent = `🎨 Color: ${colorNames[color]}`;
        meteorStatus.style.color = colors[color].main;
        setTimeout(() => {
          meteorStatus.textContent = '☄️ Watch meteors streak across the sky';
          meteorStatus.style.color = '#94a3b8';
        }, 1500);
      }

      // Reset
      function resetMeteors() {
        meteors = [];
        totalMeteors = 0;
        meteorCount.textContent = '0';
        meteorStatus.textContent = '🔄 Reset complete';
        meteorStatus.style.color = '#94a3b8';
        meteorMessage.textContent = 'Meteors streak across the night sky';
        meteorMessage.style.color = '#94a3b8';
        setTimeout(() => {
          meteorStatus.textContent = '☄️ Watch meteors streak across the sky';
          meteorStatus.style.color = '#94a3b8';
        }, 1000);
      }

      // Resize canvas
      function resizeCanvas() {
        const rect = display.getBoundingClientRect();
        canvas.width = rect.width;
        canvas.height = rect.height;
        canvas.style.width = rect.width + 'px';
        canvas.style.height = rect.height + 'px';
        generateStars();
      }

      // Event listeners
      intensitySlider.addEventListener('input', function() {
        intensityValue.textContent = this.value + '%';
      });

      colorBtns.forEach(btn => {
        btn.addEventListener('click', function() {
          setColor(this.dataset.color);
        });
      });

      if (resetBtn) {
        resetBtn.addEventListener('click', function(e) {
          e.preventDefault();
          resetMeteors();
        });
      }

      // Keyboard shortcuts
      document.addEventListener('keydown', function(e) {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

        const key = e.key;
        if (key === 'r' || key === 'R') {
          e.preventDefault();
          resetMeteors();
        }
      });

      // Resize
      window.addEventListener('resize', resizeCanvas);

      // Initialize
      resizeCanvas();
      animate();
      
      console.log('☄️ Meteor Shower ready · shortcuts: [R] Reset');
    })();
  </script>
</body>
</html>
