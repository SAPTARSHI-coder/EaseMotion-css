<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skip Hoist Cage — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Skip Hoist Cage demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Skip Hoist Cage</h1>
      <p class="lede">Skip hoist cage riding the headframe</p>
    </header>

    <section class="ease-skip-hoist-cage" data-demo="skip-hoist-cage" aria-live="polite">
      <div class="ease-skip-hoist-cage__housing">
        <div class="ease-skip-hoist-cage__bezel">
          <div class="ease-skip-hoist-cage__face">
            <div class="ease-skip-hoist-cage__readout">
              <span class="ease-skip-hoist-cage__label">Skip Hoist Cage</span>
              <span class="ease-skip-hoist-cage__value">LIVE</span>
            </div>
            <div class="ease-skip-hoist-cage__motion" aria-hidden="true">
              <span class="ease-skip-hoist-cage__a"></span>
              <span class="ease-skip-hoist-cage__b"></span>
              <span class="ease-skip-hoist-cage__c"></span>
              <span class="ease-skip-hoist-cage__d"></span>
            </div>
            <div class="ease-skip-hoist-cage__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-skip-hoist-cage__controls">
          <button type="button" class="ease-skip-hoist-cage__btn primary">Hoist</button>
          <button type="button" class="ease-skip-hoist-cage__btn">Lower</button>
          <label class="ease-skip-hoist-cage__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-skip-hoist-cage__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
