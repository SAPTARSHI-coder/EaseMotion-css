<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Animated rating component with claymorphism styling built using pure CSS."
  >

  <title>Animated Rating — Claymorphism</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="rating-page">

    <section
      class="rating-card"
      aria-labelledby="rating-title"
    >

      <div class="rating-card__decor rating-card__decor--one"></div>
      <div class="rating-card__decor rating-card__decor--two"></div>

      <div class="rating-card__content">

        <span class="rating-card__eyebrow">
          CUSTOMER EXPERIENCE
        </span>

        <h1 id="rating-title">
          How was your experience?
        </h1>

        <p class="rating-card__description">
          Your feedback helps us create a better experience
          for everyone.
        </p>

        <div
          class="rating-stars"
          role="group"
          aria-label="Rate your experience from one to five stars"
        >

          <button
            class="rating-star"
            type="button"
            aria-label="Rate 1 out of 5"
          >
            <span aria-hidden="true">★</span>
          </button>

          <button
            class="rating-star"
            type="button"
            aria-label="Rate 2 out of 5"
          >
            <span aria-hidden="true">★</span>
          </button>

          <button
            class="rating-star"
            type="button"
            aria-label="Rate 3 out of 5"
          >
            <span aria-hidden="true">★</span>
          </button>

          <button
            class="rating-star"
            type="button"
            aria-label="Rate 4 out of 5"
          >
            <span aria-hidden="true">★</span>
          </button>

          <button
            class="rating-star"
            type="button"
            aria-label="Rate 5 out of 5"
          >
            <span aria-hidden="true">★</span>
          </button>

        </div>

        <div class="rating-summary">
          <strong>4.8</strong>

          <span>
            Average rating from 2,480 reviews
          </span>
        </div>

        <div class="rating-meter" aria-hidden="true">
          <span></span>
        </div>

      </div>

    </section>

  </main>

</body>
</html>
