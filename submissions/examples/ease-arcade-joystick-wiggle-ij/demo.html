<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-arcade-joystick-wiggle demo</title>
</head>
<body>
<div class="ac-app">
  <div class="ac-head">
    <span class="ac-name">SPACE RAID</span>
    <span class="ac-badge">INSERT COIN</span>
  </div>
  <div class="ac-cabinet">
    <div class="ac-screen">
      <span class="ac-ship"></span>
      <span class="ac-laser ac-laser-1"></span>
      <span class="ac-laser ac-laser-2"></span>
      <span class="ac-score">SCORE 0420</span>
    </div>
    <div class="ac-panel">
      <div class="ac-stick">
        <span class="ac-base"></span>
        <span class="ac-shaft"></span>
        <span class="ac-ball"></span>
        <span class="ac-boot"></span>
      </div>
      <div class="ac-buttons">
        <button class="ac-button ac-button-a" type="button">A</button>
        <button class="ac-button ac-button-b" type="button">B</button>
      </div>
    </div>
  </div>
  <div class="ac-foot">1 PLAYER</div>
</div>
</body>
</html>
