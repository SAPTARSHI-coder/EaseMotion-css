<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-step-counter-pedometer</title>
</head>
<body>
<main class="scp-card">
  <h1 class="scp-title">Step Counter</h1>
  <div class="scp-ring">
    <span class="scp-arc"></span>
    <div class="scp-face">
      <span class="scp-count">8234</span>
      <span class="scp-label">steps today</span>
    </div>
  </div>
  <div class="scp-stats">
    <div class="scp-stat">
      <span class="scp-stat-value">4.1</span>
      <span class="scp-stat-name">km walked</span>
    </div>
    <div class="scp-stat">
      <span class="scp-stat-value">512</span>
      <span class="scp-stat-name">kcal burned</span>
    </div>
    <div class="scp-stat">
      <span class="scp-stat-value">6.2k</span>
      <span class="scp-stat-name">steps / 10k</span>
    </div>
  </div>
  <div class="scp-shoe">
    <span class="scp-shoe-lace"></span>
  </div>
</main>
</body>
</html>
