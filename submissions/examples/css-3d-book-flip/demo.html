<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Book Flip</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="book-container">
        <div class="book">
            <div class="page cover">
                <h1>CSS Magic</h1>
                <p>Hover to open</p>
            </div>
            <div class="page inside">
                <h2>Chapter 1</h2>
                <p>This is a 3D book created entirely with CSS transforms. It uses perspective and rotateY() to achieve this realistic effect.</p>
            </div>
            <div class="page back"></div>
        </div>
    </div>
</body>
</html>
