<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-solar-system-scale demo</title>
</head>
<body>
<div class="ss-app">
  <span class="ss-title">SOLAR SYSTEM</span>
  <div class="ss-map">
    <span class="ss-sun"></span>
    <span class="ss-ring ss-r1"><span class="ss-planet ss-mercury"></span></span>
    <span class="ss-ring ss-r2"><span class="ss-planet ss-venus"></span></span>
    <span class="ss-ring ss-r3"><span class="ss-planet ss-earth"></span></span>
    <span class="ss-ring ss-r4"><span class="ss-planet ss-mars"></span></span>
  </div>
  <div class="ss-keys">
    <span class="ss-key">MERCURY</span>
    <span class="ss-key">VENUS</span>
    <span class="ss-key">EARTH</span>
    <span class="ss-key">MARS</span>
  </div>
  <span class="ss-note">RELATIVE SCALE</span>
</div>
</body>
</html>
