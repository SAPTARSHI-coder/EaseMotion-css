<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rheostat Coil Wipe — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Rheostat Coil Wipe demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Rheostat Coil Wipe</h1>
      <p class="lede">Rheostat contact wiping along a coiled resistance</p>
    </header>

    <section class="ease-rheostat-coil-wipe" data-demo="rheostat-coil-wipe" aria-live="polite">
      <div class="ease-rheostat-coil-wipe__housing">
        <div class="ease-rheostat-coil-wipe__bezel">
          <div class="ease-rheostat-coil-wipe__face">
            <div class="ease-rheostat-coil-wipe__readout">
              <span class="ease-rheostat-coil-wipe__label">Rheostat Coil Wipe</span>
              <span class="ease-rheostat-coil-wipe__value">LIVE</span>
            </div>
            <div class="ease-rheostat-coil-wipe__motion" aria-hidden="true">
              <span class="ease-rheostat-coil-wipe__a"></span>
              <span class="ease-rheostat-coil-wipe__b"></span>
              <span class="ease-rheostat-coil-wipe__c"></span>
              <span class="ease-rheostat-coil-wipe__d"></span>
            </div>
            <div class="ease-rheostat-coil-wipe__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-rheostat-coil-wipe__controls">
          <button type="button" class="ease-rheostat-coil-wipe__btn primary">Engage</button>
          <button type="button" class="ease-rheostat-coil-wipe__btn">Reset</button>
          <label class="ease-rheostat-coil-wipe__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-rheostat-coil-wipe__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
