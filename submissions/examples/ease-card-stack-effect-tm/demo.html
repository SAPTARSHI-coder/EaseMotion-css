<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Card Stack Effect | EaseMotion CSS</title><link rel="stylesheet" href="style.css"></head>
<body><div class="cs-root">
<h2 style="color:var(--cs-text);margin:0;">Card Stack</h2>
<p style="color:var(--cs-muted);margin:0 0 2rem;text-align:center;max-width:400px;">Hover cards to interact. Pure CSS transforms.</p>
<div class="cs-stack">
<div class="cs-card"><h3 class="cs-title">Card One</h3><p class="cs-desc">Top card with details</p></div>
<div class="cs-card"><h3 class="cs-title">Card Two</h3><p class="cs-desc">Middle stacked card</p></div>
<div class="cs-card"><h3 class="cs-title">Card Three</h3><p class="cs-desc">Bottom stacked card</p></div>
</div></div></body></html>
