<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slide-Up Reveal Badge Demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f3f4f6;
    }
    
    .container {
      display: flex;
      gap: 16px;
      padding: 24px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
    }
  </style>
</head>
<body>
  <div class="container">
    <span class="ease-reveal-badge" style="background-color: #3b82f6; color: white;">New</span>
    <span class="ease-reveal-badge" style="background-color: #10b981; color: white; animation-delay: 0.1s;">Updated</span>
    <span class="ease-reveal-badge" style="background-color: #ef4444; color: white; animation-delay: 0.2s;">Important</span>
  </div>
</body>
</html>
