<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CSS Skew-Active Hero Section for fintech dashboards">
  <title>Skew Active Fintech Hero</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="hero">
    <div class="hero__content">
      <p class="hero__eyebrow">FINTECH DASHBOARD</p>

      <h1 class="hero__title">
        Smarter Money.
        <span>Better Decisions.</span>
      </h1>

      <p class="hero__description">
        Track your financial performance with a modern dashboard
        designed for faster and smarter decisions.
      </p>

      <div class="hero__actions">
        <a href="#" class="hero__button hero__button--primary">
          Get Started
        </a>

        <a href="#" class="hero__button hero__button--secondary">
          View Dashboard
        </a>
      </div>
    </div>

    <div class="hero__visual" aria-hidden="true">
      <div class="dashboard-card">
        <div class="dashboard-card__header">
          <span>Portfolio Balance</span>
          <span class="dashboard-card__status">+12.8%</span>
        </div>

        <strong class="dashboard-card__amount">$84,250.00</strong>

        <div class="dashboard-card__chart">
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>
    </div>
  </main>

</body>
</html>
