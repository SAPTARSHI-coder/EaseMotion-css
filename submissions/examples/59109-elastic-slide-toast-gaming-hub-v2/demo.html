<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elastic Slide Toast</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="toast-container">

<div class="toast success">
<div class="icon">✓</div>

<div class="content">
<h3>Mission Complete!</h3>
<p>You unlocked the Legendary Weapon Skin.</p>
</div>

<button>&times;</button>

</div>

<div class="toast warning">
<div class="icon">!</div>

<div class="content">
<h3>Energy Low</h3>
<p>Recharge before entering the next battle.</p>
</div>

<button>&times;</button>

</div>

<div class="toast info">
<div class="icon">★</div>

<div class="content">
<h3>Daily Reward</h3>
<p>Your bonus crate is ready to claim.</p>
</div>

<button>&times;</button>

</div>

</div>

</body>
</html>
