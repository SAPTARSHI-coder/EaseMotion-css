<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Shadow Box Playground - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Offset Radio Triggers -->
  <input type="radio" name="offset" id="x-small" class="hidden-trigger">
  <input type="radio" name="offset" id="x-medium" class="hidden-trigger" checked>
  <input type="radio" name="offset" id="x-large" class="hidden-trigger">

  <!-- Blur Radio Triggers -->
  <input type="radio" name="blur" id="b-none" class="hidden-trigger">
  <input type="radio" name="blur" id="b-soft" class="hidden-trigger" checked>
  <input type="radio" name="blur" id="b-heavy" class="hidden-trigger">

  <!-- Color Radio Triggers -->
  <input type="radio" name="color" id="c-pink" class="hidden-trigger">
  <input type="radio" name="color" id="c-cyan" class="hidden-trigger" checked>
  <input type="radio" name="color" id="c-purple" class="hidden-trigger">

  <!-- Playground Dashboard -->
  <div class="playground-dashboard" role="region" aria-label="Visual Shadow Box Playground">
    
    <header class="dashboard-header">
      <h1 class="title">Shadow Sandbox</h1>
      <p class="subtitle">Modify parameter nodes to preview glowing box-shadow properties and copy the code.</p>
    </header>

    <div class="sandbox-grid">

      <!-- Left Column Controls -->
      <div class="controls-panel">
        
        <!-- Group 1: Offsets -->
        <div class="control-group" role="radiogroup" aria-label="Shadow offset values">
          <span class="group-title">Shadow Offset</span>
          <div class="radio-row">
            <label for="x-small" class="radio-label l-x-small" role="radio" aria-checked="false" tabindex="0"
                   onkeydown="if(event.key === ' ' || event.key === 'Enter') document.getElementById('x-small').click()">Small</label>
            <label for="x-medium" class="radio-label l-x-medium" role="radio" aria-checked="false" tabindex="0"
                   onkeydown="if(event.key === ' ' || event.key === 'Enter') document.getElementById('x-medium').click()">Medium</label>
            <label for="x-large" class="radio-label l-x-large" role="radio" aria-checked="false" tabindex="0"
                   onkeydown="if(event.key === ' ' || event.key === 'Enter') document.getElementById('x-large').click()">Large</label>
          </div>
        </div>

        <!-- Group 2: Blurs -->
        <div class="control-group" role="radiogroup" aria-label="Shadow blur values">
          <span class="group-title">Blur Density</span>
          <div class="radio-row">
            <label for="b-none" class="radio-label l-b-none" role="radio" aria-checked="false" tabindex="0"
                   onkeydown="if(event.key === ' ' || event.key === 'Enter') document.getElementById('b-none').click()">Sharp</label>
            <label for="b-soft" class="radio-label l-b-soft" role="radio" aria-checked="false" tabindex="0"
                   onkeydown="if(event.key === ' ' || event.key === 'Enter') document.getElementById('b-soft').click()">Soft</label>
            <label for="b-heavy" class="radio-label l-b-heavy" role="radio" aria-checked="false" tabindex="0"
                   onkeydown="if(event.key === ' ' || event.key === 'Enter') document.getElementById('b-heavy').click()">Spread</label>
          </div>
        </div>

        <!-- Group 3: Colors -->
        <div class="control-group" role="radiogroup" aria-label="Shadow glow colors">
          <span class="group-title">Glow Color</span>
          <div class="radio-row">
            <label for="c-pink" class="radio-label l-c-pink" role="radio" aria-checked="false" tabindex="0"
                   onkeydown="if(event.key === ' ' || event.key === 'Enter') document.getElementById('c-pink').click()">Neon Pink</label>
            <label for="c-cyan" class="radio-label l-c-cyan" role="radio" aria-checked="false" tabindex="0"
                   onkeydown="if(event.key === ' ' || event.key === 'Enter') document.getElementById('c-cyan').click()">Neon Cyan</label>
            <label for="c-purple" class="radio-label l-c-purple" role="radio" aria-checked="false" tabindex="0"
                   onkeydown="if(event.key === ' ' || event.key === 'Enter') document.getElementById('c-purple').click()">Glow Purple</label>
          </div>
        </div>

      </div>

      <!-- Right Column Visual Preview -->
      <div class="preview-container">
        
        <!-- Live Preview Target Box -->
        <div class="preview-box" aria-hidden="true"></div>

        <!-- Generated Code block -->
        <div class="code-box" aria-live="polite">
          <span style="color: #64748b;">.box {</span><br>
          &nbsp;&nbsp;<span style="color: #f43f5e;">box-shadow:</span> 
          <span class="code-x" style="color: #38bdf8;"></span> 
          <span class="code-y" style="color: #38bdf8;"></span> 
          <span class="code-b" style="color: #38bdf8;"></span> 
          <span class="code-c" style="color: #34d399;"></span>;<br>
          <span style="color: #64748b;">}</span>
        </div>

      </div>

    </div>

  </div>

</body>
</html>
