<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunrise Reveal · Sun Rises on Interaction</title>
    <meta name="description" content="Interactive sunrise reveal with sun rising on interaction, atmospheric colors, and glowing effects.">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1 class="title">🌅 SUNRISE REVEAL</h1>
        
        <div class="canvas-wrapper">
            <canvas id="sunriseCanvas" width="600" height="500"></canvas>
            <div class="glow-overlay"></div>
        </div>

        <div class="controls">
            <div class="button-group">
                <button class="rise-btn" id="riseBtn">🌅 RISE</button>
                <button class="reset-btn" id="resetBtn">⟳ RESET</button>
                <button class="toggle-btn" id="toggleBtn">⏸️ PAUSE</button>
            </div>
            <div class="speed-control">
                <label>Speed</label>
                <input type="range" id="speedSlider" min="1" max="10" value="5">
                <span id="speedLabel">5</span>
                <label>Glow</label>
                <input type="range" id="glowSlider" min="1" max="10" value="5">
                <span id="glowLabel">5</span>
            </div>
        </div>

        <div class="info">
            <span>🌅 SUNRISE REVEAL</span>
            <small>rise · glow · dawn</small>
        </div>
        <div class="hint">
            <span>🌅 click to watch the sun rise</span>
        </div>
    </div>

    <script>
        (function() {
            const canvas = document.getElementById('sunriseCanvas');
            const ctx = canvas.getContext('2d');
            const W = 600, H = 500;
            
            const riseBtn = document.getElementById('riseBtn');
            const resetBtn = document.getElementById('resetBtn');
            const toggleBtn = document.getElementById('toggleBtn');
            const speedSlider = document.getElementById('speedSlider');
            const speedLabel = document.getElementById('speedLabel');
            const glowSlider = document.getElementById('glowSlider');
            const glowLabel = document.getElementById('glowLabel');

            let isAnimating = true;
            let speed = 5;
            let glowIntensity = 5;
            let time = 0;
            let sunY = H + 50;
            let targetY = H + 50;
            let isRisen = false;
            let rays = [];
            let birds = [];
            let riseCount = 0;

            // ---- Ray Class ----
            class Ray {
                constructor() {
                    this.x = 300;
                    this.y = 0;
                    this.length = 80 + Math.random() * 60;
                    this.angle = (Math.random() - 0.5) * 0.8;
                    this.speed = 0.005 + Math.random() * 0.01;
                    this.phase = Math.random() * Math.PI * 2;
                    this.alpha = 0.3 + Math.random() * 0.4;
                }

                update() {
                    this.phase += this.speed;
                    this.alpha = 0.2 + Math.sin(this.phase) * 0.2 + 0.2;
                }

                draw(ctx, sunX, sunY) {
                    const progress = Math.min(1, (H - sunY) / 200);
                    const alpha = this.alpha * progress * 0.5;
                    ctx.save();
                    ctx.globalAlpha = alpha;
                    ctx.fillStyle = '#ffd700';
                    ctx.shadowColor = '#ffd700';
                    ctx.shadowBlur = 20 * progress;
                    const x = sunX + Math.sin(this.angle + time * 0.01) * 20;
                    const y = sunY + this.length * 0.3;
                    ctx.beginPath();
                    ctx.ellipse(x, y, this.length * 0.5, this.length * 0.05, this.angle, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
            }

            // ---- Bird Class ----
            class Bird {
                constructor() {
                    this.x = Math.random() * W;
                    this.y = 100 + Math.random() * 100;
                    this.size = 8 + Math.random() * 6;
                    this.speed = 0.5 + Math.random() * 0.5;
                    this.direction = Math.random() > 0.5 ? 1 : -1;
                    this.wingPhase = Math.random() * Math.PI * 2;
                    this.wingSpeed = 0.05 + Math.random() * 0.03;
                    this.altitude = Math.random() * 30;
                    this.phase = Math.random() * Math.PI * 2;
                }

                update() {
                    this.x += this.speed * this.direction;
                    this.wingPhase += this.wingSpeed;
                    this.y += Math.sin(this.phase) * 0.1;
                    this.phase += 0.01;
                    
                    if (this.x < -20) this.x = W + 20;
                    if (this.x > W + 20) this.x = -20;
                }

                draw(ctx) {
                    const wing = Math.sin(this.wingPhase) * 5;
                    ctx.save();
                    ctx.globalAlpha = 0.15;
                    ctx.strokeStyle = '#2a2a2a';
                    ctx.lineWidth = 1.5;
                    
                    // Body
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size * 0.2, 0, Math.PI * 2);
                    ctx.stroke();
                    
                    // Wings
                    ctx.beginPath();
                    ctx.moveTo(this.x - this.size * 0.5, this.y);
                    ctx.quadraticCurveTo(
                        this.x - this.size * 0.3,
                        this.y - this.size * 0.6 + wing,
                        this.x,
                        this.y - this.size * 0.3
                    );
                    ctx.stroke();
                    
                    ctx.beginPath();
                    ctx.moveTo(this.x + this.size * 0.5, this.y);
                    ctx.quadraticCurveTo(
                        this.x + this.size * 0.3,
                        this.y - this.size * 0.6 - wing,
                        this.x,
                        this.y - this.size * 0.3
                    );
                    ctx.stroke();
                    
                    ctx.restore();
                }
            }

            // ---- Create Rays ----
            function createRays() {
                rays = [];
                for (let i = 0; i < 12; i++) {
                    rays.push(new Ray());
                }
            }

            // ---- Create Birds ----
            function createBirds() {
                birds = [];
                for (let i = 0; i < 5; i++) {
                    birds.push(new Bird());
                }
            }

            // ---- Draw Sun ----
            function drawSun(ctx, x, y) {
                const progress = Math.min(1, (H - y) / 200);
                const glow = glowIntensity / 10;
                
                // Outer glow
                const outerGrad = ctx.createRadialGradient(x, y, 0, x, y, 150 * progress);
                outerGrad.addColorStop(0, `rgba(255, 200, 100, ${0.1 * glow * progress})`);
                outerGrad.addColorStop(0.3, `rgba(255, 180, 80, ${0.05 * glow * progress})`);
                outerGrad.addColorStop(0.6, `rgba(255, 150, 50, ${0.02 * glow * progress})`);
                outerGrad.addColorStop(1, 'rgba(255, 150, 50, 0)');
                ctx.fillStyle = outerGrad;
                ctx.shadowBlur = 0;
                ctx.beginPath();
                ctx.arc(x, y, 150 * progress, 0, Math.PI * 2);
                ctx.fill();
                
                // Sun body
                const grad = ctx.createRadialGradient(
                    x - 20, y - 20, 0,
                    x, y, 40 * progress
                );
                grad.addColorStop(0, '#fff4d6');
                grad.addColorStop(0.3, '#ffd700');
                grad.addColorStop(0.7, '#ff8c00');
                grad.addColorStop(1, '#ff6b00');
                ctx.fillStyle = grad;
                ctx.shadowColor = '#ffd700';
                ctx.shadowBlur = 30 * glow * progress;
                ctx.beginPath();
                ctx.arc(x, y, 40 * progress, 0, Math.PI * 2);
                ctx.fill();
                
                // Inner glow
                ctx.shadowBlur = 0;
                const innerGrad = ctx.createRadialGradient(x, y, 0, x, y, 20 * progress);
                innerGrad.addColorStop(0, 'rgba(255, 255, 200, 0.3)');
                innerGrad.addColorStop(1, 'rgba(255, 200, 100, 0)');
                ctx.fillStyle = innerGrad;
                ctx.beginPath();
                ctx.arc(x, y, 20 * progress, 0, Math.PI * 2);
                ctx.fill();
            }

            // ---- Draw Sky ----
            function drawSky(ctx, sunY) {
                const progress = Math.min(1, (H - sunY) / 200);
                const grad = ctx.createLinearGradient(0, 0, 0, H);
                
                // Night to dawn transition
                const nightColors = ['#050a12', '#0a1520', '#0d1a2a'];
                const dawnColors = ['#1a0a0a', '#2a1a0a', '#3a2a1a'];
                const dayColors = ['#1a3a5a', '#2a5a7a', '#3a7a5a'];
                
                const t = progress;
                const r1 = nightColors[0], r2 = dawnColors[0], r3 = dayColors[0];
                
                grad.addColorStop(0, t < 0.5 ? nightColors[0] : dawnColors[0]);
                grad.addColorStop(0.3, t < 0.5 ? nightColors[1] : dawnColors[1]);
                grad.addColorStop(0.6, t < 0.5 ? nightColors[2] : dawnColors[2]);
                grad.addColorStop(0.8, t < 0.7 ? nightColors[2] : dayColors[1]);
                grad.addColorStop(1, t < 0.7 ? nightColors[2] : dayColors[2]);
                
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, W, H);
                
                // Stars (fade out as sun rises)
                if (progress < 0.7) {
                    const starAlpha = (1 - progress / 0.7) * 0.5;
                    for (let i = 0; i < 30; i++) {
                        const x = (i * 137 + 20) % W;
                        const y = (i * 97 + 30) % (H * 0.6);
                        const size = 0.5 + (i % 3) * 0.5;
                        const twinkle = 0.3 + Math.sin(time * 0.015 + i * 2.5) * 0.3 + 0.3;
                        ctx.fillStyle = `rgba(200, 220, 255, ${twinkle * starAlpha * 0.3})`;
                        ctx.beginPath();
                        ctx.arc(x, y, size, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
                
                // Horizon glow
                const horizonGrad = ctx.createRadialGradient(300, H * 0.8, 0, 300, H * 0.8, 300);
                horizonGrad.addColorStop(0, `rgba(255, 200, 100, ${0.05 * glowIntensity / 5 * progress})`);
                horizonGrad.addColorStop(0.5, `rgba(255, 150, 50, ${0.02 * glowIntensity / 5 * progress})`);
                horizonGrad.addColorStop(1, 'rgba(255, 150, 50, 0)');
                ctx.fillStyle = horizonGrad;
                ctx.beginPath();
                ctx.arc(300, H * 0.8, 300, 0, Math.PI * 2);
                ctx.fill();
            }

            // ---- Draw Landscape ----
            function drawLandscape(ctx, sunY) {
                const progress = Math.min(1, (H - sunY) / 200);
                
                // Mountains
                ctx.fillStyle = `rgba(20, 30, 40, ${0.05 + progress * 0.1})`;
                for (let i = 0; i < 4; i++) {
                    const x = i * 200 + 50;
                    const h = 60 + Math.sin(i * 1.5) * 30;
                    ctx.beginPath();
                    ctx.moveTo(x - 100, H - 40);
                    ctx.quadraticCurveTo(x, H - 40 - h, x + 100, H - 40);
                    ctx.fill();
                }
                
                // Ground
                const groundGrad = ctx.createLinearGradient(0, H - 40, 0, H);
                groundGrad.addColorStop(0, `rgba(20, 30, 20, ${0.1 * progress})`);
                groundGrad.addColorStop(0.3, `rgba(20, 30, 20, ${0.2 * progress})`);
                groundGrad.addColorStop(0.7, `rgba(20, 30, 20, ${0.3 * progress})`);
                groundGrad.addColorStop(1, `rgba(20, 30, 20, ${0.4 * progress})`);
                ctx.fillStyle = groundGrad;
                ctx.fillRect(0, H - 40, W, 40);
            }

            // ---- Rise Sun ----
            function riseSun() {
                if (isRisen) return;
                targetY = 150 + Math.random() * 30;
                isRisen = true;
                riseCount++;
                createRays();
                createBirds();
            }

            // ---- Reset ----
            function resetSunrise() {
                targetY = H + 50;
                sunY = H + 50;
                isRisen = false;
                rays = [];
                birds = [];
                time = 0;
            }

            // ---- Render ----
            function render() {
                drawSky(ctx, sunY);
                drawLandscape(ctx, sunY);
                
                // Draw rays
                for (let r of rays) {
                    r.draw(ctx, 300, sunY);
                }
                
                // Draw sun
                drawSun(ctx, 300, sunY);
                
                // Draw birds (only when sun is up)
                if (sunY < H - 50) {
                    for (let b of birds) {
                        b.draw(ctx);
                    }
                }
                
                // Status
                ctx.save();
                ctx.shadowBlur = 0;
                ctx.fillStyle = 'rgba(200, 220, 240, 0.15)';
                ctx.font = '13px monospace';
                ctx.textAlign = 'right';
                ctx.textBaseline = 'bottom';
                ctx.fillText(`Rises: ${riseCount}`, W - 20, H - 10);
                
                ctx.textAlign = 'left';
                const status = isRisen ? '🌅 RISEN' : '🌙 NIGHT';
                ctx.fillText(status, 20, H - 10);
                ctx.restore();
            }

            // ---- Animation Loop ----
            function animate() {
                if (!isAnimating) {
                    requestAnimationFrame(animate);
                    return;
                }
                
                time += 0.01 * (speed / 5);
                
                // Smooth sun movement
                const dt = 0.02 * (speed / 5);
                const diff = targetY - sunY;
                if (Math.abs(diff) > 0.5) {
                    sunY += diff * 0.02 * dt * 5;
                } else {
                    sunY = targetY;
                }
                
                // Update rays
                for (let r of rays) {
                    r.update();
                }
                
                // Update birds
                for (let b of birds) {
                    b.update();
                }
                
                render();
                
                requestAnimationFrame(animate);
            }

            // ---- Toggle Animation ----
            function toggleAnimation() {
                isAnimating = !isAnimating;
                toggleBtn.textContent = isAnimating ? '⏸️ PAUSE' : '▶️ PLAY';
            }

            // ---- Update Labels ----
            speedSlider.addEventListener('input', function() {
                speedLabel.textContent = this.value;
            });
            glowSlider.addEventListener('input', function() {
                glowIntensity = parseInt(this.value);
                glowLabel.textContent = glowIntensity;
            });

            // ---- Event Listeners ----
            riseBtn.addEventListener('click', riseSun);
            resetBtn.addEventListener('click', resetSunrise);
            toggleBtn.addEventListener('click', toggleAnimation);

            // ---- Keyboard Shortcuts ----
            document.addEventListener('keydown', function(e) {
                if (e.key === ' ' || e.key === 'Space') {
                    e.preventDefault();
                    if (!isRisen) {
                        riseSun();
                    } else {
                        resetSunrise();
                    }
                }
                if (e.key === 'r' || e.key === 'R') {
                    resetSunrise();
                }
                if (e.key === 'p' || e.key === 'P') {
                    toggleAnimation();
                }
            });

            // ---- Click on canvas to rise ----
            canvas.addEventListener('click', function(e) {
                if (!isRisen) {
                    riseSun();
                } else {
                    resetSunrise();
                }
            });

            // ---- Initialize ----
            render();
            animate();

            console.log('🌅 Sunrise Reveal · Click Rise or press Space to watch the sun rise!');
        })();
    </script>
</body>
</html>
