<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Timeline Navigation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="timeline-container">
    <h1>Project Timeline</h1>

    <nav class="timeline" aria-label="Project timeline">
      <a href="#planning" class="timeline-item">
        <span class="timeline-dot" aria-hidden="true"></span>
        <span class="timeline-content">
          <time datetime="2026-01-10">Jan 10, 2026</time>
          <strong>Planning</strong>
          <span>Project planning and requirements.</span>
        </span>
      </a>

      <a href="#design" class="timeline-item">
        <span class="timeline-dot" aria-hidden="true"></span>
        <span class="timeline-content">
          <time datetime="2026-02-05">Feb 05, 2026</time>
          <strong>Design</strong>
          <span>UI and visual design completed.</span>
        </span>
      </a>

      <a href="#development" class="timeline-item">
        <span class="timeline-dot" aria-hidden="true"></span>
        <span class="timeline-content">
          <time datetime="2026-03-15">Mar 15, 2026</time>
          <strong>Development</strong>
          <span>Core features were implemented.</span>
        </span>
      </a>

      <a href="#launch" class="timeline-item">
        <span class="timeline-dot" aria-hidden="true"></span>
        <span class="timeline-content">
          <time datetime="2026-04-20">Apr 20, 2026</time>
          <strong>Launch</strong>
          <span>Project released to users.</span>
        </span>
      </a>
    </nav>
  </main>

</body>
</html>
