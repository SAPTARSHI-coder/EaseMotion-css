<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shadow Puppet – Shadows Transform Based on Cursor</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <h1>🎭 Shadow Puppet</h1>
    <p class="subtitle">Shadows transform based on cursor position</p>

    <div class="puppet-container">
      <div class="puppet-stage" id="puppetStage">
        <!-- Light source -->
        <div class="light-source" id="lightSource">
          <div class="light-bulb"></div>
          <div class="light-beam"></div>
        </div>
        
        <!-- Shadow puppet shapes -->
        <div class="puppet-shapes" id="puppetShapes">
          <div class="shape shape-bird" id="shapeBird">
            <div class="shadow-bird"></div>
          </div>
          <div class="shape shape-dog" id="shapeDog">
            <div class="shadow-dog"></div>
          </div>
          <div class="shape shape-cat" id="shapeCat">
            <div class="shadow-cat"></div>
          </div>
          <div class="shape shape-rabbit" id="shapeRabbit">
            <div class="shadow-rabbit"></div>
          </div>
          <div class="shape shape-hand" id="shapeHand">
            <div class="shadow-hand"></div>
          </div>
        </div>
        
        <!-- Shadow overlay -->
        <div class="shadow-overlay" id="shadowOverlay"></div>
        
        <!-- Cursor indicator -->
        <div class="cursor-light" id="cursorLight"></div>
      </div>

      <!-- Info overlay -->
      <div class="info-overlay">
        <span class="puppet-status" id="puppetStatus">🎭 Active</span>
        <span class="shape-name" id="shapeName">🕊️ Bird</span>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <button class="ctrl-btn prev" id="prevBtn">◀ Prev</button>
      <button class="ctrl-btn next" id="nextBtn">Next ▶</button>
      <button class="ctrl-btn toggle" id="toggleBtn">💡 Toggle Light</button>
      <button class="ctrl-btn reset" id="resetBtn">↺ Reset</button>
    </div>

    <!-- Sliders -->
    <div class="slider-container">
      <span class="slider-label">Shadow Size</span>
      <input type="range" id="sizeSlider" min="50" max="200" value="100" />
      <span class="slider-value" id="sizeValue">100%</span>
    </div>

    <div class="slider-container">
      <span class="slider-label">Shadow Softness</span>
      <input type="range" id="softnessSlider" min="0" max="100" value="50" />
      <span class="slider-value" id="softnessValue">50%</span>
    </div>

    <div class="slider-container">
      <span class="slider-label">Light Distance</span>
      <input type="range" id="distanceSlider" min="50" max="200" value="100" />
      <span class="slider-value" id="distanceValue">100%</span>
    </div>

    <!-- Status -->
    <div class="status" id="status">🎭 Move your cursor to transform the shadow puppet</div>

    <!-- Keyboard shortcuts -->
    <div class="shortcuts">
      <kbd>←</kbd> <kbd>→</kbd> Change puppet · <kbd>T</kbd> Toggle Light · <kbd>R</kbd> Reset
    </div>
  </div>

  <script>
    (function() {
      "use strict";

      // DOM elements
      const puppetStage = document.getElementById('puppetStage');
      const shadowOverlay = document.getElementById('shadowOverlay');
      const cursorLight = document.getElementById('cursorLight');
      const lightSource = document.getElementById('lightSource');
      const puppetStatus = document.getElementById('puppetStatus');
      const shapeName = document.getElementById('shapeName');
      const prevBtn = document.getElementById('prevBtn');
      const nextBtn = document.getElementById('nextBtn');
      const toggleBtn = document.getElementById('toggleBtn');
      const resetBtn = document.getElementById('resetBtn');
      const status = document.getElementById('status');
      const sizeSlider = document.getElementById('sizeSlider');
      const sizeValue = document.getElementById('sizeValue');
      const softnessSlider = document.getElementById('softnessSlider');
      const softnessValue = document.getElementById('softnessValue');
      const distanceSlider = document.getElementById('distanceSlider');
      const distanceValue = document.getElementById('distanceValue');

      // State
      let currentShape = 0;
      let isLightOn = true;
      let mouseX = 0;
      let mouseY = 0;
      let isMouseOnStage = false;
      let animationId = null;
      let time = 0;

      // Shape names and icons
      const SHAPES = [
        { name: 'Bird', icon: '🕊️', class: 'shape-bird' },
        { name: 'Dog', icon: '🐕', class: 'shape-dog' },
        { name: 'Cat', icon: '🐈', class: 'shape-cat' },
        { name: 'Rabbit', icon: '🐇', class: 'shape-rabbit' },
        { name: 'Hand', icon: '✋', class: 'shape-hand' }
      ];

      // ----- Update shadow -----
      function updateShadow() {
        const rect = puppetStage.getBoundingClientRect();
        const w = puppetStage.clientWidth || 600;
        const h = puppetStage.clientHeight || 450;
        const cx = w / 2;
        const cy = h / 2;

        // Normalize mouse position (0-1)
        const nx = isMouseOnStage ? (mouseX - rect.left) / rect.width : 0.5;
        const ny = isMouseOnStage ? (mouseY - rect.top) / rect.height : 0.5;

        // Clamp
        const clampedX = Math.max(0, Math.min(1, nx));
        const clampedY = Math.max(0, Math.min(1, ny));

        // Calculate shadow offset based on cursor position
        const offsetX = (clampedX - 0.5) * 2;
        const offsetY = (clampedY - 0.5) * 2;

        // Get shadow size and softness
        const size = parseInt(sizeSlider.value) / 100;
        const softness = parseInt(softnessSlider.value) / 100;
        const distance = parseInt(distanceSlider.value) / 100;

        // Update all shapes
        const shapes = document.querySelectorAll('.shape');
        shapes.forEach((shape, index) => {
          const shadow = shape.querySelector('[class^="shadow-"]');
          if (!shadow) return;

          // Position shadow based on cursor
          const shadowX = cx + offsetX * (60 + (1 - index * 0.15) * 40) * distance;
          const shadowY = cy + offsetY * (40 + (1 - index * 0.15) * 30) * distance;

          // Scale based on distance from center
          const distFromCenter = Math.sqrt(offsetX * offsetX + offsetY * offsetY);
          const scale = size * (0.8 + 0.4 * (1 - distFromCenter * 0.3));

          // Opacity based on light
          const opacity = isLightOn ? (0.6 + 0.4 * (1 - distFromCenter * 0.5)) : 0.1;

          // Apply transformations
          shadow.style.transform = `translate(${shadowX - 50}px, ${shadowY - 50}px) scale(${scale})`;
          shadow.style.opacity = opacity;
          shadow.style.filter = `blur(${softness * 6}px)`;

          // Show only current shape
          shape.style.display = index === currentShape ? 'block' : 'none';
        });

        // Update cursor light
        if (isLightOn && isMouseOnStage) {
          cursorLight.style.display = 'block';
          cursorLight.style.left = (clampedX * 100) + '%';
          cursorLight.style.top = (clampedY * 100) + '%';
          const sizeVal = 30 + size * 40;
          cursorLight.style.width = sizeVal + 'px';
          cursorLight.style.height = sizeVal + 'px';
          cursorLight.style.opacity = 0.1 + (1 - distFromCenter) * 0.2;
        } else {
          cursorLight.style.display = 'none';
        }

        // Update light source position based on cursor
        if (isLightOn) {
          lightSource.style.display = 'block';
          const lightX = 10 + clampedX * 80;
          const lightY = 10 + clampedY * 80;
          lightSource.style.left = lightX + '%';
          lightSource.style.top = lightY + '%';
          
          // Beam angle
          const beam = lightSource.querySelector('.light-beam');
          if (beam) {
            const angle = Math.atan2(50 - clampedY * 100, 50 - clampedX * 100);
            beam.style.transform = `rotate(${angle}rad)`;
            beam.style.opacity = 0.1 + 0.2 * (1 - distFromCenter);
          }
        } else {
          lightSource.style.display = 'none';
        }

        // Update shadow overlay
        shadowOverlay.style.opacity = isLightOn ? 0.2 : 0.8;

        // Update status
        shapeName.textContent = SHAPES[currentShape].icon + ' ' + SHAPES[currentShape].name;
        puppetStatus.textContent = isLightOn ? '🎭 Active' : '🌑 Dark';
      }

      // ----- Animation loop -----
      function animate() {
        time += 0.016;
        updateShadow();
        animationId = requestAnimationFrame(animate);
      }

      // ----- Start animation -----
      function startAnimation() {
        if (animationId) {
          cancelAnimationFrame(animationId);
        }
        animate();
      }

      // ----- Change shape -----
      function changeShape(delta) {
        currentShape = (currentShape + delta + SHAPES.length) % SHAPES.length;
        status.textContent = `🎭 Changed to ${SHAPES[currentShape].name}`;
        updateShadow();
      }

      // ----- Toggle light -----
      function toggleLight() {
        isLightOn = !isLightOn;
        toggleBtn.textContent = isLightOn ? '💡 Toggle Light' : '💡 Light Off';
        status.textContent = isLightOn ? '💡 Light on' : '🌑 Light off';
        updateShadow();
      }

      // ----- Reset -----
      function resetPuppet() {
        currentShape = 0;
        isLightOn = true;
        toggleBtn.textContent = '💡 Toggle Light';
        sizeSlider.value = 100;
        sizeValue.textContent = '100%';
        softnessSlider.value = 50;
        softnessValue.textContent = '50%';
        distanceSlider.value = 100;
        distanceValue.textContent = '100%';
        status.textContent = '↺ Reset to default';
        updateShadow();
        setTimeout(() => {
          status.textContent = '🎭 Move your cursor to transform the shadow puppet';
        }, 500);
      }

      // ----- Event Listeners -----
      // Mouse tracking
      puppetStage.addEventListener('mousemove', (e) => {
        mouseX = e.clientX;
        mouseY = e.clientY;
        isMouseOnStage = true;
      });

      puppetStage.addEventListener('mouseenter', () => {
        isMouseOnStage = true;
        status.textContent = '🎭 Shadow puppet active';
      });

      puppetStage.addEventListener('mouseleave', () => {
        isMouseOnStage = false;
        status.textContent = '🎭 Move cursor back to control shadow';
      });

      // Touch support
      puppetStage.addEventListener('touchmove', (e) => {
        e.preventDefault();
        const touch = e.touches[0];
        mouseX = touch.clientX;
        mouseY = touch.clientY;
        isMouseOnStage = true;
      });

      puppetStage.addEventListener('touchstart', (e) => {
        const touch = e.touches[0];
        mouseX = touch.clientX;
        mouseY = touch.clientY;
        isMouseOnStage = true;
      });

      puppetStage.addEventListener('touchend', () => {
        isMouseOnStage = false;
      });

      // Buttons
      prevBtn.addEventListener('click', () => changeShape(-1));
      nextBtn.addEventListener('click', () => changeShape(1));
      toggleBtn.addEventListener('click', toggleLight);
      resetBtn.addEventListener('click', resetPuppet);

      // Sliders
      sizeSlider.addEventListener('input', (e) => {
        sizeValue.textContent = e.target.value + '%';
        updateShadow();
      });

      softnessSlider.addEventListener('input', (e) => {
        softnessValue.textContent = e.target.value + '%';
        updateShadow();
      });

      distanceSlider.addEventListener('input', (e) => {
        distanceValue.textContent = e.target.value + '%';
        updateShadow();
      });

      // Keyboard shortcuts
      document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft') {
          e.preventDefault();
          changeShape(-1);
        }
        if (e.key === 'ArrowRight') {
          e.preventDefault();
          changeShape(1);
        }
        if (e.key === 't' || e.key === 'T') {
          e.preventDefault();
          toggleLight();
        }
        if (e.key === 'r' || e.key === 'R') {
          e.preventDefault();
          resetPuppet();
        }
      });

      // Click on stage to toggle light
      puppetStage.addEventListener('click', toggleLight);

      // ----- Resize handler -----
      let resizeTimeout;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(() => {
          updateShadow();
        }, 200);
      });

      // ----- Init -----
      function init() {
        startAnimation();
        updateShadow();
        status.textContent = '🎭 Move your cursor to transform the shadow puppet!';
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }

    })();
  </script>
</body>
</html>
