<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Shimmer-Sweep Badge</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<section class="container">

    <div class="hero">

        <span class="tag">Accessible Web</span>

        <h1>Shimmer-Sweep Badge Collection</h1>

        <p>
            Elegant accessibility-focused badges featuring smooth shimmer
            animations, glassmorphism styling, responsive layouts, and pure
            HTML & CSS implementation.
        </p>

    </div>

    <div class="badge-grid">

        <span class="badge primary">
            Accessibility First
        </span>

        <span class="badge success">
            WCAG Ready
        </span>

        <span class="badge info">
            Responsive
        </span>

        <span class="badge premium">
            Premium UI
        </span>

    </div>

</section>

</body>
</html>
