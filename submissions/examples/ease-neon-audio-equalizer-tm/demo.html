<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ease-neon-audio-equalizer — Demo</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { min-height: 100vh; background: #08080f; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2.5rem; font-family: system-ui, sans-serif; color: #e0ffe8; padding: 2rem; }
    h1 { font-size: 1.3rem; font-weight: 400; letter-spacing: 0.06em; }
    .demo-row { display: flex; gap: 2rem; align-items: center; flex-wrap: wrap; justify-content: center; }
    .demo-card { display: flex; flex-direction: column; align-items: center; gap: 0.75rem; }
    .demo-card span { font-size: 0.8rem; color: #44aa66; }
  </style>
</head>
<body>
  <h1>ease-neon-audio-equalizer</h1>
  <div class="demo-row">
    <div class="demo-card">
      <div class="eq-container eq-glow">
        <div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div>
        <div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div>
      </div>
      <span>Neon Green Glow</span>
    </div>
    <div class="demo-card">
      <div class="eq-container eq-glow eq-alt">
        <div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div>
        <div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div>
      </div>
      <span>Neon Pink Alt</span>
    </div>
    <div class="demo-card">
      <div class="eq-container eq-glow eq-mixed">
        <div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div>
        <div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div>
      </div>
      <span>Mixed Colors</span>
    </div>
    <div class="demo-card">
      <div class="eq-container eq-glow eq-sm">
        <div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div>
        <div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div>
      </div>
      <span>Small Size</span>
    </div>
    <div class="demo-card">
      <div class="eq-container eq-glow eq-lg">
        <div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div>
        <div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div>
      </div>
      <span>Large Size</span>
    </div>
  </div>
</body>
</html>
