<main class="page">

    <h1>Blur-Entrance Modal</h1>

    <p>
        A simple CSS-only modal with a smooth blur and fade entrance effect.
    </p>

    <div class="modal-overlay">

        <div class="modal">

            <button class="close" aria-label="Close modal">
                &times;
            </button>

            <div class="modal-icon">
                ✓
            </div>

            <h2>Payment Successful</h2>

            <p class="message">
                Your payment of ₹8,500 has been successfully processed.
            </p>

            <div class="details">
                <div>
                    <span>Transaction ID</span>
                    <strong>#TXN-28491</strong>
                </div>

                <div>
                    <span>Amount</span>
                    <strong>₹8,500</strong>
                </div>
            </div>

            <button class="button">
                Done
            </button>

        </div>

    </div>

</main>
