<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EaseMotion CSS - 3D Card Tilt with Sheen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="tilt-stage em-fade-in">
    <div class="tilt-container">
      
      <!-- Pure CSS 3x3 Interactive Quadrant Hover Triggers -->
      <div class="tilt-trigger quad-top-left"></div>
      <div class="tilt-trigger quad-top-center"></div>
      <div class="tilt-trigger quad-top-right"></div>
      <div class="tilt-trigger quad-mid-left"></div>
      <div class="tilt-trigger quad-mid-center"></div>
      <div class="tilt-trigger quad-mid-right"></div>
      <div class="tilt-trigger quad-bot-left"></div>
      <div class="tilt-trigger quad-bot-center"></div>
      <div class="tilt-trigger quad-bot-right"></div>

      <!-- 3D Card Render Shell -->
      <div class="tilt-card-body" tabindex="0" role="region" aria-label="Product Showcase Card">
        
        <!-- Glossy Sheen Overlay Layer -->
        <div class="card-sheen-layer"></div>
        
        <!-- Inner Card Content (Elevated on Z-Axis) -->
        <div class="card-content">
          <span class="card-badge">ARCHITECTURE</span>
          <h3 class="card-title">Neural Matrix Processing</h3>
          <p class="card-description">
            Next-generation hardware core executing deep learning algorithms with zero-latency spatial pipeline calculations.
          </p>
          
          <div class="card-footer">
            <div class="metric-block">
              <span class="metric-value">128 TFLOPS</span>
              <span class="metric-label">Compute Engine</span>
            </div>
            <button class="card-btn" type="button" aria-label="Explore core details">
              <span>Explore</span>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <path d="M5 12h14M12 5l7 7-7 7"/>
              </svg>
            </button>
          </div>
        </div>

      </div>

    </div>
  </div>

</body>
</html>
