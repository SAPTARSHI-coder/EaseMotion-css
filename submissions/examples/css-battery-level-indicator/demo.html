<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Battery Level Indicator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>CSS Battery Level Indicator</h1>

        <div class="battery-wrapper">
            <p>Low (20%)</p>
            <div class="battery battery-low">
                <div class="battery-fill"></div>
            </div>
        </div>

        <div class="battery-wrapper">
            <p>Medium (60%)</p>
            <div class="battery battery-medium">
                <div class="battery-fill"></div>
            </div>
        </div>

        <div class="battery-wrapper">
            <p>Full (100%)</p>
            <div class="battery battery-full">
                <div class="battery-fill"></div>
            </div>
        </div>
    </div>

</body>
</html>
