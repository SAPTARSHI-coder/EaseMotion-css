<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ease-float-drift-toast — Demo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <header class="page__intro">
      <h1>ease-float-drift-toast</h1>
      <p>Toast notifications that float up and drift out with a gentle sway.</p>
    </header>

    <section class="demo" aria-label="Toast demo">
      <p class="demo__note">Reload to replay the float-drift entrance. Each toast auto-dismisses after the loop.</p>

      <div class="toaststack" role="region" aria-label="Notifications" aria-live="polite">
        <div class="toast toast--info" role="status">
          <span class="toast__icon" aria-hidden="true">ⓘ</span>
          <span class="toast__msg">Sync complete — 3 items updated.</span>
        </div>
        <div class="toast toast--success" role="status">
          <span class="toast__icon" aria-hidden="true">✓</span>
          <span class="toast__msg">Payment received — $129.00</span>
        </div>
        <div class="toast toast--warn" role="status">
          <span class="toast__icon" aria-hidden="true">!</span>
          <span class="toast__msg">Trial ends in 2 days.</span>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
