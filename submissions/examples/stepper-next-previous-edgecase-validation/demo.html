<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stepper Edge Case Demo</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<h1>Stepper Navigation</h1>

<div class="stepper">
<div class="step active">1</div>
<div class="line"></div>
<div class="step">2</div>
<div class="line"></div>
<div class="step">3</div>
</div>

<div class="buttons">
<button disabled>Previous</button>
<button>Next</button>
</div>

<p>Edge-case navigation demonstration.</p>

</div>

</body>
</html>
