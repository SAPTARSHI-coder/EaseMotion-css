<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carousel Fade Slide</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <h1>Carousel Fade Slide</h1>

    <div class="carousel" role="region" aria-roledescription="carousel" aria-label="Featured quotes">
      <div class="carousel-track" id="track">
        <div class="slide is-active" role="group" aria-roledescription="slide" aria-label="1 of 3">
          <p>"Simplicity is the ultimate sophistication."</p>
        </div>
        <div class="slide" role="group" aria-roledescription="slide" aria-label="2 of 3" hidden>
          <p>"Design is not just what it looks like — it's how it works."</p>
        </div>
        <div class="slide" role="group" aria-roledescription="slide" aria-label="3 of 3" hidden>
          <p>"Good design is as little design as possible."</p>
        </div>
      </div>

      <div class="carousel-controls">
        <button id="prevBtn" aria-label="Previous slide">←</button>
        <div class="carousel-dots" id="dots"></div>
        <button id="nextBtn" aria-label="Next slide">→</button>
      </div>
    </div>
  </main>

  <script>
    const slides = Array.from(document.querySelectorAll('.slide'));
    const dotsWrap = document.getElementById('dots');
    let current = 0;

    slides.forEach((_, i) => {
      const dot = document.createElement('button');
      dot.className = 'dot' + (i === 0 ? ' is-active' : '');
      dot.setAttribute('aria-label', `Go to slide ${i + 1}`);
      dot.addEventListener('click', () => goTo(i));
      dotsWrap.appendChild(dot);
    });
    const dots = Array.from(dotsWrap.children);

    function goTo(index) {
      slides[current].classList.remove('is-active');
      dots[current].classList.remove('is-active');
      setTimeout(() => { slides[current].hidden = true; }, 300);

      current = (index + slides.length) % slides.length;
      slides[current].hidden = false;
      requestAnimationFrame(() => slides[current].classList.add('is-active'));
      dots[current].classList.add('is-active');
    }

    document.getElementById('prevBtn').addEventListener('click', () => goTo(current - 1));
    document.getElementById('nextBtn').addEventListener('click', () => goTo(current + 1));
  </script>
</body>
</html>
