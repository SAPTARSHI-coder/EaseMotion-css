<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chalk Line Snap — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Chalk Line Snap demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Chalk Line Snap</h1>
      <p class="lede">Mason chalk line snapping a blue mark across a board</p>
    </header>

    <section class="ease-chalk-line-snap" data-demo="chalk-line-snap" aria-live="polite">
      <div class="ease-chalk-line-snap__housing">
        <div class="ease-chalk-line-snap__bezel">
          <div class="ease-chalk-line-snap__face">
            <div class="ease-chalk-line-snap__readout">
              <span class="ease-chalk-line-snap__label">Chalk Line Snap</span>
              <span class="ease-chalk-line-snap__value">LIVE</span>
            </div>
            <div class="ease-chalk-line-snap__motion" aria-hidden="true">
              <span class="ease-chalk-line-snap__a"></span>
              <span class="ease-chalk-line-snap__b"></span>
              <span class="ease-chalk-line-snap__c"></span>
              <span class="ease-chalk-line-snap__d"></span>
            </div>
            <div class="ease-chalk-line-snap__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-chalk-line-snap__controls">
          <button type="button" class="ease-chalk-line-snap__btn primary">Engage</button>
          <button type="button" class="ease-chalk-line-snap__btn">Reset</button>
          <label class="ease-chalk-line-snap__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-chalk-line-snap__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
