<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Animated Thermometer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header class="header">
            <h1 class="title">Temperature Reading</h1>
            <p>Pure CSS animated thermometer tracking.</p>
        </header>

        <main class="content-area">
            
            <div class="thermometer-widget" role="progressbar" aria-valuenow="75" aria-valuemin="0" aria-valuemax="100" aria-label="Thermometer showing 75 degrees">
                
                <div class="thermometer-glass">
                    <!-- The scale markings -->
                    <div class="scale-markings">
                        <span class="mark">100</span>
                        <span class="mark">80</span>
                        <span class="mark">60</span>
                        <span class="mark">40</span>
                        <span class="mark">20</span>
                        <span class="mark">0</span>
                    </div>

                    <!-- The liquid inside the tube -->
                    <div class="liquid-tube">
                        <div class="liquid-fill"></div>
                    </div>
                </div>
                
                <!-- The bulb at the bottom -->
                <div class="thermometer-bulb">
                    <!-- Reflection for 3D effect -->
                    <div class="bulb-reflection"></div>
                </div>

                <div class="reading-value">75&deg;</div>
            </div>
            
        </main>
    </div>

</body>
</html>
