<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Glowing Pagination — EaseMotion CSS Demo</title>
  <link rel="stylesheet" href="style.css" />

  <style>
    /* Demo-page-only styles (not part of the component) */
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2.5rem;
      padding: 2rem;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at 20% 20%, #14183a 0%, #05060d 60%, #05060d 100%);
    }

    .demo-heading {
      text-align: center;
    }

    .demo-heading h1 {
      margin: 0 0 0.5rem;
      font-size: 1.5rem;
      color: #eaf6ff;
    }

    .demo-heading p {
      margin: 0;
      color: #7c85b3;
      font-size: 0.95rem;
    }

    .demo-section {
      width: 100%;
      max-width: 640px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
    }

    .demo-label {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #5a6188;
    }
  </style>
</head>
<body>

  <div class="demo-heading">
    <h1>Glowing Pagination</h1>
    <p>Neon styling · CSS-only · Fully responsive</p>
  </div>

  <!-- ================= Example 1: default, mid-range active page ================= -->
  <div class="demo-section">
    <span class="demo-label">Default</span>

    <nav class="neon-pagination" aria-label="Pagination">
      <ol class="pagination-list">

        <li class="pagination-item">
          <a class="pagination-link pagination-prev" href="#page-2" aria-label="Go to previous page">
            <svg class="pagination-arrow" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
              <path d="M15 6l-6 6 6 6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span class="pagination-label">Previous</span>
          </a>
        </li>

        <li class="pagination-item">
          <a class="pagination-link" href="#page-1" aria-label="Go to page 1">1</a>
        </li>

        <li class="pagination-item">
          <a class="pagination-link active" href="#page-2" aria-current="page" aria-label="Page 2, current page">2</a>
        </li>

        <li class="pagination-item">
          <a class="pagination-link" href="#page-3" aria-label="Go to page 3">3</a>
        </li>

        <li class="pagination-item">
          <a class="pagination-link" href="#page-4" aria-label="Go to page 4">4</a>
        </li>

        <li class="pagination-item">
          <a class="pagination-link" href="#page-5" aria-label="Go to page 5">5</a>
        </li>

        <li class="pagination-item">
          <a class="pagination-link pagination-next" href="#page-3" aria-label="Go to next page">
            <span class="pagination-label">Next</span>
            <svg class="pagination-arrow" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
              <path d="M9 6l6 6-6 6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </a>
        </li>

      </ol>
    </nav>
  </div>

  <!-- ================= Example 2: first page, Previous disabled ================= -->
  <div class="demo-section">
    <span class="demo-label">First page (Previous disabled)</span>

    <nav class="neon-pagination" aria-label="Pagination">
      <ol class="pagination-list">

        <li class="pagination-item">
          <span class="pagination-link pagination-prev" aria-disabled="true" aria-label="Previous page unavailable">
            <svg class="pagination-arrow" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
              <path d="M15 6l-6 6 6 6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span class="pagination-label">Previous</span>
          </span>
        </li>

        <li class="pagination-item">
          <a class="pagination-link active" href="#page-1" aria-current="page" aria-label="Page 1, current page">1</a>
        </li>

        <li class="pagination-item">
          <a class="pagination-link" href="#page-2" aria-label="Go to page 2">2</a>
        </li>

        <li class="pagination-item">
          <a class="pagination-link" href="#page-3" aria-label="Go to page 3">3</a>
        </li>

        <li class="pagination-item">
          <span class="pagination-ellipsis" aria-hidden="true">&hellip;</span>
        </li>

        <li class="pagination-item">
          <a class="pagination-link" href="#page-12" aria-label="Go to page 12">12</a>
        </li>

        <li class="pagination-item">
          <a class="pagination-link pagination-next" href="#page-2" aria-label="Go to next page">
            <span class="pagination-label">Next</span>
            <svg class="pagination-arrow" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
              <path d="M9 6l6 6-6 6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </a>
        </li>

      </ol>
    </nav>
  </div>

  <!-- ================= Example 3: last page, Next disabled ================= -->
  <div class="demo-section">
    <span class="demo-label">Last page (Next disabled)</span>

    <nav class="neon-pagination" aria-label="Pagination">
      <ol class="pagination-list">

        <li class="pagination-item">
          <a class="pagination-link pagination-prev" href="#page-4" aria-label="Go to previous page">
            <svg class="pagination-arrow" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
              <path d="M15 6l-6 6 6 6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span class="pagination-label">Previous</span>
          </a>
        </li>

        <li class="pagination-item">
          <a class="pagination-link" href="#page-1" aria-label="Go to page 1">1</a>
        </li>

        <li class="pagination-item">
          <span class="pagination-ellipsis" aria-hidden="true">&hellip;</span>
        </li>

        <li class="pagination-item">
          <a class="pagination-link" href="#page-4" aria-label="Go to page 4">4</a>
        </li>

        <li class="pagination-item">
          <a class="pagination-link active" href="#page-5" aria-current="page" aria-label="Page 5, current page">5</a>
        </li>

        <li class="pagination-item">
          <span class="pagination-link pagination-next" aria-disabled="true" aria-label="Next page unavailable">
            <span class="pagination-label">Next</span>
            <svg class="pagination-arrow" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
              <path d="M9 6l6 6-6 6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
        </li>

      </ol>
    </nav>
  </div>

</body>
</html>
