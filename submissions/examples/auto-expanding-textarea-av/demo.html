<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Auto-expanding Textarea • EaseMotion CSS</title>

    <link rel="stylesheet" href="../../easemotion.css" />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="container">
      <span class="badge"> AUTO-EXPANDING TEXTAREA </span>

      <h1>Modern Message Composer</h1>

      <p>
        A premium textarea interface with a clean layout, floating toolbar, and
        colorful focus state ready for messaging, feedback, and note-taking
        interfaces.
      </p>

      <div class="composer">
        <textarea rows="5" placeholder="Write your thoughts here..."></textarea>

        <div class="toolbar">
          <div class="tools">
            <button>😊</button>
            <button>📎</button>
            <button>🖼️</button>
          </div>

          <button class="send">Send →</button>
        </div>
      </div>
    </div>
  </body>
</html>
