<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bamboo Sway – Bamboo Sways in Breeze</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <h1>🎋 Bamboo Sway</h1>
    <p class="subtitle">Bamboo sways gracefully in the breeze</p>

    <div class="bamboo-container">
      <div class="bamboo-stage" id="bambooStage">
        <canvas id="canvas"></canvas>
        
        <!-- Info overlay -->
        <div class="info-overlay">
          <span class="bamboo-status" id="bambooStatus">🎋 Swaying</span>
          <span class="stalk-count" id="stalkCount">✦ 0 stalks</span>
        </div>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <button class="ctrl-btn add" id="addBtn">🎋 Add</button>
      <button class="ctrl-btn clear" id="clearBtn">🗑️ Clear</button>
      <button class="ctrl-btn toggle" id="toggleBtn">⏸ Pause</button>
      <button class="ctrl-btn reset" id="resetBtn">↺ Reset</button>
    </div>

    <!-- Sliders -->
    <div class="slider-container">
      <span class="slider-label">Wind Speed</span>
      <input type="range" id="windSlider" min="0" max="10" value="5" />
      <span class="slider-value" id="windValue">5×</span>
    </div>

    <div class="slider-container">
      <span class="slider-label">Stalk Count</span>
      <input type="range" id="countSlider" min="3" max="20" value="8" step="1" />
      <span class="slider-value" id="countValue">8</span>
    </div>

    <div class="slider-container">
      <span class="slider-label">Sway Amount</span>
      <input type="range" id="swaySlider" min="0" max="100" value="50" />
      <span class="slider-value" id="swayValue">50%</span>
    </div>

    <div class="slider-container">
      <span class="slider-label">Stalk Height</span>
      <input type="range" id="heightSlider" min="50" max="100" value="80" />
      <span class="slider-value" id="heightValue">80%</span>
    </div>

    <!-- Status -->
    <div class="status" id="status">🎋 Bamboo swaying gracefully in the breeze</div>

    <!-- Keyboard shortcuts -->
    <div class="shortcuts">
      <kbd>A</kbd> Add · <kbd>C</kbd> Clear · <kbd>Space</kbd> Pause · <kbd>R</kbd> Reset
    </div>
  </div>

  <script>
    (function() {
      "use strict";

      // DOM elements
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      const bambooStatus = document.getElementById('bambooStatus');
      const stalkCount = document.getElementById('stalkCount');
      const addBtn = document.getElementById('addBtn');
      const clearBtn = document.getElementById('clearBtn');
      const toggleBtn = document.getElementById('toggleBtn');
      const resetBtn = document.getElementById('resetBtn');
      const status = document.getElementById('status');
      const windSlider = document.getElementById('windSlider');
      const windValue = document.getElementById('windValue');
      const countSlider = document.getElementById('countSlider');
      const countValue = document.getElementById('countValue');
      const swaySlider = document.getElementById('swaySlider');
      const swayValue = document.getElementById('swayValue');
      const heightSlider = document.getElementById('heightSlider');
      const heightValue = document.getElementById('heightValue');

      // State
      let stalks = [];
      let isPaused = false;
      let animationId = null;
      let time = 0;
      let windPhase = 0;

      // Bamboo segment colors
      const BAMBOO_COLORS = [
        '#2d5a1e', '#3a7a28', '#4a8a32', '#5a9a3c',
        '#3a6a28', '#4a7a32', '#5a8a3c', '#6a9a46'
      ];

      // ----- Canvas setup -----
      function setupCanvas() {
        const rect = canvas.parentElement.getBoundingClientRect();
        const size = Math.min(rect.width - 40, 600);
        canvas.width = size;
        canvas.height = size;
        canvas.style.width = size + 'px';
        canvas.style.height = size + 'px';
      }

      // ----- Bamboo stalk class -----
      class BambooStalk {
        constructor(x, height) {
          this.x = x;
          this.height = height;
          this.segments = [];
          this.leaves = [];
          this.baseX = x;
          this.phase = Math.random() * Math.PI * 2;
          this.swayOffset = 0.5 + Math.random() * 0.5;
          this.segmentCount = 5 + Math.floor(Math.random() * 8);
          this.color = BAMBOO_COLORS[Math.floor(Math.random() * BAMBOO_COLORS.length)];
          this.generateSegments();
          this.generateLeaves();
        }

        generateSegments() {
          const segHeight = this.height / this.segmentCount;
          for (let i = 0; i < this.segmentCount; i++) {
            const y = i * segHeight;
            const width = 3 + (1 - i / this.segmentCount) * 8;
            this.segments.push({
              y: y,
              width: width,
              height: segHeight,
              node: i > 0
            });
          }
        }

        generateLeaves() {
          const leafCount = 3 + Math.floor(Math.random() * 5);
          for (let i = 0; i < leafCount; i++) {
            const pos = 0.2 + Math.random() * 0.6;
            const side = Math.random() > 0.5 ? 1 : -1;
            const size = 8 + Math.random() * 16;
            const angle = Math.random() * 0.8 + 0.2;
            this.leaves.push({
              pos: pos,
              side: side,
              size: size,
              angle: angle * side,
              color: this.lightenColor(this.color, 20 + Math.random() * 30),
              phase: Math.random() * Math.PI * 2
            });
          }
        }

        lightenColor(color, percent) {
          const num = parseInt(color.replace('#', ''), 16);
          const amt = Math.round(2.55 * percent);
          const R = Math.min(255, (num >> 16) + amt);
          const G = Math.min(255, ((num >> 8) & 0x00FF) + amt);
          const B = Math.min(255, (num & 0x0000FF) + amt);
          return '#' + (0x1000000 + R * 0x10000 + G * 0x100 + B).toString(16).slice(1);
        }

        update(windSpeed, swayAmount) {
          const sway = swayAmount / 100;
          const wind = windSpeed * 0.05;
          
          // Wind effect with gusts
          windPhase += 0.005;
          const gust = Math.sin(windPhase * 0.5 + this.phase) * 0.5 + 0.5;
          const windForce = wind * (0.3 + gust * 0.7);

          // Calculate sway for each segment (more sway at top)
          const maxSway = sway * 60 * (0.5 + 0.5 * this.swayOffset);
          
          // Update segment positions with sway
          for (let i = 0; i < this.segments.length; i++) {
            const seg = this.segments[i];
            const t = i / this.segments.length;
            const swayAmountAtPoint = Math.sin(t * Math.PI * 0.8 + this.phase + time * 0.5) * maxSway * t * (0.5 + 0.5 * gust);
            const windSway = windForce * t * 60 * (0.5 + 0.5 * gust);
            seg.offsetX = swayAmountAtPoint + windSway;
            seg.offsetX *= (1 + t * 0.5);
          }
        }

        draw(ctx, time) {
          const x = this.baseX;
          const bottomY = canvas.height * 0.85;
          
          // Draw stalk segments
          for (let i = 0; i < this.segments.length; i++) {
            const seg = this.segments[i];
            const y = bottomY - seg.y - seg.height;
            const offsetX = seg.offsetX || 0;
            const width = seg.width;
            
            // Segment glow
            const glowGrad = ctx.createRadialGradient(
              x + offsetX, y + seg.height / 2, 0,
              x + offsetX, y + seg.height / 2, width * 3
            );
            glowGrad.addColorStop(0, `rgba(50, 150, 50, 0.05)`);
            glowGrad.addColorStop(1, `rgba(50, 150, 50, 0)`);
            ctx.fillStyle = glowGrad;
            ctx.beginPath();
            ctx.arc(x + offsetX, y + seg.height / 2, width * 3, 0, Math.PI * 2);
            ctx.fill();

            // Segment body
            ctx.save();
            ctx.translate(x + offsetX, y);
            
            // Gradient for 3D effect
            const grad = ctx.createLinearGradient(-width/2, 0, width/2, 0);
            grad.addColorStop(0, this.darkenColor(this.color, 20));
            grad.addColorStop(0.3, this.lightenColor(this.color, 20));
            grad.addColorStop(0.7, this.color);
            grad.addColorStop(1, this.darkenColor(this.color, 30));
            
            ctx.fillStyle = grad;
            ctx.shadowColor = 'rgba(0,0,0,0.1)';
            ctx.shadowBlur = 5;
            
            // Rounded rectangle
            const radius = width / 2;
            ctx.beginPath();
            ctx.moveTo(-width/2, 0);
            ctx.quadraticCurveTo(-width/2, radius, -width/2 + radius, radius);
            ctx.lineTo(width/2 - radius, radius);
            ctx.quadraticCurveTo(width/2, radius, width/2, 0);
            ctx.lineTo(width/2, seg.height - radius);
            ctx.quadraticCurveTo(width/2, seg.height, width/2 - radius, seg.height);
            ctx.lineTo(-width/2 + radius, seg.height);
            ctx.quadraticCurveTo(-width/2, seg.height, -width/2, seg.height - radius);
            ctx.closePath();
            ctx.fill();
            
            ctx.shadowBlur = 0;

            // Node ring (joint)
            if (seg.node) {
              ctx.strokeStyle = this.darkenColor(this.color, 40);
              ctx.lineWidth = 0.5;
              ctx.beginPath();
              ctx.ellipse(0, 0, width/2 + 1, 1.5, 0, 0, Math.PI * 2);
              ctx.stroke();
              
              // Node highlight
              ctx.fillStyle = `rgba(255, 255, 255, 0.05)`;
              ctx.beginPath();
              ctx.ellipse(0, 0, width/2 * 0.6, 1, 0, 0, Math.PI * 2);
              ctx.fill();
            }

            // Highlight (light reflection)
            ctx.fillStyle = `rgba(255, 255, 255, 0.05)`;
            ctx.beginPath();
            ctx.ellipse(-width/4, seg.height/2, width/6, seg.height/2 * 0.8, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
          }

          // Draw leaves
          for (const leaf of this.leaves) {
            const segIndex = Math.floor(leaf.pos * this.segments.length);
            const seg = this.segments[Math.min(segIndex, this.segments.length - 1)];
            const yPos = bottomY - seg.y - seg.height * (leaf.pos * this.segmentCount % 1);
            const offsetX = seg.offsetX || 0;
            
            const swayAngle = Math.sin(time * 0.5 + leaf.phase + this.phase) * 0.1;
            const windSway = Math.sin(windPhase * 0.3 + leaf.phase) * 0.05;
            const angle = leaf.angle + swayAngle + windSway;
            
            ctx.save();
            ctx.translate(
              this.x + offsetX + leaf.side * seg.width/2,
              yPos + seg.height * 0.3
            );
            ctx.rotate(angle);
            
            // Leaf glow
            const leafGlow = ctx.createRadialGradient(0, 0, 0, 0, 0, leaf.size * 1.5);
            leafGlow.addColorStop(0, `rgba(50, 200, 50, 0.03)`);
            leafGlow.addColorStop(1, `rgba(50, 200, 50, 0)`);
            ctx.fillStyle = leafGlow;
            ctx.beginPath();
            ctx.arc(0, 0, leaf.size * 1.5, 0, Math.PI * 2);
            ctx.fill();

            // Leaf shape
            const grad = ctx.createLinearGradient(0, -leaf.size/2, leaf.size, 0);
            const leafColor = leaf.color;
            grad.addColorStop(0, this.lightenColor(leafColor, 20));
            grad.addColorStop(0.5, leafColor);
            grad.addColorStop(1, this.darkenColor(leafColor, 20));
            ctx.fillStyle = grad;
            
            ctx.shadowColor = 'rgba(0,0,0,0.05)';
            ctx.shadowBlur = 3;
            
            ctx.beginPath();
            ctx.moveTo(0, -leaf.size/2);
            ctx.quadraticCurveTo(leaf.size * 0.7, -leaf.size/4, leaf.size * 0.9, 0);
            ctx.quadraticCurveTo(leaf.size * 0.7, leaf.size/4, 0, leaf.size/2);
            ctx.quadraticCurveTo(-leaf.size * 0.2, leaf.size/4, 0, 0);
            ctx.closePath();
            ctx.fill();
            
            ctx.shadowBlur = 0;

            // Leaf vein
            ctx.strokeStyle = this.darkenColor(leafColor, 30) + '44';
            ctx.lineWidth = 0.5;
            ctx.beginPath();
            ctx.moveTo(0, -leaf.size/3);
            ctx.quadraticCurveTo(leaf.size * 0.3, 0, 0, leaf.size/3);
            ctx.stroke();

            ctx.restore();
          }
        }

        darkenColor(color, percent) {
          const num = parseInt(color.replace('#', ''), 16);
          const amt = Math.round(2.55 * percent);
          const R = Math.max(0, (num >> 16) - amt);
          const G = Math.max(0, ((num >> 8) & 0x00FF) - amt);
          const B = Math.max(0, (num & 0x0000FF) - amt);
          return '#' + (0x1000000 + R * 0x10000 + G * 0x100 + B).toString(16).slice(1);
        }
      }

      // ----- Generate bamboo -----
      function generateBamboo(count) {
        const w = canvas.width;
        const padding = 40;
        const heightMult = parseInt(heightSlider.value) / 100;
        const maxHeight = canvas.height * 0.65 * heightMult;
        const spacing = (w - padding * 2) / count;

        stalks = [];
        for (let i = 0; i < count; i++) {
          const x = padding + i * spacing + spacing * 0.2 + Math.random() * spacing * 0.6;
          const height = maxHeight * (0.6 + Math.random() * 0.4);
          const stalk = new BambooStalk(x, height);
          stalks.push(stalk);
        }
        stalkCount.textContent = `✦ ${stalks.length} stalks`;
        countValue.textContent = stalks.length;
      }

      // ----- Add stalks -----
      function addStalks(count = 1) {
        const w = canvas.width;
        const padding = 40;
        const heightMult = parseInt(heightSlider.value) / 100;
        const maxHeight = canvas.height * 0.65 * heightMult;
        const currentCount = stalks.length;
        const spacing = (w - padding * 2) / (currentCount + count);

        // Reposition existing stalks
        stalks.forEach((stalk, i) => {
          stalk.x = padding + i * spacing + spacing * 0.2;
          stalk.baseX = stalk.x;
        });

        // Add new stalks
        for (let i = 0; i < count; i++) {
          const index = currentCount + i;
          const x = padding + index * spacing + spacing * 0.2 + Math.random() * spacing * 0.3;
          const height = maxHeight * (0.6 + Math.random() * 0.4);
          const stalk = new BambooStalk(x, height);
          stalks.push(stalk);
        }

        stalkCount.textContent = `✦ ${stalks.length} stalks`;
        status.textContent = `🎋 Added ${count} stalk(s) (${stalks.length} total)`;
        setTimeout(() => {
          status.textContent = '🎋 Bamboo swaying gracefully in the breeze';
        }, 1500);
      }

      // ----- Clear stalks -----
      function clearStalks() {
        stalks = [];
        stalkCount.textContent = '✦ 0 stalks';
        bambooStatus.textContent = '🎋 Empty';
        status.textContent = '🗑️ Bamboo cleared';
        setTimeout(() => {
          status.textContent = '🎋 Click Add to grow bamboo';
        }, 1000);
      }

      // ----- Toggle pause -----
      function togglePause() {
        isPaused = !isPaused;
        toggleBtn.textContent = isPaused ? '▶ Play' : '⏸ Pause';
        status.textContent = isPaused ? '⏸ Paused' : '▶ Resumed';
        bambooStatus.textContent = isPaused ? '⏸ Paused' : '🎋 Swaying';
      }

      // ----- Reset -----
      function resetBamboo() {
        stalks = [];
        isPaused = false;
        toggleBtn.textContent = '⏸ Pause';
        bambooStatus.textContent = '🎋 Swaying';
        windSlider.value = 5;
        windValue.textContent = '5×';
        countSlider.value = 8;
        countValue.textContent = '8';
        swaySlider.value = 50;
        swayValue.textContent = '50%';
        heightSlider.value = 80;
        heightValue.textContent = '80%';
        generateBamboo(8);
        status.textContent = '↺ Reset';
        setTimeout(() => {
          status.textContent = '🎋 Bamboo swaying gracefully in the breeze';
        }, 500);
      }

      // ----- Draw background -----
      function drawBackground() {
        const w = canvas.width;
        const h = canvas.height;
        const cx = w / 2;
        const cy = h / 2;

        // Sky gradient (soft warm)
        const bgGradient = ctx.createLinearGradient(0, 0, 0, h);
        bgGradient.addColorStop(0, '#1a1a2e');
        bgGradient.addColorStop(0.4, '#141428');
        bgGradient.addColorStop(0.7, '#0d0d1a');
        bgGradient.addColorStop(1, '#06060a');
        ctx.fillStyle = bgGradient;
        ctx.fillRect(0, 0, w, h);

        // Subtle light rays
        for (let i = 0; i < 6; i++) {
          const angle = (i / 6) * Math.PI * 2 + time * 0.005;
          const length = w * 0.5;
          const alpha = 0.005 + (i % 2) * 0.005;
          ctx.strokeStyle = `rgba(255, 200, 150, ${alpha})`;
          ctx.lineWidth = 0.5;
          ctx.beginPath();
          ctx.moveTo(cx, h * 0.2);
          ctx.lineTo(cx + Math.cos(angle) * length, h * 0.2 + Math.sin(angle) * length);
          ctx.stroke();
        }

        // Ground
        const groundGrad = ctx.createLinearGradient(0, h * 0.85, 0, h);
        groundGrad.addColorStop(0, 'rgba(20, 40, 20, 0)');
        groundGrad.addColorStop(0.3, 'rgba(20, 40, 20, 0.3)');
        groundGrad.addColorStop(1, 'rgba(10, 20, 10, 0.6)');
        ctx.fillStyle = groundGrad;
        ctx.fillRect(0, h * 0.85, w, h * 0.15);

        // Ground texture
        for (let i = 0; i < 20; i++) {
          const seed = i * 137.508;
          const x = (seed * 0.618) % w;
          const y = h * 0.85 + (seed * 0.381) % (h * 0.15);
          const size = 1 + (seed % 4);
          const alpha = 0.02 + (seed % 100) / 100 * 0.03;
          ctx.fillStyle = `rgba(50, 100, 50, ${alpha})`;
          ctx.beginPath();
          ctx.arc(x, y, size, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // ----- Draw -----
      function draw() {
        const w = canvas.width;
        const h = canvas.height;

        drawBackground();

        // Update stalks
        if (!isPaused) {
          const windSpeed = parseInt(windSlider.value);
          const swayAmount = parseInt(swaySlider.value);
          stalks.forEach(s => s.update(windSpeed, swayAmount));
        }

        // Draw stalks (back to front)
        const sortedStalks = [...stalks].sort((a, b) => a.x - b.x);
        sortedStalks.forEach(s => s.draw(ctx, time));

        // Update status
        if (stalks.length > 0) {
          bambooStatus.textContent = '🎋 Swaying';
        }
      }

      // ----- Animation loop -----
      function animate() {
        time += 0.016;
        draw();
        animationId = requestAnimationFrame(animate);
      }

      // ----- Start animation -----
      function startAnimation() {
        if (animationId) {
          cancelAnimationFrame(animationId);
        }
        animate();
      }

      // ----- Event Listeners -----
      addBtn.addEventListener('click', () => addStalks(1));
      clearBtn.addEventListener('click', clearStalks);
      toggleBtn.addEventListener('click', togglePause);
      resetBtn.addEventListener('click', resetBamboo);

      windSlider.addEventListener('input', (e) => {
        windValue.textContent = e.target.value + '×';
      });

      countSlider.addEventListener('input', (e) => {
        const val = parseInt(e.target.value);
        countValue.textContent = val;
        generateBamboo(val);
        status.textContent = `🎋 ${val} bamboo stalks`;
        setTimeout(() => {
          status.textContent = '🎋 Bamboo swaying gracefully in the breeze';
        }, 1500);
      });

      swaySlider.addEventListener('input', (e) => {
        swayValue.textContent = e.target.value + '%';
      });

      heightSlider.addEventListener('input', (e) => {
        heightValue.textContent = e.target.value + '%';
        generateBamboo(stalks.length || 8);
      });

      // Keyboard shortcuts
      document.addEventListener('keydown', (e) => {
        if (e.key === 'a' || e.key === 'A') {
          e.preventDefault();
          addStalks(1);
        }
        if (e.key === 'c' || e.key === 'C') {
          e.preventDefault();
          clearStalks();
        }
        if (e.key === ' ' || e.key === 'Space') {
          e.preventDefault();
          togglePause();
        }
        if (e.key === 'r' || e.key === 'R') {
          e.preventDefault();
          resetBamboo();
        }
      });

      // Click canvas to add stalk
      canvas.addEventListener('click', () => addStalks(1));

      // ----- Resize handler -----
      let resizeTimeout;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(() => {
          setupCanvas();
          generateBamboo(stalks.length || 8);
        }, 200);
      });

      // ----- Init -----
      function init() {
        setupCanvas();
        generateBamboo(8);
        startAnimation();
        status.textContent = '🎋 Bamboo swaying gracefully in the breeze!';
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }

    })();
  </script>
</body>
</html>
