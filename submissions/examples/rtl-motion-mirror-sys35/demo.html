<!DOCTYPE html>
<html lang="en" dir="ltr" id="docRoot">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RTL (Right-To-Left) Native Bi-Directional Layout & Motion Mirror Module</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../easemotion.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>RTL Motion Mirror Module</h1>
      <p>Directional animations automatically mirror when document direction is set to RTL.</p>
      <button class="btn" onclick="toggleRTL()">Toggle LTR / RTL</button>
    </header>

    <main class="stage">
      <div class="rtl-card">
        <h2>Slide Motion Card</h2>
        <p>Current Direction: <span id="dirLabel">LTR</span></p>
      </div>
    </main>
  </div>

  <script>
    function toggleRTL() {
      const doc = document.getElementById('docRoot');
      const label = document.getElementById('dirLabel');
      const isRTL = doc.getAttribute('dir') === 'rtl';
      doc.setAttribute('dir', isRTL ? 'ltr' : 'rtl');
      label.textContent = isRTL ? 'LTR' : 'RTL';
    }
  </script>
</body>
</html>
