<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stat Counter Card</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="page">

    <section class="stat-card" aria-label="Website visits statistics">

      <div class="card-header">
        <div>
          <p class="eyebrow">Monthly Overview</p>
          <h1>Website Visits</h1>
        </div>

        <span class="trend">+18.4%</span>
      </div>

      <div class="stat-value">48,294</div>

      <p class="description">
        Total visits this month
      </p>

      <div class="chart" aria-label="Mini bar chart">
        <span class="bar" style="--height: 35%;"></span>
        <span class="bar" style="--height: 52%;"></span>
        <span class="bar" style="--height: 43%;"></span>
        <span class="bar" style="--height: 68%;"></span>
        <span class="bar" style="--height: 57%;"></span>
        <span class="bar" style="--height: 82%;"></span>
        <span class="bar" style="--height: 72%;"></span>
        <span class="bar" style="--height: 96%;"></span>
      </div>

      <div class="card-footer">
        <span>Last 30 days</span>
        <span>Updated today</span>
      </div>

    </section>

  </main>
</body>
</html>
