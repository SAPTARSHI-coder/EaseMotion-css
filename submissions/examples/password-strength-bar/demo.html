<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password strength bar — EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <header class="page-head">
      <h1>Password strength bar</h1>
      <p>An input whose accent bar grows and shifts colour from red to amber to green as the password gets stronger.</p>
    </header>
    <section class="demo">
      <div class="passwordstrengthbar"><input type="password" placeholder="Choose a password"><div class="passwordstrengthbar-bar"><div class="passwordstrengthbar-fill"></div></div><div class="passwordstrengthbar-label">Strength: <span>—</span></div></div>
    </section>
    <footer class="page-foot">
      <small>Submission folder: <code>submissions/examples/password-strength-bar/</code></small>
    </footer>
  </main>
</body>
</html>
