<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Schlieren Shock Ripple — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Schlieren Shock Ripple demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Schlieren Shock Ripple</h1>
      <p class="lede">Schlieren shock ripples shearing through density gradients</p>
    </header>

    <section class="ease-schlieren-shock-ripple" data-demo="schlieren-shock-ripple" aria-live="polite">
      <div class="ease-schlieren-shock-ripple__housing">
        <div class="ease-schlieren-shock-ripple__bezel">
          <div class="ease-schlieren-shock-ripple__face">
            <div class="ease-schlieren-shock-ripple__readout">
              <span class="ease-schlieren-shock-ripple__label">Schlieren Shock Ripple</span>
              <span class="ease-schlieren-shock-ripple__value">LIVE</span>
            </div>
            <div class="ease-schlieren-shock-ripple__motion" aria-hidden="true">
              <span class="ease-schlieren-shock-ripple__a"></span>
              <span class="ease-schlieren-shock-ripple__b"></span>
              <span class="ease-schlieren-shock-ripple__c"></span>
              <span class="ease-schlieren-shock-ripple__d"></span>
            </div>
            <div class="ease-schlieren-shock-ripple__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-schlieren-shock-ripple__controls">
          <button type="button" class="ease-schlieren-shock-ripple__btn primary">Engage</button>
          <button type="button" class="ease-schlieren-shock-ripple__btn">Reset</button>
          <label class="ease-schlieren-shock-ripple__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-schlieren-shock-ripple__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
