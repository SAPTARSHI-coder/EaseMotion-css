<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dryer Timer Dial | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="dywrap">
    <div class="dyunit">
      <div class="dytick major" style="transform:translateX(-50%) rotate(-135deg)"></div>
      <span class="dylabel" style="transform:translateX(-50%) rotate(-135deg) translateY(38px) rotate(135deg)">Off</span>
      <div class="dytick" style="transform:translateX(-50%) rotate(-108deg)"></div>
      <div class="dytick" style="transform:translateX(-50%) rotate(-81deg)"></div>
      <div class="dytick major" style="transform:translateX(-50%) rotate(-54deg)"></div>
      <span class="dylabel" style="transform:translateX(-50%) rotate(-54deg) translateY(38px) rotate(54deg)">30</span>
      <div class="dytick" style="transform:translateX(-50%) rotate(-27deg)"></div>
      <div class="dytick" style="transform:translateX(-50%) rotate(0deg)"></div>
      <div class="dytick major" style="transform:translateX(-50%) rotate(27deg)"></div>
      <span class="dylabel" style="transform:translateX(-50%) rotate(27deg) translateY(38px) rotate(-27deg)">60</span>
      <div class="dytick" style="transform:translateX(-50%) rotate(54deg)"></div>
      <div class="dytick" style="transform:translateX(-50%) rotate(81deg)"></div>
      <div class="dytick major" style="transform:translateX(-50%) rotate(108deg)"></div>
      <span class="dylabel" style="transform:translateX(-50%) rotate(108deg) translateY(38px) rotate(-108deg)">90</span>
      <div class="dytick" style="transform:translateX(-50%) rotate(135deg)"></div>
      <div class="dycenter">PUSH</div>
      <div class="dypointer"></div>
    </div>
    <p class="dycap">Timer set: 60 min</p>
  </div>
</body>
</html>
