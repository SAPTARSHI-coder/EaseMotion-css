<!-- EaseMotion component: gumball-machine-drop -->
<!DOCTYPE html>
<html lang="en" data-gum="machine">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Ease Gumball Machine Drop</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="gum-machine">
  <header class="gum-head">
    <span class="gum-title">GUMBALL</span>
    <span class="gum-price">25&cent;</span>
  </header>
  <div class="gum-dome">
    <span class="gum g-red"></span>
    <span class="gum g-blue"></span>
    <span class="gum g-yellow"></span>
    <span class="gum g-green"></span>
    <span class="gum g-purple"></span>
    <span class="gum g-orange"></span>
  </div>
  <div class="gum-body">
    <span class="gum-chute"></span>
    <span class="gum-door"></span>
  </div>
  <div class="gum-tray">
    <span class="gum-drop"></span>
  </div>
  <div class="gum-base">
    <span class="gum-knob"></span>
  </div>
  <footer class="gum-foot">
    <span class="gum-flavor">GRAPE</span>
    <span class="gum-stock">STOCK 120</span>
  </footer>
</main>
</body>
</html>
