<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Campfire</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="campfire" role="img" aria-label="Animated campfire with flickering flames">

    <div class="glow"></div>

    <div class="fire">
      <div class="flame flame-main"></div>
      <div class="flame flame-left"></div>
      <div class="flame flame-right"></div>
      <div class="flame flame-small-1"></div>
      <div class="flame flame-small-2"></div>
    </div>

    <div class="embers">
      <span class="ember ember-1"></span>
      <span class="ember ember-2"></span>
      <span class="ember ember-3"></span>
      <span class="ember ember-4"></span>
      <span class="ember ember-5"></span>
      <span class="ember ember-6"></span>
    </div>

    <div class="logs">
      <div class="log log-left"></div>
      <div class="log log-right"></div>
    </div>

    <div class="stones">
      <span class="stone stone-1"></span>
      <span class="stone stone-2"></span>
      <span class="stone stone-3"></span>
      <span class="stone stone-4"></span>
      <span class="stone stone-5"></span>
      <span class="stone stone-6"></span>
      <span class="stone stone-7"></span>
    </div>

  </div>

</body>
</html>
