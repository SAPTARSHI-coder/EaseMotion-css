<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Environment Badge</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <!-- Development Environment Badge -->
  <div class="env-badge dev" aria-label="Environment: Development">
    <div class="status-dot" aria-hidden="true"></div>
    <span>Development</span>
  </div>

  <!-- Staging Environment Badge -->
  <div class="env-badge staging" aria-label="Environment: Staging">
    <svg class="env-icon" aria-hidden="true" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path>
    </svg>
    <span>Staging</span>
  </div>

  <!-- Production Environment Badge -->
  <div class="env-badge prod" aria-label="Environment: Production">
    <svg class="env-icon" aria-hidden="true" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
    </svg>
    <span>Production</span>
  </div>

</body>
</html>
