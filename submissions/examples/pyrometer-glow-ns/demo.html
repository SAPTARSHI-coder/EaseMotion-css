<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pyrometer Glow — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Pyrometer Glow demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Pyrometer Glow</h1>
      <p class="lede">Optical pyrometer filament glowing to match heat</p>
    </header>

    <section class="ease-pyrometer-glow" data-demo="pyrometer-glow" aria-live="polite">
      <div class="ease-pyrometer-glow__housing">
        <div class="ease-pyrometer-glow__bezel">
          <div class="ease-pyrometer-glow__face">
            <div class="ease-pyrometer-glow__readout">
              <span class="ease-pyrometer-glow__label">Pyrometer Glow</span>
              <span class="ease-pyrometer-glow__value">LIVE</span>
            </div>
            <div class="ease-pyrometer-glow__motion" aria-hidden="true">
              <span class="ease-pyrometer-glow__a"></span>
              <span class="ease-pyrometer-glow__b"></span>
              <span class="ease-pyrometer-glow__c"></span>
              <span class="ease-pyrometer-glow__d"></span>
            </div>
            <div class="ease-pyrometer-glow__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-pyrometer-glow__controls">
          <button type="button" class="ease-pyrometer-glow__btn primary">Engage</button>
          <button type="button" class="ease-pyrometer-glow__btn">Reset</button>
          <label class="ease-pyrometer-glow__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-pyrometer-glow__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
