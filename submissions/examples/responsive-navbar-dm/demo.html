<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Navbar with Dark Mode</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar ease-navbar-dm">
        <div class="nav-container">
            <a href="#" class="nav-logo">Logo</a>
            <button class="nav-toggle" aria-label="Toggle Navigation">
                <span class="hamburger"></span>
            </button>
            <ul class="nav-menu">
                <li class="nav-item"><a href="#" class="nav-link">Home</a></li>
                <li class="nav-item"><a href="#" class="nav-link">About</a></li>
                <li class="nav-item"><a href="#" class="nav-link">Services</a></li>
                <li class="nav-item"><a href="#" class="nav-link">Contact</a></li>
                <li class="nav-item"><button class="theme-toggle" aria-label="Toggle Dark Mode">🌙</button></li>
            </ul>
        </div>
    </nav>
    <main style="padding: 2rem; max-width: 1200px; margin: 0 auto;">
        <h1>Welcome to EaseMotion</h1>
        <p>This is a responsive navbar with a dark mode toggle.</p>
    </main>
    <script>
        const toggle = document.querySelector('.nav-toggle');
        const menu = document.querySelector('.nav-menu');
        const themeToggle = document.querySelector('.theme-toggle');

        toggle.addEventListener('click', () => {
            menu.classList.toggle('active');
        });

        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('dark-theme');
            themeToggle.textContent = document.body.classList.contains('dark-theme') ? '☀️' : '🌙';
        });
    </script>
</body>
</html>
