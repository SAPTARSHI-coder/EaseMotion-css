<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Magnetic Floating Dock Navigation Bar Demo - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <header class="header">
      <span class="badge">macOS Dock & Spring Physics</span>
      <h1 class="title">Magnetic Dock Navigation</h1>
      <p class="subtitle">Floating bottom navigation bar with interactive scale expansion hover physics, active indicator dots, and keyboard accessibility.</p>
    </header>

    <nav class="magnetic-dock" aria-label="Primary Floating Navigation">
      <ul class="dock-list">
        <li class="dock-item active">
          <a href="#home" class="dock-link" aria-label="Home Workspace">
            <span class="dock-icon">🏠</span>
            <span class="dock-tooltip">Home</span>
          </a>
          <span class="active-dot"></span>
        </li>
        <li class="dock-item">
          <a href="#analytics" class="dock-link" aria-label="Analytics Dashboard">
            <span class="dock-icon">📊</span>
            <span class="dock-tooltip">Analytics</span>
          </a>
          <span class="active-dot"></span>
        </li>
        <li class="dock-item">
          <a href="#projects" class="dock-link" aria-label="Projects Showcase">
            <span class="dock-icon">📁</span>
            <span class="dock-tooltip">Projects</span>
          </a>
          <span class="active-dot"></span>
        </li>
        <li class="dock-item">
          <a href="#messages" class="dock-link" aria-label="Messages Notification">
            <span class="dock-icon">💬</span>
            <span class="dock-tooltip">Messages</span>
          </a>
          <span class="active-dot"></span>
        </li>
        <li class="dock-item">
          <a href="#settings" class="dock-link" aria-label="System Settings">
            <span class="dock-icon">⚙️</span>
            <span class="dock-tooltip">Settings</span>
          </a>
          <span class="active-dot"></span>
        </li>
      </ul>
    </nav>
  </main>
</body>
</html>
