<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-clock-tower-bells demo</title>
</head>
<body>
<div class="tw-app">
  <div class="tw-head">
    <span class="tw-name">HARBOR TOWN</span>
    <span class="tw-badge">CHIME</span>
  </div>
  <div class="tw-stage">
    <div class="tw-tower">
      <div class="tw-spire">
        <span class="tw-pole"></span>
        <span class="tw-flag"></span>
      </div>
      <div class="tw-clock">
        <div class="tw-ring"></div>
        <span class="tw-mark tw-m12">12</span>
        <span class="tw-mark tw-m3">3</span>
        <span class="tw-mark tw-m6">6</span>
        <span class="tw-mark tw-m9">9</span>
        <div class="tw-hand tw-hour"></div>
        <div class="tw-hand tw-minute"></div>
        <span class="tw-pin"></span>
      </div>
      <div class="tw-brick">
        <div class="tw-arch tw-arch-left">
          <span class="tw-bell tw-bell-left"></span>
        </div>
        <div class="tw-arch tw-arch-right">
          <span class="tw-bell tw-bell-right"></span>
        </div>
      </div>
      <div class="tw-door">
        <span class="tw-archway"></span>
        <span class="tw-step"></span>
      </div>
    </div>
  </div>
  <div class="tw-foot">BELLS 2</div>
</div>
</body>
</html>
