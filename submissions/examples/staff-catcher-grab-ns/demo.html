<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Catcher Grab — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Staff Catcher Grab demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Staff Catcher Grab</h1>
      <p class="lede">Staff catcher grabbing the pouch at speed</p>
    </header>

    <section class="ease-staff-catcher-grab" data-demo="staff-catcher-grab" aria-live="polite">
      <div class="ease-staff-catcher-grab__housing">
        <div class="ease-staff-catcher-grab__bezel">
          <div class="ease-staff-catcher-grab__face">
            <div class="ease-staff-catcher-grab__readout">
              <span class="ease-staff-catcher-grab__label">Staff Catcher Grab</span>
              <span class="ease-staff-catcher-grab__value">LIVE</span>
            </div>
            <div class="ease-staff-catcher-grab__motion" aria-hidden="true">
              <span class="ease-staff-catcher-grab__a"></span>
              <span class="ease-staff-catcher-grab__b"></span>
              <span class="ease-staff-catcher-grab__c"></span>
              <span class="ease-staff-catcher-grab__d"></span>
            </div>
            <div class="ease-staff-catcher-grab__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-staff-catcher-grab__controls">
          <button type="button" class="ease-staff-catcher-grab__btn primary">Catch</button>
          <button type="button" class="ease-staff-catcher-grab__btn">Drop</button>
          <label class="ease-staff-catcher-grab__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-staff-catcher-grab__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
