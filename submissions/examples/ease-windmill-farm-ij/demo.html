<!-- EaseMotion component: windmill-farm -->
<!DOCTYPE html>
<html lang="en" data-wind="farm">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Ease Windmill Farm</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="wind-farm">
  <div class="windmill">
    <div class="turbine-tower"></div>
    <div class="turbine-nacelle">
      <span class="hub-cap"></span>
    </div>
    <div class="blade-set">
      <i class="turbine-blade tb-1"></i>
      <i class="turbine-blade tb-2"></i>
      <i class="turbine-blade tb-3"></i>
    </div>
  </div>
  <div class="farm-ridge">
    <span class="farm-label">WIND FARM</span>
  </div>
</main>
</body>
</html>
