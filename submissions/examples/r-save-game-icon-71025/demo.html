<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <meta
    name="description"
    content="CSS animated floppy disk save game icon"
  >
  <title>CSS Save Game Icon</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">
    <section class="save-demo" aria-labelledby="title">

      <p class="eyebrow">EaseMotion CSS</p>

      <h1 id="title">Save Game Icon</h1>

      <p class="intro">
        A retro-inspired floppy disk icon with a smooth spinning
        save animation built entirely with CSS.
      </p>

      <div class="demo-card">

        <div
          class="save-icon"
          role="img"
          aria-label="Animated save game floppy disk icon"
        >
          <div class="disk-label">
            <span class="label-line"></span>
            <span class="label-line short"></span>
          </div>

          <div class="disk-shutter">
            <span></span>
          </div>

          <div class="disk-center">
            <span class="center-hole"></span>
          </div>

          <div class="save-check" aria-hidden="true">
            ✓
          </div>
        </div>

        <div class="save-info">
          <span class="status">
            <span class="status-dot" aria-hidden="true"></span>
            SAVING
          </span>

          <h2>Game Progress</h2>

          <p>
            Your latest progress is being saved.
          </p>
        </div>

      </div>

    </section>
  </main>

</body>
</html>
