<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Bento Metrics Grid - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bento-container">
    <div class="bento-card card-large">
      <div class="spotlight"></div>
      <div class="card-tag">REVENUE OVERVIEW</div>
      <div class="metric-val">$148,920</div>
      <div class="trend positive">+24.5% vs last month</div>
      <div class="sparkline-bar">
        <div class="bar h40"></div>
        <div class="bar h60"></div>
        <div class="bar h90"></div>
        <div class="bar h75"></div>
        <div class="bar h100"></div>
      </div>
    </div>
    
    <div class="bento-card card-small">
      <div class="spotlight"></div>
      <div class="card-tag">ACTIVE USERS</div>
      <div class="metric-val">12.4K</div>
      <div class="pulse-status">LIVE NOW</div>
    </div>
    
    <div class="bento-card card-small">
      <div class="spotlight"></div>
      <div class="card-tag">CONVERSION</div>
      <div class="metric-val">4.85%</div>
      <div class="trend neutral">+0.2%</div>
    </div>
  </div>
</body>
</html>
