<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sliding Carousel</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <div class="ease-carousel" role="region" aria-roledescription="carousel" aria-label="Auto-advancing slides">
        <div class="ease-carousel__track">
          <div class="ease-carousel__slide" role="group" aria-roledescription="slide" aria-label="1 of 4">Slide 1</div>
          <div class="ease-carousel__slide" role="group" aria-roledescription="slide" aria-label="2 of 4">Slide 2</div>
          <div class="ease-carousel__slide" role="group" aria-roledescription="slide" aria-label="3 of 4">Slide 3</div>
          <div class="ease-carousel__slide" role="group" aria-roledescription="slide" aria-label="4 of 4">Slide 4</div>
        </div>
      </div>
    </main>
  </body>
</html>
