<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plasma Energy Shield - EaseMotion CSS</title>
    <!-- Include EaseMotion Core Stylesheet -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030712; color: #ffffff;">

    <div class="ease-card ease-card-glass plasma-container">
        <div class="plasma-header">
            <h2>Plasma Shield</h2>
            <span class="ease-badge ease-badge-success">Active</span>
        </div>
        
        <div class="plasma-screen ease-center">
            <div class="plasma-wave wave-1"></div>
            <div class="plasma-wave wave-2"></div>
            <div class="plasma-core ease-center"></div>
        </div>

        <div class="plasma-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Frequency: 142 GHz</span>
            <button class="ease-btn ease-btn-primary ease-btn-sm ease-hover-grow">Modulate</button>
        </div>
    </div>

</body>
</html>
