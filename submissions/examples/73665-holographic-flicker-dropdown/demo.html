<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <meta
    name="description"
    content="Pure CSS Holographic Flicker Dropdown"
  >
  <title>Holographic Flicker Dropdown</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="page">
    <section class="demo">
      <p class="eyebrow">CSS DROPDOWN</p>

      <h1>Holographic Flicker</h1>

      <p class="intro">
        A futuristic dropdown built entirely with semantic HTML
        and vanilla CSS.
      </p>

      <details class="holo-dropdown">
        <summary>
          <span class="summary-content">
            <span class="summary-icon" aria-hidden="true">✦</span>
            <span>
              <strong>Explore Options</strong>
              <small>Choose a destination</small>
            </span>
          </span>

          <span class="chevron" aria-hidden="true"></span>
        </summary>

        <div class="dropdown-content">
          <a href="#dashboard" class="dropdown-item">
            <span class="item-icon">◈</span>
            <span>
              <strong>Dashboard</strong>
              <small>View your overview</small>
            </span>
          </a>

          <a href="#projects" class="dropdown-item">
            <span class="item-icon">◇</span>
            <span>
              <strong>Projects</strong>
              <small>Manage your projects</small>
            </span>
          </a>

          <a href="#analytics" class="dropdown-item">
            <span class="item-icon">◎</span>
            <span>
              <strong>Analytics</strong>
              <small>Check your insights</small>
            </span>
          </a>

          <a href="#settings" class="dropdown-item">
            <span class="item-icon">⚙</span>
            <span>
              <strong>Settings</strong>
              <small>Customize your experience</small>
            </span>
          </a>
        </div>
      </details>
    </section>
  </main>
</body>
</html>
