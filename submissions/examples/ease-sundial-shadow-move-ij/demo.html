<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-sundial-shadow-move demo</title>
</head>
<body>
<div class="sd-app">
  <div class="sd-sun"></div>
  <div class="sd-dial">
    <span class="sd-mark sd-mark-1">6</span>
    <span class="sd-mark sd-mark-2">9</span>
    <span class="sd-mark sd-mark-3">12</span>
    <span class="sd-mark sd-mark-4">3</span>
    <span class="sd-mark sd-mark-5">6</span>
    <div class="sd-gnomon"></div>
    <div class="sd-shadow"></div>
  </div>
  <div class="sd-plinth"></div>
  <div class="sd-grass">
    <span class="sd-blade sd-blade-1"></span>
    <span class="sd-blade sd-blade-2"></span>
    <span class="sd-blade sd-blade-3"></span>
  </div>
