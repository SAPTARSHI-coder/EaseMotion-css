<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stat Counter Card | EaseMotion CSS</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="ease-stat-grid-scc">
      <article class="ease-stat-counter-card-scc" tabindex="0" aria-label="Total users: 12,480, up 12 percent">
        <p class="ease-stat-label-scc">Total Users</p>
        <span class="ease-stat-value-scc">12,480</span>
        <p class="ease-stat-trend-scc">▲ 12% this month</p>
        <div class="ease-stat-bars-scc" aria-hidden="true">
          <span class="ease-stat-bar-scc" style="--h: 40%; --i: 0"></span>
          <span class="ease-stat-bar-scc" style="--h: 65%; --i: 1"></span>
          <span class="ease-stat-bar-scc" style="--h: 50%; --i: 2"></span>
          <span class="ease-stat-bar-scc" style="--h: 80%; --i: 3"></span>
          <span class="ease-stat-bar-scc" style="--h: 70%; --i: 4"></span>
          <span class="ease-stat-bar-scc" style="--h: 100%; --i: 5"></span>
        </div>
      </article>

      <article class="ease-stat-counter-card-scc" tabindex="0" aria-label="Revenue: 48,200 dollars, up 8 percent">
        <p class="ease-stat-label-scc">Revenue</p>
        <span class="ease-stat-value-scc">$48.2k</span>
        <p class="ease-stat-trend-scc">▲ 8% this month</p>
        <div class="ease-stat-bars-scc" aria-hidden="true">
          <span class="ease-stat-bar-scc" style="--h: 55%; --i: 0"></span>
          <span class="ease-stat-bar-scc" style="--h: 45%; --i: 1"></span>
          <span class="ease-stat-bar-scc" style="--h: 75%; --i: 2"></span>
          <span class="ease-stat-bar-scc" style="--h: 60%; --i: 3"></span>
          <span class="ease-stat-bar-scc" style="--h: 90%; --i: 4"></span>
          <span class="ease-stat-bar-scc" style="--h: 85%; --i: 5"></span>
        </div>
      </article>

      <article class="ease-stat-counter-card-scc" tabindex="0" aria-label="Active sessions: 3,921, up 21 percent">
        <p class="ease-stat-label-scc">Active Sessions</p>
        <span class="ease-stat-value-scc">3,921</span>
        <p class="ease-stat-trend-scc">▲ 21% this week</p>
        <div class="ease-stat-bars-scc" aria-hidden="true">
          <span class="ease-stat-bar-scc" style="--h: 30%; --i: 0"></span>
          <span class="ease-stat-bar-scc" style="--h: 50%; --i: 1"></span>
          <span class="ease-stat-bar-scc" style="--h: 45%; --i: 2"></span>
          <span class="ease-stat-bar-scc" style="--h: 70%; --i: 3"></span>
          <span class="ease-stat-bar-scc" style="--h: 85%; --i: 4"></span>
          <span class="ease-stat-bar-scc" style="--h: 95%; --i: 5"></span>
        </div>
      </article>
    </main>
  </body>
</html>
