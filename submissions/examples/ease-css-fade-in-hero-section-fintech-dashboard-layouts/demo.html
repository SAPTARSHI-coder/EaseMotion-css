<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fade-In Hero Section - Fintech Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="hero">

    <div class="hero-content">

        <span class="badge">
            🚀 FINTECH DASHBOARD
        </span>

        <h1>
            Smart Finance
            <span>Powered By Data</span>
        </h1>

        <p>
            Experience next-generation financial analytics with
            intelligent insights, real-time tracking, and seamless
            dashboard management.
        </p>


        <div class="actions">
            <button class="primary">
                Get Started
            </button>

            <button class="secondary">
                View Analytics
            </button>
        </div>

    </div>


    <div class="dashboard-card">

        <div class="top">
            <h3>Revenue Overview</h3>
            <span>+18.4%</span>
        </div>


        <div class="chart">

            <div class="bar one"></div>
            <div class="bar two"></div>
            <div class="bar three"></div>
            <div class="bar four"></div>
            <div class="bar five"></div>

        </div>


        <div class="stats">

            <div>
                <strong>$248K</strong>
                <small>Total Revenue</small>
            </div>

            <div>
                <strong>12.8K</strong>
                <small>Customers</small>
            </div>

        </div>


    </div>


</main>


</body>
</html>
