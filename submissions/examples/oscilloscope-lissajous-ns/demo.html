<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oscilloscope Lissajous — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Oscilloscope Lissajous demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Oscilloscope Lissajous</h1>
      <p class="lede">Oscilloscope Lissajous figure blooming from two phases</p>
    </header>

    <section class="ease-oscilloscope-lissajous" data-demo="oscilloscope-lissajous" aria-live="polite">
      <div class="ease-oscilloscope-lissajous__housing">
        <div class="ease-oscilloscope-lissajous__bezel">
          <div class="ease-oscilloscope-lissajous__face">
            <div class="ease-oscilloscope-lissajous__readout">
              <span class="ease-oscilloscope-lissajous__label">Oscilloscope Lissajous</span>
              <span class="ease-oscilloscope-lissajous__value">LIVE</span>
            </div>
            <div class="ease-oscilloscope-lissajous__motion" aria-hidden="true">
              <span class="ease-oscilloscope-lissajous__a"></span>
              <span class="ease-oscilloscope-lissajous__b"></span>
              <span class="ease-oscilloscope-lissajous__c"></span>
              <span class="ease-oscilloscope-lissajous__d"></span>
            </div>
            <div class="ease-oscilloscope-lissajous__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-oscilloscope-lissajous__controls">
          <button type="button" class="ease-oscilloscope-lissajous__btn primary">Engage</button>
          <button type="button" class="ease-oscilloscope-lissajous__btn">Reset</button>
          <label class="ease-oscilloscope-lissajous__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-oscilloscope-lissajous__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
