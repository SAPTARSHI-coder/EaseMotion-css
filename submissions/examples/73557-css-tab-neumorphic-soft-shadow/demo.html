<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Neumorphic Soft Shadow Tabs</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="page">
      <header>
        <p class="eyebrow">EaseMotion · Tabs</p>
        <h1>Soft Shadow</h1>
        <p>A tactile segmented control built from light and dark inset shadows.</p>
      </header>

      <section class="tabs" aria-label="Information tabs">
        <input checked type="radio" name="tab" id="one">
        <input type="radio" name="tab" id="two">
        <input type="radio" name="tab" id="three">

        <nav class="tab-list" aria-label="Choose a panel">
          <label for="one">Calm</label>
          <label for="two">Focus</label>
          <label for="three">Rest</label>
        </nav>

        <article class="panel one">
          <h2>Calm</h2>
          <p>A quiet surface with a soft active state.</p>
        </article>

        <article class="panel two">
          <h2>Focus</h2>
          <p>Depth comes from paired shadows instead of gradients.</p>
        </article>

        <article class="panel three">
          <h2>Rest</h2>
          <p>The visual language stays readable in a dark interface.</p>
        </article>
      </section>
    </main>
  </body>
</html>
