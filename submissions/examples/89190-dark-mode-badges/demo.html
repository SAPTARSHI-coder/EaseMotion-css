<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>High-Contrast Dark Mode Badges</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="badge-container">
        <h2>High-Contrast Badge Components</h2>
        <div class="badge-group">
            <span class="ease-badge ease-badge-primary">Featured</span>
            <span class="ease-badge ease-badge-success">Active</span>
            <span class="ease-badge ease-badge-warning">Pending</span>
            <span class="ease-badge ease-badge-danger">Error</span>
        </div>
    </div>

</body>
</html>
