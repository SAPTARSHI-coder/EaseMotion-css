<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Retro Form - EaseMotion</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <form class="ease-retro-form" aria-label="Retro Login Form" onsubmit="event.preventDefault();">
    <h2 class="ease-retro-header">Player 1</h2>
    
    <div class="ease-retro-group">
      <label for="username" class="ease-retro-label">Username</label>
      <input type="text" id="username" class="ease-retro-input" placeholder="ENTER NAME" required>
    </div>
    
    <div class="ease-retro-group">
      <label for="password" class="ease-retro-label">Secret Code</label>
      <input type="password" id="password" class="ease-retro-input" placeholder="****" required>
    </div>
    
    <button type="submit" class="ease-retro-btn">Press Start</button>
  </form>

  <p style="position: absolute; bottom: 2rem; color: #94a3b8; font-family: 'Courier New', Courier, monospace; font-size: 0.875rem; text-align: center; font-weight: bold;">8-bit aesthetic achieved entirely through un-blurred box-shadows.<br>Zero image assets.</p>
</body>
</html>
