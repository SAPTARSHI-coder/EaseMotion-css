<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glassmorphism Tooltip Dark Mode</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>Glassmorphism Tooltip</h1>

    <div class="tooltip-wrapper">
        <button class="tooltip-trigger">
            Hover Me
        </button>

        <span class="tooltip">
            Modern glassmorphism tooltip with dark mode styling.
        </span>
    </div>
</div>

</body>
</html>
