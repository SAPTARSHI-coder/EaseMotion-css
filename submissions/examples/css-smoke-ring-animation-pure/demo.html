<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Smoke Ring Animation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="layout-container">
        
        <header class="section-header">
            <h1 class="title">Smoke Rings</h1>
            <p class="subtitle">A pure CSS animation using staggered transforms, opacity fades, and CSS blur filters to simulate expanding smoke rings.</p>
        </header>

        <div class="demo-area">
            
            <div class="smoke-generator" aria-hidden="true">
                
                <!-- The Origin Point (e.g. a pipe, chimney, or exhaust) -->
                <div class="emitter"></div>
                
                <!-- 
                  [TECHNIQUE] Staggered Animation
                  Each ring uses the exact same CSS @keyframes animation,
                  but is given a different `animation-delay`. This creates 
                  the continuous stream effect.
                -->
                <div class="ring" style="--delay: 0s;"></div>
                <div class="ring" style="--delay: 1.5s;"></div>
                <div class="ring" style="--delay: 3s;"></div>
                <div class="ring" style="--delay: 4.5s;"></div>
                
            </div>
            
        </div>
        
    </div>

</body>
</html>
