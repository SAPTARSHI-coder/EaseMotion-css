<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brewing Hydrometer — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Brewing Hydrometer demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Brewing Hydrometer</h1>
      <p class="lede">Hydrometer bobbing in wort as specific gravity settles</p>
    </header>

    <section class="ease-brewing-hydrometer" data-demo="brewing-hydrometer" aria-live="polite">
      <div class="ease-brewing-hydrometer__housing">
        <div class="ease-brewing-hydrometer__bezel">
          <div class="ease-brewing-hydrometer__face">
            <div class="ease-brewing-hydrometer__readout">
              <span class="ease-brewing-hydrometer__label">Brewing Hydrometer</span>
              <span class="ease-brewing-hydrometer__value">LIVE</span>
            </div>
            <div class="ease-brewing-hydrometer__motion" aria-hidden="true">
              <span class="ease-brewing-hydrometer__a"></span>
              <span class="ease-brewing-hydrometer__b"></span>
              <span class="ease-brewing-hydrometer__c"></span>
              <span class="ease-brewing-hydrometer__d"></span>
            </div>
            <div class="ease-brewing-hydrometer__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-brewing-hydrometer__controls">
          <button type="button" class="ease-brewing-hydrometer__btn primary">Engage</button>
          <button type="button" class="ease-brewing-hydrometer__btn">Reset</button>
          <label class="ease-brewing-hydrometer__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-brewing-hydrometer__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
