<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="CSS Zoom-In Modal for E-Commerce Checkout Layouts"
  >
  <title>Zoom-In Checkout Modal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="checkout-page">
    <header class="checkout-header">
      <div class="brand">EaseShop</div>
      <span class="secure-label">Secure Checkout</span>
    </header>

    <section class="checkout-layout">

      <div class="order-section">
        <p class="eyebrow">YOUR ORDER</p>
        <h1>Checkout</h1>

        <article class="product-card">
          <div class="product-image" aria-hidden="true">🎧</div>

          <div class="product-details">
            <h2>Wireless Headphones</h2>
            <p>Premium Edition · Quantity 1</p>
            <strong>$89.00</strong>
          </div>
        </article>

        <div class="summary-row">
          <span>Subtotal</span>
          <span>$89.00</span>
        </div>

        <div class="summary-row">
          <span>Shipping</span>
          <span>Free</span>
        </div>

        <div class="summary-row total">
          <span>Total</span>
          <span>$89.00</span>
        </div>

        <a href="#payment-modal" class="checkout-button">
          Continue to Payment
        </a>
      </div>

      <!-- CSS-only modal trigger -->
      <div id="payment-modal" class="modal" role="dialog" aria-modal="true"
           aria-labelledby="modal-title">

        <a href="#" class="modal-backdrop" aria-label="Close payment modal"></a>

        <div class="modal-content">
          <a href="#" class="modal-close" aria-label="Close modal">×</a>

          <div class="modal-icon" aria-hidden="true">✓</div>

          <p class="eyebrow">PAYMENT</p>

          <h2 id="modal-title">Complete your purchase</h2>

          <p class="modal-description">
            Enter your payment details to securely place your order.
          </p>

          <form class="payment-form">

            <div class="field">
              <label for="card-number">Card Number</label>
              <input
                id="card-number"
                type="text"
                inputmode="numeric"
                autocomplete="cc-number"
                placeholder="1234 5678 9012 3456"
              >
            </div>

            <div class="form-row">
              <div class="field">
                <label for="expiry">Expiry Date</label>
                <input
                  id="expiry"
                  type="text"
                  autocomplete="cc-exp"
                  placeholder="MM/YY"
                >
              </div>

              <div class="field">
                <label for="cvv">CVV</label>
                <input
                  id="cvv"
                  type="password"
                  inputmode="numeric"
                  autocomplete="cc-csc"
                  placeholder="•••"
                >
              </div>
            </div>

            <button type="button" class="pay-button">
              Pay $89.00
            </button>

          </form>
        </div>
      </div>

    </section>
  </main>

</body>
</html>
