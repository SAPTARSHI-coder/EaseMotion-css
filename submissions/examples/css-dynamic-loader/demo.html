<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Loader | Material Design</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="loader-card" tabindex="0" aria-label="Material Design Dynamic Loader">
    <h1 class="loader-title">Material Loader</h1>
    <p class="loader-subtitle">Dynamic SVG spinner animation</p>

    <div class="spinner-wrapper" aria-hidden="true">
        <svg class="material-spinner" viewBox="25 25 50 50">
            <circle class="spinner-circle" cx="50" cy="50" r="20" fill="none"></circle>
        </svg>
    </div>

    <p class="loader-status">Processing request...</p>
</main>

</body>
</html>
