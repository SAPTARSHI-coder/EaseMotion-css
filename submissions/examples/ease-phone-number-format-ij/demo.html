<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>ease-phone-number-format</title><link rel="stylesheet" href="style.css"></head>
<body><div class="container"><h1>Phone Format</h1><p class="subtitle">Animated format display</p><div class="card"><div class="phone-display" id="display">(555) 123-4567</div><p class="label">Phone number with animated reveal</p><button class="trigger" id="trigger">Re-format</button></div></div>
<script>var d=document.getElementById("display");var b=document.getElementById("trigger");var nums=["(555) 123-4567","(212) 555-0198","(415) 867-5309","(312) 555-1234"];var i=0;b.addEventListener("click",function(){d.classList.remove("fade");void d.offsetWidth;i=(i+1)%nums.length;d.textContent=nums[i];d.classList.add("fade")});</script>
</body></html>
