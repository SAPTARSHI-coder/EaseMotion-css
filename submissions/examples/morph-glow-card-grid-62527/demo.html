<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Morph-Glow Card Grid</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="ease-layout">
        <header class="ease-header">
            <h1>Morph-Glow Card Grid</h1>
            <p>E-Commerce Checkout Layouts</p>
        </header>

        <main class="ease-container">
            <div class="morph-glow-grid">
                <!-- Card 1 -->
                <div class="morph-glow-card">
                    <div class="morph-glow-card-content">
                        <div class="card-icon">💳</div>
                        <h3>Payment Method</h3>
                        <p>Select your preferred payment option.</p>
                        <button class="ease-btn">Select</button>
                    </div>
                </div>

                <!-- Card 2 -->
                <div class="morph-glow-card">
                    <div class="morph-glow-card-content">
                        <div class="card-icon">📦</div>
                        <h3>Shipping Info</h3>
                        <p>Enter your shipping address.</p>
                        <button class="ease-btn">Select</button>
                    </div>
                </div>

                <!-- Card 3 -->
                <div class="morph-glow-card">
                    <div class="morph-glow-card-content">
                        <div class="card-icon">🛍️</div>
                        <h3>Order Summary</h3>
                        <p>Review your items and total.</p>
                        <button class="ease-btn">Select</button>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
