<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coil Spring Compress — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Coil Spring Compress demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Coil Spring Compress</h1>
      <p class="lede">Heavy coil spring compressing then releasing energy</p>
    </header>

    <section class="ease-coil-spring-compress" data-demo="coil-spring-compress" aria-live="polite">
      <div class="ease-coil-spring-compress__housing">
        <div class="ease-coil-spring-compress__bezel">
          <div class="ease-coil-spring-compress__face">
            <div class="ease-coil-spring-compress__readout">
              <span class="ease-coil-spring-compress__label">Coil Spring Compress</span>
              <span class="ease-coil-spring-compress__value">LIVE</span>
            </div>
            <div class="ease-coil-spring-compress__motion" aria-hidden="true">
              <span class="ease-coil-spring-compress__a"></span>
              <span class="ease-coil-spring-compress__b"></span>
              <span class="ease-coil-spring-compress__c"></span>
              <span class="ease-coil-spring-compress__d"></span>
            </div>
            <div class="ease-coil-spring-compress__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-coil-spring-compress__controls">
          <button type="button" class="ease-coil-spring-compress__btn primary">Engage</button>
          <button type="button" class="ease-coil-spring-compress__btn">Reset</button>
          <label class="ease-coil-spring-compress__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-coil-spring-compress__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
