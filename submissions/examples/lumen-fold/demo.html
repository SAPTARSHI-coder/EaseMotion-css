<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Lumen Fold</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <main class="page">

    <section class="intro">
      <span class="eyebrow">INTERACTIVE SURFACE</span>

      <h1>
        Lumen <span>Fold</span>
      </h1>

      <p>
        Move across the surface and watch the light bend around your cursor.
      </p>
    </section>

    <section
      class="lumen"
      id="lumen"
      aria-label="Interactive Lumen Fold surface"
    >

      <div class="grid" id="grid"></div>

      <div class="surface-glow"></div>

      <div class="fold-highlight"></div>

      <div class="center-label">
        <span class="pulse-dot"></span>
        <span>MOVE THROUGH LIGHT</span>
      </div>

    </section>

    <div class="hint">
      <span></span>
      Explore the surface
    </div>

  </main>


  <script>
    const lumen = document.getElementById("lumen");
    const grid = document.getElementById("grid");

    const rows = 13;
    const columns = 21;

    const cells = [];

    for (let row = 0; row < rows; row++) {
      for (let column = 0; column < columns; column++) {
        const cell = document.createElement("div");

        cell.className = "cell";

        cell.style.setProperty("--row", row);
        cell.style.setProperty("--column", column);

        grid.appendChild(cell);

        cells.push({
          element: cell,
          row,
          column
        });
      }
    }

    let targetX = 0.5;
    let targetY = 0.5;

    let currentX = 0.5;
    let currentY = 0.5;

    let active = false;

    function updatePointer(event) {
      const rect = lumen.getBoundingClientRect();

      targetX = (event.clientX - rect.left) / rect.width;
      targetY = (event.clientY - rect.top) / rect.height;

      targetX = Math.max(0, Math.min(1, targetX));
      targetY = Math.max(0, Math.min(1, targetY));

      active = true;
    }

    lumen.addEventListener("pointermove", updatePointer);

    lumen.addEventListener("pointerenter", () => {
      active = true;
    });

    lumen.addEventListener("pointerleave", () => {
      active = false;
    });

    function animate() {
      if (!active) {
        targetX += (0.5 - targetX) * 0.035;
        targetY += (0.5 - targetY) * 0.035;
      }

      currentX += (targetX - currentX) * 0.12;
      currentY += (targetY - currentY) * 0.12;

      lumen.style.setProperty("--pointer-x", `${currentX * 100}%`);
      lumen.style.setProperty("--pointer-y", `${currentY * 100}%`);

      cells.forEach(({ element, row, column }) => {

        const x = column / (columns - 1);
        const y = row / (rows - 1);

        const dx = x - currentX;
        const dy = y - currentY;

        const distance = Math.sqrt(
          dx * dx + dy * dy
        );

        const influence = Math.max(
          0,
          1 - distance / 0.32
        );

        const fold = influence * influence;

        const rotateX = dy * fold * -16;
        const rotateY = dx * fold * 16;

        const translateZ = fold * 28;

        const brightness = 0.08 + fold * 0.65;

        element.style.setProperty(
          "--brightness",
          brightness
        );

        element.style.setProperty(
          "--rx",
          `${rotateX}deg`
        );

        element.style.setProperty(
          "--ry",
          `${rotateY}deg`
        );

        element.style.setProperty(
          "--tz",
          `${translateZ}px`
        );

        element.style.setProperty(
          "--delay",
          `${distance * 40}ms`
        );
      });

      requestAnimationFrame(animate);
    }

    animate();
  </script>

</body>
</html>
