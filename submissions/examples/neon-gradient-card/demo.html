<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animated Neon Gradient Border Card</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #050505; /* Deep dark background */
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: white;
    }
    
    /* Demo specific sizing */
    .ease-neon-card {
      width: 300px;
      height: 400px;
    }

    /* Styling the content inside the card */
    .ease-neon-content {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2rem;
      text-align: center;
      box-sizing: border-box;
    }
    
    .ease-neon-content h2 {
      margin: 0 0 1rem 0;
      font-size: 1.5rem;
      background: linear-gradient(to right, #00e676, #00b0ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    
    .ease-neon-content p {
      color: #999;
      font-size: 0.95rem;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <!-- The Animated Neon Card Component -->
  <div class="ease-neon-card">
    <div class="ease-neon-content">
      <h2>Web3 Pass</h2>
      <p>Hover and see the smooth glowing neon gradient rotating behind the solid card mask.</p>
    </div>
  </div>

</body>
</html>
