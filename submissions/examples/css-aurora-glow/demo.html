<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    name="description"
    content="Pure CSS Aurora Glow particle effect background."
  />
  <title>Aurora Glow Particle Effect</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="aurora-scene">
    <div class="aurora" aria-hidden="true">
      <span class="aurora-orb orb-1"></span>
      <span class="aurora-orb orb-2"></span>
      <span class="aurora-orb orb-3"></span>
      <span class="aurora-orb orb-4"></span>

      <span class="particle particle-1"></span>
      <span class="particle particle-2"></span>
      <span class="particle particle-3"></span>
      <span class="particle particle-4"></span>
      <span class="particle particle-5"></span>
      <span class="particle particle-6"></span>
      <span class="particle particle-7"></span>
      <span class="particle particle-8"></span>
      <span class="particle particle-9"></span>
      <span class="particle particle-10"></span>
      <span class="particle particle-11"></span>
      <span class="particle particle-12"></span>
      <span class="particle particle-13"></span>
      <span class="particle particle-14"></span>
      <span class="particle particle-15"></span>
      <span class="particle particle-16"></span>
    </div>

    <section class="content">
      <p class="eyebrow">CSS PARTICLE EFFECT</p>
      <h1>Aurora Glow</h1>
      <p class="description">
        A smooth atmospheric particle background created entirely with
        HTML and vanilla CSS.
      </p>
    </section>
  </main>
</body>
</html>
