<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plasma Energy Shield - EaseMotion CSS</title>
    <!-- Include EaseMotion Core Stylesheet -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #080711; color: #ffffff;">

    <div class="ease-card ease-card-glass shield-container">
        <div class="shield-header">
            <h2>Energy Shield</h2>
            <span class="ease-badge ease-badge-primary">100% Integrity</span>
        </div>
        
        <div class="shield-screen ease-center">
            <div class="shield-ring ring-outer"></div>
            <div class="shield-ring ring-inner"></div>
            <div class="shield-core ease-center"></div>
        </div>

        <div class="shield-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Status: Online</span>
            <button class="ease-btn ease-btn-primary ease-btn-sm ease-hover-grow">Overcharge</button>
        </div>
    </div>

</body>
</html>
