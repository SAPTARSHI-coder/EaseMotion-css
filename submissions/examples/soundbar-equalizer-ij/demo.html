<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-soundbar-equalizer</title>
</head>
<body>
<main class="sbe-bar">
  <header class="sbe-top">
    <h1 class="sbe-brand">SonicBar</h1>
    <span class="sbe-src">Bluetooth</span>
  </header>
  <section class="sbe-drivers" aria-label="speaker drivers">
    <span class="sbe-driver"></span>
    <span class="sbe-driver"></span>
    <span class="sbe-driver"></span>
    <span class="sbe-driver"></span>
  </section>
  <section class="sbe-eq" aria-label="equalizer bars">
    <span class="sbe-eqbar"></span>
    <span class="sbe-eqbar"></span>
    <span class="sbe-eqbar"></span>
    <span class="sbe-eqbar"></span>
    <span class="sbe-eqbar"></span>
    <span class="sbe-eqbar"></span>
  </section>
  <footer class="sbe-foot">
    <span class="sbe-vol">Volume 60</span>
    <span class="sbe-track">Midnight Groove</span>
  </footer>
</main>
</body>
</html>
