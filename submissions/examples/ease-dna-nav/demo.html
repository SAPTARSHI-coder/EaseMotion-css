<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DNA Nav · Double-Helix Spiral</title>

    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <div class="card">
        <h2>🧬 DNA Nav</h2>
        <p class="sub">items twist in a double-helix spiral on hover</p>

        <!-- === DNA NAV === -->
        <nav class="dna-nav" id="dnaNav">
            <ul class="dna-items">
                <li class="dna-item">
                    <a href="#" class="dna-link" data-tooltip="Home">
                        <i class="fas fa-home"></i>
                        <span>Home</span>
                    </a>
                    <span class="dna-helix"></span>
                </li>
                <li class="dna-item">
                    <a href="#" class="dna-link" data-tooltip="Explore">
                        <i class="fas fa-compass"></i>
                        <span>Explore</span>
                    </a>
                    <span class="dna-helix"></span>
                </li>
                <li class="dna-item">
                    <a href="#" class="dna-link" data-tooltip="Discover">
                        <i class="fas fa-microscope"></i>
                        <span>Discover</span>
                    </a>
                    <span class="dna-helix"></span>
                </li>
                <li class="dna-item">
                    <a href="#" class="dna-link" data-tooltip="Research">
                        <i class="fas fa-flask"></i>
                        <span>Research</span>
                    </a>
                    <span class="dna-helix"></span>
                </li>
                <li class="dna-item">
                    <a href="#" class="dna-link" data-tooltip="Connect">
                        <i class="fas fa-link"></i>
                        <span>Connect</span>
                    </a>
                    <span class="dna-helix"></span>
                </li>
            </ul>
        </nav>

        <p style="margin-top: 2rem; font-size: 0.85rem; color: #64748b;">
            Hover · watch items twist like a DNA helix
        </p>
    </div>

    <!-- Embedded JavaScript -->
    <script>
        (function() {
            'use strict';

            const nav = document.getElementById('dnaNav');
            const items = document.querySelectorAll('.dna-item');

            // Click feedback
            items.forEach(item => {
                const link = item.querySelector('.dna-link');
                link.addEventListener('click', function(e) {
                    e.preventDefault();
                    item.classList.add('clicked');
                    setTimeout(() => {
                        item.classList.remove('clicked');
                    }, 300);
                    const text = this.querySelector('span')?.textContent || 'Item';
                    console.log(`🧬 DNA nav: ${text}`);
                });

                // Keyboard accessibility
                link.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        this.click();
                    }
                });
            });

            // Reset helix animation on hover
            nav.addEventListener('mouseenter', function() {
                const helixes = this.querySelectorAll('.dna-helix');
                helixes.forEach(h => {
                    h.style.animation = 'none';
                    void h.offsetWidth;
                    h.style.animation = '';
                });
            });

            console.log('🧬 DNA nav initialized!');

        })();
    </script>

</body>
</html>
