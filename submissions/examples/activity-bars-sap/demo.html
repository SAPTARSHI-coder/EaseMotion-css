<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Activity Bars</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="activity-demo">
    <header class="activity-demo__header">
      <p class="activity-demo__eyebrow">EaseMotion CSS</p>
      <h1>Activity Bars</h1>
      <p>
        A compact animated visualization for activity, analytics, and monitoring
        interfaces.
      </p>
    </header>

    <section class="activity-showcase" aria-label="Activity bar examples">
      <div class="activity-card">
        <span class="activity-card__label">Small</span>

        <div class="activity-bars activity-bars--small" aria-label="Activity levels">
          <span class="activity-bar" style="--bar-height: 35%"></span>
          <span class="activity-bar" style="--bar-height: 62%"></span>
          <span class="activity-bar" style="--bar-height: 48%"></span>
          <span class="activity-bar" style="--bar-height: 82%"></span>
          <span class="activity-bar" style="--bar-height: 57%"></span>
          <span class="activity-bar" style="--bar-height: 91%"></span>
          <span class="activity-bar" style="--bar-height: 68%"></span>
          <span class="activity-bar" style="--bar-height: 44%"></span>
        </div>
      </div>

      <div class="activity-card">
        <span class="activity-card__label">Medium</span>

        <div class="activity-bars activity-bars--medium" aria-label="Activity levels">
          <span class="activity-bar" style="--bar-height: 42%"></span>
          <span class="activity-bar" style="--bar-height: 78%"></span>
          <span class="activity-bar" style="--bar-height: 55%"></span>
          <span class="activity-bar" style="--bar-height: 94%"></span>
          <span class="activity-bar" style="--bar-height: 63%"></span>
          <span class="activity-bar" style="--bar-height: 37%"></span>
          <span class="activity-bar" style="--bar-height: 86%"></span>
          <span class="activity-bar" style="--bar-height: 71%"></span>
          <span class="activity-bar" style="--bar-height: 49%"></span>
          <span class="activity-bar" style="--bar-height: 88%"></span>
        </div>
      </div>

      <div class="activity-card">
        <span class="activity-card__label">Large</span>

        <div class="activity-bars activity-bars--large" aria-label="Activity levels">
          <span class="activity-bar" style="--bar-height: 30%"></span>
          <span class="activity-bar" style="--bar-height: 64%"></span>
          <span class="activity-bar" style="--bar-height: 82%"></span>
          <span class="activity-bar" style="--bar-height: 47%"></span>
          <span class="activity-bar" style="--bar-height: 93%"></span>
          <span class="activity-bar" style="--bar-height: 71%"></span>
          <span class="activity-bar" style="--bar-height: 54%"></span>
          <span class="activity-bar" style="--bar-height: 88%"></span>
          <span class="activity-bar" style="--bar-height: 40%"></span>
          <span class="activity-bar" style="--bar-height: 76%"></span>
          <span class="activity-bar" style="--bar-height: 61%"></span>
          <span class="activity-bar" style="--bar-height: 96%"></span>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
