<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Foucault Pendulum Swing Background Demo — EaseMotion CSS</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <!-- Floating Background Viewport -->
  <div class="pendulum-viewport" id="viewport-root">
    
    <!-- Swinging wire & bob -->
    <div class="pendulum-wire">
      <div class="pendulum-bob"></div>
    </div>

    <!-- Earth Rotating Compass Dial -->
    <div class="pendulum-dial"></div>

  </div>

  <!-- Main demo content overlays -->
  <div class="demo-page">

    <div class="demo-card" id="card-root">
      <h1 class="demo-title">Foucault Pendulum</h1>
      <p class="demo-desc">
        A premium pure CSS background animation displaying a gravity pendulum swinging continuously over a slowly rotating Earth compass dial.
      </p>

      <button class="demo-btn" id="themeBtn" style="background:rgba(255,255,255,0.06);color:inherit;border:1px solid var(--ease-pendulum-border);">
        Toggle Theme
      </button>
    </div>

  </div>

  <script>
    // Theme toggle helper
    const themeBtn = document.getElementById('themeBtn');
    const viewportRoot = document.getElementById('viewport-root');
    const cardRoot = document.getElementById('card-root');

    themeBtn.addEventListener('click', () => {
      viewportRoot.classList.toggle('light-theme');
      cardRoot.classList.toggle('light-theme');
      document.body.classList.toggle('light-theme');
    });
  </script>

</body>
</html>
