<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Pure CSS animated gradient shimmer background"
  >

  <title>CSS Gradient Shimmer</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="shimmer-scene" aria-label="Animated gradient shimmer background">

    <div class="shimmer-layer shimmer-layer-one" aria-hidden="true"></div>
    <div class="shimmer-layer shimmer-layer-two" aria-hidden="true"></div>
    <div class="shimmer-layer shimmer-layer-three" aria-hidden="true"></div>

    <div class="light-streak streak-one" aria-hidden="true"></div>
    <div class="light-streak streak-two" aria-hidden="true"></div>

    <section class="content">
      <p class="eyebrow">CSS Background Animation</p>

      <h1>Gradient Shimmer</h1>

      <p>
        A smooth animated gradient background created entirely with
        HTML and vanilla CSS.
      </p>

      <div class="indicator" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </section>

  </main>
</body>
</html>
