<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Morph Glow Tooltip</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<section class="tooltip-showcase">

    <header class="hero">
        <span class="badge">Creative Portfolio</span>

        <h1>Morph Glow Tooltip</h1>

        <p>
            Elegant CSS-only tooltips with morphing glow animation,
            glassmorphism styling, and responsive layouts.
        </p>
    </header>

    <div class="tooltip-grid">

        <div class="tooltip-wrapper top">
            <button>Top Tooltip</button>
            <span class="tooltip">Creative Designer</span>
        </div>

        <div class="tooltip-wrapper right">
            <button>Right Tooltip</button>
            <span class="tooltip">Frontend Developer</span>
        </div>

        <div class="tooltip-wrapper bottom">
            <button>Bottom Tooltip</button>
            <span class="tooltip">UI / UX Specialist</span>
        </div>

        <div class="tooltip-wrapper left">
            <button>Left Tooltip</button>
            <span class="tooltip">Open Source Contributor</span>
        </div>

    </div>

</section>

</body>
</html>
