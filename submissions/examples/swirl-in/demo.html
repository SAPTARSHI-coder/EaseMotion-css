<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Swirl In Demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background-color: #1e293b;
      gap: 2rem;
    }
    .demo-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4rem;
    }
    .box {
      width: 160px;
      height: 160px;
      border-radius: 50%; /* Circles emphasize the swirl */
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      font-size: 1.1rem;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }
    .replay-btn {
      margin-top: 3rem;
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
      background: #3b82f6;
      color: white;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="demo-grid" id="grid">
    <div class="box swirl-in-fwd-ag" style="background: linear-gradient(135deg, #10b981, #34d399);">Swirl In<br>Forward</div>
    <div class="box swirl-in-bck-ag" style="background: linear-gradient(135deg, #f43f5e, #fb7185);">Swirl In<br>Backward</div>
  </div>

  <button class="replay-btn" onclick="replay()">Replay Animations</button>

  <script>
    function replay() {
      const grid = document.getElementById('grid');
      const clone = grid.cloneNode(true);
      grid.parentNode.replaceChild(clone, grid);
    }
  </script>
</body>
</html>
