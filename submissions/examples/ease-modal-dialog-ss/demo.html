<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modal Dialog Component - Feedback Category (#86842)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="ease-modal-stage" aria-labelledby="stage-title">
    <div>
      <h1 id="stage-title" class="ease-modal-title">Modal Dialog Feedback</h1>
      <p class="ease-modal-desc">A centered modal that zooms up over a blurred, dimmed backdrop overlay.</p>
    </div>

    <button type="button" class="ease-btn-trigger" id="open-modal">Open Modal Dialog</button>
  </main>

  <!-- Modal Dialog Overlay Component -->
  <div class="ease-modal-overlay" id="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
    <div class="ease-modal-dialog">
      <div class="ease-dialog-header">
        <h2 id="dialog-title" class="ease-dialog-title">Confirm Action</h2>
        <p class="ease-dialog-body">Are you sure you want to deploy these changes to production? This action cannot be undone.</p>
      </div>
      <div class="ease-dialog-actions">
        <button type="button" class="ease-btn-action" id="close-modal">Cancel</button>
        <button type="button" class="ease-btn-action primary" id="confirm-modal">Confirm Deployment</button>
      </div>
    </div>
  </div>

  <script>
    const openBtn = document.getElementById('open-modal');
    const closeBtn = document.getElementById('close-modal');
    const confirmBtn = document.getElementById('confirm-modal');
    const overlay = document.getElementById('modal-overlay');

    openBtn.addEventListener('click', () => {
      overlay.classList.add('is-open');
    });

    closeBtn.addEventListener('click', () => {
      overlay.classList.remove('is-open');
    });

    confirmBtn.addEventListener('click', () => {
      alert('Changes deployed successfully!');
      overlay.classList.remove('is-open');
    });

    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) {
        overlay.classList.remove('is-open');
      }
    });
  </script>
</body>
</html>
