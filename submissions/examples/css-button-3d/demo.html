<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Button: 3D Variation - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="em-demo-container">
        <!-- Pure CSS 3D Button Component Showcase -->
        <header class="em-button-card" role="region" aria-label="3D Button Showcase" tabindex="0">
            <div class="em-button-header-bar">
                <span class="em-card-badge">BUTTON COMPONENTS</span>
                <span class="em-brand-logo">ButtonMotion</span>
            </div>
            <h1 class="em-card-title">3D Button Component</h1>
            <p class="em-card-desc">A smooth, accessible, and performant pure CSS 3D tactile button featuring deep extrusion shadow layers, press-down click simulation, and frosted glassmorphism.</p>
            <div class="em-button-wrapper">
                <button class="em-3d-button" aria-label="Interactive 3D Button">
                    <span class="em-btn-face">PRESS ME 3D</span>
                </button>
            </div>
        </header>
    </div>
</body>
</html>
