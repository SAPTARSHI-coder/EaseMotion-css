<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teleportation Diagnostic Suites QTDS - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css"></head><body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030712; color: #ffffff;">

    <div class="ease-card ease-card-glass qtds-container">
        <div class="qtds-header">
            <h2>Teleportation Diagnostic Suite</h2>
            <span class="ease-badge ease-badge-warning">Fault-Tolerant Quantum</span>
        </div>
        
        <div class="qtds-screen ease-center">
            <div class="qtds-flux flux-qtds-a"></div>
            <div class="qtds-flux flux-qtds-b"></div>
            <div class="qtds-boundary-ring"></div>
            <div class="qtds-core ease-center"></div>
        </div>

        <div class="qtds-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Comprehensive Hardware Health &amp; Subsystem Diagnostics</span>
            <button class="ease-btn ease-btn-warning ease-btn-sm ease-hover-grow">Run Diagnostic Suite</button>
        </div>
    </div></body></html>
