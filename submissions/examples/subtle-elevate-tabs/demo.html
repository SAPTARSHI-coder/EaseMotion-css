<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subtle Elevate Tabs</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="wrapper">

    <h1>Subtle Elevate Tabs</h1>

    <input type="radio" id="tab1" name="tabs" checked>
    <input type="radio" id="tab2" name="tabs">
    <input type="radio" id="tab3" name="tabs">
    <input type="radio" id="tab4" name="tabs">

    <div class="tabs">
        <label for="tab1">Overview</label>
        <label for="tab2">Analytics</label>
        <label for="tab3">Settings</label>
        <label for="tab4">Profile</label>
    </div>

    <div class="content">
        <section class="panel panel1">
            <h2>Overview</h2>
            <p>Clean tabs with a soft elevated active state and smooth motion.</p>
        </section>

        <section class="panel panel2">
            <h2>Analytics</h2>
            <p>Hardware accelerated transitions using transform and opacity.</p>
        </section>

        <section class="panel panel3">
            <h2>Settings</h2>
            <p>Minimal styling designed for dashboards and web apps.</p>
        </section>

        <section class="panel panel4">
            <h2>Profile</h2>
            <p>Accessible, responsive, and built with pure HTML & CSS.</p>
        </section>
    </div>

</div>

</body>
</html>
