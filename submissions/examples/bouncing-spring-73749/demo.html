<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Neumorphic Bouncing Spring - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <main class="demo-wrapper">
    <header class="demo-header">
      <span class="demo-badge">Neumorphism Effect</span>
      <h1>Bouncing Spring</h1>
      <p>Interactive Neumorphic UI featuring pure CSS spring physics recoil, elastic compression, and tactile depth.</p>
    </header>

    <section class="neumorphic-card" aria-label="Bouncing Spring Showcase">
      <!-- Pure CSS Spring State Checkbox -->
      <input type="checkbox" id="spring-trigger" class="spring-checkbox">

      <!-- Spring Visualizer Chamber -->
      <div class="spring-chamber">
        <div class="spring-head">
          <div class="spring-head-inner">
            <svg class="spring-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
            </svg>
            <span class="spring-label">SPRING LOADED</span>
          </div>
        </div>

        <!-- CSS Animated Metallic Spring Coils -->
        <div class="spring-coils" aria-hidden="true">
          <span class="coil c1"></span>
          <span class="coil c2"></span>
          <span class="coil c3"></span>
          <span class="coil c4"></span>
          <span class="coil c5"></span>
        </div>

        <div class="spring-base"></div>
      </div>

      <!-- Spring Trigger Button -->
      <div class="spring-controls">
        <label for="spring-trigger" class="neumorphic-spring-btn" tabindex="0" role="button" aria-label="Compress and Release Spring">
          <span class="btn-text text-release">COMPRESS & RELEASE</span>
          <span class="btn-text text-recoil">SPRING RECOIL!</span>
        </label>
      </div>
    </section>
  </main>
</body>
</html>
