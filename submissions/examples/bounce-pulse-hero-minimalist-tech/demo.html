<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CSS Bounce-Pulse Hero Section with minimalist tech styling. Pure CSS hero with pulsing bounce dots, clean card layout, and light theme.">
  <title>Bounce-Pulse Hero Section – Minimalist Tech Layouts</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="bph-hero">
    <div class="bph-hero__dots" aria-hidden="true">
      <span class="bph-hero__dot bph-hero__dot--1"></span>
      <span class="bph-hero__dot bph-hero__dot--2"></span>
      <span class="bph-hero__dot bph-hero__dot--3"></span>
    </div>

    <div class="bph-hero__content">
      <span class="bph-hero__tag">Minimalist Tech</span>
      <h1 class="bph-hero__title">Simple tools.<br>Powerful results.</h1>
      <p class="bph-hero__text">We build developer-first products that stay out of your way and let you focus on what you do best — shipping.</p>
      <div class="bph-hero__cta-row">
        <a href="#" class="bph-hero__btn bph-hero__btn--em">Try It Free</a>
        <a href="#" class="bph-hero__btn bph-hero__btn--ghost">See Features</a>
      </div>
    </div>

    <div class="bph-hero__badge">
      <span class="bph-hero__badge-dot"></span>
      <span class="bph-hero__badge-text">All systems operational</span>
    </div>
  </header>

</body>
</html>
