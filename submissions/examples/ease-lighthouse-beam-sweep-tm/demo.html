<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ease-lighthouse-beam — Sweep Demo</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { min-height: 100vh; background: linear-gradient(180deg, var(--lhb-sky-color) 0%, var(--lhb-sea-color) 60%); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2rem; font-family: system-ui, sans-serif; color: #e0e0ff; padding: 2rem; overflow: hidden; }
    h1 { font-size: 1.3rem; font-weight: 400; }
    .lhb-scene { position: relative; width: var(--lhb-size); height: var(--lhb-size); }
    .lhb-tower { position: absolute; bottom: 40%; left: 50%; transform: translateX(-50%); width: 12px; height: 50px; background: linear-gradient(180deg,#f5f5f0,#d4d4c8); border-radius: 3px 3px 0 0; z-index: 2; }
    .lhb-tower::before { content: ''; position: absolute; top: -16px; left: 50%; transform: translateX(-50%); width: 20px; height: 16px; background: #e8e8e0; border-radius: 4px 4px 0 0; }
    .lhb-tower::after { content: ''; position: absolute; top: -20px; left: 50%; transform: translateX(-50%); width: 8px; height: 8px; border-radius: 50%; background: #ffffcc; box-shadow: 0 0 15px var(--lhb-glow), 0 0 30px var(--lhb-glow); animation: lhb-pulse 2s ease-in-out infinite; }
    .lhb-beam-wrap { position: absolute; top: 20%; left: 50%; transform-origin: center bottom; animation: lhb-sweep var(--lhb-sweep-duration) var(--lhb-sweep-ease) infinite; z-index: 1; }
    .lhb-beam { width: 200px; height: 8px; background: linear-gradient(90deg, var(--lhb-color-bright), transparent); transform-origin: left center; border-radius: 4px; animation: lhb-flicker 0.3s ease-in-out infinite; }
    .lhb-sea { position: absolute; bottom: 0; left: 0; right: 0; height: 35%; background: var(--lhb-sea-color); overflow: hidden; }
    .lhb-wave { position: absolute; width: 200%; height: 20px; background: repeating-linear-gradient(90deg, transparent, transparent 40px, rgba(255,255,255,0.03) 40px, rgba(255,255,255,0.03) 80px); animation: lhb-sweep 12s linear infinite; }
    .lhb-wave:nth-child(1) { bottom: 60%; opacity: 0.5; }
    .lhb-wave:nth-child(2) { bottom: 40%; opacity: 0.3; }
    .demo-row { display: flex; gap: 3rem; flex-wrap: wrap; justify-content: center; }
    .demo-card { display: flex; flex-direction: column; align-items: center; gap: 0.5rem; }
    .demo-card span { font-size: 0.8rem; color: #8888cc; }
  </style>
</head>
<body>
  <h1>ease-lighthouse-beam Sweep</h1>
  <div class="demo-row">
    <div class="demo-card">
      <div class="lhb-scene">
        <div class="lhb-beam-wrap"><div class="lhb-beam"></div></div>
        <div class="lhb-tower"></div>
        <div class="lhb-sea"><div class="lhb-wave"></div><div class="lhb-wave"></div></div>
      </div>
      <span>Continuous Sweep</span>
    </div>
    <div class="demo-card">
      <div class="lhb-scene lhb-glow-pulse">
        <div class="lhb-beam-wrap" style="animation-duration: 6s;"><div class="lhb-beam" style="background: linear-gradient(90deg, rgba(255,255,220,0.4), transparent);"></div></div>
        <div class="lhb-tower"></div>
        <div class="lhb-sea"><div class="lhb-wave"></div><div class="lhb-wave"></div></div>
      </div>
      <span>Glow Pulse</span>
    </div>
  </div>
</body>
</html>
