<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Spinning Globe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="layout-container">
        
        <header class="section-header">
            <h1 class="title">Spinning Globe</h1>
            <p class="subtitle">A true 3D wireframe sphere built entirely with CSS. Uses `transform-style: preserve-3d` to map individual rings into longitude and latitude lines.</p>
        </header>

        <div class="demo-area">
            
            <!-- 
              [TECHNIQUE] The 3D Scene 
              Provides the perspective camera for the 3D transforms inside.
            -->
            <div class="scene" aria-label="3D Spinning Globe Wireframe">
                
                <!-- 
                  [TECHNIQUE] The Globe Container
                  This container preserves 3D space and handles the continuous rotation animation.
                -->
                <div class="globe">
                    
                    <!-- Longitude Lines (Vertical Rings) -->
                    <!-- Spaced 30 degrees apart (180 / 6) -->
                    <div class="ring lon lon-1"></div>
                    <div class="ring lon lon-2"></div>
                    <div class="ring lon lon-3"></div>
                    <div class="ring lon lon-4"></div>
                    <div class="ring lon lon-5"></div>
                    <div class="ring lon lon-6"></div>
                    
                    <!-- Latitude Lines (Horizontal Rings) -->
                    <!-- The equator is full size, others are translated up/down and scaled smaller -->
                    <div class="ring lat lat-north-3"></div>
                    <div class="ring lat lat-north-2"></div>
                    <div class="ring lat lat-north-1"></div>
                    <div class="ring lat lat-equator"></div>
                    <div class="ring lat lat-south-1"></div>
                    <div class="ring lat lat-south-2"></div>
                    <div class="ring lat lat-south-3"></div>
                    
                </div>
                
            </div>
            
        </div>
        
    </div>

</body>
</html>
