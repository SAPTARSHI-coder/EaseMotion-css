<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Barcode Button</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="layout-container">
        
        <header class="section-header">
            <h1 class="title">Barcode Button</h1>
            <p class="subtitle">A button that disguises itself as a barcode. On hover, a red laser scans down, and the barcode mechanically slides open to reveal the action.</p>
        </header>

        <div class="demo-area">
            
            <!-- 
              [TECHNIQUE] The Barcode Container
              The main button container holds the hidden text and the overlapping barcode doors.
            -->
            <button class="barcode-btn" aria-label="Scan to Checkout">
                
                <!-- The hidden action text -->
                <span class="btn-text">SECURE CHECKOUT</span>
                
                <!-- 
                  [TECHNIQUE] The Barcode Doors
                  These two divs act as mechanical doors. They are covered in a CSS 
                  `repeating-linear-gradient` to look exactly like a barcode. 
                  On hover, they translate up and down to reveal the button text.
                -->
                <div class="door door-top" aria-hidden="true"></div>
                <div class="door door-bottom" aria-hidden="true"></div>
                
                <!-- 
                  [TECHNIQUE] The Laser Scanner
                  A red line that animates from top to bottom before the doors open.
                -->
                <div class="laser" aria-hidden="true"></div>
                
            </button>
            
        </div>
        
    </div>

</body>
</html>
