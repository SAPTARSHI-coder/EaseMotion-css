<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blush Effect – Turns Pink and Shy on Hover</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <h1>😊 Blush Effect</h1>
    <p class="subtitle">Turns pink and shy when you hover</p>

    <div class="blush-container">
      <div class="blush-stage" id="blushStage">
        <canvas id="canvas"></canvas>
        
        <!-- Blush character -->
        <div class="blush-character" id="blushCharacter">
          <div class="character-face" id="characterFace">
            <span class="face-eyes" id="faceEyes">👀</span>
            <span class="face-mouth" id="faceMouth">😊</span>
          </div>
          <div class="blush-overlay" id="blushOverlay"></div>
          <div class="blush-sparkles" id="blushSparkles"></div>
          <div class="character-label">Hover me! 😊</div>
        </div>

        <!-- Info overlay -->
        <div class="info-overlay">
          <span class="blush-status" id="blushStatus">😊 Calm</span>
          <span class="blush-count" id="blushCount">✦ 0 blushes</span>
        </div>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <button class="ctrl-btn toggle" id="toggleBtn">⏸ Pause</button>
      <button class="ctrl-btn reset" id="resetBtn">↺ Reset</button>
      <button class="ctrl-btn shy" id="shyBtn">😳 Shy</button>
    </div>

    <!-- Sliders -->
    <div class="slider-container">
      <span class="slider-label">Shyness Level</span>
      <input type="range" id="intensitySlider" min="0" max="100" value="70" />
      <span class="slider-value" id="intensityValue">70%</span>
    </div>

    <div class="slider-container">
      <span class="slider-label">Blush Speed</span>
      <input type="range" id="speedSlider" min="1" max="10" value="5" />
      <span class="slider-value" id="speedValue">5×</span>
    </div>

    <div class="slider-container">
      <span class="slider-label">Blush Color</span>
      <input type="range" id="colorSlider" min="0" max="360" value="340" />
      <span class="slider-value" id="colorValue">340°</span>
    </div>

    <!-- Status -->
    <div class="status" id="status">😊 Hover over the character to make it blush!</div>

    <!-- Keyboard shortcuts -->
    <div class="shortcuts">
      <kbd>Hover</kbd> Blush · <kbd>Space</kbd> Pause · <kbd>R</kbd> Reset · <kbd>S</kbd> Shy
    </div>
  </div>

  <script>
    (function() {
      "use strict";

      // DOM elements
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      const blushCharacter = document.getElementById('blushCharacter');
      const blushOverlay = document.getElementById('blushOverlay');
      const blushSparkles = document.getElementById('blushSparkles');
      const faceEyes = document.getElementById('faceEyes');
      const faceMouth = document.getElementById('faceMouth');
      const blushStatus = document.getElementById('blushStatus');
      const blushCount = document.getElementById('blushCount');
      const toggleBtn = document.getElementById('toggleBtn');
      const resetBtn = document.getElementById('resetBtn');
      const shyBtn = document.getElementById('shyBtn');
      const status = document.getElementById('status');
      const intensitySlider = document.getElementById('intensitySlider');
      const intensityValue = document.getElementById('intensityValue');
      const speedSlider = document.getElementById('speedSlider');
      const speedValue = document.getElementById('speedValue');
      const colorSlider = document.getElementById('colorSlider');
      const colorValue = document.getElementById('colorValue');

      // State
      let isBlushing = false;
      let isPaused = false;
      let animationId = null;
      let time = 0;
      let blushCountVal = 0;
      let blushIntensity = 0;
      let targetIntensity = 0;
      let particles = [];
      let sparkles = [];
      let isHovering = false;

      // Eye and mouth states
      const EYE_STATES = ['👀', '😳', '🥺', '😊', '😍'];
      const MOUTH_STATES = ['😊', '☺️', '😳', '😌', '🥰'];

      // ----- Canvas setup -----
      function setupCanvas() {
        const rect = canvas.parentElement.getBoundingClientRect();
        const size = Math.min(rect.width - 40, 600);
        canvas.width = size;
        canvas.height = size;
        canvas.style.width = size + 'px';
        canvas.style.height = size + 'px';
      }

      // ----- Particle class -----
      class Particle {
        constructor(x, y, hue) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 0.3 + Math.random() * 1.2;
          this.x = x;
          this.y = y;
          this.vx = Math.cos(angle) * speed;
          this.vy = Math.sin(angle) * speed - 0.5;
          this.size = 1 + Math.random() * 3;
          this.life = 1;
          this.decay = 0.005 + Math.random() * 0.015;
          this.hue = hue + (Math.random() - 0.5) * 20;
          this.saturation = 80 + Math.random() * 20;
          this.lightness = 60 + Math.random() * 30;
          this.opacity = 0.4 + Math.random() * 0.4;
          this.gravity = 0.02;
          this.friction = 0.99;
          this.shape = Math.random() > 0.5 ? 'heart' : 'circle';
        }

        update() {
          this.vx *= this.friction;
          this.vy *= this.friction;
          this.vy += this.gravity;
          this.x += this.vx;
          this.y += this.vy;
          this.life -= this.decay;
          this.size *= 0.999;
          return this.life > 0 && this.size > 0.1;
        }

        draw(ctx) {
          const alpha = this.life * this.opacity;
          const size = this.size * this.life;

          // Glow
          const gradient = ctx.createRadialGradient(
            this.x, this.y, 0,
            this.x, this.y, size * 3
          );
          gradient.addColorStop(0, `hsla(${this.hue + 20}, 100%, 90%, ${alpha * 0.2})`);
          gradient.addColorStop(1, `hsla(${this.hue}, 100%, 60%, 0)`);
          ctx.fillStyle = gradient;
          ctx.beginPath();
          ctx.arc(this.x, this.y, size * 3, 0, Math.PI * 2);
          ctx.fill();

          // Core
          ctx.fillStyle = `hsla(${this.hue + 30}, 100%, 95%, ${alpha * 0.9})`;
          
          if (this.shape === 'heart') {
            // Draw heart shape
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.scale(size / 10, size / 10);
            ctx.beginPath();
            ctx.moveTo(0, -3);
            ctx.bezierCurveTo(-5, -8, -10, -3, -10, 0);
            ctx.bezierCurveTo(-10, 4, -5, 8, 0, 12);
            ctx.bezierCurveTo(5, 8, 10, 4, 10, 0);
            ctx.bezierCurveTo(10, -3, 5, -8, 0, -3);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
          } else {
            ctx.beginPath();
            ctx.arc(this.x, this.y, size, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      }

      // ----- Create blush particles -----
      function createBlushParticles(x, y, count = 20) {
        const hue = parseInt(colorSlider.value);
        for (let i = 0; i < count; i++) {
          particles.push(new Particle(x, y, hue));
        }
      }

      // ----- Create sparkles -----
      function createSparkles() {
        blushSparkles.innerHTML = '';
        sparkles = [];
        const count = 8 + Math.floor(Math.random() * 8);
        const hue = parseInt(colorSlider.value);
        const intensity = parseInt(intensitySlider.value) / 100;

        for (let i = 0; i < count; i++) {
          const sparkle = document.createElement('div');
          sparkle.className = 'sparkle';
          const size = 2 + Math.random() * 4;
          const x = 20 + Math.random() * 60;
          const y = 20 + Math.random() * 60;
          const delay = Math.random() * 2;
          const duration = 1 + Math.random() * 2;
          const opacity = 0.2 + Math.random() * 0.4 * intensity;

          sparkle.style.width = size + 'px';
          sparkle.style.height = size + 'px';
          sparkle.style.left = x + '%';
          sparkle.style.top = y + '%';
          sparkle.style.animationDelay = delay + 's';
          sparkle.style.animationDuration = duration + 's';
          sparkle.style.opacity = opacity;
          sparkle.style.background = `radial-gradient(circle, 
            hsla(${hue + 20}, 100%, 90%, ${opacity}), 
            hsla(${hue}, 100%, 60%, ${opacity * 0.3})
          )`;
          sparkle.style.boxShadow = `0 0 ${size * 2}px hsla(${hue}, 100%, 70%, ${opacity * 0.2})`;

          blushSparkles.appendChild(sparkle);
          sparkles.push({ element: sparkle, x, y, size, delay, duration, opacity });
        }
      }

      // ----- Update blush effect -----
      function updateBlush() {
        const intensity = parseInt(intensitySlider.value) / 100;
        const speed = parseInt(speedSlider.value) / 5;
        const hue = parseInt(colorSlider.value);

        // Smooth intensity transition
        const diff = targetIntensity - blushIntensity;
        if (Math.abs(diff) > 0.001) {
          blushIntensity += diff * 0.05 * speed;
        } else {
          blushIntensity = targetIntensity;
        }

        const blushAmount = blushIntensity * intensity;

        // Update blush overlay
        blushOverlay.style.opacity = blushAmount * 0.6;
        blushOverlay.style.background = `radial-gradient(ellipse at 50% 70%, 
          hsla(${hue}, 80%, 70%, ${blushAmount * 0.8}), 
          hsla(${hue + 20}, 80%, 60%, ${blushAmount * 0.4}), 
          transparent 70%
        )`;
        blushOverlay.style.transform = `scale(${1 + blushAmount * 0.1})`;

        // Update character scale (shy shrink)
        const scale = 1 - blushAmount * 0.05;
        blushCharacter.style.transform = `scale(${scale})`;

        // Update face expressions
        if (blushAmount > 0.6) {
          faceEyes.textContent = EYE_STATES[1]; // 😳
          faceMouth.textContent = MOUTH_STATES[2]; // 😳
        } else if (blushAmount > 0.3) {
          faceEyes.textContent = EYE_STATES[2]; // 🥺
          faceMouth.textContent = MOUTH_STATES[1]; // ☺️
        } else if (blushAmount > 0.05) {
          faceEyes.textContent = EYE_STATES[3]; // 😊
          faceMouth.textContent = MOUTH_STATES[0]; // 😊
        } else {
          faceEyes.textContent = EYE_STATES[0]; // 👀
          faceMouth.textContent = MOUTH_STATES[0]; // 😊
        }

        // Update sparkles visibility
        blushSparkles.style.opacity = blushAmount;

        // Update status
        if (blushAmount > 0.5) {
          blushStatus.textContent = '😳 Blushing!';
          status.textContent = '😳 So shy! 💕';
        } else if (blushAmount > 0.1) {
          blushStatus.textContent = '😊 A little shy';
          status.textContent = '😊 Aww, how cute!';
        } else {
          blushStatus.textContent = '😊 Calm';
          status.textContent = '😊 Hover over the character to make it blush!';
        }
      }

      // ----- Draw background -----
      function drawBackground() {
        const w = canvas.width;
        const h = canvas.height;
        const cx = w / 2;
        const cy = h / 2;
        const hue = parseInt(colorSlider.value);

        // Background
        const bgGradient = ctx.createRadialGradient(cx, cy, 0, cx, cy, w * 0.7);
        bgGradient.addColorStop(0, '#1a0a1a');
        bgGradient.addColorStop(0.5, '#0f0a12');
        bgGradient.addColorStop(1, '#050508');
        ctx.fillStyle = bgGradient;
        ctx.fillRect(0, 0, w, h);

        // Ambient glow (pink when blushing)
        const glowAlpha = 0.02 + blushIntensity * 0.06;
        const glowGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, w * 0.3);
        glowGrad.addColorStop(0, `hsla(${hue + 20}, 100%, 80%, ${glowAlpha})`);
        glowGrad.addColorStop(1, `hsla(${hue + 20}, 100%, 60%, 0)`);
        ctx.fillStyle = glowGrad;
        ctx.beginPath();
        ctx.arc(cx, cy, w * 0.3, 0, Math.PI * 2);
        ctx.fill();

        // Update particles
        if (!isPaused) {
          particles = particles.filter(p => p.update());
        }
        particles.forEach(p => p.draw(ctx));

        // Update blush
        if (!isPaused) {
          updateBlush();
        }

        // Draw floating hearts around character if blushing
        if (blushIntensity > 0.3) {
          const cx2 = w / 2;
          const cy2 = h / 2;
          const count = Math.floor(3 + blushIntensity * 8);
          for (let i = 0; i < count; i++) {
            const angle = (i / count) * Math.PI * 2 + time * 0.02 * (i % 2 === 0 ? 1 : -1);
            const radius = 60 + blushIntensity * 40 + Math.sin(time * 0.5 + i) * 10;
            const x = cx2 + Math.cos(angle) * radius;
            const y = cy2 + Math.sin(angle) * radius - 10;
            const size = 4 + blushIntensity * 8 * (0.5 + 0.5 * Math.sin(time * 0.3 + i));
            const alpha = 0.2 + blushIntensity * 0.3 * (0.5 + 0.5 * Math.sin(time * 0.2 + i * 0.5));

            ctx.fillStyle = `hsla(${hue + 20}, 100%, 80%, ${alpha})`;
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(size / 15, size / 15);
            ctx.beginPath();
            ctx.moveTo(0, -3);
            ctx.bezierCurveTo(-5, -8, -10, -3, -10, 0);
            ctx.bezierCurveTo(-10, 4, -5, 8, 0, 12);
            ctx.bezierCurveTo(5, 8, 10, 4, 10, 0);
            ctx.bezierCurveTo(10, -3, 5, -8, 0, -3);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
          }
        }

        // Update blush count
        blushCount.textContent = `✦ ${blushCountVal} blushes`;
      }

      // ----- Animation loop -----
      function animate() {
        time += 0.016;
        drawBackground();
        animationId = requestAnimationFrame(animate);
      }

      // ----- Start animation -----
      function startAnimation() {
        if (animationId) {
          cancelAnimationFrame(animationId);
        }
        animate();
      }

      // ----- Trigger blush -----
      function triggerBlush() {
        if (isPaused) return;
        
        targetIntensity = Math.min(1, targetIntensity + 0.2);
        blushCountVal++;
        blushCount.textContent = `✦ ${blushCountVal} blushes`;
        
        // Create particles
        const rect = canvas.getBoundingClientRect();
        const cx = canvas.width / 2;
        const cy = canvas.height / 2;
        const count = 15 + Math.floor(parseInt(intensitySlider.value) / 100 * 20);
        createBlushParticles(cx, cy - 20, count);
        createSparkles();
        
        status.textContent = '😳 Blush! 💕';
        
        setTimeout(() => {
          if (targetIntensity > 0.1) {
            status.textContent = '😊 Aww, how cute!';
          }
        }, 800);
      }

      // ----- Reset -----
      function resetBlush() {
        targetIntensity = 0;
        blushIntensity = 0;
        isHovering = false;
        particles = [];
        blushCountVal = 0;
        blushCount.textContent = '✦ 0 blushes';
        blushStatus.textContent = '😊 Calm';
        status.textContent = '↺ Reset';
        blushOverlay.style.opacity = '0';
        blushSparkles.style.opacity = '0';
        blushCharacter.style.transform = 'scale(1)';
        faceEyes.textContent = '👀';
        faceMouth.textContent = '😊';
        intensitySlider.value = 70;
        intensityValue.textContent = '70%';
        speedSlider.value = 5;
        speedValue.textContent = '5×';
        colorSlider.value = 340;
        colorValue.textContent = '340°';
        blushSparkles.innerHTML = '';
        setTimeout(() => {
          status.textContent = '😊 Hover over the character to make it blush!';
        }, 500);
      }

      // ----- Toggle pause -----
      function togglePause() {
        isPaused = !isPaused;
        toggleBtn.textContent = isPaused ? '▶ Play' : '⏸ Pause';
        status.textContent = isPaused ? '⏸ Paused' : '▶ Resumed';
        blushStatus.textContent = isPaused ? '⏸ Paused' : (blushIntensity > 0.1 ? '😊 A little shy' : '😊 Calm');
      }

      // ----- Event Listeners -----
      // Hover effects
      blushCharacter.addEventListener('mouseenter', () => {
        isHovering = true;
        triggerBlush();
        if (!isPaused) {
          clearInterval(window.blushInterval);
          window.blushInterval = setInterval(() => {
            if (isHovering && !isPaused) {
              triggerBlush();
            }
          }, 800);
        }
      });

      blushCharacter.addEventListener('mouseleave', () => {
        isHovering = false;
        clearInterval(window.blushInterval);
        setTimeout(() => {
          if (!isHovering && !isPaused) {
            targetIntensity = 0;
            status.textContent = '😊 Hover over the character to make it blush!';
            setTimeout(() => {
              if (!isHovering && blushIntensity < 0.05) {
                blushStatus.textContent = '😊 Calm';
              }
            }, 500);
          }
        }, 500);
      });

      // Touch support
      blushCharacter.addEventListener('touchstart', (e) => {
        e.preventDefault();
        isHovering = true;
        triggerBlush();
        if (!isPaused) {
          clearInterval(window.blushInterval);
          window.blushInterval = setInterval(() => {
            if (isHovering && !isPaused) {
              triggerBlush();
            }
          }, 800);
        }
      });

      blushCharacter.addEventListener('touchend', () => {
        isHovering = false;
        clearInterval(window.blushInterval);
        setTimeout(() => {
          if (!isHovering && !isPaused) {
            targetIntensity = 0;
            status.textContent = '😊 Hover over the character to make it blush!';
          }
        }, 500);
      });

      // Buttons
      toggleBtn.addEventListener('click', togglePause);
      resetBtn.addEventListener('click', resetBlush);
      shyBtn.addEventListener('click', triggerBlush);

      // Sliders
      intensitySlider.addEventListener('input', (e) => {
        intensityValue.textContent = e.target.value + '%';
        createSparkles();
      });

      speedSlider.addEventListener('input', (e) => {
        speedValue.textContent = e.target.value + '×';
      });

      colorSlider.addEventListener('input', (e) => {
        colorValue.textContent = e.target.value + '°';
        createSparkles();
        particles.forEach(p => {
          p.hue = parseInt(e.target.value) + (Math.random() - 0.5) * 20;
        });
      });

      // Keyboard shortcuts
      document.addEventListener('keydown', (e) => {
        if (e.key === ' ' || e.key === 'Space') {
          e.preventDefault();
          togglePause();
        }
        if (e.key === 'r' || e.key === 'R') {
          e.preventDefault();
          resetBlush();
        }
        if (e.key === 's' || e.key === 'S') {
          e.preventDefault();
          triggerBlush();
        }
      });

      // Click canvas to blush
      canvas.addEventListener('click', triggerBlush);

      // ----- Resize handler -----
      let resizeTimeout;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(() => {
          setupCanvas();
        }, 200);
      });

      // ----- Init -----
      function init() {
        setupCanvas();
        startAnimation();
        status.textContent = '😊 Hover over the character to make it blush!';
        createSparkles();
        // Center character
        const rect = canvas.getBoundingClientRect();
        const cx = canvas.width / 2;
        const cy = canvas.height / 2;
        blushCharacter.style.left = (cx - 50) + 'px';
        blushCharacter.style.top = (cy - 60) + 'px';
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }

    })();
  </script>
</body>
</html>
