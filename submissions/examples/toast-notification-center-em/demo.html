<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive Toast Notification Stacking Drawer · EaseMotion</title>
  <meta name="description" content="A stacked, floating toast notification center component featuring slide animations, progress shrink timers, accessibility ARIA live regions, and distinct thematic alerts." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="demo-page">

    <!-- Header -->
    <header class="demo-header">
      <div class="demo-header__brand">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect width="24" height="24" rx="6" fill="url(#logo-g)"/>
          <path d="M7 12h10M12 7l5 5-5 5" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <defs>
            <linearGradient id="logo-g" x1="0" y1="0" x2="24" y2="24">
              <stop offset="0%" stop-color="#3b82f6"/>
              <stop offset="100%" stop-color="#8b5cf6"/>
            </linearGradient>
          </defs>
        </svg>
        <span>EaseMotion</span>
      </div>
      <h1 class="demo-header__title">Toast Notification Drawer</h1>
      <p class="demo-header__subtitle">Stacked alert queue with slide-in animations, auto-dismiss shrink timers, and manual dismissal.</p>
    </header>

    <!-- Controls to Trigger Toasts -->
    <section class="demo-controls">
      <h2 class="demo-controls__title">Trigger Notifications</h2>
      <div class="demo-controls__grid">
        <button type="button" class="btn btn--success" data-type="success">
          Show Success
        </button>
        <button type="button" class="btn btn--error" data-type="error">
          Show Error
        </button>
        <button type="button" class="btn btn--warning" data-type="warning">
          Show Warning
        </button>
        <button type="button" class="btn btn--info" data-type="info">
          Show Info
        </button>
      </div>
    </section>

    <footer class="demo-footer">
      <p>Built with <a href="https://github.com/SAPTARSHI-coder/EaseMotion-css" target="_blank" rel="noopener">EaseMotion-css</a></p>
    </footer>

  </main>

  <!-- =========================================================
       TOAST NOTIFICATION CONTAINER (Fixed Bottom Right)
  ========================================================== -->
  <div
    class="toast-container"
    id="toast-container"
    aria-live="polite"
    aria-atomic="false"
    role="region"
    aria-label="Notifications"
  >
    <!-- Toasts will be injected dynamically via script.js -->
  </div>

  <!-- SVG Sprite definitions for Toast Icons -->
  <svg style="display: none;">
    <!-- Success Icon -->
    <symbol id="icon-success" viewBox="0 0 24 24" fill="none">
      <path d="M12 22C17.5228 22 22 17.5228 22 12C22 6.47715 17.5228 2 12 2C6.47715 2 2 6.47715 2 12C2 17.5228 6.47715 22 12 22Z" fill="currentColor" fill-opacity="0.2"/>
      <path d="M7 12L10.5 15.5L18 8" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <!-- Error Icon -->
    <symbol id="icon-error" viewBox="0 0 24 24" fill="none">
      <path d="M12 22C17.5228 22 22 17.5228 22 12C22 6.47715 17.5228 2 12 2C6.47715 2 2 6.47715 2 12C2 17.5228 6.47715 22 12 22Z" fill="currentColor" fill-opacity="0.2"/>
      <path d="M15 9L9 15M9 9L15 15" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <!-- Warning Icon -->
    <symbol id="icon-warning" viewBox="0 0 24 24" fill="none">
      <path d="M12 22C17.5228 22 22 17.5228 22 12C22 6.47715 17.5228 2 12 2C6.47715 2 2 6.47715 2 12C2 17.5228 6.47715 22 12 22Z" fill="currentColor" fill-opacity="0.2"/>
      <path d="M12 8V13M12 16H12.01" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <!-- Info Icon -->
    <symbol id="icon-info" viewBox="0 0 24 24" fill="none">
      <path d="M12 22C17.5228 22 22 17.5228 22 12C22 6.47715 17.5228 2 12 2C6.47715 2 2 6.47715 2 12C2 17.5228 6.47715 22 12 22Z" fill="currentColor" fill-opacity="0.2"/>
      <path d="M12 11V16M12 8H12.01" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
  </svg>

  <script src="script.js"></script>
</body>
</html>
