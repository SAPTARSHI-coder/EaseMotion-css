<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Badge: Metallic Sheen Variation - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="em-demo-container">
        <!-- Pure CSS Metallic Sheen Badge Component Showcase -->
        <header class="em-badge-card" role="region" aria-label="Metallic Sheen Badge Showcase" tabindex="0">
            <div class="em-badge-header-bar">
                <span class="em-card-badge">BADGES & CHIPS</span>
                <span class="em-brand-logo">SheenMotion</span>
            </div>
            <h1 class="em-card-title">Metallic Sheen Badge</h1>
            <p class="em-card-desc">A smooth, accessible, and performant pure CSS badge featuring a reflective metallic gradient sheen sweep and frosted glassmorphism styling.</p>
            <div class="em-badge-wrapper">
                <div class="em-metallic-badge" aria-label="Premium Tier Status">
                    <span class="em-badge-text">PRO EDITION</span>
                </div>
            </div>
        </header>
    </div>
</body>
</html>
