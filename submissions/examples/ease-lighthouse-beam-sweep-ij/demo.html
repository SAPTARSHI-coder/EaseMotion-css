<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-lighthouse-beam-sweep demo</title>
</head>
<body>
<div class="lh-app">
  <div class="lh-sky">
    <div class="lh-moon"></div>
  </div>
  <div class="lh-sea">
    <div class="lh-wave lh-wave-1"></div>
    <div class="lh-wave lh-wave-2"></div>
  </div>
  <div class="lh-rock"></div>
  <div class="lh-tower">
    <div class="lh-stripe lh-stripe-1"></div>
    <div class="lh-stripe lh-stripe-2"></div>
    <div class="lh-stripe lh-stripe-3"></div>
    <div class="lh-gallery"></div>
    <div class="lh-lantern">
      <div class="lh-bulb"></div>
    </div>
    <div class="lh-cap"></div>
  </div>
  <div class="lh-beam"></div>
</div>
</body>
</html>
