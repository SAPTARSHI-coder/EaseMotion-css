<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EaseMotion - Offcanvas Drawer with Gradient Glow</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="em-container">
    <header class="em-hero">
      <h1>Offcanvas Drawer Demo</h1>
      <p>Pure CSS implementation utilizing EaseMotion tokens and gradient glow effects.</p>
      
      <!-- Pure CSS Toggle Hack (No JS Required) -->
      <input type="checkbox" id="em-drawer-toggle" class="em-drawer-toggle" aria-hidden="true" />
      
      <!-- Trigger Button -->
      <label for="em-drawer-toggle" class="em-btn em-btn-primary" role="button" tabindex="0">
        Open Drawer
      </label>

      <!-- Click-away Overlay -->
      <label for="em-drawer-toggle" class="em-drawer-overlay" aria-label="Close drawer"></label>

      <!-- Offcanvas Drawer Component -->
      <aside class="em-drawer" aria-labelledby="drawer-title">
        <div class="em-drawer-header">
          <h2 id="drawer-title">Menu</h2>
          <label for="em-drawer-toggle" class="em-drawer-close" aria-label="Close menu" tabindex="0">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </label>
        </div>
        
        <nav class="em-drawer-content">
          <ul class="em-nav-list">
            <li><a href="#" class="em-nav-link">Dashboard</a></li>
            <li><a href="#" class="em-nav-link">Projects</a></li>
            <li><a href="#" class="em-nav-link">Analytics</a></li>
            <li><a href="#" class="em-nav-link">Settings</a></li>
          </ul>
        </nav>
      </aside>
    </header>
  </main>
</body>
</html>
