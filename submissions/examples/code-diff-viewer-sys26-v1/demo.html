<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Code Diff Viewer with Animated Line-Highlight Sweep</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../easemotion.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>Code Diff Viewer</h1>
      <p>Addition and deletion line-highlight keyframe sweeps.</p>
    </header>

    <main class="diff-card">
      <pre><code>
<span class="diff-line diff-del">- const opacity = 0.5;</span>
<span class="diff-line diff-add">+ const opacity = 1.0;</span>
<span class="diff-line diff-add">+ transform: scale(1.05);</span>
      </code></pre>
    </main>
  </div>
</body>
</html>
