<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animated WiFi Signal Icon</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <h1>Animated WiFi Signal Icon</h1>

    <div class="wifi-icon" role="img" aria-label="WiFi connected, searching for signal">
      <span class="wifi-dot"></span>
      <span class="wifi-arc arc-1"></span>
      <span class="wifi-arc arc-2"></span>
      <span class="wifi-arc arc-3"></span>
    </div>
  </main>
</body>
</html>
