<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Holographic Foil Card - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="em-holo-page">
        <div class="em-holo-card" tabindex="0" role="region" aria-label="Holographic Foil Card Showcase">
            <div class="em-foil-overlay"></div>
            <div class="em-card-content">
                <span class="em-card-badge">RARE COLLECTIBLE</span>
                <h1 class="em-card-title">Holographic Foil</h1>
                <p class="em-card-desc">Iridescent rainbow foil texture powered by pure CSS linear gradients and keyframe animations.</p>
            </div>
            <footer class="em-card-footer">
                <span class="em-footer-tag">EaseMotion UI</span>
            </footer>
        </div>
    </div>
</body>
</html>
