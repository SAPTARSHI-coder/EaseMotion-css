<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="CSS priority label tags with critical, high, medium and low states."
  >
  <title>CSS Priority Label Tag</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">
    <section class="priority-panel" aria-labelledby="priority-title">
      <span class="eyebrow">Task Management</span>
      <h1 id="priority-title">Priority Labels</h1>
      <p class="intro">
        Clear visual indicators for different levels of task priority.
      </p>

      <div class="priority-list" aria-label="Task priorities">

        <div class="priority-row">
          <span class="priority-label priority-critical">
            <span class="priority-dot" aria-hidden="true"></span>
            Critical
          </span>
          <span class="priority-description">
            Requires immediate attention
          </span>
        </div>

        <div class="priority-row">
          <span class="priority-label priority-high">
            <span class="priority-dot" aria-hidden="true"></span>
            High
          </span>
          <span class="priority-description">
            Important and time-sensitive
          </span>
        </div>

        <div class="priority-row">
          <span class="priority-label priority-medium">
            <span class="priority-dot" aria-hidden="true"></span>
            Medium
          </span>
          <span class="priority-description">
            Should be completed soon
          </span>
        </div>

        <div class="priority-row">
          <span class="priority-label priority-low">
            <span class="priority-dot" aria-hidden="true"></span>
            Low
          </span>
          <span class="priority-description">
            Can be handled when convenient
          </span>
        </div>

      </div>
    </section>
  </main>

</body>
</html>
