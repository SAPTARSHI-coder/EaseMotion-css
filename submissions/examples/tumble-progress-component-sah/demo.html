<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tumble Progress Component - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="showcase">
    <h1>Tumble Progress Component (<code>#54666</code>)</h1>
    <p class="subtitle">A geometric cube tumbling across the progression track as background completion milestones fill up.</p>
    
    <div class="progress-box">
      <div class="meta">
        <span>Submitting 18 Pull Requests...</span>
        <span class="pct">78%</span>
      </div>
      
      <div class="ease-progress-tumble">
        <div class="track-fill"></div>
        <div class="tumble-cube"></div>
      </div>
    </div>
  </div>
</body>
</html>
