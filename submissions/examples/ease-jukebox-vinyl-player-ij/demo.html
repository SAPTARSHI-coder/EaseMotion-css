<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.9">
<title>Jukebox Vinyl Player</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="jukebox">
  <header class="juke-head">
    <h1 class="juke-name">VINYL LOUNGE</h1>
    <p class="juke-now">NOW PLAYING</p>
  </header>
  <section class="juke-dome" aria-label="Jukebox light dome">
    <span class="dome-globe"></span>
  </section>
  <section class="juke-deck" aria-label="Turntable deck">
    <div class="vinyl"><span class="label"></span></div>
    <div class="tonearm"><span class="tonearm-head"></span></div>
  </section>
  <section class="juke-songs" aria-label="Song selection buttons">
    <button class="song song-a" type="button">A1 SWING</button>
    <button class="song song-b" type="button">B2 JAZZ</button>
    <button class="song song-c" type="button">C3 BLUES</button>
  </section>
  <footer class="juke-foot">
    <span class="juke-credit">2 CREDITS</span>
    <span class="juke-vol">VOL 4</span>
  </footer>
</main>
</body>
</html>
