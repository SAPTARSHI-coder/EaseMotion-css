<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Animated Tooltip - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="tooltip-page">

    <header class="tooltip-header">
      <span class="section-pill">Tooltip UI</span>
      <h1>Animated Tooltip</h1>
      <p>
        Modern CSS-only tooltips with smooth animation.
        Hover or focus on the buttons to preview them.
      </p>
    </header>

    <section class="tooltip-demo">

      <button
        type="button"
        class="tooltip-btn"
        data-tooltip="This is top tooltip"
        data-position="top"
      >
        Top
      </button>

      <button
        type="button"
        class="tooltip-btn"
        data-tooltip="This is bottom tooltip"
        data-position="bottom"
      >
        Bottom
      </button>

      <button
        type="button"
        class="tooltip-btn"
        data-tooltip="This is left tooltip"
        data-position="left"
      >
        Left
      </button>

      <button
        type="button"
        class="tooltip-btn"
        data-tooltip="This is right tooltip"
        data-position="right"
      >
        Right
      </button>

    </section>

  </main>

</body>
</html>
