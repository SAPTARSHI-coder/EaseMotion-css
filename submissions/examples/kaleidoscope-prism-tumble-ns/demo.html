<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kaleidoscope Prism Tumble — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Kaleidoscope Prism Tumble demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Kaleidoscope Prism Tumble</h1>
      <p class="lede">Kaleidoscope prism cells tumbling mirrored motifs</p>
    </header>

    <section class="ease-kaleidoscope-prism-tumble" data-demo="kaleidoscope-prism-tumble" aria-live="polite">
      <div class="ease-kaleidoscope-prism-tumble__housing">
        <div class="ease-kaleidoscope-prism-tumble__bezel">
          <div class="ease-kaleidoscope-prism-tumble__face">
            <div class="ease-kaleidoscope-prism-tumble__readout">
              <span class="ease-kaleidoscope-prism-tumble__label">Kaleidoscope Prism Tumble</span>
              <span class="ease-kaleidoscope-prism-tumble__value">LIVE</span>
            </div>
            <div class="ease-kaleidoscope-prism-tumble__motion" aria-hidden="true">
              <span class="ease-kaleidoscope-prism-tumble__a"></span>
              <span class="ease-kaleidoscope-prism-tumble__b"></span>
              <span class="ease-kaleidoscope-prism-tumble__c"></span>
              <span class="ease-kaleidoscope-prism-tumble__d"></span>
            </div>
            <div class="ease-kaleidoscope-prism-tumble__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-kaleidoscope-prism-tumble__controls">
          <button type="button" class="ease-kaleidoscope-prism-tumble__btn primary">Engage</button>
          <button type="button" class="ease-kaleidoscope-prism-tumble__btn">Reset</button>
          <label class="ease-kaleidoscope-prism-tumble__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-kaleidoscope-prism-tumble__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
