<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Analog Clock Tick</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <div class="ease-clock" role="img" aria-label="Analog clock with animated hour, minute, and second hands">
        <span class="ease-clock__mark" style="transform:rotate(0deg)"></span>
        <span class="ease-clock__mark" style="transform:rotate(30deg)"></span>
        <span class="ease-clock__mark" style="transform:rotate(60deg)"></span>
        <span class="ease-clock__mark" style="transform:rotate(90deg)"></span>
        <span class="ease-clock__mark" style="transform:rotate(120deg)"></span>
        <span class="ease-clock__mark" style="transform:rotate(150deg)"></span>
        <span class="ease-clock__mark" style="transform:rotate(180deg)"></span>
        <span class="ease-clock__mark" style="transform:rotate(210deg)"></span>
        <span class="ease-clock__mark" style="transform:rotate(240deg)"></span>
        <span class="ease-clock__mark" style="transform:rotate(270deg)"></span>
        <span class="ease-clock__mark" style="transform:rotate(300deg)"></span>
        <span class="ease-clock__mark" style="transform:rotate(330deg)"></span>
        <div class="ease-clock__hand ease-clock__hand--hour"></div>
        <div class="ease-clock__hand ease-clock__hand--minute"></div>
        <div class="ease-clock__hand ease-clock__hand--second"></div>
        <span class="ease-clock__cap"></span>
      </div>
    </main>
  </body>
</html>
