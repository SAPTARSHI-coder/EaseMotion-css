<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Game Loading Tips - EaseMotion</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="glt" aria-label="Game loading tips">
      <div class="glt-screen">
        <div class="glt-bar" aria-hidden="true"><span></span></div>
        <ul class="glt-tips" aria-label="Rotating tips">
          <li>Tip: Chain combos for bonus points</li>
          <li>Tip: Save heavy attacks for bosses</li>
          <li>Tip: Dodge twice before counter-attacking</li>
        </ul>
      </div>
    </div>
  </body>
</html>
