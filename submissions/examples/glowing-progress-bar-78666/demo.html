<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Glowing Progress Bar</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="page">
      <section class="progress-card" aria-labelledby="title">
        <p class="eyebrow">EaseMotion CSS · Issue #78666</p>
        <h1 id="title">Glowing Progress</h1>
        <div
          class="progress"
          role="progressbar"
          aria-valuenow="72"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-label="Project completion"
        >
          <span class="progress-value" style="--progress: 72%"></span>
        </div>
        <p class="value">72% complete</p>
      </section>
    </main>
  </body>
</html>
