<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floating SaaS Carousel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="fs-carousel">
        <input type="radio" name="fs-slide" id="fs1" checked>
        <input type="radio" name="fs-slide" id="fs2">
        <input type="radio" name="fs-slide" id="fs3">
        
        <div class="fs-viewport">
            <div class="fs-track">
                <div class="fs-card"><div class="fs-icon blue"></div><h3>Data Sync</h3><p>Real-time bidirectional synchronization.</p></div>
                <div class="fs-card"><div class="fs-icon purple"></div><h3>Analytics</h3><p>Deep insights into user behavior.</p></div>
                <div class="fs-card"><div class="fs-icon green"></div><h3>Security</h3><p>Enterprise-grade encryption protocols.</p></div>
            </div>
        </div>
        
        <div class="fs-indicators">
            <label for="fs1"></label>
            <label for="fs2"></label>
            <label for="fs3"></label>
        </div>
    </div>
</body>
</html>
