<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Neumorphic Hover Hero</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="hero">

        <div class="hero-content">

            <p class="hero-tag">WELCOME TO THE FUTURE</p>

            <h1>
                Build Something
                <span>Beautiful</span>
            </h1>

            <p class="hero-description">
                A clean and responsive hero section with a
                soft neumorphic design and smooth hover effects.
            </p>

            <div class="hero-actions">
                <a href="#" class="hero-btn primary-btn">
                    Get Started
                </a>

                <a href="#" class="hero-btn secondary-btn">
                    Explore
                </a>
            </div>

        </div>

        <div class="hero-card">
            <div class="card-icon">✦</div>
            <h2>Neumorphism</h2>
            <p>
                Soft shadows, subtle depth and elegant interactions.
            </p>
        </div>

    </main>

</body>
</html>
