<!-- EaseMotion component: train-ticket-counter -->
<!DOCTYPE html>
<html lang="en" data-train="ticket">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
<title>Ease Train Ticket Counter</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="ticket-counter">
  <header class="counter-sign">
    <span class="counter-title">TICKET WINDOW 3</span>
    <span class="counter-open">OPEN</span>
  </header>
  <div class="window">
    <span class="window-glass"></span>
    <span class="window-slot"></span>
  </div>
  <div class="counter-desk">
    <span class="ticket-roll"></span>
    <span class="ticket-print">TICKET &raquo;</span>
  </div>
  <ol class="queue-line">
    <li class="queue-person"><span class="queue-tag">#27</span> Bora</li>
    <li class="queue-person qp-2"><span class="queue-tag">#28</span> Mei</li>
    <li class="queue-person qp-3"><span class="queue-tag">#29</span> Liam</li>
  </ol>
</main>
</body>
</html>
