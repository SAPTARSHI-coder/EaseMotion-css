<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scroll Word Highlight</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="content">
    <section class="spacer"><h1>Scroll Word Highlight</h1><p>Scroll down — each word highlights in sequence as the paragraph scrolls through view.</p></section>

    <section class="highlight-section">
      <p class="highlight-para" id="highlightPara">
        Great products are built by teams who care deeply about the details that most people never notice.
      </p>
    </section>

    <section class="spacer"><p>More content below.</p></section>
  </main>

  <script>
    const para = document.getElementById('highlightPara');
    const words = para.textContent.trim().split(/\s+/);
    para.innerHTML = words.map(w => `<span class="word">${w}</span>`).join(' ');
    const wordEls = para.querySelectorAll('.word');
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    function updateHighlight() {
      if (reduceMotion) return;
      const rect = para.getBoundingClientRect();
      const progress = (window.innerHeight * 0.6 - rect.top) / rect.height;
      const clamped = Math.min(Math.max(progress, 0), 1);
      const activeCount = Math.floor(clamped * wordEls.length);
      wordEls.forEach((w, i) => w.classList.toggle('is-highlighted', i < activeCount));
    }

    document.addEventListener('scroll', updateHighlight, { passive: true });
    updateHighlight();
  </script>
</body>
</html>
