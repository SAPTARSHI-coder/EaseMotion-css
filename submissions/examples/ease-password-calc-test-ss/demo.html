<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Strength Calculator Demo | EaseMotion CSS</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <main class="calculator-card">
    <div class="header">
      <h1>Password Strength Calc</h1>
      <p>Evaluate password complexity with strict regex engine rules</p>
    </div>

    <div class="input-group">
      <label for="passwordInput">Enter Password</label>
      <div class="input-wrapper">
        <input 
          type="password" 
          id="passwordInput" 
          placeholder="Type a password..." 
          autocomplete="off"
        >
      </div>
    </div>

    <div class="meter-container">
      <div class="meter-header">
        <span id="scoreText" class="score-text">Enter Password</span>
        <span id="scoreNumber" class="score-number">Score: 0 / 5</span>
      </div>
      <div class="bars" id="barContainer">
        <div class="bar-segment"></div>
        <div class="bar-segment"></div>
        <div class="bar-segment"></div>
        <div class="bar-segment"></div>
        <div class="bar-segment"></div>
      </div>
    </div>

    <ul class="criteria-list">
      <li class="criterion" id="ruleLength">
        <span class="icon">✓</span>
        <span>At least 8 characters</span>
      </li>
      <li class="criterion" id="ruleLower">
        <span class="icon">✓</span>
        <span>Contains lowercase letter (a-z)</span>
      </li>
      <li class="criterion" id="ruleUpper">
        <span class="icon">✓</span>
        <span>Contains uppercase letter (A-Z)</span>
      </li>
      <li class="criterion" id="ruleNumber">
        <span class="icon">✓</span>
        <span>Contains numerical digit (0-9)</span>
      </li>
      <li class="criterion" id="ruleSpecial">
        <span class="icon">✓</span>
        <span>Contains special character (!@#$)</span>
      </li>
    </ul>
  </main>

  <script type="module">
    import { calculatePasswordScore } from './passwordStrength.js';

    const input = document.getElementById('passwordInput');
    const scoreText = document.getElementById('scoreText');
    const scoreNumber = document.getElementById('scoreNumber');
    const barSegments = document.querySelectorAll('.bar-segment');

    const ruleLength = document.getElementById('ruleLength');
    const ruleLower = document.getElementById('ruleLower');
    const ruleUpper = document.getElementById('ruleUpper');
    const ruleNumber = document.getElementById('ruleNumber');
    const ruleSpecial = document.getElementById('ruleSpecial');

    const scoreLabels = [
      'Very Weak',
      'Weak',
      'Fair',
      'Good',
      'Strong',
      'Very Strong'
    ];

    const scoreColors = [
      'var(--score-0)',
      'var(--score-1)',
      'var(--score-2)',
      'var(--score-3)',
      'var(--score-4)',
      'var(--score-5)'
    ];

    function updateUI() {
      const val = input.value;
      const score = calculatePasswordScore(val);

      if (!val || val.trim() === '') {
        scoreText.textContent = 'Enter Password';
        scoreText.style.color = 'var(--text-muted)';
        scoreNumber.textContent = 'Score: 0 / 5';
      } else {
        scoreText.textContent = scoreLabels[score];
        scoreText.style.color = scoreColors[score];
        scoreNumber.textContent = `Score: ${score} / 5`;
      }

      // Update Meter Bars
      barSegments.forEach((bar, index) => {
        if (index < score && val && val.trim() !== '') {
          bar.style.backgroundColor = scoreColors[score];
        } else {
          bar.style.backgroundColor = 'var(--score-0)';
        }
      });

      // Update Individual Criterion Checklist
      const isValidString = typeof val === 'string' && val.trim() !== '';
      
      ruleLength.classList.toggle('valid', isValidString && val.length >= 8);
      ruleLower.classList.toggle('valid', isValidString && /[a-z]/.test(val));
      ruleUpper.classList.toggle('valid', isValidString && /[A-Z]/.test(val));
      ruleNumber.classList.toggle('valid', isValidString && /\d/.test(val));
      ruleSpecial.classList.toggle('valid', isValidString && /[^A-Za-z0-9]/.test(val));
    }

    input.addEventListener('input', updateUI);
    updateUI();
  </script>
</body>
</html>
