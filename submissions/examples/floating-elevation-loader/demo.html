<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <meta
    name="description"
    content="Accessible pure CSS floating elevation loader."
  >
  <title>Floating Elevation Loader</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="demo">
    <section
      class="loader-card"
      aria-labelledby="loader-title"
    >
      <div
        class="floating-loader"
        role="status"
        aria-label="Loading"
      >
        <span class="loader-core" aria-hidden="true"></span>
      </div>

      <div class="loader-content">
        <h1 id="loader-title">Floating Elevation</h1>
        <p>Loading content...</p>
      </div>
    </section>
  </main>
</body>
</html>
