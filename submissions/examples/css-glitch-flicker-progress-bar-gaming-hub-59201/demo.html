<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Glitch Flicker Progress Bar</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<section class="progress-section">

    <h1>Gaming Hub Progress</h1>
    <p class="subtitle">
        Futuristic glitch-flicker progress bars for gaming dashboards.
    </p>

    <div class="progress-wrapper">

        <div class="progress-card">
            <div class="label">
                <span>Mission Progress</span>
                <span>92%</span>
            </div>

            <div class="progress-bar cyan" style="--progress:92%;">
                <div class="progress-fill"></div>
            </div>
        </div>

        <div class="progress-card">
            <div class="label">
                <span>Battle Pass</span>
                <span>76%</span>
            </div>

            <div class="progress-bar purple" style="--progress:76%;">
                <div class="progress-fill"></div>
            </div>
        </div>

        <div class="progress-card">
            <div class="label">
                <span>Weapon Upgrade</span>
                <span>61%</span>
            </div>

            <div class="progress-bar green" style="--progress:61%;">
                <div class="progress-fill"></div>
            </div>
        </div>

        <div class="progress-card">
            <div class="label">
                <span>Energy Core</span>
                <span>43%</span>
            </div>

            <div class="progress-bar orange" style="--progress:43%;">
                <div class="progress-fill"></div>
            </div>
        </div>

    </div>

</section>

</body>
</html>
