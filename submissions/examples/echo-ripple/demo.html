<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Echo Ripple</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="page">
  <section class="echo-card">

    <header class="header">
      <div>
        <p class="eyebrow">INTERACTIVE WATER</p>
        <h1>Echo Ripple</h1>
        <p class="subtitle">
          Touch the surface and watch the water remember.
        </p>
      </div>

      <div class="counter">
        <span>RIPPLES</span>
        <strong id="count">0</strong>
      </div>
    </header>

    <div class="water-surface" id="waterSurface">
      <div class="reflection reflection-one"></div>
      <div class="reflection reflection-two"></div>
      <div class="reflection reflection-three"></div>
    </div>

    <div class="controls">
      <button id="rippleBtn">Create Ripple</button>
      <button id="resetBtn">Reset</button>
    </div>

    <p class="hint">
      Click anywhere on the water · Space creates a center ripple · R resets
    </p>

  </section>
</main>

<script>
  const surface = document.getElementById("waterSurface");
  const count = document.getElementById("count");
  const rippleBtn = document.getElementById("rippleBtn");
  const resetBtn = document.getElementById("resetBtn");

  let rippleCount = 0;
  let activeRipples = [];

  const particleCount = 24;

  for (let i = 0; i < particleCount; i++) {
    const particle = document.createElement("span");
    particle.className = "water-particle";
    particle.style.left = Math.random() * 100 + "%";
    particle.style.top = Math.random() * 100 + "%";
    particle.style.animationDelay = Math.random() * 4 + "s";
    particle.style.animationDuration = 3 + Math.random() * 4 + "s";
    surface.appendChild(particle);
  }

  function createRipple(x, y) {
    const ripple = document.createElement("div");
    ripple.className = "ripple";

    ripple.style.left = `${x}px`;
    ripple.style.top = `${y}px`;

    for (let i = 0; i < 4; i++) {
      const ring = document.createElement("span");
      ring.className = "ripple-ring";
      ring.style.animationDelay = `${i * 0.12}s`;
      ripple.appendChild(ring);
    }

    const core = document.createElement("span");
    core.className = "ripple-core";
    ripple.appendChild(core);

    surface.appendChild(ripple);
    activeRipples.push(ripple);

    rippleCount++;
    count.textContent = rippleCount;

    setTimeout(() => {
      ripple.remove();
      activeRipples = activeRipples.filter(item => item !== ripple);
    }, 1900);
  }

  surface.addEventListener("pointerdown", event => {
    const rect = surface.getBoundingClientRect();

    createRipple(
      event.clientX - rect.left,
      event.clientY - rect.top
    );
  });

  rippleBtn.addEventListener("click", () => {
    createRipple(
      surface.clientWidth / 2,
      surface.clientHeight / 2
    );
  });

  resetBtn.addEventListener("click", () => {
    activeRipples.forEach(ripple => ripple.remove());
    activeRipples = [];
    rippleCount = 0;
    count.textContent = "0";
  });

  document.addEventListener("keydown", event => {
    if (event.code === "Space") {
      event.preventDefault();

      createRipple(
        surface.clientWidth / 2,
        surface.clientHeight / 2
      );
    }

    if (event.key.toLowerCase() === "r") {
      resetBtn.click();
    }
  });
</script>

</body>
</html>
