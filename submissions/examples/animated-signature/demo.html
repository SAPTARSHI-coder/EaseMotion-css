<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="A responsive CSS animated SVG signature that draws itself using stroke animation."
  >

  <title>CSS Animated Signature</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="demo">
    <section
      class="signature-card"
      aria-labelledby="signature-title"
    >

      <p class="eyebrow">EaseMotion CSS</p>

      <h1 id="signature-title">
        Animated Signature
      </h1>

      <p class="description">
        A lightweight SVG signature that draws itself using
        pure CSS animation.
      </p>

      <figure
        class="signature"
        aria-labelledby="signature-caption"
      >

        <svg
          class="signature-svg"
          viewBox="0 0 760 260"
          role="img"
          aria-labelledby="signature-title-svg signature-desc-svg"
        >

          <title id="signature-title-svg">
            Animated handwritten signature
          </title>

          <desc id="signature-desc-svg">
            A decorative handwritten signature drawing itself
            from left to right.
          </desc>

          <!-- Main signature stroke -->
          <path
            class="signature-stroke signature-stroke--main"
            d="
              M65 185
              C82 150 96 110 108 73
              C114 55 124 49 130 66
              C137 86 126 124 112 151
              C101 172 94 188 103 193
              C114 199 130 184 145 164
              C158 147 168 128 178 110
              C185 96 191 94 194 107
              C198 125 184 151 174 166
              C165 179 163 189 172 191
              C184 194 201 176 213 157
              C225 138 236 116 247 99
              C254 88 261 91 260 105
              C258 126 245 150 239 165
              C234 177 235 187 244 189
              C257 192 274 171 286 151
              C298 132 311 112 322 98
              C330 88 337 91 336 103
              C334 122 318 147 311 160
              C304 174 306 185 316 187
              C330 190 346 169 358 151
              C370 133 384 111 396 97
              C404 87 411 92 409 105
              C406 123 392 147 386 161
              C380 176 383 185 394 186
              C411 188 426 166 438 148
              C450 130 462 112 476 98
              C486 88 491 95 487 109
              C483 125 470 146 463 158
              C455 172 456 182 466 184
              C483 188 500 166 512 149
              C524 132 538 113 551 99
              C560 89 568 94 564 108
              C559 126 546 146 538 159
              C530 173 532 182 542 183
              C559 185 575 164 587 147
              C600 129 615 111 630 99
            "
          />

          <!-- Decorative underline -->
          <path
            class="signature-stroke signature-stroke--underline"
            d="
              M110 216
              C205 230 310 228 405 219
              C490 211 575 198 660 211
            "
          />

          <!-- Final flourish -->
          <path
            class="signature-stroke signature-stroke--flourish"
            d="
              M600 98
              C625 78 648 79 659 95
              C671 112 661 131 642 137
              C625 143 612 133 616 119
            "
          />

        </svg>

        <figcaption id="signature-caption">
          CSS-only animated SVG signature
        </figcaption>

      </figure>

      <div class="signature-info">
        <span class="status-dot" aria-hidden="true"></span>
        <span>Pure CSS · No JavaScript</span>
      </div>

    </section>
  </main>

</body>
</html>
