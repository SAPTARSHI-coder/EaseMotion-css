<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ease Gear Train Mesh</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="gear-system">

    <h1>GEAR TRAIN CONTROL</h1>
    <p class="status">MECHANISM ACTIVE • SYNCHRONIZED</p>


    <div class="machine">

        <span class="label">CLOCK DRIVE MODULE</span>

        <div class="gears">

            <div class="gear gear-one">
                <div class="center"></div>
            </div>

            <div class="gear gear-two">
                <div class="center"></div>
            </div>

            <div class="gear gear-three">
                <div class="center"></div>
            </div>

        </div>


        <div class="panel">

            <div>
                <small>TORQUE</small>
                <b>92%</b>
            </div>

            <div>
                <small>SPEED</small>
                <b>120 RPM</b>
            </div>

            <div>
                <small>STATE</small>
                <b>RUN</b>
            </div>

        </div>

    </div>

</div>

</body>
</html>
