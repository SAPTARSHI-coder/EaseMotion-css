<!DOCTYPE html>
<html lang="en">
<head>

    <title>Neumorphic Pagination | Pastel Styling</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="pagination-card" tabindex="0" aria-label="Neumorphic Pastel Pagination Showcase">

    <nav aria-label="Page navigation">

            <li class="page-item">
                <a href="#prev" class="page-link" aria-label="Previous page">‹</a>
            </li>
            <li class="page-item">
                <a href="#1" class="page-link">1</a>
            </li>
            <li class="page-item">
                <a href="#2" class="page-link active" aria-current="page">2</a>
            </li>
            <li class="page-item">
                <a href="#3" class="page-link">3</a>
            </li>
            <li class="page-item">
                <a href="#4" class="page-link">4</a>
            </li>
            <li class="page-item">
                <a href="#next" class="page-link" aria-label="Next page">›</a>
            </li>
        </ul>
    </nav>
</main>

</body>
</html>
