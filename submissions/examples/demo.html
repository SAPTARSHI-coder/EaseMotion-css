<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Relative Color Syntax - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="em-rcs-page">
        <div class="em-card" role="region" aria-label="Relative Color Syntax Showcase" tabindex="0">
            <span class="em-card-badge">MODERN CSS FEATURES</span>
            <h1 class="em-card-title">Relative Colors</h1>
            <p class="em-card-desc">Dynamic color generation and harmonious palettes derived automatically using native CSS relative color syntax (`from` keyword).</p>
            
            <div class="em-color-grid" role="list" aria-label="Color Palette Swatches">
                <div class="em-swatch em-base" role="listitem" tabindex="0">
                    <span class="em-swatch-name">Base Accent</span>
                    <span class="em-swatch-hex">#6366f1</span>
                </div>
                <div class="em-swatch em-lighter" role="listitem" tabindex="0">
                    <span class="em-swatch-name">Lighter (Alpha 80%)</span>
                    <span class="em-swatch-code">rcs-alpha</span>
                </div>
                <div class="em-swatch em-darker" role="listitem" tabindex="0">
                    <span class="em-swatch-name">Darker Shade</span>
                    <span class="em-swatch-code">rcs-lightness</span>
                </div>
                <div class="em-swatch em-complement" role="listitem" tabindex="0">
                    <span class="em-swatch-name">Hue Shifted</span>
                    <span class="em-swatch-code">rcs-hue</span>
                </div>
            </div>

            <a href="#" class="em-card-btn" role="button">View Documentation</a>
        </div>
    </div>
</body>
</html>
