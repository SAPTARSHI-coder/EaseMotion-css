<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Glassmorphism Profile Card - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="em-glass-page">
        <div class="em-glass-card" role="region" aria-label="Glassmorphism Profile Card Showcase" tabindex="0">
            <div class="em-profile-avatar">JS</div>
            <span class="em-profile-badge">PRO MEMBER</span>
            <h1 class="em-profile-name">John Stewartsson</h1>
            <p class="em-profile-role">Design Systems & VLSI Engineer</p>
            <p class="em-profile-desc">Frosted glass profile card featuring multi-layered backdrop blur, subtle borders, and glowing transparency effects.</p>
            <div class="em-profile-actions">
                <a href="#" class="em-profile-btn em-btn-primary" role="button">Connect</a>
                <a href="#" class="em-profile-btn em-btn-outline" role="button">Message</a>
            </div>
        </div>
    </div>
</body>
</html>
