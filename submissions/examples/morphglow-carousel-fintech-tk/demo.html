<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Morph Glow Carousel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>Fintech Dashboard</h1>
    <p class="subtitle">
        CSS Morph-Glow Carousel showcasing financial insights.
    </p>

    <div class="carousel">

        <div class="card active">
            <h2>Portfolio Value</h2>
            <div class="value">$128,450</div>
            <p>Overall investment portfolio</p>
        </div>

        <div class="card">
            <h2>Monthly Growth</h2>
            <div class="value">+18.6%</div>
            <p>Compared with last month</p>
        </div>

        <div class="card">
            <h2>Active Assets</h2>
            <div class="value">24</div>
            <p>Diversified investments</p>
        </div>

    </div>

    <div class="dots">
        <span class="dot active"></span>
        <span class="dot"></span>
        <span class="dot"></span>
    </div>

</div>

</body>
</html>
