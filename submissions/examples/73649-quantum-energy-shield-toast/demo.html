<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark light">
  <title>Quantum Energy Shield Toast</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">
    <section class="demo-area" aria-label="Quantum energy shield toast demo">

      <article class="toast" role="status" aria-live="polite">

        <div class="shield-energy" aria-hidden="true">
          <span class="energy-ring ring-one"></span>
          <span class="energy-ring ring-two"></span>
          <span class="energy-ring ring-three"></span>
          <span class="energy-pulse"></span>
        </div>

        <div class="toast-icon" aria-hidden="true">
          <span>✦</span>
        </div>

        <div class="toast-content">
          <span class="toast-label">QUANTUM SHIELD</span>
          <h1>Energy Shield Activated</h1>
          <p>Your system is protected by the quantum energy field.</p>
        </div>

        <button
          class="toast-close"
          type="button"
          aria-label="Close notification"
        >
          <span aria-hidden="true">×</span>
        </button>

      </article>

    </section>
  </main>

</body>
</html>
