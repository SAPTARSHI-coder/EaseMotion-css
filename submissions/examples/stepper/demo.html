<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accessible Stepper Component Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Checkout Flow</h1>

    <!-- Live Region for Screen Reader Announcements -->
    <div id="sr-announcer" aria-live="polite" aria-atomic="true" class="sr-only"></div>

    <!-- Stepper Container -->
    <nav aria-label="Progress">
      <ol class="stepper" id="stepper">
        <li class="stepper-item active" data-step="1">
          <button type="button" class="stepper-button" aria-current="step" aria-describedby="step-1-desc">
            <span class="stepper-badge">1</span>
            <span class="stepper-label">Account Info</span>
          </button>
          <span id="step-1-desc" class="sr-only">Step 1 of 3: Active</span>
        </li>
        <li class="stepper-item" data-step="2">
          <button type="button" class="stepper-button" aria-describedby="step-2-desc">
            <span class="stepper-badge">2</span>
            <span class="stepper-label">Shipping Details</span>
          </button>
          <span id="step-2-desc" class="sr-only">Step 2 of 3: Incomplete</span>
        </li>
        <li class="stepper-item" data-step="3">
          <button type="button" class="stepper-button" aria-describedby="step-3-desc">
            <span class="stepper-badge">3</span>
            <span class="stepper-label">Payment Options</span>
          </button>
          <span id="step-3-desc" class="sr-only">Step 3 of 3: Incomplete</span>
        </li>
      </ol>
    </nav>

    <!-- Modal Form (Focus Trap Target) -->
    <section class="step-panel" id="step-panel" aria-labelledby="panel-title">
      <h2 id="panel-title">Step 1: Account Info</h2>
      <form id="checkout-form" onsubmit="event.preventDefault();">
        <div class="form-group">
          <label for="username">Full Name</label>
          <input type="text" id="username" name="username" required>
        </div>
        <div class="form-controls">
          <button type="button" id="prev-btn" class="btn" disabled>Previous</button>
          <button type="button" id="next-btn" class="btn btn-primary">Next Step</button>
        </div>
      </form>
    </section>
  </main>

  <script>
    const steps = document.querySelectorAll('.stepper-item');
    const announcer = document.getElementById('sr-announcer');
    const panelTitle = document.getElementById('panel-title');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    let currentStepIndex = 0;

    function announce(message) {
      announcer.textContent = '';
      setTimeout(() => { announcer.textContent = message; }, 100);
    }

    function updateStepper(newIndex) {
      steps.forEach((step, index) => {
        const button = step.querySelector('.stepper-button');
        const desc = step.querySelector('.sr-only');
        
        if (index === newIndex) {
          step.classList.add('active');
          step.classList.remove('completed');
          button.setAttribute('aria-current', 'step');
          desc.textContent = `Step ${index + 1} of ${steps.length}: Active`;
        } else if (index < newIndex) {
          step.classList.remove('active');
          step.classList.add('completed');
          button.removeAttribute('aria-current');
          desc.textContent = `Step ${index + 1} of ${steps.length}: Completed`;
        } else {
          step.classList.remove('active', 'completed');
          button.removeAttribute('aria-current');
          desc.textContent = `Step ${index + 1} of ${steps.length}: Incomplete`;
        }
      });

      currentStepIndex = newIndex;
      panelTitle.textContent = `Step ${currentStepIndex + 1}: ${steps[currentStepIndex].querySelector('.stepper-label').textContent}`;
      prevBtn.disabled = currentStepIndex === 0;
      nextBtn.textContent = currentStepIndex === steps.length - 1 ? 'Finish' : 'Next Step';

      announce(`Navigated to Step ${currentStepIndex + 1} of ${steps.length}: ${steps[currentStepIndex].querySelector('.stepper-label').textContent}`);
    }

    nextBtn.addEventListener('click', () => {
      if (currentStepIndex < steps.length - 1) updateStepper(currentStepIndex + 1);
    });

    prevBtn.addEventListener('click', () => {
      if (currentStepIndex > 0) updateStepper(currentStepIndex - 1);
    });

    // Keyboard Navigation support across tabs
    document.getElementById('stepper').addEventListener('keydown', (e) => {
      let targetIndex = currentStepIndex;
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
        targetIndex = Math.min(steps.length - 1, currentStepIndex + 1);
      } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
        targetIndex = Math.max(0, currentStepIndex - 1);
      }
      if (targetIndex !== currentStepIndex) {
        updateStepper(targetIndex);
        steps[targetIndex].querySelector('.stepper-button').focus();
      }
    });
  </script>
</body>
</html>
