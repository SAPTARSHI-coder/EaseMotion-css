<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Microwave Keypad | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="mwstage">
    <div class="mwunit">
      <div class="mwscreen">02:30</div>
      <div class="mwpad">
        <button class="mwkey mwkey-fn" type="button">Power</button>
        <button class="mwkey mwkey-fn" type="button">Timer</button>
        <button class="mwkey mwkey-fn" type="button">Defrost</button>
        <button class="mwkey" type="button">1</button>
        <button class="mwkey" type="button">2</button>
        <button class="mwkey" type="button">3</button>
        <button class="mwkey" type="button">4</button>
        <button class="mwkey" type="button">5</button>
        <button class="mwkey" type="button">6</button>
        <button class="mwkey" type="button">7</button>
        <button class="mwkey" type="button">8</button>
        <button class="mwkey" type="button">9</button>
        <button class="mwkey mwkey-stop" type="button">Stop</button>
        <button class="mwkey" type="button">0</button>
        <button class="mwkey mwkey-go" type="button">Go</button>
      </div>
    </div>
  </div>
</body>
</html>
