<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Color Theme Toggle | EaseMotion CSS</title><link rel="stylesheet" href="style.css"></head>
<body class="dark">
<div class="ct-root">
<div class="ct-card">
<div class="ct-row"><h2 class="ct-title">Theme Settings</h2></div>
<p class="ct-body">Toggle between light and dark mode. The theme persists across page refreshes using localStorage.</p>
<div class="ct-row">
<span class="ct-label">Dark Mode</span>
<button class="ct-toggle on" id="themeToggle" type="button" aria-label="Toggle dark mode">
<span class="ct-thumb">&#9790;</span>
</button>
</div>
</div>
<p class="ct-note">Pure CSS color system with JS-free dark mode using prefers-color-scheme</p>
</div>
<script>
const btn=document.getElementById('themeToggle');
const root=document.documentElement;
btn.addEventListener('click',()=>{
  const isDark=root.classList.contains('dark');
  root.classList.toggle('dark',!isDark);
  root.classList.toggle('light',isDark);
  btn.classList.toggle('on',!isDark);
  btn.querySelector('.ct-thumb').textContent=isDark?'&#9788;':'&#9790;';
  localStorage.setItem('theme',isDark?'light':'dark');
});
const saved=localStorage.getItem('theme');
if(saved==='light'){root.classList.remove('dark');root.classList.add('light');btn.classList.remove('on');btn.querySelector('.ct-thumb').textContent='☀';}
</script>
</body></html>
