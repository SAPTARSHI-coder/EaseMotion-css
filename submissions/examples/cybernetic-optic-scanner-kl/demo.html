<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cybernetic Optic Scanner - EaseMotion CSS</title>
    <!-- Include EaseMotion Core Stylesheet -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #090306; color: #ffffff;">

    <div class="ease-card ease-card-glass optic-container">
        <div class="optic-header">
            <h2>Optic Scanner</h2>
            <span class="ease-badge ease-badge-danger">Scanning</span>
        </div>
        
        <div class="optic-screen ease-center">
            <div class="optic-ring ring-1"></div>
            <div class="optic-ring ring-2"></div>
            <div class="optic-crosshair"></div>
            <div class="optic-core ease-center"></div>
        </div>

        <div class="optic-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Target: Identified</span>
            <button class="ease-btn ease-btn-primary ease-btn-sm ease-hover-grow">Re-scan</button>
        </div>
    </div>

</body>
</html>
