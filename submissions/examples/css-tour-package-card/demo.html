<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Tour Package Card | EaseMotion CSS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<article class="tour-card" tabindex="0" aria-label="Tour Package: Alpine Explorer">
    <div class="tour-header">
        <span class="tour-duration">5 Days / 4 Nights</span>
        <h2 class="tour-title">Alpine Explorer Expedition</h2>
    </div>
    <div class="tour-body">
        <div class="tour-price-row">
            <span class="tour-price-label">Starting from</span>
            <span class="tour-price">$1,299</span>
        </div>
        <ul class="tour-highlights">
            <li>Guided mountain trekking tours</li>
            <li>All-inclusive luxury alpine lodge stays</li>
            <li>Private transport & gear rentals included</li>
        </ul>
        <a href="#book" class="tour-action">Book Experience</a>
    </div>
</article>

</body>
</html>
