<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Ripple Wave Click Water - EaseMotion</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="demo-page">
      <section class="demo-card">
        <p class="eyebrow">EaseMotion CSS</p>

        <h1>Ripple Wave Click Water</h1>

        <p class="description">
          A lightweight click-inspired water ripple animation using only
          transform and opacity.
        </p>

        <button class="water-button" type="button">
          <span class="button-label">Click &amp; Hold</span>

          <span
            class="ripple-wave ease-anim-ripple-wave-click-water"
            aria-hidden="true"
          ></span>
        </button>

        <div class="usage">
          <span>Utility class</span>
          <code>ease-anim-ripple-wave-click-water</code>
        </div>
      </section>
    </main>
  </body>
</html>
