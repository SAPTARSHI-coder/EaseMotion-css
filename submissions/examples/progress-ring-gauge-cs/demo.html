<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Progress Ring Gauge — EaseMotion CSS</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="page">
        <section class="demo" aria-labelledby="demo-title">
            <div class="intro">
                <p class="eyebrow">EaseMotion CSS · Progress</p>
                <h1 id="demo-title">Progress Ring Gauge</h1>
                <p>A smooth circular gauge filled to 72% with a rounded progress cap and centered value.</p>
            </div>

            <div class="showcase">
                <div class="gauge-card">
                    <div class="progress-ring" role="img" aria-label="Progress: 72 percent" style="--progress: 72;">
                        <svg class="ring-svg" viewBox="0 0 220 220" aria-hidden="true">
              <circle
                class="ring-track"
                cx="110"
                cy="110"
                r="88"
              ></circle>

              <circle
                class="ring-progress"
                cx="110"
                cy="110"
                r="88"
              ></circle>
            </svg>

                        <div class="ring-center">
                            <strong>72<span>%</span></strong>
                            <small>Complete</small>
                        </div>
                    </div>

                    <div class="gauge-meta">
                        <span class="meta-dot" aria-hidden="true"></span>
                        <span>Current progress</span>
                    </div>
                </div>
            </div>
        </section>
    </main>
</body>

</html>
