<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shadow Drop Demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f1f5f9;
      gap: 2rem;
    }
    .demo-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4rem;
    }
    .box {
      width: 180px;
      height: 180px;
      background: #ffffff;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #334155;
      font-weight: 600;
      font-size: 1.1rem;
      text-align: center;
      border: 1px solid #e2e8f0;
      cursor: pointer;
      /* Smooth return transition when not hovering */
      transition: box-shadow 0.4s ease, transform 0.4s ease;
    }
  </style>
</head>
<body>

  <div class="demo-grid">
    <div class="box shadow-drop-center-ag">Hover Me<br>(Center Elevation)</div>
    <div class="box shadow-drop-bottom-ag">Hover Me<br>(Bottom Elevation)</div>
  </div>

  <p style="color: #64748b; margin-top: 2rem;">Hover over the cards to see the shadow-drop elevation.</p>

</body>
</html>
