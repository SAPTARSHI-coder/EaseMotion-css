<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zoom-In Carousel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<section class="demo">

    <h1>Fintech Dashboard</h1>
    <p class="subtitle">
        CSS Zoom-In Carousel for Financial Insights
    </p>

    <input type="radio" name="carousel" id="card1" checked>
    <input type="radio" name="carousel" id="card2">
    <input type="radio" name="carousel" id="card3">

    <div class="cards">

        <label class="card" for="card1">
            <h2>Revenue</h2>
            <h3>$48,200</h3>
            <p>Monthly Income</p>
        </label>

        <label class="card" for="card2">
            <h2>Investments</h2>
            <h3>+16.8%</h3>
            <p>Annual Growth</p>
        </label>

        <label class="card" for="card3">
            <h2>Transactions</h2>
            <h3>2,941</h3>
            <p>Completed Today</p>
        </label>

    </div>

    <div class="dots">
        <label for="card1"></label>
        <label for="card2"></label>
        <label for="card3"></label>
    </div>

</section>

</body>
</html>
