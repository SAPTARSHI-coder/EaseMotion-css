<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avatar Stack - EaseMotion Submission</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="stage">
    <h1 class="title">Who's online</h1>
    <div class="stack-wrap">
      <div class="avatar-stack" id="avatarStack">
        <div class="avatar a1" data-name="Anya Sharma"><span class="initials">AS</span><span class="tooltip">Anya Sharma</span></div>
        <div class="avatar a2" data-name="Dev Patel"><span class="initials">DP</span><span class="tooltip">Dev Patel</span></div>
        <div class="avatar a3" data-name="Mia Chen"><span class="initials">MC</span><span class="tooltip">Mia Chen</span></div>
        <div class="avatar a4" data-name="Leo Ortiz"><span class="initials">LO</span><span class="tooltip">Leo Ortiz</span></div>
        <div class="avatar a5" data-name="Sara Kim"><span class="initials">SK</span><span class="tooltip">Sara Kim</span></div>
        <div class="avatar a6" data-name="Noah Ali"><span class="initials">NA</span><span class="tooltip">Noah Ali</span></div>
        <div class="avatar more">+12</div>
      </div>
    </div>
    <div class="stack-controls">
      <button class="stack-btn" id="spreadBtn">Spread / Stack</button>
    </div>
    <p class="hint">Hover an avatar to lift it and reveal its name. Press spread to fan them out.</p>
  </main>

  <script>
    const stack = document.getElementById('avatarStack');
    document.getElementById('spreadBtn').addEventListener('click', () => {
      stack.classList.toggle('spread');
    });
  </script>
</body>
</html>
