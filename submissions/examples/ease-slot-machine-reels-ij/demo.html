<!-- EaseMotion component: slot-machine-reels -->
<!DOCTYPE html>
<html lang="en" data-slot="reels">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Ease Slot Machine Reels</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="slot-machine">
  <header class="machine-head">
    <span class="machine-brand">JACKPOT</span>
  </header>
  <div class="reel-bank">
    <div class="reel">
      <div class="reel-strip rsa">
        <span class="reel-sym rs-a1">7</span>
        <span class="reel-sym rs-a2">BAR</span>
        <span class="reel-sym rs-a3">CHERRY</span>
        <span class="reel-sym rs-a4">7</span>
        <span class="reel-sym rs-a5">DIAMOND</span>
        <span class="reel-sym rs-a6">7</span>
        <span class="reel-sym rs-a7">7</span>
        <span class="reel-sym rs-a8">BAR</span>
        <span class="reel-sym rs-a9">CHERRY</span>
        <span class="reel-sym rs-a10">7</span>
        <span class="reel-sym rs-a11">DIAMOND</span>
        <span class="reel-sym rs-a12">7</span>
      </div>
      <span class="payline pl-1"></span>
    </div>
    <div class="reel">
      <div class="reel-strip rsb">
        <span class="reel-sym rs-b1">BAR</span>
        <span class="reel-sym rs-b2">CHERRY</span>
        <span class="reel-sym rs-b3">7</span>
        <span class="reel-sym rs-b4">DIAMOND</span>
        <span class="reel-sym rs-b5">BAR</span>
        <span class="reel-sym rs-b6">7</span>
        <span class="reel-sym rs-b7">BAR</span>
        <span class="reel-sym rs-b8">CHERRY</span>
        <span class="reel-sym rs-b9">7</span>
        <span class="reel-sym rs-b10">DIAMOND</span>
        <span class="reel-sym rs-b11">BAR</span>
        <span class="reel-sym rs-b12">7</span>
      </div>
      <span class="payline pl-2"></span>
    </div>
    <div class="reel">
      <div class="reel-strip rsc">
        <span class="reel-sym rs-c1">CHERRY</span>
        <span class="reel-sym rs-c2">7</span>
        <span class="reel-sym rs-c3">DIAMOND</span>
        <span class="reel-sym rs-c4">BAR</span>
        <span class="reel-sym rs-c5">7</span>
        <span class="reel-sym rs-c6">CHERRY</span>
        <span class="reel-sym rs-c7">CHERRY</span>
        <span class="reel-sym rs-c8">7</span>
        <span class="reel-sym rs-c9">DIAMOND</span>
        <span class="reel-sym rs-c10">BAR</span>
        <span class="reel-sym rs-c11">7</span>
        <span class="reel-sym rs-c12">CHERRY</span>
      </div>
      <span class="payline pl-3"></span>
    </div>
  </div>
  <div class="machine-base">
    <span class="pull-note">PULL TO SPIN</span>
    <span class="lever"></span>
  </div>
</main>
</body>
</html>
