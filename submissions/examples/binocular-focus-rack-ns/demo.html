<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Binocular Focus Rack — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Binocular Focus Rack demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Binocular Focus Rack</h1>
      <p class="lede">Binoculars focus wheel racking sharpness in and out</p>
    </header>

    <section class="ease-binocular-focus-rack" data-demo="binocular-focus-rack" aria-live="polite">
      <div class="ease-binocular-focus-rack__housing">
        <div class="ease-binocular-focus-rack__bezel">
          <div class="ease-binocular-focus-rack__face">
            <div class="ease-binocular-focus-rack__readout">
              <span class="ease-binocular-focus-rack__label">Binocular Focus Rack</span>
              <span class="ease-binocular-focus-rack__value">LIVE</span>
            </div>
            <div class="ease-binocular-focus-rack__motion" aria-hidden="true">
              <span class="ease-binocular-focus-rack__a"></span>
              <span class="ease-binocular-focus-rack__b"></span>
              <span class="ease-binocular-focus-rack__c"></span>
              <span class="ease-binocular-focus-rack__d"></span>
            </div>
            <div class="ease-binocular-focus-rack__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-binocular-focus-rack__controls">
          <button type="button" class="ease-binocular-focus-rack__btn primary">Engage</button>
          <button type="button" class="ease-binocular-focus-rack__btn">Reset</button>
          <label class="ease-binocular-focus-rack__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-binocular-focus-rack__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
