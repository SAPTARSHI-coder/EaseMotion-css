<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Pure CSS 3D Glassmorphism Blur effect">
  <title>CSS 3D Glassmorphism Blur</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="scene">
    <div class="orb orb-one" aria-hidden="true"></div>
    <div class="orb orb-two" aria-hidden="true"></div>
    <div class="orb orb-three" aria-hidden="true"></div>

    <section class="glass-card" aria-labelledby="glass-title">
      <div class="glass-icon" aria-hidden="true">
        <span></span>
      </div>

      <div class="glass-content">
        <span class="glass-badge">PURE CSS 3D</span>

        <h1 id="glass-title">Glassmorphism</h1>

        <p>
          A translucent 3D interface surface combining backdrop blur,
          soft borders, depth, and smooth floating motion.
        </p>

        <div class="glass-stats" aria-label="Component features">
          <div class="stat">
            <strong>3D</strong>
            <span>Depth</span>
          </div>

          <div class="stat">
            <strong>BLUR</strong>
            <span>Backdrop</span>
          </div>

          <div class="stat">
            <strong>CSS</strong>
            <span>Only</span>
          </div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
