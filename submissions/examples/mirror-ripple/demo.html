<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mirror Ripple</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="mirror-app">

  <header>
    <span>🪞 MIRROR RIPPLE</span>
    <h1>The reflection moves first.</h1>
    <p>Interact with the mirror and watch reality catch up.</p>
  </header>

  <main id="mirror">

    <div class="reflection-object">
      <div class="head"></div>
      <div class="body"></div>
      <div class="arm left"></div>
      <div class="arm right"></div>
    </div>

    <div class="real-object">
      <div class="head"></div>
      <div class="body"></div>
      <div class="arm left"></div>
      <div class="arm right"></div>
    </div>

    <div id="particles"></div>

    <div class="status" id="status">
      Waiting for interaction...
    </div>

  </main>

  <section class="controls">

    <label>
      Reflection Delay
      <span id="delayValue">50%</span>
    </label>

    <input
      id="delay"
      type="range"
      min="0"
      max="100"
      value="50"
    >

    <button id="interact">✦ Interact</button>
    <button id="reset">↻ Reset</button>

    <strong>
      Reactions: <span id="count">0</span>
    </strong>

  </section>

</div>

<script>
const mirror = document.getElementById("mirror");
const delay = document.getElementById("delay");
const delayValue = document.getElementById("delayValue");
const status = document.getElementById("status");
const count = document.getElementById("count");
const particles = document.getElementById("particles");

let reactions = 0;

function interact() {

  mirror.classList.remove("react");
  void mirror.offsetWidth;
  mirror.classList.add("react");

  reactions++;
  count.textContent = reactions;

  status.textContent = "Reflection reacted... reality follows.";

  createParticles();

  const wait =
    Number(delay.value) * 5;

  setTimeout(() => {
    status.textContent =
      "Reality caught up with the reflection.";
  }, wait + 500);
}

function createParticles() {

  for (let i = 0; i < 8; i++) {

    const particle =
      document.createElement("span");

    particle.className = "particle";

    particle.style.left =
      `${45 + Math.random() * 10}%`;

    particle.style.top =
      `${35 + Math.random() * 20}%`;

    particle.style.setProperty(
      "--x",
      `${Math.random() * 120 - 60}px`
    );

    particle.style.setProperty(
      "--y",
      `${Math.random() * 120 - 60}px`
    );

    particles.appendChild(particle);

    setTimeout(
      () => particle.remove(),
      900
    );
  }
}

delay.addEventListener("input", () => {

  delayValue.textContent =
    `${delay.value}%`;

});

mirror.addEventListener("click", interact);

document.getElementById("interact")
  .onclick = interact;

document.getElementById("reset")
  .onclick = () => {

    mirror.classList.remove("react");
    particles.innerHTML = "";

    reactions = 0;
    count.textContent = "0";

    status.textContent =
      "Waiting for interaction...";
  };

document.addEventListener("keydown", e => {

  if (e.code === "Space") {
    e.preventDefault();
    interact();
  }

  if (e.key.toLowerCase() === "r") {
    document.getElementById("reset").click();
  }

});
</script>

</body>
</html>
