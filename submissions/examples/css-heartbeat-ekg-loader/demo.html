<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="CSS-only heartbeat EKG loader animation"
  >
  <title>CSS Heartbeat EKG Loader</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="demo-page">

    <section
      class="loader-card"
      aria-labelledby="loader-title"
    >

      <span class="eyebrow">EaseMotion CSS</span>

      <h1 id="loader-title">Heartbeat EKG Loader</h1>

      <p class="description">
        A lightweight CSS-only heartbeat animation for loading states.
      </p>

      <div
        class="ekg-loader"
        role="status"
        aria-label="Loading"
      >
        <div class="ekg-line" aria-hidden="true">
          <span class="ekg-segment"></span>
        </div>

        <span class="loading-text">
          Loading<span class="dots" aria-hidden="true">...</span>
        </span>
      </div>

    </section>

  </main>
</body>
</html>
