<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glowing Cyberpunk Button</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="container">
        
        <!-- Cyberpunk Glowing Button Variant 1 -->
        <button class="cyber-btn primary">
            <span class="btn-text">INITIALIZE SYSTEM</span>
            <span class="btn-glitch" aria-hidden="true">INITIALIZE SYSTEM</span>
            <span class="btn-tag">_R4</span>
        </button>

        <!-- Cyberpunk Glowing Button Variant 2 -->
        <button class="cyber-btn secondary">
            <span class="btn-text">ABORT SEQUENCE</span>
            <span class="btn-glitch" aria-hidden="true">ABORT SEQUENCE</span>
            <span class="btn-tag">_X9</span>
        </button>

    </div>

</body>
</html>
