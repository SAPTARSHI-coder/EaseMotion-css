<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Metrology Entangled Sensors - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css"></head><body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030712; color: #ffffff;">

    <div class="ease-card ease-card-glass qmet-container">
        <div class="qmet-header">
            <h2>Quantum Metrology</h2>
            <span class="ease-badge ease-badge-primary">Sensing</span>
        </div>
        
        <div class="qmet-screen ease-center">
            <div class="qmet-flux flux-qmet-a"></div>
            <div class="qmet-flux flux-qmet-b"></div>
            <div class="qmet-boundary-ring"></div>
            <div class="qmet-core ease-center"></div>
        </div>

        <div class="qmet-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">NOON States &amp; Heisenberg Limit</span>
            <button class="ease-btn ease-btn-primary ease-btn-sm ease-hover-grow">Run Metrology Scan</button>
        </div>
    </div></body></html>
