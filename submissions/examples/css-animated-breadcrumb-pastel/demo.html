<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Breadcrumb | Pastel Styling</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="breadcrumb-card" tabindex="0" aria-label="Pastel Animated Breadcrumb Navigation Showcase">
    <h1 class="breadcrumb-title">Pastel Breadcrumb</h1>
    <p class="breadcrumb-subtitle">Animated, pill-styled navigational trail</p>

    <nav class="breadcrumb-nav" aria-label="Breadcrumb navigation">
        <ol class="breadcrumb-list">
            <li class="breadcrumb-item">
                <a href="#home" class="breadcrumb-link">Home</a>
            </li>
            <li class="breadcrumb-item">
                <a href="#projects" class="breadcrumb-link">Projects</a>
            </li>
            <li class="breadcrumb-item">
                <a href="#design" class="breadcrumb-link">Design System</a>
            </li>
            <li class="breadcrumb-item active" aria-current="page">
                <span class="breadcrumb-current">Breadcrumb</span>
            </li>
        </ol>
    </nav>
</main>

</body>
</html>
