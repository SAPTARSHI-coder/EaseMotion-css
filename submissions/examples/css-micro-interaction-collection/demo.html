<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Micro-interaction Collection - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="em-micro-page">
        <div class="em-micro-container" role="region" aria-label="Micro-interaction Animation Showcase">
            <header class="em-micro-header">
                <span class="em-micro-badge">UI STATES</span>
                <h1 class="em-micro-title">Micro-interaction Collection</h1>
                <p class="em-micro-subtitle">Pure CSS micro-animations for common user interface feedback states.</p>
            </header>

            <div class="em-grid">
                <!-- Interaction 1: Like Button Toggle -->
                <div class="em-card" tabindex="0" role="button" aria-label="Like State Micro-interaction">
                    <span class="em-card-label">Like Button</span>
                    <label class="em-like-wrapper">
                        <input type="checkbox" class="em-sr-only">
                        <div class="em-like-icon">♥</div>
                    </label>
                </div>

                <!-- Interaction 2: Bookmark Toggle -->
                <div class="em-card" tabindex="0" role="button" aria-label="Bookmark State Micro-interaction">
                    <span class="em-card-label">Bookmark Toggle</span>
                    <label class="em-bookmark-wrapper">
                        <input type="checkbox" class="em-sr-only">
                        <div class="em-bookmark-icon">🔖</div>
                    </label>
                </div>

                <!-- Interaction 3: Notification Bell Shake -->
                <div class="em-card" tabindex="0" role="button" aria-label="Notification Bell Micro-interaction">
                    <span class="em-card-label">Notification Bell</span>
                    <div class="em-bell-wrapper">
                        <div class="em-bell-icon">🔔</div>
                    </div>
                </div>

                <!-- Interaction 4: Pulsing Status Dot -->
                <div class="em-card" tabindex="0" role="region" aria-label="Live Indicator Micro-interaction">
                    <span class="em-card-label">Live Indicator</span>
                    <div class="em-pulse-wrapper">
                        <div class="em-pulse-dot"></div>
                        <span class="em-pulse-text">ONLINE</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
