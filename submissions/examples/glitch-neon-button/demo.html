<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="CSS Glitch Neon Button - Pure CSS animated button component"
    >

    <title>Glitch Neon Button | EaseMotion CSS</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="demo-container">
        <section class="demo-card" aria-labelledby="demo-title">

            <p class="eyebrow">EaseMotion CSS</p>

            <h1 id="demo-title">Glitch Neon Button</h1>

            <p class="description">
                A lightweight neon button with a CSS-only glitch animation.
                No JavaScript required.
            </p>

            <div class="button-wrapper">
                <button
                    class="glitch-button"
                    type="button"
                    aria-label="Explore EaseMotion CSS"
                >
                    <span class="button-text">EXPLORE NOW</span>
                </button>
            </div>

        </section>
    </main>

</body>
</html>
