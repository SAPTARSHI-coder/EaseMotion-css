<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ease Mask Spotlight Demo</title>
  <link rel="stylesheet" href="style.css">
  <script> document.addEventListener('DOMContentLoaded', () => { document.querySelectorAll('.ease-spotlight-card').forEach(card => { card.addEventListener('mousemove', e => { const rect = card.getBoundingClientRect(); card.style.setProperty('--x', (e.clientX - rect.left) + 'px'); card.style.setProperty('--y', (e.clientY - rect.top) + 'px'); }); }); }); </script>
</head>
<body>
  <div class="ease-spotlight-wrapper">
    <div class="ease-spotlight-card">
      <div class="ease-spotlight-glow"></div>
      <div class="ease-spotlight-content">
        <h3>Premium Feature</h3>
        <p>Hover to reveal the masked spotlight.</p>
      </div>
    </div>
    <div class="ease-spotlight-card">
      <div class="ease-spotlight-glow"></div>
      <div class="ease-spotlight-content">
        <h3>Premium Feature</h3>
        <p>Hover to reveal the masked spotlight.</p>
      </div>
    </div>
    <div class="ease-spotlight-card">
      <div class="ease-spotlight-glow"></div>
      <div class="ease-spotlight-content">
        <h3>Premium Feature</h3>
        <p>Hover to reveal the masked spotlight.</p>
      </div>
    </div>
  </div>
</body>
</html>
