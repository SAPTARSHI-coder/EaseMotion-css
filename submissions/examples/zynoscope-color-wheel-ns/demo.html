<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zynoscope Color Wheel — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Zynoscope Color Wheel demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Zynoscope Color Wheel</h1>
      <p class="lede">Zynoscope color wheel spinning complementary sectors into blend</p>
    </header>

    <section class="ease-zynoscope-color-wheel" data-demo="zynoscope-color-wheel" aria-live="polite">
      <div class="ease-zynoscope-color-wheel__housing">
        <div class="ease-zynoscope-color-wheel__bezel">
          <div class="ease-zynoscope-color-wheel__face">
            <div class="ease-zynoscope-color-wheel__readout">
              <span class="ease-zynoscope-color-wheel__label">Zynoscope Color Wheel</span>
              <span class="ease-zynoscope-color-wheel__value">LIVE</span>
            </div>
            <div class="ease-zynoscope-color-wheel__motion" aria-hidden="true">
              <span class="ease-zynoscope-color-wheel__a"></span>
              <span class="ease-zynoscope-color-wheel__b"></span>
              <span class="ease-zynoscope-color-wheel__c"></span>
              <span class="ease-zynoscope-color-wheel__d"></span>
            </div>
            <div class="ease-zynoscope-color-wheel__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-zynoscope-color-wheel__controls">
          <button type="button" class="ease-zynoscope-color-wheel__btn primary">Engage</button>
          <button type="button" class="ease-zynoscope-color-wheel__btn">Reset</button>
          <label class="ease-zynoscope-color-wheel__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-zynoscope-color-wheel__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
