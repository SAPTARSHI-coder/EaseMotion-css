<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EaseMotion CSS — Radial Progress Indicator</title>
<link rel="stylesheet" href="style.css">
<style>
  body {
    background: #f9fafb;
    margin: 0;
    padding: 2rem 1rem;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  h1 {
    text-align: center;
    font-size: 1.4rem;
    color: #111827;
  }
  p.ease-intro {
    text-align: center;
    max-width: 480px;
    margin: 0.5rem auto 2rem;
    color: #6b7280;
    font-size: 0.95rem;
  }
  .ease-radial-toggles {
    max-width: 320px;
    margin: 1rem auto 0;
  }
</style>
</head>
<body>

  <h1>Radial Progress Indicator</h1>
  <p class="ease-intro">
    Concentric CSS-only rings showing three metrics at once. Use the
    checkboxes below (keyboard accessible, no JavaScript) to highlight
    a specific ring.
  </p>

  <!-- Checkboxes must be direct siblings of .ease-radial-group (both
       children of body) so the ~ selectors in style.css work. Their
       <label>s can live anywhere via the "for" attribute. -->
  <input type="checkbox" id="ease-ring-1-toggle" class="ease-radial-toggle-input">
  <input type="checkbox" id="ease-ring-2-toggle" class="ease-radial-toggle-input">
  <input type="checkbox" id="ease-ring-3-toggle" class="ease-radial-toggle-input">

  <div class="ease-radial-toggles">
    <ul class="ease-radial-legend" role="list">
      <li>
        <label class="ease-radial-toggle-label" for="ease-ring-1-toggle">
          <span class="ease-swatch" style="background:#6366f1;"></span>
          Outer ring — CPU usage (72%)
        </label>
      </li>
      <li>
        <label class="ease-radial-toggle-label" for="ease-ring-2-toggle">
          <span class="ease-swatch" style="background:#10b981;"></span>
          Middle ring — Memory usage (54%)
        </label>
      </li>
      <li>
        <label class="ease-radial-toggle-label" for="ease-ring-3-toggle">
          <span class="ease-swatch" style="background:#f59e0b;"></span>
          Inner ring — Disk usage (38%)
        </label>
      </li>
    </ul>
  </div>

  <!--
    Radial group: each ring is a div with role="img" and an aria-label
    describing its metric and value, since the visual is purely
    decorative CSS (conic-gradient) with no native semantics.
  -->
  <div
    class="ease-radial-group"
    role="img"
    aria-label="System metrics: CPU 72 percent, Memory 54 percent, Disk 38 percent"
  >
    <div
      class="ease-radial-ring"
      style="--ease-value: 72; --ease-color: #6366f1; --ease-track: rgba(99,102,241,0.12);"
      role="img"
      aria-label="CPU usage 72 percent"
    ></div>
    <div
      class="ease-radial-ring"
      style="--ease-value: 54; --ease-color: #10b981; --ease-track: rgba(16,185,129,0.12);"
      role="img"
      aria-label="Memory usage 54 percent"
    ></div>
    <div
      class="ease-radial-ring"
      style="--ease-value: 38; --ease-color: #f59e0b; --ease-track: rgba(245,158,11,0.12);"
      role="img"
      aria-label="Disk usage 38 percent"
    ></div>

    <div class="ease-radial-center">
      <strong>72%</strong>
      <span>CPU peak</span>
    </div>
  </div>

</body>
</html>
