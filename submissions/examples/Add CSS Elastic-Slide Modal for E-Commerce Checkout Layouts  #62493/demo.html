<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Elastic-Slide Modal - EaseMotion</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Pure CSS State Checkbox -->
  <input type="checkbox" id="modal-toggle" class="modal-state" aria-hidden="true">

  <!-- Main Background Application -->
  <div class="app-layout">
    
    <main class="checkout-app">
      <h2>Order Summary</h2>
      
      <div class="product-item">
        <div class="product-img"></div>
        <div class="product-info">
          <h4>Ergonomic Chair</h4>
          <p>Charcoal Gray</p>
        </div>
        <div class="product-price">$245.00</div>
      </div>

      <div class="summary-row">
        <span>Subtotal</span>
        <span>$245.00</span>
      </div>
      <div class="summary-row">
        <span>Shipping</span>
        <span>$15.00</span>
      </div>
      
      <!-- Label acts as Modal Trigger Button -->
      <label for="modal-toggle" class="promo-trigger" aria-label="Apply Promo Code">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
        </svg>
        Have a promo code?
      </label>

      <hr class="divider">
      <div class="summary-row total">
        <span>Total</span>
        <span>$260.00</span>
      </div>
      
      <button class="checkout-btn">Complete Purchase</button>
    </main>
    
  </div>

  <!-- Glassmorphism Backdrop Overlay (Acts as Close Button) -->
  <label for="modal-toggle" class="modal-backdrop" aria-label="Close Modal"></label>

  <!-- The Elastic-Slide Modal Container -->
  <div class="modal" role="dialog" aria-modal="true">
    
    <div class="modal-header">
      <h3>Apply Promo Code</h3>
      <label for="modal-toggle" class="close-btn" aria-label="Close Modal">&times;</label>
    </div>
    
    <div class="modal-body">
      
      <!-- Mock Form Input -->
      <div class="input-group">
        <input type="text" placeholder="Enter code (e.g. SUMMER20)">
        <!-- A visually responsive submit button, closes modal for demo purposes -->
        <label for="modal-toggle" class="apply-btn">Apply</label>
      </div>

      <h4 class="section-title">Available Offers</h4>
      
      <!-- Mock Selectable Cards -->
      <div class="valid-codes">
        
        <label for="modal-toggle" class="code-card">
          <div class="code-info">
            <strong>WELCOME10</strong>
            <span>10% off your first order</span>
          </div>
          <div class="code-action">Apply</div>
        </label>
        
        <label for="modal-toggle" class="code-card">
          <div class="code-info">
            <strong>FREESHIP</strong>
            <span>Free standard shipping</span>
          </div>
          <div class="code-action">Apply</div>
        </label>

      </div>

    </div>
  </div>

</body>
</html>
