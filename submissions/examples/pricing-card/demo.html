<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pricing Card</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="demo-shell">
      <section class="pricing-card is-featured" aria-labelledby="pc-title">
        <span class="pricing-card__badge">Most popular</span>
        <p class="pricing-card__plan">Pro</p>
        <p class="pricing-card__price">
          <span class="pricing-card__currency">$</span>
          <span class="pricing-card__amount">29</span>
          <span class="pricing-card__period">/mo</span>
        </p>
        <p class="pricing-card__tagline">For growing teams that need more power.</p>
        <ul class="pricing-card__features">
          <li>Unlimited projects</li>
          <li>Priority support</li>
          <li>Advanced analytics</li>
          <li>Custom branding</li>
        </ul>
        <button type="button" class="pricing-card__cta">Start free trial</button>
      </section>
    </main>
  </body>
</html>
