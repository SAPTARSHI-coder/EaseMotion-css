<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pricing Card Demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f8fafc;
    }
  </style>
</head>
<body>

  <!-- Notice the 'pricing-hover-ag' class applied alongside the base structure -->
  <div class="pricing-card-ag pricing-hover-ag">
    <div class="pricing-tier-ag">Pro Plan</div>
    <div class="pricing-price-ag">
      <span class="pricing-currency-ag">$</span>29<span class="pricing-period-ag">/mo</span>
    </div>
    
    <ul class="pricing-features-ag">
      <li class="pricing-feature-ag">10 Projects</li>
      <li class="pricing-feature-ag">Advanced Analytics</li>
      <li class="pricing-feature-ag">24/7 Premium Support</li>
      <li class="pricing-feature-ag">Custom Domain</li>
    </ul>

    <button class="pricing-btn-ag">Get Started</button>
  </div>

</body>
</html>
