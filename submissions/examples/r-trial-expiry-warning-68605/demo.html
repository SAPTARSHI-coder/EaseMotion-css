<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CSS trial expiry warning banner with upgrade CTA.">
  <title>CSS Trial Expiry Warning</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">
    <section
      class="trial-banner"
      aria-labelledby="trial-title"
      role="status"
    >
      <div class="icon" aria-hidden="true">!</div>

      <div class="trial-content">
        <p class="label">Trial ending soon</p>

        <h1 id="trial-title">
          Your free trial ends in <strong>3 days</strong>
        </h1>

        <p class="description">
          Upgrade now to keep access to all premium features.
        </p>
      </div>

      <a class="upgrade-button" href="#upgrade">
        Upgrade
        <span aria-hidden="true">→</span>
      </a>
    </section>
  </main>

</body>
</html>
