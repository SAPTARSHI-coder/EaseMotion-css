<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animated Progress Bar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="progress-container">
    <h1>Animated Progress Bar</h1>
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <p id="progressText">Progress: 0%</p>
    <div class="controls">
      <button onclick="startProgress()">Start</button>
      <button onclick="resetProgress()">Reset</button>
    </div>
  </div>

  <script>
    let progress = 0;
    let interval;

    function startProgress() {
      clearInterval(interval);
      interval = setInterval(() => {
        if (progress < 100) {
          progress++;
          document.getElementById('progressFill').style.width = progress + "%";
          document.getElementById('progressText').textContent = "Progress: " + progress + "%";
        } else {
          clearInterval(interval);
        }
      }, 50); // speed of animation
    }

    function resetProgress() {
      clearInterval(interval);
      progress = 0;
      document.getElementById('progressFill').style.width = progress + "%";
      document.getElementById('progressText').textContent = "Progress: " + progress + "%";
    }
  </script>
</body>
</html>
