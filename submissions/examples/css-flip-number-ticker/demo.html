<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Flip Number Ticker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="layout-container">
        
        <header class="section-header">
            <h1 class="title">Pure CSS Flip Ticker</h1>
            <p class="subtitle">Airport departure board style animation. Respects system light/dark mode.</p>
        </header>

        <div class="ticker-area">
            
            <!-- 
               The Flip Ticker Board
            -->
            <div class="ticker-board" aria-label="Ticker showing departure">
                
                <!-- Digit 1 -->
                <div class="flip-unit delay-1">
                    <div class="flip-card flip-anim">
                        <div class="flip-card-top">D</div>
                        <div class="flip-card-bottom">E</div>
                        <div class="flip-card-back">
                            <div class="flip-card-back-bottom">D</div>
                        </div>
                    </div>
                </div>

                <!-- Digit 2 -->
                <div class="flip-unit delay-2">
                    <div class="flip-card flip-anim">
                        <div class="flip-card-top">P</div>
                        <div class="flip-card-bottom">Q</div>
                        <div class="flip-card-back">
                            <div class="flip-card-back-bottom">P</div>
                        </div>
                    </div>
                </div>

                <!-- Digit 3 -->
                <div class="flip-unit delay-3">
                    <div class="flip-card flip-anim">
                        <div class="flip-card-top">A</div>
                        <div class="flip-card-bottom">B</div>
                        <div class="flip-card-back">
                            <div class="flip-card-back-bottom">A</div>
                        </div>
                    </div>
                </div>

                <!-- Digit 4 -->
                <div class="flip-unit delay-4">
                    <div class="flip-card flip-anim">
                        <div class="flip-card-top">R</div>
                        <div class="flip-card-bottom">S</div>
                        <div class="flip-card-back">
                            <div class="flip-card-back-bottom">R</div>
                        </div>
                    </div>
                </div>
                
                <!-- Digit 5 -->
                <div class="flip-unit delay-5">
                    <div class="flip-card flip-anim">
                        <div class="flip-card-top">T</div>
                        <div class="flip-card-bottom">U</div>
                        <div class="flip-card-back">
                            <div class="flip-card-back-bottom">T</div>
                        </div>
                    </div>
                </div>

            </div>
            
            <p class="instruction-text">The letters flip sequentially using staggered CSS animation delays.</p>
            
        </div>
    </div>

</body>
</html>
