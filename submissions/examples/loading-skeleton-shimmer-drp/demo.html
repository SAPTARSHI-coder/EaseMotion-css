<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loading Skeleton Shimmer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="shell" aria-labelledby="title">
    <section class="card">
      <p class="eyebrow">loading state</p>
      <h1 id="title">Loading Skeleton Shimmer</h1>
      <p class="summary">A simple CSS-only shimmer that previews content while data loads.</p>
      <div class="panel" role="img" aria-label="Animated loading skeleton">
        <div class="avatar"></div>
        <div class="lines">
          <span class="line line-long"></span>
          <span class="line line-mid"></span>
          <span class="line line-short"></span>
        </div>
      </div>
      <div class="chips">
        <span>placeholder</span>
        <span>smooth shimmer</span>
        <span>responsive card</span>
      </div>
    </section>
  </main>
</body>
</html>
