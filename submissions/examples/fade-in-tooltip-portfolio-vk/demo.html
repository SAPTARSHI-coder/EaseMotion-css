<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fade-In Tooltip</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="portfolio-card">

    <h1>Creative Portfolio</h1>
    <p class="subtitle">
        Hover over the buttons to discover more about each section.
    </p>

    <div class="tooltip-group">

        <button class="tooltip-button">
            GitHub
            <span class="tooltip">
                Explore my latest open-source projects and contributions.
            </span>
        </button>

        <button class="tooltip-button">
            LinkedIn
            <span class="tooltip">
                Connect professionally and view my experience.
            </span>
        </button>

        <button class="tooltip-button">
            Resume
            <span class="tooltip">
                Download my latest resume and technical profile.
            </span>
        </button>

        <button class="tooltip-button">
            Contact
            <span class="tooltip">
                Reach out for collaborations and project opportunities.
            </span>
        </button>

    </div>

</div>

</body>
</html>
