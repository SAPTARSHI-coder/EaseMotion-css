<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Accessible CSS rating component with a 3D perspective tilt effect."
  >
  <title>3D Perspective Tilt Rating</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">
    <section class="rating-card" aria-labelledby="rating-title">
      <div class="card-content">
        <span class="eyebrow">RATING &amp; FEEDBACK</span>

        <h1 id="rating-title">How was your experience?</h1>

        <p class="description">
          Choose a rating and watch the stars respond with a smooth
          3D perspective tilt.
        </p>

        <fieldset class="rating">
          <legend class="sr-only">Rate your experience from 1 to 5 stars</legend>

          <input
            type="radio"
            id="star-5"
            name="rating"
            value="5"
          >
          <label for="star-5" title="5 stars" aria-label="5 stars">
            <span aria-hidden="true">★</span>
          </label>

          <input
            type="radio"
            id="star-4"
            name="rating"
            value="4"
          >
          <label for="star-4" title="4 stars" aria-label="4 stars">
            <span aria-hidden="true">★</span>
          </label>

          <input
            type="radio"
            id="star-3"
            name="rating"
            value="3"
          >
          <label for="star-3" title="3 stars" aria-label="3 stars">
            <span aria-hidden="true">★</span>
          </label>

          <input
            type="radio"
            id="star-2"
            name="rating"
            value="2"
          >
          <label for="star-2" title="2 stars" aria-label="2 stars">
            <span aria-hidden="true">★</span>
          </label>

          <input
            type="radio"
            id="star-1"
            name="rating"
            value="1"
          >
          <label for="star-1" title="1 star" aria-label="1 star">
            <span aria-hidden="true">★</span>
          </label>
        </fieldset>

        <p class="rating-hint">
          Select a rating to leave your feedback.
        </p>
      </div>

      <div class="card-glow" aria-hidden="true"></div>
    </section>
  </main>

</body>
</html>
