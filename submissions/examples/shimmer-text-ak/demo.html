<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shimmer Text — EaseMotion CSS</title>
  <meta name="description" content="CSS-only shimmer text animation using ease-shimmer-text class. No JavaScript required." />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <p class="label">Default — white shimmer</p>
  <h1 class="ease-shimmer-text">EaseMotion CSS</h1>

  <p class="label">--purple</p>
  <h2 class="ease-shimmer-text ease-shimmer-text--purple">Animation First</h2>

  <p class="label">--gold</p>
  <h2 class="ease-shimmer-text ease-shimmer-text--gold">Zero Dependencies</h2>

  <p class="label">--cyan</p>
  <h2 class="ease-shimmer-text ease-shimmer-text--cyan">Human Readable</h2>

  <p class="label">--rose</p>
  <h2 class="ease-shimmer-text ease-shimmer-text--rose">Open Source</h2>

  <p class="label">--fast &amp; --slow</p>
  <div style="display:flex;flex-wrap:wrap;gap:2rem;justify-content:center;align-items:center">
    <span class="ease-shimmer-text ease-shimmer-text--purple ease-shimmer-text--fast">Fast</span>
    <span class="ease-shimmer-text ease-shimmer-text--gold ease-shimmer-text--slow">Slow</span>
  </div>

</body>
</html>
