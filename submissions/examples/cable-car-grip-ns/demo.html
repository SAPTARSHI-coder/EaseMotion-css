<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cable Car Grip — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Cable Car Grip demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Cable Car Grip</h1>
      <p class="lede">Cable-car grip clamping onto a moving haul cable</p>
    </header>

    <section class="ease-cable-car-grip" data-demo="cable-car-grip" aria-live="polite">
      <div class="ease-cable-car-grip__housing">
        <div class="ease-cable-car-grip__bezel">
          <div class="ease-cable-car-grip__face">
            <div class="ease-cable-car-grip__readout">
              <span class="ease-cable-car-grip__label">Cable Car Grip</span>
              <span class="ease-cable-car-grip__value">LIVE</span>
            </div>
            <div class="ease-cable-car-grip__motion" aria-hidden="true">
              <span class="ease-cable-car-grip__a"></span>
              <span class="ease-cable-car-grip__b"></span>
              <span class="ease-cable-car-grip__c"></span>
              <span class="ease-cable-car-grip__d"></span>
            </div>
            <div class="ease-cable-car-grip__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-cable-car-grip__controls">
          <button type="button" class="ease-cable-car-grip__btn primary">Engage</button>
          <button type="button" class="ease-cable-car-grip__btn">Reset</button>
          <label class="ease-cable-car-grip__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-cable-car-grip__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
