<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fault Tolerant Surface Code Routing and Routing Surgery SCRS - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css"></head><body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030712; color: #ffffff;">

    <div class="ease-card ease-card-glass scrs-container">
        <div class="scrs-header">
            <h2>Surface Code Routing Surgery</h2>
            <span class="ease-badge ease-badge-secondary">Fault-Tolerant Quantum</span>
        </div>
        
        <div class="scrs-screen ease-center">
            <div class="scrs-flux flux-scrs-a"></div>
            <div class="scrs-flux flux-scrs-b"></div>
            <div class="scrs-boundary-ring"></div>
            <div class="scrs-core ease-center"></div>
        </div>

        <div class="scrs-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Dynamic Defect Routing &amp; Planar Braiding Corridors</span>
            <button class="ease-btn ease-btn-secondary ease-btn-sm ease-hover-grow">Run Routing Surgery</button>
        </div>
    </div></body></html>
