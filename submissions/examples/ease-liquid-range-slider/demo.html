<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ease Liquid Range Input Slider</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="ease-slider-body">
  <div class="ease-slider-wrapper">
    <div class="ease-tooltip" id="tooltip">50</div>
    <input type="range" class="ease-range" id="range" min="0" max="100" value="50" />
  </div>

  <script>
    const range = document.getElementById('range');
    const tooltip = document.getElementById('tooltip');

    function update() {
      const val = range.value;
      tooltip.textContent = val;
      tooltip.style.left = `${val}%`;
    }
    range.addEventListener('input', update);
    update();
  </script>
</body>
</html>
