<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Accessible ARIA live region styled with CSS"
  >
  <title>CSS ARIA Live Region</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="page">
    <section class="live-card" aria-labelledby="title">
      <span class="status-icon" aria-hidden="true">✓</span>

      <h1 id="title">ARIA Live Region</h1>

      <div
        class="live-region"
        role="status"
        aria-live="polite"
        aria-atomic="true"
      >
        <span class="live-indicator" aria-hidden="true"></span>
        <p>
          Your changes have been saved successfully.
        </p>
      </div>

      <p class="description">
        This region provides accessible status information
        for users of assistive technologies.
      </p>
    </section>
  </main>
</body>
</html>
