<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Building Fill Progress | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="building-demo-container">
    
    <!-- Building Fill Progress Component -->
    <article class="ease-building-card" aria-label="Construction Milestone Progress">
      
      <header class="ease-building-header">
      <h1>HQ Tower Construction</h1>
      <p>Floor-by-floor structural completion tracker</p>
      </header>

      <!-- Accessible Building Silhouette -->
      <div class="ease-building-silhouette" role="progressbar" aria-valuenow="83" aria-valuemin="0" aria-valuemax="100" aria-label="Building construction progress: 83 percent complete">
        
        <!-- Floor 6 (Top) -->
        <div class="ease-building-floor active" aria-hidden="true">
          <div class="ease-floor-window"></div>
          <div class="ease-floor-window"></div>
          <div class="ease-floor-window"></div>
        </div>

        <!-- Floor 5 -->
        <div class="ease-building-floor active" aria-hidden="true">
          <div class="ease-floor-window"></div>
          <div class="ease-floor-window"></div>
          <div class="ease-floor-window"></div>
        </div>

        <!-- Floor 4 -->
        <div class="ease-building-floor active" aria-hidden="true">
          <div class="ease-floor-window"></div>
          <div class="ease-floor-window"></div>
          <div class="ease-floor-window"></div>
        </div>

        <!-- Floor 3 -->
        <div class="ease-building-floor active" aria-hidden="true">
          <div class="ease-floor-window"></div>
          <div class="ease-floor-window"></div>
          <div class="ease-floor-window"></div>
        </div>

        <!-- Floor 2 -->
        <div class="ease-building-floor active" aria-hidden="true">
          <div class="ease-floor-window"></div>
          <div class="ease-floor-window"></div>
          <div class="ease-floor-window"></div>
        </div>

        <!-- Floor 1 (Ground) -->
        <div class="ease-building-floor" aria-hidden="true">
          <div class="ease-floor-window"></div>
          <div class="ease-floor-window"></div>
          <div class="ease-floor-window"></div>
        </div>

      </div>

      <div class="ease-building-meta">
        <span class="ease-building-percentage" aria-hidden="true">83%</span>
        <span class="ease-building-status">5 of 6 Floors Completed</span>
      </div>

    </article>

  </main>

</body>
</html>
