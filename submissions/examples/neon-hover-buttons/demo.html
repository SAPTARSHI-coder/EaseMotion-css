<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon Hover Buttons</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="container">
    <h1>Neon Hover Buttons</h1>
    <p class="subtitle">Pure CSS glow animations</p>

    <section class="button-grid">
      <button class="neon-button neon-cyan">
        <span>Explore</span>
      </button>

      <button class="neon-button neon-pink">
        <span>Discover</span>
      </button>

      <button class="neon-button neon-green">
        <span>Launch</span>
      </button>

      <button class="neon-button neon-purple">
        <span>Get Started</span>
      </button>
    </section>
  </main>

</body>
</html>
