<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flip Vertical Menu</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <h1>Flip Vertical Menu</h1>

    <div class="menu-wrap">
      <button class="menu-trigger" id="menuTrigger" aria-haspopup="true" aria-expanded="false" aria-controls="dropMenu">
        Options ▾
      </button>
      <ul class="drop-menu" id="dropMenu" role="menu" hidden>
        <li role="none"><a role="menuitem" href="#">Edit</a></li>
        <li role="none"><a role="menuitem" href="#">Duplicate</a></li>
        <li role="none"><a role="menuitem" href="#">Archive</a></li>
        <li role="none"><a role="menuitem" href="#" class="danger">Delete</a></li>
      </ul>
    </div>
  </main>

  <script>
    const trigger = document.getElementById('menuTrigger');
    const menu = document.getElementById('dropMenu');

    function closeMenu() {
      menu.classList.remove('is-open');
      trigger.setAttribute('aria-expanded', 'false');
      setTimeout(() => { menu.hidden = true; }, 200);
    }

    function openMenu() {
      menu.hidden = false;
      requestAnimationFrame(() => menu.classList.add('is-open'));
      trigger.setAttribute('aria-expanded', 'true');
    }

    trigger.addEventListener('click', () => {
      const isOpen = trigger.getAttribute('aria-expanded') === 'true';
      isOpen ? closeMenu() : openMenu();
    });

    document.addEventListener('click', (e) => {
      if (!e.target.closest('.menu-wrap')) closeMenu();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') { closeMenu(); trigger.focus(); }
    });
  </script>
</body>
</html>
