<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A premium showcase of custom-styled, fully animated range sliders built with pure HTML and CSS. No JS required.">
  <title>Custom Animated Range Sliders - EaseMotion CSS</title>
  
  <!-- Premium Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Custom Slider Component Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Ambient Decorative Background Glows -->
  <div class="ambient-glows" aria-hidden="true">
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>
  </div>

  <main class="showcase-container">
    
    <!-- Hero Header -->
    <header class="hero-section">
      <h1 class="hero-title">Custom Animated Range Sliders</h1>
      <p class="hero-subtitle">Elevate user inputs with fluid animations, glowing states, and cross-browser custom range styling. Built with pure HTML and CSS.</p>
    </header>

    <!-- Sliders Card Container -->
    <section class="sliders-card" aria-label="Range Slider Showcase">
      
      <!-- 1. Default (Blue) Slider -->
      <div class="slider-group">
        <div class="slider-header">
          <label for="slider-default" class="slider-label">System Volume (Default)</label>
          <span class="slider-value-badge">70%</span>
        </div>
        <input 
          type="range" 
          id="slider-default" 
          class="custom-range range-default" 
          min="0" 
          max="100" 
          value="70"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="70"
        >
      </div>

      <!-- 2. Success (Green) Slider -->
      <div class="slider-group">
        <div class="slider-header">
          <label for="slider-success" class="slider-label">Battery Level (Success)</label>
          <span class="slider-value-badge">92%</span>
        </div>
        <input 
          type="range" 
          id="slider-success" 
          class="custom-range range-success" 
          min="0" 
          max="100" 
          value="92"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="92"
        >
      </div>

      <!-- 3. Warning (Orange/Yellow) Slider -->
      <div class="slider-group">
        <div class="slider-header">
          <label for="slider-warning" class="slider-label">Storage Capacity (Warning)</label>
          <span class="slider-value-badge">80%</span>
        </div>
        <input 
          type="range" 
          id="slider-warning" 
          class="custom-range range-warning" 
          min="0" 
          max="100" 
          value="80"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="80"
        >
      </div>

      <!-- 4. Danger (Red) Slider -->
      <div class="slider-group">
        <div class="slider-header">
          <label for="slider-danger" class="slider-label">CPU Temperature (Danger)</label>
          <span class="slider-value-badge">95°C</span>
        </div>
        <input 
          type="range" 
          id="slider-danger" 
          class="custom-range range-danger" 
          min="0" 
          max="100" 
          value="95"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="95"
        >
      </div>

      <!-- 5. Gradient Slider -->
      <div class="slider-group">
        <div class="slider-header">
          <label for="slider-gradient" class="slider-label">RGB Palette (Gradient Track)</label>
          <span class="slider-value-badge">Custom</span>
        </div>
        <input 
          type="range" 
          id="slider-gradient" 
          class="custom-range range-gradient" 
          min="0" 
          max="100" 
          value="50"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="50"
        >
      </div>

    </section>

  </main>

</body>
</html>
