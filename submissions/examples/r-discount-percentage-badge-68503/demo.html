<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Animated CSS discount percentage badge with original and discounted prices"
  >
  <title>CSS Discount Percentage Badge</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <article class="product-card" aria-label="Discounted product">
      <div class="discount-badge" aria-label="30 percent discount">
        <span class="discount-value">30%</span>
        <span class="discount-label">OFF</span>
      </div>

      <div class="product-icon" aria-hidden="true">
        ✦
      </div>

      <div class="product-content">
        <p class="category">Featured Offer</p>

        <h1>Premium Wireless Headphones</h1>

        <p class="description">
          Experience immersive sound with comfortable all-day wireless listening.
        </p>

        <div class="pricing" aria-label="Price reduced from 7,999 rupees to 5,599 rupees">
          <span class="original-price">₹7,999</span>
          <span class="current-price">₹5,599</span>
        </div>

        <p class="savings">
          You save ₹2,400
        </p>

        <button type="button" class="shop-button">
          Shop now
          <span aria-hidden="true">→</span>
        </button>
      </div>
    </article>
  </main>
</body>
</html>
