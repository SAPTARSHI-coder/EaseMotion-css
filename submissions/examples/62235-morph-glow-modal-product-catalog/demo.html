<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Morph Glow Modal - Product Catalog</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">

        <h1>✨ Morph Glow Product Modal</h1>
        <p>Pure CSS animated modal showcase</p>

        <div class="product-card">
            <div class="product-image">
                🛍️
            </div>

            <h2>Premium Product</h2>
            <p>
                Modern product catalog card with morph-glow animation.
            </p>

            <button class="open-btn">
                View Details
            </button>
        </div>


        <div class="modal">
            <div class="modal-content">

                <span class="close">×</span>

                <div class="glow"></div>

                <h2>Premium Collection</h2>

                <p>
                    Experience a smooth morphing glow modal
                    created completely with HTML and CSS.
                </p>

                <button>
                    Add To Cart
                </button>

            </div>
        </div>

    </main>

</body>
</html>
