<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dynamic Floating Input Field</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Dynamic Floating Input Field Demo</h1>
  <form class="form" role="form" aria-label="Brutalist floating input form">
    <div class="input-group">
      <input type="text" id="username" required aria-required="true">
      <label for="username">Username</label>
    </div>
    <div class="input-group">
      <input type="email" id="email" required aria-required="true">
      <label for="email">Email</label>
    </div>
  </form>
</body>
</html>
