<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flip Pill Mixin - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="gallery">
    <h1>Flip Pill Mixin (<code>#54700</code>)</h1>
    <p class="subtitle">Hover over the pills to flip across the 3D X-axis and uncover hidden secondary metrics.</p>
    
    <div class="pills-row">
      <div class="ease-flip-pill">
        <div class="pill-inner">
          <div class="pill-front blue">⚡ Status: Operational</div>
          <div class="pill-back blue-back">Uptime: 99.99% ✓</div>
        </div>
      </div>

      <div class="ease-flip-pill">
        <div class="pill-inner">
          <div class="pill-front green">📦 Build: v2.4.0</div>
          <div class="pill-back green-back">0 Lint Errors 🎯</div>
        </div>
      </div>

      <div class="ease-flip-pill">
        <div class="pill-inner">
          <div class="pill-front purple">🛡️ License: MIT</div>
          <div class="pill-back purple-back">Open for Comms 🎉</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
