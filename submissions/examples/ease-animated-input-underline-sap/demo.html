<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animated Input Underline</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <h1>Animated Input Underline</h1>

    <form class="form" onsubmit="return false">
      <div class="field">
        <input type="text" id="name" class="field-input" placeholder=" " required>
        <label for="name" class="field-label">Full name</label>
        <span class="field-underline"></span>
      </div>

      <div class="field">
        <input type="email" id="email" class="field-input" placeholder=" " required>
        <label for="email" class="field-label">Email address</label>
        <span class="field-underline"></span>
      </div>
    </form>
  </main>
</body>
</html>
