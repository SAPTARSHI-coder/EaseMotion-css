<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-book-shelf-display</title>
</head>
<body>
<main class="bsd-card">
  <div class="bsd-lamp">
    <div class="bsd-lamp-neck"></div>
    <div class="bsd-lamp-head"></div>
    <div class="bsd-lamp-glow"></div>
  </div>
  <div class="bsd-shelf">
    <span class="bsd-book bsd-book-1"></span>
    <span class="bsd-book bsd-book-2"></span>
    <span class="bsd-book bsd-book-3"></span>
    <span class="bsd-book bsd-book-4"></span>
    <span class="bsd-book bsd-book-5"></span>
    <span class="bsd-book bsd-book-6"></span>
    <span class="bsd-book bsd-book-7"></span>
  </div>
  <div class="bsd-open">
    <div class="bsd-open-left"></div>
    <div class="bsd-open-right"></div>
    <span class="bsd-line"></span>
    <span class="bsd-line-2"></span>
  </div>
</main>
</body>
</html>
