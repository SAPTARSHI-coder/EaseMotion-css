<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slide Animation Overflow Fix - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="ease-slide-wrapper">
    <main class="content-panel">
      <header class="ease-slide-down">
        <span class="badge">Fix #56086</span>
        <h1>Overflow-Safe Slide Animations</h1>
      </header>
      <section class="ease-slide-up card">
        <h3>Vertical Bounds Enforcement</h3>
        <p>By confining transforms strictly to vertical vector paths (<code>translate3d(0, Y, 0)</code>) and introducing the <code>ease-slide-wrapper</code> viewport boundary, narrow mobile displays never suffer from horizontal scrollbar overflow breaks.</p>
      </section>
    </main>
  </div>
</body>
</html>
