<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NPM Badge Shimmer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <h1>NPM Badge Shimmer</h1>

    <div class="badge-row">
      <span class="badge">
        <span class="badge-label">npm</span>
        <span class="badge-value shimmer">v4.2.1</span>
      </span>

      <span class="badge">
        <span class="badge-label">downloads</span>
        <span class="badge-value shimmer">1.2M/mo</span>
      </span>

      <span class="badge">
        <span class="badge-label">build</span>
        <span class="badge-value shimmer badge-pass">passing</span>
      </span>
    </div>

    <p class="hint">Badges shimmer continuously to signal "live" data.</p>
  </main>
</body>
</html>
