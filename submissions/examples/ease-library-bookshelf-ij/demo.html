<!-- EaseMotion component: library-bookshelf -->
<!DOCTYPE html>
<html lang="en" data-lib="shelf">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.4">
<title>Ease Library Bookshelf</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="library-shelf">
  <header class="lib-head">
    <span class="lib-title">THE READING ROOM</span>
  </header>
  <div class="bookcase">
    <div class="shelf">
      <span class="book bk-1"></span>
      <span class="book bk-2"></span>
      <span class="book bk-3"></span>
      <span class="book bk-4"></span>
    </div>
    <div class="shelf">
      <span class="book bk-5"></span>
      <span class="book bk-6"></span>
      <span class="book bk-7"></span>
      <span class="book bk-8"></span>
    </div>
    <div class="shelf">
      <span class="book bk-1"></span>
      <span class="book bk-7"></span>
      <span class="book bk-4"></span>
      <span class="book bk-2"></span>
    </div>
  </div>
</main>
</body>
</html>
