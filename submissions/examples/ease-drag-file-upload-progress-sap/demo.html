<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ease-drag-file-upload-progress-sap demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { height: 100vh; margin: 0; display: flex; align-items: center; justify-content: center; background: #f4f4f5; }
  </style>
</head>
<body>
  <div class="upload-progress-sap">
    <div class="drop-zone" id="zone">Drag & drop a file to simulate upload</div>
    <div id="fileList"></div>
  </div>
  <script>
    const zone = document.getElementById('zone');
    const list = document.getElementById('fileList');

    ['dragenter','dragover'].forEach(evt => zone.addEventListener(evt, e => { e.preventDefault(); zone.classList.add('drag-over'); }));
    ['dragleave','drop'].forEach(evt => zone.addEventListener(evt, e => { e.preventDefault(); zone.classList.remove('drag-over'); }));

    zone.addEventListener('drop', (e) => {
      const files = e.dataTransfer.files;
      [...files].forEach(simulateUpload);
    });

    zone.addEventListener('click', () => simulateUpload({ name: 'demo-file.pdf' }));

    function simulateUpload(file) {
      const row = document.createElement('div');
      row.className = 'file-row';
      row.innerHTML = `<span>${file.name}</span><div class="file-track"><div class="file-fill"></div></div><span class="pct">0%</span>`;
      list.appendChild(row);
      const fill = row.querySelector('.file-fill');
      const pct = row.querySelector('.pct');
      let p = 0;
      const timer = setInterval(() => {
        p = Math.min(100, p + Math.random() * 20);
        fill.style.width = p + '%';
        pct.textContent = Math.round(p) + '%';
        if (p >= 100) clearInterval(timer);
      }, 250);
    }
  </script>
</body>
</html>
