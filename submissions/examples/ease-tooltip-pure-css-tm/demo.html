<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tooltip | EaseMotion CSS</title><link rel="stylesheet" href="style.css"></head>
<body><div class="tt-root">
<div class="tt-wrap"><button class="tt-btn">Hover me</button><span class="tt-box">This is a tooltip!</span></div>
<div class="tt-wrap"><button class="tt-btn" style="background:#10b981;">Save</button><span class="tt-box">Click to save changes</span></div>
<div class="tt-wrap"><button class="tt-btn" style="background:#f59e0b;">Edit</button><span class="tt-box">Edit this item</span></div>
<div class="tt-wrap"><button class="tt-btn" style="background:#ef4444;">Delete</button><span class="tt-box">Are you sure?</span></div>
<div class="tt-wrap"><button class="tt-btn" style="background:#64748b;">Info</button><span class="tt-box">More information here</span></div>
</div></body></html>
