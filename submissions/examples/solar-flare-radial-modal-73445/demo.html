<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solar Flare Radial Modal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <button class="open-modal" onclick="document.getElementById('solar-modal').showModal()">
      Open Solar Flare Modal
    </button>
  </main>

  <dialog id="solar-modal" class="solar-modal" aria-labelledby="modal-title">
    <div class="modal-content">
      <div class="solar-orb" aria-hidden="true"></div>

      <button
        class="close-modal"
        type="button"
        aria-label="Close modal"
        onclick="this.closest('dialog').close()"
      >
        &times;
      </button>

      <div class="modal-icon" aria-hidden="true">☀</div>

      <h1 id="modal-title">Solar Flare</h1>

      <p>
        A radial glow-inspired modal with smooth transitions and a warm
        solar-flare visual effect.
      </p>

      <button
        class="modal-action"
        type="button"
        onclick="this.closest('dialog').close()"
      >
        Continue
      </button>
    </div>
  </dialog>
</body>
</html>
