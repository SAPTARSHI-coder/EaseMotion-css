<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stellar Core-Collapse Supernova - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #050302; color: #ffffff;">

    <div class="ease-card ease-card-glass supernova-container">
        <div class="supernova-header">
            <h2>Supernova Core</h2>
            <span class="ease-badge ease-badge-danger">Type II</span>
        </div>
        
        <div class="supernova-screen ease-center">
            <div class="ejecta-shell shell-1"></div>
            <div class="ejecta-shell shell-2"></div>
            <div class="shockwave-ring"></div>
            <div class="stellar-remnant-core ease-center"></div>
        </div>

        <div class="supernova-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Magnitude: -19.5</span>
            <button class="ease-btn ease-btn-primary ease-btn-sm ease-hover-grow">Trigger Detonation</button>
        </div>
    </div>

</body>
</html>
