<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Rotating Planet Progress</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="planet-progress-container" role="progressbar" aria-valuenow="50" aria-valuemin="0" aria-valuemax="100" aria-label="Loading progress">
    <div class="planet-progress">
      <div class="planet">
        <div class="eclipse-shadow"></div>
      </div>
      <div class="planet-ring"></div>
    </div>
  </div>
</body>
</html>
