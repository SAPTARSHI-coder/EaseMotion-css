<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ripple Wave Toast</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="wrapper">

        <h1>CSS Ripple-Wave Toast</h1>
        <p>Animated notification component for product layouts</p>


        <div class="toast">

            <div class="ripple"></div>

            <div class="icon">
                ✓
            </div>


            <div class="message">

                <h2>
                    Order Confirmed
                </h2>

                <span>
                    Your product has been added successfully.
                </span>

            </div>

        </div>


    </main>


</body>
</html>
