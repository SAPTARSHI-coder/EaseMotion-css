<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shaduf Counterpoise — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Shaduf Counterpoise demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Shaduf Counterpoise</h1>
      <p class="lede">Shaduf counterpoise well sweep lift</p>
    </header>

    <section class="ease-shaduf-counterpoise" data-demo="shaduf-counterpoise" aria-live="polite">
      <div class="ease-shaduf-counterpoise__housing">
        <div class="ease-shaduf-counterpoise__bezel">
          <div class="ease-shaduf-counterpoise__face">
            <div class="ease-shaduf-counterpoise__readout">
              <span class="ease-shaduf-counterpoise__label">Shaduf Counterpoise</span>
              <span class="ease-shaduf-counterpoise__value">LIVE</span>
            </div>
            <div class="ease-shaduf-counterpoise__motion" aria-hidden="true">
              <span class="ease-shaduf-counterpoise__a"></span>
              <span class="ease-shaduf-counterpoise__b"></span>
              <span class="ease-shaduf-counterpoise__c"></span>
              <span class="ease-shaduf-counterpoise__d"></span>
            </div>
            <div class="ease-shaduf-counterpoise__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-shaduf-counterpoise__controls">
          <button type="button" class="ease-shaduf-counterpoise__btn primary">Engage</button>
          <button type="button" class="ease-shaduf-counterpoise__btn">Reset</button>
          <label class="ease-shaduf-counterpoise__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-shaduf-counterpoise__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
