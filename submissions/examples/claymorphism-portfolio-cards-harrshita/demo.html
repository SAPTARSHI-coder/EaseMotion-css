<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Claymorphism Portfolio Cards — EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="portfolio-container">
    <h1 class="portfolio-title">3D Character Showcase</h1>
    <div class="cards-wrapper">
      <div class="avatar-card theme-olive">
        <div class="window-header">
          <span class="character-title">Coraline</span>
          <div class="window-dots">
            <span class="window-dot dot-purple"></span>
            <span class="window-dot dot-yellow"></span>
            <span class="window-dot dot-green"></span>
          </div>
        </div>
        <div class="card-viewport">
          <div class="placeholder-viewer">🧸 3D Model Viewer</div>
        </div>
      </div>
      <div class="avatar-card theme-yellow">
        <div class="window-header">
          <span class="character-title">Elsa</span>
          <div class="window-dots">
            <span class="window-dot dot-purple"></span>
            <span class="window-dot dot-yellow"></span>
            <span class="window-dot dot-green"></span>
          </div>
        </div>
        <div class="card-viewport">
          <div class="placeholder-viewer">❄️ 3D Model Viewer</div>
        </div>
      </div>
      <div class="avatar-card theme-purple">
        <div class="window-header">
          <span class="character-title">Nova</span>
          <div class="window-dots">
            <span class="window-dot dot-purple"></span>
            <span class="window-dot dot-yellow"></span>
            <span class="window-dot dot-green"></span>
          </div>
        </div>
        <div class="card-viewport">
          <div class="placeholder-viewer">🚀 3D Model Viewer</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
