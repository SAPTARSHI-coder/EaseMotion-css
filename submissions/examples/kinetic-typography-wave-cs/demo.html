<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kinetic Typography Wave</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="page">
        <section class="hero" aria-labelledby="kinetic-title">
            <p class="eyebrow">CSS Motion Study</p>

            <h1 id="kinetic-title" class="kinetic-title" aria-label="Move with the rhythm">
                <span aria-hidden="true">
                    <span class="char" style="--i: 0">M</span>
                    <span class="char" style="--i: 1">o</span>
                    <span class="char" style="--i: 2">v</span>
                    <span class="char" style="--i: 3">e</span>
                    <span class="char space" style="--i: 4">&nbsp;</span>
                    <span class="char" style="--i: 5">w</span>
                    <span class="char" style="--i: 6">i</span>
                    <span class="char" style="--i: 7">t</span>
                    <span class="char" style="--i: 8">h</span>
                    <span class="char space" style="--i: 9">&nbsp;</span>
                    <span class="char" style="--i: 10">t</span>
                    <span class="char" style="--i: 11">h</span>
                    <span class="char" style="--i: 12">e</span>
                    <span class="char space" style="--i: 13">&nbsp;</span>
                    <span class="char" style="--i: 14">r</span>
                    <span class="char" style="--i: 15">h</span>
                    <span class="char" style="--i: 16">y</span>
                    <span class="char" style="--i: 17">t</span>
                    <span class="char" style="--i: 18">h</span>
                    <span class="char" style="--i: 19">m</span>
                </span>
            </h1>

            <p class="description">
                Individual characters move through a continuous CSS-powered wave
                using staggered animation delays.
            </p>
        </section>
    </main>
</body>

</html>
