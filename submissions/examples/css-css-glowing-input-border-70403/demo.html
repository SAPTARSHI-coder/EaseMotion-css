<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Glowing Input Border - EaseMotion</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <form
      class="gib"
      aria-label="Glowing input border"
      onsubmit="return false;"
    >
      <label class="gib-field"
        >Search<input
          type="text"
          class="gib-input"
          placeholder="Type to focus glow"
      /></label>
    </form>
  </body>
</html>
