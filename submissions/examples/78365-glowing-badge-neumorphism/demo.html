<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />
  <meta
    name="description"
    content="Glowing badge with a responsive neumorphic design built using HTML and CSS."
  />
  <title>Glowing Neumorphic Badge</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main class="demo">
    <section class="badge-showcase" aria-labelledby="badge-title">
      <span class="showcase-label">EASEMOTION CSS</span>

      <h1 id="badge-title">
        Glowing Neumorphic Badges
      </h1>

      <p class="showcase-description">
        Soft depth, subtle glow, and responsive interaction created
        entirely with HTML and CSS.
      </p>

      <div class="badges" aria-label="Badge examples">
        <div class="badge-card">
          <span class="badge badge--blue">
            <span class="badge__dot"></span>
            Featured
          </span>

          <span class="badge-card__label">Featured badge</span>
        </div>

        <div class="badge-card">
          <span class="badge badge--green">
            <span class="badge__dot"></span>
            Online
          </span>

          <span class="badge-card__label">Status badge</span>
        </div>

        <div class="badge-card">
          <span class="badge badge--purple">
            <span class="badge__dot"></span>
            Pro
          </span>

          <span class="badge-card__label">Premium badge</span>
        </div>

        <div class="badge-card">
          <span class="badge badge--orange">
            <span class="badge__dot"></span>
            New
          </span>

          <span class="badge-card__label">Announcement badge</span>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
