<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dart Popover Component - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="popover-showcase">
    <h1>Dart Popover Component (<code>#54756</code>)</h1>
    <p>Hover or focus the interactive trigger to dart the directional popover outward with elastic spring velocity.</p>
    
    <div class="center-stage">
      <div class="ease-popover-group">
        <button class="trigger-btn">Hover for Quick Specs ⚡</button>
        <div class="ease-dart-popover">
          <div class="arrow"></div>
          <h4>Houdini Spring Physics</h4>
          <p>Utilizes ultra-snappy <code>cubic-bezier(0.34, 1.56, 0.64, 1)</code> trajectories for immediate tactical feedback.</p>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
