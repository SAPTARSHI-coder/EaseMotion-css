<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Phone Number Input | EaseMotion CSS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="form-card" tabindex="0" aria-label="Phone Number Input Form">
    <h1 class="form-title">Contact Information</h1>
    <p class="form-subtitle">Enter your mobile phone number to receive verification updates.</p>
    
    <div class="input-group">
        <label for="phone" class="input-label">Phone Number</label>
        <div class="phone-input-wrapper">
            <select class="country-select" aria-label="Country Code">
                <option value="+1">🇺🇸 +1</option>
                <option value="+44">🇬🇧 +44</option>
                <option value="+91" selected>🇮🇳 +91</option>
                <option value="+61">🇦🇺 +61</option>
            </select>
            <input type="tel" id="phone" class="phone-number-field" placeholder="555 019 2834" autocomplete="tel">
        </div>
    </div>

    <button type="button" class="submit-btn">Continue</button>
</main>

</body>
</html>
