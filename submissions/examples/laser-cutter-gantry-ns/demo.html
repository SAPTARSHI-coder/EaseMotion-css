<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laser Cutter Gantry — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Laser Cutter Gantry demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Laser Cutter Gantry</h1>
      <p class="lede">Laser cutter gantry tracing a cut path with beam glow</p>
    </header>

    <section class="ease-laser-cutter-gantry" data-demo="laser-cutter-gantry" aria-live="polite">
      <div class="ease-laser-cutter-gantry__housing">
        <div class="ease-laser-cutter-gantry__bezel">
          <div class="ease-laser-cutter-gantry__face">
            <div class="ease-laser-cutter-gantry__readout">
              <span class="ease-laser-cutter-gantry__label">Laser Cutter Gantry</span>
              <span class="ease-laser-cutter-gantry__value" id="val-laser-cutter-gantry">READY</span>
            </div>
            <div class="ease-laser-cutter-gantry__motion" aria-hidden="true">
              <span class="ease-laser-cutter-gantry__arm"></span>
              <span class="ease-laser-cutter-gantry__core"></span>
              <span class="ease-laser-cutter-gantry__trail"></span>
              <span class="ease-laser-cutter-gantry__mark m1"></span>
              <span class="ease-laser-cutter-gantry__mark m2"></span>
              <span class="ease-laser-cutter-gantry__mark m3"></span>
            </div>
            <div class="ease-laser-cutter-gantry__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-laser-cutter-gantry__controls">
          <button type="button" class="ease-laser-cutter-gantry__btn primary">Engage</button>
          <button type="button" class="ease-laser-cutter-gantry__btn">Reset</button>
          <label class="ease-laser-cutter-gantry__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-laser-cutter-gantry__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
