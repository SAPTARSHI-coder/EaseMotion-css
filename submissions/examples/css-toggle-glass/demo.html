<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Toggle: Responsive Glassmorphism Styling - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="em-demo-container">
        <!-- Pure CSS Responsive Toggle Component Showcase -->
        <header class="em-toggle-card" role="region" aria-label="Glassmorphism Toggle Showcase" tabindex="0">
            <div class="em-toggle-header-bar">
                <span class="em-card-badge">COMPONENT VARIANT</span>
                <span class="em-brand-logo">GlassToggle</span>
            </div>
            <h1 class="em-card-title">Responsive Toggle</h1>
            <p class="em-card-desc">A fully responsive, zero-JS pure CSS switch toggle featuring frosted glassmorphism styling, smooth sliding thumb transitions, and accessible focus states.</p>
            <div class="em-toggle-wrapper">
                <label class="em-glass-switch" role="button" aria-label="Interactive Toggle Switch">
                    <input type="checkbox" class="em-toggle-input" checked aria-hidden="true">
                    <span class="em-toggle-slider"></span>
                    <span class="em-toggle-label-text">Enable Glass Motion</span>
                </label>
            </div>
        </header>
    </div>
</body>
</html>
