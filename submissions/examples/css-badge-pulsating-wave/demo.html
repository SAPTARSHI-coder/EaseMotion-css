<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Badge: Pulsating Wave Variation - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="em-demo-container">
        <!-- Pure CSS Pulsating Wave Badge Component Showcase -->
        <header class="em-badge-card" role="region" aria-label="Pulsating Wave Badge Showcase" tabindex="0">
            <div class="em-badge-header-bar">
                <span class="em-card-badge">BADGES & CHIPS</span>
                <span class="em-brand-logo">WaveMotion</span>
            </div>
            <h1 class="em-card-title">Pulsating Wave Badge</h1>
            <p class="em-card-desc">A smooth, accessible, and performant pure CSS badge featuring a continuous pulsating wave radar effect and frosted glassmorphism styling.</p>
            <div class="em-badge-wrapper">
                <div class="em-pulsing-badge" aria-label="Live broadcast status">
                    <span class="em-pulse-dot"></span>
                    <span class="em-badge-text">LIVE STREAM</span>
                </div>
            </div>
        </header>
    </div>
</body>
</html>
