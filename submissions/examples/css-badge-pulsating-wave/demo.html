<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Accessible CSS pulsating wave badge and chip components."
  >
  <title>Pulsating Wave Badges</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="demo">
    <section class="badge-showcase" aria-labelledby="demo-title">
      <p class="demo-label">EaseMotion CSS</p>
      <h1 id="demo-title">Pulsating Wave Badges</h1>
      <p class="demo-description">
        Lightweight badges with a smooth CSS wave effect that radiates
        around the component without JavaScript.
      </p>

      <div class="badge-group" aria-label="Badge examples">
        <span class="wave-badge wave-badge--blue">
          <span class="wave-badge__dot" aria-hidden="true"></span>
          Active
        </span>

        <span class="wave-badge wave-badge--green">
          <span class="wave-badge__dot" aria-hidden="true"></span>
          Available
        </span>

        <span class="wave-badge wave-badge--purple">
          <span class="wave-badge__dot" aria-hidden="true"></span>
          Featured
        </span>

        <span class="wave-badge wave-badge--orange">
          <span class="wave-badge__dot" aria-hidden="true"></span>
          Trending
        </span>
      </div>
    </section>
  </main>
</body>
</html>
