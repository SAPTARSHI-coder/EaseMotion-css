<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Slide-Up Modal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<input type="checkbox" id="modal-toggle" hidden>

<section class="hero">

    <h1>Gaming Hub</h1>

    <p>
        Experience a sleek Slide-Up Modal built using only HTML and CSS.
    </p>

    <label for="modal-toggle" class="open-btn">
        Open Mission
    </label>

</section>

<div class="overlay">

    <div class="modal">

        <label for="modal-toggle" class="close-btn">&times;</label>

        <div class="icon">🚀</div>

        <h2>Mission Ready!</h2>

        <p>
            Your squad is assembled. Prepare for the next epic multiplayer adventure.
        </p>

        <label for="modal-toggle" class="action-btn">
            Start Mission
        </label>

    </div>

</div>

</body>
</html>
