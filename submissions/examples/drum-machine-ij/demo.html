<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-drum-machine</title>
</head>
<body>
<main class="drm-card">
  <header class="drm-head">
    <h1 class="drm-title">BeatBox</h1>
    <span class="drm-bpm">120 BPM</span>
  </header>
  <section class="drm-display" aria-label="drum display">
    <strong class="drm-now">KICK</strong>
    <span class="drm-step">step 5 / 16</span>
  </section>
  <section class="drm-pads" aria-label="drum pads">
    <span class="drm-pad drm-pad-1">K</span>
    <span class="drm-pad drm-pad-2">S</span>
    <span class="drm-pad drm-pad-3">H</span>
    <span class="drm-pad drm-pad-4">C</span>
  </section>
  <section class="drm-seq" aria-label="step sequencer">
    <span class="drm-lite"></span>
    <span class="drm-lite drm-lite-on"></span>
    <span class="drm-lite"></span>
    <span class="drm-lite"></span>
    <span class="drm-lite"></span>
    <span class="drm-lite drm-lite-on"></span>
    <span class="drm-lite"></span>
    <span class="drm-lite"></span>
  </section>
  <section class="drm-mix" aria-label="faders">
    <span class="drm-fader drm-fader-1"></span>
    <span class="drm-fader drm-fader-2"></span>
    <span class="drm-fader drm-fader-3"></span>
    <span class="drm-fader drm-fader-4"></span>
  </section>
  <footer class="drm-foot">
    <span class="drm-rec">REC</span>
    <span class="drm-mute">MUTE</span>
  </footer>
</main>
</body>
</html>
