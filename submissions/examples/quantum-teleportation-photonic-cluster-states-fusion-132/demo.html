<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photonic Cluster States Fusion - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css"></head><body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030712; color: #ffffff;">

    <div class="ease-card ease-card-glass photon-container">
        <div class="photon-header">
            <h2>Photonic Cluster States</h2>
            <span class="ease-badge ease-badge-success">Measurement-Based QC</span>
        </div>
        
        <div class="photon-screen ease-center">
            <div class="photon-flux flux-photon-a"></div>
            <div class="photon-flux flux-photon-b"></div>
            <div class="photon-boundary-ring"></div>
            <div class="photon-core ease-center"></div>
        </div>

        <div class="photon-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Type-II Fusion Gates &amp; Entangled Lattices</span>
            <button class="ease-btn ease-btn-success ease-btn-sm ease-hover-grow">Run Photonic Fusion</button>
        </div>
    </div></body></html>
