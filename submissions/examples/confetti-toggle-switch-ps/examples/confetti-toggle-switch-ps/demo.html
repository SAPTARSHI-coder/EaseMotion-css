<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Celebration Toggle</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="celebration-theme">
    <div class="toggle-container">
        <p class="toggle-heading">Party Mode</p>
        
        <div class="party-switch">
            <input type="checkbox" id="party-trigger" class="native-input">
            <label for="party-trigger" class="custom-track">
                <span class="custom-knob">
                    <!-- Unique confetti particles with distinct vector paths -->
                    <i class="burst-dot" style="--angle: 0deg; --dist: 45px; --color: #ff0055;"></i>
                    <i class="burst-dot" style="--angle: 45deg; --dist: 50px; --color: #00ffcc;"></i>
                    <i class="burst-dot" style="--angle: 90deg; --dist: 45px; --color: #ffcc00;"></i>
                    <i class="burst-dot" style="--angle: 135deg; --dist: 50px; --color: #9900ff;"></i>
                    <i class="burst-dot" style="--angle: 180deg; --dist: 45px; --color: #ff6600;"></i>
                    <i class="burst-dot" style="--angle: 225deg; --dist: 50px; --color: #33ff00;"></i>
                    <i class="burst-dot" style="--angle: 270deg; --dist: 45px; --color: #0066ff;"></i>
                    <i class="burst-dot" style="--angle: 315deg; --dist: 50px; --color: #ff00aa;"></i>
                </span>
            </label>
        </div>
    </div>
</body>
</html>
