<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confetti Toggle Switch - EaseMotion CSS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="preview-container">
        <!-- Dark Mode Toggle Card -->
        <div class="toggle-card">
            <h2 class="card-title">Enable Celebrations</h2>
            <p class="card-subtitle">Flip to toggle dark mode celebrations</p>
            
            <!-- The Confetti Toggle Component Wrapper -->
            <div class="toggle-wrapper">
                <input type="checkbox" id="confetti-toggle" class="confetti-checkbox">
                <label for="confetti-toggle" class="toggle-track">
                    <div class="toggle-thumb">
                        <!-- Individual CSS Confetti Particles -->
                        <span class="particle" style="--tx: -35px; --ty: -35px; --bg: #ff007f; --delay: 0s;"></span>
                        <span class="particle" style="--tx: 0px; --ty: -50px; --bg: #00f0ff; --delay: 0.05s;"></span>
                        <span class="particle" style="--tx: 35px; --ty: -35px; --bg: #ffeb3b; --delay: 0.02s;"></span>
                        <span class="particle" style="--tx: 45px; --ty: 0px; --bg: #9c27b0; --delay: 0.08s;"></span>
                        <span class="particle" style="--tx: 35px; --ty: 35px; --bg: #4caf50; --delay: 0.04s;"></span>
                        <span class="particle" style="--tx: 0px; --ty: 45px; --bg: #ff5722; --delay: 0.06s;"></span>
                        <span class="particle" style="--tx: -35px; --ty: 35px; --bg: #e91e63; --delay: 0.01s;"></span>
                        <span class="particle" style="--tx: -45px; --ty: 0px; --bg: #00e676; --delay: 0.07s;"></span>
                    </div>
                </label>
            </div>
        </div>
    </main>
</body>
</html>
