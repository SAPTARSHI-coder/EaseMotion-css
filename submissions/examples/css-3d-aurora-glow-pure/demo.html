<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 3D Effect: Aurora Glow</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="layout-container">
        
        <header class="section-header">
            <h1 class="title">Pure CSS 3D: Aurora Glow</h1>
            <p class="subtitle">A hardware-accelerated, JavaScript-free 3D animation utilizing `transform-style: preserve-3d`. Features multi-layered radial gradients to simulate the Northern Lights.</p>
        </header>

        <div class="demo-area">
            
            <!-- 
              [TECHNIQUE] The 3D Scene
              The wrapper establishes the perspective, allowing child elements
              to be transformed in 3D space.
            -->
            <div class="scene-3d">
                
                <!-- 
                  The primary rotating object. 
                  It uses preserve-3d to ensure its children maintain their 3D positions relative to it.
                -->
                <div class="object-3d">
                    
                    <!-- 
                      Layer 1: The Core Card
                      A glassmorphism card floating in the center.
                    -->
                    <div class="card-face">
                        <div class="icon-aurora">
                            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M12 2v20"></path>
                                <path d="m4.22 19.78 15.56-15.56"></path>
                                <path d="M2 12h20"></path>
                                <path d="m4.22 4.22 15.56 15.56"></path>
                            </svg>
                        </div>
                        <h2 class="card-title">Aethelgard</h2>
                        <p class="card-text">Atmospheric phenomenon.</p>
                    </div>
                    
                    <!-- 
                      Layer 2 & 3: The Aurora Glows
                      These are absolutely positioned behind the card, translated along the Z-axis,
                      and animated with intense blur filters and shifting gradients.
                    -->
                    <div class="aurora-layer aurora-1" aria-hidden="true"></div>
                    <div class="aurora-layer aurora-2" aria-hidden="true"></div>
                    
                    <!-- 
                      Layer 4: The 3D Shadow
                      Projected far below the object on the Y and Z axes to ground it in space.
                    -->
                    <div class="shadow-3d" aria-hidden="true"></div>
                    
                </div>
                
            </div>
            
        </div>
        
    </div>

</body>
</html>
