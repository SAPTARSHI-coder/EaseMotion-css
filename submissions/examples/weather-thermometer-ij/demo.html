<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-weather-thermometer demo</title>
</head>
<body>
<div class="wt-app">
  <span class="wt-title">OUTSIDE</span>
  <div class="wt-thermo">
    <div class="wt-tube">
      <span class="wt-mercury"></span>
    </div>
    <div class="wt-scale">
      <span class="wt-mark">30</span>
      <span class="wt-mark">60</span>
      <span class="wt-mark">90</span>
    </div>
  </div>
  <span class="wt-reading">72&deg;F</span>
  <span class="wt-cond">Partly cloudy</span>
</div>
</body>
</html>
