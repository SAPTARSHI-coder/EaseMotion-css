<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Cyberpunk infinite seamless logo carousel with pause on hover."
    >

    <title>Cyberpunk Logo Carousel</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="page">
        <section class="carousel-section" aria-labelledby="carousel-title">

            <div class="section-header">
                <span class="eyebrow">SYSTEM // 162</span>

                <h1 id="carousel-title">
                    Infinite Logo Network
                </h1>

                <p>
                    A seamless cyberpunk logo carousel with
                    pause-on-hover interaction.
                </p>
            </div>

            <div class="carousel" aria-label="Technology partners">
                <div class="carousel-track">

                    <div class="logo-card">
                        <span class="logo-symbol">◆</span>
                        <span>NEON</span>
                    </div>

                    <div class="logo-card">
                        <span class="logo-symbol">◈</span>
                        <span>NEXUS</span>
                    </div>

                    <div class="logo-card">
                        <span class="logo-symbol">⬢</span>
                        <span>CYBER</span>
                    </div>

                    <div class="logo-card">
                        <span class="logo-symbol">✦</span>
                        <span>QUANTUM</span>
                    </div>

                    <div class="logo-card">
                        <span class="logo-symbol">⬡</span>
                        <span>VOID</span>
                    </div>

                    <div class="logo-card">
                        <span class="logo-symbol">◇</span>
                        <span>PULSE</span>
                    </div>

                    <!-- Duplicate set for seamless looping -->

                    <div class="logo-card" aria-hidden="true">
                        <span class="logo-symbol">◆</span>
                        <span>NEON</span>
                    </div>

                    <div class="logo-card" aria-hidden="true">
                        <span class="logo-symbol">◈</span>
                        <span>NEXUS</span>
                    </div>

                    <div class="logo-card" aria-hidden="true">
                        <span class="logo-symbol">⬢</span>
                        <span>CYBER</span>
                    </div>

                    <div class="logo-card" aria-hidden="true">
                        <span class="logo-symbol">✦</span>
                        <span>QUANTUM</span>
                    </div>

                    <div class="logo-card" aria-hidden="true">
                        <span class="logo-symbol">⬡</span>
                        <span>VOID</span>
                    </div>

                    <div class="logo-card" aria-hidden="true">
                        <span class="logo-symbol">◇</span>
                        <span>PULSE</span>
                    </div>

                </div>
            </div>

            <div class="status">
                <span class="status-dot"></span>
                <span>HOVER TO PAUSE</span>
            </div>

        </section>
    </main>

</body>
</html>
