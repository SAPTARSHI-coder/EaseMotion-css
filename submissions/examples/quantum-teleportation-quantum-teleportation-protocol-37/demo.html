<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Teleportation Protocol - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css"></head><body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030712; color: #ffffff;">

    <div class="ease-card ease-card-glass qtel-container">
        <div class="qtel-header">
            <h2>Quantum Teleportation</h2>
            <span class="ease-badge ease-badge-primary">Teleporting</span>
        </div>
        
        <div class="qtel-screen ease-center">
            <div class="qtel-flux flux-qtel-a"></div>
            <div class="qtel-flux flux-qtel-b"></div>
            <div class="qtel-boundary-ring"></div>
            <div class="qtel-core ease-center"></div>
        </div>

        <div class="qtel-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Bell State Measurement &amp; Classical Bits</span>
            <button class="ease-btn ease-btn-primary ease-btn-sm ease-hover-grow">Execute Teleportation</button>
        </div>
    </div></body></html>
