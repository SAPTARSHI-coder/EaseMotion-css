<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Animated Gradient Slider</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="page">
    <section class="slider-card" aria-labelledby="slider-title">
      <div class="card-header">
        <div>
          <span class="eyebrow">EASEMOTION</span>
          <h1 id="slider-title">Animated Gradient Slider</h1>
          <p>
            A responsive range slider with a smooth animated gradient,
            glowing thumb and clean modern interface.
          </p>
        </div>

        <div class="value-badge" aria-live="polite">
          <span id="sliderValue">65</span>%
        </div>
      </div>

      <div class="slider-area">
        <label for="gradientSlider" class="slider-label">
          Gradient intensity
        </label>

        <div class="slider-wrapper">
          <input
            id="gradientSlider"
            class="gradient-slider"
            type="range"
            min="0"
            max="100"
            value="65"
            aria-label="Gradient intensity"
          >
        </div>

        <div class="range-values" aria-hidden="true">
          <span>0%</span>
          <span>25%</span>
          <span>50%</span>
          <span>75%</span>
          <span>100%</span>
        </div>
      </div>

      <div class="preview">
        <div class="preview-glow"></div>

        <div class="preview-content">
          <span class="preview-label">CURRENT VALUE</span>
          <strong id="previewValue">65%</strong>
          <span class="preview-text">
            Drag the slider to animate the gradient.
          </span>
        </div>
      </div>
    </section>
  </main>

  <script>
    const slider = document.getElementById("gradientSlider");
    const sliderValue = document.getElementById("sliderValue");
    const previewValue = document.getElementById("previewValue");

    function updateSlider() {
      const value = slider.value;

      slider.style.setProperty("--value", `${value}%`);

      sliderValue.textContent = value;
      previewValue.textContent = `${value}%`;
    }

    slider.addEventListener("input", updateSlider);

    updateSlider();
  </script>
</body>
</html>
