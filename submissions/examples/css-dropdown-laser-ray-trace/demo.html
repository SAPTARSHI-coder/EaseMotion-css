<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Dropdown: Laser Ray Trace - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="em-dropdown-page">
        <!-- Pure CSS Dropdown Component -->
        <div class="em-dropdown" tabindex="0">
            <button class="em-dropdown-trigger" aria-haspopup="true" aria-expanded="false">
                Dropdown Menu
                <svg class="em-chevron" viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
            </button>
            
            <div class="em-dropdown-menu" role="menu">
                <span class="em-menu-header">DROPDOWNS & MENUS</span>
                <a href="#" class="em-dropdown-item" role="menuitem">
                    <strong>Laser Ray Trace I</strong>
                    <span>Glowing neon borders</span>
                </a>
                <a href="#" class="em-dropdown-item" role="menuitem">
                    <strong>Laser Ray Trace II</strong>
                    <span>Hardware accelerated</span>
                </a>
                <a href="#" class="em-dropdown-item" role="menuitem">
                    <strong>Laser Ray Trace III</strong>
                    <span>Zero JavaScript required</span>
                </a>
            </div>
        </div>
    </div>
</body>
</html>
