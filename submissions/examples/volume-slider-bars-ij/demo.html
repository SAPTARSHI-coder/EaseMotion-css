<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-volume-slider-bars demo</title>
</head>
<body>
<div class="vs-app">
  <span class="vs-title">VOLUME</span>
  <div class="vs-bars">
    <span class="vs-bar vs-bar-1"></span>
    <span class="vs-bar vs-bar-2"></span>
    <span class="vs-bar vs-bar-3"></span>
    <span class="vs-bar vs-bar-4"></span>
    <span class="vs-bar vs-bar-5"></span>
    <span class="vs-bar vs-bar-6"></span>
    <span class="vs-bar vs-bar-7"></span>
    <span class="vs-bar vs-bar-8"></span>
  </div>
  <input type="range" class="vs-slider" min="0" max="100" value="62">
  <span class="vs-level">62%</span>
</div>
</body>
</html>
