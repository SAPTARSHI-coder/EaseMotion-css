<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CSS Morph-Glow Progress Bar | EaseMotion</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<main class="container">

<section class="dashboard">

<span class="badge">
Fintech Dashboard
</span>

<h1>
Financial
<span>Progress Tracker</span>
</h1>

<p class="subtitle">
A morph-glow progress bar animation built using pure HTML and CSS.
</p>


<div class="progress-card">

<div class="progress-header">

<h2>
Investment Growth
</h2>

<span>
78%
</span>

</div>


<div class="progress">

<div class="progress-fill"></div>

</div>


<div class="stats">

<div>
<strong>$78K</strong>
<p>Current</p>
</div>

<div>
<strong>$100K</strong>
<p>Target</p>
</div>

</div>


</div>


<div class="progress-card">

<div class="progress-header">

<h2>
Revenue Goal
</h2>

<span>
92%
</span>

</div>


<div class="progress">

<div class="progress-fill second"></div>

</div>


</div>


</section>

</main>

</body>

</html>
