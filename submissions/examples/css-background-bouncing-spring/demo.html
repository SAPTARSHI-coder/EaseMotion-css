<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Background: Bouncing Spring - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="em-spring-page">
        <!-- Background Bouncing Spring Animation Layer -->
        <div class="em-spring-bg" aria-hidden="true">
            <span class="em-spring-dot" style="--x:-140px; --d:0s;"></span>
            <span class="em-spring-dot" style="--x:-70px; --d:0.4s;"></span>
            <span class="em-spring-dot" style="--x:0px; --d:0.8s;"></span>
            <span class="em-spring-dot" style="--x:70px; --d:1.2s;"></span>
            <span class="em-spring-dot" style="--x:140px; --d:1.6s;"></span>
        </div>

        <div class="em-card" role="region" aria-label="Bouncing Spring Background Showcase" tabindex="0">
            <span class="em-card-badge">BACKGROUND ANIMATIONS</span>
            <h1 class="em-card-title">Bouncing Spring</h1>
            <p class="em-card-desc">A smooth, hardware-accelerated pure CSS background animation featuring dynamic bouncing spring styling and dark mode compatibility.</p>
            <a href="#" class="em-card-btn" role="button">Explore Effects</a>
        </div>
    </div>
</body>
</html>
