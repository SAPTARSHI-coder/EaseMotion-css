<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Responsive floating breadcrumb with neumorphism styling"
  >

  <title>Floating Neumorphic Breadcrumb</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="page">
    <section
      class="breadcrumb-section"
      aria-labelledby="breadcrumb-title"
    >
      <span class="eyebrow">EASEMOTION CSS</span>

      <h1 id="breadcrumb-title">
        Floating Breadcrumb
      </h1>

      <p class="description">
        A soft neumorphic breadcrumb component with responsive layout,
        interactive states, and accessible keyboard navigation.
      </p>

      <nav
        class="breadcrumb"
        aria-label="Breadcrumb"
      >
        <a href="#home" class="crumb">
          <span class="icon" aria-hidden="true">⌂</span>
          <span>Home</span>
        </a>

        <span
          class="separator"
          aria-hidden="true"
        >
          /
        </span>

        <a href="#projects" class="crumb">
          <span class="icon" aria-hidden="true">◆</span>
          <span>Projects</span>
        </a>

        <span
          class="separator"
          aria-hidden="true"
        >
          /
        </span>

        <a
          href="#components"
          class="crumb"
        >
          <span class="icon" aria-hidden="true">▣</span>
          <span>Components</span>
        </a>

        <span
          class="separator"
          aria-hidden="true"
        >
          /
        </span>

        <span
          class="crumb current"
          aria-current="page"
        >
          <span class="icon" aria-hidden="true">●</span>
          <span>Breadcrumb</span>
        </span>
      </nav>

      <div class="current-location">
        <span class="status-dot" aria-hidden="true"></span>
        <span>
          Current page:
          <strong>Breadcrumb</strong>
        </span>
      </div>
    </section>
  </main>
</body>
</html>
