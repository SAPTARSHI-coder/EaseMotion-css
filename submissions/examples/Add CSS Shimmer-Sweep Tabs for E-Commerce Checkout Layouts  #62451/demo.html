<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Shimmer-Sweep Tabs - EaseMotion Checkout</title>
  <link rel="stylesheet" href="style.css">
  <!-- Include Google Font for premium look -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="checkout-container">
    <div class="checkout-header">
      <h1>Checkout</h1>
      <p>Complete your purchase securely.</p>
    </div>

    <!-- The Tabs Structure (Pure CSS using Radio Inputs) -->
    <div class="tabs">
      <input type="radio" id="tab1" name="tab-control" checked>
      <input type="radio" id="tab2" name="tab-control">
      <input type="radio" id="tab3" name="tab-control">

      <div class="tab-labels">
        <!-- The Pill Indicator that slides -->
        <div class="active-indicator"></div>
        
        <div class="tab-label">
          <label for="tab1">
            <span class="step-icon">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true"><rect x="1" y="3" width="15" height="13"></rect><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"></polygon><circle cx="5.5" cy="18.5" r="2.5"></circle><circle cx="18.5" cy="18.5" r="2.5"></circle></svg>
            </span>
            Shipping
          </label>
        </div>
        
        <div class="tab-label">
          <label for="tab2">
            <span class="step-icon">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect><line x1="1" y1="10" x2="23" y2="10"></line></svg>
            </span>
            Payment
          </label>
        </div>
        
        <div class="tab-label">
          <label for="tab3">
            <span class="step-icon">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
            </span>
            Review
          </label>
        </div>
      </div>

      <div class="content">
        <!-- Section 1: Shipping -->
        <div class="content-section">
          <h2>Shipping Address</h2>
          <div class="checkout-form">
            <div class="mock-row">
              <div class="mock-input-group">
                <label>First Name</label>
                <input type="text" placeholder="Jane" class="real-input">
              </div>
              <div class="mock-input-group">
                <label>Last Name</label>
                <input type="text" placeholder="Doe" class="real-input">
              </div>
            </div>
            <div class="mock-input-group">
              <label>Address</label>
              <input type="text" placeholder="123 Checkout St" class="real-input">
            </div>
            <div class="mock-row">
              <div class="mock-input-group" style="flex: 2;">
                <label>City</label>
                <input type="text" placeholder="San Francisco" class="real-input">
              </div>
              <div class="mock-input-group" style="flex: 1;">
                <label>Zip Code</label>
                <input type="text" placeholder="94103" class="real-input">
              </div>
            </div>
            <!-- Label acting as a button to advance to the next tab -->
            <label for="tab2" class="primary-btn text-center">Continue to Payment</label>
          </div>
        </div>

        <!-- Section 2: Payment -->
        <div class="content-section">
          <h2>Payment Details</h2>
          <div class="checkout-form">
            <div class="payment-methods">
              <div class="payment-method active">
                Credit Card
              </div>
              <div class="payment-method">
                PayPal
              </div>
              <div class="payment-method">
                Apple Pay
              </div>
            </div>
            <div class="mock-input-group">
              <label>Card Number</label>
              <input type="text" placeholder="0000 0000 0000 0000" class="real-input">
            </div>
            <div class="mock-row">
              <div class="mock-input-group">
                <label>Expiry Date</label>
                <input type="text" placeholder="MM/YY" class="real-input">
              </div>
              <div class="mock-input-group">
                <label>CVC</label>
                <input type="password" placeholder="•••" class="real-input">
              </div>
            </div>
            <label for="tab3" class="primary-btn text-center">Review Order</label>
          </div>
        </div>

        <!-- Section 3: Review -->
        <div class="content-section">
          <h2>Order Review</h2>
          <div class="checkout-form">
            <div class="order-summary">
              <div class="summary-row">
                <span>Subtotal</span>
                <span>$120.00</span>
              </div>
              <div class="summary-row">
                <span>Shipping</span>
                <span>Free</span>
              </div>
              <div class="summary-row">
                <span>Taxes</span>
                <span>$9.60</span>
              </div>
              <hr class="summary-divider">
              <div class="summary-row total">
                <span>Total</span>
                <span>$129.60</span>
              </div>
            </div>
            <button class="primary-btn" onclick="alert('Order Placed Successfully!')">Place Order</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
