<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrix Digital Rain - EaseMotion CSS</title>
    <!-- Include EaseMotion Core Stylesheet -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030712; color: #ffffff;">

    <div class="ease-card ease-card-glass matrix-container">
        <div class="matrix-header">
            <h2>Matrix Terminal</h2>
            <span class="ease-badge ease-badge-success">Decoding</span>
        </div>
        
        <div class="matrix-screen ease-center">
            <div class="matrix-stream">0101010110</div>
            <div class="matrix-stream" style="animation-delay: 1.2s; left: 35%;">1100101010</div>
            <div class="matrix-stream" style="animation-delay: 0.5s; left: 65%;">0011010101</div>
            <div class="matrix-stream" style="animation-delay: 2.1s; left: 85%;">1010110011</div>
        </div>

        <div class="matrix-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Status: Stream Active</span>
            <button class="ease-btn ease-btn-primary ease-btn-sm ease-hover-grow">Reconnect</button>
        </div>
    </div>

</body>
</html>
