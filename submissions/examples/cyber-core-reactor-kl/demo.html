<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Core Reactor - EaseMotion CSS</title>
    <!-- Include EaseMotion Core Stylesheet -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030712; color: #ffffff;">

    <div class="ease-card ease-card-glass reactor-container">
        <div class="reactor-header">
            <h2>Cyber Reactor</h2>
            <span class="ease-badge ease-badge-primary">Stable</span>
        </div>
        
        <div class="reactor-screen ease-center">
            <div class="reactor-ring ring-outer"></div>
            <div class="reactor-ring ring-inner"></div>
            <div class="reactor-core ease-center"></div>
        </div>

        <div class="reactor-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Output: 98.5%</span>
            <button class="ease-btn ease-btn-primary ease-btn-sm ease-hover-grow">Overload</button>
        </div>
    </div>

</body>
</html>
