<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Network Routing - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css"></head><body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030712; color: #ffffff;">

    <div class="ease-card ease-card-glass qnr-container">
        <div class="qnr-header">
            <h2>Quantum Routing</h2>
            <span class="ease-badge ease-badge-primary">Swapping</span>
        </div>
        
        <div class="qnr-screen ease-center">
            <div class="qnr-flux flux-qnr-a"></div>
            <div class="qnr-flux flux-qnr-b"></div>
            <div class="qnr-boundary-ring"></div>
            <div class="qnr-core ease-center"></div>
        </div>

        <div class="qnr-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Entanglement Swapping Node</span>
            <button class="ease-btn ease-btn-primary ease-btn-sm ease-hover-grow">Route Quantum State</button>
        </div>
    </div></body></html>
