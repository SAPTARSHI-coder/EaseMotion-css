<!-- EaseMotion component: calendar-upcoming-events -->
<!DOCTYPE html>
<html lang="en" data-view="month">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3, user-scalable=yes">
<title>Ease Calendar Upcoming Events</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="planner-card">
  <header class="planner-head">
    <div class="month-switch">
      <button class="month-arrow" type="button">prev</button>
      <h2 class="month-title">August 2026</h2>
      <button class="month-arrow" type="button">next</button>
    </div>
    <button class="add-event" type="button">+ New event</button>
  </header>
  <ul class="weekdays">
    <li>Mon</li><li>Tue</li><li>Wed</li><li>Thu</li><li>Fri</li><li>Sat</li><li>Sun</li>
  </ul>
  <div class="day-grid">
    <span class="day-cell">28</span>
    <span class="day-cell">29</span>
    <span class="day-cell">30</span>
    <span class="day-cell">31</span>
    <span class="day-cell">1</span>
    <span class="day-cell">2</span>
    <span class="day-cell">3</span>
    <span class="day-cell event-day">4<span class="event-chip chip-work">Stand-up</span></span>
    <span class="day-cell">5</span>
    <span class="day-cell">6</span>
    <span class="day-cell">7</span>
    <span class="day-cell">8</span>
    <span class="day-cell">9</span>
    <span class="day-cell">10</span>
    <span class="day-cell">11</span>
    <span class="day-cell event-day">12<span class="event-chip chip-social">Birthday</span></span>
    <span class="day-cell">13</span>
    <span class="day-cell">14</span>
    <span class="day-cell">15</span>
    <span class="day-cell">16</span>
    <span class="day-cell">17</span>
    <span class="day-cell">18</span>
    <span class="day-cell">19</span>
    <span class="day-cell event-day">20<span class="event-chip chip-health">Dentist</span></span>
    <span class="day-cell">21</span>
    <span class="day-cell">22</span>
    <span class="day-cell">23</span>
    <span class="day-cell">24</span>
    <span class="day-cell">25</span>
    <span class="day-cell">26</span>
    <span class="day-cell">27</span>
    <span class="day-cell">28</span>
    <span class="day-cell">29</span>
    <span class="day-cell">30</span>
    <span class="day-cell">31</span>
    <span class="day-cell">1</span>
  </div>
  <footer class="planner-foot">
    <span class="legend-item"><i class="legend-dot dot-work"></i>Work</span>
    <span class="legend-item"><i class="legend-dot dot-social"></i>Social</span>
    <span class="legend-item"><i class="legend-dot dot-health"></i>Health</span>
  </footer>
</div>
</body>
</html>
