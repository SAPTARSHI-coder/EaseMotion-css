<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liquid Wave Audio Visualizer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="visualizer-container">

        <section class="visualizer-card">

            <div class="header">
                <span class="status-dot"></span>
                <span>NOW PLAYING</span>
            </div>

            <div class="song-info">
                <div class="album-art">♪</div>

                <div>
                    <h1>Liquid Dreams</h1>
                    <p>EaseMotion Audio Visualizer</p>
                </div>
            </div>

            <div class="wave-container" aria-label="Animated audio waveform">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </div>

            <div class="progress">
                <span></span>
            </div>

            <div class="time">
                <span>1:24</span>
                <span>3:42</span>
            </div>

            <div class="controls">
                <button aria-label="Previous track">⏮</button>
                <button class="play" aria-label="Play">▶</button>
                <button aria-label="Next track">⏭</button>
            </div>

        </section>

    </main>

</body>
</html>
