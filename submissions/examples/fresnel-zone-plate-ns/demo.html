<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fresnel Zone Plate — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Fresnel Zone Plate demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Fresnel Zone Plate</h1>
      <p class="lede">Fresnel zone plate focusing concentric diffraction rings</p>
    </header>

    <section class="ease-fresnel-zone-plate" data-demo="fresnel-zone-plate" aria-live="polite">
      <div class="ease-fresnel-zone-plate__housing">
        <div class="ease-fresnel-zone-plate__bezel">
          <div class="ease-fresnel-zone-plate__face">
            <div class="ease-fresnel-zone-plate__readout">
              <span class="ease-fresnel-zone-plate__label">Fresnel Zone Plate</span>
              <span class="ease-fresnel-zone-plate__value">LIVE</span>
            </div>
            <div class="ease-fresnel-zone-plate__motion" aria-hidden="true">
              <span class="ease-fresnel-zone-plate__a"></span>
              <span class="ease-fresnel-zone-plate__b"></span>
              <span class="ease-fresnel-zone-plate__c"></span>
              <span class="ease-fresnel-zone-plate__d"></span>
            </div>
            <div class="ease-fresnel-zone-plate__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-fresnel-zone-plate__controls">
          <button type="button" class="ease-fresnel-zone-plate__btn primary">Engage</button>
          <button type="button" class="ease-fresnel-zone-plate__btn">Reset</button>
          <label class="ease-fresnel-zone-plate__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-fresnel-zone-plate__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
