<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Glow Stick – Bends and Glows Like a Glow Stick</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <h1>🪄 Glow Stick</h1>
    <p class="subtitle">Bends and glows like a real glow stick</p>

    <div class="glowstick-container">
      <div class="glowstick-stage" id="glowstickStage">
        <canvas id="canvas"></canvas>
        
        <!-- Info overlay -->
        <div class="info-overlay">
          <span class="glowstick-status" id="glowstickStatus">💡 Active</span>
          <span class="glow-intensity" id="glowIntensity">Intensity: 80%</span>
        </div>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <button class="ctrl-btn toggle" id="toggleBtn">💡 Toggle</button>
      <button class="ctrl-btn reset" id="resetBtn">↺ Reset</button>
      <button class="ctrl-btn snap" id="snapBtn">💥 Snap</button>
    </div>

    <!-- Sliders -->
    <div class="slider-container">
      <span class="slider-label">Intensity</span>
      <input type="range" id="intensitySlider" min="0" max="100" value="80" />
      <span class="slider-value" id="intensityValue">80%</span>
    </div>

    <div class="slider-container">
      <span class="slider-label">Bend Amount</span>
      <input type="range" id="bendSlider" min="0" max="100" value="50" />
      <span class="slider-value" id="bendValue">50%</span>
    </div>

    <div class="slider-container">
      <span class="slider-label">Color</span>
      <input type="range" id="colorSlider" min="0" max="360" value="220" />
      <span class="slider-value" id="colorValue">220°</span>
    </div>

    <!-- Status -->
    <div class="status" id="status">🪄 Move your cursor to bend the glow stick</div>

    <!-- Keyboard shortcuts -->
    <div class="shortcuts">
      <kbd>Mouse</kbd> Bend · <kbd>T</kbd> Toggle · <kbd>R</kbd> Reset · <kbd>S</kbd> Snap
    </div>
  </div>

  <script>
    (function() {
      "use strict";

      // DOM elements
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      const glowstickStatus = document.getElementById('glowstickStatus');
      const glowIntensity = document.getElementById('glowIntensity');
      const toggleBtn = document.getElementById('toggleBtn');
      const resetBtn = document.getElementById('resetBtn');
      const snapBtn = document.getElementById('snapBtn');
      const status = document.getElementById('status');
      const intensitySlider = document.getElementById('intensitySlider');
      const intensityValue = document.getElementById('intensityValue');
      const bendSlider = document.getElementById('bendSlider');
      const bendValue = document.getElementById('bendValue');
      const colorSlider = document.getElementById('colorSlider');
      const colorValue = document.getElementById('colorValue');

      // State
      let isActive = true;
      let mouseX = 0;
      let mouseY = 0;
      let isMouseOnCanvas = false;
      let animationId = null;
      let time = 0;
      let snapParticles = [];
      let isSnapping = false;
      let snapTimer = null;

      // ----- Canvas setup -----
      function setupCanvas() {
        const rect = canvas.parentElement.getBoundingClientRect();
        const size = Math.min(rect.width - 40, 600);
        canvas.width = size;
        canvas.height = size;
        canvas.style.width = size + 'px';
        canvas.style.height = size + 'px';
      }

      // ----- Snap particle class -----
      class SnapParticle {
        constructor(x, y, color) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 1 + Math.random() * 5;
          this.x = x;
          this.y = y;
          this.vx = Math.cos(angle) * speed;
          this.vy = Math.sin(angle) * speed - 2;
          this.size = 2 + Math.random() * 6;
          this.life = 1;
          this.decay = 0.01 + Math.random() * 0.02;
          this.hue = color + (Math.random() - 0.5) * 30;
          this.saturation = 80 + Math.random() * 20;
          this.lightness = 60 + Math.random() * 30;
          this.gravity = 0.05;
          this.friction = 0.99;
        }

        update() {
          this.vx *= this.friction;
          this.vy *= this.friction;
          this.vy += this.gravity;
          this.x += this.vx;
          this.y += this.vy;
          this.life -= this.decay;
          this.size *= 0.998;
          return this.life > 0;
        }

        draw(ctx) {
          const alpha = this.life;
          const size = this.size * this.life;
          
          // Glow
          const gradient = ctx.createRadialGradient(
            this.x, this.y, 0,
            this.x, this.y, size * 5
          );
          gradient.addColorStop(0, `hsla(${this.hue}, 100%, 90%, ${alpha * 0.6})`);
          gradient.addColorStop(0.5, `hsla(${this.hue}, 100%, 70%, ${alpha * 0.3})`);
          gradient.addColorStop(1, `hsla(${this.hue}, 100%, 50%, 0)`);
          ctx.fillStyle = gradient;
          ctx.beginPath();
          ctx.arc(this.x, this.y, size * 5, 0, Math.PI * 2);
          ctx.fill();

          // Core
          ctx.fillStyle = `hsla(${this.hue + 20}, 100%, 95%, ${alpha * 0.9})`;
          ctx.beginPath();
          ctx.arc(this.x, this.y, size, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // ----- Draw glow stick -----
      function drawGlowStick() {
        const w = canvas.width;
        const h = canvas.height;
        const cx = w / 2;
        const cy = h / 2;
        const intensity = parseInt(intensitySlider.value) / 100;
        const bendAmount = parseInt(bendSlider.value) / 100;
        const hue = parseInt(colorSlider.value);

        // Clear
        ctx.clearRect(0, 0, w, h);

        // Background
        const bgGradient = ctx.createRadialGradient(cx, cy, 0, cx, cy, w * 0.8);
        bgGradient.addColorStop(0, '#0a0a1a');
        bgGradient.addColorStop(0.5, '#060612');
        bgGradient.addColorStop(1, '#020208');
        ctx.fillStyle = bgGradient;
        ctx.fillRect(0, 0, w, h);

        if (!isActive) {
          glowstickStatus.textContent = '🌑 Inactive';
          glowIntensity.textContent = 'Intensity: 0%';
          return;
        }

        // Calculate mouse position relative to center
        const dx = isMouseOnCanvas ? mouseX - cx : 0;
        const dy = isMouseOnCanvas ? mouseY - cy : 0;
        const dist = Math.sqrt(dx * dx + dy * dy);
        const maxDist = Math.min(w, h) * 0.6;
        const normalizedDist = Math.min(1, dist / maxDist);

        // Bend angle based on mouse position
        const bendAngle = Math.atan2(dy, dx);
        const bendStrength = normalizedDist * bendAmount * 0.8;

        // Glow stick parameters
        const stickLength = Math.min(w, h) * 0.6;
        const stickWidth = 8 + intensity * 12;
        const numSegments = 30;

        // Calculate glow stick points with bending
        const points = [];
        for (let i = 0; i <= numSegments; i++) {
          const t = i / numSegments;
          const angleOffset = bendStrength * (t - 0.5) * 2;
          const x = cx + Math.sin(angleOffset + bendAngle) * (t - 0.5) * stickLength;
          const y = cy - Math.cos(angleOffset + bendAngle) * (t - 0.5) * stickLength * 0.8;
          
          // Add slight wobble
          const wobble = Math.sin(time * 2 + t * 10) * 2 * intensity;
          points.push({
            x: x + wobble * (t - 0.5),
            y: y + wobble * 0.5 * (t - 0.5)
          });
        }

        // Draw glow stick glow
        const glowRadius = stickWidth * 1.5 * (0.5 + 0.5 * intensity);
        const glowAlpha = 0.1 + intensity * 0.3;

        // Outer glow
        for (let i = 0; i < points.length - 1; i++) {
          const p1 = points[i];
          const p2 = points[i + 1];
          const t = i / points.length;
          const segmentGlow = glowRadius * (1 + Math.sin(time * 0.5 + t * 5) * 0.1);
          
          const gradient = ctx.createRadialGradient(
            (p1.x + p2.x) / 2, (p1.y + p2.y) / 2, 0,
            (p1.x + p2.x) / 2, (p1.y + p2.y) / 2, segmentGlow * 3
          );
          const alpha = glowAlpha * (0.5 + 0.5 * (1 - t));
          gradient.addColorStop(0, `hsla(${hue + 20}, 100%, 90%, ${alpha * 0.5})`);
          gradient.addColorStop(0.5, `hsla(${hue}, 100%, 70%, ${alpha * 0.3})`);
          gradient.addColorStop(1, `hsla(${hue - 20}, 100%, 50%, 0)`);
          ctx.fillStyle = gradient;
          ctx.beginPath();
          ctx.arc((p1.x + p2.x) / 2, (p1.y + p2.y) / 2, segmentGlow * 3, 0, Math.PI * 2);
          ctx.fill();
        }

        // Draw glow stick body
        ctx.shadowColor = `hsla(${hue}, 100%, 60%, ${0.2 * intensity})`;
        ctx.shadowBlur = 30;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        // Main glow stick body
        for (let i = 0; i < points.length - 1; i++) {
          const p1 = points[i];
          const p2 = points[i + 1];
          const t = i / points.length;
          const width = stickWidth * (0.8 + 0.4 * Math.sin(t * Math.PI * 2 + time * 0.3));

          const grad = ctx.createLinearGradient(p1.x, p1.y, p2.x, p2.y);
          const hueOffset = t * 20;
          grad.addColorStop(0, `hsla(${hue + hueOffset + 10}, 100%, 70%, ${0.6 + intensity * 0.4})`);
          grad.addColorStop(0.3, `hsla(${hue + hueOffset}, 100%, 80%, ${0.7 + intensity * 0.3})`);
          grad.addColorStop(0.7, `hsla(${hue + hueOffset + 10}, 100%, 85%, ${0.7 + intensity * 0.3})`);
          grad.addColorStop(1, `hsla(${hue + hueOffset + 20}, 100%, 70%, ${0.6 + intensity * 0.4})`);

          ctx.strokeStyle = grad;
          ctx.lineWidth = width;
          ctx.beginPath();
          ctx.moveTo(p1.x, p1.y);
          ctx.lineTo(p2.x, p2.y);
          ctx.stroke();
        }

        ctx.shadowBlur = 0;

        // Bright core (center line)
        for (let i = 0; i < points.length - 1; i++) {
          const p1 = points[i];
          const p2 = points[i + 1];
          const t = i / points.length;
          const width = stickWidth * 0.15 * (0.5 + 0.5 * intensity);
          
          ctx.strokeStyle = `hsla(0, 0%, 100%, ${0.2 + intensity * 0.3 * (1 - t)})`;
          ctx.lineWidth = width;
          ctx.beginPath();
          ctx.moveTo(p1.x, p1.y);
          ctx.lineTo(p2.x, p2.y);
          ctx.stroke();
        }

        // End caps (glow tips)
        for (let i = 0; i < points.length; i += points.length - 1) {
          const p = points[i];
          const endGlow = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, stickWidth * 1.5);
          endGlow.addColorStop(0, `hsla(${hue + 20}, 100%, 95%, ${0.3 * intensity})`);
          endGlow.addColorStop(0.5, `hsla(${hue}, 100%, 80%, ${0.2 * intensity})`);
          endGlow.addColorStop(1, `hsla(${hue - 20}, 100%, 60%, 0)`);
          ctx.fillStyle = endGlow;
          ctx.beginPath();
          ctx.arc(p.x, p.y, stickWidth * 1.5, 0, Math.PI * 2);
          ctx.fill();
        }

        // Draw snap particles
        if (isSnapping) {
          snapParticles = snapParticles.filter(p => p.update());
          snapParticles.forEach(p => p.draw(ctx));
          if (snapParticles.length === 0) {
            isSnapping = false;
          }
        }

        // Update status
        glowstickStatus.textContent = isActive ? '💡 Active' : '🌑 Inactive';
        glowIntensity.textContent = `Intensity: ${Math.round(intensity * 100)}%`;
        status.textContent = isActive ? '🪄 Move your cursor to bend the glow stick' : '🌑 Glow stick off';
      }

      // ----- Animation loop -----
      function animate() {
        time += 0.016;
        drawGlowStick();
        animationId = requestAnimationFrame(animate);
      }

      // ----- Start animation -----
      function startAnimation() {
        if (animationId) {
          cancelAnimationFrame(animationId);
        }
        animate();
      }

      // ----- Toggle glow stick -----
      function toggleGlowStick() {
        isActive = !isActive;
        toggleBtn.textContent = isActive ? '💡 Toggle' : '💡 Off';
        status.textContent = isActive ? '🪄 Glow stick activated' : '🌑 Glow stick deactivated';
      }

      // ----- Reset -----
      function resetGlowStick() {
        isActive = true;
        toggleBtn.textContent = '💡 Toggle';
        intensitySlider.value = 80;
        intensityValue.textContent = '80%';
        bendSlider.value = 50;
        bendValue.textContent = '50%';
        colorSlider.value = 220;
        colorValue.textContent = '220°';
        snapParticles = [];
        isSnapping = false;
        status.textContent = '↺ Reset';
        setTimeout(() => {
          status.textContent = '🪄 Move your cursor to bend the glow stick';
        }, 500);
      }

      // ----- Snap glow stick -----
      function snapGlowStick() {
        if (!isActive) return;
        
        const w = canvas.width;
        const h = canvas.height;
        const cx = w / 2;
        const cy = h / 2;
        const hue = parseInt(colorSlider.value);
        
        isSnapping = true;
        
        // Create particles along the glow stick
        const numParticles = 60;
        const stickLength = Math.min(w, h) * 0.6;
        
        for (let i = 0; i < numParticles; i++) {
          const t = i / numParticles;
          const x = cx + (t - 0.5) * stickLength;
          const y = cy + Math.sin(time + t * 10) * 5;
          snapParticles.push(new SnapParticle(x, y, hue));
        }
        
        status.textContent = '💥 Glow stick snapped!';
        setTimeout(() => {
          status.textContent = '🪄 Move your cursor to bend the glow stick';
        }, 1500);
      }

      // ----- Event Listeners -----
      // Mouse tracking
      canvas.addEventListener('mousemove', (e) => {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        mouseX = (e.clientX - rect.left) * scaleX;
        mouseY = (e.clientY - rect.top) * scaleY;
        isMouseOnCanvas = true;
      });

      canvas.addEventListener('mouseenter', () => {
        isMouseOnCanvas = true;
        status.textContent = '🪄 Bending glow stick';
      });

      canvas.addEventListener('mouseleave', () => {
        isMouseOnCanvas = false;
        status.textContent = '🪄 Move cursor back to bend';
      });

      // Touch support
      canvas.addEventListener('touchmove', (e) => {
        e.preventDefault();
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        const touch = e.touches[0];
        mouseX = (touch.clientX - rect.left) * scaleX;
        mouseY = (touch.clientY - rect.top) * scaleY;
        isMouseOnCanvas = true;
      });

      canvas.addEventListener('touchstart', (e) => {
        const touch = e.touches[0];
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        mouseX = (touch.clientX - rect.left) * scaleX;
        mouseY = (touch.clientY - rect.top) * scaleY;
        isMouseOnCanvas = true;
      });

      canvas.addEventListener('touchend', () => {
        isMouseOnCanvas = false;
      });

      // Buttons
      toggleBtn.addEventListener('click', toggleGlowStick);
      resetBtn.addEventListener('click', resetGlowStick);
      snapBtn.addEventListener('click', snapGlowStick);

      // Sliders
      intensitySlider.addEventListener('input', (e) => {
        intensityValue.textContent = e.target.value + '%';
      });

      bendSlider.addEventListener('input', (e) => {
        bendValue.textContent = e.target.value + '%';
      });

      colorSlider.addEventListener('input', (e) => {
        colorValue.textContent = e.target.value + '°';
      });

      // Keyboard shortcuts
      document.addEventListener('keydown', (e) => {
        if (e.key === 't' || e.key === 'T') {
          e.preventDefault();
          toggleGlowStick();
        }
        if (e.key === 'r' || e.key === 'R') {
          e.preventDefault();
          resetGlowStick();
        }
        if (e.key === 's' || e.key === 'S') {
          e.preventDefault();
          snapGlowStick();
        }
      });

      // Click on canvas to snap
      canvas.addEventListener('click', snapGlowStick);

      // ----- Resize handler -----
      let resizeTimeout;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(() => {
          setupCanvas();
        }, 200);
      });

      // ----- Init -----
      function init() {
        setupCanvas();
        startAnimation();
        status.textContent = '🪄 Move your cursor to bend the glow stick!';
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }

    })();
  </script>
</body>
</html>
