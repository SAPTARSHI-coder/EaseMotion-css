<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Animated Trophy Icon</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="demo-container">
    <h1>CSS Animated Trophy Icon</h1>

    <div class="trophy-wrapper">
      <div class="trophy-icon" role="img" aria-label="Achievement Trophy">
        <div class="shine"></div>

        <div class="star star-1"></div>
        <div class="star star-2"></div>
        <div class="star star-3"></div>
        <div class="star star-4"></div>

        <div class="trophy">
          <div class="handle left"></div>
          <div class="handle right"></div>
          <div class="cup"></div>
          <div class="stem"></div>
          <div class="base"></div>
        </div>
      </div>
    </div>

    <p class="description">
      Pure CSS trophy icon featuring an animated shine effect and
      celebratory star-burst animation.
    </p>
  </div>

</body>
</html>
