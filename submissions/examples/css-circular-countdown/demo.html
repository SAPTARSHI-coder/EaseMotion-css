<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="CSS-only circular countdown with an animated progress arc."
  >

  <title>CSS Circular Countdown</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="demo-page">

    <section
      class="countdown-demo"
      aria-labelledby="countdown-title"
    >

      <header class="demo-header">
        <span class="eyebrow">EaseMotion CSS</span>

        <h1 id="countdown-title">
          Circular Countdown
        </h1>

        <p>
          A smooth CSS-only circular progress countdown
          with an animated arc and accessible structure.
        </p>
      </header>

      <div class="countdown-stage">

        <div
          class="countdown"
          role="timer"
          aria-label="10 second circular countdown"
        >

          <div class="countdown__ring">

            <div class="countdown__track"></div>

            <div class="countdown__progress"></div>

          </div>

          <div class="countdown__content">

            <span class="countdown__value">
              10
            </span>

            <span class="countdown__unit">
              seconds
            </span>

          </div>

        </div>

      </div>

      <div class="demo-info">
        <span class="status-dot" aria-hidden="true"></span>

        <span>
          Countdown animation running
        </span>
      </div>

    </section>

  </main>

</body>
</html>
