<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Signal Scar</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <main class="page">

    <header class="intro">

      <span class="eyebrow">
        RECOVERED TRANSMISSION // 014
      </span>

      <h1>
        Signal <span>Scar</span>
      </h1>

      <p>
        A damaged transmission that reacts when you get too close.
      </p>

    </header>


    <section
      class="signal-panel"
      id="signalPanel"
      aria-label="Interactive signal transmission"
    >

      <div class="panel-grid"></div>

      <div class="scan-zone"></div>


      <div class="signal-container">

        <svg
          class="signal-svg"
          viewBox="0 0 1000 360"
          preserveAspectRatio="none"
          aria-hidden="true"
        >

          <path
            class="signal-shadow"
            id="signalShadow"
            d=""
          />

          <path
            class="signal-path"
            id="signalPath"
            d=""
          />

          <path
            class="signal-echo"
            id="signalEcho"
            d=""
          />

        </svg>


        <div class="markers" id="markers"></div>

      </div>


      <div class="transmission-info">

        <div class="info-block">
          <span>CHANNEL</span>
          <strong>SC-014</strong>
        </div>

        <div class="info-block">
          <span>FREQUENCY</span>
          <strong id="frequency">73.4</strong>
        </div>

        <div class="info-block">
          <span>INTEGRITY</span>
          <strong id="integrity">82%</strong>
        </div>

      </div>


      <div class="status">

        <span class="status-dot"></span>

        <span>
          SIGNAL UNSTABLE
        </span>

      </div>


      <div class="pointer-readout">
        X <span id="pointerX">00</span>
        /
        Y <span id="pointerY">00</span>
      </div>


      <div class="instruction">
        <span></span>
        Move through the transmission
      </div>

    </section>

  </main>


  <script>
    const panel =
      document.getElementById("signalPanel");

    const path =
      document.getElementById("signalPath");

    const shadow =
      document.getElementById("signalShadow");

    const echo =
      document.getElementById("signalEcho");

    const markers =
      document.getElementById("markers");

    const frequency =
      document.getElementById("frequency");

    const integrity =
      document.getElementById("integrity");

    const pointerX =
      document.getElementById("pointerX");

    const pointerY =
      document.getElementById("pointerY");


    const points = 90;

    let targetX = 0.5;
    let targetY = 0.5;

    let currentX = 0.5;
    let currentY = 0.5;

    let active = false;

    let time = 0;


    const markerPositions = [
      12,
      24,
      38,
      53,
      67,
      79,
      91
    ];


    markerPositions.forEach(position => {

      const marker =
        document.createElement("div");

      marker.className = "marker";

      marker.style.left =
        `${position}%`;

      marker.innerHTML = `
        <span class="marker-line"></span>
        <span class="marker-dot"></span>
      `;

      markers.appendChild(marker);
    });


    function buildSignal() {

      let mainPath = "";
      let shadowPath = "";
      let echoPath = "";

      for (let i = 0; i < points; i++) {

        const x =
          (i / (points - 1)) * 1000;

        const normalized =
          i / (points - 1);

        const base =
          180;

        const wave =
          Math.sin(
            normalized * 18 + time
          ) * 16;

        const secondary =
          Math.sin(
            normalized * 47 - time * 1.4
          ) * 7;

        const pointerDistance =
          Math.abs(
            normalized - currentX
          );

        const influence =
          Math.max(
            0,
            1 - pointerDistance / 0.18
          );

        const distortion =
          influence *
          Math.sin(
            normalized * 70 +
            time * 3
          ) *
          38;

        const y =
          base +
          wave +
          secondary +
          distortion +
          (currentY - 0.5) * 35;

        const shadowY =
          y + 16;

        const echoY =
          y - 25;


        if (i === 0) {

          mainPath +=
            `M ${x} ${y}`;

          shadowPath +=
            `M ${x} ${shadowY}`;

          echoPath +=
            `M ${x} ${echoY}`;

        } else {

          mainPath +=
            ` L ${x} ${y}`;

          shadowPath +=
            ` L ${x} ${shadowY}`;

          echoPath +=
            ` L ${x} ${echoY}`;
        }
      }

      path.setAttribute(
        "d",
        mainPath
      );

      shadow.setAttribute(
        "d",
        shadowPath
      );

      echo.setAttribute(
        "d",
        echoPath
      );
    }


    function updatePointer(event) {

      const rect =
        panel.getBoundingClientRect();

      targetX =
        (event.clientX - rect.left) /
        rect.width;

      targetY =
        (event.clientY - rect.top) /
        rect.height;

      targetX =
        Math.max(
          0,
          Math.min(1, targetX)
        );

      targetY =
        Math.max(
          0,
          Math.min(1, targetY)
        );

      active = true;

      pointerX.textContent =
        String(
          Math.round(targetX * 99)
        ).padStart(2, "0");

      pointerY.textContent =
        String(
          Math.round(targetY * 99)
        ).padStart(2, "0");
    }


    panel.addEventListener(
      "pointermove",
      updatePointer
    );


    panel.addEventListener(
      "pointerenter",
      () => {
        active = true;
      }
    );


    panel.addEventListener(
      "pointerleave",
      () => {
        active = false;
      }
    );


    function animate() {

      time += 0.035;

      if (!active) {

        targetX +=
          (0.5 - targetX) * 0.025;

        targetY +=
          (0.5 - targetY) * 0.025;
      }


      currentX +=
        (targetX - currentX) * 0.09;

      currentY +=
        (targetY - currentY) * 0.09;


      buildSignal();


      const nearby =
        Math.abs(currentX - 0.5);

      const integrityValue =
        Math.round(
          91 - nearby * 26
        );

      const frequencyValue =
        (
          73.4 +
          Math.sin(time) * 2.7 +
          nearby * 4
        ).toFixed(1);


      integrity.textContent =
        `${integrityValue}%`;

      frequency.textContent =
        frequencyValue;


      panel.style.setProperty(
        "--pointer-x",
        `${currentX * 100}%`
      );

      panel.style.setProperty(
        "--pointer-y",
        `${currentY * 100}%`
      );


      requestAnimationFrame(
        animate
      );
    }


    animate();
  </script>

</body>

</html>
