<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-teapot-steam-whistle demo</title>
</head>
<body>
<div class="tp-app">
  <div class="tp-stove">
    <div class="tp-ring"></div>
    <span class="tp-flame tp-flame-1"></span>
    <span class="tp-flame tp-flame-2"></span>
  </div>
  <div class="tp-pot">
    <div class="tp-lid">
      <span class="tp-knob"></span>
    </div>
    <div class="tp-spout">
      <span class="tp-steam tp-steam-1"></span>
      <span class="tp-steam tp-steam-2"></span>
    </div>
    <div class="tp-handle"></div>
    <span class="tp-band"></span>
  </div>
  <div class="tp-tray"></div>
</div>
</body>
</html>
