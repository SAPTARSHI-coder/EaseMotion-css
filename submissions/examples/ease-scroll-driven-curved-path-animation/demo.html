<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ease Scroll-Driven Curved Path Motion</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="path-body">
  <div class="path-stage">
    <div class="path-dot" id="dot">🚀</div>
  </div>

  <script>
    window.addEventListener('scroll', () => {
      const scroll = window.scrollY / (document.body.scrollHeight - window.innerHeight);
      document.getElementById('dot').style.offsetDistance = `${scroll * 100}%`;
    });
  </script>
</body>
</html>
