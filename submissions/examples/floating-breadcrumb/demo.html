<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Floating Breadcrumb — EaseMotion CSS Demo</title>
  <link rel="stylesheet" href="style.css" />

  <style>
    /* Demo-page-only styles (not part of the component) */
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2.5rem;
      padding: 2rem;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #eef2ff 0%, #f8fafc 45%, #fdf4ff 100%);
    }

    .demo-heading {
      text-align: center;
    }

    .demo-heading h1 {
      margin: 0 0 0.5rem;
      font-size: 1.5rem;
      color: #0f172a;
    }

    .demo-heading p {
      margin: 0;
      color: #64748b;
      font-size: 0.95rem;
    }

    .demo-section {
      width: 100%;
      max-width: 640px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
    }

    .demo-label {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <div class="demo-heading">
    <h1>Floating Breadcrumb</h1>
    <p>SaaS Modern styling · CSS-only · Fully responsive</p>
  </div>

  <!-- ================= Example 1: full path ================= -->
  <div class="demo-section">
    <span class="demo-label">Default</span>

    <nav class="floating-breadcrumb" aria-label="Breadcrumb">
      <ol class="breadcrumb-list">

        <li class="breadcrumb-item">
          <a class="breadcrumb-link" href="#home">
            <svg class="breadcrumb-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
              <path d="M12 3.2 3 10.5v9.3c0 .55.45 1 1 1h5.5v-6.4h5v6.4H20c.55 0 1-.45 1-1v-9.3L12 3.2Z"/>
            </svg>
            <span>Home</span>
          </a>
        </li>

        <li class="breadcrumb-separator" aria-hidden="true">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="none">
            <path d="M9 6l6 6-6 6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </li>

        <li class="breadcrumb-item">
          <a class="breadcrumb-link" href="#dashboard">Dashboard</a>
        </li>

        <li class="breadcrumb-separator" aria-hidden="true">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="none">
            <path d="M9 6l6 6-6 6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </li>

        <li class="breadcrumb-item">
          <a class="breadcrumb-link" href="#projects">Projects</a>
        </li>

        <li class="breadcrumb-separator" aria-hidden="true">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="none">
            <path d="M9 6l6 6-6 6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </li>

        <li class="breadcrumb-item">
          <span class="breadcrumb-current" aria-current="page">Current Project</span>
        </li>

      </ol>
    </nav>
  </div>

  <!-- ================= Example 2: shorter path ================= -->
  <div class="demo-section">
    <span class="demo-label">Short path</span>

    <nav class="floating-breadcrumb" aria-label="Breadcrumb">
      <ol class="breadcrumb-list">

        <li class="breadcrumb-item">
          <a class="breadcrumb-link" href="#home">
            <svg class="breadcrumb-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
              <path d="M12 3.2 3 10.5v9.3c0 .55.45 1 1 1h5.5v-6.4h5v6.4H20c.55 0 1-.45 1-1v-9.3L12 3.2Z"/>
            </svg>
            <span>Home</span>
          </a>
        </li>

        <li class="breadcrumb-separator" aria-hidden="true">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="none">
            <path d="M9 6l6 6-6 6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </li>

        <li class="breadcrumb-item">
          <span class="breadcrumb-current" aria-current="page">Settings</span>
        </li>

      </ol>
    </nav>
  </div>

  <!-- ================= Example 3: long path (tests wrapping/scroll) ================= -->
  <div class="demo-section">
    <span class="demo-label">Long path (mobile scroll test)</span>

    <nav class="floating-breadcrumb" aria-label="Breadcrumb">
      <ol class="breadcrumb-list">

        <li class="breadcrumb-item">
          <a class="breadcrumb-link" href="#home">
            <svg class="breadcrumb-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
              <path d="M12 3.2 3 10.5v9.3c0 .55.45 1 1 1h5.5v-6.4h5v6.4H20c.55 0 1-.45 1-1v-9.3L12 3.2Z"/>
            </svg>
            <span>Home</span>
          </a>
        </li>

        <li class="breadcrumb-separator" aria-hidden="true">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="none">
            <path d="M9 6l6 6-6 6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </li>

        <li class="breadcrumb-item">
          <a class="breadcrumb-link" href="#workspace">Workspace</a>
        </li>

        <li class="breadcrumb-separator" aria-hidden="true">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="none">
            <path d="M9 6l6 6-6 6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </li>

        <li class="breadcrumb-item">
          <a class="breadcrumb-link" href="#dashboard">Dashboard</a>
        </li>

        <li class="breadcrumb-separator" aria-hidden="true">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="none">
            <path d="M9 6l6 6-6 6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </li>

        <li class="breadcrumb-item">
          <a class="breadcrumb-link" href="#projects">Projects</a>
        </li>

        <li class="breadcrumb-separator" aria-hidden="true">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="none">
            <path d="M9 6l6 6-6 6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </li>

        <li class="breadcrumb-item">
          <a class="breadcrumb-link" href="#analytics">Analytics</a>
        </li>

        <li class="breadcrumb-separator" aria-hidden="true">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="none">
            <path d="M9 6l6 6-6 6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </li>

        <li class="breadcrumb-item">
          <span class="breadcrumb-current" aria-current="page">Revenue Report</span>
        </li>

      </ol>
    </nav>
  </div>

</body>
</html>
