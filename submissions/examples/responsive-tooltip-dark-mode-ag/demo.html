<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Tooltip (Dark Mode)</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <div class="tooltip-container">
    <button class="tooltip-trigger" aria-describedby="tooltip1">
      Hover me
    </button>
    <div id="tooltip1" class="tooltip-content" role="tooltip">
      This is a responsive tooltip!<br>
      It automatically adapts to your system's dark mode.
    </div>
  </div>

</body>
</html>
