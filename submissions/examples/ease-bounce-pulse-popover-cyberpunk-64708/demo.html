<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyberpunk Neon Bounce-Pulse Popover</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="cyberpunk-container">
        <div class="popover-wrapper" tabindex="0">
            <button class="cyber-btn" aria-haspopup="true">
                <span class="btn-text">ACCESS_MAINFRAME</span>
                <span class="btn-glitch" aria-hidden="true">_</span>
            </button>
            <div class="cyber-popover" role="tooltip">
                <div class="popover-content">
                    <h3 class="popover-title">SYS.NET_LINK</h3>
                    <p class="popover-desc">Uplink established. Awaiting command input...</p>
                    <ul class="cyber-menu">
                        <li><a href="#" tabindex="0">> OVERRIDE</a></li>
                        <li><a href="#" tabindex="0">> ENCRYPT</a></li>
                        <li><a href="#" tabindex="0">> DISCONNECT</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
