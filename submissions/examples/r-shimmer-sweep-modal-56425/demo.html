<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Shimmer-Sweep Modal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<input type="checkbox" id="modal-toggle" hidden>

<section class="hero">

    <h1>Gaming Hub</h1>

    <p>
        Experience a premium Shimmer-Sweep Modal crafted using pure HTML and CSS.
    </p>

    <label for="modal-toggle" class="open-btn">
        Open Premium Chest
    </label>

</section>

<div class="overlay">

    <div class="modal">

        <label for="modal-toggle" class="close-btn">&times;</label>

        <div class="icon">✨</div>

        <h2>Epic Reward Unlocked</h2>

        <p>
            Your victory has unlocked an exclusive cosmetic bundle. Enjoy your legendary rewards.
        </p>

        <label for="modal-toggle" class="action-btn">
            Collect Reward
        </label>

    </div>

</div>

</body>
</html>
