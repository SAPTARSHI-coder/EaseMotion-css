<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skew Active Progress Bar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="progress-container">
    <h1>Portfolio Skills</h1>

    <div class="skill">
        <span>HTML</span>
        <div class="progress">
            <div class="fill html"></div>
        </div>
    </div>

    <div class="skill">
        <span>CSS</span>
        <div class="progress">
            <div class="fill css"></div>
        </div>
    </div>

    <div class="skill">
        <span>JavaScript</span>
        <div class="progress">
            <div class="fill js"></div>
        </div>
    </div>

</div>

</body>
</html>
