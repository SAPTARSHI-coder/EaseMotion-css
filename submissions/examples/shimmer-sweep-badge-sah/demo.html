<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shimmer-Sweep Accessible Badge - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="stage">
    <header class="head">
      <h1>Shimmer-Sweep Badges (<code>#54313</code>)</h1>
      <p>An enterprise series of accessible WAI-ARIA status badges across whose highlighted metallic labels a continuous luminous light beam refracts diagonally.</p>
    </header>
    
    <section class="ease-badges-shimmer-sweep" aria-label="Enterprise Indicators">
      <div class="badge-shimm gold-b" role="status" aria-label="Prime Spec">
        <div class="beam-sheen"></div>
        <span>✦ 144 MERGES CONFIRMED</span>
      </div>

      <div class="badge-shimm cyan-b" role="status" aria-label="Shader Spec">
        <div class="beam-sheen"></div>
        <span>⚡ 60.0 FPS WEB GPU</span>
      </div>

      <div class="badge-shimm emerald-b" role="status" aria-label="Accessibility Spec">
        <div class="beam-sheen"></div>
        <span>● WCAG AAA CONTRAST</span>
      </div>
    </section>
  </div>
</body>
</html>
