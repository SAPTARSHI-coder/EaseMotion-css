<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Animated Datepicker - Cyberpunk</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="cyber-demo" aria-labelledby="cyber-title">
    <section class="cyber-shell">
      <div class="copy">
        <p class="eyebrow">Neon scheduler</p>
        <h1 id="cyber-title">Animated Datepicker</h1>
        <p>High-contrast calendar controls with glowing focus states and a selected-date energy ring.</p>
      </div>
      <div class="calendar" role="group" aria-label="Cyberpunk datepicker preview">
        <header>
          <button aria-label="Previous month">Prev</button>
          <strong>August 2026</strong>
          <button aria-label="Next month">Next</button>
        </header>
        <div class="week"><span>MON</span><span>TUE</span><span>WED</span><span>THU</span><span>FRI</span><span>SAT</span><span>SUN</span></div>
        <div class="grid">
          <span>27</span><span>28</span><span>29</span><span>30</span><span>31</span>
          <button>1</button><button>2</button><button>3</button><button>4</button><button>5</button>
          <button>6</button><button>7</button><button>8</button><button class="selected">9</button><button>10</button>
          <button>11</button><button>12</button><button>13</button><button>14</button><button>15</button>
        </div>
        <footer><span>Launch window</span><b>22:40 IST</b></footer>
      </div>
    </section>
  </main>
</body>
</html>
