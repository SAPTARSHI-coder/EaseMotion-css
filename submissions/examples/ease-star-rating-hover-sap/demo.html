<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ease-star-rating-hover-sap demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f4f4f5;
    }
  </style>
</head>
<body>

  <div class="star-rating-sap" id="starRating" role="radiogroup" aria-label="Star rating">
    <svg class="star" viewBox="0 0 24 24" data-value="1"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01z"/></svg>
    <svg class="star" viewBox="0 0 24 24" data-value="2"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01z"/></svg>
    <svg class="star" viewBox="0 0 24 24" data-value="3"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01z"/></svg>
    <svg class="star" viewBox="0 0 24 24" data-value="4"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01z"/></svg>
    <svg class="star" viewBox="0 0 24 24" data-value="5"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01z"/></svg>
    <span class="rating-label" id="ratingLabel">Not rated</span>
  </div>

  <script>
    const group = document.getElementById('starRating');
    const stars = [...group.querySelectorAll('.star')];
    const label = document.getElementById('ratingLabel');
    let selected = 0;

    function paint(upTo, cls) {
      stars.forEach(s => s.classList.toggle(cls, +s.dataset.value <= upTo));
    }

    stars.forEach(star => {
      star.addEventListener('mouseenter', () => paint(+star.dataset.value, 'hovered'));
      star.addEventListener('mouseleave', () => paint(0, 'hovered'));
      star.addEventListener('click', () => {
        selected = +star.dataset.value;
        paint(selected, 'active');
        label.textContent = `${selected} / 5`;
      });
    });
  </script>

</body>
</html>
