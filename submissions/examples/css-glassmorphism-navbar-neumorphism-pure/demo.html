<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glass-Neumorphism Navbar</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Dynamic colorful background to showcase the Glassmorphism -->
    <div class="bg-shape shape-pink"></div>
    <div class="bg-shape shape-blue"></div>
    <div class="bg-shape shape-yellow"></div>

    <div class="layout">
        
        <!-- Glassmorphism Navbar with Neumorphic internal elements -->
        <nav class="glass-neu-navbar">
            <div class="nav-brand neu-extruded">
                <div class="brand-dot"></div>
                GlassNeu
            </div>
            
            <!-- CSS Checkbox hack for mobile menu -->
            <input type="checkbox" id="nav-toggle" class="nav-toggle-input">
            
            <div class="nav-menu">
                <a href="#" class="nav-link neu-extruded">Home</a>
                <a href="#" class="nav-link neu-extruded">Features</a>
                <a href="#" class="nav-link neu-extruded">Pricing</a>
                <a href="#" class="nav-link neu-inset active">Contact</a>
            </div>
            
            <!-- Mobile Toggle Button -->
            <label for="nav-toggle" class="mobile-toggle neu-extruded">
                <div class="hamburger"></div>
            </label>
        </nav>
        
        <main class="dummy-content">
            <h1>Scroll to see the effect</h1>
            <p>The navbar combines frosted glass transparency with soft physical neumorphic shadows.</p>
        </main>
        
    </div>

</body>
</html>
