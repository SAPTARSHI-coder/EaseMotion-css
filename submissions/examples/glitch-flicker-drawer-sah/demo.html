<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glitch-Flicker Portfolio Drawer - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="shell">
    <header class="head">
      <h1>Glitch-Flicker Drawer (<code>#54518</code>)</h1>
      <button class="trigger-glitch" onclick="document.getElementById('drawer-cyber').classList.add('open')">>> OPEN CYBER TERMINAL</button>
    </header>
    <p class="hint">Click above to deploy a futuristic terminal side menu configured with digital scanline flicker animations.</p>
    
    <div id="drawer-cyber" class="ease-drawer-wrap">
      <div class="mask" onclick="document.getElementById('drawer-cyber').classList.remove('open')"></div>
      <aside class="ease-drawer-glitch">
        <div class="term-head">
          <h3>// CYBER_TERMINAL</h3>
          <button class="close-x" onclick="document.getElementById('drawer-cyber').classList.remove('open')">[X]</button>
        </div>
        <nav class="cyber-nav">
          <a href="#" class="cyber-link" data-text="> NEURAL_ENGINE">> NEURAL_ENGINE</a>
          <a href="#" class="cyber-link" data-text="> HOUDINI_SHADERS">> HOUDINI_SHADERS</a>
          <a href="#" class="cyber-link" data-text="> CRYPTO_PORTFOLIO">> CRYPTO_PORTFOLIO</a>
          <a href="#" class="cyber-link" data-text="> 54_PR_AUTOMATION">> 54_PR_AUTOMATION</a>
        </nav>
      </aside>
    </div>
  </div>
</body>
</html>
