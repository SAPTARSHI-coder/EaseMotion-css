<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ease-animated-confetti-burst-sap demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <button onclick="burstConfettiSap(this)">Celebrate</button>

  <script>
    function burstConfettiSap(btn) {
      const rect = btn.getBoundingClientRect();
      const colors = ['#f97316', '#ec4899', '#6366f1', '#22c55e', '#facc15'];
      for (let i = 0; i < 24; i++) {
        const piece = document.createElement('div');
        piece.className = 'confetti-piece-sap';
        piece.style.left = rect.left + rect.width / 2 + 'px';
        piece.style.top = rect.top + 'px';
        piece.style.background = colors[i % colors.length];
        piece.style.setProperty('--x', (Math.random() * 240 - 120) + 'px');
        piece.style.setProperty('--y', (Math.random() * -180 - 60) + 'px');
        piece.style.setProperty('--r', Math.random() * 360 + 'deg');
        document.body.appendChild(piece);
        piece.addEventListener('animationend', () => piece.remove());
      }
    }
  </script>
</body>
</html>
