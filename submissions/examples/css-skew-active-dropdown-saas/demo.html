<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Skew-Active Dropdown — SaaS Showcase</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="ease-container">
    <p class="ease-eyebrow">Organization Settings</p>
    <h1 class="ease-heading">Switch Workspace</h1>
    <p class="ease-subtitle">Select an active workspace with a smooth 3D skew-perspective transition.</p>

    <div class="ease-dropdown">
      <input type="checkbox" id="ease-saas-skew-toggle" class="ease-dropdown-input" />
      <label for="ease-saas-skew-toggle" class="ease-dropdown-trigger">
        <span class="ease-dropdown-label">Acme Corp (Production)</span>
        <span class="ease-dropdown-arrow">▾</span>
      </label>
      <div class="ease-dropdown-menu">
        <button class="ease-dropdown-item active">
          <div class="ease-item-info">
            <span class="ease-item-title">Acme Corp</span>
            <span class="ease-item-sub">Production • 12 Members</span>
          </div>
          <span class="ease-status-badge">Active</span>
        </button>
        <button class="ease-dropdown-item">
          <div class="ease-item-info">
            <span class="ease-item-title">Staging Environment</span>
            <span class="ease-item-sub">Testing • 4 Members</span>
          </div>
          <span class="ease-status-badge idle">Idle</span>
        </button>
        <button class="ease-dropdown-item">
          <div class="ease-item-info">
            <span class="ease-item-title">Dev Sandbox</span>
            <span class="ease-item-sub">Local • 1 Member</span>
          </div>
          <span class="ease-status-badge idle">Idle</span>
        </button>
      </div>
    </div>
  </main>
</body>
</html>
