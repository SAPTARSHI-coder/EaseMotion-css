<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Pure CSS pill badge variants including default, success, warning and danger."
  >

  <title>CSS Pill Badge Variants | EaseMotion CSS</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="demo-container">

    <header class="demo-header">
      <p class="eyebrow">EaseMotion CSS</p>

      <h1>CSS Pill Badge Variants</h1>

      <p>
        Simple, responsive and reusable pill badges built entirely with CSS.
      </p>
    </header>

    <section class="badge-showcase" aria-labelledby="badge-title">

      <h2 id="badge-title">Badge Variants</h2>

      <div class="badge-grid">

        <span class="pill-badge pill-default">
          Default
        </span>

        <span class="pill-badge pill-success">
          Success
        </span>

        <span class="pill-badge pill-warning">
          Warning
        </span>

        <span class="pill-badge pill-danger">
          Danger
        </span>

      </div>
    </section>

    <section class="example-section" aria-labelledby="example-title">

      <h2 id="example-title">Example Usage</h2>

      <div class="status-list">

        <p>
          Account status:
          <span class="pill-badge pill-success">Active</span>
        </p>

        <p>
          Payment:
          <span class="pill-badge pill-warning">Pending</span>
        </p>

        <p>
          Server:
          <span class="pill-badge pill-danger">Offline</span>
        </p>

        <p>
          Category:
          <span class="pill-badge pill-default">General</span>
        </p>

      </div>
    </section>

  </main>
</body>
</html>
