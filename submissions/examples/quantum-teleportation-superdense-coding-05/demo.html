<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Superdense Coding - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css"></head><body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030712; color: #ffffff;">

    <div class="ease-card ease-card-glass dense-container">
        <div class="dense-header">
            <h2>Superdense Coding</h2>
            <span class="ease-badge ease-badge-primary">Transmitting</span>
        </div>
        
        <div class="dense-screen ease-center">
            <div class="dense-flux flux-dense-a"></div>
            <div class="dense-flux flux-dense-b"></div>
            <div class="dense-boundary-ring"></div>
            <div class="dense-core ease-center"></div>
        </div>

        <div class="dense-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Bits: 2 Bits / 1 Qubit</span>
            <button class="ease-btn ease-btn-primary ease-btn-sm ease-hover-grow">Send Message</button>
        </div>
    </div></body></html>
