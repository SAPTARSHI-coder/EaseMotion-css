<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Animated floating label input with a soft claymorphism design."
  >

  <title>Claymorphism Floating Label Input</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="page">
    <section class="component-card" aria-labelledby="component-title">

      <div class="intro">
        <span class="eyebrow">EaseMotion CSS</span>

        <h1 id="component-title">
          Claymorphism Input
        </h1>

        <p>
          A soft, tactile floating-label input built entirely with HTML and CSS.
        </p>
      </div>

      <form class="clay-form" action="#" method="post">

        <div class="field">
          <input
            class="clay-input"
            type="text"
            id="full-name"
            name="full-name"
            placeholder=" "
            autocomplete="name"
            required
          >
          <label class="clay-label" for="full-name">
            Full Name
          </label>
        </div>

        <div class="field">
          <input
            class="clay-input"
            type="email"
            id="email"
            name="email"
            placeholder=" "
            autocomplete="email"
            required
          >
          <label class="clay-label" for="email">
            Email Address
          </label>
        </div>

        <div class="field">
          <input
            class="clay-input"
            type="text"
            id="role"
            name="role"
            placeholder=" "
            autocomplete="organization-title"
          >
          <label class="clay-label" for="role">
            Your Role
          </label>
        </div>

        <button class="clay-button" type="submit">
          Continue
          <span aria-hidden="true">→</span>
        </button>

      </form>

    </section>
  </main>

</body>
</html>
