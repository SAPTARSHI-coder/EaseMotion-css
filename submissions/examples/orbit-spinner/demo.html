<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orbit Spinner &mdash; EaseMotion CSS Demo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="page-head">
    <p class="kicker">EaseMotion CSS &middot; Loader</p>
    <h1>Orbit Spinner</h1>
    <p class="sub">A satellite endlessly circles a glowing planet while a dashed ring sweeps in the opposite direction.</p>
  </header>
  <main class="stage">
    <div class="orb-spinner" aria-label="Loading" role="status">
      <span class="orb-ring"></span>
      <span class="orb-core"></span>
      <span class="orb-sat"></span>
    </div>
  </main>
  <p class="stage-caption">Scale the whole loader by changing <code>--orb-base</code>.</p>
  <footer class="page-foot">
    <span>Pure CSS &middot; zero dependencies</span>
  </footer>
</body>
</html>
