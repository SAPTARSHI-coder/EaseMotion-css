<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ripple Wave Progress Bar</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<section class="catalog-section">

<h1>Product Catalog Loading</h1>

<p class="subtitle">
CSS Ripple-Wave Progress Bar built using pure HTML & CSS.
</p>

<div class="catalog">

<div class="product-card">

<div class="product-icon">📱</div>

<h2>Smartphone Pro</h2>

<div class="progress">

<div class="fill fill-25">

<span class="ripple"></span>

</div>

</div>

<div class="status">

<span>Loading</span>

<strong>25%</strong>

</div>

</div>

<div class="product-card">

<div class="product-icon">⌚</div>

<h2>Smart Watch</h2>

<div class="progress">

<div class="fill fill-50">

<span class="ripple"></span>

</div>

</div>

<div class="status">

<span>Loading</span>

<strong>50%</strong>

</div>

</div>

<div class="product-card">

<div class="product-icon">🎧</div>

<h2>Gaming Headset</h2>

<div class="progress">

<div class="fill fill-75">

<span class="ripple"></span>

</div>

</div>

<div class="status">

<span>Loading</span>

<strong>75%</strong>

</div>

</div>

<div class="product-card">

<div class="product-icon">💻</div>

<h2>Laptop Ultra</h2>

<div class="progress">

<div class="fill fill-100">

<span class="ripple"></span>

</div>

</div>

<div class="status">

<span>Completed</span>

<strong>100%</strong>

</div>

</div>

</div>

</section>

</body>

</html>
