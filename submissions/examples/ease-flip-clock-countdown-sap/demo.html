<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ease-flip-clock-countdown-sap demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { height: 100vh; margin: 0; display: flex; align-items: center; justify-content: center; background: #0f172a; }
  </style>
</head>
<body>
  <div class="flip-countdown-sap" id="countdown">
    <div class="countdown-unit"><div class="countdown-digits" data-unit="days"></div><span class="countdown-label">Days</span></div>
    <div class="countdown-unit"><div class="countdown-digits" data-unit="hours"></div><span class="countdown-label">Hours</span></div>
    <div class="countdown-unit"><div class="countdown-digits" data-unit="minutes"></div><span class="countdown-label">Minutes</span></div>
    <div class="countdown-unit"><div class="countdown-digits" data-unit="seconds"></div><span class="countdown-label">Seconds</span></div>
  </div>
  <script>
    const target = new Date();
    target.setDate(target.getDate() + 3);

    const units = {
      days: document.querySelector('[data-unit="days"]'),
      hours: document.querySelector('[data-unit="hours"]'),
      minutes: document.querySelector('[data-unit="minutes"]'),
      seconds: document.querySelector('[data-unit="seconds"]')
    };
    const last = { days: '', hours: '', minutes: '', seconds: '' };

    function renderUnit(container, value) {
      const str = String(value).padStart(2, '0');
      container.innerHTML = '';
      [...str].forEach(ch => {
        const box = document.createElement('div');
        box.className = 'digit-box';
        box.textContent = ch;
        container.appendChild(box);
      });
    }

    function tick() {
      const diff = Math.max(0, target - new Date());
      const days = Math.floor(diff / 86400000);
      const hours = Math.floor((diff % 86400000) / 3600000);
      const minutes = Math.floor((diff % 3600000) / 60000);
      const seconds = Math.floor((diff % 60000) / 1000);
      const values = { days, hours, minutes, seconds };

      Object.keys(values).forEach(key => {
        if (String(values[key]) !== last[key]) {
          renderUnit(units[key], values[key]);
          last[key] = String(values[key]);
        }
      });
    }

    tick();
    setInterval(tick, 1000);
  </script>
</body>
</html>
