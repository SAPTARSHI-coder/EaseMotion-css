<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ease Copy Action</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="copy-demo">

    <div class="copy-item">
        <div class="copy-content">
            <span class="copy-icon">▣</span>
            <span class="copy-text">npm install easemotion</span>
        </div>

        <button class="copy-button" aria-label="Copy command">
            <span class="button-icon">⧉</span>
            <span>Copy</span>
        </button>
    </div>

    <div class="copy-item copied">
        <div class="copy-content">
            <span class="copy-icon">#</span>
            <span class="copy-text">ease-copy-action</span>
        </div>

        <button class="copy-button" aria-label="Copied">
            <span class="button-icon">✓</span>
            <span>Copied</span>
        </button>
    </div>

</div>

</body>
</html>
