<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
        name="description"
        content="Pure CSS Pulsating Wave Badge component"
    >
    <title>Pulsating Wave Badge</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="page">
        <section class="showcase" aria-labelledby="page-title">
            <p class="eyebrow">EaseMotion CSS</p>

            <h1 id="page-title">Pulsating Wave Badge</h1>

            <p class="description">
                A smooth, accessible badge with a subtle expanding wave effect,
                built entirely with HTML and vanilla CSS.
            </p>

            <div class="badge-container">
                <span class="wave-badge">
                    <span class="wave-badge__dot" aria-hidden="true"></span>
                    <span class="wave-badge__text">Live Now</span>
                </span>

                <span class="wave-badge wave-badge--success">
                    <span class="wave-badge__dot" aria-hidden="true"></span>
                    <span class="wave-badge__text">Available</span>
                </span>

                <span class="wave-badge wave-badge--warning">
                    <span class="wave-badge__dot" aria-hidden="true"></span>
                    <span class="wave-badge__text">Updating</span>
                </span>
            </div>
        </section>
    </main>
</body>
</html>
