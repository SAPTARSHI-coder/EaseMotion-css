<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Twist Dialog Mixin - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="showcase">
    <h1>Twist Dialog Mixin (<code>#54709</code>)</h1>
    <p class="subtitle">Helical torsional scale-in animation engineered for impactful popover modals.</p>
    
    <div class="modal-backdrop">
      <div class="ease-dialog-twist">
        <header class="dialog-head">
          <span class="badge">Security Notification</span>
          <h2>API Keys Generated</h2>
        </header>
        <p>Your authentication tokens have been staged. Please store them offline before this session terminates.</p>
        <div class="dialog-actions">
          <button class="btn-cancel">Discard</button>
          <button class="btn-confirm">Copy Token ✓</button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
