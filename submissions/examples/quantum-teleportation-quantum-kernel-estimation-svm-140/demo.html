<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Kernel Estimation SVM - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css"></head><body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030712; color: #ffffff;">

    <div class="ease-card ease-card-glass qsvm-container">
        <div class="qsvm-header">
            <h2>Quantum Kernel SVM</h2>
            <span class="ease-badge ease-badge-primary">Quantum Machine Learning</span>
        </div>
        
        <div class="qsvm-screen ease-center">
            <div class="qsvm-flux flux-qsvm-a"></div>
            <div class="qsvm-flux flux-qsvm-b"></div>
            <div class="qsvm-boundary-ring"></div>
            <div class="qsvm-core ease-center"></div>
        </div>

        <div class="qsvm-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Hilbert Space Mapping &amp; Inner Products</span>
            <button class="ease-btn ease-btn-primary ease-btn-sm ease-hover-grow">Compute Quantum Kernel</button>
        </div>
    </div></body></html>
