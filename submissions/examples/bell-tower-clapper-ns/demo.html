<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bell Tower Clapper — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Bell Tower Clapper demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Bell Tower Clapper</h1>
      <p class="lede">Cathedral bell swinging with clapper strike pulse</p>
    </header>

    <section class="ease-bell-tower-clapper" data-demo="bell-tower-clapper" aria-live="polite">
      <div class="ease-bell-tower-clapper__housing">
        <div class="ease-bell-tower-clapper__bezel">
          <div class="ease-bell-tower-clapper__face">
            <div class="ease-bell-tower-clapper__readout">
              <span class="ease-bell-tower-clapper__label">Bell Tower Clapper</span>
              <span class="ease-bell-tower-clapper__value">LIVE</span>
            </div>
            <div class="ease-bell-tower-clapper__motion" aria-hidden="true">
              <span class="ease-bell-tower-clapper__a"></span>
              <span class="ease-bell-tower-clapper__b"></span>
              <span class="ease-bell-tower-clapper__c"></span>
              <span class="ease-bell-tower-clapper__d"></span>
            </div>
            <div class="ease-bell-tower-clapper__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-bell-tower-clapper__controls">
          <button type="button" class="ease-bell-tower-clapper__btn primary">Engage</button>
          <button type="button" class="ease-bell-tower-clapper__btn">Reset</button>
          <label class="ease-bell-tower-clapper__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-bell-tower-clapper__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
