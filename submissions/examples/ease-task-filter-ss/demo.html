<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Search & Filter UI - EaseMotion</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="ease-task-card">
    <header class="ease-card-header">
      <h1 class="ease-card-title">Project Sprint Tasks</h1>
      <p class="ease-card-subtitle">Filter and search tasks by status and title</p>
    </header>

    <div class="ease-controls-row">
      <div class="ease-search-wrapper" role="search">
        <span class="ease-search-icon" aria-hidden="true">🔍</span>
        <input type="text" id="task-search" class="ease-search-input" placeholder="Search tasks..." aria-label="Search task titles">
      </div>
      
      <div class="ease-filter-group" role="tablist" aria-label="Task Status Filters">
        <button type="button" class="ease-filter-btn is-active" data-filter="all" role="tab" aria-selected="true">All</button>
        <button type="button" class="ease-filter-btn" data-filter="pending" role="tab" aria-selected="false">Pending</button>
        <button type="button" class="ease-filter-btn" data-filter="completed" role="tab" aria-selected="false">Completed</button>
      </div>
    </div>

    <ul class="ease-task-list" id="task-container" aria-live="polite">
      <li class="ease-task-item" data-status="completed">
        <span class="ease-task-title">Design 3D Coverflow Stage</span>
        <span class="ease-badge completed">Completed</span>
      </li>
      <li class="ease-task-item" data-status="pending">
        <span class="ease-task-title">Audit Animation Fill-Modes for Initial Load</span>
        <span class="ease-badge pending">Pending</span>
      </li>
      <li class="ease-task-item" data-status="completed">
        <span class="ease-task-title">Refactor Keyframes to GPU Transforms</span>
        <span class="ease-badge completed">Completed</span>
      </li>
      <li class="ease-task-item" data-status="pending">
        <span class="ease-task-title">Implement WCAG 2.1 AA Focus Rings</span>
        <span class="ease-badge pending">Pending</span>
      </li>
    </ul>
    <div class="ease-empty-state" id="empty-state" style="display: none;">No matching tasks found.</div>
  </main>

  <script>
    const searchInput = document.getElementById('task-search');
    const filterBtns = document.querySelectorAll('.ease-filter-btn');
    const taskItems = document.querySelectorAll('.ease-task-item');
    const emptyState = document.getElementById('empty-state');
    let currentFilter = 'all';

    function filterTasks() {
      const query = searchInput.value.toLowerCase().trim();
      let visibleCount = 0;

      taskItems.forEach(item => {
        const title = item.querySelector('.ease-task-title').textContent.toLowerCase();
        const status = item.getAttribute('data-status');
        const matchesSearch = title.includes(query);
        const matchesFilter = currentFilter === 'all' || status === currentFilter;

        if (matchesSearch && matchesFilter) {
          item.style.display = 'flex';
          visibleCount++;
        } else {
          item.style.display = 'none';
        }
      });

      emptyState.style.display = visibleCount === 0 ? 'block' : 'none';
    }

    searchInput.addEventListener('input', filterTasks);

    filterBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        filterBtns.forEach(b => {
          b.classList.remove('is-active');
          b.setAttribute('aria-selected', 'false');
        });
        btn.classList.add('is-active');
        btn.setAttribute('aria-selected', 'true');
        currentFilter = btn.getAttribute('data-filter');
        filterTasks();
      });
    });
  </script>
</body>
</html>
