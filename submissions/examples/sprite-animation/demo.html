<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Sprite Animation Demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background-color: #f8fafc;
      color: #334155;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    .container {
      display: flex;
      gap: 40px;
      margin-top: 40px;
    }

    code {
      background: #e2e8f0;
      padding: 4px 8px;
      border-radius: 4px;
      color: #0f172a;
    }
  </style>
</head>
<body>

  <h1>Hover-Triggered Sprite Animation</h1>
  <p>Hover over the square below to see the CSS <code>steps()</code> timing function instantly swap between frames of a sprite sheet.</p>

  <div class="container">
    <!-- The Sprite Animation Element -->
    <div class="em-sprite-anim" title="Hover me!"></div>
  </div>

</body>
</html>
