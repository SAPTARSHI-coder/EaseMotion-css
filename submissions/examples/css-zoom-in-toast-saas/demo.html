<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Zoom-In Toast — SaaS Showcase</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="ease-container">
    <p class="ease-eyebrow">Billing Alert</p>
    <h1 class="ease-heading">Subscription Update</h1>
    <p class="ease-subtitle">Toggle or hover the notification to trigger the dynamic zoom-in bounce entrance.</p>

    <div class="ease-toast-wrapper">
      <input type="checkbox" id="ease-saas-zoom-toggle" class="ease-toast-input" checked />

      <label for="ease-saas-zoom-toggle" class="ease-trigger-btn">
        Toggle Billing Toast
      </label>

      <div class="ease-toast">
        <div class="ease-toast-icon">⚡</div>

        <div class="ease-toast-content">
          <p class="ease-toast-title">Plan Upgrade Successful</p>
          <p class="ease-toast-message">Your workspace is now on the Pro Tier. 10 GB extra storage added.</p>
        </div>

        <label for="ease-saas-zoom-toggle" class="ease-toast-close" title="Dismiss Alert">✕</label>
      </div>
    </div>
  </main>
</body>
</html>
