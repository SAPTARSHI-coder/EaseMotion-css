<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Paint Splash Ring &mdash; EaseMotion CSS Demo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="page-head">
    <p class="kicker">EaseMotion CSS &middot; Fun &amp; Visuals</p>
    <h1>Paint Splash Ring</h1>
    <p class="sub">A palette ring that splatters outward on contact.</p>
  </header>
  <main class="stage">
    <div class="ps-ring">
      <div class="ps-dot d1"></div>
      <div class="ps-dot d2"></div>
      <div class="ps-dot d3"></div>
      <div class="ps-dot d4"></div>
      <div class="ps-dot d5"></div>
      <div class="ps-dot d6"></div>
      <div class="ps-dot d7"></div>
      <div class="ps-dot d8"></div>
      <div class="ps-center">splash</div>
    </div>
  </main>
  <p class="stage-caption">Hover the ring to fling the paint outward.</p>
  <footer class="page-foot">
    <span>Pure CSS &middot; zero dependencies</span>
    <span>Splatter dots</span>
  </footer>
</body>
</html>
