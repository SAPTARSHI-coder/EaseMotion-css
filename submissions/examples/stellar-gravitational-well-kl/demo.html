<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stellar Gravitational Well - EaseMotion CSS</title>
    <!-- Include EaseMotion Core Stylesheet -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #050509; color: #ffffff;">

    <div class="ease-card ease-card-glass well-container">
        <div class="well-header">
            <h2>Gravitational Well</h2>
            <span class="ease-badge ease-badge-primary">Stable</span>
        </div>
        
        <div class="well-screen ease-center">
            <div class="accretion-ring ring-outer"></div>
            <div class="accretion-ring ring-inner"></div>
            <div class="event-horizon ease-center"></div>
        </div>

        <div class="well-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Mass: 4.2M Solar</span>
            <button class="ease-btn ease-btn-primary ease-btn-sm ease-hover-grow">Calibrate</button>
        </div>
    </div>

</body>
</html>
