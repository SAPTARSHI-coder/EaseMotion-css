<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="CSS-only icon morph button demonstrating a smooth icon transition on hover and focus."
  >
  <title>CSS Icon Morph Button</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="page">
    <section class="demo-card" aria-labelledby="demo-title">
      <p class="eyebrow">EaseMotion CSS</p>
      <h1 id="demo-title">CSS Icon Morph Button</h1>
      <p class="description">
        Hover or focus the button to smoothly morph the icon from a plus
        symbol into a check mark.
      </p>

      <div class="button-area">
        <button
          class="morph-button"
          type="button"
          aria-label="Add item"
        >
          <span class="icon-wrapper" aria-hidden="true">
            <span class="icon icon-plus">
              <span></span>
              <span></span>
            </span>

            <span class="icon icon-check">
              <span></span>
              <span></span>
            </span>
          </span>

          <span class="button-text">Add Item</span>
        </button>
      </div>

      <p class="hint">
        Hover or use Tab to focus the button.
      </p>
    </section>
  </main>
</body>
</html>
