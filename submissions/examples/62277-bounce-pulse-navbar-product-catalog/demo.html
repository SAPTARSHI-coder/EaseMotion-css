<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bounce Pulse Navbar - Product Catalog</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="catalog-header">
        <nav class="navbar">
            <div class="logo">ShopSphere</div>

            <ul class="nav-links">
                <li><a href="#">Home</a></li>
                <li><a href="#">Products</a></li>
                <li><a href="#">Categories</a></li>
                <li><a href="#">Offers</a></li>
                <li><a href="#">Contact</a></li>
            </ul>

            <button class="cart-btn">
                Cart 🛒
            </button>
        </nav>
    </header>


    <main class="container">

        <h1>Product Catalog</h1>
        <p>
            A modern CSS-only Bounce-Pulse Navbar animation showcase.
        </p>

        <section class="products">

            <article class="card">
                <h2>Wireless Headphones</h2>
                <p>Premium audio experience.</p>
                <span>$99</span>
            </article>

            <article class="card">
                <h2>Smart Watch</h2>
                <p>Track your daily activities.</p>
                <span>$149</span>
            </article>

            <article class="card">
                <h2>Gaming Mouse</h2>
                <p>High precision performance.</p>
                <span>$59</span>
            </article>

        </section>

    </main>

</body>
</html>
