<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Copy to Clipboard | EaseMotion CSS</title><link rel="stylesheet" href="style.css"></head>
<body><div class="ctc2-root">
<div class="ctc2-card">
<div class="ctc2-head"><span class="ctc2-lang">.env</span><button class="ctc2-copy" type="button" id="copyBtn" onclick="copy()">&#128203; Copy</button></div>
<div class="ctc2-code"><pre class="ctc2-pre">DATABASE_URL=postgres://user:pass@localhost:5432/db
API_KEY=sk_live_abcdef1234567890
SECRET_KEY=super_secret_value_here
REDIS_URL=redis://localhost:6379</pre></div>
</div>
<div class="ctc2-card">
<div class="ctc2-head"><span class="ctc2-lang">Config</span><button class="ctc2-copy" type="button" id="copyBtn2" onclick="copy2()">&#128203; Copy</button></div>
<div class="ctc2-row"><span class="ctc2-key">PORT</span><span class="ctc2-val">3000</span></div>
<div class="ctc2-row"><span class="ctc2-key">NODE_ENV</span><span class="ctc2-val">production</span></div>
<div class="ctc2-row"><span class="ctc2-key">LOG_LEVEL</span><span class="ctc2-val">info</span></div>
</div>
<p class="ctc2-sub">Pure CSS styled copy button. JS handles clipboard API and feedback class.</p>
</div>
<script>
function copy(){
  navigator.clipboard.writeText('DATABASE_URL=postgres://user:pass@localhost:5432/db
API_KEY=sk_live_abcdef1234567890').then(()=>{
    const b=document.getElementById('copyBtn');
    b.classList.add('copied');
    b.innerHTML='&#10003; Copied!';
    setTimeout(()=>{b.classList.remove('copied');b.innerHTML='&#128203; Copy'},2000);
  });
}
function copy2(){
  const txt=['PORT=3000','NODE_ENV=production','LOG_LEVEL=info'].join('
');
  navigator.clipboard.writeText(txt).then(()=>{
    const b=document.getElementById('copyBtn2');
    b.classList.add('copied');
    b.innerHTML='&#10003; Copied!';
    setTimeout(()=>{b.classList.remove('copied');b.innerHTML='&#128203; Copy'},2000);
  });
}
</script>
</body></html>
