<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scale-Hover Progress Bar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<section class="progress-section">
    <h1>Project Progress</h1>
    <p>Scale-Hover Progress Bar for Responsive Dashboard Layouts</p>

    <div class="progress-card">

        <div class="progress-item">
            <div class="progress-header">
                <span>HTML & CSS</span>
                <span>95%</span>
            </div>

            <div class="progress-bar">
                <div class="progress-fill html"></div>
            </div>
        </div>

        <div class="progress-item">
            <div class="progress-header">
                <span>JavaScript</span>
                <span>82%</span>
            </div>

            <div class="progress-bar">
                <div class="progress-fill js"></div>
            </div>
        </div>

        <div class="progress-item">
            <div class="progress-header">
                <span>React</span>
                <span>74%</span>
            </div>

            <div class="progress-bar">
                <div class="progress-fill react"></div>
            </div>
        </div>

        <div class="progress-item">
            <div class="progress-header">
                <span>UI Design</span>
                <span>68%</span>
            </div>

            <div class="progress-bar">
                <div class="progress-fill ui"></div>
            </div>
        </div>

    </div>

</section>

</body>
</html>
