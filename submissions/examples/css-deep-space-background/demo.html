<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Deep Space Background - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="em-space-page">
        <!-- Background Starfield Deep Space Animation Layers -->
        <div class="em-starfield-bg" aria-hidden="true">
            <div class="em-stars em-stars-1"></div>
            <div class="em-stars em-stars-2"></div>
            <div class="em-space-nebula"></div>
        </div>

        <div class="em-card" role="region" aria-label="Deep Space Background Showcase" tabindex="0">
            <span class="em-card-badge">BACKGROUND FX</span>
            <h1 class="em-card-title">Deep Space Background</h1>
            <p class="em-card-desc">A smooth, hardware-accelerated pure CSS deep space background featuring a slow zoom starfield and dark mode compatibility.</p>
            <a href="#" class="em-card-btn" role="button">Explore Deep Space</a>
        </div>
    </div>
</body>
</html>
