<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Notification Bell Dropdown</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="notification-wrapper">

    <input type="checkbox" id="notify-toggle" class="toggle" />

    <label
      for="notify-toggle"
      class="bell-button"
      aria-label="Notifications"
      tabindex="0"
    >
      🔔
      <span class="badge">3</span>
    </label>

    <div class="dropdown" role="menu" aria-label="Notification List">
      <h3>Notifications</h3>

      <div class="notification-item">
        <strong>New Comment</strong>
        <p>Someone replied to your post.</p>
      </div>

      <div class="notification-item">
        <strong>Update Available</strong>
        <p>Version 2.0 is ready to install.</p>
      </div>

      <div class="notification-item">
        <strong>Welcome!</strong>
        <p>Your account setup is complete.</p>
      </div>

    </div>

  </div>

</body>
</html>
