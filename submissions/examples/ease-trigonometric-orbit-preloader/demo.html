<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pure CSS Trigonometric Orbit Preloader</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="ease-orbit-system">
    <div class="ease-core"></div>
    <div class="ease-particle" style="--index: 1;"></div>
    <div class="ease-particle" style="--index: 2;"></div>
    <div class="ease-particle" style="--index: 3;"></div>
    <div class="ease-particle" style="--index: 4;"></div>
    <div class="ease-particle" style="--index: 5;"></div>
    <div class="ease-particle" style="--index: 6;"></div>
    <div class="ease-particle" style="--index: 7;"></div>
    <div class="ease-particle" style="--index: 8;"></div>
    <div class="ease-loading-text">Calculating...</div>
  </div>
</body>
</html>
