<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Biometric Retinal Scanner HUD</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="scanner-card">
    <div class="retinal-ring">
      <div class="retinal-laser-sweep"></div>
      <div class="retinal-target-reticle"></div>
    </div>
    <div class="scanner-info">
      <h2>RETINAL SCANNER</h2>
      <div class="scan-status-text">INITIALIZING SCAN...</div>
      <div class="scan-bar"><div class="scan-progress"></div></div>
      <div class="scanner-metadata">
        <span>IDENTITY: SUBJECT_842</span>
        <span>SECURITY LEVEL: ALPHA</span>
      </div>
    </div>
  </div>
</body>
</html>
