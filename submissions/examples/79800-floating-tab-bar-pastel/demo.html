<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
        name="description"
        content="Responsive floating tab bar with pastel styling"
    >
    <title>Floating Pastel Tab Bar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="page">
        <section class="showcase">

            <div class="badge">CSS COMPONENT</div>

            <h1>Floating Tab Bar</h1>

            <p class="description">
                A soft, responsive navigation component with pastel
                colors, floating depth, and smooth interactions.
            </p>

            <div class="preview">
                <div class="preview-content">
                    <span class="preview-label">CURRENT VIEW</span>
                    <h2>Dashboard</h2>
                    <p>
                        Explore your workspace and manage everything
                        from one simple navigation bar.
                    </p>
                </div>
            </div>

            <nav class="floating-tabs" aria-label="Main navigation">

                <a href="#home" class="tab active" aria-current="page">
                    <span class="tab-icon">⌂</span>
                    <span class="tab-text">Home</span>
                </a>

                <a href="#explore" class="tab">
                    <span class="tab-icon">⌕</span>
                    <span class="tab-text">Explore</span>
                </a>

                <a href="#projects" class="tab">
                    <span class="tab-icon">▣</span>
                    <span class="tab-text">Projects</span>
                </a>

                <a href="#messages" class="tab">
                    <span class="tab-icon">✉</span>
                    <span class="tab-text">Messages</span>
                </a>

                <a href="#profile" class="tab">
                    <span class="tab-icon">●</span>
                    <span class="tab-text">Profile</span>
                </a>

            </nav>

        </section>
    </main>

</body>
</html>
