<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Entanglement Node - EaseMotion CSS</title>
    <!-- Include EaseMotion Core Stylesheet -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030712; color: #ffffff;">

    <div class="ease-card ease-card-glass quantum-container">
        <div class="quantum-header">
            <h2>Quantum Node</h2>
            <span class="ease-badge ease-badge-success">Entangled</span>
        </div>
        
        <div class="quantum-screen ease-center">
            <div class="quantum-bridge"></div>
            <div class="quantum-particle p-left"></div>
            <div class="quantum-particle p-right"></div>
        </div>

        <div class="quantum-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Coherence: 99.9%</span>
            <button class="ease-btn ease-btn-primary ease-btn-sm ease-hover-grow">Re-link</button>
        </div>
    </div>

</body>
</html>
