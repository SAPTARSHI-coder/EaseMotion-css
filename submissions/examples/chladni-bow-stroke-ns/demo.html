<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chladni Bow Stroke — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Chladni Bow Stroke demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Chladni Bow Stroke</h1>
      <p class="lede">Chladni plate bow stroke forming nodal sand patterns</p>
    </header>

    <section class="ease-chladni-bow-stroke" data-demo="chladni-bow-stroke" aria-live="polite">
      <div class="ease-chladni-bow-stroke__housing">
        <div class="ease-chladni-bow-stroke__bezel">
          <div class="ease-chladni-bow-stroke__face">
            <div class="ease-chladni-bow-stroke__readout">
              <span class="ease-chladni-bow-stroke__label">Chladni Bow Stroke</span>
              <span class="ease-chladni-bow-stroke__value">LIVE</span>
            </div>
            <div class="ease-chladni-bow-stroke__motion" aria-hidden="true">
              <span class="ease-chladni-bow-stroke__a"></span>
              <span class="ease-chladni-bow-stroke__b"></span>
              <span class="ease-chladni-bow-stroke__c"></span>
              <span class="ease-chladni-bow-stroke__d"></span>
            </div>
            <div class="ease-chladni-bow-stroke__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-chladni-bow-stroke__controls">
          <button type="button" class="ease-chladni-bow-stroke__btn primary">Engage</button>
          <button type="button" class="ease-chladni-bow-stroke__btn">Reset</button>
          <label class="ease-chladni-bow-stroke__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-chladni-bow-stroke__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
