<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Morph-Glow Navbar</title>
  <link rel="stylesheet" href="../../../easemotion.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="morph-glow-navbar">
    <div class="navbar-container">
      <a href="#" class="logo">SaaS<span>App</span></a>
      
      <!-- Hamburger menu for mobile without JS -->
      <input type="checkbox" id="menu-toggle" class="menu-toggle">
      <label for="menu-toggle" class="hamburger" aria-label="Toggle Navigation">
        <span></span>
        <span></span>
        <span></span>
      </label>

      <ul class="nav-links">
        <li><a href="#" class="nav-link">Features</a></li>
        <li><a href="#" class="nav-link">Customers</a></li>
        <li><a href="#" class="nav-link">Integrations</a></li>
        <li><a href="#" class="nav-link">Docs</a></li>
        <li>
          <div class="glow-wrapper">
            <a href="#" class="btn morph-btn">Get Started</a>
          </div>
        </li>
      </ul>
    </div>
  </nav>

  <main style="padding: 4rem 2rem; text-align: center; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: #0f172a; min-height: 100vh; color: #f8fafc;">
    <h1 style="font-size: 3rem; margin-bottom: 1rem;">Morph-Glow Navbar</h1>
    <p style="font-size: 1.25rem; color: #94a3b8; max-width: 600px; margin: 0 auto;">
      A dark-themed navbar showcasing a continuous morphing glow effect on the call-to-action button, along with glowing hover states for the navigation links.
    </p>
  </main>
</body>
</html>
