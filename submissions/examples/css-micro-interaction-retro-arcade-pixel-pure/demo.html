<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Micro-interactions: Retro Arcade Pixel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- CRT Scanlines Overlay -->
    <div class="crt-overlay"></div>

    <div class="container">
        <header class="header">
            <h1 class="glitch-text" data-text="ARCADE PIXEL">ARCADE PIXEL</h1>
            <p>8-bit hardware-accelerated CSS micro-interactions.</p>
        </header>

        <main class="grid">
            
            <!-- 8-Bit Button -->
            <section class="demo-section">
                <div class="demo-content">
                    <h2>Pixel Button</h2>
                    <p>Hover and click for a blocky 3D press effect.</p>
                    
                    <div class="component-box dark-box">
                        <button class="pixel-btn">
                            PRESS START
                        </button>
                    </div>
                </div>
            </section>

            <!-- Retro Loader -->
            <section class="demo-section">
                <div class="demo-content">
                    <h2>Hourglass Loader</h2>
                    <p>Uses steps() for frame-by-frame animation.</p>
                    
                    <div class="component-box dark-box">
                        <div class="pixel-loader-container">
                            <!-- Drawn purely with box-shadows -->
                            <div class="pixel-hourglass"></div>
                            <div class="loading-text blink-fast">LOADING...</div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Retro Checkbox/Toggle -->
            <section class="demo-section">
                <div class="demo-content">
                    <h2>8-Bit Toggle</h2>
                    <p>CSS-only interactive pixel switch.</p>
                    
                    <div class="component-box dark-box">
                        <label class="pixel-toggle">
                            <input type="checkbox" class="toggle-input">
                            <div class="toggle-track">
                                <div class="toggle-thumb"></div>
                            </div>
                            <span class="toggle-label text-red">SOUND OFF</span>
                            <span class="toggle-label text-green">SOUND ON</span>
                        </label>
                    </div>
                </div>
            </section>
            
        </main>
    </div>

</body>
</html>
