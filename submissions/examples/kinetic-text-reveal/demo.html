<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kinetic Typography Split-Text Reveal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="reveal-container">
    <h1 class="split-text">
      <span style="--delay: 0.1s">M</span>
      <span style="--delay: 0.15s">O</span>
      <span style="--delay: 0.2s">T</span>
      <span style="--delay: 0.25s">I</span>
      <span style="--delay: 0.3s">O</span>
      <span style="--delay: 0.35s">N</span>
    </h1>
  </div>
</body>
</html>
