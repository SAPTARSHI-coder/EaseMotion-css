<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spotlight Follow Hero &mdash; EaseMotion CSS Demo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="page-head">
    <p class="kicker">EaseMotion CSS &middot; Hero &amp; Landing</p>
    <h1>Spotlight Follow Hero</h1>
    <p class="sub">A spotlight sweeps the dark stage, hunting for your headline.</p>
  </header>
  <main class="stage">
    <div class="sf-beam"></div>
    <div class="sf-light"></div>
    <div class="sf-hero">
      <h2>Step into the light</h2>
      <p>Your product, always in focus.</p>
    </div>
  </main>
  <p class="stage-caption">The beam pivots and its light pool glides below.</p>
  <footer class="page-foot">
    <span>Pure CSS &middot; zero dependencies</span>
    <span>Sweeping spotlight</span>
  </footer>
</body>
</html>
