<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Split Navigation - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="em-split-page">
        <div class="em-card" role="region" aria-label="Split Navigation Showcase" tabindex="0">
            <span class="em-card-badge">NAVIGATION PATTERNS</span>
            <h1 class="em-card-title">Split Navigation</h1>
            <p class="em-card-desc">An interactive navigation header split into two halves that smoothly slide apart on hover or toggle using pure CSS.</p>
            
            <!-- Split Navigation Viewport Container -->
            <div class="em-split-container" role="navigation" aria-label="Interactive split navigation">
                <div class="em-split-half em-left-half">
                    <span class="em-nav-link">Home</span>
                    <span class="em-nav-link">About</span>
                </div>
                <div class="em-split-divider"></div>
                <div class="em-split-half em-right-half">
                    <span class="em-nav-link">Projects</span>
                    <span class="em-nav-link">Contact</span>
                </div>
            </div>

            <a href="#" class="em-card-btn" role="button">Explore Pattern</a>
        </div>
    </div>
</body>
</html>
