<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pong Ball Bounce Component - Play Category</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="ease-pong-wrapper" aria-labelledby="stage-title">
    <div class="ease-pong-header">
      <h1 id="stage-title" class="ease-pong-title">Retro Arcade Pong</h1>
      <p class="ease-pong-desc">Pure CSS keyframe animation simulating a continuous rally between paddles.</p>
    </div>

    <!-- Pong Court Arena -->
    <div class="ease-pong-court" id="pong-court" role="region" aria-label="Pong Rally Animation">
      <div class="ease-pong-net" aria-hidden="true"></div>
      <div class="ease-paddle ease-paddle-left" aria-hidden="true"></div>
      <div class="ease-paddle ease-paddle-right" aria-hidden="true"></div>
      <div class="ease-pong-ball" aria-hidden="true"></div>
    </div>

    <button type="button" class="ease-btn-arcade" id="replay-btn">Restart Rally</button>
  </main>

  <script>
    const court = document.getElementById('pong-court');
    const replayBtn = document.getElementById('replay-btn');

    replayBtn.addEventListener('click', () => {
      court.classList.add('is-animating');
      void court.offsetWidth; // Trigger DOM reflow
      court.classList.remove('is-animating');
    });
  </script>
</body>
</html>
