<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-tv-static-noise demo</title>
</head>
<body>
<div class="tv-app">
  <span class="tv-title">CHANNEL 03</span>
  <div class="tv-set">
    <div class="tv-screen">
      <span class="tv-noise"></span>
      <span class="tv-caption">NO SIGNAL</span>
    </div>
    <div class="tv-base">
      <span class="tv-knob"></span>
      <span class="tv-knob tv-knob-2"></span>
    </div>
    <span class="tv-antenna"></span>
  </div>
  <span class="tv-status">AUTO TUNE</span>
</div>
</body>
</html>
