<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eye of Horus · Eye Opens with Mysterious Glow</title>
    <meta name="description" content="Interactive Eye of Horus with mysterious glow, opening animation, and ancient Egyptian mystical atmosphere.">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1 class="title">👁️ EYE OF HORUS</h1>
        
        <div class="canvas-wrapper">
            <canvas id="horusCanvas" width="600" height="500"></canvas>
            <div class="glow-overlay"></div>
        </div>

        <div class="controls">
            <div class="button-group">
                <button class="open-btn" id="openBtn">👁️ OPEN</button>
                <button class="close-btn" id="closeBtn">🔮 CLOSE</button>
                <button class="reset-btn" id="resetBtn">⟳ RESET</button>
                <button class="toggle-btn" id="toggleBtn">⏸️ PAUSE</button>
            </div>
            <div class="speed-control">
                <label>Speed</label>
                <input type="range" id="speedSlider" min="1" max="10" value="5">
                <span id="speedLabel">5</span>
                <label>Glow</label>
                <input type="range" id="glowSlider" min="1" max="10" value="5">
                <span id="glowLabel">5</span>
            </div>
        </div>

        <div class="info">
            <span>👁️ EYE OF HORUS</span>
            <small>mystical · ancient · glow</small>
        </div>
        <div class="hint">
            <span>🔮 click to open the mystical Eye of Horus</span>
        </div>
    </div>

    <script>
        (function() {
            const canvas = document.getElementById('horusCanvas');
            const ctx = canvas.getContext('2d');
            const W = 600, H = 500;
            
            const openBtn = document.getElementById('openBtn');
            const closeBtn = document.getElementById('closeBtn');
            const resetBtn = document.getElementById('resetBtn');
            const toggleBtn = document.getElementById('toggleBtn');
            const speedSlider = document.getElementById('speedSlider');
            const speedLabel = document.getElementById('speedLabel');
            const glowSlider = document.getElementById('glowSlider');
            const glowLabel = document.getElementById('glowLabel');

            let isAnimating = true;
            let speed = 5;
            let glowIntensity = 5;
            let time = 0;
            let eyeOpen = 0;
            let targetOpen = 0;
            let isOpening = false;
            let isOpen = false;

            // ---- Eye of Horus Drawing ----
            function drawEye(ctx, open, glow) {
                const cx = W / 2;
                const cy = H / 2;
                const size = 120;
                const openAmount = Math.min(1, open);
                const glowVal = glow / 10;
                
                ctx.save();
                ctx.translate(cx, cy);
                
                // ---- Mystical glow ----
                const glowGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, size * 2.5);
                const glowAlpha = 0.05 + glowVal * 0.15;
                glowGrad.addColorStop(0, `rgba(255, 200, 100, ${glowAlpha * 0.5})`);
                glowGrad.addColorStop(0.3, `rgba(255, 180, 80, ${glowAlpha * 0.3})`);
                glowGrad.addColorStop(0.6, `rgba(200, 150, 50, ${glowAlpha * 0.15})`);
                glowGrad.addColorStop(1, 'rgba(200, 150, 50, 0)');
                ctx.fillStyle = glowGrad;
                ctx.shadowColor = 'rgba(255, 200, 100, 0.1)';
                ctx.shadowBlur = 50 * glowVal;
                ctx.beginPath();
                ctx.arc(0, 0, size * 2.5, 0, Math.PI * 2);
                ctx.fill();
                
                // ---- Outer eye shape ----
                ctx.shadowBlur = 0;
                const eyeW = size * 1.3;
                const eyeH = size * 0.6 * (0.15 + openAmount * 0.85);
                const eyeY = -eyeH * 0.3;
                
                // Eye glow
                if (openAmount > 0.1) {
                    const innerGlow = ctx.createRadialGradient(0, eyeY, 0, 0, eyeY, eyeW * 0.8);
                    const alpha = openAmount * glowVal * 0.15;
                    innerGlow.addColorStop(0, `rgba(255, 220, 150, ${alpha})`);
                    innerGlow.addColorStop(0.5, `rgba(255, 200, 100, ${alpha * 0.5})`);
                    innerGlow.addColorStop(1, 'rgba(255, 200, 100, 0)');
                    ctx.fillStyle = innerGlow;
                    ctx.shadowColor = 'rgba(255, 200, 100, 0.05)';
                    ctx.shadowBlur = 30 * glowVal;
                    ctx.beginPath();
                    ctx.arc(0, eyeY, eyeW * 0.8, 0, Math.PI * 2);
                    ctx.fill();
                }
                
                ctx.shadowBlur = 0;
                
                // Eye outline
                ctx.strokeStyle = `rgba(200, 180, 150, ${0.3 + openAmount * 0.4})`;
                ctx.lineWidth = 2.5;
                
                // Draw eye shape (almond)
                ctx.beginPath();
                ctx.moveTo(-eyeW, eyeY);
                ctx.quadraticCurveTo(-eyeW * 0.5, eyeY - eyeH * 0.8, 0, eyeY - eyeH * 0.9);
                ctx.quadraticCurveTo(eyeW * 0.5, eyeY - eyeH * 0.8, eyeW, eyeY);
                ctx.quadraticCurveTo(eyeW * 0.5, eyeY + eyeH * 0.8, 0, eyeY + eyeH * 0.9);
                ctx.quadraticCurveTo(-eyeW * 0.5, eyeY + eyeH * 0.8, -eyeW, eyeY);
                ctx.closePath();
                ctx.stroke();
                
                // Eye fill (dark background)
                ctx.fillStyle = `rgba(10, 8, 12, ${0.3 + openAmount * 0.5})`;
                ctx.fill();
                
                // ---- Iris ----
                if (openAmount > 0.05) {
                    const irisSize = size * 0.3 * Math.min(1, openAmount * 2);
                    const irisY = eyeY;
                    
                    // Iris glow
                    const irisGlow = ctx.createRadialGradient(0, irisY, 0, 0, irisY, irisSize * 1.5);
                    const irisAlpha = openAmount * glowVal * 0.2;
                    irisGlow.addColorStop(0, `rgba(255, 180, 80, ${irisAlpha})`);
                    irisGlow.addColorStop(0.5, `rgba(200, 150, 50, ${irisAlpha * 0.5})`);
                    irisGlow.addColorStop(1, 'rgba(200, 150, 50, 0)');
                    ctx.fillStyle = irisGlow;
                    ctx.shadowColor = 'rgba(255, 200, 100, 0.1)';
                    ctx.shadowBlur = 30 * glowVal;
                    ctx.beginPath();
                    ctx.arc(0, irisY, irisSize * 1.5, 0, Math.PI * 2);
                    ctx.fill();
                    
                    ctx.shadowBlur = 0;
                    
                    // Iris
                    const irisGrad = ctx.createRadialGradient(
                        -irisSize * 0.2, irisY - irisSize * 0.2, 0,
                        0, irisY, irisSize
                    );
                    irisGrad.addColorStop(0, `rgba(220, 180, 100, ${0.3 + openAmount * 0.3})`);
                    irisGrad.addColorStop(0.4, `rgba(180, 140, 80, ${0.4 + openAmount * 0.3})`);
                    irisGrad.addColorStop(0.8, `rgba(120, 80, 40, ${0.3 + openAmount * 0.2})`);
                    irisGrad.addColorStop(1, `rgba(60, 40, 20, ${0.2 + openAmount * 0.2})`);
                    ctx.fillStyle = irisGrad;
                    ctx.shadowColor = 'rgba(255, 200, 100, 0.05)';
                    ctx.shadowBlur = 15 * glowVal;
                    ctx.beginPath();
                    ctx.arc(0, irisY, irisSize, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // Pupil
                    ctx.shadowBlur = 0;
                    const pupilSize = irisSize * 0.35;
                    const pupilGrad = ctx.createRadialGradient(0, irisY, 0, 0, irisY, pupilSize);
                    pupilGrad.addColorStop(0, `rgba(20, 15, 10, ${0.5 + openAmount * 0.3})`);
                    pupilGrad.addColorStop(1, `rgba(5, 3, 2, ${0.6 + openAmount * 0.3})`);
                    ctx.fillStyle = pupilGrad;
                    ctx.shadowColor = 'rgba(255, 200, 100, 0.05)';
                    ctx.shadowBlur = 10 * glowVal;
                    ctx.beginPath();
                    ctx.arc(0, irisY, pupilSize, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // Iris lines (radial)
                    ctx.shadowBlur = 0;
                    for (let i = 0; i < 12; i++) {
                        const angle = (i / 12) * Math.PI * 2 + time * 0.01;
                        const r1 = pupilSize * 1.2;
                        const r2 = irisSize * 0.9;
                        ctx.strokeStyle = `rgba(180, 140, 80, ${0.05 + openAmount * 0.1})`;
                        ctx.lineWidth = 0.5;
                        ctx.beginPath();
                        ctx.moveTo(Math.cos(angle) * r1, Math.sin(angle) * r1 + irisY);
                        ctx.lineTo(Math.cos(angle) * r2, Math.sin(angle) * r2 + irisY);
                        ctx.stroke();
                    }
                }
                
                // ---- Tear drop (below eye) ----
                if (openAmount > 0.1) {
                    const tearY = eyeY + eyeH * 0.7;
                    const tearSize = size * 0.06 * openAmount;
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = `rgba(200, 180, 150, ${0.05 + openAmount * 0.05})`;
                    ctx.beginPath();
                    ctx.moveTo(0, tearY);
                    ctx.quadraticCurveTo(tearSize * 2, tearY + tearSize * 2, 0, tearY + tearSize * 5);
                    ctx.quadraticCurveTo(-tearSize * 2, tearY + tearSize * 2, 0, tearY);
                    ctx.fill();
                }
                
                // ---- Decorative lines (Horus eye markings) ----
                ctx.shadowBlur = 0;
                ctx.strokeStyle = `rgba(200, 180, 150, ${0.05 + openAmount * 0.1})`;
                ctx.lineWidth = 1;
                
                // Top line
                ctx.beginPath();
                ctx.moveTo(-eyeW * 0.3, -eyeH * 0.5);
                ctx.lineTo(-eyeW * 0.1, -eyeH * 0.7);
                ctx.stroke();
                
                // Bottom line
                ctx.beginPath();
                ctx.moveTo(eyeW * 0.3, eyeH * 0.5);
                ctx.lineTo(eyeW * 0.1, eyeH * 0.7);
                ctx.stroke();
                
                // ---- Eye of Horus symbol (when open) ----
                if (openAmount > 0.5) {
                    const symbolAlpha = (openAmount - 0.5) * 0.4;
                    ctx.fillStyle = `rgba(200, 180, 150, ${symbolAlpha * 0.1})`;
                    ctx.font = '14px monospace';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'bottom';
                    const symbols = ['☥', '𓂀', '𓆣', '𓃥'];
                    for (let i = 0; i < 4; i++) {
                        const sx = -eyeW * 0.6 + i * eyeW * 0.4;
                        const sy = eyeY - eyeH * 1.2;
                        ctx.fillStyle = `rgba(200, 180, 150, ${symbolAlpha * 0.05})`;
                        ctx.font = '20px monospace';
                        ctx.fillText(symbols[i], sx, sy);
                    }
                }
                
                ctx.restore();
            }

            // ---- Draw Background ----
            function drawBackground() {
                const grad = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, W);
                grad.addColorStop(0, '#0d1a2a');
                grad.addColorStop(0.3, '#0a1520');
                grad.addColorStop(0.6, '#080e18');
                grad.addColorStop(0.8, '#060a12');
                grad.addColorStop(1, '#040608');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, W, H);
                
                // Subtle stars
                for (let i = 0; i < 30; i++) {
                    const x = (i * 137 + 20) % W;
                    const y = (i * 97 + 30) % (H * 0.6);
                    const size = 0.5 + (i % 3) * 0.5;
                    const twinkle = 0.3 + Math.sin(time * 0.015 + i * 2.5) * 0.3 + 0.3;
                    ctx.fillStyle = `rgba(200, 220, 255, ${twinkle * 0.3})`;
                    ctx.beginPath();
                    ctx.arc(x, y, size, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // ---- Render ----
            function render() {
                drawBackground();
                const glow = parseInt(glowSlider.value);
                drawEye(ctx, eyeOpen, glow);
                
                // Status info
                ctx.save();
                ctx.shadowBlur = 0;
                ctx.fillStyle = 'rgba(200, 220, 240, 0.15)';
                ctx.font = '13px monospace';
                ctx.textAlign = 'right';
                ctx.textBaseline = 'bottom';
                const status = isOpen ? '👁️ OPEN' : 
                              isOpening ? '🔄 OPENING...' : 
                              '🔮 CLOSED';
                ctx.fillText(status, W - 20, H - 10);
                ctx.restore();
            }

            // ---- Animation Loop ----
            function animate() {
                if (!isAnimating) {
                    requestAnimationFrame(animate);
                    return;
                }
                
                time += 0.01;
                
                // Smooth eye opening/closing
                const dt = 0.03 * (speed / 5);
                eyeOpen += (targetOpen - eyeOpen) * dt;
                
                // Update state
                if (Math.abs(eyeOpen - targetOpen) < 0.001) {
                    eyeOpen = targetOpen;
                    if (targetOpen === 1) {
                        isOpen = true;
                        isOpening = false;
                    } else {
                        isOpen = false;
                        isOpening = false;
                    }
                }
                
                render();
                
                requestAnimationFrame(animate);
            }

            // ---- Open Eye ----
            function openEye() {
                targetOpen = 1;
                isOpening = true;
                isOpen = false;
            }

            // ---- Close Eye ----
            function closeEye() {
                targetOpen = 0;
                isOpening = false;
                isOpen = false;
            }

            // ---- Reset ----
            function resetEye() {
                targetOpen = 0;
                eyeOpen = 0;
                isOpening = false;
                isOpen = false;
                time = 0;
            }

            // ---- Toggle Animation ----
            function toggleAnimation() {
                isAnimating = !isAnimating;
                toggleBtn.textContent = isAnimating ? '⏸️ PAUSE' : '▶️ PLAY';
            }

            // ---- Update Labels ----
            speedSlider.addEventListener('input', function() {
                speedLabel.textContent = this.value;
            });
            glowSlider.addEventListener('input', function() {
                glowLabel.textContent = this.value;
            });

            // ---- Event Listeners ----
            openBtn.addEventListener('click', openEye);
            closeBtn.addEventListener('click', closeEye);
            resetBtn.addEventListener('click', resetEye);
            toggleBtn.addEventListener('click', toggleAnimation);

            // ---- Keyboard Shortcuts ----
            document.addEventListener('keydown', function(e) {
                if (e.key === ' ' || e.key === 'Space') {
                    e.preventDefault();
                    if (eyeOpen < 0.5) {
                        openEye();
                    } else {
                        closeEye();
                    }
                }
                if (e.key === 'r' || e.key === 'R') {
                    resetEye();
                }
                if (e.key === 'p' || e.key === 'P') {
                    toggleAnimation();
                }
            });

            // ---- Initialize ----
            render();
            animate();

            console.log('👁️ Eye of Horus · Click Open or press Space to reveal the mystical eye!');
        })();
    </script>
</body>
</html>
