<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Geode Crack · geode cracks open to reveal crystals</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <div class="geode-container">
      <div class="geode-display" id="geodeDisplay">
        <!-- Canvas for geode -->
        <canvas id="geodeCanvas"></canvas>
        
        <!-- Geode Info -->
        <div class="geode-info">
          <span class="info-label">💎 Crystals</span>
          <span class="info-value" id="crystalCount">0</span>
        </div>

        <!-- Geode Controls -->
        <div class="geode-controls">
          <div class="control-group">
            <label class="control-label">🔮 Crack</label>
            <input type="range" class="control-slider" id="crackSlider" min="0" max="100" value="0">
            <span class="control-value" id="crackValue">0%</span>
          </div>
          <div class="control-group">
            <label class="control-label">💎 Crystal</label>
            <div class="crystal-options">
              <button class="crystal-btn active" data-crystal="amethyst" title="Amethyst">💜</button>
              <button class="crystal-btn" data-crystal="quartz" title="Quartz">🤍</button>
              <button class="crystal-btn" data-crystal="rose" title="Rose">💗</button>
              <button class="crystal-btn" data-crystal="citrine" title="Citrine">💛</button>
              <button class="crystal-btn" data-crystal="emerald" title="Emerald">💚</button>
            </div>
          </div>
        </div>

        <!-- Geode Text -->
        <div class="geode-text">
          <span class="text-label">💎 Geode</span>
          <span class="text-message" id="geodeMessage">Click to crack open the geode</span>
        </div>
      </div>
      
      <div class="geode-status">
        <span id="geodeStatus">🔮 Click the geode to reveal its crystals</span>
      </div>
    </div>

    <div class="controls">
      <button class="btn btn-crack" id="crackBtn">🔮 Crack Open</button>
      <button class="btn btn-reset" id="resetBtn">⟳ Reset</button>
    </div>
    <div class="footer-note">
      <span>💎 geode cracks · 5 crystal types · sparkle effects</span>
    </div>
  </div>

  <script>
    (function() {
      "use strict";

      // DOM refs
      const canvas = document.getElementById('geodeCanvas');
      const ctx = canvas.getContext('2d');
      const display = document.getElementById('geodeDisplay');
      const crystalCount = document.getElementById('crystalCount');
      const geodeStatus = document.getElementById('geodeStatus');
      const geodeMessage = document.getElementById('geodeMessage');
      const crackBtn = document.getElementById('crackBtn');
      const resetBtn = document.getElementById('resetBtn');
      const crackSlider = document.getElementById('crackSlider');
      const crackValue = document.getElementById('crackValue');
      const crystalBtns = document.querySelectorAll('.crystal-btn');

      // State
      let crack = 0; // 0-100
      let targetCrack = 0;
      let currentCrystal = 'amethyst';
      let particles = [];
      let animationId = null;
      let time = 0;
      let isCracked = false;

      // Crystal configurations
      const crystalData = {
        amethyst: { name: 'Amethyst', color: '#a78bfa', light: '#c4b5fd', dark: '#7c3aed', glow: 'rgba(167,139,250,0.3)' },
        quartz: { name: 'Quartz', color: '#e2e8f0', light: '#f1f5f9', dark: '#94a3b8', glow: 'rgba(226,232,240,0.3)' },
        rose: { name: 'Rose', color: '#f472b6', light: '#f9a8d4', dark: '#ec4899', glow: 'rgba(244,114,182,0.3)' },
        citrine: { name: 'Citrine', color: '#fbbf24', light: '#fcd34d', dark: '#f59e0b', glow: 'rgba(251,191,36,0.3)' },
        emerald: { name: 'Emerald', color: '#34d399', light: '#6ee7b7', dark: '#10b981', glow: 'rgba(52,211,153,0.3)' }
      };

      // Crystal particle class
      class CrystalParticle {
        constructor(x, y, type) {
          this.x = x || Math.random() * canvas.width;
          this.y = y || Math.random() * canvas.height;
          this.type = type || currentCrystal;
          const data = crystalData[this.type];
          this.color = data.color;
          this.light = data.light;
          this.dark = data.dark;
          this.size = 2 + Math.random() * 5;
          this.angle = Math.random() * Math.PI * 2;
          this.speed = 0.3 + Math.random() * 0.8;
          this.rotation = Math.random() * Math.PI * 2;
          this.rotationSpeed = (Math.random() - 0.5) * 0.02;
          this.phase = Math.random() * Math.PI * 2;
          this.life = 0.5 + Math.random() * 0.5;
          this.maxLife = this.life;
          this.opacity = 0.5 + Math.random() * 0.5;
          this.glow = 0.3 + Math.random() * 0.4;
          this.shape = Math.random() > 0.5 ? 'crystal' : 'sparkle';
          this.facets = 4 + Math.floor(Math.random() * 4);
        }

        update(crack) {
          const progress = crack / 100;
          this.phase += 0.02;
          
          // Move outward from center
          const moveSpeed = this.speed * progress * 0.5;
          this.x += Math.cos(this.angle) * moveSpeed;
          this.y += Math.sin(this.angle) * moveSpeed;
          
          // Wobble
          this.x += Math.sin(this.phase) * 0.1;
          this.y += Math.cos(this.phase * 0.7) * 0.1;
          
          this.rotation += this.rotationSpeed;
          this.life -= 0.002;
          
          // Keep within bounds
          if (this.x < -20) this.x = canvas.width + 20;
          if (this.x > canvas.width + 20) this.x = -20;
          if (this.y < -20) this.y = canvas.height + 20;
          if (this.y > canvas.height + 20) this.y = -20;
          
          return this.life > 0;
        }

        draw(ctx) {
          const alpha = (this.life / this.maxLife) * this.opacity;
          const size = this.size * (0.5 + (this.life / this.maxLife) * 0.5);
          
          ctx.save();
          ctx.globalAlpha = alpha;
          ctx.translate(this.x, this.y);
          ctx.rotate(this.rotation);
          
          // Glow
          const glowSize = size * 4 * this.glow;
          const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, glowSize);
          grad.addColorStop(0, this.color + '66');
          grad.addColorStop(0.3, this.color + '33');
          grad.addColorStop(1, 'rgba(0,0,0,0)');
          ctx.fillStyle = grad;
          ctx.shadowColor = this.color;
          ctx.shadowBlur = 15 * this.glow;
          ctx.beginPath();
          ctx.arc(0, 0, glowSize, 0, Math.PI * 2);
          ctx.fill();
          
          ctx.shadowBlur = 5 * this.glow;
          
          if (this.shape === 'crystal') {
            // Crystal shape - faceted
            ctx.beginPath();
            for (let i = 0; i < this.facets * 2; i++) {
              const angle = (i / (this.facets * 2)) * Math.PI * 2;
              const radius = i % 2 === 0 ? size : size * 0.5;
              const px = Math.cos(angle) * radius;
              const py = Math.sin(angle) * radius;
              if (i === 0) ctx.moveTo(px, py);
              else ctx.lineTo(px, py);
            }
            ctx.closePath();
            
            const grad2 = ctx.createRadialGradient(
              -size * 0.2, -size * 0.2, 0,
              0, 0, size
            );
            grad2.addColorStop(0, this.light);
            grad2.addColorStop(0.5, this.color);
            grad2.addColorStop(1, this.dark);
            ctx.fillStyle = grad2;
            ctx.fill();
            
            // Facet lines
            ctx.shadowBlur = 0;
            ctx.globalAlpha = alpha * 0.15;
            ctx.strokeStyle = this.light;
            ctx.lineWidth = 0.5;
            for (let i = 0; i < this.facets; i++) {
              const angle = (i / this.facets) * Math.PI * 2;
              ctx.beginPath();
              ctx.moveTo(0, 0);
              ctx.lineTo(Math.cos(angle) * size, Math.sin(angle) * size);
              ctx.stroke();
            }
          } else {
            // Sparkle shape (star)
            const points = 5;
            const outerRadius = size;
            const innerRadius = size * 0.4;
            ctx.beginPath();
            for (let i = 0; i < points * 2; i++) {
              const radius = i % 2 === 0 ? outerRadius : innerRadius;
              const angle = (i / (points * 2)) * Math.PI * 2 - Math.PI / 2;
              const px = Math.cos(angle) * radius;
              const py = Math.sin(angle) * radius;
              if (i === 0) ctx.moveTo(px, py);
              else ctx.lineTo(px, py);
            }
            ctx.closePath();
            
            const grad3 = ctx.createRadialGradient(
              -size * 0.2, -size * 0.2, 0,
              0, 0, size
            );
            grad3.addColorStop(0, this.light);
            grad3.addColorStop(0.5, this.color);
            grad3.addColorStop(1, this.dark);
            ctx.fillStyle = grad3;
            ctx.fill();
          }
          
          // Highlight
          ctx.shadowBlur = 0;
          ctx.globalAlpha = alpha * 0.15;
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(-size * 0.15, -size * 0.15, size * 0.2, 0, Math.PI * 2);
          ctx.fill();
          
          ctx.restore();
        }
      }

      // Draw geode
      function drawGeode(crack, type) {
        const w = canvas.width;
        const h = canvas.height;
        const cx = w / 2;
        const cy = h / 2;
        const data = crystalData[type];
        const progress = crack / 100;
        const radius = Math.min(w, h) * 0.3;
        
        // Background
        drawBackground();
        
        // Geode outer shell
        ctx.save();
        ctx.shadowColor = 'rgba(0,0,0,0.2)';
        ctx.shadowBlur = 20;
        ctx.shadowOffsetX = 3;
        ctx.shadowOffsetY = 3;
        
        // Shell gradient
        const shellGrad = ctx.createRadialGradient(cx - radius * 0.2, cy - radius * 0.2, 0, cx, cy, radius);
        shellGrad.addColorStop(0, '#6b5a4a');
        shellGrad.addColorStop(0.3, '#5a4a3a');
        shellGrad.addColorStop(0.7, '#4a3a2a');
        shellGrad.addColorStop(1, '#3a2a1a');
        ctx.fillStyle = shellGrad;
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.ellipse(cx, cy, radius, radius * 0.9, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
        
        // Shell texture
        for (let i = 0; i < 20; i++) {
          const angle = Math.random() * Math.PI * 2;
          const dist = Math.random() * radius * 0.8;
          const x = cx + Math.cos(angle) * dist;
          const y = cy + Math.sin(angle) * dist;
          const size = 2 + Math.random() * 5;
          ctx.fillStyle = `rgba(80, 60, 40, ${0.05 + Math.random() * 0.1})`;
          ctx.beginPath();
          ctx.ellipse(x, y, size, size * 0.5, Math.random() * Math.PI, 0, Math.PI * 2);
          ctx.fill();
        }
        
        // Crack opening
        if (progress > 0.05) {
          ctx.shadowBlur = 0;
          
          // Inner geode cavity
          const innerRadius = radius * (0.3 + progress * 0.3);
          const grad2 = ctx.createRadialGradient(cx, cy, 0, cx, cy, innerRadius);
          grad2.addColorStop(0, data.dark + '88');
          grad2.addColorStop(0.5, data.color + '44');
          grad2.addColorStop(1, 'rgba(0,0,0,0)');
          ctx.fillStyle = grad2;
          ctx.beginPath();
          ctx.ellipse(cx, cy, innerRadius, innerRadius * 0.8, 0, 0, Math.PI * 2);
          ctx.fill();
          
          // Crystal glow from inside
          if (progress > 0.3) {
            const glowGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, innerRadius * 1.2);
            glowGrad.addColorStop(0, data.glow);
            glowGrad.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = glowGrad;
            ctx.globalAlpha = progress * 0.5;
            ctx.beginPath();
            ctx.ellipse(cx, cy, innerRadius * 1.2, innerRadius * 1.0, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1;
          }
          
          // Crack lines
          ctx.strokeStyle = `rgba(60, 40, 20, ${0.1 + progress * 0.2})`;
          ctx.lineWidth = 1;
          for (let i = 0; i < 8; i++) {
            const angle = (i / 8) * Math.PI * 2 + Math.random() * 0.2;
            const startR = radius * 0.85;
            const endR = radius * (0.5 + Math.random() * 0.3);
            const startX = cx + Math.cos(angle) * startR;
            const startY = cy + Math.sin(angle) * startR;
            const endX = cx + Math.cos(angle + (Math.random() - 0.5) * 0.3) * endR;
            const endY = cy + Math.sin(angle + (Math.random() - 0.5) * 0.3) * endR;
            ctx.beginPath();
            ctx.moveTo(startX, startY);
            ctx.quadraticCurveTo(
              (startX + endX) / 2 + (Math.random() - 0.5) * 10,
              (startY + endY) / 2 + (Math.random() - 0.5) * 10,
              endX, endY
            );
            ctx.stroke();
          }
        }
        
        ctx.restore();
        
        // Draw crystals inside geode
        if (progress > 0.2) {
          const crystalCount = Math.floor(5 + progress * 20);
          const innerRadius = radius * (0.3 + progress * 0.3);
          
          for (let i = 0; i < Math.min(crystalCount, 25); i++) {
            const angle = Math.random() * Math.PI * 2;
            const dist = Math.random() * innerRadius * 0.8;
            const x = cx + Math.cos(angle) * dist;
            const y = cy + Math.sin(angle) * dist * 0.9;
            const size = 3 + Math.random() * 8 * (0.5 + progress * 0.5);
            
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(Math.random() * Math.PI * 2);
            
            // Crystal shape
            const grad3 = ctx.createRadialGradient(
              -size * 0.2, -size * 0.2, 0,
              0, 0, size
            );
            grad3.addColorStop(0, data.light);
            grad3.addColorStop(0.5, data.color);
            grad3.addColorStop(1, data.dark);
            ctx.fillStyle = grad3;
            ctx.shadowColor = data.color;
            ctx.shadowBlur = 10 * progress;
            
            const facets = 4 + Math.floor(Math.random() * 3);
            ctx.beginPath();
            for (let j = 0; j < facets * 2; j++) {
              const a = (j / (facets * 2)) * Math.PI * 2;
              const r = j % 2 === 0 ? size : size * 0.5;
              const px = Math.cos(a) * r;
              const py = Math.sin(a) * r;
              if (j === 0) ctx.moveTo(px, py);
              else ctx.lineTo(px, py);
            }
            ctx.closePath();
            ctx.fill();
            ctx.restore();
          }
        }
        
        // Update status
        if (crack > 90) {
          geodeStatus.textContent = '💎 Geode fully cracked! Crystals revealed! ✨';
          geodeStatus.style.color = '#fbbf24';
        } else if (crack > 40) {
          geodeStatus.textContent = '🔮 Geode cracking open... Crystals emerging';
          geodeStatus.style.color = '#818cf8';
        } else if (crack > 5) {
          geodeStatus.textContent = '🔮 Geode beginning to crack...';
          geodeStatus.style.color = '#94a3b8';
        } else {
          geodeStatus.textContent = '🔮 Click the geode to reveal its crystals';
          geodeStatus.style.color = '#94a3b8';
        }
        
        // Update button
        if (crack > 90) {
          crackBtn.textContent = '💎 Fully Cracked!';
          crackBtn.style.background = 'linear-gradient(135deg, #fbbf24, #f59e0b)';
          crackBtn.style.borderColor = '#fcd34d';
        } else if (crack > 5) {
          crackBtn.textContent = '🔮 Cracking...';
          crackBtn.style.background = 'linear-gradient(135deg, #818cf8, #6366f1)';
          crackBtn.style.borderColor = '#818cf8';
        } else {
          crackBtn.textContent = '🔮 Crack Open';
          crackBtn.style.background = 'linear-gradient(135deg, #6366f1, #4f46e5)';
          crackBtn.style.borderColor = '#818cf8';
        }
        
        crystalCount.textContent = particles.length;
      }

      // Draw background
      function drawBackground() {
        const w = canvas.width;
        const h = canvas.height;
        
        const grad = ctx.createRadialGradient(w/2, h/2, 0, w/2, h/2, w * 0.7);
        grad.addColorStop(0, 'rgba(10, 15, 25, 0.3)');
        grad.addColorStop(0.5, 'rgba(15, 20, 30, 0.4)');
        grad.addColorStop(1, 'rgba(5, 10, 20, 0.6)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, w, h);
      }

      // Create crystal particles
      function createCrystalParticles(count = 30) {
        const cx = canvas.width / 2;
        const cy = canvas.height / 2;
        const w = canvas.width;
        const h = canvas.height;
        
        for (let i = 0; i < count; i++) {
          const angle = Math.random() * Math.PI * 2;
          const dist = 20 + Math.random() * 60;
          const x = cx + Math.cos(angle) * dist;
          const y = cy + Math.sin(angle) * dist;
          const particle = new CrystalParticle(x, y, currentCrystal);
          particle.speed = 0.5 + Math.random() * 1.5;
          particle.life = 0.3 + Math.random() * 0.7;
          particle.maxLife = particle.life;
          particles.push(particle);
        }
      }

      // Resize canvas
      function resizeCanvas() {
        const rect = display.getBoundingClientRect();
        canvas.width = rect.width;
        canvas.height = rect.height;
        canvas.style.width = rect.width + 'px';
        canvas.style.height = rect.height + 'px';
      }

      // Update geode
      function updateGeode() {
        crack += (targetCrack - crack) * 0.05;
        crack = Math.max(0, Math.min(100, crack));
        
        // Generate particles as crack progresses
        if (crack > 10 && crack < 90 && Math.random() < 0.1) {
          createCrystalParticles(1);
        }
        
        // Clear particles when crack is low
        if (crack < 5) {
          particles = [];
        }
        
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawGeode(crack, currentCrystal);
        
        // Update and draw particles
        particles = particles.filter(p => {
          const alive = p.update(crack);
          if (alive) p.draw(ctx);
          return alive;
        });
        
        // Update crack display
        const percent = Math.round(crack);
        crackValue.textContent = percent + '%';
        crackSlider.value = crack;
      }

      // Animation loop
      function animate() {
        updateGeode();
        animationId = requestAnimationFrame(animate);
      }

      // Set crack
      function setCrack(value) {
        targetCrack = Math.max(0, Math.min(100, parseInt(value)));
        crackSlider.value = targetCrack;
        crackValue.textContent = Math.round(targetCrack) + '%';
      }

      // Toggle crack
      function toggleCrack() {
        if (crack > 80) {
          setCrack(0);
          particles = [];
          crackBtn.textContent = '🔮 Crack Open';
          crackBtn.style.background = 'linear-gradient(135deg, #6366f1, #4f46e5)';
          crackBtn.style.borderColor = '#818cf8';
          geodeStatus.textContent = '🔄 Reset complete';
          geodeStatus.style.color = '#94a3b8';
          setTimeout(() => {
            geodeStatus.textContent = '🔮 Click the geode to reveal its crystals';
            geodeStatus.style.color = '#94a3b8';
          }, 1000);
        } else {
          setCrack(100);
          createCrystalParticles(30);
        }
      }

      // Set crystal type
      function setCrystalType(type) {
        currentCrystal = type;
        crystalBtns.forEach(btn => {
          btn.classList.toggle('active', btn.dataset.crystal === type);
        });
        const data = crystalData[type];
        geodeStatus.textContent = `💎 Crystal: ${data.name}`;
        geodeStatus.style.color = data.color;
        if (crack > 20) {
          createCrystalParticles(10);
        }
        setTimeout(() => {
          if (crack < 10) {
            geodeStatus.textContent = '🔮 Click the geode to reveal its crystals';
            geodeStatus.style.color = '#94a3b8';
          }
        }, 1500);
      }

      // Reset
      function resetGeode() {
        setCrack(0);
        particles = [];
        crack = 0;
        targetCrack = 0;
        geodeStatus.textContent = '🔄 Reset complete';
        geodeStatus.style.color = '#94a3b8';
        geodeMessage.textContent = 'Click to crack open the geode';
        geodeMessage.style.color = '#94a3b8';
        setTimeout(() => {
          geodeStatus.textContent = '🔮 Click the geode to reveal its crystals';
          geodeStatus.style.color = '#94a3b8';
        }, 1000);
      }

      // Event listeners
      crackSlider.addEventListener('input', function() {
        setCrack(this.value);
      });

      crystalBtns.forEach(btn => {
        btn.addEventListener('click', function() {
          setCrystalType(this.dataset.crystal);
        });
      });

      if (crackBtn) {
        crackBtn.addEventListener('click', function(e) {
          e.preventDefault();
          toggleCrack();
        });
      }

      if (resetBtn) {
        resetBtn.addEventListener('click', function(e) {
          e.preventDefault();
          resetGeode();
        });
      }

      // Click on display to toggle
      display.addEventListener('click', function(e) {
        if (e.target === this || e.target === canvas) {
          toggleCrack();
        }
      });

      // Keyboard shortcuts
      document.addEventListener('keydown', function(e) {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

        const key = e.key;
        if (key === ' ' || key === 'Space') {
          e.preventDefault();
          toggleCrack();
        } else if (key === 'c' || key === 'C') {
          e.preventDefault();
          toggleCrack();
        } else if (key === 'r' || key === 'R') {
          e.preventDefault();
          resetGeode();
        }
      });

      // Resize
      window.addEventListener('resize', resizeCanvas);

      // Initialize
      resizeCanvas();
      animate();
      
      console.log('💎 Geode Crack ready · shortcuts: [Space/C] Crack, [R] Reset');
    })();
  </script>
</body>
</html>
