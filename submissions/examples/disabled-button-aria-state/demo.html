<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Disabled Button aria-disabled State vs Pointer Events Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Screen Reader Live Region for Dynamic Announcements -->
  <div 
    id="a11y-announcer" 
    class="sr-only" 
    role="status" 
    aria-live="polite" 
    aria-atomic="true"
  ></div>

  <main id="main-content" tabindex="-1">
    <h1>Accessible Disabled Button Pattern</h1>
    <p>
      Tab to the button below. Unlike native <code>disabled</code> buttons, this control remains 
      keyboard-focusable, announcing its state and explanatory help text to screen readers.
    </p>

    <form id="demo-form" novalidate>
      <div style="margin-bottom: 1.25rem;">
        <label for="terms-checkbox" style="display: inline-flex; align-items: center; gap: 0.5rem; cursor: pointer;">
          <input type="checkbox" id="terms-checkbox" style="width: 1.1rem; height: 1.1rem;">
          <span style="font-size: 0.9rem;">I agree to the Terms & Services</span>
        </label>
      </div>

      <!-- ACCESSIBLE DISABLED BUTTON -->
      <!-- Retains tab stop, uses aria-disabled, and points to aria-describedby explanation -->
      <button 
        type="submit" 
        id="submit-btn" 
        class="btn-accessible" 
        aria-disabled="true"
        aria-describedby="disabled-reason"
      >
        <span>Complete Registration</span>
      </button>

      <!-- Associated Explanatory Help Text -->
      <div id="disabled-reason" class="help-text" role="note">
        <span>⚠️ You must accept the Terms & Services to proceed.</span>
      </div>
    </form>
  </main>

  <script>
    // Accessible Disabled Button Interaction Manager
    document.addEventListener('DOMContentLoaded', () => {
      const checkbox = document.getElementById('terms-checkbox');
      const submitBtn = document.getElementById('submit-btn');
      const disabledReason = document.getElementById('disabled-reason');
      const announcer = document.getElementById('a11y-announcer');

      // Toggle aria-disabled state dynamically based on user input
      checkbox.addEventListener('change', () => {
        const isChecked = checkbox.checked;

        if (isChecked) {
          submitBtn.removeAttribute('aria-disabled');
          disabledReason.style.display = 'none';
          
          // Announce state change to screen readers
          announce('Registration button is now enabled.');
        } else {
          submitBtn.setAttribute('aria-disabled', 'true');
          disabledReason.style.display = 'flex';
          
          announce('Registration button is disabled. Terms must be accepted.');
        }
      });

      // Prevent submission if aria-disabled is true & provide feedback
      submitBtn.addEventListener('click', (e) => {
        if (submitBtn.getAttribute('aria-disabled') === 'true') {
          e.preventDefault();
          
          // Provide direct audible feedback when clicked/activated while disabled
          announce('Cannot submit: You must accept the Terms & Services first.');
          
          // Highlight checkbox to guide user
          checkbox.focus();
        } else {
          e.preventDefault();
          announce('Form submitted successfully!');
          alert('Form submitted successfully!');
        }
      });

      function announce(message) {
        announcer.textContent = '';
        setTimeout(() => {
          announcer.textContent = message;
        }, 50);
      }
    });
  </script>
</body>
</html>
