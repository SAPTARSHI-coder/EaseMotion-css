<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Accessible CSS-only checklist with collapsible subtasks"
  >

  <title>CSS Checklist with Subtasks</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="page">
    <section
      class="checklist-card"
      aria-labelledby="checklist-title"
    >

      <header class="checklist-header">
        <div>
          <p class="eyebrow">PROJECT PLANNER</p>

          <h1 id="checklist-title">
            Website Launch Checklist
          </h1>

          <p class="subtitle">
            Track major tasks and expand them to view subtasks.
          </p>
        </div>

        <div class="progress-summary" aria-label="Project progress">
          <span class="progress-value">75%</span>
          <span class="progress-label">Complete</span>
        </div>
      </header>


      <div class="progress-track" aria-hidden="true">
        <span class="progress-fill"></span>
      </div>


      <div class="task-list">

        <!-- TASK 1 -->
        <details class="task-group" open>
          <summary class="task-header">
            <span class="task-main">

              <input
                class="task-checkbox"
                type="checkbox"
                id="design-task"
                aria-label="Mark Design UI task as complete"
                checked
              >

              <span class="task-content">
                <strong>Design UI</strong>
                <small>4 subtasks</small>
              </span>

            </span>

            <span class="task-status completed">
              Complete
            </span>
          </summary>


          <div class="subtasks">

            <label class="subtask">
              <input type="checkbox" checked>
              <span>Define color palette</span>
            </label>

            <label class="subtask">
              <input type="checkbox" checked>
              <span>Create typography system</span>
            </label>

            <label class="subtask">
              <input type="checkbox" checked>
              <span>Design responsive layout</span>
            </label>

            <label class="subtask">
              <input type="checkbox" checked>
              <span>Prepare component states</span>
            </label>

          </div>
        </details>


        <!-- TASK 2 -->
        <details class="task-group" open>
          <summary class="task-header">
            <span class="task-main">

              <input
                class="task-checkbox"
                type="checkbox"
                id="development-task"
              >

              <span class="task-content">
                <strong>Development</strong>
                <small>4 subtasks</small>
              </span>

            </span>

            <span class="task-status progress">
              In Progress
            </span>
          </summary>


          <div class="subtasks">

            <label class="subtask">
              <input type="checkbox" checked>
              <span>Build HTML structure</span>
            </label>

            <label class="subtask">
              <input type="checkbox" checked>
              <span>Create CSS components</span>
            </label>

            <label class="subtask">
              <input type="checkbox">
              <span>Optimize responsive behavior</span>
            </label>

            <label class="subtask">
              <input type="checkbox">
              <span>Test accessibility</span>
            </label>

          </div>
        </details>


        <!-- TASK 3 -->
        <details class="task-group">
          <summary class="task-header">
            <span class="task-main">

              <input
                class="task-checkbox"
                type="checkbox"
                id="testing-task"
              >

              <span class="task-content">
                <strong>Testing</strong>
                <small>3 subtasks</small>
              </span>

            </span>

            <span class="task-status pending">
              Pending
            </span>
          </summary>


          <div class="subtasks">

            <label class="subtask">
              <input type="checkbox">
              <span>Cross-browser testing</span>
            </label>

            <label class="subtask">
              <input type="checkbox">
              <span>Keyboard navigation testing</span>
            </label>

            <label class="subtask">
              <input type="checkbox">
              <span>Mobile device testing</span>
            </label>

          </div>
        </details>


        <!-- TASK 4 -->
        <details class="task-group">
          <summary class="task-header">
            <span class="task-main">

              <input
                class="task-checkbox"
                type="checkbox"
                id="deployment-task"
              >

              <span class="task-content">
                <strong>Deployment</strong>
                <small>3 subtasks</small>
              </span>

            </span>

            <span class="task-status pending">
              Pending
            </span>
          </summary>


          <div class="subtasks">

            <label class="subtask">
              <input type="checkbox">
              <span>Configure production build</span>
            </label>

            <label class="subtask">
              <input type="checkbox">
              <span>Deploy application</span>
            </label>

            <label class="subtask">
              <input type="checkbox">
              <span>Verify production URL</span>
            </label>

          </div>
        </details>

      </div>

      <footer class="checklist-footer">
        <span>CSS-only component</span>
        <span>•</span>
        <span>No JavaScript required</span>
      </footer>

    </section>
  </main>

</body>
</html>
