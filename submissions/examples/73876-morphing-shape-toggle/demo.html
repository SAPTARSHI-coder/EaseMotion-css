<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Morphing Shape Toggle #73876 Demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #0f172a;
      margin: 0;
    }
  </style>
</head>
<body>

  <label class="morph-toggle-wrapper">
    <input type="checkbox" class="morph-toggle-input">
    <span class="morph-toggle-track">
      <span class="morph-toggle-thumb"></span>
    </span>
    <span class="morph-toggle-label">Morphing Shape</span>
  </label>

</body>
</html>
