<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Responsive CSS avatar group stack with overlapping users and overflow count."
  >
  <title>CSS Avatar Group Stack</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">
    <section class="avatar-card" aria-labelledby="team-title">

      <div class="card-heading">
        <div>
          <span class="eyebrow">Community</span>
          <h1 id="team-title">Project contributors</h1>
          <p>People collaborating on this project.</p>
        </div>

        <span class="member-count">12 members</span>
      </div>

      <div
        class="avatar-group"
        role="group"
        aria-label="Project contributors"
      >
        <div class="avatar" tabindex="0" aria-label="Aarav Sharma">
          AS
          <span class="status" aria-hidden="true"></span>
        </div>

        <div class="avatar avatar-purple" tabindex="0" aria-label="Maya Singh">
          MS
          <span class="status" aria-hidden="true"></span>
        </div>

        <div class="avatar avatar-orange" tabindex="0" aria-label="Rohan Mehta">
          RM
          <span class="status" aria-hidden="true"></span>
        </div>

        <div class="avatar avatar-pink" tabindex="0" aria-label="Priya Kapoor">
          PK
          <span class="status" aria-hidden="true"></span>
        </div>

        <div class="avatar avatar-green" tabindex="0" aria-label="Dev Patel">
          DP
          <span class="status" aria-hidden="true"></span>
        </div>

        <div
          class="avatar avatar-more"
          tabindex="0"
          aria-label="7 more project contributors"
        >
          +7
        </div>
      </div>

      <div class="team-meta">
        <span class="online-dot" aria-hidden="true"></span>
        <span>5 contributors online</span>
      </div>

    </section>
  </main>

</body>
</html>
