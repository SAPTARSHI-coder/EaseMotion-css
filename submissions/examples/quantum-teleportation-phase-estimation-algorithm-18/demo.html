<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Phase Estimation - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css"></head><body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030712; color: #ffffff;">

    <div class="ease-card ease-card-glass qpe-container">
        <div class="qpe-header">
            <h2>Phase Estimation</h2>
            <span class="ease-badge ease-badge-primary">Estimating</span>
        </div>
        
        <div class="qpe-screen ease-center">
            <div class="qpe-flux flux-qpe-a"></div>
            <div class="qpe-flux flux-qpe-b"></div>
            <div class="qpe-boundary-ring"></div>
            <div class="qpe-core ease-center"></div>
        </div>

        <div class="qpe-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Eigenvalue Phase: U|u&rang; = e^{2&pi;i&theta;}|u&rang;</span>
            <button class="ease-btn ease-btn-primary ease-btn-sm ease-hover-grow">Run QPE Algorithm</button>
        </div>
    </div></body></html>
