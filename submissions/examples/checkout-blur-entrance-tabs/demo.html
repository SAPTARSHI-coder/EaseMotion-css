<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Blur-Entrance Tabs</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="checkout-layout">
        <h2 class="section-title">Payment Method</h2>
        
        <div class="tabs-container">
            <input type="radio" name="tabs" id="tab1" class="tab-input" checked>
            <input type="radio" name="tabs" id="tab2" class="tab-input">
            <input type="radio" name="tabs" id="tab3" class="tab-input">
            
            <div class="tab-nav">
                <label for="tab1" class="tab-label">Card</label>
                <label for="tab2" class="tab-label">PayPal</label>
                <label for="tab3" class="tab-label">Crypto</label>
                <div class="active-indicator"></div>
            </div>
            
            <div class="tab-content-wrapper">
                <div class="tab-content content-1">
                    <h3>Credit / Debit Card</h3>
                    <p>Pay securely with Visa, Mastercard, or Amex. Your details are encrypted.</p>
                </div>
                
                <div class="tab-content content-2">
                    <h3>PayPal Express</h3>
                    <p>Fast checkout using your linked PayPal account or balance.</p>
                </div>
                
                <div class="tab-content content-3">
                    <h3>Cryptocurrency</h3>
                    <p>We accept Bitcoin, Ethereum, and major stablecoins. Web3 wallet required.</p>
                </div>
            </div>
        </div>
        
        <button class="checkout-btn">Proceed to Pay</button>
    </div>
</body>
</html>
