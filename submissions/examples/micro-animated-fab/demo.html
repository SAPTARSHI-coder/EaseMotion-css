<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Micro-Animated FAB Demo - EaseMotion CSS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="demo-wrapper">
        <section class="demo-content">
            <h1>Micro-Animated FAB Demo</h1>
            <p>Hover or click the floating action button below to trigger the smooth expanding action menu.</p>
        </section>

        <!-- Micro-Animated Floating Action Button Component -->
        <div class="fab-container">
            <div class="fab-menu">
                <button class="fab-action-btn">Share</button>
                <button class="fab-action-btn">Edit</button>
                <button class="fab-action-btn">Add</button>
            </div>
            <button class="fab-main-btn" aria-label="Open Actions Menu">+</button>
        </div>
    </main>
</body>
</html>
