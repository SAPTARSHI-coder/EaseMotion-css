<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radiant Score Display</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="scoreboard">
    <h1>Radiant Score Display</h1>
    <div class="score-container">
      <div class="score-box">
        <span class="label">Team A</span>
        <span class="score" id="scoreA">0</span>
      </div>
      <div class="score-box">
        <span class="label">Team B</span>
        <span class="score" id="scoreB">0</span>
      </div>
    </div>
    <div class="controls">
      <button onclick="updateScore('A')">+1 Team A</button>
      <button onclick="updateScore('B')">+1 Team B</button>
      <button onclick="resetScores()">Reset</button>
    </div>
  </div>

  <script>
    let scoreA = 0;
    let scoreB = 0;

    function updateScore(team) {
      if (team === 'A') {
        scoreA++;
        document.getElementById('scoreA').textContent = scoreA;
      } else {
        scoreB++;
        document.getElementById('scoreB').textContent = scoreB;
      }
    }

    function resetScores() {
      scoreA = 0;
      scoreB = 0;
      document.getElementById('scoreA').textContent = scoreA;
      document.getElementById('scoreB').textContent = scoreB;
    }
  </script>
</body>
</html>
