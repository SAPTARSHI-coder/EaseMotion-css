<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimalist Responsive Sidebar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Hidden Checkbox for Mobile Toggle (No JS required) -->
    <input type="checkbox" id="sidebar-toggle" class="sidebar-toggle">
    
    <div class="layout-wrapper">
        
        <!-- Sidebar Component -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <span class="brand">Minima</span>
                <!-- Mobile Close Button -->
                <label for="sidebar-toggle" class="close-btn" aria-label="Close sidebar">&times;</label>
            </div>
            
            <nav class="sidebar-nav">
                <a href="#" class="nav-item active">Dashboard</a>
                <a href="#" class="nav-item">Projects</a>
                <a href="#" class="nav-item">Team</a>
                <a href="#" class="nav-item">Calendar</a>
                <a href="#" class="nav-item">Documents</a>
                <a href="#" class="nav-item">Reports</a>
            </nav>
            
            <div class="sidebar-footer">
                <a href="#" class="nav-item">Settings</a>
                <a href="#" class="nav-item">Log out</a>
            </div>
        </aside>

        <!-- Overlay for Mobile -->
        <label for="sidebar-toggle" class="sidebar-overlay" aria-label="Close sidebar"></label>

        <!-- Main Content Area -->
        <main class="main-content">
            <!-- Mobile Toggle Button -->
            <label for="sidebar-toggle" class="menu-btn" aria-label="Open sidebar">
                &#9776; Menu
            </label>
            
            <header class="content-header">
                <h1>Dashboard Overview</h1>
            </header>
            
            <div class="content-body">
                <p>Welcome to the minimalist layout. Resize the window to see the responsive sidebar behavior.</p>
                
                <div class="card-grid">
                    <div class="card"></div>
                    <div class="card"></div>
                    <div class="card"></div>
                </div>
            </div>
        </main>
        
    </div>

</body>
</html>
