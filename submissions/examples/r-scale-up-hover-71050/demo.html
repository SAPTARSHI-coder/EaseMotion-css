<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Accessible CSS scale-up-on-hover animation demo"
  >
  <title>CSS Scale Up on Hover</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">
    <section class="hero" aria-labelledby="page-title">
      <p class="eyebrow">EaseMotion CSS</p>

      <h1 id="page-title">Scale Up on Hover</h1>

      <p class="intro">
        A smooth, responsive CSS-only interaction that scales an element
        on hover and keyboard focus with a soft shadow effect.
      </p>

      <div class="demo-grid">

        <a
          class="scale-card"
          href="#demo"
          aria-label="Explore the scale up card"
        >
          <span class="card-icon" aria-hidden="true">✦</span>
          <span class="card-content">
            <span class="card-title">Scale Up</span>
            <span class="card-text">
              Hover or focus this card
            </span>
          </span>
          <span class="card-arrow" aria-hidden="true">→</span>
        </a>

        <a
          class="scale-card accent"
          href="#demo"
          aria-label="Discover smooth CSS animation"
        >
          <span class="card-icon" aria-hidden="true">◆</span>
          <span class="card-content">
            <span class="card-title">Smooth Motion</span>
            <span class="card-text">
              Built entirely with CSS
            </span>
          </span>
          <span class="card-arrow" aria-hidden="true">→</span>
        </a>

        <a
          class="scale-card warm"
          href="#demo"
          aria-label="View responsive interaction"
        >
          <span class="card-icon" aria-hidden="true">●</span>
          <span class="card-content">
            <span class="card-title">Responsive</span>
            <span class="card-text">
              Works across screen sizes
            </span>
          </span>
          <span class="card-arrow" aria-hidden="true">→</span>
        </a>

      </div>
    </section>
  </main>

</body>
</html>
