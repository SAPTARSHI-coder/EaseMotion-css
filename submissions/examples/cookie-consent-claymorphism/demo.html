<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claymorphism Cookie Consent Banner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="content">
  <h1>Claymorphism UI Demo</h1>
  <p>
    This page showcases a glowing cookie consent banner inspired by the
    Claymorphism design trend using only HTML and CSS.
  </p>
</main>

<section class="cookie-banner">
  <div class="banner-text">
    <h2>🍪 We Value Your Privacy</h2>
    <p>
      We use cookies to personalize your experience and improve our services.
    </p>
  </div>

  <div class="banner-actions">
    <button class="btn secondary">Decline</button>
    <button class="btn primary">Accept</button>
  </div>
</section>

</body>
</html>
