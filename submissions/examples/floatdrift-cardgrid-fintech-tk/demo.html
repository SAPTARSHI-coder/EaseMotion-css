<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Float Drift Card Grid</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>Fintech Dashboard</h1>
    <p class="subtitle">
        CSS Float-Drift Card Grid for financial insights.
    </p>

    <div class="grid">

        <div class="card card1">
            <h2>Revenue</h2>
            <div class="value">$82,450</div>
            <p>Monthly earnings</p>
        </div>

        <div class="card card2">
            <h2>Expenses</h2>
            <div class="value">$29,180</div>
            <p>Operational costs</p>
        </div>

        <div class="card card3">
            <h2>Portfolio</h2>
            <div class="value">+18.4%</div>
            <p>Growth this month</p>
        </div>

        <div class="card card4">
            <h2>Investments</h2>
            <div class="value">24 Assets</div>
            <p>Active holdings</p>
        </div>

    </div>

</div>

</body>
</html>
