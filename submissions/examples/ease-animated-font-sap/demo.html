<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ease-animated-font-sap demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fafafa;
    }
  </style>
</head>
<body>

  <h1 class="animated-font-sap" id="waveText">EaseMotion</h1>

  <script>
    const el = document.getElementById('waveText');
    const text = el.textContent;
    el.textContent = '';

    [...text].forEach((ch, i) => {
      const span = document.createElement('span');
      span.className = 'af-char' + (ch === ' ' ? ' space' : '');
      span.textContent = ch === ' ' ? '\u00A0' : ch;
      span.style.animationDelay = `${i * 0.08}s`;
      el.appendChild(span);
    });
  </script>

</body>
</html>
