<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      Cyberpunk Custom Video Player Control Component (ease-cyber-video-player)
    </title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="demo-container">
      <header class="demo-header">
        <div class="header-badge">NEON HUD MEDIA CONTROL</div>
        <h1 class="demo-title">CYBERPUNK VIDEO PLAYER CONTROL</h1>
        <p class="demo-subtitle">
          Pure HTML + Vanilla CSS Cyberpunk HUD Control Interface without
          JavaScript
        </p>
      </header>

      <!-- Main Cyberpunk Video Player Stage & Control Surface -->
      <section class="player-showcase-card">
        <div class="ease-cyber-video-player">
          <!-- Cyber Video Canvas Stage -->
          <div class="ease-cyber-video-stage">
            <div class="cyber-scanline-overlay" aria-hidden="true"></div>

            <!-- Ambient HUD Status Badges -->
            <div class="hud-status-left">SYS.MATRIX // ONLINE</div>
            <div class="hud-status-right">SIGNAL // 1080P_RAW</div>

            <!-- Center Overlay Play Hexagon Button -->
            <button
              type="button"
              class="ease-cyber-center-play"
              aria-label="Play Cyber Video"
            >
              <svg
                class="play-icon"
                viewBox="0 0 24 24"
                width="32"
                height="32"
                aria-hidden="true"
                fill="currentColor"
              >
                <path d="M8 5v14l11-7z" />
              </svg>
            </button>
          </div>

          <!-- Cyberpunk Floating HUD Control Bar -->
          <div
            class="ease-cyber-control-bar"
            role="toolbar"
            aria-label="Cyberpunk Video Controls"
          >
            <!-- Neon Timeline Progress Slider -->
            <div class="ease-cyber-timeline-container">
              <label for="cyber-seek-range" class="sr-only"
                >Seek video timeline</label
              >
              <input
                type="range"
                id="cyber-seek-range"
                class="ease-cyber-seek-slider"
                min="0"
                max="100"
                value="62"
                aria-valuemin="0"
                aria-valuemax="100"
                aria-valuenow="62"
                aria-valuetext="03:42 of 08:15"
              />
            </div>

            <!-- Bottom Controls Row -->
            <div class="ease-cyber-controls-row">
              <!-- Left Controls: Play/Pause & Monospace Digital Time Readout -->
              <div class="controls-group-left">
                <button
                  type="button"
                  class="cyber-ctrl-btn play-pause-btn"
                  aria-label="Play / Pause"
                >
                  <svg
                    class="ctrl-icon"
                    viewBox="0 0 24 24"
                    width="20"
                    height="20"
                    aria-hidden="true"
                    fill="currentColor"
                  >
                    <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" />
                  </svg>
                </button>

                <div class="hud-time-readout" aria-label="Digital Time Elapsed">
                  <span class="hud-time-current">03:42</span>
                  <span class="hud-time-divider">//</span>
                  <span class="hud-time-duration">08:15</span>
                </div>
              </div>

              <!-- Right Controls: Volume, Resolution, Settings, Fullscreen -->
              <div class="controls-group-right">
                <!-- Volume Group with Slider Popup -->
                <div class="volume-control-wrapper">
                  <button
                    type="button"
                    class="cyber-ctrl-btn volume-btn"
                    aria-label="Volume / Mute"
                  >
                    <svg
                      class="ctrl-icon"
                      viewBox="0 0 24 24"
                      width="20"
                      height="20"
                      aria-hidden="true"
                      fill="currentColor"
                    >
                      <path
                        d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"
                      />
                    </svg>
                  </button>

                  <div class="volume-slider-popup">
                    <label for="cyber-volume-range" class="sr-only"
                      >Adjust Cyber Volume</label
                    >
                    <input
                      type="range"
                      id="cyber-volume-range"
                      class="ease-cyber-volume-slider"
                      min="0"
                      max="100"
                      value="85"
                      aria-label="Adjust Volume"
                    />
                  </div>
                </div>

                <!-- Quality Resolution Badge -->
                <button
                  type="button"
                  class="cyber-ctrl-btn quality-badge-btn"
                  aria-label="Resolution Quality"
                >
                  HD
                </button>

                <!-- Settings Gear Button -->
                <button
                  type="button"
                  class="cyber-ctrl-btn settings-btn"
                  aria-label="Cyberpunk Settings"
                >
                  <svg
                    class="ctrl-icon"
                    viewBox="0 0 24 24"
                    width="20"
                    height="20"
                    aria-hidden="true"
                    fill="currentColor"
                  >
                    <path
                      d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"
                    />
                  </svg>
                </button>

                <!-- Fullscreen Button -->
                <button
                  type="button"
                  class="cyber-ctrl-btn fullscreen-btn"
                  aria-label="Toggle Fullscreen"
                >
                  <svg
                    class="ctrl-icon"
                    viewBox="0 0 24 24"
                    width="20"
                    height="20"
                    aria-hidden="true"
                    fill="currentColor"
                  >
                    <path
                      d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"
                    />
                  </svg>
                </button>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- Demo Keyboard Instructions Footer -->
      <footer class="demo-footer">
        <div class="keyboard-instruction">
          <span class="type-key">TAB</span> Focus HUD controls &bull;
          <span class="type-key">CYAN FOCUS RING</span> High contrast neon focus
          &bull; <span class="type-key">REDUCED MOTION</span> Static HUD control
          bar
        </div>
      </footer>
    </main>
  </body>
</html>
